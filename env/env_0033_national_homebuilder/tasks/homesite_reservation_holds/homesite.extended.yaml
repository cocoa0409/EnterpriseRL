events:
  - type: homesite_reservation_created
    target: homesite_reservations
    mutation: create
    meaning: A buyer signs a Homesite Reservation Agreement on one lot; the reservation opens awaiting its funds.
    grain: One row per reservation agreement signed.
    fields:
      customer_id: The reserving buyer.
      variant_name: Premium class of the reserved homesite, the official tier name.
      status: Always pending_deposit on creation.
      community: Community the homesite lies in.
      lot_number: Site-plan lot number of the homesite, as printed on the plat.
      lot_premium: Lot premium of the homesite on the reservation date.
      occupancy_intent: Buyer's stated occupancy intent.
      reservation_channel: Where the reservation was placed.
      prequal_letter_date: Date printed on the lender pre-qualification letter on file.
      reserved_date: Reservation date.
      hold_expiry_date: Reservation date plus initial_hold_days.
      extensions_used: 0 on creation.
      swaps_used: 0 on creation.
      reinstatements_used: 0 on creation.
      funds_on_hand: 0.00 on creation.
    triggers: []
  - type: homesite_payment_received
    target: homesite_events
    meaning: Money from the buyer is received toward the reservation.
    grain: One row per payment item received, split by the component it pays.
    distinguish_by: [deposit_component, payment_reference]
    fields:
      amount: Amount received for this component, positive.
      deposit_component: Which charge or deposit the money pays.
      payment_method: How it was paid.
      payment_reference: Receipt number of the payment (the check number, ACH trace or wire confirmation printed on the receipt).
      event_date: Date the funds posted.
    account: reservation_funds
    direction: in
    triggers: []
  - type: homesite_hold_activated
    target: homesite_reservations
    mutation: {transition: {from: pending_deposit, to: held}}
    meaning: The required reservation funds are in, so the homesite is placed on hold for the buyer.
    grain: One row per transaction.
    fields:
      status: Becomes held.
    triggers: []
  - type: homesite_hold_extended
    target: homesite_reservations
    mutation: update
    meaning: The hold expiry date is pushed out by one extension.
    grain: One row per transaction.
    fields:
      hold_expiry_date: Previous hold expiry date plus extension_days.
      extensions_used: Incremented by one.
      prequal_letter_date: Date of the refreshed pre-qualification letter where one was required.
    triggers: []
  - type: homesite_lot_swapped
    target: homesite_reservations
    mutation: update
    meaning: The reservation is moved from one homesite to another available homesite.
    grain: One row per transaction.
    fields:
      community: Community of the new homesite.
      lot_number: Lot number of the new homesite.
      variant_name: Premium class of the new homesite.
      lot_premium: Lot premium of the new homesite on the swap date.
      swaps_used: Incremented by one.
    triggers: []
  - type: homesite_refund_issued
    target: homesite_events
    meaning: Money held on the reservation is refunded to the buyer.
    grain: One row per refunded component per source payment.
    distinguish_by: [source_payment_ref, deposit_component, refund_reason]
    fields:
      amount: Amount refunded, positive.
      deposit_component: Component being refunded.
      source_payment_ref: Receipt number of the original payment the refund returns.
      refund_reason: Why the money is refunded.
      refund_method: How the refund is returned.
      event_date: Date the refund is issued.
    account: reservation_funds
    direction: out
    triggers: []
  - type: homesite_funds_applied
    target: homesite_events
    meaning: Money held on the reservation moves to the buyer's new Home Purchase Agreement on conversion.
    grain: One row per component per source payment moved to the purchase agreement.
    distinguish_by: [source_payment_ref, deposit_component]
    fields:
      amount: Amount moved, positive.
      deposit_component: Component being moved.
      source_payment_ref: Receipt number of the original payment whose money moves.
      event_date: Date of conversion.
    account: reservation_funds
    direction: out
    triggers:
      - event: purchase:purchase_deposit_posted
        when: {deposit_component: reservation_deposit}
        map: {amount: amount, deposit_component: reservation_transfer, payment_method: internal_transfer, payment_reference: source_payment_ref, event_date: event_date}
      - event: purchase:purchase_deposit_posted
        when: {deposit_component: [premium_holding_fee, extension_fee]}
        map: {amount: amount, deposit_component: lot_premium_deposit, payment_method: internal_transfer, payment_reference: source_payment_ref, event_date: event_date}
  - type: homesite_funds_retained
    target: homesite_events
    meaning: A non-refundable portion of the money held is retained by Calloway.
    grain: One row per retained component per source payment.
    distinguish_by: [source_payment_ref, deposit_component]
    fields:
      amount: Amount retained, positive.
      deposit_component: Component being retained.
      source_payment_ref: Receipt number of the original payment whose money is retained.
      retention_reason: Why it is retained.
      event_date: Date of retention.
    account: reservation_funds
    direction: out
    triggers: []
  - type: homesite_payment_returned
    target: homesite_events
    meaning: A payment previously received is returned unpaid by the buyer's bank or card issuer.
    grain: One row per returned payment.
    distinguish_by: [source_payment_ref]
    fields:
      amount: Amount of the returned payment, positive.
      deposit_component: Component the returned payment had paid.
      source_payment_ref: Receipt number of the payment that was returned.
      event_date: Date Calloway was notified of the return.
    account: reservation_funds
    direction: out
    triggers: []
  - type: homesite_converted
    target: homesite_reservations
    mutation: {transition: {from: held, to: converted}}
    meaning: A Home Purchase Agreement is written on the held homesite and the reservation ends as converted.
    grain: One row per transaction.
    fields:
      status: Becomes converted.
      end_date: Conversion date.
    triggers:
      - event: homesite:homesite_funds_applied
        map: {event_date: end_date}
  - type: homesite_released
    target: homesite_reservations
    mutation: {transition: [{from: pending_deposit, to: released}, {from: held, to: released}]}
    meaning: The buyer releases the reservation in writing and the homesite returns to the market.
    grain: One row per transaction.
    fields:
      status: Becomes released.
      end_date: Date the signed release is received.
    triggers:
      - event: homesite:homesite_refund_issued
        map: {refund_reason: buyer_release}
  - type: homesite_expired
    target: homesite_reservations
    mutation: {transition: [{from: pending_deposit, to: expired}, {from: held, to: expired}]}
    meaning: The hold lapses (unfunded, past its expiry date, or uncured returned payment) and the homesite returns to the market.
    grain: One row per transaction.
    fields:
      status: Becomes expired.
      end_date: Date the hold lapsed.
    triggers: []
  - type: homesite_reinstated
    target: homesite_reservations
    mutation: {transition: {from: expired, to: held}}
    meaning: An expired hold is reinstated on the same homesite.
    grain: One row per transaction.
    fields:
      status: Becomes held.
      hold_expiry_date: Reinstatement date plus extension_days.
      reinstatements_used: Incremented by one.
      end_date: Cleared to empty.
    triggers: []
  - type: homesite_withdrawn
    target: homesite_reservations
    mutation: {transition: [{from: pending_deposit, to: withdrawn}, {from: held, to: withdrawn}]}
    meaning: Calloway withdraws the reserved homesite from sale (re-plat, engineering hold or model designation) and the reservation ends.
    grain: One row per transaction.
    fields:
      status: Becomes withdrawn.
      end_date: Withdrawal date.
    triggers:
      - event: homesite:homesite_refund_issued
        map: {refund_reason: builder_withdrawal}
  - type: homesite_notice_sent
    target: homesite_events
    meaning: A written reservation notice is sent to the buyer.
    grain: One row per notice per date.
    distinguish_by: [notice_type, event_date]
    fields:
      notice_type: Kind of notice.
      event_date: Date the notice was sent.
    triggers: []

measures:
  - id: homesite_msr_returned_payments
    window: Life of the reservation, from the reservation date to the frozen date.
    measure: Count of homesite_payment_returned rows on this reservation.
  - id: homesite_msr_recent_same_lot_end
    window: Trailing rereserve_same_lot_wait_days calendar days ending on the frozen date.
    measure: Count of this buyer's homesite_reservations rows in status released or expired with the same community and lot_number whose end_date falls inside the window.

policies:
  - id: homesite_agg_multi_holding
    subject: [homesite_reservation_created]
    rule: >-
      A buyer may hold several Homesite Reservations at once, up to max_per_customer reservations in
      status pending_deposit or held at the same time; converted, released, expired and withdrawn
      reservations do not count. The buyer's count of reservations in status pending_deposit or held is below max_per_customer before the new reservation is written.
      A new reservation that would exceed the cap is not written.
    eligibility:
      - id: open_reservation_cap
        applies_to: [homesite_reservation_created]
        kind: authorization
        condition: "The buyer's count of reservations in status pending_deposit or held is below max_per_customer before the new reservation is written."
        evidence_fields: [homesite_reservations.customer_id, homesite_reservations.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homesite_reservations.customer_id]
          action_bindings:
            homesite_reservations.customer_id: customer_id
    params:
      max_per_customer: 2

  - id: homesite_agg_community_premium_cap
    subject: [homesite_reservation_created, homesite_lot_swapped, homesite_reinstated]
    rule: >-
      Across a buyer's open reservations (status pending_deposit or held), no community may carry more
      than the max_holds_same_community of the class being reserved, and at most
      max_open_premium_holds of them may be Greenbelt Homesite, Water-View Homesite or Golf-Frontage
      Homesite. The check is made on the portfolio as it would stand after the write, so a swap into a
      community where the buyer already holds a homesite, or a second premium-class hold, is refused,
      while a swap that leaves the counts unchanged is allowed. Reinstating an expired hold counts as
      opening it again. The buyer's open reservations must leave room under these caps for the new or moved homesite.
    eligibility:
      - id: portfolio_room
        applies_to: [homesite_reservation_created, homesite_lot_swapped, homesite_reinstated]
        kind: authorization
        condition: "The buyer's open reservations must leave room under these caps for the new or moved homesite."
        evidence_fields: [homesite_reservations.customer_id, homesite_reservations.community, homesite_reservations.variant_name, homesite_reservations.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homesite_reservations.customer_id]
          action_bindings:
            homesite_reservations.customer_id: customer_id
    params:
      max_open_premium_holds: 1
      premium_classes: [Greenbelt Homesite, Water-View Homesite, Golf-Frontage Homesite]

  - id: homesite_reservation_admission
    subject: [homesite_reservation_created]
    rule: >-
      A homesite is reserved in the premium class the site plan assigns it, and the lot premium written
      must sit between the class's lot_premium_floor_usd and lot_premium_ceiling_usd. The reservation is written no later than prequal_letter_max_age_days calendar days after the date printed on the pre-qualification letter.
      The day after the letter date is day one and a reservation on the last counted day is accepted. An occupancy intent of investor is accepted only where investor_reservation_allowed is true and
      second_home only where second_home_allowed is true; owner_occupant is always accepted. A
      reservation placed through the online channel is accepted only where online_reservation_allowed
      is true; otherwise it must be placed at the sales center. A buyer who released or let expire a
      reservation on the same community and lot may reserve it again only where
      rereserve_after_expiry_allowed is true and homesite_msr_recent_same_lot_end is zero. The hold
      expiry date written is the reservation date plus initial_hold_days.
    eligibility:
      - id: prequal_age
        applies_to: [homesite_reservation_created]
        kind: time
        condition: "The reservation is written no later than prequal_letter_max_age_days calendar days after the date printed on the pre-qualification letter."
        evidence_fields: [homesite_reservations.prequal_letter_date, homesite_reservations.customer_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [homesite_reservations.customer_id]
          action_bindings:
            homesite_reservations.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date printed on the pre-qualification letter
          anchor_source: homesite_reservations.prequal_letter_date
          relation: not_after
          duration_source: variants.prequal_letter_max_age_days
          unit: calendar_days
          counting_rule: The day after the letter date is day one and a reservation on the last counted day is accepted
          boundary: inclusive
    formula:
      hold_expiry_offset_days: initial_hold_days
    measures: [homesite_msr_recent_same_lot_end]

  - id: homesite_deposit_collection
    subject: [homesite_payment_received, homesite_hold_activated, homesite_expired]
    rule: >-
      The required funds for a reservation are reservation_deposit_usd plus premium_holding_fee_usd of
      the class. Each payment must use a method listed in accepted_payment_methods; once the
      reservation has certified_funds_after_returns returned payments (homesite_msr_returned_payments),
      only wire or certified_funds are accepted. A card payment may not exceed card_payment_cap_usd and
      carries a card convenience fee of card_convenience_fee_pct of the card amount, rounded half up to
      the cent, booked as its own card_convenience_fee component; the convenience fee does not count
      toward the required funds and is never refunded. Payments are applied first to the reservation
      deposit and then to the premium holding fee. The hold is activated on the day the deposit and
      premium holding fee components together reach the required funds. The required funds must be received within deposit_due_days calendar days after the reservation date.
      Counting starts the day after the reservation date and the hold may be activated through the
      end of the last counted day; if the funds are not complete by then, the system expires the
      reservation and any partial funds are refunded under homesite_release_refund with reason
      hold_expired.
    eligibility:
      - id: funding_deadline
        applies_to: [homesite_hold_activated]
        kind: time
        condition: "The required funds must be received within deposit_due_days calendar days after the reservation date."
        evidence_fields: [homesite_reservations.reserved_date, homesite_events.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homesite_reservations.reserved_date]
          action_bindings:
            homesite_reservations.reserved_date: reserved_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the reservation date
          anchor_source: homesite_reservations.reserved_date
          relation: not_after
          duration_source: variants.deposit_due_days
          unit: calendar_days
          counting_rule: Counting starts the day after the reservation date and the hold may be activated through the end of the last counted day
          boundary: inclusive
    params:
      per_tier:
        Interior Homesite: {deposit: "=reservation_deposit_usd", premium_fee: "=premium_holding_fee_usd", due_days: "=deposit_due_days"}
        Corner Homesite: {deposit: "=reservation_deposit_usd", premium_fee: "=premium_holding_fee_usd", due_days: "=deposit_due_days"}
        Cul-de-Sac Homesite: {deposit: "=reservation_deposit_usd", premium_fee: "=premium_holding_fee_usd", due_days: "=deposit_due_days"}
        Greenbelt Homesite: {deposit: "=reservation_deposit_usd", premium_fee: "=premium_holding_fee_usd", due_days: "=deposit_due_days"}
        Water-View Homesite: {deposit: "=reservation_deposit_usd", premium_fee: "=premium_holding_fee_usd", due_days: "=deposit_due_days"}
        Golf-Frontage Homesite: {deposit: "=reservation_deposit_usd", premium_fee: "=premium_holding_fee_usd", due_days: "=deposit_due_days"}
    formula:
      required_funds: reservation_deposit_usd + premium_holding_fee_usd
      card_fee: round(amount * card_convenience_fee_pct / 100, 2)
    measures: [homesite_msr_returned_payments]

  - id: homesite_hold_extension
    subject: [homesite_hold_extended, homesite_payment_received]
    rule: >-
      A held homesite may be extended up to max_extensions times. Extensions are written only on a reservation whose status is held. Each extension adds extension_days
      calendar days to the current hold expiry date, and is refused if the new expiry date would be
      more than max_total_hold_days calendar days after the reservation date. The extension fee
      extension_fee_usd is collected as an extension_fee component before the extension is written;
      a fee of zero needs no payment. Where extension_requires_prequal_refresh is true, the
      pre-qualification letter on file must be no older than prequal_letter_max_age_days on the
      extension date, and the refreshed letter's date is written with the extension. A class with
      max_extensions of zero cannot be extended; the buyer must convert or let the hold expire.
    eligibility:
      - id: held_only
        applies_to: [homesite_hold_extended]
        kind: state
        condition: "Extensions are written only on a reservation whose status is held."
        evidence_fields: [homesite_reservations.status, homesite_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homesite_reservations.reservation_id]
          action_bindings:
            homesite_reservations.reservation_id: reservation_id
        state_contract:
          field: homesite_reservations.status
          allowed: [held]
    formula:
      new_hold_expiry_offset_days: extension_days
      extension_fee: extension_fee_usd

  - id: homesite_release_refund
    subject: [homesite_released, homesite_refund_issued, homesite_funds_retained]
    rule: >-
      A buyer ends a reservation only by signing the written release; the release date is the date the
      signed release is received. On release, the reservation deposit is refunded in full. A release is inside the full-refund window when the signed release is received within full_refund_window_days calendar days after the reservation date.
      Days are counted from the day after the reservation date, and a release received on the last
      counted day is inside the window. Inside the window the premium holding fee is refunded where
      premium_fee_refundable_within_window is true; after the window premium_fee_refund_pct_after_window
      percent of it is refunded (rounded half up to the cent) and the rest is retained. Extension,
      swap, reinstatement and returned-payment fees and card convenience fees are never refunded on a
      release and are retained. Refunds are issued by refund_method within
      refund_processing_business_days business days after the release date, one refund row per source
      payment and component, each pointing to the receipt number of the payment it returns. Funds on
      a hold Calloway withdraws from sale are handled by homesite_builder_withdrawal instead.
    eligibility:
      - id: full_refund_window
        applies_to: [homesite_refund_issued, homesite_funds_retained]
        kind: time
        condition: "A release is inside the full-refund window when the signed release is received within full_refund_window_days calendar days after the reservation date."
        evidence_fields: [homesite_reservations.reserved_date, homesite_reservations.end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homesite_reservations.reserved_date, homesite_reservations.end_date]
          action_bindings:
            homesite_reservations.reserved_date: reserved_date
            homesite_reservations.end_date: end_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the reservation date
          anchor_source: homesite_reservations.reserved_date
          relation: not_after
          duration_source: variants.full_refund_window_days
          unit: calendar_days
          counting_rule: Days are counted from the day after the reservation date, and a release received on the last counted day is inside the window
          boundary: inclusive
    formula:
      premium_fee_refund_after_window: round(premium_holding_fee_usd * premium_fee_refund_pct_after_window / 100, 2)

  - id: homesite_expiry_reinstatement
    subject: [homesite_expired, homesite_reinstated, homesite_refund_issued, homesite_funds_retained, homesite_notice_sent]
    rule: >-
      A held homesite lapses at the end of its hold expiry date and the system marks it expired the
      next day. A courtesy expiry reminder is sent expiry_notice_days_before calendar days before the
      hold expiry date. An expired hold may be reinstated on the same homesite at most
      max_reinstatements times, on payment of reinstatement_fee_usd as a reinstatement_fee component. Reinstatement must be requested within reinstatement_window_days calendar days after the date the hold expired.
      Counting starts the day after the expiry date and the last counted day is included. A
      reinstated hold runs extension_days calendar days from the reinstatement date. When the
      reinstatement window closes without reinstatement, and expired_deposit_auto_refund is true,
      the reservation deposit is refunded with reason hold_expired; the premium holding fee is retained
      where expired_premium_fee_retained is true and otherwise refunded; every fee component is
      retained.
    eligibility:
      - id: reinstatement_window
        applies_to: [homesite_reinstated]
        kind: time
        condition: "Reinstatement must be requested within reinstatement_window_days calendar days after the date the hold expired."
        evidence_fields: [homesite_reservations.end_date, homesite_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homesite_reservations.reservation_id]
          action_bindings:
            homesite_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the hold expired
          anchor_source: homesite_reservations.end_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: Counting starts the day after the expiry date and the last counted day is included
          boundary: inclusive
    formula:
      reinstated_hold_days: extension_days

  - id: homesite_lot_swap
    subject: [homesite_lot_swapped, homesite_payment_received, homesite_refund_issued]
    rule: >-
      A buyer may move a reservation to another available homesite up to max_lot_swaps times, of
      which the first free_lot_swaps carry no fee and each later swap costs lot_swap_fee_usd of the
      class being left, collected before the swap is written. A swap is allowed only on a reservation whose status is pending_deposit or held. A swap must be requested within lot_swap_window_days calendar days after the reservation date.
      Counting starts the day after the reservation date, and the last counted day is included. A
      swap into another community is allowed only where cross_community_swap_allowed is true for the
      class being left. The new homesite's class sets the required funds from the swap date: where they
      rise, the difference is due within deposit_due_days of the new class; where they fall and
      swap_down_deposit_refund is true, the difference is refunded with reason swap_down_difference.
      The hold expiry date is not changed by a swap where swap_resets_hold_clock is false.
    eligibility:
      - id: swap_state
        applies_to: [homesite_lot_swapped]
        kind: state
        condition: "A swap is allowed only on a reservation whose status is pending_deposit or held."
        evidence_fields: [homesite_reservations.status, homesite_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homesite_reservations.reservation_id]
          action_bindings:
            homesite_reservations.reservation_id: reservation_id
        state_contract:
          field: homesite_reservations.status
          allowed: [pending_deposit, held]
      - id: swap_window
        applies_to: [homesite_lot_swapped]
        kind: time
        condition: "A swap must be requested within lot_swap_window_days calendar days after the reservation date."
        evidence_fields: [homesite_reservations.reserved_date, homesite_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homesite_reservations.reservation_id]
          action_bindings:
            homesite_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the reservation date
          anchor_source: homesite_reservations.reserved_date
          relation: not_after
          duration_source: variants.lot_swap_window_days
          unit: calendar_days
          counting_rule: Counting starts the day after the reservation date, and the last counted day is included
          boundary: inclusive

  - id: homesite_conversion
    subject: [homesite_converted, homesite_funds_applied, homesite_funds_retained]
    rule: >-
      A reservation converts when a Home Purchase Agreement is written on the same community and lot
      for the same buyer while the hold is current. The reserved lot premium is honored only when the purchase agreement is written within lot_premium_protection_days calendar days after the reservation date.
      Counting starts the day after the reservation date and the last counted day is included;
      after that the lot premium on the current community price sheet applies. On conversion the
      reservation deposit moves to the purchase agreement as earnest money where
      deposit_applies_to_earnest_money is true; the premium holding fee moves as lot premium deposit
      where premium_fee_applies_to_lot_premium is true; paid extension fees move as lot premium deposit
      where extension_fee_creditable is true and are otherwise retained; swap, reinstatement and
      returned-payment fees and card convenience fees are retained. The purchase agreement then
      requires a non-refundable lot premium deposit of premium_deposit_pct_at_contract percent of the
      lot premium, rounded half up to the cent, toward which the moved premium holding fee and
      creditable extension fees count.
    eligibility:
      - id: premium_protection
        applies_to: [homesite_converted]
        kind: time
        condition: "The reserved lot premium is honored only when the purchase agreement is written within lot_premium_protection_days calendar days after the reservation date."
        evidence_fields: [homesite_reservations.reserved_date, homesite_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homesite_reservations.reservation_id]
          action_bindings:
            homesite_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the reservation date
          anchor_source: homesite_reservations.reserved_date
          relation: not_after
          duration_source: variants.lot_premium_protection_days
          unit: calendar_days
          counting_rule: Counting starts the day after the reservation date and the last counted day is included
          boundary: inclusive
    formula:
      lot_premium_deposit_due: round(lot_premium * premium_deposit_pct_at_contract / 100, 2)

  - id: homesite_returned_payment
    subject: [homesite_payment_returned, homesite_payment_received, homesite_expired]
    rule: >-
      When a payment is returned unpaid, the amount comes off the funds on hand and the
      returned_payment_fee_usd becomes due together with replacement funds. Replacement funds and the returned-payment fee must be received within returned_payment_cure_days calendar days after the date Calloway was notified of the return.
      Counting starts the day after the notification date and the last counted day is included. A
      held homesite whose returned payment is not cured in time is expired by the system on the day
      after the cure period, regardless of its hold expiry date. Once the reservation reaches
      certified_funds_after_returns returned payments, replacement funds must come by wire or
      certified_funds.
    eligibility:
      - id: cure_window
        applies_to: [homesite_payment_received]
        kind: time
        condition: "Replacement funds and the returned-payment fee must be received within returned_payment_cure_days calendar days after the date Calloway was notified of the return."
        evidence_fields: [homesite_events.event_date, homesite_events.source_payment_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homesite_events.source_payment_ref]
          action_bindings:
            homesite_events.source_payment_ref: source_payment_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the date Calloway was notified of the return
          anchor_source: homesite_events.event_date
          relation: not_after
          duration_source: variants.returned_payment_cure_days
          unit: calendar_days
          counting_rule: Counting starts the day after the notification date and the last counted day is included
          boundary: inclusive
    measures: [homesite_msr_returned_payments]

  - id: homesite_builder_withdrawal
    subject: [homesite_withdrawn, homesite_refund_issued, homesite_notice_sent]
    rule: >-
      Calloway may withdraw a reserved homesite from sale (a re-plat, an engineering hold or a model
      designation) only after sending the buyer a builder_withdrawal_notice. The homesite may be withdrawn only when at least builder_withdrawal_notice_days calendar days have passed since the withdrawal notice was sent.
      Counting starts the day after the notice date, and withdrawal is allowed on the last counted
      day. On withdrawal every dollar held on the reservation, fees included, is refunded with reason
      builder_withdrawal within builder_withdrawal_refund_business_days business days, and no fee is
      retained. A withdrawal does not count as a release or expiry for the same-lot wait in
      homesite_reservation_admission and does not count toward the open-reservation caps once written.
    eligibility:
      - id: withdrawal_notice_period
        applies_to: [homesite_withdrawn]
        kind: time
        condition: "The homesite may be withdrawn only when at least builder_withdrawal_notice_days calendar days have passed since the withdrawal notice was sent."
        evidence_fields: [homesite_events.event_date, homesite_events.notice_type, homesite_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [homesite_reservations.reservation_id]
          action_bindings:
            homesite_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the withdrawal notice was sent
          anchor_source: homesite_events.event_date
          relation: not_before
          duration_source: variants.builder_withdrawal_notice_days
          unit: calendar_days
          counting_rule: Counting starts the day after the notice date, and withdrawal is allowed on the last counted day
          boundary: inclusive

# ============================================================================
# extended_policies — homesite_reservation_holds (erl-task-instantiate)
# ============================================================================
extended_policies:
  - id: homesite_ext_activation_hold_term
    base_policy_refs: [homesite_deposit_collection, homesite_reservation_admission]
    overwrite:
      - base_policy: homesite_reservation_admission
        superseded_clause: >-
          The hold expiry date written is the reservation date plus initial_hold_days.
        replaced_by: >-
          The hold expiry date written at activation is the reservation date plus the activation hold term.
      - base_policy: homesite_deposit_collection
        superseded_clause: >-
          The hold is activated on the day the deposit and premium holding fee components together reach the required funds.
        replaced_by: >-
          The activation date is the day the activation is written, which can fall after the day the required funds became complete when the activation was not written that day.
    trigger: state_due
    subject: [homesite_hold_activated]
    computes: total_hold_days
    target_tool: activate_homesite_hold_ab3aff61
    params:
      activation_homeowner_bonus_days: 5
      activation_resale_owner_bonus_days: 2
      activation_chm_bonus_days: 2
      activation_other_lender_bonus_days: 1
      activation_fresh_letter_age_days: 30
      activation_stale_letter_age_days: 45
      activation_aging_letter_cut_days: 1
      activation_stale_letter_cut_days: 3
      activation_part_card_cut_days: 1
      activation_full_card_cut_days: 2
    rule: >-
      When the required funds of a reservation in status pending_deposit are complete, the hold is
      activated and the activation hold term is fixed: the number of calendar days from the
      reservation date to the hold expiry date written at activation. The activation date is the day the
      activation is written, which can fall after the day the required funds became complete when the
      activation was not written that day. The hold expiry date written at
      activation is the reservation date plus the activation hold term. The standard activation hold
      term counts the hold from the reservation date and runs initial_hold_days calendar days. The
      standard activation hold term is therefore initial_hold_days, and it is a whole number of days
      that needs no rounding. The activation hold term is worked out as the activation start offset
      plus the activation hold length plus the activation lender bonus, less the activation letter
      shortening and less the activation card shortening, all in whole calendar days; the sum is then
      held to at most max_total_hold_days, and no part of it is rounded. The day the required funds
      became complete is the latest posting date of a homesite_payment_received row with component
      reservation_deposit, or, where the class carries a premium holding fee above zero, the later of
      that date and the latest posting date of a homesite_payment_received row with component
      premium_holding_fee. The activation start offset is chosen by the day the required funds became
      complete: where they became complete on a day before the activation date, the hold is counted
      from the activation date and the activation start offset is the calendar days from the
      reservation date to the activation date; where they became complete on a day after the
      reservation date and the hold is activated that same day, the hold is counted from the
      completion date and the activation start offset is the calendar days from the reservation date
      to the completion date; otherwise the hold is counted from the reservation date and the
      activation start offset is zero. The activation hold length is initial_hold_days plus
      activation_homeowner_bonus_days for a buyer whose Calloway warranty coverage shows owner type
      original_buyer and status active, initial_hold_days plus activation_resale_owner_bonus_days for
      a buyer whose Calloway warranty coverage shows owner type subsequent_owner and status active, and
      initial_hold_days for every other buyer. The activation
      lender bonus is activation_chm_bonus_days for a buyer whose earlier Calloway purchase agreement
      stands closed with financing type calloway_home_mortgage, activation_other_lender_bonus_days for
      a buyer whose earlier Calloway purchase agreement stands closed with financing type
      outside_lender or cash, and zero for a buyer with no closed Calloway purchase agreement. The
      activation letter shortening is set by the age of the pre-qualification letter on the
      reservation date, counted in calendar days from the letter date to the reservation date: it is
      activation_stale_letter_cut_days where the letter was more than
      activation_stale_letter_age_days days old, activation_aging_letter_cut_days where it was more
      than activation_fresh_letter_age_days days old but no more than
      activation_stale_letter_age_days days old, and zero where it was
      activation_fresh_letter_age_days days old or less. The activation card shortening is set by how
      the reservation deposit was paid, summing the homesite_payment_received rows with component
      reservation_deposit: it is activation_full_card_cut_days where card payments make up the whole
      reservation deposit received, activation_part_card_cut_days where card payments make up part
      but not all of it, and zero where no part of it was paid by card; card convenience fees are
      their own component and never count as reservation deposit paid by card.
    prerequisite: []
    cross_category:
      - category: warranty
        as: branch
        reads: [owner_type, status]
        note: The activation hold length tier is decided by the owner type and status of the buyer's Calloway warranty coverage.
      - category: purchase
        as: branch
        reads: [financing_type, status]
        note: The activation lender bonus tier is decided by the financing type of the buyer's closed Calloway purchase agreement.
    compute:
      - dep_last_paid: "LATEST('homesite_events','event_date', event_type='homesite_payment_received', deposit_component='reservation_deposit')"
      - fee_last_paid: "LATEST('homesite_events','event_date', event_type='homesite_payment_received', deposit_component='premium_holding_fee')"
      - funds_completed_on: "dep_last_paid if P('premium_holding_fee_usd') == 0 else MX(dep_last_paid, fee_last_paid)"
      - start_offset: "DAYS(F('reserved_date'), NOW) if funds_completed_on < NOW else (DAYS(F('reserved_date'), funds_completed_on) if funds_completed_on > F('reserved_date') else 0)"
      - wty_owner: "CFIELD('warranty','owner_type')"
      - wty_status: "CFIELD('warranty','status')"
      - hold_length: "P('initial_hold_days') + K('activation_homeowner_bonus_days') if (wty_owner == 'original_buyer' and wty_status == 'active') else (P('initial_hold_days') + K('activation_resale_owner_bonus_days') if (wty_owner == 'subsequent_owner' and wty_status == 'active') else P('initial_hold_days'))"
      - prior_financing: "CFIELD('purchase','financing_type', status='closed')"
      - lender_bonus: "K('activation_chm_bonus_days') if prior_financing == 'calloway_home_mortgage' else (K('activation_other_lender_bonus_days') if (prior_financing == 'outside_lender' or prior_financing == 'cash') else 0)"
      - letter_age: "DAYS(F('prequal_letter_date'), F('reserved_date'))"
      - letter_cut: "K('activation_stale_letter_cut_days') if letter_age > K('activation_stale_letter_age_days') else (K('activation_aging_letter_cut_days') if letter_age > K('activation_fresh_letter_age_days') else 0)"
      - dep_paid_total: "SUM('homesite_events','amount', event_type='homesite_payment_received', deposit_component='reservation_deposit')"
      - dep_paid_card: "SUM('homesite_events','amount', event_type='homesite_payment_received', deposit_component='reservation_deposit', payment_method='card')"
      - card_cut: "K('activation_full_card_cut_days') if (dep_paid_card > 0 and dep_paid_card >= dep_paid_total) else (K('activation_part_card_cut_days') if dep_paid_card > 0 else 0)"
      - uncapped_term: "start_offset + hold_length + lender_bonus - letter_cut - card_cut"
      - result: "MN(uncapped_term, P('max_total_hold_days'))"
    compute_basis:
      dep_last_paid: "The day the required funds became complete is the latest posting date of a homesite_payment_received row with component reservation_deposit"
      fee_last_paid: "or, where the class carries a premium holding fee above zero, the later of that date and the latest posting date of a homesite_payment_received row with component premium_holding_fee."
      funds_completed_on: "The day the required funds became complete is the latest posting date of a homesite_payment_received row with component reservation_deposit, or, where the class carries a premium holding fee above zero, the later of that date and the latest posting date of a homesite_payment_received row with component premium_holding_fee."
      start_offset: "where they became complete on a day before the activation date, the hold is counted from the activation date and the activation start offset is the calendar days from the reservation date to the activation date; where they became complete on a day after the reservation date and the hold is activated that same day, the hold is counted from the completion date and the activation start offset is the calendar days from the reservation date to the completion date; otherwise the hold is counted from the reservation date and the activation start offset is zero."
      wty_owner: "for a buyer whose Calloway warranty coverage shows owner type original_buyer and status active"
      wty_status: "for a buyer whose Calloway warranty coverage shows owner type original_buyer and status active"
      hold_length: "The activation hold length is initial_hold_days plus activation_homeowner_bonus_days for a buyer whose Calloway warranty coverage shows owner type original_buyer and status active, initial_hold_days plus activation_resale_owner_bonus_days for a buyer whose Calloway warranty coverage shows owner type subsequent_owner and status active, and initial_hold_days for every other buyer."
      prior_financing: "The activation lender bonus is activation_chm_bonus_days for a buyer whose earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage"
      lender_bonus: "The activation lender bonus is activation_chm_bonus_days for a buyer whose earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage, activation_other_lender_bonus_days for a buyer whose earlier Calloway purchase agreement stands closed with financing type outside_lender or cash, and zero for a buyer with no closed Calloway purchase agreement."
      letter_age: "set by the age of the pre-qualification letter on the reservation date, counted in calendar days from the letter date to the reservation date"
      letter_cut: "it is activation_stale_letter_cut_days where the letter was more than activation_stale_letter_age_days days old, activation_aging_letter_cut_days where it was more than activation_fresh_letter_age_days days old but no more than activation_stale_letter_age_days days old, and zero where it was activation_fresh_letter_age_days days old or less."
      dep_paid_total: "summing the homesite_payment_received rows with component reservation_deposit"
      dep_paid_card: "card convenience fees are their own component and never count as reservation deposit paid by card."
      card_cut: "it is activation_full_card_cut_days where card payments make up the whole reservation deposit received, activation_part_card_cut_days where card payments make up part but not all of it, and zero where no part of it was paid by card"
      uncapped_term: "The activation hold term is worked out as the activation start offset plus the activation hold length plus the activation lender bonus, less the activation letter shortening and less the activation card shortening, all in whole calendar days"
      result: "the sum is then held to at most max_total_hold_days, and no part of it is rounded."
    factors:
      - id: activation_hold_start
        effect: method
        decides: start_offset
        bindings: [dep_last_paid, fee_last_paid, funds_completed_on, start_offset]
        ladder:
          - when: "the required funds became complete on a day before the activation date"
            method: "the hold is counted from the activation date: the activation start offset is the calendar days from the reservation date to the activation date"
          - when: "the required funds became complete on a day after the reservation date and the hold is activated that same day"
            method: "the hold is counted from the completion date: the activation start offset is the calendar days from the reservation date to the completion date"
          - when: "otherwise"
            method: "the hold is counted from the reservation date: the activation start offset is zero"
        baseline:
          start_offset: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: activation_hold_length
        effect: parameter
        decides: hold_length
        bindings: [wty_owner, wty_status, hold_length]
        ladder:
          - when: "the buyer's Calloway warranty coverage shows owner type original_buyer and status active"
            value: "P('initial_hold_days') + K('activation_homeowner_bonus_days')"
          - when: "the buyer's Calloway warranty coverage shows owner type subsequent_owner and status active"
            value: "P('initial_hold_days') + K('activation_resale_owner_bonus_days')"
          - when: "otherwise"
            value: "P('initial_hold_days')"
        baseline:
          hold_length: "P('initial_hold_days')"
        evidence: [cross_category]
        cross_difficulty: warranty
      - id: activation_lender_bonus
        effect: parameter
        decides: lender_bonus
        bindings: [prior_financing, lender_bonus]
        ladder:
          - when: "the buyer's earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage"
            value: "K('activation_chm_bonus_days')"
          - when: "the buyer's earlier Calloway purchase agreement stands closed with financing type outside_lender or cash"
            value: "K('activation_other_lender_bonus_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          lender_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: activation_letter_shortening
        effect: parameter
        decides: letter_cut
        bindings: [letter_age, letter_cut]
        ladder:
          - when: "the pre-qualification letter was more than activation_stale_letter_age_days days old on the reservation date"
            value: "K('activation_stale_letter_cut_days')"
          - when: "the letter was more than activation_fresh_letter_age_days but no more than activation_stale_letter_age_days days old on the reservation date"
            value: "K('activation_aging_letter_cut_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          letter_cut: "0"
        evidence: [date]
        cross_difficulty: null
      - id: activation_card_shortening
        effect: parameter
        decides: card_cut
        bindings: [dep_paid_total, dep_paid_card, card_cut]
        ladder:
          - when: "card payments make up the whole reservation deposit received"
            value: "K('activation_full_card_cut_days')"
          - when: "card payments make up part but not all of the reservation deposit received"
            value: "K('activation_part_card_cut_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          card_cut: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard activation hold term counts the hold from the reservation date and runs
        initial_hold_days calendar days. The standard activation hold term is therefore
        initial_hold_days, and it is a whole number of days that needs no rounding.
      params: [initial_hold_days]
    inputs:
      history:
        - {table: homesite_events, aggregate: latest, field: event_date, filters: {event_type: homesite_payment_received, deposit_component: reservation_deposit}}
        - {table: homesite_events, aggregate: latest, field: event_date, filters: {event_type: homesite_payment_received, deposit_component: premium_holding_fee}}
        - {table: homesite_events, aggregate: sum, field: amount, filters: {event_type: homesite_payment_received, deposit_component: reservation_deposit}}
      cross_category: [warranty, purchase]

  - id: homesite_ext_extension_fee_charge
    base_policy_refs: [homesite_deposit_collection, homesite_hold_extension, homesite_lot_swap, homesite_returned_payment]
    overwrite:
      - base_policy: homesite_hold_extension
        superseded_clause: >-
          The extension fee extension_fee_usd is collected as an extension_fee component before the extension is written
        replaced_by: >-
          The extension fee charged for an extension is received from the buyer as one homesite_payment_received row with component extension_fee, in the amount fixed below
    trigger: on_request
    subject: [homesite_payment_received]
    computes: amount
    target_tool: pay_hold_extension_fee_c522f05c
    params:
      fee_chm_rate_pct: 60
      fee_repeat_rate_pct: 80
      fee_part_card_surcharge_pct: 5
      fee_full_card_surcharge_pct: 10
      fee_early_booking_days: 7
      fee_prompt_booking_days: 4
      fee_early_booking_rate_pct: 50
      fee_prompt_booking_rate_pct: 75
      fee_long_tenure_months: 36
      fee_short_tenure_months: 12
      fee_monthly_credit_usd: 0.5
      fee_short_tenure_credit_usd: 10
    rule: >-
      The extension fee charged for an extension is received from the buyer as one
      homesite_payment_received row with component extension_fee, in the amount fixed below. The
      standard extension fee charged is extension_fee_usd of the reservation's class, charged as it
      stands, and a fee of zero needs no payment. The extension fee charged is worked out in four
      steps, in this order, each acting on the result of the step before it. First, the class fee
      extension_fee_usd is taken at the extension lender rate and rounded half up to the cent: the
      extension lender rate is fee_chm_rate_pct percent for a buyer whose earlier Calloway purchase
      agreement stands closed with financing type calloway_home_mortgage, fee_repeat_rate_pct percent
      for a buyer whose earlier Calloway purchase agreement stands closed with financing type
      outside_lender or cash, and one hundred percent for a buyer with no closed Calloway purchase
      agreement. Second, the extension card surcharge is added to the amount after the lender rate,
      as a percent of that amount, and the total is rounded half up to the cent: the extension card
      surcharge is fee_full_card_surcharge_pct percent where card payments make up the whole
      reservation deposit received, fee_part_card_surcharge_pct percent where card payments make up
      part but not all of it, and nothing where no part of it was paid by card, counting only the
      homesite_payment_received rows with component reservation_deposit. Third, that total is taken at
      the extension booking rate and rounded half up to the cent, the extension booking rate being
      set by the calendar days from today to the current hold expiry date: fee_early_booking_rate_pct
      percent where at least fee_early_booking_days days remain, fee_prompt_booking_rate_pct percent
      where at least fee_prompt_booking_days but fewer than fee_early_booking_days days remain, and one
      hundred percent where fewer than fee_prompt_booking_days days remain. Fourth, the extension
      homeowner credit is subtracted and the extension fee charged never falls below zero; the
      extension homeowner credit is worked out from the ownership start date on the buyer's Calloway
      warranty coverage, counted in whole calendar months before today: where it is at least
      fee_long_tenure_months months, the credit accrues by the month, fee_monthly_credit_usd for each
      whole calendar month of ownership, rounded half up to the cent; where it is at least
      fee_short_tenure_months but fewer than fee_long_tenure_months months, the credit is the flat
      amount fee_short_tenure_credit_usd; for any other buyer there is no credit.
    prerequisite: []
    cross_category:
      - category: purchase
        as: branch
        reads: [financing_type, status]
        note: The extension lender rate tier is decided by the financing type of the buyer's closed Calloway purchase agreement.
      - category: warranty
        as: branch
        reads: [ownership_start_date]
        note: The extension homeowner credit tier is decided by the months since the ownership start date on the buyer's Calloway warranty coverage.
    compute:
      - prior_financing: "CFIELD('purchase','financing_type', status='closed')"
      - lender_rate_pct: "K('fee_chm_rate_pct') if prior_financing == 'calloway_home_mortgage' else (K('fee_repeat_rate_pct') if (prior_financing == 'outside_lender' or prior_financing == 'cash') else 100)"
      - fee_after_rate: "RND(P('extension_fee_usd') * lender_rate_pct / 100, 2)"
      - dep_paid_total: "SUM('homesite_events','amount', event_type='homesite_payment_received', deposit_component='reservation_deposit')"
      - dep_paid_card: "SUM('homesite_events','amount', event_type='homesite_payment_received', deposit_component='reservation_deposit', payment_method='card')"
      - card_surcharge_pct: "K('fee_full_card_surcharge_pct') if (dep_paid_card > 0 and dep_paid_card >= dep_paid_total) else (K('fee_part_card_surcharge_pct') if dep_paid_card > 0 else 0)"
      - fee_with_surcharge: "RND(fee_after_rate * (100 + card_surcharge_pct) / 100, 2)"
      - days_to_expiry: "DAYS(NOW, F('hold_expiry_date'))"
      - booking_rate_pct: "K('fee_early_booking_rate_pct') if days_to_expiry >= K('fee_early_booking_days') else (K('fee_prompt_booking_rate_pct') if days_to_expiry >= K('fee_prompt_booking_days') else 100)"
      - fee_after_booking: "RND(fee_with_surcharge * booking_rate_pct / 100, 2)"
      - owner_since: "CFIELD('warranty','ownership_start_date')"
      - tenure_months: "MONTHS(owner_since, NOW) if owner_since else 0"
      - homeowner_credit: "RND(tenure_months * K('fee_monthly_credit_usd'), 2) if tenure_months >= K('fee_long_tenure_months') else (K('fee_short_tenure_credit_usd') if tenure_months >= K('fee_short_tenure_months') else 0)"
      - result: "MX(0, RND(fee_after_booking - homeowner_credit, 2))"
    compute_basis:
      prior_financing: "for a buyer whose earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage"
      lender_rate_pct: "the extension lender rate is fee_chm_rate_pct percent for a buyer whose earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage, fee_repeat_rate_pct percent for a buyer whose earlier Calloway purchase agreement stands closed with financing type outside_lender or cash, and one hundred percent for a buyer with no closed Calloway purchase agreement."
      fee_after_rate: "First, the class fee extension_fee_usd is taken at the extension lender rate and rounded half up to the cent"
      dep_paid_total: "counting only the homesite_payment_received rows with component reservation_deposit."
      dep_paid_card: "counting only the homesite_payment_received rows with component reservation_deposit."
      card_surcharge_pct: "the extension card surcharge is fee_full_card_surcharge_pct percent where card payments make up the whole reservation deposit received, fee_part_card_surcharge_pct percent where card payments make up part but not all of it, and nothing where no part of it was paid by card"
      fee_with_surcharge: "Second, the extension card surcharge is added to the amount after the lender rate, as a percent of that amount, and the total is rounded half up to the cent"
      days_to_expiry: "the extension booking rate being set by the calendar days from today to the current hold expiry date"
      booking_rate_pct: "fee_early_booking_rate_pct percent where at least fee_early_booking_days days remain, fee_prompt_booking_rate_pct percent where at least fee_prompt_booking_days but fewer than fee_early_booking_days days remain, and one hundred percent where fewer than fee_prompt_booking_days days remain."
      fee_after_booking: "Third, that total is taken at the extension booking rate and rounded half up to the cent"
      owner_since: "the extension homeowner credit is worked out from the ownership start date on the buyer's Calloway warranty coverage"
      tenure_months: "counted in whole calendar months before today"
      homeowner_credit: "where it is at least fee_long_tenure_months months, the credit accrues by the month, fee_monthly_credit_usd for each whole calendar month of ownership, rounded half up to the cent; where it is at least fee_short_tenure_months but fewer than fee_long_tenure_months months, the credit is the flat amount fee_short_tenure_credit_usd; for any other buyer there is no credit."
      result: "Fourth, the extension homeowner credit is subtracted and the extension fee charged never falls below zero"
    factors:
      - id: extension_lender_rate
        effect: parameter
        decides: lender_rate_pct
        bindings: [prior_financing, lender_rate_pct]
        ladder:
          - when: "the buyer's earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage"
            value: "K('fee_chm_rate_pct')"
          - when: "the buyer's earlier Calloway purchase agreement stands closed with financing type outside_lender or cash"
            value: "K('fee_repeat_rate_pct')"
          - when: "otherwise"
            value: "100"
        baseline:
          lender_rate_pct: "100"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: extension_card_surcharge
        effect: parameter
        decides: card_surcharge_pct
        bindings: [dep_paid_total, dep_paid_card, card_surcharge_pct]
        ladder:
          - when: "card payments make up the whole reservation deposit received"
            value: "K('fee_full_card_surcharge_pct')"
          - when: "card payments make up part but not all of the reservation deposit received"
            value: "K('fee_part_card_surcharge_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          card_surcharge_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: extension_booking_rate
        effect: parameter
        decides: booking_rate_pct
        bindings: [days_to_expiry, booking_rate_pct]
        ladder:
          - when: "at least fee_early_booking_days calendar days remain from today to the current hold expiry date"
            value: "K('fee_early_booking_rate_pct')"
          - when: "at least fee_prompt_booking_days but fewer than fee_early_booking_days calendar days remain"
            value: "K('fee_prompt_booking_rate_pct')"
          - when: "otherwise"
            value: "100"
        baseline:
          booking_rate_pct: "100"
        evidence: [date]
        cross_difficulty: null
      - id: extension_homeowner_credit
        effect: method
        decides: homeowner_credit
        bindings: [owner_since, tenure_months, homeowner_credit]
        ladder:
          - when: "the buyer's Calloway warranty coverage shows an ownership start date at least fee_long_tenure_months whole calendar months before today"
            method: "the credit accrues by the month: fee_monthly_credit_usd for each whole calendar month of ownership, rounded half up to the cent"
          - when: "the ownership start date is at least fee_short_tenure_months but fewer than fee_long_tenure_months whole calendar months before today"
            method: "the credit is the flat amount fee_short_tenure_credit_usd"
          - when: "otherwise"
            method: "no credit is given"
        baseline:
          homeowner_credit: "0"
        evidence: [cross_category, date]
        cross_difficulty: warranty
    baseline:
      rule: >-
        The standard extension fee charged is extension_fee_usd of the reservation's class, charged as
        it stands, and a fee of zero needs no payment.
      params: [extension_fee_usd]
    inputs:
      history:
        - {table: homesite_events, aggregate: sum, field: amount, filters: {event_type: homesite_payment_received, deposit_component: reservation_deposit}}
      cross_category: [purchase, warranty]

  - id: homesite_ext_extended_hold_term
    base_policy_refs: [homesite_hold_extension]
    overwrite:
      - base_policy: homesite_hold_extension
        superseded_clause: >-
          Each extension adds extension_days calendar days to the current hold expiry date, and is refused if the new expiry date would be more than max_total_hold_days calendar days after the reservation date.
        replaced_by: >-
          The extended hold term is the current hold term plus the extension length plus the extension early bonus, less the extension letter shortening and less the extension card shortening, all in whole calendar days; where that sum exceeds the extension maximum, the extended hold term is the extension maximum instead, and the extension is written at that term rather than refused.
    trigger: on_request
    subject: [homesite_hold_extended]
    computes: total_hold_days
    target_tool: extend_homesite_hold_1f65db7b
    params:
      ext_chm_length_days: 10
      ext_repeat_length_days: 8
      ext_early_request_days: 10
      ext_prompt_request_days: 5
      ext_early_bonus_days: 2
      ext_prompt_bonus_days: 1
      ext_aging_letter_age_days: 45
      ext_stale_letter_age_days: 60
      ext_aging_letter_cut_days: 1
      ext_stale_letter_cut_days: 2
      ext_part_card_cut_days: 1
      ext_full_card_cut_days: 2
      ext_owner_maximum_bonus_days: 6
      ext_resale_owner_maximum_bonus_days: 3
    rule: >-
      An extension pushes out the hold of a reservation, and the extended hold term is fixed: the
      number of calendar days from the reservation date to the hold expiry date written with the
      extension. The extended hold term is fixed only after the reservation has left the pending
      deposit status and stands in held status. Where the extension fee charged for an extension is above zero, the extension is not written until an extension fee payment for it stands on the reservation ledger. The current hold term is the calendar days
      from the reservation date to the current hold expiry date. The standard extension adds
      extension_days calendar days to the current hold term. The standard extended hold term may not
      exceed max_total_hold_days calendar days counted from the reservation date, and where the
      current hold term plus extension_days would exceed it, the standard extended hold term is
      max_total_hold_days. The extended hold term is the current hold term plus the extension length
      plus the extension early bonus, less the extension letter shortening and less the extension card
      shortening, all in whole calendar days; where that sum exceeds the extension maximum, the
      extended hold term is the extension maximum instead, and the extension is written at that term
      rather than refused. The extension maximum is the extension maximum offset plus the extension
      maximum level, in whole calendar days, and no part of the extended hold term is rounded. The
      extension length is ext_chm_length_days for a buyer whose earlier Calloway purchase agreement
      stands closed with financing type calloway_home_mortgage, ext_repeat_length_days for a buyer
      whose earlier Calloway purchase agreement stands closed with financing type outside_lender or
      cash, and extension_days for every other buyer. The extension early bonus is
      ext_early_bonus_days where at least ext_early_request_days calendar days remain from today to
      the current hold expiry date, ext_prompt_bonus_days where at least ext_prompt_request_days but
      fewer than ext_early_request_days days remain, and zero where fewer than
      ext_prompt_request_days days remain. The extension letter shortening is set by the age of the
      pre-qualification letter on the extension date, counted in calendar days from the letter date
      to today: ext_stale_letter_cut_days where the letter is more than ext_stale_letter_age_days days
      old, ext_aging_letter_cut_days where it is more than ext_aging_letter_age_days but no more than
      ext_stale_letter_age_days days old, and zero where it is ext_aging_letter_age_days days old or
      less. The extension card shortening is ext_full_card_cut_days where card payments make up the
      whole reservation deposit received, ext_part_card_cut_days where card payments make up part but
      not all of it, and zero where no part of it was paid by card, counting only the
      homesite_payment_received rows with component reservation_deposit. The extension maximum level
      is max_total_hold_days plus ext_owner_maximum_bonus_days for a buyer whose Calloway warranty
      coverage shows owner type original_buyer and status active, max_total_hold_days plus
      ext_resale_owner_maximum_bonus_days for a buyer whose Calloway warranty coverage shows owner type
      subsequent_owner and status active, and max_total_hold_days for every other buyer. The extension maximum offset sets the day from which the extension
      maximum is counted: where a homesite_payment_received row with component reinstatement_fee
      stands on the reservation, the extension maximum is counted from the latest posting date of
      such a row and the offset is the calendar days from the reservation date to that date; where no
      such row stands and the required funds became complete on a day after the reservation date,
      the extension maximum is counted from that completion day and the offset is the calendar days
      from the reservation date to it; otherwise the extension maximum is counted from the
      reservation date and the offset is zero. The day the required funds became complete is the
      latest posting date of a homesite_payment_received row with component reservation_deposit, or,
      where the class carries a premium holding fee above zero, the later of that date and the latest
      posting date of a homesite_payment_received row with component premium_holding_fee.
    prerequisite:
      - problem: homesite_ext_activation_hold_term
        kind: value_input
        gate: current_term
        form: state
        policy_source: >-
          The extended hold term is fixed only after the reservation has left the pending deposit status and stands in held status.
        condition: >-
          homesite_reservations.status of the reservation is held, reached from pending_deposit.
        resolved_by: activate_homesite_hold_ab3aff61
        effect: >-
          Once the hold is activated, the reservation stands in held status and its hold expiry date is the reservation date plus the activation hold term, so the current hold term binding (and with it the extension early bonus) takes the activation hold term instead of the term written when the reservation was created.
      - problem: homesite_ext_extension_fee_charge
        kind: state_gate
        gate: homesite_events.deposit_component
        form: state
        policy_source: >-
          Where the extension fee charged for an extension is above zero, the extension is not written until an extension fee payment for it stands on the reservation ledger.
        condition: >-
          Where the extension fee charged is above zero, a homesite_events row of event_type homesite_payment_received with deposit_component extension_fee, posted for this extension, stands on the reservation.
        resolved_by: pay_hold_extension_fee_c522f05c
        effect: >-
          Once the buyer's extension fee payment posts, the reservation ledger carries the extension_fee payment the extension waits on, and the extension may be written.
    cross_category:
      - category: purchase
        as: branch
        reads: [financing_type, status]
        note: The extension length tier is decided by the financing type of the buyer's closed Calloway purchase agreement.
      - category: warranty
        as: branch
        reads: [owner_type, status]
        note: The extension maximum level tier is decided by the owner type and status of the buyer's Calloway warranty coverage.
    compute:
      - current_term: "DAYS(F('reserved_date'), F('hold_expiry_date'))"
      - prior_financing: "CFIELD('purchase','financing_type', status='closed')"
      - extension_length: "K('ext_chm_length_days') if prior_financing == 'calloway_home_mortgage' else (K('ext_repeat_length_days') if (prior_financing == 'outside_lender' or prior_financing == 'cash') else P('extension_days'))"
      - days_to_expiry: "DAYS(NOW, F('hold_expiry_date'))"
      - early_bonus: "K('ext_early_bonus_days') if days_to_expiry >= K('ext_early_request_days') else (K('ext_prompt_bonus_days') if days_to_expiry >= K('ext_prompt_request_days') else 0)"
      - letter_age_now: "DAYS(F('prequal_letter_date'), NOW)"
      - letter_cut: "K('ext_stale_letter_cut_days') if letter_age_now > K('ext_stale_letter_age_days') else (K('ext_aging_letter_cut_days') if letter_age_now > K('ext_aging_letter_age_days') else 0)"
      - dep_paid_total: "SUM('homesite_events','amount', event_type='homesite_payment_received', deposit_component='reservation_deposit')"
      - dep_paid_card: "SUM('homesite_events','amount', event_type='homesite_payment_received', deposit_component='reservation_deposit', payment_method='card')"
      - card_cut: "K('ext_full_card_cut_days') if (dep_paid_card > 0 and dep_paid_card >= dep_paid_total) else (K('ext_part_card_cut_days') if dep_paid_card > 0 else 0)"
      - extended_sum: "current_term + extension_length + early_bonus - letter_cut - card_cut"
      - wty_owner: "CFIELD('warranty','owner_type')"
      - wty_status: "CFIELD('warranty','status')"
      - maximum_level: "P('max_total_hold_days') + K('ext_owner_maximum_bonus_days') if (wty_owner == 'original_buyer' and wty_status == 'active') else (P('max_total_hold_days') + K('ext_resale_owner_maximum_bonus_days') if (wty_owner == 'subsequent_owner' and wty_status == 'active') else P('max_total_hold_days'))"
      - reinstated_on: "LATEST('homesite_events','event_date', event_type='homesite_payment_received', deposit_component='reinstatement_fee')"
      - dep_last_paid: "LATEST('homesite_events','event_date', event_type='homesite_payment_received', deposit_component='reservation_deposit')"
      - fee_last_paid: "LATEST('homesite_events','event_date', event_type='homesite_payment_received', deposit_component='premium_holding_fee')"
      - funds_completed_on: "dep_last_paid if P('premium_holding_fee_usd') == 0 else MX(dep_last_paid, fee_last_paid)"
      - maximum_offset: "DAYS(F('reserved_date'), reinstated_on) if reinstated_on else (DAYS(F('reserved_date'), funds_completed_on) if funds_completed_on > F('reserved_date') else 0)"
      - extension_maximum: "maximum_offset + maximum_level"
      - result: "MN(extended_sum, extension_maximum)"
    compute_basis:
      current_term: "The current hold term is the calendar days from the reservation date to the current hold expiry date."
      prior_financing: "for a buyer whose earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage"
      extension_length: "The extension length is ext_chm_length_days for a buyer whose earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage, ext_repeat_length_days for a buyer whose earlier Calloway purchase agreement stands closed with financing type outside_lender or cash, and extension_days for every other buyer."
      days_to_expiry: "calendar days remain from today to the current hold expiry date"
      early_bonus: "The extension early bonus is ext_early_bonus_days where at least ext_early_request_days calendar days remain from today to the current hold expiry date, ext_prompt_bonus_days where at least ext_prompt_request_days but fewer than ext_early_request_days days remain, and zero where fewer than ext_prompt_request_days days remain."
      letter_age_now: "set by the age of the pre-qualification letter on the extension date, counted in calendar days from the letter date to today"
      letter_cut: "ext_stale_letter_cut_days where the letter is more than ext_stale_letter_age_days days old, ext_aging_letter_cut_days where it is more than ext_aging_letter_age_days but no more than ext_stale_letter_age_days days old, and zero where it is ext_aging_letter_age_days days old or less."
      dep_paid_total: "counting only the homesite_payment_received rows with component reservation_deposit."
      dep_paid_card: "counting only the homesite_payment_received rows with component reservation_deposit."
      card_cut: "The extension card shortening is ext_full_card_cut_days where card payments make up the whole reservation deposit received, ext_part_card_cut_days where card payments make up part but not all of it, and zero where no part of it was paid by card"
      extended_sum: "The extended hold term is the current hold term plus the extension length plus the extension early bonus, less the extension letter shortening and less the extension card shortening, all in whole calendar days"
      wty_owner: "for a buyer whose Calloway warranty coverage shows owner type original_buyer and status active"
      wty_status: "for a buyer whose Calloway warranty coverage shows owner type original_buyer and status active"
      maximum_level: "The extension maximum level is max_total_hold_days plus ext_owner_maximum_bonus_days for a buyer whose Calloway warranty coverage shows owner type original_buyer and status active, max_total_hold_days plus ext_resale_owner_maximum_bonus_days for a buyer whose Calloway warranty coverage shows owner type subsequent_owner and status active, and max_total_hold_days for every other buyer."
      reinstated_on: "where a homesite_payment_received row with component reinstatement_fee stands on the reservation, the extension maximum is counted from the latest posting date of such a row"
      dep_last_paid: "The day the required funds became complete is the latest posting date of a homesite_payment_received row with component reservation_deposit"
      fee_last_paid: "or, where the class carries a premium holding fee above zero, the later of that date and the latest posting date of a homesite_payment_received row with component premium_holding_fee."
      funds_completed_on: "The day the required funds became complete is the latest posting date of a homesite_payment_received row with component reservation_deposit, or, where the class carries a premium holding fee above zero, the later of that date and the latest posting date of a homesite_payment_received row with component premium_holding_fee."
      maximum_offset: "where a homesite_payment_received row with component reinstatement_fee stands on the reservation, the extension maximum is counted from the latest posting date of such a row and the offset is the calendar days from the reservation date to that date; where no such row stands and the required funds became complete on a day after the reservation date, the extension maximum is counted from that completion day and the offset is the calendar days from the reservation date to it; otherwise the extension maximum is counted from the reservation date and the offset is zero."
      extension_maximum: "The extension maximum is the extension maximum offset plus the extension maximum level, in whole calendar days"
      result: "where that sum exceeds the extension maximum, the extended hold term is the extension maximum instead, and the extension is written at that term rather than refused."
    factors:
      - id: extension_length
        effect: parameter
        decides: extension_length
        bindings: [prior_financing, extension_length]
        ladder:
          - when: "the buyer's earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage"
            value: "K('ext_chm_length_days')"
          - when: "the buyer's earlier Calloway purchase agreement stands closed with financing type outside_lender or cash"
            value: "K('ext_repeat_length_days')"
          - when: "otherwise"
            value: "P('extension_days')"
        baseline:
          extension_length: "P('extension_days')"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: extension_early_bonus
        effect: parameter
        decides: early_bonus
        bindings: [days_to_expiry, early_bonus]
        ladder:
          - when: "at least ext_early_request_days calendar days remain from today to the current hold expiry date"
            value: "K('ext_early_bonus_days')"
          - when: "at least ext_prompt_request_days but fewer than ext_early_request_days calendar days remain"
            value: "K('ext_prompt_bonus_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          early_bonus: "0"
        evidence: [date]
        cross_difficulty: null
      - id: extension_letter_shortening
        effect: parameter
        decides: letter_cut
        bindings: [letter_age_now, letter_cut]
        ladder:
          - when: "the pre-qualification letter is more than ext_stale_letter_age_days days old on the extension date"
            value: "K('ext_stale_letter_cut_days')"
          - when: "the letter is more than ext_aging_letter_age_days but no more than ext_stale_letter_age_days days old on the extension date"
            value: "K('ext_aging_letter_cut_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          letter_cut: "0"
        evidence: [date]
        cross_difficulty: null
      - id: extension_card_shortening
        effect: parameter
        decides: card_cut
        bindings: [dep_paid_total, dep_paid_card, card_cut]
        ladder:
          - when: "card payments make up the whole reservation deposit received"
            value: "K('ext_full_card_cut_days')"
          - when: "card payments make up part but not all of the reservation deposit received"
            value: "K('ext_part_card_cut_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          card_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: extension_maximum_level
        effect: parameter
        decides: maximum_level
        bindings: [wty_owner, wty_status, maximum_level]
        ladder:
          - when: "the buyer's Calloway warranty coverage shows owner type original_buyer and status active"
            value: "P('max_total_hold_days') + K('ext_owner_maximum_bonus_days')"
          - when: "the buyer's Calloway warranty coverage shows owner type subsequent_owner and status active"
            value: "P('max_total_hold_days') + K('ext_resale_owner_maximum_bonus_days')"
          - when: "otherwise"
            value: "P('max_total_hold_days')"
        baseline:
          maximum_level: "P('max_total_hold_days')"
        evidence: [cross_category]
        cross_difficulty: warranty
      - id: extension_maximum_start
        effect: method
        decides: maximum_offset
        bindings: [reinstated_on, dep_last_paid, fee_last_paid, funds_completed_on, maximum_offset]
        ladder:
          - when: "a reinstatement_fee payment stands on the reservation"
            method: "the extension maximum is counted from the latest reinstatement_fee posting date: the offset is the calendar days from the reservation date to that date"
          - when: "no reinstatement_fee payment stands on the reservation and the required funds became complete on a day after the reservation date"
            method: "the extension maximum is counted from the completion day: the offset is the calendar days from the reservation date to it"
          - when: "otherwise"
            method: "the extension maximum is counted from the reservation date: the offset is zero"
        baseline:
          maximum_offset: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The current hold term is the calendar days from the reservation date to the current hold
        expiry date. The standard extension adds extension_days calendar days to the current hold
        term. The standard extended hold term may not exceed max_total_hold_days calendar days counted
        from the reservation date, and where the current hold term plus extension_days would exceed
        it, the standard extended hold term is max_total_hold_days.
      params: [extension_days, max_total_hold_days]
    inputs:
      history:
        - {table: homesite_events, aggregate: sum, field: amount, filters: {event_type: homesite_payment_received, deposit_component: reservation_deposit}}
        - {table: homesite_events, aggregate: latest, field: event_date, filters: {event_type: homesite_payment_received, deposit_component: reinstatement_fee}}
        - {table: homesite_events, aggregate: latest, field: event_date, filters: {event_type: homesite_payment_received, deposit_component: premium_holding_fee}}
      cross_category: [purchase, warranty]

  - id: homesite_ext_reinstatement_fee_charge
    base_policy_refs: [homesite_deposit_collection, homesite_hold_extension, homesite_lot_swap, homesite_returned_payment, homesite_expiry_reinstatement]
    overwrite:
      - base_policy: homesite_expiry_reinstatement
        superseded_clause: >-
          on payment of reinstatement_fee_usd as a reinstatement_fee component
        replaced_by: >-
          The reinstatement fee charged for reinstating an expired hold is received as one homesite_payment_received row with component reinstatement_fee, in the amount fixed below
    trigger: on_request
    subject: [homesite_payment_received]
    computes: amount
    target_tool: record_reinstatement_fee_fa042025
    params:
      reinst_chm_discount_pct: 40
      reinst_repeat_discount_pct: 15
      reinst_part_card_surcharge_pct: 5
      reinst_full_card_surcharge_pct: 10
      reinst_second_day_surcharge_pct: 25
      reinst_later_day_surcharge_pct: 50
    rule: >-
      The reinstatement fee charged for reinstating an expired hold is received as one
      homesite_payment_received row with component reinstatement_fee, in the amount fixed below. The
      standard reinstatement fee charged is reinstatement_fee_usd of the reservation's class, charged
      as it stands. The reinstatement fee charged is worked out in three steps, in this order, each
      acting on the result of the step before it. First, the reinstatement lender discount is taken
      off the class fee reinstatement_fee_usd and the result is rounded half up to the cent: the
      reinstatement lender discount is reinst_chm_discount_pct percent for a buyer whose earlier
      Calloway purchase agreement stands closed with financing type calloway_home_mortgage,
      reinst_repeat_discount_pct percent for a buyer whose earlier Calloway purchase agreement stands
      closed with financing type outside_lender or cash, and nothing for a buyer with no closed
      Calloway purchase agreement. Second, the reinstatement card surcharge and the reinstatement
      timing surcharge are added together into one surcharge percent, that combined percent is applied
      once to the amount after the lender discount, and the total is rounded half up to the cent; the
      two surcharges do not act one after the other. The reinstatement card surcharge is
      reinst_full_card_surcharge_pct percent where card payments make up the whole reservation deposit
      received on the expired hold, reinst_part_card_surcharge_pct percent where card payments make up
      part but not all of it, and nothing where no part of it was paid by card, counting only the
      homesite_payment_received rows with component reservation_deposit. The reinstatement timing
      surcharge is set by the calendar days from the date the hold expired to today: nothing when the
      reinstatement is taken on the first day after the hold expired, reinst_second_day_surcharge_pct
      percent on the second day, and reinst_later_day_surcharge_pct percent on the third day or later.
      Third, the reinstatement reminder method is applied to that total, judged by the courtesy
      expiry reminders on the reservation ledger (homesite_notice_sent rows with notice type
      expiry_reminder): where no expiry reminder was sent, the total is charged pro rata, multiplied by
      the calendar days from the date the hold expired to today and divided by
      reinstatement_window_days, and rounded half up to the cent; where the latest expiry reminder was
      sent fewer than expiry_notice_days_before calendar days before the hold expiry date, the total
      is halved and rounded up to the next cent; where it was sent expiry_notice_days_before or more
      calendar days before the hold expiry date, the total is charged as it stands.
    prerequisite: []
    cross_category:
      - category: purchase
        as: branch
        reads: [financing_type, status]
        note: The reinstatement lender discount tier is decided by the financing type of the buyer's closed Calloway purchase agreement.
    compute:
      - prior_financing: "CFIELD('purchase','financing_type', status='closed')"
      - lender_discount_pct: "K('reinst_chm_discount_pct') if prior_financing == 'calloway_home_mortgage' else (K('reinst_repeat_discount_pct') if (prior_financing == 'outside_lender' or prior_financing == 'cash') else 0)"
      - fee_after_discount: "RND(P('reinstatement_fee_usd') * (100 - lender_discount_pct) / 100, 2)"
      - dep_paid_total: "SUM('homesite_events','amount', event_type='homesite_payment_received', deposit_component='reservation_deposit')"
      - dep_paid_card: "SUM('homesite_events','amount', event_type='homesite_payment_received', deposit_component='reservation_deposit', payment_method='card')"
      - card_surcharge_pct: "K('reinst_full_card_surcharge_pct') if (dep_paid_card > 0 and dep_paid_card >= dep_paid_total) else (K('reinst_part_card_surcharge_pct') if dep_paid_card > 0 else 0)"
      - days_since_lapse: "DAYS(F('end_date'), NOW)"
      - timing_surcharge_pct: "K('reinst_later_day_surcharge_pct') if days_since_lapse >= 3 else (K('reinst_second_day_surcharge_pct') if days_since_lapse == 2 else 0)"
      - fee_with_surcharge: "RND(fee_after_discount * (100 + card_surcharge_pct + timing_surcharge_pct) / 100, 2)"
      - reminders_sent: "COUNT('homesite_events', event_type='homesite_notice_sent', notice_type='expiry_reminder')"
      - reminder_on: "LATEST('homesite_events','event_date', event_type='homesite_notice_sent', notice_type='expiry_reminder')"
      - reminder_lead: "DAYS(reminder_on, F('hold_expiry_date')) if reminders_sent > 0 else -1"
      - half_cents: "RND(fee_with_surcharge * 100, 6) / 2"
      - fee_after_reminder: "RND(fee_with_surcharge * days_since_lapse / P('reinstatement_window_days'), 2) if reminders_sent == 0 else ((int(half_cents) + (1 if half_cents > int(half_cents) else 0)) / 100 if reminder_lead < P('expiry_notice_days_before') else fee_with_surcharge)"
      - result: "fee_after_reminder"
    compute_basis:
      prior_financing: "for a buyer whose earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage"
      lender_discount_pct: "the reinstatement lender discount is reinst_chm_discount_pct percent for a buyer whose earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage, reinst_repeat_discount_pct percent for a buyer whose earlier Calloway purchase agreement stands closed with financing type outside_lender or cash, and nothing for a buyer with no closed Calloway purchase agreement."
      fee_after_discount: "First, the reinstatement lender discount is taken off the class fee reinstatement_fee_usd and the result is rounded half up to the cent"
      dep_paid_total: "counting only the homesite_payment_received rows with component reservation_deposit."
      dep_paid_card: "counting only the homesite_payment_received rows with component reservation_deposit."
      card_surcharge_pct: "The reinstatement card surcharge is reinst_full_card_surcharge_pct percent where card payments make up the whole reservation deposit received on the expired hold, reinst_part_card_surcharge_pct percent where card payments make up part but not all of it, and nothing where no part of it was paid by card"
      days_since_lapse: "The reinstatement timing surcharge is set by the calendar days from the date the hold expired to today"
      timing_surcharge_pct: "nothing when the reinstatement is taken on the first day after the hold expired, reinst_second_day_surcharge_pct percent on the second day, and reinst_later_day_surcharge_pct percent on the third day or later."
      fee_with_surcharge: "Second, the reinstatement card surcharge and the reinstatement timing surcharge are added together into one surcharge percent, that combined percent is applied once to the amount after the lender discount, and the total is rounded half up to the cent; the two surcharges do not act one after the other."
      reminders_sent: "judged by the courtesy expiry reminders on the reservation ledger (homesite_notice_sent rows with notice type expiry_reminder)"
      reminder_on: "where the latest expiry reminder was sent fewer than expiry_notice_days_before calendar days before the hold expiry date"
      reminder_lead: "where the latest expiry reminder was sent fewer than expiry_notice_days_before calendar days before the hold expiry date"
      half_cents: "the total is halved and rounded up to the next cent"
      fee_after_reminder: "where no expiry reminder was sent, the total is charged pro rata, multiplied by the calendar days from the date the hold expired to today and divided by reinstatement_window_days, and rounded half up to the cent; where the latest expiry reminder was sent fewer than expiry_notice_days_before calendar days before the hold expiry date, the total is halved and rounded up to the next cent; where it was sent expiry_notice_days_before or more calendar days before the hold expiry date, the total is charged as it stands."
      result: "Third, the reinstatement reminder method is applied to that total"
    factors:
      - id: reinstatement_lender_discount
        effect: parameter
        decides: lender_discount_pct
        bindings: [prior_financing, lender_discount_pct]
        ladder:
          - when: "the buyer's earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage"
            value: "K('reinst_chm_discount_pct')"
          - when: "the buyer's earlier Calloway purchase agreement stands closed with financing type outside_lender or cash"
            value: "K('reinst_repeat_discount_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          lender_discount_pct: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: reinstatement_card_surcharge
        effect: parameter
        decides: card_surcharge_pct
        bindings: [dep_paid_total, dep_paid_card, card_surcharge_pct]
        ladder:
          - when: "card payments make up the whole reservation deposit received on the expired hold"
            value: "K('reinst_full_card_surcharge_pct')"
          - when: "card payments make up part but not all of the reservation deposit received on the expired hold"
            value: "K('reinst_part_card_surcharge_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          card_surcharge_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: reinstatement_timing_surcharge
        effect: parameter
        decides: timing_surcharge_pct
        bindings: [days_since_lapse, timing_surcharge_pct]
        ladder:
          - when: "the reinstatement is taken on the third day or later after the hold expired"
            value: "K('reinst_later_day_surcharge_pct')"
          - when: "the reinstatement is taken on the second day after the hold expired"
            value: "K('reinst_second_day_surcharge_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          timing_surcharge_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: reinstatement_reminder_method
        effect: method
        decides: fee_after_reminder
        bindings: [reminders_sent, reminder_on, reminder_lead, half_cents, fee_after_reminder]
        ladder:
          - when: "no courtesy expiry reminder was sent on the reservation"
            method: "the total is charged pro rata: multiplied by the calendar days from the expiry date to today, divided by reinstatement_window_days, rounded half up to the cent"
          - when: "the latest expiry reminder was sent fewer than expiry_notice_days_before calendar days before the hold expiry date"
            method: "the total is halved and rounded up to the next cent"
          - when: "otherwise"
            method: "the total is charged as it stands"
        baseline:
          fee_after_reminder: "fee_with_surcharge"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard reinstatement fee charged is reinstatement_fee_usd of the reservation's class,
        charged as it stands.
      params: [reinstatement_fee_usd]
    inputs:
      history:
        - {table: homesite_events, aggregate: sum, field: amount, filters: {event_type: homesite_payment_received, deposit_component: reservation_deposit}}
        - {table: homesite_events, aggregate: count, filters: {event_type: homesite_notice_sent, notice_type: expiry_reminder}}
        - {table: homesite_events, aggregate: latest, field: event_date, filters: {event_type: homesite_notice_sent, notice_type: expiry_reminder}}
      cross_category: [purchase]

  - id: homesite_ext_release_premium_refund
    base_policy_refs: [homesite_release_refund, homesite_expiry_reinstatement, homesite_lot_swap, homesite_builder_withdrawal, homesite_conversion]
    overwrite:
      - base_policy: homesite_release_refund
        superseded_clause: >-
          A release is inside the full-refund window when the signed release is received within full_refund_window_days calendar days after the reservation date.
        replaced_by: >-
          A release is inside the full-refund window when the signed release is received within full_refund_window_days calendar days after the window start, the window start being the later of the reservation date and the day the required funds became complete.
      - base_policy: homesite_release_refund
        superseded_clause: >-
          after the window premium_fee_refund_pct_after_window percent of it is refunded (rounded half up to the cent) and the rest is retained.
        replaced_by: >-
          After the window, the premium holding fee release refund is the premium holding fee received less the release forfeit, and the release forfeit is retained with retention reason premium_fee_after_window.
      - base_policy: homesite_release_refund
        superseded_clause: >-
          Days are counted from the day after the reservation date, and a release received on the last counted day is inside the window.
        replaced_by: >-
          Days are counted from the day after the window start, and a release received on the last counted day is inside the window.
    trigger: on_request
    subject: [homesite_released, homesite_refund_issued, homesite_funds_retained]
    computes: premium_fee_refund
    target_tool: sign_homesite_release_13bc71ff
    params:
      release_owner_refund_pct: 75
      release_resale_owner_refund_pct: 60
      release_chm_bonus_pct: 10
      release_repeat_bonus_pct: 5
      release_quick_grace_days: 2
      release_late_grace_days: 5
      release_quick_grace_pct: 15
      release_late_grace_pct: 5
    rule: >-
      The buyer's signed release of a held homesite is recorded together with the refunds it
      triggers and the share of the premium holding fee Calloway keeps, and the premium holding fee
      release refund is fixed as follows. The reservation deposit received is refunded in full, one
      refund per source payment. A release is inside the full-refund window when the signed release is
      received within full_refund_window_days calendar days after the window start, the window start
      being the later of the reservation date and the day the required funds became complete. Days
      are counted from the day after the window start, and a release received on the last counted day
      is inside the window. The day the required funds became complete is the latest posting date of
      a homesite_payment_received row with component reservation_deposit, or, where the class carries
      a premium holding fee above zero, the later of that date and the latest posting date of a
      homesite_payment_received row with component premium_holding_fee. Inside the window the premium
      holding fee received is refunded in full where premium_fee_refundable_within_window is true; where
      it is false, the release is settled as one after the window. After the window, the premium holding fee release
      refund is the premium holding fee received less the release forfeit, and the release forfeit is
      retained with retention reason premium_fee_after_window. The standard premium holding fee
      release refund after the window is premium_fee_refund_pct_after_window percent of the premium
      holding fee received, rounded half up to the cent, and the rest of the premium holding fee is
      the release forfeit. The release refund percent after the window is the release loyalty percent
      plus the release lender bonus plus the release grace bonus, never more than one hundred percent;
      the refundable share is the premium holding fee received times that percent, rounded half up to
      the cent, and the unadjusted forfeit is the premium holding fee received less the refundable
      share. The release loyalty percent is release_owner_refund_pct for a buyer whose Calloway
      warranty coverage shows owner type original_buyer and status active,
      release_resale_owner_refund_pct for a buyer whose Calloway warranty coverage shows owner type
      subsequent_owner and status active, and premium_fee_refund_pct_after_window for every other
      buyer. The release lender bonus is release_chm_bonus_pct percentage points for a buyer whose
      earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage,
      release_repeat_bonus_pct points for a buyer whose earlier Calloway purchase agreement stands
      closed with financing type outside_lender or cash, and none for a buyer with no closed Calloway
      purchase agreement. The release grace bonus is set by the calendar days from the last day of the
      full-refund window to the release date: release_quick_grace_pct points where the release comes
      at most release_quick_grace_days days after the window, release_late_grace_pct points where it
      comes more than release_quick_grace_days but at most release_late_grace_days days after the
      window, and none where it comes later. The release forfeit method turns the unadjusted forfeit
      into the release forfeit: where no extension has been written on the reservation, the unadjusted
      forfeit is prorated by the hold already run, multiplied by the calendar days from the
      reservation date to the release date and divided by the calendar days from the reservation date
      to the hold expiry date, and rounded half up to the cent; where exactly one extension has been
      written, the unadjusted forfeit is prorated the same way but rounded down to the cent and never
      below half of the unadjusted forfeit, that half rounded half up to the cent; where more extensions have been written, the unadjusted
      forfeit is kept whole as the release forfeit. Extension, swap, reinstatement and returned-payment
      fees and card convenience fees are retained, and every refund is issued by refund_method of the
      class.
    prerequisite: []
    cross_category:
      - category: warranty
        as: branch
        reads: [owner_type, status]
        note: The release loyalty percent tier is decided by the owner type and status of the buyer's Calloway warranty coverage.
      - category: purchase
        as: branch
        reads: [financing_type, status]
        note: The release lender bonus tier is decided by the financing type of the buyer's closed Calloway purchase agreement.
    compute:
      - premium_received: "SUM('homesite_events','amount', event_type='homesite_payment_received', deposit_component='premium_holding_fee')"
      - dep_last_paid: "LATEST('homesite_events','event_date', event_type='homesite_payment_received', deposit_component='reservation_deposit')"
      - fee_last_paid: "LATEST('homesite_events','event_date', event_type='homesite_payment_received', deposit_component='premium_holding_fee')"
      - funds_completed_on: "dep_last_paid if P('premium_holding_fee_usd') == 0 else MX(dep_last_paid, fee_last_paid)"
      - window_start: "MX(F('reserved_date'), funds_completed_on)"
      - days_after_window: "DAYS(window_start, NOW) - P('full_refund_window_days')"
      - wty_owner: "CFIELD('warranty','owner_type')"
      - wty_status: "CFIELD('warranty','status')"
      - loyalty_pct: "K('release_owner_refund_pct') if (wty_owner == 'original_buyer' and wty_status == 'active') else (K('release_resale_owner_refund_pct') if (wty_owner == 'subsequent_owner' and wty_status == 'active') else P('premium_fee_refund_pct_after_window'))"
      - prior_financing: "CFIELD('purchase','financing_type', status='closed')"
      - lender_bonus_pct: "K('release_chm_bonus_pct') if prior_financing == 'calloway_home_mortgage' else (K('release_repeat_bonus_pct') if (prior_financing == 'outside_lender' or prior_financing == 'cash') else 0)"
      - grace_bonus_pct: "K('release_quick_grace_pct') if days_after_window <= K('release_quick_grace_days') else (K('release_late_grace_pct') if days_after_window <= K('release_late_grace_days') else 0)"
      - refund_pct: "MN(100, loyalty_pct + lender_bonus_pct + grace_bonus_pct)"
      - refundable_share: "RND(premium_received * refund_pct / 100, 2)"
      - unadjusted_forfeit: "premium_received - refundable_share"
      - run_ratio: "DAYS(F('reserved_date'), NOW) / DAYS(F('reserved_date'), F('hold_expiry_date'))"
      - release_forfeit: "RND(unadjusted_forfeit * run_ratio, 2) if F('extensions_used') == 0 else (MX(int(RND(unadjusted_forfeit * run_ratio * 100, 6)) / 100, RND(unadjusted_forfeit / 2, 2)) if F('extensions_used') == 1 else unadjusted_forfeit)"
      - result: "premium_received if (days_after_window <= 0 and P('premium_fee_refundable_within_window')) else RND(premium_received - release_forfeit, 2)"
    compute_basis:
      premium_received: "the premium holding fee received"
      dep_last_paid: "The day the required funds became complete is the latest posting date of a homesite_payment_received row with component reservation_deposit"
      fee_last_paid: "or, where the class carries a premium holding fee above zero, the later of that date and the latest posting date of a homesite_payment_received row with component premium_holding_fee."
      funds_completed_on: "The day the required funds became complete is the latest posting date of a homesite_payment_received row with component reservation_deposit, or, where the class carries a premium holding fee above zero, the later of that date and the latest posting date of a homesite_payment_received row with component premium_holding_fee."
      window_start: "the window start being the later of the reservation date and the day the required funds became complete."
      days_after_window: "A release is inside the full-refund window when the signed release is received within full_refund_window_days calendar days after the window start"
      wty_owner: "for a buyer whose Calloway warranty coverage shows owner type original_buyer and status active"
      wty_status: "for a buyer whose Calloway warranty coverage shows owner type original_buyer and status active"
      loyalty_pct: "The release loyalty percent is release_owner_refund_pct for a buyer whose Calloway warranty coverage shows owner type original_buyer and status active, release_resale_owner_refund_pct for a buyer whose Calloway warranty coverage shows owner type subsequent_owner and status active, and premium_fee_refund_pct_after_window for every other buyer."
      prior_financing: "for a buyer whose earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage"
      lender_bonus_pct: "The release lender bonus is release_chm_bonus_pct percentage points for a buyer whose earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage, release_repeat_bonus_pct points for a buyer whose earlier Calloway purchase agreement stands closed with financing type outside_lender or cash, and none for a buyer with no closed Calloway purchase agreement."
      grace_bonus_pct: "release_quick_grace_pct points where the release comes at most release_quick_grace_days days after the window, release_late_grace_pct points where it comes more than release_quick_grace_days but at most release_late_grace_days days after the window, and none where it comes later."
      refund_pct: "The release refund percent after the window is the release loyalty percent plus the release lender bonus plus the release grace bonus, never more than one hundred percent"
      refundable_share: "the refundable share is the premium holding fee received times that percent, rounded half up to the cent"
      unadjusted_forfeit: "the unadjusted forfeit is the premium holding fee received less the refundable share."
      run_ratio: "multiplied by the calendar days from the reservation date to the release date and divided by the calendar days from the reservation date to the hold expiry date"
      release_forfeit: "where no extension has been written on the reservation, the unadjusted forfeit is prorated by the hold already run, multiplied by the calendar days from the reservation date to the release date and divided by the calendar days from the reservation date to the hold expiry date, and rounded half up to the cent; where exactly one extension has been written, the unadjusted forfeit is prorated the same way but rounded down to the cent and never below half of the unadjusted forfeit, that half rounded half up to the cent; where more extensions have been written, the unadjusted forfeit is kept whole as the release forfeit."
      result: "Inside the window the premium holding fee received is refunded in full where premium_fee_refundable_within_window is true; where it is false, the release is settled as one after the window. After the window, the premium holding fee release refund is the premium holding fee received less the release forfeit"
    factors:
      - id: release_loyalty_percent
        effect: parameter
        decides: loyalty_pct
        bindings: [wty_owner, wty_status, loyalty_pct]
        ladder:
          - when: "the buyer's Calloway warranty coverage shows owner type original_buyer and status active"
            value: "K('release_owner_refund_pct')"
          - when: "the buyer's Calloway warranty coverage shows owner type subsequent_owner and status active"
            value: "K('release_resale_owner_refund_pct')"
          - when: "otherwise"
            value: "P('premium_fee_refund_pct_after_window')"
        baseline:
          loyalty_pct: "P('premium_fee_refund_pct_after_window')"
        evidence: [cross_category]
        cross_difficulty: warranty
      - id: release_lender_bonus
        effect: parameter
        decides: lender_bonus_pct
        bindings: [prior_financing, lender_bonus_pct]
        ladder:
          - when: "the buyer's earlier Calloway purchase agreement stands closed with financing type calloway_home_mortgage"
            value: "K('release_chm_bonus_pct')"
          - when: "the buyer's earlier Calloway purchase agreement stands closed with financing type outside_lender or cash"
            value: "K('release_repeat_bonus_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          lender_bonus_pct: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: release_grace_bonus
        effect: parameter
        decides: grace_bonus_pct
        bindings: [dep_last_paid, fee_last_paid, funds_completed_on, window_start, days_after_window, grace_bonus_pct]
        ladder:
          - when: "the release comes at most release_quick_grace_days days after the last day of the full-refund window"
            value: "K('release_quick_grace_pct')"
          - when: "the release comes more than release_quick_grace_days but at most release_late_grace_days days after the window"
            value: "K('release_late_grace_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          grace_bonus_pct: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: release_forfeit_method
        effect: method
        decides: release_forfeit
        bindings: [run_ratio, release_forfeit]
        ladder:
          - when: "no extension has been written on the reservation"
            method: "the unadjusted forfeit is prorated by the hold already run (days reserved-to-release over days reserved-to-hold-expiry), rounded half up to the cent"
          - when: "exactly one extension has been written on the reservation"
            method: "the unadjusted forfeit is prorated the same way, rounded down to the cent, and never below half of the unadjusted forfeit, that half rounded half up to the cent"
          - when: "otherwise"
            method: "the unadjusted forfeit is kept whole"
        baseline:
          release_forfeit: "unadjusted_forfeit"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The reservation deposit received is refunded in full, one refund per source payment. Inside
        the window the premium holding fee received is refunded in full where
        premium_fee_refundable_within_window is true; where it is false, the release is settled as one
        after the window. The standard premium holding
        fee release refund after the window is premium_fee_refund_pct_after_window percent of the
        premium holding fee received, rounded half up to the cent, and the rest of the premium holding
        fee is the release forfeit.
      params: [premium_fee_refund_pct_after_window, full_refund_window_days]
    inputs:
      history:
        - {table: homesite_events, aggregate: sum, field: amount, filters: {event_type: homesite_payment_received, deposit_component: premium_holding_fee}}
        - {table: homesite_events, aggregate: latest, field: event_date, filters: {event_type: homesite_payment_received, deposit_component: reservation_deposit}}
      cross_category: [warranty, purchase]

  - id: homesite_ext_reinstated_hold_term
    base_policy_refs: [homesite_agg_community_premium_cap, homesite_expiry_reinstatement]
    overwrite:
      - base_policy: homesite_expiry_reinstatement
        superseded_clause: >-
          A reinstated hold runs extension_days calendar days from the reinstatement date.
        replaced_by: >-
          A reinstated hold runs the reinstated hold term counted from the reinstatement date, and the hold expiry date written is the reinstatement date plus the reinstated hold term.
    trigger: on_request
    subject: [homesite_reinstated]
    computes: hold_days
    target_tool: reinstate_homesite_hold_f9d4ebfd
    params:
      reinst_cleared_fee_hold_days: 10
      reinst_card_fee_hold_days: 8
      reinst_owner_bonus_days: 3
      reinst_resale_owner_bonus_days: 1
      reinst_part_card_cut_days: 1
      reinst_full_card_cut_days: 2
      reinst_aging_letter_age_days: 30
      reinst_stale_letter_age_days: 60
      reinst_aging_letter_cut_days: 1
      reinst_stale_letter_cut_days: 2
    rule: >-
      When an expired hold is reinstated, it is brought back to held status on the same homesite and
      the reinstated hold term is fixed, the
      whole calendar days the reinstated hold runs counted from the reinstatement date. A lapsed hold
      is not reinstated until no other reservation of the buyer stands in pending deposit or held
      status. The reinstated hold term is fixed only after a reinstatement fee payment for the lapsed
      hold stands on the reservation ledger. A reinstated hold runs the reinstated hold term counted
      from the reinstatement date, and the hold expiry date written is the reinstatement date plus
      the reinstated hold term. The standard reinstated hold term is extension_days calendar days,
      counted from the reinstatement date, with nothing added back for the days the hold stood
      lapsed. The reinstated hold term is the reinstated base length plus the lapse days added back
      plus the reinstatement loyalty bonus, less the reinstatement card shortening and less the
      reinstatement letter shortening, all in whole calendar days, with no rounding. The reinstated
      base length is set by how the latest homesite_payment_received row with component
      reinstatement_fee was paid: reinst_cleared_fee_hold_days where it was paid by ach, wire or
      certified_funds, reinst_card_fee_hold_days where it was paid by card, and extension_days in every
      other case. The lapse days are the calendar days from the date the hold expired to the
      reinstatement date, and the lapse add-back method is judged by the courtesy expiry reminders on
      the reservation ledger (homesite_notice_sent rows with notice type expiry_reminder): where no
      expiry reminder was sent, every lapse day is added back; where the latest expiry reminder was
      sent fewer than expiry_notice_days_before calendar days before the hold expiry date, half of the
      lapse days are added back, rounded up to a whole day; where it was sent expiry_notice_days_before
      or more calendar days before the hold expiry date, nothing is added back. The reinstatement
      loyalty bonus is reinst_owner_bonus_days for a buyer whose Calloway warranty coverage shows
      owner type original_buyer and status active, reinst_resale_owner_bonus_days for a buyer whose
      Calloway warranty coverage shows owner type subsequent_owner and status active, and zero for
      every other buyer. The reinstatement card shortening is reinst_full_card_cut_days where card
      payments make up the whole reservation deposit received, reinst_part_card_cut_days where card
      payments make up part but not all of it, and zero where no part of it was paid by card, counting
      only the homesite_payment_received rows with component reservation_deposit. The reinstatement
      letter shortening is set by the age of the pre-qualification letter on the reinstatement date,
      counted in calendar days from the letter date to today: reinst_stale_letter_cut_days where it is
      more than reinst_stale_letter_age_days days old, reinst_aging_letter_cut_days where it is more
      than reinst_aging_letter_age_days but no more than reinst_stale_letter_age_days days old, and
      zero where it is reinst_aging_letter_age_days days old or less.
    prerequisite:
      - problem: homesite_ext_release_premium_refund
        kind: state_gate
        gate: homesite_reservations.status
        form: state
        policy_source: >-
          A lapsed hold is not reinstated until no other reservation of the buyer stands in pending deposit or held status.
        condition: >-
          Every homesite_reservations row of the buyer other than the expired one stands in status converted, released, expired or withdrawn; none stands in pending_deposit or held.
        resolved_by: sign_homesite_release_13bc71ff
        effect: >-
          Once the buyer signs the release of the other held homesite, that reservation stands released, the buyer holds no other open reservation, and the lapsed hold may be reinstated.
      - problem: homesite_ext_reinstatement_fee_charge
        kind: value_input
        gate: fee_paid_by
        form: state
        policy_source: >-
          The reinstated hold term is fixed only after a reinstatement fee payment for the lapsed hold stands on the reservation ledger.
        condition: >-
          A homesite_events row of event_type homesite_payment_received with deposit_component reinstatement_fee stands on the expired reservation.
        resolved_by: record_reinstatement_fee_fa042025
        effect: >-
          Once the reinstatement fee payment posts, the fee_paid_by binding reads its payment method, which sets the reinstated base length (a bank transfer gives reinst_cleared_fee_hold_days instead of extension_days).
    cross_category:
      - category: warranty
        as: branch
        reads: [owner_type, status]
        note: The reinstatement loyalty bonus tier is decided by the owner type and status of the buyer's Calloway warranty coverage.
    compute:
      - fee_paid_by: "LATEST('homesite_events','payment_method', event_type='homesite_payment_received', deposit_component='reinstatement_fee')"
      - base_length: "K('reinst_cleared_fee_hold_days') if (fee_paid_by == 'ach' or fee_paid_by == 'wire' or fee_paid_by == 'certified_funds') else (K('reinst_card_fee_hold_days') if fee_paid_by == 'card' else P('extension_days'))"
      - lapse_days: "DAYS(F('end_date'), NOW)"
      - reminders_sent: "COUNT('homesite_events', event_type='homesite_notice_sent', notice_type='expiry_reminder')"
      - reminder_on: "LATEST('homesite_events','event_date', event_type='homesite_notice_sent', notice_type='expiry_reminder')"
      - reminder_lead: "DAYS(reminder_on, F('hold_expiry_date')) if reminders_sent > 0 else -1"
      - lapse_added: "lapse_days if reminders_sent == 0 else ((lapse_days + 1) // 2 if reminder_lead < P('expiry_notice_days_before') else 0)"
      - wty_owner: "CFIELD('warranty','owner_type')"
      - wty_status: "CFIELD('warranty','status')"
      - loyalty_bonus: "K('reinst_owner_bonus_days') if (wty_owner == 'original_buyer' and wty_status == 'active') else (K('reinst_resale_owner_bonus_days') if (wty_owner == 'subsequent_owner' and wty_status == 'active') else 0)"
      - dep_paid_total: "SUM('homesite_events','amount', event_type='homesite_payment_received', deposit_component='reservation_deposit')"
      - dep_paid_card: "SUM('homesite_events','amount', event_type='homesite_payment_received', deposit_component='reservation_deposit', payment_method='card')"
      - card_cut: "K('reinst_full_card_cut_days') if (dep_paid_card > 0 and dep_paid_card >= dep_paid_total) else (K('reinst_part_card_cut_days') if dep_paid_card > 0 else 0)"
      - letter_age_now: "DAYS(F('prequal_letter_date'), NOW)"
      - letter_cut: "K('reinst_stale_letter_cut_days') if letter_age_now > K('reinst_stale_letter_age_days') else (K('reinst_aging_letter_cut_days') if letter_age_now > K('reinst_aging_letter_age_days') else 0)"
      - result: "base_length + lapse_added + loyalty_bonus - card_cut - letter_cut"
    compute_basis:
      fee_paid_by: "The reinstated base length is set by how the latest homesite_payment_received row with component reinstatement_fee was paid"
      base_length: "reinst_cleared_fee_hold_days where it was paid by ach, wire or certified_funds, reinst_card_fee_hold_days where it was paid by card, and extension_days in every other case."
      lapse_days: "The lapse days are the calendar days from the date the hold expired to the reinstatement date"
      reminders_sent: "the lapse add-back method is judged by the courtesy expiry reminders on the reservation ledger (homesite_notice_sent rows with notice type expiry_reminder)"
      reminder_on: "where the latest expiry reminder was sent fewer than expiry_notice_days_before calendar days before the hold expiry date"
      reminder_lead: "where the latest expiry reminder was sent fewer than expiry_notice_days_before calendar days before the hold expiry date"
      lapse_added: "where no expiry reminder was sent, every lapse day is added back; where the latest expiry reminder was sent fewer than expiry_notice_days_before calendar days before the hold expiry date, half of the lapse days are added back, rounded up to a whole day; where it was sent expiry_notice_days_before or more calendar days before the hold expiry date, nothing is added back."
      wty_owner: "for a buyer whose Calloway warranty coverage shows owner type original_buyer and status active"
      wty_status: "for a buyer whose Calloway warranty coverage shows owner type original_buyer and status active"
      loyalty_bonus: "The reinstatement loyalty bonus is reinst_owner_bonus_days for a buyer whose Calloway warranty coverage shows owner type original_buyer and status active, reinst_resale_owner_bonus_days for a buyer whose Calloway warranty coverage shows owner type subsequent_owner and status active, and zero for every other buyer."
      dep_paid_total: "counting only the homesite_payment_received rows with component reservation_deposit."
      dep_paid_card: "counting only the homesite_payment_received rows with component reservation_deposit."
      card_cut: "The reinstatement card shortening is reinst_full_card_cut_days where card payments make up the whole reservation deposit received, reinst_part_card_cut_days where card payments make up part but not all of it, and zero where no part of it was paid by card"
      letter_age_now: "set by the age of the pre-qualification letter on the reinstatement date, counted in calendar days from the letter date to today"
      letter_cut: "reinst_stale_letter_cut_days where it is more than reinst_stale_letter_age_days days old, reinst_aging_letter_cut_days where it is more than reinst_aging_letter_age_days but no more than reinst_stale_letter_age_days days old, and zero where it is reinst_aging_letter_age_days days old or less."
      result: "The reinstated hold term is the reinstated base length plus the lapse days added back plus the reinstatement loyalty bonus, less the reinstatement card shortening and less the reinstatement letter shortening, all in whole calendar days, with no rounding."
    factors:
      - id: reinstated_base_length
        effect: parameter
        decides: base_length
        bindings: [fee_paid_by, base_length]
        ladder:
          - when: "the latest reinstatement_fee payment was paid by ach, wire or certified_funds"
            value: "K('reinst_cleared_fee_hold_days')"
          - when: "the latest reinstatement_fee payment was paid by card"
            value: "K('reinst_card_fee_hold_days')"
          - when: "otherwise"
            value: "P('extension_days')"
        baseline:
          base_length: "P('extension_days')"
        evidence: [history]
        cross_difficulty: null
      - id: reinstated_lapse_add_back
        effect: method
        decides: lapse_added
        bindings: [lapse_days, reminders_sent, reminder_on, reminder_lead, lapse_added]
        ladder:
          - when: "no courtesy expiry reminder was sent on the reservation"
            method: "every lapse day is added back to the reinstated hold term"
          - when: "the latest expiry reminder was sent fewer than expiry_notice_days_before calendar days before the hold expiry date"
            method: "half of the lapse days are added back, rounded up to a whole day"
          - when: "otherwise"
            method: "nothing is added back; the reinstated hold counts only from the reinstatement date"
        baseline:
          lapse_added: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: reinstated_loyalty_bonus
        effect: parameter
        decides: loyalty_bonus
        bindings: [wty_owner, wty_status, loyalty_bonus]
        ladder:
          - when: "the buyer's Calloway warranty coverage shows owner type original_buyer and status active"
            value: "K('reinst_owner_bonus_days')"
          - when: "the buyer's Calloway warranty coverage shows owner type subsequent_owner and status active"
            value: "K('reinst_resale_owner_bonus_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          loyalty_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: warranty
      - id: reinstated_card_shortening
        effect: parameter
        decides: card_cut
        bindings: [dep_paid_total, dep_paid_card, card_cut]
        ladder:
          - when: "card payments make up the whole reservation deposit received"
            value: "K('reinst_full_card_cut_days')"
          - when: "card payments make up part but not all of the reservation deposit received"
            value: "K('reinst_part_card_cut_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          card_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: reinstated_letter_shortening
        effect: parameter
        decides: letter_cut
        bindings: [letter_age_now, letter_cut]
        ladder:
          - when: "the pre-qualification letter is more than reinst_stale_letter_age_days days old on the reinstatement date"
            value: "K('reinst_stale_letter_cut_days')"
          - when: "the letter is more than reinst_aging_letter_age_days but no more than reinst_stale_letter_age_days days old on the reinstatement date"
            value: "K('reinst_aging_letter_cut_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          letter_cut: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard reinstated hold term is extension_days calendar days, counted from the
        reinstatement date, with nothing added back for the days the hold stood lapsed.
      params: [extension_days]
    inputs:
      history:
        - {table: homesite_events, aggregate: latest, field: payment_method, filters: {event_type: homesite_payment_received, deposit_component: reinstatement_fee}}
        - {table: homesite_events, aggregate: count, filters: {event_type: homesite_notice_sent, notice_type: expiry_reminder}}
        - {table: homesite_events, aggregate: sum, field: amount, filters: {event_type: homesite_payment_received, deposit_component: reservation_deposit}}
      cross_category: [warranty]
