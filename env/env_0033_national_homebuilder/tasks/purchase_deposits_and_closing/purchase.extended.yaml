events:
  - type: purchase_agreement_written
    target: purchase_agreements
    mutation: create
    meaning: The buyer signs a Home Purchase Agreement for a plan on a homesite; it awaits its signing deposits and Calloway's countersignature.
    grain: One row per agreement signed.
    fields:
      customer_id: The buyer.
      variant_name: Collection of the plan, the official tier name.
      status: Always pending_ratification on creation.
      reservation_id: The Homesite Reservation this agreement converts, empty when the homesite was not reserved first.
      community: Community of the homesite.
      lot_number: Site-plan lot number of the homesite.
      plan_name: Marketed plan and elevation name.
      base_price: Base price of the plan on the community price sheet on the contract date.
      lot_premium: Lot premium written into the agreement.
      contract_price: Base price plus lot premium.
      contract_date: Date the buyer signed.
      inventory_home: Whether the home was already complete (quick move-in) when signed.
      financing_type: How the buyer is financing.
      sale_contingency: Whether the agreement is contingent on the sale of the buyer's current home.
      contingency_deadline: Contract date plus sale_contingency_days, empty without a contingency.
      construction_stage: not_started, or complete for an inventory home.
      contract_completion_date: Estimated completion date stated in the agreement at signing.
      estimated_completion_date: Current estimated completion date, equal to the contract completion date at signing.
      closing_extensions_used: 0 on creation.
      lot_transfers_used: 0 on creation.
      earnest_money_held: 0.00 on creation.
      buyer_charges_due: 0.00 on creation.
      incentive_balance: 0.00 on creation.
    triggers:
      - event: homesite:homesite_converted
        when: {reservation_id: {not: ""}}
        map: {end_date: contract_date}
  - type: purchase_deposit_posted
    target: purchase_events
    meaning: A deposit posts to the agreement, either paid by the buyer or moved from a converted homesite reservation.
    grain: One row per deposit component per payment.
    distinguish_by: [deposit_component, payment_reference]
    fields:
      amount: Amount posted, positive.
      deposit_component: Which deposit the money is.
      payment_method: How it was paid, or internal_transfer for reservation funds.
      payment_reference: Receipt number printed on the Calloway receipt, or for a transfer the receipt number of the original reservation payment.
      event_date: Date the deposit posted.
    account: earnest_money
    direction: in
    triggers: []
  - type: purchase_ratified
    target: purchase_agreements
    mutation: {transition: {from: pending_ratification, to: ratified}}
    meaning: The signing deposits are in and Calloway countersigns; the agreement is in force.
    grain: One row per transaction.
    fields:
      status: Becomes ratified.
    triggers: []
  - type: purchase_construction_started
    target: purchase_agreements
    mutation: {transition: {from: ratified, to: under_construction}}
    meaning: The foundation is started on the homesite.
    grain: One row per transaction.
    fields:
      status: Becomes under_construction.
      construction_stage: Becomes foundation.
      construction_start_date: Date the foundation was started.
    triggers:
      - event: design:design_structural_closed
  - type: purchase_stage_updated
    target: purchase_agreements
    mutation: update
    meaning: The construction manager records the home reaching a new construction stage and refreshes the estimated completion date.
    grain: One row per transaction.
    fields:
      construction_stage: New construction stage.
      estimated_completion_date: Updated estimated completion date.
    triggers:
      - event: design:design_finalized
        when: {construction_stage: drywall}
  - type: purchase_closing_scheduled
    target: purchase_agreements
    mutation: {transition: [{from: ratified, to: closing_scheduled}, {from: under_construction, to: closing_scheduled}]}
    meaning: Calloway sets the closing date and sends the closing date notice.
    grain: One row per transaction.
    fields:
      status: Becomes closing_scheduled.
      scheduled_closing_date: The closing date set.
    triggers:
      - event: purchase:purchase_notice_sent
        map: {notice_type: closing_date_notice}
  - type: purchase_closing_extended
    target: purchase_agreements
    mutation: update
    meaning: The scheduled closing date is moved later, at the buyer's request or because of a builder delay.
    grain: One row per transaction.
    fields:
      scheduled_closing_date: New scheduled closing date.
      closing_extensions_used: Incremented by one for a buyer-requested extension, unchanged for a builder-delay move.
    triggers: []
  - type: purchase_plan_changed
    target: purchase_agreements
    mutation: update
    meaning: The plan or elevation on the agreement is changed by amendment before construction starts.
    grain: One row per transaction.
    fields:
      plan_name: New plan and elevation name.
      base_price: Base price of the new plan on the community price sheet on the amendment date.
      contract_price: New base price plus lot premium.
    triggers: []
  - type: purchase_lot_transferred
    target: purchase_agreements
    mutation: update
    meaning: The agreement is moved to another homesite in the same community by amendment.
    grain: One row per transaction.
    fields:
      lot_number: New homesite lot number.
      lot_premium: Lot premium of the new homesite on the amendment date.
      contract_price: Base price plus the new lot premium.
      lot_transfers_used: Incremented by one.
    triggers: []
  - type: purchase_financing_changed
    target: purchase_agreements
    mutation: update
    meaning: The buyer changes how the purchase is financed.
    grain: One row per transaction.
    fields:
      financing_type: New financing type.
    triggers: []
  - type: purchase_contingency_released
    target: purchase_agreements
    mutation: update
    meaning: The buyer's home-sale contingency is satisfied or waived and removed from the agreement.
    grain: One row per transaction.
    fields:
      sale_contingency: Becomes none.
      contingency_deadline: Cleared to empty.
    triggers: []
  - type: purchase_charge_assessed
    target: purchase_events
    meaning: A fee or per diem is charged to the buyer on the agreement.
    grain: One row per charge; a per diem is one row per delay period.
    distinguish_by: [charge_type, charge_reference]
    fields:
      amount: Amount charged, positive.
      charge_type: Kind of charge.
      charge_reference: Charge number printed on the buyer statement, e.g. CHG-HP-3301.
      period_start: First day of a per diem period, empty for other charges.
      period_end: Last day of a per diem period, empty for other charges.
      event_date: Date the charge was assessed.
    account: buyer_charges
    direction: in
    triggers: []
  - type: purchase_charge_waived
    target: purchase_events
    meaning: A charge on the agreement is waived in whole or in part.
    grain: One row per waived charge.
    distinguish_by: [source_charge_ref]
    fields:
      amount: Amount waived, positive.
      charge_type: Kind of charge waived.
      source_charge_ref: Charge number of the charge being waived.
      event_date: Date of the waiver.
    account: buyer_charges
    direction: out
    triggers: []
  - type: purchase_charges_collected
    target: purchase_events
    meaning: An outstanding charge is collected, at closing or by direct payment.
    grain: One row per charge collected.
    distinguish_by: [source_charge_ref]
    fields:
      amount: Amount collected, positive.
      charge_type: Kind of charge collected.
      source_charge_ref: Charge number of the charge collected.
      event_date: Date collected.
    account: buyer_charges
    direction: out
    triggers: []
  - type: purchase_deposit_refunded
    target: purchase_events
    meaning: Deposit money held on the agreement is refunded to the buyer.
    grain: One row per refunded deposit component per source payment.
    distinguish_by: [source_payment_ref, deposit_component]
    fields:
      amount: Amount refunded, positive.
      deposit_component: Deposit component refunded.
      source_payment_ref: Receipt number of the deposit payment being refunded.
      refund_reason: Why it is refunded.
      event_date: Date the refund was issued.
    account: earnest_money
    direction: out
    triggers: []
  - type: purchase_deposit_forfeited
    target: purchase_events
    meaning: Deposit money held on the agreement is retained by Calloway.
    grain: One row per forfeited deposit component per source payment.
    distinguish_by: [source_payment_ref, deposit_component]
    fields:
      amount: Amount forfeited, positive.
      deposit_component: Deposit component forfeited.
      source_payment_ref: Receipt number of the deposit payment forfeited.
      forfeiture_reason: Why it is forfeited.
      event_date: Date of forfeiture.
    account: earnest_money
    direction: out
    triggers: []
  - type: purchase_deposit_applied
    target: purchase_events
    meaning: Deposits held are credited to the buyer on the closing statement.
    grain: One row per deposit component per source payment applied.
    distinguish_by: [source_payment_ref, deposit_component]
    fields:
      amount: Amount credited, positive.
      deposit_component: Deposit component credited.
      source_payment_ref: Receipt number of the deposit payment credited.
      event_date: Closing date.
    account: earnest_money
    direction: out
    triggers: []
  - type: purchase_payment_returned
    target: purchase_events
    meaning: A deposit payment is returned unpaid by the buyer's bank.
    grain: One row per returned payment.
    distinguish_by: [source_payment_ref]
    fields:
      amount: Amount returned, positive.
      deposit_component: Deposit component the payment had funded.
      source_payment_ref: Receipt number of the returned payment.
      event_date: Date Calloway was notified of the return.
    account: earnest_money
    direction: out
    triggers:
      - event: purchase:purchase_charge_assessed
        map: {charge_type: returned_payment_fee, event_date: event_date}
  - type: purchase_incentive_granted
    target: purchase_events
    meaning: A builder incentive is granted on the agreement.
    grain: One row per incentive type granted.
    distinguish_by: [incentive_type, event_date]
    fields:
      amount: Incentive amount granted, positive.
      incentive_type: Which incentive.
      event_date: Date granted.
    account: incentive_credit
    direction: in
    triggers: []
  - type: purchase_incentive_revoked
    target: purchase_events
    meaning: A granted incentive is withdrawn because its conditions stopped being met.
    grain: One row per incentive type revoked.
    distinguish_by: [incentive_type, event_date]
    fields:
      amount: Incentive amount revoked, positive.
      incentive_type: Which incentive.
      event_date: Date revoked.
    account: incentive_credit
    direction: out
    triggers: []
  - type: purchase_incentive_applied
    target: purchase_events
    meaning: Granted incentive dollars are credited to the buyer on the closing statement.
    grain: One row per incentive type applied.
    distinguish_by: [incentive_type]
    fields:
      amount: Incentive amount credited at closing, positive.
      incentive_type: Which incentive.
      event_date: Closing date.
    account: incentive_credit
    direction: out
    triggers: []
  - type: purchase_notice_sent
    target: purchase_events
    meaning: A written contract notice is sent to the buyer.
    grain: One row per notice per date.
    distinguish_by: [notice_type, event_date]
    fields:
      notice_type: Kind of notice.
      event_date: Date the notice was sent.
    triggers: []
  - type: purchase_closed
    target: purchase_agreements
    mutation: {transition: {from: closing_scheduled, to: closed}}
    meaning: The sale funds and records and the buyer takes possession.
    grain: One row per transaction.
    fields:
      status: Becomes closed.
      end_date: Closing date.
    triggers:
      - event: purchase:purchase_deposit_applied
        map: {event_date: end_date}
      - event: purchase:purchase_incentive_applied
        map: {event_date: end_date}
      - event: purchase:purchase_charges_collected
        map: {event_date: end_date}
      - event: design:design_delivered
        map: {end_date: end_date}
      - event: warranty:warranty_coverage_enrolled
        map: {purchase_id: purchase_id, coverage_start_date: end_date}
  - type: purchase_cancelled
    target: purchase_agreements
    mutation: {transition: [{from: pending_ratification, to: cancelled}, {from: ratified, to: cancelled}, {from: under_construction, to: cancelled}, {from: closing_scheduled, to: cancelled}]}
    meaning: The agreement ends without closing on a void, rescission, contingency, builder delay or mutual release.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: Cancellation date (the date the buyer confirmed the cancellation, or the void date).
    triggers:
      - event: design:design_cancelled
        map: {end_date: end_date}
      - event: lock:lock_cancelled
        map: {end_date: end_date}
  - type: purchase_terminated
    target: purchase_agreements
    mutation: {transition: [{from: ratified, to: terminated}, {from: under_construction, to: terminated}, {from: closing_scheduled, to: terminated}]}
    meaning: Calloway terminates the agreement for an uncured buyer default.
    grain: One row per transaction.
    fields:
      status: Becomes terminated.
      end_date: Termination date.
    triggers:
      - event: purchase:purchase_deposit_forfeited
        map: {forfeiture_reason: buyer_default, event_date: end_date}
      - event: design:design_cancelled
        map: {end_date: end_date}
      - event: lock:lock_cancelled
        map: {end_date: end_date}

measures:
  - id: purchase_msr_open_agreements
    window: Point in time on the frozen date.
    measure: Count of this buyer's purchase_agreements in status pending_ratification, ratified, under_construction or closing_scheduled, excluding the agreement being handled.
  - id: purchase_msr_buyer_delay_days
    window: From the day after the scheduled closing date through the frozen date.
    measure: Calendar days elapsed after scheduled_closing_date on an agreement still in status closing_scheduled.
  - id: purchase_msr_deposits_by_component
    window: Life of the agreement.
    measure: Sum of purchase_deposit_posted amounts minus purchase_payment_returned, refunded, forfeited and applied amounts, grouped by deposit_component.

policies:
  - id: purchase_agg_multi_holding
    subject: [purchase_agreement_written]
    rule: >-
      A buyer may have up to max_per_customer Home Purchase Agreements open at once (status
      pending_ratification, ratified, under_construction or closing_scheduled); closed, cancelled and
      terminated agreements do not count. The buyer's purchase_msr_open_agreements is below max_per_customer before the agreement is written.
      An agreement that would exceed the cap is not written.
    eligibility:
      - id: open_agreement_cap
        applies_to: [purchase_agreement_written]
        kind: authorization
        condition: "The buyer's purchase_msr_open_agreements is below max_per_customer before the agreement is written."
        evidence_fields: [purchase_agreements.customer_id, purchase_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.customer_id]
          action_bindings:
            purchase_agreements.customer_id: customer_id
    params:
      max_per_customer: 2
    measures: [purchase_msr_open_agreements]

  - id: purchase_agg_concurrent_agreements
    subject: [purchase_agreement_written, purchase_incentive_granted, purchase_deposit_posted]
    rule: >-
      When the buyer already has another open agreement (purchase_msr_open_agreements of at least one),
      the new agreement may not carry a home-sale contingency, its initial earnest money is raised by
      second_agreement_em_uplift_pct percent of its contract price (rounded half up to the cent), posted
      as a concurrent_agreement_deposit on top of every other component. Only one open agreement per buyer may carry builder incentives: incentives are granted on the earlier-dated agreement and not on the later one.
    eligibility:
      - id: one_incentive_agreement
        applies_to: [purchase_incentive_granted]
        kind: authorization
        condition: "Only one open agreement per buyer may carry builder incentives: incentives are granted on the earlier-dated agreement and not on the later one."
        evidence_fields: [purchase_agreements.customer_id, purchase_agreements.contract_date, purchase_agreements.status, purchase_events.incentive_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.customer_id]
          action_bindings:
            purchase_agreements.customer_id: customer_id
    params:
      second_agreement_em_uplift_pct: 5.0
    measures: [purchase_msr_open_agreements]

  - id: purchase_earnest_money
    subject: [purchase_agreement_written, purchase_deposit_posted]
    rule: >-
      The initial earnest money is the greater of initial_em_pct percent of the contract price
      (rounded half up to the cent) and initial_em_min_usd. Where the buyer's rate lock with Calloway
      Home Mortgage on this agreement carries loan_program va, the initial earnest money is capped at
      va_buyer_em_cap_usd. On top of the initial earnest money the buyer posts, at signing,
      outside_lender_extra_em_pct percent of the contract price when financing_type is outside_lender
      or cash, sale_contingency_extra_em_usd when the agreement carries a home-sale contingency, and the
      lot premium deposit required by homesite_conversion when the homesite was reserved first (reduced
      by premium holding fee and creditable extension fees moved from the reservation); a transferred
      reservation deposit counts toward the initial earnest money. The VA cap applies to the initial
      earnest money only and never to the extra components. An additional deposit of
      additional_deposit_pct percent of the contract price is due after construction starts. The additional deposit must post within additional_deposit_due_days calendar days after the construction start date.
      Counting starts the day after the construction start date and the last counted day is included;
      a missed additional deposit is a buyer default handled by purchase_default_termination. Any single
      payment above wire_required_above_usd must be a wire, and a card payment may not exceed
      card_payment_cap_usd (a cap of zero means card is not accepted).
    eligibility:
      - id: additional_deposit_deadline
        applies_to: [purchase_deposit_posted]
        kind: time
        condition: "The additional deposit must post within additional_deposit_due_days calendar days after the construction start date."
        evidence_fields: [purchase_agreements.construction_start_date, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the construction start date
          anchor_source: purchase_agreements.construction_start_date
          relation: not_after
          duration_source: variants.additional_deposit_due_days
          unit: calendar_days
          counting_rule: Counting starts the day after the construction start date and the last counted day is included
          boundary: inclusive
    formula:
      initial_em: max(round(contract_price * initial_em_pct / 100, 2), initial_em_min_usd)
      outside_lender_extra: round(contract_price * outside_lender_extra_em_pct / 100, 2)
      additional_deposit: round(contract_price * additional_deposit_pct / 100, 2)

  - id: purchase_ratification
    subject: [purchase_ratified, purchase_cancelled, purchase_deposit_posted, purchase_deposit_refunded]
    rule: >-
      An agreement is ratified when every deposit due at signing under purchase_earnest_money has
      posted and has not been returned. All deposits due at signing must post within em_due_business_days business days after the contract date.
      Business days are Monday through Friday excluding Calloway holidays, counting starts the next
      business day after the contract date, and a deposit posting on the last counted business day is
      on time. If they have not, the system voids the agreement (pending_ratification to cancelled) and
      every dollar posted is refunded with reason void_unfunded, including transferred reservation
      funds; no fee is charged on a void.
    eligibility:
      - id: signing_deposit_deadline
        applies_to: [purchase_ratified]
        kind: time
        condition: "All deposits due at signing must post within em_due_business_days business days after the contract date."
        evidence_fields: [purchase_agreements.contract_date, purchase_events.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.contract_date]
          action_bindings:
            purchase_agreements.contract_date: contract_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract date
          anchor_source: purchase_agreements.contract_date
          relation: not_after
          duration_source: variants.em_due_business_days
          unit: business_days
          counting_rule: Business days are Monday through Friday excluding Calloway holidays, counting starts the next business day after the contract date, and a deposit posting on the last counted business day is on time
          boundary: inclusive
    measures: [purchase_msr_deposits_by_component]

  - id: purchase_rescission
    subject: [purchase_cancelled, purchase_deposit_refunded]
    rule: >-
      A buyer may rescind a ratified agreement for any reason and receive every deposit back, the lot
      premium deposit and transferred reservation funds included, with no fee. A cancellation request with basis rescission is honored only when it is received within rescission_business_days business days after the contract date.
      Business days are Monday through Friday excluding Calloway holidays and counting starts the next
      business day after the contract date; a request received on the last counted business day is
      timely. A late rescission request is handled as a mutual release under
      purchase_cancellation_refund. The refund is issued within refund_processing_business_days.
    eligibility:
      - id: rescission_window
        applies_to: [purchase_cancelled]
        kind: time
        condition: "A cancellation request with basis rescission is honored only when it is received within rescission_business_days business days after the contract date."
        evidence_fields: [purchase_agreements.contract_date, purchase_cancellation_requests.received_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.contract_date, purchase_cancellation_requests.received_date]
          action_bindings:
            purchase_agreements.contract_date: contract_date
            purchase_cancellation_requests.received_date: received_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract date
          anchor_source: purchase_agreements.contract_date
          relation: not_after
          duration_source: variants.rescission_business_days
          unit: business_days
          counting_rule: Business days are Monday through Friday excluding Calloway holidays and counting starts the next business day after the contract date
          boundary: inclusive

  - id: purchase_financing_contingency
    subject: [purchase_cancelled, purchase_deposit_refunded, purchase_financing_changed, purchase_notice_sent]
    rule: >-
      A financed buyer must complete a full loan application within loan_application_days after the
      contract date; an outside-lender buyer must also deliver a written loan approval within
      outside_lender_approval_days, and a cash buyer must deliver proof of funds within
      cash_proof_of_funds_days. A missed item is a buyer default and starts purchase_default_termination
      with a default_notice. A buyer whose loan is denied in writing may cancel with refund of
      financing_denial_refund_pct percent of the refundable deposits. A cancellation request with basis financing_denial is honored only when it is received within financing_contingency_days calendar days after the contract date.
      Counting starts the day after the contract date and the last counted day is included. The lot
      premium deposit is refunded on a financing denial only where lot_premium_deposit_refundable is
      true. A cash buyer has no financing contingency. A change of financing_type after signing is
      recorded as purchase_financing_changed; a change to outside_lender or cash makes the
      outside_lender_extra_em_pct component due within em_due_business_days business days of the change
      and revokes incentives under purchase_incentives.
    eligibility:
      - id: financing_contingency_window
        applies_to: [purchase_cancelled]
        kind: time
        condition: "A cancellation request with basis financing_denial is honored only when it is received within financing_contingency_days calendar days after the contract date."
        evidence_fields: [purchase_agreements.contract_date, purchase_cancellation_requests.received_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.contract_date, purchase_cancellation_requests.received_date]
          action_bindings:
            purchase_agreements.contract_date: contract_date
            purchase_cancellation_requests.received_date: received_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract date
          anchor_source: purchase_agreements.contract_date
          relation: not_after
          duration_source: variants.financing_contingency_days
          unit: calendar_days
          counting_rule: Counting starts the day after the contract date and the last counted day is included
          boundary: inclusive

  - id: purchase_sale_contingency
    subject: [purchase_agreement_written, purchase_contingency_released, purchase_notice_sent, purchase_cancelled, purchase_deposit_refunded]
    rule: >-
      A home-sale contingency may be written only where sale_contingency_allowed is true, and its
      deadline is the contract date plus sale_contingency_days. When Calloway accepts a backup offer on
      the homesite it sends a kick_out_notice. The contingency must be released within kick_out_response_days calendar days after the kick-out notice was sent.
      Counting starts the day after the notice date and the last counted day is included. If the
      buyer releases the contingency in time the agreement continues without it; otherwise, and also
      when the contingency deadline passes unsatisfied, the buyer's cancellation with basis kick_out or
      sale_contingency_not_met refunds every deposit except the lot premium deposit, which follows
      lot_premium_deposit_refundable.
    eligibility:
      - id: kick_out_window
        applies_to: [purchase_contingency_released]
        kind: time
        condition: "The contingency must be released within kick_out_response_days calendar days after the kick-out notice was sent."
        evidence_fields: [purchase_events.event_date, purchase_events.notice_type, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the kick-out notice was sent
          anchor_source: purchase_events.event_date
          relation: not_after
          duration_source: variants.kick_out_response_days
          unit: calendar_days
          counting_rule: Counting starts the day after the notice date and the last counted day is included
          boundary: inclusive

  - id: purchase_closing_schedule
    subject: [purchase_closing_scheduled, purchase_closing_extended, purchase_charge_assessed, purchase_notice_sent]
    rule: >-
      The scheduled closing date must be at least closing_notice_days calendar days after the date of
      the closing_date_notice, and the new home orientation is held orientation_days_before_closing
      days before it. A buyer may move the scheduled closing date later up to closing_extension_max
      times; each extension adds closing_extension_days calendar days to the current scheduled closing
      date and carries closing_extension_fee_usd as a closing_extension_fee charge. A closing extension is written only on an agreement whose status is closing_scheduled.
      When the buyer does not close on the scheduled closing date for a reason on the buyer's side, a
      closing_delay_per_diem of per_diem_usd per calendar day accrues from the day after
      per_diem_grace_days have elapsed, booked as one charge per delay period with its first and last
      day; once purchase_msr_buyer_delay_days exceeds max_buyer_delay_days Calloway sends a
      default_notice under purchase_default_termination. A move of the closing date caused by a
      builder delay is written as a closing extension without fee, does not use one of the buyer's
      extensions and accrues no per diem.
    eligibility:
      - id: extension_state
        applies_to: [purchase_closing_extended]
        kind: state
        condition: "A closing extension is written only on an agreement whose status is closing_scheduled."
        evidence_fields: [purchase_agreements.status, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        state_contract:
          field: purchase_agreements.status
          allowed: [closing_scheduled]
    params:
      per_tier:
        Pathway Collection: {extension_fee: "=closing_extension_fee_usd", per_diem: "=per_diem_usd", grace_days: "=per_diem_grace_days"}
        Meadow Collection: {extension_fee: "=closing_extension_fee_usd", per_diem: "=per_diem_usd", grace_days: "=per_diem_grace_days"}
        Heritage Collection: {extension_fee: "=closing_extension_fee_usd", per_diem: "=per_diem_usd", grace_days: "=per_diem_grace_days"}
        Crestview Collection: {extension_fee: "=closing_extension_fee_usd", per_diem: "=per_diem_usd", grace_days: "=per_diem_grace_days"}
        Summit Collection: {extension_fee: "=closing_extension_fee_usd", per_diem: "=per_diem_usd", grace_days: "=per_diem_grace_days"}
        Reserve Collection: {extension_fee: "=closing_extension_fee_usd", per_diem: "=per_diem_usd", grace_days: "=per_diem_grace_days"}
    formula:
      per_diem_days: max(purchase_msr_buyer_delay_days - per_diem_grace_days, 0)
      per_diem_charge: per_diem_days * per_diem_usd
    measures: [purchase_msr_buyer_delay_days]

  - id: purchase_builder_delay
    subject: [purchase_cancelled, purchase_deposit_refunded, purchase_closing_extended, purchase_stage_updated]
    rule: >-
      Each construction stage update refreshes the estimated completion date; the contract completion
      date stated at signing never changes. A cancellation request with basis builder_delay is honored only when the home is not complete and the request is received no earlier than builder_delay_tolerance_days calendar days after the contract completion date.
      Counting starts the day after the contract completion date and the request may be honored on the
      last counted day. On such a cancellation every deposit is refunded, the lot premium deposit and
      transferred reservation funds included, and no mutual release fee is charged. Where
      builder_delay_lock_extension_paid is true, rate lock extension charges caused by a builder delay
      are borne by Calloway and waived on the lock.
    eligibility:
      - id: builder_delay_threshold
        applies_to: [purchase_cancelled]
        kind: time
        condition: "A cancellation request with basis builder_delay is honored only when the home is not complete and the request is received no earlier than builder_delay_tolerance_days calendar days after the contract completion date."
        evidence_fields: [purchase_agreements.contract_completion_date, purchase_agreements.construction_stage, purchase_cancellation_requests.received_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.contract_completion_date, purchase_cancellation_requests.received_date]
          action_bindings:
            purchase_agreements.contract_completion_date: contract_completion_date
            purchase_cancellation_requests.received_date: received_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract completion date
          anchor_source: purchase_agreements.contract_completion_date
          relation: not_before
          duration_source: variants.builder_delay_tolerance_days
          unit: calendar_days
          counting_rule: Counting starts the day after the contract completion date and the request may be honored on the last counted day
          boundary: inclusive

  - id: purchase_default_termination
    subject: [purchase_terminated, purchase_deposit_forfeited, purchase_deposit_refunded, purchase_notice_sent]
    rule: >-
      A buyer default is a missed additional deposit, an uncured returned payment, a missed loan
      application, approval or proof of funds deadline, or a buyer delay beyond max_buyer_delay_days.
      Calloway first sends a default_notice. The agreement may be terminated only when at least default_cure_days calendar days have passed since the default notice was sent.
      Counting starts the day after the notice date and termination is allowed on the last counted
      day, provided the default is still uncured. On termination Calloway retains deposits up to
      default_forfeiture_cap_pct percent of the contract price (rounded half up to the cent), taking the
      lot premium deposit first, then the additional deposit, then initial earnest money and
      transferred reservation funds; any deposit beyond the cap is refunded with reason
      excess_over_forfeiture_cap. Outstanding charges remain owed.
    eligibility:
      - id: cure_period
        applies_to: [purchase_terminated]
        kind: time
        condition: "The agreement may be terminated only when at least default_cure_days calendar days have passed since the default notice was sent."
        evidence_fields: [purchase_events.event_date, purchase_events.notice_type, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the default notice was sent
          anchor_source: purchase_events.event_date
          relation: not_before
          duration_source: variants.default_cure_days
          unit: calendar_days
          counting_rule: Counting starts the day after the notice date and termination is allowed on the last counted day
          boundary: inclusive
    formula:
      forfeiture_cap: round(contract_price * default_forfeiture_cap_pct / 100, 2)

  - id: purchase_incentives
    subject: [purchase_incentive_granted, purchase_incentive_revoked, purchase_incentive_applied]
    rule: >-
      At ratification the agreement is granted closing_cost_incentive_usd as closing_cost_credit and
      rate_buydown_incentive_usd as rate_buydown_credit when financing_type is calloway_home_mortgage
      (where incentive_requires_affiliated_lender is true) and the buyer closes with Calloway Title
      (where incentive_requires_affiliated_title is true); a cash or outside-lender agreement receives
      no incentive. When financing_type later changes away from calloway_home_mortgage, every granted
      incentive is revoked on the change date. At closing the incentives are applied in the order
      rate_buydown_credit then closing_cost_credit, and their total may not exceed the seller
      concession cap: concession_cap_pct for the loan_program on the buyer's Calloway Home Mortgage
      rate lock, times the contract price, rounded half up to the cent; the part above the cap is
      revoked, not paid in cash. On an inventory home, incentives apply only when the closing happens within incentive_close_by_days calendar days after the contract date.
      Counting starts the day after the contract date and a closing on the last counted day
      qualifies; otherwise the incentives are revoked on the closing date.
    eligibility:
      - id: inventory_close_by
        applies_to: [purchase_incentive_applied]
        kind: time
        condition: "On an inventory home, incentives apply only when the closing happens within incentive_close_by_days calendar days after the contract date."
        evidence_fields: [purchase_agreements.contract_date, purchase_agreements.inventory_home, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract date
          anchor_source: purchase_agreements.contract_date
          relation: not_after
          duration_source: variants.incentive_close_by_days
          unit: calendar_days
          counting_rule: Counting starts the day after the contract date and a closing on the last counted day qualifies
          boundary: inclusive
    params:
      concession_cap_pct: {conventional: 3.0, fha: 6.0, va: 4.0, usda: 6.0, jumbo: 2.0}
    formula:
      concession_cap: round(contract_price * concession_cap_pct / 100, 2)

  - id: purchase_charge_waiver
    subject: [purchase_charge_waived, purchase_charges_collected]
    rule: >-
      A closing_extension_fee or closing_delay_per_diem is waived in full when the extension or delay
      was caused by a builder delay recorded on the agreement; returned_payment_fee, plan_change_fee,
      lot_transfer_fee, contract_amendment_fee and mutual_release_fee are never waived. Each waiver
      points to the charge number it waives. A charge is waived at most once and a charge already collected is not waived.
      Charges not waived are collected on the closing date, one collection row per charge.
    eligibility:
      - id: single_waiver
        applies_to: [purchase_charge_waived]
        kind: dedup
        condition: "A charge is waived at most once and a charge already collected is not waived."
        evidence_fields: [purchase_events.source_charge_ref, purchase_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_events.source_charge_ref]
          action_bindings:
            purchase_events.source_charge_ref: source_charge_ref
        dedup_contract:
          table: purchase_events
          mode: separate_record
          object_bindings: {source_charge_ref: source_charge_ref}
          duplicate_filters: {event_type: [purchase_charge_waived, purchase_charges_collected]}
          distinct_fields: []

  - id: purchase_plan_lot_changes
    subject: [purchase_plan_changed, purchase_lot_transferred, purchase_charge_assessed]
    rule: >-
      A plan or elevation change is accepted only while construction_stage is not_started, the stage
      named by plan_change_cutoff_stage; it carries plan_change_fee_usd and re-prices the agreement at
      the new plan's base price on the amendment date. A homesite transfer within the same community
      is accepted up to max_lot_transfers times, carries lot_transfer_fee_usd and re-prices the lot
      premium; it is accepted only while construction_stage is not_started. A plan change or homesite transfer is written only while the construction stage is not_started.
      Other buyer-requested amendments carry contract_amendment_fee_usd. Assignment of the agreement
      to another person is refused where assignment_allowed is false. A change that moves the contract
      price re-computes the earnest money under purchase_earnest_money and any shortfall is due within
      em_due_business_days business days.
    eligibility:
      - id: pre_start_only
        applies_to: [purchase_plan_changed, purchase_lot_transferred]
        kind: state
        condition: "A plan change or homesite transfer is written only while the construction stage is not_started."
        evidence_fields: [purchase_agreements.construction_stage, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        state_contract:
          field: purchase_agreements.construction_stage
          allowed: [not_started]

  - id: purchase_returned_payment
    subject: [purchase_payment_returned, purchase_charge_assessed, purchase_deposit_posted]
    rule: >-
      A returned deposit payment comes off the deposits held and a returned_payment_fee of
      returned_payment_fee_usd is charged. Replacement funds and the fee must post within returned_payment_cure_business_days business days after the date Calloway was notified of the return.
      Business days are Monday through Friday excluding Calloway holidays and counting starts the next
      business day after the notification date. Replacement funds must come by wire. An uncured return
      on a ratified agreement is a buyer default under purchase_default_termination; on an agreement
      still pending_ratification it simply leaves the signing deposits unfunded.
    eligibility:
      - id: return_cure_window
        applies_to: [purchase_deposit_posted]
        kind: time
        condition: "Replacement funds and the fee must post within returned_payment_cure_business_days business days after the date Calloway was notified of the return."
        evidence_fields: [purchase_events.event_date, purchase_events.source_payment_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_events.source_payment_ref]
          action_bindings:
            purchase_events.source_payment_ref: source_payment_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the date Calloway was notified of the return
          anchor_source: purchase_events.event_date
          relation: not_after
          duration_source: variants.returned_payment_cure_business_days
          unit: business_days
          counting_rule: Business days are Monday through Friday excluding Calloway holidays and counting starts the next business day after the notification date
          boundary: inclusive

  - id: purchase_cancellation_refund
    subject: [purchase_cancelled, purchase_deposit_refunded, purchase_deposit_forfeited, purchase_charge_assessed]
    rule: >-
      Every buyer cancellation starts as a cancellation request recorded with its basis and the date it
      was received, and takes effect only when the buyer confirms it. A mutual release (basis
      mutual_release, including a late rescission or late financing-denial request) refunds the initial
      earnest money, additional deposit, contingency deposit and transferred reservation deposit less
      mutual_release_fee_usd, which is booked as a mutual_release_fee charge and collected by deduction
      from the refund; the lot premium deposit is forfeited with reason cancellation_non_refundable
      unless lot_premium_deposit_refundable is true. Rescission, financing denial, contingency and
      builder-delay cancellations carry no mutual release fee. Refunds are issued within
      refund_processing_business_days business days after the cancellation date, one refund row per
      source payment and component.
    eligibility: []

  - id: purchase_construction_and_closing
    subject: [purchase_construction_started, purchase_stage_updated, purchase_closing_scheduled, purchase_closed, purchase_deposit_applied, purchase_charges_collected, purchase_agreement_written]
    rule: >-
      Construction starts only on a ratified agreement and the system records each stage in the order
      not_started, foundation, framing, drywall, finishes, complete. The closing date may be set on an
      inventory home once ratified and on a to-be-built home once construction_stage is finishes or
      complete. The agreement closes only when construction_stage is complete, every deposit due has
      posted, and the buyer's loan has funded (or cash has been received). The contract price on a new
      agreement must equal base price plus lot premium, and the base price must sit within the
      collection's base_price_floor_usd and base_price_ceiling_usd. At closing every deposit held is credited to the
      buyer, every unwaived charge is collected and incentives are applied under purchase_incentives.
      Closing is written only when the construction stage is complete.
    eligibility:
      - id: complete_home
        applies_to: [purchase_closed]
        kind: authorization
        condition: "Closing is written only when the construction stage is complete."
        evidence_fields: [purchase_agreements.construction_stage, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id

extended_policies:
  - id: purchase_ext_closing_delay_per_diem
    base_policy_refs: [purchase_closing_schedule, purchase_plan_lot_changes, purchase_returned_payment, purchase_cancellation_refund]
    overwrite:
      - base_policy: purchase_closing_schedule
        superseded_clause: >-
          a closing_delay_per_diem of per_diem_usd per calendar day accrues from the day after
          per_diem_grace_days have elapsed, booked as one charge per delay period with its first and last day
        replaced_by: >-
          The delay period's first day, its last day, its grace days and its daily rate are set by the
          rules below, and the period is booked as one closing delay per diem charge that records the
          period's first day and last day.
    trigger: state_due
    subject: [purchase_charge_assessed]
    computes: amount
    target_tool: assess_closing_delay_per_diem_8d15ee11
    params:
      options_total_high_usd: 75000
      options_total_mid_usd: 40000
      per_diem_multiplier_high: 1.25
      per_diem_multiplier_mid: 1.10
      deposit_cover_high_pct: 12
      deposit_cover_mid_pct: 8
      deposit_cover_multiplier_high: 0.80
      deposit_cover_multiplier_mid: 0.90
    rule: >-
      A closing delay per diem is owed when the buyer has not closed on the scheduled closing date of an
      agreement in status closing_scheduled for a reason on the buyer's side, and it is booked as one
      charge covering one delay period. The delay period's first day, its last day, its grace days and
      its daily rate are set by the rules below, and the period is booked as one closing delay per diem
      charge that records the period's first day and last day.
      The standard per diem is figured as follows. The delay period runs from the day after the
      scheduled closing date through the day before the date the per diem is booked, both days included.
      The first per_diem_grace_days days of the period are grace days and are not billed. Every other day
      of the period is a billed day, charged at the daily rate of per_diem_usd. The per diem is the daily
      rate times the number of billed days, rounded half up to the cent.
      The day the delay period starts depends on whether Calloway's own dates let the buyer close on the
      scheduled closing date: where the construction stage is complete and the home's estimated
      completion date falls after the scheduled closing date, the period starts on the day after the
      estimated completion date; where the estimated completion date falls on or before the scheduled
      closing date and the latest closing date notice was sent fewer than closing_notice_days calendar
      days before the scheduled closing date, the period starts on the day after the date that falls
      closing_notice_days calendar days after that notice; otherwise the period starts on the day after
      the scheduled closing date.
      The day the delay period ends depends on what has taken over from the buyer delay: where the ledger
      carries a closing extension fee charge dated after the scheduled closing date, the period ends on
      the day before the latest such charge date; where no such charge stands and a default notice dated
      after the scheduled closing date has been sent, the period ends on the date of the latest default
      notice; otherwise the period ends on the day before the date the per diem is booked.
      The grace days shrink once the buyer has asked to extend the closing: where the ledger carries two
      or more closing extension fee charges, the period has no grace days; where it carries exactly one,
      the period's grace days are one day fewer than per_diem_grace_days, never fewer than zero; otherwise
      the grace days are the first per_diem_grace_days days.
      The daily rate carries the studio options Calloway is holding in the finished home: where the
      buyer's Design Studio Selections file for the agreement is finalized or delivered and its option
      total is at least options_total_high_usd, per_diem_usd is multiplied by per_diem_multiplier_high;
      where the file is finalized or delivered and its option total is at least options_total_mid_usd but
      below options_total_high_usd, per_diem_usd is multiplied by per_diem_multiplier_mid; otherwise the
      studio options multiplier is one.
      The daily rate is eased where the buyer's deposits already cover Calloway's carrying risk: the
      deposits held are every deposit posted to the agreement less every deposit refunded, forfeited,
      applied or returned unpaid; where the deposits held are at least deposit_cover_high_pct percent of
      the contract price, the deposit cover multiplier is deposit_cover_multiplier_high; where they are at
      least deposit_cover_mid_pct percent but below deposit_cover_high_pct percent, it is
      deposit_cover_multiplier_mid; otherwise the deposit cover multiplier is one.
      The daily rate is per_diem_usd times the studio options multiplier times the deposit cover
      multiplier, rounded half up to the cent once, and that rounded daily rate is the rate every billed
      day is charged at. The days of the period are counted from its first day through its last day, both
      included; the billed days are the days of the period less its grace days, never fewer than zero.
    prerequisite: []
    cross_category:
      - category: design
        as: branch
        reads: [status, option_total]
        note: The studio options multiplier of the daily rate is decided from the buyer's Design Studio Selections file status and option total.
    compute:
      - now_offset: "DAYS(F('scheduled_closing_date'), NOW)"
      - completion_offset: "DAYS(F('scheduled_closing_date'), F('estimated_completion_date'))"
      - notice_lead: "DAYS(LATEST('purchase_events', 'event_date', event_type='purchase_notice_sent', notice_type='closing_date_notice'), F('scheduled_closing_date'))"
      - first_day_offset: "completion_offset + 1 if completion_offset > 0 and F('construction_stage') == 'complete' else (P('closing_notice_days') - notice_lead + 1 if completion_offset <= 0 and notice_lead < P('closing_notice_days') else 1)"
      - request_count: "COUNT('purchase_events', event_type='purchase_charge_assessed', charge_type='closing_extension_fee')"
      - request_offset: "DAYS(F('scheduled_closing_date'), LATEST('purchase_events', 'event_date', event_type='purchase_charge_assessed', charge_type='closing_extension_fee')) if request_count > 0 else 0"
      - default_count: "COUNT('purchase_events', event_type='purchase_notice_sent', notice_type='default_notice')"
      - default_offset: "DAYS(F('scheduled_closing_date'), LATEST('purchase_events', 'event_date', event_type='purchase_notice_sent', notice_type='default_notice')) if default_count > 0 else 0"
      - last_day_offset: "request_offset - 1 if request_count > 0 and request_offset > 0 else (default_offset if default_count > 0 and default_offset > 0 else now_offset - 1)"
      - period_days: "MX(0, last_day_offset - first_day_offset + 1)"
      - extension_request_count: "COUNT('purchase_events', event_type='purchase_charge_assessed', charge_type='closing_extension_fee')"
      - grace_days: "0 if extension_request_count >= 2 else (MX(0, P('per_diem_grace_days') - 1) if extension_request_count == 1 else P('per_diem_grace_days'))"
      - billed_days: "MX(0, period_days - grace_days)"
      - design_status: "CFIELD('design', 'status', purchase_id=HID)"
      - design_option_total: "CFIELD('design', 'option_total', purchase_id=HID)"
      - options_multiplier: "K('per_diem_multiplier_high') if (design_status == 'finalized' or design_status == 'delivered') and design_option_total >= K('options_total_high_usd') else (K('per_diem_multiplier_mid') if (design_status == 'finalized' or design_status == 'delivered') and design_option_total >= K('options_total_mid_usd') else 1)"
      - deposits_in: "SUM('purchase_events', 'amount', event_type='purchase_deposit_posted')"
      - deposits_out: "SUM('purchase_events', 'amount', event_type='purchase_deposit_refunded') + SUM('purchase_events', 'amount', event_type='purchase_deposit_forfeited') + SUM('purchase_events', 'amount', event_type='purchase_deposit_applied') + SUM('purchase_events', 'amount', event_type='purchase_payment_returned')"
      - deposit_cover_pct: "(deposits_in - deposits_out) * 100 / F('contract_price')"
      - cover_multiplier: "K('deposit_cover_multiplier_high') if deposit_cover_pct >= K('deposit_cover_high_pct') else (K('deposit_cover_multiplier_mid') if deposit_cover_pct >= K('deposit_cover_mid_pct') else 1)"
      - daily_rate: "RND(P('per_diem_usd') * options_multiplier * cover_multiplier, 2)"
      - result: "RND(daily_rate * billed_days, 2)"
    compute_basis:
      now_offset: "the day before the date the per diem is booked"
      completion_offset: "where the construction stage is complete and the home's estimated completion date falls after the scheduled closing date, the period starts on the day after the estimated completion date"
      notice_lead: "the latest closing date notice was sent fewer than closing_notice_days calendar days before the scheduled closing date"
      first_day_offset: "where the construction stage is complete and the home's estimated completion date falls after the scheduled closing date, the period starts on the day after the estimated completion date; where the estimated completion date falls on or before the scheduled closing date and the latest closing date notice was sent fewer than closing_notice_days calendar days before the scheduled closing date, the period starts on the day after the date that falls closing_notice_days calendar days after that notice; otherwise the period starts on the day after the scheduled closing date."
      request_count: "where the ledger carries a closing extension fee charge dated after the scheduled closing date, the period ends on the day before the latest such charge date"
      request_offset: "the period ends on the day before the latest such charge date"
      default_count: "where no such charge stands and a default notice dated after the scheduled closing date has been sent, the period ends on the date of the latest default notice"
      default_offset: "the period ends on the date of the latest default notice"
      last_day_offset: "where the ledger carries a closing extension fee charge dated after the scheduled closing date, the period ends on the day before the latest such charge date; where no such charge stands and a default notice dated after the scheduled closing date has been sent, the period ends on the date of the latest default notice; otherwise the period ends on the day before the date the per diem is booked."
      period_days: "The days of the period are counted from its first day through its last day, both included"
      extension_request_count: "where the ledger carries two or more closing extension fee charges, the period has no grace days; where it carries exactly one, the period's grace days are one day fewer than per_diem_grace_days, never fewer than zero"
      grace_days: "where the ledger carries two or more closing extension fee charges, the period has no grace days; where it carries exactly one, the period's grace days are one day fewer than per_diem_grace_days, never fewer than zero; otherwise the grace days are the first per_diem_grace_days days."
      billed_days: "the billed days are the days of the period less its grace days, never fewer than zero."
      design_status: "where the buyer's Design Studio Selections file for the agreement is finalized or delivered"
      design_option_total: "and its option total is at least options_total_high_usd"
      options_multiplier: "where the buyer's Design Studio Selections file for the agreement is finalized or delivered and its option total is at least options_total_high_usd, per_diem_usd is multiplied by per_diem_multiplier_high; where the file is finalized or delivered and its option total is at least options_total_mid_usd but below options_total_high_usd, per_diem_usd is multiplied by per_diem_multiplier_mid; otherwise the studio options multiplier is one."
      deposits_in: "the deposits held are every deposit posted to the agreement less every deposit refunded, forfeited, applied or returned unpaid"
      deposits_out: "less every deposit refunded, forfeited, applied or returned unpaid"
      deposit_cover_pct: "where the deposits held are at least deposit_cover_high_pct percent of the contract price"
      cover_multiplier: "where the deposits held are at least deposit_cover_high_pct percent of the contract price, the deposit cover multiplier is deposit_cover_multiplier_high; where they are at least deposit_cover_mid_pct percent but below deposit_cover_high_pct percent, it is deposit_cover_multiplier_mid; otherwise the deposit cover multiplier is one."
      daily_rate: "The daily rate is per_diem_usd times the studio options multiplier times the deposit cover multiplier, rounded half up to the cent once, and that rounded daily rate is the rate every billed day is charged at."
      result: "The per diem is the daily rate times the number of billed days, rounded half up to the cent."
    factors:
      - id: delay_start
        effect: method
        decides: first_day_offset
        bindings: [completion_offset, notice_lead, first_day_offset]
        ladder:
          - when: "the construction stage is complete and the estimated completion date falls after the scheduled closing date"
            method: "the delay period starts on the day after the estimated completion date"
          - when: "the estimated completion date falls on or before the scheduled closing date and the latest closing date notice was sent fewer than closing_notice_days days before the scheduled closing date"
            method: "the delay period starts on the day after the date closing_notice_days days after that notice"
          - when: "otherwise"
            method: "the delay period starts on the day after the scheduled closing date"
        baseline:
          first_day_offset: "1"
        evidence: [date, history]
        cross_difficulty: null
      - id: delay_end
        effect: method
        decides: last_day_offset
        bindings: [request_count, request_offset, default_count, default_offset, last_day_offset]
        ladder:
          - when: "a closing extension fee charge dated after the scheduled closing date stands on the ledger"
            method: "the delay period ends on the day before the latest such charge date"
          - when: "no such charge stands and a default notice dated after the scheduled closing date has been sent"
            method: "the delay period ends on the date of the latest default notice"
          - when: "otherwise"
            method: "the delay period ends on the day before the booking date"
        baseline:
          last_day_offset: "now_offset - 1"
        evidence: [history, date]
        cross_difficulty: null
      - id: request_grace
        effect: parameter
        decides: grace_days
        bindings: [extension_request_count, grace_days]
        ladder:
          - when: "two or more closing extension fee charges stand on the ledger"
            value: "0"
          - when: "exactly one closing extension fee charge stands on the ledger"
            value: "per_diem_grace_days less one day, never below zero"
          - when: "otherwise"
            value: "P('per_diem_grace_days')"
        baseline:
          grace_days: "P('per_diem_grace_days')"
        evidence: [history]
        cross_difficulty: null
      - id: studio_options_rate
        effect: parameter
        decides: options_multiplier
        bindings: [design_status, design_option_total, options_multiplier]
        ladder:
          - when: "the Design Studio Selections file is finalized or delivered and its option total is at least options_total_high_usd"
            value: "K('per_diem_multiplier_high')"
          - when: "the Design Studio Selections file is finalized or delivered and its option total is at least options_total_mid_usd but below options_total_high_usd"
            value: "K('per_diem_multiplier_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          options_multiplier: "1"
        evidence: [cross_category]
        cross_difficulty: design
      - id: deposit_cover_rate
        effect: parameter
        decides: cover_multiplier
        bindings: [deposits_in, deposits_out, deposit_cover_pct, cover_multiplier]
        ladder:
          - when: "deposits held are at least deposit_cover_high_pct percent of the contract price"
            value: "K('deposit_cover_multiplier_high')"
          - when: "deposits held are at least deposit_cover_mid_pct percent but below deposit_cover_high_pct percent of the contract price"
            value: "K('deposit_cover_multiplier_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          cover_multiplier: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard per diem is figured as follows. The delay period runs from the day after the
        scheduled closing date through the day before the date the per diem is booked, both days included.
        The first per_diem_grace_days days of the period are grace days and are not billed. Every other day
        of the period is a billed day, charged at the daily rate of per_diem_usd. The per diem is the daily
        rate times the number of billed days, rounded half up to the cent.
      params: [per_diem_usd, per_diem_grace_days]
    inputs:
      history:
        - {table: purchase_events, aggregate: latest, field: event_date, filters: {event_type: purchase_notice_sent, notice_type: closing_date_notice}}
        - {table: purchase_events, aggregate: count, field: amount, filters: {event_type: purchase_charge_assessed, charge_type: closing_extension_fee}}
        - {table: purchase_events, aggregate: latest, field: event_date, filters: {event_type: purchase_charge_assessed, charge_type: closing_extension_fee}}
        - {table: purchase_events, aggregate: count, field: event_date, filters: {event_type: purchase_notice_sent, notice_type: default_notice}}
        - {table: purchase_events, aggregate: sum, field: amount, filters: {event_type: purchase_deposit_posted}}
        - {table: purchase_events, aggregate: sum, field: amount, filters: {event_type: [purchase_deposit_refunded, purchase_deposit_forfeited, purchase_deposit_applied, purchase_payment_returned]}}
      cross_category: [design]

  - id: purchase_ext_buyer_closing_extension
    base_policy_refs: [purchase_closing_schedule, purchase_builder_delay]
    overwrite:
      - base_policy: purchase_closing_schedule
        superseded_clause: >-
          each extension adds closing_extension_days calendar days to the current scheduled closing date
        replaced_by: >-
          Under the rules below, the new closing date is the day reached by counting the base length and any
          courtesy days from the day the extension counts from, moved off a weekend.
    trigger: on_request
    subject: [purchase_closing_extended]
    computes: extension_days
    target_tool: sign_closing_extension_addendum_c0ddd0a3
    params:
      switched_lender_extension_days: 21
      outside_lender_extension_days: 18
      slip_long_days: 21
      slip_courtesy_long_days: 14
      slip_courtesy_short_days: 7
    rule: >-
      A buyer-requested closing extension moves the scheduled closing date of an agreement in status
      closing_scheduled later by a number of calendar days; the buyer signs the extension addendum, the
      extension counts toward the buyer's closing extensions, and its closing extension fee is charged when
      the request is received. Where the buyer asks for the extension after the scheduled closing date has
      passed, the new closing date is set only after the ledger carries closing delay per diem for every
      day of buyer delay before the extension request was received.
      The standard extension counts from the current scheduled closing date and adds
      closing_extension_days calendar days, and the new closing date is the day reached. The extension's
      length is the number of calendar days from the current scheduled closing date to the new closing
      date. Under the rules below, the new closing date is the day reached by counting the base length and
      any courtesy days from the day the extension counts from, moved off a weekend.
      The day the extension counts from depends on what the ledger already shows: where the ledger carries
      closing delay per diem whose latest delay period ends on or after the scheduled closing date, the
      extension counts from the last day of that period; where no per diem has been charged, the scheduled
      closing date has passed and the home's estimated completion date falls after the scheduled closing
      date, the extension counts from the estimated completion date; otherwise the extension counts from
      the current scheduled closing date.
      The base length follows how the buyer is financing: where the agreement's financing type is
      outside_lender and the buyer has withdrawn a Calloway Home Mortgage rate lock, the base length is
      switched_lender_extension_days calendar days; where the financing type is outside_lender and no
      withdrawn Calloway Home Mortgage rate lock stands, the base length is outside_lender_extension_days
      calendar days; otherwise the base length is closing_extension_days calendar days.
      Calloway adds courtesy days where its own construction ran late: where the estimated completion date
      fell more than slip_long_days calendar days after the contract completion date, slip_courtesy_long_days
      courtesy days are added; where it fell after the contract completion date by slip_long_days calendar
      days or fewer, slip_courtesy_short_days courtesy days are added; otherwise no courtesy days are added.
      A closing is never set on a weekend and moves to the nearest weekday: where the day reached falls on a
      Saturday, the new closing date is the Friday before it; where it falls on a Sunday, the new closing
      date is the Monday after it; otherwise the new closing date is the day reached.
    prerequisite:
      - problem: purchase_ext_closing_delay_per_diem
        kind: value_input
        gate: last_charged_offset
        form: state
        policy_source: >-
          Where the buyer asks for the extension after the scheduled closing date has passed, the new
          closing date is set only after the ledger carries closing delay per diem for every day of buyer
          delay before the extension request was received.
        condition: >-
          purchase_events carries a purchase_charge_assessed row with charge_type closing_delay_per_diem for
          the agreement whose period_end is the day before the latest closing_extension_fee charge date, so
          the latest per diem period ends on or after the scheduled closing date.
        resolved_by: assess_closing_delay_per_diem_8d15ee11
        effect: >-
          Once the per diem for the buyer-delay days is booked, the extension's counting day becomes the last
          day of that per diem period instead of the fallback counting day, so the new closing date and the
          extension's length move later by the days of booked buyer delay.
    cross_category:
      - category: lock
        as: existence
        reads: [status]
        note: The base length of the extension is decided from whether the buyer holds a withdrawn Calloway Home Mortgage rate lock.
    compute:
      - now_offset: "DAYS(F('scheduled_closing_date'), NOW)"
      - perdiem_count: "COUNT('purchase_events', event_type='purchase_charge_assessed', charge_type='closing_delay_per_diem')"
      - last_charged_offset: "DAYS(F('scheduled_closing_date'), LATEST('purchase_events', 'period_end', date_field='period_end', event_type='purchase_charge_assessed', charge_type='closing_delay_per_diem')) if perdiem_count > 0 else -1"
      - completion_lag: "DAYS(F('scheduled_closing_date'), F('estimated_completion_date'))"
      - start_offset: "last_charged_offset if perdiem_count > 0 and last_charged_offset >= 0 else (completion_lag if perdiem_count == 0 and now_offset > 0 and completion_lag > 0 else 0)"
      - lock_withdrawn: "EXISTS('lock', status='withdrawn')"
      - base_length: "K('switched_lender_extension_days') if F('financing_type') == 'outside_lender' and lock_withdrawn else (K('outside_lender_extension_days') if F('financing_type') == 'outside_lender' else P('closing_extension_days'))"
      - contract_slip: "DAYS(F('contract_completion_date'), F('estimated_completion_date'))"
      - courtesy_days: "K('slip_courtesy_long_days') if contract_slip > K('slip_long_days') else (K('slip_courtesy_short_days') if contract_slip > 0 else 0)"
      - reached_offset: "start_offset + base_length + courtesy_days"
      - reached_weekday: "(DAYS('2026-01-05', F('scheduled_closing_date')) + reached_offset) % 7"
      - rolled_offset: "reached_offset - 1 if reached_weekday == 5 else (reached_offset + 1 if reached_weekday == 6 else reached_offset)"
      - result: "rolled_offset"
    compute_basis:
      now_offset: "the scheduled closing date has passed"
      perdiem_count: "where the ledger carries closing delay per diem whose latest delay period ends on or after the scheduled closing date"
      last_charged_offset: "the extension counts from the last day of that period"
      completion_lag: "the home's estimated completion date falls after the scheduled closing date, the extension counts from the estimated completion date"
      start_offset: "where the ledger carries closing delay per diem whose latest delay period ends on or after the scheduled closing date, the extension counts from the last day of that period; where no per diem has been charged, the scheduled closing date has passed and the home's estimated completion date falls after the scheduled closing date, the extension counts from the estimated completion date; otherwise the extension counts from the current scheduled closing date."
      lock_withdrawn: "the buyer has withdrawn a Calloway Home Mortgage rate lock"
      base_length: "where the agreement's financing type is outside_lender and the buyer has withdrawn a Calloway Home Mortgage rate lock, the base length is switched_lender_extension_days calendar days; where the financing type is outside_lender and no withdrawn Calloway Home Mortgage rate lock stands, the base length is outside_lender_extension_days calendar days; otherwise the base length is closing_extension_days calendar days."
      contract_slip: "where the estimated completion date fell more than slip_long_days calendar days after the contract completion date"
      courtesy_days: "where the estimated completion date fell more than slip_long_days calendar days after the contract completion date, slip_courtesy_long_days courtesy days are added; where it fell after the contract completion date by slip_long_days calendar days or fewer, slip_courtesy_short_days courtesy days are added; otherwise no courtesy days are added."
      reached_offset: "the new closing date is the day reached by counting the base length and any courtesy days from the day the extension counts from, moved off a weekend"
      reached_weekday: "where the day reached falls on a Saturday"
      rolled_offset: "where the day reached falls on a Saturday, the new closing date is the Friday before it; where it falls on a Sunday, the new closing date is the Monday after it; otherwise the new closing date is the day reached."
      result: "The extension's length is the number of calendar days from the current scheduled closing date to the new closing date"
    factors:
      - id: extension_counting_day
        effect: method
        decides: start_offset
        bindings: [now_offset, perdiem_count, last_charged_offset, completion_lag, start_offset]
        ladder:
          - when: "closing delay per diem stands on the ledger and its latest delay period ends on or after the scheduled closing date"
            method: "the extension counts from the last day of that per diem period"
          - when: "no per diem has been charged, the scheduled closing date has passed and the estimated completion date falls after the scheduled closing date"
            method: "the extension counts from the estimated completion date"
          - when: "otherwise"
            method: "the extension counts from the current scheduled closing date"
        baseline:
          start_offset: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: financing_base_length
        effect: parameter
        decides: base_length
        bindings: [lock_withdrawn, base_length]
        ladder:
          - when: "financing type outside_lender and a withdrawn Calloway Home Mortgage rate lock stands for the buyer"
            value: "K('switched_lender_extension_days')"
          - when: "financing type outside_lender and no withdrawn Calloway Home Mortgage rate lock stands"
            value: "K('outside_lender_extension_days')"
          - when: "otherwise"
            value: "P('closing_extension_days')"
        baseline:
          base_length: "P('closing_extension_days')"
        evidence: [cross_category]
        cross_difficulty: lock
      - id: construction_slip_courtesy
        effect: parameter
        decides: courtesy_days
        bindings: [contract_slip, courtesy_days]
        ladder:
          - when: "the estimated completion date fell more than slip_long_days days after the contract completion date"
            value: "K('slip_courtesy_long_days')"
          - when: "the estimated completion date fell after the contract completion date by slip_long_days days or fewer"
            value: "K('slip_courtesy_short_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          courtesy_days: "0"
        evidence: [date]
        cross_difficulty: null
      - id: weekend_closing_roll
        effect: method
        decides: rolled_offset
        bindings: [reached_weekday, rolled_offset]
        ladder:
          - when: "the day reached falls on a Saturday"
            method: "the closing moves back to the Friday before the day reached"
          - when: "the day reached falls on a Sunday"
            method: "the closing moves forward to the Monday after the day reached"
          - when: "otherwise"
            method: "the new closing date is the day reached"
        baseline:
          rolled_offset: "reached_offset"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard extension counts from the current scheduled closing date and adds
        closing_extension_days calendar days, and the new closing date is the day reached. The extension's
        length is the number of calendar days from the current scheduled closing date to the new closing
        date.
      params: [closing_extension_days]
    inputs:
      history:
        - {table: purchase_events, aggregate: count, field: amount, filters: {event_type: purchase_charge_assessed, charge_type: closing_delay_per_diem}}
        - {table: purchase_events, aggregate: latest, field: period_end, filters: {event_type: purchase_charge_assessed, charge_type: closing_delay_per_diem}}
      cross_category: [lock]

  - id: purchase_ext_returned_payment_fee
    base_policy_refs: [purchase_closing_schedule, purchase_plan_lot_changes, purchase_returned_payment, purchase_cancellation_refund]
    overwrite:
      - base_policy: purchase_returned_payment
        superseded_clause: >-
          a returned_payment_fee of returned_payment_fee_usd is charged
        replaced_by: >-
          Each returned deposit payment carries one returned-payment fee charge, figured by the rules below.
    trigger: state_due
    subject: [purchase_charge_assessed]
    computes: amount
    target_tool: assess_returned_payment_fee_3b45ee8d
    params:
      repeat_return_surcharge_usd: 25
      both_products_surcharge_usd: 30
      one_product_surcharge_usd: 15
      large_item_charge_usd: 40
      mid_item_charge_usd: 15
      check_return_charge_usd: 15
      ach_return_charge_usd: 5
    rule: >-
      When the buyer's bank returns a deposit payment on a Home Purchase Agreement unpaid, the return comes
      off the deposits held and Calloway charges the buyer for it. Each returned deposit payment carries one
      returned-payment fee charge, figured by the rules below. The charge names the receipt number of the
      returned payment, the fee for one return is charged once, and the charge is dated the day it is booked;
      a return whose fee has not yet been booked carries it from the day the return is next handled.
      The standard returned-payment fee is returned_payment_fee_usd for each returned payment, with no
      surcharge.
      The fee steps up when returns repeat on the agreement: the returns counted are the returned payments
      the agreement's ledger shows in the twelve months up to the date the fee is charged, the one being
      charged included; where three or more are counted, the fee is returned_payment_fee_usd times the
      number of returns counted; where exactly two are counted, the fee is returned_payment_fee_usd plus
      repeat_return_surcharge_usd; otherwise the fee is returned_payment_fee_usd.
      A surcharge applies where the buyer's payments have also come back on other Calloway accounts in the
      same twelve months: where the buyer's Homesite Reservation ledger and the buyer's Design Studio ledger
      each show a returned payment in that period, both_products_surcharge_usd is added; where only one of
      them shows a returned payment in that period, one_product_surcharge_usd is added; otherwise nothing is
      added.
      The bank's handling charge for a large returned item is passed through: where the latest returned
      payment on the agreement is above wire_required_above_usd, large_item_charge_usd is added; where it is
      above half of wire_required_above_usd but not above wire_required_above_usd, mid_item_charge_usd is
      added; otherwise nothing is added.
      The return processing charge follows how the most recent deposit payment posted to the agreement was
      made: where it was paid by check, check_return_charge_usd is added; where it was paid by ACH,
      ach_return_charge_usd is added; otherwise nothing is added.
      The returned-payment fee charged is the stepped fee plus the other-account surcharge, the large-item
      charge and the processing charge, summed and rounded half up to the cent.
    prerequisite: []
    cross_category:
      - category: homesite
        as: history
        reads: [homesite_events.event_type, homesite_events.event_date]
        note: The other-account surcharge counts returned payments on the buyer's Homesite Reservation ledger.
      - category: design
        as: history
        reads: [design_events.event_type, design_events.event_date]
        note: The other-account surcharge counts returned payments on the buyer's Design Studio ledger.
    compute:
      - agreement_returns: "COUNT('purchase_events', within_months=12, event_type='purchase_payment_returned')"
      - stepped_fee: "P('returned_payment_fee_usd') * agreement_returns if agreement_returns >= 3 else (P('returned_payment_fee_usd') + K('repeat_return_surcharge_usd') if agreement_returns == 2 else P('returned_payment_fee_usd'))"
      - homesite_returns: "XCOUNT('homesite', 'homesite_events', within_months=12, event_type='homesite_payment_returned')"
      - design_returns: "XCOUNT('design', 'design_events', within_months=12, event_type='design_payment_returned')"
      - account_surcharge: "K('both_products_surcharge_usd') if homesite_returns >= 1 and design_returns >= 1 else (K('one_product_surcharge_usd') if homesite_returns >= 1 or design_returns >= 1 else 0)"
      - returned_item: "LATEST('purchase_events', 'amount', event_type='purchase_payment_returned')"
      - item_charge: "K('large_item_charge_usd') if returned_item > P('wire_required_above_usd') else (K('mid_item_charge_usd') if returned_item > P('wire_required_above_usd') / 2 else 0)"
      - latest_payment_method: "LATEST('purchase_events', 'payment_method', event_type='purchase_deposit_posted')"
      - processing_charge: "K('check_return_charge_usd') if latest_payment_method == 'check' else (K('ach_return_charge_usd') if latest_payment_method == 'ach' else 0)"
      - result: "RND(stepped_fee + account_surcharge + item_charge + processing_charge, 2)"
    compute_basis:
      agreement_returns: "the returns counted are the returned payments the agreement's ledger shows in the twelve months up to the date the fee is charged, the one being charged included"
      stepped_fee: "where three or more are counted, the fee is returned_payment_fee_usd times the number of returns counted; where exactly two are counted, the fee is returned_payment_fee_usd plus repeat_return_surcharge_usd; otherwise the fee is returned_payment_fee_usd."
      homesite_returns: "where the buyer's Homesite Reservation ledger and the buyer's Design Studio ledger each show a returned payment in that period"
      design_returns: "where the buyer's Homesite Reservation ledger and the buyer's Design Studio ledger each show a returned payment in that period"
      account_surcharge: "where the buyer's Homesite Reservation ledger and the buyer's Design Studio ledger each show a returned payment in that period, both_products_surcharge_usd is added; where only one of them shows a returned payment in that period, one_product_surcharge_usd is added; otherwise nothing is added."
      returned_item: "where the latest returned payment on the agreement is above wire_required_above_usd"
      item_charge: "where the latest returned payment on the agreement is above wire_required_above_usd, large_item_charge_usd is added; where it is above half of wire_required_above_usd but not above wire_required_above_usd, mid_item_charge_usd is added; otherwise nothing is added."
      latest_payment_method: "The return processing charge follows how the most recent deposit payment posted to the agreement was made"
      processing_charge: "where it was paid by check, check_return_charge_usd is added; where it was paid by ACH, ach_return_charge_usd is added; otherwise nothing is added."
      result: "The returned-payment fee charged is the stepped fee plus the other-account surcharge, the large-item charge and the processing charge, summed and rounded half up to the cent."
    factors:
      - id: repeat_return_step
        effect: method
        decides: stepped_fee
        bindings: [agreement_returns, stepped_fee]
        ladder:
          - when: "three or more returned payments on the agreement in the twelve months"
            method: "the fee is returned_payment_fee_usd multiplied by the number of returns counted"
          - when: "exactly two returned payments on the agreement in the twelve months"
            method: "the fee is returned_payment_fee_usd plus the flat repeat_return_surcharge_usd"
          - when: "otherwise"
            method: "the fee is returned_payment_fee_usd"
        baseline:
          stepped_fee: "P('returned_payment_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: other_account_returns
        effect: parameter
        decides: account_surcharge
        bindings: [homesite_returns, design_returns, account_surcharge]
        ladder:
          - when: "both the Homesite Reservation ledger and the Design Studio ledger show a returned payment in the twelve months"
            value: "K('both_products_surcharge_usd')"
          - when: "exactly one of those ledgers shows a returned payment in the twelve months"
            value: "K('one_product_surcharge_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          account_surcharge: "0"
        evidence: [history, cross_category]
        cross_difficulty: homesite
      - id: large_item_pass_through
        effect: parameter
        decides: item_charge
        bindings: [returned_item, item_charge]
        ladder:
          - when: "latest returned payment above wire_required_above_usd"
            value: "K('large_item_charge_usd')"
          - when: "latest returned payment above half of wire_required_above_usd and not above it"
            value: "K('mid_item_charge_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          item_charge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: return_processing_charge
        effect: parameter
        decides: processing_charge
        bindings: [latest_payment_method, processing_charge]
        ladder:
          - when: "most recent deposit payment posted was a check"
            value: "K('check_return_charge_usd')"
          - when: "most recent deposit payment posted was an ACH payment"
            value: "K('ach_return_charge_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          processing_charge: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard returned-payment fee is returned_payment_fee_usd for each returned payment, with no
        surcharge.
      params: [returned_payment_fee_usd]
    inputs:
      history:
        - {table: purchase_events, aggregate: count, field: event_date, within_months: 12, filters: {event_type: purchase_payment_returned}}
        - {table: purchase_events, aggregate: latest, field: amount, filters: {event_type: purchase_payment_returned}}
        - {table: purchase_events, aggregate: latest, field: payment_method, filters: {event_type: purchase_deposit_posted}}
        - {category: homesite, table: homesite_events, aggregate: count, field: event_date, within_months: 12, filters: {event_type: homesite_payment_returned}}
        - {category: design, table: design_events, aggregate: count, field: event_date, within_months: 12, filters: {event_type: design_payment_returned}}
      cross_category: [homesite, design]

  - id: purchase_ext_returned_deposit_replacement
    base_policy_refs: [purchase_agg_concurrent_agreements, purchase_earnest_money, purchase_ratification, purchase_returned_payment]
    overwrite:
      - base_policy: purchase_earnest_money
        superseded_clause: >-
          An additional deposit of additional_deposit_pct percent of the contract price is due after construction starts.
        replaced_by: >-
          The additional deposit due is the contract price times the additional deposit rate, rounded half up
          to the cent, where the additional deposit rate is additional_deposit_pct plus every uplift below.
    trigger: on_request
    subject: [purchase_deposit_posted]
    computes: amount
    target_tool: wire_replacement_deposit_5b0eb18e
    params:
      outside_lender_rate_add_pct: 0.5
      cash_rate_add_pct: 0.3
      premium_rate_add_high_pct: 0.6
      premium_rate_add_low_pct: 0.3
      options_total_high_usd: 60000
      options_total_mid_usd: 30000
      options_rate_add_high_pct: 0.6
      options_rate_add_mid_pct: 0.3
      investor_rate_add_pct: 1.0
      second_home_rate_add_pct: 0.5
      security_pct_three_fees: 1.0
      security_pct_two_fees: 0.5
    rule: >-
      When a deposit payment on an agreement under construction is returned unpaid, the buyer cures it by
      wiring replacement funds, which post to the deposit component the returned payment had funded and name
      the returned payment's receipt number. Replacement funds for a returned deposit payment are not figured
      until the ledger carries the returned-payment fee for every returned payment notified on the agreement.
      The standard replacement is figured as follows. The additional deposit due is additional_deposit_pct
      percent of the contract price, rounded half up to the cent. The replacement funds are the additional
      deposit due less the additional deposit the agreement still holds, that is every additional deposit
      posted less every additional deposit returned unpaid, never less than zero, rounded half up to the cent.
      The additional deposit due is the contract price times the additional deposit rate, rounded half up to
      the cent, where the additional deposit rate is additional_deposit_pct plus every uplift below.
      The rate is uplifted by how the buyer finances: where the agreement's financing type is outside_lender
      and an outside-lender deposit stands on the ledger, that is outside-lender deposits posted exceed those
      returned unpaid, outside_lender_rate_add_pct points are added; where
      the financing type is cash, cash_rate_add_pct points are added; otherwise nothing is added.
      The rate is uplifted by the premium class of the reserved homesite: where the buyer's converted Homesite
      Reservation is of a class whose premium_deposit_pct_at_contract is 50 or more, premium_rate_add_high_pct
      points are added; where it is 25 or more but below 50, premium_rate_add_low_pct points are added;
      otherwise nothing is added.
      The rate is uplifted by the studio options Calloway is building into the home: where the buyer's Design
      Studio Selections file for the agreement is structural_closed, finalized or delivered and its option
      total is at least options_total_high_usd, options_rate_add_high_pct points are added; where the file is
      in one of those statuses and its option total is at least options_total_mid_usd but below
      options_total_high_usd, options_rate_add_mid_pct points are added; otherwise nothing is added.
      The rate is uplifted by how the buyer will occupy the home, as stated on the converted Homesite
      Reservation: where the occupancy intent is investor, investor_rate_add_pct points are added; where it is
      second_home, second_home_rate_add_pct points are added; otherwise nothing is added.
      A buyer with repeated returns posts a security deposit with the replacement: where three or more
      returned-payment fees have been charged on the agreement in the twelve months up to the replacement,
      security_pct_three_fees percent of the contract price, rounded half up to the cent, is added; where
      exactly two have been charged, security_pct_two_fees percent of the contract price, rounded half up to
      the cent, is added; otherwise no security deposit is added.
      The lot premium deposit is squared at the same time: the lot premium deposit owed is the converted
      reservation class's premium_deposit_pct_at_contract percent of the lot premium, rounded half up to the
      cent, less the premium holding fee and extension fees the Homesite Reservation ledger shows applied to
      the agreement, and is zero where the agreement has no converted Homesite Reservation; the lot premium
      deposit held is every lot premium deposit posted less every lot premium deposit returned unpaid. Where
      the held amount exceeds the amount owed, the buyer paid over reservation credits that had already
      reached the agreement, so the excess is credited against the replacement but never by more than those
      applied reservation credits, the rest staying with the non-refundable lot premium deposit; where the
      held amount falls short of the amount owed, the whole shortfall is added to the replacement; otherwise
      the replacement is not adjusted for the lot premium deposit.
      The replacement funds are the additional deposit due, less the additional deposit held, plus or minus
      the lot premium deposit adjustment, plus the security deposit, never less than zero, rounded half up to
      the cent.
    prerequisite:
      - problem: purchase_ext_returned_payment_fee
        kind: value_input
        gate: fee_count
        form: state
        policy_source: >-
          Replacement funds for a returned deposit payment are not figured until the ledger carries the
          returned-payment fee for every returned payment notified on the agreement.
        condition: >-
          For every purchase_payment_returned row on the agreement there is a purchase_charge_assessed row
          with charge_type returned_payment_fee naming that return's receipt number; in particular the
          return notified on the latest date carries its fee charge.
        resolved_by: assess_returned_payment_fee_3b45ee8d
        effect: >-
          Once the fee for the latest return is charged, the count of returned-payment fees charged on the
          agreement in the twelve months rises by one, which moves the repeat-return security deposit tier and
          so the replacement funds.
    cross_category:
      - category: homesite
        as: branch
        reads: [variant_name, occupancy_intent, homesite_events.amount]
        note: The premium-class uplift, the occupancy uplift and the lot premium deposit squaring read the buyer's converted Homesite Reservation and its ledger.
      - category: design
        as: branch
        reads: [status, option_total]
        note: The studio-options uplift reads the buyer's Design Studio Selections file status and option total.
    compute:
      - held_additional: "SUM('purchase_events', 'amount', event_type='purchase_deposit_posted', deposit_component='additional_deposit') - SUM('purchase_events', 'amount', event_type='purchase_payment_returned', deposit_component='additional_deposit')"
      - outside_deposit_held: "SUM('purchase_events', 'amount', event_type='purchase_deposit_posted', deposit_component='outside_lender_deposit') - SUM('purchase_events', 'amount', event_type='purchase_payment_returned', deposit_component='outside_lender_deposit')"
      - financing_add: "K('outside_lender_rate_add_pct') if F('financing_type') == 'outside_lender' and outside_deposit_held > 0 else (K('cash_rate_add_pct') if F('financing_type') == 'cash' else 0)"
      - premium_class_pct: "CPARAM('homesite', 'premium_deposit_pct_at_contract', status='converted')"
      - premium_add: "K('premium_rate_add_high_pct') if premium_class_pct != None and premium_class_pct >= 50 else (K('premium_rate_add_low_pct') if premium_class_pct != None and premium_class_pct >= 25 else 0)"
      - design_status: "CFIELD('design', 'status', purchase_id=HID)"
      - design_option_total: "CFIELD('design', 'option_total', purchase_id=HID)"
      - options_add: "K('options_rate_add_high_pct') if (design_status == 'structural_closed' or design_status == 'finalized' or design_status == 'delivered') and design_option_total >= K('options_total_high_usd') else (K('options_rate_add_mid_pct') if (design_status == 'structural_closed' or design_status == 'finalized' or design_status == 'delivered') and design_option_total >= K('options_total_mid_usd') else 0)"
      - occupancy: "CFIELD('homesite', 'occupancy_intent', status='converted')"
      - occupancy_add: "K('investor_rate_add_pct') if occupancy == 'investor' else (K('second_home_rate_add_pct') if occupancy == 'second_home' else 0)"
      - rate_pct: "P('additional_deposit_pct') + financing_add + premium_add + options_add + occupancy_add"
      - additional_due: "RND(F('contract_price') * rate_pct / 100, 2)"
      - fee_count: "COUNT('purchase_events', within_months=12, event_type='purchase_charge_assessed', charge_type='returned_payment_fee')"
      - security: "RND(F('contract_price') * K('security_pct_three_fees') / 100, 2) if fee_count >= 3 else (RND(F('contract_price') * K('security_pct_two_fees') / 100, 2) if fee_count == 2 else 0)"
      - lp_class_pct: "CPARAM('homesite', 'premium_deposit_pct_at_contract', status='converted')"
      - lp_credit: "XSUM('homesite', 'homesite_events', 'amount', event_type='homesite_funds_applied', deposit_component='premium_holding_fee') + XSUM('homesite', 'homesite_events', 'amount', event_type='homesite_funds_applied', deposit_component='extension_fee')"
      - lp_owed: "RND(F('lot_premium') * lp_class_pct / 100, 2) - lp_credit if lp_class_pct != None else 0"
      - lp_held: "SUM('purchase_events', 'amount', event_type='purchase_deposit_posted', deposit_component='lot_premium_deposit') - SUM('purchase_events', 'amount', event_type='purchase_payment_returned', deposit_component='lot_premium_deposit')"
      - lp_adjust: "0 - MN(lp_held - lp_owed, lp_credit) if lp_held > lp_owed and lp_credit > 0 else (lp_owed - lp_held if lp_held < lp_owed else 0)"
      - result: "RND(MX(0, additional_due - held_additional + lp_adjust + security), 2)"
    compute_basis:
      held_additional: "the additional deposit the agreement still holds, that is every additional deposit posted less every additional deposit returned unpaid"
      outside_deposit_held: "an outside-lender deposit stands on the ledger, that is outside-lender deposits posted exceed those returned unpaid"
      financing_add: "where the agreement's financing type is outside_lender and an outside-lender deposit stands on the ledger, that is outside-lender deposits posted exceed those returned unpaid, outside_lender_rate_add_pct points are added; where the financing type is cash, cash_rate_add_pct points are added; otherwise nothing is added."
      premium_class_pct: "where the buyer's converted Homesite Reservation is of a class whose premium_deposit_pct_at_contract is 50 or more"
      premium_add: "where the buyer's converted Homesite Reservation is of a class whose premium_deposit_pct_at_contract is 50 or more, premium_rate_add_high_pct points are added; where it is 25 or more but below 50, premium_rate_add_low_pct points are added; otherwise nothing is added."
      design_status: "where the buyer's Design Studio Selections file for the agreement is structural_closed, finalized or delivered"
      design_option_total: "and its option total is at least options_total_high_usd"
      options_add: "where the buyer's Design Studio Selections file for the agreement is structural_closed, finalized or delivered and its option total is at least options_total_high_usd, options_rate_add_high_pct points are added; where the file is in one of those statuses and its option total is at least options_total_mid_usd but below options_total_high_usd, options_rate_add_mid_pct points are added; otherwise nothing is added."
      occupancy: "how the buyer will occupy the home, as stated on the converted Homesite Reservation"
      occupancy_add: "where the occupancy intent is investor, investor_rate_add_pct points are added; where it is second_home, second_home_rate_add_pct points are added; otherwise nothing is added."
      rate_pct: "where the additional deposit rate is additional_deposit_pct plus every uplift below"
      additional_due: "The additional deposit due is the contract price times the additional deposit rate, rounded half up to the cent"
      fee_count: "where three or more returned-payment fees have been charged on the agreement in the twelve months up to the replacement"
      security: "where three or more returned-payment fees have been charged on the agreement in the twelve months up to the replacement, security_pct_three_fees percent of the contract price, rounded half up to the cent, is added; where exactly two have been charged, security_pct_two_fees percent of the contract price, rounded half up to the cent, is added; otherwise no security deposit is added."
      lp_class_pct: "the lot premium deposit owed is the converted reservation class's premium_deposit_pct_at_contract percent of the lot premium"
      lp_credit: "less the premium holding fee and extension fees the Homesite Reservation ledger shows applied to the agreement"
      lp_owed: "the lot premium deposit owed is the converted reservation class's premium_deposit_pct_at_contract percent of the lot premium, rounded half up to the cent, less the premium holding fee and extension fees the Homesite Reservation ledger shows applied to the agreement, and is zero where the agreement has no converted Homesite Reservation"
      lp_held: "the lot premium deposit held is every lot premium deposit posted less every lot premium deposit returned unpaid"
      lp_adjust: "Where the held amount exceeds the amount owed, the buyer paid over reservation credits that had already reached the agreement, so the excess is credited against the replacement but never by more than those applied reservation credits, the rest staying with the non-refundable lot premium deposit; where the held amount falls short of the amount owed, the whole shortfall is added to the replacement; otherwise the replacement is not adjusted for the lot premium deposit."
      result: "The replacement funds are the additional deposit due, less the additional deposit held, plus or minus the lot premium deposit adjustment, plus the security deposit, never less than zero, rounded half up to the cent."
    factors:
      - id: financing_uplift
        effect: parameter
        decides: financing_add
        bindings: [outside_deposit_held, financing_add]
        ladder:
          - when: "financing type outside_lender and an outside-lender deposit stands on the ledger"
            value: "K('outside_lender_rate_add_pct')"
          - when: "financing type cash"
            value: "K('cash_rate_add_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          financing_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: premium_class_uplift
        effect: parameter
        decides: premium_add
        bindings: [premium_class_pct, premium_add]
        ladder:
          - when: "converted Homesite Reservation class with premium_deposit_pct_at_contract 50 or more"
            value: "K('premium_rate_add_high_pct')"
          - when: "class with premium_deposit_pct_at_contract 25 or more but below 50"
            value: "K('premium_rate_add_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          premium_add: "0"
        evidence: [cross_category]
        cross_difficulty: homesite
      - id: studio_options_uplift
        effect: parameter
        decides: options_add
        bindings: [design_status, design_option_total, options_add]
        ladder:
          - when: "Design Studio file structural_closed, finalized or delivered and option total at least options_total_high_usd"
            value: "K('options_rate_add_high_pct')"
          - when: "file in one of those statuses and option total at least options_total_mid_usd but below options_total_high_usd"
            value: "K('options_rate_add_mid_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          options_add: "0"
        evidence: [cross_category]
        cross_difficulty: design
      - id: occupancy_uplift
        effect: parameter
        decides: occupancy_add
        bindings: [occupancy, occupancy_add]
        ladder:
          - when: "occupancy intent investor on the converted Homesite Reservation"
            value: "K('investor_rate_add_pct')"
          - when: "occupancy intent second_home"
            value: "K('second_home_rate_add_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          occupancy_add: "0"
        evidence: [cross_category]
        cross_difficulty: homesite
      - id: repeat_return_security
        effect: parameter
        decides: security
        bindings: [fee_count, security]
        ladder:
          - when: "three or more returned-payment fees charged on the agreement in the twelve months"
            value: "K('security_pct_three_fees') percent of the contract price"
          - when: "exactly two returned-payment fees charged in the twelve months"
            value: "K('security_pct_two_fees') percent of the contract price"
          - when: "otherwise"
            value: "0"
        baseline:
          security: "0"
        evidence: [history]
        cross_difficulty: null
      - id: lot_premium_squaring
        effect: method
        decides: lp_adjust
        bindings: [lp_class_pct, lp_credit, lp_owed, lp_held, lp_adjust]
        ladder:
          - when: "lot premium deposit held exceeds the amount owed and reservation credits were applied to the agreement"
            method: "the excess is credited against the replacement, capped at the applied reservation credits"
          - when: "lot premium deposit held falls short of the amount owed"
            method: "the whole shortfall is added to the replacement, uncapped"
          - when: "otherwise"
            method: "the replacement is not adjusted for the lot premium deposit"
        baseline:
          lp_adjust: "0"
        evidence: [history, cross_category]
        cross_difficulty: homesite
    baseline:
      rule: >-
        The standard replacement is figured as follows. The additional deposit due is additional_deposit_pct
        percent of the contract price, rounded half up to the cent. The replacement funds are the additional
        deposit due less the additional deposit the agreement still holds, that is every additional deposit
        posted less every additional deposit returned unpaid, never less than zero, rounded half up to the cent.
      params: [additional_deposit_pct]
    inputs:
      history:
        - {table: purchase_events, aggregate: sum, field: amount, filters: {event_type: [purchase_deposit_posted, purchase_payment_returned], deposit_component: additional_deposit}}
        - {table: purchase_events, aggregate: sum, field: amount, filters: {event_type: purchase_deposit_posted, deposit_component: outside_lender_deposit}}
        - {table: purchase_events, aggregate: count, field: event_date, within_months: 12, filters: {event_type: purchase_charge_assessed, charge_type: returned_payment_fee}}
        - {table: purchase_events, aggregate: sum, field: amount, filters: {event_type: [purchase_deposit_posted, purchase_payment_returned], deposit_component: lot_premium_deposit}}
        - {category: homesite, table: homesite_events, aggregate: sum, field: amount, filters: {event_type: homesite_funds_applied, deposit_component: [premium_holding_fee, extension_fee]}}
      cross_category: [homesite, design]

