events:
  - type: lock_requested
    target: rate_locks
    mutation: create
    meaning: A buyer financing through Calloway Home Mortgage requests a rate lock of a chosen term on the loan for a home under contract.
    grain: One row per lock request.
    fields:
      customer_id: The borrower.
      purchase_id: The purchase agreement the loan finances.
      variant_name: Lock term chosen, the official tier name.
      status: Always requested on creation.
      loan_program: Loan program.
      loan_amount: Loan amount at request.
      ltv_pct: Loan-to-value percent at request.
      qualifying_credit_score: Qualifying credit score from the credit report on file.
      qualifying_dti_pct: Qualifying debt-to-income percent from the loan application.
      par_rate: Par rate on the lock desk rate sheet for the program on the request date.
      requested_date: Date of the lock request.
      extensions_used: 0 on creation.
      extension_days_used: 0 on creation.
      float_downs_used: 0 on creation.
      relocks_used: 0 on creation.
      lock_fee_held: 0.00 on creation.
      charges_due: 0.00 on creation.
    triggers: []
  - type: lock_fee_paid
    target: lock_events
    meaning: The buyer pays the upfront lock fee.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      amount: Amount paid, positive.
      payment_method: How it was paid.
      payment_reference: Receipt number printed on the Calloway Home Mortgage receipt.
      event_date: Date posted.
    account: lock_fee
    direction: in
    triggers: []
  - type: lock_confirmed
    target: rate_locks
    mutation: {transition: {from: requested, to: locked}}
    meaning: The lock desk confirms the lock at the locked rate.
    grain: One row per transaction.
    fields:
      status: Becomes locked.
      lock_date: Date the lock was confirmed.
      locked_rate: Par rate plus the applicable rate premium.
      lock_expiration_date: Lock date plus lock_term_days.
    triggers: []
  - type: lock_extended
    target: rate_locks
    mutation: update
    meaning: The lock expiration date is extended by one or more increments.
    grain: One row per transaction.
    fields:
      lock_expiration_date: New expiration date.
      extensions_used: Incremented by the number of increments.
      extension_days_used: Incremented by the days added.
    triggers:
      - event: lock:lock_charge_assessed
        map: {charge_type: extension_fee}
  - type: lock_float_down
    target: rate_locks
    mutation: update
    meaning: The locked rate is lowered to the current offered rate under the float-down option.
    grain: One row per transaction.
    fields:
      locked_rate: New locked rate.
      float_downs_used: Incremented by one.
    triggers:
      - event: lock:lock_charge_assessed
        map: {charge_type: float_down_fee}
  - type: lock_terms_changed
    target: rate_locks
    mutation: update
    meaning: The loan program or loan amount on the lock changes and the lock is re-priced.
    grain: One row per transaction.
    fields:
      loan_program: New loan program.
      loan_amount: New loan amount.
      ltv_pct: New loan-to-value percent.
      par_rate: Par rate for the new terms on the change date.
      locked_rate: Re-priced locked rate.
    triggers: []
  - type: lock_charge_assessed
    target: lock_events
    meaning: A lock charge is assessed.
    grain: One row per charge.
    distinguish_by: [charge_type, charge_reference]
    fields:
      amount: Amount charged, positive (0.00 for a free first extension).
      charge_type: Kind of charge.
      charge_reference: Charge number printed on the lock confirmation, e.g. LCK-CHG-7781.
      extension_days: Calendar days added, for an extension charge.
      event_date: Date assessed.
    account: lock_charges
    direction: in
    triggers: []
  - type: lock_charge_waived
    target: lock_events
    meaning: A lock charge is waived.
    grain: One row per charge waived.
    distinguish_by: [source_charge_ref]
    fields:
      amount: Amount waived, positive.
      charge_type: Kind of charge waived.
      source_charge_ref: Charge number of the charge waived.
      waiver_reason: Why it is waived.
      event_date: Date waived.
    account: lock_charges
    direction: out
    triggers: []
  - type: lock_charges_collected
    target: lock_events
    meaning: Outstanding lock charges are collected at funding.
    grain: One row per charge collected.
    distinguish_by: [source_charge_ref]
    fields:
      amount: Amount collected, positive.
      charge_type: Kind of charge.
      source_charge_ref: Charge number collected.
      event_date: Funding date.
    account: lock_charges
    direction: out
    triggers: []
  - type: lock_expired
    target: rate_locks
    mutation: {transition: {from: locked, to: expired}}
    meaning: The lock lapses at the end of its expiration date.
    grain: One row per transaction.
    fields:
      status: Becomes expired.
      expired_date: The day after the last day of the lock.
    triggers: []
  - type: lock_relocked
    target: rate_locks
    mutation: {transition: {from: expired, to: locked}}
    meaning: An expired lock is relocked.
    grain: One row per transaction.
    fields:
      status: Becomes locked.
      locked_rate: Relocked rate under relock_pricing_rule.
      lock_expiration_date: Relock date plus relock_term_days.
      relocks_used: Incremented by one.
    triggers:
      - event: lock:lock_charge_assessed
        map: {charge_type: relock_fee}
  - type: lock_fee_credited
    target: lock_events
    meaning: The upfront fee is credited to the buyer at funding.
    grain: One row per source payment credited.
    distinguish_by: [source_payment_ref]
    fields:
      amount: Amount credited, positive.
      source_payment_ref: Receipt number of the fee payment credited.
      event_date: Funding date.
    account: lock_fee
    direction: out
    triggers: []
  - type: lock_fee_refunded
    target: lock_events
    meaning: The upfront fee is refunded in whole or in part.
    grain: One row per source payment refunded.
    distinguish_by: [source_payment_ref]
    fields:
      amount: Amount refunded, positive.
      source_payment_ref: Receipt number of the fee payment refunded.
      refund_reason: Why it is refunded.
      event_date: Date refunded.
    account: lock_fee
    direction: out
    triggers: []
  - type: lock_fee_forfeited
    target: lock_events
    meaning: The upfront fee, or the part not refunded, is retained.
    grain: One row per source payment forfeited.
    distinguish_by: [source_payment_ref]
    fields:
      amount: Amount retained, positive.
      source_payment_ref: Receipt number of the fee payment retained.
      forfeiture_reason: Why it is retained.
      event_date: Date of forfeiture.
    account: lock_fee
    direction: out
    triggers: []
  - type: lock_notice_sent
    target: lock_events
    meaning: A lock expiry reminder is sent to the buyer.
    grain: One row per notice per date.
    distinguish_by: [notice_type, event_date]
    fields:
      notice_type: Kind of notice.
      event_date: Date sent.
    triggers: []
  - type: lock_funded
    target: rate_locks
    mutation: {transition: {from: locked, to: funded}}
    meaning: The loan funds at closing on the locked terms.
    grain: One row per transaction.
    fields:
      status: Becomes funded.
      end_date: Funding date.
    triggers:
      - event: lock:lock_fee_credited
        map: {event_date: end_date}
      - event: lock:lock_charges_collected
        map: {event_date: end_date}
  - type: lock_cancelled
    target: rate_locks
    mutation: {transition: [{from: requested, to: cancelled}, {from: locked, to: cancelled}, {from: expired, to: cancelled}]}
    meaning: The purchase agreement ended without closing, so the lock is cancelled.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: Date the purchase agreement ended.
    triggers: []
  - type: lock_withdrawn
    target: rate_locks
    mutation: {transition: [{from: requested, to: withdrawn}, {from: locked, to: withdrawn}]}
    meaning: The buyer withdraws the lock.
    grain: One row per transaction.
    fields:
      status: Becomes withdrawn.
      end_date: Date the buyer withdrew.
    triggers:
      - event: lock:lock_fee_forfeited
        map: {forfeiture_reason: buyer_withdrawal, event_date: end_date}

measures:
  - id: lock_msr_extension_increments
    window: Life of the lock.
    measure: Sum of extension increments written on the lock (extensions_used) and the extension_days_used total.
  - id: lock_msr_open_locks
    window: Point in time on the frozen date.
    measure: Count of rate_locks on the same purchase_id in status requested, locked or expired, excluding the lock being handled.

policies:
  - id: lock_agg_multi_holding
    subject: [lock_requested]
    rule: >-
      A buyer may hold up to max_per_customer rate locks at once in status requested, locked or expired,
      at most one per purchase agreement. A lock is requested only for a purchase agreement with no other lock in status requested, locked or expired.
    eligibility:
      - id: one_open_lock_per_agreement
        applies_to: [lock_requested]
        kind: dedup
        condition: "A lock is requested only for a purchase agreement with no other lock in status requested, locked or expired."
        evidence_fields: [rate_locks.purchase_id, rate_locks.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rate_locks.purchase_id]
          action_bindings:
            rate_locks.purchase_id: purchase_id
        dedup_contract:
          table: rate_locks
          mode: same_record
          object_bindings: {purchase_id: purchase_id}
          duplicate_filters: {status: [requested, locked, expired]}
          distinct_fields: []
    params:
      max_per_customer: 2
    measures: [lock_msr_open_locks]

  - id: lock_agg_purchase_link
    subject: [lock_requested, lock_cancelled, lock_withdrawn]
    rule: >-
      A lock exists only to finance a Calloway purchase agreement whose financing_type is
      calloway_home_mortgage, and it follows that agreement: when the agreement is cancelled or
      terminated the lock is cancelled on the same date, and when the buyer changes the agreement's
      financing away from Calloway Home Mortgage the buyer withdraws the lock. Where
      lock_transferable_on_lot_transfer is false a homesite transfer on the agreement requires the
      buyer to withdraw the lock and request a new one. A lock is requested only for a purchase agreement whose financing_type is calloway_home_mortgage and whose status is ratified, under_construction or closing_scheduled.
    eligibility:
      - id: financed_ratified_agreement
        applies_to: [lock_requested]
        kind: state
        condition: "A lock is requested only for a purchase agreement whose financing_type is calloway_home_mortgage and whose status is ratified, under_construction or closing_scheduled."
        evidence_fields: [purchase_agreements.status, purchase_agreements.financing_type, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        state_contract:
          field: purchase_agreements.status
          allowed: [ratified, under_construction, closing_scheduled]

  - id: lock_term_eligibility
    subject: [lock_requested, lock_terms_changed]
    rule: >-
      A lock term may be requested only when the loan program is in the term's eligible_programs, the
      loan amount does not exceed jumbo_max_loan_usd, ltv_pct does not exceed max_ltv_pct,
      qualifying_credit_score is at least min_credit_score and qualifying_dti_pct does not exceed
      max_dti_pct. A loan amount above conforming_limit_usd must be on program jumbo. The home's construction stage on the purchase agreement must be at or past the term's min_construction_stage when the lock is requested.
      The stage order is not_started, foundation, framing, drywall, finishes, complete. The estimated
      completion date on the purchase agreement must be at least min_days_to_estimated_completion
      calendar days after the request date, and a term whose lock_term_days ends before the estimated
      completion date is not offered.
    eligibility:
      - id: construction_stage_floor
        applies_to: [lock_requested]
        kind: authorization
        condition: "The home's construction stage on the purchase agreement must be at or past the term's min_construction_stage when the lock is requested."
        evidence_fields: [purchase_agreements.construction_stage, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
    params:
      per_tier:
        60-Day Standard Lock: {min_score: "=min_credit_score", max_dti: "=max_dti_pct", max_ltv: "=max_ltv_pct", stage: "=min_construction_stage"}
        90-Day Lock: {min_score: "=min_credit_score", max_dti: "=max_dti_pct", max_ltv: "=max_ltv_pct", stage: "=min_construction_stage"}
        120-Day Extended Lock: {min_score: "=min_credit_score", max_dti: "=max_dti_pct", max_ltv: "=max_ltv_pct", stage: "=min_construction_stage"}
        180-Day Extended Lock: {min_score: "=min_credit_score", max_dti: "=max_dti_pct", max_ltv: "=max_ltv_pct", stage: "=min_construction_stage"}
        270-Day Build Lock: {min_score: "=min_credit_score", max_dti: "=max_dti_pct", max_ltv: "=max_ltv_pct", stage: "=min_construction_stage"}
        360-Day Build Lock: {min_score: "=min_credit_score", max_dti: "=max_dti_pct", max_ltv: "=max_ltv_pct", stage: "=min_construction_stage"}

  - id: lock_fee_and_pricing
    subject: [lock_fee_paid, lock_confirmed]
    rule: >-
      The upfront lock fee is the greater of upfront_fee_pct percent of the loan amount (rounded half
      up to the cent) and upfront_fee_min_usd, and is zero where upfront_fee_pct is zero; it is paid by
      a method in fee_payment_methods. The upfront fee must be paid within fee_due_business_days business days after the lock request date.
      Business days are Monday through Friday excluding Calloway holidays, and counting starts the
      next business day after the request date. A request whose fee is not paid in time is not
      confirmed and must be requested again at the then-current par rate. The locked rate is the par
      rate plus rate_premium_pct, plus jumbo_extra_rate_premium_pct on a jumbo loan, less
      government_program_premium_discount_pct on fha, va or usda, never below the par rate. The lock
      expiration date is the lock date plus lock_term_days; where expiry_rolls_to_business_day is true
      and that day is a Saturday, Sunday or Calloway holiday, the lock runs through the next business
      day.
    eligibility:
      - id: fee_deadline
        applies_to: [lock_confirmed]
        kind: time
        condition: "The upfront fee must be paid within fee_due_business_days business days after the lock request date."
        evidence_fields: [rate_locks.requested_date, rate_locks.lock_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rate_locks.lock_id]
          action_bindings:
            rate_locks.lock_id: lock_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the lock request date
          anchor_source: rate_locks.requested_date
          relation: not_after
          duration_source: variants.fee_due_business_days
          unit: business_days
          counting_rule: Business days are Monday through Friday excluding Calloway holidays, and counting starts the next business day after the request date
          boundary: inclusive
    params:
      per_tier:
        60-Day Standard Lock: {fee_pct: "=upfront_fee_pct", fee_min: "=upfront_fee_min_usd", premium: "=rate_premium_pct"}
        90-Day Lock: {fee_pct: "=upfront_fee_pct", fee_min: "=upfront_fee_min_usd", premium: "=rate_premium_pct"}
        120-Day Extended Lock: {fee_pct: "=upfront_fee_pct", fee_min: "=upfront_fee_min_usd", premium: "=rate_premium_pct"}
        180-Day Extended Lock: {fee_pct: "=upfront_fee_pct", fee_min: "=upfront_fee_min_usd", premium: "=rate_premium_pct"}
        270-Day Build Lock: {fee_pct: "=upfront_fee_pct", fee_min: "=upfront_fee_min_usd", premium: "=rate_premium_pct"}
        360-Day Build Lock: {fee_pct: "=upfront_fee_pct", fee_min: "=upfront_fee_min_usd", premium: "=rate_premium_pct"}
    formula:
      upfront_fee: max(round(loan_amount * upfront_fee_pct / 100, 2), upfront_fee_min_usd)
      locked_rate_base: par_rate + rate_premium_pct

  - id: lock_extensions
    subject: [lock_extended, lock_charge_assessed]
    rule: >-
      A lock is extended in increments of extension_increment_days calendar days added to the current
      lock expiration date, up to max_extension_increments increments and max_total_extension_days days
      over the life of the lock (lock_msr_extension_increments). An extension is written only on a lock whose status is locked.
      Each increment carries an extension fee of extension_fee_pct_per_increment percent of the loan
      amount, rounded half up to the cent, with a floor of extension_fee_min_usd; where
      first_extension_free is true the first increment on the lock carries a fee of zero. An expired
      lock cannot be extended and may only be relocked. When the extension is needed because the
      purchase agreement's closing date moved for a builder delay, builder_delay_waiver_pct percent of
      the extension charge is waived under lock_builder_delay_waiver.
    eligibility:
      - id: extension_state
        applies_to: [lock_extended]
        kind: state
        condition: "An extension is written only on a lock whose status is locked."
        evidence_fields: [rate_locks.status, rate_locks.lock_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rate_locks.lock_id]
          action_bindings:
            rate_locks.lock_id: lock_id
        state_contract:
          field: rate_locks.status
          allowed: [locked]
    params:
      per_tier:
        60-Day Standard Lock: {increment_days: "=extension_increment_days", fee_pct: "=extension_fee_pct_per_increment", fee_min: "=extension_fee_min_usd", max_increments: "=max_extension_increments"}
        90-Day Lock: {increment_days: "=extension_increment_days", fee_pct: "=extension_fee_pct_per_increment", fee_min: "=extension_fee_min_usd", max_increments: "=max_extension_increments"}
        120-Day Extended Lock: {increment_days: "=extension_increment_days", fee_pct: "=extension_fee_pct_per_increment", fee_min: "=extension_fee_min_usd", max_increments: "=max_extension_increments"}
        180-Day Extended Lock: {increment_days: "=extension_increment_days", fee_pct: "=extension_fee_pct_per_increment", fee_min: "=extension_fee_min_usd", max_increments: "=max_extension_increments"}
        270-Day Build Lock: {increment_days: "=extension_increment_days", fee_pct: "=extension_fee_pct_per_increment", fee_min: "=extension_fee_min_usd", max_increments: "=max_extension_increments"}
        360-Day Build Lock: {increment_days: "=extension_increment_days", fee_pct: "=extension_fee_pct_per_increment", fee_min: "=extension_fee_min_usd", max_increments: "=max_extension_increments"}
    formula:
      extension_fee_per_increment: max(round(loan_amount * extension_fee_pct_per_increment / 100, 2), extension_fee_min_usd)
    measures: [lock_msr_extension_increments]

  - id: lock_float_down_option
    subject: [lock_float_down, lock_charge_assessed]
    rule: >-
      A float-down lowers the locked rate to the current offered rate for the same term and program
      (par rate on the current rate sheet plus the same premiums and discounts as at lock) when that
      offered rate is at least float_down_min_improvement_pct percentage points below the locked rate.
      It is available up to max_float_downs times; a term with max_float_downs of zero has no
      float-down. A float-down is exercised only while the lock status is locked. A float-down is exercised only after the purchase agreement status is closing_scheduled.
      Each float-down carries a fee of float_down_fee_pct percent of the loan amount, rounded half up
      to the cent, with a floor of float_down_fee_min_usd. The expiration date is unchanged where
      float_down_resets_expiration is false.
    eligibility:
      - id: float_lock_state
        applies_to: [lock_float_down]
        kind: state
        condition: "A float-down is exercised only while the lock status is locked."
        evidence_fields: [rate_locks.status, rate_locks.lock_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rate_locks.lock_id]
          action_bindings:
            rate_locks.lock_id: lock_id
        state_contract:
          field: rate_locks.status
          allowed: [locked]
      - id: float_purchase_state
        applies_to: [lock_float_down]
        kind: state
        condition: "A float-down is exercised only after the purchase agreement status is closing_scheduled."
        evidence_fields: [purchase_agreements.status, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        state_contract:
          field: purchase_agreements.status
          allowed: [closing_scheduled]
    formula:
      float_down_fee: max(round(loan_amount * float_down_fee_pct / 100, 2), float_down_fee_min_usd)

  - id: lock_expiry_relock
    subject: [lock_expired, lock_relocked, lock_charge_assessed, lock_notice_sent]
    rule: >-
      An expiry reminder is sent expiry_notice_days_before calendar days before the lock expiration
      date. A lock not funded or extended by the end of its expiration date expires and the expired
      date is the next calendar day. An expired lock may be relocked at most max_relocks times. A relock must be requested within relock_window_days calendar days after the date the lock expired.
      The expired date is day one and a relock on the last counted day is accepted. The relocked rate
      follows relock_pricing_rule: the higher of the expired locked rate and the current offered rate
      for the same term and program. A relock runs relock_term_days calendar days from the relock date
      and carries a relock fee of relock_fee_pct percent of the loan amount, rounded half up to the cent,
      with a floor of relock_fee_min_usd. After the window closes a new lock must be requested.
    eligibility:
      - id: relock_window
        applies_to: [lock_relocked]
        kind: time
        condition: "A relock must be requested within relock_window_days calendar days after the date the lock expired."
        evidence_fields: [rate_locks.expired_date, rate_locks.lock_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rate_locks.lock_id]
          action_bindings:
            rate_locks.lock_id: lock_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the lock expired
          anchor_source: rate_locks.expired_date
          relation: not_after
          duration_source: variants.relock_window_days
          unit: calendar_days
          counting_rule: The expired date is day one and a relock on the last counted day is accepted
          boundary: exclusive
    formula:
      relock_fee: max(round(loan_amount * relock_fee_pct / 100, 2), relock_fee_min_usd)

  - id: lock_terms_change
    subject: [lock_terms_changed, lock_charge_assessed]
    rule: >-
      A change of loan program on a lock carries a program_change_fee of program_change_fee_pct percent
      of the new loan amount, rounded half up to the cent, and re-prices the locked rate as at lock for
      the new program using the par rate on the change date; the lock term restarts only where
      program_change_resets_term is true. A rise in the loan amount of no more than
      loan_amount_tolerance_pct percent of the amount at lock keeps the locked rate; a larger rise
      re-prices the locked rate at the worse of the locked rate and the current offered rate, without a
      fee. A decrease in the loan amount never re-prices. A terms change is written only on a lock whose status is requested or locked.
    eligibility:
      - id: terms_change_state
        applies_to: [lock_terms_changed]
        kind: state
        condition: "A terms change is written only on a lock whose status is requested or locked."
        evidence_fields: [rate_locks.status, rate_locks.lock_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rate_locks.lock_id]
          action_bindings:
            rate_locks.lock_id: lock_id
        state_contract:
          field: rate_locks.status
          allowed: [requested, locked]
    formula:
      program_change_fee: round(loan_amount * program_change_fee_pct / 100, 2)

  - id: lock_builder_delay_waiver
    subject: [lock_charge_waived]
    rule: >-
      An extension charge is waived at builder_delay_waiver_pct percent when the purchase agreement's
      scheduled closing date moved later because of a builder delay and the extension was needed to
      reach the new closing date; relock, float-down and program change charges are never waived. Each
      waiver names the charge number it waives. A charge is waived at most once and a charge already collected at funding is not waived.
    eligibility:
      - id: one_waiver
        applies_to: [lock_charge_waived]
        kind: dedup
        condition: "A charge is waived at most once and a charge already collected at funding is not waived."
        evidence_fields: [lock_events.source_charge_ref, lock_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lock_events.source_charge_ref]
          action_bindings:
            lock_events.source_charge_ref: source_charge_ref
        dedup_contract:
          table: lock_events
          mode: separate_record
          object_bindings: {source_charge_ref: source_charge_ref}
          duplicate_filters: {event_type: [lock_charge_waived, lock_charges_collected]}
          distinct_fields: []

  - id: lock_settlement
    subject: [lock_funded, lock_fee_credited, lock_charges_collected, lock_fee_refunded, lock_fee_forfeited, lock_cancelled, lock_withdrawn]
    rule: >-
      At funding the upfront fee is credited to the buyer where fee_credited_at_closing is true and
      every unwaived charge is collected. When the lock ends without funding the upfront fee follows the
      reason the purchase agreement or lock ended: a rescission refunds fee_refund_on_rescission_pct
      percent; a builder delay cancellation refunds all of it where fee_refundable_on_builder_delay is
      true; a financing denial refunds refund_on_loan_denial_pct percent; a withdrawal by the buyer or
      any other buyer cancellation forfeits it where fee_forfeit_on_withdrawal is true. A partial refund
      is rounded half up to the cent and the remainder is forfeited with reason loan_denial_remainder.
      Refunds are issued within cancel_refund_processing_business_days business days. Unpaid charges on a
      lock that ends without funding are written off with it and are not collected.
    eligibility: []
    formula:
      denial_refund: round(lock_fee * refund_on_loan_denial_pct / 100, 2)

# ============================================================================
# extended_policies (rate_lock_management)
# ============================================================================
extended_policies:
  - id: lock_ext_builder_delay_relock
    base_policy_refs: [lock_expiry_relock]
    overwrite:
      - base_policy: lock_expiry_relock
        superseded_clause: >-
          The relocked rate follows relock_pricing_rule: the higher of the expired locked rate and the current offered rate for the same term and program.
        replaced_by: >-
          The relocked rate follows relock_pricing_rule, the higher of the expired locked rate and the current offered rate for the same term and program, except that a lock which expired while the purchase agreement's estimated completion date stood later than its contract completion date is relocked at the expired locked rate.
      - base_policy: lock_expiry_relock
        superseded_clause: >-
          A relock runs relock_term_days calendar days from the relock date and carries a relock fee of relock_fee_pct percent of the loan amount, rounded half up to the cent, with a floor of relock_fee_min_usd.
        replaced_by: >-
          The relock fee is the relock fee percent of the loan amount on the lock, rounded half up to the cent, with a floor of relock_fee_min_usd, and that floored amount is then multiplied by the expiry reminder multiplier and rounded half up to the cent.
    trigger: on_request
    subject: [lock_relocked]
    computes: relock_fee
    target_tool: relock_expired_lock_4b9eda82
    params:
      lapse_mid_from_day: 8
      lapse_late_from_day: 15
      lapse_mid_add_pct: 0.0625
      lapse_late_add_pct: 0.125
      high_ltv_above_pct: 88
      score_break: 720
      high_ltv_low_score_add_pct: 0.0625
      high_ltv_high_score_add_pct: 0.03125
      second_home_add_pct: 0.0625
      investor_add_pct: 0.125
      current_owner_credit_pct: 0.0625
      former_owner_credit_pct: 0.03125
      beyond_long_days: 15
      beyond_short_add_pct: 0.0625
      beyond_long_add_pct: 0.125
      late_reminder_floor_mult: 0.5
      missing_reminder_mult: 0.4
    rule: >-
      A lock in status expired is relocked within relock_window_days calendar days after the date it expired, the expired date being day one.
      The relocked rate follows relock_pricing_rule, the higher of the expired locked rate and the current offered rate for the same term and program, except that a lock which expired while the purchase agreement's estimated completion date stood later than its contract completion date is relocked at the expired locked rate.
      A relock runs relock_term_days calendar days from the relock date.
      The relock fee percent starts at relock_fee_pct and the expiry reminder multiplier starts at one.
      The relock fee is the relock fee percent of the loan amount on the lock, rounded half up to the cent, with a floor of relock_fee_min_usd, and that floored amount is then multiplied by the expiry reminder multiplier and rounded half up to the cent.
      Lapse days are counted with the expired date on record as day one and the relock date as the last day counted.
      Relock lapse add-on: a relock on lapse day lapse_late_from_day or later adds lapse_late_add_pct percentage points to the relock fee percent; a relock on lapse day lapse_mid_from_day up to the day before lapse_late_from_day adds lapse_mid_add_pct percentage points; a relock on an earlier lapse day adds nothing.
      The relock loan-to-value is the loan amount on the lock divided by the contract price on the purchase agreement, as a percent.
      Relock loan-to-value and score add-on: a lock whose relock loan-to-value is above high_ltv_above_pct and whose qualifying credit score is below score_break adds high_ltv_low_score_add_pct percentage points to the relock fee percent; a lock whose relock loan-to-value is above high_ltv_above_pct and whose qualifying credit score is score_break or higher adds high_ltv_high_score_add_pct percentage points; any other lock adds nothing.
      Relock occupancy add-on: where the occupancy intent on the Homesite Reservation that converted into the lock's purchase agreement is investor, investor_add_pct percentage points are added to the relock fee percent; where it is second_home, second_home_add_pct percentage points are added; any other occupancy adds nothing.
      Relock homeowner credit: a buyer who holds a Calloway Limited Home Warranty coverage in status active on another home takes current_owner_credit_pct percentage points off the relock fee percent; a buyer whose Calloway Limited Home Warranty coverage on record is transferred or expired takes former_owner_credit_pct percentage points off; any other buyer takes nothing off.
      Relock closing-reach add-on: the closing overhang is the calendar days by which the purchase agreement's scheduled closing date falls after the relock date plus relock_term_days; an overhang above beyond_long_days adds beyond_long_add_pct percentage points to the relock fee percent; an overhang of one day up to beyond_long_days adds beyond_short_add_pct percentage points; no overhang adds nothing.
      Every add-on is added to, and the homeowner credit is taken from, relock_fee_pct to form the relock fee percent before it is applied to the loan amount.
      Expiry reminder multiplier: the reminder lead is the calendar days from the latest expiry reminder on the lock ledger to the expired lock's expiration date; where the ledger carries no expiry reminder the multiplier is missing_reminder_mult; where the reminder lead is shorter than expiry_notice_days_before the multiplier is late_reminder_floor_mult plus the reminder lead divided by twice expiry_notice_days_before; where the reminder lead is expiry_notice_days_before or longer the multiplier is one.
      The relock fee is booked on the lock ledger as a relock_fee charge with its own charge number, and the relock date is the date the relock is written.
    baseline:
      rule: >-
        A relock runs relock_term_days calendar days from the relock date.
        The relock fee percent starts at relock_fee_pct and the expiry reminder multiplier starts at one.
        The relock fee is the relock fee percent of the loan amount on the lock, rounded half up to the cent, with a floor of relock_fee_min_usd, and that floored amount is then multiplied by the expiry reminder multiplier and rounded half up to the cent.
      params: [relock_fee_pct, relock_fee_min_usd, relock_term_days]
    prerequisite: []
    cross_category:
      - category: homesite
        as: branch
        reads: [occupancy_intent, reservation_id]
        note: The relock occupancy add-on is decided from the occupancy intent on the converted Homesite Reservation.
      - category: purchase
        as: branch
        reads: [reservation_id, scheduled_closing_date, contract_price]
        note: The relock closing-reach add-on and the relock loan-to-value read the purchase agreement (scheduled closing date, contract price); the agreement also links the converted reservation.
      - category: warranty
        as: branch
        reads: [status]
        note: The relock homeowner credit is decided from the status of the buyer's Calloway Limited Home Warranty coverage on another home.
    compute:
      - lapse_day: "DAYS(F('expired_date'), NOW) + 1"
      - lapse_add: "K('lapse_late_add_pct') if lapse_day >= K('lapse_late_from_day') else (K('lapse_mid_add_pct') if lapse_day >= K('lapse_mid_from_day') else 0)"
      - relock_ltv: "F('loan_amount') / CFIELD('purchase', 'contract_price', purchase_id=F('purchase_id')) * 100"
      - ltv_score_add: "K('high_ltv_low_score_add_pct') if (relock_ltv > K('high_ltv_above_pct') and F('qualifying_credit_score') < K('score_break')) else (K('high_ltv_high_score_add_pct') if (relock_ltv > K('high_ltv_above_pct') and F('qualifying_credit_score') >= K('score_break')) else 0)"
      - occupancy: "CFIELD('homesite', 'occupancy_intent', reservation_id=CFIELD('purchase', 'reservation_id', purchase_id=F('purchase_id')))"
      - occupancy_add: "K('investor_add_pct') if occupancy == 'investor' else (K('second_home_add_pct') if occupancy == 'second_home' else 0)"
      - owner_status: "CFIELD('warranty', 'status') if CFIELD('warranty', 'purchase_id') != F('purchase_id') else None"
      - owner_credit: "K('current_owner_credit_pct') if owner_status == 'active' else (K('former_owner_credit_pct') if (owner_status == 'transferred' or owner_status == 'expired') else 0)"
      - closing_overhang: "DAYS(NOW, CFIELD('purchase', 'scheduled_closing_date', purchase_id=F('purchase_id'))) - P('relock_term_days')"
      - overhang_add: "K('beyond_long_add_pct') if closing_overhang > K('beyond_long_days') else (K('beyond_short_add_pct') if closing_overhang >= 1 else 0)"
      - last_reminder: "LATEST('lock_events', 'event_date', event_type='lock_notice_sent', notice_type='expiry_reminder')"
      - reminder_count: "COUNT('lock_events', event_type='lock_notice_sent', notice_type='expiry_reminder')"
      - reminder_lead: "DAYS(last_reminder, F('lock_expiration_date')) if reminder_count >= 1 else -1"
      - reminder_mult: "K('missing_reminder_mult') if reminder_lead < 0 else (K('late_reminder_floor_mult') + reminder_lead / (2 * P('expiry_notice_days_before')) if reminder_lead < P('expiry_notice_days_before') else 1)"
      - fee_pct: "P('relock_fee_pct') + lapse_add + ltv_score_add + occupancy_add - owner_credit + overhang_add"
      - gross_fee: "RND(F('loan_amount') * fee_pct / 100 + 0.0000001, 2)"
      - floored_fee: "MX(gross_fee, P('relock_fee_min_usd'))"
      - result: "RND(floored_fee * reminder_mult + 0.0000001, 2)"
    compute_basis:
      lapse_day: "Lapse days are counted with the expired date on record as day one and the relock date as the last day counted."
      lapse_add: "Relock lapse add-on: a relock on lapse day lapse_late_from_day or later adds lapse_late_add_pct percentage points to the relock fee percent; a relock on lapse day lapse_mid_from_day up to the day before lapse_late_from_day adds lapse_mid_add_pct percentage points; a relock on an earlier lapse day adds nothing."
      relock_ltv: "The relock loan-to-value is the loan amount on the lock divided by the contract price on the purchase agreement, as a percent."
      ltv_score_add: "Relock loan-to-value and score add-on: a lock whose relock loan-to-value is above high_ltv_above_pct and whose qualifying credit score is below score_break adds high_ltv_low_score_add_pct percentage points to the relock fee percent; a lock whose relock loan-to-value is above high_ltv_above_pct and whose qualifying credit score is score_break or higher adds high_ltv_high_score_add_pct percentage points; any other lock adds nothing."
      occupancy: "where the occupancy intent on the Homesite Reservation that converted into the lock's purchase agreement is investor"
      occupancy_add: "Relock occupancy add-on: where the occupancy intent on the Homesite Reservation that converted into the lock's purchase agreement is investor, investor_add_pct percentage points are added to the relock fee percent; where it is second_home, second_home_add_pct percentage points are added; any other occupancy adds nothing."
      owner_status: "a buyer who holds a Calloway Limited Home Warranty coverage in status active on another home"
      owner_credit: "Relock homeowner credit: a buyer who holds a Calloway Limited Home Warranty coverage in status active on another home takes current_owner_credit_pct percentage points off the relock fee percent; a buyer whose Calloway Limited Home Warranty coverage on record is transferred or expired takes former_owner_credit_pct percentage points off; any other buyer takes nothing off."
      closing_overhang: "the closing overhang is the calendar days by which the purchase agreement's scheduled closing date falls after the relock date plus relock_term_days"
      overhang_add: "an overhang above beyond_long_days adds beyond_long_add_pct percentage points to the relock fee percent; an overhang of one day up to beyond_long_days adds beyond_short_add_pct percentage points; no overhang adds nothing."
      last_reminder: "the reminder lead is the calendar days from the latest expiry reminder on the lock ledger to the expired lock's expiration date"
      reminder_lead: "the reminder lead is the calendar days from the latest expiry reminder on the lock ledger to the expired lock's expiration date"
      reminder_count: "where the ledger carries no expiry reminder the multiplier is missing_reminder_mult"
      reminder_mult: "where the ledger carries no expiry reminder the multiplier is missing_reminder_mult; where the reminder lead is shorter than expiry_notice_days_before the multiplier is late_reminder_floor_mult plus the reminder lead divided by twice expiry_notice_days_before; where the reminder lead is expiry_notice_days_before or longer the multiplier is one."
      fee_pct: "Every add-on is added to, and the homeowner credit is taken from, relock_fee_pct to form the relock fee percent before it is applied to the loan amount."
      gross_fee: "The relock fee is the relock fee percent of the loan amount on the lock, rounded half up to the cent, with a floor of relock_fee_min_usd, and that floored amount is then multiplied by the expiry reminder multiplier and rounded half up to the cent."
      floored_fee: "with a floor of relock_fee_min_usd"
      result: "and that floored amount is then multiplied by the expiry reminder multiplier and rounded half up to the cent."
    factors:
      - id: relock_lapse_add_on
        effect: parameter
        decides: lapse_add
        bindings: [lapse_day, lapse_add]
        ladder:
          - {when: "the relock falls on lapse day lapse_late_from_day or later", value: "K('lapse_late_add_pct')"}
          - {when: "the relock falls on lapse day lapse_mid_from_day up to the day before lapse_late_from_day", value: "K('lapse_mid_add_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {lapse_add: "0"}
        evidence: [date]
        cross_difficulty: null
      - id: relock_ltv_score_add_on
        effect: parameter
        decides: ltv_score_add
        bindings: [relock_ltv, ltv_score_add]
        ladder:
          - {when: "relock loan-to-value above high_ltv_above_pct and qualifying credit score below score_break", value: "K('high_ltv_low_score_add_pct')"}
          - {when: "relock loan-to-value above high_ltv_above_pct and qualifying credit score score_break or higher", value: "K('high_ltv_high_score_add_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {ltv_score_add: "0"}
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: relock_occupancy_add_on
        effect: parameter
        decides: occupancy_add
        bindings: [occupancy, occupancy_add]
        ladder:
          - {when: "occupancy intent on the converted Homesite Reservation is investor", value: "K('investor_add_pct')"}
          - {when: "occupancy intent on the converted Homesite Reservation is second_home", value: "K('second_home_add_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {occupancy_add: "0"}
        evidence: [cross_category]
        cross_difficulty: homesite
      - id: relock_homeowner_credit
        effect: parameter
        decides: owner_credit
        bindings: [owner_status, owner_credit]
        ladder:
          - {when: "the buyer holds a Calloway Limited Home Warranty coverage in status active on another home", value: "K('current_owner_credit_pct')"}
          - {when: "the buyer's Calloway Limited Home Warranty coverage on record is transferred or expired", value: "K('former_owner_credit_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {owner_credit: "0"}
        evidence: [cross_category]
        cross_difficulty: warranty
      - id: relock_closing_reach_add_on
        effect: parameter
        decides: overhang_add
        bindings: [closing_overhang, overhang_add]
        ladder:
          - {when: "closing overhang above beyond_long_days", value: "K('beyond_long_add_pct')"}
          - {when: "closing overhang of one day up to beyond_long_days", value: "K('beyond_short_add_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {overhang_add: "0"}
        evidence: [cross_category, date]
        cross_difficulty: purchase
      - id: relock_expiry_reminder_multiplier
        effect: method
        decides: reminder_mult
        bindings: [last_reminder, reminder_count, reminder_lead, reminder_mult]
        ladder:
          - {when: "the lock ledger carries no expiry reminder", method: "the floored relock fee is multiplied by missing_reminder_mult"}
          - {when: "the latest expiry reminder came fewer than expiry_notice_days_before days before the expiration date", method: "the floored relock fee is multiplied by late_reminder_floor_mult plus the reminder lead divided by twice expiry_notice_days_before, so the multiplier grows with the notice actually given"}
          - {when: "otherwise", method: "the floored relock fee is charged as figured"}
        baseline: {reminder_mult: "1"}
        evidence: [history, date]
        cross_difficulty: null
    inputs:
      history:
        - {table: lock_events, aggregate: latest, field: event_date, filters: {event_type: lock_notice_sent, notice_type: expiry_reminder}}
      cross_category: [homesite, purchase, warranty]

  - id: lock_ext_extension_days
    base_policy_refs: [lock_extensions]
    overwrite: []
    trigger: on_request
    subject: [lock_extended]
    computes: extension_days
    target_tool: extend_rate_lock_1be9088d
    params:
      dry_funding_days_california: 3
      dry_funding_days_arizona: 2
      slip_cushion_days: 2
      slip_week_days: 14
      long_slip_above_days: 30
      buyer_move_cushion_one: 1
      buyer_move_cushion_two: 3
      lapse_long_above_days: 14
      lapse_cushion_long: 2
      lapse_cushion_short: 1
      notice_recent_days: 30
      notice_older_days: 60
      notice_cushion_recent: 2
      notice_cushion_older: 1
      gap_tight_days: 7
      gap_near_days: 14
      gap_cushion_tight: 2
      gap_cushion_near: 1
    rule: >-
      For a lock whose record carries an expired date, the extension days are worked out only once its status on record reads locked again and its relocks used count includes the relock that returned it to locked.
      The days to cover are the calendar days from the current lock expiration date on the lock to the purchase agreement's scheduled closing date.
      The extension days are the days to cover, plus every cushion below, rounded up to whole increments of extension_increment_days.
      The increments written never exceed max_extension_increments less the extensions already used, and the extension days never exceed max_total_extension_days less the extension days already used.
      Funding-lag cushion: where the purchase agreement's community is Sierra Vista Ranch, dry_funding_days_california days are added to the days to cover; where it is Mesquite Trails, dry_funding_days_arizona days are added; any other community adds none.
      Construction-slip cushion: the construction slip is the calendar days from the purchase agreement's contract completion date to its estimated completion date; a slip above long_slip_above_days adds one day for every slip_week_days days of slip, any part counted as a whole; a slip of one day up to long_slip_above_days adds slip_cushion_days; no slip adds none.
      Buyer-move cushion: a purchase agreement with two or more buyer-requested closing extensions written adds buyer_move_cushion_two days; one written adds buyer_move_cushion_one day; none adds none.
      Lapse cushion: a lock that has been relocked and whose expired date lies more than lapse_long_above_days calendar days before the extension adds lapse_cushion_long days; a lock that has been relocked and whose expired date lies lapse_long_above_days or fewer calendar days before the extension adds lapse_cushion_short day; any other lock adds none.
      Notice-age cushion: where the buyer's latest closing date notice from Calloway is dated notice_recent_days or fewer calendar days before the extension, notice_cushion_recent days are added; where it is dated more than notice_recent_days but no more than notice_older_days days before, notice_cushion_older day is added; otherwise none is added.
      Completion-gap cushion: the completion gap is the calendar days from the purchase agreement's estimated completion date to its scheduled closing date; a gap of gap_tight_days or fewer adds gap_cushion_tight days; a gap above gap_tight_days up to gap_near_days adds gap_cushion_near day; a longer gap adds none.
      Each extension adds its days to the current lock expiration date and counts its increments in the extensions used.
    baseline:
      rule: >-
        The days to cover are the calendar days from the current lock expiration date on the lock to the purchase agreement's scheduled closing date.
        The extension days are the days to cover, plus every cushion below, rounded up to whole increments of extension_increment_days.
        The increments written never exceed max_extension_increments less the extensions already used, and the extension days never exceed max_total_extension_days less the extension days already used.
      params: [extension_increment_days, max_extension_increments, max_total_extension_days]
    prerequisite:
      - problem: lock_ext_builder_delay_relock
        kind: state_gate
        gate: rate_locks.status
        form: state
        policy_source: >-
          For a lock whose record carries an expired date, the extension days are worked out only once its status on record reads locked again and its relocks used count includes the relock that returned it to locked.
        condition: >-
          rate_locks.status is locked and rate_locks.relocks_used is at least one on a lock whose expired_date is set.
        resolved_by: relock_expired_lock_4b9eda82
        effect: >-
          The relock returns the lock to status locked with a new expiration date and counts the relock, so the extension eligibility (status locked) holds and the days to cover run from the relocked expiration date.
    cross_category:
      - category: purchase
        as: branch
        reads: [community, scheduled_closing_date, contract_completion_date, estimated_completion_date, closing_extensions_used, purchase_events.event_date]
        note: The funding-lag, construction-slip, buyer-move, notice-age and completion-gap cushions are decided from the purchase agreement and its closing date notices.
    compute:
      - closing_date: "CFIELD('purchase', 'scheduled_closing_date', purchase_id=F('purchase_id'))"
      - days_to_cover: "DAYS(F('lock_expiration_date'), closing_date)"
      - community: "CFIELD('purchase', 'community', purchase_id=F('purchase_id'))"
      - funding_lag: "K('dry_funding_days_california') if community == 'Sierra Vista Ranch' else (K('dry_funding_days_arizona') if community == 'Mesquite Trails' else 0)"
      - slip_days: "DAYS(CFIELD('purchase', 'contract_completion_date', purchase_id=F('purchase_id')), CFIELD('purchase', 'estimated_completion_date', purchase_id=F('purchase_id')))"
      - slip_cushion: "int((slip_days + K('slip_week_days') - 1) // K('slip_week_days')) if slip_days > K('long_slip_above_days') else (K('slip_cushion_days') if slip_days >= 1 else 0)"
      - buyer_moves: "CFIELD('purchase', 'closing_extensions_used', purchase_id=F('purchase_id'))"
      - buyer_cushion: "K('buyer_move_cushion_two') if buyer_moves >= 2 else (K('buyer_move_cushion_one') if buyer_moves == 1 else 0)"
      - lapse_len: "DAYS(F('expired_date'), NOW) if F('expired_date') else -1"
      - lapse_cushion: "K('lapse_cushion_long') if (F('relocks_used') >= 1 and lapse_len > K('lapse_long_above_days')) else (K('lapse_cushion_short') if (F('relocks_used') >= 1 and lapse_len >= 0 and lapse_len <= K('lapse_long_above_days')) else 0)"
      - notice_age: "DAYS(XLATEST('purchase', 'purchase_events', 'event_date', notice_type='closing_date_notice'), NOW)"
      - notice_cushion: "K('notice_cushion_recent') if notice_age <= K('notice_recent_days') else (K('notice_cushion_older') if notice_age <= K('notice_older_days') else 0)"
      - completion_gap: "DAYS(CFIELD('purchase', 'estimated_completion_date', purchase_id=F('purchase_id')), closing_date)"
      - gap_cushion: "K('gap_cushion_tight') if completion_gap <= K('gap_tight_days') else (K('gap_cushion_near') if completion_gap <= K('gap_near_days') else 0)"
      - days_needed: "days_to_cover + funding_lag + slip_cushion + buyer_cushion + lapse_cushion + notice_cushion + gap_cushion"
      - increments: "int((days_needed + P('extension_increment_days') - 1) // P('extension_increment_days')) if days_needed > 0 else 0"
      - allowed_increments: "MN(increments, P('max_extension_increments') - F('extensions_used'))"
      - result: "MN(allowed_increments * P('extension_increment_days'), P('max_total_extension_days') - F('extension_days_used'))"
    compute_basis:
      closing_date: "The days to cover are the calendar days from the current lock expiration date on the lock to the purchase agreement's scheduled closing date."
      days_to_cover: "The days to cover are the calendar days from the current lock expiration date on the lock to the purchase agreement's scheduled closing date."
      community: "Funding-lag cushion: where the purchase agreement's community is Sierra Vista Ranch, dry_funding_days_california days are added to the days to cover; where it is Mesquite Trails, dry_funding_days_arizona days are added; any other community adds none."
      funding_lag: "Funding-lag cushion: where the purchase agreement's community is Sierra Vista Ranch, dry_funding_days_california days are added to the days to cover; where it is Mesquite Trails, dry_funding_days_arizona days are added; any other community adds none."
      slip_days: "the construction slip is the calendar days from the purchase agreement's contract completion date to its estimated completion date"
      slip_cushion: "a slip above long_slip_above_days adds one day for every slip_week_days days of slip, any part counted as a whole; a slip of one day up to long_slip_above_days adds slip_cushion_days; no slip adds none."
      buyer_moves: "Buyer-move cushion: a purchase agreement with two or more buyer-requested closing extensions written adds buyer_move_cushion_two days; one written adds buyer_move_cushion_one day; none adds none."
      buyer_cushion: "Buyer-move cushion: a purchase agreement with two or more buyer-requested closing extensions written adds buyer_move_cushion_two days; one written adds buyer_move_cushion_one day; none adds none."
      lapse_len: "whose expired date lies more than lapse_long_above_days calendar days before the extension"
      lapse_cushion: "Lapse cushion: a lock that has been relocked and whose expired date lies more than lapse_long_above_days calendar days before the extension adds lapse_cushion_long days; a lock that has been relocked and whose expired date lies lapse_long_above_days or fewer calendar days before the extension adds lapse_cushion_short day; any other lock adds none."
      notice_age: "where the buyer's latest closing date notice from Calloway is dated notice_recent_days or fewer calendar days before the extension"
      notice_cushion: "Notice-age cushion: where the buyer's latest closing date notice from Calloway is dated notice_recent_days or fewer calendar days before the extension, notice_cushion_recent days are added; where it is dated more than notice_recent_days but no more than notice_older_days days before, notice_cushion_older day is added; otherwise none is added."
      completion_gap: "the completion gap is the calendar days from the purchase agreement's estimated completion date to its scheduled closing date"
      gap_cushion: "a gap of gap_tight_days or fewer adds gap_cushion_tight days; a gap above gap_tight_days up to gap_near_days adds gap_cushion_near day; a longer gap adds none."
      days_needed: "The extension days are the days to cover, plus every cushion below, rounded up to whole increments of extension_increment_days."
      increments: "The extension days are the days to cover, plus every cushion below, rounded up to whole increments of extension_increment_days."
      allowed_increments: "The increments written never exceed max_extension_increments less the extensions already used"
      result: "the extension days never exceed max_total_extension_days less the extension days already used."
    factors:
      - id: funding_lag_cushion
        effect: parameter
        decides: funding_lag
        bindings: [community, funding_lag]
        ladder:
          - {when: "purchase agreement community is Sierra Vista Ranch", value: "K('dry_funding_days_california')"}
          - {when: "purchase agreement community is Mesquite Trails", value: "K('dry_funding_days_arizona')"}
          - {when: "otherwise", value: "0"}
        baseline: {funding_lag: "0"}
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: construction_slip_cushion
        effect: method
        decides: slip_cushion
        bindings: [slip_days, slip_cushion]
        ladder:
          - {when: "construction slip above long_slip_above_days", method: "the cushion is counted from the slip itself: one day per slip_week_days days of slip, any part counted as a whole"}
          - {when: "construction slip of one day up to long_slip_above_days", method: "a flat slip_cushion_days is added"}
          - {when: "otherwise", method: "no slip cushion is counted"}
        baseline: {slip_cushion: "0"}
        evidence: [cross_category, date]
        cross_difficulty: purchase
      - id: buyer_move_cushion
        effect: parameter
        decides: buyer_cushion
        bindings: [buyer_moves, buyer_cushion]
        ladder:
          - {when: "two or more buyer-requested closing extensions written on the agreement", value: "K('buyer_move_cushion_two')"}
          - {when: "one buyer-requested closing extension written", value: "K('buyer_move_cushion_one')"}
          - {when: "otherwise", value: "0"}
        baseline: {buyer_cushion: "0"}
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: lapse_cushion
        effect: parameter
        decides: lapse_cushion
        bindings: [lapse_len, lapse_cushion]
        ladder:
          - {when: "lock relocked and expired date more than lapse_long_above_days days before the extension", value: "K('lapse_cushion_long')"}
          - {when: "lock relocked and expired date lapse_long_above_days or fewer days before the extension", value: "K('lapse_cushion_short')"}
          - {when: "otherwise", value: "0"}
        baseline: {lapse_cushion: "0"}
        evidence: [date, history]
        cross_difficulty: null
      - id: notice_age_cushion
        effect: parameter
        decides: notice_cushion
        bindings: [notice_age, notice_cushion]
        ladder:
          - {when: "latest closing date notice dated notice_recent_days or fewer days before the extension", value: "K('notice_cushion_recent')"}
          - {when: "latest closing date notice dated more than notice_recent_days up to notice_older_days days before", value: "K('notice_cushion_older')"}
          - {when: "otherwise", value: "0"}
        baseline: {notice_cushion: "0"}
        evidence: [cross_category, date]
        cross_difficulty: purchase
      - id: completion_gap_cushion
        effect: parameter
        decides: gap_cushion
        bindings: [completion_gap, gap_cushion]
        ladder:
          - {when: "completion gap of gap_tight_days or fewer", value: "K('gap_cushion_tight')"}
          - {when: "completion gap above gap_tight_days up to gap_near_days", value: "K('gap_cushion_near')"}
          - {when: "otherwise", value: "0"}
        baseline: {gap_cushion: "0"}
        evidence: [cross_category, date]
        cross_difficulty: purchase
    inputs:
      history:
        - {category: purchase, table: purchase_events, aggregate: latest, field: event_date, filters: {notice_type: closing_date_notice}}
      cross_category: [purchase]

  - id: lock_ext_extension_charge
    base_policy_refs: [lock_extensions, lock_float_down_option, lock_expiry_relock, lock_terms_change]
    overwrite:
      - base_policy: lock_extensions
        superseded_clause: >-
          Each increment carries an extension fee of extension_fee_pct_per_increment percent of the loan amount, rounded half up to the cent, with a floor of extension_fee_min_usd; where first_extension_free is true the first increment on the lock carries a fee of zero.
        replaced_by: >-
          The per-increment extension fee is the extension fee percent of the loan amount on the lock, rounded half up to the cent, with a floor of extension_fee_min_usd.
    trigger: state_due
    subject: [lock_charge_assessed]
    computes: amount
    target_tool: assess_extension_charge_644b0045
    params:
      long_extension_add_pct: 0.0625
      two_increment_add_pct: 0.03125
      allowance_both_add_pct: 0.0625
      allowance_one_add_pct: 0.03125
      early_lead_above_days: 20
      mid_lead_from_days: 8
      early_lead_credit_pct: 0.0625
      mid_lead_credit_pct: 0.03125
      held_fee_full_credit_pct: 0.03125
      held_fee_part_credit_pct: 0.015625
      binder_credit_pct: 0.03125
      quote_credit_pct: 0.015625
      prior_increment_step: 0.5
    rule: >-
      The extension fee is fixed only after the lock record carries the extension it prices, its days counted in the extension days used beyond the extension days already charged on the lock ledger.
      The increments priced are the extension days used on the lock less the extension days already carried by extension_fee charges on the lock ledger, divided by extension_increment_days.
      The extension fee percent starts at extension_fee_pct_per_increment and the step-up multiplier starts at one.
      The per-increment extension fee is the extension fee percent of the loan amount on the lock, rounded half up to the cent, with a floor of extension_fee_min_usd.
      The extension charge is the per-increment extension fee for the first increment priced, where first_extension_free is true and no increment had been written on the lock before it that first increment is charged at zero, and the per-increment extension fee times the step-up multiplier for each further increment priced, the total rounded half up to the cent.
      A lock has been relocked when its ledger carries a relock_fee charge.
      Extension step-up: on a lock that has been relocked, the step-up multiplier is one plus the number of relock_fee charges on the lock ledger plus prior_increment_step for each increment written before this extension; on a lock that has not been relocked but carried increments written before this extension, it is one plus prior_increment_step for each increment written before this extension; on any other lock it is one.
      Extension length add-on: an extension of three or more increments adds long_extension_add_pct percentage points to the extension fee percent; an extension of two increments adds two_increment_add_pct percentage points; a single increment adds nothing.
      Extension allowance add-on: an extension after which both max_extension_increments increments and max_total_extension_days days are used adds allowance_both_add_pct percentage points to the extension fee percent; one after which either max_extension_increments increments or max_total_extension_days days, but not both, are used adds allowance_one_add_pct percentage points; any other extension adds nothing.
      Extension lead credit: the extension lead is the calendar days from the extension date to the lock expiration date as it stood before the extension; a lead above early_lead_above_days takes early_lead_credit_pct percentage points off the extension fee percent; a lead of mid_lead_from_days up to early_lead_above_days takes mid_lead_credit_pct percentage points off; a shorter lead takes nothing off.
      Upfront fee credit: the upfront fee held is the lock fee payments on the lock ledger less refunds, forfeitures and credits of that fee; an upfront fee held of at least twice extension_fee_min_usd takes held_fee_full_credit_pct percentage points off the extension fee percent; an upfront fee held above zero but less than that takes held_fee_part_credit_pct percentage points off; none takes nothing off.
      Insurance binder credit: where the Calloway Insurance Agency homeowners policy written for the lock's purchase agreement is bound or in force, binder_credit_pct percentage points are taken off the extension fee percent; where it is quoted, quote_credit_pct percentage points are taken off; otherwise nothing is taken off.
      The add-ons are added to, and the credits taken from, extension_fee_pct_per_increment to form the extension fee percent before it is applied to the loan amount.
      The charge is booked on the lock ledger as an extension_fee charge with its own charge number and the extension days it prices.
    baseline:
      rule: >-
        The increments priced are the extension days used on the lock less the extension days already carried by extension_fee charges on the lock ledger, divided by extension_increment_days.
        The extension fee percent starts at extension_fee_pct_per_increment and the step-up multiplier starts at one.
        The per-increment extension fee is the extension fee percent of the loan amount on the lock, rounded half up to the cent, with a floor of extension_fee_min_usd.
        The extension charge is the per-increment extension fee for the first increment priced, where first_extension_free is true and no increment had been written on the lock before it that first increment is charged at zero, and the per-increment extension fee times the step-up multiplier for each further increment priced, the total rounded half up to the cent.
      params: [extension_fee_pct_per_increment, extension_fee_min_usd, extension_increment_days, first_extension_free]
    prerequisite:
      - problem: lock_ext_extension_days
        kind: value_input
        gate: new_increments
        form: state
        policy_source: >-
          The extension fee is fixed only after the lock record carries the extension it prices, its days counted in the extension days used beyond the extension days already charged on the lock ledger.
        condition: >-
          rate_locks.extension_days_used exceeds the sum of extension_days on the lock's lock_charge_assessed rows of charge_type extension_fee, the excess being the extension being priced.
        resolved_by: extend_rate_lock_1be9088d
        effect: >-
          The extension raises extension_days_used and extensions_used on the lock, so the increments priced (new_increments) move from zero to the increments the extension wrote, and the step-up and allowance add-on read the post-extension counters.
    cross_category:
      - category: insurance
        as: branch
        reads: [status, purchase_id]
        note: The insurance binder credit is decided from the status of the homeowners policy written for the lock's purchase agreement.
    compute:
      - prior_charged_days: "SUM('lock_events', 'extension_days', event_type='lock_charge_assessed', charge_type='extension_fee')"
      - new_days: "F('extension_days_used') - prior_charged_days"
      - new_increments: "new_days / P('extension_increment_days')"
      - prior_increments: "F('extensions_used') - new_increments"
      - relock_charges: "COUNT('lock_events', event_type='lock_charge_assessed', charge_type='relock_fee')"
      - step_mult: "1 + relock_charges + K('prior_increment_step') * prior_increments if relock_charges >= 1 else (1 + K('prior_increment_step') * prior_increments if prior_increments >= 1 else 1)"
      - length_add: "K('long_extension_add_pct') if new_increments >= 3 else (K('two_increment_add_pct') if new_increments == 2 else 0)"
      - allowance_days: "SUM('lock_events', 'extension_days', event_type='lock_charge_assessed', charge_type='extension_fee') + new_days"
      - allowance_add: "K('allowance_both_add_pct') if (F('extensions_used') >= P('max_extension_increments') and allowance_days >= P('max_total_extension_days')) else (K('allowance_one_add_pct') if (F('extensions_used') >= P('max_extension_increments') or allowance_days >= P('max_total_extension_days')) else 0)"
      - lead_days: "DAYS(NOW, F('lock_expiration_date')) - new_days"
      - lead_credit: "K('early_lead_credit_pct') if lead_days > K('early_lead_above_days') else (K('mid_lead_credit_pct') if lead_days >= K('mid_lead_from_days') else 0)"
      - fee_held: "SUM('lock_events', 'amount', event_type='lock_fee_paid') - SUM('lock_events', 'amount', event_type='lock_fee_refunded') - SUM('lock_events', 'amount', event_type='lock_fee_forfeited') - SUM('lock_events', 'amount', event_type='lock_fee_credited')"
      - held_credit: "K('held_fee_full_credit_pct') if fee_held >= 2 * P('extension_fee_min_usd') else (K('held_fee_part_credit_pct') if fee_held > 0 else 0)"
      - policy_status: "CFIELD('insurance', 'status', purchase_id=F('purchase_id'))"
      - binder_credit: "K('binder_credit_pct') if (policy_status == 'bound' or policy_status == 'in_force') else (K('quote_credit_pct') if policy_status == 'quoted' else 0)"
      - ext_pct: "P('extension_fee_pct_per_increment') + length_add + allowance_add - lead_credit - held_credit - binder_credit"
      - per_increment: "MX(RND(F('loan_amount') * ext_pct / 100 + 0.0000001, 2), P('extension_fee_min_usd'))"
      - first_units: "0 if (P('first_extension_free') and prior_increments == 0) else 1"
      - result: "RND(per_increment * (first_units + step_mult * (new_increments - 1)) + 0.0000001, 2) if new_increments >= 1 else 0"
    compute_basis:
      prior_charged_days: "The increments priced are the extension days used on the lock less the extension days already carried by extension_fee charges on the lock ledger, divided by extension_increment_days."
      new_days: "The increments priced are the extension days used on the lock less the extension days already carried by extension_fee charges on the lock ledger, divided by extension_increment_days."
      new_increments: "The increments priced are the extension days used on the lock less the extension days already carried by extension_fee charges on the lock ledger, divided by extension_increment_days."
      prior_increments: "on a lock that has not been relocked but carried increments written before this extension"
      relock_charges: "on a lock that has been relocked, the step-up multiplier is one plus the number of relock_fee charges on the lock ledger"
      step_mult: "Extension step-up: on a lock that has been relocked, the step-up multiplier is one plus the number of relock_fee charges on the lock ledger plus prior_increment_step for each increment written before this extension; on a lock that has not been relocked but carried increments written before this extension, it is one plus prior_increment_step for each increment written before this extension; on any other lock it is one."
      length_add: "Extension length add-on: an extension of three or more increments adds long_extension_add_pct percentage points to the extension fee percent; an extension of two increments adds two_increment_add_pct percentage points; a single increment adds nothing."
      allowance_days: "an extension after which both max_extension_increments increments and max_total_extension_days days are used"
      allowance_add: "Extension allowance add-on: an extension after which both max_extension_increments increments and max_total_extension_days days are used adds allowance_both_add_pct percentage points to the extension fee percent; one after which either max_extension_increments increments or max_total_extension_days days, but not both, are used adds allowance_one_add_pct percentage points; any other extension adds nothing."
      lead_days: "the extension lead is the calendar days from the extension date to the lock expiration date as it stood before the extension"
      lead_credit: "a lead above early_lead_above_days takes early_lead_credit_pct percentage points off the extension fee percent; a lead of mid_lead_from_days up to early_lead_above_days takes mid_lead_credit_pct percentage points off; a shorter lead takes nothing off."
      fee_held: "the upfront fee held is the lock fee payments on the lock ledger less refunds, forfeitures and credits of that fee"
      held_credit: "an upfront fee held of at least twice extension_fee_min_usd takes held_fee_full_credit_pct percentage points off the extension fee percent; an upfront fee held above zero but less than that takes held_fee_part_credit_pct percentage points off; none takes nothing off."
      policy_status: "Insurance binder credit: where the Calloway Insurance Agency homeowners policy written for the lock's purchase agreement is bound or in force, binder_credit_pct percentage points are taken off the extension fee percent; where it is quoted, quote_credit_pct percentage points are taken off; otherwise nothing is taken off."
      binder_credit: "Insurance binder credit: where the Calloway Insurance Agency homeowners policy written for the lock's purchase agreement is bound or in force, binder_credit_pct percentage points are taken off the extension fee percent; where it is quoted, quote_credit_pct percentage points are taken off; otherwise nothing is taken off."
      ext_pct: "The add-ons are added to, and the credits taken from, extension_fee_pct_per_increment to form the extension fee percent before it is applied to the loan amount."
      per_increment: "The per-increment extension fee is the extension fee percent of the loan amount on the lock, rounded half up to the cent, with a floor of extension_fee_min_usd."
      first_units: "where first_extension_free is true and no increment had been written on the lock before it that first increment is charged at zero"
      result: "The extension charge is the per-increment extension fee for the first increment priced, where first_extension_free is true and no increment had been written on the lock before it that first increment is charged at zero, and the per-increment extension fee times the step-up multiplier for each further increment priced, the total rounded half up to the cent."
    factors:
      - id: extension_step_up
        effect: method
        decides: step_mult
        bindings: [prior_increments, relock_charges, step_mult]
        ladder:
          - {when: "the lock has been relocked", method: "each increment after the first is priced at the per-increment extension fee times one plus the relock_fee charges counted on the lock ledger plus prior_increment_step for each earlier increment"}
          - {when: "the lock has not been relocked but carried increments written before this extension", method: "each increment after the first is priced at the per-increment extension fee times one plus prior_increment_step for each earlier increment"}
          - {when: "otherwise", method: "every increment is priced at the per-increment extension fee"}
        baseline: {step_mult: "1"}
        evidence: [history]
        cross_difficulty: null
      - id: extension_length_add_on
        effect: parameter
        decides: length_add
        bindings: [prior_charged_days, new_days, new_increments, length_add]
        ladder:
          - {when: "three or more increments priced", value: "K('long_extension_add_pct')"}
          - {when: "two increments priced", value: "K('two_increment_add_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {length_add: "0"}
        evidence: [history]
        cross_difficulty: null
      - id: extension_allowance_add_on
        effect: parameter
        decides: allowance_add
        bindings: [allowance_days, allowance_add]
        ladder:
          - {when: "after the extension both max_extension_increments and max_total_extension_days are used", value: "K('allowance_both_add_pct')"}
          - {when: "after the extension either max_extension_increments or max_total_extension_days, not both, is used", value: "K('allowance_one_add_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {allowance_add: "0"}
        evidence: [tier_param, history]
        cross_difficulty: null
      - id: extension_lead_credit
        effect: parameter
        decides: lead_credit
        bindings: [lead_days, lead_credit]
        ladder:
          - {when: "extension lead above early_lead_above_days", value: "K('early_lead_credit_pct')"}
          - {when: "extension lead of mid_lead_from_days up to early_lead_above_days", value: "K('mid_lead_credit_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {lead_credit: "0"}
        evidence: [date]
        cross_difficulty: null
      - id: upfront_fee_held_credit
        effect: parameter
        decides: held_credit
        bindings: [fee_held, held_credit]
        ladder:
          - {when: "upfront fee held at least twice extension_fee_min_usd", value: "K('held_fee_full_credit_pct')"}
          - {when: "upfront fee held above zero but less than twice extension_fee_min_usd", value: "K('held_fee_part_credit_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {held_credit: "0"}
        evidence: [history]
        cross_difficulty: null
      - id: insurance_binder_credit
        effect: parameter
        decides: binder_credit
        bindings: [policy_status, binder_credit]
        ladder:
          - {when: "the homeowners policy for the purchase agreement is bound or in force", value: "K('binder_credit_pct')"}
          - {when: "the homeowners policy for the purchase agreement is quoted", value: "K('quote_credit_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {binder_credit: "0"}
        evidence: [cross_category]
        cross_difficulty: insurance
    inputs:
      history:
        - {table: lock_events, aggregate: sum, field: extension_days, filters: {event_type: lock_charge_assessed, charge_type: extension_fee}}
        - {table: lock_events, aggregate: sum, field: amount, filters: {event_type: lock_fee_paid}}
      cross_category: [insurance]

  - id: lock_ext_builder_delay_waiver
    base_policy_refs: [lock_builder_delay_waiver, lock_extensions]
    overwrite:
      - base_policy: lock_extensions
        superseded_clause: >-
          When the extension is needed because the purchase agreement's closing date moved for a builder delay, builder_delay_waiver_pct percent of the extension charge is waived under lock_builder_delay_waiver.
        replaced_by: >-
          The builder-delay waiver is builder_delay_waiver_pct percent of the extension charge, times the builder share, times the lapse rate, rounded half up to the cent, plus the reminder goodwill and the fee-standing goodwill, never more than the extension charge itself.
      - base_policy: lock_builder_delay_waiver
        superseded_clause: >-
          An extension charge is waived at builder_delay_waiver_pct percent when the purchase agreement's scheduled closing date moved later because of a builder delay and the extension was needed to reach the new closing date
        replaced_by: >-
          The builder-delay waiver is builder_delay_waiver_pct percent of the extension charge, times the builder share, times the lapse rate, rounded half up to the cent, plus the reminder goodwill and the fee-standing goodwill, never more than the extension charge itself.
    trigger: state_due
    subject: [lock_charge_waived]
    computes: amount
    target_tool: waive_builder_delay_charge_21040a50
    params:
      lapse_wide_after_days: 7
      lapse_wide_rate: 0.5
      lapse_narrow_rate: 0.8
      missing_reminder_goodwill_usd: 300.00
      late_reminder_goodwill_usd: 150.00
      clean_full_goodwill_usd: 100.00
      clean_short_goodwill_usd: 50.00
      prompt_fee_days: 1
    rule: >-
      The builder-delay waiver is not fixed until the lock ledger carries, under its own charge number, the extension charge for the days added to reach the moved closing date.
      The extension charge waived is the latest extension_fee charge on the lock ledger, and the waiver names that charge number; relock, float-down and program change charges are never waived.
      The builder-delay waiver is builder_delay_waiver_pct percent of the extension charge, times the builder share, times the lapse rate, rounded half up to the cent, plus the reminder goodwill and the fee-standing goodwill, never more than the extension charge itself.
      The builder share starts at one and the lapse rate starts at one.
      Builder share: the construction slip is the calendar days from the purchase agreement's contract completion date to its estimated completion date, and the buyer move days are the buyer-requested closing extensions written on the agreement times the collection's closing_extension_days; where the agreement carries a buyer-requested closing extension and a construction slip of at least one day, the builder share is the construction slip divided by the sum of the construction slip and the buyer move days; where it carries a buyer-requested closing extension and no construction slip, the builder share is zero; otherwise the builder share is one.
      Lapse rate: the lapse gap is the calendar days from the buyer's latest closing date notice from Calloway to the lock's expired date; on a relocked lock whose lapse gap is above lapse_wide_after_days the lapse rate is lapse_wide_rate; on a relocked lock whose lapse gap is one day up to lapse_wide_after_days it is lapse_narrow_rate; otherwise it is one.
      Reminder goodwill: the reminder lead is the calendar days from the latest expiry reminder on the lock ledger to the last day of the lock before its expired date; where the ledger carries no expiry reminder the goodwill is missing_reminder_goodwill_usd; where the reminder lead is shorter than expiry_notice_days_before it is late_reminder_goodwill_usd; otherwise it is zero.
      Fee-standing goodwill: the upfront fee due is upfront_fee_pct percent of the loan amount on the lock, rounded half up to the cent, with a floor of upfront_fee_min_usd, and the fee lag is the calendar days from the lock request date to the latest lock fee payment on the lock ledger; where the lock fee payments on the ledger add up to at least the upfront fee due and the fee lag is prompt_fee_days or fewer, the goodwill is clean_full_goodwill_usd; where they add up to at least the upfront fee due and the fee lag is longer than prompt_fee_days, it is clean_short_goodwill_usd; otherwise it is zero.
      The waiver is booked on the lock ledger with waiver reason builder_delay.
    baseline:
      rule: >-
        The extension charge waived is the latest extension_fee charge on the lock ledger, and the waiver names that charge number; relock, float-down and program change charges are never waived.
        The builder-delay waiver is builder_delay_waiver_pct percent of the extension charge, times the builder share, times the lapse rate, rounded half up to the cent, plus the reminder goodwill and the fee-standing goodwill, never more than the extension charge itself.
        The builder share starts at one and the lapse rate starts at one.
      params: [builder_delay_waiver_pct]
    prerequisite:
      - problem: lock_ext_extension_charge
        kind: value_input
        gate: charge_amount
        form: state
        policy_source: >-
          The builder-delay waiver is not fixed until the lock ledger carries, under its own charge number, the extension charge for the days added to reach the moved closing date.
        condition: >-
          lock_events carries a lock_charge_assessed row of charge_type extension_fee whose extension_days equal the days the latest extension added to the lock.
        resolved_by: assess_extension_charge_644b0045
        effect: >-
          The extension charge row puts the amount the waiver acts on (charge_amount) and the charge number the waiver names on the ledger.
    cross_category:
      - category: purchase
        as: history
        reads: [contract_completion_date, estimated_completion_date, closing_extensions_used, variant_name, purchase_events.event_date, purchase_events.event_type]
        note: The builder share and lapse rate are decided from the purchase agreement and its closing date notices.
    compute:
      - charge_amount: "LATEST('lock_events', 'amount', event_type='lock_charge_assessed', charge_type='extension_fee')"
      - buyer_moves: "CFIELD('purchase', 'closing_extensions_used', purchase_id=F('purchase_id'))"
      - slip_days: "DAYS(CFIELD('purchase', 'contract_completion_date', purchase_id=F('purchase_id')), CFIELD('purchase', 'estimated_completion_date', purchase_id=F('purchase_id')))"
      - buyer_move_days: "buyer_moves * CPARAM('purchase', 'closing_extension_days', purchase_id=F('purchase_id'))"
      - builder_share: "slip_days / (slip_days + buyer_move_days) if (buyer_moves >= 1 and slip_days >= 1) else (0 if (buyer_moves >= 1 and slip_days < 1) else 1)"
      - relocks_on_ledger: "COUNT('lock_events', event_type='lock_charge_assessed', charge_type='relock_fee')"
      - lapse_gap: "DAYS(XLATEST('purchase', 'purchase_events', 'event_date', notice_type='closing_date_notice'), F('expired_date')) if F('expired_date') else -1"
      - lapse_rate: "K('lapse_wide_rate') if (relocks_on_ledger >= 1 and lapse_gap > K('lapse_wide_after_days')) else (K('lapse_narrow_rate') if (relocks_on_ledger >= 1 and lapse_gap >= 1 and lapse_gap <= K('lapse_wide_after_days')) else 1)"
      - last_reminder: "LATEST('lock_events', 'event_date', event_type='lock_notice_sent', notice_type='expiry_reminder')"
      - reminder_lead: "DAYS(last_reminder, F('expired_date')) - 1 if (last_reminder and F('expired_date')) else -1"
      - reminder_goodwill: "K('missing_reminder_goodwill_usd') if reminder_lead < 0 else (K('late_reminder_goodwill_usd') if reminder_lead < P('expiry_notice_days_before') else 0)"
      - fee_paid_total: "SUM('lock_events', 'amount', event_type='lock_fee_paid')"
      - fee_due: "MX(RND(F('loan_amount') * P('upfront_fee_pct') / 100 + 0.0000001, 2), P('upfront_fee_min_usd'))"
      - fee_lag: "DAYS(F('requested_date'), LATEST('lock_events', 'event_date', event_type='lock_fee_paid')) if fee_paid_total > 0 else -1"
      - standing_goodwill: "K('clean_full_goodwill_usd') if (fee_paid_total >= fee_due and fee_lag >= 0 and fee_lag <= K('prompt_fee_days')) else (K('clean_short_goodwill_usd') if (fee_paid_total >= fee_due and fee_lag > K('prompt_fee_days')) else 0)"
      - waived_core: "RND(charge_amount * P('builder_delay_waiver_pct') / 100 * builder_share * lapse_rate + 0.0000001, 2)"
      - result: "RND(MN(waived_core + reminder_goodwill + standing_goodwill, charge_amount) + 0.0000001, 2)"
    compute_basis:
      charge_amount: "The extension charge waived is the latest extension_fee charge on the lock ledger, and the waiver names that charge number"
      buyer_moves: "the buyer move days are the buyer-requested closing extensions written on the agreement times the collection's closing_extension_days"
      slip_days: "the construction slip is the calendar days from the purchase agreement's contract completion date to its estimated completion date"
      buyer_move_days: "the buyer move days are the buyer-requested closing extensions written on the agreement times the collection's closing_extension_days"
      builder_share: "where the agreement carries a buyer-requested closing extension and a construction slip of at least one day, the builder share is the construction slip divided by the sum of the construction slip and the buyer move days; where it carries a buyer-requested closing extension and no construction slip, the builder share is zero; otherwise the builder share is one."
      relocks_on_ledger: "on a relocked lock whose lapse gap is above lapse_wide_after_days the lapse rate is lapse_wide_rate"
      lapse_gap: "the lapse gap is the calendar days from the buyer's latest closing date notice from Calloway to the lock's expired date"
      lapse_rate: "on a relocked lock whose lapse gap is above lapse_wide_after_days the lapse rate is lapse_wide_rate; on a relocked lock whose lapse gap is one day up to lapse_wide_after_days it is lapse_narrow_rate; otherwise it is one."
      last_reminder: "the reminder lead is the calendar days from the latest expiry reminder on the lock ledger to the last day of the lock before its expired date"
      reminder_lead: "the reminder lead is the calendar days from the latest expiry reminder on the lock ledger to the last day of the lock before its expired date"
      reminder_goodwill: "where the ledger carries no expiry reminder the goodwill is missing_reminder_goodwill_usd; where the reminder lead is shorter than expiry_notice_days_before it is late_reminder_goodwill_usd; otherwise it is zero."
      fee_paid_total: "where the lock fee payments on the ledger add up to at least the upfront fee due"
      fee_due: "the upfront fee due is upfront_fee_pct percent of the loan amount on the lock, rounded half up to the cent, with a floor of upfront_fee_min_usd"
      fee_lag: "the fee lag is the calendar days from the lock request date to the latest lock fee payment on the lock ledger"
      standing_goodwill: "Fee-standing goodwill: the upfront fee due is upfront_fee_pct percent of the loan amount on the lock, rounded half up to the cent, with a floor of upfront_fee_min_usd, and the fee lag is the calendar days from the lock request date to the latest lock fee payment on the lock ledger; where the lock fee payments on the ledger add up to at least the upfront fee due and the fee lag is prompt_fee_days or fewer, the goodwill is clean_full_goodwill_usd; where they add up to at least the upfront fee due and the fee lag is longer than prompt_fee_days, it is clean_short_goodwill_usd; otherwise it is zero."
      waived_core: "The builder-delay waiver is builder_delay_waiver_pct percent of the extension charge, times the builder share, times the lapse rate, rounded half up to the cent"
      result: "plus the reminder goodwill and the fee-standing goodwill, never more than the extension charge itself."
    factors:
      - id: builder_share
        effect: method
        decides: builder_share
        bindings: [buyer_moves, slip_days, buyer_move_days, builder_share]
        ladder:
          - {when: "a buyer-requested closing extension on the agreement and a construction slip of at least one day", method: "the builder share is the construction slip divided by the construction slip plus the buyer move days"}
          - {when: "a buyer-requested closing extension on the agreement and no construction slip", method: "the builder share is zero"}
          - {when: "otherwise", method: "the builder share is one"}
        baseline: {builder_share: "1"}
        evidence: [cross_category, date]
        cross_difficulty: purchase
      - id: lapse_rate
        effect: parameter
        decides: lapse_rate
        bindings: [relocks_on_ledger, lapse_gap, lapse_rate]
        ladder:
          - {when: "relocked lock and lapse gap above lapse_wide_after_days", value: "K('lapse_wide_rate')"}
          - {when: "relocked lock and lapse gap of one day up to lapse_wide_after_days", value: "K('lapse_narrow_rate')"}
          - {when: "otherwise", value: "1"}
        baseline: {lapse_rate: "1"}
        evidence: [history, cross_category, date]
        cross_difficulty: purchase
      - id: reminder_goodwill
        effect: parameter
        decides: reminder_goodwill
        bindings: [last_reminder, reminder_lead, reminder_goodwill]
        ladder:
          - {when: "no expiry reminder on the lock ledger", value: "K('missing_reminder_goodwill_usd')"}
          - {when: "reminder lead shorter than expiry_notice_days_before", value: "K('late_reminder_goodwill_usd')"}
          - {when: "otherwise", value: "0"}
        baseline: {reminder_goodwill: "0"}
        evidence: [history, date]
        cross_difficulty: null
      - id: fee_standing_goodwill
        effect: parameter
        decides: standing_goodwill
        bindings: [fee_paid_total, fee_due, fee_lag, standing_goodwill]
        ladder:
          - {when: "lock fee payments add up to at least the upfront fee due and the fee lag is prompt_fee_days or fewer", value: "K('clean_full_goodwill_usd')"}
          - {when: "lock fee payments add up to at least the upfront fee due and the fee lag is longer than prompt_fee_days", value: "K('clean_short_goodwill_usd')"}
          - {when: "otherwise", value: "0"}
        baseline: {standing_goodwill: "0"}
        evidence: [history, date]
        cross_difficulty: null
    inputs:
      history:
        - {table: lock_events, aggregate: latest, field: amount, filters: {event_type: lock_charge_assessed, charge_type: extension_fee}}
        - {table: lock_events, aggregate: sum, field: amount, filters: {event_type: lock_fee_paid}}
      cross_category: [purchase]

  - id: lock_ext_loan_resize
    base_policy_refs: [lock_term_eligibility, lock_terms_change]
    overwrite: []
    trigger: state_due
    subject: [lock_terms_changed]
    computes: loan_amount
    target_tool: resize_lock_loan_amount_60b17697
    params:
      layer_score_below: 720
      layer_both_points: 2.5
      layer_score_only_points: 1.0
      greenbelt_points: 1.0
      view_points: 2.0
      horizon_long_days: 240
      horizon_mid_days: 180
      horizon_long_points: 2.0
      horizon_mid_points: 1.0
      deposit_high_pct: 3.0
      deposit_mid_pct: 2.0
      deposit_high_points: 1.0
      deposit_mid_points: 0.5
      ipc_high_pct: 6.0
      ipc_low_pct: 2.0
    rule: >-
      A lock whose loan amount exceeds the resized loan limit worked out on the purchase agreement's current contract price is brought down to that limit by a terms change that lowers the loan amount; a decrease in the loan amount never re-prices.
      The resized loan limit is the allowed loan-to-value percent of the price basis, rounded down to the whole dollar.
      The allowed loan-to-value percent starts at max_ltv_pct.
      The price basis is the contract price on the purchase agreement.
      Risk-layering reduction: the requested loan-to-value is the loan amount on the lock request divided by the purchase agreement's current contract price, as a percent; a lock whose qualifying credit score is below layer_score_below and whose requested loan-to-value is above max_ltv_pct loses layer_both_points from the allowed loan-to-value percent; a lock whose qualifying credit score is below layer_score_below and whose requested loan-to-value is max_ltv_pct or less loses layer_score_only_points; any other lock loses nothing.
      Homesite-class reduction: where the converted Homesite Reservation on the agreement is a Water-View Homesite or a Golf-Frontage Homesite, view_points come off the allowed loan-to-value percent; where it is a Greenbelt Homesite or a Cul-de-Sac Homesite, greenbelt_points come off; any other class takes nothing off.
      Build-horizon reduction: the build horizon is the calendar days from the lock request date to the purchase agreement's estimated completion date; a horizon above horizon_long_days takes horizon_long_points off the allowed loan-to-value percent; a horizon above horizon_mid_days up to horizon_long_days takes horizon_mid_points off; a shorter horizon takes nothing off.
      Deposit compensating factor: the deposit share is the deposits posted on the buyer's purchase ledger for the agreement, reservation funds transferred to it included, as a percent of the agreement's contract price; a deposit share of deposit_high_pct or more adds deposit_high_points to the allowed loan-to-value percent; a deposit share of deposit_mid_pct up to deposit_high_pct adds deposit_mid_points; a smaller share adds nothing.
      Builder-incentive price basis: the incentive share is the builder incentives granted on the buyer's purchase ledger as a percent of the contract price; where it is above ipc_high_pct, the whole of the incentives above ipc_high_pct percent of the contract price is taken off the contract price to form the price basis; where it is above ipc_low_pct up to ipc_high_pct, half of the incentives above ipc_low_pct percent of the contract price is taken off; otherwise the price basis is the contract price.
      The reductions are taken from, and the compensating factor added to, max_ltv_pct before the percent is applied to the price basis, and the result is never above max_ltv_pct.
      The new loan-to-value written with the terms change is the resized loan amount divided by the contract price, as a percent rounded half up to two decimal places.
    baseline:
      rule: >-
        The resized loan limit is the allowed loan-to-value percent of the price basis, rounded down to the whole dollar.
        The allowed loan-to-value percent starts at max_ltv_pct.
        The price basis is the contract price on the purchase agreement.
      params: [max_ltv_pct]
    prerequisite: []
    cross_category:
      - category: purchase
        as: history
        reads: [contract_price, estimated_completion_date, reservation_id, purchase_events.amount, purchase_events.event_type]
        note: The build-horizon reduction, the deposit compensating factor and the builder-incentive price basis are decided from the purchase agreement and its ledger.
      - category: homesite
        as: branch
        reads: [variant_name]
        note: The homesite-class reduction is decided from the class of the converted Homesite Reservation.
    compute:
      - contract_price: "CFIELD('purchase', 'contract_price', purchase_id=F('purchase_id'))"
      - requested_ltv: "F('loan_amount') / CFIELD('purchase', 'contract_price', purchase_id=F('purchase_id')) * 100"
      - layer_points: "K('layer_both_points') if (F('qualifying_credit_score') < K('layer_score_below') and requested_ltv > P('max_ltv_pct')) else (K('layer_score_only_points') if (F('qualifying_credit_score') < K('layer_score_below') and requested_ltv <= P('max_ltv_pct')) else 0)"
      - homesite_class: "CFIELD('homesite', 'variant_name', reservation_id=CFIELD('purchase', 'reservation_id', purchase_id=F('purchase_id')))"
      - class_points: "K('view_points') if (homesite_class == 'Water-View Homesite' or homesite_class == 'Golf-Frontage Homesite') else (K('greenbelt_points') if (homesite_class == 'Greenbelt Homesite' or homesite_class == 'Cul-de-Sac Homesite') else 0)"
      - build_horizon: "DAYS(F('requested_date'), CFIELD('purchase', 'estimated_completion_date', purchase_id=F('purchase_id')))"
      - horizon_points: "K('horizon_long_points') if build_horizon > K('horizon_long_days') else (K('horizon_mid_points') if build_horizon > K('horizon_mid_days') else 0)"
      - deposit_share: "XSUM('purchase', 'purchase_events', 'amount', event_type='purchase_deposit_posted', purchase_id=F('purchase_id')) / contract_price * 100"
      - deposit_points: "K('deposit_high_points') if deposit_share >= K('deposit_high_pct') else (K('deposit_mid_points') if deposit_share >= K('deposit_mid_pct') else 0)"
      - incentives: "XSUM('purchase', 'purchase_events', 'amount', event_type='purchase_incentive_granted', purchase_id=F('purchase_id'))"
      - price_basis: "contract_price - (incentives - contract_price * K('ipc_high_pct') / 100) if incentives > contract_price * K('ipc_high_pct') / 100 else (contract_price - (incentives - contract_price * K('ipc_low_pct') / 100) / 2 if incentives > contract_price * K('ipc_low_pct') / 100 else contract_price)"
      - allowed_ltv: "MN(P('max_ltv_pct') - layer_points - class_points - horizon_points + deposit_points, P('max_ltv_pct'))"
      - result: "int(price_basis * allowed_ltv / 100 + 0.0000001)"
    compute_basis:
      contract_price: "The price basis is the contract price on the purchase agreement."
      requested_ltv: "the requested loan-to-value is the loan amount on the lock request divided by the purchase agreement's current contract price, as a percent"
      layer_points: "Risk-layering reduction: the requested loan-to-value is the loan amount on the lock request divided by the purchase agreement's current contract price, as a percent; a lock whose qualifying credit score is below layer_score_below and whose requested loan-to-value is above max_ltv_pct loses layer_both_points from the allowed loan-to-value percent; a lock whose qualifying credit score is below layer_score_below and whose requested loan-to-value is max_ltv_pct or less loses layer_score_only_points; any other lock loses nothing."
      homesite_class: "where the converted Homesite Reservation on the agreement is a Water-View Homesite or a Golf-Frontage Homesite"
      class_points: "Homesite-class reduction: where the converted Homesite Reservation on the agreement is a Water-View Homesite or a Golf-Frontage Homesite, view_points come off the allowed loan-to-value percent; where it is a Greenbelt Homesite or a Cul-de-Sac Homesite, greenbelt_points come off; any other class takes nothing off."
      build_horizon: "the build horizon is the calendar days from the lock request date to the purchase agreement's estimated completion date"
      horizon_points: "a horizon above horizon_long_days takes horizon_long_points off the allowed loan-to-value percent; a horizon above horizon_mid_days up to horizon_long_days takes horizon_mid_points off; a shorter horizon takes nothing off."
      deposit_share: "the deposit share is the deposits posted on the buyer's purchase ledger for the agreement, reservation funds transferred to it included, as a percent of the agreement's contract price"
      deposit_points: "a deposit share of deposit_high_pct or more adds deposit_high_points to the allowed loan-to-value percent; a deposit share of deposit_mid_pct up to deposit_high_pct adds deposit_mid_points; a smaller share adds nothing."
      incentives: "the incentive share is the builder incentives granted on the buyer's purchase ledger as a percent of the contract price"
      price_basis: "where it is above ipc_high_pct, the whole of the incentives above ipc_high_pct percent of the contract price is taken off the contract price to form the price basis; where it is above ipc_low_pct up to ipc_high_pct, half of the incentives above ipc_low_pct percent of the contract price is taken off; otherwise the price basis is the contract price."
      allowed_ltv: "The reductions are taken from, and the compensating factor added to, max_ltv_pct before the percent is applied to the price basis, and the result is never above max_ltv_pct."
      result: "The resized loan limit is the allowed loan-to-value percent of the price basis, rounded down to the whole dollar."
    factors:
      - id: risk_layering_reduction
        effect: parameter
        decides: layer_points
        bindings: [requested_ltv, layer_points]
        ladder:
          - {when: "qualifying credit score below layer_score_below and requested loan-to-value above max_ltv_pct", value: "K('layer_both_points')"}
          - {when: "qualifying credit score below layer_score_below and requested loan-to-value max_ltv_pct or less", value: "K('layer_score_only_points')"}
          - {when: "otherwise", value: "0"}
        baseline: {layer_points: "0"}
        evidence: [cross_category, tier_param]
        cross_difficulty: null
      - id: homesite_class_reduction
        effect: parameter
        decides: class_points
        bindings: [homesite_class, class_points]
        ladder:
          - {when: "converted reservation is a Water-View Homesite or a Golf-Frontage Homesite", value: "K('view_points')"}
          - {when: "converted reservation is a Greenbelt Homesite or a Cul-de-Sac Homesite", value: "K('greenbelt_points')"}
          - {when: "otherwise", value: "0"}
        baseline: {class_points: "0"}
        evidence: [cross_category]
        cross_difficulty: homesite
      - id: build_horizon_reduction
        effect: parameter
        decides: horizon_points
        bindings: [build_horizon, horizon_points]
        ladder:
          - {when: "build horizon above horizon_long_days", value: "K('horizon_long_points')"}
          - {when: "build horizon above horizon_mid_days up to horizon_long_days", value: "K('horizon_mid_points')"}
          - {when: "otherwise", value: "0"}
        baseline: {horizon_points: "0"}
        evidence: [cross_category, date]
        cross_difficulty: purchase
      - id: deposit_compensating_factor
        effect: parameter
        decides: deposit_points
        bindings: [deposit_share, deposit_points]
        ladder:
          - {when: "deposit share deposit_high_pct or more", value: "K('deposit_high_points')"}
          - {when: "deposit share deposit_mid_pct up to deposit_high_pct", value: "K('deposit_mid_points')"}
          - {when: "otherwise", value: "0"}
        baseline: {deposit_points: "0"}
        evidence: [cross_category, history]
        cross_difficulty: purchase
      - id: builder_incentive_price_basis
        effect: method
        decides: price_basis
        bindings: [incentives, price_basis]
        ladder:
          - {when: "incentive share above ipc_high_pct", method: "the whole of the incentives above ipc_high_pct percent of the contract price is taken off the contract price"}
          - {when: "incentive share above ipc_low_pct up to ipc_high_pct", method: "half of the incentives above ipc_low_pct percent of the contract price is taken off the contract price"}
          - {when: "otherwise", method: "the price basis is the contract price"}
        baseline: {price_basis: "contract_price"}
        evidence: [cross_category, history]
        cross_difficulty: purchase
    inputs:
      history:
        - {category: purchase, table: purchase_events, aggregate: sum, field: amount, filters: {event_type: purchase_deposit_posted}}
        - {category: purchase, table: purchase_events, aggregate: sum, field: amount, filters: {event_type: purchase_incentive_granted}}
      cross_category: [purchase, homesite]

  - id: lock_ext_upfront_fee
    base_policy_refs: [lock_fee_and_pricing]
    overwrite:
      - base_policy: lock_fee_and_pricing
        superseded_clause: >-
          The upfront lock fee is the greater of upfront_fee_pct percent of the loan amount (rounded half up to the cent) and upfront_fee_min_usd, and is zero where upfront_fee_pct is zero
        replaced_by: >-
          The upfront lock fee is the greater of the upfront fee percent of the loan amount on the lock, rounded half up to the cent, and upfront_fee_min_usd, and is zero where upfront_fee_pct is zero; that amount is then multiplied by the buyer's fee share and rounded half up to the cent.
    trigger: on_request
    subject: [lock_fee_paid]
    computes: amount
    target_tool: pay_upfront_lock_fee_77612280
    params:
      both_credits_cap: 0.6
      one_credit_cap: 0.25
      early_lock_days: 7
      prompt_lock_days: 30
      early_lock_credit_pct: 0.125
      prompt_lock_credit_pct: 0.0625
      fee_ltv_high_above_pct: 85
      fee_ltv_mid_above_pct: 80
      fee_ltv_high_add_pct: 0.125
      fee_ltv_mid_add_pct: 0.0625
      standing_full_credit_pct: 0.0625
      standing_short_credit_pct: 0.03125
      plan_change_one_add_pct: 0.0625
      plan_change_two_add_pct: 0.125
      stale_prequal_days: 30
      stale_score_below: 720
      stale_low_score_add_pct: 0.125
      stale_high_score_add_pct: 0.0625
    rule: >-
      The upfront lock fee is fixed only after the loan amount on the lock is no more than the resized loan limit worked out on the purchase agreement's current contract price.
      The upfront fee percent starts at upfront_fee_pct and the buyer's fee share starts at one.
      The upfront lock fee is the greater of the upfront fee percent of the loan amount on the lock, rounded half up to the cent, and upfront_fee_min_usd, and is zero where upfront_fee_pct is zero; that amount is then multiplied by the buyer's fee share and rounded half up to the cent.
      The fee is paid by a method in fee_payment_methods and is booked on the lock ledger with its receipt number.
      Builder fee share: Calloway's part is half the rate_buydown_credit granted on the agreement divided by the floored fee; where the buyer's purchase ledger carries both a closing_cost_credit and a rate_buydown_credit incentive granted on the agreement, the buyer's fee share is one less Calloway's part, Calloway's part never above both_credits_cap; where it carries a rate_buydown_credit and no closing_cost_credit, the buyer's fee share is one less Calloway's part, Calloway's part never above one_credit_cap; otherwise the buyer's fee share is one.
      Early-lock credit: the lock lead is the calendar days from the purchase agreement's contract date to the lock request date; a lock lead of early_lock_days or fewer takes early_lock_credit_pct percentage points off the upfront fee percent; a lock lead above early_lock_days up to prompt_lock_days takes prompt_lock_credit_pct percentage points off; a longer lead takes nothing off.
      Fee loan-to-value add-on: the fee loan-to-value is the loan amount on the lock divided by the purchase agreement's contract price, as a percent; above fee_ltv_high_above_pct it adds fee_ltv_high_add_pct percentage points to the upfront fee percent; above fee_ltv_mid_above_pct up to fee_ltv_high_above_pct it adds fee_ltv_mid_add_pct percentage points; otherwise nothing.
      Deposit-standing credit: where the buyer's purchase ledger carries no returned payment and at least two posted deposits on the agreement, reservation funds transferred to it counted as deposits, standing_full_credit_pct percentage points come off the upfront fee percent; where it carries no returned payment and fewer than two posted deposits, standing_short_credit_pct percentage points come off; otherwise nothing comes off.
      Plan-change add-on: two or more plan_change_fee charges on the agreement add plan_change_two_add_pct percentage points to the upfront fee percent; one adds plan_change_one_add_pct percentage points; none adds nothing.
      Credit-refresh add-on: the letter age is the calendar days from the pre-qualification letter date on the converted Homesite Reservation to the lock request date; a letter age above stale_prequal_days with a qualifying credit score below stale_score_below adds stale_low_score_add_pct percentage points to the upfront fee percent; a letter age above stale_prequal_days with a qualifying credit score of stale_score_below or higher adds stale_high_score_add_pct percentage points; any other lock adds nothing.
      The add-ons are added to, and the credits taken from, upfront_fee_pct to form the upfront fee percent before it is applied to the loan amount.
    baseline:
      rule: >-
        The upfront fee percent starts at upfront_fee_pct and the buyer's fee share starts at one.
        The upfront lock fee is the greater of the upfront fee percent of the loan amount on the lock, rounded half up to the cent, and upfront_fee_min_usd, and is zero where upfront_fee_pct is zero; that amount is then multiplied by the buyer's fee share and rounded half up to the cent.
      params: [upfront_fee_pct, upfront_fee_min_usd]
    prerequisite:
      - problem: lock_ext_loan_resize
        kind: value_input
        gate: fee_loan
        form: state
        policy_source: >-
          The upfront lock fee is fixed only after the loan amount on the lock is no more than the resized loan limit worked out on the purchase agreement's current contract price.
        condition: >-
          rate_locks.loan_amount is no more than the resized loan limit computed on purchase_agreements.contract_price for the lock's purchase agreement.
        resolved_by: resize_lock_loan_amount_60b17697
        effect: >-
          The terms change lowers the loan amount on the lock to the resized loan limit, so fee_loan (and the fee loan-to-value) take the resized amount.
    cross_category:
      - category: purchase
        as: history
        reads: [contract_price, contract_date, reservation_id, purchase_events.event_type, purchase_events.incentive_type, purchase_events.charge_type]
        note: The builder fee share, early-lock credit, fee loan-to-value, deposit-standing credit and plan-change add-on are decided from the purchase agreement and its ledger.
      - category: homesite
        as: branch
        reads: [prequal_letter_date]
        note: The credit-refresh add-on reads the pre-qualification letter date on the converted reservation.
    compute:
      - fee_loan: "F('loan_amount')"
      - closing_credits: "XCOUNT('purchase', 'purchase_events', event_type='purchase_incentive_granted', incentive_type='closing_cost_credit', purchase_id=F('purchase_id'))"
      - buydown_credits: "XCOUNT('purchase', 'purchase_events', event_type='purchase_incentive_granted', incentive_type='rate_buydown_credit', purchase_id=F('purchase_id'))"
      - lock_lead: "DAYS(CFIELD('purchase', 'contract_date', purchase_id=F('purchase_id')), F('requested_date'))"
      - early_credit: "K('early_lock_credit_pct') if lock_lead <= K('early_lock_days') else (K('prompt_lock_credit_pct') if lock_lead <= K('prompt_lock_days') else 0)"
      - fee_ltv: "fee_loan / CFIELD('purchase', 'contract_price', purchase_id=F('purchase_id')) * 100"
      - ltv_add: "K('fee_ltv_high_add_pct') if fee_ltv > K('fee_ltv_high_above_pct') else (K('fee_ltv_mid_add_pct') if fee_ltv > K('fee_ltv_mid_above_pct') else 0)"
      - returned: "XCOUNT('purchase', 'purchase_events', event_type='purchase_payment_returned', purchase_id=F('purchase_id'))"
      - deposits: "XCOUNT('purchase', 'purchase_events', event_type='purchase_deposit_posted', purchase_id=F('purchase_id'))"
      - standing_credit: "K('standing_full_credit_pct') if (returned == 0 and deposits >= 2) else (K('standing_short_credit_pct') if (returned == 0 and deposits < 2) else 0)"
      - plan_changes: "XCOUNT('purchase', 'purchase_events', event_type='purchase_charge_assessed', charge_type='plan_change_fee', purchase_id=F('purchase_id'))"
      - plan_add: "K('plan_change_two_add_pct') if plan_changes >= 2 else (K('plan_change_one_add_pct') if plan_changes == 1 else 0)"
      - letter_age: "DAYS(CFIELD('homesite', 'prequal_letter_date', reservation_id=CFIELD('purchase', 'reservation_id', purchase_id=F('purchase_id'))), F('requested_date'))"
      - refresh_add: "K('stale_low_score_add_pct') if (letter_age > K('stale_prequal_days') and F('qualifying_credit_score') < K('stale_score_below')) else (K('stale_high_score_add_pct') if (letter_age > K('stale_prequal_days') and F('qualifying_credit_score') >= K('stale_score_below')) else 0)"
      - fee_pct: "P('upfront_fee_pct') - early_credit + ltv_add - standing_credit + plan_add + refresh_add"
      - full_fee: "0 if P('upfront_fee_pct') == 0 else MX(RND(fee_loan * fee_pct / 100 + 0.0000001, 2), P('upfront_fee_min_usd'))"
      - buydown_amount: "XSUM('purchase', 'purchase_events', 'amount', event_type='purchase_incentive_granted', incentive_type='rate_buydown_credit', purchase_id=F('purchase_id'))"
      - fee_share: "1 - MN(buydown_amount / 2 / full_fee, K('both_credits_cap')) if (closing_credits > 0 and buydown_credits > 0) else (1 - MN(buydown_amount / 2 / full_fee, K('one_credit_cap')) if (closing_credits == 0 and buydown_credits > 0) else 1)"
      - result: "RND(full_fee * fee_share + 0.0000001, 2)"
    compute_basis:
      fee_loan: "The upfront lock fee is the greater of the upfront fee percent of the loan amount on the lock, rounded half up to the cent, and upfront_fee_min_usd"
      closing_credits: "where the buyer's purchase ledger carries both a closing_cost_credit and a rate_buydown_credit incentive granted on the agreement"
      buydown_credits: "where the buyer's purchase ledger carries both a closing_cost_credit and a rate_buydown_credit incentive granted on the agreement"
      buydown_amount: "Calloway's part is half the rate_buydown_credit granted on the agreement divided by the floored fee"
      fee_share: "Builder fee share: Calloway's part is half the rate_buydown_credit granted on the agreement divided by the floored fee; where the buyer's purchase ledger carries both a closing_cost_credit and a rate_buydown_credit incentive granted on the agreement, the buyer's fee share is one less Calloway's part, Calloway's part never above both_credits_cap; where it carries a rate_buydown_credit and no closing_cost_credit, the buyer's fee share is one less Calloway's part, Calloway's part never above one_credit_cap; otherwise the buyer's fee share is one."
      lock_lead: "the lock lead is the calendar days from the purchase agreement's contract date to the lock request date"
      early_credit: "a lock lead of early_lock_days or fewer takes early_lock_credit_pct percentage points off the upfront fee percent; a lock lead above early_lock_days up to prompt_lock_days takes prompt_lock_credit_pct percentage points off; a longer lead takes nothing off."
      fee_ltv: "the fee loan-to-value is the loan amount on the lock divided by the purchase agreement's contract price, as a percent"
      ltv_add: "above fee_ltv_high_above_pct it adds fee_ltv_high_add_pct percentage points to the upfront fee percent; above fee_ltv_mid_above_pct up to fee_ltv_high_above_pct it adds fee_ltv_mid_add_pct percentage points; otherwise nothing."
      returned: "where the buyer's purchase ledger carries no returned payment and at least two posted deposits on the agreement, reservation funds transferred to it counted as deposits"
      deposits: "where the buyer's purchase ledger carries no returned payment and at least two posted deposits on the agreement, reservation funds transferred to it counted as deposits"
      standing_credit: "Deposit-standing credit: where the buyer's purchase ledger carries no returned payment and at least two posted deposits on the agreement, reservation funds transferred to it counted as deposits, standing_full_credit_pct percentage points come off the upfront fee percent; where it carries no returned payment and fewer than two posted deposits, standing_short_credit_pct percentage points come off; otherwise nothing comes off."
      plan_changes: "Plan-change add-on: two or more plan_change_fee charges on the agreement add plan_change_two_add_pct percentage points to the upfront fee percent; one adds plan_change_one_add_pct percentage points; none adds nothing."
      plan_add: "Plan-change add-on: two or more plan_change_fee charges on the agreement add plan_change_two_add_pct percentage points to the upfront fee percent; one adds plan_change_one_add_pct percentage points; none adds nothing."
      letter_age: "the letter age is the calendar days from the pre-qualification letter date on the converted Homesite Reservation to the lock request date"
      refresh_add: "a letter age above stale_prequal_days with a qualifying credit score below stale_score_below adds stale_low_score_add_pct percentage points to the upfront fee percent; a letter age above stale_prequal_days with a qualifying credit score of stale_score_below or higher adds stale_high_score_add_pct percentage points; any other lock adds nothing."
      fee_pct: "The add-ons are added to, and the credits taken from, upfront_fee_pct to form the upfront fee percent before it is applied to the loan amount."
      full_fee: "The upfront lock fee is the greater of the upfront fee percent of the loan amount on the lock, rounded half up to the cent, and upfront_fee_min_usd, and is zero where upfront_fee_pct is zero"
      result: "that amount is then multiplied by the buyer's fee share and rounded half up to the cent."
    factors:
      - id: builder_fee_share
        effect: method
        decides: fee_share
        bindings: [closing_credits, buydown_credits, buydown_amount, fee_share]
        ladder:
          - {when: "both a closing_cost_credit and a rate_buydown_credit granted on the agreement", method: "the buyer's share is one less half the rate_buydown_credit divided by the floored fee, that part capped at both_credits_cap"}
          - {when: "a rate_buydown_credit granted and no closing_cost_credit", method: "the buyer's share is one less half the rate_buydown_credit divided by the floored fee, that part capped at one_credit_cap"}
          - {when: "otherwise", method: "the buyer pays the floored fee in full"}
        baseline: {fee_share: "1"}
        evidence: [cross_category, history]
        cross_difficulty: purchase
      - id: early_lock_credit
        effect: parameter
        decides: early_credit
        bindings: [lock_lead, early_credit]
        ladder:
          - {when: "lock lead of early_lock_days or fewer", value: "K('early_lock_credit_pct')"}
          - {when: "lock lead above early_lock_days up to prompt_lock_days", value: "K('prompt_lock_credit_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {early_credit: "0"}
        evidence: [cross_category, date]
        cross_difficulty: purchase
      - id: fee_ltv_add_on
        effect: parameter
        decides: ltv_add
        bindings: [fee_ltv, ltv_add]
        ladder:
          - {when: "fee loan-to-value above fee_ltv_high_above_pct", value: "K('fee_ltv_high_add_pct')"}
          - {when: "fee loan-to-value above fee_ltv_mid_above_pct up to fee_ltv_high_above_pct", value: "K('fee_ltv_mid_add_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {ltv_add: "0"}
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: deposit_standing_credit
        effect: parameter
        decides: standing_credit
        bindings: [returned, deposits, standing_credit]
        ladder:
          - {when: "no returned payment and at least two posted deposits on the agreement", value: "K('standing_full_credit_pct')"}
          - {when: "no returned payment and fewer than two posted deposits", value: "K('standing_short_credit_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {standing_credit: "0"}
        evidence: [cross_category, history]
        cross_difficulty: purchase
      - id: plan_change_add_on
        effect: parameter
        decides: plan_add
        bindings: [plan_changes, plan_add]
        ladder:
          - {when: "two or more plan_change_fee charges on the agreement", value: "K('plan_change_two_add_pct')"}
          - {when: "one plan_change_fee charge", value: "K('plan_change_one_add_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {plan_add: "0"}
        evidence: [cross_category, history]
        cross_difficulty: purchase
      - id: credit_refresh_add_on
        effect: parameter
        decides: refresh_add
        bindings: [letter_age, refresh_add]
        ladder:
          - {when: "letter age above stale_prequal_days and qualifying credit score below stale_score_below", value: "K('stale_low_score_add_pct')"}
          - {when: "letter age above stale_prequal_days and qualifying credit score stale_score_below or higher", value: "K('stale_high_score_add_pct')"}
          - {when: "otherwise", value: "0"}
        baseline: {refresh_add: "0"}
        evidence: [cross_category, date]
        cross_difficulty: homesite
    inputs:
      history:
        - {category: purchase, table: purchase_events, aggregate: count, field: purchase_event_id, filters: {event_type: purchase_incentive_granted}}
        - {category: purchase, table: purchase_events, aggregate: count, field: purchase_event_id, filters: {event_type: purchase_charge_assessed, charge_type: plan_change_fee}}
      cross_category: [purchase, homesite]

  - id: lock_ext_lock_confirmation
    base_policy_refs: [lock_fee_and_pricing]
    overwrite:
      - base_policy: lock_fee_and_pricing
        superseded_clause: >-
          The locked rate is the par rate plus rate_premium_pct, plus jumbo_extra_rate_premium_pct on a jumbo loan, less government_program_premium_discount_pct on fha, va or usda, never below the par rate.
        replaced_by: >-
          The locked rate is the par rate on the lock plus the term premium, plus jumbo_extra_rate_premium_pct on a jumbo loan, less government_program_premium_discount_pct on fha, va or usda, plus or minus each pricing adjustment below, never below the par rate, rounded half up to three decimal places.
    trigger: on_request
    subject: [lock_confirmed]
    computes: locked_rate
    target_tool: confirm_rate_lock_90ad719f
    params:
      grid_ltv_above_pct: 85
      grid_score_break: 720
      grid_low_score_add: 0.25
      grid_high_score_add: 0.125
      buydown_full_share_pct: 1.0
      buydown_full_cut: 0.25
      buydown_part_cut: 0.125
      paid_full_share_pct: 1.0
      paid_full_cut: 0.125
      paid_part_cut: 0.0625
      proration_margin_days: 60
      proration_pad_days: 30
      lag_long_days: 3
      lag_mid_days: 2
      lag_long_add: 0.0625
      lag_mid_add: 0.03125
      large_price_above_usd: 500000
      small_price_below_usd: 300000
      large_price_cut: 0.0625
      small_price_add: 0.125
    rule: >-
      The locked rate is not set until the lock ledger carries the buyer's payment of the upfront lock fee due from the buyer, after the buyer's fee share.
      The term premium starts at rate_premium_pct.
      The locked rate is the par rate on the lock plus the term premium, plus jumbo_extra_rate_premium_pct on a jumbo loan, less government_program_premium_discount_pct on fha, va or usda, plus or minus each pricing adjustment below, never below the par rate, rounded half up to three decimal places.
      The lock date is the confirmation date and the lock expiration date is the lock date plus lock_term_days; where expiry_rolls_to_business_day is true and that day is a Saturday, Sunday or Calloway holiday, the lock runs through the next business day.
      Score and loan-to-value adjustment: the confirmation loan-to-value is the loan amount on the lock divided by the purchase agreement's contract price, as a percent; a confirmation loan-to-value above grid_ltv_above_pct with a qualifying credit score below grid_score_break adds grid_low_score_add points; a confirmation loan-to-value above grid_ltv_above_pct with a qualifying credit score of grid_score_break or higher adds grid_high_score_add points; any other lock adds nothing.
      Buydown adjustment: the buydown share is the rate_buydown_credit incentives granted on the agreement as a percent of the loan amount on the lock; a buydown share of buydown_full_share_pct or more takes buydown_full_cut points off the rate; a buydown share above zero but below buydown_full_share_pct takes buydown_part_cut points off; no buydown takes nothing off.
      Buyer-paid fee adjustment: the paid share is the lock fee payments on the lock ledger as a percent of the loan amount on the lock; a paid share of paid_full_share_pct or more takes paid_full_cut points off the rate; a paid share above zero but below paid_full_share_pct takes paid_part_cut points off; none takes nothing off.
      Term premium proration: the days needed are the calendar days from the lock request date to the purchase agreement's estimated completion date; where the days needed fall short of lock_term_days by more than proration_margin_days, the term premium is rate_premium_pct times the days needed divided by lock_term_days; where they fall short by one day up to proration_margin_days, the term premium is rate_premium_pct times the days needed plus proration_pad_days, divided by lock_term_days, never more than rate_premium_pct; otherwise the term premium is rate_premium_pct.
      Confirmation-lag adjustment: the confirmation lag is the calendar days from the lock request date to the confirmation date; a lag above lag_long_days adds lag_long_add points; a lag of lag_mid_days up to lag_long_days adds lag_mid_add points; a shorter lag adds nothing.
      Price-band adjustment: where the purchase agreement's contract price is above large_price_above_usd, large_price_cut points come off the rate; where it is below small_price_below_usd, small_price_add points are added; otherwise nothing changes.
    baseline:
      rule: >-
        The term premium starts at rate_premium_pct.
        The locked rate is the par rate on the lock plus the term premium, plus jumbo_extra_rate_premium_pct on a jumbo loan, less government_program_premium_discount_pct on fha, va or usda, plus or minus each pricing adjustment below, never below the par rate, rounded half up to three decimal places.
      params: [rate_premium_pct, jumbo_extra_rate_premium_pct, government_program_premium_discount_pct]
    prerequisite:
      - problem: lock_ext_upfront_fee
        kind: value_input
        gate: paid_share
        form: state
        policy_source: >-
          The locked rate is not set until the lock ledger carries the buyer's payment of the upfront lock fee due from the buyer, after the buyer's fee share.
        condition: >-
          lock_events carries lock_fee_paid rows on the lock whose amounts add up to the upfront lock fee due on the lock's current loan amount.
        resolved_by: pay_upfront_lock_fee_77612280
        effect: >-
          The fee payment puts the buyer's paid fee on the ledger, so paid_share moves from zero to the paid fee as a percent of the loan amount and the buyer-paid fee adjustment applies.
    cross_category:
      - category: purchase
        as: history
        reads: [contract_price, estimated_completion_date, purchase_events.amount, purchase_events.incentive_type]
        note: The score and loan-to-value adjustment, buydown adjustment, term premium proration and price-band adjustment read the purchase agreement and its incentive ledger.
    compute:
      - confirm_ltv: "F('loan_amount') / CFIELD('purchase', 'contract_price', purchase_id=F('purchase_id')) * 100"
      - grid_add: "K('grid_low_score_add') if (confirm_ltv > K('grid_ltv_above_pct') and F('qualifying_credit_score') < K('grid_score_break')) else (K('grid_high_score_add') if (confirm_ltv > K('grid_ltv_above_pct') and F('qualifying_credit_score') >= K('grid_score_break')) else 0)"
      - buydown_share: "XSUM('purchase', 'purchase_events', 'amount', event_type='purchase_incentive_granted', incentive_type='rate_buydown_credit', purchase_id=F('purchase_id')) / F('loan_amount') * 100"
      - buydown_cut: "K('buydown_full_cut') if buydown_share >= K('buydown_full_share_pct') else (K('buydown_part_cut') if buydown_share > 0 else 0)"
      - paid_share: "SUM('lock_events', 'amount', event_type='lock_fee_paid') / F('loan_amount') * 100"
      - paid_cut: "K('paid_full_cut') if paid_share >= K('paid_full_share_pct') else (K('paid_part_cut') if paid_share > 0 else 0)"
      - days_needed: "DAYS(F('requested_date'), CFIELD('purchase', 'estimated_completion_date', purchase_id=F('purchase_id')))"
      - term_premium: "P('rate_premium_pct') * days_needed / P('lock_term_days') if days_needed < P('lock_term_days') - K('proration_margin_days') else (MN(P('rate_premium_pct') * (days_needed + K('proration_pad_days')) / P('lock_term_days'), P('rate_premium_pct')) if days_needed < P('lock_term_days') else P('rate_premium_pct'))"
      - lag_days: "DAYS(F('requested_date'), NOW)"
      - lag_add: "K('lag_long_add') if lag_days > K('lag_long_days') else (K('lag_mid_add') if lag_days >= K('lag_mid_days') else 0)"
      - contract_price: "CFIELD('purchase', 'contract_price', purchase_id=F('purchase_id'))"
      - price_adj: "0 - K('large_price_cut') if contract_price > K('large_price_above_usd') else (K('small_price_add') if contract_price < K('small_price_below_usd') else 0)"
      - jumbo_add: "P('jumbo_extra_rate_premium_pct') if F('loan_program') == 'jumbo' else 0"
      - government_cut: "P('government_program_premium_discount_pct') if (F('loan_program') == 'fha' or F('loan_program') == 'va' or F('loan_program') == 'usda') else 0"
      - raw_rate: "F('par_rate') + term_premium + jumbo_add - government_cut + grid_add - buydown_cut - paid_cut + lag_add + price_adj"
      - result: "RND(MX(raw_rate, F('par_rate')) + 0.0000001, 3)"
    compute_basis:
      confirm_ltv: "the confirmation loan-to-value is the loan amount on the lock divided by the purchase agreement's contract price, as a percent"
      grid_add: "a confirmation loan-to-value above grid_ltv_above_pct with a qualifying credit score below grid_score_break adds grid_low_score_add points; a confirmation loan-to-value above grid_ltv_above_pct with a qualifying credit score of grid_score_break or higher adds grid_high_score_add points; any other lock adds nothing."
      buydown_share: "the buydown share is the rate_buydown_credit incentives granted on the agreement as a percent of the loan amount on the lock"
      buydown_cut: "a buydown share of buydown_full_share_pct or more takes buydown_full_cut points off the rate; a buydown share above zero but below buydown_full_share_pct takes buydown_part_cut points off; no buydown takes nothing off."
      paid_share: "the paid share is the lock fee payments on the lock ledger as a percent of the loan amount on the lock"
      paid_cut: "a paid share of paid_full_share_pct or more takes paid_full_cut points off the rate; a paid share above zero but below paid_full_share_pct takes paid_part_cut points off; none takes nothing off."
      days_needed: "the days needed are the calendar days from the lock request date to the purchase agreement's estimated completion date"
      term_premium: "where the days needed fall short of lock_term_days by more than proration_margin_days, the term premium is rate_premium_pct times the days needed divided by lock_term_days; where they fall short by one day up to proration_margin_days, the term premium is rate_premium_pct times the days needed plus proration_pad_days, divided by lock_term_days, never more than rate_premium_pct; otherwise the term premium is rate_premium_pct."
      lag_days: "the confirmation lag is the calendar days from the lock request date to the confirmation date"
      lag_add: "a lag above lag_long_days adds lag_long_add points; a lag of lag_mid_days up to lag_long_days adds lag_mid_add points; a shorter lag adds nothing."
      contract_price: "Price-band adjustment: where the purchase agreement's contract price is above large_price_above_usd, large_price_cut points come off the rate; where it is below small_price_below_usd, small_price_add points are added; otherwise nothing changes."
      price_adj: "Price-band adjustment: where the purchase agreement's contract price is above large_price_above_usd, large_price_cut points come off the rate; where it is below small_price_below_usd, small_price_add points are added; otherwise nothing changes."
      jumbo_add: "plus jumbo_extra_rate_premium_pct on a jumbo loan"
      government_cut: "less government_program_premium_discount_pct on fha, va or usda"
      raw_rate: "The locked rate is the par rate on the lock plus the term premium, plus jumbo_extra_rate_premium_pct on a jumbo loan, less government_program_premium_discount_pct on fha, va or usda, plus or minus each pricing adjustment below"
      result: "never below the par rate, rounded half up to three decimal places."
    factors:
      - id: score_ltv_rate_adjustment
        effect: parameter
        decides: grid_add
        bindings: [confirm_ltv, grid_add]
        ladder:
          - {when: "confirmation loan-to-value above grid_ltv_above_pct and qualifying credit score below grid_score_break", value: "K('grid_low_score_add')"}
          - {when: "confirmation loan-to-value above grid_ltv_above_pct and qualifying credit score grid_score_break or higher", value: "K('grid_high_score_add')"}
          - {when: "otherwise", value: "0"}
        baseline: {grid_add: "0"}
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: buydown_rate_adjustment
        effect: parameter
        decides: buydown_cut
        bindings: [buydown_share, buydown_cut]
        ladder:
          - {when: "buydown share buydown_full_share_pct or more", value: "K('buydown_full_cut')"}
          - {when: "buydown share above zero but below buydown_full_share_pct", value: "K('buydown_part_cut')"}
          - {when: "otherwise", value: "0"}
        baseline: {buydown_cut: "0"}
        evidence: [cross_category, history]
        cross_difficulty: purchase
      - id: buyer_paid_fee_rate_adjustment
        effect: parameter
        decides: paid_cut
        bindings: [paid_share, paid_cut]
        ladder:
          - {when: "paid share paid_full_share_pct or more", value: "K('paid_full_cut')"}
          - {when: "paid share above zero but below paid_full_share_pct", value: "K('paid_part_cut')"}
          - {when: "otherwise", value: "0"}
        baseline: {paid_cut: "0"}
        evidence: [history]
        cross_difficulty: null
      - id: term_premium_proration
        effect: method
        decides: term_premium
        bindings: [days_needed, term_premium]
        ladder:
          - {when: "days needed short of lock_term_days by more than proration_margin_days", method: "rate_premium_pct times days needed divided by lock_term_days"}
          - {when: "days needed short of lock_term_days by one day up to proration_margin_days", method: "rate_premium_pct times (days needed plus proration_pad_days) divided by lock_term_days, capped at rate_premium_pct"}
          - {when: "otherwise", method: "the full rate_premium_pct"}
        baseline: {term_premium: "P('rate_premium_pct')"}
        evidence: [cross_category, date]
        cross_difficulty: purchase
      - id: confirmation_lag_adjustment
        effect: parameter
        decides: lag_add
        bindings: [lag_days, lag_add]
        ladder:
          - {when: "confirmation lag above lag_long_days", value: "K('lag_long_add')"}
          - {when: "confirmation lag of lag_mid_days up to lag_long_days", value: "K('lag_mid_add')"}
          - {when: "otherwise", value: "0"}
        baseline: {lag_add: "0"}
        evidence: [date]
        cross_difficulty: null
      - id: price_band_adjustment
        effect: parameter
        decides: price_adj
        bindings: [contract_price, price_adj]
        ladder:
          - {when: "contract price above large_price_above_usd", value: "0 - K('large_price_cut')"}
          - {when: "contract price below small_price_below_usd", value: "K('small_price_add')"}
          - {when: "otherwise", value: "0"}
        baseline: {price_adj: "0"}
        evidence: [cross_category]
        cross_difficulty: purchase
    inputs:
      history:
        - {table: lock_events, aggregate: sum, field: amount, filters: {event_type: lock_fee_paid}}
        - {category: purchase, table: purchase_events, aggregate: sum, field: amount, filters: {event_type: purchase_incentive_granted, incentive_type: rate_buydown_credit}}
      cross_category: [purchase]
