events:
  - type: warranty_coverage_enrolled
    target: warranty_coverages
    mutation: create
    meaning: A homeowner is enrolled in the home's HomeCare program, the original buyer at closing or a subsequent owner on registration.
    grain: One row per owner per home.
    fields:
      customer_id: The homeowner.
      purchase_id: Purchase agreement under which Calloway built and sold the home.
      variant_name: HomeCare program of the home.
      status: Always active on creation.
      owner_type: Original buyer or subsequent owner.
      prior_coverage_id: The previous owner's coverage, empty for the original buyer.
      ownership_start_date: Closing date for the original buyer, deed date for a subsequent owner.
      coverage_start_date: Original closing date of the home; identical for every owner of the home.
      workmanship_end_date: Coverage start date plus workmanship_months, less one day.
      systems_end_date: Coverage start date plus systems_months, less one day.
      structural_end_date: Coverage start date plus structural_months, less one day.
      roof_leak_end_date: Coverage start date plus roof_leak_months, less one day.
      charges_due: 0.00 on creation.
      payouts_owed: 0.00 on creation.
    triggers:
      - event: warranty:warranty_transferred
        when: {owner_type: subsequent_owner}
        map: {end_date: ownership_start_date}
      - event: warranty:warranty_charge_assessed
        when: {owner_type: subsequent_owner}
        map: {charge_type: transfer_fee}
  - type: warranty_claim_filed
    target: warranty_events
    meaning: The homeowner reports one warranty item.
    grain: One row per claim item reported.
    distinguish_by: [claim_item_ref]
    fields:
      claim_item_ref: Item number of the service request, e.g. WSR-20417-03 (request number plus item).
      defect_category: Category of the reported condition.
      report_channel: How the item was reported.
      emergency_type: Emergency condition reported, or none.
      event_date: Date the report was received.
    triggers: []
  - type: warranty_emergency_dispatched
    target: warranty_events
    meaning: A technician is dispatched to an emergency item.
    grain: One row per dispatch.
    distinguish_by: [claim_item_ref, event_date]
    fields:
      claim_item_ref: Claim item dispatched to.
      response_hours: Hours from report to technician arrival.
      event_date: Date of the dispatch.
    triggers: []
  - type: warranty_claim_inspected
    target: warranty_events
    meaning: A Calloway warranty representative or engineer inspects a claim item.
    grain: One row per inspection of an item.
    distinguish_by: [claim_item_ref, inspection_type, event_date]
    fields:
      claim_item_ref: Claim item inspected.
      inspection_type: Who inspected.
      inspection_finding: What the inspection found.
      measured_width_in: Measured crack width or displacement in inches, for crack items.
      event_date: Inspection date.
    triggers: []
  - type: warranty_claim_approved
    target: warranty_events
    meaning: A claim item is approved for repair under a coverage basis.
    grain: One row per item decision.
    distinguish_by: [claim_item_ref, callback_seq]
    fields:
      claim_item_ref: Claim item approved.
      coverage_basis: Coverage period the approval rests on.
      callback_seq: 0 for the original decision, 1 and up for a reopened callback.
      event_date: Decision date.
    triggers: []
  - type: warranty_claim_denied
    target: warranty_events
    meaning: A claim item is denied.
    grain: One row per item decision.
    distinguish_by: [claim_item_ref, callback_seq]
    fields:
      claim_item_ref: Claim item denied.
      denial_reason: Why it was denied.
      callback_seq: 0 for the original decision, 1 and up for a reopened callback.
      event_date: Decision date.
    triggers: []
  - type: warranty_appointment_scheduled
    target: warranty_events
    meaning: A repair or inspection appointment is booked with the homeowner.
    grain: One row per appointment booked.
    distinguish_by: [claim_item_ref, appointment_date]
    fields:
      claim_item_ref: Claim item the appointment is for.
      appointment_date: Date of the appointment.
      event_date: Date it was booked.
    triggers: []
  - type: warranty_appointment_missed
    target: warranty_events
    meaning: The homeowner did not provide access at a booked appointment.
    grain: One row per missed appointment.
    distinguish_by: [claim_item_ref, appointment_date]
    fields:
      claim_item_ref: Claim item of the appointment.
      appointment_date: Date of the missed appointment.
      event_date: Date recorded.
    triggers: []
  - type: warranty_repair_completed
    target: warranty_events
    meaning: An approved repair is completed and signed off by the homeowner.
    grain: One row per completion of an item.
    distinguish_by: [claim_item_ref, callback_seq]
    fields:
      claim_item_ref: Claim item repaired.
      callback_seq: 0 for the original repair, 1 and up for a callback repair.
      event_date: Completion date.
    triggers: []
  - type: warranty_callback_filed
    target: warranty_events
    meaning: A repaired item recurs and the homeowner reports it again on the original claim.
    grain: One row per callback.
    distinguish_by: [claim_item_ref, callback_seq]
    fields:
      claim_item_ref: Original claim item number.
      callback_seq: 1 for the first callback, then 2 and up.
      event_date: Date the recurrence was reported.
    triggers: []
  - type: warranty_walkthrough_completed
    target: warranty_events
    meaning: A scheduled walkthrough or included check visit is held at the home.
    grain: One row per walkthrough.
    distinguish_by: [walkthrough_type]
    fields:
      walkthrough_type: Which walkthrough.
      event_date: Date held.
    triggers: []
  - type: warranty_charge_assessed
    target: warranty_events
    meaning: A homeowner charge is assessed on the coverage.
    grain: One row per charge.
    distinguish_by: [charge_type, charge_reference]
    fields:
      amount: Amount charged, positive (0.00 for a no-fee transfer).
      charge_type: Kind of charge.
      charge_reference: Charge number printed on the homeowner invoice, e.g. WCH-5512.
      claim_item_ref: Claim item the charge relates to, empty for a transfer fee.
      event_date: Date assessed.
    account: homeowner_charges
    direction: in
    triggers: []
  - type: warranty_charge_paid
    target: warranty_events
    meaning: The homeowner pays a warranty charge.
    grain: One row per charge paid.
    distinguish_by: [source_charge_ref, payment_reference]
    fields:
      amount: Amount paid, positive.
      source_charge_ref: Charge number paid.
      payment_method: How it was paid.
      payment_reference: Receipt number of the payment.
      event_date: Date paid.
    account: homeowner_charges
    direction: out
    triggers: []
  - type: warranty_charge_waived
    target: warranty_events
    meaning: A warranty charge is waived.
    grain: One row per charge waived.
    distinguish_by: [source_charge_ref]
    fields:
      amount: Amount waived, positive.
      source_charge_ref: Charge number waived.
      waiver_reason: Why it was waived.
      event_date: Date waived.
    account: homeowner_charges
    direction: out
    triggers: []
  - type: warranty_payout_approved
    target: warranty_events
    meaning: Calloway approves a payment to the homeowner on a claim item.
    grain: One row per payout per claim item.
    distinguish_by: [payout_reference]
    fields:
      amount: Amount approved, positive.
      payout_type: Kind of payout.
      payout_reference: Payout number, e.g. WPO-1187.
      claim_item_ref: Claim item the payout settles.
      nights: Nights reimbursed, for relocation.
      event_date: Approval date.
    account: homeowner_payouts
    direction: in
    triggers: []
  - type: warranty_payout_issued
    target: warranty_events
    meaning: An approved payout is paid to the homeowner.
    grain: One row per payout paid.
    distinguish_by: [source_payout_ref]
    fields:
      amount: Amount paid, positive.
      source_payout_ref: Payout number paid.
      event_date: Date paid.
    account: homeowner_payouts
    direction: out
    triggers: []
  - type: warranty_transferred
    target: warranty_coverages
    mutation: {transition: {from: active, to: transferred}}
    meaning: The previous owner's coverage ends because a subsequent owner registered.
    grain: One row per transaction.
    fields:
      status: Becomes transferred.
      end_date: The subsequent owner's deed date.
    triggers: []
  - type: warranty_expired
    target: warranty_coverages
    mutation: {transition: {from: active, to: expired}}
    meaning: Every coverage period has ended.
    grain: One row per transaction.
    fields:
      status: Becomes expired.
      end_date: The day after the structural end date.
    triggers: []

measures:
  - id: warranty_msr_missed_appointments
    window: Life of the home's coverage across every owner (all coverages sharing the purchase_id), up to the frozen date.
    measure: Count of warranty_appointment_missed rows.
  - id: warranty_msr_one_time_repairs
    window: Life of the home's coverage across every owner.
    measure: Count of approved claim items with coverage_basis workmanship and defect_category drywall (nail pops) or tile (caulk and grout) that were approved as one-time repairs.
  - id: warranty_msr_reimbursed_nights
    window: Per claim item, life of the item.
    measure: Sum of nights on warranty_payout_approved rows with payout_type relocation_reimbursement for the claim item.

policies:
  - id: warranty_agg_multi_holding
    subject: [warranty_coverage_enrolled]
    rule: >-
      A homeowner may hold coverage on any number of Calloway homes they own; there is no cap per
      customer (max_per_customer null). Coverage always belongs to one home, identified by the
      purchase agreement under which Calloway sold it.
    eligibility: []
    params:
      max_per_customer: null

  - id: warranty_agg_one_owner_per_home
    subject: [warranty_coverage_enrolled, warranty_transferred]
    rule: >-
      A home carries exactly one active coverage at a time. A coverage is enrolled only for a home that has no other active coverage, except a subsequent-owner enrollment, which ends the previous owner's active coverage on the subsequent owner's deed date.
      Every owner of the home shares the same coverage start date and coverage end dates, and history
      that counts over the life of the coverage (missed appointments, one-time repairs) counts across
      owners of the same home.
    eligibility:
      - id: one_active_per_home
        applies_to: [warranty_coverage_enrolled]
        kind: dedup
        condition: "A coverage is enrolled only for a home that has no other active coverage, except a subsequent-owner enrollment, which ends the previous owner's active coverage on the subsequent owner's deed date."
        evidence_fields: [warranty_coverages.purchase_id, warranty_coverages.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_coverages.purchase_id]
          action_bindings:
            warranty_coverages.purchase_id: purchase_id
        dedup_contract:
          table: warranty_coverages
          mode: same_record
          object_bindings: {purchase_id: purchase_id}
          duplicate_filters: {status: [active]}
          distinct_fields: [owner_type]
    measures: [warranty_msr_missed_appointments, warranty_msr_one_time_repairs]

  - id: warranty_enrollment
    subject: [warranty_coverage_enrolled]
    rule: >-
      At closing the original buyer is enrolled in the program whose eligible_collection is the closed
      purchase agreement's collection. The coverage start date is the closing date. Each period end
      date is the coverage start date plus the period's months, less one day: the same day of the month
      in the ending month, minus one; when that day does not exist in the ending month the period ends on
      the last day of that month. Item periods counted in days end on the coverage start date plus the
      days.
    eligibility: []
    params:
      per_tier:
        HomeCare 1-2-10 Standard: {workmanship: "=workmanship_months", systems: "=systems_months", structural: "=structural_months", roof_leak: "=roof_leak_months"}
        HomeCare 1-2-10 Select: {workmanship: "=workmanship_months", systems: "=systems_months", structural: "=structural_months", roof_leak: "=roof_leak_months"}
        HomeCare 1-3-10 Plus: {workmanship: "=workmanship_months", systems: "=systems_months", structural: "=structural_months", roof_leak: "=roof_leak_months"}
        HomeCare 2-3-10 Preferred: {workmanship: "=workmanship_months", systems: "=systems_months", structural: "=structural_months", roof_leak: "=roof_leak_months"}
        HomeCare 2-5-10 Premier: {workmanship: "=workmanship_months", systems: "=systems_months", structural: "=structural_months", roof_leak: "=roof_leak_months"}
        HomeCare 2-5-15 Reserve: {workmanship: "=workmanship_months", systems: "=systems_months", structural: "=structural_months", roof_leak: "=roof_leak_months"}

  - id: warranty_coverage_periods
    subject: [warranty_claim_approved, warranty_claim_denied, warranty_claim_filed]
    rule: >-
      Each claim item is decided against the coverage period of its defect category, mapped by
      category_basis. A workmanship item is covered only when it is reported no later than late_report_grace_days calendar days after the workmanship end date.
      A systems item is covered only when it is reported no later than late_report_grace_days calendar days after the systems end date.
      A structural item is covered only when it is reported no later than late_report_grace_days calendar days after the structural end date.
      A roof leak item is covered only when it is reported no later than late_report_grace_days calendar days after the roof leak end date.
      A window seal item is covered only when it is reported within window_seal_failure_months calendar months after the coverage start date.
      A landscaping item is covered only when it is reported within landscaping_coverage_days calendar days after the coverage start date.
      Grading and drainage, appliance and termite items are covered when reported within
      grading_drainage_months, appliance_builder_coverage_months and termite_pretreat_months calendar
      months after the coverage start date respectively; an appliance item after its period, or in a
      program whose appliance_builder_coverage_months is zero, is denied with reason
      manufacturer_warranty and referred to the manufacturer. Calendar months are counted to the same
      day of the month, falling back to the last day of a shorter month, and the reporting date equal
      to the last covered day is covered. The grace days count from the day after the end date and the
      last grace day is included; the grace applies only to the four dated periods. Item periods counted in days start the day after the coverage start date and the last counted day is included. An item reported
      after its period and grace is denied with reason outside_coverage_period. The reporting date is
      the date the written report was received (the phone date for an emergency); where
      written_report_required is true a non-emergency phone report is recorded only once the homeowner
      submits it in writing, and the written date counts.
    eligibility:
      - id: workmanship_period
        applies_to: [warranty_claim_approved]
        kind: time
        condition: "A workmanship item is covered only when it is reported no later than late_report_grace_days calendar days after the workmanship end date."
        evidence_fields: [warranty_coverages.workmanship_end_date, warranty_events.event_date, warranty_events.claim_item_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_events.claim_item_ref]
          action_bindings:
            warranty_events.claim_item_ref: claim_item_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the workmanship end date
          anchor_source: warranty_coverages.workmanship_end_date
          relation: not_after
          duration_source: variants.late_report_grace_days
          unit: calendar_days
          counting_rule: The grace days count from the day after the end date and the last grace day is included
          boundary: inclusive
      - id: systems_period
        applies_to: [warranty_claim_approved]
        kind: time
        condition: "A systems item is covered only when it is reported no later than late_report_grace_days calendar days after the systems end date."
        evidence_fields: [warranty_coverages.systems_end_date, warranty_events.event_date, warranty_events.claim_item_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_events.claim_item_ref]
          action_bindings:
            warranty_events.claim_item_ref: claim_item_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the systems end date
          anchor_source: warranty_coverages.systems_end_date
          relation: not_after
          duration_source: variants.late_report_grace_days
          unit: calendar_days
          counting_rule: The grace days count from the day after the end date and the last grace day is included
          boundary: inclusive
      - id: structural_period
        applies_to: [warranty_claim_approved]
        kind: time
        condition: "A structural item is covered only when it is reported no later than late_report_grace_days calendar days after the structural end date."
        evidence_fields: [warranty_coverages.structural_end_date, warranty_events.event_date, warranty_events.claim_item_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_events.claim_item_ref]
          action_bindings:
            warranty_events.claim_item_ref: claim_item_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the structural end date
          anchor_source: warranty_coverages.structural_end_date
          relation: not_after
          duration_source: variants.late_report_grace_days
          unit: calendar_days
          counting_rule: The grace days count from the day after the end date and the last grace day is included
          boundary: inclusive
      - id: roof_leak_period
        applies_to: [warranty_claim_approved]
        kind: time
        condition: "A roof leak item is covered only when it is reported no later than late_report_grace_days calendar days after the roof leak end date."
        evidence_fields: [warranty_coverages.roof_leak_end_date, warranty_events.event_date, warranty_events.claim_item_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_events.claim_item_ref]
          action_bindings:
            warranty_events.claim_item_ref: claim_item_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the roof leak end date
          anchor_source: warranty_coverages.roof_leak_end_date
          relation: not_after
          duration_source: variants.late_report_grace_days
          unit: calendar_days
          counting_rule: The grace days count from the day after the end date and the last grace day is included
          boundary: inclusive
      - id: window_seal_period
        applies_to: [warranty_claim_approved]
        kind: time
        condition: "A window seal item is covered only when it is reported within window_seal_failure_months calendar months after the coverage start date."
        evidence_fields: [warranty_coverages.coverage_start_date, warranty_events.event_date, warranty_events.claim_item_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_events.claim_item_ref]
          action_bindings:
            warranty_events.claim_item_ref: claim_item_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the coverage start date
          anchor_source: warranty_coverages.coverage_start_date
          relation: not_after
          duration_source: variants.window_seal_failure_months
          unit: calendar_months
          counting_rule: Calendar months are counted to the same day of the month, falling back to the last day of a shorter month, and the reporting date equal to the last covered day is covered
          boundary: exclusive
      - id: landscaping_period
        applies_to: [warranty_claim_approved]
        kind: time
        condition: "A landscaping item is covered only when it is reported within landscaping_coverage_days calendar days after the coverage start date."
        evidence_fields: [warranty_coverages.coverage_start_date, warranty_events.event_date, warranty_events.claim_item_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_events.claim_item_ref]
          action_bindings:
            warranty_events.claim_item_ref: claim_item_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the coverage start date
          anchor_source: warranty_coverages.coverage_start_date
          relation: not_after
          duration_source: variants.landscaping_coverage_days
          unit: calendar_days
          counting_rule: Item periods counted in days start the day after the coverage start date and the last counted day is included
          boundary: inclusive
    params:
      category_basis: {drywall: workmanship, paint: workmanship, trim_carpentry: workmanship, doors_hardware: workmanship, cabinets_countertops: workmanship, flooring: workmanship, tile: workmanship, concrete_flatwork: workmanship, exterior_siding: workmanship, masonry_veneer: workmanship, plumbing: systems, electrical: systems, hvac: systems, foundation_slab: structural, load_bearing_framing: structural, roofing: roof_leak, window_seal: window_seal, landscaping: landscaping, grading_drainage: grading_drainage, appliances: appliance, termite: termite}

  - id: warranty_tolerances_and_exclusions
    subject: [warranty_claim_denied, warranty_claim_inspected, warranty_charge_assessed]
    rule: >-
      An inspected crack is within tolerance, and the item is denied with reason within_tolerance, when
      its measured width is below concrete_crack_width_tolerance_in for flatwork (and its displacement
      below concrete_displacement_tolerance_in), slab_crack_width_tolerance_in for the foundation slab,
      masonry_crack_tolerance_in for veneer and drywall_crack_tolerance_in for drywall; a measurement
      equal to the tolerance is out of tolerance and covered. Drywall nail pops and caulk or grout
      separation are repaired once each, up to drywall_nail_pop_repairs and caulk_grout_touchup_repairs
      visits over the life of the home's coverage (warranty_msr_one_time_repairs), and are denied with
      reason one_time_repair_used after that. A cosmetic surface item (chips, scratches, stains on
      finished surfaces) is covered only when it is on the orientation list, or reported within
      cosmetic_report_window_days calendar days after the coverage start date; otherwise it is denied
      with reason cosmetic_not_noted. Conditions caused by homeowner maintenance, homeowner alterations
      or third parties are denied with reason homeowner_maintenance or homeowner_alteration. An item
      already denied within_tolerance that is re-reported and again measured within tolerance carries
      reinspection_fee_usd.
    eligibility: []
    measures: [warranty_msr_one_time_repairs]

  - id: warranty_service_levels
    subject: [warranty_emergency_dispatched, warranty_claim_inspected, warranty_appointment_scheduled, warranty_repair_completed, warranty_claim_denied, warranty_claim_filed]
    rule: >-
      An item is an emergency only when its condition is listed in the program's emergency_categories;
      an emergency may be reported by phone at any hour and a technician is dispatched within
      emergency_response_hours. A non-emergency item must be reported in writing where
      written_report_required is true and is inspected within inspection_scheduling_business_days
      business days. An approved repair is completed within repair_target_days calendar days of approval.
      When Calloway asks to schedule an inspection or repair, the homeowner has access_response_days
      calendar days to provide access; an item with no access offered in that time is closed and denied
      with reason no_access, and may be reported again only as a new item.
    eligibility: []

  - id: warranty_appointment_charges
    subject: [warranty_appointment_missed, warranty_charge_assessed, warranty_charge_waived]
    rule: >-
      Each missed appointment beyond free_missed_appointments over the life of the home's coverage
      (warranty_msr_missed_appointments, counted including the one being recorded) carries
      missed_appointment_fee_usd, linked to the claim item. An emergency dispatch that finds a condition
      caused by the homeowner or not covered carries emergency_dispatch_fee_usd. A charge is waived only
      when the missed appointment followed a reschedule by Calloway on less than one business day's
      notice, recorded with waiver reason calloway_rescheduled. A charge is waived at most once and a charge already paid is not waived.
    eligibility:
      - id: one_waiver_per_charge
        applies_to: [warranty_charge_waived]
        kind: dedup
        condition: "A charge is waived at most once and a charge already paid is not waived."
        evidence_fields: [warranty_events.source_charge_ref, warranty_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_events.source_charge_ref]
          action_bindings:
            warranty_events.source_charge_ref: source_charge_ref
        dedup_contract:
          table: warranty_events
          mode: separate_record
          object_bindings: {source_charge_ref: source_charge_ref}
          duplicate_filters: {event_type: [warranty_charge_waived, warranty_charge_paid]}
          distinct_fields: []
    params:
      per_tier:
        HomeCare 1-2-10 Standard: {free_missed: "=free_missed_appointments", fee: "=missed_appointment_fee_usd"}
        HomeCare 1-2-10 Select: {free_missed: "=free_missed_appointments", fee: "=missed_appointment_fee_usd"}
        HomeCare 1-3-10 Plus: {free_missed: "=free_missed_appointments", fee: "=missed_appointment_fee_usd"}
        HomeCare 2-3-10 Preferred: {free_missed: "=free_missed_appointments", fee: "=missed_appointment_fee_usd"}
        HomeCare 2-5-10 Premier: {free_missed: "=free_missed_appointments", fee: "=missed_appointment_fee_usd"}
        HomeCare 2-5-15 Reserve: {free_missed: "=free_missed_appointments", fee: "=missed_appointment_fee_usd"}
    measures: [warranty_msr_missed_appointments]

  - id: warranty_structural_claims
    subject: [warranty_claim_approved, warranty_charge_assessed, warranty_claim_inspected, warranty_payout_approved]
    rule: >-
      Each approved structural item carries structural_deductible_usd, assessed on approval and linked to
      the claim item. A structural finding the homeowner disputes is reviewed by an independent
      structural engineer at Calloway's cost where structural_engineer_review_included is true; the
      engineer's finding replaces the field finding. While a covered structural or systems repair makes
      the home uninhabitable, Calloway reimburses relocation at hotel_reimbursement_per_night_usd per
      night for at most max_reimbursement_nights nights per claim item
      (warranty_msr_reimbursed_nights), and never more than reimbursement_cap_usd per claim item.
    eligibility: []
    formula:
      relocation_payout: min(nights * hotel_reimbursement_per_night_usd, reimbursement_cap_usd)
    measures: [warranty_msr_reimbursed_nights]

  - id: warranty_walkthroughs
    subject: [warranty_walkthrough_completed]
    rule: >-
      A sixty-day walkthrough is held where sixty_day_walkthrough_included is true, no earlier than
      sixty_day_window_opens_days after the coverage start date. The eleven-month walkthrough is held where eleven_month_walkthrough_included is true and only when at least eleven_month_window_opens_days calendar days have passed since the coverage start date.
      Counting starts the day after the coverage start date and the last counted day qualifies. It must
      also be held on or before the workmanship end date of a twelve-month workmanship program; items
      noted at it are filed as claim items on that date. The twenty-three-month walkthrough is held
      where twenty_three_month_walkthrough_included is true, no earlier than
      twenty_three_month_window_opens_days after the coverage start date. A first-year HVAC seasonal
      check is held once where hvac_seasonal_check_included is true. Each walkthrough type is held once
      per home.
    eligibility:
      - id: eleven_month_window
        applies_to: [warranty_walkthrough_completed]
        kind: time
        condition: "The eleven-month walkthrough is held where eleven_month_walkthrough_included is true and only when at least eleven_month_window_opens_days calendar days have passed since the coverage start date."
        evidence_fields: [warranty_coverages.coverage_start_date, warranty_coverages.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_coverages.coverage_id]
          action_bindings:
            warranty_coverages.coverage_id: coverage_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the coverage start date
          anchor_source: warranty_coverages.coverage_start_date
          relation: not_before
          duration_source: variants.eleven_month_window_opens_days
          unit: calendar_days
          counting_rule: Counting starts the day after the coverage start date and the last counted day qualifies
          boundary: inclusive

  - id: warranty_callbacks
    subject: [warranty_callback_filed, warranty_claim_approved, warranty_repair_completed]
    rule: >-
      When a repaired item recurs, the homeowner reports it as a callback on the original claim item. A callback is accepted on the original claim only when it is reported within callback_days calendar days after the repair was completed.
      Counting starts the day after the completion date and the last counted day is included. An
      accepted callback is approved under the original coverage basis even when that coverage period
      has since ended, carries no deductible or fee, and is numbered by callback_seq. A recurrence
      reported later is a new claim item decided under warranty_coverage_periods.
    eligibility:
      - id: callback_window
        applies_to: [warranty_callback_filed]
        kind: time
        condition: "A callback is accepted on the original claim only when it is reported within callback_days calendar days after the repair was completed."
        evidence_fields: [warranty_events.event_date, warranty_events.claim_item_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_events.claim_item_ref]
          action_bindings:
            warranty_events.claim_item_ref: claim_item_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the repair was completed
          anchor_source: warranty_events.event_date
          relation: not_after
          duration_source: variants.callback_days
          unit: calendar_days
          counting_rule: Counting starts the day after the completion date and the last counted day is included
          boundary: inclusive

  - id: warranty_transfer
    subject: [warranty_coverage_enrolled, warranty_transferred, warranty_charge_assessed]
    rule: >-
      Where transfer_allowed is true, a subsequent owner of the home may register for the remaining
      coverage. A subsequent owner is enrolled only when the registration is received within transfer_registration_days calendar days after the subsequent owner's deed date.
      Counting starts the day after the deed date and the last counted day is included. The subsequent
      owner keeps the home's program and every original end date, because transfer_resets_coverage is
      false; the transfer fee transfer_fee_usd is assessed on the new coverage and the previous owner's
      coverage moves to transferred on the deed date. A subsequent owner who registers late is not
      enrolled, and items they report are denied with reason not_registered.
    eligibility:
      - id: registration_window
        applies_to: [warranty_coverage_enrolled]
        kind: time
        condition: "A subsequent owner is enrolled only when the registration is received within transfer_registration_days calendar days after the subsequent owner's deed date."
        evidence_fields: [warranty_coverages.ownership_start_date, warranty_coverages.purchase_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [warranty_coverages.purchase_id]
          action_bindings:
            warranty_coverages.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the subsequent owner's deed date
          anchor_source: warranty_coverages.ownership_start_date
          relation: not_after
          duration_source: variants.transfer_registration_days
          unit: calendar_days
          counting_rule: Counting starts the day after the deed date and the last counted day is included
          boundary: inclusive

  - id: warranty_payouts_and_payments
    subject: [warranty_payout_approved, warranty_payout_issued, warranty_charge_paid]
    rule: >-
      In place of repairing a covered non-structural item, Calloway may offer a cash settlement of no
      more than cash_in_lieu_max_usd per claim item; it becomes a payout only when the homeowner accepts
      it in writing, and the item is then closed without repair. Approved payouts are issued within
      payout_issue_business_days business days, one issue row per payout number. Charges are paid by card or ach, each payment
      naming the charge number it pays; an open charge does not stop Calloway from handling claims.
    eligibility: []

  - id: warranty_expiry
    subject: [warranty_expired]
    rule: >-
      A coverage expires the day after its structural end date; callbacks accepted before then continue
      to be handled. A transferred coverage never expires separately, because the subsequent owner's
      coverage carries the same dates.
    eligibility: []

# ============================================================================
# extended_policies — warranty_claims_service (claimed task by task; see tasks/N.json)
# ============================================================================
extended_policies:
  - id: warranty_ext_missed_appointment_charge
    base_policy_refs: [warranty_tolerances_and_exclusions, warranty_appointment_charges, warranty_structural_claims, warranty_transfer, warranty_agg_one_owner_per_home, warranty_callbacks]
    overwrite:
      - base_policy: warranty_agg_one_owner_per_home
        superseded_clause: >-
          Every owner of the home shares the same coverage start date and coverage end dates, and history
          that counts over the life of the coverage (missed appointments, one-time repairs) counts across
          owners of the same home.
        replaced_by: >-
          For the missed-appointment charge only the missed appointments recorded on the homeowner's own coverage
          are counted, never those recorded on a previous owner's coverage of the same home, while every owner
          of the home still shares the coverage start and end dates and one-time repairs still count across
          owners.
      - base_policy: warranty_appointment_charges
        superseded_clause: >-
          Each missed appointment beyond free_missed_appointments over the life of the home's coverage
          (warranty_msr_missed_appointments, counted including the one being recorded) carries
          missed_appointment_fee_usd, linked to the claim item.
        replaced_by: >-
          The missed-appointment charge is the program's missed-appointment fee multiplied by the notice
          multiplier, the trade trip multiplier and the repeat-miss multiplier, each multiplier applied to that
          same fee, and the product is rounded to the nearest cent only once, at the end.
    trigger: state_due
    subject: [warranty_charge_assessed]
    computes: amount
    target_tool: assess_missed_appointment_charge_27486c7f
    params:
      short_notice_days: 2
      standard_notice_days: 7
      short_notice_mult: 0.5
      mid_notice_mult: 0.75
      systems_trade_mult: 1.5
      finish_trade_mult: 1.25
      third_billable_mult: 1.5
      second_billable_mult: 1.25
      aging_window_months: 24
      repeat_window_months: 12
    rule: >-
      A missed-appointment charge is worked out for the most recent missed appointment recorded on the
      coverage, on the day it is assessed, and it is linked to that appointment's claim item.
      A missed appointment that fell while its claim item had an accepted callback awaiting repair (the
      item's latest callback is dated on or before the missed appointment date, and the item's latest
      repair is either dated on or before that callback or dated on or after the missed appointment date)
      carries no charge, because an
      accepted callback carries no fee; such a miss is still counted among the coverage's missed
      appointments.
      For the missed-appointment charge only the missed appointments recorded on the homeowner's own coverage
      are counted, never those recorded on a previous owner's coverage of the same home, while every owner
      of the home still shares the coverage start and end dates and one-time repairs still count across
      owners.
      The standard missed-appointment charge counts every missed appointment recorded on the coverage,
      the one being charged included.
      The billable number of the missed appointment is the count of missed appointments less the
      program's free missed appointments, and a missed appointment whose billable number is zero or less
      carries no charge.
      The standard missed-appointment charge for a missed appointment whose billable number is one or more
      is the program's missed-appointment fee, rounded to the nearest cent.
      Which missed appointments enter the count is settled by the coverage's history: where a
      missed-appointment charge has been waived on the coverage, every missed appointment recorded on the
      coverage is counted less one for each waived charge, because a miss that followed Calloway's own
      short-notice reschedule is not the homeowner's miss; where no charge has been waived and the
      coverage start date is 24 or more whole calendar months before the assessment day, only the missed
      appointments whose appointment date is later than the same calendar day 24 months before the
      assessment day are counted; in every other case every missed appointment recorded on the coverage is
      counted.
      The notice multiplier compares the date the missed appointment was booked with its appointment date,
      in calendar days: an appointment booked fewer than 2 days ahead takes 0.50, one booked 2 to 6 days
      ahead takes 0.75, and one booked 7 or more days ahead takes 1.00.
      The trade trip multiplier follows the defect category of the missed appointment's claim item: a
      plumbing, electrical or hvac item, which sends a licensed trade, takes 1.50; a flooring, tile or
      cabinets and countertops item, which sends a specialty finish installer, takes 1.25; any other
      category takes 1.00.
      The repeat-miss multiplier reads the billable number together with the missed-appointment charges
      assessed on the coverage within the last 12 calendar months (dated later than the same calendar day
      12 months before the assessment day) less the charges waived within that same window: a billable
      number of 3 or more while at least one such unwaived charge stands takes 1.50; a billable number of
      exactly 2 while at least one such unwaived charge stands takes 1.25; any other missed appointment
      takes 1.00.
      The missed-appointment charge is the program's missed-appointment fee multiplied by the notice
      multiplier, the trade trip multiplier and the repeat-miss multiplier, each multiplier applied to that
      same fee, and the product is rounded to the nearest cent only once, at the end.
    prerequisite: []
    cross_category: []
    compute:
      - miss_date: "LATEST('warranty_events', 'appointment_date', date_field='appointment_date', event_type='warranty_appointment_missed')"
      - miss_item: "LATEST('warranty_events', 'claim_item_ref', date_field='appointment_date', event_type='warranty_appointment_missed')"
      - life_misses: "COUNT('warranty_events', event_type='warranty_appointment_missed')"
      - waived_charges: "COUNT('warranty_events', event_type='warranty_charge_waived')"
      - recent_misses: "COUNT('warranty_events', within_months=K('aging_window_months'), date_field='appointment_date', event_type='warranty_appointment_missed')"
      - coverage_months: "MONTHS(F('coverage_start_date'), NOW)"
      - miss_count: "(life_misses - waived_charges) if waived_charges > 0 else (recent_misses if (waived_charges == 0 and coverage_months >= K('aging_window_months')) else life_misses)"
      - billable_no: "miss_count - P('free_missed_appointments')"
      - booked_date: "LATEST('warranty_events', 'event_date', event_type='warranty_appointment_scheduled', claim_item_ref=miss_item, appointment_date=miss_date)"
      - notice_days: "DAYS(booked_date, miss_date)"
      - notice_mult: "K('short_notice_mult') if notice_days < K('short_notice_days') else (K('mid_notice_mult') if notice_days < K('standard_notice_days') else 1.0)"
      - miss_category: "LATEST('warranty_events', 'defect_category', event_type='warranty_claim_filed', claim_item_ref=miss_item)"
      - trade_mult: "K('systems_trade_mult') if (miss_category == 'plumbing' or miss_category == 'electrical' or miss_category == 'hvac') else (K('finish_trade_mult') if (miss_category == 'flooring' or miss_category == 'tile' or miss_category == 'cabinets_countertops') else 1.0)"
      - recent_charged: "COUNT('warranty_events', within_months=K('repeat_window_months'), event_type='warranty_charge_assessed', charge_type='missed_appointment_fee')"
      - recent_waived: "COUNT('warranty_events', within_months=K('repeat_window_months'), event_type='warranty_charge_waived')"
      - recent_unwaived: "recent_charged - recent_waived"
      - repeat_mult: "K('third_billable_mult') if (billable_no >= 3 and recent_unwaived >= 1) else (K('second_billable_mult') if (billable_no == 2 and recent_unwaived >= 1) else 1.0)"
      - last_callback: "LATEST('warranty_events', 'event_date', event_type='warranty_callback_filed', claim_item_ref=miss_item)"
      - last_repair: "LATEST('warranty_events', 'event_date', event_type='warranty_repair_completed', claim_item_ref=miss_item)"
      - callback_open: "(last_callback != None) and (last_callback <= miss_date) and ((last_repair == None) or (last_repair <= last_callback) or (last_repair >= miss_date))"
      - result: "0.0 if callback_open else (RND(P('missed_appointment_fee_usd') * notice_mult * trade_mult * repeat_mult, 2) if billable_no >= 1 else 0.0)"
    compute_basis:
      miss_date: "A missed-appointment charge is worked out for the most recent missed appointment recorded on the coverage, on the day it is assessed, and it is linked to that appointment's claim item."
      miss_item: "A missed-appointment charge is worked out for the most recent missed appointment recorded on the coverage, on the day it is assessed, and it is linked to that appointment's claim item."
      life_misses: "For the missed-appointment charge only the missed appointments recorded on the homeowner's own coverage are counted, never those recorded on a previous owner's coverage of the same home"
      waived_charges: "where a missed-appointment charge has been waived on the coverage, every missed appointment recorded on the coverage is counted less one for each waived charge"
      recent_misses: "only the missed appointments whose appointment date is later than the same calendar day 24 months before the assessment day are counted"
      coverage_months: "where no charge has been waived and the coverage start date is 24 or more whole calendar months before the assessment day"
      miss_count: "where a missed-appointment charge has been waived on the coverage, every missed appointment recorded on the coverage is counted less one for each waived charge, because a miss that followed Calloway's own short-notice reschedule is not the homeowner's miss; where no charge has been waived and the coverage start date is 24 or more whole calendar months before the assessment day, only the missed appointments whose appointment date is later than the same calendar day 24 months before the assessment day are counted; in every other case every missed appointment recorded on the coverage is counted."
      billable_no: "The billable number of the missed appointment is the count of missed appointments less the program's free missed appointments, and a missed appointment whose billable number is zero or less carries no charge."
      booked_date: "The notice multiplier compares the date the missed appointment was booked with its appointment date, in calendar days"
      notice_days: "The notice multiplier compares the date the missed appointment was booked with its appointment date, in calendar days"
      notice_mult: "an appointment booked fewer than 2 days ahead takes 0.50, one booked 2 to 6 days ahead takes 0.75, and one booked 7 or more days ahead takes 1.00."
      miss_category: "The trade trip multiplier follows the defect category of the missed appointment's claim item"
      trade_mult: "a plumbing, electrical or hvac item, which sends a licensed trade, takes 1.50; a flooring, tile or cabinets and countertops item, which sends a specialty finish installer, takes 1.25; any other category takes 1.00."
      recent_charged: "the missed-appointment charges assessed on the coverage within the last 12 calendar months (dated later than the same calendar day 12 months before the assessment day) less the charges waived within that same window"
      recent_waived: "the missed-appointment charges assessed on the coverage within the last 12 calendar months (dated later than the same calendar day 12 months before the assessment day) less the charges waived within that same window"
      repeat_mult: "a billable number of 3 or more while at least one such unwaived charge stands takes 1.50; a billable number of exactly 2 while at least one such unwaived charge stands takes 1.25; any other missed appointment takes 1.00."
      last_callback: "the item's latest callback is dated on or before the missed appointment date"
      last_repair: "the item's latest repair is either dated on or before that callback or dated on or after the missed appointment date"
      callback_open: "A missed appointment that fell while its claim item had an accepted callback awaiting repair (the item's latest callback is dated on or before the missed appointment date, and the item's latest repair is either dated on or before that callback or dated on or after the missed appointment date) carries no charge, because an accepted callback carries no fee; such a miss is still counted among the coverage's missed appointments."
      result: "The missed-appointment charge is the program's missed-appointment fee multiplied by the notice multiplier, the trade trip multiplier and the repeat-miss multiplier, each multiplier applied to that same fee, and the product is rounded to the nearest cent only once, at the end."
    factors:
      - id: miss_count_convention
        effect: method
        decides: miss_count
        bindings: [life_misses, waived_charges, recent_misses, coverage_months, miss_count]
        ladder:
          - when: "a missed-appointment charge has been waived on the coverage"
            method: "count every missed appointment recorded on the coverage, less one for each waived charge"
          - when: "no charge has been waived and the coverage start date is 24 or more whole calendar months before the assessment day"
            method: "count only the missed appointments dated later than the same calendar day 24 months before the assessment day"
          - when: "otherwise"
            method: "count every missed appointment recorded on the coverage, the one being charged included"
        baseline:
          miss_count: "life_misses"
        evidence: [history, date]
        cross_difficulty: null
      - id: notice_multiplier
        effect: parameter
        decides: notice_mult
        bindings: [booked_date, notice_days, notice_mult]
        ladder:
          - when: "the missed appointment was booked fewer than 2 calendar days ahead of its appointment date"
            value: "K('short_notice_mult') = 0.50"
          - when: "it was booked 2 to 6 calendar days ahead"
            value: "K('mid_notice_mult') = 0.75"
          - when: "otherwise (booked 7 or more calendar days ahead)"
            value: "1.00"
        baseline:
          notice_mult: "1.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: trade_trip_multiplier
        effect: parameter
        decides: trade_mult
        bindings: [miss_category, trade_mult]
        ladder:
          - when: "the missed appointment's claim item is a plumbing, electrical or hvac item"
            value: "K('systems_trade_mult') = 1.50"
          - when: "the claim item is a flooring, tile or cabinets and countertops item"
            value: "K('finish_trade_mult') = 1.25"
          - when: "otherwise"
            value: "1.00"
        baseline:
          trade_mult: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_miss_multiplier
        effect: parameter
        decides: repeat_mult
        bindings: [recent_charged, recent_waived, recent_unwaived, repeat_mult]
        ladder:
          - when: "the billable number is 3 or more and at least one missed-appointment charge assessed in the last 12 calendar months stands unwaived"
            value: "K('third_billable_mult') = 1.50"
          - when: "the billable number is exactly 2 and at least one missed-appointment charge assessed in the last 12 calendar months stands unwaived"
            value: "K('second_billable_mult') = 1.25"
          - when: "otherwise"
            value: "1.00"
        baseline:
          repeat_mult: "1.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard missed-appointment charge counts every missed appointment recorded on the coverage,
        the one being charged included. The billable number of the missed appointment is the count of
        missed appointments less the program's free missed appointments, and a missed appointment whose
        billable number is zero or less carries no charge. The standard missed-appointment charge for a
        missed appointment whose billable number is one or more is the program's missed-appointment fee,
        rounded to the nearest cent.
      params: [free_missed_appointments, missed_appointment_fee_usd]
    inputs:
      history:
        - {table: warranty_events, aggregate: count, field: appointment_date, filters: {event_type: warranty_appointment_missed}}
        - {table: warranty_events, aggregate: count, field: appointment_date, within_months: 24, filters: {event_type: warranty_appointment_missed}}
        - {table: warranty_events, aggregate: count, field: event_date, filters: {event_type: warranty_charge_waived}}
        - {table: warranty_events, aggregate: count, field: event_date, within_months: 12, filters: {event_type: warranty_charge_assessed, charge_type: missed_appointment_fee}}
        - {table: warranty_events, aggregate: latest, field: appointment_date, filters: {event_type: warranty_appointment_missed}}
        - {table: warranty_events, aggregate: latest, field: event_date, filters: {event_type: warranty_appointment_scheduled}}
        - {table: warranty_events, aggregate: latest, field: defect_category, filters: {event_type: warranty_claim_filed}}
      cross_category: []

  - id: warranty_ext_finish_item_settlement
    base_policy_refs: [warranty_structural_claims, warranty_payouts_and_payments, warranty_coverage_periods, warranty_callbacks]
    overwrite: []
    trigger: on_request
    subject: [warranty_payout_approved]
    computes: amount
    target_tool: accept_finish_item_cash_settlement_135d939d
    params:
      standard_share: 0.45
      specialty_share: 0.60
      light_share: 0.30
      zone_a_mult: 1.25
      zone_b_mult: 1.12
      finish_high_usd: 12000
      finish_mid_usd: 5000
      upper_pkg_high_mult: 1.30
      upper_pkg_mid_mult: 1.15
      lower_pkg_mult: 1.10
      delay_clear_mult: 1.25
      delay_shared_mult: 1.10
      delay_charge_window_months: 6
      callback_window_months: 12
    rule: >-
      A finish-item cash settlement is offered on the claim item of the most recent workmanship approval
      recorded on the coverage, whether that approval is the item's original approval or an accepted
      callback, and it becomes a payout only when the homeowner accepts it in writing.
      The finish settlement is fixed only after every missed appointment on the coverage that the
      missed-appointment rules make chargeable carries its missed-appointment charge.
      The standard finish settlement is the program's cash-in-lieu maximum multiplied by the standard
      settlement share of 0.45, rounded to the nearest cent.
      The settlement share follows the defect category of the item under settlement: a flooring, tile or
      cabinets and countertops item takes a share of 0.60; a paint, drywall or trim carpentry item takes a
      share of 0.30; any other workmanship category takes the standard share of 0.45.
      The labor-market multiplier follows the community named on the home's purchase agreement: Sierra
      Vista Ranch takes 1.25; Larkspur Meadows or Willow Bend Reserve takes 1.12; any other community
      takes 1.00.
      The finish-level multiplier reads the Design Studio Selections file of the home's purchase
      agreement, whose finish upgrades are the option lines added in the flooring, cabinetry and
      countertops categories less the option lines removed in those categories (option lines in any
      other category are not finish upgrades): a file on Studio Designer, Studio Signature or Studio
      Atelier with finish upgrades of 12,000 dollars or more takes 1.30; a file on one of those three
      packages with finish upgrades of at least 5,000 dollars but under 12,000 dollars takes 1.15; a file
      on Studio Essentials, Studio Classic or Studio Select with finish upgrades of 5,000 dollars or more
      takes 1.10; any other file takes 1.00.
      The service-delay multiplier counts the calendar days from the date of that most recent
      workmanship approval to the settlement date, the approval date itself not counted, and reads the
      missed-appointment charges assessed on the coverage within the last 6 calendar months (dated later
      than the same calendar day 6 months before the settlement date) less the charges waived within that
      same window: more days than the program's repair target days with no such unwaived charge standing
      takes 1.25; more days than the program's repair target days with at least one such unwaived charge
      standing takes 1.10; any other case takes 1.00.
      The scheduled finish settlement is the program's cash-in-lieu maximum multiplied by the settlement
      share, the labor-market multiplier, the finish-level multiplier and the service-delay multiplier,
      each of them applied to that same maximum, and the product is rounded to the nearest cent.
      How the finish settlement is taken from the scheduled finish settlement follows the callbacks filed
      on the coverage within the last 12 calendar months (dated later than the same calendar day 12 months
      before the settlement date): with two or more such callbacks the finish settlement is the program's
      cash-in-lieu maximum itself; with exactly one such callback it is the scheduled finish settlement
      plus half of the difference between the program's cash-in-lieu maximum and the scheduled finish
      settlement, rounded to the nearest cent; with no such callback it is the scheduled finish
      settlement.
      The finish settlement never exceeds the program's cash-in-lieu maximum, compared after the callback
      step.
    prerequisite:
      - problem: warranty_ext_missed_appointment_charge
        kind: value_input
        gate: delay_mult
        form: state
        policy_source: >-
          The finish settlement is fixed only after every missed appointment on the coverage that the
          missed-appointment rules make chargeable carries its missed-appointment charge.
        condition: >-
          Every warranty_appointment_missed row on the coverage that the missed-appointment rules make
          chargeable (billable number one or more, and its appointment date not falling while its claim item
          had an accepted callback awaiting repair) is matched by a warranty_charge_assessed row of
          charge_type missed_appointment_fee on the same claim item; a miss the rules leave uncharged needs no such
          row.
        resolved_by: assess_missed_appointment_charge_27486c7f
        effect: >-
          Booking the missed-appointment charge adds an unwaived missed-appointment charge dated the
          assessment day to the coverage, so the service-delay multiplier (delay_mult) reads one more
          unwaived charge in its six-month window; where the repair target days have passed and no other
          unwaived missed-appointment charge of that window stood, it moves from the no-unwaived-charge tier
          to the at-least-one-unwaived-charge tier.
    cross_category:
      - category: purchase
        as: branch
        reads: [community]
        note: The labor-market multiplier is decided from the community on the home's purchase agreement.
      - category: design
        as: history
        reads: [variant_name, design_events.amount]
        note: The finish-level multiplier is decided from the design file's package and the finish option lines added and removed on its ledger.
    compute:
      - item_ref: "LATEST('warranty_events', 'claim_item_ref', event_type='warranty_claim_approved', coverage_basis='workmanship')"
      - item_category: "LATEST('warranty_events', 'defect_category', event_type='warranty_claim_filed', claim_item_ref=item_ref)"
      - share: "K('specialty_share') if (item_category == 'flooring' or item_category == 'tile' or item_category == 'cabinets_countertops') else (K('light_share') if (item_category == 'paint' or item_category == 'drywall' or item_category == 'trim_carpentry') else K('standard_share'))"
      - community: "CFIELD('purchase', 'community', purchase_id=F('purchase_id'))"
      - market_mult: "K('zone_a_mult') if community == 'Sierra Vista Ranch' else (K('zone_b_mult') if (community == 'Larkspur Meadows' or community == 'Willow Bend Reserve') else 1.0)"
      - package: "CFIELD('design', 'variant_name', purchase_id=F('purchase_id'))"
      - design_file: "CFIELD('design', 'selection_id', purchase_id=F('purchase_id'))"
      - upper_package: "package == 'Studio Designer' or package == 'Studio Signature' or package == 'Studio Atelier'"
      - finish_added: "XSUM('design', 'design_events', 'amount', event_type='design_option_added', option_category='flooring', selection_id=design_file) + XSUM('design', 'design_events', 'amount', event_type='design_option_added', option_category='cabinetry', selection_id=design_file) + XSUM('design', 'design_events', 'amount', event_type='design_option_added', option_category='countertops', selection_id=design_file)"
      - finish_removed: "XSUM('design', 'design_events', 'amount', event_type='design_option_removed', option_category='flooring', selection_id=design_file) + XSUM('design', 'design_events', 'amount', event_type='design_option_removed', option_category='cabinetry', selection_id=design_file) + XSUM('design', 'design_events', 'amount', event_type='design_option_removed', option_category='countertops', selection_id=design_file)"
      - finish_upgrades: "finish_added - finish_removed"
      - finish_mult: "K('upper_pkg_high_mult') if (upper_package and finish_upgrades >= K('finish_high_usd')) else (K('upper_pkg_mid_mult') if (upper_package and finish_upgrades >= K('finish_mid_usd')) else (K('lower_pkg_mult') if ((not upper_package) and finish_upgrades >= K('finish_mid_usd')) else 1.0))"
      - approval_date: "LATEST('warranty_events', 'event_date', event_type='warranty_claim_approved', coverage_basis='workmanship')"
      - wait_days: "DAYS(approval_date, NOW)"
      - delay_charged: "COUNT('warranty_events', within_months=K('delay_charge_window_months'), event_type='warranty_charge_assessed', charge_type='missed_appointment_fee')"
      - delay_waived: "COUNT('warranty_events', within_months=K('delay_charge_window_months'), event_type='warranty_charge_waived')"
      - delay_unwaived: "delay_charged - delay_waived"
      - delay_mult: "K('delay_clear_mult') if (wait_days > P('repair_target_days') and delay_unwaived == 0) else (K('delay_shared_mult') if (wait_days > P('repair_target_days') and delay_unwaived >= 1) else 1.0)"
      - scheduled: "RND(P('cash_in_lieu_max_usd') * share * market_mult * finish_mult * delay_mult, 2)"
      - callbacks: "COUNT('warranty_events', within_months=K('callback_window_months'), event_type='warranty_callback_filed')"
      - settlement: "P('cash_in_lieu_max_usd') if callbacks >= 2 else (RND(scheduled + (P('cash_in_lieu_max_usd') - scheduled) / 2, 2) if callbacks == 1 else scheduled)"
      - result: "MN(settlement, P('cash_in_lieu_max_usd'))"
    compute_basis:
      item_ref: "A finish-item cash settlement is offered on the claim item of the most recent workmanship approval recorded on the coverage, whether that approval is the item's original approval or an accepted callback, and it becomes a payout only when the homeowner accepts it in writing."
      item_category: "The settlement share follows the defect category of the item under settlement"
      share: "a flooring, tile or cabinets and countertops item takes a share of 0.60; a paint, drywall or trim carpentry item takes a share of 0.30; any other workmanship category takes the standard share of 0.45."
      community: "The labor-market multiplier follows the community named on the home's purchase agreement"
      market_mult: "Sierra Vista Ranch takes 1.25; Larkspur Meadows or Willow Bend Reserve takes 1.12; any other community takes 1.00."
      package: "The finish-level multiplier reads the Design Studio Selections file of the home's purchase agreement"
      design_file: "The finish-level multiplier reads the Design Studio Selections file of the home's purchase agreement, whose finish upgrades are the option lines added in the flooring, cabinetry and countertops categories less the option lines removed in those categories"
      upper_package: "a file on Studio Designer, Studio Signature or Studio Atelier with finish upgrades of 12,000 dollars or more takes 1.30"
      finish_added: "whose finish upgrades are the option lines added in the flooring, cabinetry and countertops categories less the option lines removed in those categories (option lines in any other category are not finish upgrades)"
      finish_removed: "whose finish upgrades are the option lines added in the flooring, cabinetry and countertops categories less the option lines removed in those categories (option lines in any other category are not finish upgrades)"
      finish_mult: "a file on Studio Designer, Studio Signature or Studio Atelier with finish upgrades of 12,000 dollars or more takes 1.30; a file on one of those three packages with finish upgrades of at least 5,000 dollars but under 12,000 dollars takes 1.15; a file on Studio Essentials, Studio Classic or Studio Select with finish upgrades of 5,000 dollars or more takes 1.10; any other file takes 1.00."
      approval_date: "The service-delay multiplier counts the calendar days from the date of that most recent workmanship approval to the settlement date, the approval date itself not counted"
      wait_days: "The service-delay multiplier counts the calendar days from the date of that most recent workmanship approval to the settlement date, the approval date itself not counted"
      delay_charged: "reads the missed-appointment charges assessed on the coverage within the last 6 calendar months (dated later than the same calendar day 6 months before the settlement date) less the charges waived within that same window"
      delay_waived: "reads the missed-appointment charges assessed on the coverage within the last 6 calendar months (dated later than the same calendar day 6 months before the settlement date) less the charges waived within that same window"
      delay_mult: "more days than the program's repair target days with no such unwaived charge standing takes 1.25; more days than the program's repair target days with at least one such unwaived charge standing takes 1.10; any other case takes 1.00."
      scheduled: "The scheduled finish settlement is the program's cash-in-lieu maximum multiplied by the settlement share, the labor-market multiplier, the finish-level multiplier and the service-delay multiplier, each of them applied to that same maximum, and the product is rounded to the nearest cent."
      callbacks: "How the finish settlement is taken from the scheduled finish settlement follows the callbacks filed on the coverage within the last 12 calendar months (dated later than the same calendar day 12 months before the settlement date)"
      settlement: "with two or more such callbacks the finish settlement is the program's cash-in-lieu maximum itself; with exactly one such callback it is the scheduled finish settlement plus half of the difference between the program's cash-in-lieu maximum and the scheduled finish settlement, rounded to the nearest cent; with no such callback it is the scheduled finish settlement."
      result: "The finish settlement never exceeds the program's cash-in-lieu maximum, compared after the callback step."
    factors:
      - id: settlement_share
        effect: parameter
        decides: share
        bindings: [item_ref, item_category, share]
        ladder:
          - when: "the item under settlement is a flooring, tile or cabinets and countertops item"
            value: "K('specialty_share') = 0.60"
          - when: "the item under settlement is a paint, drywall or trim carpentry item"
            value: "K('light_share') = 0.30"
          - when: "otherwise"
            value: "K('standard_share') = 0.45"
        baseline:
          share: "K('standard_share')"
        evidence: [history]
        cross_difficulty: null
      - id: labor_market_multiplier
        effect: parameter
        decides: market_mult
        bindings: [community, market_mult]
        ladder:
          - when: "the home's purchase agreement names Sierra Vista Ranch"
            value: "K('zone_a_mult') = 1.25"
          - when: "the home's purchase agreement names Larkspur Meadows or Willow Bend Reserve"
            value: "K('zone_b_mult') = 1.12"
          - when: "otherwise"
            value: "1.00"
        baseline:
          market_mult: "1.0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: finish_level_multiplier
        effect: parameter
        decides: finish_mult
        bindings: [package, design_file, upper_package, finish_added, finish_removed, finish_upgrades, finish_mult]
        ladder:
          - when: "the design file is on Studio Designer, Studio Signature or Studio Atelier and its finish upgrades are 12,000 dollars or more"
            value: "K('upper_pkg_high_mult') = 1.30"
          - when: "the design file is on Studio Designer, Studio Signature or Studio Atelier and its finish upgrades are at least 5,000 but under 12,000 dollars"
            value: "K('upper_pkg_mid_mult') = 1.15"
          - when: "the design file is on Studio Essentials, Studio Classic or Studio Select and its finish upgrades are 5,000 dollars or more"
            value: "K('lower_pkg_mult') = 1.10"
          - when: "otherwise"
            value: "1.00"
        baseline:
          finish_mult: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: design
      - id: service_delay_multiplier
        effect: parameter
        decides: delay_mult
        bindings: [approval_date, wait_days, delay_charged, delay_waived, delay_unwaived, delay_mult]
        ladder:
          - when: "more calendar days than the program's repair target days have passed since the most recent workmanship approval and no missed-appointment charge of the last 6 calendar months stands unwaived"
            value: "K('delay_clear_mult') = 1.25"
          - when: "more calendar days than the program's repair target days have passed since the most recent workmanship approval and at least one missed-appointment charge of the last 6 calendar months stands unwaived"
            value: "K('delay_shared_mult') = 1.10"
          - when: "otherwise"
            value: "1.00"
        baseline:
          delay_mult: "1.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: callback_settlement_method
        effect: method
        decides: settlement
        bindings: [callbacks, settlement]
        ladder:
          - when: "two or more callbacks were filed on the coverage within the last 12 calendar months"
            method: "the finish settlement is the program's cash-in-lieu maximum itself"
          - when: "exactly one callback was filed on the coverage within the last 12 calendar months"
            method: "the finish settlement is the scheduled finish settlement plus half of the gap between the cash-in-lieu maximum and the scheduled finish settlement, rounded to the cent"
          - when: "otherwise"
            method: "the finish settlement is the scheduled finish settlement"
        baseline:
          settlement: "scheduled"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard finish settlement is the program's cash-in-lieu maximum multiplied by the standard
        settlement share of 0.45, rounded to the nearest cent.
      params: [cash_in_lieu_max_usd, standard_share]
    inputs:
      history:
        - {table: warranty_events, aggregate: latest, field: event_date, filters: {event_type: warranty_claim_approved, coverage_basis: workmanship}}
        - {table: warranty_events, aggregate: latest, field: defect_category, filters: {event_type: warranty_claim_filed}}
        - {table: warranty_events, aggregate: count, field: event_date, within_months: 6, filters: {event_type: warranty_charge_assessed, charge_type: missed_appointment_fee}}
        - {table: warranty_events, aggregate: count, field: event_date, within_months: 6, filters: {event_type: warranty_charge_waived}}
        - {table: warranty_events, aggregate: count, field: event_date, within_months: 12, filters: {event_type: warranty_callback_filed}}
        - {category: design, table: design_events, aggregate: sum, field: amount, filters: {event_type: design_option_added}}
        - {category: design, table: design_events, aggregate: sum, field: amount, filters: {event_type: design_option_removed}}
      cross_category: [purchase, design]

  - id: warranty_ext_reinspection_charge
    base_policy_refs: [warranty_tolerances_and_exclusions, warranty_appointment_charges, warranty_structural_claims, warranty_transfer, warranty_service_levels]
    overwrite:
      - base_policy: warranty_tolerances_and_exclusions
        superseded_clause: >-
          An item already denied within_tolerance that is re-reported and again measured within tolerance
          carries reinspection_fee_usd.
        replaced_by: >-
          The inspection a reinspection charge is worked out for counts as the re-measurement of a re-reported
          item only when the coverage records at least two claim items filed in that inspection's defect
          category and at least two denials for within tolerance, whichever claim items those denials concern;
          where either count falls short, the inspection counts as a first report and no reinspection charge
          is made.
          The visit charge of a re-measurement is the program's reinspection fee multiplied by the borderline
          multiplier, the repeat-reinspection multiplier, the soil-movement multiplier, the settling-period
          multiplier and the re-measure delay multiplier, each multiplier applied to that same fee.
    trigger: state_due
    subject: [warranty_charge_assessed]
    computes: amount
    target_tool: assess_reinspection_charge_a99ab20e
    params:
      borderline_high_ratio: 0.9
      borderline_mid_ratio: 0.75
      borderline_high_mult: 0.6
      borderline_mid_mult: 0.8
      repeat_two_mult: 1.5
      repeat_one_mult: 1.25
      repeat_window_months: 12
      clay_soil_mult: 0.7
      moderate_soil_mult: 0.85
      first_year_months: 12
      second_year_months: 24
      first_year_mult: 0.75
      second_year_mult: 0.9
      long_delay_days: 14
      short_delay_days: 7
      long_delay_mult: 0.5
      short_delay_mult: 0.8
    rule: >-
      A reinspection charge is worked out for the most recent inspection recorded on the coverage that
      found a crack within tolerance, on the day it is assessed, and it is linked to that inspection's
      claim item.
      The standard reinspection charge is the program's reinspection fee, rounded to the nearest cent.
      The borderline multiplier compares the re-measured width with the program's tolerance for the item's
      defect category (the concrete crack width tolerance for concrete flatwork, the slab crack width
      tolerance for a foundation slab, the masonry crack tolerance for masonry veneer and the drywall crack
      tolerance for any other item): a width of 90 percent of the tolerance or more takes 0.60; a width of
      at least 75 percent but under 90 percent of the tolerance takes 0.80; a narrower width takes 1.00.
      The repeat-reinspection multiplier counts the reinspection charges already assessed on the coverage
      within the last 12 calendar months (dated later than the same calendar day 12 months before the
      assessment day): two or more take 1.50; exactly one takes 1.25; none takes 1.00.
      The soil-movement multiplier reads the item's defect category together with the community named on
      the home's purchase agreement: a concrete flatwork, foundation slab or masonry veneer item in Cedar
      Hollow, Larkspur Meadows or Sierra Vista Ranch, which are built on expansive clay, takes 0.70; a
      concrete flatwork, foundation slab or masonry veneer item in Mesquite Trails, Brookstone Crossing or
      Willow Bend Reserve takes 0.85; any other item takes 1.00.
      The settling-period multiplier follows the whole calendar months from the coverage start date to the
      assessment day: fewer than 12 months take 0.75; 12 to 23 months take 0.90; 24 months or more take
      1.00.
      The re-measure delay multiplier counts the calendar days from the date the re-reported item was filed
      to the date of the re-measurement, the filing date itself not counted: more than 14 days take 0.50;
      8 to 14 days take 0.80; 7 days or fewer take 1.00.
      The inspection a reinspection charge is worked out for counts as the re-measurement of a re-reported
      item only when the coverage records at least two claim items filed in that inspection's defect
      category and at least two denials for within tolerance, whichever claim items those denials concern;
      where either count falls short, the inspection counts as a first report and no reinspection charge
      is made.
      The visit charge of a re-measurement is the program's reinspection fee multiplied by the borderline
      multiplier, the repeat-reinspection multiplier, the soil-movement multiplier, the settling-period
      multiplier and the re-measure delay multiplier, each multiplier applied to that same fee.
      How the reinspection charge is taken from the visit charge follows what else that visit served on
      the re-measurement date: where a walkthrough was held at the home that day, no reinspection charge
      is made; where no walkthrough was held that day but the coverage records covered work that day (an
      inspection that confirmed a defect or a completed repair), the visit charge is shared equally between
      the re-measured item and each such covered-work entry and the reinspection charge is the re-measured
      item's share; where neither was recorded that day, the reinspection charge is the whole visit charge.
      The reinspection charge is rounded to the nearest cent once, at the end.
    prerequisite: []
    cross_category:
      - category: purchase
        as: branch
        reads: [community]
        note: The soil-movement multiplier is decided from the community on the home's purchase agreement together with the item's defect category.
    compute:
      - rm_date: "LATEST('warranty_events', 'event_date', event_type='warranty_claim_inspected', inspection_finding='within_tolerance')"
      - rm_item: "LATEST('warranty_events', 'claim_item_ref', event_type='warranty_claim_inspected', inspection_finding='within_tolerance')"
      - rm_width: "LATEST('warranty_events', 'measured_width_in', event_type='warranty_claim_inspected', inspection_finding='within_tolerance')"
      - rm_category: "LATEST('warranty_events', 'defect_category', event_type='warranty_claim_filed', claim_item_ref=rm_item)"
      - tolerance: "P('concrete_crack_width_tolerance_in') if rm_category == 'concrete_flatwork' else (P('slab_crack_width_tolerance_in') if rm_category == 'foundation_slab' else (P('masonry_crack_tolerance_in') if rm_category == 'masonry_veneer' else P('drywall_crack_tolerance_in')))"
      - width_ratio: "rm_width / tolerance"
      - borderline_mult: "K('borderline_high_mult') if width_ratio >= K('borderline_high_ratio') else (K('borderline_mid_mult') if width_ratio >= K('borderline_mid_ratio') else 1.0)"
      - prior_reinspections: "COUNT('warranty_events', within_months=K('repeat_window_months'), event_type='warranty_charge_assessed', charge_type='reinspection_fee')"
      - repeat_mult: "K('repeat_two_mult') if prior_reinspections >= 2 else (K('repeat_one_mult') if prior_reinspections == 1 else 1.0)"
      - community: "CFIELD('purchase', 'community', purchase_id=F('purchase_id'))"
      - soil_mult: "K('clay_soil_mult') if ((rm_category == 'concrete_flatwork' or rm_category == 'foundation_slab' or rm_category == 'masonry_veneer') and (community == 'Cedar Hollow' or community == 'Larkspur Meadows' or community == 'Sierra Vista Ranch')) else (K('moderate_soil_mult') if ((rm_category == 'concrete_flatwork' or rm_category == 'foundation_slab' or rm_category == 'masonry_veneer') and (community == 'Mesquite Trails' or community == 'Brookstone Crossing' or community == 'Willow Bend Reserve')) else 1.0)"
      - coverage_months: "MONTHS(F('coverage_start_date'), NOW)"
      - settling_mult: "K('first_year_mult') if coverage_months < K('first_year_months') else (K('second_year_mult') if coverage_months < K('second_year_months') else 1.0)"
      - filed_date: "LATEST('warranty_events', 'event_date', event_type='warranty_claim_filed', claim_item_ref=rm_item)"
      - remeasure_delay: "DAYS(filed_date, rm_date)"
      - delay_mult: "K('long_delay_mult') if remeasure_delay > K('long_delay_days') else (K('short_delay_mult') if remeasure_delay > K('short_delay_days') else 1.0)"
      - visit_charge: "P('reinspection_fee_usd') * borderline_mult * repeat_mult * soil_mult * settling_mult * delay_mult"
      - walkthroughs_that_day: "COUNT('warranty_events', event_type='warranty_walkthrough_completed', event_date=rm_date)"
      - covered_work_that_day: "COUNT('warranty_events', event_type='warranty_claim_inspected', inspection_finding='defect_confirmed', event_date=rm_date) + COUNT('warranty_events', event_type='warranty_repair_completed', event_date=rm_date)"
      - item_charge: "0.0 if walkthroughs_that_day >= 1 else (visit_charge / (1 + covered_work_that_day) if (walkthroughs_that_day == 0 and covered_work_that_day >= 1) else visit_charge)"
      - same_category_items: "COUNT('warranty_events', event_type='warranty_claim_filed', defect_category=rm_category)"
      - within_tolerance_denials: "COUNT('warranty_events', event_type='warranty_claim_denied', denial_reason='within_tolerance')"
      - re_report: "same_category_items >= 2 and within_tolerance_denials >= 2"
      - result: "RND(item_charge, 2) if re_report else 0.0"
    compute_basis:
      rm_date: "A reinspection charge is worked out for the most recent inspection recorded on the coverage that found a crack within tolerance, on the day it is assessed, and it is linked to that inspection's claim item."
      rm_item: "A reinspection charge is worked out for the most recent inspection recorded on the coverage that found a crack within tolerance, on the day it is assessed, and it is linked to that inspection's claim item."
      rm_width: "The borderline multiplier compares the re-measured width with the program's tolerance for the item's defect category"
      rm_category: "the program's tolerance for the item's defect category"
      tolerance: "(the concrete crack width tolerance for concrete flatwork, the slab crack width tolerance for a foundation slab, the masonry crack tolerance for masonry veneer and the drywall crack tolerance for any other item)"
      borderline_mult: "a width of 90 percent of the tolerance or more takes 0.60; a width of at least 75 percent but under 90 percent of the tolerance takes 0.80; a narrower width takes 1.00."
      prior_reinspections: "The repeat-reinspection multiplier counts the reinspection charges already assessed on the coverage within the last 12 calendar months (dated later than the same calendar day 12 months before the assessment day)"
      repeat_mult: "two or more take 1.50; exactly one takes 1.25; none takes 1.00."
      community: "The soil-movement multiplier reads the item's defect category together with the community named on the home's purchase agreement"
      soil_mult: "a concrete flatwork, foundation slab or masonry veneer item in Cedar Hollow, Larkspur Meadows or Sierra Vista Ranch, which are built on expansive clay, takes 0.70; a concrete flatwork, foundation slab or masonry veneer item in Mesquite Trails, Brookstone Crossing or Willow Bend Reserve takes 0.85; any other item takes 1.00."
      coverage_months: "The settling-period multiplier follows the whole calendar months from the coverage start date to the assessment day"
      settling_mult: "fewer than 12 months take 0.75; 12 to 23 months take 0.90; 24 months or more take 1.00."
      filed_date: "The re-measure delay multiplier counts the calendar days from the date the re-reported item was filed to the date of the re-measurement, the filing date itself not counted"
      remeasure_delay: "The re-measure delay multiplier counts the calendar days from the date the re-reported item was filed to the date of the re-measurement, the filing date itself not counted"
      delay_mult: "more than 14 days take 0.50; 8 to 14 days take 0.80; 7 days or fewer take 1.00."
      visit_charge: "The visit charge of a re-measurement is the program's reinspection fee multiplied by the borderline multiplier, the repeat-reinspection multiplier, the soil-movement multiplier, the settling-period multiplier and the re-measure delay multiplier, each multiplier applied to that same fee."
      walkthroughs_that_day: "where a walkthrough was held at the home that day, no reinspection charge is made"
      covered_work_that_day: "where no walkthrough was held that day but the coverage records covered work that day (an inspection that confirmed a defect or a completed repair)"
      item_charge: "where a walkthrough was held at the home that day, no reinspection charge is made; where no walkthrough was held that day but the coverage records covered work that day (an inspection that confirmed a defect or a completed repair), the visit charge is shared equally between the re-measured item and each such covered-work entry and the reinspection charge is the re-measured item's share; where neither was recorded that day, the reinspection charge is the whole visit charge."
      same_category_items: "The inspection a reinspection charge is worked out for counts as the re-measurement of a re-reported item only when the coverage records at least two claim items filed in that inspection's defect category and at least two denials for within tolerance, whichever claim items those denials concern; where either count falls short, the inspection counts as a first report and no reinspection charge is made."
      within_tolerance_denials: "The inspection a reinspection charge is worked out for counts as the re-measurement of a re-reported item only when the coverage records at least two claim items filed in that inspection's defect category and at least two denials for within tolerance, whichever claim items those denials concern; where either count falls short, the inspection counts as a first report and no reinspection charge is made."
      re_report: "The inspection a reinspection charge is worked out for counts as the re-measurement of a re-reported item only when the coverage records at least two claim items filed in that inspection's defect category and at least two denials for within tolerance, whichever claim items those denials concern; where either count falls short, the inspection counts as a first report and no reinspection charge is made."
      result: "The reinspection charge is rounded to the nearest cent once, at the end."
    factors:
      - id: borderline_multiplier
        effect: parameter
        decides: borderline_mult
        bindings: [rm_width, rm_category, tolerance, width_ratio, borderline_mult]
        ladder:
          - when: "the re-measured width is 90 percent of the category tolerance or more"
            value: "K('borderline_high_mult') = 0.60"
          - when: "the re-measured width is at least 75 but under 90 percent of the category tolerance"
            value: "K('borderline_mid_mult') = 0.80"
          - when: "otherwise"
            value: "1.00"
        baseline:
          borderline_mult: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_reinspection_multiplier
        effect: parameter
        decides: repeat_mult
        bindings: [prior_reinspections, repeat_mult]
        ladder:
          - when: "two or more reinspection charges were assessed on the coverage within the last 12 calendar months"
            value: "K('repeat_two_mult') = 1.50"
          - when: "exactly one reinspection charge was assessed within the last 12 calendar months"
            value: "K('repeat_one_mult') = 1.25"
          - when: "otherwise"
            value: "1.00"
        baseline:
          repeat_mult: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: soil_movement_multiplier
        effect: parameter
        decides: soil_mult
        bindings: [community, soil_mult]
        ladder:
          - when: "the item is concrete flatwork, foundation slab or masonry veneer and the home's purchase agreement names Cedar Hollow, Larkspur Meadows or Sierra Vista Ranch"
            value: "K('clay_soil_mult') = 0.70"
          - when: "the item is concrete flatwork, foundation slab or masonry veneer and the purchase agreement names Mesquite Trails, Brookstone Crossing or Willow Bend Reserve"
            value: "K('moderate_soil_mult') = 0.85"
          - when: "otherwise"
            value: "1.00"
        baseline:
          soil_mult: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: purchase
      - id: settling_period_multiplier
        effect: parameter
        decides: settling_mult
        bindings: [coverage_months, settling_mult]
        ladder:
          - when: "fewer than 12 whole calendar months from the coverage start date to the assessment day"
            value: "K('first_year_mult') = 0.75"
          - when: "12 to 23 whole calendar months"
            value: "K('second_year_mult') = 0.90"
          - when: "otherwise (24 months or more)"
            value: "1.00"
        baseline:
          settling_mult: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: remeasure_delay_multiplier
        effect: parameter
        decides: delay_mult
        bindings: [filed_date, remeasure_delay, delay_mult]
        ladder:
          - when: "more than 14 calendar days from the re-report's filing date to the re-measurement"
            value: "K('long_delay_mult') = 0.50"
          - when: "8 to 14 calendar days"
            value: "K('short_delay_mult') = 0.80"
          - when: "otherwise (7 days or fewer)"
            value: "1.00"
        baseline:
          delay_mult: "1.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: shared_visit_method
        effect: method
        decides: item_charge
        bindings: [walkthroughs_that_day, covered_work_that_day, item_charge]
        ladder:
          - when: "a walkthrough was held at the home on the re-measurement date"
            method: "no reinspection charge is made"
          - when: "no walkthrough was held that day but covered work (a defect-confirming inspection or a completed repair) is recorded that day"
            method: "the visit charge is divided equally among the re-measured item and each covered-work entry, and the item carries its share"
          - when: "otherwise"
            method: "the reinspection charge is the whole visit charge"
        baseline:
          item_charge: "visit_charge"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard reinspection charge is the program's reinspection fee, rounded to the nearest cent.
      params: [reinspection_fee_usd]
    inputs:
      history:
        - {table: warranty_events, aggregate: latest, field: measured_width_in, filters: {event_type: warranty_claim_inspected, inspection_finding: within_tolerance}}
        - {table: warranty_events, aggregate: latest, field: event_date, filters: {event_type: warranty_claim_filed}}
        - {table: warranty_events, aggregate: count, field: event_date, within_months: 12, filters: {event_type: warranty_charge_assessed, charge_type: reinspection_fee}}
        - {table: warranty_events, aggregate: count, field: event_date, filters: {event_type: warranty_walkthrough_completed}}
        - {table: warranty_events, aggregate: count, field: event_date, filters: {event_type: warranty_claim_inspected, inspection_finding: defect_confirmed}}
        - {table: warranty_events, aggregate: count, field: event_date, filters: {event_type: warranty_repair_completed}}
        - {table: warranty_events, aggregate: count, field: event_date, filters: {event_type: warranty_claim_denied, denial_reason: within_tolerance}}
      cross_category: [purchase]

  - id: warranty_ext_dispatch_charge
    base_policy_refs: [warranty_tolerances_and_exclusions, warranty_appointment_charges, warranty_structural_claims, warranty_transfer, warranty_service_levels]
    overwrite:
      - base_policy: warranty_appointment_charges
        superseded_clause: >-
          An emergency dispatch that finds a condition caused by the homeowner or not covered carries
          emergency_dispatch_fee_usd.
        replaced_by: >-
          The scheduled dispatch charge is the program's emergency dispatch fee multiplied by the
          condition-class multiplier, the finding multiplier, the non-warranty visit multiplier, the
          first-period multiplier and the active-buyer multiplier, each multiplier applied to that same fee.
    trigger: state_due
    subject: [warranty_charge_assessed]
    computes: amount
    target_tool: assess_emergency_dispatch_charge_91903470
    params:
      safety_mult: 0.5
      comfort_mult: 0.8
      not_reproduced_mult: 0.5
      maintenance_mult: 0.75
      visits_two_mult: 1.5
      visits_one_mult: 1.25
      visit_window_months: 12
      first_year_months: 12
      second_year_months: 24
      first_year_mult: 0.5
      second_year_mult: 0.75
      building_buyer_mult: 0.5
      holding_buyer_mult: 0.75
      deposit_window_months: 12
    rule: >-
      A dispatch charge is worked out for the most recent emergency dispatch recorded on the coverage, on
      the day it is assessed, and it is linked to that dispatch's claim item; a dispatch whose claim item
      the inspection confirmed as a covered defect carries no dispatch charge.
      The dispatch charge is fixed only after every re-reported item that a re-measurement again found
      within tolerance and that the reinspection rules make chargeable carries its reinspection charge.
      The standard dispatch charge is the program's emergency dispatch fee, rounded to the nearest cent.
      The condition-class multiplier follows the emergency condition reported on the dispatched item: a
      gas leak or a total electrical loss, which are safety calls, takes 0.50; no heat or no cooling, which
      are comfort calls, takes 0.80; any other emergency condition takes 1.00.
      The finding multiplier follows the inspection finding on the dispatched item: a condition the
      technician could not reproduce takes 0.50; a homeowner maintenance item takes 0.75; any other finding
      (homeowner damage, a homeowner alteration or a condition not covered) takes 1.00.
      The non-warranty visit multiplier counts the reinspection charges and the emergency dispatch charges
      assessed on the coverage within the last 12 calendar months (dated later than the same calendar day
      12 months before the assessment day): two or more take 1.50; exactly one takes 1.25; none takes 1.00.
      The first-period multiplier reads the whole calendar months from the coverage start date to the
      assessment day together with the emergency dispatch charges ever assessed on the coverage: fewer than
      12 months with no earlier dispatch charge takes 0.50; 12 to 23 months with no earlier dispatch charge
      takes 0.75; any other coverage takes 1.00.
      The active-buyer multiplier reads the homeowner's other Calloway contracts: a homeowner with a
      purchase agreement under construction or with a closing scheduled takes 0.50; a homeowner with no
      such agreement but with a homesite reservation on hold and with a reservation deposit received on the
      homeowner's homesite ledger within the last 12 calendar months (dated later than the same calendar day
      12 months before the assessment day) takes 0.75; any other homeowner takes 1.00.
      The scheduled dispatch charge is the program's emergency dispatch fee multiplied by the
      condition-class multiplier, the finding multiplier, the non-warranty visit multiplier, the
      first-period multiplier and the active-buyer multiplier, each multiplier applied to that same fee.
      How the dispatch charge is taken from the scheduled dispatch charge follows the technician's response
      hours against the program's emergency response hours: a response of more than twice the program's
      emergency response hours carries no dispatch charge; a response longer than the program's emergency
      response hours but not more than twice them carries the scheduled dispatch charge prorated by the
      program's emergency response hours divided by the response hours; a response within the program's
      emergency response hours carries the whole scheduled dispatch charge.
      The dispatch charge is rounded to the nearest cent once, at the end.
    prerequisite:
      - problem: warranty_ext_reinspection_charge
        kind: value_input
        gate: nonwarranty_mult
        form: state
        policy_source: >-
          The dispatch charge is fixed only after every re-reported item that a re-measurement again found
          within tolerance and that the reinspection rules make chargeable carries its reinspection charge.
        condition: >-
          Every within-tolerance inspection on the coverage that the reinspection rules make chargeable
          (counted as the re-measurement of a re-reported item by the claim-item and denial counts, and no
          walkthrough held on its date) is matched by a warranty_charge_assessed row of charge_type
          reinspection_fee on that inspection's claim item; an inspection the rules leave uncharged needs no
          such row.
        resolved_by: assess_reinspection_charge_a99ab20e
        effect: >-
          Booking the reinspection charge adds one reinspection charge dated the assessment day to the
          coverage, so the count read by the non-warranty visit multiplier (nonwarranty_mult) rises by one and
          can move the multiplier to the next tier.
    cross_category:
      - category: purchase
        as: existence
        reads: [status]
        note: The active-buyer multiplier's top tier is decided from whether the homeowner holds another purchase agreement under construction or with a closing scheduled.
      - category: homesite
        as: history
        reads: [status, homesite_events.deposit_component]
        note: The active-buyer multiplier's middle tier is decided from whether the homeowner holds a homesite reservation on hold and whether a reservation deposit was received on the homeowner's homesite ledger within the last 12 calendar months.
    compute:
      - dispatch_item: "LATEST('warranty_events', 'claim_item_ref', event_type='warranty_emergency_dispatched')"
      - response_hours: "LATEST('warranty_events', 'response_hours', event_type='warranty_emergency_dispatched')"
      - condition: "LATEST('warranty_events', 'emergency_type', event_type='warranty_claim_filed', claim_item_ref=dispatch_item)"
      - condition_mult: "K('safety_mult') if (condition == 'gas_leak' or condition == 'total_electrical_loss') else (K('comfort_mult') if (condition == 'no_heat' or condition == 'no_cooling') else 1.0)"
      - finding: "LATEST('warranty_events', 'inspection_finding', event_type='warranty_claim_inspected', claim_item_ref=dispatch_item)"
      - finding_mult: "K('not_reproduced_mult') if finding == 'not_reproduced' else (K('maintenance_mult') if finding == 'maintenance_item' else 1.0)"
      - nonwarranty_visits: "COUNT('warranty_events', within_months=K('visit_window_months'), event_type='warranty_charge_assessed', charge_type='reinspection_fee') + COUNT('warranty_events', within_months=K('visit_window_months'), event_type='warranty_charge_assessed', charge_type='emergency_dispatch_fee')"
      - nonwarranty_mult: "K('visits_two_mult') if nonwarranty_visits >= 2 else (K('visits_one_mult') if nonwarranty_visits == 1 else 1.0)"
      - coverage_months: "MONTHS(F('coverage_start_date'), NOW)"
      - prior_dispatch_charges: "COUNT('warranty_events', event_type='warranty_charge_assessed', charge_type='emergency_dispatch_fee')"
      - first_period_mult: "K('first_year_mult') if (coverage_months < K('first_year_months') and prior_dispatch_charges == 0) else (K('second_year_mult') if (coverage_months >= K('first_year_months') and coverage_months < K('second_year_months') and prior_dispatch_charges == 0) else 1.0)"
      - another_build: "EXISTS('purchase', status='under_construction') or EXISTS('purchase', status='closing_scheduled')"
      - homesite_hold: "EXISTS('homesite', status='held')"
      - hold_deposits: "XCOUNT('homesite', 'homesite_events', event_type='homesite_payment_received', deposit_component='reservation_deposit', within_months=K('deposit_window_months'))"
      - buyer_mult: "K('building_buyer_mult') if another_build else (K('holding_buyer_mult') if ((not another_build) and homesite_hold and hold_deposits >= 1) else 1.0)"
      - scheduled_fee: "P('emergency_dispatch_fee_usd') * condition_mult * finding_mult * nonwarranty_mult * first_period_mult * buyer_mult"
      - prorated_fee: "0.0 if response_hours > 2 * P('emergency_response_hours') else (scheduled_fee * P('emergency_response_hours') / response_hours if response_hours > P('emergency_response_hours') else scheduled_fee)"
      - charge_due: "0.0 if finding == 'defect_confirmed' else prorated_fee"
      - result: "RND(charge_due, 2)"
    compute_basis:
      dispatch_item: "A dispatch charge is worked out for the most recent emergency dispatch recorded on the coverage, on the day it is assessed, and it is linked to that dispatch's claim item"
      response_hours: "How the dispatch charge is taken from the scheduled dispatch charge follows the technician's response hours against the program's emergency response hours"
      condition: "The condition-class multiplier follows the emergency condition reported on the dispatched item"
      condition_mult: "a gas leak or a total electrical loss, which are safety calls, takes 0.50; no heat or no cooling, which are comfort calls, takes 0.80; any other emergency condition takes 1.00."
      finding: "The finding multiplier follows the inspection finding on the dispatched item"
      finding_mult: "a condition the technician could not reproduce takes 0.50; a homeowner maintenance item takes 0.75; any other finding (homeowner damage, a homeowner alteration or a condition not covered) takes 1.00."
      nonwarranty_visits: "The non-warranty visit multiplier counts the reinspection charges and the emergency dispatch charges assessed on the coverage within the last 12 calendar months (dated later than the same calendar day 12 months before the assessment day)"
      nonwarranty_mult: "two or more take 1.50; exactly one takes 1.25; none takes 1.00."
      coverage_months: "The first-period multiplier reads the whole calendar months from the coverage start date to the assessment day together with the emergency dispatch charges ever assessed on the coverage"
      prior_dispatch_charges: "The first-period multiplier reads the whole calendar months from the coverage start date to the assessment day together with the emergency dispatch charges ever assessed on the coverage"
      first_period_mult: "fewer than 12 months with no earlier dispatch charge takes 0.50; 12 to 23 months with no earlier dispatch charge takes 0.75; any other coverage takes 1.00."
      another_build: "a homeowner with a purchase agreement under construction or with a closing scheduled takes 0.50"
      homesite_hold: "a homeowner with no such agreement but with a homesite reservation on hold and with a reservation deposit received on the homeowner's homesite ledger within the last 12 calendar months (dated later than the same calendar day 12 months before the assessment day) takes 0.75"
      hold_deposits: "with a reservation deposit received on the homeowner's homesite ledger within the last 12 calendar months (dated later than the same calendar day 12 months before the assessment day)"
      buyer_mult: "a homeowner with a purchase agreement under construction or with a closing scheduled takes 0.50; a homeowner with no such agreement but with a homesite reservation on hold and with a reservation deposit received on the homeowner's homesite ledger within the last 12 calendar months (dated later than the same calendar day 12 months before the assessment day) takes 0.75; any other homeowner takes 1.00."
      scheduled_fee: "The scheduled dispatch charge is the program's emergency dispatch fee multiplied by the condition-class multiplier, the finding multiplier, the non-warranty visit multiplier, the first-period multiplier and the active-buyer multiplier, each multiplier applied to that same fee."
      prorated_fee: "a response of more than twice the program's emergency response hours carries no dispatch charge; a response longer than the program's emergency response hours but not more than twice them carries the scheduled dispatch charge prorated by the program's emergency response hours divided by the response hours; a response within the program's emergency response hours carries the whole scheduled dispatch charge."
      charge_due: "a dispatch whose claim item the inspection confirmed as a covered defect carries no dispatch charge."
      result: "The dispatch charge is rounded to the nearest cent once, at the end."
    factors:
      - id: condition_class_multiplier
        effect: parameter
        decides: condition_mult
        bindings: [condition, condition_mult]
        ladder:
          - when: "the dispatched item reported a gas leak or a total electrical loss"
            value: "K('safety_mult') = 0.50"
          - when: "the dispatched item reported no heat or no cooling"
            value: "K('comfort_mult') = 0.80"
          - when: "otherwise"
            value: "1.00"
        baseline:
          condition_mult: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: finding_multiplier
        effect: parameter
        decides: finding_mult
        bindings: [finding, finding_mult]
        ladder:
          - when: "the inspection of the dispatched item found a condition that could not be reproduced"
            value: "K('not_reproduced_mult') = 0.50"
          - when: "the inspection found a homeowner maintenance item"
            value: "K('maintenance_mult') = 0.75"
          - when: "otherwise"
            value: "1.00"
        baseline:
          finding_mult: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: nonwarranty_visit_multiplier
        effect: parameter
        decides: nonwarranty_mult
        bindings: [nonwarranty_visits, nonwarranty_mult]
        ladder:
          - when: "two or more reinspection or emergency dispatch charges were assessed on the coverage within the last 12 calendar months"
            value: "K('visits_two_mult') = 1.50"
          - when: "exactly one such charge was assessed within the last 12 calendar months"
            value: "K('visits_one_mult') = 1.25"
          - when: "otherwise"
            value: "1.00"
        baseline:
          nonwarranty_mult: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: first_period_multiplier
        effect: parameter
        decides: first_period_mult
        bindings: [coverage_months, prior_dispatch_charges, first_period_mult]
        ladder:
          - when: "fewer than 12 whole calendar months since the coverage start date and no emergency dispatch charge ever assessed on the coverage"
            value: "K('first_year_mult') = 0.50"
          - when: "12 to 23 whole calendar months since the coverage start date and no emergency dispatch charge ever assessed on the coverage"
            value: "K('second_year_mult') = 0.75"
          - when: "otherwise"
            value: "1.00"
        baseline:
          first_period_mult: "1.0"
        evidence: [date, history]
        cross_difficulty: null
      - id: active_buyer_multiplier
        effect: parameter
        decides: buyer_mult
        bindings: [another_build, homesite_hold, hold_deposits, buyer_mult]
        ladder:
          - when: "the homeowner holds a purchase agreement under construction or with a closing scheduled"
            value: "K('building_buyer_mult') = 0.50"
          - when: "the homeowner holds no such agreement but holds a homesite reservation on hold and has a reservation deposit received on the homesite ledger within the last 12 calendar months"
            value: "K('holding_buyer_mult') = 0.75"
          - when: "otherwise"
            value: "1.00"
        baseline:
          buyer_mult: "1.0"
        evidence: [cross_category]
        cross_difficulty: homesite
      - id: response_proration_method
        effect: method
        decides: prorated_fee
        bindings: [response_hours, prorated_fee]
        ladder:
          - when: "the technician's response hours exceed twice the program's emergency response hours"
            method: "no dispatch charge is made"
          - when: "the response hours exceed the program's emergency response hours but not twice them"
            method: "the scheduled dispatch charge is prorated by the program's emergency response hours divided by the response hours"
          - when: "otherwise"
            method: "the whole scheduled dispatch charge is made"
        baseline:
          prorated_fee: "scheduled_fee"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard dispatch charge is the program's emergency dispatch fee, rounded to the nearest cent.
      params: [emergency_dispatch_fee_usd]
    inputs:
      history:
        - {table: warranty_events, aggregate: latest, field: response_hours, filters: {event_type: warranty_emergency_dispatched}}
        - {table: warranty_events, aggregate: latest, field: emergency_type, filters: {event_type: warranty_claim_filed}}
        - {table: warranty_events, aggregate: latest, field: inspection_finding, filters: {event_type: warranty_claim_inspected}}
        - {table: warranty_events, aggregate: count, field: event_date, within_months: 12, filters: {event_type: warranty_charge_assessed, charge_type: reinspection_fee}}
        - {table: warranty_events, aggregate: count, field: event_date, within_months: 12, filters: {event_type: warranty_charge_assessed, charge_type: emergency_dispatch_fee}}
        - {table: warranty_events, aggregate: count, field: event_date, filters: {event_type: warranty_charge_assessed, charge_type: emergency_dispatch_fee}}
        - {category: homesite, table: homesite_events, aggregate: count, field: amount, within_months: 12, filters: {event_type: homesite_payment_received, deposit_component: reservation_deposit}}
      cross_category: [purchase, homesite]

  - id: warranty_ext_systems_item_settlement
    base_policy_refs: [warranty_structural_claims, warranty_payouts_and_payments, warranty_coverage_periods, warranty_callbacks]
    overwrite: []
    trigger: on_request
    subject: [warranty_payout_approved]
    computes: amount
    target_tool: accept_systems_item_cash_settlement_9ecd6f20
    params:
      standard_systems_share: 0.4
      hvac_trade_mult: 1.25
      plumbing_trade_mult: 1.15
      west_market_mult: 1.3
      heat_market_mult: 1.15
      long_remaining_days: 730
      mid_remaining_days: 365
      long_remaining_mult: 1.2
      mid_remaining_mult: 1.1
      maintenance_window_months: 24
      two_findings_mult: 0.8
      one_finding_mult: 0.9
      large_home_price: 700000
      mid_home_price: 500000
      large_home_mult: 1.2
      mid_home_mult: 1.1
      callback_window_months: 12
    rule: >-
      A systems-item cash settlement is offered on the claim item of the most recent systems approval
      recorded on the coverage, whether that approval is the item's original approval or an accepted
      callback, and it becomes a payout only when the homeowner accepts it in writing.
      A systems settlement is not offered to the homeowner, and no cash-in-lieu payout is approved on it,
      until every emergency dispatch recorded on the coverage that the dispatch charge rules make
      chargeable carries its emergency dispatch charge.
      The standard systems settlement is the program's cash-in-lieu maximum multiplied by the standard
      systems share of 0.40, rounded to the nearest cent.
      The systems trade multiplier follows the defect category of the item under settlement: an hvac item
      takes 1.25; a plumbing item takes 1.15; any other systems item takes 1.00.
      The systems market multiplier follows the community named on the home's purchase agreement: Sierra
      Vista Ranch takes 1.30; Mesquite Trails or Harbor Pines takes 1.15; any other community takes 1.00.
      The remaining-coverage multiplier counts the calendar days from the settlement date to the systems
      end date of the coverage, the settlement date itself not counted: 730 days or more take 1.20; 365 to 729 days take 1.10; fewer than 365 days take
      1.00.
      The maintenance-record multiplier counts the inspections on the coverage within the last 24 calendar
      months (dated later than the same calendar day 24 months before the settlement date) that found a
      homeowner maintenance item, homeowner damage or a homeowner alteration: two or more take 0.80; exactly
      one takes 0.90; none takes 1.00.
      The home-scale multiplier follows the contract price on the home's purchase agreement: 700,000
      dollars or more takes 1.20; 500,000 dollars or more but under 700,000 dollars takes 1.10; under
      500,000 dollars takes 1.00.
      The scheduled systems settlement is the program's cash-in-lieu maximum multiplied by the standard
      systems share, the systems trade multiplier, the systems market multiplier, the remaining-coverage
      multiplier, the maintenance-record multiplier and the home-scale multiplier, each of them applied to
      that same maximum, and the product is rounded to the nearest cent.
      How the systems settlement is taken from the scheduled systems settlement follows the accepted
      callbacks approved on the coverage under systems coverage within the last 12 calendar months (dated
      later than the same calendar day 12 months before the settlement date), which are the systems
      approvals of that window that are not original approvals: with two or more such callbacks the
      systems settlement is the program's cash-in-lieu maximum itself, because the system has failed
      repeatedly; with exactly one such callback it is the scheduled systems settlement plus half of the
      difference between the program's cash-in-lieu maximum and the scheduled systems settlement, rounded
      to the nearest cent; with no such callback it is the scheduled systems settlement.
      The systems settlement never exceeds the program's cash-in-lieu maximum, compared after the callback
      step.
    prerequisite:
      - problem: warranty_ext_dispatch_charge
        kind: state_gate
        gate: warranty_events.charge_type
        form: state
        policy_source: >-
          A systems settlement is not offered to the homeowner, and no cash-in-lieu payout is approved on it,
          until every emergency dispatch recorded on the coverage that the dispatch charge rules make
          chargeable carries its emergency dispatch charge.
        condition: >-
          Every warranty_emergency_dispatched row on the coverage whose claim item was not confirmed as a
          covered defect and whose dispatch charge under the dispatch charge rules is above zero is matched
          by a warranty_charge_assessed row of charge_type emergency_dispatch_fee on that claim item.
        resolved_by: assess_emergency_dispatch_charge_91903470
        effect: >-
          Booking the dispatch charge places an emergency_dispatch_fee row on the dispatched claim item, so
          the coverage's chargeable dispatches all carry their charge and the systems settlement may be
          offered and its cash-in-lieu payout approved.
    cross_category:
      - category: purchase
        as: branch
        reads: [community, contract_price]
        note: The systems market multiplier is decided from the community and the home-scale multiplier from the contract price on the home's purchase agreement.
    compute:
      - sys_item: "LATEST('warranty_events', 'claim_item_ref', event_type='warranty_claim_approved', coverage_basis='systems')"
      - sys_category: "LATEST('warranty_events', 'defect_category', event_type='warranty_claim_filed', claim_item_ref=sys_item)"
      - trade_mult: "K('hvac_trade_mult') if sys_category == 'hvac' else (K('plumbing_trade_mult') if sys_category == 'plumbing' else 1.0)"
      - community: "CFIELD('purchase', 'community', purchase_id=F('purchase_id'))"
      - market_mult: "K('west_market_mult') if community == 'Sierra Vista Ranch' else (K('heat_market_mult') if (community == 'Mesquite Trails' or community == 'Harbor Pines') else 1.0)"
      - remaining_days: "DAYS(NOW, F('systems_end_date'))"
      - remaining_mult: "K('long_remaining_mult') if remaining_days >= K('long_remaining_days') else (K('mid_remaining_mult') if remaining_days >= K('mid_remaining_days') else 1.0)"
      - maintenance_findings: "COUNT('warranty_events', within_months=K('maintenance_window_months'), event_type='warranty_claim_inspected', inspection_finding='maintenance_item') + COUNT('warranty_events', within_months=K('maintenance_window_months'), event_type='warranty_claim_inspected', inspection_finding='homeowner_damage') + COUNT('warranty_events', within_months=K('maintenance_window_months'), event_type='warranty_claim_inspected', inspection_finding='homeowner_alteration')"
      - maintenance_mult: "K('two_findings_mult') if maintenance_findings >= 2 else (K('one_finding_mult') if maintenance_findings == 1 else 1.0)"
      - contract_price: "CFIELD('purchase', 'contract_price', purchase_id=F('purchase_id'))"
      - scale_mult: "K('large_home_mult') if contract_price >= K('large_home_price') else (K('mid_home_mult') if contract_price >= K('mid_home_price') else 1.0)"
      - scheduled: "RND(P('cash_in_lieu_max_usd') * K('standard_systems_share') * trade_mult * market_mult * remaining_mult * maintenance_mult * scale_mult, 2)"
      - systems_callbacks: "COUNT('warranty_events', within_months=K('callback_window_months'), event_type='warranty_claim_approved', coverage_basis='systems') - COUNT('warranty_events', within_months=K('callback_window_months'), event_type='warranty_claim_approved', coverage_basis='systems', callback_seq=0)"
      - settlement: "P('cash_in_lieu_max_usd') if systems_callbacks >= 2 else (RND(scheduled + (P('cash_in_lieu_max_usd') - scheduled) / 2, 2) if systems_callbacks == 1 else scheduled)"
      - result: "MN(settlement, P('cash_in_lieu_max_usd'))"
    compute_basis:
      sys_item: "A systems-item cash settlement is offered on the claim item of the most recent systems approval recorded on the coverage, whether that approval is the item's original approval or an accepted callback, and it becomes a payout only when the homeowner accepts it in writing."
      sys_category: "The systems trade multiplier follows the defect category of the item under settlement"
      trade_mult: "an hvac item takes 1.25; a plumbing item takes 1.15; any other systems item takes 1.00."
      community: "The systems market multiplier follows the community named on the home's purchase agreement"
      market_mult: "Sierra Vista Ranch takes 1.30; Mesquite Trails or Harbor Pines takes 1.15; any other community takes 1.00."
      remaining_days: "The remaining-coverage multiplier counts the calendar days from the settlement date to the systems end date of the coverage, the settlement date itself not counted"
      remaining_mult: "730 days or more take 1.20; 365 to 729 days take 1.10; fewer than 365 days take 1.00."
      maintenance_findings: "The maintenance-record multiplier counts the inspections on the coverage within the last 24 calendar months (dated later than the same calendar day 24 months before the settlement date) that found a homeowner maintenance item, homeowner damage or a homeowner alteration"
      maintenance_mult: "two or more take 0.80; exactly one takes 0.90; none takes 1.00."
      contract_price: "The home-scale multiplier follows the contract price on the home's purchase agreement"
      scale_mult: "700,000 dollars or more takes 1.20; 500,000 dollars or more but under 700,000 dollars takes 1.10; under 500,000 dollars takes 1.00."
      scheduled: "The scheduled systems settlement is the program's cash-in-lieu maximum multiplied by the standard systems share, the systems trade multiplier, the systems market multiplier, the remaining-coverage multiplier, the maintenance-record multiplier and the home-scale multiplier, each of them applied to that same maximum, and the product is rounded to the nearest cent."
      systems_callbacks: "How the systems settlement is taken from the scheduled systems settlement follows the accepted callbacks approved on the coverage under systems coverage within the last 12 calendar months (dated later than the same calendar day 12 months before the settlement date), which are the systems approvals of that window that are not original approvals"
      settlement: "with two or more such callbacks the systems settlement is the program's cash-in-lieu maximum itself, because the system has failed repeatedly; with exactly one such callback it is the scheduled systems settlement plus half of the difference between the program's cash-in-lieu maximum and the scheduled systems settlement, rounded to the nearest cent; with no such callback it is the scheduled systems settlement."
      result: "The systems settlement never exceeds the program's cash-in-lieu maximum, compared after the callback step."
    factors:
      - id: systems_trade_multiplier
        effect: parameter
        decides: trade_mult
        bindings: [sys_item, sys_category, trade_mult]
        ladder:
          - when: "the item under settlement is an hvac item"
            value: "K('hvac_trade_mult') = 1.25"
          - when: "the item under settlement is a plumbing item"
            value: "K('plumbing_trade_mult') = 1.15"
          - when: "otherwise"
            value: "1.00"
        baseline:
          trade_mult: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: systems_market_multiplier
        effect: parameter
        decides: market_mult
        bindings: [community, market_mult]
        ladder:
          - when: "the home's purchase agreement names Sierra Vista Ranch"
            value: "K('west_market_mult') = 1.30"
          - when: "the home's purchase agreement names Mesquite Trails or Harbor Pines"
            value: "K('heat_market_mult') = 1.15"
          - when: "otherwise"
            value: "1.00"
        baseline:
          market_mult: "1.0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: repeat_failure_settlement_method
        effect: method
        decides: settlement
        bindings: [systems_callbacks, settlement]
        ladder:
          - when: "two or more accepted callbacks were approved on the coverage under systems coverage within the last 12 calendar months"
            method: "the systems settlement is the program's cash-in-lieu maximum itself"
          - when: "exactly one such accepted callback"
            method: "the systems settlement is the scheduled systems settlement plus half of the gap between the cash-in-lieu maximum and the scheduled systems settlement, rounded to the cent"
          - when: "otherwise"
            method: "the systems settlement is the scheduled systems settlement"
        baseline:
          settlement: "scheduled"
        evidence: [history]
        cross_difficulty: null
      - id: remaining_coverage_multiplier
        effect: parameter
        decides: remaining_mult
        bindings: [remaining_days, remaining_mult]
        ladder:
          - when: "730 or more calendar days of systems coverage remain from the settlement date"
            value: "K('long_remaining_mult') = 1.20"
          - when: "365 to 729 calendar days remain"
            value: "K('mid_remaining_mult') = 1.10"
          - when: "otherwise"
            value: "1.00"
        baseline:
          remaining_mult: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: maintenance_record_multiplier
        effect: parameter
        decides: maintenance_mult
        bindings: [maintenance_findings, maintenance_mult]
        ladder:
          - when: "two or more inspections of the last 24 calendar months found a homeowner maintenance item, homeowner damage or a homeowner alteration"
            value: "K('two_findings_mult') = 0.80"
          - when: "exactly one such inspection"
            value: "K('one_finding_mult') = 0.90"
          - when: "otherwise"
            value: "1.00"
        baseline:
          maintenance_mult: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: home_scale_multiplier
        effect: parameter
        decides: scale_mult
        bindings: [contract_price, scale_mult]
        ladder:
          - when: "the contract price on the home's purchase agreement is 700,000 dollars or more"
            value: "K('large_home_mult') = 1.20"
          - when: "the contract price is at least 500,000 but under 700,000 dollars"
            value: "K('mid_home_mult') = 1.10"
          - when: "otherwise"
            value: "1.00"
        baseline:
          scale_mult: "1.0"
        evidence: [cross_category]
        cross_difficulty: purchase
    baseline:
      rule: >-
        The standard systems settlement is the program's cash-in-lieu maximum multiplied by the standard
        systems share of 0.40, rounded to the nearest cent.
      params: [cash_in_lieu_max_usd, standard_systems_share]
    inputs:
      history:
        - {table: warranty_events, aggregate: latest, field: event_date, filters: {event_type: warranty_claim_approved, coverage_basis: systems}}
        - {table: warranty_events, aggregate: latest, field: defect_category, filters: {event_type: warranty_claim_filed}}
        - {table: warranty_events, aggregate: count, field: event_date, within_months: 24, filters: {event_type: warranty_claim_inspected}}
        - {table: warranty_events, aggregate: count, field: event_date, within_months: 12, filters: {event_type: warranty_claim_approved, coverage_basis: systems}}
      cross_category: [purchase]
