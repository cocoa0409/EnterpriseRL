# Calloway Limited Home Warranty charter — Calloway Homes.
# Every home Calloway closes is enrolled in a HomeCare limited warranty program set by the home's
# collection. The program defines how long each coverage period runs from the original closing
# date (workmanship, systems, structural, roof leak and item periods), the service levels, the
# scheduled walkthroughs and the homeowner charges. Claims are filed item by item; each item is
# inspected and approved or denied against the coverage period of its defect category.

category: warranty
display_name: Calloway Limited Home Warranty

binding:
  holding_table: warranty_coverages
  event_tables: [warranty_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {charges_due: homeowner_charges, payouts_owed: homeowner_payouts}

lifecycle:
  states: [active, transferred, expired]
  transitions:
    - {from: active, to: transferred, by: system, means: "A subsequent owner of the home registers for the remaining coverage, which ends this owner's coverage."}
    - {from: active, to: expired, by: system, means: "The structural coverage period ended, so every coverage period on the home has ended."}

accounts:
  - key: homeowner_charges
    unit: USD
    meaning: Warranty charges the homeowner owes (structural deductible, missed appointment, reinspection, transfer and emergency dispatch fees) not yet paid or waived.
  - key: homeowner_payouts
    unit: USD
    meaning: Money Calloway has approved to pay the homeowner on a claim (cash in lieu of repair, relocation reimbursement) and has not yet paid.

parameter_schema:
  eligible_collection: Purchase collection whose homes are enrolled in this program at closing.
  workmanship_months: Calendar months of workmanship coverage from the coverage start date.
  systems_months: Calendar months of plumbing, electrical and HVAC distribution systems coverage from the coverage start date.
  structural_months: Calendar months of structural coverage (load-bearing elements) from the coverage start date.
  roof_leak_months: Calendar months of roof leak coverage from the coverage start date.
  window_seal_failure_months: Calendar months of coverage for insulated glass seal failure from the coverage start date.
  grading_drainage_months: Calendar months of yard grading and drainage coverage from the coverage start date.
  appliance_builder_coverage_months: Calendar months during which Calloway handles appliance defects directly; afterwards they go to the manufacturer.
  termite_pretreat_months: Calendar months of termite pre-treatment coverage from the coverage start date.
  landscaping_coverage_days: Calendar days of coverage for sod, trees and shrubs installed by Calloway from the coverage start date.
  cosmetic_report_window_days: Calendar days after the coverage start date within which a cosmetic surface item not on the orientation list may still be reported (0 = orientation list only).
  late_report_grace_days: Calendar days after the end of a coverage period within which an item first noticed before the end may still be reported in writing.
  written_report_required: Whether non-emergency items must be reported in writing (portal or email); phone is accepted for emergencies only.
  concrete_crack_width_tolerance_in: Width in inches below which a crack in flatwork concrete is within tolerance.
  concrete_displacement_tolerance_in: Vertical displacement in inches below which a flatwork crack is within tolerance.
  slab_crack_width_tolerance_in: Width in inches below which a crack in the foundation slab is within tolerance.
  masonry_crack_tolerance_in: Width in inches below which a crack in brick or stone veneer is within tolerance.
  drywall_crack_tolerance_in: Width in inches below which a drywall crack is within tolerance.
  drywall_nail_pop_repairs: Number of one-time drywall nail pop repair visits included (performed with the eleven-month walkthrough).
  caulk_grout_touchup_repairs: Number of one-time caulk and grout touch-up visits included.
  sixty_day_walkthrough_included: Whether a sixty-day walkthrough is included.
  sixty_day_window_opens_days: Calendar days after the coverage start date at which the sixty-day walkthrough may first be held.
  eleven_month_walkthrough_included: Whether an eleven-month walkthrough is included.
  eleven_month_window_opens_days: Calendar days after the coverage start date at which the eleven-month walkthrough may first be requested.
  twenty_three_month_walkthrough_included: Whether a twenty-three-month walkthrough is included.
  twenty_three_month_window_opens_days: Calendar days after the coverage start date at which the twenty-three-month walkthrough may first be requested.
  hvac_seasonal_check_included: Whether one first-year HVAC seasonal check visit is included.
  orientation_punch_list_days: Calendar days after the coverage start date within which items on the orientation list are completed.
  emergency_categories: Conditions treated as emergencies for this program.
  emergency_response_hours: Hours from an emergency report within which a technician is dispatched.
  emergency_dispatch_fee_usd: Fee (USD) when an emergency dispatch finds a condition caused by the homeowner or not covered.
  inspection_scheduling_business_days: Business days from a non-emergency report within which the inspection is held.
  repair_target_days: Calendar days from approval within which an approved repair is completed.
  access_response_days: Calendar days the homeowner has to provide access after Calloway asks to schedule; with no access the item is closed.
  missed_appointment_fee_usd: Fee (USD) for each missed appointment beyond the free missed appointments.
  free_missed_appointments: Number of missed appointments over the life of the coverage that carry no fee.
  reinspection_fee_usd: Fee (USD) when an item already denied as within tolerance is re-reported and again found within tolerance.
  structural_deductible_usd: Deductible (USD) per approved structural claim item.
  structural_engineer_review_included: Whether a disputed structural finding is reviewed by an independent structural engineer at Calloway's cost.
  hotel_reimbursement_per_night_usd: Nightly relocation reimbursement (USD) while the home is uninhabitable during a covered structural or systems repair.
  max_reimbursement_nights: Maximum nights of relocation reimbursement per claim item.
  reimbursement_cap_usd: Cap (USD) on relocation reimbursement per claim item.
  cash_in_lieu_max_usd: Largest cash settlement (USD) Calloway may offer instead of repairing a covered non-structural item.
  callback_days: Calendar days after a repair is completed within which a recurrence of the same item is reopened on the original claim.
  transfer_allowed: Whether the remaining coverage transfers to a subsequent owner.
  transfer_fee_usd: Fee (USD) a subsequent owner pays to register the remaining coverage.
  transfer_registration_days: Calendar days after the subsequent owner's deed date within which they must register.
  transfer_resets_coverage: Whether a transfer restarts any coverage period.
  payout_issue_business_days: Business days after approval within which an approved payout is paid.

