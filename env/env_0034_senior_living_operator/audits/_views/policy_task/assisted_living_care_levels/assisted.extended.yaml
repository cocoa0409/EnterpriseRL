events:
  # ---- holding writes (assisted_residencies) ----
  - type: assisted_admission_create
    target: assisted_residencies
    mutation: create
    meaning: An admission agreement is signed for an assisted living apartment after the pre-admission nurse assessment, opening the residency in pending_admission status at the care level that assessment indicates.
    grain: One row per admission agreement.
    fields:
      assisted_residency_id: Reference number of the new residency.
      customer_id: The resident admitted.
      variant_name: Care level indicated by the pre-admission assessment, verbatim tier name.
      community_name: Larkspur community of the apartment.
      apartment_type: AL Studio, AL One-Bedroom or AL Companion Suite.
      apartment_number: Apartment number on the admission agreement.
      admission_source: Where the resident is coming from.
      admission_date: Date the admission agreement was signed and the pre-admission assessment recorded.
      planned_move_in_date: Planned move-in date.
      care_points: Care-point score of the pre-admission assessment.
      monthly_base_rent: Contracted monthly rent for the apartment.
      ltc_direct_billing: Whether a long-term care insurer is billed directly under an assignment of benefits.
    triggers:
      - event: assisted:assisted_assessment_record
        map: {assisted_residency_id: assisted_residency_id, customer_id: customer_id, assessment_type: pre_admission, care_points: care_points}
  - type: assisted_move_in
    target: assisted_residencies
    mutation: {transition: {from: pending_admission, to: active}}
    meaning: The resident moves into the assisted living apartment.
    grain: One row per residency.
    fields:
      assisted_residency_id: The residency moved into.
      move_in_date: Date of move-in; rent and care fees accrue from this date.
      level_effective_date: Set to the move-in date - the admitted care level applies from move-in.
      rent_effective_date: Set to the move-in date.
      admission_source: Admission source confirmed at move-in.
    triggers:
      - event: assisted:assisted_rent_charge
        map: {assisted_residency_id: assisted_residency_id, charge_basis: prorated_move_in}
      - event: assisted:assisted_care_fee_charge
        map: {assisted_residency_id: assisted_residency_id, charge_basis: prorated_move_in}
      - event: assisted:assisted_community_fee_charge
        when: {admission_source: {not: larkspur_independent}}
        map: {assisted_residency_id: assisted_residency_id}
  - type: assisted_admission_withdraw
    target: assisted_residencies
    mutation: {transition: {from: pending_admission, to: cancelled}}
    meaning: The admission is withdrawn before move-in.
    grain: One row per residency.
    fields:
      assisted_residency_id: The admission withdrawn.
      termination_reason: Fixed to admission_withdrawn.
      closed_date: Date the withdrawal was signed.
    triggers: []
  - type: assisted_leave_start
    target: assisted_residencies
    mutation: {transition: {from: active, to: on_leave}}
    meaning: A temporary absence from the community begins.
    grain: One row per absence.
    fields:
      assisted_residency_id: The residency.
      absence_start_date: Date the resident left the community (first midnight away is that night).
      absence_reason: hospital, rehab_facility or family_visit.
      absence_return_date: Cleared to empty at the start of a new absence.
    triggers: []
  - type: assisted_leave_return
    target: assisted_residencies
    mutation: {transition: {from: on_leave, to: active}}
    meaning: The resident returns from a recorded absence.
    grain: One row per absence.
    fields:
      assisted_residency_id: The residency.
      absence_return_date: Date the resident returned to the apartment.
    triggers: []
  - type: assisted_notice_record
    target: assisted_residencies
    mutation: {transition: {from: active, to: notice_given}}
    meaning: The signed written notice of termination is recorded.
    grain: One row per notice.
    fields:
      assisted_residency_id: The residency.
      notice_date: Date the notice was signed.
      intended_vacate_date: Intended vacate date stated on the notice.
      termination_reason: resident_notice.
    triggers: []
  - type: assisted_notice_withdraw
    target: assisted_residencies
    mutation: {transition: {from: notice_given, to: active}}
    meaning: A notice of termination is withdrawn.
    grain: One row per withdrawal.
    fields:
      assisted_residency_id: The residency.
      notice_date: Cleared to empty.
      intended_vacate_date: Cleared to empty.
      termination_reason: Reset to none.
    triggers: []
  - type: assisted_vacate
    target: assisted_residencies
    mutation: {transition: {from: notice_given, to: vacated}}
    meaning: The apartment is surrendered after notice.
    grain: One row per residency.
    fields:
      assisted_residency_id: The residency.
      vacate_date: Date the apartment was surrendered and belongings removed.
    triggers: []
  - type: assisted_end_without_notice
    target: assisted_residencies
    mutation: {transition: [{from: active, to: vacated}, {from: on_leave, to: vacated}]}
    meaning: The residency ends without a resident notice - death, a transfer into Larkspur memory care, or a discharge for nonpayment or because needs exceed assisted living.
    grain: One row per residency.
    fields:
      assisted_residency_id: The residency.
      vacate_date: Date the apartment was surrendered and belongings removed.
      notice_date: Date of the death notification, the transfer request or the discharge notice.
      termination_reason: death, transfer_memory, discharge_needs_exceed or nonpayment_discharge.
    triggers: []
  - type: assisted_account_close
    target: assisted_residencies
    mutation: {transition: {from: vacated, to: closed}}
    meaning: The final statement is settled and the file closed.
    grain: One row per residency.
    fields:
      assisted_residency_id: The residency.
      closed_date: Date closed.
    triggers: []
  - type: assisted_level_change
    target: assisted_residencies
    mutation: update
    meaning: The care level billed changes after a reassessment.
    grain: One row per level change.
    fields:
      assisted_residency_id: The residency.
      variant_name: New care level, verbatim tier name.
      care_points: Care-point score of the assessment behind the change.
      level_effective_date: Date the new care level takes effect for billing.
    triggers: []
  - type: assisted_apartment_change
    target: assisted_residencies
    mutation: update
    meaning: The resident moves, at their request, to another assisted living apartment in the same community.
    grain: One row per apartment change.
    fields:
      assisted_residency_id: The residency.
      apartment_type: New apartment type.
      apartment_number: New apartment number.
      monthly_base_rent: Rent of the new apartment.
      rent_effective_date: Date of possession of the new apartment.
    triggers:
      - event: assisted:assisted_addon_charge
        map: {assisted_residency_id: assisted_residency_id, addon_code: apartment_change}
  - type: assisted_rent_notice
    target: assisted_residencies
    mutation: update
    meaning: Written notice of an annual rent increase is mailed and the proposed rent recorded.
    grain: One row per increase notice.
    fields:
      assisted_residency_id: The residency.
      rent_notice_date: Date the notice was mailed.
      proposed_monthly_base_rent: Rent stated in the notice.
    triggers: []
  - type: assisted_rent_adjust
    target: assisted_residencies
    mutation: update
    meaning: The contracted monthly rent changes by an annual increase.
    grain: One row per rent change.
    fields:
      assisted_residency_id: The residency.
      monthly_base_rent: New contracted rent.
      rent_effective_date: Date the new rent takes effect.
    triggers: []
  # ---- assessment records (assisted_assessments) ----
  - type: assisted_assessment_record
    target: assisted_assessments
    meaning: A licensed nurse completes a care-point assessment of the resident.
    grain: One row per assessment performed.
    distinguish_by: [assessment_date, assessment_type]
    fields:
      assisted_residency_id: The residency assessed.
      customer_id: The resident assessed.
      assessment_date: Date the assessment was completed.
      assessment_type: pre_admission, post_move_in, routine, change_of_condition or post_hospital.
      care_points: Total care points scored.
      indicated_level: Care level whose point band contains the score, verbatim tier name.
      wander_risk: Whether the nurse identified wander or exit-seeking risk.
      level_change_indicated: Whether the indicated level differs from the level billed on the assessment date.
    triggers:
      - event: assisted:assisted_level_notice
        when: {level_change_indicated: true}
        map: {assisted_residency_id: assisted_residency_id, customer_id: customer_id, indicated_level: indicated_level}
  - type: assisted_level_notice
    target: assisted_assessments
    meaning: The written notice of a care level change, stating the new level and its effective date, is issued to the resident and their representative.
    grain: One row per level notice, tied to the assessment it follows.
    distinguish_by: [source_assessment_id]
    fields:
      assisted_residency_id: The residency.
      customer_id: The resident.
      notice_date: Date the written notice was issued.
      indicated_level: New care level stated in the notice.
      notice_effective_date: Effective date of the new level stated in the notice.
      source_assessment_id: The assessment the notice follows.
    triggers: []
  # ---- ledger writes (assisted_ledger) ----
  - type: assisted_rent_charge
    target: assisted_ledger
    meaning: Apartment rent is charged for a span of days in one billing month.
    grain: One row per residency per continuous billed span within a billing period.
    distinguish_by: [billing_period, service_from_date]
    fields:
      assisted_residency_id: The residency.
      customer_id: The resident.
      amount: Rent charged, positive, USD.
      posting_date: Date posted.
      billing_period: Calendar month billed, YYYY-MM.
      charge_basis: full_month, prorated_move_in, prorated_move_out or prorated_rate_change.
      service_from_date: First day covered.
      service_to_date: Last day covered.
      days_billed: Days covered, inclusive.
      days_in_period: Days in the calendar month.
    account: resident_balance
    direction: in
    triggers: []
  - type: assisted_care_fee_charge
    target: assisted_ledger
    meaning: The care level fee is charged for a span of days at one care level within one billing month.
    grain: One row per residency per care level billed per continuous span within a billing period.
    distinguish_by: [billing_period, care_level_billed, service_from_date]
    fields:
      assisted_residency_id: The residency.
      customer_id: The resident.
      amount: Care fee charged, positive, USD.
      posting_date: Date posted.
      billing_period: Calendar month billed, YYYY-MM.
      charge_basis: full_month, prorated_move_in, prorated_move_out or prorated_level_change.
      care_level_billed: Care level whose fee is charged, verbatim tier name.
      service_from_date: First day covered.
      service_to_date: Last day covered.
      days_billed: Days covered, inclusive.
      days_in_period: Days in the calendar month.
    account: resident_balance
    direction: in
    triggers: []
  - type: assisted_addon_charge
    target: assisted_ledger
    meaning: A care add-on or service fee is charged - medication management, extra medication passes, insulin, incontinence care, escorts, bath assists, trays, glucose monitoring, oxygen, guest meals, insurer billing administration, apartment change or a returned payment.
    grain: One row per add-on code per billing period per service date.
    distinguish_by: [addon_code, billing_period, service_date]
    fields:
      assisted_residency_id: The residency.
      customer_id: The resident.
      amount: Fee charged, positive, USD.
      posting_date: Date posted.
      addon_code: Which add-on or fee.
      billing_period: Calendar month the add-on relates to, YYYY-MM.
      service_date: Date of the service for per-use fees, or first day of the billing month for monthly add-ons.
      quantity: Units charged (passes, trays, assists, meals).
      source_entry_id: The returned payment entry for a returned_payment fee; empty otherwise.
    account: resident_balance
    direction: in
    triggers: []
  - type: assisted_community_fee_charge
    target: assisted_ledger
    meaning: The one-time community fee is charged at move-in.
    grain: One row per admission.
    distinguish_by: [posting_date]
    fields:
      assisted_residency_id: The residency.
      customer_id: The resident.
      amount: Community fee, positive, USD.
      posting_date: Date posted.
    account: resident_balance
    direction: in
    triggers: []
  - type: assisted_late_fee_charge
    target: assisted_ledger
    meaning: A late fee is assessed for a billing period left unpaid after the grace period.
    grain: One row per residency per billing period.
    distinguish_by: [billing_period]
    fields:
      assisted_residency_id: The residency.
      customer_id: The resident.
      amount: Late fee, positive, USD.
      posting_date: Date assessed.
      billing_period: Billing period past due, YYYY-MM.
    account: resident_balance
    direction: in
    triggers: []
  - type: assisted_payment
    target: assisted_ledger
    meaning: A payment is received from the resident, the family or a long-term care insurer.
    grain: One row per payment instrument.
    distinguish_by: [payment_reference]
    fields:
      assisted_residency_id: The residency.
      customer_id: The resident.
      amount: Payment, positive, USD.
      posting_date: Date received.
      payment_reference: Check number, ACH trace number or card authorization code.
      payment_method: Payment instrument type.
      payer_type: resident_or_family or ltc_insurer.
      billing_period: For an insurer payment, the billing period its explanation of benefits covers; empty otherwise.
    account: resident_balance
    direction: out
    triggers: []
  - type: assisted_payment_return
    target: assisted_ledger
    meaning: A posted payment is returned unpaid by the bank and reinstated.
    grain: One row per returned payment entry.
    distinguish_by: [source_entry_id]
    fields:
      assisted_residency_id: The residency.
      customer_id: The resident.
      amount: Returned amount, positive, USD.
      posting_date: Date posted.
      source_entry_id: The payment entry returned.
    account: resident_balance
    direction: in
    triggers:
      - event: assisted:assisted_addon_charge
        map: {assisted_residency_id: assisted_residency_id, addon_code: returned_payment, source_entry_id: source_entry_id}
  - type: assisted_credit
    target: assisted_ledger
    meaning: A credit reduces the amount owed - billing corrections, move-out or level-change proration, absence care credits, entrance plan care discounts or a respite conversion credit.
    grain: One row per credit reason per source entry per absence or source stay.
    distinguish_by: [credit_reason, source_entry_id, absence_start_date, respite_stay_id]
    fields:
      assisted_residency_id: The residency.
      customer_id: The resident.
      amount: Credit, positive, USD.
      posting_date: Date posted.
      credit_reason: billing_error, move_out_proration, level_change_proration, absence_care_credit, entrance_plan_discount or respite_conversion.
      source_entry_id: The charge entry credited; empty for a respite conversion credit.
      billing_period: Billing period the credit relates to, YYYY-MM.
      days_billed: Days credited, for prorations and absence credits.
      days_in_period: Days in the calendar month of the billing period.
      absence_start_date: For absence care credits, the start date of the absence; empty otherwise.
      respite_stay_id: For respite conversion credits, the respite stay converted; empty otherwise.
      entrance_agreement_id: For entrance plan discounts, the entrance fee agreement applied; empty otherwise.
    account: resident_balance
    direction: out
    triggers: []
  - type: assisted_credit_balance_refund
    target: assisted_ledger
    meaning: A credit balance is refunded to the resident, the estate or the insurer that overpaid.
    grain: One row per refund instrument.
    distinguish_by: [payment_reference]
    fields:
      assisted_residency_id: The residency.
      customer_id: The resident.
      amount: Refund, positive, USD.
      posting_date: Date issued.
      payment_reference: Refund check or ACH trace number.
      payment_method: check or ach_one_time.
      payer_type: Party refunded - resident_or_family or ltc_insurer.
    account: resident_balance
    direction: in
    triggers: []

measures:
  - id: assisted_msr_days_since_last_assessment
    window: From the assessment_date of the most recent assisted_assessment_record on the residency (any type) to the handling date.
    measure: Number of calendar days elapsed, counted as handling date minus assessment date.
  - id: assisted_msr_absence_midnights
    window: One continuous absence, from absence_start_date to absence_return_date (or to the handling date while still on leave).
    measure: Number of midnights away, counted as the return date (or handling date) minus the absence start date in calendar days.
  - id: assisted_msr_period_past_due
    window: The single billing period being assessed, evaluated at the end of the last grace day.
    measure: Sum of rent, care fee and monthly add-on charges with that billing_period, less payments and credits applied to them oldest charge first.
  - id: assisted_msr_trays_in_month
    window: The calendar month of the tray's service date.
    measure: Sum of quantity over assisted_addon_charge entries with addon_code tray_service on the residency, including trays posted at 0.00 as included.
  - id: assisted_msr_bath_assists_in_week
    window: The calendar week, Sunday through Saturday, containing the assist's service date.
    measure: Sum of quantity over assisted_addon_charge entries with addon_code bath_assist on the residency, including assists posted at 0.00 as included.

policies:
  - id: assisted_agg_multi_holding
    subject: [assisted_admission_create]
    rule: >-
      A customer holds at most one assisted living residency at a time.
      A new admission may be opened only when the customer has no other assisted living residency in pending_admission, active, on_leave or notice_given status.
      Assisted living and memory care are mutually exclusive for the same person, and an admission may not be opened while the customer has a memory care residency in pending_admission, active, on_leave or notice_given status.
      An independent living residency in active or notice_given status may coexist with a new assisted living admission only when the admission_source is larkspur_independent, which marks a move from the customer's own Larkspur apartment; that independent living residency then ends under the independent living fee end rules.
      A Larkspur respite stay in in_stay status may coexist with a new admission only when the admission_source is larkspur_respite.
    eligibility:
      - id: no_open_assisted_residency
        applies_to: [assisted_admission_create]
        kind: dedup
        condition: A new admission may be opened only when the customer has no other assisted living residency in pending_admission, active, on_leave or notice_given status.
        evidence_fields: [assisted_residencies.customer_id, assisted_residencies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.customer_id]
          action_bindings:
            assisted_residencies.customer_id: customer_id
        dedup_contract:
          table: assisted_residencies
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_admission, active, on_leave, notice_given]}
          distinct_fields: [assisted_residency_id]
      - id: no_open_memory_residency
        applies_to: [assisted_admission_create]
        kind: dedup
        condition: Assisted living and memory care are mutually exclusive for the same person, and an admission may not be opened while the customer has a memory care residency in pending_admission, active, on_leave or notice_given status.
        evidence_fields: [memory_residencies.customer_id, memory_residencies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_residencies.customer_id]
          action_bindings:
            memory_residencies.customer_id: customer_id
        dedup_contract:
          table: memory_residencies
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_admission, active, on_leave, notice_given]}
          distinct_fields: [memory_residency_id]
    params:
      max_per_customer: 1

  - id: assisted_admission_eligibility
    subject: [assisted_admission_create, assisted_move_in, assisted_admission_withdraw]
    rule: >-
      An admission is opened only on a pre-admission care-point assessment by a Larkspur nurse, recorded with the admission; the admitted care level is the level whose care_points_min to care_points_max band contains that score.
      The resident must be at least min_resident_age years old on the planned move-in date, by date_of_birth on the customer profile.
      A score above care_points_max of the highest care level, or a wander risk where wander_risk_excluded is true, means assisted living cannot meet the resident's needs and no admission is opened; the family is referred to memory care admissions.
      The contracted monthly_base_rent is the apartment_base_rent of the apartment type on the admission date.
      Move-in may take place only within pre_admission_assessment_validity_days after the pre-admission assessment.
      The validity period is counted in calendar days from the assessment date, the assessment date being day 0, and move-in on the last day of the period is still valid; after it lapses a new pre-admission assessment is required before move-in.
      An admission may be withdrawn before move-in only by the applicant's own signed withdrawal or that of a representative whose representative_authority is financial_poa, durable_poa or guardian; nothing is charged for a withdrawn admission because rent, care fees and the community fee begin only at move-in.
    eligibility:
      - id: resident_age
        applies_to: [assisted_admission_create]
        kind: caller_fact
        condition: The resident must be at least min_resident_age years old on the planned move-in date, by date_of_birth on the customer profile.
        evidence_fields: [customers.date_of_birth, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: assessment_valid_at_move_in
        applies_to: [assisted_move_in]
        kind: time
        condition: Move-in may take place only within pre_admission_assessment_validity_days after the pre-admission assessment.
        evidence_fields: [assisted_assessments.assessment_date, assisted_assessments.assessment_type, assisted_assessments.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_assessments.assisted_residency_id]
          action_bindings:
            assisted_assessments.assisted_residency_id: assisted_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the pre-admission assessment
          anchor_source: assisted_assessments.assessment_date
          relation: not_after
          duration_source: variants.pre_admission_assessment_validity_days
          unit: calendar_days
          counting_rule: The validity period is counted in calendar days from the assessment date, the assessment date being day 0, and move-in on the last day of the period is still valid; after it lapses a new pre-admission assessment is required before move-in.
          boundary: inclusive
      - id: withdrawal_signer
        applies_to: [assisted_admission_withdraw]
        kind: authorization
        condition: An admission may be withdrawn before move-in only by the applicant's own signed withdrawal or that of a representative whose representative_authority is financial_poa, durable_poa or guardian; nothing is charged for a withdrawn admission because rent, care fees and the community fee begin only at move-in.
        evidence_fields: [customers.representative_authority, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id

  - id: assisted_level_assignment
    subject: [assisted_assessment_record, assisted_level_change]
    rule: >-
      The care level of a resident is always the level whose care_points_min to care_points_max band contains the care points of the most recent assessment; there is no discretionary level and the level billed never differs from the band of the latest assessment once its effective date has passed.
      Each assessment records the care points, the indicated level and whether that level differs from the level billed on the assessment date.
      An assessment score above care_points_max of the highest level, or a wander risk where wander_risk_excluded is true, means the resident's needs exceed assisted living; the level is not changed and the residency proceeds to a discharge_needs_exceed or transfer_memory ending under the move-out policy.
      Assessments and level changes may be recorded only while the residency is in pending_admission, active, on_leave or notice_given status.
    eligibility:
      - id: assessment_on_open_residency
        applies_to: [assisted_assessment_record, assisted_level_change]
        kind: state
        condition: Assessments and level changes may be recorded only while the residency is in pending_admission, active, on_leave or notice_given status.
        evidence_fields: [assisted_residencies.status, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id
        state_contract:
          field: assisted_residencies.status
          allowed: [pending_admission, active, on_leave, notice_given]
    params:
      per_tier:
        Assisted Living Care Level 1: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", care_level_monthly_fee: "=care_level_monthly_fee"}
        Assisted Living Care Level 2: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", care_level_monthly_fee: "=care_level_monthly_fee"}
        Assisted Living Care Level 3: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", care_level_monthly_fee: "=care_level_monthly_fee"}
        Assisted Living Care Level 4: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", care_level_monthly_fee: "=care_level_monthly_fee"}
        Assisted Living Care Level 5: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", care_level_monthly_fee: "=care_level_monthly_fee"}
        Assisted Living Care Level 6: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", care_level_monthly_fee: "=care_level_monthly_fee"}

  - id: assisted_reassessment_schedule
    subject: [assisted_assessment_record]
    rule: >-
      Reassessments follow a fixed schedule and are recorded by assessment_type.
      A post_move_in reassessment is completed no later than post_move_in_reassessment_days calendar days after the move-in date.
      A routine reassessment is due once assisted_msr_days_since_last_assessment reaches routine_reassessment_interval_days of the care level billed, and is completed no later than that day.
      A post_hospital reassessment is required after every return from an absence whose absence_reason is hospital and whose assisted_msr_absence_midnights is at least hospital_stay_reassessment_trigger_nights.
      The post-hospital reassessment is completed no later than post_hospital_reassessment_days after the resident returns from the hospital stay.
      The post-hospital period is counted in calendar days from the absence_return_date, the return date being day 0, and a reassessment completed on the last day is on time.
      A change_of_condition reassessment may be performed at any time on a nurse's referral or at the written request of the resident or their representative, and a family request is recorded as such but never sets the score.
      Only one assessment of a given type is recorded per residency per date.
    eligibility:
      - id: post_hospital_window
        applies_to: [assisted_assessment_record]
        kind: time
        condition: The post-hospital reassessment is completed no later than post_hospital_reassessment_days after the resident returns from the hospital stay.
        evidence_fields: [assisted_residencies.absence_return_date, assisted_residencies.absence_reason, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the resident returns from the hospital stay
          anchor_source: assisted_residencies.absence_return_date
          relation: not_after
          duration_source: variants.post_hospital_reassessment_days
          unit: calendar_days
          counting_rule: The post-hospital period is counted in calendar days from the absence_return_date, the return date being day 0, and a reassessment completed on the last day is on time.
          boundary: inclusive
      - id: one_assessment_per_type_per_date
        applies_to: [assisted_assessment_record]
        kind: dedup
        condition: Only one assessment of a given type is recorded per residency per date.
        evidence_fields: [assisted_assessments.assisted_residency_id, assisted_assessments.assessment_date, assisted_assessments.assessment_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_assessments.assisted_residency_id, assisted_assessments.assessment_date]
          action_bindings:
            assisted_assessments.assisted_residency_id: assisted_residency_id
            assisted_assessments.assessment_date: assessment_date
        dedup_contract:
          table: assisted_assessments
          mode: separate_record
          object_bindings: {assisted_residency_id: assisted_residency_id, assessment_date: assessment_date, assessment_type: assessment_type}
          duplicate_filters: {event_type: [assisted_assessment_record]}
          distinct_fields: []
    measures: [assisted_msr_days_since_last_assessment, assisted_msr_absence_midnights]
    params:
      per_tier:
        Assisted Living Care Level 1: {routine_reassessment_interval_days: "=routine_reassessment_interval_days"}
        Assisted Living Care Level 2: {routine_reassessment_interval_days: "=routine_reassessment_interval_days"}
        Assisted Living Care Level 3: {routine_reassessment_interval_days: "=routine_reassessment_interval_days"}
        Assisted Living Care Level 4: {routine_reassessment_interval_days: "=routine_reassessment_interval_days"}
        Assisted Living Care Level 5: {routine_reassessment_interval_days: "=routine_reassessment_interval_days"}
        Assisted Living Care Level 6: {routine_reassessment_interval_days: "=routine_reassessment_interval_days"}

  - id: assisted_level_change_effective
    subject: [assisted_level_notice, assisted_level_change, assisted_care_fee_charge, assisted_credit]
    rule: >-
      Every assessment that indicates a level different from the level billed is followed by a written level notice to the resident and the representative on file, issued no later than level_notice_issue_days calendar days after the assessment date and stating the new level and its effective date.
      An increase found at a change_of_condition or post_hospital reassessment takes effect on the assessment date, because the added care is delivered from that day.
      An increase found at a routine or post_move_in reassessment takes effect on the notice date plus level_increase_notice_days calendar days.
      A routine or post-move-in increase may be recorded only once level_increase_notice_days have passed since the written level notice was issued.
      The notice period is counted in calendar days from the notice date, the notice date being day 0, and the increase takes effect on the day the count reaches level_increase_notice_days.
      A decrease at any type of reassessment takes effect on the first day of the calendar month following the assessment date.
      When the effective date falls inside a month already billed, the care fee of that month is split at the effective date: the days from the effective date are charged at the new level as a prorated_level_change charge, and for a decrease the days at the old level from the effective date are returned as a level_change_proration credit referencing the original care fee charge.
      A level change is recorded once per level notice, and the level change takes the level stated on the notice it follows.
    eligibility:
      - id: routine_increase_notice_elapsed
        applies_to: [assisted_level_change]
        kind: time
        condition: A routine or post-move-in increase may be recorded only once level_increase_notice_days have passed since the written level notice was issued.
        evidence_fields: [assisted_assessments.notice_date, assisted_assessments.source_assessment_id, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_assessments.source_assessment_id]
          action_bindings:
            assisted_assessments.source_assessment_id: source_assessment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the written level notice was issued
          anchor_source: assisted_assessments.notice_date
          relation: not_before
          duration_source: variants.level_increase_notice_days
          unit: calendar_days
          counting_rule: The notice period is counted in calendar days from the notice date, the notice date being day 0, and the increase takes effect on the day the count reaches level_increase_notice_days.
          boundary: inclusive
      - id: one_notice_per_assessment
        applies_to: [assisted_level_notice]
        kind: dedup
        condition: A level change is recorded once per level notice, and the level change takes the level stated on the notice it follows.
        evidence_fields: [assisted_assessments.source_assessment_id, assisted_assessments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_assessments.source_assessment_id]
          action_bindings:
            assisted_assessments.source_assessment_id: source_assessment_id
        dedup_contract:
          table: assisted_assessments
          mode: separate_record
          object_bindings: {source_assessment_id: source_assessment_id}
          duplicate_filters: {event_type: [assisted_level_notice]}
          distinct_fields: []
    params:
      per_tier:
        Assisted Living Care Level 1: {level_increase_notice_days: "=level_increase_notice_days", level_notice_issue_days: "=level_notice_issue_days", care_level_monthly_fee: "=care_level_monthly_fee"}
        Assisted Living Care Level 2: {level_increase_notice_days: "=level_increase_notice_days", level_notice_issue_days: "=level_notice_issue_days", care_level_monthly_fee: "=care_level_monthly_fee"}
        Assisted Living Care Level 3: {level_increase_notice_days: "=level_increase_notice_days", level_notice_issue_days: "=level_notice_issue_days", care_level_monthly_fee: "=care_level_monthly_fee"}
        Assisted Living Care Level 4: {level_increase_notice_days: "=level_increase_notice_days", level_notice_issue_days: "=level_notice_issue_days", care_level_monthly_fee: "=care_level_monthly_fee"}
        Assisted Living Care Level 5: {level_increase_notice_days: "=level_increase_notice_days", level_notice_issue_days: "=level_notice_issue_days", care_level_monthly_fee: "=care_level_monthly_fee"}
        Assisted Living Care Level 6: {level_increase_notice_days: "=level_increase_notice_days", level_notice_issue_days: "=level_notice_issue_days", care_level_monthly_fee: "=care_level_monthly_fee"}
    formula:
      prorated_care_fee: round(care_level_monthly_fee * days_billed / days_in_period, 2)

  - id: assisted_monthly_billing
    subject: [assisted_rent_charge, assisted_care_fee_charge]
    rule: >-
      Rent and the care level fee are billed in advance on fee_due_day of each calendar month for the whole month: rent at the contracted monthly_base_rent and the care fee at care_level_monthly_fee of the level billed.
      The move-in month, the month of a level or rent change and the month in which fees end are prorated: the daily amount is the monthly amount divided by the actual number of days in that calendar month, multiplied by the days billed counted inclusive of both ends, and rounded once to the cent half up.
      Rent and care fees continue during an absence; only the care fee is relieved, and only through the absence care credit.
      Rent and care fee charges may be posted only while the residency is in active, on_leave or notice_given status.
    eligibility:
      - id: billing_on_live_residency
        applies_to: [assisted_rent_charge, assisted_care_fee_charge]
        kind: state
        condition: Rent and care fee charges may be posted only while the residency is in active, on_leave or notice_given status.
        evidence_fields: [assisted_residencies.status, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id
        state_contract:
          field: assisted_residencies.status
          allowed: [active, on_leave, notice_given]
    formula:
      prorated_rent: round(monthly_base_rent * days_billed / days_in_period, 2)
      prorated_care: round(care_level_monthly_fee * days_billed / days_in_period, 2)

  - id: assisted_care_addons
    subject: [assisted_addon_charge]
    rule: >-
      Care add-ons are billed by the care level billed on the service date.
      Medication management is charged monthly at medication_management_fee only where medication_management_included is false; each scheduled daily medication pass beyond included_med_passes_per_day is charged at extra_med_pass_monthly_fee per pass per month.
      Insulin management, glucose monitoring and oxygen management are charged monthly at insulin_management_fee, diabetic_monitoring_fee and oxygen_management_fee of the care level for residents whose care plan includes them, and are not charged where the fee of the level is 0.00.
      Incontinence care and escort assistance are charged monthly at incontinence_care_fee and escort_assistance_fee only where incontinence_care_included or escort_assistance_included is false.
      Monthly add-ons follow the care level in effect on the first day of the billing month; a level change during the month changes the monthly add-ons from the next billing month.
      Bath assists are posted per assist; the first bath_assists_per_week_included assists in a calendar week are posted at 0.00 and each further assist at extra_bath_assist_fee, by assisted_msr_bath_assists_in_week.
      Trays delivered to the apartment are posted per day; trays within tray_service_included_per_month in the calendar month are posted at 0.00 and each further tray at tray_service_fee, by assisted_msr_trays_in_month, and trays during a documented illness ordered by the nurse are never charged.
      Guest meals are charged at guest_meal_fee per meal, ltc_direct_billing_fee is charged monthly while ltc_direct_billing is true, apartment_change_fee is charged once per resident-requested apartment change, and returned_payment_fee is charged once per returned payment referencing it.
      Add-on charges may be posted only while the residency is in active, on_leave or notice_given status.
    eligibility:
      - id: addon_on_live_residency
        applies_to: [assisted_addon_charge]
        kind: state
        condition: Add-on charges may be posted only while the residency is in active, on_leave or notice_given status.
        evidence_fields: [assisted_residencies.status, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id
        state_contract:
          field: assisted_residencies.status
          allowed: [active, on_leave, notice_given]
    measures: [assisted_msr_trays_in_month, assisted_msr_bath_assists_in_week]
    params:
      per_tier:
        Assisted Living Care Level 1: {medication_management_included: "=medication_management_included", medication_management_fee: "=medication_management_fee", included_med_passes_per_day: "=included_med_passes_per_day", insulin_management_fee: "=insulin_management_fee", incontinence_care_fee: "=incontinence_care_fee", escort_assistance_fee: "=escort_assistance_fee", bath_assists_per_week_included: "=bath_assists_per_week_included", tray_service_included_per_month: "=tray_service_included_per_month", diabetic_monitoring_fee: "=diabetic_monitoring_fee", oxygen_management_fee: "=oxygen_management_fee"}
        Assisted Living Care Level 2: {medication_management_included: "=medication_management_included", medication_management_fee: "=medication_management_fee", included_med_passes_per_day: "=included_med_passes_per_day", insulin_management_fee: "=insulin_management_fee", incontinence_care_fee: "=incontinence_care_fee", escort_assistance_fee: "=escort_assistance_fee", bath_assists_per_week_included: "=bath_assists_per_week_included", tray_service_included_per_month: "=tray_service_included_per_month", diabetic_monitoring_fee: "=diabetic_monitoring_fee", oxygen_management_fee: "=oxygen_management_fee"}
        Assisted Living Care Level 3: {medication_management_included: "=medication_management_included", medication_management_fee: "=medication_management_fee", included_med_passes_per_day: "=included_med_passes_per_day", insulin_management_fee: "=insulin_management_fee", incontinence_care_fee: "=incontinence_care_fee", escort_assistance_fee: "=escort_assistance_fee", bath_assists_per_week_included: "=bath_assists_per_week_included", tray_service_included_per_month: "=tray_service_included_per_month", diabetic_monitoring_fee: "=diabetic_monitoring_fee", oxygen_management_fee: "=oxygen_management_fee"}
        Assisted Living Care Level 4: {medication_management_included: "=medication_management_included", medication_management_fee: "=medication_management_fee", included_med_passes_per_day: "=included_med_passes_per_day", insulin_management_fee: "=insulin_management_fee", incontinence_care_fee: "=incontinence_care_fee", escort_assistance_fee: "=escort_assistance_fee", bath_assists_per_week_included: "=bath_assists_per_week_included", tray_service_included_per_month: "=tray_service_included_per_month", diabetic_monitoring_fee: "=diabetic_monitoring_fee", oxygen_management_fee: "=oxygen_management_fee"}
        Assisted Living Care Level 5: {medication_management_included: "=medication_management_included", medication_management_fee: "=medication_management_fee", included_med_passes_per_day: "=included_med_passes_per_day", insulin_management_fee: "=insulin_management_fee", incontinence_care_fee: "=incontinence_care_fee", escort_assistance_fee: "=escort_assistance_fee", bath_assists_per_week_included: "=bath_assists_per_week_included", tray_service_included_per_month: "=tray_service_included_per_month", diabetic_monitoring_fee: "=diabetic_monitoring_fee", oxygen_management_fee: "=oxygen_management_fee"}
        Assisted Living Care Level 6: {medication_management_included: "=medication_management_included", medication_management_fee: "=medication_management_fee", included_med_passes_per_day: "=included_med_passes_per_day", insulin_management_fee: "=insulin_management_fee", incontinence_care_fee: "=incontinence_care_fee", escort_assistance_fee: "=escort_assistance_fee", bath_assists_per_week_included: "=bath_assists_per_week_included", tray_service_included_per_month: "=tray_service_included_per_month", diabetic_monitoring_fee: "=diabetic_monitoring_fee", oxygen_management_fee: "=oxygen_management_fee"}

  - id: assisted_absence
    subject: [assisted_leave_start, assisted_leave_return, assisted_credit]
    rule: >-
      A temporary absence is recorded with its start date and reason, and the apartment stays held while rent continues to be paid.
      On return, the care fee is relieved for long absences: the credited days are the absence's assisted_msr_absence_midnights less absence_care_credit_after_days, never below zero and never above absence_care_credit_max_days.
      Each credited day is credited at absence_care_credit_pct percent of the daily care fee of the level billed in that month, the daily care fee being the monthly care fee divided by the days in that month; one absence_care_credit is posted per absence per billing month, referencing that month's care fee charge and carrying the absence start date, each rounded to the cent half up.
      Rent is never credited for an absence, because absence_rent_credit is false.
      An absence care credit is posted at most once per absence per billing month.
      An absence credit may be posted only while the residency is in active, notice_given or vacated status, that is after the resident has returned or the residency has ended during the absence.
      When an absence reaches max_leave_days_before_review midnights the executive director decides whether the apartment continues to be held; that decision is outside the desk's authority.
    eligibility:
      - id: one_absence_credit_per_month
        applies_to: [assisted_credit]
        kind: dedup
        condition: An absence care credit is posted at most once per absence per billing month.
        evidence_fields: [assisted_ledger.absence_start_date, assisted_ledger.billing_period, assisted_ledger.credit_reason, assisted_ledger.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_ledger.assisted_residency_id, assisted_ledger.absence_start_date, assisted_ledger.billing_period]
          action_bindings:
            assisted_ledger.assisted_residency_id: assisted_residency_id
            assisted_ledger.absence_start_date: absence_start_date
            assisted_ledger.billing_period: billing_period
        dedup_contract:
          table: assisted_ledger
          mode: separate_record
          object_bindings: {assisted_residency_id: assisted_residency_id, absence_start_date: absence_start_date, billing_period: billing_period}
          duplicate_filters: {credit_reason: [absence_care_credit]}
          distinct_fields: []
      - id: credit_after_return
        applies_to: [assisted_credit]
        kind: state
        condition: An absence credit may be posted only while the residency is in active, notice_given or vacated status, that is after the resident has returned or the residency has ended during the absence.
        evidence_fields: [assisted_residencies.status, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id
        state_contract:
          field: assisted_residencies.status
          allowed: [active, notice_given, vacated]
    measures: [assisted_msr_absence_midnights]
    formula:
      credited_days: min(max(assisted_msr_absence_midnights - absence_care_credit_after_days, 0), absence_care_credit_max_days)
      absence_credit_amount: round(care_level_monthly_fee / days_in_period * days_billed * absence_care_credit_pct / 100, 2)

  - id: assisted_move_out
    subject: [assisted_notice_record, assisted_notice_withdraw, assisted_vacate, assisted_end_without_notice, assisted_credit, assisted_rent_charge, assisted_care_fee_charge]
    rule: >-
      A resident ends the residency by a written notice of termination signed by the resident or by a representative whose representative_authority is financial_poa, durable_poa or guardian.
      A notice may be withdrawn only before the intended vacate date stated on it.
      The withdrawal window is counted in calendar days and closes at the end of the day before the intended vacate date.
      Rent and care fees run through a fee end date: after a resident notice, the later of the vacate date and the notice date plus move_out_notice_days calendar days; on death, the later of the vacate date and date_of_death on the customer profile plus post_death_fee_days calendar days; on a transfer into Larkspur memory care, the day before the memory care move-in date, internal_transfer_notice_days being 0; after a discharge, the vacate date.
      A discharge notice for nonpayment may be issued only after a charge has remained past due for past_due_days_before_discharge_notice.
      A discharge for nonpayment or because the resident's needs exceed assisted living takes effect only after a written discharge notice issued by the executive director, and the residency may be ended for discharge only once discharge_notice_days have passed since that notice.
      The discharge period is counted in calendar days from the notice date recorded on the residency, and the residency may be ended on the notice date plus discharge_notice_days calendar days or later.
      Days after the fee end date in a month already billed are returned as move_out_proration credits referencing that month's rent and care fee charges; the community fee is never refunded.
    eligibility:
      - id: notice_signer
        applies_to: [assisted_notice_record, assisted_notice_withdraw]
        kind: authorization
        condition: A resident ends the residency by a written notice of termination signed by the resident or by a representative whose representative_authority is financial_poa, durable_poa or guardian.
        evidence_fields: [customers.representative_authority, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: withdraw_before_vacate
        applies_to: [assisted_notice_withdraw]
        kind: time
        condition: A notice may be withdrawn only before the intended vacate date stated on it.
        evidence_fields: [assisted_residencies.intended_vacate_date, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the intended vacate date stated on it
          anchor_source: assisted_residencies.intended_vacate_date
          relation: not_after
          duration_source: params.withdrawal_cutoff_days
          unit: calendar_days
          counting_rule: The withdrawal window is counted in calendar days and closes at the end of the day before the intended vacate date.
          boundary: exclusive
      - id: discharge_period_elapsed
        applies_to: [assisted_end_without_notice]
        kind: time
        condition: A discharge for nonpayment or because the resident's needs exceed assisted living takes effect only after a written discharge notice issued by the executive director, and the residency may be ended for discharge only once discharge_notice_days have passed since that notice.
        evidence_fields: [assisted_residencies.notice_date, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: a written discharge notice issued by the executive director
          anchor_source: assisted_residencies.notice_date
          relation: not_before
          duration_source: variants.discharge_notice_days
          unit: calendar_days
          counting_rule: The discharge period is counted in calendar days from the notice date recorded on the residency, and the residency may be ended on the notice date plus discharge_notice_days calendar days or later.
          boundary: inclusive
    params:
      withdrawal_cutoff_days: 0

  - id: assisted_payments_and_late_fees
    subject: [assisted_payment, assisted_payment_return, assisted_late_fee_charge]
    rule: >-
      Payments are posted once per instrument and applied to the oldest outstanding charge first; a payment from a long-term care insurer is applied first to the billing period named on its explanation of benefits.
      A returned payment is reinstated referencing the payment entry returned and carries returned_payment_fee.
      A late fee may be assessed only after payment_grace_days have passed since the monthly charges for that billing period were posted.
      The grace period ends at the end of the day equal to the posting date of the monthly charges plus payment_grace_days calendar days, and a late fee may be assessed only on a later date.
      The late fee is the greater of late_fee_flat and late_fee_pct percent of assisted_msr_period_past_due rounded to the cent half up, and none is assessed when assisted_msr_period_past_due is below late_fee_min_past_due.
      No late fee is assessed for a billing period while ltc_direct_billing is true and the insurer's payment for that period is outstanding, because the insurer's processing time is not the resident's delay.
      At most one late fee is assessed per residency per billing period.
      Payments may be posted while the residency is in active, on_leave, notice_given or vacated status.
    eligibility:
      - id: grace_elapsed
        applies_to: [assisted_late_fee_charge]
        kind: time
        condition: A late fee may be assessed only after payment_grace_days have passed since the monthly charges for that billing period were posted.
        evidence_fields: [assisted_ledger.posting_date, assisted_ledger.billing_period, assisted_ledger.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_ledger.assisted_residency_id, assisted_ledger.billing_period]
          action_bindings:
            assisted_ledger.assisted_residency_id: assisted_residency_id
            assisted_ledger.billing_period: billing_period
        temporal_basis:
          clock: frozen_time
          anchor_event: the monthly charges for that billing period were posted
          anchor_source: assisted_ledger.posting_date
          relation: not_before
          duration_source: variants.payment_grace_days
          unit: calendar_days
          counting_rule: The grace period ends at the end of the day equal to the posting date of the monthly charges plus payment_grace_days calendar days, and a late fee may be assessed only on a later date.
          boundary: exclusive
      - id: one_late_fee_per_period
        applies_to: [assisted_late_fee_charge]
        kind: dedup
        condition: At most one late fee is assessed per residency per billing period.
        evidence_fields: [assisted_ledger.assisted_residency_id, assisted_ledger.billing_period, assisted_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_ledger.assisted_residency_id, assisted_ledger.billing_period]
          action_bindings:
            assisted_ledger.assisted_residency_id: assisted_residency_id
            assisted_ledger.billing_period: billing_period
        dedup_contract:
          table: assisted_ledger
          mode: separate_record
          object_bindings: {assisted_residency_id: assisted_residency_id, billing_period: billing_period}
          duplicate_filters: {event_type: [assisted_late_fee_charge]}
          distinct_fields: []
      - id: payment_on_open_account
        applies_to: [assisted_payment]
        kind: state
        condition: Payments may be posted while the residency is in active, on_leave, notice_given or vacated status.
        evidence_fields: [assisted_residencies.status, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id
        state_contract:
          field: assisted_residencies.status
          allowed: [active, on_leave, notice_given, vacated]
    measures: [assisted_msr_period_past_due]
    formula:
      when_not: assisted_msr_period_past_due < late_fee_min_past_due
      late_fee_amount: max(late_fee_flat, round(assisted_msr_period_past_due * late_fee_pct / 100, 2))

  - id: assisted_entrance_and_respite_credits
    subject: [assisted_credit]
    rule: >-
      Holding an Entrance Fee Agreement changes what an assisted living resident pays: while the customer holds an Entrance Fee Agreement in occupied status, each rent charge and each care fee charge receives an entrance_plan_discount credit referencing that charge and the agreement.
      The discount percentages are care_fee_discount_pct and rent_discount_pct of the agreement's plan, set in the Entrance Fee Agreement charter, each applied to the charge amount and rounded to the cent half up.
      No discount is given to add-ons, late fees or the community fee, and no discount is posted once the agreement has left occupied status, whatever the service days of the charge.
      A respite_conversion credit is posted only as the consequence of a converted Larkspur respite stay, for the amount the respite charter fixes, and carries the respite stay it comes from; each respite stay yields at most one conversion credit across all residencies.
      An entrance plan discount is posted at most once per charge entry.
    eligibility:
      - id: entrance_agreement_occupied
        applies_to: [assisted_credit]
        kind: state
        condition: "Holding an Entrance Fee Agreement changes what an assisted living resident pays: while the customer holds an Entrance Fee Agreement in occupied status, each rent charge and each care fee charge receives an entrance_plan_discount credit referencing that charge and the agreement."
        evidence_fields: [entrance_agreements.status, entrance_agreements.entrance_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.entrance_agreement_id]
          action_bindings:
            entrance_agreements.entrance_agreement_id: entrance_agreement_id
        state_contract:
          field: entrance_agreements.status
          allowed: [occupied]
      - id: one_discount_per_charge
        applies_to: [assisted_credit]
        kind: dedup
        condition: An entrance plan discount is posted at most once per charge entry.
        evidence_fields: [assisted_ledger.source_entry_id, assisted_ledger.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_ledger.source_entry_id]
          action_bindings:
            assisted_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: assisted_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {credit_reason: [entrance_plan_discount]}
          distinct_fields: []

  - id: assisted_billing_corrections
    subject: [assisted_credit]
    rule: >-
      A charge posted in error - a wrong care level, a wrong rent, an add-on the care level includes, a duplicate posting - is corrected only by a billing_error credit referencing the exact charge entry; charges are never deleted.
      The credit may not exceed that charge less credits already posted against it, and the correct charge, where one is due, is posted again as a new entry.
      Each charge entry receives at most one billing_error credit.
      A care level that matches the band of the latest assessment is not a billing error, and a family's disagreement with an assessment is handled by requesting a change_of_condition reassessment, never by a credit.
    eligibility:
      - id: one_correction_per_charge
        applies_to: [assisted_credit]
        kind: dedup
        condition: Each charge entry receives at most one billing_error credit.
        evidence_fields: [assisted_ledger.source_entry_id, assisted_ledger.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_ledger.source_entry_id]
          action_bindings:
            assisted_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: assisted_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {credit_reason: [billing_error]}
          distinct_fields: []

  - id: assisted_community_fee
    subject: [assisted_community_fee_charge]
    rule: >-
      The community fee is charged once at move-in at community_fee.
      Where community_fee_waived_internal_transfer is true, a resident whose admission_source is larkspur_independent pays no community fee and no row is written.
      A resident converting from a Larkspur respite stay is charged the community fee and receives the respite conversion credit instead.
      The community fee may be charged only while the residency is in active status.
    eligibility:
      - id: community_fee_at_move_in
        applies_to: [assisted_community_fee_charge]
        kind: state
        condition: The community fee may be charged only while the residency is in active status.
        evidence_fields: [assisted_residencies.status, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id
        state_contract:
          field: assisted_residencies.status
          allowed: [active]

  - id: assisted_rent_and_apartment
    subject: [assisted_rent_notice, assisted_rent_adjust, assisted_apartment_change]
    rule: >-
      Rent is increased at most once in any 12-month period and the new rent may not exceed the rent in effect by more than max_annual_rent_increase_pct percent, rounded to the cent half up; care level fees change only through reassessment and the published fee of the level.
      Written notice of a rent increase is mailed and recorded with the proposed rent, and the rent recorded when the increase takes effect is the proposed rent from that notice.
      A rent increase may be recorded only once rent_increase_notice_days have passed since written notice of the increase was mailed.
      Notice days are counted in calendar days from the mailing date, the mailing date being day 0, and the increase may take effect on the day the count reaches rent_increase_notice_days or later.
      A resident may move to another assisted living apartment in the same community at their signed request while the residency is active; the new rent is apartment_base_rent of the new apartment type on the change date, effective from possession, and apartment_change_fee is charged once.
      Rent changes and apartment changes may be recorded only while the residency is in active or notice_given status.
    eligibility:
      - id: rent_notice_elapsed
        applies_to: [assisted_rent_adjust]
        kind: time
        condition: A rent increase may be recorded only once rent_increase_notice_days have passed since written notice of the increase was mailed.
        evidence_fields: [assisted_residencies.rent_notice_date, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: written notice of the increase was mailed
          anchor_source: assisted_residencies.rent_notice_date
          relation: not_before
          duration_source: variants.rent_increase_notice_days
          unit: calendar_days
          counting_rule: Notice days are counted in calendar days from the mailing date, the mailing date being day 0, and the increase may take effect on the day the count reaches rent_increase_notice_days or later.
          boundary: inclusive
      - id: rent_change_on_live_residency
        applies_to: [assisted_rent_notice, assisted_rent_adjust, assisted_apartment_change]
        kind: state
        condition: Rent changes and apartment changes may be recorded only while the residency is in active or notice_given status.
        evidence_fields: [assisted_residencies.status, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id
        state_contract:
          field: assisted_residencies.status
          allowed: [active, notice_given]
    formula:
      max_new_rent: round(monthly_base_rent * (1 + max_annual_rent_increase_pct / 100), 2)

  - id: assisted_final_statement
    subject: [assisted_account_close, assisted_credit_balance_refund]
    rule: >-
      A final statement is issued no later than final_statement_days calendar days after the vacate date.
      A credit balance is refunded in one refund to the party who overpaid: an overpayment by a long-term care insurer is returned to that insurer, and any other credit balance to the resident, or to the estate when date_of_death is on the customer profile.
      A credit balance refund may be issued only while the residency is in vacated status.
      The residency file may be closed only when account_balance is 0.00.
    eligibility:
      - id: refund_after_vacate
        applies_to: [assisted_credit_balance_refund]
        kind: state
        condition: A credit balance refund may be issued only while the residency is in vacated status.
        evidence_fields: [assisted_residencies.status, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id
        state_contract:
          field: assisted_residencies.status
          allowed: [vacated]
      - id: zero_balance_to_close
        applies_to: [assisted_account_close]
        kind: authorization
        condition: The residency file may be closed only when account_balance is 0.00.
        evidence_fields: [assisted_residencies.account_balance, assisted_residencies.assisted_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.assisted_residency_id]
          action_bindings:
            assisted_residencies.assisted_residency_id: assisted_residency_id

extended_policies:
  - id: assisted_ext_absence_care_relief
    base_policy_refs: [assisted_level_change_effective, assisted_absence, assisted_move_out, assisted_entrance_and_respite_credits, assisted_billing_corrections]
    overwrite:
      - base_policy: assisted_absence
        superseded_clause: >-
          On return, the care fee is relieved for long absences: the credited days are the absence's assisted_msr_absence_midnights less absence_care_credit_after_days, never below zero and never above absence_care_credit_max_days.
        replaced_by: >-
          The credited days of the absence-relief credit are the midnights away less the waiting midnights, never below zero and never above absence_care_credit_max_days, the waiting midnights being absence_care_credit_after_days.
      - base_policy: assisted_absence
        superseded_clause: >-
          Each credited day is credited at absence_care_credit_pct percent of the daily care fee of the level billed in that month, the daily care fee being the monthly care fee divided by the days in that month; one absence_care_credit is posted per absence per billing month, referencing that month's care fee charge and carrying the absence start date, each rounded to the cent half up.
        replaced_by: >-
          The absence-relief credit is the daily care fee times the credited days times absence_care_credit_pct percent, rounded once to the cent half up at the end.
    trigger: state_due
    subject: [assisted_credit]
    computes: amount
    target_tool: post_absence_care_credit_bb749fc3
    params:
      waiting_midnights_documented_hospital: 7
      waiting_midnights_other_medical: 10
      tenure_reduction_long: 3
      tenure_reduction_mid: 1
      tenure_long_months: 60
      tenure_mid_months: 24
      relief_pct_levels_one_two: 85
      relief_pct_levels_three_four: 95
      plan_vesting_months: 60
      plan_vesting_half: 0.5
    rule: >-
      An absence-relief credit relieves part of the care fee for a temporary absence once the resident has returned or the residency has ended during the absence.
      It relates to the billing month of the most recent full-month care fee charge on the residency, references that charge, carries the absence start date and is posted at most once per absence per billing month.
      The midnights away are the absence return date less the absence start date, counted in calendar days.
      The credited days of the absence-relief credit are the midnights away less the waiting midnights, never below zero and never above absence_care_credit_max_days, the waiting midnights being absence_care_credit_after_days.
      The daily care fee of the absence-relief credit is the care_level_monthly_fee of the care level the residency carries, divided by the days in the billing month of the most recent full-month care fee charge on the residency.
      The absence-relief credit is the daily care fee times the credited days times absence_care_credit_pct percent, rounded once to the cent half up at the end.
      The waiting midnights depend on the kind of absence and its medical follow-up, and replace absence_care_credit_after_days as follows: a hospital absence followed by a post-hospital reassessment completed no later than post_hospital_reassessment_days calendar days after the return date waits waiting_midnights_documented_hospital midnights; a rehabilitation-facility absence, or a hospital absence without such a timely post-hospital reassessment, waits waiting_midnights_other_medical midnights; any other absence waits absence_care_credit_after_days midnights.
      Larkspur tenure shortens the waiting midnights, never below zero: tenure is counted in whole months up to the handling date from the move-in date of the customer's Larkspur independent living residency when the assisted living admission came from Larkspur independent living, and otherwise from the assisted living move-in date; tenure of at least tenure_long_months months shortens the waiting by tenure_reduction_long midnights, tenure of at least tenure_mid_months but under tenure_long_months months shortens it by tenure_reduction_mid midnight, and shorter tenure does not shorten it.
      The daily care fee follows the care level the resident was billed at while away: when the care level the residency carries took effect after the absence return date, the daily care fee is the amount of the full-month care fee charge of that billing month divided by its days; when it took effect after the absence start date and no later than the return date, the absence straddles the change and the daily care fee is the mean of that full-month charge and the care_level_monthly_fee of the level the residency carries, divided by the days in the month; otherwise it is the care_level_monthly_fee of the level the residency carries divided by the days in the month.
      The relief percentage depends on the care level of that full-month care fee charge, because the lower levels keep a fixed staffing cost while the resident is away: a charge at Assisted Living Care Level 1 or Assisted Living Care Level 2 is relieved at relief_pct_levels_one_two percent, a charge at Assisted Living Care Level 3 or Assisted Living Care Level 4 at relief_pct_levels_three_four percent, and a charge at any higher level at absence_care_credit_pct percent, each in place of absence_care_credit_pct.
      A customer who holds an Entrance Fee Agreement in occupied status pays a care fee lowered by the plan's vested care discount, so the credit returns only what was paid: an agreement whose occupancy date is at least plan_vesting_months whole months before the handling date reduces the credit by the plan's full care_fee_discount_pct percent, an occupied agreement of shorter standing reduces it by plan_vesting_half of that percentage, and a customer without an occupied agreement receives the credit in full.
      The waiting shortening, the relief percentage and the plan reduction apply together to the one credit, and rounding happens once at the end.
    baseline:
      rule: >-
        The midnights away are the absence return date less the absence start date, counted in calendar days.
        The credited days of the absence-relief credit are the midnights away less the waiting midnights, never below zero and never above absence_care_credit_max_days, the waiting midnights being absence_care_credit_after_days.
        The daily care fee of the absence-relief credit is the care_level_monthly_fee of the care level the residency carries, divided by the days in the billing month of the most recent full-month care fee charge on the residency.
        The absence-relief credit is the daily care fee times the credited days times absence_care_credit_pct percent, rounded once to the cent half up at the end.
      params: [absence_care_credit_after_days, absence_care_credit_max_days, care_level_monthly_fee, absence_care_credit_pct]
    prerequisite: []
    cross_category:
      - category: independent
        as: history
        reads: [move_in_date]
        note: The tenure shortening of the waiting midnights is counted from the move-in date of the customer's Larkspur independent living residency.
      - category: entrance
        as: branch
        reads: [status, occupancy_date, care_fee_discount_pct]
        note: The plan reduction of the credit is decided by the customer's occupied Entrance Fee Agreement, how long ago its occupancy began, and its plan's care discount.
    compute:
      - abs_start: "F('absence_start_date')"
      - abs_return: "F('absence_return_date')"
      - midnights_away: "DAYS(abs_start, abs_return)"
      - ph_date: "LATEST('assisted_assessments', 'assessment_date', date_field='assessment_date', event_type='assisted_assessment_record', assessment_type='post_hospital')"
      - ph_gap: "DAYS(abs_return, ph_date) if ph_date else -1"
      - timely_ph: "ph_gap >= 0 and ph_gap <= P('post_hospital_reassessment_days')"
      - waiting_midnights: "K('waiting_midnights_documented_hospital') if (F('absence_reason') == 'hospital' and timely_ph) else (K('waiting_midnights_other_medical') if (F('absence_reason') == 'rehab_facility' or (F('absence_reason') == 'hospital' and not timely_ph)) else P('absence_care_credit_after_days'))"
      - tenure_start: "CFIELD('independent', 'move_in_date') if F('admission_source') == 'larkspur_independent' else F('move_in_date')"
      - tenure_months: "MONTHS(tenure_start, NOW)"
      - waiting_shortening: "K('tenure_reduction_long') if tenure_months >= K('tenure_long_months') else (K('tenure_reduction_mid') if tenure_months >= K('tenure_mid_months') else 0)"
      - credited_days: "MN(MX(midnights_away - MX(waiting_midnights - waiting_shortening, 0), 0), P('absence_care_credit_max_days'))"
      - month_period: "LATEST('assisted_ledger', 'billing_period', date_field='service_from_date', event_type='assisted_care_fee_charge', charge_basis='full_month')"
      - month_charge: "SUM('assisted_ledger', 'amount', event_type='assisted_care_fee_charge', charge_basis='full_month', billing_period=month_period)"
      - month_days: "LATEST('assisted_ledger', 'days_in_period', date_field='service_from_date', event_type='assisted_care_fee_charge', charge_basis='full_month')"
      - month_level: "LATEST('assisted_ledger', 'care_level_billed', date_field='service_from_date', event_type='assisted_care_fee_charge', charge_basis='full_month')"
      - daily_care_fee: "month_charge / month_days if F('level_effective_date') > abs_return else ((month_charge + P('care_level_monthly_fee')) / 2 / month_days if F('level_effective_date') > abs_start else P('care_level_monthly_fee') / month_days)"
      - relief_pct: "K('relief_pct_levels_one_two') if (month_level == 'Assisted Living Care Level 1' or month_level == 'Assisted Living Care Level 2') else (K('relief_pct_levels_three_four') if (month_level == 'Assisted Living Care Level 3' or month_level == 'Assisted Living Care Level 4') else P('absence_care_credit_pct'))"
      - plan_member_months: "MONTHS(CFIELD('entrance', 'occupancy_date', status='occupied'), NOW) if EXISTS('entrance', status='occupied') else 0"
      - plan_reduction: "(100 - CPARAM('entrance', 'care_fee_discount_pct', status='occupied')) / 100 if (EXISTS('entrance', status='occupied') and plan_member_months >= K('plan_vesting_months')) else ((100 - K('plan_vesting_half') * CPARAM('entrance', 'care_fee_discount_pct', status='occupied')) / 100 if EXISTS('entrance', status='occupied') else 1)"
      - result: "RND(daily_care_fee * credited_days * relief_pct / 100 * plan_reduction, 2)"
    compute_basis:
      midnights_away: "The midnights away are the absence return date less the absence start date, counted in calendar days."
      ph_date: "a hospital absence followed by a post-hospital reassessment completed no later than post_hospital_reassessment_days calendar days after the return date waits waiting_midnights_documented_hospital midnights"
      waiting_midnights: "The waiting midnights depend on the kind of absence and its medical follow-up, and replace absence_care_credit_after_days as follows: a hospital absence followed by a post-hospital reassessment completed no later than post_hospital_reassessment_days calendar days after the return date waits waiting_midnights_documented_hospital midnights; a rehabilitation-facility absence, or a hospital absence without such a timely post-hospital reassessment, waits waiting_midnights_other_medical midnights; any other absence waits absence_care_credit_after_days midnights."
      tenure_start: "tenure is counted in whole months up to the handling date from the move-in date of the customer's Larkspur independent living residency when the assisted living admission came from Larkspur independent living, and otherwise from the assisted living move-in date"
      waiting_shortening: "tenure of at least tenure_long_months months shortens the waiting by tenure_reduction_long midnights, tenure of at least tenure_mid_months but under tenure_long_months months shortens it by tenure_reduction_mid midnight, and shorter tenure does not shorten it."
      credited_days: "The credited days of the absence-relief credit are the midnights away less the waiting midnights, never below zero and never above absence_care_credit_max_days, the waiting midnights being absence_care_credit_after_days."
      month_period: "It relates to the billing month of the most recent full-month care fee charge on the residency, references that charge, carries the absence start date and is posted at most once per absence per billing month."
      month_charge: "when the care level the residency carries took effect after the absence return date, the daily care fee is the amount of the full-month care fee charge of that billing month divided by its days"
      daily_care_fee: "The daily care fee follows the care level the resident was billed at while away: when the care level the residency carries took effect after the absence return date, the daily care fee is the amount of the full-month care fee charge of that billing month divided by its days; when it took effect after the absence start date and no later than the return date, the absence straddles the change and the daily care fee is the mean of that full-month charge and the care_level_monthly_fee of the level the residency carries, divided by the days in the month; otherwise it is the care_level_monthly_fee of the level the residency carries divided by the days in the month."
      relief_pct: "a charge at Assisted Living Care Level 1 or Assisted Living Care Level 2 is relieved at relief_pct_levels_one_two percent, a charge at Assisted Living Care Level 3 or Assisted Living Care Level 4 at relief_pct_levels_three_four percent, and a charge at any higher level at absence_care_credit_pct percent, each in place of absence_care_credit_pct."
      plan_reduction: "an agreement whose occupancy date is at least plan_vesting_months whole months before the handling date reduces the credit by the plan's full care_fee_discount_pct percent, an occupied agreement of shorter standing reduces it by plan_vesting_half of that percentage, and a customer without an occupied agreement receives the credit in full."
      result: "The absence-relief credit is the daily care fee times the credited days times absence_care_credit_pct percent, rounded once to the cent half up at the end. The waiting shortening, the relief percentage and the plan reduction apply together to the one credit, and rounding happens once at the end."
    factors:
      - id: absence_waiting
        effect: parameter
        decides: waiting_midnights
        bindings: [ph_date, ph_gap, timely_ph, waiting_midnights]
        ladder:
          - when: "a hospital absence followed by a post-hospital reassessment completed no later than post_hospital_reassessment_days calendar days after the return date"
            value: "K('waiting_midnights_documented_hospital')"
          - when: "a rehabilitation-facility absence, or a hospital absence without such a timely post-hospital reassessment"
            value: "K('waiting_midnights_other_medical')"
          - when: "otherwise"
            value: "P('absence_care_credit_after_days')"
        baseline:
          waiting_midnights: "P('absence_care_credit_after_days')"
        evidence: [history, date]
        cross_difficulty: null
      - id: larkspur_tenure_shortening
        effect: parameter
        decides: waiting_shortening
        bindings: [tenure_start, tenure_months, waiting_shortening]
        ladder:
          - when: "Larkspur tenure of at least tenure_long_months months"
            value: "K('tenure_reduction_long')"
          - when: "Larkspur tenure of at least tenure_mid_months but under tenure_long_months months"
            value: "K('tenure_reduction_mid')"
          - when: "otherwise"
            value: "no shortening"
        baseline:
          waiting_shortening: "0"
        evidence: [date, cross_category]
        cross_difficulty: independent
      - id: plan_reduction
        effect: parameter
        decides: plan_reduction
        bindings: [plan_member_months, plan_reduction]
        ladder:
          - when: "an occupied Entrance Fee Agreement whose occupancy date is at least plan_vesting_months whole months before the handling date"
            value: "the credit reduced by the plan's full care_fee_discount_pct percent"
          - when: "an occupied Entrance Fee Agreement of shorter standing"
            value: "the credit reduced by plan_vesting_half of the plan's care_fee_discount_pct percent"
          - when: "otherwise"
            value: "the credit in full"
        baseline:
          plan_reduction: "1"
        evidence: [cross_category, date]
        cross_difficulty: entrance
      - id: billed_level_daily_fee
        effect: method
        decides: daily_care_fee
        bindings: [month_charge, daily_care_fee]
        ladder:
          - when: "the care level the residency carries took effect after the absence return date"
            method: "the daily care fee is the full-month care fee charge of the billing month divided by its days"
          - when: "the care level the residency carries took effect after the absence start date and no later than the return date"
            method: "the daily care fee is the mean of that full-month charge and the care_level_monthly_fee of the level carried, divided by the days in the month"
          - when: "otherwise"
            method: "the daily care fee is the care_level_monthly_fee of the level carried divided by the days in the month"
        baseline:
          daily_care_fee: "P('care_level_monthly_fee') / month_days"
        evidence: [date, history]
        cross_difficulty: null
      - id: level_relief_percentage
        effect: parameter
        decides: relief_pct
        bindings: [month_level, relief_pct]
        ladder:
          - when: "the full-month care fee charge is at Assisted Living Care Level 1 or Assisted Living Care Level 2"
            value: "K('relief_pct_levels_one_two')"
          - when: "the full-month care fee charge is at Assisted Living Care Level 3 or Assisted Living Care Level 4"
            value: "K('relief_pct_levels_three_four')"
          - when: "otherwise"
            value: "P('absence_care_credit_pct')"
        baseline:
          relief_pct: "P('absence_care_credit_pct')"
        evidence: [history, tier_param]
        cross_difficulty: null
    inputs:
      history:
        - {table: assisted_assessments, aggregate: latest, field: assessment_date, filters: {event_type: assisted_assessment_record, assessment_type: post_hospital}}
        - {table: assisted_ledger, aggregate: sum, field: amount, filters: {event_type: assisted_care_fee_charge, charge_basis: full_month}}
        - {table: assisted_ledger, aggregate: latest, field: care_level_billed, filters: {event_type: assisted_care_fee_charge, charge_basis: full_month}}
      cross_category: [independent, entrance]
  - id: assisted_ext_late_fee_assessment
    base_policy_refs: [assisted_payments_and_late_fees]
    overwrite:
      - base_policy: assisted_payments_and_late_fees
        superseded_clause: >-
          The late fee is the greater of late_fee_flat and late_fee_pct percent of assisted_msr_period_past_due rounded to the cent half up, and none is assessed when assisted_msr_period_past_due is below late_fee_min_past_due.
        replaced_by: >-
          The late fee is the greater of late_fee_flat and late_fee_pct percent of the past-due amount, rounded once to the cent half up at the end, and none is assessed when the past-due amount is below late_fee_min_past_due.
    trigger: state_due
    subject: [assisted_late_fee_charge]
    computes: amount
    target_tool: assess_late_fee_246a7744
    params:
      late_fee_window_months: 12
      rate_pct_two_or_more: 3.0
      rate_pct_one: 2.0
      accrual_long_days: 15
      accrual_per_day: 2.0
      accrual_mid_days: 7
      accrual_mid_flat: 10.0
      relief_long_midnights: 15
      relief_long_absence: 0.5
      relief_short_absence: 0.75
      member_long_months: 60
      courtesy_long_member: 0.8
      courtesy_member: 0.9
    rule: >-
      A late fee is assessed once per residency per billing period, for the billing month most recently billed in full, and only once payment_grace_days have passed since the monthly charges of that month were posted.
      A late fee is fixed only after the ledger carries the absence care credit owed for every absence that ended within the billing period it is assessed for.
      The past-due amount of the late fee is the rent, full-month care fee and monthly add-on charges of the billing period, the monthly add-ons being those whose service date is the first day of the billing month, less every credit that carries the billing period and less the payments posted less than one whole month before the handling date.
      The late fee is the greater of late_fee_flat and late_fee_pct percent of the past-due amount, rounded once to the cent half up at the end, and none is assessed when the past-due amount is below late_fee_min_past_due.
      The late fee percentage replaces late_fee_pct according to the late fees posted on the residency in the late_fee_window_months whole months before the handling date: two or more such late fees set it at rate_pct_two_or_more percent, exactly one sets it at rate_pct_one percent, and none leaves it at late_fee_pct percent.
      Continuing lateness adds to the late fee: the days past grace are the calendar days from the posting date of the monthly charges to the handling date, less payment_grace_days; more than accrual_long_days days past grace adds accrual_per_day dollars for each day beyond accrual_long_days, more than accrual_mid_days and no more than accrual_long_days days past grace adds accrual_mid_flat dollars, and fewer days add nothing.
      A hospital or rehabilitation-facility absence during the billing month relieves the late fee: the relief midnights are counted from the later of the absence start date and the first day of the billing month to the earlier of the absence return date and the last day of the billing month; relief_long_midnights or more relief midnights multiply the late fee by relief_long_absence, one to fewer than relief_long_midnights multiply it by relief_short_absence, and no relief midnights leave it unchanged.
      A member of a Larkspur Life Plan receives a courtesy reduction: a customer whose Entrance Fee Agreement is in occupied status with an occupancy date at least member_long_months whole months before the handling date has the late fee multiplied by courtesy_long_member, a customer with an occupied agreement of shorter standing by courtesy_member, and a customer without an occupied agreement has no courtesy reduction.
      The greater-of amount is worked out first on the past-due amount, the continuing-lateness charge is added to it, the sum is then multiplied by the absence relief and by the courtesy reduction, and the result is rounded once at the end.
    baseline:
      rule: >-
        The past-due amount of the late fee is the rent, full-month care fee and monthly add-on charges of the billing period, the monthly add-ons being those whose service date is the first day of the billing month, less every credit that carries the billing period and less the payments posted less than one whole month before the handling date.
        The late fee is the greater of late_fee_flat and late_fee_pct percent of the past-due amount, rounded once to the cent half up at the end, and none is assessed when the past-due amount is below late_fee_min_past_due.
      params: [late_fee_flat, late_fee_pct, late_fee_min_past_due]
    prerequisite:
      - problem: assisted_ext_absence_care_relief
        kind: value_input
        gate: period_credits
        form: state
        policy_source: >-
          A late fee is fixed only after the ledger carries the absence care credit owed for every absence that ended within the billing period it is assessed for.
        condition: >-
          The resident ledger carries an absence care credit for the billing period, referencing that period's full-month care fee charge and the start date of each absence that ended within the period and earns a credit.
        resolved_by: post_absence_care_credit_bb749fc3
        effect: >-
          The absence care credit carries the billing period, so it enters the credits subtracted in the past-due amount and lowers the past-due amount by the credit, which lowers the percentage part of the late fee.
    cross_category:
      - category: entrance
        as: branch
        reads: [status, occupancy_date]
        note: The courtesy reduction is decided by whether the customer holds an occupied Entrance Fee Agreement and how long ago its occupancy began.
    compute:
      - period: "LATEST('assisted_ledger', 'billing_period', date_field='service_from_date', event_type='assisted_rent_charge', charge_basis='full_month')"
      - month_first: "LATEST('assisted_ledger', 'service_from_date', date_field='service_from_date', event_type='assisted_rent_charge', charge_basis='full_month')"
      - month_last: "LATEST('assisted_ledger', 'service_to_date', date_field='service_from_date', event_type='assisted_rent_charge', charge_basis='full_month')"
      - charges_posted_on: "LATEST('assisted_ledger', 'posting_date', date_field='service_from_date', event_type='assisted_rent_charge', charge_basis='full_month')"
      - period_rent: "SUM('assisted_ledger', 'amount', event_type='assisted_rent_charge', charge_basis='full_month', billing_period=period)"
      - period_care: "SUM('assisted_ledger', 'amount', event_type='assisted_care_fee_charge', charge_basis='full_month', billing_period=period)"
      - period_addons: "SUM('assisted_ledger', 'amount', event_type='assisted_addon_charge', billing_period=period, service_date=month_first)"
      - period_credits: "SUM('assisted_ledger', 'amount', event_type='assisted_credit', billing_period=period)"
      - recent_payments: "SUM('assisted_ledger', 'amount', within_months=1, date_field='posting_date', event_type='assisted_payment')"
      - past_due: "MX(period_rent + period_care + period_addons - period_credits - recent_payments, 0)"
      - prior_late_fees: "COUNT('assisted_ledger', within_months=K('late_fee_window_months'), date_field='posting_date', event_type='assisted_late_fee_charge')"
      - late_rate_pct: "K('rate_pct_two_or_more') if prior_late_fees >= 2 else (K('rate_pct_one') if prior_late_fees == 1 else P('late_fee_pct'))"
      - days_past_grace: "DAYS(charges_posted_on, NOW) - P('payment_grace_days')"
      - continuing_charge: "K('accrual_per_day') * (days_past_grace - K('accrual_long_days')) if days_past_grace > K('accrual_long_days') else (K('accrual_mid_flat') if days_past_grace > K('accrual_mid_days') else 0)"
      - relief_midnights: "MX(DAYS(MX(F('absence_start_date'), month_first), MN(F('absence_return_date'), month_last)), 0) if (F('absence_reason') == 'hospital' or F('absence_reason') == 'rehab_facility') else 0"
      - absence_relief: "K('relief_long_absence') if relief_midnights >= K('relief_long_midnights') else (K('relief_short_absence') if relief_midnights >= 1 else 1)"
      - member_months: "MONTHS(CFIELD('entrance', 'occupancy_date', status='occupied'), NOW) if EXISTS('entrance', status='occupied') else 0"
      - member_courtesy: "K('courtesy_long_member') if (EXISTS('entrance', status='occupied') and member_months >= K('member_long_months')) else (K('courtesy_member') if EXISTS('entrance', status='occupied') else 1)"
      - greater_of: "MX(P('late_fee_flat'), past_due * late_rate_pct / 100)"
      - result: "RND((greater_of + continuing_charge) * absence_relief * member_courtesy, 2) if past_due >= P('late_fee_min_past_due') else 0"
    compute_basis:
      period: "A late fee is assessed once per residency per billing period, for the billing month most recently billed in full, and only once payment_grace_days have passed since the monthly charges of that month were posted."
      period_rent: "The past-due amount of the late fee is the rent, full-month care fee and monthly add-on charges of the billing period"
      period_addons: "the monthly add-ons being those whose service date is the first day of the billing month"
      period_credits: "less every credit that carries the billing period"
      recent_payments: "and less the payments posted less than one whole month before the handling date."
      prior_late_fees: "according to the late fees posted on the residency in the late_fee_window_months whole months before the handling date"
      late_rate_pct: "two or more such late fees set it at rate_pct_two_or_more percent, exactly one sets it at rate_pct_one percent, and none leaves it at late_fee_pct percent."
      days_past_grace: "the days past grace are the calendar days from the posting date of the monthly charges to the handling date, less payment_grace_days"
      continuing_charge: "more than accrual_long_days days past grace adds accrual_per_day dollars for each day beyond accrual_long_days, more than accrual_mid_days and no more than accrual_long_days days past grace adds accrual_mid_flat dollars, and fewer days add nothing."
      relief_midnights: "the relief midnights are counted from the later of the absence start date and the first day of the billing month to the earlier of the absence return date and the last day of the billing month"
      absence_relief: "relief_long_midnights or more relief midnights multiply the late fee by relief_long_absence, one to fewer than relief_long_midnights multiply it by relief_short_absence, and no relief midnights leave it unchanged."
      member_courtesy: "a customer whose Entrance Fee Agreement is in occupied status with an occupancy date at least member_long_months whole months before the handling date has the late fee multiplied by courtesy_long_member, a customer with an occupied agreement of shorter standing by courtesy_member, and a customer without an occupied agreement has no courtesy reduction."
      greater_of: "The late fee is the greater of late_fee_flat and late_fee_pct percent of the past-due amount, rounded once to the cent half up at the end, and none is assessed when the past-due amount is below late_fee_min_past_due."
      result: "The greater-of amount is worked out first on the past-due amount, the continuing-lateness charge is added to it, the sum is then multiplied by the absence relief and by the courtesy reduction, and the result is rounded once at the end."
    factors:
      - id: repeat_lateness_rate
        effect: parameter
        decides: late_rate_pct
        bindings: [prior_late_fees, late_rate_pct]
        ladder:
          - when: "two or more late fees posted on the residency in the late_fee_window_months whole months before the handling date"
            value: "K('rate_pct_two_or_more')"
          - when: "exactly one such late fee"
            value: "K('rate_pct_one')"
          - when: "otherwise"
            value: "P('late_fee_pct')"
        baseline:
          late_rate_pct: "P('late_fee_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: continuing_lateness
        effect: method
        decides: continuing_charge
        bindings: [days_past_grace, continuing_charge]
        ladder:
          - when: "more than accrual_long_days days past grace"
            method: "a per-day charge of accrual_per_day dollars for each day beyond accrual_long_days is added to the greater-of amount"
          - when: "more than accrual_mid_days and no more than accrual_long_days days past grace"
            method: "a single accrual_mid_flat dollar charge is added to the greater-of amount"
          - when: "otherwise"
            method: "the greater-of amount stands alone"
        baseline:
          continuing_charge: "0"
        evidence: [date]
        cross_difficulty: null
      - id: hospital_absence_relief
        effect: parameter
        decides: absence_relief
        bindings: [relief_midnights, absence_relief]
        ladder:
          - when: "relief_long_midnights or more midnights of a hospital or rehabilitation-facility absence within the billing month"
            value: "K('relief_long_absence')"
          - when: "one to fewer than relief_long_midnights such midnights"
            value: "K('relief_short_absence')"
          - when: "otherwise"
            value: "unchanged"
        baseline:
          absence_relief: "1"
        evidence: [date]
        cross_difficulty: null
      - id: life_plan_courtesy
        effect: parameter
        decides: member_courtesy
        bindings: [member_months, member_courtesy]
        ladder:
          - when: "an occupied Entrance Fee Agreement whose occupancy date is at least member_long_months whole months before the handling date"
            value: "K('courtesy_long_member')"
          - when: "an occupied Entrance Fee Agreement of shorter standing"
            value: "K('courtesy_member')"
          - when: "otherwise"
            value: "no courtesy reduction"
        baseline:
          member_courtesy: "1"
        evidence: [cross_category, date]
        cross_difficulty: entrance
    inputs:
      history:
        - {table: assisted_ledger, aggregate: sum, field: amount, filters: {event_type: assisted_rent_charge, charge_basis: full_month}}
        - {table: assisted_ledger, aggregate: sum, field: amount, filters: {event_type: assisted_care_fee_charge, charge_basis: full_month}}
        - {table: assisted_ledger, aggregate: sum, field: amount, filters: {event_type: assisted_addon_charge}}
        - {table: assisted_ledger, aggregate: sum, field: amount, filters: {event_type: assisted_credit}}
        - {table: assisted_ledger, aggregate: sum, field: amount, within_months: 1, filters: {event_type: assisted_payment}}
        - {table: assisted_ledger, aggregate: count, field: amount, within_months: 12, filters: {event_type: assisted_late_fee_charge}}
      cross_category: [entrance]
  - id: assisted_ext_level_increase_charge
    base_policy_refs: [assisted_level_change_effective, assisted_monthly_billing, assisted_move_out, assisted_entrance_and_respite_credits, assisted_care_addons, assisted_level_assignment]
    overwrite:
      - base_policy: assisted_level_change_effective
        superseded_clause: >-
          When the effective date falls inside a month already billed, the care fee of that month is split at the effective date: the days from the effective date are charged at the new level as a prorated_level_change charge, and for a decrease the days at the old level from the effective date are returned as a level_change_proration credit referencing the original care fee charge.
        replaced_by: >-
          A care level increase that takes effect inside a month already billed at the earlier level is billed by one level-increase charge on the prorated level change basis, carrying the care level the residency now carries and the span from the first day covered to the last day of that month.
      - base_policy: assisted_level_change_effective
        superseded_clause: >-
          An increase found at a change_of_condition or post_hospital reassessment takes effect on the assessment date, because the added care is delivered from that day.
        replaced_by: >-
          The first day covered follows the kind of reassessment and the timeliness of the written level notice, in place of the assessment date: an increase found at a routine or post-move-in reassessment is covered from the notice date plus level_increase_notice_days calendar days; an increase found at a change-of-condition or post-hospital reassessment whose written level notice was issued more than level_notice_issue_days calendar days after the assessment date is covered from the notice date; an increase found at a change-of-condition or post-hospital reassessment whose notice was issued on time is covered from the assessment date.
      - base_policy: assisted_entrance_and_respite_credits
        superseded_clause: >-
          Holding an Entrance Fee Agreement changes what an assisted living resident pays: while the customer holds an Entrance Fee Agreement in occupied status, each rent charge and each care fee charge receives an entrance_plan_discount credit referencing that charge and the agreement.
        replaced_by: >-
          An Entrance Fee Agreement in occupied status discounts the level-increase charge inside the charge, and no separate plan discount credit follows it: an agreement whose occupancy date is at least plan_vesting_months whole months before the handling date reduces the charge by the plan's full care_fee_discount_pct percent, an occupied agreement of shorter standing reduces it by plan_vesting_half of that percentage, and without an occupied agreement the charge stands in full.
      - base_policy: assisted_entrance_and_respite_credits
        superseded_clause: >-
          The discount percentages are care_fee_discount_pct and rent_discount_pct of the agreement's plan, set in the Entrance Fee Agreement charter, each applied to the charge amount and rounded to the cent half up.
        replaced_by: >-
          Every other rent charge and care fee charge of a customer holding an Entrance Fee Agreement in occupied status keeps its separate entrance plan discount credit referencing that charge and the agreement, at the plan's rent_discount_pct or care_fee_discount_pct applied to the charge amount and rounded to the cent half up once the occupancy date is at least plan_vesting_months whole months old on the posting date, and at plan_vesting_half of those percentages before then.
      - base_policy: assisted_care_addons
        superseded_clause: >-
          Monthly add-ons follow the care level in effect on the first day of the billing month; a level change during the month changes the monthly add-ons from the next billing month.
        replaced_by: >-
          Monthly add-ons the new level reprices are not billed twice for the days covered: when an escort assistance or incontinence care add-on billed for the month is included at the new level, every such included add-on is offset in full for the days covered; when none is included but an insulin management, diabetic monitoring or oxygen management add-on billed for the month is priced lower at the new level, the amount by which each was billed above the new level's fee is offset for the days covered; otherwise nothing is offset.
      - base_policy: assisted_monthly_billing
        superseded_clause: >-
          Rent and the care level fee are billed in advance on fee_due_day of each calendar month for the whole month: rent at the contracted monthly_base_rent and the care fee at care_level_monthly_fee of the level billed.
        replaced_by: >-
          A large increase is phased in, decided by the rise from the care points of the most recent routine reassessment to the care points the residency now carries: a rise of phase_large_points points or more bills phase_share_large of the difference, a rise of phase_mid_points points or more but under phase_large_points bills phase_share_mid of it, and a smaller rise bills the whole difference.
      - base_policy: assisted_monthly_billing
        superseded_clause: >-
          The move-in month, the month of a level or rent change and the month in which fees end are prorated: the daily amount is the monthly amount divided by the actual number of days in that calendar month, multiplied by the days billed counted inclusive of both ends, and rounded once to the cent half up.
        replaced_by: >-
          The level-increase charge bills the difference between the care_level_monthly_fee of the level the residency now carries and the full-month care fee charged for that month, divided by the days in that month, for each day covered, rounded once to the cent half up at the end.
      - base_policy: assisted_level_assignment
        superseded_clause: >-
          The care level of a resident is always the level whose care_points_min to care_points_max band contains the care points of the most recent assessment; there is no discretionary level and the level billed never differs from the band of the latest assessment once its effective date has passed.
        replaced_by: >-
          The first day covered governs what the level-increase charge bills even where the level's recorded effective date is earlier, so the new level's care_level_monthly_fee is billed only from that day; the care level the residency carries and the level stated on the written notice are not changed by it.
    trigger: state_due
    subject: [assisted_care_fee_charge]
    computes: amount
    target_tool: post_level_increase_care_charge_9f33663f
    params:
      phase_large_points: 30
      phase_mid_points: 15
      phase_share_large: 0.5
      phase_share_mid: 0.75
      plan_vesting_months: 60
      plan_vesting_half: 0.5
    rule: >-
      A care level increase that takes effect inside a month already billed at the earlier level is billed by one level-increase charge on the prorated level change basis, carrying the care level the residency now carries and the span from the first day covered to the last day of that month.
      A decrease is never billed by the level-increase charge: it takes effect on the first day of the calendar month following the assessment date, and where that day falls inside a month already billed the days at the old level from that day are returned as a level change proration credit referencing the original care fee charge.
      The level-increase charge covers the days from the assessment date of the latest assessment through the last day of the billing month of the most recent full-month care fee charge, counting both days.
      The level-increase charge bills the difference between the care_level_monthly_fee of the level the residency now carries and the full-month care fee charged for that month, divided by the days in that month, for each day covered, rounded once to the cent half up at the end.
      The first day covered follows the kind of reassessment and the timeliness of the written level notice, in place of the assessment date: an increase found at a routine or post-move-in reassessment is covered from the notice date plus level_increase_notice_days calendar days; an increase found at a change-of-condition or post-hospital reassessment whose written level notice was issued more than level_notice_issue_days calendar days after the assessment date is covered from the notice date; an increase found at a change-of-condition or post-hospital reassessment whose notice was issued on time is covered from the assessment date.
      The first day covered governs what the level-increase charge bills even where the level's recorded effective date is earlier, so the new level's care_level_monthly_fee is billed only from that day; the care level the residency carries and the level stated on the written notice are not changed by it.
      A large increase is phased in, decided by the rise from the care points of the most recent routine reassessment to the care points the residency now carries: a rise of phase_large_points points or more bills phase_share_large of the difference, a rise of phase_mid_points points or more but under phase_large_points bills phase_share_mid of it, and a smaller rise bills the whole difference.
      Monthly add-ons the new level reprices are not billed twice for the days covered: when an escort assistance or incontinence care add-on billed for the month is included at the new level, every such included add-on is offset in full for the days covered; when none is included but an insulin management, diabetic monitoring or oxygen management add-on billed for the month is priced lower at the new level, the amount by which each was billed above the new level's fee is offset for the days covered; otherwise nothing is offset.
      The add-on offset is each offset monthly amount divided by the days in the month, for each day covered.
      An Entrance Fee Agreement in occupied status discounts the level-increase charge inside the charge, and no separate plan discount credit follows it: an agreement whose occupancy date is at least plan_vesting_months whole months before the handling date reduces the charge by the plan's full care_fee_discount_pct percent, an occupied agreement of shorter standing reduces it by plan_vesting_half of that percentage, and without an occupied agreement the charge stands in full.
      Every other rent charge and care fee charge of a customer holding an Entrance Fee Agreement in occupied status keeps its separate entrance plan discount credit referencing that charge and the agreement, at the plan's rent_discount_pct or care_fee_discount_pct applied to the charge amount and rounded to the cent half up once the occupancy date is at least plan_vesting_months whole months old on the posting date, and at plan_vesting_half of those percentages before then.
      Outside the level-increase charge the general billing rules stand: rent and the care level fee are billed in advance on fee_due_day of each calendar month for the whole month at the contracted monthly_base_rent and the care_level_monthly_fee of the level billed; the move-in month, the month of a rent change and the month in which fees end are prorated by the monthly amount divided by the actual days of that month, multiplied by the days billed counted inclusive of both ends and rounded once to the cent half up; and the care level a resident carries is always the level whose care_points_min to care_points_max band contains the care points of the most recent assessment.
      The difference for the days covered is phased first, the add-on offset is then subtracted from the phased amount, never going below zero, the plan discount is applied to what remains, and the result is rounded once at the end.
    baseline:
      rule: >-
        The level-increase charge covers the days from the assessment date of the latest assessment through the last day of the billing month of the most recent full-month care fee charge, counting both days.
        The level-increase charge bills the difference between the care_level_monthly_fee of the level the residency now carries and the full-month care fee charged for that month, divided by the days in that month, for each day covered, rounded once to the cent half up at the end.
      params: [care_level_monthly_fee]
    prerequisite: []
    cross_category:
      - category: entrance
        as: branch
        reads: [status, occupancy_date, care_fee_discount_pct]
        note: The plan discount inside the level-increase charge is decided by the customer's occupied Entrance Fee Agreement, how long ago its occupancy began, and its plan's care discount.
    compute:
      - asmt_date: "LATEST('assisted_assessments', 'assessment_date', date_field='assessment_date', event_type='assisted_assessment_record')"
      - asmt_type: "LATEST('assisted_assessments', 'assessment_type', date_field='assessment_date', event_type='assisted_assessment_record')"
      - notice_date: "LATEST('assisted_assessments', 'notice_date', date_field='notice_date', event_type='assisted_level_notice')"
      - month_period: "LATEST('assisted_ledger', 'billing_period', date_field='service_from_date', event_type='assisted_care_fee_charge', charge_basis='full_month')"
      - month_last: "LATEST('assisted_ledger', 'service_to_date', date_field='service_from_date', event_type='assisted_care_fee_charge', charge_basis='full_month')"
      - month_days: "LATEST('assisted_ledger', 'days_in_period', date_field='service_from_date', event_type='assisted_care_fee_charge', charge_basis='full_month')"
      - month_care_charged: "SUM('assisted_ledger', 'amount', event_type='assisted_care_fee_charge', charge_basis='full_month', billing_period=month_period)"
      - notice_late: "DAYS(asmt_date, notice_date) > P('level_notice_issue_days')"
      - days_covered: "MX(DAYS(notice_date, month_last) + 1 - P('level_increase_notice_days'), 0) if (asmt_type == 'routine' or asmt_type == 'post_move_in') else (DAYS(notice_date, month_last) + 1 if notice_late else DAYS(asmt_date, month_last) + 1)"
      - routine_points: "LATEST('assisted_assessments', 'care_points', date_field='assessment_date', event_type='assisted_assessment_record', assessment_type='routine')"
      - point_rise: "F('care_points') - routine_points"
      - phase_share: "K('phase_share_large') if point_rise >= K('phase_large_points') else (K('phase_share_mid') if point_rise >= K('phase_mid_points') else 1)"
      - escort_billed: "SUM('assisted_ledger', 'amount', event_type='assisted_addon_charge', addon_code='escort_assistance', billing_period=month_period)"
      - incontinence_billed: "SUM('assisted_ledger', 'amount', event_type='assisted_addon_charge', addon_code='incontinence_care', billing_period=month_period)"
      - insulin_billed: "SUM('assisted_ledger', 'amount', event_type='assisted_addon_charge', addon_code='insulin_management', billing_period=month_period)"
      - diabetic_billed: "SUM('assisted_ledger', 'amount', event_type='assisted_addon_charge', addon_code='diabetic_monitoring', billing_period=month_period)"
      - oxygen_billed: "SUM('assisted_ledger', 'amount', event_type='assisted_addon_charge', addon_code='oxygen_management', billing_period=month_period)"
      - included_amount: "(escort_billed if P('escort_assistance_included') else 0) + (incontinence_billed if P('incontinence_care_included') else 0)"
      - repriced_amount: "(MX(insulin_billed - P('insulin_management_fee'), 0) if insulin_billed > 0 else 0) + (MX(diabetic_billed - P('diabetic_monitoring_fee'), 0) if diabetic_billed > 0 else 0) + (MX(oxygen_billed - P('oxygen_management_fee'), 0) if oxygen_billed > 0 else 0)"
      - offset_monthly: "included_amount if included_amount > 0 else (repriced_amount if repriced_amount > 0 else 0)"
      - plan_member_months: "MONTHS(CFIELD('entrance', 'occupancy_date', status='occupied'), NOW) if EXISTS('entrance', status='occupied') else 0"
      - plan_discount_share: "(100 - CPARAM('entrance', 'care_fee_discount_pct', status='occupied')) / 100 if (EXISTS('entrance', status='occupied') and plan_member_months >= K('plan_vesting_months')) else ((100 - K('plan_vesting_half') * CPARAM('entrance', 'care_fee_discount_pct', status='occupied')) / 100 if EXISTS('entrance', status='occupied') else 1)"
      - phased_difference: "(P('care_level_monthly_fee') - month_care_charged) / month_days * days_covered * phase_share"
      - addon_offset: "offset_monthly / month_days * days_covered"
      - result: "RND(MX(phased_difference - addon_offset, 0) * plan_discount_share, 2)"
    compute_basis:
      asmt_date: "The level-increase charge covers the days from the assessment date of the latest assessment through the last day of the billing month of the most recent full-month care fee charge, counting both days."
      month_care_charged: "the full-month care fee charged for that month"
      notice_late: "whose written level notice was issued more than level_notice_issue_days calendar days after the assessment date"
      days_covered: "The first day covered follows the kind of reassessment and the timeliness of the written level notice, in place of the assessment date: an increase found at a routine or post-move-in reassessment is covered from the notice date plus level_increase_notice_days calendar days; an increase found at a change-of-condition or post-hospital reassessment whose written level notice was issued more than level_notice_issue_days calendar days after the assessment date is covered from the notice date; an increase found at a change-of-condition or post-hospital reassessment whose notice was issued on time is covered from the assessment date."
      routine_points: "decided by the rise from the care points of the most recent routine reassessment to the care points the residency now carries"
      phase_share: "a rise of phase_large_points points or more bills phase_share_large of the difference, a rise of phase_mid_points points or more but under phase_large_points bills phase_share_mid of it, and a smaller rise bills the whole difference."
      escort_billed: "when an escort assistance or incontinence care add-on billed for the month is included at the new level, every such included add-on is offset in full for the days covered"
      insulin_billed: "when none is included but an insulin management, diabetic monitoring or oxygen management add-on billed for the month is priced lower at the new level, the amount by which each was billed above the new level's fee is offset for the days covered"
      offset_monthly: "Monthly add-ons the new level reprices are not billed twice for the days covered: when an escort assistance or incontinence care add-on billed for the month is included at the new level, every such included add-on is offset in full for the days covered; when none is included but an insulin management, diabetic monitoring or oxygen management add-on billed for the month is priced lower at the new level, the amount by which each was billed above the new level's fee is offset for the days covered; otherwise nothing is offset."
      addon_offset: "The add-on offset is each offset monthly amount divided by the days in the month, for each day covered."
      plan_discount_share: "an agreement whose occupancy date is at least plan_vesting_months whole months before the handling date reduces the charge by the plan's full care_fee_discount_pct percent, an occupied agreement of shorter standing reduces it by plan_vesting_half of that percentage, and without an occupied agreement the charge stands in full."
      phased_difference: "The level-increase charge bills the difference between the care_level_monthly_fee of the level the residency now carries and the full-month care fee charged for that month, divided by the days in that month, for each day covered, rounded once to the cent half up at the end."
      result: "The difference for the days covered is phased first, the add-on offset is then subtracted from the phased amount, never going below zero, the plan discount is applied to what remains, and the result is rounded once at the end."
    factors:
      - id: increase_start_day
        effect: method
        decides: days_covered
        bindings: [notice_late, days_covered]
        ladder:
          - when: "an increase found at a routine or post-move-in reassessment"
            method: "days are covered from the notice date plus level_increase_notice_days calendar days"
          - when: "an increase found at a change-of-condition or post-hospital reassessment whose written level notice was issued more than level_notice_issue_days calendar days after the assessment date"
            method: "days are covered from the notice date"
          - when: "an increase found at a change-of-condition or post-hospital reassessment whose notice was issued on time"
            method: "days are covered from the assessment date"
        baseline:
          days_covered: "DAYS(asmt_date, month_last) + 1"
        evidence: [history, date]
        cross_difficulty: null
      - id: increase_phase_in
        effect: parameter
        decides: phase_share
        bindings: [routine_points, point_rise, phase_share]
        ladder:
          - when: "care points risen by phase_large_points or more over the most recent routine reassessment"
            value: "K('phase_share_large')"
          - when: "care points risen by phase_mid_points or more but under phase_large_points"
            value: "K('phase_share_mid')"
          - when: "otherwise"
            value: "the whole difference"
        baseline:
          phase_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: included_addon_offset
        effect: method
        decides: offset_monthly
        bindings: [escort_billed, incontinence_billed, insulin_billed, diabetic_billed, oxygen_billed, included_amount, repriced_amount, offset_monthly]
        ladder:
          - when: "an escort assistance or incontinence care add-on billed for the month is included at the new level"
            method: "each included add-on is offset in full for the days covered"
          - when: "no billed add-on is included at the new level, but an insulin management, diabetic monitoring or oxygen management add-on billed for the month is priced lower at the new level"
            method: "only the amount billed above the new level's fee is offset for the days covered"
          - when: "otherwise"
            method: "nothing is offset"
        baseline:
          offset_monthly: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: plan_discount_inside_charge
        effect: parameter
        decides: plan_discount_share
        bindings: [plan_member_months, plan_discount_share]
        ladder:
          - when: "an occupied Entrance Fee Agreement whose occupancy date is at least plan_vesting_months whole months before the handling date"
            value: "the charge reduced by the plan's full care_fee_discount_pct percent"
          - when: "an occupied Entrance Fee Agreement of shorter standing"
            value: "the charge reduced by plan_vesting_half of the plan's care_fee_discount_pct percent"
          - when: "otherwise"
            value: "the charge in full"
        baseline:
          plan_discount_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: entrance
    inputs:
      history:
        - {table: assisted_assessments, aggregate: latest, field: assessment_date, filters: {event_type: assisted_assessment_record}}
        - {table: assisted_assessments, aggregate: latest, field: notice_date, filters: {event_type: assisted_level_notice}}
        - {table: assisted_ledger, aggregate: sum, field: amount, filters: {event_type: assisted_care_fee_charge, charge_basis: full_month}}
        - {table: assisted_ledger, aggregate: sum, field: amount, filters: {event_type: assisted_addon_charge}}
      cross_category: [entrance]
  - id: assisted_ext_apartment_transfer_fee
    base_policy_refs: [assisted_rent_and_apartment, assisted_care_addons]
    overwrite:
      - base_policy: assisted_rent_and_apartment
        superseded_clause: >-
          A resident may move to another assisted living apartment in the same community at their signed request while the residency is active; the new rent is apartment_base_rent of the new apartment type on the change date, effective from possession, and apartment_change_fee is charged once.
        replaced_by: >-
          A resident may move to another assisted living apartment in the same community at the signed request of the resident or of a representative whose representative_authority is financial_poa, durable_poa or guardian while the residency is active; the new rent is apartment_base_rent of the new apartment type on the change date, effective from possession, and the transfer fee is charged once with the change.
      - base_policy: assisted_care_addons
        superseded_clause: >-
          Guest meals are charged at guest_meal_fee per meal, ltc_direct_billing_fee is charged monthly while ltc_direct_billing is true, apartment_change_fee is charged once per resident-requested apartment change, and returned_payment_fee is charged once per returned payment referencing it.
        replaced_by: >-
          The transfer fee is apartment_change_fee, rounded once to the cent half up at the end.
    trigger: on_request
    subject: [assisted_apartment_change, assisted_addon_charge]
    computes: transfer_fee
    target_tool: sign_apartment_change_e633e519
    params:
      recent_care_months: 2
      care_share_both: 0.5
      care_share_one: 0.75
      tenure_long_months: 60
      tenure_mid_months: 24
      tenure_share_long: 0.8
      tenure_share_mid: 0.9
      repeat_window_months: 24
      repeat_share_two: 1.5
      repeat_share_one: 1.25
      plan_share_lifecare: 0.5
      plan_share_member: 0.75
      standing_window_months: 12
      standing_share_two: 1.2
      standing_share_one: 1.1
    rule: >-
      A resident may move to another assisted living apartment in the same community at the signed request of the resident or of a representative whose representative_authority is financial_poa, durable_poa or guardian while the residency is active; the new rent is apartment_base_rent of the new apartment type on the change date, effective from possession, and the transfer fee is charged once with the change.
      The transfer fee for a move is fixed only after the ledger carries the prorated care fee charge owed for the current billing month at the care level of the latest assessment.
      The transfer fee is not fixed until the ledger carries the late fee owed for every billing period left unpaid past its grace period.
      The transfer fee is apartment_change_fee, rounded once to the cent half up at the end.
      A move that follows a change in care needs is charged a reduced share: when the residency has a change-of-condition or post-hospital reassessment completed in the recent_care_months whole months before the handling date and the ledger carries a care fee charge on the prorated level change basis for the current billing month, the share is care_share_both; when exactly one of those two holds, the share is care_share_one; when neither holds, the full fee applies.
      Larkspur tenure lowers the transfer fee, tenure being counted in whole months up to the handling date from a starting date chosen by how the resident came to assisted living: from the move-in date of the customer's Larkspur independent living residency when the admission came from Larkspur independent living, from the check-in date of the customer's converted Larkspur respite stay when the admission came from a Larkspur respite stay, and from the assisted living move-in date otherwise.
      Tenure of at least tenure_long_months months takes tenure_share_long of the fee, tenure of at least tenure_mid_months but under tenure_long_months months takes tenure_share_mid, and shorter tenure takes the full fee.
      Repeated moves cost more, counted by the apartment change fees charged on the residency with a service date in the repeat_window_months whole months before the handling date: two or more such fees take repeat_share_two of the fee, exactly one takes repeat_share_one, and none takes the full fee.
      A Larkspur Life Plan member pays a reduced fee: a customer holding an Entrance Fee Agreement in occupied status under a lifecare plan takes plan_share_lifecare of the fee, under any other plan plan_share_member, and a customer without an occupied agreement takes the full fee.
      Payment standing raises the fee, counted by the late fees posted on the residency in the standing_window_months whole months before the handling date: two or more take standing_share_two of the fee, exactly one takes standing_share_one, and none takes the full fee.
      The shares for care needs, tenure, repeated moves, plan membership and payment standing each multiply the same apartment_change_fee one after another, the order not changing the product, and the transfer fee is rounded once at the end.
    baseline:
      rule: >-
        The transfer fee is apartment_change_fee, rounded once to the cent half up at the end.
      params: [apartment_change_fee]
    prerequisite:
      - problem: assisted_ext_level_increase_charge
        kind: value_input
        gate: increase_billed
        form: state
        policy_source: >-
          The transfer fee for a move is fixed only after the ledger carries the prorated care fee charge owed for the current billing month at the care level of the latest assessment.
        condition: >-
          The resident ledger carries, for the billing month of the most recent full-month charges, a care fee charge on the prorated level change basis at the care level the residency now carries, the level of its latest assessment.
        resolved_by: post_level_increase_care_charge_9f33663f
        effect: >-
          The count of prorated level change care fee charges for the current billing month rises from zero to one, which moves the care-needs share one tier lower: from the full fee to care_share_one, or from care_share_one to care_share_both when a recent change-of-condition or post-hospital reassessment also stands.
      - problem: assisted_ext_late_fee_assessment
        kind: value_input
        gate: late_fees_in_window
        form: state
        policy_source: >-
          The transfer fee is not fixed until the ledger carries the late fee owed for every billing period left unpaid past its grace period.
        condition: >-
          The resident ledger carries a late fee charge for every billing period whose monthly charges stayed unpaid past the grace period and on which a late fee is owed.
        resolved_by: assess_late_fee_246a7744
        effect: >-
          The count of late fees posted in the standing window rises by one, which moves the payment-standing share up one tier.
    cross_category:
      - category: independent
        as: history
        reads: [move_in_date]
        note: The tenure starting date of a resident who came from Larkspur independent living is the move-in date of that residency.
      - category: respite
        as: history
        reads: [check_in_date, status]
        note: The tenure starting date of a resident who came from a Larkspur respite stay is the check-in date of the converted stay.
      - category: entrance
        as: branch
        reads: [status, contract_type]
        note: The plan-membership share is decided by the customer's occupied Entrance Fee Agreement and its plan type.
    compute:
      - period: "LATEST('assisted_ledger', 'billing_period', date_field='service_from_date', event_type='assisted_rent_charge', charge_basis='full_month')"
      - recent_care_assessments: "COUNT('assisted_assessments', within_months=K('recent_care_months'), date_field='assessment_date', event_type='assisted_assessment_record', assessment_type='post_hospital') + COUNT('assisted_assessments', within_months=K('recent_care_months'), date_field='assessment_date', event_type='assisted_assessment_record', assessment_type='change_of_condition')"
      - increase_billed: "COUNT('assisted_ledger', event_type='assisted_care_fee_charge', charge_basis='prorated_level_change', billing_period=period)"
      - care_share: "K('care_share_both') if (recent_care_assessments >= 1 and increase_billed >= 1) else (K('care_share_one') if (recent_care_assessments >= 1 or increase_billed >= 1) else 1)"
      - tenure_start: "CFIELD('independent', 'move_in_date') if F('admission_source') == 'larkspur_independent' else (CFIELD('respite', 'check_in_date', status='converted') if F('admission_source') == 'larkspur_respite' else F('move_in_date'))"
      - tenure_months: "MONTHS(tenure_start, NOW)"
      - tenure_share: "K('tenure_share_long') if tenure_months >= K('tenure_long_months') else (K('tenure_share_mid') if tenure_months >= K('tenure_mid_months') else 1)"
      - prior_moves: "COUNT('assisted_ledger', within_months=K('repeat_window_months'), date_field='service_date', event_type='assisted_addon_charge', addon_code='apartment_change')"
      - repeat_share: "K('repeat_share_two') if prior_moves >= 2 else (K('repeat_share_one') if prior_moves == 1 else 1)"
      - plan_share: "K('plan_share_lifecare') if CPARAM('entrance', 'contract_type', status='occupied') == 'lifecare' else (K('plan_share_member') if EXISTS('entrance', status='occupied') else 1)"
      - late_fees_in_window: "COUNT('assisted_ledger', within_months=K('standing_window_months'), date_field='posting_date', event_type='assisted_late_fee_charge')"
      - standing_share: "K('standing_share_two') if late_fees_in_window >= 2 else (K('standing_share_one') if late_fees_in_window == 1 else 1)"
      - result: "RND(P('apartment_change_fee') * care_share * tenure_share * repeat_share * plan_share * standing_share, 2)"
    compute_basis:
      recent_care_assessments: "when the residency has a change-of-condition or post-hospital reassessment completed in the recent_care_months whole months before the handling date"
      increase_billed: "and the ledger carries a care fee charge on the prorated level change basis for the current billing month"
      care_share: "A move that follows a change in care needs is charged a reduced share: when the residency has a change-of-condition or post-hospital reassessment completed in the recent_care_months whole months before the handling date and the ledger carries a care fee charge on the prorated level change basis for the current billing month, the share is care_share_both; when exactly one of those two holds, the share is care_share_one; when neither holds, the full fee applies."
      tenure_start: "from the move-in date of the customer's Larkspur independent living residency when the admission came from Larkspur independent living, from the check-in date of the customer's converted Larkspur respite stay when the admission came from a Larkspur respite stay, and from the assisted living move-in date otherwise."
      tenure_share: "Tenure of at least tenure_long_months months takes tenure_share_long of the fee, tenure of at least tenure_mid_months but under tenure_long_months months takes tenure_share_mid, and shorter tenure takes the full fee."
      prior_moves: "counted by the apartment change fees charged on the residency with a service date in the repeat_window_months whole months before the handling date"
      repeat_share: "two or more such fees take repeat_share_two of the fee, exactly one takes repeat_share_one, and none takes the full fee."
      plan_share: "a customer holding an Entrance Fee Agreement in occupied status under a lifecare plan takes plan_share_lifecare of the fee, under any other plan plan_share_member, and a customer without an occupied agreement takes the full fee."
      late_fees_in_window: "counted by the late fees posted on the residency in the standing_window_months whole months before the handling date"
      standing_share: "two or more take standing_share_two of the fee, exactly one takes standing_share_one, and none takes the full fee."
      result: "The shares for care needs, tenure, repeated moves, plan membership and payment standing each multiply the same apartment_change_fee one after another, the order not changing the product, and the transfer fee is rounded once at the end."
    factors:
      - id: care_needs_share
        effect: parameter
        decides: care_share
        bindings: [recent_care_assessments, increase_billed, care_share]
        ladder:
          - when: "a change-of-condition or post-hospital reassessment in the recent_care_months whole months before the handling date and a prorated level change care fee charge for the current billing month"
            value: "K('care_share_both')"
          - when: "exactly one of those two"
            value: "K('care_share_one')"
          - when: "otherwise"
            value: "the full fee"
        baseline:
          care_share: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: tenure_start_date
        effect: method
        decides: tenure_start
        bindings: [tenure_start]
        ladder:
          - when: "the assisted living admission came from Larkspur independent living"
            method: "tenure is counted from the move-in date of the customer's Larkspur independent living residency"
          - when: "the assisted living admission came from a Larkspur respite stay"
            method: "tenure is counted from the check-in date of the converted respite stay"
          - when: "otherwise"
            method: "tenure is counted from the assisted living move-in date"
        baseline:
          tenure_start: "F('move_in_date')"
        evidence: [cross_category, date]
        cross_difficulty: independent
      - id: tenure_share
        effect: parameter
        decides: tenure_share
        bindings: [tenure_months, tenure_share]
        ladder:
          - when: "tenure of at least tenure_long_months months"
            value: "K('tenure_share_long')"
          - when: "tenure of at least tenure_mid_months but under tenure_long_months months"
            value: "K('tenure_share_mid')"
          - when: "otherwise"
            value: "the full fee"
        baseline:
          tenure_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: repeat_move_share
        effect: parameter
        decides: repeat_share
        bindings: [prior_moves, repeat_share]
        ladder:
          - when: "two or more apartment change fees with a service date in the repeat_window_months whole months before the handling date"
            value: "K('repeat_share_two')"
          - when: "exactly one such fee"
            value: "K('repeat_share_one')"
          - when: "otherwise"
            value: "the full fee"
        baseline:
          repeat_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: life_plan_member_share
        effect: parameter
        decides: plan_share
        bindings: [plan_share]
        ladder:
          - when: "an occupied Entrance Fee Agreement under a lifecare plan"
            value: "K('plan_share_lifecare')"
          - when: "an occupied Entrance Fee Agreement under any other plan"
            value: "K('plan_share_member')"
          - when: "otherwise"
            value: "the full fee"
        baseline:
          plan_share: "1"
        evidence: [cross_category]
        cross_difficulty: entrance
      - id: payment_standing_share
        effect: parameter
        decides: standing_share
        bindings: [late_fees_in_window, standing_share]
        ladder:
          - when: "two or more late fees posted in the standing_window_months whole months before the handling date"
            value: "K('standing_share_two')"
          - when: "exactly one such late fee"
            value: "K('standing_share_one')"
          - when: "otherwise"
            value: "the full fee"
        baseline:
          standing_share: "1"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: assisted_assessments, aggregate: count, field: assessment_date, within_months: 2, filters: {event_type: assisted_assessment_record}}
        - {table: assisted_ledger, aggregate: count, field: amount, filters: {event_type: assisted_care_fee_charge, charge_basis: prorated_level_change}}
        - {table: assisted_ledger, aggregate: count, field: amount, within_months: 24, filters: {event_type: assisted_addon_charge, addon_code: apartment_change}}
        - {table: assisted_ledger, aggregate: count, field: amount, within_months: 12, filters: {event_type: assisted_late_fee_charge}}
      cross_category: [independent, respite, entrance]
  - id: assisted_ext_returned_payment_fee
    base_policy_refs: [assisted_care_addons, assisted_payments_and_late_fees]
    overwrite:
      - base_policy: assisted_care_addons
        superseded_clause: >-
          Guest meals are charged at guest_meal_fee per meal, ltc_direct_billing_fee is charged monthly while ltc_direct_billing is true, apartment_change_fee is charged once per resident-requested apartment change, and returned_payment_fee is charged once per returned payment referencing it.
        replaced_by: >-
          One returned-payment charge is posted for each payment returned unpaid by the bank, referencing the entry that reinstated it, and it is the only charge that return carries.
      - base_policy: assisted_payments_and_late_fees
        superseded_clause: >-
          A returned payment is reinstated referencing the payment entry returned and carries returned_payment_fee.
        replaced_by: >-
          The returned-payment charge is returned_payment_fee, rounded once to the cent half up at the end.
    trigger: state_due
    subject: [assisted_addon_charge]
    computes: amount
    target_tool: post_returned_payment_fee_036f277a
    params:
      large_return_threshold: 4000.0
      large_return_pct: 1.5
      return_window_months: 12
      escalation_two_or_more: 1.5
      escalation_one: 1.25
      member_long_months: 60
      member_share_long: 0.8
      member_share_short: 0.9
      tenure_long_months: 60
      tenure_mid_months: 24
      tenure_share_long: 0.9
      tenure_share_mid: 0.95
    rule: >-
      One returned-payment charge is posted for each payment returned unpaid by the bank, referencing the entry that reinstated it, and it is the only charge that return carries.
      Guest meals remain charged at guest_meal_fee per meal, and ltc_direct_billing_fee remains charged monthly while ltc_direct_billing is true.
      The returned-payment charge is returned_payment_fee, rounded once to the cent half up at the end.
      The basis of the returned-payment charge follows the instrument and size of the payment returned, in place of returned_payment_fee: a returned payment from a long-term care insurer carries no charge, because an insurer transfer reversed by the bank is a processing error and not the household's; a returned household payment of large_return_threshold dollars or more is charged large_return_pct percent of the amount returned; any other returned payment is charged returned_payment_fee.
      Repeated returns raise the charge, counted by the returned payments reinstated on the residency in the return_window_months whole months before the handling date other than the one being charged, together with the returned payments reinstated on the customer's Larkspur independent living account in the same window: two or more on either account multiply the charge by escalation_two_or_more, one on either account by escalation_one, and none leaves it unchanged.
      A Larkspur Life Plan member receives a courtesy reduction: a customer holding an Entrance Fee Agreement in occupied status with an occupancy date at least member_long_months whole months before the handling date pays member_share_long of the charge, a customer with an occupied agreement of shorter standing pays member_share_short of it, and a customer without an occupied agreement pays it in full.
      Long Larkspur residence lowers the charge, residence being counted in whole months up to the handling date from the move-in date of the customer's Larkspur independent living residency when the assisted living admission came from Larkspur independent living, and from the assisted living move-in date otherwise: tenure_long_months months or more pay tenure_share_long of the charge, tenure_mid_months months or more but under tenure_long_months pay tenure_share_mid, and shorter residence pays it in full.
      The basis is worked out first and then multiplied by the repeat multiplier, the member share and the residence share, and the result is rounded once at the end.
    baseline:
      rule: >-
        The returned-payment charge is returned_payment_fee, rounded once to the cent half up at the end.
      params: [returned_payment_fee]
    prerequisite: []
    cross_category:
      - category: independent
        as: history
        reads: [independent_ledger.event_type, independent_ledger.posting_date, move_in_date]
        note: The repeat multiplier counts the returned payments on the customer's independent living ledger, and the residence share counts from that residency's move-in date.
      - category: entrance
        as: branch
        reads: [status, occupancy_date]
        note: The member share is decided by the customer's occupied Entrance Fee Agreement and its occupancy date.
    compute:
      - returned_amount: "LATEST('assisted_ledger', 'amount', date_field='posting_date', event_type='assisted_payment_return')"
      - returned_source: "LATEST('assisted_ledger', 'source_entry_id', date_field='posting_date', event_type='assisted_payment_return')"
      - returned_payer: "LATEST('assisted_ledger', 'payer_type', date_field='posting_date', event_type='assisted_payment', assisted_entry_id=returned_source)"
      - charge_basis_amount: "0 if returned_payer == 'ltc_insurer' else (returned_amount * K('large_return_pct') / 100 if returned_amount >= K('large_return_threshold') else P('returned_payment_fee'))"
      - prior_returns: "COUNT('assisted_ledger', within_months=K('return_window_months'), date_field='posting_date', event_type='assisted_payment_return') - 1"
      - household_returns: "XCOUNT('independent', 'independent_ledger', within_months=K('return_window_months'), date_field='posting_date', event_type='independent_payment_return')"
      - repeat_multiplier: "K('escalation_two_or_more') if (prior_returns >= 2 or household_returns >= 2) else (K('escalation_one') if (prior_returns >= 1 or household_returns >= 1) else 1)"
      - member_months: "MONTHS(CFIELD('entrance', 'occupancy_date', status='occupied'), NOW) if EXISTS('entrance', status='occupied') else 0"
      - member_share: "K('member_share_long') if (EXISTS('entrance', status='occupied') and member_months >= K('member_long_months')) else (K('member_share_short') if EXISTS('entrance', status='occupied') else 1)"
      - residence_start: "CFIELD('independent', 'move_in_date') if F('admission_source') == 'larkspur_independent' else F('move_in_date')"
      - residence_months: "MONTHS(residence_start, NOW)"
      - residence_share: "K('tenure_share_long') if residence_months >= K('tenure_long_months') else (K('tenure_share_mid') if residence_months >= K('tenure_mid_months') else 1)"
      - result: "RND(charge_basis_amount * repeat_multiplier * member_share * residence_share, 2)"
    compute_basis:
      returned_amount: "a returned household payment of large_return_threshold dollars or more is charged large_return_pct percent of the amount returned"
      returned_payer: "a returned payment from a long-term care insurer carries no charge"
      charge_basis_amount: "The basis of the returned-payment charge follows the instrument and size of the payment returned, in place of returned_payment_fee: a returned payment from a long-term care insurer carries no charge, because an insurer transfer reversed by the bank is a processing error and not the household's; a returned household payment of large_return_threshold dollars or more is charged large_return_pct percent of the amount returned; any other returned payment is charged returned_payment_fee."
      prior_returns: "counted by the returned payments reinstated on the residency in the return_window_months whole months before the handling date other than the one being charged"
      household_returns: "together with the returned payments reinstated on the customer's Larkspur independent living account in the same window"
      repeat_multiplier: "two or more on either account multiply the charge by escalation_two_or_more, one on either account by escalation_one, and none leaves it unchanged."
      member_share: "a customer holding an Entrance Fee Agreement in occupied status with an occupancy date at least member_long_months whole months before the handling date pays member_share_long of the charge, a customer with an occupied agreement of shorter standing pays member_share_short of it, and a customer without an occupied agreement pays it in full."
      residence_start: "residence being counted in whole months up to the handling date from the move-in date of the customer's Larkspur independent living residency when the assisted living admission came from Larkspur independent living, and from the assisted living move-in date otherwise"
      residence_share: "tenure_long_months months or more pay tenure_share_long of the charge, tenure_mid_months months or more but under tenure_long_months pay tenure_share_mid, and shorter residence pays it in full."
      result: "The basis is worked out first and then multiplied by the repeat multiplier, the member share and the residence share, and the result is rounded once at the end."
    factors:
      - id: returned_instrument_basis
        effect: method
        decides: charge_basis_amount
        bindings: [returned_amount, returned_source, returned_payer, charge_basis_amount]
        ladder:
          - when: "the returned payment came from a long-term care insurer"
            method: "no charge"
          - when: "a household payment of large_return_threshold dollars or more was returned"
            method: "large_return_pct percent of the amount returned"
          - when: "otherwise"
            method: "the flat returned_payment_fee"
        baseline:
          charge_basis_amount: "P('returned_payment_fee')"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_return_multiplier
        effect: parameter
        decides: repeat_multiplier
        bindings: [prior_returns, household_returns, repeat_multiplier]
        ladder:
          - when: "two or more other returned payments in the window on the assisted living account or on the independent living account"
            value: "K('escalation_two_or_more')"
          - when: "one other returned payment in the window on either account"
            value: "K('escalation_one')"
          - when: "otherwise"
            value: "unchanged"
        baseline:
          repeat_multiplier: "1"
        evidence: [history, cross_category]
        cross_difficulty: independent
      - id: life_plan_member_courtesy
        effect: parameter
        decides: member_share
        bindings: [member_months, member_share]
        ladder:
          - when: "an occupied Entrance Fee Agreement whose occupancy date is at least member_long_months whole months before the handling date"
            value: "K('member_share_long')"
          - when: "an occupied Entrance Fee Agreement of shorter standing"
            value: "K('member_share_short')"
          - when: "otherwise"
            value: "in full"
        baseline:
          member_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: entrance
      - id: larkspur_residence_share
        effect: parameter
        decides: residence_share
        bindings: [residence_start, residence_months, residence_share]
        ladder:
          - when: "Larkspur residence of tenure_long_months months or more"
            value: "K('tenure_share_long')"
          - when: "Larkspur residence of tenure_mid_months months or more but under tenure_long_months"
            value: "K('tenure_share_mid')"
          - when: "otherwise"
            value: "in full"
        baseline:
          residence_share: "1"
        evidence: [date, cross_category]
        cross_difficulty: independent
    inputs:
      history:
        - {table: assisted_ledger, aggregate: latest, field: amount, filters: {event_type: assisted_payment_return}}
        - {table: assisted_ledger, aggregate: count, field: amount, within_months: 12, filters: {event_type: assisted_payment_return}}
        - {category: independent, table: independent_ledger, aggregate: count, field: amount, within_months: 12, filters: {event_type: independent_payment_return}}
      cross_category: [independent, entrance]
  - id: assisted_ext_advance_payment
    base_policy_refs: [assisted_payments_and_late_fees]
    overwrite: []
    trigger: on_request
    subject: [assisted_payment]
    computes: amount
    target_tool: submit_advance_payment_8dbe3a8d
    params:
      advance_window_months: 12
      months_after_two_returns: 2
      months_after_one_return: 1
      next_month_days_allowance: 31
      insurer_window_months: 2
      vesting_full_months: 60
      vesting_half: 0.5
    rule: >-
      A resident or a representative whose representative_authority is financial_poa, durable_poa or guardian who pays by card while the household's bank drafting is being re-established makes one advance payment, posted as a payment from the resident or family and applied to the oldest outstanding charge first, any excess staying on the account as a credit balance for the coming statements.
      An advance payment is not taken until the ledger carries the returned payment fee owed for every payment reinstated after its return.
      The advance payment is the residency account balance plus, for each coming month it covers, the contracted monthly_base_rent, the care_level_monthly_fee of the care level the residency carries and the recurring monthly care add-ons at the amounts billed for the most recent billed month; it covers no coming month, and it is rounded once to the cent half up at the end.
      The coming months covered follow the household's returned payments in the advance_window_months whole months before the handling date, counted on the assisted living account and on the customer's Larkspur independent living account, in place of covering none: two or more returned payments on either account cover months_after_two_returns coming months, one returned payment on either account covers months_after_one_return coming month, and no returned payment covers none.
      The rent of the coming months follows any written rent increase notice, the lead being the calendar days from the mailing date to the first day of the coming month: a lead of rent_increase_notice_days or more puts every coming month at the proposed rent of the notice; a lead shorter than rent_increase_notice_days but no shorter than rent_increase_notice_days less next_month_days_allowance puts the first coming month at the contracted monthly_base_rent and every later coming month at the proposed rent; any shorter lead, or no pending notice, keeps every coming month at the contracted monthly_base_rent.
      The care part of each coming month follows any direct billing of a long-term care insurer: when ltc_direct_billing is true and two or more insurer payments were posted in the insurer_window_months whole months before the handling date, the care fee is left to the insurer and the month carries only ltc_direct_billing_fee; when ltc_direct_billing is true with fewer such insurer payments, the month carries the care_level_monthly_fee and ltc_direct_billing_fee; when ltc_direct_billing is false, the month carries the care_level_monthly_fee alone.
      The recurring monthly care add-ons follow the care level in effect on the first day of each coming month: when the care level the residency carries takes effect after the last day of the most recent billed month, each insulin management, oxygen management, diabetic monitoring and escort assistance add-on billed for that month recurs at the fee of the care level carried; when the level carried took effect on or before that day and none of those add-ons was billed for the most recent billed month although some were billed for the month before it, the add-ons of that earlier month resume at the amounts billed then; otherwise the add-ons recur at the amounts billed for the most recent billed month.
      A Larkspur Life Plan member's coming months carry the plan discounts: a customer holding an Entrance Fee Agreement in occupied status with an occupancy date at least vesting_full_months whole months before the handling date receives the plan's rent_discount_pct off the coming months' rent and its care_fee_discount_pct off the care fee they carry; an occupied agreement of shorter standing receives vesting_half of those discounts; a customer without an occupied agreement receives none.
      The coming months' rent, care part and add-ons are added up month by month, the plan discount is taken off their rent and care fee only, the result is added to the account balance, and the advance is rounded once at the end.
    baseline:
      rule: >-
        The advance payment is the residency account balance plus, for each coming month it covers, the contracted monthly_base_rent, the care_level_monthly_fee of the care level the residency carries and the recurring monthly care add-ons at the amounts billed for the most recent billed month; it covers no coming month, and it is rounded once to the cent half up at the end.
      params: [care_level_monthly_fee]
    prerequisite:
      - problem: assisted_ext_returned_payment_fee
        kind: value_input
        gate: open_balance
        form: state
        policy_source: >-
          An advance payment is not taken until the ledger carries the returned payment fee owed for every payment reinstated after its return.
        condition: >-
          For every returned payment entry reinstated on the resident ledger, a returned-payment add-on charge referencing that entry stands on the ledger and is included in the residency account balance.
        resolved_by: post_returned_payment_fee_036f277a
        effect: >-
          The returned-payment charge raises the residency account balance by its amount, and the advance payment, which starts from that balance, rises by the same amount.
    cross_category:
      - category: independent
        as: history
        reads: [independent_ledger.event_type, independent_ledger.posting_date]
        note: The coming months covered count the returned payments on the customer's independent living ledger together with the assisted living ones.
      - category: entrance
        as: branch
        reads: [status, occupancy_date, rent_discount_pct, care_fee_discount_pct]
        note: The plan discount and its vesting are decided by the customer's occupied Entrance Fee Agreement, its occupancy date and its plan's discount percentages.
    compute:
      - open_balance: "F('account_balance')"
      - month_last: "LATEST('assisted_ledger', 'service_to_date', date_field='service_from_date', event_type='assisted_rent_charge', charge_basis='full_month')"
      - month_period: "LATEST('assisted_ledger', 'billing_period', date_field='service_from_date', event_type='assisted_rent_charge', charge_basis='full_month')"
      - returns_in_window: "COUNT('assisted_ledger', within_months=K('advance_window_months'), date_field='posting_date', event_type='assisted_payment_return')"
      - household_returns_in_window: "XCOUNT('independent', 'independent_ledger', within_months=K('advance_window_months'), date_field='posting_date', event_type='independent_payment_return')"
      - advance_months: "K('months_after_two_returns') if (returns_in_window >= 2 or household_returns_in_window >= 2) else (K('months_after_one_return') if (returns_in_window >= 1 or household_returns_in_window >= 1) else 0)"
      - notice_lead_days: "DAYS(F('rent_notice_date'), month_last) + 1 if F('rent_notice_date') else -1"
      - advance_rent: "advance_months * F('proposed_monthly_base_rent') if notice_lead_days >= P('rent_increase_notice_days') else ((MN(advance_months, 1) * F('monthly_base_rent') + MX(advance_months - 1, 0) * F('proposed_monthly_base_rent')) if (notice_lead_days >= 0 and notice_lead_days + K('next_month_days_allowance') >= P('rent_increase_notice_days')) else advance_months * F('monthly_base_rent'))"
      - insurer_payments: "COUNT('assisted_ledger', within_months=K('insurer_window_months'), date_field='posting_date', event_type='assisted_payment', payer_type='ltc_insurer')"
      - care_terms_month: "P('ltc_direct_billing_fee') if (F('ltc_direct_billing') and insurer_payments >= 2) else ((P('care_level_monthly_fee') + P('ltc_direct_billing_fee')) if (F('ltc_direct_billing') and insurer_payments < 2) else P('care_level_monthly_fee'))"
      - care_fee_carried: "MN(care_terms_month, P('care_level_monthly_fee')) if care_terms_month > P('ltc_direct_billing_fee') else 0"
      - insulin_billed: "SUM('assisted_ledger', 'amount', event_type='assisted_addon_charge', addon_code='insulin_management', billing_period=month_period)"
      - oxygen_billed: "SUM('assisted_ledger', 'amount', event_type='assisted_addon_charge', addon_code='oxygen_management', billing_period=month_period)"
      - diabetic_billed: "SUM('assisted_ledger', 'amount', event_type='assisted_addon_charge', addon_code='diabetic_monitoring', billing_period=month_period)"
      - escort_billed: "SUM('assisted_ledger', 'amount', event_type='assisted_addon_charge', addon_code='escort_assistance', billing_period=month_period)"
      - addons_billed_month: "insulin_billed + oxygen_billed + diabetic_billed + escort_billed"
      - addons_two_months: "SUM('assisted_ledger', 'amount', within_months=2, date_field='service_date', event_type='assisted_addon_charge', addon_code='insulin_management') + SUM('assisted_ledger', 'amount', within_months=2, date_field='service_date', event_type='assisted_addon_charge', addon_code='oxygen_management') + SUM('assisted_ledger', 'amount', within_months=2, date_field='service_date', event_type='assisted_addon_charge', addon_code='diabetic_monitoring') + SUM('assisted_ledger', 'amount', within_months=2, date_field='service_date', event_type='assisted_addon_charge', addon_code='escort_assistance')"
      - addons_month_before: "addons_two_months - addons_billed_month"
      - addons_month: "((P('insulin_management_fee') if insulin_billed > 0 else 0) + (P('oxygen_management_fee') if oxygen_billed > 0 else 0) + (P('diabetic_monitoring_fee') if diabetic_billed > 0 else 0) + (P('escort_assistance_fee') if escort_billed > 0 else 0)) if F('level_effective_date') > month_last else (addons_month_before if (addons_billed_month == 0 and addons_month_before > 0) else addons_billed_month)"
      - vest_months: "MONTHS(CFIELD('entrance', 'occupancy_date', status='occupied'), NOW) if EXISTS('entrance', status='occupied') else 0"
      - plan_vesting: "1 if (EXISTS('entrance', status='occupied') and vest_months >= K('vesting_full_months')) else (K('vesting_half') if EXISTS('entrance', status='occupied') else 0)"
      - rent_discount_pct: "CPARAM('entrance', 'rent_discount_pct', status='occupied') if EXISTS('entrance', status='occupied') else 0"
      - care_discount_pct: "CPARAM('entrance', 'care_fee_discount_pct', status='occupied') if EXISTS('entrance', status='occupied') else 0"
      - plan_discount: "plan_vesting * (advance_rent * rent_discount_pct + advance_months * care_fee_carried * care_discount_pct) / 100"
      - result: "RND(open_balance + advance_rent + advance_months * (care_terms_month + addons_month) - plan_discount, 2)"
    compute_basis:
      open_balance: "The advance payment is the residency account balance plus, for each coming month it covers"
      returns_in_window: "The coming months covered follow the household's returned payments in the advance_window_months whole months before the handling date, counted on the assisted living account and on the customer's Larkspur independent living account"
      advance_months: "two or more returned payments on either account cover months_after_two_returns coming months, one returned payment on either account covers months_after_one_return coming month, and no returned payment covers none."
      notice_lead_days: "the lead being the calendar days from the mailing date to the first day of the coming month"
      advance_rent: "a lead of rent_increase_notice_days or more puts every coming month at the proposed rent of the notice; a lead shorter than rent_increase_notice_days but no shorter than rent_increase_notice_days less next_month_days_allowance puts the first coming month at the contracted monthly_base_rent and every later coming month at the proposed rent; any shorter lead, or no pending notice, keeps every coming month at the contracted monthly_base_rent."
      insurer_payments: "two or more insurer payments were posted in the insurer_window_months whole months before the handling date"
      care_terms_month: "when ltc_direct_billing is true and two or more insurer payments were posted in the insurer_window_months whole months before the handling date, the care fee is left to the insurer and the month carries only ltc_direct_billing_fee; when ltc_direct_billing is true with fewer such insurer payments, the month carries the care_level_monthly_fee and ltc_direct_billing_fee; when ltc_direct_billing is false, the month carries the care_level_monthly_fee alone."
      addons_month: "The recurring monthly care add-ons follow the care level in effect on the first day of each coming month: when the care level the residency carries takes effect after the last day of the most recent billed month, each insulin management, oxygen management, diabetic monitoring and escort assistance add-on billed for that month recurs at the fee of the care level carried; when the level carried took effect on or before that day and none of those add-ons was billed for the most recent billed month although some were billed for the month before it, the add-ons of that earlier month resume at the amounts billed then; otherwise the add-ons recur at the amounts billed for the most recent billed month."
      plan_vesting: "a customer holding an Entrance Fee Agreement in occupied status with an occupancy date at least vesting_full_months whole months before the handling date receives the plan's rent_discount_pct off the coming months' rent and its care_fee_discount_pct off the care fee they carry; an occupied agreement of shorter standing receives vesting_half of those discounts; a customer without an occupied agreement receives none."
      plan_discount: "the plan discount is taken off their rent and care fee only"
      result: "The coming months' rent, care part and add-ons are added up month by month, the plan discount is taken off their rent and care fee only, the result is added to the account balance, and the advance is rounded once at the end."
    factors:
      - id: advance_horizon
        effect: parameter
        decides: advance_months
        bindings: [returns_in_window, household_returns_in_window, advance_months]
        ladder:
          - when: "two or more returned payments in the window on the assisted living account or on the independent living account"
            value: "K('months_after_two_returns')"
          - when: "one returned payment in the window on either account"
            value: "K('months_after_one_return')"
          - when: "otherwise"
            value: "no coming month"
        baseline:
          advance_months: "0"
        evidence: [history, cross_category]
        cross_difficulty: independent
      - id: rent_increase_timing
        effect: method
        decides: advance_rent
        bindings: [notice_lead_days, advance_rent]
        ladder:
          - when: "a notice lead of rent_increase_notice_days or more"
            method: "every coming month at the proposed rent"
          - when: "a lead shorter than rent_increase_notice_days but no shorter than rent_increase_notice_days less next_month_days_allowance"
            method: "the first coming month at the contracted rent, later ones at the proposed rent"
          - when: "otherwise"
            method: "every coming month at the contracted monthly_base_rent"
        baseline:
          advance_rent: "advance_months * F('monthly_base_rent')"
        evidence: [date]
        cross_difficulty: null
      - id: insurer_care_terms
        effect: parameter
        decides: care_terms_month
        bindings: [insurer_payments, care_terms_month]
        ladder:
          - when: "ltc_direct_billing true and two or more insurer payments in the insurer_window_months whole months before the handling date"
            value: "P('ltc_direct_billing_fee')"
          - when: "ltc_direct_billing true with fewer such insurer payments"
            value: "P('care_level_monthly_fee') + P('ltc_direct_billing_fee')"
          - when: "otherwise"
            value: "P('care_level_monthly_fee')"
        baseline:
          care_terms_month: "P('care_level_monthly_fee')"
        evidence: [history]
        cross_difficulty: null
      - id: addon_recurrence
        effect: method
        decides: addons_month
        bindings: [insulin_billed, oxygen_billed, diabetic_billed, escort_billed, addons_billed_month, addons_two_months, addons_month_before, addons_month]
        ladder:
          - when: "the care level carried takes effect after the last day of the most recent billed month"
            method: "each insulin, oxygen, diabetic monitoring and escort add-on billed that month recurs at the fee of the level carried"
          - when: "the level carried took effect on or before that day, none of those add-ons was billed for the most recent billed month, and some were billed for the month before it"
            method: "the add-ons of the month before resume at the amounts billed then"
          - when: "otherwise"
            method: "the add-ons recur at the amounts billed for the most recent billed month"
        baseline:
          addons_month: "addons_billed_month"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: plan_discount_vesting
        effect: parameter
        decides: plan_vesting
        bindings: [vest_months, plan_vesting]
        ladder:
          - when: "an occupied Entrance Fee Agreement whose occupancy date is at least vesting_full_months whole months before the handling date"
            value: "the full plan discounts"
          - when: "an occupied Entrance Fee Agreement of shorter standing"
            value: "K('vesting_half') of the plan discounts"
          - when: "otherwise"
            value: "no plan discount"
        baseline:
          plan_vesting: "0"
        evidence: [cross_category, date]
        cross_difficulty: entrance
    inputs:
      history:
        - {table: assisted_ledger, aggregate: count, field: amount, within_months: 12, filters: {event_type: assisted_payment_return}}
        - {category: independent, table: independent_ledger, aggregate: count, field: amount, within_months: 12, filters: {event_type: independent_payment_return}}
        - {table: assisted_ledger, aggregate: count, field: amount, within_months: 2, filters: {event_type: assisted_payment, payer_type: ltc_insurer}}
        - {table: assisted_ledger, aggregate: sum, field: amount, filters: {event_type: assisted_addon_charge}}
      cross_category: [independent, entrance]
