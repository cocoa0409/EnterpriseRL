# Product charter — Assisted Living Residency and Care Agreement.
# Larkspur Senior Living. Tiers are the care levels set by the nurse's care-point assessment;
# the apartment is a separate per-entity rent mapping. Single registry of every number of this category.

category: assisted
display_name: Assisted Living Residency and Care Agreement

binding:
  holding_table: assisted_residencies
  event_tables: [assisted_ledger, assisted_assessments]
  intake_tables: [assisted_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {account_balance: resident_balance}

lifecycle:
  states: [pending_admission, active, on_leave, notice_given, vacated, closed, cancelled]
  transitions:
    - from: pending_admission
      to: active
      by: system
      means: "The resident moves into the assisted living apartment on the move-in date recorded by the community."
    - from: pending_admission
      to: cancelled
      by: user
      means: "The applicant or their financial representative signs a withdrawal of the admission before move-in."
    - from: active
      to: on_leave
      by: agent
      means: "The resident leaves the community temporarily - a hospital admission, a skilled nursing or rehabilitation stay, or an extended family visit - and the absence start is recorded."
    - from: on_leave
      to: active
      by: agent
      means: "The resident returns to the apartment from a recorded absence."
    - from: active
      to: notice_given
      by: user
      means: "The resident or their financial representative signs the written notice of termination."
    - from: notice_given
      to: active
      by: user
      means: "The resident or their financial representative signs a withdrawal of the notice before the intended vacate date."
    - from: notice_given
      to: vacated
      by: agent
      means: "The apartment is surrendered after notice and the vacate date is recorded."
    - from: active
      to: vacated
      by: agent
      means: "The residency ends without a resident notice - death, a transfer into Larkspur memory care, or a discharge whose notice period has run."
    - from: on_leave
      to: vacated
      by: agent
      means: "The residency ends while the resident is away - death during the absence, or a discharge because the resident cannot return to assisted living."
    - from: vacated
      to: closed
      by: agent
      means: "The final statement is settled and the residency file is closed."

accounts:
  - key: resident_balance
    unit: USD
    meaning: Amount the resident owes on the assisted living account; rent, care fees, add-ons and fees book in, payments and credits book out, and a negative value is a credit balance owed back.

parameter_schema:
  care_level_monthly_fee: Monthly care fee for this care level, billed on top of apartment rent, USD per calendar month.
  care_points_min: Lowest care-point score that places a resident at this care level, integer points.
  care_points_max: Highest care-point score that places a resident at this care level, integer points.
  apartment_base_rent: Per-apartment-type mapping of the published monthly rent for a newly contracted assisted living apartment, USD per calendar month (AL Studio, AL One-Bedroom, AL Companion Suite).
  community_fee: One-time non-refundable community fee charged at move-in, USD.
  community_fee_waived_internal_transfer: Whether the community fee is waived for a resident moving in directly from a Larkspur independent living residency, boolean.
  medication_management_included: Whether medication management (storage, ordering and administration) is included in the care level fee, boolean.
  medication_management_fee: Monthly medication management fee where it is not included, USD per calendar month.
  included_med_passes_per_day: Number of scheduled daily medication administration times included, integer passes per day.
  extra_med_pass_monthly_fee: Monthly fee for each scheduled daily medication pass beyond those included, USD per pass per calendar month.
  insulin_management_fee: Monthly fee for insulin administration by a licensed nurse, USD per calendar month (0 when included).
  incontinence_care_included: Whether incontinence care assistance is included in the care level fee, boolean.
  incontinence_care_fee: Monthly incontinence care fee where it is not included, USD per calendar month.
  escort_assistance_included: Whether escorts to meals and activities are included in the care level fee, boolean.
  escort_assistance_fee: Monthly escort assistance fee where it is not included, USD per calendar month.
  bath_assists_per_week_included: Number of bathing or shower assists included per calendar week (Sunday to Saturday), integer.
  extra_bath_assist_fee: Fee for each bathing or shower assist beyond those included in that week, USD per assist.
  tray_service_included_per_month: Number of meal trays delivered to the apartment included per calendar month, integer trays.
  tray_service_fee: Fee for each meal tray delivered beyond those included, USD per tray.
  diabetic_monitoring_fee: Monthly fee for blood glucose monitoring by staff, USD per calendar month (0 when included).
  oxygen_management_fee: Monthly fee for oxygen equipment management, USD per calendar month (0 when included).
  guest_meal_fee: Fee for a guest meal in the assisted living dining room, USD per meal.
  ltc_direct_billing_fee: Monthly administration fee when Larkspur bills a long-term care insurer directly under an assignment of benefits, USD per calendar month.
  apartment_change_fee: Fee for a resident-requested move to another assisted living apartment, USD per move.
  min_resident_age: Minimum age of an assisted living resident on the move-in date, integer years.
  wander_risk_excluded: Whether a resident assessed as a wander or exit-seeking risk is excluded from assisted living and referred to memory care, boolean.
  pre_admission_assessment_validity_days: Maximum number of calendar days between the pre-admission nurse assessment and the move-in date, integer days.
  post_move_in_reassessment_days: Number of calendar days after the move-in date by which the first reassessment must be completed, integer days.
  routine_reassessment_interval_days: Maximum number of calendar days between routine reassessments at this care level, integer days.
  post_hospital_reassessment_days: Number of calendar days after return from a qualifying hospital stay by which a reassessment must be completed, integer days.
  hospital_stay_reassessment_trigger_nights: Number of midnights in hospital that make an absence a qualifying hospital stay requiring reassessment, integer nights.
  level_notice_issue_days: Number of calendar days after an assessment that indicates a new care level by which the written level notice is issued, integer days.
  level_increase_notice_days: Number of calendar days after the written level notice before an increase from a routine or post-move-in reassessment takes effect, integer days.
  absence_care_credit_after_days: Number of midnights of a continuous absence that are not credited before the care fee credit begins, integer days.
  absence_care_credit_max_days: Maximum number of days credited for one continuous absence, integer days.
  absence_care_credit_pct: Percentage of the daily care level fee credited for each credited day of absence, percent.
  absence_rent_credit: Whether apartment rent is credited during an absence, boolean.
  max_leave_days_before_review: Number of midnights of a continuous absence after which the executive director reviews whether the apartment continues to be held, integer days.
  fee_due_day: Day of the calendar month on which rent and care fees are billed in advance and fall due, integer.
  payment_grace_days: Number of calendar days after the posting of the monthly charges during which payment carries no late fee, integer days.
  late_fee_flat: Flat component of the late fee, USD; the late fee is the greater of this and the percentage component.
  late_fee_pct: Percentage component of the late fee, percent of the past-due amount for the billing period.
  late_fee_min_past_due: Past-due amount below which no late fee is assessed, USD.
  returned_payment_fee: Fee for a payment returned unpaid by the bank, USD per returned payment.
  rent_increase_notice_days: Minimum number of calendar days of written notice before a rent increase takes effect, integer days.
  max_annual_rent_increase_pct: Contractual ceiling on a single annual rent increase, percent of the rent in effect before the increase.
  move_out_notice_days: Length of the resident's written notice period of termination, integer calendar days from the notice date.
  post_death_fee_days: Number of calendar days after the date of death through which rent and care fees continue unless belongings are removed later, integer days.
  internal_transfer_notice_days: Notice period that applies when the resident moves into a Larkspur memory care residence, integer calendar days.
  discharge_notice_days: Length of the written discharge notice when Larkspur ends a residency for nonpayment or because the resident's needs exceed assisted living, integer calendar days.
  past_due_days_before_discharge_notice: Number of calendar days a charge may remain past due before a discharge notice for nonpayment may be issued, integer days.
  final_statement_days: Number of calendar days after the vacate date by which the final statement is issued and any credit balance refunded, integer days.

