  - id: entrance_ext_estate_refund_release
    base_policy_refs: [entrance_rescission, entrance_pre_occupancy_cancellation, entrance_refund_timing, entrance_refund_calculation]
    overwrite:
      - base_policy: entrance_refund_timing
        superseded_clause: >-
          The agreement is closed once the refund is paid and the refundable balance is 0.00.
        replaced_by: >-
          An estate refund closes the agreement when it is paid; any delay interest paid with it is Larkspur's own money and leaves the refundable balance below 0.00 by the amount of that interest.
    trigger: on_request
    subject: [entrance_refund_payment, entrance_close]
    computes: refund_amount
    target_tool: release_estate_refund_4b5e42b1
    params:
      reverification_days: 10
      long_delay_days: 180
      nc_rate: 8.0
      fl_rate: 9.0
      long_outstanding_days: 270
      mid_outstanding_days: 90
      step_long: 0.5
      step_mid: 0.25
      basis_365: 365
      basis_360: 360
      months_per_year: 12
    rule: >-
      An estate refund is not released until the agreement's ledger carries an amortization entry for every month of occupancy that began on or before the termination date.
      An estate refund is released only after the agreement's ledger carries the tax letter for the tax year in which the agreement terminated.
      An estate refund is released by the estate's personal representative named in the letters on file, who signs the refund release; the refund is then paid in one payment by check to the estate in care of the address on file.
      An estate refund pays the refundable amount, which is the entrance fee received less every retention, amortization, processing fee, offset, refurbishment deduction and refund entered on the agreement's ledger, rounded to the cent half up, in one payment.
      An estate refund closes the agreement when it is paid; any delay interest paid with it is Larkspur's own money and leaves the refundable balance below 0.00 by the amount of that interest.
      A refund paid after its refund due date carries delay interest on the refundable amount, figured at the campus rate plus the outstanding step for the interest days counted, and added to the refundable amount before the payment is rounded to the cent half up.
      The interest days run from a start that depends on why the refund waited: where the estate's letters testamentary or of administration reached Larkspur 180 or more days after the refund due date, interest runs from 10 days after the letters were received; where they reached Larkspur 1 to 179 days after the due date, interest runs from the day the letters were received; otherwise interest runs from the refund due date; the days never fall below 0.
      The interest days counted include the payment day for an estate whose letters arrived after the due date; for a refund payable to the resident the first day is not counted; otherwise the interest days count as they run.
      The campus rate follows the statute of the campus state: a refund outstanding past its due date at Larkspur at Brookfield carries 8.0 percent a year, one at Larkspur at Harbor View carries 9.0 percent a year, and a refund at any other campus carries no campus rate.
      The outstanding step adds to the campus rate for a refund long past due: 270 or more days past the due date add 0.5 percentage points, 90 to 269 days add 0.25 percentage points, and fewer days add nothing; the campus rate and the step are added together before they are applied.
      The day count of the delay interest follows the campus: at Larkspur at Brookfield the interest is the refundable amount times the combined rate times the interest days counted divided by 365; at Larkspur at Harbor View it is the refundable amount times the combined rate divided by 12 for each whole month from the due date to the payment date; at any other campus it is the refundable amount times the combined rate times the interest days counted divided by 360; in every case the interest is rounded to the cent half up.
    prerequisite:
      - problem: entrance_ext_final_period_amortization
        kind: value_input
        gate: refundable_amount
        form: state
        policy_source: >-
          An estate refund is not released until the agreement's ledger carries an amortization entry for every month of occupancy that began on or before the termination date.
        condition: >-
          entrance_ledger carries an entrance_amortization entry for every month of occupancy whose first day is on or before entrance_agreements.termination_date.
        resolved_by: book_final_period_amortization_cad149c9
        effect: >-
          The final-period amortization entry books out of the refundable balance, so refundable_amount falls by its amount and the delay interest figured on it falls with it.
      - problem: entrance_ext_closing_year_tax_letter
        kind: state_gate
        gate: entrance_ledger.tax_year
        form: state
        policy_source: >-
          An estate refund is released only after the agreement's ledger carries the tax letter for the tax year in which the agreement terminated.
        condition: >-
          entrance_ledger carries an entrance_tax_letter entry whose tax_year is the year of entrance_agreements.termination_date.
        resolved_by: issue_closing_year_tax_letter_050bd78c
        effect: >-
          The closing-year letter is entered for the year of termination, so the release may proceed.
    cross_category: []
    compute:
      - money_in: "SUM('entrance_ledger', 'amount', date_field='posting_date', event_type='entrance_deposit_payment') + SUM('entrance_ledger', 'amount', date_field='posting_date', event_type='entrance_balance_payment')"
      - money_out: "SUM('entrance_ledger', 'amount', date_field='posting_date', event_type='entrance_admin_fee_retention') + SUM('entrance_ledger', 'amount', date_field='posting_date', event_type='entrance_amortization') + SUM('entrance_ledger', 'amount', date_field='posting_date', event_type='entrance_processing_fee_retention') + SUM('entrance_ledger', 'amount', date_field='posting_date', event_type='entrance_account_offset') + SUM('entrance_ledger', 'amount', date_field='posting_date', event_type='entrance_refurbishment_deduction') + SUM('entrance_ledger', 'amount', date_field='posting_date', event_type='entrance_refund_payment')"
      - refundable_amount: "RND(money_in - money_out, 2)"
      - letters_days_late: "DAYS(F('refund_due_date'), F('estate_documents_date')) if (F('refund_payee_type') == 'estate' and F('estate_documents_date')) else 0"
      - interest_days: "MX(0, DAYS(F('estate_documents_date'), NOW) - K('reverification_days')) if letters_days_late >= K('long_delay_days') else (MX(0, DAYS(F('estate_documents_date'), NOW)) if letters_days_late >= 1 else MX(0, DAYS(F('refund_due_date'), NOW)))"
      - interest_days_counted: "interest_days + 1 if (F('refund_payee_type') == 'estate' and F('estate_documents_date') and DAYS(F('refund_due_date'), F('estate_documents_date')) >= 1) else (MX(0, interest_days - 1) if F('refund_payee_type') == 'resident' else interest_days)"
      - campus_rate: "K('nc_rate') if (F('community_name') == 'Larkspur at Brookfield' and DAYS(F('refund_due_date'), NOW) > 0) else (K('fl_rate') if (F('community_name') == 'Larkspur at Harbor View' and DAYS(F('refund_due_date'), NOW) > 0) else 0)"
      - outstanding_step: "K('step_long') if DAYS(F('refund_due_date'), NOW) >= K('long_outstanding_days') else (K('step_mid') if DAYS(F('refund_due_date'), NOW) >= K('mid_outstanding_days') else 0)"
      - delay_interest: "RND(refundable_amount * (campus_rate + outstanding_step) / 100 * interest_days_counted / K('basis_365'), 2) if F('community_name') == 'Larkspur at Brookfield' else (RND(refundable_amount * (campus_rate + outstanding_step) / 100 / K('months_per_year') * MONTHS(F('refund_due_date'), NOW), 2) if F('community_name') == 'Larkspur at Harbor View' else RND(refundable_amount * (campus_rate + outstanding_step) / 100 * interest_days_counted / K('basis_360'), 2))"
      - result: "RND(refundable_amount + delay_interest, 2)"
    compute_basis:
      money_in: "the entrance fee received less every retention, amortization, processing fee, offset, refurbishment deduction and refund entered on the agreement's ledger"
      money_out: "less every retention, amortization, processing fee, offset, refurbishment deduction and refund entered on the agreement's ledger"
      refundable_amount: "An estate refund pays the refundable amount, which is the entrance fee received less every retention, amortization, processing fee, offset, refurbishment deduction and refund entered on the agreement's ledger, rounded to the cent half up, in one payment."
      letters_days_late: "where the estate's letters testamentary or of administration reached Larkspur 180 or more days after the refund due date"
      interest_days: "The interest days run from a start that depends on why the refund waited: where the estate's letters testamentary or of administration reached Larkspur 180 or more days after the refund due date, interest runs from 10 days after the letters were received; where they reached Larkspur 1 to 179 days after the due date, interest runs from the day the letters were received; otherwise interest runs from the refund due date; the days never fall below 0."
      interest_days_counted: "The interest days counted include the payment day for an estate whose letters arrived after the due date; for a refund payable to the resident the first day is not counted; otherwise the interest days count as they run."
      campus_rate: "The campus rate follows the statute of the campus state: a refund outstanding past its due date at Larkspur at Brookfield carries 8.0 percent a year, one at Larkspur at Harbor View carries 9.0 percent a year, and a refund at any other campus carries no campus rate."
      outstanding_step: "The outstanding step adds to the campus rate for a refund long past due: 270 or more days past the due date add 0.5 percentage points, 90 to 269 days add 0.25 percentage points, and fewer days add nothing; the campus rate and the step are added together before they are applied."
      delay_interest: "The day count of the delay interest follows the campus: at Larkspur at Brookfield the interest is the refundable amount times the combined rate times the interest days counted divided by 365; at Larkspur at Harbor View it is the refundable amount times the combined rate divided by 12 for each whole month from the due date to the payment date; at any other campus it is the refundable amount times the combined rate times the interest days counted divided by 360; in every case the interest is rounded to the cent half up."
      result: "A refund paid after its refund due date carries delay interest on the refundable amount, figured at the campus rate plus the outstanding step for the interest days counted, and added to the refundable amount before the payment is rounded to the cent half up."
    factors:
      - id: delay_interest_start
        effect: method
        decides: interest_days
        bindings: [letters_days_late, interest_days]
        ladder:
          - when: "the estate's letters reached Larkspur 180 or more days after the refund due date"
            method: "interest runs from 10 days after the letters were received"
          - when: "the letters reached Larkspur 1 to 179 days after the due date"
            method: "interest runs from the day the letters were received"
          - when: "otherwise"
            method: "interest runs from the refund due date"
        baseline:
          interest_days: "MX(0, DAYS(F('refund_due_date'), NOW))"
        evidence: [date]
        cross_difficulty: null
      - id: interest_day_inclusion
