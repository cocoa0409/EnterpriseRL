          - when: "the agreement is at Larkspur at Harbor View"
            method: "refundable amount times the combined rate divided by 12 for each whole month from the due date to the payment date"
          - when: "otherwise"
            method: "refundable amount times the combined rate times the interest days counted divided by 360"
