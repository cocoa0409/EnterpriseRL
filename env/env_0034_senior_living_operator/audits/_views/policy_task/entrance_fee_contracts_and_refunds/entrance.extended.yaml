          - when: "otherwise"
            method: "reading the entries posted 1 to 12 whole months before the issue date"
        baseline:
          window_from: "K('ontime_window_from')"
          window_to: "K('ontime_window_to')"
        evidence: [history, date]
        cross_difficulty: null
      - id: settlement_basis
        effect: method
        decides: payments_counted
        bindings: [il_returns, il_return_fees, il_offsets, payments_counted]
        ladder:
          - when: "a payment in the window was returned unpaid"
            method: "payments net of the returned payments and of the returned-payment fees"
          - when: "a payment in the window was made by entrance refund offset and none was returned"
            method: "payments without the offset payments"
          - when: "otherwise"
            method: "every payment posted in the window"
        baseline:
          payments_counted: "il_payments"
        evidence: [cross_category, history]
        cross_difficulty: independent
      - id: stay_payer_basis
        effect: method
        decides: stay_charges_borne
        bindings: [insurer_payments, guest_refunds, stay_charges_borne]
        ladder:
          - when: "a long-term care insurer paid toward the window's stays"
            method: "stay charges counted less the insurer's payments, never below 0.00"
          - when: "no insurer paid but a stay refund was paid back to the guest in the window"
            method: "stay charges counted less those refunds, never below 0.00"
          - when: "otherwise"
            method: "stay charges as counted"
        baseline:
          stay_charges_borne: "stay_charges_counted"
        evidence: [cross_category, history]
        cross_difficulty: respite
      - id: care_stay_share
        effect: parameter
        decides: care_stay_share
        bindings: [recovery_nights, respite_nights, care_stay_share]
        ladder:
          - when: "the window holds Post-Hospital Recovery Stay nights"
            value: "K('recovery_share')"
          - when: "the window holds Assisted Living or Memory Care Respite Stay nights and no recovery nights"
            value: "K('respite_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          care_stay_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: respite
      - id: stay_charges_basis
        effect: method
        decides: stay_charges_counted
        bindings: [early_departure_credits, level_change_credits, stay_charges_counted]
        ladder:
          - when: "the window holds an early-departure credit"
            method: "nightly charges net of the early-departure credits"
          - when: "the window holds a level-change adjustment credit and no early-departure credit"
            method: "nightly charges net of the level-change adjustment credits"
          - when: "otherwise"
            method: "nightly charges in full"
        baseline:
          stay_charges_counted: "stay_charges"
        evidence: [cross_category, history]
        cross_difficulty: respite
      - id: stay_addon_share
        effect: parameter
        decides: addon_share
        bindings: [medication_addons, care_addons, addon_share]
        ladder:
          - when: "a medication setup add-on was charged in the window"
            value: "K('medication_addon_share')"
          - when: "only incontinence supplies or companion add-ons were charged in the window"
            value: "K('care_addon_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          addon_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: respite
    baseline:
      rule: >-
        The annual letter for the year just ended states medical_expense_pct_entrance_fee percent of the entrance fee received on the agreement's ledger in the tax year plus medical_expense_pct_monthly_fee percent of the payments posted to the resident's independent living ledger in the tax year, rounded to the cent half up; for a January issue the tax year's entries are those posted 1 to 12 whole months before the issue date.
      params: [medical_expense_pct_entrance_fee, medical_expense_pct_monthly_fee]
    inputs:
      history:
        - {table: entrance_ledger, aggregate: latest, field: posting_date, filters: {event_type: entrance_tax_letter}}
        - {category: independent, table: independent_ledger, aggregate: sum, field: amount, filters: {event_type: independent_payment}}
        - {category: independent, table: independent_ledger, aggregate: sum, field: amount, filters: {event_type: independent_payment_return}}
        - {category: respite, table: respite_ledger, aggregate: sum, field: nights, filters: {event_type: respite_nightly_charge}}
        - {category: respite, table: respite_ledger, aggregate: sum, field: amount, filters: {event_type: respite_credit}}
      cross_category: [independent, respite]
  - id: entrance_ext_closing_year_tax_letter
    base_policy_refs: [entrance_tax_letter_policy]
    overwrite:
      - base_policy: entrance_tax_letter_policy
        superseded_clause: >-
          The medical expense amount stated is medical_expense_pct_entrance_fee percent of the entrance fee received in the tax year plus medical_expense_pct_monthly_fee percent of the independent living monthly fees paid in the tax year, rounded to the cent half up
        replaced_by: >-
          The closing-year letter's medical expense amount is its entrance fee share plus its residence fee share plus its closing-year care-stay share, added before a single rounding to the cent half up.
      - base_policy: entrance_tax_letter_policy
        superseded_clause: >-
          One tax letter is issued per agreement per tax year.
        replaced_by: >-
          The tax year in which an agreement ended receives one closing-year letter, issued with the January letter run that follows that year, and never a second letter for that year.
    trigger: state_due
    subject: [entrance_tax_letter]
    computes: medical_expense_amount
    target_tool: issue_closing_year_tax_letter_050bd78c
    params:
      window_from_months: 1
      window_to_months: 13
      recovery_care_share: 1.0
      respite_care_share: 0.6
      days_per_month: 30
    rule: >-
      The tax letter for the year in which an agreement terminated is issued only after the agreement's ledger carries an amortization entry for every month of occupancy that began on or before the termination date.
      The tax letter for the year in which an agreement terminated is not issued until the agreement's ledger carries a tax letter for every earlier tax year in which entrance fee or independent living monthly fees were paid.
      The tax year in which an agreement ended receives one closing-year letter, issued with the January letter run that follows that year, and never a second letter for that year.
      The closing-year letter states medical_expense_pct_entrance_fee percent of the entrance fee received on the agreement's ledger in the closing year plus medical_expense_pct_monthly_fee percent of the payments posted to the resident's independent living ledger in the closing year, rounded to the cent half up; the closing year's entries are those posted 1 to 12 whole months before the January issue date.
      The closing-year letter's medical expense amount is its entrance fee share plus its residence fee share plus its closing-year care-stay share, added before a single rounding to the cent half up.
      The entrance fee amount the closing-year letter rests on depends on how the agreement ended: where it terminated after occupancy, by the resident's death, the resident's notice or Larkspur for cause, with the termination date in the closing year, the amount is the administrative retention and the amortization entries posted in the closing year; where it was rescinded or cancelled before occupancy in the closing year, the amount is 0; otherwise it is the entrance fee received in the closing year.
      The entrance fee share is medical_expense_pct_entrance_fee percent of that entrance fee amount, and the residence fee share is medical_expense_pct_monthly_fee percent of the independent living amount counted.
      The independent living amount the closing-year letter rests on depends on how that account was closed: where the closing year holds move-out proration credits on the independent living ledger, the amount is the monthly fee charges of the closing year net of those credits; where it holds no such credit but a returned payment, the amount is the payments net of the returned payments; otherwise it is the payments posted in the closing year.
      The independent living fees billed for the days after the residency ended are the estate's expense, not the resident's: where the paired independent living residency ended on the resident's death, the post-death fee days of that apartment type are deducted, and where it ended on a transfer to Larkspur assisted living or memory care, the internal transfer notice days of that apartment type are deducted; each deducted day is the residency's monthly service fee divided by 30, the deduction rounded to the cent half up and taken from the independent living amount before the percentage applies, the result never below 0.00; otherwise nothing is deducted.
      Larkspur care stays charged in the closing year are added at a closing-year care share: where the closing year holds Post-Hospital Recovery Stay nights the share is 1.0, where it holds Assisted Living Respite Stay or Memory Care Respite Stay nights but no recovery nights the share is 0.6, and otherwise the share is 0; the share applies to the closing-year care-stay charges the resident bore.
      The closing-year care-stay charges the resident bore are the nightly charges of Larkspur care stays, every stay type other than the Independent Living Trial Stay, posted in the closing year: where a long-term care insurer paid toward those stays in the closing year they are reduced by the insurer's payments; where no insurer paid but early-departure credits were posted in the closing year they are reduced by those credits; otherwise they count in full; the result never falls below 0.00.
      A plan whose medical expense percentages are both 0.0 receives a closing-year letter stating 0.00, whatever else the closing year holds.
    prerequisite:
      - problem: entrance_ext_final_period_amortization
        kind: value_input
        gate: amortization_in_year
        form: state
        policy_source: >-
          The tax letter for the year in which an agreement terminated is issued only after the agreement's ledger carries an amortization entry for every month of occupancy that began on or before the termination date.
        condition: >-
          entrance_ledger carries an entrance_amortization entry for every month of occupancy whose first day is on or before entrance_agreements.termination_date.
        resolved_by: book_final_period_amortization_cad149c9
        effect: >-
          The final-period amortization entry is posted on the first day of the final month, inside the closing year, so amortization_in_year rises by its amount and the count of amortization entries rises by one.
      - problem: entrance_ext_annual_tax_letter
        kind: state_gate
        gate: entrance_ledger.tax_year
        form: state
        policy_source: >-
          The tax letter for the year in which an agreement terminated is not issued until the agreement's ledger carries a tax letter for every earlier tax year in which entrance fee or independent living monthly fees were paid.
        condition: >-
          entrance_ledger carries an entrance_tax_letter entry for every tax year before the year of entrance_agreements.termination_date in which entrance fee or independent living monthly fees were paid.
        resolved_by: issue_annual_tax_letter_ce10c97a
        effect: >-
          Each missing annual letter for an earlier tax year is entered, so the ledger holds a letter for every earlier tax year in which fees were paid and the closing-year letter may be issued.
    cross_category:
      - category: independent
        as: history
        reads: [independent_ledger.amount, independent_ledger.event_type, independent_ledger.credit_reason, independent_ledger.posting_date, termination_reason, monthly_service_fee, variant_name]
        note: The independent living amount and the post-residency deduction are decided from the paired independent living residency and its ledger.
      - category: respite
        as: history
        reads: [respite_ledger.amount, respite_ledger.nights, respite_ledger.event_type, respite_ledger.tier_billed, respite_ledger.credit_reason, respite_ledger.payer_type, respite_ledger.posting_date]
        note: The closing-year care share and the care-stay charges the resident bore are decided from the resident's respite ledger.
    compute:
      - term_months_ago: "MONTHS(F('termination_date'), NOW) if F('termination_date') else 99"
      - amortization_in_year: "SUM('entrance_ledger', 'amount', within_months=K('window_to_months'), date_field='posting_date', event_type='entrance_amortization') - SUM('entrance_ledger', 'amount', within_months=K('window_from_months'), date_field='posting_date', event_type='entrance_amortization')"
      - retention_in_year: "SUM('entrance_ledger', 'amount', within_months=K('window_to_months'), date_field='posting_date', event_type='entrance_admin_fee_retention') - SUM('entrance_ledger', 'amount', within_months=K('window_from_months'), date_field='posting_date', event_type='entrance_admin_fee_retention')"
      - fee_received_in_year: "SUM('entrance_ledger', 'amount', within_months=K('window_to_months'), date_field='posting_date', event_type='entrance_deposit_payment') - SUM('entrance_ledger', 'amount', within_months=K('window_from_months'), date_field='posting_date', event_type='entrance_deposit_payment') + SUM('entrance_ledger', 'amount', within_months=K('window_to_months'), date_field='posting_date', event_type='entrance_balance_payment') - SUM('entrance_ledger', 'amount', within_months=K('window_from_months'), date_field='posting_date', event_type='entrance_balance_payment')"
      - closing_entrance_amount: "retention_in_year + amortization_in_year if ((F('termination_reason') == 'death' or F('termination_reason') == 'resident_notice' or F('termination_reason') == 'larkspur_for_cause') and term_months_ago >= K('window_from_months') and term_months_ago < K('window_to_months')) else (0 if ((F('termination_reason') == 'rescission' or F('termination_reason') == 'pre_occupancy_cancellation' or F('termination_reason') == 'pre_occupancy_death_or_illness') and term_months_ago >= K('window_from_months') and term_months_ago < K('window_to_months')) else fee_received_in_year)"
      - il_charges_in_year: "XSUM('independent', 'independent_ledger', 'amount', within_months=K('window_to_months'), date_field='posting_date', event_type='independent_monthly_fee_charge') - XSUM('independent', 'independent_ledger', 'amount', within_months=K('window_from_months'), date_field='posting_date', event_type='independent_monthly_fee_charge')"
      - il_proration_credits: "XSUM('independent', 'independent_ledger', 'amount', within_months=K('window_to_months'), date_field='posting_date', event_type='independent_credit', credit_reason='move_out_proration') - XSUM('independent', 'independent_ledger', 'amount', within_months=K('window_from_months'), date_field='posting_date', event_type='independent_credit', credit_reason='move_out_proration')"
      - il_payments_in_year: "XSUM('independent', 'independent_ledger', 'amount', within_months=K('window_to_months'), date_field='posting_date', event_type='independent_payment') - XSUM('independent', 'independent_ledger', 'amount', within_months=K('window_from_months'), date_field='posting_date', event_type='independent_payment')"
      - il_returns_in_year: "XSUM('independent', 'independent_ledger', 'amount', within_months=K('window_to_months'), date_field='posting_date', event_type='independent_payment_return') - XSUM('independent', 'independent_ledger', 'amount', within_months=K('window_from_months'), date_field='posting_date', event_type='independent_payment_return')"
      - closing_il_amount: "il_charges_in_year - il_proration_credits if il_proration_credits > 0 else (il_payments_in_year - il_returns_in_year if il_returns_in_year > 0 else il_payments_in_year)"
      - post_residency_days: "CPARAM('independent', 'post_death_fee_days', independent_residency_id=F('independent_residency_id')) if CFIELD('independent', 'termination_reason', independent_residency_id=F('independent_residency_id')) == 'death' else (CPARAM('independent', 'internal_transfer_notice_days', independent_residency_id=F('independent_residency_id')) if (CFIELD('independent', 'termination_reason', independent_residency_id=F('independent_residency_id')) == 'transfer_assisted' or CFIELD('independent', 'termination_reason', independent_residency_id=F('independent_residency_id')) == 'transfer_memory') else 0)"
      - post_residency_fees: "RND(post_residency_days * CFIELD('independent', 'monthly_service_fee', independent_residency_id=F('independent_residency_id')) / K('days_per_month'), 2)"
      - closing_il_counted: "MX(0, closing_il_amount - post_residency_fees)"
      - closing_recovery_nights: "XSUM('respite', 'respite_ledger', 'nights', within_months=K('window_to_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Post-Hospital Recovery Stay') - XSUM('respite', 'respite_ledger', 'nights', within_months=K('window_from_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Post-Hospital Recovery Stay')"
      - closing_respite_nights: "(XSUM('respite', 'respite_ledger', 'nights', within_months=K('window_to_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Assisted Living Respite Stay (Standard Care)') - XSUM('respite', 'respite_ledger', 'nights', within_months=K('window_from_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Assisted Living Respite Stay (Standard Care)')) + (XSUM('respite', 'respite_ledger', 'nights', within_months=K('window_to_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Assisted Living Respite Stay (Enhanced Care)') - XSUM('respite', 'respite_ledger', 'nights', within_months=K('window_from_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Assisted Living Respite Stay (Enhanced Care)')) + (XSUM('respite', 'respite_ledger', 'nights', within_months=K('window_to_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Assisted Living Respite Stay (Extensive Care)') - XSUM('respite', 'respite_ledger', 'nights', within_months=K('window_from_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Assisted Living Respite Stay (Extensive Care)')) + (XSUM('respite', 'respite_ledger', 'nights', within_months=K('window_to_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Memory Care Respite Stay') - XSUM('respite', 'respite_ledger', 'nights', within_months=K('window_from_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Memory Care Respite Stay'))"
      - closing_care_share: "K('recovery_care_share') if closing_recovery_nights >= 1 else (K('respite_care_share') if closing_respite_nights >= 1 else 0)"
      - closing_stay_charges: "(XSUM('respite', 'respite_ledger', 'amount', within_months=K('window_to_months'), date_field='posting_date', event_type='respite_nightly_charge') - XSUM('respite', 'respite_ledger', 'amount', within_months=K('window_from_months'), date_field='posting_date', event_type='respite_nightly_charge')) - (XSUM('respite', 'respite_ledger', 'amount', within_months=K('window_to_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Independent Living Trial Stay') - XSUM('respite', 'respite_ledger', 'amount', within_months=K('window_from_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Independent Living Trial Stay'))"
      - closing_insurer_payments: "XSUM('respite', 'respite_ledger', 'amount', within_months=K('window_to_months'), date_field='posting_date', event_type='respite_payment', payer_type='ltc_insurer') - XSUM('respite', 'respite_ledger', 'amount', within_months=K('window_from_months'), date_field='posting_date', event_type='respite_payment', payer_type='ltc_insurer')"
      - closing_departure_credits: "XSUM('respite', 'respite_ledger', 'amount', within_months=K('window_to_months'), date_field='posting_date', event_type='respite_credit', credit_reason='early_departure') - XSUM('respite', 'respite_ledger', 'amount', within_months=K('window_from_months'), date_field='posting_date', event_type='respite_credit', credit_reason='early_departure')"
      - closing_stay_borne: "MX(0, closing_stay_charges - closing_insurer_payments) if closing_insurer_payments > 0 else (MX(0, closing_stay_charges - closing_departure_credits) if closing_departure_credits > 0 else closing_stay_charges)"
      - closing_total: "RND(P('medical_expense_pct_entrance_fee') * closing_entrance_amount / 100 + P('medical_expense_pct_monthly_fee') * closing_il_counted / 100 + closing_care_share * closing_stay_borne, 2)"
      - result: "closing_total if (P('medical_expense_pct_entrance_fee') > 0 or P('medical_expense_pct_monthly_fee') > 0) else 0"
    compute_basis:
      term_months_ago: "with the termination date in the closing year"
      amortization_in_year: "the amount is the administrative retention and the amortization entries posted in the closing year"
      retention_in_year: "the amount is the administrative retention and the amortization entries posted in the closing year"
      fee_received_in_year: "medical_expense_pct_entrance_fee percent of the entrance fee received on the agreement's ledger in the closing year"
      closing_entrance_amount: "The entrance fee amount the closing-year letter rests on depends on how the agreement ended: where it terminated after occupancy, by the resident's death, the resident's notice or Larkspur for cause, with the termination date in the closing year, the amount is the administrative retention and the amortization entries posted in the closing year; where it was rescinded or cancelled before occupancy in the closing year, the amount is 0; otherwise it is the entrance fee received in the closing year."
      il_charges_in_year: "the amount is the monthly fee charges of the closing year net of those credits"
      il_proration_credits: "where the closing year holds move-out proration credits on the independent living ledger"
      il_payments_in_year: "medical_expense_pct_monthly_fee percent of the payments posted to the resident's independent living ledger in the closing year"
      il_returns_in_year: "where it holds no such credit but a returned payment, the amount is the payments net of the returned payments"
      closing_il_amount: "The independent living amount the closing-year letter rests on depends on how that account was closed: where the closing year holds move-out proration credits on the independent living ledger, the amount is the monthly fee charges of the closing year net of those credits; where it holds no such credit but a returned payment, the amount is the payments net of the returned payments; otherwise it is the payments posted in the closing year."
      post_residency_days: "where the paired independent living residency ended on the resident's death, the post-death fee days of that apartment type are deducted, and where it ended on a transfer to Larkspur assisted living or memory care, the internal transfer notice days of that apartment type are deducted"
      post_residency_fees: "each deducted day is the residency's monthly service fee divided by 30, the deduction rounded to the cent half up"
      closing_il_counted: "taken from the independent living amount before the percentage applies, the result never below 0.00"
      closing_recovery_nights: "where the closing year holds Post-Hospital Recovery Stay nights the share is 1.0"
      closing_respite_nights: "where it holds Assisted Living Respite Stay or Memory Care Respite Stay nights but no recovery nights the share is 0.6"
      closing_care_share: "Larkspur care stays charged in the closing year are added at a closing-year care share: where the closing year holds Post-Hospital Recovery Stay nights the share is 1.0, where it holds Assisted Living Respite Stay or Memory Care Respite Stay nights but no recovery nights the share is 0.6, and otherwise the share is 0; the share applies to the closing-year care-stay charges the resident bore."
      closing_stay_charges: "The closing-year care-stay charges the resident bore are the nightly charges of Larkspur care stays, every stay type other than the Independent Living Trial Stay, posted in the closing year"
      closing_insurer_payments: "where a long-term care insurer paid toward those stays in the closing year they are reduced by the insurer's payments"
      closing_departure_credits: "where no insurer paid but early-departure credits were posted in the closing year they are reduced by those credits"
      closing_stay_borne: "The closing-year care-stay charges the resident bore are the nightly charges of Larkspur care stays, every stay type other than the Independent Living Trial Stay, posted in the closing year: where a long-term care insurer paid toward those stays in the closing year they are reduced by the insurer's payments; where no insurer paid but early-departure credits were posted in the closing year they are reduced by those credits; otherwise they count in full; the result never falls below 0.00."
      closing_total: "The closing-year letter's medical expense amount is its entrance fee share plus its residence fee share plus its closing-year care-stay share, added before a single rounding to the cent half up."
      result: "A plan whose medical expense percentages are both 0.0 receives a closing-year letter stating 0.00, whatever else the closing year holds."
    factors:
      - id: closing_entrance_basis
        effect: method
        decides: closing_entrance_amount
        bindings: [term_months_ago, amortization_in_year, retention_in_year, closing_entrance_amount]
        ladder:
          - when: "the agreement terminated after occupancy (death, resident notice or for cause) with the termination date in the closing year"
            method: "the administrative retention and amortization entries posted in the closing year"
          - when: "the agreement was rescinded or cancelled before occupancy in the closing year"
            method: "no entrance fee amount (0)"
          - when: "otherwise"
            method: "the entrance fee received in the closing year"
        baseline:
          closing_entrance_amount: "fee_received_in_year"
        evidence: [history, date]
        cross_difficulty: null
      - id: closing_il_basis
        effect: method
        decides: closing_il_amount
        bindings: [il_charges_in_year, il_proration_credits, il_returns_in_year, closing_il_amount]
        ladder:
          - when: "the closing year holds move-out proration credits on the independent living ledger"
            method: "monthly fee charges net of those credits"
          - when: "no such credit but a returned payment in the closing year"
            method: "payments net of the returned payments"
          - when: "otherwise"
            method: "payments posted in the closing year"
        baseline:
          closing_il_amount: "il_payments_in_year"
        evidence: [cross_category, history]
        cross_difficulty: independent
      - id: post_residency_deduction
        effect: parameter
        decides: post_residency_days
        bindings: [post_residency_days, post_residency_fees]
        ladder:
          - when: "the paired independent living residency ended on the resident's death"
            value: "CPARAM('independent', 'post_death_fee_days')"
          - when: "the paired independent living residency ended on a transfer to Larkspur assisted living or memory care"
            value: "CPARAM('independent', 'internal_transfer_notice_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          post_residency_days: "0"
        evidence: [cross_category]
        cross_difficulty: independent
      - id: closing_care_share
        effect: parameter
        decides: closing_care_share
        bindings: [closing_recovery_nights, closing_respite_nights, closing_care_share]
        ladder:
          - when: "the closing year holds Post-Hospital Recovery Stay nights"
            value: "K('recovery_care_share')"
          - when: "the closing year holds Assisted Living or Memory Care Respite Stay nights and no recovery nights"
            value: "K('respite_care_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          closing_care_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: respite
      - id: closing_stay_payer
        effect: method
        decides: closing_stay_borne
