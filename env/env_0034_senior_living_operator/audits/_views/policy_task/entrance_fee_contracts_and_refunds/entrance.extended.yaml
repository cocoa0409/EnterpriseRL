events:
  - type: entrance_agreement_create
    target: entrance_agreements
    mutation: create
    meaning: The resident signs an Entrance Fee Agreement for a named independent living apartment at a Life Plan campus, opening it in reserved status.
    grain: One row per agreement signed.
    fields:
      entrance_agreement_id: Reference number of the agreement.
      customer_id: The first resident.
      variant_name: Refund plan chosen, verbatim tier name.
      community_name: Life Plan campus.
      apartment_type: Independent living apartment type, verbatim independent living tier name.
      apartment_number: Apartment number named in the agreement.
      independent_residency_id: The independent living residency opened for the apartment.
      occupancy_type: single or double.
      entrance_fee_amount: Total entrance fee of the agreement, second person fee included.
      financial_qualification_date: Date the financial application was approved.
      health_screening_date: Date of the health screening; empty where not required.
      signing_date: Date the agreement was signed.
      planned_occupancy_date: Planned occupancy date.
    triggers:
      - event: entrance:entrance_deposit_payment
        map: {entrance_agreement_id: entrance_agreement_id, customer_id: customer_id, installment: deposit}
  - type: entrance_rescind
    target: entrance_agreements
    mutation: {transition: {from: reserved, to: rescinded}}
    meaning: The resident rescinds the agreement within the rescission period.
    grain: One row per agreement.
    fields:
      entrance_agreement_id: The agreement.
      termination_date: Date the rescission notice was signed.
      termination_reason: Fixed to rescission.
      refund_payee_type: resident.
    triggers:
      - event: entrance:entrance_refund_payment
        map: {entrance_agreement_id: entrance_agreement_id, refund_payee_type: resident}
  - type: entrance_cancel_pre_occupancy
    target: entrance_agreements
    mutation: {transition: {from: reserved, to: cancelled}}
    meaning: The agreement is cancelled before occupancy - by the resident after the rescission period, or because death, illness or injury prevents occupancy.
    grain: One row per agreement.
    fields:
      entrance_agreement_id: The agreement.
      termination_date: Date of the signed cancellation, or the date of death or of the physician's certification.
      termination_reason: pre_occupancy_cancellation or pre_occupancy_death_or_illness.
      refund_payee_type: resident, or estate after a death.
    triggers:
      - event: entrance:entrance_processing_fee_retention
        when: {termination_reason: pre_occupancy_cancellation}
        map: {entrance_agreement_id: entrance_agreement_id}
      - event: entrance:entrance_refund_payment
        map: {entrance_agreement_id: entrance_agreement_id, refund_payee_type: refund_payee_type}
  - type: entrance_occupancy_extend
    target: entrance_agreements
    mutation: update
    meaning: The planned occupancy date is moved later by one occupancy extension.
    grain: One row per extension granted.
    fields:
      entrance_agreement_id: The agreement.
      planned_occupancy_date: New planned occupancy date.
      occupancy_extensions_used: Number of extensions granted including this one.
    triggers: []
  - type: entrance_occupy
    target: entrance_agreements
    mutation: {transition: {from: reserved, to: occupied}}
    meaning: The resident takes occupancy of the apartment.
    grain: One row per agreement.
    fields:
      entrance_agreement_id: The agreement.
      occupancy_date: Date of occupancy; amortization is counted from it.
    triggers:
      - event: entrance:entrance_admin_fee_retention
        map: {entrance_agreement_id: entrance_agreement_id}
  - type: entrance_apartment_change
    target: entrance_agreements
    mutation: update
    meaning: The resident moves, at their request, to another independent living apartment on the campus under the same agreement.
    grain: One row per apartment change.
    fields:
      entrance_agreement_id: The agreement.
      apartment_type: New apartment type.
      apartment_number: New apartment number.
      entrance_fee_amount: Entrance fee after the change - increased by the upsize difference, unchanged on a downsize.
    triggers: []
  - type: entrance_termination_notice
    target: entrance_agreements
    mutation: update
    meaning: The resident's signed written notice of termination is recorded; the agreement remains occupied until the termination date.
    grain: One row per notice.
    fields:
      entrance_agreement_id: The agreement.
      termination_notice_date: Date the notice was signed.
    triggers: []
  - type: entrance_termination_notice_withdraw
    target: entrance_agreements
    mutation: update
    meaning: The resident withdraws a notice of termination before the termination date.
    grain: One row per withdrawal.
    fields:
      entrance_agreement_id: The agreement.
      termination_notice_date: Cleared to empty.
    triggers: []
  - type: entrance_terminate
    target: entrance_agreements
    mutation: {transition: {from: occupied, to: terminated}}
    meaning: The agreement terminates and amortization stops.
    grain: One row per agreement.
    fields:
      entrance_agreement_id: The agreement.
      termination_date: Date the agreement terminated.
      termination_reason: resident_notice, death or larkspur_for_cause.
      refund_payee_type: resident, or estate after the death of the last resident.
    triggers: []
  - type: entrance_reoccupancy_record
    target: entrance_agreements
    mutation: update
    meaning: A new resident has paid the full entrance fee for the same apartment and taken occupancy, which is recorded on the terminated agreement.
    grain: One row per terminated agreement.
    fields:
      entrance_agreement_id: The terminated agreement.
      unit_reoccupied_date: Date the new resident's full entrance fee for the apartment was received.
    triggers: []
  - type: entrance_estate_documents_record
    target: entrance_agreements
    mutation: update
    meaning: Letters testamentary or letters of administration for the resident's estate are received.
    grain: One row per agreement.
    fields:
      entrance_agreement_id: The agreement.
      estate_documents_date: Date the letters were received.
    triggers: []
  - type: entrance_refund_schedule
    target: entrance_agreements
    mutation: {transition: {from: terminated, to: refund_scheduled}}
    meaning: The refund is calculated, the written refund statement issued and the refund due date fixed.
    grain: One row per agreement.
    fields:
      entrance_agreement_id: The agreement.
      refund_due_date: Date by which the refund must be paid.
    triggers: []
  - type: entrance_close
    target: entrance_agreements
    mutation: {transition: [{from: refund_scheduled, to: closed}, {from: terminated, to: closed}]}
    meaning: The agreement is closed after the refund is paid, or when nothing remains refundable.
    grain: One row per agreement.
    fields:
      entrance_agreement_id: The agreement.
      closed_date: Date closed.
    triggers: []
  - type: entrance_deposit_payment
    target: entrance_ledger
    meaning: The entrance fee deposit is received at signing and held in escrow.
    grain: One row per payment instrument.
    distinguish_by: [payment_reference]
    fields:
      entrance_agreement_id: The agreement.
      customer_id: The resident.
      amount: Deposit received, positive, USD.
      posting_date: Date received.
      payment_reference: Check number, wire reference or ACH trace number.
      payment_method: Instrument type.
      installment: deposit.
    account: refundable_balance
    direction: in
    triggers: []
  - type: entrance_balance_payment
    target: entrance_ledger
    meaning: The entrance fee balance, an upsize difference or a later second person entrance fee is received.
    grain: One row per payment instrument.
    distinguish_by: [payment_reference]
    fields:
      entrance_agreement_id: The agreement.
      customer_id: The resident.
      amount: Payment, positive, USD.
      posting_date: Date received.
      payment_reference: Check number, wire reference or ACH trace number.
      payment_method: Instrument type.
      installment: balance, upsize_difference or second_person.
    account: refundable_balance
    direction: in
    triggers: []
  - type: entrance_admin_fee_retention
    target: entrance_ledger
    meaning: The administrative portion of the entrance fee becomes non-refundable on the occupancy date.
    grain: One row per agreement.
    distinguish_by: [posting_date]
    fields:
      entrance_agreement_id: The agreement.
      customer_id: The resident.
      amount: Amount retained, positive, USD.
      posting_date: The occupancy date.
    account: refundable_balance
    direction: out
    triggers: []
  - type: entrance_amortization
    target: entrance_ledger
    meaning: One month of occupancy amortizes part of the entrance fee.
    grain: One row per agreement per month of occupancy.
    distinguish_by: [amortization_month]
    fields:
      entrance_agreement_id: The agreement.
      customer_id: The resident.
      amount: Amount amortized, positive, USD.
      posting_date: First day of the occupancy month amortized.
      amortization_month: Sequence number of the month of occupancy, 1 for the month beginning on the occupancy date.
    account: refundable_balance
    direction: out
    triggers: []
  - type: entrance_processing_fee_retention
    target: entrance_ledger
    meaning: The processing fee is retained on a cancellation before occupancy.
    grain: One row per agreement.
    distinguish_by: [posting_date]
    fields:
      entrance_agreement_id: The agreement.
      customer_id: The resident.
      amount: Fee retained, positive, USD.
      posting_date: Date retained.
    account: refundable_balance
    direction: out
    triggers: []
  - type: entrance_account_offset
    target: entrance_ledger
    meaning: Part of the refundable amount is applied to an unpaid charge on the resident's Larkspur residency account.
    grain: One row per residency charge entry offset.
    distinguish_by: [offset_entry_id]
    fields:
      entrance_agreement_id: The agreement.
      customer_id: The resident.
      amount: Amount applied, positive, USD.
      posting_date: Date applied.
      offset_category: independent, assisted or memory - the residency account whose charge is paid.
      offset_entry_id: The unpaid charge entry on that residency ledger.
    account: refundable_balance
    direction: out
    triggers:
      - event: independent:independent_payment
        when: {offset_category: independent}
        map: {customer_id: customer_id, amount: amount, payment_method: entrance_refund_offset}
      - event: assisted:assisted_payment
        when: {offset_category: assisted}
        map: {customer_id: customer_id, amount: amount, payment_method: entrance_refund_offset}
      - event: memory:memory_payment
        when: {offset_category: memory}
        map: {customer_id: customer_id, amount: amount, payment_method: entrance_refund_offset}
  - type: entrance_refurbishment_deduction
    target: entrance_ledger
    meaning: The cost of refurbishment beyond normal wear and tear, documented by a maintenance work order, is deducted from the refund.
    grain: One row per work order.
    distinguish_by: [work_order_reference]
    fields:
      entrance_agreement_id: The agreement.
      customer_id: The resident.
      amount: Amount deducted, positive, USD.
      posting_date: Date deducted.
      work_order_reference: Maintenance work order number, exactly as printed.
    account: refundable_balance
    direction: out
    triggers: []
  - type: entrance_refund_payment
    target: entrance_ledger
    meaning: The refund is paid to the resident or the estate.
    grain: One row per refund instrument.
    distinguish_by: [payment_reference]
    fields:
      entrance_agreement_id: The agreement.
      customer_id: The resident.
      amount: Refund paid, positive, USD.
      posting_date: Date paid.
      payment_reference: Refund check number or wire or ACH reference.
      payment_method: Instrument type.
      refund_payee_type: resident or estate.
    account: refundable_balance
    direction: out
    triggers: []
  - type: entrance_tax_letter
    target: entrance_ledger
    meaning: The annual tax letter stating the portion of entrance fee and monthly fees paid in a tax year that is attributable to medical care is issued.
    grain: One row per agreement per tax year.
    distinguish_by: [tax_year]
    fields:
      entrance_agreement_id: The agreement.
      customer_id: The resident.
      amount: Medical expense amount stated on the letter, USD.
      posting_date: Date issued.
      tax_year: Tax year covered, YYYY.
    triggers: []

measures:
  - id: entrance_msr_months_of_occupancy
    window: From the occupancy date to the termination date (or the handling date while occupied).
    measure: Number of months of occupancy, each month beginning on the occupancy date or a monthly anniversary of it on or before the end date counting in full, a month started counting as a whole month.
  - id: entrance_msr_fee_received
    window: All time on the agreement, by posting_date.
    measure: Sum of entrance_deposit_payment and entrance_balance_payment amounts.
  - id: entrance_msr_unpaid_residency_charges
    window: As of the handling date.
    measure: The positive account_balance of the customer's independent living, assisted living and memory care residencies linked to the campus, each traced to the unpaid charge entries that make it up, oldest first.
  - id: entrance_msr_refurbishment_deducted
    window: All time on the agreement.
    measure: Sum of entrance_refurbishment_deduction amounts.

policies:
  - id: entrance_agg_multi_holding
    subject: [entrance_agreement_create]
    rule: >-
      A customer holds at most one Entrance Fee Agreement at a time; a couple sharing an apartment holds one agreement with occupancy_type double and the second person entrance fee, never two agreements.
      A new agreement may be signed only when the customer has no other agreement in reserved, occupied, terminated or refund_scheduled status.
      An agreement is always paired with the independent living residency for the same apartment: the agreement names that residency, and the independent living monthly fee of an entrance fee resident follows the monthly_fee_adjustment_pct of the plan under the independent living charter.
    eligibility:
      - id: no_open_agreement
        applies_to: [entrance_agreement_create]
        kind: dedup
        condition: A new agreement may be signed only when the customer has no other agreement in reserved, occupied, terminated or refund_scheduled status.
        evidence_fields: [entrance_agreements.customer_id, entrance_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.customer_id]
          action_bindings:
            entrance_agreements.customer_id: customer_id
        dedup_contract:
          table: entrance_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [reserved, occupied, terminated, refund_scheduled]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: entrance_pricing_and_qualification
    subject: [entrance_agreement_create, entrance_deposit_payment, entrance_balance_payment]
    rule: >-
      Entrance Fee Agreements are offered only at the campuses listed in eligible_communities; a request at any other Larkspur community is for a rental residency instead.
      The entrance fee of the agreement is base_entrance_fee_schedule of the apartment type times entrance_fee_factor of the plan, rounded half up to the nearest entrance_fee_rounding_usd, plus second_person_entrance_fee of the plan for double occupancy.
      The first resident must be at least min_resident_age years old on the planned occupancy date and a second resident at least second_person_min_age.
      Financial qualification requires net worth of at least net_worth_multiple times the entrance fee and monthly income of at least monthly_income_multiple times the independent living monthly fee, shown on a financial application approved by Larkspur.
      The agreement may be signed only within financial_application_validity_days after the financial application is approved.
      The validity period is counted in calendar days from the approval date, the approval date being day 0, and signing on the last day is still valid.
      Where health_screening_required is true, a health screening showing the applicant can live independently must be dated no more than health_screening_validity_days before signing.
      The deposit is deposit_pct of the entrance fee, received at signing and held in escrow until occupancy or rescission where escrow_release_on_occupancy is true; the balance is received no later than balance_due_days_before_occupancy calendar days before the occupancy date.
      Entrance fee payments are accepted by wire transfer, one-time ACH, personal check or certified check, never by card.
      Entrance fee payments may be posted only while the agreement is in reserved or occupied status, an occupied agreement taking only an upsize difference or a later second person entrance fee.
    eligibility:
      - id: financial_application_current
        applies_to: [entrance_agreement_create]
        kind: time
        condition: The agreement may be signed only within financial_application_validity_days after the financial application is approved.
        evidence_fields: [entrance_agreements.financial_qualification_date, entrance_agreements.entrance_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.entrance_agreement_id]
          action_bindings:
            entrance_agreements.entrance_agreement_id: entrance_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the financial application is approved
          anchor_source: entrance_agreements.financial_qualification_date
          relation: not_after
          duration_source: variants.financial_application_validity_days
          unit: calendar_days
          counting_rule: The validity period is counted in calendar days from the approval date, the approval date being day 0, and signing on the last day is still valid.
          boundary: inclusive
      - id: payments_on_live_agreement
        applies_to: [entrance_deposit_payment, entrance_balance_payment]
        kind: state
        condition: Entrance fee payments may be posted only while the agreement is in reserved or occupied status, an occupied agreement taking only an upsize difference or a later second person entrance fee.
        evidence_fields: [entrance_agreements.status, entrance_agreements.entrance_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.entrance_agreement_id]
          action_bindings:
            entrance_agreements.entrance_agreement_id: entrance_agreement_id
        state_contract:
          field: entrance_agreements.status
          allowed: [reserved, occupied]
    params:
      per_tier:
        LifeChoice Declining Balance Plan: {entrance_fee_factor: "=entrance_fee_factor", second_person_entrance_fee: "=second_person_entrance_fee", net_worth_multiple: "=net_worth_multiple", monthly_income_multiple: "=monthly_income_multiple", health_screening_required: "=health_screening_required"}
        LifeChoice 50% Refundable Plan: {entrance_fee_factor: "=entrance_fee_factor", second_person_entrance_fee: "=second_person_entrance_fee", net_worth_multiple: "=net_worth_multiple", monthly_income_multiple: "=monthly_income_multiple", health_screening_required: "=health_screening_required"}
        LifeChoice 75% Refundable Plan: {entrance_fee_factor: "=entrance_fee_factor", second_person_entrance_fee: "=second_person_entrance_fee", net_worth_multiple: "=net_worth_multiple", monthly_income_multiple: "=monthly_income_multiple", health_screening_required: "=health_screening_required"}
        LifeChoice 90% Refundable Plan: {entrance_fee_factor: "=entrance_fee_factor", second_person_entrance_fee: "=second_person_entrance_fee", net_worth_multiple: "=net_worth_multiple", monthly_income_multiple: "=monthly_income_multiple", health_screening_required: "=health_screening_required"}
        LifeCare Declining Balance Plan: {entrance_fee_factor: "=entrance_fee_factor", second_person_entrance_fee: "=second_person_entrance_fee", net_worth_multiple: "=net_worth_multiple", monthly_income_multiple: "=monthly_income_multiple", health_screening_required: "=health_screening_required"}
        LifeCare 90% Refundable Plan: {entrance_fee_factor: "=entrance_fee_factor", second_person_entrance_fee: "=second_person_entrance_fee", net_worth_multiple: "=net_worth_multiple", monthly_income_multiple: "=monthly_income_multiple", health_screening_required: "=health_screening_required"}
    formula:
      deposit_amount: round(entrance_fee_amount * deposit_pct / 100, 2)
      balance_amount: entrance_fee_amount - deposit_amount

  - id: entrance_rescission
    subject: [entrance_rescind, entrance_refund_payment]
    rule: >-
      The resident may rescind the agreement by a signed rescission notice, for any reason and without penalty, within the rescission period of the campus in rescission_days_by_community.
      The agreement may be rescinded only within the rescission period after the agreement is signed.
      The rescission period is counted in calendar days from the signing date, the signing date being day 0, and a rescission notice signed on the last day of the period is effective.
      On rescission rescission_refund_pct percent of all money paid is refunded no later than rescission_refund_days calendar days after the rescission, without any processing fee or amortization.
      Rescission is possible only before occupancy; after the period ends a cancellation before occupancy follows the pre-occupancy cancellation policy.
      The rescission notice must be signed by the resident or by a representative whose representative_authority is financial_poa, durable_poa or guardian.
    eligibility:
      - id: within_rescission_period
        applies_to: [entrance_rescind]
        kind: time
        condition: The agreement may be rescinded only within the rescission period after the agreement is signed.
        evidence_fields: [entrance_agreements.signing_date, entrance_agreements.entrance_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.entrance_agreement_id]
          action_bindings:
            entrance_agreements.entrance_agreement_id: entrance_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the agreement is signed
          anchor_source: entrance_agreements.signing_date
          relation: not_after
          duration_source: variants.rescission_days_by_community
          unit: calendar_days
          counting_rule: The rescission period is counted in calendar days from the signing date, the signing date being day 0, and a rescission notice signed on the last day of the period is effective.
          boundary: inclusive
      - id: rescission_signer
        applies_to: [entrance_rescind]
        kind: authorization
        condition: The rescission notice must be signed by the resident or by a representative whose representative_authority is financial_poa, durable_poa or guardian.
        evidence_fields: [customers.representative_authority, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params:
      per_tier:
        LifeChoice Declining Balance Plan: {rescission_days_by_community: "=rescission_days_by_community", rescission_refund_pct: "=rescission_refund_pct", rescission_refund_days: "=rescission_refund_days"}
        LifeChoice 50% Refundable Plan: {rescission_days_by_community: "=rescission_days_by_community", rescission_refund_pct: "=rescission_refund_pct", rescission_refund_days: "=rescission_refund_days"}
        LifeChoice 75% Refundable Plan: {rescission_days_by_community: "=rescission_days_by_community", rescission_refund_pct: "=rescission_refund_pct", rescission_refund_days: "=rescission_refund_days"}
        LifeChoice 90% Refundable Plan: {rescission_days_by_community: "=rescission_days_by_community", rescission_refund_pct: "=rescission_refund_pct", rescission_refund_days: "=rescission_refund_days"}
        LifeCare Declining Balance Plan: {rescission_days_by_community: "=rescission_days_by_community", rescission_refund_pct: "=rescission_refund_pct", rescission_refund_days: "=rescission_refund_days"}
        LifeCare 90% Refundable Plan: {rescission_days_by_community: "=rescission_days_by_community", rescission_refund_pct: "=rescission_refund_pct", rescission_refund_days: "=rescission_refund_days"}

  - id: entrance_pre_occupancy_cancellation
    subject: [entrance_cancel_pre_occupancy, entrance_processing_fee_retention, entrance_refund_payment, entrance_occupancy_extend]
    rule: >-
      After the rescission period and before occupancy the resident may cancel by signed notice; a processing fee of pre_occupancy_cancellation_fee_pct percent of the entrance fee, rounded to the cent half up, is retained and the rest of the money paid is refunded no later than pre_occupancy_refund_days calendar days after the cancellation.
      Where the resident dies before occupancy, or a physician certifies in writing that illness or injury prevents the resident from occupying the apartment, the agreement is cancelled with termination_reason pre_occupancy_death_or_illness, no processing fee is retained and pre_occupancy_health_refund_pct percent of the money paid is refunded, to the estate after a death.
      A death before occupancy is evidenced only by date_of_death on the customer profile.
      Occupancy must take place within occupancy_deadline_days after signing; on the resident's request before that deadline the planned occupancy date may be extended by occupancy_extension_days, at most occupancy_extension_max times.
      An occupancy extension may be granted only while the agreement is in reserved status.
      A resident who neither occupies by the deadline nor obtains an extension is treated as cancelling before occupancy on the deadline date.
      A pre-occupancy cancellation by the resident must be signed by the resident or by a representative whose representative_authority is financial_poa, durable_poa or guardian.
    eligibility:
      - id: cancellation_signer
        applies_to: [entrance_cancel_pre_occupancy]
        kind: authorization
        condition: A pre-occupancy cancellation by the resident must be signed by the resident or by a representative whose representative_authority is financial_poa, durable_poa or guardian.
        evidence_fields: [customers.representative_authority, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: death_on_record
        applies_to: [entrance_cancel_pre_occupancy]
        kind: authorization
        condition: A death before occupancy is evidenced only by date_of_death on the customer profile.
        evidence_fields: [customers.date_of_death, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: extension_while_reserved
        applies_to: [entrance_occupancy_extend]
        kind: state
        condition: An occupancy extension may be granted only while the agreement is in reserved status.
        evidence_fields: [entrance_agreements.status, entrance_agreements.entrance_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.entrance_agreement_id]
          action_bindings:
            entrance_agreements.entrance_agreement_id: entrance_agreement_id
        state_contract:
          field: entrance_agreements.status
          allowed: [reserved]
    params:
      per_tier:
        LifeChoice Declining Balance Plan: {pre_occupancy_cancellation_fee_pct: "=pre_occupancy_cancellation_fee_pct", pre_occupancy_health_refund_pct: "=pre_occupancy_health_refund_pct", pre_occupancy_refund_days: "=pre_occupancy_refund_days", occupancy_deadline_days: "=occupancy_deadline_days", occupancy_extension_days: "=occupancy_extension_days", occupancy_extension_max: "=occupancy_extension_max"}
        LifeChoice 50% Refundable Plan: {pre_occupancy_cancellation_fee_pct: "=pre_occupancy_cancellation_fee_pct", pre_occupancy_health_refund_pct: "=pre_occupancy_health_refund_pct", pre_occupancy_refund_days: "=pre_occupancy_refund_days", occupancy_deadline_days: "=occupancy_deadline_days", occupancy_extension_days: "=occupancy_extension_days", occupancy_extension_max: "=occupancy_extension_max"}
        LifeChoice 75% Refundable Plan: {pre_occupancy_cancellation_fee_pct: "=pre_occupancy_cancellation_fee_pct", pre_occupancy_health_refund_pct: "=pre_occupancy_health_refund_pct", pre_occupancy_refund_days: "=pre_occupancy_refund_days", occupancy_deadline_days: "=occupancy_deadline_days", occupancy_extension_days: "=occupancy_extension_days", occupancy_extension_max: "=occupancy_extension_max"}
        LifeChoice 90% Refundable Plan: {pre_occupancy_cancellation_fee_pct: "=pre_occupancy_cancellation_fee_pct", pre_occupancy_health_refund_pct: "=pre_occupancy_health_refund_pct", pre_occupancy_refund_days: "=pre_occupancy_refund_days", occupancy_deadline_days: "=occupancy_deadline_days", occupancy_extension_days: "=occupancy_extension_days", occupancy_extension_max: "=occupancy_extension_max"}
        LifeCare Declining Balance Plan: {pre_occupancy_cancellation_fee_pct: "=pre_occupancy_cancellation_fee_pct", pre_occupancy_health_refund_pct: "=pre_occupancy_health_refund_pct", pre_occupancy_refund_days: "=pre_occupancy_refund_days", occupancy_deadline_days: "=occupancy_deadline_days", occupancy_extension_days: "=occupancy_extension_days", occupancy_extension_max: "=occupancy_extension_max"}
        LifeCare 90% Refundable Plan: {pre_occupancy_cancellation_fee_pct: "=pre_occupancy_cancellation_fee_pct", pre_occupancy_health_refund_pct: "=pre_occupancy_health_refund_pct", pre_occupancy_refund_days: "=pre_occupancy_refund_days", occupancy_deadline_days: "=occupancy_deadline_days", occupancy_extension_days: "=occupancy_extension_days", occupancy_extension_max: "=occupancy_extension_max"}
    formula:
      processing_fee: round(entrance_fee_amount * pre_occupancy_cancellation_fee_pct / 100, 2)

  - id: entrance_occupancy_and_amortization
    subject: [entrance_occupy, entrance_admin_fee_retention, entrance_amortization]
    rule: >-
      Occupancy may be recorded only after the full entrance fee is received, entrance_msr_fee_received being equal to entrance_fee_amount.
      On the occupancy date admin_fee_pct percent of the entrance fee becomes non-refundable as one administrative retention.
      Thereafter one amortization is booked for each month of occupancy, the first for the month beginning on the occupancy date and each later one on the monthly anniversary of the occupancy date, of amortization_pct_per_month percent of the entrance fee rounded to the cent half up.
      Amortization stops once the refundable balance reaches refundable_floor_pct percent of the entrance fee, the final month amortizing only the amount down to the floor, and stops at the termination date; a month that starts on or before the termination date is amortized in full.
      Amortization may be booked only while the agreement is in occupied status, and each month of occupancy is amortized once.
      A move to Larkspur assisted living or memory care on the campus does not stop amortization, because where transfer_to_care_keeps_agreement is true the agreement remains occupied.
    eligibility:
      - id: fee_received_before_occupancy
        applies_to: [entrance_occupy]
        kind: authorization
        condition: Occupancy may be recorded only after the full entrance fee is received, entrance_msr_fee_received being equal to entrance_fee_amount.
        evidence_fields: [entrance_agreements.entrance_fee_amount, entrance_agreements.entrance_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.entrance_agreement_id]
          action_bindings:
            entrance_agreements.entrance_agreement_id: entrance_agreement_id
      - id: amortize_while_occupied
        applies_to: [entrance_admin_fee_retention, entrance_amortization]
        kind: state
        condition: Amortization may be booked only while the agreement is in occupied status, and each month of occupancy is amortized once.
        evidence_fields: [entrance_agreements.status, entrance_agreements.entrance_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.entrance_agreement_id]
          action_bindings:
            entrance_agreements.entrance_agreement_id: entrance_agreement_id
        state_contract:
          field: entrance_agreements.status
          allowed: [occupied]
    measures: [entrance_msr_fee_received, entrance_msr_months_of_occupancy]
    params:
      per_tier:
        LifeChoice Declining Balance Plan: {admin_fee_pct: "=admin_fee_pct", amortization_pct_per_month: "=amortization_pct_per_month", refundable_floor_pct: "=refundable_floor_pct"}
        LifeChoice 50% Refundable Plan: {admin_fee_pct: "=admin_fee_pct", amortization_pct_per_month: "=amortization_pct_per_month", refundable_floor_pct: "=refundable_floor_pct"}
        LifeChoice 75% Refundable Plan: {admin_fee_pct: "=admin_fee_pct", amortization_pct_per_month: "=amortization_pct_per_month", refundable_floor_pct: "=refundable_floor_pct"}
        LifeChoice 90% Refundable Plan: {admin_fee_pct: "=admin_fee_pct", amortization_pct_per_month: "=amortization_pct_per_month", refundable_floor_pct: "=refundable_floor_pct"}
        LifeCare Declining Balance Plan: {admin_fee_pct: "=admin_fee_pct", amortization_pct_per_month: "=amortization_pct_per_month", refundable_floor_pct: "=refundable_floor_pct"}
        LifeCare 90% Refundable Plan: {admin_fee_pct: "=admin_fee_pct", amortization_pct_per_month: "=amortization_pct_per_month", refundable_floor_pct: "=refundable_floor_pct"}
    formula:
      admin_retention: round(entrance_fee_amount * admin_fee_pct / 100, 2)
      monthly_amortization: min(round(entrance_fee_amount * amortization_pct_per_month / 100, 2), refundable_balance - round(entrance_fee_amount * refundable_floor_pct / 100, 2))

  - id: entrance_termination
    subject: [entrance_termination_notice, entrance_termination_notice_withdraw, entrance_terminate, entrance_apartment_change]
    rule: >-
      After occupancy the resident terminates the agreement only by a signed written notice; the agreement terminates on the notice date plus termination_notice_days calendar days.
      The notice must be signed by the resident or by a representative whose representative_authority is financial_poa, durable_poa or guardian.
      A termination after notice may be recorded only once termination_notice_days have passed since the notice was signed.
      The notice period is counted in calendar days from the notice date, the notice date being day 0, and the agreement terminates on the day the count reaches termination_notice_days.
      A notice may be withdrawn at any time before the termination date, and the agreement then continues as if no notice had been given.
      Where termination_notice_waived_on_death is true the agreement terminates on the date of death of the last resident, evidenced only by date_of_death on the customer profile, and the refund is payable to the estate; when one of two residents dies the agreement continues for the survivor.
      The plan's contract_type decides the care benefit: a fee_for_service plan discounts future care, and a lifecare plan covers care level fees almost entirely through its larger discounts. A move to Larkspur assisted living or memory care on the campus is not a termination where transfer_to_care_keeps_agreement is true; it changes no refund term and brings the care_fee_discount_pct and rent_discount_pct of the plan into effect under the assisted living and memory care charters.
      Larkspur may terminate for cause only after for_cause_notice_days of written notice from the executive director; the desk never initiates or reverses such a termination.
      A resident may change apartments on the campus under the same agreement: a larger apartment type requires payment of the difference between the entrance fees of the two types at current prices under the same plan where upsize_difference_due is true, a smaller type refunds nothing where downsize_difference_refunded is false, and apartment_change_fee is charged on the independent living account.
      Notices and apartment changes may be recorded only while the agreement is in occupied status.
    eligibility:
      - id: notice_signer
        applies_to: [entrance_termination_notice, entrance_termination_notice_withdraw]
        kind: authorization
        condition: The notice must be signed by the resident or by a representative whose representative_authority is financial_poa, durable_poa or guardian.
        evidence_fields: [customers.representative_authority, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: notice_period_elapsed
        applies_to: [entrance_terminate]
        kind: time
        condition: A termination after notice may be recorded only once termination_notice_days have passed since the notice was signed.
        evidence_fields: [entrance_agreements.termination_notice_date, entrance_agreements.entrance_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.entrance_agreement_id]
          action_bindings:
            entrance_agreements.entrance_agreement_id: entrance_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the notice was signed
          anchor_source: entrance_agreements.termination_notice_date
          relation: not_before
          duration_source: variants.termination_notice_days
          unit: calendar_days
          counting_rule: The notice period is counted in calendar days from the notice date, the notice date being day 0, and the agreement terminates on the day the count reaches termination_notice_days.
          boundary: inclusive
      - id: notices_while_occupied
        applies_to: [entrance_termination_notice, entrance_termination_notice_withdraw, entrance_apartment_change]
        kind: state
        condition: Notices and apartment changes may be recorded only while the agreement is in occupied status.
        evidence_fields: [entrance_agreements.status, entrance_agreements.entrance_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.entrance_agreement_id]
          action_bindings:
            entrance_agreements.entrance_agreement_id: entrance_agreement_id
        state_contract:
          field: entrance_agreements.status
          allowed: [occupied]
    params:
      per_tier:
        LifeChoice Declining Balance Plan: {termination_notice_days: "=termination_notice_days", transfer_to_care_keeps_agreement: "=transfer_to_care_keeps_agreement", for_cause_notice_days: "=for_cause_notice_days", apartment_change_fee: "=apartment_change_fee"}
        LifeChoice 50% Refundable Plan: {termination_notice_days: "=termination_notice_days", transfer_to_care_keeps_agreement: "=transfer_to_care_keeps_agreement", for_cause_notice_days: "=for_cause_notice_days", apartment_change_fee: "=apartment_change_fee"}
        LifeChoice 75% Refundable Plan: {termination_notice_days: "=termination_notice_days", transfer_to_care_keeps_agreement: "=transfer_to_care_keeps_agreement", for_cause_notice_days: "=for_cause_notice_days", apartment_change_fee: "=apartment_change_fee"}
        LifeChoice 90% Refundable Plan: {termination_notice_days: "=termination_notice_days", transfer_to_care_keeps_agreement: "=transfer_to_care_keeps_agreement", for_cause_notice_days: "=for_cause_notice_days", apartment_change_fee: "=apartment_change_fee"}
        LifeCare Declining Balance Plan: {termination_notice_days: "=termination_notice_days", transfer_to_care_keeps_agreement: "=transfer_to_care_keeps_agreement", for_cause_notice_days: "=for_cause_notice_days", apartment_change_fee: "=apartment_change_fee"}
        LifeCare 90% Refundable Plan: {termination_notice_days: "=termination_notice_days", transfer_to_care_keeps_agreement: "=transfer_to_care_keeps_agreement", for_cause_notice_days: "=for_cause_notice_days", apartment_change_fee: "=apartment_change_fee"}

  - id: entrance_refund_calculation
    subject: [entrance_account_offset, entrance_refurbishment_deduction, entrance_refund_schedule]
    rule: >-
      After termination the refundable amount is the refundable_balance - the entrance fee received less the administrative retention and every amortization booked through the termination date.
      From it are deducted, each as its own entry, first every unpaid charge on the customer's Larkspur independent living, assisted living or memory care residency at the campus as measured by entrance_msr_unpaid_residency_charges, applied to those charges oldest first and referencing each charge entry; then the cost of refurbishment beyond normal wear and tear documented by a maintenance work order.
      Refurbishment deductions in total may not exceed refurbishment_deduction_cap_pct percent of the entrance fee, rounded to the cent half up.
      The written refund calculation statement is issued and the refund scheduled no later than refund_calculation_statement_days calendar days after the termination date, and deductions may be recorded only while the agreement is in terminated status.
      Each residency charge entry is offset at most once.
      Where nothing remains refundable after deductions the agreement is closed without a refund.
    eligibility:
      - id: deductions_after_termination
        applies_to: [entrance_account_offset, entrance_refurbishment_deduction]
        kind: state
        condition: The written refund calculation statement is issued and the refund scheduled no later than refund_calculation_statement_days calendar days after the termination date, and deductions may be recorded only while the agreement is in terminated status.
        evidence_fields: [entrance_agreements.status, entrance_agreements.entrance_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.entrance_agreement_id]
          action_bindings:
            entrance_agreements.entrance_agreement_id: entrance_agreement_id
        state_contract:
          field: entrance_agreements.status
          allowed: [terminated]
      - id: offset_once_per_charge
        applies_to: [entrance_account_offset]
        kind: dedup
        condition: Each residency charge entry is offset at most once.
        evidence_fields: [entrance_ledger.offset_entry_id, entrance_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_ledger.offset_entry_id]
          action_bindings:
            entrance_ledger.offset_entry_id: offset_entry_id
        dedup_contract:
          table: entrance_ledger
          mode: separate_record
          object_bindings: {offset_entry_id: offset_entry_id}
          duplicate_filters: {event_type: [entrance_account_offset]}
          distinct_fields: []
    measures: [entrance_msr_unpaid_residency_charges, entrance_msr_refurbishment_deducted]
    formula:
      refurbishment_cap: round(entrance_fee_amount * refurbishment_deduction_cap_pct / 100, 2) - entrance_msr_refurbishment_deducted
      refund_before_deductions: refundable_balance

  - id: entrance_refund_timing
    subject: [entrance_refund_schedule, entrance_reoccupancy_record, entrance_estate_documents_record, entrance_refund_payment, entrance_close]
    rule: >-
      The refund due date depends on the plan.
      Where refund_contingent_on_reoccupancy is false, the refund is due declining_refund_days calendar days after the termination date.
      Where refund_contingent_on_reoccupancy is true, the refund is due reoccupancy_refund_days calendar days after the unit_reoccupied_date, the date a new resident's full entrance fee for the same apartment is received, but never later than refund_longstop_months calendar months after the termination date, whichever is earlier; until the apartment is re-occupied the refund due date is the long-stop date.
      Calendar months are added to the termination date keeping the day number, falling back to the last day of the month where that day does not exist.
      A refund payable to an estate, where estate_documents_required is true, may be paid only after letters testamentary or letters of administration are on file, shown by estate_documents_date; the refund is then paid to the estate's personal representative named in them.
      Each agreement is refunded in one payment, and refunds may be paid only while the agreement is in rescinded, cancelled or refund_scheduled status.
      The agreement is closed once the refund is paid and the refundable balance is 0.00.
      A refund that is not yet due is never advanced on request; families asking to accelerate a contingent refund are told the due date the rule produces.
    eligibility:
      - id: estate_documents_on_file
        applies_to: [entrance_refund_payment]
        kind: authorization
        condition: A refund payable to an estate, where estate_documents_required is true, may be paid only after letters testamentary or letters of administration are on file, shown by estate_documents_date; the refund is then paid to the estate's personal representative named in them.
        evidence_fields: [entrance_agreements.estate_documents_date, entrance_agreements.refund_payee_type, entrance_agreements.entrance_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.entrance_agreement_id]
          action_bindings:
            entrance_agreements.entrance_agreement_id: entrance_agreement_id
      - id: refund_on_closed_agreement
        applies_to: [entrance_refund_payment]
        kind: state
        condition: Each agreement is refunded in one payment, and refunds may be paid only while the agreement is in rescinded, cancelled or refund_scheduled status.
        evidence_fields: [entrance_agreements.status, entrance_agreements.entrance_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_agreements.entrance_agreement_id]
          action_bindings:
            entrance_agreements.entrance_agreement_id: entrance_agreement_id
        state_contract:
          field: entrance_agreements.status
          allowed: [rescinded, cancelled, refund_scheduled]
      - id: one_refund_per_agreement
        applies_to: [entrance_refund_payment]
        kind: dedup
        condition: Each agreement is refunded in one payment, and refunds may be paid only while the agreement is in rescinded, cancelled or refund_scheduled status.
        evidence_fields: [entrance_ledger.entrance_agreement_id, entrance_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_ledger.entrance_agreement_id]
          action_bindings:
            entrance_ledger.entrance_agreement_id: entrance_agreement_id
        dedup_contract:
          table: entrance_ledger
          mode: separate_record
          object_bindings: {entrance_agreement_id: entrance_agreement_id}
          duplicate_filters: {event_type: [entrance_refund_payment]}
          distinct_fields: []
    params:
      per_tier:
        LifeChoice Declining Balance Plan: {refund_contingent_on_reoccupancy: "=refund_contingent_on_reoccupancy", reoccupancy_refund_days: "=reoccupancy_refund_days", declining_refund_days: "=declining_refund_days", refund_longstop_months: "=refund_longstop_months", estate_documents_required: "=estate_documents_required"}
        LifeChoice 50% Refundable Plan: {refund_contingent_on_reoccupancy: "=refund_contingent_on_reoccupancy", reoccupancy_refund_days: "=reoccupancy_refund_days", declining_refund_days: "=declining_refund_days", refund_longstop_months: "=refund_longstop_months", estate_documents_required: "=estate_documents_required"}
        LifeChoice 75% Refundable Plan: {refund_contingent_on_reoccupancy: "=refund_contingent_on_reoccupancy", reoccupancy_refund_days: "=reoccupancy_refund_days", declining_refund_days: "=declining_refund_days", refund_longstop_months: "=refund_longstop_months", estate_documents_required: "=estate_documents_required"}
        LifeChoice 90% Refundable Plan: {refund_contingent_on_reoccupancy: "=refund_contingent_on_reoccupancy", reoccupancy_refund_days: "=reoccupancy_refund_days", declining_refund_days: "=declining_refund_days", refund_longstop_months: "=refund_longstop_months", estate_documents_required: "=estate_documents_required"}
        LifeCare Declining Balance Plan: {refund_contingent_on_reoccupancy: "=refund_contingent_on_reoccupancy", reoccupancy_refund_days: "=reoccupancy_refund_days", declining_refund_days: "=declining_refund_days", refund_longstop_months: "=refund_longstop_months", estate_documents_required: "=estate_documents_required"}
        LifeCare 90% Refundable Plan: {refund_contingent_on_reoccupancy: "=refund_contingent_on_reoccupancy", reoccupancy_refund_days: "=reoccupancy_refund_days", declining_refund_days: "=declining_refund_days", refund_longstop_months: "=refund_longstop_months", estate_documents_required: "=estate_documents_required"}

  - id: entrance_tax_letter_policy
    subject: [entrance_tax_letter]
    rule: >-
      Each agreement whose resident paid entrance fee or independent living monthly fees in a tax year receives one tax letter for that year, issued by tax_letter_deadline of the following year.
      The medical expense amount stated is medical_expense_pct_entrance_fee percent of the entrance fee received in the tax year plus medical_expense_pct_monthly_fee percent of the independent living monthly fees paid in the tax year, rounded to the cent half up; a plan whose percentages are 0.0 receives a letter stating 0.00.
      A reissued letter for the same tax year replaces nothing on the account and is not a second letter; Larkspur does not give tax advice.
      One tax letter is issued per agreement per tax year.
    eligibility:
      - id: one_letter_per_year
        applies_to: [entrance_tax_letter]
        kind: dedup
        condition: One tax letter is issued per agreement per tax year.
        evidence_fields: [entrance_ledger.entrance_agreement_id, entrance_ledger.tax_year, entrance_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [entrance_ledger.entrance_agreement_id, entrance_ledger.tax_year]
          action_bindings:
            entrance_ledger.entrance_agreement_id: entrance_agreement_id
            entrance_ledger.tax_year: tax_year
        dedup_contract:
          table: entrance_ledger
          mode: separate_record
          object_bindings: {entrance_agreement_id: entrance_agreement_id, tax_year: tax_year}
          duplicate_filters: {event_type: [entrance_tax_letter]}
          distinct_fields: []
    params:
      per_tier:
        LifeChoice Declining Balance Plan: {medical_expense_pct_entrance_fee: "=medical_expense_pct_entrance_fee", medical_expense_pct_monthly_fee: "=medical_expense_pct_monthly_fee"}
        LifeChoice 50% Refundable Plan: {medical_expense_pct_entrance_fee: "=medical_expense_pct_entrance_fee", medical_expense_pct_monthly_fee: "=medical_expense_pct_monthly_fee"}
        LifeChoice 75% Refundable Plan: {medical_expense_pct_entrance_fee: "=medical_expense_pct_entrance_fee", medical_expense_pct_monthly_fee: "=medical_expense_pct_monthly_fee"}
        LifeChoice 90% Refundable Plan: {medical_expense_pct_entrance_fee: "=medical_expense_pct_entrance_fee", medical_expense_pct_monthly_fee: "=medical_expense_pct_monthly_fee"}
        LifeCare Declining Balance Plan: {medical_expense_pct_entrance_fee: "=medical_expense_pct_entrance_fee", medical_expense_pct_monthly_fee: "=medical_expense_pct_monthly_fee"}
        LifeCare 90% Refundable Plan: {medical_expense_pct_entrance_fee: "=medical_expense_pct_entrance_fee", medical_expense_pct_monthly_fee: "=medical_expense_pct_monthly_fee"}

extended_policies:
  - id: entrance_ext_cancellation_processing_fee
    base_policy_refs: [entrance_pre_occupancy_cancellation]
    overwrite:
      - base_policy: entrance_pre_occupancy_cancellation
        superseded_clause: >-
          a processing fee of pre_occupancy_cancellation_fee_pct percent of the entrance fee, rounded to the cent half up, is retained
        replaced_by: >-
          The processing fee percentage of a cancellation is set by the days of notice it gave before occupancy: 60 or more days of notice take 1.0 percent, 30 to 59 days take 1.5 percent, and fewer than 30 days take the plan's standard processing fee percentage.
    trigger: on_request
    subject: [entrance_cancel_pre_occupancy, entrance_processing_fee_retention]
    computes: processing_fee
    target_tool: sign_pre_occupancy_cancellation_25852637
    params:
      long_notice_days: 60
      mid_notice_days: 30
      rate_long_notice: 1.0
      rate_mid_notice: 1.5
      extension_surcharge_close: 0.5
      extension_surcharge_early: 0.25
      trial_lookback_months: 12
      trial_full_credit_nights: 7
      trial_half_credit_nights: 3
      trial_full_credit_share: 1.0
      trial_half_credit_share: 0.5
      tenure_half_months: 24
      tenure_three_quarter_months: 12
      tenure_half_multiplier: 0.5
      tenure_three_quarter_multiplier: 0.75
    rule: >-
      A cancellation before occupancy is signed by the resident, or by a representative holding financial_poa, durable_poa or guardian authority, after the rescission period has ended and while the agreement is still reserved; signing it cancels the agreement and retains the processing fee from the money paid.
      On a cancellation before occupancy signed by the resident after the rescission period, the processing fee is pre_occupancy_cancellation_fee_pct percent of the entrance fee of the agreement, rounded to the cent half up, and it is retained from the money paid as one processing fee entry dated the day the cancellation is signed.
      The notice date of a cancellation is fixed as follows: where a cancellation request on the agreement was registered by Larkspur and still awaits the resident's signature, the notice date is the day that request was registered; where no cancellation request awaits signature but the independent living reservation paired with the agreement was cancelled, the notice date is the day that reservation was closed; in every other case the notice date is the day the cancellation is signed.
      The days of notice are the calendar days from the notice date to the planned occupancy date on the agreement.
      The processing fee percentage of a cancellation is set by the days of notice it gave before occupancy: 60 or more days of notice take 1.0 percent, 30 to 59 days take 1.5 percent, and fewer than 30 days take the plan's standard processing fee percentage.
      An agreement whose planned occupancy date was moved by an occupancy extension carries an extension surcharge added to that percentage: where a signed occupancy extension is on file and the days of notice are fewer than 30, the surcharge is 0.5 percentage points; where a signed occupancy extension is on file and the days of notice are 30 or more, the surcharge is 0.25 percentage points; where no signed occupancy extension is on file there is no surcharge.
      The percentage and the surcharge are first added together, and their sum is applied once to the entrance fee of the agreement, the product rounded to the cent half up; this is the gross processing fee.
      A Larkspur Independent Living Trial Stay is credited against the gross processing fee: the trial-stay credit share is set by the trial-stay nights charged in the 12 months before the cancellation, 7 or more nights taking a share of 1.0, 3 to 6 nights a share of 0.5, and fewer than 3 nights a share of 0; the credit is that share of the trial-stay nightly charges posted in the same 12 months, rounded to the cent half up, and it is subtracted from the gross processing fee, the result never falling below 0.00.
      A customer who already rents a Larkspur independent living apartment is treated as an internal move: where the customer holds an active independent living residency whose move-in date is 24 or more whole months before the cancellation, the fee after the trial-stay credit is halved and rounded down to the whole dollar; where that move-in date is 12 to 23 whole months before, the fee after the trial-stay credit is multiplied by 0.75 and rounded up to the whole dollar; otherwise the fee after the trial-stay credit stands to the cent.
      The amount so obtained is the processing fee entered on the agreement's ledger, and the refundable balance falls by it.
    prerequisite: []
    cross_category:
      - category: respite
        as: history
        reads: [respite_ledger.nights, respite_ledger.amount, respite_ledger.event_type, respite_ledger.tier_billed, respite_ledger.posting_date]
        note: The trial-stay credit share is decided from the customer's Independent Living Trial Stay nightly charges on the respite ledger.
      - category: independent
        as: branch
        reads: [status, move_in_date, closed_date, termination_reason, independent_residency_id]
        note: The internal-move rounding and the reservation-based notice date are decided from the customer's independent living residencies.
    compute:
      - notice_credit_days: "DAYS(LATEST('entrance_requests', 'created_at', date_field='created_at', request_type='pre_occupancy_cancellation', request_status='pending_signature'), NOW) if COUNT('entrance_requests', request_type='pre_occupancy_cancellation', request_status='pending_signature') >= 1 else (DAYS(CFIELD('independent', 'closed_date', independent_residency_id=F('independent_residency_id'), status='cancelled'), NOW) if EXISTS('independent', independent_residency_id=F('independent_residency_id'), status='cancelled') else 0)"
      - notice_days: "DAYS(NOW, F('planned_occupancy_date')) + notice_credit_days"
      - fee_percentage: "K('rate_long_notice') if notice_days >= K('long_notice_days') else (K('rate_mid_notice') if notice_days >= K('mid_notice_days') else P('pre_occupancy_cancellation_fee_pct'))"
      - signed_extensions: "COUNT('entrance_requests', request_type='occupancy_extension', request_status='signed')"
      - extension_surcharge: "K('extension_surcharge_close') if (signed_extensions >= 1 and notice_days < K('mid_notice_days')) else (K('extension_surcharge_early') if (signed_extensions >= 1 and notice_days >= K('mid_notice_days')) else 0)"
      - gross_processing_fee: "RND(F('entrance_fee_amount') * (fee_percentage + extension_surcharge) / 100, 2)"
      - trial_nights: "XSUM('respite', 'respite_ledger', 'nights', within_months=K('trial_lookback_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Independent Living Trial Stay')"
      - trial_charges: "XSUM('respite', 'respite_ledger', 'amount', within_months=K('trial_lookback_months'), date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Independent Living Trial Stay')"
      - trial_credit_share: "K('trial_full_credit_share') if trial_nights >= K('trial_full_credit_nights') else (K('trial_half_credit_share') if trial_nights >= K('trial_half_credit_nights') else 0)"
      - trial_credit: "RND(trial_charges * trial_credit_share, 2)"
      - fee_after_credit: "MX(0, gross_processing_fee - trial_credit)"
      - rental_months: "MONTHS(CFIELD('independent', 'move_in_date', status='active'), NOW) if EXISTS('independent', status='active') else 0"
      - fee_after_internal_move: "float(int(fee_after_credit * K('tenure_half_multiplier'))) if rental_months >= K('tenure_half_months') else (float(-int(-(fee_after_credit * K('tenure_three_quarter_multiplier')))) if rental_months >= K('tenure_three_quarter_months') else fee_after_credit)"
      - result: "fee_after_internal_move"
    compute_basis:
      notice_credit_days: "The notice date of a cancellation is fixed as follows: where a cancellation request on the agreement was registered by Larkspur and still awaits the resident's signature, the notice date is the day that request was registered; where no cancellation request awaits signature but the independent living reservation paired with the agreement was cancelled, the notice date is the day that reservation was closed; in every other case the notice date is the day the cancellation is signed."
      notice_days: "The days of notice are the calendar days from the notice date to the planned occupancy date on the agreement."
      fee_percentage: "The processing fee percentage of a cancellation is set by the days of notice it gave before occupancy: 60 or more days of notice take 1.0 percent, 30 to 59 days take 1.5 percent, and fewer than 30 days take the plan's standard processing fee percentage."
      signed_extensions: "where a signed occupancy extension is on file"
      extension_surcharge: "An agreement whose planned occupancy date was moved by an occupancy extension carries an extension surcharge added to that percentage: where a signed occupancy extension is on file and the days of notice are fewer than 30, the surcharge is 0.5 percentage points; where a signed occupancy extension is on file and the days of notice are 30 or more, the surcharge is 0.25 percentage points; where no signed occupancy extension is on file there is no surcharge."
      gross_processing_fee: "The percentage and the surcharge are first added together, and their sum is applied once to the entrance fee of the agreement, the product rounded to the cent half up; this is the gross processing fee."
      trial_nights: "the trial-stay credit share is set by the trial-stay nights charged in the 12 months before the cancellation"
      trial_charges: "the credit is that share of the trial-stay nightly charges posted in the same 12 months, rounded to the cent half up"
      trial_credit_share: "the trial-stay credit share is set by the trial-stay nights charged in the 12 months before the cancellation, 7 or more nights taking a share of 1.0, 3 to 6 nights a share of 0.5, and fewer than 3 nights a share of 0"
      trial_credit: "the credit is that share of the trial-stay nightly charges posted in the same 12 months, rounded to the cent half up"
      fee_after_credit: "it is subtracted from the gross processing fee, the result never falling below 0.00"
      rental_months: "where the customer holds an active independent living residency whose move-in date is 24 or more whole months before the cancellation"
      fee_after_internal_move: "A customer who already rents a Larkspur independent living apartment is treated as an internal move: where the customer holds an active independent living residency whose move-in date is 24 or more whole months before the cancellation, the fee after the trial-stay credit is halved and rounded down to the whole dollar; where that move-in date is 12 to 23 whole months before, the fee after the trial-stay credit is multiplied by 0.75 and rounded up to the whole dollar; otherwise the fee after the trial-stay credit stands to the cent."
      result: "The amount so obtained is the processing fee entered on the agreement's ledger, and the refundable balance falls by it."
    factors:
      - id: cancellation_notice_date
        effect: method
        decides: notice_credit_days
        bindings: [notice_credit_days]
        ladder:
          - when: "a cancellation request on the agreement was registered by Larkspur and still awaits the resident's signature"
            method: "the notice date is the day that request was registered"
          - when: "no cancellation request awaits signature and the independent living reservation paired with the agreement was cancelled"
            method: "the notice date is the day that reservation was closed"
          - when: "otherwise"
            method: "the notice date is the day the cancellation is signed"
        baseline:
          notice_credit_days: "0"
        evidence: [history, date, cross_category]
        cross_difficulty: null
      - id: notice_fee_percentage
        effect: parameter
        decides: fee_percentage
        bindings: [notice_days, fee_percentage]
        ladder:
          - when: "60 or more days of notice before the planned occupancy date"
            value: "K('rate_long_notice')"
          - when: "30 to 59 days of notice"
            value: "K('rate_mid_notice')"
          - when: "otherwise (fewer than 30 days of notice)"
            value: "P('pre_occupancy_cancellation_fee_pct')"
        baseline:
          fee_percentage: "P('pre_occupancy_cancellation_fee_pct')"
        evidence: [date]
        cross_difficulty: null
      - id: occupancy_extension_surcharge
        effect: parameter
        decides: extension_surcharge
        bindings: [signed_extensions, extension_surcharge]
        ladder:
          - when: "a signed occupancy extension is on file and the days of notice are fewer than 30"
            value: "K('extension_surcharge_close')"
          - when: "a signed occupancy extension is on file and the days of notice are 30 or more"
            value: "K('extension_surcharge_early')"
          - when: "otherwise (no signed occupancy extension on file)"
            value: "0"
        baseline:
          extension_surcharge: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: trial_stay_credit_share
        effect: parameter
        decides: trial_credit_share
        bindings: [trial_nights, trial_charges, trial_credit_share]
        ladder:
          - when: "7 or more Independent Living Trial Stay nights charged in the 12 months before the cancellation"
            value: "K('trial_full_credit_share')"
          - when: "3 to 6 such nights"
            value: "K('trial_half_credit_share')"
          - when: "otherwise (fewer than 3 such nights)"
            value: "0"
        baseline:
          trial_credit_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: respite
      - id: internal_move_rounding
        effect: method
        decides: fee_after_internal_move
        bindings: [rental_months, fee_after_internal_move]
        ladder:
          - when: "an active Larkspur independent living residency with a move-in date 24 or more whole months before the cancellation"
            method: "the fee after the trial-stay credit is halved and rounded down to the whole dollar"
          - when: "an active Larkspur independent living residency with a move-in date 12 to 23 whole months before the cancellation"
            method: "the fee after the trial-stay credit is multiplied by 0.75 and rounded up to the whole dollar"
          - when: "otherwise"
            method: "the fee after the trial-stay credit stands to the cent"
        baseline:
          fee_after_internal_move: "fee_after_credit"
        evidence: [cross_category, date]
        cross_difficulty: independent
    baseline:
      rule: >-
        On a cancellation before occupancy signed by the resident after the rescission period, the processing fee is pre_occupancy_cancellation_fee_pct percent of the entrance fee of the agreement, rounded to the cent half up, and it is retained from the money paid as one processing fee entry dated the day the cancellation is signed.
      params: [pre_occupancy_cancellation_fee_pct]
    inputs:
      history:
        - {table: entrance_requests, aggregate: count, field: entrance_request_id, filters: {request_type: occupancy_extension, request_status: signed}}
        - {table: entrance_requests, aggregate: latest, field: created_at, filters: {request_type: pre_occupancy_cancellation, request_status: pending_signature}}
        - {category: respite, table: respite_ledger, aggregate: sum, field: nights, within_months: 12, filters: {event_type: respite_nightly_charge, tier_billed: Independent Living Trial Stay}}
        - {category: respite, table: respite_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: respite_nightly_charge, tier_billed: Independent Living Trial Stay}}
      cross_category: [respite, independent]
  - id: entrance_ext_pre_occupancy_refund
    base_policy_refs: [entrance_rescission, entrance_pre_occupancy_cancellation, entrance_refund_timing]
    overwrite:
      - base_policy: entrance_pre_occupancy_cancellation
        superseded_clause: >-
          the rest of the money paid is refunded no later than pre_occupancy_refund_days calendar days after the cancellation
        replaced_by: >-
          Where the escrowed deposit earned escrow interest, the refund on a resident's own cancellation before occupancy is the money received less the processing fee retained plus that escrow interest, added once to the net amount and rounded to the cent half up.
    trigger: state_due
    subject: [entrance_refund_payment]
    computes: refund_amount
    target_tool: pay_pre_occupancy_refund_45806fa1
    params:
      escrow_high_deposit: 40000
      escrow_mid_deposit: 20000
      escrow_rate_high: 2.05
      escrow_rate_mid: 1.55
      term_long_days: 90
      term_mid_days: 60
      term_bonus_long: 0.40
      term_bonus_mid: 0.20
      check_hold_days: 5
      ach_hold_days: 2
      day_basis_360: 360
      day_basis_365: 365
      months_per_year: 12
    rule: >-
      A refund on a resident's own cancellation before occupancy is not paid until the agreement stands in cancelled status and its ledger carries the processing fee retained on that cancellation.
      The refund on a resident's own cancellation before occupancy is the money received on the agreement - every deposit and balance payment entered on its ledger - less the processing fee entered on its ledger, paid in one payment to the resident by refund check mailed to the address on file.
      This refund rule covers only a cancellation signed by the resident or the resident's financial agent; a cancellation because death, illness or injury prevents occupancy retains no processing fee and its refund, to the estate after a death, stays governed by the pre-occupancy cancellation terms of the base charter, outside this rule.
      The refund is paid no later than pre_occupancy_refund_days calendar days after the cancellation.
      Where the escrowed deposit earned escrow interest, the refund on a resident's own cancellation before occupancy is the money received less the processing fee retained plus that escrow interest, added once to the net amount and rounded to the cent half up.
      The deposit is the only money held in escrow, and the escrow interest is figured on the deposit amount at the escrow rate for the term held.
      The escrow rate is set by the size of the deposit: a deposit of 40,000.00 or more earns 2.05 percent a year, a deposit of 20,000.00 to 39,999.99 earns 1.55 percent a year, and a smaller deposit earns no escrow interest.
      A term bonus is added to the escrow rate for the days the deposit was held, counted from the day the deposit was posted to the cancellation date: 90 or more days add 0.40 percentage points, 60 to 89 days add 0.20 percentage points, and fewer than 60 days add nothing; the escrow rate and the term bonus are added together before they are applied.
      Interest accrues from the day the deposit funds were available: a deposit paid by personal check accrues from 5 days after it was posted, a deposit paid by one-time ACH accrues from 2 days after it was posted, and a deposit paid by wire transfer or certified check accrues from the day it was posted; the accrual days never fall below 0.
      The day count follows the escrow bank of the campus: at Larkspur at Willow Creek the interest is the deposit times the combined rate times the accrual days divided by 360; at Larkspur at Brookfield the interest is the deposit times the combined rate divided by 12 for each whole month from the deposit's posting date to the cancellation date; at any other campus the interest is the deposit times the combined rate times the accrual days divided by 365; in every case the interest is rounded to the cent half up.
    prerequisite:
      - problem: entrance_ext_cancellation_processing_fee
        kind: value_input
        gate: fee_retained
        form: state
        policy_source: >-
          A refund on a resident's own cancellation before occupancy is not paid until the agreement stands in cancelled status and its ledger carries the processing fee retained on that cancellation.
        condition: >-
          entrance_agreements.status is cancelled with termination_reason pre_occupancy_cancellation, and entrance_ledger carries an entrance_processing_fee_retention entry for the agreement.
        resolved_by: sign_pre_occupancy_cancellation_25852637
        effect: >-
          The cancellation entry sets the status to cancelled and books the processing fee; fee_retained changes from 0.00 to the processing fee booked, so the refund falls by that amount.
    cross_category: []
    compute:
      - money_received: "SUM('entrance_ledger', 'amount', date_field='posting_date', event_type='entrance_deposit_payment') + SUM('entrance_ledger', 'amount', date_field='posting_date', event_type='entrance_balance_payment')"
      - fee_retained: "SUM('entrance_ledger', 'amount', date_field='posting_date', event_type='entrance_processing_fee_retention')"
      - escrowed_deposit: "SUM('entrance_ledger', 'amount', date_field='posting_date', event_type='entrance_deposit_payment')"
      - escrow_rate: "K('escrow_rate_high') if escrowed_deposit >= K('escrow_high_deposit') else (K('escrow_rate_mid') if escrowed_deposit >= K('escrow_mid_deposit') else 0)"
      - deposit_days_held: "DAYS(LATEST('entrance_ledger', 'posting_date', date_field='posting_date', event_type='entrance_deposit_payment'), F('termination_date'))"
      - term_bonus: "K('term_bonus_long') if deposit_days_held >= K('term_long_days') else (K('term_bonus_mid') if deposit_days_held >= K('term_mid_days') else 0)"
      - deposit_instrument: "LATEST('entrance_ledger', 'payment_method', date_field='posting_date', event_type='entrance_deposit_payment')"
      - accrual_days: "MX(0, deposit_days_held - K('check_hold_days')) if deposit_instrument == 'check' else (MX(0, deposit_days_held - K('ach_hold_days')) if deposit_instrument == 'ach_one_time' else deposit_days_held)"
      - escrow_interest: "RND(escrowed_deposit * (escrow_rate + term_bonus) / 100 * accrual_days / K('day_basis_360'), 2) if F('community_name') == 'Larkspur at Willow Creek' else (RND(escrowed_deposit * (escrow_rate + term_bonus) / 100 / K('months_per_year') * MONTHS(LATEST('entrance_ledger', 'posting_date', date_field='posting_date', event_type='entrance_deposit_payment'), F('termination_date')), 2) if F('community_name') == 'Larkspur at Brookfield' else RND(escrowed_deposit * (escrow_rate + term_bonus) / 100 * accrual_days / K('day_basis_365'), 2))"
      - result: "RND(money_received - fee_retained + escrow_interest, 2)"
    compute_basis:
      money_received: "The refund on a resident's own cancellation before occupancy is the money received on the agreement - every deposit and balance payment entered on its ledger - less the processing fee entered on its ledger, paid in one payment to the resident by refund check mailed to the address on file."
      fee_retained: "less the processing fee entered on its ledger"
      escrowed_deposit: "The deposit is the only money held in escrow, and the escrow interest is figured on the deposit amount at the escrow rate for the term held."
      escrow_rate: "The escrow rate is set by the size of the deposit: a deposit of 40,000.00 or more earns 2.05 percent a year, a deposit of 20,000.00 to 39,999.99 earns 1.55 percent a year, and a smaller deposit earns no escrow interest."
      deposit_days_held: "for the days the deposit was held, counted from the day the deposit was posted to the cancellation date"
      term_bonus: "A term bonus is added to the escrow rate for the days the deposit was held, counted from the day the deposit was posted to the cancellation date: 90 or more days add 0.40 percentage points, 60 to 89 days add 0.20 percentage points, and fewer than 60 days add nothing; the escrow rate and the term bonus are added together before they are applied."
      deposit_instrument: "a deposit paid by personal check accrues from 5 days after it was posted, a deposit paid by one-time ACH accrues from 2 days after it was posted"
      accrual_days: "Interest accrues from the day the deposit funds were available: a deposit paid by personal check accrues from 5 days after it was posted, a deposit paid by one-time ACH accrues from 2 days after it was posted, and a deposit paid by wire transfer or certified check accrues from the day it was posted; the accrual days never fall below 0."
      escrow_interest: "The day count follows the escrow bank of the campus: at Larkspur at Willow Creek the interest is the deposit times the combined rate times the accrual days divided by 360; at Larkspur at Brookfield the interest is the deposit times the combined rate divided by 12 for each whole month from the deposit's posting date to the cancellation date; at any other campus the interest is the deposit times the combined rate times the accrual days divided by 365; in every case the interest is rounded to the cent half up."
      result: "Where the escrowed deposit earned escrow interest, the refund on a resident's own cancellation before occupancy is the money received less the processing fee retained plus that escrow interest, added once to the net amount and rounded to the cent half up."
    factors:
      - id: escrow_deposit_rate
        effect: parameter
        decides: escrow_rate
        bindings: [escrowed_deposit, escrow_rate]
        ladder:
          - when: "an escrowed deposit of 40,000.00 or more"
            value: "K('escrow_rate_high')"
          - when: "an escrowed deposit of 20,000.00 to 39,999.99"
            value: "K('escrow_rate_mid')"
          - when: "otherwise (a smaller deposit)"
            value: "0"
        baseline:
          escrow_rate: "0"
        evidence: [history]
        cross_difficulty: null
      - id: escrow_term_bonus
        effect: parameter
        decides: term_bonus
        bindings: [deposit_days_held, term_bonus]
        ladder:
          - when: "the deposit was held 90 or more days to the cancellation date"
            value: "K('term_bonus_long')"
          - when: "the deposit was held 60 to 89 days"
            value: "K('term_bonus_mid')"
          - when: "otherwise (fewer than 60 days)"
            value: "0"
        baseline:
          term_bonus: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: deposit_funds_availability
        effect: method
        decides: accrual_days
        bindings: [deposit_instrument, accrual_days]
        ladder:
          - when: "the deposit was paid by personal check"
            method: "interest accrues from 5 days after the deposit was posted"
          - when: "the deposit was paid by one-time ACH"
            method: "interest accrues from 2 days after the deposit was posted"
          - when: "otherwise (wire transfer or certified check)"
            method: "interest accrues from the day the deposit was posted"
        baseline:
          accrual_days: "deposit_days_held"
        evidence: [history]
        cross_difficulty: null
      - id: escrow_bank_day_count
        effect: method
        decides: escrow_interest
        bindings: [escrow_interest]
        ladder:
          - when: "the agreement is at Larkspur at Willow Creek"
            method: "deposit times the combined rate times the accrual days divided by 360"
          - when: "the agreement is at Larkspur at Brookfield"
            method: "deposit times the combined rate divided by 12 for each whole month from the deposit's posting date to the cancellation date"
          - when: "otherwise"
            method: "deposit times the combined rate times the accrual days divided by 365"
        baseline:
          escrow_interest: "RND(escrowed_deposit * (escrow_rate + term_bonus) / 100 * accrual_days / K('day_basis_365'), 2)"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The refund on a resident's own cancellation before occupancy is the money received on the agreement - every deposit and balance payment entered on its ledger - less the processing fee entered on its ledger, paid in one payment to the resident by refund check mailed to the address on file.
      params: []
    inputs:
      history:
        - {table: entrance_ledger, aggregate: sum, field: amount, filters: {event_type: entrance_deposit_payment}}
        - {table: entrance_ledger, aggregate: sum, field: amount, filters: {event_type: entrance_balance_payment}}
        - {table: entrance_ledger, aggregate: sum, field: amount, filters: {event_type: entrance_processing_fee_retention}}
        - {table: entrance_ledger, aggregate: latest, field: payment_method, filters: {event_type: entrance_deposit_payment}}
      cross_category: []
  - id: entrance_ext_final_period_amortization
    base_policy_refs: [entrance_occupancy_and_amortization]
    overwrite:
      - base_policy: entrance_occupancy_and_amortization
        superseded_clause: >-
          Amortization may be booked only while the agreement is in occupied status, and each month of occupancy is amortized once.
        replaced_by: >-
          A month of occupancy that began on or before the termination date and carries no amortization entry when the agreement terminates is amortized after the termination, once, whatever status the agreement has reached; every other amortization is booked only while the agreement is occupied, each month once.
      - base_policy: entrance_occupancy_and_amortization
        superseded_clause: >-
          of amortization_pct_per_month percent of the entrance fee rounded to the cent half up
        replaced_by: >-
          Every month of occupancy is amortized at amortization_pct_per_month percent of the entrance fee rounded to the cent half up, except the final period of a terminated agreement, whose percentage is the plan's monthly amortization percentage scaled by the months already amortized: where 36 or more months already carry an amortization entry it is one half of the plan's percentage, where 18 to 35 months do it is three quarters of the plan's percentage, and where fewer than 18 do it is the plan's percentage itself.
      - base_policy: entrance_occupancy_and_amortization
        superseded_clause: >-
          a month that starts on or before the termination date is amortized in full
        replaced_by: >-
          The share of the final month amortized follows the days the agreement ran into it: 10 days or fewer are amortized pro rata at that number of days over 30, 11 to 20 days are amortized at one half of the month, and more than 20 days are amortized as a full month.
    trigger: state_due
    subject: [entrance_amortization]
    computes: amortization_amount
    target_tool: book_final_period_amortization_cad149c9
    params:
      month_convention_days: 30
      prorate_max_days: 10
      half_max_days: 20
      half_share: 0.5
      months_step_one: 18
      months_step_two: 36
      step_multiplier_mid: 0.75
      step_multiplier_long: 0.5
      quick_surrender_days: 15
      prompt_surrender_days: 30
      reduction_quick: 0.5
      reduction_prompt: 0.25
    rule: >-
      A month of occupancy that began on or before the termination date and carries no amortization entry when the agreement terminates is amortized after the termination, once, whatever status the agreement has reached; every other amortization is booked only while the agreement is occupied, each month once.
      The final-period amortization of a terminated agreement is the entrance fee times the monthly amortization percentage, divided by 100, for the month of occupancy that began on or before the termination date, never more than the refundable balance above the refundable floor, rounded to the cent half up; it is entered as one amortization entry dated the first day of that month of occupancy.
      The days the agreement ran into its final month are counted on a thirty-day-month convention, from the first day of the last month already amortized: thirty days are deducted from the calendar days between that day and the end date of the count.
      The end date of that count is fixed as follows: where the independent living apartment named in the agreement was vacated before the termination date, the count runs to the vacate date; where the agreement terminated on the death of the resident and the apartment was not vacated before that date, the count runs to the date of death and the date of death itself is counted as a day; in every other case the count runs to the termination date.
      The share of the final month amortized follows the days the agreement ran into it: 10 days or fewer are amortized pro rata at that number of days over 30, 11 to 20 days are amortized at one half of the month, and more than 20 days are amortized as a full month.
      Every month of occupancy is amortized at amortization_pct_per_month percent of the entrance fee rounded to the cent half up, except the final period of a terminated agreement, whose percentage is the plan's monthly amortization percentage scaled by the months already amortized: where 36 or more months already carry an amortization entry it is one half of the plan's percentage, where 18 to 35 months do it is three quarters of the plan's percentage, and where fewer than 18 do it is the plan's percentage itself.
      An estate that surrenders the apartment promptly earns a surrender reduction subtracted from that percentage: where the agreement terminated on the resident's death and the apartment was vacated within 15 days after the date of death, the reduction is 0.5 percentage points; where it terminated on death and the apartment was vacated 16 to 30 days after, the reduction is 0.25 percentage points; otherwise there is no reduction.
      The reduced percentage is applied to the entrance fee first, the share of the month is applied to that product, and the cap at the refundable balance above the floor is applied last, before the single rounding to the cent.
    prerequisite: []
    cross_category:
      - category: independent
        as: branch
        reads: [vacate_date, independent_residency_id]
        note: The surrender reduction and the end date of the final-month count are decided from the vacate date of the paired independent living residency.
    compute:
      - last_amortized_start: "LATEST('entrance_ledger', 'posting_date', date_field='posting_date', event_type='entrance_amortization')"
      - raw_days_run: "DAYS(last_amortized_start, F('termination_date')) - K('month_convention_days')"
      - il_vacate_date: "CFIELD('independent', 'vacate_date', independent_residency_id=F('independent_residency_id'))"
      - days_run: "MX(0, DAYS(last_amortized_start, CFIELD('independent', 'vacate_date', independent_residency_id=F('independent_residency_id'))) - K('month_convention_days')) if (il_vacate_date and DAYS(F('termination_date'), il_vacate_date) < 0) else (raw_days_run + 1 if (F('termination_reason') == 'death' and not (il_vacate_date and DAYS(F('termination_date'), il_vacate_date) < 0)) else raw_days_run)"
      - final_share: "MX(0, days_run) / K('month_convention_days') if days_run <= K('prorate_max_days') else (K('half_share') if days_run <= K('half_max_days') else 1)"
      - months_amortized: "COUNT('entrance_ledger', event_type='entrance_amortization')"
      - step_rate: "P('amortization_pct_per_month') * K('step_multiplier_long') if months_amortized >= K('months_step_two') else (P('amortization_pct_per_month') * K('step_multiplier_mid') if months_amortized >= K('months_step_one') else P('amortization_pct_per_month'))"
      - surrender_reduction: "K('reduction_quick') if (F('termination_reason') == 'death' and il_vacate_date and 0 <= DAYS(F('termination_date'), il_vacate_date) <= K('quick_surrender_days')) else (K('reduction_prompt') if (F('termination_reason') == 'death' and il_vacate_date and K('quick_surrender_days') < DAYS(F('termination_date'), il_vacate_date) <= K('prompt_surrender_days')) else 0)"
      - month_amount: "F('entrance_fee_amount') * (step_rate - surrender_reduction) / 100 * final_share"
      - floor_room: "F('refundable_balance') - RND(F('entrance_fee_amount') * P('refundable_floor_pct') / 100, 2)"
      - result: "RND(MN(month_amount, floor_room), 2)"
    compute_basis:
      last_amortized_start: "from the first day of the last month already amortized"
      raw_days_run: "The days the agreement ran into its final month are counted on a thirty-day-month convention, from the first day of the last month already amortized: thirty days are deducted from the calendar days between that day and the end date of the count."
      il_vacate_date: "where the independent living apartment named in the agreement was vacated before the termination date"
      days_run: "The end date of that count is fixed as follows: where the independent living apartment named in the agreement was vacated before the termination date, the count runs to the vacate date; where the agreement terminated on the death of the resident and the apartment was not vacated before that date, the count runs to the date of death and the date of death itself is counted as a day; in every other case the count runs to the termination date."
      final_share: "The share of the final month amortized follows the days the agreement ran into it: 10 days or fewer are amortized pro rata at that number of days over 30, 11 to 20 days are amortized at one half of the month, and more than 20 days are amortized as a full month."
      months_amortized: "where 36 or more months already carry an amortization entry it is one half of the plan's percentage, where 18 to 35 months do it is three quarters of the plan's percentage"
      step_rate: "Every month of occupancy is amortized at amortization_pct_per_month percent of the entrance fee rounded to the cent half up, except the final period of a terminated agreement, whose percentage is the plan's monthly amortization percentage scaled by the months already amortized: where 36 or more months already carry an amortization entry it is one half of the plan's percentage, where 18 to 35 months do it is three quarters of the plan's percentage, and where fewer than 18 do it is the plan's percentage itself."
      surrender_reduction: "An estate that surrenders the apartment promptly earns a surrender reduction subtracted from that percentage: where the agreement terminated on the resident's death and the apartment was vacated within 15 days after the date of death, the reduction is 0.5 percentage points; where it terminated on death and the apartment was vacated 16 to 30 days after, the reduction is 0.25 percentage points; otherwise there is no reduction."
      month_amount: "The reduced percentage is applied to the entrance fee first, the share of the month is applied to that product, and the cap at the refundable balance above the floor is applied last, before the single rounding to the cent."
      floor_room: "never more than the refundable balance above the refundable floor"
      result: "The final-period amortization of a terminated agreement is the entrance fee times the monthly amortization percentage, divided by 100, for the month of occupancy that began on or before the termination date, never more than the refundable balance above the refundable floor, rounded to the cent half up; it is entered as one amortization entry dated the first day of that month of occupancy."
    factors:
      - id: final_month_share
        effect: method
        decides: final_share
        bindings: [raw_days_run, final_share]
        ladder:
          - when: "the agreement ran 10 days or fewer into its final month"
            method: "amortized pro rata at the number of days over 30"
          - when: "the agreement ran 11 to 20 days into its final month"
            method: "amortized at one half of the month"
          - when: "otherwise (more than 20 days)"
            method: "amortized as a full month"
        baseline:
          final_share: "1"
        evidence: [date, history]
        cross_difficulty: null
      - id: final_month_count_end
        effect: method
        decides: days_run
        bindings: [days_run]
        ladder:
          - when: "the independent living apartment named in the agreement was vacated before the termination date"
            method: "the count runs to the vacate date"
          - when: "the agreement terminated on the resident's death and the apartment was not vacated before that date"
            method: "the count runs to the date of death, the date of death counted as a day"
          - when: "otherwise"
            method: "the count runs to the termination date"
        baseline:
          days_run: "raw_days_run"
        evidence: [date, cross_category]
        cross_difficulty: independent
      - id: amortization_step_rate
        effect: parameter
        decides: step_rate
        bindings: [months_amortized, step_rate]
        ladder:
          - when: "36 or more months already carry an amortization entry"
            value: "P('amortization_pct_per_month') * K('step_multiplier_long')"
          - when: "18 to 35 months already carry an amortization entry"
            value: "P('amortization_pct_per_month') * K('step_multiplier_mid')"
          - when: "otherwise (fewer than 18)"
            value: "P('amortization_pct_per_month')"
        baseline:
          step_rate: "P('amortization_pct_per_month')"
        evidence: [history]
        cross_difficulty: null
      - id: estate_surrender_reduction
        effect: parameter
        decides: surrender_reduction
        bindings: [il_vacate_date, surrender_reduction]
        ladder:
          - when: "the agreement terminated on the resident's death and the apartment was vacated within 15 days after the date of death"
            value: "K('reduction_quick')"
          - when: "the agreement terminated on the resident's death and the apartment was vacated 16 to 30 days after the date of death"
            value: "K('reduction_prompt')"
          - when: "otherwise"
            value: "0"
        baseline:
          surrender_reduction: "0"
        evidence: [cross_category, date]
        cross_difficulty: independent
    baseline:
      rule: >-
        The final-period amortization of a terminated agreement is the entrance fee times the monthly amortization percentage, divided by 100, for the month of occupancy that began on or before the termination date, never more than the refundable balance above the refundable floor, rounded to the cent half up; it is entered as one amortization entry dated the first day of that month of occupancy.
      params: [amortization_pct_per_month, refundable_floor_pct]
    inputs:
      history:
        - {table: entrance_ledger, aggregate: latest, field: posting_date, filters: {event_type: entrance_amortization}}
        - {table: entrance_ledger, aggregate: count, field: entrance_entry_id, filters: {event_type: entrance_amortization}}
      cross_category: [independent]
  - id: entrance_ext_annual_tax_letter
    base_policy_refs: [entrance_tax_letter_policy]
    overwrite:
      - base_policy: entrance_tax_letter_policy
        superseded_clause: >-
          The medical expense amount stated is medical_expense_pct_entrance_fee percent of the entrance fee received in the tax year plus medical_expense_pct_monthly_fee percent of the independent living monthly fees paid in the tax year, rounded to the cent half up
        replaced_by: >-
          The annual letter's medical expense amount is the entrance fee portion plus the monthly fee portion plus the care-stay portion plus the stay add-on portion, added before a single rounding to the cent half up.
      - base_policy: entrance_tax_letter_policy
        superseded_clause: >-
          One tax letter is issued per agreement per tax year.
        replaced_by: >-
          Each tax year of an agreement receives one annual letter, issued with a January letter run: the letter for the year just ended is issued in the January that follows it, and a letter the January run missed is issued with the next January run, never twice for the same tax year.
    trigger: state_due
    subject: [entrance_tax_letter]
    computes: medical_expense_amount
    target_tool: issue_annual_tax_letter_ce10c97a
    params:
      late_letter_age_months: 23
      late_window_from: 13
      late_window_to: 25
      ontime_window_from: 1
      ontime_window_to: 13
      recovery_share: 1.0
      respite_share: 0.6
      medication_addon_share: 1.0
      care_addon_share: 0.5
    rule: >-
      Each tax year of an agreement receives one annual letter, issued with a January letter run: the letter for the year just ended is issued in the January that follows it, and a letter the January run missed is issued with the next January run, never twice for the same tax year.
      The annual letter covers a tax year other than the one in which the agreement ended; the tax year it covers is the year after the latest tax letter on the agreement's ledger, or the year of the first entrance fee payment when there is none.
      The annual letter for the year just ended states medical_expense_pct_entrance_fee percent of the entrance fee received on the agreement's ledger in the tax year plus medical_expense_pct_monthly_fee percent of the payments posted to the resident's independent living ledger in the tax year, rounded to the cent half up; for a January issue the tax year's entries are those posted 1 to 12 whole months before the issue date.
      The annual letter's medical expense amount is the entrance fee portion plus the monthly fee portion plus the care-stay portion plus the stay add-on portion, added before a single rounding to the cent half up.
      The window of entries a letter reads is fixed by the letter on the ledger before it: where the latest tax letter on the agreement was issued 23 or more whole months before the issue date, the letter is a missed-run letter and reads the entries posted 13 to 24 whole months before the issue date; where the agreement has no tax letter yet, the letter reads the entries posted from 1 whole month before the issue date back to the month of the latest deposit payment; in every other case it reads the entries posted 1 to 12 whole months before the issue date.
      The independent living payments counted for the monthly fee portion depend on how the year's account was settled: where a payment in the window was returned unpaid, the payments are counted net of the returned payments and net of the returned-payment fees charged in the window; where a payment in the window was made by entrance refund offset and none was returned, the offset payments are left out; otherwise every payment posted in the window counts.
      Larkspur care stays charged in the window are stated as medical expense at a care-stay share: where the window holds any Post-Hospital Recovery Stay nights the share is 1.0, where it holds Assisted Living Respite Stay or Memory Care Respite Stay nights but no recovery nights the share is 0.6, and otherwise the share is 0; the share applies to the stay nightly charges counted.
      The stay nightly charges counted are those of Larkspur care stays, every stay type other than the Independent Living Trial Stay, and depend on how the stays ended: where the window holds an early-departure credit, the nightly charges are counted net of the early-departure credits; where it holds a level-change adjustment credit and no early-departure credit, the nightly charges are counted net of the level-change adjustment credits; otherwise the nightly charges count in full.
      The care-stay charges stated are those the resident bore: where a long-term care insurer paid toward the window's stays, the stay nightly charges counted are reduced by the insurer's payments; where no insurer paid but a stay refund was paid back to the guest in the window, they are reduced by those refunds; otherwise they stand as counted; the result never falls below 0.00.
      A plan whose medical expense percentages are both 0.0 receives an annual letter stating 0.00, whatever else the window holds.
      Stay add-ons charged in the window for medication setup, incontinence supplies or one-to-one companion care are stated at an add-on share: where a medication setup add-on was charged the share is 1.0, where only incontinence supplies or companion add-ons were charged the share is 0.5, and otherwise the share is 0.
    prerequisite: []
    cross_category:
      - category: independent
        as: history
        reads: [independent_ledger.amount, independent_ledger.event_type, independent_ledger.fee_code, independent_ledger.payment_method, independent_ledger.posting_date]
        note: The monthly fee portion and its settlement basis are decided from the resident's independent living ledger.
      - category: respite
        as: history
        reads: [respite_ledger.amount, respite_ledger.nights, respite_ledger.event_type, respite_ledger.tier_billed, respite_ledger.credit_reason, respite_ledger.addon_code, respite_ledger.payer_type, respite_ledger.posting_date]
        note: The care-stay share, the stay charges counted and borne, and the add-on share are decided from the resident's respite ledger.
    compute:
      - letters_on_file: "COUNT('entrance_ledger', event_type='entrance_tax_letter')"
      - last_letter_age: "MONTHS(LATEST('entrance_ledger', 'posting_date', date_field='posting_date', event_type='entrance_tax_letter'), NOW) if letters_on_file >= 1 else 0"
      - first_payment_age: "MONTHS(LATEST('entrance_ledger', 'posting_date', date_field='posting_date', event_type='entrance_deposit_payment'), NOW)"
      - window_from: "K('late_window_from') if (letters_on_file >= 1 and last_letter_age >= K('late_letter_age_months')) else K('ontime_window_from')"
      - window_to: "K('late_window_to') if (letters_on_file >= 1 and last_letter_age >= K('late_letter_age_months')) else (first_payment_age + 1 if letters_on_file == 0 else K('ontime_window_to'))"
      - entrance_received: "SUM('entrance_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='entrance_deposit_payment') - SUM('entrance_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='entrance_deposit_payment') + SUM('entrance_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='entrance_balance_payment') - SUM('entrance_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='entrance_balance_payment')"
      - il_payments: "XSUM('independent', 'independent_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='independent_payment') - XSUM('independent', 'independent_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='independent_payment')"
      - il_returns: "XSUM('independent', 'independent_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='independent_payment_return') - XSUM('independent', 'independent_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='independent_payment_return')"
      - il_return_fees: "XSUM('independent', 'independent_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='independent_service_fee_charge', fee_code='returned_payment') - XSUM('independent', 'independent_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='independent_service_fee_charge', fee_code='returned_payment')"
      - il_offsets: "XSUM('independent', 'independent_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='independent_payment', payment_method='entrance_refund_offset') - XSUM('independent', 'independent_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='independent_payment', payment_method='entrance_refund_offset')"
      - payments_counted: "il_payments - il_returns - il_return_fees if il_returns > 0 else (il_payments - il_offsets if il_offsets > 0 else il_payments)"
      - recovery_nights: "XSUM('respite', 'respite_ledger', 'nights', within_months=window_to, date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Post-Hospital Recovery Stay') - XSUM('respite', 'respite_ledger', 'nights', within_months=window_from, date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Post-Hospital Recovery Stay')"
      - respite_nights: "XSUM('respite', 'respite_ledger', 'nights', within_months=window_to, date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Assisted Living Respite Stay (Standard Care)') - XSUM('respite', 'respite_ledger', 'nights', within_months=window_from, date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Assisted Living Respite Stay (Standard Care)') + XSUM('respite', 'respite_ledger', 'nights', within_months=window_to, date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Assisted Living Respite Stay (Enhanced Care)') - XSUM('respite', 'respite_ledger', 'nights', within_months=window_from, date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Assisted Living Respite Stay (Enhanced Care)') + XSUM('respite', 'respite_ledger', 'nights', within_months=window_to, date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Assisted Living Respite Stay (Extensive Care)') - XSUM('respite', 'respite_ledger', 'nights', within_months=window_from, date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Assisted Living Respite Stay (Extensive Care)') + XSUM('respite', 'respite_ledger', 'nights', within_months=window_to, date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Memory Care Respite Stay') - XSUM('respite', 'respite_ledger', 'nights', within_months=window_from, date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Memory Care Respite Stay')"
      - care_stay_share: "K('recovery_share') if recovery_nights >= 1 else (K('respite_share') if respite_nights >= 1 else 0)"
      - stay_charges: "XSUM('respite', 'respite_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='respite_nightly_charge') - XSUM('respite', 'respite_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='respite_nightly_charge') - XSUM('respite', 'respite_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Independent Living Trial Stay') + XSUM('respite', 'respite_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='respite_nightly_charge', tier_billed='Independent Living Trial Stay')"
      - early_departure_credits: "XSUM('respite', 'respite_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='respite_credit', credit_reason='early_departure') - XSUM('respite', 'respite_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='respite_credit', credit_reason='early_departure')"
      - level_change_credits: "XSUM('respite', 'respite_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='respite_credit', credit_reason='level_change_adjustment') - XSUM('respite', 'respite_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='respite_credit', credit_reason='level_change_adjustment')"
      - stay_charges_counted: "stay_charges - early_departure_credits if early_departure_credits > 0 else (stay_charges - level_change_credits if level_change_credits > 0 else stay_charges)"
      - insurer_payments: "XSUM('respite', 'respite_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='respite_payment', payer_type='ltc_insurer') - XSUM('respite', 'respite_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='respite_payment', payer_type='ltc_insurer')"
      - guest_refunds: "XSUM('respite', 'respite_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='respite_refund') - XSUM('respite', 'respite_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='respite_refund')"
      - stay_charges_borne: "MX(0, stay_charges_counted - insurer_payments) if insurer_payments > 0 else (MX(0, stay_charges_counted - guest_refunds) if guest_refunds > 0 else stay_charges_counted)"
      - medication_addons: "XSUM('respite', 'respite_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='respite_addon_charge', addon_code='medication_setup') - XSUM('respite', 'respite_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='respite_addon_charge', addon_code='medication_setup')"
      - care_addons: "XSUM('respite', 'respite_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='respite_addon_charge', addon_code='incontinence_supplies') - XSUM('respite', 'respite_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='respite_addon_charge', addon_code='incontinence_supplies') + XSUM('respite', 'respite_ledger', 'amount', within_months=window_to, date_field='posting_date', event_type='respite_addon_charge', addon_code='one_to_one_companion') - XSUM('respite', 'respite_ledger', 'amount', within_months=window_from, date_field='posting_date', event_type='respite_addon_charge', addon_code='one_to_one_companion')"
      - addon_share: "K('medication_addon_share') if medication_addons > 0 else (K('care_addon_share') if care_addons > 0 else 0)"
      - letter_total: "RND(P('medical_expense_pct_entrance_fee') * entrance_received / 100 + P('medical_expense_pct_monthly_fee') * payments_counted / 100 + care_stay_share * stay_charges_borne + addon_share * (medication_addons + care_addons), 2)"
      - result: "letter_total if (P('medical_expense_pct_entrance_fee') > 0 or P('medical_expense_pct_monthly_fee') > 0) else 0"
    compute_basis:
      letters_on_file: "where the agreement has no tax letter yet"
      last_letter_age: "where the latest tax letter on the agreement was issued 23 or more whole months before the issue date"
      first_payment_age: "the letter reads the entries posted from 1 whole month before the issue date back to the month of the latest deposit payment"
      window_from: "The window of entries a letter reads is fixed by the letter on the ledger before it: where the latest tax letter on the agreement was issued 23 or more whole months before the issue date, the letter is a missed-run letter and reads the entries posted 13 to 24 whole months before the issue date; where the agreement has no tax letter yet, the letter reads the entries posted from 1 whole month before the issue date back to the month of the latest deposit payment; in every other case it reads the entries posted 1 to 12 whole months before the issue date."
