name: env_0034_senior_living_operator
company: Larkspur Senior Living

background: |
  Larkspur Senior Living is a privately held senior living operator running eight communities in eight states, from Larkspur at Willow Creek in Plano, Texas to Larkspur at Juniper Point in Littleton, Colorado.
  Three of the campuses - Larkspur at Willow Creek, Larkspur at Harbor View in Sarasota and Larkspur at Brookfield in Cary - are Life Plan communities sold on entrance fee contracts, while the other five rent apartments month to month.
  The Resident and Family Services desk is the central phone and email line that residents, prospective residents and their families use for billing, contract and service questions, and it speaks in a warm, unhurried and precise voice.
  Every relationship is a contract a person holds: an Independent Living Residency Agreement for an apartment type from the Independent Living Studio through the Independent Living One-Bedroom, Independent Living One-Bedroom Deluxe, Independent Living Two-Bedroom and Independent Living Two-Bedroom Deluxe to the Independent Living Cottage Home, billed as a monthly service fee with deposits, community fees and amenity charges on a resident ledger.
  Assisted Living Residency and Care Agreements pair an apartment rent with a care level, Assisted Living Care Level 1 through Assisted Living Care Level 6, that a Larkspur nurse sets by care-point assessments and that moves up or down as the resident's needs change.
  Memory Care Residency Agreements bill an all-inclusive monthly rate for a suite type and care program, from the Memory Care Companion Suite with Essential Care to the Memory Care Deluxe Suite with Advanced Care, in secured neighborhoods.
  Respite and Short-Term Stay Agreements book furnished apartments by the night - the Independent Living Trial Stay, the Assisted Living Respite Stay (Standard Care), (Enhanced Care) and (Extensive Care), the Memory Care Respite Stay and the Post-Hospital Recovery Stay - and many guests later become permanent residents.
  Entrance Fee Agreements at the Life Plan campuses come in six refund plans: the LifeChoice Declining Balance Plan, LifeChoice 50% Refundable Plan, LifeChoice 75% Refundable Plan and LifeChoice 90% Refundable Plan on a fee-for-service basis, and the LifeCare Declining Balance Plan and LifeCare 90% Refundable Plan with lifecare benefits; each is recorded on a refundable-balance ledger of payments, amortization, deductions and refunds.
  Residents add a Personal Services Plan - the Personal Services Pay-As-You-Go Plan or the Essentials, Companion, Comfort, Premier or Concierge Package - that grants monthly service hours for extra housekeeping, laundry, companion visits, escorts and errands and bills a la carte transportation and handyman work.
  Independent living residents also hold a Dining Plan, from the Dining 10 Meal Plan through the Dining 15, 30, 45 and 60 Meal Plans to the Dining Full Board Plan, whose meal credits are granted monthly and redeemed in the restaurant and bistro.
  Every contract keeps its own ledger, so a single household's history spreads across monthly charges, prorations, care add-ons, nurse assessments, absences, payments, returned payments, credits and refunds.
  Most callers are adult children and spouses calling for a parent, many of them holding a power of attorney or serving as the authorized contact on file, alongside residents who manage their own accounts.
  A typical household holds an independent living residency with a dining plan and sometimes a services package, or an assisted living residency after a move from independent living, and Life Plan households add an entrance fee agreement.
  Families arrive with long event histories: a hospital stay and the reassessment that followed, a respite stay before a permanent move, a rate increase notice, a returned payment, or the death of a parent and the move-out and entrance fee refund that come after it.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: independent_living_billing_and_move_out
    claim:
      categories: [independent]
      event_types: [independent_monthly_fee_charge, independent_late_fee_charge, independent_service_fee_charge, independent_credit, independent_payment, independent_payment_return, independent_rate_notice, independent_rate_adjust, independent_occupancy_change, independent_notice_record, independent_notice_withdraw, independent_vacate, independent_end_without_notice, independent_credit_balance_refund, independent_account_close, independent_reservation_cancel, independent_deposit_refund, independent_deposit_forfeit]
    summary: >-
      Residents of the five independent living apartment types, prospective residents holding a reservation, and the adult children or agents who manage their accounts call about the monthly statement and about leaving: a prorated first or last month, a second occupant moving in or dying, an annual increase that seems too early or too large, a late fee after a returned payment, a guest suite or pet charge, a cancelled reservation's deposit, or a move-out, death or transfer to assisted living and the final statement that follows.
      The setting varies along the apartment type (whose notice length, post-death fee days, fee schedule and included allowances differ in independent_move_out_notice, independent_fee_end_and_proration and independent_service_fees), the residency status from reserved through notice_given to vacated, double versus single occupancy, whether the household also holds an Entrance Fee Agreement that changes the monthly fee, and a ledger history of charges, credits, waivers and returns that the rolling-window measures read.
      The governing rules gate writes on the residency status and on records rather than statements - a death or a transfer must be on the customer profile or the care residency, a notice must be signed by the resident or a financial agent, a late fee needs the grace period of independent_late_fee to have passed and only one per billing period, and an increase needs the mailed notice and guarantee period of independent_rate_adjustment - while amounts follow the proration, late fee, deposit refund and final statement formulas of independent_monthly_billing, independent_reservation_cancellation and independent_final_statement; in the domain's natural order a notice precedes the vacate date, fees run to a computed fee end date, and the final statement and refund follow the vacate date.
      The agent locates and verifies the customer, reads the residency and its ledger, and itself posts charges, credits, waivers, payments and the account events the records support, whereas a notice of termination, its withdrawal or a reservation cancellation is the customer's own signature and is registered by the agent and signed by the customer through a user tool.
      Requests no policy decides - transferring the agreement to a surviving second occupant after the holder's death, stopping or delaying a discharge for nonpayment, writing off an unpaid balance, or waiving a fee the records show was correctly charged outside the goodwill allowance - fall outside the charter and go to a human representative as POLICY_NOT_COVERED.

  - name: assisted_living_care_levels
    claim:
      categories: [assisted]
      event_types: [assisted_assessment_record, assisted_level_notice, assisted_level_change, assisted_care_fee_charge, assisted_rent_charge, assisted_addon_charge, assisted_credit, assisted_leave_start, assisted_leave_return, assisted_late_fee_charge, assisted_payment, assisted_notice_record, assisted_end_without_notice, assisted_apartment_change]
    summary: >-
      Families of assisted living residents, and residents themselves, call when the care level on the statement changes or seems wrong: a parent came back from the hospital and the bill went up, a routine reassessment raised the level but the notice arrived late, a level went down and the family expects a refund, an add-on such as insulin or incontinence care is billed although the level includes it, or a long hospital or rehabilitation stay should have reduced the care fee.
      The setting varies across six care levels whose point bands, monthly care fees, included services, add-on prices and reassessment intervals all differ (assisted_level_assignment, assisted_care_addons, assisted_reassessment_schedule), across the residency status from pending_admission through active and on_leave to notice_given, across the assessment history and its types, across absences and their length, and across portfolio facts such as an occupied Entrance Fee Agreement whose plan discounts care fees and rent or a respite stay that converted into the admission.
      Records carry the decision: the level billed must match the band of the latest assessment once its effective date has passed, routine and post-move-in increases wait for the written level notice period of assisted_level_change_effective while change-of-condition and post-hospital increases take effect on the assessment date and decreases on the first of the next month, absence care credits follow the midnights and caps of assisted_absence, and monthly charges follow the proration of assisted_monthly_billing; the natural order of the domain is assessment, then written level notice, then the level change and the split care fee charge and credits.
      The agent reads assessments, notices, the residency and the ledger, records the notices, level changes, charges and credits the rules require, and posts absences and returns, while a notice of termination, an admission withdrawal or a request for an apartment change is the resident's or financial agent's own signature collected through a user tool; a family's request for a change-of-condition reassessment is registered but never sets the score.
      Disputes about the nurse's clinical scoring itself, a request to hold the apartment beyond the leave review point, a request to bill an insurer for a period it refused, or a demand to keep the old level while the new band applies are not decided by any policy and go to a human representative as POLICY_NOT_COVERED.

  - name: respite_and_trial_stays
    claim:
      categories: [respite]
      event_types: [respite_booking_create, respite_nightly_charge, respite_payment, respite_health_documents_record, respite_check_in, respite_cancel, respite_cancellation_fee, respite_credit, respite_extension, respite_level_change, respite_check_out, respite_addon_charge, respite_refund, respite_convert]
    summary: >-
      Caregivers booking relief, hospital discharge planners' families, prospective residents trying a trial stay and guests already in a furnished apartment call to book, change, extend, cancel or settle a short stay, or to ask why the conversion credit for moving in permanently did not appear.
      The setting varies across six stay types whose nightly rates, minimum and maximum nights, booking lead times, free-cancellation periods, fee nights, health document rules, care-point bands and conversion caps differ (respite_booking_terms, respite_cancellation, respite_prepayment_and_check_in, respite_conversion), across the stay status from booked through in_stay to completed, cancelled or converted, across a customer's other stays counted against the annual limit of respite_agg_annual_nights, and across the customer's other Larkspur holdings, since care residents cannot book and an independent living resident's fees continue during a stay.
      Bookings, extensions and level changes post nightly charge segments at the locked rate; check-in waits for the minimum-stay prepayment and current health documents; cancellations reverse the planned charges and carry a fee only after the free-cancellation deadline; early departures credit unused nights above the minimum; and a conversion within the window credits the new residency up to the cap and never more than its community fee - in the domain's natural order a stay is booked and prepaid, checked in, checked out, and then possibly converted.
      The agent books and records stays, charges, credits, extensions, level changes, check-outs, refunds and conversions from the records, while a cancellation or an extension request is the guest's or financial agent's own signed request made through a user tool.
      A guest who needs care beyond every respite band, a request to exceed the annual night limit or the maximum stay, a request to hold an apartment without the prepayment, or a conversion credit for a residency at another operator falls outside the charter and goes to a human representative as POLICY_NOT_COVERED.

  - name: entrance_fee_contracts_and_refunds
    claim:
      categories: [entrance]
      event_types: [entrance_rescind, entrance_cancel_pre_occupancy, entrance_processing_fee_retention, entrance_occupancy_extend, entrance_termination_notice, entrance_termination_notice_withdraw, entrance_terminate, entrance_reoccupancy_record, entrance_estate_documents_record, entrance_account_offset, entrance_refurbishment_deduction, entrance_refund_schedule, entrance_refund_payment, entrance_close, entrance_amortization, entrance_tax_letter]
    summary: >-
      Residents at the three Life Plan campuses, newly signed applicants who have second thoughts, and above all the adult children and executors of residents who have died call about entrance fee money: whether a rescission is still possible, what a cancellation before occupancy costs, how much of the fee is still refundable after some months of occupancy, when a refund waiting for the apartment to be re-occupied will be paid, why unpaid monthly charges or a refurbishment were deducted, and what the annual tax letter states.
      The setting varies across six refund plans whose refundable floors, amortization rates, re-occupancy contingency, discount and tax percentages differ (entrance_occupancy_and_amortization, entrance_refund_timing, entrance_tax_letter_policy), across the campus whose state sets the rescission period in entrance_rescission, across the agreement status from reserved through occupied and terminated to refund_scheduled or closed, across single or double occupancy and a surviving spouse, and across the customer's linked independent living, assisted living or memory care ledgers whose unpaid charges are offset against the refund.
      The rules make the records decisive: rescission is a window counted from the signing date, pre-occupancy cancellation retains the processing fee of entrance_pre_occupancy_cancellation unless a recorded death or certified illness applies, a resident's termination waits out the notice period of entrance_termination, the refundable amount is the balance after the administrative retention and monthly amortization, deductions are offset charge by charge with refurbishment capped under entrance_refund_calculation, and an estate is paid only after letters are on file; in the domain's natural order the agreement terminates, deductions are posted, the refund is scheduled, and the payment and closing follow.
      The agent reads the agreement, its ledger and the linked residency ledgers, and records amortization, deductions, schedules, re-occupancy, estate documents, refunds and tax letters, while a rescission, a pre-occupancy cancellation, a notice of termination or its withdrawal, an occupancy extension and an apartment change are the resident's or financial agent's own signed requests collected through a user tool.
      Requests to accelerate a contingent refund ahead of re-occupancy, to pay a refund to an heir without estate letters, to reverse a termination for cause, to transfer the agreement to a surviving second occupant who was never a party, or to give tax advice are not decided by any policy and go to a human representative as POLICY_NOT_COVERED.

  - name: personal_services_packages
    claim:
      categories: [services]
      event_types: [services_enroll, services_withdraw, services_package_change_request, services_package_change_apply, services_suspend, services_resume, services_cancel_request, services_cancel_withdraw, services_end, services_order_book, services_order_cancel, services_order_complete, services_hours_draw, services_hourly_charge, services_alacarte_charge, services_hours_restore, services_credit, services_hours_rollover, services_hours_expire, services_fee_charge]
    summary: >-
      Independent and assisted living residents and their families call about personal services: which package fits, why hours ran out early, why a cancelled visit still drew an hour, why a Saturday visit drew more hours than it lasted, whether unused hours roll over, how to suspend the package during a long hospital or family stay, how to downgrade or cancel, and why a transportation or handyman bill or a rush fee appeared.
      The setting varies across six tiers whose monthly fee, hours allotment, hourly rate beyond the allotment, rollover, late-cancellation hours, surcharges, rush fee, member discount, available services, commitment and suspension allowance differ (services_monthly_cycle, services_hours_and_billing, services_late_cancellation, services_package_change, services_suspension), across the plan status from pending_start through active, suspended and cancel_pending to ended, across the residence the plan serves - an assisted living resident may hold only the lower three tiers and the plan ends with the residency - and across the order history and the hours ledger with its grants, rollovers, draws, expiries and restores.
      Decisions run on records: delivered minutes are rounded up and surcharged, drawn from available hours and charged beyond them; a late cancellation or no-show draws the tier's hours unless a recorded hospital absence applies; changes, suspensions and cancellations take effect on month boundaries fixed by the cutoff day, the commitment period and the notice rules; and disputes are honored only within the dispute window, once per entry - in the domain's natural order an order is booked, delivered or cancelled, and only then drawn, charged, disputed or restored.
      The agent books and records orders, draws, charges, restores, credits and the monthly cycle from the records, while an enrollment, its withdrawal, a package change, a suspension request, a cancellation and its withdrawal are the resident's or financial agent's own signed requests collected through a user tool.
      Requests to cash out unused hours, to roll hours beyond the tier's allowance, to waive the minimum commitment, to dispute a charge after the window has closed, or to have services delivered to a memory care resident or a respite guest are not covered by any policy and go to a human representative as POLICY_NOT_COVERED.
