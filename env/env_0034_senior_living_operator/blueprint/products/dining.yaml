  - id: dining_special_events
    subject: [dining_charge, dining_meal_redeem]
    rule: >-
      Special event dinners are reserved by seat, and a resident may reserve no more than special_event_seats_per_resident seats for one event.
      A seat costs special_event_dinner_price; where special_event_credits_allowed is true the resident may instead redeem one meal credit and pay the difference between special_event_dinner_price and overage_meal_price as a special_event charge.
      A seat cancelled less than special_event_cancel_hours before the event, or not used, carries special_event_no_show_fee instead of the seat price, and no credit is redeemed for it.
      The private dining room is reserved for a private_dining_room_fee per reservation, with meals in it redeemed or charged as ordinary meals.
      Each special event seat is charged or redeemed once per event reservation reference.
    eligibility:
      - id: one_charge_per_seat
        applies_to: [dining_charge]
        kind: dedup
        condition: Each special event seat is charged or redeemed once per event reservation reference.
        evidence_fields: [dining_ledger.check_reference, dining_ledger.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_ledger.check_reference]
          action_bindings:
            dining_ledger.check_reference: check_reference
        dedup_contract:
          table: dining_ledger
          mode: separate_record
          object_bindings: {check_reference: check_reference}
          duplicate_filters: {charge_code: [special_event, special_event_no_show]}
          distinct_fields: []
    params:
      per_tier:
        Dining 10 Meal Plan: {special_event_credits_allowed: "=special_event_credits_allowed", overage_meal_price: "=overage_meal_price"}
        Dining 15 Meal Plan: {special_event_credits_allowed: "=special_event_credits_allowed", overage_meal_price: "=overage_meal_price"}
        Dining 30 Meal Plan: {special_event_credits_allowed: "=special_event_credits_allowed", overage_meal_price: "=overage_meal_price"}
        Dining 45 Meal Plan: {special_event_credits_allowed: "=special_event_credits_allowed", overage_meal_price: "=overage_meal_price"}
        Dining 60 Meal Plan: {special_event_credits_allowed: "=special_event_credits_allowed", overage_meal_price: "=overage_meal_price"}
        Dining Full Board Plan: {special_event_credits_allowed: "=special_event_credits_allowed", overage_meal_price: "=overage_meal_price"}
