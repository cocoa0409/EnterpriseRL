events:
  - type: dining_enroll
    target: dining_plans
    mutation: create
    meaning: An independent living resident enrolls in a dining plan, opening it in pending_start status.
    grain: One row per plan enrollment.
    fields:
      dining_plan_id: Reference number of the plan.
      customer_id: The resident.
      variant_name: Plan chosen, verbatim tier name.
      independent_residency_id: The independent living residency the plan serves.
      community_name: Larkspur community.
      enrollment_date: Date signed.
      effective_date: First day of the first plan month.
    triggers: []
  - type: dining_activate
    target: dining_plans
    mutation: {transition: {from: pending_start, to: active}}
    meaning: The plan starts on its effective date.
    grain: One row per plan.
    fields:
      dining_plan_id: The plan.
    triggers:
      - event: dining:dining_plan_fee_charge
        map: {dining_plan_id: dining_plan_id}
      - event: dining:dining_credits_grant
        map: {dining_plan_id: dining_plan_id}
  - type: dining_withdraw
    target: dining_plans
    mutation: {transition: {from: pending_start, to: ended}}
    meaning: The enrollment is withdrawn before the start.
    grain: One row per plan.
    fields:
      dining_plan_id: The plan.
      end_date: Date of withdrawal.
      end_reason: enrollment_withdrawn.
    triggers: []
  - type: dining_cancel_request
    target: dining_plans
    mutation: {transition: {from: active, to: cancel_pending}}
    meaning: The resident's signed cancellation is recorded with its end date.
    grain: One row per cancellation.
    fields:
      dining_plan_id: The plan.
      cancel_notice_date: Date signed.
      end_date: Last day of the plan.
    triggers: []
  - type: dining_cancel_withdraw
    target: dining_plans
    mutation: {transition: {from: cancel_pending, to: active}}
    meaning: The cancellation is withdrawn before the end date.
    grain: One row per withdrawal.
    fields:
      dining_plan_id: The plan.
      cancel_notice_date: Cleared to empty.
      end_date: Cleared to empty.
    triggers: []
  - type: dining_end
    target: dining_plans
    mutation: {transition: [{from: cancel_pending, to: ended}, {from: active, to: ended}]}
    meaning: The plan ends.
    grain: One row per plan.
    fields:
      dining_plan_id: The plan.
      end_date: Last day of the plan.
      end_reason: resident_cancelled or residency_ended.
    triggers:
      - event: dining:dining_credits_expire
        map: {dining_plan_id: dining_plan_id, expiry_basis: plan_end}
  - type: dining_plan_change
    target: dining_plans
    mutation: update
    meaning: The plan changes to another meal plan on the first day of a month.
    grain: One row per plan change.
    fields:
      dining_plan_id: The plan.
      variant_name: New plan.
      plan_change_date: First day of the month the new plan applies.
    triggers: []
  - type: dining_away_register
    target: dining_plans
    mutation: update
    meaning: The resident registers a planned absence from the community for a plan fee credit.
    grain: One row per registered absence.
    fields:
      dining_plan_id: The plan.
      away_registered_date: Date the absence was registered.
      away_start_date: First day away.
      away_end_date: Last day away.
    triggers: []
  - type: dining_plan_fee_charge
    target: dining_ledger
    meaning: The monthly plan fee is charged in advance.
    grain: One row per plan per billing period per tier billed.
    distinguish_by: [billing_period, tier_billed]
    fields:
      dining_plan_id: The plan.
      customer_id: The resident.
      amount: Fee, positive, USD.
      posting_date: Date posted.
      billing_period: Month, YYYY-MM.
      tier_billed: Plan whose fee is charged.
    account: dining_balance
    direction: in
    triggers: []
  - type: dining_credits_grant
    target: dining_ledger
    meaning: The month's meal credits are granted.
    grain: One row per plan per billing period.
    distinguish_by: [billing_period]
    fields:
      dining_plan_id: The plan.
      customer_id: The resident.
      credits: Credits granted.
      posting_date: First day of the month.
      billing_period: Month, YYYY-MM.
    account: meal_credits
    direction: in
    triggers: []
  - type: dining_credits_rollover
    target: dining_ledger
    meaning: Unused credits carried into a new month are granted after the old month's credits expire.
    grain: One row per plan per billing period.
    distinguish_by: [billing_period]
    fields:
      dining_plan_id: The plan.
      customer_id: The resident.
      credits: Credits carried in.
      posting_date: First day of the month.
      billing_period: Month carried into, YYYY-MM.
    account: meal_credits
    direction: in
    triggers: []
  - type: dining_credits_restore
    target: dining_ledger
    meaning: Credits redeemed in error are restored after a dispute.
    grain: One row per redemption restored.
    distinguish_by: [source_entry_id]
    fields:
      dining_plan_id: The plan.
      customer_id: The resident.
      credits: Credits restored.
      posting_date: Date posted.
      billing_period: Month restored into, YYYY-MM.
      source_entry_id: The redemption restored.
    account: meal_credits
    direction: in
    triggers: []
  - type: dining_meal_redeem
    target: dining_ledger
    meaning: Meal credits are redeemed for a meal in the restaurant or bistro.
    grain: One row per point-of-sale check.
    distinguish_by: [check_reference]
    fields:
      dining_plan_id: The plan.
      customer_id: The resident.
      credits: Credits redeemed.
      posting_date: Date of the meal.
      billing_period: Month of the meal, YYYY-MM.
      check_reference: Point-of-sale check number.
      meal_period: breakfast, lunch, dinner, brunch or bistro.
      diner_type: resident, guest or caregiver.
    account: meal_credits
    direction: out
    triggers: []
  - type: dining_credits_expire
    target: dining_ledger
    meaning: Credits remaining at month end, or when the plan ends, lapse.
    grain: One row per plan per billing period per expiry basis.
    distinguish_by: [billing_period, expiry_basis]
    fields:
      dining_plan_id: The plan.
      customer_id: The resident.
      credits: Credits lapsing.
      posting_date: Date posted.
      billing_period: Month whose credits lapse, YYYY-MM.
      expiry_basis: month_end or plan_end.
    account: meal_credits
    direction: out
    triggers: []
  - type: dining_charge
    target: dining_ledger
    meaning: A dining charge is posted - an overage or guest meal, a surcharge, a tray, a special event seat or no-show, a caregiver meal, a supplement, a takeout container, the private dining room, a late fee or a returned payment fee.
    grain: One row per point-of-sale check per charge code.
    distinguish_by: [check_reference, charge_code]
    fields:
      dining_plan_id: The plan.
      customer_id: The resident.
      amount: Charge, positive, USD.
      posting_date: Date posted.
      billing_period: Month, YYYY-MM.
      check_reference: Point-of-sale check, event reservation or statement reference the charge belongs to.
      charge_code: overage_meal, guest_meal, caregiver_meal, brunch_surcharge, holiday_surcharge, tray_delivery, special_event, special_event_no_show, bistro_excess, takeout_container, dietary_supplement, private_dining_room, late_fee or returned_payment.
      quantity: Units charged.
    account: dining_balance
    direction: in
    triggers: []
  - type: dining_payment
    target: dining_ledger
    meaning: A payment on the dining account is received.
    grain: One row per payment instrument.
    distinguish_by: [payment_reference]
    fields:
      dining_plan_id: The plan.
      customer_id: The resident.
      amount: Payment, positive, USD.
      posting_date: Date received.
      payment_reference: Instrument reference.
      payment_method: Instrument type.
    account: dining_balance
    direction: out
    triggers: []
  - type: dining_payment_return
    target: dining_ledger
    meaning: A posted payment is returned unpaid and reinstated.
    grain: One row per returned payment entry.
    distinguish_by: [source_entry_id]
    fields:
      dining_plan_id: The plan.
      customer_id: The resident.
      amount: Returned amount, positive, USD.
      posting_date: Date posted.
      source_entry_id: The payment entry returned.
    account: dining_balance
    direction: in
    triggers:
      - event: dining:dining_charge
        map: {dining_plan_id: dining_plan_id, charge_code: returned_payment}
  - type: dining_credit
    target: dining_ledger
    meaning: A credit reduces the dining balance - an away credit, a disputed charge, a billing error or residency-end proration.
    grain: One row per credit reason per source entry.
    distinguish_by: [credit_reason, source_entry_id]
    fields:
      dining_plan_id: The plan.
      customer_id: The resident.
      amount: Credit, positive, USD.
      posting_date: Date posted.
      billing_period: Month, YYYY-MM.
      credit_reason: away_credit, charge_dispute, billing_error or residency_end_proration.
      source_entry_id: The plan fee or charge entry credited.
    account: dining_balance
    direction: out
    triggers: []

measures:
  - id: dining_msr_credits_available
    window: As of the moment of redemption.
    measure: Sum of grant, rollover and restore credits less redeemed and expired credits on the plan (equal to meal_credits_available).
  - id: dining_msr_guest_meals_in_month
    window: The calendar month of the meal.
    measure: Count of guest meals on the plan in the month, redeemed with credits or complimentary.
  - id: dining_msr_unused_credits_at_month_end
    window: The billing period ending, at the end of its last day.
    measure: Credits available on the plan before any month-end expiry.
  - id: dining_msr_plan_changes_12m
    window: Rolling 12 calendar months ending on the requested change date.
    measure: Count of plan changes on the plan, including the one requested.
  - id: dining_msr_away_days
    window: One registered absence.
    measure: Days from away_start_date to away_end_date, both inclusive.

policies:
  - id: dining_agg_multi_holding
    subject: [dining_enroll]
    rule: >-
      A customer holds at most one dining plan at a time, and where household_sharing is true both occupants of a double-occupancy apartment redeem from that plan.
      A new plan may be opened only when the customer has no other plan in pending_start, active or cancel_pending status.
    eligibility:
      - id: no_open_plan
        applies_to: [dining_enroll]
        kind: dedup
        condition: A new plan may be opened only when the customer has no other plan in pending_start, active or cancel_pending status.
        evidence_fields: [dining_plans.customer_id, dining_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_plans.customer_id]
          action_bindings:
            dining_plans.customer_id: customer_id
        dedup_contract:
          table: dining_plans
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_start, active, cancel_pending]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: dining_enrollment_and_minimum
    subject: [dining_enroll, dining_withdraw, dining_activate]
    rule: >-
      Dining plans serve independent living residents only; where care_residents_eligible is false, assisted living and memory care residents, whose meals are included in their own agreements, cannot enroll.
      The customer must hold an independent living residency in reserved, active or notice_given status.
      Holding an independent living apartment other than an Independent Living Cottage Home requires a dining plan of rank at least minimum_plan_rank_for_il_rental from the move-in date, so the Dining 10 Meal Plan is available only to cottage residents where cottage_exempt_from_minimum is true.
      A plan starts on enrollment_effective_day of a month; an enrollment may be withdrawn before it starts without charge.
    eligibility:
      - id: independent_resident
        applies_to: [dining_enroll]
        kind: state
        condition: The customer must hold an independent living residency in reserved, active or notice_given status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [reserved, active, notice_given]
    params:
      per_tier:
        Dining 10 Meal Plan: {minimum_plan_rank_for_il_rental: "=minimum_plan_rank_for_il_rental", cottage_exempt_from_minimum: "=cottage_exempt_from_minimum", care_residents_eligible: "=care_residents_eligible"}
        Dining 15 Meal Plan: {minimum_plan_rank_for_il_rental: "=minimum_plan_rank_for_il_rental", cottage_exempt_from_minimum: "=cottage_exempt_from_minimum", care_residents_eligible: "=care_residents_eligible"}
        Dining 30 Meal Plan: {minimum_plan_rank_for_il_rental: "=minimum_plan_rank_for_il_rental", cottage_exempt_from_minimum: "=cottage_exempt_from_minimum", care_residents_eligible: "=care_residents_eligible"}
        Dining 45 Meal Plan: {minimum_plan_rank_for_il_rental: "=minimum_plan_rank_for_il_rental", cottage_exempt_from_minimum: "=cottage_exempt_from_minimum", care_residents_eligible: "=care_residents_eligible"}
        Dining 60 Meal Plan: {minimum_plan_rank_for_il_rental: "=minimum_plan_rank_for_il_rental", cottage_exempt_from_minimum: "=cottage_exempt_from_minimum", care_residents_eligible: "=care_residents_eligible"}
        Dining Full Board Plan: {minimum_plan_rank_for_il_rental: "=minimum_plan_rank_for_il_rental", cottage_exempt_from_minimum: "=cottage_exempt_from_minimum", care_residents_eligible: "=care_residents_eligible"}

  - id: dining_monthly_cycle
    subject: [dining_plan_fee_charge, dining_credits_grant, dining_credits_rollover, dining_credits_expire]
    rule: >-
      On the first day of each active month plan_monthly_fee is charged in advance and meals_per_month credits are granted.
      At month end the unused credits, dining_msr_unused_credits_at_month_end, expire as one month_end expiry, and rollover_pct percent of them rounded down to whole credits, but not more than rollover_cap_meals, is granted back as rollover credits on the first of the next month; rollover credits never roll a second time.
      When the plan ends the remaining credits expire as one plan_end expiry, and unused credits are never refunded in money where refund_unused_credits is false.
      Plan fees and credit grants may be posted only while the plan is in active or cancel_pending status.
    eligibility:
      - id: cycle_on_live_plan
        applies_to: [dining_plan_fee_charge, dining_credits_grant, dining_credits_rollover]
        kind: state
        condition: Plan fees and credit grants may be posted only while the plan is in active or cancel_pending status.
        evidence_fields: [dining_plans.status, dining_plans.dining_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_plans.dining_plan_id]
          action_bindings:
            dining_plans.dining_plan_id: dining_plan_id
        state_contract:
          field: dining_plans.status
          allowed: [active, cancel_pending]
    measures: [dining_msr_unused_credits_at_month_end]
    params:
      per_tier:
        Dining 10 Meal Plan: {plan_monthly_fee: "=plan_monthly_fee", meals_per_month: "=meals_per_month", rollover_pct: "=rollover_pct", rollover_cap_meals: "=rollover_cap_meals"}
        Dining 15 Meal Plan: {plan_monthly_fee: "=plan_monthly_fee", meals_per_month: "=meals_per_month", rollover_pct: "=rollover_pct", rollover_cap_meals: "=rollover_cap_meals"}
        Dining 30 Meal Plan: {plan_monthly_fee: "=plan_monthly_fee", meals_per_month: "=meals_per_month", rollover_pct: "=rollover_pct", rollover_cap_meals: "=rollover_cap_meals"}
        Dining 45 Meal Plan: {plan_monthly_fee: "=plan_monthly_fee", meals_per_month: "=meals_per_month", rollover_pct: "=rollover_pct", rollover_cap_meals: "=rollover_cap_meals"}
        Dining 60 Meal Plan: {plan_monthly_fee: "=plan_monthly_fee", meals_per_month: "=meals_per_month", rollover_pct: "=rollover_pct", rollover_cap_meals: "=rollover_cap_meals"}
        Dining Full Board Plan: {plan_monthly_fee: "=plan_monthly_fee", meals_per_month: "=meals_per_month", rollover_pct: "=rollover_pct", rollover_cap_meals: "=rollover_cap_meals"}
    formula:
      rollover_credits: min(dining_msr_unused_credits_at_month_end * rollover_pct / 100, rollover_cap_meals)

  - id: dining_redemption_and_charges
    subject: [dining_meal_redeem, dining_charge]
    rule: >-
      A meal redeems credits by meal_credit_equivalents of its meal period, a bistro purchase redeems one credit per bistro_credit_value with any excess charged as bistro_excess, and no person redeems more than max_meals_per_day_per_person meals a day.
      When dining_msr_credits_available is below the credits a resident meal needs, the meal is charged at overage_meal_price of the plan instead.
      Guest meals are charged at guest_meal_price, except the first complimentary_guest_meals_per_month guest meals of the month, and, where guest_meals_from_credits_allowed is true, up to max_guest_meals_from_credits_per_month guest meals a month may be redeemed with credits, both counted by dining_msr_guest_meals_in_month.
      A private caregiver's meal is charged at caregiver_meal_price unless caregiver_meals_from_credits is true.
      Sunday brunch carries brunch_surcharge and a meal on a holiday_calendar date carries holiday_meal_surcharge, whether redeemed with credits or paid, the holiday surcharge replacing the brunch surcharge when both apply.
      Trays carry tray_delivery_fee, except during the first tray_fee_waived_illness_days days of an illness for which the wellness nurse orders tray service; takeout containers, supplements and the private dining room carry takeout_container_fee, dietary_supplement_price and private_dining_room_fee.
      Redemptions and charges may be posted while the plan is in active or cancel_pending status, and late fees and returned payment fees also after it has ended.
    eligibility:
      - id: redeem_on_live_plan
        applies_to: [dining_meal_redeem]
        kind: state
        condition: Redemptions and charges may be posted while the plan is in active or cancel_pending status, and late fees and returned payment fees also after it has ended.
        evidence_fields: [dining_plans.status, dining_plans.dining_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_plans.dining_plan_id]
          action_bindings:
            dining_plans.dining_plan_id: dining_plan_id
        state_contract:
          field: dining_plans.status
          allowed: [active, cancel_pending]
    measures: [dining_msr_credits_available, dining_msr_guest_meals_in_month]
    params:
      per_tier:
        Dining 10 Meal Plan: {overage_meal_price: "=overage_meal_price", guest_meals_from_credits_allowed: "=guest_meals_from_credits_allowed", max_guest_meals_from_credits_per_month: "=max_guest_meals_from_credits_per_month", complimentary_guest_meals_per_month: "=complimentary_guest_meals_per_month", caregiver_meals_from_credits: "=caregiver_meals_from_credits", special_event_credits_allowed: "=special_event_credits_allowed"}
        Dining 15 Meal Plan: {overage_meal_price: "=overage_meal_price", guest_meals_from_credits_allowed: "=guest_meals_from_credits_allowed", max_guest_meals_from_credits_per_month: "=max_guest_meals_from_credits_per_month", complimentary_guest_meals_per_month: "=complimentary_guest_meals_per_month", caregiver_meals_from_credits: "=caregiver_meals_from_credits", special_event_credits_allowed: "=special_event_credits_allowed"}
        Dining 30 Meal Plan: {overage_meal_price: "=overage_meal_price", guest_meals_from_credits_allowed: "=guest_meals_from_credits_allowed", max_guest_meals_from_credits_per_month: "=max_guest_meals_from_credits_per_month", complimentary_guest_meals_per_month: "=complimentary_guest_meals_per_month", caregiver_meals_from_credits: "=caregiver_meals_from_credits", special_event_credits_allowed: "=special_event_credits_allowed"}
        Dining 45 Meal Plan: {overage_meal_price: "=overage_meal_price", guest_meals_from_credits_allowed: "=guest_meals_from_credits_allowed", max_guest_meals_from_credits_per_month: "=max_guest_meals_from_credits_per_month", complimentary_guest_meals_per_month: "=complimentary_guest_meals_per_month", caregiver_meals_from_credits: "=caregiver_meals_from_credits", special_event_credits_allowed: "=special_event_credits_allowed"}
        Dining 60 Meal Plan: {overage_meal_price: "=overage_meal_price", guest_meals_from_credits_allowed: "=guest_meals_from_credits_allowed", max_guest_meals_from_credits_per_month: "=max_guest_meals_from_credits_per_month", complimentary_guest_meals_per_month: "=complimentary_guest_meals_per_month", caregiver_meals_from_credits: "=caregiver_meals_from_credits", special_event_credits_allowed: "=special_event_credits_allowed"}
        Dining Full Board Plan: {overage_meal_price: "=overage_meal_price", guest_meals_from_credits_allowed: "=guest_meals_from_credits_allowed", max_guest_meals_from_credits_per_month: "=max_guest_meals_from_credits_per_month", complimentary_guest_meals_per_month: "=complimentary_guest_meals_per_month", caregiver_meals_from_credits: "=caregiver_meals_from_credits", special_event_credits_allowed: "=special_event_credits_allowed"}

  - id: dining_plan_change_and_cancellation
    subject: [dining_plan_change, dining_cancel_request, dining_cancel_withdraw, dining_end, dining_credit]
    rule: >-
      A plan change takes effect on the first day of the next month when requested on or before change_cutoff_day, and the month after next when requested later; dining_msr_plan_changes_12m may not exceed max_plan_changes_per_12m, and a change may not go below the minimum plan an independent living resident must hold.
      A cancellation signed on or before cancel_cutoff_day ends the plan on the last day of that month, and a later one on the last day of the following month; a plan may not be cancelled or lowered before minimum_commitment_months have run from its effective date, and a cancellation may be withdrawn before its end date.
      A resident who must hold the minimum plan may not cancel while their independent living residency continues; the cancellation must instead be a change to an allowed plan.
      When the independent living residency ends the plan ends on the residency's fee end date, and where proration_on_residency_end is true the plan fee for the later days of the month is credited as residency_end_proration, the daily fee being the monthly fee divided by the days in the month, rounded to the cent half up.
      Plan fee increases take effect only after price_change_notice_days of written notice.
      Plan changes and cancellations may be requested only while the plan is in active status.
    eligibility:
      - id: change_while_active
        applies_to: [dining_plan_change, dining_cancel_request]
        kind: state
        condition: Plan changes and cancellations may be requested only while the plan is in active status.
        evidence_fields: [dining_plans.status, dining_plans.dining_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_plans.dining_plan_id]
          action_bindings:
            dining_plans.dining_plan_id: dining_plan_id
        state_contract:
          field: dining_plans.status
          allowed: [active]
    measures: [dining_msr_plan_changes_12m]
    params:
      per_tier:
        Dining 10 Meal Plan: {change_cutoff_day: "=change_cutoff_day", cancel_cutoff_day: "=cancel_cutoff_day", max_plan_changes_per_12m: "=max_plan_changes_per_12m", minimum_commitment_months: "=minimum_commitment_months"}
        Dining 15 Meal Plan: {change_cutoff_day: "=change_cutoff_day", cancel_cutoff_day: "=cancel_cutoff_day", max_plan_changes_per_12m: "=max_plan_changes_per_12m", minimum_commitment_months: "=minimum_commitment_months"}
        Dining 30 Meal Plan: {change_cutoff_day: "=change_cutoff_day", cancel_cutoff_day: "=cancel_cutoff_day", max_plan_changes_per_12m: "=max_plan_changes_per_12m", minimum_commitment_months: "=minimum_commitment_months"}
        Dining 45 Meal Plan: {change_cutoff_day: "=change_cutoff_day", cancel_cutoff_day: "=cancel_cutoff_day", max_plan_changes_per_12m: "=max_plan_changes_per_12m", minimum_commitment_months: "=minimum_commitment_months"}
        Dining 60 Meal Plan: {change_cutoff_day: "=change_cutoff_day", cancel_cutoff_day: "=cancel_cutoff_day", max_plan_changes_per_12m: "=max_plan_changes_per_12m", minimum_commitment_months: "=minimum_commitment_months"}
        Dining Full Board Plan: {change_cutoff_day: "=change_cutoff_day", cancel_cutoff_day: "=cancel_cutoff_day", max_plan_changes_per_12m: "=max_plan_changes_per_12m", minimum_commitment_months: "=minimum_commitment_months"}

  - id: dining_away_credit
    subject: [dining_away_register, dining_credit]
    rule: >-
      A resident who will be away from the community for at least away_credit_min_days consecutive days may register the absence and receive a plan fee credit.
      The absence must be registered no later than away_notice_days before the first day away.
      The notice is counted in calendar days back from the first day away, so the last day to register is that day minus away_notice_days calendar days, inclusive.
      After the absence the credit is away_credit_pct percent of the daily plan fee - the monthly fee divided by the days in that month - for each day of dining_msr_away_days up to away_credit_max_days, one away_credit per absence referencing the month's plan fee charge, rounded to the cent half up; meal credits of the month are not reduced and still expire under the monthly cycle.
      An absence not registered in time earns no credit, and each registered absence earns one away credit.
    eligibility:
      - id: away_registered_in_time
        applies_to: [dining_away_register]
        kind: time
        condition: The absence must be registered no later than away_notice_days before the first day away.
        evidence_fields: [dining_plans.away_start_date, dining_plans.dining_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_plans.dining_plan_id]
          action_bindings:
            dining_plans.dining_plan_id: dining_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the first day away
          anchor_source: dining_plans.away_start_date
          relation: not_after
          duration_source: variants.away_notice_days
          unit: calendar_days
          counting_rule: The notice is counted in calendar days back from the first day away, so the last day to register is that day minus away_notice_days calendar days, inclusive.
          boundary: inclusive
    measures: [dining_msr_away_days]
    params:
      per_tier:
        Dining 10 Meal Plan: {away_credit_min_days: "=away_credit_min_days", away_credit_max_days: "=away_credit_max_days", away_credit_pct: "=away_credit_pct", away_notice_days: "=away_notice_days"}
        Dining 15 Meal Plan: {away_credit_min_days: "=away_credit_min_days", away_credit_max_days: "=away_credit_max_days", away_credit_pct: "=away_credit_pct", away_notice_days: "=away_notice_days"}
        Dining 30 Meal Plan: {away_credit_min_days: "=away_credit_min_days", away_credit_max_days: "=away_credit_max_days", away_credit_pct: "=away_credit_pct", away_notice_days: "=away_notice_days"}
        Dining 45 Meal Plan: {away_credit_min_days: "=away_credit_min_days", away_credit_max_days: "=away_credit_max_days", away_credit_pct: "=away_credit_pct", away_notice_days: "=away_notice_days"}
        Dining 60 Meal Plan: {away_credit_min_days: "=away_credit_min_days", away_credit_max_days: "=away_credit_max_days", away_credit_pct: "=away_credit_pct", away_notice_days: "=away_notice_days"}
        Dining Full Board Plan: {away_credit_min_days: "=away_credit_min_days", away_credit_max_days: "=away_credit_max_days", away_credit_pct: "=away_credit_pct", away_notice_days: "=away_notice_days"}

  - id: dining_payments_disputes
    subject: [dining_payment, dining_payment_return, dining_credit, dining_credits_restore, dining_charge]
    rule: >-
      The dining statement for a month falls due on fee_due_day of the next month; payments are posted once per instrument and applied oldest charge first.
      A late fee of late_fee_flat is charged once per statement month when the statement's past-due amount is at least late_fee_min_past_due after payment_grace_days calendar days from the due date, and a returned payment is reinstated and carries returned_payment_fee.
      A resident may dispute a charge or a redemption only within dispute_window_days after it was posted.
      The dispute window is counted in calendar days from the posting date, the posting date being day 0, and a dispute raised on the last day is in time.
      An upheld dispute of a redemption restores the credits referencing it, and an upheld dispute of a charge is credited as charge_dispute or billing_error referencing it; each entry is credited at most once for each credit reason and restored at most once.
    eligibility:
      - id: within_dispute_window
        applies_to: [dining_credits_restore]
        kind: time
        condition: A resident may dispute a charge or a redemption only within dispute_window_days after it was posted.
        evidence_fields: [dining_ledger.posting_date, dining_ledger.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dining_ledger.source_entry_id]
          action_bindings:
            dining_ledger.source_entry_id: source_entry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: it was posted
          anchor_source: dining_ledger.posting_date
          relation: not_after
          duration_source: variants.dispute_window_days
          unit: calendar_days
          counting_rule: The dispute window is counted in calendar days from the posting date, the posting date being day 0, and a dispute raised on the last day is in time.
          boundary: inclusive
      - id: one_correction_per_entry
        applies_to: [dining_credit, dining_credits_restore]
        kind: dedup
