# Product charter — Dining Plan for independent living residents.
# Larkspur Senior Living. Monthly meal-credit plans redeemed in the community restaurant and bistro;
# assisted living and memory care include meals in their own agreements. Single registry of every number.

category: dining
display_name: Dining Plan

binding:
  holding_table: dining_plans
  event_tables: [dining_ledger]
  intake_tables: [dining_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {meal_credits_available: meal_credits, account_balance: dining_balance}

lifecycle:
  states: [pending_start, active, cancel_pending, ended]
  transitions:
    - from: pending_start
      to: active
      by: system
      means: "The plan starts on its effective date, the first day of a month."
    - from: pending_start
      to: ended
      by: user
      means: "The resident withdraws the enrollment before it starts."
    - from: active
      to: cancel_pending
      by: user
      means: "The resident signs a cancellation, effective at month end under the notice rules."
    - from: cancel_pending
      to: active
      by: user
      means: "The resident withdraws the cancellation before the end date."
    - from: cancel_pending
      to: ended
      by: system
      means: "The plan ends on the cancellation end date."
    - from: active
      to: ended
      by: agent
      means: "The plan ends because the independent living residency ended."

accounts:
  - key: meal_credits
    unit: meal credits
    meaning: Meal credits available on the plan; the monthly grant, rollover and restored credits book in, and meals redeemed and credits expiring book out.
  - key: dining_balance
    unit: USD
    meaning: Amount owed on the dining account; plan fees and dining charges book in, payments and credits book out.

parameter_schema:
  plan_monthly_fee: Monthly fee of the plan, billed in advance, USD per calendar month.
  meals_per_month: Meal credits granted on the first day of each active month, credits.
  meal_credit_equivalents: Per-meal-period mapping of meal credits redeemed per meal (breakfast, lunch, dinner, brunch), credits.
  max_meals_per_day_per_person: Maximum meals redeemed per person per day, integer.
  overage_meal_price: Price of a resident meal when no credits remain, USD per meal.
  rollover_pct: Percentage of unused credits at month end carried into the next month, rounded down to whole credits, percent.
  rollover_cap_meals: Maximum credits carried into the next month, credits.
  refund_unused_credits: Whether unused credits are refunded in money, boolean.
  guest_meal_price: Price of a guest meal paid in money, USD per meal.
  guest_meals_from_credits_allowed: Whether a resident may redeem credits for guest meals, boolean.
  max_guest_meals_from_credits_per_month: Maximum guest meals per month redeemable with credits, integer.
  complimentary_guest_meals_per_month: Guest meals per month provided without charge or credit, integer.
  caregiver_meal_price: Price of a meal for a private caregiver accompanying the resident, USD per meal.
  caregiver_meals_from_credits: Whether caregiver meals may be redeemed with credits, boolean.
  tray_delivery_fee: Fee per meal tray delivered to the apartment, USD per tray.
  tray_fee_waived_illness_days: Days of tray delivery per illness without the fee when the wellness nurse orders it, integer days.
  brunch_surcharge: Surcharge on Sunday brunch in addition to the credit or price, USD per meal.
  holiday_meal_surcharge: Surcharge on a holiday meal in addition to the credit or price, USD per meal.
  holiday_calendar: List of dining holidays on which the holiday surcharge applies.
  special_event_dinner_price: Price of a special event dinner seat, USD per seat.
  special_event_credits_allowed: Whether a special event seat may be redeemed with one meal credit plus the difference, boolean.
  special_event_seats_per_resident: Maximum seats per resident per special event, integer.
  special_event_cancel_hours: Hours before a special event below which a cancelled seat is charged the no-show fee, hours.
  special_event_no_show_fee: Fee for a special event seat cancelled late or not used, USD per seat.
  bistro_credit_value: Bistro purchase value one meal credit covers; any excess is charged, USD per credit.
  takeout_container_fee: Fee per takeout container, USD.
  dietary_supplement_price: Price of a nutritional supplement drink, USD per item.
  private_dining_room_fee: Fee for reserving the private dining room, USD per reservation.
  minimum_plan_rank_for_il_rental: Lowest plan rank an independent living resident of a non-cottage apartment must hold, integer rank.
  cottage_exempt_from_minimum: Whether Independent Living Cottage Home residents are exempt from the minimum plan, boolean.
  care_residents_eligible: Whether assisted living or memory care residents may hold a dining plan, boolean.
  household_sharing: Whether both occupants of a double-occupancy apartment redeem from one plan, boolean.
  enrollment_effective_day: Day of the month on which plans and plan changes take effect, integer.
  change_cutoff_day: Day of the month by which a plan change must be requested to take effect next month, integer.
  cancel_cutoff_day: Day of the month by which a cancellation must be signed to end the plan at that month's end, integer.
  max_plan_changes_per_12m: Maximum plan changes in any rolling 12 months, integer.
  minimum_commitment_months: Minimum months a plan must run before it can be cancelled or lowered, integer months.
  away_credit_min_days: Minimum consecutive days away, registered in advance, that earn a plan fee credit, integer days.
  away_credit_max_days: Maximum days credited per registered absence, integer days.
  away_credit_pct: Percentage of the daily plan fee credited per day away, percent.
  away_notice_days: Calendar days before departure by which an absence must be registered, integer days.
  proration_on_residency_end: Whether the plan fee is prorated when the residency ends mid-month, boolean.
  price_change_notice_days: Calendar days of written notice before a plan fee increase, integer days.
  fee_due_day: Day of the month on which the dining statement falls due, integer.
  payment_grace_days: Calendar days after the due date before a late fee may be assessed, integer days.
  late_fee_flat: Late fee on a past-due dining statement, USD.
  late_fee_min_past_due: Past-due amount below which no late fee is assessed, USD.
  returned_payment_fee: Fee for a returned payment, USD.
  dispute_window_days: Calendar days after posting within which a dining charge or redemption may be disputed, integer days.

