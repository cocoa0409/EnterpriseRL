# Product charter — Entrance Fee Agreement (Life Plan Community continuing care contract).
# Larkspur Senior Living. Sold only at the three Larkspur Life Plan campuses; tiers are the refund plans
# (fee-for-service LifeChoice plans and LifeCare lifecare plans). Single registry of every number of this category.

category: entrance
display_name: Entrance Fee Agreement

binding:
  holding_table: entrance_agreements
  event_tables: [entrance_ledger]
  intake_tables: [entrance_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {refundable_balance: refundable_balance}

lifecycle:
  states: [reserved, occupied, terminated, refund_scheduled, closed, rescinded, cancelled]
  transitions:
    - from: reserved
      to: occupied
      by: system
      means: "The resident takes occupancy of the independent living apartment named in the agreement on the occupancy date."
    - from: reserved
      to: rescinded
      by: user
      means: "The resident signs a rescission notice within the statutory rescission period after signing."
    - from: reserved
      to: cancelled
      by: user
      means: "The resident signs a cancellation before occupancy after the rescission period has ended."
    - from: reserved
      to: cancelled
      by: agent
      means: "The agreement is cancelled before occupancy because the resident died or a physician certified that illness or injury prevents occupancy."
    - from: occupied
      to: terminated
      by: agent
      means: "The agreement terminates on its termination date - the end of the resident's notice period, the death of the last resident, or a termination for cause after notice."
    - from: terminated
      to: refund_scheduled
      by: agent
      means: "The refund is calculated, the refund statement issued and the refund due date fixed."
    - from: refund_scheduled
      to: closed
      by: agent
      means: "The scheduled refund has been paid and the agreement is closed."
    - from: terminated
      to: closed
      by: agent
      means: "Nothing remains refundable after deductions and the agreement is closed without a refund."

accounts:
  - key: refundable_balance
    unit: USD
    meaning: Portion of the entrance fee received that would be refundable under the agreement right now; entrance fee payments book in, and the non-refundable administrative retention, monthly amortization, processing fees, deductions and refund payments book out.

parameter_schema:
  contract_type: Contract type of the plan - fee_for_service (future care at market rates with a discount) or lifecare (future care fees largely covered) - enumeration.
  entrance_fee_factor: Multiplier applied to the base entrance fee of the apartment type to price this refund plan, decimal.
  base_entrance_fee_schedule: Per-apartment-type mapping of the base entrance fee (declining-balance fee-for-service price) for single occupancy, USD.
  entrance_fee_rounding_usd: Increment to which the priced entrance fee is rounded, half up, USD.
  second_person_entrance_fee: Additional entrance fee for a second resident under the same agreement, USD.
  second_person_min_age: Minimum age of a second resident on the occupancy date, integer years.
  refundable_floor_pct: Percentage of the entrance fee that never amortizes and remains refundable, percent.
  admin_fee_pct: Percentage of the entrance fee that becomes non-refundable on the occupancy date, percent.
  amortization_pct_per_month: Percentage of the entrance fee that becomes non-refundable for each month of occupancy until the refundable floor is reached, percent per month.
  deposit_pct: Percentage of the entrance fee paid as the deposit when the agreement is signed, percent.
  escrow_release_on_occupancy: Whether the deposit is held in escrow until occupancy or rescission, boolean.
  balance_due_days_before_occupancy: Calendar days before the occupancy date by which the entrance fee balance must be received, integer days.
  occupancy_deadline_days: Calendar days after signing within which occupancy must take place, integer days.
  occupancy_extension_days: Calendar days added by one occupancy extension, integer days.
  occupancy_extension_max: Maximum number of occupancy extensions per agreement, integer count.
  eligible_communities: List of the Larkspur Life Plan campuses where entrance fee agreements are offered.
  rescission_days_by_community: Per-community mapping of the rescission period after signing, set at least as long as the state's continuing care statute requires, integer calendar days.
  rescission_refund_pct: Percentage of all money paid that is refunded on rescission, percent.
  rescission_refund_days: Calendar days after rescission by which the rescission refund is paid, integer days.
  pre_occupancy_cancellation_fee_pct: Processing fee on a cancellation before occupancy after the rescission period, percent of the entrance fee.
  pre_occupancy_health_refund_pct: Percentage of money paid refunded when death, illness or injury prevents occupancy, percent.
  pre_occupancy_refund_days: Calendar days after a pre-occupancy cancellation by which its refund is paid, integer days.
  min_resident_age: Minimum age of the first resident on the occupancy date, integer years.
  net_worth_multiple: Minimum net worth as a multiple of the entrance fee for financial qualification, decimal.
  monthly_income_multiple: Minimum monthly income as a multiple of the monthly service fee for financial qualification, decimal.
  financial_application_validity_days: Maximum calendar days between the approved financial application and signing, integer days.
  health_screening_required: Whether a pre-admission health screening showing the applicant can live independently is required, boolean.
  health_screening_validity_days: Maximum calendar days between the health screening and signing, integer days.
  monthly_fee_adjustment_pct: Signed percentage applied to the independent living base monthly fee for an entrance fee resident (negative reduces, positive increases), percent.
  care_fee_discount_pct: Discount on assisted living care fees and memory care monthly rates for a resident holding an occupied agreement, percent.
  rent_discount_pct: Discount on assisted living apartment rent for a resident holding an occupied agreement, percent.
  transfer_to_care_keeps_agreement: Whether a move to Larkspur assisted living or memory care on campus leaves the agreement in force rather than terminating it, boolean.
  termination_notice_days: Length of the resident's written notice of termination after occupancy, integer calendar days.
  termination_notice_waived_on_death: Whether the agreement terminates on the date of death of the last resident without a notice period, boolean.
  for_cause_notice_days: Length of Larkspur's written notice of termination for cause, integer calendar days.
  refund_contingent_on_reoccupancy: Whether payment of the refund waits for the apartment to be re-occupied by a new entrance fee resident, boolean.
  reoccupancy_refund_days: Calendar days after the apartment is re-occupied by which a contingent refund is paid, integer days.
  declining_refund_days: Calendar days after the termination date by which a non-contingent refund is paid, integer days.
  refund_longstop_months: Calendar months after the termination date by which any refund is paid even if the apartment has not been re-occupied, integer months.
  refund_calculation_statement_days: Calendar days after the termination date by which the written refund calculation statement is issued, integer days.
  refurbishment_deduction_cap_pct: Maximum deduction from the refund for refurbishment beyond normal wear and tear, percent of the entrance fee.
  estate_documents_required: Whether a refund payable to an estate requires letters testamentary or letters of administration on file, boolean.
  upsize_difference_due: Whether a move to a larger apartment type requires payment of the difference in entrance fee at current prices, boolean.
  downsize_difference_refunded: Whether a move to a smaller apartment type refunds the difference in entrance fee, boolean.
  apartment_change_fee: Administrative fee for a resident-requested change of independent living apartment under the agreement, USD.
  medical_expense_pct_entrance_fee: Percentage of entrance fee paid in a tax year that the annual tax letter states as attributable to prepaid medical care, percent.
  medical_expense_pct_monthly_fee: Percentage of independent living monthly fees paid in a tax year that the annual tax letter states as attributable to medical care, percent.
  tax_letter_deadline: Month and day (MM-DD) of the year following the tax year by which the annual tax letter is issued.

