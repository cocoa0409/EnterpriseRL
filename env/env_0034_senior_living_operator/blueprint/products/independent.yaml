# Product charter — Independent Living Residency Agreement (rental model).
# Larkspur Senior Living. One file per category; the single registry of every number of this category.

category: independent
display_name: Independent Living Residency Agreement

binding:
  holding_table: independent_residencies
  event_tables: [independent_ledger]
  intake_tables: [independent_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {account_balance: resident_balance, reservation_deposit_held: reservation_deposit}

lifecycle:
  states: [reserved, active, notice_given, vacated, closed, cancelled]
  transitions:
    - from: reserved
      to: active
      by: system
      means: "The resident takes possession of the reserved apartment and the move-in date is recorded by the community move-in coordinator."
    - from: reserved
      to: cancelled
      by: user
      means: "The prospective resident signs a cancellation of the reservation before moving in."
    - from: active
      to: notice_given
      by: user
      means: "The resident or the resident's financial power of attorney signs the written notice of termination of the residency agreement."
    - from: notice_given
      to: active
      by: user
      means: "The resident signs a withdrawal of a previously given notice of termination before the intended vacate date."
    - from: notice_given
      to: vacated
      by: agent
      means: "The apartment is surrendered after notice - keys returned and belongings removed - and the vacate date is recorded."
    - from: active
      to: vacated
      by: agent
      means: "The residency ends without a resident notice - death of the last occupant, a permanent transfer to a Larkspur assisted living or memory care residence, or a discharge for nonpayment - and the vacate date is recorded."
    - from: vacated
      to: closed
      by: agent
      means: "The final statement is settled - the account balance and the reservation deposit held are both zero - and the residency file is closed."

accounts:
  - key: resident_balance
    unit: USD
    meaning: Amount the resident owes on the independent living account; charges book in, payments and credits book out, and a negative value is a credit balance owed back to the resident.
  - key: reservation_deposit
    unit: USD
    meaning: Reservation deposit money Larkspur holds against an apartment reservation; the deposit receipt books in, and its application to the first charges, refund or forfeiture book out.

parameter_schema:
  base_monthly_fee: Published base monthly service fee for this apartment type at single occupancy when a residency agreement is newly contracted or an apartment transfer is made, USD per calendar month.
  second_person_fee: Monthly fee added for a second occupant sharing the apartment, USD per calendar month (0 where a second occupant is not permitted).
  max_occupants: Maximum number of occupants permitted in the apartment, integer persons.
  community_fee_first_resident: One-time non-refundable community fee charged for the first resident at move-in, USD.
  community_fee_second_resident: One-time non-refundable community fee charged for a second occupant, at move-in or when the second occupant is added, USD (0 where a second occupant is not permitted).
  reservation_deposit_amount: Deposit taken when the apartment is reserved, USD; held and applied to the first charges at move-in.
  reservation_hold_days: Maximum number of calendar days from the reservation date to the planned move-in date, integer days.
  reservation_full_refund_days: Number of calendar days after the reservation date during which a cancellation receives a full deposit refund, integer days.
  reservation_late_cancel_refund_pct: Percentage of the reservation deposit refunded when a reservation is cancelled after the full-refund window, percent.
  move_out_notice_days: Length of the resident's written notice period of termination, integer calendar days counted from the notice date.
  post_death_fee_days: Number of calendar days after the date of death of the last occupant through which monthly fees continue, unless belongings are removed later, integer days.
  internal_transfer_notice_days: Shortened notice period that applies when the resident leaves the apartment for a Larkspur assisted living or memory care residence, integer calendar days counted from the notice date.
  rate_increase_notice_days: Minimum number of calendar days of written notice before a monthly service fee increase takes effect, integer days.
  max_annual_increase_pct: Contractual ceiling on any single annual increase of the monthly service fee, percent of the fee in effect immediately before the increase.
  new_resident_rate_guarantee_months: Number of calendar months after the move-in date during which the monthly service fee may not be increased, integer months.
  rate_increase_effective_month: Calendar month number (1-12) on whose first day the annual increase normally takes effect.
  fee_due_day: Day of the calendar month on which monthly fees are billed in advance and fall due, integer day of month.
  payment_grace_days: Number of days after the due day during which a monthly fee may be paid without a late fee, integer days.
  late_fee_flat: Flat component of the late fee, USD; the late fee is the greater of this and the percentage component.
  late_fee_pct: Percentage component of the late fee, percent of the past-due amount for that billing period.
  late_fee_min_past_due: Past-due amount for the billing period below which no late fee is assessed, USD.
  late_fee_goodwill_waivers_per_12m: Number of late fees that may be waived on request as goodwill in any rolling 12-month window, integer count.
  returned_payment_fee: Fee charged when a payment is returned unpaid by the bank (insufficient funds, closed account, stop payment), USD per returned payment.
  returned_payments_before_certified_funds: Number of returned payments in a rolling 12-month window after which only certified funds or ACH autopay are accepted, integer count.
  past_due_days_before_discharge_notice: Number of calendar days a monthly fee may remain past due before Larkspur may issue a written notice of discharge for nonpayment, integer days.
  discharge_notice_days: Length of the written notice of discharge for nonpayment, integer calendar days.
  pet_one_time_fee: One-time non-refundable pet fee charged when a pet is registered, USD per pet.
  pet_monthly_fee: Monthly pet fee per registered pet, USD per calendar month.
  max_pets: Maximum number of registered pets permitted in the apartment, integer count.
  pet_weight_limit_lbs: Maximum adult weight of a registered dog, pounds.
  storage_unit_included: Whether one storage unit is included in the monthly service fee, boolean.
  storage_unit_monthly_fee: Monthly rent for a storage unit that is not included, USD per calendar month.
  covered_parking_included_spaces: Number of covered parking spaces (or garage spaces for cottage homes) included in the monthly service fee, integer count.
  covered_parking_monthly_fee: Monthly rent for each covered parking space beyond those included, USD per calendar month.
  guest_suite_included_nights_per_year: Number of guest suite nights included at no charge per calendar year, integer nights.
  guest_suite_nightly_rate: Rate for each guest suite night beyond the included nights, USD per night.
  guest_suite_max_consecutive_nights: Maximum consecutive nights of a single guest suite booking, integer nights.
  key_fob_replacement_fee: Fee for replacing a lost or damaged apartment key fob, USD per fob.
  pendant_replacement_fee: Fee for replacing a lost or damaged emergency response pendant, USD per pendant.
  lockout_fee: Fee for an after-hours lockout service call beyond the included lockouts, USD per call.
  included_lockouts_per_12m: Number of after-hours lockout calls included at no charge in a rolling 12-month window, integer count.
  carpet_cleaning_fee: Standard move-out carpet and floor cleaning fee charged when the apartment is vacated, USD.
  apartment_transfer_fee: Administrative and turnover fee for a resident-requested transfer to another independent living apartment, USD per transfer.
  card_convenience_fee_pct: Convenience fee on payments made by credit card, percent of the card payment amount.
  final_statement_days: Number of calendar days after the vacate date by which the final statement is issued and any credit balance is refunded, integer days.
  referral_credit_amount: Account credit granted to a resident who referred a new independent living resident, USD per qualifying referral.
  referral_credit_qualifying_days: Number of calendar days the referred resident must have been in residence before the referral credit is granted, integer days.
  referral_credits_per_12m_cap: Maximum number of referral credits granted to one resident in a rolling 12-month window, integer count.
  min_resident_age: Minimum age of the first resident on the planned move-in date, integer years.
  second_occupant_min_age: Minimum age of a second occupant on the date the second occupant moves in, integer years.

