events:
  # ---- holding writes (independent_residencies) ----
  - type: independent_reservation_create
    target: independent_residencies
    mutation: create
    meaning: A prospective resident reserves a specific independent living apartment and the residency agreement record is opened in reserved status.
    grain: One row per residency agreement (one apartment reservation by one customer).
    fields:
      independent_residency_id: Reference number of the new residency agreement.
      customer_id: The first resident who signs the reservation.
      variant_name: Official apartment type reserved, verbatim tier name.
      community_name: Larkspur community where the apartment is located.
      apartment_number: Apartment number as printed on the reservation.
      occupancy_type: Single or double occupancy contracted at reservation.
      second_occupant_name: Name of the second occupant for double occupancy; empty for single.
      reservation_date: Date the reservation and deposit were taken.
      planned_move_in_date: Planned move-in date agreed at reservation.
      monthly_service_fee: Contracted base monthly service fee for the apartment, excluding the second person fee.
      rate_effective_date: Date from which the contracted monthly service fee applies (the planned move-in date at reservation).
      referred_by_customer_id: Current Larkspur independent living resident named on the reservation as the referrer; empty when none.
    triggers:
      - event: independent:independent_deposit_receipt
        map: {independent_residency_id: independent_residency_id, customer_id: customer_id}
  - type: independent_move_in
    target: independent_residencies
    mutation: {transition: {from: reserved, to: active}}
    meaning: The resident takes possession of the reserved apartment.
    grain: One row per residency; the move-in happens once.
    fields:
      independent_residency_id: The residency moved into.
      move_in_date: Date possession was taken; monthly fees accrue from this date.
      occupancy_type: Occupancy confirmed at move-in (single or double).
    triggers:
      - event: independent:independent_monthly_fee_charge
        map: {independent_residency_id: independent_residency_id, fee_component: base_fee, charge_basis: prorated_move_in}
      - event: independent:independent_community_fee_charge
        map: {independent_residency_id: independent_residency_id, occupant_position: first_resident}
      - event: independent:independent_community_fee_charge
        when: {occupancy_type: double}
        map: {independent_residency_id: independent_residency_id, occupant_position: second_resident}
      - event: independent:independent_deposit_applied
        map: {independent_residency_id: independent_residency_id}
  - type: independent_reservation_cancel
    target: independent_residencies
    mutation: {transition: {from: reserved, to: cancelled}}
    meaning: The prospective resident cancels the reservation before moving in.
    grain: One row per residency; a reservation is cancelled at most once.
    fields:
      independent_residency_id: The reservation cancelled.
      termination_reason: Fixed to reservation_cancelled.
      closed_date: Date the cancellation was signed.
    triggers:
      - event: independent:independent_deposit_refund
        map: {independent_residency_id: independent_residency_id}
  - type: independent_notice_record
    target: independent_residencies
    mutation: {transition: {from: active, to: notice_given}}
    meaning: The resident's signed written notice of termination is recorded against the residency.
    grain: One row per notice; a residency carries at most one open notice at a time.
    fields:
      independent_residency_id: The residency being terminated.
      notice_date: Date the written notice was signed.
      intended_vacate_date: Date the resident intends to surrender the apartment, as stated on the notice.
      termination_reason: resident_notice, transfer_assisted or transfer_memory as stated on the notice.
    triggers: []
  - type: independent_notice_withdraw
    target: independent_residencies
    mutation: {transition: {from: notice_given, to: active}}
    meaning: The resident withdraws a notice of termination and the residency continues.
    grain: One row per withdrawal of a notice.
    fields:
      independent_residency_id: The residency whose notice is withdrawn.
      notice_date: Cleared to empty on withdrawal.
      intended_vacate_date: Cleared to empty on withdrawal.
      termination_reason: Reset to none on withdrawal.
    triggers: []
  - type: independent_vacate
    target: independent_residencies
    mutation: {transition: {from: notice_given, to: vacated}}
    meaning: After a notice of termination, the apartment is surrendered - keys returned and belongings removed.
    grain: One row per residency; the apartment is vacated once.
    fields:
      independent_residency_id: The residency vacated.
      vacate_date: Date keys were returned and belongings removed.
    triggers:
      - event: independent:independent_service_fee_charge
        map: {independent_residency_id: independent_residency_id, fee_code: carpet_cleaning}
  - type: independent_end_without_notice
    target: independent_residencies
    mutation: {transition: {from: active, to: vacated}}
    meaning: The residency ends without a resident notice - death of the last occupant, a permanent transfer to a Larkspur assisted living or memory care residence, or a discharge for nonpayment.
    grain: One row per residency; the apartment is vacated once.
    fields:
      independent_residency_id: The residency ended.
      vacate_date: Date the apartment was surrendered (belongings removed and keys returned).
      notice_date: Date the community was told of the death or transfer, or the date the discharge notice was issued.
      termination_reason: death, transfer_assisted, transfer_memory or nonpayment_discharge.
    triggers:
      - event: independent:independent_service_fee_charge
        map: {independent_residency_id: independent_residency_id, fee_code: carpet_cleaning}
  - type: independent_account_close
    target: independent_residencies
    mutation: {transition: {from: vacated, to: closed}}
    meaning: The final statement is settled and the residency file is closed.
    grain: One row per residency.
    fields:
      independent_residency_id: The residency closed.
      closed_date: Date the file was closed.
    triggers: []
  - type: independent_rate_notice
    target: independent_residencies
    mutation: update
    meaning: Written notice of an annual monthly service fee increase is mailed to the resident and the proposed fee is recorded.
    grain: One row per increase notice mailed.
    fields:
      independent_residency_id: The residency receiving the notice.
      rate_notice_date: Date the written notice was mailed.
      proposed_monthly_service_fee: New monthly service fee stated in the notice.
    triggers: []
  - type: independent_rate_adjust
    target: independent_residencies
    mutation: update
    meaning: The contracted monthly service fee is changed by an annual increase.
    grain: One row per rate change; a residency receives at most one annual increase per 12 months.
    fields:
      independent_residency_id: The residency whose fee changes.
      monthly_service_fee: New contracted base monthly service fee.
      rate_effective_date: Date the new fee takes effect.
    triggers: []
  - type: independent_occupancy_change
    target: independent_residencies
    mutation: update
    meaning: A second occupant is added to, or leaves, the apartment.
    grain: One row per occupancy change.
    fields:
      independent_residency_id: The residency whose occupancy changes.
      occupancy_type: New occupancy (single or double).
      second_occupant_name: Name of the second occupant now in residence; empty when single.
    triggers:
      - event: independent:independent_community_fee_charge
        when: {occupancy_type: double}
        map: {independent_residency_id: independent_residency_id, occupant_position: second_resident}
  - type: independent_apartment_transfer
    target: independent_residencies
    mutation: update
    meaning: The resident moves, at their own request, to another independent living apartment in the same community under the same agreement.
    grain: One row per apartment transfer.
    fields:
      independent_residency_id: The residency transferred.
      variant_name: Official apartment type of the new apartment.
      apartment_number: Number of the new apartment.
      monthly_service_fee: Monthly service fee contracted for the new apartment.
      rate_effective_date: Date the resident takes possession of the new apartment.
    triggers:
      - event: independent:independent_service_fee_charge
        map: {independent_residency_id: independent_residency_id, fee_code: apartment_transfer}
  # ---- ledger writes (independent_ledger) ----
  - type: independent_monthly_fee_charge
    target: independent_ledger
    meaning: A monthly service fee or second person fee is charged for a span of days within one billing month.
    grain: One row per residency per fee component per continuous billed span within a billing period.
    distinguish_by: [billing_period, fee_component, service_from_date]
    fields:
      independent_residency_id: The residency billed.
      customer_id: The resident billed.
      amount: Charge amount, positive, USD.
      posting_date: Date the charge was posted.
      billing_period: Calendar month billed, YYYY-MM.
      fee_component: base_fee or second_person_fee.
      charge_basis: full_month, prorated_move_in, prorated_move_out, prorated_rate_change or prorated_occupancy_change.
      service_from_date: First day covered by this charge.
      service_to_date: Last day covered by this charge.
      days_billed: Number of days covered, inclusive of both ends.
      days_in_period: Number of days in the calendar month billed.
    account: resident_balance
    direction: in
    triggers: []
  - type: independent_community_fee_charge
    target: independent_ledger
    meaning: The one-time community fee is charged for an occupant.
    grain: One row per occupant moving in - the first resident at move-in and each second occupant when they move in.
    distinguish_by: [occupant_position, posting_date]
    fields:
      independent_residency_id: The residency billed.
      customer_id: The resident billed.
      amount: Community fee, positive, USD.
      posting_date: Date posted.
      occupant_position: first_resident or second_resident.
    account: resident_balance
    direction: in
    triggers: []
  - type: independent_service_fee_charge
    target: independent_ledger
    meaning: A scheduled service or amenity fee is charged - pets, storage, parking, guest suite, replacements, lockouts, move-out cleaning, apartment transfer, returned payments or card convenience fees.
    grain: One row per fee code per service date per source entry.
    distinguish_by: [fee_code, service_date, source_entry_id]
    fields:
      independent_residency_id: The residency billed.
      customer_id: The resident billed.
      amount: Fee amount, USD; 0.00 when an included allowance (guest suite night, lockout) is consumed.
      posting_date: Date posted.
      fee_code: Which scheduled fee this is.
      service_date: Date the service was used, or the first day of the billing month for monthly fees.
      billing_period: Calendar month for monthly fees, YYYY-MM; empty for one-time fees.
      quantity: Number of units charged (nights, pets, fobs, spaces, calls).
      source_entry_id: The payment or returned payment entry this fee arises from; empty when not derived from another entry.
    account: resident_balance
    direction: in
    triggers: []
  - type: independent_late_fee_charge
    target: independent_ledger
    meaning: A late fee is assessed for a billing period whose fees remained unpaid after the grace period.
    grain: One row per residency per billing period.
    distinguish_by: [billing_period]
    fields:
      independent_residency_id: The residency billed.
      customer_id: The resident billed.
      amount: Late fee, positive, USD.
      posting_date: Date assessed.
      billing_period: Billing period whose fees were past due, YYYY-MM.
    account: resident_balance
    direction: in
    triggers: []
  - type: independent_payment
    target: independent_ledger
    meaning: A payment from the resident or their representative is received on the independent living account.
    grain: One row per payment instrument (check number, ACH trace or card authorization).
    distinguish_by: [payment_reference]
    fields:
      independent_residency_id: The residency credited.
      customer_id: The resident credited.
      amount: Payment amount, positive, USD.
      posting_date: Date received.
      payment_reference: Check number, ACH trace number or card authorization code.
      payment_method: ach_autopay, ach_one_time, check, credit_card or debit_card.
    account: resident_balance
    direction: out
    triggers:
      - event: independent:independent_service_fee_charge
        when: {payment_method: credit_card}
        map: {independent_residency_id: independent_residency_id, fee_code: card_convenience}
  - type: independent_payment_return
    target: independent_ledger
    meaning: A previously posted payment is returned unpaid by the bank and its amount is reinstated on the account.
    grain: One row per returned payment entry.
    distinguish_by: [source_entry_id]
    fields:
      independent_residency_id: The residency debited.
      customer_id: The resident debited.
      amount: Amount of the returned payment, positive, USD.
      posting_date: Date the return was posted.
      source_entry_id: The payment entry that was returned.
      payment_reference: Reference of the returned payment instrument.
    account: resident_balance
    direction: in
    triggers:
      - event: independent:independent_service_fee_charge
        map: {independent_residency_id: independent_residency_id, fee_code: returned_payment}
  - type: independent_credit
    target: independent_ledger
    meaning: A credit reduces the amount owed - billing corrections, move-out or rate-change proration, a late fee waiver, a referral credit, the application of the reservation deposit or a respite conversion credit.
    grain: One row per credit reason per source entry (and per referred residency or source respite stay where applicable).
    distinguish_by: [credit_reason, source_entry_id, referred_residency_id, respite_stay_id]
    fields:
      independent_residency_id: The residency credited.
      customer_id: The resident credited.
      amount: Credit amount, positive, USD.
      posting_date: Date posted.
      credit_reason: billing_error, move_out_proration, rate_change_proration, late_fee_waiver, referral_credit, deposit_application or respite_conversion.
      source_entry_id: The charge entry being corrected, prorated or waived, or the deposit receipt entry being applied; empty for a respite conversion credit.
      referred_residency_id: For referral credits, the referred resident's residency; empty otherwise.
      respite_stay_id: For respite conversion credits, the respite or trial stay converted; empty otherwise.
      billing_period: Billing period the credit relates to, YYYY-MM; empty when not period-based.
    account: resident_balance
    direction: out
    triggers: []
  - type: independent_credit_balance_refund
    target: independent_ledger
    meaning: A credit balance on the account is refunded to the resident or the estate by check or ACH.
    grain: One row per refund instrument.
    distinguish_by: [payment_reference]
    fields:
      independent_residency_id: The residency refunded.
      customer_id: The resident refunded.
      amount: Refund amount, positive, USD.
      posting_date: Date the refund was issued.
      payment_reference: Refund check number or ACH trace number.
      payment_method: check or ach_one_time.
    account: resident_balance
    direction: in
    triggers: []
  - type: independent_deposit_receipt
    target: independent_ledger
    meaning: The reservation deposit is received and held.
    grain: One row per deposit payment instrument.
    distinguish_by: [payment_reference]
    fields:
      independent_residency_id: The reservation the deposit secures.
      customer_id: The prospective resident.
      amount: Deposit amount, positive, USD.
      posting_date: Date received.
      payment_reference: Check number, ACH trace or card authorization of the deposit.
      payment_method: Method of the deposit payment.
    account: reservation_deposit
    direction: in
    triggers: []
  - type: independent_deposit_applied
    target: independent_ledger
    meaning: The reservation deposit held is applied to the first charges at move-in.
    grain: One row per deposit receipt applied.
    distinguish_by: [source_entry_id]
    fields:
      independent_residency_id: The residency.
      customer_id: The resident.
      amount: Amount applied, positive, USD.
      posting_date: Date applied.
      source_entry_id: The deposit receipt entry applied.
    account: reservation_deposit
    direction: out
    triggers:
      - event: independent:independent_credit
        map: {independent_residency_id: independent_residency_id, credit_reason: deposit_application, source_entry_id: source_entry_id, amount: amount}
  - type: independent_deposit_refund
    target: independent_ledger
    meaning: All or part of a reservation deposit is refunded after a cancellation.
    grain: One row per deposit receipt refunded.
    distinguish_by: [source_entry_id]
    fields:
      independent_residency_id: The cancelled reservation.
      customer_id: The prospective resident.
      amount: Amount refunded, positive, USD.
      posting_date: Date the refund was issued.
      source_entry_id: The deposit receipt entry refunded.
    account: reservation_deposit
    direction: out
    triggers: []
  - type: independent_deposit_forfeit
    target: independent_ledger
    meaning: The non-refundable part of a reservation deposit is retained after a late cancellation.
    grain: One row per deposit receipt forfeited.
    distinguish_by: [source_entry_id]
    fields:
      independent_residency_id: The cancelled reservation.
      customer_id: The prospective resident.
      amount: Amount retained, positive, USD.
      posting_date: Date retained.
      source_entry_id: The deposit receipt entry partly retained.
    account: reservation_deposit
    direction: out
    triggers: []

measures:
  - id: independent_msr_returned_payments_12m
    window: Rolling 365 calendar days ending on the handling date, by posting_date.
    measure: Count of independent_payment_return entries on the residency.
  - id: independent_msr_late_fee_waivers_12m
    window: Rolling 365 calendar days ending on the handling date, by posting_date.
    measure: Count of independent_credit entries with credit_reason late_fee_waiver on the residency.
  - id: independent_msr_guest_nights_calendar_year
    window: The calendar year (January 1 to December 31) containing the guest suite night being booked, by service_date.
    measure: Sum of quantity over independent_service_fee_charge entries with fee_code guest_suite_night on the residency, whether charged or posted at 0.00 as included nights.
  - id: independent_msr_lockouts_12m
    window: Rolling 365 calendar days ending on the date of the lockout call, by service_date.
    measure: Count of independent_service_fee_charge entries with fee_code lockout_after_hours on the residency, whether charged or posted at 0.00 as included calls.
  - id: independent_msr_referral_credits_12m
    window: Rolling 365 calendar days ending on the handling date, by posting_date.
    measure: Count of independent_credit entries with credit_reason referral_credit on the referring resident's residency.
  - id: independent_msr_period_past_due
    window: The single billing period being assessed, evaluated at the end of the last grace day of that period.
    measure: Sum of independent_monthly_fee_charge and recurring independent_service_fee_charge amounts with that billing_period, less payments and credits applied to them oldest charge first.

policies:
  - id: independent_agg_multi_holding
    subject: [independent_reservation_create]
    rule: >-
      A customer holds at most one independent living residency agreement at a time; a second occupant
      sharing the apartment is recorded on the same agreement and never opens an agreement of their own.
      A new reservation may be opened only when the customer has no other independent living residency in reserved, active or notice_given status.
      Independent living and Larkspur care residences are mutually exclusive for the same person:
      A new reservation may be opened only when the customer has no assisted living residency in pending_admission, active, on_leave or notice_given status and no memory care residency in pending_admission, active, on_leave or notice_given status.
      A customer whose prior residency is vacated, closed or cancelled may reserve again; the earlier
      residency keeps its own ledger and final statement.
    eligibility:
      - id: no_open_independent_residency
        applies_to: [independent_reservation_create]
        kind: dedup
        condition: A new reservation may be opened only when the customer has no other independent living residency in reserved, active or notice_given status.
        evidence_fields: [independent_residencies.customer_id, independent_residencies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.customer_id]
          action_bindings:
            independent_residencies.customer_id: customer_id
        dedup_contract:
          table: independent_residencies
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [reserved, active, notice_given]}
          distinct_fields: [independent_residency_id]
      - id: no_open_care_residency
        applies_to: [independent_reservation_create]
        kind: dedup
        condition: A new reservation may be opened only when the customer has no assisted living residency in pending_admission, active, on_leave or notice_given status and no memory care residency in pending_admission, active, on_leave or notice_given status.
        evidence_fields: [assisted_residencies.customer_id, assisted_residencies.status, memory_residencies.customer_id, memory_residencies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.customer_id]
            - [memory_residencies.customer_id]
          action_bindings:
            assisted_residencies.customer_id: customer_id
            memory_residencies.customer_id: customer_id
        dedup_contract:
          table: assisted_residencies
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_admission, active, on_leave, notice_given]}
          distinct_fields: [assisted_residency_id]
    params:
      max_per_customer: 1

  - id: independent_reservation_terms
    subject: [independent_reservation_create, independent_deposit_receipt]
    rule: >-
      An apartment is reserved for one named customer at one community. The first resident must be at least min_resident_age years old on the planned move-in date, by date_of_birth on the customer profile.
      The number of occupants contracted may not exceed max_occupants of the apartment type, so a Studio is single occupancy only.
      The planned move-in date may not be later than reservation_hold_days calendar days after the reservation date; a later move-in requires a new reservation once the hold lapses.
      The deposit taken is reservation_deposit_amount of the reserved apartment type, paid in one instrument and recorded as one deposit receipt; a card deposit carries no convenience fee.
      The contracted monthly_service_fee recorded at reservation is base_monthly_fee of the reserved apartment type, and rate_effective_date is the planned move-in date.
      Where the customer also holds an Entrance Fee Agreement for the same apartment in reserved status, the contracted monthly_service_fee is base_monthly_fee adjusted by monthly_fee_adjustment_pct of that agreement's plan (set in the Entrance Fee Agreement charter; a negative percentage reduces the fee and a positive one increases it), rounded to the cent half up; a customer without such an agreement pays the rental base fee.
      The deposit receipt may be posted only while the residency is in reserved status.
    eligibility:
      - id: resident_minimum_age
        applies_to: [independent_reservation_create]
        kind: caller_fact
        condition: The first resident must be at least min_resident_age years old on the planned move-in date, by date_of_birth on the customer profile.
        evidence_fields: [customers.date_of_birth, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: occupancy_within_apartment_limit
        applies_to: [independent_reservation_create]
        kind: caller_fact
        condition: The number of occupants contracted may not exceed max_occupants of the apartment type, so a Studio is single occupancy only.
        evidence_fields: [independent_residencies.occupancy_type, independent_residencies.variant_name]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [independent_residencies.variant_name]
          action_bindings:
            independent_residencies.variant_name: variant_name
      - id: deposit_only_while_reserved
        applies_to: [independent_deposit_receipt]
        kind: state
        condition: The deposit receipt may be posted only while the residency is in reserved status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [reserved]
    params:
      rounding: nearest cent, half up
      per_tier:
        Independent Living Studio: {reservation_deposit_amount: "=reservation_deposit_amount", reservation_hold_days: "=reservation_hold_days", max_occupants: "=max_occupants"}
        Independent Living One-Bedroom: {reservation_deposit_amount: "=reservation_deposit_amount", reservation_hold_days: "=reservation_hold_days", max_occupants: "=max_occupants"}
        Independent Living One-Bedroom Deluxe: {reservation_deposit_amount: "=reservation_deposit_amount", reservation_hold_days: "=reservation_hold_days", max_occupants: "=max_occupants"}
        Independent Living Two-Bedroom: {reservation_deposit_amount: "=reservation_deposit_amount", reservation_hold_days: "=reservation_hold_days", max_occupants: "=max_occupants"}
        Independent Living Two-Bedroom Deluxe: {reservation_deposit_amount: "=reservation_deposit_amount", reservation_hold_days: "=reservation_hold_days", max_occupants: "=max_occupants"}
        Independent Living Cottage Home: {reservation_deposit_amount: "=reservation_deposit_amount", reservation_hold_days: "=reservation_hold_days", max_occupants: "=max_occupants"}

  - id: independent_reservation_cancellation
    subject: [independent_reservation_cancel, independent_deposit_refund, independent_deposit_forfeit]
    rule: >-
      A reservation can be cancelled only by the prospective resident's own signed cancellation; the desk
      registers the cancellation request and the customer signs it. Cancellation is possible only before move-in.
      The deposit is refunded in full only if the cancellation is signed no later than reservation_full_refund_days after the apartment is reserved.
      The window is counted in calendar days: the reservation date is day 0 and the window's last day is the reservation date plus reservation_full_refund_days calendar days, with a cancellation signed on that last day still inside the window.
      A forfeit may be retained only when the cancellation is signed after the full-refund window has closed, that is later than reservation_full_refund_days after the apartment is reserved.
      A cancellation signed after the window refunds reservation_late_cancel_refund_pct of the deposit received and retains the remainder as a forfeit, each rounded to the cent half up with the refund taking the rounded half and the forfeit the difference.
      Where the prospective resident dies, or a physician certifies in writing before the planned move-in date that they can no longer live independently, the deposit is refunded in full regardless of timing; this exception is evidenced by date_of_death on the customer profile or by an assisted living or memory care admission opened for the customer before the planned move-in date.
      Refunds and forfeits each reference the deposit receipt entry they draw from, and a deposit receipt is refunded or forfeited at most once.
    eligibility:
      - id: forfeit_only_after_window
        applies_to: [independent_deposit_forfeit]
        kind: time
        condition: A forfeit may be retained only when the cancellation is signed after the full-refund window has closed, that is later than reservation_full_refund_days after the apartment is reserved.
        evidence_fields: [independent_residencies.reservation_date, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the apartment is reserved
          anchor_source: independent_residencies.reservation_date
          relation: not_before
          duration_source: variants.reservation_full_refund_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days: the reservation date is day 0 and the window's last day is the reservation date plus reservation_full_refund_days calendar days, with a cancellation signed on that last day still inside the window."
          boundary: exclusive
      - id: deposit_not_already_settled
        applies_to: [independent_deposit_refund, independent_deposit_forfeit]
        kind: dedup
        condition: Refunds and forfeits each reference the deposit receipt entry they draw from, and a deposit receipt is refunded or forfeited at most once.
        evidence_fields: [independent_ledger.source_entry_id, independent_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.source_entry_id]
          action_bindings:
            independent_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: independent_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id, event_type: event_type}
          duplicate_filters: {event_type: [independent_deposit_refund, independent_deposit_forfeit, independent_deposit_applied]}
          distinct_fields: []
    formula:
      refund_amount_late: round(reservation_deposit * reservation_late_cancel_refund_pct / 100, 2)
      forfeit_amount_late: reservation_deposit - refund_amount_late

  - id: independent_move_in_billing
    subject: [independent_move_in, independent_deposit_applied, independent_community_fee_charge]
    rule: >-
      On the move-in date fees begin to accrue. The first month is billed from the move-in date through the last day of that calendar month as a prorated_move_in base fee charge, plus a prorated second person fee when the occupancy is double.
      The community fee is charged once per occupant position: community_fee_first_resident at move-in, and community_fee_second_resident when a second occupant moves in with the resident or is added later.
      The community fee is waived in full for a resident who holds an Entrance Fee Agreement for the apartment, and in that case no community fee row is written; a resident converting from a Larkspur trial or respite stay is charged the community fee and receives the respite conversion credit instead.
      The whole reservation deposit held is applied at move-in as a deposit_application credit referencing the deposit receipt.
      A community fee may be charged only while the residency is in active or notice_given status.
    eligibility:
      - id: community_fee_on_live_residency
        applies_to: [independent_community_fee_charge]
        kind: state
        condition: A community fee may be charged only while the residency is in active or notice_given status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given]
    params:
      per_tier:
        Independent Living Studio: {community_fee_first_resident: "=community_fee_first_resident", community_fee_second_resident: "=community_fee_second_resident"}
        Independent Living One-Bedroom: {community_fee_first_resident: "=community_fee_first_resident", community_fee_second_resident: "=community_fee_second_resident"}
        Independent Living One-Bedroom Deluxe: {community_fee_first_resident: "=community_fee_first_resident", community_fee_second_resident: "=community_fee_second_resident"}
        Independent Living Two-Bedroom: {community_fee_first_resident: "=community_fee_first_resident", community_fee_second_resident: "=community_fee_second_resident"}
        Independent Living Two-Bedroom Deluxe: {community_fee_first_resident: "=community_fee_first_resident", community_fee_second_resident: "=community_fee_second_resident"}
        Independent Living Cottage Home: {community_fee_first_resident: "=community_fee_first_resident", community_fee_second_resident: "=community_fee_second_resident"}

  - id: independent_monthly_billing
    subject: [independent_monthly_fee_charge]
    rule: >-
      Monthly fees are billed in advance on fee_due_day of each calendar month for that whole month: one base_fee charge of the contracted monthly_service_fee, and one second_person_fee charge of second_person_fee of the apartment type while the occupancy is double.
      Any span shorter than a whole calendar month - the move-in month, a mid-month rate change, a mid-month occupancy change or the month in which fees end - is prorated: the daily amount is the monthly amount divided by the actual number of days in that calendar month, multiplied by the days billed counted inclusive of both the first and last day, and rounded once to the cent half up.
      A mid-month change splits the month into separately billed spans, each with its own service_from_date, so that no day is billed twice for the same component.
      Monthly fee charges may be posted only while the residency is in active or notice_given status.
      Monthly fees continue unchanged while the resident is away from the apartment for any reason; independent living has no absence credit.
    eligibility:
      - id: billing_on_live_residency
        applies_to: [independent_monthly_fee_charge]
        kind: state
        condition: Monthly fee charges may be posted only while the residency is in active or notice_given status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given]
    formula:
      base_fee_amount: round(monthly_service_fee * days_billed / days_in_period, 2)
      second_person_amount: round(second_person_fee * days_billed / days_in_period, 2)
    params:
      per_tier:
        Independent Living Studio: {second_person_fee: "=second_person_fee"}
        Independent Living One-Bedroom: {second_person_fee: "=second_person_fee"}
        Independent Living One-Bedroom Deluxe: {second_person_fee: "=second_person_fee"}
        Independent Living Two-Bedroom: {second_person_fee: "=second_person_fee"}
        Independent Living Two-Bedroom Deluxe: {second_person_fee: "=second_person_fee"}
        Independent Living Cottage Home: {second_person_fee: "=second_person_fee"}

  - id: independent_rate_adjustment
    subject: [independent_rate_notice, independent_rate_adjust, independent_credit]
    rule: >-
      The monthly service fee is reviewed once a year and an increase normally takes effect on the first day of month rate_increase_effective_month.
      Written notice of each increase is mailed to the resident and recorded with its date and the proposed fee; the fee recorded when the increase takes effect is the proposed fee from that notice.
      An increase may be recorded, and may take effect, only on or after the date that is rate_increase_notice_days after written notice of the increase is mailed to the resident.
      Notice days are counted in calendar days from the day after the notice is mailed, so the increase may take effect on the date equal to the mailing date plus rate_increase_notice_days calendar days or any later date.
      No increase may take effect within new_resident_rate_guarantee_months calendar months after the move-in date; a resident whose guarantee ends after the normal effective date receives that year's increase on the first day of the calendar month following the end of the guarantee.
      The guarantee ends on the same day number new_resident_rate_guarantee_months calendar months after the move-in date, falling back to the last day of that month when the day number does not exist.
      The residency must be in active or notice_given status for an increase notice or an increase to be recorded.
      The new fee may not exceed the fee in effect immediately before by more than max_annual_increase_pct percent, rounded to the cent half up, and a residency receives at most one increase in any 12-month period.
      When an increase is recorded after fees for the effective month were already billed at the old fee, the difference for the days from the effective date is charged as a prorated_rate_change charge; when a fee is reduced on correction, the difference is returned as a rate_change_proration credit referencing the original charge.
      The base fees published for new agreements do not change the fee of an existing residency except through this policy.
    eligibility:
      - id: increase_notice_period
        applies_to: [independent_rate_adjust]
        kind: time
        condition: An increase may be recorded, and may take effect, only on or after the date that is rate_increase_notice_days after written notice of the increase is mailed to the resident.
        evidence_fields: [independent_residencies.rate_notice_date, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: written notice of the increase is mailed to the resident
          anchor_source: independent_residencies.rate_notice_date
          relation: not_before
          duration_source: variants.rate_increase_notice_days
          unit: calendar_days
          counting_rule: Notice days are counted in calendar days from the day after the notice is mailed, so the increase may take effect on the date equal to the mailing date plus rate_increase_notice_days calendar days or any later date.
          boundary: inclusive
      - id: rate_guarantee_period
        applies_to: [independent_rate_adjust]
        kind: time
        condition: No increase may take effect within new_resident_rate_guarantee_months calendar months after the move-in date; a resident whose guarantee ends after the normal effective date receives that year's increase on the first day of the calendar month following the end of the guarantee.
        evidence_fields: [independent_residencies.move_in_date, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the move-in date
          anchor_source: independent_residencies.move_in_date
          relation: not_before
          duration_source: variants.new_resident_rate_guarantee_months
          unit: calendar_months
          counting_rule: The guarantee ends on the same day number new_resident_rate_guarantee_months calendar months after the move-in date, falling back to the last day of that month when the day number does not exist.
          boundary: exclusive
      - id: increase_on_live_residency
        applies_to: [independent_rate_notice, independent_rate_adjust]
        kind: state
        condition: The residency must be in active or notice_given status for an increase notice or an increase to be recorded.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given]
    formula:
      max_new_fee: round(monthly_service_fee * (1 + max_annual_increase_pct / 100), 2)

  - id: independent_late_fee
    subject: [independent_late_fee_charge, independent_credit]
    rule: >-
      Monthly fees fall due on fee_due_day and may be paid without penalty during the grace period.
      A late fee may be assessed only after payment_grace_days have passed since the monthly fee charge for that billing period was posted.
      The grace period ends at the end of the day equal to the posting date of the monthly fee charge plus payment_grace_days calendar days, and a late fee may be assessed only on a later date.
      The past-due amount is independent_msr_period_past_due for that billing period; no late fee is assessed when it is below late_fee_min_past_due.
      Otherwise the late fee is the greater of late_fee_flat and late_fee_pct percent of the past-due amount rounded to the cent half up.
      At most one late fee is assessed per residency per billing period.
      A late fee may be assessed only while the residency is in active or notice_given status.
      On the resident's request a late fee may be waived as goodwill with a late_fee_waiver credit of the full late fee amount referencing that late fee entry, provided the past-due fees of that billing period have since been paid in full.
      A goodwill waiver is available only while independent_msr_late_fee_waivers_12m is below late_fee_goodwill_waivers_per_12m and independent_msr_returned_payments_12m is zero.
      Late fees are never charged on unpaid late fees, community fees or one-time service fees.
    eligibility:
      - id: grace_period_elapsed
        applies_to: [independent_late_fee_charge]
        kind: time
        condition: A late fee may be assessed only after payment_grace_days have passed since the monthly fee charge for that billing period was posted.
        evidence_fields: [independent_ledger.posting_date, independent_ledger.billing_period, independent_ledger.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.independent_residency_id, independent_ledger.billing_period]
          action_bindings:
            independent_ledger.independent_residency_id: independent_residency_id
            independent_ledger.billing_period: billing_period
        temporal_basis:
          clock: frozen_time
          anchor_event: the monthly fee charge for that billing period was posted
          anchor_source: independent_ledger.posting_date
          relation: not_before
          duration_source: variants.payment_grace_days
          unit: calendar_days
          counting_rule: The grace period ends at the end of the day equal to the posting date of the monthly fee charge plus payment_grace_days calendar days, and a late fee may be assessed only on a later date.
          boundary: exclusive
      - id: one_late_fee_per_period
        applies_to: [independent_late_fee_charge]
        kind: dedup
        condition: At most one late fee is assessed per residency per billing period.
        evidence_fields: [independent_ledger.independent_residency_id, independent_ledger.billing_period, independent_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.independent_residency_id, independent_ledger.billing_period]
          action_bindings:
            independent_ledger.independent_residency_id: independent_residency_id
            independent_ledger.billing_period: billing_period
        dedup_contract:
          table: independent_ledger
          mode: separate_record
          object_bindings: {independent_residency_id: independent_residency_id, billing_period: billing_period}
          duplicate_filters: {event_type: [independent_late_fee_charge]}
          distinct_fields: []
      - id: late_fee_on_live_residency
        applies_to: [independent_late_fee_charge]
        kind: state
        condition: A late fee may be assessed only while the residency is in active or notice_given status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given]
      - id: goodwill_waiver_quota
        applies_to: [independent_credit]
        kind: authorization
        condition: A goodwill waiver is available only while independent_msr_late_fee_waivers_12m is below late_fee_goodwill_waivers_per_12m and independent_msr_returned_payments_12m is zero.
        evidence_fields: [independent_ledger.credit_reason, independent_ledger.event_type, independent_ledger.posting_date, independent_ledger.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.independent_residency_id]
          action_bindings:
            independent_ledger.independent_residency_id: independent_residency_id
    measures: [independent_msr_period_past_due, independent_msr_late_fee_waivers_12m, independent_msr_returned_payments_12m]
    formula:
      when_not: independent_msr_period_past_due < late_fee_min_past_due
      late_fee_amount: max(late_fee_flat, round(independent_msr_period_past_due * late_fee_pct / 100, 2))

  - id: independent_payments_and_returns
    subject: [independent_payment, independent_payment_return, independent_service_fee_charge]
    rule: >-
      Payments are accepted by ACH autopay, one-time ACH, personal check, certified check, credit card or debit card, and each payment instrument is posted once under its own reference.
      A payment is applied to the oldest outstanding charge first, by billing period and then by posting date.
      A credit card payment carries a card_convenience fee of card_convenience_fee_pct percent of the payment amount, rounded to the cent half up and referencing the card payment entry; debit cards, ACH and checks carry no fee.
      When the bank returns a payment, the returned amount is reinstated referencing the returned payment entry, and a returned_payment fee of returned_payment_fee is charged referencing the same entry.
      Once independent_msr_returned_payments_12m reaches returned_payments_before_certified_funds, further payments on the residency are accepted only by certified check or ACH autopay until 365 days have passed since the latest return.
      Payments may be posted while the residency is in active, notice_given or vacated status; a payment toward a reservation is taken as the reservation deposit instead.
    eligibility:
      - id: payment_on_open_account
        applies_to: [independent_payment]
        kind: state
        condition: Payments may be posted while the residency is in active, notice_given or vacated status; a payment toward a reservation is taken as the reservation deposit instead.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given, vacated]
      - id: certified_funds_restriction
        applies_to: [independent_payment]
        kind: authorization
        condition: Once independent_msr_returned_payments_12m reaches returned_payments_before_certified_funds, further payments on the residency are accepted only by certified check or ACH autopay until 365 days have passed since the latest return.
        evidence_fields: [independent_ledger.event_type, independent_ledger.posting_date, independent_ledger.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.independent_residency_id]
          action_bindings:
            independent_ledger.independent_residency_id: independent_residency_id
      - id: return_once_per_payment
        applies_to: [independent_payment_return]
        kind: dedup
        condition: When the bank returns a payment, the returned amount is reinstated referencing the returned payment entry, and a returned_payment fee of returned_payment_fee is charged referencing the same entry.
        evidence_fields: [independent_ledger.source_entry_id, independent_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.source_entry_id]
          action_bindings:
            independent_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: independent_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [independent_payment_return]}
          distinct_fields: []
    measures: [independent_msr_returned_payments_12m]
    formula:
      card_fee_amount: round(amount * card_convenience_fee_pct / 100, 2)

  - id: independent_service_fees
    subject: [independent_service_fee_charge]
    rule: >-
      Scheduled service and amenity fees follow the apartment type's parameters and are posted under their fee code.
      A pet is registered only within max_pets and, for a dog, pet_weight_limit_lbs of the apartment type; registration posts pet_one_time_fee per pet, and pet_monthly_fee per pet is charged for each billing month in which the pet is registered, without proration.
      A storage unit is charged at storage_unit_monthly_fee per billing month only where storage_unit_included is false or a second unit is rented; covered parking is charged at covered_parking_monthly_fee per billing month for each space beyond covered_parking_included_spaces.
      Guest suite nights are posted one booking at a time of no more than guest_suite_max_consecutive_nights nights; nights are first drawn from guest_suite_included_nights_per_year as measured by independent_msr_guest_nights_calendar_year and posted at 0.00, and every further night is charged at guest_suite_nightly_rate.
      Key fob and pendant replacements are charged per item at key_fob_replacement_fee and pendant_replacement_fee.
      An after-hours lockout call is posted at 0.00 while independent_msr_lockouts_12m before the call is below included_lockouts_per_12m and at lockout_fee otherwise.
      The carpet_cleaning fee of the apartment type is charged once when the apartment is vacated, and an apartment_transfer fee equal to apartment_transfer_fee of the apartment type moved into is charged once per transfer.
      Service fees may be posted while the residency is in active, notice_given or vacated status.
      A service fee posted in error is reversed only through a billing_error credit referencing that fee entry.
    eligibility:
      - id: pet_limits
        applies_to: [independent_service_fee_charge]
        kind: caller_fact
        condition: A pet is registered only within max_pets and, for a dog, pet_weight_limit_lbs of the apartment type; registration posts pet_one_time_fee per pet, and pet_monthly_fee per pet is charged for each billing month in which the pet is registered, without proration.
        evidence_fields: [independent_ledger.fee_code, independent_ledger.quantity, independent_residencies.variant_name]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [independent_residencies.variant_name]
          action_bindings:
            independent_residencies.variant_name: variant_name
      - id: service_fee_on_open_residency
        applies_to: [independent_service_fee_charge]
        kind: state
        condition: Service fees may be posted while the residency is in active, notice_given or vacated status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given, vacated]
    measures: [independent_msr_guest_nights_calendar_year, independent_msr_lockouts_12m]
    params:
      per_tier:
        Independent Living Studio: {carpet_cleaning_fee: "=carpet_cleaning_fee", apartment_transfer_fee: "=apartment_transfer_fee", guest_suite_included_nights_per_year: "=guest_suite_included_nights_per_year", pet_monthly_fee: "=pet_monthly_fee", max_pets: "=max_pets", pet_weight_limit_lbs: "=pet_weight_limit_lbs", storage_unit_included: "=storage_unit_included", covered_parking_included_spaces: "=covered_parking_included_spaces"}
        Independent Living One-Bedroom: {carpet_cleaning_fee: "=carpet_cleaning_fee", apartment_transfer_fee: "=apartment_transfer_fee", guest_suite_included_nights_per_year: "=guest_suite_included_nights_per_year", pet_monthly_fee: "=pet_monthly_fee", max_pets: "=max_pets", pet_weight_limit_lbs: "=pet_weight_limit_lbs", storage_unit_included: "=storage_unit_included", covered_parking_included_spaces: "=covered_parking_included_spaces"}
        Independent Living One-Bedroom Deluxe: {carpet_cleaning_fee: "=carpet_cleaning_fee", apartment_transfer_fee: "=apartment_transfer_fee", guest_suite_included_nights_per_year: "=guest_suite_included_nights_per_year", pet_monthly_fee: "=pet_monthly_fee", max_pets: "=max_pets", pet_weight_limit_lbs: "=pet_weight_limit_lbs", storage_unit_included: "=storage_unit_included", covered_parking_included_spaces: "=covered_parking_included_spaces"}
        Independent Living Two-Bedroom: {carpet_cleaning_fee: "=carpet_cleaning_fee", apartment_transfer_fee: "=apartment_transfer_fee", guest_suite_included_nights_per_year: "=guest_suite_included_nights_per_year", pet_monthly_fee: "=pet_monthly_fee", max_pets: "=max_pets", pet_weight_limit_lbs: "=pet_weight_limit_lbs", storage_unit_included: "=storage_unit_included", covered_parking_included_spaces: "=covered_parking_included_spaces"}
        Independent Living Two-Bedroom Deluxe: {carpet_cleaning_fee: "=carpet_cleaning_fee", apartment_transfer_fee: "=apartment_transfer_fee", guest_suite_included_nights_per_year: "=guest_suite_included_nights_per_year", pet_monthly_fee: "=pet_monthly_fee", max_pets: "=max_pets", pet_weight_limit_lbs: "=pet_weight_limit_lbs", storage_unit_included: "=storage_unit_included", covered_parking_included_spaces: "=covered_parking_included_spaces"}
        Independent Living Cottage Home: {carpet_cleaning_fee: "=carpet_cleaning_fee", apartment_transfer_fee: "=apartment_transfer_fee", guest_suite_included_nights_per_year: "=guest_suite_included_nights_per_year", pet_monthly_fee: "=pet_monthly_fee", max_pets: "=max_pets", pet_weight_limit_lbs: "=pet_weight_limit_lbs", storage_unit_included: "=storage_unit_included", covered_parking_included_spaces: "=covered_parking_included_spaces"}

  - id: independent_move_out_notice
    subject: [independent_notice_record, independent_notice_withdraw]
    rule: >-
      A residency is terminated by the resident only through a written notice of termination signed on the resident's behalf; the desk registers the notice request with the intended vacate date the resident states and the resident signs it.
      The notice must be signed by the resident, or by a representative whose representative_authority on the customer profile is financial_poa, durable_poa or guardian; a healthcare_poa or an authorized_contact alone cannot give notice.
      The notice period is move_out_notice_days for a resident leaving Larkspur and internal_transfer_notice_days when the notice states a move to a Larkspur assisted living or memory care residence; the intended vacate date may be earlier than the end of the notice period, but fees still run as set by the fee end policy.
      A notice may be withdrawn only before the intended vacate date stated on it.
      The withdrawal window is counted in calendar days and closes at the end of the day before the intended vacate date, so a withdrawal signed on the intended vacate date itself is refused.
      After a withdrawal the residency continues unchanged as if no notice had been given, and a later departure needs a new notice with a new notice period.
    eligibility:
      - id: signer_authority
        applies_to: [independent_notice_record, independent_notice_withdraw]
        kind: authorization
        condition: The notice must be signed by the resident, or by a representative whose representative_authority on the customer profile is financial_poa, durable_poa or guardian; a healthcare_poa or an authorized_contact alone cannot give notice.
        evidence_fields: [customers.representative_authority, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: withdraw_before_vacate_date
        applies_to: [independent_notice_withdraw]
        kind: time
        condition: A notice may be withdrawn only before the intended vacate date stated on it.
        evidence_fields: [independent_residencies.intended_vacate_date, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the intended vacate date stated on it
          anchor_source: independent_residencies.intended_vacate_date
          relation: not_after
          duration_source: params.withdrawal_cutoff_days
          unit: calendar_days
          counting_rule: The withdrawal window is counted in calendar days and closes at the end of the day before the intended vacate date, so a withdrawal signed on the intended vacate date itself is refused.
          boundary: exclusive
    params:
      withdrawal_cutoff_days: 0
      per_tier:
        Independent Living Studio: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days"}
        Independent Living One-Bedroom: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days"}
        Independent Living One-Bedroom Deluxe: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days"}
        Independent Living Two-Bedroom: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days"}
        Independent Living Two-Bedroom Deluxe: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days"}
        Independent Living Cottage Home: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days"}

  - id: independent_fee_end_and_proration
    subject: [independent_vacate, independent_end_without_notice, independent_monthly_fee_charge, independent_credit]
    rule: >-
      When a residency ends, monthly fees run through a fee end date fixed by how it ended.
      After a resident notice the fee end date is the later of the vacate date and the notice end date, the notice end date being the notice date plus move_out_notice_days calendar days.
      After a notice stating a move to a Larkspur assisted living or memory care residence, and for an internal transfer recorded without notice, the fee end date is the later of the vacate date and the notice date plus internal_transfer_notice_days calendar days.
      On the death of the last occupant the fee end date is the later of the date belongings are removed (the vacate date) and the date of death plus post_death_fee_days calendar days, the date of death being date_of_death on the customer profile.
      After a discharge for nonpayment the fee end date is the vacate date.
      Fees are charged through the fee end date inclusive. Where the fee end date falls before the last day of a month already billed, the days after it are returned as a move_out_proration credit referencing that month's full_month charge; where it falls in a month not yet billed, a prorated_move_out charge covers the first of that month through the fee end date.
      An ending recorded as death requires date_of_death on the customer profile, and an ending recorded as a transfer requires the customer's Larkspur assisted living or memory care residency to be active; a family member's statement alone is not enough for either.
      The second person fee ends on the same fee end date unless the second occupant left earlier.
      When only one of two occupants dies or leaves, the residency does not end; the occupancy changes to single under the occupancy policy.
    eligibility:
      - id: death_or_transfer_on_record
        applies_to: [independent_end_without_notice]
        kind: authorization
        condition: An ending recorded as death requires date_of_death on the customer profile, and an ending recorded as a transfer requires the customer's Larkspur assisted living or memory care residency to be active; a family member's statement alone is not enough for either.
        evidence_fields: [customers.date_of_death, assisted_residencies.status, memory_residencies.status, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params:
      per_tier:
        Independent Living Studio: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days", post_death_fee_days: "=post_death_fee_days"}
        Independent Living One-Bedroom: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days", post_death_fee_days: "=post_death_fee_days"}
        Independent Living One-Bedroom Deluxe: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days", post_death_fee_days: "=post_death_fee_days"}
        Independent Living Two-Bedroom: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days", post_death_fee_days: "=post_death_fee_days"}
        Independent Living Two-Bedroom Deluxe: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days", post_death_fee_days: "=post_death_fee_days"}
        Independent Living Cottage Home: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days", post_death_fee_days: "=post_death_fee_days"}
    formula:
      proration_credit: round(monthly_service_fee * days_billed / days_in_period, 2)

  - id: independent_final_statement
    subject: [independent_account_close, independent_credit_balance_refund]
    rule: >-
      After the apartment is vacated a final statement is issued no later than final_statement_days calendar days after the vacate date, showing every charge through the fee end date, the carpet cleaning fee and every credit.
      A credit balance shown on the final statement is refunded by check or ACH in one refund payable to the resident, or to the resident's estate when date_of_death is on the customer profile.
      A credit balance refund may be issued only while the residency is in vacated status; a credit balance on a continuing residency is carried forward to the next billing month instead.
      The residency file may be closed only when account_balance and reservation_deposit_held are both 0.00.
      An unpaid balance on a vacated residency stays open for collection and is never written off by the desk.
    eligibility:
      - id: refund_only_after_vacate
        applies_to: [independent_credit_balance_refund]
        kind: state
        condition: A credit balance refund may be issued only while the residency is in vacated status; a credit balance on a continuing residency is carried forward to the next billing month instead.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [vacated]
      - id: zero_balances_to_close
        applies_to: [independent_account_close]
        kind: authorization
        condition: The residency file may be closed only when account_balance and reservation_deposit_held are both 0.00.
        evidence_fields: [independent_residencies.account_balance, independent_residencies.reservation_deposit_held, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
    params:
      per_tier:
        Independent Living Studio: {final_statement_days: "=final_statement_days"}
        Independent Living One-Bedroom: {final_statement_days: "=final_statement_days"}
        Independent Living One-Bedroom Deluxe: {final_statement_days: "=final_statement_days"}
        Independent Living Two-Bedroom: {final_statement_days: "=final_statement_days"}
        Independent Living Two-Bedroom Deluxe: {final_statement_days: "=final_statement_days"}
        Independent Living Cottage Home: {final_statement_days: "=final_statement_days"}

  - id: independent_occupancy_and_transfer
    subject: [independent_occupancy_change, independent_apartment_transfer]
    rule: >-
      A second occupant may be added only where max_occupants of the apartment type is 2 and the second occupant is at least second_occupant_min_age years old on the day they move in.
      From the day a second occupant moves in, the second_person_fee of the apartment type is billed (prorated for the first month) and community_fee_second_resident is charged each time a second occupant moves in.
      When a second occupant leaves or dies, the occupancy becomes single and the second person fee ends on the day they leave or the date of death, with the days after it returned as a move_out_proration credit.
      An apartment transfer is made only at the resident's signed request to a vacant apartment in the same community, and only while the residency is active.
      The monthly service fee for the new apartment is base_monthly_fee of the new apartment type published on the transfer date, effective on the day the resident takes possession, and an apartment_transfer fee of the type moved into is charged; the new rate guarantee does not restart.
      A transfer to a Studio is possible only at single occupancy.
      Occupancy changes may be recorded while the residency is in active or notice_given status.
    eligibility:
      - id: second_occupant_allowed
        applies_to: [independent_occupancy_change]
        kind: caller_fact
        condition: A second occupant may be added only where max_occupants of the apartment type is 2 and the second occupant is at least second_occupant_min_age years old on the day they move in.
        evidence_fields: [independent_residencies.variant_name, independent_residencies.second_occupant_name]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [independent_residencies.variant_name]
          action_bindings:
            independent_residencies.variant_name: variant_name
      - id: transfer_only_when_active
        applies_to: [independent_apartment_transfer]
        kind: state
        condition: An apartment transfer is made only at the resident's signed request to a vacant apartment in the same community, and only while the residency is active.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active]
      - id: occupancy_on_live_residency
        applies_to: [independent_occupancy_change]
        kind: state
        condition: Occupancy changes may be recorded while the residency is in active or notice_given status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given]
    params:
      per_tier:
        Independent Living Studio: {max_occupants: "=max_occupants", second_person_fee: "=second_person_fee", community_fee_second_resident: "=community_fee_second_resident", apartment_transfer_fee: "=apartment_transfer_fee"}
        Independent Living One-Bedroom: {max_occupants: "=max_occupants", second_person_fee: "=second_person_fee", community_fee_second_resident: "=community_fee_second_resident", apartment_transfer_fee: "=apartment_transfer_fee"}
        Independent Living One-Bedroom Deluxe: {max_occupants: "=max_occupants", second_person_fee: "=second_person_fee", community_fee_second_resident: "=community_fee_second_resident", apartment_transfer_fee: "=apartment_transfer_fee"}
        Independent Living Two-Bedroom: {max_occupants: "=max_occupants", second_person_fee: "=second_person_fee", community_fee_second_resident: "=community_fee_second_resident", apartment_transfer_fee: "=apartment_transfer_fee"}
        Independent Living Two-Bedroom Deluxe: {max_occupants: "=max_occupants", second_person_fee: "=second_person_fee", community_fee_second_resident: "=community_fee_second_resident", apartment_transfer_fee: "=apartment_transfer_fee"}
        Independent Living Cottage Home: {max_occupants: "=max_occupants", second_person_fee: "=second_person_fee", community_fee_second_resident: "=community_fee_second_resident", apartment_transfer_fee: "=apartment_transfer_fee"}

  - id: independent_billing_corrections
    subject: [independent_credit]
    rule: >-
      A charge posted in error - a wrong amount, a wrong apartment type, a duplicate posting or a fee that does not apply - is corrected only by a billing_error credit referencing the exact charge entry being corrected; charges are never deleted.
      The credit may not exceed the amount of that charge entry less any credits already posted against it, and the correct charge, where one is due, is posted again as a new entry.
      Each charge entry receives at most one billing_error credit.
      A disputed charge that the records show was correctly posted under the policies of this charter is not credited.
      A respite_conversion credit is posted only as the consequence of a converted Larkspur trial or respite stay, for the amount the respite charter fixes, carrying the respite stay it comes from; each respite stay yields at most one conversion credit.
    eligibility:
      - id: one_correction_per_charge
        applies_to: [independent_credit]
        kind: dedup
        condition: Each charge entry receives at most one billing_error credit.
        evidence_fields: [independent_ledger.source_entry_id, independent_ledger.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.source_entry_id]
          action_bindings:
            independent_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: independent_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {credit_reason: [billing_error]}
          distinct_fields: []

  - id: independent_referral_credit
    subject: [independent_credit]
    rule: >-
      A resident who is named as referred_by_customer_id on another customer's independent living residency earns a referral_credit of referral_credit_amount on the referrer's own residency.
      The credit is granted only after the referred resident has been in residence for referral_credit_qualifying_days.
      The qualifying period is counted in calendar days from the referred resident's move-in date, the move-in date being day 0, and the credit may be granted on the day the count reaches referral_credit_qualifying_days or later.
      The referrer's residency must be active when the credit is granted, and a referrer receives no more than referral_credits_per_12m_cap referral credits within independent_msr_referral_credits_12m.
      Each referred residency earns one referral credit only, referenced by referred_residency_id; a referral named after the referred resident's reservation was opened does not qualify.
    eligibility:
      - id: referred_resident_qualified
        applies_to: [independent_credit]
        kind: time
        condition: The credit is granted only after the referred resident has been in residence for referral_credit_qualifying_days.
        evidence_fields: [independent_residencies.move_in_date, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: referred_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the referred resident has been in residence
          anchor_source: independent_residencies.move_in_date
          relation: not_before
          duration_source: variants.referral_credit_qualifying_days
          unit: calendar_days
          counting_rule: The qualifying period is counted in calendar days from the referred resident's move-in date, the move-in date being day 0, and the credit may be granted on the day the count reaches referral_credit_qualifying_days or later.
          boundary: inclusive
      - id: one_credit_per_referral
        applies_to: [independent_credit]
        kind: dedup
        condition: Each referred residency earns one referral credit only, referenced by referred_residency_id; a referral named after the referred resident's reservation was opened does not qualify.
        evidence_fields: [independent_ledger.referred_residency_id, independent_ledger.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.referred_residency_id]
          action_bindings:
            independent_ledger.referred_residency_id: referred_residency_id
        dedup_contract:
          table: independent_ledger
          mode: separate_record
          object_bindings: {referred_residency_id: referred_residency_id}
          duplicate_filters: {credit_reason: [referral_credit]}
          distinct_fields: []
    measures: [independent_msr_referral_credits_12m]

  - id: independent_nonpayment_discharge
    subject: [independent_end_without_notice]
    rule: >-
      Larkspur may end a residency for nonpayment only after a monthly fee has remained past due for at least past_due_days_before_discharge_notice and a written discharge notice has been issued by the community's executive director.
      The residency may be ended for nonpayment only once discharge_notice_days have passed since the discharge notice was issued.
      The discharge period is counted in calendar days from the notice date recorded on the residency, and the residency may be ended on the notice date plus discharge_notice_days calendar days or later.
      Payment in full of the past-due amount before the end of the discharge period cancels the discharge, and the desk never issues or cancels a discharge notice itself; a request to stop or delay a discharge is outside the desk's authority.
    eligibility:
      - id: discharge_period_elapsed
        applies_to: [independent_end_without_notice]
        kind: time
        condition: The residency may be ended for nonpayment only once discharge_notice_days have passed since the discharge notice was issued.
        evidence_fields: [independent_residencies.notice_date, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the discharge notice was issued
          anchor_source: independent_residencies.notice_date
          relation: not_before
          duration_source: variants.discharge_notice_days
          unit: calendar_days
          counting_rule: The discharge period is counted in calendar days from the notice date recorded on the residency, and the residency may be ended on the notice date plus discharge_notice_days calendar days or later.
          boundary: inclusive
