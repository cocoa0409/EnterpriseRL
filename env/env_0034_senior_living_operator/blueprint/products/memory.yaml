events:
  - type: memory_admission_create
    target: memory_residencies
    mutation: create
    meaning: A memory care admission agreement is signed by the resident's legal representative after the pre-admission assessment, opening the residency in pending_admission status.
    grain: One row per admission agreement.
    fields:
      memory_residency_id: Reference number of the residency.
      customer_id: The resident.
      variant_name: Suite type and care program admitted, verbatim tier name.
      community_name: Larkspur community.
      suite_number: Suite number on the agreement.
      admission_source: Where the resident is coming from.
      admission_date: Date the admission agreement was signed.
      planned_move_in_date: Planned move-in date.
      care_points: Score of the pre-admission memory care assessment.
      monthly_rate: Contracted monthly rate.
      ltc_direct_billing: Whether a long-term care insurer is billed directly.
    triggers:
      - event: memory:memory_assessment_record
        map: {memory_residency_id: memory_residency_id, customer_id: customer_id, assessment_type: pre_admission, care_points: care_points}
  - type: memory_move_in
    target: memory_residencies
    mutation: {transition: {from: pending_admission, to: active}}
    meaning: The resident moves into the memory care suite.
    grain: One row per residency.
    fields:
      memory_residency_id: The residency.
      move_in_date: Move-in date; the monthly rate accrues from it.
      rate_effective_date: Set to the move-in date.
      program_effective_date: Set to the move-in date.
      admission_source: Admission source confirmed at move-in.
    triggers:
      - event: memory:memory_rate_charge
        map: {memory_residency_id: memory_residency_id, charge_basis: prorated_move_in}
      - event: memory:memory_community_fee_charge
        when: {admission_source: {not: [larkspur_independent, larkspur_assisted]}}
        map: {memory_residency_id: memory_residency_id}
  - type: memory_admission_withdraw
    target: memory_residencies
    mutation: {transition: {from: pending_admission, to: cancelled}}
    meaning: The admission is withdrawn before move-in.
    grain: One row per residency.
    fields:
      memory_residency_id: The residency.
      termination_reason: Fixed to admission_withdrawn.
      closed_date: Date of the withdrawal.
    triggers: []
  - type: memory_leave_start
    target: memory_residencies
    mutation: {transition: {from: active, to: on_leave}}
    meaning: A temporary absence begins.
    grain: One row per absence.
    fields:
      memory_residency_id: The residency.
      absence_start_date: Date the resident left.
      absence_reason: hospital, rehab_facility or family_visit.
      absence_return_date: Cleared to empty at the start of an absence.
    triggers: []
  - type: memory_leave_return
    target: memory_residencies
    mutation: {transition: {from: on_leave, to: active}}
    meaning: The resident returns from an absence.
    grain: One row per absence.
    fields:
      memory_residency_id: The residency.
      absence_return_date: Date of return.
    triggers: []
  - type: memory_notice_record
    target: memory_residencies
    mutation: {transition: {from: active, to: notice_given}}
    meaning: The signed written notice of termination is recorded.
    grain: One row per notice.
    fields:
      memory_residency_id: The residency.
      notice_date: Date signed.
      intended_vacate_date: Intended vacate date on the notice.
      termination_reason: resident_notice.
    triggers: []
  - type: memory_notice_withdraw
    target: memory_residencies
    mutation: {transition: {from: notice_given, to: active}}
    meaning: The notice is withdrawn.
    grain: One row per withdrawal.
    fields:
      memory_residency_id: The residency.
      notice_date: Cleared to empty.
      intended_vacate_date: Cleared to empty.
      termination_reason: Reset to none.
    triggers: []
  - type: memory_vacate
    target: memory_residencies
    mutation: {transition: {from: notice_given, to: vacated}}
    meaning: The suite is surrendered after notice.
    grain: One row per residency.
    fields:
      memory_residency_id: The residency.
      vacate_date: Date the suite was surrendered.
    triggers: []
  - type: memory_end_without_notice
    target: memory_residencies
    mutation: {transition: [{from: active, to: vacated}, {from: on_leave, to: vacated}]}
    meaning: The residency ends without notice - death or a discharge.
    grain: One row per residency.
    fields:
      memory_residency_id: The residency.
      vacate_date: Date belongings were removed.
      notice_date: Date of the death notification or the discharge notice.
      termination_reason: death, discharge_needs_exceed or nonpayment_discharge.
    triggers: []
  - type: memory_account_close
    target: memory_residencies
    mutation: {transition: {from: vacated, to: closed}}
    meaning: The final statement is settled and the file closed.
    grain: One row per residency.
    fields:
      memory_residency_id: The residency.
      closed_date: Date closed.
    triggers: []
  - type: memory_program_change
    target: memory_residencies
    mutation: update
    meaning: The care program, and with it the tier and monthly rate, changes after a reassessment.
    grain: One row per program change.
    fields:
      memory_residency_id: The residency.
      variant_name: New tier (same suite type, new care program).
      care_points: Score of the assessment behind the change.
      monthly_rate: Monthly rate of the new tier.
      program_effective_date: Date the new program takes effect.
    triggers: []
  - type: memory_suite_change
    target: memory_residencies
    mutation: update
    meaning: The resident moves, at the family's request, to another suite type within the same care program.
    grain: One row per suite change.
    fields:
      memory_residency_id: The residency.
      variant_name: New tier (new suite type, same care program).
      suite_number: New suite number.
      monthly_rate: Monthly rate of the new tier.
      rate_effective_date: Date of possession of the new suite.
    triggers:
      - event: memory:memory_addon_charge
        map: {memory_residency_id: memory_residency_id, addon_code: suite_change}
  - type: memory_assessment_record
    target: memory_assessments
    meaning: A memory care nurse completes a cognitive and functional assessment, and where a new care program is indicated the written program notice is issued with it.
    grain: One row per assessment performed.
    distinguish_by: [assessment_date, assessment_type]
    fields:
      memory_residency_id: The residency.
      customer_id: The resident.
      assessment_date: Date completed.
      assessment_type: pre_admission, post_move_in, routine, change_of_condition or post_hospital.
      care_points: Score.
      indicated_program: essential, enhanced or advanced.
      notice_date: Date the written program notice was issued; empty when no change is indicated.
      notice_effective_date: Effective date stated on the program notice; empty when no change is indicated.
    triggers: []
  - type: memory_rate_charge
    target: memory_ledger
    meaning: The all-inclusive monthly rate is charged for a span of days at one tier.
    grain: One row per residency per tier billed per continuous span within a billing period.
    distinguish_by: [billing_period, tier_billed, service_from_date]
    fields:
      memory_residency_id: The residency.
      customer_id: The resident.
      amount: Charge, positive, USD.
      posting_date: Date posted.
      billing_period: Calendar month, YYYY-MM.
      charge_basis: full_month, prorated_move_in, prorated_move_out, prorated_program_change or prorated_rate_change.
      tier_billed: Tier whose rate is charged, verbatim tier name.
      service_from_date: First day covered.
      service_to_date: Last day covered.
      days_billed: Days covered, inclusive.
      days_in_period: Days in the calendar month.
    account: resident_balance
    direction: in
    triggers: []
  - type: memory_addon_charge
    target: memory_ledger
    meaning: A memory care add-on or fee is charged.
    grain: One row per add-on code per billing period per service date.
    distinguish_by: [addon_code, billing_period, service_date]
    fields:
      memory_residency_id: The residency.
      customer_id: The resident.
      amount: Charge, positive, USD.
      posting_date: Date posted.
      addon_code: Which add-on or fee.
      billing_period: Calendar month, YYYY-MM.
      service_date: Service date, or the first of the month for monthly add-ons.
      quantity: Units (hours, meals).
      source_entry_id: The returned payment entry for a returned_payment fee; empty otherwise.
    account: resident_balance
    direction: in
    triggers: []
  - type: memory_community_fee_charge
    target: memory_ledger
    meaning: The one-time community fee is charged at move-in.
    grain: One row per admission.
    distinguish_by: [posting_date]
    fields:
      memory_residency_id: The residency.
      customer_id: The resident.
      amount: Community fee, positive, USD.
      posting_date: Date posted.
    account: resident_balance
    direction: in
    triggers: []
  - type: memory_late_fee_charge
    target: memory_ledger
    meaning: A late fee is assessed for an unpaid billing period.
    grain: One row per residency per billing period.
    distinguish_by: [billing_period]
    fields:
      memory_residency_id: The residency.
      customer_id: The resident.
      amount: Late fee, positive, USD.
      posting_date: Date assessed.
      billing_period: Billing period past due.
    account: resident_balance
    direction: in
    triggers: []
  - type: memory_payment
    target: memory_ledger
    meaning: A payment is received from the family, the representative or a long-term care insurer.
    grain: One row per payment instrument.
    distinguish_by: [payment_reference]
    fields:
      memory_residency_id: The residency.
      customer_id: The resident.
      amount: Payment, positive, USD.
      posting_date: Date received.
      payment_reference: Instrument reference.
      payment_method: Instrument type.
      payer_type: resident_or_family or ltc_insurer.
    account: resident_balance
    direction: out
    triggers: []
  - type: memory_payment_return
    target: memory_ledger
    meaning: A posted payment is returned unpaid and reinstated.
    grain: One row per returned payment entry.
    distinguish_by: [source_entry_id]
    fields:
      memory_residency_id: The residency.
      customer_id: The resident.
      amount: Returned amount, positive, USD.
      posting_date: Date posted.
      source_entry_id: The payment entry returned.
    account: resident_balance
    direction: in
    triggers:
      - event: memory:memory_addon_charge
        map: {memory_residency_id: memory_residency_id, addon_code: returned_payment, source_entry_id: source_entry_id}
  - type: memory_credit
    target: memory_ledger
    meaning: A credit reduces the amount owed - billing corrections, move-out or program-change proration, absence credits, entrance plan discounts or a respite conversion credit.
    grain: One row per credit reason per source entry per absence or source stay.
    distinguish_by: [credit_reason, source_entry_id, absence_start_date, respite_stay_id]
    fields:
      memory_residency_id: The residency.
      customer_id: The resident.
      amount: Credit, positive, USD.
      posting_date: Date posted.
      credit_reason: billing_error, move_out_proration, program_change_proration, absence_credit, entrance_plan_discount or respite_conversion.
      source_entry_id: The charge credited; empty for a respite conversion credit.
      billing_period: Billing period, YYYY-MM.
      days_billed: Days credited.
      days_in_period: Days in the month.
      absence_start_date: Absence start date for absence credits; empty otherwise.
      respite_stay_id: Respite stay converted, for conversion credits; empty otherwise.
      entrance_agreement_id: Entrance fee agreement applied, for entrance plan discounts; empty otherwise.
    account: resident_balance
    direction: out
    triggers: []
  - type: memory_credit_balance_refund
    target: memory_ledger
    meaning: A credit balance is refunded to the party who overpaid.
    grain: One row per refund instrument.
    distinguish_by: [payment_reference]
    fields:
      memory_residency_id: The residency.
      customer_id: The resident.
      amount: Refund, positive, USD.
      posting_date: Date issued.
      payment_reference: Refund check or ACH trace number.
      payment_method: check or ach_one_time.
      payer_type: resident_or_family or ltc_insurer.
    account: resident_balance
    direction: in
    triggers: []

measures:
  - id: memory_msr_days_since_last_assessment
    window: From the most recent memory_assessment_record assessment_date on the residency to the handling date.
    measure: Calendar days elapsed, handling date minus assessment date.
  - id: memory_msr_absence_midnights
    window: One continuous absence, absence_start_date to absence_return_date (or the handling date while on leave).
    measure: Midnights away, return date minus start date in calendar days.
  - id: memory_msr_one_to_one_hours_in_month
    window: The calendar month of the shift's service date.
    measure: Sum of quantity over memory_addon_charge entries with addon_code one_to_one_companion on the residency, including hours posted at 0.00 as included.
  - id: memory_msr_period_past_due
    window: The single billing period assessed, at the end of the last grace day.
    measure: Monthly rate and monthly add-on charges of that billing_period less payments and credits applied oldest first.

policies:
  - id: memory_agg_multi_holding
    subject: [memory_admission_create]
    rule: >-
      A customer holds at most one memory care residency at a time.
      A new admission may be opened only when the customer has no other memory care residency in pending_admission, active, on_leave or notice_given status.
      A memory care admission may coexist with an assisted living or independent living residency in active, on_leave or notice_given status only when the admission_source is larkspur_assisted or larkspur_independent, which marks a move from that Larkspur residence; the earlier residency then ends under its own charter.
    eligibility:
      - id: no_open_memory_residency
        applies_to: [memory_admission_create]
        kind: dedup
        condition: A new admission may be opened only when the customer has no other memory care residency in pending_admission, active, on_leave or notice_given status.
        evidence_fields: [memory_residencies.customer_id, memory_residencies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_residencies.customer_id]
          action_bindings:
            memory_residencies.customer_id: customer_id
        dedup_contract:
          table: memory_residencies
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_admission, active, on_leave, notice_given]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: memory_admission_eligibility
    subject: [memory_admission_create, memory_move_in, memory_admission_withdraw]
    rule: >-
      Memory care admission requires, where dementia_diagnosis_required is true, a physician's written diagnosis of dementia or a related cognitive disorder and a physician's admission order dated no more than physician_order_validity_days before move-in, and the resident must be at least min_resident_age years old on the planned move-in date.
      The admission agreement, any withdrawal and any notice must be signed by a representative whose representative_authority is financial_poa, durable_poa or guardian, because a memory care resident is presumed unable to contract alone.
      The care program is the one whose care_points_min to care_points_max band contains the pre-admission assessment score, and the tier is that program in the suite type the family chooses, subject to max_suite_occupants.
      Move-in may take place only within pre_admission_assessment_validity_days after the pre-admission assessment.
      The validity period is counted in calendar days from the assessment date, the assessment date being day 0, and move-in on the last day is still valid.
      Nothing is charged for a withdrawn admission, because the monthly rate and community fee begin at move-in.
    eligibility:
      - id: representative_signs
        applies_to: [memory_admission_create, memory_admission_withdraw]
        kind: authorization
        condition: The admission agreement, any withdrawal and any notice must be signed by a representative whose representative_authority is financial_poa, durable_poa or guardian, because a memory care resident is presumed unable to contract alone.
        evidence_fields: [customers.representative_authority, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: assessment_valid_at_move_in
        applies_to: [memory_move_in]
        kind: time
        condition: Move-in may take place only within pre_admission_assessment_validity_days after the pre-admission assessment.
        evidence_fields: [memory_assessments.assessment_date, memory_assessments.memory_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_assessments.memory_residency_id]
          action_bindings:
            memory_assessments.memory_residency_id: memory_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the pre-admission assessment
          anchor_source: memory_assessments.assessment_date
          relation: not_after
          duration_source: variants.pre_admission_assessment_validity_days
          unit: calendar_days
          counting_rule: The validity period is counted in calendar days from the assessment date, the assessment date being day 0, and move-in on the last day is still valid.
          boundary: inclusive

  - id: memory_program_and_reassessment
    subject: [memory_assessment_record, memory_program_change, memory_rate_charge, memory_credit]
    rule: >-
      Each tier is one suite_type combined with one care_program. The care program billed is always the program whose band contains the most recent assessment score once its effective date has passed; the suite type does not change with the program, so a program change moves the residency to the tier with the same suite_type and the new care_program.
      A post_move_in reassessment is completed within post_move_in_reassessment_days of move-in, a routine reassessment once memory_msr_days_since_last_assessment reaches routine_reassessment_interval_days of the tier, and a post_hospital reassessment within post_hospital_reassessment_days of return from any hospital absence.
      Where a new program is indicated, the written program notice is issued with the assessment record no later than program_notice_issue_days after it.
      A move to a higher program found at a change_of_condition or post_hospital reassessment takes effect on the assessment date; one found at a routine or post_move_in reassessment may be recorded only once program_increase_notice_days have passed since the written program notice was issued.
      The notice period is counted in calendar days from the notice date, the notice date being day 0, and the change takes effect on the day the count reaches program_increase_notice_days.
      A move to a lower program takes effect on the first day of the month following the assessment.
      A mid-month change splits the month's rate charge at the effective date; days already billed at the higher rate are returned as a program_change_proration credit referencing the original charge, each amount rounded to the cent half up.
      A score above care_points_max of the advanced program means needs exceed what Larkspur memory care provides and leads to a discharge_needs_exceed ending.
      Assessments and program changes may be recorded only while the residency is in pending_admission, active, on_leave or notice_given status.
    eligibility:
      - id: routine_increase_notice_elapsed
        applies_to: [memory_program_change]
        kind: time
        condition: one found at a routine or post_move_in reassessment may be recorded only once program_increase_notice_days have passed since the written program notice was issued.
        evidence_fields: [memory_assessments.notice_date, memory_assessments.memory_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_assessments.memory_residency_id]
          action_bindings:
            memory_assessments.memory_residency_id: memory_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the written program notice was issued
          anchor_source: memory_assessments.notice_date
          relation: not_before
          duration_source: variants.program_increase_notice_days
          unit: calendar_days
          counting_rule: The notice period is counted in calendar days from the notice date, the notice date being day 0, and the change takes effect on the day the count reaches program_increase_notice_days.
          boundary: inclusive
      - id: assessment_on_open_residency
        applies_to: [memory_assessment_record, memory_program_change]
        kind: state
        condition: Assessments and program changes may be recorded only while the residency is in pending_admission, active, on_leave or notice_given status.
        evidence_fields: [memory_residencies.status, memory_residencies.memory_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_residencies.memory_residency_id]
          action_bindings:
            memory_residencies.memory_residency_id: memory_residency_id
        state_contract:
          field: memory_residencies.status
          allowed: [pending_admission, active, on_leave, notice_given]
    measures: [memory_msr_days_since_last_assessment]
    params:
      per_tier:
        Memory Care Companion Suite with Essential Care: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", routine_reassessment_interval_days: "=routine_reassessment_interval_days", monthly_rate: "=monthly_rate"}
        Memory Care Companion Suite with Enhanced Care: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", routine_reassessment_interval_days: "=routine_reassessment_interval_days", monthly_rate: "=monthly_rate"}
        Memory Care Private Suite with Essential Care: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", routine_reassessment_interval_days: "=routine_reassessment_interval_days", monthly_rate: "=monthly_rate"}
        Memory Care Private Suite with Enhanced Care: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", routine_reassessment_interval_days: "=routine_reassessment_interval_days", monthly_rate: "=monthly_rate"}
        Memory Care Private Suite with Advanced Care: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", routine_reassessment_interval_days: "=routine_reassessment_interval_days", monthly_rate: "=monthly_rate"}
        Memory Care Deluxe Suite with Advanced Care: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", routine_reassessment_interval_days: "=routine_reassessment_interval_days", monthly_rate: "=monthly_rate"}
    formula:
      prorated_rate: round(monthly_rate * days_billed / days_in_period, 2)

  - id: memory_monthly_billing
    subject: [memory_rate_charge, memory_community_fee_charge]
    rule: >-
      The all-inclusive monthly_rate of the tier billed is charged in advance on fee_due_day for the whole calendar month; the move-in month, the month of a program, suite or rate change and the month fees end are prorated by actual days in the month, counted inclusive of both ends and rounded once to the cent half up.
      The community fee is charged once at move-in at community_fee, except that no community fee is charged where community_fee_waived_internal_transfer is true and the admission_source is larkspur_independent or larkspur_assisted.
      Monthly rate and community fee charges may be posted only while the residency is in active, on_leave or notice_given status.
    eligibility:
      - id: billing_on_live_residency
        applies_to: [memory_rate_charge, memory_community_fee_charge]
        kind: state
        condition: Monthly rate and community fee charges may be posted only while the residency is in active, on_leave or notice_given status.
        evidence_fields: [memory_residencies.status, memory_residencies.memory_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_residencies.memory_residency_id]
          action_bindings:
            memory_residencies.memory_residency_id: memory_residency_id
        state_contract:
          field: memory_residencies.status
          allowed: [active, on_leave, notice_given]

  - id: memory_care_addons
    subject: [memory_addon_charge]
    rule: >-
      Add-ons follow the tier billed: incontinence_supplies_fee monthly where incontinence_supplies_included is false; insulin_management_fee, behavioral_support_fee and two_person_assist_fee monthly where the care plan requires them and the tier's fee is not 0.00.
      One-to-one companion care is booked in shifts of at least one_to_one_minimum_hours_per_shift hours; hours within one_to_one_included_hours_per_month in the calendar month by memory_msr_one_to_one_hours_in_month are posted at 0.00 and further hours at one_to_one_companion_hourly_rate.
      Escorts to outside medical appointments are charged at escort_to_appointments_hourly_fee per hour with escort_minimum_hours minimum, guest meals at guest_meal_fee, ltc_direct_billing_fee monthly while ltc_direct_billing is true, suite_change_fee once per family-requested suite change and returned_payment_fee once per returned payment.
      Medication management and hospice coordination are never charged where medication_management_included and hospice_coordination_included are true.
      Add-on charges may be posted only while the residency is in active, on_leave or notice_given status.
    eligibility:
      - id: addon_on_live_residency
        applies_to: [memory_addon_charge]
        kind: state
        condition: Add-on charges may be posted only while the residency is in active, on_leave or notice_given status.
        evidence_fields: [memory_residencies.status, memory_residencies.memory_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_residencies.memory_residency_id]
          action_bindings:
            memory_residencies.memory_residency_id: memory_residency_id
        state_contract:
          field: memory_residencies.status
          allowed: [active, on_leave, notice_given]
    measures: [memory_msr_one_to_one_hours_in_month]
    params:
      per_tier:
        Memory Care Companion Suite with Essential Care: {incontinence_supplies_fee: "=incontinence_supplies_fee", one_to_one_included_hours_per_month: "=one_to_one_included_hours_per_month", insulin_management_fee: "=insulin_management_fee", behavioral_support_fee: "=behavioral_support_fee", two_person_assist_fee: "=two_person_assist_fee"}
        Memory Care Companion Suite with Enhanced Care: {incontinence_supplies_fee: "=incontinence_supplies_fee", one_to_one_included_hours_per_month: "=one_to_one_included_hours_per_month", insulin_management_fee: "=insulin_management_fee", behavioral_support_fee: "=behavioral_support_fee", two_person_assist_fee: "=two_person_assist_fee"}
        Memory Care Private Suite with Essential Care: {incontinence_supplies_fee: "=incontinence_supplies_fee", one_to_one_included_hours_per_month: "=one_to_one_included_hours_per_month", insulin_management_fee: "=insulin_management_fee", behavioral_support_fee: "=behavioral_support_fee", two_person_assist_fee: "=two_person_assist_fee"}
        Memory Care Private Suite with Enhanced Care: {incontinence_supplies_fee: "=incontinence_supplies_fee", one_to_one_included_hours_per_month: "=one_to_one_included_hours_per_month", insulin_management_fee: "=insulin_management_fee", behavioral_support_fee: "=behavioral_support_fee", two_person_assist_fee: "=two_person_assist_fee"}
        Memory Care Private Suite with Advanced Care: {incontinence_supplies_fee: "=incontinence_supplies_fee", one_to_one_included_hours_per_month: "=one_to_one_included_hours_per_month", insulin_management_fee: "=insulin_management_fee", behavioral_support_fee: "=behavioral_support_fee", two_person_assist_fee: "=two_person_assist_fee"}
        Memory Care Deluxe Suite with Advanced Care: {incontinence_supplies_fee: "=incontinence_supplies_fee", one_to_one_included_hours_per_month: "=one_to_one_included_hours_per_month", insulin_management_fee: "=insulin_management_fee", behavioral_support_fee: "=behavioral_support_fee", two_person_assist_fee: "=two_person_assist_fee"}

  - id: memory_absence
    subject: [memory_leave_start, memory_leave_return, memory_credit]
    rule: >-
      A temporary absence is recorded with its start date and reason and the suite is held while the monthly rate continues.
      After return, the credited days are memory_msr_absence_midnights less absence_credit_after_days, never below zero and never above absence_credit_max_days, each credited at absence_credit_pct percent of the daily monthly rate (monthly rate divided by days in the month), one absence_credit per absence per billing month rounded to the cent half up.
      An absence credit is posted at most once per absence per billing month.
      When an absence reaches max_leave_days_before_review midnights the executive director decides whether the suite continues to be held.
    eligibility:
      - id: one_absence_credit_per_month
        applies_to: [memory_credit]
        kind: dedup
        condition: An absence credit is posted at most once per absence per billing month.
        evidence_fields: [memory_ledger.memory_residency_id, memory_ledger.absence_start_date, memory_ledger.billing_period, memory_ledger.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_ledger.memory_residency_id, memory_ledger.absence_start_date, memory_ledger.billing_period]
          action_bindings:
            memory_ledger.memory_residency_id: memory_residency_id
            memory_ledger.absence_start_date: absence_start_date
            memory_ledger.billing_period: billing_period
        dedup_contract:
          table: memory_ledger
          mode: separate_record
          object_bindings: {memory_residency_id: memory_residency_id, absence_start_date: absence_start_date, billing_period: billing_period}
          duplicate_filters: {credit_reason: [absence_credit]}
          distinct_fields: []
    measures: [memory_msr_absence_midnights]
    formula:
      credited_days: min(max(memory_msr_absence_midnights - absence_credit_after_days, 0), absence_credit_max_days)
      absence_credit_amount: round(monthly_rate / days_in_period * days_billed * absence_credit_pct / 100, 2)

  - id: memory_move_out
    subject: [memory_notice_record, memory_notice_withdraw, memory_vacate, memory_end_without_notice, memory_account_close, memory_credit_balance_refund]
    rule: >-
      A notice of termination must be signed by a representative whose representative_authority is financial_poa, durable_poa or guardian.
      The monthly rate runs through the fee end date: after notice, the later of the vacate date and the notice date plus move_out_notice_days calendar days; on death, the later of the vacate date and date_of_death plus post_death_fee_days calendar days; after a discharge, the vacate date.
      A discharge notice for nonpayment may be issued by the executive director only after a charge has remained past due for past_due_days_before_discharge_notice; the desk never issues or withdraws a discharge notice.
      The residency may be ended for discharge only once discharge_notice_days have passed since the written discharge notice.
      The discharge period is counted in calendar days from the notice date on the residency, and the residency may be ended on the notice date plus discharge_notice_days calendar days or later.
      Days after the fee end date already billed are returned as move_out_proration credits; the final statement is issued within final_statement_days of the vacate date and a credit balance is refunded to the party who overpaid, or to the estate.
      The file may be closed only when account_balance is 0.00.
    eligibility:
      - id: notice_signer
        applies_to: [memory_notice_record, memory_notice_withdraw]
        kind: authorization
        condition: A notice of termination must be signed by a representative whose representative_authority is financial_poa, durable_poa or guardian.
        evidence_fields: [customers.representative_authority, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: discharge_period_elapsed
        applies_to: [memory_end_without_notice]
        kind: time
        condition: The residency may be ended for discharge only once discharge_notice_days have passed since the written discharge notice.
        evidence_fields: [memory_residencies.notice_date, memory_residencies.memory_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_residencies.memory_residency_id]
          action_bindings:
            memory_residencies.memory_residency_id: memory_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the written discharge notice
          anchor_source: memory_residencies.notice_date
          relation: not_before
          duration_source: variants.discharge_notice_days
          unit: calendar_days
          counting_rule: The discharge period is counted in calendar days from the notice date on the residency, and the residency may be ended on the notice date plus discharge_notice_days calendar days or later.
          boundary: inclusive
      - id: zero_balance_to_close
        applies_to: [memory_account_close]
        kind: authorization
        condition: The file may be closed only when account_balance is 0.00.
        evidence_fields: [memory_residencies.account_balance, memory_residencies.memory_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_residencies.memory_residency_id]
          action_bindings:
            memory_residencies.memory_residency_id: memory_residency_id

  - id: memory_payments_and_late_fees
    subject: [memory_payment, memory_payment_return, memory_late_fee_charge]
    rule: >-
      Payments are posted once per instrument and applied oldest charge first; a returned payment is reinstated referencing the payment entry and carries returned_payment_fee.
      A late fee may be assessed only after payment_grace_days have passed since the monthly charges for that billing period were posted.
      The grace period ends at the end of the day equal to the posting date plus payment_grace_days calendar days, and a late fee may be assessed only on a later date.
      The late fee is the greater of late_fee_flat and late_fee_pct percent of memory_msr_period_past_due, rounded to the cent half up, and none is assessed below late_fee_min_past_due or while an insurer billed directly has not yet paid that period.
      At most one late fee is assessed per residency per billing period.
    eligibility:
      - id: grace_elapsed
        applies_to: [memory_late_fee_charge]
        kind: time
        condition: A late fee may be assessed only after payment_grace_days have passed since the monthly charges for that billing period were posted.
        evidence_fields: [memory_ledger.posting_date, memory_ledger.memory_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_ledger.memory_residency_id]
          action_bindings:
            memory_ledger.memory_residency_id: memory_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the monthly charges for that billing period were posted
          anchor_source: memory_ledger.posting_date
          relation: not_before
          duration_source: variants.payment_grace_days
          unit: calendar_days
          counting_rule: The grace period ends at the end of the day equal to the posting date plus payment_grace_days calendar days, and a late fee may be assessed only on a later date.
          boundary: exclusive
      - id: one_late_fee_per_period
        applies_to: [memory_late_fee_charge]
        kind: dedup
        condition: At most one late fee is assessed per residency per billing period.
        evidence_fields: [memory_ledger.memory_residency_id, memory_ledger.billing_period, memory_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_ledger.memory_residency_id, memory_ledger.billing_period]
          action_bindings:
            memory_ledger.memory_residency_id: memory_residency_id
            memory_ledger.billing_period: billing_period
        dedup_contract:
          table: memory_ledger
          mode: separate_record
          object_bindings: {memory_residency_id: memory_residency_id, billing_period: billing_period}
          duplicate_filters: {event_type: [memory_late_fee_charge]}
          distinct_fields: []
    measures: [memory_msr_period_past_due]
    formula:
      when_not: memory_msr_period_past_due < late_fee_min_past_due
      late_fee_amount: max(late_fee_flat, round(memory_msr_period_past_due * late_fee_pct / 100, 2))

  - id: memory_credits_and_discounts
    subject: [memory_credit]
    rule: >-
      While the customer holds an Entrance Fee Agreement in occupied status, each monthly rate charge receives an entrance_plan_discount credit of care_fee_discount_pct of the agreement's plan (set in the Entrance Fee Agreement charter), referencing the charge and the agreement and rounded to the cent half up, because the memory care rate is a care rate; add-ons and fees are not discounted.
      A respite_conversion credit is posted only as the consequence of a converted Larkspur respite stay, for the amount the respite charter fixes, carrying that respite stay.
      A charge posted in error is corrected only by a billing_error credit referencing that exact charge, never exceeding it.
      Each charge entry receives at most one credit of each reason, so at most one billing_error credit and at most one entrance_plan_discount credit.
    eligibility:
      - id: one_correction_per_charge
        applies_to: [memory_credit]
        kind: dedup
        condition: Each charge entry receives at most one credit of each reason, so at most one billing_error credit and at most one entrance_plan_discount credit.
        evidence_fields: [memory_ledger.source_entry_id, memory_ledger.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_ledger.source_entry_id]
          action_bindings:
            memory_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: memory_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id, credit_reason: credit_reason}
          duplicate_filters: {credit_reason: [billing_error, entrance_plan_discount]}
          distinct_fields: []

  - id: memory_rate_and_suite_change
    subject: [memory_suite_change, memory_program_change]
    rule: >-
      A family-requested suite change moves the resident to the tier with another suite_type and the same care_program, at the monthly_rate of the new tier from the date of possession, and suite_change_fee is charged once; a companion suite may be chosen only while a bed is available within max_suite_occupants.
      The monthly rate of a continuing residency increases at most once in any 12-month period, by no more than max_annual_increase_pct percent, after at least rate_increase_notice_days of written notice.
      Suite changes may be recorded only while the residency is in active status.
    eligibility:
      - id: suite_change_when_active
        applies_to: [memory_suite_change]
        kind: state
        condition: Suite changes may be recorded only while the residency is in active status.
        evidence_fields: [memory_residencies.status, memory_residencies.memory_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [memory_residencies.memory_residency_id]
          action_bindings:
            memory_residencies.memory_residency_id: memory_residency_id
        state_contract:
          field: memory_residencies.status
          allowed: [active]
    params:
      per_tier:
        Memory Care Companion Suite with Essential Care: {monthly_rate: "=monthly_rate", max_suite_occupants: "=max_suite_occupants", suite_change_fee: "=suite_change_fee"}
        Memory Care Companion Suite with Enhanced Care: {monthly_rate: "=monthly_rate", max_suite_occupants: "=max_suite_occupants", suite_change_fee: "=suite_change_fee"}
        Memory Care Private Suite with Essential Care: {monthly_rate: "=monthly_rate", max_suite_occupants: "=max_suite_occupants", suite_change_fee: "=suite_change_fee"}
        Memory Care Private Suite with Enhanced Care: {monthly_rate: "=monthly_rate", max_suite_occupants: "=max_suite_occupants", suite_change_fee: "=suite_change_fee"}
        Memory Care Private Suite with Advanced Care: {monthly_rate: "=monthly_rate", max_suite_occupants: "=max_suite_occupants", suite_change_fee: "=suite_change_fee"}
        Memory Care Deluxe Suite with Advanced Care: {monthly_rate: "=monthly_rate", max_suite_occupants: "=max_suite_occupants", suite_change_fee: "=suite_change_fee"}
