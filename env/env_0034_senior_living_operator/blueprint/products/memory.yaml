# Product charter — Memory Care Residency Agreement.
# Larkspur Senior Living. Tiers combine the suite type with the care program set by the memory care
# assessment; the monthly rate is all-inclusive of rent and the program's care. Single registry of every number.

category: memory
display_name: Memory Care Residency Agreement

binding:
  holding_table: memory_residencies
  event_tables: [memory_ledger, memory_assessments]
  intake_tables: [memory_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {account_balance: resident_balance}

lifecycle:
  states: [pending_admission, active, on_leave, notice_given, vacated, closed, cancelled]
  transitions:
    - from: pending_admission
      to: active
      by: system
      means: "The resident moves into the secured memory care neighborhood on the recorded move-in date."
    - from: pending_admission
      to: cancelled
      by: user
      means: "The resident's legal representative signs a withdrawal of the admission before move-in."
    - from: active
      to: on_leave
      by: agent
      means: "A temporary absence begins - a hospital admission, a skilled nursing or rehabilitation stay, or a family visit."
    - from: on_leave
      to: active
      by: agent
      means: "The resident returns from the recorded absence."
    - from: active
      to: notice_given
      by: user
      means: "The resident's legal representative signs the written notice of termination."
    - from: notice_given
      to: active
      by: user
      means: "The legal representative withdraws the notice before the intended vacate date."
    - from: notice_given
      to: vacated
      by: agent
      means: "The suite is surrendered after notice."
    - from: active
      to: vacated
      by: agent
      means: "The residency ends without notice - death or a discharge whose notice period has run."
    - from: on_leave
      to: vacated
      by: agent
      means: "The residency ends during an absence - death or a discharge because the resident cannot return."
    - from: vacated
      to: closed
      by: agent
      means: "The final statement is settled and the file closed."

accounts:
  - key: resident_balance
    unit: USD
    meaning: Amount owed on the memory care account; monthly rates, add-ons and fees book in, payments and credits book out, and a negative value is a credit balance.

parameter_schema:
  monthly_rate: All-inclusive monthly rate for this suite type and care program, covering the suite, meals, the program's care and medication management, USD per calendar month.
  suite_type: Suite type of the tier - companion (shared), private or deluxe - enumeration.
  care_program: Care program of the tier - essential, enhanced or advanced - enumeration.
  care_points_min: Lowest memory care assessment score placing a resident in this tier's care program, integer points.
  care_points_max: Highest memory care assessment score placing a resident in this tier's care program, integer points.
  max_suite_occupants: Maximum number of residents in the suite, integer persons.
  community_fee: One-time non-refundable community fee charged at move-in, USD.
  community_fee_waived_internal_transfer: Whether the community fee is waived for a resident moving in directly from a Larkspur independent or assisted living residency, boolean.
  medication_management_included: Whether medication management is included in the monthly rate, boolean.
  hospice_coordination_included: Whether coordination with an outside hospice provider is included without charge, boolean.
  incontinence_supplies_included: Whether incontinence supplies are included in the monthly rate, boolean.
  incontinence_supplies_fee: Monthly incontinence supplies fee where not included, USD per calendar month.
  one_to_one_included_hours_per_month: Hours of one-to-one companion care included per calendar month, integer hours.
  one_to_one_companion_hourly_rate: Rate for one-to-one companion care hours beyond those included, USD per hour.
  one_to_one_minimum_hours_per_shift: Minimum hours billed per scheduled one-to-one companion shift, integer hours.
  insulin_management_fee: Monthly insulin administration fee, USD per calendar month (0 when included).
  behavioral_support_fee: Monthly fee for an individualized behavioral support plan where the program does not include it, USD per calendar month (0 when included).
  two_person_assist_fee: Monthly fee where the care plan requires two staff for transfers, USD per calendar month (0 when included).
  escort_to_appointments_hourly_fee: Rate for a staff escort to an outside medical appointment, USD per hour.
  escort_minimum_hours: Minimum hours billed per escort, integer hours.
  guest_meal_fee: Fee for a guest meal in the memory care dining room, USD per meal.
  ltc_direct_billing_fee: Monthly administration fee when a long-term care insurer is billed directly, USD per calendar month.
  suite_change_fee: Fee for a family-requested move to another suite, USD per move.
  min_resident_age: Minimum age of a memory care resident on the move-in date, integer years.
  dementia_diagnosis_required: Whether a physician's written diagnosis of dementia or a related cognitive disorder is required for admission, boolean.
  physician_order_validity_days: Maximum age in calendar days of the physician's admission order on the move-in date, integer days.
  pre_admission_assessment_validity_days: Maximum calendar days between the pre-admission memory care assessment and the move-in date, integer days.
  post_move_in_reassessment_days: Calendar days after move-in by which the first reassessment is completed, integer days.
  routine_reassessment_interval_days: Maximum calendar days between routine reassessments in this care program, integer days.
  post_hospital_reassessment_days: Calendar days after return from a hospital stay by which a reassessment is completed, integer days.
  program_notice_issue_days: Calendar days after an assessment indicating a new care program by which the written program notice is issued, integer days.
  program_increase_notice_days: Calendar days after the written program notice before a move to a higher care program found at a routine reassessment takes effect, integer days.
  absence_credit_after_days: Midnights of a continuous absence not credited before the absence credit begins, integer days.
  absence_credit_max_days: Maximum days credited per continuous absence, integer days.
  absence_credit_pct: Percentage of the daily monthly rate credited for each credited day of absence, percent.
  max_leave_days_before_review: Midnights of a continuous absence after which the executive director reviews whether the suite continues to be held, integer days.
  fee_due_day: Day of the month on which the monthly rate is billed in advance, integer.
  payment_grace_days: Calendar days after posting during which payment carries no late fee, integer days.
  late_fee_flat: Flat component of the late fee, USD.
  late_fee_pct: Percentage component of the late fee, percent of the past-due amount.
  late_fee_min_past_due: Past-due amount below which no late fee is assessed, USD.
  returned_payment_fee: Fee for a returned payment, USD.
  rate_increase_notice_days: Minimum calendar days of written notice before a monthly rate increase, integer days.
  max_annual_increase_pct: Ceiling on a single annual monthly rate increase, percent.
  move_out_notice_days: Length of the written notice of termination, integer calendar days.
  post_death_fee_days: Calendar days after the date of death through which the monthly rate continues unless belongings are removed later, integer days.
  discharge_notice_days: Length of the written discharge notice, integer calendar days.
  past_due_days_before_discharge_notice: Calendar days a charge may remain past due before a discharge notice for nonpayment may be issued, integer days.
  final_statement_days: Calendar days after the vacate date by which the final statement is issued and any credit balance refunded, integer days.

