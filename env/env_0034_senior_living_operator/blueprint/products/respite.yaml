events:
  - type: respite_booking_create
    target: respite_stays
    mutation: create
    meaning: A short stay is booked for a guest in a furnished apartment, opening the stay in booked status.
    grain: One row per stay booked.
    fields:
      respite_stay_id: Reference number of the stay.
      customer_id: The guest.
      variant_name: Stay type booked, verbatim tier name.
      community_name: Larkspur community.
      apartment_number: Furnished apartment assigned.
      booking_date: Date booked.
      planned_arrival_date: Planned arrival date.
      planned_departure_date: Planned departure date; the planned nights are departure minus arrival.
      guests_count: Number of guests sharing the apartment.
      nightly_rate_locked: Nightly rate in effect on the booking date.
      care_points: Care-point score from the referral or pre-stay screening; 0 for a trial stay.
    triggers:
      - event: respite:respite_nightly_charge
        map: {respite_stay_id: respite_stay_id, customer_id: customer_id, charge_basis: planned_stay}
  - type: respite_health_documents_record
    target: respite_stays
    mutation: update
    meaning: The physician's report, tuberculosis screening or hospital discharge summary is received and its date recorded.
    grain: One row per set of health documents received.
    fields:
      respite_stay_id: The stay.
      health_documents_date: Date of the physician's report or discharge summary received.
    triggers: []
  - type: respite_check_in
    target: respite_stays
    mutation: {transition: {from: booked, to: in_stay}}
    meaning: The guest arrives and checks in.
    grain: One row per stay.
    fields:
      respite_stay_id: The stay.
      check_in_date: Date of arrival.
      level_effective_date: Set to the check-in date.
    triggers: []
  - type: respite_cancel
    target: respite_stays
    mutation: {transition: {from: booked, to: cancelled}}
    meaning: The stay is cancelled before arrival, by the guest, as a no-show or because the guest died.
    grain: One row per stay.
    fields:
      respite_stay_id: The stay.
      cancellation_date: Date the cancellation was signed, or the planned arrival date for a no-show, or the date of death.
      cancellation_reason: guest_cancelled, no_show or guest_deceased.
    triggers:
      - event: respite:respite_credit
        map: {respite_stay_id: respite_stay_id, credit_reason: cancellation_reversal}
  - type: respite_extension
    target: respite_stays
    mutation: update
    meaning: The planned departure date is moved later at the guest's request.
    grain: One row per extension.
    fields:
      respite_stay_id: The stay.
      planned_departure_date: New planned departure date.
      extensions_count: Number of extensions granted including this one.
    triggers:
      - event: respite:respite_nightly_charge
        map: {respite_stay_id: respite_stay_id, charge_basis: extension}
  - type: respite_level_change
    target: respite_stays
    mutation: update
    meaning: A nurse assessment during the stay places the guest at a different assisted living respite care level.
    grain: One row per level change.
    fields:
      respite_stay_id: The stay.
      variant_name: New stay type, verbatim tier name.
      care_points: Care points of the assessment.
      level_effective_date: Date of the assessment; the new level applies from that night.
    triggers:
      - event: respite:respite_nightly_charge
        map: {respite_stay_id: respite_stay_id, charge_basis: level_change}
      - event: respite:respite_credit
        map: {respite_stay_id: respite_stay_id, credit_reason: level_change_adjustment}
  - type: respite_check_out
    target: respite_stays
    mutation: {transition: {from: in_stay, to: completed}}
    meaning: The guest checks out.
    grain: One row per stay.
    fields:
      respite_stay_id: The stay.
      check_out_date: Date of departure; nights stayed are check-out minus check-in.
    triggers: []
  - type: respite_convert
    target: respite_stays
    mutation: {transition: [{from: in_stay, to: converted}, {from: completed, to: converted}]}
    meaning: The guest moves into a permanent Larkspur residency, directly from the stay or within the conversion window after it.
    grain: One row per stay; a stay converts at most once.
    fields:
      respite_stay_id: The stay.
      converted_to_category: independent, assisted or memory.
      converted_residency_id: The new Larkspur residency the guest moved into.
      conversion_date: Move-in date of the new residency.
      check_out_date: Set to the day before the conversion date when converting directly from the stay; unchanged otherwise.
    triggers:
      - event: assisted:assisted_credit
        when: {converted_to_category: assisted}
        map: {customer_id: customer_id, credit_reason: respite_conversion, respite_stay_id: respite_stay_id}
      - event: independent:independent_credit
        when: {converted_to_category: independent}
        map: {customer_id: customer_id, credit_reason: respite_conversion, respite_stay_id: respite_stay_id}
      - event: memory:memory_credit
        when: {converted_to_category: memory}
        map: {customer_id: customer_id, credit_reason: respite_conversion, respite_stay_id: respite_stay_id}
  - type: respite_nightly_charge
    target: respite_ledger
    meaning: Nights are charged at one stay type and rate for one segment of the stay - the planned stay at booking, an extension, or the remaining nights after a level change.
    grain: One row per stay per billed segment of consecutive nights.
    distinguish_by: [charge_basis, segment_start_date, tier_billed]
    fields:
      respite_stay_id: The stay.
      customer_id: The guest.
      amount: Nights times the nightly rate (plus the second guest fee per night where applicable), positive, USD.
      posting_date: Date posted.
      charge_basis: planned_stay, extension or level_change.
      tier_billed: Stay type whose rate is charged, verbatim tier name.
      segment_start_date: First night of the segment.
      segment_end_date: Last night of the segment.
      nights: Number of nights in the segment.
    account: stay_balance
    direction: in
    triggers: []
  - type: respite_cancellation_fee
    target: respite_ledger
    meaning: A late cancellation or no-show fee is charged.
    grain: One row per cancelled stay.
    distinguish_by: [posting_date]
    fields:
      respite_stay_id: The stay.
      customer_id: The guest.
      amount: Fee, positive, USD.
      posting_date: Date posted.
      nights: Nights charged as the fee.
    account: stay_balance
    direction: in
    triggers: []
  - type: respite_addon_charge
    target: respite_ledger
    meaning: An add-on or fee is charged during or after the stay.
    grain: One row per add-on code per service date per source entry.
    distinguish_by: [addon_code, service_date, source_entry_id]
    fields:
      respite_stay_id: The stay.
      customer_id: The guest.
      amount: Charge, positive, USD.
      posting_date: Date posted.
      addon_code: Which add-on or fee.
      service_date: Date of the service.
      quantity: Units (meals, trays, trips, loads, days, hours, keys).
      source_entry_id: The payment or returned payment entry a card convenience or returned payment fee arises from; empty otherwise.
    account: stay_balance
    direction: in
    triggers: []
  - type: respite_payment
    target: respite_ledger
    meaning: A payment toward the stay is received.
    grain: One row per payment instrument.
    distinguish_by: [payment_reference]
    fields:
      respite_stay_id: The stay.
      customer_id: The guest.
      amount: Payment, positive, USD.
      posting_date: Date received.
      payment_reference: Instrument reference.
      payment_method: Instrument type.
      payer_type: resident_or_family or ltc_insurer.
    account: stay_balance
    direction: out
    triggers: []
  - type: respite_payment_return
    target: respite_ledger
    meaning: A posted payment is returned unpaid and reinstated.
    grain: One row per returned payment entry.
    distinguish_by: [source_entry_id]
    fields:
      respite_stay_id: The stay.
      customer_id: The guest.
      amount: Returned amount, positive, USD.
      posting_date: Date posted.
      source_entry_id: The payment entry returned.
    account: stay_balance
    direction: in
    triggers:
      - event: respite:respite_addon_charge
        map: {respite_stay_id: respite_stay_id, addon_code: returned_payment, source_entry_id: source_entry_id}
  - type: respite_credit
    target: respite_ledger
    meaning: A credit reduces the stay balance - reversal of the planned stay on cancellation, unused nights after an early departure, the old-level nights after a level change, or a billing correction.
    grain: One row per credit reason per source charge entry.
    distinguish_by: [credit_reason, source_entry_id]
    fields:
      respite_stay_id: The stay.
      customer_id: The guest.
      amount: Credit, positive, USD.
      posting_date: Date posted.
      credit_reason: cancellation_reversal, early_departure, level_change_adjustment or billing_error.
      source_entry_id: The nightly charge or fee entry credited.
      nights: Nights credited, where the credit is for nights.
    account: stay_balance
    direction: out
    triggers: []
  - type: respite_refund
    target: respite_ledger
    meaning: A credit balance on the stay is refunded to the payer.
    grain: One row per refund instrument.
    distinguish_by: [payment_reference]
    fields:
      respite_stay_id: The stay.
      customer_id: The guest.
      amount: Refund, positive, USD.
      posting_date: Date issued.
      payment_reference: Refund check or ACH trace number.
      payment_method: check or ach_one_time.
      payer_type: Party refunded.
    account: stay_balance
    direction: in
    triggers: []

measures:
  - id: respite_msr_nights_12m
    window: Rolling 365 calendar days ending on the planned departure date of the stay being booked or extended, by night date.
    measure: Number of nights of the customer's respite stays in in_stay, completed or converted status falling in the window, plus booked nights of other stays in booked status, plus the nights of the stay being booked or extended.
  - id: respite_msr_paid_before_arrival
    window: From the booking date to the prepayment deadline of the stay.
    measure: Sum of respite_payment amounts on the stay posted in the window, less respite_payment_return amounts reinstating them.
  - id: respite_msr_nights_stayed
    window: The stay, from check_in_date to check_out_date.
    measure: Nights actually stayed, check-out date minus check-in date in calendar days.

policies:
  - id: respite_agg_multi_holding
    subject: [respite_booking_create]
    rule: >-
      A customer may hold any number of respite or trial stays over time, but only one stay may be open at a time.
      A new stay may be booked only when the customer has no other stay in booked or in_stay status.
      A short stay is for people who do not already live in Larkspur assisted living or memory care: no stay may be booked while the customer has an assisted living or memory care residency in pending_admission, active, on_leave or notice_given status.
      A Larkspur independent living resident may book an assisted living respite stay or a Post-Hospital Recovery Stay, but not an Independent Living Trial Stay, and the independent living monthly fees continue unchanged during the stay.
    eligibility:
      - id: one_open_stay
        applies_to: [respite_booking_create]
        kind: dedup
        condition: A new stay may be booked only when the customer has no other stay in booked or in_stay status.
        evidence_fields: [respite_stays.customer_id, respite_stays.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_stays.customer_id]
          action_bindings:
            respite_stays.customer_id: customer_id
        dedup_contract:
          table: respite_stays
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [booked, in_stay]}
          distinct_fields: []
      - id: not_a_care_resident
        applies_to: [respite_booking_create]
        kind: dedup
        condition: "A short stay is for people who do not already live in Larkspur assisted living or memory care: no stay may be booked while the customer has an assisted living or memory care residency in pending_admission, active, on_leave or notice_given status."
        evidence_fields: [assisted_residencies.customer_id, assisted_residencies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.customer_id]
          action_bindings:
            assisted_residencies.customer_id: customer_id
        dedup_contract:
          table: assisted_residencies
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_admission, active, on_leave, notice_given]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: respite_agg_annual_nights
    subject: [respite_booking_create, respite_extension]
    rule: >-
      Respite and short stays are aggregated across all of a customer's stays: respite_msr_nights_12m, which counts the nights of every stay of the customer in the rolling 12 months ending on the planned departure date including the nights now requested, may not exceed max_respite_nights_per_12m of the stay type being booked or extended.
      A booking or extension that would exceed the annual limit is refused for the nights beyond it; a guest who needs longer care is directed to a permanent residency admission instead of another short stay.
      Nights of cancelled stays never count, and nights of a converted stay count up to the conversion.
    eligibility:
      - id: annual_nights_within_limit
        applies_to: [respite_booking_create, respite_extension]
        kind: authorization
        condition: "Respite and short stays are aggregated across all of a customer's stays: respite_msr_nights_12m, which counts the nights of every stay of the customer in the rolling 12 months ending on the planned departure date including the nights now requested, may not exceed max_respite_nights_per_12m of the stay type being booked or extended."
        evidence_fields: [respite_stays.customer_id, respite_stays.check_in_date, respite_stays.check_out_date, respite_stays.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_stays.customer_id]
          action_bindings:
            respite_stays.customer_id: customer_id
    measures: [respite_msr_nights_12m]
    params:
      per_tier:
        Independent Living Trial Stay: {max_respite_nights_per_12m: "=max_respite_nights_per_12m"}
        Assisted Living Respite Stay (Standard Care): {max_respite_nights_per_12m: "=max_respite_nights_per_12m"}
        Assisted Living Respite Stay (Enhanced Care): {max_respite_nights_per_12m: "=max_respite_nights_per_12m"}
        Assisted Living Respite Stay (Extensive Care): {max_respite_nights_per_12m: "=max_respite_nights_per_12m"}
        Memory Care Respite Stay: {max_respite_nights_per_12m: "=max_respite_nights_per_12m"}
        Post-Hospital Recovery Stay: {max_respite_nights_per_12m: "=max_respite_nights_per_12m"}

  - id: respite_booking_terms
    subject: [respite_booking_create, respite_nightly_charge]
    rule: >-
      A stay is booked for one stay type at one community for planned nights equal to the planned departure date minus the planned arrival date.
      The planned arrival date must be at least booking_lead_days_min and at most booking_horizon_days calendar days after the booking date.
      The planned nights must be at least minimum_stay_nights and at most maximum_stay_nights of the stay type.
      The guest must be at least min_guest_age years old on the planned arrival date, and the number of guests may not exceed max_guests_per_apartment.
      The stay type must fit the guest: the care points of the referral or screening must lie within care_points_min to care_points_max of the stay type; a guest with a dementia diagnosis or a wander risk may be booked only into a stay type whose dementia_diagnosis_required or wander_risk_accepted is true; a Post-Hospital Recovery Stay requires a hospital discharge.
      Where rate_locked_at_booking is true, the nightly rate published on the booking date is recorded as nightly_rate_locked and applies to every night of the stay, extensions included.
      At booking the planned stay is charged as one planned_stay segment: planned nights times nightly_rate_locked, plus second_guest_nightly_fee per night for a second guest.
      Nightly charges may be posted only while the stay is in booked or in_stay status.
    eligibility:
      - id: guest_age
        applies_to: [respite_booking_create]
        kind: caller_fact
        condition: The guest must be at least min_guest_age years old on the planned arrival date, and the number of guests may not exceed max_guests_per_apartment.
        evidence_fields: [customers.date_of_birth, customers.customer_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: nightly_charge_on_open_stay
        applies_to: [respite_nightly_charge]
        kind: state
        condition: Nightly charges may be posted only while the stay is in booked or in_stay status.
        evidence_fields: [respite_stays.status, respite_stays.respite_stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_stays.respite_stay_id]
          action_bindings:
            respite_stays.respite_stay_id: respite_stay_id
        state_contract:
          field: respite_stays.status
          allowed: [booked, in_stay]
    params:
      per_tier:
        Independent Living Trial Stay: {nightly_rate: "=nightly_rate", minimum_stay_nights: "=minimum_stay_nights", maximum_stay_nights: "=maximum_stay_nights", booking_lead_days_min: "=booking_lead_days_min", care_points_min: "=care_points_min", care_points_max: "=care_points_max", second_guest_nightly_fee: "=second_guest_nightly_fee"}
        Assisted Living Respite Stay (Standard Care): {nightly_rate: "=nightly_rate", minimum_stay_nights: "=minimum_stay_nights", maximum_stay_nights: "=maximum_stay_nights", booking_lead_days_min: "=booking_lead_days_min", care_points_min: "=care_points_min", care_points_max: "=care_points_max", second_guest_nightly_fee: "=second_guest_nightly_fee"}
        Assisted Living Respite Stay (Enhanced Care): {nightly_rate: "=nightly_rate", minimum_stay_nights: "=minimum_stay_nights", maximum_stay_nights: "=maximum_stay_nights", booking_lead_days_min: "=booking_lead_days_min", care_points_min: "=care_points_min", care_points_max: "=care_points_max", second_guest_nightly_fee: "=second_guest_nightly_fee"}
        Assisted Living Respite Stay (Extensive Care): {nightly_rate: "=nightly_rate", minimum_stay_nights: "=minimum_stay_nights", maximum_stay_nights: "=maximum_stay_nights", booking_lead_days_min: "=booking_lead_days_min", care_points_min: "=care_points_min", care_points_max: "=care_points_max", second_guest_nightly_fee: "=second_guest_nightly_fee"}
        Memory Care Respite Stay: {nightly_rate: "=nightly_rate", minimum_stay_nights: "=minimum_stay_nights", maximum_stay_nights: "=maximum_stay_nights", booking_lead_days_min: "=booking_lead_days_min", care_points_min: "=care_points_min", care_points_max: "=care_points_max", second_guest_nightly_fee: "=second_guest_nightly_fee"}
        Post-Hospital Recovery Stay: {nightly_rate: "=nightly_rate", minimum_stay_nights: "=minimum_stay_nights", maximum_stay_nights: "=maximum_stay_nights", booking_lead_days_min: "=booking_lead_days_min", care_points_min: "=care_points_min", care_points_max: "=care_points_max", second_guest_nightly_fee: "=second_guest_nightly_fee"}
    formula:
      planned_stay_amount: nights * (nightly_rate_locked + second_guest_nightly_fee * (guests_count - 1))

  - id: respite_prepayment_and_check_in
    subject: [respite_payment, respite_check_in, respite_health_documents_record]
    rule: >-
      The charge for the minimum stay - minimum_stay_nights times nightly_rate_locked - must be paid in advance, and the rest of the stay balance is paid by the final balance due date.
      Check-in is allowed only when respite_msr_paid_before_arrival is at least the minimum-stay charge.
      Where health_documents_required is true, check-in is allowed only with health documents dated no more than health_document_validity_days before the arrival date - a physician's report of health status, with a tuberculosis screening result where tb_screening_required is true, and for a Post-Hospital Recovery Stay the hospital discharge summary.
      The documents must be dated within health_document_validity_days before arrival.
      Their age is counted in calendar days from the document date to the arrival date, the document date being day 0, and a document whose age equals health_document_validity_days is still valid.
      Where nurse_assessment_on_arrival is true, a Larkspur nurse completes a care-point assessment on the arrival day and the level change policy applies to its result.
      A guest who does not meet these conditions on the arrival date is not checked in; the stay remains booked until it is cancelled or the conditions are met within the booked dates.
      Payments may be posted while the stay is in booked, in_stay, completed, cancelled or converted status, a payment toward a closed stay settling its remaining balance.
    eligibility:
      - id: health_documents_current
        applies_to: [respite_check_in]
        kind: time
        condition: The documents must be dated within health_document_validity_days before arrival.
        evidence_fields: [respite_stays.health_documents_date, respite_stays.respite_stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_stays.respite_stay_id]
          action_bindings:
            respite_stays.respite_stay_id: respite_stay_id
        temporal_basis:
          clock: frozen_time
          anchor_event: dated within health_document_validity_days before arrival
          anchor_source: respite_stays.health_documents_date
          relation: not_after
          duration_source: variants.health_document_validity_days
          unit: calendar_days
          counting_rule: Their age is counted in calendar days from the document date to the arrival date, the document date being day 0, and a document whose age equals health_document_validity_days is still valid.
          boundary: inclusive
      - id: minimum_stay_prepaid
        applies_to: [respite_check_in]
        kind: authorization
        condition: Check-in is allowed only when respite_msr_paid_before_arrival is at least the minimum-stay charge.
        evidence_fields: [respite_ledger.amount, respite_ledger.event_type, respite_ledger.respite_stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_ledger.respite_stay_id]
          action_bindings:
            respite_ledger.respite_stay_id: respite_stay_id
    measures: [respite_msr_paid_before_arrival]
    params:
      per_tier:
        Independent Living Trial Stay: {minimum_stay_nights: "=minimum_stay_nights", health_documents_required: "=health_documents_required", health_document_validity_days: "=health_document_validity_days", tb_screening_required: "=tb_screening_required", discharge_summary_required: "=discharge_summary_required", prepayment_due_days_before_arrival: "=prepayment_due_days_before_arrival"}
        Assisted Living Respite Stay (Standard Care): {minimum_stay_nights: "=minimum_stay_nights", health_documents_required: "=health_documents_required", health_document_validity_days: "=health_document_validity_days", tb_screening_required: "=tb_screening_required", discharge_summary_required: "=discharge_summary_required", prepayment_due_days_before_arrival: "=prepayment_due_days_before_arrival"}
        Assisted Living Respite Stay (Enhanced Care): {minimum_stay_nights: "=minimum_stay_nights", health_documents_required: "=health_documents_required", health_document_validity_days: "=health_document_validity_days", tb_screening_required: "=tb_screening_required", discharge_summary_required: "=discharge_summary_required", prepayment_due_days_before_arrival: "=prepayment_due_days_before_arrival"}
        Assisted Living Respite Stay (Extensive Care): {minimum_stay_nights: "=minimum_stay_nights", health_documents_required: "=health_documents_required", health_document_validity_days: "=health_document_validity_days", tb_screening_required: "=tb_screening_required", discharge_summary_required: "=discharge_summary_required", prepayment_due_days_before_arrival: "=prepayment_due_days_before_arrival"}
        Memory Care Respite Stay: {minimum_stay_nights: "=minimum_stay_nights", health_documents_required: "=health_documents_required", health_document_validity_days: "=health_document_validity_days", tb_screening_required: "=tb_screening_required", discharge_summary_required: "=discharge_summary_required", prepayment_due_days_before_arrival: "=prepayment_due_days_before_arrival"}
        Post-Hospital Recovery Stay: {minimum_stay_nights: "=minimum_stay_nights", health_documents_required: "=health_documents_required", health_document_validity_days: "=health_document_validity_days", tb_screening_required: "=tb_screening_required", discharge_summary_required: "=discharge_summary_required", prepayment_due_days_before_arrival: "=prepayment_due_days_before_arrival"}
    formula:
      minimum_stay_charge: minimum_stay_nights * nightly_rate_locked

  - id: respite_cancellation
    subject: [respite_cancel, respite_cancellation_fee, respite_credit]
    rule: >-
      A booked stay may be cancelled by the guest's signed cancellation, signed by the guest or by a representative whose representative_authority is financial_poa, durable_poa or guardian; a stay whose guest does not arrive on the planned arrival date is closed as a no-show; a stay whose guest dies before arrival is closed as guest_deceased on the strength of date_of_death on the customer profile.
      On every cancellation the planned_stay charge, and any extension charge, is reversed in full by a cancellation_reversal credit referencing it.
      A cancellation carries no fee only if it is signed no later than free_cancellation_days before the planned arrival.
      The free-cancellation deadline is the planned arrival date minus free_cancellation_days calendar days, and a cancellation signed on that deadline date is still free.
      A cancellation fee may be charged only when the cancellation is signed after the free-cancellation deadline before the planned arrival, which every no-show is.
      A guest_cancelled cancellation signed after the deadline is charged cancellation_fee_nights times nightly_rate_locked; a no_show is charged no_show_fee_nights times nightly_rate_locked; a guest_deceased cancellation is never charged.
      At most one cancellation fee is charged per stay, and any prepayment exceeding the fee is refunded under the refund policy.
      Cancellation credits may be posted only while the stay is in cancelled status.
    eligibility:
      - id: cancellation_signer
        applies_to: [respite_cancel]
        kind: authorization
        condition: A booked stay may be cancelled by the guest's signed cancellation, signed by the guest or by a representative whose representative_authority is financial_poa, durable_poa or guardian; a stay whose guest does not arrive on the planned arrival date is closed as a no-show; a stay whose guest dies before arrival is closed as guest_deceased on the strength of date_of_death on the customer profile.
        evidence_fields: [customers.representative_authority, customers.date_of_death, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: fee_only_after_deadline
        applies_to: [respite_cancellation_fee]
        kind: time
        condition: A cancellation fee may be charged only when the cancellation is signed after the free-cancellation deadline before the planned arrival, which every no-show is.
        evidence_fields: [respite_stays.planned_arrival_date, respite_stays.respite_stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_stays.respite_stay_id]
          action_bindings:
            respite_stays.respite_stay_id: respite_stay_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the planned arrival
          anchor_source: respite_stays.planned_arrival_date
          relation: not_before
          duration_source: variants.free_cancellation_days
          unit: calendar_days
          counting_rule: The free-cancellation deadline is the planned arrival date minus free_cancellation_days calendar days, and a cancellation signed on that deadline date is still free.
          boundary: exclusive
      - id: one_cancellation_fee
        applies_to: [respite_cancellation_fee]
        kind: dedup
        condition: At most one cancellation fee is charged per stay, and any prepayment exceeding the fee is refunded under the refund policy.
        evidence_fields: [respite_ledger.respite_stay_id, respite_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_ledger.respite_stay_id]
          action_bindings:
            respite_ledger.respite_stay_id: respite_stay_id
        dedup_contract:
          table: respite_ledger
          mode: separate_record
          object_bindings: {respite_stay_id: respite_stay_id}
          duplicate_filters: {event_type: [respite_cancellation_fee]}
          distinct_fields: []
    params:
      per_tier:
        Independent Living Trial Stay: {free_cancellation_days: "=free_cancellation_days", cancellation_fee_nights: "=cancellation_fee_nights", no_show_fee_nights: "=no_show_fee_nights"}
        Assisted Living Respite Stay (Standard Care): {free_cancellation_days: "=free_cancellation_days", cancellation_fee_nights: "=cancellation_fee_nights", no_show_fee_nights: "=no_show_fee_nights"}
        Assisted Living Respite Stay (Enhanced Care): {free_cancellation_days: "=free_cancellation_days", cancellation_fee_nights: "=cancellation_fee_nights", no_show_fee_nights: "=no_show_fee_nights"}
        Assisted Living Respite Stay (Extensive Care): {free_cancellation_days: "=free_cancellation_days", cancellation_fee_nights: "=cancellation_fee_nights", no_show_fee_nights: "=no_show_fee_nights"}
        Memory Care Respite Stay: {free_cancellation_days: "=free_cancellation_days", cancellation_fee_nights: "=cancellation_fee_nights", no_show_fee_nights: "=no_show_fee_nights"}
        Post-Hospital Recovery Stay: {free_cancellation_days: "=free_cancellation_days", cancellation_fee_nights: "=cancellation_fee_nights", no_show_fee_nights: "=no_show_fee_nights"}
    formula:
      late_cancel_fee: cancellation_fee_nights * nightly_rate_locked
      no_show_fee: no_show_fee_nights * nightly_rate_locked

  - id: respite_stay_billing_and_extension
    subject: [respite_extension, respite_check_out, respite_nightly_charge, respite_credit]
    rule: >-
      An extension moves the planned departure date later at the guest's request and is charged as an extension segment of the added nights at nightly_rate_locked.
      An extension must be requested no later than extension_request_cutoff_days before the planned departure date.
      The cutoff is counted in calendar days back from the planned departure date, so the last day to request is the planned departure date minus extension_request_cutoff_days calendar days, inclusive.
      A stay may be extended at most max_extensions_per_stay times and its total nights including extensions may not exceed maximum_stay_nights; extensions may be recorded only while the stay is in booked or in_stay status.
      At check-out the nights stayed are respite_msr_nights_stayed. Where early_departure_refundable is true and the guest leaves before the planned departure date, the booked nights not used are credited as an early_departure credit referencing the latest charged segment, except that nights are never credited below minimum_stay_nights in total.
      A guest who stays past the planned departure date without an extension is charged the extra nights as an extension segment at nightly_rate_locked.
    eligibility:
      - id: extension_cutoff
        applies_to: [respite_extension]
        kind: time
        condition: An extension must be requested no later than extension_request_cutoff_days before the planned departure date.
        evidence_fields: [respite_stays.planned_departure_date, respite_stays.respite_stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_stays.respite_stay_id]
          action_bindings:
            respite_stays.respite_stay_id: respite_stay_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the planned departure date
          anchor_source: respite_stays.planned_departure_date
          relation: not_after
          duration_source: variants.extension_request_cutoff_days
          unit: calendar_days
          counting_rule: The cutoff is counted in calendar days back from the planned departure date, so the last day to request is the planned departure date minus extension_request_cutoff_days calendar days, inclusive.
          boundary: inclusive
      - id: extension_on_open_stay
        applies_to: [respite_extension]
        kind: state
        condition: extensions may be recorded only while the stay is in booked or in_stay status.
        evidence_fields: [respite_stays.status, respite_stays.respite_stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_stays.respite_stay_id]
          action_bindings:
            respite_stays.respite_stay_id: respite_stay_id
        state_contract:
          field: respite_stays.status
          allowed: [booked, in_stay]
    measures: [respite_msr_nights_stayed]
    params:
      per_tier:
        Independent Living Trial Stay: {maximum_stay_nights: "=maximum_stay_nights", max_extensions_per_stay: "=max_extensions_per_stay", minimum_stay_nights: "=minimum_stay_nights", early_departure_refundable: "=early_departure_refundable"}
        Assisted Living Respite Stay (Standard Care): {maximum_stay_nights: "=maximum_stay_nights", max_extensions_per_stay: "=max_extensions_per_stay", minimum_stay_nights: "=minimum_stay_nights", early_departure_refundable: "=early_departure_refundable"}
        Assisted Living Respite Stay (Enhanced Care): {maximum_stay_nights: "=maximum_stay_nights", max_extensions_per_stay: "=max_extensions_per_stay", minimum_stay_nights: "=minimum_stay_nights", early_departure_refundable: "=early_departure_refundable"}
        Assisted Living Respite Stay (Extensive Care): {maximum_stay_nights: "=maximum_stay_nights", max_extensions_per_stay: "=max_extensions_per_stay", minimum_stay_nights: "=minimum_stay_nights", early_departure_refundable: "=early_departure_refundable"}
        Memory Care Respite Stay: {maximum_stay_nights: "=maximum_stay_nights", max_extensions_per_stay: "=max_extensions_per_stay", minimum_stay_nights: "=minimum_stay_nights", early_departure_refundable: "=early_departure_refundable"}
        Post-Hospital Recovery Stay: {maximum_stay_nights: "=maximum_stay_nights", max_extensions_per_stay: "=max_extensions_per_stay", minimum_stay_nights: "=minimum_stay_nights", early_departure_refundable: "=early_departure_refundable"}
    formula:
      early_departure_credit_nights: max(nights - max(respite_msr_nights_stayed, minimum_stay_nights), 0)

  - id: respite_level_change_rules
    subject: [respite_level_change, respite_nightly_charge, respite_credit]
    rule: >-
      The assisted living respite care levels - Standard, Enhanced and Extensive Care - are set by the care-point band of the most recent nurse assessment.
      Where an assessment during the stay places the guest in another assisted living respite level, the stay type changes from the assessment date: the remaining nights of the current segment are credited as a level_change_adjustment credit referencing that segment, and the same nights are charged as a level_change segment at the new level's nightly_rate published on the booking date.
      A level change is possible only between the three assisted living respite stay types and only while the stay is in_stay; a score above care_points_max of Assisted Living Respite Stay (Extensive Care), or a new wander risk, means the guest's needs exceed the stay and the stay ends with the family arranging other care.
      An Independent Living Trial Stay guest found to need care does not change stay type mid-stay.
    eligibility:
      - id: level_change_in_stay
        applies_to: [respite_level_change]
        kind: state
        condition: A level change is possible only between the three assisted living respite stay types and only while the stay is in_stay; a score above care_points_max of Assisted Living Respite Stay (Extensive Care), or a new wander risk, means the guest's needs exceed the stay and the stay ends with the family arranging other care.
        evidence_fields: [respite_stays.status, respite_stays.respite_stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_stays.respite_stay_id]
          action_bindings:
            respite_stays.respite_stay_id: respite_stay_id
        state_contract:
          field: respite_stays.status
          allowed: [in_stay]
    params:
      per_tier:
        Independent Living Trial Stay: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", nightly_rate: "=nightly_rate"}
        Assisted Living Respite Stay (Standard Care): {care_points_min: "=care_points_min", care_points_max: "=care_points_max", nightly_rate: "=nightly_rate"}
        Assisted Living Respite Stay (Enhanced Care): {care_points_min: "=care_points_min", care_points_max: "=care_points_max", nightly_rate: "=nightly_rate"}
        Assisted Living Respite Stay (Extensive Care): {care_points_min: "=care_points_min", care_points_max: "=care_points_max", nightly_rate: "=nightly_rate"}
        Memory Care Respite Stay: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", nightly_rate: "=nightly_rate"}
        Post-Hospital Recovery Stay: {care_points_min: "=care_points_min", care_points_max: "=care_points_max", nightly_rate: "=nightly_rate"}

  - id: respite_addons
    subject: [respite_addon_charge]
    rule: >-
      Add-ons follow the stay type: guest meals at guest_meal_fee per meal; trays not ordered by the nurse at tray_service_fee; medication_setup_fee once per stay where medication_administration_included is true; medical appointment trips beyond transportation_trips_included at transportation_trip_fee per round trip; laundry at laundry_fee_per_load where personal_laundry_included is false; incontinence supplies at incontinence_supplies_daily_fee per day where incontinence_supplies_included is false; one-to-one companion care at one_to_one_companion_hourly_rate per hour.
      Checking out after checkout_time on the departure date carries late_checkout_fee once; a lost key carries key_replacement_fee.
      A late_payment_fee is charged once per stay when the balance is still unpaid after final_balance_due_days calendar days from check-out; a returned payment carries returned_payment_fee referencing it; a credit card payment toward a booked, in-stay, completed or converted stay carries a card_convenience fee of card_convenience_fee_pct percent referencing it, rounded to the cent half up, and a card payment toward a cancelled stay carries none.
      Add-ons are posted against the stay they arise from in whatever status it is, so a returned payment or late payment on a closed stay is still charged there.
    eligibility: []
    params:
      per_tier:
        Independent Living Trial Stay: {medication_setup_fee: "=medication_setup_fee", transportation_trips_included: "=transportation_trips_included", personal_laundry_included: "=personal_laundry_included", incontinence_supplies_included: "=incontinence_supplies_included", meals_per_day_included: "=meals_per_day_included", medication_administration_included: "=medication_administration_included"}
        Assisted Living Respite Stay (Standard Care): {medication_setup_fee: "=medication_setup_fee", transportation_trips_included: "=transportation_trips_included", personal_laundry_included: "=personal_laundry_included", incontinence_supplies_included: "=incontinence_supplies_included", meals_per_day_included: "=meals_per_day_included", medication_administration_included: "=medication_administration_included"}
        Assisted Living Respite Stay (Enhanced Care): {medication_setup_fee: "=medication_setup_fee", transportation_trips_included: "=transportation_trips_included", personal_laundry_included: "=personal_laundry_included", incontinence_supplies_included: "=incontinence_supplies_included", meals_per_day_included: "=meals_per_day_included", medication_administration_included: "=medication_administration_included"}
        Assisted Living Respite Stay (Extensive Care): {medication_setup_fee: "=medication_setup_fee", transportation_trips_included: "=transportation_trips_included", personal_laundry_included: "=personal_laundry_included", incontinence_supplies_included: "=incontinence_supplies_included", meals_per_day_included: "=meals_per_day_included", medication_administration_included: "=medication_administration_included"}
        Memory Care Respite Stay: {medication_setup_fee: "=medication_setup_fee", transportation_trips_included: "=transportation_trips_included", personal_laundry_included: "=personal_laundry_included", incontinence_supplies_included: "=incontinence_supplies_included", meals_per_day_included: "=meals_per_day_included", medication_administration_included: "=medication_administration_included"}
        Post-Hospital Recovery Stay: {medication_setup_fee: "=medication_setup_fee", transportation_trips_included: "=transportation_trips_included", personal_laundry_included: "=personal_laundry_included", incontinence_supplies_included: "=incontinence_supplies_included", meals_per_day_included: "=meals_per_day_included", medication_administration_included: "=medication_administration_included"}

  - id: respite_payments_and_refunds
    subject: [respite_payment, respite_payment_return, respite_refund]
    rule: >-
      Payments are posted once per instrument; a long-term care insurer may pay a stay directly when the guest assigns benefits.
      A returned payment is reinstated referencing the payment entry returned.
      A credit balance on a stay is refunded to the party who paid it no later than refund_issue_days after check-out or cancellation, in one refund per stay balance.
      A refund may be issued only while the stay is in completed, cancelled or converted status; a credit balance during a stay is applied to later nights instead.
    eligibility:
      - id: refund_after_stay
        applies_to: [respite_refund]
        kind: state
        condition: A refund may be issued only while the stay is in completed, cancelled or converted status; a credit balance during a stay is applied to later nights instead.
        evidence_fields: [respite_stays.status, respite_stays.respite_stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_stays.respite_stay_id]
          action_bindings:
            respite_stays.respite_stay_id: respite_stay_id
        state_contract:
          field: respite_stays.status
          allowed: [completed, cancelled, converted]
      - id: return_once_per_payment
        applies_to: [respite_payment_return]
        kind: dedup
        condition: A returned payment is reinstated referencing the payment entry returned.
        evidence_fields: [respite_ledger.source_entry_id, respite_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_ledger.source_entry_id]
          action_bindings:
            respite_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: respite_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [respite_payment_return]}
          distinct_fields: []

  - id: respite_conversion
    subject: [respite_convert]
    rule: >-
      A guest who becomes a permanent Larkspur resident earns a conversion credit on the new residency.
      The new residency - independent living, assisted living or memory care - must belong to the same customer and must have moved in, and the conversion is recorded with the new residency's move-in date as conversion_date.
      A completed stay converts only if the new residency's move-in is within conversion_window_days after check-out.
      The conversion window is counted in calendar days from the check-out date, the check-out date being day 0, and a move-in on the last day of the window still converts; a guest moving in directly from the stay converts without a window.
      The conversion credit equals the nightly charges of the first nights stayed, up to conversion_credit_nights_cap nights at the rate charged for them, but never more than the community fee charged on the new residency; where the new residency was charged no community fee, no conversion credit is due and the stay is not marked converted.
      A stay converts at most once, and a cancelled stay never converts.
    eligibility:
      - id: within_conversion_window
        applies_to: [respite_convert]
        kind: time
        condition: A completed stay converts only if the new residency's move-in is within conversion_window_days after check-out.
        evidence_fields: [respite_stays.check_out_date, respite_stays.respite_stay_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_stays.respite_stay_id]
          action_bindings:
            respite_stays.respite_stay_id: respite_stay_id
        temporal_basis:
          clock: frozen_time
          anchor_event: check-out
          anchor_source: respite_stays.check_out_date
          relation: not_after
          duration_source: variants.conversion_window_days
          unit: calendar_days
          counting_rule: The conversion window is counted in calendar days from the check-out date, the check-out date being day 0, and a move-in on the last day of the window still converts; a guest moving in directly from the stay converts without a window.
          boundary: inclusive
    params:
      per_tier:
        Independent Living Trial Stay: {conversion_window_days: "=conversion_window_days", conversion_credit_nights_cap: "=conversion_credit_nights_cap"}
        Assisted Living Respite Stay (Standard Care): {conversion_window_days: "=conversion_window_days", conversion_credit_nights_cap: "=conversion_credit_nights_cap"}
        Assisted Living Respite Stay (Enhanced Care): {conversion_window_days: "=conversion_window_days", conversion_credit_nights_cap: "=conversion_credit_nights_cap"}
        Assisted Living Respite Stay (Extensive Care): {conversion_window_days: "=conversion_window_days", conversion_credit_nights_cap: "=conversion_credit_nights_cap"}
        Memory Care Respite Stay: {conversion_window_days: "=conversion_window_days", conversion_credit_nights_cap: "=conversion_credit_nights_cap"}
        Post-Hospital Recovery Stay: {conversion_window_days: "=conversion_window_days", conversion_credit_nights_cap: "=conversion_credit_nights_cap"}

  - id: respite_billing_corrections
    subject: [respite_credit]
    rule: >-
      A charge posted in error is corrected only by a billing_error credit referencing that exact charge entry, never exceeding it less earlier credits against it.
      Each charge entry receives at most one billing_error credit.
      A nightly charge that matches the stay type, nights and locked rate on record is not an error.
    eligibility:
      - id: one_correction_per_charge
        applies_to: [respite_credit]
        kind: dedup
        condition: Each charge entry receives at most one billing_error credit.
        evidence_fields: [respite_ledger.source_entry_id, respite_ledger.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [respite_ledger.source_entry_id]
          action_bindings:
            respite_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: respite_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {credit_reason: [billing_error]}
          distinct_fields: []
