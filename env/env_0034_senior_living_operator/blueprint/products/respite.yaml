# Product charter — Respite and Short-Term Stay Agreement.
# Larkspur Senior Living. Furnished short stays billed by the night: independent living trial stays,
# assisted living respite at three care levels, memory care respite and post-hospital recovery stays.
# Single registry of every number of this category.

category: respite
display_name: Respite and Short-Term Stay Agreement

binding:
  holding_table: respite_stays
  event_tables: [respite_ledger]
  intake_tables: [respite_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {account_balance: stay_balance}

lifecycle:
  states: [booked, in_stay, completed, cancelled, converted]
  transitions:
    - from: booked
      to: in_stay
      by: system
      means: "The guest checks in to the furnished apartment on the arrival date."
    - from: booked
      to: cancelled
      by: user
      means: "The guest or their financial representative signs a cancellation of the booked stay before arrival."
    - from: booked
      to: cancelled
      by: agent
      means: "The guest does not arrive on the planned arrival date and the stay is closed as a no-show, or the guest dies before arrival."
    - from: in_stay
      to: completed
      by: agent
      means: "The guest checks out and the check-out date is recorded."
    - from: in_stay
      to: converted
      by: agent
      means: "The guest moves directly from the stay into a permanent Larkspur residency."
    - from: completed
      to: converted
      by: agent
      means: "A guest who has checked out moves into a permanent Larkspur residency within the conversion window."

accounts:
  - key: stay_balance
    unit: USD
    meaning: Amount the guest owes on the stay account; nightly charges, fees and add-ons book in, payments and credits book out, and a refund of a credit balance books in; a negative value is a credit balance owed back.

parameter_schema:
  nightly_rate: Published nightly rate of the stay type, covering the furnished apartment, the included meals and the stay type's care, USD per night.
  rate_locked_at_booking: Whether the nightly rate in effect on the booking date applies to every night of the stay including extensions, boolean.
  minimum_stay_nights: Minimum number of nights charged for a stay of this type, integer nights.
  maximum_stay_nights: Maximum total nights of one stay including extensions, integer nights.
  max_respite_nights_per_12m: Maximum nights of respite and short stays a guest may have in any rolling 12-month window, integer nights.
  booking_lead_days_min: Minimum calendar days between the booking date and the planned arrival date, integer days.
  booking_horizon_days: Maximum calendar days between the booking date and the planned arrival date, integer days.
  prepayment_due_days_before_arrival: Calendar days before the planned arrival date by which the minimum-stay charge must be paid, integer days.
  free_cancellation_days: Calendar days before the planned arrival date up to which a cancellation carries no fee, integer days.
  cancellation_fee_nights: Number of nights at the locked nightly rate charged as the fee for a cancellation inside the free-cancellation period, integer nights.
  no_show_fee_nights: Number of nights at the locked nightly rate charged when the guest does not arrive, integer nights.
  early_departure_refundable: Whether booked nights not used after an early departure are credited, beyond the minimum stay, boolean.
  extension_request_cutoff_days: Calendar days before the planned departure date by which an extension must be requested, integer days.
  max_extensions_per_stay: Maximum number of extensions of one stay, integer count.
  health_documents_required: Whether a physician's report of health status must be on file before check-in, boolean.
  health_document_validity_days: Maximum age in calendar days of the health documents (physician's report or hospital discharge summary) on the arrival date, integer days.
  tb_screening_required: Whether a tuberculosis screening result must be included with the health documents, boolean.
  discharge_summary_required: Whether a hospital discharge summary must be on file before check-in, boolean.
  dementia_diagnosis_required: Whether a physician's diagnosis of dementia is required, boolean.
  wander_risk_accepted: Whether a guest with a wander or exit-seeking risk can be accepted (only in a secured neighborhood), boolean.
  nurse_assessment_on_arrival: Whether a Larkspur nurse completes a care-point assessment on the arrival day, boolean.
  care_points_min: Lowest care-point score accepted for this stay type, integer points.
  care_points_max: Highest care-point score accepted for this stay type, integer points.
  min_guest_age: Minimum age of the guest on the arrival date, integer years.
  max_guests_per_apartment: Maximum number of guests sharing the furnished apartment, integer persons.
  second_guest_nightly_fee: Nightly fee for a second guest sharing the apartment, USD per night.
  meals_per_day_included: Meals per day included in the nightly rate, integer meals.
  guest_meal_fee: Fee for a visitor's meal, USD per meal.
  tray_service_fee: Fee for a meal tray delivered to the apartment when not ordered by the nurse, USD per tray.
  medication_administration_included: Whether medication administration by staff is included in the nightly rate, boolean.
  medication_setup_fee: One-time fee per stay for pharmacy packaging and medication administration record setup, USD per stay.
  transportation_trips_included: Medical appointment transportation trips included per stay, integer trips.
  transportation_trip_fee: Fee for each medical appointment round trip beyond those included, USD per trip.
  personal_laundry_included: Whether personal laundry is included, boolean.
  laundry_fee_per_load: Fee per personal laundry load where not included, USD per load.
  incontinence_supplies_included: Whether incontinence supplies are included, boolean.
  incontinence_supplies_daily_fee: Daily fee for incontinence supplies where not included, USD per day.
  one_to_one_companion_hourly_rate: Rate for one-to-one companion care requested by the family, USD per hour.
  checkout_time: Check-out time on the departure date, HH:MM local time; a later check-out carries the late check-out fee.
  late_checkout_fee: Fee for checking out after checkout_time, USD.
  key_replacement_fee: Fee for a lost apartment key or fob, USD.
  final_balance_due_days: Calendar days after check-out by which the stay balance must be paid, integer days.
  late_payment_fee: One-time fee when the stay balance remains unpaid after final_balance_due_days, USD.
  returned_payment_fee: Fee for a returned payment, USD.
  card_convenience_fee_pct: Convenience fee on credit card payments, percent of the payment.
  refund_issue_days: Calendar days after check-out or cancellation by which a credit balance is refunded, integer days.
  conversion_window_days: Calendar days after check-out within which a move into a permanent Larkspur residency still earns the conversion credit, integer days.
  conversion_credit_nights_cap: Maximum number of nights of the stay credited to the new residency on conversion, integer nights.

