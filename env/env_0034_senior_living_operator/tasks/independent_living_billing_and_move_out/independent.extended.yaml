events:
  # ---- holding writes (independent_residencies) ----
  - type: independent_reservation_create
    target: independent_residencies
    mutation: create
    meaning: A prospective resident reserves a specific independent living apartment and the residency agreement record is opened in reserved status.
    grain: One row per residency agreement (one apartment reservation by one customer).
    fields:
      independent_residency_id: Reference number of the new residency agreement.
      customer_id: The first resident who signs the reservation.
      variant_name: Official apartment type reserved, verbatim tier name.
      community_name: Larkspur community where the apartment is located.
      apartment_number: Apartment number as printed on the reservation.
      occupancy_type: Single or double occupancy contracted at reservation.
      second_occupant_name: Name of the second occupant for double occupancy; empty for single.
      reservation_date: Date the reservation and deposit were taken.
      planned_move_in_date: Planned move-in date agreed at reservation.
      monthly_service_fee: Contracted base monthly service fee for the apartment, excluding the second person fee.
      rate_effective_date: Date from which the contracted monthly service fee applies (the planned move-in date at reservation).
      referred_by_customer_id: Current Larkspur independent living resident named on the reservation as the referrer; empty when none.
    triggers:
      - event: independent:independent_deposit_receipt
        map: {independent_residency_id: independent_residency_id, customer_id: customer_id}
  - type: independent_move_in
    target: independent_residencies
    mutation: {transition: {from: reserved, to: active}}
    meaning: The resident takes possession of the reserved apartment.
    grain: One row per residency; the move-in happens once.
    fields:
      independent_residency_id: The residency moved into.
      move_in_date: Date possession was taken; monthly fees accrue from this date.
      occupancy_type: Occupancy confirmed at move-in (single or double).
    triggers:
      - event: independent:independent_monthly_fee_charge
        map: {independent_residency_id: independent_residency_id, fee_component: base_fee, charge_basis: prorated_move_in}
      - event: independent:independent_community_fee_charge
        map: {independent_residency_id: independent_residency_id, occupant_position: first_resident}
      - event: independent:independent_community_fee_charge
        when: {occupancy_type: double}
        map: {independent_residency_id: independent_residency_id, occupant_position: second_resident}
      - event: independent:independent_deposit_applied
        map: {independent_residency_id: independent_residency_id}
  - type: independent_reservation_cancel
    target: independent_residencies
    mutation: {transition: {from: reserved, to: cancelled}}
    meaning: The prospective resident cancels the reservation before moving in.
    grain: One row per residency; a reservation is cancelled at most once.
    fields:
      independent_residency_id: The reservation cancelled.
      termination_reason: Fixed to reservation_cancelled.
      closed_date: Date the cancellation was signed.
    triggers:
      - event: independent:independent_deposit_refund
        map: {independent_residency_id: independent_residency_id}
  - type: independent_notice_record
    target: independent_residencies
    mutation: {transition: {from: active, to: notice_given}}
    meaning: The resident's signed written notice of termination is recorded against the residency.
    grain: One row per notice; a residency carries at most one open notice at a time.
    fields:
      independent_residency_id: The residency being terminated.
      notice_date: Date the written notice was signed.
      intended_vacate_date: Date the resident intends to surrender the apartment, as stated on the notice.
      termination_reason: resident_notice, transfer_assisted or transfer_memory as stated on the notice.
    triggers: []
  - type: independent_notice_withdraw
    target: independent_residencies
    mutation: {transition: {from: notice_given, to: active}}
    meaning: The resident withdraws a notice of termination and the residency continues.
    grain: One row per withdrawal of a notice.
    fields:
      independent_residency_id: The residency whose notice is withdrawn.
      notice_date: Cleared to empty on withdrawal.
      intended_vacate_date: Cleared to empty on withdrawal.
      termination_reason: Reset to none on withdrawal.
    triggers: []
  - type: independent_vacate
    target: independent_residencies
    mutation: {transition: {from: notice_given, to: vacated}}
    meaning: After a notice of termination, the apartment is surrendered - keys returned and belongings removed.
    grain: One row per residency; the apartment is vacated once.
    fields:
      independent_residency_id: The residency vacated.
      vacate_date: Date keys were returned and belongings removed.
    triggers:
      - event: independent:independent_service_fee_charge
        map: {independent_residency_id: independent_residency_id, fee_code: carpet_cleaning}
  - type: independent_end_without_notice
    target: independent_residencies
    mutation: {transition: {from: active, to: vacated}}
    meaning: The residency ends without a resident notice - death of the last occupant, a permanent transfer to a Larkspur assisted living or memory care residence, or a discharge for nonpayment.
    grain: One row per residency; the apartment is vacated once.
    fields:
      independent_residency_id: The residency ended.
      vacate_date: Date the apartment was surrendered (belongings removed and keys returned).
      notice_date: Date the community was told of the death or transfer, or the date the discharge notice was issued.
      termination_reason: death, transfer_assisted, transfer_memory or nonpayment_discharge.
    triggers:
      - event: independent:independent_service_fee_charge
        map: {independent_residency_id: independent_residency_id, fee_code: carpet_cleaning}
  - type: independent_account_close
    target: independent_residencies
    mutation: {transition: {from: vacated, to: closed}}
    meaning: The final statement is settled and the residency file is closed.
    grain: One row per residency.
    fields:
      independent_residency_id: The residency closed.
      closed_date: Date the file was closed.
    triggers: []
  - type: independent_rate_notice
    target: independent_residencies
    mutation: update
    meaning: Written notice of an annual monthly service fee increase is mailed to the resident and the proposed fee is recorded.
    grain: One row per increase notice mailed.
    fields:
      independent_residency_id: The residency receiving the notice.
      rate_notice_date: Date the written notice was mailed.
      proposed_monthly_service_fee: New monthly service fee stated in the notice.
    triggers: []
  - type: independent_rate_adjust
    target: independent_residencies
    mutation: update
    meaning: The contracted monthly service fee is changed by an annual increase.
    grain: One row per rate change; a residency receives at most one annual increase per 12 months.
    fields:
      independent_residency_id: The residency whose fee changes.
      monthly_service_fee: New contracted base monthly service fee.
      rate_effective_date: Date the new fee takes effect.
    triggers: []
  - type: independent_occupancy_change
    target: independent_residencies
    mutation: update
    meaning: A second occupant is added to, or leaves, the apartment.
    grain: One row per occupancy change.
    fields:
      independent_residency_id: The residency whose occupancy changes.
      occupancy_type: New occupancy (single or double).
      second_occupant_name: Name of the second occupant now in residence; empty when single.
    triggers:
      - event: independent:independent_community_fee_charge
        when: {occupancy_type: double}
        map: {independent_residency_id: independent_residency_id, occupant_position: second_resident}
  - type: independent_apartment_transfer
    target: independent_residencies
    mutation: update
    meaning: The resident moves, at their own request, to another independent living apartment in the same community under the same agreement.
    grain: One row per apartment transfer.
    fields:
      independent_residency_id: The residency transferred.
      variant_name: Official apartment type of the new apartment.
      apartment_number: Number of the new apartment.
      monthly_service_fee: Monthly service fee contracted for the new apartment.
      rate_effective_date: Date the resident takes possession of the new apartment.
    triggers:
      - event: independent:independent_service_fee_charge
        map: {independent_residency_id: independent_residency_id, fee_code: apartment_transfer}
  # ---- ledger writes (independent_ledger) ----
  - type: independent_monthly_fee_charge
    target: independent_ledger
    meaning: A monthly service fee or second person fee is charged for a span of days within one billing month.
    grain: One row per residency per fee component per continuous billed span within a billing period.
    distinguish_by: [billing_period, fee_component, service_from_date]
    fields:
      independent_residency_id: The residency billed.
      customer_id: The resident billed.
      amount: Charge amount, positive, USD.
      posting_date: Date the charge was posted.
      billing_period: Calendar month billed, YYYY-MM.
      fee_component: base_fee or second_person_fee.
      charge_basis: full_month, prorated_move_in, prorated_move_out, prorated_rate_change or prorated_occupancy_change.
      service_from_date: First day covered by this charge.
      service_to_date: Last day covered by this charge.
      days_billed: Number of days covered, inclusive of both ends.
      days_in_period: Number of days in the calendar month billed.
    account: resident_balance
    direction: in
    triggers: []
  - type: independent_community_fee_charge
    target: independent_ledger
    meaning: The one-time community fee is charged for an occupant.
    grain: One row per occupant moving in - the first resident at move-in and each second occupant when they move in.
    distinguish_by: [occupant_position, posting_date]
    fields:
      independent_residency_id: The residency billed.
      customer_id: The resident billed.
      amount: Community fee, positive, USD.
      posting_date: Date posted.
      occupant_position: first_resident or second_resident.
    account: resident_balance
    direction: in
    triggers: []
  - type: independent_service_fee_charge
    target: independent_ledger
    meaning: A scheduled service or amenity fee is charged - pets, storage, parking, guest suite, replacements, lockouts, move-out cleaning, apartment transfer, returned payments or card convenience fees.
    grain: One row per fee code per service date per source entry.
    distinguish_by: [fee_code, service_date, source_entry_id]
    fields:
      independent_residency_id: The residency billed.
      customer_id: The resident billed.
      amount: Fee amount, USD; 0.00 when an included allowance (guest suite night, lockout) is consumed.
      posting_date: Date posted.
      fee_code: Which scheduled fee this is.
      service_date: Date the service was used, or the first day of the billing month for monthly fees.
      billing_period: Calendar month for monthly fees, YYYY-MM; empty for one-time fees.
      quantity: Number of units charged (nights, pets, fobs, spaces, calls).
      source_entry_id: The payment or returned payment entry this fee arises from; empty when not derived from another entry.
    account: resident_balance
    direction: in
    triggers: []
  - type: independent_late_fee_charge
    target: independent_ledger
    meaning: A late fee is assessed for a billing period whose fees remained unpaid after the grace period.
    grain: One row per residency per billing period.
    distinguish_by: [billing_period]
    fields:
      independent_residency_id: The residency billed.
      customer_id: The resident billed.
      amount: Late fee, positive, USD.
      posting_date: Date assessed.
      billing_period: Billing period whose fees were past due, YYYY-MM.
    account: resident_balance
    direction: in
    triggers: []
  - type: independent_payment
    target: independent_ledger
    meaning: A payment from the resident or their representative is received on the independent living account.
    grain: One row per payment instrument (check number, ACH trace or card authorization).
    distinguish_by: [payment_reference]
    fields:
      independent_residency_id: The residency credited.
      customer_id: The resident credited.
      amount: Payment amount, positive, USD.
      posting_date: Date received.
      payment_reference: Check number, ACH trace number or card authorization code.
      payment_method: ach_autopay, ach_one_time, check, credit_card or debit_card.
    account: resident_balance
    direction: out
    triggers:
      - event: independent:independent_service_fee_charge
        when: {payment_method: credit_card}
        map: {independent_residency_id: independent_residency_id, fee_code: card_convenience}
  - type: independent_payment_return
    target: independent_ledger
    meaning: A previously posted payment is returned unpaid by the bank and its amount is reinstated on the account.
    grain: One row per returned payment entry.
    distinguish_by: [source_entry_id]
    fields:
      independent_residency_id: The residency debited.
      customer_id: The resident debited.
      amount: Amount of the returned payment, positive, USD.
      posting_date: Date the return was posted.
      source_entry_id: The payment entry that was returned.
      payment_reference: Reference of the returned payment instrument.
    account: resident_balance
    direction: in
    triggers:
      - event: independent:independent_service_fee_charge
        map: {independent_residency_id: independent_residency_id, fee_code: returned_payment}
  - type: independent_credit
    target: independent_ledger
    meaning: A credit reduces the amount owed - billing corrections, move-out or rate-change proration, a late fee waiver, a referral credit, the application of the reservation deposit or a respite conversion credit.
    grain: One row per credit reason per source entry (and per referred residency or source respite stay where applicable).
    distinguish_by: [credit_reason, source_entry_id, referred_residency_id, respite_stay_id]
    fields:
      independent_residency_id: The residency credited.
      customer_id: The resident credited.
      amount: Credit amount, positive, USD.
      posting_date: Date posted.
      credit_reason: billing_error, move_out_proration, rate_change_proration, late_fee_waiver, referral_credit, deposit_application or respite_conversion.
      source_entry_id: The charge entry being corrected, prorated or waived, or the deposit receipt entry being applied; empty for a respite conversion credit.
      referred_residency_id: For referral credits, the referred resident's residency; empty otherwise.
      respite_stay_id: For respite conversion credits, the respite or trial stay converted; empty otherwise.
      billing_period: Billing period the credit relates to, YYYY-MM; empty when not period-based.
    account: resident_balance
    direction: out
    triggers: []
  - type: independent_credit_balance_refund
    target: independent_ledger
    meaning: A credit balance on the account is refunded to the resident or the estate by check or ACH.
    grain: One row per refund instrument.
    distinguish_by: [payment_reference]
    fields:
      independent_residency_id: The residency refunded.
      customer_id: The resident refunded.
      amount: Refund amount, positive, USD.
      posting_date: Date the refund was issued.
      payment_reference: Refund check number or ACH trace number.
      payment_method: check or ach_one_time.
    account: resident_balance
    direction: in
    triggers: []
  - type: independent_deposit_receipt
    target: independent_ledger
    meaning: The reservation deposit is received and held.
    grain: One row per deposit payment instrument.
    distinguish_by: [payment_reference]
    fields:
      independent_residency_id: The reservation the deposit secures.
      customer_id: The prospective resident.
      amount: Deposit amount, positive, USD.
      posting_date: Date received.
      payment_reference: Check number, ACH trace or card authorization of the deposit.
      payment_method: Method of the deposit payment.
    account: reservation_deposit
    direction: in
    triggers: []
  - type: independent_deposit_applied
    target: independent_ledger
    meaning: The reservation deposit held is applied to the first charges at move-in.
    grain: One row per deposit receipt applied.
    distinguish_by: [source_entry_id]
    fields:
      independent_residency_id: The residency.
      customer_id: The resident.
      amount: Amount applied, positive, USD.
      posting_date: Date applied.
      source_entry_id: The deposit receipt entry applied.
    account: reservation_deposit
    direction: out
    triggers:
      - event: independent:independent_credit
        map: {independent_residency_id: independent_residency_id, credit_reason: deposit_application, source_entry_id: source_entry_id, amount: amount}
  - type: independent_deposit_refund
    target: independent_ledger
    meaning: All or part of a reservation deposit is refunded after a cancellation.
    grain: One row per deposit receipt refunded.
    distinguish_by: [source_entry_id]
    fields:
      independent_residency_id: The cancelled reservation.
      customer_id: The prospective resident.
      amount: Amount refunded, positive, USD.
      posting_date: Date the refund was issued.
      source_entry_id: The deposit receipt entry refunded.
    account: reservation_deposit
    direction: out
    triggers: []
  - type: independent_deposit_forfeit
    target: independent_ledger
    meaning: The non-refundable part of a reservation deposit is retained after a late cancellation.
    grain: One row per deposit receipt forfeited.
    distinguish_by: [source_entry_id]
    fields:
      independent_residency_id: The cancelled reservation.
      customer_id: The prospective resident.
      amount: Amount retained, positive, USD.
      posting_date: Date retained.
      source_entry_id: The deposit receipt entry partly retained.
    account: reservation_deposit
    direction: out
    triggers: []

measures:
  - id: independent_msr_returned_payments_12m
    window: Rolling 365 calendar days ending on the handling date, by posting_date.
    measure: Count of independent_payment_return entries on the residency.
  - id: independent_msr_late_fee_waivers_12m
    window: Rolling 365 calendar days ending on the handling date, by posting_date.
    measure: Count of independent_credit entries with credit_reason late_fee_waiver on the residency.
  - id: independent_msr_guest_nights_calendar_year
    window: The calendar year (January 1 to December 31) containing the guest suite night being booked, by service_date.
    measure: Sum of quantity over independent_service_fee_charge entries with fee_code guest_suite_night on the residency, whether charged or posted at 0.00 as included nights.
  - id: independent_msr_lockouts_12m
    window: Rolling 365 calendar days ending on the date of the lockout call, by service_date.
    measure: Count of independent_service_fee_charge entries with fee_code lockout_after_hours on the residency, whether charged or posted at 0.00 as included calls.
  - id: independent_msr_referral_credits_12m
    window: Rolling 365 calendar days ending on the handling date, by posting_date.
    measure: Count of independent_credit entries with credit_reason referral_credit on the referring resident's residency.
  - id: independent_msr_period_past_due
    window: The single billing period being assessed, evaluated at the end of the last grace day of that period.
    measure: Sum of independent_monthly_fee_charge and recurring independent_service_fee_charge amounts with that billing_period, less payments and credits applied to them oldest charge first.

policies:
  - id: independent_agg_multi_holding
    subject: [independent_reservation_create]
    rule: >-
      A customer holds at most one independent living residency agreement at a time; a second occupant
      sharing the apartment is recorded on the same agreement and never opens an agreement of their own.
      A new reservation may be opened only when the customer has no other independent living residency in reserved, active or notice_given status.
      Independent living and Larkspur care residences are mutually exclusive for the same person:
      A new reservation may be opened only when the customer has no assisted living residency in pending_admission, active, on_leave or notice_given status and no memory care residency in pending_admission, active, on_leave or notice_given status.
      A customer whose prior residency is vacated, closed or cancelled may reserve again; the earlier
      residency keeps its own ledger and final statement.
    eligibility:
      - id: no_open_independent_residency
        applies_to: [independent_reservation_create]
        kind: dedup
        condition: A new reservation may be opened only when the customer has no other independent living residency in reserved, active or notice_given status.
        evidence_fields: [independent_residencies.customer_id, independent_residencies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.customer_id]
          action_bindings:
            independent_residencies.customer_id: customer_id
        dedup_contract:
          table: independent_residencies
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [reserved, active, notice_given]}
          distinct_fields: [independent_residency_id]
      - id: no_open_care_residency
        applies_to: [independent_reservation_create]
        kind: dedup
        condition: A new reservation may be opened only when the customer has no assisted living residency in pending_admission, active, on_leave or notice_given status and no memory care residency in pending_admission, active, on_leave or notice_given status.
        evidence_fields: [assisted_residencies.customer_id, assisted_residencies.status, memory_residencies.customer_id, memory_residencies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [assisted_residencies.customer_id]
            - [memory_residencies.customer_id]
          action_bindings:
            assisted_residencies.customer_id: customer_id
            memory_residencies.customer_id: customer_id
        dedup_contract:
          table: assisted_residencies
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_admission, active, on_leave, notice_given]}
          distinct_fields: [assisted_residency_id]
    params:
      max_per_customer: 1

  - id: independent_reservation_terms
    subject: [independent_reservation_create, independent_deposit_receipt]
    rule: >-
      An apartment is reserved for one named customer at one community. The first resident must be at least min_resident_age years old on the planned move-in date, by date_of_birth on the customer profile.
      The number of occupants contracted may not exceed max_occupants of the apartment type, so a Studio is single occupancy only.
      The planned move-in date may not be later than reservation_hold_days calendar days after the reservation date; a later move-in requires a new reservation once the hold lapses.
      The deposit taken is reservation_deposit_amount of the reserved apartment type, paid in one instrument and recorded as one deposit receipt; a card deposit carries no convenience fee.
      The contracted monthly_service_fee recorded at reservation is base_monthly_fee of the reserved apartment type, and rate_effective_date is the planned move-in date.
      Where the customer also holds an Entrance Fee Agreement for the same apartment in reserved status, the contracted monthly_service_fee is base_monthly_fee adjusted by monthly_fee_adjustment_pct of that agreement's plan (set in the Entrance Fee Agreement charter; a negative percentage reduces the fee and a positive one increases it), rounded to the cent half up; a customer without such an agreement pays the rental base fee.
      The deposit receipt may be posted only while the residency is in reserved status.
    eligibility:
      - id: resident_minimum_age
        applies_to: [independent_reservation_create]
        kind: caller_fact
        condition: The first resident must be at least min_resident_age years old on the planned move-in date, by date_of_birth on the customer profile.
        evidence_fields: [customers.date_of_birth, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: occupancy_within_apartment_limit
        applies_to: [independent_reservation_create]
        kind: caller_fact
        condition: The number of occupants contracted may not exceed max_occupants of the apartment type, so a Studio is single occupancy only.
        evidence_fields: [independent_residencies.occupancy_type, independent_residencies.variant_name]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [independent_residencies.variant_name]
          action_bindings:
            independent_residencies.variant_name: variant_name
      - id: deposit_only_while_reserved
        applies_to: [independent_deposit_receipt]
        kind: state
        condition: The deposit receipt may be posted only while the residency is in reserved status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [reserved]
    params:
      rounding: nearest cent, half up
      per_tier:
        Independent Living Studio: {reservation_deposit_amount: "=reservation_deposit_amount", reservation_hold_days: "=reservation_hold_days", max_occupants: "=max_occupants"}
        Independent Living One-Bedroom: {reservation_deposit_amount: "=reservation_deposit_amount", reservation_hold_days: "=reservation_hold_days", max_occupants: "=max_occupants"}
        Independent Living One-Bedroom Deluxe: {reservation_deposit_amount: "=reservation_deposit_amount", reservation_hold_days: "=reservation_hold_days", max_occupants: "=max_occupants"}
        Independent Living Two-Bedroom: {reservation_deposit_amount: "=reservation_deposit_amount", reservation_hold_days: "=reservation_hold_days", max_occupants: "=max_occupants"}
        Independent Living Two-Bedroom Deluxe: {reservation_deposit_amount: "=reservation_deposit_amount", reservation_hold_days: "=reservation_hold_days", max_occupants: "=max_occupants"}
        Independent Living Cottage Home: {reservation_deposit_amount: "=reservation_deposit_amount", reservation_hold_days: "=reservation_hold_days", max_occupants: "=max_occupants"}

  - id: independent_reservation_cancellation
    subject: [independent_reservation_cancel, independent_deposit_refund, independent_deposit_forfeit]
    rule: >-
      A reservation can be cancelled only by the prospective resident's own signed cancellation; the desk
      registers the cancellation request and the customer signs it. Cancellation is possible only before move-in.
      The deposit is refunded in full only if the cancellation is signed no later than reservation_full_refund_days after the apartment is reserved.
      The window is counted in calendar days: the reservation date is day 0 and the window's last day is the reservation date plus reservation_full_refund_days calendar days, with a cancellation signed on that last day still inside the window.
      A forfeit may be retained only when the cancellation is signed after the full-refund window has closed, that is later than reservation_full_refund_days after the apartment is reserved.
      A cancellation signed after the window refunds reservation_late_cancel_refund_pct of the deposit received and retains the remainder as a forfeit, each rounded to the cent half up with the refund taking the rounded half and the forfeit the difference.
      Where the prospective resident dies, or a physician certifies in writing before the planned move-in date that they can no longer live independently, the deposit is refunded in full regardless of timing; this exception is evidenced by date_of_death on the customer profile or by an assisted living or memory care admission opened for the customer before the planned move-in date.
      Refunds and forfeits each reference the deposit receipt entry they draw from, and a deposit receipt is refunded or forfeited at most once.
    eligibility:
      - id: forfeit_only_after_window
        applies_to: [independent_deposit_forfeit]
        kind: time
        condition: A forfeit may be retained only when the cancellation is signed after the full-refund window has closed, that is later than reservation_full_refund_days after the apartment is reserved.
        evidence_fields: [independent_residencies.reservation_date, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the apartment is reserved
          anchor_source: independent_residencies.reservation_date
          relation: not_before
          duration_source: variants.reservation_full_refund_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days: the reservation date is day 0 and the window's last day is the reservation date plus reservation_full_refund_days calendar days, with a cancellation signed on that last day still inside the window."
          boundary: exclusive
      - id: deposit_not_already_settled
        applies_to: [independent_deposit_refund, independent_deposit_forfeit]
        kind: dedup
        condition: Refunds and forfeits each reference the deposit receipt entry they draw from, and a deposit receipt is refunded or forfeited at most once.
        evidence_fields: [independent_ledger.source_entry_id, independent_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.source_entry_id]
          action_bindings:
            independent_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: independent_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id, event_type: event_type}
          duplicate_filters: {event_type: [independent_deposit_refund, independent_deposit_forfeit, independent_deposit_applied]}
          distinct_fields: []
    formula:
      refund_amount_late: round(reservation_deposit * reservation_late_cancel_refund_pct / 100, 2)
      forfeit_amount_late: reservation_deposit - refund_amount_late

  - id: independent_move_in_billing
    subject: [independent_move_in, independent_deposit_applied, independent_community_fee_charge]
    rule: >-
      On the move-in date fees begin to accrue. The first month is billed from the move-in date through the last day of that calendar month as a prorated_move_in base fee charge, plus a prorated second person fee when the occupancy is double.
      The community fee is charged once per occupant position: community_fee_first_resident at move-in, and community_fee_second_resident when a second occupant moves in with the resident or is added later.
      The community fee is waived in full for a resident who holds an Entrance Fee Agreement for the apartment, and in that case no community fee row is written; a resident converting from a Larkspur trial or respite stay is charged the community fee and receives the respite conversion credit instead.
      The whole reservation deposit held is applied at move-in as a deposit_application credit referencing the deposit receipt.
      A community fee may be charged only while the residency is in active or notice_given status.
    eligibility:
      - id: community_fee_on_live_residency
        applies_to: [independent_community_fee_charge]
        kind: state
        condition: A community fee may be charged only while the residency is in active or notice_given status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given]
    params:
      per_tier:
        Independent Living Studio: {community_fee_first_resident: "=community_fee_first_resident", community_fee_second_resident: "=community_fee_second_resident"}
        Independent Living One-Bedroom: {community_fee_first_resident: "=community_fee_first_resident", community_fee_second_resident: "=community_fee_second_resident"}
        Independent Living One-Bedroom Deluxe: {community_fee_first_resident: "=community_fee_first_resident", community_fee_second_resident: "=community_fee_second_resident"}
        Independent Living Two-Bedroom: {community_fee_first_resident: "=community_fee_first_resident", community_fee_second_resident: "=community_fee_second_resident"}
        Independent Living Two-Bedroom Deluxe: {community_fee_first_resident: "=community_fee_first_resident", community_fee_second_resident: "=community_fee_second_resident"}
        Independent Living Cottage Home: {community_fee_first_resident: "=community_fee_first_resident", community_fee_second_resident: "=community_fee_second_resident"}

  - id: independent_monthly_billing
    subject: [independent_monthly_fee_charge]
    rule: >-
      Monthly fees are billed in advance on fee_due_day of each calendar month for that whole month: one base_fee charge of the contracted monthly_service_fee, and one second_person_fee charge of second_person_fee of the apartment type while the occupancy is double.
      Any span shorter than a whole calendar month - the move-in month, a mid-month rate change, a mid-month occupancy change or the month in which fees end - is prorated: the daily amount is the monthly amount divided by the actual number of days in that calendar month, multiplied by the days billed counted inclusive of both the first and last day, and rounded once to the cent half up.
      A mid-month change splits the month into separately billed spans, each with its own service_from_date, so that no day is billed twice for the same component.
      Monthly fee charges may be posted only while the residency is in active or notice_given status.
      Monthly fees continue unchanged while the resident is away from the apartment for any reason; independent living has no absence credit.
    eligibility:
      - id: billing_on_live_residency
        applies_to: [independent_monthly_fee_charge]
        kind: state
        condition: Monthly fee charges may be posted only while the residency is in active or notice_given status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given]
    formula:
      base_fee_amount: round(monthly_service_fee * days_billed / days_in_period, 2)
      second_person_amount: round(second_person_fee * days_billed / days_in_period, 2)
    params:
      per_tier:
        Independent Living Studio: {second_person_fee: "=second_person_fee"}
        Independent Living One-Bedroom: {second_person_fee: "=second_person_fee"}
        Independent Living One-Bedroom Deluxe: {second_person_fee: "=second_person_fee"}
        Independent Living Two-Bedroom: {second_person_fee: "=second_person_fee"}
        Independent Living Two-Bedroom Deluxe: {second_person_fee: "=second_person_fee"}
        Independent Living Cottage Home: {second_person_fee: "=second_person_fee"}

  - id: independent_rate_adjustment
    subject: [independent_rate_notice, independent_rate_adjust, independent_credit]
    rule: >-
      The monthly service fee is reviewed once a year and an increase normally takes effect on the first day of month rate_increase_effective_month.
      Written notice of each increase is mailed to the resident and recorded with its date and the proposed fee; the fee recorded when the increase takes effect is the proposed fee from that notice.
      An increase may be recorded, and may take effect, only on or after the date that is rate_increase_notice_days after written notice of the increase is mailed to the resident.
      Notice days are counted in calendar days from the day after the notice is mailed, so the increase may take effect on the date equal to the mailing date plus rate_increase_notice_days calendar days or any later date.
      No increase may take effect within new_resident_rate_guarantee_months calendar months after the move-in date; a resident whose guarantee ends after the normal effective date receives that year's increase on the first day of the calendar month following the end of the guarantee.
      The guarantee ends on the same day number new_resident_rate_guarantee_months calendar months after the move-in date, falling back to the last day of that month when the day number does not exist.
      The residency must be in active or notice_given status for an increase notice or an increase to be recorded.
      The new fee may not exceed the fee in effect immediately before by more than max_annual_increase_pct percent, rounded to the cent half up, and a residency receives at most one increase in any 12-month period.
      When an increase is recorded after fees for the effective month were already billed at the old fee, the difference for the days from the effective date is charged as a prorated_rate_change charge; when a fee is reduced on correction, the difference is returned as a rate_change_proration credit referencing the original charge.
      The base fees published for new agreements do not change the fee of an existing residency except through this policy.
    eligibility:
      - id: increase_notice_period
        applies_to: [independent_rate_adjust]
        kind: time
        condition: An increase may be recorded, and may take effect, only on or after the date that is rate_increase_notice_days after written notice of the increase is mailed to the resident.
        evidence_fields: [independent_residencies.rate_notice_date, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: written notice of the increase is mailed to the resident
          anchor_source: independent_residencies.rate_notice_date
          relation: not_before
          duration_source: variants.rate_increase_notice_days
          unit: calendar_days
          counting_rule: Notice days are counted in calendar days from the day after the notice is mailed, so the increase may take effect on the date equal to the mailing date plus rate_increase_notice_days calendar days or any later date.
          boundary: inclusive
      - id: rate_guarantee_period
        applies_to: [independent_rate_adjust]
        kind: time
        condition: No increase may take effect within new_resident_rate_guarantee_months calendar months after the move-in date; a resident whose guarantee ends after the normal effective date receives that year's increase on the first day of the calendar month following the end of the guarantee.
        evidence_fields: [independent_residencies.move_in_date, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the move-in date
          anchor_source: independent_residencies.move_in_date
          relation: not_before
          duration_source: variants.new_resident_rate_guarantee_months
          unit: calendar_months
          counting_rule: The guarantee ends on the same day number new_resident_rate_guarantee_months calendar months after the move-in date, falling back to the last day of that month when the day number does not exist.
          boundary: exclusive
      - id: increase_on_live_residency
        applies_to: [independent_rate_notice, independent_rate_adjust]
        kind: state
        condition: The residency must be in active or notice_given status for an increase notice or an increase to be recorded.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given]
    formula:
      max_new_fee: round(monthly_service_fee * (1 + max_annual_increase_pct / 100), 2)

  - id: independent_late_fee
    subject: [independent_late_fee_charge, independent_credit]
    rule: >-
      Monthly fees fall due on fee_due_day and may be paid without penalty during the grace period.
      A late fee may be assessed only after payment_grace_days have passed since the monthly fee charge for that billing period was posted.
      The grace period ends at the end of the day equal to the posting date of the monthly fee charge plus payment_grace_days calendar days, and a late fee may be assessed only on a later date.
      The past-due amount is independent_msr_period_past_due for that billing period; no late fee is assessed when it is below late_fee_min_past_due.
      Otherwise the late fee is the greater of late_fee_flat and late_fee_pct percent of the past-due amount rounded to the cent half up.
      At most one late fee is assessed per residency per billing period.
      A late fee may be assessed only while the residency is in active or notice_given status.
      On the resident's request a late fee may be waived as goodwill with a late_fee_waiver credit of the full late fee amount referencing that late fee entry, provided the past-due fees of that billing period have since been paid in full.
      A goodwill waiver is available only while independent_msr_late_fee_waivers_12m is below late_fee_goodwill_waivers_per_12m and independent_msr_returned_payments_12m is zero.
      Late fees are never charged on unpaid late fees, community fees or one-time service fees.
    eligibility:
      - id: grace_period_elapsed
        applies_to: [independent_late_fee_charge]
        kind: time
        condition: A late fee may be assessed only after payment_grace_days have passed since the monthly fee charge for that billing period was posted.
        evidence_fields: [independent_ledger.posting_date, independent_ledger.billing_period, independent_ledger.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.independent_residency_id, independent_ledger.billing_period]
          action_bindings:
            independent_ledger.independent_residency_id: independent_residency_id
            independent_ledger.billing_period: billing_period
        temporal_basis:
          clock: frozen_time
          anchor_event: the monthly fee charge for that billing period was posted
          anchor_source: independent_ledger.posting_date
          relation: not_before
          duration_source: variants.payment_grace_days
          unit: calendar_days
          counting_rule: The grace period ends at the end of the day equal to the posting date of the monthly fee charge plus payment_grace_days calendar days, and a late fee may be assessed only on a later date.
          boundary: exclusive
      - id: one_late_fee_per_period
        applies_to: [independent_late_fee_charge]
        kind: dedup
        condition: At most one late fee is assessed per residency per billing period.
        evidence_fields: [independent_ledger.independent_residency_id, independent_ledger.billing_period, independent_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.independent_residency_id, independent_ledger.billing_period]
          action_bindings:
            independent_ledger.independent_residency_id: independent_residency_id
            independent_ledger.billing_period: billing_period
        dedup_contract:
          table: independent_ledger
          mode: separate_record
          object_bindings: {independent_residency_id: independent_residency_id, billing_period: billing_period}
          duplicate_filters: {event_type: [independent_late_fee_charge]}
          distinct_fields: []
      - id: late_fee_on_live_residency
        applies_to: [independent_late_fee_charge]
        kind: state
        condition: A late fee may be assessed only while the residency is in active or notice_given status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given]
      - id: goodwill_waiver_quota
        applies_to: [independent_credit]
        kind: authorization
        condition: A goodwill waiver is available only while independent_msr_late_fee_waivers_12m is below late_fee_goodwill_waivers_per_12m and independent_msr_returned_payments_12m is zero.
        evidence_fields: [independent_ledger.credit_reason, independent_ledger.event_type, independent_ledger.posting_date, independent_ledger.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.independent_residency_id]
          action_bindings:
            independent_ledger.independent_residency_id: independent_residency_id
    measures: [independent_msr_period_past_due, independent_msr_late_fee_waivers_12m, independent_msr_returned_payments_12m]
    formula:
      when_not: independent_msr_period_past_due < late_fee_min_past_due
      late_fee_amount: max(late_fee_flat, round(independent_msr_period_past_due * late_fee_pct / 100, 2))

  - id: independent_payments_and_returns
    subject: [independent_payment, independent_payment_return, independent_service_fee_charge]
    rule: >-
      Payments are accepted by ACH autopay, one-time ACH, personal check, certified check, credit card or debit card, and each payment instrument is posted once under its own reference.
      A payment is applied to the oldest outstanding charge first, by billing period and then by posting date.
      A credit card payment carries a card_convenience fee of card_convenience_fee_pct percent of the payment amount, rounded to the cent half up and referencing the card payment entry; debit cards, ACH and checks carry no fee.
      When the bank returns a payment, the returned amount is reinstated referencing the returned payment entry, and a returned_payment fee of returned_payment_fee is charged referencing the same entry.
      Once independent_msr_returned_payments_12m reaches returned_payments_before_certified_funds, further payments on the residency are accepted only by certified check or ACH autopay until 365 days have passed since the latest return.
      Payments may be posted while the residency is in active, notice_given or vacated status; a payment toward a reservation is taken as the reservation deposit instead.
    eligibility:
      - id: payment_on_open_account
        applies_to: [independent_payment]
        kind: state
        condition: Payments may be posted while the residency is in active, notice_given or vacated status; a payment toward a reservation is taken as the reservation deposit instead.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given, vacated]
      - id: certified_funds_restriction
        applies_to: [independent_payment]
        kind: authorization
        condition: Once independent_msr_returned_payments_12m reaches returned_payments_before_certified_funds, further payments on the residency are accepted only by certified check or ACH autopay until 365 days have passed since the latest return.
        evidence_fields: [independent_ledger.event_type, independent_ledger.posting_date, independent_ledger.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.independent_residency_id]
          action_bindings:
            independent_ledger.independent_residency_id: independent_residency_id
      - id: return_once_per_payment
        applies_to: [independent_payment_return]
        kind: dedup
        condition: When the bank returns a payment, the returned amount is reinstated referencing the returned payment entry, and a returned_payment fee of returned_payment_fee is charged referencing the same entry.
        evidence_fields: [independent_ledger.source_entry_id, independent_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.source_entry_id]
          action_bindings:
            independent_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: independent_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [independent_payment_return]}
          distinct_fields: []
    measures: [independent_msr_returned_payments_12m]
    formula:
      card_fee_amount: round(amount * card_convenience_fee_pct / 100, 2)

  - id: independent_service_fees
    subject: [independent_service_fee_charge]
    rule: >-
      Scheduled service and amenity fees follow the apartment type's parameters and are posted under their fee code.
      A pet is registered only within max_pets and, for a dog, pet_weight_limit_lbs of the apartment type; registration posts pet_one_time_fee per pet, and pet_monthly_fee per pet is charged for each billing month in which the pet is registered, without proration.
      A storage unit is charged at storage_unit_monthly_fee per billing month only where storage_unit_included is false or a second unit is rented; covered parking is charged at covered_parking_monthly_fee per billing month for each space beyond covered_parking_included_spaces.
      Guest suite nights are posted one booking at a time of no more than guest_suite_max_consecutive_nights nights; nights are first drawn from guest_suite_included_nights_per_year as measured by independent_msr_guest_nights_calendar_year and posted at 0.00, and every further night is charged at guest_suite_nightly_rate.
      Key fob and pendant replacements are charged per item at key_fob_replacement_fee and pendant_replacement_fee.
      An after-hours lockout call is posted at 0.00 while independent_msr_lockouts_12m before the call is below included_lockouts_per_12m and at lockout_fee otherwise.
      The carpet_cleaning fee of the apartment type is charged once when the apartment is vacated, and an apartment_transfer fee equal to apartment_transfer_fee of the apartment type moved into is charged once per transfer.
      Service fees may be posted while the residency is in active, notice_given or vacated status.
      A service fee posted in error is reversed only through a billing_error credit referencing that fee entry.
    eligibility:
      - id: pet_limits
        applies_to: [independent_service_fee_charge]
        kind: caller_fact
        condition: A pet is registered only within max_pets and, for a dog, pet_weight_limit_lbs of the apartment type; registration posts pet_one_time_fee per pet, and pet_monthly_fee per pet is charged for each billing month in which the pet is registered, without proration.
        evidence_fields: [independent_ledger.fee_code, independent_ledger.quantity, independent_residencies.variant_name]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [independent_residencies.variant_name]
          action_bindings:
            independent_residencies.variant_name: variant_name
      - id: service_fee_on_open_residency
        applies_to: [independent_service_fee_charge]
        kind: state
        condition: Service fees may be posted while the residency is in active, notice_given or vacated status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given, vacated]
    measures: [independent_msr_guest_nights_calendar_year, independent_msr_lockouts_12m]
    params:
      per_tier:
        Independent Living Studio: {carpet_cleaning_fee: "=carpet_cleaning_fee", apartment_transfer_fee: "=apartment_transfer_fee", guest_suite_included_nights_per_year: "=guest_suite_included_nights_per_year", pet_monthly_fee: "=pet_monthly_fee", max_pets: "=max_pets", pet_weight_limit_lbs: "=pet_weight_limit_lbs", storage_unit_included: "=storage_unit_included", covered_parking_included_spaces: "=covered_parking_included_spaces"}
        Independent Living One-Bedroom: {carpet_cleaning_fee: "=carpet_cleaning_fee", apartment_transfer_fee: "=apartment_transfer_fee", guest_suite_included_nights_per_year: "=guest_suite_included_nights_per_year", pet_monthly_fee: "=pet_monthly_fee", max_pets: "=max_pets", pet_weight_limit_lbs: "=pet_weight_limit_lbs", storage_unit_included: "=storage_unit_included", covered_parking_included_spaces: "=covered_parking_included_spaces"}
        Independent Living One-Bedroom Deluxe: {carpet_cleaning_fee: "=carpet_cleaning_fee", apartment_transfer_fee: "=apartment_transfer_fee", guest_suite_included_nights_per_year: "=guest_suite_included_nights_per_year", pet_monthly_fee: "=pet_monthly_fee", max_pets: "=max_pets", pet_weight_limit_lbs: "=pet_weight_limit_lbs", storage_unit_included: "=storage_unit_included", covered_parking_included_spaces: "=covered_parking_included_spaces"}
        Independent Living Two-Bedroom: {carpet_cleaning_fee: "=carpet_cleaning_fee", apartment_transfer_fee: "=apartment_transfer_fee", guest_suite_included_nights_per_year: "=guest_suite_included_nights_per_year", pet_monthly_fee: "=pet_monthly_fee", max_pets: "=max_pets", pet_weight_limit_lbs: "=pet_weight_limit_lbs", storage_unit_included: "=storage_unit_included", covered_parking_included_spaces: "=covered_parking_included_spaces"}
        Independent Living Two-Bedroom Deluxe: {carpet_cleaning_fee: "=carpet_cleaning_fee", apartment_transfer_fee: "=apartment_transfer_fee", guest_suite_included_nights_per_year: "=guest_suite_included_nights_per_year", pet_monthly_fee: "=pet_monthly_fee", max_pets: "=max_pets", pet_weight_limit_lbs: "=pet_weight_limit_lbs", storage_unit_included: "=storage_unit_included", covered_parking_included_spaces: "=covered_parking_included_spaces"}
        Independent Living Cottage Home: {carpet_cleaning_fee: "=carpet_cleaning_fee", apartment_transfer_fee: "=apartment_transfer_fee", guest_suite_included_nights_per_year: "=guest_suite_included_nights_per_year", pet_monthly_fee: "=pet_monthly_fee", max_pets: "=max_pets", pet_weight_limit_lbs: "=pet_weight_limit_lbs", storage_unit_included: "=storage_unit_included", covered_parking_included_spaces: "=covered_parking_included_spaces"}

  - id: independent_move_out_notice
    subject: [independent_notice_record, independent_notice_withdraw]
    rule: >-
      A residency is terminated by the resident only through a written notice of termination signed on the resident's behalf; the desk registers the notice request with the intended vacate date the resident states and the resident signs it.
      The notice must be signed by the resident, or by a representative whose representative_authority on the customer profile is financial_poa, durable_poa or guardian; a healthcare_poa or an authorized_contact alone cannot give notice.
      The notice period is move_out_notice_days for a resident leaving Larkspur and internal_transfer_notice_days when the notice states a move to a Larkspur assisted living or memory care residence; the intended vacate date may be earlier than the end of the notice period, but fees still run as set by the fee end policy.
      A notice may be withdrawn only before the intended vacate date stated on it.
      The withdrawal window is counted in calendar days and closes at the end of the day before the intended vacate date, so a withdrawal signed on the intended vacate date itself is refused.
      After a withdrawal the residency continues unchanged as if no notice had been given, and a later departure needs a new notice with a new notice period.
    eligibility:
      - id: signer_authority
        applies_to: [independent_notice_record, independent_notice_withdraw]
        kind: authorization
        condition: The notice must be signed by the resident, or by a representative whose representative_authority on the customer profile is financial_poa, durable_poa or guardian; a healthcare_poa or an authorized_contact alone cannot give notice.
        evidence_fields: [customers.representative_authority, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: withdraw_before_vacate_date
        applies_to: [independent_notice_withdraw]
        kind: time
        condition: A notice may be withdrawn only before the intended vacate date stated on it.
        evidence_fields: [independent_residencies.intended_vacate_date, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the intended vacate date stated on it
          anchor_source: independent_residencies.intended_vacate_date
          relation: not_after
          duration_source: params.withdrawal_cutoff_days
          unit: calendar_days
          counting_rule: The withdrawal window is counted in calendar days and closes at the end of the day before the intended vacate date, so a withdrawal signed on the intended vacate date itself is refused.
          boundary: exclusive
    params:
      withdrawal_cutoff_days: 0
      per_tier:
        Independent Living Studio: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days"}
        Independent Living One-Bedroom: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days"}
        Independent Living One-Bedroom Deluxe: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days"}
        Independent Living Two-Bedroom: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days"}
        Independent Living Two-Bedroom Deluxe: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days"}
        Independent Living Cottage Home: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days"}

  - id: independent_fee_end_and_proration
    subject: [independent_vacate, independent_end_without_notice, independent_monthly_fee_charge, independent_credit]
    rule: >-
      When a residency ends, monthly fees run through a fee end date fixed by how it ended.
      After a resident notice the fee end date is the later of the vacate date and the notice end date, the notice end date being the notice date plus move_out_notice_days calendar days.
      After a notice stating a move to a Larkspur assisted living or memory care residence, and for an internal transfer recorded without notice, the fee end date is the later of the vacate date and the notice date plus internal_transfer_notice_days calendar days.
      On the death of the last occupant the fee end date is the later of the date belongings are removed (the vacate date) and the date of death plus post_death_fee_days calendar days, the date of death being date_of_death on the customer profile.
      After a discharge for nonpayment the fee end date is the vacate date.
      Fees are charged through the fee end date inclusive. Where the fee end date falls before the last day of a month already billed, the days after it are returned as a move_out_proration credit referencing that month's full_month charge; where it falls in a month not yet billed, a prorated_move_out charge covers the first of that month through the fee end date.
      An ending recorded as death requires date_of_death on the customer profile, and an ending recorded as a transfer requires the customer's Larkspur assisted living or memory care residency to be active; a family member's statement alone is not enough for either.
      The second person fee ends on the same fee end date unless the second occupant left earlier.
      When only one of two occupants dies or leaves, the residency does not end; the occupancy changes to single under the occupancy policy.
    eligibility:
      - id: death_or_transfer_on_record
        applies_to: [independent_end_without_notice]
        kind: authorization
        condition: An ending recorded as death requires date_of_death on the customer profile, and an ending recorded as a transfer requires the customer's Larkspur assisted living or memory care residency to be active; a family member's statement alone is not enough for either.
        evidence_fields: [customers.date_of_death, assisted_residencies.status, memory_residencies.status, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params:
      per_tier:
        Independent Living Studio: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days", post_death_fee_days: "=post_death_fee_days"}
        Independent Living One-Bedroom: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days", post_death_fee_days: "=post_death_fee_days"}
        Independent Living One-Bedroom Deluxe: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days", post_death_fee_days: "=post_death_fee_days"}
        Independent Living Two-Bedroom: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days", post_death_fee_days: "=post_death_fee_days"}
        Independent Living Two-Bedroom Deluxe: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days", post_death_fee_days: "=post_death_fee_days"}
        Independent Living Cottage Home: {move_out_notice_days: "=move_out_notice_days", internal_transfer_notice_days: "=internal_transfer_notice_days", post_death_fee_days: "=post_death_fee_days"}
    formula:
      proration_credit: round(monthly_service_fee * days_billed / days_in_period, 2)

  - id: independent_final_statement
    subject: [independent_account_close, independent_credit_balance_refund]
    rule: >-
      After the apartment is vacated a final statement is issued no later than final_statement_days calendar days after the vacate date, showing every charge through the fee end date, the carpet cleaning fee and every credit.
      A credit balance shown on the final statement is refunded by check or ACH in one refund payable to the resident, or to the resident's estate when date_of_death is on the customer profile.
      A credit balance refund may be issued only while the residency is in vacated status; a credit balance on a continuing residency is carried forward to the next billing month instead.
      The residency file may be closed only when account_balance and reservation_deposit_held are both 0.00.
      An unpaid balance on a vacated residency stays open for collection and is never written off by the desk.
    eligibility:
      - id: refund_only_after_vacate
        applies_to: [independent_credit_balance_refund]
        kind: state
        condition: A credit balance refund may be issued only while the residency is in vacated status; a credit balance on a continuing residency is carried forward to the next billing month instead.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [vacated]
      - id: zero_balances_to_close
        applies_to: [independent_account_close]
        kind: authorization
        condition: The residency file may be closed only when account_balance and reservation_deposit_held are both 0.00.
        evidence_fields: [independent_residencies.account_balance, independent_residencies.reservation_deposit_held, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
    params:
      per_tier:
        Independent Living Studio: {final_statement_days: "=final_statement_days"}
        Independent Living One-Bedroom: {final_statement_days: "=final_statement_days"}
        Independent Living One-Bedroom Deluxe: {final_statement_days: "=final_statement_days"}
        Independent Living Two-Bedroom: {final_statement_days: "=final_statement_days"}
        Independent Living Two-Bedroom Deluxe: {final_statement_days: "=final_statement_days"}
        Independent Living Cottage Home: {final_statement_days: "=final_statement_days"}

  - id: independent_occupancy_and_transfer
    subject: [independent_occupancy_change, independent_apartment_transfer]
    rule: >-
      A second occupant may be added only where max_occupants of the apartment type is 2 and the second occupant is at least second_occupant_min_age years old on the day they move in.
      From the day a second occupant moves in, the second_person_fee of the apartment type is billed (prorated for the first month) and community_fee_second_resident is charged each time a second occupant moves in.
      When a second occupant leaves or dies, the occupancy becomes single and the second person fee ends on the day they leave or the date of death, with the days after it returned as a move_out_proration credit.
      An apartment transfer is made only at the resident's signed request to a vacant apartment in the same community, and only while the residency is active.
      The monthly service fee for the new apartment is base_monthly_fee of the new apartment type published on the transfer date, effective on the day the resident takes possession, and an apartment_transfer fee of the type moved into is charged; the new rate guarantee does not restart.
      A transfer to a Studio is possible only at single occupancy.
      Occupancy changes may be recorded while the residency is in active or notice_given status.
    eligibility:
      - id: second_occupant_allowed
        applies_to: [independent_occupancy_change]
        kind: caller_fact
        condition: A second occupant may be added only where max_occupants of the apartment type is 2 and the second occupant is at least second_occupant_min_age years old on the day they move in.
        evidence_fields: [independent_residencies.variant_name, independent_residencies.second_occupant_name]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [independent_residencies.variant_name]
          action_bindings:
            independent_residencies.variant_name: variant_name
      - id: transfer_only_when_active
        applies_to: [independent_apartment_transfer]
        kind: state
        condition: An apartment transfer is made only at the resident's signed request to a vacant apartment in the same community, and only while the residency is active.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active]
      - id: occupancy_on_live_residency
        applies_to: [independent_occupancy_change]
        kind: state
        condition: Occupancy changes may be recorded while the residency is in active or notice_given status.
        evidence_fields: [independent_residencies.status, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        state_contract:
          field: independent_residencies.status
          allowed: [active, notice_given]
    params:
      per_tier:
        Independent Living Studio: {max_occupants: "=max_occupants", second_person_fee: "=second_person_fee", community_fee_second_resident: "=community_fee_second_resident", apartment_transfer_fee: "=apartment_transfer_fee"}
        Independent Living One-Bedroom: {max_occupants: "=max_occupants", second_person_fee: "=second_person_fee", community_fee_second_resident: "=community_fee_second_resident", apartment_transfer_fee: "=apartment_transfer_fee"}
        Independent Living One-Bedroom Deluxe: {max_occupants: "=max_occupants", second_person_fee: "=second_person_fee", community_fee_second_resident: "=community_fee_second_resident", apartment_transfer_fee: "=apartment_transfer_fee"}
        Independent Living Two-Bedroom: {max_occupants: "=max_occupants", second_person_fee: "=second_person_fee", community_fee_second_resident: "=community_fee_second_resident", apartment_transfer_fee: "=apartment_transfer_fee"}
        Independent Living Two-Bedroom Deluxe: {max_occupants: "=max_occupants", second_person_fee: "=second_person_fee", community_fee_second_resident: "=community_fee_second_resident", apartment_transfer_fee: "=apartment_transfer_fee"}
        Independent Living Cottage Home: {max_occupants: "=max_occupants", second_person_fee: "=second_person_fee", community_fee_second_resident: "=community_fee_second_resident", apartment_transfer_fee: "=apartment_transfer_fee"}

  - id: independent_billing_corrections
    subject: [independent_credit]
    rule: >-
      A charge posted in error - a wrong amount, a wrong apartment type, a duplicate posting or a fee that does not apply - is corrected only by a billing_error credit referencing the exact charge entry being corrected; charges are never deleted.
      The credit may not exceed the amount of that charge entry less any credits already posted against it, and the correct charge, where one is due, is posted again as a new entry.
      Each charge entry receives at most one billing_error credit.
      A disputed charge that the records show was correctly posted under the policies of this charter is not credited.
      A respite_conversion credit is posted only as the consequence of a converted Larkspur trial or respite stay, for the amount the respite charter fixes, carrying the respite stay it comes from; each respite stay yields at most one conversion credit.
    eligibility:
      - id: one_correction_per_charge
        applies_to: [independent_credit]
        kind: dedup
        condition: Each charge entry receives at most one billing_error credit.
        evidence_fields: [independent_ledger.source_entry_id, independent_ledger.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.source_entry_id]
          action_bindings:
            independent_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: independent_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {credit_reason: [billing_error]}
          distinct_fields: []

  - id: independent_referral_credit
    subject: [independent_credit]
    rule: >-
      A resident who is named as referred_by_customer_id on another customer's independent living residency earns a referral_credit of referral_credit_amount on the referrer's own residency.
      The credit is granted only after the referred resident has been in residence for referral_credit_qualifying_days.
      The qualifying period is counted in calendar days from the referred resident's move-in date, the move-in date being day 0, and the credit may be granted on the day the count reaches referral_credit_qualifying_days or later.
      The referrer's residency must be active when the credit is granted, and a referrer receives no more than referral_credits_per_12m_cap referral credits within independent_msr_referral_credits_12m.
      Each referred residency earns one referral credit only, referenced by referred_residency_id; a referral named after the referred resident's reservation was opened does not qualify.
    eligibility:
      - id: referred_resident_qualified
        applies_to: [independent_credit]
        kind: time
        condition: The credit is granted only after the referred resident has been in residence for referral_credit_qualifying_days.
        evidence_fields: [independent_residencies.move_in_date, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: referred_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the referred resident has been in residence
          anchor_source: independent_residencies.move_in_date
          relation: not_before
          duration_source: variants.referral_credit_qualifying_days
          unit: calendar_days
          counting_rule: The qualifying period is counted in calendar days from the referred resident's move-in date, the move-in date being day 0, and the credit may be granted on the day the count reaches referral_credit_qualifying_days or later.
          boundary: inclusive
      - id: one_credit_per_referral
        applies_to: [independent_credit]
        kind: dedup
        condition: Each referred residency earns one referral credit only, referenced by referred_residency_id; a referral named after the referred resident's reservation was opened does not qualify.
        evidence_fields: [independent_ledger.referred_residency_id, independent_ledger.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_ledger.referred_residency_id]
          action_bindings:
            independent_ledger.referred_residency_id: referred_residency_id
        dedup_contract:
          table: independent_ledger
          mode: separate_record
          object_bindings: {referred_residency_id: referred_residency_id}
          duplicate_filters: {credit_reason: [referral_credit]}
          distinct_fields: []
    measures: [independent_msr_referral_credits_12m]

  - id: independent_nonpayment_discharge
    subject: [independent_end_without_notice]
    rule: >-
      Larkspur may end a residency for nonpayment only after a monthly fee has remained past due for at least past_due_days_before_discharge_notice and a written discharge notice has been issued by the community's executive director.
      The residency may be ended for nonpayment only once discharge_notice_days have passed since the discharge notice was issued.
      The discharge period is counted in calendar days from the notice date recorded on the residency, and the residency may be ended on the notice date plus discharge_notice_days calendar days or later.
      Payment in full of the past-due amount before the end of the discharge period cancels the discharge, and the desk never issues or cancels a discharge notice itself; a request to stop or delay a discharge is outside the desk's authority.
    eligibility:
      - id: discharge_period_elapsed
        applies_to: [independent_end_without_notice]
        kind: time
        condition: The residency may be ended for nonpayment only once discharge_notice_days have passed since the discharge notice was issued.
        evidence_fields: [independent_residencies.notice_date, independent_residencies.independent_residency_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.independent_residency_id]
          action_bindings:
            independent_residencies.independent_residency_id: independent_residency_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the discharge notice was issued
          anchor_source: independent_residencies.notice_date
          relation: not_before
          duration_source: variants.discharge_notice_days
          unit: calendar_days
          counting_rule: The discharge period is counted in calendar days from the notice date recorded on the residency, and the residency may be ended on the notice date plus discharge_notice_days calendar days or later.
          boundary: inclusive

extended_policies:
  - id: independent_ext_annual_increase_fee
    base_policy_refs: [independent_rate_adjustment]
    overwrite:
      - base_policy: independent_rate_adjustment
        superseded_clause: >-
          the fee recorded when the increase takes effect is the proposed fee from that notice
        replaced_by: >-
          Where the noticed fee exceeds the ceiling fee, the ceiling fee is recorded; where the noticed fee is lower than the fee in effect immediately before the increase, that fee is recorded unchanged, because an annual increase never lowers the fee; otherwise the noticed fee is recorded.
      - base_policy: independent_rate_adjustment
        superseded_clause: >-
          The new fee may not exceed the fee in effect immediately before by more than max_annual_increase_pct percent, rounded to the cent half up
        replaced_by: >-
          The two reductions are subtracted from the contract ceiling percentage to give the increase ceiling percentage, and the ceiling fee is the fee in effect immediately before the increase raised by the increase ceiling percentage, rounded once to the cent half up.
    trigger: state_due
    subject: [independent_rate_adjust]
    computes: monthly_service_fee
    target_tool: record_annual_increase_315a2923
    params:
      lifecare_ceiling_pct: 4.0
      life_choice_ceiling_pct: 6.0
      long_residence_months: 84
      mid_residence_months: 36
      long_residence_ceiling_relief_pts: 1.0
      mid_residence_ceiling_relief_pts: 0.5
      no_return_ceiling_relief_pts: 0.5
      one_return_ceiling_relief_pts: 0.25
    rule: >-
      The fee recorded when an annual increase takes effect is the fee stated in the written notice of that increase mailed to the resident.
      The fee in effect immediately before the increase is the amount of the latest full-month base fee charge on the residency ledger.
      The contract ceiling percentage of an annual increase follows the resident's Larkspur contract: a resident whose occupied Entrance Fee Agreement names this residency under a lifecare plan has a contract ceiling of lifecare_ceiling_pct percent; a resident whose occupied Entrance Fee Agreement names this residency under a fee-for-service plan has a contract ceiling of life_choice_ceiling_pct percent; any other resident has a contract ceiling of max_annual_increase_pct percent.
      The contract ceiling is reduced for length of residence, counted in whole calendar months from the move-in date to the day the increase is recorded: a resident in residence for long_residence_months months or more has it reduced by long_residence_ceiling_relief_pts percentage points; a resident in residence for mid_residence_months months or more but fewer than long_residence_months months has it reduced by mid_residence_ceiling_relief_pts percentage points; a resident in residence for fewer than mid_residence_months months has no residence reduction.
      The contract ceiling is also reduced for payment standing, counted as the returned payments posted on the residency within the 12 months ending on the day the increase is recorded: a residency with no returned payment has it reduced by no_return_ceiling_relief_pts percentage points; a residency with exactly one returned payment has it reduced by one_return_ceiling_relief_pts percentage points; a residency with two or more returned payments has no standing reduction.
      The two reductions are subtracted from the contract ceiling percentage to give the increase ceiling percentage, and the ceiling fee is the fee in effect immediately before the increase raised by the increase ceiling percentage, rounded once to the cent half up.
      Where the noticed fee exceeds the ceiling fee, the ceiling fee is recorded; where the noticed fee is lower than the fee in effect immediately before the increase, that fee is recorded unchanged, because an annual increase never lowers the fee; otherwise the noticed fee is recorded.
      The recorded fee takes effect on the date the notice period and the new-resident guarantee allow, and the second person fee is not part of the increase.
    prerequisite: []
    cross_category:
      - category: entrance
        as: branch
        reads: [status, variant_name, independent_residency_id]
        note: The plan type and the residency named on the customer's occupied Entrance Fee Agreement decide the tier of the contract ceiling percentage.
    compute:
      - billed_fee_before: "LATEST('independent_ledger', 'amount', date_field='posting_date', event_type='independent_monthly_fee_charge', fee_component='base_fee', charge_basis='full_month')"
      - noticed_fee: "F('proposed_monthly_service_fee')"
      - plan_contract_type: "CPARAM('entrance', 'contract_type', status='occupied')"
      - plan_residency: "CFIELD('entrance', 'independent_residency_id', status='occupied')"
      - contract_ceiling_pct: "K('lifecare_ceiling_pct') if (plan_contract_type == 'lifecare' and plan_residency == HID) else (K('life_choice_ceiling_pct') if (plan_contract_type == 'fee_for_service' and plan_residency == HID) else P('max_annual_increase_pct'))"
      - months_in_residence: "MONTHS(F('move_in_date'), NOW)"
      - residence_relief_pts: "K('long_residence_ceiling_relief_pts') if months_in_residence >= K('long_residence_months') else (K('mid_residence_ceiling_relief_pts') if months_in_residence >= K('mid_residence_months') else 0)"
      - returned_payments_12m: "COUNT('independent_ledger', within_months=12, date_field='posting_date', event_type='independent_payment_return')"
      - standing_relief_pts: "K('no_return_ceiling_relief_pts') if returned_payments_12m == 0 else (K('one_return_ceiling_relief_pts') if returned_payments_12m == 1 else 0)"
      - increase_ceiling_pct: "contract_ceiling_pct - residence_relief_pts - standing_relief_pts"
      - ceiling_fee: "RND(billed_fee_before * (1 + increase_ceiling_pct / 100), 2)"
      - recorded_fee: "ceiling_fee if noticed_fee > ceiling_fee else (billed_fee_before if noticed_fee < billed_fee_before else noticed_fee)"
      - result: "RND(recorded_fee, 2)"
    compute_basis:
      billed_fee_before: "The fee in effect immediately before the increase is the amount of the latest full-month base fee charge on the residency ledger."
      noticed_fee: "The fee recorded when an annual increase takes effect is the fee stated in the written notice of that increase mailed to the resident."
      plan_contract_type: "a resident whose occupied Entrance Fee Agreement names this residency under a lifecare plan has a contract ceiling of lifecare_ceiling_pct percent"
      plan_residency: "a resident whose occupied Entrance Fee Agreement names this residency under a fee-for-service plan has a contract ceiling of life_choice_ceiling_pct percent"
      contract_ceiling_pct: "The contract ceiling percentage of an annual increase follows the resident's Larkspur contract: a resident whose occupied Entrance Fee Agreement names this residency under a lifecare plan has a contract ceiling of lifecare_ceiling_pct percent; a resident whose occupied Entrance Fee Agreement names this residency under a fee-for-service plan has a contract ceiling of life_choice_ceiling_pct percent; any other resident has a contract ceiling of max_annual_increase_pct percent."
      months_in_residence: "counted in whole calendar months from the move-in date to the day the increase is recorded"
      residence_relief_pts: "a resident in residence for long_residence_months months or more has it reduced by long_residence_ceiling_relief_pts percentage points; a resident in residence for mid_residence_months months or more but fewer than long_residence_months months has it reduced by mid_residence_ceiling_relief_pts percentage points; a resident in residence for fewer than mid_residence_months months has no residence reduction."
      returned_payments_12m: "counted as the returned payments posted on the residency within the 12 months ending on the day the increase is recorded"
      standing_relief_pts: "a residency with no returned payment has it reduced by no_return_ceiling_relief_pts percentage points; a residency with exactly one returned payment has it reduced by one_return_ceiling_relief_pts percentage points; a residency with two or more returned payments has no standing reduction."
      increase_ceiling_pct: "The two reductions are subtracted from the contract ceiling percentage to give the increase ceiling percentage"
      ceiling_fee: "the ceiling fee is the fee in effect immediately before the increase raised by the increase ceiling percentage, rounded once to the cent half up."
      recorded_fee: "Where the noticed fee exceeds the ceiling fee, the ceiling fee is recorded; where the noticed fee is lower than the fee in effect immediately before the increase, that fee is recorded unchanged, because an annual increase never lowers the fee; otherwise the noticed fee is recorded."
    factors:
      - id: contract_ceiling
        effect: parameter
        decides: contract_ceiling_pct
        bindings: [plan_contract_type, plan_residency, contract_ceiling_pct]
        ladder:
          - when: "an occupied Entrance Fee Agreement names this residency and its plan is a lifecare plan"
            value: "K('lifecare_ceiling_pct')"
          - when: "an occupied Entrance Fee Agreement names this residency and its plan is a fee-for-service plan"
            value: "K('life_choice_ceiling_pct')"
          - when: "otherwise"
            value: "P('max_annual_increase_pct')"
        baseline:
          contract_ceiling_pct: "P('max_annual_increase_pct')"
        evidence: [cross_category]
        cross_difficulty: entrance
      - id: residence_relief
        effect: parameter
        decides: residence_relief_pts
        bindings: [months_in_residence, residence_relief_pts]
        ladder:
          - when: "whole calendar months from the move-in date to the day the increase is recorded are long_residence_months or more"
            value: "K('long_residence_ceiling_relief_pts')"
          - when: "those months are mid_residence_months or more but fewer than long_residence_months"
            value: "K('mid_residence_ceiling_relief_pts')"
          - when: "otherwise"
            value: "0"
        baseline:
          residence_relief_pts: "0"
        evidence: [date]
        cross_difficulty: null
      - id: standing_relief
        effect: parameter
        decides: standing_relief_pts
        bindings: [returned_payments_12m, standing_relief_pts]
        ladder:
          - when: "no returned payment posted on the residency within the 12 months ending on the day the increase is recorded"
            value: "K('no_return_ceiling_relief_pts')"
          - when: "exactly one returned payment posted within those 12 months"
            value: "K('one_return_ceiling_relief_pts')"
          - when: "otherwise"
            value: "0"
        baseline:
          standing_relief_pts: "0"
        evidence: [history]
        cross_difficulty: null
      - id: fee_selection
        effect: method
        decides: recorded_fee
        bindings: [billed_fee_before, recorded_fee]
        ladder:
          - when: "the noticed fee exceeds the ceiling fee"
            method: "the ceiling fee is recorded in place of the noticed fee"
          - when: "the noticed fee is lower than the fee in effect immediately before the increase"
            method: "the fee in effect immediately before the increase is recorded unchanged"
          - when: "otherwise"
            method: "the noticed fee is recorded as stated"
        baseline:
          recorded_fee: "noticed_fee"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The fee recorded when an annual increase takes effect is the fee stated in the written notice of that increase mailed to the resident.
      params: []
    inputs:
      history:
        - {table: independent_ledger, aggregate: latest, field: amount, filters: {event_type: independent_monthly_fee_charge, fee_component: base_fee, charge_basis: full_month}}
        - {table: independent_ledger, aggregate: count, field: independent_entry_id, within_months: 12, filters: {event_type: independent_payment_return}}
      cross_category: [entrance]

  - id: independent_ext_period_late_fee
    base_policy_refs: [independent_late_fee]
    overwrite:
      - base_policy: independent_late_fee
        superseded_clause: >-
          The past-due amount is independent_msr_period_past_due for that billing period
        replaced_by: >-
          The past-due amount of the billing period is those charges less the payments posted within the one month ending on the day of assessment.
      - base_policy: independent_late_fee
        superseded_clause: >-
          Otherwise the late fee is the greater of late_fee_flat and late_fee_pct percent of the past-due amount rounded to the cent half up.
        replaced_by: >-
          The late fee is the greater of late_fee_flat and the late fee percentage of the past-due amount of the billing period, the percentage amount rounded to the cent half up.
    trigger: state_due
    subject: [independent_late_fee_charge]
    computes: late_fee_amount
    target_tool: assess_late_fee_72eb1d9b
    params:
      two_prior_late_fee_pct: 3.0
      one_prior_late_fee_pct: 2.25
      long_residence_months: 84
      mid_residence_months: 36
      long_residence_pct_relief_pts: 0.5
      mid_residence_pct_relief_pts: 0.25
      lifecare_pct_relief_pts: 0.75
      life_choice_pct_relief_pts: 0.25
      daily_late_charge: 4.00
      daily_charge_cap_days: 15
      daily_charge_cap: 60.00
      daily_charge_free_days: 5
    rule: >-
      A late fee assessed for a billing period is computed from the past-due amount of that period.
      The billing period assessed is the billing period of the latest monthly fee charge on the residency ledger, and its charges are the monthly fee charges and the recurring service fee charges carrying that billing period; late fees, community fees and one-time service fees are never among them.
      The past-due amount of the billing period is those charges less the payments posted within the one month ending on the day of assessment.
      The late fee percentage is late_fee_pct.
      The late fee is the greater of late_fee_flat and the late fee percentage of the past-due amount of the billing period, the percentage amount rounded to the cent half up.
      No late fee is assessed when the past-due amount of the billing period is below late_fee_min_past_due.
      How the past-due amount of the billing period is reckoned depends on what else was posted: where a returned payment was posted within the one month ending on the day of assessment, the returned amount counts as never received, so the past-due amount is the charges less those payments net of the returned amounts and less the credits carrying that billing period; where no returned payment was posted within that month but credits carrying that billing period were posted, the past-due amount is the charges less those payments and less those credits; otherwise the past-due amount is the charges less those payments.
      Repeated lateness raises the late fee percentage, counted as the late fees posted on the residency within the 12 months ending on the day of assessment: a residency with two or more such late fees has a late fee percentage of two_prior_late_fee_pct; a residency with exactly one such late fee has a late fee percentage of one_prior_late_fee_pct; a residency with no such late fee keeps late_fee_pct.
      Length of residence lowers the late fee percentage, counted in whole calendar months from the move-in date to the day of assessment: long_residence_months months or more lowers it by long_residence_pct_relief_pts percentage points; mid_residence_months months or more but fewer than long_residence_months months lowers it by mid_residence_pct_relief_pts percentage points; fewer than mid_residence_months months lowers it by nothing.
      A resident holding an occupied Entrance Fee Agreement has the late fee percentage lowered by the plan's terms: a lifecare plan lowers it by lifecare_pct_relief_pts percentage points; a fee-for-service plan lowers it by life_choice_pct_relief_pts percentage points; a resident with no occupied Entrance Fee Agreement has no plan reduction.
      Both reductions are subtracted from the late fee percentage, never below zero, before the percentage is applied to the past-due amount of the billing period.
      The returned payment fee already charged for a returned payment is credited against the late fee: where exactly one returned payment was posted within the 12 months ending on the day of assessment and an ACH autopay payment was posted within the one month ending on that day, the late fee is reduced by returned_payment_fee; where exactly one returned payment was posted within those 12 months and no ACH autopay payment was posted within that month, the late fee is reduced by half of returned_payment_fee, rounded to the cent half up; otherwise the late fee is not reduced.
      A daily late charge runs from the day after the grace period ends, the grace period ending payment_grace_days days after the posting date of the monthly fee charge of the billing period, and is counted in calendar days up to and including the day of assessment: where daily_charge_cap_days days or more have run, the daily late charge is the capped amount daily_charge_cap; where more than daily_charge_free_days days but fewer than daily_charge_cap_days days have run, it is daily_late_charge for each day that has run; where daily_charge_free_days days or fewer have run, there is none.
      The late fee assessed is the greater amount above, then reduced by the returned payment fee credit, then increased by the daily late charge, never below zero, and rounded once to the cent half up.
    prerequisite: []
    cross_category:
      - category: entrance
        as: branch
        reads: [status, variant_name]
        note: The plan type of the customer's occupied Entrance Fee Agreement decides the tier of the plan reduction of the late fee percentage.
    compute:
      - assessed_period: "LATEST('independent_ledger', 'billing_period', date_field='posting_date', event_type='independent_monthly_fee_charge')"
      - period_monthly_charges: "SUM('independent_ledger', 'amount', event_type='independent_monthly_fee_charge', billing_period=assessed_period)"
      - period_recurring_charges: "SUM('independent_ledger', 'amount', event_type='independent_service_fee_charge', billing_period=assessed_period)"
      - period_charges: "period_monthly_charges + period_recurring_charges"
      - month_payments: "SUM('independent_ledger', 'amount', within_months=1, date_field='posting_date', event_type='independent_payment')"
      - month_returns: "SUM('independent_ledger', 'amount', within_months=1, date_field='posting_date', event_type='independent_payment_return')"
      - period_credits: "SUM('independent_ledger', 'amount', event_type='independent_credit', billing_period=assessed_period)"
      - period_past_due: "(period_charges - (month_payments - month_returns) - period_credits) if month_returns > 0 else ((period_charges - month_payments - period_credits) if period_credits > 0 else (period_charges - month_payments))"
      - prior_late_fees_12m: "COUNT('independent_ledger', within_months=12, date_field='posting_date', event_type='independent_late_fee_charge')"
      - escalated_pct: "K('two_prior_late_fee_pct') if prior_late_fees_12m >= 2 else (K('one_prior_late_fee_pct') if prior_late_fees_12m == 1 else P('late_fee_pct'))"
      - residence_months: "MONTHS(F('move_in_date'), NOW)"
      - residence_pct_relief: "K('long_residence_pct_relief_pts') if residence_months >= K('long_residence_months') else (K('mid_residence_pct_relief_pts') if residence_months >= K('mid_residence_months') else 0)"
      - plan_type: "CPARAM('entrance', 'contract_type', status='occupied')"
      - plan_pct_relief: "K('lifecare_pct_relief_pts') if plan_type == 'lifecare' else (K('life_choice_pct_relief_pts') if plan_type == 'fee_for_service' else 0)"
      - applied_pct: "MX(0, escalated_pct - residence_pct_relief - plan_pct_relief)"
      - percentage_amount: "RND(period_past_due * applied_pct / 100, 2)"
      - greater_amount: "MX(P('late_fee_flat'), percentage_amount)"
      - returns_12m: "COUNT('independent_ledger', within_months=12, date_field='posting_date', event_type='independent_payment_return')"
      - autopay_payments_month: "COUNT('independent_ledger', within_months=1, date_field='posting_date', event_type='independent_payment', payment_method='ach_autopay')"
      - returned_fee_credit: "P('returned_payment_fee') if (returns_12m == 1 and autopay_payments_month >= 1) else (RND(P('returned_payment_fee') / 2, 2) if (returns_12m == 1 and autopay_payments_month == 0) else 0)"
      - period_charge_posted: "LATEST('independent_ledger', 'posting_date', date_field='posting_date', event_type='independent_monthly_fee_charge', billing_period=assessed_period)"
      - days_after_grace: "DAYS(period_charge_posted, NOW) - P('payment_grace_days')"
      - daily_charge: "K('daily_charge_cap') if days_after_grace >= K('daily_charge_cap_days') else ((days_after_grace * K('daily_late_charge')) if days_after_grace > K('daily_charge_free_days') else 0)"
      - result: "RND(MX(0, greater_amount - returned_fee_credit + daily_charge), 2) if period_past_due >= P('late_fee_min_past_due') else 0"
    compute_basis:
      assessed_period: "The billing period assessed is the billing period of the latest monthly fee charge on the residency ledger"
      period_monthly_charges: "its charges are the monthly fee charges and the recurring service fee charges carrying that billing period"
      period_recurring_charges: "its charges are the monthly fee charges and the recurring service fee charges carrying that billing period; late fees, community fees and one-time service fees are never among them."
      month_payments: "The past-due amount of the billing period is those charges less the payments posted within the one month ending on the day of assessment."
      month_returns: "where a returned payment was posted within the one month ending on the day of assessment, the returned amount counts as never received"
      period_credits: "where no returned payment was posted within that month but credits carrying that billing period were posted, the past-due amount is the charges less those payments and less those credits"
      period_past_due: "How the past-due amount of the billing period is reckoned depends on what else was posted: where a returned payment was posted within the one month ending on the day of assessment, the returned amount counts as never received, so the past-due amount is the charges less those payments net of the returned amounts and less the credits carrying that billing period; where no returned payment was posted within that month but credits carrying that billing period were posted, the past-due amount is the charges less those payments and less those credits; otherwise the past-due amount is the charges less those payments."
      prior_late_fees_12m: "counted as the late fees posted on the residency within the 12 months ending on the day of assessment"
      escalated_pct: "a residency with two or more such late fees has a late fee percentage of two_prior_late_fee_pct; a residency with exactly one such late fee has a late fee percentage of one_prior_late_fee_pct; a residency with no such late fee keeps late_fee_pct."
      residence_months: "counted in whole calendar months from the move-in date to the day of assessment"
      residence_pct_relief: "long_residence_months months or more lowers it by long_residence_pct_relief_pts percentage points; mid_residence_months months or more but fewer than long_residence_months months lowers it by mid_residence_pct_relief_pts percentage points; fewer than mid_residence_months months lowers it by nothing."
      plan_type: "A resident holding an occupied Entrance Fee Agreement has the late fee percentage lowered by the plan's terms"
      plan_pct_relief: "a lifecare plan lowers it by lifecare_pct_relief_pts percentage points; a fee-for-service plan lowers it by life_choice_pct_relief_pts percentage points; a resident with no occupied Entrance Fee Agreement has no plan reduction."
      applied_pct: "Both reductions are subtracted from the late fee percentage, never below zero, before the percentage is applied to the past-due amount of the billing period."
      percentage_amount: "the percentage amount rounded to the cent half up."
      greater_amount: "The late fee is the greater of late_fee_flat and the late fee percentage of the past-due amount of the billing period, the percentage amount rounded to the cent half up."
      returns_12m: "where exactly one returned payment was posted within the 12 months ending on the day of assessment"
      autopay_payments_month: "and an ACH autopay payment was posted within the one month ending on that day"
      returned_fee_credit: "where exactly one returned payment was posted within the 12 months ending on the day of assessment and an ACH autopay payment was posted within the one month ending on that day, the late fee is reduced by returned_payment_fee; where exactly one returned payment was posted within those 12 months and no ACH autopay payment was posted within that month, the late fee is reduced by half of returned_payment_fee, rounded to the cent half up; otherwise the late fee is not reduced."
      period_charge_posted: "the grace period ending payment_grace_days days after the posting date of the monthly fee charge of the billing period"
      days_after_grace: "A daily late charge runs from the day after the grace period ends, the grace period ending payment_grace_days days after the posting date of the monthly fee charge of the billing period, and is counted in calendar days up to and including the day of assessment"
      daily_charge: "where daily_charge_cap_days days or more have run, the daily late charge is the capped amount daily_charge_cap; where more than daily_charge_free_days days but fewer than daily_charge_cap_days days have run, it is daily_late_charge for each day that has run; where daily_charge_free_days days or fewer have run, there is none."
      result: "The late fee assessed is the greater amount above, then reduced by the returned payment fee credit, then increased by the daily late charge, never below zero, and rounded once to the cent half up."
    factors:
      - id: past_due_reckoning
        effect: method
        decides: period_past_due
        bindings: [month_returns, period_credits, period_past_due]
        ladder:
          - when: "a returned payment was posted within the one month ending on the day of assessment"
            method: "the charges less the payments net of the returned amounts and less the credits carrying the billing period"
          - when: "no returned payment was posted within that month but credits carrying the billing period were posted"
            method: "the charges less the payments and less those credits"
          - when: "otherwise"
            method: "the charges less the payments"
        baseline:
          period_past_due: "period_charges - month_payments"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_lateness
        effect: parameter
        decides: escalated_pct
        bindings: [prior_late_fees_12m, escalated_pct]
        ladder:
          - when: "two or more late fees posted on the residency within the 12 months ending on the day of assessment"
            value: "K('two_prior_late_fee_pct')"
          - when: "exactly one such late fee"
            value: "K('one_prior_late_fee_pct')"
          - when: "otherwise"
            value: "P('late_fee_pct')"
        baseline:
          escalated_pct: "P('late_fee_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: residence_length
        effect: parameter
        decides: residence_pct_relief
        bindings: [residence_months, residence_pct_relief]
        ladder:
          - when: "whole calendar months from the move-in date to the day of assessment are long_residence_months or more"
            value: "K('long_residence_pct_relief_pts')"
          - when: "those months are mid_residence_months or more but fewer than long_residence_months"
            value: "K('mid_residence_pct_relief_pts')"
          - when: "otherwise"
            value: "0"
        baseline:
          residence_pct_relief: "0"
        evidence: [date]
        cross_difficulty: null
      - id: entrance_plan_terms
        effect: parameter
        decides: plan_pct_relief
        bindings: [plan_type, plan_pct_relief]
        ladder:
          - when: "the customer holds an occupied Entrance Fee Agreement under a lifecare plan"
            value: "K('lifecare_pct_relief_pts')"
          - when: "the customer holds an occupied Entrance Fee Agreement under a fee-for-service plan"
            value: "K('life_choice_pct_relief_pts')"
          - when: "otherwise"
            value: "0"
        baseline:
          plan_pct_relief: "0"
        evidence: [cross_category]
        cross_difficulty: entrance
      - id: returned_fee_credit
        effect: parameter
        decides: returned_fee_credit
        bindings: [returns_12m, autopay_payments_month, returned_fee_credit]
        ladder:
          - when: "exactly one returned payment posted within the 12 months ending on the day of assessment and an ACH autopay payment posted within the one month ending on that day"
            value: "P('returned_payment_fee')"
          - when: "exactly one returned payment posted within those 12 months and no ACH autopay payment posted within that month"
            value: "half of P('returned_payment_fee'), rounded to the cent half up"
          - when: "otherwise"
            value: "0"
        baseline:
          returned_fee_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: daily_late_charge
        effect: method
        decides: daily_charge
        bindings: [period_charge_posted, days_after_grace, daily_charge]
        ladder:
          - when: "daily_charge_cap_days days or more have run after the grace period ended"
            method: "the capped amount daily_charge_cap is charged"
          - when: "more than daily_charge_free_days days but fewer than daily_charge_cap_days days have run"
            method: "daily_late_charge is charged for each day that has run"
          - when: "otherwise"
            method: "no daily late charge"
        baseline:
          daily_charge: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        A late fee assessed for a billing period is computed from the past-due amount of that period.
        The billing period assessed is the billing period of the latest monthly fee charge on the residency ledger, and its charges are the monthly fee charges and the recurring service fee charges carrying that billing period; late fees, community fees and one-time service fees are never among them.
        The past-due amount of the billing period is those charges less the payments posted within the one month ending on the day of assessment.
        The late fee percentage is late_fee_pct.
        The late fee is the greater of late_fee_flat and the late fee percentage of the past-due amount of the billing period, the percentage amount rounded to the cent half up.
        No late fee is assessed when the past-due amount of the billing period is below late_fee_min_past_due.
      params: [late_fee_pct, late_fee_flat, late_fee_min_past_due]
    inputs:
      history:
        - {table: independent_ledger, aggregate: sum, field: amount, filters: {event_type: independent_monthly_fee_charge}}
        - {table: independent_ledger, aggregate: sum, field: amount, filters: {event_type: independent_service_fee_charge}}
        - {table: independent_ledger, aggregate: sum, field: amount, within_months: 1, filters: {event_type: independent_payment}}
        - {table: independent_ledger, aggregate: sum, field: amount, within_months: 1, filters: {event_type: independent_payment_return}}
        - {table: independent_ledger, aggregate: count, field: independent_entry_id, within_months: 12, filters: {event_type: independent_late_fee_charge}}
        - {table: independent_ledger, aggregate: count, field: independent_entry_id, within_months: 12, filters: {event_type: independent_payment_return}}
      cross_category: [entrance]

  - id: independent_ext_advance_payment
    base_policy_refs: [independent_payments_and_returns, independent_monthly_billing, independent_service_fees]
    overwrite: []
    trigger: on_request
    subject: [independent_payment]
    computes: amount
    target_tool: make_advance_payment_0a0cd4e1
    params: {}
    rule: >-
      A resident of a continuing residency may pay in advance for the coming calendar month by one-time ACH payment, and the advance amount is set as follows.
      The coming month's statement is the monthly service fee in effect on the residency record plus, where the occupancy is double, second_person_fee of the apartment type.
      The advance amount is the coming month's statement, rounded to the cent half up.
      Registered pets are billed on the coming month's statement at pet_monthly_fee per pet without proration, the number of pets being the quantity on the latest pet monthly fee charge: a household with two or more registered pets adds pet_monthly_fee once for each pet; a household with one registered pet adds pet_monthly_fee once; a household with no pet monthly fee charge adds nothing for pets.
      Rented storage units are billed on the coming month's statement at storage_unit_monthly_fee per unit, the number of units being the quantity on the latest storage unit charge: a household renting two or more storage units adds storage_unit_monthly_fee once for each unit; a household renting one storage unit adds storage_unit_monthly_fee once; a household with no storage unit charge adds nothing for storage.
      Rented covered parking spaces are billed on the coming month's statement at covered_parking_monthly_fee per space, the number of spaces being the quantity on the latest covered parking charge: a household renting two or more spaces adds covered_parking_monthly_fee once for each space; a household renting one space adds covered_parking_monthly_fee once; a household with no covered parking charge adds nothing for parking.
      Because a payment is applied to the oldest outstanding charge first, the open balance of the account is settled before the coming month: the open balance is every monthly fee, community fee, service fee and late fee charge, every returned payment and every credit balance refund on the residency ledger, less every payment and every credit on it; where the open balance is owed, the advance amount is the open balance plus the coming month's statement; where the open balance is a credit, the credit carries forward and the advance amount is the coming month's statement less that credit, never below zero; where the open balance is zero, the advance amount is the coming month's statement alone.
      The advance amount is worked out only after the ledger carries a late fee entry for the billing period of the latest monthly fee charge whenever that period's grace period has ended with a past-due amount at or above the minimum that draws a late fee.
      The advance amount is not worked out until the residency record shows, as its fee in effect, the fee taking effect on the first day of the coming month under any annual increase whose notice period has already run.
    prerequisite:
      - problem: independent_ext_period_late_fee
        kind: value_input
        gate: open_balance
        form: state
        policy_source: >-
          The advance amount is worked out only after the ledger carries a late fee entry for the billing period of the latest monthly fee charge whenever that period's grace period has ended with a past-due amount at or above the minimum that draws a late fee.
        condition: >-
          independent_ledger carries an independent_late_fee_charge row for the billing period of the latest independent_monthly_fee_charge whenever that period's grace period has ended with its past-due amount, as the late fee rule reckons it, at or above late_fee_min_past_due.
        resolved_by: assess_late_fee_72eb1d9b
        effect: >-
          The late fee entry raises the open balance by the late fee assessed, so the open balance added to the coming month's statement rises by that amount.
      - problem: independent_ext_annual_increase_fee
        kind: value_input
        gate: coming_fee
        form: state
        policy_source: >-
          The advance amount is not worked out until the residency record shows, as its fee in effect, the fee taking effect on the first day of the coming month under any annual increase whose notice period has already run.
        condition: >-
          independent_residencies.monthly_service_fee holds the fee recorded for an annual increase effective on the first day of the coming month, with rate_effective_date on that day, wherever a mailed increase notice for that date has a notice period that has already run.
        resolved_by: record_annual_increase_315a2923
        effect: >-
          Recording the increase replaces the fee in effect with the recorded increased fee, so the coming month's statement and the advance amount rise by the difference.
    cross_category: []
    compute:
      - coming_fee: "F('monthly_service_fee')"
      - second_person_part: "P('second_person_fee') if F('occupancy_type') == 'double' else 0"
      - pets_on_latest_charge: "LATEST('independent_ledger', 'quantity', date_field='service_date', event_type='independent_service_fee_charge', fee_code='pet_monthly') or 0"
      - pet_part: "pets_on_latest_charge * P('pet_monthly_fee') if pets_on_latest_charge >= 2 else (P('pet_monthly_fee') if pets_on_latest_charge == 1 else 0)"
      - storage_on_latest_charge: "LATEST('independent_ledger', 'quantity', date_field='service_date', event_type='independent_service_fee_charge', fee_code='storage_unit') or 0"
      - storage_part: "storage_on_latest_charge * P('storage_unit_monthly_fee') if storage_on_latest_charge >= 2 else (P('storage_unit_monthly_fee') if storage_on_latest_charge == 1 else 0)"
      - parking_on_latest_charge: "LATEST('independent_ledger', 'quantity', date_field='service_date', event_type='independent_service_fee_charge', fee_code='covered_parking') or 0"
      - parking_part: "parking_on_latest_charge * P('covered_parking_monthly_fee') if parking_on_latest_charge >= 2 else (P('covered_parking_monthly_fee') if parking_on_latest_charge == 1 else 0)"
      - coming_statement: "coming_fee + second_person_part + pet_part + storage_part + parking_part"
      - charged_total: "SUM('independent_ledger', 'amount', event_type='independent_monthly_fee_charge') + SUM('independent_ledger', 'amount', event_type='independent_community_fee_charge') + SUM('independent_ledger', 'amount', event_type='independent_service_fee_charge') + SUM('independent_ledger', 'amount', event_type='independent_late_fee_charge') + SUM('independent_ledger', 'amount', event_type='independent_payment_return') + SUM('independent_ledger', 'amount', event_type='independent_credit_balance_refund')"
      - settled_total: "SUM('independent_ledger', 'amount', event_type='independent_payment') + SUM('independent_ledger', 'amount', event_type='independent_credit')"
      - open_balance: "RND(charged_total - settled_total, 2)"
      - advance: "(open_balance + coming_statement) if open_balance > 0 else (MX(0, coming_statement + open_balance) if open_balance < 0 else coming_statement)"
      - result: "RND(advance, 2)"
    compute_basis:
      coming_fee: "The coming month's statement is the monthly service fee in effect on the residency record plus, where the occupancy is double, second_person_fee of the apartment type."
      second_person_part: "plus, where the occupancy is double, second_person_fee of the apartment type."
      pets_on_latest_charge: "the number of pets being the quantity on the latest pet monthly fee charge"
      pet_part: "a household with two or more registered pets adds pet_monthly_fee once for each pet; a household with one registered pet adds pet_monthly_fee once; a household with no pet monthly fee charge adds nothing for pets."
      storage_on_latest_charge: "the number of units being the quantity on the latest storage unit charge"
      storage_part: "a household renting two or more storage units adds storage_unit_monthly_fee once for each unit; a household renting one storage unit adds storage_unit_monthly_fee once; a household with no storage unit charge adds nothing for storage."
      parking_on_latest_charge: "the number of spaces being the quantity on the latest covered parking charge"
      parking_part: "a household renting two or more spaces adds covered_parking_monthly_fee once for each space; a household renting one space adds covered_parking_monthly_fee once; a household with no covered parking charge adds nothing for parking."
      charged_total: "the open balance is every monthly fee, community fee, service fee and late fee charge, every returned payment and every credit balance refund on the residency ledger, less every payment and every credit on it"
      settled_total: "less every payment and every credit on it"
      open_balance: "Because a payment is applied to the oldest outstanding charge first, the open balance of the account is settled before the coming month"
      advance: "where the open balance is owed, the advance amount is the open balance plus the coming month's statement; where the open balance is a credit, the credit carries forward and the advance amount is the coming month's statement less that credit, never below zero; where the open balance is zero, the advance amount is the coming month's statement alone."
      result: "The advance amount is the coming month's statement, rounded to the cent half up."
    factors:
      - id: open_balance_first
        effect: method
        decides: advance
        bindings: [charged_total, settled_total, open_balance, advance]
        ladder:
          - when: "the open balance of the account is owed"
            method: "the open balance is added to the coming month's statement"
          - when: "the open balance of the account is a credit"
            method: "the credit is taken off the coming month's statement, never below zero"
          - when: "otherwise"
            method: "the coming month's statement alone"
        baseline:
          advance: "coming_statement"
        evidence: [history]
        cross_difficulty: null
      - id: registered_pets
        effect: parameter
        decides: pet_part
        bindings: [pets_on_latest_charge, pet_part]
        ladder:
          - when: "the latest pet monthly fee charge carries a quantity of two or more"
            value: "the quantity on the latest charge times P('pet_monthly_fee')"
          - when: "the latest pet monthly fee charge carries a quantity of one"
            value: "P('pet_monthly_fee')"
          - when: "otherwise"
            value: "0"
        baseline:
          pet_part: "0"
        evidence: [history]
        cross_difficulty: null
      - id: rented_storage
        effect: parameter
        decides: storage_part
        bindings: [storage_on_latest_charge, storage_part]
        ladder:
          - when: "the latest storage unit charge carries a quantity of two or more"
            value: "the quantity on the latest charge times P('storage_unit_monthly_fee')"
          - when: "the latest storage unit charge carries a quantity of one"
            value: "P('storage_unit_monthly_fee')"
          - when: "otherwise"
            value: "0"
        baseline:
          storage_part: "0"
        evidence: [history]
        cross_difficulty: null
      - id: rented_parking
        effect: parameter
        decides: parking_part
        bindings: [parking_on_latest_charge, parking_part]
        ladder:
          - when: "the latest covered parking charge carries a quantity of two or more"
            value: "the quantity on the latest charge times P('covered_parking_monthly_fee')"
          - when: "the latest covered parking charge carries a quantity of one"
            value: "P('covered_parking_monthly_fee')"
          - when: "otherwise"
            value: "0"
        baseline:
          parking_part: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A resident of a continuing residency may pay in advance for the coming calendar month by one-time ACH payment, and the advance amount is set as follows.
        The coming month's statement is the monthly service fee in effect on the residency record plus, where the occupancy is double, second_person_fee of the apartment type.
        The advance amount is the coming month's statement, rounded to the cent half up.
      params: [second_person_fee]
    inputs:
      history:
        - {table: independent_ledger, aggregate: latest, field: quantity, filters: {event_type: independent_service_fee_charge, fee_code: pet_monthly}}
        - {table: independent_ledger, aggregate: latest, field: quantity, filters: {event_type: independent_service_fee_charge, fee_code: storage_unit}}
        - {table: independent_ledger, aggregate: latest, field: quantity, filters: {event_type: independent_service_fee_charge, fee_code: covered_parking}}
        - {table: independent_ledger, aggregate: sum, field: amount, filters: {}}
      cross_category: []

  - id: independent_ext_final_month_charge
    base_policy_refs: [independent_monthly_billing, independent_fee_end_and_proration, independent_move_out_notice]
    overwrite:
      - base_policy: independent_monthly_billing
        superseded_clause: >-
          the daily amount is the monthly amount divided by the actual number of days in that calendar month, multiplied by the days billed counted inclusive of both the first and last day, and rounded once to the cent half up
        replaced_by: >-
          The final month's base fee charge is the monthly service fee in effect before the final month, as billed on the latest full-month base fee charge, divided by proration_basis_days and multiplied by the days from the first day of the final month through the fee end date, counted inclusive of both days, and rounded once to the cent half up.
      - base_policy: independent_fee_end_and_proration
        superseded_clause: >-
          After a notice stating a move to a Larkspur assisted living or memory care residence, and for an internal transfer recorded without notice, the fee end date is the later of the vacate date and the notice date plus internal_transfer_notice_days calendar days.
        replaced_by: >-
          For a notice stating a move to a Larkspur assisted living or memory care residence, and for an internal transfer to either recorded without notice, the fee end date is the later of the vacate date and the notice date plus the notice period that move carries.
      - base_policy: independent_move_out_notice
        superseded_clause: >-
          The notice period is move_out_notice_days for a resident leaving Larkspur and internal_transfer_notice_days when the notice states a move to a Larkspur assisted living or memory care residence
        replaced_by: >-
          The notice period added to the notice date follows the move the notice states: a notice stating a move to a Larkspur memory care residence adds memory_transfer_notice_days calendar days, because a move to memory care is made as soon as a secured suite is ready; a notice stating a move to a Larkspur assisted living residence adds internal_transfer_notice_days calendar days; any other notice adds move_out_notice_days calendar days.
    trigger: on_request
    subject: [independent_monthly_fee_charge]
    computes: amount
    target_tool: post_final_month_charge_713925f6
    params:
      proration_basis_days: 30
      memory_transfer_notice_days: 0
      long_residence_months: 60
      first_year_months: 12
      long_residence_courtesy_pct: 2.0
      settled_residence_courtesy_pct: 1.0
      clean_record_courtesy_pct: 2.0
      one_event_courtesy_pct: 1.0
      full_autopay_courtesy_pct: 1.0
      partial_autopay_courtesy_pct: 0.5
      higher_care_courtesy_pct: 10.0
      lower_care_courtesy_pct: 5.0
    rule: >-
      Once a notice of termination stands on a residency and the resident or the resident's representative asks to settle the residency, the base fee charge of the final month is posted on that day, the final month being the calendar month after the last month already billed.
      The final month's base fee charge is the monthly service fee in effect before the final month, as billed on the latest full-month base fee charge, divided by proration_basis_days and multiplied by the days from the first day of the final month through the fee end date, counted inclusive of both days, and rounded once to the cent half up.
      The fee end date is the later of the vacate date, or before the apartment is surrendered the intended vacate date stated on the notice, and the notice date plus move_out_notice_days calendar days.
      No final month's base fee charge is posted when the fee end date falls on or before the last day already billed.
      The notice period added to the notice date follows the move the notice states: a notice stating a move to a Larkspur memory care residence adds memory_transfer_notice_days calendar days, because a move to memory care is made as soon as a secured suite is ready; a notice stating a move to a Larkspur assisted living residence adds internal_transfer_notice_days calendar days; any other notice adds move_out_notice_days calendar days.
      For a notice stating a move to a Larkspur assisted living or memory care residence, and for an internal transfer to either recorded without notice, the fee end date is the later of the vacate date and the notice date plus the notice period that move carries.
      The monthly fee applied to the days of the final month follows any increase recorded on the residency: where the recorded fee takes effect on the first day of the final month, every day is billed at the recorded fee; where it takes effect on a later day that is on or before the fee end date, the days before it are billed at the fee of the latest full-month base fee charge and the days from it at the recorded fee, each span divided by proration_basis_days; otherwise every day is billed at the fee of the latest full-month base fee charge.
      A settling resident receives a residence courtesy, counted in whole calendar months from the move-in date to the day of posting: long_residence_months months or more receives long_residence_courtesy_pct percent; first_year_months months or more but fewer than long_residence_months months receives settled_residence_courtesy_pct percent; fewer than first_year_months months receives none.
      A settling residency in good payment standing receives a standing courtesy, counted over the late fees and returned payments posted within the 12 months ending on the day of posting: a residency with no late fee and no returned payment receives clean_record_courtesy_pct percent; a residency with exactly one late fee or returned payment in total receives one_event_courtesy_pct percent; any other residency receives none.
      A settling residency that pays by ACH autopay receives an autopay courtesy, counted over the payments posted within the 12 months ending on the day of posting: where every such payment was an ACH autopay payment receives full_autopay_courtesy_pct percent; where some but not all were receives partial_autopay_courtesy_pct percent; where none was, or no payment was posted, receives none.
      A resident moving into Larkspur assisted living receives a care transition courtesy by the care level of the active assisted living residency: Assisted Living Care Level 4, 5 or 6 receives higher_care_courtesy_pct percent; Assisted Living Care Level 1, 2 or 3 receives lower_care_courtesy_pct percent; a resident with no active assisted living residency receives none.
      The four courtesy percentages are added into one total courtesy percentage, and the final month's base fee charge before rounding is reduced once by that total percentage; the courtesies do not act one after another, and the result is rounded once to the cent half up.
    prerequisite: []
    cross_category:
      - category: assisted
        as: branch
        reads: [status, variant_name]
        note: The care level of the customer's active assisted living residency decides the tier of the care transition courtesy.
    compute:
      - last_billed_to: "LATEST('independent_ledger', 'service_to_date', date_field='service_to_date', event_type='independent_monthly_fee_charge', fee_component='base_fee')"
      - last_billed_fee: "LATEST('independent_ledger', 'amount', date_field='service_to_date', event_type='independent_monthly_fee_charge', fee_component='base_fee', charge_basis='full_month')"
      - notice_offset: "DAYS(last_billed_to, F('notice_date'))"
      - notice_period_days: "K('memory_transfer_notice_days') if F('termination_reason') == 'transfer_memory' else (P('internal_transfer_notice_days') if F('termination_reason') == 'transfer_assisted' else P('move_out_notice_days'))"
      - period_end_offset: "notice_offset + notice_period_days"
      - fee_end_offset: "MX(DAYS(last_billed_to, F('vacate_date') or F('intended_vacate_date')), period_end_offset)"
      - final_days: "MX(0, fee_end_offset)"
      - effective_offset: "DAYS(last_billed_to, F('rate_effective_date'))"
      - gross_charge: "(F('monthly_service_fee') * final_days / K('proration_basis_days')) if effective_offset == 1 else ((last_billed_fee * (effective_offset - 1) / K('proration_basis_days') + F('monthly_service_fee') * (final_days - effective_offset + 1) / K('proration_basis_days')) if (effective_offset > 1 and effective_offset <= final_days) else (last_billed_fee * final_days / K('proration_basis_days')))"
      - residence_months: "MONTHS(F('move_in_date'), NOW)"
      - residence_courtesy_pct: "K('long_residence_courtesy_pct') if residence_months >= K('long_residence_months') else (K('settled_residence_courtesy_pct') if residence_months >= K('first_year_months') else 0)"
      - late_fees_12m: "COUNT('independent_ledger', within_months=12, date_field='posting_date', event_type='independent_late_fee_charge')"
      - returns_12m: "COUNT('independent_ledger', within_months=12, date_field='posting_date', event_type='independent_payment_return')"
      - standing_courtesy_pct: "K('clean_record_courtesy_pct') if (late_fees_12m == 0 and returns_12m == 0) else (K('one_event_courtesy_pct') if ((late_fees_12m == 1 and returns_12m == 0) or (late_fees_12m == 0 and returns_12m == 1)) else 0)"
      - payments_12m: "COUNT('independent_ledger', within_months=12, date_field='posting_date', event_type='independent_payment')"
      - autopay_payments_12m: "COUNT('independent_ledger', within_months=12, date_field='posting_date', event_type='independent_payment', payment_method='ach_autopay')"
      - autopay_courtesy_pct: "K('full_autopay_courtesy_pct') if (payments_12m >= 1 and autopay_payments_12m == payments_12m) else (K('partial_autopay_courtesy_pct') if (autopay_payments_12m >= 1 and autopay_payments_12m < payments_12m) else 0)"
      - care_level: "CFIELD('assisted', 'variant_name', status='active')"
      - care_courtesy_pct: "K('higher_care_courtesy_pct') if (care_level == 'Assisted Living Care Level 4' or care_level == 'Assisted Living Care Level 5' or care_level == 'Assisted Living Care Level 6') else (K('lower_care_courtesy_pct') if (care_level == 'Assisted Living Care Level 1' or care_level == 'Assisted Living Care Level 2' or care_level == 'Assisted Living Care Level 3') else 0)"
      - total_courtesy_pct: "residence_courtesy_pct + standing_courtesy_pct + autopay_courtesy_pct + care_courtesy_pct"
      - result: "RND(gross_charge * (1 - total_courtesy_pct / 100), 2)"
    compute_basis:
      last_billed_to: "the final month being the calendar month after the last month already billed."
      last_billed_fee: "the monthly service fee in effect before the final month, as billed on the latest full-month base fee charge"
      notice_offset: "The fee end date is the later of the vacate date, or before the apartment is surrendered the intended vacate date stated on the notice, and the notice date plus move_out_notice_days calendar days."
      notice_period_days: "The notice period added to the notice date follows the move the notice states: a notice stating a move to a Larkspur memory care residence adds memory_transfer_notice_days calendar days, because a move to memory care is made as soon as a secured suite is ready; a notice stating a move to a Larkspur assisted living residence adds internal_transfer_notice_days calendar days; any other notice adds move_out_notice_days calendar days."
      period_end_offset: "For a notice stating a move to a Larkspur assisted living or memory care residence, and for an internal transfer to either recorded without notice, the fee end date is the later of the vacate date and the notice date plus the notice period that move carries."
      fee_end_offset: "The fee end date is the later of the vacate date, or before the apartment is surrendered the intended vacate date stated on the notice, and the notice date plus move_out_notice_days calendar days."
      final_days: "No final month's base fee charge is posted when the fee end date falls on or before the last day already billed."
      effective_offset: "The monthly fee applied to the days of the final month follows any increase recorded on the residency"
      gross_charge: "where the recorded fee takes effect on the first day of the final month, every day is billed at the recorded fee; where it takes effect on a later day that is on or before the fee end date, the days before it are billed at the fee of the latest full-month base fee charge and the days from it at the recorded fee, each span divided by proration_basis_days; otherwise every day is billed at the fee of the latest full-month base fee charge."
      residence_months: "counted in whole calendar months from the move-in date to the day of posting"
      residence_courtesy_pct: "long_residence_months months or more receives long_residence_courtesy_pct percent; first_year_months months or more but fewer than long_residence_months months receives settled_residence_courtesy_pct percent; fewer than first_year_months months receives none."
      late_fees_12m: "counted over the late fees and returned payments posted within the 12 months ending on the day of posting"
      returns_12m: "counted over the late fees and returned payments posted within the 12 months ending on the day of posting"
      standing_courtesy_pct: "a residency with no late fee and no returned payment receives clean_record_courtesy_pct percent; a residency with exactly one late fee or returned payment in total receives one_event_courtesy_pct percent; any other residency receives none."
      payments_12m: "counted over the payments posted within the 12 months ending on the day of posting"
      autopay_payments_12m: "where every such payment was an ACH autopay payment"
      autopay_courtesy_pct: "where every such payment was an ACH autopay payment receives full_autopay_courtesy_pct percent; where some but not all were receives partial_autopay_courtesy_pct percent; where none was, or no payment was posted, receives none."
      care_level: "by the care level of the active assisted living residency"
      care_courtesy_pct: "Assisted Living Care Level 4, 5 or 6 receives higher_care_courtesy_pct percent; Assisted Living Care Level 1, 2 or 3 receives lower_care_courtesy_pct percent; a resident with no active assisted living residency receives none."
      total_courtesy_pct: "The four courtesy percentages are added into one total courtesy percentage"
      result: "the final month's base fee charge before rounding is reduced once by that total percentage; the courtesies do not act one after another, and the result is rounded once to the cent half up."
    factors:
      - id: notice_period
        effect: parameter
        decides: notice_period_days
        bindings: [notice_offset, notice_period_days]
        ladder:
          - when: "the notice states a move to a Larkspur memory care residence"
            value: "K('memory_transfer_notice_days')"
          - when: "the notice states a move to a Larkspur assisted living residence"
            value: "P('internal_transfer_notice_days')"
          - when: "otherwise"
            value: "P('move_out_notice_days')"
        baseline:
          notice_period_days: "P('move_out_notice_days')"
        evidence: [date]
        cross_difficulty: null
      - id: recorded_increase_span
        effect: method
        decides: gross_charge
        bindings: [effective_offset, gross_charge]
        ladder:
          - when: "the recorded fee takes effect on the first day of the final month"
            method: "every day of the final month at the recorded fee"
          - when: "the recorded fee takes effect on a later day on or before the fee end date"
            method: "the days before it at the fee of the latest full-month base fee charge and the days from it at the recorded fee, each span divided by proration_basis_days"
          - when: "otherwise"
            method: "every day at the fee of the latest full-month base fee charge"
        baseline:
          gross_charge: "last_billed_fee * final_days / K('proration_basis_days')"
        evidence: [date, history]
        cross_difficulty: null
      - id: residence_courtesy
        effect: parameter
        decides: residence_courtesy_pct
        bindings: [residence_months, residence_courtesy_pct]
        ladder:
          - when: "whole calendar months from the move-in date to the day of posting are long_residence_months or more"
            value: "K('long_residence_courtesy_pct')"
          - when: "those months are first_year_months or more but fewer than long_residence_months"
            value: "K('settled_residence_courtesy_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          residence_courtesy_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: standing_courtesy
        effect: parameter
        decides: standing_courtesy_pct
        bindings: [late_fees_12m, returns_12m, standing_courtesy_pct]
        ladder:
          - when: "no late fee and no returned payment posted within the 12 months ending on the day of posting"
            value: "K('clean_record_courtesy_pct')"
          - when: "one late fee and no returned payment, or one returned payment and no late fee, within those 12 months"
            value: "K('one_event_courtesy_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          standing_courtesy_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: autopay_courtesy
        effect: parameter
        decides: autopay_courtesy_pct
        bindings: [payments_12m, autopay_payments_12m, autopay_courtesy_pct]
        ladder:
          - when: "every payment posted within the 12 months ending on the day of posting was an ACH autopay payment"
            value: "K('full_autopay_courtesy_pct')"
          - when: "some but not all of those payments were ACH autopay payments"
            value: "K('partial_autopay_courtesy_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          autopay_courtesy_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: care_transition_courtesy
        effect: parameter
        decides: care_courtesy_pct
        bindings: [care_level, care_courtesy_pct]
        ladder:
          - when: "the active assisted living residency is at Assisted Living Care Level 4, 5 or 6"
            value: "K('higher_care_courtesy_pct')"
          - when: "the active assisted living residency is at Assisted Living Care Level 1, 2 or 3"
            value: "K('lower_care_courtesy_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          care_courtesy_pct: "0"
        evidence: [cross_category]
        cross_difficulty: assisted
    baseline:
      rule: >-
        Once a notice of termination stands on a residency and the resident or the resident's representative asks to settle the residency, the base fee charge of the final month is posted on that day, the final month being the calendar month after the last month already billed.
        The final month's base fee charge is the monthly service fee in effect before the final month, as billed on the latest full-month base fee charge, divided by proration_basis_days and multiplied by the days from the first day of the final month through the fee end date, counted inclusive of both days, and rounded once to the cent half up.
        The fee end date is the later of the vacate date, or before the apartment is surrendered the intended vacate date stated on the notice, and the notice date plus move_out_notice_days calendar days.
        No final month's base fee charge is posted when the fee end date falls on or before the last day already billed.
      params: [proration_basis_days, move_out_notice_days]
    inputs:
      history:
        - {table: independent_ledger, aggregate: latest, field: service_to_date, filters: {event_type: independent_monthly_fee_charge, fee_component: base_fee}}
        - {table: independent_ledger, aggregate: latest, field: amount, filters: {event_type: independent_monthly_fee_charge, fee_component: base_fee, charge_basis: full_month}}
        - {table: independent_ledger, aggregate: count, field: independent_entry_id, within_months: 12, filters: {event_type: independent_late_fee_charge}}
        - {table: independent_ledger, aggregate: count, field: independent_entry_id, within_months: 12, filters: {event_type: independent_payment_return}}
        - {table: independent_ledger, aggregate: count, field: independent_entry_id, within_months: 12, filters: {event_type: independent_payment}}
      cross_category: [assisted]

  - id: independent_ext_closing_payment
    base_policy_refs: [independent_payments_and_returns, independent_final_statement, independent_service_fees]
    overwrite:
      - base_policy: independent_service_fees
        superseded_clause: >-
          The carpet_cleaning fee of the apartment type is charged once when the apartment is vacated
        replaced_by: >-
          The move-out carpet cleaning fee charged when the apartment is vacated follows where the resident is moving, and the closing amount carries that same fee
    trigger: on_request
    subject: [independent_payment]
    computes: amount
    target_tool: make_closing_payment_d2bd6461
    params:
      memory_transfer_cleaning_share_pct: 0
      assisted_transfer_cleaning_share_pct: 50
    rule: >-
      A residency under a notice of termination may be settled before the apartment is surrendered by one closing payment drawn as a one-time ACH payment, and the closing amount is set as follows.
      The closing amount is the move-out carpet cleaning fee charged once when the apartment is vacated and carried on the final statement, which is carpet_cleaning_fee of the apartment type, rounded to the cent half up.
      The move-out carpet cleaning fee charged when the apartment is vacated follows where the resident is moving, and the closing amount carries that same fee: a resident whose notice states a move to a Larkspur memory care residence and whose memory care residency is active is charged memory_transfer_cleaning_share_pct percent of carpet_cleaning_fee; a resident whose notice states a move to a Larkspur assisted living residence and whose assisted living residency is active is charged assisted_transfer_cleaning_share_pct percent of carpet_cleaning_fee, rounded to the cent half up; any other resident is charged the full carpet_cleaning_fee.
      The final month's registered pets add to the closing amount at pet_monthly_fee per pet without proration, the number of pets being the quantity on the latest pet monthly fee charge: two or more registered pets add pet_monthly_fee once for each pet to the closing amount; one registered pet adds pet_monthly_fee once to the closing amount; no pet monthly fee charge adds no pet amount to the closing amount.
      The final month's rented storage units add to the closing amount at storage_unit_monthly_fee per unit, the number of units being the quantity on the latest storage unit charge: two or more units add storage_unit_monthly_fee once for each unit to the closing amount; one unit adds storage_unit_monthly_fee once to the closing amount; no storage unit charge adds no storage amount to the closing amount.
      The final month's rented covered parking spaces add to the closing amount at covered_parking_monthly_fee per space, the number of spaces being the quantity on the latest covered parking charge: two or more spaces add covered_parking_monthly_fee once for each space to the closing amount; one space adds covered_parking_monthly_fee once to the closing amount; no covered parking charge adds no parking amount to the closing amount.
      The closing amount settles the residency ledger as it stands, every monthly fee, community fee, service fee and late fee charge, every returned payment and every credit balance refund less every payment and every credit: where the ledger balance is owed, it is added to the closing amount; where the ledger balance is a credit, it is taken off the closing amount, never below zero; where the ledger balance is zero, the closing amount stands as computed.
      The closing amount is worked out only after the ledger carries, wherever the residency's fees end after the last day already billed, a monthly fee charge for the final month running from its first day through the date the fees end.
    prerequisite:
      - problem: independent_ext_final_month_charge
        kind: value_input
        gate: ledger_balance
        form: state
        policy_source: >-
          The closing amount is worked out only after the ledger carries, wherever the residency's fees end after the last day already billed, a monthly fee charge for the final month running from its first day through the date the fees end.
        condition: >-
          independent_ledger carries an independent_monthly_fee_charge base_fee row with charge_basis prorated_move_out for the month after the last full month billed, whose service_to_date is the fee end date, wherever that fee end date falls after the last day already billed.
        resolved_by: post_final_month_charge_713925f6
        effect: >-
          The final month's base fee charge raises the ledger balance by its amount, so the balance settled in the closing amount moves from zero to that amount owed.
    cross_category:
      - category: assisted
        as: existence
        reads: [status]
        note: An active assisted living residency, with a notice stating that move, decides the assisted-transfer tier of the carpet cleaning share.
      - category: memory
        as: existence
        reads: [status]
        note: An active memory care residency, with a notice stating that move, decides the memory-transfer tier of the carpet cleaning share.
    compute:
      - memory_transfer: "F('termination_reason') == 'transfer_memory' and EXISTS('memory', status='active')"
      - assisted_transfer: "F('termination_reason') == 'transfer_assisted' and EXISTS('assisted', status='active')"
      - cleaning_part: "RND(P('carpet_cleaning_fee') * K('memory_transfer_cleaning_share_pct') / 100, 2) if memory_transfer else (RND(P('carpet_cleaning_fee') * K('assisted_transfer_cleaning_share_pct') / 100, 2) if assisted_transfer else P('carpet_cleaning_fee'))"
      - pets_on_latest_charge: "LATEST('independent_ledger', 'quantity', date_field='service_date', event_type='independent_service_fee_charge', fee_code='pet_monthly') or 0"
      - final_pet_part: "pets_on_latest_charge * P('pet_monthly_fee') if pets_on_latest_charge >= 2 else (P('pet_monthly_fee') if pets_on_latest_charge == 1 else 0)"
      - storage_on_latest_charge: "LATEST('independent_ledger', 'quantity', date_field='service_date', event_type='independent_service_fee_charge', fee_code='storage_unit') or 0"
      - final_storage_part: "storage_on_latest_charge * P('storage_unit_monthly_fee') if storage_on_latest_charge >= 2 else (P('storage_unit_monthly_fee') if storage_on_latest_charge == 1 else 0)"
      - parking_on_latest_charge: "LATEST('independent_ledger', 'quantity', date_field='service_date', event_type='independent_service_fee_charge', fee_code='covered_parking') or 0"
      - final_parking_part: "parking_on_latest_charge * P('covered_parking_monthly_fee') if parking_on_latest_charge >= 2 else (P('covered_parking_monthly_fee') if parking_on_latest_charge == 1 else 0)"
      - closing_before_balance: "cleaning_part + final_pet_part + final_storage_part + final_parking_part"
      - ledger_charged: "SUM('independent_ledger', 'amount', event_type='independent_monthly_fee_charge') + SUM('independent_ledger', 'amount', event_type='independent_community_fee_charge') + SUM('independent_ledger', 'amount', event_type='independent_service_fee_charge') + SUM('independent_ledger', 'amount', event_type='independent_late_fee_charge') + SUM('independent_ledger', 'amount', event_type='independent_payment_return') + SUM('independent_ledger', 'amount', event_type='independent_credit_balance_refund')"
      - ledger_settled: "SUM('independent_ledger', 'amount', event_type='independent_payment') + SUM('independent_ledger', 'amount', event_type='independent_credit')"
      - ledger_balance: "RND(ledger_charged - ledger_settled, 2)"
      - closing_amount: "(closing_before_balance + ledger_balance) if ledger_balance > 0 else (MX(0, closing_before_balance + ledger_balance) if ledger_balance < 0 else closing_before_balance)"
      - result: "RND(closing_amount, 2)"
    compute_basis:
      memory_transfer: "a resident whose notice states a move to a Larkspur memory care residence and whose memory care residency is active is charged memory_transfer_cleaning_share_pct percent of carpet_cleaning_fee"
      assisted_transfer: "a resident whose notice states a move to a Larkspur assisted living residence and whose assisted living residency is active is charged assisted_transfer_cleaning_share_pct percent of carpet_cleaning_fee"
      cleaning_part: "The move-out carpet cleaning fee charged when the apartment is vacated follows where the resident is moving, and the closing amount carries that same fee: a resident whose notice states a move to a Larkspur memory care residence and whose memory care residency is active is charged memory_transfer_cleaning_share_pct percent of carpet_cleaning_fee; a resident whose notice states a move to a Larkspur assisted living residence and whose assisted living residency is active is charged assisted_transfer_cleaning_share_pct percent of carpet_cleaning_fee, rounded to the cent half up; any other resident is charged the full carpet_cleaning_fee."
      pets_on_latest_charge: "the number of pets being the quantity on the latest pet monthly fee charge"
      final_pet_part: "two or more registered pets add pet_monthly_fee once for each pet to the closing amount; one registered pet adds pet_monthly_fee once to the closing amount; no pet monthly fee charge adds no pet amount to the closing amount."
      storage_on_latest_charge: "the number of units being the quantity on the latest storage unit charge"
      final_storage_part: "two or more units add storage_unit_monthly_fee once for each unit to the closing amount; one unit adds storage_unit_monthly_fee once to the closing amount; no storage unit charge adds no storage amount to the closing amount."
      parking_on_latest_charge: "the number of spaces being the quantity on the latest covered parking charge"
      final_parking_part: "two or more spaces add covered_parking_monthly_fee once for each space to the closing amount; one space adds covered_parking_monthly_fee once to the closing amount; no covered parking charge adds no parking amount to the closing amount."
      ledger_charged: "every monthly fee, community fee, service fee and late fee charge, every returned payment and every credit balance refund less every payment and every credit"
      ledger_settled: "less every payment and every credit"
      ledger_balance: "The closing amount settles the residency ledger as it stands"
      closing_amount: "where the ledger balance is owed, it is added to the closing amount; where the ledger balance is a credit, it is taken off the closing amount, never below zero; where the ledger balance is zero, the closing amount stands as computed."
      result: "The closing amount is the move-out carpet cleaning fee charged once when the apartment is vacated and carried on the final statement, which is carpet_cleaning_fee of the apartment type, rounded to the cent half up."
    factors:
      - id: transfer_cleaning_share
        effect: parameter
        decides: cleaning_part
        bindings: [memory_transfer, assisted_transfer, cleaning_part]
        ladder:
          - when: "the notice states a move to a Larkspur memory care residence and the customer's memory care residency is active"
            value: "memory_transfer_cleaning_share_pct percent of P('carpet_cleaning_fee')"
          - when: "the notice states a move to a Larkspur assisted living residence and the customer's assisted living residency is active"
            value: "assisted_transfer_cleaning_share_pct percent of P('carpet_cleaning_fee'), rounded to the cent half up"
          - when: "otherwise"
            value: "P('carpet_cleaning_fee')"
        baseline:
          cleaning_part: "P('carpet_cleaning_fee')"
        evidence: [cross_category]
        cross_difficulty: assisted
      - id: final_month_pets
        effect: parameter
        decides: final_pet_part
        bindings: [pets_on_latest_charge, final_pet_part]
        ladder:
          - when: "the latest pet monthly fee charge carries a quantity of two or more"
            value: "the quantity on the latest charge times P('pet_monthly_fee')"
          - when: "the latest pet monthly fee charge carries a quantity of one"
            value: "P('pet_monthly_fee')"
          - when: "otherwise"
            value: "0"
        baseline:
          final_pet_part: "0"
        evidence: [history]
        cross_difficulty: null
      - id: final_month_storage
        effect: parameter
        decides: final_storage_part
        bindings: [storage_on_latest_charge, final_storage_part]
        ladder:
          - when: "the latest storage unit charge carries a quantity of two or more"
            value: "the quantity on the latest charge times P('storage_unit_monthly_fee')"
          - when: "the latest storage unit charge carries a quantity of one"
            value: "P('storage_unit_monthly_fee')"
          - when: "otherwise"
            value: "0"
        baseline:
          final_storage_part: "0"
        evidence: [history]
        cross_difficulty: null
      - id: final_month_parking
        effect: parameter
        decides: final_parking_part
        bindings: [parking_on_latest_charge, final_parking_part]
        ladder:
          - when: "the latest covered parking charge carries a quantity of two or more"
            value: "the quantity on the latest charge times P('covered_parking_monthly_fee')"
          - when: "the latest covered parking charge carries a quantity of one"
            value: "P('covered_parking_monthly_fee')"
          - when: "otherwise"
            value: "0"
        baseline:
          final_parking_part: "0"
        evidence: [history]
        cross_difficulty: null
      - id: ledger_settlement
        effect: method
        decides: closing_amount
        bindings: [ledger_charged, ledger_settled, ledger_balance, closing_amount]
        ladder:
          - when: "the ledger balance is owed"
            method: "the ledger balance is added to the closing amount"
          - when: "the ledger balance is a credit"
            method: "the credit is taken off the closing amount, never below zero"
          - when: "otherwise"
            method: "the closing amount stands as computed"
        baseline:
          closing_amount: "closing_before_balance"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A residency under a notice of termination may be settled before the apartment is surrendered by one closing payment drawn as a one-time ACH payment, and the closing amount is set as follows.
        The closing amount is the move-out carpet cleaning fee charged once when the apartment is vacated and carried on the final statement, which is carpet_cleaning_fee of the apartment type, rounded to the cent half up.
      params: [carpet_cleaning_fee]
    inputs:
      history:
        - {table: independent_ledger, aggregate: latest, field: quantity, filters: {event_type: independent_service_fee_charge, fee_code: pet_monthly}}
        - {table: independent_ledger, aggregate: latest, field: quantity, filters: {event_type: independent_service_fee_charge, fee_code: storage_unit}}
        - {table: independent_ledger, aggregate: latest, field: quantity, filters: {event_type: independent_service_fee_charge, fee_code: covered_parking}}
        - {table: independent_ledger, aggregate: sum, field: amount, filters: {}}
      cross_category: [assisted, memory]
