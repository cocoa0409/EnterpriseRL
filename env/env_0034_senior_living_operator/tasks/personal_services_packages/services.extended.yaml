# Product charter — Personal Services Plan (ancillary services for residents).
# Larkspur Senior Living. Monthly packages of personal service hours (extra housekeeping, laundry and linen,
# companion visits, escorts, errands, pet care) with priced a la carte services; billed on a services ledger.
# Single registry of every number of this category.

category: services
display_name: Personal Services Plan

binding:
  holding_table: services_plans
  event_tables: [services_ledger, services_orders]
  intake_tables: [services_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {hours_available: service_hours, account_balance: services_balance}

lifecycle:
  states: [pending_start, active, suspended, cancel_pending, ended]
  transitions:
    - from: pending_start
      to: active
      by: system
      means: "The plan starts on its effective date, the first day of a calendar month."
    - from: pending_start
      to: ended
      by: user
      means: "The resident withdraws the enrollment before the effective date."
    - from: active
      to: suspended
      by: agent
      means: "A suspension of whole calendar months begins while the resident is away."
    - from: suspended
      to: active
      by: agent
      means: "The suspension ends on the first day of the month after its last suspended month."
    - from: active
      to: cancel_pending
      by: user
      means: "The resident signs a cancellation of the plan, which ends at the end date fixed by the notice rules."
    - from: cancel_pending
      to: active
      by: user
      means: "The resident withdraws the cancellation before the end date."
    - from: cancel_pending
      to: ended
      by: system
      means: "The plan ends on the cancellation end date."
    - from: active
      to: ended
      by: agent
      means: "The plan ends because the resident's Larkspur residency ended."
    - from: suspended
      to: ended
      by: agent
      means: "The plan ends during a suspension because the resident's Larkspur residency ended."

accounts:
  - key: service_hours
    unit: hours
    meaning: Personal service hours available to the plan; the monthly allotment and any rollover or restored hours book in, and hours drawn for services and hours expiring at month end book out.
  - key: services_balance
    unit: USD
    meaning: Amount owed on the personal services account; package fees, hourly charges beyond the allotment, a la carte services and fees book in, payments and credits book out.

parameter_schema:
  monthly_package_fee: Monthly fee of the package, billed in advance, USD per calendar month (0.00 for pay-as-you-go).
  monthly_hours_allotment: Personal service hours granted on the first day of each active month, hours.
  hourly_rate_beyond_allotment: Rate for personal service hours delivered when no allotted hours remain, USD per hour.
  billing_increment_minutes: Increment to which delivered service time is rounded up, minutes.
  minimum_visit_hours: Minimum hours drawn or billed per service visit, hours.
  companion_visit_minimum_hours: Minimum hours drawn or billed per companion visit regardless of package, hours.
  max_hours_per_visit: Maximum hours of one booked service visit, hours.
  unit_hours_equivalent: Per-unit mapping converting unit-priced hourly services into hours (laundry_load, linen_change), hours per unit.
  hourly_service_codes: List of services delivered against personal service hours.
  alacarte_service_codes: List of services priced separately and never drawn from hours.
  pet_care_available: Whether pet walking and pet care visits can be booked under the package, boolean.
  escort_off_campus_available: Whether escorts to off-campus appointments can be booked under the package, boolean.
  overnight_companion_available: Whether an overnight companion can be booked, boolean.
  overnight_companion_flat_rate: Flat rate for an overnight companion shift, USD per night.
  rollover_months: Number of months unused allotted hours carry forward before expiring, integer months.
  rollover_cap_hours: Maximum unused hours carried into the next month, hours.
  late_cancel_notice_hours: Hours before the scheduled start below which a cancellation is late, hours.
  late_cancel_hours_charged: Hours drawn or billed for a late cancellation, hours.
  no_show_hours_charged: Hours drawn or billed when staff arrive and the resident declines or is absent, hours.
  weekend_surcharge_pct: Surcharge on hours delivered on Saturday or Sunday, percent of the hours.
  holiday_surcharge_pct: Surcharge on hours delivered on a Larkspur holiday, percent of the hours.
  holiday_calendar: List of Larkspur holidays on which the holiday surcharge applies.
  order_booking_lead_hours: Hours of notice before the scheduled start below which a booking is a rush booking, hours.
  rush_booking_fee: Fee per rush booking, USD per order.
  max_open_orders: Maximum number of booked, not yet delivered or cancelled service orders at a time, integer count.
  transportation_rate_per_mile: Private transportation rate, USD per mile.
  transportation_minimum_charge: Minimum charge per private transportation trip, USD.
  handyman_hourly_rate: Handyman rate for resident-requested work, USD per hour.
  handyman_minimum_hours: Minimum hours billed per handyman visit, hours.
  grocery_delivery_fee: Fee per grocery delivery, USD.
  free_grocery_deliveries_per_month: Grocery deliveries per calendar month without the delivery fee, integer count.
  member_discount_pct: Discount on a la carte services for package holders, percent.
  eligible_residence_categories: List of Larkspur residence categories whose residents may hold this package.
  household_sharing: Whether both occupants of a double-occupancy independent living apartment draw from the one plan, boolean.
  enrollment_effective_day: Day of the month on which a plan or package change takes effect, integer.
  minimum_commitment_months: Minimum number of calendar months a package must remain in effect before a cancellation can take effect, integer months.
  change_notice_cutoff_day: Day of the month by which a package change request must be signed to take effect on the first day of the next month, integer.
  cancel_notice_cutoff_day: Day of the month by which a cancellation must be signed to end the plan on the last day of that month, integer.
  max_suspension_months_per_12m: Maximum suspended calendar months in any rolling 12-month window, integer months.
  suspension_min_absence_days: Minimum length of the absence that justifies a suspension, integer days.
  suspension_notice_days: Calendar days before the first suspended month by which the suspension must be requested, integer days.
  package_fee_proration_on_residency_end: Whether the package fee of the month in which the residency ends is prorated by days, boolean.
  dispute_window_days: Calendar days after the posting date of a charge or hours draw within which it may be disputed, integer days.
  fee_due_day: Day of the month on which the services statement falls due, integer.
  payment_grace_days: Calendar days after the due day before a late fee may be assessed, integer days.
  late_fee_flat: Late fee on a past-due services statement, USD.
  late_fee_min_past_due: Past-due amount below which no late fee is assessed, USD.
  returned_payment_fee: Fee for a returned payment, USD.

