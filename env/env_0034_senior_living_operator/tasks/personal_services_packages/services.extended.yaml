        Personal Services Comfort Package: {hourly_rate_beyond_allotment: "=hourly_rate_beyond_allotment", minimum_visit_hours: "=minimum_visit_hours", weekend_surcharge_pct: "=weekend_surcharge_pct", holiday_surcharge_pct: "=holiday_surcharge_pct", member_discount_pct: "=member_discount_pct", free_grocery_deliveries_per_month: "=free_grocery_deliveries_per_month"}
        Personal Services Premier Package: {hourly_rate_beyond_allotment: "=hourly_rate_beyond_allotment", minimum_visit_hours: "=minimum_visit_hours", weekend_surcharge_pct: "=weekend_surcharge_pct", holiday_surcharge_pct: "=holiday_surcharge_pct", member_discount_pct: "=member_discount_pct", free_grocery_deliveries_per_month: "=free_grocery_deliveries_per_month"}
        Personal Services Concierge Package: {hourly_rate_beyond_allotment: "=hourly_rate_beyond_allotment", minimum_visit_hours: "=minimum_visit_hours", weekend_surcharge_pct: "=weekend_surcharge_pct", holiday_surcharge_pct: "=holiday_surcharge_pct", member_discount_pct: "=member_discount_pct", free_grocery_deliveries_per_month: "=free_grocery_deliveries_per_month"}
    formula:
      hourly_charge_amount: round(hours * hourly_rate_beyond_allotment, 2)

  - id: services_late_cancellation
    subject: [services_order_cancel, services_hours_draw, services_hourly_charge]
    rule: >-
      A resident may cancel a booked order at any time before its start.
      A cancellation received less than late_cancel_notice_hours before the scheduled start, by services_msr_notice_hours, is late and draws late_cancel_hours_charged hours, or charges them at hourly_rate_beyond_allotment where no hours remain; a cancellation with at least late_cancel_notice_hours notice draws and charges nothing.
      When staff arrive and the resident declines the service or is absent, the order is recorded as a no_show and draws no_show_hours_charged hours on the same terms.
      Weekend and holiday surcharges never apply to late cancellation or no-show hours.
      No late cancellation or no-show hours are drawn when the resident was admitted to hospital, recorded on their Larkspur residency as an absence beginning on or before the scheduled date.
      Each order is cancelled once.
    eligibility:
      - id: cancel_once
        applies_to: [services_order_cancel]
        kind: dedup
        condition: Each order is cancelled once.
        evidence_fields: [services_orders.order_reference, services_orders.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_orders.order_reference]
          action_bindings:
            services_orders.order_reference: order_reference
        dedup_contract:
          table: services_orders
          mode: separate_record
          object_bindings: {order_reference: order_reference}
          duplicate_filters: {event_type: [services_order_cancel, services_order_complete]}
          distinct_fields: []
    measures: [services_msr_notice_hours]
    params:
      per_tier:
        Personal Services Pay-As-You-Go Plan: {late_cancel_notice_hours: "=late_cancel_notice_hours", late_cancel_hours_charged: "=late_cancel_hours_charged", no_show_hours_charged: "=no_show_hours_charged"}
        Personal Services Essentials Package: {late_cancel_notice_hours: "=late_cancel_notice_hours", late_cancel_hours_charged: "=late_cancel_hours_charged", no_show_hours_charged: "=no_show_hours_charged"}
        Personal Services Companion Package: {late_cancel_notice_hours: "=late_cancel_notice_hours", late_cancel_hours_charged: "=late_cancel_hours_charged", no_show_hours_charged: "=no_show_hours_charged"}
        Personal Services Comfort Package: {late_cancel_notice_hours: "=late_cancel_notice_hours", late_cancel_hours_charged: "=late_cancel_hours_charged", no_show_hours_charged: "=no_show_hours_charged"}
        Personal Services Premier Package: {late_cancel_notice_hours: "=late_cancel_notice_hours", late_cancel_hours_charged: "=late_cancel_hours_charged", no_show_hours_charged: "=no_show_hours_charged"}
        Personal Services Concierge Package: {late_cancel_notice_hours: "=late_cancel_notice_hours", late_cancel_hours_charged: "=late_cancel_hours_charged", no_show_hours_charged: "=no_show_hours_charged"}

  - id: services_package_change
    subject: [services_package_change_request, services_package_change_apply, services_package_fee_charge]
    rule: >-
      A resident may change to another package, higher or lower, by signed request; the change takes effect on the first day of the next month when signed on or before change_notice_cutoff_day of the current month, and on the first day of the month after next when signed later.
      Only one change may be pending at a time, and a later request replaces the pending one before it takes effect.
      A change to a lower package, or to the Pay-As-You-Go Plan, may take effect only after minimum_commitment_months of the current package have run from its effective date; a change to a higher package may take effect at any time.
      The commitment is counted in calendar months from the package's effective date, and a lower package may take effect on the first day of a month that is at least minimum_commitment_months after that date.
      On the change date the new package's fee and hours apply from that month; hours remaining under the old package expire at the end of the month before the change and roll over only where the old package allows.
      A change may not move an assisted living resident into a package whose eligible_residence_categories exclude assisted living.
      Package changes may be requested only while the plan is in active status.
    eligibility:
      - id: commitment_elapsed
        applies_to: [services_package_change_apply]
        kind: time
        condition: A change to a lower package, or to the Pay-As-You-Go Plan, may take effect only after minimum_commitment_months of the current package have run from its effective date; a change to a higher package may take effect at any time.
        evidence_fields: [services_plans.effective_date, services_plans.services_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_plans.services_plan_id]
          action_bindings:
            services_plans.services_plan_id: services_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its effective date
          anchor_source: services_plans.effective_date
          relation: not_before
          duration_source: variants.minimum_commitment_months
          unit: calendar_months
          counting_rule: The commitment is counted in calendar months from the package's effective date, and a lower package may take effect on the first day of a month that is at least minimum_commitment_months after that date.
          boundary: inclusive
      - id: change_while_active
        applies_to: [services_package_change_request]
        kind: state
        condition: Package changes may be requested only while the plan is in active status.
        evidence_fields: [services_plans.status, services_plans.services_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_plans.services_plan_id]
          action_bindings:
            services_plans.services_plan_id: services_plan_id
        state_contract:
          field: services_plans.status
          allowed: [active]
    params:
      per_tier:
        Personal Services Pay-As-You-Go Plan: {change_notice_cutoff_day: "=change_notice_cutoff_day", minimum_commitment_months: "=minimum_commitment_months", monthly_package_fee: "=monthly_package_fee"}
        Personal Services Essentials Package: {change_notice_cutoff_day: "=change_notice_cutoff_day", minimum_commitment_months: "=minimum_commitment_months", monthly_package_fee: "=monthly_package_fee"}
        Personal Services Companion Package: {change_notice_cutoff_day: "=change_notice_cutoff_day", minimum_commitment_months: "=minimum_commitment_months", monthly_package_fee: "=monthly_package_fee"}
        Personal Services Comfort Package: {change_notice_cutoff_day: "=change_notice_cutoff_day", minimum_commitment_months: "=minimum_commitment_months", monthly_package_fee: "=monthly_package_fee"}
        Personal Services Premier Package: {change_notice_cutoff_day: "=change_notice_cutoff_day", minimum_commitment_months: "=minimum_commitment_months", monthly_package_fee: "=monthly_package_fee"}
        Personal Services Concierge Package: {change_notice_cutoff_day: "=change_notice_cutoff_day", minimum_commitment_months: "=minimum_commitment_months", monthly_package_fee: "=monthly_package_fee"}

  - id: services_suspension
    subject: [services_suspend, services_resume]
    rule: >-
      A package may be suspended for whole calendar months while the resident is away from the community for at least suspension_min_absence_days, for a hospital, rehabilitation or extended family stay.
      A suspension must be requested no later than suspension_notice_days before the first suspended month.
      The notice is counted in calendar days back from the first day of the first suspended month, so the last day to request is that first day minus suspension_notice_days calendar days, inclusive.
      Suspended months in any rolling 12 months, services_msr_suspended_months_12m including the months requested, may not exceed max_suspension_months_per_12m of the package; the Pay-As-You-Go Plan has nothing to suspend.
      During a suspension no package fee is charged and no hours are granted, and hours left at the start of the suspension expire at the end of the month before it.
      The plan resumes on the first day of the month after the last suspended month, with that month's fee and allotment.
    eligibility:
      - id: suspension_notice
        applies_to: [services_suspend]
        kind: time
        condition: A suspension must be requested no later than suspension_notice_days before the first suspended month.
        evidence_fields: [services_plans.suspension_start_date, services_plans.services_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_plans.services_plan_id]
          action_bindings:
            services_plans.services_plan_id: services_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the first suspended month
          anchor_source: services_plans.suspension_start_date
          relation: not_after
          duration_source: variants.suspension_notice_days
          unit: calendar_days
          counting_rule: The notice is counted in calendar days back from the first day of the first suspended month, so the last day to request is that first day minus suspension_notice_days calendar days, inclusive.
          boundary: inclusive
      - id: suspension_quota
        applies_to: [services_suspend]
        kind: authorization
        condition: Suspended months in any rolling 12 months, services_msr_suspended_months_12m including the months requested, may not exceed max_suspension_months_per_12m of the package; the Pay-As-You-Go Plan has nothing to suspend.
        evidence_fields: [services_plans.suspension_start_date, services_plans.suspension_end_date, services_plans.services_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_plans.services_plan_id]
          action_bindings:
            services_plans.services_plan_id: services_plan_id
    measures: [services_msr_suspended_months_12m]
    params:
      per_tier:
        Personal Services Pay-As-You-Go Plan: {max_suspension_months_per_12m: "=max_suspension_months_per_12m", suspension_min_absence_days: "=suspension_min_absence_days", suspension_notice_days: "=suspension_notice_days"}
        Personal Services Essentials Package: {max_suspension_months_per_12m: "=max_suspension_months_per_12m", suspension_min_absence_days: "=suspension_min_absence_days", suspension_notice_days: "=suspension_notice_days"}
        Personal Services Companion Package: {max_suspension_months_per_12m: "=max_suspension_months_per_12m", suspension_min_absence_days: "=suspension_min_absence_days", suspension_notice_days: "=suspension_notice_days"}
        Personal Services Comfort Package: {max_suspension_months_per_12m: "=max_suspension_months_per_12m", suspension_min_absence_days: "=suspension_min_absence_days", suspension_notice_days: "=suspension_notice_days"}
        Personal Services Premier Package: {max_suspension_months_per_12m: "=max_suspension_months_per_12m", suspension_min_absence_days: "=suspension_min_absence_days", suspension_notice_days: "=suspension_notice_days"}
        Personal Services Concierge Package: {max_suspension_months_per_12m: "=max_suspension_months_per_12m", suspension_min_absence_days: "=suspension_min_absence_days", suspension_notice_days: "=suspension_notice_days"}

  - id: services_cancellation_and_end
    subject: [services_cancel_request, services_cancel_withdraw, services_end, services_credit]
    rule: >-
      A resident cancels a plan by signed cancellation: signed on or before cancel_notice_cutoff_day of a month, the plan ends on the last day of that month; signed later, on the last day of the following month.
      A package cancellation may not end the plan before minimum_commitment_months have run from the plan's effective date; the end date is then the last day of the month in which the commitment is completed.
      A cancellation may be withdrawn before its end date, and the plan continues unchanged.
      When the resident's independent living or assisted living residency ends, the plan ends on that residency's fee end date without notice or commitment, and the package fee for the days after it is credited where package_fee_proration_on_residency_end is true.
      A plan whose residency has ended may be ended without the resident's signature, on the strength of the residency record.
    eligibility:
      - id: residency_end_on_record
        applies_to: [services_end]
        kind: authorization
        condition: A plan whose residency has ended may be ended without the resident's signature, on the strength of the residency record.
        evidence_fields: [independent_residencies.status, assisted_residencies.status, independent_residencies.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.customer_id]
          action_bindings:
            independent_residencies.customer_id: customer_id
    params:
      per_tier:
        Personal Services Pay-As-You-Go Plan: {cancel_notice_cutoff_day: "=cancel_notice_cutoff_day", minimum_commitment_months: "=minimum_commitment_months", package_fee_proration_on_residency_end: "=package_fee_proration_on_residency_end"}
        Personal Services Essentials Package: {cancel_notice_cutoff_day: "=cancel_notice_cutoff_day", minimum_commitment_months: "=minimum_commitment_months", package_fee_proration_on_residency_end: "=package_fee_proration_on_residency_end"}
        Personal Services Companion Package: {cancel_notice_cutoff_day: "=cancel_notice_cutoff_day", minimum_commitment_months: "=minimum_commitment_months", package_fee_proration_on_residency_end: "=package_fee_proration_on_residency_end"}
        Personal Services Comfort Package: {cancel_notice_cutoff_day: "=cancel_notice_cutoff_day", minimum_commitment_months: "=minimum_commitment_months", package_fee_proration_on_residency_end: "=package_fee_proration_on_residency_end"}
        Personal Services Premier Package: {cancel_notice_cutoff_day: "=cancel_notice_cutoff_day", minimum_commitment_months: "=minimum_commitment_months", package_fee_proration_on_residency_end: "=package_fee_proration_on_residency_end"}
        Personal Services Concierge Package: {cancel_notice_cutoff_day: "=cancel_notice_cutoff_day", minimum_commitment_months: "=minimum_commitment_months", package_fee_proration_on_residency_end: "=package_fee_proration_on_residency_end"}

  - id: services_disputes_and_corrections
    subject: [services_credit, services_hours_restore]
    rule: >-
      A resident may dispute a charge or an hours draw - a service not delivered, delivered short, or drawn or charged twice - only within dispute_window_days after it was posted.
      The dispute window is counted in calendar days from the posting date of the disputed entry, the posting date being day 0, and a dispute raised on the last day is in time.
      An upheld dispute of an hours draw restores the hours drawn in error referencing that draw, added to the current month's available hours; an upheld dispute of a money charge is credited as service_dispute referencing that charge; a charge posted against the wrong plan or at the wrong rate is credited as billing_error.
      A credit or restore never exceeds the disputed entry, and each entry is credited at most once for each credit reason and restored at most once.
      A draw or charge that matches the delivered minutes, the rounding and the surcharge rules is not an error.
    eligibility:
      - id: within_dispute_window
        applies_to: [services_credit, services_hours_restore]
        kind: time
        condition: A resident may dispute a charge or an hours draw - a service not delivered, delivered short, or drawn or charged twice - only within dispute_window_days after it was posted.
        evidence_fields: [services_ledger.posting_date, services_ledger.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_ledger.source_entry_id]
          action_bindings:
            services_ledger.source_entry_id: source_entry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: it was posted
          anchor_source: services_ledger.posting_date
          relation: not_after
          duration_source: variants.dispute_window_days
          unit: calendar_days
          counting_rule: The dispute window is counted in calendar days from the posting date of the disputed entry, the posting date being day 0, and a dispute raised on the last day is in time.
          boundary: inclusive
      - id: one_correction_per_entry
        applies_to: [services_credit, services_hours_restore]
        kind: dedup
        condition: A credit or restore never exceeds the disputed entry, and each entry is credited at most once for each credit reason and restored at most once.
        evidence_fields: [services_ledger.source_entry_id, services_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_ledger.source_entry_id]
          action_bindings:
            services_ledger.source_entry_id: source_entry_id
        dedup_contract:
          table: services_ledger
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id, credit_reason: credit_reason}
          duplicate_filters: {event_type: [services_credit, services_hours_restore]}
          distinct_fields: []
    params:
      per_tier:
        Personal Services Pay-As-You-Go Plan: {dispute_window_days: "=dispute_window_days"}
        Personal Services Essentials Package: {dispute_window_days: "=dispute_window_days"}
        Personal Services Companion Package: {dispute_window_days: "=dispute_window_days"}
        Personal Services Comfort Package: {dispute_window_days: "=dispute_window_days"}
        Personal Services Premier Package: {dispute_window_days: "=dispute_window_days"}
        Personal Services Concierge Package: {dispute_window_days: "=dispute_window_days"}

  - id: services_payments_and_fees
    subject: [services_payment, services_payment_return, services_fee_charge]
    rule: >-
      The services statement for a month falls due on fee_due_day of the following month; payments are posted once per instrument and applied oldest charge first.
      A late fee may be assessed only after payment_grace_days have passed since the statement fell due.
      The grace period ends at the end of the day equal to the due date plus payment_grace_days calendar days, and the late fee may be assessed only on a later date.
      The late fee is late_fee_flat once per statement month, and none is assessed when services_msr_period_past_due is below late_fee_min_past_due.
      A returned payment is reinstated referencing the payment entry and carries returned_payment_fee referencing it.
      At most one late fee is charged per statement month.
    eligibility:
      - id: grace_elapsed
        applies_to: [services_fee_charge]
        kind: time
        condition: A late fee may be assessed only after payment_grace_days have passed since the statement fell due.
        evidence_fields: [services_ledger.posting_date, services_ledger.services_plan_id, services_ledger.billing_period]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_ledger.services_plan_id, services_ledger.billing_period]
          action_bindings:
            services_ledger.services_plan_id: services_plan_id
            services_ledger.billing_period: billing_period
        temporal_basis:
          clock: frozen_time
          anchor_event: the statement fell due
          anchor_source: services_ledger.posting_date
          relation: not_before
          duration_source: variants.payment_grace_days
          unit: calendar_days
          counting_rule: The grace period ends at the end of the day equal to the due date plus payment_grace_days calendar days, and the late fee may be assessed only on a later date.
          boundary: exclusive
      - id: one_late_fee_per_month
        applies_to: [services_fee_charge]
        kind: dedup
        condition: At most one late fee is charged per statement month.
        evidence_fields: [services_ledger.services_plan_id, services_ledger.billing_period, services_ledger.fee_code, services_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_ledger.services_plan_id, services_ledger.billing_period, services_ledger.fee_code]
          action_bindings:
            services_ledger.services_plan_id: services_plan_id
            services_ledger.billing_period: billing_period
            services_ledger.fee_code: fee_code
        dedup_contract:
          table: services_ledger
          mode: separate_record
          object_bindings: {services_plan_id: services_plan_id, billing_period: billing_period, fee_code: fee_code}
          duplicate_filters: {event_type: [services_fee_charge]}
          distinct_fields: []
    measures: [services_msr_period_past_due]
    params:
      per_tier:
        Personal Services Pay-As-You-Go Plan: {late_fee_flat: "=late_fee_flat", late_fee_min_past_due: "=late_fee_min_past_due", returned_payment_fee: "=returned_payment_fee", payment_grace_days: "=payment_grace_days"}
        Personal Services Essentials Package: {late_fee_flat: "=late_fee_flat", late_fee_min_past_due: "=late_fee_min_past_due", returned_payment_fee: "=returned_payment_fee", payment_grace_days: "=payment_grace_days"}
        Personal Services Companion Package: {late_fee_flat: "=late_fee_flat", late_fee_min_past_due: "=late_fee_min_past_due", returned_payment_fee: "=returned_payment_fee", payment_grace_days: "=payment_grace_days"}
        Personal Services Comfort Package: {late_fee_flat: "=late_fee_flat", late_fee_min_past_due: "=late_fee_min_past_due", returned_payment_fee: "=returned_payment_fee", payment_grace_days: "=payment_grace_days"}
        Personal Services Premier Package: {late_fee_flat: "=late_fee_flat", late_fee_min_past_due: "=late_fee_min_past_due", returned_payment_fee: "=returned_payment_fee", payment_grace_days: "=payment_grace_days"}
        Personal Services Concierge Package: {late_fee_flat: "=late_fee_flat", late_fee_min_past_due: "=late_fee_min_past_due", returned_payment_fee: "=returned_payment_fee", payment_grace_days: "=payment_grace_days"}

# ============================================================================
# extended_policies (personal_services_packages)
# ============================================================================
extended_policies:
  - id: services_ext_short_visit_credit
    base_policy_refs: [services_cancellation_and_end, services_disputes_and_corrections, services_hours_and_billing]
    overwrite:
      - base_policy: services_disputes_and_corrections
        superseded_clause: >-
          A draw or charge that matches the delivered minutes, the rounding and the surcharge rules is not an error.
        replaced_by: >-
          A charge re-rated under this rule is corrected on the re-rated figure even where it matches the delivered minutes, the rounding and the surcharge rules that govern hours when they are first drawn and charged; those rules stay in force for every first posting, and the re-rating rules here apply only to working out a correction.
      - base_policy: services_disputes_and_corrections
        superseded_clause: >-
          an upheld dispute of a money charge is credited as service_dispute referencing that charge
        replaced_by: >-
          A goodwill amount is added to the difference: goodwill_two_or_more where at least two service dispute credits were posted on the plan in the dispute_lookback_months months before the correction, goodwill_one where exactly one was, and nothing where none was.
    trigger: state_due
    subject: [services_credit]
    computes: amount
    target_tool: post_services_visit_credit_5ef485c2
    params:
      relief_short_days: 3
      relief_long_days: 7
      relief_short_factor: 0.5
      relief_long_factor: 0.8
      lifecare_rate_reduction: 4.00
      fee_for_service_rate_reduction: 2.00
      goodwill_two_or_more: 25.00
      goodwill_one: 10.00
      dispute_lookback_months: 12
    rule: >-
      An hourly charge for a delivered visit that the visit record shows was billed on more time than the visit supports is corrected by the desk whenever it is found within dispute_window_days of its posting date, without waiting for the resident to raise it, and corrections are made one charge at a time beginning with the most recently posted hourly charge for a delivered visit; the visit's booked hours, delivered minutes, service and date are those recorded on that charge's own service order.
      The correction is posted as one service dispute credit referencing that hourly charge and carrying the billing month of the charge.
      A charge re-rated under this rule is corrected on the re-rated figure even where it matches the delivered minutes, the rounding and the surcharge rules that govern hours when they are first drawn and charged; those rules stay in force for every first posting, and the re-rating rules here apply only to working out a correction.
      A re-rated visit's billable time is its delivered minutes rounded up to the next billing_increment_minutes, expressed in hours and never counted below companion_visit_minimum_hours for a companion visit or below minimum_visit_hours for any other hourly service.
      The hours treated as already covering the visit are the hours the visit's order drew.
      The billable hours beyond the hours covering the visit are charged at hourly_rate_beyond_allotment of the package, the re-rated charge being rounded to the cent half up.
      The credit is the posted hourly charge less the re-rated charge, never more than the posted hourly charge.
      When the charge is re-rated, the visit's delivered minutes are billed as follows: where fewer minutes were delivered than were booked, the delivered minutes are rounded down to a whole number of billing_increment_minutes; where more minutes were delivered than were booked, the billed minutes are the booked minutes; otherwise the delivered minutes are rounded up to the next billing_increment_minutes.
      The billable hours of a visit delivered on a date in holiday_calendar are increased by holiday_surcharge_pct percent, those of a visit delivered on any other Saturday or Sunday are increased by weekend_surcharge_pct percent, and those of any other visit are not increased.
      Where the visit ended short of its booked time and the resident's assisted living residency records a hospital or rehabilitation absence that began no fewer than zero and no more than relief_short_days days after the visit date, the visit is treated as cut short by the illness that led to the admission and the surcharged billable hours are multiplied by relief_short_factor; where the visit ended short of its booked time and such an absence began more than relief_short_days and no more than relief_long_days days after the visit date, they are multiplied by relief_long_factor; otherwise they stand as surcharged.
      The billable hours are rounded to two decimal places half up once the surcharge and any multiplier have been applied, and never earlier.
      The hours treated as already covering the visit are, where hours expired unused at the end of the visit's billing month, the hours the visit's order drew plus those expired hours; where no hours expired at the end of that month but hours were restored to the plan in that month, the hours the order drew plus those restored hours; and otherwise the hours the order drew.
      The re-rated hours beyond those covering the visit are charged at hourly_rate_beyond_allotment of the package less lifecare_rate_reduction where the resident holds an occupied Entrance Fee Agreement on a lifecare contract (the LifeCare Declining Balance Plan or the LifeCare 90% Refundable Plan), at hourly_rate_beyond_allotment less fee_for_service_rate_reduction where the resident holds an occupied Entrance Fee Agreement on a fee-for-service contract (any LifeChoice plan), and at hourly_rate_beyond_allotment otherwise, the re-rated charge being rounded to the cent half up.
      A goodwill amount is added to the difference: goodwill_two_or_more where at least two service dispute credits were posted on the plan in the dispute_lookback_months months before the correction, goodwill_one where exactly one was, and nothing where none was.
      The credit is first worked out as the posted hourly charge less the re-rated charge, the goodwill amount is then added to that difference, and the sum is capped at the posted hourly charge and rounded to the cent half up.
      A charge whose re-rated charge is not below the posted hourly charge was not billed on more time than the visit supports and is credited nothing.
      The dispute look-back is counted from each credit's posting date to the date of the correction, a whole month elapsing on the same day of each later month.
    prerequisite: []
    cross_category:
      - category: assisted
        as: branch
        reads: [status, absence_reason, absence_start_date]
        note: The illness relief factor reads the hospital or rehabilitation absence recorded on the resident's assisted living residency to decide the multiplier tier.
      - category: entrance
        as: branch
        reads: [status, contract_type]
        note: The overage rate factor reads whether the resident holds an occupied Entrance Fee Agreement and its contract type to decide the rate reduction tier.
    compute:
      - visit_ref: "LATEST('services_ledger', 'order_reference', date_field='posting_date', event_type='services_hourly_charge', draw_basis='service_delivered')"
      - charged_amount: "LATEST('services_ledger', 'amount', date_field='posting_date', event_type='services_hourly_charge', order_reference=visit_ref)"
      - visit_month: "LATEST('services_ledger', 'billing_period', date_field='posting_date', event_type='services_hourly_charge', order_reference=visit_ref)"
      - booked_hours: "LATEST('services_orders', 'scheduled_hours', date_field='scheduled_date', event_type='services_order_book', order_reference=visit_ref)"
      - delivered_minutes: "LATEST('services_orders', 'actual_minutes', date_field='scheduled_date', event_type='services_order_complete', order_reference=visit_ref)"
      - visit_date: "LATEST('services_orders', 'scheduled_date', date_field='scheduled_date', event_type='services_order_complete', order_reference=visit_ref)"
      - visit_service: "LATEST('services_orders', 'service_code', date_field='scheduled_date', event_type='services_order_complete', order_reference=visit_ref)"
      - increment: "P('billing_increment_minutes')"
      - billed_minutes: "(int(delivered_minutes // increment) * increment) if delivered_minutes < booked_hours * 60 else ((booked_hours * 60) if delivered_minutes > booked_hours * 60 else (-((-delivered_minutes) // increment) * increment))"
      - floor_hours: "P('companion_visit_minimum_hours') if visit_service == 'companion_visit' else P('minimum_visit_hours')"
      - base_hours: "MX(billed_minutes / 60, floor_hours)"
      - is_holiday: "visit_date == '2025-01-01' or visit_date == '2025-05-26' or visit_date == '2025-07-04' or visit_date == '2025-09-01' or visit_date == '2025-11-27' or visit_date == '2025-12-25' or visit_date == '2026-01-01' or visit_date == '2026-05-25' or visit_date == '2026-07-04' or visit_date == '2026-09-07' or visit_date == '2026-11-26' or visit_date == '2026-12-25' or visit_date == '2027-01-01' or visit_date == '2027-05-31' or visit_date == '2027-07-04' or visit_date == '2027-09-06' or visit_date == '2027-11-25' or visit_date == '2027-12-25'"
      - weekday_index: "DAYS('2026-01-03', visit_date) % 7"
      - surcharge_pct: "P('holiday_surcharge_pct') if is_holiday else (P('weekend_surcharge_pct') if (weekday_index == 0 or weekday_index == 1) else 0)"
      - al_absence_reason: "CFIELD('assisted', 'absence_reason')"
      - al_absence_start: "CFIELD('assisted', 'absence_start_date')"
      - medical_absence: "al_absence_reason == 'hospital' or al_absence_reason == 'rehab_facility'"
      - days_to_absence: "DAYS(visit_date, al_absence_start) if al_absence_start else -1"
      - visit_cut_short: "delivered_minutes < booked_hours * 60"
      - relief_factor: "K('relief_short_factor') if (visit_cut_short and medical_absence and days_to_absence >= 0 and days_to_absence <= K('relief_short_days')) else (K('relief_long_factor') if (visit_cut_short and medical_absence and days_to_absence > K('relief_short_days') and days_to_absence <= K('relief_long_days')) else 1)"
      - billable_hours: "RND(base_hours * (1 + surcharge_pct / 100) * relief_factor, 2)"
      - drawn_on_order: "SUM('services_ledger', 'hours', event_type='services_hours_draw', order_reference=visit_ref)"
      - expired_in_month: "SUM('services_ledger', 'hours', event_type='services_hours_expire', expiry_basis='month_end', billing_period=visit_month)"
      - restored_in_month: "SUM('services_ledger', 'hours', event_type='services_hours_restore', billing_period=visit_month)"
      - covering_hours: "(drawn_on_order + expired_in_month) if expired_in_month > 0 else ((drawn_on_order + restored_in_month) if (expired_in_month == 0 and restored_in_month > 0) else drawn_on_order)"
      - rerated_hours: "MX(0, billable_hours - covering_hours)"
      - entrance_status: "CFIELD('entrance', 'status', status='occupied')"
      - entrance_contract: "CPARAM('entrance', 'contract_type', status='occupied')"
      - overage_rate: "(P('hourly_rate_beyond_allotment') - K('lifecare_rate_reduction')) if (entrance_status == 'occupied' and entrance_contract == 'lifecare') else ((P('hourly_rate_beyond_allotment') - K('fee_for_service_rate_reduction')) if (entrance_status == 'occupied' and entrance_contract == 'fee_for_service') else P('hourly_rate_beyond_allotment'))"
      - rerated_charge: "RND(rerated_hours * overage_rate, 2)"
      - prior_disputes: "COUNT('services_ledger', within_months=K('dispute_lookback_months'), date_field='posting_date', event_type='services_credit', credit_reason='service_dispute')"
      - goodwill: "K('goodwill_two_or_more') if prior_disputes >= 2 else (K('goodwill_one') if prior_disputes == 1 else 0)"
      - result: "RND(MN(charged_amount, charged_amount - rerated_charge + goodwill), 2) if rerated_charge < charged_amount else 0"
    compute_basis:
      visit_ref: "corrections are made one charge at a time beginning with the most recently posted hourly charge for a delivered visit"
      charged_amount: "The credit is the posted hourly charge less the re-rated charge, never more than the posted hourly charge."
      visit_month: "The correction is posted as one service dispute credit referencing that hourly charge and carrying the billing month of the charge."
      booked_hours: "the visit's booked hours, delivered minutes, service and date are those recorded on that charge's own service order"
      delivered_minutes: "the visit's booked hours, delivered minutes, service and date are those recorded on that charge's own service order"
      visit_date: "the visit's booked hours, delivered minutes, service and date are those recorded on that charge's own service order"
      visit_service: "the visit's booked hours, delivered minutes, service and date are those recorded on that charge's own service order"
      increment: "A re-rated visit's billable time is its delivered minutes rounded up to the next billing_increment_minutes"
      billed_minutes: "where fewer minutes were delivered than were booked, the delivered minutes are rounded down to a whole number of billing_increment_minutes; where more minutes were delivered than were booked, the billed minutes are the booked minutes; otherwise the delivered minutes are rounded up to the next billing_increment_minutes."
      floor_hours: "never counted below companion_visit_minimum_hours for a companion visit or below minimum_visit_hours for any other hourly service."
