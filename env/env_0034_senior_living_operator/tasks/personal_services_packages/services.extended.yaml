    factors:
      - id: delivered_time_billing
        effect: method
        decides: billed_minutes
        bindings: [booked_hours, delivered_minutes, increment, billed_minutes]
        ladder:
          - when: "fewer minutes were delivered than the order booked"
            method: "the delivered minutes are rounded down to a whole number of billing_increment_minutes"
          - when: "more minutes were delivered than the order booked"
            method: "the billed minutes are the booked minutes"
          - when: "otherwise"
            method: "the delivered minutes are rounded up to the next billing_increment_minutes"
        baseline:
          billed_minutes: "-((-delivered_minutes) // increment) * increment"
        evidence: [history]
        cross_difficulty: null
      - id: date_surcharge
        effect: parameter
        decides: surcharge_pct
        bindings: [is_holiday, weekday_index, surcharge_pct]
        ladder:
          - when: "the visit date is in holiday_calendar"
            value: "P('holiday_surcharge_pct')"
          - when: "the visit date is a Saturday or Sunday not in holiday_calendar"
            value: "P('weekend_surcharge_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          surcharge_pct: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: illness_relief
        effect: parameter
        decides: relief_factor
        bindings: [al_absence_reason, al_absence_start, medical_absence, days_to_absence, visit_cut_short, relief_factor]
        ladder:
          - when: "the visit ended short of its booked time and the assisted living residency records a hospital or rehabilitation absence that began 0 to relief_short_days days after the visit date"
            value: "K('relief_short_factor')"
          - when: "the visit ended short of its booked time and the assisted living residency records a hospital or rehabilitation absence that began more than relief_short_days and at most relief_long_days days after the visit date"
            value: "K('relief_long_factor')"
          - when: "otherwise"
            value: "1"
        baseline:
          relief_factor: "1"
        evidence: [cross_category, date]
        cross_difficulty: assisted
      - id: covering_hours_rule
        effect: method
        decides: covering_hours
        bindings: [expired_in_month, restored_in_month, covering_hours]
        ladder:
          - when: "hours expired unused at the end of the visit's billing month"
            method: "the hours covering the visit are the hours the order drew plus the hours that expired at that month end"
          - when: "no hours expired at the end of that month and hours were restored to the plan in that month"
            method: "the hours covering the visit are the hours the order drew plus the hours restored in that month"
          - when: "otherwise"
            method: "the hours covering the visit are the hours the order drew"
        baseline:
          covering_hours: "drawn_on_order"
        evidence: [history]
        cross_difficulty: null
      - id: entrance_overage_rate
        effect: parameter
        decides: overage_rate
        bindings: [entrance_status, entrance_contract, overage_rate]
        ladder:
          - when: "the resident holds an occupied Entrance Fee Agreement and its plan is a lifecare contract (the LifeCare Declining Balance Plan or the LifeCare 90% Refundable Plan)"
            value: "P('hourly_rate_beyond_allotment') - K('lifecare_rate_reduction')"
          - when: "the resident holds an occupied Entrance Fee Agreement and its plan is a fee-for-service contract (any LifeChoice plan)"
            value: "P('hourly_rate_beyond_allotment') - K('fee_for_service_rate_reduction')"
          - when: "otherwise"
            value: "P('hourly_rate_beyond_allotment')"
        baseline:
          overage_rate: "P('hourly_rate_beyond_allotment')"
        evidence: [cross_category, tier_param]
        cross_difficulty: entrance
      - id: dispute_goodwill
        effect: parameter
        decides: goodwill
        bindings: [prior_disputes, goodwill]
        ladder:
          - when: "at least two service dispute credits were posted on the plan in the last dispute_lookback_months months"
            value: "K('goodwill_two_or_more')"
          - when: "exactly one service dispute credit was posted on the plan in the last dispute_lookback_months months"
            value: "K('goodwill_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          goodwill: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        An hourly charge for a delivered visit that the visit record shows was billed on more time than the visit supports is corrected by the desk whenever it is found within dispute_window_days of its posting date, without waiting for the resident to raise it, and corrections are made one charge at a time beginning with the most recently posted hourly charge for a delivered visit; the visit's booked hours, delivered minutes, service and date are those recorded on that charge's own service order.
        The correction is posted as one service dispute credit referencing that hourly charge and carrying the billing month of the charge.
        A re-rated visit's billable time is its delivered minutes rounded up to the next billing_increment_minutes, expressed in hours and never counted below companion_visit_minimum_hours for a companion visit or below minimum_visit_hours for any other hourly service.
        The hours treated as already covering the visit are the hours the visit's order drew.
        The billable hours beyond the hours covering the visit are charged at hourly_rate_beyond_allotment of the package, the re-rated charge being rounded to the cent half up.
        The credit is the posted hourly charge less the re-rated charge, never more than the posted hourly charge.
      params: [dispute_window_days, billing_increment_minutes, companion_visit_minimum_hours, minimum_visit_hours, hourly_rate_beyond_allotment]
    inputs:
      history:
        - {table: services_ledger, aggregate: latest, field: amount, filters: {event_type: services_hourly_charge, draw_basis: service_delivered}}
        - {table: services_ledger, aggregate: sum, field: hours, filters: {event_type: services_hours_draw}}
        - {table: services_ledger, aggregate: sum, field: hours, filters: {event_type: services_hours_expire, expiry_basis: month_end}}
        - {table: services_ledger, aggregate: sum, field: hours, filters: {event_type: services_hours_restore}}
        - {table: services_ledger, aggregate: count, field: services_entry_id, within_months: 12, filters: {event_type: services_credit, credit_reason: service_dispute}}
        - {table: services_orders, aggregate: latest, field: actual_minutes, filters: {event_type: services_order_complete}}
      cross_category: [assisted, entrance]

  - id: services_ext_suspension_months
    base_policy_refs: [services_suspension]
    overwrite:
      - base_policy: services_suspension
        superseded_clause: >-
          Suspended months in any rolling 12 months, services_msr_suspended_months_12m including the months requested, may not exceed max_suspension_months_per_12m of the package; the Pay-As-You-Go Plan has nothing to suspend.
        replaced_by: >-
          The months a suspension may run are worked out as one total: the package's max_suspension_months_per_12m, which is the starting allowance and not a ceiling, plus the months added for the plan's time in force, less the months counted for the plan's most recent recorded suspension; that total is never below zero, the floor being applied once to the final number of months and never to a part of it, and the Pay-As-You-Go Plan has nothing to suspend.
    trigger: on_request
    subject: [services_suspend]
    computes: suspended_months
    target_tool: sign_services_suspension_89d6021d
    params:
      medical_extra_on_leave: 2
      medical_extra_returned: 1
      medical_return_window_days: 30
      loyalty_long_months: 48
      loyalty_mid_months: 24
      loyalty_long_extra: 2
      loyalty_mid_extra: 1
      high_past_due: 100.00
      high_past_due_deduction: 2
      any_past_due_deduction: 1
      older_suspension_months: 3
      older_suspension_share: 0.5
      window_months: 12
    rule: >-
      A resident who asks to suspend the package for as long as the package allows is suspended for whole calendar months from the first calendar month whose first day is at least suspension_notice_days days after the request is signed, and the signed suspension records that first month and the number of months it runs; it ends on the last day of its last suspended month.
      The months a suspension may run are worked out as one total: the package's max_suspension_months_per_12m, which is the starting allowance and not a ceiling, plus the months added for the plan's time in force, less the months counted for the plan's most recent recorded suspension; that total is never below zero, the floor being applied once to the final number of months and never to a part of it, and the Pay-As-You-Go Plan has nothing to suspend.
      Time in force adds loyalty_long_extra months where the whole months since the plan's effective date are at least loyalty_long_months, loyalty_mid_extra month where they are at least loyalty_mid_months but fewer than loyalty_long_months, and nothing where they are fewer than loyalty_mid_months.
      Of the plan's most recent recorded suspension, the months that ended fewer than window_months whole months before the request are counted, and nothing is counted where the plan has none on record.
      Whole months are counted from the earlier date to the date of the request, a whole month elapsing on the same day of each later month.
      The number of months a suspension may run is fixed only after every hourly charge on the plan that its visit record shows billed on more time than was delivered carries a service dispute credit referencing it.
      Where the resident's assisted living residency is on leave for a hospital or rehabilitation absence, medical_extra_on_leave months are added to the total; where the residency is active again after a hospital or rehabilitation absence that ended no more than medical_return_window_days days before the request, medical_extra_returned month is added; otherwise no month is added for an absence.
      The whole months of time in force that decide the time-in-force months are counted by one of three methods: where the resident came to the assisted living residency the plan serves from a Larkspur independent living residency whose move-in date is on record, they run from that earlier move-in date, so that years as a Larkspur resident carry over; where the resident did not and the plan has a recorded suspension, they run from the plan's effective date and the months of that suspension are taken away, so that months on hold do not count; otherwise they run from the plan's effective date.
      The amount past due is the balance the plan's ledger shows owed, that is every package fee, hourly charge, a la carte charge, late or returned payment fee and returned payment less every payment and credit, less the package fee charged on the ledger on the first day of the current month (nothing where no fee was charged for the current month); where it is at least high_past_due, high_past_due_deduction months are deducted from the total; where it is above zero but below high_past_due, any_past_due_deduction month is deducted; where it is zero or less, no month is deducted.
      The months counted for the most recent recorded suspension are taken at one of three shares: where that suspension lay within a hospital or rehabilitation absence recorded on the resident's assisted living residency, at none; where it did not and it ended at least older_suspension_months whole months before the request, at older_suspension_share, rounded down to a whole month; otherwise in full.
    prerequisite:
      - problem: services_ext_short_visit_credit
        kind: value_input
        gate: past_due
        form: state
        policy_source: >-
          The number of months a suspension may run is fixed only after every hourly charge on the plan that its visit record shows billed on more time than was delivered carries a service dispute credit referencing it.
        condition: >-
          Every services_hourly_charge on the plan whose order's completion record shows fewer delivered minutes than the time billed has a services_credit with credit_reason service_dispute whose source_entry_id is that charge, so the balance the ledger shows owed no longer includes the overbilled amount.
        resolved_by: post_services_visit_credit_5ef485c2
        effect: >-
          The credit entry adds to the credits the ledger balance subtracts, which lowers the amount past due that the account standing deduction reads and can move the deduction to a lower tier.
    cross_category:
      - category: assisted
        as: branch
        reads: [status, absence_reason, absence_start_date, absence_return_date, admission_source]
        note: The absence extension and the share of the previous suspension read the hospital or rehabilitation absence on the resident's assisted living residency; the time-in-force count reads where the resident was admitted from.
      - category: independent
        as: history
        reads: [move_in_date]
        note: The time-in-force count reads the move-in date of the resident's earlier Larkspur independent living residency.
    compute:
      - max_base: "P('max_suspension_months_per_12m')"
      - al_status: "CFIELD('assisted', 'status')"
      - al_reason: "CFIELD('assisted', 'absence_reason')"
      - al_return: "CFIELD('assisted', 'absence_return_date')"
      - medical_absence: "al_reason == 'hospital' or al_reason == 'rehab_facility'"
      - days_since_return: "DAYS(al_return, NOW) if al_return else 9999"
      - absence_extra: "K('medical_extra_on_leave') if (al_status == 'on_leave' and medical_absence) else (K('medical_extra_returned') if (al_status == 'active' and medical_absence and days_since_return <= K('medical_return_window_days')) else 0)"
      - prior_start: "F('suspension_start_date')"
      - prior_end: "F('suspension_end_date')"
      - prior_months: "(MONTHS(prior_start, prior_end) + 1) if prior_end else 0"
      - months_since_prior_end: "MONTHS(prior_end, NOW) if prior_end else 9999"
      - al_source: "CFIELD('assisted', 'admission_source')"
      - il_move_in: "CFIELD('independent', 'move_in_date')"
      - months_in_force: "MONTHS(il_move_in, NOW) if (al_source == 'larkspur_independent' and il_move_in) else ((MONTHS(F('effective_date'), NOW) - prior_months) if prior_end else MONTHS(F('effective_date'), NOW))"
      - tenure_extra: "K('loyalty_long_extra') if months_in_force >= K('loyalty_long_months') else (K('loyalty_mid_extra') if months_in_force >= K('loyalty_mid_months') else 0)"
      - ledger_charges: "SUM('services_ledger', 'amount', event_type='services_package_fee_charge') + SUM('services_ledger', 'amount', event_type='services_hourly_charge') + SUM('services_ledger', 'amount', event_type='services_alacarte_charge') + SUM('services_ledger', 'amount', event_type='services_fee_charge') + SUM('services_ledger', 'amount', event_type='services_payment_return')"
      - ledger_reductions: "SUM('services_ledger', 'amount', event_type='services_payment') + SUM('services_ledger', 'amount', event_type='services_credit')"
      - current_fee_date: "LATEST('services_ledger', 'posting_date', date_field='posting_date', event_type='services_package_fee_charge')"
      - current_fee: "LATEST('services_ledger', 'amount', date_field='posting_date', event_type='services_package_fee_charge') if (current_fee_date and MONTHS(current_fee_date, NOW) == 0) else 0"
      - past_due: "RND(ledger_charges - ledger_reductions - current_fee, 2)"
      - standing_deduction: "K('high_past_due_deduction') if past_due >= K('high_past_due') else (K('any_past_due_deduction') if past_due > 0 else 0)"
      - window_counted: "MX(0, MN(prior_months, K('window_months') - months_since_prior_end))"
      - al_start: "CFIELD('assisted', 'absence_start_date')"
      - prior_in_medical_absence: "medical_absence and al_start and prior_start and al_start <= prior_start and ((not al_return) or al_return >= prior_end)"
      - prior_share: "0 if prior_in_medical_absence else (K('older_suspension_share') if months_since_prior_end >= K('older_suspension_months') else 1)"
      - counted_prior: "int(window_counted * prior_share)"
      - result: "0 if max_base == 0 else MX(0, max_base + absence_extra + tenure_extra - standing_deduction - counted_prior)"
    compute_basis:
      max_base: "the package's max_suspension_months_per_12m, which is the starting allowance and not a ceiling"
      al_status: "Where the resident's assisted living residency is on leave for a hospital or rehabilitation absence"
      al_reason: "Where the resident's assisted living residency is on leave for a hospital or rehabilitation absence"
      al_return: "where the residency is active again after a hospital or rehabilitation absence that ended no more than medical_return_window_days days before the request"
      medical_absence: "for a hospital or rehabilitation absence"
      days_since_return: "a hospital or rehabilitation absence that ended no more than medical_return_window_days days before the request"
      absence_extra: "Where the resident's assisted living residency is on leave for a hospital or rehabilitation absence, medical_extra_on_leave months are added to the total; where the residency is active again after a hospital or rehabilitation absence that ended no more than medical_return_window_days days before the request, medical_extra_returned month is added; otherwise no month is added for an absence."
      prior_start: "Of the plan's most recent recorded suspension, the months that ended fewer than window_months whole months before the request are counted"
      prior_end: "the months that ended fewer than window_months whole months before the request are counted"
      prior_months: "Of the plan's most recent recorded suspension, the months that ended fewer than window_months whole months before the request are counted, and nothing is counted where the plan has none on record."
      months_since_prior_end: "Whole months are counted from the earlier date to the date of the request, a whole month elapsing on the same day of each later month."
      al_source: "where the resident came to the assisted living residency the plan serves from a Larkspur independent living residency whose move-in date is on record"
      il_move_in: "they run from that earlier move-in date, so that years as a Larkspur resident carry over"
      months_in_force: "The whole months of time in force that decide the time-in-force months are counted by one of three methods: where the resident came to the assisted living residency the plan serves from a Larkspur independent living residency whose move-in date is on record, they run from that earlier move-in date, so that years as a Larkspur resident carry over; where the resident did not and the plan has a recorded suspension, they run from the plan's effective date and the months of that suspension are taken away, so that months on hold do not count; otherwise they run from the plan's effective date."
      tenure_extra: "Time in force adds loyalty_long_extra months where the whole months since the plan's effective date are at least loyalty_long_months, loyalty_mid_extra month where they are at least loyalty_mid_months but fewer than loyalty_long_months, and nothing where they are fewer than loyalty_mid_months."
      ledger_charges: "the balance the plan's ledger shows owed, that is every package fee, hourly charge, a la carte charge, late or returned payment fee and returned payment"
      ledger_reductions: "less every payment and credit"
      current_fee_date: "less the package fee charged on the ledger on the first day of the current month (nothing where no fee was charged for the current month)"
      current_fee: "less the package fee charged on the ledger on the first day of the current month (nothing where no fee was charged for the current month)"
      past_due: "The amount past due is the balance the plan's ledger shows owed, that is every package fee, hourly charge, a la carte charge, late or returned payment fee and returned payment less every payment and credit, less the package fee charged on the ledger on the first day of the current month (nothing where no fee was charged for the current month)"
      standing_deduction: "where it is at least high_past_due, high_past_due_deduction months are deducted from the total; where it is above zero but below high_past_due, any_past_due_deduction month is deducted; where it is zero or less, no month is deducted."
      window_counted: "Of the plan's most recent recorded suspension, the months that ended fewer than window_months whole months before the request are counted, and nothing is counted where the plan has none on record."
      al_start: "where that suspension lay within a hospital or rehabilitation absence recorded on the resident's assisted living residency, at none"
      prior_in_medical_absence: "where that suspension lay within a hospital or rehabilitation absence recorded on the resident's assisted living residency, at none"
      prior_share: "The months counted for the most recent recorded suspension are taken at one of three shares: where that suspension lay within a hospital or rehabilitation absence recorded on the resident's assisted living residency, at none; where it did not and it ended at least older_suspension_months whole months before the request, at older_suspension_share, rounded down to a whole month; otherwise in full."
      counted_prior: "at older_suspension_share, rounded down to a whole month"
      result: "The months a suspension may run are worked out as one total: the package's max_suspension_months_per_12m, which is the starting allowance and not a ceiling, plus the months added for the plan's time in force, less the months counted for the plan's most recent recorded suspension; that total is never below zero, the floor being applied once to the final number of months and never to a part of it, and the Pay-As-You-Go Plan has nothing to suspend."
    factors:
      - id: medical_absence_extension
        effect: parameter
        decides: absence_extra
        bindings: [al_status, al_reason, al_return, medical_absence, days_since_return, absence_extra]
        ladder:
          - when: "the assisted living residency is on leave and its recorded absence is a hospital or rehabilitation absence"
            value: "K('medical_extra_on_leave')"
          - when: "the assisted living residency is active and its recorded hospital or rehabilitation absence ended no more than medical_return_window_days days before the request"
            value: "K('medical_extra_returned')"
          - when: "otherwise"
            value: "0"
        baseline:
          absence_extra: "0"
        evidence: [cross_category, date]
        cross_difficulty: assisted
      - id: time_in_force_count
        effect: method
        decides: months_in_force
        bindings: [al_source, il_move_in, months_in_force]
        ladder:
          - when: "the resident came to the assisted living residency the plan serves from a Larkspur independent living residency whose move-in date is on record"
            method: "count the whole months from that earlier independent living move-in date"
          - when: "the resident did not come from a Larkspur independent living residency and the plan has a recorded suspension"
            method: "count the whole months from the plan's effective date and take away the months of that suspension"
          - when: "otherwise"
            method: "count the whole months from the plan's effective date"
        baseline:
          months_in_force: "MONTHS(F('effective_date'), NOW)"
        evidence: [cross_category, date, history]
        cross_difficulty: independent
      - id: account_standing_deduction
        effect: parameter
        decides: standing_deduction
        bindings: [ledger_charges, ledger_reductions, current_fee_date, current_fee, past_due, standing_deduction]
        ladder:
          - when: "the ledger balance owed less the current month's package fee is at least high_past_due"
            value: "K('high_past_due_deduction')"
          - when: "the ledger balance owed less the current month's package fee is above zero and below high_past_due"
            value: "K('any_past_due_deduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          standing_deduction: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: previous_suspension_share
        effect: parameter
        decides: prior_share
        bindings: [al_start, prior_in_medical_absence, prior_share]
        ladder:
          - when: "the most recent recorded suspension lay within a hospital or rehabilitation absence recorded on the assisted living residency"
            value: "0"
          - when: "it did not, and it ended at least older_suspension_months whole months before the request"
            value: "K('older_suspension_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          prior_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: assisted
    baseline:
      rule: >-
        A resident who asks to suspend the package for as long as the package allows is suspended for whole calendar months from the first calendar month whose first day is at least suspension_notice_days days after the request is signed, and the signed suspension records that first month and the number of months it runs; it ends on the last day of its last suspended month.
        The months a suspension may run are worked out as one total: the package's max_suspension_months_per_12m, which is the starting allowance and not a ceiling, plus the months added for the plan's time in force, less the months counted for the plan's most recent recorded suspension; that total is never below zero, the floor being applied once to the final number of months and never to a part of it, and the Pay-As-You-Go Plan has nothing to suspend.
        Time in force adds loyalty_long_extra months where the whole months since the plan's effective date are at least loyalty_long_months, loyalty_mid_extra month where they are at least loyalty_mid_months but fewer than loyalty_long_months, and nothing where they are fewer than loyalty_mid_months.
        Of the plan's most recent recorded suspension, the months that ended fewer than window_months whole months before the request are counted, and nothing is counted where the plan has none on record.
        Whole months are counted from the earlier date to the date of the request, a whole month elapsing on the same day of each later month.
      params: [max_suspension_months_per_12m, suspension_notice_days, loyalty_long_months, loyalty_mid_months, loyalty_long_extra, loyalty_mid_extra, window_months]
    inputs:
      history:
        - {table: services_ledger, aggregate: sum, field: amount, filters: {event_type: services_package_fee_charge}}
        - {table: services_ledger, aggregate: sum, field: amount, filters: {event_type: services_hourly_charge}}
        - {table: services_ledger, aggregate: sum, field: amount, filters: {event_type: services_alacarte_charge}}
        - {table: services_ledger, aggregate: sum, field: amount, filters: {event_type: services_payment}}
        - {table: services_ledger, aggregate: sum, field: amount, filters: {event_type: services_credit}}
      cross_category: [assisted, independent]

  - id: services_ext_missed_visit_hours
    base_policy_refs: [services_hours_and_billing, services_late_cancellation]
    overwrite:
      - base_policy: services_late_cancellation
        superseded_clause: >-
          A cancellation received less than late_cancel_notice_hours before the scheduled start, by services_msr_notice_hours, is late and draws late_cancel_hours_charged hours, or charges them at hourly_rate_beyond_allotment where no hours remain; a cancellation with at least late_cancel_notice_hours notice draws and charges nothing.
        replaced_by: >-
          The band hours of a missed visit are no_show_hours_charged where the order was recorded as a no-show, late_cancel_hours_charged multiplied by day_before_share where the resident's cancellation was received on the calendar day before the visit, and late_cancel_hours_charged where it was received on the visit's own calendar day.
      - base_policy: services_late_cancellation
        superseded_clause: >-
          When staff arrive and the resident declines the service or is absent, the order is recorded as a no_show and draws no_show_hours_charged hours on the same terms.
        replaced_by: >-
          The hours owed are worked out in this order: the basis hours are first multiplied by the pattern multiplier, that product is then multiplied by the rebooking multiplier, the entrance reduction is then subtracted from the result, and the remainder, never below zero, is rounded to two decimal places half up.
    trigger: state_due
    subject: [services_hours_draw]
    computes: hours
    target_tool: post_services_order_hours_8d682fe6
    params:
      day_before_share: 0.5
      repeat_multiplier: 1.2
      courtesy_multiplier: 0.5
      repeat_lookback_months: 6
      rebook_quick_days: 2
      rebook_week_days: 7
      rebook_quick_multiplier: 0.25
      rebook_week_multiplier: 0.6
      lifecare_hours_reduction: 0.20
      fee_for_service_hours_reduction: 0.10
      laundry_basis_share: 0.5
    rule: >-
      Hours owed for a service order that was cancelled late or missed are posted by the desk once the cancellation or no-show is on record, one order at a time beginning with the most recently recorded cancellation or no-show, against that order with its own draw basis and the billing month of its service date; they are taken from the plan's available hours, or charged at hourly_rate_beyond_allotment where no hours remain.
      A cancellation received two or more calendar days before the visit owes no hours and is not posted; lateness is read in calendar days, so the package's late_cancel_notice_hours plays no part under this rule.
      The band hours of a missed visit are late_cancel_hours_charged, and the hours owed are the band hours rounded to two decimal places half up.
      The band hours of a missed visit are no_show_hours_charged where the order was recorded as a no-show, late_cancel_hours_charged multiplied by day_before_share where the resident's cancellation was received on the calendar day before the visit, and late_cancel_hours_charged where it was received on the visit's own calendar day.
      The basis hours of a missed visit are found by one of three methods: where the order booked fewer hours than the band hours, the basis is the booked hours; where the order was a laundry and linen order booking at least the band hours, the basis is the band hours multiplied by laundry_basis_share, since no load was started; otherwise the basis is the band hours.
      The pattern multiplier is repeat_multiplier where at least two hours entries for late cancellations or no-shows were posted on the plan in the repeat_lookback_months months before the posting, courtesy_multiplier where none was, and 1 where exactly one was.
      The rebooking multiplier is read from the most recent booking of the same service: rebook_quick_multiplier where that booking was made no fewer than zero and no more than rebook_quick_days days after the missed visit date, rebook_week_multiplier where it was made more than rebook_quick_days and no more than rebook_week_days days after it, and 1 otherwise.
      The entrance reduction is lifecare_hours_reduction where the resident holds an occupied Entrance Fee Agreement on a lifecare contract (the LifeCare Declining Balance Plan or the LifeCare 90% Refundable Plan), fee_for_service_hours_reduction where the resident holds an occupied Entrance Fee Agreement on a fee-for-service contract (any LifeChoice plan), and nothing otherwise.
      The hours owed are worked out in this order: the basis hours are first multiplied by the pattern multiplier, that product is then multiplied by the rebooking multiplier, the entrance reduction is then subtracted from the result, and the remainder, never below zero, is rounded to two decimal places half up.
      Weekend and holiday surcharges never apply to the hours of a missed visit.
      The pattern look-back is counted from each hours entry's posting date to the date the missed visit's hours are posted, a whole month elapsing on the same day of each later month.
    prerequisite: []
    cross_category:
      - category: entrance
        as: branch
        reads: [status, contract_type]
        note: The entrance reduction factor reads whether the resident holds an occupied Entrance Fee Agreement and its contract type.
    compute:
      - miss_ref: "LATEST('services_orders', 'order_reference', date_field='cancelled_at', event_type='services_order_cancel')"
      - miss_type: "LATEST('services_orders', 'cancellation_type', date_field='cancelled_at', event_type='services_order_cancel', order_reference=miss_ref)"
      - miss_date: "LATEST('services_orders', 'scheduled_date', date_field='cancelled_at', event_type='services_order_cancel', order_reference=miss_ref)"
      - miss_received: "LATEST('services_orders', 'cancelled_at', date_field='cancelled_at', event_type='services_order_cancel', order_reference=miss_ref)"
      - booked_hours: "LATEST('services_orders', 'scheduled_hours', date_field='scheduled_date', event_type='services_order_book', order_reference=miss_ref)"
      - miss_service: "LATEST('services_orders', 'service_code', date_field='scheduled_date', event_type='services_order_book', order_reference=miss_ref)"
      - notice_days: "DAYS(miss_received, miss_date)"
      - band_hours: "P('no_show_hours_charged') if miss_type == 'no_show' else ((P('late_cancel_hours_charged') * K('day_before_share')) if (miss_type == 'resident_cancelled' and notice_days == 1) else P('late_cancel_hours_charged'))"
      - basis_hours: "booked_hours if booked_hours < band_hours else ((band_hours * K('laundry_basis_share')) if miss_service == 'laundry_linen' else band_hours)"
      - prior_late: "COUNT('services_ledger', within_months=K('repeat_lookback_months'), date_field='posting_date', event_type='services_hours_draw', draw_basis='late_cancellation') + COUNT('services_ledger', within_months=K('repeat_lookback_months'), date_field='posting_date', event_type='services_hours_draw', draw_basis='no_show') + COUNT('services_ledger', within_months=K('repeat_lookback_months'), date_field='posting_date', event_type='services_hourly_charge', draw_basis='late_cancellation') + COUNT('services_ledger', within_months=K('repeat_lookback_months'), date_field='posting_date', event_type='services_hourly_charge', draw_basis='no_show')"
      - pattern_multiplier: "K('repeat_multiplier') if prior_late >= 2 else (K('courtesy_multiplier') if prior_late == 0 else 1)"
      - rebook_at: "LATEST('services_orders', 'booked_at', date_field='booked_at', event_type='services_order_book', service_code=miss_service)"
      - rebook_days: "DAYS(miss_date, rebook_at) if rebook_at else -1"
      - rebook_multiplier: "K('rebook_quick_multiplier') if (rebook_days >= 0 and rebook_days <= K('rebook_quick_days')) else (K('rebook_week_multiplier') if (rebook_days > K('rebook_quick_days') and rebook_days <= K('rebook_week_days')) else 1)"
      - entrance_status: "CFIELD('entrance', 'status', status='occupied')"
      - entrance_contract: "CPARAM('entrance', 'contract_type', status='occupied')"
      - entrance_reduction: "K('lifecare_hours_reduction') if (entrance_status == 'occupied' and entrance_contract == 'lifecare') else (K('fee_for_service_hours_reduction') if (entrance_status == 'occupied' and entrance_contract == 'fee_for_service') else 0)"
      - result: "RND(MX(0, basis_hours * pattern_multiplier * rebook_multiplier - entrance_reduction), 2)"
    compute_basis:
      miss_ref: "one order at a time beginning with the most recently recorded cancellation or no-show"
      miss_type: "where the order was recorded as a no-show"
      miss_date: "the billing month of its service date"
      miss_received: "where it was received on the visit's own calendar day"
      booked_hours: "where the order booked fewer hours than the band hours, the basis is the booked hours"
      miss_service: "where the order was a laundry and linen order booking at least the band hours"
      notice_days: "where the resident's cancellation was received on the calendar day before the visit"
      band_hours: "The band hours of a missed visit are no_show_hours_charged where the order was recorded as a no-show, late_cancel_hours_charged multiplied by day_before_share where the resident's cancellation was received on the calendar day before the visit, and late_cancel_hours_charged where it was received on the visit's own calendar day."
      basis_hours: "The basis hours of a missed visit are found by one of three methods: where the order booked fewer hours than the band hours, the basis is the booked hours; where the order was a laundry and linen order booking at least the band hours, the basis is the band hours multiplied by laundry_basis_share, since no load was started; otherwise the basis is the band hours."
      prior_late: "The pattern look-back is counted from each hours entry's posting date to the date the missed visit's hours are posted, a whole month elapsing on the same day of each later month."
      pattern_multiplier: "The pattern multiplier is repeat_multiplier where at least two hours entries for late cancellations or no-shows were posted on the plan in the repeat_lookback_months months before the posting, courtesy_multiplier where none was, and 1 where exactly one was."
      rebook_at: "The rebooking multiplier is read from the most recent booking of the same service"
      rebook_days: "where that booking was made no fewer than zero and no more than rebook_quick_days days after the missed visit date"
      rebook_multiplier: "The rebooking multiplier is read from the most recent booking of the same service: rebook_quick_multiplier where that booking was made no fewer than zero and no more than rebook_quick_days days after the missed visit date, rebook_week_multiplier where it was made more than rebook_quick_days and no more than rebook_week_days days after it, and 1 otherwise."
      entrance_status: "where the resident holds an occupied Entrance Fee Agreement on a lifecare contract (the LifeCare Declining Balance Plan or the LifeCare 90% Refundable Plan)"
      entrance_contract: "on a fee-for-service contract (any LifeChoice plan)"
      entrance_reduction: "The entrance reduction is lifecare_hours_reduction where the resident holds an occupied Entrance Fee Agreement on a lifecare contract (the LifeCare Declining Balance Plan or the LifeCare 90% Refundable Plan), fee_for_service_hours_reduction where the resident holds an occupied Entrance Fee Agreement on a fee-for-service contract (any LifeChoice plan), and nothing otherwise."
      result: "The hours owed are worked out in this order: the basis hours are first multiplied by the pattern multiplier, that product is then multiplied by the rebooking multiplier, the entrance reduction is then subtracted from the result, and the remainder, never below zero, is rounded to two decimal places half up."
    factors:
      - id: missed_visit_band
        effect: parameter
        decides: band_hours
        bindings: [miss_type, miss_received, notice_days, band_hours]
        ladder:
          - when: "the order was recorded as a no-show"
            value: "P('no_show_hours_charged')"
          - when: "the resident's cancellation was received on the calendar day before the visit"
            value: "P('late_cancel_hours_charged') * K('day_before_share')"
          - when: "otherwise (a cancellation received on the visit's own calendar day)"
            value: "P('late_cancel_hours_charged')"
        baseline:
          band_hours: "P('late_cancel_hours_charged')"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: missed_visit_basis
        effect: method
        decides: basis_hours
        bindings: [booked_hours, miss_service, basis_hours]
        ladder:
          - when: "the order booked fewer hours than the band hours"
            method: "the basis is the booked hours"
          - when: "the order was a laundry and linen order booking at least the band hours"
            method: "the basis is the band hours multiplied by laundry_basis_share"
          - when: "otherwise"
            method: "the basis is the band hours"
        baseline:
          basis_hours: "band_hours"
        evidence: [history]
        cross_difficulty: null
      - id: cancellation_pattern
        effect: parameter
        decides: pattern_multiplier
        bindings: [prior_late, pattern_multiplier]
        ladder:
          - when: "at least two late-cancellation or no-show hours entries in the last repeat_lookback_months months"
            value: "K('repeat_multiplier')"
          - when: "no late-cancellation or no-show hours entry in the last repeat_lookback_months months"
            value: "K('courtesy_multiplier')"
          - when: "otherwise"
            value: "1"
        baseline:
          pattern_multiplier: "1"
        evidence: [history]
        cross_difficulty: null
      - id: rebooking_relief
        effect: parameter
        decides: rebook_multiplier
        bindings: [rebook_at, rebook_days, rebook_multiplier]
        ladder:
          - when: "the most recent booking of the same service was made 0 to rebook_quick_days days after the missed visit date"
            value: "K('rebook_quick_multiplier')"
          - when: "the most recent booking of the same service was made more than rebook_quick_days and at most rebook_week_days days after the missed visit date"
            value: "K('rebook_week_multiplier')"
          - when: "otherwise"
            value: "1"
        baseline:
          rebook_multiplier: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: entrance_hours_reduction
        effect: parameter
        decides: entrance_reduction
        bindings: [entrance_status, entrance_contract, entrance_reduction]
        ladder:
          - when: "the resident whose visit was missed holds an occupied Entrance Fee Agreement on a lifecare contract (the LifeCare Declining Balance Plan or the LifeCare 90% Refundable Plan)"
            value: "K('lifecare_hours_reduction')"
          - when: "the resident whose visit was missed holds an occupied Entrance Fee Agreement on a fee-for-service contract (any LifeChoice plan)"
            value: "K('fee_for_service_hours_reduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          entrance_reduction: "0"
        evidence: [cross_category]
        cross_difficulty: entrance
    baseline:
      rule: >-
        Hours owed for a service order that was cancelled late or missed are posted by the desk once the cancellation or no-show is on record, one order at a time beginning with the most recently recorded cancellation or no-show, against that order with its own draw basis and the billing month of its service date; they are taken from the plan's available hours, or charged at hourly_rate_beyond_allotment where no hours remain.
        A cancellation received two or more calendar days before the visit owes no hours and is not posted; lateness is read in calendar days, so the package's late_cancel_notice_hours plays no part under this rule.
        The band hours of a missed visit are late_cancel_hours_charged, and the hours owed are the band hours rounded to two decimal places half up.
      params: [hourly_rate_beyond_allotment, late_cancel_hours_charged]
    inputs:
      history:
        - {table: services_orders, aggregate: latest, field: order_reference, filters: {event_type: services_order_cancel}}
        - {table: services_ledger, aggregate: count, field: services_entry_id, within_months: 6, filters: {event_type: services_hours_draw, draw_basis: late_cancellation}}
        - {table: services_ledger, aggregate: count, field: services_entry_id, within_months: 6, filters: {event_type: services_hours_draw, draw_basis: no_show}}
        - {table: services_orders, aggregate: latest, field: booked_at, filters: {event_type: services_order_book}}
      cross_category: [entrance]

  - id: services_ext_package_fit
    base_policy_refs: [services_package_change]
    overwrite: []
    trigger: on_request
    subject: [services_package_change_request]
    computes: target_variant_name
    target_tool: sign_services_package_change_2a41e92a
    params:
      review_months: 3
      late_half_share: 0.5
      home_headroom_large: 1.5
      home_headroom_shared: 1.0
      trend_gap_hours: 2.0
      trend_rising_hours: 2.0
      trend_falling_hours: 1.0
    rule: >-
      A resident who asks the desk to move the plan to the package that fits their use is given the lowest package whose monthly_hours_allotment is at least the required hours, among the packages the residence allows, so that an assisted living resident is never fitted above the Personal Services Companion Package, and where the required hours exceed every allotment an independent living resident is fitted to the Personal Services Concierge Package; the signed change takes effect on the first day of the next month when signed on or before change_notice_cutoff_day of the month, and on the first day of the month after next when signed later.
      The hours used are the hours drawn and the hours charged beyond the allotment for delivered visits, with a posting date within the review_months whole months before the request.
      The review months are counted back from the date of the request: a posting falls within them when fewer than review_months whole months have elapsed from its posting date to the request date, a whole month elapsing on the same day of each later month, so a posting dated on the same day of the month review_months months before the request is outside and one dated the next day is inside.
      The average monthly use is the hours used divided by review_months, and the required hours are the average monthly use, rounded to two decimal places half up.
      The package that fits the resident's use is not chosen until every service order recorded in the review months as a late cancellation or a no-show carries its hours entry for that cancellation on the plan's ledger.
      Hours drawn or charged for late cancellations and no-shows with a posting date in the review months are added to the hours used in full where there are at least two such entries, at late_half_share of their hours where there is exactly one, and not at all where there is none.
      The divisor of the average monthly use is found by one of three methods: where a package change took effect within the review months, it is the number of package fees posted in the review months for the package now in effect; where no package change took effect but fewer than review_months package fees were posted in the review months, as when the plan was suspended for a month, it is the number of package fees posted in them; otherwise it is review_months.
      The required hours add home_headroom_large hours where the resident's active independent living residency is an Independent Living Cottage Home or an Independent Living Two-Bedroom Deluxe, home_headroom_shared hours where it is any other apartment type held in double occupancy with a second occupant named, and nothing otherwise.
      The required hours add trend_rising_hours where the hours drawn and charged with a posting date within the last whole month before the request are at least trend_gap_hours above the average monthly use, deduct trend_falling_hours where they are at least trend_gap_hours below it, and are unchanged otherwise; a posting falls within the last whole month before the request when less than one whole month has elapsed from its posting date to the request date, a whole month elapsing on the same day of the next month.
      The required hours are the average monthly use plus the headroom and the trend adjustment, rounded to two decimal places half up, and the package is fitted on that figure.
    prerequisite:
      - problem: services_ext_missed_visit_hours
        kind: value_input
        gate: late_hours
        form: state
        policy_source: >-
          The package that fits the resident's use is not chosen until every service order recorded in the review months as a late cancellation or a no-show carries its hours entry for that cancellation on the plan's ledger.
        condition: >-
          Every services_orders cancellation row with cancellation_type no_show, or a resident cancellation received on the visit's day or the day before, within the review window has a services_hours_draw or services_hourly_charge row on the plan with the same order_reference and draw_basis no_show or late_cancellation.
        resolved_by: post_services_order_hours_8d682fe6
        effect: >-
          The hours entry adds its hours to the late-cancellation and no-show hours of the review months and raises their count, which changes the hours counted as use, the average monthly use and the required hours on which the package is fitted.
    cross_category:
      - category: independent
        as: branch
        reads: [status, variant_name, occupancy_type, second_occupant_name]
        note: The home headroom factor reads the apartment type and occupancy of the resident's active independent living residency.
    compute:
      - fee_months: "COUNT('services_ledger', within_months=K('review_months'), date_field='posting_date', event_type='services_package_fee_charge')"
      - change_months: "COUNT('services_ledger', within_months=K('review_months'), date_field='posting_date', event_type='services_package_fee_charge', charge_basis='package_change')"
      - current_fee_months: "COUNT('services_ledger', within_months=K('review_months'), date_field='posting_date', event_type='services_package_fee_charge', tier_billed=F('variant_name'))"
      - delivered_hours: "SUM('services_ledger', 'hours', within_months=K('review_months'), date_field='posting_date', event_type='services_hours_draw', draw_basis='service_delivered') + SUM('services_ledger', 'hours', within_months=K('review_months'), date_field='posting_date', event_type='services_hourly_charge', draw_basis='service_delivered')"
      - late_hours: "SUM('services_ledger', 'hours', within_months=K('review_months'), date_field='posting_date', event_type='services_hours_draw', draw_basis='late_cancellation') + SUM('services_ledger', 'hours', within_months=K('review_months'), date_field='posting_date', event_type='services_hours_draw', draw_basis='no_show') + SUM('services_ledger', 'hours', within_months=K('review_months'), date_field='posting_date', event_type='services_hourly_charge', draw_basis='late_cancellation') + SUM('services_ledger', 'hours', within_months=K('review_months'), date_field='posting_date', event_type='services_hourly_charge', draw_basis='no_show')"
      - late_entries: "COUNT('services_ledger', within_months=K('review_months'), date_field='posting_date', event_type='services_hours_draw', draw_basis='late_cancellation') + COUNT('services_ledger', within_months=K('review_months'), date_field='posting_date', event_type='services_hours_draw', draw_basis='no_show') + COUNT('services_ledger', within_months=K('review_months'), date_field='posting_date', event_type='services_hourly_charge', draw_basis='late_cancellation') + COUNT('services_ledger', within_months=K('review_months'), date_field='posting_date', event_type='services_hourly_charge', draw_basis='no_show')"
      - counted_late: "late_hours if late_entries >= 2 else ((late_hours * K('late_half_share')) if late_entries == 1 else 0)"
      - used_hours: "delivered_hours + counted_late"
      - divisor: "MX(1, current_fee_months) if change_months >= 1 else ((MX(1, fee_months)) if (change_months == 0 and fee_months < K('review_months')) else K('review_months'))"
      - average_use: "used_hours / divisor"
      - latest_month_hours: "SUM('services_ledger', 'hours', within_months=1, date_field='posting_date', event_type='services_hours_draw') + SUM('services_ledger', 'hours', within_months=1, date_field='posting_date', event_type='services_hourly_charge')"
      - trend_adjustment: "K('trend_rising_hours') if latest_month_hours >= average_use + K('trend_gap_hours') else ((0 - K('trend_falling_hours')) if latest_month_hours <= average_use - K('trend_gap_hours') else 0)"
      - home_type: "CFIELD('independent', 'variant_name', status='active')"
      - home_occupancy: "CFIELD('independent', 'occupancy_type', status='active')"
      - home_second: "CFIELD('independent', 'second_occupant_name', status='active')"
      - large_home: "home_type == 'Independent Living Cottage Home' or home_type == 'Independent Living Two-Bedroom Deluxe'"
      - home_headroom: "K('home_headroom_large') if large_home else (K('home_headroom_shared') if ((not large_home) and home_occupancy == 'double' and home_second) else 0)"
      - required_hours: "RND(average_use + home_headroom + trend_adjustment, 2)"
      - assisted_residence: "F('residence_category') == 'assisted'"
      - result: "'Personal Services Pay-As-You-Go Plan' if required_hours <= 0 else ('Personal Services Essentials Package' if required_hours <= 4 else ('Personal Services Companion Package' if (required_hours <= 8 or assisted_residence) else ('Personal Services Comfort Package' if required_hours <= 12 else ('Personal Services Premier Package' if required_hours <= 20 else 'Personal Services Concierge Package'))))"
    compute_basis:
      fee_months: "fewer than review_months package fees were posted in the review months, as when the plan was suspended for a month, it is the number of package fees posted in them"
      change_months: "where a package change took effect within the review months"
      current_fee_months: "it is the number of package fees posted in the review months for the package now in effect"
      delivered_hours: "The hours used are the hours drawn and the hours charged beyond the allotment for delivered visits, with a posting date within the review_months whole months before the request. The review months are counted back from the date of the request: a posting falls within them when fewer than review_months whole months have elapsed from its posting date to the request date, a whole month elapsing on the same day of each later month, so a posting dated on the same day of the month review_months months before the request is outside and one dated the next day is inside"
      late_hours: "Hours drawn or charged for late cancellations and no-shows with a posting date in the review months"
      late_entries: "where there are at least two such entries, at late_half_share of their hours where there is exactly one, and not at all where there is none."
      counted_late: "Hours drawn or charged for late cancellations and no-shows with a posting date in the review months are added to the hours used in full where there are at least two such entries, at late_half_share of their hours where there is exactly one, and not at all where there is none."
      used_hours: "are added to the hours used"
      divisor: "The divisor of the average monthly use is found by one of three methods: where a package change took effect within the review months, it is the number of package fees posted in the review months for the package now in effect; where no package change took effect but fewer than review_months package fees were posted in the review months, as when the plan was suspended for a month, it is the number of package fees posted in them; otherwise it is review_months."
      average_use: "The average monthly use is the hours used divided by review_months"
      latest_month_hours: "a posting falls within the last whole month before the request when less than one whole month has elapsed from its posting date to the request date, a whole month elapsing on the same day of the next month."
      trend_adjustment: "The required hours add trend_rising_hours where the hours drawn and charged with a posting date within the last whole month before the request are at least trend_gap_hours above the average monthly use, deduct trend_falling_hours where they are at least trend_gap_hours below it, and are unchanged otherwise; a posting falls within the last whole month before the request when less than one whole month has elapsed from its posting date to the request date, a whole month elapsing on the same day of the next month."
      home_type: "where the resident's active independent living residency is an Independent Living Cottage Home or an Independent Living Two-Bedroom Deluxe"
      home_occupancy: "held in double occupancy with a second occupant named"
      home_second: "with a second occupant named"
      large_home: "an Independent Living Cottage Home or an Independent Living Two-Bedroom Deluxe"
      home_headroom: "The required hours add home_headroom_large hours where the resident's active independent living residency is an Independent Living Cottage Home or an Independent Living Two-Bedroom Deluxe, home_headroom_shared hours where it is any other apartment type held in double occupancy with a second occupant named, and nothing otherwise."
      required_hours: "The required hours are the average monthly use plus the headroom and the trend adjustment, rounded to two decimal places half up, and the package is fitted on that figure."
      assisted_residence: "so that an assisted living resident is never fitted above the Personal Services Companion Package"
      result: "A resident who asks the desk to move the plan to the package that fits their use is given the lowest package whose monthly_hours_allotment is at least the required hours, among the packages the residence allows"
    factors:
      - id: review_divisor
        effect: method
        decides: divisor
        bindings: [fee_months, change_months, current_fee_months, divisor]
        ladder:
          - when: "a package change took effect within the review months"
            method: "divide by the number of package fees posted in the review months for the package now in effect"
          - when: "no package change took effect and fewer than review_months package fees were posted in the review months"
            method: "divide by the number of package fees posted in the review months"
          - when: "otherwise"
            method: "divide by review_months"
        baseline:
          divisor: "K('review_months')"
        evidence: [history]
        cross_difficulty: null
      - id: missed_visit_use
        effect: parameter
        decides: counted_late
        bindings: [late_hours, late_entries, counted_late]
        ladder:
          - when: "at least two late-cancellation or no-show hours entries posted in the review months"
            value: "their hours in full"
          - when: "exactly one such entry posted in the review months"
            value: "late_half_share of its hours"
          - when: "otherwise"
            value: "0"
        baseline:
          counted_late: "0"
        evidence: [history]
        cross_difficulty: null
      - id: home_headroom
        effect: parameter
        decides: home_headroom
        bindings: [home_type, home_occupancy, home_second, large_home, home_headroom]
        ladder:
          - when: "the active independent living residency is an Independent Living Cottage Home or an Independent Living Two-Bedroom Deluxe"
            value: "K('home_headroom_large')"
          - when: "it is any other apartment type held in double occupancy and a second occupant is named"
            value: "K('home_headroom_shared')"
          - when: "otherwise"
            value: "0"
        baseline:
          home_headroom: "0"
        evidence: [cross_category]
        cross_difficulty: independent
      - id: use_trend
        effect: parameter
        decides: trend_adjustment
        bindings: [latest_month_hours, trend_adjustment]
        ladder:
          - when: "hours drawn and charged in the last whole month are at least trend_gap_hours above the average monthly use"
            value: "K('trend_rising_hours')"
          - when: "they are at least trend_gap_hours below the average monthly use"
            value: "minus K('trend_falling_hours')"
          - when: "otherwise"
            value: "0"
        baseline:
          trend_adjustment: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A resident who asks the desk to move the plan to the package that fits their use is given the lowest package whose monthly_hours_allotment is at least the required hours, among the packages the residence allows, so that an assisted living resident is never fitted above the Personal Services Companion Package, and where the required hours exceed every allotment an independent living resident is fitted to the Personal Services Concierge Package; the signed change takes effect on the first day of the next month when signed on or before change_notice_cutoff_day of the month, and on the first day of the month after next when signed later.
        The hours used are the hours drawn and the hours charged beyond the allotment for delivered visits, with a posting date within the review_months whole months before the request.
        The review months are counted back from the date of the request: a posting falls within them when fewer than review_months whole months have elapsed from its posting date to the request date, a whole month elapsing on the same day of each later month, so a posting dated on the same day of the month review_months months before the request is outside and one dated the next day is inside.
        The average monthly use is the hours used divided by review_months, and the required hours are the average monthly use, rounded to two decimal places half up.
      params: [monthly_hours_allotment, change_notice_cutoff_day, review_months]
    inputs:
      history:
        - {table: services_ledger, aggregate: sum, field: hours, within_months: 3, filters: {event_type: services_hours_draw, draw_basis: service_delivered}}
        - {table: services_ledger, aggregate: sum, field: hours, within_months: 3, filters: {event_type: services_hours_draw, draw_basis: no_show}}
        - {table: services_ledger, aggregate: count, field: services_entry_id, within_months: 3, filters: {event_type: services_package_fee_charge}}
        - {table: services_ledger, aggregate: sum, field: hours, within_months: 1, filters: {event_type: services_hours_draw}}
      cross_category: [independent]
