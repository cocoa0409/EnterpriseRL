      surcharge_pct: "The billable hours of a visit delivered on a date in holiday_calendar are increased by holiday_surcharge_pct percent, those of a visit delivered on any other Saturday or Sunday are increased by weekend_surcharge_pct percent, and those of any other visit are not increased."
      al_absence_reason: "Where the resident's assisted living residency records a hospital or rehabilitation absence"
      al_absence_start: "a hospital or rehabilitation absence that began no fewer than zero and no more than relief_short_days days after the visit date"
      medical_absence: "Where the resident's assisted living residency records a hospital or rehabilitation absence"
