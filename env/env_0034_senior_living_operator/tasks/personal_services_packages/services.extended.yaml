events:
  - type: services_enroll
    target: services_plans
    mutation: create
    meaning: A resident enrolls in a personal services plan, opening it in pending_start status for its first effective month.
    grain: One row per plan enrollment.
    fields:
      services_plan_id: Reference number of the plan.
      customer_id: The resident.
      variant_name: Package chosen, verbatim tier name.
      residence_category: independent or assisted - the Larkspur residence the plan serves.
      independent_residency_id: The independent living residency served; empty for an assisted living resident.
      assisted_residency_id: The assisted living residency served; empty for an independent living resident.
      community_name: Larkspur community.
      enrollment_date: Date the enrollment was signed.
      effective_date: First day of the first plan month.
    triggers: []
  - type: services_activate
    target: services_plans
    mutation: {transition: {from: pending_start, to: active}}
    meaning: The plan starts on its effective date.
    grain: One row per plan.
    fields:
      services_plan_id: The plan.
      variant_name: Package in effect at start.
    triggers:
      - event: services:services_package_fee_charge
        when: {variant_name: {not: Personal Services Pay-As-You-Go Plan}}
        map: {services_plan_id: services_plan_id}
      - event: services:services_hours_grant
        when: {variant_name: {not: Personal Services Pay-As-You-Go Plan}}
        map: {services_plan_id: services_plan_id}
  - type: services_withdraw
    target: services_plans
    mutation: {transition: {from: pending_start, to: ended}}
    meaning: The enrollment is withdrawn before the plan starts.
    grain: One row per plan.
    fields:
      services_plan_id: The plan.
      end_date: Date of the withdrawal.
      end_reason: enrollment_withdrawn.
    triggers: []
  - type: services_suspend
    target: services_plans
    mutation: {transition: {from: active, to: suspended}}
    meaning: A suspension of whole calendar months begins.
    grain: One row per suspension.
    fields:
      services_plan_id: The plan.
      suspension_start_date: First day of the first suspended month.
      suspension_end_date: Last day of the last suspended month.
    triggers: []
  - type: services_resume
    target: services_plans
    mutation: {transition: {from: suspended, to: active}}
    meaning: The plan resumes after a suspension.
    grain: One row per suspension.
    fields:
      services_plan_id: The plan.
      suspension_end_date: Last day of the last suspended month.
    triggers:
      - event: services:services_package_fee_charge
        map: {services_plan_id: services_plan_id}
      - event: services:services_hours_grant
        map: {services_plan_id: services_plan_id}
  - type: services_cancel_request
    target: services_plans
    mutation: {transition: {from: active, to: cancel_pending}}
    meaning: The resident's signed cancellation of the plan is recorded with its end date.
    grain: One row per cancellation.
    fields:
      services_plan_id: The plan.
      cancel_notice_date: Date the cancellation was signed.
      end_date: Last day of the plan fixed by the notice rules.
    triggers: []
  - type: services_cancel_withdraw
    target: services_plans
    mutation: {transition: {from: cancel_pending, to: active}}
    meaning: The resident withdraws the cancellation before the end date.
    grain: One row per withdrawal.
    fields:
      services_plan_id: The plan.
      cancel_notice_date: Cleared to empty.
      end_date: Cleared to empty.
    triggers: []
  - type: services_end
    target: services_plans
    mutation: {transition: [{from: cancel_pending, to: ended}, {from: active, to: ended}, {from: suspended, to: ended}]}
    meaning: The plan ends - on the cancellation end date, or because the resident's residency ended.
    grain: One row per plan.
    fields:
      services_plan_id: The plan.
      end_date: Last day of the plan.
      end_reason: resident_cancelled or residency_ended.
    triggers:
      - event: services:services_hours_expire
        map: {services_plan_id: services_plan_id, expiry_basis: plan_end}
  - type: services_package_change_request
    target: services_plans
    mutation: update
    meaning: A change to another package is scheduled for the first day of a later month.
    grain: One row per scheduled change.
    fields:
      services_plan_id: The plan.
      pending_variant_name: Package the plan will change to.
      pending_change_date: First day of the month the change takes effect.
    triggers: []
  - type: services_package_change_apply
    target: services_plans
    mutation: update
    meaning: A scheduled package change takes effect.
    grain: One row per change applied.
    fields:
      services_plan_id: The plan.
      variant_name: New package.
      pending_variant_name: Reset to none.
      pending_change_date: Cleared to empty.
    triggers: []
  - type: services_order_book
    target: services_orders
    meaning: A service visit is booked for a date and start time.
    grain: One row per service order.
    distinguish_by: [order_reference]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      order_reference: Service order number.
      service_code: Service booked.
      scheduled_date: Date of the visit.
      scheduled_start_time: Start time, HH:MM local.
      scheduled_hours: Hours booked.
      booked_at: Moment the booking was made.
      quantity: Units booked for unit-priced services (laundry loads, linen changes, miles, deliveries); empty otherwise.
    triggers: []
  - type: services_order_cancel
    target: services_orders
    meaning: A booked service visit is cancelled by the resident, or recorded as a no-show when staff arrive and the service is refused or the resident is absent.
    grain: One row per cancelled order.
    distinguish_by: [order_reference]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      order_reference: The order cancelled.
      cancelled_at: Moment the cancellation was received, or the scheduled start for a no-show.
      cancellation_type: resident_cancelled or no_show.
    triggers: []
  - type: services_order_complete
    target: services_orders
    meaning: A service visit is delivered and its actual time recorded.
    grain: One row per delivered order.
    distinguish_by: [order_reference]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      order_reference: The order delivered.
      service_code: Service delivered.
      scheduled_date: Date delivered.
      actual_minutes: Minutes of service actually delivered, or units for unit-priced services.
    triggers: []
  - type: services_package_fee_charge
    target: services_ledger
    meaning: The monthly package fee is charged in advance for a plan month.
    grain: One row per plan per billing period per fee basis.
    distinguish_by: [billing_period, charge_basis]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      amount: Fee, positive, USD.
      posting_date: Date posted.
      billing_period: Plan month, YYYY-MM.
      charge_basis: full_month or package_change.
      tier_billed: Package whose fee is charged.
    account: services_balance
    direction: in
    triggers: []
  - type: services_hours_grant
    target: services_ledger
    meaning: The monthly allotment of personal service hours is granted on the first day of a plan month.
    grain: One row per plan per billing period.
    distinguish_by: [billing_period]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      hours: Hours granted.
      posting_date: First day of the month.
      billing_period: Plan month, YYYY-MM.
    account: service_hours
    direction: in
    triggers: []
  - type: services_hours_rollover
    target: services_ledger
    meaning: Unused hours of the previous month carried into the new month are booked as rollover hours after the previous month's hours expire.
    grain: One row per plan per billing period.
    distinguish_by: [billing_period]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      hours: Hours carried in.
      posting_date: First day of the month.
      billing_period: Month the hours are carried into, YYYY-MM.
    account: service_hours
    direction: in
    triggers: []
  - type: services_hours_expire
    target: services_ledger
    meaning: Hours remaining at the end of a month, or when the plan ends, lapse.
    grain: One row per plan per billing period per expiry basis.
    distinguish_by: [billing_period, expiry_basis]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      hours: Hours lapsing.
      posting_date: Last day of the month or of the plan.
      billing_period: Month whose hours lapse, YYYY-MM.
      expiry_basis: month_end or plan_end.
    account: service_hours
    direction: out
    triggers: []
  - type: services_hours_draw
    target: services_ledger
    meaning: Personal service hours are drawn for a delivered visit, a late cancellation or a no-show.
    grain: One row per service order per draw basis.
    distinguish_by: [order_reference, draw_basis]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      hours: Hours drawn, surcharges included.
      posting_date: Date posted.
      billing_period: Month of the service date, YYYY-MM.
      order_reference: The service order.
      draw_basis: service_delivered, late_cancellation or no_show.
    account: service_hours
    direction: out
    triggers: []
  - type: services_hours_restore
    target: services_ledger
    meaning: Hours drawn in error are restored after a dispute.
    grain: One row per hours draw restored.
    distinguish_by: [source_entry_id]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      hours: Hours restored.
      posting_date: Date posted.
      billing_period: Month the restored hours are added to, YYYY-MM.
      source_entry_id: The hours draw restored.
    account: service_hours
    direction: in
    triggers: []
  - type: services_hourly_charge
    target: services_ledger
    meaning: Personal service time not covered by available hours is charged at the package's hourly rate.
    grain: One row per service order per draw basis.
    distinguish_by: [order_reference, draw_basis]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      amount: Charge, positive, USD.
      hours: Hours charged, surcharges included.
      posting_date: Date posted.
      billing_period: Month of the service date, YYYY-MM.
      order_reference: The service order.
      draw_basis: service_delivered, late_cancellation or no_show.
    account: services_balance
    direction: in
    triggers: []
  - type: services_alacarte_charge
    target: services_ledger
    meaning: A separately priced service is charged - private transportation, handyman work, an overnight companion, a grocery delivery or a rush booking fee.
    grain: One row per service order per charge code.
    distinguish_by: [order_reference, alacarte_code]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      amount: Charge after any member discount, positive, USD (0.00 for a free grocery delivery).
      posting_date: Date posted.
      billing_period: Month of the service date, YYYY-MM.
      order_reference: The service order.
      alacarte_code: private_transportation, handyman, overnight_companion, grocery_delivery or rush_booking.
      quantity: Miles, hours, nights or deliveries charged.
    account: services_balance
    direction: in
    triggers: []
  - type: services_fee_charge
    target: services_ledger
    meaning: A late fee or returned payment fee is charged on the services account.
    grain: One row per fee code per billing period per source entry.
    distinguish_by: [fee_code, billing_period, source_entry_id]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      amount: Fee, positive, USD.
      posting_date: Date posted.
      fee_code: late_fee or returned_payment.
      billing_period: Statement month the fee relates to, YYYY-MM.
      source_entry_id: The returned payment entry for a returned payment fee; empty otherwise.
    account: services_balance
    direction: in
    triggers: []
  - type: services_payment
    target: services_ledger
    meaning: A payment toward the services account is received.
    grain: One row per payment instrument.
    distinguish_by: [payment_reference]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      amount: Payment, positive, USD.
      posting_date: Date received.
      payment_reference: Instrument reference.
      payment_method: Instrument type.
    account: services_balance
    direction: out
    triggers: []
  - type: services_payment_return
    target: services_ledger
    meaning: A posted payment is returned unpaid and reinstated.
    grain: One row per returned payment entry.
    distinguish_by: [source_entry_id]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      amount: Returned amount, positive, USD.
      posting_date: Date posted.
      source_entry_id: The payment entry returned.
    account: services_balance
    direction: in
    triggers:
      - event: services:services_fee_charge
        map: {services_plan_id: services_plan_id, fee_code: returned_payment, source_entry_id: source_entry_id}
  - type: services_credit
    target: services_ledger
    meaning: A credit reduces the amount owed - a disputed charge upheld, a billing error, or the prorated package fee after a residency ends mid-month.
    grain: One row per credit reason per source entry.
    distinguish_by: [credit_reason, source_entry_id]
    fields:
      services_plan_id: The plan.
      customer_id: The resident.
      amount: Credit, positive, USD.
      posting_date: Date posted.
      credit_reason: service_dispute, billing_error or residency_end_proration.
      source_entry_id: The charge entry credited.
      billing_period: Month the credit relates to, YYYY-MM.
    account: services_balance
    direction: out
    triggers: []

measures:
  - id: services_msr_hours_available
    window: As of the moment of the draw, by posting order.
    measure: Sum of hours of services_hours_grant, services_hours_rollover and services_hours_restore entries less services_hours_draw and services_hours_expire entries on the plan (equal to hours_available).
  - id: services_msr_unused_hours_at_month_end
    window: The billing period ending, at the end of its last day.
    measure: Hours available on the plan at the end of the month before any expiry.
  - id: services_msr_suspended_months_12m
    window: Rolling 12 calendar months ending with the last month of the suspension requested.
    measure: Number of calendar months covered by the plan's suspensions, recorded and requested.
  - id: services_msr_open_orders
    window: As of the booking moment.
    measure: Count of services_order_book entries on the plan with a scheduled_date on or after the booking date that have no services_order_cancel or services_order_complete entry.
  - id: services_msr_notice_hours
    window: One service order.
    measure: Hours between the cancelled_at moment (or booked_at moment for a booking) and the scheduled start moment of the order.
  - id: services_msr_grocery_deliveries_in_month
    window: The calendar month of the delivery.
    measure: Count of services_alacarte_charge entries with alacarte_code grocery_delivery on the plan, including free deliveries posted at 0.00.
  - id: services_msr_period_past_due
    window: The statement month assessed, at the end of the last grace day.
    measure: Charges with that billing_period less payments and credits applied oldest first.

policies:
  - id: services_agg_multi_holding
    subject: [services_enroll]
    rule: >-
      A customer holds at most one personal services plan at a time, and where household_sharing is true both occupants of a double-occupancy independent living apartment draw from that one plan; the second occupant never enrolls separately.
      A new plan may be opened only when the customer has no other plan in pending_start, active, suspended or cancel_pending status.
    eligibility:
      - id: no_open_plan
        applies_to: [services_enroll]
        kind: dedup
        condition: A new plan may be opened only when the customer has no other plan in pending_start, active, suspended or cancel_pending status.
        evidence_fields: [services_plans.customer_id, services_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_plans.customer_id]
          action_bindings:
            services_plans.customer_id: customer_id
        dedup_contract:
          table: services_plans
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_start, active, suspended, cancel_pending]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: services_enrollment_eligibility
    subject: [services_enroll, services_withdraw, services_activate]
    rule: >-
      Personal services plans serve Larkspur residents only: the customer's residence must be an independent living residency or an assisted living residency in active or notice_given status, and the residence category must be listed in eligible_residence_categories of the package, so assisted living residents may hold only the Pay-As-You-Go Plan, the Essentials Package or the Companion Package.
      Memory care residents and respite or trial stay guests cannot enroll, because their care and services are covered under their own agreements.
      A plan starts on the first day of a calendar month, enrollment_effective_day, which is the first day of the month after the enrollment is signed or a later month the resident chooses.
      An enrollment may be withdrawn by the resident at any time before its effective date, without charge.
      The enrollment, any withdrawal and any cancellation must be signed by the resident or by a representative whose representative_authority is financial_poa, durable_poa or guardian.
    eligibility:
      - id: residence_live
        applies_to: [services_enroll]
        kind: authorization
        condition: "Personal services plans serve Larkspur residents only: the customer's residence must be an independent living residency or an assisted living residency in active or notice_given status, and the residence category must be listed in eligible_residence_categories of the package, so assisted living residents may hold only the Pay-As-You-Go Plan, the Essentials Package or the Companion Package."
        evidence_fields: [independent_residencies.status, assisted_residencies.status, independent_residencies.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [independent_residencies.customer_id]
          action_bindings:
            independent_residencies.customer_id: customer_id
      - id: enrollment_signer
        applies_to: [services_enroll, services_withdraw]
        kind: authorization
        condition: The enrollment, any withdrawal and any cancellation must be signed by the resident or by a representative whose representative_authority is financial_poa, durable_poa or guardian.
        evidence_fields: [customers.representative_authority, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params:
      per_tier:
        Personal Services Pay-As-You-Go Plan: {eligible_residence_categories: "=eligible_residence_categories", enrollment_effective_day: "=enrollment_effective_day"}
        Personal Services Essentials Package: {eligible_residence_categories: "=eligible_residence_categories", enrollment_effective_day: "=enrollment_effective_day"}
        Personal Services Companion Package: {eligible_residence_categories: "=eligible_residence_categories", enrollment_effective_day: "=enrollment_effective_day"}
        Personal Services Comfort Package: {eligible_residence_categories: "=eligible_residence_categories", enrollment_effective_day: "=enrollment_effective_day"}
        Personal Services Premier Package: {eligible_residence_categories: "=eligible_residence_categories", enrollment_effective_day: "=enrollment_effective_day"}
        Personal Services Concierge Package: {eligible_residence_categories: "=eligible_residence_categories", enrollment_effective_day: "=enrollment_effective_day"}

  - id: services_monthly_cycle
    subject: [services_package_fee_charge, services_hours_grant, services_hours_rollover, services_hours_expire]
    rule: >-
      On the first day of each month in which the plan is active, the monthly_package_fee of the package is charged in advance and monthly_hours_allotment hours are granted; nothing is charged or granted for a suspended month or for the Pay-As-You-Go Plan.
      At the end of each month the hours remaining, services_msr_unused_hours_at_month_end, expire as one month_end expiry; where rollover_months is 1 the lesser of those hours and rollover_cap_hours is granted back on the first day of the next month as rollover hours, and rollover hours that remain unused at the end of that next month expire with the rest and never roll a second time.
      When the plan ends all remaining hours expire as one plan_end expiry on the end date, and no hours are ever paid out in money.
      Where package_fee_proration_on_residency_end is true and the plan ends mid-month because the residency ended, the package fee for the days after the end date is returned as a residency_end_proration credit, the daily fee being the monthly fee divided by the days in that month, rounded to the cent half up.
      Package fees and hour grants may be posted only while the plan is in active or cancel_pending status; expiries may also be posted once the plan has ended.
    eligibility:
      - id: fee_and_grant_while_active
        applies_to: [services_package_fee_charge, services_hours_grant, services_hours_rollover]
        kind: state
        condition: Package fees and hour grants may be posted only while the plan is in active or cancel_pending status; expiries may also be posted once the plan has ended.
        evidence_fields: [services_plans.status, services_plans.services_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_plans.services_plan_id]
          action_bindings:
            services_plans.services_plan_id: services_plan_id
        state_contract:
          field: services_plans.status
          allowed: [active, cancel_pending]
      - id: expiry_on_active_or_ended
        applies_to: [services_hours_expire]
        kind: state
        condition: Package fees and hour grants may be posted only while the plan is in active or cancel_pending status; expiries may also be posted once the plan has ended.
        evidence_fields: [services_plans.status, services_plans.services_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_plans.services_plan_id]
          action_bindings:
            services_plans.services_plan_id: services_plan_id
        state_contract:
          field: services_plans.status
          allowed: [active, cancel_pending, ended]
    measures: [services_msr_unused_hours_at_month_end]
    params:
      per_tier:
        Personal Services Pay-As-You-Go Plan: {monthly_package_fee: "=monthly_package_fee", monthly_hours_allotment: "=monthly_hours_allotment", rollover_months: "=rollover_months", rollover_cap_hours: "=rollover_cap_hours", package_fee_proration_on_residency_end: "=package_fee_proration_on_residency_end"}
        Personal Services Essentials Package: {monthly_package_fee: "=monthly_package_fee", monthly_hours_allotment: "=monthly_hours_allotment", rollover_months: "=rollover_months", rollover_cap_hours: "=rollover_cap_hours", package_fee_proration_on_residency_end: "=package_fee_proration_on_residency_end"}
        Personal Services Companion Package: {monthly_package_fee: "=monthly_package_fee", monthly_hours_allotment: "=monthly_hours_allotment", rollover_months: "=rollover_months", rollover_cap_hours: "=rollover_cap_hours", package_fee_proration_on_residency_end: "=package_fee_proration_on_residency_end"}
        Personal Services Comfort Package: {monthly_package_fee: "=monthly_package_fee", monthly_hours_allotment: "=monthly_hours_allotment", rollover_months: "=rollover_months", rollover_cap_hours: "=rollover_cap_hours", package_fee_proration_on_residency_end: "=package_fee_proration_on_residency_end"}
        Personal Services Premier Package: {monthly_package_fee: "=monthly_package_fee", monthly_hours_allotment: "=monthly_hours_allotment", rollover_months: "=rollover_months", rollover_cap_hours: "=rollover_cap_hours", package_fee_proration_on_residency_end: "=package_fee_proration_on_residency_end"}
        Personal Services Concierge Package: {monthly_package_fee: "=monthly_package_fee", monthly_hours_allotment: "=monthly_hours_allotment", rollover_months: "=rollover_months", rollover_cap_hours: "=rollover_cap_hours", package_fee_proration_on_residency_end: "=package_fee_proration_on_residency_end"}
    formula:
      rollover_hours: min(services_msr_unused_hours_at_month_end, rollover_cap_hours)

  - id: services_order_booking
    subject: [services_order_book, services_alacarte_charge]
    rule: >-
      Services are booked as orders with a date, start time and booked hours; one visit may not exceed max_hours_per_visit, and a plan may have no more than max_open_orders open orders as measured by services_msr_open_orders.
      Pet care can be booked only where pet_care_available is true, off-campus escorts only where escort_off_campus_available is true, and overnight companions only where overnight_companion_available is true.
      A booking made less than order_booking_lead_hours before the scheduled start, by services_msr_notice_hours, carries one rush_booking fee per order where the package's rush_booking_fee is above 0.00.
      Orders may be booked only while the plan is in active or cancel_pending status, for dates on or before the plan's end date.
    eligibility:
      - id: booking_on_live_plan
        applies_to: [services_order_book]
        kind: state
        condition: Orders may be booked only while the plan is in active or cancel_pending status, for dates on or before the plan's end date.
        evidence_fields: [services_plans.status, services_plans.services_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_plans.services_plan_id]
          action_bindings:
            services_plans.services_plan_id: services_plan_id
        state_contract:
          field: services_plans.status
          allowed: [active, cancel_pending]
    measures: [services_msr_open_orders, services_msr_notice_hours]
    params:
      per_tier:
        Personal Services Pay-As-You-Go Plan: {pet_care_available: "=pet_care_available", escort_off_campus_available: "=escort_off_campus_available", overnight_companion_available: "=overnight_companion_available", rush_booking_fee: "=rush_booking_fee", max_hours_per_visit: "=max_hours_per_visit"}
        Personal Services Essentials Package: {pet_care_available: "=pet_care_available", escort_off_campus_available: "=escort_off_campus_available", overnight_companion_available: "=overnight_companion_available", rush_booking_fee: "=rush_booking_fee", max_hours_per_visit: "=max_hours_per_visit"}
        Personal Services Companion Package: {pet_care_available: "=pet_care_available", escort_off_campus_available: "=escort_off_campus_available", overnight_companion_available: "=overnight_companion_available", rush_booking_fee: "=rush_booking_fee", max_hours_per_visit: "=max_hours_per_visit"}
        Personal Services Comfort Package: {pet_care_available: "=pet_care_available", escort_off_campus_available: "=escort_off_campus_available", overnight_companion_available: "=overnight_companion_available", rush_booking_fee: "=rush_booking_fee", max_hours_per_visit: "=max_hours_per_visit"}
        Personal Services Premier Package: {pet_care_available: "=pet_care_available", escort_off_campus_available: "=escort_off_campus_available", overnight_companion_available: "=overnight_companion_available", rush_booking_fee: "=rush_booking_fee", max_hours_per_visit: "=max_hours_per_visit"}
        Personal Services Concierge Package: {pet_care_available: "=pet_care_available", escort_off_campus_available: "=escort_off_campus_available", overnight_companion_available: "=overnight_companion_available", rush_booking_fee: "=rush_booking_fee", max_hours_per_visit: "=max_hours_per_visit"}

  - id: services_hours_and_billing
    subject: [services_order_complete, services_hours_draw, services_hourly_charge, services_alacarte_charge]
    rule: >-
      Services listed in hourly_service_codes are delivered against personal service hours, and services listed in alacarte_service_codes are priced separately. Delivered time of an hourly service is rounded up to the next billing_increment_minutes and never counted below minimum_visit_hours, or below companion_visit_minimum_hours for a companion visit; unit-priced hourly services convert to hours by unit_hours_equivalent.
      Hours delivered on a Saturday or Sunday are increased by weekend_surcharge_pct percent and hours delivered on a date in holiday_calendar by holiday_surcharge_pct percent instead, the holiday surcharge taking precedence and the two never adding together.
      The resulting hours are drawn from services_msr_hours_available; where fewer hours remain than are needed, the remaining hours are drawn and the rest are charged at hourly_rate_beyond_allotment of the package as one hourly charge on the same order, each amount rounded to the cent half up.
      A la carte services are never drawn from hours: private transportation at transportation_rate_per_mile with transportation_minimum_charge per trip, handyman work at handyman_hourly_rate with handyman_minimum_hours, an overnight companion at overnight_companion_flat_rate per night, and a grocery delivery at grocery_delivery_fee except that the first free_grocery_deliveries_per_month deliveries in a month by services_msr_grocery_deliveries_in_month are posted at 0.00; member_discount_pct of the package is deducted from each a la carte charge, rounded to the cent half up.
      Hours are drawn and charged only for an order that was booked and then delivered, cancelled late or missed, and each order is drawn at most once and charged at most once per draw basis.
    eligibility:
      - id: one_draw_per_order
        applies_to: [services_hours_draw, services_hourly_charge]
        kind: dedup
        condition: Hours are drawn and charged only for an order that was booked and then delivered, cancelled late or missed, and each order is drawn at most once and charged at most once per draw basis.
        evidence_fields: [services_ledger.order_reference, services_ledger.draw_basis, services_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [services_ledger.order_reference, services_ledger.draw_basis]
          action_bindings:
            services_ledger.order_reference: order_reference
            services_ledger.draw_basis: draw_basis
        dedup_contract:
          table: services_ledger
          mode: separate_record
          object_bindings: {order_reference: order_reference, draw_basis: draw_basis, event_type: event_type}
          duplicate_filters: {event_type: [services_hours_draw, services_hourly_charge]}
          distinct_fields: []
    measures: [services_msr_hours_available, services_msr_grocery_deliveries_in_month]
    params:
      per_tier:
        Personal Services Pay-As-You-Go Plan: {hourly_rate_beyond_allotment: "=hourly_rate_beyond_allotment", minimum_visit_hours: "=minimum_visit_hours", weekend_surcharge_pct: "=weekend_surcharge_pct", holiday_surcharge_pct: "=holiday_surcharge_pct", member_discount_pct: "=member_discount_pct", free_grocery_deliveries_per_month: "=free_grocery_deliveries_per_month"}
        Personal Services Essentials Package: {hourly_rate_beyond_allotment: "=hourly_rate_beyond_allotment", minimum_visit_hours: "=minimum_visit_hours", weekend_surcharge_pct: "=weekend_surcharge_pct", holiday_surcharge_pct: "=holiday_surcharge_pct", member_discount_pct: "=member_discount_pct", free_grocery_deliveries_per_month: "=free_grocery_deliveries_per_month"}
