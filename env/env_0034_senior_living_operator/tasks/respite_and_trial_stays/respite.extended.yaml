    baseline:
      rule: >-
        The level-change credit equals the re-leveled nights times the price charged per night by the segment being re-leveled, and it references that segment.
        The price charged per night by the segment being re-leveled is that segment's amount divided by its nights.
        In the standard method the re-leveled nights run from the level effective date on the stay through the last night of the segment being re-leveled, both nights counted.
        The level-change credit is rounded half up to the cent once, on the final product, and its nights are the re-leveled nights.
      params: [nightly_rate]
    inputs:
      history:
        - {table: respite_ledger, aggregate: latest, field: segment_end_date, filters: {event_type: respite_nightly_charge}}
        - {table: respite_ledger, aggregate: sum, field: amount, filters: {event_type: respite_nightly_charge}}
        - {table: respite_ledger, aggregate: sum, field: nights, filters: {event_type: respite_nightly_charge}}
      cross_category: [independent, entrance]

  - id: respite_ext_relevel_segment
    base_policy_refs: [respite_level_change_rules, respite_booking_terms, respite_stay_billing_and_extension]
    overwrite:
      - base_policy: respite_level_change_rules
        superseded_clause: >-
          the same nights are charged as a level_change segment at the new level's nightly_rate published on the booking date
        replaced_by: >-
          The level-change segment charges every re-leveled night at the nightly rate locked at booking and adds the care increase billed for the re-leveled nights.
      - base_policy: respite_booking_terms
        superseded_clause: >-
          applies to every night of the stay, extensions included
        replaced_by: >-
          The level-change segment charges every re-leveled night at the nightly rate locked at booking and adds the care increase billed for the re-leveled nights.
    trigger: state_due
    subject: [respite_nightly_charge]
    computes: segment_amount
    target_tool: charge_relevel_segment_3be81426
    params:
      pre_share_low: 0.5
      pre_share_mid: 0.75
      pre_share_full: 1.0
      campus_same: 5
      campus_other: 2
      loyalty_long: 3
      loyalty_mid: 1
      loyalty_long_months: 60
      loyalty_mid_months: 24
      standing_multi: 2
      standing_single: 1
    rule: >-
      The re-leveled nights of a level change recorded on an assisted living respite stay are charged again as one level-change segment billing the stay type on record, starting on the first re-leveled night and ending on the last night of the segment that was credited.
      A level-change segment is fixed only after the stay's records carry a level-change adjustment credit for the nights being re-leveled.
      The re-leveled nights of the segment are the nights of that level-change adjustment credit, and the segment that was credited is the stay's latest nightly charge segment.
      The level-change segment charges every re-leveled night at the nightly rate locked at booking and adds the care increase billed for the re-leveled nights.
      The care increase per re-leveled night is the published nightly rate of the stay type on record less the nightly rate locked at booking.
      In the standard method the full care increase is billed for every re-leveled night, so the level-change segment equals the re-leveled nights times the published nightly rate of the stay type on record.
      The care increase billed per re-leveled night is the care increase reduced in turn by the Life Plan care cover, the on-campus resident courtesy, the residency loyalty reduction and the account standing courtesy, each reduction acting on the result of the one before.
      The billed increase nights are the billed re-leveled nights less, for each pre-assessment night, the part of its care increase that the pre-assessment share leaves unbilled.
      The level-change segment is the re-leveled nights times the nightly rate locked at booking, plus the billed increase nights times the care increase billed per re-leveled night, rounded half up to the cent once, on the final total.
      Pre-assessment nights are the re-leveled nights that fall before the level effective date on the stay, that is the re-leveled nights less the nights from the level effective date through the last night of the segment that was credited, both counted.
      The pre-assessment share of the care increase is one half when there are three or more pre-assessment nights, three quarters when there are one or two, and the whole increase when there are none.
      The Life Plan care cover on the re-leveled nights is the care fee discount of the guest's plan, taken as a percentage of the care increase, for a guest who holds an occupied Larkspur Entrance Fee Agreement on a lifecare plan or on a fee-for-service plan, and nothing for any other guest.
      The on-campus resident courtesy on the re-leveled nights is five percent for a guest whose active Larkspur independent living residency is at the same community as the stay, two percent for a guest whose active Larkspur independent living residency is at another community, and nothing for any other guest.
      The residency loyalty reduction on the re-leveled nights is three percent where the guest's active Larkspur independent living residency began at least sixty whole months before the current date, one percent where it began at least twenty-four but fewer than sixty whole months before, and nothing otherwise.
      The account standing courtesy on the re-leveled nights is two percent where the stay account shows no returned payment and at least two payments, one percent where it shows no returned payment and exactly one payment, and nothing otherwise.
      The billed re-leveled nights are counted by one of three methods: for a re-level of fourteen nights or more, the care increase of one night in every seven re-leveled nights is not billed; for a re-level of seven to thirteen nights, the care increase of one night is not billed; for a shorter re-level, the care increase is billed for every re-leveled night.
    prerequisite:
      - problem: respite_ext_relevel_credit
        kind: value_input
        gate: relevel_nights
        form: state
        policy_source: >-
          A level-change segment is fixed only after the stay's records carry a level-change adjustment credit for the nights being re-leveled.
        condition: >-
          The stay ledger carries a respite_credit entry with credit reason level_change_adjustment that references the segment being re-leveled and states the re-leveled nights.
        resolved_by: credit_relevel_nights_cb1c5023
        effect: >-
          relevel_nights takes the nights of the level-change adjustment credit; without that credit the segment has no re-leveled nights to charge.
    cross_category:
      - category: entrance
        as: branch
        reads: [status, contract_type, care_fee_discount_pct]
        note: The Life Plan care cover reads the occupied agreement, its plan's contract type and its care fee discount.
      - category: independent
        as: branch
        reads: [status, community_name, move_in_date]
        note: The on-campus resident courtesy reads the active residency's community and the residency loyalty reduction its move-in date.
    compute:
      - relevel_nights: "LATEST('respite_ledger', 'nights', date_field='posting_date', event_type='respite_credit', credit_reason='level_change_adjustment')"
      - booked_rate: "F('nightly_rate_locked')"
      - care_increase: "P('nightly_rate') - booked_rate"
      - seg_last: "LATEST('respite_ledger', 'segment_end_date', date_field='posting_date', event_type='respite_nightly_charge')"
      - post_nights: "DAYS(F('level_effective_date'), seg_last) + 1"
      - pre_nights: "MX(relevel_nights - post_nights, 0)"
      - pre_share: "K('pre_share_low') if pre_nights >= 3 else (K('pre_share_mid') if pre_nights >= 1 else K('pre_share_full'))"
      - plan_occupied: "EXISTS('entrance', status='occupied')"
      - plan_contract: "CPARAM('entrance', 'contract_type', status='occupied')"
      - plan_cover_pct: "CPARAM('entrance', 'care_fee_discount_pct', status='occupied') if (plan_occupied and plan_contract == 'lifecare') else (CPARAM('entrance', 'care_fee_discount_pct', status='occupied') if (plan_occupied and plan_contract == 'fee_for_service') else 0)"
      - il_active: "CFIELD('independent', 'status', status='active') == 'active'"
      - il_community: "CFIELD('independent', 'community_name', status='active')"
      - campus_pct: "K('campus_same') if (il_active and il_community == F('community_name')) else (K('campus_other') if (il_active and il_community != F('community_name')) else 0)"
      - il_months: "MONTHS(CFIELD('independent', 'move_in_date', status='active'), NOW) if CFIELD('independent', 'status', status='active') == 'active' else 0"
      - loyalty_pct: "K('loyalty_long') if il_months >= K('loyalty_long_months') else (K('loyalty_mid') if il_months >= K('loyalty_mid_months') else 0)"
      - payments_posted: "COUNT('respite_ledger', event_type='respite_payment')"
      - payments_returned: "COUNT('respite_ledger', event_type='respite_payment_return')"
      - standing_pct: "K('standing_multi') if (payments_returned == 0 and payments_posted >= 2) else (K('standing_single') if (payments_returned == 0 and payments_posted == 1) else 0)"
      - billed_relevel_nights: "(relevel_nights - relevel_nights // 7) if relevel_nights >= 14 else ((relevel_nights - 1) if relevel_nights >= 7 else relevel_nights)"
      - increase_nights: "billed_relevel_nights - pre_nights * (1 - pre_share)"
      - increase_billed: "care_increase * (1 - plan_cover_pct / 100) * (1 - campus_pct / 100) * (1 - loyalty_pct / 100) * (1 - standing_pct / 100)"
      - result: "RND(relevel_nights * booked_rate + increase_nights * increase_billed, 2)"
    compute_basis:
      relevel_nights: "The re-leveled nights of the segment are the nights of that level-change adjustment credit"
      booked_rate: "The level-change segment charges every re-leveled night at the nightly rate locked at booking"
      care_increase: "The care increase per re-leveled night is the published nightly rate of the stay type on record less the nightly rate locked at booking."
      seg_last: "the segment that was credited is the stay's latest nightly charge segment."
      post_nights: "the re-leveled nights less the nights from the level effective date through the last night of the segment that was credited, both counted."
      pre_nights: "Pre-assessment nights are the re-leveled nights that fall before the level effective date on the stay"
      pre_share: "The pre-assessment share of the care increase is one half when there are three or more pre-assessment nights, three quarters when there are one or two, and the whole increase when there are none."
      plan_occupied: "for a guest who holds an occupied Larkspur Entrance Fee Agreement on a lifecare plan or on a fee-for-service plan, and nothing for any other guest."
      plan_contract: "on a lifecare plan or on a fee-for-service plan"
      plan_cover_pct: "The Life Plan care cover on the re-leveled nights is the care fee discount of the guest's plan, taken as a percentage of the care increase, for a guest who holds an occupied Larkspur Entrance Fee Agreement on a lifecare plan or on a fee-for-service plan, and nothing for any other guest."
      il_active: "for a guest whose active Larkspur independent living residency is at the same community as the stay"
      il_community: "is at the same community as the stay, two percent for a guest whose active Larkspur independent living residency is at another community"
      campus_pct: "The on-campus resident courtesy on the re-leveled nights is five percent for a guest whose active Larkspur independent living residency is at the same community as the stay, two percent for a guest whose active Larkspur independent living residency is at another community, and nothing for any other guest."
      il_months: "where the guest's active Larkspur independent living residency began at least sixty whole months before the current date"
      loyalty_pct: "The residency loyalty reduction on the re-leveled nights is three percent where the guest's active Larkspur independent living residency began at least sixty whole months before the current date, one percent where it began at least twenty-four but fewer than sixty whole months before, and nothing otherwise."
      payments_posted: "where the stay account shows no returned payment and at least two payments"
      payments_returned: "where the stay account shows no returned payment"
      standing_pct: "The account standing courtesy on the re-leveled nights is two percent where the stay account shows no returned payment and at least two payments, one percent where it shows no returned payment and exactly one payment, and nothing otherwise."
      billed_relevel_nights: "The billed re-leveled nights are counted by one of three methods: for a re-level of fourteen nights or more, the care increase of one night in every seven re-leveled nights is not billed; for a re-level of seven to thirteen nights, the care increase of one night is not billed; for a shorter re-level, the care increase is billed for every re-leveled night."
      increase_nights: "The billed increase nights are the billed re-leveled nights less, for each pre-assessment night, the part of its care increase that the pre-assessment share leaves unbilled."
      increase_billed: "The care increase billed per re-leveled night is the care increase reduced in turn by the Life Plan care cover, the on-campus resident courtesy, the residency loyalty reduction and the account standing courtesy, each reduction acting on the result of the one before."
      result: "The level-change segment is the re-leveled nights times the nightly rate locked at booking, plus the billed increase nights times the care increase billed per re-leveled night, rounded half up to the cent once, on the final total."
    factors:
      - id: pre_assessment_share
        effect: parameter
        decides: pre_share
        bindings: [seg_last, post_nights, pre_nights, pre_share]
        ladder:
          - when: "three or more re-leveled nights fall before the level effective date"
            value: "K('pre_share_low') = one half of the care increase"
          - when: "one or two re-leveled nights fall before the level effective date"
            value: "K('pre_share_mid') = three quarters of the care increase"
          - when: "otherwise"
            value: "K('pre_share_full') = the whole care increase"
        baseline:
          pre_share: "K('pre_share_full')"
        evidence: [date, history]
        cross_difficulty: null
      - id: life_plan_care_cover
        effect: parameter
        decides: plan_cover_pct
        bindings: [plan_occupied, plan_contract, plan_cover_pct]
        ladder:
          - when: "an occupied Larkspur Entrance Fee Agreement AND its plan's contract type is lifecare"
            value: "the plan's care fee discount (100 percent on the LifeCare plans)"
          - when: "an occupied Larkspur Entrance Fee Agreement AND its plan's contract type is fee-for-service"
            value: "the plan's care fee discount (10 percent on the LifeChoice plans)"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          plan_cover_pct: "0"
        evidence: [cross_category]
        cross_difficulty: entrance
      - id: on_campus_courtesy
        effect: parameter
        decides: campus_pct
        bindings: [il_active, il_community, campus_pct]
        ladder:
          - when: "an active Larkspur independent living residency AND it is at the same community as the stay"
            value: "K('campus_same') = 5 percent"
          - when: "an active Larkspur independent living residency AND it is at another community"
            value: "K('campus_other') = 2 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          campus_pct: "0"
        evidence: [cross_category]
        cross_difficulty: independent
      - id: residency_loyalty
        effect: parameter
        decides: loyalty_pct
        bindings: [il_months, loyalty_pct]
        ladder:
          - when: "the active Larkspur independent living residency began at least sixty whole months before the current date"
            value: "K('loyalty_long') = 3 percent"
          - when: "it began at least twenty-four but fewer than sixty whole months before"
            value: "K('loyalty_mid') = 1 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          loyalty_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: independent
      - id: account_standing
        effect: parameter
        decides: standing_pct
        bindings: [payments_posted, payments_returned, standing_pct]
        ladder:
          - when: "no returned payment on the stay account AND at least two payments"
            value: "K('standing_multi') = 2 percent"
          - when: "no returned payment on the stay account AND exactly one payment"
            value: "K('standing_single') = 1 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          standing_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: weekly_increase_nights
        effect: method
        decides: billed_relevel_nights
        bindings: [relevel_nights, billed_relevel_nights]
        ladder:
          - when: "a re-level of fourteen nights or more"
            method: "the care increase of one night in every seven re-leveled nights is not billed"
          - when: "a re-level of seven to thirteen nights"
            method: "the care increase of one night is not billed"
          - when: "otherwise"
            method: "the care increase is billed for every re-leveled night"
        baseline:
          billed_relevel_nights: "relevel_nights"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The level-change segment charges every re-leveled night at the nightly rate locked at booking and adds the care increase billed for the re-leveled nights.
        The care increase per re-leveled night is the published nightly rate of the stay type on record less the nightly rate locked at booking.
        In the standard method the full care increase is billed for every re-leveled night, so the level-change segment equals the re-leveled nights times the published nightly rate of the stay type on record.
      params: [nightly_rate]
    inputs:
      history:
        - {table: respite_ledger, aggregate: latest, field: nights, filters: {event_type: respite_credit, credit_reason: level_change_adjustment}}
        - {table: respite_ledger, aggregate: latest, field: segment_end_date, filters: {event_type: respite_nightly_charge}}
        - {table: respite_ledger, aggregate: count, field: respite_entry_id, filters: {event_type: respite_payment}}
        - {table: respite_ledger, aggregate: count, field: respite_entry_id, filters: {event_type: respite_payment_return}}
      cross_category: [entrance, independent]

  - id: respite_ext_signed_extension
    base_policy_refs: [respite_stay_billing_and_extension, respite_agg_annual_nights, respite_booking_terms, respite_level_change_rules]
    overwrite:
      - base_policy: respite_stay_billing_and_extension
        superseded_clause: >-
          An extension moves the planned departure date later at the guest's request and is charged as an extension segment of the added nights at nightly_rate_locked.
        replaced_by: >-
          When the guest or a financial representative signs an extension request registered on the stay, the planned departure date moves to the requested date and the added nights are booked as one extension segment whose amount is the extension charge.
      - base_policy: respite_booking_terms
        superseded_clause: >-
          applies to every night of the stay, extensions included
        replaced_by: >-
          The added-night rate is the nightly rate locked at booking in the standard method.
    trigger: on_request
    subject: [respite_extension, respite_nightly_charge]
    computes: extension_charge
    target_tool: sign_stay_extension_37758bab
    params:
      campus_same: 5
      campus_other: 2
      notice_short_days: 3
      notice_mid_days: 7
      surcharge_short: 15
      surcharge_mid: 8
      loyalty_long: 3
      loyalty_mid: 1
      loyalty_long_months: 60
      loyalty_mid_months: 24
    rule: >-
      When the guest or a financial representative signs an extension request registered on the stay, the planned departure date moves to the requested date and the added nights are booked as one extension segment whose amount is the extension charge.
      The added nights run from the planned departure date on record up to the requested date, that is the requested date less the planned departure date in calendar days.
      Where the stay type on record differs from the stay type the stay was booked as, added nights are not booked until the stay's records carry a level-change segment billing the stay type on record.
      The added-night rate is the nightly rate locked at booking in the standard method.
      In the standard method the extension charge is the added nights times the nightly rate locked at booking.
      The added-night rate is chosen from the stay's latest nightly charge segment: where that segment is a level-change segment and the stay's records carry a level-change segment billing the stay type on record, the added-night rate is the published nightly rate of the stay type on record; where that segment is an extension segment, it is that segment's amount divided by its nights; in every other case it is the nightly rate locked at booking.
      The care increase on an added night is the added-night rate less the nightly rate locked at booking, and it is reduced first by the Life Plan care cover on added nights and then, on that result, by the on-campus resident courtesy on added nights.
      The price of an added night is the nightly rate locked at booking plus the reduced care increase.
      The extension charge is the billed added nights times the price of an added night, reduced on that product by the residency loyalty reduction on added nights, plus the added nights times the short-notice surcharge, rounded half up to the cent once, on the final total.
      The Life Plan care cover on added nights is the care fee discount of the guest's plan, taken as a percentage of the care increase, for a guest who holds an occupied Larkspur Entrance Fee Agreement on a lifecare plan or on a fee-for-service plan, and nothing for any other guest.
      The on-campus resident courtesy on added nights is five percent of the care increase for a guest whose active Larkspur independent living residency is at the same community as the stay, two percent for a guest whose active Larkspur independent living residency is at another community, and nothing for any other guest.
      The billed added nights are counted by one of three methods: for fourteen or more added nights, the price of one added night in every seven is not charged; for seven to thirteen added nights, the price of one added night is not charged; for fewer added nights, every added night is charged.
      The short-notice surcharge per added night is fifteen dollars when the extension request was registered three or fewer days before the planned departure date on record, eight dollars when it was registered four to seven days before, and nothing when it was registered earlier.
      The residency loyalty reduction on added nights is three percent of the added-night charges where the guest's active Larkspur independent living residency began at least sixty whole months before the current date, one percent where it began at least twenty-four but fewer than sixty whole months before, and nothing otherwise.
    prerequisite:
      - problem: respite_ext_relevel_segment
        kind: value_input
        gate: added_night_rate
        form: state
        policy_source: >-
          Where the stay type on record differs from the stay type the stay was booked as, added nights are not booked until the stay's records carry a level-change segment billing the stay type on record.
        condition: >-
          Where the stay type on record differs from the tier billed by the stay's planned_stay segment, the stay ledger carries at least one respite_nightly_charge entry with charge_basis level_change whose tier billed equals the stay type on record.
        resolved_by: charge_relevel_segment_3be81426
        effect: >-
          added_night_rate becomes the published nightly rate of the stay type on record instead of the nightly rate locked at booking, so the care increase enters the extension charge.
    cross_category:
      - category: entrance
        as: branch
        reads: [status, contract_type, care_fee_discount_pct]
        note: The Life Plan care cover on added nights reads the occupied agreement and its plan.
      - category: independent
        as: branch
        reads: [status, community_name, move_in_date]
        note: The on-campus resident courtesy and the residency loyalty reduction on added nights read the active residency.
    compute:
      - req_date: "LATEST('respite_requests', 'requested_date', date_field='created_at', request_type='stay_extension', request_status='pending_signature')"
      - req_registered: "LATEST('respite_requests', 'created_at', date_field='created_at', request_type='stay_extension', request_status='pending_signature')"
      - added_nights: "DAYS(F('planned_departure_date'), req_date)"
      - booked_rate: "F('nightly_rate_locked')"
      - latest_basis: "LATEST('respite_ledger', 'charge_basis', date_field='posting_date', event_type='respite_nightly_charge')"
      - relevel_segments: "COUNT('respite_ledger', event_type='respite_nightly_charge', charge_basis='level_change', tier_billed=F('variant_name'))"
      - latest_amount: "LATEST('respite_ledger', 'amount', date_field='posting_date', event_type='respite_nightly_charge')"
      - latest_nights: "LATEST('respite_ledger', 'nights', date_field='posting_date', event_type='respite_nightly_charge')"
      - added_night_rate: "P('nightly_rate') if (latest_basis == 'level_change' and relevel_segments > 0) else ((latest_amount / latest_nights) if latest_basis == 'extension' else booked_rate)"
      - care_increase: "added_night_rate - booked_rate"
      - plan_occupied: "EXISTS('entrance', status='occupied')"
      - plan_contract: "CPARAM('entrance', 'contract_type', status='occupied')"
      - plan_cover_pct: "CPARAM('entrance', 'care_fee_discount_pct', status='occupied') if (plan_occupied and plan_contract == 'lifecare') else (CPARAM('entrance', 'care_fee_discount_pct', status='occupied') if (plan_occupied and plan_contract == 'fee_for_service') else 0)"
      - il_active: "CFIELD('independent', 'status', status='active') == 'active'"
      - il_community: "CFIELD('independent', 'community_name', status='active')"
      - campus_pct: "K('campus_same') if (il_active and il_community == F('community_name')) else (K('campus_other') if (il_active and il_community != F('community_name')) else 0)"
      - billed_added_nights: "(added_nights - added_nights // 7) if added_nights >= 14 else ((added_nights - 1) if added_nights >= 7 else added_nights)"
      - notice_days: "DAYS(req_registered, F('planned_departure_date'))"
      - surcharge: "K('surcharge_short') if notice_days <= K('notice_short_days') else (K('surcharge_mid') if notice_days <= K('notice_mid_days') else 0)"
      - il_months: "MONTHS(CFIELD('independent', 'move_in_date', status='active'), NOW) if CFIELD('independent', 'status', status='active') == 'active' else 0"
      - loyalty_pct: "K('loyalty_long') if il_months >= K('loyalty_long_months') else (K('loyalty_mid') if il_months >= K('loyalty_mid_months') else 0)"
      - added_night_price: "booked_rate + care_increase * (1 - plan_cover_pct / 100) * (1 - campus_pct / 100)"
      - result: "RND(billed_added_nights * added_night_price * (1 - loyalty_pct / 100) + added_nights * surcharge, 2)"
    compute_basis:
      req_date: "When the guest or a financial representative signs an extension request registered on the stay, the planned departure date moves to the requested date"
      req_registered: "when the extension request was registered three or fewer days before the planned departure date on record"
      added_nights: "The added nights run from the planned departure date on record up to the requested date, that is the requested date less the planned departure date in calendar days."
      booked_rate: "The added-night rate is the nightly rate locked at booking in the standard method."
      latest_basis: "The added-night rate is chosen from the stay's latest nightly charge segment"
      relevel_segments: "where that segment is a level-change segment and the stay's records carry a level-change segment billing the stay type on record"
      latest_amount: "where that segment is an extension segment, it is that segment's amount divided by its nights"
      latest_nights: "where that segment is an extension segment, it is that segment's amount divided by its nights"
      added_night_rate: "The added-night rate is chosen from the stay's latest nightly charge segment: where that segment is a level-change segment and the stay's records carry a level-change segment billing the stay type on record, the added-night rate is the published nightly rate of the stay type on record; where that segment is an extension segment, it is that segment's amount divided by its nights; in every other case it is the nightly rate locked at booking."
      care_increase: "The care increase on an added night is the added-night rate less the nightly rate locked at booking"
      plan_occupied: "for a guest who holds an occupied Larkspur Entrance Fee Agreement on a lifecare plan or on a fee-for-service plan, and nothing for any other guest."
      plan_contract: "on a lifecare plan or on a fee-for-service plan"
      plan_cover_pct: "The Life Plan care cover on added nights is the care fee discount of the guest's plan, taken as a percentage of the care increase, for a guest who holds an occupied Larkspur Entrance Fee Agreement on a lifecare plan or on a fee-for-service plan, and nothing for any other guest."
      il_active: "for a guest whose active Larkspur independent living residency is at the same community as the stay"
      il_community: "is at the same community as the stay, two percent for a guest whose active Larkspur independent living residency is at another community"
      campus_pct: "The on-campus resident courtesy on added nights is five percent of the care increase for a guest whose active Larkspur independent living residency is at the same community as the stay, two percent for a guest whose active Larkspur independent living residency is at another community, and nothing for any other guest."
      billed_added_nights: "The billed added nights are counted by one of three methods: for fourteen or more added nights, the price of one added night in every seven is not charged; for seven to thirteen added nights, the price of one added night is not charged; for fewer added nights, every added night is charged."
      notice_days: "when the extension request was registered three or fewer days before the planned departure date on record"
      surcharge: "The short-notice surcharge per added night is fifteen dollars when the extension request was registered three or fewer days before the planned departure date on record, eight dollars when it was registered four to seven days before, and nothing when it was registered earlier."
      il_months: "where the guest's active Larkspur independent living residency began at least sixty whole months before the current date"
      loyalty_pct: "The residency loyalty reduction on added nights is three percent of the added-night charges where the guest's active Larkspur independent living residency began at least sixty whole months before the current date, one percent where it began at least twenty-four but fewer than sixty whole months before, and nothing otherwise."
      added_night_price: "it is reduced first by the Life Plan care cover on added nights and then, on that result, by the on-campus resident courtesy on added nights. The price of an added night is the nightly rate locked at booking plus the reduced care increase."
      result: "The extension charge is the billed added nights times the price of an added night, reduced on that product by the residency loyalty reduction on added nights, plus the added nights times the short-notice surcharge, rounded half up to the cent once, on the final total."
    factors:
      - id: added_night_rate_source
        effect: parameter
        decides: added_night_rate
        bindings: [latest_basis, relevel_segments, latest_amount, latest_nights, added_night_rate]
        ladder:
          - when: "the latest nightly charge segment is a level-change segment AND the stay's records carry a level-change segment billing the stay type on record"
            value: "P('nightly_rate') = the published nightly rate of the stay type on record"
          - when: "the latest nightly charge segment is an extension segment"
            value: "that segment's amount divided by its nights"
          - when: "otherwise"
            value: "F('nightly_rate_locked') = the nightly rate locked at booking"
        baseline:
          added_night_rate: "booked_rate"
        evidence: [history]
        cross_difficulty: null
      - id: added_night_care_cover
        effect: parameter
        decides: plan_cover_pct
        bindings: [plan_occupied, plan_contract, plan_cover_pct]
        ladder:
          - when: "an occupied Larkspur Entrance Fee Agreement AND its plan's contract type is lifecare"
            value: "the plan's care fee discount (100 percent on the LifeCare plans)"
          - when: "an occupied Larkspur Entrance Fee Agreement AND its plan's contract type is fee-for-service"
            value: "the plan's care fee discount (10 percent on the LifeChoice plans)"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          plan_cover_pct: "0"
        evidence: [cross_category]
        cross_difficulty: entrance
      - id: added_night_campus_courtesy
        effect: parameter
        decides: campus_pct
        bindings: [il_active, il_community, campus_pct]
        ladder:
          - when: "an active Larkspur independent living residency AND it is at the same community as the stay"
            value: "K('campus_same') = 5 percent of the care increase"
          - when: "an active Larkspur independent living residency AND it is at another community"
            value: "K('campus_other') = 2 percent of the care increase"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          campus_pct: "0"
        evidence: [cross_category]
        cross_difficulty: independent
      - id: billed_added_nights
        effect: method
        decides: billed_added_nights
        bindings: [req_date, added_nights, billed_added_nights]
        ladder:
          - when: "fourteen or more added nights"
            method: "the price of one added night in every seven is not charged"
          - when: "seven to thirteen added nights"
            method: "the price of one added night is not charged"
          - when: "otherwise"
            method: "every added night is charged"
        baseline:
          billed_added_nights: "added_nights"
        evidence: [history, date]
        cross_difficulty: null
      - id: short_notice_surcharge
        effect: parameter
        decides: surcharge
        bindings: [req_registered, notice_days, surcharge]
        ladder:
          - when: "the extension request was registered three or fewer days before the planned departure date on record"
            value: "K('surcharge_short') = 15 dollars per added night"
          - when: "it was registered four to seven days before"
            value: "K('surcharge_mid') = 8 dollars per added night"
          - when: "otherwise"
            value: "0 dollars"
        baseline:
          surcharge: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: added_night_loyalty
        effect: parameter
        decides: loyalty_pct
        bindings: [il_months, loyalty_pct]
        ladder:
          - when: "the active Larkspur independent living residency began at least sixty whole months before the current date"
            value: "K('loyalty_long') = 3 percent"
          - when: "it began at least twenty-four but fewer than sixty whole months before"
            value: "K('loyalty_mid') = 1 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          loyalty_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: independent
    baseline:
      rule: >-
        The added nights run from the planned departure date on record up to the requested date, that is the requested date less the planned departure date in calendar days.
        The added-night rate is the nightly rate locked at booking in the standard method.
        In the standard method the extension charge is the added nights times the nightly rate locked at booking.
      params: [nightly_rate]
    inputs:
      history:
        - {table: respite_requests, aggregate: latest, field: requested_date, filters: {request_type: stay_extension, request_status: pending_signature}}
        - {table: respite_ledger, aggregate: latest, field: charge_basis, filters: {event_type: respite_nightly_charge}}
      cross_category: [entrance, independent]

  - id: respite_ext_returned_payment_fee
    base_policy_refs: [respite_addons]
    overwrite:
      - base_policy: respite_addons
        superseded_clause: >-
          a returned payment carries returned_payment_fee referencing it
        replaced_by: >-
          The returned-payment fee is the statutory service charge reduced first by the resident first-return courtesy and then, on that result, by the Life Plan courtesy, plus the bank return-item charge and the pre-arrival handling charge, rounded half up to the cent once, on the final total.
    trigger: state_due
    subject: [respite_addon_charge]
    computes: fee_amount
    target_tool: post_returned_payment_fee_57d4cb7a
    params:
      fl_small_limit: 50
      fl_mid_limit: 300
      fl_small_fee: 25
      fl_mid_fee: 30
      fl_large_floor: 40
      fl_large_pct: 5
      tx_fee: 30
      nc_fee: 25
      first_return_courtesy: 50
      second_return_courtesy: 25
      lifecare_courtesy: 25
      ffs_courtesy: 10
      ach_item_charge: 12
      card_item_charge: 20
      handling_near_days: 7
      handling_mid_days: 14
      handling_near: 10
      handling_mid: 5
    rule: >-
      Every payment returned unpaid on a respite or trial stay carries one returned-payment fee, posted as an add-on on that stay and referencing the returned-payment entry.
      The returned-payment fee is the statutory service charge reduced first by the resident first-return courtesy and then, on that result, by the Life Plan courtesy, plus the bank return-item charge and the pre-arrival handling charge, rounded half up to the cent once, on the final total.
      In the standard method the returned-payment fee is the returned payment fee of the stay type, with no courtesy and no further charge.
      The statutory service charge follows the state of the stay's community: at Larkspur at Harbor View in Florida it is twenty-five dollars for a returned amount of fifty dollars or less, thirty dollars for more than fifty and up to three hundred dollars, and for a larger amount the greater of forty dollars and five percent of the returned amount rounded half up to the cent; at Larkspur at Willow Creek in Texas it is thirty dollars; at Larkspur at Brookfield in North Carolina it is twenty-five dollars; at any other community it is the returned payment fee of the stay type.
      The returned amount is the amount of the stay's latest returned-payment entry.
      The resident first-return courtesy is fifty percent for a guest with an active Larkspur independent living residency whose independent living account shows no returned payment posted in the last twelve months, twenty-five percent for a guest with an active Larkspur independent living residency whose account shows exactly one returned payment posted in the last twelve months, and nothing for any other guest.
      The Life Plan courtesy is twenty-five percent for a guest holding an occupied Larkspur Entrance Fee Agreement on a lifecare plan, ten percent for one on a fee-for-service plan, and nothing otherwise.
      The bank return-item charge follows the instrument of the stay's latest payment: twelve dollars for a one-time ACH debit, twenty dollars for a credit or debit card, and nothing for any other instrument.
      The pre-arrival handling charge is ten dollars when the return was posted seven or fewer days before the planned arrival date, five dollars when it was posted eight to fourteen days before, and nothing otherwise.
    prerequisite: []
    cross_category:
      - category: independent
        as: history
        reads: [status, independent_ledger.event_type, independent_ledger.posting_date]
        note: The resident first-return courtesy counts returned payments on the guest's independent living account in the last twelve months.
      - category: entrance
        as: branch
        reads: [status, contract_type]
        note: The Life Plan courtesy reads the occupied agreement's contract type.
    compute:
      - ret_posted: "LATEST('respite_ledger', 'posting_date', date_field='posting_date', event_type='respite_payment_return')"
      - ret_amount: "SUM('respite_ledger', 'amount', event_type='respite_payment_return', posting_date=ret_posted)"
      - statutory_fee: "((K('fl_small_fee') if ret_amount <= K('fl_small_limit') else (K('fl_mid_fee') if ret_amount <= K('fl_mid_limit') else MX(K('fl_large_floor'), RND(ret_amount * K('fl_large_pct') / 100, 2)))) if F('community_name') == 'Larkspur at Harbor View' else (K('tx_fee') if F('community_name') == 'Larkspur at Willow Creek' else (K('nc_fee') if F('community_name') == 'Larkspur at Brookfield' else P('returned_payment_fee'))))"
      - il_active: "CFIELD('independent', 'status', status='active') == 'active'"
      - il_returns: "XCOUNT('independent', 'independent_ledger', within_months=12, date_field='posting_date', event_type='independent_payment_return')"
      - courtesy_pct: "K('first_return_courtesy') if (il_active and il_returns == 0) else (K('second_return_courtesy') if (il_active and il_returns == 1) else 0)"
      - plan_occupied: "EXISTS('entrance', status='occupied')"
      - plan_contract: "CPARAM('entrance', 'contract_type', status='occupied')"
      - lp_courtesy_pct: "K('lifecare_courtesy') if (plan_occupied and plan_contract == 'lifecare') else (K('ffs_courtesy') if (plan_occupied and plan_contract == 'fee_for_service') else 0)"
      - last_pay_method: "LATEST('respite_ledger', 'payment_method', date_field='posting_date', event_type='respite_payment')"
      - item_charge: "K('ach_item_charge') if last_pay_method == 'ach_one_time' else (K('card_item_charge') if (last_pay_method == 'credit_card' or last_pay_method == 'debit_card') else 0)"
      - handling_gap: "DAYS(ret_posted, F('planned_arrival_date'))"
      - handling: "K('handling_near') if handling_gap <= K('handling_near_days') else (K('handling_mid') if handling_gap <= K('handling_mid_days') else 0)"
      - result: "RND(statutory_fee * (1 - courtesy_pct / 100) * (1 - lp_courtesy_pct / 100) + item_charge + handling, 2)"
    compute_basis:
      ret_posted: "The returned amount is the amount of the stay's latest returned-payment entry."
      ret_amount: "The returned amount is the amount of the stay's latest returned-payment entry."
      statutory_fee: "The statutory service charge follows the state of the stay's community: at Larkspur at Harbor View in Florida it is twenty-five dollars for a returned amount of fifty dollars or less, thirty dollars for more than fifty and up to three hundred dollars, and for a larger amount the greater of forty dollars and five percent of the returned amount rounded half up to the cent; at Larkspur at Willow Creek in Texas it is thirty dollars; at Larkspur at Brookfield in North Carolina it is twenty-five dollars; at any other community it is the returned payment fee of the stay type."
      il_active: "for a guest with an active Larkspur independent living residency"
      il_returns: "whose independent living account shows no returned payment posted in the last twelve months"
      courtesy_pct: "The resident first-return courtesy is fifty percent for a guest with an active Larkspur independent living residency whose independent living account shows no returned payment posted in the last twelve months, twenty-five percent for a guest with an active Larkspur independent living residency whose account shows exactly one returned payment posted in the last twelve months, and nothing for any other guest."
      plan_occupied: "for a guest holding an occupied Larkspur Entrance Fee Agreement on a lifecare plan"
      plan_contract: "on a lifecare plan, ten percent for one on a fee-for-service plan"
      lp_courtesy_pct: "The Life Plan courtesy is twenty-five percent for a guest holding an occupied Larkspur Entrance Fee Agreement on a lifecare plan, ten percent for one on a fee-for-service plan, and nothing otherwise."
      last_pay_method: "The bank return-item charge follows the instrument of the stay's latest payment"
      item_charge: "The bank return-item charge follows the instrument of the stay's latest payment: twelve dollars for a one-time ACH debit, twenty dollars for a credit or debit card, and nothing for any other instrument."
      handling_gap: "when the return was posted seven or fewer days before the planned arrival date"
      handling: "The pre-arrival handling charge is ten dollars when the return was posted seven or fewer days before the planned arrival date, five dollars when it was posted eight to fourteen days before, and nothing otherwise."
      result: "The returned-payment fee is the statutory service charge reduced first by the resident first-return courtesy and then, on that result, by the Life Plan courtesy, plus the bank return-item charge and the pre-arrival handling charge, rounded half up to the cent once, on the final total."
    factors:
      - id: statutory_service_charge
        effect: method
        decides: statutory_fee
        bindings: [ret_posted, ret_amount, statutory_fee]
        ladder:
          - when: "the stay is at Larkspur at Harbor View (Florida)"
            method: "tiered by the returned amount: 25 dollars up to 50, 30 dollars up to 300, above that the greater of 40 dollars and 5 percent of the returned amount"
          - when: "the stay is at Larkspur at Willow Creek (Texas)"
            method: "a flat 30 dollars"
          - when: "the stay is at Larkspur at Brookfield (North Carolina)"
            method: "a flat 25 dollars"
          - when: "otherwise"
            method: "the returned payment fee of the stay type"
        baseline:
          statutory_fee: "P('returned_payment_fee')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: resident_first_return_courtesy
        effect: parameter
        decides: courtesy_pct
        bindings: [il_active, il_returns, courtesy_pct]
        ladder:
          - when: "an active Larkspur independent living residency AND no returned payment on that account in the last twelve months"
            value: "K('first_return_courtesy') = 50 percent"
          - when: "an active Larkspur independent living residency AND exactly one returned payment on that account in the last twelve months"
            value: "K('second_return_courtesy') = 25 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          courtesy_pct: "0"
        evidence: [cross_category, history]
        cross_difficulty: independent
      - id: life_plan_return_courtesy
        effect: parameter
        decides: lp_courtesy_pct
        bindings: [plan_occupied, plan_contract, lp_courtesy_pct]
        ladder:
          - when: "an occupied Larkspur Entrance Fee Agreement AND a lifecare plan"
            value: "K('lifecare_courtesy') = 25 percent"
          - when: "an occupied Larkspur Entrance Fee Agreement AND a fee-for-service plan"
            value: "K('ffs_courtesy') = 10 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          lp_courtesy_pct: "0"
        evidence: [cross_category]
        cross_difficulty: entrance
      - id: bank_return_item_charge
        effect: parameter
        decides: item_charge
        bindings: [last_pay_method, item_charge]
        ladder:
          - when: "the stay's latest payment is a one-time ACH debit"
            value: "K('ach_item_charge') = 12 dollars"
          - when: "the stay's latest payment is a credit or debit card payment"
            value: "K('card_item_charge') = 20 dollars"
          - when: "otherwise"
            value: "0 dollars"
        baseline:
          item_charge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: pre_arrival_handling
        effect: parameter
        decides: handling
        bindings: [handling_gap, handling]
        ladder:
          - when: "the return was posted seven or fewer days before the planned arrival date"
            value: "K('handling_near') = 10 dollars"
          - when: "the return was posted eight to fourteen days before the planned arrival date"
            value: "K('handling_mid') = 5 dollars"
          - when: "otherwise"
            value: "0 dollars"
        baseline:
          handling: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        Every payment returned unpaid on a respite or trial stay carries one returned-payment fee, posted as an add-on on that stay and referencing the returned-payment entry.
        In the standard method the returned-payment fee is the returned payment fee of the stay type, with no courtesy and no further charge.
      params: [returned_payment_fee]
    inputs:
      history:
        - {table: respite_ledger, aggregate: latest, field: posting_date, filters: {event_type: respite_payment_return}}
        - {table: respite_ledger, aggregate: sum, field: amount, filters: {event_type: respite_payment_return}}
        - {category: independent, table: independent_ledger, aggregate: count, field: independent_entry_id, within_months: 12, filters: {event_type: independent_payment_return}}
      cross_category: [independent, entrance]

  - id: respite_ext_medication_setup
    base_policy_refs: [respite_addons]
    overwrite:
      - base_policy: respite_addons
        superseded_clause: >-
          medication_setup_fee once per stay where medication_administration_included is true
        replaced_by: >-
          The medication setup charge is the packaging charge reduced in turn by the Life Plan care discount on medication setup, the resident pharmacy-profile reduction and the early-booking reduction, each acting on the result of the one before, plus the rush packaging charge, rounded half up to the cent once, on the final total.
    trigger: state_due
    subject: [respite_addon_charge]
    computes: setup_amount
    target_tool: post_medication_setup_fee_0971281c
    params:
      cycle_nights: 14
      cycle_fee: 60
      long_stay_nights: 21
      short_stay_nights: 7
      short_stay_fee: 55
      profile_long: 20
      profile_short: 10
      profile_months: 24
      early_long_days: 21
      early_mid_days: 14
      early_long: 10
      early_mid: 5
      rush_near_days: 5
      rush_mid_days: 10
      rush_near: 30
      rush_mid: 15
    rule: >-
      A stay whose type includes medication administration carries one medication setup charge for pharmacy packaging and the medication administration record, posted as an add-on on the stay once the physician's report for the stay is on file.
      The medication setup charge is the packaging charge reduced in turn by the Life Plan care discount on medication setup, the resident pharmacy-profile reduction and the early-booking reduction, each acting on the result of the one before, plus the rush packaging charge, rounded half up to the cent once, on the final total.
      In the standard method the medication setup charge is the medication setup fee of the stay type, charged once.
      The packaging charge is worked out by one of three methods: for a stay of twenty-one or more planned nights the medication is packed in fourteen-night cycles and each started cycle is charged sixty dollars; for a stay of seven or fewer planned nights a single short pack is charged fifty-five dollars; for any other stay the medication setup fee of the stay type is charged once.
      The planned nights are the planned departure date less the planned arrival date.
      The Life Plan care discount on medication setup is the care fee discount of the guest's plan, taken as a percentage, for a guest holding an occupied Larkspur Entrance Fee Agreement on a lifecare plan or on a fee-for-service plan, and nothing otherwise.
      The resident pharmacy-profile reduction is twenty percent for a guest whose active Larkspur independent living residency began at least twenty-four whole months before the current date, ten percent for a guest whose active residency began fewer than twenty-four whole months before, and nothing for any other guest.
      The early-booking reduction is ten percent when the stay was booked twenty-one or more days before its planned arrival date, five percent when it was booked fourteen to twenty days before, and nothing otherwise.
      The rush packaging charge is thirty dollars when the physician's report on file is dated five or fewer days before the planned arrival date, fifteen dollars when it is dated six to ten days before, and nothing otherwise.
    prerequisite: []
    cross_category:
      - category: entrance
        as: branch
        reads: [status, contract_type, care_fee_discount_pct]
        note: The Life Plan care discount on medication setup reads the occupied agreement and its plan.
      - category: independent
        as: branch
        reads: [status, move_in_date]
        note: The resident pharmacy-profile reduction reads the active residency's move-in date.
    compute:
      - planned_nights: "DAYS(F('planned_arrival_date'), F('planned_departure_date'))"
      - packaging: "(-(-planned_nights // K('cycle_nights'))) * K('cycle_fee') if planned_nights >= K('long_stay_nights') else (K('short_stay_fee') if planned_nights <= K('short_stay_nights') else P('medication_setup_fee'))"
      - plan_occupied: "EXISTS('entrance', status='occupied')"
      - plan_contract: "CPARAM('entrance', 'contract_type', status='occupied')"
      - lp_discount_pct: "CPARAM('entrance', 'care_fee_discount_pct', status='occupied') if (plan_occupied and plan_contract == 'lifecare') else (CPARAM('entrance', 'care_fee_discount_pct', status='occupied') if (plan_occupied and plan_contract == 'fee_for_service') else 0)"
      - il_active: "CFIELD('independent', 'status', status='active') == 'active'"
      - il_months: "MONTHS(CFIELD('independent', 'move_in_date', status='active'), NOW) if il_active else 0"
      - profile_pct: "K('profile_long') if (il_active and il_months >= K('profile_months')) else (K('profile_short') if (il_active and il_months < K('profile_months')) else 0)"
      - booking_lead: "DAYS(F('booking_date'), F('planned_arrival_date'))"
      - early_pct: "K('early_long') if booking_lead >= K('early_long_days') else (K('early_mid') if booking_lead >= K('early_mid_days') else 0)"
      - report_lead: "DAYS(F('health_documents_date'), F('planned_arrival_date'))"
      - rush: "K('rush_near') if report_lead <= K('rush_near_days') else (K('rush_mid') if report_lead <= K('rush_mid_days') else 0)"
      - result: "RND(packaging * (1 - lp_discount_pct / 100) * (1 - profile_pct / 100) * (1 - early_pct / 100) + rush, 2)"
    compute_basis:
      planned_nights: "The planned nights are the planned departure date less the planned arrival date."
      packaging: "The packaging charge is worked out by one of three methods: for a stay of twenty-one or more planned nights the medication is packed in fourteen-night cycles and each started cycle is charged sixty dollars; for a stay of seven or fewer planned nights a single short pack is charged fifty-five dollars; for any other stay the medication setup fee of the stay type is charged once."
      plan_occupied: "for a guest holding an occupied Larkspur Entrance Fee Agreement on a lifecare plan or on a fee-for-service plan, and nothing otherwise."
      plan_contract: "on a lifecare plan or on a fee-for-service plan"
      lp_discount_pct: "The Life Plan care discount on medication setup is the care fee discount of the guest's plan, taken as a percentage, for a guest holding an occupied Larkspur Entrance Fee Agreement on a lifecare plan or on a fee-for-service plan, and nothing otherwise."
      il_active: "for a guest whose active Larkspur independent living residency began at least twenty-four whole months before the current date"
      il_months: "began at least twenty-four whole months before the current date"
      profile_pct: "The resident pharmacy-profile reduction is twenty percent for a guest whose active Larkspur independent living residency began at least twenty-four whole months before the current date, ten percent for a guest whose active residency began fewer than twenty-four whole months before, and nothing for any other guest."
      booking_lead: "when the stay was booked twenty-one or more days before its planned arrival date"
      early_pct: "The early-booking reduction is ten percent when the stay was booked twenty-one or more days before its planned arrival date, five percent when it was booked fourteen to twenty days before, and nothing otherwise."
      report_lead: "when the physician's report on file is dated five or fewer days before the planned arrival date"
      rush: "The rush packaging charge is thirty dollars when the physician's report on file is dated five or fewer days before the planned arrival date, fifteen dollars when it is dated six to ten days before, and nothing otherwise."
      result: "The medication setup charge is the packaging charge reduced in turn by the Life Plan care discount on medication setup, the resident pharmacy-profile reduction and the early-booking reduction, each acting on the result of the one before, plus the rush packaging charge, rounded half up to the cent once, on the final total."
    factors:
      - id: packaging_method
        effect: method
        decides: packaging
        bindings: [planned_nights, packaging]
        ladder:
          - when: "twenty-one or more planned nights"
            method: "fourteen-night packaging cycles, each started cycle charged K('cycle_fee') = 60 dollars"
          - when: "seven or fewer planned nights"
            method: "one short pack charged K('short_stay_fee') = 55 dollars"
          - when: "otherwise"
            method: "the medication setup fee of the stay type, once"
        baseline:
          packaging: "P('medication_setup_fee')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: life_plan_setup_discount
        effect: parameter
        decides: lp_discount_pct
        bindings: [plan_occupied, plan_contract, lp_discount_pct]
        ladder:
          - when: "an occupied Larkspur Entrance Fee Agreement AND a lifecare plan"
            value: "the plan's care fee discount (100 percent on the LifeCare plans)"
          - when: "an occupied Larkspur Entrance Fee Agreement AND a fee-for-service plan"
            value: "the plan's care fee discount (10 percent on the LifeChoice plans)"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          lp_discount_pct: "0"
        evidence: [cross_category]
        cross_difficulty: entrance
      - id: pharmacy_profile_reduction
        effect: parameter
        decides: profile_pct
        bindings: [il_active, il_months, profile_pct]
        ladder:
          - when: "an active Larkspur independent living residency AND it began at least twenty-four whole months ago"
            value: "K('profile_long') = 20 percent"
          - when: "an active Larkspur independent living residency AND it began fewer than twenty-four whole months ago"
            value: "K('profile_short') = 10 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          profile_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: independent
      - id: early_booking_reduction
        effect: parameter
        decides: early_pct
        bindings: [booking_lead, early_pct]
        ladder:
          - when: "booked twenty-one or more days before the planned arrival date"
            value: "K('early_long') = 10 percent"
          - when: "booked fourteen to twenty days before"
            value: "K('early_mid') = 5 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          early_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: rush_packaging
        effect: parameter
        decides: rush
        bindings: [report_lead, rush]
        ladder:
          - when: "the physician's report is dated five or fewer days before the planned arrival date"
            value: "K('rush_near') = 30 dollars"
          - when: "it is dated six to ten days before"
            value: "K('rush_mid') = 15 dollars"
          - when: "otherwise"
            value: "0 dollars"
        baseline:
          rush: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        A stay whose type includes medication administration carries one medication setup charge for pharmacy packaging and the medication administration record, posted as an add-on on the stay once the physician's report for the stay is on file.
        In the standard method the medication setup charge is the medication setup fee of the stay type, charged once.
      params: [medication_setup_fee]
    inputs:
      history: []
      cross_category: [entrance, independent]

  - id: respite_ext_advance_payment
    base_policy_refs: [respite_prepayment_and_check_in, respite_payments_and_refunds]
    overwrite:
      - base_policy: respite_prepayment_and_check_in
        superseded_clause: >-
          The charge for the minimum stay - minimum_stay_nights times nightly_rate_locked - must be paid in advance, and the rest of the stay balance is paid by the final balance due date.
        replaced_by: >-
          The advance is the advance-nights charge plus every add-on and fee posted on the stay, less the receipts counted toward the advance, never less than zero, rounded half up to the cent once, on the final total.
    trigger: on_request
    subject: [respite_payment]
    computes: amount
    target_tool: pay_stay_advance_b4214d09
    params:
      extra_nights: 3
      lifecare_relief: 25
      ffs_relief: 10
      deferral_long: 10
      deferral_short: 5
      deferral_months: 36
      early_long_days: 21
      early_mid_days: 14
      early_long: 5
      early_mid: 2
      standing_clear: 3
      standing_returned: 1
    rule: >-
      Before a booked stay begins, the guest or a financial representative pays the advance on the stay in one payment.
      The advance is the advance-nights charge plus every add-on and fee posted on the stay, less the receipts counted toward the advance, never less than zero, rounded half up to the cent once, on the final total.
      The advance is fixed only after the stay's records carry a returned-payment fee for every returned payment on the stay.
      The advance is not worked out until the stay carries its medication setup charge whenever the stay type includes medication administration and the physician's report is on file.
      In the standard method the advance nights are the minimum stay of the stay type, the advance-nights charge is the advance nights times the nightly rate locked at booking, and the receipts counted are the payments posted on the stay less the returned payments.
      The advance-nights charge is the advance nights times the nightly rate locked at booking, reduced in turn by the Life Plan advance relief, the residency deferral, the early-booking relief and the account-standing relief, each acting on the result of the one before.
      The advance nights are all planned nights when the stay shows a returned payment and its planned nights exceed the minimum stay; the minimum stay plus three nights when the stay shows no returned payment and the guest's Larkspur independent living account shows a returned payment posted in the last twelve months; and the minimum stay of the stay type otherwise.
      The receipts counted toward the advance are chosen by one of three methods: when the stay shows a returned payment, only payments by debit card, credit card, certified check or insurer transfer are counted; when the stay shows no returned payment and the guest's independent living account shows one in the last twelve months, the payments less the returned payments are counted without personal checks; otherwise the payments less the returned payments are counted.
      The Life Plan advance relief is the rent discount of the guest's plan, taken as a percentage, for a guest holding an occupied Larkspur Entrance Fee Agreement on a lifecare plan or on a fee-for-service plan, and nothing otherwise.
      The residency deferral is ten percent for a guest whose active Larkspur independent living residency began at least thirty-six whole months before the current date, five percent for a guest whose active residency began fewer than thirty-six whole months before, and nothing for any other guest; the deferred part is paid with the final balance.
      The early-booking relief is five percent when the stay was booked twenty-one or more days before its planned arrival date, two percent when it was booked fourteen to twenty days before, and nothing otherwise.
      The account-standing relief is three percent when the guest's active Larkspur independent living account shows a zero or credit balance and no returned payment in the last twelve months, one percent when it shows a zero or credit balance and at least one returned payment in the last twelve months, and nothing otherwise.
    prerequisite:
      - problem: respite_ext_returned_payment_fee
        kind: value_input
        gate: fees_returned
        form: state
        policy_source: >-
          The advance is fixed only after the stay's records carry a returned-payment fee for every returned payment on the stay.
        condition: >-
          For every respite_payment_return entry on the stay the ledger carries a respite_addon_charge with addon code returned_payment referencing it.
        resolved_by: post_returned_payment_fee_57d4cb7a
        effect: >-
          fees_returned rises by the returned-payment fee, which the advance collects.
      - problem: respite_ext_medication_setup
        kind: value_input
        gate: fees_setup
        form: state
        policy_source: >-
          The advance is not worked out until the stay carries its medication setup charge whenever the stay type includes medication administration and the physician's report is on file.
        condition: >-
          The ledger carries a respite_addon_charge with addon code medication_setup on the stay, the stay type including medication administration and a health documents date being on file.
        resolved_by: post_medication_setup_fee_0971281c
        effect: >-
          fees_setup rises by the medication setup charge, which the advance collects.
    cross_category:
      - category: independent
        as: history
        reads: [status, move_in_date, account_balance, independent_ledger.event_type, independent_ledger.posting_date]
        note: The advance nights, the receipts method, the residency deferral and the account-standing relief read the active residency and its returned payments in the last twelve months.
      - category: entrance
        as: branch
        reads: [status, contract_type, rent_discount_pct]
        note: The Life Plan advance relief reads the occupied agreement's plan and rent discount.
    compute:
      - planned_nights: "DAYS(F('planned_arrival_date'), F('planned_departure_date'))"
      - returns_on_stay: "COUNT('respite_ledger', event_type='respite_payment_return')"
      - il_returns: "XCOUNT('independent', 'independent_ledger', within_months=12, date_field='posting_date', event_type='independent_payment_return')"
      - advance_nights: "planned_nights if (returns_on_stay > 0 and planned_nights > P('minimum_stay_nights')) else ((P('minimum_stay_nights') + K('extra_nights')) if (returns_on_stay == 0 and il_returns > 0) else P('minimum_stay_nights'))"
      - paid_all: "SUM('respite_ledger', 'amount', event_type='respite_payment')"
      - returned_all: "SUM('respite_ledger', 'amount', event_type='respite_payment_return')"
      - paid_good: "SUM('respite_ledger', 'amount', event_type='respite_payment', payment_method='debit_card') + SUM('respite_ledger', 'amount', event_type='respite_payment', payment_method='credit_card') + SUM('respite_ledger', 'amount', event_type='respite_payment', payment_method='certified_check') + SUM('respite_ledger', 'amount', event_type='respite_payment', payment_method='insurer_eft')"
      - paid_checks: "SUM('respite_ledger', 'amount', event_type='respite_payment', payment_method='check')"
      - receipts: "paid_good if returns_on_stay > 0 else ((paid_all - returned_all - paid_checks) if il_returns > 0 else (paid_all - returned_all))"
      - plan_occupied: "EXISTS('entrance', status='occupied')"
      - plan_contract: "CPARAM('entrance', 'contract_type', status='occupied')"
      - relief_pct: "CPARAM('entrance', 'rent_discount_pct', status='occupied') if (plan_occupied and plan_contract == 'lifecare') else (CPARAM('entrance', 'rent_discount_pct', status='occupied') if (plan_occupied and plan_contract == 'fee_for_service') else 0)"
      - il_active: "CFIELD('independent', 'status', status='active') == 'active'"
      - il_months: "MONTHS(CFIELD('independent', 'move_in_date', status='active'), NOW) if il_active else 0"
      - deferral_pct: "K('deferral_long') if (il_active and il_months >= K('deferral_months')) else (K('deferral_short') if (il_active and il_months < K('deferral_months')) else 0)"
      - booking_lead: "DAYS(F('booking_date'), F('planned_arrival_date'))"
      - early_pct: "K('early_long') if booking_lead >= K('early_long_days') else (K('early_mid') if booking_lead >= K('early_mid_days') else 0)"
      - il_balance: "CFIELD('independent', 'account_balance', status='active')"
      - standing_pct: "K('standing_clear') if (il_active and il_balance <= 0 and il_returns == 0) else (K('standing_returned') if (il_active and il_balance <= 0 and il_returns > 0) else 0)"
      - fees_returned: "SUM('respite_ledger', 'amount', event_type='respite_addon_charge', addon_code='returned_payment')"
      - fees_setup: "SUM('respite_ledger', 'amount', event_type='respite_addon_charge', addon_code='medication_setup')"
      - fees_other: "SUM('respite_ledger', 'amount', event_type='respite_addon_charge') - fees_returned - fees_setup + SUM('respite_ledger', 'amount', event_type='respite_cancellation_fee')"
      - nights_charge: "advance_nights * F('nightly_rate_locked') * (1 - relief_pct / 100) * (1 - deferral_pct / 100) * (1 - early_pct / 100) * (1 - standing_pct / 100)"
      - result: "RND(MX(nights_charge + fees_returned + fees_setup + fees_other - receipts, 0), 2)"
    compute_basis:
      planned_nights: "its planned nights exceed the minimum stay"
      returns_on_stay: "when the stay shows a returned payment and its planned nights exceed the minimum stay"
      il_returns: "the guest's Larkspur independent living account shows a returned payment posted in the last twelve months"
      advance_nights: "The advance nights are all planned nights when the stay shows a returned payment and its planned nights exceed the minimum stay; the minimum stay plus three nights when the stay shows no returned payment and the guest's Larkspur independent living account shows a returned payment posted in the last twelve months; and the minimum stay of the stay type otherwise."
      paid_all: "the payments less the returned payments are counted"
      returned_all: "the payments less the returned payments are counted"
      paid_good: "only payments by debit card, credit card, certified check or insurer transfer are counted"
      paid_checks: "the payments less the returned payments are counted without personal checks"
      receipts: "The receipts counted toward the advance are chosen by one of three methods: when the stay shows a returned payment, only payments by debit card, credit card, certified check or insurer transfer are counted; when the stay shows no returned payment and the guest's independent living account shows one in the last twelve months, the payments less the returned payments are counted without personal checks; otherwise the payments less the returned payments are counted."
      plan_occupied: "for a guest holding an occupied Larkspur Entrance Fee Agreement on a lifecare plan or on a fee-for-service plan, and nothing otherwise."
      plan_contract: "on a lifecare plan or on a fee-for-service plan"
      relief_pct: "The Life Plan advance relief is the rent discount of the guest's plan, taken as a percentage, for a guest holding an occupied Larkspur Entrance Fee Agreement on a lifecare plan or on a fee-for-service plan, and nothing otherwise."
      il_active: "for a guest whose active Larkspur independent living residency began at least thirty-six whole months before the current date"
      il_months: "began at least thirty-six whole months before the current date"
      deferral_pct: "The residency deferral is ten percent for a guest whose active Larkspur independent living residency began at least thirty-six whole months before the current date, five percent for a guest whose active residency began fewer than thirty-six whole months before, and nothing for any other guest; the deferred part is paid with the final balance."
      booking_lead: "when the stay was booked twenty-one or more days before its planned arrival date"
      early_pct: "The early-booking relief is five percent when the stay was booked twenty-one or more days before its planned arrival date, two percent when it was booked fourteen to twenty days before, and nothing otherwise."
      il_balance: "when the guest's active Larkspur independent living account shows a zero or credit balance"
      standing_pct: "The account-standing relief is three percent when the guest's active Larkspur independent living account shows a zero or credit balance and no returned payment in the last twelve months, one percent when it shows a zero or credit balance and at least one returned payment in the last twelve months, and nothing otherwise."
      fees_returned: "The advance is the advance-nights charge plus every add-on and fee posted on the stay"
      fees_setup: "The advance is the advance-nights charge plus every add-on and fee posted on the stay"
      fees_other: "The advance is the advance-nights charge plus every add-on and fee posted on the stay"
      nights_charge: "The advance-nights charge is the advance nights times the nightly rate locked at booking, reduced in turn by the Life Plan advance relief, the residency deferral, the early-booking relief and the account-standing relief, each acting on the result of the one before."
      result: "The advance is the advance-nights charge plus every add-on and fee posted on the stay, less the receipts counted toward the advance, never less than zero, rounded half up to the cent once, on the final total."
    factors:
      - id: advance_nights
        effect: parameter
        decides: advance_nights
        bindings: [planned_nights, returns_on_stay, il_returns, advance_nights]
        ladder:
          - when: "the stay shows a returned payment AND its planned nights exceed the minimum stay"
            value: "all planned nights"
          - when: "the stay shows no returned payment AND the guest's independent living account shows a returned payment in the last twelve months"
            value: "P('minimum_stay_nights') + K('extra_nights') = the minimum stay plus three nights"
          - when: "otherwise"
            value: "P('minimum_stay_nights') = the minimum stay"
        baseline:
          advance_nights: "P('minimum_stay_nights')"
        evidence: [history, cross_category]
        cross_difficulty: independent
      - id: receipts_counted
        effect: method
        decides: receipts
        bindings: [paid_all, returned_all, paid_good, paid_checks, receipts]
        ladder:
          - when: "the stay shows a returned payment"
            method: "count only payments by debit card, credit card, certified check or insurer transfer"
          - when: "the stay shows no returned payment AND the independent living account shows one in the last twelve months"
            method: "count payments less returned payments, leaving out personal checks"
          - when: "otherwise"
            method: "count payments less returned payments"
        baseline:
          receipts: "paid_all - returned_all"
        evidence: [history]
        cross_difficulty: null
      - id: life_plan_advance_relief
        effect: parameter
        decides: relief_pct
        bindings: [plan_occupied, plan_contract, relief_pct]
        ladder:
          - when: "an occupied Larkspur Entrance Fee Agreement AND a lifecare plan"
            value: "the plan's rent discount (25 percent on the LifeCare plans)"
          - when: "an occupied Larkspur Entrance Fee Agreement AND a fee-for-service plan"
            value: "the plan's rent discount (10 percent on the LifeChoice plans)"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          relief_pct: "0"
        evidence: [cross_category]
        cross_difficulty: entrance
      - id: residency_deferral
        effect: parameter
        decides: deferral_pct
        bindings: [il_active, il_months, deferral_pct]
        ladder:
          - when: "an active Larkspur independent living residency AND it began at least thirty-six whole months ago"
            value: "K('deferral_long') = 10 percent"
          - when: "an active Larkspur independent living residency AND it began fewer than thirty-six whole months ago"
            value: "K('deferral_short') = 5 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          deferral_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: independent
      - id: early_booking_relief
        effect: parameter
        decides: early_pct
        bindings: [booking_lead, early_pct]
        ladder:
          - when: "booked twenty-one or more days before the planned arrival date"
            value: "K('early_long') = 5 percent"
          - when: "booked fourteen to twenty days before"
            value: "K('early_mid') = 2 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          early_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: account_standing_relief
        effect: parameter
        decides: standing_pct
        bindings: [il_balance, standing_pct]
        ladder:
          - when: "the active independent living account shows a zero or credit balance AND no returned payment in the last twelve months"
            value: "K('standing_clear') = 3 percent"
          - when: "the active independent living account shows a zero or credit balance AND at least one returned payment in the last twelve months"
            value: "K('standing_returned') = 1 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          standing_pct: "0"
        evidence: [cross_category, history]
        cross_difficulty: independent
    baseline:
      rule: >-
