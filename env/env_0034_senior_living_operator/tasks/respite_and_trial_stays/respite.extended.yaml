        baseline:
          review_window: "K('window_default')"
        evidence: [cross_category, date]
        cross_difficulty: independent
      - id: band_tolerance
        effect: parameter
        decides: band_tolerance
        bindings: [plan_occupied, plan_contract, band_tolerance]
        ladder:
