name: env_0035_personal_auto_insurance_carrier
company: Cardinal Mutual Insurance Company

background: |
  Cardinal Mutual Insurance Company is a policyholder-owned personal auto insurer headquartered in Columbus, Ohio, that
  insures about 412,000 households in Ohio, Indiana, Kentucky, Virginia and West Virginia through its own phone, web
  and app service channels. Its policy service and claims desk speaks in a plain, patient Midwestern voice and handles
  everything from a teenager's first license to a stolen pickup. Every household's coverage starts from a Cardinal
  Personal Auto Policy written on one of six coverage packages: Cardinal Auto Essential, Cardinal Auto Basic, Cardinal
  Auto Standard, Cardinal Auto Plus, Cardinal Auto Preferred and Cardinal Auto Premier. A policy lives through terms,
  and every change to its vehicles, drivers, garaging, lienholders or optional coverages is written as an endorsement
  that leaves additional or return premium behind it. Each policy is billed through a Cardinal Billing Account on one of
  six pay plans: the Cardinal Direct Bill Monthly Plan, Cardinal Card Autopay Monthly Plan, Cardinal EFT Autopay Monthly
  Plan, Cardinal Three-Pay Plan, Cardinal Two-Pay Plan and Cardinal Paid-in-Full Plan, whose ledger records invoices,
  fees, payments, returned payments, credits, refunds and notices of cancellation. Vehicles may carry Cardinal Physical
  Damage Coverage at one of six deductible options: Cardinal Physical Damage $2,000 Deductible, Cardinal Physical
  Damage $1,000 Deductible, Cardinal Physical Damage $750 Deductible, Cardinal Physical Damage $500 Deductible, Cardinal
  Physical Damage $250 Deductible or Cardinal Physical Damage $100 Deductible; claims on them build a file of loss
  reports, coverage decisions, estimates, valuations, payments and recoveries. On top of physical damage a vehicle may
  carry Cardinal Rental Reimbursement as Cardinal Rental Reimbursement 30/900, Cardinal Rental Reimbursement 40/1200,
  Cardinal Rental Reimbursement 50/1500, Cardinal Rental Reimbursement 60/1800, Cardinal Rental Reimbursement 75/2250
  or Cardinal Rental Reimbursement 100/3000, whose rentals are authorized, extended, invoiced and reimbursed on the
  claim. Cardinal Roadside Assistance is sold per vehicle as Cardinal Roadside Basic, Cardinal Roadside Standard,
  Cardinal Roadside Plus, Cardinal Roadside Plus with Trip Interruption, Cardinal Roadside Premier or Cardinal Roadside
  Premier RV & Trailer, each holding an allowance of covered service calls that dispatches draw down. Vehicles can also
  be enrolled in Cardinal DriveSense as Cardinal DriveSense Mobile, Cardinal DriveSense Plug-In, Cardinal DriveSense
  Connected Car, Cardinal DriveSense Teen Coach, Cardinal DriveSense Miles Mobile or Cardinal DriveSense Miles Plug-In,
  which post monthly driving scores or per-mile charges.
  Cardinal Financial Responsibility Filing: the Cardinal SR-22 Owner Certificate, Cardinal SR-22 Owner-Operator
  Certificate, Cardinal Out-of-State SR-22 Owner Certificate, Cardinal Out-of-State SR-22 Owner-Operator Certificate,
  Cardinal FR-44 Owner Certificate or Cardinal FR-44 Owner-Operator Certificate, each tracked through its
  transmissions to the state. The typical caller is a named insured holding one policy with two or three vehicles,
  financed newer cars carrying physical damage and often rental reimbursement, and an older car on liability alone.
  They call after buying or trading a car, when a teenager is licensed or a relative moves in, when they move house,
  when an installment was missed or a payment bounced and a notice arrived, after a collision, hail storm, deer strike
  or theft, when a car is declared a total loss with a loan still on it, and when a court or the state requires them
  to carry an SR-22 or FR-44. Most bring years of history with them: earlier endorsements and renewals, installments
  paid on time or late, a returned payment or two, prior claims and rentals, and driving records with violations and
  accidents.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: policy_endorsements_and_renewals
    claim:
      categories: [auto]
      event_types: [auto_vehicle_add, auto_vehicle_replace, auto_vehicle_remove, auto_driver_add, auto_driver_exclude, auto_driver_remove, auto_garaging_change, auto_lienholder_change, auto_rideshare_change, auto_coverage_change, auto_package_endorsement, auto_package_change, auto_additional_premium, auto_return_premium, auto_renewal_offer, auto_renew, auto_late_renewal, auto_insured_cancel, auto_flat_cancel]
    summary: >
      Named insureds call to change their personal auto policy in the middle of a term or at renewal: adding a car they
      just bought or replacing a traded one, removing a sold vehicle, adding a newly licensed teen or a relative who moved
      in, excluding a household member they do not want rated, moving to a new address, recording or releasing a
      lienholder, adding the rideshare endorsement or an optional vehicle coverage, changing package, accepting a renewal
      offer late, or cancelling. The setting varies with the package held (each package carries its own limits, discounts,
      surcharges, eligibility gates, vehicle and driver caps, endorsement fee and cancellation terms), the policy status,
      the household's other Cardinal policies (the multi-car count under auto_agg_household_vehicle_count spans them),
      the drivers' violation and accident history inside the lookback, the vehicle's acquisition date against the
      newly acquired vehicle window, and whether a financial-responsibility filing or a signed request is on file. Every
      change is decided under auto_vehicle_changes, auto_driver_changes, auto_underwriting_eligibility,
      auto_package_change_rules, auto_rideshare_endorsement, auto_combo_financial_responsibility, auto_renewal or
      auto_insured_cancellation, and its premium follows auto_evt_premium_rating and auto_evt_midterm_proration with the
      fee of auto_evt_endorsement_fee; in the natural course of a policy a change is rated, written as an endorsement,
      and its additional or return premium then flows to billing. The agent locates, verifies and reads the records and
      writes the endorsements, premium entries, package changes, renewals and request intakes itself, while signing a
      cancellation request or a named driver exclusion form is something only the named insured can do and is handed to
      the customer. A request outside these rules, such as insuring a vehicle garaged in a state Cardinal does not write,
      covering delivery driving for a food platform, backdating a change beyond what the charter allows, or reinstating
      a policy the customer cancelled, has no policy that can decide it and calls for a POLICY_NOT_COVERED handoff.

  - name: billing_and_nonpayment_cancellation
    claim:
      categories: [billing]
      event_types: [billing_installment_billed, billing_fee_charged, billing_fee_waived, billing_payment_received, billing_payment_returned, billing_endorsement_charge, billing_credit_applied, billing_refund_issued, billing_writeoff, billing_notice_of_cancellation, billing_rescind, billing_reinstate, billing_plan_change, billing_payment_setup_update]
    summary: >
      Policyholders call the desk about money: a bill that looks higher after an endorsement, a late fee they want
      waived, a payment that bounced, a notice of cancellation that arrived in the mail, a policy that was cancelled for
      nonpayment and that they want back, a credit they expect refunded or moved to another policy, or a wish to change
      pay plan, payment method, autopay or due day. The setting varies with the pay plan held (down payment, installment
      interval and fee, late fee and grace days, notice timing, reinstatement window, lapse rules and fee all differ by
      plan), the account status, the policy state that sets the notice period, the account's history of late fees,
      courtesy waivers, returned payments and reinstatements, and whether the policy carries a financial-responsibility
      filing that restricts the plan. The governing rules are billing_evt_installment_schedule,
      billing_evt_late_fee, billing_evt_returned_payment, billing_nonpayment_cancellation, billing_reinstatement,
      billing_evt_payment_application, billing_refunds_and_writeoffs, billing_plan_and_method_changes and
      billing_agg_cross_account_payments; in the natural order of the domain an installment is invoiced, falls past due,
      draws a late fee and then a notice, and the notice is either cured, or turns into a cancellation that can be
      reinstated within its window. The agent reads the ledger and posts fees, waivers, credits, refunds, notices,
      rescissions, reinstatements and plan or method changes, while authorizing a payment from the customer's own card
      or bank account and signing the statement of no loss for a reinstatement with a lapse belong to the customer and
      are handed over. Requests no rule decides, such as forgiving earned premium, reinstating after the window or a
      second time beyond the plan's cap, accepting a card on a certified-funds restriction, or moving a due date beyond
      what the plan allows, have no deciding policy and call for a POLICY_NOT_COVERED handoff.

  - name: physical_damage_claims_and_total_loss
    claim:
      categories: [physdmg]
      event_types: [physdmg_claim_report, physdmg_coverage_decision, physdmg_fault_determination, physdmg_estimate_written, physdmg_total_loss_declared, physdmg_storage_notice, physdmg_claim_closed, physdmg_claim_reopened, physdmg_claim_payment, physdmg_payment_void, physdmg_recovery_received, physdmg_deductible_credit_used, physdmg_coverage_remove, physdmg_deductible_change]
    summary: >
      Customers call the claims desk after a collision, a hit-and-run, a deer strike, hail, vandalism, a cracked
      windshield or a theft, or later to ask about an estimate, a supplement, their deductible, a check made out jointly
      to their lender, a reimbursement of their deductible from the other driver's insurer, or a total-loss settlement on
      a car that still has a loan or lease on it. The setting varies with the deductible option held on the damaged
      vehicle (deductibles, glass terms, the collision deductible waiver, Deductible Rewards, custom equipment and other
      entitlements differ by option), the coverage status on the loss date, the auto package that may add new car
      replacement, the garaging state that sets the total-loss threshold, sales tax and title fee, the fault finding and
      the other party's insurance, other vehicles damaged in the same occurrence, the loan/lease payoff option, and the
      vehicle's prior claims and Deductible Rewards history. The governing rules are physdmg_claim_coverage,
      physdmg_evt_deductible, physdmg_agg_occurrence_deductible, physdmg_evt_repair_payment, physdmg_total_loss,
      physdmg_evt_recovery_and_reimbursement, physdmg_deductible_rewards, physdmg_newly_acquired_vehicle and
      physdmg_evt_transportation_expense; in the natural course of a claim the loss is reported, coverage is decided,
      fault is found, estimates are written, the vehicle is repaired or declared a total loss, payments are issued, and
      recoveries follow. The agent reports losses and writes decisions, estimates, valuations, payments, recoveries and
      closings, while accepting a total-loss settlement offer and choosing to keep the salvage are the customer's own
      decisions, handed to the customer. Disputes of actual cash value that go to appraisal, losses reported after the
      late-report limit, first-party diminished value, and liability claims of other people are not decided by any rule
      the desk holds and call for a POLICY_NOT_COVERED handoff.

  - name: rental_reimbursement_claims
    claim:
      categories: [rental]
      event_types: [rental_coverage_add, rental_option_change, rental_authorization, rental_extension, rental_authorization_closed, rental_liability_transfer, rental_vendor_payment, rental_reimbursement_payment, rental_payment_recovery]
    summary: >
      Customers whose car is in the shop or was stolen or totaled call to get a rental, to extend one because parts are
      delayed, to ask why they were billed by the rental agency, to be reimbursed for a rental or rideshare fares they
      paid themselves, or to add or raise their rental option before or after a loss. The setting varies with the rental
      option held on the damaged vehicle (daily limit, per-loss maximum, direct-bill car class, theft waiting days,
      total-loss end days and covered extras differ by option), whether the vehicle was drivable, the physical damage
      claim's coverage decision and its repair or total-loss course, whether the other party's insurer has accepted
      liability, what has already been paid on the claim against the per-loss maximum and days, and the auto package's
      highest allowed option. The governing rules are rental_evt_authorization, rental_evt_extension_and_end,
      rental_evt_payment, rental_agg_per_loss_benefit, rental_attach_eligibility, rental_evt_recovery and
      rental_combo_physdmg_and_builtin, read together with the physical damage claim it rides on; in the natural course
      of a loss the claim is accepted, a rental is authorized and extended while repairs run, it closes when repairs
      finish or a settlement is offered, and invoices and receipts are paid within the limits. The agent authorizes,
      extends, closes and pays rentals and records options, transfers and recoveries, while the decision to take a larger
      car and pay the difference, and the submission of the customer's own receipts, come from the customer. Requests no
      rule covers, such as paying a rental on a denied claim beyond the denial days, paying the agency's damage waiver,
      fuel or one-way fees, or rental for a vehicle without the option, have no deciding policy beyond refusal, and
      anything genuinely outside the charter calls for a POLICY_NOT_COVERED handoff.

  - name: sr22_financial_responsibility_filings
    claim:
      categories: [sr22]
      event_types: [sr22_request, sr22_refile, sr22_withdraw, sr22_sr26_filed, sr22_reinstatement_filing, sr22_release, sr22_fee_assessed, sr22_transmission, sr22_amended_filing]
    summary: >
      Drivers and their families call because a court or the motor vehicle agency requires proof of financial
      responsibility after a DUI, an uninsured accident, an unpaid judgment or a suspension, because the state rejected
      a filing, because their policy lapsed or was reinstated and they worry about their license, because they bought a
      new car or moved, or because the requirement has ended and they want the filing removed. The setting varies with
      the certificate held or needed (SR-22 or FR-44, owner or owner-operator, in-state or out-of-state, each with its own
      fees, transmission method, correction window, SR-26 lead days, required limits and amendment triggers), the state
      order on file and its required-through date, whether the filed driver is rated or excluded on the policy, the
      policy's package, limits and pay plan, and the status of the policy the filing certifies. The governing rules are
      sr22_request_eligibility, sr22_agg_multi_holding, sr22_evt_fees, sr22_transmission_and_response,
      sr22_sr26_cancellation, sr22_reinstatement_filing_rule, sr22_release_rule, sr22_amendments and
      sr22_agg_policy_filings, read together with the auto policy and billing records they depend on; in the natural
      order a filing is requested, transmitted, acknowledged or rejected and corrected, follows the policy through
      cancellation and reinstatement, is amended when a certified fact changes, and is released when the requirement
      ends. The agent requests, transmits, corrects, amends, cancels, restores and releases filings and assesses their
      fees, while the customer supplies the order details and corrected identity information only they can give. An
      order from a state no certificate serves, a request to backdate a certificate, a dispute with the state over a
      suspension, or a request to pay the state's own reinstatement fee has no deciding policy and calls for a
      POLICY_NOT_COVERED handoff.
