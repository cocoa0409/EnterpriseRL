# Product charter: Cardinal Personal Auto Policy (the policy contract and its coverage package).
# Path: env/env_0035_personal_auto_insurance_carrier/blueprint/products/auto.yaml
#
# Capability matrix (functional closure audit):
#   open        new-business issue (bound -> in force), package eligibility, new-business underwriting window
#   in term     vehicle add / replace / remove, newly acquired vehicle automatic coverage, driver add / remove,
#               named driver exclusion (customer signature), garaging change, lienholder change, rideshare
#               endorsement, midterm package change, financial-responsibility indicator
#   money       full-term premium rating (base x (1 + surcharges - capped discounts) + flat add-ons),
#               pro-rata additional / return premium, endorsement fee, cancellation fee, minimum earned premium
#   suspend     notice of cancellation pending (nonpayment via billing, or new-business underwriting), rescission
#   exit        insured-requested cancellation (signed request), flat cancellation, cancellation effective,
#               reinstatement, nonrenewal with notice, expiration for unpaid renewal, late renewal with lapse
#   renewal     renewal offer lead time, re-underwriting into a package, renewal term roll
#   exceptions  ineligible driver/vehicle counts, backdating, excluded drivers, SR-22 on a non-eligible package,
#               add-ons left over after a downgrade, cancellation request never signed

category: auto
display_name: Cardinal Personal Auto Policy

binding:
  holding_table: auto_policies
  event_tables: [auto_transactions]
  intake_tables: [auto_change_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [bound, in_force, cancel_pending, cancelled, nonrenewed, expired]
  transitions:
    - {from: bound, to: in_force, by: system, means: The policy term effective date arrives and the bound policy goes into force.}
    - {from: bound, to: cancelled, by: user, means: The named insured signs a cancellation request before the policy ever takes effect (flat cancellation).}
    - {from: in_force, to: cancelled, by: user, means: The named insured signs a midterm cancellation request and the cancellation takes effect on the requested date.}
    - {from: in_force, to: cancel_pending, by: system, means: A notice of cancellation is issued (nonpayment notice from billing, or a new-business underwriting notice) and the policy waits for the cancellation effective date.}
    - {from: cancel_pending, to: in_force, by: system, means: The notice of cancellation is rescinded because its cure condition was met before the cancellation effective date.}
    - {from: cancel_pending, to: cancelled, by: system, means: The cancellation effective date passes without a cure and coverage ends.}
    - {from: cancelled, to: in_force, by: agent, means: A cancelled policy is reinstated after its billing account is reinstated within the reinstatement window.}
    - {from: in_force, to: nonrenewed, by: system, means: The term expires after a company nonrenewal notice was mailed in time.}
    - {from: in_force, to: expired, by: system, means: The term expires because the renewal offer was not accepted by payment.}
    - {from: expired, to: in_force, by: agent, means: A late renewal payment is accepted within the late-renewal window and the renewal term is issued with a lapse in coverage.}

accounts:
  - key: written_premium
    unit: USD
    meaning: Cumulative premium written on the policy across all of its terms; full-term and additional premiums credit it, return premiums debit it.

parameter_schema:
  bi_limit_per_person: Bodily injury liability limit per person, USD.
  bi_limit_per_accident: Bodily injury liability limit per accident, USD.
  pd_limit_per_accident: Property damage liability limit per accident, USD.
  medpay_limit_per_person: Medical payments coverage limit per injured person, USD (0 = coverage not included).
  um_uim_bi_limit_per_person: Uninsured/underinsured motorist bodily injury limit per person, USD.
  um_uim_bi_limit_per_accident: Uninsured/underinsured motorist bodily injury limit per accident, USD.
  umpd_limit: Uninsured motorist property damage limit per accident, USD.
  umpd_deductible: Deductible applied to an uninsured motorist property damage payment, USD.
  physical_damage_eligible: Boolean switch; whether Cardinal Physical Damage Coverage may be attached to vehicles on this package.
  rental_max_option_rank: Highest rank of Cardinal Rental Reimbursement option that may be attached on this package, integer (0 = rental reimbursement not available).
  roadside_max_option_rank: Highest rank of Cardinal Roadside Assistance option that may be attached on this package, integer.
  telematics_eligible: Boolean switch; whether vehicles on this package may enroll in a Cardinal DriveSense program.
  accident_forgiveness_included: Boolean switch; whether the first chargeable at-fault accident in the lookback is forgiven (not surcharged).
  accident_forgiveness_min_tenure_months: Months of continuous Cardinal coverage the named insured must have on the accident date for forgiveness to apply, integer (read only where accident_forgiveness_included is true).
  minor_violation_forgiveness_included: Boolean switch; whether the first minor violation in the lookback is forgiven (not surcharged).
  new_car_replacement_included: Boolean switch; whether vehicles on this package qualify for new car replacement on a total loss (eligibility tests live in the physical damage charter).
  newly_acquired_additional_report_days: Calendar days after acquisition within which an additional (not replacement) vehicle must be reported to keep the automatic coverage, integer.
  household_driver_report_days: Calendar days after a household member becomes licensed or moves into the household within which the member must be reported, integer.
  policy_term_months: Length of one policy term, months.
  policy_fee_per_term: Policy fee charged once per term at issuance and at each renewal, USD.
  endorsement_fee: Fee charged per processed endorsement transaction that the charter makes chargeable, USD.
  max_vehicles: Maximum number of vehicles scheduled on one policy, integer.
  max_rated_drivers: Maximum number of rated (non-excluded) drivers on one policy, integer.
  multi_car_discount_pct: Discount applied when the customer's household vehicle count is two or more, percent of the base premium.
  multi_policy_discount_pct: Discount applied when the customer also holds a Cardinal homeowners, condominium or renters policy, percent.
  homeowner_discount_pct: Discount applied when the named insured owns their residence, percent.
  paperless_discount_pct: Discount applied when the customer is enrolled in paperless documents, percent.
  good_student_discount_pct: Discount applied per rated driver who qualifies as a good student, percent.
  good_student_min_gpa: Minimum grade point average (4.0 scale) for the good student discount, decimal.
  good_student_max_age: Oldest age at which a full-time student still qualifies for the good student discount, years.
  defensive_driver_discount_pct: Discount applied per rated driver who completed an approved defensive driving course, percent.
  defensive_driver_min_age: Minimum driver age for the defensive driver discount, years.
  defensive_course_valid_months: Months after course completion during which the defensive driver discount applies, integer.
  max_total_discount_pct: Cap on the sum of all discount percentages applied to one policy, percent.
  youthful_driver_surcharge_pct: Surcharge applied per rated driver younger than the youthful driver age limit, percent.
  youthful_driver_age_limit: Age below which a rated driver is a youthful driver, years.
  at_fault_accident_surcharge_pct: Surcharge applied per chargeable at-fault accident in the lookback, percent.
  at_fault_surcharge_min_paid: Minimum amount paid on an at-fault accident for it to be chargeable, USD.
  major_violation_surcharge_pct: Surcharge applied per major violation in the lookback, percent.
  minor_violation_surcharge_pct: Surcharge applied per minor violation in the lookback, percent.
  surcharge_lookback_months: Months before the rating date within which incidents count toward surcharges and eligibility, integer.
  max_major_violations: Maximum major violations across rated drivers in the lookback for the package to be available, integer.
  max_minor_violations: Maximum minor violations across rated drivers in the lookback for the package to be available, integer.
  max_at_fault_accidents: Maximum chargeable at-fault accidents across rated drivers in the lookback for the package to be available, integer.
  min_years_licensed_named_insured: Minimum full years since the named insured was first licensed, integer.
  min_prior_insurance_months: Minimum months of continuous prior auto insurance immediately before new business, integer.
  min_named_insured_age: Minimum age of the named insured, years.
  excluded_driver_allowed: Boolean switch; whether a household member may be excluded by a signed named driver exclusion.
  sr22_eligible: Boolean switch; whether a financial-responsibility filing (SR-22 or FR-44) may be carried on this package.
  rideshare_endorsement_available: Boolean switch; whether the rideshare (transportation network) endorsement may be added.
  rideshare_endorsement_premium: Flat full-term premium per vehicle for the rideshare endorsement, USD (0.00 where not available).
  endorsement_future_date_max_days: Maximum calendar days into the future an endorsement effective date may be set, integer.
  midterm_package_change_allowed: Boolean switch; whether the coverage package may be changed during the term (otherwise only at renewal).
  cancellation_fee: Fee deducted from return premium on an insured-requested midterm cancellation, USD.
  minimum_earned_premium: Minimum premium the company retains for a term cancelled at the insured's request, USD.
  renewal_offer_lead_days: Calendar days before term expiration on which the renewal offer is issued, integer.
  nonrenewal_notice_days: Minimum calendar days between mailing a company nonrenewal notice and the term expiration date, integer.
  late_renewal_acceptance_days: Calendar days after an expiration for unpaid renewal within which a late renewal payment is still accepted with a lapse, integer.
  claim_free_discount_pct: Discount applied when no rated driver has a chargeable at-fault accident in the lookback and the customer has no paid physical damage claim in the lookback, percent.
  new_business_underwriting_days: Calendar days after the original inception date during which the company may cancel new business on underwriting grounds with notice, integer.

