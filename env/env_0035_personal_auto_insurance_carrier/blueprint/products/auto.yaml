      defensive_driver_min_age: 55
      defensive_course_valid_months: 36
      max_total_discount_pct: 45
      youthful_driver_surcharge_pct: 25
      youthful_driver_age_limit: 25
      at_fault_accident_surcharge_pct: 20
      at_fault_surcharge_min_paid: 1000.00
      major_violation_surcharge_pct: 90
      minor_violation_surcharge_pct: 10
      surcharge_lookback_months: 36
      max_major_violations: 0
      max_minor_violations: 1
      max_at_fault_accidents: 1
      min_years_licensed_named_insured: 5
      min_prior_insurance_months: 12
      min_named_insured_age: 18
      excluded_driver_allowed: false
      sr22_eligible: false
      rideshare_endorsement_available: true
      rideshare_endorsement_premium: 68.00
      endorsement_future_date_max_days: 30
      midterm_package_change_allowed: true
      cancellation_fee: 0.00
      minimum_earned_premium: 0.00
      renewal_offer_lead_days: 60
      nonrenewal_notice_days: 45
      late_renewal_acceptance_days: 30
      claim_free_discount_pct: 12
      new_business_underwriting_days: 60

events:
  # ---- holding writes (auto_policies) -------------------------------------------------------
  - type: auto_policy_issue
    target: auto_policies
    mutation: create
    meaning: A new personal auto policy is bound for a customer on a coverage package, with its first term dates.
    grain: One row per policy contract.
    fields:
      policy_id: Policy reference generated at bind.
      customer_id: The named insured's customer reference.
      policy_number: The printed policy number.
      variant_name: The coverage package bound.
      policy_state: Garaging state that governs the policy.
      term_effective_date: First day of the first term.
      term_expiration_date: Last day of the first term (effective date plus policy_term_months).
      inception_date: Original inception date (equals the first term effective date).
      issued_date: Date the policy was bound.
    triggers:
      - event: auto:auto_term_premium_written
        map: {policy_id: policy_id, customer_id: customer_id, term_effective_date: term_effective_date, effective_date: term_effective_date}
      - event: billing:billing_account_open
        map: {policy_id: policy_id, customer_id: customer_id, term_effective_date: term_effective_date}
  - type: auto_policy_inforce
    target: auto_policies
    mutation: {transition: {from: bound, to: in_force}}
    meaning: The bound policy reaches its term effective date and coverage begins.
    grain: One row per transaction.
    fields:
      status: Set to in_force.
    triggers: []
  - type: auto_flat_cancel
    target: auto_policies
    mutation: {transition: {from: bound, to: cancelled}}
    meaning: A bound policy is cancelled before its effective date on the named insured's signed request; no premium is earned.
    grain: One row per transaction.
    fields:
      status: Set to cancelled.
      end_date: The term effective date (coverage never attached).
      end_reason: Set to flat_cancel.
    triggers:
      - event: auto:auto_return_premium
        map: {policy_id: policy_id, customer_id: customer_id, effective_date: end_date, reason_code: insured_requested}
  - type: auto_insured_cancel
    target: auto_policies
    mutation: {transition: {from: in_force, to: cancelled}}
    meaning: An in-force policy is cancelled midterm on the date requested in the named insured's signed cancellation request.
    grain: One row per transaction.
    fields:
      status: Set to cancelled.
      end_date: The requested cancellation effective date.
      end_reason: Set to insured_request.
      financial_responsibility_filing: Read to decide whether a state must be told the filing is ending.
    triggers:
      - event: auto:auto_return_premium
        map: {policy_id: policy_id, customer_id: customer_id, effective_date: end_date, reason_code: insured_requested}
      - event: sr22:sr22_sr26_filed
        when: {financial_responsibility_filing: true}
        map: {policy_id: policy_id}
  - type: auto_cancel_pending
    target: auto_policies
    mutation: {transition: {from: in_force, to: cancel_pending}}
    meaning: A notice of cancellation has been mailed (nonpayment notice from billing, or a new-business underwriting notice) and the policy waits for the cancellation effective date.
    grain: One row per transaction.
    fields:
      policy_id: Policy concerned.
      status: Set to cancel_pending.
      cancellation_effective_date: The cancellation effective date printed on the notice.
      end_reason: The ground of the pending cancellation (nonpayment or underwriting).
    triggers: []
  - type: auto_cancel_rescind
    target: auto_policies
    mutation: {transition: {from: cancel_pending, to: in_force}}
    meaning: The pending cancellation is withdrawn because its cure condition was met on or before the cancellation effective date.
    grain: One row per transaction.
    fields:
      policy_id: Policy concerned.
      status: Set back to in_force.
      cancellation_effective_date: Cleared.
      end_reason: Reset to none.
    triggers: []
  - type: auto_cancel_effective
    target: auto_policies
    mutation: {transition: {from: cancel_pending, to: cancelled}}
    meaning: The cancellation effective date passes without a cure and the policy is cancelled.
    grain: One row per transaction.
    fields:
      policy_id: Policy concerned.
      status: Set to cancelled.
      end_date: Equals the cancellation effective date on the notice.
      end_reason: Carried over from the pending cancellation (nonpayment or underwriting).
      financial_responsibility_filing: Read to decide whether a state must be told the filing is ending.
    triggers:
      - event: auto:auto_return_premium
        map: {policy_id: policy_id, customer_id: customer_id, effective_date: end_date}
      - event: sr22:sr22_sr26_filed
        when: {financial_responsibility_filing: true}
        map: {policy_id: policy_id}
  - type: auto_reinstate
    target: auto_policies
    mutation: {transition: {from: cancelled, to: in_force}}
    meaning: A policy cancelled for nonpayment is put back in force after its billing account is reinstated.
    grain: One row per transaction.
    fields:
      policy_id: Policy concerned.
      status: Set to in_force.
      end_date: Cleared.
      end_reason: Reset to none.
      cancellation_effective_date: Kept as the start of the lapse in coverage.
      financial_responsibility_filing: Read to decide whether a reinstatement filing must go to the state.
    triggers:
      - event: auto:auto_additional_premium
        map: {policy_id: policy_id, customer_id: customer_id, reason_code: reinstatement}
      - event: sr22:sr22_reinstatement_filing
        when: {financial_responsibility_filing: true}
        map: {policy_id: policy_id}
  - type: auto_renew
    target: auto_policies
    mutation: update
    meaning: The renewal term is issued after the renewal offer is accepted by payment; the term dates roll forward and the renewal package is recorded.
    grain: One row per transaction (one per renewal term).
    fields:
      term_effective_date: Prior term expiration date.
      term_expiration_date: New term effective date plus policy_term_months.
      variant_name: Package offered on the renewal offer.
    triggers:
      - event: auto:auto_term_premium_written
        map: {policy_id: policy_id, customer_id: customer_id, term_effective_date: term_effective_date, effective_date: term_effective_date}
  - type: auto_nonrenew
    target: auto_policies
    mutation: {transition: {from: in_force, to: nonrenewed}}
    meaning: The term expires after a company nonrenewal notice was mailed in time.
    grain: One row per transaction.
    fields:
      status: Set to nonrenewed.
      end_date: The term expiration date.
      end_reason: Set to company_nonrenewal.
      financial_responsibility_filing: Read to decide whether a state must be told the filing is ending.
    triggers:
      - event: sr22:sr22_sr26_filed
        when: {financial_responsibility_filing: true}
        map: {policy_id: policy_id}
  - type: auto_expire
    target: auto_policies
    mutation: {transition: {from: in_force, to: expired}}
    meaning: The term expires because the renewal offer was not accepted by payment by the expiration date.
    grain: One row per transaction.
    fields:
      status: Set to expired.
      end_date: The term expiration date.
      end_reason: Set to renewal_not_paid.
      financial_responsibility_filing: Read to decide whether a state must be told the filing is ending.
    triggers:
      - event: sr22:sr22_sr26_filed
        when: {financial_responsibility_filing: true}
        map: {policy_id: policy_id}
  - type: auto_late_renewal
    target: auto_policies
    mutation: {transition: {from: expired, to: in_force}}
    meaning: A late renewal payment is accepted inside the late-renewal window and the renewal term is issued with a lapse from the expiration date to the payment date.
    grain: One row per transaction.
    fields:
      status: Set to in_force.
      term_effective_date: The date the late renewal payment was received (coverage resumes from this date).
      term_expiration_date: The original renewal term expiration date (the lapse does not extend the term).
      end_date: Cleared.
      end_reason: Reset to none.
    triggers:
      - event: auto:auto_term_premium_written
        map: {policy_id: policy_id, customer_id: customer_id, term_effective_date: term_effective_date, effective_date: term_effective_date}
  - type: auto_package_change
    target: auto_policies
    mutation: update
    meaning: The coverage package on an in-force policy is changed midterm by endorsement.
    grain: One row per transaction.
    fields:
      variant_name: The new coverage package.
    triggers: []
  - type: auto_filing_flag_update
    target: auto_policies
    mutation: update
    meaning: The financial-responsibility indicator on the policy is switched on when an SR-22 or FR-44 filing is requested and off when the last filing on the policy is released or lapses.
    grain: One row per transaction.
    fields:
      policy_id: Policy whose indicator changes.
      financial_responsibility_filing: true while at least one filing on the policy is requested, filed, accepted, rejected or cancel_notified; false otherwise.
    triggers: []
  # ---- event-table writes (auto_transactions) ------------------------------------------------
  - type: auto_vehicle_add
    target: auto_transactions
    meaning: An additional vehicle is added to the policy schedule by endorsement.
    grain: One row per vehicle added per endorsement.
    distinguish_by: [vehicle_id, effective_date]
    fields:
      transaction_id: Endorsement transaction reference.
      policy_id: Policy endorsed.
      customer_id: Named insured.
      vehicle_id: Vehicle added (from the customer's vehicle records).
      effective_date: Endorsement effective date.
      full_term_premium_before: Full-term premium before the change.
      full_term_premium_after: Full-term premium after the change.
      premium_effect: additional, return or none.
      reason_code: vehicle_purchased (additional vehicle).
      recorded_date: Date the endorsement was processed.
    triggers:
      - event: auto:auto_additional_premium
        when: {premium_effect: additional}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after, reason_code: vehicle_purchased}
      - event: billing:billing_fee_charged
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, fee_type: endorsement_fee}
  - type: auto_vehicle_replace
    target: auto_transactions
    meaning: A scheduled vehicle is replaced by a newly acquired vehicle, which takes over the replaced vehicle's coverages.
    grain: One row per replacement per endorsement.
    distinguish_by: [vehicle_id, replaced_vehicle_id, effective_date]
    fields:
      transaction_id: Endorsement transaction reference.
      policy_id: Policy endorsed.
      customer_id: Named insured.
      vehicle_id: Vehicle coming onto the policy.
      replaced_vehicle_id: Vehicle leaving the policy.
      effective_date: Endorsement effective date.
      full_term_premium_before: Full-term premium before the change.
      full_term_premium_after: Full-term premium after the change.
      premium_effect: additional, return or none.
      reason_code: vehicle_replaced.
      recorded_date: Date the endorsement was processed.
    triggers:
      - event: auto:auto_additional_premium
        when: {premium_effect: additional}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after, reason_code: vehicle_replaced}
      - event: auto:auto_return_premium
        when: {premium_effect: return}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after, reason_code: vehicle_replaced}
      - event: billing:billing_fee_charged
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, fee_type: endorsement_fee}
  - type: auto_vehicle_remove
    target: auto_transactions
    meaning: A vehicle is removed from the policy schedule (sold, traded without replacement, totaled, or no longer in the household).
    grain: One row per vehicle removed per endorsement.
    distinguish_by: [vehicle_id, effective_date]
    fields:
      transaction_id: Endorsement transaction reference.
      policy_id: Policy endorsed.
      customer_id: Named insured.
      vehicle_id: Vehicle removed.
      effective_date: Endorsement effective date.
      full_term_premium_before: Full-term premium before the change.
      full_term_premium_after: Full-term premium after the change.
      premium_effect: return or none.
      reason_code: vehicle_sold, vehicle_total_loss or vehicle_left_household.
      recorded_date: Date the endorsement was processed.
    triggers:
      - event: auto:auto_return_premium
        when: {premium_effect: return}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after}
      - event: physdmg:physdmg_coverage_remove
        map: {vehicle_id: vehicle_id, policy_id: policy_id, customer_id: customer_id, end_date: effective_date}
      - event: roadside:roadside_remove
        map: {vehicle_id: vehicle_id, policy_id: policy_id, customer_id: customer_id, end_date: effective_date}
      - event: telematics:telematics_terminate
        map: {vehicle_id: vehicle_id, end_date: effective_date, end_reason: vehicle_removed}
  - type: auto_driver_add
    target: auto_transactions
    meaning: A household member is added to the policy as a rated driver by endorsement.
    grain: One row per driver added per endorsement.
    distinguish_by: [driver_id, effective_date]
    fields:
      transaction_id: Endorsement transaction reference.
      policy_id: Policy endorsed.
      customer_id: Named insured.
      driver_id: Driver added (from the household driver records).
      effective_date: Endorsement effective date.
      full_term_premium_before: Full-term premium before the change.
      full_term_premium_after: Full-term premium after the change.
      premium_effect: additional, return or none.
      reason_code: household_member_licensed or household_member_moved_in.
      recorded_date: Date the endorsement was processed.
    triggers:
      - event: auto:auto_additional_premium
        when: {premium_effect: additional}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after}
      - event: billing:billing_fee_charged
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, fee_type: endorsement_fee}
  - type: auto_driver_exclude
    target: auto_transactions
    meaning: A household member is excluded from all coverage on the policy under a named driver exclusion signed by the named insured.
    grain: One row per driver excluded per endorsement.
    distinguish_by: [driver_id, effective_date]
    fields:
      transaction_id: Endorsement transaction reference.
      policy_id: Policy endorsed.
      customer_id: Named insured.
      driver_id: Driver excluded.
      request_id: The signed named driver exclusion request this endorsement carries out.
      effective_date: Endorsement effective date.
      full_term_premium_before: Full-term premium before the change.
      full_term_premium_after: Full-term premium after the change.
      premium_effect: return or none.
      reason_code: named_driver_exclusion.
      recorded_date: Date the endorsement was processed.
    triggers:
      - event: auto:auto_return_premium
        when: {premium_effect: return}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after, reason_code: named_driver_exclusion}
  - type: auto_driver_remove
    target: auto_transactions
    meaning: A driver who no longer lives in the household, or who has died, is removed from the policy.
    grain: One row per driver removed per endorsement.
    distinguish_by: [driver_id, effective_date]
    fields:
      transaction_id: Endorsement transaction reference.
      policy_id: Policy endorsed.
      customer_id: Named insured.
      driver_id: Driver removed.
      effective_date: Endorsement effective date.
      full_term_premium_before: Full-term premium before the change.
      full_term_premium_after: Full-term premium after the change.
      premium_effect: return or none.
      reason_code: household_member_moved_out or driver_deceased.
      recorded_date: Date the endorsement was processed.
    triggers:
      - event: auto:auto_return_premium
        when: {premium_effect: return}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after}
  - type: auto_garaging_change
    target: auto_transactions
    meaning: The garaging address of a scheduled vehicle changes (the customer moved) and the vehicle is re-rated at the new ZIP code.
    grain: One row per vehicle per garaging change.
    distinguish_by: [vehicle_id, garaging_zip, effective_date]
    fields:
      transaction_id: Endorsement transaction reference.
      policy_id: Policy endorsed.
      customer_id: Named insured.
      vehicle_id: Vehicle whose garaging changes.
      garaging_zip: New garaging ZIP code.
      effective_date: Date the vehicle began to be garaged at the new address.
      full_term_premium_before: Full-term premium before the change.
      full_term_premium_after: Full-term premium after the change.
      premium_effect: additional, return or none.
      reason_code: address_moved.
      recorded_date: Date the endorsement was processed.
    triggers:
      - event: auto:auto_additional_premium
        when: {premium_effect: additional}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after, reason_code: address_moved}
      - event: auto:auto_return_premium
        when: {premium_effect: return}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after, reason_code: address_moved}
  - type: auto_lienholder_change
    target: auto_transactions
    meaning: The lienholder or lessor shown as loss payee on a scheduled vehicle is added, changed or removed.
    grain: One row per vehicle per loss-payee change.
    distinguish_by: [vehicle_id, lienholder_name, effective_date]
    fields:
      transaction_id: Endorsement transaction reference.
      policy_id: Policy endorsed.
      customer_id: Named insured.
      vehicle_id: Vehicle whose loss payee changes.
      lienholder_name: New loss payee exactly as printed on the finance or lease contract (empty when the lien is released).
      effective_date: Endorsement effective date.
      premium_effect: none.
      reason_code: new_loan or loan_paid_off.
      recorded_date: Date the endorsement was processed.
    triggers: []
  - type: auto_rideshare_change
    target: auto_transactions
    meaning: The rideshare (transportation network) endorsement is added to or removed from a scheduled vehicle.
    grain: One row per vehicle per rideshare change.
    distinguish_by: [vehicle_id, reason_code, effective_date]
    fields:
      transaction_id: Endorsement transaction reference.
      policy_id: Policy endorsed.
      customer_id: Named insured.
      vehicle_id: Vehicle endorsed.
      effective_date: Endorsement effective date.
      full_term_premium_before: Full-term premium before the change.
      full_term_premium_after: Full-term premium after the change.
      premium_effect: additional (added) or return (removed).
      reason_code: rideshare_added or rideshare_removed.
      recorded_date: Date the endorsement was processed.
    triggers:
      - event: auto:auto_additional_premium
        when: {premium_effect: additional}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after, reason_code: rideshare_added}
      - event: auto:auto_return_premium
        when: {premium_effect: return}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after, reason_code: rideshare_removed}
  - type: auto_coverage_change
    target: auto_transactions
    meaning: An optional coverage on a scheduled vehicle (physical damage, its deductible or options, rental reimbursement, roadside assistance) is added, changed, suspended or removed, and the policy is re-rated.
    grain: One row per add-on coverage record per change.
    distinguish_by: [vehicle_id, source_transaction_id, reason_code, effective_date]
    fields:
      transaction_id: Endorsement transaction reference.
      policy_id: Policy endorsed.
      customer_id: Named insured.
      vehicle_id: Vehicle whose optional coverage changes.
      source_transaction_id: The physical damage, rental reimbursement or roadside assistance coverage record that changed.
      effective_date: Date the change takes effect.
      full_term_premium_before: Full-term premium before the change.
      full_term_premium_after: Full-term premium after the change.
      premium_effect: additional, return or none.
      reason_code: coverage_added, coverage_removed, deductible_change or option_change.
      recorded_date: Date the endorsement was processed.
    triggers:
      - event: auto:auto_additional_premium
        when: {premium_effect: additional}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after}
      - event: auto:auto_return_premium
        when: {premium_effect: return}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after}
  - type: auto_package_endorsement
    target: auto_transactions
    meaning: A midterm package change is written as an endorsement transaction, rated before and after, and the new package is set on the policy.
    grain: One row per package change.
    distinguish_by: [offered_variant_name, effective_date]
    fields:
      transaction_id: Endorsement transaction reference.
      policy_id: Policy endorsed.
      customer_id: Named insured.
      offered_variant_name: The new coverage package.
      effective_date: Date the new package takes effect.
      full_term_premium_before: Full-term premium on the old package.
      full_term_premium_after: Full-term premium on the new package.
      premium_effect: additional (upgrade), return (downgrade) or none.
      reason_code: package_upgrade or package_downgrade.
      recorded_date: Date the endorsement was processed.
    triggers:
      - event: auto:auto_package_change
        map: {variant_name: offered_variant_name}
      - event: auto:auto_additional_premium
        when: {premium_effect: additional}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after, reason_code: package_upgrade}
      - event: auto:auto_return_premium
        when: {premium_effect: return}
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, effective_date: effective_date, full_term_premium_before: full_term_premium_before, full_term_premium_after: full_term_premium_after, reason_code: package_downgrade}
  - type: auto_term_premium_written
    target: auto_transactions
    meaning: The full-term premium of a new or renewal term is written to the policy.
    grain: One row per policy term.
    distinguish_by: [term_effective_date]
    fields:
      transaction_id: Premium transaction reference.
      policy_id: Policy.
      customer_id: Named insured.
      term_effective_date: First day of the term the premium belongs to.
      effective_date: Same as term_effective_date.
      premium_amount: Full-term premium written, USD.
      recorded_date: Date written.
    account: written_premium
    direction: in
    triggers:
      - event: billing:billing_premium_change
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, amount: premium_amount, premium_change_type: term_premium, term_effective_date: term_effective_date}
  - type: auto_additional_premium
    target: auto_transactions
    meaning: Additional premium (AP) produced by an endorsement, a package upgrade or a reinstatement, prorated for the unexpired part of the term.
    grain: One row per premium-bearing source transaction.
    distinguish_by: [source_transaction_id, reason_code, effective_date]
    fields:
      transaction_id: AP transaction reference.
      policy_id: Policy.
      customer_id: Named insured.
      source_transaction_id: The endorsement, package-change or reinstatement transaction that produced this AP.
      effective_date: Effective date of the source change.
      full_term_premium_before: Full-term premium before the change.
      full_term_premium_after: Full-term premium after the change.
      premium_amount: Prorated additional premium, USD, positive.
      reason_code: Why the AP arose.
      recorded_date: Date written.
    account: written_premium
    direction: in
    triggers:
      - event: billing:billing_premium_change
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, amount: premium_amount, premium_change_type: additional}
  - type: auto_return_premium
    target: auto_transactions
    meaning: Return premium (RP) produced by an endorsement, a package downgrade or a cancellation, prorated for the unexpired part of the term.
    grain: One row per premium-bearing source transaction.
    distinguish_by: [source_transaction_id, reason_code, effective_date]
    fields:
      transaction_id: RP transaction reference.
      policy_id: Policy.
      customer_id: Named insured.
      source_transaction_id: The endorsement or package-change transaction that produced this RP (empty for a cancellation RP, which is keyed by policy and effective date).
      effective_date: Effective date of the source change or of the cancellation.
      full_term_premium_before: Full-term premium before the change.
      full_term_premium_after: Full-term premium after the change.
      premium_amount: Prorated return premium, USD, positive.
      reason_code: Why the RP arose.
      recorded_date: Date written.
    account: written_premium
    direction: out
    triggers:
      - event: billing:billing_premium_change
        map: {policy_id: policy_id, customer_id: customer_id, source_transaction_id: transaction_id, amount: premium_amount, premium_change_type: return}
  - type: auto_renewal_offer
    target: auto_transactions
    meaning: The renewal offer for the next term is issued, naming the renewal package and the renewal full-term premium.
    grain: One row per policy term offered.
    distinguish_by: [term_effective_date]
    fields:
      transaction_id: Renewal offer reference.
      policy_id: Policy.
      customer_id: Named insured.
      term_effective_date: First day of the renewal term offered.
      offered_variant_name: Package offered for the renewal term.
      full_term_premium_after: Renewal full-term premium offered.
      notice_date: Date the offer was issued.
      recorded_date: Date recorded.
    triggers: []
  - type: auto_nonrenewal_notice
    target: auto_transactions
    meaning: A company nonrenewal notice is mailed for the current term.
    grain: One row per policy term not renewed.
    distinguish_by: [term_effective_date]
    fields:
      transaction_id: Nonrenewal notice reference.
      policy_id: Policy.
      customer_id: Named insured.
      term_effective_date: First day of the term that will not be renewed.
      notice_date: Date the notice was mailed.
      reason_code: underwriting_ineligible_driver or underwriting_loss_history.
      recorded_date: Date recorded.
    triggers: []

measures:
  - id: auto_msr_policy_vehicles
    window: Current schedule of the policy as of the transaction effective date.
    measure: Count of vehicles on the policy, i.e. vehicles carried by auto_vehicle_add or auto_vehicle_replace rows (vehicles scheduled at issue are recorded as auto_vehicle_add rows effective the inception date) and not later removed by auto_vehicle_remove or replaced by auto_vehicle_replace.
  - id: auto_msr_household_vehicles
    window: Portfolio state on the transaction effective date.
    measure: Count of vehicles scheduled across every auto_policies record of the customer whose status is bound, in_force or cancel_pending.
  - id: auto_msr_rated_drivers
    window: Current driver list of the policy as of the transaction effective date.
    measure: Count of drivers carried by auto_driver_add rows on the policy (drivers listed at issue are recorded as auto_driver_add rows effective the inception date) and not later excluded by auto_driver_exclude or removed by auto_driver_remove.
  - id: auto_msr_major_violations
    window: Rolling surcharge_lookback_months calendar months ending on the rating date (the transaction effective date, or the renewal term effective date), counted by incident_date.
    measure: Count of driving_records rows with record_type major_violation for rated drivers on the policy.
  - id: auto_msr_minor_violations
    window: Rolling surcharge_lookback_months calendar months ending on the rating date, counted by incident_date.
    measure: Count of driving_records rows with record_type minor_violation for rated drivers on the policy.
  - id: auto_msr_chargeable_accidents
    window: Rolling surcharge_lookback_months calendar months ending on the rating date, counted by incident_date.
    measure: Count of driving_records rows with record_type at_fault_accident and paid_amount at or above at_fault_surcharge_min_paid, for rated drivers on the policy.
  - id: auto_msr_youthful_drivers
    window: Ages computed on the rating date.
    measure: Count of rated drivers whose age on the rating date is below youthful_driver_age_limit.
  - id: auto_msr_good_students
    window: Ages computed on the rating date.
    measure: Count of rated drivers with good_student_verified true whose age on the rating date is at or below good_student_max_age.
  - id: auto_msr_defensive_drivers
    window: Course dates within defensive_course_valid_months calendar months before the rating date; ages on the rating date.
    measure: Count of rated drivers at or above defensive_driver_min_age whose defensive_course_date falls inside the window.
  - id: auto_msr_unexpired_days
    window: The current policy term.
    measure: Calendar days from the transaction effective_date to the term_expiration_date of the term the transaction falls in (expiration date minus effective date).
  - id: auto_msr_pay_plan_discount
    window: The pay plan on the policy's billing account on the rating date.
    measure: pay_plan_discount_pct of that pay plan in the billing charter.
  - id: auto_msr_term_written_premium
    window: The current policy term (term_effective_date to term_expiration_date).
    measure: Sum of premium_amount on the policy's auto_term_premium_written and auto_additional_premium rows effective inside the term, less premium_amount on its auto_return_premium rows effective inside the term.
  - id: auto_msr_term_days
    window: The current policy term.
    measure: Calendar days in the term (term_expiration_date minus term_effective_date).

policies:
  - id: auto_agg_multi_holding
    subject: [auto_policy_issue]
    rule: >-
      A customer may hold up to the max_per_customer number of Cardinal personal auto policies at one time, counting
      policies whose status is bound, in_force or cancel_pending; cancelled, nonrenewed and expired policies do not count.
      Each policy is written for a single garaging state and a single household.
      A new policy may be issued only when the customer currently holds fewer than max_per_customer counted policies.
      A request for a further policy beyond the cap is declined; the customer may instead add the vehicle to an existing
      policy within that policy's own vehicle cap.
    eligibility:
      - id: policy_count_below_cap
        applies_to: [auto_policy_issue]
        kind: caller_fact
        condition: "A new policy may be issued only when the customer currently holds fewer than max_per_customer counted policies."
        evidence_fields: [auto_policies.customer_id, auto_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.customer_id]
          action_bindings:
            auto_policies.customer_id: customer_id
    params:
      max_per_customer: 3

  - id: auto_agg_household_vehicle_count
    subject: [auto_vehicle_add, auto_vehicle_replace, auto_vehicle_remove, auto_term_premium_written, auto_additional_premium, auto_return_premium]
    rule: >-
      The multi-car discount is decided on the household, not the single policy: the household vehicle count is the
      number of vehicles scheduled across every auto policy of the customer whose status is bound, in_force or
      cancel_pending, measured on the rating date (auto_msr_household_vehicles). When that count is two or more, every
      policy of the customer receives its own package's multi_car_discount_pct; when it is one, no policy receives it.
      Because the count spans policies, a vehicle added to or removed from one policy can switch the multi-car discount on
      or off on the customer's other policy; that other policy is re-rated from the same effective date and its own
      additional or return premium is written against it. The per-policy vehicle cap is max_vehicles of each policy's own
      package and is never pooled across policies.
    eligibility: []
    measures: [auto_msr_household_vehicles, auto_msr_policy_vehicles]
    params:
      multi_car_min_household_vehicles: 2

  - id: auto_underwriting_eligibility
    subject: [auto_policy_issue, auto_renew, auto_package_change, auto_driver_add]
    rule: >-
      A package is available to a policy only when all of its entry gates hold on the rating date, counted across all
      rated drivers on the policy (excluded drivers do not count): major violations in the lookback at or below
      max_major_violations, minor violations at or below max_minor_violations, chargeable at-fault accidents at or below
      max_at_fault_accidents, the named insured first licensed at least min_years_licensed_named_insured full years ago,
      at least min_prior_insurance_months of continuous prior insurance immediately before new business (Cardinal tenure
      counts as prior insurance at renewal and on a package change), and the named insured at least min_named_insured_age.
      The incident counts used for eligibility are the same counts used for surcharges (auto_msr_major_violations,
      auto_msr_minor_violations, auto_msr_chargeable_accidents); a forgiven accident or forgiven minor violation still
      counts for eligibility.
      The requested package must satisfy every entry gate of that package on the rating date.
      At new business, the customer is offered the highest-ranked package whose gates hold among those requested; a
      request for a package whose gates fail is declined for that package only.
      At renewal, a policy whose current package no longer passes is renewed on the highest-ranked package below it whose
      gates hold, and the renewal offer names that package; when no package passes, the company nonrenews under
      auto_renewal. Adding a driver whose records would make the policy fail its current package is not processed as a
      driver add on that package; the named insured may instead exclude the driver (where excluded_driver_allowed) or
      move to a lower package where midterm_package_change_allowed permits.
      A driver whose license_status is suspended or revoked can be added as a rated driver only when a state order on
      file requires a financial-responsibility filing for that driver and the package has sr22_eligible true; a driver
      with an expired license cannot be added until it is renewed.
    eligibility:
      - id: package_gates_hold
        applies_to: [auto_policy_issue, auto_renew, auto_package_change, auto_driver_add]
        kind: caller_fact
        condition: "The requested package must satisfy every entry gate of that package on the rating date."
        evidence_fields: [driving_records.record_type, driving_records.incident_date, driving_records.paid_amount, drivers.first_licensed_date, drivers.date_of_birth, drivers.driver_id, customers.prior_insurance_months]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [drivers.driver_id]
          action_bindings:
            drivers.driver_id: driver_id
      - id: driver_license_status
        applies_to: [auto_driver_add]
        kind: caller_fact
        condition: "A driver whose license_status is suspended or revoked can be added as a rated driver only when a state order on file requires a financial-responsibility filing for that driver and the package has sr22_eligible true"
        evidence_fields: [drivers.license_status, drivers.driver_id, state_orders.driver_id, state_orders.order_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [drivers.driver_id]
          action_bindings:
            drivers.driver_id: driver_id
    measures: [auto_msr_major_violations, auto_msr_minor_violations, auto_msr_chargeable_accidents]

  - id: auto_evt_premium_rating
    subject: [auto_term_premium_written, auto_additional_premium, auto_return_premium, auto_renewal_offer]
    rule: >-
      The full-term premium of a policy is rated in one fixed order. Step 1, base premium: the sum, over scheduled
      vehicles, of liability_base_premium from the vehicle's rating worksheet for the policy's package and term, plus the
      physical damage premium of each vehicle that carries Cardinal Physical Damage Coverage (computed under
      physdmg_evt_premium), each vehicle's share first adjusted by its own DriveSense participation or earned
      adjustment under telematics_agg_policy_discount. Step 2, surcharges: add youthful_driver_surcharge_pct once per youthful rated driver,
      at_fault_accident_surcharge_pct once per chargeable at-fault accident, major_violation_surcharge_pct once per major
      violation and minor_violation_surcharge_pct once per minor violation, all counted on the rating date; where
      accident_forgiveness_included is true and the named insured had at least accident_forgiveness_min_tenure_months of
      continuous Cardinal coverage on the accident date, the earliest chargeable accident is not surcharged, and where
      minor_violation_forgiveness_included is true the earliest minor violation is not surcharged. Step 3, discounts: add
      the discount percentages that apply (multi-car under auto_agg_household_vehicle_count, multi-policy when the
      customer's multi_policy indicator is true, homeowner when the homeowner indicator is true, paperless when the
      paperless indicator is true, good student once per qualifying driver, defensive driver once per qualifying driver,
      claim-free when no chargeable accident and no paid physical damage claim falls in the lookback, and the pay plan
      discount of the policy's billing account set in the billing charter); the summed discount percentage is capped at
      max_total_discount_pct. Surcharges and discounts are added
      as percentages of the base premium, never compounded. Step 4: rated premium = base premium x (1 + surcharge
      percent / 100 - capped discount percent / 100), rounded to the cent (half up). Step 5, flat add-ons: add the
      rental reimbursement and roadside assistance option premiums of the scheduled vehicles and
      rideshare_endorsement_premium for each endorsed vehicle; flat add-ons are never surcharged or discounted. The policy
      fee is billed separately by billing and is not premium. A renewal offer is rated the same way on the renewal term
      effective date, using the renewal package and the renewal worksheets.
    eligibility: []
    formula:
      discount_pct_capped: min(multi_car_discount_pct + multi_policy_discount_pct + homeowner_discount_pct + paperless_discount_pct + good_student_discount_pct * auto_msr_good_students + defensive_driver_discount_pct * auto_msr_defensive_drivers + claim_free_discount_pct + auto_msr_pay_plan_discount, max_total_discount_pct)
      surcharge_pct: youthful_driver_surcharge_pct * auto_msr_youthful_drivers + at_fault_accident_surcharge_pct * auto_msr_chargeable_accidents + major_violation_surcharge_pct * auto_msr_major_violations + minor_violation_surcharge_pct * auto_msr_minor_violations
    measures: [auto_msr_youthful_drivers, auto_msr_good_students, auto_msr_defensive_drivers, auto_msr_chargeable_accidents, auto_msr_major_violations, auto_msr_minor_violations, auto_msr_pay_plan_discount]
    params:
      rounding: cent_half_up

  - id: auto_evt_midterm_proration
    subject: [auto_additional_premium, auto_return_premium]
    rule: >-
      Every midterm premium change is prorated on calendar days. The full-term premium is rated twice under
      auto_evt_premium_rating, as it stood the day before the change and as it stands with the change, both on the
      change's effective date; the difference is multiplied by the unexpired days of the term divided by the days in the
      term and rounded to the cent (half up). A positive difference is written as additional premium, a negative one as
      return premium of the absolute amount; a zero difference writes neither. Each AP or RP row carries the reference
      of the one transaction that produced it, so two changes on the same day produce two separate AP or RP rows.
      Several changes requested together with the same effective date are still processed one transaction at a time, each
      rated against the premium left by the previous one. An endorsement effective date may be today or a later date no
      more than endorsement_future_date_max_days calendar days ahead; it may not be earlier than today except for a
      newly acquired vehicle within its automatic coverage window under auto_vehicle_changes and a driver removal for a
      death, which take the actual date. For a cancellation, the return premium is the pro rata unearned premium of the
      written premium of the term, before any fee or minimum earned premium under auto_insured_cancellation.
    eligibility: []
    formula:
      premium_amount: round(abs(full_term_premium_after - full_term_premium_before) * auto_msr_unexpired_days / auto_msr_term_days, 2)
    measures: [auto_msr_unexpired_days, auto_msr_term_days]

  - id: auto_vehicle_changes
    subject: [auto_vehicle_add, auto_vehicle_replace, auto_vehicle_remove, auto_garaging_change, auto_lienholder_change, auto_coverage_change]
    rule: >-
      Vehicles are added, replaced or removed, and garaging or lienholder changes are made, by endorsement. The policy
      status must be bound or in_force when the change is processed. A policy that is cancel_pending, cancelled,
      nonrenewed or expired accepts no vehicle changes. A vehicle can be scheduled only if it belongs to the named insured's
      household vehicle records. An additional vehicle may be added only while the policy schedules fewer than
      max_vehicles vehicles; a replacement does not change the count. A newly acquired additional vehicle is
      automatically covered from its acquisition date with the broadest coverage carried on any scheduled vehicle, and
      that automatic coverage holds only if the vehicle is reported within newly_acquired_additional_report_days; in that
      case the add is effective on the acquisition date. The additional vehicle keeps its acquisition-date effective
      date only when it is reported no later than newly_acquired_additional_report_days calendar days after the customer
      acquired the vehicle. The count runs in calendar days from the acquisition_date on the vehicle record, the
      acquisition date itself being day 0, and a report on the last day of the window is in time. A vehicle reported
      later is added effective the date of the request. A replacement vehicle takes over the liability coverages of the
      vehicle it replaces from the acquisition date for the rest of the term; physical damage on the replacement follows
      physdmg_newly_acquired_vehicle. A financed or leased vehicle must carry its lienholder or lessor as loss payee,
      recorded exactly as printed on the finance or lease contract, and a lienholder change is recorded the same way; a
      lienholder change carries no premium effect and no endorsement fee. A garaging change re-rates the vehicle at the
      new ZIP code from the date the vehicle began to be garaged there; a move to a state where the policy is not written
      (outside the policy_state) cannot be endorsed and requires a new policy in the new state. Removing the last vehicle
      on a policy is not an endorsement; it is processed as an insured-requested cancellation. Removing a vehicle
      removes any physical damage, rental reimbursement, roadside assistance and DriveSense enrollment attached to it
      under those charters. Adding, changing, suspending or removing an optional vehicle coverage (physical damage and its
      deductible or options, rental reimbursement, roadside assistance) is itself an endorsement of the policy: it is
      decided under that coverage's own charter and re-rated here, with its premium difference prorated under
      auto_evt_midterm_proration; it carries no endorsement fee.
    eligibility:
      - id: policy_open_for_endorsement
        applies_to: [auto_vehicle_add, auto_vehicle_replace, auto_vehicle_remove, auto_garaging_change, auto_lienholder_change, auto_coverage_change]
        kind: state
        condition: "The policy status must be bound or in_force when the change is processed."
        evidence_fields: [auto_policies.status, auto_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.policy_id]
          action_bindings:
            auto_policies.policy_id: policy_id
        state_contract:
          field: auto_policies.status
          allowed: [bound, in_force]
      - id: newly_acquired_report_window
        applies_to: [auto_vehicle_add]
        kind: time
        condition: "The additional vehicle keeps its acquisition-date effective date only when it is reported no later than newly_acquired_additional_report_days calendar days after the customer acquired the vehicle."
        evidence_fields: [vehicles.acquisition_date, vehicles.vehicle_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vehicles.vehicle_id]
          action_bindings:
            vehicles.vehicle_id: vehicle_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the customer acquired the vehicle
          anchor_source: vehicles.acquisition_date
          relation: not_after
          duration_source: variants.newly_acquired_additional_report_days
          unit: calendar_days
          counting_rule: "The count runs in calendar days from the acquisition_date on the vehicle record, the acquisition date itself being day 0, and a report on the last day of the window is in time."
          boundary: inclusive
      - id: vehicle_cap
        applies_to: [auto_vehicle_add]
        kind: caller_fact
        condition: "An additional vehicle may be added only while the policy schedules fewer than max_vehicles vehicles; a replacement does not change the count."
        evidence_fields: [auto_transactions.vehicle_id, auto_transactions.event_type, auto_transactions.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_transactions.policy_id]
          action_bindings:
            auto_transactions.policy_id: policy_id
    measures: [auto_msr_policy_vehicles]

  - id: auto_driver_changes
    subject: [auto_driver_add, auto_driver_exclude, auto_driver_remove]
    rule: >-
      Every licensed household member and every regular operator of a scheduled vehicle must be either a rated driver or
      an excluded driver on the policy. A household member who becomes licensed or moves into the household must be
      reported within household_driver_report_days; the driver is added effective the date the member became licensed or
      moved in when reported within that window, and effective the date of the request when reported later. A driver may
      be added only while the policy has fewer than max_rated_drivers rated drivers, and only subject to
      auto_underwriting_eligibility. Instead of being rated, a household member may be excluded from all coverage under
      a named driver exclusion: the exclusion is available only on packages where excluded_driver_allowed is true, the
      named driver exclusion form must be signed by the named insured before the exclusion is processed, and the
      exclusion takes effect on the date the form was signed or a later date the named insured chose on the form. A named
      driver exclusion is processed only when a signed named driver exclusion request exists for that driver on that
      policy. An excluded driver has no coverage of any kind while driving any vehicle on the policy, cannot be the
      subject of a financial-responsibility filing, and is removed from all surcharge and discount counts. A driver who
      has moved out of the household, or who has died, is removed effective the date of the move or of death. The named
      insured cannot be excluded or removed by endorsement. The policy status must be bound or in_force when a driver
      change is processed.
    eligibility:
      - id: policy_open_for_driver_change
        applies_to: [auto_driver_add, auto_driver_exclude, auto_driver_remove]
        kind: state
        condition: "The policy status must be bound or in_force when a driver change is processed."
        evidence_fields: [auto_policies.status, auto_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.policy_id]
          action_bindings:
            auto_policies.policy_id: policy_id
        state_contract:
          field: auto_policies.status
          allowed: [bound, in_force]
      - id: exclusion_signed
        applies_to: [auto_driver_exclude]
        kind: state
        condition: "A named driver exclusion is processed only when a signed named driver exclusion request exists for that driver on that policy."
        evidence_fields: [auto_change_requests.request_status, auto_change_requests.request_type, auto_change_requests.driver_id, auto_change_requests.request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_change_requests.request_id]
          action_bindings:
            auto_change_requests.request_id: request_id
        state_contract:
          field: auto_change_requests.request_status
          allowed: [signed]
      - id: household_report_window
        applies_to: [auto_driver_add]
        kind: caller_fact
        condition: "A household member who becomes licensed or moves into the household must be reported within household_driver_report_days; the driver is added effective the date the member became licensed or moved in when reported within that window, and effective the date of the request when reported later."
        evidence_fields: [drivers.household_join_date, drivers.driver_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [drivers.driver_id]
          action_bindings:
            drivers.driver_id: driver_id
    measures: [auto_msr_rated_drivers]

  - id: auto_evt_endorsement_fee
    subject: [auto_vehicle_add, auto_vehicle_replace, auto_driver_add]
    rule: >-
      The package's endorsement_fee is charged once per chargeable endorsement transaction and billed by billing as an
      endorsement fee keyed to that transaction. Chargeable transactions are adding a vehicle, replacing a vehicle and
      adding a driver. No endorsement fee is charged for removing a vehicle or driver, excluding a driver, a garaging
      change, a lienholder change, a rideshare change, a package change or a renewal. Where several chargeable changes
      are made on the same day, each transaction is charged separately. Where the package's endorsement_fee is 0.00, no
      fee row is written.
    eligibility: []
    params:
      per_tier:
        Cardinal Auto Essential: {fee: "=endorsement_fee"}
        Cardinal Auto Basic: {fee: "=endorsement_fee"}
        Cardinal Auto Standard: {fee: "=endorsement_fee"}
        Cardinal Auto Plus: {fee: "=endorsement_fee"}
        Cardinal Auto Preferred: {fee: "=endorsement_fee"}
        Cardinal Auto Premier: {fee: "=endorsement_fee"}

  - id: auto_package_change_rules
    subject: [auto_package_change, auto_package_endorsement]
    rule: >-
      A package change during the term is allowed only where the current package's midterm_package_change_allowed is
      true and the policy status is in_force; otherwise the new package can be chosen only on the renewal offer. The
      policy status must be in_force when a midterm package change is processed. The new package must pass
      auto_underwriting_eligibility on the change date. The change is effective today or a later date within
      endorsement_future_date_max_days, and the premium difference is prorated under auto_evt_midterm_proration. A
      downgrade must leave no attachment the new package does not allow: physical damage coverage must be removed when
      the new package has physical_damage_eligible false, a rental reimbursement option ranked above the new package's
      rental_max_option_rank must be lowered or removed, a roadside option ranked above roadside_max_option_rank must be
      lowered or removed, and a rideshare endorsement must be removed where rideshare_endorsement_available is false. A
      policy carrying a financial-responsibility filing may move only to a package with sr22_eligible true.
    eligibility:
      - id: policy_in_force_for_package_change
        applies_to: [auto_package_change, auto_package_endorsement]
        kind: state
        condition: "The policy status must be in_force when a midterm package change is processed."
        evidence_fields: [auto_policies.status, auto_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.policy_id]
          action_bindings:
            auto_policies.policy_id: policy_id
        state_contract:
          field: auto_policies.status
          allowed: [in_force]

  - id: auto_insured_cancellation
    subject: [auto_insured_cancel, auto_flat_cancel, auto_return_premium]
    rule: >-
      Only the named insured can cancel the policy, and only by signing a cancellation request; the agent records the
      request and the named insured signs it. An insured-requested cancellation is processed only when a signed
      cancellation request exists for that policy. The cancellation takes effect on the date the named insured chose on
      the request, which may be the signing date or a later date, never an earlier one. A bound policy cancelled before
      its term effective date is a flat cancellation and returns all premium written for the term with no fee. For a
      midterm cancellation the return premium is the pro rata unearned premium of the term's written premium (auto_evt_midterm_proration),
      less the package's cancellation_fee, and the company always retains at least minimum_earned_premium for the term:
      the return premium is the pro rata unearned premium less the cancellation fee, but never more than the term's
      written premium (auto_msr_term_written_premium) less minimum_earned_premium, and never below zero. No cancellation fee is charged and no minimum earned premium applies when the cancellation
      is because every scheduled vehicle was sold or declared a total loss. A cancellation request that is never signed
      expires and the policy stays in force. Cancelling a policy that carries a financial-responsibility filing requires
      the company to notify the state under the SR-22 charter.
    eligibility:
      - id: cancellation_request_signed
        applies_to: [auto_insured_cancel, auto_flat_cancel]
        kind: state
        condition: "An insured-requested cancellation is processed only when a signed cancellation request exists for that policy."
        evidence_fields: [auto_change_requests.request_status, auto_change_requests.request_type, auto_change_requests.policy_id, auto_change_requests.request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_change_requests.request_id]
          action_bindings:
            auto_change_requests.request_id: request_id
        state_contract:
          field: auto_change_requests.request_status
          allowed: [signed]
    formula:
      premium_amount: max(0, min(premium_amount - cancellation_fee, auto_msr_term_written_premium - minimum_earned_premium))
    measures: [auto_msr_term_written_premium]

  - id: auto_renewal
    subject: [auto_renewal_offer, auto_renew, auto_nonrenewal_notice, auto_nonrenew, auto_expire, auto_late_renewal]
    rule: >-
      The renewal offer is issued renewal_offer_lead_days calendar days before the term expiration date and names the
      renewal package chosen under auto_underwriting_eligibility and the renewal full-term premium rated under
      auto_evt_premium_rating. The customer may choose a different renewal package on the offer as long as that package
      passes its entry gates; the renewal is issued on the package recorded on the offer. The renewal term is issued
      when the renewal down payment set by billing is paid on or before the expiration date; the policy fee is billed
      again for the new term. A company nonrenewal requires a nonrenewal notice mailed at least nonrenewal_notice_days
      calendar days before the term expiration date; a notice mailed later than that cannot nonrenew the term, and the
      policy is offered renewal instead. The policy is nonrenewed at expiration only when a nonrenewal notice for that
      term was mailed no later than nonrenewal_notice_days calendar days before the term expiration date. A policy whose
      renewal is not paid by the expiration date expires. A late renewal payment is accepted only within
      late_renewal_acceptance_days calendar days after the expiration date; the renewal term is then issued with
      coverage resuming on the payment date, leaving a lapse from the expiration date to the payment date, and the term
      expiration date is not moved. A late renewal is accepted only when the payment is received no later than
      late_renewal_acceptance_days calendar days after the policy expired for nonpayment of the renewal. Days are counted
      from the end_date on the policy record, the end date being day 0, and a payment on the last day of the window is
      accepted. A payment after the window is refunded and the customer must apply for new business. A lapse is
      reported on the policy record and breaks continuous Cardinal tenure for accident forgiveness.
    eligibility:
      - id: late_renewal_window
        applies_to: [auto_late_renewal]
        kind: time
        condition: "A late renewal is accepted only when the payment is received no later than late_renewal_acceptance_days calendar days after the policy expired for nonpayment of the renewal."
        evidence_fields: [auto_policies.end_date, auto_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.policy_id]
          action_bindings:
            auto_policies.policy_id: policy_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the policy expired for nonpayment of the renewal
          anchor_source: auto_policies.end_date
          relation: not_after
          duration_source: variants.late_renewal_acceptance_days
          unit: calendar_days
          counting_rule: "Days are counted from the end_date on the policy record, the end date being day 0, and a payment on the last day of the window is accepted."
          boundary: inclusive
      - id: nonrenewal_notice_timely
        applies_to: [auto_nonrenew]
        kind: caller_fact
        condition: "The policy is nonrenewed at expiration only when a nonrenewal notice for that term was mailed no later than nonrenewal_notice_days calendar days before the term expiration date."
        evidence_fields: [auto_transactions.notice_date, auto_transactions.term_effective_date, auto_policies.term_expiration_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_transactions.term_effective_date]
          action_bindings:
            auto_transactions.term_effective_date: term_effective_date

  - id: auto_cancellation_status
    subject: [auto_policy_inforce, auto_cancel_pending, auto_cancel_rescind, auto_cancel_effective, auto_reinstate]
    rule: >-
      The policy status follows the notices that govern it. A bound policy goes in force on its term effective date. A
      policy becomes cancel_pending when billing mails a notice of cancellation for nonpayment, or when the company mails
      an underwriting cancellation notice on new business; an underwriting cancellation is possible only within
      new_business_underwriting_days calendar days after the inception date and only on the grounds that the application
      misstated a driver or vehicle fact that would have made the package unavailable. A pending cancellation is
      rescinded when billing records the cure before the cancellation effective date; otherwise the policy is cancelled
      on that date. A cancelled policy is reinstated only when its billing account is reinstated under
      billing_reinstatement; reinstatement restores the term with a lapse from the cancellation effective date to the
      reinstatement date unless billing reinstates without lapse, and writes back as additional premium the return
      premium credited at cancellation. A policy cancelled at the insured's request or flat cancelled cannot be
      reinstated; the customer applies for new business. A cancelled policy is reinstated only when its billing account
      status is current again after a billing reinstatement.
    eligibility:
      - id: billing_reinstated_first
        applies_to: [auto_reinstate]
        kind: state
        condition: "A cancelled policy is reinstated only when its billing account status is current again after a billing reinstatement."
        evidence_fields: [billing_accounts.status, billing_accounts.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [billing_accounts.policy_id]
          action_bindings:
            billing_accounts.policy_id: policy_id
        state_contract:
          field: billing_accounts.status
          allowed: [current]
    params:
      underwriting_cancellation_grounds: material_misstatement_of_driver_or_vehicle_fact

  - id: auto_combo_financial_responsibility
    subject: [auto_filing_flag_update, auto_package_change, auto_driver_exclude]
    rule: >-
      Holding a financial-responsibility filing changes what the auto policy may do. The financial-responsibility
      indicator is switched on when an SR-22 or FR-44 filing is requested on the policy and switched off only when no
      filing on the policy remains requested, filed, accepted or cancel_notified. While the indicator is on, the policy
      may be on a package with sr22_eligible true only; a policy holding a filing cannot be moved to a package with
      sr22_eligible false. A filing can be requested only on a policy whose current package has sr22_eligible true. The
      driver named on a filing cannot be excluded while the filing is active; the exclusion of a filed driver is declined.
      Mutual exclusion: a driver cannot be both excluded on the policy and the subject of a filing on it.
    eligibility:
      - id: package_allows_filing
        applies_to: [auto_filing_flag_update]
        kind: caller_fact
        condition: "A filing can be requested only on a policy whose current package has sr22_eligible true."
        evidence_fields: [auto_policies.variant_name, auto_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.policy_id]
          action_bindings:
            auto_policies.policy_id: policy_id

  - id: auto_rideshare_endorsement
    subject: [auto_rideshare_change]
    rule: >-
      The rideshare endorsement extends liability and physical damage coverage to the period a driver is logged into a
      transportation network company app and waiting for a ride request, the gap the network's own insurance does not
      cover. It may be added only where rideshare_endorsement_available is true on the package, only to a scheduled
      vehicle and only while the policy is in_force. The policy status must be in_force when a rideshare change is
      processed. The endorsement premium is the package's rideshare_endorsement_premium per vehicle per term, prorated
      under auto_evt_midterm_proration. Delivery driving for food or package delivery platforms is not covered by this
      endorsement.
    eligibility:
      - id: policy_in_force_for_rideshare
        applies_to: [auto_rideshare_change]
        kind: state
        condition: "The policy status must be in_force when a rideshare change is processed."
        evidence_fields: [auto_policies.status, auto_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.policy_id]
          action_bindings:
            auto_policies.policy_id: policy_id
        state_contract:
          field: auto_policies.status
          allowed: [in_force]
