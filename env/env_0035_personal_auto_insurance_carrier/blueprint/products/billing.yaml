# Product charter: Cardinal Billing Account (pay plan of one auto policy).
# Path: env/env_0035_personal_auto_insurance_carrier/blueprint/products/billing.yaml
#
# Capability matrix (functional closure audit):
#   open        account opened with the policy; pay plan chosen; down payment and policy fee billed
#   in term     installment invoices, installment fees, premium changes from endorsements (AP spread or billed now,
#               RP credited), payments by channel, payment application order, autopay drafts and retries
#   money       late fee (grace, cap, courtesy waiver), returned-payment (NSF) fee and reversal, certified-funds
#               restriction, phone-representative payment fee, credits, refunds, small-balance write-off
#   suspend     notice of cancellation for nonpayment with state notice period and mailing allowance; rescission
#   exit        cancellation for nonpayment, final earned-premium bill, collections referral, account close
#   reinstate   reinstatement window, without-lapse window, signed no-loss statement, reinstatement fee, per-term cap
#   changes     pay plan change, payment method / autopay change, due-day change, SR-22 plan restriction
#   exceptions  payment after the window, repeated NSF, underpayment within tolerance, overpayment, credit transfer

category: billing
display_name: Cardinal Billing Account

binding:
  holding_table: billing_accounts
  event_tables: [billing_ledger]
  intake_tables: [billing_reinstatement_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {account_balance: account_balance}

lifecycle:
  states: [current, notice_pending, cancelled_nonpay, collections, closed]
  transitions:
    - {from: current, to: notice_pending, by: system, means: A notice of cancellation for nonpayment is mailed and the account waits for the cure or the cancellation effective date.}
    - {from: notice_pending, to: current, by: system, means: The amount required to rescind is received on or before the cancellation effective date and the notice is rescinded.}
    - {from: notice_pending, to: cancelled_nonpay, by: system, means: The cancellation effective date passes without the cure and the policy is cancelled for nonpayment.}
    - {from: cancelled_nonpay, to: current, by: agent, means: The account is reinstated after the reinstatement payment (and, where required, the signed no-loss statement) is received within the window.}
    - {from: cancelled_nonpay, to: collections, by: system, means: An earned-premium balance left unpaid after cancellation is referred to collections.}
    - {from: cancelled_nonpay, to: closed, by: system, means: After the reinstatement window, the final balance is zero, refunded or written off and the account closes.}
    - {from: current, to: closed, by: system, means: The policy ended (insured cancellation, nonrenewal, expiration) and the final balance is settled.}
    - {from: collections, to: closed, by: system, means: The collections balance is paid or written off and the account closes.}

accounts:
  - key: account_balance
    unit: USD
    meaning: Amount billed and not yet paid on the account; positive means the customer owes, negative means a credit balance owed to the customer.

parameter_schema:
  down_payment_pct: Percent of the full-term premium billed as the down payment at issue or renewal, percent.
  min_down_payment_amount: Floor on the down payment; the down payment is the larger of the percentage amount and this floor, capped at the full-term premium, USD.
  installment_interval_months: Months between installment due dates after the down payment (0 = no installments; the plan is paid in full).
  installment_fee: Fee added to every installment invoice after the down payment, USD.
  min_installment_amount: Smallest installment the plan will bill; a remaining balance below it is billed with the previous installment, USD.
  autopay_required: Boolean switch; whether the plan requires automatic payments.
  eligible_payment_methods: List of payment methods the plan accepts (check_or_money_order, credit_card, debit_card, bank_eft).
  pay_plan_discount_pct: Premium discount for the pay plan, entered into the auto rating discount sum, percent.
  financial_responsibility_plan_allowed: Boolean switch; whether a policy carrying an SR-22 or FR-44 filing may use this plan.
  invoice_lead_days: Calendar days before each due date on which the invoice (or the autopay draft notice) is issued, integer.
  autopay_draft_offset_days: Calendar days before the due date on which the automatic payment is drafted (0 = on the due date), integer.
  autopay_retry_days: Calendar days after a failed draft on which the draft is presented once more, integer (0 = no retry).
  autopay_retries: Number of re-presentments after a failed draft, integer.
  autopay_failures_before_plan_change: Failed drafts in the nsf lookback after which autopay is removed and the account moves to the fallback plan, integer (0 = not applicable).
  autopay_failure_fallback_rank: Rank of the plan the account moves to after too many failed drafts, integer (0 = not applicable).
  late_fee: Fee charged when an installment remains unpaid after the late-fee grace days, USD.
  late_fee_grace_days: Calendar days after the due date before the late fee is charged, integer.
  late_fee_max_per_term: Maximum late fees charged in one policy term, integer.
  courtesy_late_fee_waivers_per_12_months: Late fees that may be waived on request in a rolling 12 months, integer.
  nsf_fee: Fee charged for each returned payment, USD.
  nsf_limit_before_certified_funds: Returned payments in the lookback after which only certified funds are accepted, integer.
  nsf_lookback_months: Rolling months over which returned payments are counted, integer.
  certified_funds_months: Months the certified-funds restriction lasts after it is imposed, integer.
  phone_representative_payment_fee: Fee for a one-time payment taken by a customer service representative by phone, USD (self-service channels are free).
  payment_posting_cutoff: Local Eastern time after which a same-day payment posts the next calendar day, HH:MM.
  underpayment_tolerance: Shortfall up to which an installment is treated as paid for late-fee and notice purposes; the shortfall stays on the balance, USD.
  overpayment_applied_to_next_installment: Boolean switch; whether an overpayment is held as a credit against the next installment rather than refunded.
  noc_trigger_days_past_due: Calendar days after an installment due date on which a notice of cancellation is issued if the installment is still unpaid, integer.
  noc_min_past_due: Smallest past-due amount for which a notice of cancellation is issued, USD.
  cancellation_notice_days_by_state: Mapping state -> minimum calendar days between the notice mail date and the cancellation effective date for nonpayment.
  mailing_allowance_days: Calendar days added to the state notice period for mailing, integer.
  cancellation_effective_time: Clock time at which a cancellation or reinstatement takes effect on its date.
  rescission_cutoff_days: Calendar days after the cancellation effective date by which the rescission payment must be received (0 = on or before the effective date), integer.
  reinstatement_window_days: Calendar days after the cancellation effective date within which reinstatement is available, integer.
  reinstatement_without_lapse_days: Calendar days after the cancellation effective date within which a reinstatement payment restores coverage with no lapse, integer (0 = never without lapse).
  no_loss_statement_required: Boolean switch; whether a reinstatement with a lapse requires the named insured's signed statement of no loss during the lapse.
  reinstatement_fee: Fee charged on each reinstatement, USD.
  max_reinstatements_per_term: Maximum reinstatements in one policy term, integer.
  earned_premium_due_days: Calendar days after cancellation within which the final earned-premium bill is due, integer.
  collections_referral_days: Calendar days after cancellation after which an unpaid final balance is referred to collections, integer.
  collections_min_balance: Smallest unpaid final balance that is referred to collections, USD.
  small_balance_writeoff_max: Largest final balance written off instead of billed or refunded, USD.
  refund_min_amount: Smallest credit balance refunded at account close; smaller credits are written off, USD.
  refund_issue_days: Calendar days after the credit arises within which a refund is issued, integer.
  refund_check_clearing_days: Business days a payment made by check or EFT must clear before it can be refunded, integer.
  refund_to_original_method: Boolean switch; whether refunds go back to the electronic method that paid (otherwise by check to the mailing address).
  ap_billing_method: How additional premium is billed (spread_over_remaining_installments or bill_immediately).
  ap_immediate_due_days: Calendar days after the endorsement on which additional premium billed immediately is due, integer.
  rp_billing_method: How return premium is applied (reduce_remaining_installments or credit_balance).
  due_day_change_max_per_term: Due-day changes allowed in one term, integer.
  due_day_shift_max_days: Maximum calendar days a due day may move in one change, integer.
  plan_change_allowed_midterm: Boolean switch; whether the account may leave this plan during the term.
  renewal_bill_lead_days: Calendar days before term expiration on which the renewal down payment is billed, integer.

