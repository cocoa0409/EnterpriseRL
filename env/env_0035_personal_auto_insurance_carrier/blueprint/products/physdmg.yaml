events:
  # ---- holding writes (physdmg_coverages) ---------------------------------------------------
  - type: physdmg_coverage_add
    target: physdmg_coverages
    mutation: create
    meaning: Collision and comprehensive are attached to a scheduled vehicle at a chosen deductible option.
    grain: One row per vehicle coverage.
    fields:
      coverage_id: Physical damage coverage reference.
      customer_id: Named insured.
      policy_id: Policy the vehicle is scheduled on.
      vehicle_id: Vehicle covered.
      variant_name: Deductible option chosen.
      effective_date: Date physical damage takes effect.
      inspection_due_date: Last day for the photo inspection (empty when exempt).
      loan_lease_payoff: Whether the loan/lease payoff option is carried.
      deductible_rewards_enrolled: Whether Deductible Rewards is enrolled.
      loss_payee_name: Lienholder or lessor exactly as on the contract, empty if owned.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: coverage_id, effective_date: effective_date, reason_code: coverage_added}
      - event: physdmg:physdmg_deductible_credit_earned
        when: {deductible_rewards_enrolled: true}
        map: {coverage_id: coverage_id, customer_id: customer_id, credit_reason: enrollment}
  - type: physdmg_inspection_complete
    target: physdmg_coverages
    mutation: {transition: {from: pending_inspection, to: active}}
    meaning: The photo inspection is accepted, or the vehicle is confirmed exempt, and coverage is active.
    grain: One row per transaction.
    fields:
      status: Set to active.
      inspection_completed_date: Date the inspection was accepted (the effective date when exempt).
    triggers: []
  - type: physdmg_inspection_lapse
    target: physdmg_coverages
    mutation: {transition: {from: pending_inspection, to: removed}}
    meaning: The inspection was not completed in time and physical damage comes off the vehicle.
    grain: One row per transaction.
    fields:
      vehicle_id: Vehicle concerned.
      status: Set to removed.
      end_date: Day after the inspection due date.
      policy_id: Policy concerned.
      customer_id: Named insured.
      coverage_id: Coverage removed.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: coverage_id, effective_date: end_date, reason_code: coverage_removed}
  - type: physdmg_storage_start
    target: physdmg_coverages
    mutation: {transition: {from: active, to: storage}}
    meaning: The vehicle is put in storage at the customer's request; collision is suspended and comprehensive stays.
    grain: One row per transaction.
    fields:
      vehicle_id: Vehicle concerned.
      status: Set to storage.
      storage_start_date: First day of storage.
      policy_id: Policy concerned.
      customer_id: Named insured.
      coverage_id: Coverage concerned.
    triggers:
      - event: rental:rental_coverage_suspend
        map: {coverage_id: coverage_id}
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: coverage_id, effective_date: storage_start_date, reason_code: coverage_removed}
  - type: physdmg_storage_end
    target: physdmg_coverages
    mutation: {transition: {from: storage, to: active}}
    meaning: The stored vehicle returns to use and collision is restored.
    grain: One row per transaction.
    fields:
      vehicle_id: Vehicle concerned.
      status: Set to active.
      storage_start_date: Cleared.
      policy_id: Policy concerned.
      customer_id: Named insured.
      coverage_id: Coverage concerned.
    triggers:
      - event: rental:rental_coverage_resume
        map: {coverage_id: coverage_id}
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: coverage_id, reason_code: coverage_added}
  - type: physdmg_coverage_remove
    target: physdmg_coverages
    mutation:
      transition:
        - {from: active, to: removed}
        - {from: storage, to: removed}
    meaning: Physical damage is removed from the vehicle.
    grain: One row per transaction.
    fields:
      vehicle_id: Vehicle concerned.
      status: Set to removed.
      end_date: Date physical damage ends.
      policy_id: Policy concerned.
      customer_id: Named insured.
      coverage_id: Coverage removed.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: coverage_id, effective_date: end_date, reason_code: coverage_removed}
      - event: rental:rental_coverage_remove
        map: {coverage_id: coverage_id}
  - type: physdmg_deductible_change
    target: physdmg_coverages
    mutation: update
    meaning: The deductible option on the vehicle is changed.
    grain: One row per transaction.
    fields:
      vehicle_id: Vehicle concerned.
      variant_name: New deductible option.
      deductible_change_effective_date: Date the new option takes effect.
      policy_id: Policy concerned.
      customer_id: Named insured.
      coverage_id: Coverage changed.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: coverage_id, effective_date: deductible_change_effective_date, reason_code: deductible_change}
  - type: physdmg_option_update
    target: physdmg_coverages
    mutation: update
    meaning: The loan/lease payoff option, Deductible Rewards enrollment or the loss payee on the coverage is changed.
    grain: One row per transaction.
    fields:
      loan_lease_payoff: Whether the loan/lease payoff option is carried.
      deductible_rewards_enrolled: Whether Deductible Rewards is enrolled.
      loss_payee_name: Lienholder or lessor exactly as on the contract, empty if owned.
    triggers: []
  # ---- event-table writes (physdmg_claim_events) --------------------------------------------
  - type: physdmg_claim_report
    target: physdmg_claim_events
    meaning: First notice of a loss to the covered vehicle is recorded and a claim number is assigned.
    grain: One row per claim.
    distinguish_by: [claim_number]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim number assigned.
      loss_date: Date of the loss.
      report_date: Date the loss was reported.
      loss_cause: Cause of loss.
      driver_id: Driver at the time of loss (empty for a parked or stolen vehicle).
      drivable: Whether the vehicle can be driven safely.
      occurrence_reference: Reference shared by every claim arising from the same occurrence.
      event_date: Date recorded.
    triggers: []
  - type: physdmg_coverage_decision
    target: physdmg_claim_events
    meaning: The claim is accepted or denied under a coverage part, with the deductible that applies.
    grain: One row per coverage decision on a claim (a reconsidered decision is a new row).
    distinguish_by: [claim_number, coverage_decision, event_date]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim decided.
      coverage_part: collision or comprehensive.
      coverage_decision: accepted or denied.
      denial_reason: Ground of a denial (none when accepted).
      deductible_amount: Deductible that applies to the claim after waivers, before any Deductible Rewards credit, USD.
      event_date: Date decided.
    triggers: []
  - type: physdmg_fault_determination
    target: physdmg_claim_events
    meaning: Liability for a collision is determined, including the other party's insurance status.
    grain: One row per fault determination on a claim (a revised determination is a new row).
    distinguish_by: [claim_number, fault_determination, insured_fault_pct, event_date]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      fault_determination: Who is at fault.
      insured_fault_pct: Percent of fault charged to the Cardinal driver.
      other_party_insured: Insurance status of the other party.
      event_date: Date determined.
    triggers: []
  - type: physdmg_estimate_written
    target: physdmg_claim_events
    meaning: A repair estimate or a supplement to it is written for the claim.
    grain: One row per estimate version (0 = original, 1, 2, ... = supplements).
    distinguish_by: [claim_number, estimate_sequence]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      estimate_sequence: 0 for the original estimate, then 1, 2, ... for supplements.
      estimate_amount: Gross amount of this estimate version (for a supplement, the supplement amount only), USD.
      repair_shop_type: Cardinal Select Shop or a shop outside the network.
      glass_work: Whether the estimate is glass work, and repair or replacement.
      event_date: Date written.
    triggers: []
  - type: physdmg_total_loss_declared
    target: physdmg_claim_events
    meaning: The vehicle is declared a total loss on the claim, with its valuation.
    grain: One row per claim declared a total loss.
    distinguish_by: [claim_number]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      acv_amount: Actual cash value from the valuation report, USD.
      estimate_amount: Repair estimate total at the declaration (0.00 for an unrecovered theft), USD.
      salvage_value: Highest salvage bid, USD.
      prior_damage_amount: Unrepaired prior damage noted in the valuation, USD.
      replacement_cost_new: Price of a new vehicle of the same make, model and trim of the current model year from the valuation report, USD.
      custom_equipment_value: Documented value of aftermarket custom parts and equipment not included in actual cash value, USD.
      odometer_at_loss: Odometer at the loss, miles.
      event_date: Date declared.
    triggers: []
  - type: physdmg_storage_notice
    target: physdmg_claim_events
    meaning: The customer is told in writing to move the vehicle from a storage yard; storage charges after the notice period are not paid.
    grain: One row per storage notice on a claim.
    distinguish_by: [claim_number, notice_date]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      notice_date: Date the notice was sent.
      event_date: Date recorded.
    triggers: []
  - type: physdmg_claim_closed
    target: physdmg_claim_events
    meaning: The claim is closed.
    grain: One row per closing of a claim (a claim reopened and closed again has two rows).
    distinguish_by: [claim_number, event_date]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      close_reason: Why closed.
      event_date: Date closed.
    triggers: []
  - type: physdmg_claim_reopened
    target: physdmg_claim_events
    meaning: A closed claim is reopened.
    grain: One row per reopening.
    distinguish_by: [claim_number, event_date]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      reopen_reason: Why reopened.
      event_date: Date reopened.
    triggers: []
  # ---- event-table writes (physdmg_payments) ------------------------------------------------
  - type: physdmg_claim_payment
    target: physdmg_payments
    meaning: A payment is issued on the claim for one component of the loss to one payee.
    grain: One row per payment (claim, component, payee, estimate version, source recovery, issue date).
    distinguish_by: [claim_number, payment_component, payee_type, estimate_sequence, source_recovery_id, payment_date]
    fields:
      payment_id: Payment reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim paid.
      payment_component: Component of the loss paid.
      payee_type: Who is paid.
      payee_name: Payee exactly as on the payment (joint payees joined by " and ").
      estimate_sequence: Estimate version paid (repair and supplement payments); empty otherwise.
      amount: Amount paid, USD.
      deductible_applied: Deductible taken from this payment, USD (0.00 when none).
      source_recovery_id: For a deductible reimbursement, the recovery it is paid from; empty otherwise.
      payment_date: Date issued.
    account: loss_paid
    direction: in
    triggers: []
  - type: physdmg_payment_void
    target: physdmg_payments
    meaning: An issued claim payment is voided (stopped or returned uncashed) and reversed.
    grain: One row per voided payment.
    distinguish_by: [source_payment_id]
    fields:
      payment_id: Void reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      source_payment_id: The payment voided.
      amount: Amount reversed, USD.
      payment_date: Date voided.
    account: loss_paid
    direction: out
    triggers: []
  - type: physdmg_recovery_received
    target: physdmg_payments
    meaning: Money is recovered on the claim from the at-fault party's insurer or from the sale of salvage.
    grain: One row per recovery receipt.
    distinguish_by: [claim_number, recovery_source, recovery_reference]
    fields:
      payment_id: Recovery reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      recovery_source: Where the money came from.
      recovery_reference: Remittance or auction settlement number.
      amount: Amount recovered, USD.
      payment_date: Date received.
    account: loss_paid
    direction: out
    triggers:
      - event: physdmg:physdmg_claim_payment
        when: {recovery_source: subrogation}
        map: {coverage_id: coverage_id, customer_id: customer_id, claim_number: claim_number, source_recovery_id: payment_id, payment_component: deductible_reimbursement, payee_type: insured}
  - type: physdmg_deductible_credit_earned
    target: physdmg_payments
    meaning: Deductible Rewards credit is granted on enrollment or for 12 claim-free months.
    grain: One row per credit grant (enrollment, or each completed 12-month claim-free period).
    distinguish_by: [credit_reason, credit_period_end]
    fields:
      payment_id: Credit entry reference.
      coverage_id: Coverage.
      customer_id: Named insured.
      credit_reason: enrollment or claim_free_year.
      credit_period_end: Last day of the 12-month period earned (the enrollment date for the enrollment credit).
      amount: Credit granted, USD.
      payment_date: Date granted.
    account: deductible_credit
    direction: in
    triggers: []
  - type: physdmg_deductible_credit_used
    target: physdmg_payments
    meaning: Deductible Rewards credit is used to reduce the deductible on a paid claim.
    grain: One row per claim on which credit is used.
    distinguish_by: [claim_number]
    fields:
      payment_id: Credit entry reference.
      coverage_id: Coverage.
      customer_id: Named insured.
      claim_number: Claim the credit was used on.
      amount: Credit used, USD.
      payment_date: Date used.
    account: deductible_credit
    direction: out
    triggers: []

measures:
  - id: physdmg_msr_claim_paid
    window: Life of the claim.
    measure: Sum of physdmg_claim_payment amounts on the claim number less physdmg_payment_void amounts on it.
  - id: physdmg_msr_claim_free_months
    window: From the later of the Deductible Rewards enrollment date and the last paid collision or comprehensive claim's payment date, to the evaluation date.
    measure: Whole calendar months elapsed without a physdmg_claim_payment on the vehicle.
  - id: physdmg_msr_occurrence_vehicles
    window: One occurrence (same occurrence_reference).
    measure: Count of claims reported under the occurrence on vehicles of the same policy, and the highest deductible among their accepted coverage decisions.
  - id: physdmg_msr_worksheet_base_premium
    window: The policy term in which the premium is rated.
    measure: physdmg_base_premium on the rating_worksheets row of the vehicle for the policy and term.
  - id: physdmg_msr_transport_days
    window: From the end of the waiting period after the loss report to the day the repair is completed or the total-loss settlement is offered.
    measure: Whole calendar days in the window for which the customer documents a rental or transportation cost.
  - id: physdmg_msr_estimate_total
    window: Life of the claim.
    measure: Sum of estimate_amount over every physdmg_estimate_written row of the claim (original plus supplements).

policies:
  - id: physdmg_agg_multi_holding
    subject: [physdmg_coverage_add]
    rule: >-
      Physical damage is held per vehicle: a vehicle carries at most one physical damage coverage at a time, and a
      customer may hold as many as the vehicles scheduled on their auto policies, with no cap of its own. A coverage can
      be added to a vehicle only when no coverage on that vehicle is pending_inspection, active or in storage. Each
      vehicle's deductible option is chosen independently; options are never pooled across vehicles.
    eligibility:
      - id: one_coverage_per_vehicle
        applies_to: [physdmg_coverage_add]
        kind: dedup
        condition: "A coverage can be added to a vehicle only when no coverage on that vehicle is pending_inspection, active or in storage."
        evidence_fields: [physdmg_coverages.vehicle_id, physdmg_coverages.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_coverages.vehicle_id]
          action_bindings:
            physdmg_coverages.vehicle_id: vehicle_id
        dedup_contract:
          table: physdmg_coverages
          mode: separate_record
          object_bindings: {vehicle_id: vehicle_id}
          duplicate_filters: {status: [pending_inspection, active, storage]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: physdmg_agg_occurrence_deductible
    subject: [physdmg_coverage_decision, physdmg_claim_payment]
    rule: >-
      When two or more vehicles on the same policy are damaged in one occurrence (same occurrence_reference) and
      single_deductible_same_occurrence is true, only one deductible is applied to the occurrence: the highest deductible
      among the accepted claims, taken from the claim with the highest deductible; the other claims of the occurrence
      record a deductible of 0.00. Deductible Rewards credit is held per vehicle and can be used only on a claim of the
      vehicle that earned it. Loss paid is tracked per vehicle and never pooled.
    eligibility: []
    measures: [physdmg_msr_occurrence_vehicles]

  - id: physdmg_attach_eligibility
    subject: [physdmg_coverage_add, physdmg_inspection_complete, physdmg_inspection_lapse]
    rule: >-
      Physical damage can be attached only to a vehicle scheduled on an auto policy whose package has
      physical_damage_eligible true. Physical damage is added only while the auto policy status is bound or in_force.
      A financed or leased vehicle must carry physical damage with its lienholder or lessor as loss payee for as long as
      the lien or lease lasts. New physical damage starts no earlier than the date of the request (except under
      physdmg_newly_acquired_vehicle) and is pending_inspection until a photo inspection of the vehicle is accepted; a
      vehicle bought new from a dealer with a bill of sale is exempt where inspection_exempt_if_purchased_new is true and
      goes active the same day. Physical damage becomes active only when the photo inspection is accepted no later than
      inspection_due_days calendar days after the physical damage effective date. Days are counted from the coverage
      effective_date, that date being day 0, and an inspection accepted on the last day is in time. When the window
      passes without an accepted inspection, physical damage is removed the next day and the unearned premium is
      returned; a loss occurring while coverage is pending_inspection is still covered when it is reported before the
      removal. The loan/lease payoff option can be carried only on a financed or leased vehicle.
    eligibility:
      - id: auto_policy_open
        applies_to: [physdmg_coverage_add]
        kind: state
        condition: "Physical damage is added only while the auto policy status is bound or in_force."
        evidence_fields: [auto_policies.status, auto_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.policy_id]
          action_bindings:
            auto_policies.policy_id: policy_id
        state_contract:
          field: auto_policies.status
          allowed: [bound, in_force]
      - id: inspection_in_time
        applies_to: [physdmg_inspection_complete]
        kind: time
        condition: "Physical damage becomes active only when the photo inspection is accepted no later than inspection_due_days calendar days after the physical damage effective date."
        evidence_fields: [physdmg_coverages.effective_date, physdmg_coverages.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_coverages.coverage_id]
          action_bindings:
            physdmg_coverages.coverage_id: coverage_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the physical damage effective date
          anchor_source: physdmg_coverages.effective_date
          relation: not_after
          duration_source: variants.inspection_due_days
          unit: calendar_days
          counting_rule: "Days are counted from the coverage effective_date, that date being day 0, and an inspection accepted on the last day is in time."
          boundary: inclusive

  - id: physdmg_newly_acquired_vehicle
    subject: [physdmg_coverage_add, physdmg_coverage_decision]
    rule: >-
      A newly acquired vehicle is automatically covered for collision and comprehensive from its acquisition date,
      provided physical damage is carried on at least one vehicle already scheduled on the policy; during that automatic
      period a loss carries the newly_acquired_deductible. To keep physical damage from the acquisition date, the
      customer must ask for it within newly_acquired_report_days.
      Physical damage takes effect on the acquisition date only when it is requested no later than
      newly_acquired_report_days calendar days after the customer acquired the vehicle. The count starts on the
      acquisition_date of the vehicle record as day 0, and a request on the last day of the window is in time. A request
      after the window starts physical damage on the request date and no automatic coverage applies to a loss before
      then. If no vehicle on the policy carries physical damage, a newly acquired vehicle has no automatic physical
      damage at all.
    eligibility:
      - id: newly_acquired_physdmg_window
        applies_to: [physdmg_coverage_add]
        kind: time
        condition: "Physical damage takes effect on the acquisition date only when it is requested no later than newly_acquired_report_days calendar days after the customer acquired the vehicle."
        evidence_fields: [vehicles.acquisition_date, vehicles.vehicle_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vehicles.vehicle_id]
          action_bindings:
            vehicles.vehicle_id: vehicle_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the customer acquired the vehicle
          anchor_source: vehicles.acquisition_date
          relation: not_after
          duration_source: variants.newly_acquired_report_days
          unit: calendar_days
          counting_rule: "The count starts on the acquisition_date of the vehicle record as day 0, and a request on the last day of the window is in time."
          boundary: inclusive

  - id: physdmg_evt_premium
    subject: [physdmg_coverage_add, physdmg_deductible_change, physdmg_option_update]
    rule: >-
      The full-term physical damage premium of a vehicle is the physdmg_base_premium on the vehicle's rating worksheet
      for the term, multiplied by the deductible option's deductible_factor, and, when the loan/lease payoff option is
      carried, further multiplied by (1 + loan_lease_payoff_premium_pct / 100), rounded to the cent (half up). This
      premium enters the auto policy's base premium, where surcharges and discounts are applied under
      auto_evt_premium_rating, and every change to it during the term is prorated as additional or return premium on the
      auto policy. While the vehicle is in storage its physical damage premium is the comprehensive share only, which is
      storage_comprehensive_share_pct percent of the full physical damage premium. Deductible Rewards carries no premium.
    eligibility: []
    measures: [physdmg_msr_worksheet_base_premium]
    formula:
      physdmg_premium: round(physdmg_msr_worksheet_base_premium * deductible_factor * (1 + loan_lease_payoff_premium_pct / 100 * loan_lease_payoff), 2)
    params:
      storage_comprehensive_share_pct: 40

  - id: physdmg_claim_coverage
    subject: [physdmg_claim_report, physdmg_coverage_decision, physdmg_claim_closed, physdmg_claim_reopened]
    rule: >-
      A claim is covered only when the vehicle carried physical damage that was pending_inspection, active or (for a
      comprehensive loss) in storage on the loss date, and the auto policy was in force on the loss date. The coverage
      part follows the cause of loss: collision with another vehicle or object, rollover and a hit-and-run collision are
      collision; theft, vandalism, fire, hail, wind, flood, falling objects, glass breakage and hitting an animal (per
      animal_strike_coverage_part) are comprehensive. While the vehicle is in storage only comprehensive losses are
      covered. A claim is denied when the driver was excluded on the auto policy on the loss date, when the driver was a
      household member who should have been listed and was not, when the vehicle was used for a transportation network
      company and no rideshare endorsement was carried, when the damage is wear and tear, mechanical or electrical
      breakdown, freezing, or road damage to tires alone, or when the loss was intentional. Loss in market value after a
      repair (diminished value) is not paid where first_party_diminished_value_covered is false. A loss is decided at the
      desk only when it is reported no more than late_report_review_days calendar days after the loss date; a later report
      is referred to a claims supervisor and is not decided at the desk. Report lateness is counted in calendar days from
      the loss_date as day 0 to the report_date, and a report on the last day is timely. A claim number is assigned once per damaged
      vehicle per occurrence; a second report of the same loss is attached to the existing claim. A claim is closed when
      every payment due has been issued, when it is denied, when the estimate is below the deductible, or when the
      customer withdraws it; a closed claim is reopened for a supplement, a recovered theft vehicle or a recovery.
    eligibility:
      - id: one_claim_per_vehicle_occurrence
        applies_to: [physdmg_claim_report]
        kind: dedup
        condition: "A claim number is assigned once per damaged vehicle per occurrence; a second report of the same loss is attached to the existing claim."
        evidence_fields: [physdmg_claim_events.coverage_id, physdmg_claim_events.occurrence_reference, physdmg_claim_events.loss_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_claim_events.coverage_id, physdmg_claim_events.occurrence_reference]
          action_bindings:
            physdmg_claim_events.coverage_id: coverage_id
            physdmg_claim_events.occurrence_reference: occurrence_reference
        dedup_contract:
          table: physdmg_claim_events
          mode: separate_record
          object_bindings: {coverage_id: coverage_id, occurrence_reference: occurrence_reference}
          duplicate_filters: {event_type: [physdmg_claim_report]}
          distinct_fields: []
      - id: timely_report
        applies_to: [physdmg_claim_report]
        kind: time
        condition: "A loss is decided at the desk only when it is reported no more than late_report_review_days calendar days after the loss date"
        evidence_fields: [physdmg_claim_events.loss_date, physdmg_claim_events.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_claim_events.claim_number]
          action_bindings:
            physdmg_claim_events.claim_number: claim_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the loss date
          anchor_source: physdmg_claim_events.loss_date
          relation: not_after
          duration_source: variants.late_report_review_days
          unit: calendar_days
          counting_rule: "Report lateness is counted in calendar days from the loss_date as day 0 to the report_date, and a report on the last day is timely."
          boundary: inclusive

  - id: physdmg_evt_deductible
    subject: [physdmg_coverage_decision, physdmg_claim_payment, physdmg_deductible_credit_used]
    rule: >-
      The deductible on an accepted claim is fixed in this order. Step 1, base: collision_deductible for a collision
      claim; for a comprehensive claim, glass_repair_deductible when glass is repaired, glass_replacement_deductible when
      glass is replaced, otherwise comprehensive_deductible; during the automatic period of a newly acquired vehicle the
      newly_acquired_deductible instead. The option in force is the one effective on the loss
      date. Step 2, waivers: where collision_deductible_waiver is true, the collision deductible is waived when the
      latest fault determination is other_party_at_fault with no share of fault on the Cardinal driver and the other
      party is identified and uninsured; a hit-and-run with an unidentified driver does not qualify. Step 3, occurrence: physdmg_agg_occurrence_deductible.
      Step 4, Deductible Rewards: the credit balance reduces the remaining deductible, credit used = min(credit balance,
      deductible), and the credit used is debited from the balance when the payment that takes the deductible is
      issued. The deductible is taken once per claim, from the first payment of the repair or the settlement, never from
      towing, storage, pet injury or transportation payments.
    eligibility: []
    formula:
      deductible_net: max(0, deductible_amount - min(deductible_credit, deductible_amount))

  - id: physdmg_evt_repair_payment
    subject: [physdmg_estimate_written, physdmg_claim_payment, physdmg_storage_notice]
    rule: >-
      A repair payment is issued only after the claim is accepted. A claim payment is issued only when the latest
      coverage decision on the claim is accepted. The first repair payment pays the original estimate less the
      deductible (net of Deductible Rewards credit); each supplement is paid in full as its own payment, and a supplement
      at or above supplement_reinspection_threshold is reinspected before payment. When every estimate version together is
      at or below the deductible, nothing is paid and the claim closes below deductible. At a Cardinal Select Shop the
      payment goes to the shop and the repair carries select_shop_workmanship_warranty; elsewhere it goes to the insured
      at non_network_labor_rate_basis, and a repair payment at or above lienholder_joint_check_threshold on a vehicle with
      a loss payee names the loss payee jointly. Original manufacturer parts are used on vehicles of
      oem_parts_max_vehicle_age_years model years or newer; driver-assistance calibration is paid where
      adas_calibration_covered. Towing from the scene is paid up to tow_from_scene_max_miles. Storage is paid up to
      storage_daily_max per day through storage_days_after_notice days after the storage notice. Veterinary bills of a dog
      or cat injured in a covered collision are paid up to pet_injury_limit without a deductible. Aftermarket custom
      equipment is paid up to custom_equipment_limit. A payment that was issued in error, or that is returned uncashed, is
      voided and reissued as a new payment.
    eligibility:
      - id: claim_accepted
        applies_to: [physdmg_claim_payment]
        kind: state
        condition: "A claim payment is issued only when the latest coverage decision on the claim is accepted."
        evidence_fields: [physdmg_claim_events.coverage_decision, physdmg_claim_events.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_claim_events.claim_number]
          action_bindings:
            physdmg_claim_events.claim_number: claim_number
        state_contract:
          field: physdmg_claim_events.coverage_decision
          allowed: [accepted]
    measures: [physdmg_msr_estimate_total, physdmg_msr_claim_paid]

  - id: physdmg_total_loss
    subject: [physdmg_total_loss_declared, physdmg_claim_payment, physdmg_coverage_remove]
    rule: >-
      The vehicle is a total loss when the repair estimate total is at or above the policy_state's percentage in
      total_loss_threshold_pct_by_state of the actual cash value, or when a stolen vehicle is not recovered. Actual cash
      value comes from a valuation report of at least acv_min_comparables comparable vehicles within
      acv_comparable_radius_miles of the garaging ZIP. The settlement is computed in this order: actual cash value, less
      unrepaired prior damage where prior_damage_deduction_applies, plus sales tax at the policy_state's rate in
      sales_tax_rate_by_state on that adjusted value, plus the state's title fee from title_fee_by_state, plus aftermarket
      custom equipment up to custom_equipment_limit, less the deductible (net of Deductible Rewards credit), less the
      salvage_value when the customer keeps the vehicle as owner-retained salvage (where owner_retained_salvage_allowed);
      each step is rounded to the cent. Where the auto package has new_car_replacement_included true and the vehicle was
      bought new, is no more than new_car_replacement_max_age_months months past its acquisition date and has no more
      than new_car_replacement_max_miles miles at the loss, replacement_cost_new replaces actual cash value in the first
      step and no prior damage is deducted. A loss payee is paid first, up to the loan or lease payoff on the payoff
      letter, and the rest goes to the insured. When the payoff exceeds the settlement and the coverage carries the
      loan/lease payoff option, the difference is paid to the loss payee up to loan_lease_payoff_pct_of_acv of actual
      cash value; the deductible, past-due loan payments, late charges and lease excess-wear or excess-mileage charges
      are never part of that difference. The settlement is paid only after the customer has accepted the settlement
      offer, and within total_loss_payment_days after the signed title (or owner-retained salvage paperwork) and the
      acceptance are received. A total-loss settlement is paid only when the settlement offer for that claim has been
      accepted by the customer. An unrecovered stolen vehicle is settled only after theft_settlement_wait_days calendar days
      have passed since the theft was reported. Days are counted from the report_date of the theft claim, that date being day 0,
      and settlement is allowed from the last day of the waiting period onward. A vehicle recovered after settlement
      belongs to Cardinal; the customer may buy it back within theft_recovery_buyback_days of the recovery notice by
      returning the settlement less the vehicle's damage. A customer who disputes actual cash value may invoke appraisal,
      each side paying its own appraiser and sharing the umpire; the disputed claim is not settled at the desk. Physical
      damage on the vehicle is removed once the settlement is paid.
    eligibility:
      - id: settlement_accepted
        applies_to: [physdmg_claim_payment]
        kind: state
        condition: "A total-loss settlement is paid only when the settlement offer for that claim has been accepted by the customer."
        evidence_fields: [physdmg_total_loss_settlements.offer_status, physdmg_total_loss_settlements.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_total_loss_settlements.claim_number]
          action_bindings:
            physdmg_total_loss_settlements.claim_number: claim_number
        state_contract:
          field: physdmg_total_loss_settlements.offer_status
          allowed: [accepted]
      - id: theft_wait_elapsed
        applies_to: [physdmg_claim_payment]
        kind: time
        condition: "An unrecovered stolen vehicle is settled only after theft_settlement_wait_days calendar days have passed since the theft was reported."
        evidence_fields: [physdmg_claim_events.report_date, physdmg_claim_events.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_claim_events.claim_number]
          action_bindings:
            physdmg_claim_events.claim_number: claim_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the theft was reported
          anchor_source: physdmg_claim_events.report_date
          relation: not_before
          duration_source: variants.theft_settlement_wait_days
          unit: calendar_days
          counting_rule: "Days are counted from the report_date of the theft claim, that date being day 0, and settlement is allowed from the last day of the waiting period onward."
          boundary: inclusive
    formula:
      settlement_before_deductible: round(acv_amount - prior_damage_amount, 2) + round((acv_amount - prior_damage_amount) * sales_tax_rate_by_state / 100, 2) + title_fee_by_state + min(custom_equipment_limit, custom_equipment_value)
      settlement_net: settlement_before_deductible - deductible_amount

  - id: physdmg_evt_recovery_and_reimbursement
    subject: [physdmg_recovery_received, physdmg_claim_payment, physdmg_payment_void, physdmg_fault_determination]
    rule: >-
      Fault on a collision claim is determined from the police report, the drivers' statements and the physical evidence,
      and the Cardinal driver's share is recorded as insured_fault_pct with the other party's insurance status; a revised
      determination is recorded as a new determination and the latest one governs. The claim counts as an at-fault
      accident of the Cardinal driver when insured_fault_pct is above at_fault_record_threshold_pct. Subrogation is pursued
      against the other party only when insured_fault_pct is below the policy_state's bar in
      subrogation_fault_bar_pct_by_state, for the other party's share of what was paid plus the deductible.
      When the other party is at fault, Cardinal pursues subrogation for what it paid plus the insured's deductible. A
      subrogation recovery first reimburses the insured's deductible in the same proportion that the recovery bears to the
      total loss (amount paid plus deductible), rounded to the cent, and the reimbursement is paid to the insured as its
      own payment tied to that recovery; Deductible Rewards credit used on the claim is restored to the vehicle's credit
      in the same proportion instead of being paid in cash. Salvage proceeds are kept by Cardinal and reimburse no
      deductible. A recovery is recorded once per remittance. A voided payment reverses its amount from loss paid.
    eligibility: []
    formula:
      deductible_reimbursement: round(deductible_applied * amount / (physdmg_msr_claim_paid + deductible_applied), 2)
    measures: [physdmg_msr_claim_paid]
    params:
      at_fault_record_threshold_pct: 50
      subrogation_fault_bar_pct_by_state: {OH: 51, IN: 51, KY: 100, VA: 1, WV: 50}

  - id: physdmg_deductible_rewards
    subject: [physdmg_deductible_credit_earned, physdmg_deductible_credit_used, physdmg_option_update]
    rule: >-
      Deductible Rewards can be enrolled only on an option with deductible_rewards_available true, and grants
      deductible_rewards_enrollment_credit on enrollment. For each 12 consecutive months without a paid collision or
      comprehensive claim on the vehicle (physdmg_msr_claim_free_months), deductible_rewards_annual_credit is granted, and
      the balance never exceeds deductible_rewards_max_credit; a grant that would exceed it is reduced to the cap. A
      12-month period earns credit once; a credit is granted only for a completed claim-free period that has not already
      earned a credit. Using credit on a claim starts a new 12-month period from that claim's payment date. Unenrolling,
      changing to an option without Deductible Rewards, or removing physical damage forfeits the remaining credit;
      credit is never paid in cash.
    eligibility:
      - id: period_not_already_credited
        applies_to: [physdmg_deductible_credit_earned]
        kind: dedup
        condition: "a credit is granted only for a completed claim-free period that has not already earned a credit"
        evidence_fields: [physdmg_payments.coverage_id, physdmg_payments.credit_period_end]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_payments.coverage_id, physdmg_payments.credit_period_end]
          action_bindings:
            physdmg_payments.coverage_id: coverage_id
            physdmg_payments.credit_period_end: credit_period_end
        dedup_contract:
          table: physdmg_payments
          mode: separate_record
          object_bindings: {coverage_id: coverage_id, credit_period_end: credit_period_end}
          duplicate_filters: {event_type: [physdmg_deductible_credit_earned]}
          distinct_fields: []
    measures: [physdmg_msr_claim_free_months]
    formula:
      credit_granted: min(deductible_rewards_annual_credit, deductible_rewards_max_credit - deductible_credit)
    params:
      per_tier:
        Cardinal Physical Damage $2,000 Deductible: {enrollment_credit: "=deductible_rewards_enrollment_credit", annual_credit: "=deductible_rewards_annual_credit", max_credit: "=deductible_rewards_max_credit"}
        Cardinal Physical Damage $1,000 Deductible: {enrollment_credit: "=deductible_rewards_enrollment_credit", annual_credit: "=deductible_rewards_annual_credit", max_credit: "=deductible_rewards_max_credit"}
        Cardinal Physical Damage $750 Deductible: {enrollment_credit: "=deductible_rewards_enrollment_credit", annual_credit: "=deductible_rewards_annual_credit", max_credit: "=deductible_rewards_max_credit"}
        Cardinal Physical Damage $500 Deductible: {enrollment_credit: "=deductible_rewards_enrollment_credit", annual_credit: "=deductible_rewards_annual_credit", max_credit: "=deductible_rewards_max_credit"}
        Cardinal Physical Damage $250 Deductible: {enrollment_credit: "=deductible_rewards_enrollment_credit", annual_credit: "=deductible_rewards_annual_credit", max_credit: "=deductible_rewards_max_credit"}
        Cardinal Physical Damage $100 Deductible: {enrollment_credit: "=deductible_rewards_enrollment_credit", annual_credit: "=deductible_rewards_annual_credit", max_credit: "=deductible_rewards_max_credit"}

  - id: physdmg_storage_and_changes
    subject: [physdmg_storage_start, physdmg_storage_end, physdmg_coverage_remove, physdmg_deductible_change]
    rule: >-
      A vehicle may be put in storage when the customer expects it to be off the road for at least storage_min_days;
      collision is suspended and comprehensive stays in force, and no claim for a collision loss during storage is
      covered. Storage ends on the day the customer asks to drive the vehicle again. A financed or leased vehicle may be
      put in storage but its physical damage cannot be removed while the loss payee is on the coverage. A deductible
      increase takes effect today or a later date the customer chooses within the auto endorsement window; a deductible
      decrease takes effect only after a new photo inspection is accepted where deductible_decrease_requires_inspection
      is true. A deductible change never applies to a loss that occurred before its effective date. Physical damage is
      removed when the customer asks (unless a loss payee is on it), when the vehicle is removed from the policy, when
      the auto package no longer allows physical damage, or when a total-loss settlement is paid. Removing physical
      damage also removes the rental reimbursement option on the vehicle.
    eligibility: []

  - id: physdmg_evt_transportation_expense
    subject: [physdmg_claim_payment]
    rule: >-
      When the vehicle has a covered loss and carries no Cardinal Rental Reimbursement option, the built-in
      transportation expense pays the customer's documented rental or transportation costs of transportation_expense_daily
      per day up to transportation_expense_max per loss. It starts transportation_wait_hours_theft hours after a total
      theft is reported, or transportation_wait_hours_other hours after any other covered loss, and ends when the vehicle
      is repaired, or when the total-loss settlement is offered. When the vehicle carries a rental reimbursement option,
      the built-in benefit does not apply and the two are never added together. It is paid without a deductible as
      payment_component transportation_expense.
    eligibility: []
    measures: [physdmg_msr_transport_days]
    formula:
      transportation_payment: min(transportation_expense_daily * physdmg_msr_transport_days, transportation_expense_max)
