events:
  # ---- holding writes (rental_coverages) ----------------------------------------------------
  - type: rental_coverage_add
    target: rental_coverages
    mutation: create
    meaning: A rental reimbursement option is attached to a vehicle that carries physical damage.
    grain: One row per vehicle option.
    fields:
      rental_coverage_id: Rental reimbursement coverage reference.
      customer_id: Named insured.
      policy_id: Policy the vehicle is scheduled on.
      vehicle_id: Vehicle covered.
      coverage_id: Physical damage coverage of the same vehicle.
      variant_name: Option chosen.
      effective_date: Date the option takes effect.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: rental_coverage_id, effective_date: effective_date, reason_code: coverage_added}
  - type: rental_coverage_suspend
    target: rental_coverages
    mutation: {transition: {from: active, to: suspended}}
    meaning: The option is suspended because the vehicle's physical damage went into storage.
    grain: One row per transaction.
    fields:
      status: Set to suspended.
      coverage_id: Physical damage coverage that went into storage.
    triggers: []
  - type: rental_coverage_resume
    target: rental_coverages
    mutation: {transition: {from: suspended, to: active}}
    meaning: The option resumes because the vehicle left storage.
    grain: One row per transaction.
    fields:
      status: Set to active.
      coverage_id: Physical damage coverage that left storage.
    triggers: []
  - type: rental_coverage_remove
    target: rental_coverages
    mutation:
      transition:
        - {from: active, to: removed}
        - {from: suspended, to: removed}
    meaning: The option is removed from the vehicle.
    grain: One row per transaction.
    fields:
      status: Set to removed.
      end_date: Date the option ends.
      coverage_id: Physical damage coverage of the same vehicle.
      rental_coverage_id: Option removed.
      policy_id: Policy concerned.
      customer_id: Named insured.
      vehicle_id: Vehicle concerned.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: rental_coverage_id, effective_date: end_date, reason_code: coverage_removed}
  - type: rental_option_change
    target: rental_coverages
    mutation: update
    meaning: The rental reimbursement option on the vehicle is raised or lowered.
    grain: One row per transaction.
    fields:
      variant_name: New option.
      option_change_effective_date: Date the new option takes effect.
      rental_coverage_id: Option changed.
      policy_id: Policy concerned.
      customer_id: Named insured.
      vehicle_id: Vehicle concerned.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: rental_coverage_id, effective_date: option_change_effective_date, reason_code: option_change}
  # ---- event-table writes (rental_ledger) ---------------------------------------------------
  - type: rental_authorization
    target: rental_ledger
    meaning: A rental is authorized on a physical damage claim, either reserved by Cardinal with a partner agency or arranged by the customer for reimbursement.
    grain: One row per rental authorization.
    distinguish_by: [authorization_number]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option the rental is paid under.
      customer_id: Named insured.
      claim_number: Physical damage claim of the vehicle.
      authorization_number: Rental authorization number.
      vendor_type: Partner agency under direct billing, another agency, or rideshare / taxi / transit.
      vehicle_class: Car class authorized.
      start_date: First rental day.
      authorized_days: Days authorized.
      daily_rate: Agency daily rate, taxes and fees included, USD.
      entry_date: Date authorized.
    triggers: []
  - type: rental_extension
    target: rental_ledger
    meaning: Additional days are authorized on a running rental.
    grain: One row per extension of an authorization.
    distinguish_by: [authorization_number, extension_sequence]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option.
      customer_id: Named insured.
      claim_number: Claim.
      authorization_number: Authorization extended.
      extension_sequence: 1 for the first extension, then 2, 3, ...
      authorized_days: Days added.
      extension_reason: Why the extension was granted.
      entry_date: Date extended.
    triggers: []
  - type: rental_authorization_closed
    target: rental_ledger
    meaning: A rental authorization ends and its last covered day is fixed.
    grain: One row per authorization closed.
    distinguish_by: [authorization_number]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option.
      customer_id: Named insured.
      claim_number: Claim.
      authorization_number: Authorization closed.
      end_date: Last covered rental day.
      close_reason: Why the rental ended.
      entry_date: Date closed.
    triggers: []
  - type: rental_liability_transfer
    target: rental_ledger
    meaning: The at-fault party's insurer accepts liability and takes over the rental under its own claim.
    grain: One row per authorization transferred.
    distinguish_by: [authorization_number]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option.
      customer_id: Named insured.
      claim_number: Claim.
      authorization_number: Authorization transferred.
      other_carrier_claim_number: The other insurer's claim number exactly as given by that insurer.
      transfer_date: Day the other insurer's coverage of the rental begins.
      entry_date: Date recorded.
    triggers:
      - event: rental:rental_authorization_closed
        map: {rental_coverage_id: rental_coverage_id, customer_id: customer_id, claim_number: claim_number, authorization_number: authorization_number, close_reason: liability_transferred}
  - type: rental_vendor_payment
    target: rental_ledger
    meaning: A partner agency's direct-bill invoice is paid for the covered part of a rental.
    grain: One row per agency invoice.
    distinguish_by: [invoice_number]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option.
      customer_id: Named insured.
      claim_number: Claim.
      authorization_number: Authorization invoiced.
      invoice_number: Agency invoice number exactly as printed.
      days_billed: Rental days on the invoice.
      daily_rate: Daily rate billed, taxes and fees included, USD.
      amount: Amount paid by Cardinal, USD.
      customer_responsibility_amount: Part of the invoice left for the customer to pay the agency, USD.
      entry_date: Date paid.
    account: rental_benefit_paid
    direction: in
    triggers: []
  - type: rental_reimbursement_payment
    target: rental_ledger
    meaning: The customer is reimbursed for a rental or for rideshare, taxi or transit fares they paid themselves.
    grain: One row per receipt submission reimbursed.
    distinguish_by: [claim_number, receipt_reference]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option.
      customer_id: Named insured.
      claim_number: Claim.
      authorization_number: Authorization the costs fall under.
      receipt_reference: Receipt or invoice number of the submission exactly as printed.
      vendor_type: Another agency, or rideshare / taxi / transit.
      days_billed: Days covered by the submission.
      amount: Amount reimbursed, USD.
      customer_responsibility_amount: Part of the submitted costs not reimbursed, USD.
      entry_date: Date paid.
    account: rental_benefit_paid
    direction: in
    triggers: []
  - type: rental_payment_recovery
    target: rental_ledger
    meaning: Rental money is recovered, from the at-fault party's insurer through subrogation or as an agency invoice credit.
    grain: One row per recovery against one payment.
    distinguish_by: [source_entry_id, recovery_source]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option.
      customer_id: Named insured.
      claim_number: Claim.
      source_entry_id: The vendor or reimbursement payment recovered against.
      recovery_source: subrogation or vendor_credit.
      amount: Amount recovered, USD.
      entry_date: Date received.
    account: rental_benefit_paid
    direction: out
    triggers: []

measures:
  - id: rental_msr_benefit_used
    window: One loss of one vehicle (one claim number).
    measure: Sum of rental_vendor_payment and rental_reimbursement_payment amounts on the claim number less rental_payment_recovery amounts with recovery_source vendor_credit (subrogation recoveries do not restore the benefit).
  - id: rental_msr_days_used
    window: One loss of one vehicle (one claim number).
    measure: Sum of days_billed over rental_vendor_payment and rental_reimbursement_payment rows on the claim number.
  - id: rental_msr_days_authorized
    window: One authorization.
    measure: authorized_days of the rental_authorization row plus authorized_days of every rental_extension row of the authorization.

policies:
  - id: rental_agg_multi_holding
    subject: [rental_coverage_add]
    rule: >-
      Rental reimbursement is held per vehicle: a vehicle carries at most one option at a time, and a customer may hold
      one for every vehicle that carries physical damage, with no cap of its own. An option can be added to a vehicle only
      when no option on that vehicle is active or suspended.
    eligibility:
      - id: one_option_per_vehicle
        applies_to: [rental_coverage_add]
        kind: dedup
        condition: "An option can be added to a vehicle only when no option on that vehicle is active or suspended."
        evidence_fields: [rental_coverages.vehicle_id, rental_coverages.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_coverages.vehicle_id]
          action_bindings:
            rental_coverages.vehicle_id: vehicle_id
        dedup_contract:
          table: rental_coverages
          mode: separate_record
          object_bindings: {vehicle_id: vehicle_id}
          duplicate_filters: {status: [active, suspended]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: rental_agg_per_loss_benefit
    subject: [rental_vendor_payment, rental_reimbursement_payment, rental_authorization]
    rule: >-
      The rental limits apply per vehicle per loss: each damaged vehicle's claim uses that vehicle's own option, and when
      two vehicles of the household are damaged in one occurrence each has its own daily limit, per-loss maximum and
      maximum days, never pooled or transferred. Every payment on a claim, whether to an agency or to the customer and
      whether for a rental car or for rideshare, taxi or transit, draws on the same per-loss maximum (rental_msr_benefit_used)
      and the same maximum days (rental_msr_days_used). Only max_concurrent_rentals_per_loss rental may run at a time on
      one claim. A new loss starts a fresh per-loss benefit; the benefit is never annual.
    eligibility: []
    measures: [rental_msr_benefit_used, rental_msr_days_used]

  - id: rental_attach_eligibility
    subject: [rental_coverage_add, rental_option_change, rental_coverage_remove, rental_coverage_suspend, rental_coverage_resume]
    rule: >-
      An option can be attached only to a vehicle whose physical damage is pending_inspection or active, and only at a
      rank no higher than the auto package's rental_max_option_rank; a package with rental_max_option_rank 0 allows no
      option. Rental reimbursement is added only while the vehicle's physical damage is pending_inspection or active. The
      auto policy status must be bound or in_force when the option is added or changed. The option's full-term premium is
      premium_per_six_months for a six-month term and premium_per_six_months times premium_twelve_month_multiplier for a
      twelve-month term; it is a flat add-on on the auto policy, prorated for the rest of the term when the option is
      added, changed or removed, and returned on cancellation_premium_basis. An option change takes effect today or a
      later date the customer chooses and applies only to losses on or after its effective date; a rental on a loss
      before the change stays under the option in force on the loss date. The option is suspended while the vehicle's
      physical damage is in storage and resumes when storage ends; it is removed when physical damage is removed, when the
      vehicle is removed, or when a package change lowers rental_max_option_rank below the option's rank and the customer
      does not choose a lower option.
    eligibility:
      - id: physdmg_on_vehicle
        applies_to: [rental_coverage_add]
        kind: state
        condition: "Rental reimbursement is added only while the vehicle's physical damage is pending_inspection or active."
        evidence_fields: [physdmg_coverages.status, physdmg_coverages.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_coverages.coverage_id]
          action_bindings:
            physdmg_coverages.coverage_id: coverage_id
        state_contract:
          field: physdmg_coverages.status
          allowed: [pending_inspection, active]
      - id: auto_policy_open_for_option
        applies_to: [rental_coverage_add, rental_option_change]
        kind: state
        condition: "The auto policy status must be bound or in_force when the option is added or changed."
        evidence_fields: [auto_policies.status, auto_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.policy_id]
          action_bindings:
            auto_policies.policy_id: policy_id
        state_contract:
          field: auto_policies.status
          allowed: [bound, in_force]
    formula:
      option_full_term_premium: premium_per_six_months * premium_twelve_month_multiplier

  - id: rental_evt_authorization
    subject: [rental_authorization]
    rule: >-
      A rental is authorized only on a reported physical damage claim of the vehicle that carries the option, for a loss
      on or after the option's effective date while the option was active. A rental is authorized only when the latest
      coverage decision on the physical damage claim is accepted. The option status must be active when the rental is
      authorized. For a vehicle that can still be driven, the rental starts on the day the vehicle is dropped at the shop
      for the covered repair; for a vehicle that cannot be driven, it may start on the day the loss was reported. For a
      total theft, a rental may start no earlier than theft_waiting_days calendar days after the theft was reported. The
      days count from the report_date on the theft claim, the report date being day 0, so with a waiting period of 1 the
      rental can start on the day after the report. The first authorization covers initial_authorization_days or the
      shop's estimated repair days if fewer, never more than the days left under max_days_per_loss. With direct billing
      Cardinal reserves a direct_bill_vehicle_class car at the partner agency; the customer may take a larger car and pay
      the difference. Before pickup the customer is told which charges will be theirs. No rental is authorized under this
      option after the at-fault party's insurer has accepted liability for the rental, and no rental is authorized once
      the per-loss maximum or the maximum days are used up.
    eligibility:
      - id: claim_accepted_for_rental
        applies_to: [rental_authorization]
        kind: state
        condition: "A rental is authorized only when the latest coverage decision on the physical damage claim is accepted."
        evidence_fields: [physdmg_claim_events.coverage_decision, physdmg_claim_events.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_claim_events.claim_number]
          action_bindings:
            physdmg_claim_events.claim_number: claim_number
        state_contract:
          field: physdmg_claim_events.coverage_decision
          allowed: [accepted]
      - id: option_active_for_rental
        applies_to: [rental_authorization]
        kind: state
        condition: "The option status must be active when the rental is authorized."
        evidence_fields: [rental_coverages.status, rental_coverages.rental_coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_coverages.rental_coverage_id]
          action_bindings:
            rental_coverages.rental_coverage_id: rental_coverage_id
        state_contract:
          field: rental_coverages.status
          allowed: [active]
      - id: theft_waiting_period
        applies_to: [rental_authorization]
        kind: time
        condition: "For a total theft, a rental may start no earlier than theft_waiting_days calendar days after the theft was reported."
        evidence_fields: [physdmg_claim_events.report_date, physdmg_claim_events.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_claim_events.claim_number]
          action_bindings:
            physdmg_claim_events.claim_number: claim_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the theft was reported
          anchor_source: physdmg_claim_events.report_date
          relation: not_before
          duration_source: variants.theft_waiting_days
          unit: calendar_days
          counting_rule: "The days count from the report_date on the theft claim, the report date being day 0, so with a waiting period of 1 the rental can start on the day after the report."
          boundary: inclusive
    formula:
      first_authorized_days: min(initial_authorization_days, max_days_per_loss - rental_msr_days_used)
    measures: [rental_msr_days_used]

  - id: rental_evt_extension_and_end
    subject: [rental_extension, rental_authorization_closed, rental_liability_transfer]
    rule: >-
      An authorization is extended by extension_increment_days at a time, only when the shop confirms a new completion
      date (extension_requires_shop_confirmation) or documents a parts delay (parts_delay_extension_allowed), and never
      beyond max_days_per_loss in total or beyond what the per-loss maximum can still pay. An extension is granted only
      while the total days authorized on the claim stay within max_days_per_loss. The rental ends, whichever comes first:
      repair_complete_grace_days after the shop reports repairs complete; total_loss_rental_end_days after the total-loss
      settlement is offered; denial_rental_end_days after a coverage denial is communicated; the day the per-loss maximum
      or the maximum days are used up; the day the customer returns the car; or the day before the at-fault party's
      insurer takes over the rental, which is recorded as a liability transfer. Days after the end are the customer's.
    eligibility:
      - id: within_max_days
        applies_to: [rental_extension]
        kind: caller_fact
        condition: "An extension is granted only while the total days authorized on the claim stay within max_days_per_loss."
        evidence_fields: [rental_ledger.authorized_days, rental_ledger.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_ledger.claim_number]
          action_bindings:
            rental_ledger.claim_number: claim_number
    measures: [rental_msr_days_authorized]

  - id: rental_evt_payment
    subject: [rental_vendor_payment, rental_reimbursement_payment]
    rule: >-
      Each covered rental day is paid at the lower of the agency's daily rate and the option's daily_limit, taxes and
      fees counted inside the limit where daily_limit_includes_taxes; only days inside the authorization are covered, and
      the total on the claim never exceeds max_per_loss. Within those limits the payment is the covered days times the
      covered daily amount, capped at what the per-loss maximum still allows (rental_msr_benefit_used). Never paid:
      the agency's damage waiver where ldw_cdw_covered is false, fuel, per-mile charges, one-way drop fees, under-25
      renter fees, counter deposits and accessories, and the difference for a larger car than authorized; delivery and
      collection fees, additional driver fees and child safety seats are paid only where the option's switch is true and
      within the daily limit. Everything not paid is the customer's responsibility and is recorded on the payment.
      Direct-bill invoices are paid to the partner agency within vendor_invoice_payment_days; an invoice exceeding the
      authorized days times the daily limit by more than vendor_overbilling_review_threshold is reviewed before payment.
      A customer who arranged their own rental, or used rideshare, taxi or transit where rideshare_transit_allowed, is
      reimbursed against itemized receipts under the same daily limit, within reimbursement_payment_days of complete
      receipts. An agency invoice is paid only once; an invoice number already paid is not paid again. Receipts are reimbursed only when submitted no later than receipt_submit_days calendar days after the
      rental ended. The count runs from the end_date of the closed authorization, that date being day 0, and receipts
      received on the last day are in time.
    eligibility:
      - id: receipts_in_time
        applies_to: [rental_reimbursement_payment]
        kind: time
        condition: "Receipts are reimbursed only when submitted no later than receipt_submit_days calendar days after the rental ended."
        evidence_fields: [rental_ledger.end_date, rental_ledger.authorization_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_ledger.authorization_number]
          action_bindings:
            rental_ledger.authorization_number: authorization_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the rental ended
          anchor_source: rental_ledger.end_date
          relation: not_after
          duration_source: variants.receipt_submit_days
          unit: calendar_days
          counting_rule: "The count runs from the end_date of the closed authorization, that date being day 0, and receipts received on the last day are in time."
          boundary: inclusive
      - id: invoice_not_paid_twice
        applies_to: [rental_vendor_payment]
        kind: dedup
        condition: "An agency invoice is paid only once; an invoice number already paid is not paid again."
        evidence_fields: [rental_ledger.invoice_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_ledger.invoice_number]
          action_bindings:
            rental_ledger.invoice_number: invoice_number
        dedup_contract:
          table: rental_ledger
          mode: separate_record
          object_bindings: {invoice_number: invoice_number}
          duplicate_filters: {event_type: [rental_vendor_payment]}
          distinct_fields: []
    formula:
      amount: min(days_billed * min(daily_rate, daily_limit), max_per_loss - rental_msr_benefit_used)
    measures: [rental_msr_benefit_used]
    params:
      per_tier:
        Cardinal Rental Reimbursement 30/900: {daily_limit: "=daily_limit", max_per_loss: "=max_per_loss"}
        Cardinal Rental Reimbursement 40/1200: {daily_limit: "=daily_limit", max_per_loss: "=max_per_loss"}
        Cardinal Rental Reimbursement 50/1500: {daily_limit: "=daily_limit", max_per_loss: "=max_per_loss"}
        Cardinal Rental Reimbursement 60/1800: {daily_limit: "=daily_limit", max_per_loss: "=max_per_loss"}
        Cardinal Rental Reimbursement 75/2250: {daily_limit: "=daily_limit", max_per_loss: "=max_per_loss"}
        Cardinal Rental Reimbursement 100/3000: {daily_limit: "=daily_limit", max_per_loss: "=max_per_loss"}

  - id: rental_evt_recovery
    subject: [rental_payment_recovery]
    rule: >-
      When the other party is at fault, the rental paid under the option is part of Cardinal's subrogation demand; a
      subrogation recovery lowers rental benefit paid but does not give back per-loss benefit or days on the claim. An
      agency credit for an overbilled invoice lowers rental benefit paid and does give the credited amount back to the
      per-loss benefit. A recovery is recorded once per payment and source.
    eligibility: []

  - id: rental_combo_physdmg_and_builtin
    subject: [rental_authorization, rental_reimbursement_payment, rental_coverage_suspend]
    rule: >-
      Rental reimbursement and the built-in transportation expense of physical damage are never added together on one
      loss: when the vehicle carries an option, the option pays and the built-in benefit does not apply; when it carries
      none, only the built-in benefit applies. Damage to the rental car itself is not paid under this option; it is
      handled under the vehicle's own physical damage as a non-owned car where nonowned_rental_physdmg_extends, subject to
      that coverage's deductible. While the vehicle's physical damage is in storage the option is suspended and no rental
      is authorized for a loss during storage.
    eligibility: []
