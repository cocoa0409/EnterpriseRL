# Product charter: Cardinal Rental Reimbursement (optional coverage on one scheduled vehicle).
# Path: env/env_0035_personal_auto_insurance_carrier/blueprint/products/rental.yaml
#
# Capability matrix (functional closure audit):
#   open        attach to a vehicle that carries physical damage, within the auto package's highest allowed option
#   in term     option change (applies to losses on or after its effective date), suspension while the vehicle is in
#               storage, removal (with physical damage, or on request)
#   claims      rental authorization on an accepted physical damage claim, start rules (drivable / not drivable /
#               theft waiting days), direct-bill vehicle class, extensions with shop confirmation, end rules (repairs
#               complete, total-loss settlement offer, claim denial, benefit exhausted, liability transferred)
#   money       daily limit (taxes included), per-loss maximum and maximum days, direct-bill vendor invoices,
#               reimbursement with receipts, rideshare / taxi / transit, items never covered, customer responsibility
#   recovery    subrogation recovery, vendor invoice credit
#   exceptions  other carrier accepted liability, receipts after the window, upgrade differences, stacking with the
#               built-in transportation expense of physical damage

category: rental
display_name: Cardinal Rental Reimbursement

binding:
  holding_table: rental_coverages
  event_tables: [rental_ledger]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [active, suspended, removed]
  transitions:
    - {from: active, to: suspended, by: system, means: The vehicle's physical damage goes into storage and rental reimbursement is suspended with it.}
    - {from: suspended, to: active, by: system, means: The vehicle leaves storage and rental reimbursement resumes.}
    - {from: active, to: removed, by: agent, means: Rental reimbursement is removed from the vehicle (customer request, physical damage removed, vehicle removed, or the package no longer allows the option).}
    - {from: suspended, to: removed, by: agent, means: Rental reimbursement is removed from a vehicle in storage.}

accounts:
  - key: rental_benefit_paid
    unit: USD
    meaning: Amount paid under the rental reimbursement option of the vehicle; vendor and reimbursement payments raise it, recoveries and vendor credits lower it.

parameter_schema:
  daily_limit: Most paid for one rental day, taxes and concession fees included, USD.
  max_per_loss: Most paid for all rental and transportation costs of one loss, USD.
  max_days_per_loss: Most rental days paid for one loss, integer.
  premium_per_six_months: Full-term premium of the option per vehicle for a six-month term, USD.
  premium_twelve_month_multiplier: Multiplier applied to premium_per_six_months for a twelve-month term, integer.
  direct_bill_vehicle_class: Rental car class Cardinal reserves under direct billing at the option's daily limit.
  direct_bill_available: Boolean switch; whether Cardinal reserves and pays the rental directly with a partner agency.
  daily_limit_includes_taxes: Boolean switch; whether taxes, airport concession and facility fees count inside the daily limit.
  day_basis: How a rental day is counted (rental_24_hour_period).
  initial_authorization_days: Rental days authorized when a rental is first set up, integer.
  extension_increment_days: Days added by one extension, integer.
  extension_requires_shop_confirmation: Boolean switch; whether an extension needs the repair shop's confirmation of a new completion date.
  parts_delay_extension_allowed: Boolean switch; whether a documented parts delay justifies an extension within the per-loss limits.
  theft_waiting_days: Calendar days after a total theft is reported before rental may start, integer.
  drivable_rental_start: When rental starts for a vehicle that can still be driven (shop_dropoff_date).
  non_drivable_rental_start: When rental starts for a vehicle that cannot be driven (loss_report_date).
  repair_complete_grace_days: Days after the shop reports repairs complete through which rental is still paid, integer.
  total_loss_rental_end_days: Days after the total-loss settlement offer through which rental is still paid, integer.
  denial_rental_end_days: Days after a coverage denial is communicated through which a rental already running is still paid, integer.
  authorization_pickup_hours: Hours within which a direct-bill reservation must be picked up before it lapses, integer.
  receipt_submit_days: Calendar days after the rental ends within which receipts for reimbursement must be submitted, integer.
  reimbursement_receipt_required: Boolean switch; whether reimbursement needs itemized receipts.
  reimbursement_payment_days: Calendar days after complete receipts are received within which reimbursement is paid, integer.
  vendor_invoice_payment_days: Calendar days after a direct-bill invoice is received within which it is paid, integer.
  rideshare_transit_allowed: Boolean switch; whether rideshare, taxi and public transit fares are paid instead of a rental car.
  rideshare_receipt_required: Boolean switch; whether each fare needs a trip receipt.
  ldw_cdw_covered: Boolean switch; whether the rental agency's loss or collision damage waiver is paid.
  fuel_covered: Boolean switch; whether fuel or refueling charges are paid.
  mileage_charges_covered: Boolean switch; whether per-mile charges are paid.
  one_way_drop_fee_covered: Boolean switch; whether a one-way drop fee is paid.
  delivery_pickup_fee_covered: Boolean switch; whether a fee for delivering or collecting the rental car is paid.
  young_renter_fee_covered: Boolean switch; whether an under-25 renter fee is paid.
  additional_driver_fee_covered: Boolean switch; whether an additional driver fee is paid.
  child_safety_seat_covered: Boolean switch; whether a child safety seat rental is paid.
  accessories_covered: Boolean switch; whether GPS units, toll transponders and similar add-ons are paid.
  upgrade_difference_customer_paid: Boolean switch; whether the customer pays the difference for a car above the authorized class.
  other_carrier_liability_primary: Boolean switch; whether rental moves to the at-fault party's insurer once it accepts liability.
  nonowned_rental_physdmg_extends: Boolean switch; whether the vehicle's physical damage extends to damage to the rental car.
  requires_physical_damage: Boolean switch; whether the option requires physical damage on the same vehicle.
  suspend_during_storage: Boolean switch; whether the option is suspended while the vehicle's physical damage is in storage.
  benefit_basis: Unit to which the per-loss limits apply (per_vehicle_per_loss).
  max_concurrent_rentals_per_loss: Rental cars that may run at the same time on one loss, integer.
  customer_responsibility_notice_required: Boolean switch; whether the customer must be told before pickup which charges will be theirs.
  out_of_state_rental_allowed: Boolean switch; whether a rental picked up outside the policy state is covered.
  rental_deposit_covered: Boolean switch; whether the agency's counter deposit is paid.
  rental_requires_open_claim: Boolean switch; whether a rental can be authorized only on a reported claim.
  vendor_overbilling_review_threshold: Invoice amount above the authorized days times the daily limit at which the invoice is reviewed before payment, USD.
  cancellation_premium_basis: How unearned option premium is returned on removal (pro_rata).

