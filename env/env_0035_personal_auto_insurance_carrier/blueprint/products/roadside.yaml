events:
  # ---- holding writes (roadside_coverages) --------------------------------------------------
  - type: roadside_add
    target: roadside_coverages
    mutation: create
    meaning: A roadside assistance option is attached to a scheduled vehicle.
    grain: One row per vehicle option.
    fields:
      roadside_id: Roadside assistance coverage reference.
      customer_id: Named insured.
      policy_id: Policy the vehicle is scheduled on.
      vehicle_id: Vehicle covered.
      variant_name: Option chosen.
      effective_date: Date the option takes effect.
      allowance_period_start: First day of the first allowance period (the effective date).
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: roadside_id, effective_date: effective_date, reason_code: coverage_added}
      - event: roadside:roadside_allowance_granted
        map: {roadside_id: roadside_id, customer_id: customer_id, allowance_period_start: allowance_period_start}
  - type: roadside_remove
    target: roadside_coverages
    mutation: {transition: {from: active, to: removed}}
    meaning: The option is removed from the vehicle.
    grain: One row per transaction.
    fields:
      status: Set to removed.
      end_date: Date the option ends.
      roadside_id: Option removed.
      policy_id: Policy concerned.
      customer_id: Named insured.
      vehicle_id: Vehicle concerned.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: roadside_id, effective_date: end_date, reason_code: coverage_removed}
  - type: roadside_nonrenew
    target: roadside_coverages
    mutation: {transition: {from: active, to: nonrenewed}}
    meaning: The option is not renewed at the policy renewal because of excessive use.
    grain: One row per transaction.
    fields:
      status: Set to nonrenewed.
      end_date: The policy term expiration date.
    triggers: []
  - type: roadside_option_change
    target: roadside_coverages
    mutation: update
    meaning: The roadside option on the vehicle is raised or lowered.
    grain: One row per transaction.
    fields:
      variant_name: New option.
      option_change_effective_date: Date the new option takes effect.
      roadside_id: Option changed.
      policy_id: Policy concerned.
      customer_id: Named insured.
      vehicle_id: Vehicle concerned.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: roadside_id, effective_date: option_change_effective_date, reason_code: option_change}
  # ---- event-table writes (roadside_events) -------------------------------------------------
  - type: roadside_allowance_granted
    target: roadside_events
    meaning: The covered service calls of a new allowance period are granted.
    grain: One row per allowance period.
    distinguish_by: [allowance_period_start]
    fields:
      roadside_event_id: Event reference.
      roadside_id: Option.
      customer_id: Named insured.
      allowance_period_start: First day of the allowance period.
      calls: Calls granted.
      event_date: Date granted.
    account: service_calls
    direction: in
    triggers: []
  - type: roadside_dispatch
    target: roadside_events
    meaning: A provider is dispatched for one covered service call.
    grain: One row per dispatch.
    distinguish_by: [dispatch_number]
    fields:
      roadside_event_id: Event reference.
      roadside_id: Option.
      customer_id: Named insured.
      dispatch_number: Dispatch number.
      service_type: Service provided.
      service_date: Date of service.
      tow_miles: Miles towed (0 when not a tow).
      calls: Calls used (1).
      covered_amount: Provider charge paid by Cardinal, USD.
      event_date: Date recorded.
    account: service_calls
    direction: out
    triggers: []
  - type: roadside_call_restored
    target: roadside_events
    meaning: A used call is given back (cancelled before dispatch within the free window, duplicate dispatch, or the provider did not arrive).
    grain: One row per restored dispatch.
    distinguish_by: [source_event_id]
    fields:
      roadside_event_id: Event reference.
      roadside_id: Option.
      customer_id: Named insured.
      source_event_id: Dispatch whose call is restored.
      restore_reason: Why restored.
      calls: Calls restored (1).
      event_date: Date restored.
    account: service_calls
    direction: in
    triggers: []
  - type: roadside_member_charge
    target: roadside_events
    meaning: The part of a service the member pays the provider directly is recorded (miles beyond the covered tow, fuel, parts, battery, a call beyond the allowance).
    grain: One row per dispatch with a member-paid part.
    distinguish_by: [dispatch_number]
    fields:
      roadside_event_id: Event reference.
      roadside_id: Option.
      customer_id: Named insured.
      dispatch_number: Dispatch concerned.
      member_charge_reason: Why the member pays.
      member_paid_amount: Amount the member pays the provider, USD.
      event_date: Date recorded.
    triggers: []
  - type: roadside_reimbursement_paid
    target: roadside_events
    meaning: The member is reimbursed for a covered service they bought from a provider outside the Cardinal network.
    grain: One row per receipt reimbursed.
    distinguish_by: [receipt_reference]
    fields:
      roadside_event_id: Event reference.
      roadside_id: Option.
      customer_id: Named insured.
      receipt_reference: Provider receipt number exactly as printed.
      service_type: Service bought.
      service_date: Date of service.
      amount: Amount reimbursed, USD.
      event_date: Date paid.
    triggers: []
  - type: roadside_trip_interruption_paid
    target: roadside_events
    meaning: Trip interruption expenses are reimbursed after a covered disablement far from home.
    grain: One row per receipt per expense category.
    distinguish_by: [receipt_reference, expense_category]
    fields:
      roadside_event_id: Event reference.
      roadside_id: Option.
      customer_id: Named insured.
      dispatch_number: Dispatch of the disablement.
      receipt_reference: Receipt number exactly as printed.
      expense_category: lodging, meals or alternate_transportation.
      amount: Amount reimbursed, USD.
      event_date: Date paid.
    triggers: []

measures:
  - id: roadside_msr_calls_window
    window: Rolling excessive_use_window_months calendar months ending on the renewal offer date.
    measure: Count of roadside_dispatch rows on the option less roadside_call_restored rows in the window.
  - id: roadside_msr_trip_interruption_paid
    window: One disablement (one dispatch number).
    measure: Sum of roadside_trip_interruption_paid amounts for the dispatch.

policies:
  - id: roadside_agg_multi_holding
    subject: [roadside_add]
    rule: >-
      Roadside assistance is held per vehicle: a vehicle carries at most one option, and a customer may add one to every
      scheduled vehicle, with no cap of its own. An option can be added to a vehicle only when the vehicle has no active
      option.
    eligibility:
      - id: one_option_per_vehicle
        applies_to: [roadside_add]
        kind: dedup
        condition: "An option can be added to a vehicle only when the vehicle has no active option."
        evidence_fields: [roadside_coverages.vehicle_id, roadside_coverages.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [roadside_coverages.vehicle_id]
          action_bindings:
            roadside_coverages.vehicle_id: vehicle_id
        dedup_contract:
          table: roadside_coverages
          mode: separate_record
          object_bindings: {vehicle_id: vehicle_id}
          duplicate_filters: {status: [active]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: roadside_agg_service_calls
    subject: [roadside_dispatch, roadside_allowance_granted, roadside_member_charge]
    rule: >-
      Each vehicle's option has its own allowance of service_calls_per_period covered calls per allowance period of
      allowance_period_months, starting on the option effective date and on each anniversary; calls are never pooled
      across the household's vehicles, and unused calls do not carry over where allowance_carryover is false. A covered
      call is dispatched only while the vehicle has at least one call left in the current allowance period; once the
      allowance is used, service is still dispatched at the member's expense at the provider's rate and recorded as a
      member charge. One breakdown uses one call even when several services are performed together.
    eligibility:
      - id: call_left
        applies_to: [roadside_dispatch]
        kind: caller_fact
        condition: "A covered call is dispatched only while the vehicle has at least one call left in the current allowance period"
        evidence_fields: [roadside_coverages.service_calls_remaining, roadside_coverages.roadside_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [roadside_coverages.roadside_id]
          action_bindings:
            roadside_coverages.roadside_id: roadside_id

  - id: roadside_attach_eligibility
    subject: [roadside_add, roadside_option_change, roadside_remove]
    rule: >-
      An option can be attached only to a vehicle scheduled on an auto policy, at a rank no higher than the auto package's
      roadside_max_option_rank. The auto policy status must be bound or in_force when the option is added or changed.
      The option's full-term premium is premium_per_six_months for a six-month term and premium_per_six_months times
      premium_twelve_month_multiplier for a twelve-month term; it is a flat add-on on the auto policy, prorated when the
      option is added, changed or removed, and returned on cancellation_premium_basis. A newly added option, or the higher
      services of a raised option, become available new_option_waiting_hours after the effective date; a disablement
      that began before then is not covered. The option is removed with its vehicle, at the customer's request, or when a
      package change lowers roadside_max_option_rank below the option's rank and the customer does not choose a lower
      option.
    eligibility:
      - id: auto_policy_open_for_roadside
        applies_to: [roadside_add, roadside_option_change]
        kind: state
        condition: "The auto policy status must be bound or in_force when the option is added or changed."
        evidence_fields: [auto_policies.status, auto_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.policy_id]
          action_bindings:
            auto_policies.policy_id: policy_id
        state_contract:
          field: auto_policies.status
          allowed: [bound, in_force]
    formula:
      option_full_term_premium: premium_per_six_months * premium_twelve_month_multiplier

  - id: roadside_evt_dispatch
    subject: [roadside_dispatch]
    rule: >-
      A provider is dispatched through dispatch_channels to the scheduled vehicle, whoever is driving it with permission.
      Covered services are those switched on for the option: tow up to tow_miles_covered to the destination allowed by
      tow_destination_rule, max_tows_per_breakdown per breakdown; jump start; battery testing and installation labor
      where battery_service_labor_covered; lockout door opening and a locksmith up to locksmith_cap; flat tire change with
      a usable spare (without one, where spare_tire_required, the vehicle is towed as a tow call); delivery of up to
      fuel_gallons_max gallons of fuel; winch-out within winch_distance_feet of a public road; mechanical first aid where
      switched on; and service of a motorhome or attached trailer up to rv_max_gvwr_lbs only where rv_trailer_service.
      Off-road recovery, impound tows, storage and replacement keys are never covered. Providers aim to arrive within
      response_time_target_minutes.
    eligibility: []
    params:
      per_tier:
        Cardinal Roadside Basic: {tow_miles_covered: "=tow_miles_covered", locksmith_cap: "=locksmith_cap", fuel_gallons_max: "=fuel_gallons_max"}
        Cardinal Roadside Standard: {tow_miles_covered: "=tow_miles_covered", locksmith_cap: "=locksmith_cap", fuel_gallons_max: "=fuel_gallons_max"}
        Cardinal Roadside Plus: {tow_miles_covered: "=tow_miles_covered", locksmith_cap: "=locksmith_cap", fuel_gallons_max: "=fuel_gallons_max"}
        Cardinal Roadside Plus with Trip Interruption: {tow_miles_covered: "=tow_miles_covered", locksmith_cap: "=locksmith_cap", fuel_gallons_max: "=fuel_gallons_max"}
        Cardinal Roadside Premier: {tow_miles_covered: "=tow_miles_covered", locksmith_cap: "=locksmith_cap", fuel_gallons_max: "=fuel_gallons_max"}
        Cardinal Roadside Premier RV & Trailer: {tow_miles_covered: "=tow_miles_covered", locksmith_cap: "=locksmith_cap", fuel_gallons_max: "=fuel_gallons_max"}

  - id: roadside_evt_member_charges
    subject: [roadside_member_charge]
    rule: >-
      The member pays the provider directly for tow miles beyond tow_miles_covered at over_mileage_member_rate_per_mile,
      for the fuel itself, for batteries, parts and keys, for locksmith costs above locksmith_cap, and for every service
      after the allowance is used. The member-paid part of each dispatch is recorded once, with its reason.
    eligibility: []
    formula:
      member_paid_amount: max(0, tow_miles - tow_miles_covered) * over_mileage_member_rate_per_mile

  - id: roadside_evt_reimbursement
    subject: [roadside_reimbursement_paid]
    rule: >-
      A member who could not reach Cardinal dispatch and paid a provider outside the network for a covered service is
      reimbursed against an itemized receipt, up to out_of_network_reimbursement_cap per service call; the reimbursement
      uses a call from the allowance. Receipts are reimbursed only when submitted no later than reimbursement_submit_days
      calendar days after the service date. Days count from the service_date on the receipt, that date being day 0, and a
      receipt received on the last day is in time. Reimbursement is paid within reimbursement_payment_days of complete
      receipts. A receipt is reimbursed once.
    eligibility:
      - id: receipt_in_time
        applies_to: [roadside_reimbursement_paid]
        kind: time
        condition: "Receipts are reimbursed only when submitted no later than reimbursement_submit_days calendar days after the service date."
        evidence_fields: [roadside_events.service_date, roadside_events.receipt_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [roadside_events.receipt_reference]
          action_bindings:
            roadside_events.receipt_reference: receipt_reference
        temporal_basis:
          clock: frozen_time
          anchor_event: the service date
          anchor_source: roadside_events.service_date
          relation: not_after
          duration_source: variants.reimbursement_submit_days
          unit: calendar_days
          counting_rule: "Days count from the service_date on the receipt, that date being day 0, and a receipt received on the last day is in time."
          boundary: inclusive
    formula:
      amount: min(amount, out_of_network_reimbursement_cap)

  - id: roadside_evt_trip_interruption
    subject: [roadside_trip_interruption_paid]
    rule: >-
      Where trip_interruption_available, a covered disablement that leaves the vehicle undrivable at least
      trip_interruption_min_distance_miles from the member's home address and needs an overnight repair is eligible for
      trip interruption: lodging up to trip_interruption_lodging_daily_cap per night, meals up to
      trip_interruption_meals_daily_cap per day, and alternate transportation home or to the destination, for no more
      than trip_interruption_max_days days, all together never more than trip_interruption_max_per_occurrence for the
      disablement (roadside_msr_trip_interruption_paid). Expenses need itemized receipts; each receipt and category is
      paid once.
    eligibility: []
    measures: [roadside_msr_trip_interruption_paid]

  - id: roadside_combo_physdmg_tow
    subject: [roadside_dispatch, roadside_call_restored]
    rule: >-
      A tow from the scene of an accident is paid under the vehicle's physical damage claim where
      accident_tow_under_physical_damage is true and the vehicle carries physical damage; when it was dispatched through
      roadside assistance, the call is restored and the tow cost moves to the claim. A vehicle without physical damage
      uses a roadside call for an accident tow. A call cancelled within goa_free_cancel_minutes and before a provider was
      dispatched, a duplicate dispatch, and a provider who never arrived are also restored. A dispatch is restored at most
      once.
    eligibility: []

  - id: roadside_excessive_use
    subject: [roadside_nonrenew]
    rule: >-
      At the policy renewal, an option whose vehicle used excessive_use_threshold_calls or more covered calls in the last
      excessive_use_window_months (roadside_msr_calls_window) is not renewed; the rest of the auto policy renews normally,
      and the customer is told with the renewal offer. Calls restored do not count.
    eligibility: []
    measures: [roadside_msr_calls_window]
