# Product charter: Cardinal Roadside Assistance (optional coverage on one scheduled vehicle).
# Path: env/env_0035_personal_auto_insurance_carrier/blueprint/products/roadside.yaml
#
# Capability matrix (functional closure audit):
#   open        attach to a scheduled vehicle within the auto package's highest allowed option; waiting period after
#               a new option; yearly service-call allowance granted
#   in term     option change, removal, nonrenewal for excessive use
#   service     dispatch for tow, jump start, lockout, flat tire, fuel delivery, winch-out, battery service and
#               mechanical first aid; tow distance and destination; response targets
#   money       member-paid charges (miles beyond the covered tow, fuel, parts, battery), out-of-network
#               reimbursement cap with receipts, trip interruption (lodging, meals, transportation) far from home
#   exceptions  allowance used up (member pays the vendor rate), cancelled calls restored, accident tows under
#               physical damage, off-road recovery and impound tows excluded, RV and trailer limits

category: roadside
display_name: Cardinal Roadside Assistance

binding:
  holding_table: roadside_coverages
  event_tables: [roadside_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {service_calls_remaining: service_calls}

lifecycle:
  states: [active, removed, nonrenewed]
  transitions:
    - {from: active, to: removed, by: agent, means: Roadside assistance is removed from the vehicle (customer request, vehicle removed, or the package no longer allows the option).}
    - {from: active, to: nonrenewed, by: system, means: The option is not renewed at the policy renewal because of excessive use.}

accounts:
  - key: service_calls
    unit: service calls
    meaning: Covered service calls left in the vehicle's current allowance period; grants and restorations add calls, dispatches use them.

parameter_schema:
  service_calls_per_period: Covered service calls in one allowance period, integer.
  allowance_period_months: Length of the allowance period, counted from the option effective date and each anniversary, months.
  tow_miles_covered: Tow distance paid per service call, miles.
  over_mileage_member_rate_per_mile: Rate the member pays the provider for each tow mile beyond the covered distance, USD per mile.
  tow_destination_rule: Where the vehicle may be towed (nearest_qualified_facility or member_choice_within_covered_miles).
  max_tows_per_breakdown: Tows paid for one breakdown, integer.
  jump_start_covered: Boolean switch; whether a battery jump start is covered.
  battery_service_labor_covered: Boolean switch; whether on-site battery testing and installation labor is covered (battery cost is the member's).
  lockout_covered: Boolean switch; whether lockout service is covered.
  locksmith_cap: Most paid toward a locksmith or key cutting on a lockout, USD (0 = only door-opening service).
  key_replacement_covered: Boolean switch; whether replacement keys or fobs are paid.
  flat_tire_change_covered: Boolean switch; whether a flat tire change with the vehicle's spare is covered.
  spare_tire_required: Boolean switch; whether a usable spare is needed (otherwise the vehicle is towed as a tow call).
  fuel_delivery_covered: Boolean switch; whether delivery of emergency fuel is covered (fuel cost is the member's).
  fuel_gallons_max: Most gallons delivered per call, gallons.
  winch_out_covered: Boolean switch; whether winching a stuck vehicle back to the road is covered.
  winch_distance_feet: Furthest distance from a public road a covered winch-out reaches, feet.
  mechanical_first_aid_covered: Boolean switch; whether minor roadside adjustments (belts, hoses, fuses) are covered (parts are the member's).
  off_road_recovery_covered: Boolean switch; whether recovery from off-road trails or bodies of water is covered.
  impound_tow_covered: Boolean switch; whether a tow from a police impound or tow-away zone is covered.
  driveway_service_covered: Boolean switch; whether service at the member's home is covered.
  rv_trailer_service: Boolean switch; whether a motorhome or an attached trailer is serviced and towed.
  rv_max_gvwr_lbs: Heaviest gross vehicle weight rating serviced for a motorhome or trailer, pounds (0 = not covered).
  out_of_network_reimbursement_cap: Most reimbursed per service call when the member paid a provider outside the Cardinal network, USD.
  reimbursement_submit_days: Calendar days after the service within which receipts for reimbursement must be submitted, integer.
  reimbursement_payment_days: Calendar days after complete receipts within which reimbursement is paid, integer.
  reimbursement_receipt_required: Boolean switch; whether an itemized receipt is needed for reimbursement.
  trip_interruption_available: Boolean switch; whether trip interruption expenses are covered.
  trip_interruption_min_distance_miles: Least distance from home at which a disablement qualifies for trip interruption, miles.
  trip_interruption_max_per_occurrence: Most paid for one trip interruption, USD.
  trip_interruption_lodging_daily_cap: Most paid for lodging per night, USD.
  trip_interruption_meals_daily_cap: Most paid for meals per day, USD.
  trip_interruption_max_days: Most days of expenses paid for one trip interruption, integer.
  ride_after_tow_credit: Most paid for a rideshare or taxi for the occupants after a covered tow, USD.
  goa_free_cancel_minutes: Minutes after a request within which a member may cancel before a provider is dispatched without using a call, integer.
  response_time_target_minutes: Target minutes from dispatch to provider arrival, integer.
  dispatch_channels: List of channels through which service can be requested.
  premium_per_six_months: Full-term premium of the option per vehicle for a six-month term, USD.
  premium_twelve_month_multiplier: Multiplier applied to premium_per_six_months for a twelve-month term, integer.
  new_option_waiting_hours: Hours after a newly added option takes effect before service is available, integer.
  excessive_use_threshold_calls: Service calls in the excessive-use window at or above which the option is not renewed, integer.
  excessive_use_window_months: Rolling months over which calls are counted for excessive use, integer.
  over_allowance_handling: What happens to a call after the allowance is used (member_pays_provider_rate).
  accident_tow_under_physical_damage: Boolean switch; whether a tow from an accident scene is paid under the vehicle's physical damage claim instead of using a call.
  vehicle_must_be_scheduled: Boolean switch; whether only the scheduled vehicle is serviced.
  coverage_follows_vehicle: Boolean switch; whether service is available to any permitted driver of the scheduled vehicle.
  vehicle_storage_covered: Boolean switch; whether storage after a tow is paid.
  allowance_carryover: Boolean switch; whether unused calls carry into the next allowance period.
  cancellation_premium_basis: How unearned option premium is returned on removal (pro_rata).

