# Product charter: Cardinal DriveSense (usage-based insurance program on one scheduled vehicle).
# Path: env/env_0035_personal_auto_insurance_carrier/blueprint/products/telematics.yaml
#
# Capability matrix (functional closure audit):
#   open        enroll a scheduled vehicle on a package that allows DriveSense; data source by program (mobile app,
#               plug-in device, connected car); device shipment; participation discount
#   in term     activation window, monthly score posting, observation period with minimum active days and trips,
#               device unplugged or app inactive, pay-per-mile monthly mileage charges and adjustments
#   money       earned discount or surcharge by score ladder (surcharge only in permitted states), participation
#               discount, per-mile charges with a daily mile cap, device non-return fee (billed through billing)
#   exit        opt-out (discount treatment), termination (vehicle removed, never activated, device disconnected)
#   exceptions  odometer corrections, device outage estimates, re-enrollment waiting period, data privacy limits

category: telematics
display_name: Cardinal DriveSense

binding:
  holding_table: telematics_enrollments
  event_tables: [telematics_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [enrolled, observing, scored, opted_out, terminated]
  transitions:
    - {from: enrolled, to: observing, by: system, means: The app or device reports its first trip and the observation period begins.}
    - {from: enrolled, to: terminated, by: system, means: Nothing was activated within the activation window and the enrollment ends.}
    - {from: observing, to: scored, by: system, means: The observation period completes with enough active days and trips and the earned discount or surcharge is fixed.}
    - {from: observing, to: opted_out, by: agent, means: The customer opts out during observation.}
    - {from: scored, to: opted_out, by: agent, means: The customer opts out after scoring.}
    - {from: observing, to: terminated, by: system, means: The vehicle leaves the policy, or the device stays disconnected too long.}
    - {from: scored, to: terminated, by: system, means: The vehicle leaves the policy.}

accounts:
  - key: mileage_charges
    unit: USD
    meaning: Per-mile premium charged under a pay-per-mile program; monthly mileage charges raise it, mileage adjustments lower it.

parameter_schema:
  program_type: Kind of program (safe_driving, teen_coaching or pay_per_mile).
  data_source: Where driving data comes from (mobile_app, plug_in_device or connected_car).
  participation_discount_pct: Discount applied from enrollment until the earned discount is fixed, percent.
  max_earned_discount_pct: Largest discount a score can earn, percent.
  max_surcharge_pct: Largest surcharge a score can bring where surcharges are permitted, percent.
  surcharge_permitted_states: List of policy states where a score may bring a surcharge.
  score_discount_ladder: Threshold ladder score band -> earned discount percent (scores 0-100; higher is safer).
  score_surcharge_ladder: Threshold ladder score band -> surcharge percent applied below the lowest discount band.
  observation_days: Calendar days of the observation period from the first trip, integer.
  min_active_days: Days with at least one trip needed in the observation period for a score, integer.
  min_trips: Trips needed in the observation period for a score, integer.
  activation_days: Calendar days after enrollment within which the app or device must report a first trip, integer.
  device_shipping_business_days: Business days within which a plug-in device is shipped after enrollment, integer (0 = no device).
  device_return_days: Calendar days after the enrollment ends within which a plug-in device must be returned, integer (0 = no device).
  device_non_return_fee: Fee charged when a plug-in device is not returned in time, USD.
  device_disconnect_termination_days: Consecutive days of no data from a device or app after which observation is terminated, integer.
  hard_brake_threshold_mph_per_sec: Deceleration counted as a hard brake, miles per hour per second.
  rapid_acceleration_threshold_mph_per_sec: Acceleration counted as rapid, miles per hour per second.
  speeding_threshold_mph_over: Speed above the posted limit counted as speeding, miles per hour.
  night_driving_window: Clock hours counted as late-night driving, local time.
  phone_handling_tracked: Boolean switch; whether handheld phone use while moving lowers the score.
  score_weights: Mapping behavior -> weight percent in the score.
  score_posting_frequency: How often a running score is posted (monthly).
  discount_applies_from: When the earned discount starts to apply (next_renewal_term).
  participation_discount_applies_from: When the participation discount starts to apply (next_renewal_term_or_new_business).
  discount_retained_after_opt_out: Boolean switch; whether a fixed earned discount is kept after opting out.
  rescored_each_term: Boolean switch; whether driving keeps being scored and the discount is reset every term.
  max_enrollments_per_vehicle: Active enrollments allowed per vehicle, integer.
  reenrollment_wait_days: Calendar days after an opt-out or termination before the vehicle may enroll again, integer.
  connected_car_min_model_year: Oldest model year supported for connected-car data, YYYY (0 = not applicable).
  connected_car_supported_makes: List of makes whose connected-car data is supported (empty when not applicable).
  teen_driver_max_age: Oldest driver age the teen coaching program accepts, years (0 = not applicable).
  parent_alerts_included: Boolean switch; whether the named insured receives speeding and curfew alerts for the teen driver.
  crash_detection_included: Boolean switch; whether crash detection with an emergency call is included.
  per_mile_rate_cents: Per-mile rate under a pay-per-mile program, cents per mile (0 = not pay-per-mile).
  pay_per_mile_daily_cap_miles: Most miles charged for one calendar day, miles (0 = not pay-per-mile).
  pay_per_mile_base_rate_pct: Share of the vehicle's rated premium kept as the fixed base rate under pay-per-mile, percent (100 = not pay-per-mile).
  mileage_billing_cycle: Period over which miles are billed (calendar_month).
  odometer_photo_required: Boolean switch; whether an odometer photo is required at enrollment and on request.
  outage_mileage_estimate_basis: How miles are estimated for days without data (average_daily_miles_last_30_days).
  odometer_correction_window_days: Calendar days after a mileage charge within which an odometer correction is accepted, integer.
  data_retention_days: Days trip-level data is kept, integer.
  data_shared_with_third_parties: Boolean switch; whether driving data is shared outside Cardinal for marketing.
  score_used_for_claims: Boolean switch; whether driving data is used to decide claims.
  telematics_eligible_packages_rule: Which auto packages allow enrollment (auto package telematics_eligible true).
  vehicle_must_be_scheduled: Boolean switch; whether only a vehicle scheduled on the policy may enroll.
  max_drivers_tracked: Drivers whose trips are scored for the vehicle, integer.
  app_driver_identification: How mobile trips are attributed to a driver (driver_profile_in_app).
  surcharge_cap_by_term: Most a surcharge may change between consecutive terms, percent.

