events:
  # ---- holding writes (telematics_enrollments) ----------------------------------------------
  - type: telematics_enroll
    target: telematics_enrollments
    mutation: create
    meaning: A scheduled vehicle is enrolled in a DriveSense program.
    grain: One row per enrollment.
    fields:
      enrollment_id: Enrollment reference.
      customer_id: Named insured.
      policy_id: Policy the vehicle is scheduled on.
      vehicle_id: Vehicle enrolled.
      driver_id: Driver scored (mobile and teen programs); empty for vehicle-level programs.
      variant_name: Program chosen.
      enrolled_date: Date enrolled.
      device_serial: Serial number of the plug-in device assigned (empty when no device).
    triggers:
      - event: telematics:telematics_device_shipped
        when: {variant_name: [Cardinal DriveSense Plug-In, Cardinal DriveSense Miles Plug-In]}
        map: {enrollment_id: enrollment_id, customer_id: customer_id, device_serial: device_serial}
  - type: telematics_activate
    target: telematics_enrollments
    mutation: {transition: {from: enrolled, to: observing}}
    meaning: The first trip is received and the observation period (or mileage tracking) begins.
    grain: One row per transaction.
    fields:
      status: Set to observing.
      observation_start_date: Date of the first trip.
    triggers: []
  - type: telematics_activation_lapse
    target: telematics_enrollments
    mutation: {transition: {from: enrolled, to: terminated}}
    meaning: Nothing was activated within the activation window and the enrollment ends.
    grain: One row per transaction.
    fields:
      status: Set to terminated.
      end_date: Day after the activation window closed.
      end_reason: Set to never_activated.
    triggers: []
  - type: telematics_observation_complete
    target: telematics_enrollments
    mutation: {transition: {from: observing, to: scored}}
    meaning: The observation period completes and the earned discount or surcharge is fixed.
    grain: One row per transaction.
    fields:
      status: Set to scored.
      final_score: Score at the end of the observation period.
      earned_adjustment_pct: Earned discount (positive) or surcharge (negative) percent fixed for the next renewal.
    triggers: []
  - type: telematics_opt_out
    target: telematics_enrollments
    mutation:
      transition:
        - {from: observing, to: opted_out}
        - {from: scored, to: opted_out}
    meaning: The customer opts out of the program.
    grain: One row per transaction.
    fields:
      status: Set to opted_out.
      end_date: Date of the opt-out.
      end_reason: Set to customer_opt_out.
      enrollment_id: Enrollment ended.
      customer_id: Named insured.
      device_serial: Device to be returned, if any.
      variant_name: Program of the enrollment.
    triggers:
      - event: telematics:telematics_device_return_due
        when: {variant_name: [Cardinal DriveSense Plug-In, Cardinal DriveSense Miles Plug-In]}
        map: {enrollment_id: enrollment_id, customer_id: customer_id, device_serial: device_serial}
  - type: telematics_terminate
    target: telematics_enrollments
    mutation:
      transition:
        - {from: observing, to: terminated}
        - {from: scored, to: terminated}
    meaning: The enrollment ends because the vehicle left the policy or the device stayed disconnected too long.
    grain: One row per transaction.
    fields:
      status: Set to terminated.
      end_date: Date ended.
      end_reason: vehicle_removed or device_disconnected.
      vehicle_id: Vehicle of the enrollment.
      enrollment_id: Enrollment ended.
      customer_id: Named insured.
      device_serial: Device to be returned, if any.
      variant_name: Program of the enrollment.
    triggers:
      - event: telematics:telematics_device_return_due
        when: {variant_name: [Cardinal DriveSense Plug-In, Cardinal DriveSense Miles Plug-In]}
        map: {enrollment_id: enrollment_id, customer_id: customer_id, device_serial: device_serial}
  # ---- event-table writes (telematics_events) -----------------------------------------------
  - type: telematics_device_shipped
    target: telematics_events
    meaning: A plug-in device is shipped to the customer.
    grain: One row per device shipment.
    distinguish_by: [device_serial]
    fields:
      telematics_event_id: Event reference.
      enrollment_id: Enrollment.
      customer_id: Named insured.
      device_serial: Device shipped.
      event_date: Ship date.
    triggers: []
  - type: telematics_score_posted
    target: telematics_events
    meaning: The running driving score and miles for one month are posted.
    grain: One row per enrollment per scoring month.
    distinguish_by: [period_start]
    fields:
      telematics_event_id: Event reference.
      enrollment_id: Enrollment.
      customer_id: Named insured.
      period_start: First day of the month scored.
      period_end: Last day of the month scored.
      score: Running score at the end of the month (0-100).
      active_days: Days with at least one trip so far in the observation period.
      trips: Trips so far in the observation period.
      miles: Miles driven in the month.
      event_date: Date posted.
    triggers: []
  - type: telematics_device_return_due
    target: telematics_events
    meaning: A device return is requested after the enrollment ended.
    grain: One row per device return request.
    distinguish_by: [device_serial]
    fields:
      telematics_event_id: Event reference.
      enrollment_id: Enrollment.
      customer_id: Named insured.
      device_serial: Device to return.
      return_due_date: Last day the return is accepted without a fee.
      event_date: Date requested.
    triggers: []
  - type: telematics_device_returned
    target: telematics_events
    meaning: A returned device is received.
    grain: One row per device received.
    distinguish_by: [device_serial]
    fields:
      telematics_event_id: Event reference.
      enrollment_id: Enrollment.
      customer_id: Named insured.
      device_serial: Device received.
      event_date: Date received.
    triggers: []
  - type: telematics_device_fee
    target: telematics_events
    meaning: The device non-return fee is assessed and sent to billing.
    grain: One row per unreturned device.
    distinguish_by: [device_serial]
    fields:
      telematics_event_id: Event reference.
      enrollment_id: Enrollment.
      customer_id: Named insured.
      device_serial: Device not returned.
      amount: Fee, USD.
      event_date: Date assessed.
    triggers:
      - event: billing:billing_fee_charged
        map: {customer_id: customer_id, source_transaction_id: telematics_event_id, amount: amount, fee_type: device_non_return_fee}
  - type: telematics_mileage_charge
    target: telematics_events
    meaning: The per-mile charge for one billing month of a pay-per-mile program is posted.
    grain: One row per enrollment per billing month.
    distinguish_by: [period_start]
    fields:
      telematics_event_id: Event reference.
      enrollment_id: Enrollment.
      customer_id: Named insured.
      period_start: First day of the month billed.
      period_end: Last day of the month billed.
      miles: Chargeable miles after the daily cap.
      amount: Mileage charge, USD.
      event_date: Date posted.
    account: mileage_charges
    direction: in
    triggers: []
  - type: telematics_mileage_adjustment
    target: telematics_events
    meaning: A posted mileage charge is reduced (odometer correction, daily-cap correction, or an outage estimate replaced by actual data).
    grain: One row per adjustment of one mileage charge.
    distinguish_by: [source_event_id, adjustment_reason]
    fields:
      telematics_event_id: Event reference.
      enrollment_id: Enrollment.
      customer_id: Named insured.
      source_event_id: Mileage charge adjusted.
      adjustment_reason: Why adjusted.
      miles: Miles removed.
      amount: Amount credited, USD.
      event_date: Date posted.
    account: mileage_charges
    direction: out
    triggers: []

measures:
  - id: telematics_msr_active_days
    window: The observation period (observation_start_date plus observation_days).
    measure: Distinct days with at least one recorded trip, from the latest telematics_score_posted row of the period.
  - id: telematics_msr_monthly_miles
    window: One calendar billing month.
    measure: Sum over the month's days of min(miles driven that day, pay_per_mile_daily_cap_miles).

policies:
  - id: telematics_agg_multi_holding
    subject: [telematics_enroll]
    rule: >-
      DriveSense is held per vehicle: a vehicle may have only max_enrollments_per_vehicle enrollment that is enrolled,
      observing or scored, and a customer may enroll every scheduled vehicle, with no cap of its own. A vehicle can be
      enrolled only when it has no enrollment that is enrolled, observing or scored, and not within reenrollment_wait_days
      after its last opt-out or termination.
    eligibility:
      - id: one_enrollment_per_vehicle
        applies_to: [telematics_enroll]
        kind: dedup
        condition: "A vehicle can be enrolled only when it has no enrollment that is enrolled, observing or scored, and not within reenrollment_wait_days after its last opt-out or termination."
        evidence_fields: [telematics_enrollments.vehicle_id, telematics_enrollments.status, telematics_enrollments.end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [telematics_enrollments.vehicle_id]
          action_bindings:
            telematics_enrollments.vehicle_id: vehicle_id
        dedup_contract:
          table: telematics_enrollments
          mode: separate_record
          object_bindings: {vehicle_id: vehicle_id}
          duplicate_filters: {status: [enrolled, observing, scored]}
          distinct_fields: [end_date]
    params:
      max_per_customer: null

  - id: telematics_agg_policy_discount
    subject: [telematics_observation_complete, telematics_enroll]
    rule: >-
      DriveSense discounts and surcharges are applied vehicle by vehicle: each enrolled vehicle's participation or earned
      adjustment lowers (or, for a surcharge, raises) that vehicle's share of the base premium only, before the
      policy-level surcharges and discounts of the auto rating are applied, and is never averaged across the policy or
      moved to another vehicle. A DriveSense adjustment is not part of the policy discount sum and does not count toward
      the auto package's max_total_discount_pct. A vehicle on a pay-per-mile program takes no
      participation or earned discount.
    eligibility: []

  - id: telematics_enrollment_eligibility
    subject: [telematics_enroll, telematics_activate, telematics_activation_lapse]
    rule: >-
      A vehicle can be enrolled only while it is scheduled on an auto policy whose package has telematics_eligible true
      and whose status is bound or in_force. A vehicle is enrolled only while its auto policy status is bound or in_force.
      A connected-car program needs a supported make of model year connected_car_min_model_year or newer; the teen
      coaching program needs a rated driver no older than teen_driver_max_age; a pay-per-mile program needs an odometer
      photo at enrollment. A plug-in device is shipped within device_shipping_business_days. The app or device must
      report a first trip within activation_days of enrollment; otherwise the enrollment ends and no participation
      discount applies. The participation discount applies from participation_discount_applies_from.
    eligibility:
      - id: auto_policy_open_for_enrollment
        applies_to: [telematics_enroll]
        kind: state
        condition: "A vehicle is enrolled only while its auto policy status is bound or in_force."
        evidence_fields: [auto_policies.status, auto_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.policy_id]
          action_bindings:
            auto_policies.policy_id: policy_id
        state_contract:
          field: auto_policies.status
          allowed: [bound, in_force]

  - id: telematics_scoring
    subject: [telematics_score_posted, telematics_observation_complete]
    rule: >-
      Driving is scored from 0 to 100 using score_weights over hard braking (hard_brake_threshold_mph_per_sec), rapid
      acceleration, speeding (speeding_threshold_mph_over), handheld phone use where phone_handling_tracked, and driving
      in the night_driving_window; a running score is posted monthly. The observation period lasts observation_days from
      the first trip. A score is fixed only when the observation period has at least min_active_days active days and
      min_trips trips (telematics_msr_active_days); otherwise the observation is extended by one month at a time until it
      does, up to the end of the policy term. The fixed score earns the discount of its band in score_discount_ladder;
      below the lowest discount band it brings the surcharge of its band in score_surcharge_ladder, but only where the
      policy state is in surcharge_permitted_states and never more than max_surcharge_pct; elsewhere a low score earns no
      discount and no surcharge. The earned adjustment applies from discount_applies_from and, where rescored_each_term is
      false, stays for as long as the vehicle is insured with Cardinal. Driving data is never used to decide claims.
    eligibility: []
    measures: [telematics_msr_active_days]
    params:
      per_tier:
        Cardinal DriveSense Mobile: {max_earned_discount_pct: "=max_earned_discount_pct", max_surcharge_pct: "=max_surcharge_pct", observation_days: "=observation_days"}
        Cardinal DriveSense Plug-In: {max_earned_discount_pct: "=max_earned_discount_pct", max_surcharge_pct: "=max_surcharge_pct", observation_days: "=observation_days"}
        Cardinal DriveSense Connected Car: {max_earned_discount_pct: "=max_earned_discount_pct", max_surcharge_pct: "=max_surcharge_pct", observation_days: "=observation_days"}
        Cardinal DriveSense Teen Coach: {max_earned_discount_pct: "=max_earned_discount_pct", max_surcharge_pct: "=max_surcharge_pct", observation_days: "=observation_days"}
        Cardinal DriveSense Miles Mobile: {max_earned_discount_pct: "=max_earned_discount_pct", max_surcharge_pct: "=max_surcharge_pct", observation_days: "=observation_days"}
        Cardinal DriveSense Miles Plug-In: {max_earned_discount_pct: "=max_earned_discount_pct", max_surcharge_pct: "=max_surcharge_pct", observation_days: "=observation_days"}

  - id: telematics_device_handling
    subject: [telematics_device_shipped, telematics_device_return_due, telematics_device_returned, telematics_device_fee]
    rule: >-
      A plug-in device stays Cardinal's property. When a plug-in enrollment ends, a return is requested with a due date
      device_return_days after the end date. The device non-return fee is charged only when the device has not been received
      by the return due date. The return due date is the last day a return is accepted without a fee, and the fee may be
      charged from the next day. A device received after the fee was charged
      has the fee waived through billing. A device reported lost in a covered total loss or theft carries no fee.
    eligibility:
      - id: return_window_passed
        applies_to: [telematics_device_fee]
        kind: time
        condition: "The device non-return fee is charged only when the device has not been received by the return due date."
        evidence_fields: [telematics_events.return_due_date, telematics_events.device_serial]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [telematics_events.device_serial]
          action_bindings:
            telematics_events.device_serial: device_serial
        temporal_basis:
          clock: frozen_time
          anchor_event: the return due date
          anchor_source: telematics_events.return_due_date
          relation: not_before
          duration_source: params.fee_after_due_days
          unit: calendar_days
          counting_rule: "The return due date is the last day a return is accepted without a fee, and the fee may be charged from the next day."
          boundary: exclusive
    params:
      fee_after_due_days: 0

  - id: telematics_evt_pay_per_mile
    subject: [telematics_mileage_charge, telematics_mileage_adjustment]
    rule: >-
      Under a pay-per-mile program the vehicle's rated premium is reduced to pay_per_mile_base_rate_pct percent as a fixed
      base, and the miles driven each calendar month are charged at per_mile_rate_cents per mile, counting no more than
      pay_per_mile_daily_cap_miles miles for any one day (telematics_msr_monthly_miles); the charge is rounded to the cent
      and billed with the next installment. Days without data are estimated on outage_mileage_estimate_basis and replaced
      by actual data when it arrives. An odometer correction is accepted within odometer_correction_window_days after the
      charge it corrects and lowers that charge; a mileage charge is adjusted only once for each reason.
    eligibility: []
    formula:
      amount: round(telematics_msr_monthly_miles * per_mile_rate_cents / 100, 2)
    measures: [telematics_msr_monthly_miles]

  - id: telematics_opt_out_and_termination
    subject: [telematics_opt_out, telematics_terminate]
    rule: >-
      The customer may opt out at any time. A fixed earned discount is kept after opting out where
      discount_retained_after_opt_out is true; a participation discount ends with the opt-out at the next renewal, and a
      surcharge already fixed is kept until the next renewal. A pay-per-mile vehicle that opts out is re-rated at its full
      rated premium from the next renewal, with mileage charged through the opt-out date. An enrollment ends when the
      vehicle leaves the policy, or when no data arrives for device_disconnect_termination_days consecutive days during
      observation; a disconnected enrollment loses its participation discount.
    eligibility: []

  - id: telematics_teen_coaching
    subject: [telematics_enroll, telematics_score_posted, telematics_terminate]
    rule: >-
      The teen coaching program scores one rated driver no older than teen_driver_max_age on the enrollment date, using
      the driver's profile in the app. The named insured receives speeding and late-night alerts where
      parent_alerts_included. The teen's adjustment is rescored every term where rescored_each_term is true, and it is
      not kept after opting out. When the scored driver passes teen_driver_max_age the enrollment continues to the end of
      the current term and is then ended; the vehicle may enroll in another program after reenrollment_wait_days.
    eligibility: []

  - id: telematics_data_use
    subject: [telematics_score_posted, telematics_mileage_charge]
    rule: >-
      Trip-level driving data is kept for data_retention_days and is used only to set the DriveSense adjustment and the
      per-mile charge. Driving data is never shared outside Cardinal for marketing (data_shared_with_third_parties) and
      never used to decide a claim (score_used_for_claims). A customer who disputes a monthly score is shown the trip
      events behind it; the score itself is not changed at the desk, and an error in the data source is referred to the
      DriveSense support team.
    eligibility: []
