events:
  # ---- holding writes (physdmg_coverages) ---------------------------------------------------
  - type: physdmg_coverage_add
    target: physdmg_coverages
    mutation: create
    meaning: Collision and comprehensive are attached to a scheduled vehicle at a chosen deductible option.
    grain: One row per vehicle coverage.
    fields:
      coverage_id: Physical damage coverage reference.
      customer_id: Named insured.
      policy_id: Policy the vehicle is scheduled on.
      vehicle_id: Vehicle covered.
      variant_name: Deductible option chosen.
      effective_date: Date physical damage takes effect.
      inspection_due_date: Last day for the photo inspection (empty when exempt).
      loan_lease_payoff: Whether the loan/lease payoff option is carried.
      deductible_rewards_enrolled: Whether Deductible Rewards is enrolled.
      loss_payee_name: Lienholder or lessor exactly as on the contract, empty if owned.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: coverage_id, effective_date: effective_date, reason_code: coverage_added}
      - event: physdmg:physdmg_deductible_credit_earned
        when: {deductible_rewards_enrolled: true}
        map: {coverage_id: coverage_id, customer_id: customer_id, credit_reason: enrollment}
  - type: physdmg_inspection_complete
    target: physdmg_coverages
    mutation: {transition: {from: pending_inspection, to: active}}
    meaning: The photo inspection is accepted, or the vehicle is confirmed exempt, and coverage is active.
    grain: One row per transaction.
    fields:
      status: Set to active.
      inspection_completed_date: Date the inspection was accepted (the effective date when exempt).
    triggers: []
  - type: physdmg_inspection_lapse
    target: physdmg_coverages
    mutation: {transition: {from: pending_inspection, to: removed}}
    meaning: The inspection was not completed in time and physical damage comes off the vehicle.
    grain: One row per transaction.
    fields:
      vehicle_id: Vehicle concerned.
      status: Set to removed.
      end_date: Day after the inspection due date.
      policy_id: Policy concerned.
      customer_id: Named insured.
      coverage_id: Coverage removed.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: coverage_id, effective_date: end_date, reason_code: coverage_removed}
  - type: physdmg_storage_start
    target: physdmg_coverages
    mutation: {transition: {from: active, to: storage}}
    meaning: The vehicle is put in storage at the customer's request; collision is suspended and comprehensive stays.
    grain: One row per transaction.
    fields:
      vehicle_id: Vehicle concerned.
      status: Set to storage.
      storage_start_date: First day of storage.
      policy_id: Policy concerned.
      customer_id: Named insured.
      coverage_id: Coverage concerned.
    triggers:
      - event: rental:rental_coverage_suspend
        map: {coverage_id: coverage_id}
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: coverage_id, effective_date: storage_start_date, reason_code: coverage_removed}
  - type: physdmg_storage_end
    target: physdmg_coverages
    mutation: {transition: {from: storage, to: active}}
    meaning: The stored vehicle returns to use and collision is restored.
    grain: One row per transaction.
    fields:
      vehicle_id: Vehicle concerned.
      status: Set to active.
      storage_start_date: Cleared.
      policy_id: Policy concerned.
      customer_id: Named insured.
      coverage_id: Coverage concerned.
    triggers:
      - event: rental:rental_coverage_resume
        map: {coverage_id: coverage_id}
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: coverage_id, reason_code: coverage_added}
  - type: physdmg_coverage_remove
    target: physdmg_coverages
    mutation:
      transition:
        - {from: active, to: removed}
        - {from: storage, to: removed}
    meaning: Physical damage is removed from the vehicle.
    grain: One row per transaction.
    fields:
      vehicle_id: Vehicle concerned.
      status: Set to removed.
      end_date: Date physical damage ends.
      policy_id: Policy concerned.
      customer_id: Named insured.
      coverage_id: Coverage removed.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: coverage_id, effective_date: end_date, reason_code: coverage_removed}
      - event: rental:rental_coverage_remove
        map: {coverage_id: coverage_id}
  - type: physdmg_deductible_change
    target: physdmg_coverages
    mutation: update
    meaning: The deductible option on the vehicle is changed.
    grain: One row per transaction.
    fields:
      vehicle_id: Vehicle concerned.
      variant_name: New deductible option.
      deductible_change_effective_date: Date the new option takes effect.
      policy_id: Policy concerned.
      customer_id: Named insured.
      coverage_id: Coverage changed.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: coverage_id, effective_date: deductible_change_effective_date, reason_code: deductible_change}
  - type: physdmg_option_update
    target: physdmg_coverages
    mutation: update
    meaning: The loan/lease payoff option, Deductible Rewards enrollment or the loss payee on the coverage is changed.
    grain: One row per transaction.
    fields:
      loan_lease_payoff: Whether the loan/lease payoff option is carried.
      deductible_rewards_enrolled: Whether Deductible Rewards is enrolled.
      loss_payee_name: Lienholder or lessor exactly as on the contract, empty if owned.
    triggers: []
  # ---- event-table writes (physdmg_claim_events) --------------------------------------------
  - type: physdmg_claim_report
    target: physdmg_claim_events
    meaning: First notice of a loss to the covered vehicle is recorded and a claim number is assigned.
    grain: One row per claim.
    distinguish_by: [claim_number]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim number assigned.
      loss_date: Date of the loss.
      report_date: Date the loss was reported.
      loss_cause: Cause of loss.
      driver_id: Driver at the time of loss (empty for a parked or stolen vehicle).
      drivable: Whether the vehicle can be driven safely.
      occurrence_reference: Reference shared by every claim arising from the same occurrence.
      event_date: Date recorded.
    triggers: []
  - type: physdmg_coverage_decision
    target: physdmg_claim_events
    meaning: The claim is accepted or denied under a coverage part, with the deductible that applies.
    grain: One row per coverage decision on a claim (a reconsidered decision is a new row).
    distinguish_by: [claim_number, coverage_decision, event_date]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim decided.
      coverage_part: collision or comprehensive.
      coverage_decision: accepted or denied.
      denial_reason: Ground of a denial (none when accepted).
      deductible_amount: Deductible that applies to the claim after waivers, before any Deductible Rewards credit, USD.
      event_date: Date decided.
    triggers: []
  - type: physdmg_fault_determination
    target: physdmg_claim_events
    meaning: Liability for a collision is determined, including the other party's insurance status.
    grain: One row per fault determination on a claim (a revised determination is a new row).
    distinguish_by: [claim_number, fault_determination, insured_fault_pct, event_date]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      fault_determination: Who is at fault.
      insured_fault_pct: Percent of fault charged to the Cardinal driver.
      other_party_insured: Insurance status of the other party.
      event_date: Date determined.
    triggers: []
  - type: physdmg_estimate_written
    target: physdmg_claim_events
    meaning: A repair estimate or a supplement to it is written for the claim.
    grain: One row per estimate version (0 = original, 1, 2, ... = supplements).
    distinguish_by: [claim_number, estimate_sequence]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      estimate_sequence: 0 for the original estimate, then 1, 2, ... for supplements.
      estimate_amount: Gross amount of this estimate version (for a supplement, the supplement amount only), USD.
      repair_shop_type: Cardinal Select Shop or a shop outside the network.
      glass_work: Whether the estimate is glass work, and repair or replacement.
      event_date: Date written.
    triggers: []
  - type: physdmg_total_loss_declared
    target: physdmg_claim_events
    meaning: The vehicle is declared a total loss on the claim, with its valuation.
    grain: One row per claim declared a total loss.
    distinguish_by: [claim_number]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      acv_amount: Actual cash value from the valuation report, USD.
      estimate_amount: Repair estimate total at the declaration (0.00 for an unrecovered theft), USD.
      salvage_value: Highest salvage bid, USD.
      prior_damage_amount: Unrepaired prior damage noted in the valuation, USD.
      replacement_cost_new: Price of a new vehicle of the same make, model and trim of the current model year from the valuation report, USD.
      custom_equipment_value: Documented value of aftermarket custom parts and equipment not included in actual cash value, USD.
      odometer_at_loss: Odometer at the loss, miles.
      event_date: Date declared.
    triggers: []
  - type: physdmg_storage_notice
    target: physdmg_claim_events
    meaning: The customer is told in writing to move the vehicle from a storage yard; storage charges after the notice period are not paid.
    grain: One row per storage notice on a claim.
    distinguish_by: [claim_number, notice_date]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      notice_date: Date the notice was sent.
      event_date: Date recorded.
    triggers: []
  - type: physdmg_claim_closed
    target: physdmg_claim_events
    meaning: The claim is closed.
    grain: One row per closing of a claim (a claim reopened and closed again has two rows).
    distinguish_by: [claim_number, event_date]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      close_reason: Why closed.
      event_date: Date closed.
    triggers: []
  - type: physdmg_claim_reopened
    target: physdmg_claim_events
    meaning: A closed claim is reopened.
    grain: One row per reopening.
    distinguish_by: [claim_number, event_date]
    fields:
      claim_event_id: Claim event reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      reopen_reason: Why reopened.
      event_date: Date reopened.
    triggers: []
  # ---- event-table writes (physdmg_payments) ------------------------------------------------
  - type: physdmg_claim_payment
    target: physdmg_payments
    meaning: A payment is issued on the claim for one component of the loss to one payee.
    grain: One row per payment (claim, component, payee, estimate version, source recovery, issue date).
    distinguish_by: [claim_number, payment_component, payee_type, estimate_sequence, source_recovery_id, payment_date]
    fields:
      payment_id: Payment reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim paid.
      payment_component: Component of the loss paid.
      payee_type: Who is paid.
      payee_name: Payee exactly as on the payment (joint payees joined by " and ").
      estimate_sequence: Estimate version paid (repair and supplement payments); empty otherwise.
      amount: Amount paid, USD.
      deductible_applied: Deductible taken from this payment, USD (0.00 when none).
      source_recovery_id: For a deductible reimbursement, the recovery it is paid from; empty otherwise.
      payment_date: Date issued.
    account: loss_paid
    direction: in
    triggers: []
  - type: physdmg_payment_void
    target: physdmg_payments
    meaning: An issued claim payment is voided (stopped or returned uncashed) and reversed.
    grain: One row per voided payment.
    distinguish_by: [source_payment_id]
    fields:
      payment_id: Void reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      source_payment_id: The payment voided.
      amount: Amount reversed, USD.
      payment_date: Date voided.
    account: loss_paid
    direction: out
    triggers: []
  - type: physdmg_recovery_received
    target: physdmg_payments
    meaning: Money is recovered on the claim from the at-fault party's insurer or from the sale of salvage.
    grain: One row per recovery receipt.
    distinguish_by: [claim_number, recovery_source, recovery_reference]
    fields:
      payment_id: Recovery reference.
      coverage_id: Coverage of the damaged vehicle.
      customer_id: Named insured.
      claim_number: Claim.
      recovery_source: Where the money came from.
      recovery_reference: Remittance or auction settlement number.
      amount: Amount recovered, USD.
      payment_date: Date received.
    account: loss_paid
    direction: out
    triggers:
      - event: physdmg:physdmg_claim_payment
        when: {recovery_source: subrogation}
        map: {coverage_id: coverage_id, customer_id: customer_id, claim_number: claim_number, source_recovery_id: payment_id, payment_component: deductible_reimbursement, payee_type: insured}
  - type: physdmg_deductible_credit_earned
    target: physdmg_payments
    meaning: Deductible Rewards credit is granted on enrollment or for 12 claim-free months.
    grain: One row per credit grant (enrollment, or each completed 12-month claim-free period).
    distinguish_by: [credit_reason, credit_period_end]
    fields:
      payment_id: Credit entry reference.
      coverage_id: Coverage.
      customer_id: Named insured.
      credit_reason: enrollment or claim_free_year.
      credit_period_end: Last day of the 12-month period earned (the enrollment date for the enrollment credit).
      amount: Credit granted, USD.
      payment_date: Date granted.
    account: deductible_credit
    direction: in
    triggers: []
  - type: physdmg_deductible_credit_used
    target: physdmg_payments
    meaning: Deductible Rewards credit is used to reduce the deductible on a paid claim.
    grain: One row per claim on which credit is used.
    distinguish_by: [claim_number]
    fields:
      payment_id: Credit entry reference.
      coverage_id: Coverage.
      customer_id: Named insured.
      claim_number: Claim the credit was used on.
      amount: Credit used, USD.
      payment_date: Date used.
    account: deductible_credit
    direction: out
    triggers: []

measures:
  - id: physdmg_msr_claim_paid
    window: Life of the claim.
    measure: Sum of physdmg_claim_payment amounts on the claim number less physdmg_payment_void amounts on it.
  - id: physdmg_msr_claim_free_months
    window: From the later of the Deductible Rewards enrollment date and the last paid collision or comprehensive claim's payment date, to the evaluation date.
    measure: Whole calendar months elapsed without a physdmg_claim_payment on the vehicle.
  - id: physdmg_msr_occurrence_vehicles
    window: One occurrence (same occurrence_reference).
    measure: Count of claims reported under the occurrence on vehicles of the same policy, and the highest deductible among their accepted coverage decisions.
  - id: physdmg_msr_worksheet_base_premium
    window: The policy term in which the premium is rated.
    measure: physdmg_base_premium on the rating_worksheets row of the vehicle for the policy and term.
  - id: physdmg_msr_transport_days
    window: From the end of the waiting period after the loss report to the day the repair is completed or the total-loss settlement is offered.
    measure: Whole calendar days in the window for which the customer documents a rental or transportation cost.
  - id: physdmg_msr_estimate_total
    window: Life of the claim.
    measure: Sum of estimate_amount over every physdmg_estimate_written row of the claim (original plus supplements).

policies:
  - id: physdmg_agg_multi_holding
    subject: [physdmg_coverage_add]
    rule: >-
      Physical damage is held per vehicle: a vehicle carries at most one physical damage coverage at a time, and a
      customer may hold as many as the vehicles scheduled on their auto policies, with no cap of its own. A coverage can
      be added to a vehicle only when no coverage on that vehicle is pending_inspection, active or in storage. Each
      vehicle's deductible option is chosen independently; options are never pooled across vehicles.
    eligibility:
      - id: one_coverage_per_vehicle
        applies_to: [physdmg_coverage_add]
        kind: dedup
        condition: "A coverage can be added to a vehicle only when no coverage on that vehicle is pending_inspection, active or in storage."
        evidence_fields: [physdmg_coverages.vehicle_id, physdmg_coverages.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_coverages.vehicle_id]
          action_bindings:
            physdmg_coverages.vehicle_id: vehicle_id
        dedup_contract:
          table: physdmg_coverages
          mode: separate_record
          object_bindings: {vehicle_id: vehicle_id}
          duplicate_filters: {status: [pending_inspection, active, storage]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: physdmg_agg_occurrence_deductible
    subject: [physdmg_coverage_decision, physdmg_claim_payment]
    rule: >-
      When two or more vehicles on the same policy are damaged in one occurrence (same occurrence_reference) and
      single_deductible_same_occurrence is true, only one deductible is applied to the occurrence: the highest deductible
      among the accepted claims, taken from the claim with the highest deductible; the other claims of the occurrence
      record a deductible of 0.00. Deductible Rewards credit is held per vehicle and can be used only on a claim of the
      vehicle that earned it. Loss paid is tracked per vehicle and never pooled.
    eligibility: []
    measures: [physdmg_msr_occurrence_vehicles]

  - id: physdmg_attach_eligibility
    subject: [physdmg_coverage_add, physdmg_inspection_complete, physdmg_inspection_lapse]
    rule: >-
      Physical damage can be attached only to a vehicle scheduled on an auto policy whose package has
      physical_damage_eligible true. Physical damage is added only while the auto policy status is bound or in_force.
      A financed or leased vehicle must carry physical damage with its lienholder or lessor as loss payee for as long as
      the lien or lease lasts. New physical damage starts no earlier than the date of the request (except under
      physdmg_newly_acquired_vehicle) and is pending_inspection until a photo inspection of the vehicle is accepted; a
      vehicle bought new from a dealer with a bill of sale is exempt where inspection_exempt_if_purchased_new is true and
      goes active the same day. Physical damage becomes active only when the photo inspection is accepted no later than
      inspection_due_days calendar days after the physical damage effective date. Days are counted from the coverage
      effective_date, that date being day 0, and an inspection accepted on the last day is in time. When the window
      passes without an accepted inspection, physical damage is removed the next day and the unearned premium is
      returned; a loss occurring while coverage is pending_inspection is still covered when it is reported before the
      removal. The loan/lease payoff option can be carried only on a financed or leased vehicle.
    eligibility:
      - id: auto_policy_open
        applies_to: [physdmg_coverage_add]
        kind: state
        condition: "Physical damage is added only while the auto policy status is bound or in_force."
        evidence_fields: [auto_policies.status, auto_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.policy_id]
          action_bindings:
            auto_policies.policy_id: policy_id
        state_contract:
          field: auto_policies.status
          allowed: [bound, in_force]
      - id: inspection_in_time
        applies_to: [physdmg_inspection_complete]
        kind: time
        condition: "Physical damage becomes active only when the photo inspection is accepted no later than inspection_due_days calendar days after the physical damage effective date."
        evidence_fields: [physdmg_coverages.effective_date, physdmg_coverages.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_coverages.coverage_id]
          action_bindings:
            physdmg_coverages.coverage_id: coverage_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the physical damage effective date
          anchor_source: physdmg_coverages.effective_date
          relation: not_after
          duration_source: variants.inspection_due_days
          unit: calendar_days
          counting_rule: "Days are counted from the coverage effective_date, that date being day 0, and an inspection accepted on the last day is in time."
          boundary: inclusive

  - id: physdmg_newly_acquired_vehicle
    subject: [physdmg_coverage_add, physdmg_coverage_decision]
    rule: >-
      A newly acquired vehicle is automatically covered for collision and comprehensive from its acquisition date,
      provided physical damage is carried on at least one vehicle already scheduled on the policy; during that automatic
      period a loss carries the newly_acquired_deductible. To keep physical damage from the acquisition date, the
      customer must ask for it within newly_acquired_report_days.
      Physical damage takes effect on the acquisition date only when it is requested no later than
      newly_acquired_report_days calendar days after the customer acquired the vehicle. The count starts on the
      acquisition_date of the vehicle record as day 0, and a request on the last day of the window is in time. A request
      after the window starts physical damage on the request date and no automatic coverage applies to a loss before
      then. If no vehicle on the policy carries physical damage, a newly acquired vehicle has no automatic physical
      damage at all.
    eligibility:
      - id: newly_acquired_physdmg_window
        applies_to: [physdmg_coverage_add]
        kind: time
        condition: "Physical damage takes effect on the acquisition date only when it is requested no later than newly_acquired_report_days calendar days after the customer acquired the vehicle."
        evidence_fields: [vehicles.acquisition_date, vehicles.vehicle_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vehicles.vehicle_id]
          action_bindings:
            vehicles.vehicle_id: vehicle_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the customer acquired the vehicle
          anchor_source: vehicles.acquisition_date
          relation: not_after
          duration_source: variants.newly_acquired_report_days
          unit: calendar_days
          counting_rule: "The count starts on the acquisition_date of the vehicle record as day 0, and a request on the last day of the window is in time."
          boundary: inclusive

  - id: physdmg_evt_premium
    subject: [physdmg_coverage_add, physdmg_deductible_change, physdmg_option_update]
    rule: >-
      The full-term physical damage premium of a vehicle is the physdmg_base_premium on the vehicle's rating worksheet
      for the term, multiplied by the deductible option's deductible_factor, and, when the loan/lease payoff option is
      carried, further multiplied by (1 + loan_lease_payoff_premium_pct / 100), rounded to the cent (half up). This
      premium enters the auto policy's base premium, where surcharges and discounts are applied under
      auto_evt_premium_rating, and every change to it during the term is prorated as additional or return premium on the
      auto policy. While the vehicle is in storage its physical damage premium is the comprehensive share only, which is
      storage_comprehensive_share_pct percent of the full physical damage premium. Deductible Rewards carries no premium.
    eligibility: []
    measures: [physdmg_msr_worksheet_base_premium]
    formula:
      physdmg_premium: round(physdmg_msr_worksheet_base_premium * deductible_factor * (1 + loan_lease_payoff_premium_pct / 100 * loan_lease_payoff), 2)
    params:
      storage_comprehensive_share_pct: 40

  - id: physdmg_claim_coverage
    subject: [physdmg_claim_report, physdmg_coverage_decision, physdmg_claim_closed, physdmg_claim_reopened]
    rule: >-
      A claim is covered only when the vehicle carried physical damage that was pending_inspection, active or (for a
      comprehensive loss) in storage on the loss date, and the auto policy was in force on the loss date. The coverage
      part follows the cause of loss: collision with another vehicle or object, rollover and a hit-and-run collision are
      collision; theft, vandalism, fire, hail, wind, flood, falling objects, glass breakage and hitting an animal (per
      animal_strike_coverage_part) are comprehensive. While the vehicle is in storage only comprehensive losses are
      covered. A claim is denied when the driver was excluded on the auto policy on the loss date, when the driver was a
      household member who should have been listed and was not, when the vehicle was used for a transportation network
      company and no rideshare endorsement was carried, when the damage is wear and tear, mechanical or electrical
      breakdown, freezing, or road damage to tires alone, or when the loss was intentional. Loss in market value after a
      repair (diminished value) is not paid where first_party_diminished_value_covered is false. A loss is decided at the
      desk only when it is reported no more than late_report_review_days calendar days after the loss date; a later report
      is referred to a claims supervisor and is not decided at the desk. Report lateness is counted in calendar days from
      the loss_date as day 0 to the report_date, and a report on the last day is timely. A claim number is assigned once per damaged
      vehicle per occurrence; a second report of the same loss is attached to the existing claim. A claim is closed when
      every payment due has been issued, when it is denied, when the estimate is below the deductible, or when the
      customer withdraws it; a closed claim is reopened for a supplement, a recovered theft vehicle or a recovery.
    eligibility:
      - id: one_claim_per_vehicle_occurrence
        applies_to: [physdmg_claim_report]
        kind: dedup
        condition: "A claim number is assigned once per damaged vehicle per occurrence; a second report of the same loss is attached to the existing claim."
        evidence_fields: [physdmg_claim_events.coverage_id, physdmg_claim_events.occurrence_reference, physdmg_claim_events.loss_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_claim_events.coverage_id, physdmg_claim_events.occurrence_reference]
          action_bindings:
            physdmg_claim_events.coverage_id: coverage_id
            physdmg_claim_events.occurrence_reference: occurrence_reference
        dedup_contract:
          table: physdmg_claim_events
          mode: separate_record
          object_bindings: {coverage_id: coverage_id, occurrence_reference: occurrence_reference}
          duplicate_filters: {event_type: [physdmg_claim_report]}
          distinct_fields: []
      - id: timely_report
        applies_to: [physdmg_claim_report]
        kind: time
        condition: "A loss is decided at the desk only when it is reported no more than late_report_review_days calendar days after the loss date"
        evidence_fields: [physdmg_claim_events.loss_date, physdmg_claim_events.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_claim_events.claim_number]
          action_bindings:
            physdmg_claim_events.claim_number: claim_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the loss date
          anchor_source: physdmg_claim_events.loss_date
          relation: not_after
          duration_source: variants.late_report_review_days
          unit: calendar_days
          counting_rule: "Report lateness is counted in calendar days from the loss_date as day 0 to the report_date, and a report on the last day is timely."
          boundary: inclusive

  - id: physdmg_evt_deductible
    subject: [physdmg_coverage_decision, physdmg_claim_payment, physdmg_deductible_credit_used]
    rule: >-
      The deductible on an accepted claim is fixed in this order. Step 1, base: collision_deductible for a collision
      claim; for a comprehensive claim, glass_repair_deductible when glass is repaired, glass_replacement_deductible when
      glass is replaced, otherwise comprehensive_deductible; during the automatic period of a newly acquired vehicle the
      newly_acquired_deductible instead. The option in force is the one effective on the loss
      date. Step 2, waivers: where collision_deductible_waiver is true, the collision deductible is waived when the
      latest fault determination is other_party_at_fault with no share of fault on the Cardinal driver and the other
      party is identified and uninsured; a hit-and-run with an unidentified driver does not qualify. Step 3, occurrence: physdmg_agg_occurrence_deductible.
      Step 4, Deductible Rewards: the credit balance reduces the remaining deductible, credit used = min(credit balance,
      deductible), and the credit used is debited from the balance when the payment that takes the deductible is
      issued. The deductible is taken once per claim, from the first payment of the repair or the settlement, never from
      towing, storage, pet injury or transportation payments.
    eligibility: []
    formula:
      deductible_net: max(0, deductible_amount - min(deductible_credit, deductible_amount))

  - id: physdmg_evt_repair_payment
    subject: [physdmg_estimate_written, physdmg_claim_payment, physdmg_storage_notice]
    rule: >-
      A repair payment is issued only after the claim is accepted. A claim payment is issued only when the latest
      coverage decision on the claim is accepted. The first repair payment pays the original estimate less the
      deductible (net of Deductible Rewards credit); each supplement is paid in full as its own payment, and a supplement
      at or above supplement_reinspection_threshold is reinspected before payment. When every estimate version together is
      at or below the deductible, nothing is paid and the claim closes below deductible. At a Cardinal Select Shop the
      payment goes to the shop and the repair carries select_shop_workmanship_warranty; elsewhere it goes to the insured
      at non_network_labor_rate_basis, and a repair payment at or above lienholder_joint_check_threshold on a vehicle with
      a loss payee names the loss payee jointly. Original manufacturer parts are used on vehicles of
      oem_parts_max_vehicle_age_years model years or newer; driver-assistance calibration is paid where
      adas_calibration_covered. Towing from the scene is paid up to tow_from_scene_max_miles. Storage is paid up to
      storage_daily_max per day through storage_days_after_notice days after the storage notice. Veterinary bills of a dog
      or cat injured in a covered collision are paid up to pet_injury_limit without a deductible. Aftermarket custom
      equipment is paid up to custom_equipment_limit. A payment that was issued in error, or that is returned uncashed, is
      voided and reissued as a new payment.
    eligibility:
      - id: claim_accepted
        applies_to: [physdmg_claim_payment]
        kind: state
        condition: "A claim payment is issued only when the latest coverage decision on the claim is accepted."
        evidence_fields: [physdmg_claim_events.coverage_decision, physdmg_claim_events.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_claim_events.claim_number]
          action_bindings:
            physdmg_claim_events.claim_number: claim_number
        state_contract:
          field: physdmg_claim_events.coverage_decision
          allowed: [accepted]
    measures: [physdmg_msr_estimate_total, physdmg_msr_claim_paid]

  - id: physdmg_total_loss
    subject: [physdmg_total_loss_declared, physdmg_claim_payment, physdmg_coverage_remove]
    rule: >-
      The vehicle is a total loss when the repair estimate total is at or above the policy_state's percentage in
      total_loss_threshold_pct_by_state of the actual cash value, or when a stolen vehicle is not recovered. Actual cash
      value comes from a valuation report of at least acv_min_comparables comparable vehicles within
      acv_comparable_radius_miles of the garaging ZIP. The settlement is computed in this order: actual cash value, less
      unrepaired prior damage where prior_damage_deduction_applies, plus sales tax at the policy_state's rate in
      sales_tax_rate_by_state on that adjusted value, plus the state's title fee from title_fee_by_state, plus aftermarket
      custom equipment up to custom_equipment_limit, less the deductible (net of Deductible Rewards credit), less the
      salvage_value when the customer keeps the vehicle as owner-retained salvage (where owner_retained_salvage_allowed);
      each step is rounded to the cent. Where the auto package has new_car_replacement_included true and the vehicle was
      bought new, is no more than new_car_replacement_max_age_months months past its acquisition date and has no more
      than new_car_replacement_max_miles miles at the loss, replacement_cost_new replaces actual cash value in the first
      step and no prior damage is deducted. A loss payee is paid first, up to the loan or lease payoff on the payoff
      letter, and the rest goes to the insured. When the payoff exceeds the settlement and the coverage carries the
      loan/lease payoff option, the difference is paid to the loss payee up to loan_lease_payoff_pct_of_acv of actual
      cash value; the deductible, past-due loan payments, late charges and lease excess-wear or excess-mileage charges
      are never part of that difference. The settlement is paid only after the customer has accepted the settlement
      offer, and within total_loss_payment_days after the signed title (or owner-retained salvage paperwork) and the
      acceptance are received. A total-loss settlement is paid only when the settlement offer for that claim has been
      accepted by the customer. An unrecovered stolen vehicle is settled only after theft_settlement_wait_days calendar days
      have passed since the theft was reported. Days are counted from the report_date of the theft claim, that date being day 0,
      and settlement is allowed from the last day of the waiting period onward. A vehicle recovered after settlement
      belongs to Cardinal; the customer may buy it back within theft_recovery_buyback_days of the recovery notice by
      returning the settlement less the vehicle's damage. A customer who disputes actual cash value may invoke appraisal,
      each side paying its own appraiser and sharing the umpire; the disputed claim is not settled at the desk. Physical
      damage on the vehicle is removed once the settlement is paid.
    eligibility:
      - id: settlement_accepted
        applies_to: [physdmg_claim_payment]
        kind: state
        condition: "A total-loss settlement is paid only when the settlement offer for that claim has been accepted by the customer."
        evidence_fields: [physdmg_total_loss_settlements.offer_status, physdmg_total_loss_settlements.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_total_loss_settlements.claim_number]
          action_bindings:
            physdmg_total_loss_settlements.claim_number: claim_number
        state_contract:
          field: physdmg_total_loss_settlements.offer_status
          allowed: [accepted]
      - id: theft_wait_elapsed
        applies_to: [physdmg_claim_payment]
        kind: time
        condition: "An unrecovered stolen vehicle is settled only after theft_settlement_wait_days calendar days have passed since the theft was reported."
        evidence_fields: [physdmg_claim_events.report_date, physdmg_claim_events.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_claim_events.claim_number]
          action_bindings:
            physdmg_claim_events.claim_number: claim_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the theft was reported
          anchor_source: physdmg_claim_events.report_date
          relation: not_before
          duration_source: variants.theft_settlement_wait_days
          unit: calendar_days
          counting_rule: "Days are counted from the report_date of the theft claim, that date being day 0, and settlement is allowed from the last day of the waiting period onward."
          boundary: inclusive
    formula:
      settlement_before_deductible: round(acv_amount - prior_damage_amount, 2) + round((acv_amount - prior_damage_amount) * sales_tax_rate_by_state / 100, 2) + title_fee_by_state + min(custom_equipment_limit, custom_equipment_value)
      settlement_net: settlement_before_deductible - deductible_amount

  - id: physdmg_evt_recovery_and_reimbursement
    subject: [physdmg_recovery_received, physdmg_claim_payment, physdmg_payment_void, physdmg_fault_determination]
    rule: >-
      Fault on a collision claim is determined from the police report, the drivers' statements and the physical evidence,
      and the Cardinal driver's share is recorded as insured_fault_pct with the other party's insurance status; a revised
      determination is recorded as a new determination and the latest one governs. The claim counts as an at-fault
      accident of the Cardinal driver when insured_fault_pct is above at_fault_record_threshold_pct. Subrogation is pursued
      against the other party only when insured_fault_pct is below the policy_state's bar in
      subrogation_fault_bar_pct_by_state, for the other party's share of what was paid plus the deductible.
      When the other party is at fault, Cardinal pursues subrogation for what it paid plus the insured's deductible. A
      subrogation recovery first reimburses the insured's deductible in the same proportion that the recovery bears to the
      total loss (amount paid plus deductible), rounded to the cent, and the reimbursement is paid to the insured as its
      own payment tied to that recovery; Deductible Rewards credit used on the claim is restored to the vehicle's credit
      in the same proportion instead of being paid in cash. Salvage proceeds are kept by Cardinal and reimburse no
      deductible. A recovery is recorded once per remittance. A voided payment reverses its amount from loss paid.
    eligibility: []
    formula:
      deductible_reimbursement: round(deductible_applied * amount / (physdmg_msr_claim_paid + deductible_applied), 2)
    measures: [physdmg_msr_claim_paid]
    params:
      at_fault_record_threshold_pct: 50
      subrogation_fault_bar_pct_by_state: {OH: 51, IN: 51, KY: 100, VA: 1, WV: 50}

  - id: physdmg_deductible_rewards
    subject: [physdmg_deductible_credit_earned, physdmg_deductible_credit_used, physdmg_option_update]
    rule: >-
      Deductible Rewards can be enrolled only on an option with deductible_rewards_available true, and grants
      deductible_rewards_enrollment_credit on enrollment. For each 12 consecutive months without a paid collision or
      comprehensive claim on the vehicle (physdmg_msr_claim_free_months), deductible_rewards_annual_credit is granted, and
      the balance never exceeds deductible_rewards_max_credit; a grant that would exceed it is reduced to the cap. A
      12-month period earns credit once; a credit is granted only for a completed claim-free period that has not already
      earned a credit. Using credit on a claim starts a new 12-month period from that claim's payment date. Unenrolling,
      changing to an option without Deductible Rewards, or removing physical damage forfeits the remaining credit;
      credit is never paid in cash.
    eligibility:
      - id: period_not_already_credited
        applies_to: [physdmg_deductible_credit_earned]
        kind: dedup
        condition: "a credit is granted only for a completed claim-free period that has not already earned a credit"
        evidence_fields: [physdmg_payments.coverage_id, physdmg_payments.credit_period_end]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_payments.coverage_id, physdmg_payments.credit_period_end]
          action_bindings:
            physdmg_payments.coverage_id: coverage_id
            physdmg_payments.credit_period_end: credit_period_end
        dedup_contract:
          table: physdmg_payments
          mode: separate_record
          object_bindings: {coverage_id: coverage_id, credit_period_end: credit_period_end}
          duplicate_filters: {event_type: [physdmg_deductible_credit_earned]}
          distinct_fields: []
    measures: [physdmg_msr_claim_free_months]
    formula:
      credit_granted: min(deductible_rewards_annual_credit, deductible_rewards_max_credit - deductible_credit)
    params:
      per_tier:
        Cardinal Physical Damage $2,000 Deductible: {enrollment_credit: "=deductible_rewards_enrollment_credit", annual_credit: "=deductible_rewards_annual_credit", max_credit: "=deductible_rewards_max_credit"}
        Cardinal Physical Damage $1,000 Deductible: {enrollment_credit: "=deductible_rewards_enrollment_credit", annual_credit: "=deductible_rewards_annual_credit", max_credit: "=deductible_rewards_max_credit"}
        Cardinal Physical Damage $750 Deductible: {enrollment_credit: "=deductible_rewards_enrollment_credit", annual_credit: "=deductible_rewards_annual_credit", max_credit: "=deductible_rewards_max_credit"}
        Cardinal Physical Damage $500 Deductible: {enrollment_credit: "=deductible_rewards_enrollment_credit", annual_credit: "=deductible_rewards_annual_credit", max_credit: "=deductible_rewards_max_credit"}
        Cardinal Physical Damage $250 Deductible: {enrollment_credit: "=deductible_rewards_enrollment_credit", annual_credit: "=deductible_rewards_annual_credit", max_credit: "=deductible_rewards_max_credit"}
        Cardinal Physical Damage $100 Deductible: {enrollment_credit: "=deductible_rewards_enrollment_credit", annual_credit: "=deductible_rewards_annual_credit", max_credit: "=deductible_rewards_max_credit"}

  - id: physdmg_storage_and_changes
    subject: [physdmg_storage_start, physdmg_storage_end, physdmg_coverage_remove, physdmg_deductible_change]
    rule: >-
      A vehicle may be put in storage when the customer expects it to be off the road for at least storage_min_days;
      collision is suspended and comprehensive stays in force, and no claim for a collision loss during storage is
      covered. Storage ends on the day the customer asks to drive the vehicle again. A financed or leased vehicle may be
      put in storage but its physical damage cannot be removed while the loss payee is on the coverage. A deductible
      increase takes effect today or a later date the customer chooses within the auto endorsement window; a deductible
      decrease takes effect only after a new photo inspection is accepted where deductible_decrease_requires_inspection
      is true. A deductible change never applies to a loss that occurred before its effective date. Physical damage is
      removed when the customer asks (unless a loss payee is on it), when the vehicle is removed from the policy, when
      the auto package no longer allows physical damage, or when a total-loss settlement is paid. Removing physical
      damage also removes the rental reimbursement option on the vehicle.
    eligibility: []

  - id: physdmg_evt_transportation_expense
    subject: [physdmg_claim_payment]
    rule: >-
      When the vehicle has a covered loss and carries no Cardinal Rental Reimbursement option, the built-in
      transportation expense pays the customer's documented rental or transportation costs of transportation_expense_daily
      per day up to transportation_expense_max per loss. It starts transportation_wait_hours_theft hours after a total
      theft is reported, or transportation_wait_hours_other hours after any other covered loss, and ends when the vehicle
      is repaired, or when the total-loss settlement is offered. When the vehicle carries a rental reimbursement option,
      the built-in benefit does not apply and the two are never added together. It is paid without a deductible as
      payment_component transportation_expense.
    eligibility: []
    measures: [physdmg_msr_transport_days]
    formula:
      transportation_payment: min(transportation_expense_daily * physdmg_msr_transport_days, transportation_expense_max)

# ============================================================================
# extended_policies (erl-task-instantiate, difficulty physical_damage_claims_and_total_loss)
# ============================================================================
extended_policies:
  - id: physdmg_ext_accident_deductible
    base_policy_refs: [physdmg_agg_occurrence_deductible, physdmg_newly_acquired_vehicle, physdmg_claim_coverage, physdmg_evt_deductible]
    overwrite:
      - base_policy: physdmg_evt_deductible
        superseded_clause: >-
          The deductible on an accepted claim is fixed in this order.
        replaced_by: >-
          The figures combine in one fixed order: first the option deductible is capped, giving the capped
          deductible; the loyalty reduction is then subtracted from the capped deductible; the DriveSense reduction is
          then applied to that figure, never going below zero; the waiver share then multiplies that result, and the
          product is rounded to the cent only at the end.
      - base_policy: physdmg_evt_deductible
        superseded_clause: >-
          Step 2, waivers: where collision_deductible_waiver is true, the collision deductible is waived when the
          latest fault determination is other_party_at_fault with no share of fault on the Cardinal driver and the
          other party is identified and uninsured; a hit-and-run with an unidentified driver does not qualify.
        replaced_by: >-
          Uninsured-driver waiver: on a collision claim under an option whose collision_deductible_waiver is true,
          when the latest fault determination finds the other party at fault with no share of fault on the Cardinal
          driver and the other party identified and uninsured, the deductible is waived entirely; when the latest
          fault determination charges the Cardinal driver a share of fault above zero and no more than
          partial_waiver_max_fault_pct percent and the other party is identified and uninsured, the deductible is
          charged at partial_waiver_share_pct percent; in every other case, a hit-and-run with an unidentified
          driver included, the deductible is charged in full.
    trigger: state_due
    subject: [physdmg_coverage_decision]
    computes: deductible_amount
    target_tool: record_claim_acceptance_ec9cfb06
    params:
      premier_deductible_cap: 500
      preferred_deductible_cap: 750
      loyalty_long_tenure_months: 120
      loyalty_mid_tenure_months: 60
      loyalty_long_reduction: 100
      loyalty_mid_reduction: 50
      drivesense_top_score: 90
      drivesense_middle_score: 75
      drivesense_top_reduction_pct: 20
      drivesense_middle_reduction: 50
      partial_waiver_max_fault_pct: 25
      partial_waiver_share_pct: 75
    rule: >-
      The accepted-claim deductible is the deductible recorded when the desk accepts a reported claim; it is fixed
      by this rule for a claim that is the only claim of its occurrence, while a claim that shares its occurrence
      reference with another vehicle's claim on the same policy is fixed under the one-deductible-per-occurrence
      rule instead. The coverage part follows the cause of loss: a collision with another vehicle or object, a
      rollover and a hit-and-run collision are collision, and every other cause is comprehensive. The option
      deductible is the collision_deductible of the deductible option on a collision claim; on a comprehensive
      claim it is the glass_repair_deductible when the claim's estimate is glass repair, the
      glass_replacement_deductible when the estimate is glass replacement, and otherwise the
      comprehensive_deductible. When the loss date falls before the date physical damage took effect on the
      vehicle, the loss falls in the automatic period of a newly acquired vehicle and the option deductible is the
      newly_acquired_deductible instead. The accepted-claim deductible is the option deductible, rounded to the
      cent.
      Package deductible cap: on a policy written on Cardinal Auto Premier the option deductible is capped at
      premier_deductible_cap, on a policy written on Cardinal Auto Preferred it is capped at
      preferred_deductible_cap, and on every other package the option deductible stands uncapped.
      Loyalty reduction: where the auto policy's inception date is at least loyalty_long_tenure_months whole months
      before the loss date, loyalty_long_reduction is subtracted; where it is at least loyalty_mid_tenure_months but
      fewer than loyalty_long_tenure_months whole months before the loss date, loyalty_mid_reduction is subtracted;
      otherwise nothing is subtracted.
      DriveSense reduction: where the vehicle's DriveSense enrollment is scored with a final score of
      drivesense_top_score or higher, the deductible after the loyalty reduction is reduced by
      drivesense_top_reduction_pct percent of itself; where it is scored with a final score of at least
      drivesense_middle_score but below drivesense_top_score, the flat amount drivesense_middle_reduction is
      subtracted from it; where the vehicle has no scored DriveSense enrollment, or its final score is below
      drivesense_middle_score, it is not reduced.
      Uninsured-driver waiver: on a collision claim under an option whose collision_deductible_waiver is true,
      when the latest fault determination finds the other party at fault with no share of fault on the Cardinal
      driver and the other party identified and uninsured, the deductible is waived entirely; when the latest
      fault determination charges the Cardinal driver a share of fault above zero and no more than
      partial_waiver_max_fault_pct percent and the other party is identified and uninsured, the deductible is
      charged at partial_waiver_share_pct percent; in every other case, a hit-and-run with an unidentified
      driver included, the deductible is charged in full.
      The figures combine in one fixed order: first the option deductible is capped, giving the capped
      deductible; the loyalty reduction is then subtracted from the capped deductible; the DriveSense reduction is
      then applied to that figure, never going below zero; the waiver share then multiplies that result, and the
      product is rounded to the cent only at the end.
    prerequisite: []
    cross_category:
      - category: auto
        as: branch
        reads: [variant_name, inception_date]
        note: The package decides the deductible cap; the policy's inception date decides the loyalty reduction.
      - category: telematics
        as: branch
        reads: [status, final_score]
        note: The vehicle's DriveSense enrollment status and final score decide how the DriveSense reduction is computed.
    compute:
      - claim: "LATEST('physdmg_claim_events', 'claim_number', event_type='physdmg_claim_report')"
      - loss_date: "LATEST('physdmg_claim_events', 'loss_date', event_type='physdmg_claim_report', claim_number=claim)"
      - loss_cause: "LATEST('physdmg_claim_events', 'loss_cause', event_type='physdmg_claim_report', claim_number=claim)"
      - glass_work: "LATEST('physdmg_claim_events', 'glass_work', event_type='physdmg_estimate_written', claim_number=claim)"
      - is_collision: "loss_cause == 'collision_vehicle' or loss_cause == 'collision_object' or loss_cause == 'rollover' or loss_cause == 'hit_and_run'"
      - option_deductible: "P('newly_acquired_deductible') if loss_date < F('effective_date') else (P('collision_deductible') if is_collision else (P('glass_repair_deductible') if glass_work == 'glass_repair' else (P('glass_replacement_deductible') if glass_work == 'glass_replacement' else P('comprehensive_deductible'))))"
      - package: "CFIELD('auto', 'variant_name', policy_id=F('policy_id'))"
      - package_cap: "K('premier_deductible_cap') if package == 'Cardinal Auto Premier' else (K('preferred_deductible_cap') if package == 'Cardinal Auto Preferred' else option_deductible)"
      - capped_deductible: "MN(option_deductible, package_cap)"
      - tenure_months: "MONTHS(CFIELD('auto', 'inception_date', policy_id=F('policy_id')), loss_date)"
      - loyalty_reduction: "K('loyalty_long_reduction') if tenure_months >= K('loyalty_long_tenure_months') else (K('loyalty_mid_reduction') if tenure_months >= K('loyalty_mid_tenure_months') else 0)"
      - after_loyalty: "MX(0, capped_deductible - loyalty_reduction)"
      - ds_status: "CFIELD('telematics', 'status', vehicle_id=F('vehicle_id'))"
      - ds_score: "CFIELD('telematics', 'final_score', vehicle_id=F('vehicle_id'))"
      - after_drivesense: "MX(0, after_loyalty * (1 - K('drivesense_top_reduction_pct') / 100)) if ds_status == 'scored' and (ds_score or 0) >= K('drivesense_top_score') else (MX(0, after_loyalty - K('drivesense_middle_reduction')) if ds_status == 'scored' and (ds_score or 0) >= K('drivesense_middle_score') else after_loyalty)"
      - fault_rows: "COUNT('physdmg_claim_events', event_type='physdmg_fault_determination', claim_number=claim)"
      - fault: "LATEST('physdmg_claim_events', 'fault_determination', event_type='physdmg_fault_determination', claim_number=claim)"
      - fault_pct: "LATEST('physdmg_claim_events', 'insured_fault_pct', event_type='physdmg_fault_determination', claim_number=claim)"
      - other_party: "LATEST('physdmg_claim_events', 'other_party_insured', event_type='physdmg_fault_determination', claim_number=claim)"
      - waiver_share: "0 if fault_rows > 0 and P('collision_deductible_waiver') and is_collision and fault == 'other_party_at_fault' and fault_pct == 0 and other_party == 'uninsured' else (K('partial_waiver_share_pct') / 100 if fault_rows > 0 and P('collision_deductible_waiver') and is_collision and other_party == 'uninsured' and 0 < (fault_pct or 0) <= K('partial_waiver_max_fault_pct') else 1)"
      - result: "RND(after_drivesense * waiver_share, 2)"
    compute_basis:
      claim: "The accepted-claim deductible is the deductible recorded when the desk accepts a reported claim"
      loss_date: "When the loss date falls before the date physical damage took effect on the vehicle, the loss falls in the automatic period of a newly acquired vehicle and the option deductible is the newly_acquired_deductible instead."
      loss_cause: "The coverage part follows the cause of loss: a collision with another vehicle or object, a rollover and a hit-and-run collision are collision, and every other cause is comprehensive."
      glass_work: "on a comprehensive claim it is the glass_repair_deductible when the claim's estimate is glass repair, the glass_replacement_deductible when the estimate is glass replacement, and otherwise the comprehensive_deductible."
      is_collision: "The coverage part follows the cause of loss: a collision with another vehicle or object, a rollover and a hit-and-run collision are collision, and every other cause is comprehensive."
      option_deductible: "The option deductible is the collision_deductible of the deductible option on a collision claim; on a comprehensive claim it is the glass_repair_deductible when the claim's estimate is glass repair, the glass_replacement_deductible when the estimate is glass replacement, and otherwise the comprehensive_deductible. When the loss date falls before the date physical damage took effect on the vehicle, the loss falls in the automatic period of a newly acquired vehicle and the option deductible is the newly_acquired_deductible instead."
      package: "Package deductible cap: on a policy written on Cardinal Auto Premier the option deductible is capped at premier_deductible_cap, on a policy written on Cardinal Auto Preferred it is capped at preferred_deductible_cap, and on every other package the option deductible stands uncapped."
      package_cap: "Package deductible cap: on a policy written on Cardinal Auto Premier the option deductible is capped at premier_deductible_cap, on a policy written on Cardinal Auto Preferred it is capped at preferred_deductible_cap, and on every other package the option deductible stands uncapped."
      capped_deductible: "first the option deductible is capped, giving the capped deductible"
      tenure_months: "where the auto policy's inception date is at least loyalty_long_tenure_months whole months before the loss date"
      loyalty_reduction: "Loyalty reduction: where the auto policy's inception date is at least loyalty_long_tenure_months whole months before the loss date, loyalty_long_reduction is subtracted; where it is at least loyalty_mid_tenure_months but fewer than loyalty_long_tenure_months whole months before the loss date, loyalty_mid_reduction is subtracted; otherwise nothing is subtracted."
      after_loyalty: "the loyalty reduction is then subtracted from the capped deductible"
      ds_status: "where the vehicle's DriveSense enrollment is scored with a final score of drivesense_top_score or higher"
      ds_score: "where the vehicle's DriveSense enrollment is scored with a final score of drivesense_top_score or higher"
      after_drivesense: "DriveSense reduction: where the vehicle's DriveSense enrollment is scored with a final score of drivesense_top_score or higher, the deductible after the loyalty reduction is reduced by drivesense_top_reduction_pct percent of itself; where it is scored with a final score of at least drivesense_middle_score but below drivesense_top_score, the flat amount drivesense_middle_reduction is subtracted from it; where the vehicle has no scored DriveSense enrollment, or its final score is below drivesense_middle_score, it is not reduced."
      fault_rows: "when the latest fault determination finds the other party at fault with no share of fault on the Cardinal driver and the other party identified and uninsured, the deductible is waived entirely"
      fault: "when the latest fault determination finds the other party at fault with no share of fault on the Cardinal driver and the other party identified and uninsured, the deductible is waived entirely"
      fault_pct: "when the latest fault determination charges the Cardinal driver a share of fault above zero and no more than partial_waiver_max_fault_pct percent and the other party is identified and uninsured, the deductible is charged at partial_waiver_share_pct percent"
      other_party: "the other party identified and uninsured"
      waiver_share: "Uninsured-driver waiver: on a collision claim under an option whose collision_deductible_waiver is true, when the latest fault determination finds the other party at fault with no share of fault on the Cardinal driver and the other party identified and uninsured, the deductible is waived entirely; when the latest fault determination charges the Cardinal driver a share of fault above zero and no more than partial_waiver_max_fault_pct percent and the other party is identified and uninsured, the deductible is charged at partial_waiver_share_pct percent; in every other case, a hit-and-run with an unidentified driver included, the deductible is charged in full."
      result: "The figures combine in one fixed order: first the option deductible is capped, giving the capped deductible; the loyalty reduction is then subtracted from the capped deductible; the DriveSense reduction is then applied to that figure, never going below zero; the waiver share then multiplies that result, and the product is rounded to the cent only at the end."
    factors:
      - id: package_deductible_cap
        effect: parameter
        decides: package_cap
        bindings: [package, package_cap]
        ladder:
          - when: "the auto policy is written on Cardinal Auto Premier"
            value: "K('premier_deductible_cap')"
          - when: "the auto policy is written on Cardinal Auto Preferred"
            value: "K('preferred_deductible_cap')"
          - when: "otherwise (any other package)"
            value: "no cap: the option deductible stands"
        baseline:
          package_cap: "option_deductible"
        evidence: [cross_category]
        cross_difficulty: auto
      - id: loyalty_deductible_reduction
        effect: parameter
        decides: loyalty_reduction
        bindings: [tenure_months, loyalty_reduction]
        ladder:
          - when: "inception at least loyalty_long_tenure_months whole months before the loss date"
            value: "K('loyalty_long_reduction')"
          - when: "inception at least loyalty_mid_tenure_months but fewer than loyalty_long_tenure_months whole months before the loss date"
            value: "K('loyalty_mid_reduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          loyalty_reduction: "0"
        evidence: [cross_category, date]
        cross_difficulty: auto
      - id: drivesense_deductible_reduction
        effect: method
        decides: after_drivesense
        bindings: [ds_status, ds_score, after_drivesense]
        ladder:
          - when: "the vehicle's DriveSense enrollment is scored AND its final score is drivesense_top_score or higher"
            method: "percentage reduction: the deductible after the loyalty reduction is multiplied by (1 - drivesense_top_reduction_pct percent)"
          - when: "the vehicle's DriveSense enrollment is scored AND its final score is at least drivesense_middle_score but below drivesense_top_score"
            method: "flat reduction: drivesense_middle_reduction is subtracted from the deductible after the loyalty reduction, never below zero"
          - when: "otherwise (no scored enrollment, or a final score below drivesense_middle_score)"
            method: "no reduction: the deductible after the loyalty reduction stands"
        baseline:
          after_drivesense: "after_loyalty"
        evidence: [cross_category]
        cross_difficulty: telematics
      - id: uninsured_driver_waiver
        effect: parameter
        decides: waiver_share
        bindings: [fault_rows, fault, fault_pct, other_party, waiver_share]
        ladder:
          - when: "collision claim, option with collision_deductible_waiver true, latest fault determination other party at fault with no share on the Cardinal driver AND the other party identified and uninsured"
            value: "0 (deductible waived)"
          - when: "collision claim, option with collision_deductible_waiver true, Cardinal driver's share of fault above zero and no more than partial_waiver_max_fault_pct percent AND the other party identified and uninsured"
            value: "K('partial_waiver_share_pct') / 100"
          - when: "otherwise (including a hit-and-run with an unidentified driver)"
            value: "1 (deductible charged in full)"
        baseline:
          waiver_share: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The coverage part follows the cause of loss: a collision with another vehicle or object, a rollover and a
        hit-and-run collision are collision, and every other cause is comprehensive. The option deductible is the
        collision_deductible of the deductible option on a collision claim; on a comprehensive claim it is the
        glass_repair_deductible when the claim's estimate is glass repair, the glass_replacement_deductible when the
        estimate is glass replacement, and otherwise the comprehensive_deductible. When the loss date falls before
        the date physical damage took effect on the vehicle, the loss falls in the automatic period of a newly
        acquired vehicle and the option deductible is the newly_acquired_deductible instead. The accepted-claim
        deductible is the option deductible, rounded to the cent.
      params: [collision_deductible, comprehensive_deductible, glass_repair_deductible, glass_replacement_deductible, newly_acquired_deductible]
    inputs:
      history:
        - {table: physdmg_claim_events, aggregate: latest, field: claim_number, filters: {event_type: physdmg_claim_report}}
        - {table: physdmg_claim_events, aggregate: latest, field: insured_fault_pct, filters: {event_type: physdmg_fault_determination}}
        - {table: physdmg_claim_events, aggregate: count, field: claim_event_id, filters: {event_type: physdmg_fault_determination}}
      cross_category: [auto, telematics]

  - id: physdmg_ext_surrender_settlement
    base_policy_refs: [physdmg_total_loss, physdmg_evt_deductible]
    overwrite:
      - base_policy: physdmg_total_loss
        superseded_clause: >-
          The settlement is computed in this order: actual cash value, less unrepaired prior damage where
          prior_damage_deduction_applies, plus sales tax at the policy_state's rate in sales_tax_rate_by_state on
          that adjusted value, plus the state's title fee from title_fee_by_state, plus aftermarket custom equipment
          up to custom_equipment_limit, less the deductible (net of Deductible Rewards credit), less the
          salvage_value when the customer keeps the vehicle as owner-retained salvage (where
          owner_retained_salvage_allowed); each step is rounded to the cent.
        replaced_by: >-
          The surrender settlement is the adjusted value plus sales tax plus the title fee plus custom equipment,
          less the net deductible, each figure rounded to the cent before it is added.
      - base_policy: physdmg_total_loss
        superseded_clause: >-
          Where the auto package has new_car_replacement_included true and the vehicle was bought new, is no more
          than new_car_replacement_max_age_months months past its acquisition date and has no more than
          new_car_replacement_max_miles miles at the loss, replacement_cost_new replaces actual cash value in the
          first step and no prior damage is deducted.
        replaced_by: >-
          Replacement-cost value: where the auto package has new_car_replacement_included true, the vehicle was
          bought new from a dealer (its physical damage took effect without a photo inspection falling due), no more
          than new_car_replacement_max_age_months whole months have passed from the vehicle's addition to the auto
          policy to the loss date and the odometer at the loss is no more than new_car_replacement_max_miles, the
          vehicle value is the replacement cost new and no prior damage is deducted; where the package has
          new_car_replacement_included true and the vehicle was bought new and no more than
          nearly_new_max_age_months whole months have passed from its addition to the loss date, but the age or the
          odometer limit of full replacement is exceeded, the vehicle value is the higher of the actual cash value
          and nearly_new_floor_pct percent of the replacement cost new, rounded to the cent; for every other vehicle
          the vehicle value is the actual cash value.
      - base_policy: physdmg_evt_deductible
        superseded_clause: >-
          Step 4, Deductible Rewards: the credit balance reduces the remaining deductible, credit used = min(credit
          balance, deductible), and the credit used is debited from the balance when the payment that takes the
          deductible is issued.
        replaced_by: >-
          Deductible Rewards weighting: on a policy written on Cardinal Auto Premier where the vehicle has earned at
          least one claim-free-year credit, each dollar of credit balance counts premier_credit_multiplier dollars
          toward the deductible charge; on a policy written on Cardinal Auto Preferred where the vehicle has earned
          at least one claim-free-year credit, each dollar counts preferred_credit_multiplier dollars; otherwise each
          dollar counts one dollar.
    trigger: on_request
    subject: [physdmg_total_loss_declared]
    computes: settlement_amount
    target_tool: accept_total_loss_settlement_c07cd979
    params:
      nearly_new_max_age_months: 36
      nearly_new_floor_pct: 75
      prior_damage_minimum: 250
      premier_custom_uplift: 2000
      preferred_custom_uplift: 1000
      tl_waiver_tenure_months: 120
      tl_waiver_lookback_months: 36
      tl_waiver_partial_share_pct: 80
      premier_credit_multiplier: 1.25
      preferred_credit_multiplier: 1.1
      late_interest_low_days: 30
      late_interest_high_days: 60
      late_interest_low_pct: 0.75
      late_interest_high_pct: 1.5
      sales_tax_pct_oh: 5.75
      sales_tax_pct_in: 7.00
      sales_tax_pct_ky: 6.00
      sales_tax_pct_va: 4.15
      sales_tax_pct_wv: 6.00
      title_fee_oh: 15.00
      title_fee_in: 15.00
      title_fee_ky: 9.00
      title_fee_va: 15.00
      title_fee_wv: 15.00
    rule: >-
      The surrender settlement is the net settlement a customer accepts when a total-loss vehicle and its title go
      to Cardinal; a vehicle the customer keeps is settled under the kept-vehicle rules instead. The surrender
      settlement is fixed only after the claim carries an accepted coverage decision stating its deductible. The
      settlement figures are read from the claim's total-loss declaration: the actual cash value, the replacement
      cost new, the unrepaired prior damage noted, the documented custom equipment value and the odometer at the
      loss. The vehicle value is the actual cash value. The prior damage deduction is the unrepaired prior damage
      noted in the valuation. The adjusted value is the vehicle value less the prior damage deduction, rounded to
      the cent. Sales tax is the adjusted value times the policy state's percentage in sales_tax_rate_by_state,
      rounded to the cent, and the title fee is the policy state's fee in title_fee_by_state. Custom equipment is
      paid at its documented value up to the option's custom_equipment_limit. The decided deductible is the
      deductible stated on the claim's latest accepted coverage decision, and the deductible charge is the decided
      deductible. The credit applied is the vehicle's Deductible Rewards credit balance, up to the deductible
      charge, and the net deductible is the deductible charge less the credit applied. The surrender settlement is
      the adjusted value plus sales tax plus the title fee plus custom equipment, less the net deductible, each
      figure rounded to the cent before it is added.
      Replacement-cost value: where the auto package has new_car_replacement_included true, the vehicle was
      bought new from a dealer (its physical damage took effect without a photo inspection falling due), no more
      than new_car_replacement_max_age_months whole months have passed from the vehicle's addition to the auto
      policy to the loss date and the odometer at the loss is no more than new_car_replacement_max_miles, the
      vehicle value is the replacement cost new and no prior damage is deducted; where the package has
      new_car_replacement_included true and the vehicle was bought new and no more than
      nearly_new_max_age_months whole months have passed from its addition to the loss date, but the age or the
      odometer limit of full replacement is exceeded, the vehicle value is the higher of the actual cash value
      and nearly_new_floor_pct percent of the replacement cost new, rounded to the cent; for every other vehicle
      the vehicle value is the actual cash value.
      Prior damage already paid: where unrepaired prior damage is noted and the vehicle's coverage shows repair
      payments made to the insured on its claims, the prior damage deduction is the larger of the noted prior
      damage and the total of those repair payments; where the coverage shows no repair payment made to the
      insured and the noted prior damage is below prior_damage_minimum, no prior damage is deducted; otherwise
      the noted prior damage is deducted.
      Package custom equipment limit: on a policy written on Cardinal Auto Premier documented custom equipment is
      paid up to the option's custom_equipment_limit raised by premier_custom_uplift; on a policy written on
      Cardinal Auto Preferred up to the option's custom_equipment_limit raised by preferred_custom_uplift; on every
      other package up to the option's custom_equipment_limit.
      Total-loss deductible waiver: where the auto policy's inception date is at least tl_waiver_tenure_months
      whole months before the loss date and the vehicle's coverage shows no claim closed as paid within the last
      tl_waiver_lookback_months months, the deductible charge is nothing; where the inception date is at least
      tl_waiver_tenure_months whole months before the loss date and exactly one such claim shows, the deductible
      charge is tl_waiver_partial_share_pct percent of the decided deductible, rounded to the cent; otherwise the
      deductible charge is the decided deductible.
      Deductible Rewards weighting: on a policy written on Cardinal Auto Premier where the vehicle has earned at
      least one claim-free-year credit, each dollar of credit balance counts premier_credit_multiplier dollars
      toward the deductible charge; on a policy written on Cardinal Auto Preferred where the vehicle has earned
      at least one claim-free-year credit, each dollar counts preferred_credit_multiplier dollars; otherwise each
      dollar counts one dollar. The weighted balance is rounded to the cent and applied up to the deductible
      charge.
      Prompt-settlement allowance: when the settlement is accepted more than late_interest_high_days days after
      the loss was reported, late_interest_high_pct percent of the adjusted value, rounded to the cent, is added
      to the surrender settlement; when it is accepted more than late_interest_low_days but no more than
      late_interest_high_days days after the report, late_interest_low_pct percent of the adjusted value, rounded
      to the cent, is added; when it is accepted within late_interest_low_days days of the report, nothing is
      added. Days are counted from the report date to the acceptance date, the report date not counted.
    prerequisite:
      - problem: physdmg_ext_accident_deductible
        kind: value_input
        gate: decided_deductible
        form: state
        policy_source: >-
          The surrender settlement is fixed only after the claim carries an accepted coverage decision stating its
          deductible.
        condition: >-
          The claim's claim events include a coverage decision row with coverage_decision accepted and a
          deductible_amount, so the decided deductible read by the settlement is that recorded figure.
        resolved_by: record_claim_acceptance_ec9cfb06
        effect: >-
          The decided deductible binding takes the deductible recorded on the accepted coverage decision; without
          that decision there is no deductible to charge and the surrender settlement cannot be figured.
    cross_category:
      - category: auto
        as: history
        reads: [variant_name, policy_state, inception_date, new_car_replacement_included, auto_transactions.effective_date]
        note: The auto package, state, inception date and the vehicle's add transaction decide the replacement-cost value, custom equipment limit, total-loss deductible waiver, Deductible Rewards weighting, tax and title fee.
    compute:
      - claim: "LATEST('physdmg_claim_events', 'claim_number', event_type='physdmg_total_loss_declared')"
      - loss_date: "LATEST('physdmg_claim_events', 'loss_date', event_type='physdmg_claim_report', claim_number=claim)"
      - report_date: "LATEST('physdmg_claim_events', 'report_date', event_type='physdmg_claim_report', claim_number=claim)"
      - acv: "LATEST('physdmg_claim_events', 'acv_amount', event_type='physdmg_total_loss_declared', claim_number=claim)"
      - replacement_cost: "LATEST('physdmg_claim_events', 'replacement_cost_new', event_type='physdmg_total_loss_declared', claim_number=claim)"
      - prior_noted: "LATEST('physdmg_claim_events', 'prior_damage_amount', event_type='physdmg_total_loss_declared', claim_number=claim)"
      - custom_value: "LATEST('physdmg_claim_events', 'custom_equipment_value', event_type='physdmg_total_loss_declared', claim_number=claim)"
      - odometer: "LATEST('physdmg_claim_events', 'odometer_at_loss', event_type='physdmg_total_loss_declared', claim_number=claim)"
      - decided_deductible: "LATEST('physdmg_claim_events', 'deductible_amount', event_type='physdmg_coverage_decision', claim_number=claim, coverage_decision='accepted')"
      - policy_state: "CFIELD('auto', 'policy_state', policy_id=F('policy_id'))"
      - sales_tax_pct: "K('sales_tax_pct_oh') if policy_state == 'OH' else (K('sales_tax_pct_in') if policy_state == 'IN' else (K('sales_tax_pct_ky') if policy_state == 'KY' else (K('sales_tax_pct_va') if policy_state == 'VA' else K('sales_tax_pct_wv'))))"
      - title_fee: "K('title_fee_oh') if policy_state == 'OH' else (K('title_fee_in') if policy_state == 'IN' else (K('title_fee_ky') if policy_state == 'KY' else (K('title_fee_va') if policy_state == 'VA' else K('title_fee_wv'))))"
      - ncr_package: "CPARAM('auto', 'new_car_replacement_included', policy_id=F('policy_id'))"
      - bought_new: "not F('inspection_due_date')"
      - vehicle_added: "XLATEST('auto', 'auto_transactions', 'effective_date', event_type='auto_vehicle_add', vehicle_id=F('vehicle_id'))"
      - vehicle_age_months: "MONTHS(vehicle_added, loss_date)"
      - full_replacement: "ncr_package and bought_new and vehicle_age_months <= P('new_car_replacement_max_age_months') and odometer <= P('new_car_replacement_max_miles')"
      - vehicle_value: "replacement_cost if full_replacement else (MX(acv, RND(replacement_cost * K('nearly_new_floor_pct') / 100, 2)) if ncr_package and bought_new and vehicle_age_months <= K('nearly_new_max_age_months') else acv)"
      - insured_repairs: "SUM('physdmg_payments', 'amount', event_type='physdmg_claim_payment', payment_component='repair', payee_type='insured')"
      - prior_deduction: "0 if full_replacement else (MX(prior_noted, insured_repairs) if prior_noted > 0 and insured_repairs > 0 else (0 if insured_repairs == 0 and prior_noted < K('prior_damage_minimum') else prior_noted))"
      - adjusted_value: "RND(vehicle_value - prior_deduction, 2)"
      - sales_tax: "RND(adjusted_value * sales_tax_pct / 100, 2)"
      - package: "CFIELD('auto', 'variant_name', policy_id=F('policy_id'))"
      - custom_limit: "P('custom_equipment_limit') + K('premier_custom_uplift') if package == 'Cardinal Auto Premier' else (P('custom_equipment_limit') + K('preferred_custom_uplift') if package == 'Cardinal Auto Preferred' else P('custom_equipment_limit'))"
      - custom_paid: "MN(custom_limit, custom_value)"
      - tenure_months: "MONTHS(CFIELD('auto', 'inception_date', policy_id=F('policy_id')), loss_date)"
      - paid_claims: "COUNT('physdmg_claim_events', within_months=K('tl_waiver_lookback_months'), event_type='physdmg_claim_closed', close_reason='paid')"
      - deductible_share: "0 if tenure_months >= K('tl_waiver_tenure_months') and paid_claims == 0 else (K('tl_waiver_partial_share_pct') / 100 if tenure_months >= K('tl_waiver_tenure_months') and paid_claims == 1 else 1)"
      - deductible_charge: "RND(decided_deductible * deductible_share, 2)"
      - claim_free_credits: "COUNT('physdmg_payments', event_type='physdmg_deductible_credit_earned', credit_reason='claim_free_year')"
      - credit_weight: "K('premier_credit_multiplier') if package == 'Cardinal Auto Premier' and claim_free_credits >= 1 else (K('preferred_credit_multiplier') if package == 'Cardinal Auto Preferred' and claim_free_credits >= 1 else 1)"
      - credit_applied: "MN(RND(F('deductible_credit_balance') * credit_weight, 2), deductible_charge)"
      - net_deductible: "RND(deductible_charge - credit_applied, 2)"
      - days_to_acceptance: "DAYS(report_date, NOW)"
      - allowance_pct: "K('late_interest_high_pct') if days_to_acceptance > K('late_interest_high_days') else (K('late_interest_low_pct') if days_to_acceptance > K('late_interest_low_days') else 0)"
      - allowance: "RND(adjusted_value * allowance_pct / 100, 2)"
      - result: "RND(adjusted_value + sales_tax + title_fee + custom_paid + allowance - net_deductible, 2)"
    compute_basis:
      claim: "The settlement figures are read from the claim's total-loss declaration"
      loss_date: "no more than new_car_replacement_max_age_months whole months have passed from the vehicle's addition to the auto policy to the loss date"
      report_date: "Days are counted from the report date to the acceptance date, the report date not counted."
      acv: "The vehicle value is the actual cash value."
      replacement_cost: "the vehicle value is the replacement cost new and no prior damage is deducted"
      prior_noted: "The prior damage deduction is the unrepaired prior damage noted in the valuation."
      custom_value: "Custom equipment is paid at its documented value up to the option's custom_equipment_limit."
      odometer: "the odometer at the loss is no more than new_car_replacement_max_miles"
      decided_deductible: "The decided deductible is the deductible stated on the claim's latest accepted coverage decision, and the deductible charge is the decided deductible."
      policy_state: "Sales tax is the adjusted value times the policy state's percentage in sales_tax_rate_by_state, rounded to the cent, and the title fee is the policy state's fee in title_fee_by_state."
      sales_tax_pct: "Sales tax is the adjusted value times the policy state's percentage in sales_tax_rate_by_state, rounded to the cent"
      title_fee: "the title fee is the policy state's fee in title_fee_by_state."
      ncr_package: "where the auto package has new_car_replacement_included true"
      bought_new: "the vehicle was bought new from a dealer (its physical damage took effect without a photo inspection falling due)"
      vehicle_added: "no more than new_car_replacement_max_age_months whole months have passed from the vehicle's addition to the auto policy to the loss date"
      vehicle_age_months: "no more than new_car_replacement_max_age_months whole months have passed from the vehicle's addition to the auto policy to the loss date"
      full_replacement: "where the auto package has new_car_replacement_included true, the vehicle was bought new from a dealer (its physical damage took effect without a photo inspection falling due), no more than new_car_replacement_max_age_months whole months have passed from the vehicle's addition to the auto policy to the loss date and the odometer at the loss is no more than new_car_replacement_max_miles, the vehicle value is the replacement cost new and no prior damage is deducted"
      vehicle_value: "Replacement-cost value: where the auto package has new_car_replacement_included true, the vehicle was bought new from a dealer (its physical damage took effect without a photo inspection falling due), no more than new_car_replacement_max_age_months whole months have passed from the vehicle's addition to the auto policy to the loss date and the odometer at the loss is no more than new_car_replacement_max_miles, the vehicle value is the replacement cost new and no prior damage is deducted; where the package has new_car_replacement_included true and the vehicle was bought new and no more than nearly_new_max_age_months whole months have passed from its addition to the loss date, but the age or the odometer limit of full replacement is exceeded, the vehicle value is the higher of the actual cash value and nearly_new_floor_pct percent of the replacement cost new, rounded to the cent; for every other vehicle the vehicle value is the actual cash value."
      insured_repairs: "where unrepaired prior damage is noted and the vehicle's coverage shows repair payments made to the insured on its claims, the prior damage deduction is the larger of the noted prior damage and the total of those repair payments"
      prior_deduction: "Prior damage already paid: where unrepaired prior damage is noted and the vehicle's coverage shows repair payments made to the insured on its claims, the prior damage deduction is the larger of the noted prior damage and the total of those repair payments; where the coverage shows no repair payment made to the insured and the noted prior damage is below prior_damage_minimum, no prior damage is deducted; otherwise the noted prior damage is deducted."
      adjusted_value: "The adjusted value is the vehicle value less the prior damage deduction, rounded to the cent."
      sales_tax: "Sales tax is the adjusted value times the policy state's percentage in sales_tax_rate_by_state, rounded to the cent"
      package: "Package custom equipment limit: on a policy written on Cardinal Auto Premier documented custom equipment is paid up to the option's custom_equipment_limit raised by premier_custom_uplift"
      custom_limit: "Package custom equipment limit: on a policy written on Cardinal Auto Premier documented custom equipment is paid up to the option's custom_equipment_limit raised by premier_custom_uplift; on a policy written on Cardinal Auto Preferred up to the option's custom_equipment_limit raised by preferred_custom_uplift; on every other package up to the option's custom_equipment_limit."
      custom_paid: "Custom equipment is paid at its documented value up to the option's custom_equipment_limit."
      tenure_months: "where the auto policy's inception date is at least tl_waiver_tenure_months whole months before the loss date"
      paid_claims: "the vehicle's coverage shows no claim closed as paid within the last tl_waiver_lookback_months months"
      deductible_share: "Total-loss deductible waiver: where the auto policy's inception date is at least tl_waiver_tenure_months whole months before the loss date and the vehicle's coverage shows no claim closed as paid within the last tl_waiver_lookback_months months, the deductible charge is nothing; where the inception date is at least tl_waiver_tenure_months whole months before the loss date and exactly one such claim shows, the deductible charge is tl_waiver_partial_share_pct percent of the decided deductible, rounded to the cent; otherwise the deductible charge is the decided deductible."
      deductible_charge: "the deductible charge is tl_waiver_partial_share_pct percent of the decided deductible, rounded to the cent"
      claim_free_credits: "where the vehicle has earned at least one claim-free-year credit"
      credit_weight: "Deductible Rewards weighting: on a policy written on Cardinal Auto Premier where the vehicle has earned at least one claim-free-year credit, each dollar of credit balance counts premier_credit_multiplier dollars toward the deductible charge; on a policy written on Cardinal Auto Preferred where the vehicle has earned at least one claim-free-year credit, each dollar counts preferred_credit_multiplier dollars; otherwise each dollar counts one dollar."
      credit_applied: "The weighted balance is rounded to the cent and applied up to the deductible charge."
      net_deductible: "the net deductible is the deductible charge less the credit applied."
      days_to_acceptance: "Days are counted from the report date to the acceptance date, the report date not counted."
      allowance_pct: "Prompt-settlement allowance: when the settlement is accepted more than late_interest_high_days days after the loss was reported, late_interest_high_pct percent of the adjusted value, rounded to the cent, is added to the surrender settlement; when it is accepted more than late_interest_low_days but no more than late_interest_high_days days after the report, late_interest_low_pct percent of the adjusted value, rounded to the cent, is added; when it is accepted within late_interest_low_days days of the report, nothing is added."
      allowance: "late_interest_low_pct percent of the adjusted value, rounded to the cent, is added"
      result: "The surrender settlement is the adjusted value plus sales tax plus the title fee plus custom equipment, less the net deductible, each figure rounded to the cent before it is added."
    factors:
      - id: replacement_cost_value
        effect: method
        decides: vehicle_value
        bindings: [ncr_package, bought_new, vehicle_added, vehicle_age_months, full_replacement, vehicle_value]
        ladder:
          - when: "package with new car replacement AND bought new AND no more than new_car_replacement_max_age_months months from the vehicle's addition to the loss AND odometer no more than new_car_replacement_max_miles"
            method: "the vehicle value is the replacement cost new and no prior damage is deducted"
          - when: "package with new car replacement AND bought new AND no more than nearly_new_max_age_months months from the vehicle's addition to the loss, but over the full-replacement age or mileage limit"
            method: "the vehicle value is the higher of the actual cash value and nearly_new_floor_pct percent of the replacement cost new"
          - when: "otherwise"
            method: "the vehicle value is the actual cash value"
        baseline:
          full_replacement: "False"
          vehicle_value: "acv"
        evidence: [cross_category, history, date]
        cross_difficulty: auto
      - id: prior_damage_already_paid
        effect: parameter
        decides: prior_deduction
        bindings: [insured_repairs, prior_deduction]
        ladder:
          - when: "unrepaired prior damage noted AND repair payments made to the insured on the coverage's claims"
            value: "the larger of the noted prior damage and the total of those repair payments"
          - when: "no repair payment made to the insured AND noted prior damage below prior_damage_minimum"
            value: "0"
          - when: "otherwise"
            value: "the noted prior damage"
        baseline:
          prior_deduction: "0 if full_replacement else prior_noted"
        evidence: [history]
        cross_difficulty: null
      - id: package_custom_equipment_limit
        effect: parameter
        decides: custom_limit
        bindings: [package, custom_limit]
        ladder:
          - when: "the auto policy is written on Cardinal Auto Premier"
            value: "P('custom_equipment_limit') + K('premier_custom_uplift')"
          - when: "the auto policy is written on Cardinal Auto Preferred"
            value: "P('custom_equipment_limit') + K('preferred_custom_uplift')"
          - when: "otherwise"
            value: "P('custom_equipment_limit')"
        baseline:
          custom_limit: "P('custom_equipment_limit')"
        evidence: [cross_category]
        cross_difficulty: auto
      - id: total_loss_deductible_waiver
        effect: parameter
        decides: deductible_share
        bindings: [tenure_months, paid_claims, deductible_share]
        ladder:
          - when: "inception at least tl_waiver_tenure_months months before the loss AND no claim closed as paid within the last tl_waiver_lookback_months months"
            value: "0 (no deductible charge)"
          - when: "inception at least tl_waiver_tenure_months months before the loss AND exactly one claim closed as paid within the last tl_waiver_lookback_months months"
            value: "K('tl_waiver_partial_share_pct') / 100"
          - when: "otherwise"
            value: "1 (the decided deductible)"
        baseline:
          deductible_share: "1"
        evidence: [cross_category, history, date]
        cross_difficulty: auto
      - id: deductible_rewards_weighting
        effect: parameter
        decides: credit_weight
        bindings: [claim_free_credits, credit_weight]
        ladder:
          - when: "Cardinal Auto Premier AND at least one claim-free-year credit earned on the vehicle"
            value: "K('premier_credit_multiplier')"
          - when: "Cardinal Auto Preferred AND at least one claim-free-year credit earned on the vehicle"
            value: "K('preferred_credit_multiplier')"
          - when: "otherwise"
            value: "1"
        baseline:
          credit_weight: "1"
        evidence: [history]
        cross_difficulty: null
      - id: prompt_settlement_allowance
        effect: parameter
        decides: allowance_pct
        bindings: [days_to_acceptance, allowance_pct]
        ladder:
          - when: "accepted more than late_interest_high_days days after the report"
            value: "K('late_interest_high_pct')"
          - when: "accepted more than late_interest_low_days but no more than late_interest_high_days days after the report"
            value: "K('late_interest_low_pct')"
          - when: "otherwise (within late_interest_low_days days)"
            value: "0"
        baseline:
          allowance_pct: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The settlement figures are read from the claim's total-loss declaration: the actual cash value, the
        replacement cost new, the unrepaired prior damage noted, the documented custom equipment value and the
        odometer at the loss. The vehicle value is the actual cash value. The prior damage deduction is the
        unrepaired prior damage noted in the valuation. The adjusted value is the vehicle value less the prior
        damage deduction, rounded to the cent. Sales tax is the adjusted value times the policy state's percentage
        in sales_tax_rate_by_state, rounded to the cent, and the title fee is the policy state's fee in
        title_fee_by_state. Custom equipment is paid at its documented value up to the option's
        custom_equipment_limit. The decided deductible is the deductible stated on the claim's latest accepted
        coverage decision, and the deductible charge is the decided deductible. The credit applied is the
        vehicle's Deductible Rewards credit balance, up to the deductible charge, and the net deductible is the
        deductible charge less the credit applied. The surrender settlement is the adjusted value plus sales tax
        plus the title fee plus custom equipment, less the net deductible, each figure rounded to the cent before
        it is added.
      params: [sales_tax_rate_by_state, title_fee_by_state, custom_equipment_limit]
    inputs:
      history:
        - {table: physdmg_claim_events, aggregate: latest, field: acv_amount, filters: {event_type: physdmg_total_loss_declared}}
        - {table: physdmg_claim_events, aggregate: latest, field: deductible_amount, filters: {event_type: physdmg_coverage_decision, coverage_decision: accepted}}
        - {table: physdmg_payments, aggregate: sum, field: amount, filters: {event_type: physdmg_claim_payment, payment_component: repair, payee_type: insured}}
        - {table: physdmg_payments, aggregate: count, field: payment_id, filters: {event_type: physdmg_deductible_credit_earned, credit_reason: claim_free_year}}
        - {table: physdmg_claim_events, aggregate: count, field: claim_event_id, within_months: 36, filters: {event_type: physdmg_claim_closed, close_reason: paid}}
        - {category: auto, table: auto_transactions, aggregate: latest, field: effective_date, filters: {event_type: auto_vehicle_add}}
      cross_category: [auto]

  - id: physdmg_ext_loan_payoff_benefit
    base_policy_refs: [physdmg_agg_occurrence_deductible, physdmg_evt_deductible, physdmg_evt_repair_payment, physdmg_total_loss, physdmg_evt_recovery_and_reimbursement, physdmg_evt_transportation_expense]
    overwrite:
      - base_policy: physdmg_total_loss
        superseded_clause: >-
          When the payoff exceeds the settlement and the coverage carries the loan/lease payoff option, the
          difference is paid to the loss payee up to loan_lease_payoff_pct_of_acv of actual cash value; the
          deductible, past-due loan payments, late charges and lease excess-wear or excess-mileage charges are never
          part of that difference.
        replaced_by: >-
          The loan payoff benefit is the lower of the payoff shortfall and the benefit cap, rounded to the cent.
    trigger: on_request
    subject: [physdmg_claim_payment]
    computes: amount
    target_tool: pay_loan_lease_payoff_8a830e94
    params:
      payoff_grace_days: 10
      new_vehicle_rate_months: 24
      new_vehicle_rate_pct: 5.9
      seasoned_new_rate_pct: 6.9
      used_vehicle_rate_pct: 9.4
      preferred_deductible_excluded_pct: 50
      lien_release_fee_oh_in: 15
      lien_release_fee_ky_wv: 10
    rule: >-
      The loan payoff benefit is the payment the loan/lease payoff option makes to the loss payee of a vehicle
      surrendered as a total loss when the payoff its lender or lessor states exceeds the surrender settlement; a
      coverage without the loan/lease payoff option receives no benefit. The loan or lease payoff benefit is not
      paid until the claim carries a surrender settlement the customer has accepted. The stated payoff is the payoff recorded on the accepted surrender settlement, which never includes past-due loan payments, late charges or lease excess-wear or excess-mileage charges. The benefit covers the balance owed on the loss date, so the finance charge accrued since the loss is removed from the stated payoff: the finance charge is the stated payoff times the assumed contract rate times the days from the loss date to the acceptance date of the surrender settlement (the loss date not counted), divided by 365, rounded to the cent, and the measured payoff is the stated payoff less that finance charge. The assumed contract rate is used_vehicle_rate_pct percent a year. The excluded deductible is the deductible stated on
      the claim's latest accepted coverage decision. The payoff shortfall is the measured payoff less the accepted
      surrender settlement less the excluded deductible, rounded to the cent and never below zero. The benefit cap
      is loan_lease_payoff_pct_of_acv percent of the actual cash value on the claim's total-loss declaration,
      rounded to the cent. The loan payoff benefit is the lower of the payoff shortfall and the benefit cap,
      rounded to the cent.
      Finance-charge convention: where the loss payee named on the coverage is a leasing company (its name contains the word Leasing) and more than payoff_grace_days days have passed from the loss date to the acceptance date, the lease rent charge is removed by whole months instead of by days: the finance charge is the stated payoff times the assumed contract rate divided by twelve, times the whole months from the loss date to the acceptance date, rounded to the cent; where no more than payoff_grace_days days have passed, whatever the loss payee, no finance charge is removed and the stated payoff is used as stated; otherwise the finance charge is removed by days as the measured payoff states.
      Assumed contract rate for new vehicles: for a vehicle bought new from a dealer (its physical damage took effect without a photo inspection falling due) whose addition to the auto policy (the effective date of its vehicle-add transaction, or the date physical damage took effect on it when there is none) is no more than new_vehicle_rate_months whole months before the loss date, the assumed contract rate is new_vehicle_rate_pct percent a year; for a vehicle bought new that was added longer before the loss, seasoned_new_rate_pct percent; for any other vehicle it stays used_vehicle_rate_pct percent.
      Package deductible coverage: on a policy written on Cardinal Auto Premier no deductible is excluded from the
      payoff shortfall; on a policy written on Cardinal Auto Preferred preferred_deductible_excluded_pct percent of
      the decided deductible, rounded to the cent, is excluded; on every other package the full decided
      deductible is excluded.
      Lien-release charge: where a payoff shortfall exists, the loss payee's charge for releasing its lien on a paid-off total loss is added to the loan payoff benefit, outside the benefit cap: lien_release_fee_oh_in on a policy whose policy state is OH or IN, lien_release_fee_ky_wv on a policy whose policy state is KY or WV, and nothing in any other state; where there is no shortfall, no benefit and no charge is paid.
    prerequisite:
      - problem: physdmg_ext_surrender_settlement
        kind: value_input
        gate: accepted_settlement
        form: state
        policy_source: >-
          The loan or lease payoff benefit is not paid until the claim carries a surrender settlement the customer
          has accepted.
        condition: >-
          The claim has a physdmg_total_loss_settlements row with settlement_option surrender_to_cardinal and
          offer_status accepted, carrying the settlement amount and the loss payee's stated payoff.
        resolved_by: accept_total_loss_settlement_c07cd979
        effect: >-
          The accepted settlement, the stated payoff and the acceptance date bindings take the figures recorded on
          the accepted surrender settlement; without it there is no settlement to measure the payoff against.
    cross_category:
      - category: auto
        as: history
        reads: [variant_name, policy_state, auto_transactions.effective_date]
        note: The package decides the deductible coverage, the policy state the lien-release charge, and the vehicle's add transaction the assumed contract rate.
    compute:
      - claim: "LATEST('physdmg_claim_events', 'claim_number', event_type='physdmg_total_loss_declared')"
      - loss_date: "LATEST('physdmg_claim_events', 'loss_date', event_type='physdmg_claim_report', claim_number=claim)"
      - acv: "LATEST('physdmg_claim_events', 'acv_amount', event_type='physdmg_total_loss_declared', claim_number=claim)"
      - accepted_settlement: "SUM('physdmg_total_loss_settlements', 'settlement_amount', claim_number=claim, settlement_option='surrender_to_cardinal', offer_status='accepted')"
      - stated_payoff: "LATEST('physdmg_total_loss_settlements', 'loss_payee_payoff_amount', date_field='created_at', claim_number=claim, settlement_option='surrender_to_cardinal', offer_status='accepted')"
      - accepted_on: "LATEST('physdmg_total_loss_settlements', 'accepted_date', date_field='created_at', claim_number=claim, settlement_option='surrender_to_cardinal', offer_status='accepted')"
      - decided_deductible: "LATEST('physdmg_claim_events', 'deductible_amount', event_type='physdmg_coverage_decision', claim_number=claim, coverage_decision='accepted')"
      - days_since_loss: "DAYS(loss_date, accepted_on)"
      - months_since_loss: "MONTHS(loss_date, accepted_on)"
      - leasing_payee: "'Leasing' in (F('loss_payee_name') or '')"
      - bought_new: "not F('inspection_due_date')"
      - vehicle_added: "XLATEST('auto', 'auto_transactions', 'effective_date', event_type='auto_vehicle_add', vehicle_id=F('vehicle_id')) or F('effective_date')"
      - vehicle_age_months: "MONTHS(vehicle_added, loss_date)"
      - contract_rate: "K('new_vehicle_rate_pct') if bought_new and vehicle_age_months <= K('new_vehicle_rate_months') else (K('seasoned_new_rate_pct') if bought_new and vehicle_age_months > K('new_vehicle_rate_months') else K('used_vehicle_rate_pct'))"
      - finance_charge: "RND(stated_payoff * contract_rate / 100 / 12 * months_since_loss, 2) if leasing_payee and days_since_loss > K('payoff_grace_days') else (0 if days_since_loss <= K('payoff_grace_days') else RND(stated_payoff * contract_rate / 100 * days_since_loss / 365, 2))"
      - measured_payoff: "RND(stated_payoff - finance_charge, 2)"
      - package: "CFIELD('auto', 'variant_name', policy_id=F('policy_id'))"
      - excluded_deductible: "0 if package == 'Cardinal Auto Premier' else (RND(decided_deductible * K('preferred_deductible_excluded_pct') / 100, 2) if package == 'Cardinal Auto Preferred' else decided_deductible)"
      - shortfall: "MX(0, RND(measured_payoff - accepted_settlement - excluded_deductible, 2))"
      - benefit_cap: "RND(acv * P('loan_lease_payoff_pct_of_acv') / 100, 2)"
      - policy_state: "CFIELD('auto', 'policy_state', policy_id=F('policy_id'))"
      - lien_release_fee: "K('lien_release_fee_oh_in') if policy_state == 'OH' or policy_state == 'IN' else (K('lien_release_fee_ky_wv') if policy_state == 'KY' or policy_state == 'WV' else 0)"
      - result: "RND(MN(shortfall, benefit_cap) + (lien_release_fee if shortfall > 0 else 0), 2) if F('loan_lease_payoff') else 0"
    compute_basis:
      claim: "The loan payoff benefit is the payment the loan/lease payoff option makes to the loss payee of a vehicle surrendered as a total loss"
      loss_date: "where more than payoff_grace_days days have passed from the loss date to the date the surrender settlement was accepted"
      acv: "The benefit cap is loan_lease_payoff_pct_of_acv percent of the actual cash value on the claim's total-loss declaration, rounded to the cent."
      accepted_settlement: "The payoff shortfall is the measured payoff less the accepted surrender settlement less the excluded deductible, rounded to the cent and never below zero."
      stated_payoff: "The stated payoff is the payoff recorded on the accepted surrender settlement, which never includes past-due loan payments, late charges or lease excess-wear or excess-mileage charges. The benefit covers the balance owed on the loss date, so the finance charge accrued since the loss is removed from the stated payoff: the finance charge is the stated payoff times the assumed contract rate times the days from the loss date to the acceptance date of the surrender settlement (the loss date not counted), divided by 365, rounded to the cent, and the measured payoff is the stated payoff less that finance charge. The assumed contract rate is used_vehicle_rate_pct percent a year."
      accepted_on: "where more than payoff_grace_days days have passed from the loss date to the date the surrender settlement was accepted"
      decided_deductible: "The excluded deductible is the deductible stated on the claim's latest accepted coverage decision."
      days_since_loss: "the finance charge is the stated payoff times the assumed contract rate times the days from the loss date to the acceptance date of the surrender settlement (the loss date not counted), divided by 365, rounded to the cent"
      months_since_loss: "the finance charge is the stated payoff times the assumed contract rate divided by twelve, times the whole months from the loss date to the acceptance date, rounded to the cent"
      leasing_payee: "where the loss payee named on the coverage is a leasing company (its name contains the word Leasing)"
      bought_new: "for a vehicle bought new from a dealer (its physical damage took effect without a photo inspection falling due)"
      vehicle_added: "whose addition to the auto policy (the effective date of its vehicle-add transaction, or the date physical damage took effect on it when there is none)"
      vehicle_age_months: "is no more than new_vehicle_rate_months whole months before the loss date"
      contract_rate: "Assumed contract rate for new vehicles: for a vehicle bought new from a dealer (its physical damage took effect without a photo inspection falling due) whose addition to the auto policy (the effective date of its vehicle-add transaction, or the date physical damage took effect on it when there is none) is no more than new_vehicle_rate_months whole months before the loss date, the assumed contract rate is new_vehicle_rate_pct percent a year; for a vehicle bought new that was added longer before the loss, seasoned_new_rate_pct percent; for any other vehicle it stays used_vehicle_rate_pct percent."
      finance_charge: "Finance-charge convention: where the loss payee named on the coverage is a leasing company (its name contains the word Leasing) and more than payoff_grace_days days have passed from the loss date to the acceptance date, the lease rent charge is removed by whole months instead of by days: the finance charge is the stated payoff times the assumed contract rate divided by twelve, times the whole months from the loss date to the acceptance date, rounded to the cent; where no more than payoff_grace_days days have passed, whatever the loss payee, no finance charge is removed and the stated payoff is used as stated; otherwise the finance charge is removed by days as the measured payoff states."
      package: "Package deductible coverage: on a policy written on Cardinal Auto Premier no deductible is excluded from the payoff shortfall"
      excluded_deductible: "Package deductible coverage: on a policy written on Cardinal Auto Premier no deductible is excluded from the payoff shortfall; on a policy written on Cardinal Auto Preferred preferred_deductible_excluded_pct percent of the decided deductible, rounded to the cent, is excluded; on every other package the full decided deductible is excluded."
      shortfall: "The payoff shortfall is the measured payoff less the accepted surrender settlement less the excluded deductible, rounded to the cent and never below zero."
      benefit_cap: "The benefit cap is loan_lease_payoff_pct_of_acv percent of the actual cash value on the claim's total-loss declaration, rounded to the cent."
      policy_state: "lien_release_fee_oh_in on a policy whose policy state is OH or IN"
      lien_release_fee: "Lien-release charge: where a payoff shortfall exists, the loss payee's charge for releasing its lien on a paid-off total loss is added to the loan payoff benefit, outside the benefit cap: lien_release_fee_oh_in on a policy whose policy state is OH or IN, lien_release_fee_ky_wv on a policy whose policy state is KY or WV, and nothing in any other state; where there is no shortfall, no benefit and no charge is paid."
      measured_payoff: "the measured payoff is the stated payoff less that finance charge."
      result: "The loan payoff benefit is the lower of the payoff shortfall and the benefit cap, rounded to the cent."
    factors:
      - id: payoff_to_loss_date
        effect: method
        decides: finance_charge
        bindings: [days_since_loss, months_since_loss, leasing_payee, finance_charge]
        ladder:
          - when: "the loss payee is a leasing company AND more than payoff_grace_days days from the loss to the acceptance"
            method: "monthly rent-charge convention: stated payoff x rate / 12 x whole months is removed"
          - when: "no more than payoff_grace_days days from the loss to the acceptance (any loss payee)"
            method: "no finance charge is removed; the stated payoff is used as stated"
          - when: "otherwise (a lender, more than payoff_grace_days days)"
            method: "daily actual/365 convention: stated payoff x rate x days / 365 is removed"
        baseline:
          finance_charge: "RND(stated_payoff * contract_rate / 100 * days_since_loss / 365, 2)"
        evidence: [date, history]
        cross_difficulty: null
      - id: assumed_contract_rate
        effect: parameter
        decides: contract_rate
        bindings: [bought_new, vehicle_added, vehicle_age_months, contract_rate]
        ladder:
          - when: "bought new AND added to the auto policy no more than new_vehicle_rate_months whole months before the loss"
            value: "K('new_vehicle_rate_pct')"
          - when: "bought new AND added more than new_vehicle_rate_months whole months before the loss"
            value: "K('seasoned_new_rate_pct')"
          - when: "otherwise (bought used)"
            value: "K('used_vehicle_rate_pct') (the rate the measured payoff states)"
        baseline:
          contract_rate: "K('used_vehicle_rate_pct')"
        evidence: [cross_category, history, date]
        cross_difficulty: auto
      - id: package_deductible_coverage
        effect: parameter
        decides: excluded_deductible
        bindings: [package, excluded_deductible]
        ladder:
          - when: "the auto policy is written on Cardinal Auto Premier"
            value: "0 (no deductible excluded)"
          - when: "the auto policy is written on Cardinal Auto Preferred"
            value: "preferred_deductible_excluded_pct percent of the decided deductible"
          - when: "otherwise"
            value: "the decided deductible"
        baseline:
          excluded_deductible: "decided_deductible"
        evidence: [cross_category]
        cross_difficulty: auto
      - id: lien_release_charge
        effect: parameter
        decides: lien_release_fee
        bindings: [policy_state, lien_release_fee]
        ladder:
          - when: "policy state OH or IN"
            value: "K('lien_release_fee_oh_in')"
          - when: "policy state KY or WV"
            value: "K('lien_release_fee_ky_wv')"
          - when: "otherwise"
            value: "0"
        baseline:
          lien_release_fee: "0"
        evidence: [cross_category]
        cross_difficulty: auto
    baseline:
      rule: >-
        The stated payoff is the payoff recorded on the accepted surrender settlement, which never includes past-due loan payments, late charges or lease excess-wear or excess-mileage charges. The benefit covers the balance owed on the loss date, so the finance charge accrued since the loss is removed from the stated payoff: the finance charge is the stated payoff times the assumed contract rate times the days from the loss date to the acceptance date of the surrender settlement (the loss date not counted), divided by 365, rounded to the cent, and the measured payoff is the stated payoff less that finance charge. The assumed contract rate is used_vehicle_rate_pct percent a year. The excluded deductible
        is the deductible stated on the claim's latest accepted coverage decision. The payoff shortfall is the
        measured payoff less the accepted surrender settlement less the excluded deductible, rounded to the cent and
        never below zero. The benefit cap is loan_lease_payoff_pct_of_acv percent of the actual cash value on the
        claim's total-loss declaration, rounded to the cent. The loan payoff benefit is the lower of the payoff
        shortfall and the benefit cap, rounded to the cent.
      params: [loan_lease_payoff_pct_of_acv, used_vehicle_rate_pct]
    inputs:
      history:
        - {table: physdmg_total_loss_settlements, aggregate: sum, field: settlement_amount, filters: {settlement_option: surrender_to_cardinal, offer_status: accepted}}
        - {table: physdmg_claim_events, aggregate: latest, field: deductible_amount, filters: {event_type: physdmg_coverage_decision, coverage_decision: accepted}}
        - {category: auto, table: auto_transactions, aggregate: latest, field: effective_date, filters: {event_type: auto_vehicle_add}}
      cross_category: [auto]

  - id: physdmg_ext_claim_free_credit
    base_policy_refs: [physdmg_deductible_rewards]
    overwrite:
      - base_policy: physdmg_deductible_rewards
        superseded_clause: >-
          For each 12 consecutive months without a paid collision or comprehensive claim on the vehicle
          (physdmg_msr_claim_free_months), deductible_rewards_annual_credit is granted, and the balance never exceeds
          deductible_rewards_max_credit; a grant that would exceed it is reduced to the cap.
        replaced_by: >-
          The claim-free credit is granted when at least claim_free_months whole months have passed from the period
          anchor to the grant date; it is the annual credit plus every bonus, reduced to the room left under the
          credit cap (the cap less the balance, never below zero), rounded to the cent; when fewer months have
          passed, no credit is granted.
      - base_policy: physdmg_deductible_rewards
        superseded_clause: >-
          A 12-month period earns credit once; a credit is granted only for a completed claim-free period that has
          not already earned a credit. Using credit on a claim starts a new 12-month period from that claim's payment
          date.
        replaced_by: >-
          Each claim-free year earns one credit: the year credited runs from the period anchor and ends claim_free_months
          months later, on the same day of the month, and a year whose end date has already been credited is never
          credited again.
    trigger: state_due
    subject: [physdmg_deductible_credit_earned]
    computes: amount
    target_tool: grant_claim_free_credit_c23d8d33
    params:
      claim_free_months: 12
      second_year_credit: 125
      third_year_credit: 150
      preferred_cap_uplift: 250
      ds_bonus_top_score: 90
      ds_bonus_middle_score: 75
      ds_top_bonus: 50
      ds_middle_bonus: 25
      bonus_long_tenure_months: 120
      bonus_mid_tenure_months: 60
      long_tenure_bonus: 25
      mid_tenure_bonus: 10
      returned_payment_lookback_months: 12
      autopay_bonus: 25
      clean_payment_bonus: 10
    rule: >-
      The claim-free credit is the Deductible Rewards credit a vehicle enrolled in Deductible Rewards earns for a
      completed claim-free year. Each claim-free year earns one credit: the year credited runs from the period
      anchor and ends claim_free_months months later, on the same day of the month, and a year whose end date has
      already been credited is never credited again. The period anchor is the end date of the latest credit
      entry on the coverage, or the payment date of the latest claim payment on the coverage when that is later.
      The annual credit is the option's deductible_rewards_annual_credit, and the credit cap is the option's
      deductible_rewards_max_credit. The claim-free credit is granted when at least claim_free_months whole months
      have passed from the period anchor to the grant date; it is the annual credit plus every bonus, reduced to
      the room left under the credit cap (the cap less the balance, never below zero), rounded to the cent; when
      fewer months have passed, no credit is granted. Credit is never paid in cash.
      Claims that do not restart the year: where the latest paid claim on the coverage was a glass repair from which
      no deductible was taken, or was recovered in full by subrogation with no share of fault on the Cardinal driver,
      the period anchor stays the end date of the latest credit entry; where the latest paid claim after that
      date was any other comprehensive claim, the period anchor is the later of that end date and the claim's loss
      date; where it was any other claim, the period anchor is the later of that end date and the claim's payment
      date.
      Loyalty escalator: where the coverage already holds two or more claim-free-year credit entries, the annual
      credit is third_year_credit; where it holds exactly one, the annual credit is second_year_credit; where it
      holds none, the annual credit is the option's deductible_rewards_annual_credit.
      Package credit cap: on a policy written on Cardinal Auto Premier the credit cap is the option's
      collision_deductible; on a policy written on Cardinal Auto Preferred it is the option's deductible_rewards_max_credit raised by preferred_cap_uplift; on every other package it is the option's
      deductible_rewards_max_credit.
      DriveSense credit bonus: where the vehicle's DriveSense enrollment is scored with a final score of
      ds_bonus_top_score or higher, ds_top_bonus is added; where it is scored with a final score of at least
      ds_bonus_middle_score but below ds_bonus_top_score, ds_middle_bonus is added; otherwise nothing is added.
      Tenure credit bonus: where the auto policy's inception date is at least bonus_long_tenure_months whole months
      before the grant date, long_tenure_bonus is added; where it is at least bonus_mid_tenure_months but fewer than
      bonus_long_tenure_months whole months before, mid_tenure_bonus is added; otherwise nothing is added.
      Payment-record bonus: where the policy's billing account is enrolled in autopay and shows no returned payment
      posted within the last returned_payment_lookback_months months, autopay_bonus is added; where the billing
      account is not enrolled in autopay and shows no such returned payment, clean_payment_bonus is added;
      otherwise nothing is added.
    prerequisite: []
    cross_category:
      - category: auto
        as: branch
        reads: [variant_name, inception_date]
        note: The package decides the credit cap and the inception date the tenure credit bonus.
      - category: telematics
        as: branch
        reads: [status, final_score]
        note: The vehicle's scored DriveSense enrollment decides the DriveSense credit bonus.
      - category: billing
        as: history
        reads: [autopay_enrolled, billing_ledger.event_type]
        note: Autopay enrollment and returned payments on the billing ledger decide the payment-record bonus.
    compute:
      - last_credit_end: "LATEST('physdmg_payments', 'credit_period_end', date_field='credit_period_end', event_type='physdmg_deductible_credit_earned')"
      - last_paid_claim: "LATEST('physdmg_payments', 'claim_number', date_field='payment_date', event_type='physdmg_claim_payment')"
      - last_paid_on: "LATEST('physdmg_payments', 'payment_date', date_field='payment_date', event_type='physdmg_claim_payment')"
      - glass_repairs: "COUNT('physdmg_claim_events', event_type='physdmg_estimate_written', claim_number=last_paid_claim, glass_work='glass_repair')"
      - deductible_taken: "SUM('physdmg_payments', 'deductible_applied', event_type='physdmg_claim_payment', claim_number=last_paid_claim)"
      - paid_on_claim: "SUM('physdmg_payments', 'amount', event_type='physdmg_claim_payment', claim_number=last_paid_claim)"
      - subrogated: "SUM('physdmg_payments', 'amount', event_type='physdmg_recovery_received', claim_number=last_paid_claim, recovery_source='subrogation')"
      - claim_fault_pct: "LATEST('physdmg_claim_events', 'insured_fault_pct', event_type='physdmg_fault_determination', claim_number=last_paid_claim)"
      - claim_part: "LATEST('physdmg_claim_events', 'coverage_part', event_type='physdmg_coverage_decision', claim_number=last_paid_claim)"
      - claim_loss_date: "LATEST('physdmg_claim_events', 'loss_date', event_type='physdmg_claim_report', claim_number=last_paid_claim)"
      - period_anchor: "last_credit_end if not last_paid_on or last_paid_on <= last_credit_end else (last_credit_end if (glass_repairs > 0 and deductible_taken == 0) or (subrogated >= paid_on_claim and claim_fault_pct == 0) else (MX(last_credit_end, claim_loss_date) if claim_part == 'comprehensive' and claim_loss_date else MX(last_credit_end, last_paid_on)))"
      - months_free: "MONTHS(period_anchor, NOW)"
      - earlier_credits: "COUNT('physdmg_payments', event_type='physdmg_deductible_credit_earned', credit_reason='claim_free_year')"
      - annual_credit: "K('third_year_credit') if earlier_credits >= 2 else (K('second_year_credit') if earlier_credits == 1 else P('deductible_rewards_annual_credit'))"
      - package: "CFIELD('auto', 'variant_name', policy_id=F('policy_id'))"
      - credit_cap: "P('collision_deductible') if package == 'Cardinal Auto Premier' else (P('deductible_rewards_max_credit') + K('preferred_cap_uplift') if package == 'Cardinal Auto Preferred' else P('deductible_rewards_max_credit'))"
      - ds_status: "CFIELD('telematics', 'status', vehicle_id=F('vehicle_id'))"
      - ds_score: "CFIELD('telematics', 'final_score', vehicle_id=F('vehicle_id'))"
      - drivesense_bonus: "K('ds_top_bonus') if ds_status == 'scored' and (ds_score or 0) >= K('ds_bonus_top_score') else (K('ds_middle_bonus') if ds_status == 'scored' and (ds_score or 0) >= K('ds_bonus_middle_score') else 0)"
      - tenure_months: "MONTHS(CFIELD('auto', 'inception_date', policy_id=F('policy_id')), NOW)"
      - tenure_bonus: "K('long_tenure_bonus') if tenure_months >= K('bonus_long_tenure_months') else (K('mid_tenure_bonus') if tenure_months >= K('bonus_mid_tenure_months') else 0)"
      - autopay: "CFIELD('billing', 'autopay_enrolled', policy_id=F('policy_id'))"
      - returned_payments: "XCOUNT('billing', 'billing_ledger', within_months=K('returned_payment_lookback_months'), date_field='posted_date', event_type='billing_payment_returned')"
      - payment_bonus: "K('autopay_bonus') if autopay == True and returned_payments == 0 else (K('clean_payment_bonus') if autopay == False and returned_payments == 0 else 0)"
      - headroom: "MX(0, credit_cap - F('deductible_credit_balance'))"
      - result: "RND(MN(annual_credit + drivesense_bonus + tenure_bonus + payment_bonus, headroom), 2) if months_free >= K('claim_free_months') else 0"
    compute_basis:
      last_credit_end: "The period anchor is the end date of the latest credit entry on the coverage, or the payment date of the latest claim payment on the coverage when that is later."
      last_paid_claim: "where the latest paid claim on the coverage was a glass repair from which no deductible was taken"
      last_paid_on: "The period anchor is the end date of the latest credit entry on the coverage, or the payment date of the latest claim payment on the coverage when that is later."
      glass_repairs: "where the latest paid claim on the coverage was a glass repair from which no deductible was taken"
      deductible_taken: "where the latest paid claim on the coverage was a glass repair from which no deductible was taken"
      paid_on_claim: "or was recovered in full by subrogation with no share of fault on the Cardinal driver"
      subrogated: "or was recovered in full by subrogation with no share of fault on the Cardinal driver"
      claim_fault_pct: "or was recovered in full by subrogation with no share of fault on the Cardinal driver"
      claim_part: "where the latest paid claim after that date was any other comprehensive claim, the period anchor is the later of that end date and the claim's loss date"
      claim_loss_date: "where the latest paid claim after that date was any other comprehensive claim, the period anchor is the later of that end date and the claim's loss date"
      period_anchor: "Claims that do not restart the year: where the latest paid claim on the coverage was a glass repair from which no deductible was taken, or was recovered in full by subrogation with no share of fault on the Cardinal driver, the period anchor stays the end date of the latest credit entry; where the latest paid claim after that date was any other comprehensive claim, the period anchor is the later of that end date and the claim's loss date; where it was any other claim, the period anchor is the later of that end date and the claim's payment date."
      months_free: "The claim-free credit is granted when at least claim_free_months whole months have passed from the period anchor to the grant date"
      earlier_credits: "where the coverage already holds two or more claim-free-year credit entries, the annual credit is third_year_credit"
      annual_credit: "Loyalty escalator: where the coverage already holds two or more claim-free-year credit entries, the annual credit is third_year_credit; where it holds exactly one, the annual credit is second_year_credit; where it holds none, the annual credit is the option's deductible_rewards_annual_credit."
      package: "Package credit cap: on a policy written on Cardinal Auto Premier the credit cap is the option's collision_deductible"
      credit_cap: "Package credit cap: on a policy written on Cardinal Auto Premier the credit cap is the option's collision_deductible; on a policy written on Cardinal Auto Preferred it is the option's deductible_rewards_max_credit raised by preferred_cap_uplift; on every other package it is the option's deductible_rewards_max_credit."
      ds_status: "where the vehicle's DriveSense enrollment is scored with a final score of ds_bonus_top_score or higher, ds_top_bonus is added"
      ds_score: "where the vehicle's DriveSense enrollment is scored with a final score of ds_bonus_top_score or higher, ds_top_bonus is added"
      drivesense_bonus: "DriveSense credit bonus: where the vehicle's DriveSense enrollment is scored with a final score of ds_bonus_top_score or higher, ds_top_bonus is added; where it is scored with a final score of at least ds_bonus_middle_score but below ds_bonus_top_score, ds_middle_bonus is added; otherwise nothing is added."
      tenure_months: "where the auto policy's inception date is at least bonus_long_tenure_months whole months before the grant date"
      tenure_bonus: "Tenure credit bonus: where the auto policy's inception date is at least bonus_long_tenure_months whole months before the grant date, long_tenure_bonus is added; where it is at least bonus_mid_tenure_months but fewer than bonus_long_tenure_months whole months before, mid_tenure_bonus is added; otherwise nothing is added."
      autopay: "where the policy's billing account is enrolled in autopay and shows no returned payment posted within the last returned_payment_lookback_months months, autopay_bonus is added"
      returned_payments: "shows no returned payment posted within the last returned_payment_lookback_months months"
      payment_bonus: "Payment-record bonus: where the policy's billing account is enrolled in autopay and shows no returned payment posted within the last returned_payment_lookback_months months, autopay_bonus is added; where the billing account is not enrolled in autopay and shows no such returned payment, clean_payment_bonus is added; otherwise nothing is added."
      headroom: "reduced to the room left under the credit cap (the cap less the balance, never below zero)"
      result: "The claim-free credit is granted when at least claim_free_months whole months have passed from the period anchor to the grant date; it is the annual credit plus every bonus, reduced to the room left under the credit cap (the cap less the balance, never below zero), rounded to the cent; when fewer months have passed, no credit is granted."
    factors:
      - id: non_restarting_claims
        effect: method
        decides: period_anchor
        bindings: [last_paid_claim, glass_repairs, deductible_taken, paid_on_claim, subrogated, claim_fault_pct, claim_part, claim_loss_date, period_anchor]
        ladder:
          - when: "the latest paid claim was a glass repair with no deductible taken, OR was recovered in full by subrogation with no share of fault on the Cardinal driver"
            method: "the year is not restarted: the anchor stays the end date of the latest credit entry"
          - when: "the latest paid claim after the latest credit's end date was any other comprehensive claim"
            method: "the year restarts from the claim's loss date (the later of it and the latest credit's end date)"
          - when: "otherwise"
            method: "the year restarts from the claim's payment date (the later of it and the latest credit's end date)"
        baseline:
          period_anchor: "MX(last_credit_end, last_paid_on or last_credit_end)"
        evidence: [history, date]
        cross_difficulty: null
      - id: loyalty_escalator
        effect: parameter
        decides: annual_credit
        bindings: [earlier_credits, annual_credit]
        ladder:
          - when: "two or more claim-free-year credit entries already on the coverage"
            value: "K('third_year_credit')"
          - when: "exactly one claim-free-year credit entry already on the coverage"
            value: "K('second_year_credit')"
          - when: "otherwise (none)"
            value: "P('deductible_rewards_annual_credit')"
        baseline:
          annual_credit: "P('deductible_rewards_annual_credit')"
        evidence: [history]
        cross_difficulty: null
      - id: package_credit_cap
        effect: parameter
        decides: credit_cap
        bindings: [package, credit_cap]
        ladder:
          - when: "the auto policy is written on Cardinal Auto Premier"
            value: "P('collision_deductible')"
          - when: "the auto policy is written on Cardinal Auto Preferred"
            value: "P('deductible_rewards_max_credit') + K('preferred_cap_uplift')"
          - when: "otherwise"
            value: "P('deductible_rewards_max_credit')"
        baseline:
          credit_cap: "P('deductible_rewards_max_credit')"
        evidence: [cross_category]
        cross_difficulty: auto
      - id: drivesense_credit_bonus
        effect: parameter
        decides: drivesense_bonus
        bindings: [ds_status, ds_score, drivesense_bonus]
        ladder:
          - when: "DriveSense enrollment scored AND final score ds_bonus_top_score or higher"
            value: "K('ds_top_bonus')"
          - when: "DriveSense enrollment scored AND final score at least ds_bonus_middle_score but below ds_bonus_top_score"
            value: "K('ds_middle_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          drivesense_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: telematics
      - id: tenure_credit_bonus
        effect: parameter
        decides: tenure_bonus
        bindings: [tenure_months, tenure_bonus]
        ladder:
          - when: "inception at least bonus_long_tenure_months whole months before the grant"
            value: "K('long_tenure_bonus')"
          - when: "inception at least bonus_mid_tenure_months but fewer than bonus_long_tenure_months whole months before the grant"
            value: "K('mid_tenure_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_bonus: "0"
        evidence: [cross_category, date]
        cross_difficulty: auto
      - id: payment_record_bonus
        effect: parameter
        decides: payment_bonus
        bindings: [autopay, returned_payments, payment_bonus]
        ladder:
          - when: "billing account on autopay AND no returned payment posted within the last returned_payment_lookback_months months"
            value: "K('autopay_bonus')"
          - when: "billing account not on autopay AND no returned payment posted within the last returned_payment_lookback_months months"
            value: "K('clean_payment_bonus')"
          - when: "otherwise (a returned payment in that window, or no billing account)"
            value: "0"
        baseline:
          payment_bonus: "0"
        evidence: [cross_category, history]
        cross_difficulty: billing
    baseline:
      rule: >-
        The period anchor is the end date of the latest credit entry on the coverage, or the payment date of the
        latest claim payment on the coverage when that is later. The annual credit is the option's
        deductible_rewards_annual_credit, and the credit cap is the option's deductible_rewards_max_credit. The
        claim-free credit is granted when at least claim_free_months whole months have passed from the period anchor
        to the grant date; it is the annual credit plus every bonus, reduced to the room left under the credit cap
        (the cap less the balance, never below zero), rounded to the cent; when fewer months have passed, no credit is
        granted.
      params: [deductible_rewards_annual_credit, deductible_rewards_max_credit, claim_free_months]
    inputs:
      history:
        - {table: physdmg_payments, aggregate: latest, field: credit_period_end, filters: {event_type: physdmg_deductible_credit_earned}}
        - {table: physdmg_payments, aggregate: latest, field: payment_date, filters: {event_type: physdmg_claim_payment}}
        - {table: physdmg_payments, aggregate: count, field: payment_id, filters: {event_type: physdmg_deductible_credit_earned, credit_reason: claim_free_year}}
        - {table: physdmg_claim_events, aggregate: count, field: claim_event_id, filters: {event_type: physdmg_estimate_written, glass_work: glass_repair}}
        - {category: billing, table: billing_ledger, aggregate: count, field: entry_id, within_months: 12, filters: {event_type: billing_payment_returned}}
      cross_category: [auto, telematics, billing]

  - id: physdmg_ext_kept_vehicle_settlement
    base_policy_refs: [physdmg_total_loss]
    overwrite:
      - base_policy: physdmg_total_loss
        superseded_clause: >-
          The settlement is computed in this order: actual cash value, less unrepaired prior damage where
          prior_damage_deduction_applies, plus sales tax at the policy_state's rate in sales_tax_rate_by_state on
          that adjusted value, plus the state's title fee from title_fee_by_state, plus aftermarket custom equipment
          up to custom_equipment_limit, less the deductible (net of Deductible Rewards credit), less the
          salvage_value when the customer keeps the vehicle as owner-retained salvage (where
          owner_retained_salvage_allowed); each step is rounded to the cent.
        replaced_by: >-
          The kept-vehicle settlement is the kept value plus the kept-vehicle sales tax plus the title fee plus the retained-equipment payment, less the kept net deductible and less the salvage
          deduction, each figure rounded to the cent before it is added.
      - base_policy: physdmg_total_loss
        superseded_clause: >-
          Where the auto package has new_car_replacement_included true and the vehicle was bought new, is no more
          than new_car_replacement_max_age_months months past its acquisition date and has no more than
          new_car_replacement_max_miles miles at the loss, replacement_cost_new replaces actual cash value in the
          first step and no prior damage is deducted.
        replaced_by: >-
          A vehicle the customer keeps is valued at its actual cash value in every case: new car replacement pays
          for a new vehicle in exchange for the damaged one and so applies only to a vehicle surrendered to
          Cardinal.
    trigger: on_request
    subject: [physdmg_total_loss_declared]
    computes: settlement_amount
    target_tool: keep_total_loss_vehicle_b04c3b51
    params:
      salvage_bid_valid_days: 30
      salvage_lapsed_pct: 30
      salvage_floor_pct: 25
      cosmetic_ratio_pct: 80
      drivable_equipment_pct: 50
      kept_long_tenure_months: 120
      kept_mid_tenure_months: 60
      kept_long_salvage_discount_pct: 20
      kept_mid_salvage_discount_pct: 10
      retitle_allowance_oh_in: 75
      retitle_allowance_ky_wv: 40
      kept_tax_pct_oh: 5.75
      kept_tax_pct_in: 7.00
      kept_tax_pct_ky: 6.00
      kept_tax_pct_va: 4.15
      kept_tax_pct_wv: 6.00
      kept_title_fee_oh: 15.00
      kept_title_fee_in: 15.00
      kept_title_fee_ky: 9.00
      kept_title_fee_va: 15.00
      kept_title_fee_wv: 15.00
      replacement_window_days: 30
    rule: >-
      The kept-vehicle settlement is the net settlement a customer accepts when they keep a total-loss vehicle as
      owner-retained salvage, where owner_retained_salvage_allowed is true; a vehicle surrendered to Cardinal is
      settled under the surrender rules instead. The kept-vehicle settlement is not worked out until the vehicle's
      Deductible Rewards balance carries a credit for every completed claim-free year. Its figures are read from
      the claim's total-loss declaration (actual cash value, unrepaired prior damage, highest salvage bid,
      documented custom equipment, estimate total and declaration date) and from the claim's loss report (loss date
      and whether the vehicle could be driven). A vehicle the customer keeps is valued at its actual cash value in every case: new car replacement pays for a new vehicle in exchange for the damaged one and so applies only to a vehicle surrendered to Cardinal. The kept value is the actual cash value less the unrepaired prior damage noted, rounded to the cent. The kept-vehicle sales tax is the kept value less the salvage deduction, times the policy state's percentage in sales_tax_rate_by_state, rounded to the cent, and the title fee is the policy state's fee in
      title_fee_by_state. The retained-equipment payment is the documented custom equipment up to the option's
      custom_equipment_limit. The salvage deduction is the highest salvage bid on the declaration. The kept net
      deductible is the deductible stated on the claim's latest accepted coverage decision less the vehicle's
      Deductible Rewards credit balance applied up to that deductible. The kept-vehicle settlement is the kept value
      plus the kept-vehicle sales tax plus the title fee plus the retained-equipment payment, less the kept net deductible and less the salvage deduction, each figure rounded to the cent before
      it is added.
      Salvage value basis: where more than salvage_bid_valid_days days have passed from the declaration date to the
      acceptance date, the salvage bid has lapsed and the salvage value is salvage_lapsed_pct percent of the actual
      cash value; where the bid is still valid but below salvage_floor_pct percent of the actual cash value, the
      salvage value is salvage_floor_pct percent of the actual cash value; otherwise the salvage value is the highest
      salvage bid. Each percentage figure is rounded to the cent.
      Kept-vehicle loyalty discount: where the auto policy's inception date is at least kept_long_tenure_months whole
      months before the loss date, the salvage deduction is the salvage value less kept_long_salvage_discount_pct
      percent; where it is at least kept_mid_tenure_months but fewer than kept_long_tenure_months whole months
      before, the salvage deduction is the salvage value less kept_mid_salvage_discount_pct percent; otherwise the
      salvage deduction is the salvage value. The discounted figure is rounded to the cent.
      Retained equipment: where the vehicle could be driven after the loss and the estimate total is below
      cosmetic_ratio_pct percent of the actual cash value, the custom equipment stays usable on the kept vehicle and
      no retained-equipment payment is made; where the vehicle could be driven and the estimate total is at or above
      that share, drivable_equipment_pct percent of the documented custom equipment up to the limit is paid; where
      the vehicle could not be driven, the documented custom equipment is paid up to the limit in full.
      Retitling allowance: on a policy whose policy state is OH or IN, retitle_allowance_oh_in is added to the kept-vehicle settlement for the salvage title and inspection the kept vehicle needs; on a policy whose policy state is KY or WV, retitle_allowance_ky_wv is added to it; in any other state nothing is added.
      Kept-vehicle tax basis: where a vehicle has been added to the auto policy with an effective date after the loss date, the customer has bought a replacement and the kept-vehicle sales tax is figured on the full kept value; where no vehicle has been added since the loss and fewer than replacement_window_days days have passed from the loss date to the acceptance date, no kept-vehicle sales tax is paid with the settlement; otherwise the kept-vehicle sales tax is figured on the kept value less the salvage deduction.
    prerequisite:
      - problem: physdmg_ext_claim_free_credit
        kind: value_input
        gate: credit_balance
        form: state
        policy_source: >-
          The kept-vehicle settlement is not worked out until the vehicle's Deductible Rewards balance carries a
          credit for every completed claim-free year.
        condition: >-
          The coverage's physdmg_payments include a claim_free_year credit entry for every claim-free year whose end
          date has passed, and deductible_credit_balance includes those credits.
        resolved_by: grant_claim_free_credit_c23d8d33
        effect: >-
          The credit balance binding rises by the credit granted, so more of the decided deductible is absorbed by
          Deductible Rewards and the kept net deductible falls.
    cross_category:
      - category: auto
        as: history
        reads: [policy_state, inception_date, auto_transactions.effective_date]
        note: The policy state decides tax, title fee and retitling allowance; the inception date the loyalty discount; the latest vehicle add the tax basis.
    compute:
      - claim: "LATEST('physdmg_claim_events', 'claim_number', event_type='physdmg_total_loss_declared')"
      - declared_on: "LATEST('physdmg_claim_events', 'event_date', event_type='physdmg_total_loss_declared', claim_number=claim)"
      - acv: "MAX('physdmg_claim_events', 'acv_amount', event_type='physdmg_total_loss_declared', claim_number=claim)"
      - prior_noted: "LATEST('physdmg_claim_events', 'prior_damage_amount', event_type='physdmg_total_loss_declared', claim_number=claim)"
      - salvage_bid: "LATEST('physdmg_claim_events', 'salvage_value', event_type='physdmg_total_loss_declared', claim_number=claim)"
      - custom_value: "LATEST('physdmg_claim_events', 'custom_equipment_value', event_type='physdmg_total_loss_declared', claim_number=claim)"
      - estimate_total: "LATEST('physdmg_claim_events', 'estimate_amount', event_type='physdmg_total_loss_declared', claim_number=claim)"
      - loss_date: "LATEST('physdmg_claim_events', 'loss_date', event_type='physdmg_claim_report', claim_number=claim)"
      - drivable: "LATEST('physdmg_claim_events', 'drivable', event_type='physdmg_claim_report', claim_number=claim)"
      - decided_deductible: "LATEST('physdmg_claim_events', 'deductible_amount', event_type='physdmg_coverage_decision', claim_number=claim, coverage_decision='accepted')"
      - credit_balance: "F('deductible_credit_balance')"
      - kept_net_deductible: "RND(decided_deductible - MN(credit_balance, decided_deductible), 2)"
      - kept_value: "RND(acv - prior_noted, 2)"
      - policy_state: "CFIELD('auto', 'policy_state', policy_id=F('policy_id'))"
      - kept_tax_pct: "K('kept_tax_pct_oh') if policy_state == 'OH' else (K('kept_tax_pct_in') if policy_state == 'IN' else (K('kept_tax_pct_ky') if policy_state == 'KY' else (K('kept_tax_pct_va') if policy_state == 'VA' else K('kept_tax_pct_wv'))))"
      - title_fee: "K('kept_title_fee_oh') if policy_state == 'OH' else (K('kept_title_fee_in') if policy_state == 'IN' else (K('kept_title_fee_ky') if policy_state == 'KY' else (K('kept_title_fee_va') if policy_state == 'VA' else K('kept_title_fee_wv'))))"
      - days_since_declaration: "DAYS(declared_on, NOW)"
      - salvage_value: "RND(acv * K('salvage_lapsed_pct') / 100, 2) if days_since_declaration > K('salvage_bid_valid_days') else (RND(acv * K('salvage_floor_pct') / 100, 2) if salvage_bid < RND(acv * K('salvage_floor_pct') / 100, 2) else salvage_bid)"
      - tenure_months: "MONTHS(CFIELD('auto', 'inception_date', policy_id=F('policy_id')), loss_date)"
      - salvage_discount_pct: "K('kept_long_salvage_discount_pct') if tenure_months >= K('kept_long_tenure_months') else (K('kept_mid_salvage_discount_pct') if tenure_months >= K('kept_mid_tenure_months') else 0)"
      - salvage_deduction: "RND(salvage_value * (1 - salvage_discount_pct / 100), 2)"
      - equipment_share: "0 if drivable and estimate_total < acv * K('cosmetic_ratio_pct') / 100 else (K('drivable_equipment_pct') / 100 if drivable else 1)"
      - retained_equipment: "RND(MN(P('custom_equipment_limit'), custom_value) * equipment_share, 2)"
      - retitle_allowance: "K('retitle_allowance_oh_in') if policy_state == 'OH' or policy_state == 'IN' else (K('retitle_allowance_ky_wv') if policy_state == 'KY' or policy_state == 'WV' else 0)"
      - latest_vehicle_add: "XLATEST('auto', 'auto_transactions', 'effective_date', event_type='auto_vehicle_add') or ''"
      - days_to_acceptance: "DAYS(loss_date, NOW)"
      - tax_base: "kept_value if latest_vehicle_add > loss_date else (0 if days_to_acceptance < K('replacement_window_days') else RND(kept_value - salvage_deduction, 2))"
      - kept_tax: "RND(tax_base * kept_tax_pct / 100, 2)"
      - result: "RND(kept_value + kept_tax + title_fee + retained_equipment + retitle_allowance - kept_net_deductible - salvage_deduction, 2)"
    compute_basis:
      claim: "Its figures are read from the claim's total-loss declaration"
      declared_on: "where more than salvage_bid_valid_days days have passed from the declaration date to the acceptance date"
      acv: "A vehicle the customer keeps is valued at its actual cash value in every case"
      prior_noted: "The kept value is the actual cash value less the unrepaired prior damage noted, rounded to the cent."
      salvage_bid: "The salvage deduction is the highest salvage bid on the declaration."
      custom_value: "The retained-equipment payment is the documented custom equipment up to the option's custom_equipment_limit."
      estimate_total: "where the vehicle could be driven after the loss and the estimate total is below cosmetic_ratio_pct percent of the actual cash value"
      loss_date: "where a vehicle has been added to the auto policy with an effective date after the loss date"
      drivable: "and from the claim's loss report (loss date and whether the vehicle could be driven)"
      decided_deductible: "The kept net deductible is the deductible stated on the claim's latest accepted coverage decision less the vehicle's Deductible Rewards credit balance applied up to that deductible."
      credit_balance: "The kept net deductible is the deductible stated on the claim's latest accepted coverage decision less the vehicle's Deductible Rewards credit balance applied up to that deductible."
      kept_net_deductible: "The kept net deductible is the deductible stated on the claim's latest accepted coverage decision less the vehicle's Deductible Rewards credit balance applied up to that deductible."
      kept_value: "The kept value is the actual cash value less the unrepaired prior damage noted, rounded to the cent."
      policy_state: "The kept-vehicle sales tax is the kept value less the salvage deduction, times the policy state's percentage in sales_tax_rate_by_state, rounded to the cent, and the title fee is the policy state's fee in title_fee_by_state."
      kept_tax_pct: "The kept-vehicle sales tax is the kept value less the salvage deduction, times the policy state's percentage in sales_tax_rate_by_state, rounded to the cent"
      title_fee: "the title fee is the policy state's fee in title_fee_by_state."
      days_since_declaration: "where more than salvage_bid_valid_days days have passed from the declaration date to the acceptance date"
      salvage_value: "Salvage value basis: where more than salvage_bid_valid_days days have passed from the declaration date to the acceptance date, the salvage bid has lapsed and the salvage value is salvage_lapsed_pct percent of the actual cash value; where the bid is still valid but below salvage_floor_pct percent of the actual cash value, the salvage value is salvage_floor_pct percent of the actual cash value; otherwise the salvage value is the highest salvage bid. Each percentage figure is rounded to the cent."
      tenure_months: "where the auto policy's inception date is at least kept_long_tenure_months whole months before the loss date"
      salvage_discount_pct: "Kept-vehicle loyalty discount: where the auto policy's inception date is at least kept_long_tenure_months whole months before the loss date, the salvage deduction is the salvage value less kept_long_salvage_discount_pct percent; where it is at least kept_mid_tenure_months but fewer than kept_long_tenure_months whole months before, the salvage deduction is the salvage value less kept_mid_salvage_discount_pct percent; otherwise the salvage deduction is the salvage value."
      salvage_deduction: "The discounted figure is rounded to the cent."
      equipment_share: "Retained equipment: where the vehicle could be driven after the loss and the estimate total is below cosmetic_ratio_pct percent of the actual cash value, the custom equipment stays usable on the kept vehicle and no retained-equipment payment is made; where the vehicle could be driven and the estimate total is at or above that share, drivable_equipment_pct percent of the documented custom equipment up to the limit is paid; where the vehicle could not be driven, the documented custom equipment is paid up to the limit in full."
      retained_equipment: "The retained-equipment payment is the documented custom equipment up to the option's custom_equipment_limit."
      retitle_allowance: "Retitling allowance: on a policy whose policy state is OH or IN, retitle_allowance_oh_in is added to the kept-vehicle settlement for the salvage title and inspection the kept vehicle needs; on a policy whose policy state is KY or WV, retitle_allowance_ky_wv is added to it; in any other state nothing is added."
      latest_vehicle_add: "where a vehicle has been added to the auto policy with an effective date after the loss date"
      days_to_acceptance: "fewer than replacement_window_days days have passed from the loss date to the acceptance date"
      tax_base: "Kept-vehicle tax basis: where a vehicle has been added to the auto policy with an effective date after the loss date, the customer has bought a replacement and the kept-vehicle sales tax is figured on the full kept value; where no vehicle has been added since the loss and fewer than replacement_window_days days have passed from the loss date to the acceptance date, no kept-vehicle sales tax is paid with the settlement; otherwise the kept-vehicle sales tax is figured on the kept value less the salvage deduction."
      kept_tax: "The kept-vehicle sales tax is the kept value less the salvage deduction, times the policy state's percentage in sales_tax_rate_by_state, rounded to the cent"
      result: "The kept-vehicle settlement is the kept value plus the kept-vehicle sales tax plus the title fee plus the retained-equipment payment, less the kept net deductible and less the salvage deduction, each figure rounded to the cent before it is added."
    factors:
      - id: salvage_value_basis
        effect: method
        decides: salvage_value
        bindings: [days_since_declaration, salvage_value]
        ladder:
          - when: "more than salvage_bid_valid_days days from the declaration to the acceptance (the bid has lapsed)"
            method: "salvage value is salvage_lapsed_pct percent of the actual cash value"
          - when: "bid still valid AND below salvage_floor_pct percent of the actual cash value"
            method: "salvage value is salvage_floor_pct percent of the actual cash value"
          - when: "otherwise"
            method: "salvage value is the highest salvage bid"
        baseline:
          salvage_value: "salvage_bid"
        evidence: [date, history]
        cross_difficulty: null
      - id: kept_vehicle_loyalty_discount
        effect: parameter
        decides: salvage_discount_pct
        bindings: [tenure_months, salvage_discount_pct]
        ladder:
          - when: "inception at least kept_long_tenure_months whole months before the loss"
            value: "K('kept_long_salvage_discount_pct')"
          - when: "inception at least kept_mid_tenure_months but fewer than kept_long_tenure_months whole months before the loss"
            value: "K('kept_mid_salvage_discount_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          salvage_discount_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: auto
      - id: retained_equipment
        effect: parameter
        decides: equipment_share
        bindings: [estimate_total, drivable, equipment_share]
        ladder:
          - when: "the vehicle could be driven after the loss AND the estimate total is below cosmetic_ratio_pct percent of the actual cash value"
            value: "0"
          - when: "the vehicle could be driven after the loss AND the estimate total is at or above that share"
            value: "K('drivable_equipment_pct') / 100"
          - when: "otherwise (the vehicle could not be driven)"
            value: "1"
        baseline:
          equipment_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: retitling_allowance
        effect: parameter
        decides: retitle_allowance
        bindings: [policy_state, retitle_allowance]
        ladder:
          - when: "policy state OH or IN"
            value: "K('retitle_allowance_oh_in')"
          - when: "policy state KY or WV"
            value: "K('retitle_allowance_ky_wv')"
          - when: "otherwise"
            value: "0"
        baseline:
          retitle_allowance: "0"
        evidence: [cross_category]
        cross_difficulty: auto
      - id: kept_vehicle_tax_basis
        effect: method
        decides: tax_base
        bindings: [latest_vehicle_add, days_to_acceptance, tax_base]
        ladder:
          - when: "a vehicle added to the auto policy with an effective date after the loss date (a replacement bought)"
            method: "tax is figured on the full kept value"
          - when: "no vehicle added since the loss AND fewer than replacement_window_days days from the loss to the acceptance"
            method: "no kept-vehicle sales tax is paid with the settlement"
          - when: "otherwise"
            method: "tax is figured on the kept value less the salvage deduction"
        baseline:
          tax_base: "RND(kept_value - salvage_deduction, 2)"
        evidence: [cross_category, history]
        cross_difficulty: auto
    baseline:
      rule: >-
        The kept value is the actual cash value less the unrepaired prior damage noted, rounded to the cent. The kept-vehicle sales tax is the kept value less the salvage deduction, times the policy state's percentage in sales_tax_rate_by_state, rounded to the cent, and the title fee is the policy state's fee in title_fee_by_state. The retained-equipment
        payment is the documented custom equipment up to the option's custom_equipment_limit. The salvage deduction is
        the highest salvage bid on the declaration. The kept net deductible is the deductible stated on the claim's
        latest accepted coverage decision less the vehicle's Deductible Rewards credit balance applied up to that
        deductible. The kept-vehicle settlement is the kept value plus the kept-vehicle sales tax plus the title fee
        plus the retained-equipment payment, less the kept net deductible and less the
        salvage deduction, each figure rounded to the cent before it is added.
      params: [sales_tax_rate_by_state, title_fee_by_state, custom_equipment_limit]
    inputs:
      history:
        - {table: physdmg_claim_events, aggregate: latest, field: salvage_value, filters: {event_type: physdmg_total_loss_declared}}
        - {table: physdmg_claim_events, aggregate: latest, field: drivable, filters: {event_type: physdmg_claim_report}}
        - {table: physdmg_claim_events, aggregate: latest, field: deductible_amount, filters: {event_type: physdmg_coverage_decision, coverage_decision: accepted}}
        - {category: auto, table: auto_transactions, aggregate: latest, field: effective_date, filters: {event_type: auto_vehicle_add}}
      cross_category: [auto]
