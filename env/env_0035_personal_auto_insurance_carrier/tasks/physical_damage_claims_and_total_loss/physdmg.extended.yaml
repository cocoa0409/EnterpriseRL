# Product charter: Cardinal Physical Damage Coverage (collision and comprehensive on one scheduled vehicle).
# Path: env/env_0035_personal_auto_insurance_carrier/blueprint/products/physdmg.yaml
#
# Capability matrix (functional closure audit):
#   open        attach to a scheduled vehicle (package must allow it), photo inspection or new-vehicle exemption,
#               newly acquired vehicle automatic physical damage, loss payee for financed/leased vehicles
#   in term     deductible option change (decrease needs inspection), storage (comprehensive only), loan/lease payoff
#               option, Deductible Rewards (vanishing deductible) enrollment, removal
#   claims      first notice of loss, coverage part by cause of loss, coverage decision and exclusions, fault and
#               other-party insurance, estimates and supplements, deductible (glass, collision deductible waiver,
#               newly acquired, one deductible per occurrence, Deductible Rewards credit), repair payment and payees,
#               towing and storage, built-in transportation expense, pet injury, custom equipment
#   total loss  state total-loss threshold, actual cash value with comparables, sales tax and title fee by state,
#               prior damage, owner-retained salvage, lienholder payoff first, loan/lease payoff, new car replacement,
#               theft waiting period, settlement acceptance by the customer, payment after title
#   recovery    subrogation, salvage proceeds, deductible reimbursement in proportion, payment void
#   exceptions  late report, excluded or unlisted driver, wear and mechanical failure, rideshare without endorsement,
#               first-party diminished value, appraisal disputes

category: physdmg
display_name: Cardinal Physical Damage Coverage

binding:
  holding_table: physdmg_coverages
  event_tables: [physdmg_claim_events, physdmg_payments]
  intake_tables: [physdmg_total_loss_settlements]
  status_field: status
  variant_field: variant_name
  quantity_fields: {deductible_credit_balance: deductible_credit}

lifecycle:
  states: [pending_inspection, active, storage, removed]
  transitions:
    - {from: pending_inspection, to: active, by: system, means: The photo inspection is accepted (or the vehicle is exempt as a new vehicle) and coverage is confirmed.}
    - {from: pending_inspection, to: removed, by: system, means: The inspection was not completed in time and physical damage is removed from the vehicle.}
    - {from: active, to: storage, by: agent, means: At the customer's request the vehicle is put in storage and only comprehensive stays in force.}
    - {from: storage, to: active, by: agent, means: The stored vehicle returns to the road and collision is restored.}
    - {from: active, to: removed, by: agent, means: Physical damage is removed from the vehicle (customer request, vehicle removed, package no longer allows it, or a total loss is settled).}
    - {from: storage, to: removed, by: agent, means: Physical damage is removed from a stored vehicle.}

accounts:
  - key: deductible_credit
    unit: USD
    meaning: Deductible Rewards credit available to reduce the deductible of the next paid collision or comprehensive claim on the vehicle.
  - key: loss_paid
    unit: USD
    meaning: Net amount paid on physical damage claims of the vehicle; claim payments raise it, recoveries and voids lower it.

parameter_schema:
  collision_deductible: Deductible applied to a collision loss, USD.
  comprehensive_deductible: Deductible applied to a comprehensive (other than collision) loss other than glass, USD.
  glass_repair_deductible: Deductible applied when damaged glass is repaired rather than replaced, USD.
  glass_replacement_deductible: Deductible applied when glass is replaced, USD.
  full_glass_included: Boolean switch; whether glass replacement carries no deductible.
  deductible_factor: Multiplier applied to the vehicle's physical damage base premium (rated at the reference deductible), decimal.
  reference_deductible: Deductible at which the rating worksheet's physical damage base premium is rated, USD.
  deductible_rewards_available: Boolean switch; whether the Deductible Rewards (vanishing deductible) feature may be enrolled on this option.
  deductible_rewards_enrollment_credit: Credit granted when Deductible Rewards is enrolled, USD.
  deductible_rewards_annual_credit: Credit granted for each 12 consecutive months without a paid collision or comprehensive claim on the vehicle, USD.
  deductible_rewards_max_credit: Maximum Deductible Rewards credit that can be held, USD.
  collision_deductible_waiver: Boolean switch; whether the collision deductible is waived when the other driver is identified, fully at fault and uninsured.
  animal_strike_coverage_part: Coverage part that pays for hitting an animal (comprehensive or collision).
  tow_from_scene_max_miles: Maximum towing distance from the loss scene to a repair facility or storage yard paid under the claim, miles.
  storage_daily_max: Maximum daily storage charge paid, USD per day.
  storage_days_after_notice: Calendar days after the storage notice through which storage is paid, integer.
  inspection_due_days: Calendar days after the physical damage effective date within which the photo inspection must be completed, integer.
  inspection_exempt_if_purchased_new: Boolean switch; whether a vehicle bought new from a dealer with a bill of sale is exempt from inspection.
  total_loss_threshold_pct_by_state: Mapping state -> percent of actual cash value at or above which the repair estimate makes the vehicle a total loss.
  sales_tax_rate_by_state: Mapping state -> sales tax percent paid on the actual cash value in a total-loss settlement.
  title_fee_by_state: Mapping state -> title transfer fee paid in a total-loss settlement, USD.
  total_loss_payment_days: Calendar days after the signed title and settlement acceptance are received within which the settlement is paid, integer.
  acv_min_comparables: Minimum comparable vehicles in the valuation report used to set actual cash value, integer.
  acv_comparable_radius_miles: Radius around the garaging ZIP within which comparables are drawn, miles.
  owner_retained_salvage_allowed: Boolean switch; whether the customer may keep a total-loss vehicle with its salvage value deducted.
  prior_damage_deduction_applies: Boolean switch; whether unrepaired prior damage noted in the valuation is deducted from actual cash value.
  custom_equipment_limit: Limit for aftermarket custom parts and equipment not included in actual cash value, USD.
  pet_injury_limit: Limit for veterinary expenses of a dog or cat injured in a covered collision, USD.
  new_car_replacement_max_age_months: Maximum age of the vehicle in months since its first retail delivery for new car replacement, integer.
  new_car_replacement_max_miles: Maximum odometer reading at the loss for new car replacement, miles.
  loan_lease_payoff_pct_of_acv: Cap of the loan/lease payoff benefit as a percent of actual cash value.
  loan_lease_payoff_premium_pct: Loan/lease payoff option premium as a percent of the vehicle's physical damage premium.
  lienholder_joint_check_threshold: Repair payment amount at or above which the loss payee is named jointly on the payment, USD.
  supplement_reinspection_threshold: Supplement amount at or above which the supplement is reinspected before payment, USD.
  select_shop_workmanship_warranty: Workmanship warranty Cardinal guarantees on repairs at a Cardinal Select Shop.
  non_network_labor_rate_basis: Basis for labor rates paid at a shop outside the Cardinal Select network.
  oem_parts_max_vehicle_age_years: Vehicles of this many model years or newer are repaired with original manufacturer parts, integer (0 = no OEM requirement).
  adas_calibration_covered: Boolean switch; whether calibration of driver-assistance sensors after a covered repair is paid.
  late_report_review_days: Calendar days after the loss date beyond which a newly reported loss is referred to a claims supervisor, integer.
  theft_settlement_wait_days: Calendar days after a total theft is reported before it is settled as a total loss if not recovered, integer.
  theft_recovery_buyback_days: Calendar days after notice of recovery within which the customer may buy back a recovered vehicle after settlement, integer.
  transportation_expense_daily: Built-in transportation expense benefit per day when no rental reimbursement option is carried, USD.
  transportation_expense_max: Maximum built-in transportation expense per loss, USD.
  transportation_wait_hours_theft: Hours after a total theft is reported before built-in transportation expense starts, integer.
  transportation_wait_hours_other: Hours after any other covered loss before built-in transportation expense starts, integer.
  storage_min_days: Minimum days a vehicle must be expected to be off the road to be put in storage (comprehensive only), integer.
  deductible_decrease_requires_inspection: Boolean switch; whether lowering the deductible requires a new photo inspection before it takes effect.
  single_deductible_same_occurrence: Boolean switch; whether one deductible (the highest) applies when two or more vehicles on the same policy are damaged in one occurrence.
  first_party_diminished_value_covered: Boolean switch; whether loss in market value after repair is paid to the customer.
  newly_acquired_report_days: Calendar days after acquisition within which physical damage must be requested on a newly acquired vehicle for it to apply from the acquisition date, integer.
  newly_acquired_deductible: Deductible applied to a loss on a newly acquired vehicle during its automatic physical damage period, USD.

