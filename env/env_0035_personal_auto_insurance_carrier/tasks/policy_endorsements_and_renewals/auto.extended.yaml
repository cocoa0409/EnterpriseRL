    factors:
    - id: cancellation_date_anchor
      effect: method
      decides: cx_cancel_date
      bindings:
      - cx_request_date
      - cx_cancel_date
      ladder:
      - when: the date written on the request is after the term expiration date
        method: the cancellation date is the term expiration date
      - when: the date written on the request is earlier than the signing day
        method: the cancellation date is the signing day
      - when: otherwise
        method: the cancellation date is the date written on the request
      baseline:
        cx_cancel_date: cx_request_date
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: cancellation_loss_payee_notice
      effect: parameter
      decides: cx_notice_days
      bindings:
      - cx_open_loans
      - cx_payoff_date
      - cx_notice_days
      ladder:
      - when: more new loans than loan payoffs are recorded on the policy
        value: K('notice_days') = 10 days
      - when: the policy's latest loan payoff took effect after the cancellation date
        value: the days from the cancellation date to the payoff's effective date, at most 10
      - when: >-
          otherwise (the latest loan payoff took effect on or before the cancellation date, or no loan is recorded)
        value: none
      baseline:
        cx_notice_days: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: tenure_return_share
      effect: parameter
      decides: cx_return_share
      bindings:
      - cx_tenure_months
      - cx_lapse_marker
      - cx_return_share
      ladder:
      - when: Cardinal tenure of 60 months or more and no lapse marker on the policy record
        value: K('share_long_tenure') = 100 percent
      - when: Cardinal tenure of 12 months or more but under 60 and no lapse marker
        value: K('share_mid_tenure') = 95 percent
      - when: otherwise
        value: K('share_short_rate') = 90 percent
      baseline:
        cx_return_share: K('share_short_rate')
      evidence:
      - date
      cross_difficulty: null
    - id: plan_discount_takeback
      effect: parameter
      decides: cx_takeback_pct
      bindings:
      - cx_plan_name
      - cx_plan_discount
      - cx_takeback_pct
      ladder:
      - when: the billing account is on the Cardinal Paid-in-Full Plan
        value: the whole plan discount percentage
      - when: the billing account is on another plan that carries a plan discount
        value: K('installment_takeback_share') = half of its plan discount percentage
      - when: otherwise
        value: nil
      baseline:
        cx_takeback_pct: '0'
      evidence:
      - cross_category
      cross_difficulty: billing
    - id: payment_method_charge
      effect: parameter
      decides: cx_charge
      bindings:
      - cx_autopay
      - cx_returned_payments
      - cx_charge
      ladder:
      - when: >-
          the billing account is enrolled in automatic payments and no returned payment was posted in the last twelve
          months
        value: K('waived_charge') = no charge
      - when: >-
          the billing account is not enrolled in automatic payments and no returned payment was posted in the last
          twelve months
        value: K('reduced_charge_share') = half the package's cancellation fee
      - when: otherwise
        value: the package's cancellation fee
      baseline:
        cx_charge: 0 if cx_disposed else P('cancellation_fee')
      evidence:
      - history
      - cross_category
      cross_difficulty: billing
    baseline:
      rule: >-
