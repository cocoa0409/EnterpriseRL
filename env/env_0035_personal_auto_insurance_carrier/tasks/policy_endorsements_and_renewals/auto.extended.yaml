  - id: auto_ext_named_driver_exclusion_credit
    base_policy_refs:
    - auto_driver_changes
    - auto_combo_financial_responsibility
    - auto_agg_household_vehicle_count
    - auto_evt_premium_rating
    - auto_evt_midterm_proration
    - auto_insured_cancellation
    overwrite:
    - base_policy: auto_driver_changes
      superseded_clause: >-
        A named driver exclusion is processed only when a signed named driver exclusion request exists for that driver
        on that policy.
      replaced_by: >-
        A named driver exclusion is carried out by the named insured's own signature: signing the named driver exclusion
        form recorded for a household member on the policy writes the exclusion endorsement for that member from the
        exclusion's effective date and credits the exclusion credit as one return premium entry for the term.
    - base_policy: auto_evt_midterm_proration
      superseded_clause: >-
        the difference is multiplied by the unexpired days of the term divided by the days in the term and rounded
        to the cent (half up).
      replaced_by: >-
        The exclusion credit is the credit base times the retention share, then times the loss share, rounded to the
        cent (half up) once, at the end, with no intermediate rounding.
    trigger: on_request
    subject:
    - auto_driver_exclude
    - auto_return_premium
    computes: return_premium
    target_tool: sign_named_driver_exclusion_c094ed6f
    params:
      retention_short_days: 90
      retention_mid_days: 180
      retention_short: 0.75
      retention_mid: 0.9
      loss_share_paid: 0.5
      loss_share_pending: 0.75
    rule: >-
      A named driver exclusion is carried out by the named insured's own signature: signing the named driver exclusion
      form recorded for a household member on the policy writes the exclusion endorsement for that member from the
      exclusion's effective date and credits the exclusion credit as one return premium entry for the term. Where
      the excluded driver was added during the current term with a premium effect, the exclusion credit is not worked
      out until that driver's addition carries its own additional premium entry on the policy. The exclusion credit
      is the credit base times the retention share, then times the loss share, rounded to the cent (half up) once,
      at the end, with no intermediate rounding. The full-term charge of the excluded driver is the full-term premium
      after that driver's addition less the full-term premium before it, as recorded on the addition entry. The days
      of the exclusion's term are counted in calendar days from the term effective date to the term expiration date
      of the term the exclusion falls in, and the credit days run from the exclusion's effective date to the term
      expiration date. The credit base is the full-term charge of the excluded driver times the credit days divided
      by the days of the exclusion's term. The exclusion's effective date is the effective date written on the named
      driver exclusion form. For an exclusion credit the retention share and the loss share are each one. The credit
      base follows how the excluded driver was charged during the term: where the driver's addition carries an additional
      premium entry of the current term, the charge written on that entry times the credit days divided by the days
      that charge was written for, the unearned share of what was actually charged; the days that charge was written
      for are the calendar days to the term expiration date from the addition's effective date where the addition
      was recorded no more calendar days after that effective date than the package's household driver report days,
      and from the date the addition was recorded otherwise; where the driver was added during the term with a premium
      effect but no additional premium entry was written, nothing was charged and the credit base is nil; otherwise,
      the full-term charge of the excluded driver times the credit days divided by the days of the exclusion's term.
      The exclusion's effective date is set as follows: where the date written on the form is after the term expiration
      date, the term expiration date, so that no day is credited; where the date written on the form is earlier than
      the day the form is signed, the signing day, since an exclusion never takes effect before its signature; otherwise,
      the date written on the form. The retention share follows how long the excluded driver was rated, counted in
      calendar days from the effective date of that driver's addition to the day the form is signed: fewer than 90
      days, three quarters; 90 days or more but fewer than 180, nine tenths; 180 days or more, one. The loss share
      follows the physical damage losses of the last six months at which the excluded driver was found at fault: where
      such a loss has payments on its claim reaching the package's at-fault surcharge minimum paid, one half; where
      such a loss has no payment yet, three quarters; otherwise, one.
