    inputs:
      history:
      - table: auto_transactions
        aggregate: sum
        field: premium_amount
        filters:
          event_type: auto_term_premium_written | auto_additional_premium | auto_return_premium
          term_effective_date: current term
      - table: auto_transactions
        aggregate: count
        field: transaction_id
        filters:
          event_type: auto_lienholder_change | auto_vehicle_add | auto_vehicle_remove
      - table: auto_change_requests
        aggregate: latest
        field: requested_effective_date
        filters:
          request_type: insured_cancellation
          request_status: awaiting_signature
      - category: billing
