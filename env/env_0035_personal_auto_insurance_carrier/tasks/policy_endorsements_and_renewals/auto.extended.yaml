      than nil; the days in the cancelled term are the calendar days from the term effective date to the term expiration
      date. No cancellation charge and no minimum earned premium apply when no vehicle is left on the schedule and
      every vehicle that left it was removed as sold or as a total loss. The cancellation date is the effective date
      written on the cancellation request. The return share is 90 percent, the short-rate share Cardinal returns on
      a cancellation the named insured asks for. No loss payee notice days are deducted, no plan discount is taken
