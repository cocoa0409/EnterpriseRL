    rule: >-
      A cancellation the named insured asks for is carried out by the named insured's own signature: signing the cancellation
      request recorded for the policy cancels the policy on the cancellation date and credits the cancellation refund
      as one return premium entry for the term. The cancellation refund is fixed only after every vehicle removal
      recorded on the policy during the term carries its own return premium entry. The cancellation refund is the
