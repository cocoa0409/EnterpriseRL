    prerequisite:
    - problem: auto_ext_vehicle_removal_credit
      kind: value_input
      gate: cx_written
      form: state
      policy_source: >-
        The cancellation refund is fixed only after every vehicle removal recorded on the policy during the term carries
        its own return premium entry.
      condition: >-
        Every vehicle removal entry of the current term in the policy's transaction history has a return premium entry
        pointing at it.
      resolved_by: book_vehicle_removal_credit_524db3a4
      effect: >-
        Once the removal's return premium entry stands, the written premium of the term drops by that credit, and
        so does the liability part the refund is prorated from.
    cross_category:
    - category: billing
      as: history
      reads:
      - variant_name
      - autopay_enrolled
      - billing_ledger.event_type
