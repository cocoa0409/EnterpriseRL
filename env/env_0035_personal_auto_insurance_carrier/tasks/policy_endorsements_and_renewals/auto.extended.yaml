  - id: auto_ext_driver_addition_premium
    base_policy_refs:
    - auto_agg_household_vehicle_count
    - auto_evt_premium_rating
    - auto_evt_midterm_proration
    - auto_driver_changes
    overwrite:
    - base_policy: auto_evt_midterm_proration
      superseded_clause: >-
        the difference is multiplied by the unexpired days of the term divided by the days in the term and rounded
        to the cent (half up).
      replaced_by: >-
        The driver addition charge is the full-term charge of the addition times the operator share, then times one
        plus the loss load percentage divided by 100, then times one less the loyalty credit percentage times its
        continuous-coverage share divided by 100, then times the charged days divided by the days of the addition's
        term; the product is rounded to the cent (half up) once, at the end, with no intermediate rounding.
    trigger: state_due
    subject:
    - auto_additional_premium
    computes: additional_premium
    target_tool: book_driver_addition_premium_cd2c8cbf
    params:
      occasional_share: 0.6
      shared_share: 0.85
      pending_share: 0.5
      long_tenure_months: 60
      mid_tenure_months: 36
      loyalty_long_pct: 10
      loyalty_mid_pct: 5
      lapse_old_months: 36
      lapse_old_share: 0.5
    rule: >-
      A driver addition recorded on the auto policy is charged by one additional premium entry tied to that addition,
      carrying the driver addition charge for the term. The driver addition charge is the full-term charge of the
      addition times the operator share, then times one plus the loss load percentage divided by 100, then times one
      less the loyalty credit percentage times its continuous-coverage share divided by 100, then times the charged
      days divided by the days of the addition's term; the product is rounded to the cent (half up) once, at the end,
      with no intermediate rounding. The full-term charge of an addition is the full-term premium after the addition
      less the full-term premium before it, both as recorded on the addition entry. The days of the addition's term
      are counted in calendar days from the term effective date to the term expiration date of the term the addition
      falls in. The charged days of a driver addition are the calendar days from the date the driver addition was
      recorded to the term expiration date. For a driver addition the operator share is one, and the loss load percentage,
      the loyalty credit percentage and its continuous-coverage share are each nil. The charged days of a driver addition
      start from a date set as follows: where the addition took effect before the current term began, from the term
      expiration date, so that nothing is charged, the driver being carried in the term premium already written; where
      the driver addition was recorded no more calendar days after its effective date (the day the member became licensed
      or moved in) than the package's household driver report days, from that effective date, the member having been
      reported in time; otherwise, from the date it was recorded, the day the household member was reported. The operator
      share follows how the household's rated drivers compare with its scheduled vehicles once the driver is added,
      counting the drivers added less those excluded or removed and the vehicles added less those removed: more rated
      drivers than vehicles, 60 percent, the added driver being rated as an occasional operator; as many rated drivers
      as vehicles, 85 percent, the added driver sharing a vehicle as one of its principal operators; fewer rated drivers
      than vehicles, one. The loss load percentage follows the physical damage losses of the last six months at which
      the added driver was found at fault: where such a loss has payments on its claim reaching the package's at-fault
      surcharge minimum paid, the package's at-fault accident surcharge percentage; where such a loss has no payment
      yet, half that percentage; otherwise, nil. The loyalty credit percentage of a driver addition follows the named
      insured's Cardinal tenure, in whole months from the policy's original inception date to the day the charge is
      booked: 60 months or more, 10 percent; 36 months or more but under 60, 5 percent; under 36 months, nil. The
      continuous-coverage share of the loyalty credit follows the lapse marker on the policy record (a cancellation
      effective date kept on a reinstated policy marks a lapse in coverage): with no lapse marker, the whole credit;
      with a lapse marker dated 36 months or more before the day the charge is booked, half of it; with a lapse marker
      dated less than 36 months before that day, none of it.
    prerequisite: []
    cross_category:
    - category: physdmg
      as: history
      reads:
      - physdmg_claim_events.claim_number
      - physdmg_claim_events.fault_determination
      - physdmg_claim_events.driver_id
      - physdmg_payments.amount
      note: >-
        At-fault physical damage losses of the added driver and the payments on them decide the loss load.
    compute:
    - da_term_start: F('term_effective_date')
    - da_term_end: F('term_expiration_date')
    - da_term_days: DAYS(da_term_start, da_term_end)
    - da_addition: >-
        LATEST('auto_transactions', 'transaction_id', date_field='recorded_date', event_type='auto_driver_add')
    - da_driver: >-
        LATEST('auto_transactions', 'driver_id', date_field='recorded_date', transaction_id=da_addition)
    - da_charge: >-
        SUM('auto_transactions', 'full_term_premium_after', transaction_id=da_addition) - SUM('auto_transactions',
        'full_term_premium_before', transaction_id=da_addition)
    - da_effective: >-
        LATEST('auto_transactions', 'effective_date', date_field='recorded_date', transaction_id=da_addition)
    - da_recorded: >-
        LATEST('auto_transactions', 'recorded_date', date_field='recorded_date', transaction_id=da_addition)
    - da_charge_from: >-
        da_term_end if da_effective < da_term_start else (da_effective if DAYS(da_effective, da_recorded) <= P('household_driver_report_days')
        else da_recorded)
    - da_charged_days: DAYS(da_charge_from, da_term_end)
    - da_drivers: >-
        COUNT('auto_transactions', event_type='auto_driver_add') - COUNT('auto_transactions', event_type='auto_driver_exclude')
        - COUNT('auto_transactions', event_type='auto_driver_remove')
    - da_vehicles: >-
        COUNT('auto_transactions', event_type='auto_vehicle_add') - COUNT('auto_transactions', event_type='auto_vehicle_remove')
    - da_operator_share: >-
        K('occasional_share') if da_drivers > da_vehicles else (K('shared_share') if da_drivers == da_vehicles else
        1)
    - da_fault_claim: >-
        XLATEST('physdmg', 'physdmg_claim_events', 'claim_number', date_field='event_date', event_type='physdmg_fault_determination',
        driver_id=da_driver, fault_determination='insured_at_fault')
    - da_at_fault_losses: >-
        XCOUNT('physdmg', 'physdmg_claim_events', within_months=6, date_field='event_date', event_type='physdmg_fault_determination',
        driver_id=da_driver, fault_determination='insured_at_fault')
    - da_loss_paid: >-
        XSUM('physdmg', 'physdmg_payments', 'amount', event_type='physdmg_claim_payment', claim_number=da_fault_claim)
    - da_load_pct: >-
        P('at_fault_accident_surcharge_pct') if (da_at_fault_losses > 0 and da_loss_paid >= P('at_fault_surcharge_min_paid'))
        else (P('at_fault_accident_surcharge_pct') * K('pending_share') if (da_at_fault_losses > 0 and da_loss_paid
        == 0) else 0)
    - da_tenure_months: MONTHS(F('inception_date'), NOW)
    - da_lapse_marker: F('cancellation_effective_date')
    - da_loyalty_pct: >-
        K('loyalty_long_pct') if da_tenure_months >= K('long_tenure_months') else (K('loyalty_mid_pct') if da_tenure_months
        >= K('mid_tenure_months') else 0)
    - da_continuity: >-
        1 if da_lapse_marker == '' else (K('lapse_old_share') if MONTHS(da_lapse_marker, NOW) >= K('lapse_old_months')
        else 0)
    - result: >-
        RND(da_charge * da_operator_share * (1 + da_load_pct / 100) * (1 - da_loyalty_pct * da_continuity / 100) *
        da_charged_days / da_term_days, 2)
    compute_basis:
      da_term_start: >-
        The days of the addition's term are counted in calendar days from the term effective date to the term expiration
        date of the term the addition falls in.
      da_term_end: >-
        The days of the addition's term are counted in calendar days from the term effective date to the term expiration
        date of the term the addition falls in.
      da_term_days: >-
        The days of the addition's term are counted in calendar days from the term effective date to the term expiration
        date of the term the addition falls in.
      da_addition: >-
        A driver addition recorded on the auto policy is charged by one additional premium entry tied to that addition,
        carrying the driver addition charge for the term.
      da_driver: >-
        A driver addition recorded on the auto policy is charged by one additional premium entry tied to that addition,
        carrying the driver addition charge for the term.
      da_charge: >-
        The full-term charge of an addition is the full-term premium after the addition less the full-term premium
        before it, both as recorded on the addition entry.
      da_effective: >-
        The charged days of a driver addition start from a date set as follows: where the addition took effect before
        the current term began, from the term expiration date, so that nothing is charged, the driver being carried
        in the term premium already written; where the driver addition was recorded no more calendar days after its
        effective date (the day the member became licensed or moved in) than the package's household driver report
        days, from that effective date, the member having been reported in time; otherwise, from the date it was recorded,
        the day the household member was reported.
      da_recorded: >-
        The charged days of a driver addition start from a date set as follows: where the addition took effect before
        the current term began, from the term expiration date, so that nothing is charged, the driver being carried
        in the term premium already written; where the driver addition was recorded no more calendar days after its
        effective date (the day the member became licensed or moved in) than the package's household driver report
        days, from that effective date, the member having been reported in time; otherwise, from the date it was recorded,
        the day the household member was reported.
      da_charge_from: >-
        The charged days of a driver addition start from a date set as follows: where the addition took effect before
        the current term began, from the term expiration date, so that nothing is charged, the driver being carried
        in the term premium already written; where the driver addition was recorded no more calendar days after its
        effective date (the day the member became licensed or moved in) than the package's household driver report
        days, from that effective date, the member having been reported in time; otherwise, from the date it was recorded,
        the day the household member was reported.
      da_drivers: >-
        The operator share follows how the household's rated drivers compare with its scheduled vehicles once the
        driver is added, counting the drivers added less those excluded or removed and the vehicles added less those
        removed: more rated drivers than vehicles, 60 percent, the added driver being rated as an occasional operator;
        as many rated drivers as vehicles, 85 percent, the added driver sharing a vehicle as one of its principal
        operators; fewer rated drivers than vehicles, one.
      da_vehicles: >-
        The operator share follows how the household's rated drivers compare with its scheduled vehicles once the
        driver is added, counting the drivers added less those excluded or removed and the vehicles added less those
        removed: more rated drivers than vehicles, 60 percent, the added driver being rated as an occasional operator;
        as many rated drivers as vehicles, 85 percent, the added driver sharing a vehicle as one of its principal
        operators; fewer rated drivers than vehicles, one.
      da_operator_share: >-
        The operator share follows how the household's rated drivers compare with its scheduled vehicles once the
        driver is added, counting the drivers added less those excluded or removed and the vehicles added less those
        removed: more rated drivers than vehicles, 60 percent, the added driver being rated as an occasional operator;
        as many rated drivers as vehicles, 85 percent, the added driver sharing a vehicle as one of its principal
        operators; fewer rated drivers than vehicles, one.
      da_fault_claim: >-
        The loss load percentage follows the physical damage losses of the last six months at which the added driver
        was found at fault: where such a loss has payments on its claim reaching the package's at-fault surcharge
        minimum paid, the package's at-fault accident surcharge percentage; where such a loss has no payment yet,
        half that percentage; otherwise, nil.
      da_at_fault_losses: >-
        The loss load percentage follows the physical damage losses of the last six months at which the added driver
        was found at fault: where such a loss has payments on its claim reaching the package's at-fault surcharge
        minimum paid, the package's at-fault accident surcharge percentage; where such a loss has no payment yet,
        half that percentage; otherwise, nil.
      da_loss_paid: >-
        The loss load percentage follows the physical damage losses of the last six months at which the added driver
        was found at fault: where such a loss has payments on its claim reaching the package's at-fault surcharge
        minimum paid, the package's at-fault accident surcharge percentage; where such a loss has no payment yet,
        half that percentage; otherwise, nil.
      da_load_pct: >-
        The loss load percentage follows the physical damage losses of the last six months at which the added driver
        was found at fault: where such a loss has payments on its claim reaching the package's at-fault surcharge
        minimum paid, the package's at-fault accident surcharge percentage; where such a loss has no payment yet,
        half that percentage; otherwise, nil.
      da_tenure_months: >-
        The loyalty credit percentage of a driver addition follows the named insured's Cardinal tenure, in whole months
        from the policy's original inception date to the day the charge is booked: 60 months or more, 10 percent;
        36 months or more but under 60, 5 percent; under 36 months, nil. The continuous-coverage share of the loyalty
        credit follows the lapse marker on the policy record (a cancellation effective date kept on a reinstated policy
        marks a lapse in coverage): with no lapse marker, the whole credit; with a lapse marker dated 36 months or
        more before the day the charge is booked, half of it; with a lapse marker dated less than 36 months before
        that day, none of it.
      da_lapse_marker: >-
        The loyalty credit percentage of a driver addition follows the named insured's Cardinal tenure, in whole months
        from the policy's original inception date to the day the charge is booked: 60 months or more, 10 percent;
        36 months or more but under 60, 5 percent; under 36 months, nil. The continuous-coverage share of the loyalty
        credit follows the lapse marker on the policy record (a cancellation effective date kept on a reinstated policy
        marks a lapse in coverage): with no lapse marker, the whole credit; with a lapse marker dated 36 months or
        more before the day the charge is booked, half of it; with a lapse marker dated less than 36 months before
        that day, none of it.
      da_loyalty_pct: >-
        The loyalty credit percentage of a driver addition follows the named insured's Cardinal tenure, in whole months
        from the policy's original inception date to the day the charge is booked: 60 months or more, 10 percent;
        36 months or more but under 60, 5 percent; under 36 months, nil. The continuous-coverage share of the loyalty
        credit follows the lapse marker on the policy record (a cancellation effective date kept on a reinstated policy
        marks a lapse in coverage): with no lapse marker, the whole credit; with a lapse marker dated 36 months or
        more before the day the charge is booked, half of it; with a lapse marker dated less than 36 months before
        that day, none of it.
      result: >-
        The driver addition charge is the full-term charge of the addition times the operator share, then times one
        plus the loss load percentage divided by 100, then times one less the loyalty credit percentage times its
        continuous-coverage share divided by 100, then times the charged days divided by the days of the addition's
        term; the product is rounded to the cent (half up) once, at the end, with no intermediate rounding.
      da_charged_days: >-
        The charged days of a driver addition are the calendar days from the date the driver addition was recorded
        to the term expiration date.
      da_continuity: >-
        The loyalty credit percentage of a driver addition follows the named insured's Cardinal tenure, in whole months
        from the policy's original inception date to the day the charge is booked: 60 months or more, 10 percent;
        36 months or more but under 60, 5 percent; under 36 months, nil. The continuous-coverage share of the loyalty
        credit follows the lapse marker on the policy record (a cancellation effective date kept on a reinstated policy
        marks a lapse in coverage): with no lapse marker, the whole credit; with a lapse marker dated 36 months or
        more before the day the charge is booked, half of it; with a lapse marker dated less than 36 months before
        that day, none of it.
    factors:
    - id: late_report_start
      effect: method
      decides: da_charge_from
      bindings:
      - da_effective
      - da_recorded
      - da_charge_from
      ladder:
      - when: the addition took effect before the current term began
        method: >-
          the charged days start from the term expiration date: nothing is charged, the driver being carried in the
          term premium already written
      - when: >-
          the driver addition was recorded no more calendar days after its effective date than the package's household
          driver report days
        method: the charged days start from the addition's effective date
      - when: otherwise
        method: the charged days start from the date the addition was recorded
      baseline:
        da_charge_from: da_recorded
      evidence:
      - history
      - date
      - tier_param
      cross_difficulty: null
    - id: operator_assignment
      effect: parameter
      decides: da_operator_share
      bindings:
      - da_drivers
      - da_vehicles
      - da_operator_share
      ladder:
      - when: more rated drivers than scheduled vehicles once the driver is added
        value: K('occasional_share') = 60 percent (occasional operator)
      - when: as many rated drivers as scheduled vehicles
        value: K('shared_share') = 85 percent (principal operator of a shared vehicle)
      - when: otherwise (fewer rated drivers than vehicles)
        value: one
      baseline:
        da_operator_share: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: at_fault_loss_load
      effect: parameter
      decides: da_load_pct
      bindings:
      - da_fault_claim
      - da_at_fault_losses
      - da_loss_paid
      - da_load_pct
      ladder:
      - when: >-
          the added driver was found at fault at a physical damage loss in the last six months and the payments on
          that claim reach the package's at-fault surcharge minimum paid
        value: the package's at-fault accident surcharge percentage
      - when: the added driver was found at fault at such a loss and its claim has no payment yet
        value: K('pending_share') = half that percentage
      - when: otherwise
        value: nil
      baseline:
        da_load_pct: '0'
      evidence:
      - history
      - cross_category
      cross_difficulty: physdmg
    - id: tenure_loyalty_credit
      effect: parameter
      decides: da_loyalty_pct
      bindings:
      - da_tenure_months
      - da_loyalty_pct
      ladder:
      - when: Cardinal tenure of 60 months or more
        value: K('loyalty_long_pct') = 10 percent
      - when: Cardinal tenure of 36 months or more but under 60
        value: K('loyalty_mid_pct') = 5 percent
      - when: otherwise (under 36 months)
        value: nil
      baseline:
        da_loyalty_pct: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: continuous_coverage_share
      effect: parameter
      decides: da_continuity
      bindings:
      - da_lapse_marker
      - da_continuity
      ladder:
      - when: no lapse marker on the policy record
        value: 'one: the whole loyalty credit'
      - when: a lapse marker dated 36 months or more before the day the charge is booked
        value: K('lapse_old_share') = half the loyalty credit
      - when: otherwise (a lapse marker dated less than 36 months before that day)
        value: 'nil: none of the loyalty credit'
      baseline:
        da_continuity: '0'
      evidence:
      - date
      cross_difficulty: null
    baseline:
      rule: >-
        The driver addition charge is the full-term charge of the addition times the operator share, then times one
        plus the loss load percentage divided by 100, then times one less the loyalty credit percentage times its
        continuous-coverage share divided by 100, then times the charged days divided by the days of the addition's
        term; the product is rounded to the cent (half up) once, at the end, with no intermediate rounding. The full-term
        charge of an addition is the full-term premium after the addition less the full-term premium before it, both
        as recorded on the addition entry. The days of the addition's term are counted in calendar days from the term
        effective date to the term expiration date of the term the addition falls in. The charged days of a driver
        addition are the calendar days from the date the driver addition was recorded to the term expiration date.
