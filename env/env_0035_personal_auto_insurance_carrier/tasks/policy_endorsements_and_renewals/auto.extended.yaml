      note: >-
        The pay plan decides the plan discount taken back; autopay enrollment with returned payments decides the cancellation
        charge.
    compute:
    - cx_term_start: F('term_effective_date')
    - cx_term_end: F('term_expiration_date')
    - cx_term_days: DAYS(cx_term_start, cx_term_end)
    - cx_request_date: >-
        LATEST('auto_change_requests', 'requested_effective_date', date_field='created_at', request_type='insured_cancellation',
        request_status='awaiting_signature')
    - cx_cancel_date: >-
        cx_term_end if cx_request_date > cx_term_end else (NOW if cx_request_date < NOW else cx_request_date)
    - cx_open_loans: >-
        COUNT('auto_transactions', event_type='auto_lienholder_change', reason_code='new_loan') - COUNT('auto_transactions',
        event_type='auto_lienholder_change', reason_code='loan_paid_off')
    - cx_payoff_date: >-
        LATEST('auto_transactions', 'effective_date', date_field='effective_date', event_type='auto_lienholder_change',
        reason_code='loan_paid_off')
    - cx_notice_days: >-
        K('notice_days') if cx_open_loans > 0 else (MN(K('notice_days'), DAYS(cx_cancel_date, cx_payoff_date)) if
        (cx_payoff_date != '' and cx_payoff_date > cx_cancel_date) else 0)
    - cx_refund_days: MX(0, DAYS(cx_cancel_date, cx_term_end) - cx_notice_days)
    - cx_written: >-
        SUM('auto_transactions', 'premium_amount', event_type='auto_term_premium_written', term_effective_date=cx_term_start)
        + SUM('auto_transactions', 'premium_amount', event_type='auto_additional_premium', term_effective_date=cx_term_start)
        - SUM('auto_transactions', 'premium_amount', event_type='auto_return_premium', term_effective_date=cx_term_start)
    - cx_options: >-
        (SUM('auto_transactions', 'full_term_premium_after', event_type='auto_coverage_change', reason_code='coverage_added')
        - SUM('auto_transactions', 'full_term_premium_before', event_type='auto_coverage_change', reason_code='coverage_added'))
        - (SUM('auto_transactions', 'full_term_premium_before', event_type='auto_coverage_change', reason_code='coverage_removed')
        - SUM('auto_transactions', 'full_term_premium_after', event_type='auto_coverage_change', reason_code='coverage_removed'))
    - cx_tenure_months: MONTHS(F('inception_date'), cx_cancel_date)
    - cx_lapse_marker: F('cancellation_effective_date')
    - cx_return_share: >-
        K('share_long_tenure') if (cx_tenure_months >= K('long_tenure_months') and cx_lapse_marker == '') else (K('share_mid_tenure')
        if (cx_tenure_months >= K('mid_tenure_months') and cx_tenure_months < K('long_tenure_months') and cx_lapse_marker
        == '') else K('share_short_rate'))
    - cx_prorated: ((cx_written - cx_options) * cx_return_share + cx_options) * cx_refund_days / cx_term_days
    - cx_plan_name: CFIELD('billing', 'variant_name', policy_id=HID)
    - cx_plan_discount: CPARAM('billing', 'pay_plan_discount_pct', policy_id=HID)
    - cx_takeback_pct: >-
        cx_plan_discount if cx_plan_name == 'Cardinal Paid-in-Full Plan' else (cx_plan_discount * K('installment_takeback_share')
        if cx_plan_discount > 0 else 0)
    - cx_disposed: >-
        (COUNT('auto_transactions', event_type='auto_vehicle_add') - COUNT('auto_transactions', event_type='auto_vehicle_remove')
        <= 0) and (COUNT('auto_transactions', event_type='auto_vehicle_remove', reason_code='vehicle_sold') + COUNT('auto_transactions',
        event_type='auto_vehicle_remove', reason_code='vehicle_total_loss') >= COUNT('auto_transactions', event_type='auto_vehicle_remove'))
    - cx_autopay: CFIELD('billing', 'autopay_enrolled', policy_id=HID)
    - cx_returned_payments: >-
        XCOUNT('billing', 'billing_ledger', within_months=12, date_field='posted_date', event_type='billing_payment_returned')
    - cx_charge: >-
        0 if cx_disposed else (K('waived_charge') if (cx_autopay == True and cx_returned_payments == 0) else (P('cancellation_fee')
        * K('reduced_charge_share') if (cx_autopay == False and cx_returned_payments == 0) else P('cancellation_fee')))
    - cx_min_earned: 0 if cx_disposed else P('minimum_earned_premium')
    - result: >-
        RND(MX(0, MN(cx_prorated * (1 - cx_takeback_pct / 100) - cx_charge, cx_written - cx_min_earned)), 2)
