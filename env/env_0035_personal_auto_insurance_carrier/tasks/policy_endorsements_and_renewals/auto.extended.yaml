      ex_charge: >-
        The full-term charge of the excluded driver is the full-term premium after that driver's addition less the
        full-term premium before it, as recorded on the addition entry.
      ex_written: >-
        The credit base follows how the excluded driver was charged during the term: where the driver's addition carries
        an additional premium entry of the current term, the charge written on that entry times the credit days divided
        by the days that charge was written for, the unearned share of what was actually charged; the days that charge
        was written for are the calendar days to the term expiration date from the addition's effective date where
        the addition was recorded no more calendar days after that effective date than the package's household driver
        report days, and from the date the addition was recorded otherwise; where the driver was added during the
        term with a premium effect but no additional premium entry was written, nothing was charged and the credit
        base is nil; otherwise, the full-term charge of the excluded driver times the credit days divided by the days
        of the exclusion's term.
      ex_add_effect: >-
        The credit base follows how the excluded driver was charged during the term: where the driver's addition carries
        an additional premium entry of the current term, the charge written on that entry times the credit days divided
        by the days that charge was written for, the unearned share of what was actually charged; the days that charge
        was written for are the calendar days to the term expiration date from the addition's effective date where
        the addition was recorded no more calendar days after that effective date than the package's household driver
        report days, and from the date the addition was recorded otherwise; where the driver was added during the
        term with a premium effect but no additional premium entry was written, nothing was charged and the credit
        base is nil; otherwise, the full-term charge of the excluded driver times the credit days divided by the days
        of the exclusion's term.
      ex_credit_base: >-
        The credit base follows how the excluded driver was charged during the term: where the driver's addition carries
        an additional premium entry of the current term, the charge written on that entry times the credit days divided
        by the days that charge was written for, the unearned share of what was actually charged; the days that charge
        was written for are the calendar days to the term expiration date from the addition's effective date where
        the addition was recorded no more calendar days after that effective date than the package's household driver
        report days, and from the date the addition was recorded otherwise; where the driver was added during the
        term with a premium effect but no additional premium entry was written, nothing was charged and the credit
        base is nil; otherwise, the full-term charge of the excluded driver times the credit days divided by the days
        of the exclusion's term.
      ex_rated_days: >-
        The retention share follows how long the excluded driver was rated, counted in calendar days from the effective
        date of that driver's addition to the day the form is signed: fewer than 90 days, three quarters; 90 days
        or more but fewer than 180, nine tenths; 180 days or more, one.
      ex_retention: >-
        The retention share follows how long the excluded driver was rated, counted in calendar days from the effective
        date of that driver's addition to the day the form is signed: fewer than 90 days, three quarters; 90 days
        or more but fewer than 180, nine tenths; 180 days or more, one.
      ex_fault_claim: >-
        The loss share follows the physical damage losses of the last six months at which the excluded driver was
        found at fault: where such a loss has payments on its claim reaching the package's at-fault surcharge minimum
        paid, one half; where such a loss has no payment yet, three quarters; otherwise, one.
      ex_at_fault_losses: >-
        The loss share follows the physical damage losses of the last six months at which the excluded driver was
        found at fault: where such a loss has payments on its claim reaching the package's at-fault surcharge minimum
        paid, one half; where such a loss has no payment yet, three quarters; otherwise, one.
      ex_loss_paid: >-
        The loss share follows the physical damage losses of the last six months at which the excluded driver was
        found at fault: where such a loss has payments on its claim reaching the package's at-fault surcharge minimum
        paid, one half; where such a loss has no payment yet, three quarters; otherwise, one.
      ex_loss_share: >-
        The loss share follows the physical damage losses of the last six months at which the excluded driver was
        found at fault: where such a loss has payments on its claim reaching the package's at-fault surcharge minimum
        paid, one half; where such a loss has no payment yet, three quarters; otherwise, one.
      result: >-
        The exclusion credit is the credit base times the retention share, then times the loss share, rounded to the
        cent (half up) once, at the end, with no intermediate rounding.
      ex_add_recorded: >-
        The credit base follows how the excluded driver was charged during the term: where the driver's addition carries
        an additional premium entry of the current term, the charge written on that entry times the credit days divided
        by the days that charge was written for, the unearned share of what was actually charged; the days that charge
        was written for are the calendar days to the term expiration date from the addition's effective date where
        the addition was recorded no more calendar days after that effective date than the package's household driver
        report days, and from the date the addition was recorded otherwise; where the driver was added during the
        term with a premium effect but no additional premium entry was written, nothing was charged and the credit
        base is nil; otherwise, the full-term charge of the excluded driver times the credit days divided by the days
        of the exclusion's term.
      ex_charged_from: >-
        The credit base follows how the excluded driver was charged during the term: where the driver's addition carries
        an additional premium entry of the current term, the charge written on that entry times the credit days divided
        by the days that charge was written for, the unearned share of what was actually charged; the days that charge
        was written for are the calendar days to the term expiration date from the addition's effective date where
        the addition was recorded no more calendar days after that effective date than the package's household driver
        report days, and from the date the addition was recorded otherwise; where the driver was added during the
        term with a premium effect but no additional premium entry was written, nothing was charged and the credit
        base is nil; otherwise, the full-term charge of the excluded driver times the credit days divided by the days
        of the exclusion's term.
    factors:
    - id: exclusion_credit_basis
      effect: method
      decides: ex_credit_base
      bindings:
      - ex_add_effect
      - ex_charged_from
      - ex_credit_base
      ladder:
      - when: the excluded driver's addition carries an additional premium entry of the current term
        method: >-
          unearned share of the charge written: that entry's charge times the credit days divided by the days the
          charge was written for (to the term expiration date from the addition's effective date, or from its recorded
          date where it was reported after the package's household driver report days)
      - when: >-
          the driver was added during the term with a premium effect but no additional premium entry was written
        method: 'nothing was charged: the credit base is nil'
      - when: otherwise
        method: 'the full-term charge prorated: charge times credit days divided by the days of the term'
      baseline:
        ex_credit_base: ex_charge * ex_credit_days / ex_term_days
      evidence:
      - history
      cross_difficulty: null
    - id: signature_start
      effect: method
      decides: ex_credit_from
      bindings:
      - ex_form_date
      - ex_credit_from
      ladder:
      - when: the date written on the form is after the term expiration date
        method: the exclusion takes effect on the term expiration date (no day credited)
      - when: the date written on the form is earlier than the day the form is signed
        method: the exclusion takes effect on the signing day
      - when: otherwise
        method: the exclusion takes effect on the date written on the form
      baseline:
        ex_credit_from: ex_form_date
      evidence:
      - date
      - history
      cross_difficulty: null
    - id: rated_period_retention
      effect: parameter
      decides: ex_retention
      bindings:
      - ex_rated_days
      - ex_retention
      ladder:
      - when: the excluded driver was rated fewer than 90 days before the form is signed
        value: K('retention_short') = three quarters
      - when: rated 90 days or more but fewer than 180
        value: K('retention_mid') = nine tenths
      - when: otherwise
        value: one
      baseline:
        ex_retention: '1'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: at_fault_loss_share
      effect: parameter
      decides: ex_loss_share
      bindings:
      - ex_fault_claim
      - ex_at_fault_losses
      - ex_loss_paid
      - ex_loss_share
      ladder:
      - when: >-
          the excluded driver was found at fault at a physical damage loss in the last six months and the payments
          on that claim reach the package's at-fault surcharge minimum paid
        value: K('loss_share_paid') = one half
      - when: the excluded driver was found at fault at such a loss and its claim has no payment yet
        value: K('loss_share_pending') = three quarters
      - when: otherwise
        value: one
      baseline:
        ex_loss_share: '1'
      evidence:
      - history
      - cross_category
      cross_difficulty: physdmg
    baseline:
      rule: >-
        The exclusion credit is the credit base times the retention share, then times the loss share, rounded to the
        cent (half up) once, at the end, with no intermediate rounding. The full-term charge of the excluded driver
        is the full-term premium after that driver's addition less the full-term premium before it, as recorded on
        the addition entry. The days of the exclusion's term are counted in calendar days from the term effective
        date to the term expiration date of the term the exclusion falls in, and the credit days run from the exclusion's
        effective date to the term expiration date. The credit base is the full-term charge of the excluded driver
        times the credit days divided by the days of the exclusion's term. The exclusion's effective date is the effective
        date written on the named driver exclusion form. For an exclusion credit the retention share and the loss
        share are each one.
      params: []
    inputs:
      history:
      - table: auto_transactions
        aggregate: sum
        field: premium_amount
        filters:
          event_type: auto_additional_premium
          source: the excluded driver's addition
      - table: auto_change_requests
        aggregate: latest
        field: requested_effective_date
        filters:
          request_type: named_driver_exclusion
          request_status: awaiting_signature
      - category: physdmg
        table: physdmg_claim_events
        aggregate: count
        field: claim_event_id
        within_months: 6
        filters:
          event_type: physdmg_fault_determination
          fault_determination: insured_at_fault
      cross_category:
      - physdmg
