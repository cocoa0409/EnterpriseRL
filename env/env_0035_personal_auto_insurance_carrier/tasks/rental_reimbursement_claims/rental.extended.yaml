events:
  # ---- holding writes (rental_coverages) ----------------------------------------------------
  - type: rental_coverage_add
    target: rental_coverages
    mutation: create
    meaning: A rental reimbursement option is attached to a vehicle that carries physical damage.
    grain: One row per vehicle option.
    fields:
      rental_coverage_id: Rental reimbursement coverage reference.
      customer_id: Named insured.
      policy_id: Policy the vehicle is scheduled on.
      vehicle_id: Vehicle covered.
      coverage_id: Physical damage coverage of the same vehicle.
      variant_name: Option chosen.
      effective_date: Date the option takes effect.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: rental_coverage_id, effective_date: effective_date, reason_code: coverage_added}
  - type: rental_coverage_suspend
    target: rental_coverages
    mutation: {transition: {from: active, to: suspended}}
    meaning: The option is suspended because the vehicle's physical damage went into storage.
    grain: One row per transaction.
    fields:
      status: Set to suspended.
      coverage_id: Physical damage coverage that went into storage.
    triggers: []
  - type: rental_coverage_resume
    target: rental_coverages
    mutation: {transition: {from: suspended, to: active}}
    meaning: The option resumes because the vehicle left storage.
    grain: One row per transaction.
    fields:
      status: Set to active.
      coverage_id: Physical damage coverage that left storage.
    triggers: []
  - type: rental_coverage_remove
    target: rental_coverages
    mutation:
      transition:
        - {from: active, to: removed}
        - {from: suspended, to: removed}
    meaning: The option is removed from the vehicle.
    grain: One row per transaction.
    fields:
      status: Set to removed.
      end_date: Date the option ends.
      coverage_id: Physical damage coverage of the same vehicle.
      rental_coverage_id: Option removed.
      policy_id: Policy concerned.
      customer_id: Named insured.
      vehicle_id: Vehicle concerned.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: rental_coverage_id, effective_date: end_date, reason_code: coverage_removed}
  - type: rental_option_change
    target: rental_coverages
    mutation: update
    meaning: The rental reimbursement option on the vehicle is raised or lowered.
    grain: One row per transaction.
    fields:
      variant_name: New option.
      option_change_effective_date: Date the new option takes effect.
      rental_coverage_id: Option changed.
      policy_id: Policy concerned.
      customer_id: Named insured.
      vehicle_id: Vehicle concerned.
    triggers:
      - event: auto:auto_coverage_change
        map: {policy_id: policy_id, customer_id: customer_id, vehicle_id: vehicle_id, source_transaction_id: rental_coverage_id, effective_date: option_change_effective_date, reason_code: option_change}
  # ---- event-table writes (rental_ledger) ---------------------------------------------------
  - type: rental_authorization
    target: rental_ledger
    meaning: A rental is authorized on a physical damage claim, either reserved by Cardinal with a partner agency or arranged by the customer for reimbursement.
    grain: One row per rental authorization.
    distinguish_by: [authorization_number]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option the rental is paid under.
      customer_id: Named insured.
      claim_number: Physical damage claim of the vehicle.
      authorization_number: Rental authorization number.
      vendor_type: Partner agency under direct billing, another agency, or rideshare / taxi / transit.
      vehicle_class: Car class authorized.
      start_date: First rental day.
      authorized_days: Days authorized.
      daily_rate: Agency daily rate, taxes and fees included, USD.
      entry_date: Date authorized.
    triggers: []
  - type: rental_extension
    target: rental_ledger
    meaning: Additional days are authorized on a running rental.
    grain: One row per extension of an authorization.
    distinguish_by: [authorization_number, extension_sequence]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option.
      customer_id: Named insured.
      claim_number: Claim.
      authorization_number: Authorization extended.
      extension_sequence: 1 for the first extension, then 2, 3, ...
      authorized_days: Days added.
      extension_reason: Why the extension was granted.
      entry_date: Date extended.
    triggers: []
  - type: rental_authorization_closed
    target: rental_ledger
    meaning: A rental authorization ends and its last covered day is fixed.
    grain: One row per authorization closed.
    distinguish_by: [authorization_number]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option.
      customer_id: Named insured.
      claim_number: Claim.
      authorization_number: Authorization closed.
      end_date: Last covered rental day.
      close_reason: Why the rental ended.
      entry_date: Date closed.
    triggers: []
  - type: rental_liability_transfer
    target: rental_ledger
    meaning: The at-fault party's insurer accepts liability and takes over the rental under its own claim.
    grain: One row per authorization transferred.
    distinguish_by: [authorization_number]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option.
      customer_id: Named insured.
      claim_number: Claim.
      authorization_number: Authorization transferred.
      other_carrier_claim_number: The other insurer's claim number exactly as given by that insurer.
      transfer_date: Day the other insurer's coverage of the rental begins.
      entry_date: Date recorded.
    triggers:
      - event: rental:rental_authorization_closed
        map: {rental_coverage_id: rental_coverage_id, customer_id: customer_id, claim_number: claim_number, authorization_number: authorization_number, close_reason: liability_transferred}
  - type: rental_vendor_payment
    target: rental_ledger
    meaning: A partner agency's direct-bill invoice is paid for the covered part of a rental.
    grain: One row per agency invoice.
    distinguish_by: [invoice_number]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option.
      customer_id: Named insured.
      claim_number: Claim.
      authorization_number: Authorization invoiced.
      invoice_number: Agency invoice number exactly as printed.
      days_billed: Rental days on the invoice.
      daily_rate: Daily rate billed, taxes and fees included, USD.
      amount: Amount paid by Cardinal, USD.
      customer_responsibility_amount: Part of the invoice left for the customer to pay the agency, USD.
      entry_date: Date paid.
    account: rental_benefit_paid
    direction: in
    triggers: []
  - type: rental_reimbursement_payment
    target: rental_ledger
    meaning: The customer is reimbursed for a rental or for rideshare, taxi or transit fares they paid themselves.
    grain: One row per receipt submission reimbursed.
    distinguish_by: [claim_number, receipt_reference]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option.
      customer_id: Named insured.
      claim_number: Claim.
      authorization_number: Authorization the costs fall under.
      receipt_reference: Receipt or invoice number of the submission exactly as printed.
      vendor_type: Another agency, or rideshare / taxi / transit.
      days_billed: Days covered by the submission.
      amount: Amount reimbursed, USD.
      customer_responsibility_amount: Part of the submitted costs not reimbursed, USD.
      entry_date: Date paid.
    account: rental_benefit_paid
    direction: in
    triggers: []
  - type: rental_payment_recovery
    target: rental_ledger
    meaning: Rental money is recovered, from the at-fault party's insurer through subrogation or as an agency invoice credit.
    grain: One row per recovery against one payment.
    distinguish_by: [source_entry_id, recovery_source]
    fields:
      rental_entry_id: Ledger entry reference.
      rental_coverage_id: Option.
      customer_id: Named insured.
      claim_number: Claim.
      source_entry_id: The vendor or reimbursement payment recovered against.
      recovery_source: subrogation or vendor_credit.
      amount: Amount recovered, USD.
      entry_date: Date received.
    account: rental_benefit_paid
    direction: out
    triggers: []

measures:
  - id: rental_msr_benefit_used
    window: One loss of one vehicle (one claim number).
    measure: Sum of rental_vendor_payment and rental_reimbursement_payment amounts on the claim number less rental_payment_recovery amounts with recovery_source vendor_credit (subrogation recoveries do not restore the benefit).
  - id: rental_msr_days_used
    window: One loss of one vehicle (one claim number).
    measure: Sum of days_billed over rental_vendor_payment and rental_reimbursement_payment rows on the claim number.
  - id: rental_msr_days_authorized
    window: One authorization.
    measure: authorized_days of the rental_authorization row plus authorized_days of every rental_extension row of the authorization.

policies:
  - id: rental_agg_multi_holding
    subject: [rental_coverage_add]
    rule: >-
      Rental reimbursement is held per vehicle: a vehicle carries at most one option at a time, and a customer may hold
      one for every vehicle that carries physical damage, with no cap of its own. An option can be added to a vehicle only
      when no option on that vehicle is active or suspended.
    eligibility:
      - id: one_option_per_vehicle
        applies_to: [rental_coverage_add]
        kind: dedup
        condition: "An option can be added to a vehicle only when no option on that vehicle is active or suspended."
        evidence_fields: [rental_coverages.vehicle_id, rental_coverages.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_coverages.vehicle_id]
          action_bindings:
            rental_coverages.vehicle_id: vehicle_id
        dedup_contract:
          table: rental_coverages
          mode: separate_record
          object_bindings: {vehicle_id: vehicle_id}
          duplicate_filters: {status: [active, suspended]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: rental_agg_per_loss_benefit
    subject: [rental_vendor_payment, rental_reimbursement_payment, rental_authorization]
    rule: >-
      The rental limits apply per vehicle per loss: each damaged vehicle's claim uses that vehicle's own option, and when
      two vehicles of the household are damaged in one occurrence each has its own daily limit, per-loss maximum and
      maximum days, never pooled or transferred. Every payment on a claim, whether to an agency or to the customer and
      whether for a rental car or for rideshare, taxi or transit, draws on the same per-loss maximum (rental_msr_benefit_used)
      and the same maximum days (rental_msr_days_used). Only max_concurrent_rentals_per_loss rental may run at a time on
      one claim. A new loss starts a fresh per-loss benefit; the benefit is never annual.
    eligibility: []
    measures: [rental_msr_benefit_used, rental_msr_days_used]

  - id: rental_attach_eligibility
    subject: [rental_coverage_add, rental_option_change, rental_coverage_remove, rental_coverage_suspend, rental_coverage_resume]
    rule: >-
      An option can be attached only to a vehicle whose physical damage is pending_inspection or active, and only at a
      rank no higher than the auto package's rental_max_option_rank; a package with rental_max_option_rank 0 allows no
      option. Rental reimbursement is added only while the vehicle's physical damage is pending_inspection or active. The
      auto policy status must be bound or in_force when the option is added or changed. The option's full-term premium is
      premium_per_six_months for a six-month term and premium_per_six_months times premium_twelve_month_multiplier for a
      twelve-month term; it is a flat add-on on the auto policy, prorated for the rest of the term when the option is
      added, changed or removed, and returned on cancellation_premium_basis. An option change takes effect today or a
      later date the customer chooses and applies only to losses on or after its effective date; a rental on a loss
      before the change stays under the option in force on the loss date. The option is suspended while the vehicle's
      physical damage is in storage and resumes when storage ends; it is removed when physical damage is removed, when the
      vehicle is removed, or when a package change lowers rental_max_option_rank below the option's rank and the customer
      does not choose a lower option.
    eligibility:
      - id: physdmg_on_vehicle
        applies_to: [rental_coverage_add]
        kind: state
        condition: "Rental reimbursement is added only while the vehicle's physical damage is pending_inspection or active."
        evidence_fields: [physdmg_coverages.status, physdmg_coverages.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_coverages.coverage_id]
          action_bindings:
            physdmg_coverages.coverage_id: coverage_id
        state_contract:
          field: physdmg_coverages.status
          allowed: [pending_inspection, active]
      - id: auto_policy_open_for_option
        applies_to: [rental_coverage_add, rental_option_change]
        kind: state
        condition: "The auto policy status must be bound or in_force when the option is added or changed."
        evidence_fields: [auto_policies.status, auto_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_policies.policy_id]
          action_bindings:
            auto_policies.policy_id: policy_id
        state_contract:
          field: auto_policies.status
          allowed: [bound, in_force]
    formula:
      option_full_term_premium: premium_per_six_months * premium_twelve_month_multiplier

  - id: rental_evt_authorization
    subject: [rental_authorization]
    rule: >-
      A rental is authorized only on a reported physical damage claim of the vehicle that carries the option, for a loss
      on or after the option's effective date while the option was active. A rental is authorized only when the latest
      coverage decision on the physical damage claim is accepted. The option status must be active when the rental is
      authorized. For a vehicle that can still be driven, the rental starts on the day the vehicle is dropped at the shop
      for the covered repair; for a vehicle that cannot be driven, it may start on the day the loss was reported. For a
      total theft, a rental may start no earlier than theft_waiting_days calendar days after the theft was reported. The
      days count from the report_date on the theft claim, the report date being day 0, so with a waiting period of 1 the
      rental can start on the day after the report. The first authorization covers initial_authorization_days or the
      shop's estimated repair days if fewer, never more than the days left under max_days_per_loss. With direct billing
      Cardinal reserves a direct_bill_vehicle_class car at the partner agency; the customer may take a larger car and pay
      the difference. Before pickup the customer is told which charges will be theirs. No rental is authorized under this
      option after the at-fault party's insurer has accepted liability for the rental, and no rental is authorized once
      the per-loss maximum or the maximum days are used up.
    eligibility:
      - id: claim_accepted_for_rental
        applies_to: [rental_authorization]
        kind: state
        condition: "A rental is authorized only when the latest coverage decision on the physical damage claim is accepted."
        evidence_fields: [physdmg_claim_events.coverage_decision, physdmg_claim_events.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_claim_events.claim_number]
          action_bindings:
            physdmg_claim_events.claim_number: claim_number
        state_contract:
          field: physdmg_claim_events.coverage_decision
          allowed: [accepted]
      - id: option_active_for_rental
        applies_to: [rental_authorization]
        kind: state
        condition: "The option status must be active when the rental is authorized."
        evidence_fields: [rental_coverages.status, rental_coverages.rental_coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_coverages.rental_coverage_id]
          action_bindings:
            rental_coverages.rental_coverage_id: rental_coverage_id
        state_contract:
          field: rental_coverages.status
          allowed: [active]
      - id: theft_waiting_period
        applies_to: [rental_authorization]
        kind: time
        condition: "For a total theft, a rental may start no earlier than theft_waiting_days calendar days after the theft was reported."
        evidence_fields: [physdmg_claim_events.report_date, physdmg_claim_events.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [physdmg_claim_events.claim_number]
          action_bindings:
            physdmg_claim_events.claim_number: claim_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the theft was reported
          anchor_source: physdmg_claim_events.report_date
          relation: not_before
          duration_source: variants.theft_waiting_days
          unit: calendar_days
          counting_rule: "The days count from the report_date on the theft claim, the report date being day 0, so with a waiting period of 1 the rental can start on the day after the report."
          boundary: inclusive
    formula:
      first_authorized_days: min(initial_authorization_days, max_days_per_loss - rental_msr_days_used)
    measures: [rental_msr_days_used]

  - id: rental_evt_extension_and_end
    subject: [rental_extension, rental_authorization_closed, rental_liability_transfer]
    rule: >-
      An authorization is extended by extension_increment_days at a time, only when the shop confirms a new completion
      date (extension_requires_shop_confirmation) or documents a parts delay (parts_delay_extension_allowed), and never
      beyond max_days_per_loss in total or beyond what the per-loss maximum can still pay. An extension is granted only
      while the total days authorized on the claim stay within max_days_per_loss. The rental ends, whichever comes first:
      repair_complete_grace_days after the shop reports repairs complete; total_loss_rental_end_days after the total-loss
      settlement is offered; denial_rental_end_days after a coverage denial is communicated; the day the per-loss maximum
      or the maximum days are used up; the day the customer returns the car; or the day before the at-fault party's
      insurer takes over the rental, which is recorded as a liability transfer. Days after the end are the customer's.
    eligibility:
      - id: within_max_days
        applies_to: [rental_extension]
        kind: caller_fact
        condition: "An extension is granted only while the total days authorized on the claim stay within max_days_per_loss."
        evidence_fields: [rental_ledger.authorized_days, rental_ledger.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_ledger.claim_number]
          action_bindings:
            rental_ledger.claim_number: claim_number
    measures: [rental_msr_days_authorized]

  - id: rental_evt_payment
    subject: [rental_vendor_payment, rental_reimbursement_payment]
    rule: >-
      Each covered rental day is paid at the lower of the agency's daily rate and the option's daily_limit, taxes and
      fees counted inside the limit where daily_limit_includes_taxes; only days inside the authorization are covered, and
      the total on the claim never exceeds max_per_loss. Within those limits the payment is the covered days times the
      covered daily amount, capped at what the per-loss maximum still allows (rental_msr_benefit_used). Never paid:
      the agency's damage waiver where ldw_cdw_covered is false, fuel, per-mile charges, one-way drop fees, under-25
      renter fees, counter deposits and accessories, and the difference for a larger car than authorized; delivery and
      collection fees, additional driver fees and child safety seats are paid only where the option's switch is true and
      within the daily limit. Everything not paid is the customer's responsibility and is recorded on the payment.
      Direct-bill invoices are paid to the partner agency within vendor_invoice_payment_days; an invoice exceeding the
      authorized days times the daily limit by more than vendor_overbilling_review_threshold is reviewed before payment.
      A customer who arranged their own rental, or used rideshare, taxi or transit where rideshare_transit_allowed, is
      reimbursed against itemized receipts under the same daily limit, within reimbursement_payment_days of complete
      receipts. An agency invoice is paid only once; an invoice number already paid is not paid again. Receipts are reimbursed only when submitted no later than receipt_submit_days calendar days after the
      rental ended. The count runs from the end_date of the closed authorization, that date being day 0, and receipts
      received on the last day are in time.
    eligibility:
      - id: receipts_in_time
        applies_to: [rental_reimbursement_payment]
        kind: time
        condition: "Receipts are reimbursed only when submitted no later than receipt_submit_days calendar days after the rental ended."
        evidence_fields: [rental_ledger.end_date, rental_ledger.authorization_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_ledger.authorization_number]
          action_bindings:
            rental_ledger.authorization_number: authorization_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the rental ended
          anchor_source: rental_ledger.end_date
          relation: not_after
          duration_source: variants.receipt_submit_days
          unit: calendar_days
          counting_rule: "The count runs from the end_date of the closed authorization, that date being day 0, and receipts received on the last day are in time."
          boundary: inclusive
      - id: invoice_not_paid_twice
        applies_to: [rental_vendor_payment]
        kind: dedup
        condition: "An agency invoice is paid only once; an invoice number already paid is not paid again."
        evidence_fields: [rental_ledger.invoice_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rental_ledger.invoice_number]
          action_bindings:
            rental_ledger.invoice_number: invoice_number
        dedup_contract:
          table: rental_ledger
          mode: separate_record
          object_bindings: {invoice_number: invoice_number}
          duplicate_filters: {event_type: [rental_vendor_payment]}
          distinct_fields: []
    formula:
      amount: min(days_billed * min(daily_rate, daily_limit), max_per_loss - rental_msr_benefit_used)
    measures: [rental_msr_benefit_used]
    params:
      per_tier:
        Cardinal Rental Reimbursement 30/900: {daily_limit: "=daily_limit", max_per_loss: "=max_per_loss"}
        Cardinal Rental Reimbursement 40/1200: {daily_limit: "=daily_limit", max_per_loss: "=max_per_loss"}
        Cardinal Rental Reimbursement 50/1500: {daily_limit: "=daily_limit", max_per_loss: "=max_per_loss"}
        Cardinal Rental Reimbursement 60/1800: {daily_limit: "=daily_limit", max_per_loss: "=max_per_loss"}
        Cardinal Rental Reimbursement 75/2250: {daily_limit: "=daily_limit", max_per_loss: "=max_per_loss"}
        Cardinal Rental Reimbursement 100/3000: {daily_limit: "=daily_limit", max_per_loss: "=max_per_loss"}

  - id: rental_evt_recovery
    subject: [rental_payment_recovery]
    rule: >-
      When the other party is at fault, the rental paid under the option is part of Cardinal's subrogation demand; a
      subrogation recovery lowers rental benefit paid but does not give back per-loss benefit or days on the claim. An
      agency credit for an overbilled invoice lowers rental benefit paid and does give the credited amount back to the
      per-loss benefit. A recovery is recorded once per payment and source.
    eligibility: []

  - id: rental_combo_physdmg_and_builtin
    subject: [rental_authorization, rental_reimbursement_payment, rental_coverage_suspend]
    rule: >-
      Rental reimbursement and the built-in transportation expense of physical damage are never added together on one
      loss: when the vehicle carries an option, the option pays and the built-in benefit does not apply; when it carries
      none, only the built-in benefit applies. Damage to the rental car itself is not paid under this option; it is
      handled under the vehicle's own physical damage as a non-owned car where nonowned_rental_physdmg_extends, subject to
      that coverage's deductible. While the vehicle's physical damage is in storage the option is suspended and no rental
      is authorized for a loss during storage.
    eligibility: []

extended_policies:
  - id: rental_ext_upgrade_acceptance_days
    base_policy_refs: [rental_agg_per_loss_benefit, rental_evt_authorization, rental_combo_physdmg_and_builtin]
    overwrite:
      - base_policy: rental_evt_authorization
        superseded_clause: >-
          The first authorization covers initial_authorization_days or the shop's estimated repair days if fewer,
          never more than the days left under max_days_per_loss.
        replaced_by: >-
          The authorized days are the repair days plus the package days, never fewer than one day; the day maximum of
          the loss is applied when that rental is extended, not when it is recorded.
    trigger: on_request
    subject: [rental_authorization]
    computes: authorized_days
    target_tool: accept_upgraded_rental_aa4639f2
    params:
      comeback_initial_select: 4
      comeback_initial_nonnetwork: 2
      calib_large_amount: 2000.00
      calib_small_amount: 1000.00
      calib_days_large: 2
      calib_days_small: 1
      sublet_transfer_days: 1
      pkg_bonus_high: 2
      pkg_bonus_mid: 1
    rule: >-
      A customer whose damaged vehicle is in the shop on an accepted physical damage claim may take a partner-agency
      car of a class above the option's direct_bill_vehicle_class; that rental is recorded as an authorization only
      when the customer personally accepts it, and the customer pays the agency every amount above what the option
      pays for each day. Under the standard method the days an accepted larger-class rental is authorized for are
      initial_authorization_days, never fewer than one day. The starting days of an accepted larger-class rental follow
      the repair path of the claim: when the claim carries a rental closed because repairs were complete together with
      a supplement estimate (estimate sequence 1 or higher) and the latest estimate on the claim was written by a
      Cardinal Select Shop, the starting days are comeback_initial_select; when the claim carries the same closed rental
      and supplement estimate and the latest estimate was written by a shop outside the Select network, they are
      comeback_initial_nonnetwork; otherwise they are initial_authorization_days. Recalibration days are owed for
      driver-assistance sensors after supplemental damage: when the claim carries a supplement estimate and the latest
      estimate amount on the claim is calib_large_amount or more, they are calib_days_large; when the claim carries a
      supplement estimate and that latest amount is calib_small_amount or more but below calib_large_amount, they are
      calib_days_small; otherwise none are owed. The starting days and the recalibration days are scheduled by the
      kind of shop doing the work: at a Cardinal Select Shop, which recalibrates in house while it repairs, the repair
      days are the larger of the starting days and the recalibration days; at a shop outside the Select network, which
      sublets recalibration to a dealer, the repair days are the starting days plus the recalibration days plus
      sublet_transfer_days for moving the vehicle to the dealer and back; otherwise the repair days are the starting
      days plus the recalibration days. Package days are added from the household's auto package: pkg_bonus_high days
      when the package's highest allowed rental option rank is 6, pkg_bonus_mid day when that rank is 4 or 5, and none
      when it is below 4. The authorized days are the repair days plus the package days, never fewer than one day; the
      day maximum of the loss is applied when that rental is extended, not when it is recorded.
    baseline:
      rule: >-
        Under the standard method the days an accepted larger-class rental is authorized for are
        initial_authorization_days, never fewer than one day.
      params: [initial_authorization_days]
    prerequisite: []
    cross_category:
      - category: physdmg
        as: history
        reads: [physdmg_claim_events.estimate_sequence, physdmg_claim_events.repair_shop_type, physdmg_claim_events.estimate_amount]
        note: The starting days, the recalibration days and their scheduling rest on the claim's estimate entries and the shop that wrote them.
      - category: auto
        as: branch
        reads: [variant_name]
        note: The package days rest on the auto package's highest allowed rental option rank.
    compute:
      - clm: "LATEST('rental_ledger', 'claim_number', date_field='entry_date')"
      - rc_n: "COUNT('rental_ledger', event_type='rental_authorization_closed', close_reason='repairs_complete', claim_number=clm)"
      - supp_seq: "XMAX('physdmg', 'physdmg_claim_events', 'estimate_sequence', event_type='physdmg_estimate_written', claim_number=clm)"
      - shop: "XLATEST('physdmg', 'physdmg_claim_events', 'repair_shop_type', date_field='event_date', event_type='physdmg_estimate_written', claim_number=clm)"
      - start_days: "K('comeback_initial_select') if (rc_n >= 1 and supp_seq >= 1 and shop == 'cardinal_select_shop') else (K('comeback_initial_nonnetwork') if (rc_n >= 1 and supp_seq >= 1 and shop == 'non_network_shop') else P('initial_authorization_days'))"
      - est_amt: "XLATEST('physdmg', 'physdmg_claim_events', 'estimate_amount', date_field='event_date', event_type='physdmg_estimate_written', claim_number=clm)"
      - calib_owed: "K('calib_days_large') if (supp_seq >= 1 and est_amt >= K('calib_large_amount')) else (K('calib_days_small') if (supp_seq >= 1 and est_amt >= K('calib_small_amount')) else 0)"
      - sched_shop: "XLATEST('physdmg', 'physdmg_claim_events', 'repair_shop_type', date_field='event_date', event_type='physdmg_estimate_written', claim_number=clm)"
      - repair_days: "MX(start_days, calib_owed) if sched_shop == 'cardinal_select_shop' else ((start_days + calib_owed + K('sublet_transfer_days')) if sched_shop == 'non_network_shop' else (start_days + calib_owed))"
      - pkg_rank: "CPARAM('auto', 'rental_max_option_rank')"
      - pkg_add: "K('pkg_bonus_high') if pkg_rank >= 6 else (K('pkg_bonus_mid') if pkg_rank >= 4 else 0)"
      - result: "MX(1, repair_days + pkg_add)"
    compute_basis:
      clm: "A customer whose damaged vehicle is in the shop on an accepted physical damage claim may take a partner-agency car of a class above the option's direct_bill_vehicle_class"
      rc_n: "when the claim carries a rental closed because repairs were complete together with a supplement estimate (estimate sequence 1 or higher)"
      supp_seq: "when the claim carries a rental closed because repairs were complete together with a supplement estimate (estimate sequence 1 or higher)"
      shop: "the latest estimate on the claim was written by a Cardinal Select Shop"
      start_days: "The starting days of an accepted larger-class rental follow the repair path of the claim: when the claim carries a rental closed because repairs were complete together with a supplement estimate (estimate sequence 1 or higher) and the latest estimate on the claim was written by a Cardinal Select Shop, the starting days are comeback_initial_select; when the claim carries the same closed rental and supplement estimate and the latest estimate was written by a shop outside the Select network, they are comeback_initial_nonnetwork; otherwise they are initial_authorization_days."
      est_amt: "the latest estimate amount on the claim is calib_large_amount or more"
      calib_owed: "Recalibration days are owed for driver-assistance sensors after supplemental damage: when the claim carries a supplement estimate and the latest estimate amount on the claim is calib_large_amount or more, they are calib_days_large; when the claim carries a supplement estimate and that latest amount is calib_small_amount or more but below calib_large_amount, they are calib_days_small; otherwise none are owed."
      sched_shop: "The starting days and the recalibration days are scheduled by the kind of shop doing the work"
      repair_days: "at a Cardinal Select Shop, which recalibrates in house while it repairs, the repair days are the larger of the starting days and the recalibration days; at a shop outside the Select network, which sublets recalibration to a dealer, the repair days are the starting days plus the recalibration days plus sublet_transfer_days for moving the vehicle to the dealer and back; otherwise the repair days are the starting days plus the recalibration days."
      pkg_rank: "Package days are added from the household's auto package"
      pkg_add: "pkg_bonus_high days when the package's highest allowed rental option rank is 6, pkg_bonus_mid day when that rank is 4 or 5, and none when it is below 4."
      result: "The authorized days are the repair days plus the package days, never fewer than one day"
    factors:
      - id: repair_path_starting_days
        effect: parameter
        decides: start_days
        bindings: [rc_n, supp_seq, shop, start_days]
        ladder:
          - when: "a rental on the claim closed because repairs were complete AND a supplement estimate is on the claim AND the latest estimate is from a Cardinal Select Shop"
            value: "K('comeback_initial_select')"
          - when: "a rental on the claim closed because repairs were complete AND a supplement estimate is on the claim AND the latest estimate is from a shop outside the Select network"
            value: "K('comeback_initial_nonnetwork')"
          - when: "otherwise"
            value: "P('initial_authorization_days')"
        baseline:
          start_days: "P('initial_authorization_days')"
        evidence: [history, cross_category]
        cross_difficulty: physdmg
      - id: recalibration_days_owed
        effect: parameter
        decides: calib_owed
        bindings: [est_amt, calib_owed]
        ladder:
          - when: "a supplement estimate is on the claim AND the latest estimate amount is calib_large_amount or more"
            value: "K('calib_days_large')"
          - when: "a supplement estimate is on the claim AND the latest estimate amount is calib_small_amount or more but below calib_large_amount"
            value: "K('calib_days_small')"
          - when: "otherwise"
            value: "0"
        baseline:
          calib_owed: "0"
        evidence: [cross_category]
        cross_difficulty: physdmg
      - id: recalibration_scheduling
        effect: method
        decides: repair_days
        bindings: [sched_shop, repair_days]
        ladder:
          - when: "the latest estimate is from a Cardinal Select Shop"
            method: "recalibration runs alongside the repair: the repair days are the larger of the starting days and the recalibration days"
          - when: "the latest estimate is from a shop outside the Select network"
            method: "recalibration is sublet after the repair: the repair days are the starting days, then the recalibration days, then sublet_transfer_days added in sequence"
          - when: "otherwise"
            method: "the repair days are the starting days plus the recalibration days"
        baseline:
          repair_days: "start_days + calib_owed"
        evidence: [cross_category]
        cross_difficulty: physdmg
      - id: package_rental_days
        effect: parameter
        decides: pkg_add
        bindings: [pkg_rank, pkg_add]
        ladder:
          - when: "the auto package's highest allowed rental option rank is 6"
            value: "K('pkg_bonus_high')"
          - when: "the auto package's highest allowed rental option rank is 4 or 5"
            value: "K('pkg_bonus_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          pkg_add: "0"
        evidence: [cross_category]
        cross_difficulty: auto
    inputs:
      history:
        - {table: rental_ledger, aggregate: count, field: rental_entry_id, filters: {event_type: rental_authorization_closed, close_reason: repairs_complete}}
        - {category: physdmg, table: physdmg_claim_events, aggregate: max, field: estimate_sequence, filters: {event_type: physdmg_estimate_written}}
        - {category: physdmg, table: physdmg_claim_events, aggregate: latest, field: estimate_amount, filters: {event_type: physdmg_estimate_written}}
      cross_category: [physdmg, auto]

  - id: rental_ext_partner_invoice_settlement
    base_policy_refs: [rental_agg_per_loss_benefit, rental_evt_payment]
    overwrite:
      - base_policy: rental_evt_payment
        superseded_clause: >-
          Each covered rental day is paid at the lower of the agency's daily rate and the option's daily_limit, taxes
          and fees counted inside the limit where daily_limit_includes_taxes; only days inside the authorization are
          covered, and the total on the claim never exceeds max_per_loss.
        replaced_by: >-
          The closing allowance of the invoiced rental follows why it closed: a rental closed because repairs were
          complete is owed repair_complete_grace_days beyond its authorized days; a rental closed because a total-loss
          settlement was offered is owed total_loss_rental_end_days beyond them; a rental closed for any other reason
          is owed none.
      - base_policy: rental_evt_payment
        superseded_clause: >-
          Within those limits the payment is the covered days times the covered daily amount, capped at what the
          per-loss maximum still allows (rental_msr_benefit_used).
        replaced_by: >-
          The agency payment is the billable days times the shared day rate, less the parts-delay reduction, never
          below zero and never above what the per-loss maximum still allows, rounded to the cent.
      - base_policy: rental_evt_payment
        superseded_clause: >-
          An agency invoice is paid only once; an invoice number already paid is not paid again.
        replaced_by: >-
          an invoice number already paid is never paid again
    trigger: state_due
    subject: [rental_vendor_payment]
    computes: amount
    target_tool: pay_partner_rental_invoice_bf34992c
    params:
      long_rental_days: 14
      network_share_select_long: 0.90
      network_share_nonnetwork_long: 0.97
      monthly_block: 28
      monthly_paid_days: 22
      weekly_block: 7
      weekly_paid_days: 6
      pd_share_select: 0.85
      pd_share_nonnetwork: 0.95
    rule: >-
      A partner agency's direct-bill invoice is paid for the claim's most recently closed rental; its start date, the
      daily rate recorded on its authorization, its closing end date, why it closed and its authorized days (the
      authorization plus every extension of it) are read from the rental ledger, and an invoice number already paid is
      never paid again. Under the standard method the covered days of a partner invoice are the closed span of that
      rental, counted from its start date through the end date of its closing, both days included, never more than its
      authorized days. Under the standard method the agency payment is the covered days times the lower of the rate recorded on the
      authorization and the option's daily_limit, never above what the per-loss maximum still allows (max_per_loss less
      the agency and reimbursement payments on the claim, net of agency credits), rounded to the cent. The closing
      allowance of the invoiced rental follows why it closed: a rental closed because repairs were complete is owed
      repair_complete_grace_days beyond its authorized days; a rental closed because a total-loss settlement was
      offered is owed total_loss_rental_end_days beyond them; a rental closed for any other reason is owed none. The
      covered days are the closed span, never more than the authorized days plus the closing allowance, in place of the
      standard cap at the authorized days. Covered days of
      a partner direct-bill rental are turned into billable days by the partner's rate convention: with monthly_block
      or more covered days the rental is billed in blocks of monthly_block days at monthly_paid_days days each and the
      remaining days one by one; with weekly_block or more but fewer than monthly_block covered days it is billed in
      blocks of weekly_block days at weekly_paid_days days each and the remaining days one by one; any other rental is
      billed day by day for its covered days. The partner program share of the invoice rate follows the repair shop and
      the rental's length: a rental of long_rental_days or more covered days on a claim whose latest estimate is from a
      Cardinal Select Shop takes network_share_select_long; a rental of long_rental_days or more covered days on a
      claim whose latest estimate is from a shop outside the Select network takes network_share_nonnetwork_long; any
      other rental takes the full rate. The program share is applied once to the lower of the recorded rate and the
      daily_limit, and the shared day rate is rounded to the cent. Days the rental ran on extensions granted for a
      documented parts delay are billed at a reduced share: pd_share_select of the shared day rate when the latest
      estimate is from a Cardinal Select Shop, pd_share_nonnetwork when it is from a shop outside the Select network,
      and the full shared day rate when the rental carries no parts-delay extension; the parts-delay reduction is the
      parts-delay days (no more than the billable days) times the shared day rate times one less that share, rounded
      to the cent. The agency payment is the billable days times the shared day rate, less the parts-delay reduction,
      never below zero and never above what the per-loss maximum still allows, rounded to the cent. Everything on the
      invoice that is not paid is the customer's responsibility.
    baseline:
      rule: >-
        Under the standard method the covered days of a partner invoice are the closed span of that rental, counted
        from its start date through the end date of its closing, both days included, never more than its authorized
        days. Under the standard
        method the agency payment is the covered days times the lower of the rate recorded on the authorization and
        the option's daily_limit, never above what the per-loss maximum still allows (max_per_loss less the agency and
        reimbursement payments on the claim, net of agency credits), rounded to the cent.
      params: [daily_limit, max_per_loss]
    prerequisite: []
    cross_category:
      - category: physdmg
        as: history
        reads: [physdmg_claim_events.repair_shop_type]
        note: The partner program share and the parts-delay share rest on the shop that wrote the claim's latest estimate.
    compute:
      - clm: "LATEST('rental_ledger', 'claim_number', date_field='entry_date')"
      - inv_auth: "LATEST('rental_ledger', 'authorization_number', date_field='entry_date', event_type='rental_authorization_closed', claim_number=clm)"
      - a_start: "LATEST('rental_ledger', 'start_date', date_field='entry_date', event_type='rental_authorization', authorization_number=inv_auth)"
      - a_rate: "LATEST('rental_ledger', 'daily_rate', date_field='entry_date', event_type='rental_authorization', authorization_number=inv_auth)"
      - a_vendor: "LATEST('rental_ledger', 'vendor_type', date_field='entry_date', event_type='rental_authorization', authorization_number=inv_auth)"
      - a_end: "LATEST('rental_ledger', 'end_date', date_field='entry_date', event_type='rental_authorization_closed', authorization_number=inv_auth)"
      - a_auth_days: "SUM('rental_ledger', 'authorized_days', event_type='rental_authorization', authorization_number=inv_auth) + SUM('rental_ledger', 'authorized_days', event_type='rental_extension', authorization_number=inv_auth)"
      - a_span: "DAYS(a_start, a_end) + 1"
      - a_reason: "LATEST('rental_ledger', 'close_reason', date_field='entry_date', event_type='rental_authorization_closed', authorization_number=inv_auth)"
      - close_allow: "P('repair_complete_grace_days') if a_reason == 'repairs_complete' else (P('total_loss_rental_end_days') if a_reason == 'total_loss_settlement_offered' else 0)"
      - cover_days: "MN(a_span, a_auth_days + close_allow)"
      - billable: "(int(cover_days / K('monthly_block')) * K('monthly_paid_days') + cover_days - int(cover_days / K('monthly_block')) * K('monthly_block')) if (a_vendor == 'partner_direct_bill' and cover_days >= K('monthly_block')) else ((int(cover_days / K('weekly_block')) * K('weekly_paid_days') + cover_days - int(cover_days / K('weekly_block')) * K('weekly_block')) if (a_vendor == 'partner_direct_bill' and cover_days >= K('weekly_block')) else cover_days)"
      - shop: "XLATEST('physdmg', 'physdmg_claim_events', 'repair_shop_type', date_field='event_date', event_type='physdmg_estimate_written', claim_number=clm)"
      - net_share: "K('network_share_select_long') if (shop == 'cardinal_select_shop' and cover_days >= K('long_rental_days')) else (K('network_share_nonnetwork_long') if (shop == 'non_network_shop' and cover_days >= K('long_rental_days')) else 1)"
      - day_rate: "RND(MN(a_rate, P('daily_limit')) * net_share, 2)"
      - pd_days: "SUM('rental_ledger', 'authorized_days', event_type='rental_extension', extension_reason='parts_delay', authorization_number=inv_auth)"
      - pd_share: "K('pd_share_select') if (pd_days > 0 and shop == 'cardinal_select_shop') else (K('pd_share_nonnetwork') if (pd_days > 0 and shop == 'non_network_shop') else 1)"
      - pd_cut: "RND(MN(pd_days, billable) * day_rate * (1 - pd_share), 2)"
      - benefit_left: "P('max_per_loss') - (SUM('rental_ledger', 'amount', event_type='rental_vendor_payment', claim_number=clm) + SUM('rental_ledger', 'amount', event_type='rental_reimbursement_payment', claim_number=clm) - SUM('rental_ledger', 'amount', event_type='rental_payment_recovery', recovery_source='vendor_credit', claim_number=clm))"
      - result: "RND(MX(0, MN(billable * day_rate - pd_cut, benefit_left)), 2)"
    compute_basis:
      clm: "A partner agency's direct-bill invoice is paid for the claim's most recently closed rental"
      inv_auth: "A partner agency's direct-bill invoice is paid for the claim's most recently closed rental"
      a_start: "its start date, the daily rate recorded on its authorization, its closing end date, why it closed and its authorized days (the authorization plus every extension of it) are read from the rental ledger"
      a_rate: "its start date, the daily rate recorded on its authorization, its closing end date, why it closed and its authorized days (the authorization plus every extension of it) are read from the rental ledger"
      a_vendor: "Covered days of a partner direct-bill rental are turned into billable days by the partner's rate convention"
      a_end: "its start date, the daily rate recorded on its authorization, its closing end date, why it closed and its authorized days (the authorization plus every extension of it) are read from the rental ledger"
      a_auth_days: "its start date, the daily rate recorded on its authorization, its closing end date, why it closed and its authorized days (the authorization plus every extension of it) are read from the rental ledger"
      a_span: "the closed span of that rental, counted from its start date through the end date of its closing, both days included"
      a_reason: "The closing allowance of the invoiced rental follows why it closed"
      close_allow: "The closing allowance of the invoiced rental follows why it closed: a rental closed because repairs were complete is owed repair_complete_grace_days beyond its authorized days; a rental closed because a total-loss settlement was offered is owed total_loss_rental_end_days beyond them; a rental closed for any other reason is owed none."
      cover_days: "The covered days are the closed span, never more than the authorized days plus the closing allowance, in place of the standard cap at the authorized days."
      billable: "with monthly_block or more covered days the rental is billed in blocks of monthly_block days at monthly_paid_days days each and the remaining days one by one; with weekly_block or more but fewer than monthly_block covered days it is billed in blocks of weekly_block days at weekly_paid_days days each and the remaining days one by one; any other rental is billed day by day for its covered days."
      shop: "a rental of long_rental_days or more covered days on a claim whose latest estimate is from a Cardinal Select Shop takes network_share_select_long"
      net_share: "The partner program share of the invoice rate follows the repair shop and the rental's length: a rental of long_rental_days or more covered days on a claim whose latest estimate is from a Cardinal Select Shop takes network_share_select_long; a rental of long_rental_days or more covered days on a claim whose latest estimate is from a shop outside the Select network takes network_share_nonnetwork_long; any other rental takes the full rate."
      day_rate: "The program share is applied once to the lower of the recorded rate and the daily_limit, and the shared day rate is rounded to the cent."
      pd_days: "Days the rental ran on extensions granted for a documented parts delay are billed at a reduced share"
      pd_share: "pd_share_select of the shared day rate when the latest estimate is from a Cardinal Select Shop, pd_share_nonnetwork when it is from a shop outside the Select network, and the full shared day rate when the rental carries no parts-delay extension"
      pd_cut: "the parts-delay reduction is the parts-delay days (no more than the billable days) times the shared day rate times one less that share, rounded to the cent."
      benefit_left: "never above what the per-loss maximum still allows (max_per_loss less the agency and reimbursement payments on the claim, net of agency credits)"
      result: "The agency payment is the billable days times the shared day rate, less the parts-delay reduction, never below zero and never above what the per-loss maximum still allows, rounded to the cent."
    factors:
      - id: invoiced_closing_allowance
        effect: parameter
        decides: close_allow
        bindings: [a_reason, close_allow]
        ladder:
          - when: "the invoiced rental closed because repairs were complete"
            value: "P('repair_complete_grace_days')"
          - when: "the invoiced rental closed because a total-loss settlement was offered"
            value: "P('total_loss_rental_end_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          close_allow: "0"
        evidence: [history]
        cross_difficulty: null
      - id: partner_rate_convention
        effect: method
        decides: billable
        bindings: [a_vendor, billable]
        ladder:
          - when: "the rental is a partner direct-bill rental AND it has monthly_block or more covered days"
            method: "blocks of monthly_block days are billed at monthly_paid_days days each, the remaining days one by one"
          - when: "the rental is a partner direct-bill rental AND it has weekly_block or more but fewer than monthly_block covered days"
            method: "blocks of weekly_block days are billed at weekly_paid_days days each, the remaining days one by one"
          - when: "otherwise"
            method: "billed day by day for the covered days"
        baseline:
          billable: "cover_days"
        evidence: [history]
        cross_difficulty: null
      - id: partner_program_share
        effect: parameter
        decides: net_share
        bindings: [shop, net_share]
        ladder:
          - when: "the latest estimate on the claim is from a Cardinal Select Shop AND the rental has long_rental_days or more covered days"
            value: "K('network_share_select_long')"
          - when: "the latest estimate on the claim is from a shop outside the Select network AND the rental has long_rental_days or more covered days"
            value: "K('network_share_nonnetwork_long')"
          - when: "otherwise"
            value: "1"
        baseline:
          net_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: physdmg
      - id: parts_delay_day_share
        effect: parameter
        decides: pd_share
        bindings: [pd_days, pd_share]
        ladder:
          - when: "the rental carries parts-delay extension days AND the latest estimate is from a Cardinal Select Shop"
            value: "K('pd_share_select')"
          - when: "the rental carries parts-delay extension days AND the latest estimate is from a shop outside the Select network"
            value: "K('pd_share_nonnetwork')"
          - when: "otherwise"
            value: "1"
        baseline:
          pd_share: "1"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: rental_ledger, aggregate: latest, field: close_reason, filters: {event_type: rental_authorization_closed}}
        - {table: rental_ledger, aggregate: sum, field: authorized_days, filters: {event_type: rental_extension}}
        - {table: rental_ledger, aggregate: sum, field: amount, filters: {event_type: rental_vendor_payment}}
        - {category: physdmg, table: physdmg_claim_events, aggregate: latest, field: repair_shop_type, filters: {event_type: physdmg_estimate_written}}
      cross_category: [physdmg]

  - id: rental_ext_rideshare_day_allowance
    base_policy_refs: [rental_agg_per_loss_benefit, rental_evt_payment, rental_combo_physdmg_and_builtin]
    overwrite:
      - base_policy: rental_evt_payment
        superseded_clause: >-
          Each covered rental day is paid at the lower of the agency's daily rate and the option's daily_limit, taxes
          and fees counted inside the limit where daily_limit_includes_taxes; only days inside the authorization are
          covered, and the total on the claim never exceeds max_per_loss.
        replaced_by: >-
          The daily rideshare allowance follows the length of the stint and the option: with ride_short_days or fewer
          covered rideshare days on an option whose daily_limit is ride_rate_limit_floor or more it is ride_rate_short;
          with more than ride_short_days covered rideshare days on such an option it is ride_rate_long; on an option
          whose daily_limit is below ride_rate_limit_floor it is the daily_limit.
      - base_policy: rental_evt_payment
        superseded_clause: >-
          Within those limits the payment is the covered days times the covered daily amount, capped at what the
          per-loss maximum still allows (rental_msr_benefit_used).
        replaced_by: >-
          The rideshare reimbursement is the covered rideshare days times the topped-up rideshare allowance, less the
          alternate transportation set against it, never below zero and never above what the per-loss maximum still
          allows, rounded to the cent.
    trigger: on_request
    subject: [rental_reimbursement_payment]
    computes: amount
    target_tool: submit_rideshare_receipts_3a988a26
    params:
      ride_short_days: 2
      ride_rate_limit_floor: 50.00
      ride_rate_short: 45.00
      ride_rate_long: 35.00
      alt_late_share: 0.5
      ride_topup_high: 5.00
      ride_topup_mid: 2.50
    rule: >-
      Rideshare, taxi and transit fares a customer paid during a rideshare authorization are reimbursed when the
      customer submits the receipts personally, for the claim's most recent rideshare authorization; its start date,
      authorized days and closing end date are read from the rental ledger, and receipts are reimbursed only when
      submitted no later than receipt_submit_days calendar days after the rental ended. The covered rideshare days run
      from the start date of the rideshare authorization through the end date of its closing, both days included.
      Under the standard method each covered rideshare day is paid at the option's daily_limit, and the reimbursement
      is the covered rideshare days times that daily amount, never above what the per-loss maximum still allows
      (max_per_loss less the agency and reimbursement payments on the claim, net of agency credits), rounded to the
      cent. The first covered rideshare day follows how the loss left the vehicle: for a total theft it is
      theft_waiting_days calendar days after the report date of the claim; for a loss that is not a theft where the
      claim report records the vehicle as not drivable, or where an accident tow was moved from roadside assistance to
      the claim, it is the claim's report date; otherwise it is the start date of the rideshare authorization. The last
      covered rideshare day follows how the rideshare ended: when a rental car authorization on the claim was entered
      on the end date of the rideshare authorization's closing, the last covered rideshare day is the day before that
      rental car's start date; when the rideshare authorization has no closing on the ledger, it is the last of its
      authorized days; otherwise it is the end date of its closing. The covered rideshare days are counted from the
      first covered rideshare day through the last covered rideshare day, both included, never fewer than zero. The
      daily rideshare allowance follows the length of the stint and the option: with ride_short_days or fewer covered
      rideshare days on an option whose daily_limit is ride_rate_limit_floor or more it is ride_rate_short; with more
      than ride_short_days covered rideshare days on such an option it is ride_rate_long; on an option whose
      daily_limit is below ride_rate_limit_floor it is the daily_limit. A package top-up is added to the daily rideshare
      allowance: ride_topup_high when the auto package's highest allowed rental option rank is 6, ride_topup_mid when it
      is 4 or 5, and nothing when it is below 4; the topped-up allowance is never above the daily_limit. Alternate
      transportation already paid by
      roadside trip interruption is set against the rideshare reimbursement: the full amount paid for alternate
      transportation with a service date on the claim's report date; when alternate transportation was paid only for
      other service dates, alt_late_share of what was paid, rounded to the cent; and nothing when none was paid. The
      rideshare reimbursement is the covered rideshare days times the topped-up rideshare allowance, less the alternate
      transportation set against it, never below zero and never above what the per-loss maximum still allows, rounded
      to the cent.
    baseline:
      rule: >-
        The covered rideshare days run from the start date of the rideshare authorization through the end date of its
        closing, both days included. Under the standard method each covered rideshare day is paid at the option's
        daily_limit, and the reimbursement is the covered rideshare days times that daily amount, never above what the
        per-loss maximum still allows (max_per_loss less the agency and reimbursement payments on the claim, net of
        agency credits), rounded to the cent.
      params: [daily_limit, max_per_loss]
    prerequisite: []
    cross_category:
      - category: physdmg
        as: history
        reads: [physdmg_claim_events.drivable, physdmg_claim_events.loss_cause, physdmg_claim_events.report_date]
        note: The first covered rideshare day rests on the claim report's drivable flag, cause of loss and report date.
      - category: roadside
        as: history
        reads: [roadside_events.restore_reason, roadside_events.amount, roadside_events.service_date]
        note: The accident tow moved to the claim and the trip interruption alternate transportation already paid.
      - category: auto
        as: branch
        reads: [variant_name]
        note: The rideshare allowance top-up rests on the auto package's highest allowed rental option rank.
    compute:
      - clm: "LATEST('rental_ledger', 'claim_number', date_field='entry_date')"
      - r_auth: "LATEST('rental_ledger', 'authorization_number', date_field='entry_date', event_type='rental_authorization', vendor_type='rideshare_taxi_transit', claim_number=clm)"
      - r_start: "LATEST('rental_ledger', 'start_date', date_field='entry_date', event_type='rental_authorization', authorization_number=r_auth)"
      - r_auth_days: "SUM('rental_ledger', 'authorized_days', event_type='rental_authorization', authorization_number=r_auth) + SUM('rental_ledger', 'authorized_days', event_type='rental_extension', authorization_number=r_auth)"
      - r_end: "LATEST('rental_ledger', 'end_date', date_field='entry_date', event_type='rental_authorization_closed', authorization_number=r_auth)"
      - loss_drivable: "XLATEST('physdmg', 'physdmg_claim_events', 'drivable', date_field='event_date', event_type='physdmg_claim_report', claim_number=clm)"
      - loss_cause: "XLATEST('physdmg', 'physdmg_claim_events', 'loss_cause', date_field='event_date', event_type='physdmg_claim_report', claim_number=clm)"
      - report_date: "XLATEST('physdmg', 'physdmg_claim_events', 'report_date', date_field='event_date', event_type='physdmg_claim_report', claim_number=clm)"
      - tow_moved: "XCOUNT('roadside', 'roadside_events', event_type='roadside_call_restored', restore_reason='accident_tow_moved_to_claim')"
      - first_gap: "(DAYS(r_start, report_date) + P('theft_waiting_days')) if loss_cause == 'theft_total' else (DAYS(r_start, report_date) if (loss_drivable == False or tow_moved >= 1) else 0)"
      - car_start: "LATEST('rental_ledger', 'start_date', date_field='entry_date', event_type='rental_authorization', claim_number=clm, entry_date=r_end)"
      - car_n: "COUNT('rental_ledger', event_type='rental_authorization', claim_number=clm, entry_date=r_end)"
      - last_off: "(DAYS(r_start, car_start) - 1) if (r_end and car_n >= 1) else ((r_auth_days - 1) if not r_end else DAYS(r_start, r_end))"
      - r_days: "MX(0, last_off + 1 - first_gap)"
      - r_rate: "K('ride_rate_short') if (r_days <= K('ride_short_days') and P('daily_limit') >= K('ride_rate_limit_floor')) else (K('ride_rate_long') if (r_days > K('ride_short_days') and P('daily_limit') >= K('ride_rate_limit_floor')) else P('daily_limit'))"
      - ride_pkg_rank: "CPARAM('auto', 'rental_max_option_rank')"
      - ride_topup: "K('ride_topup_high') if ride_pkg_rank >= 6 else (K('ride_topup_mid') if ride_pkg_rank >= 4 else 0)"
      - ride_day_amt: "MN(r_rate + ride_topup, P('daily_limit'))"
      - alt_on_report: "XSUM('roadside', 'roadside_events', 'amount', event_type='roadside_trip_interruption_paid', expense_category='alternate_transportation', service_date=report_date)"
      - alt_all: "XSUM('roadside', 'roadside_events', 'amount', event_type='roadside_trip_interruption_paid', expense_category='alternate_transportation')"
      - alt_set: "alt_on_report if alt_on_report > 0 else (RND(alt_all * K('alt_late_share'), 2) if alt_all > 0 else 0)"
      - benefit_left: "P('max_per_loss') - (SUM('rental_ledger', 'amount', event_type='rental_vendor_payment', claim_number=clm) + SUM('rental_ledger', 'amount', event_type='rental_reimbursement_payment', claim_number=clm) - SUM('rental_ledger', 'amount', event_type='rental_payment_recovery', recovery_source='vendor_credit', claim_number=clm))"
      - result: "RND(MX(0, MN(r_days * ride_day_amt - alt_set, benefit_left)), 2)"
    compute_basis:
      clm: "for the claim's most recent rideshare authorization"
      r_auth: "for the claim's most recent rideshare authorization"
      r_start: "its start date, authorized days and closing end date are read from the rental ledger"
      r_auth_days: "its start date, authorized days and closing end date are read from the rental ledger"
      r_end: "its start date, authorized days and closing end date are read from the rental ledger"
      loss_drivable: "where the claim report records the vehicle as not drivable"
      loss_cause: "for a total theft it is theft_waiting_days calendar days after the report date of the claim"
      report_date: "it is the claim's report date"
      tow_moved: "or where an accident tow was moved from roadside assistance to the claim"
      first_gap: "The first covered rideshare day follows how the loss left the vehicle: for a total theft it is theft_waiting_days calendar days after the report date of the claim; for a loss that is not a theft where the claim report records the vehicle as not drivable, or where an accident tow was moved from roadside assistance to the claim, it is the claim's report date; otherwise it is the start date of the rideshare authorization."
      car_start: "the last covered rideshare day is the day before that rental car's start date"
      car_n: "when a rental car authorization on the claim was entered on the end date of the rideshare authorization's closing"
      last_off: "The last covered rideshare day follows how the rideshare ended: when a rental car authorization on the claim was entered on the end date of the rideshare authorization's closing, the last covered rideshare day is the day before that rental car's start date; when the rideshare authorization has no closing on the ledger, it is the last of its authorized days; otherwise it is the end date of its closing."
      r_days: "The covered rideshare days are counted from the first covered rideshare day through the last covered rideshare day, both included, never fewer than zero."
      r_rate: "The daily rideshare allowance follows the length of the stint and the option: with ride_short_days or fewer covered rideshare days on an option whose daily_limit is ride_rate_limit_floor or more it is ride_rate_short; with more than ride_short_days covered rideshare days on such an option it is ride_rate_long; on an option whose daily_limit is below ride_rate_limit_floor it is the daily_limit."
      ride_pkg_rank: "A package top-up is added to the daily rideshare allowance"
      ride_topup: "ride_topup_high when the auto package's highest allowed rental option rank is 6, ride_topup_mid when it is 4 or 5, and nothing when it is below 4"
      ride_day_amt: "the topped-up allowance is never above the daily_limit."
      alt_on_report: "the full amount paid for alternate transportation with a service date on the claim's report date"
      alt_all: "when alternate transportation was paid only for other service dates, alt_late_share of what was paid, rounded to the cent"
      alt_set: "Alternate transportation already paid by roadside trip interruption is set against the rideshare reimbursement: the full amount paid for alternate transportation with a service date on the claim's report date; when alternate transportation was paid only for other service dates, alt_late_share of what was paid, rounded to the cent; and nothing when none was paid."
      benefit_left: "never above what the per-loss maximum still allows (max_per_loss less the agency and reimbursement payments on the claim, net of agency credits)"
      result: "The rideshare reimbursement is the covered rideshare days times the topped-up rideshare allowance, less the alternate transportation set against it, never below zero and never above what the per-loss maximum still allows, rounded to the cent."
    factors:
      - id: rideshare_first_covered_day
        effect: method
        decides: first_gap
        bindings: [loss_drivable, loss_cause, report_date, tow_moved, first_gap]
        ladder:
          - when: "the claim's cause of loss is a total theft"
            method: "the first covered rideshare day is theft_waiting_days calendar days after the claim's report date"
          - when: "the loss is not a theft AND (the claim report records the vehicle as not drivable OR an accident tow was moved from roadside assistance to the claim)"
            method: "the first covered rideshare day is the claim's report date"
          - when: "otherwise"
            method: "the first covered rideshare day is the start date of the rideshare authorization"
        baseline:
          first_gap: "0"
        evidence: [cross_category, date]
        cross_difficulty: physdmg
      - id: rideshare_last_covered_day
        effect: method
        decides: last_off
        bindings: [car_start, car_n, last_off]
        ladder:
          - when: "a rental car authorization on the claim was entered on the end date of the rideshare authorization's closing"
            method: "the last covered rideshare day is the day before that rental car's start date"
          - when: "the rideshare authorization has no closing on the ledger"
            method: "the last covered rideshare day is the last of its authorized days"
          - when: "otherwise"
            method: "the last covered rideshare day is the end date of its closing"
        baseline:
          last_off: "DAYS(r_start, r_end)"
        evidence: [history, date]
        cross_difficulty: null
      - id: rideshare_daily_allowance
        effect: parameter
        decides: r_rate
        bindings: [r_auth_days, r_days, r_rate]
        ladder:
          - when: "ride_short_days or fewer covered rideshare days AND the option's daily_limit is ride_rate_limit_floor or more"
            value: "K('ride_rate_short')"
          - when: "more than ride_short_days covered rideshare days AND the option's daily_limit is ride_rate_limit_floor or more"
            value: "K('ride_rate_long')"
          - when: "otherwise"
            value: "P('daily_limit')"
        baseline:
          r_rate: "P('daily_limit')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: rideshare_package_topup
        effect: parameter
        decides: ride_topup
        bindings: [ride_pkg_rank, ride_topup]
        ladder:
          - when: "the auto package's highest allowed rental option rank is 6"
            value: "K('ride_topup_high')"
          - when: "the auto package's highest allowed rental option rank is 4 or 5"
            value: "K('ride_topup_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          ride_topup: "0"
        evidence: [cross_category]
        cross_difficulty: auto
      - id: trip_interruption_transport_setoff
        effect: parameter
        decides: alt_set
        bindings: [alt_on_report, alt_all, alt_set]
        ladder:
          - when: "roadside trip interruption paid alternate transportation with a service date on the claim's report date"
            value: "the full amount paid for that alternate transportation"
          - when: "roadside trip interruption paid alternate transportation only for other service dates"
            value: "K('alt_late_share') times what was paid"
          - when: "otherwise"
            value: "0"
        baseline:
          alt_set: "0"
        evidence: [cross_category]
        cross_difficulty: roadside
    inputs:
      history:
        - {table: rental_ledger, aggregate: latest, field: end_date, filters: {event_type: rental_authorization_closed}}
        - {table: rental_ledger, aggregate: latest, field: start_date, filters: {event_type: rental_authorization}}
        - {category: physdmg, table: physdmg_claim_events, aggregate: latest, field: report_date, filters: {event_type: physdmg_claim_report}}
        - {category: roadside, table: roadside_events, aggregate: sum, field: amount, filters: {event_type: roadside_trip_interruption_paid, expense_category: alternate_transportation}}
      cross_category: [physdmg, roadside, auto]

  - id: rental_ext_extension_day_room
    base_policy_refs: [rental_evt_extension_and_end]
    overwrite:
      - base_policy: rental_evt_extension_and_end
        superseded_clause: >-
          An authorization is extended by extension_increment_days at a time, only when the shop confirms a new
          completion date (extension_requires_shop_confirmation) or documents a parts delay
          (parts_delay_extension_allowed), and never beyond max_days_per_loss in total or beyond what the per-loss
          maximum can still pay.
        replaced_by: >-
          The days an extension adds are the lower of extension_increment_days, the day room and the days the per-loss
          maximum can still pay, never fewer than zero, where the day room is the day maximum of the loss plus the
          package days less the agency days counted, the weighted rideshare days, the days billed on reimbursements for
          rentals the customer arranged, and the days authorized on the rental being extended.
      - base_policy: rental_evt_extension_and_end
        superseded_clause: >-
          An extension is granted only while the total days authorized on the claim stay within max_days_per_loss.
        replaced_by: >-
          A comeback adds to the day maximum of the loss: when the claim carries a rental closed because repairs were
          complete together with a supplement estimate (estimate sequence 1 or higher) and the latest estimate was
          written by a Cardinal Select Shop, the day maximum is max_days_per_loss plus comeback_days_select; when the
          claim carries the same closed rental and supplement estimate and the latest estimate was written by a shop
          outside the Select network, it is max_days_per_loss plus comeback_days_nonnetwork; otherwise it is
          max_days_per_loss.
    trigger: on_request
    subject: [rental_extension]
    computes: authorized_days
    target_tool: extend_rental_authorization_97458fea
    params:
      comeback_days_select: 5
      comeback_days_nonnetwork: 2
      ride_weight_low: 0.5
      ride_weight_mid: 0.75
      pkg_days_high: 3
      pkg_days_mid: 1
    rule: >-
      An open rental on an accepted claim is extended when the repair shop confirms a new completion date or documents
      a parts delay, and each extension carries its sequence number on the authorization. The days an extension adds
      are fixed only after the rental it extends stands on the rental ledger as an authorization under the claim. The
      days an extension adds are not settled until every closed partner direct-bill rental on the claim carries an
      agency payment on the rental ledger. Before the days an extension adds are worked out, every closed rideshare,
      taxi or transit authorization on the claim must carry a reimbursement entry on the rental ledger. The rental
      being extended is the claim's most recently entered authorization. Under the standard method the day room of the
      loss is max_days_per_loss less the days already used on the claim, where the days used are the days billed on
      every agency payment and every reimbursement on the claim plus the days authorized on the rental being extended
      (its authorization and every extension of it); the days an extension adds are the lower of
      extension_increment_days, that day room and the days the per-loss maximum can still pay, never fewer than zero.
      The days the per-loss maximum can still pay are max_per_loss less the agency and reimbursement payments on the
      claim net of agency credits, less the days authorized on the rental being extended times the lower of its
      recorded daily rate and the daily_limit, divided by the daily_limit and rounded down to a whole day, never fewer
      than zero. A comeback adds to the day maximum of the loss: when the claim carries a rental closed because repairs
      were complete together with a supplement estimate (estimate sequence 1 or higher) and the latest estimate was
      written by a Cardinal Select Shop, the day maximum is max_days_per_loss plus comeback_days_select; when the claim
      carries the same closed rental and supplement estimate and the latest estimate was written by a shop outside the
      Select network, it is max_days_per_loss plus comeback_days_nonnetwork; otherwise it is max_days_per_loss. Package
      days are added to the day room from the household's auto package: pkg_days_high days when the package's highest
      allowed rental option rank is 6, pkg_days_mid day when that rank is 4 or 5, and none when it is below 4. The
      agency rental's closing allowance follows why the rental the latest agency payment bills closed: a rental closed
      because repairs were complete carries repair_complete_grace_days beyond its authorized days; a rental closed
      because a total-loss settlement was offered carries total_loss_rental_end_days beyond them; a rental closed for
      any other reason carries none. Agency days are counted against the day room as follows: when the days billed on
      the claim's agency payments are more than the authorized days of the authorization the latest agency payment
      bills plus the agency rental's closing allowance and the claim carries no agency credit, the agency days counted
      are those authorized days plus that allowance; when the claim carries an agency credit and agency
      days are billed, they are the days billed less the agency credit divided by the daily_limit and rounded down;
      otherwise they are the days billed. Rideshare days are weighted by what they cost: when the rideshare
      reimbursements on the claim average no more than ride_weight_low of the daily_limit per day billed, each
      rideshare day billed counts as ride_weight_low of a day; when they average more than that but no more than the
      daily_limit, each counts as ride_weight_mid of a day; otherwise each counts as a full day; the weighted rideshare
      days are rounded up to a whole day. The days an extension adds are the lower of extension_increment_days, the day
      room and the days the per-loss maximum can still pay, never fewer than zero, where the day room is the day
      maximum of the loss plus the package days less the agency days counted, the weighted rideshare days, the days
      billed on reimbursements for rentals the customer arranged, and the days authorized on the rental being
      extended.
    baseline:
      rule: >-
        The rental being extended is the claim's most recently entered authorization. Under the standard method the
        day room of the loss is max_days_per_loss less the days already used on the claim, where the days used are the
        days billed on every agency payment and every reimbursement on the claim plus the days authorized on the rental
        being extended (its authorization and every extension of it); the days an extension adds are the lower of
        extension_increment_days, that day room and the days the per-loss maximum can still pay, never fewer than zero.
        The days the per-loss maximum can still pay are max_per_loss less the agency and reimbursement payments on the
        claim net of agency credits, less the days authorized on the rental being extended times the lower of its
        recorded daily rate and the daily_limit, divided by the daily_limit and rounded down to a whole day, never
        fewer than zero.
      params: [max_days_per_loss, extension_increment_days, max_per_loss, daily_limit]
    prerequisite:
      - problem: rental_ext_upgrade_acceptance_days
        kind: value_input
        gate: run_days
        form: state
        policy_source: >-
          The days an extension adds are fixed only after the rental it extends stands on the rental ledger as an
          authorization under the claim.
        condition: >-
          The rental ledger carries an authorization entry under the claim for the rental being extended, so the
          claim's most recently entered authorization is that rental and its authorized days are on record.
        resolved_by: accept_upgraded_rental_aa4639f2
        effect: >-
          Once the customer's acceptance records the larger-class rental as an authorization, the rental being
          extended and its authorized days exist on the ledger, and the days counted for it enter the day room.
      - problem: rental_ext_partner_invoice_settlement
        kind: value_input
        gate: car_billed
        form: state
        policy_source: >-
          The days an extension adds are not settled until every closed partner direct-bill rental on the claim
          carries an agency payment on the rental ledger.
        condition: >-
          Every closed partner direct-bill rental on the claim has an agency payment entry carrying its invoice's
          billed days on the rental ledger.
        resolved_by: pay_partner_rental_invoice_bf34992c
        effect: >-
          The agency payment books the invoice's billed days on the claim, and the agency days counted against the
          day room take their value from them.
      - problem: rental_ext_rideshare_day_allowance
        kind: value_input
        gate: ride_days_billed
        form: state
        policy_source: >-
          Before the days an extension adds are worked out, every closed rideshare, taxi or transit authorization on
          the claim must carry a reimbursement entry on the rental ledger.
        condition: >-
          Every closed rideshare, taxi or transit authorization on the claim has a reimbursement entry carrying its
          receipts' days and the amount reimbursed on the rental ledger.
        resolved_by: submit_rideshare_receipts_3a988a26
        effect: >-
          The rideshare reimbursement books the receipts' days and amount, and the weighted rideshare days counted
          against the day room take their value from them.
    cross_category:
      - category: physdmg
        as: history
        reads: [physdmg_claim_events.estimate_sequence, physdmg_claim_events.repair_shop_type]
        note: The comeback addition to the day maximum rests on the claim's supplement estimate and the shop that wrote it.
      - category: auto
        as: branch
        reads: [variant_name]
        note: The package days added to the day room rest on the auto package's highest allowed rental option rank.
    compute:
      - clm: "LATEST('rental_ledger', 'claim_number', date_field='entry_date')"
      - run_auth: "LATEST('rental_ledger', 'authorization_number', date_field='entry_date', event_type='rental_authorization', claim_number=clm)"
      - run_days: "SUM('rental_ledger', 'authorized_days', event_type='rental_authorization', authorization_number=run_auth) + SUM('rental_ledger', 'authorized_days', event_type='rental_extension', authorization_number=run_auth)"
      - rc_end: "LATEST('rental_ledger', 'end_date', date_field='entry_date', event_type='rental_authorization_closed', close_reason='repairs_complete', claim_number=clm)"
      - supp_seq: "XMAX('physdmg', 'physdmg_claim_events', 'estimate_sequence', event_type='physdmg_estimate_written', claim_number=clm)"
      - shop: "XLATEST('physdmg', 'physdmg_claim_events', 'repair_shop_type', date_field='event_date', event_type='physdmg_estimate_written', claim_number=clm)"
      - comeback_add: "K('comeback_days_select') if (rc_end and supp_seq >= 1 and shop == 'cardinal_select_shop') else (K('comeback_days_nonnetwork') if (rc_end and supp_seq >= 1 and shop == 'non_network_shop') else 0)"
      - day_cap: "P('max_days_per_loss') + comeback_add"
      - xpkg_rank: "CPARAM('auto', 'rental_max_option_rank')"
      - pkg_days: "K('pkg_days_high') if xpkg_rank >= 6 else (K('pkg_days_mid') if xpkg_rank >= 4 else 0)"
      - pay_auth: "LATEST('rental_ledger', 'authorization_number', date_field='entry_date', event_type='rental_vendor_payment', claim_number=clm)"
      - car_billed: "SUM('rental_ledger', 'days_billed', event_type='rental_vendor_payment', claim_number=clm)"
      - car_auth_days: "SUM('rental_ledger', 'authorized_days', event_type='rental_authorization', authorization_number=pay_auth) + SUM('rental_ledger', 'authorized_days', event_type='rental_extension', authorization_number=pay_auth)"
      - pay_reason: "LATEST('rental_ledger', 'close_reason', date_field='entry_date', event_type='rental_authorization_closed', authorization_number=pay_auth)"
      - pay_allow: "P('repair_complete_grace_days') if pay_reason == 'repairs_complete' else (P('total_loss_rental_end_days') if pay_reason == 'total_loss_settlement_offered' else 0)"
      - credit_sum: "SUM('rental_ledger', 'amount', event_type='rental_payment_recovery', recovery_source='vendor_credit', claim_number=clm)"
      - car_days: "(car_auth_days + pay_allow) if (car_billed > car_auth_days + pay_allow and credit_sum == 0) else ((car_billed - int(credit_sum / P('daily_limit'))) if (credit_sum > 0 and car_billed > 0) else car_billed)"
      - ride_days_billed: "SUM('rental_ledger', 'days_billed', event_type='rental_reimbursement_payment', vendor_type='rideshare_taxi_transit', claim_number=clm)"
      - ride_paid: "SUM('rental_ledger', 'amount', event_type='rental_reimbursement_payment', vendor_type='rideshare_taxi_transit', claim_number=clm)"
      - ride_weight: "K('ride_weight_low') if (ride_days_billed > 0 and ride_paid <= ride_days_billed * P('daily_limit') * K('ride_weight_low')) else (K('ride_weight_mid') if (ride_days_billed > 0 and ride_paid <= ride_days_billed * P('daily_limit')) else 1)"
      - ride_counted: "int(ride_days_billed * ride_weight) + (1 if ride_days_billed * ride_weight > int(ride_days_billed * ride_weight) else 0)"
      - own_days: "SUM('rental_ledger', 'days_billed', event_type='rental_reimbursement_payment', vendor_type='other_agency', claim_number=clm)"
      - day_room: "day_cap + pkg_days - car_days - ride_counted - own_days - run_days"
      - paid_net: "SUM('rental_ledger', 'amount', event_type='rental_vendor_payment', claim_number=clm) + SUM('rental_ledger', 'amount', event_type='rental_reimbursement_payment', claim_number=clm) - credit_sum"
      - run_rate: "LATEST('rental_ledger', 'daily_rate', date_field='entry_date', event_type='rental_authorization', authorization_number=run_auth)"
      - afford_days: "int(MX(0, P('max_per_loss') - paid_net - run_days * MN(run_rate, P('daily_limit'))) / P('daily_limit'))"
      - result: "MX(0, MN(P('extension_increment_days'), day_room, afford_days))"
    compute_basis:
      clm: "The rental being extended is the claim's most recently entered authorization."
      run_auth: "The rental being extended is the claim's most recently entered authorization."
      run_days: "plus the days authorized on the rental being extended (its authorization and every extension of it)"
      rc_end: "when the claim carries a rental closed because repairs were complete together with a supplement estimate (estimate sequence 1 or higher)"
      supp_seq: "when the claim carries a rental closed because repairs were complete together with a supplement estimate (estimate sequence 1 or higher)"
      shop: "the latest estimate was written by a Cardinal Select Shop"
      comeback_add: "A comeback adds to the day maximum of the loss: when the claim carries a rental closed because repairs were complete together with a supplement estimate (estimate sequence 1 or higher) and the latest estimate was written by a Cardinal Select Shop, the day maximum is max_days_per_loss plus comeback_days_select; when the claim carries the same closed rental and supplement estimate and the latest estimate was written by a shop outside the Select network, it is max_days_per_loss plus comeback_days_nonnetwork; otherwise it is max_days_per_loss."
      day_cap: "the day maximum is max_days_per_loss plus comeback_days_select"
      pay_auth: "the authorized days of the authorization the latest agency payment bills"
      car_billed: "when the days billed on the claim's agency payments are more than the authorized days of the authorization the latest agency payment bills"
      car_auth_days: "the authorized days of the authorization the latest agency payment bills"
      xpkg_rank: "Package days are added to the day room from the household's auto package"
      pkg_days: "pkg_days_high days when the package's highest allowed rental option rank is 6, pkg_days_mid day when that rank is 4 or 5, and none when it is below 4."
      pay_reason: "The agency rental's closing allowance follows why the rental the latest agency payment bills closed"
      pay_allow: "The agency rental's closing allowance follows why the rental the latest agency payment bills closed: a rental closed because repairs were complete carries repair_complete_grace_days beyond its authorized days; a rental closed because a total-loss settlement was offered carries total_loss_rental_end_days beyond them; a rental closed for any other reason carries none."
      credit_sum: "the claim carries no agency credit"
      car_days: "Agency days are counted against the day room as follows: when the days billed on the claim's agency payments are more than the authorized days of the authorization the latest agency payment bills plus the agency rental's closing allowance and the claim carries no agency credit, the agency days counted are those authorized days plus that allowance; when the claim carries an agency credit and agency days are billed, they are the days billed less the agency credit divided by the daily_limit and rounded down; otherwise they are the days billed."
      ride_days_billed: "when the rideshare reimbursements on the claim average no more than ride_weight_low of the daily_limit per day billed"
      ride_paid: "when the rideshare reimbursements on the claim average no more than ride_weight_low of the daily_limit per day billed"
      ride_weight: "Rideshare days are weighted by what they cost: when the rideshare reimbursements on the claim average no more than ride_weight_low of the daily_limit per day billed, each rideshare day billed counts as ride_weight_low of a day; when they average more than that but no more than the daily_limit, each counts as ride_weight_mid of a day; otherwise each counts as a full day"
      ride_counted: "the weighted rideshare days are rounded up to a whole day."
      own_days: "the days billed on reimbursements for rentals the customer arranged"
      day_room: "where the day room is the day maximum of the loss plus the package days less the agency days counted, the weighted rideshare days, the days billed on reimbursements for rentals the customer arranged, and the days authorized on the rental being extended."
      paid_net: "The days the per-loss maximum can still pay are max_per_loss less the agency and reimbursement payments on the claim net of agency credits"
      run_rate: "less the days authorized on the rental being extended times the lower of its recorded daily rate and the daily_limit"
      afford_days: "The days the per-loss maximum can still pay are max_per_loss less the agency and reimbursement payments on the claim net of agency credits, less the days authorized on the rental being extended times the lower of its recorded daily rate and the daily_limit, divided by the daily_limit and rounded down to a whole day, never fewer than zero."
      result: "The days an extension adds are the lower of extension_increment_days, the day room and the days the per-loss maximum can still pay, never fewer than zero"
    factors:
      - id: comeback_day_maximum_addition
        effect: parameter
        decides: comeback_add
        bindings: [rc_end, supp_seq, shop, comeback_add]
        ladder:
          - when: "a rental on the claim closed because repairs were complete AND a supplement estimate is on the claim AND the latest estimate is from a Cardinal Select Shop"
            value: "K('comeback_days_select')"
          - when: "a rental on the claim closed because repairs were complete AND a supplement estimate is on the claim AND the latest estimate is from a shop outside the Select network"
            value: "K('comeback_days_nonnetwork')"
          - when: "otherwise"
            value: "0"
        baseline:
          comeback_add: "0"
        evidence: [history, cross_category]
        cross_difficulty: physdmg
      - id: agency_days_counted
        effect: method
        decides: car_days
        bindings: [pay_auth, car_billed, car_auth_days, credit_sum, car_days]
        ladder:
          - when: "the days billed on agency payments exceed the authorized days of the authorization the latest agency payment bills plus its closing allowance AND the claim carries no agency credit"
            method: "the agency days counted are that authorization's authorized days plus its closing allowance"
          - when: "the claim carries an agency credit AND agency days are billed"
            method: "the agency days counted are the days billed less the agency credit divided by the daily_limit, rounded down"
          - when: "otherwise"
            method: "the agency days counted are the days billed"
        baseline:
          car_days: "car_billed"
        evidence: [history]
        cross_difficulty: null
      - id: rideshare_day_weight
        effect: parameter
        decides: ride_counted
        bindings: [ride_days_billed, ride_paid, ride_weight, ride_counted]
        ladder:
          - when: "rideshare days are billed on the claim AND the rideshare reimbursements average no more than ride_weight_low of the daily_limit per day billed"
            value: "K('ride_weight_low')"
          - when: "rideshare days are billed on the claim AND the rideshare reimbursements average more than ride_weight_low of the daily_limit but no more than the daily_limit per day billed"
            value: "K('ride_weight_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          ride_counted: "ride_days_billed"
        evidence: [history]
        cross_difficulty: null
      - id: package_day_room_addition
        effect: parameter
        decides: pkg_days
        bindings: [xpkg_rank, pkg_days]
        ladder:
          - when: "the auto package's highest allowed rental option rank is 6"
            value: "K('pkg_days_high')"
          - when: "the auto package's highest allowed rental option rank is 4 or 5"
            value: "K('pkg_days_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          pkg_days: "0"
        evidence: [cross_category]
        cross_difficulty: auto
      - id: agency_rental_closing_allowance
        effect: parameter
        decides: pay_allow
        bindings: [pay_reason, pay_allow]
        ladder:
          - when: "the rental the latest agency payment bills closed because repairs were complete"
            value: "P('repair_complete_grace_days')"
          - when: "the rental the latest agency payment bills closed because a total-loss settlement was offered"
            value: "P('total_loss_rental_end_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          pay_allow: "0"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: rental_ledger, aggregate: sum, field: days_billed, filters: {event_type: rental_vendor_payment}}
        - {table: rental_ledger, aggregate: sum, field: days_billed, filters: {event_type: rental_reimbursement_payment}}
        - {table: rental_ledger, aggregate: sum, field: authorized_days, filters: {event_type: rental_extension}}
        - {category: physdmg, table: physdmg_claim_events, aggregate: max, field: estimate_sequence, filters: {event_type: physdmg_estimate_written}}
      cross_category: [physdmg, auto]

  - id: rental_ext_overbilling_credit
    base_policy_refs: [rental_evt_recovery]
    overwrite: []
    trigger: state_due
    subject: [rental_payment_recovery]
    computes: amount
    target_tool: record_agency_overbilling_credit_d02c6cb6
    params:
      credit_long_days: 14
      credit_share_select_long: 0.90
      credit_share_nonnetwork_long: 0.97
      credit_monthly_block: 28
      credit_monthly_paid_days: 22
      credit_weekly_block: 7
      credit_weekly_paid_days: 6
      credit_delivery_allowance: 25.00
    rule: >-
      An agency credit is taken against the claim's latest agency payment; the payment's billed days, billed daily
      rate and amount, the daily rate recorded on the authorization it bills, that authorization's authorized days
      (with every extension), its closing end date and why it closed are read from the rental ledger, and a credit is
      recorded once per payment. The days the agency should have been paid for are the payment's billed days. Under the standard
      method the amount the agency should have been paid is those days times the lower of the authorization's recorded
      daily rate and the option's daily_limit, plus the charges billed beyond the daily rate (the payment amount less
      its billed days times its billed daily rate); the agency credit is the payment amount less that amount, never
      below zero, rounded to the cent. The closing allowance owed to the agency follows why the billed rental closed: a
      rental closed because repairs were complete is owed repair_complete_grace_days beyond its authorized days; a
      rental closed because a total-loss settlement was offered is owed total_loss_rental_end_days beyond them; a rental
      closed for any other reason is owed none. The days owed to the agency follow the authorization: when the
      payment's billed days are more than the authorized days of the authorization it bills plus the closing allowance
      owed to the agency, they are those authorized days plus that allowance; when the billed days are within that
      total and the closing span (start date through closing end date, both included) is shorter than the billed days,
      they are the closing span; otherwise they are the billed days. The days owed to the agency are billed under the
      partner's rate convention: with credit_monthly_block or more days owed they count in blocks of
      credit_monthly_block days at credit_monthly_paid_days days each and the remaining days one by one; with
      credit_weekly_block or more but fewer than credit_monthly_block days owed they count in blocks of
      credit_weekly_block days at credit_weekly_paid_days days each and the remaining days one by one; any other
      rental counts day by day. The
      partner program share of the rate the agency should have billed follows the repair shop and the rental's length:
      a rental of credit_long_days or more days owed on a claim whose latest estimate is from a Cardinal Select Shop
      takes credit_share_select_long; a rental of credit_long_days or more days owed on a claim whose latest estimate is
      from a shop outside the Select network takes credit_share_nonnetwork_long; any other rental takes the full rate.
      The program share is applied once to the lower of the authorization's recorded daily rate and the daily_limit,
      and the owed day rate is rounded to the cent. Charges billed beyond the daily rate are allowed as follows: when there are such charges and the option
      pays delivery and collection fees (delivery_pickup_fee_covered), no more than credit_delivery_allowance of them
      is allowed; when there are such charges and the option does not pay delivery and collection fees, none of them
      is allowed; otherwise the charges billed beyond the daily rate are allowed as billed. The agency credit is the
      payment amount less the billed days owed times the owed day rate, less the allowed charges, never below zero,
      rounded to the cent; it lowers rental benefit paid and gives the credited amount back to the per-loss benefit.
    baseline:
      rule: >-
        The days the agency should have been paid for are the payment's billed days. Under the standard method the
        amount the agency should have been paid is those days times the lower of the authorization's recorded daily
        rate and the option's daily_limit, plus the charges billed beyond the daily rate (the payment amount less its
        billed days times its billed daily rate); the agency credit is the payment amount less that amount, never
        below zero, rounded to the cent.
      params: [daily_limit]
    prerequisite: []
    cross_category:
      - category: physdmg
        as: history
        reads: [physdmg_claim_events.repair_shop_type]
        note: The partner program share of the owed rate rests on the shop that wrote the claim's latest estimate.
    compute:
      - clm: "LATEST('rental_ledger', 'claim_number', date_field='entry_date')"
      - pay_id: "LATEST('rental_ledger', 'rental_entry_id', date_field='entry_date', event_type='rental_vendor_payment', claim_number=clm)"
      - pay_auth: "LATEST('rental_ledger', 'authorization_number', date_field='entry_date', rental_entry_id=pay_id)"
      - pay_days: "LATEST('rental_ledger', 'days_billed', date_field='entry_date', rental_entry_id=pay_id)"
      - pay_rate: "LATEST('rental_ledger', 'daily_rate', date_field='entry_date', rental_entry_id=pay_id)"
      - pay_amt: "LATEST('rental_ledger', 'amount', date_field='entry_date', rental_entry_id=pay_id)"
      - auth_rate: "LATEST('rental_ledger', 'daily_rate', date_field='entry_date', event_type='rental_authorization', authorization_number=pay_auth)"
      - auth_start: "LATEST('rental_ledger', 'start_date', date_field='entry_date', event_type='rental_authorization', authorization_number=pay_auth)"
      - auth_end: "LATEST('rental_ledger', 'end_date', date_field='entry_date', event_type='rental_authorization_closed', authorization_number=pay_auth)"
      - auth_days: "SUM('rental_ledger', 'authorized_days', event_type='rental_authorization', authorization_number=pay_auth) + SUM('rental_ledger', 'authorized_days', event_type='rental_extension', authorization_number=pay_auth)"
      - close_span: "(DAYS(auth_start, auth_end) + 1) if auth_end else 0"
      - auth_reason: "LATEST('rental_ledger', 'close_reason', date_field='entry_date', event_type='rental_authorization_closed', authorization_number=pay_auth)"
      - owed_allow: "P('repair_complete_grace_days') if auth_reason == 'repairs_complete' else (P('total_loss_rental_end_days') if auth_reason == 'total_loss_settlement_offered' else 0)"
      - owed_days: "(auth_days + owed_allow) if pay_days > auth_days + owed_allow else (close_span if (auth_end and close_span < pay_days) else pay_days)"
      - pay_vendor: "LATEST('rental_ledger', 'vendor_type', date_field='entry_date', event_type='rental_authorization', authorization_number=pay_auth)"
      - owed_billable: "(int(owed_days / K('credit_monthly_block')) * K('credit_monthly_paid_days') + owed_days - int(owed_days / K('credit_monthly_block')) * K('credit_monthly_block')) if (pay_vendor == 'partner_direct_bill' and owed_days >= K('credit_monthly_block')) else ((int(owed_days / K('credit_weekly_block')) * K('credit_weekly_paid_days') + owed_days - int(owed_days / K('credit_weekly_block')) * K('credit_weekly_block')) if (pay_vendor == 'partner_direct_bill' and owed_days >= K('credit_weekly_block')) else owed_days)"
      - shop: "XLATEST('physdmg', 'physdmg_claim_events', 'repair_shop_type', date_field='event_date', event_type='physdmg_estimate_written', claim_number=clm)"
      - prog_share: "K('credit_share_select_long') if (shop == 'cardinal_select_shop' and owed_days >= K('credit_long_days')) else (K('credit_share_nonnetwork_long') if (shop == 'non_network_shop' and owed_days >= K('credit_long_days')) else 1)"
      - owed_rate: "RND(MN(auth_rate, P('daily_limit')) * prog_share, 2)"
      - extra_billed: "RND(MX(0, pay_amt - pay_days * pay_rate), 2)"
      - extra_allowed: "MN(extra_billed, K('credit_delivery_allowance')) if (extra_billed > 0 and P('delivery_pickup_fee_covered')) else (0 if (extra_billed > 0 and not P('delivery_pickup_fee_covered')) else extra_billed)"
      - result: "RND(MX(0, pay_amt - RND(owed_billable * owed_rate, 2) - extra_allowed), 2)"
    compute_basis:
      clm: "An agency credit is taken against the claim's latest agency payment"
      pay_id: "An agency credit is taken against the claim's latest agency payment"
      pay_auth: "the daily rate recorded on the authorization it bills"
      pay_days: "the payment's billed days, billed daily rate and amount"
      pay_rate: "the payment's billed days, billed daily rate and amount"
      pay_amt: "the payment's billed days, billed daily rate and amount"
      auth_rate: "the daily rate recorded on the authorization it bills"
      auth_start: "that authorization's authorized days (with every extension), its closing end date and why it closed are read from the rental ledger"
      auth_end: "that authorization's authorized days (with every extension), its closing end date and why it closed are read from the rental ledger"
      auth_days: "that authorization's authorized days (with every extension), its closing end date and why it closed are read from the rental ledger"
      auth_reason: "The closing allowance owed to the agency follows why the billed rental closed"
      owed_allow: "The closing allowance owed to the agency follows why the billed rental closed: a rental closed because repairs were complete is owed repair_complete_grace_days beyond its authorized days; a rental closed because a total-loss settlement was offered is owed total_loss_rental_end_days beyond them; a rental closed for any other reason is owed none."
      pay_vendor: "The days owed to the agency are billed under the partner's rate convention"
      owed_billable: "with credit_monthly_block or more days owed they count in blocks of credit_monthly_block days at credit_monthly_paid_days days each and the remaining days one by one; with credit_weekly_block or more but fewer than credit_monthly_block days owed they count in blocks of credit_weekly_block days at credit_weekly_paid_days days each and the remaining days one by one; any other rental counts day by day."
      close_span: "the closing span (start date through closing end date, both included)"
      owed_days: "The days owed to the agency follow the authorization: when the payment's billed days are more than the authorized days of the authorization it bills plus the closing allowance owed to the agency, they are those authorized days plus that allowance; when the billed days are within that total and the closing span (start date through closing end date, both included) is shorter than the billed days, they are the closing span; otherwise they are the billed days."
      shop: "a rental of credit_long_days or more days owed on a claim whose latest estimate is from a Cardinal Select Shop takes credit_share_select_long"
      prog_share: "The partner program share of the rate the agency should have billed follows the repair shop and the rental's length: a rental of credit_long_days or more days owed on a claim whose latest estimate is from a Cardinal Select Shop takes credit_share_select_long; a rental of credit_long_days or more days owed on a claim whose latest estimate is from a shop outside the Select network takes credit_share_nonnetwork_long; any other rental takes the full rate."
      owed_rate: "The program share is applied once to the lower of the authorization's recorded daily rate and the daily_limit, and the owed day rate is rounded to the cent."
      extra_billed: "plus the charges billed beyond the daily rate (the payment amount less its billed days times its billed daily rate)"
      extra_allowed: "Charges billed beyond the daily rate are allowed as follows: when there are such charges and the option pays delivery and collection fees (delivery_pickup_fee_covered), no more than credit_delivery_allowance of them is allowed; when there are such charges and the option does not pay delivery and collection fees, none of them is allowed; otherwise the charges billed beyond the daily rate are allowed as billed."
      result: "The agency credit is the payment amount less the billed days owed times the owed day rate, less the allowed charges, never below zero, rounded to the cent"
    factors:
      - id: agency_days_owed
        effect: method
        decides: owed_days
        bindings: [auth_start, auth_end, auth_days, close_span, owed_days]
        ladder:
          - when: "the payment's billed days are more than the authorized days of the authorization it bills plus the closing allowance"
            method: "the days owed are the authorized days of the authorization and its extensions plus the closing allowance"
          - when: "the billed days are within the authorized days plus the closing allowance AND the closing span is shorter than the billed days"
            method: "the days owed are the closing span, start date through closing end date, both included"
          - when: "otherwise"
            method: "the days owed are the payment's billed days"
        baseline:
          owed_days: "pay_days"
        evidence: [history, date]
        cross_difficulty: null
      - id: credit_program_share
        effect: parameter
        decides: prog_share
        bindings: [shop, prog_share]
        ladder:
          - when: "the latest estimate on the claim is from a Cardinal Select Shop AND credit_long_days or more days are owed"
            value: "K('credit_share_select_long')"
          - when: "the latest estimate on the claim is from a shop outside the Select network AND credit_long_days or more days are owed"
            value: "K('credit_share_nonnetwork_long')"
          - when: "otherwise"
            value: "1"
        baseline:
          prog_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: physdmg
      - id: agency_closing_allowance_owed
        effect: parameter
        decides: owed_allow
        bindings: [auth_reason, owed_allow]
        ladder:
          - when: "the billed rental closed because repairs were complete"
            value: "P('repair_complete_grace_days')"
          - when: "the billed rental closed because a total-loss settlement was offered"
            value: "P('total_loss_rental_end_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          owed_allow: "0"
        evidence: [history]
        cross_difficulty: null
      - id: owed_rate_convention
        effect: method
        decides: owed_billable
        bindings: [pay_vendor, owed_billable]
        ladder:
          - when: "the billed rental is a partner direct-bill rental AND credit_monthly_block or more days are owed"
            method: "blocks of credit_monthly_block days count at credit_monthly_paid_days days each, the remaining days one by one"
          - when: "the billed rental is a partner direct-bill rental AND credit_weekly_block or more but fewer than credit_monthly_block days are owed"
            method: "blocks of credit_weekly_block days count at credit_weekly_paid_days days each, the remaining days one by one"
          - when: "otherwise"
            method: "the days owed count day by day"
        baseline:
          owed_billable: "owed_days"
        evidence: [history]
        cross_difficulty: null
      - id: billed_extras_allowed
        effect: parameter
        decides: extra_allowed
        bindings: [pay_amt, extra_billed, extra_allowed]
        ladder:
          - when: "charges were billed beyond the daily rate AND the option pays delivery and collection fees"
            value: "no more than K('credit_delivery_allowance') of those charges"
          - when: "charges were billed beyond the daily rate AND the option does not pay delivery and collection fees"
            value: "0"
          - when: "otherwise"
            value: "the charges billed beyond the daily rate, as billed"
        baseline:
          extra_allowed: "extra_billed"
        evidence: [history, tier_param]
        cross_difficulty: null
    inputs:
      history:
        - {table: rental_ledger, aggregate: latest, field: amount, filters: {event_type: rental_vendor_payment}}
        - {table: rental_ledger, aggregate: sum, field: authorized_days, filters: {event_type: rental_extension}}
        - {category: physdmg, table: physdmg_claim_events, aggregate: latest, field: repair_shop_type, filters: {event_type: physdmg_estimate_written}}
      cross_category: [physdmg]

  - id: rental_ext_own_rental_reimbursement
    base_policy_refs: [rental_agg_per_loss_benefit, rental_evt_payment, rental_combo_physdmg_and_builtin]
    overwrite:
      - base_policy: rental_evt_payment
        superseded_clause: >-
          Each covered rental day is paid at the lower of the agency's daily rate and the option's daily_limit, taxes
          and fees counted inside the limit where daily_limit_includes_taxes; only days inside the authorization are
          covered, and the total on the claim never exceeds max_per_loss.
        replaced_by: >-
          The daily amount of a customer-arranged rental is held to the partner price on the claim: when the claim
          carries a partner direct-bill authorization and the customer-arranged rental's recorded rate is above the
          rate recorded on the most recently entered partner authorization, the daily amount is that partner rate; when
          the claim carries a partner direct-bill authorization and the recorded rate is not above that partner rate,
          the daily amount is the recorded rate; otherwise it is the lower of the recorded rate and the daily_limit.
      - base_policy: rental_evt_payment
        superseded_clause: >-
          Within those limits the payment is the covered days times the covered daily amount, capped at what the
          per-loss maximum still allows (rental_msr_benefit_used).
        replaced_by: >-
          The reimbursement for a customer-arranged rental is its covered days times the topped-up daily amount, never
          below zero and never above what the per-loss maximum still allows, rounded to the cent.
    trigger: on_request
    subject: [rental_reimbursement_payment]
    computes: amount
    target_tool: submit_own_rental_receipts_258c32b3
    params:
      own_topup_high: 3.00
      own_topup_mid: 1.50
    rule: >-
      A rental the customer arranged at an agency outside the partner network is reimbursed when the customer submits
      its receipts personally, for the claim's most recent authorization of a customer-arranged rental; its start date,
      recorded daily rate, authorized days and closing end date are read from the rental ledger, and receipts are
      reimbursed only when submitted no later than receipt_submit_days calendar days after the rental ended. A
      reimbursement for a rental the customer arranged is not made until every agency payment on the claim that billed
      a higher daily rate than its authorization recorded carries an agency credit entry against it. The covered days
      of a customer-arranged rental run from its start date through the end date of its closing, both days included.
      Under the standard method each covered day is paid at the lower of the recorded daily rate and the option's
      daily_limit, and the reimbursement is the covered days times that daily amount, never above what the per-loss
      maximum still allows (max_per_loss less the agency and reimbursement payments on the claim, net of agency
      credits), rounded to the cent. The first covered day of a customer-arranged rental follows the loss and the
      repair path: for a total theft it is the later of the start date and the day theft_waiting_days calendar days
      after the claim's report date; for a loss that is not a theft where the claim carries a rental closed because
      repairs were complete and its latest estimate is a supplement (estimate sequence 1 or higher) dated later than
      the customer-arranged rental's start date, it is the date of that supplement estimate, the day the shop records
      the vehicle back for the supplemental repair; otherwise it is the start date. The last covered day of a
      customer-arranged rental follows how it ended: when a rental car authorization on the claim was entered on the end
      date of the customer-arranged rental's closing, the last covered day is the day before that car's start date; when the customer-arranged rental has no closing on the ledger, it is the
      last of its authorized days; otherwise it is the end date of its closing. The covered days of a customer-arranged
      rental are counted from its first covered day through its last covered day, both included, never fewer than
      zero. The daily amount of a customer-arranged rental is held to the partner price on the claim: when the claim
      carries a partner direct-bill authorization and the customer-arranged rental's recorded rate is above the rate
      recorded on the most recently entered partner authorization, the daily amount is that partner rate; when the
      claim carries a partner direct-bill authorization and the recorded rate is not above that partner rate, the daily
      amount is the recorded rate; otherwise it is the lower of the recorded rate and the daily_limit. A package top-up
      is added to that daily amount: own_topup_high when the auto package's highest allowed rental option rank is 6,
      own_topup_mid when it is 4 or 5, and nothing when it is below 4; the topped-up daily amount is never above the
      recorded rate or the daily_limit. The reimbursement for a customer-arranged rental is its covered days times the
      topped-up daily amount, never below zero and never above what the per-loss maximum still allows, rounded to the
      cent.
    baseline:
      rule: >-
        The covered days of a customer-arranged rental run from its start date through the end date of its closing,
        both days included. Under the standard method each covered day is paid at the lower of the recorded daily rate
        and the option's daily_limit, and the reimbursement is the covered days times that daily amount, never above
        what the per-loss maximum still allows (max_per_loss less the agency and reimbursement payments on the claim,
        net of agency credits), rounded to the cent.
      params: [daily_limit, max_per_loss]
    prerequisite:
      - problem: rental_ext_overbilling_credit
        kind: value_input
        gate: benefit_left
        form: state
        policy_source: >-
          A reimbursement for a rental the customer arranged is not made until every agency payment on the claim that
          billed a higher daily rate than its authorization recorded carries an agency credit entry against it.
        condition: >-
          Every agency payment on the claim whose billed daily rate is above the daily rate recorded on the
          authorization it bills has an agency credit entry taken against it on the rental ledger.
        resolved_by: record_agency_overbilling_credit_d02c6cb6
        effect: >-
          The agency credit lowers the rental benefit paid on the claim and gives the credited amount back to the
          per-loss benefit, so what the per-loss maximum still allows for the reimbursement rises by that amount.
    cross_category:
      - category: physdmg
        as: history
        reads: [physdmg_claim_events.estimate_sequence, physdmg_claim_events.event_date, physdmg_claim_events.loss_cause, physdmg_claim_events.report_date]
        note: The first covered day rests on the claim report (cause and report date) and the supplement estimate.
      - category: auto
        as: branch
        reads: [variant_name]
        note: The package top-up rests on the auto package's highest allowed rental option rank.
    compute:
      - clm: "LATEST('rental_ledger', 'claim_number', date_field='entry_date')"
      - o_auth: "LATEST('rental_ledger', 'authorization_number', date_field='entry_date', event_type='rental_authorization', vendor_type='other_agency', claim_number=clm)"
      - o_start: "LATEST('rental_ledger', 'start_date', date_field='entry_date', event_type='rental_authorization', authorization_number=o_auth)"
      - o_rate: "LATEST('rental_ledger', 'daily_rate', date_field='entry_date', event_type='rental_authorization', authorization_number=o_auth)"
      - o_auth_days: "SUM('rental_ledger', 'authorized_days', event_type='rental_authorization', authorization_number=o_auth) + SUM('rental_ledger', 'authorized_days', event_type='rental_extension', authorization_number=o_auth)"
      - o_end: "LATEST('rental_ledger', 'end_date', date_field='entry_date', event_type='rental_authorization_closed', authorization_number=o_auth)"
      - rc_n: "COUNT('rental_ledger', event_type='rental_authorization_closed', close_reason='repairs_complete', claim_number=clm)"
      - supp_seq: "XLATEST('physdmg', 'physdmg_claim_events', 'estimate_sequence', date_field='event_date', event_type='physdmg_estimate_written', claim_number=clm)"
      - supp_date: "XLATEST('physdmg', 'physdmg_claim_events', 'event_date', date_field='event_date', event_type='physdmg_estimate_written', claim_number=clm)"
      - loss_cause: "XLATEST('physdmg', 'physdmg_claim_events', 'loss_cause', date_field='event_date', event_type='physdmg_claim_report', claim_number=clm)"
      - loss_report: "XLATEST('physdmg', 'physdmg_claim_events', 'report_date', date_field='event_date', event_type='physdmg_claim_report', claim_number=clm)"
      - first_off: "MX(0, DAYS(o_start, loss_report) + P('theft_waiting_days')) if loss_cause == 'theft_total' else (DAYS(o_start, supp_date) if (loss_cause != 'theft_total' and rc_n >= 1 and supp_seq >= 1 and supp_date > o_start) else 0)"
      - car_n: "COUNT('rental_ledger', event_type='rental_authorization', claim_number=clm, entry_date=o_end)"
      - car_start: "LATEST('rental_ledger', 'start_date', date_field='entry_date', event_type='rental_authorization', claim_number=clm, entry_date=o_end)"
      - last_off: "(DAYS(o_start, car_start) - 1) if (o_end and car_n >= 1) else ((o_auth_days - 1) if not o_end else DAYS(o_start, o_end))"
      - o_days: "MX(0, last_off + 1 - first_off)"
      - partner_rate: "LATEST('rental_ledger', 'daily_rate', date_field='entry_date', event_type='rental_authorization', vendor_type='partner_direct_bill', claim_number=clm)"
      - comp_rate: "partner_rate if (partner_rate and o_rate > partner_rate) else (o_rate if (partner_rate and o_rate <= partner_rate) else MN(o_rate, P('daily_limit')))"
      - pkg_rank: "CPARAM('auto', 'rental_max_option_rank')"
      - topup: "K('own_topup_high') if pkg_rank >= 6 else (K('own_topup_mid') if pkg_rank >= 4 else 0)"
      - day_amt: "MN(comp_rate + topup, o_rate, P('daily_limit'))"
      - benefit_left: "P('max_per_loss') - (SUM('rental_ledger', 'amount', event_type='rental_vendor_payment', claim_number=clm) + SUM('rental_ledger', 'amount', event_type='rental_reimbursement_payment', claim_number=clm) - SUM('rental_ledger', 'amount', event_type='rental_payment_recovery', recovery_source='vendor_credit', claim_number=clm))"
      - result: "RND(MX(0, MN(o_days * day_amt, benefit_left)), 2)"
    compute_basis:
      clm: "for the claim's most recent authorization of a customer-arranged rental"
      o_auth: "for the claim's most recent authorization of a customer-arranged rental"
      o_start: "its start date, recorded daily rate, authorized days and closing end date are read from the rental ledger"
      o_rate: "its start date, recorded daily rate, authorized days and closing end date are read from the rental ledger"
      o_auth_days: "its start date, recorded daily rate, authorized days and closing end date are read from the rental ledger"
      o_end: "its start date, recorded daily rate, authorized days and closing end date are read from the rental ledger"
      rc_n: "where the claim carries a rental closed because repairs were complete and its latest estimate is a supplement (estimate sequence 1 or higher) dated later than the customer-arranged rental's start date"
      supp_seq: "its latest estimate is a supplement (estimate sequence 1 or higher)"
      supp_date: "it is the date of that supplement estimate"
      loss_cause: "for a total theft it is the later of the start date and the day theft_waiting_days calendar days after the claim's report date"
      loss_report: "the day theft_waiting_days calendar days after the claim's report date"
      first_off: "The first covered day of a customer-arranged rental follows the loss and the repair path: for a total theft it is the later of the start date and the day theft_waiting_days calendar days after the claim's report date; for a loss that is not a theft where the claim carries a rental closed because repairs were complete and its latest estimate is a supplement (estimate sequence 1 or higher) dated later than the customer-arranged rental's start date, it is the date of that supplement estimate, the day the shop records the vehicle back for the supplemental repair; otherwise it is the start date."
      car_n: "when a rental car authorization on the claim was entered on the end date of the customer-arranged rental's closing"
      car_start: "the last covered day is the day before that car's start date"
      last_off: "The last covered day of a customer-arranged rental follows how it ended: when a rental car authorization on the claim was entered on the end date of the customer-arranged rental's closing, the last covered day is the day before that car's start date; when the customer-arranged rental has no closing on the ledger, it is the last of its authorized days; otherwise it is the end date of its closing."
      o_days: "The covered days of a customer-arranged rental are counted from its first covered day through its last covered day, both included, never fewer than zero."
      partner_rate: "the rate recorded on the most recently entered partner authorization"
      comp_rate: "The daily amount of a customer-arranged rental is held to the partner price on the claim: when the claim carries a partner direct-bill authorization and the customer-arranged rental's recorded rate is above the rate recorded on the most recently entered partner authorization, the daily amount is that partner rate; when the claim carries a partner direct-bill authorization and the recorded rate is not above that partner rate, the daily amount is the recorded rate; otherwise it is the lower of the recorded rate and the daily_limit."
      pkg_rank: "A package top-up is added to that daily amount"
      topup: "own_topup_high when the auto package's highest allowed rental option rank is 6, own_topup_mid when it is 4 or 5, and nothing when it is below 4"
      day_amt: "the topped-up daily amount is never above the recorded rate or the daily_limit."
      benefit_left: "never above what the per-loss maximum still allows (max_per_loss less the agency and reimbursement payments on the claim, net of agency credits)"
      result: "The reimbursement for a customer-arranged rental is its covered days times the topped-up daily amount, never below zero and never above what the per-loss maximum still allows, rounded to the cent."
    factors:
      - id: own_rental_first_covered_day
        effect: method
        decides: first_off
        bindings: [rc_n, supp_seq, supp_date, loss_cause, loss_report, first_off]
        ladder:
          - when: "the claim's cause of loss is a total theft"
            method: "the first covered day is the later of the start date and the day theft_waiting_days calendar days after the claim's report date"
          - when: "the loss is not a theft AND a rental on the claim closed because repairs were complete AND the latest estimate is a supplement dated later than the customer-arranged rental's start date"
            method: "the first covered day is the date of that supplement estimate"
          - when: "otherwise"
            method: "the first covered day is the start date"
        baseline:
          first_off: "0"
        evidence: [history, cross_category, date]
        cross_difficulty: physdmg
      - id: own_rental_last_covered_day
        effect: method
        decides: last_off
        bindings: [car_n, car_start, last_off]
        ladder:
          - when: "a rental car authorization on the claim was entered on the end date of the customer-arranged rental's closing"
            method: "the last covered day is the day before that car's start date"
          - when: "the customer-arranged rental has no closing on the ledger"
            method: "the last covered day is the last of its authorized days"
          - when: "otherwise"
            method: "the last covered day is the end date of its closing"
        baseline:
          last_off: "DAYS(o_start, o_end)"
        evidence: [history, date]
        cross_difficulty: null
      - id: partner_price_hold
        effect: parameter
        decides: comp_rate
        bindings: [partner_rate, comp_rate]
        ladder:
          - when: "the claim carries a partner direct-bill authorization AND the customer-arranged rate is above the most recently entered partner rate"
            value: "that partner rate"
          - when: "the claim carries a partner direct-bill authorization AND the customer-arranged rate is not above that partner rate"
            value: "the customer-arranged recorded rate"
          - when: "otherwise"
            value: "MN(recorded rate, P('daily_limit'))"
        baseline:
          comp_rate: "MN(o_rate, P('daily_limit'))"
        evidence: [history]
        cross_difficulty: null
      - id: package_daily_topup
        effect: parameter
        decides: topup
        bindings: [pkg_rank, topup]
        ladder:
          - when: "the auto package's highest allowed rental option rank is 6"
            value: "K('own_topup_high')"
          - when: "the auto package's highest allowed rental option rank is 4 or 5"
            value: "K('own_topup_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          topup: "0"
        evidence: [cross_category]
        cross_difficulty: auto
    inputs:
      history:
        - {table: rental_ledger, aggregate: latest, field: daily_rate, filters: {event_type: rental_authorization}}
        - {table: rental_ledger, aggregate: count, field: rental_entry_id, filters: {event_type: rental_authorization_closed, close_reason: repairs_complete}}
        - {table: rental_ledger, aggregate: sum, field: amount, filters: {event_type: rental_payment_recovery, recovery_source: vendor_credit}}
        - {category: physdmg, table: physdmg_claim_events, aggregate: latest, field: event_date, filters: {event_type: physdmg_estimate_written}}
      cross_category: [physdmg, auto]
