events:
  # ---- holding writes (sr22_filings) --------------------------------------------------------
  - type: sr22_request
    target: sr22_filings
    mutation: create
    meaning: A financial-responsibility filing is requested for a listed driver against a state order on file.
    grain: One row per filing (driver, ordering state, certificate).
    fields:
      filing_id: Filing reference.
      customer_id: Named insured.
      policy_id: Policy certified.
      driver_id: Driver the order names.
      order_id: State order the filing answers.
      variant_name: Certificate type.
      filing_state: Ordering state that receives the filing.
      requested_date: Date requested.
      certificate_effective_date: Effective date printed on the certificate.
    triggers:
      - event: auto:auto_filing_flag_update
        map: {policy_id: policy_id, financial_responsibility_filing: true}
      - event: sr22:sr22_fee_assessed
        map: {filing_id: filing_id, customer_id: customer_id, fee_reason: new_filing}
  - type: sr22_transmit
    target: sr22_filings
    mutation: {transition: {from: requested, to: filed}}
    meaning: The certificate is transmitted to the ordering state.
    grain: One row per transaction.
    fields:
      status: Set to filed.
      filing_id: Filing transmitted.
      customer_id: Named insured.
    triggers:
      - event: sr22:sr22_transmission
        map: {filing_id: filing_id, customer_id: customer_id, transmission_type: original}
  - type: sr22_state_accept
    target: sr22_filings
    mutation: {transition: {from: filed, to: accepted}}
    meaning: The state acknowledges the certificate.
    grain: One row per transaction.
    fields:
      status: Set to accepted.
      accepted_date: Date of the acknowledgment.
    triggers: []
  - type: sr22_state_reject
    target: sr22_filings
    mutation: {transition: {from: filed, to: rejected}}
    meaning: The state rejects the certificate.
    grain: One row per transaction.
    fields:
      status: Set to rejected.
    triggers: []
  - type: sr22_refile
    target: sr22_filings
    mutation: {transition: {from: rejected, to: filed}}
    meaning: A corrected certificate is transmitted after a rejection.
    grain: One row per transaction.
    fields:
      status: Set to filed.
      filing_id: Filing corrected.
      customer_id: Named insured.
    triggers:
      - event: sr22:sr22_transmission
        map: {filing_id: filing_id, customer_id: customer_id, transmission_type: corrected_refiling}
  - type: sr22_withdraw
    target: sr22_filings
    mutation:
      transition:
        - {from: requested, to: released}
        - {from: rejected, to: released}
    meaning: A request is closed before any accepted certificate exists (customer withdrawal, or no correction in time).
    grain: One row per transaction.
    fields:
      status: Set to released.
      end_date: Date closed.
    triggers: []
  - type: sr22_sr26_filed
    target: sr22_filings
    mutation: {transition: {from: accepted, to: cancel_notified}}
    meaning: An SR-26 cancellation notice is transmitted because the underlying policy ended.
    grain: One row per transaction.
    fields:
      status: Set to cancel_notified.
      policy_id: Policy that ended.
      filing_id: Filing being cancelled.
      customer_id: Named insured.
      sr26_effective_date: Date the SR-26 takes effect.
    triggers:
      - event: sr22:sr22_transmission
        map: {filing_id: filing_id, customer_id: customer_id, transmission_type: sr26_cancellation}
  - type: sr22_reinstatement_filing
    target: sr22_filings
    mutation: {transition: {from: cancel_notified, to: accepted}}
    meaning: A reinstatement filing restores the certificate because the policy was reinstated before the SR-26 took effect.
    grain: One row per transaction.
    fields:
      status: Set to accepted.
      policy_id: Policy reinstated.
      filing_id: Filing restored.
      customer_id: Named insured.
      sr26_effective_date: Cleared.
    triggers:
      - event: sr22:sr22_transmission
        map: {filing_id: filing_id, customer_id: customer_id, transmission_type: reinstatement}
      - event: sr22:sr22_fee_assessed
        map: {filing_id: filing_id, customer_id: customer_id, fee_reason: reinstatement_filing}
  - type: sr22_lapse
    target: sr22_filings
    mutation: {transition: {from: cancel_notified, to: lapsed}}
    meaning: The SR-26 takes effect and the certificate lapses.
    grain: One row per transaction.
    fields:
      status: Set to lapsed.
      end_date: The SR-26 effective date.
    triggers: []
  - type: sr22_release
    target: sr22_filings
    mutation: {transition: {from: accepted, to: released}}
    meaning: The requirement has ended and the filing is released with a notice to the state.
    grain: One row per transaction.
    fields:
      status: Set to released.
      end_date: Date released.
      filing_id: Filing released.
      customer_id: Named insured.
    triggers:
      - event: sr22:sr22_transmission
        map: {filing_id: filing_id, customer_id: customer_id, transmission_type: release_notice}
  # ---- event-table writes (sr22_ledger) -----------------------------------------------------
  - type: sr22_fee_assessed
    target: sr22_ledger
    meaning: A filing fee is assessed on the filing and sent to billing.
    grain: One row per fee occurrence on a filing.
    distinguish_by: [fee_reason, transmission_number]
    fields:
      sr22_entry_id: Ledger entry reference.
      filing_id: Filing.
      customer_id: Named insured.
      fee_reason: Why the fee is due.
      transmission_number: Transmission the fee belongs to (empty for the new-filing fee, which is keyed by the filing).
      fee_amount: Fee amount, USD.
      entry_date: Date assessed.
    triggers:
      - event: billing:billing_fee_charged
        map: {customer_id: customer_id, source_transaction_id: sr22_entry_id, amount: fee_amount, fee_type: sr22_filing_fee}
  - type: sr22_transmission
    target: sr22_ledger
    meaning: One document (certificate, corrected certificate, amendment, reinstatement filing, SR-26 or release notice) is transmitted to the state.
    grain: One row per transmission.
    distinguish_by: [transmission_number]
    fields:
      sr22_entry_id: Ledger entry reference.
      filing_id: Filing.
      customer_id: Named insured.
      transmission_number: Transmission confirmation number.
      transmission_type: What was transmitted.
      transmitted_date: Business day of transmission.
      entry_date: Date recorded.
    triggers: []
  - type: sr22_state_response
    target: sr22_ledger
    meaning: The state's acknowledgment or rejection of one transmission is recorded.
    grain: One row per state response.
    distinguish_by: [transmission_number]
    fields:
      sr22_entry_id: Ledger entry reference.
      filing_id: Filing.
      customer_id: Named insured.
      transmission_number: Transmission answered.
      response_code: Accepted, or the rejection code.
      response_date: Date of the response.
      entry_date: Date recorded.
    triggers:
      - event: sr22:sr22_state_accept
        when: {response_code: accepted}
        map: {accepted_date: response_date}
      - event: sr22:sr22_state_reject
        when: {response_code: {not: accepted}}
        map: {}
  - type: sr22_amended_filing
    target: sr22_ledger
    meaning: An amended certificate is transmitted because a certified fact changed (vehicle, address, policy number or name).
    grain: One row per amendment.
    distinguish_by: [amendment_reason, transmission_number]
    fields:
      sr22_entry_id: Ledger entry reference.
      filing_id: Filing amended.
      customer_id: Named insured.
      amendment_reason: Which fact changed.
      transmission_number: Transmission carrying the amendment.
      source_transaction_id: The auto endorsement that made the amendment necessary (empty for a name or address change).
      entry_date: Date recorded.
    triggers:
      - event: sr22:sr22_fee_assessed
        map: {filing_id: filing_id, customer_id: customer_id, transmission_number: transmission_number, fee_reason: amended_filing}

measures:
  - id: sr22_msr_active_filings_driver_state
    window: Current state of the household's filings.
    measure: Count of sr22_filings rows for the driver and filing_state whose status is requested, filed, accepted, rejected or cancel_notified.
  - id: sr22_msr_transmissions_version
    window: One filing version (from the last request, correction or amendment).
    measure: Count of sr22_transmission rows of the filing since that version was created.

policies:
  - id: sr22_agg_multi_holding
    subject: [sr22_request]
    rule: >-
      A household may hold filings for several drivers, and one driver may need filings for more than one ordering
      state, so there is no cap per customer. A driver may have only max_active_filings_per_driver_per_state open filing
      with one ordering state (sr22_msr_active_filings_driver_state). A new filing is requested only when the driver has no
      open filing with the same ordering state; an existing open filing is corrected, amended or reinstated instead.
    eligibility:
      - id: one_open_filing_per_driver_state
        applies_to: [sr22_request]
        kind: dedup
        condition: "A new filing is requested only when the driver has no open filing with the same ordering state; an existing open filing is corrected, amended or reinstated instead."
        evidence_fields: [sr22_filings.driver_id, sr22_filings.filing_state, sr22_filings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sr22_filings.driver_id, sr22_filings.filing_state]
          action_bindings:
            sr22_filings.driver_id: driver_id
            sr22_filings.filing_state: filing_state
        dedup_contract:
          table: sr22_filings
          mode: separate_record
          object_bindings: {driver_id: driver_id, filing_state: filing_state}
          duplicate_filters: {status: [requested, filed, accepted, rejected, cancel_notified]}
          distinct_fields: []
    measures: [sr22_msr_active_filings_driver_state]
    params:
      max_per_customer: null

  - id: sr22_agg_policy_filings
    subject: [sr22_sr26_filed, sr22_reinstatement_filing, sr22_lapse, sr22_release, sr22_withdraw]
    rule: >-
      Every filing certifies one auto policy, and all filings on a policy follow that policy: when the policy is cancelled
      for any reason, nonrenewed or expires unpaid, an SR-26 is transmitted for every accepted filing on it where the
      certificate's sr26_on_ switches are true, and when the policy is reinstated, every filing still cancel_notified on it
      is restored. The policy's financial-responsibility indicator stays on while any filing on the policy is requested,
      filed, accepted, rejected or cancel_notified, and is switched off when the last of them is released or lapses.
    eligibility: []

  - id: sr22_request_eligibility
    subject: [sr22_request]
    rule: >-
      A filing is requested only for a driver named on a state order on file whose order_type and issuing state the
      certificate serves: an sr22_required order with an SR-22 certificate, an fr44_required order with an FR-44
      certificate, and the ordering state must be in the certificate's eligible_filing_states; an order from a state no
      certificate serves cannot be filed. The certificate type follows the order and the driver: an order from a state
      where Cardinal writes policies takes an in-state certificate and any other served state takes an out-of-state
      certificate; the owner certificate fits a filed driver who owns every vehicle they drive and all of those are
      scheduled on the policy, and the owner-operator certificate is required when the filed driver also drives vehicles
      they do not own or that are not on the policy. The filed driver must be a rated driver on the policy, never an
      excluded one. A filing is requested only for a driver who is listed as a rated driver on the policy on the request
      date. The policy's package must have sr22_eligible true, the billing account's plan must have
      financial_responsibility_plan_allowed true, and the policy's bodily injury and property damage limits must be at
      least the ordering state's figures in required_limits_by_state. The certificate's effective date is set by
      filing_effective_date_rule and is never backdated. The name, date of birth, license number and case number on the
      request must match the state order exactly (order_match_fields). State reinstatement and administrative fees are
      paid by the driver to the state and are never collected by Cardinal.
    eligibility:
      - id: order_on_file
        applies_to: [sr22_request]
        kind: caller_fact
        condition: "A filing is requested only for a driver named on a state order on file whose order_type and issuing state the certificate serves"
        evidence_fields: [state_orders.order_type, state_orders.issuing_state, state_orders.driver_id, state_orders.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [state_orders.order_id]
          action_bindings:
            state_orders.order_id: order_id
      - id: driver_rated_on_policy
        applies_to: [sr22_request]
        kind: caller_fact
        condition: "A filing is requested only for a driver who is listed as a rated driver on the policy on the request date."
        evidence_fields: [auto_transactions.driver_id, auto_transactions.event_type, auto_transactions.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [auto_transactions.policy_id, auto_transactions.driver_id]
          action_bindings:
            auto_transactions.policy_id: policy_id
            auto_transactions.driver_id: driver_id

  - id: sr22_evt_fees
    subject: [sr22_fee_assessed]
    rule: >-
      A new filing carries the certificate's filing_fee. A corrected refiling after a rejection carries
      refiling_fee_after_rejection, an amendment carries amended_filing_fee, a reinstatement filing carries
      reinstatement_filing_fee and a release notice carries release_filing_fee; a fee of 0.00 is not assessed. A lapsed
      certificate needs a new filing with a new filing_fee where new_filing_required_after_lapse is true. Each fee is
      assessed once per occurrence and billed to the policy's billing account as a filing fee tied to the assessment.
    eligibility: []
    params:
      per_tier:
        Cardinal SR-22 Owner Certificate: {filing_fee: "=filing_fee", amended_filing_fee: "=amended_filing_fee", reinstatement_filing_fee: "=reinstatement_filing_fee"}
        Cardinal SR-22 Owner-Operator Certificate: {filing_fee: "=filing_fee", amended_filing_fee: "=amended_filing_fee", reinstatement_filing_fee: "=reinstatement_filing_fee"}
        Cardinal Out-of-State SR-22 Owner Certificate: {filing_fee: "=filing_fee", amended_filing_fee: "=amended_filing_fee", reinstatement_filing_fee: "=reinstatement_filing_fee"}
        Cardinal Out-of-State SR-22 Owner-Operator Certificate: {filing_fee: "=filing_fee", amended_filing_fee: "=amended_filing_fee", reinstatement_filing_fee: "=reinstatement_filing_fee"}
        Cardinal FR-44 Owner Certificate: {filing_fee: "=filing_fee", amended_filing_fee: "=amended_filing_fee", reinstatement_filing_fee: "=reinstatement_filing_fee"}
        Cardinal FR-44 Owner-Operator Certificate: {filing_fee: "=filing_fee", amended_filing_fee: "=amended_filing_fee", reinstatement_filing_fee: "=reinstatement_filing_fee"}

  - id: sr22_transmission_and_response
    subject: [sr22_transmit, sr22_transmission, sr22_state_response, sr22_state_accept, sr22_state_reject, sr22_refile, sr22_withdraw]
    rule: >-
      A certificate is transmitted by the certificate's transmission_method within transmission_business_days business
      days (business_calendar) after the request, a request after transmission_cutoff_time counting as received the next
      business day. When no response arrives within ack_followup_business_days, Cardinal follows up with the state; a
      version is transmitted at most max_transmission_attempts times (sr22_msr_transmissions_version). An acknowledgment
      makes the filing accepted and a copy of the certificate goes to the customer within certificate_copy_delivery_days.
      A rejection with a code in company_correctable_rejections is corrected and refiled by Cardinal; a rejection with a
      code in customer_correctable_rejections needs corrected information from the customer. A rejected filing is refiled only
      when the corrected information is received no later than rejection_correction_days calendar days after the state's
      rejection. The count runs from the response_date of the rejection, that date being day 0, and information
      received on the last day is in time. Without a correction in time the request is closed and a later correction
      starts a new request.
    eligibility:
      - id: correction_in_time
        applies_to: [sr22_refile]
        kind: time
        condition: "A rejected filing is refiled only when the corrected information is received no later than rejection_correction_days calendar days after the state's rejection."
        evidence_fields: [sr22_ledger.response_date, sr22_ledger.transmission_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sr22_ledger.transmission_number]
          action_bindings:
            sr22_ledger.transmission_number: transmission_number
        temporal_basis:
          clock: frozen_time
          anchor_event: the state's rejection
          anchor_source: sr22_ledger.response_date
          relation: not_after
          duration_source: variants.rejection_correction_days
          unit: calendar_days
          counting_rule: "The count runs from the response_date of the rejection, that date being day 0, and information received on the last day is in time."
          boundary: inclusive
    measures: [sr22_msr_transmissions_version]

  - id: sr22_sr26_cancellation
    subject: [sr22_sr26_filed, sr22_lapse, sr22_transmission]
    rule: >-
      When the certified policy ends, Cardinal must tell the state: an SR-26 is transmitted for every accepted filing on
      the policy on the date the policy cancellation, nonrenewal or expiration takes effect, as switched by
      sr26_on_insured_cancellation, sr26_on_nonpayment_cancellation, sr26_on_nonrenewal and sr26_on_expiration. The SR-26
      takes effect sr26_notice_lead_days_by_state calendar days after its transmission for the filing_state; the
      certificate remains proof of financial responsibility until then, and lapses on that date. A driver whose
      certificate lapsed needs a new filing (new_filing_required_after_lapse), and the state may suspend the driver's
      license; Cardinal does not intervene in state suspensions.
    eligibility: []

  - id: sr22_reinstatement_filing_rule
    subject: [sr22_reinstatement_filing, sr22_fee_assessed]
    rule: >-
      When the certified policy is reinstated, a reinstatement filing restores each certificate on it that is still
      cancel_notified, carrying reinstatement_filing_fee. A reinstatement filing is made only when the policy is
      reinstated before the SR-26 effective date of the filing. The SR-26 effective date on the filing record is the
      boundary, and a reinstatement on that date or later is too late. A certificate that has already lapsed is not
      reinstated; a new filing is requested instead.
    eligibility:
      - id: before_sr26_effective
        applies_to: [sr22_reinstatement_filing]
        kind: time
        condition: "A reinstatement filing is made only when the policy is reinstated before the SR-26 effective date of the filing."
        evidence_fields: [sr22_filings.sr26_effective_date, sr22_filings.filing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sr22_filings.filing_id]
          action_bindings:
            sr22_filings.filing_id: filing_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the SR-26 effective date of the filing
          anchor_source: sr22_filings.sr26_effective_date
          relation: not_after
          duration_source: variants.reinstatement_filing_cutoff_days
          unit: calendar_days
          counting_rule: "The SR-26 effective date on the filing record is the boundary, and a reinstatement on that date or later is too late."
          boundary: exclusive

  - id: sr22_release_rule
    subject: [sr22_release]
    rule: >-
      A filing may be released at the customer's request once the state's requirement has ended. A filing is released
      only when the request comes no earlier than release_earliest_days_after_required_through calendar days after the
      required through date on the state order. The days count from the required_through_date on the order, that date
      being day 0, so a request on the first day after it qualifies. A release before then would leave the driver without
      proof and is declined; the customer may instead keep the certificate, which continues through renewals where
      continuous_until_cancelled. Where release_files_notice is true a release notice is transmitted to the state.
    eligibility:
      - id: requirement_ended
        applies_to: [sr22_release]
        kind: time
        condition: "A filing is released only when the request comes no earlier than release_earliest_days_after_required_through calendar days after the required through date on the state order."
        evidence_fields: [state_orders.required_through_date, state_orders.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [state_orders.order_id]
          action_bindings:
            state_orders.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the required through date on the state order
          anchor_source: state_orders.required_through_date
          relation: not_before
          duration_source: variants.release_earliest_days_after_required_through
          unit: calendar_days
          counting_rule: "The days count from the required_through_date on the order, that date being day 0, so a request on the first day after it qualifies."
          boundary: inclusive

  - id: sr22_amendments
    subject: [sr22_amended_filing, sr22_fee_assessed]
    rule: >-
      An amended certificate is transmitted when a certified fact changes: a scheduled vehicle is added, replaced or
      removed on a certificate that lists vehicles (amendment_on_vehicle_change), the mailing address changes where
      amendment_on_address_change, the policy number changes, or the filed driver's legal name changes. An amendment is
      transmitted only while the filing status is filed or accepted. The amendment carries amended_filing_fee, once per
      amendment. A change that the certificate does not certify needs no amendment.
    eligibility:
      - id: filing_open_for_amendment
        applies_to: [sr22_amended_filing]
        kind: state
        condition: "An amendment is transmitted only while the filing status is filed or accepted."
        evidence_fields: [sr22_filings.status, sr22_filings.filing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sr22_filings.filing_id]
          action_bindings:
            sr22_filings.filing_id: filing_id
        state_contract:
          field: sr22_filings.status
          allowed: [filed, accepted]

# ============================================================================
# extended_policies: the multi-factor filing-charge policies of the sr22_financial_responsibility_filings
# difficulty (erl-task-instantiate). Each one is one problem, resolved by one call of its target_tool.
# ============================================================================
extended_policies:
- id: sr22_ext_reinstatement_filing_charge
  base_policy_refs: [sr22_agg_policy_filings, sr22_reinstatement_filing_rule, sr22_evt_fees, sr22_amendments, sr22_transmission_and_response,
    sr22_sr26_cancellation]
  overwrite:
  - base_policy: sr22_evt_fees
    superseded_clause: a reinstatement filing carries reinstatement_filing_fee
    replaced_by: >-
      The reinstatement filing charge is the restoration core charge plus the restoration mailing charge, the restoration
      plan charge and the restoration schedule-check charge, the sum rounded to the cent, and it is booked once, on the
      reinstatement transmission.
  - base_policy: sr22_reinstatement_filing_rule
    superseded_clause: carrying reinstatement_filing_fee
    replaced_by: >-
      The reinstatement filing charge is the restoration core charge plus the restoration mailing charge, the restoration
      plan charge and the restoration schedule-check charge, the sum rounded to the cent, and it is booked once, on the
      reinstatement transmission.
  trigger: state_due
  subject: [sr22_reinstatement_filing, sr22_transmission, sr22_fee_assessed]
  computes: reinstatement_charge
  target_tool: restore_certificate_8ba85022
  params: {bounce_restore_surcharge: 10.00, repeat_restore_surcharge: 5.00, long_tenure_months: 84, mid_tenure_months: 36,
    long_tenure_pct: 20, mid_tenure_pct: 10, courier_window_days: 5, courier_charge: 24.50, certified_mail_charge: 9.85,
    monthly_plan_charge: 4.00, split_plan_charge: 2.00, schedule_check_charge: 6.00, single_change_check_charge: 3.00}
  rule: >-
    As the standard method, a reinstatement filing is charged the restoration rate, which is the certificate's reinstatement_filing_fee,
    and the reinstatement filing charge is that rate booked to the cent. The refinements below apply to the customers they
    name, and a customer none of them names pays the standard charge. A window of a number of months covers the entries
    dated less than that many whole months before today, whole months being counted from the entry's date to today. Where
    the filing's record shows a reinstatement transmission within the past 24 months and the named insured's billing ledger
    shows a returned payment within the past 12 months, the restoration rate is the certificate's reinstatement_filing_fee
    plus bounce_restore_surcharge; where the filing's record shows a reinstatement transmission within the past 24 months
    and the billing ledger shows no returned payment within the past 12 months, the restoration rate is the certificate's
    reinstatement_filing_fee plus repeat_restore_surcharge; where the filing's record shows no reinstatement transmission
    within the past 24 months, the restoration rate is the certificate's reinstatement_filing_fee. The restoration courtesy
    percentage follows the whole months from the certified policy's inception date to today: long_tenure_months or more
    earn long_tenure_pct percent, at least mid_tenure_months but fewer than long_tenure_months earn mid_tenure_pct percent,
    and fewer than mid_tenure_months earn none. The restoration rate is reduced by the restoration courtesy percentage and
    rounded to the cent, giving the adjusted restoration rate. The restoration core charge follows how the certified policy's
    cancellation was cured, the cure days being the calendar days from the policy's cancellation effective date to the posting
    date of the latest reinstatement fee on the billing ledger: where the cure days are no more than the billing plan's
    reinstatement_without_lapse_days and the billing account is enrolled in automatic payment, the core charge is half the
    adjusted restoration rate rounded down to the whole dollar; where the cure days are no more than reinstatement_without_lapse_days
    and the billing account is not enrolled in automatic payment, the core charge is three quarters of the adjusted restoration
    rate rounded up to the whole dollar; where the cure days exceed reinstatement_without_lapse_days, or no cancellation
    effective date or reinstatement fee is on record, the core charge is the adjusted restoration rate as it stands. The
    restoration mailing charge follows how the certificate travels and the calendar days left from today to the filing's
    SR-26 effective date: a certificate sent by paper mail with courier_window_days or fewer days left carries courier_charge,
    a certificate sent by paper mail with more than courier_window_days days left carries certified_mail_charge, and a certificate
    sent electronically carries none. The restoration plan charge follows the installment interval of the certified policy's
    billing plan: an interval of one month carries monthly_plan_charge, an interval longer than one month carries split_plan_charge,
    and a plan with no installments carries none. The restoration schedule-check charge counts the vehicle additions, replacements
    and removals and the garaging changes recorded on the named insured's policies within the past month: two or more carry
    schedule_check_charge, exactly one carries single_change_check_charge, and none carry nothing. The reinstatement filing
    charge is the restoration core charge plus the restoration mailing charge, the restoration plan charge and the restoration
    schedule-check charge, the sum rounded to the cent, and it is booked once, on the reinstatement transmission. State
    reinstatement fees are not part of this charge.
  prerequisite: []
  cross_category:
  - category: billing
    as: history
    reads: [billing_ledger.event_type, billing_ledger.posted_date, billing_ledger.fee_type, autopay_enrolled, reinstatement_without_lapse_days,
      installment_interval_months]
    note: >-
      The restoration rate reads returned payments on the billing ledger; the restoration core charge reads the latest reinstatement
      fee posting, automatic payment and the plan's lapse-free days; the restoration plan charge reads the plan's installment
      interval.
  - category: auto
    as: history
    reads: [inception_date, cancellation_effective_date, auto_transactions.event_type, auto_transactions.recorded_date]
    note: >-
      The restoration courtesy percentage reads the certified policy's inception date; the restoration core charge reads
      its cancellation effective date; the restoration schedule-check charge counts the vehicle and garaging endorsements
      recorded in the past month.
  compute:
  - restorations_24m: >-
      COUNT('sr22_ledger', within_months=24, date_field='entry_date', event_type='sr22_transmission', transmission_type='reinstatement')
  - returned_12m: >-
      XCOUNT('billing', 'billing_ledger', within_months=12, date_field='posted_date', event_type='billing_payment_returned')
  - restore_rate: >-
      P('reinstatement_filing_fee') + K('bounce_restore_surcharge') if (restorations_24m >= 1 and returned_12m >= 1) else
      (P('reinstatement_filing_fee') + K('repeat_restore_surcharge') if (restorations_24m >= 1 and returned_12m == 0) else
      P('reinstatement_filing_fee'))
  - {tenure_months: 'MONTHS(CFIELD(''auto'', ''inception_date'', policy_id=F(''policy_id'')), NOW)'}
  - restore_courtesy_pct: >-
      K('long_tenure_pct') if tenure_months >= K('long_tenure_months') else (K('mid_tenure_pct') if tenure_months >= K('mid_tenure_months')
      else 0)
  - {restore_adjusted: 'RND(restore_rate * (100 - restore_courtesy_pct) / 100, 2)'}
  - {cancel_effective: 'CFIELD(''auto'', ''cancellation_effective_date'', policy_id=F(''policy_id''))'}
  - cure_posted: >-
      XLATEST('billing', 'billing_ledger', 'posted_date', date_field='posted_date', event_type='billing_fee_charged', fee_type='reinstatement_fee')
  - {cure_days: 'DAYS(cancel_effective, cure_posted) if (cancel_effective and cure_posted) else 9999'}
  - {lapse_free_days: 'CPARAM(''billing'', ''reinstatement_without_lapse_days'', policy_id=F(''policy_id''))'}
  - {on_autopay: 'CFIELD(''billing'', ''autopay_enrolled'', policy_id=F(''policy_id''))'}
  - restore_core: >-
      float(int(restore_adjusted / 2)) if (cure_days <= lapse_free_days and on_autopay == True) else (float(-((-(restore_adjusted
      * 3 / 4)) // 1)) if (cure_days <= lapse_free_days and on_autopay != True) else restore_adjusted)
  - {days_to_sr26: 'DAYS(NOW, F(''sr26_effective_date'')) if F(''sr26_effective_date'') else 0'}
  - restore_mailing: >-
      K('courier_charge') if (P('transmission_method') == 'paper_mail' and days_to_sr26 <= K('courier_window_days')) else
      (K('certified_mail_charge') if (P('transmission_method') == 'paper_mail' and days_to_sr26 > K('courier_window_days'))
      else 0)
  - {plan_interval: 'CPARAM(''billing'', ''installment_interval_months'', policy_id=F(''policy_id''))'}
  - {restore_plan_charge: K('monthly_plan_charge') if plan_interval == 1 else (K('split_plan_charge') if plan_interval >
      1 else 0)}
  - schedule_changes_1m: >-
      XCOUNT('auto', 'auto_transactions', within_months=1, date_field='recorded_date', event_type='auto_vehicle_add') +
      XCOUNT('auto', 'auto_transactions', within_months=1, date_field='recorded_date', event_type='auto_vehicle_replace')
      + XCOUNT('auto', 'auto_transactions', within_months=1, date_field='recorded_date', event_type='auto_vehicle_remove')
      + XCOUNT('auto', 'auto_transactions', within_months=1, date_field='recorded_date', event_type='auto_garaging_change')
  - restore_schedule_charge: >-
      K('schedule_check_charge') if schedule_changes_1m >= 2 else (K('single_change_check_charge') if schedule_changes_1m
      == 1 else 0)
  - {result: 'RND(restore_core + restore_mailing + restore_plan_charge + restore_schedule_charge, 2)'}
  compute_basis:
    restorations_24m: Where the filing's record shows a reinstatement transmission within the past 24 months
    returned_12m: the named insured's billing ledger shows a returned payment within the past 12 months
    restore_rate: >-
      Where the filing's record shows a reinstatement transmission within the past 24 months and the named insured's billing
      ledger shows a returned payment within the past 12 months, the restoration rate is the certificate's reinstatement_filing_fee
      plus bounce_restore_surcharge; where the filing's record shows a reinstatement transmission within the past 24 months
      and the billing ledger shows no returned payment within the past 12 months, the restoration rate is the certificate's
      reinstatement_filing_fee plus repeat_restore_surcharge; where the filing's record shows no reinstatement transmission
      within the past 24 months, the restoration rate is the certificate's reinstatement_filing_fee.
    tenure_months: >-
      The restoration courtesy percentage follows the whole months from the certified policy's inception date to today
    restore_courtesy_pct: >-
      long_tenure_months or more earn long_tenure_pct percent, at least mid_tenure_months but fewer than long_tenure_months
      earn mid_tenure_pct percent, and fewer than mid_tenure_months earn none.
    restore_adjusted: >-
      The restoration rate is reduced by the restoration courtesy percentage and rounded to the cent, giving the adjusted
      restoration rate.
    cancel_effective: >-
      the cure days being the calendar days from the policy's cancellation effective date to the posting date of the latest
      reinstatement fee on the billing ledger
    cure_posted: the posting date of the latest reinstatement fee on the billing ledger
    cure_days: >-
      or no cancellation effective date or reinstatement fee is on record, the core charge is the adjusted restoration rate
      as it stands.
    lapse_free_days: where the cure days are no more than the billing plan's reinstatement_without_lapse_days
    on_autopay: the billing account is enrolled in automatic payment
    restore_core: >-
      where the cure days are no more than the billing plan's reinstatement_without_lapse_days and the billing account is
      enrolled in automatic payment, the core charge is half the adjusted restoration rate rounded down to the whole dollar;
      where the cure days are no more than reinstatement_without_lapse_days and the billing account is not enrolled in automatic
      payment, the core charge is three quarters of the adjusted restoration rate rounded up to the whole dollar; where
      the cure days exceed reinstatement_without_lapse_days, or no cancellation effective date or reinstatement fee is on
      record, the core charge is the adjusted restoration rate as it stands.
    days_to_sr26: the calendar days left from today to the filing's SR-26 effective date
    restore_mailing: >-
      a certificate sent by paper mail with courier_window_days or fewer days left carries courier_charge, a certificate
      sent by paper mail with more than courier_window_days days left carries certified_mail_charge, and a certificate sent
      electronically carries none.
    plan_interval: The restoration plan charge follows the installment interval of the certified policy's billing plan
    restore_plan_charge: >-
      an interval of one month carries monthly_plan_charge, an interval longer than one month carries split_plan_charge,
      and a plan with no installments carries none.
    schedule_changes_1m: >-
      The restoration schedule-check charge counts the vehicle additions, replacements and removals and the garaging changes
      recorded on the named insured's policies within the past month
    restore_schedule_charge: >-
      two or more carry schedule_check_charge, exactly one carries single_change_check_charge, and none carry nothing.
    result: >-
      The reinstatement filing charge is the restoration core charge plus the restoration mailing charge, the restoration
      plan charge and the restoration schedule-check charge, the sum rounded to the cent, and it is booked once, on the
      reinstatement transmission.
  factors:
  - id: restoration_rate
    effect: parameter
    decides: restore_rate
    bindings: [restorations_24m, returned_12m, restore_rate]
    ladder:
    - when: >-
        the filing's record shows a reinstatement transmission within the past 24 months and the named insured's billing
        ledger shows a returned payment within the past 12 months
      value: P('reinstatement_filing_fee') + K('bounce_restore_surcharge')
    - when: >-
        the filing's record shows a reinstatement transmission within the past 24 months and the billing ledger shows no
        returned payment within the past 12 months
      value: P('reinstatement_filing_fee') + K('repeat_restore_surcharge')
    - {when: otherwise (no reinstatement transmission on the filing's record within the past 24 months), value: P('reinstatement_filing_fee')}
    baseline: {restore_rate: P('reinstatement_filing_fee')}
    evidence: [history, cross_category]
    cross_difficulty: billing
  - id: restoration_courtesy
    effect: parameter
    decides: restore_courtesy_pct
    bindings: [tenure_months, restore_courtesy_pct]
    ladder:
    - {when: long_tenure_months or more whole months from the certified policy's inception date to today, value: K('long_tenure_pct')}
    - {when: at least mid_tenure_months but fewer than long_tenure_months whole months, value: K('mid_tenure_pct')}
    - {when: otherwise (fewer than mid_tenure_months whole months), value: '0'}
    baseline: {restore_courtesy_pct: '0'}
    evidence: [date, cross_category]
    cross_difficulty: auto
  - id: restoration_cure_path
    effect: method
    decides: restore_core
    bindings: [cancel_effective, cure_posted, cure_days, lapse_free_days, on_autopay, restore_core]
    ladder:
    - when: >-
        cure days no more than the billing plan's reinstatement_without_lapse_days and the billing account enrolled in automatic
        payment
      method: half the adjusted restoration rate, rounded down to the whole dollar
    - when: >-
        cure days no more than reinstatement_without_lapse_days and the billing account not enrolled in automatic payment
      method: three quarters of the adjusted restoration rate, rounded up to the whole dollar
    - when: >-
        otherwise (cure days beyond reinstatement_without_lapse_days, or no cancellation effective date or reinstatement
        fee on record)
      method: the adjusted restoration rate as it stands
    baseline: {restore_core: restore_adjusted}
    evidence: [date, cross_category]
    cross_difficulty: billing
  - id: restoration_mailing
    effect: parameter
    decides: restore_mailing
    bindings: [days_to_sr26, restore_mailing]
    ladder:
    - when: >-
        a certificate sent by paper mail and courier_window_days or fewer calendar days left to the filing's SR-26 effective
        date
      value: K('courier_charge')
    - {when: a certificate sent by paper mail and more than courier_window_days days left, value: K('certified_mail_charge')}
    - {when: otherwise (a certificate sent electronically), value: '0'}
    baseline: {restore_mailing: '0'}
    evidence: [date, tier_param]
    cross_difficulty: null
  - id: restoration_plan
    effect: parameter
    decides: restore_plan_charge
    bindings: [plan_interval, restore_plan_charge]
    ladder:
    - {when: the certified policy's billing plan bills installments one month apart, value: K('monthly_plan_charge')}
    - {when: the billing plan bills installments more than one month apart, value: K('split_plan_charge')}
    - {when: otherwise (a plan with no installments), value: '0'}
    baseline: {restore_plan_charge: '0'}
    evidence: [cross_category]
    cross_difficulty: billing
  - id: restoration_schedule_check
    effect: parameter
    decides: restore_schedule_charge
    bindings: [schedule_changes_1m, restore_schedule_charge]
    ladder:
    - when: >-
        two or more vehicle additions, replacements, removals or garaging changes recorded on the named insured's policies
        within the past month
      value: K('schedule_check_charge')
    - {when: exactly one such endorsement recorded within the past month, value: K('single_change_check_charge')}
    - {when: otherwise (none recorded within the past month), value: '0'}
    baseline: {restore_schedule_charge: '0'}
    evidence: [history, cross_category]
    cross_difficulty: auto
  baseline:
    rule: >-
      As the standard method, a reinstatement filing is charged the restoration rate, which is the certificate's reinstatement_filing_fee,
      and the reinstatement filing charge is that rate booked to the cent.
    params: [reinstatement_filing_fee]
  inputs:
    history:
    - table: sr22_ledger
      aggregate: count
      field: transmission_type
      within_months: 24
      filters: {event_type: sr22_transmission, transmission_type: reinstatement}
    - category: billing
      table: billing_ledger
      aggregate: count
      field: event_type
      within_months: 12
      filters: {event_type: billing_payment_returned}
    - category: billing
      table: billing_ledger
      aggregate: latest
      field: posted_date
      filters: {event_type: billing_fee_charged, fee_type: reinstatement_fee}
    - category: auto
      table: auto_transactions
      aggregate: count
      field: event_type
      within_months: 1
      filters:
        event_type: [auto_vehicle_add, auto_vehicle_replace, auto_vehicle_remove, auto_garaging_change]
    cross_category: [billing, auto]
- id: sr22_ext_vehicle_amendment_charge
  base_policy_refs: [sr22_amendments, sr22_evt_fees, sr22_reinstatement_filing_rule, sr22_transmission_and_response, sr22_sr26_cancellation]
  overwrite:
  - base_policy: sr22_amendments
    superseded_clause: The amendment carries amended_filing_fee, once per amendment.
    replaced_by: >-
      The vehicle amendment charge is the vehicle-amendment line charge plus the vehicle-report lateness charge, the vehicle-amendment
      envelope charge and the vehicle-amendment standing surcharge, the sum rounded to the cent, and it is booked once per
      vehicle amendment, on its transmission.
  - base_policy: sr22_evt_fees
    superseded_clause: an amendment carries amended_filing_fee
    replaced_by: >-
      The vehicle amendment charge is the vehicle-amendment line charge plus the vehicle-report lateness charge, the vehicle-amendment
      envelope charge and the vehicle-amendment standing surcharge, the sum rounded to the cent, and it is booked once per
      vehicle amendment, on its transmission.
  trigger: state_due
  subject: [sr22_amended_filing, sr22_transmission, sr22_fee_assessed]
  computes: vehicle_amendment_charge
  target_tool: amend_certificate_vehicles_869f2144
  params: {standard_change_rate: 15.00, first_change_rate: 10.00, frequent_change_rate: 20.00, late_report_days: 30, slow_report_days: 14,
    late_report_charge: 15.00, slow_report_charge: 7.50, enclosure_charge: 1.25, certified_mail_charge: 9.85, standing_surcharge: 5.00,
    returned_only_surcharge: 2.50}
  rule: >-
    A vehicle amendment reports to the ordering state one vehicle endorsement of the certified policy on a certificate that
    lists the scheduled vehicles. As the standard method, a vehicle amendment is charged the vehicle-amendment rate, which
    is standard_change_rate on every certificate type, and the vehicle amendment charge is that rate booked to the cent.
    The refinements below apply to the customers they name, and a customer none of them names pays the standard charge.
    A window of a number of months covers the entries dated less than that many whole months before today, whole months
    being counted from the entry's date to today. Where the filing's record shows no amendment within the past 12 months,
    the vehicle-amendment rate is first_change_rate; where it shows two or more amendments within the past 12 months, the
    vehicle-amendment rate is frequent_change_rate; where it shows exactly one, the vehicle-amendment rate is standard_change_rate.
    The vehicle-amendment line charge follows the vehicle endorsements recorded on the named insured's policies within the
    past month: where a vehicle replacement was recorded, the rate is charged for each of the two vehicle lines the amendment
    prints, the vehicle coming on and the vehicle going off, so the line charge is twice the rate; where no replacement
    but a vehicle removal was recorded, the line charge is half the rate rounded down to the whole dollar; otherwise the
    line charge is the rate once. The vehicle-report lateness charge follows the reporting delay of the vehicle replacement
    recorded within the past month, counted in calendar days from that endorsement's effective date to the date it was recorded:
    a delay of more than late_report_days days carries late_report_charge, a delay of more than slow_report_days but no
    more than late_report_days days carries slow_report_charge, and a delay of slow_report_days days or fewer, or no replacement
    recorded within the past month, carries none. The vehicle-amendment envelope charge follows how the certificate travels
    and whether the filing's record shows a reinstatement transmission sent today: a certificate sent by paper mail that
    rides in the envelope of a reinstatement transmission sent today carries enclosure_charge, a certificate sent by paper
    mail with no reinstatement transmission sent today carries certified_mail_charge, and a certificate sent electronically
    carries none. The vehicle-amendment standing surcharge follows the named insured's billing ledger within the past 12
    months: a returned payment together with a notice of cancellation carries standing_surcharge, a returned payment with
    no notice of cancellation carries returned_only_surcharge, and no returned payment carries none. A vehicle amendment
    charge is fixed only after every SR-26 cancellation transmitted on the filing is followed on the filing's record by
    a reinstatement transmission. The vehicle amendment charge is the vehicle-amendment line charge plus the vehicle-report
    lateness charge, the vehicle-amendment envelope charge and the vehicle-amendment standing surcharge, the sum rounded
    to the cent, and it is booked once per vehicle amendment, on its transmission. A vehicle change on a certificate that
    does not list vehicles needs no amendment and carries no charge.
  prerequisite:
  - problem: sr22_ext_reinstatement_filing_charge
    kind: value_input
    gate: restored_today
    form: state
    policy_source: >-
      A vehicle amendment charge is fixed only after every SR-26 cancellation transmitted on the filing is followed on the
      filing's record by a reinstatement transmission.
    condition: >-
      Every SR-26 cancellation transmission on the filing's record is followed on that record by a reinstatement transmission.
    resolved_by: restore_certificate_8ba85022
    effect: >-
      The reinstatement transmission entered by the restoration is dated today, so restored_today becomes 1 and the vehicle-amendment
      envelope charge falls from certified_mail_charge to enclosure_charge on a paper-mail certificate; the filing status
      returns to accepted, which also satisfies the amendment's open-filing gate.
  cross_category:
  - category: auto
    as: history
    reads: [auto_transactions.event_type, auto_transactions.effective_date, auto_transactions.recorded_date]
    note: >-
      The vehicle-amendment line charge and the vehicle-report lateness charge read the vehicle endorsements recorded on
      the named insured's policies within the past month.
  - category: billing
    as: history
    reads: [billing_ledger.event_type, billing_ledger.posted_date]
    note: >-
      The vehicle-amendment standing surcharge counts returned payments and notices of cancellation on the billing ledger
      within the past 12 months.
  compute:
  - {amendments_12m: 'COUNT(''sr22_ledger'', within_months=12, date_field=''entry_date'', event_type=''sr22_amended_filing'')'}
  - vehicle_change_rate: >-
      K('first_change_rate') if amendments_12m == 0 else (K('frequent_change_rate') if amendments_12m >= 2 else K('standard_change_rate'))
  - replacements_1m: >-
      XCOUNT('auto', 'auto_transactions', within_months=1, date_field='recorded_date', event_type='auto_vehicle_replace')
  - removals_1m: >-
      XCOUNT('auto', 'auto_transactions', within_months=1, date_field='recorded_date', event_type='auto_vehicle_remove')
  - vehicle_line_charge: >-
      vehicle_change_rate * 2 if replacements_1m >= 1 else (float(int(vehicle_change_rate / 2)) if removals_1m >= 1 else
      vehicle_change_rate)
  - replacement_effective: >-
      XLATEST('auto', 'auto_transactions', 'effective_date', date_field='recorded_date', event_type='auto_vehicle_replace')
  - replacement_recorded: >-
      XLATEST('auto', 'auto_transactions', 'recorded_date', date_field='recorded_date', event_type='auto_vehicle_replace')
  - {vehicle_report_delay: 'DAYS(replacement_effective, replacement_recorded) if replacements_1m >= 1 else 0'}
  - vehicle_report_charge: >-
      K('late_report_charge') if vehicle_report_delay > K('late_report_days') else (K('slow_report_charge') if vehicle_report_delay
      > K('slow_report_days') else 0)
  - {restored_today: 'COUNT(''sr22_ledger'', event_type=''sr22_transmission'', transmission_type=''reinstatement'', transmitted_date=NOW)'}
  - vehicle_envelope_charge: >-
      K('enclosure_charge') if (P('transmission_method') == 'paper_mail' and restored_today >= 1) else (K('certified_mail_charge')
      if (P('transmission_method') == 'paper_mail' and restored_today == 0) else 0)
  - returned_12m: >-
      XCOUNT('billing', 'billing_ledger', within_months=12, date_field='posted_date', event_type='billing_payment_returned')
  - notices_12m: >-
      XCOUNT('billing', 'billing_ledger', within_months=12, date_field='posted_date', event_type='billing_notice_of_cancellation')
  - vehicle_standing_charge: >-
      K('standing_surcharge') if (returned_12m >= 1 and notices_12m >= 1) else (K('returned_only_surcharge') if (returned_12m
      >= 1 and notices_12m == 0) else 0)
  - {result: 'RND(vehicle_line_charge + vehicle_report_charge + vehicle_envelope_charge + vehicle_standing_charge, 2)'}
  compute_basis:
    amendments_12m: Where the filing's record shows no amendment within the past 12 months
    vehicle_change_rate: >-
      Where the filing's record shows no amendment within the past 12 months, the vehicle-amendment rate is first_change_rate;
      where it shows two or more amendments within the past 12 months, the vehicle-amendment rate is frequent_change_rate;
      where it shows exactly one, the vehicle-amendment rate is standard_change_rate.
    replacements_1m: where a vehicle replacement was recorded
    removals_1m: where no replacement but a vehicle removal was recorded
    vehicle_line_charge: >-
      where a vehicle replacement was recorded, the rate is charged for each of the two vehicle lines the amendment prints,
      the vehicle coming on and the vehicle going off, so the line charge is twice the rate; where no replacement but a
      vehicle removal was recorded, the line charge is half the rate rounded down to the whole dollar; otherwise the line
      charge is the rate once.
    replacement_effective: counted in calendar days from that endorsement's effective date to the date it was recorded
    replacement_recorded: counted in calendar days from that endorsement's effective date to the date it was recorded
    vehicle_report_delay: >-
      The vehicle-report lateness charge follows the reporting delay of the vehicle replacement recorded within the past
      month, counted in calendar days from that endorsement's effective date to the date it was recorded
    vehicle_report_charge: >-
      a delay of more than late_report_days days carries late_report_charge, a delay of more than slow_report_days but no
      more than late_report_days days carries slow_report_charge, and a delay of slow_report_days days or fewer, or no replacement
      recorded within the past month, carries none.
    restored_today: whether the filing's record shows a reinstatement transmission sent today
    vehicle_envelope_charge: >-
      a certificate sent by paper mail that rides in the envelope of a reinstatement transmission sent today carries enclosure_charge,
      a certificate sent by paper mail with no reinstatement transmission sent today carries certified_mail_charge, and
      a certificate sent electronically carries none.
    returned_12m: The vehicle-amendment standing surcharge follows the named insured's billing ledger within the past 12
      months
    notices_12m: a returned payment together with a notice of cancellation carries standing_surcharge
    vehicle_standing_charge: >-
      a returned payment together with a notice of cancellation carries standing_surcharge, a returned payment with no notice
      of cancellation carries returned_only_surcharge, and no returned payment carries none.
    result: >-
      The vehicle amendment charge is the vehicle-amendment line charge plus the vehicle-report lateness charge, the vehicle-amendment
      envelope charge and the vehicle-amendment standing surcharge, the sum rounded to the cent, and it is booked once per
      vehicle amendment, on its transmission.
  factors:
  - id: vehicle_amendment_rate
    effect: parameter
    decides: vehicle_change_rate
    bindings: [amendments_12m, vehicle_change_rate]
    ladder:
    - {when: the filing's record shows no amendment within the past 12 months, value: K('first_change_rate')}
    - {when: the filing's record shows two or more amendments within the past 12 months, value: K('frequent_change_rate')}
    - {when: otherwise (exactly one amendment within the past 12 months), value: K('standard_change_rate')}
    baseline: {vehicle_change_rate: K('standard_change_rate')}
    evidence: [history]
    cross_difficulty: null
  - id: vehicle_line_basis
    effect: method
    decides: vehicle_line_charge
    bindings: [replacements_1m, removals_1m, vehicle_line_charge]
    ladder:
    - {when: a vehicle replacement recorded on the named insured's policies within the past month, method: the rate charged
        for each of the two vehicle lines printed (twice the rate)}
    - {when: no replacement but a vehicle removal recorded within the past month, method: 'half the rate, rounded down to
        the whole dollar'}
    - {when: 'otherwise (an addition only, or no vehicle endorsement within the past month)', method: the rate once}
    baseline: {vehicle_line_charge: vehicle_change_rate}
    evidence: [history, cross_category]
    cross_difficulty: auto
  - id: vehicle_report_lateness
    effect: parameter
    decides: vehicle_report_charge
    bindings: [replacement_effective, replacement_recorded, vehicle_report_delay, vehicle_report_charge]
    ladder:
    - when: >-
        the replacement recorded within the past month was recorded more than late_report_days calendar days after its effective
        date
      value: K('late_report_charge')
    - {when: recorded more than slow_report_days but no more than late_report_days days after its effective date, value: K('slow_report_charge')}
    - {when: 'otherwise (slow_report_days days or fewer, or no replacement within the past month)', value: '0'}
    baseline: {vehicle_report_charge: '0'}
    evidence: [date, cross_category]
    cross_difficulty: auto
  - id: vehicle_amendment_envelope
    effect: parameter
    decides: vehicle_envelope_charge
    bindings: [restored_today, vehicle_envelope_charge]
    ladder:
    - {when: a certificate sent by paper mail and a reinstatement transmission of the filing sent today, value: K('enclosure_charge')}
    - {when: a certificate sent by paper mail and no reinstatement transmission sent today, value: K('certified_mail_charge')}
    - {when: otherwise (a certificate sent electronically), value: '0'}
    baseline: {vehicle_envelope_charge: '0'}
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: vehicle_amendment_standing
    effect: parameter
    decides: vehicle_standing_charge
    bindings: [returned_12m, notices_12m, vehicle_standing_charge]
    ladder:
    - when: >-
        a returned payment and a notice of cancellation on the named insured's billing ledger within the past 12 months
      value: K('standing_surcharge')
    - {when: a returned payment and no notice of cancellation within the past 12 months, value: K('returned_only_surcharge')}
    - {when: otherwise (no returned payment within the past 12 months), value: '0'}
    baseline: {vehicle_standing_charge: '0'}
    evidence: [history, cross_category]
    cross_difficulty: billing
  baseline:
    rule: >-
      A vehicle amendment reports to the ordering state one vehicle endorsement of the certified policy on a certificate
      that lists the scheduled vehicles. As the standard method, a vehicle amendment is charged the vehicle-amendment rate,
      which is standard_change_rate on every certificate type, and the vehicle amendment charge is that rate booked to the
      cent.
    params: [standard_change_rate]
  inputs:
    history:
    - table: sr22_ledger
      aggregate: count
      field: event_type
      within_months: 12
      filters: {event_type: sr22_amended_filing}
    - table: sr22_ledger
      aggregate: count
      field: transmission_type
      filters: {event_type: sr22_transmission, transmission_type: reinstatement, transmitted_date: today}
    - category: auto
      table: auto_transactions
      aggregate: count
      field: event_type
      within_months: 1
      filters:
        event_type: [auto_vehicle_replace, auto_vehicle_remove]
    - category: auto
      table: auto_transactions
      aggregate: latest
      field: effective_date
      within_months: 1
      filters: {event_type: auto_vehicle_replace}
    - category: billing
      table: billing_ledger
      aggregate: count
      field: event_type
      within_months: 12
      filters:
        event_type: [billing_payment_returned, billing_notice_of_cancellation]
    cross_category: [auto, billing]
- id: sr22_ext_address_amendment_charge
  base_policy_refs: [sr22_amendments, sr22_evt_fees, sr22_reinstatement_filing_rule, sr22_transmission_and_response, sr22_sr26_cancellation]
  overwrite:
  - base_policy: sr22_amendments
    superseded_clause: The amendment carries amended_filing_fee, once per amendment.
    replaced_by: >-
      The address amendment charge is the address-amendment vehicle charge plus the address-report lateness charge, the
      address-amendment reprint charge and the address notice-period check charge, the sum rounded to the cent, and it is
      booked once per address amendment, on its transmission.
  - base_policy: sr22_evt_fees
    superseded_clause: an amendment carries amended_filing_fee
    replaced_by: >-
      The address amendment charge is the address-amendment vehicle charge plus the address-report lateness charge, the
      address-amendment reprint charge and the address notice-period check charge, the sum rounded to the cent, and it is
      booked once per address amendment, on its transmission.
  trigger: state_due
  subject: [sr22_amended_filing, sr22_transmission, sr22_fee_assessed]
  computes: address_amendment_charge
  target_tool: amend_certificate_address_1c393d15
  params: {bundled_address_rate: 5.00, frequent_address_rate: 20.00, late_move_days: 30, slow_move_days: 14, late_move_charge: 12.00,
    slow_move_charge: 6.00, reprint_age_months: 36, full_reprint_charge: 4.00, partial_age_months: 12, partial_reissue_charge: 2.00,
    notice_period_move_charge: 4.00, pre_notice_move_charge: 2.00, pre_notice_days: 30}
  rule: >-
    An address amendment reports to the ordering state the household's new mailing address on a certificate whose amendment
    rules require address amendments. As the standard method, an address amendment is charged the address-amendment rate,
    which is the certificate's amended_filing_fee, and the address amendment charge is that rate booked to the cent. The
    refinements below apply to the customers they name, and a customer none of them names pays the standard charge. A window
    of a number of months covers the entries dated less than that many whole months before today, whole months being counted
    from the entry's date to today. Where the filing's record shows an amendment entered today, the address-amendment rate
    is bundled_address_rate; where it shows no amendment entered today but two or more amendments within the past 12 months,
    the address-amendment rate is frequent_address_rate; in every other case the address-amendment rate is the certificate's
    amended_filing_fee. The address-amendment vehicle charge follows the garaging changes recorded on the named insured's
    policies within the past month, one per vehicle moved: where two or more were recorded, the vehicle charge is the rate
    plus half the rate for each vehicle beyond the first, that half-rate addition rounded down to the whole dollar; where
    none was recorded and only the mailing address changed, the vehicle charge is half the rate rounded down to the whole
    dollar; where exactly one was recorded, the vehicle charge is the rate. The address-report lateness charge follows the
    reporting delay of the latest garaging change recorded within the past month, counted in calendar days from that endorsement's
    effective date to the date it was recorded: a delay of more than late_move_days days carries late_move_charge, a delay
    of more than slow_move_days but no more than late_move_days days carries slow_move_charge, and a delay of slow_move_days
    days or fewer, or no garaging change recorded within the past month, carries none. The address-amendment reprint charge
    follows the whole months from the filing's requested date to today, because an older certificate is reissued in full
    when the address printed on it changes: reprint_age_months or more carry full_reprint_charge, at least partial_age_months
    but fewer than reprint_age_months carry partial_reissue_charge, and fewer than partial_age_months carry none. The address
    notice-period check charge compares the effective date of that garaging change with the latest notice of cancellation
    on the named insured's billing ledger: a move effective on or after the notice's mail date and on or before its cancellation
    effective date carries notice_period_move_charge, a move effective before the mail date and no more than pre_notice_days
    calendar days before it carries pre_notice_move_charge, and any other move, or no notice or garaging change on record,
    carries none. An address amendment charge is not fixed until every vehicle endorsement recorded on the certified policy
    within the past month carries its vehicle amendment on the filing's record wherever the certificate lists vehicles.
    The address amendment charge is the address-amendment vehicle charge plus the address-report lateness charge, the address-amendment
    reprint charge and the address notice-period check charge, the sum rounded to the cent, and it is booked once per address
    amendment, on its transmission. A move on a certificate whose amendment rules do not require address amendments needs
    no amendment and carries no charge.
  prerequisite:
  - problem: sr22_ext_vehicle_amendment_charge
    kind: value_input
    gate: amended_today
    form: state
    policy_source: >-
      An address amendment charge is not fixed until every vehicle endorsement recorded on the certified policy within the
      past month carries its vehicle amendment on the filing's record wherever the certificate lists vehicles.
    condition: >-
      Every vehicle addition, replacement or removal recorded on the certified policy within the past month is named as
      the source endorsement of an amendment entry with the reason vehicle change on the filing's record, wherever the certificate
      lists vehicles.
    resolved_by: amend_certificate_vehicles_869f2144
    effect: >-
      The vehicle amendment entered today makes amended_today 1, so the address-amendment rate falls from the certificate's
      amended_filing_fee to bundled_address_rate, and the address-amendment vehicle charge follows it.
  cross_category:
  - category: auto
    as: history
    reads: [auto_transactions.event_type, auto_transactions.effective_date, auto_transactions.recorded_date]
    note: >-
      The address-amendment vehicle charge counts the garaging changes recorded within the past month; the address-report
      lateness charge and the notice-period check read the latest garaging change's dates.
  - category: billing
    as: history
    reads: [billing_ledger.event_type, billing_ledger.notice_mail_date, billing_ledger.cancellation_effective_date]
    note: >-
      The address notice-period check charge reads the latest notice of cancellation's mail date and cancellation effective
      date.
  compute:
  - {amended_today: 'COUNT(''sr22_ledger'', event_type=''sr22_amended_filing'', entry_date=NOW)'}
  - {address_amends_12m: 'COUNT(''sr22_ledger'', within_months=12, date_field=''entry_date'', event_type=''sr22_amended_filing'')'}
  - address_change_rate: >-
      K('bundled_address_rate') if amended_today >= 1 else (K('frequent_address_rate') if address_amends_12m >= 2 else P('amended_filing_fee'))
  - garaging_changes_1m: >-
      XCOUNT('auto', 'auto_transactions', within_months=1, date_field='recorded_date', event_type='auto_garaging_change')
  - address_vehicle_charge: >-
      address_change_rate + float(int(address_change_rate * (garaging_changes_1m - 1) / 2)) if garaging_changes_1m >= 2
      else (float(int(address_change_rate / 2)) if garaging_changes_1m == 0 else address_change_rate)
  - move_effective: >-
      XLATEST('auto', 'auto_transactions', 'effective_date', date_field='recorded_date', event_type='auto_garaging_change')
  - move_recorded: >-
      XLATEST('auto', 'auto_transactions', 'recorded_date', date_field='recorded_date', event_type='auto_garaging_change')
  - {address_report_delay: 'DAYS(move_effective, move_recorded) if garaging_changes_1m >= 1 else 0'}
  - address_report_charge: >-
      K('late_move_charge') if address_report_delay > K('late_move_days') else (K('slow_move_charge') if address_report_delay
      > K('slow_move_days') else 0)
  - {certificate_age_months: 'MONTHS(F(''requested_date''), NOW)'}
  - address_reprint_charge: >-
      K('full_reprint_charge') if certificate_age_months >= K('reprint_age_months') else (K('partial_reissue_charge') if
      certificate_age_months >= K('partial_age_months') else 0)
  - notice_mailed: >-
      XLATEST('billing', 'billing_ledger', 'notice_mail_date', date_field='posted_date', event_type='billing_notice_of_cancellation')
  - notice_effective: >-
      XLATEST('billing', 'billing_ledger', 'cancellation_effective_date', date_field='posted_date', event_type='billing_notice_of_cancellation')
  - address_notice_charge: >-
      K('notice_period_move_charge') if (garaging_changes_1m >= 1 and notice_mailed and move_effective >= notice_mailed
      and move_effective <= notice_effective) else (K('pre_notice_move_charge') if (garaging_changes_1m >= 1 and notice_mailed
      and move_effective < notice_mailed and DAYS(move_effective, notice_mailed) <= K('pre_notice_days')) else 0)
  - {result: 'RND(address_vehicle_charge + address_report_charge + address_reprint_charge + address_notice_charge, 2)'}
  compute_basis:
    amended_today: Where the filing's record shows an amendment entered today
    address_amends_12m: where it shows no amendment entered today but two or more amendments within the past 12 months
    address_change_rate: >-
      Where the filing's record shows an amendment entered today, the address-amendment rate is bundled_address_rate; where
      it shows no amendment entered today but two or more amendments within the past 12 months, the address-amendment rate
      is frequent_address_rate; in every other case the address-amendment rate is the certificate's amended_filing_fee.
    garaging_changes_1m: >-
      The address-amendment vehicle charge follows the garaging changes recorded on the named insured's policies within
      the past month, one per vehicle moved
    address_vehicle_charge: >-
      where two or more were recorded, the vehicle charge is the rate plus half the rate for each vehicle beyond the first,
      that half-rate addition rounded down to the whole dollar; where none was recorded and only the mailing address changed,
      the vehicle charge is half the rate rounded down to the whole dollar; where exactly one was recorded, the vehicle
      charge is the rate.
    move_effective: counted in calendar days from that endorsement's effective date to the date it was recorded
    move_recorded: counted in calendar days from that endorsement's effective date to the date it was recorded
    address_report_delay: >-
      The address-report lateness charge follows the reporting delay of the latest garaging change recorded within the past
      month, counted in calendar days from that endorsement's effective date to the date it was recorded
    address_report_charge: >-
      a delay of more than late_move_days days carries late_move_charge, a delay of more than slow_move_days but no more
      than late_move_days days carries slow_move_charge, and a delay of slow_move_days days or fewer, or no garaging change
      recorded within the past month, carries none.
    certificate_age_months: The address-amendment reprint charge follows the whole months from the filing's requested date
      to today
    address_reprint_charge: >-
      reprint_age_months or more carry full_reprint_charge, at least partial_age_months but fewer than reprint_age_months
      carry partial_reissue_charge, and fewer than partial_age_months carry none.
    notice_mailed: >-
      The address notice-period check charge compares the effective date of that garaging change with the latest notice
      of cancellation on the named insured's billing ledger
    notice_effective: >-
      a move effective on or after the notice's mail date and on or before its cancellation effective date carries notice_period_move_charge
    address_notice_charge: >-
      a move effective on or after the notice's mail date and on or before its cancellation effective date carries notice_period_move_charge,
      a move effective before the mail date and no more than pre_notice_days calendar days before it carries pre_notice_move_charge,
      and any other move, or no notice or garaging change on record, carries none.
    result: >-
      The address amendment charge is the address-amendment vehicle charge plus the address-report lateness charge, the
      address-amendment reprint charge and the address notice-period check charge, the sum rounded to the cent, and it is
      booked once per address amendment, on its transmission.
  factors:
  - id: address_amendment_rate
    effect: parameter
    decides: address_change_rate
    bindings: [amended_today, address_amends_12m, address_change_rate]
    ladder:
    - {when: the filing's record shows an amendment entered today, value: K('bundled_address_rate')}
    - {when: no amendment entered today and two or more amendments within the past 12 months, value: K('frequent_address_rate')}
    - {when: otherwise (no amendment entered today and at most one within the past 12 months), value: P('amended_filing_fee')}
    baseline: {address_change_rate: P('amended_filing_fee')}
    evidence: [history]
    cross_difficulty: null
  - id: address_vehicle_basis
    effect: method
    decides: address_vehicle_charge
    bindings: [garaging_changes_1m, address_vehicle_charge]
    ladder:
    - {when: two or more garaging changes recorded on the named insured's policies within the past month, method: 'the rate
        plus half the rate for each vehicle beyond the first, the addition rounded down to the whole dollar'}
    - {when: no garaging change within the past month (mailing address only), method: 'half the rate, rounded down to the
        whole dollar'}
    - {when: otherwise (exactly one garaging change within the past month), method: the rate}
    baseline: {address_vehicle_charge: address_change_rate}
    evidence: [history, cross_category]
    cross_difficulty: auto
  - id: address_report_lateness
    effect: parameter
    decides: address_report_charge
    bindings: [move_effective, move_recorded, address_report_delay, address_report_charge]
    ladder:
    - when: >-
        the latest garaging change of the past month recorded more than late_move_days calendar days after its effective
        date
      value: K('late_move_charge')
    - {when: recorded more than slow_move_days but no more than late_move_days days after its effective date, value: K('slow_move_charge')}
    - {when: 'otherwise (slow_move_days days or fewer, or no garaging change within the past month)', value: '0'}
    baseline: {address_report_charge: '0'}
    evidence: [date, cross_category]
    cross_difficulty: auto
  - id: address_reprint
    effect: parameter
    decides: address_reprint_charge
    bindings: [certificate_age_months, address_reprint_charge]
    ladder:
    - {when: reprint_age_months or more whole months since the filing's requested date, value: K('full_reprint_charge')}
    - {when: at least partial_age_months but fewer than reprint_age_months whole months, value: K('partial_reissue_charge')}
    - {when: otherwise (fewer than partial_age_months whole months), value: '0'}
    baseline: {address_reprint_charge: '0'}
    evidence: [date]
    cross_difficulty: null
  - id: address_notice_check
    effect: parameter
    decides: address_notice_charge
    bindings: [notice_mailed, notice_effective, address_notice_charge]
    ladder:
    - when: >-
        the garaging change took effect on or after the latest notice of cancellation's mail date and on or before its cancellation
        effective date
      value: K('notice_period_move_charge')
    - {when: the garaging change took effect before that mail date and no more than pre_notice_days calendar days before
        it, value: K('pre_notice_move_charge')}
    - {when: 'otherwise (any other move, or no notice or garaging change on record)', value: '0'}
    baseline: {address_notice_charge: '0'}
    evidence: [date, cross_category]
    cross_difficulty: billing
  baseline:
    rule: >-
      An address amendment reports to the ordering state the household's new mailing address on a certificate whose amendment
      rules require address amendments. As the standard method, an address amendment is charged the address-amendment rate,
      which is the certificate's amended_filing_fee, and the address amendment charge is that rate booked to the cent.
    params: [amended_filing_fee]
  inputs:
    history:
    - table: sr22_ledger
      aggregate: count
      field: event_type
      within_months: 12
      filters: {event_type: sr22_amended_filing}
    - category: auto
      table: auto_transactions
      aggregate: count
      field: event_type
      within_months: 1
      filters: {event_type: auto_garaging_change}
    - category: auto
      table: auto_transactions
      aggregate: latest
      field: effective_date
      within_months: 1
      filters: {event_type: auto_garaging_change}
    - category: billing
      table: billing_ledger
      aggregate: latest
      field: notice_mail_date
      filters: {event_type: billing_notice_of_cancellation}
    cross_category: [auto, billing]
- id: sr22_ext_release_notice_charge
  base_policy_refs: [sr22_agg_policy_filings, sr22_release_rule, sr22_evt_fees, sr22_reinstatement_filing_rule, sr22_amendments,
    sr22_transmission_and_response, sr22_sr26_cancellation]
  overwrite:
  - base_policy: sr22_evt_fees
    superseded_clause: a release notice carries release_filing_fee
    replaced_by: >-
      The release charge is the certificate's release_filing_fee plus the adjusted release clearance charge, the release
      confirmation-copy charge and the release envelope charge, the sum rounded to the cent, and it is booked once, on the
      release notice transmission, at 0.00 where the sum is zero.
  - base_policy: sr22_evt_fees
    superseded_clause: a fee of 0.00 is not assessed
    replaced_by: >-
      The release charge is the certificate's release_filing_fee plus the adjusted release clearance charge, the release
      confirmation-copy charge and the release envelope charge, the sum rounded to the cent, and it is booked once, on the
      release notice transmission, at 0.00 where the sum is zero.
  trigger: on_request
  subject: [sr22_release, sr22_transmission, sr22_fee_assessed]
  computes: release_charge
  target_tool: request_filing_release_10a5eab7
  params: {recent_restore_clearance: 12.00, lapse_clearance: 8.00, reduced_service_fee_max: 10.00, two_copy_charge: 3.00,
    one_copy_charge: 1.50, release_enclosure_charge: 1.25, release_certified_charge: 9.85}
  rule: >-
    A release ends a filing at the customer's own request once the state order's requirement has ended, and a release notice
    goes to the ordering state. As the standard method, a release notice is charged the certificate's release_filing_fee,
    and the release charge is that fee booked to the cent. The refinements below apply to the customers they name, and a
    customer none of them names pays the standard charge. A window of a number of months covers the entries dated less than
    that many whole months before today, whole months being counted from the entry's date to today. The release clearance
    charge follows the SR-26 history of the filing, because the state's file must be cleared of a recent cancellation before
    it is closed: where the filing's record shows an SR-26 cancellation transmission within the past 12 months and a reinstatement
    transmission sent today, the release clearance charge is recent_restore_clearance; where it shows an SR-26 cancellation
    transmission within the past 12 months and no reinstatement transmission sent today, the release clearance charge is
    lapse_clearance; where it shows no SR-26 cancellation transmission within the past 12 months, there is no release clearance
    charge. The adjusted release clearance charge follows the endorsement_fee of the certified policy's coverage package:
    a package whose endorsement_fee is zero takes half the release clearance charge rounded down to the whole dollar, a
    package whose endorsement_fee is more than zero and no more than reduced_service_fee_max takes three quarters of it
    rounded up to the whole dollar, and a package whose endorsement_fee is more than reduced_service_fee_max takes it as
    it stands. The release confirmation-copy charge follows the amendments entered on the filing's record today, each of
    which the release confirmation lists: two or more carry two_copy_charge, exactly one carries one_copy_charge, and none
    carry nothing. The release envelope charge follows how the certificate travels and whether any other transmission of
    the filing was sent today: a certificate sent by paper mail whose release notice rides with another transmission sent
    today carries release_enclosure_charge, a certificate sent by paper mail with no other transmission sent today carries
    release_certified_charge, and a certificate sent electronically carries none. A release notice is not transmitted until
    the filing's record shows an address amendment entered no earlier than the recording date of the latest garaging change
    recorded on the certified policy within the past month, wherever the certificate's amendment rules require address amendments.
    The release charge is the certificate's release_filing_fee plus the adjusted release clearance charge, the release confirmation-copy
    charge and the release envelope charge, the sum rounded to the cent, and it is booked once, on the release notice transmission,
    at 0.00 where the sum is zero. A release requested before the requirement has ended is declined and carries no charge.
  prerequisite:
  - problem: sr22_ext_address_amendment_charge
    kind: value_input
    gate: amendments_on_release_day
    form: state
    policy_source: >-
      A release notice is not transmitted until the filing's record shows an address amendment entered no earlier than the
      recording date of the latest garaging change recorded on the certified policy within the past month, wherever the
      certificate's amendment rules require address amendments.
    condition: >-
      The filing's record shows an amendment entry with the reason address change entered no earlier than the recording
      date of the latest garaging change recorded on the certified policy within the past month, wherever the certificate's
      amendment rules require address amendments.
    resolved_by: amend_certificate_address_1c393d15
    effect: >-
      The address amendment entered today raises amendments_on_release_day by one, so the release confirmation-copy charge
      moves up a tier (from one_copy_charge to two_copy_charge when a vehicle amendment was also entered today).
  cross_category:
  - category: auto
    as: branch
    reads: [variant_name]
    note: The adjusted release clearance charge reads the endorsement_fee of the certified policy's coverage package.
  compute:
  - sr26_12m: >-
      COUNT('sr22_ledger', within_months=12, date_field='entry_date', event_type='sr22_transmission', transmission_type='sr26_cancellation')
  - {restored_on_release_day: 'COUNT(''sr22_ledger'', event_type=''sr22_transmission'', transmission_type=''reinstatement'',
      transmitted_date=NOW)'}
  - release_clearance: >-
      K('recent_restore_clearance') if (sr26_12m >= 1 and restored_on_release_day >= 1) else (K('lapse_clearance') if (sr26_12m
      >= 1 and restored_on_release_day == 0) else 0)
  - {package_service_fee: 'CPARAM(''auto'', ''endorsement_fee'', policy_id=F(''policy_id''))'}
  - release_clearance_adjusted: >-
      float(int(release_clearance / 2)) if package_service_fee == 0 else (float(-((-(release_clearance * 3 / 4)) // 1))
      if package_service_fee <= K('reduced_service_fee_max') else release_clearance)
  - {amendments_on_release_day: 'COUNT(''sr22_ledger'', event_type=''sr22_amended_filing'', entry_date=NOW)'}
  - release_copy_charge: >-
      K('two_copy_charge') if amendments_on_release_day >= 2 else (K('one_copy_charge') if amendments_on_release_day ==
      1 else 0)
  - {sent_on_release_day: 'COUNT(''sr22_ledger'', event_type=''sr22_transmission'', transmitted_date=NOW)'}
  - release_envelope_charge: >-
      K('release_enclosure_charge') if (P('transmission_method') == 'paper_mail' and sent_on_release_day >= 1) else (K('release_certified_charge')
      if (P('transmission_method') == 'paper_mail' and sent_on_release_day == 0) else 0)
  - {result: 'RND(P(''release_filing_fee'') + release_clearance_adjusted + release_copy_charge + release_envelope_charge,
      2)'}
  compute_basis:
    sr26_12m: where the filing's record shows an SR-26 cancellation transmission within the past 12 months
    restored_on_release_day: and a reinstatement transmission sent today
    release_clearance: >-
      where the filing's record shows an SR-26 cancellation transmission within the past 12 months and a reinstatement transmission
      sent today, the release clearance charge is recent_restore_clearance; where it shows an SR-26 cancellation transmission
      within the past 12 months and no reinstatement transmission sent today, the release clearance charge is lapse_clearance;
      where it shows no SR-26 cancellation transmission within the past 12 months, there is no release clearance charge.
    package_service_fee: The adjusted release clearance charge follows the endorsement_fee of the certified policy's coverage
      package
    release_clearance_adjusted: >-
      a package whose endorsement_fee is zero takes half the release clearance charge rounded down to the whole dollar,
      a package whose endorsement_fee is more than zero and no more than reduced_service_fee_max takes three quarters of
      it rounded up to the whole dollar, and a package whose endorsement_fee is more than reduced_service_fee_max takes
      it as it stands.
    amendments_on_release_day: >-
      The release confirmation-copy charge follows the amendments entered on the filing's record today, each of which the
      release confirmation lists
    release_copy_charge: two or more carry two_copy_charge, exactly one carries one_copy_charge, and none carry nothing.
    sent_on_release_day: whether any other transmission of the filing was sent today
    release_envelope_charge: >-
      a certificate sent by paper mail whose release notice rides with another transmission sent today carries release_enclosure_charge,
      a certificate sent by paper mail with no other transmission sent today carries release_certified_charge, and a certificate
      sent electronically carries none.
    result: >-
      The release charge is the certificate's release_filing_fee plus the adjusted release clearance charge, the release
      confirmation-copy charge and the release envelope charge, the sum rounded to the cent, and it is booked once, on the
      release notice transmission, at 0.00 where the sum is zero.
  factors:
  - id: release_clearance
    effect: parameter
    decides: release_clearance
    bindings: [sr26_12m, restored_on_release_day, release_clearance]
    ladder:
    - when: >-
        an SR-26 cancellation transmission on the filing's record within the past 12 months and a reinstatement transmission
        sent today
      value: K('recent_restore_clearance')
    - {when: an SR-26 cancellation transmission within the past 12 months and no reinstatement transmission sent today,
      value: K('lapse_clearance')}
    - {when: otherwise (no SR-26 cancellation transmission within the past 12 months), value: '0'}
    baseline: {release_clearance: '0'}
    evidence: [history]
    cross_difficulty: null
  - id: release_clearance_basis
    effect: method
    decides: release_clearance_adjusted
    bindings: [package_service_fee, release_clearance_adjusted]
    ladder:
    - {when: the certified policy's coverage package has an endorsement_fee of zero, method: 'half the release clearance
        charge, rounded down to the whole dollar'}
    - {when: the package's endorsement_fee is more than zero and no more than reduced_service_fee_max, method: 'three quarters
        of the release clearance charge, rounded up to the whole dollar'}
    - {when: otherwise (endorsement_fee above reduced_service_fee_max), method: the release clearance charge as it stands}
    baseline: {release_clearance_adjusted: release_clearance}
    evidence: [cross_category]
    cross_difficulty: auto
  - id: release_confirmation_copies
    effect: parameter
    decides: release_copy_charge
    bindings: [amendments_on_release_day, release_copy_charge]
    ladder:
    - {when: two or more amendments entered on the filing's record today, value: K('two_copy_charge')}
    - {when: exactly one amendment entered today, value: K('one_copy_charge')}
    - {when: otherwise (no amendment entered today), value: '0'}
    baseline: {release_copy_charge: '0'}
    evidence: [history]
    cross_difficulty: null
  - id: release_envelope
    effect: parameter
    decides: release_envelope_charge
    bindings: [sent_on_release_day, release_envelope_charge]
    ladder:
    - {when: a certificate sent by paper mail and another transmission of the filing sent today, value: K('release_enclosure_charge')}
    - {when: a certificate sent by paper mail and no other transmission sent today, value: K('release_certified_charge')}
    - {when: otherwise (a certificate sent electronically), value: '0'}
    baseline: {release_envelope_charge: '0'}
    evidence: [history, tier_param]
    cross_difficulty: null
  baseline:
    rule: >-
      A release ends a filing at the customer's own request once the state order's requirement has ended, and a release
      notice goes to the ordering state. As the standard method, a release notice is charged the certificate's release_filing_fee,
      and the release charge is that fee booked to the cent.
    params: [release_filing_fee]
  inputs:
    history:
    - table: sr22_ledger
      aggregate: count
      field: transmission_type
      within_months: 12
      filters: {event_type: sr22_transmission, transmission_type: sr26_cancellation}
    - table: sr22_ledger
      aggregate: count
      field: event_type
      filters: {event_type: sr22_amended_filing, entry_date: today}
    - table: sr22_ledger
      aggregate: count
      field: event_type
      filters: {event_type: sr22_transmission, transmitted_date: today}
    cross_category: [auto]
- id: sr22_ext_corrected_refiling_charge
  base_policy_refs: [sr22_transmission_and_response, sr22_evt_fees, sr22_sr26_cancellation, sr22_reinstatement_filing_rule,
    sr22_amendments]
  overwrite:
  - base_policy: sr22_evt_fees
    superseded_clause: A corrected refiling after a rejection carries refiling_fee_after_rejection
    replaced_by: >-
      The corrected refiling charge is the correction charge plus the corrected-refiling delivery charge and the corrected-refiling
      handling charge, the sum rounded to the cent, and it is booked once, on the corrected refiling transmission, at 0.00
      where the sum is zero.
  - base_policy: sr22_evt_fees
    superseded_clause: a fee of 0.00 is not assessed
    replaced_by: >-
      The corrected refiling charge is the correction charge plus the corrected-refiling delivery charge and the corrected-refiling
      handling charge, the sum rounded to the cent, and it is booked once, on the corrected refiling transmission, at 0.00
      where the sum is zero.
  trigger: state_due
  subject: [sr22_refile, sr22_transmission, sr22_fee_assessed]
  computes: refiling_charge
  target_tool: submit_filing_correction_4a6499e2
  params: {first_correction_rate: 10.00, repeat_correction_rate: 20.00, waive_days: 2, prorate_days: 6, policy_change_window_days: 14,
    courier_charge: 24.50, certified_mail_charge: 9.85, high_service_fee: 15.00, service_handling_high: 6.00, service_handling_low: 3.00}
  rule: >-
    A corrected refiling answers a state rejection with corrected information from the customer when the rejection code
    is one the customer must correct, and Cardinal corrects and refiles on its own when the code is one Cardinal corrects.
    As the standard method, a corrected refiling is charged the correction rate, which is the certificate's refiling_fee_after_rejection,
    and the corrected refiling charge is that rate booked to the cent. The refinements below apply to the customers they
    name, and a customer none of them names pays the standard charge. The rejections on record are the state responses on
    the filing's record other than acknowledgments, and the rejected transmission is the latest transmission on the filing's
    record. Where the record holds two or more rejections, the correction rate is repeat_correction_rate; where it holds
    exactly one rejection and the rejected transmission is the original certificate, so that the state holds no certificate
    for the driver at all, the correction rate is first_correction_rate; where it holds exactly one rejection and the rejected
    transmission is a later one, such as an amendment, while the earlier certificate stays on the state's file, the correction
    rate is the certificate's refiling_fee_after_rejection. The correction charge follows the calendar days from the response
    date of the latest state response to today: within waive_days days the correction is not charged; after more than waive_days
    and no more than prorate_days days the correction charge is the correction rate multiplied by those days and divided
    by the certificate's rejection_correction_days, rounded up to the cent; after more than prorate_days days the correction
    charge is the correction rate as it stands. The corrected-refiling delivery charge follows how the certificate travels
    and the calendar days from today to the effective date requested on a signed insured cancellation request for the certified
    policy: a certificate sent by paper mail whose certified policy ends within policy_change_window_days days carries courier_charge,
    a certificate sent by paper mail whose certified policy ends later or has no signed cancellation request carries certified_mail_charge,
    and a certificate sent electronically carries none. The corrected-refiling handling charge follows the endorsement_fee
    of the certified policy's coverage package: an endorsement_fee of high_service_fee or more carries service_handling_high,
    an endorsement_fee above zero but below high_service_fee carries service_handling_low, and an endorsement_fee of zero
    carries none. The corrected refiling charge is the correction charge plus the corrected-refiling delivery charge and
    the corrected-refiling handling charge, the sum rounded to the cent, and it is booked once, on the corrected refiling
    transmission, at 0.00 where the sum is zero. A correction received after the correction window starts a new request
    and is not a corrected refiling.
  prerequisite: []
  cross_category:
  - category: auto
    as: branch
    reads: [variant_name, auto_change_requests.request_type, auto_change_requests.request_status, auto_change_requests.requested_effective_date]
    note: >-
      The corrected-refiling delivery charge reads the signed cancellation request of the certified policy; the corrected-refiling
      handling charge reads the endorsement_fee of its package.
  compute:
  - {rejected_version_kind: 'LATEST(''sr22_ledger'', ''transmission_type'', date_field=''entry_date'', event_type=''sr22_transmission'')'}
  - rejections_on_record: >-
      COUNT('sr22_ledger', event_type='sr22_state_response') - COUNT('sr22_ledger', event_type='sr22_state_response', response_code='accepted')
  - refile_rate: >-
      K('repeat_correction_rate') if rejections_on_record >= 2 else (K('first_correction_rate') if (rejections_on_record
      == 1 and rejected_version_kind == 'original') else P('refiling_fee_after_rejection'))
  - {rejection_date: 'LATEST(''sr22_ledger'', ''response_date'', date_field=''entry_date'', event_type=''sr22_state_response'')'}
  - {days_since_rejection: 'DAYS(rejection_date, NOW)'}
  - refile_core: >-
      0.0 if days_since_rejection <= K('waive_days') else (float(-((-(refile_rate * days_since_rejection * 100 / P('rejection_correction_days')))
      // 1)) / 100 if days_since_rejection <= K('prorate_days') else refile_rate)
  - policy_end_requested: >-
      XLATEST('auto', 'auto_change_requests', 'requested_effective_date', date_field='created_at', request_type='insured_cancellation',
      request_status='signed', policy_id=F('policy_id'))
  - {days_to_policy_end: 'DAYS(NOW, policy_end_requested) if policy_end_requested else 9999'}
  - refile_delivery: >-
      K('courier_charge') if (P('transmission_method') == 'paper_mail' and days_to_policy_end <= K('policy_change_window_days'))
      else (K('certified_mail_charge') if (P('transmission_method') == 'paper_mail' and days_to_policy_end > K('policy_change_window_days'))
      else 0)
  - {refile_service_fee: 'CPARAM(''auto'', ''endorsement_fee'', policy_id=F(''policy_id''))'}
  - refile_handling: >-
      K('service_handling_high') if refile_service_fee >= K('high_service_fee') else (K('service_handling_low') if refile_service_fee
      > 0 else 0)
  - {result: 'RND(refile_core + refile_delivery + refile_handling, 2)'}
  compute_basis:
    rejected_version_kind: the rejected transmission is the latest transmission on the filing's record
    rejections_on_record: The rejections on record are the state responses on the filing's record other than acknowledgments
    refile_rate: >-
      Where the record holds two or more rejections, the correction rate is repeat_correction_rate; where it holds exactly
      one rejection and the rejected transmission is the original certificate, so that the state holds no certificate for
      the driver at all, the correction rate is first_correction_rate; where it holds exactly one rejection and the rejected
      transmission is a later one, such as an amendment, while the earlier certificate stays on the state's file, the correction
      rate is the certificate's refiling_fee_after_rejection.
    rejection_date: The correction charge follows the calendar days from the response date of the latest state response
      to today
    days_since_rejection: The correction charge follows the calendar days from the response date of the latest state response
      to today
    refile_core: >-
      within waive_days days the correction is not charged; after more than waive_days and no more than prorate_days days
      the correction charge is the correction rate multiplied by those days and divided by the certificate's rejection_correction_days,
      rounded up to the cent; after more than prorate_days days the correction charge is the correction rate as it stands.
    policy_end_requested: the effective date requested on a signed insured cancellation request for the certified policy
    days_to_policy_end: >-
      the calendar days from today to the effective date requested on a signed insured cancellation request for the certified
      policy
    refile_delivery: >-
      a certificate sent by paper mail whose certified policy ends within policy_change_window_days days carries courier_charge,
      a certificate sent by paper mail whose certified policy ends later or has no signed cancellation request carries certified_mail_charge,
      and a certificate sent electronically carries none.
    refile_service_fee: The corrected-refiling handling charge follows the endorsement_fee of the certified policy's coverage
      package
    refile_handling: >-
      an endorsement_fee of high_service_fee or more carries service_handling_high, an endorsement_fee above zero but below
      high_service_fee carries service_handling_low, and an endorsement_fee of zero carries none.
    result: >-
      The corrected refiling charge is the correction charge plus the corrected-refiling delivery charge and the corrected-refiling
      handling charge, the sum rounded to the cent, and it is booked once, on the corrected refiling transmission, at 0.00
      where the sum is zero.
  factors:
  - id: correction_rate
    effect: parameter
    decides: refile_rate
    bindings: [rejected_version_kind, rejections_on_record, refile_rate]
    ladder:
    - {when: two or more rejections on the filing's record, value: K('repeat_correction_rate')}
    - {when: exactly one rejection and the rejected transmission is the original certificate, value: K('first_correction_rate')}
    - {when: 'otherwise (exactly one rejection, of a later transmission such as an amendment)', value: P('refiling_fee_after_rejection')}
    baseline: {refile_rate: P('refiling_fee_after_rejection')}
    evidence: [history]
    cross_difficulty: null
  - id: correction_speed
    effect: method
    decides: refile_core
    bindings: [rejection_date, days_since_rejection, refile_core]
    ladder:
    - {when: waive_days or fewer calendar days since the latest state response, method: no correction charge}
    - {when: more than waive_days and no more than prorate_days days, method: 'the correction rate times the days elapsed
        divided by rejection_correction_days, rounded up to the cent'}
    - {when: otherwise (more than prorate_days days), method: the correction rate as it stands}
    baseline: {refile_core: refile_rate}
    evidence: [date, history]
    cross_difficulty: null
  - id: corrected_refiling_delivery
    effect: parameter
    decides: refile_delivery
    bindings: [policy_end_requested, days_to_policy_end, refile_delivery]
    ladder:
    - when: >-
        a certificate sent by paper mail and the certified policy ends on a signed cancellation request within policy_change_window_days
        days
      value: K('courier_charge')
    - {when: a certificate sent by paper mail and the certified policy ends later or has no signed cancellation request,
      value: K('certified_mail_charge')}
    - {when: otherwise (a certificate sent electronically), value: '0'}
    baseline: {refile_delivery: '0'}
    evidence: [date, cross_category, tier_param]
    cross_difficulty: auto
  - id: corrected_refiling_handling
    effect: parameter
    decides: refile_handling
    bindings: [refile_service_fee, refile_handling]
    ladder:
    - {when: the certified policy's package has an endorsement_fee of high_service_fee or more, value: K('service_handling_high')}
    - {when: an endorsement_fee above zero but below high_service_fee, value: K('service_handling_low')}
    - {when: otherwise (an endorsement_fee of zero), value: '0'}
    baseline: {refile_handling: '0'}
    evidence: [cross_category]
    cross_difficulty: auto
  baseline:
    rule: >-
      A corrected refiling answers a state rejection with corrected information from the customer when the rejection code
      is one the customer must correct, and Cardinal corrects and refiles on its own when the code is one Cardinal corrects.
      As the standard method, a corrected refiling is charged the correction rate, which is the certificate's refiling_fee_after_rejection,
      and the corrected refiling charge is that rate booked to the cent.
    params: [refiling_fee_after_rejection]
  inputs:
    history:
    - table: sr22_ledger
      aggregate: latest
      field: response_code
      filters: {event_type: sr22_state_response}
    - table: sr22_ledger
      aggregate: count
      field: response_code
      filters: {event_type: sr22_state_response}
    - category: auto
      table: auto_change_requests
      aggregate: latest
      field: requested_effective_date
      filters: {request_type: insured_cancellation, request_status: signed}
    cross_category: [auto]
- id: sr22_ext_policy_number_amendment_charge
  base_policy_refs: [sr22_amendments, sr22_evt_fees, sr22_reinstatement_filing_rule, sr22_transmission_and_response, sr22_sr26_cancellation]
  overwrite:
  - base_policy: sr22_amendments
    superseded_clause: The amendment carries amended_filing_fee, once per amendment.
    replaced_by: >-
      The policy-number amendment charge is the timed policy-change charge plus the policy-change envelope charge, the replacement
      plan check charge and the limits re-certification charge, the sum rounded to the cent, and it is booked once per policy-number
      amendment, on its transmission.
  - base_policy: sr22_evt_fees
    superseded_clause: an amendment carries amended_filing_fee
    replaced_by: >-
      The policy-number amendment charge is the timed policy-change charge plus the policy-change envelope charge, the replacement
      plan check charge and the limits re-certification charge, the sum rounded to the cent, and it is booked once per policy-number
      amendment, on its transmission.
  trigger: state_due
  subject: [sr22_amended_filing, sr22_transmission, sr22_fee_assessed]
  computes: policy_amendment_charge
  target_tool: amend_certificate_policy_9772f7fb
  params: {standard_policy_change_rate: 15.00, first_policy_change_rate: 7.50, frequent_policy_change_rate: 22.50, long_tenure_months: 84,
    mid_tenure_months: 36, long_tenure_pct: 20, mid_tenure_pct: 10, rush_days: 10, refile_enclosure_charge: 1.25, certified_mail_charge: 9.85,
    monthly_plan_check: 3.00, split_plan_check: 1.50, both_limits_charge: 4.00, one_limit_charge: 2.00}
  rule: >-
    When the named insured replaces the certified policy with a new Cardinal policy, a policy-number amendment moves the
    certificate onto the replacement policy and tells the ordering state its policy number, so that the certificate does
    not end with the policy it names. As the standard method, a policy-number amendment is charged the policy-change rate,
    which is standard_policy_change_rate on every certificate type, and the policy-number amendment charge is that rate
    booked to the cent. The refinements below apply to the customers they name, and a customer none of them names pays the
    standard charge. A window of a number of months covers the entries dated less than that many whole months before today,
    whole months being counted from the entry's date to today. Where the filing's record shows no amendment within the past
    12 months, the policy-change rate is first_policy_change_rate; where it shows two or more amendments within the past
    12 months, the policy-change rate is frequent_policy_change_rate; where it shows exactly one, the policy-change rate
    is standard_policy_change_rate. The policy-change courtesy percentage follows the whole months from the inception date
    of the named insured's policy in force today to today: long_tenure_months or more earn long_tenure_pct percent, at least
    mid_tenure_months but fewer than long_tenure_months earn mid_tenure_pct percent, and fewer than mid_tenure_months earn
    none. The policy-change rate is reduced by the policy-change courtesy percentage and rounded to the cent, giving the
    adjusted policy-change rate. The timed policy-change charge follows the term effective date of the named insured's bound
    replacement policy: where that policy starts rush_days or fewer calendar days from today, the timed charge is one and
    a half times the adjusted policy-change rate rounded up to the whole dollar; where it starts more than rush_days days
    from today, the timed charge is four fifths of the adjusted policy-change rate rounded down to the whole dollar; where
    no bound replacement policy is on record, the timed charge is the adjusted policy-change rate as it stands. The policy-change
    envelope charge follows how the certificate travels and whether the filing's record shows a corrected refiling transmission
    sent today: a certificate sent by paper mail that rides with a corrected refiling sent today carries refile_enclosure_charge,
    a certificate sent by paper mail with no corrected refiling sent today carries certified_mail_charge, and a certificate
    sent electronically carries none. The replacement plan check charge follows the installment interval of the bound replacement
    policy's billing plan: an interval of one month carries monthly_plan_check, an interval longer than one month carries
    split_plan_check, and a plan with no installments, or no bound replacement policy, carries none. The limits re-certification
    charge compares the bodily injury per person limit and the property damage limit of the bound replacement policy's package
    with those of the certified policy's package: both limits differing carries both_limits_charge, exactly one differing
    carries one_limit_charge, and neither differing, or no bound replacement policy, carries none. A policy-number amendment
    charge is fixed only after every state rejection recorded on the filing is answered on the filing's record by a corrected
    refiling transmission. The policy-number amendment charge is the timed policy-change charge plus the policy-change envelope
    charge, the replacement plan check charge and the limits re-certification charge, the sum rounded to the cent, and it
    is booked once per policy-number amendment, on its transmission.
  prerequisite:
  - problem: sr22_ext_corrected_refiling_charge
    kind: value_input
    gate: refiled_today
    form: state
    policy_source: >-
      A policy-number amendment charge is fixed only after every state rejection recorded on the filing is answered on the
      filing's record by a corrected refiling transmission.
    condition: >-
      Every state response with a rejection code on the filing's record is followed on that record by a corrected refiling
      transmission.
    resolved_by: submit_filing_correction_4a6499e2
    effect: >-
      The corrected refiling transmission is dated today, so refiled_today becomes 1 and the policy-change envelope charge
      falls from certified_mail_charge to refile_enclosure_charge on a paper-mail certificate; the filing status becomes
      filed, which also satisfies the amendment's open-filing gate.
  cross_category:
  - category: auto
    as: branch
    reads: [inception_date, status, term_effective_date, policy_id, variant_name]
    note: >-
      The courtesy percentage reads the inception date of the policy in force; the timed charge reads the bound replacement
      policy's start; the limits re-certification charge reads both packages' limits.
  - category: billing
    as: branch
    reads: [variant_name]
    note: >-
      The replacement plan check charge reads the installment interval of the bound replacement policy's billing plan.
  compute:
  - {policy_amends_12m: 'COUNT(''sr22_ledger'', within_months=12, date_field=''entry_date'', event_type=''sr22_amended_filing'')'}
  - policy_change_rate: >-
      K('first_policy_change_rate') if policy_amends_12m == 0 else (K('frequent_policy_change_rate') if policy_amends_12m
      >= 2 else K('standard_policy_change_rate'))
  - {household_tenure_months: 'MONTHS(CFIELD(''auto'', ''inception_date'', status=''in_force''), NOW)'}
  - policy_courtesy_pct: >-
      K('long_tenure_pct') if household_tenure_months >= K('long_tenure_months') else (K('mid_tenure_pct') if household_tenure_months
      >= K('mid_tenure_months') else 0)
  - {policy_adjusted_rate: 'RND(policy_change_rate * (100 - policy_courtesy_pct) / 100, 2)'}
  - {replacement_start: 'CFIELD(''auto'', ''term_effective_date'', status=''bound'')'}
  - {days_to_replacement: 'DAYS(NOW, replacement_start) if replacement_start else -1'}
  - policy_timing_charge: >-
      float(-((-(policy_adjusted_rate * 3 / 2)) // 1)) if (replacement_start and days_to_replacement <= K('rush_days'))
      else (float(int(policy_adjusted_rate * 4 / 5)) if (replacement_start and days_to_replacement > K('rush_days')) else
      policy_adjusted_rate)
  - refiled_today: >-
      COUNT('sr22_ledger', event_type='sr22_transmission', transmission_type='corrected_refiling', transmitted_date=NOW)
  - policy_envelope_charge: >-
      K('refile_enclosure_charge') if (P('transmission_method') == 'paper_mail' and refiled_today >= 1) else (K('certified_mail_charge')
      if (P('transmission_method') == 'paper_mail' and refiled_today == 0) else 0)
  - {replacement_interval: 'CPARAM(''billing'', ''installment_interval_months'', policy_id=CFIELD(''auto'', ''policy_id'',
      status=''bound''))'}
  - policy_plan_check: >-
      K('monthly_plan_check') if replacement_interval == 1 else (K('split_plan_check') if (replacement_interval != None
      and replacement_interval > 1) else 0)
  - {new_bi: 'CPARAM(''auto'', ''bi_limit_per_person'', status=''bound'')'}
  - {old_bi: 'CPARAM(''auto'', ''bi_limit_per_person'', policy_id=F(''policy_id''))'}
  - {new_pd: 'CPARAM(''auto'', ''pd_limit_per_accident'', status=''bound'')'}
  - {old_pd: 'CPARAM(''auto'', ''pd_limit_per_accident'', policy_id=F(''policy_id''))'}
  - policy_limits_charge: >-
      K('both_limits_charge') if (replacement_start and new_bi != old_bi and new_pd != old_pd) else (K('one_limit_charge')
      if (replacement_start and (new_bi != old_bi or new_pd != old_pd)) else 0)
  - {result: 'RND(policy_timing_charge + policy_envelope_charge + policy_plan_check + policy_limits_charge, 2)'}
  compute_basis:
    policy_amends_12m: Where the filing's record shows no amendment within the past 12 months
    policy_change_rate: >-
      Where the filing's record shows no amendment within the past 12 months, the policy-change rate is first_policy_change_rate;
      where it shows two or more amendments within the past 12 months, the policy-change rate is frequent_policy_change_rate;
      where it shows exactly one, the policy-change rate is standard_policy_change_rate.
    household_tenure_months: >-
      The policy-change courtesy percentage follows the whole months from the inception date of the named insured's policy
      in force today to today
    policy_courtesy_pct: >-
      long_tenure_months or more earn long_tenure_pct percent, at least mid_tenure_months but fewer than long_tenure_months
      earn mid_tenure_pct percent, and fewer than mid_tenure_months earn none.
    policy_adjusted_rate: >-
      The policy-change rate is reduced by the policy-change courtesy percentage and rounded to the cent, giving the adjusted
      policy-change rate.
    replacement_start: The timed policy-change charge follows the term effective date of the named insured's bound replacement
      policy
    days_to_replacement: where that policy starts rush_days or fewer calendar days from today
    policy_timing_charge: >-
      where that policy starts rush_days or fewer calendar days from today, the timed charge is one and a half times the
      adjusted policy-change rate rounded up to the whole dollar; where it starts more than rush_days days from today, the
      timed charge is four fifths of the adjusted policy-change rate rounded down to the whole dollar; where no bound replacement
      policy is on record, the timed charge is the adjusted policy-change rate as it stands.
    refiled_today: whether the filing's record shows a corrected refiling transmission sent today
    policy_envelope_charge: >-
      a certificate sent by paper mail that rides with a corrected refiling sent today carries refile_enclosure_charge,
      a certificate sent by paper mail with no corrected refiling sent today carries certified_mail_charge, and a certificate
      sent electronically carries none.
    replacement_interval: >-
      The replacement plan check charge follows the installment interval of the bound replacement policy's billing plan
    policy_plan_check: >-
      an interval of one month carries monthly_plan_check, an interval longer than one month carries split_plan_check, and
      a plan with no installments, or no bound replacement policy, carries none.
    new_bi: >-
      compares the bodily injury per person limit and the property damage limit of the bound replacement policy's package
      with those of the certified policy's package
    old_bi: >-
      compares the bodily injury per person limit and the property damage limit of the bound replacement policy's package
      with those of the certified policy's package
    new_pd: >-
      compares the bodily injury per person limit and the property damage limit of the bound replacement policy's package
      with those of the certified policy's package
    old_pd: >-
      compares the bodily injury per person limit and the property damage limit of the bound replacement policy's package
      with those of the certified policy's package
    policy_limits_charge: >-
      both limits differing carries both_limits_charge, exactly one differing carries one_limit_charge, and neither differing,
      or no bound replacement policy, carries none.
    result: >-
      The policy-number amendment charge is the timed policy-change charge plus the policy-change envelope charge, the replacement
      plan check charge and the limits re-certification charge, the sum rounded to the cent, and it is booked once per policy-number
      amendment, on its transmission.
  factors:
  - id: policy_change_rate
    effect: parameter
    decides: policy_change_rate
    bindings: [policy_amends_12m, policy_change_rate]
    ladder:
    - {when: the filing's record shows no amendment within the past 12 months, value: K('first_policy_change_rate')}
    - {when: two or more amendments within the past 12 months, value: K('frequent_policy_change_rate')}
    - {when: otherwise (exactly one amendment within the past 12 months), value: K('standard_policy_change_rate')}
    baseline: {policy_change_rate: K('standard_policy_change_rate')}
    evidence: [history]
    cross_difficulty: null
  - id: policy_change_courtesy
    effect: parameter
    decides: policy_courtesy_pct
    bindings: [household_tenure_months, policy_courtesy_pct]
    ladder:
    - {when: long_tenure_months or more whole months since the inception of the named insured's policy in force today, value: K('long_tenure_pct')}
    - {when: at least mid_tenure_months but fewer than long_tenure_months whole months, value: K('mid_tenure_pct')}
    - {when: otherwise (fewer than mid_tenure_months whole months), value: '0'}
    baseline: {policy_courtesy_pct: '0'}
    evidence: [date, cross_category]
    cross_difficulty: auto
  - id: policy_change_timing
    effect: method
    decides: policy_timing_charge
    bindings: [replacement_start, days_to_replacement, policy_timing_charge]
    ladder:
    - {when: a bound replacement policy starting rush_days or fewer calendar days from today, method: 'one and a half times
        the adjusted policy-change rate, rounded up to the whole dollar'}
    - {when: a bound replacement policy starting more than rush_days days from today, method: 'four fifths of the adjusted
        policy-change rate, rounded down to the whole dollar'}
    - {when: otherwise (no bound replacement policy on record), method: the adjusted policy-change rate as it stands}
    baseline: {policy_timing_charge: policy_adjusted_rate}
    evidence: [date, cross_category]
    cross_difficulty: auto
  - id: policy_change_envelope
    effect: parameter
    decides: policy_envelope_charge
    bindings: [refiled_today, policy_envelope_charge]
    ladder:
    - {when: a certificate sent by paper mail and a corrected refiling of the filing sent today, value: K('refile_enclosure_charge')}
    - {when: a certificate sent by paper mail and no corrected refiling sent today, value: K('certified_mail_charge')}
    - {when: otherwise (a certificate sent electronically), value: '0'}
    baseline: {policy_envelope_charge: '0'}
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: replacement_plan_check
    effect: parameter
    decides: policy_plan_check
    bindings: [replacement_interval, policy_plan_check]
    ladder:
    - {when: the bound replacement policy's billing plan bills installments one month apart, value: K('monthly_plan_check')}
    - {when: its billing plan bills installments more than one month apart, value: K('split_plan_check')}
    - {when: 'otherwise (no installments, or no bound replacement policy)', value: '0'}
    baseline: {policy_plan_check: '0'}
    evidence: [cross_category]
    cross_difficulty: billing
  - id: limits_recertification
    effect: parameter
    decides: policy_limits_charge
    bindings: [new_bi, old_bi, new_pd, old_pd, policy_limits_charge]
    ladder:
    - when: >-
        a bound replacement policy whose package differs from the certified policy's package in both the bodily injury per
        person limit and the property damage limit
      value: K('both_limits_charge')
    - {when: a bound replacement policy whose package differs in exactly one of the two limits, value: K('one_limit_charge')}
    - {when: 'otherwise (neither limit differs, or no bound replacement policy)', value: '0'}
    baseline: {policy_limits_charge: '0'}
    evidence: [cross_category]
    cross_difficulty: auto
  baseline:
    rule: >-
      When the named insured replaces the certified policy with a new Cardinal policy, a policy-number amendment moves the
      certificate onto the replacement policy and tells the ordering state its policy number, so that the certificate does
      not end with the policy it names. As the standard method, a policy-number amendment is charged the policy-change rate,
      which is standard_policy_change_rate on every certificate type, and the policy-number amendment charge is that rate
      booked to the cent.
    params: [standard_policy_change_rate]
  inputs:
    history:
    - table: sr22_ledger
      aggregate: count
      field: event_type
      within_months: 12
      filters: {event_type: sr22_amended_filing}
    - table: sr22_ledger
      aggregate: count
      field: transmission_type
      filters: {event_type: sr22_transmission, transmission_type: corrected_refiling, transmitted_date: today}
    cross_category: [auto, billing]
- id: sr22_ext_name_amendment_charge
  base_policy_refs: [sr22_amendments, sr22_evt_fees, sr22_reinstatement_filing_rule, sr22_transmission_and_response, sr22_sr26_cancellation]
  overwrite:
  - base_policy: sr22_amendments
    superseded_clause: The amendment carries amended_filing_fee, once per amendment.
    replaced_by: >-
      The name amendment charge is the pending-version name charge plus the name-amendment envelope charge and the identity
      re-verification charge, the sum rounded to the cent, and it is booked once per name amendment, on its transmission.
  - base_policy: sr22_evt_fees
    superseded_clause: an amendment carries amended_filing_fee
    replaced_by: >-
      The name amendment charge is the pending-version name charge plus the name-amendment envelope charge and the identity
      re-verification charge, the sum rounded to the cent, and it is booked once per name amendment, on its transmission.
  trigger: on_request
  subject: [sr22_amended_filing, sr22_transmission, sr22_fee_assessed]
  computes: name_amendment_charge
  target_tool: amend_certificate_name_9daa06e9
  params: {standard_name_rate: 15.00, bundled_name_rate: 5.00, frequent_name_rate: 20.00, name_enclosure_charge: 1.25, name_certified_charge: 9.85,
    paper_identity_check: 6.00, electronic_identity_check: 3.00}
  rule: >-
    A name amendment tells the ordering state the filed driver's new legal name, exactly as the reissued license prints
    it, when the customer reports a legal name change. As the standard method, a name amendment is charged the name-amendment
    rate, which is standard_name_rate on every certificate type, and the name amendment charge is that rate booked to the
    cent. The refinements below apply to the customers they name, and a customer none of them names pays the standard charge.
    A window of a number of months covers the entries dated less than that many whole months before today, whole months
    being counted from the entry's date to today. Where the filing's record shows another amendment entered today, the name-amendment
    rate is bundled_name_rate; where it shows no amendment entered today but two or more amendments within the past 12 months,
    the name-amendment rate is frequent_name_rate; in every other case the name-amendment rate is standard_name_rate. The
    pending-version name charge follows whether the state still has to answer the certificate: where the filing status is
    filed and the latest transmission on the filing's record was sent today, the name charge is half the name-amendment
    rate rounded down to the whole dollar; where the filing status is filed and the latest transmission was sent on an earlier
    day, the name charge is three quarters of the name-amendment rate rounded up to the whole dollar; where the filing status
    is anything else, the name charge is the name-amendment rate as it stands. The name-amendment envelope charge follows
    how the certificate travels and whether any transmission of the filing was sent today: a certificate sent by paper mail
    that rides with a transmission sent today carries name_enclosure_charge, a certificate sent by paper mail with no transmission
    sent today carries name_certified_charge, and a certificate sent electronically carries none. The identity re-verification
    charge follows the state responses on the filing's record within the past month: a rejection for a name, date of birth
    or license number mismatch on a certificate sent by paper mail carries paper_identity_check, such a rejection on a certificate
    sent electronically carries electronic_identity_check, and no such rejection within the past month carries none. A name
    amendment charge is not worked out until every policy bound for the named insured after the certificate was requested
    is named on the filing's record by a policy-number amendment. The name amendment charge is the pending-version name
    charge plus the name-amendment envelope charge and the identity re-verification charge, the sum rounded to the cent,
    and it is booked once per name amendment, on its transmission. The legal name recorded is the one printed on the reissued
    license, never a nickname or a name the license does not yet show.
  prerequisite:
  - problem: sr22_ext_policy_number_amendment_charge
    kind: value_input
    gate: name_amended_today
    form: state
    policy_source: >-
      A name amendment charge is not worked out until every policy bound for the named insured after the certificate was
      requested is named on the filing's record by a policy-number amendment.
    condition: >-
      Every auto policy of the named insured issued after the filing's requested date is the source policy of an amendment
      entry with the reason policy number change on the filing's record.
    resolved_by: amend_certificate_policy_9772f7fb
    effect: >-
      The policy-number amendment entered today makes name_amended_today 1, so the name-amendment rate falls from the standard_name_rate
      to bundled_name_rate, and the pending-version name charge follows it.
  cross_category: []
  compute:
  - {name_amended_today: 'COUNT(''sr22_ledger'', event_type=''sr22_amended_filing'', entry_date=NOW)'}
  - {name_amends_12m: 'COUNT(''sr22_ledger'', within_months=12, date_field=''entry_date'', event_type=''sr22_amended_filing'')'}
  - name_change_rate: >-
      K('bundled_name_rate') if name_amended_today >= 1 else (K('frequent_name_rate') if name_amends_12m >= 2 else K('standard_name_rate'))
  - {latest_sent_on: 'LATEST(''sr22_ledger'', ''transmitted_date'', date_field=''entry_date'', event_type=''sr22_transmission'')'}
  - name_pending_charge: >-
      float(int(name_change_rate / 2)) if (F('status') == 'filed' and latest_sent_on == NOW) else (float(-((-(name_change_rate
      * 3 / 4)) // 1)) if (F('status') == 'filed' and latest_sent_on != NOW) else name_change_rate)
  - {name_sent_today: 'COUNT(''sr22_ledger'', event_type=''sr22_transmission'', transmitted_date=NOW)'}
  - name_envelope_charge: >-
      K('name_enclosure_charge') if (P('transmission_method') == 'paper_mail' and name_sent_today >= 1) else (K('name_certified_charge')
      if (P('transmission_method') == 'paper_mail' and name_sent_today == 0) else 0)
  - identity_rejections_1m: >-
      COUNT('sr22_ledger', within_months=1, date_field='response_date', event_type='sr22_state_response', response_code='name_mismatch')
      + COUNT('sr22_ledger', within_months=1, date_field='response_date', event_type='sr22_state_response', response_code='license_number_mismatch')
      + COUNT('sr22_ledger', within_months=1, date_field='response_date', event_type='sr22_state_response', response_code='date_of_birth_mismatch')
  - name_identity_check: >-
      K('paper_identity_check') if (identity_rejections_1m >= 1 and P('transmission_method') == 'paper_mail') else (K('electronic_identity_check')
      if (identity_rejections_1m >= 1 and P('transmission_method') == 'electronic') else 0)
  - {result: 'RND(name_pending_charge + name_envelope_charge + name_identity_check, 2)'}
  compute_basis:
    name_amended_today: Where the filing's record shows another amendment entered today
    name_amends_12m: where it shows no amendment entered today but two or more amendments within the past 12 months
    name_change_rate: >-
      Where the filing's record shows another amendment entered today, the name-amendment rate is bundled_name_rate; where
      it shows no amendment entered today but two or more amendments within the past 12 months, the name-amendment rate
      is frequent_name_rate; in every other case the name-amendment rate is standard_name_rate.
    latest_sent_on: the latest transmission on the filing's record was sent today
    name_pending_charge: >-
      where the filing status is filed and the latest transmission on the filing's record was sent today, the name charge
      is half the name-amendment rate rounded down to the whole dollar; where the filing status is filed and the latest
      transmission was sent on an earlier day, the name charge is three quarters of the name-amendment rate rounded up to
      the whole dollar; where the filing status is anything else, the name charge is the name-amendment rate as it stands.
    name_sent_today: whether any transmission of the filing was sent today
    name_envelope_charge: >-
      a certificate sent by paper mail that rides with a transmission sent today carries name_enclosure_charge, a certificate
      sent by paper mail with no transmission sent today carries name_certified_charge, and a certificate sent electronically
      carries none.
    identity_rejections_1m: The identity re-verification charge follows the state responses on the filing's record within
      the past month
    name_identity_check: >-
      a rejection for a name, date of birth or license number mismatch on a certificate sent by paper mail carries paper_identity_check,
      such a rejection on a certificate sent electronically carries electronic_identity_check, and no such rejection within
      the past month carries none.
    result: >-
      The name amendment charge is the pending-version name charge plus the name-amendment envelope charge and the identity
      re-verification charge, the sum rounded to the cent, and it is booked once per name amendment, on its transmission.
  factors:
  - id: name_amendment_rate
    effect: parameter
    decides: name_change_rate
    bindings: [name_amended_today, name_amends_12m, name_change_rate]
    ladder:
    - {when: another amendment entered on the filing's record today, value: K('bundled_name_rate')}
    - {when: no amendment entered today and two or more amendments within the past 12 months, value: K('frequent_name_rate')}
    - {when: otherwise (no amendment today and at most one within the past 12 months), value: K('standard_name_rate')}
    baseline: {name_change_rate: K('standard_name_rate')}
    evidence: [history]
    cross_difficulty: null
  - id: pending_version_basis
    effect: method
    decides: name_pending_charge
    bindings: [latest_sent_on, name_pending_charge]
    ladder:
    - {when: filing status filed and the latest transmission on the filing's record sent today, method: 'half the name-amendment
        rate, rounded down to the whole dollar'}
    - {when: filing status filed and the latest transmission sent on an earlier day, method: 'three quarters of the name-amendment
        rate, rounded up to the whole dollar'}
    - {when: otherwise (any other filing status), method: the name-amendment rate as it stands}
    baseline: {name_pending_charge: name_change_rate}
    evidence: [history, date]
    cross_difficulty: null
  - id: name_amendment_envelope
    effect: parameter
    decides: name_envelope_charge
    bindings: [name_sent_today, name_envelope_charge]
    ladder:
    - {when: a certificate sent by paper mail and a transmission of the filing sent today, value: K('name_enclosure_charge')}
    - {when: a certificate sent by paper mail and no transmission sent today, value: K('name_certified_charge')}
    - {when: otherwise (a certificate sent electronically), value: '0'}
    baseline: {name_envelope_charge: '0'}
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: identity_reverification
    effect: parameter
    decides: name_identity_check
    bindings: [identity_rejections_1m, name_identity_check]
    ladder:
    - when: >-
        a name, date of birth or license number mismatch rejection within the past month on a certificate sent by paper
        mail
      value: K('paper_identity_check')
    - {when: such a rejection within the past month on a certificate sent electronically, value: K('electronic_identity_check')}
    - {when: otherwise (no such rejection within the past month), value: '0'}
    baseline: {name_identity_check: '0'}
    evidence: [history, tier_param]
    cross_difficulty: null
  baseline:
    rule: >-
      A name amendment tells the ordering state the filed driver's new legal name, exactly as the reissued license prints
      it, when the customer reports a legal name change. As the standard method, a name amendment is charged the name-amendment
      rate, which is standard_name_rate on every certificate type, and the name amendment charge is that rate booked to
      the cent.
    params: [standard_name_rate]
  inputs:
    history:
    - table: sr22_ledger
      aggregate: count
      field: event_type
      filters: {event_type: sr22_amended_filing, entry_date: today}
    - table: sr22_ledger
      aggregate: latest
      field: transmitted_date
      filters: {event_type: sr22_transmission}
    - table: sr22_ledger
      aggregate: count
      field: response_code
      within_months: 1
      filters:
        event_type: sr22_state_response
        response_code: [name_mismatch, license_number_mismatch, date_of_birth_mismatch]
    cross_category: []
