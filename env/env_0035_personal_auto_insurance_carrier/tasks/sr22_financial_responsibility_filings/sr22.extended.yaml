# Product charter: Cardinal Financial Responsibility Filing (SR-22 / FR-44 certificate for one driver).
# Path: env/env_0035_personal_auto_insurance_carrier/blueprint/products/sr22.yaml
#
# Capability matrix (functional closure audit):
#   open        filing request against a state order on file for a listed driver; certificate type by order type,
#               ordering state and the driver's ownership of the scheduled vehicles; package, pay plan and limit gates
#   transmit    electronic or paper transmission by ordering state, cutoff time and business days, state
#               acknowledgment or rejection, correction window, corrected refiling
#   money       filing fee, amended filing fee, reinstatement filing fee (billed through the billing account)
#   in term     amended filings (vehicle, address, policy number, name), continuous certificate through renewals
#   cancel      SR-26 notice to the state whenever the underlying policy ends; state lead days; lapse at SR-26 effective
#   reinstate   reinstatement filing when the policy is reinstated before the SR-26 takes effect; new filing after a lapse
#   exit        release after the order's required-through date
#   exceptions  order not on file, ordering state not served, excluded driver, ineligible package or pay plan, limits
#               below the certificate's required limits, state fees, backdating

category: sr22
display_name: Cardinal Financial Responsibility Filing

binding:
  holding_table: sr22_filings
  event_tables: [sr22_ledger]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [requested, filed, accepted, rejected, cancel_notified, lapsed, released]
  transitions:
    - {from: requested, to: filed, by: system, means: The certificate is transmitted to the ordering state's motor vehicle agency.}
    - {from: requested, to: released, by: agent, means: The request is withdrawn at the customer's request before transmission.}
    - {from: filed, to: accepted, by: system, means: The state acknowledges the certificate.}
    - {from: filed, to: rejected, by: system, means: The state rejects the certificate (for example a name, license number or case mismatch).}
    - {from: rejected, to: filed, by: agent, means: The certificate is corrected and transmitted again within the correction window.}
    - {from: rejected, to: released, by: system, means: No correction arrived within the correction window and the request is closed.}
    - {from: accepted, to: cancel_notified, by: system, means: An SR-26 cancellation notice is transmitted because the underlying policy ended or the filing is being ended early.}
    - {from: cancel_notified, to: accepted, by: agent, means: The underlying policy was reinstated before the SR-26 took effect and a reinstatement filing restores the certificate.}
    - {from: cancel_notified, to: lapsed, by: system, means: The SR-26 takes effect and the state is no longer shown proof of financial responsibility.}
    - {from: accepted, to: released, by: agent, means: The order's required-through date has passed and the filing is ended at the customer's request with a release notice.}

accounts: []

parameter_schema:
  certificate_form: Form filed with the state (SR-22 or FR-44).
  certificate_scope: What the certificate certifies (owner - vehicles owned and scheduled; owner_operator - those plus any non-owned vehicle the driver operates).
  covers_non_owned_vehicles: Boolean switch; whether the certificate certifies coverage while the driver operates vehicles not on the policy.
  lists_specific_vehicles: Boolean switch; whether the certificate names the scheduled vehicles by VIN.
  eligible_filing_states: List of ordering states to which this certificate can be filed.
  required_limits_by_state: Mapping state -> minimum liability limits the policy must carry for this certificate (bodily injury per person / per accident / property damage, USD).
  filing_fee: Fee for a new filing, USD.
  refiling_fee_after_rejection: Fee for transmitting a corrected filing after a state rejection, USD.
  amended_filing_fee: Fee for an amended filing, USD.
  reinstatement_filing_fee: Fee for a reinstatement filing after the policy is reinstated, USD.
  release_filing_fee: Fee for the release notice at the end of the requirement, USD.
  duplicate_certificate_fee: Fee for another copy of the certificate to the customer, USD.
  transmission_method: How the certificate reaches the state (electronic or paper_mail).
  transmission_business_days: Business days after the request (or correction) within which the certificate is transmitted, integer.
  transmission_cutoff_time: Eastern time after which a request counts as received the next business day, HH:MM.
  state_ack_expected_business_days: Business days after transmission within which the state normally acknowledges, integer.
  ack_followup_business_days: Business days after transmission without a response after which Cardinal follows up with the state, integer.
  max_transmission_attempts: Transmissions attempted for one filing version before it is referred to the filings unit, integer.
  rejection_correction_days: Calendar days after a state rejection within which corrected information must be received, integer.
  customer_correctable_rejections: List of rejection codes the customer must correct.
  company_correctable_rejections: List of rejection codes Cardinal corrects without the customer.
  sr26_notice_lead_days_by_state: Mapping state -> calendar days after the SR-26 is transmitted on which it takes effect.
  sr26_on_insured_cancellation: Boolean switch; whether an insured-requested cancellation sends an SR-26.
  sr26_on_nonpayment_cancellation: Boolean switch; whether a cancellation for nonpayment sends an SR-26.
  sr26_on_nonrenewal: Boolean switch; whether a company nonrenewal sends an SR-26.
  sr26_on_expiration: Boolean switch; whether expiration for an unpaid renewal sends an SR-26.
  release_files_notice: Boolean switch; whether a release at the end of the requirement sends a notice to the state.
  release_earliest_days_after_required_through: Calendar days after the required-through date from which a release may be requested, integer.
  reinstatement_filing_cutoff_days: Days relative to the SR-26 effective date by which the policy must be reinstated for a reinstatement filing (0 = before the SR-26 effective date), integer.
  new_filing_required_after_lapse: Boolean switch; whether a lapsed certificate needs a brand-new filing (new fee) rather than a reinstatement filing.
  filing_requires_rated_driver: Boolean switch; whether the filed driver must be a rated (not excluded) driver on the policy.
  filing_requires_sr22_eligible_package: Boolean switch; whether the policy's package must have sr22_eligible true.
  filing_requires_allowed_pay_plan: Boolean switch; whether the billing account's plan must have financial_responsibility_plan_allowed true.
  amendment_on_vehicle_change: Boolean switch; whether adding, replacing or removing a scheduled vehicle requires an amended filing.
  amendment_on_address_change: Boolean switch; whether a mailing address change requires an amended filing.
  amendment_on_policy_number_change: Boolean switch; whether a new policy number requires an amended filing.
  amendment_on_name_change: Boolean switch; whether a legal name change of the filed driver requires an amended filing.
  filing_effective_date_rule: How the certificate's effective date is set (later_of_request_date_and_policy_term_effective_date).
  backdating_allowed: Boolean switch; whether a certificate may be dated before the request date.
  certificate_copy_delivery_days: Business days after acknowledgment within which a copy of the certificate is sent to the customer, integer.
  state_fees_collected_by_cardinal: Boolean switch; whether state reinstatement or administrative fees are collected by Cardinal.
  continuous_until_cancelled: Boolean switch; whether the certificate continues through renewals without refiling.
  max_active_filings_per_driver_per_state: Active filings allowed for one driver with one ordering state, integer.
  order_match_fields: List of fields that must match the state order exactly for a filing.
  filing_state_rule: Which state receives the filing (ordering_state).
  business_calendar: Calendar used for business days.
  out_of_state_mailing_method: How paper filings are sent to an out-of-state agency.
  filing_driver_min_age: Youngest age of a driver Cardinal will file for, years.

