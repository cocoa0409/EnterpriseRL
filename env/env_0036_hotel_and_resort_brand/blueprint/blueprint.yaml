name: env_0036_hotel_and_resort_brand
company: Ashbury Hotels & Resorts

background: |
  Ashbury Hotels & Resorts is a North American hotel company headquartered in Charlotte, North Carolina, with 612 owned, managed and franchised hotels across the United States, Canada, Mexico and the Caribbean, and its guest services and loyalty desk speaks for the brand in a warm, precise and unhurried voice.
  The portfolio spans six brands, from the select-service Ashbury Express and the extended-stay Ashbury Inn & Suites through the full-service Ashbury Hotel and the urban Ashbury Grand to the leisure-focused Ashbury Resort & Spa and the luxury Ashbury Reserve, and each hotel's guest bill is kept as a Guest Folio under the standards of its brand.
  Room Reservations are booked one room at a time under a rate plan: the Advance Purchase Non-Refundable Rate, the Semi-Flexible Saver Rate, the Flexible Rate, the Member Flexible Rate, the Bed & Breakfast Package Rate, the Corporate Negotiated Rate, the Group Block Rate or the Reward Night Rate, and each reservation carries its own confirmation number, guarantee and record of deposits, penalties and refunds.
  A reservation becomes a stay at check-in, when its folio opens and the hotel begins posting nightly room and tax, resort fees where the brand charges them, and incidentals from restaurants, minibars, spas, parking and housekeeping, until the folio is settled at check-out.
  Ashbury Rewards is the brand's loyalty programme, held by members at one of six tiers, Ashbury Rewards Member, Ashbury Rewards Silver Elite, Ashbury Rewards Gold Elite, Ashbury Rewards Platinum Elite, Ashbury Rewards Titanium Elite and Ashbury Rewards Ambassador Elite, and every account keeps a running points balance and a calendar-year count of elite night credits.
  Points and night credits flow into an account from completed stays, welcome amenities, co-brand card statements, purchases and transfers between members, and flow out through award redemptions, transfers, expiry and reversals.
  Members also hold Free Night Awards, each worth one standard-room night up to its cap, issued as the 25K Free Night Award, 35K Free Night Award, 40K Free Night Award, 50K Free Night Award, 85K Free Night Award or Any Hotel Free Night Award from co-brand card anniversaries, elite night milestones and promotions, and each award is applied to, released from or used on Reward Night Rate reservations with its own history.
  Organisers of weddings, reunions, tournaments, tours, company meetings and conventions contract Group Room Blocks as a Social Event Room Block, Wedding Room Block, Sports Team Room Block, Tour & Travel Series Block, Corporate Meeting Room Block or Association Convention Room Block, and each block carries its booking code, cut-off date, deposits, a ledger of held room nights and a group master account.
  Attendees book inside a block under its code at the Group Block Rate, so a block's pickup is the set of attendee reservations that name it.
  Meetings & Events contracts for boardrooms, meetings, receptions, weddings and conferences are sold as the Executive Boardroom Package, Half-Day Meeting Package, Full-Day Meeting Package, Social Reception Package, Wedding Celebration Package and Conference Plenary Package, often alongside a group block at the same hotel, and each contract keeps its deposits and event bill.
  At its resorts the company sells Resort Club Memberships to local residents as the Fitness Club Membership, Pool & Fitness Club Membership, Spa Club Membership, Beach & Pool Club Membership, Family Resort Club Membership and Founders Resort Club Membership, billed as dues on a club account that also records guest passes and charges signed at resort outlets.
  Most callers are leisure and business travellers who hold one or several upcoming or recent reservations and an Ashbury Rewards account, often with a co-brand card linked and a Free Night Award or two waiting to be used.
  They call about stays booked on the website, the app, the call centre, through travel agents or online travel agencies, and bring histories of cancellations, no-shows, relocations, early departures, disputed folio lines and missing points.
  Organiser contacts of groups, meetings and clubs call on behalf of their organisation, usually holding a signed or proposed contract, a growing list of attendee reservations or a running club account.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: reservation_cancellations_and_no_shows
    claim:
      categories: [booking]
      event_types: [booking_reservation_cancel, booking_reservation_modify, booking_cancellation_penalty, booking_no_show_charge, booking_penalty_reversal, booking_deposit_refund, booking_deposit_forfeit]
    summary: >
      Guests call guest services about confirmed reservations they want to change or cancel, or about
      penalties and no-show charges already taken on reservations under any of the eight rate plans, at
      any of the six brands, booked through direct channels, travel agents or online travel agencies, and
      guaranteed by card, by full prepayment, by a resort advance deposit or by a reward redemption.
      The records involved are the reservation itself, with its rate plan, brand, arrival date, nightly
      rate, tax rate, guarantee, booking channel and cancellation timing, the ledger of collections,
      refunds, forfeits, penalties and reversals that belongs to it, and the other reservations of the
      same guest at the same hotel; the governing rules are the effective cancellation deadline, whose
      days and clock time depend on the rate plan and on whether the brand is a resort brand
      (booking_cancellation_deadline), the penalty basis and its settlement against held money or the
      card (booking_late_cancellation_penalty, booking_no_show, booking_evt_deposit_settlement), the
      change limits and re-pricing of each plan (booking_modification, booking_rate_plan_pricing), and
      the closed set of reasons and amounts for which a penalty is reversed
      (booking_evt_penalty_reversal), with points and Free Night Awards on reward reservations returned
      or retained under the loyalty and award rules. In the natural order of the domain a reservation is
      booked and guaranteed, may be changed, and then is either cancelled, checked in, marked a no-show
      by the night audit or relocated by the hotel, and each of these leaves its own money trail. The
      agent verifies the caller, reads the reservation and its ledger, records cancellations and changes
      and posts the penalty, refund, forfeit or reversal the rules produce, while hotel actions such as
      check-in, no-show marking and relocation are never performed by the desk and reservations of
      online travel agencies are left to the agency. Requests to waive a penalty for illness, weather,
      flight disruption, bereavement or a change of plans, competitor-rate disputes that only the Best
      Rate Guarantee team can validate, and any situation the reservation rules do not decide fall
      outside policy and are handed to a human representative as POLICY_NOT_COVERED.

  - name: folio_charges_and_adjustments
    claim:
      categories: [folio]
      event_types: [folio_adjustment, folio_breakfast_benefit_credit, folio_reopen, folio_resettle, folio_refund]
    summary: >
      Guests call after or during a stay to question lines on their guest folio: duplicated room or
      incidental postings, a room rate that differs from the reservation, resort fees on reward nights
      or nights not stayed, parking where the resort fee already includes it, pet fees for service
      animals, minibar items they say they did not take, late charges posted long after departure,
      late check-out and early departure fees, and elite breakfast credits that were never applied,
      at brands from Ashbury Express to Ashbury Reserve and with members of every Ashbury Rewards tier.
      The records involved are the folio and its status, every folio line with its charge code, business
      date, posting date and line number, the reservation behind the stay with its rate plan, nightly
      rate, tax rate, booking channel and actual check-in and check-out dates, the member's tier and the
      date it took effect, and the referrals already registered with the hotel; the governing rules are
      the brand's posting standards (folio_room_and_tax, folio_resort_fee_charges,
      folio_incidental_rules, folio_late_checkout, folio_early_departure), the elite breakfast benefit
      (folio_breakfast_benefit), the reasons and amounts of corrections with their dispute window and the
      per-brand desk adjustment limit (folio_evt_adjustment), the courtesy minibar allowance counted
      across all of a guest's folios (folio_agg_courtesy_allowance), and reopening, refunding and
      resettling a corrected folio (folio_post_stay_correction). In the natural order of the domain a
      folio opens at check-in, collects nightly and incidental postings, is settled at check-out, and is
      reopened only to be corrected, refunded and settled again, with points on the stay adjusted when
      eligible spend changes. The agent verifies the guest, reads the folio and the stay, posts the
      corrections and credits the rules allow within the brand's limit, reopens, refunds and resettles
      settled folios, and registers a billing dispute with the hotel for corrections beyond the limit or
      outside the desk's evidence, while the hotel alone posts charges. Goodwill reductions without a
      recognised reason, disputes over a rate the guest accepted at booking, smoking and damage
      disputes that need the hotel's own evidence, and any request no folio rule decides fall outside
      policy and are handed to a human representative as POLICY_NOT_COVERED.

  - name: loyalty_points_and_elite_status
    claim:
      categories: [loyalty]
      event_types: [loyalty_points_earn, loyalty_night_credit, loyalty_points_bonus, loyalty_points_purchase, loyalty_points_transfer_out, loyalty_points_transfer_in, loyalty_points_redeem, loyalty_points_redeposit, loyalty_points_reversal, loyalty_close]
    summary: >
      Ashbury Rewards members of all six tiers call about points and night credits missing from a stay,
      welcome points and relocation compensation they expected, buying points, giving points to another
      member, points deducted or returned on award reservations, points taken back after a folio
      correction, and closing their account, with histories that differ by tier, by linked co-brand
      card, by enrolment date and by the plans and channels their stays were booked under.
      The records involved are the membership with its tier, tier effective date, status, points
      balance and elite night credits, its transaction history and the yearly sums drawn from it, the
      member's reservations and folios, and the other member's account in a transfer; the governing
      rules are stay earning by brand rate, plan, channel and tier bonus (loyalty_stay_earning,
      loyalty_night_credits), late crediting of missing stays within a window and only for the member's
      own stays (loyalty_missing_stay_credit), welcome and relocation points by tier
      (loyalty_welcome_amenity, loyalty_relocation_compensation), purchase and transfer limits by
      calendar year and account age (loyalty_purchase_rules, loyalty_transfer_rules), the award chart,
      fifth-night saving and redeposit rules (loyalty_award_redemption), reversals after corrections
      (loyalty_stay_credit_reversal), expiry (loyalty_points_expiry), tier qualification and co-brand
      floors (loyalty_elite_qualification), and closure (loyalty_account_status). In the natural order
      of the domain a member enrols, stays, is credited at check-out, accumulates night credits toward
      tiers, redeems and is refunded points as award reservations are booked and cancelled, and may
      finally close the account. The agent verifies the member, reads the account, stays and folios,
      and posts earnings, night credits, bonuses, redemptions, redeposits and reversals the rules
      produce, while buying points, giving points away and closing the account are the member's own
      decisions that the member confirms personally. Missing promotion bonuses and co-brand card points,
      requests to grant, match or extend a tier, reinstating expired points, and anything else the
      Ashbury Rewards rules do not decide fall outside policy and are handed to a human representative
      as POLICY_NOT_COVERED.

  - name: free_night_award_redemptions
    claim:
      categories: [certificate]
      event_types: [certificate_issue, certificate_apply, certificate_release, certificate_forfeit, certificate_expire, certificate_hold_record, certificate_release_record, certificate_forfeit_record]
    summary: >
      Members call about using their Free Night Awards: applying an award of a given cap to a reward
      night, topping off a night priced above the cap, which nights several awards cover, awards that
      did not come back after a cancellation or relocation, awards lost to a late cancellation or
      no-show, awards that expired or were never issued after a card anniversary or night milestone,
      and the replacement of an award that expired while it was on a relocated reservation.
      The records involved are each award with its type, status, issue source, issue and expiry dates,
      applied reservation, night and top-off points, the award history, the Reward Night Rate
      reservation with its brand, award category, award season, room type, adults, channel and
      cancellation timing, and the membership with its status, card, night credits and points balance;
      the governing rules are issuance and validity (certificate_issuance), redemption eligibility,
      the night price under the award chart, the cap and the top-off limit
      (certificate_redemption_eligibility), awards per reservation applied from the earliest night
      (certificate_agg_awards_per_reservation), release and expiry (certificate_release_and_expiry),
      first-night forfeiture and closure (certificate_forfeiture), and reissue after a relocation
      (certificate_reissue), together with the reservation's cancellation timing and the points
      deducted or returned for top-offs. In the natural order of the domain an award is issued, applied
      to a reward night, and then used at check-in, released when its reservation is cancelled in time
      or relocated, forfeited on a late cancellation or no-show, or expires unused. The agent verifies
      the member, reads awards, history, reservation and account, and applies, releases, forfeits,
      expires or reissues awards and records their history as the rules decide, while the choice of
      which award to spend on which stay is the member's own. Extending an expiry date, moving an award
      to another member, converting an award to points or cash, issuing an award as a goodwill gesture,
      and any request the award rules do not decide fall outside policy and are handed to a human
      representative as POLICY_NOT_COVERED.

  - name: group_room_block_contracts
    claim:
      categories: [group]
      event_types: [group_contract_sign, group_block_amend, group_block_increase, group_block_reduce, group_cutoff_release, group_contract_cancel, group_cancellation_charge, group_attrition_charge, group_comp_credit, group_deposit_receive, group_deposit_refund, group_deposit_forfeit, group_master_payment]
    summary: >
      Organisers of social events, weddings, sports teams, tour series, company meetings and
      conventions call about their Group Room Blocks: signing a proposal before its option date,
      paying or recovering deposits, adding or removing room nights, what happens at the cut-off date,
      cancelling the contract, the attrition and complimentary rooms assessed after the event, and the
      balance of the master account, for blocks that are tentative, definite, actualized, cancelled or
      closed and whose attendee reservations were picked up, cancelled, no-showed or relocated.
      The records involved are the block with its type, dates, proposal and cut-off dates, contracted
      and held room nights, group rate, deposit and master balances, the block ledger, the addenda
      issued to the organiser, linked event contracts, and the attendee reservations that name the
      block; the governing rules are contracting and the option period (group_contracting), the deposit
      schedule and its use (group_deposit_schedule), cut-off releases (group_cutoff), addenda with the
      free-reduction allowance and deadline (group_addenda), attrition against the performance
      commitment (group_attrition), the cancellation scale and the sports elimination waiver
      (group_cancellation), complimentary rooms (group_comp_rooms), master-account billing
      (group_master_account), and the rule that each block's pickup is counted on its own
      (group_agg_block_isolation), all varying by block type. In the natural order of the domain a block
      is proposed, signed with its deposit, amended, released at cut-off, picked up by attendees, and
      after departure actualized, charged or credited and closed, or else cancelled with damages. The
      agent verifies the organiser, reads the block, ledger, addenda and attendee reservations, and
      records releases, deposits, refunds, forfeits, damages, attrition, complimentary credits and
      payments the rules produce, while signing the contract, signing an addendum and signing a
      cancellation are the organiser's own acts that the organiser completes personally. Negotiating a
      different rate, attrition percentage or cut-off date, crediting resold rooms, pooling pickup
      across blocks, and any request the group contract rules do not decide fall outside policy and are
      handed to a human representative as POLICY_NOT_COVERED.
