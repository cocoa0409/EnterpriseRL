      brg_extra_discount_pct: 0
      points_redeposit_on_timely_cancel: true
      certificate_nights_allowed: true
      relocation_first_night_paid: true
      relocation_refunds_advance_payments: true
      relocation_compensation_eligible: true

events:
  - type: booking_reservation_create
    target: booking_reservations
    mutation: create
    meaning: "A guest books one room at one hotel under one rate plan and receives a confirmation number."
    grain: "One row per room reserved."
    fields:
      reservation_id: "reference number of the new reservation"
      customer_id: "guest holding the reservation"
      variant_name: "rate plan booked"
      confirmation_number: "confirmation number issued"
      property_code: "hotel booked"
      property_brand: "brand of the hotel booked"
      award_category: "award category of the hotel at booking"
      award_season: "award pricing season of the arrival night"
      room_type: "room type booked"
      arrival_date: "arrival date"
      departure_date: "departure date"
      nights: "nights booked"
      adults: "adults registered"
      nightly_rate: "nightly room rate before tax, including any package supplement and extra-adult charge"
      tax_rate_pct: "hotel room tax rate"
      booked_date: "booking date"
      booking_channel: "channel booked through"
      guarantee_type: "guarantee recorded at booking"
      loyalty_member_id: "membership attached for credit"
      group_block_id: "group block picked up, if any"
      corporate_client_code: "corporate client code quoted, if any"
      points_redeemed: "points redeemed for points-paid nights"
      certificate_nights: "nights paid with Free Night Awards"
      cancellation_timing: "set to not_cancelled at booking"
    triggers:
      - event: booking:booking_deposit_collect
        when: {guarantee_type: full_prepayment}
        map: {reservation_id: reservation_id, customer_id: customer_id, posted_date: booked_date, charge_basis: full_prepayment, settlement_source: card_on_file, reversal_reason: not_applicable}
      - event: booking:booking_deposit_collect
        when: {guarantee_type: advance_deposit}
        map: {reservation_id: reservation_id, customer_id: customer_id, posted_date: booked_date, charge_basis: resort_deposit, settlement_source: card_on_file, reversal_reason: not_applicable}
      - event: loyalty:loyalty_points_redeem
        when: {points_redeemed: {not: 0}}
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, reservation_id: reservation_id, points: points_redeemed, posted_date: booked_date, earning_source: award_redemption}
      - event: certificate:certificate_apply
        when: {certificate_nights: {not: 0}}
        map: {reservation_id: reservation_id}

  - type: booking_reservation_modify
    target: booking_reservations
    mutation: update
    meaning: "The dates, room type, occupancy or guest of a confirmed reservation are changed at the guest's request."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation changed"
      customer_id: "guest profile now holding the reservation (changes only on a name change)"
      arrival_date: "new arrival date"
      departure_date: "new departure date"
      nights: "new number of nights"
      room_type: "new room type"
      adults: "new number of adults"
      nightly_rate: "nightly rate after re-pricing"
      points_redeemed: "points redeemed after re-pricing a Reward Night Rate reservation"
    triggers: []

  - type: booking_rate_guarantee_adjust
    target: booking_reservations
    mutation: update
    meaning: "The Best Rate Guarantee team validates a lower publicly available rate for the same stay and lowers the reservation's nightly rate."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation adjusted"
      nightly_rate: "matched nightly rate after the additional discount"
      rate_guarantee_date: "date the adjustment was applied"
    triggers: []

  - type: booking_reservation_cancel
    target: booking_reservations
    mutation: {transition: {from: confirmed, to: cancelled}}
    meaning: "A confirmed reservation is cancelled at the guest's request before arrival."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation cancelled"
      cancelled_at: "moment the cancellation was recorded"
      cancellation_timing: "before_deadline or after_deadline, decided against the effective deadline"
      guarantee_type: "guarantee of the reservation (read, not changed)"
      points_redeemed: "points redeemed on the reservation (read, not changed)"
      certificate_nights: "Free Night Award nights on the reservation (read, not changed)"
      loyalty_member_id: "membership attached (read, not changed)"
    triggers:
      - event: booking:booking_cancellation_penalty
        when: {cancellation_timing: after_deadline, guarantee_type: credit_card}
        map: {reservation_id: reservation_id, settlement_source: card_on_file, reversal_reason: not_applicable}
      - event: booking:booking_cancellation_penalty
        when: {cancellation_timing: after_deadline, guarantee_type: [advance_deposit, full_prepayment]}
        map: {reservation_id: reservation_id, settlement_source: advance_deposit, reversal_reason: not_applicable}
      - event: booking:booking_deposit_refund
        when: {cancellation_timing: before_deadline, guarantee_type: advance_deposit}
        map: {reservation_id: reservation_id, charge_basis: deposit_refund, settlement_source: card_on_file, reversal_reason: not_applicable}
      - event: loyalty:loyalty_points_redeposit
        when: {cancellation_timing: before_deadline, points_redeemed: {not: 0}}
        map: {loyalty_member_id: loyalty_member_id, reservation_id: reservation_id, points: points_redeemed, earning_source: award_redeposit}
      - event: certificate:certificate_release
        when: {cancellation_timing: before_deadline, certificate_nights: {not: 0}}
        map: {reservation_id: reservation_id}
      - event: certificate:certificate_forfeit
        when: {cancellation_timing: after_deadline, certificate_nights: {not: 0}}
        map: {reservation_id: reservation_id}

  - type: booking_check_in
    target: booking_reservations
    mutation: {transition: {from: confirmed, to: in_house}}
    meaning: "The guest arrives and the front desk checks them in."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation checked in"
      actual_check_in_date: "date of check-in"
      customer_id: "guest (read, not changed)"
      property_code: "hotel (read, not changed)"
      property_brand: "hotel brand (read, not changed)"
      loyalty_member_id: "membership attached (read, not changed)"
      guarantee_type: "guarantee of the reservation (read, not changed)"
      certificate_nights: "Free Night Award nights (read, not changed)"
    triggers:
      - event: folio:folio_open
        map: {reservation_id: reservation_id, customer_id: customer_id, property_code: property_code, variant_name: property_brand, loyalty_member_id: loyalty_member_id, opened_date: actual_check_in_date}
      - event: booking:booking_deposit_transfer
        when: {guarantee_type: [advance_deposit, full_prepayment]}
        map: {reservation_id: reservation_id, customer_id: customer_id, posted_date: actual_check_in_date, charge_basis: deposit_transfer, settlement_source: advance_deposit, reversal_reason: not_applicable}
      - event: certificate:certificate_redeem
        when: {certificate_nights: {not: 0}}
        map: {reservation_id: reservation_id}

  - type: booking_check_out
    target: booking_reservations
    mutation: {transition: {from: in_house, to: checked_out}}
    meaning: "The guest checks out and the stay ends, on the scheduled departure date or earlier."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation checked out"
      actual_check_out_date: "date of check-out"
      customer_id: "guest (read, not changed)"
      loyalty_member_id: "membership attached (read, not changed)"
      variant_name: "rate plan (read, not changed)"
      booking_channel: "booking channel (read, not changed)"
    triggers:
      - event: loyalty:loyalty_night_credit
        when: {loyalty_member_id: {not: ""}}
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, reservation_id: reservation_id, posted_date: actual_check_out_date, earning_source: stay_nights}

  - type: booking_no_show_mark
    target: booking_reservations
    mutation: {transition: {from: confirmed, to: no_show}}
    meaning: "The night audit finds that the guest of a guaranteed reservation never arrived and marks it a no-show."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation marked"
      no_show_date: "hotel business date of the no-show (the arrival date)"
      guarantee_type: "guarantee of the reservation (read, not changed)"
      points_redeemed: "points redeemed (read, not changed)"
      certificate_nights: "Free Night Award nights (read, not changed)"
    triggers:
      - event: booking:booking_no_show_charge
        when: {guarantee_type: credit_card}
        map: {reservation_id: reservation_id, settlement_source: card_on_file, reversal_reason: not_applicable}
      - event: booking:booking_no_show_charge
        when: {guarantee_type: [advance_deposit, full_prepayment]}
        map: {reservation_id: reservation_id, settlement_source: advance_deposit, reversal_reason: not_applicable}
      - event: certificate:certificate_forfeit
        when: {certificate_nights: {not: 0}}
        map: {reservation_id: reservation_id}

  - type: booking_relocate
    target: booking_reservations
    mutation: {transition: {from: confirmed, to: relocated}}
    meaning: "The hotel cannot provide the guaranteed room on arrival and relocates the guest to another hotel at its own cost."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation relocated"
      relocated_date: "date of the relocation (the arrival date)"
      customer_id: "guest (read, not changed)"
      guarantee_type: "guarantee of the reservation (read, not changed)"
      loyalty_member_id: "membership attached (read, not changed)"
      points_redeemed: "points redeemed (read, not changed)"
      certificate_nights: "Free Night Award nights (read, not changed)"
    triggers:
      - event: booking:booking_deposit_refund
        when: {guarantee_type: [advance_deposit, full_prepayment]}
        map: {reservation_id: reservation_id, customer_id: customer_id, posted_date: relocated_date, charge_basis: deposit_refund, settlement_source: card_on_file, reversal_reason: not_applicable}
      - event: loyalty:loyalty_points_bonus
        when: {loyalty_member_id: {not: ""}}
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, reservation_id: reservation_id, posted_date: relocated_date, earning_source: relocation_compensation}
      - event: loyalty:loyalty_points_redeposit
        when: {points_redeemed: {not: 0}}
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, reservation_id: reservation_id, points: points_redeemed, posted_date: relocated_date, earning_source: award_redeposit}
      - event: certificate:certificate_release
        when: {certificate_nights: {not: 0}}
        map: {reservation_id: reservation_id}

  - type: booking_deposit_collect
    target: booking_charges
    meaning: "A full prepayment or a resort advance deposit is charged to the guest's card and held for the reservation."
    grain: "One row per collection on one reservation."
    distinguish_by: [charge_basis, posted_date]
    fields:
      reservation_id: "reservation the money is held for"
      customer_id: "guest charged"
      amount: "amount collected"
      posted_date: "date collected"
      charge_basis: "full_prepayment or resort_deposit"
      settlement_source: "card_on_file"
      reversal_reason: "not_applicable"
    account: advance_deposit
    direction: in
    triggers: []

  - type: booking_deposit_refund
    target: booking_charges
    meaning: "Money held for a reservation is returned to the guest's card."
    grain: "One row per refund of one held collection."
    distinguish_by: [related_charge_id, posted_date]
    fields:
      reservation_id: "reservation the money was held for"
      customer_id: "guest refunded"
      amount: "amount refunded"
      posted_date: "date refunded"
      charge_basis: "deposit_refund"
      settlement_source: "card_on_file"
      related_charge_id: "the collection being refunded"
      reversal_reason: "not_applicable"
    account: advance_deposit
    direction: out
    triggers: []

  - type: booking_deposit_forfeit
    target: booking_charges
    meaning: "Money held for a reservation is retained by the hotel to settle a cancellation or no-show penalty."
    grain: "One row per penalty settled from held money."
    distinguish_by: [related_charge_id]
    fields:
      reservation_id: "reservation the money was held for"
      customer_id: "guest"
      amount: "amount retained, equal to the penalty it settles"
      posted_date: "date retained"
      charge_basis: "deposit_forfeit"
      settlement_source: "advance_deposit"
      related_charge_id: "the penalty or no-show charge being settled"
      reversal_reason: "not_applicable"
    account: advance_deposit
    direction: out
    triggers: []

  - type: booking_deposit_transfer
    target: booking_charges
    meaning: "At check-in the money held for the reservation is moved to the guest folio as a payment."
    grain: "One row per transfer at one check-in."
    distinguish_by: [posted_date]
    fields:
      reservation_id: "reservation checked in"
      customer_id: "guest"
      amount: "entire amount still held"
      posted_date: "check-in date"
      charge_basis: "deposit_transfer"
      settlement_source: "advance_deposit"
      reversal_reason: "not_applicable"
    account: advance_deposit
    direction: out
    triggers:
      - event: folio:folio_payment
        map: {amount: amount, customer_id: customer_id, business_date: posted_date, posted_date: posted_date, charge_code: payment_deposit_transfer, adjustment_reason: not_applicable}

  - type: booking_cancellation_penalty
    target: booking_charges
    meaning: "A late cancellation penalty is assessed on a reservation cancelled after its effective deadline."
    grain: "One row per late-cancelled reservation."
    distinguish_by: [charge_basis]
    fields:
      reservation_id: "reservation cancelled late"
      customer_id: "guest charged"
      amount: "penalty amount"
      posted_date: "date assessed"
      charge_basis: "first_night_room_and_tax or full_stay_room_and_tax"
      settlement_source: "card_on_file, or advance_deposit when money is held"
      reversal_reason: "not_applicable"
    account: penalty_charged
    direction: in
    triggers:
      - event: booking:booking_deposit_forfeit
        when: {settlement_source: advance_deposit}
        map: {reservation_id: reservation_id, customer_id: customer_id, amount: amount, posted_date: posted_date, charge_basis: deposit_forfeit, settlement_source: advance_deposit, related_charge_id: charge_id, reversal_reason: not_applicable}

  - type: booking_no_show_charge
    target: booking_charges
    meaning: "A no-show charge is assessed on a guaranteed reservation whose guest never arrived."
    grain: "One row per no-show reservation."
    distinguish_by: [charge_basis]
    fields:
      reservation_id: "reservation marked a no-show"
      customer_id: "guest charged"
      amount: "no-show charge amount"
      posted_date: "date assessed"
      charge_basis: "first_night_room_and_tax or full_stay_room_and_tax"
      settlement_source: "card_on_file, or advance_deposit when money is held"
      reversal_reason: "not_applicable"
    account: penalty_charged
    direction: in
    triggers:
      - event: booking:booking_deposit_forfeit
        when: {settlement_source: advance_deposit}
        map: {reservation_id: reservation_id, customer_id: customer_id, amount: amount, posted_date: posted_date, charge_basis: deposit_forfeit, settlement_source: advance_deposit, related_charge_id: charge_id, reversal_reason: not_applicable}

  - type: booking_penalty_reversal
    target: booking_charges
    meaning: "All or part of a cancellation penalty or no-show charge is reversed because it should not have been charged as it was."
    grain: "One row per reversal of one penalty."
    distinguish_by: [related_charge_id]
    fields:
      reservation_id: "reservation the penalty was charged on"
      customer_id: "guest credited"
      amount: "amount reversed"
      posted_date: "date reversed"
      charge_basis: "penalty_reversal"
      settlement_source: "where the penalty was settled; the reversal is returned to the card on file in both cases"
      related_charge_id: "the penalty or no-show charge being reversed"
      reversal_reason: "duplicate_reservation, deadline_misapplied or penalty_basis_misapplied"
    account: penalty_charged
    direction: out
    triggers: []

measures:
  - id: booking_msr_overlapping_rooms
    window: "The nights from the requested arrival date up to (not including) the requested departure date."
    measure: "Count of the same customer's booking_reservations rows at the same property_code with status confirmed or in_house whose nights [arrival_date, departure_date) overlap the requested nights."
  - id: booking_msr_deposit_held
    window: "The whole life of one reservation, up to the moment of handling."
    measure: "Sum of amount over the reservation's booking_deposit_collect rows minus the sum over its booking_deposit_refund, booking_deposit_forfeit and booking_deposit_transfer rows (the advance_deposit account of that reservation)."
  - id: booking_msr_net_penalty_charged
    window: "The whole life of one reservation, up to the moment of handling."
    measure: "Sum of amount over the reservation's booking_cancellation_penalty and booking_no_show_charge rows minus the sum over its booking_penalty_reversal rows (the penalty_charged account of that reservation)."

policies:
  - id: booking_agg_multi_holding
    subject: [booking_reservation_create]
    rule: >-
      A guest profile may hold any number of reservations at any number of hotels at the same time;
      there is no brand-wide cap on reservations per guest. Reservations at the same hotel for
      overlapping nights are limited separately by booking_agg_rooms_per_stay. Each reservation
      covers exactly one room and is cancelled, changed, checked in and charged on its own; a request
      about one confirmation number never changes another reservation.
    eligibility: []
    params:
      max_per_customer: null

  - id: booking_agg_rooms_per_stay
    subject: [booking_reservation_create]
    rule: >-
      The rooms a guest holds at one hotel are combined by counting, with
      booking_msr_overlapping_rooms, the guest's confirmed and in-house reservations at the same
      property_code whose nights overlap the nights requested. A new reservation is booked only if
      the count of overlapping rooms plus the room being booked does not exceed the max_rooms_per_stay
      of the rate plan requested. Where the overlapping reservations are on different rate plans, the
      lowest max_rooms_per_stay among those plans and the plan requested applies. A request that
      would exceed the cap is never split across profiles or dates to fit; a request for
      group_referral_min_rooms or more rooms for the same nights is referred to group sales to be
      contracted as a group block, and a smaller excess request is declined.
    eligibility:
      - id: room_cap
        applies_to: [booking_reservation_create]
        kind: authorization
        condition: "A new reservation is booked only if the count of overlapping rooms plus the room being booked does not exceed the max_rooms_per_stay of the rate plan requested."
        evidence_fields: [booking_reservations.customer_id, booking_reservations.property_code, booking_reservations.status, booking_reservations.arrival_date, booking_reservations.departure_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.customer_id, booking_reservations.property_code]
          action_bindings:
            booking_reservations.customer_id: customer_id
            booking_reservations.property_code: property_code
    params:
      group_referral_min_rooms: 10
    measures: [booking_msr_overlapping_rooms]
    formula:
      rooms_after_booking: "booking_msr_overlapping_rooms + 1"
      within_cap: "booking_msr_overlapping_rooms + 1 <= max_rooms_per_stay"

  - id: booking_rate_plan_eligibility
    subject: [booking_reservation_create]
    rule: >-
      Each rate plan is sold only to reservations that meet its entry conditions at the moment of
      booking. When member_only is true, the reservation must carry an Ashbury Rewards membership of
      the same guest. The attached Ashbury Rewards membership must be active when the plan is
      member-only. When direct_channels_only is true, the booking_channel must be brand_website,
      mobile_app, call_center or property_direct. When corporate_code_required is true, the guest must
      quote a corporate client code, recorded verbatim in corporate_client_code. When
      group_code_required is true, the reservation must name a group block whose status is definite,
      and its nights must fall between the block's arrival and departure dates widened by
      shoulder_nights_at_group_rate on each side. The arrival date must fall no fewer than
      min_advance_booking_days calendar days after the booking date, counted back from the
      reservation's arrival date. Days are counted as whole calendar days between the two dates in
      hotel local time; a booking made exactly min_advance_booking_days calendar days before arrival
      qualifies. The arrival date may be no more than max_advance_booking_days calendar days after the
      booking date, and the stay must have at least min_length_of_stay_nights and at most
      max_length_of_stay_nights nights. A plan is not sold at the brands listed in its
      unavailable_at_brands. Combination rules: a reservation carries at most one of a corporate
      client code, a group block and a Reward Night Rate redemption, so a Reward Night Rate
      reservation never names a group block or a corporate client code and a Corporate Negotiated
      Rate reservation never names a group block. Free Night Award nights may appear only when
      certificate_nights_allowed is true. A reservation that fails any of these conditions is not
      booked under that plan; the guest may be offered the Flexible Rate, which has no entry
      condition.
    eligibility:
      - id: member_active
        applies_to: [booking_reservation_create]
        kind: state
        condition: "The attached Ashbury Rewards membership must be active when the plan is member-only."
        evidence_fields: [loyalty_memberships.status, booking_reservations.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.loyalty_member_id]
          action_bindings:
            booking_reservations.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
      - id: corporate_code_quoted
        applies_to: [booking_reservation_create]
        kind: caller_fact
        condition: "When corporate_code_required is true, the guest must quote a corporate client code, recorded verbatim in corporate_client_code."
        evidence_fields: [booking_reservations.corporate_client_code]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [booking_reservations.corporate_client_code]
          action_bindings:
            booking_reservations.corporate_client_code: corporate_client_code
      - id: group_block_definite
        applies_to: [booking_reservation_create]
        kind: state
        condition: "When group_code_required is true, the reservation must name a group block whose status is definite, and its nights must fall between the block's arrival and departure dates widened by shoulder_nights_at_group_rate on each side."
        evidence_fields: [group_blocks.status, group_blocks.arrival_date, group_blocks.departure_date, booking_reservations.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.group_block_id]
          action_bindings:
            booking_reservations.group_block_id: group_block_id
        state_contract:
          field: group_blocks.status
          allowed: [definite]
      - id: advance_booking_days
        applies_to: [booking_reservation_create]
        kind: time
        condition: "The arrival date must fall no fewer than min_advance_booking_days calendar days after the booking date, counted back from the reservation's arrival date."
        evidence_fields: [booking_reservations.arrival_date, booking_reservations.booked_date, booking_reservations.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.customer_id]
          action_bindings:
            booking_reservations.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the reservation's arrival date"
          anchor_source: booking_reservations.arrival_date
          relation: not_after
          duration_source: variants.min_advance_booking_days
          unit: calendar_days
          counting_rule: "Days are counted as whole calendar days between the two dates in hotel local time; a booking made exactly min_advance_booking_days calendar days before arrival qualifies."
          boundary: inclusive

  - id: booking_rate_plan_pricing
    subject: [booking_reservation_create, booking_reservation_modify]
    rule: >-
      The nightly rate of a reservation is fixed at booking from the hotel's Flexible Rate quote for
      the room type and night: the plan's price is the Flexible Rate less discount_off_flexible_pct
      percent, plus package_supplement_per_night_usd, rounded to the cent. Group Block Rate
      reservations take the block's group_rate instead, and Corporate Negotiated Rate reservations
      take the rate of the client agreement, which is never higher than the Flexible Rate less
      discount_off_flexible_pct percent. Reward Night Rate reservations carry a nightly rate of 0.00
      and are paid in points under the Ashbury Rewards award chart or with Free Night Awards. The rate
      covers included_adults adults; each further adult adds extra_adult_charge_per_night_usd per
      night, and children up to children_stay_free_max_age years sharing existing bedding are not
      counted as adults. The nightly_rate recorded on the reservation includes the package supplement
      and the extra-adult charge and excludes tax; tax is applied at the hotel's tax_rate_pct. When
      breakfast_included is true, breakfast_covers_per_night covers are served at the hotel's
      breakfast outlet each morning of the stay and are not billed to the folio. When a reservation is
      changed, nights that are added or moved are priced at the plan's price for the new nights if
      date_change_reprices is true; otherwise the original nightly rate is kept for every night. A
      Group Block Rate reservation keeps the group rate only for nights inside the block dates and the
      shoulder nights; nights beyond them are priced at the Flexible Rate.
    eligibility: []
    formula:
      extra_adults: "max(adults - included_adults, 0)"

  - id: booking_evt_advance_payment
    subject: [booking_deposit_collect]
    rule: >-
      Money is collected before arrival in two cases. When payment_timing is prepaid_at_booking,
      prepayment_pct_of_stay percent of the total room and tax of the stay is charged to the card on
      file at booking and the reservation is guaranteed by full_prepayment. When the reservation's
      property_brand is Ashbury Resort & Spa or Ashbury Reserve and the plan's resort_deposit_nights
      is above zero, a resort advance deposit of resort_deposit_nights nights of room and tax is
      charged at booking and the reservation is guaranteed by advance_deposit instead of the plan's
      default_guarantee_type. At every other brand, and on plans whose resort_deposit_nights is zero,
      nothing is collected before arrival and the reservation keeps the default_guarantee_type. Money
      is collected only for a reservation whose status is confirmed. Each reservation has at most one
      collection; a later change of nights neither collects a second deposit nor refunds part of the
      first. The money collected is held in the reservation's advance deposit until it is refunded,
      retained against a penalty or transferred to the folio at check-in.
    eligibility:
      - id: reservation_confirmed
        applies_to: [booking_deposit_collect]
        kind: state
        condition: "Money is collected only for a reservation whose status is confirmed."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [confirmed]
      - id: single_collection
        applies_to: [booking_deposit_collect]
        kind: dedup
        condition: "Each reservation has at most one collection; a later change of nights neither collects a second deposit nor refunds part of the first."
        evidence_fields: [booking_charges.reservation_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.reservation_id]
          action_bindings:
            booking_charges.reservation_id: reservation_id
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {reservation_id: reservation_id}
          duplicate_filters: {event_type: [booking_deposit_collect]}
          distinct_fields: []
    formula:
      prepayment_amount: "round(nightly_rate * nights * (1 + tax_rate_pct / 100) * prepayment_pct_of_stay / 100, 2)"
      resort_deposit_amount: "round(nightly_rate * resort_deposit_nights * (1 + tax_rate_pct / 100), 2)"

  - id: booking_cancellation_deadline
    subject: [booking_reservation_cancel]
    rule: >-
      A confirmed reservation may be cancelled at the guest's request at any time before arrival; the
      cancellation is recorded at the moment the guest's request is taken, and its timing decides
      every consequence. The effective deadline days are resort_cancellation_deadline_days when the
      reservation's property_brand is Ashbury Resort & Spa or Ashbury Reserve, and
      cancellation_deadline_days at every other brand; the brand recorded on the reservation decides.
      The cancellation is timely only if the moment the guest's cancellation request is recorded is
      not later than the effective cancellation deadline counted back from the reservation's arrival
      date. The effective cancellation deadline is cancellation_deadline_time hotel local time on the
      calendar date obtained by subtracting the effective deadline days, in whole calendar days, from
      the arrival date currently on the reservation; a cancellation recorded exactly at that minute is
      timely. A timely cancellation is recorded with cancellation_timing before_deadline and any other
      with after_deadline. On a plan whose free_cancellation_allowed is false every cancellation is
      recorded after_deadline whatever the clock shows. Reservations booked through an online travel
      agency are cancelled only by that agency and not by guest services. A reservation that is in
      house, checked out, marked a no-show or relocated cannot be cancelled.
    eligibility:
      - id: cancellation_deadline
        applies_to: [booking_reservation_cancel]
        kind: time
        condition: "The cancellation is timely only if the moment the guest's cancellation request is recorded is not later than the effective cancellation deadline counted back from the reservation's arrival date."
        evidence_fields: [booking_reservations.arrival_date, booking_reservations.property_brand, booking_reservations.variant_name, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the reservation's arrival date"
          anchor_source: booking_reservations.arrival_date
          relation: not_after
          duration_source: variants.cancellation_deadline_days
          unit: calendar_days
          counting_rule: "The effective cancellation deadline is cancellation_deadline_time hotel local time on the calendar date obtained by subtracting the effective deadline days, in whole calendar days, from the arrival date currently on the reservation; a cancellation recorded exactly at that minute is timely."
          boundary: inclusive
      - id: direct_booking_channel
        applies_to: [booking_reservation_cancel]
        kind: authorization
        condition: "Reservations booked through an online travel agency are cancelled only by that agency and not by guest services."
        evidence_fields: [booking_reservations.booking_channel, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
    params:
      per_tier:
        "Advance Purchase Non-Refundable Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Semi-Flexible Saver Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Flexible Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Member Flexible Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Bed & Breakfast Package Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Corporate Negotiated Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Group Block Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Reward Night Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
    formula:
      effective_deadline_days: "resort_cancellation_deadline_days if property_brand in ('Ashbury Resort & Spa', 'Ashbury Reserve') else cancellation_deadline_days"

  - id: booking_late_cancellation_penalty
    subject: [booking_cancellation_penalty]
    rule: >-
      A late cancellation penalty is charged only when the reservation's recorded cancellation_timing
      is after_deadline. A penalty is posted only on a reservation whose status is cancelled. The
      penalty basis is the plan's late_cancellation_penalty_basis. Under first_night_room_and_tax the
      penalty is one night at the reservation's nightly rate plus tax at tax_rate_pct; under
      full_stay_room_and_tax it is every night of the stay at the nightly rate plus tax; tax is added
      only when penalty_includes_tax is true. Under first_night_points no cash penalty is charged: the
      points or the Free Night Award paying the first night are retained and the rest of the
      redemption is returned under the Ashbury Rewards and Free Night Award rules. The nightly rate and
      nights are those on the reservation at the moment of cancellation, after any change or Best Rate
      Guarantee adjustment. When the reservation's guarantee is advance_deposit or full_prepayment the
      penalty is settled from the money held, with settlement_source advance_deposit, and any money
      held beyond the penalty is refunded to the card; otherwise the penalty is charged to the card on
      file with settlement_source card_on_file. A reservation carries at most one cancellation penalty
      or no-show charge. A timely cancellation never carries a penalty.
    eligibility:
      - id: late_cancellation_recorded
        applies_to: [booking_cancellation_penalty]
        kind: authorization
        condition: "A late cancellation penalty is charged only when the reservation's recorded cancellation_timing is after_deadline."
        evidence_fields: [booking_reservations.cancellation_timing, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
      - id: reservation_cancelled
        applies_to: [booking_cancellation_penalty]
        kind: state
        condition: "A penalty is posted only on a reservation whose status is cancelled."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [cancelled]
      - id: single_penalty
        applies_to: [booking_cancellation_penalty]
        kind: dedup
        condition: "A reservation carries at most one cancellation penalty or no-show charge."
        evidence_fields: [booking_charges.reservation_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.reservation_id]
          action_bindings:
            booking_charges.reservation_id: reservation_id
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {reservation_id: reservation_id}
          duplicate_filters: {event_type: [booking_cancellation_penalty, booking_no_show_charge]}
          distinct_fields: []
    params:
      per_tier:
        "Advance Purchase Non-Refundable Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Semi-Flexible Saver Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Flexible Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Member Flexible Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Bed & Breakfast Package Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Corporate Negotiated Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Group Block Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Reward Night Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
    formula:
      first_night_penalty: "round(nightly_rate * (1 + tax_rate_pct / 100), 2)"
      full_stay_penalty: "round(nightly_rate * nights * (1 + tax_rate_pct / 100), 2)"
      amount: "first_night_penalty if late_cancellation_penalty_basis == 'first_night_room_and_tax' else full_stay_penalty"

  - id: booking_no_show
    subject: [booking_no_show_mark, booking_no_show_charge]
    rule: >-
      A reservation becomes a no-show only when the guest has not checked in by the night audit that
      closes the arrival date. A reservation may be marked a no-show only after the night audit
      following the reservation's arrival date has run without a check-in. The night audit runs at
      no_show_audit_time hotel local time on the calendar day obtained by adding
      no_show_audit_offset_days to the arrival date; a reservation is marked no earlier than that
      moment. Reservations that were cancelled, relocated or checked in are never marked. The no-show
      charge follows the plan's no_show_penalty_basis and is computed exactly as the late cancellation
      penalty: first_night_room_and_tax is one night of room and tax and full_stay_room_and_tax is
      every night of the stay. A no-show charge is posted only on a reservation whose status is
      no_show. When no_show_releases_remaining_nights is true the nights after the first are released
      and not charged; when it is false the whole stay is retained. Under first_night_points no cash is
      charged: the points or Free Night Award of the first night are retained and the rest of the
      redemption is returned. Settlement follows the guarantee as for late cancellations: from the
      money held when the guarantee is advance_deposit or full_prepayment, otherwise to the card on
      file. A reservation carries at most one cancellation penalty or no-show charge. Marking a
      no-show is a hotel action; guest services never marks one.
    eligibility:
      - id: night_audit_passed
        applies_to: [booking_no_show_mark]
        kind: time
        condition: "A reservation may be marked a no-show only after the night audit following the reservation's arrival date has run without a check-in."
        evidence_fields: [booking_reservations.arrival_date, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the reservation's arrival date"
          anchor_source: booking_reservations.arrival_date
          relation: not_before
          duration_source: params.no_show_audit_offset_days
          unit: calendar_days
          counting_rule: "The night audit runs at no_show_audit_time hotel local time on the calendar day obtained by adding no_show_audit_offset_days to the arrival date; a reservation is marked no earlier than that moment."
          boundary: inclusive
      - id: reservation_no_show
        applies_to: [booking_no_show_charge]
        kind: state
        condition: "A no-show charge is posted only on a reservation whose status is no_show."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [no_show]
      - id: single_no_show_charge
        applies_to: [booking_no_show_charge]
        kind: dedup
        condition: "A reservation carries at most one cancellation penalty or no-show charge."
        evidence_fields: [booking_charges.reservation_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.reservation_id]
          action_bindings:
            booking_charges.reservation_id: reservation_id
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {reservation_id: reservation_id}
          duplicate_filters: {event_type: [booking_cancellation_penalty, booking_no_show_charge]}
          distinct_fields: []
    params:
      no_show_audit_offset_days: 1
      no_show_audit_time: "03:00"
    formula:
      amount: "round(nightly_rate * (1 + tax_rate_pct / 100), 2) if no_show_penalty_basis == 'first_night_room_and_tax' else round(nightly_rate * nights * (1 + tax_rate_pct / 100), 2)"

  - id: booking_evt_deposit_settlement
    subject: [booking_deposit_refund, booking_deposit_forfeit, booking_deposit_transfer]
    rule: >-
      Money held for a reservation leaves the advance deposit in one of four ways. On a timely
      cancellation the full amount held is refunded to the card when deposit_refundable_before_deadline
      is true, and retained as a forfeit when it is false. On a late cancellation or a no-show an
      amount equal to the penalty is retained as a forfeit and any amount held beyond the penalty is
      refunded. On a relocation the full amount held is refunded when
      relocation_refunds_advance_payments is true. At check-in whatever is still held is transferred to
      the guest folio as a payment. The amount held is read from booking_msr_deposit_held; no refund,
      forfeit or transfer exceeds it. A refund is made only for a reservation whose status is cancelled
      or relocated. A forfeit is made only for a reservation whose status is cancelled or no_show. A
      transfer is made only for a reservation whose status is in_house. Each collection is refunded at
      most once, and each penalty is settled from held money at most once.
    eligibility:
      - id: refund_state
        applies_to: [booking_deposit_refund]
        kind: state
        condition: "A refund is made only for a reservation whose status is cancelled or relocated."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [cancelled, relocated]
      - id: forfeit_state
        applies_to: [booking_deposit_forfeit]
        kind: state
        condition: "A forfeit is made only for a reservation whose status is cancelled or no_show."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [cancelled, no_show]
      - id: transfer_state
        applies_to: [booking_deposit_transfer]
        kind: state
        condition: "A transfer is made only for a reservation whose status is in_house."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [in_house]
      - id: single_refund
        applies_to: [booking_deposit_refund]
        kind: dedup
        condition: "Each collection is refunded at most once, and each penalty is settled from held money at most once."
        evidence_fields: [booking_charges.related_charge_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.related_charge_id]
          action_bindings:
            booking_charges.related_charge_id: related_charge_id
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {related_charge_id: related_charge_id}
          duplicate_filters: {event_type: [booking_deposit_refund]}
          distinct_fields: []
    measures: [booking_msr_deposit_held]
    formula:
      transfer_amount: "booking_msr_deposit_held"
      refund_after_forfeit: "max(booking_msr_deposit_held - amount, 0)"

  - id: booking_modification
    subject: [booking_reservation_modify]
    rule: >-
      A confirmed reservation may be changed before arrival within the limits of its plan. A
      reservation is changed only while its status is confirmed. Dates may be changed only when
      date_change_allowed is true, the room type only when room_type_change_allowed is true, and the
      reservation may be moved to another guest profile only when name_change_allowed is true; an
      Advance Purchase Non-Refundable Rate reservation therefore stays exactly as booked. The changed
      stay must still meet the plan's length-of-stay and advance-booking limits and, for Group Block
      Rate, fall inside the block dates and shoulder nights; a change that would break them can only be
      made by cancelling under the cancellation rules and booking again. Re-pricing follows
      booking_rate_plan_pricing. When reduction_after_deadline_penalized is true, nights cannot be
      removed once the effective cancellation deadline computed from the arrival date currently on
      the reservation has passed; the guest keeps the reservation as booked or cancels it as a late
      cancellation. Reservations booked through an online travel agency are changed only by that
      agency. A change to a Reward Night Rate reservation re-prices its points nights under the award
      chart, and the points difference is redeemed or redeposited by Ashbury Rewards.
    eligibility:
      - id: reservation_confirmed
        applies_to: [booking_reservation_modify]
        kind: state
        condition: "A reservation is changed only while its status is confirmed."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [confirmed]
      - id: direct_booking_channel
        applies_to: [booking_reservation_modify]
        kind: authorization
        condition: "Reservations booked through an online travel agency are changed only by that agency."
        evidence_fields: [booking_reservations.booking_channel, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id

  - id: booking_best_rate_guarantee
    subject: [booking_rate_guarantee_adjust]
    rule: >-
      When a guest finds the same hotel, room type, dates and occupancy offered to the public at a
      lower rate, the Best Rate Guarantee team may match it. A claim is accepted only on plans whose
      best_rate_guarantee_eligible is true. The claim must be made no later than the end of the
      brg_claim_window_days calendar days following the day the reservation was booked. The window
      closes at 23:59 hotel local time on the calendar date obtained by adding brg_claim_window_days
      whole calendar days to the booked date; a claim made at that minute is accepted. A claim must
      also be made no later than 23:59 hotel local time on the calendar date
      brg_claim_cutoff_days_before_arrival days before the arrival date. The lower rate must undercut
      the reservation's nightly rate by more than brg_min_difference_pct percent, be bookable at the
      time of the claim, and not be a member-only, opaque, package or group rate of another seller.
      When matched, the nightly rate becomes the lower rate less brg_extra_discount_pct percent,
      rounded to the cent, for every night of the reservation, and the adjustment date is recorded. A
      reservation is adjusted at most once and only while its status is confirmed. Guest services does
      not validate competitor rates and never changes a rate under this guarantee; the Best Rate
      Guarantee team's validation is the only basis for an adjustment.
    eligibility:
      - id: claim_window
        applies_to: [booking_rate_guarantee_adjust]
        kind: time
        condition: "The claim must be made no later than the end of the brg_claim_window_days calendar days following the day the reservation was booked."
        evidence_fields: [booking_reservations.booked_date, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the day the reservation was booked"
          anchor_source: booking_reservations.booked_date
          relation: not_after
          duration_source: variants.brg_claim_window_days
          unit: calendar_days
          counting_rule: "The window closes at 23:59 hotel local time on the calendar date obtained by adding brg_claim_window_days whole calendar days to the booked date; a claim made at that minute is accepted."
          boundary: inclusive
      - id: adjusted_once_confirmed
        applies_to: [booking_rate_guarantee_adjust]
        kind: state
        condition: "A reservation is adjusted at most once and only while its status is confirmed."
        evidence_fields: [booking_reservations.status, booking_reservations.rate_guarantee_date, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [confirmed]
    params:
      brg_min_difference_pct: 1

  - id: booking_evt_penalty_reversal
    subject: [booking_penalty_reversal]
    rule: >-
      A cancellation penalty or no-show charge is reversed only for one of three recorded reasons, and
      each reversal names the single original charge it reverses. A reversal is posted only on a
      reservation whose status is cancelled or no_show. The original charge must be a
      booking_cancellation_penalty or booking_no_show_charge recorded on the same reservation.
      duplicate_reservation applies when the charged reservation duplicates another reservation of
      the same guest at the same property_code with the same arrival and departure dates, booked on
      the same booked date, and that other reservation was checked in; the whole charge is reversed.
      deadline_misapplied applies when a late cancellation penalty sits on a reservation whose
      cancelled_at is not later than the effective cancellation deadline under
      booking_cancellation_deadline; the whole charge is reversed. penalty_basis_misapplied applies
      when the amount charged exceeds the amount the plan's penalty basis yields for the reservation;
      only the excess is reversed. Each original charge is reversed at most once, and the amount
      reversed never exceeds booking_msr_net_penalty_charged. Illness, travel disruption, weather,
      flight cancellations, bereavement and changes of plan are not reasons under this policy, and
      guest services does not waive or reduce a penalty for them.
    eligibility:
      - id: reservation_charged_state
        applies_to: [booking_penalty_reversal]
        kind: state
        condition: "A reversal is posted only on a reservation whose status is cancelled or no_show."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [cancelled, no_show]
      - id: original_charge_exists
        applies_to: [booking_penalty_reversal]
        kind: authorization
        condition: "The original charge must be a booking_cancellation_penalty or booking_no_show_charge recorded on the same reservation."
        evidence_fields: [booking_charges.charge_id, booking_charges.event_type, booking_charges.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.charge_id]
          action_bindings:
            booking_charges.charge_id: related_charge_id
      - id: single_reversal
        applies_to: [booking_penalty_reversal]
        kind: dedup
        condition: "Each original charge is reversed at most once, and the amount reversed never exceeds booking_msr_net_penalty_charged."
        evidence_fields: [booking_charges.related_charge_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.related_charge_id]
          action_bindings:
            booking_charges.related_charge_id: related_charge_id
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {related_charge_id: related_charge_id}
          duplicate_filters: {event_type: [booking_penalty_reversal]}
          distinct_fields: []
    measures: [booking_msr_net_penalty_charged]
    formula:
      reversal_cap: "booking_msr_net_penalty_charged"

  - id: booking_arrival_and_departure
    subject: [booking_check_in, booking_check_out]
    rule: >-
      Check-in and check-out are recorded by the hotel's front desk. Check-in is recorded only on or
      after the reservation's arrival date. The check-in date is compared with the arrival date as
      calendar dates in hotel local time; check-in on the arrival date itself is allowed. At check-in
      the folio of the stay is opened under the hotel's brand, any money held for the reservation is
      transferred to it as a payment, and Free Night Awards applied to the reservation are redeemed.
      Check-out may happen on the scheduled departure date or earlier; a check-out before the
      departure date is an early departure, and the nights stayed are the nights between the actual
      check-in and actual check-out dates. At check-out, when the reservation carries an Ashbury
      Rewards membership, elite night credits are posted for the nights stayed when
      counts_toward_elite_nights is true and points are posted when earns_base_points is true, with
      the elite bonus when earns_elite_bonus_points is true. A reservation booked through an online
      travel agency earns nothing unless ota_booking_earns is true, and one booked through
      travel_agency_gds earns only when gds_booking_earns is true; elite on-property benefits are not
      honoured on online travel agency reservations unless ota_booking_elite_benefits is true. Guest
      services cannot check a guest in or out.
    eligibility:
      - id: arrival_reached
        applies_to: [booking_check_in]
        kind: time
        condition: "Check-in is recorded only on or after the reservation's arrival date."
        evidence_fields: [booking_reservations.arrival_date, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the reservation's arrival date"
          anchor_source: booking_reservations.arrival_date
          relation: not_before
          duration_source: params.check_in_offset_days
          unit: calendar_days
          counting_rule: "The check-in date is compared with the arrival date as calendar dates in hotel local time; check-in on the arrival date itself is allowed."
          boundary: inclusive
    params:
      check_in_offset_days: 0

  - id: booking_relocation
    subject: [booking_relocate]
    rule: >-
      When a hotel cannot provide a guaranteed reservation on the arrival date it relocates the guest
      to a comparable hotel nearby. A relocated reservation is never charged a cancellation penalty or
      no-show charge. When relocation_first_night_paid is true the hotel pays the first night at the
      alternate hotel directly, and that payment does not pass through the guest's records.
      Prepayments and advance deposits held are refunded in full when
      relocation_refunds_advance_payments is true, points redeemed are returned in full, and Free
      Night Awards applied are released back to the member's account. When the reservation carries an
      Ashbury Rewards membership and relocation_compensation_eligible is true, relocation compensation
      points are posted under the Ashbury Rewards relocation compensation rule. Relocation is
      recorded by the hotel; guest services never relocates a reservation and adds no compensation
      beyond these rules.
    eligibility: []
