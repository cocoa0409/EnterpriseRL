# Room Reservations charter of Ashbury Hotels & Resorts.
# One holding = one room reservation booked under one rate plan at one hotel.
category: booking
display_name: Room Reservations

binding:
  holding_table: booking_reservations
  event_tables: [booking_charges]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [confirmed, in_house, checked_out, cancelled, no_show, relocated]
  transitions:
    - {from: confirmed, to: cancelled, by: agent, means: "The guest asks guest services to cancel a reservation that has not yet arrived and the cancellation is recorded."}
    - {from: confirmed, to: in_house, by: system, means: "The front desk checks the guest in on or after the arrival date."}
    - {from: in_house, to: checked_out, by: system, means: "The front desk checks the guest out and the stay ends."}
    - {from: confirmed, to: no_show, by: system, means: "The night audit marks a guaranteed reservation whose guest never arrived as a no-show."}
    - {from: confirmed, to: relocated, by: system, means: "The hotel cannot honour the reservation on arrival and relocates (walks) the guest to another hotel."}

accounts:
  - key: advance_deposit
    unit: USD
    meaning: "Money the hotel holds for a reservation before the stay: full prepayments of Advance Purchase reservations and resort advance deposits, until refunded, forfeited or transferred to the guest folio."
  - key: penalty_charged
    unit: USD
    meaning: "Net cancellation and no-show penalties charged on a reservation after reversals."

parameter_schema:
  discount_off_flexible_pct: "Percentage below the Flexible Rate for the same room type and night at which the plan is priced (number, %); 0 where the plan is priced at, above or independently of the Flexible Rate."
  package_supplement_per_night_usd: "Package supplement added to the Flexible Rate per night for the inclusions of the plan (USD)."
  payment_timing: "When the stay is paid (enum: prepaid_at_booking, pay_at_hotel, redeemed_at_booking)."
  prepayment_pct_of_stay: "Share of the total room and tax of the stay charged to the card at booking (number, %)."
  resort_deposit_nights: "Nights of room and tax collected as an advance deposit at booking when the hotel's brand is Ashbury Resort & Spa or Ashbury Reserve (integer nights)."
  deposit_refundable_before_deadline: "Whether an advance deposit is refunded when the reservation is cancelled on or before the effective cancellation deadline (boolean)."
  default_guarantee_type: "Guarantee recorded on the reservation at booking before any resort deposit rule applies (enum of booking_reservations.guarantee_type)."
  free_cancellation_allowed: "Whether the plan can be cancelled without penalty at all (boolean)."
  cancellation_deadline_days: "Calendar days before the arrival date on which the free-cancellation deadline falls at most hotels (integer days; 0 = the arrival date itself)."
  cancellation_deadline_time: "Hotel local clock time on the deadline date by which the cancellation must be recorded (HH:MM)."
  resort_cancellation_deadline_days: "Calendar days before the arrival date on which the deadline falls when the hotel's brand is Ashbury Resort & Spa or Ashbury Reserve (integer days); overrides cancellation_deadline_days there."
  late_cancellation_penalty_basis: "Penalty basis when a cancellation is recorded after the effective deadline (enum: first_night_room_and_tax, full_stay_room_and_tax, first_night_points)."
  no_show_penalty_basis: "Penalty basis when the reservation is marked a no-show (same enum as late_cancellation_penalty_basis)."
  no_show_releases_remaining_nights: "Whether the nights after the first are released without charge when the reservation is marked a no-show (boolean)."
  penalty_includes_tax: "Whether room and occupancy tax is added to a cash penalty (boolean)."
  date_change_allowed: "Whether arrival or departure dates may be changed after booking (boolean)."
  date_change_reprices: "Whether changed nights are re-priced at the plan's price for the new nights rather than keeping the original nightly rate (boolean)."
  room_type_change_allowed: "Whether the room type may be changed after booking (boolean)."
  name_change_allowed: "Whether the reservation may be transferred to another guest profile before arrival (boolean)."
  reduction_after_deadline_penalized: "Whether, once the effective cancellation deadline has passed, nights can no longer be removed and only a late cancellation of the whole reservation remains possible (boolean)."
  shoulder_nights_at_group_rate: "Nights immediately before the block's arrival date and after its departure date that may be booked at the group rate (integer nights)."
  min_advance_booking_days: "Minimum calendar days between the booking date and the arrival date (integer days)."
  max_advance_booking_days: "Maximum calendar days between the booking date and the arrival date (integer days)."
  min_length_of_stay_nights: "Minimum nights per reservation (integer nights)."
  max_length_of_stay_nights: "Maximum nights per reservation (integer nights)."
  max_rooms_per_stay: "Maximum reservations one guest may hold under the plan at the same hotel for overlapping nights (integer rooms)."
  included_adults: "Adults covered by the nightly rate (integer)."
  extra_adult_charge_per_night_usd: "Charge per night for each adult beyond included_adults (USD)."
  children_stay_free_max_age: "Oldest age at which a child sharing existing bedding is not counted as an extra adult (integer years)."
  earns_base_points: "Whether the stay earns Ashbury Rewards base points (boolean)."
  earns_elite_bonus_points: "Whether the stay earns the elite tier bonus on top of base points (boolean)."
  counts_toward_elite_nights: "Whether the stay's nights are credited as elite night credits (boolean)."
  ota_booking_earns: "Whether a reservation booked through an online travel agency earns points and night credits (boolean)."
  gds_booking_earns: "Whether a reservation booked by a travel agency through a global distribution system earns points and night credits (boolean)."
  ota_booking_elite_benefits: "Whether elite on-property benefits are honoured on a reservation booked through an online travel agency (boolean)."
  breakfast_included: "Whether breakfast is part of the plan (boolean)."
  breakfast_covers_per_night: "Breakfast covers included per night (integer persons)."
  member_only: "Whether the plan requires an active Ashbury Rewards membership attached to the reservation (boolean)."
  direct_channels_only: "Whether the plan may only be booked through brand_website, mobile_app, call_center or property_direct (boolean)."
  corporate_code_required: "Whether a corporate client code must be quoted at booking (boolean)."
  group_code_required: "Whether the reservation must be booked inside a group block (boolean)."
  unavailable_at_brands: "Hotel brands at which the plan is not sold (list of brand names)."
  best_rate_guarantee_eligible: "Whether the Best Rate Guarantee applies to the plan (boolean)."
  brg_claim_window_days: "Calendar days after the booked date by whose end (23:59 hotel local time) a Best Rate Guarantee claim must be made (integer days; 0 = not applicable)."
  brg_claim_cutoff_days_before_arrival: "Calendar days before the arrival date by whose end (23:59 hotel local time) a claim must be made at the latest (integer days; 0 = not applicable)."
  brg_extra_discount_pct: "Additional percentage off the lower rate granted when a claim is matched (number, %)."
  points_redeposit_on_timely_cancel: "Whether redeemed points are returned when the reservation is cancelled on or before the deadline (boolean)."
  certificate_nights_allowed: "Whether nights of the reservation may be paid with Free Night Awards (boolean)."
  relocation_first_night_paid: "Whether the hotel pays the first night at the alternate hotel when it relocates the guest (boolean)."
  relocation_refunds_advance_payments: "Whether prepayments and advance deposits held for a relocated reservation are refunded in full (boolean)."
  relocation_compensation_eligible: "Whether an Ashbury Rewards member relocated on this plan qualifies for relocation compensation points (boolean)."

