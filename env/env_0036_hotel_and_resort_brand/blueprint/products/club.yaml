events:
  - type: club_membership_create
    target: club_memberships
    mutation: create
    meaning: "A local applicant joins a resort club and the membership is opened pending the initiation fee."
    grain: "One row per transaction."
    fields:
      club_membership_id: "reference number of the new membership"
      customer_id: "primary member"
      variant_name: "membership level"
      membership_number: "membership number"
      property_code: "resort"
      billing_cycle: "monthly or annual_prepaid"
      family_members: "dependants registered"
      dues_balance: "0.00 at opening"
      guest_passes_remaining: "0 at opening"
    triggers:
      - event: club:club_initiation_charge
        map: {club_membership_id: club_membership_id, customer_id: customer_id, facility: not_applicable, charge_category: not_applicable}

  - type: club_activate
    target: club_memberships
    mutation: {transition: {from: pending, to: active}}
    meaning: "The initiation fee is paid and the membership starts."
    grain: "One row per transaction."
    fields:
      club_membership_id: "membership started"
      start_date: "start date"
      customer_id: "member (read, not changed)"
    triggers:
      - event: club:club_guest_pass_allocate
        map: {club_membership_id: club_membership_id, customer_id: customer_id, entry_date: start_date, facility: not_applicable, charge_category: not_applicable}

  - type: club_withdraw
    target: club_memberships
    mutation: {transition: {from: pending, to: terminated}}
    meaning: "The applicant withdraws before paying the initiation fee."
    grain: "One row per transaction."
    fields:
      club_membership_id: "membership withdrawn"
      termination_date: "date withdrawn"
    triggers: []

  - type: club_freeze
    target: club_memberships
    mutation: {transition: {from: active, to: frozen}}
    meaning: "A signed medical freeze notice takes effect."
    grain: "One row per transaction."
    fields:
      club_membership_id: "membership frozen"
      freeze_start_date: "first day of the freeze"
      freeze_end_date: "last day of the freeze"
    triggers: []

  - type: club_unfreeze
    target: club_memberships
    mutation: {transition: {from: frozen, to: active}}
    meaning: "The freeze period ends and dues billing resumes."
    grain: "One row per transaction."
    fields:
      club_membership_id: "membership resumed"
    triggers: []

  - type: club_cancel_notice
    target: club_memberships
    mutation: {transition: [{from: active, to: notice_given}, {from: frozen, to: notice_given}]}
    meaning: "The member's signed cancellation notice is received."
    grain: "One row per transaction."
    fields:
      club_membership_id: "membership"
      notice_date: "date the signed notice was received"
    triggers: []

  - type: club_terminate
    target: club_memberships
    mutation: {transition: [{from: notice_given, to: terminated}, {from: active, to: terminated}]}
    meaning: "The membership ends at the close of the notice period or for unpaid dues."
    grain: "One row per transaction."
    fields:
      club_membership_id: "membership ended"
      termination_date: "date ended"
      customer_id: "member (read, not changed)"
      guest_passes_remaining: "guest passes left (read, not changed)"
    triggers:
      - event: club:club_guest_pass_lapse
        when: {guest_passes_remaining: {not: 0}}
        map: {club_membership_id: club_membership_id, customer_id: customer_id, passes: guest_passes_remaining, entry_date: termination_date, facility: not_applicable, charge_category: not_applicable}

  - type: club_member_update
    target: club_memberships
    mutation: update
    meaning: "Dependants are added or removed, or the billing cycle is changed at renewal."
    grain: "One row per transaction."
    fields:
      club_membership_id: "membership"
      family_members: "dependants registered"
      billing_cycle: "billing cycle"
    triggers: []

  - type: club_initiation_charge
    target: club_ledger
    meaning: "The initiation fee is invoiced on joining."
    grain: "One entry per membership."
    distinguish_by: [billing_period]
    fields:
      club_membership_id: "membership"
      customer_id: "member"
      amount: "amount invoiced"
      passes: "0"
      entry_date: "date invoiced"
      billing_period: "membership year of joining (YYYY)"
      facility: "not_applicable"
      charge_category: "not_applicable"
    account: dues_balance
    direction: in
    triggers: []

  - type: club_dues_invoice
    target: club_ledger
    meaning: "Dues of one period are invoiced: a month, or twelve months in advance."
    grain: "One entry per dues period."
    distinguish_by: [billing_period]
    fields:
      club_membership_id: "membership"
      customer_id: "member"
      amount: "amount invoiced"
      passes: "0"
      entry_date: "date invoiced"
      billing_period: "month (YYYY-MM) or membership year (YYYY) invoiced"
      facility: "not_applicable"
      charge_category: "not_applicable"
    account: dues_balance
    direction: in
    triggers: []

  - type: club_freeze_fee
    target: club_ledger
    meaning: "The freeze fee of one frozen month is invoiced in place of dues."
    grain: "One entry per frozen month."
    distinguish_by: [billing_period]
    fields:
      club_membership_id: "membership"
      customer_id: "member"
      amount: "amount invoiced"
      passes: "0"
      entry_date: "date invoiced"
      billing_period: "frozen month (YYYY-MM)"
      facility: "not_applicable"
      charge_category: "not_applicable"
    account: dues_balance
    direction: in
    triggers: []

  - type: club_late_fee
    target: club_ledger
    meaning: "A late fee is charged on an invoice unpaid after the grace period."
    grain: "One entry per late invoice."
    distinguish_by: [related_entry_id]
    fields:
      club_membership_id: "membership"
      customer_id: "member"
      amount: "amount invoiced"
      passes: "0"
      entry_date: "date invoiced"
      billing_period: "dues period"
      facility: "not_applicable"
      charge_category: "not_applicable"
      related_entry_id: "the late invoice"
    account: dues_balance
    direction: in
    triggers: []

  - type: club_early_termination_fee
    target: club_ledger
    meaning: "The early termination charge is invoiced when a cancellation takes effect before the minimum term."
    grain: "One entry per membership."
    distinguish_by: [entry_date]
    fields:
      club_membership_id: "membership"
      customer_id: "member"
      amount: "amount invoiced"
      passes: "0"
