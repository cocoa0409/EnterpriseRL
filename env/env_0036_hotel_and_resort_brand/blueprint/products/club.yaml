measures:
  - id: club_msr_level_members
    window: "The resort's memberships at the moment of handling."
    measure: "Count of club_memberships rows at the same property_code and variant_name with status pending, active, frozen or notice_given."
  - id: club_msr_freeze_months_year
    window: "The current membership year, which runs from the start date's month and day each year."
    measure: "Count of the membership's club_freeze_fee entries whose billing_period falls in the current membership year."
  - id: club_msr_fb_charged_month
    window: "One calendar month, by entry_date."
    measure: "Sum of amount over the membership's club_member_charge entries with charge_category food_beverage."
  - id: club_msr_cabana_days_used_year
    window: "The current membership year."
    measure: "Count of the membership's club_member_charge entries with charge_category cabana and amount 0.00 (complimentary cabana days)."
  - id: club_msr_oldest_unpaid_invoice_date
    window: "The whole life of the membership up to the handling date."
    measure: "Earliest entry_date among the membership's invoice entries (club_dues_invoice, club_freeze_fee, club_initiation_charge, club_fb_minimum_charge, club_member_charge, club_guest_fee, club_late_fee, club_early_termination_fee) not fully covered by club_payment and club_dues_credit entries naming them."

policies:
  - id: club_agg_multi_holding
    subject: [club_membership_create]
    rule: >-
      A person may hold club memberships at more than one Ashbury resort, each a separate contract
      with its own dues, passes and benefits; the per-resort limit is set by club_agg_one_per_resort.
    eligibility: []
    params:
      max_per_customer: null

  - id: club_agg_one_per_resort
    subject: [club_membership_create]
    rule: >-
      Memberships of one person are combined per resort: a person holds at most one membership at a
      given resort's club, whatever its level. A membership is opened only if the person has no other
      membership at the same property_code whose status is pending, active, frozen or notice_given; a
      member who wants another level at the same resort changes level at renewal instead. Guest
      passes, complimentary cabana days and food and beverage minimums of memberships at different
      resorts are never pooled.
    eligibility:
      - id: one_open_membership_per_resort
        applies_to: [club_membership_create]
        kind: dedup
        condition: "A membership is opened only if the person has no other membership at the same property_code whose status is pending, active, frozen or notice_given; a member who wants another level at the same resort changes level at renewal instead."
        evidence_fields: [club_memberships.customer_id, club_memberships.property_code, club_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_memberships.customer_id, club_memberships.property_code]
          action_bindings:
            club_memberships.customer_id: customer_id
            club_memberships.property_code: property_code
        dedup_contract:
          table: club_memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id, property_code: property_code}
          duplicate_filters: {status: [pending, active, frozen, notice_given]}
          distinct_fields: []

  - id: club_enrolment
    subject: [club_membership_create, club_initiation_charge, club_activate, club_withdraw]
    rule: >-
      A membership is opened for a primary member who meets the level's minimum_age_primary, read from
      the date of birth on the profile, and, where sponsor_required is true, is sponsored by an existing
      member of the same club. A level accepts new members only while club_msr_level_members is below
      member_capacity; applicants beyond it are placed on the resort's waiting list and no membership is
      opened. The initiation fee is invoiced when the membership is opened, once. The membership starts
      when the initiation fee is paid, on the date of payment; the first month's dues are prorated by
      calendar days from the start date when prorate_first_month is true. An applicant who has not paid
      the initiation fee may withdraw, and the pending membership is terminated without charge. Initiation
      fees are not refunded once the membership has started.
    eligibility:
      - id: capacity_available
        applies_to: [club_membership_create]
        kind: authorization
        condition: "A level accepts new members only while club_msr_level_members is below member_capacity; applicants beyond it are placed on the resort's waiting list and no membership is opened."
        evidence_fields: [club_memberships.property_code, club_memberships.variant_name, club_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_memberships.property_code, club_memberships.variant_name]
          action_bindings:
            club_memberships.property_code: property_code
            club_memberships.variant_name: variant_name
      - id: initiation_once
        applies_to: [club_initiation_charge]
        kind: dedup
        condition: "The initiation fee is invoiced when the membership is opened, once."
        evidence_fields: [club_ledger.club_membership_id, club_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_ledger.club_membership_id]
          action_bindings:
            club_ledger.club_membership_id: club_membership_id
        dedup_contract:
          table: club_ledger
          mode: separate_record
          object_bindings: {club_membership_id: club_membership_id}
          duplicate_filters: {event_type: [club_initiation_charge]}
          distinct_fields: []
    params:
      per_tier:
        "Fitness Club Membership": {initiation: "=initiation_fee_usd", capacity: "=member_capacity", min_age: "=minimum_age_primary"}
        "Pool & Fitness Club Membership": {initiation: "=initiation_fee_usd", capacity: "=member_capacity", min_age: "=minimum_age_primary"}
        "Spa Club Membership": {initiation: "=initiation_fee_usd", capacity: "=member_capacity", min_age: "=minimum_age_primary"}
        "Beach & Pool Club Membership": {initiation: "=initiation_fee_usd", capacity: "=member_capacity", min_age: "=minimum_age_primary"}
        "Family Resort Club Membership": {initiation: "=initiation_fee_usd", capacity: "=member_capacity", min_age: "=minimum_age_primary"}
        "Founders Resort Club Membership": {initiation: "=initiation_fee_usd", capacity: "=member_capacity", min_age: "=minimum_age_primary"}
    measures: [club_msr_level_members]

  - id: club_dues_billing
    subject: [club_dues_invoice, club_member_update]
    rule: >-
      Dues are invoiced on billing_day_of_month for the coming month: monthly_dues_usd plus
      additional_family_member_monthly_usd for each registered dependant beyond
      family_members_included. Members on annual_prepaid are invoiced twelve months of those dues less
      annual_prepay_discount_pct percent, rounded to the cent, at the start of each membership year.
      Dues are invoiced only while the membership's status is active or notice_given; a frozen month is
      billed the freeze fee instead, and the month in which termination falls is prorated by calendar
      days up to the termination date. Dues do not rise during the first dues_rate_lock_months months,
      and no increase exceeds annual_dues_increase_cap_pct percent in a membership year. Dependants
      must be children no older than dependent_max_age or a spouse or partner, and changes of
      dependants or billing cycle take effect from the next invoice. Each dues period is invoiced once.
    eligibility:
      - id: billable_state
        applies_to: [club_dues_invoice]
        kind: state
        condition: "Dues are invoiced only while the membership's status is active or notice_given; a frozen month is billed the freeze fee instead, and the month in which termination falls is prorated by calendar days up to the termination date."
        evidence_fields: [club_memberships.status, club_memberships.club_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_memberships.club_membership_id]
          action_bindings:
            club_memberships.club_membership_id: club_membership_id
        state_contract:
          field: club_memberships.status
          allowed: [active, notice_given]
      - id: once_per_period
        applies_to: [club_dues_invoice]
        kind: dedup
        condition: "Each dues period is invoiced once."
        evidence_fields: [club_ledger.club_membership_id, club_ledger.billing_period, club_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_ledger.club_membership_id, club_ledger.billing_period]
          action_bindings:
            club_ledger.club_membership_id: club_membership_id
            club_ledger.billing_period: billing_period
        dedup_contract:
          table: club_ledger
          mode: separate_record
          object_bindings: {club_membership_id: club_membership_id, billing_period: billing_period}
          duplicate_filters: {event_type: [club_dues_invoice]}
          distinct_fields: []
    params:
      per_tier:
        "Fitness Club Membership": {dues: "=monthly_dues_usd", family_included: "=family_members_included", family_dues: "=additional_family_member_monthly_usd", prepay_discount: "=annual_prepay_discount_pct"}
        "Pool & Fitness Club Membership": {dues: "=monthly_dues_usd", family_included: "=family_members_included", family_dues: "=additional_family_member_monthly_usd", prepay_discount: "=annual_prepay_discount_pct"}
        "Spa Club Membership": {dues: "=monthly_dues_usd", family_included: "=family_members_included", family_dues: "=additional_family_member_monthly_usd", prepay_discount: "=annual_prepay_discount_pct"}
        "Beach & Pool Club Membership": {dues: "=monthly_dues_usd", family_included: "=family_members_included", family_dues: "=additional_family_member_monthly_usd", prepay_discount: "=annual_prepay_discount_pct"}
        "Family Resort Club Membership": {dues: "=monthly_dues_usd", family_included: "=family_members_included", family_dues: "=additional_family_member_monthly_usd", prepay_discount: "=annual_prepay_discount_pct"}
        "Founders Resort Club Membership": {dues: "=monthly_dues_usd", family_included: "=family_members_included", family_dues: "=additional_family_member_monthly_usd", prepay_discount: "=annual_prepay_discount_pct"}
    formula:
      monthly_amount: "monthly_dues_usd + max(family_members - family_members_included, 0) * additional_family_member_monthly_usd"
      annual_amount: "round(12 * (monthly_dues_usd + max(family_members - family_members_included, 0) * additional_family_member_monthly_usd) * (1 - annual_prepay_discount_pct / 100), 2)"

  - id: club_late_payment
    subject: [club_late_fee, club_terminate]
    rule: >-
      An invoice not paid within dues_grace_days calendar days of its entry date is late, and a late fee
      of late_fee_usd is charged on it once. A late fee is charged only once the grace period of the
      invoice has passed. The grace period ends at the close of the calendar day dues_grace_days days
      after the invoice's entry date; a payment on that day is on time. When the oldest unpaid invoice,
      read with club_msr_oldest_unpaid_invoice_date, has stayed unpaid for terminate_after_days_past_due
      calendar days, the membership is terminated for non-payment and the amounts owed remain due. Each
      invoice carries at most one late fee. A member whose signed notice has been received is
      terminated at the end of the notice period instead under club_cancellation.
    eligibility:
      - id: grace_passed
        applies_to: [club_late_fee]
        kind: time
        condition: "A late fee is charged only once the grace period of the invoice has passed."
        evidence_fields: [club_ledger.entry_date, club_ledger.club_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_ledger.club_entry_id]
          action_bindings:
            club_ledger.club_entry_id: related_entry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the grace period of the invoice"
          anchor_source: club_ledger.entry_date
          relation: not_before
          duration_source: variants.dues_grace_days
          unit: calendar_days
          counting_rule: "The grace period ends at the close of the calendar day dues_grace_days days after the invoice's entry date; a payment on that day is on time."
          boundary: exclusive
      - id: one_late_fee
        applies_to: [club_late_fee]
        kind: dedup
        condition: "Each invoice carries at most one late fee."
        evidence_fields: [club_ledger.related_entry_id, club_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_ledger.related_entry_id]
          action_bindings:
            club_ledger.related_entry_id: related_entry_id
        dedup_contract:
          table: club_ledger
          mode: separate_record
          object_bindings: {related_entry_id: related_entry_id}
          duplicate_filters: {event_type: [club_late_fee]}
          distinct_fields: []
    measures: [club_msr_oldest_unpaid_invoice_date]

  - id: club_freeze_rules
    subject: [club_freeze, club_unfreeze, club_freeze_fee]
    rule: >-
      A membership may be frozen for medical reasons when medical_freeze_allowed is true. A freeze takes
      effect only on a medical freeze notice the member has signed. The freeze starts on the first day of
      the next billing period when freeze_starts_next_billing_period is true, lasts whole months, at
      least min_freeze_months, and the frozen months of a membership year, counted with
      club_msr_freeze_months_year including the new freeze, may not exceed max_freeze_months_per_year.
      Each frozen month is billed freeze_fee_per_month_usd instead of dues. A freeze fee is billed only
      for a membership whose status is frozen. Guest passes and benefits cannot be used while frozen, and
      the minimum term is extended by the frozen months. At the end of the freeze the membership
      becomes active and dues resume.
    eligibility:
      - id: signed_medical_notice
        applies_to: [club_freeze]
        kind: authorization
        condition: "A freeze takes effect only on a medical freeze notice the member has signed."
        evidence_fields: [club_notices.notice_type, club_notices.status, club_notices.club_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_notices.club_membership_id]
          action_bindings:
            club_notices.club_membership_id: club_membership_id
      - id: frozen_state
        applies_to: [club_freeze_fee]
        kind: state
        condition: "A freeze fee is billed only for a membership whose status is frozen."
        evidence_fields: [club_memberships.status, club_memberships.club_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_memberships.club_membership_id]
          action_bindings:
            club_memberships.club_membership_id: club_membership_id
        state_contract:
          field: club_memberships.status
          allowed: [frozen]
    params:
      per_tier:
        "Fitness Club Membership": {freeze_fee: "=freeze_fee_per_month_usd", max_months: "=max_freeze_months_per_year"}
        "Pool & Fitness Club Membership": {freeze_fee: "=freeze_fee_per_month_usd", max_months: "=max_freeze_months_per_year"}
        "Spa Club Membership": {freeze_fee: "=freeze_fee_per_month_usd", max_months: "=max_freeze_months_per_year"}
        "Beach & Pool Club Membership": {freeze_fee: "=freeze_fee_per_month_usd", max_months: "=max_freeze_months_per_year"}
        "Family Resort Club Membership": {freeze_fee: "=freeze_fee_per_month_usd", max_months: "=max_freeze_months_per_year"}
        "Founders Resort Club Membership": {freeze_fee: "=freeze_fee_per_month_usd", max_months: "=max_freeze_months_per_year"}
    measures: [club_msr_freeze_months_year]

  - id: club_cancellation
    subject: [club_cancel_notice, club_terminate, club_early_termination_fee]
    rule: >-
      A member cancels only by signing a cancellation notice when notice_must_be_signed is true; the
      notice date is the day the signed notice is received, and a request by phone or at the club desk
      has no effect until it is signed. The membership terminates cancellation_notice_days calendar days
      after the notice date, and dues remain payable until then. A membership terminates only once its
      notice period has run. The notice period is counted in whole calendar days from the notice date,
      which is day zero; the membership is terminated on the last day of the count. When the termination
      date falls before the end of the minimum term, minimum_term_months months from the start date
      extended by any frozen months, an early termination charge is invoiced on termination:
      early_termination_fee_usd under flat_fee, or the dues of the months remaining in the minimum term
      under remaining_term_dues. The charge is waived when the member permanently moves more than
      relocation_waiver_miles miles from the resort and gives proof of the new residence with the
      notice. Remaining guest passes lapse on termination. The early termination charge is invoiced at
      most once.
    eligibility:
      - id: signed_notice
        applies_to: [club_cancel_notice]
        kind: authorization
        condition: "A member cancels only by signing a cancellation notice when notice_must_be_signed is true; the notice date is the day the signed notice is received, and a request by phone or at the club desk has no effect until it is signed."
        evidence_fields: [club_notices.notice_type, club_notices.status, club_notices.club_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_notices.club_membership_id]
          action_bindings:
            club_notices.club_membership_id: club_membership_id
      - id: notice_period_run
        applies_to: [club_terminate]
        kind: time
        condition: "A membership terminates only once its notice period has run."
        evidence_fields: [club_memberships.notice_date, club_memberships.club_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_memberships.club_membership_id]
          action_bindings:
            club_memberships.club_membership_id: club_membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "its notice period"
          anchor_source: club_memberships.notice_date
          relation: not_before
          duration_source: variants.cancellation_notice_days
          unit: calendar_days
          counting_rule: "The notice period is counted in whole calendar days from the notice date, which is day zero; the membership is terminated on the last day of the count."
          boundary: inclusive
      - id: relocation_proof
        applies_to: [club_early_termination_fee]
        kind: caller_fact
        condition: "The charge is waived when the member permanently moves more than relocation_waiver_miles miles from the resort and gives proof of the new residence with the notice."
        evidence_fields: [club_notices.notice_type, club_notices.club_membership_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [club_notices.club_membership_id]
          action_bindings:
            club_notices.club_membership_id: club_membership_id
      - id: charged_once
        applies_to: [club_early_termination_fee]
        kind: dedup
        condition: "The early termination charge is invoiced at most once."
        evidence_fields: [club_ledger.club_membership_id, club_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_ledger.club_membership_id]
          action_bindings:
            club_ledger.club_membership_id: club_membership_id
        dedup_contract:
          table: club_ledger
          mode: separate_record
          object_bindings: {club_membership_id: club_membership_id}
          duplicate_filters: {event_type: [club_early_termination_fee]}
          distinct_fields: []
    params:
      per_tier:
        "Fitness Club Membership": {notice_days: "=cancellation_notice_days", min_term: "=minimum_term_months", basis: "=early_termination_basis", fee: "=early_termination_fee_usd"}
        "Pool & Fitness Club Membership": {notice_days: "=cancellation_notice_days", min_term: "=minimum_term_months", basis: "=early_termination_basis", fee: "=early_termination_fee_usd"}
        "Spa Club Membership": {notice_days: "=cancellation_notice_days", min_term: "=minimum_term_months", basis: "=early_termination_basis", fee: "=early_termination_fee_usd"}
        "Beach & Pool Club Membership": {notice_days: "=cancellation_notice_days", min_term: "=minimum_term_months", basis: "=early_termination_basis", fee: "=early_termination_fee_usd"}
        "Family Resort Club Membership": {notice_days: "=cancellation_notice_days", min_term: "=minimum_term_months", basis: "=early_termination_basis", fee: "=early_termination_fee_usd"}
        "Founders Resort Club Membership": {notice_days: "=cancellation_notice_days", min_term: "=minimum_term_months", basis: "=early_termination_basis", fee: "=early_termination_fee_usd"}

  - id: club_guest_rules
    subject: [club_guest_pass_allocate, club_guest_pass_use, club_guest_pass_lapse, club_guest_fee]
    rule: >-
      At the start of each membership year guest_passes_per_year passes are allocated, and unused passes
      lapse at the end of the year when guest_pass_carryover is false, and on termination. A guest is
      admitted only with the member present when guest_pass_requires_member_present is true, only to a
      facility in guest_pass_facilities, and at most max_guests_per_visit guests per visit. Each guest
      uses one pass per visit day while passes remain; once none remain, each guest visit is charged
      guest_fee_usd. Guests are admitted only while the membership's status is active. A guest uses one
      pass or one guest fee per visit day, never both.
    eligibility:
      - id: active_only
        applies_to: [club_guest_pass_use, club_guest_fee]
        kind: state
        condition: "Guests are admitted only while the membership's status is active."
        evidence_fields: [club_memberships.status, club_memberships.club_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_memberships.club_membership_id]
          action_bindings:
            club_memberships.club_membership_id: club_membership_id
        state_contract:
          field: club_memberships.status
          allowed: [active]
      - id: once_per_guest_day
        applies_to: [club_guest_pass_use, club_guest_fee]
        kind: dedup
        condition: "A guest uses one pass or one guest fee per visit day, never both."
        evidence_fields: [club_ledger.club_membership_id, club_ledger.guest_name, club_ledger.entry_date, club_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_ledger.club_membership_id, club_ledger.guest_name, club_ledger.entry_date]
          action_bindings:
            club_ledger.club_membership_id: club_membership_id
            club_ledger.guest_name: guest_name
            club_ledger.entry_date: entry_date
        dedup_contract:
          table: club_ledger
          mode: separate_record
          object_bindings: {club_membership_id: club_membership_id, guest_name: guest_name, entry_date: entry_date}
          duplicate_filters: {event_type: [club_guest_pass_use, club_guest_fee]}
          distinct_fields: []
    params:
      per_tier:
        "Fitness Club Membership": {passes: "=guest_passes_per_year", guest_fee: "=guest_fee_usd", facilities: "=guest_pass_facilities"}
        "Pool & Fitness Club Membership": {passes: "=guest_passes_per_year", guest_fee: "=guest_fee_usd", facilities: "=guest_pass_facilities"}
        "Spa Club Membership": {passes: "=guest_passes_per_year", guest_fee: "=guest_fee_usd", facilities: "=guest_pass_facilities"}
        "Beach & Pool Club Membership": {passes: "=guest_passes_per_year", guest_fee: "=guest_fee_usd", facilities: "=guest_pass_facilities"}
        "Family Resort Club Membership": {passes: "=guest_passes_per_year", guest_fee: "=guest_fee_usd", facilities: "=guest_pass_facilities"}
        "Founders Resort Club Membership": {passes: "=guest_passes_per_year", guest_fee: "=guest_fee_usd", facilities: "=guest_pass_facilities"}

  - id: club_member_privileges
    subject: [club_member_charge, club_fb_minimum_charge]
    rule: >-
      Members sign outlet purchases to the club account at the member price, which is the outlet's list
      price less the level's discount for the charge category, rounded to the cent:
      spa_treatment_discount_pct for spa treatments, fb_discount_pct for food and beverage,
      retail_discount_pct for shop purchases, cabana_discount_pct on cabana_day_rate_usd for cabanas, and
      personal_training_discount_pct on personal_training_session_usd for training. The first
      complimentary_cabana_days_per_year cabana days of a membership year, counted with
      club_msr_cabana_days_used_year, are charged at 0.00. Facilities outside the level's access
      (fitness_access, pool_access, spa_facility_access, beach_club_access) cannot be used or charged.
      Member charges are accepted only while the membership's status is active or notice_given. In the
      months of fb_minimum_season_months, when the food and beverage a member charged in the month,
      counted with club_msr_fb_charged_month, is below monthly_fb_minimum_usd, the difference is
      invoiced after the month ends, once per month. Discounts never combine with other offers or apply
      to hotel room charges.
    eligibility:
      - id: chargeable_state
        applies_to: [club_member_charge]
        kind: state
        condition: "Member charges are accepted only while the membership's status is active or notice_given."
        evidence_fields: [club_memberships.status, club_memberships.club_membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_memberships.club_membership_id]
          action_bindings:
            club_memberships.club_membership_id: club_membership_id
        state_contract:
          field: club_memberships.status
          allowed: [active, notice_given]
    params:
      per_tier:
        "Fitness Club Membership": {spa: "=spa_treatment_discount_pct", fb: "=fb_discount_pct", retail: "=retail_discount_pct", minimum: "=monthly_fb_minimum_usd"}
        "Pool & Fitness Club Membership": {spa: "=spa_treatment_discount_pct", fb: "=fb_discount_pct", retail: "=retail_discount_pct", minimum: "=monthly_fb_minimum_usd"}
        "Spa Club Membership": {spa: "=spa_treatment_discount_pct", fb: "=fb_discount_pct", retail: "=retail_discount_pct", minimum: "=monthly_fb_minimum_usd"}
        "Beach & Pool Club Membership": {spa: "=spa_treatment_discount_pct", fb: "=fb_discount_pct", retail: "=retail_discount_pct", minimum: "=monthly_fb_minimum_usd"}
        "Family Resort Club Membership": {spa: "=spa_treatment_discount_pct", fb: "=fb_discount_pct", retail: "=retail_discount_pct", minimum: "=monthly_fb_minimum_usd"}
        "Founders Resort Club Membership": {spa: "=spa_treatment_discount_pct", fb: "=fb_discount_pct", retail: "=retail_discount_pct", minimum: "=monthly_fb_minimum_usd"}
    measures: [club_msr_fb_charged_month, club_msr_cabana_days_used_year]
    formula:
      fb_member_price: "round(list_price_usd * (1 - fb_discount_pct / 100), 2)"
      fb_minimum_shortfall: "max(monthly_fb_minimum_usd - club_msr_fb_charged_month, 0)"

  - id: club_payments_and_credits
    subject: [club_payment, club_dues_credit]
    rule: >-
      Invoices are paid by automatic card payment when autopay_required is true, each payment naming
      the invoice it pays. A credit is given only for an invoice that should not have been raised: dues
      invoiced for a month in which the membership was frozen, dues or charges invoiced for a period
      after the termination date, and a second dues invoice for the same billing period; the credit is
      the full amount of that invoice, or the part of a prorated month outside the membership. Each
      invoice is credited at most once. Goodwill credits, credits for facilities a member chose not to
      use, and refunds of initiation fees are outside these rules.
    eligibility:
      - id: credit_once
        applies_to: [club_dues_credit]
        kind: dedup
        condition: "Each invoice is credited at most once."
        evidence_fields: [club_ledger.related_entry_id, club_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [club_ledger.related_entry_id]
          action_bindings:
            club_ledger.related_entry_id: related_entry_id
        dedup_contract:
          table: club_ledger
          mode: separate_record
          object_bindings: {related_entry_id: related_entry_id}
          duplicate_filters: {event_type: [club_dues_credit]}
          distinct_fields: []
