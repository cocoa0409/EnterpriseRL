# Resort Club Memberships charter of Ashbury Hotels & Resorts.
# One holding = one local member's club membership at one resort, billed monthly or annually.
category: club
display_name: Resort Club Memberships

binding:
  holding_table: club_memberships
  event_tables: [club_ledger]
  intake_tables: [club_notices]
  status_field: status
  variant_field: variant_name
  quantity_fields: {dues_balance: dues_balance, guest_passes_remaining: guest_passes}

lifecycle:
  states: [pending, active, frozen, notice_given, terminated]
  transitions:
    - {from: pending, to: active, by: system, means: "The initiation fee is paid and the membership starts."}
    - {from: pending, to: terminated, by: agent, means: "The applicant withdraws before the initiation fee is paid."}
    - {from: active, to: frozen, by: agent, means: "A signed medical freeze notice takes effect at the start of the next billing period."}
    - {from: frozen, to: active, by: system, means: "The freeze period ends and billing resumes."}
    - {from: active, to: notice_given, by: user, means: "The member's signed cancellation notice is received."}
    - {from: frozen, to: notice_given, by: user, means: "A frozen member's signed cancellation notice is received."}
    - {from: notice_given, to: terminated, by: system, means: "The notice period ends and the membership terminates."}
    - {from: active, to: terminated, by: system, means: "The membership is terminated for dues unpaid past the termination threshold."}

accounts:
  - key: dues_balance
    unit: USD
    meaning: "Amount the member owes the club: fees, dues and member charges invoiced, less payments and credits."
  - key: guest_passes
    unit: passes
    meaning: "Guest passes left in the current membership year."

parameter_schema:
  initiation_fee_usd: "One-time initiation fee charged on joining (USD)."
  monthly_dues_usd: "Monthly dues of the primary member (USD)."
  annual_prepay_discount_pct: "Discount on twelve months of dues paid in advance (number, %)."
  minimum_term_months: "Months from the start date before which a cancellation incurs the early termination charge (integer months)."
  cancellation_notice_days: "Calendar days between receipt of the signed cancellation notice and termination (integer days)."
  early_termination_basis: "How the early termination charge is computed (enum: flat_fee, remaining_term_dues)."
  early_termination_fee_usd: "Early termination charge where the basis is flat_fee (USD)."
  relocation_waiver_miles: "Distance of a permanent move from the resort beyond which the early termination charge is waived (integer miles)."
  medical_freeze_allowed: "Whether a membership may be frozen on a signed medical freeze notice (boolean)."
  freeze_fee_per_month_usd: "Fee per frozen month in place of dues (USD)."
  max_freeze_months_per_year: "Most frozen months per membership year (integer months)."
  min_freeze_months: "Fewest months of one freeze (integer months)."
  freeze_starts_next_billing_period: "Whether a freeze always starts on the first day of the next billing period (boolean)."
  billing_day_of_month: "Day of the month on which dues are invoiced (integer)."
  dues_grace_days: "Calendar days after invoicing before an unpaid invoice is late (integer days)."
  late_fee_usd: "Fee for an invoice unpaid after the grace period (USD)."
  terminate_after_days_past_due: "Calendar days after invoicing after which an unpaid invoice terminates the membership (integer days)."
  guest_passes_per_year: "Guest passes allocated at the start of each membership year (integer passes)."
  guest_pass_carryover: "Whether unused passes carry to the next membership year (boolean)."
  guest_fee_usd: "Fee per guest visit once passes are used up (USD)."
  max_guests_per_visit: "Most guests a member may bring on one visit (integer)."
  guest_pass_requires_member_present: "Whether the member must accompany the guest (boolean)."
  guest_pass_facilities: "Facilities a member's guest may use (list of facilities)."
  passes_reset_basis: "When passes are allocated and lapse (enum: membership_anniversary)."
  family_members_included: "Dependants included in the dues (integer persons)."
  additional_family_member_monthly_usd: "Monthly dues per dependant beyond those included (USD)."
  dependent_max_age: "Oldest age of a child who may be registered as a dependant (integer years)."
  fitness_access: "Whether the fitness centre is included (boolean)."
  pool_access: "Whether the resort pools are included (boolean)."
  spa_facility_access: "Whether the spa's thermal facilities are included (boolean)."
  beach_club_access: "Whether the beach club is included (boolean)."
  spa_treatment_discount_pct: "Member discount on spa treatments (number, %)."
  fb_discount_pct: "Member discount on food and beverage at resort outlets (number, %)."
  retail_discount_pct: "Member discount at resort shops (number, %)."
  cabana_discount_pct: "Member discount on cabana day rental (number, %)."
  cabana_day_rate_usd: "Cabana day rental before the member discount (USD; 0 where cabanas are not offered)."
  complimentary_cabana_days_per_year: "Cabana days included per membership year (integer days)."
  personal_training_session_usd: "Price of a one-hour personal training session before the member discount (USD)."
  personal_training_discount_pct: "Member discount on personal training (number, %)."
  monthly_fb_minimum_usd: "Food and beverage a member must charge per month in the minimum season (USD; 0 when none)."
  fb_minimum_season_months: "Months in which the food and beverage minimum applies (list of month numbers)."
  minimum_age_primary: "Minimum age of the primary member (integer years)."
  member_capacity: "Most memberships of the level the resort accepts (integer)."
  sponsor_required: "Whether an existing member must sponsor the application (boolean)."
  dues_rate_lock_months: "Months from the start date during which dues cannot rise (integer months)."
  annual_dues_increase_cap_pct: "Largest dues increase in one membership year (number, %)."
  autopay_required: "Whether dues and charges must be paid by automatic card payment (boolean)."
  prorate_first_month: "Whether dues of the first month are prorated from the start date (boolean)."
  notice_must_be_signed: "Whether cancellation and freeze notices take effect only once signed by the member (boolean)."

