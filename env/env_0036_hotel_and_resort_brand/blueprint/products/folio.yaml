events:
  - type: folio_open
    target: folio_accounts
    mutation: create
    meaning: "At check-in the hotel opens the guest folio of the stay."
    grain: "One row per transaction."
    fields:
      folio_id: "reference number of the new folio"
      customer_id: "guest"
      reservation_id: "reservation checked in"
      variant_name: "brand of the hotel"
      folio_number: "folio number printed on the bill"
      property_code: "hotel"
      opened_date: "check-in date"
      loyalty_member_id: "membership credited for the stay"
      balance_due: "0.00 at opening"
    triggers: []

  - type: folio_room_charge
    target: folio_postings
    meaning: "The night audit posts the room rate and the room tax of one night stayed."
    grain: "One line per charge code per stay night."
    distinguish_by: [charge_code, business_date, posting_sequence]
    fields:
      folio_id: "folio of the stay"
      customer_id: "guest"
      charge_code: "room or room_tax"
      amount: "nightly rate, or the room tax on it"
      business_date: "stay night"
      posted_date: "date posted"
      posting_sequence: "folio line number"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: in
    triggers: []

  - type: folio_resort_fee
    target: folio_postings
    meaning: "The night audit posts the resort or destination fee, and its tax, for one night stayed."
    grain: "One line per charge code per stay night."
    distinguish_by: [charge_code, business_date, posting_sequence]
    fields:
      folio_id: "folio of the stay"
      customer_id: "guest"
      charge_code: "resort_fee or resort_fee_tax"
      amount: "fee or the tax on it"
      business_date: "stay night"
      posted_date: "date posted"
      posting_sequence: "folio line number"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: in
    triggers: []

  - type: folio_incidental_charge
    target: folio_postings
    meaning: "An outlet or department of the hotel posts an incidental charge: breakfast, restaurant, minibar, spa, parking, pet or smoking cleaning fee."
    grain: "One line per charge as posted by the outlet."
    distinguish_by: [charge_code, business_date, posting_sequence]
    fields:
      folio_id: "folio of the stay"
      customer_id: "guest"
      charge_code: "breakfast, food_beverage, minibar, spa, parking_self, parking_valet, pet_fee or smoking_cleaning"
      amount: "amount of the charge"
      business_date: "date the charge was incurred"
      posted_date: "date posted, later than the business date for late charges"
      posting_sequence: "folio line number"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: in
    triggers: []

  - type: folio_late_checkout_fee
    target: folio_postings
    meaning: "At check-out the hotel posts a late check-out fee because the guest left after the standard check-out time."
    grain: "One line per stay."
    distinguish_by: [business_date]
    fields:
      folio_id: "folio of the stay"
      customer_id: "guest"
      charge_code: "late_checkout"
      amount: "fee including any tax"
      business_date: "check-out date"
      posted_date: "date posted"
      posting_sequence: "folio line number"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: in
    triggers: []

  - type: folio_early_departure_fee
    target: folio_postings
    meaning: "At check-out the hotel posts an early departure fee because the guest left before the departure date on the reservation."
    grain: "One line per stay."
    distinguish_by: [business_date]
    fields:
      folio_id: "folio of the stay"
      customer_id: "guest"
      charge_code: "early_departure"
      amount: "fee including any tax"
      business_date: "check-out date"
      posted_date: "date posted"
      posting_sequence: "folio line number"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: in
    triggers: []

  - type: folio_payment
    target: folio_postings
    meaning: "A payment is applied to the folio: the card on file at check-out or after a late charge, or the advance deposit transferred at check-in."
    grain: "One line per payment."
    distinguish_by: [charge_code, posted_date, posting_sequence]
    fields:
      folio_id: "folio paid"
      customer_id: "guest"
      charge_code: "payment_card or payment_deposit_transfer"
      amount: "amount paid"
      business_date: "date of the payment"
      posted_date: "date posted"
      posting_sequence: "folio line number"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: out
    triggers: []

  - type: folio_adjustment
    target: folio_postings
    meaning: "Guest services or the hotel corrects one folio line, wholly or partly, for a recorded reason."
    grain: "One line per corrected original line."
    distinguish_by: [related_posting_id]
    fields:
      folio_id: "folio corrected"
      customer_id: "guest"
      charge_code: "charge code of the line corrected"
      amount: "amount taken off"
      business_date: "business date of the line corrected"
      posted_date: "date of the correction"
      posting_sequence: "0 when posted by guest services"
      related_posting_id: "the line corrected"
      adjustment_reason: "duplicate_posting, incorrect_rate, charge_not_incurred, late_charge_outside_window, resort_fee_not_applicable, elite_benefit_not_applied or early_departure_fee_not_applicable"
    account: folio_balance
    direction: out
    triggers:
      - event: loyalty:loyalty_points_reversal
        when: {charge_code: [room, breakfast, food_beverage, spa]}
        map: {customer_id: customer_id, posted_date: posted_date, earning_source: stay_credit_reversal}

  - type: folio_breakfast_benefit_credit
    target: folio_postings
    meaning: "The elite breakfast benefit is credited against a breakfast charged at the outlet."
    grain: "One credit per breakfast line offset."
    distinguish_by: [related_posting_id]
    fields:
      folio_id: "folio credited"
      customer_id: "guest"
      charge_code: "elite_breakfast_credit"
      amount: "credit amount"
      business_date: "morning of the breakfast"
      posted_date: "date credited"
      posting_sequence: "folio line number, or 0 when posted by guest services"
      related_posting_id: "the breakfast line offset"
      adjustment_reason: "not_applicable when posted by the outlet, elite_benefit_not_applied when posted later by guest services"
    account: folio_balance
    direction: out
    triggers: []

  - type: folio_refund
    target: folio_postings
    meaning: "A credit balance on a corrected folio is refunded to the card the folio was settled to."
    grain: "One line per refund."
    distinguish_by: [posted_date, amount]
    fields:
      folio_id: "folio refunded"
      customer_id: "guest"
      charge_code: "refund_card"
      amount: "amount refunded"
      business_date: "date of the refund"
      posted_date: "date posted"
      posting_sequence: "0 when posted by guest services"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: in
    triggers: []

  - type: folio_settle
    target: folio_accounts
    mutation: {transition: {from: open, to: settled}}
    meaning: "At check-out the folio balance is paid and the folio is settled."
    grain: "One row per transaction."
    fields:
      folio_id: "folio settled"
      settled_date: "check-out date"
      check_out_time: "clock time of check-out"
      customer_id: "guest (read, not changed)"
      reservation_id: "reservation of the stay (read, not changed)"
      loyalty_member_id: "membership credited (read, not changed)"
    triggers:
      - event: loyalty:loyalty_points_earn
        when: {loyalty_member_id: {not: ""}}
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, reservation_id: reservation_id, posted_date: settled_date, earning_source: stay_base}

  - type: folio_reopen
    target: folio_accounts
    mutation: {transition: {from: settled, to: reopened}}
    meaning: "Guest services reopens a settled folio to correct it after the stay."
    grain: "One row per transaction."
    fields:
      folio_id: "folio reopened"
    triggers: []

  - type: folio_resettle
    target: folio_accounts
    mutation: {transition: {from: reopened, to: settled}}
    meaning: "Guest services settles a corrected folio again once its balance is zero."
    grain: "One row per transaction."
    fields:
      folio_id: "folio settled again"
      settled_date: "date of the new settlement"
    triggers: []

measures:
  - id: folio_msr_desk_adjustments
    window: "The whole life of one folio, up to the moment of handling."
    measure: "Sum of amount over the folio's folio_adjustment and folio_breakfast_benefit_credit lines whose posting_sequence is 0 (posted by guest services)."
  - id: folio_msr_folio_courtesy_removals
    window: "The whole life of one folio, up to the moment of handling."
    measure: "Count of the folio's folio_adjustment lines with charge_code minibar and adjustment_reason charge_not_incurred."
  - id: folio_msr_guest_courtesy_removals_365
    window: "The 365 calendar days ending on the handling date, inclusive, by posted_date."
    measure: "Count of folio_adjustment lines with charge_code minibar and adjustment_reason charge_not_incurred on all folios of the same customer_id."

policies:
  - id: folio_agg_multi_holding
    subject: [folio_open]
    rule: >-
      A guest may hold any number of folios, one for each stay. Exactly one folio is opened per
      reservation, at its check-in; a reservation never has two folios. Each folio is billed,
      corrected, settled and refunded on its own, and a credit due on one folio is never used to pay
      another. A folio is opened only for a reservation that does not already have one.
    eligibility:
      - id: one_folio_per_reservation
        applies_to: [folio_open]
        kind: dedup
        condition: "A folio is opened only for a reservation that does not already have one."
        evidence_fields: [folio_accounts.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.reservation_id]
          action_bindings:
            folio_accounts.reservation_id: reservation_id
        dedup_contract:
          table: folio_accounts
          mode: separate_record
          object_bindings: {reservation_id: reservation_id}
          duplicate_filters: {status: [open, settled, reopened]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: folio_agg_courtesy_allowance
    subject: [folio_adjustment]
    rule: >-
      Courtesy removals are combined across all of a guest's folios. A courtesy removal is a minibar
      line taken off with adjustment_reason charge_not_incurred on the guest's own statement that the
      item was not consumed, with no record contradicting it. Guest services makes a courtesy removal
      only while the folio's courtesy removals stay within minibar_courtesy_removals_per_folio and the
      guest's courtesy removals across all folios in the last 365 days stay below
      courtesy_removals_per_guest_365_days. The per-folio count is folio_msr_folio_courtesy_removals
      and the guest-wide count is folio_msr_guest_courtesy_removals_365, both counted before the
      removal being considered. A minibar dispute beyond either allowance is not removed by guest
      services and is referred to the hotel as a billing dispute. Brands whose
      minibar_courtesy_removals_per_folio is 0 grant no courtesy removals.
    eligibility:
      - id: courtesy_within_allowance
        applies_to: [folio_adjustment]
        kind: authorization
        condition: "Guest services makes a courtesy removal only while the folio's courtesy removals stay within minibar_courtesy_removals_per_folio and the guest's courtesy removals across all folios in the last 365 days stay below courtesy_removals_per_guest_365_days."
        evidence_fields: [folio_postings.folio_id, folio_postings.customer_id, folio_postings.charge_code, folio_postings.adjustment_reason, folio_postings.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_postings.folio_id, folio_postings.customer_id]
          action_bindings:
            folio_postings.folio_id: folio_id
            folio_postings.customer_id: customer_id
    params:
      courtesy_removals_per_guest_365_days: 2
    measures: [folio_msr_folio_courtesy_removals, folio_msr_guest_courtesy_removals_365]
    formula:
      courtesy_allowed: "folio_msr_folio_courtesy_removals < minibar_courtesy_removals_per_folio and folio_msr_guest_courtesy_removals_365 < courtesy_removals_per_guest_365_days"

  - id: folio_room_and_tax
    subject: [folio_room_charge]
    rule: >-
      For every night actually stayed the night audit posts one room line equal to the reservation's
      nightly rate and one room_tax line equal to that rate times the reservation's tax_rate_pct,
      rounded to the cent, both with the stay night as business date. Nights paid with points or Free
      Night Awards carry a nightly rate of 0.00 and post no room or room tax lines. Room lines are
      posted only to a folio whose status is open. A night has at most one room line and one room tax
      line; a second line with the same charge code and business date is a duplicate posting. Nights
      after the actual check-out date are never posted.
    eligibility:
      - id: folio_open_state
        applies_to: [folio_room_charge]
        kind: state
        condition: "Room lines are posted only to a folio whose status is open."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open]

  - id: folio_resort_fee_charges
    subject: [folio_resort_fee]
    rule: >-
      At brands whose resort_fee_per_night_usd is above zero, the night audit posts the resort fee for
      every night actually stayed and, when resort_fee_taxable is true, a resort_fee_tax line at the
      reservation's tax_rate_pct rounded to the cent. When resort_fee_waived_on_reward_nights is true
      no resort fee is posted for nights paid with points or Free Night Awards, which on the folio are
      the nights of a Reward Night Rate reservation. When resort_fee_on_nights_stayed_only is true no
      fee is posted for nights after the actual check-out date. The fee covers the inclusions of the
      brand, among them self-parking where self_parking_included_in_resort_fee is true, and is not
      reduced because the guest did not use an inclusion. Resort fees are posted only to a folio whose
      status is open.
    eligibility:
      - id: folio_open_state
        applies_to: [folio_resort_fee]
        kind: state
        condition: "Resort fees are posted only to a folio whose status is open."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open]
    params:
      per_tier:
        "Ashbury Express": {fee: "=resort_fee_per_night_usd", taxable: "=resort_fee_taxable"}
        "Ashbury Inn & Suites": {fee: "=resort_fee_per_night_usd", taxable: "=resort_fee_taxable"}
        "Ashbury Hotel": {fee: "=resort_fee_per_night_usd", taxable: "=resort_fee_taxable"}
        "Ashbury Grand": {fee: "=resort_fee_per_night_usd", taxable: "=resort_fee_taxable"}
        "Ashbury Resort & Spa": {fee: "=resort_fee_per_night_usd", taxable: "=resort_fee_taxable"}
        "Ashbury Reserve": {fee: "=resort_fee_per_night_usd", taxable: "=resort_fee_taxable"}

  - id: folio_incidental_rules
    subject: [folio_incidental_charge]
    rule: >-
      Incidentals are posted by the hotel's outlets and departments at the brand's prices. Parking is
      charged per night a vehicle is parked at self_parking_per_night_usd or, where valet_available is
      true, valet_parking_per_night_usd; self-parking is never charged separately where
      self_parking_included_in_resort_fee is true. A pet fee is charged once per stay,
      pet_fee_per_stay_usd for stays shorter than pet_extended_stay_threshold_nights nights and
      pet_fee_extended_stay_usd from that length, and only where pets_allowed is true; it is not
      refunded when pet_fee_refundable is false. Service animals are never charged a pet fee when
      service_animals_exempt is true, and the guest is not asked to prove the animal's status. A
      smoking cleaning fee of smoking_cleaning_fee_usd is charged at most smoking_fee_max_per_stay
      times per stay and only on a housekeeping report with photographs or a detector log held by the
      hotel. Minibar lines are posted only where minibar_available is true. Breakfast is never charged
      where complimentary_breakfast_all_guests is true or on Bed & Breakfast Package Rate stays. A
      charge incurred during the stay may be posted after check-out only no later than
      late_charge_posting_window_days calendar days after the guest checked out. Days are counted as
      whole calendar days from the actual check-out date, which is day zero; a late charge posted on
      the last day of the window is valid. Incidentals are posted only to a folio whose status is open
      or settled.
    eligibility:
      - id: late_charge_window
        applies_to: [folio_incidental_charge]
        kind: time
        condition: "A charge incurred during the stay may be posted after check-out only no later than late_charge_posting_window_days calendar days after the guest checked out."
        evidence_fields: [booking_reservations.actual_check_out_date, folio_accounts.reservation_id, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the guest checked out"
          anchor_source: booking_reservations.actual_check_out_date
          relation: not_after
          duration_source: variants.late_charge_posting_window_days
          unit: calendar_days
          counting_rule: "Days are counted as whole calendar days from the actual check-out date, which is day zero; a late charge posted on the last day of the window is valid."
          boundary: inclusive
      - id: folio_postable_state
        applies_to: [folio_incidental_charge]
        kind: state
        condition: "Incidentals are posted only to a folio whose status is open or settled."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open, settled]

  - id: folio_late_checkout
    subject: [folio_late_checkout_fee]
    rule: >-
      A late check-out fee applies only when the folio's check_out_time is later than
      standard_check_out_time plus late_checkout_grace_minutes. Up to and including
      late_checkout_half_day_until the fee is late_checkout_flat_fee_usd where late_checkout_fee_basis
      is flat_fee, or late_checkout_half_day_pct percent of the reservation's nightly rate where it is
      pct_of_nightly_rate; a check-out later than late_checkout_half_day_until is charged one full
      night at the nightly rate. Room tax at the reservation's tax_rate_pct is added when
      late_checkout_fee_taxable is true, and the result is rounded to the cent. Elite exemption: at
      brands whose elite_late_checkout_guaranteed is true, no fee is charged on a stay credited to an
      Ashbury Rewards member whose tier guarantees late check-out, provided the check_out_time is not
      later than the late check-out time that tier guarantees; a later departure is charged as if no
      exemption existed. At brands whose elite_late_checkout_guaranteed is false the fee applies to
      every guest. Reservations booked through an online travel agency receive no elite exemption. The
      fee is posted only to a folio whose status is open, at most once per stay.
    eligibility:
      - id: folio_open_state
        applies_to: [folio_late_checkout_fee]
        kind: state
        condition: "The fee is posted only to a folio whose status is open, at most once per stay."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open]
    params:
      per_tier:
        "Ashbury Express": {basis: "=late_checkout_fee_basis", flat: "=late_checkout_flat_fee_usd", pct: "=late_checkout_half_day_pct", until: "=late_checkout_half_day_until", elite_honoured: "=elite_late_checkout_guaranteed"}
        "Ashbury Inn & Suites": {basis: "=late_checkout_fee_basis", flat: "=late_checkout_flat_fee_usd", pct: "=late_checkout_half_day_pct", until: "=late_checkout_half_day_until", elite_honoured: "=elite_late_checkout_guaranteed"}
        "Ashbury Hotel": {basis: "=late_checkout_fee_basis", flat: "=late_checkout_flat_fee_usd", pct: "=late_checkout_half_day_pct", until: "=late_checkout_half_day_until", elite_honoured: "=elite_late_checkout_guaranteed"}
        "Ashbury Grand": {basis: "=late_checkout_fee_basis", flat: "=late_checkout_flat_fee_usd", pct: "=late_checkout_half_day_pct", until: "=late_checkout_half_day_until", elite_honoured: "=elite_late_checkout_guaranteed"}
        "Ashbury Resort & Spa": {basis: "=late_checkout_fee_basis", flat: "=late_checkout_flat_fee_usd", pct: "=late_checkout_half_day_pct", until: "=late_checkout_half_day_until", elite_honoured: "=elite_late_checkout_guaranteed"}
        "Ashbury Reserve": {basis: "=late_checkout_fee_basis", flat: "=late_checkout_flat_fee_usd", pct: "=late_checkout_half_day_pct", until: "=late_checkout_half_day_until", elite_honoured: "=elite_late_checkout_guaranteed"}

  - id: folio_early_departure
    subject: [folio_early_departure_fee]
    rule: >-
      An early departure fee applies only when the actual check-out date is earlier than the departure
      date on the reservation at the moment of check-out; a guest who tells the front desk of an
      earlier departure has the reservation's departure date changed and is not an early departure.
      The fee follows early_departure_fee_basis: none charges nothing, flat_fee charges
      early_departure_flat_fee_usd, and one_night_room_and_tax charges one night at the reservation's
      nightly rate plus tax at its tax_rate_pct, rounded to the cent. Reservations on a rate plan
      listed in early_departure_exempt_rate_plans are never charged. Nights not stayed after an early
      departure carry no room, tax or resort fee. The fee is posted only to a folio whose status is
      open.
    eligibility:
      - id: folio_open_state
        applies_to: [folio_early_departure_fee]
        kind: state
        condition: "The fee is posted only to a folio whose status is open."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open]

  - id: folio_payment_and_settlement
    subject: [folio_payment, folio_settle]
    rule: >-
      Money held for the reservation is applied to the folio at check-in as a payment_deposit_transfer
      line. At check-out, when auto_settle_to_card_at_checkout is true, the remaining balance is
      charged to the card on file as a payment_card line and the folio is settled with the check-out
      date and time. A folio is settled only when its balance_due is zero. A late charge posted to a
      settled folio is paid by a further payment_card line on the card on file on the day it is posted.
      Payments are applied only to a folio whose status is open or settled. When the stay is credited
      to an Ashbury Rewards membership, settlement posts the stay's points under the Ashbury Rewards
      earning rules.
    eligibility:
      - id: balance_zero
        applies_to: [folio_settle]
        kind: authorization
        condition: "A folio is settled only when its balance_due is zero."
        evidence_fields: [folio_accounts.balance_due, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
      - id: payable_state
        applies_to: [folio_payment]
        kind: state
        condition: "Payments are applied only to a folio whose status is open or settled."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open, settled]

  - id: folio_breakfast_benefit
    subject: [folio_breakfast_benefit_credit]
    rule: >-
      At brands where complimentary_breakfast_all_guests is false, a stay credited to an Ashbury
      Rewards member whose tier is elite_breakfast_min_tier or higher receives, for each breakfast line
      charged at the outlet during the stay, a credit of the lower of that line's amount and
      elite_breakfast_credit_per_person_usd times elite_breakfast_persons. The credit names the
      breakfast line it offsets, at most one credit per breakfast line, and unused credit is not paid
      out or carried to other charges when breakfast_credit_unused_refundable is false. The member's
      tier is the variant_name on the membership, and it applies to a breakfast only when the
      membership's tier_effective_date is on or before that breakfast's business date. When the tier
      took effect after the breakfast, guest services cannot establish the tier held that morning and
      refers the question to the hotel as a billing dispute. No credit is given on Bed & Breakfast
      Package Rate stays, where breakfast is part of the rate, or on reservations booked through an
      online travel agency. When the outlet did not apply the credit, guest services posts it later
      with adjustment_reason elite_benefit_not_applied, subject to the brand's
      desk_adjustment_limit_usd. Credits are posted only to a folio whose status is open or reopened.
    eligibility:
      - id: credit_state
        applies_to: [folio_breakfast_benefit_credit]
        kind: state
        condition: "Credits are posted only to a folio whose status is open or reopened."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open, reopened]
      - id: tier_held_on_date
        applies_to: [folio_breakfast_benefit_credit]
        kind: authorization
        condition: "The member's tier is the variant_name on the membership, and it applies to a breakfast only when the membership's tier_effective_date is on or before that breakfast's business date."
        evidence_fields: [loyalty_memberships.variant_name, loyalty_memberships.tier_effective_date, folio_accounts.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.loyalty_member_id]
          action_bindings:
            folio_accounts.loyalty_member_id: loyalty_member_id
      - id: one_credit_per_breakfast
        applies_to: [folio_breakfast_benefit_credit]
        kind: dedup
        condition: "The credit names the breakfast line it offsets, at most one credit per breakfast line, and unused credit is not paid out or carried to other charges when breakfast_credit_unused_refundable is false."
        evidence_fields: [folio_postings.related_posting_id, folio_postings.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_postings.related_posting_id]
          action_bindings:
            folio_postings.related_posting_id: related_posting_id
        dedup_contract:
          table: folio_postings
          mode: separate_record
          object_bindings: {related_posting_id: related_posting_id}
          duplicate_filters: {event_type: [folio_breakfast_benefit_credit]}
          distinct_fields: []
    params:
      per_tier:
        "Ashbury Express": {min_tier: "=elite_breakfast_min_tier", per_person: "=elite_breakfast_credit_per_person_usd", persons: "=elite_breakfast_persons"}
        "Ashbury Inn & Suites": {min_tier: "=elite_breakfast_min_tier", per_person: "=elite_breakfast_credit_per_person_usd", persons: "=elite_breakfast_persons"}
        "Ashbury Hotel": {min_tier: "=elite_breakfast_min_tier", per_person: "=elite_breakfast_credit_per_person_usd", persons: "=elite_breakfast_persons"}
        "Ashbury Grand": {min_tier: "=elite_breakfast_min_tier", per_person: "=elite_breakfast_credit_per_person_usd", persons: "=elite_breakfast_persons"}
        "Ashbury Resort & Spa": {min_tier: "=elite_breakfast_min_tier", per_person: "=elite_breakfast_credit_per_person_usd", persons: "=elite_breakfast_persons"}
        "Ashbury Reserve": {min_tier: "=elite_breakfast_min_tier", per_person: "=elite_breakfast_credit_per_person_usd", persons: "=elite_breakfast_persons"}
    formula:
      credit_cap: "elite_breakfast_credit_per_person_usd * elite_breakfast_persons"
      amount: "min(amount, elite_breakfast_credit_per_person_usd * elite_breakfast_persons)"

  - id: folio_evt_adjustment
    subject: [folio_adjustment]
    rule: >-
      An adjustment corrects exactly one original folio line, names it in related_posting_id and
      carries its charge code; when both a charge and its tax line are wrong, each is adjusted by its
      own adjustment. Corrections are made only on a folio whose status is open or reopened; a settled
      folio is first reopened. A correction to a folio whose guest has checked out is made only if it
      is requested no later than dispute_window_days_after_checkout calendar days after the guest
      checked out. Days are counted as whole calendar days from the actual check-out date, which is day
      zero; a request on the last day of the window is accepted. The amount depends on the reason.
      duplicate_posting: a room, room_tax, resort_fee or resort_fee_tax line that repeats the charge
      code and business date of an earlier line on the same folio, or an incidental line that repeats
      the charge code, amount and business date of the line with the immediately preceding
      posting_sequence, is removed in full. incorrect_rate: a room line that differs from the
      reservation's nightly rate is adjusted by the difference, and its room_tax line by the
      difference times the reservation's tax_rate_pct, rounded to the cent. charge_not_incurred: a
      self-parking line at a brand whose self_parking_included_in_resort_fee is true, a pet fee for an
      animal the guest states is a service animal where service_animals_exempt is true, a breakfast
      line on a stay where breakfast is complimentary or part of the rate, and a courtesy minibar
      removal under folio_agg_courtesy_allowance are removed in full. late_charge_outside_window: an
      incidental line posted later than late_charge_posting_window_days after the actual check-out
      date is removed in full. resort_fee_not_applicable: a resort fee or resort fee tax line on a
      night of a Reward Night Rate reservation or on a night after the actual check-out date is
      removed in full. elite_benefit_not_applied: a late check-out fee that folio_late_checkout
      exempts is removed in full. early_departure_fee_not_applicable: an early departure fee that
      folio_early_departure does not support is removed in full. Each original line is adjusted at
      most once. Guest services posts an adjustment only if the total it has posted on the folio,
      including this adjustment, does not exceed desk_adjustment_limit_usd, counted with
      folio_msr_desk_adjustments; a correction that would exceed it, a smoking cleaning fee dispute,
      and any dispute about damage or about whether an incidental was incurred other than a courtesy
      minibar removal are registered as a billing dispute referred to the hotel, and guest services
      posts nothing for that line. A dispute about the room rate the guest agreed to at booking, or a
      request for a goodwill reduction without one of these reasons, is outside these rules.
    eligibility:
      - id: correctable_state
        applies_to: [folio_adjustment]
        kind: state
        condition: "Corrections are made only on a folio whose status is open or reopened; a settled folio is first reopened."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open, reopened]
      - id: dispute_window
        applies_to: [folio_adjustment]
        kind: time
        condition: "A correction to a folio whose guest has checked out is made only if it is requested no later than dispute_window_days_after_checkout calendar days after the guest checked out."
        evidence_fields: [booking_reservations.actual_check_out_date, folio_accounts.reservation_id, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the guest checked out"
          anchor_source: booking_reservations.actual_check_out_date
          relation: not_after
          duration_source: variants.dispute_window_days_after_checkout
          unit: calendar_days
          counting_rule: "Days are counted as whole calendar days from the actual check-out date, which is day zero; a request on the last day of the window is accepted."
          boundary: inclusive
      - id: one_adjustment_per_line
        applies_to: [folio_adjustment]
        kind: dedup
        condition: "Each original line is adjusted at most once."
        evidence_fields: [folio_postings.related_posting_id, folio_postings.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_postings.related_posting_id]
          action_bindings:
            folio_postings.related_posting_id: related_posting_id
        dedup_contract:
          table: folio_postings
          mode: separate_record
          object_bindings: {related_posting_id: related_posting_id}
          duplicate_filters: {event_type: [folio_adjustment]}
          distinct_fields: []
      - id: desk_limit
        applies_to: [folio_adjustment]
        kind: authorization
        condition: "Guest services posts an adjustment only if the total it has posted on the folio, including this adjustment, does not exceed desk_adjustment_limit_usd, counted with folio_msr_desk_adjustments; a correction that would exceed it, a smoking cleaning fee dispute, and any dispute about damage or about whether an incidental was incurred other than a courtesy minibar removal are registered as a billing dispute referred to the hotel, and guest services posts nothing for that line."
        evidence_fields: [folio_postings.folio_id, folio_postings.amount, folio_postings.posting_sequence, folio_postings.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_postings.folio_id]
          action_bindings:
            folio_postings.folio_id: folio_id
    params:
      per_tier:
        "Ashbury Express": {desk_limit: "=desk_adjustment_limit_usd", window_days: "=dispute_window_days_after_checkout"}
        "Ashbury Inn & Suites": {desk_limit: "=desk_adjustment_limit_usd", window_days: "=dispute_window_days_after_checkout"}
        "Ashbury Hotel": {desk_limit: "=desk_adjustment_limit_usd", window_days: "=dispute_window_days_after_checkout"}
        "Ashbury Grand": {desk_limit: "=desk_adjustment_limit_usd", window_days: "=dispute_window_days_after_checkout"}
        "Ashbury Resort & Spa": {desk_limit: "=desk_adjustment_limit_usd", window_days: "=dispute_window_days_after_checkout"}
        "Ashbury Reserve": {desk_limit: "=desk_adjustment_limit_usd", window_days: "=dispute_window_days_after_checkout"}
    measures: [folio_msr_desk_adjustments]
    formula:
      within_desk_limit: "folio_msr_desk_adjustments + amount <= desk_adjustment_limit_usd"

  - id: folio_post_stay_correction
    subject: [folio_reopen, folio_resettle, folio_refund]
    rule: >-
      A settled folio is reopened by guest services only to post a correction allowed under
      folio_evt_adjustment or a credit allowed under folio_breakfast_benefit, and only where
      folio_reopen_allowed is true. A folio is reopened only if the request is made no later than
      dispute_window_days_after_checkout calendar days after the guest checked out. Days are counted as
      whole calendar days from the actual check-out date, which is day zero; a request on the last day
      of the window is accepted. When the corrections leave a credit balance, the credit is refunded in
      full to the card the folio was settled to when refund_to_original_payment is true; it is never
      paid in cash, moved to another folio or converted to points. A refund is posted only on a folio
      whose status is reopened, and its amount equals the credit balance. Once the balance is zero the
      folio is settled again with the date of the new settlement. A folio that needs no correction is
      not reopened.
    eligibility:
      - id: reopen_window
        applies_to: [folio_reopen]
        kind: time
        condition: "A folio is reopened only if the request is made no later than dispute_window_days_after_checkout calendar days after the guest checked out."
        evidence_fields: [booking_reservations.actual_check_out_date, folio_accounts.reservation_id, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the guest checked out"
          anchor_source: booking_reservations.actual_check_out_date
          relation: not_after
          duration_source: variants.dispute_window_days_after_checkout
          unit: calendar_days
          counting_rule: "Days are counted as whole calendar days from the actual check-out date, which is day zero; a request on the last day of the window is accepted."
          boundary: inclusive
      - id: refund_state
        applies_to: [folio_refund]
        kind: state
        condition: "A refund is posted only on a folio whose status is reopened, and its amount equals the credit balance."
        evidence_fields: [folio_accounts.status, folio_accounts.balance_due, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [reopened]
      - id: resettle_balance_zero
        applies_to: [folio_resettle]
        kind: authorization
        condition: "Once the balance is zero the folio is settled again with the date of the new settlement."
        evidence_fields: [folio_accounts.balance_due, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
    formula:
      refund_amount: "abs(balance_due) if balance_due < 0 else 0"
