  - id: loyalty_promotion_and_card_points
    subject: [loyalty_points_bonus]
    rule: >-
      Promotion bonuses are posted by Ashbury Rewards to members who registered for the promotion
      before the qualifying stay, carrying the promotion_code; co-brand card points are posted by the
      card issuer with each statement as earning_source cobrand_spend and count as qualifying activity
      when activity_includes_cobrand_spend is true. Guest services posts neither: a member who reports
      a missing promotion bonus or missing card points is outside the rules guest services can apply,
      because neither the promotion registrations nor the card statements are held in the member's
      records. A bonus row carries the promotion_code it was earned under, and a promotion bonus is
      posted at most once per promotion code and stay.
    eligibility:
      - id: once_per_promotion_and_stay
        applies_to: [loyalty_points_bonus]
        kind: dedup
        condition: "A bonus row carries the promotion_code it was earned under, and a promotion bonus is posted at most once per promotion code and stay."
        evidence_fields: [loyalty_transactions.reservation_id, loyalty_transactions.promotion_code, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.reservation_id, loyalty_transactions.promotion_code]
          action_bindings:
            loyalty_transactions.reservation_id: reservation_id
            loyalty_transactions.promotion_code: promotion_code
        dedup_contract:
          table: loyalty_transactions
          mode: separate_record
          object_bindings: {reservation_id: reservation_id, promotion_code: promotion_code}
          duplicate_filters: {event_type: [loyalty_points_bonus]}
          distinct_fields: []

  - id: loyalty_purchase_rules
    subject: [loyalty_points_purchase]
    rule: >-
      A member may buy points for their own account, paying with their own card; buying is the
      member's own decision and payment. Points are bought in multiples of points_purchase_increment
      at points_purchase_price_per_1000_usd for each 1,000 points, before any sales tax. Points may be
      bought only once the account has been open for points_purchase_min_account_age_days. The age of
      the account is counted in whole calendar days from the enrolment date, which is day zero; a
      purchase on the day the minimum is reached is allowed. The points bought in one calendar year,
      counted with loyalty_msr_purchased_ytd and including the purchase being made, may not exceed
      points_purchase_annual_cap; a request beyond the cap is reduced to the remaining allowance or
      declined, never split across another member's account. A member makes at most one purchase per
      calendar day. Purchased points are not refundable when points_purchase_refundable is false.
      Points are bought only for a membership whose status is active.
    eligibility:
      - id: account_age
        applies_to: [loyalty_points_purchase]
        kind: time
        condition: "Points may be bought only once the account has been open for points_purchase_min_account_age_days."
        evidence_fields: [loyalty_memberships.enrolled_date, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account has been open"
          anchor_source: loyalty_memberships.enrolled_date
          relation: not_before
          duration_source: variants.points_purchase_min_account_age_days
          unit: calendar_days
          counting_rule: "The age of the account is counted in whole calendar days from the enrolment date, which is day zero; a purchase on the day the minimum is reached is allowed."
          boundary: inclusive
      - id: annual_cap
        applies_to: [loyalty_points_purchase]
        kind: authorization
        condition: "The points bought in one calendar year, counted with loyalty_msr_purchased_ytd and including the purchase being made, may not exceed points_purchase_annual_cap; a request beyond the cap is reduced to the remaining allowance or declined, never split across another member's account."
        evidence_fields: [loyalty_transactions.loyalty_member_id, loyalty_transactions.points, loyalty_transactions.posted_date, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.loyalty_member_id]
          action_bindings:
            loyalty_transactions.loyalty_member_id: loyalty_member_id
      - id: one_purchase_per_day
        applies_to: [loyalty_points_purchase]
        kind: dedup
        condition: "A member makes at most one purchase per calendar day."
        evidence_fields: [loyalty_transactions.loyalty_member_id, loyalty_transactions.posted_date, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.loyalty_member_id, loyalty_transactions.posted_date]
          action_bindings:
            loyalty_transactions.loyalty_member_id: loyalty_member_id
            loyalty_transactions.posted_date: posted_date
        dedup_contract:
          table: loyalty_transactions
          mode: separate_record
          object_bindings: {loyalty_member_id: loyalty_member_id, posted_date: posted_date}
          duplicate_filters: {event_type: [loyalty_points_purchase]}
          distinct_fields: []
      - id: member_active
        applies_to: [loyalty_points_purchase]
        kind: state
        condition: "Points are bought only for a membership whose status is active."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    measures: [loyalty_msr_purchased_ytd]
    formula:
      purchase_amount_usd: "round(points / 1000 * points_purchase_price_per_1000_usd, 2)"
      within_cap: "loyalty_msr_purchased_ytd + points <= points_purchase_annual_cap"

  - id: loyalty_transfer_rules
    subject: [loyalty_points_transfer_out, loyalty_points_transfer_in]
    rule: >-
      A member may give points from their own account to another Ashbury Rewards member; giving away
      points is the sender's own decision. Points are transferred in multiples of
      points_transfer_increment, without a fee, and a completed transfer is irrevocable when
      points_transfer_irrevocable is true. Both accounts must be active, and the sender must hold at
      least the points transferred. Both accounts must have been open for
      points_transfer_min_account_age_days before a transfer. The age of each account is counted in
      whole calendar days from its enrolment date, which is day zero; a transfer on the day both
      accounts reach the minimum is allowed. The sender's transfers in the calendar year, counted with
      loyalty_msr_transferred_out_ytd and including this transfer, may not exceed
      points_transfer_out_annual_cap of the sender's tier, and the recipient's receipts, counted with
      loyalty_msr_received_ytd and including this transfer, may not exceed
      points_transfer_in_annual_cap of the recipient's tier. A sender makes at most one transfer to
      the same recipient on one calendar day. The recipient's arrival transaction mirrors the
      sender's transfer and names it.
    eligibility:
      - id: both_active
        applies_to: [loyalty_points_transfer_out]
        kind: state
        condition: "Both accounts must be active, and the sender must hold at least the points transferred."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.points_balance, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
      - id: account_age
        applies_to: [loyalty_points_transfer_out]
        kind: time
        condition: "Both accounts must have been open for points_transfer_min_account_age_days before a transfer."
        evidence_fields: [loyalty_memberships.enrolled_date, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "Both accounts must have been open"
          anchor_source: loyalty_memberships.enrolled_date
          relation: not_before
          duration_source: variants.points_transfer_min_account_age_days
          unit: calendar_days
          counting_rule: "The age of each account is counted in whole calendar days from its enrolment date, which is day zero; a transfer on the day both accounts reach the minimum is allowed."
          boundary: inclusive
      - id: annual_caps
        applies_to: [loyalty_points_transfer_out]
        kind: authorization
        condition: "The sender's transfers in the calendar year, counted with loyalty_msr_transferred_out_ytd and including this transfer, may not exceed points_transfer_out_annual_cap of the sender's tier, and the recipient's receipts, counted with loyalty_msr_received_ytd and including this transfer, may not exceed points_transfer_in_annual_cap of the recipient's tier."
        evidence_fields: [loyalty_transactions.loyalty_member_id, loyalty_transactions.points, loyalty_transactions.posted_date, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.loyalty_member_id]
          action_bindings:
            loyalty_transactions.loyalty_member_id: loyalty_member_id
      - id: one_transfer_per_recipient_day
        applies_to: [loyalty_points_transfer_out]
        kind: dedup
        condition: "A sender makes at most one transfer to the same recipient on one calendar day."
        evidence_fields: [loyalty_transactions.loyalty_member_id, loyalty_transactions.counterparty_member_id, loyalty_transactions.posted_date, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.loyalty_member_id, loyalty_transactions.counterparty_member_id]
          action_bindings:
            loyalty_transactions.loyalty_member_id: loyalty_member_id
            loyalty_transactions.counterparty_member_id: counterparty_member_id
        dedup_contract:
          table: loyalty_transactions
          mode: separate_record
          object_bindings: {loyalty_member_id: loyalty_member_id, counterparty_member_id: counterparty_member_id}
          duplicate_filters: {event_type: [loyalty_points_transfer_out]}
          distinct_fields: [posted_date]
    measures: [loyalty_msr_transferred_out_ytd, loyalty_msr_received_ytd]
    formula:
      sender_within_cap: "loyalty_msr_transferred_out_ytd + points <= points_transfer_out_annual_cap"
      recipient_within_cap: "loyalty_msr_received_ytd + points <= points_transfer_in_annual_cap"

  - id: loyalty_award_redemption
    subject: [loyalty_points_redeem, loyalty_points_redeposit]
    rule: >-
      A Reward Night Rate night paid with points costs the standard-room price of award_chart for the
      hotel's award_category and the award_season recorded on the reservation. Free Night Awards are
      applied to the earliest nights of a reservation and points pay the remaining nights, which are
      always consecutive. When the member's tier has fifth_night_free_on_points true, every fifth
      points-paid night of the reservation is free, so a reservation with P points nights is charged
      for P less the whole number of times 5 goes into P. Points are deducted at booking as one
      award_redemption transaction for the reservation. Points are redeemed only from a membership
      whose status is active and whose points_balance covers the redemption; a suspended account can
      neither redeem nor receive redeposits until reinstated. A Free Night Award top-off is deducted
      as a separate certificate_top_off transaction naming the award, for the amount the Free Night
      Awards charter sets. Points come back as a redeposit naming the redemption they return: in full
      on a cancellation recorded before_deadline, on a relocation, and when a change removes points
      nights; on a cancellation recorded after_deadline or a no-show under the first_night_points
      basis, everything except the price of the first night is returned when the first night was paid
      with points, and everything is returned when the first night was paid with a Free Night Award.
      When a change adds points nights or moves to a dearer season or category, the difference is
      redeemed as a further award_redemption on the day of the change. Top-off points come back as a
      top_off_redeposit when the award they topped off is released. The points returned against a
      redemption never exceed the points it deducted.
    eligibility:
      - id: member_active
        applies_to: [loyalty_points_redeem]
        kind: state
        condition: "Points are redeemed only from a membership whose status is active and whose points_balance covers the redemption; a suspended account can neither redeem nor receive redeposits until reinstated."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.points_balance, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
      - id: redeposit_bounded
        applies_to: [loyalty_points_redeposit]
        kind: authorization
        condition: "The points returned against a redemption never exceed the points it deducted."
        evidence_fields: [loyalty_transactions.transaction_id, loyalty_transactions.points, loyalty_transactions.related_transaction_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.transaction_id]
          action_bindings:
            loyalty_transactions.transaction_id: related_transaction_id
    params:
      award_chart:
        1: {off_peak: 5000, standard: 7500, peak: 10000}
        2: {off_peak: 10000, standard: 12500, peak: 15000}
        3: {off_peak: 15000, standard: 17500, peak: 20000}
        4: {off_peak: 20000, standard: 25000, peak: 30000}
        5: {off_peak: 30000, standard: 35000, peak: 40000}
        6: {off_peak: 40000, standard: 45000, peak: 50000}
        7: {off_peak: 50000, standard: 60000, peak: 70000}
        8: {off_peak: 70000, standard: 85000, peak: 100000}
      per_tier:
        "Ashbury Rewards Member": {fifth_night_free: "=fifth_night_free_on_points"}
        "Ashbury Rewards Silver Elite": {fifth_night_free: "=fifth_night_free_on_points"}
        "Ashbury Rewards Gold Elite": {fifth_night_free: "=fifth_night_free_on_points"}
        "Ashbury Rewards Platinum Elite": {fifth_night_free: "=fifth_night_free_on_points"}
        "Ashbury Rewards Titanium Elite": {fifth_night_free: "=fifth_night_free_on_points"}
        "Ashbury Rewards Ambassador Elite": {fifth_night_free: "=fifth_night_free_on_points"}

  - id: loyalty_points_expiry
    subject: [loyalty_points_expire]
    rule: >-
      Points stay valid while the account shows qualifying activity: earning, a bonus, a purchase, a
      transfer given or received, or a redemption, read with loyalty_msr_last_activity_date; when
      expiry_reset_by_any_activity is true any one of them restarts the period for the whole balance.
      The balance expires only when points_expire_months_inactive calendar months have passed since the
      last qualifying activity. The months are counted from the posted date of the last qualifying
      activity; the balance expires on the same day number that many months later, or on the last day
      of that month when it has no such day, and points are still valid on the day before. Members whose
      tier has points_expiry_exempt true never lose points to inactivity. The whole balance is removed
      in one inactivity_expiry transaction; expired points are not reinstated. When the account is
      closed the whole balance is removed as closure_forfeit when closure_forfeits_points is true.
    eligibility:
      - id: inactivity_period
        applies_to: [loyalty_points_expire]
        kind: time
        condition: "The balance expires only when points_expire_months_inactive calendar months have passed since the last qualifying activity."
        evidence_fields: [loyalty_transactions.posted_date, loyalty_transactions.event_type, loyalty_transactions.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.loyalty_member_id]
          action_bindings:
            loyalty_transactions.loyalty_member_id: loyalty_member_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the last qualifying activity"
          anchor_source: loyalty_transactions.posted_date
          relation: not_before
          duration_source: variants.points_expire_months_inactive
          unit: calendar_months
          counting_rule: "The months are counted from the posted date of the last qualifying activity; the balance expires on the same day number that many months later, or on the last day of that month when it has no such day, and points are still valid on the day before."
          boundary: inclusive
    measures: [loyalty_msr_last_activity_date]

  - id: loyalty_stay_credit_reversal
    subject: [loyalty_points_reversal]
    rule: >-
      When a folio correction removes eligible spend from a stay that was already credited, the
      points earned on the removed spend are taken back. The points reversed are the base points and
      elite bonus posted for the stay less the base points and elite bonus that loyalty_stay_earning
      gives on the corrected eligible spend, with the same tier and brand rate, and the reversal names
      the stay_base earning transaction it reduces and records the eligible spend removed. A reversal
      is posted only when the stay has an earning transaction. Corrections that do not touch eligible
      spend, such as resort fee, tax, parking or late check-out adjustments, reverse nothing. A
      reversal is posted even when it leaves the points balance below zero; a negative balance blocks
      redemptions and transfers until it is restored by later earning.
    eligibility:
      - id: earning_exists
        applies_to: [loyalty_points_reversal]
        kind: authorization
        condition: "A reversal is posted only when the stay has an earning transaction."
        evidence_fields: [loyalty_transactions.reservation_id, loyalty_transactions.event_type, loyalty_transactions.transaction_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.transaction_id]
          action_bindings:
            loyalty_transactions.transaction_id: related_transaction_id

  - id: loyalty_account_status
    subject: [loyalty_suspend, loyalty_reinstate, loyalty_close, loyalty_close_after_review]
    rule: >-
      Suspension, reinstatement and closure after review are decided by Ashbury Rewards account
      security; guest services neither suspends nor reinstates an account and does not discuss the
      review. While an account is suspended, points can be neither redeemed, transferred nor bought
      when suspension_freezes_points is true, and earning continues. A member may close their own
      account only by signing a closure request; closing is the member's own decision about their
      own points and awards. A closure takes effect only on an account whose status is active; a
      suspended account cannot be closed at the member's request until the review ends. On closure the
      points balance is forfeited when closure_forfeits_points is true and every unused Free Night
      Award is forfeited when closure_forfeits_free_night_awards is true; future award reservations
      already paid remain valid. A closed account is never reopened.
    eligibility:
      - id: closable_state
        applies_to: [loyalty_close]
        kind: authorization
        condition: "A closure takes effect only on an account whose status is active; a suspended account cannot be closed at the member's request until the review ends."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
