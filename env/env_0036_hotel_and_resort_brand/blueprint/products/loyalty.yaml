# Ashbury Rewards charter of Ashbury Hotels & Resorts.
# One holding = one member's Ashbury Rewards account at one elite tier.
category: loyalty
display_name: Ashbury Rewards

binding:
  holding_table: loyalty_memberships
  event_tables: [loyalty_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {points_balance: points, elite_night_credits: elite_nights}

lifecycle:
  states: [active, suspended, closed]
  transitions:
    - {from: active, to: suspended, by: system, means: "Ashbury Rewards account security suspends the account while suspected misuse is reviewed."}
    - {from: suspended, to: active, by: system, means: "The review clears the account and it is reinstated."}
    - {from: active, to: closed, by: user, means: "The member signs a request to close their own account."}
    - {from: suspended, to: closed, by: system, means: "The review confirms misuse and the account is closed."}

accounts:
  - key: points
    unit: points
    meaning: "Ashbury Rewards points the member can redeem, transfer or lose to expiry."
  - key: elite_nights
    unit: nights
    meaning: "Elite night credits accrued in the current calendar year toward elite tier qualification."

parameter_schema:
  qualifying_nights_required: "Elite night credits in one calendar year needed to reach the tier (integer nights)."
  qualifying_spend_required_usd: "Qualifying spend in the same calendar year needed in addition to the nights (USD)."
  status_valid_years_after_qualification: "Calendar years after the year of qualification at whose end of February the tier stops being guaranteed (integer years; 0 for the base tier)."
  status_valid_through_month: "Month whose last day closes the guaranteed period (integer month)."
  downgrade_floor_tier: "Lowest tier a member holding this tier falls to at the annual reassessment when they did not requalify (official tier name)."
  elite_bonus_pct: "Elite bonus as a percentage of the base points of a stay (number, %)."
  welcome_amenity_points: "Welcome points per stay at Ashbury Hotel, Ashbury Grand, Ashbury Resort & Spa and Ashbury Reserve hotels (integer points)."
  welcome_amenity_points_select_service: "Welcome points per stay at Ashbury Express and Ashbury Inn & Suites hotels (integer points)."
  welcome_amenity_on_reward_stays: "Whether welcome points are also given on Reward Night Rate stays (boolean)."
  points_expire_months_inactive: "Months without qualifying activity after which the whole points balance expires (integer months)."
  points_expiry_exempt: "Whether points of a member holding the tier never expire for inactivity (boolean)."
  late_checkout_until: "Latest check-out time the tier is entitled to (HH:MM, or none)."
  late_checkout_guaranteed: "Whether the tier's late check-out time is guaranteed rather than subject to availability (boolean)."
  fifth_night_free_on_points: "Whether every fifth consecutive points-paid night of one reservation is free (boolean)."
  relocation_compensation_points: "Points posted to the member when a hotel relocates their guaranteed reservation (integer points)."
  points_purchase_annual_cap: "Maximum points a member may buy per calendar year (integer points)."
  points_purchase_price_per_1000_usd: "Price of 1,000 purchased points before tax (USD)."
  points_purchase_increment: "Points are bought in multiples of this number (integer points)."
  points_purchase_min_account_age_days: "Minimum calendar days since enrolment before points may be bought (integer days)."
  points_purchase_refundable: "Whether purchased points can be returned for a refund (boolean)."
  points_transfer_out_annual_cap: "Maximum points a member may transfer to other members per calendar year (integer points)."
  points_transfer_in_annual_cap: "Maximum points a member may receive from other members per calendar year (integer points)."
  points_transfer_increment: "Points are transferred in multiples of this number (integer points)."
  points_transfer_min_account_age_days: "Minimum calendar days since enrolment, for sender and recipient alike, before a transfer (integer days)."
  points_transfer_irrevocable: "Whether a completed transfer can never be reversed (boolean)."
  missing_stay_claim_window_days: "Calendar days after check-out within which a missing stay can be credited (integer days)."
  retro_enrollment_credit_days: "Calendar days before the enrolment date within which a stay's check-out may fall and still be credited (integer days)."
  earns_on_incidentals: "Whether eligible incidental charges on the folio earn base points (boolean)."
  elite_bonus_on_incidentals: "Whether the elite bonus also applies to points from incidentals (boolean)."
  eligible_incidental_charge_codes: "Folio charge codes besides room that count as eligible spend (list of charge codes)."
  rooms_earning_points_per_stay: "Maximum rooms of the same member with overlapping nights at one hotel that earn points (integer rooms)."
  rooms_earning_nights_per_stay: "Maximum rooms of the same member with overlapping nights at one hotel that earn elite night credits (integer rooms)."
  points_rounding: "How fractional points are treated (enum: round_down_to_whole_point)."
  elite_bonus_basis: "What the elite bonus percentage is applied to (enum: base_points)."
  base_points_per_usd_express: "Base points per USD of eligible spend at Ashbury Express (integer)."
  base_points_per_usd_inn_suites: "Base points per USD of eligible spend at Ashbury Inn & Suites (integer)."
  base_points_per_usd_hotel: "Base points per USD of eligible spend at Ashbury Hotel (integer)."
  base_points_per_usd_grand: "Base points per USD of eligible spend at Ashbury Grand (integer)."
  base_points_per_usd_resort: "Base points per USD of eligible spend at Ashbury Resort & Spa (integer)."
  base_points_per_usd_reserve: "Base points per USD of eligible spend at Ashbury Reserve (integer)."
  closure_forfeits_points: "Whether closing the account forfeits the points balance (boolean)."
  closure_forfeits_free_night_awards: "Whether closing the account forfeits unused Free Night Awards (boolean)."
  suspension_freezes_points: "Whether points can be neither redeemed, transferred nor bought while the account is suspended (boolean)."
  activity_includes_cobrand_spend: "Whether points posted by the co-brand card issuer count as qualifying activity (boolean)."
  expiry_reset_by_any_activity: "Whether any qualifying activity restarts the inactivity period for the whole balance (boolean)."
  night_credit_year_start: "Month and day on which elite night credits restart from zero (MM-DD)."
  relocation_compensation_requires_guarantee: "Whether relocation compensation applies only to guaranteed reservations (boolean)."
  welcome_amenity_once_per_stay: "Whether welcome points are given once per stay regardless of the number of nights (boolean)."
  elite_night_credit_per_stay_night: "Elite night credits per night stayed in one room (integer)."

