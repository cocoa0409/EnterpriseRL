          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    params:
      per_tier:
        "Ashbury Rewards Member": {full_service: "=welcome_amenity_points", select_service: "=welcome_amenity_points_select_service"}
        "Ashbury Rewards Silver Elite": {full_service: "=welcome_amenity_points", select_service: "=welcome_amenity_points_select_service"}
        "Ashbury Rewards Gold Elite": {full_service: "=welcome_amenity_points", select_service: "=welcome_amenity_points_select_service"}
        "Ashbury Rewards Platinum Elite": {full_service: "=welcome_amenity_points", select_service: "=welcome_amenity_points_select_service"}
        "Ashbury Rewards Titanium Elite": {full_service: "=welcome_amenity_points", select_service: "=welcome_amenity_points_select_service"}
        "Ashbury Rewards Ambassador Elite": {full_service: "=welcome_amenity_points", select_service: "=welcome_amenity_points_select_service"}

  - id: loyalty_relocation_compensation
    subject: [loyalty_points_bonus]
    rule: >-
      When a hotel relocates a reservation credited to the membership, the member receives the
      relocation_compensation_points of their tier, posted with earning_source
      relocation_compensation and the relocated reservation's reference. Compensation is posted only
      for a reservation whose status is relocated. When relocation_compensation_requires_guarantee is
      true the reservation must have been guaranteed, which every reservation booked under an
      Ashbury rate plan is, and the rate plan's relocation_compensation_eligible must be true.
      Compensation is posted once per relocated reservation, whatever the number of nights, and is the
      member's only compensation from Ashbury Rewards for the relocation; guest services adds no other
      goodwill points.
    eligibility:
