# Meetings & Events charter of Ashbury Hotels & Resorts.
# One holding = one catering and event contract for one function at one hotel.
category: meeting
display_name: Meetings & Events

binding:
  holding_table: meeting_contracts
  event_tables: [meeting_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {deposit_held: meeting_deposit, balance_due: meeting_balance}

lifecycle:
  states: [tentative, definite, completed, cancelled, closed]
  transitions:
    - {from: tentative, to: definite, by: user, means: "The client signs the event contract."}
    - {from: tentative, to: cancelled, by: system, means: "The option date passes without a signed contract and the space is released."}
    - {from: definite, to: cancelled, by: user, means: "The client signs a written cancellation of the event contract."}
    - {from: definite, to: completed, by: system, means: "The event takes place and the banquet captain records the attendance."}
    - {from: completed, to: closed, by: agent, means: "The event bill is paid in full and the file is closed."}
    - {from: cancelled, to: closed, by: agent, means: "Any cancellation charges are settled and the file is closed."}

accounts:
  - key: meeting_deposit
    unit: USD
    meaning: "Event deposits received and held until refunded, applied to the event bill or forfeited."
  - key: meeting_balance
    unit: USD
    meaning: "Amount the client owes on the event bill."

parameter_schema:
  min_attendees: "Fewest attendees for which the package is sold (integer persons)."
  max_attendees: "Most attendees for which the package is sold (integer persons)."
  package_price_per_person_usd: "Package price per billed attendee, before service charge and tax (USD)."
  package_hours: "Hours of function space use included (integer hours)."
  coffee_breaks_included: "Coffee breaks included per attendee (integer)."
  lunch_included: "Whether a plated or buffet lunch is included (boolean)."
  dinner_included: "Whether a plated or buffet dinner is included (boolean)."
  hosted_bar_hours_included: "Hours of hosted bar included (integer hours)."
  additional_bar_hour_per_person_usd: "Price per billed attendee of each additional hosted bar hour (USD)."
  setup_teardown_hours_included: "Hours of set-up and tear-down included outside the package hours (integer hours)."
  room_rental_usd: "Function room rental for the package hours (USD)."
  room_rental_waived_when_minimum_met: "Whether room rental is waived when food and beverage revenue reaches the minimum (boolean)."
  fb_minimum_usd: "Food and beverage minimum before service charge and tax (USD)."
  service_charge_pct: "Service charge on food and beverage revenue (number, %)."
  service_charge_taxable: "Whether the service charge bears sales tax (boolean)."
  service_charge_on_room_rental: "Whether the service charge applies to room rental (boolean)."
  av_package_included: "Whether the standard audio-visual package is included (boolean)."
  wifi_included: "Whether meeting-room Wi-Fi is included (boolean)."
  guarantee_due_business_days: "Business days (Monday to Friday excluding US federal holidays) before the event by which the final guarantee is due (integer days)."
  overset_pct: "Share above the guarantee the kitchen prepares for (number, %)."
  billing_on_actual_if_higher: "Whether attendance is billed on the greater of the guarantee and the actual count (boolean)."
  guarantee_max_reduction_pct: "Most the guarantee may fall below the contracted attendance before billing is held at that floor (number, %)."
  deposit_signing_pct: "Deposit at signing as a percentage of estimated revenue (number, %)."
  deposit_ninety_day_pct: "Deposit due 90 calendar days before the event as a percentage of estimated revenue (number, %)."
  deposit_final_pct: "Final prepayment as a percentage of estimated revenue (number, %)."
  deposit_final_days_before_event: "Calendar days before the event on which the final prepayment is due (integer days; 0 when none)."
  deposit_refundable: "Whether deposits are refunded on cancellation (boolean)."
  cancellation_scale: "Cancellation charge ladder: list of {days_from, pct}; pct of estimated revenue applies when the signed cancellation is received days_from or more calendar days before the event, first matching step from the top."
  cancellation_basis: "What the cancellation charge is computed on (enum: estimated_food_beverage_and_rental)."
  outside_wine_permitted: "Whether the client may bring their own wine (boolean)."
  corkage_fee_per_bottle_usd: "Corkage per 750 ml bottle opened (USD)."
  outside_cake_permitted: "Whether the client may bring a cake from an outside baker (boolean)."
  cake_cutting_fee_per_person_usd: "Cake cutting fee per billed attendee for an outside cake (USD)."
  bartender_fee_usd: "Fee per bartender for a hosted or cash bar (USD)."
  guests_per_bartender: "Billed attendees per bartender assigned (integer persons; 0 when no bar is offered)."
  overtime_hour_fee_usd: "Fee per hour of function space use beyond the package hours (USD)."
  max_overtime_hours: "Most overtime hours that may be booked (integer hours)."
  dance_floor_included: "Whether a dance floor is included (boolean)."
  menu_tasting_complimentary_persons: "Persons invited to a complimentary menu tasting (integer persons)."
  ceremony_fee_usd: "Ceremony site fee (USD)."
  block_link_waiver_room_nights: "Contracted room nights of a linked group room block at which room rental is waived (integer room nights; 0 when not available)."
  max_booking_lead_days: "Most calendar days between contracting and the event (integer days)."
  option_validity_days: "Calendar days after the proposal within which the client must sign, after which the space is released (integer days)."
  final_menu_due_days: "Calendar days before the event by which menus are confirmed (integer days)."
  direct_bill_eligible: "Whether the balance may be invoiced after the event (boolean)."
  payment_due_days_after_event: "Calendar days after the event within which an invoiced balance is due (integer days; 0 when payment is due before the event)."
  late_payment_interest_pct_per_month: "Interest per month on an overdue invoiced balance (number, %)."
  shortfall_bears_service_charge: "Whether a minimum shortfall bears the service charge (boolean)."
  shortfall_taxable: "Whether a minimum shortfall bears sales tax (boolean)."

