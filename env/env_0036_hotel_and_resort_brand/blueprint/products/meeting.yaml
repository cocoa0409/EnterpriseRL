events:
  - type: meeting_contract_create
    target: meeting_contracts
    mutation: create
    meaning: "Catering sales issues an event proposal and holds the function space on a tentative basis."
    grain: "One row per transaction."
    fields:
      meeting_contract_id: "reference number of the new event contract"
      customer_id: "client contact"
      variant_name: "package"
      event_name: "event name"
      property_code: "hotel"
      event_date: "date of the event"
      proposal_date: "date the proposal was issued"
      contracted_attendance: "expected attendance"
      tax_rate_pct: "sales tax rate"
      group_block_id: "linked group room block, if any"
    triggers: []

  - type: meeting_contract_sign
    target: meeting_contracts
    mutation: {transition: {from: tentative, to: definite}}
    meaning: "The client signs the event contract."
    grain: "One row per transaction."
    fields:
      meeting_contract_id: "contract signed"
      contract_signed_date: "date signed"
    triggers: []

  - type: meeting_option_lapse
    target: meeting_contracts
    mutation: {transition: {from: tentative, to: cancelled}}
    meaning: "The option period ends without a signature and the space is released."
    grain: "One row per transaction."
    fields:
      meeting_contract_id: "contract lapsed"
      cancelled_date: "date the option lapsed"
    triggers: []

  - type: meeting_contract_cancel
    target: meeting_contracts
    mutation: {transition: {from: definite, to: cancelled}}
    meaning: "The client's signed cancellation of a definite event contract takes effect."
    grain: "One row per transaction."
    fields:
      meeting_contract_id: "contract cancelled"
      cancelled_date: "date the signed cancellation was received"
      customer_id: "client (read, not changed)"
    triggers:
      - event: meeting:meeting_cancellation_charge
        map: {meeting_contract_id: meeting_contract_id, customer_id: customer_id, entry_date: cancelled_date, charge_component: cancellation_damages}

  - type: meeting_guarantee_set
    target: meeting_contracts
    mutation: update
    meaning: "The client gives or changes the final guaranteed attendance."
    grain: "One row per transaction."
    fields:
      meeting_contract_id: "contract"
      guaranteed_attendance: "guaranteed attendance"
    triggers: []

  - type: meeting_event_complete
    target: meeting_contracts
    mutation: {transition: {from: definite, to: completed}}
    meaning: "The event is held and the banquet captain records the attendance."
    grain: "One row per transaction."
    fields:
      meeting_contract_id: "contract"
      actual_attendance: "attendance counted"
      customer_id: "client (read, not changed)"
      event_date: "event date (read, not changed)"
      deposit_held: "deposits held (read, not changed)"
    triggers:
      - event: meeting:meeting_package_charge
        map: {meeting_contract_id: meeting_contract_id, customer_id: customer_id, entry_date: event_date, charge_component: package_per_person}
      - event: meeting:meeting_deposit_apply
        when: {deposit_held: {not: 0}}
        map: {meeting_contract_id: meeting_contract_id, customer_id: customer_id, amount: deposit_held, entry_date: event_date, charge_component: deposit_applied}

  - type: meeting_close
    target: meeting_contracts
    mutation: {transition: [{from: completed, to: closed}, {from: cancelled, to: closed}]}
    meaning: "The event file is closed once nothing remains owed."
    grain: "One row per transaction."
    fields:
      meeting_contract_id: "contract closed"
    triggers: []

  - type: meeting_deposit_receive
    target: meeting_ledger
    meaning: "A scheduled event deposit or the final prepayment is received."
    grain: "One entry per scheduled deposit."
    distinguish_by: [charge_component]
    fields:
      meeting_contract_id: "contract"
      customer_id: "client"
      amount: "amount received"
      quantity: "0"
      entry_date: "date received"
      charge_component: "deposit_signing, deposit_ninety_day or deposit_final"
    account: meeting_deposit
    direction: in
    triggers: []

  - type: meeting_deposit_refund
    target: meeting_ledger
    meaning: "An event deposit is returned to the client."
    grain: "One entry per deposit refunded."
    distinguish_by: [related_entry_id]
    fields:
      meeting_contract_id: "contract"
      customer_id: "client"
      amount: "amount refunded"
      quantity: "0"
      entry_date: "date refunded"
      charge_component: "deposit_refunded"
      related_entry_id: "deposit refunded"
    account: meeting_deposit
    direction: out
    triggers: []

  - type: meeting_deposit_apply
    target: meeting_ledger
    meaning: "After the event the deposits held are applied to the event bill."
    grain: "One entry per contract."
    distinguish_by: [charge_component]
    fields:
      meeting_contract_id: "contract"
      customer_id: "client"
      amount: "deposits applied"
      quantity: "0"
      entry_date: "date applied"
      charge_component: "deposit_applied"
    account: meeting_deposit
    direction: out
    triggers:
      - event: meeting:meeting_payment
        map: {meeting_contract_id: meeting_contract_id, customer_id: customer_id, amount: amount, entry_date: entry_date, charge_component: deposit_applied, related_entry_id: meeting_entry_id}

  - type: meeting_deposit_forfeit
    target: meeting_ledger
    meaning: "Deposits held are retained toward the cancellation charge."
    grain: "One entry per contract."
    distinguish_by: [charge_component]
    fields:
      meeting_contract_id: "contract"
      customer_id: "client"
      amount: "deposits retained"
      quantity: "0"
      entry_date: "date retained"
      charge_component: "deposit_forfeited"
      related_entry_id: "the cancellation charge"
    account: meeting_deposit
    direction: out
    triggers:
      - event: meeting:meeting_payment
        map: {meeting_contract_id: meeting_contract_id, customer_id: customer_id, amount: amount, entry_date: entry_date, charge_component: deposit_forfeited, related_entry_id: meeting_entry_id}

  - type: meeting_package_charge
    target: meeting_ledger
    meaning: "The package price is charged on the billed attendance."
    grain: "One entry per contract."
    distinguish_by: [charge_component]
    fields:
      meeting_contract_id: "contract"
      customer_id: "client"
      amount: "billed attendance times the package price"
      quantity: "billed attendance"
      entry_date: "event date"
      charge_component: "package_per_person"
    account: meeting_balance
    direction: in
    triggers: []

  - type: meeting_service_charge
    target: meeting_ledger
    meaning: "Service charge and sales tax are charged on the event bill."
    grain: "One entry per component per contract."
    distinguish_by: [charge_component]
    fields:
      meeting_contract_id: "contract"
      customer_id: "client"
      amount: "service charge or tax"
      quantity: "0"
      entry_date: "event date"
      charge_component: "service_charge or sales_tax"
    account: meeting_balance
    direction: in
    triggers: []

  - type: meeting_fee_charge
    target: meeting_ledger
    meaning: "A fee outside the package is charged: room rental, overtime, corkage, cake cutting, bartenders, additional bar hours or a ceremony fee."
    grain: "One entry per fee type per contract."
    distinguish_by: [charge_component]
    fields:
      meeting_contract_id: "contract"
      customer_id: "client"
      amount: "fee"
      quantity: "hours, bottles, persons or bartenders the fee was computed on"
      entry_date: "event date"
      charge_component: "room_rental, overtime_hours, corkage, cake_cutting, bartender, additional_bar_hour or ceremony_fee"
    account: meeting_balance
    direction: in
    triggers: []

  - type: meeting_minimum_shortfall_charge
    target: meeting_ledger
    meaning: "The difference between the food and beverage minimum and the food and beverage revenue is charged."
    grain: "One entry per contract."
    distinguish_by: [charge_component]
    fields:
      meeting_contract_id: "contract"
      customer_id: "client"
      amount: "shortfall"
      quantity: "0"
      entry_date: "event date"
      charge_component: "minimum_shortfall"
    account: meeting_balance
    direction: in
    triggers: []

  - type: meeting_cancellation_charge
    target: meeting_ledger
    meaning: "The cancellation charge of a cancelled definite event contract is assessed."
    grain: "One entry per contract."
    distinguish_by: [charge_component]
    fields:
      meeting_contract_id: "contract"
      customer_id: "client"
      amount: "cancellation charge"
      quantity: "0"
      entry_date: "date the signed cancellation was received"
      charge_component: "cancellation_damages"
    account: meeting_balance
    direction: in
    triggers: []

  - type: meeting_payment
    target: meeting_ledger
    meaning: "A client payment, or an applied or retained deposit, reduces the event bill."
    grain: "One entry per payment."
    distinguish_by: [charge_component, entry_date, related_entry_id]
    fields:
      meeting_contract_id: "contract"
      customer_id: "client"
      amount: "amount paid"
      quantity: "0"
      entry_date: "date paid"
      charge_component: "client_payment, deposit_applied or deposit_forfeited"
      related_entry_id: "the deposit entry applied or retained; empty for client payments"
    account: meeting_balance
    direction: out
    triggers: []

measures:
  - id: meeting_msr_fb_revenue
    window: "The whole life of the contract."
    measure: "Sum of amount over the contract's meeting_package_charge entries and its meeting_fee_charge entries with charge_component additional_bar_hour (food and beverage revenue before service charge and tax)."
  - id: meeting_msr_estimated_revenue
    window: "The contract terms at the moment of handling."
    measure: "The greater of fb_minimum_usd and contracted_attendance times package_price_per_person_usd, plus room_rental_usd unless room rental is waived for the contract."

policies:
  - id: meeting_agg_multi_holding
    subject: [meeting_contract_create]
    rule: >-
      A client may hold any number of event contracts, at one or several hotels; each function is a
      separate contract with its own deposits, guarantee and bill, and a payment or deposit of one
      contract is never applied to another.
    eligibility: []
    params:
      max_per_customer: null

  - id: meeting_agg_linked_room_block
    subject: [meeting_contract_create, meeting_fee_charge]
    rule: >-
      An event contract and a group room block of the same client at the same hotel are combined when
      the contract names the block in group_block_id. Holding a linked group room block changes the
      event's room rental: room rental is waived when the linked block's contracted_room_nights is at
      least block_link_waiver_room_nights and the block's status is definite, actualized or closed. A
      block that is tentative or cancelled waives nothing, and a package whose
      block_link_waiver_room_nights is 0 has no such waiver. The waiver applies once per contract, and
      the block's attrition, deposits and master account remain governed by the Group Room Blocks
      rules.
    eligibility:
      - id: linked_block_state
        applies_to: [meeting_fee_charge]
        kind: state
        condition: "Holding a linked group room block changes the event's room rental: room rental is waived when the linked block's contracted_room_nights is at least block_link_waiver_room_nights and the block's status is definite, actualized or closed."
        evidence_fields: [group_blocks.status, group_blocks.contracted_room_nights, meeting_contracts.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.group_block_id]
          action_bindings:
            meeting_contracts.group_block_id: group_block_id
        state_contract:
          field: group_blocks.status
          allowed: [definite, actualized, closed]
    params:
      per_tier:
        "Executive Boardroom Package": {waiver_room_nights: "=block_link_waiver_room_nights", rental: "=room_rental_usd"}
        "Half-Day Meeting Package": {waiver_room_nights: "=block_link_waiver_room_nights", rental: "=room_rental_usd"}
        "Full-Day Meeting Package": {waiver_room_nights: "=block_link_waiver_room_nights", rental: "=room_rental_usd"}
        "Social Reception Package": {waiver_room_nights: "=block_link_waiver_room_nights", rental: "=room_rental_usd"}
        "Wedding Celebration Package": {waiver_room_nights: "=block_link_waiver_room_nights", rental: "=room_rental_usd"}
        "Conference Plenary Package": {waiver_room_nights: "=block_link_waiver_room_nights", rental: "=room_rental_usd"}

  - id: meeting_contracting
    subject: [meeting_contract_create, meeting_contract_sign, meeting_option_lapse]
    rule: >-
      Catering sales proposes a package only for an expected attendance between min_attendees and
      max_attendees and an event no more than max_booking_lead_days calendar days away. The client
      signs the contract themselves; signing commits them to the food and beverage minimum, the
      guarantee rules and the cancellation scale, so guest services never signs on their behalf. The
      contract can be signed only within option_validity_days calendar days after the proposal was
      issued. Days are counted as whole calendar days from the proposal date, which is day zero; a
      signature on the last day of the option period is accepted. A tentative contract whose option
      period ends unsigned lapses and its space is released. Menus are confirmed no later than
      final_menu_due_days before the event.
    eligibility:
      - id: option_period
        applies_to: [meeting_contract_sign]
        kind: time
        condition: "The contract can be signed only within option_validity_days calendar days after the proposal was issued."
        evidence_fields: [meeting_contracts.proposal_date, meeting_contracts.meeting_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the proposal was issued"
          anchor_source: meeting_contracts.proposal_date
          relation: not_after
          duration_source: variants.option_validity_days
          unit: calendar_days
          counting_rule: "Days are counted as whole calendar days from the proposal date, which is day zero; a signature on the last day of the option period is accepted."
          boundary: inclusive

  - id: meeting_guarantee
    subject: [meeting_guarantee_set]
    rule: >-
      The client gives the final guaranteed attendance, which is the minimum number billed. The
      guarantee must be given no later than guarantee_due_business_days business days before the
      event date. Business days are Monday to Friday excluding US federal holidays, counted back from
      the event date, which is not itself counted; a guarantee given on the last business day of that
      count is accepted. After the due date the guarantee may be raised, subject to the hotel's
      acceptance, but never lowered. A guarantee lower than the contracted attendance less
      guarantee_max_reduction_pct percent, rounded up to a whole person, is accepted for catering but
      billing is held at that floor. When no guarantee is given by the due date the contracted
      attendance becomes the guarantee. A guarantee is set only on a contract whose status is
      definite.
    eligibility:
      - id: guarantee_deadline
        applies_to: [meeting_guarantee_set]
        kind: time
        condition: "The guarantee must be given no later than guarantee_due_business_days business days before the event date."
        evidence_fields: [meeting_contracts.event_date, meeting_contracts.meeting_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the event date"
          anchor_source: meeting_contracts.event_date
          relation: not_after
          duration_source: variants.guarantee_due_business_days
          unit: business_days
          counting_rule: "Business days are Monday to Friday excluding US federal holidays, counted back from the event date, which is not itself counted; a guarantee given on the last business day of that count is accepted."
          boundary: inclusive
      - id: definite_only
        applies_to: [meeting_guarantee_set]
        kind: state
        condition: "A guarantee is set only on a contract whose status is definite."
        evidence_fields: [meeting_contracts.status, meeting_contracts.meeting_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
        state_contract:
          field: meeting_contracts.status
          allowed: [definite]
    params:
      per_tier:
        "Executive Boardroom Package": {due_days: "=guarantee_due_business_days", max_reduction: "=guarantee_max_reduction_pct"}
        "Half-Day Meeting Package": {due_days: "=guarantee_due_business_days", max_reduction: "=guarantee_max_reduction_pct"}
        "Full-Day Meeting Package": {due_days: "=guarantee_due_business_days", max_reduction: "=guarantee_max_reduction_pct"}
        "Social Reception Package": {due_days: "=guarantee_due_business_days", max_reduction: "=guarantee_max_reduction_pct"}
        "Wedding Celebration Package": {due_days: "=guarantee_due_business_days", max_reduction: "=guarantee_max_reduction_pct"}
        "Conference Plenary Package": {due_days: "=guarantee_due_business_days", max_reduction: "=guarantee_max_reduction_pct"}
    formula:
      billing_floor: "contracted_attendance * (100 - guarantee_max_reduction_pct) / 100"

  - id: meeting_deposits
    subject: [meeting_deposit_receive, meeting_deposit_refund, meeting_deposit_apply, meeting_deposit_forfeit]
    rule: >-
      Deposits are percentages of estimated revenue, counted with meeting_msr_estimated_revenue and
      rounded to the cent: deposit_signing_pct at signing, deposit_ninety_day_pct 90 calendar days
      before the event, and deposit_final_pct deposit_final_days_before_event calendar days before the
      event; a package whose percentage is 0 has no such deposit. Each scheduled deposit is received
      once. Deposits are received only while the contract's status is tentative or definite.
      Deposits are not refundable when deposit_refundable is false; on cancellation they are retained
      toward the cancellation charge up to its amount and any excess is refunded, which happens only on
      a contract whose status is cancelled. After the event the deposits held are applied to the bill,
      only on a contract whose status is completed.
    eligibility:
      - id: receivable_state
        applies_to: [meeting_deposit_receive]
        kind: state
        condition: "Deposits are received only while the contract's status is tentative or definite."
        evidence_fields: [meeting_contracts.status, meeting_contracts.meeting_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
        state_contract:
          field: meeting_contracts.status
          allowed: [tentative, definite]
      - id: once_per_milestone
        applies_to: [meeting_deposit_receive]
        kind: dedup
        condition: "Each scheduled deposit is received once."
        evidence_fields: [meeting_ledger.meeting_contract_id, meeting_ledger.charge_component, meeting_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_ledger.meeting_contract_id, meeting_ledger.charge_component]
          action_bindings:
            meeting_ledger.meeting_contract_id: meeting_contract_id
            meeting_ledger.charge_component: charge_component
        dedup_contract:
          table: meeting_ledger
          mode: separate_record
          object_bindings: {meeting_contract_id: meeting_contract_id, charge_component: charge_component}
          duplicate_filters: {event_type: [meeting_deposit_receive]}
          distinct_fields: []
      - id: cancelled_state
        applies_to: [meeting_deposit_refund, meeting_deposit_forfeit]
        kind: state
        condition: "Deposits are not refundable when deposit_refundable is false; on cancellation they are retained toward the cancellation charge up to its amount and any excess is refunded, which happens only on a contract whose status is cancelled."
        evidence_fields: [meeting_contracts.status, meeting_contracts.meeting_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
        state_contract:
          field: meeting_contracts.status
          allowed: [cancelled]
      - id: completed_state
        applies_to: [meeting_deposit_apply]
        kind: state
        condition: "After the event the deposits held are applied to the bill, only on a contract whose status is completed."
        evidence_fields: [meeting_contracts.status, meeting_contracts.meeting_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
        state_contract:
          field: meeting_contracts.status
          allowed: [completed]
    params:
      per_tier:
        "Executive Boardroom Package": {signing: "=deposit_signing_pct", ninety_day: "=deposit_ninety_day_pct", final: "=deposit_final_pct"}
        "Half-Day Meeting Package": {signing: "=deposit_signing_pct", ninety_day: "=deposit_ninety_day_pct", final: "=deposit_final_pct"}
        "Full-Day Meeting Package": {signing: "=deposit_signing_pct", ninety_day: "=deposit_ninety_day_pct", final: "=deposit_final_pct"}
        "Social Reception Package": {signing: "=deposit_signing_pct", ninety_day: "=deposit_ninety_day_pct", final: "=deposit_final_pct"}
        "Wedding Celebration Package": {signing: "=deposit_signing_pct", ninety_day: "=deposit_ninety_day_pct", final: "=deposit_final_pct"}
        "Conference Plenary Package": {signing: "=deposit_signing_pct", ninety_day: "=deposit_ninety_day_pct", final: "=deposit_final_pct"}
    measures: [meeting_msr_estimated_revenue]
    formula:
      signing_deposit: "round(meeting_msr_estimated_revenue * deposit_signing_pct / 100, 2)"
      ninety_day_deposit: "round(meeting_msr_estimated_revenue * deposit_ninety_day_pct / 100, 2)"
      final_prepayment: "round(meeting_msr_estimated_revenue * deposit_final_pct / 100, 2)"

  - id: meeting_event_billing
    subject: [meeting_event_complete, meeting_package_charge, meeting_service_charge]
    rule: >-
      After the event the package is charged on the billed attendance: the greater of the guarantee
      and the actual attendance when billing_on_actual_if_higher is true, and never less than the
      billing floor of meeting_guarantee. The package charge is the billed attendance times
      package_price_per_person_usd. Service charge is service_charge_pct percent of food and beverage
      revenue, counted with meeting_msr_fb_revenue together with any minimum shortfall when
      shortfall_bears_service_charge is true, and of room rental only when service_charge_on_room_rental
      is true. Sales tax at the contract's tax_rate_pct is charged on food and beverage revenue, on fees,
      on the service charge when service_charge_taxable is true and on a minimum shortfall when
      shortfall_taxable is true; each amount is rounded to the cent. Event charges are posted only on a
      contract whose status is completed. Each component is charged once per contract.
    eligibility:
      - id: completed_only
        applies_to: [meeting_package_charge, meeting_service_charge]
        kind: state
        condition: "Event charges are posted only on a contract whose status is completed."
        evidence_fields: [meeting_contracts.status, meeting_contracts.meeting_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
        state_contract:
          field: meeting_contracts.status
          allowed: [completed]
    params:
      per_tier:
        "Executive Boardroom Package": {price: "=package_price_per_person_usd", service_pct: "=service_charge_pct"}
        "Half-Day Meeting Package": {price: "=package_price_per_person_usd", service_pct: "=service_charge_pct"}
        "Full-Day Meeting Package": {price: "=package_price_per_person_usd", service_pct: "=service_charge_pct"}
        "Social Reception Package": {price: "=package_price_per_person_usd", service_pct: "=service_charge_pct"}
        "Wedding Celebration Package": {price: "=package_price_per_person_usd", service_pct: "=service_charge_pct"}
        "Conference Plenary Package": {price: "=package_price_per_person_usd", service_pct: "=service_charge_pct"}
    measures: [meeting_msr_fb_revenue]
    formula:
      billed_attendance: "max(guaranteed_attendance, actual_attendance)"
      package_amount: "max(guaranteed_attendance, actual_attendance) * package_price_per_person_usd"
      service_amount: "round(meeting_msr_fb_revenue * service_charge_pct / 100, 2)"

  - id: meeting_fees
    subject: [meeting_fee_charge]
    rule: >-
      Fees outside the package are charged after the event. Room rental of room_rental_usd is charged
      unless food and beverage revenue reaches fb_minimum_usd and room_rental_waived_when_minimum_met is
      true, or a linked room block waives it under meeting_agg_linked_room_block. Overtime is
      overtime_hour_fee_usd per started hour beyond package_hours, up to max_overtime_hours.
      Corkage of corkage_fee_per_bottle_usd per bottle and cake cutting of
      cake_cutting_fee_per_person_usd per billed attendee apply only where outside wine or an outside
      cake is permitted. Bartenders are charged bartender_fee_usd each, one per guests_per_bartender
      billed attendees or part of them, for hosted or cash bars; each hosted bar hour beyond
      hosted_bar_hours_included costs additional_bar_hour_per_person_usd per billed attendee. A
      ceremony site fee of ceremony_fee_usd applies to ceremonies held at the hotel. Fees are charged
      only on a contract whose status is completed, once per fee type.
    eligibility:
      - id: completed_only
        applies_to: [meeting_fee_charge]
        kind: state
        condition: "Fees are charged only on a contract whose status is completed, once per fee type."
        evidence_fields: [meeting_contracts.status, meeting_contracts.meeting_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
        state_contract:
          field: meeting_contracts.status
          allowed: [completed]
    params:
      per_tier:
        "Executive Boardroom Package": {rental: "=room_rental_usd", overtime: "=overtime_hour_fee_usd", corkage: "=corkage_fee_per_bottle_usd", bartender: "=bartender_fee_usd"}
        "Half-Day Meeting Package": {rental: "=room_rental_usd", overtime: "=overtime_hour_fee_usd", corkage: "=corkage_fee_per_bottle_usd", bartender: "=bartender_fee_usd"}
        "Full-Day Meeting Package": {rental: "=room_rental_usd", overtime: "=overtime_hour_fee_usd", corkage: "=corkage_fee_per_bottle_usd", bartender: "=bartender_fee_usd"}
        "Social Reception Package": {rental: "=room_rental_usd", overtime: "=overtime_hour_fee_usd", corkage: "=corkage_fee_per_bottle_usd", bartender: "=bartender_fee_usd"}
        "Wedding Celebration Package": {rental: "=room_rental_usd", overtime: "=overtime_hour_fee_usd", corkage: "=corkage_fee_per_bottle_usd", bartender: "=bartender_fee_usd"}
        "Conference Plenary Package": {rental: "=room_rental_usd", overtime: "=overtime_hour_fee_usd", corkage: "=corkage_fee_per_bottle_usd", bartender: "=bartender_fee_usd"}

  - id: meeting_minimum
    subject: [meeting_minimum_shortfall_charge]
    rule: >-
      When food and beverage revenue, counted with meeting_msr_fb_revenue before service charge and
      tax, is below fb_minimum_usd, the difference is charged as a minimum shortfall. The shortfall
      bears service charge only when shortfall_bears_service_charge is true and sales tax only when
      shortfall_taxable is true. Room rental, fees and audio-visual charges never count toward the
      minimum. A shortfall is charged only on a contract whose status is completed, once per contract.
    eligibility:
      - id: completed_only
        applies_to: [meeting_minimum_shortfall_charge]
        kind: state
        condition: "A shortfall is charged only on a contract whose status is completed, once per contract."
        evidence_fields: [meeting_contracts.status, meeting_contracts.meeting_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
        state_contract:
          field: meeting_contracts.status
          allowed: [completed]
    measures: [meeting_msr_fb_revenue]
    formula:
      amount: "max(fb_minimum_usd - meeting_msr_fb_revenue, 0)"

  - id: meeting_cancellation
    subject: [meeting_contract_cancel, meeting_cancellation_charge]
    rule: >-
      The client cancels a definite contract only by signing a written cancellation; a request by
      phone has no effect until it is signed. The cancellation charge is the cancellation_scale
      percentage of estimated revenue, counted with meeting_msr_estimated_revenue, for the number of
      calendar days between the date the signed cancellation is received and the event date, rounded
      to the cent. Days are counted as whole calendar days from the notice date to the event date, and
      the first step of cancellation_scale from the top whose days_from is not greater than that count
      applies. Deposits held are retained toward the charge under meeting_deposits. The charge is
      assessed only on a contract whose status is cancelled, once. A tentative contract that lapses
      carries no charge, and a date change is treated as a cancellation and a new contract.
    eligibility:
      - id: signed_cancellation
        applies_to: [meeting_contract_cancel]
        kind: caller_fact
        condition: "The client cancels a definite contract only by signing a written cancellation; a request by phone has no effect until it is signed."
        evidence_fields: [meeting_contracts.meeting_contract_id, meeting_contracts.customer_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
      - id: cancelled_only
        applies_to: [meeting_cancellation_charge]
        kind: state
        condition: "The charge is assessed only on a contract whose status is cancelled, once."
        evidence_fields: [meeting_contracts.status, meeting_contracts.meeting_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
        state_contract:
          field: meeting_contracts.status
          allowed: [cancelled]
    params:
      per_tier:
        "Executive Boardroom Package": {scale: "=cancellation_scale"}
        "Half-Day Meeting Package": {scale: "=cancellation_scale"}
        "Full-Day Meeting Package": {scale: "=cancellation_scale"}
        "Social Reception Package": {scale: "=cancellation_scale"}
        "Wedding Celebration Package": {scale: "=cancellation_scale"}
        "Conference Plenary Package": {scale: "=cancellation_scale"}
    measures: [meeting_msr_estimated_revenue]

  - id: meeting_payments
    subject: [meeting_payment, meeting_close]
    rule: >-
      Client payments reduce the event bill. When direct_bill_eligible is true the balance is invoiced
      after the event and due within payment_due_days_after_event calendar days, with
      late_payment_interest_pct_per_month percent interest per started month overdue; otherwise the
      deposits, including the final prepayment, settle the estimate before the event and any balance is
      charged to the client's card on file the day after the event. Payments are applied only on a
      contract whose status is definite, completed or cancelled. The file is closed only when
      balance_due is zero, and a credit balance is refunded to the client's card.
    eligibility:
      - id: payable_state
        applies_to: [meeting_payment]
        kind: state
        condition: "Payments are applied only on a contract whose status is definite, completed or cancelled."
        evidence_fields: [meeting_contracts.status, meeting_contracts.meeting_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
        state_contract:
          field: meeting_contracts.status
          allowed: [definite, completed, cancelled]
      - id: zero_balance_close
        applies_to: [meeting_close]
        kind: authorization
        condition: "The file is closed only when balance_due is zero, and a credit balance is refunded to the client's card."
        evidence_fields: [meeting_contracts.balance_due, meeting_contracts.meeting_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meeting_contracts.meeting_contract_id]
          action_bindings:
            meeting_contracts.meeting_contract_id: meeting_contract_id
