      valet_corrections: "The excess is the parking of the stay, every self-parking and valet line less the corrections those lines already carry, less the stay's parking maximum, never below zero and rounded half up to the cent at the end; a stay with fewer than the minimum nights parked has no excess."
      latest_self_day: "The weekly basis rate is the rate of the service parked on the most recent night parked, and the chargeable nights per week are the standard chargeable nights."
