# Guest Folios charter of Ashbury Hotels & Resorts.
# One holding = the folio (guest bill) of one stay, governed by the brand standards of the hotel's brand.
category: folio
display_name: Guest Folios

binding:
  holding_table: folio_accounts
  event_tables: [folio_postings]
  intake_tables: [folio_disputes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: folio_balance}

lifecycle:
  states: [open, settled, reopened]
  transitions:
    - {from: open, to: settled, by: system, means: "At check-out the balance is paid to the card on file and the folio is settled."}
    - {from: settled, to: reopened, by: agent, means: "Guest services reopens a settled folio to correct it after the stay."}
    - {from: reopened, to: settled, by: agent, means: "Guest services settles the corrected folio again once any credit has been refunded."}

accounts:
  - key: folio_balance
    unit: USD
    meaning: "Amount the guest owes on the folio: charges and refunds increase it, payments, adjustments and benefit credits decrease it; negative means a credit due to the guest."

parameter_schema:
  self_parking_per_night_usd: "Self-parking charge per night a vehicle is parked (USD)."
  valet_parking_per_night_usd: "Valet parking charge per night a vehicle is parked (USD)."
  valet_available: "Whether the brand standard offers valet parking (boolean)."
  self_parking_included_in_resort_fee: "Whether self-parking is one of the inclusions of the resort fee, so it is never billed separately (boolean)."
  parking_charged_per_night_parked: "Whether parking is charged per night the vehicle is actually parked rather than per night of stay (boolean)."
  resort_fee_per_night_usd: "Resort or destination fee per room night stayed, before tax (USD)."
  resort_fee_taxable: "Whether the resort fee bears room tax at the reservation's tax rate (boolean)."
  resort_fee_waived_on_reward_nights: "Whether no resort fee is charged on nights paid with points or Free Night Awards (boolean)."
  resort_fee_on_nights_stayed_only: "Whether the resort fee is charged only for nights actually stayed (boolean)."
  incidental_hold_per_night_usd: "Card authorisation hold for incidentals per night of stay taken at check-in (USD)."
  incidental_hold_max_usd: "Maximum incidental authorisation hold per stay (USD)."
  cash_incidental_deposit_per_night_usd: "Cash deposit per night required from guests settling incidentals in cash (USD)."
  standard_check_in_time: "Standard check-in time (HH:MM hotel local time)."
  standard_check_out_time: "Standard check-out time (HH:MM hotel local time)."
  minimum_check_in_age: "Minimum age of the registered guest at check-in (integer years)."
  late_checkout_fee_basis: "How a late check-out is charged up to late_checkout_half_day_until (enum: flat_fee, pct_of_nightly_rate)."
  late_checkout_flat_fee_usd: "Flat late check-out fee where the basis is flat_fee (USD)."
  late_checkout_half_day_pct: "Share of the reservation's nightly rate charged where the basis is pct_of_nightly_rate (number, %)."
  late_checkout_half_day_until: "Latest check-out time charged at the late check-out fee; later departures are charged one full night of room and tax (HH:MM)."
  late_checkout_grace_minutes: "Minutes after the standard check-out time before any late check-out fee applies (integer minutes)."
  late_checkout_fee_taxable: "Whether the late check-out fee bears room tax (boolean)."
  elite_late_checkout_guaranteed: "Whether the brand honours the late check-out time an elite tier guarantees, so no late check-out fee is charged up to that time (boolean)."
  early_departure_fee_basis: "Charge when a guest checks out before the departure date on the reservation (enum: none, flat_fee, one_night_room_and_tax)."
  early_departure_flat_fee_usd: "Early departure fee where the basis is flat_fee (USD)."
  early_departure_exempt_rate_plans: "Rate plans never charged an early departure fee (list of rate plan names)."
  pets_allowed: "Whether pets other than service animals are accepted (boolean)."
  pet_fee_per_stay_usd: "Non-refundable pet cleaning fee per stay shorter than the extended-stay threshold (USD)."
  pet_fee_extended_stay_usd: "Non-refundable pet cleaning fee per stay of pet_extended_stay_threshold_nights nights or more (USD)."
  pet_extended_stay_threshold_nights: "Nights from which the extended-stay pet fee applies (integer nights)."
  pet_max_weight_lbs: "Maximum weight of an accepted pet (integer pounds; 0 where pets are not accepted)."
  max_pets_per_room: "Maximum pets per room (integer)."
  pet_fee_refundable: "Whether the pet fee is refunded when no cleaning is needed (boolean)."
  service_animals_exempt: "Whether service animals are exempt from pet fees and pet limits (boolean)."
  smoking_cleaning_fee_usd: "Cleaning fee charged when smoking in a non-smoking room is documented (USD)."
  smoking_fee_max_per_stay: "Maximum number of smoking cleaning fees per stay (integer)."
  smoking_fee_documentation_required: "Whether the smoking fee requires a housekeeping report with photographs or a detector log (boolean)."
  complimentary_breakfast_all_guests: "Whether breakfast is included for every registered guest at no charge (boolean)."
  elite_breakfast_min_tier: "Lowest Ashbury Rewards tier entitled to the elite breakfast benefit (official tier name; Ashbury Rewards Member where breakfast is complimentary for all)."
  elite_breakfast_credit_per_person_usd: "Breakfast credit per entitled person per morning at the breakfast outlet (USD)."
  elite_breakfast_persons: "Persons covered by the elite breakfast benefit per morning: the member and registered guests (integer)."
  breakfast_credit_unused_refundable: "Whether unused breakfast credit is paid out or carried to other charges (boolean)."
  minibar_available: "Whether rooms of the brand have a charged minibar (boolean)."
  minibar_courtesy_removals_per_folio: "Minibar lines guest services may remove on the guest's statement alone on one folio (integer)."
  late_charge_posting_window_days: "Calendar days after check-out within which the hotel may still post charges incurred during the stay (integer days)."
  desk_adjustment_limit_usd: "Total adjustments and benefit credits guest services may post on one folio (USD); larger corrections are referred to the hotel."
  dispute_window_days_after_checkout: "Calendar days after check-out within which a billing correction may be requested (integer days)."
  folio_reopen_allowed: "Whether guest services may reopen a settled folio to correct it within the dispute window (boolean)."
  auto_settle_to_card_at_checkout: "Whether the remaining balance is charged to the card on file automatically at check-out (boolean)."
  refund_to_original_payment: "Whether credits are refunded only to the card the folio was settled to (boolean)."

