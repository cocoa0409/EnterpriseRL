events:
  - type: folio_open
    target: folio_accounts
    mutation: create
    meaning: "At check-in the hotel opens the guest folio of the stay."
    grain: "One row per transaction."
    fields:
      folio_id: "reference number of the new folio"
      customer_id: "guest"
      reservation_id: "reservation checked in"
      variant_name: "brand of the hotel"
      folio_number: "folio number printed on the bill"
      property_code: "hotel"
      opened_date: "check-in date"
      loyalty_member_id: "membership credited for the stay"
      balance_due: "0.00 at opening"
    triggers: []

  - type: folio_room_charge
    target: folio_postings
    meaning: "The night audit posts the room rate and the room tax of one night stayed."
    grain: "One line per charge code per stay night."
    distinguish_by: [charge_code, business_date, posting_sequence]
    fields:
      folio_id: "folio of the stay"
      customer_id: "guest"
      charge_code: "room or room_tax"
      amount: "nightly rate, or the room tax on it"
      business_date: "stay night"
      posted_date: "date posted"
      posting_sequence: "folio line number"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: in
    triggers: []

  - type: folio_resort_fee
    target: folio_postings
    meaning: "The night audit posts the resort or destination fee, and its tax, for one night stayed."
    grain: "One line per charge code per stay night."
    distinguish_by: [charge_code, business_date, posting_sequence]
    fields:
      folio_id: "folio of the stay"
      customer_id: "guest"
      charge_code: "resort_fee or resort_fee_tax"
      amount: "fee or the tax on it"
      business_date: "stay night"
      posted_date: "date posted"
      posting_sequence: "folio line number"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: in
    triggers: []

  - type: folio_incidental_charge
    target: folio_postings
    meaning: "An outlet or department of the hotel posts an incidental charge: breakfast, restaurant, minibar, spa, parking, pet or smoking cleaning fee."
    grain: "One line per charge as posted by the outlet."
    distinguish_by: [charge_code, business_date, posting_sequence]
    fields:
      folio_id: "folio of the stay"
      customer_id: "guest"
      charge_code: "breakfast, food_beverage, minibar, spa, parking_self, parking_valet, pet_fee or smoking_cleaning"
      amount: "amount of the charge"
      business_date: "date the charge was incurred"
      posted_date: "date posted, later than the business date for late charges"
      posting_sequence: "folio line number"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: in
    triggers: []

  - type: folio_late_checkout_fee
    target: folio_postings
    meaning: "At check-out the hotel posts a late check-out fee because the guest left after the standard check-out time."
    grain: "One line per stay."
    distinguish_by: [business_date]
    fields:
      folio_id: "folio of the stay"
      customer_id: "guest"
      charge_code: "late_checkout"
      amount: "fee including any tax"
      business_date: "check-out date"
      posted_date: "date posted"
      posting_sequence: "folio line number"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: in
    triggers: []

  - type: folio_early_departure_fee
    target: folio_postings
    meaning: "At check-out the hotel posts an early departure fee because the guest left before the departure date on the reservation."
    grain: "One line per stay."
    distinguish_by: [business_date]
    fields:
      folio_id: "folio of the stay"
      customer_id: "guest"
      charge_code: "early_departure"
      amount: "fee including any tax"
      business_date: "check-out date"
      posted_date: "date posted"
      posting_sequence: "folio line number"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: in
    triggers: []

  - type: folio_payment
    target: folio_postings
    meaning: "A payment is applied to the folio: the card on file at check-out or after a late charge, or the advance deposit transferred at check-in."
    grain: "One line per payment."
    distinguish_by: [charge_code, posted_date, posting_sequence]
    fields:
      folio_id: "folio paid"
      customer_id: "guest"
      charge_code: "payment_card or payment_deposit_transfer"
      amount: "amount paid"
      business_date: "date of the payment"
      posted_date: "date posted"
      posting_sequence: "folio line number"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: out
    triggers: []

  - type: folio_adjustment
    target: folio_postings
    meaning: "Guest services or the hotel corrects one folio line, wholly or partly, for a recorded reason."
    grain: "One line per corrected original line."
    distinguish_by: [related_posting_id]
    fields:
      folio_id: "folio corrected"
      customer_id: "guest"
      charge_code: "charge code of the line corrected"
      amount: "amount taken off"
      business_date: "business date of the line corrected"
      posted_date: "date of the correction"
      posting_sequence: "0 when posted by guest services"
      related_posting_id: "the line corrected"
      adjustment_reason: "duplicate_posting, incorrect_rate, charge_not_incurred, late_charge_outside_window, resort_fee_not_applicable, elite_benefit_not_applied or early_departure_fee_not_applicable"
    account: folio_balance
    direction: out
    triggers:
      - event: loyalty:loyalty_points_reversal
        when: {charge_code: [room, breakfast, food_beverage, spa]}
        map: {customer_id: customer_id, posted_date: posted_date, earning_source: stay_credit_reversal}

  - type: folio_breakfast_benefit_credit
    target: folio_postings
    meaning: "The elite breakfast benefit is credited against a breakfast charged at the outlet."
    grain: "One credit per breakfast line offset."
    distinguish_by: [related_posting_id]
    fields:
      folio_id: "folio credited"
      customer_id: "guest"
      charge_code: "elite_breakfast_credit"
      amount: "credit amount"
      business_date: "morning of the breakfast"
      posted_date: "date credited"
      posting_sequence: "folio line number, or 0 when posted by guest services"
      related_posting_id: "the breakfast line offset"
      adjustment_reason: "not_applicable when posted by the outlet, elite_benefit_not_applied when posted later by guest services"
    account: folio_balance
    direction: out
    triggers: []

  - type: folio_refund
    target: folio_postings
    meaning: "A credit balance on a corrected folio is refunded to the card the folio was settled to."
    grain: "One line per refund."
    distinguish_by: [posted_date, amount]
    fields:
      folio_id: "folio refunded"
      customer_id: "guest"
      charge_code: "refund_card"
      amount: "amount refunded"
      business_date: "date of the refund"
      posted_date: "date posted"
      posting_sequence: "0 when posted by guest services"
      adjustment_reason: "not_applicable"
    account: folio_balance
    direction: in
    triggers: []

  - type: folio_settle
    target: folio_accounts
    mutation: {transition: {from: open, to: settled}}
    meaning: "At check-out the folio balance is paid and the folio is settled."
    grain: "One row per transaction."
    fields:
      folio_id: "folio settled"
      settled_date: "check-out date"
      check_out_time: "clock time of check-out"
      customer_id: "guest (read, not changed)"
      reservation_id: "reservation of the stay (read, not changed)"
      loyalty_member_id: "membership credited (read, not changed)"
    triggers:
      - event: loyalty:loyalty_points_earn
        when: {loyalty_member_id: {not: ""}}
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, reservation_id: reservation_id, posted_date: settled_date, earning_source: stay_base}

  - type: folio_reopen
    target: folio_accounts
    mutation: {transition: {from: settled, to: reopened}}
    meaning: "Guest services reopens a settled folio to correct it after the stay."
    grain: "One row per transaction."
    fields:
      folio_id: "folio reopened"
    triggers: []

  - type: folio_resettle
    target: folio_accounts
    mutation: {transition: {from: reopened, to: settled}}
    meaning: "Guest services settles a corrected folio again once its balance is zero."
    grain: "One row per transaction."
    fields:
      folio_id: "folio settled again"
      settled_date: "date of the new settlement"
    triggers: []

measures:
  - id: folio_msr_desk_adjustments
    window: "The whole life of one folio, up to the moment of handling."
    measure: "Sum of amount over the folio's folio_adjustment and folio_breakfast_benefit_credit lines whose posting_sequence is 0 (posted by guest services)."
  - id: folio_msr_folio_courtesy_removals
    window: "The whole life of one folio, up to the moment of handling."
    measure: "Count of the folio's folio_adjustment lines with charge_code minibar and adjustment_reason charge_not_incurred."
  - id: folio_msr_guest_courtesy_removals_365
    window: "The 365 calendar days ending on the handling date, inclusive, by posted_date."
    measure: "Count of folio_adjustment lines with charge_code minibar and adjustment_reason charge_not_incurred on all folios of the same customer_id."

policies:
  - id: folio_agg_multi_holding
    subject: [folio_open]
    rule: >-
      A guest may hold any number of folios, one for each stay. Exactly one folio is opened per
      reservation, at its check-in; a reservation never has two folios. Each folio is billed,
      corrected, settled and refunded on its own, and a credit due on one folio is never used to pay
      another. A folio is opened only for a reservation that does not already have one.
    eligibility:
      - id: one_folio_per_reservation
        applies_to: [folio_open]
        kind: dedup
        condition: "A folio is opened only for a reservation that does not already have one."
        evidence_fields: [folio_accounts.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.reservation_id]
          action_bindings:
            folio_accounts.reservation_id: reservation_id
        dedup_contract:
          table: folio_accounts
          mode: separate_record
          object_bindings: {reservation_id: reservation_id}
          duplicate_filters: {status: [open, settled, reopened]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: folio_agg_courtesy_allowance
    subject: [folio_adjustment]
    rule: >-
      Courtesy removals are combined across all of a guest's folios. A courtesy removal is a minibar
      line taken off with adjustment_reason charge_not_incurred on the guest's own statement that the
      item was not consumed, with no record contradicting it. Guest services makes a courtesy removal
      only while the folio's courtesy removals stay within minibar_courtesy_removals_per_folio and the
      guest's courtesy removals across all folios in the last 365 days stay below
      courtesy_removals_per_guest_365_days. The per-folio count is folio_msr_folio_courtesy_removals
      and the guest-wide count is folio_msr_guest_courtesy_removals_365, both counted before the
      removal being considered. A minibar dispute beyond either allowance is not removed by guest
      services and is referred to the hotel as a billing dispute. Brands whose
      minibar_courtesy_removals_per_folio is 0 grant no courtesy removals.
    eligibility:
      - id: courtesy_within_allowance
        applies_to: [folio_adjustment]
        kind: authorization
        condition: "Guest services makes a courtesy removal only while the folio's courtesy removals stay within minibar_courtesy_removals_per_folio and the guest's courtesy removals across all folios in the last 365 days stay below courtesy_removals_per_guest_365_days."
        evidence_fields: [folio_postings.folio_id, folio_postings.customer_id, folio_postings.charge_code, folio_postings.adjustment_reason, folio_postings.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_postings.folio_id, folio_postings.customer_id]
          action_bindings:
            folio_postings.folio_id: folio_id
            folio_postings.customer_id: customer_id
    params:
      courtesy_removals_per_guest_365_days: 2
    measures: [folio_msr_folio_courtesy_removals, folio_msr_guest_courtesy_removals_365]
    formula:
      courtesy_allowed: "folio_msr_folio_courtesy_removals < minibar_courtesy_removals_per_folio and folio_msr_guest_courtesy_removals_365 < courtesy_removals_per_guest_365_days"

  - id: folio_room_and_tax
    subject: [folio_room_charge]
    rule: >-
      For every night actually stayed the night audit posts one room line equal to the reservation's
      nightly rate and one room_tax line equal to that rate times the reservation's tax_rate_pct,
      rounded to the cent, both with the stay night as business date. Nights paid with points or Free
      Night Awards carry a nightly rate of 0.00 and post no room or room tax lines. Room lines are
      posted only to a folio whose status is open. A night has at most one room line and one room tax
      line; a second line with the same charge code and business date is a duplicate posting. Nights
      after the actual check-out date are never posted.
    eligibility:
      - id: folio_open_state
        applies_to: [folio_room_charge]
        kind: state
        condition: "Room lines are posted only to a folio whose status is open."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open]

  - id: folio_resort_fee_charges
    subject: [folio_resort_fee]
    rule: >-
      At brands whose resort_fee_per_night_usd is above zero, the night audit posts the resort fee for
      every night actually stayed and, when resort_fee_taxable is true, a resort_fee_tax line at the
      reservation's tax_rate_pct rounded to the cent. When resort_fee_waived_on_reward_nights is true
      no resort fee is posted for nights paid with points or Free Night Awards, which on the folio are
      the nights of a Reward Night Rate reservation. When resort_fee_on_nights_stayed_only is true no
      fee is posted for nights after the actual check-out date. The fee covers the inclusions of the
      brand, among them self-parking where self_parking_included_in_resort_fee is true, and is not
      reduced because the guest did not use an inclusion. Resort fees are posted only to a folio whose
      status is open.
    eligibility:
      - id: folio_open_state
        applies_to: [folio_resort_fee]
        kind: state
        condition: "Resort fees are posted only to a folio whose status is open."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open]
    params:
      per_tier:
        "Ashbury Express": {fee: "=resort_fee_per_night_usd", taxable: "=resort_fee_taxable"}
        "Ashbury Inn & Suites": {fee: "=resort_fee_per_night_usd", taxable: "=resort_fee_taxable"}
        "Ashbury Hotel": {fee: "=resort_fee_per_night_usd", taxable: "=resort_fee_taxable"}
        "Ashbury Grand": {fee: "=resort_fee_per_night_usd", taxable: "=resort_fee_taxable"}
        "Ashbury Resort & Spa": {fee: "=resort_fee_per_night_usd", taxable: "=resort_fee_taxable"}
        "Ashbury Reserve": {fee: "=resort_fee_per_night_usd", taxable: "=resort_fee_taxable"}

  - id: folio_incidental_rules
    subject: [folio_incidental_charge]
    rule: >-
      Incidentals are posted by the hotel's outlets and departments at the brand's prices. Parking is
      charged per night a vehicle is parked at self_parking_per_night_usd or, where valet_available is
      true, valet_parking_per_night_usd; self-parking is never charged separately where
      self_parking_included_in_resort_fee is true. A pet fee is charged once per stay,
      pet_fee_per_stay_usd for stays shorter than pet_extended_stay_threshold_nights nights and
      pet_fee_extended_stay_usd from that length, and only where pets_allowed is true; it is not
      refunded when pet_fee_refundable is false. Service animals are never charged a pet fee when
      service_animals_exempt is true, and the guest is not asked to prove the animal's status. A
      smoking cleaning fee of smoking_cleaning_fee_usd is charged at most smoking_fee_max_per_stay
      times per stay and only on a housekeeping report with photographs or a detector log held by the
      hotel. Minibar lines are posted only where minibar_available is true. Breakfast is never charged
      where complimentary_breakfast_all_guests is true or on Bed & Breakfast Package Rate stays. A
      charge incurred during the stay may be posted after check-out only no later than
      late_charge_posting_window_days calendar days after the guest checked out. Days are counted as
      whole calendar days from the actual check-out date, which is day zero; a late charge posted on
      the last day of the window is valid. Incidentals are posted only to a folio whose status is open
      or settled.
    eligibility:
      - id: late_charge_window
        applies_to: [folio_incidental_charge]
        kind: time
        condition: "A charge incurred during the stay may be posted after check-out only no later than late_charge_posting_window_days calendar days after the guest checked out."
        evidence_fields: [booking_reservations.actual_check_out_date, folio_accounts.reservation_id, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the guest checked out"
          anchor_source: booking_reservations.actual_check_out_date
          relation: not_after
          duration_source: variants.late_charge_posting_window_days
          unit: calendar_days
          counting_rule: "Days are counted as whole calendar days from the actual check-out date, which is day zero; a late charge posted on the last day of the window is valid."
          boundary: inclusive
      - id: folio_postable_state
        applies_to: [folio_incidental_charge]
        kind: state
        condition: "Incidentals are posted only to a folio whose status is open or settled."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open, settled]

  - id: folio_late_checkout
    subject: [folio_late_checkout_fee]
    rule: >-
      A late check-out fee applies only when the folio's check_out_time is later than
      standard_check_out_time plus late_checkout_grace_minutes. Up to and including
      late_checkout_half_day_until the fee is late_checkout_flat_fee_usd where late_checkout_fee_basis
      is flat_fee, or late_checkout_half_day_pct percent of the reservation's nightly rate where it is
      pct_of_nightly_rate; a check-out later than late_checkout_half_day_until is charged one full
      night at the nightly rate. Room tax at the reservation's tax_rate_pct is added when
      late_checkout_fee_taxable is true, and the result is rounded to the cent. Elite exemption: at
      brands whose elite_late_checkout_guaranteed is true, no fee is charged on a stay credited to an
      Ashbury Rewards member whose tier guarantees late check-out, provided the check_out_time is not
      later than the late check-out time that tier guarantees; a later departure is charged as if no
      exemption existed. At brands whose elite_late_checkout_guaranteed is false the fee applies to
      every guest. Reservations booked through an online travel agency receive no elite exemption. The
      fee is posted only to a folio whose status is open, at most once per stay.
    eligibility:
      - id: folio_open_state
        applies_to: [folio_late_checkout_fee]
        kind: state
        condition: "The fee is posted only to a folio whose status is open, at most once per stay."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open]
    params:
      per_tier:
        "Ashbury Express": {basis: "=late_checkout_fee_basis", flat: "=late_checkout_flat_fee_usd", pct: "=late_checkout_half_day_pct", until: "=late_checkout_half_day_until", elite_honoured: "=elite_late_checkout_guaranteed"}
        "Ashbury Inn & Suites": {basis: "=late_checkout_fee_basis", flat: "=late_checkout_flat_fee_usd", pct: "=late_checkout_half_day_pct", until: "=late_checkout_half_day_until", elite_honoured: "=elite_late_checkout_guaranteed"}
        "Ashbury Hotel": {basis: "=late_checkout_fee_basis", flat: "=late_checkout_flat_fee_usd", pct: "=late_checkout_half_day_pct", until: "=late_checkout_half_day_until", elite_honoured: "=elite_late_checkout_guaranteed"}
        "Ashbury Grand": {basis: "=late_checkout_fee_basis", flat: "=late_checkout_flat_fee_usd", pct: "=late_checkout_half_day_pct", until: "=late_checkout_half_day_until", elite_honoured: "=elite_late_checkout_guaranteed"}
        "Ashbury Resort & Spa": {basis: "=late_checkout_fee_basis", flat: "=late_checkout_flat_fee_usd", pct: "=late_checkout_half_day_pct", until: "=late_checkout_half_day_until", elite_honoured: "=elite_late_checkout_guaranteed"}
        "Ashbury Reserve": {basis: "=late_checkout_fee_basis", flat: "=late_checkout_flat_fee_usd", pct: "=late_checkout_half_day_pct", until: "=late_checkout_half_day_until", elite_honoured: "=elite_late_checkout_guaranteed"}

  - id: folio_early_departure
    subject: [folio_early_departure_fee]
    rule: >-
      An early departure fee applies only when the actual check-out date is earlier than the departure
      date on the reservation at the moment of check-out; a guest who tells the front desk of an
      earlier departure has the reservation's departure date changed and is not an early departure.
      The fee follows early_departure_fee_basis: none charges nothing, flat_fee charges
      early_departure_flat_fee_usd, and one_night_room_and_tax charges one night at the reservation's
      nightly rate plus tax at its tax_rate_pct, rounded to the cent. Reservations on a rate plan
      listed in early_departure_exempt_rate_plans are never charged. Nights not stayed after an early
      departure carry no room, tax or resort fee. The fee is posted only to a folio whose status is
      open.
    eligibility:
      - id: folio_open_state
        applies_to: [folio_early_departure_fee]
        kind: state
        condition: "The fee is posted only to a folio whose status is open."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open]

  - id: folio_payment_and_settlement
    subject: [folio_payment, folio_settle]
    rule: >-
      Money held for the reservation is applied to the folio at check-in as a payment_deposit_transfer
      line. At check-out, when auto_settle_to_card_at_checkout is true, the remaining balance is
      charged to the card on file as a payment_card line and the folio is settled with the check-out
      date and time. A folio is settled only when its balance_due is zero. A late charge posted to a
      settled folio is paid by a further payment_card line on the card on file on the day it is posted.
      Payments are applied only to a folio whose status is open or settled. When the stay is credited
      to an Ashbury Rewards membership, settlement posts the stay's points under the Ashbury Rewards
      earning rules.
    eligibility:
      - id: balance_zero
        applies_to: [folio_settle]
        kind: authorization
        condition: "A folio is settled only when its balance_due is zero."
        evidence_fields: [folio_accounts.balance_due, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
      - id: payable_state
        applies_to: [folio_payment]
        kind: state
        condition: "Payments are applied only to a folio whose status is open or settled."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open, settled]

  - id: folio_breakfast_benefit
    subject: [folio_breakfast_benefit_credit]
    rule: >-
      At brands where complimentary_breakfast_all_guests is false, a stay credited to an Ashbury
      Rewards member whose tier is elite_breakfast_min_tier or higher receives, for each breakfast line
      charged at the outlet during the stay, a credit of the lower of that line's amount and
      elite_breakfast_credit_per_person_usd times elite_breakfast_persons. The credit names the
      breakfast line it offsets, at most one credit per breakfast line, and unused credit is not paid
      out or carried to other charges when breakfast_credit_unused_refundable is false. The member's
      tier is the variant_name on the membership, and it applies to a breakfast only when the
      membership's tier_effective_date is on or before that breakfast's business date. When the tier
      took effect after the breakfast, guest services cannot establish the tier held that morning and
      refers the question to the hotel as a billing dispute. No credit is given on Bed & Breakfast
      Package Rate stays, where breakfast is part of the rate, or on reservations booked through an
      online travel agency. When the outlet did not apply the credit, guest services posts it later
      with adjustment_reason elite_benefit_not_applied, subject to the brand's
      desk_adjustment_limit_usd. Credits are posted only to a folio whose status is open or reopened.
    eligibility:
      - id: credit_state
        applies_to: [folio_breakfast_benefit_credit]
        kind: state
        condition: "Credits are posted only to a folio whose status is open or reopened."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open, reopened]
      - id: tier_held_on_date
        applies_to: [folio_breakfast_benefit_credit]
        kind: authorization
        condition: "The member's tier is the variant_name on the membership, and it applies to a breakfast only when the membership's tier_effective_date is on or before that breakfast's business date."
        evidence_fields: [loyalty_memberships.variant_name, loyalty_memberships.tier_effective_date, folio_accounts.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.loyalty_member_id]
          action_bindings:
            folio_accounts.loyalty_member_id: loyalty_member_id
      - id: one_credit_per_breakfast
        applies_to: [folio_breakfast_benefit_credit]
        kind: dedup
        condition: "The credit names the breakfast line it offsets, at most one credit per breakfast line, and unused credit is not paid out or carried to other charges when breakfast_credit_unused_refundable is false."
        evidence_fields: [folio_postings.related_posting_id, folio_postings.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_postings.related_posting_id]
          action_bindings:
            folio_postings.related_posting_id: related_posting_id
        dedup_contract:
          table: folio_postings
          mode: separate_record
          object_bindings: {related_posting_id: related_posting_id}
          duplicate_filters: {event_type: [folio_breakfast_benefit_credit]}
          distinct_fields: []
    params:
      per_tier:
        "Ashbury Express": {min_tier: "=elite_breakfast_min_tier", per_person: "=elite_breakfast_credit_per_person_usd", persons: "=elite_breakfast_persons"}
        "Ashbury Inn & Suites": {min_tier: "=elite_breakfast_min_tier", per_person: "=elite_breakfast_credit_per_person_usd", persons: "=elite_breakfast_persons"}
        "Ashbury Hotel": {min_tier: "=elite_breakfast_min_tier", per_person: "=elite_breakfast_credit_per_person_usd", persons: "=elite_breakfast_persons"}
        "Ashbury Grand": {min_tier: "=elite_breakfast_min_tier", per_person: "=elite_breakfast_credit_per_person_usd", persons: "=elite_breakfast_persons"}
        "Ashbury Resort & Spa": {min_tier: "=elite_breakfast_min_tier", per_person: "=elite_breakfast_credit_per_person_usd", persons: "=elite_breakfast_persons"}
        "Ashbury Reserve": {min_tier: "=elite_breakfast_min_tier", per_person: "=elite_breakfast_credit_per_person_usd", persons: "=elite_breakfast_persons"}
    formula:
      credit_cap: "elite_breakfast_credit_per_person_usd * elite_breakfast_persons"
      amount: "min(amount, elite_breakfast_credit_per_person_usd * elite_breakfast_persons)"

  - id: folio_evt_adjustment
    subject: [folio_adjustment]
    rule: >-
      An adjustment corrects exactly one original folio line, names it in related_posting_id and
      carries its charge code; when both a charge and its tax line are wrong, each is adjusted by its
      own adjustment. Corrections are made only on a folio whose status is open or reopened; a settled
      folio is first reopened. A correction to a folio whose guest has checked out is made only if it
      is requested no later than dispute_window_days_after_checkout calendar days after the guest
      checked out. Days are counted as whole calendar days from the actual check-out date, which is day
      zero; a request on the last day of the window is accepted. The amount depends on the reason.
      duplicate_posting: a room, room_tax, resort_fee or resort_fee_tax line that repeats the charge
      code and business date of an earlier line on the same folio, or an incidental line that repeats
      the charge code, amount and business date of the line with the immediately preceding
      posting_sequence, is removed in full. incorrect_rate: a room line that differs from the
      reservation's nightly rate is adjusted by the difference, and its room_tax line by the
      difference times the reservation's tax_rate_pct, rounded to the cent. charge_not_incurred: a
      self-parking line at a brand whose self_parking_included_in_resort_fee is true, a pet fee for an
      animal the guest states is a service animal where service_animals_exempt is true, a breakfast
      line on a stay where breakfast is complimentary or part of the rate, and a courtesy minibar
      removal under folio_agg_courtesy_allowance are removed in full. late_charge_outside_window: an
      incidental line posted later than late_charge_posting_window_days after the actual check-out
      date is removed in full. resort_fee_not_applicable: a resort fee or resort fee tax line on a
      night of a Reward Night Rate reservation or on a night after the actual check-out date is
      removed in full. elite_benefit_not_applied: a late check-out fee that folio_late_checkout
      exempts is removed in full. early_departure_fee_not_applicable: an early departure fee that
      folio_early_departure does not support is removed in full. Each original line is adjusted at
      most once. Guest services posts an adjustment only if the total it has posted on the folio,
      including this adjustment, does not exceed desk_adjustment_limit_usd, counted with
      folio_msr_desk_adjustments; a correction that would exceed it, a smoking cleaning fee dispute,
      and any dispute about damage or about whether an incidental was incurred other than a courtesy
      minibar removal are registered as a billing dispute referred to the hotel, and guest services
      posts nothing for that line. A dispute about the room rate the guest agreed to at booking, or a
      request for a goodwill reduction without one of these reasons, is outside these rules.
    eligibility:
      - id: correctable_state
        applies_to: [folio_adjustment]
        kind: state
        condition: "Corrections are made only on a folio whose status is open or reopened; a settled folio is first reopened."
        evidence_fields: [folio_accounts.status, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [open, reopened]
      - id: dispute_window
        applies_to: [folio_adjustment]
        kind: time
        condition: "A correction to a folio whose guest has checked out is made only if it is requested no later than dispute_window_days_after_checkout calendar days after the guest checked out."
        evidence_fields: [booking_reservations.actual_check_out_date, folio_accounts.reservation_id, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the guest checked out"
          anchor_source: booking_reservations.actual_check_out_date
          relation: not_after
          duration_source: variants.dispute_window_days_after_checkout
          unit: calendar_days
          counting_rule: "Days are counted as whole calendar days from the actual check-out date, which is day zero; a request on the last day of the window is accepted."
          boundary: inclusive
      - id: one_adjustment_per_line
        applies_to: [folio_adjustment]
        kind: dedup
        condition: "Each original line is adjusted at most once."
        evidence_fields: [folio_postings.related_posting_id, folio_postings.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_postings.related_posting_id]
          action_bindings:
            folio_postings.related_posting_id: related_posting_id
        dedup_contract:
          table: folio_postings
          mode: separate_record
          object_bindings: {related_posting_id: related_posting_id}
          duplicate_filters: {event_type: [folio_adjustment]}
          distinct_fields: []
      - id: desk_limit
        applies_to: [folio_adjustment]
        kind: authorization
        condition: "Guest services posts an adjustment only if the total it has posted on the folio, including this adjustment, does not exceed desk_adjustment_limit_usd, counted with folio_msr_desk_adjustments; a correction that would exceed it, a smoking cleaning fee dispute, and any dispute about damage or about whether an incidental was incurred other than a courtesy minibar removal are registered as a billing dispute referred to the hotel, and guest services posts nothing for that line."
        evidence_fields: [folio_postings.folio_id, folio_postings.amount, folio_postings.posting_sequence, folio_postings.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_postings.folio_id]
          action_bindings:
            folio_postings.folio_id: folio_id
    params:
      per_tier:
        "Ashbury Express": {desk_limit: "=desk_adjustment_limit_usd", window_days: "=dispute_window_days_after_checkout"}
        "Ashbury Inn & Suites": {desk_limit: "=desk_adjustment_limit_usd", window_days: "=dispute_window_days_after_checkout"}
        "Ashbury Hotel": {desk_limit: "=desk_adjustment_limit_usd", window_days: "=dispute_window_days_after_checkout"}
        "Ashbury Grand": {desk_limit: "=desk_adjustment_limit_usd", window_days: "=dispute_window_days_after_checkout"}
        "Ashbury Resort & Spa": {desk_limit: "=desk_adjustment_limit_usd", window_days: "=dispute_window_days_after_checkout"}
        "Ashbury Reserve": {desk_limit: "=desk_adjustment_limit_usd", window_days: "=dispute_window_days_after_checkout"}
    measures: [folio_msr_desk_adjustments]
    formula:
      within_desk_limit: "folio_msr_desk_adjustments + amount <= desk_adjustment_limit_usd"

  - id: folio_post_stay_correction
    subject: [folio_reopen, folio_resettle, folio_refund]
    rule: >-
      A settled folio is reopened by guest services only to post a correction allowed under
      folio_evt_adjustment or a credit allowed under folio_breakfast_benefit, and only where
      folio_reopen_allowed is true. A folio is reopened only if the request is made no later than
      dispute_window_days_after_checkout calendar days after the guest checked out. Days are counted as
      whole calendar days from the actual check-out date, which is day zero; a request on the last day
      of the window is accepted. When the corrections leave a credit balance, the credit is refunded in
      full to the card the folio was settled to when refund_to_original_payment is true; it is never
      paid in cash, moved to another folio or converted to points. A refund is posted only on a folio
      whose status is reopened, and its amount equals the credit balance. Once the balance is zero the
      folio is settled again with the date of the new settlement. A folio that needs no correction is
      not reopened.
    eligibility:
      - id: reopen_window
        applies_to: [folio_reopen]
        kind: time
        condition: "A folio is reopened only if the request is made no later than dispute_window_days_after_checkout calendar days after the guest checked out."
        evidence_fields: [booking_reservations.actual_check_out_date, folio_accounts.reservation_id, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the guest checked out"
          anchor_source: booking_reservations.actual_check_out_date
          relation: not_after
          duration_source: variants.dispute_window_days_after_checkout
          unit: calendar_days
          counting_rule: "Days are counted as whole calendar days from the actual check-out date, which is day zero; a request on the last day of the window is accepted."
          boundary: inclusive
      - id: refund_state
        applies_to: [folio_refund]
        kind: state
        condition: "A refund is posted only on a folio whose status is reopened, and its amount equals the credit balance."
        evidence_fields: [folio_accounts.status, folio_accounts.balance_due, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
        state_contract:
          field: folio_accounts.status
          allowed: [reopened]
      - id: resettle_balance_zero
        applies_to: [folio_resettle]
        kind: authorization
        condition: "Once the balance is zero the folio is settled again with the date of the new settlement."
        evidence_fields: [folio_accounts.balance_due, folio_accounts.folio_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [folio_accounts.folio_id]
          action_bindings:
            folio_accounts.folio_id: folio_id
    formula:
      refund_amount: "abs(balance_due) if balance_due < 0 else 0"

extended_policies:
  - id: folio_ext_breakfast_credit
    base_policy_refs: [folio_breakfast_benefit]
    overwrite:
      - base_policy: folio_breakfast_benefit
        superseded_clause: >-
          a credit of the lower of that line's amount and elite_breakfast_credit_per_person_usd times elite_breakfast_persons.
        replaced_by: >-
          The elite breakfast credit for one breakfast line is the lower of that line's amount and the morning's breakfast allowance.
      - base_policy: folio_breakfast_benefit
        superseded_clause: >-
          When the outlet did not apply the credit, guest services posts it later with adjustment_reason elite_benefit_not_applied, subject to the brand's desk_adjustment_limit_usd.
        replaced_by: >-
          Guest services posts a missed credit for the breakfast line of the most recent morning of the stay on which a breakfast was charged, the largest breakfast line of that morning when it carries several, with the reason that the elite benefit was not applied and within the brand's desk adjustment limit; a missed credit on an earlier morning is referred to the hotel as a billing dispute, because the outlet's own records of that morning are needed.
    trigger: state_due
    subject: [folio_breakfast_benefit_credit]
    computes: credit_amount
    target_tool: post_breakfast_credit_af6b7bed
    params:
      max_covered_persons: 4
      ambassador_breakfast_scale: 1.3
      titanium_breakfast_supplement_usd: 10.00
      one_bedroom_suite_uplift_usd: 10.00
      junior_suite_uplift_usd: 5.00
      premier_card_uplift_usd: 5.00
      rewards_card_uplift_usd: 2.00
    rule: >-
      At brands that do not include breakfast for every guest, a stay credited to an Ashbury Rewards
      member whose tier entitles them to the elite breakfast benefit receives an elite breakfast credit
      on each breakfast line charged at the outlet during the stay, and when the outlet did not apply it
      guest services posts it later. Guest services posts a missed credit for the breakfast line of the most recent morning of the stay on which a breakfast was charged, the largest breakfast line of that morning when it carries several, with the reason that the elite benefit was not applied and within the brand's desk adjustment limit; a missed credit on an earlier morning is referred to the hotel as a billing dispute, because the outlet's own records of that morning are needed. The elite breakfast credit for one breakfast line is the lower of
      that line's amount and the morning's breakfast allowance. The morning's breakfast allowance is the
      brand's elite breakfast credit per person times the brand's persons covered. Persons covered at
      breakfast: when the reservation behind the folio registers three or more adults and the member
      holds Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite, the persons covered at
      breakfast are the registered adults, up to the maximum persons covered; when the reservation
      registers exactly one adult, one person is covered; otherwise the brand's persons covered apply.
      Per-person breakfast credit: for an Ashbury Rewards Ambassador Elite member the per-person
      breakfast credit is the brand's elite breakfast credit per person multiplied by the Ambassador
      breakfast scale and rounded half up to the cent; for an Ashbury Rewards Titanium Elite member it is
      the brand's elite breakfast credit per person plus the Titanium breakfast supplement; for every
      other member it is the brand's elite breakfast credit per person. Suite breakfast uplift: a
      reservation in a one-bedroom suite adds the one-bedroom suite uplift to each covered person's
      credit, a reservation in a junior suite adds the junior suite uplift, and a reservation in any
      other room type adds nothing. Co-brand breakfast uplift: a membership linked to the Ashbury
      Rewards Premier Card adds the premier card uplift to each covered person's credit, a membership
      linked to the Ashbury Rewards Card adds the rewards card uplift, and a membership with no linked
      card adds nothing. Put together, the morning's breakfast allowance is the per-person breakfast
      credit plus the suite breakfast uplift plus the co-brand breakfast uplift, that sum multiplied once
      by the persons covered at breakfast; the uplifts are added per person before the multiplication and
      are never multiplied by the scale. The credit is rounded half up to the cent and only at the end.
      The registered adults and the room type are read from the reservation behind the folio, and the
      tier and the linked card from the membership credited for the stay.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [adults, room_type]
        note: The registered adults decide the persons covered at breakfast and the room type decides the suite breakfast uplift.
      - category: loyalty
        as: branch
        reads: [variant_name, cobrand_card]
        note: The member's tier decides the per-person breakfast credit and the persons covered, and the linked co-brand card decides the co-brand breakfast uplift.
    compute:
      - breakfast_day: "LATEST('folio_postings','business_date', date_field='business_date', event_type='folio_incidental_charge', charge_code='breakfast')"
      - breakfast_line: "MAX('folio_postings','amount', event_type='folio_incidental_charge', charge_code='breakfast', business_date=breakfast_day)"
      - registered_adults: "CFIELD('booking','adults', reservation_id=F('reservation_id'))"
      - member_tier: "CFIELD('loyalty','variant_name', loyalty_member_id=F('loyalty_member_id'))"
      - persons_covered: "MN(registered_adults, K('max_covered_persons')) if (registered_adults >= 3 and (member_tier == 'Ashbury Rewards Titanium Elite' or member_tier == 'Ashbury Rewards Ambassador Elite')) else (1 if registered_adults == 1 else P('elite_breakfast_persons'))"
      - per_person_credit: "RND(P('elite_breakfast_credit_per_person_usd') * K('ambassador_breakfast_scale'), 2) if member_tier == 'Ashbury Rewards Ambassador Elite' else (P('elite_breakfast_credit_per_person_usd') + K('titanium_breakfast_supplement_usd') if member_tier == 'Ashbury Rewards Titanium Elite' else P('elite_breakfast_credit_per_person_usd'))"
      - room_type: "CFIELD('booking','room_type', reservation_id=F('reservation_id'))"
      - suite_uplift: "K('one_bedroom_suite_uplift_usd') if room_type == 'one_bedroom_suite' else (K('junior_suite_uplift_usd') if room_type == 'junior_suite' else 0)"
      - cobrand_card: "CFIELD('loyalty','cobrand_card', loyalty_member_id=F('loyalty_member_id'))"
      - card_uplift: "K('premier_card_uplift_usd') if cobrand_card == 'ashbury_rewards_premier_card' else (K('rewards_card_uplift_usd') if cobrand_card == 'ashbury_rewards_card' else 0)"
      - morning_allowance: "(per_person_credit + suite_uplift + card_uplift) * persons_covered"
      - result: "RND(MN(breakfast_line, morning_allowance), 2)"
    compute_basis:
      breakfast_day: "Guest services posts a missed credit for the breakfast line of the most recent morning of the stay on which a breakfast was charged, the largest breakfast line of that morning when it carries several, with the reason that the elite benefit was not applied and within the brand's desk adjustment limit; a missed credit on an earlier morning is referred to the hotel as a billing dispute, because the outlet's own records of that morning are needed."
      breakfast_line: "Guest services posts a missed credit for the breakfast line of the most recent morning of the stay on which a breakfast was charged, the largest breakfast line of that morning when it carries several, with the reason that the elite benefit was not applied and within the brand's desk adjustment limit; a missed credit on an earlier morning is referred to the hotel as a billing dispute, because the outlet's own records of that morning are needed."
      registered_adults: "The registered adults and the room type are read from the reservation behind the folio, and the tier and the linked card from the membership credited for the stay."
      member_tier: "The registered adults and the room type are read from the reservation behind the folio, and the tier and the linked card from the membership credited for the stay."
      persons_covered: "Persons covered at breakfast: when the reservation behind the folio registers three or more adults and the member holds Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite, the persons covered at breakfast are the registered adults, up to the maximum persons covered; when the reservation registers exactly one adult, one person is covered; otherwise the brand's persons covered apply."
      per_person_credit: "Per-person breakfast credit: for an Ashbury Rewards Ambassador Elite member the per-person breakfast credit is the brand's elite breakfast credit per person multiplied by the Ambassador breakfast scale and rounded half up to the cent; for an Ashbury Rewards Titanium Elite member it is the brand's elite breakfast credit per person plus the Titanium breakfast supplement; for every other member it is the brand's elite breakfast credit per person."
      room_type: "The registered adults and the room type are read from the reservation behind the folio, and the tier and the linked card from the membership credited for the stay."
      suite_uplift: "Suite breakfast uplift: a reservation in a one-bedroom suite adds the one-bedroom suite uplift to each covered person's credit, a reservation in a junior suite adds the junior suite uplift, and a reservation in any other room type adds nothing."
      cobrand_card: "The registered adults and the room type are read from the reservation behind the folio, and the tier and the linked card from the membership credited for the stay."
      card_uplift: "Co-brand breakfast uplift: a membership linked to the Ashbury Rewards Premier Card adds the premier card uplift to each covered person's credit, a membership linked to the Ashbury Rewards Card adds the rewards card uplift, and a membership with no linked card adds nothing."
      morning_allowance: "Put together, the morning's breakfast allowance is the per-person breakfast credit plus the suite breakfast uplift plus the co-brand breakfast uplift, that sum multiplied once by the persons covered at breakfast; the uplifts are added per person before the multiplication and are never multiplied by the scale."
      result: "The credit is rounded half up to the cent and only at the end."
    factors:
      - id: persons_covered_at_breakfast
        effect: parameter
        decides: persons_covered
        bindings: [registered_adults, persons_covered]
        ladder:
          - when: "the reservation registers three or more adults and the member holds Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite"
            value: "the registered adults, up to the maximum persons covered (MN(adults, K('max_covered_persons')))"
          - when: "the reservation registers exactly one adult"
            value: "one person"
          - when: "otherwise"
            value: "the brand's persons covered (P('elite_breakfast_persons'))"
        baseline:
          persons_covered: "P('elite_breakfast_persons')"
        evidence: [cross_category, tier_param]
        cross_difficulty: booking
      - id: per_person_breakfast_credit
        effect: method
        decides: per_person_credit
        bindings: [member_tier, per_person_credit]
        ladder:
          - when: "the member holds Ashbury Rewards Ambassador Elite"
            method: "the brand's credit per person is scaled: multiplied by the Ambassador breakfast scale and rounded half up to the cent"
          - when: "the member holds Ashbury Rewards Titanium Elite"
            method: "the brand's credit per person is supplemented: the Titanium breakfast supplement is added to it"
          - when: "otherwise"
            method: "the brand's credit per person is taken as it stands"
        baseline:
          per_person_credit: "P('elite_breakfast_credit_per_person_usd')"
        evidence: [cross_category, tier_param]
        cross_difficulty: loyalty
      - id: suite_breakfast_uplift
        effect: parameter
        decides: suite_uplift
        bindings: [room_type, suite_uplift]
        ladder:
          - when: "the reservation is in a one-bedroom suite"
            value: "the one-bedroom suite uplift per person (K('one_bedroom_suite_uplift_usd'))"
          - when: "the reservation is in a junior suite"
            value: "the junior suite uplift per person (K('junior_suite_uplift_usd'))"
          - when: "otherwise"
            value: "nothing (0)"
        baseline:
          suite_uplift: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: cobrand_breakfast_uplift
        effect: parameter
        decides: card_uplift
        bindings: [cobrand_card, card_uplift]
        ladder:
          - when: "the membership is linked to the Ashbury Rewards Premier Card"
            value: "the premier card uplift per person (K('premier_card_uplift_usd'))"
          - when: "the membership is linked to the Ashbury Rewards Card"
            value: "the rewards card uplift per person (K('rewards_card_uplift_usd'))"
          - when: "otherwise"
            value: "nothing (0)"
        baseline:
          card_uplift: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The elite breakfast credit for one breakfast line is the lower of that line's amount and the
        morning's breakfast allowance. The morning's breakfast allowance is the brand's elite breakfast
        credit per person times the brand's persons covered. The credit is rounded half up to the cent and
        only at the end.
      params: [elite_breakfast_credit_per_person_usd, elite_breakfast_persons]
    inputs:
      history:
        - {table: folio_postings, aggregate: latest, field: business_date, filters: {event_type: folio_incidental_charge, charge_code: breakfast}}
        - {table: folio_postings, aggregate: max, field: amount, filters: {event_type: folio_incidental_charge, charge_code: breakfast}}
      cross_category: [booking, loyalty]

  - id: folio_ext_dining_allowance_carryover
    base_policy_refs: [folio_breakfast_benefit]
    overwrite:
      - base_policy: folio_breakfast_benefit
        superseded_clause: >-
          unused credit is not paid out or carried to other charges when breakfast_credit_unused_refundable is false.
        replaced_by: >-
          A member whose tier entitles them to the elite breakfast benefit may carry what remains of a day's dining allowance to one food and beverage line charged at the hotel's outlets on that business date, and applies the carry-over personally.
    trigger: on_request
    subject: [folio_breakfast_benefit_credit]
    computes: carry_amount
    target_tool: apply_dining_allowance_ccaea779
    params:
      ambassador_daily_dining_per_person_usd: 95.00
      titanium_daily_dining_per_person_usd: 80.00
      platinum_daily_room_allowance_usd: 100.00
      max_dining_persons: 4
      seven_night_uplift_usd: 15.00
      five_night_uplift_usd: 10.00
      seventy_five_night_uplift_usd: 12.00
      fifty_night_uplift_usd: 6.00
    rule: >-
      A member whose tier entitles them to the elite breakfast benefit may carry what remains of a day's
      dining allowance to one food and beverage line charged at the hotel's outlets on that business
      date, and applies the carry-over personally. Unused allowance is never paid out and never carried
      to another business date. The part of a day's dining allowance carried to a food and beverage line
      is fixed only after every breakfast line of that business date carries its elite breakfast credit.
      The carry-over is made for the most recent business date of the stay on which a food and beverage
      line was charged, and it is applied to the largest food and beverage line of that business date.
      The carry-over is the day's dining allowance less the elite credits already standing for that
      business date, that is the elite breakfast credits of that morning whoever posted them and any
      carry-over already applied that day, never below zero and never more than the food and beverage
      line it is applied to, rounded half up to the cent at the end. The day's dining allowance is the
      brand's elite breakfast credit per person times the brand's persons covered. Dining allowance
      method: for an Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite member whose
      stay was booked through a direct channel — the brand website, the mobile app, the call centre or
      the hotel directly — the day's dining allowance is computed per person, as the daily dining amount
      per person plus the stay-length dining uplift plus the engagement dining uplift, that sum
      multiplied once by the dining persons; for an Ashbury Rewards Platinum Elite member whose stay was
      booked through a direct channel it is the Platinum daily room allowance, one fixed amount for the
      room whatever the number of guests; for every other member, including one whose stay was booked
      through a travel agency or a group rooming list, it is the brand's elite breakfast credit per
      person times the brand's persons covered. Daily dining amount per person: the Ambassador daily
      dining amount for an Ashbury Rewards Ambassador Elite member, the Titanium daily dining amount for
      an Ashbury Rewards Titanium Elite member, and the brand's elite breakfast credit per person for
      every other member. Dining persons: when the reservation behind the folio registers three or more
      adults, the dining persons are the registered adults, up to the maximum dining persons; when it
      registers exactly one adult, one person; otherwise the brand's persons covered. Stay-length dining
      uplift: a reservation of seven or more nights adds the seven-night uplift per person, a
      reservation of five or six nights adds the five-night uplift per person, and a shorter reservation
      adds nothing. Engagement dining uplift: a membership with seventy-five or more elite night credits
      in the current calendar year adds the seventy-five-night uplift per person, a membership with
      fifty to seventy-four adds the fifty-night uplift per person, and a membership with fewer adds
      nothing. The registered adults, the nights and the booking channel are read from the reservation
      behind the folio, and the tier and the elite night credits from the membership credited for the
      stay.
    prerequisite:
      - problem: folio_ext_breakfast_credit
        kind: value_input
        gate: day_breakfast_credits
        form: state
        policy_source: >-
          The part of a day's dining allowance carried to a food and beverage line is fixed only after every breakfast line of that business date carries its elite breakfast credit.
        condition: >-
          Every folio line with charge code breakfast whose business date is the carry-over day is named by
          an elite breakfast credit line (related posting) on the same folio.
        resolved_by: post_breakfast_credit_af6b7bed
        effect: >-
          The elite breakfast credit booked for the day's breakfast line enters the elite breakfast credits
          standing for that business date, which the carry-over deducts from the day's dining allowance.
    cross_category:
      - category: booking
        as: branch
        reads: [adults, nights, booking_channel]
        note: The registered adults decide the dining persons, the booking channel (with the tier) decides the dining allowance method, and the reservation's nights decide the stay-length dining uplift.
      - category: loyalty
        as: branch
        reads: [variant_name, elite_night_credits]
        note: The member's tier (with the booking channel) decides the dining allowance method, the tier decides the daily dining amount, and the year's elite night credits decide the engagement dining uplift.
    compute:
      - dining_day: "LATEST('folio_postings','business_date', date_field='business_date', event_type='folio_incidental_charge', charge_code='food_beverage')"
      - dining_line: "MAX('folio_postings','amount', event_type='folio_incidental_charge', charge_code='food_beverage', business_date=dining_day)"
      - day_breakfast_credits: "SUM('folio_postings','amount', event_type='folio_breakfast_benefit_credit', business_date=dining_day)"
      - member_tier: "CFIELD('loyalty','variant_name', loyalty_member_id=F('loyalty_member_id'))"
      - registered_adults: "CFIELD('booking','adults', reservation_id=F('reservation_id'))"
      - booking_channel: "CFIELD('booking','booking_channel', reservation_id=F('reservation_id'))"
      - direct_booking: "booking_channel == 'brand_website' or booking_channel == 'mobile_app' or booking_channel == 'call_center' or booking_channel == 'property_direct'"
      - dining_persons: "MN(registered_adults, K('max_dining_persons')) if registered_adults >= 3 else (1 if registered_adults == 1 else P('elite_breakfast_persons'))"
      - daily_per_person: "K('ambassador_daily_dining_per_person_usd') if CFIELD('loyalty','variant_name', loyalty_member_id=F('loyalty_member_id')) == 'Ashbury Rewards Ambassador Elite' else (K('titanium_daily_dining_per_person_usd') if CFIELD('loyalty','variant_name', loyalty_member_id=F('loyalty_member_id')) == 'Ashbury Rewards Titanium Elite' else P('elite_breakfast_credit_per_person_usd'))"
      - stay_nights: "CFIELD('booking','nights', reservation_id=F('reservation_id'))"
      - stay_uplift: "K('seven_night_uplift_usd') if stay_nights >= 7 else (K('five_night_uplift_usd') if stay_nights >= 5 else 0)"
      - year_night_credits: "CFIELD('loyalty','elite_night_credits', loyalty_member_id=F('loyalty_member_id'))"
      - engagement_uplift: "K('seventy_five_night_uplift_usd') if year_night_credits >= 75 else (K('fifty_night_uplift_usd') if year_night_credits >= 50 else 0)"
      - day_allowance: "(daily_per_person + stay_uplift + engagement_uplift) * dining_persons if ((member_tier == 'Ashbury Rewards Titanium Elite' or member_tier == 'Ashbury Rewards Ambassador Elite') and direct_booking) else (K('platinum_daily_room_allowance_usd') if (member_tier == 'Ashbury Rewards Platinum Elite' and direct_booking) else P('elite_breakfast_credit_per_person_usd') * P('elite_breakfast_persons'))"
      - remaining_allowance: "MX(0, day_allowance - day_breakfast_credits)"
      - result: "RND(MN(dining_line, remaining_allowance), 2)"
    compute_basis:
      dining_day: "The carry-over is made for the most recent business date of the stay on which a food and beverage line was charged, and it is applied to the largest food and beverage line of that business date."
      dining_line: "The carry-over is made for the most recent business date of the stay on which a food and beverage line was charged, and it is applied to the largest food and beverage line of that business date."
      day_breakfast_credits: "The carry-over is the day's dining allowance less the elite credits already standing for that business date, that is the elite breakfast credits of that morning whoever posted them and any carry-over already applied that day, never below zero and never more than the food and beverage line it is applied to, rounded half up to the cent at the end."
      member_tier: "The registered adults, the nights and the booking channel are read from the reservation behind the folio, and the tier and the elite night credits from the membership credited for the stay."
      registered_adults: "The registered adults, the nights and the booking channel are read from the reservation behind the folio, and the tier and the elite night credits from the membership credited for the stay."
      booking_channel: "The registered adults, the nights and the booking channel are read from the reservation behind the folio, and the tier and the elite night credits from the membership credited for the stay."
      direct_booking: "for an Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite member whose stay was booked through a direct channel — the brand website, the mobile app, the call centre or the hotel directly —"
      dining_persons: "Dining persons: when the reservation behind the folio registers three or more adults, the dining persons are the registered adults, up to the maximum dining persons; when it registers exactly one adult, one person; otherwise the brand's persons covered."
      daily_per_person: "Daily dining amount per person: the Ambassador daily dining amount for an Ashbury Rewards Ambassador Elite member, the Titanium daily dining amount for an Ashbury Rewards Titanium Elite member, and the brand's elite breakfast credit per person for every other member."
      stay_nights: "The registered adults, the nights and the booking channel are read from the reservation behind the folio, and the tier and the elite night credits from the membership credited for the stay."
      stay_uplift: "Stay-length dining uplift: a reservation of seven or more nights adds the seven-night uplift per person, a reservation of five or six nights adds the five-night uplift per person, and a shorter reservation adds nothing."
      year_night_credits: "The registered adults, the nights and the booking channel are read from the reservation behind the folio, and the tier and the elite night credits from the membership credited for the stay."
      engagement_uplift: "Engagement dining uplift: a membership with seventy-five or more elite night credits in the current calendar year adds the seventy-five-night uplift per person, a membership with fifty to seventy-four adds the fifty-night uplift per person, and a membership with fewer adds nothing."
      day_allowance: "Dining allowance method: for an Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite member whose stay was booked through a direct channel — the brand website, the mobile app, the call centre or the hotel directly — the day's dining allowance is computed per person, as the daily dining amount per person plus the stay-length dining uplift plus the engagement dining uplift, that sum multiplied once by the dining persons; for an Ashbury Rewards Platinum Elite member whose stay was booked through a direct channel it is the Platinum daily room allowance, one fixed amount for the room whatever the number of guests; for every other member, including one whose stay was booked through a travel agency or a group rooming list, it is the brand's elite breakfast credit per person times the brand's persons covered."
      remaining_allowance: "The carry-over is the day's dining allowance less the elite credits already standing for that business date, that is the elite breakfast credits of that morning whoever posted them and any carry-over already applied that day, never below zero and never more than the food and beverage line it is applied to, rounded half up to the cent at the end."
      result: "The carry-over is the day's dining allowance less the elite credits already standing for that business date, that is the elite breakfast credits of that morning whoever posted them and any carry-over already applied that day, never below zero and never more than the food and beverage line it is applied to, rounded half up to the cent at the end."
    factors:
      - id: dining_allowance_method
        effect: method
        decides: day_allowance
        bindings: [member_tier, booking_channel, direct_booking, day_allowance]
        ladder:
          - when: "the member holds Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite and the stay was booked through a direct channel"
            method: "per person: the daily dining amount per person plus the stay-length and engagement dining uplifts, that sum multiplied by the dining persons"
          - when: "the member holds Ashbury Rewards Platinum Elite and the stay was booked through a direct channel"
            method: "per room: the Platinum daily room allowance, one fixed amount whatever the number of guests"
          - when: "otherwise"
            method: "the standard allowance: the brand's elite breakfast credit per person times the brand's persons covered"
        baseline:
          day_allowance: "P('elite_breakfast_credit_per_person_usd') * P('elite_breakfast_persons')"
        evidence: [cross_category, tier_param]
        cross_difficulty: loyalty
      - id: daily_dining_amount
        effect: parameter
        decides: daily_per_person
        bindings: [daily_per_person]
        ladder:
          - when: "the member holds Ashbury Rewards Ambassador Elite"
            value: "the Ambassador daily dining amount (K('ambassador_daily_dining_per_person_usd'))"
          - when: "the member holds Ashbury Rewards Titanium Elite"
            value: "the Titanium daily dining amount (K('titanium_daily_dining_per_person_usd'))"
          - when: "otherwise"
            value: "the brand's elite breakfast credit per person (P('elite_breakfast_credit_per_person_usd'))"
        baseline:
          daily_per_person: "P('elite_breakfast_credit_per_person_usd')"
        evidence: [cross_category, tier_param]
        cross_difficulty: loyalty
      - id: dining_persons
        effect: parameter
        decides: dining_persons
        bindings: [registered_adults, dining_persons]
        ladder:
          - when: "the reservation registers three or more adults"
            value: "the registered adults, up to the maximum dining persons (MN(adults, K('max_dining_persons')))"
          - when: "the reservation registers exactly one adult"
            value: "one person"
          - when: "otherwise"
            value: "the brand's persons covered (P('elite_breakfast_persons'))"
        baseline:
          dining_persons: "P('elite_breakfast_persons')"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: stay_length_dining_uplift
        effect: parameter
        decides: stay_uplift
        bindings: [stay_nights, stay_uplift]
        ladder:
          - when: "the reservation is for seven or more nights"
            value: "the seven-night uplift per person (K('seven_night_uplift_usd'))"
          - when: "the reservation is for five or six nights"
            value: "the five-night uplift per person (K('five_night_uplift_usd'))"
          - when: "otherwise"
            value: "nothing (0)"
        baseline:
          stay_uplift: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: engagement_dining_uplift
        effect: parameter
        decides: engagement_uplift
        bindings: [year_night_credits, engagement_uplift]
        ladder:
          - when: "the membership carries seventy-five or more elite night credits in the current calendar year"
            value: "the seventy-five-night uplift per person (K('seventy_five_night_uplift_usd'))"
          - when: "the membership carries fifty to seventy-four elite night credits in the current calendar year"
            value: "the fifty-night uplift per person (K('fifty_night_uplift_usd'))"
          - when: "otherwise"
            value: "nothing (0)"
        baseline:
          engagement_uplift: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The carry-over is made for the most recent business date of the stay on which a food and
        beverage line was charged, and it is applied to the largest food and beverage line of that
        business date. The carry-over is the day's dining allowance less the elite credits already
        standing for that business date, that is the elite breakfast credits of that morning whoever
        posted them and any carry-over already applied that day, never below zero and never more than
        the food and beverage line it is applied to, rounded half up to the cent at the end. The day's
        dining allowance is the brand's elite breakfast credit per person times the brand's persons
        covered.
      params: [elite_breakfast_credit_per_person_usd, elite_breakfast_persons]
    inputs:
      history:
        - {table: folio_postings, aggregate: latest, field: business_date, filters: {event_type: folio_incidental_charge, charge_code: food_beverage}}
        - {table: folio_postings, aggregate: max, field: amount, filters: {event_type: folio_incidental_charge, charge_code: food_beverage}}
        - {table: folio_postings, aggregate: sum, field: amount, filters: {event_type: folio_breakfast_benefit_credit}}
      cross_category: [booking, loyalty]

  - id: folio_ext_self_parking_savings
    base_policy_refs: [folio_agg_courtesy_allowance, folio_evt_adjustment, folio_incidental_rules]
    overwrite:
      - base_policy: folio_incidental_rules
        superseded_clause: >-
          Parking is charged per night a vehicle is parked at self_parking_per_night_usd or, where valet_available is true, valet_parking_per_night_usd;
        replaced_by: >-
          The night audit posts each night's self-parking at the brand's self-parking rate, and guest services posts the self-parking savings of the stay as one correction against the most recent self-parking line of the stay, with the reason that the elite benefit was not applied.
    trigger: state_due
    subject: [folio_adjustment]
    computes: savings_amount
    target_tool: correct_self_parking_29958fbc
    params:
      member_saving_pct: 4
      titanium_saving_supplement_pct: 4
      ambassador_saving_scale: 2
      premier_card_saving_pct: 3
      rewards_card_saving_pct: 2
      seventy_five_night_saving_pct: 3
      fifty_night_saving_pct: 2
      seven_night_saving_pct: 3
      five_night_saving_pct: 1
      top_tier_member_rate_multiplier: 1.5
      member_rate_multiplier: 1.25
    rule: >-
      At brands that charge for self-parking, a stay credited to an Ashbury Rewards membership receives
      Ashbury Rewards parking savings on its self-parking. The night audit posts each night's self-parking
      at the brand's self-parking rate, and guest services posts the self-parking savings of the stay as
      one correction against the most recent self-parking line of the stay, with the reason that the elite
      benefit was not applied. The self-parking savings of a stay are the number of self-parking lines of
      the stay times the brand's self-parking rate times the self-parking savings percent, rounded half up
      to the cent at the end. The self-parking savings percent is the member parking saving percent. Card
      parking saving: a membership linked to the Ashbury Rewards Premier Card adds the premier card saving
      percent, one linked to the Ashbury Rewards Card adds the rewards card saving percent, and one with no
      linked card adds nothing. Engagement parking saving: a membership with seventy-five or more elite
      night credits in the current calendar year adds the seventy-five-night saving percent, one with fifty
      to seventy-four adds the fifty-night saving percent, and one with fewer adds nothing. Stay-length
      parking saving: a reservation of seven or more nights adds the seven-night saving percent, one of five
      or six nights adds the five-night saving percent, and a shorter one adds nothing. The combined saving
      percent is the member parking saving percent plus the card, engagement and stay-length parking
      savings, the percentages added first and applied once to the self-parking charged, never one after
      another. Tier parking benefit: for an Ashbury Rewards Ambassador Elite member the self-parking savings
      percent is the combined saving percent scaled, multiplied by the Ambassador saving scale; for an
      Ashbury Rewards Titanium Elite member it is the combined saving percent supplemented, with the
      Titanium saving supplement added to it; for every other member it is the combined saving percent as
      it stands. Member-rate multiplier: when the reservation is on the Member Flexible Rate and the member
      holds Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite, the self-parking savings are
      multiplied by the top-tier member-rate multiplier; when the reservation is on the Member Flexible Rate
      and the member holds Ashbury Rewards Silver Elite, Gold Elite or Platinum Elite, by the member-rate
      multiplier; otherwise they are not multiplied. The multiplier acts on the savings after the percentage
      has been applied and before the final rounding. The tier, the linked card and the elite night credits
      are read from the membership credited for the stay, and the rate plan and the nights from the
      reservation behind the folio.
    prerequisite: []
    cross_category:
      - category: loyalty
        as: branch
        reads: [variant_name, cobrand_card, elite_night_credits]
        note: The tier decides the tier parking benefit and, with the rate plan, the member-rate multiplier; the linked card decides the card parking saving and the year's elite night credits the engagement parking saving.
      - category: booking
        as: branch
        reads: [nights, variant_name]
        note: The reservation's nights decide the stay-length parking saving; its rate plan, with the member's tier, decides the member-rate multiplier.
    compute:
      - self_lines: "COUNT('folio_postings', event_type='folio_incidental_charge', charge_code='parking_self')"
      - member_tier: "CFIELD('loyalty','variant_name', loyalty_member_id=F('loyalty_member_id'))"
      - cobrand_card: "CFIELD('loyalty','cobrand_card', loyalty_member_id=F('loyalty_member_id'))"
      - card_pct: "K('premier_card_saving_pct') if cobrand_card == 'ashbury_rewards_premier_card' else (K('rewards_card_saving_pct') if cobrand_card == 'ashbury_rewards_card' else 0)"
      - year_night_credits: "CFIELD('loyalty','elite_night_credits', loyalty_member_id=F('loyalty_member_id'))"
      - engagement_pct: "K('seventy_five_night_saving_pct') if year_night_credits >= 75 else (K('fifty_night_saving_pct') if year_night_credits >= 50 else 0)"
      - stay_nights: "CFIELD('booking','nights', reservation_id=F('reservation_id'))"
      - stay_pct: "K('seven_night_saving_pct') if stay_nights >= 7 else (K('five_night_saving_pct') if stay_nights >= 5 else 0)"
      - combined_pct: "K('member_saving_pct') + card_pct + engagement_pct + stay_pct"
      - savings_pct: "combined_pct * K('ambassador_saving_scale') if member_tier == 'Ashbury Rewards Ambassador Elite' else (combined_pct + K('titanium_saving_supplement_pct') if member_tier == 'Ashbury Rewards Titanium Elite' else combined_pct)"
      - pct_savings: "self_lines * P('self_parking_per_night_usd') * savings_pct / 100"
      - rate_plan: "CFIELD('booking','variant_name', reservation_id=F('reservation_id'))"
      - rate_multiplier: "K('top_tier_member_rate_multiplier') if (rate_plan == 'Member Flexible Rate' and (member_tier == 'Ashbury Rewards Titanium Elite' or member_tier == 'Ashbury Rewards Ambassador Elite')) else (K('member_rate_multiplier') if (rate_plan == 'Member Flexible Rate' and (member_tier == 'Ashbury Rewards Silver Elite' or member_tier == 'Ashbury Rewards Gold Elite' or member_tier == 'Ashbury Rewards Platinum Elite')) else 1)"
      - result: "RND(pct_savings * rate_multiplier, 2)"
    compute_basis:
      self_lines: "The self-parking savings of a stay are the number of self-parking lines of the stay times the brand's self-parking rate times the self-parking savings percent, rounded half up to the cent at the end."
      member_tier: "The tier, the linked card and the elite night credits are read from the membership credited for the stay, and the rate plan and the nights from the reservation behind the folio."
      cobrand_card: "The tier, the linked card and the elite night credits are read from the membership credited for the stay, and the rate plan and the nights from the reservation behind the folio."
      card_pct: "Card parking saving: a membership linked to the Ashbury Rewards Premier Card adds the premier card saving percent, one linked to the Ashbury Rewards Card adds the rewards card saving percent, and one with no linked card adds nothing."
      year_night_credits: "The tier, the linked card and the elite night credits are read from the membership credited for the stay, and the rate plan and the nights from the reservation behind the folio."
      engagement_pct: "Engagement parking saving: a membership with seventy-five or more elite night credits in the current calendar year adds the seventy-five-night saving percent, one with fifty to seventy-four adds the fifty-night saving percent, and one with fewer adds nothing."
      stay_nights: "The tier, the linked card and the elite night credits are read from the membership credited for the stay, and the rate plan and the nights from the reservation behind the folio."
      stay_pct: "Stay-length parking saving: a reservation of seven or more nights adds the seven-night saving percent, one of five or six nights adds the five-night saving percent, and a shorter one adds nothing."
      combined_pct: "The combined saving percent is the member parking saving percent plus the card, engagement and stay-length parking savings, the percentages added first and applied once to the self-parking charged, never one after another."
      savings_pct: "Tier parking benefit: for an Ashbury Rewards Ambassador Elite member the self-parking savings percent is the combined saving percent scaled, multiplied by the Ambassador saving scale; for an Ashbury Rewards Titanium Elite member it is the combined saving percent supplemented, with the Titanium saving supplement added to it; for every other member it is the combined saving percent as it stands."
      pct_savings: "The self-parking savings of a stay are the number of self-parking lines of the stay times the brand's self-parking rate times the self-parking savings percent, rounded half up to the cent at the end."
      rate_plan: "The tier, the linked card and the elite night credits are read from the membership credited for the stay, and the rate plan and the nights from the reservation behind the folio."
      rate_multiplier: "Member-rate multiplier: when the reservation is on the Member Flexible Rate and the member holds Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite, the self-parking savings are multiplied by the top-tier member-rate multiplier; when the reservation is on the Member Flexible Rate and the member holds Ashbury Rewards Silver Elite, Gold Elite or Platinum Elite, by the member-rate multiplier; otherwise they are not multiplied."
      result: "The multiplier acts on the savings after the percentage has been applied and before the final rounding."
    factors:
      - id: tier_parking_benefit
        effect: method
        decides: savings_pct
        bindings: [member_tier, savings_pct]
        ladder:
          - when: "the member holds Ashbury Rewards Ambassador Elite"
            method: "scaled: the combined saving percent is multiplied by the Ambassador saving scale"
          - when: "the member holds Ashbury Rewards Titanium Elite"
            method: "supplemented: the Titanium saving supplement is added to the combined saving percent"
          - when: "otherwise"
            method: "the combined saving percent is taken as it stands"
        baseline:
          savings_pct: "combined_pct"
        evidence: [cross_category, tier_param]
        cross_difficulty: loyalty
      - id: card_parking_saving
        effect: parameter
        decides: card_pct
        bindings: [cobrand_card, card_pct]
        ladder:
          - when: "the membership is linked to the Ashbury Rewards Premier Card"
            value: "the premier card saving percent (K('premier_card_saving_pct'))"
          - when: "the membership is linked to the Ashbury Rewards Card"
            value: "the rewards card saving percent (K('rewards_card_saving_pct'))"
          - when: "otherwise"
            value: "nothing (0)"
        baseline:
          card_pct: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: engagement_parking_saving
        effect: parameter
        decides: engagement_pct
        bindings: [year_night_credits, engagement_pct]
        ladder:
          - when: "the membership carries seventy-five or more elite night credits in the current calendar year"
            value: "the seventy-five-night saving percent (K('seventy_five_night_saving_pct'))"
          - when: "the membership carries fifty to seventy-four elite night credits in the current calendar year"
            value: "the fifty-night saving percent (K('fifty_night_saving_pct'))"
          - when: "otherwise"
            value: "nothing (0)"
        baseline:
          engagement_pct: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: stay_length_parking_saving
        effect: parameter
        decides: stay_pct
        bindings: [stay_nights, stay_pct]
        ladder:
          - when: "the reservation is for seven or more nights"
            value: "the seven-night saving percent (K('seven_night_saving_pct'))"
          - when: "the reservation is for five or six nights"
            value: "the five-night saving percent (K('five_night_saving_pct'))"
          - when: "otherwise"
            value: "nothing (0)"
        baseline:
          stay_pct: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: member_rate_multiplier
        effect: parameter
        decides: rate_multiplier
        bindings: [rate_plan, rate_multiplier]
        ladder:
          - when: "the reservation is on the Member Flexible Rate and the member holds Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite"
            value: "the top-tier member-rate multiplier (K('top_tier_member_rate_multiplier'))"
          - when: "the reservation is on the Member Flexible Rate and the member holds Ashbury Rewards Silver Elite, Gold Elite or Platinum Elite"
            value: "the member-rate multiplier (K('member_rate_multiplier'))"
          - when: "otherwise"
            value: "no multiplier (1)"
        baseline:
          rate_multiplier: "1"
        evidence: [cross_category]
        cross_difficulty: booking
    baseline:
      rule: >-
        The self-parking savings of a stay are the number of self-parking lines of the stay times the
        brand's self-parking rate times the self-parking savings percent, rounded half up to the cent at
        the end. The self-parking savings percent is the member parking saving percent.
      params: [member_saving_pct, self_parking_per_night_usd]
    inputs:
      history:
        - {table: folio_postings, aggregate: count, field: posting_id, filters: {event_type: folio_incidental_charge, charge_code: parking_self}}
      cross_category: [booking, loyalty]

  - id: folio_ext_valet_parking_savings
    base_policy_refs: [folio_agg_courtesy_allowance, folio_evt_adjustment, folio_incidental_rules]
    overwrite:
      - base_policy: folio_incidental_rules
        superseded_clause: >-
          Parking is charged per night a vehicle is parked at self_parking_per_night_usd or, where valet_available is true, valet_parking_per_night_usd;
        replaced_by: >-
          The night audit posts each night's valet parking at the brand's valet rate, and guest services posts the valet savings of the stay as one correction against the most recent valet line of the stay, with the reason that the elite benefit was not applied.
    trigger: state_due
    subject: [folio_adjustment]
    computes: savings_amount
    target_tool: correct_valet_parking_0a0ec721
    params:
      member_valet_saving_pct: 4
      platinum_valet_saving_pct: 8
      titanium_upgrade_share: 0.5
      member_rate_valet_bonus_usd: 1.50
      corporate_rate_valet_bonus_usd: 1.00
      app_valet_bonus_usd: 1.00
      website_valet_bonus_usd: 0.50
      seventy_five_night_valet_bonus_usd: 1.00
      fifty_night_valet_bonus_usd: 0.50
      seven_night_valet_bonus_usd: 1.00
      five_night_valet_bonus_usd: 0.50
    rule: >-
      At brands that offer valet parking, a stay credited to an Ashbury Rewards membership receives
      Ashbury Rewards valet savings on its valet parking. The night audit posts each night's valet parking
      at the brand's valet rate, and guest services posts the valet savings of the stay as one correction
      against the most recent valet line of the stay, with the reason that the elite benefit was not
      applied. The valet savings of a stay are the nightly valet saving times the number of valet lines of
      the stay, rounded half up to the cent at the end. The nightly valet saving is the member valet saving
      percent of the brand's valet rate. Valet saving method: for an Ashbury Rewards Ambassador Elite
      member the nightly valet saving is the full valet upgrade, the brand's valet rate less the brand's
      self-parking rate; for an Ashbury Rewards Titanium Elite member it is the valet upgrade times the
      Titanium upgrade share; for an Ashbury Rewards Platinum Elite member it is the Platinum valet saving
      percent of the brand's valet rate; for every other member it is the member valet saving percent of
      the brand's valet rate. Rate-plan valet bonus: a reservation on the Member Flexible Rate adds the
      member-rate valet bonus per night, one on the Corporate Negotiated Rate adds the corporate-rate valet
      bonus per night, and one on any other rate plan adds nothing. Booking-channel valet bonus: a
      reservation booked on the mobile app adds the app valet bonus per night, one booked on the brand
      website adds the website valet bonus per night, and one booked through any other channel adds
      nothing. Engagement valet bonus: a membership with seventy-five or more elite night credits in the
      current calendar year adds the seventy-five-night valet bonus per night, one with fifty to
      seventy-four adds the fifty-night valet bonus per night, and one with fewer adds nothing.
      Stay-length valet bonus: a reservation of seven or more nights adds the seven-night valet bonus per
      night, one of five or six nights adds the five-night valet bonus per night, and a shorter one adds
      nothing. The bonuses are added to the nightly valet saving first, and that per-night sum is then multiplied by
      the number of valet lines of the stay. The tier and the elite night credits are read from the
      membership credited for the stay, and the rate plan, the booking channel and the nights from the
      reservation behind the folio.
    prerequisite: []
    cross_category:
      - category: loyalty
        as: branch
        reads: [variant_name, elite_night_credits]
        note: The tier decides the valet saving method and the year's elite night credits the engagement valet bonus.
      - category: booking
        as: branch
        reads: [variant_name, booking_channel, nights]
        note: The rate plan decides the rate-plan valet bonus, the booking channel the booking-channel valet bonus and the nights the stay-length valet bonus.
    compute:
      - valet_lines: "COUNT('folio_postings', event_type='folio_incidental_charge', charge_code='parking_valet')"
      - member_tier: "CFIELD('loyalty','variant_name', loyalty_member_id=F('loyalty_member_id'))"
      - nightly_saving: "P('valet_parking_per_night_usd') - P('self_parking_per_night_usd') if member_tier == 'Ashbury Rewards Ambassador Elite' else ((P('valet_parking_per_night_usd') - P('self_parking_per_night_usd')) * K('titanium_upgrade_share') if member_tier == 'Ashbury Rewards Titanium Elite' else (P('valet_parking_per_night_usd') * K('platinum_valet_saving_pct') / 100 if member_tier == 'Ashbury Rewards Platinum Elite' else P('valet_parking_per_night_usd') * K('member_valet_saving_pct') / 100))"
      - rate_plan: "CFIELD('booking','variant_name', reservation_id=F('reservation_id'))"
      - plan_bonus: "K('member_rate_valet_bonus_usd') if rate_plan == 'Member Flexible Rate' else (K('corporate_rate_valet_bonus_usd') if rate_plan == 'Corporate Negotiated Rate' else 0)"
      - booking_channel: "CFIELD('booking','booking_channel', reservation_id=F('reservation_id'))"
      - channel_bonus: "K('app_valet_bonus_usd') if booking_channel == 'mobile_app' else (K('website_valet_bonus_usd') if booking_channel == 'brand_website' else 0)"
      - year_night_credits: "CFIELD('loyalty','elite_night_credits', loyalty_member_id=F('loyalty_member_id'))"
      - engagement_bonus: "K('seventy_five_night_valet_bonus_usd') if year_night_credits >= 75 else (K('fifty_night_valet_bonus_usd') if year_night_credits >= 50 else 0)"
      - stay_nights: "CFIELD('booking','nights', reservation_id=F('reservation_id'))"
      - stay_bonus: "K('seven_night_valet_bonus_usd') if stay_nights >= 7 else (K('five_night_valet_bonus_usd') if stay_nights >= 5 else 0)"
      - result: "RND((nightly_saving + plan_bonus + channel_bonus + engagement_bonus + stay_bonus) * valet_lines, 2)"
    compute_basis:
      valet_lines: "The valet savings of a stay are the nightly valet saving times the number of valet lines of the stay, rounded half up to the cent at the end."
      member_tier: "The tier and the elite night credits are read from the membership credited for the stay, and the rate plan, the booking channel and the nights from the reservation behind the folio."
      nightly_saving: "Valet saving method: for an Ashbury Rewards Ambassador Elite member the nightly valet saving is the full valet upgrade, the brand's valet rate less the brand's self-parking rate; for an Ashbury Rewards Titanium Elite member it is the valet upgrade times the Titanium upgrade share; for an Ashbury Rewards Platinum Elite member it is the Platinum valet saving percent of the brand's valet rate; for every other member it is the member valet saving percent of the brand's valet rate."
      rate_plan: "The tier and the elite night credits are read from the membership credited for the stay, and the rate plan, the booking channel and the nights from the reservation behind the folio."
      plan_bonus: "Rate-plan valet bonus: a reservation on the Member Flexible Rate adds the member-rate valet bonus per night, one on the Corporate Negotiated Rate adds the corporate-rate valet bonus per night, and one on any other rate plan adds nothing."
      booking_channel: "The tier and the elite night credits are read from the membership credited for the stay, and the rate plan, the booking channel and the nights from the reservation behind the folio."
      channel_bonus: "Booking-channel valet bonus: a reservation booked on the mobile app adds the app valet bonus per night, one booked on the brand website adds the website valet bonus per night, and one booked through any other channel adds nothing."
      year_night_credits: "The tier and the elite night credits are read from the membership credited for the stay, and the rate plan, the booking channel and the nights from the reservation behind the folio."
      engagement_bonus: "Engagement valet bonus: a membership with seventy-five or more elite night credits in the current calendar year adds the seventy-five-night valet bonus per night, one with fifty to seventy-four adds the fifty-night valet bonus per night, and one with fewer adds nothing."
      stay_nights: "The tier and the elite night credits are read from the membership credited for the stay, and the rate plan, the booking channel and the nights from the reservation behind the folio."
      stay_bonus: "Stay-length valet bonus: a reservation of seven or more nights adds the seven-night valet bonus per night, one of five or six nights adds the five-night valet bonus per night, and a shorter one adds nothing."
      result: "The bonuses are added to the nightly valet saving first, and that per-night sum is then multiplied by the number of valet lines of the stay."
    factors:
      - id: valet_saving_method
        effect: method
        decides: nightly_saving
        bindings: [member_tier, nightly_saving]
        ladder:
          - when: "the member holds Ashbury Rewards Ambassador Elite"
            method: "the full valet upgrade: the brand's valet rate less the brand's self-parking rate"
          - when: "the member holds Ashbury Rewards Titanium Elite"
            method: "the valet upgrade (valet rate less self-parking rate) times the Titanium upgrade share"
          - when: "the member holds Ashbury Rewards Platinum Elite"
            method: "the Platinum valet saving percent of the brand's valet rate"
          - when: "otherwise"
            method: "the member valet saving percent of the brand's valet rate"
        baseline:
          nightly_saving: "P('valet_parking_per_night_usd') * K('member_valet_saving_pct') / 100"
        evidence: [cross_category, tier_param]
        cross_difficulty: loyalty
      - id: rate_plan_valet_bonus
        effect: parameter
        decides: plan_bonus
        bindings: [rate_plan, plan_bonus]
        ladder:
          - when: "the reservation is on the Member Flexible Rate"
            value: "the member-rate valet bonus per night (K('member_rate_valet_bonus_usd'))"
          - when: "the reservation is on the Corporate Negotiated Rate"
            value: "the corporate-rate valet bonus per night (K('corporate_rate_valet_bonus_usd'))"
          - when: "otherwise"
            value: "nothing (0)"
        baseline:
          plan_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: booking_channel_valet_bonus
        effect: parameter
        decides: channel_bonus
        bindings: [booking_channel, channel_bonus]
        ladder:
          - when: "the reservation was booked on the mobile app"
            value: "the app valet bonus per night (K('app_valet_bonus_usd'))"
          - when: "the reservation was booked on the brand website"
            value: "the website valet bonus per night (K('website_valet_bonus_usd'))"
          - when: "otherwise"
            value: "nothing (0)"
        baseline:
          channel_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: engagement_valet_bonus
        effect: parameter
        decides: engagement_bonus
        bindings: [year_night_credits, engagement_bonus]
        ladder:
          - when: "the membership carries seventy-five or more elite night credits in the current calendar year"
            value: "the seventy-five-night valet bonus per night (K('seventy_five_night_valet_bonus_usd'))"
          - when: "the membership carries fifty to seventy-four elite night credits in the current calendar year"
            value: "the fifty-night valet bonus per night (K('fifty_night_valet_bonus_usd'))"
          - when: "otherwise"
            value: "nothing (0)"
        baseline:
          engagement_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: stay_length_valet_bonus
        effect: parameter
        decides: stay_bonus
        bindings: [stay_nights, stay_bonus]
        ladder:
          - when: "the reservation is for seven or more nights"
            value: "the seven-night valet bonus per night (K('seven_night_valet_bonus_usd'))"
          - when: "the reservation is for five or six nights"
            value: "the five-night valet bonus per night (K('five_night_valet_bonus_usd'))"
          - when: "otherwise"
            value: "nothing (0)"
        baseline:
          stay_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: booking
    baseline:
      rule: >-
        The valet savings of a stay are the nightly valet saving times the number of valet lines of the
        stay, rounded half up to the cent at the end. The nightly valet saving is the member valet saving
        percent of the brand's valet rate.
      params: [member_valet_saving_pct, valet_parking_per_night_usd]
    inputs:
      history:
        - {table: folio_postings, aggregate: count, field: posting_id, filters: {event_type: folio_incidental_charge, charge_code: parking_valet}}
      cross_category: [booking, loyalty]

  - id: folio_ext_weekly_parking_cap
    base_policy_refs: [folio_agg_courtesy_allowance, folio_evt_adjustment, folio_incidental_rules]
    overwrite:
      - base_policy: folio_incidental_rules
        superseded_clause: >-
          Parking is charged per night a vehicle is parked at self_parking_per_night_usd or, where valet_available is true, valet_parking_per_night_usd;
        replaced_by: >-
          A guest whose stay has at least the minimum nights parked may elect the weekly parking maximum for the stay, and makes the election personally; the nights parked are counted as the parking lines of the stay, one line for each night the guest's vehicle was parked.
    trigger: on_request
    subject: [folio_adjustment]
    computes: excess_amount
    target_tool: elect_weekly_parking_5ade5692
    params:
      minimum_nights_parked: 7
      week_nights: 7
      standard_chargeable_nights: 6
      titanium_chargeable_nights: 5.5
      ambassador_chargeable_nights: 5
      member_rate_maximum_discount_pct: 2
      corporate_rate_maximum_discount_pct: 1
    rule: >-
      A guest whose stay has at least the minimum nights parked may elect the weekly parking maximum for
      the stay, and makes the election personally; the nights parked are counted as the parking lines of
      the stay, one line for each night the guest's vehicle was parked. The weekly parking maximum of a
      stay is applied only after the self-parking lines of the stay carry the Ashbury Rewards parking
      savings they are owed. The weekly parking maximum of a stay is not worked out until the valet lines
      of the stay carry the Ashbury Rewards valet savings they are owed. The parking charged above the
      weekly parking maximum is taken off the parking line of the seventh night parked, with the reason
      that the stay's parking was charged above the applicable rate. The election covers the nights parked
      up to the moment it is made, and parking lines posted after it are charged as posted. The excess is
      the parking of the stay, every self-parking and valet line less the corrections those lines already
      carry, less the stay's parking maximum, never below zero and rounded half up to the cent at the end;
      a stay with fewer than the minimum nights parked has no excess. The weekly rate is the weekly basis
      rate times the chargeable nights per week. The stay's parking maximum is the weekly rate for each
      full week of nights parked plus the weekly basis rate for each remaining night parked, rounded half
      up to the cent. The weekly basis rate is the rate of the service parked on the most recent night
      parked, and the chargeable nights per week are the standard chargeable nights. When the most recent
      night parked carries both a self-parking and a valet line, the service of that night is valet.
      Weekly basis rate:
      for an Ashbury Rewards Titanium Elite or Ambassador Elite member the weekly basis rate is the brand's
      self-parking rate; for an Ashbury Rewards Platinum Elite member it is the rate of the service parked
      on more nights, the valet rate when the valet lines are at least as many as the self-parking lines
      and the self-parking rate otherwise; for every other guest it is the rate of the service parked on
      the most recent night parked. Chargeable nights per week: the Ambassador chargeable nights for an
      Ashbury Rewards Ambassador Elite member, the Titanium chargeable nights for an Ashbury Rewards
      Titanium Elite member, and the standard chargeable nights for every other guest. Maximum method: for
      an Ashbury Rewards Titanium Elite or Ambassador Elite member whose stay was booked through a direct
      channel — the brand website, the mobile app, the call centre or the hotel directly — the maximum is
      pro-rated, every night parked counted at one seventh of the weekly rate; for an Ashbury Rewards Gold
      Elite or Platinum Elite member whose stay was booked through a direct channel it is the weekly rate
      for each full week plus the remaining nights at the weekly basis rate, the remaining nights together
      never charged more than half the weekly rate; for every other guest, including one whose stay was booked
      through a travel agency or a group rooming list, it is the weekly rate for each full week plus the
      weekly basis rate for each remaining night. Rate-plan maximum discount: a reservation on the Member
      Flexible Rate lowers the stay's parking maximum by the member-rate maximum discount percent, one on
      the Corporate Negotiated Rate by the corporate-rate maximum discount percent, and one on any other
      rate plan not at all; the discount acts on the maximum the method gives and before it is rounded. The
      tier is read from the membership credited for the stay, and the rate plan and the booking channel
      from the reservation behind the folio.
    prerequisite:
      - problem: folio_ext_self_parking_savings
        kind: value_input
        gate: self_corrections
        form: state
        policy_source: >-
          The weekly parking maximum of a stay is applied only after the self-parking lines of the stay carry the Ashbury Rewards parking savings they are owed.
        condition: >-
          The most recent self-parking line of the stay is named by an adjustment line with reason
          elite_benefit_not_applied carrying the stay's self-parking savings.
        resolved_by: correct_self_parking_29958fbc
        effect: >-
          The self-parking savings correction enters the corrections the self-parking lines carry, lowering
          the parking of the stay that the weekly parking maximum is compared with.
      - problem: folio_ext_valet_parking_savings
        kind: value_input
        gate: valet_corrections
        form: state
        policy_source: >-
          The weekly parking maximum of a stay is not worked out until the valet lines of the stay carry the Ashbury Rewards valet savings they are owed.
        condition: >-
          The most recent valet line of the stay is named by an adjustment line with reason
          elite_benefit_not_applied carrying the stay's valet savings.
        resolved_by: correct_valet_parking_0a0ec721
        effect: >-
          The valet savings correction enters the corrections the valet lines carry, lowering the parking of
          the stay that the weekly parking maximum is compared with.
    cross_category:
      - category: loyalty
        as: branch
        reads: [variant_name]
        note: The tier decides the weekly basis rate, the chargeable nights per week and, with the booking channel, the maximum method.
      - category: booking
        as: branch
        reads: [variant_name, booking_channel]
        note: The booking channel, with the tier, decides the maximum method, and the rate plan the rate-plan maximum discount.
    compute:
      - self_lines: "COUNT('folio_postings', event_type='folio_incidental_charge', charge_code='parking_self')"
      - valet_lines: "COUNT('folio_postings', event_type='folio_incidental_charge', charge_code='parking_valet')"
      - parked_lines: "self_lines + valet_lines"
      - parking_charged: "SUM('folio_postings','amount', event_type='folio_incidental_charge', charge_code='parking_self') + SUM('folio_postings','amount', event_type='folio_incidental_charge', charge_code='parking_valet')"
      - self_corrections: "SUM('folio_postings','amount', event_type='folio_adjustment', charge_code='parking_self')"
      - valet_corrections: "SUM('folio_postings','amount', event_type='folio_adjustment', charge_code='parking_valet')"
      - latest_self_day: "LATEST('folio_postings','business_date', date_field='business_date', event_type='folio_incidental_charge', charge_code='parking_self')"
      - latest_valet_day: "LATEST('folio_postings','business_date', date_field='business_date', event_type='folio_incidental_charge', charge_code='parking_valet')"
      - recent_service_rate: "P('valet_parking_per_night_usd') if (valet_lines > 0 and (self_lines == 0 or latest_valet_day >= latest_self_day)) else P('self_parking_per_night_usd')"
      - member_tier: "CFIELD('loyalty','variant_name', loyalty_member_id=F('loyalty_member_id'))"
      - basis_rate: "P('self_parking_per_night_usd') if (member_tier == 'Ashbury Rewards Titanium Elite' or member_tier == 'Ashbury Rewards Ambassador Elite') else ((P('valet_parking_per_night_usd') if valet_lines >= self_lines else P('self_parking_per_night_usd')) if member_tier == 'Ashbury Rewards Platinum Elite' else recent_service_rate)"
      - chargeable_nights: "K('ambassador_chargeable_nights') if CFIELD('loyalty','variant_name', loyalty_member_id=F('loyalty_member_id')) == 'Ashbury Rewards Ambassador Elite' else (K('titanium_chargeable_nights') if CFIELD('loyalty','variant_name', loyalty_member_id=F('loyalty_member_id')) == 'Ashbury Rewards Titanium Elite' else K('standard_chargeable_nights'))"
      - weekly_rate: "basis_rate * chargeable_nights"
      - full_weeks: "int(parked_lines / K('week_nights'))"
      - remaining_nights: "parked_lines - full_weeks * K('week_nights')"
      - booking_channel: "CFIELD('booking','booking_channel', reservation_id=F('reservation_id'))"
      - direct_booking: "booking_channel == 'brand_website' or booking_channel == 'mobile_app' or booking_channel == 'call_center' or booking_channel == 'property_direct'"
      - method_maximum: "weekly_rate / K('week_nights') * parked_lines if ((member_tier == 'Ashbury Rewards Titanium Elite' or member_tier == 'Ashbury Rewards Ambassador Elite') and direct_booking) else (weekly_rate * full_weeks + MN(basis_rate * remaining_nights, weekly_rate / 2) if ((member_tier == 'Ashbury Rewards Gold Elite' or member_tier == 'Ashbury Rewards Platinum Elite') and direct_booking) else weekly_rate * full_weeks + basis_rate * remaining_nights)"
      - rate_plan: "CFIELD('booking','variant_name', reservation_id=F('reservation_id'))"
      - maximum_discount_pct: "K('member_rate_maximum_discount_pct') if rate_plan == 'Member Flexible Rate' else (K('corporate_rate_maximum_discount_pct') if rate_plan == 'Corporate Negotiated Rate' else 0)"
      - stay_maximum: "RND(method_maximum * (1 - maximum_discount_pct / 100), 2)"
      - result: "RND(MX(0, parking_charged - self_corrections - valet_corrections - stay_maximum), 2) if parked_lines >= K('minimum_nights_parked') else 0"
    compute_basis:
      self_lines: "A guest whose stay has at least the minimum nights parked may elect the weekly parking maximum for the stay, and makes the election personally; the nights parked are counted as the parking lines of the stay, one line for each night the guest's vehicle was parked."
