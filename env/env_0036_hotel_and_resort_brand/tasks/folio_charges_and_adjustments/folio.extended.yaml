        ladder:
          - when: "the member holds Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite"
            value: "the brand's self-parking rate (P('self_parking_per_night_usd'))"
          - when: "the member holds Ashbury Rewards Platinum Elite"
            value: "the rate of the service parked on more nights (valet when the valet lines are at least as many as the self-parking lines)"
          - when: "otherwise"
            value: "the rate of the service parked on the most recent night parked"
        baseline:
          basis_rate: "recent_service_rate"
        evidence: [cross_category, history, tier_param]
        cross_difficulty: loyalty
      - id: chargeable_nights_per_week
        effect: parameter
        decides: chargeable_nights
        bindings: [chargeable_nights]
        ladder:
          - when: "the member holds Ashbury Rewards Ambassador Elite"
            value: "the Ambassador chargeable nights (K('ambassador_chargeable_nights'))"
          - when: "the member holds Ashbury Rewards Titanium Elite"
            value: "the Titanium chargeable nights (K('titanium_chargeable_nights'))"
          - when: "otherwise"
            value: "the standard chargeable nights (K('standard_chargeable_nights'))"
        baseline:
          chargeable_nights: "K('standard_chargeable_nights')"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: maximum_method
        effect: method
        decides: method_maximum
        bindings: [booking_channel, direct_booking, method_maximum]
        ladder:
          - when: "the member holds Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite and the stay was booked through a direct channel"
            method: "pro-rated: every night parked counted at one seventh of the weekly rate"
          - when: "the member holds Ashbury Rewards Gold Elite or Ashbury Rewards Platinum Elite and the stay was booked through a direct channel"
            method: "full weeks at the weekly rate plus the remaining nights at the weekly basis rate, the remaining nights together capped at half the weekly rate"
          - when: "otherwise"
            method: "full weeks at the weekly rate plus remaining nights at the weekly basis rate"
        baseline:
          method_maximum: "weekly_rate * full_weeks + basis_rate * remaining_nights"
        evidence: [cross_category, history]
        cross_difficulty: booking
      - id: rate_plan_maximum_discount
        effect: parameter
        decides: maximum_discount_pct
        bindings: [rate_plan, maximum_discount_pct]
        ladder:
          - when: "the reservation is on the Member Flexible Rate"
            value: "the member-rate maximum discount percent (K('member_rate_maximum_discount_pct'))"
          - when: "the reservation is on the Corporate Negotiated Rate"
            value: "the corporate-rate maximum discount percent (K('corporate_rate_maximum_discount_pct'))"
          - when: "otherwise"
            value: "no discount (0)"
        baseline:
          maximum_discount_pct: "0"
        evidence: [cross_category]
        cross_difficulty: booking
    baseline:
      rule: >-
        The excess is the parking of the stay, every self-parking and valet line less the corrections those
        lines already carry, less the stay's parking maximum, never below zero and rounded half up to the
        cent at the end; a stay with fewer than the minimum nights parked has no excess. The weekly rate is
        the weekly basis rate times the chargeable nights per week. The stay's parking maximum is the weekly
        rate for each full week of nights parked plus the weekly basis rate for each remaining night parked,
        rounded half up to the cent. The weekly basis rate is the rate of the service parked on the most
        recent night parked, and the chargeable nights per week are the standard chargeable nights. When
        the most recent night parked carries both a self-parking and a valet line, the service of that
        night is valet.
      params: [self_parking_per_night_usd, valet_parking_per_night_usd, standard_chargeable_nights, week_nights, minimum_nights_parked]
    inputs:
      history:
        - {table: folio_postings, aggregate: count, field: posting_id, filters: {event_type: folio_incidental_charge, charge_code: parking_self}}
        - {table: folio_postings, aggregate: count, field: posting_id, filters: {event_type: folio_incidental_charge, charge_code: parking_valet}}
        - {table: folio_postings, aggregate: latest, field: business_date, filters: {event_type: folio_incidental_charge}}
        - {table: folio_postings, aggregate: sum, field: amount, filters: {event_type: folio_incidental_charge}}
        - {table: folio_postings, aggregate: sum, field: amount, filters: {event_type: folio_adjustment}}
      cross_category: [booking, loyalty]
