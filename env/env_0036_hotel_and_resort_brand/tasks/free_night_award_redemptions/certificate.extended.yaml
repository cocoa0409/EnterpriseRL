# Free Night Awards charter of Ashbury Hotels & Resorts.
# One holding = one Free Night Award: one standard-room night up to the award's points cap.
category: certificate
display_name: Free Night Awards

binding:
  holding_table: free_night_certificates
  event_tables: [certificate_activity]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [issued, applied, redeemed, expired, forfeited]
  transitions:
    - {from: issued, to: applied, by: agent, means: "At the member's request the award is applied to one night of a Reward Night Rate reservation."}
    - {from: applied, to: issued, by: agent, means: "The award is released back to the member's account because its reservation was cancelled in time or relocated."}
    - {from: applied, to: redeemed, by: system, means: "The guest checks in and the award is used up."}
    - {from: applied, to: forfeited, by: system, means: "The award is lost because the reservation it covers was cancelled late or became a no-show."}
    - {from: issued, to: expired, by: system, means: "The award reaches its expiry date unused."}
    - {from: issued, to: forfeited, by: system, means: "The member's Ashbury Rewards account is closed and the unused award is lost."}

accounts: []

parameter_schema:
  cap_points_per_night: "Highest standard-room points price of a night the award covers without top-off (integer points; 0 for an uncapped award)."
  uncapped: "Whether the award covers a standard room at any eligible hotel whatever its points price (boolean)."
  top_off_allowed: "Whether points from the member's account may be added to cover a night priced above the cap (boolean)."
  top_off_max_points: "Most points that may be added to one award (integer points)."
  validity_months: "Calendar months from the issue date to the expiry date (integer months)."
  expiry_day_rule: "How the expiry date is found (enum: same_day_number_or_month_end)."
  nights_per_award: "Nights one award pays (integer nights)."
  max_awards_per_reservation: "Most awards that may be applied to one reservation (integer)."
  eligible_room_types: "Room types the award may pay (list of room types)."
  max_adults: "Most adults in the room on an award night (integer)."
  allowed_award_seasons: "Award seasons in which the award may be used (list of seasons)."
  excluded_brands: "Hotel brands where the award may not be used (list of brand names)."
  issue_source: "How the award type is issued (enum of free_night_certificates.issue_source)."
  milestone_nights: "Elite night credits in one calendar year that issue the award as a milestone (integer nights; 0 when not a milestone award)."
  cobrand_card_required: "Co-brand card whose account anniversary issues the award (enum of loyalty_memberships.cobrand_card; none when not a card award)."
  issue_within_days: "Calendar days after the qualifying anniversary or milestone within which the award is deposited (integer days)."
  transferable_to_other_member: "Whether the award may be moved to another member's account (boolean)."
  guest_name_other_than_member_allowed: "Whether the award night may be booked for a guest other than the member, on the member's reservation (boolean)."
  combinable_with_points_nights: "Whether the award may sit on a reservation whose other nights are paid with points (boolean)."
  combinable_with_cash_nights: "Whether the award may sit on a reservation with nights paid in cash (boolean)."
  combinable_with_other_awards: "Whether several awards may be used on one reservation (boolean)."
  earns_points_on_room: "Whether the award night earns points (boolean)."
  earns_points_on_incidentals: "Whether eligible incidentals charged during an award stay earn points (boolean)."
  counts_elite_night: "Whether the award night counts as an elite night credit (boolean)."
  elite_benefits_honored: "Whether elite on-property benefits apply on the award night (boolean)."
  resort_fee_charged: "Whether a resort fee is charged on the award night (boolean)."
  reinstate_on_timely_cancel: "Whether the award returns to the account when its reservation is cancelled on or before the deadline (boolean)."
  reinstate_requires_unexpired: "Whether a returned award whose expiry date has passed expires instead of becoming usable again (boolean)."
  forfeit_on_late_cancel: "Whether the award covering the first night is lost when the reservation is cancelled after the deadline (boolean)."
  forfeit_on_no_show: "Whether the award covering the first night is lost when the reservation becomes a no-show (boolean)."
  top_off_refund_on_release: "Whether top-off points come back when the award is released (boolean)."
  member_must_be_active: "Whether the award can be applied only while the membership is active (boolean)."
  forfeit_on_membership_closure: "Whether unused awards are lost when the membership is closed (boolean)."
  extension_allowed: "Whether the expiry date can be extended (boolean)."
  reissue_on_relocation_after_expiry: "Whether an award released after its expiry date because the hotel relocated the reservation is reissued (boolean)."
  reissue_validity_months: "Calendar months a reissued award is valid from its reissue date (integer months)."
  max_reissues_per_award: "Times an award may be reissued (integer)."
  cash_value_usd: "Cash value of the award (USD)."
  resale_prohibited: "Whether selling or bartering the award voids it (boolean)."
  booking_channels: "Channels through which an award night can be booked (list of booking channels)."
  min_advance_booking_days: "Minimum calendar days between applying the award and the award night (integer days)."
  group_bookings_eligible: "Whether the award may be used inside a group block (boolean)."
  applied_to_earliest_nights: "Whether awards are always applied to the earliest nights of the reservation (boolean)."
  top_off_points_from_holder_only: "Whether top-off points must come from the award holder's own account (boolean)."
  award_night_price_basis: "Which price the cap is compared with (enum: standard_room_points_price)."
  peak_season_usable: "Whether the award may be used on peak-season nights within its cap (boolean)."
  one_award_per_night: "Whether a night can be paid by only one award (boolean)."
  closure_keeps_applied_awards: "Whether awards already applied to a future reservation survive the closure of the membership (boolean)."

