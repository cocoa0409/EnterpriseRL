  - id: certificate_ext_relocation_return_protection
    base_policy_refs: [certificate_release_and_expiry, certificate_evt_activity_records, certificate_reissue]
    overwrite:
      - base_policy: certificate_evt_activity_records
        superseded_clause: >-
          A hold record carries the standard-room points price of the night and the top-off points, and
          the later release, use or loss records repeat the points price recorded on the hold.
        replaced_by: >-
          The return record of an award coming back from a reservation the hotel relocated states the
          walked-night protected price, worked out as this rule sets out, rather than repeating the price
          recorded on the hold.
      - base_policy: certificate_release_and_expiry
        superseded_clause: >-
          A released award whose expiry date has already passed therefore expires on the day it is
          released when reinstate_requires_unexpired is true; it is never reinstated for a new stay.
        replaced_by: >-
          An award that comes back from a relocated stay after its expiry date has passed stands returned
          in the member's account, usable for no stay, so that its replacement can be deposited against it;
          the system's own expiry run then closes it as expired, and it is never reinstated for a new stay.
    trigger: state_due
    subject: [certificate_release, certificate_release_record]
    computes: award_points_price
