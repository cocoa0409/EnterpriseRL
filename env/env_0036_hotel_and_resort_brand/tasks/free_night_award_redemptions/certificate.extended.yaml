  - id: certificate_ext_relocation_replacement_validity
    base_policy_refs: [certificate_reissue, certificate_issuance, certificate_agg_multi_holding, certificate_release_and_expiry]
    overwrite:
      - base_policy: certificate_reissue
        superseded_clause: >-
          The replacement is of the same type, carries issue_source reissue_replacement and the replaced
          award's certificate_id, and runs reissue_validity_months calendar months from the reissue date,
          on the same day number or the last day of that month.
        replaced_by: >-
          A replacement is of the same type as the award it replaces, carries the reason that it replaces
          an earlier award and that award's reference, and its expiry date is worked out as this rule sets
          out.
      - base_policy: certificate_issuance
        superseded_clause: >-
          The expiry date is validity_months calendar months after the issue date, on the same day number,
          or on the last day of that month when it has no such day; a reissued award runs
          reissue_validity_months from its reissue date instead.
        replaced_by: >-
          A replacement is of the same type as the award it replaces, carries the reason that it replaces
          an earlier award and that award's reference, and its expiry date is worked out as this rule sets
          out.
    trigger: state_due
    subject: [certificate_issue]
    computes: expiry_date
    target_tool: reissue_replacement_award_0d99e6ce
    params:
      tier_nights_upper: 50
      tier_nights_lower: 25
      tier_months_upper: 3
      tier_months_lower: 1
      delay_months_upper: 3
      delay_extra_upper: 2
      delay_extra_lower: 1
      tenure_months_upper: 180
      tenure_months_lower: 120
      tenure_extra_upper: 2
      tenure_extra_lower: 1
      stay_nights_upper: 40
      stay_nights_lower: 20
      stays_extra_upper: 2
      stays_extra_lower: 1
      walked_nights_upper: 3
      walked_nights_lower: 2
      walked_extra_upper: 2
      walked_extra_lower: 1
      convention_nights: 50
    rule: >-
      When an award comes back from a reservation the hotel relocated after the award's expiry date had
      passed, a replacement is deposited. A replacement is of the same type as the award it replaces,
      carries the reason that it replaces an earlier award and that award's reference, and its expiry
      date is worked out as this rule sets out. A replacement's expiry date is set only after the award it
      replaces stands back in the member's account with its return from the relocated stay entered in its
      history. A replacement's expiry date falls the replacement validity months of its award type after
      the reissue date, on the same day number, or on the last day of that month when it has no such day.
      The member's standing, the delay of the return, tenure, recent stay nights, the length of the walked
      stay and the co-brand card change that date as follows; every extra month below is added to the
      replacement validity months before the date is worked out. The tier extra is the upper tier extra
      for a Titanium Elite or Ambassador Elite member whose elite night credits this year are at least the
      upper tier night threshold, the lower tier extra for a Gold Elite or Platinum Elite member whose
      elite night credits this year are at least the lower tier night threshold, and nothing for every
      other member. The delay extra counts whole calendar months from the date the hotel relocated the
      reservation to the date of the award's return from it:
      at least the upper delay months earn the upper delay extra, at least one month the lower delay
      extra, and less nothing. The tenure extra counts whole calendar months from the enrolment date to the
      reissue date: at least the upper tenure months earn the upper tenure extra, at least the lower
      tenure months the lower tenure extra, and fewer nothing. The stays extra adds up the nights of the
      stay night credits posted to the membership in the twelve calendar months before the reissue, card
      anniversary night credits not counted: at least the upper stay nights earn the upper stays extra, at
      least the lower stay nights the lower stays extra, and fewer nothing. The walked-stay extra reads the
      nights booked on the relocated reservation: at least the upper walked-stay nights earn the upper
      walked-stay extra, at least the lower walked-stay nights the lower walked-stay extra, and a shorter
      stay nothing. The expiry-day convention depends on the co-brand card: when the membership's linked
      card is the Ashbury Rewards Premier Card and its elite night credits this year are at least the
      convention night threshold, the expiry date is the last day of the month after the month reached;
      when the linked card is the Ashbury Rewards Premier Card and its elite night credits this year are
      below that threshold, the expiry date is the last day of the month reached; otherwise the expiry
      date keeps the same day number, or the last day of the month reached when it has no such day. The
      month reached is the calendar month that lies the total months after the month of the reissue date.
    prerequisite:
      - problem: certificate_ext_relocation_return_protection
        kind: value_input
        gate: rq_return_date
        form: state
        policy_source: >-
          A replacement's expiry date is set only after the award it replaces stands back in the member's
          account with its return from the relocated stay entered in its history.
        condition: >-
          The replaced award stands returned in the member's account and its history carries a return record
          with the reason that its reservation was relocated.
        resolved_by: release_relocated_award_8143384d
        effect: >-
          The return record from the relocated stay gives the return date that the delay extra counts from
          the relocation date, so the replacement's months and expiry date are set from it.
    cross_category:
      - category: loyalty
        as: history
        reads: [variant_name, elite_night_credits, enrolled_date, cobrand_card, loyalty_transactions.event_type, loyalty_transactions.earning_source, loyalty_transactions.posted_date]
        note: tier with this year's elite nights, enrolment date, linked card and the last twelve months' stay credits decide the tier, tenure, stays and expiry-day factors.
      - category: booking
        as: branch
        reads: [relocated_date, nights]
        note: the relocated reservation's relocation date anchors the delay extra and its booked nights decide the walked-stay extra.
    compute:
      - rq_tier: "CFIELD('loyalty','variant_name')"
      - rq_nights: "CFIELD('loyalty','elite_night_credits')"
      - rq_tier_months: "K('tier_months_upper') if (rq_tier == 'Ashbury Rewards Titanium Elite' or rq_tier == 'Ashbury Rewards Ambassador Elite') and rq_nights >= K('tier_nights_upper') else (K('tier_months_lower') if (rq_tier == 'Ashbury Rewards Gold Elite' or rq_tier == 'Ashbury Rewards Platinum Elite') and rq_nights >= K('tier_nights_lower') else 0)"
      - rq_reloc_returns: "COUNT('certificate_activity', event_type='certificate_release_record', activity_reason='reservation_relocated')"
      - rq_return_date: "LATEST('certificate_activity','activity_date', date_field='activity_date', event_type='certificate_release_record', activity_reason='reservation_relocated') if rq_reloc_returns >= 1 else None"
      - rq_delay: "MONTHS(CFIELD('booking','relocated_date', reservation_id=F('reservation_id')), rq_return_date)"
      - rq_delay_months: "K('delay_extra_upper') if rq_delay >= K('delay_months_upper') else (K('delay_extra_lower') if rq_delay >= 1 else 0)"
      - rq_tenure: "MONTHS(CFIELD('loyalty','enrolled_date'), NOW)"
      - rq_tenure_months: "K('tenure_extra_upper') if rq_tenure >= K('tenure_months_upper') else (K('tenure_extra_lower') if rq_tenure >= K('tenure_months_lower') else 0)"
      - rq_stays: "XSUM('loyalty','loyalty_transactions','nights', within_months=12, date_field='posted_date', event_type='loyalty_night_credit', earning_source='stay_nights')"
      - rq_stays_months: "K('stays_extra_upper') if rq_stays >= K('stay_nights_upper') else (K('stays_extra_lower') if rq_stays >= K('stay_nights_lower') else 0)"
      - rq_walked: "CFIELD('booking','nights', reservation_id=F('reservation_id'))"
      - rq_walked_months: "K('walked_extra_upper') if rq_walked >= K('walked_nights_upper') else (K('walked_extra_lower') if rq_walked >= K('walked_nights_lower') else 0)"
      - rq_card: "CFIELD('loyalty','cobrand_card')"
      - rq_convention: "2 if rq_card == 'ashbury_rewards_premier_card' and rq_nights >= K('convention_nights') else (1 if rq_card == 'ashbury_rewards_premier_card' and rq_nights < K('convention_nights') else 0)"
      - rq_months: "P('reissue_validity_months') + rq_tier_months + rq_delay_months + rq_tenure_months + rq_stays_months + rq_walked_months"
      - rq_anchor_index: "MONTHS('2000-01-01', NOW)"
      - rq_anchor_day: "DAYS('%04d' % (2000 + rq_anchor_index // 12) + '-' + '%02d' % (rq_anchor_index % 12 + 1) + '-01', NOW) + 1"
      - rq_target_index: "rq_anchor_index + rq_months + (1 if rq_convention == 2 else 0)"
      - rq_target_first: "'%04d' % (2000 + rq_target_index // 12) + '-' + '%02d' % (rq_target_index % 12 + 1) + '-01'"
      - rq_target_next: "'%04d' % (2000 + (rq_target_index + 1) // 12) + '-' + '%02d' % ((rq_target_index + 1) % 12 + 1) + '-01'"
      - rq_target_days: "DAYS(rq_target_first, rq_target_next)"
      - rq_day: "rq_target_days if rq_convention >= 1 else MN(rq_anchor_day, rq_target_days)"
      - result: "'%04d' % (2000 + rq_target_index // 12) + '-' + '%02d' % (rq_target_index % 12 + 1) + '-' + '%02d' % rq_day"
    compute_basis:
      rq_tier: "The tier extra is the upper tier extra for a Titanium Elite or Ambassador Elite member whose elite night credits this year are at least the upper tier night threshold, the lower tier extra for a Gold Elite or Platinum Elite member whose elite night credits this year are at least the lower tier night threshold, and nothing for every other member."
      rq_nights: "The tier extra is the upper tier extra for a Titanium Elite or Ambassador Elite member whose elite night credits this year are at least the upper tier night threshold, the lower tier extra for a Gold Elite or Platinum Elite member whose elite night credits this year are at least the lower tier night threshold, and nothing for every other member."
      rq_tier_months: "The tier extra is the upper tier extra for a Titanium Elite or Ambassador Elite member whose elite night credits this year are at least the upper tier night threshold, the lower tier extra for a Gold Elite or Platinum Elite member whose elite night credits this year are at least the lower tier night threshold, and nothing for every other member."
      rq_reloc_returns: "A replacement's expiry date is set only after the award it replaces stands back in the member's account with its return from the relocated stay entered in its history."
      rq_return_date: "The delay extra counts whole calendar months from the date the hotel relocated the reservation to the date of the award's return from it"
      rq_delay: "The delay extra counts whole calendar months from the date the hotel relocated the reservation to the date of the award's return from it"
      rq_delay_months: "at least the upper delay months earn the upper delay extra, at least one month the lower delay extra, and less nothing."
      rq_tenure: "The tenure extra counts whole calendar months from the enrolment date to the reissue date"
      rq_tenure_months: "at least the upper tenure months earn the upper tenure extra, at least the lower tenure months the lower tenure extra, and fewer nothing."
      rq_stays: "The stays extra adds up the nights of the stay night credits posted to the membership in the twelve calendar months before the reissue, card anniversary night credits not counted"
      rq_stays_months: "at least the upper stay nights earn the upper stays extra, at least the lower stay nights the lower stays extra, and fewer nothing."
      rq_walked: "The walked-stay extra reads the nights booked on the relocated reservation"
      rq_walked_months: "at least the upper walked-stay nights earn the upper walked-stay extra, at least the lower walked-stay nights the lower walked-stay extra, and a shorter stay nothing."
      rq_card: "The expiry-day convention depends on the co-brand card"
      rq_convention: "when the membership's linked card is the Ashbury Rewards Premier Card and its elite night credits this year are at least the convention night threshold, the expiry date is the last day of the month after the month reached; when the linked card is the Ashbury Rewards Premier Card and its elite night credits this year are below that threshold, the expiry date is the last day of the month reached; otherwise the expiry date keeps the same day number, or the last day of the month reached when it has no such day."
      rq_months: "every extra month below is added to the replacement validity months before the date is worked out."
      rq_anchor_index: "The month reached is the calendar month that lies the total months after the month of the reissue date."
      rq_anchor_day: "A replacement's expiry date falls the replacement validity months of its award type after the reissue date, on the same day number, or on the last day of that month when it has no such day."
      rq_target_index: "The month reached is the calendar month that lies the total months after the month of the reissue date."
      rq_target_days: "A replacement's expiry date falls the replacement validity months of its award type after the reissue date, on the same day number, or on the last day of that month when it has no such day."
      rq_day: "A replacement's expiry date falls the replacement validity months of its award type after the reissue date, on the same day number, or on the last day of that month when it has no such day."
      result: "A replacement's expiry date falls the replacement validity months of its award type after the reissue date, on the same day number, or on the last day of that month when it has no such day."
    factors:
      - id: replacement_tier_extra
        effect: parameter
        decides: rq_tier_months
        bindings: [rq_tier, rq_nights, rq_tier_months]
        ladder:
          - when: "the member holds Titanium Elite or Ambassador Elite AND this year's elite night credits are at least the upper tier night threshold"
            value: "K('tier_months_upper')"
          - when: "the member holds Gold Elite or Platinum Elite AND this year's elite night credits are at least the lower tier night threshold"
            value: "K('tier_months_lower')"
          - when: "otherwise"
            value: "no tier extra"
        baseline:
          rq_tier_months: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: replacement_delay_extra
        effect: parameter
        decides: rq_delay_months
        bindings: [rq_return_date, rq_delay, rq_delay_months]
        ladder:
          - when: "at least the upper delay months passed between the relocation and the award's return from the relocated stay"
            value: "K('delay_extra_upper')"
          - when: "at least one, but fewer than the upper, delay months passed"
            value: "K('delay_extra_lower')"
          - when: "otherwise"
            value: "no delay extra"
        baseline:
          rq_delay_months: "0"
        evidence: [history, cross_category, date]
        cross_difficulty: booking
      - id: replacement_tenure_extra
        effect: parameter
        decides: rq_tenure_months
        bindings: [rq_tenure, rq_tenure_months]
        ladder:
          - when: "the member enrolled at least the upper tenure months before the reissue"
            value: "K('tenure_extra_upper')"
          - when: "the member enrolled at least the lower tenure months before the reissue"
            value: "K('tenure_extra_lower')"
          - when: "otherwise"
            value: "no tenure extra"
        baseline:
          rq_tenure_months: "0"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: replacement_stays_extra
        effect: parameter
        decides: rq_stays_months
        bindings: [rq_stays, rq_stays_months]
        ladder:
          - when: "the stay night credits of the last twelve months add up to at least the upper stay nights"
            value: "K('stays_extra_upper')"
          - when: "they add up to at least the lower stay nights but fewer than the upper"
            value: "K('stays_extra_lower')"
          - when: "otherwise"
            value: "no stays extra"
        baseline:
          rq_stays_months: "0"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: replacement_walked_stay_extra
        effect: parameter
        decides: rq_walked_months
        bindings: [rq_walked, rq_walked_months]
        ladder:
          - when: "the relocated reservation was booked for at least the upper walked-stay nights"
            value: "K('walked_extra_upper')"
          - when: "it was booked for at least the lower walked-stay nights but fewer than the upper"
            value: "K('walked_extra_lower')"
          - when: "otherwise"
            value: "no walked-stay extra"
        baseline:
          rq_walked_months: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: replacement_expiry_day
        effect: method
        decides: rq_convention
        bindings: [rq_card, rq_convention]
        ladder:
          - when: "the linked card is the Ashbury Rewards Premier Card AND this year's elite night credits are at least the convention night threshold"
            method: "the expiry date is the last day of the month after the month reached"
          - when: "the linked card is the Ashbury Rewards Premier Card AND this year's elite night credits are below the convention night threshold"
            method: "the expiry date is the last day of the month reached"
          - when: "otherwise"
            method: "the expiry date keeps the reissue date's day number, or the month's last day when it has no such day"
        baseline:
          rq_convention: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        A replacement's expiry date falls the replacement validity months of its award type after the
        reissue date, on the same day number, or on the last day of that month when it has no such day.
      params: [reissue_validity_months]
    inputs:
      history:
        - {table: certificate_activity, aggregate: latest, field: activity_date, filters: {event_type: certificate_release_record, activity_reason: reservation_relocated}}
        - {table: certificate_activity, aggregate: count, field: activity_id, filters: {event_type: certificate_release_record, activity_reason: reservation_relocated}}
        - {category: loyalty, table: loyalty_transactions, aggregate: sum, field: nights, within_months: 12, filters: {event_type: loyalty_night_credit, earning_source: stay_nights}}
      cross_category: [booking, loyalty]
  - id: certificate_ext_replacement_hold_price
    base_policy_refs: [certificate_redemption_eligibility, certificate_agg_awards_per_reservation, certificate_evt_activity_records, certificate_reissue]
    overwrite:
      - base_policy: certificate_redemption_eligibility
        superseded_clause: >-
          The night's price is the standard-room points price of the Ashbury Rewards award chart for the
          reservation's award_category and award_season, and it is recorded on the hold.
        replaced_by: >-
          When a member applies a replacement award, the night's price recorded on its hold, and compared
          with its points cap, is the replacement's night price worked out as this rule sets out.
    trigger: on_request
    subject: [certificate_apply, certificate_hold_record]
    computes: award_points_price
    target_tool: apply_replacement_award_003026b1
    params:
      chart_std_cat1: 7500
      chart_std_cat2: 12500
      chart_std_cat3: 17500
      chart_std_cat4: 25000
      chart_std_cat5: 35000
      chart_std_cat6: 45000
      chart_std_cat7: 60000
      chart_std_cat8: 85000
      season_step_cat1_3: 2500
      season_step_cat4_6: 5000
      season_step_cat7: 10000
      season_step_cat8: 15000
      repl_nights_upper: 75
      repl_nights_lower: 50
      repl_nights_reduction_upper: 3000
      repl_nights_reduction_lower: 1500
      repl_points_nights_upper: 2
      repl_points_reduction_upper: 2000
      repl_points_reduction_lower: 1000
      repl_tier_reduction_upper: 3000
      repl_tier_reduction_lower: 1500
    rule: >-
      When a member applies a replacement award to a night of a Reward Night Rate reservation, its hold
      records the replacement's night price. These terms price the first hold of a replacement award; a
      replacement that later comes back from a cancelled stay is rebooked as any returned award is. When a
      member applies a replacement award, the night's price recorded on its hold, and compared with its
      points cap, is the replacement's night price worked out as this rule sets out. A replacement award's
      hold is not placed until the replacement stands issued in the member's account carrying the
      reference of the award it replaces. The award chart's standard-season prices by category are those
      of the Ashbury Rewards award chart. The replacement's night price is the standard-season price of
      the award chart for the award category recorded on the reservation it pays, in whole points. The
      season, walk protection, this year's elite nights, points nights on the same reservation and the
      member's tier change that price as follows. A category's season step is the gap between its
      neighbouring seasons on that chart. The season recorded on the reservation moves the replacement's
      night price: a peak night costs one season step more than the standard-season price, an off-peak
      night one season step less, and a standard night the standard-season price itself. Walk protection
      reads the history of the award the replacement replaces: the walked-night discount is the price on
      that award's latest hold, the one for its walked night, less the walked-night protected price on its
      latest return, the one from the relocated stay, never below zero. As the standard, half the
      walked-night discount, rounded down to a whole point, is taken off the night's price. Where the
      replacement is used decides how much of the walked night stays protected: when the reservation it
      pays is at the very hotel that relocated the stay, the night is priced at the walked-night protected
      price itself, whatever its season; when it is at another hotel of the same brand as the relocated
      stay, the whole walked-night discount is taken off the night's price; otherwise, at a hotel of
      another brand, the standard half discount is taken off. The elite-night reduction is the
      upper replacement night reduction when this year's elite night credits are at least the upper
      replacement night threshold, the lower replacement night reduction when they are at least the lower
      replacement night threshold, and nothing otherwise. The points-night reduction counts the
      reservation's nights not paid with Free Night Awards: at least the upper points-night count earns the
      upper replacement points reduction, exactly one such night the lower replacement points reduction,
      and none nothing. The tier reduction is the upper replacement tier reduction for a Titanium Elite or
      Ambassador Elite member, the lower replacement tier reduction for a Gold Elite or Platinum Elite
      member, and nothing for every other member. The replacement's night price recorded is the price after
      walk protection less the elite-night, points-night and tier reductions, each applied once, in whole
      points and never below zero.
    prerequisite:
      - problem: certificate_ext_relocation_replacement_validity
        kind: state_gate
        gate: free_night_certificates.replaced_certificate_id
        form: state
        policy_source: >-
          A replacement award's hold is not placed until the replacement stands issued in the member's
          account carrying the reference of the award it replaces.
        condition: >-
          An award with status issued and issue source reissue_replacement exists in the membership whose
          replaced award reference is the award that came back from the relocated stay.
        resolved_by: reissue_replacement_award_0d99e6ce
        effect: >-
          The replacement exists in the member's account and can be placed on the night; without it there is
          no award to hold.
    cross_category:
      - category: booking
        as: branch
        reads: [award_category, award_season, property_code, property_brand, nights, certificate_nights]
        note: the new reservation's category, season, hotel, brand and nights and the relocated stay's hotel and brand decide the season, walk-protection and points-night factors.
      - category: loyalty
        as: branch
        reads: [elite_night_credits, variant_name]
        note: this year's elite night credits and the membership tier decide the elite-night and tier reductions.
    compute:
      - aq_cat: "CFIELD('booking','award_category', status='confirmed', variant_name='Reward Night Rate')"
      - aq_std: "K('chart_std_cat1') if aq_cat == 1 else (K('chart_std_cat2') if aq_cat == 2 else (K('chart_std_cat3') if aq_cat == 3 else (K('chart_std_cat4') if aq_cat == 4 else (K('chart_std_cat5') if aq_cat == 5 else (K('chart_std_cat6') if aq_cat == 6 else (K('chart_std_cat7') if aq_cat == 7 else K('chart_std_cat8')))))))"
      - aq_step: "K('season_step_cat1_3') if aq_cat <= 3 else (K('season_step_cat4_6') if aq_cat <= 6 else (K('season_step_cat7') if aq_cat == 7 else K('season_step_cat8')))"
      - aq_season: "CFIELD('booking','award_season', status='confirmed', variant_name='Reward Night Rate')"
      - aq_season_adj: "aq_step if aq_season == 'peak' else (0 - aq_step if aq_season == 'off_peak' else 0)"
      - aq_night: "aq_std + aq_season_adj"
      - aq_walk_hold: "LATEST('certificate_activity','award_points_price', date_field='activity_date', event_type='certificate_hold_record')"
      - aq_walk_returns: "COUNT('certificate_activity', event_type='certificate_release_record', activity_reason='reservation_relocated')"
      - aq_walk_protected: "LATEST('certificate_activity','award_points_price', date_field='activity_date', event_type='certificate_release_record') if aq_walk_returns >= 1 else None"
      - aq_walk_discount: "MX(0, aq_walk_hold - aq_walk_protected)"
      - aq_same_hotel: "CFIELD('booking','property_code', reservation_id=F('reservation_id')) == CFIELD('booking','property_code', status='confirmed', variant_name='Reward Night Rate')"
      - aq_same_brand: "CFIELD('booking','property_brand', reservation_id=F('reservation_id')) == CFIELD('booking','property_brand', status='confirmed', variant_name='Reward Night Rate')"
      - aq_protected: "aq_walk_protected if aq_same_hotel else (aq_night - aq_walk_discount if aq_same_brand else aq_night - aq_walk_discount // 2)"
      - aq_nights: "CFIELD('loyalty','elite_night_credits')"
      - aq_nights_red: "K('repl_nights_reduction_upper') if aq_nights >= K('repl_nights_upper') else (K('repl_nights_reduction_lower') if aq_nights >= K('repl_nights_lower') else 0)"
      - aq_points_nights: "CFIELD('booking','nights', status='confirmed', variant_name='Reward Night Rate') - CFIELD('booking','certificate_nights', status='confirmed', variant_name='Reward Night Rate')"
      - aq_points_red: "K('repl_points_reduction_upper') if aq_points_nights >= K('repl_points_nights_upper') else (K('repl_points_reduction_lower') if aq_points_nights >= 1 else 0)"
      - aq_tier: "CFIELD('loyalty','variant_name')"
      - aq_tier_red: "K('repl_tier_reduction_upper') if aq_tier == 'Ashbury Rewards Titanium Elite' or aq_tier == 'Ashbury Rewards Ambassador Elite' else (K('repl_tier_reduction_lower') if aq_tier == 'Ashbury Rewards Gold Elite' or aq_tier == 'Ashbury Rewards Platinum Elite' else 0)"
      - result: "int(MX(0, aq_protected - aq_nights_red - aq_points_red - aq_tier_red))"
    compute_basis:
      aq_cat: "The replacement's night price is the standard-season price of the award chart for the award category recorded on the reservation it pays, in whole points."
      aq_std: "The award chart's standard-season prices by category are those of the Ashbury Rewards award chart."
      aq_step: "A category's season step is the gap between its neighbouring seasons on that chart."
      aq_season: "The season recorded on the reservation moves the replacement's night price: a peak night costs one season step more than the standard-season price, an off-peak night one season step less, and a standard night the standard-season price itself."
      aq_season_adj: "The season recorded on the reservation moves the replacement's night price: a peak night costs one season step more than the standard-season price, an off-peak night one season step less, and a standard night the standard-season price itself."
      aq_walk_hold: "the walked-night discount is the price on that award's latest hold, the one for its walked night, less the walked-night protected price on its latest return, the one from the relocated stay, never below zero."
      aq_walk_protected: "the walked-night discount is the price on that award's latest hold, the one for its walked night, less the walked-night protected price on its latest return, the one from the relocated stay, never below zero."
      aq_walk_returns: "Walk protection reads the history of the award the replacement replaces: the walked-night discount is the price on that award's latest hold, the one for its walked night, less the walked-night protected price on its latest return, the one from the relocated stay, never below zero."
      aq_walk_discount: "Walk protection reads the history of the award the replacement replaces: the walked-night discount is the price on that award's latest hold, the one for its walked night, less the walked-night protected price on its latest return, the one from the relocated stay, never below zero."
      aq_same_hotel: "when the reservation it pays is at the very hotel that relocated the stay, the night is priced at the walked-night protected price itself, whatever its season"
      aq_same_brand: "when it is at another hotel of the same brand as the relocated stay, the whole walked-night discount is taken off the night's price"
      aq_protected: "Where the replacement is used decides how much of the walked night stays protected: when the reservation it pays is at the very hotel that relocated the stay, the night is priced at the walked-night protected price itself, whatever its season; when it is at another hotel of the same brand as the relocated stay, the whole walked-night discount is taken off the night's price; otherwise, at a hotel of another brand, the standard half discount is taken off."
      aq_nights: "The elite-night reduction is the upper replacement night reduction when this year's elite night credits are at least the upper replacement night threshold, the lower replacement night reduction when they are at least the lower replacement night threshold, and nothing otherwise."
      aq_nights_red: "The elite-night reduction is the upper replacement night reduction when this year's elite night credits are at least the upper replacement night threshold, the lower replacement night reduction when they are at least the lower replacement night threshold, and nothing otherwise."
      aq_points_nights: "The points-night reduction counts the reservation's nights not paid with Free Night Awards"
      aq_points_red: "at least the upper points-night count earns the upper replacement points reduction, exactly one such night the lower replacement points reduction, and none nothing."
      aq_tier: "The tier reduction is the upper replacement tier reduction for a Titanium Elite or Ambassador Elite member, the lower replacement tier reduction for a Gold Elite or Platinum Elite member, and nothing for every other member."
      aq_tier_red: "The tier reduction is the upper replacement tier reduction for a Titanium Elite or Ambassador Elite member, the lower replacement tier reduction for a Gold Elite or Platinum Elite member, and nothing for every other member."
      result: "The replacement's night price recorded is the price after walk protection less the elite-night, points-night and tier reductions, each applied once, in whole points and never below zero."
    factors:
      - id: replacement_night_season
        effect: parameter
        decides: aq_season_adj
        bindings: [aq_season, aq_season_adj]
        ladder:
          - when: "the reservation records the season as peak"
            value: "one season step added to the standard-season price"
          - when: "the reservation records the season as off-peak"
            value: "one season step taken off the standard-season price"
          - when: "otherwise (standard season)"
            value: "no change"
        baseline:
          aq_season_adj: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: replacement_walk_protection
        effect: method
        decides: aq_protected
        bindings: [aq_same_hotel, aq_same_brand, aq_protected]
        ladder:
          - when: "the reservation the replacement pays is at the very hotel that relocated the stay"
            method: "price the night at the walked-night protected price itself, whatever its season"
          - when: "it is at another hotel of the same brand as the relocated stay"
            method: "take the whole walked-night discount off the night's price"
          - when: "otherwise (a hotel of another brand)"
            method: "take the standard half of the walked-night discount, rounded down, off the night's price"
        baseline:
          aq_protected: "aq_night - aq_walk_discount // 2"
        evidence: [history, cross_category]
        cross_difficulty: booking
      - id: replacement_elite_nights
        effect: parameter
        decides: aq_nights_red
        bindings: [aq_nights, aq_nights_red]
        ladder:
          - when: "this year's elite night credits are at least the upper replacement night threshold"
            value: "K('repl_nights_reduction_upper')"
          - when: "they are at least the lower replacement night threshold"
            value: "K('repl_nights_reduction_lower')"
          - when: "otherwise"
            value: "no elite-night reduction"
        baseline:
          aq_nights_red: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: replacement_points_nights
        effect: parameter
        decides: aq_points_red
        bindings: [aq_points_nights, aq_points_red]
        ladder:
          - when: "the reservation pays at least the upper points-night count of nights other than with Free Night Awards"
            value: "K('repl_points_reduction_upper')"
          - when: "it pays exactly one such night"
            value: "K('repl_points_reduction_lower')"
          - when: "otherwise"
            value: "no points-night reduction"
        baseline:
          aq_points_red: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: replacement_member_tier
        effect: parameter
        decides: aq_tier_red
        bindings: [aq_tier, aq_tier_red]
        ladder:
          - when: "the member holds Titanium Elite or Ambassador Elite"
            value: "K('repl_tier_reduction_upper')"
          - when: "the member holds Gold Elite or Platinum Elite"
            value: "K('repl_tier_reduction_lower')"
          - when: "otherwise"
            value: "no tier reduction"
        baseline:
          aq_tier_red: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The award chart's standard-season prices by category are those of the Ashbury Rewards award chart.
        The replacement's night price is the standard-season price of the award chart for the award
        category recorded on the reservation it pays, in whole points. Walk protection reads the history
        of the award the replacement replaces: the walked-night discount is the price on that award's
        latest hold, the one for its walked night, less the walked-night protected price on its latest
        return, the one from the relocated stay, never below zero. As the standard, half the walked-night
        discount, rounded down to a whole point, is taken off the night's price.
      params: [chart_std_cat1, chart_std_cat2, chart_std_cat3, chart_std_cat4, chart_std_cat5, chart_std_cat6, chart_std_cat7, chart_std_cat8]
    inputs:
      history:
        - {table: certificate_activity, aggregate: latest, field: award_points_price, filters: {event_type: certificate_hold_record}}
        - {table: certificate_activity, aggregate: latest, field: award_points_price, filters: {event_type: certificate_release_record, activity_reason: reservation_relocated}}
        - {table: certificate_activity, aggregate: count, field: activity_id, filters: {event_type: certificate_release_record, activity_reason: reservation_relocated}}
      cross_category: [booking, loyalty]
