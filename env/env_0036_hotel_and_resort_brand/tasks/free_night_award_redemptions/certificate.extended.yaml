events:
  - type: certificate_issue
    target: free_night_certificates
    mutation: create
    meaning: "A Free Night Award is deposited into a member's account, or reissued to replace an award."
    grain: "One row per transaction."
    fields:
      certificate_id: "reference number of the new award"
      customer_id: "member"
      loyalty_member_id: "membership holding the award"
      variant_name: "award type"
      certificate_number: "award number"
      issue_source: "reason the award was issued"
      issued_date: "date deposited"
      expiry_date: "last date a covered night may fall on"
      replaced_certificate_id: "award being replaced, for reissues"
      top_off_points: "0 at issue"
    triggers: []

  - type: certificate_apply
    target: free_night_certificates
    mutation: {transition: {from: issued, to: applied}}
    meaning: "The award is applied to one night of a Reward Night Rate reservation."
    grain: "One row per transaction."
    fields:
      certificate_id: "award applied"
      reservation_id: "reservation the award pays"
      night_date: "night the award pays"
      top_off_points: "points added because the night is priced above the cap"
      loyalty_member_id: "membership holding the award (read, not changed)"
      customer_id: "member (read, not changed)"
    triggers:
      - event: certificate:certificate_hold_record
        map: {certificate_id: certificate_id, customer_id: customer_id, reservation_id: reservation_id, night_date: night_date, top_off_points: top_off_points, activity_reason: applied_to_reservation}
      - event: loyalty:loyalty_points_redeem
        when: {top_off_points: {not: 0}}
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, reservation_id: reservation_id, certificate_id: certificate_id, points: top_off_points, earning_source: certificate_top_off}

  - type: certificate_release
    target: free_night_certificates
    mutation: {transition: {from: applied, to: issued}}
    meaning: "The award returns to the member's account because its reservation was cancelled in time or relocated by the hotel."
    grain: "One row per transaction."
    fields:
      certificate_id: "award released"
      reservation_id: "reservation released from (read, kept as history)"
      night_date: "night released (read, kept as history)"
      top_off_points: "top-off points of the released night (read, kept as history)"
      loyalty_member_id: "membership holding the award (read, not changed)"
      customer_id: "member (read, not changed)"
    triggers:
      - event: certificate:certificate_release_record
        map: {certificate_id: certificate_id, customer_id: customer_id, reservation_id: reservation_id, night_date: night_date, top_off_points: top_off_points}
      - event: loyalty:loyalty_points_redeposit
        when: {top_off_points: {not: 0}}
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, reservation_id: reservation_id, certificate_id: certificate_id, points: top_off_points, earning_source: top_off_redeposit}

  - type: certificate_redeem
    target: free_night_certificates
    mutation: {transition: {from: applied, to: redeemed}}
    meaning: "The guest checks in and the award is used up."
    grain: "One row per transaction."
    fields:
      certificate_id: "award used"
      closed_date: "check-in date"
      reservation_id: "reservation checked in (read, not changed)"
      night_date: "night paid (read, not changed)"
      customer_id: "member (read, not changed)"
    triggers:
      - event: certificate:certificate_consume_record
        map: {certificate_id: certificate_id, customer_id: customer_id, reservation_id: reservation_id, night_date: night_date, activity_date: closed_date, activity_reason: stay_completed}

  - type: certificate_forfeit
    target: free_night_certificates
    mutation: {transition: [{from: applied, to: forfeited}, {from: issued, to: forfeited}]}
    meaning: "The award is lost: its first-night reservation was cancelled late or became a no-show, or the membership holding an unused award was closed."
    grain: "One row per transaction."
    fields:
      certificate_id: "award lost"
      closed_date: "date lost"
      loyalty_member_id: "membership holding the award (read, not changed)"
      reservation_id: "reservation concerned when the award was applied (read, not changed)"
      night_date: "night concerned when the award was applied (read, not changed)"
      customer_id: "member (read, not changed)"
    triggers:
      - event: certificate:certificate_forfeit_record
        map: {certificate_id: certificate_id, customer_id: customer_id, reservation_id: reservation_id, night_date: night_date, activity_date: closed_date}

  - type: certificate_expire
    target: free_night_certificates
    mutation: {transition: {from: issued, to: expired}}
    meaning: "An unused award passes its expiry date."
    grain: "One row per transaction."
    fields:
      certificate_id: "award expired"
      closed_date: "day after the expiry date"
    triggers: []

  - type: certificate_hold_record
    target: certificate_activity
    meaning: "History record of an award placed on hold for one reservation night."
    grain: "One record per award per reservation night per hold."
    distinguish_by: [reservation_id, night_date, activity_date]
    fields:
      certificate_id: "award"
      customer_id: "member"
      reservation_id: "reservation"
      night_date: "night held"
      award_points_price: "standard-room points price of the night under the award chart"
      top_off_points: "top-off points added"
      activity_date: "date applied"
      activity_reason: "applied_to_reservation"
    triggers: []

  - type: certificate_release_record
    target: certificate_activity
    meaning: "History record of an award released from a reservation night."
    grain: "One record per release."
    distinguish_by: [reservation_id, night_date, activity_date]
    fields:
      certificate_id: "award"
      customer_id: "member"
      reservation_id: "reservation released from"
      night_date: "night released"
      award_points_price: "points price recorded when the award was placed on hold"
      top_off_points: "top-off points returned"
      activity_date: "date released"
      activity_reason: "cancelled_before_deadline or reservation_relocated"
    triggers: []

  - type: certificate_consume_record
    target: certificate_activity
    meaning: "History record of an award used on a completed check-in."
    grain: "One record per award used."
    distinguish_by: [reservation_id, night_date]
    fields:
      certificate_id: "award"
      customer_id: "member"
      reservation_id: "reservation checked in"
      night_date: "night paid"
      award_points_price: "points price recorded when the award was placed on hold"
      top_off_points: "top-off points used"
      activity_date: "check-in date"
      activity_reason: "stay_completed"
    triggers: []

  - type: certificate_forfeit_record
    target: certificate_activity
    meaning: "History record of an award lost."
    grain: "One record per award lost."
    distinguish_by: [activity_reason]
    fields:
      certificate_id: "award"
      customer_id: "member"
      reservation_id: "reservation concerned, empty for a closure"
      night_date: "night concerned, empty for a closure"
      award_points_price: "points price recorded when the award was placed on hold; 0 for a closure"
      top_off_points: "top-off points lost with the award"
      activity_date: "date lost"
      activity_reason: "cancelled_after_deadline, no_show or membership_closed"
    triggers: []

measures:
  - id: certificate_msr_awards_on_reservation
    window: "The reservation's current state at the moment of handling."
    measure: "Count of free_night_certificates rows with the reservation's reservation_id and status applied."
  - id: certificate_msr_reissues_of_award
    window: "The whole history of the award."
    measure: "Count of free_night_certificates rows whose replaced_certificate_id is the award's certificate_id."

policies:
  - id: certificate_agg_multi_holding
    subject: [certificate_issue]
    rule: >-
      A member may hold any number of Free Night Awards of any types at the same time; each award is a
      separate record with its own number, expiry date and status, and is applied, released, used,
      expired or forfeited on its own. Awards always belong to the membership they were issued to and
      cannot be pooled with, or moved to, another member's account when transferable_to_other_member is
      false.
    eligibility: []
    params:
      max_per_customer: null

  - id: certificate_agg_awards_per_reservation
    subject: [certificate_apply]
    rule: >-
      Awards held by one member are combined on a reservation one night each. A reservation carries
      at most max_awards_per_reservation awards, counted with certificate_msr_awards_on_reservation
      before the award being applied, and when one_award_per_night is true a night is paid by one award
      only. When applied_to_earliest_nights is true awards pay the earliest nights of the reservation
      and points pay the nights after them, so an award is applied only to the earliest night of the
      reservation not yet paid by an award. A reservation with more nights than awards pays the
      remaining nights with points when combinable_with_points_nights is true; nights paid in cash
      never share a reservation with awards when combinable_with_cash_nights is false. Awards of
      different types may be combined on one reservation when combinable_with_other_awards is true.
    eligibility:
      - id: reservation_award_cap
        applies_to: [certificate_apply]
        kind: authorization
        condition: "A reservation carries at most max_awards_per_reservation awards, counted with certificate_msr_awards_on_reservation before the award being applied, and when one_award_per_night is true a night is paid by one award only."
        evidence_fields: [free_night_certificates.reservation_id, free_night_certificates.status, free_night_certificates.night_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [free_night_certificates.reservation_id]
          action_bindings:
            free_night_certificates.reservation_id: reservation_id
    measures: [certificate_msr_awards_on_reservation]
    formula:
      within_cap: "certificate_msr_awards_on_reservation + 1 <= max_awards_per_reservation"

  - id: certificate_issuance
    subject: [certificate_issue]
    rule: >-
      Each award type is issued only for its issue_source. A cobrand_anniversary award is deposited
      once per card account anniversary to a member whose linked co-brand card on the anniversary is
      the type's cobrand_card_required. An elite_milestone award is deposited once per calendar year on
      the day the member's elite night credits for the year first reach the type's milestone_nights. A
      promotion award is deposited once per completed registered promotion. Awards are deposited within
      issue_within_days calendar days of the qualifying anniversary, milestone or promotion. The expiry
      date is validity_months calendar months after the issue date, on the same day number, or on the
      last day of that month when it has no such day; a reissued award runs reissue_validity_months
      from its reissue date instead. An award is issued only to a membership whose status is active.
      An award is issued at most once for each qualifying occasion. Expiry dates are never extended
      when extension_allowed is false, and an award has no cash value and may not be sold.
    eligibility:
      - id: member_active
        applies_to: [certificate_issue]
        kind: state
        condition: "An award is issued only to a membership whose status is active."
        evidence_fields: [loyalty_memberships.status, free_night_certificates.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [free_night_certificates.loyalty_member_id]
          action_bindings:
            free_night_certificates.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
      - id: once_per_occasion
        applies_to: [certificate_issue]
        kind: dedup
        condition: "An award is issued at most once for each qualifying occasion."
        evidence_fields: [free_night_certificates.loyalty_member_id, free_night_certificates.issue_source, free_night_certificates.variant_name, free_night_certificates.issued_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [free_night_certificates.loyalty_member_id, free_night_certificates.issue_source]
          action_bindings:
            free_night_certificates.loyalty_member_id: loyalty_member_id
            free_night_certificates.issue_source: issue_source
        dedup_contract:
          table: free_night_certificates
          mode: separate_record
          object_bindings: {loyalty_member_id: loyalty_member_id, issue_source: issue_source, variant_name: variant_name}
          duplicate_filters: {status: [issued, applied, redeemed, expired, forfeited]}
          distinct_fields: [issued_date]
    params:
      per_tier:
        "25K Free Night Award": {source: "=issue_source", validity: "=validity_months", milestone: "=milestone_nights", card: "=cobrand_card_required"}
        "35K Free Night Award": {source: "=issue_source", validity: "=validity_months", milestone: "=milestone_nights", card: "=cobrand_card_required"}
        "40K Free Night Award": {source: "=issue_source", validity: "=validity_months", milestone: "=milestone_nights", card: "=cobrand_card_required"}
        "50K Free Night Award": {source: "=issue_source", validity: "=validity_months", milestone: "=milestone_nights", card: "=cobrand_card_required"}
        "85K Free Night Award": {source: "=issue_source", validity: "=validity_months", milestone: "=milestone_nights", card: "=cobrand_card_required"}
        "Any Hotel Free Night Award": {source: "=issue_source", validity: "=validity_months", milestone: "=milestone_nights", card: "=cobrand_card_required"}

  - id: certificate_redemption_eligibility
    subject: [certificate_apply]
    rule: >-
      An award is applied only at the request of the member holding it, to a night of a Reward Night
      Rate reservation whose status is confirmed and whose loyalty_member_id is the award's
      membership; the night may be booked for another guest's name when
      guest_name_other_than_member_allowed is true. The award must be issued, and the membership must
      be active when member_must_be_active is true. The night covered must fall on or before the
      award's expiry date. The reservation's room_type must be one of eligible_room_types, its adults
      may not exceed max_adults, its award_season must be one of allowed_award_seasons, its
      property_brand may not be in excluded_brands, its booking_channel must be one of
      booking_channels, and it may not name a group block when group_bookings_eligible is false. The
      night's price is the standard-room points price of the Ashbury Rewards award chart for the
      reservation's award_category and award_season, and it is recorded on the hold. An uncapped award
      covers any price. A capped award covers the night when the price does not exceed
      cap_points_per_night; when it does and top_off_allowed is true, the difference is added as
      top-off points from the holder's own account, provided the difference does not exceed
      top_off_max_points and the member's points_balance covers it; otherwise the award cannot pay
      that night. The award is applied at least min_advance_booking_days before the night.
    eligibility:
      - id: reservation_owner_and_state
        applies_to: [certificate_apply]
        kind: authorization
        condition: "An award is applied only at the request of the member holding it, to a night of a Reward Night Rate reservation whose status is confirmed and whose loyalty_member_id is the award's membership; the night may be booked for another guest's name when guest_name_other_than_member_allowed is true."
        evidence_fields: [booking_reservations.status, booking_reservations.variant_name, booking_reservations.loyalty_member_id, free_night_certificates.loyalty_member_id, free_night_certificates.certificate_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [free_night_certificates.certificate_id]
          action_bindings:
            free_night_certificates.certificate_id: certificate_id
      - id: member_active
        applies_to: [certificate_apply]
        kind: state
        condition: "The award must be issued, and the membership must be active when member_must_be_active is true."
        evidence_fields: [loyalty_memberships.status, free_night_certificates.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [free_night_certificates.loyalty_member_id]
          action_bindings:
            free_night_certificates.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
      - id: night_within_validity
        applies_to: [certificate_apply]
        kind: authorization
        condition: "The night covered must fall on or before the award's expiry date."
        evidence_fields: [free_night_certificates.expiry_date, free_night_certificates.certificate_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [free_night_certificates.certificate_id]
          action_bindings:
            free_night_certificates.certificate_id: certificate_id
    params:
      per_tier:
        "25K Free Night Award": {cap: "=cap_points_per_night", uncapped: "=uncapped", top_off_max: "=top_off_max_points", excluded: "=excluded_brands"}
        "35K Free Night Award": {cap: "=cap_points_per_night", uncapped: "=uncapped", top_off_max: "=top_off_max_points", excluded: "=excluded_brands"}
        "40K Free Night Award": {cap: "=cap_points_per_night", uncapped: "=uncapped", top_off_max: "=top_off_max_points", excluded: "=excluded_brands"}
        "50K Free Night Award": {cap: "=cap_points_per_night", uncapped: "=uncapped", top_off_max: "=top_off_max_points", excluded: "=excluded_brands"}
        "85K Free Night Award": {cap: "=cap_points_per_night", uncapped: "=uncapped", top_off_max: "=top_off_max_points", excluded: "=excluded_brands"}
        "Any Hotel Free Night Award": {cap: "=cap_points_per_night", uncapped: "=uncapped", top_off_max: "=top_off_max_points", excluded: "=excluded_brands"}
    formula:
      top_off_points: "0 if uncapped else max(award_points_price - cap_points_per_night, 0)"
      usable: "uncapped or (award_points_price <= cap_points_per_night) or (top_off_allowed and award_points_price - cap_points_per_night <= top_off_max_points)"

  - id: certificate_release_and_expiry
    subject: [certificate_release, certificate_expire]
    rule: >-
      An applied award is released back to the account when its reservation is cancelled with
      cancellation_timing before_deadline and reinstate_on_timely_cancel is true, or when the hotel
      relocates the reservation; on a late cancellation or no-show, awards on nights after the first
      night are released too. An award is released only from a reservation whose status is cancelled,
      no_show or relocated. Top-off points come back with the award when top_off_refund_on_release is
      true. A released award keeps its original expiry date. An award expires only after its expiry
      date has passed. The award expires at the end of its expiry date: it is still usable for a night
      on the expiry date, and it becomes expired on the following calendar day. A released award whose
      expiry date has already passed therefore expires on the day it is released when
      reinstate_requires_unexpired is true; it is never reinstated for a new stay. Only when the
      release was caused by a relocation and reissue_on_relocation_after_expiry is true is a
      replacement of the same type issued under certificate_reissue.
    eligibility:
      - id: reservation_released_state
        applies_to: [certificate_release]
        kind: state
        condition: "An award is released only from a reservation whose status is cancelled, no_show or relocated."
        evidence_fields: [booking_reservations.status, free_night_certificates.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [free_night_certificates.reservation_id]
          action_bindings:
            free_night_certificates.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [cancelled, no_show, relocated]
      - id: past_expiry
        applies_to: [certificate_expire]
        kind: time
        condition: "An award expires only after its expiry date has passed."
        evidence_fields: [free_night_certificates.expiry_date, free_night_certificates.certificate_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [free_night_certificates.certificate_id]
          action_bindings:
            free_night_certificates.certificate_id: certificate_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "its expiry date"
          anchor_source: free_night_certificates.expiry_date
          relation: not_before
          duration_source: params.expiry_grace_days
          unit: calendar_days
          counting_rule: "The award expires at the end of its expiry date: it is still usable for a night on the expiry date, and it becomes expired on the following calendar day."
          boundary: inclusive
    params:
      expiry_grace_days: 1

  - id: certificate_forfeiture
    subject: [certificate_forfeit]
    rule: >-
      An applied award is forfeited only when it pays the first night of a reservation that was
      cancelled with cancellation_timing after_deadline and forfeit_on_late_cancel is true, or that
      became a no-show and forfeit_on_no_show is true; awards on later nights of that reservation are
      released instead. Top-off points added to a forfeited award are lost with it. When the membership
      is closed and forfeit_on_membership_closure is true, every award whose status is issued is
      forfeited; awards already applied to a future reservation stay applied when
      closure_keeps_applied_awards is true. An award is forfeited at most once, and a forfeited award
      is never reissued.
    eligibility:
      - id: first_night_award
        applies_to: [certificate_forfeit]
        kind: authorization
        condition: "An applied award is forfeited only when it pays the first night of a reservation that was cancelled with cancellation_timing after_deadline and forfeit_on_late_cancel is true, or that became a no-show and forfeit_on_no_show is true; awards on later nights of that reservation are released instead."
        evidence_fields: [booking_reservations.cancellation_timing, booking_reservations.status, booking_reservations.arrival_date, free_night_certificates.night_date, free_night_certificates.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [free_night_certificates.reservation_id]
          action_bindings:
            free_night_certificates.reservation_id: reservation_id

  - id: certificate_redemption_at_check_in
    subject: [certificate_redeem]
    rule: >-
      An applied award is used up when the guest checks in on its reservation, whatever the number of
      nights later stayed; an early departure does not return an award for a night not stayed. An
      award is redeemed only on a reservation whose status is in_house. The award night earns no points
      when earns_points_on_room is false, earns points on eligible incidentals when
      earns_points_on_incidentals is true, counts as an elite night credit when counts_elite_night is
      true, keeps elite benefits when elite_benefits_honored is true, and carries no resort fee when
      resort_fee_charged is false.
    eligibility:
      - id: checked_in
        applies_to: [certificate_redeem]
        kind: state
        condition: "An award is redeemed only on a reservation whose status is in_house."
        evidence_fields: [booking_reservations.status, free_night_certificates.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [free_night_certificates.reservation_id]
          action_bindings:
            free_night_certificates.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [in_house]

  - id: certificate_reissue
    subject: [certificate_issue]
    rule: >-
      A replacement award is reissued only when an award was released because the hotel relocated its
      reservation and the award's expiry date had passed by the release date, and
      reissue_on_relocation_after_expiry is true. The replacement is of the same type, carries
      issue_source reissue_replacement and the replaced award's certificate_id, and runs
      reissue_validity_months calendar months from the reissue date, on the same day number or the
      last day of that month. An award is reissued at most max_reissues_per_award times, counted with
      certificate_msr_reissues_of_award. Awards that expired unused, awards released after a
      cancellation by the guest and forfeited awards are never reissued, and guest services issues no
      award outside this rule.
    eligibility:
      - id: reissue_cap
        applies_to: [certificate_issue]
        kind: dedup
        condition: "An award is reissued at most max_reissues_per_award times, counted with certificate_msr_reissues_of_award."
        evidence_fields: [free_night_certificates.replaced_certificate_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [free_night_certificates.replaced_certificate_id]
          action_bindings:
            free_night_certificates.replaced_certificate_id: replaced_certificate_id
        dedup_contract:
          table: free_night_certificates
          mode: separate_record
          object_bindings: {replaced_certificate_id: replaced_certificate_id}
          duplicate_filters: {issue_source: [reissue_replacement]}
          distinct_fields: []
      - id: relocation_after_expiry
        applies_to: [certificate_issue]
        kind: authorization
        condition: "A replacement award is reissued only when an award was released because the hotel relocated its reservation and the award's expiry date had passed by the release date, and reissue_on_relocation_after_expiry is true."
        evidence_fields: [certificate_activity.activity_reason, certificate_activity.activity_date, free_night_certificates.expiry_date, certificate_activity.certificate_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [certificate_activity.certificate_id]
          action_bindings:
            certificate_activity.certificate_id: replaced_certificate_id
    measures: [certificate_msr_reissues_of_award]

  - id: certificate_evt_activity_records
    subject: [certificate_hold_record, certificate_release_record, certificate_consume_record, certificate_forfeit_record]
    rule: >-
      Every application, release, use and loss of an award leaves one history record naming the
      award, the reservation and the night, so that the award's past holds remain visible after it is
      released and reapplied. A hold record carries the standard-room points price of the night and the
      top-off points, and the later release, use or loss records repeat the points price recorded on
      the hold. A release record carries cancelled_before_deadline or reservation_relocated, a loss
      record cancelled_after_deadline, no_show or membership_closed, and a use record stay_completed.
      A history record is written only together with the award change it records.
    eligibility:
      - id: with_award_change
        applies_to: [certificate_hold_record, certificate_release_record, certificate_consume_record, certificate_forfeit_record]
        kind: authorization
        condition: "A history record is written only together with the award change it records."
        evidence_fields: [free_night_certificates.status, free_night_certificates.certificate_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [free_night_certificates.certificate_id]
          action_bindings:
            free_night_certificates.certificate_id: certificate_id

# ============================================================================
# extended_policies — Ashbury Award Price Protection & Replacement terms
# (a version update of the Free Night Awards charter; every departure from a
# base clause is declared in that policy's overwrite)
# ============================================================================
extended_policies:
  - id: certificate_ext_late_cancel_loss_value
    base_policy_refs: [certificate_forfeiture, certificate_evt_activity_records, certificate_redemption_eligibility]
    overwrite:
      - base_policy: certificate_evt_activity_records
        superseded_clause: >-
          A hold record carries the standard-room points price of the night and the top-off points, and
          the later release, use or loss records repeat the points price recorded on the hold.
        replaced_by: >-
          The loss record of an award forfeited on a reservation cancelled after its deadline states the
          stay's protected value, worked out as this rule sets out, rather than repeating the price
          recorded on the hold.
    trigger: state_due
    subject: [certificate_forfeit, certificate_forfeit_record]
    computes: award_points_price
    target_tool: forfeit_late_cancel_award_5a86721d
    params:
      chart_std_cat1: 7500
      chart_std_cat2: 12500
      chart_std_cat3: 17500
      chart_std_cat4: 25000
      chart_std_cat5: 35000
      chart_std_cat6: 45000
      chart_std_cat7: 60000
      chart_std_cat8: 85000
      season_step_cat1_3: 2500
      season_step_cat4_6: 5000
      season_step_cat7: 10000
      season_step_cat8: 15000
      stay_length_nights_upper: 3
      stay_length_nights_lower: 2
      stay_length_reduction_upper: 2000
      stay_length_reduction_lower: 1000
      stay_credit_nights_upper: 40
      stay_credit_nights_lower: 20
      stay_credit_reduction_upper: 2000
      stay_credit_reduction_lower: 1000
    rule: >-
      When a reservation is cancelled after its deadline, the award that pays its first night is
      forfeited, and its loss record states the stay's protected value: the points value at which the
      late-cancelled stay stays protected for the member, set from what the forfeited award itself
      carried for that night, apart from any top-off points the member had added, which are lost with
      the award and recorded on the loss entry as its top-off. The loss record of an award forfeited on
      a reservation cancelled after its deadline states the stay's protected value, worked out as this
      rule sets out, rather than repeating the price recorded on the hold. The award chart's
      standard-season prices by category are those of the Ashbury Rewards award chart. The stay's
      protected value is the standard-season price of the award chart for the award category recorded
      on the cancelled reservation, in whole points. The season, the award's share, the length of the
      cancelled stay and the member's recent stay nights change that value as follows. The season
      recorded on the cancelled reservation prices the forfeited night: a peak night costs one season
      step more than the standard-season price, an off-peak night one season step less, and a standard
      night the standard-season price itself; a category's season step is the gap between its
      neighbouring seasons on the award chart. The award's share of the forfeited night depends on the
      award: an uncapped award's share is the whole night price; a capped award for which top-off
      points were deducted for the cancelled reservation has a share of the night price less the
      top-off counted; a capped award with no top-off deducted for that reservation has a share of the
      lower of the night price and its points cap. The top-off counted reads the award's top-off entries
      in the member's Ashbury Rewards account: it is the top-off deducted for the cancelled reservation
      less any top-off returned for that reservation; top-off deducted for or returned on any other
      reservation of the award never counts. The stay-length reduction of the stay's protected value is
      the upper stay-length reduction when the cancelled reservation was booked for at least the upper
      stay-length nights, the lower stay-length reduction when it was booked for at least the lower
      stay-length nights, and nothing for a shorter stay. The stay-nights reduction of the stay's
      protected value is the upper stay-nights reduction when the stay night credits posted to the
      member's Ashbury Rewards account in the last twelve months add up to at least the upper
      stay-credit nights, the lower stay-nights reduction when they add up to at least the lower
      stay-credit nights, and nothing otherwise; the last twelve months are the credits posted fewer
      than twelve whole calendar months before the loss, and card anniversary night credits are not
      stay night credits. The stay's protected value recorded is the award's share less the stay-length
      and stay-nights reductions, each applied once, in whole points and never below zero.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [award_category, award_season, nights]
        note: the cancelled reservation's category and season price the forfeited night and its booked nights decide the stay-length reduction.
      - category: loyalty
        as: history
        reads: [loyalty_transactions.points, loyalty_transactions.certificate_id, loyalty_transactions.reservation_id, loyalty_transactions.earning_source, loyalty_transactions.nights, loyalty_transactions.event_type, loyalty_transactions.posted_date]
        note: the award's top-off deductions and returns for the cancelled reservation decide the top-off counted and the share method (entries for other reservations are excluded); the stay night credits of the last twelve months decide the stay-nights reduction (card credits and older credits excluded).
    compute:
      - lv_cat: "CFIELD('booking','award_category', reservation_id=F('reservation_id'))"
      - lv_std: "K('chart_std_cat1') if lv_cat == 1 else (K('chart_std_cat2') if lv_cat == 2 else (K('chart_std_cat3') if lv_cat == 3 else (K('chart_std_cat4') if lv_cat == 4 else (K('chart_std_cat5') if lv_cat == 5 else (K('chart_std_cat6') if lv_cat == 6 else (K('chart_std_cat7') if lv_cat == 7 else K('chart_std_cat8')))))))"
      - lv_step: "K('season_step_cat1_3') if lv_cat <= 3 else (K('season_step_cat4_6') if lv_cat <= 6 else (K('season_step_cat7') if lv_cat == 7 else K('season_step_cat8')))"
      - lv_season: "CFIELD('booking','award_season', reservation_id=F('reservation_id'))"
      - lv_season_adj: "lv_step if lv_season == 'peak' else (0 - lv_step if lv_season == 'off_peak' else 0)"
      - lv_night: "lv_std + lv_season_adj"
      - lv_ded_res: "XSUM('loyalty','loyalty_transactions','points', event_type='loyalty_points_redeem', earning_source='certificate_top_off', certificate_id=HID, reservation_id=F('reservation_id'))"
      - lv_ret_res: "XSUM('loyalty','loyalty_transactions','points', event_type='loyalty_points_redeposit', earning_source='top_off_redeposit', certificate_id=HID, reservation_id=F('reservation_id'))"
      - lv_topoff: "lv_ded_res - lv_ret_res"
      - lv_topped_here: "XCOUNT('loyalty','loyalty_transactions', event_type='loyalty_points_redeem', earning_source='certificate_top_off', certificate_id=HID, reservation_id=F('reservation_id'))"
      - lv_share: "lv_night if P('uncapped') else (lv_night - lv_topoff if lv_topped_here >= 1 else MN(lv_night, P('cap_points_per_night')))"
      - lv_booked_nights: "CFIELD('booking','nights', reservation_id=F('reservation_id'))"
      - lv_length_red: "K('stay_length_reduction_upper') if lv_booked_nights >= K('stay_length_nights_upper') else (K('stay_length_reduction_lower') if lv_booked_nights >= K('stay_length_nights_lower') else 0)"
      - lv_stay_credits: "XSUM('loyalty','loyalty_transactions','nights', within_months=12, date_field='posted_date', event_type='loyalty_night_credit', earning_source='stay_nights')"
      - lv_credit_red: "K('stay_credit_reduction_upper') if lv_stay_credits >= K('stay_credit_nights_upper') else (K('stay_credit_reduction_lower') if lv_stay_credits >= K('stay_credit_nights_lower') else 0)"
      - result: "int(MX(0, lv_share - lv_length_red - lv_credit_red))"
    compute_basis:
      lv_cat: "The stay's protected value is the standard-season price of the award chart for the award category recorded on the cancelled reservation, in whole points."
      lv_std: "The award chart's standard-season prices by category are those of the Ashbury Rewards award chart."
      lv_step: "a category's season step is the gap between its neighbouring seasons on the award chart."
      lv_season: "The season recorded on the cancelled reservation prices the forfeited night: a peak night costs one season step more than the standard-season price, an off-peak night one season step less, and a standard night the standard-season price itself"
      lv_season_adj: "The season recorded on the cancelled reservation prices the forfeited night: a peak night costs one season step more than the standard-season price, an off-peak night one season step less, and a standard night the standard-season price itself"
      lv_night: "The season recorded on the cancelled reservation prices the forfeited night: a peak night costs one season step more than the standard-season price, an off-peak night one season step less, and a standard night the standard-season price itself"
      lv_ded_res: "it is the top-off deducted for the cancelled reservation less any top-off returned for that reservation"
      lv_ret_res: "it is the top-off deducted for the cancelled reservation less any top-off returned for that reservation"
      lv_topoff: "The top-off counted reads the award's top-off entries in the member's Ashbury Rewards account: it is the top-off deducted for the cancelled reservation less any top-off returned for that reservation; top-off deducted for or returned on any other reservation of the award never counts."
      lv_topped_here: "a capped award for which top-off points were deducted for the cancelled reservation has a share of the night price less the top-off counted"
      lv_share: "The award's share of the forfeited night depends on the award: an uncapped award's share is the whole night price; a capped award for which top-off points were deducted for the cancelled reservation has a share of the night price less the top-off counted; a capped award with no top-off deducted for that reservation has a share of the lower of the night price and its points cap."
      lv_booked_nights: "The stay-length reduction of the stay's protected value is the upper stay-length reduction when the cancelled reservation was booked for at least the upper stay-length nights, the lower stay-length reduction when it was booked for at least the lower stay-length nights, and nothing for a shorter stay."
      lv_length_red: "The stay-length reduction of the stay's protected value is the upper stay-length reduction when the cancelled reservation was booked for at least the upper stay-length nights, the lower stay-length reduction when it was booked for at least the lower stay-length nights, and nothing for a shorter stay."
      lv_stay_credits: "the last twelve months are the credits posted fewer than twelve whole calendar months before the loss, and card anniversary night credits are not stay night credits."
      lv_credit_red: "The stay-nights reduction of the stay's protected value is the upper stay-nights reduction when the stay night credits posted to the member's Ashbury Rewards account in the last twelve months add up to at least the upper stay-credit nights, the lower stay-nights reduction when they add up to at least the lower stay-credit nights, and nothing otherwise"
      result: "The stay's protected value recorded is the award's share less the stay-length and stay-nights reductions, each applied once, in whole points and never below zero."
    factors:
      - id: stay_value_night_season
        effect: parameter
        decides: lv_season_adj
        bindings: [lv_season, lv_season_adj]
        ladder:
          - when: "the cancelled reservation records the forfeited night's season as peak"
            value: "one season step added to the standard-season price"
          - when: "the cancelled reservation records the season as off-peak"
            value: "one season step taken off the standard-season price"
          - when: "otherwise (standard season)"
            value: "no change to the standard-season price"
        baseline:
          lv_season_adj: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: stay_value_award_share
        effect: method
        decides: lv_share
        bindings: [lv_topped_here, lv_share]
        ladder:
          - when: "the forfeited award is an uncapped award"
            method: "the share is the whole night price"
          - when: "the award is capped and top-off points were deducted for the cancelled reservation"
            method: "the share is the night price less the top-off counted"
          - when: "otherwise (a capped award with no top-off deducted for that reservation)"
            method: "the share is the lower of the night price and the award's points cap"
        baseline:
          lv_share: "lv_night"
        evidence: [cross_category, history, tier_param]
        cross_difficulty: loyalty
      - id: stay_value_stay_length
        effect: parameter
        decides: lv_length_red
        bindings: [lv_booked_nights, lv_length_red]
        ladder:
          - when: "the cancelled reservation was booked for at least the upper stay-length nights"
            value: "K('stay_length_reduction_upper')"
          - when: "it was booked for at least the lower stay-length nights but fewer than the upper"
            value: "K('stay_length_reduction_lower')"
          - when: "otherwise (a one-night stay)"
            value: "no stay-length reduction"
        baseline:
          lv_length_red: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: stay_value_stay_nights
        effect: parameter
        decides: lv_credit_red
        bindings: [lv_stay_credits, lv_credit_red]
        ladder:
          - when: "the stay night credits posted in the last twelve months add up to at least the upper stay-credit nights"
            value: "K('stay_credit_reduction_upper')"
          - when: "they add up to at least the lower stay-credit nights but fewer than the upper"
            value: "K('stay_credit_reduction_lower')"
          - when: "otherwise"
            value: "no stay-nights reduction"
        baseline:
          lv_credit_red: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The award chart's standard-season prices by category are those of the Ashbury Rewards award chart.
        The stay's protected value is the standard-season price of the award chart for the award category
        recorded on the cancelled reservation, in whole points.
      params: [chart_std_cat1, chart_std_cat2, chart_std_cat3, chart_std_cat4, chart_std_cat5, chart_std_cat6, chart_std_cat7, chart_std_cat8]
    inputs:
      history:
        - {category: loyalty, table: loyalty_transactions, aggregate: sum, field: points, filters: {earning_source: certificate_top_off}}
        - {category: loyalty, table: loyalty_transactions, aggregate: sum, field: points, filters: {earning_source: top_off_redeposit}}
        - {category: loyalty, table: loyalty_transactions, aggregate: sum, field: nights, within_months: 12, filters: {event_type: loyalty_night_credit, earning_source: stay_nights}}
      cross_category: [booking, loyalty]
  - id: certificate_ext_late_cancel_return_protection
    base_policy_refs: [certificate_release_and_expiry, certificate_evt_activity_records, certificate_forfeiture]
    overwrite:
      - base_policy: certificate_evt_activity_records
        superseded_clause: >-
          A hold record carries the standard-room points price of the night and the top-off points, and
          the later release, use or loss records repeat the points price recorded on the hold.
        replaced_by: >-
          The return record of a later-night award on a reservation cancelled after its deadline states
          the protected rebooking price, worked out as this rule sets out, rather than repeating the price
          recorded on the hold.
      - base_policy: certificate_evt_activity_records
        superseded_clause: >-
          A release record carries cancelled_before_deadline or reservation_relocated, a loss record
          cancelled_after_deadline, no_show or membership_closed, and a use record stay_completed.
        replaced_by: >-
          The return record of a later-night award on a reservation cancelled after its deadline carries
          the reason that the reservation was cancelled after its deadline, as the loss record of its
          first-night award does.
    trigger: state_due
    subject: [certificate_release, certificate_release_record]
    computes: award_points_price
    target_tool: release_later_night_award_2a59ee43
    params:
      chart_std_cat1: 7500
      chart_std_cat2: 12500
      chart_std_cat3: 17500
      chart_std_cat4: 25000
      chart_std_cat5: 35000
      chart_std_cat6: 45000
      chart_std_cat7: 60000
      chart_std_cat8: 85000
      season_step_cat1_3: 2500
      season_step_cat4_6: 5000
      season_step_cat7: 10000
      season_step_cat8: 15000
      tenure_months_long: 120
      tenure_months_mid: 60
      tenure_reduction_long: 2000
      tenure_reduction_mid: 1000
      return_tier_reduction_upper: 5000
      return_tier_reduction_lower: 2500
      return_card_reduction_premier: 1500
      return_card_reduction_standard: 500
      return_nights_upper: 60
      return_nights_lower: 30
      return_nights_reduction_upper: 1500
      return_nights_reduction_lower: 500
    rule: >-
      When a reservation is cancelled after its deadline, every award paying a night after its first
      night is returned to the member's account, and its return record states the protected rebooking
      price: the points price at which that returned night stays protected if the member rebooks it. This
      rule returns only a later-night award whose expiry date has not passed on the day of the return;
      one whose expiry date has passed expires as the release rule sets and is not returned here. A
      later-night award of a reservation cancelled after its deadline is not returned until the award
      paying that reservation's first night stands forfeited with its loss record in its history. The
      return record of a later-night award on a reservation cancelled after its deadline states the
      protected rebooking price, worked out as this rule sets out, rather than repeating the price
      recorded on the hold. The return record of a later-night award on a reservation cancelled after
      its deadline carries the reason that the reservation was cancelled after its deadline, as the
      loss record of its first-night award does. The protected rebooking price is the stay's protected
      value recorded on the loss record of the stay's first-night award, in whole points. The cancellation
      timing, the member's tenure, elite tier, co-brand card and recent elite nights change that
      price as follows. The award chart's standard-season prices by category are those of the Ashbury
      Rewards award chart. A category's season step is the gap between its neighbouring seasons on that
      chart; its peak-season price is its standard-season price plus one season step and its off-peak
      price its standard-season price less one season step. How close to
      arrival the late cancellation was recorded decides how the protected price is set, counting whole
      calendar days from the date the cancellation was recorded to the arrival date of the cancelled
      reservation: a cancellation recorded on the arrival date or later protects the night at the
      peak-season price of the cancelled reservation's category plus one more season step; a
      cancellation recorded on the calendar day before the arrival date protects it at that category's
      peak-season price; a cancellation recorded two or more days before the arrival date, which a
      deadline further out than one day makes possible, protects it at the stay's protected value itself.
      The tenure reduction is the long-tenure reduction for a member enrolled at least the long-tenure
      months before the return, the mid-tenure reduction for one enrolled at least the mid-tenure months
      before it, and nothing otherwise, the months being whole calendar months from the enrolment date
      to the date of the return. The tier reduction is the upper return tier reduction for a Titanium
      Elite or Ambassador Elite member, the lower return tier reduction for a Gold Elite or Platinum
      Elite member, and nothing for every other member. The card reduction is the premier card return
      reduction when the membership's linked co-brand card is the Ashbury Rewards Premier Card, the
      standard card return reduction when it is the Ashbury Rewards Card, and nothing when none is
      linked. The night reduction is the upper return night reduction when the elite night credits
      posted to the member's Ashbury Rewards account in the last twelve months are at least the upper
      return night threshold, the lower return night reduction when they are at least the lower return
      night threshold, and nothing otherwise. The last twelve months are the credits posted fewer than
      twelve whole calendar months before the return, stay credits and card anniversary credits alike;
      a year-end reset of the night count is not a credit and takes nothing away, and the membership's
      count for the current calendar year is not the measure. The protected rebooking price
      recorded is the price set by the cancellation timing, less the tenure, tier, card and night
      reductions, each applied once to that price, in whole points and never below zero.
    prerequisite:
      - problem: certificate_ext_late_cancel_loss_value
        kind: state_gate
        gate: free_night_certificates.status
        form: state
        policy_source: >-
          A later-night award of a reservation cancelled after its deadline is not returned until the
          award paying that reservation's first night stands forfeited with its loss record in its
          history.
        condition: >-
          The award whose night is the cancelled reservation's arrival date has status forfeited and its
          history carries a loss record for that reservation; only then is a later-night award of the
          same reservation returned.
        resolved_by: forfeit_late_cancel_award_5a86721d
        effect: >-
          The first-night award's status turns from applied to forfeited and its loss record is written,
          so the return of the later-night award may be booked.
    cross_category:
      - category: booking
        as: branch
        reads: [award_category, cancelled_at, arrival_date]
        note: the cancelled reservation's category and the gap between its cancellation date and arrival date decide the cancellation-timing factor.
      - category: loyalty
        as: branch
        reads: [enrolled_date, variant_name, cobrand_card]
        note: enrolment date, elite tier and linked co-brand card decide the tenure, tier and card reductions.
      - category: loyalty
        as: history
        reads: [loyalty_transactions.nights, loyalty_transactions.event_type, loyalty_transactions.posted_date]
        note: the elite night credits posted in the last twelve months decide the night reduction; year-end resets and older credits are excluded.
    compute:
      - rp_cat: "CFIELD('booking','award_category', reservation_id=F('reservation_id'))"
      - rp_std: "K('chart_std_cat1') if rp_cat == 1 else (K('chart_std_cat2') if rp_cat == 2 else (K('chart_std_cat3') if rp_cat == 3 else (K('chart_std_cat4') if rp_cat == 4 else (K('chart_std_cat5') if rp_cat == 5 else (K('chart_std_cat6') if rp_cat == 6 else (K('chart_std_cat7') if rp_cat == 7 else K('chart_std_cat8')))))))"
      - rp_step: "K('season_step_cat1_3') if rp_cat <= 3 else (K('season_step_cat4_6') if rp_cat <= 6 else (K('season_step_cat7') if rp_cat == 7 else K('season_step_cat8')))"
      - rp_cancel_days: "DAYS(CFIELD('booking','cancelled_at', reservation_id=F('reservation_id')), CFIELD('booking','arrival_date', reservation_id=F('reservation_id')))"
      - rp_basis: "rp_std + rp_step + rp_step if rp_cancel_days <= 0 else (rp_std + rp_step if rp_cancel_days == 1 else LATEST('certificate_activity','award_points_price', date_field='activity_date', event_type='certificate_forfeit_record', reservation_id=F('reservation_id')))"
      - rp_tenure_months: "MONTHS(CFIELD('loyalty','enrolled_date'), NOW)"
      - rp_tenure_red: "K('tenure_reduction_long') if rp_tenure_months >= K('tenure_months_long') else (K('tenure_reduction_mid') if rp_tenure_months >= K('tenure_months_mid') else 0)"
      - rp_tier: "CFIELD('loyalty','variant_name')"
      - rp_tier_red: "K('return_tier_reduction_upper') if rp_tier == 'Ashbury Rewards Titanium Elite' or rp_tier == 'Ashbury Rewards Ambassador Elite' else (K('return_tier_reduction_lower') if rp_tier == 'Ashbury Rewards Gold Elite' or rp_tier == 'Ashbury Rewards Platinum Elite' else 0)"
      - rp_card: "CFIELD('loyalty','cobrand_card')"
      - rp_card_red: "K('return_card_reduction_premier') if rp_card == 'ashbury_rewards_premier_card' else (K('return_card_reduction_standard') if rp_card == 'ashbury_rewards_card' else 0)"
      - rp_nights: "XSUM('loyalty','loyalty_transactions','nights', within_months=12, date_field='posted_date', event_type='loyalty_night_credit')"
      - rp_nights_red: "K('return_nights_reduction_upper') if rp_nights >= K('return_nights_upper') else (K('return_nights_reduction_lower') if rp_nights >= K('return_nights_lower') else 0)"
      - result: "int(MX(0, rp_basis - rp_tenure_red - rp_tier_red - rp_card_red - rp_nights_red))"
    compute_basis:
      rp_cat: "a cancellation recorded on the arrival date or later protects the night at the peak-season price of the cancelled reservation's category plus one more season step"
      rp_std: "The award chart's standard-season prices by category are those of the Ashbury Rewards award chart."
      rp_step: "A category's season step is the gap between its neighbouring seasons on that chart; its peak-season price is its standard-season price plus one season step and its off-peak price its standard-season price less one season step."
      rp_cancel_days: "How close to arrival the late cancellation was recorded decides how the protected price is set, counting whole calendar days from the date the cancellation was recorded to the arrival date of the cancelled reservation"
      rp_basis: "a cancellation recorded on the arrival date or later protects the night at the peak-season price of the cancelled reservation's category plus one more season step; a cancellation recorded on the calendar day before the arrival date protects it at that category's peak-season price; a cancellation recorded two or more days before the arrival date, which a deadline further out than one day makes possible, protects it at the stay's protected value itself."
      rp_tenure_months: "the months being whole calendar months from the enrolment date to the date of the return"
      rp_tenure_red: "The tenure reduction is the long-tenure reduction for a member enrolled at least the long-tenure months before the return, the mid-tenure reduction for one enrolled at least the mid-tenure months before it, and nothing otherwise"
      rp_tier: "The tier reduction is the upper return tier reduction for a Titanium Elite or Ambassador Elite member, the lower return tier reduction for a Gold Elite or Platinum Elite member, and nothing for every other member."
      rp_tier_red: "The tier reduction is the upper return tier reduction for a Titanium Elite or Ambassador Elite member, the lower return tier reduction for a Gold Elite or Platinum Elite member, and nothing for every other member."
      rp_card: "The card reduction is the premier card return reduction when the membership's linked co-brand card is the Ashbury Rewards Premier Card, the standard card return reduction when it is the Ashbury Rewards Card, and nothing when none is linked."
      rp_card_red: "The card reduction is the premier card return reduction when the membership's linked co-brand card is the Ashbury Rewards Premier Card, the standard card return reduction when it is the Ashbury Rewards Card, and nothing when none is linked."
      rp_nights: "The last twelve months are the credits posted fewer than twelve whole calendar months before the return, stay credits and card anniversary credits alike; a year-end reset of the night count is not a credit and takes nothing away, and the membership's count for the current calendar year is not the measure."
      rp_nights_red: "The night reduction is the upper return night reduction when the elite night credits posted to the member's Ashbury Rewards account in the last twelve months are at least the upper return night threshold, the lower return night reduction when they are at least the lower return night threshold, and nothing otherwise."
      result: "The protected rebooking price recorded is the price set by the cancellation timing, less the tenure, tier, card and night reductions, each applied once to that price, in whole points and never below zero."
    factors:
      - id: return_cancellation_timing
        effect: method
        decides: rp_basis
        bindings: [rp_cancel_days, rp_basis]
        ladder:
          - when: "the late cancellation was recorded on the cancelled reservation's arrival date or later"
            method: "protect the night at the category's peak-season price plus one more season step"
          - when: "the cancellation was recorded on the calendar day before the arrival date"
            method: "protect the night at the category's peak-season price"
          - when: "otherwise (recorded two or more days before arrival, possible where the deadline lies further out)"
            method: "protect the night at the stay's protected value recorded on the first-night award's loss record"
        baseline:
          rp_basis: "LATEST('certificate_activity','award_points_price', date_field='activity_date', event_type='certificate_forfeit_record', reservation_id=F('reservation_id'))"
        evidence: [cross_category, date, history]
        cross_difficulty: booking
      - id: return_member_tenure
        effect: parameter
        decides: rp_tenure_red
        bindings: [rp_tenure_months, rp_tenure_red]
        ladder:
          - when: "the member enrolled at least the long-tenure months before the return"
            value: "K('tenure_reduction_long')"
          - when: "the member enrolled at least the mid-tenure months, but fewer than the long-tenure months, before the return"
            value: "K('tenure_reduction_mid')"
          - when: "otherwise"
            value: "no tenure reduction"
        baseline:
          rp_tenure_red: "0"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: return_member_tier
        effect: parameter
        decides: rp_tier_red
        bindings: [rp_tier, rp_tier_red]
        ladder:
          - when: "the member holds Titanium Elite or Ambassador Elite"
            value: "K('return_tier_reduction_upper')"
          - when: "the member holds Gold Elite or Platinum Elite"
            value: "K('return_tier_reduction_lower')"
          - when: "otherwise"
            value: "no tier reduction"
        baseline:
          rp_tier_red: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: return_card_reduction
        effect: parameter
        decides: rp_card_red
        bindings: [rp_card, rp_card_red]
        ladder:
          - when: "the linked co-brand card is the Ashbury Rewards Premier Card"
            value: "K('return_card_reduction_premier')"
          - when: "the linked co-brand card is the Ashbury Rewards Card"
            value: "K('return_card_reduction_standard')"
          - when: "otherwise (no card linked)"
            value: "no card reduction"
        baseline:
          rp_card_red: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: return_elite_nights
        effect: parameter
        decides: rp_nights_red
        bindings: [rp_nights, rp_nights_red]
        ladder:
          - when: "the elite night credits posted in the last twelve months are at least the upper return night threshold"
            value: "K('return_nights_reduction_upper')"
          - when: "they are at least the lower return night threshold but below the upper one"
            value: "K('return_nights_reduction_lower')"
          - when: "otherwise"
            value: "no night reduction"
        baseline:
          rp_nights_red: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The protected rebooking price is the stay's protected value recorded on the loss record of the
        stay's first-night award, in whole points.
      params: []
    inputs:
      history:
        - {table: certificate_activity, aggregate: latest, field: award_points_price, filters: {event_type: certificate_forfeit_record}}
        - {category: loyalty, table: loyalty_transactions, aggregate: sum, field: nights, filters: {event_type: loyalty_night_credit}}
      cross_category: [booking, loyalty]
  - id: certificate_ext_returned_award_rebook_price
    base_policy_refs: [certificate_redemption_eligibility, certificate_agg_awards_per_reservation, certificate_evt_activity_records]
    overwrite:
      - base_policy: certificate_redemption_eligibility
        superseded_clause: >-
