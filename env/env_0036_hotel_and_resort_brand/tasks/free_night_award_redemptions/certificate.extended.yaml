        baseline:
          rr_tier_red: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: walk_relocations_compensated
        effect: parameter
        decides: rr_walks_red
        bindings: [rr_walks, rr_walks_red]
        ladder:
          - when: "at least the upper relocations count of relocation compensation postings in the last twenty-four months, this relocation's included"
            value: "K('walks_reduction_upper')"
          - when: "exactly one such posting"
            value: "K('walks_reduction_lower')"
          - when: "otherwise (none)"
            value: "no relocations reduction"
        baseline:
          rr_walks_red: "0"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: walk_stay_length
        effect: parameter
        decides: rr_nights_red
        bindings: [rr_walked_nights, rr_nights_red]
        ladder:
          - when: "the relocated reservation was booked for at least the upper walked-stay nights"
            value: "K('walked_nights_reduction_upper')"
          - when: "it was booked for at least the lower walked-stay nights but fewer than the upper"
            value: "K('walked_nights_reduction_lower')"
          - when: "otherwise"
            value: "no walked-stay reduction"
        baseline:
          rr_nights_red: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: walk_elite_nights
        effect: parameter
        decides: rr_elite_red
        bindings: [rr_elite, rr_elite_red]
        ladder:
          - when: "this year's elite night credits are at least the upper walked night threshold"
            value: "K('walk_nights_reduction_upper')"
          - when: "they are at least the lower walked night threshold but below the upper one"
            value: "K('walk_nights_reduction_lower')"
          - when: "otherwise"
            value: "no elite-night reduction"
        baseline:
          rr_elite_red: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The award chart's standard-season prices by category are those of the Ashbury Rewards award chart.
