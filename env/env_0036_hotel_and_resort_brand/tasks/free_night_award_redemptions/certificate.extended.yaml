      - rr_season: "CFIELD('booking','award_season', reservation_id=F('reservation_id'))"
      - rr_night: "rr_std + rr_step if rr_season == 'peak' else (rr_std - rr_step if rr_season == 'off_peak' else rr_std)"
      - rr_delay: "DAYS(CFIELD('booking','relocated_date', reservation_id=F('reservation_id')), NOW)"
