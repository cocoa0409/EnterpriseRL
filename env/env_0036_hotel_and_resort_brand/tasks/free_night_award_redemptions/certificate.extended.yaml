    rule: >-
      When the hotel relocates a Reward Night Rate reservation, every award on it comes back to the
      member's account, and its return record states the walked-night protected price: the points price
      at which the walked night stays protected for the member. The return record of an award coming back
      from a reservation the hotel relocated states the walked-night protected price, worked out as this
      rule sets out, rather than repeating the price recorded on the hold. An award that comes back from a
      relocated stay after its expiry date has passed stands returned in the member's account, usable for
      no stay, so that its replacement can be deposited against it; the system's own expiry run then
      closes it as expired, and it is never reinstated for a new stay. The award chart's standard-season
      prices by category are those of the Ashbury Rewards award chart. The walked-night protected price is
      the award-chart price of the walked night for the category and season recorded on the relocated
      reservation, in whole points. How long the return took, the member's tier, the relocations
      compensated in the last two years, the length of the walked stay and this year's elite nights
      change that price as follows. A category's season step is the gap between its neighbouring seasons
      on that chart; its off-peak price is its standard-season price less one season step and its
      peak-season price its standard-season price plus one season step. How long the return took is
      counted in whole calendar days from the date the hotel relocated the reservation to the date of the
      return: more than the long-delay days protect the walked night at the off-peak price of the
      relocated reservation's category; more than the short-delay days but no more than the long-delay
      days protect it at that category's standard-season price; the short-delay days or fewer protect it
      at the walked night's own award-chart price. The tier reduction is the upper walked tier reduction
      for a Titanium Elite or Ambassador Elite member, the lower walked tier reduction for a Gold Elite or
      Platinum Elite member, and nothing for every other member. The relocations reduction counts the
      relocation compensation postings on the membership within the twenty-four calendar months before
      the return, the posting for this relocation included: at least the upper relocations count earns
      the upper relocations reduction, exactly one the lower relocations reduction, and none nothing. The
      walked-stay reduction reads the nights booked on the relocated reservation: at least the upper
      walked-stay nights earn the upper walked-stay reduction, at least the lower walked-stay nights the
      lower walked-stay reduction, and a shorter stay nothing. The elite-night reduction is the upper
      walked night reduction when this year's elite night credits are at least the upper walked night
      threshold, the lower walked night reduction when they are at least the lower walked night threshold,
      and nothing otherwise. The walked-night protected price recorded is the price set by how long the
      return took, less the tier, relocations, walked-stay and elite-night reductions, each applied once to
      that price, in whole points and never below zero.
