      mix_points_nights_upper: 2
      mix_reduction_upper: 500
      mix_reduction_lower: 250
    rule: >-
      When a member applies an award that came back from a cancelled stay to a night of another Reward
      Night Rate reservation, the new hold records the rebooked night's price. This rule prices the hold
      of every award returned from a cancelled stay, a replacement award included once it has come back
      from a cancelled stay. When a member applies an award that came back from a cancelled stay, the
      night's price recorded on the new hold, and compared with the award's points cap, is the rebooked
      night's price worked out as this rule sets out. The rebooked night's price of a returned award is
      fixed only after the award stands back in the member's account with its return from the cancelled
      stay entered in its history. The award chart's standard-season prices by category are those of the
      Ashbury Rewards award chart. The rebooked night's price is the standard-season price of the award
      chart for the award category recorded on the new reservation, in whole points. The season,
      rebooking protection, the member's tier, the co-brand card, this year's elite nights and points
      nights on the same reservation change that price as follows. A category's season step is the gap
      between its neighbouring seasons on that chart. The season recorded on the new reservation moves
      the price: a peak night costs one season step more than the standard-season price, an off-peak
      night one season step less, and a standard night the standard-season price itself. Rebooking
      protection reads the award's latest return record: when that return is dated within the protection
      window, fewer than the protection window months of whole calendar months before the hold, and came
      from a stay at the same hotel as the new reservation, the night is priced at the lower of its price
      and the protected rebooking price on that return; when it is dated within the window and came from
      a stay at another hotel, at the lower of its price and the protected rebooking price plus one
      season step of the new reservation's category; otherwise at its own price. The tier reduction is
      the upper rebooking tier reduction for a Titanium Elite or Ambassador Elite member, the lower
      rebooking tier reduction for a Gold Elite or Platinum Elite member, and nothing for every other
      member. The card reduction is the premier card rebooking reduction when the membership's linked
      co-brand card is the Ashbury Rewards Premier Card, the standard card rebooking reduction when it is
      the Ashbury Rewards Card, and nothing when none is linked. The elite-night reduction is the upper
      rebooking night reduction when this year's elite night credits are at least the upper rebooking
      night threshold, the lower rebooking night reduction when they are at least the lower rebooking
      night threshold, and nothing otherwise. The points-night reduction counts the new reservation's
      nights not paid with Free Night Awards: at least the upper points-night count earns the upper
      points-night reduction, exactly one such night the lower points-night reduction, and none
      nothing. The rebooked night's price recorded is the price after rebooking protection less the tier,
      card, elite-night and points-night reductions, each applied once, in whole points and never below
      zero.
    prerequisite:
      - problem: certificate_ext_late_cancel_return_protection
        kind: value_input
        gate: ap_protected
        form: state
        policy_source: >-
          The rebooked night's price of a returned award is fixed only after the award stands back in the
          member's account with its return from the cancelled stay entered in its history.
        condition: >-
          The award's status is issued and its latest return record is the return from the cancelled
          reservation, carrying that return's protected rebooking price and date.
        resolved_by: release_later_night_award_2a59ee43
        effect: >-
          The return record written for the cancelled stay becomes the award's latest return, so rebooking
          protection reads its protected rebooking price, its date and its hotel instead of an older return.
    cross_category:
      - category: booking
        as: branch
        reads: [award_category, award_season, property_code, nights, certificate_nights]
        note: the new reservation's category, season and points nights, and the hotel of the stay the award came back from, decide the season, protection and points-night factors.
      - category: loyalty
        as: branch
        reads: [variant_name, cobrand_card, elite_night_credits]
        note: the membership tier, linked co-brand card and this year's elite night credits decide the tier, card and elite-night reductions.
    compute:
      - ap_cat: "CFIELD('booking','award_category', status='confirmed', variant_name='Reward Night Rate')"
      - ap_std: "K('chart_std_cat1') if ap_cat == 1 else (K('chart_std_cat2') if ap_cat == 2 else (K('chart_std_cat3') if ap_cat == 3 else (K('chart_std_cat4') if ap_cat == 4 else (K('chart_std_cat5') if ap_cat == 5 else (K('chart_std_cat6') if ap_cat == 6 else (K('chart_std_cat7') if ap_cat == 7 else K('chart_std_cat8')))))))"
      - ap_step: "K('season_step_cat1_3') if ap_cat <= 3 else (K('season_step_cat4_6') if ap_cat <= 6 else (K('season_step_cat7') if ap_cat == 7 else K('season_step_cat8')))"
      - ap_season: "CFIELD('booking','award_season', status='confirmed', variant_name='Reward Night Rate')"
      - ap_season_adj: "ap_step if ap_season == 'peak' else (0 - ap_step if ap_season == 'off_peak' else 0)"
      - ap_night: "ap_std + ap_season_adj"
      - ap_ret_recent: "COUNT('certificate_activity', within_months=K('protection_window_months'), date_field='activity_date', event_type='certificate_release_record')"
      - ap_ret_price: "LATEST('certificate_activity','award_points_price', date_field='activity_date', event_type='certificate_release_record')"
      - ap_same_hotel: "CFIELD('booking','property_code', reservation_id=LATEST('certificate_activity','reservation_id', date_field='activity_date', event_type='certificate_release_record')) == CFIELD('booking','property_code', status='confirmed', variant_name='Reward Night Rate')"
      - ap_protected: "MN(ap_night, ap_ret_price) if ap_ret_recent >= 1 and ap_same_hotel else (MN(ap_night, ap_ret_price + ap_step) if ap_ret_recent >= 1 and not ap_same_hotel else ap_night)"
      - ap_tier: "CFIELD('loyalty','variant_name')"
      - ap_tier_red: "K('rebook_tier_reduction_upper') if ap_tier == 'Ashbury Rewards Titanium Elite' or ap_tier == 'Ashbury Rewards Ambassador Elite' else (K('rebook_tier_reduction_lower') if ap_tier == 'Ashbury Rewards Gold Elite' or ap_tier == 'Ashbury Rewards Platinum Elite' else 0)"
      - ap_card: "CFIELD('loyalty','cobrand_card')"
      - ap_card_red: "K('rebook_card_reduction_premier') if ap_card == 'ashbury_rewards_premier_card' else (K('rebook_card_reduction_standard') if ap_card == 'ashbury_rewards_card' else 0)"
      - ap_nights: "CFIELD('loyalty','elite_night_credits')"
      - ap_nights_red: "K('rebook_nights_reduction_upper') if ap_nights >= K('rebook_nights_upper') else (K('rebook_nights_reduction_lower') if ap_nights >= K('rebook_nights_lower') else 0)"
      - ap_points_nights: "CFIELD('booking','nights', status='confirmed', variant_name='Reward Night Rate') - CFIELD('booking','certificate_nights', status='confirmed', variant_name='Reward Night Rate')"
      - ap_mix_red: "K('mix_reduction_upper') if ap_points_nights >= K('mix_points_nights_upper') else (K('mix_reduction_lower') if ap_points_nights >= 1 else 0)"
      - result: "int(MX(0, ap_protected - ap_tier_red - ap_card_red - ap_nights_red - ap_mix_red))"
    compute_basis:
      ap_cat: "The rebooked night's price is the standard-season price of the award chart for the award category recorded on the new reservation, in whole points."
      ap_std: "The award chart's standard-season prices by category are those of the Ashbury Rewards award chart."
      ap_step: "A category's season step is the gap between its neighbouring seasons on that chart."
      ap_season: "The season recorded on the new reservation moves the price: a peak night costs one season step more than the standard-season price, an off-peak night one season step less, and a standard night the standard-season price itself."
      ap_season_adj: "The season recorded on the new reservation moves the price: a peak night costs one season step more than the standard-season price, an off-peak night one season step less, and a standard night the standard-season price itself."
      ap_ret_recent: "Rebooking protection reads the award's latest return record: when that return is dated within the protection window, fewer than the protection window months of whole calendar months before the hold"
      ap_ret_price: "the night is priced at the lower of its price and the protected rebooking price on that return"
      ap_same_hotel: "came from a stay at the same hotel as the new reservation"
      ap_protected: "when that return is dated within the protection window, fewer than the protection window months of whole calendar months before the hold, and came from a stay at the same hotel as the new reservation, the night is priced at the lower of its price and the protected rebooking price on that return; when it is dated within the window and came from a stay at another hotel, at the lower of its price and the protected rebooking price plus one season step of the new reservation's category; otherwise at its own price."
      ap_tier: "The tier reduction is the upper rebooking tier reduction for a Titanium Elite or Ambassador Elite member, the lower rebooking tier reduction for a Gold Elite or Platinum Elite member, and nothing for every other member."
      ap_tier_red: "The tier reduction is the upper rebooking tier reduction for a Titanium Elite or Ambassador Elite member, the lower rebooking tier reduction for a Gold Elite or Platinum Elite member, and nothing for every other member."
      ap_card: "The card reduction is the premier card rebooking reduction when the membership's linked co-brand card is the Ashbury Rewards Premier Card, the standard card rebooking reduction when it is the Ashbury Rewards Card, and nothing when none is linked."
      ap_card_red: "The card reduction is the premier card rebooking reduction when the membership's linked co-brand card is the Ashbury Rewards Premier Card, the standard card rebooking reduction when it is the Ashbury Rewards Card, and nothing when none is linked."
      ap_nights: "The elite-night reduction is the upper rebooking night reduction when this year's elite night credits are at least the upper rebooking night threshold, the lower rebooking night reduction when they are at least the lower rebooking night threshold, and nothing otherwise."
      ap_nights_red: "The elite-night reduction is the upper rebooking night reduction when this year's elite night credits are at least the upper rebooking night threshold, the lower rebooking night reduction when they are at least the lower rebooking night threshold, and nothing otherwise."
      ap_points_nights: "The points-night reduction counts the new reservation's nights not paid with Free Night Awards"
      ap_mix_red: "at least the upper points-night count earns the upper points-night reduction, exactly one such night the lower points-night reduction, and none nothing."
      result: "The rebooked night's price recorded is the price after rebooking protection less the tier, card, elite-night and points-night reductions, each applied once, in whole points and never below zero."
    factors:
      - id: rebook_night_season
        effect: parameter
        decides: ap_season_adj
        bindings: [ap_season, ap_season_adj]
        ladder:
          - when: "the new reservation records the season as peak"
            value: "one season step added to the standard-season price"
          - when: "the new reservation records the season as off-peak"
            value: "one season step taken off the standard-season price"
          - when: "otherwise (standard season)"
            value: "no change"
        baseline:
          ap_season_adj: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: rebook_protection
        effect: method
        decides: ap_protected
        bindings: [ap_ret_recent, ap_ret_price, ap_same_hotel, ap_protected]
        ladder:
          - when: "the award's latest return is dated within the protection window AND came from a stay at the same hotel as the new reservation"
            method: "price the night at the lower of its price and the protected rebooking price on that return"
          - when: "the latest return is dated within the protection window AND came from a stay at another hotel"
            method: "price the night at the lower of its price and the protected rebooking price plus one season step"
          - when: "otherwise"
            method: "price the night at its own price"
        baseline:
          ap_protected: "ap_night"
        evidence: [history, cross_category, date]
        cross_difficulty: booking
      - id: rebook_member_tier
        effect: parameter
        decides: ap_tier_red
        bindings: [ap_tier, ap_tier_red]
        ladder:
          - when: "the member holds Titanium Elite or Ambassador Elite"
            value: "K('rebook_tier_reduction_upper')"
          - when: "the member holds Gold Elite or Platinum Elite"
            value: "K('rebook_tier_reduction_lower')"
          - when: "otherwise"
            value: "no tier reduction"
        baseline:
          ap_tier_red: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: rebook_card_reduction
        effect: parameter
        decides: ap_card_red
        bindings: [ap_card, ap_card_red]
        ladder:
          - when: "the linked co-brand card is the Ashbury Rewards Premier Card"
            value: "K('rebook_card_reduction_premier')"
          - when: "the linked co-brand card is the Ashbury Rewards Card"
            value: "K('rebook_card_reduction_standard')"
          - when: "otherwise (no card linked)"
            value: "no card reduction"
        baseline:
          ap_card_red: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: rebook_elite_nights
        effect: parameter
        decides: ap_nights_red
        bindings: [ap_nights, ap_nights_red]
        ladder:
          - when: "this year's elite night credits are at least the upper rebooking night threshold"
            value: "K('rebook_nights_reduction_upper')"
          - when: "they are at least the lower rebooking night threshold but below the upper one"
            value: "K('rebook_nights_reduction_lower')"
          - when: "otherwise"
            value: "no elite-night reduction"
        baseline:
          ap_nights_red: "0"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: rebook_points_nights
        effect: parameter
        decides: ap_mix_red
        bindings: [ap_points_nights, ap_mix_red]
        ladder:
          - when: "the new reservation pays at least the upper points-night count of nights other than with Free Night Awards"
            value: "K('mix_reduction_upper')"
          - when: "it pays exactly one such night"
            value: "K('mix_reduction_lower')"
          - when: "otherwise (every night paid with Free Night Awards)"
            value: "no points-night reduction"
        baseline:
          ap_mix_red: "0"
        evidence: [cross_category]
        cross_difficulty: booking
    baseline:
