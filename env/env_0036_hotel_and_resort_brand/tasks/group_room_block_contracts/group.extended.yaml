# Group Room Blocks charter of Ashbury Hotels & Resorts.
# One holding = one group room block contract signed by an organiser for one hotel and one set of dates.
category: group
display_name: Group Room Blocks

binding:
  holding_table: group_blocks
  event_tables: [group_ledger]
  intake_tables: [group_amendments]
  status_field: status
  variant_field: variant_name
  quantity_fields: {held_room_nights: held_room_nights, deposit_held: group_deposit, master_balance: master_account}

lifecycle:
  states: [tentative, definite, actualized, cancelled, closed]
  transitions:
    - {from: tentative, to: definite, by: user, means: "The organiser signs the group contract and it becomes definite."}
    - {from: tentative, to: cancelled, by: system, means: "The option date passes without a signed contract and the proposal lapses."}
    - {from: definite, to: cancelled, by: user, means: "The organiser signs a written cancellation of the contract."}
    - {from: definite, to: actualized, by: system, means: "The block's departure date passes and the group's final pickup is established."}
    - {from: actualized, to: closed, by: agent, means: "The group master account is settled to zero and the file is closed."}
    - {from: cancelled, to: closed, by: agent, means: "Any cancellation damages are settled and the file is closed."}

accounts:
  - key: held_room_nights
    unit: room nights
    meaning: "Room nights the hotel holds out of inventory for the group."
  - key: group_deposit
    unit: USD
    meaning: "Group deposits received and held until refunded, applied to the master account or forfeited."
  - key: master_account
    unit: USD
    meaning: "Amount the organiser owes on the group master account."

parameter_schema:
  min_peak_night_rooms: "Fewest rooms on the busiest night for a request to be contracted as a block (integer rooms)."
  max_peak_night_rooms: "Most rooms on the busiest night the hotel contracts under this block type (integer rooms)."
  min_total_room_nights: "Fewest total room nights of a block (integer room nights)."
  max_arrival_lead_days: "Most calendar days between contracting and arrival (integer days)."
  option_validity_days: "Calendar days after the proposal is issued within which the organiser must sign, after which the tentative block lapses (integer days)."
  signing_requires_deposit: "Whether the signing deposit must be received for the contract to be signed (boolean)."
  signing_deposit_due_days: "Calendar days after the proposal within which the signing deposit is due (integer days)."
  deposit_signing_pct: "Signing deposit as a percentage of anticipated room revenue, contracted room nights times the group rate (number, %)."
  deposit_interim_pct: "Interim deposit as a percentage of anticipated room revenue (number, %)."
  deposit_interim_days_before_arrival: "Calendar days before arrival on which the interim deposit is due (integer days; 0 when none)."
  deposit_refundable: "Whether deposits are refunded on cancellation (boolean)."
  deposit_applied_to: "Where deposits are applied after the event (enum: master_account)."
  cutoff_days_before_arrival: "Calendar days before arrival on which the cut-off date falls (integer days)."
  cutoff_release_full: "Whether all unreserved room nights are released at cut-off (boolean)."
  after_cutoff_group_rate_honored: "Whether attendees booking after cut-off still receive the group rate when rooms are available (boolean)."
  reservation_method: "How attendees reserve inside the block (enum: individual_call_in, rooming_list)."
  rooming_list_due_days: "Calendar days before arrival on which the rooming list is due (integer days; 0 when not used)."
  rooming_list_name_changes_until_days: "Calendar days before arrival until which names on a rooming list may be changed (integer days; 0 when not used)."
  attendee_guarantee: "How attendee reservations are guaranteed (enum: individual_credit_card, master_account)."
  pickup_rate_plans: "Rate plans of attendee reservations that count as pickup (list of rate plan names)."
  no_shows_count_as_pickup: "Whether a charged no-show counts as one picked-up room night (boolean)."
  relocated_count_as_pickup: "Whether reservations the hotel relocated count as picked up for their booked nights (boolean)."
  shoulder_nights_count_as_pickup: "Whether shoulder nights at the group rate count as pickup (boolean)."
  attrition_allowance_pct: "Share of contracted room nights the group may fall short of without attrition (number, %)."
  attrition_charge_pct: "Share of the lost room revenue charged as attrition (number, %)."
  attrition_basis: "What lost room revenue is computed on (enum: shortfall_room_nights_x_group_rate)."
  attrition_measured_on: "How pickup is compared with the commitment (enum: cumulative_room_nights)."
  attrition_includes_tax: "Whether room tax is added to attrition (boolean)."
  resell_credit_applies: "Whether rooms the hotel resold reduce the shortfall (boolean)."
  attrition_assessment_days_after_departure: "Calendar days after the departure date by which attrition is assessed (integer days)."
  free_reduction_pct: "Share of the originally contracted room nights that may be removed by signed addendum without changing the attrition basis (number, %)."
  free_reduction_deadline_days: "Calendar days before arrival up to which a free reduction may be signed (integer days)."
  block_increase_subject_to_availability: "Whether added room nights depend on the hotel's availability (boolean)."
  cancellation_scale: "Cancellation damages ladder: list of {days_from, pct} where pct of anticipated room revenue applies when the cancellation is signed days_from or more calendar days before arrival, the first matching step from the top."
  cancellation_basis: "What cancellation damages are computed on (enum: contracted_room_nights_x_group_rate)."
  cancellation_damages_reduced_by_deposit: "Whether deposits held are forfeited toward cancellation damages (boolean)."
  contract_cancellation_notice_written: "Whether a cancellation takes effect only on the organiser's signed notice (boolean)."
  elimination_waiver: "Whether a team eliminated from its tournament may cancel without damages (boolean)."
  elimination_notice_hours: "Hours after elimination within which the notice must be given (integer hours; 0 when not applicable)."
  comp_room_ratio: "Paid room nights that earn one complimentary room night (integer room nights)."
  max_comp_room_nights: "Most complimentary room nights per block (integer room nights)."
  comp_credit_basis: "How a complimentary room night is valued (enum: group_rate_room_only)."
  comps_cumulative: "Whether complimentary nights are earned on cumulative paid room nights over the whole block (boolean)."
  comp_credit_includes_tax: "Whether the complimentary credit includes room tax (boolean)."
  master_account_allowed: "Whether room charges may be billed to a group master account (boolean)."
  direct_bill_eligible: "Whether the master account may be settled by invoice after the event (boolean)."
  master_payment_due_days: "Calendar days after the invoice within which the master account is due (integer days)."
  group_rate_includes_breakfast: "Whether the group rate includes breakfast (boolean)."

