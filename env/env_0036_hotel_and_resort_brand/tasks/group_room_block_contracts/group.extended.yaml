events:
  - type: group_block_create
    target: group_blocks
    mutation: create
    meaning: "Group sales issues a block proposal to an organiser and holds the rooms on a tentative basis."
    grain: "One row per transaction."
    fields:
      group_block_id: "reference number of the new block"
      customer_id: "organiser"
      variant_name: "block type"
      group_code: "booking code"
      group_name: "group or event name"
      property_code: "hotel"
      property_brand: "brand of the hotel"
      arrival_date: "first night"
      departure_date: "departure date"
      peak_night_rooms: "rooms on the peak night"
      contracted_room_nights: "room nights proposed"
      group_rate: "group rate per night"
      tax_rate_pct: "hotel tax rate"
      cutoff_date: "cut-off date"
      proposal_date: "date the proposal was issued"
    triggers:
      - event: group:group_block_allocate
        map: {group_block_id: group_block_id, customer_id: customer_id, room_nights: contracted_room_nights, entry_basis: contract_block}

  - type: group_contract_sign
    target: group_blocks
    mutation: {transition: {from: tentative, to: definite}}
    meaning: "The organiser signs the group contract."
    grain: "One row per transaction."
    fields:
      group_block_id: "block signed"
      contract_signed_date: "date signed"
    triggers: []

  - type: group_option_lapse
    target: group_blocks
    mutation: {transition: {from: tentative, to: cancelled}}
    meaning: "The option date passes without a signed contract and the proposal lapses."
    grain: "One row per transaction."
    fields:
      group_block_id: "block lapsed"
      cancelled_date: "date the option lapsed"
      customer_id: "organiser (read, not changed)"
      held_room_nights: "room nights still held (read, not changed)"
    triggers:
      - event: group:group_cutoff_release
        map: {group_block_id: group_block_id, customer_id: customer_id, room_nights: held_room_nights, entry_date: cancelled_date, entry_basis: contract_cancelled}

  - type: group_contract_cancel
    target: group_blocks
    mutation: {transition: {from: definite, to: cancelled}}
    meaning: "The organiser's signed cancellation of a definite contract takes effect."
    grain: "One row per transaction."
    fields:
      group_block_id: "block cancelled"
      cancelled_date: "date the signed cancellation was received"
      customer_id: "organiser (read, not changed)"
      held_room_nights: "room nights still held (read, not changed)"
    triggers:
      - event: group:group_cutoff_release
        map: {group_block_id: group_block_id, customer_id: customer_id, room_nights: held_room_nights, entry_date: cancelled_date, entry_basis: contract_cancelled}
      - event: group:group_cancellation_charge
        map: {group_block_id: group_block_id, customer_id: customer_id, entry_date: cancelled_date, entry_basis: cancellation_damages}

  - type: group_block_amend
    target: group_blocks
    mutation: update
    meaning: "A signed addendum changes the contracted room nights and rooms of a definite block."
    grain: "One row per transaction."
    fields:
      group_block_id: "block amended"
      contracted_room_nights: "contracted room nights after the addendum"
      peak_night_rooms: "peak-night rooms after the addendum"
    triggers: []

  - type: group_actualize
    target: group_blocks
    mutation: {transition: {from: definite, to: actualized}}
    meaning: "The block's departure date passes and its final pickup is established."
    grain: "One row per transaction."
    fields:
      group_block_id: "block actualized"
      customer_id: "organiser (read, not changed)"
      deposit_held: "deposit held (read, not changed)"
    triggers:
      - event: group:group_deposit_apply
        when: {deposit_held: {not: 0}}
        map: {group_block_id: group_block_id, customer_id: customer_id, amount: deposit_held, entry_basis: deposit_applied}

  - type: group_close
    target: group_blocks
    mutation: {transition: [{from: actualized, to: closed}, {from: cancelled, to: closed}]}
    meaning: "The group file is closed once nothing remains owed on the master account."
    grain: "One row per transaction."
    fields:
      group_block_id: "block closed"
    triggers: []

  - type: group_block_allocate
    target: group_ledger
    meaning: "Room nights are taken out of inventory for the group when the proposal is issued."
    grain: "One entry per block."
    distinguish_by: [entry_basis]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "0.00"
      room_nights: "room nights held"
      entry_date: "date held"
      entry_basis: "contract_block"
    account: held_room_nights
    direction: in
    triggers: []

  - type: group_block_increase
    target: group_ledger
    meaning: "Room nights are added to the block by a signed addendum."
    grain: "One entry per addendum."
    distinguish_by: [amendment_id]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "0.00"
      room_nights: "room nights added"
      entry_date: "date added"
      entry_basis: "signed_addendum"
      amendment_id: "addendum implemented"
    account: held_room_nights
    direction: in
    triggers: []

  - type: group_block_reduce
    target: group_ledger
    meaning: "Room nights are removed from the block by a signed addendum."
    grain: "One entry per addendum."
    distinguish_by: [amendment_id]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "0.00"
      room_nights: "room nights removed"
      entry_date: "date removed"
      entry_basis: "signed_addendum"
      amendment_id: "addendum implemented"
    account: held_room_nights
    direction: out
    triggers: []

  - type: group_cutoff_release
    target: group_ledger
    meaning: "Unreserved room nights are returned to general inventory at the cut-off date or when the block ends unsigned or cancelled."
    grain: "One entry per release occasion."
    distinguish_by: [entry_basis, entry_date]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "0.00"
      room_nights: "room nights released"
      entry_date: "date released"
      entry_basis: "cutoff_release or contract_cancelled"
    account: held_room_nights
    direction: out
    triggers: []

  - type: group_deposit_receive
    target: group_ledger
    meaning: "A scheduled group deposit is received from the organiser."
    grain: "One entry per scheduled deposit."
    distinguish_by: [entry_basis]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "amount received"
      room_nights: "0"
      entry_date: "date received"
      entry_basis: "deposit_signing or deposit_interim"
    account: group_deposit
    direction: in
    triggers: []

  - type: group_deposit_refund
    target: group_ledger
    meaning: "A group deposit is returned to the organiser."
    grain: "One entry per deposit refunded."
    distinguish_by: [related_entry_id]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "amount refunded"
      room_nights: "0"
      entry_date: "date refunded"
      entry_basis: "deposit_refunded"
      related_entry_id: "deposit refunded"
    account: group_deposit
    direction: out
    triggers: []

  - type: group_deposit_apply
    target: group_ledger
    meaning: "After the event the deposits held are applied to the group master account."
    grain: "One entry per block."
    distinguish_by: [entry_basis]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "deposits applied"
      room_nights: "0"
      entry_date: "date applied"
      entry_basis: "deposit_applied"
    account: group_deposit
    direction: out
    triggers:
      - event: group:group_master_payment
        map: {group_block_id: group_block_id, customer_id: customer_id, amount: amount, entry_date: entry_date, entry_basis: deposit_applied, related_entry_id: group_entry_id}

  - type: group_deposit_forfeit
    target: group_ledger
    meaning: "Deposits held are retained toward cancellation damages."
    grain: "One entry per block."
    distinguish_by: [entry_basis]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "deposits retained"
      room_nights: "0"
      entry_date: "date retained"
      entry_basis: "deposit_forfeited"
      related_entry_id: "the cancellation charge the deposit is retained toward"
    account: group_deposit
    direction: out
    triggers:
      - event: group:group_master_payment
        map: {group_block_id: group_block_id, customer_id: customer_id, amount: amount, entry_date: entry_date, entry_basis: deposit_forfeited, related_entry_id: group_entry_id}

  - type: group_attrition_charge
    target: group_ledger
    meaning: "Attrition is charged to the master account because pickup fell below the performance commitment."
    grain: "One entry per block."
    distinguish_by: [entry_basis]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "attrition charged"
      room_nights: "shortfall room nights"
      entry_date: "date assessed"
      entry_basis: "attrition"
    account: master_account
    direction: in
    triggers: []

  - type: group_cancellation_charge
    target: group_ledger
    meaning: "Cancellation damages are charged to the master account when the organiser cancels a definite contract."
    grain: "One entry per block."
    distinguish_by: [entry_basis]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "damages charged"
      room_nights: "contracted room nights the damages were computed on"
      entry_date: "date the cancellation was received"
      entry_basis: "cancellation_damages"
    account: master_account
    direction: in
    triggers: []

  - type: group_master_room_charge
    target: group_ledger
    meaning: "Room nights the organiser agreed to pay are billed to the master account."
    grain: "One entry per attendee reservation billed to the master account."
    distinguish_by: [related_entry_id, entry_date]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "room charges billed"
      room_nights: "room nights billed"
      entry_date: "date billed"
      entry_basis: "master_billed_rooms"
      related_entry_id: "empty; the attendee reservation is identified in the hotel's routing"
    account: master_account
    direction: in
    triggers: []

  - type: group_comp_credit
    target: group_ledger
    meaning: "Complimentary room nights earned by the group's pickup are credited to the master account."
    grain: "One entry per block."
    distinguish_by: [entry_basis]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "credit"
      room_nights: "complimentary room nights"
      entry_date: "date credited"
      entry_basis: "comp_rooms"
    account: master_account
    direction: out
    triggers: []

  - type: group_master_payment
    target: group_ledger
    meaning: "A payment by the organiser, or an applied or retained deposit, reduces the master account."
    grain: "One entry per payment."
    distinguish_by: [entry_basis, entry_date, related_entry_id]
    fields:
      group_block_id: "block"
      customer_id: "organiser"
      amount: "amount paid"
      room_nights: "0"
      entry_date: "date paid"
      entry_basis: "organiser_payment, deposit_applied or deposit_forfeited"
      related_entry_id: "the deposit entry applied or retained; empty for organiser payments"
    account: master_account
    direction: out
    triggers: []

measures:
  - id: group_msr_pickup_room_nights
    window: "The block's nights from arrival_date up to (not including) departure_date, widened by the Group Block Rate shoulder nights when shoulder_nights_count_as_pickup is true; read at actualization or at the moment of handling."
    measure: "Sum over booking_reservations with this group_block_id on a rate plan in pickup_rate_plans of: the nights between actual check-in and actual check-out for checked_out and in_house reservations, 1 for a no_show reservation that carries a no-show charge when no_shows_count_as_pickup is true, and the booked nights for a relocated reservation when relocated_count_as_pickup is true; cancelled reservations count 0."
  - id: group_msr_master_billed_room_nights
    window: "The whole life of the block."
    measure: "Sum of room_nights over the block's group_master_room_charge entries."

policies:
  - id: group_agg_multi_holding
    subject: [group_block_create]
    rule: >-
      An organiser may hold any number of group blocks, at the same or different hotels and on the
      same or different dates; each block is a separate contract with its own code, deposits, pickup
      and master account.
    eligibility: []
    params:
      max_per_customer: null

  - id: group_agg_block_isolation
    subject: [group_attrition_charge, group_comp_credit, group_cancellation_charge]
    rule: >-
      Blocks are never combined for performance. Pickup, complimentary room nights, attrition and
      cancellation damages are computed for each block on its own, from the attendee reservations
      that name that block's group_block_id. Pickup is counted only from reservations that name the
      block being assessed; rooms booked under another block of the same organiser, under a
      transient rate plan, or under no block at all never count, even at the same hotel on the same
      nights. A deposit, credit or payment of one block is never applied to another block's master
      account.
    eligibility:
      - id: same_block_only
        applies_to: [group_attrition_charge, group_comp_credit, group_cancellation_charge]
        kind: authorization
        condition: "Pickup is counted only from reservations that name the block being assessed; rooms booked under another block of the same organiser, under a transient rate plan, or under no block at all never count, even at the same hotel on the same nights."
        evidence_fields: [booking_reservations.group_block_id, booking_reservations.variant_name, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
    measures: [group_msr_pickup_room_nights]

  - id: group_contracting
    subject: [group_block_create, group_block_allocate, group_contract_sign, group_option_lapse]
    rule: >-
      Group sales proposes a block only when the request has at least min_peak_night_rooms and at most
      max_peak_night_rooms rooms on its peak night, at least min_total_room_nights room nights, and an
      arrival no more than max_arrival_lead_days calendar days away; smaller requests are booked as
      transient reservations and larger ones go to the brand's national sales office. The proposal
      holds the proposed room nights out of inventory on a tentative basis, recorded once per block as
      the contract_block allocation. The cut-off date is cutoff_days_before_arrival calendar
      days before the arrival date. The organiser signs the contract themselves; signing commits them
      to the contracted room nights, the attrition clause and the cancellation scale, so guest
      services never signs on their behalf. The contract can be signed only within
      option_validity_days calendar days after the proposal was issued. Days are counted as whole
      calendar days from the proposal date, which is day zero; a signature on the last day of the
      option period is accepted. Where signing_requires_deposit is true, the contract becomes definite
      only once the signing deposit has been received. A tentative block whose option period ends
      without a signature lapses and its rooms are released.
    eligibility:
      - id: option_period
        applies_to: [group_contract_sign]
        kind: time
        condition: "The contract can be signed only within option_validity_days calendar days after the proposal was issued."
        evidence_fields: [group_blocks.proposal_date, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the proposal was issued"
          anchor_source: group_blocks.proposal_date
          relation: not_after
          duration_source: variants.option_validity_days
          unit: calendar_days
          counting_rule: "Days are counted as whole calendar days from the proposal date, which is day zero; a signature on the last day of the option period is accepted."
          boundary: inclusive
      - id: signing_deposit_received
        applies_to: [group_contract_sign]
        kind: authorization
        condition: "Where signing_requires_deposit is true, the contract becomes definite only once the signing deposit has been received."
        evidence_fields: [group_ledger.group_block_id, group_ledger.event_type, group_ledger.entry_basis]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_ledger.group_block_id]
          action_bindings:
            group_ledger.group_block_id: group_block_id
    params:
      per_tier:
        "Social Event Room Block": {option_days: "=option_validity_days", deposit_first: "=signing_requires_deposit", cutoff_days: "=cutoff_days_before_arrival"}
        "Wedding Room Block": {option_days: "=option_validity_days", deposit_first: "=signing_requires_deposit", cutoff_days: "=cutoff_days_before_arrival"}
        "Sports Team Room Block": {option_days: "=option_validity_days", deposit_first: "=signing_requires_deposit", cutoff_days: "=cutoff_days_before_arrival"}
        "Tour & Travel Series Block": {option_days: "=option_validity_days", deposit_first: "=signing_requires_deposit", cutoff_days: "=cutoff_days_before_arrival"}
        "Corporate Meeting Room Block": {option_days: "=option_validity_days", deposit_first: "=signing_requires_deposit", cutoff_days: "=cutoff_days_before_arrival"}
        "Association Convention Room Block": {option_days: "=option_validity_days", deposit_first: "=signing_requires_deposit", cutoff_days: "=cutoff_days_before_arrival"}

  - id: group_deposit_schedule
    subject: [group_deposit_receive, group_deposit_refund, group_deposit_apply, group_deposit_forfeit]
    rule: >-
      Deposits are a percentage of anticipated room revenue, the contracted room nights times the
      group rate, rounded to the cent: the signing deposit is deposit_signing_pct percent and is due
      within signing_deposit_due_days of the proposal, and the interim deposit is deposit_interim_pct
      percent and is due deposit_interim_days_before_arrival calendar days before arrival; a block
      type whose percentage is 0 has no such deposit. Each scheduled deposit is received once.
      Deposits are received only while the block's status is tentative or definite. Deposits are not
      refundable when deposit_refundable is false, except that a block cancelled without damages under
      the elimination waiver has every deposit refunded. Deposits are applied to the master account
      only once the block's status is actualized. When a definite contract is cancelled, deposits held
      are retained toward the cancellation damages up to their amount, and any deposit beyond the
      damages is refunded; deposits are retained or refunded only on a block whose status is
      cancelled.
    eligibility:
      - id: receivable_state
        applies_to: [group_deposit_receive]
        kind: state
        condition: "Deposits are received only while the block's status is tentative or definite."
        evidence_fields: [group_blocks.status, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
        state_contract:
          field: group_blocks.status
          allowed: [tentative, definite]
      - id: once_per_milestone
        applies_to: [group_deposit_receive]
        kind: dedup
        condition: "Each scheduled deposit is received once."
        evidence_fields: [group_ledger.group_block_id, group_ledger.entry_basis, group_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_ledger.group_block_id, group_ledger.entry_basis]
          action_bindings:
            group_ledger.group_block_id: group_block_id
            group_ledger.entry_basis: entry_basis
        dedup_contract:
          table: group_ledger
          mode: separate_record
          object_bindings: {group_block_id: group_block_id, entry_basis: entry_basis}
          duplicate_filters: {event_type: [group_deposit_receive]}
          distinct_fields: []
      - id: apply_state
        applies_to: [group_deposit_apply]
        kind: state
        condition: "Deposits are applied to the master account only once the block's status is actualized."
        evidence_fields: [group_blocks.status, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
        state_contract:
          field: group_blocks.status
          allowed: [actualized]
      - id: cancelled_state
        applies_to: [group_deposit_refund, group_deposit_forfeit]
        kind: state
        condition: "When a definite contract is cancelled, deposits held are retained toward the cancellation damages up to their amount, and any deposit beyond the damages is refunded; deposits are retained or refunded only on a block whose status is cancelled."
        evidence_fields: [group_blocks.status, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
        state_contract:
          field: group_blocks.status
          allowed: [cancelled]
    params:
      per_tier:
        "Social Event Room Block": {signing_pct: "=deposit_signing_pct", interim_pct: "=deposit_interim_pct", interim_days: "=deposit_interim_days_before_arrival"}
        "Wedding Room Block": {signing_pct: "=deposit_signing_pct", interim_pct: "=deposit_interim_pct", interim_days: "=deposit_interim_days_before_arrival"}
        "Sports Team Room Block": {signing_pct: "=deposit_signing_pct", interim_pct: "=deposit_interim_pct", interim_days: "=deposit_interim_days_before_arrival"}
        "Tour & Travel Series Block": {signing_pct: "=deposit_signing_pct", interim_pct: "=deposit_interim_pct", interim_days: "=deposit_interim_days_before_arrival"}
        "Corporate Meeting Room Block": {signing_pct: "=deposit_signing_pct", interim_pct: "=deposit_interim_pct", interim_days: "=deposit_interim_days_before_arrival"}
        "Association Convention Room Block": {signing_pct: "=deposit_signing_pct", interim_pct: "=deposit_interim_pct", interim_days: "=deposit_interim_days_before_arrival"}
    formula:
      signing_deposit: "round(contracted_room_nights * group_rate * deposit_signing_pct / 100, 2)"
      interim_deposit: "round(contracted_room_nights * group_rate * deposit_interim_pct / 100, 2)"
      refund_beyond_damages: "max(deposit_held - amount, 0)"

  - id: group_cutoff
    subject: [group_cutoff_release]
    rule: >-
      On the cut-off date every held room night not yet reserved by an attendee is released to general
      inventory when cutoff_release_full is true; the release equals held_room_nights less the room
      nights reserved inside the block at that moment. Unreserved rooms are released only once the
      block's cut-off date has been reached. The release is made on the cut-off date itself, counted in
      hotel local calendar days; rooms are still held for the whole of the day before. Attendees who
      book after cut-off pay the hotel's prevailing rate subject to availability, unless
      after_cutoff_group_rate_honored is true, in which case they receive the group rate while rooms
      remain. The release does not reduce contracted_room_nights: attrition is still measured against
      the contract. When a tentative block lapses or a definite contract is cancelled, all room nights
      still held are released on that date with entry_basis contract_cancelled. Releases are recorded
      only for a block whose status is definite or cancelled.
    eligibility:
      - id: cutoff_reached
        applies_to: [group_cutoff_release]
        kind: time
        condition: "Unreserved rooms are released only once the block's cut-off date has been reached."
        evidence_fields: [group_blocks.cutoff_date, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the block's cut-off date"
          anchor_source: group_blocks.cutoff_date
          relation: not_before
          duration_source: params.release_offset_days
          unit: calendar_days
          counting_rule: "The release is made on the cut-off date itself, counted in hotel local calendar days; rooms are still held for the whole of the day before."
          boundary: inclusive
      - id: releasable_state
        applies_to: [group_cutoff_release]
        kind: state
        condition: "Releases are recorded only for a block whose status is definite or cancelled."
        evidence_fields: [group_blocks.status, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
        state_contract:
          field: group_blocks.status
          allowed: [definite, cancelled]
    params:
      release_offset_days: 0

  - id: group_addenda
    subject: [group_block_amend, group_block_increase, group_block_reduce]
    rule: >-
      The contracted room nights of a definite block change only through an addendum that the
      organiser signs; guest services may issue the addendum, but it takes effect only once its status
      is signed, and each signed addendum is implemented once, by one block update and one ledger
      entry naming it. A block is amended only while its status is definite. Added room nights are
      subject to the hotel's availability when block_increase_subject_to_availability is true, and an
      increase addendum is issued only for rooms group sales has confirmed. A reduction is accepted
      only if all reductions signed for the block, including this one, total no more than
      free_reduction_pct percent of the room nights contracted at signing. A reduction addendum must
      be signed no later than free_reduction_deadline_days calendar days before the block's arrival
      date. Days are counted as whole calendar days back from the arrival date; an addendum signed
      exactly free_reduction_deadline_days days before arrival is accepted. A reduced block keeps its
      group rate, and the attrition commitment is then computed on the reduced contracted room nights.
      Reductions beyond the allowance or after the deadline are not accepted; the shortfall is then
      settled under the attrition clause after the event. No addendum is implemented twice.
    eligibility:
      - id: definite_only
        applies_to: [group_block_amend, group_block_increase, group_block_reduce]
        kind: state
        condition: "A block is amended only while its status is definite."
        evidence_fields: [group_blocks.status, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
        state_contract:
          field: group_blocks.status
          allowed: [definite]
      - id: addendum_signed
        applies_to: [group_block_amend, group_block_increase, group_block_reduce]
        kind: authorization
        condition: "The contracted room nights of a definite block change only through an addendum that the organiser signs; guest services may issue the addendum, but it takes effect only once its status is signed, and each signed addendum is implemented once, by one block update and one ledger entry naming it."
        evidence_fields: [group_amendments.status, group_amendments.amendment_id, group_amendments.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_amendments.amendment_id]
          action_bindings:
            group_amendments.amendment_id: amendment_id
      - id: reduction_allowance
        applies_to: [group_block_reduce]
        kind: authorization
        condition: "A reduction is accepted only if all reductions signed for the block, including this one, total no more than free_reduction_pct percent of the room nights contracted at signing."
        evidence_fields: [group_ledger.group_block_id, group_ledger.event_type, group_ledger.room_nights]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_ledger.group_block_id]
          action_bindings:
            group_ledger.group_block_id: group_block_id
      - id: reduction_deadline
        applies_to: [group_block_reduce]
        kind: time
        condition: "A reduction addendum must be signed no later than free_reduction_deadline_days calendar days before the block's arrival date."
        evidence_fields: [group_blocks.arrival_date, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the block's arrival date"
          anchor_source: group_blocks.arrival_date
          relation: not_after
          duration_source: variants.free_reduction_deadline_days
          unit: calendar_days
          counting_rule: "Days are counted as whole calendar days back from the arrival date; an addendum signed exactly free_reduction_deadline_days days before arrival is accepted."
          boundary: inclusive
      - id: implemented_once
        applies_to: [group_block_increase, group_block_reduce]
        kind: dedup
        condition: "No addendum is implemented twice."
        evidence_fields: [group_ledger.amendment_id, group_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_ledger.amendment_id]
          action_bindings:
            group_ledger.amendment_id: amendment_id
        dedup_contract:
          table: group_ledger
          mode: separate_record
          object_bindings: {amendment_id: amendment_id}
          duplicate_filters: {event_type: [group_block_increase, group_block_reduce]}
          distinct_fields: []
    params:
      per_tier:
        "Social Event Room Block": {reduction_pct: "=free_reduction_pct", deadline_days: "=free_reduction_deadline_days"}
        "Wedding Room Block": {reduction_pct: "=free_reduction_pct", deadline_days: "=free_reduction_deadline_days"}
        "Sports Team Room Block": {reduction_pct: "=free_reduction_pct", deadline_days: "=free_reduction_deadline_days"}
        "Tour & Travel Series Block": {reduction_pct: "=free_reduction_pct", deadline_days: "=free_reduction_deadline_days"}
        "Corporate Meeting Room Block": {reduction_pct: "=free_reduction_pct", deadline_days: "=free_reduction_deadline_days"}
        "Association Convention Room Block": {reduction_pct: "=free_reduction_pct", deadline_days: "=free_reduction_deadline_days"}

  - id: group_attrition
    subject: [group_attrition_charge]
    rule: >-
      After the event the group's pickup, counted with group_msr_pickup_room_nights, is compared with
      its performance commitment: contracted_room_nights times (100 less attrition_allowance_pct)
      percent, rounded down to a whole room night. When pickup is below the commitment, the shortfall
      room nights times the group rate times attrition_charge_pct percent, rounded to the cent, is
      charged to the master account as attrition; no tax is added when attrition_includes_tax is false
      and no credit is given for rooms the hotel resold when resell_credit_applies is false. When
      pickup meets or exceeds the commitment nothing is charged. Attrition is assessed only once the
      block's status is actualized, and a block is charged attrition at most once. A cancelled block
      is never charged attrition; its damages follow group_cancellation instead.
    eligibility:
      - id: actualized_only
        applies_to: [group_attrition_charge]
        kind: state
        condition: "Attrition is assessed only once the block's status is actualized, and a block is charged attrition at most once."
        evidence_fields: [group_blocks.status, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
        state_contract:
          field: group_blocks.status
          allowed: [actualized]
    params:
      per_tier:
        "Social Event Room Block": {allowance_pct: "=attrition_allowance_pct", charge_pct: "=attrition_charge_pct"}
        "Wedding Room Block": {allowance_pct: "=attrition_allowance_pct", charge_pct: "=attrition_charge_pct"}
        "Sports Team Room Block": {allowance_pct: "=attrition_allowance_pct", charge_pct: "=attrition_charge_pct"}
        "Tour & Travel Series Block": {allowance_pct: "=attrition_allowance_pct", charge_pct: "=attrition_charge_pct"}
        "Corporate Meeting Room Block": {allowance_pct: "=attrition_allowance_pct", charge_pct: "=attrition_charge_pct"}
        "Association Convention Room Block": {allowance_pct: "=attrition_allowance_pct", charge_pct: "=attrition_charge_pct"}
    measures: [group_msr_pickup_room_nights]
    formula:
      commitment: "contracted_room_nights * (100 - attrition_allowance_pct) / 100"
      shortfall: "max(commitment - group_msr_pickup_room_nights, 0)"
      amount: "round(shortfall * group_rate * attrition_charge_pct / 100, 2)"

  - id: group_cancellation
    subject: [group_contract_cancel, group_cancellation_charge]
    rule: >-
      The organiser cancels a definite contract only by signing a written cancellation notice when
      contract_cancellation_notice_written is true; a cancellation request by phone is taken as the
      start of that notice and has no effect until it is signed. Cancellation damages are the
      contracted room nights times the group rate times the cancellation_scale percentage for the
      number of calendar days between the date the signed notice is received and the arrival date,
      rounded to the cent. Days are counted as whole calendar days from the notice date to the arrival
      date; the first step of cancellation_scale, read from the top, whose days_from is not greater than
      that count applies. When elimination_waiver is true and the notice is received within
      elimination_notice_hours of the team's elimination from its tournament, no damages are charged and
      every deposit is refunded; the elimination is shown by the tournament's published results the
      organiser provides. Deposits held are retained toward the damages under group_deposit_schedule.
      Damages are charged only on a block whose status is cancelled, at most once. A tentative block
      that lapses carries no damages.
    eligibility:
      - id: signed_notice
        applies_to: [group_contract_cancel]
        kind: caller_fact
        condition: "The organiser cancels a definite contract only by signing a written cancellation notice when contract_cancellation_notice_written is true; a cancellation request by phone is taken as the start of that notice and has no effect until it is signed."
        evidence_fields: [group_blocks.group_block_id, group_blocks.customer_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
      - id: cancelled_once
        applies_to: [group_cancellation_charge]
        kind: state
        condition: "Damages are charged only on a block whose status is cancelled, at most once."
        evidence_fields: [group_blocks.status, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
        state_contract:
          field: group_blocks.status
          allowed: [cancelled]
    params:
      per_tier:
        "Social Event Room Block": {scale: "=cancellation_scale", waiver: "=elimination_waiver"}
        "Wedding Room Block": {scale: "=cancellation_scale", waiver: "=elimination_waiver"}
        "Sports Team Room Block": {scale: "=cancellation_scale", waiver: "=elimination_waiver"}
        "Tour & Travel Series Block": {scale: "=cancellation_scale", waiver: "=elimination_waiver"}
        "Corporate Meeting Room Block": {scale: "=cancellation_scale", waiver: "=elimination_waiver"}
        "Association Convention Room Block": {scale: "=cancellation_scale", waiver: "=elimination_waiver"}
    formula:
      anticipated_room_revenue: "contracted_room_nights * group_rate"

  - id: group_comp_rooms
    subject: [group_comp_credit]
    rule: >-
      The group earns one complimentary room night for every comp_room_ratio paid room nights of
      pickup, counted cumulatively over the whole block when comps_cumulative is true and rounded down
      to whole room nights, up to max_comp_room_nights. Paid room nights are the pickup counted with
      group_msr_pickup_room_nights. Each complimentary room night is credited to the master account at
      the group rate, without tax when comp_credit_includes_tax is false. Complimentary credits are
      posted only once the block's status is actualized, once per block. The credit can reduce the
      master balance to zero but is never paid out in cash.
    eligibility:
      - id: actualized_only
        applies_to: [group_comp_credit]
        kind: state
        condition: "Complimentary credits are posted only once the block's status is actualized, once per block."
        evidence_fields: [group_blocks.status, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
        state_contract:
          field: group_blocks.status
          allowed: [actualized]
    params:
      per_tier:
        "Social Event Room Block": {ratio: "=comp_room_ratio", cap: "=max_comp_room_nights"}
        "Wedding Room Block": {ratio: "=comp_room_ratio", cap: "=max_comp_room_nights"}
        "Sports Team Room Block": {ratio: "=comp_room_ratio", cap: "=max_comp_room_nights"}
        "Tour & Travel Series Block": {ratio: "=comp_room_ratio", cap: "=max_comp_room_nights"}
        "Corporate Meeting Room Block": {ratio: "=comp_room_ratio", cap: "=max_comp_room_nights"}
        "Association Convention Room Block": {ratio: "=comp_room_ratio", cap: "=max_comp_room_nights"}
    measures: [group_msr_pickup_room_nights]
    formula:
      comp_nights: "min(group_msr_pickup_room_nights / comp_room_ratio, max_comp_room_nights)"
      amount: "comp_nights * group_rate"

  - id: group_master_account
    subject: [group_master_room_charge, group_master_payment, group_actualize, group_close]
    rule: >-
      Room nights are billed to the master account only for block types whose master_account_allowed
      is true and only for the rooms the organiser designated on the contract; other attendees pay
      their own folios; the room nights billed this way are counted with
      group_msr_master_billed_room_nights and never exceed the pickup. The block is actualized by the system after its departure date, when the
      deposits held are applied to the master account. Organiser payments reduce the master account;
      when direct_bill_eligible is true the master account is invoiced after the event and due within
      master_payment_due_days calendar days, otherwise it is settled by card at departure. A master
      account entry is posted only on a block whose status is definite, actualized or cancelled. The
      file is closed only when master_balance is zero. A credit balance on the master account is
      refunded to the organiser's payment card and never carried to another block.
    eligibility:
      - id: billable_state
        applies_to: [group_master_room_charge, group_master_payment]
        kind: state
        condition: "A master account entry is posted only on a block whose status is definite, actualized or cancelled."
        evidence_fields: [group_blocks.status, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
        state_contract:
          field: group_blocks.status
          allowed: [definite, actualized, cancelled]
      - id: zero_balance_close
        applies_to: [group_close]
        kind: authorization
        condition: "The file is closed only when master_balance is zero."
        evidence_fields: [group_blocks.master_balance, group_blocks.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [group_blocks.group_block_id]
          action_bindings:
            group_blocks.group_block_id: group_block_id
    measures: [group_msr_master_billed_room_nights]

extended_policies:
  - id: group_ext_reduction_room_nights
    base_policy_refs: [group_addenda]
    overwrite:
      - base_policy: group_addenda
        superseded_clause: >-
          A reduction is accepted only if all reductions signed for the block, including this one, total no
          more than free_reduction_pct percent of the room nights contracted at signing.
        replaced_by: >-
          A signed reduction addendum is implemented for the room nights it requests, up to the free-reduction
          allowance still open on the block.
      - base_policy: group_addenda
        superseded_clause: >-
          Reductions beyond the allowance or after the deadline are not accepted; the shortfall is then settled
          under the attrition clause after the event.
        replaced_by: >-
          Room nights an addendum requests beyond the allowance still open are not removed: they stay in the
          contracted room nights and any shortfall on them is settled under the attrition clause after the
          event, and a reduction addendum signed after the free-reduction deadline is not implemented at all.
    trigger: state_due
    subject: [group_block_amend, group_block_reduce]
    computes: room_nights_removed
    target_tool: implement_block_reduction_df5160bf
    params:
      early_reduction_days: 180
      mid_reduction_days: 120
      early_reduction_multiplier: 2
      mid_reduction_multiplier: 1.5
      return_period_days: 30
      second_period_days: 60
      increase_window_days: 90
      late_increase_share: 0.5
      platinum_courtesy_nights: 4
      gold_courtesy_nights: 2
      min_recent_stays: 3
      early_reduction_weight: 0.5
      mid_reduction_weight: 0.75
    rule: >-
      A signed reduction addendum on a definite block is implemented by one reduction entry on the block
      ledger that names the addendum, together with one block update that lowers the contracted room nights
      and the held room nights by the room nights that entry removes; each signed addendum is implemented
      once. The addendum implemented is the most recently issued reduction addendum whose status is signed, and the room
      nights it requests are the requested room nights written on it.
      A signed reduction addendum is implemented for the room nights it requests, up to the free-reduction
      allowance still open on the block.
      The free-reduction allowance is the reduction percentage of the room nights the allowance is measured
      on, rounded down to a whole room night, plus the courtesy room nights.
      The reduction percentage is free_reduction_pct, the room nights the allowance is measured on are the
      room nights of the block's allocation entry, which are the room nights contracted at signing, and the
      courtesy room nights are none.
      The allowance still open is the free-reduction allowance less the earlier reductions counted against
      it, rounded down to a whole room night and never below zero, and the earlier reductions counted against
      it are the room nights of the reduction entries already on the block ledger, counted in full.
      The room nights removed are the lesser of the room nights the addendum requests and the allowance still
      open.
      Room nights an addendum requests beyond the allowance still open are not removed: they stay in the
      contracted room nights and any shortfall on them is settled under the attrition clause after the event, and
      a reduction addendum signed after the free-reduction deadline is not implemented at all.
      The days before arrival of a reduction are counted as whole calendar days to the block's arrival date
      from the date the addendum is implemented.
      The reduction percentage follows how early the reduction comes and how the signing deposit was paid:
      when the days before arrival of the reduction are early_reduction_days or more and the signing deposit
      entry is dated no more than signing_deposit_due_days calendar days after the proposal date, the reduction
      percentage is free_reduction_pct times early_reduction_multiplier; when those days are at least
      mid_reduction_days but fewer than early_reduction_days and the signing deposit entry is so dated, it is
      free_reduction_pct times mid_reduction_multiplier; in every other case, including a block with no
      signing deposit entry, it is free_reduction_pct.
      The day from which the days before arrival of a reduction are counted follows the addendum's return:
      when the addendum was issued no more than return_period_days calendar days before the date it is
      implemented, the days are counted from its issue date; when it was issued more than return_period_days
      but no more than second_period_days calendar days before that date, they are counted from the day
      return_period_days calendar days after its issue date; when it was issued earlier than that, they are
      counted from the date the addendum is implemented.
      The room nights the allowance is measured on follow the block's increases: when the block carries
      increase entries and the latest of them is dated no more than increase_window_days calendar days after
      the contract was signed, they are the room nights contracted at signing plus all the room nights of
      those increase entries; when the latest increase entry is dated later than that, they are the room
      nights contracted at signing plus late_increase_share of the room nights of the increase entries; when
      the block carries no increase entry, they are the room nights contracted at signing alone.
      The courtesy room nights follow the organiser's Ashbury Rewards standing: when the organiser's
      membership is active at Ashbury Rewards Platinum Elite, Ashbury Rewards Titanium Elite or Ashbury
      Rewards Ambassador Elite and carries at least min_recent_stays base-point stay credits posted in the
      last 24 months, they are platinum_courtesy_nights; when the membership is active at Ashbury Rewards Gold
      Elite and carries at least min_recent_stays such credits, they are gold_courtesy_nights; in every other
      case there are none.
      The earlier reductions counted against the allowance follow when the latest earlier reduction was made:
      when the block carries earlier reduction entries and the latest of them is dated early_reduction_days or
      more calendar days before the arrival date, their room nights count at early_reduction_weight; when the
      latest is dated at least mid_reduction_days but fewer than early_reduction_days calendar days before the
      arrival date, they count at mid_reduction_weight; when it is dated later than that, or the block carries
      no earlier reduction entry, they count in full.
    prerequisite: []
    cross_category:
      - category: loyalty
        as: branch
        reads: [variant_name, status, loyalty_transactions.event_type, loyalty_transactions.earning_source, loyalty_transactions.posted_date]
        note: The courtesy room nights are decided by the organiser's membership tier and the base-point stay credits on the organiser's Ashbury Rewards ledger in the last 24 months.
    inputs:
      history:
        - {table: group_amendments, aggregate: latest, field: requested_room_nights, filters: {status: signed, amendment_type: room_night_reduction}}
        - {table: group_amendments, aggregate: latest, field: created_at, filters: {status: signed, amendment_type: room_night_reduction}}
        - {table: group_ledger, aggregate: latest, field: entry_date, filters: {event_type: group_deposit_receive, entry_basis: deposit_signing}}
        - {table: group_ledger, aggregate: sum, field: room_nights, filters: {event_type: group_block_allocate}}
        - {table: group_ledger, aggregate: sum, field: room_nights, filters: {event_type: group_block_increase}}
        - {table: group_ledger, aggregate: sum, field: room_nights, filters: {event_type: group_block_reduce}}
        - {category: loyalty, table: loyalty_transactions, aggregate: count, field: transaction_id, within_months: 24, filters: {event_type: loyalty_points_earn, earning_source: stay_base}}
      cross_category: [loyalty]
    compute:
      - issued_at: "LATEST('group_amendments', 'created_at', date_field='created_at', status='signed', amendment_type='room_night_reduction')"
      - requested: "LATEST('group_amendments', 'requested_room_nights', date_field='created_at', status='signed', amendment_type='room_night_reduction')"
      - days_since_issue: "DAYS(issued_at, NOW)"
      - reduction_lead_days: "DAYS(issued_at, F('arrival_date')) if days_since_issue <= K('return_period_days') else (DAYS(issued_at, F('arrival_date')) - K('return_period_days') if days_since_issue <= K('second_period_days') else DAYS(NOW, F('arrival_date')))"
      - signing_deposit_date: "LATEST('group_ledger', 'entry_date', date_field='entry_date', event_type='group_deposit_receive', entry_basis='deposit_signing')"
      - signing_deposit_on_time: "COUNT('group_ledger', event_type='group_deposit_receive', entry_basis='deposit_signing') > 0 and DAYS(F('proposal_date'), signing_deposit_date) <= P('signing_deposit_due_days')"
      - reduction_pct: "P('free_reduction_pct') * K('early_reduction_multiplier') if reduction_lead_days >= K('early_reduction_days') and signing_deposit_on_time else (P('free_reduction_pct') * K('mid_reduction_multiplier') if reduction_lead_days >= K('mid_reduction_days') and signing_deposit_on_time else P('free_reduction_pct'))"
      - signing_nights: "SUM('group_ledger', 'room_nights', event_type='group_block_allocate')"
      - increase_nights: "SUM('group_ledger', 'room_nights', event_type='group_block_increase')"
      - last_increase_date: "LATEST('group_ledger', 'entry_date', date_field='entry_date', event_type='group_block_increase')"
      - measured_nights: "signing_nights + increase_nights if increase_nights > 0 and DAYS(F('contract_signed_date'), last_increase_date) <= K('increase_window_days') else (signing_nights + increase_nights * K('late_increase_share') if increase_nights > 0 else signing_nights)"
      - loyalty_tier: "CFIELD('loyalty', 'variant_name', status='active')"
      - recent_stays: "XCOUNT('loyalty', 'loyalty_transactions', within_months=24, date_field='posted_date', event_type='loyalty_points_earn', earning_source='stay_base')"
      - courtesy_nights: "K('platinum_courtesy_nights') if (loyalty_tier == 'Ashbury Rewards Platinum Elite' or loyalty_tier == 'Ashbury Rewards Titanium Elite' or loyalty_tier == 'Ashbury Rewards Ambassador Elite') and recent_stays >= K('min_recent_stays') else (K('gold_courtesy_nights') if loyalty_tier == 'Ashbury Rewards Gold Elite' and recent_stays >= K('min_recent_stays') else 0)"
      - allowance: "int(measured_nights * reduction_pct / 100) + courtesy_nights"
      - prior_nights: "SUM('group_ledger', 'room_nights', event_type='group_block_reduce')"
      - last_prior_date: "LATEST('group_ledger', 'entry_date', date_field='entry_date', event_type='group_block_reduce')"
      - prior_counted: "prior_nights * K('early_reduction_weight') if prior_nights > 0 and DAYS(last_prior_date, F('arrival_date')) >= K('early_reduction_days') else (prior_nights * K('mid_reduction_weight') if prior_nights > 0 and DAYS(last_prior_date, F('arrival_date')) >= K('mid_reduction_days') else prior_nights)"
      - open_allowance: "MX(int(allowance - prior_counted), 0)"
      - result: "MN(requested, open_allowance)"
    compute_basis:
      issued_at: "The addendum implemented is the most recently issued reduction addendum whose status is signed, and the room nights it requests are the requested room nights written on it."
      requested: "The addendum implemented is the most recently issued reduction addendum whose status is signed, and the room nights it requests are the requested room nights written on it."
      days_since_issue: "when the addendum was issued no more than return_period_days calendar days before the date it is implemented, the days are counted from its issue date"
      reduction_lead_days: "The day from which the days before arrival of a reduction are counted follows the addendum's return: when the addendum was issued no more than return_period_days calendar days before the date it is implemented, the days are counted from its issue date; when it was issued more than return_period_days but no more than second_period_days calendar days before that date, they are counted from the day return_period_days calendar days after its issue date; when it was issued earlier than that, they are counted from the date the addendum is implemented."
      signing_deposit_date: "the signing deposit entry is dated no more than signing_deposit_due_days calendar days after the proposal date"
      signing_deposit_on_time: "in every other case, including a block with no signing deposit entry, it is free_reduction_pct."
      reduction_pct: "The reduction percentage follows how early the reduction comes and how the signing deposit was paid: when the days before arrival of the reduction are early_reduction_days or more and the signing deposit entry is dated no more than signing_deposit_due_days calendar days after the proposal date, the reduction percentage is free_reduction_pct times early_reduction_multiplier; when those days are at least mid_reduction_days but fewer than early_reduction_days and the signing deposit entry is so dated, it is free_reduction_pct times mid_reduction_multiplier; in every other case, including a block with no signing deposit entry, it is free_reduction_pct."
      signing_nights: "the room nights the allowance is measured on are the room nights of the block's allocation entry, which are the room nights contracted at signing"
      increase_nights: "they are the room nights contracted at signing plus all the room nights of those increase entries"
      last_increase_date: "when the block carries increase entries and the latest of them is dated no more than increase_window_days calendar days after the contract was signed"
      measured_nights: "The room nights the allowance is measured on follow the block's increases: when the block carries increase entries and the latest of them is dated no more than increase_window_days calendar days after the contract was signed, they are the room nights contracted at signing plus all the room nights of those increase entries; when the latest increase entry is dated later than that, they are the room nights contracted at signing plus late_increase_share of the room nights of the increase entries; when the block carries no increase entry, they are the room nights contracted at signing alone."
      loyalty_tier: "when the organiser's membership is active at Ashbury Rewards Platinum Elite, Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite"
      recent_stays: "carries at least min_recent_stays base-point stay credits posted in the last 24 months"
      courtesy_nights: "The courtesy room nights follow the organiser's Ashbury Rewards standing: when the organiser's membership is active at Ashbury Rewards Platinum Elite, Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite and carries at least min_recent_stays base-point stay credits posted in the last 24 months, they are platinum_courtesy_nights; when the membership is active at Ashbury Rewards Gold Elite and carries at least min_recent_stays such credits, they are gold_courtesy_nights; in every other case there are none."
      allowance: "The free-reduction allowance is the reduction percentage of the room nights the allowance is measured on, rounded down to a whole room night, plus the courtesy room nights."
      prior_nights: "the earlier reductions counted against it are the room nights of the reduction entries already on the block ledger, counted in full"
      last_prior_date: "when the block carries earlier reduction entries and the latest of them is dated early_reduction_days or more calendar days before the arrival date"
      prior_counted: "The earlier reductions counted against the allowance follow when the latest earlier reduction was made: when the block carries earlier reduction entries and the latest of them is dated early_reduction_days or more calendar days before the arrival date, their room nights count at early_reduction_weight; when the latest is dated at least mid_reduction_days but fewer than early_reduction_days calendar days before the arrival date, they count at mid_reduction_weight; when it is dated later than that, or the block carries no earlier reduction entry, they count in full."
      open_allowance: "The allowance still open is the free-reduction allowance less the earlier reductions counted against it, rounded down to a whole room night and never below zero"
      result: "The room nights removed are the lesser of the room nights the addendum requests and the allowance still open."
    factors:
      - id: reduction_percentage
        effect: parameter
        decides: reduction_pct
        bindings: [signing_deposit_date, signing_deposit_on_time, reduction_pct]
        ladder:
          - when: "the days before arrival of the reduction are early_reduction_days or more AND the signing deposit entry is dated within signing_deposit_due_days calendar days of the proposal date"
            value: "P('free_reduction_pct') * K('early_reduction_multiplier')"
          - when: "the days before arrival of the reduction are at least mid_reduction_days but fewer than early_reduction_days AND the signing deposit entry is so dated"
            value: "P('free_reduction_pct') * K('mid_reduction_multiplier')"
          - when: "otherwise (including a block with no signing deposit entry)"
            value: "P('free_reduction_pct')"
        baseline:
          reduction_pct: "P('free_reduction_pct')"
        evidence: [date, history, tier_param]
        cross_difficulty: null
      - id: reduction_count_start
        effect: method
        decides: reduction_lead_days
        bindings: [days_since_issue, reduction_lead_days]
        ladder:
          - when: "the addendum was issued no more than return_period_days calendar days before it is implemented"
            method: "the days before arrival are counted from the addendum's issue date"
          - when: "the addendum was issued more than return_period_days but no more than second_period_days calendar days before it is implemented"
            method: "the days before arrival are counted from the day return_period_days calendar days after the issue date"
          - when: "otherwise"
            method: "the days before arrival are counted from the date the addendum is implemented"
        baseline:
          reduction_lead_days: "DAYS(NOW, F('arrival_date'))"
        evidence: [date, history]
        cross_difficulty: null
      - id: allowance_measure
        effect: parameter
        decides: measured_nights
        bindings: [increase_nights, last_increase_date, measured_nights]
        ladder:
          - when: "the block carries increase entries and the latest is dated no more than increase_window_days calendar days after signing"
            value: "the room nights contracted at signing plus all increase room nights"
          - when: "the latest increase entry is dated later than increase_window_days calendar days after signing"
            value: "the room nights contracted at signing plus late_increase_share of the increase room nights"
          - when: "otherwise (no increase entry)"
            value: "the room nights contracted at signing"
        baseline:
          measured_nights: "signing_nights"
        evidence: [history, date]
        cross_difficulty: null
      - id: courtesy_room_nights
        effect: parameter
        decides: courtesy_nights
        bindings: [loyalty_tier, recent_stays, courtesy_nights]
        ladder:
          - when: "the organiser's active membership is Platinum, Titanium or Ambassador Elite AND carries at least min_recent_stays base-point stay credits in the last 24 months"
            value: "K('platinum_courtesy_nights')"
          - when: "the organiser's active membership is Gold Elite AND carries at least min_recent_stays such credits"
            value: "K('gold_courtesy_nights')"
          - when: "otherwise"
            value: "0"
        baseline:
          courtesy_nights: "0"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: earlier_reduction_weight
        effect: parameter
        decides: prior_counted
        bindings: [prior_nights, last_prior_date, prior_counted]
        ladder:
          - when: "the latest earlier reduction entry is dated early_reduction_days or more calendar days before arrival"
            value: "K('early_reduction_weight')"
          - when: "the latest earlier reduction entry is dated at least mid_reduction_days but fewer than early_reduction_days calendar days before arrival"
            value: "K('mid_reduction_weight')"
          - when: "otherwise (later, or no earlier reduction entry)"
            value: "1 (in full)"
        baseline:
          prior_counted: "prior_nights"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        A signed reduction addendum is implemented for the room nights it requests, up to the free-reduction
        allowance still open on the block. The free-reduction allowance is the reduction percentage of the room
        nights the allowance is measured on, rounded down to a whole room night, plus the courtesy room nights.
        The reduction percentage is free_reduction_pct, the room nights the allowance is measured on are the
        room nights of the block's allocation entry, which are the room nights contracted at signing, and the
        courtesy room nights are none. The allowance still open is the free-reduction allowance less the
        earlier reductions counted against it, rounded down to a whole room night and never below zero, and
        the earlier reductions counted against it are the room nights of the reduction entries already on the
        block ledger, counted in full. The room nights removed are the lesser of the room nights the addendum
        requests and the allowance still open. The days before arrival of a reduction are counted as whole
        calendar days to the block's arrival date from the date the addendum is implemented.
      params: [free_reduction_pct]

  - id: group_ext_interim_deposit_amount
    base_policy_refs: [group_deposit_schedule]
    overwrite:
      - base_policy: group_deposit_schedule
        superseded_clause: >-
          Each scheduled deposit is received once.
        replaced_by: >-
          each kind of scheduled deposit is received at most once on a block, so a block whose ledger already carries
          a receipt of the signing kind or of the interim kind takes no second receipt of that kind.
      - base_policy: group_deposit_schedule
        superseded_clause: >-
          and the interim deposit is deposit_interim_pct percent
        replaced_by: >-
          The interim percentage is first adjusted by the late-receipt load, the reduction exposure load and the
          event-deposit relief, both loads added and the relief subtracted, giving the applicable interim percentage.
      - base_policy: group_deposit_schedule
        superseded_clause: >-
          Deposits are a percentage of anticipated room revenue, the contracted room nights times the group rate,
          rounded to the cent
        replaced_by: >-
          How the applicable interim percentage turns into the amount follows the block's reductions and how the
          signing deposit was paid: when the block ledger carries reduction entries and the signing deposit entry
          is dated no more than signing_deposit_due_days calendar days after the proposal date, the interim deposit
          is the applicable interim percentage plus deposit_signing_pct, applied to the anticipated room revenue,
          less all the deposits received on the block ledger, so that the part of the signing deposit above the
          signing percentage of the reduced revenue is credited; when the block ledger carries reduction entries
          and the signing deposit entry is dated later than that or there is no signing deposit entry, the interim
          deposit is the applicable interim percentage applied to the room nights contracted at signing, which are
          the room nights of the block's allocation entry, times the group rate; when the block ledger carries no
          reduction entry, the interim deposit is the applicable interim percentage applied to the anticipated room
          revenue.
    trigger: on_request
    subject: [group_deposit_receive]
    computes: deposit_amount
    target_tool: pay_group_deposit_93013531
    params:
      late_grace_days: 14
      late_load_high_points: 5
      late_load_low_points: 2.5
      event_deposit_floor_usd: 3000
      event_relief_high_points: 5
      event_relief_low_points: 2.5
      high_exposure_pct: 15
      low_exposure_pct: 5
      exposure_load_high_points: 5
      exposure_load_low_points: 2.5
    rule: >-
      The organiser pays the interim deposit of a tentative or definite block personally, with the card on their
      profile, once guest services has quoted the amount; the payment is one deposit receipt with the interim basis
      on the block ledger, it raises the deposit held by the amount paid, and each kind of scheduled deposit is
      received at most once on a block, so a block whose ledger already carries a receipt of the signing kind or of
      the interim kind takes no second receipt of that kind.
      The interim deposit is worked out only after every signed room-night reduction addendum on the block is
      matched by a reduction entry on the block ledger that names it.
      The interim deposit is the interim percentage applied to the anticipated room revenue, and the anticipated
      room revenue is the contracted room nights times the group rate.
      The interim percentage is deposit_interim_pct, and the interim deposit is rounded to the cent once, on the
      final amount, and is never below zero.
      The interim percentage is first adjusted by the late-receipt load, the reduction exposure load and the
      event-deposit relief, both loads added and the relief subtracted, giving the applicable interim percentage.
      The days past due of an interim deposit are the whole calendar days from its due date, which is
      deposit_interim_days_before_arrival calendar days before the arrival date, to the date it is paid; an
      interim deposit paid on or before its due date has no days past due.
      The late-receipt load follows the days past due: when they are more than late_grace_days, the load is
      late_load_high_points percentage points; when there is at least one day past due but no more than
      late_grace_days, it is late_load_low_points percentage points; when the deposit is paid by its due date,
      there is no load.
      The event-deposit relief follows the organiser's Meetings & Events contract linked to the block: when that
      contract is definite and the deposit it holds is at least event_deposit_floor_usd, the relief is
      event_relief_high_points percentage points; when that contract is definite and the deposit it holds is
      below event_deposit_floor_usd, the relief is event_relief_low_points percentage points; when the organiser
      holds no definite event contract linked to the block, there is no relief.
      The reduction exposure load follows how far signed reductions have already shrunk the contract, counted as
      the room nights of the block's reduction entries against the room nights of its allocation entry: when they
      are at least high_exposure_pct percent of the allocation, the load is exposure_load_high_points percentage
      points; when they are at least low_exposure_pct percent but below high_exposure_pct percent, it is
      exposure_load_low_points percentage points; below low_exposure_pct percent there is no load.
      How the applicable interim percentage turns into the amount follows the block's reductions and how the
      signing deposit was paid: when the block ledger carries reduction entries and the signing deposit entry
      is dated no more than signing_deposit_due_days calendar days after the proposal date, the interim deposit
      is the applicable interim percentage plus deposit_signing_pct, applied to the anticipated room revenue,
      less all the deposits received on the block ledger, so that the part of the signing deposit above the
      signing percentage of the reduced revenue is credited; when the block ledger carries reduction entries
      and the signing deposit entry is dated later than that or there is no signing deposit entry, the interim
      deposit is the applicable interim percentage applied to the room nights contracted at signing, which are
      the room nights of the block's allocation entry, times the group rate; when the block ledger carries no
      reduction entry, the interim deposit is the applicable interim percentage applied to the anticipated room
      revenue.
    prerequisite:
      - problem: group_ext_reduction_room_nights
        kind: value_input
        gate: revenue
        form: state
        policy_source: >-
          The interim deposit is worked out only after every signed room-night reduction addendum on the block is
          matched by a reduction entry on the block ledger that names it.
        condition: >-
          Every group_amendments row of the block with amendment_type room_night_reduction and status signed is
          named by the amendment_id of a group_block_reduce entry on the block's group_ledger, so that
          group_blocks.contracted_room_nights already reflects every signed reduction.
        resolved_by: implement_block_reduction_df5160bf
        effect: >-
          Once the signed reduction is implemented the contracted room nights fall by the room nights it removes,
          so the anticipated room revenue (binding revenue) and with it the interim deposit fall.
    cross_category:
      - category: meeting
        as: branch
        reads: [status, deposit_held, group_block_id]
        note: The event-deposit relief is decided by the status and the deposit held of the organiser's Meetings & Events contract linked to the block.
    inputs:
      history:
        - {table: group_ledger, aggregate: sum, field: room_nights, filters: {event_type: group_block_allocate}}
        - {table: group_ledger, aggregate: count, field: group_entry_id, filters: {event_type: group_block_reduce}}
        - {table: group_ledger, aggregate: latest, field: entry_date, filters: {event_type: group_deposit_receive, entry_basis: deposit_signing}}
        - {table: group_ledger, aggregate: sum, field: amount, filters: {event_type: group_deposit_receive}}
        - {table: group_ledger, aggregate: sum, field: room_nights, filters: {event_type: group_block_reduce}}
      cross_category: [meeting]
    compute:
      - revenue: "F('contracted_room_nights') * F('group_rate')"
      - days_to_arrival: "DAYS(NOW, F('arrival_date'))"
      - days_past_due: "MX(P('deposit_interim_days_before_arrival') - days_to_arrival, 0)"
      - late_load: "K('late_load_high_points') if days_past_due > K('late_grace_days') else (K('late_load_low_points') if days_past_due > 0 else 0)"
      - event_status: "CFIELD('meeting', 'status', group_block_id=HID)"
      - event_deposit: "float(CFIELD('meeting', 'deposit_held', group_block_id=HID) or 0)"
      - event_relief: "K('event_relief_high_points') if event_status == 'definite' and event_deposit >= K('event_deposit_floor_usd') else (K('event_relief_low_points') if event_status == 'definite' and event_deposit < K('event_deposit_floor_usd') else 0)"
      - reduced_nights_total: "SUM('group_ledger', 'room_nights', event_type='group_block_reduce')"
      - exposure_base: "SUM('group_ledger', 'room_nights', event_type='group_block_allocate')"
      - exposure_load: "K('exposure_load_high_points') if reduced_nights_total * 100 >= exposure_base * K('high_exposure_pct') else (K('exposure_load_low_points') if reduced_nights_total * 100 >= exposure_base * K('low_exposure_pct') else 0)"
      - applicable_pct: "P('deposit_interim_pct') + late_load + exposure_load - event_relief"
      - reduction_entries: "COUNT('group_ledger', event_type='group_block_reduce')"
      - signing_deposit_date: "LATEST('group_ledger', 'entry_date', date_field='entry_date', event_type='group_deposit_receive', entry_basis='deposit_signing')"
      - signing_on_time: "COUNT('group_ledger', event_type='group_deposit_receive', entry_basis='deposit_signing') > 0 and DAYS(F('proposal_date'), signing_deposit_date) <= P('signing_deposit_due_days')"
      - deposits_received: "SUM('group_ledger', 'amount', event_type='group_deposit_receive')"
      - signing_nights: "SUM('group_ledger', 'room_nights', event_type='group_block_allocate')"
      - interim_amount: "(applicable_pct + P('deposit_signing_pct')) * revenue / 100 - deposits_received if reduction_entries > 0 and signing_on_time else (applicable_pct * signing_nights * F('group_rate') / 100 if reduction_entries > 0 else applicable_pct * revenue / 100)"
      - result: "RND(MX(interim_amount, 0), 2)"
    compute_basis:
      revenue: "the anticipated room revenue is the contracted room nights times the group rate."
      days_to_arrival: "The days past due of an interim deposit are the whole calendar days from its due date, which is deposit_interim_days_before_arrival calendar days before the arrival date, to the date it is paid"
      days_past_due: "an interim deposit paid on or before its due date has no days past due."
      late_load: "The late-receipt load follows the days past due: when they are more than late_grace_days, the load is late_load_high_points percentage points; when there is at least one day past due but no more than late_grace_days, it is late_load_low_points percentage points; when the deposit is paid by its due date, there is no load."
      event_status: "when that contract is definite and the deposit it holds is at least event_deposit_floor_usd"
      event_deposit: "when that contract is definite and the deposit it holds is at least event_deposit_floor_usd"
      event_relief: "The event-deposit relief follows the organiser's Meetings & Events contract linked to the block: when that contract is definite and the deposit it holds is at least event_deposit_floor_usd, the relief is event_relief_high_points percentage points; when that contract is definite and the deposit it holds is below event_deposit_floor_usd, the relief is event_relief_low_points percentage points; when the organiser holds no definite event contract linked to the block, there is no relief."
      reduced_nights_total: "counted as the room nights of the block's reduction entries against the room nights of its allocation entry"
      exposure_base: "counted as the room nights of the block's reduction entries against the room nights of its allocation entry"
      exposure_load: "The reduction exposure load follows how far signed reductions have already shrunk the contract, counted as the room nights of the block's reduction entries against the room nights of its allocation entry: when they are at least high_exposure_pct percent of the allocation, the load is exposure_load_high_points percentage points; when they are at least low_exposure_pct percent but below high_exposure_pct percent, it is exposure_load_low_points percentage points; below low_exposure_pct percent there is no load."
      applicable_pct: "The interim percentage is first adjusted by the late-receipt load, the reduction exposure load and the event-deposit relief, both loads added and the relief subtracted, giving the applicable interim percentage."
      reduction_entries: "when the block ledger carries reduction entries and the signing deposit entry is dated no more than signing_deposit_due_days calendar days after the proposal date"
      signing_deposit_date: "the signing deposit entry is dated no more than signing_deposit_due_days calendar days after the proposal date"
      signing_on_time: "when the block ledger carries reduction entries and the signing deposit entry is dated later than that or there is no signing deposit entry"
      deposits_received: "less all the deposits received on the block ledger"
      signing_nights: "the room nights contracted at signing, which are the room nights of the block's allocation entry"
      interim_amount: "How the applicable interim percentage turns into the amount follows the block's reductions and how the signing deposit was paid: when the block ledger carries reduction entries and the signing deposit entry is dated no more than signing_deposit_due_days calendar days after the proposal date, the interim deposit is the applicable interim percentage plus deposit_signing_pct, applied to the anticipated room revenue, less all the deposits received on the block ledger, so that the part of the signing deposit above the signing percentage of the reduced revenue is credited; when the block ledger carries reduction entries and the signing deposit entry is dated later than that or there is no signing deposit entry, the interim deposit is the applicable interim percentage applied to the room nights contracted at signing, which are the room nights of the block's allocation entry, times the group rate; when the block ledger carries no reduction entry, the interim deposit is the applicable interim percentage applied to the anticipated room revenue."
      result: "the interim deposit is rounded to the cent once, on the final amount, and is never below zero."
    factors:
      - id: late_receipt_load
        effect: parameter
        decides: late_load
        bindings: [days_to_arrival, days_past_due, late_load]
        ladder:
          - when: "the interim deposit is paid more than late_grace_days calendar days after its due date"
            value: "K('late_load_high_points') percentage points added"
          - when: "it is paid at least one but no more than late_grace_days calendar days after its due date"
            value: "K('late_load_low_points') percentage points added"
          - when: "otherwise (paid by its due date)"
            value: "no load"
        baseline:
          late_load: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: event_deposit_relief
        effect: parameter
        decides: event_relief
        bindings: [event_status, event_deposit, event_relief]
        ladder:
          - when: "the organiser's Meetings & Events contract linked to the block is definite AND the deposit it holds is at least event_deposit_floor_usd"
            value: "K('event_relief_high_points') percentage points subtracted"
          - when: "that contract is definite AND the deposit it holds is below event_deposit_floor_usd"
            value: "K('event_relief_low_points') percentage points subtracted"
          - when: "otherwise (no definite event contract linked to the block)"
            value: "no relief"
        baseline:
          event_relief: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: reduction_exposure_load
        effect: parameter
        decides: exposure_load
        bindings: [reduced_nights_total, exposure_base, exposure_load]
        ladder:
          - when: "the room nights of the block's reduction entries are at least high_exposure_pct percent of its allocation entry"
            value: "K('exposure_load_high_points') percentage points added"
          - when: "they are at least low_exposure_pct but below high_exposure_pct percent"
            value: "K('exposure_load_low_points') percentage points added"
          - when: "otherwise"
            value: "no load"
        baseline:
          exposure_load: "0"
        evidence: [history]
        cross_difficulty: null
      - id: deposit_true_up
        effect: method
        decides: interim_amount
        bindings: [reduction_entries, signing_deposit_date, signing_on_time, deposits_received, signing_nights, interim_amount]
        ladder:
          - when: "the block ledger carries reduction entries AND the signing deposit entry is dated within signing_deposit_due_days calendar days of the proposal date"
            method: "the applicable interim percentage plus deposit_signing_pct is applied to the anticipated room revenue and all deposits received are subtracted, crediting the signing deposit's excess over the reduced revenue"
          - when: "the block ledger carries reduction entries AND the signing deposit entry is dated later than that or is absent"
            method: "the applicable interim percentage is applied to the room nights contracted at signing (the allocation entry) times the group rate"
          - when: "otherwise (no reduction entry)"
            method: "the applicable interim percentage is applied to the anticipated room revenue"
        baseline:
          interim_amount: "applicable_pct * revenue / 100"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The interim deposit is the interim percentage applied to the anticipated room revenue, and the anticipated
        room revenue is the contracted room nights times the group rate. The interim percentage is
        deposit_interim_pct, and the interim deposit is rounded to the cent once, on the final amount, and is never
        below zero.
      params: [deposit_interim_pct]

  - id: group_ext_increase_commitment
    base_policy_refs: [group_addenda]
    overwrite: []
    trigger: state_due
    subject: [group_block_amend, group_block_increase]
    computes: committed_room_nights
    target_tool: implement_block_increase_5576c741
    params:
      return_period_days: 30
      second_period_days: 60
      near_window_days: 30
      late_commit_pct: 50
      near_commit_pct: 75
      full_commit_pct: 100
      strong_list_pct: 90
      fair_list_pct: 75
      strong_list_uplift: 25
      fair_list_uplift: 10
      long_after_cutoff_days: 3
      long_after_cutoff_cut: 20
      short_after_cutoff_cut: 10
      large_increase_pct: 25
      sizeable_increase_pct: 10
      large_increase_cut: 20
      sizeable_increase_cut: 10
    rule: >-
      A signed increase addendum on a definite block is implemented by one increase entry on the block ledger that
      names the addendum and carries every room night the addendum requests, together with one block update that
      raises the held room nights by those room nights and the contracted room nights by the committed room nights
      of the increase; each signed addendum is implemented once.
      The increase addendum implemented is the most recently issued increase addendum whose status is signed, and
      the room nights it requests are the requested room nights written on it.
      The committed room nights of an increase are the commitment share of the room nights the increase addendum
      requests, rounded down to a whole room night; the room nights requested beyond them are held for the group
      without entering the contract.
      The commitment share of an increase is full_commit_pct percent.
      The days before arrival of an increase are counted as whole calendar days to the block's arrival date from
      the date the increase addendum is implemented.
      The commitment share of an increase is first set by the lead-time share, then raised by the rooming-list
      uplift and lowered by the post-cut-off cut and the increase-size cut, and the result is kept between zero and
      one hundred percent.
      The day from which the days before arrival of an increase are counted follows the increase addendum's
      return: when it was issued no more than return_period_days calendar days before the date it is implemented,
      the days are counted from its issue date; when it was issued more than return_period_days but no more than
      second_period_days calendar days before that date, they are counted from the day return_period_days calendar
      days after its issue date; when it was issued earlier than that, they are counted from the date it is
      implemented.
      The lead-time share follows the days before arrival of the increase: when they are fewer than
      rooming_list_due_days, the share is late_commit_pct percent; when they are at least rooming_list_due_days but
      fewer than rooming_list_due_days plus near_window_days, it is near_commit_pct percent; when they are
      rooming_list_due_days plus near_window_days or more, it is full_commit_pct percent.
      The rooming-list uplift follows how much of the contract the rooming list already names, counted as the room
      nights of the organiser's confirmed Group Block Rate reservations naming the block against the contracted
      room nights before the increase: when they are at least strong_list_pct percent of those contracted room
      nights, the uplift is strong_list_uplift percentage points; when they are at least fair_list_pct percent but
      below strong_list_pct percent, it is fair_list_uplift percentage points; below fair_list_pct percent there is
      no uplift.
      The post-cut-off cut follows when the increase is implemented: when that is more than long_after_cutoff_days
      calendar days after the block's cut-off date, the cut is long_after_cutoff_cut percentage points; when it is
      at least one but no more than long_after_cutoff_days calendar days after the cut-off date, it is
      short_after_cutoff_cut percentage points; when it is on or before the cut-off date there is no cut.
      The increase-size cut follows the room nights the increase addendum requests against the room nights
      contracted at signing, which are the room nights of the block's allocation entry: when they are at least
      large_increase_pct percent of them, the cut is
      large_increase_cut percentage points; when they are at least sizeable_increase_pct percent but below
      large_increase_pct percent, it is sizeable_increase_cut percentage points; below sizeable_increase_pct percent
      there is no cut.
    prerequisite: []
    cross_category:
      - category: booking
        as: history
        reads: [booking_reservations.nights, booking_reservations.status, booking_reservations.variant_name, booking_reservations.group_block_id]
        note: The rooming-list uplift is decided by the room nights of the organiser's confirmed Group Block Rate reservations naming the block.
    inputs:
      history:
        - {table: group_amendments, aggregate: latest, field: created_at, filters: {status: signed, amendment_type: room_night_increase}}
        - {table: group_amendments, aggregate: latest, field: requested_room_nights, filters: {status: signed, amendment_type: room_night_increase}}
        - {category: booking, table: booking_reservations, aggregate: sum, field: nights, filters: {status: confirmed, variant_name: Group Block Rate}}
        - {table: group_ledger, aggregate: sum, field: room_nights, filters: {event_type: group_block_allocate}}
      cross_category: [booking]
    compute:
      - inc_issued_at: "LATEST('group_amendments', 'created_at', date_field='created_at', status='signed', amendment_type='room_night_increase')"
      - inc_requested: "LATEST('group_amendments', 'requested_room_nights', date_field='created_at', status='signed', amendment_type='room_night_increase')"
      - inc_days_since_issue: "DAYS(inc_issued_at, NOW)"
      - inc_count_from: "0 if inc_days_since_issue <= K('return_period_days') else (K('return_period_days') if inc_days_since_issue <= K('second_period_days') else inc_days_since_issue)"
      - inc_lead_days: "DAYS(inc_issued_at, F('arrival_date')) - inc_count_from"
      - lead_share: "K('late_commit_pct') if inc_lead_days < P('rooming_list_due_days') else (K('near_commit_pct') if inc_lead_days < P('rooming_list_due_days') + K('near_window_days') else K('full_commit_pct'))"
      - named_nights: "XSUM('booking', 'booking_reservations', 'nights', status='confirmed', variant_name='Group Block Rate', group_block_id=HID)"
      - list_uplift: "K('strong_list_uplift') if named_nights * 100 >= F('contracted_room_nights') * K('strong_list_pct') else (K('fair_list_uplift') if named_nights * 100 >= F('contracted_room_nights') * K('fair_list_pct') else 0)"
      - days_after_cutoff: "DAYS(F('cutoff_date'), NOW)"
      - cutoff_cut: "K('long_after_cutoff_cut') if days_after_cutoff > K('long_after_cutoff_days') else (K('short_after_cutoff_cut') if days_after_cutoff >= 1 else 0)"
      - signing_nights: "SUM('group_ledger', 'room_nights', event_type='group_block_allocate')"
      - size_cut: "K('large_increase_cut') if inc_requested * 100 >= signing_nights * K('large_increase_pct') else (K('sizeable_increase_cut') if inc_requested * 100 >= signing_nights * K('sizeable_increase_pct') else 0)"
      - commit_share: "MN(MX(lead_share + list_uplift - cutoff_cut - size_cut, 0), 100)"
      - result: "int(inc_requested * commit_share / 100)"
    compute_basis:
      inc_issued_at: "The increase addendum implemented is the most recently issued increase addendum whose status is signed, and the room nights it requests are the requested room nights written on it."
      inc_requested: "The increase addendum implemented is the most recently issued increase addendum whose status is signed, and the room nights it requests are the requested room nights written on it."
      inc_days_since_issue: "when it was issued no more than return_period_days calendar days before the date it is implemented, the days are counted from its issue date"
      inc_count_from: "The day from which the days before arrival of an increase are counted follows the increase addendum's return: when it was issued no more than return_period_days calendar days before the date it is implemented, the days are counted from its issue date; when it was issued more than return_period_days but no more than second_period_days calendar days before that date, they are counted from the day return_period_days calendar days after its issue date; when it was issued earlier than that, they are counted from the date it is implemented."
      inc_lead_days: "The days before arrival of an increase are counted as whole calendar days to the block's arrival date from the date the increase addendum is implemented."
      lead_share: "The lead-time share follows the days before arrival of the increase: when they are fewer than rooming_list_due_days, the share is late_commit_pct percent; when they are at least rooming_list_due_days but fewer than rooming_list_due_days plus near_window_days, it is near_commit_pct percent; when they are rooming_list_due_days plus near_window_days or more, it is full_commit_pct percent."
      named_nights: "counted as the room nights of the organiser's confirmed Group Block Rate reservations naming the block against the contracted room nights before the increase"
      list_uplift: "The rooming-list uplift follows how much of the contract the rooming list already names, counted as the room nights of the organiser's confirmed Group Block Rate reservations naming the block against the contracted room nights before the increase: when they are at least strong_list_pct percent of those contracted room nights, the uplift is strong_list_uplift percentage points; when they are at least fair_list_pct percent but below strong_list_pct percent, it is fair_list_uplift percentage points; below fair_list_pct percent there is no uplift."
      days_after_cutoff: "when that is more than long_after_cutoff_days calendar days after the block's cut-off date"
      cutoff_cut: "The post-cut-off cut follows when the increase is implemented: when that is more than long_after_cutoff_days calendar days after the block's cut-off date, the cut is long_after_cutoff_cut percentage points; when it is at least one but no more than long_after_cutoff_days calendar days after the cut-off date, it is short_after_cutoff_cut percentage points; when it is on or before the cut-off date there is no cut."
      signing_nights: "the room nights contracted at signing, which are the room nights of the block's allocation entry"
      size_cut: "The increase-size cut follows the room nights the increase addendum requests against the room nights contracted at signing, which are the room nights of the block's allocation entry: when they are at least large_increase_pct percent of them, the cut is large_increase_cut percentage points; when they are at least sizeable_increase_pct percent but below large_increase_pct percent, it is sizeable_increase_cut percentage points; below sizeable_increase_pct percent there is no cut."
      commit_share: "The commitment share of an increase is first set by the lead-time share, then raised by the rooming-list uplift and lowered by the post-cut-off cut and the increase-size cut, and the result is kept between zero and one hundred percent."
      result: "The committed room nights of an increase are the commitment share of the room nights the increase addendum requests, rounded down to a whole room night"
    factors:
      - id: increase_count_start
        effect: method
        decides: inc_count_from
        bindings: [inc_days_since_issue, inc_count_from]
        ladder:
          - when: "the increase addendum was issued no more than return_period_days calendar days before it is implemented"
            method: "the days before arrival are counted from the addendum's issue date"
          - when: "it was issued more than return_period_days but no more than second_period_days calendar days before it is implemented"
            method: "the days before arrival are counted from the day return_period_days calendar days after its issue date"
          - when: "otherwise"
            method: "the days before arrival are counted from the date the addendum is implemented"
        baseline:
          inc_count_from: "inc_days_since_issue"
        evidence: [date, history]
        cross_difficulty: null
      - id: lead_time_share
        effect: parameter
        decides: lead_share
        bindings: [inc_lead_days, lead_share]
        ladder:
          - when: "the increase's days before arrival are fewer than rooming_list_due_days"
            value: "K('late_commit_pct')"
          - when: "they are at least rooming_list_due_days but fewer than rooming_list_due_days plus near_window_days"
            value: "K('near_commit_pct')"
          - when: "otherwise"
            value: "K('full_commit_pct')"
        baseline:
          lead_share: "K('full_commit_pct')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: rooming_list_uplift
        effect: parameter
        decides: list_uplift
        bindings: [named_nights, list_uplift]
        ladder:
          - when: "the organiser's confirmed Group Block Rate reservations naming the block hold at least strong_list_pct percent of the contracted room nights"
            value: "K('strong_list_uplift') points"
          - when: "they hold at least fair_list_pct but below strong_list_pct percent"
            value: "K('fair_list_uplift') points"
          - when: "otherwise"
            value: "no uplift"
        baseline:
          list_uplift: "0"
        evidence: [cross_category, history]
        cross_difficulty: booking
      - id: post_cutoff_cut
        effect: parameter
        decides: cutoff_cut
        bindings: [days_after_cutoff, cutoff_cut]
        ladder:
          - when: "the increase is implemented more than long_after_cutoff_days calendar days after the block's cut-off date"
            value: "K('long_after_cutoff_cut') points"
          - when: "it is implemented one to long_after_cutoff_days calendar days after the cut-off date"
            value: "K('short_after_cutoff_cut') points"
          - when: "otherwise (on or before the cut-off date)"
            value: "no cut"
        baseline:
          cutoff_cut: "0"
        evidence: [date]
        cross_difficulty: null
      - id: increase_size_cut
        effect: parameter
        decides: size_cut
        bindings: [inc_requested, signing_nights, size_cut]
        ladder:
          - when: "the increase addendum requests at least large_increase_pct percent of the room nights contracted at signing"
            value: "K('large_increase_cut') points"
          - when: "it requests at least sizeable_increase_pct but below large_increase_pct percent"
            value: "K('sizeable_increase_cut') points"
          - when: "otherwise"
            value: "no cut"
        baseline:
          size_cut: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The committed room nights of an increase are the commitment share of the room nights the increase addendum
        requests, rounded down to a whole room night; the room nights requested beyond them are held for the group
        without entering the contract. The commitment share of an increase is full_commit_pct percent. The days
        before arrival of an increase are counted as whole calendar days to the block's arrival date from the date
        the increase addendum is implemented.
      params: [full_commit_pct]

  - id: group_ext_cutoff_release_nights
    base_policy_refs: [group_cutoff]
    overwrite:
      - base_policy: group_cutoff
        superseded_clause: >-
          On the cut-off date every held room night not yet reserved by an attendee is released to general
          inventory when cutoff_release_full is true;
        replaced_by: >-
          a block whose attendees call in individually is outside this policy and keeps the release of every held room
          night not yet reserved by an attendee, made on the cut-off date.
      - base_policy: group_cutoff
        superseded_clause: >-
          the release equals held_room_nights less the room nights reserved inside the block at that moment.
        replaced_by: >-
          The room nights released at the cut-off are the held room nights less the room nights counted as reserved
          and less the room nights kept back, and never below zero.
    trigger: state_due
    subject: [group_cutoff_release]
    computes: room_nights_released
    target_tool: record_cutoff_release_57832b69
    params:
      name_change_buffer_days: 7
      grace_partial_share: 0.5
      strong_pickup_pct: 70
      fair_pickup_pct: 50
      holdback_pct: 5
      holdback_rooms: 1
      punctual_buffer_days: 7
      punctual_keep_high: 6
      punctual_keep_low: 3
      recent_increase_days: 30
      earlier_increase_days: 60
      recent_increase_share: 0.5
      earlier_increase_share: 0.25
    rule: >-
      This policy settles the cut-off release of a block whose attendees reserve by rooming list, the rooming-list
      reservations being held on the organiser's profile; a block whose attendees call in individually is outside
      this policy and keeps the release of every held room night not yet reserved by an attendee, made on the
      cut-off date. For a block reserved by rooming list the release is one release entry with the cut-off basis
      on the block ledger, dated the block's cut-off date, which lowers the held room nights by the room nights
      released and leaves the contracted room nights unchanged.
      The room nights released at the cut-off are fixed only after every signed room-night increase addendum on the
      block has an increase entry on the block ledger naming it.
      The room nights released at the cut-off are the held room nights less the room nights counted as reserved
      and less the room nights kept back, and never below zero.
      The room nights counted as reserved are the nights of the organiser's confirmed Group Block Rate reservations
      naming the block, and no room nights are kept back.
      Beyond those Group Block Rate nights, the room nights counted as reserved add the staff-room nights and the
      name-change grace nights, and the room nights kept back are the late-name holdback, the on-time list
      allotment and the recent-increase hold, each a whole number of room nights.
      The staff-room nights follow how the block's staff rooms and its rooming list are guaranteed, the staff rooms
      being the organiser's confirmed reservations naming the block on a rate plan other than the Group Block Rate
      and guaranteed to the group master account: when there are such staff rooms and no confirmed Group Block Rate
      reservation naming the block is guaranteed by a guest's own card, all their nights count as reserved; when
      there are such staff rooms and at least one confirmed Group Block Rate reservation naming the block is
      guaranteed by a guest's own card, one night per staff room counts; when there are no such staff rooms, none
      count.
      The name-change grace nights follow how far the block's arrival still is, the grace covering the nights of
      the organiser's cancelled Group Block Rate reservations naming the block: when the arrival is at least
      rooming_list_name_changes_until_days plus name_change_buffer_days calendar days away, all those nights count
      as reserved; when it is at least rooming_list_name_changes_until_days but fewer than that, grace_partial_share
      of them count, rounded down; when it is fewer than rooming_list_name_changes_until_days days away, none count.
      The late-name holdback follows the block's pickup, counted as the room nights of the organiser's confirmed
      Group Block Rate reservations naming the block against the contracted room nights: when they are at least
      strong_pickup_pct percent of the contracted room nights, the holdback is holdback_pct percent of the
      contracted room nights, rounded down; when they are at least fair_pickup_pct percent but below
      strong_pickup_pct percent, the holdback is holdback_rooms rooms for every night of the block; below
      fair_pickup_pct percent there is none.
      The on-time list allotment follows when the rooming list arrived, read as the latest booking date of the
      organiser's confirmed Group Block Rate reservations naming the block: when that date is at least
      rooming_list_due_days plus punctual_buffer_days calendar days before arrival, the allotment is
      punctual_keep_high room nights; when it is at least rooming_list_due_days but fewer than that, it is
      punctual_keep_low room nights; when it is later, there is none.
      The recent-increase hold follows when the block's latest signed increase addendum was issued: when it was
      issued no more than recent_increase_days calendar days before the cut-off date, the hold is
      recent_increase_share of the room nights of the block's increase entries, rounded down; when it was issued more
      than recent_increase_days but no more than earlier_increase_days calendar days before the cut-off date, it is
      earlier_increase_share of them, rounded down; when it was issued earlier or the block has no signed increase
      addendum, there is none.
    prerequisite:
      - problem: group_ext_increase_commitment
        kind: value_input
        gate: held_nights
        form: state
        policy_source: >-
          The room nights released at the cut-off are fixed only after every signed room-night increase addendum on
          the block has an increase entry on the block ledger naming it.
        condition: >-
          Every group_amendments row of the block with amendment_type room_night_increase and status signed is named
          by the amendment_id of a group_block_increase entry on the block's group_ledger, so held_room_nights
          already carries the room nights of every signed increase.
        resolved_by: implement_block_increase_5576c741
        effect: >-
          Once the signed increase is implemented the held room nights rise by the room nights it requests (binding
          held_nights) and its increase entry enters the recent-increase hold, so the room nights released change.
    cross_category:
      - category: booking
        as: history
        reads: [booking_reservations.nights, booking_reservations.status, booking_reservations.variant_name, booking_reservations.guarantee_type, booking_reservations.booked_date, booking_reservations.group_block_id]
        note: The room nights counted as reserved, the staff-room nights, the name-change grace, the late-name holdback and the on-time list allotment are read from the organiser's rooming-list reservations naming the block.
    inputs:
      history:
        - {table: group_ledger, aggregate: sum, field: room_nights, filters: {event_type: group_block_increase}}
        - {table: group_amendments, aggregate: latest, field: created_at, filters: {status: signed, amendment_type: room_night_increase}}
        - {category: booking, table: booking_reservations, aggregate: sum, field: nights, filters: {status: confirmed, variant_name: Group Block Rate}}
        - {category: booking, table: booking_reservations, aggregate: sum, field: nights, filters: {status: cancelled, variant_name: Group Block Rate}}
        - {category: booking, table: booking_reservations, aggregate: count, field: reservation_id, filters: {status: confirmed, guarantee_type: group_master_account}}
        - {category: booking, table: booking_reservations, aggregate: latest, field: booked_date, filters: {status: confirmed, variant_name: Group Block Rate}}
      cross_category: [booking]
    compute:
      - held_nights: "F('held_room_nights')"
      - named_nights: "XSUM('booking', 'booking_reservations', 'nights', status='confirmed', variant_name='Group Block Rate', group_block_id=HID)"
      - master_nights_all: "XSUM('booking', 'booking_reservations', 'nights', status='confirmed', guarantee_type='group_master_account', group_block_id=HID)"
      - master_nights_list: "XSUM('booking', 'booking_reservations', 'nights', status='confirmed', guarantee_type='group_master_account', variant_name='Group Block Rate', group_block_id=HID)"
      - staff_rooms: "XCOUNT('booking', 'booking_reservations', status='confirmed', guarantee_type='group_master_account', group_block_id=HID) - XCOUNT('booking', 'booking_reservations', status='confirmed', guarantee_type='group_master_account', variant_name='Group Block Rate', group_block_id=HID)"
      - list_on_cards: "XCOUNT('booking', 'booking_reservations', status='confirmed', guarantee_type='credit_card', variant_name='Group Block Rate', group_block_id=HID)"
      - staff_nights: "(master_nights_all - master_nights_list if staff_rooms > 0 and list_on_cards == 0 else (staff_rooms if staff_rooms > 0 and list_on_cards > 0 else 0))"
      - days_to_arrival: "DAYS(NOW, F('arrival_date'))"
      - cancelled_list_nights: "XSUM('booking', 'booking_reservations', 'nights', status='cancelled', variant_name='Group Block Rate', group_block_id=HID)"
      - grace_nights: "cancelled_list_nights if days_to_arrival >= P('rooming_list_name_changes_until_days') + K('name_change_buffer_days') else (int(cancelled_list_nights * K('grace_partial_share')) if days_to_arrival >= P('rooming_list_name_changes_until_days') else 0)"
      - pickup_nights: "XSUM('booking', 'booking_reservations', 'nights', status='confirmed', variant_name='Group Block Rate', group_block_id=HID)"
      - holdback: "int(F('contracted_room_nights') * K('holdback_pct') / 100) if pickup_nights * 100 >= F('contracted_room_nights') * K('strong_pickup_pct') else (K('holdback_rooms') * DAYS(F('arrival_date'), F('departure_date')) if pickup_nights * 100 >= F('contracted_room_nights') * K('fair_pickup_pct') else 0)"
      - list_arrived: "XLATEST('booking', 'booking_reservations', 'booked_date', date_field='booked_date', status='confirmed', variant_name='Group Block Rate', group_block_id=HID)"
      - list_lead_days: "DAYS(list_arrived, F('arrival_date')) if list_arrived else -1"
      - ontime_allotment: "K('punctual_keep_high') if list_lead_days >= P('rooming_list_due_days') + K('punctual_buffer_days') else (K('punctual_keep_low') if list_lead_days >= P('rooming_list_due_days') else 0)"
      - increase_nights: "SUM('group_ledger', 'room_nights', event_type='group_block_increase')"
      - last_increase_issued: "LATEST('group_amendments', 'created_at', date_field='created_at', status='signed', amendment_type='room_night_increase')"
      - increase_issue_gap: "DAYS(last_increase_issued, F('cutoff_date')) if last_increase_issued else 9999"
      - increase_hold: "int(increase_nights * K('recent_increase_share')) if increase_issue_gap <= K('recent_increase_days') else (int(increase_nights * K('earlier_increase_share')) if increase_issue_gap <= K('earlier_increase_days') else 0)"
      - result: "MX(held_nights - named_nights - staff_nights - grace_nights - holdback - ontime_allotment - increase_hold, 0)"
    compute_basis:
      held_nights: "The room nights released at the cut-off are the held room nights less the room nights counted as reserved and less the room nights kept back, and never below zero."
      named_nights: "The room nights counted as reserved are the nights of the organiser's confirmed Group Block Rate reservations naming the block, and no room nights are kept back."
      master_nights_all: "the staff rooms being the organiser's confirmed reservations naming the block on a rate plan other than the Group Block Rate and guaranteed to the group master account"
      master_nights_list: "the staff rooms being the organiser's confirmed reservations naming the block on a rate plan other than the Group Block Rate and guaranteed to the group master account"
      staff_rooms: "the staff rooms being the organiser's confirmed reservations naming the block on a rate plan other than the Group Block Rate and guaranteed to the group master account"
      list_on_cards: "no confirmed Group Block Rate reservation naming the block is guaranteed by a guest's own card"
      staff_nights: "The staff-room nights follow how the block's staff rooms and its rooming list are guaranteed, the staff rooms being the organiser's confirmed reservations naming the block on a rate plan other than the Group Block Rate and guaranteed to the group master account: when there are such staff rooms and no confirmed Group Block Rate reservation naming the block is guaranteed by a guest's own card, all their nights count as reserved; when there are such staff rooms and at least one confirmed Group Block Rate reservation naming the block is guaranteed by a guest's own card, one night per staff room counts; when there are no such staff rooms, none count."
      days_to_arrival: "The name-change grace nights follow how far the block's arrival still is"
      cancelled_list_nights: "the grace covering the nights of the organiser's cancelled Group Block Rate reservations naming the block"
      grace_nights: "when the arrival is at least rooming_list_name_changes_until_days plus name_change_buffer_days calendar days away, all those nights count as reserved; when it is at least rooming_list_name_changes_until_days but fewer than that, grace_partial_share of them count, rounded down; when it is fewer than rooming_list_name_changes_until_days days away, none count."
      pickup_nights: "counted as the room nights of the organiser's confirmed Group Block Rate reservations naming the block against the contracted room nights"
      holdback: "The late-name holdback follows the block's pickup, counted as the room nights of the organiser's confirmed Group Block Rate reservations naming the block against the contracted room nights: when they are at least strong_pickup_pct percent of the contracted room nights, the holdback is holdback_pct percent of the contracted room nights, rounded down; when they are at least fair_pickup_pct percent but below strong_pickup_pct percent, the holdback is holdback_rooms rooms for every night of the block; below fair_pickup_pct percent there is none."
      list_arrived: "read as the latest booking date of the organiser's confirmed Group Block Rate reservations naming the block"
      list_lead_days: "when that date is at least rooming_list_due_days plus punctual_buffer_days calendar days before arrival"
      ontime_allotment: "The on-time list allotment follows when the rooming list arrived, read as the latest booking date of the organiser's confirmed Group Block Rate reservations naming the block: when that date is at least rooming_list_due_days plus punctual_buffer_days calendar days before arrival, the allotment is punctual_keep_high room nights; when it is at least rooming_list_due_days but fewer than that, it is punctual_keep_low room nights; when it is later, there is none."
      increase_nights: "the hold is recent_increase_share of the room nights of the block's increase entries, rounded down"
      last_increase_issued: "The recent-increase hold follows when the block's latest signed increase addendum was issued"
      increase_issue_gap: "when it was issued no more than recent_increase_days calendar days before the cut-off date"
      increase_hold: "The recent-increase hold follows when the block's latest signed increase addendum was issued: when it was issued no more than recent_increase_days calendar days before the cut-off date, the hold is recent_increase_share of the room nights of the block's increase entries, rounded down; when it was issued more than recent_increase_days but no more than earlier_increase_days calendar days before the cut-off date, it is earlier_increase_share of them, rounded down; when it was issued earlier or the block has no signed increase addendum, there is none."
      result: "The room nights released at the cut-off are the held room nights less the room nights counted as reserved and less the room nights kept back, and never below zero."
    factors:
      - id: staff_room_nights
        effect: parameter
        decides: staff_nights
        bindings: [master_nights_all, master_nights_list, staff_rooms, list_on_cards, staff_nights]
        ladder:
          - when: "the block has staff rooms guaranteed to the master account AND no confirmed Group Block Rate reservation naming it is guaranteed by a guest's own card"
            value: "all staff-room nights"
          - when: "the block has such staff rooms AND at least one Group Block Rate reservation naming it is guaranteed by a guest's own card"
            value: "one night per staff room"
          - when: "otherwise (no staff rooms)"
            value: "none"
        baseline:
          staff_nights: "0"
        evidence: [cross_category, history]
        cross_difficulty: booking
      - id: name_change_grace
        effect: parameter
        decides: grace_nights
        bindings: [days_to_arrival, cancelled_list_nights, grace_nights]
        ladder:
          - when: "the arrival is at least rooming_list_name_changes_until_days plus name_change_buffer_days calendar days away"
            value: "all nights of the cancelled Group Block Rate reservations naming the block"
          - when: "it is at least rooming_list_name_changes_until_days but fewer than that"
            value: "K('grace_partial_share') of them, rounded down"
          - when: "otherwise"
            value: "none"
        baseline:
          grace_nights: "0"
        evidence: [date, cross_category]
        cross_difficulty: booking
      - id: late_name_holdback
        effect: method
        decides: holdback
        bindings: [pickup_nights, holdback]
        ladder:
          - when: "the confirmed Group Block Rate reservations naming the block hold at least strong_pickup_pct percent of the contracted room nights"
            method: "the holdback is a share (holdback_pct percent) of the contracted room nights, rounded down"
          - when: "they hold at least fair_pickup_pct but below strong_pickup_pct percent"
            method: "the holdback is a fixed number of rooms (holdback_rooms) for every night of the block"
          - when: "otherwise"
            method: "no holdback"
        baseline:
          holdback: "0"
        evidence: [cross_category, date]
        cross_difficulty: booking
      - id: ontime_list_allotment
        effect: parameter
        decides: ontime_allotment
        bindings: [list_arrived, list_lead_days, ontime_allotment]
        ladder:
          - when: "the rooming list's latest booking date is at least rooming_list_due_days plus punctual_buffer_days calendar days before arrival"
            value: "K('punctual_keep_high') room nights"
          - when: "it is at least rooming_list_due_days but fewer than that"
            value: "K('punctual_keep_low') room nights"
          - when: "otherwise"
            value: "none"
        baseline:
          ontime_allotment: "0"
        evidence: [cross_category, date]
        cross_difficulty: booking
      - id: recent_increase_hold
        effect: parameter
        decides: increase_hold
        bindings: [increase_nights, last_increase_issued, increase_issue_gap, increase_hold]
        ladder:
          - when: "the latest signed increase addendum was issued no more than recent_increase_days calendar days before the cut-off date"
            value: "K('recent_increase_share') of the increase entries' room nights, rounded down"
          - when: "it was issued more than recent_increase_days but no more than earlier_increase_days days before the cut-off date"
            value: "K('earlier_increase_share') of them, rounded down"
          - when: "otherwise"
            value: "none"
        baseline:
          increase_hold: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The room nights released at the cut-off are the held room nights less the room nights counted as reserved
        and less the room nights kept back, and never below zero. The room nights counted as reserved are the nights
        of the organiser's confirmed Group Block Rate reservations naming the block, and no room nights are kept
        back.
      params: []

  - id: group_ext_cancellation_damages
    base_policy_refs: [group_cancellation]
    overwrite:
      - base_policy: group_cancellation
        superseded_clause: >-
