    trigger: on_request
    subject: [group_contract_cancel]
    computes: damages_amount
    target_tool: sign_group_cancellation_1ea1e1e5
    params:
      long_tenure_months: 120
      mid_tenure_months: 60
      hotel_stays_high: 3
      hotel_stays_low: 1
      relationship_relief_high: 5
      relationship_relief_low: 2.5
      shared_room_adults: 1.5
      double_breakfast_usd: 24.00
      single_breakfast_usd: 12.00
      card_share_limit_pct: 25
      card_partial_share: 0.5
      release_window_days: 14
      early_release_share: 0.25
      recent_release_share: 0.5
      late_increase_share: 0.5
      prior_increase_days: 30
      near_increase_share: 0.75
    rule: >-
      A definite contract is cancelled only by the organiser's own signature on the written cancellation notice,
      given personally through the signing step guest services hands over in the contact; a request to cancel by
      phone has no effect until that signature is given, and the date it is given is the date the signed notice
      is received.
      Signing the notice cancels the block on that date, releases every room night still held with the cancellation
      basis, and charges the cancellation damages to the master account as one damages entry.
      Cancellation damages are not worked out until each signed increase addendum on the block is matched by an
      increase entry on the block ledger that names it.
      Cancellation damages are fixed only after the block ledger carries the cut-off release owed for a block whose
      cut-off date has been reached.
      A cancellation under the elimination waiver carries no damages; every other cancellation of a definite contract
      is charged the damages worked out here.
      The cancellation damages are the chargeable room nights times the damages rate times the damages percentage,
      rounded to the cent once.
      The chargeable room nights are the contracted room nights, the damages rate is the group rate, and the damages
      percentage is the scale percentage of the matching step, which is the first step of the block type's
      cancellation_scale, read from the top, whose days_from is not greater than the whole calendar days from the
      date the signed notice is received to the arrival date.
      The cancellation damages are worked out in this order: first the card-guaranteed exclusion is taken off the
      chargeable room nights and what remains is split into the released part, the late-increase part and the
      regular part; then the released part is weighted by the release share and the late-increase part by the
      late-increase share and the three parts are added; that sum is multiplied by the damages rate and then by
      the damages percentage less the relationship relief, never below zero, and the product is rounded to the
      cent once.
      The released part is the room nights of the block's cut-off release entries, never more than the room nights
      that remain after the exclusion; the late-increase part is the contracted room nights the block's increase
      entries added to the contract, which are the contracted room nights less the room nights of the allocation
      entry plus the room nights of the reduction entries, never more than the room nights left after the released
      part; the regular part is the rest.
      The scale percentage follows the organiser's Ashbury Rewards tenure: when the membership is active at
      Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite and was enrolled at least
      long_tenure_months whole months before the notice, the percentage is that of the step one longer lead than
      the matching step; when it is active at Ashbury Rewards Gold Elite or Ashbury Rewards Platinum Elite and was
      enrolled at least mid_tenure_months whole months before the notice, it is the average of the matching step
      and the step one longer lead; in every other case it is the matching step.
      When the matching step is the top step of the block type's cancellation_scale, no step has a longer lead and
      the step one longer lead is the top step itself.
      The relationship relief follows the organiser's own completed stays at the block's hotel, counted as the
      organiser's checked-out reservations at that hotel with a check-out in the last 24 months: when there are at
      least hotel_stays_high of them, the relief is relationship_relief_high percentage points; when there are at
      least hotel_stays_low but fewer than hotel_stays_high, it is relationship_relief_low percentage points; when
      there are none, there is no relief.
      The damages rate follows the breakfast built into the group rate and how the named rooms are occupied: when
      the block type's group rate includes breakfast and the organiser's confirmed Group Block Rate reservations
      naming the block average at least shared_room_adults adults per room, the damages rate is the group rate less
      double_breakfast_usd; when the group rate includes breakfast and they average fewer adults, it is the group
      rate less single_breakfast_usd; when the group rate includes no breakfast or no such reservation exists, it is
      the group rate.
      The card-guaranteed exclusion follows the confirmed Group Block Rate reservations naming the block that a
      guest's own card guarantees, whose guests carry their own reservation penalties: when there are such
      reservations and their nights are no more than card_share_limit_pct percent of the nights of all the confirmed
      Group Block Rate reservations naming the block, all their nights are excluded; when their nights are more than
      that, card_partial_share of them are excluded, rounded down; when there are none, nothing is excluded.
      The release share follows how long the released room nights have been back in general inventory: when the
      block ledger carries a cut-off release entry and the notice is received at least release_window_days calendar
      days after the cut-off date, the share is early_release_share; when it carries one and the notice comes fewer
      days after the cut-off date, the share is recent_release_share; when it carries none, the share is one.
      The late-increase share follows when the block's latest increase entry was posted: when the increases added
      room nights to the contract and the latest increase entry is dated after the cut-off date, the share is
      late_increase_share; when they added room nights and the latest increase entry is dated on the cut-off date
      or no more than prior_increase_days calendar days before it, the share is near_increase_share; in every other
      case the share is one.
    prerequisite:
      - problem: group_ext_increase_commitment
        kind: value_input
        gate: contracted_nights
        form: state
        policy_source: >-
          Cancellation damages are not worked out until each signed increase addendum on the block is matched by an
          increase entry on the block ledger that names it.
        condition: >-
          Every group_amendments row of the block with amendment_type room_night_increase and status signed is named
          by the amendment_id of a group_block_increase entry on the block's group_ledger, so contracted_room_nights
          already carries the committed room nights of every signed increase.
        resolved_by: implement_block_increase_5576c741
        effect: >-
          Once the signed increase is implemented the contracted room nights rise by its committed room nights
          (binding contracted_nights) and the late-increase part takes those room nights, so the damages change.
      - problem: group_ext_cutoff_release_nights
        kind: value_input
        gate: released_nights
        form: state
        policy_source: >-
          Cancellation damages are fixed only after the block ledger carries the cut-off release owed for a block
          whose cut-off date has been reached.
        condition: >-
          For a block whose cutoff_date is on or before the notice date, the block's group_ledger carries a
          group_cutoff_release entry with entry_basis cutoff_release.
        resolved_by: record_cutoff_release_57832b69
        effect: >-
          Once the cut-off release is recorded its room nights form the released part (binding released_nights) and
          the release share drops below one, so the damages change.
    cross_category:
      - category: loyalty
        as: branch
        reads: [variant_name, status, enrolled_date]
        note: The scale percentage step is decided by the organiser's active Ashbury Rewards tier and enrolment date.
      - category: booking
        as: history
        reads: [booking_reservations.status, booking_reservations.property_code, booking_reservations.actual_check_out_date, booking_reservations.adults, booking_reservations.nights, booking_reservations.guarantee_type, booking_reservations.variant_name, booking_reservations.group_block_id]
        note: The relationship relief counts the organiser's checked-out stays at the hotel; the damages rate and the card-guaranteed exclusion read the organiser's rooming-list reservations naming the block.
    inputs:
      history:
        - {table: group_ledger, aggregate: sum, field: room_nights, filters: {event_type: group_cutoff_release, entry_basis: cutoff_release}}
        - {table: group_ledger, aggregate: sum, field: room_nights, filters: {event_type: group_block_allocate}}
        - {table: group_ledger, aggregate: sum, field: room_nights, filters: {event_type: group_block_reduce}}
        - {table: group_ledger, aggregate: latest, field: entry_date, filters: {event_type: group_block_increase}}
        - {category: booking, table: booking_reservations, aggregate: count, field: reservation_id, within_months: 24, filters: {status: checked_out}}
        - {category: booking, table: booking_reservations, aggregate: sum, field: adults, filters: {status: confirmed, variant_name: Group Block Rate}}
        - {category: booking, table: booking_reservations, aggregate: sum, field: nights, filters: {status: confirmed, variant_name: Group Block Rate, guarantee_type: credit_card}}
      cross_category: [loyalty, booking]
    compute:
      - contracted_nights: "F('contracted_room_nights')"
      - scale_days: "DAYS(NOW, F('arrival_date'))"
      - matched_pct: "((10 if scale_days >= 181 else (25 if scale_days >= 91 else (50 if scale_days >= 31 else 80))) if F('variant_name') == 'Social Event Room Block' else ((25 if scale_days >= 181 else (50 if scale_days >= 91 else (75 if scale_days >= 31 else 100))) if F('variant_name') == 'Wedding Room Block' else ((0 if scale_days >= 91 else (25 if scale_days >= 31 else (50 if scale_days >= 15 else 75))) if F('variant_name') == 'Sports Team Room Block' else ((0 if scale_days >= 181 else (25 if scale_days >= 61 else (50 if scale_days >= 31 else 100))) if F('variant_name') == 'Tour & Travel Series Block' else ((25 if scale_days >= 181 else (50 if scale_days >= 91 else (75 if scale_days >= 31 else 90))) if F('variant_name') == 'Corporate Meeting Room Block' else ((20 if scale_days >= 366 else (40 if scale_days >= 181 else (60 if scale_days >= 91 else 80))) if F('variant_name') == 'Association Convention Room Block' else 0))))))"
      - next_pct: "((10 if scale_days >= 181 else (10 if scale_days >= 91 else (25 if scale_days >= 31 else 50))) if F('variant_name') == 'Social Event Room Block' else ((25 if scale_days >= 181 else (25 if scale_days >= 91 else (50 if scale_days >= 31 else 75))) if F('variant_name') == 'Wedding Room Block' else ((0 if scale_days >= 91 else (0 if scale_days >= 31 else (25 if scale_days >= 15 else 50))) if F('variant_name') == 'Sports Team Room Block' else ((0 if scale_days >= 181 else (0 if scale_days >= 61 else (25 if scale_days >= 31 else 50))) if F('variant_name') == 'Tour & Travel Series Block' else ((25 if scale_days >= 181 else (25 if scale_days >= 91 else (50 if scale_days >= 31 else 75))) if F('variant_name') == 'Corporate Meeting Room Block' else ((20 if scale_days >= 366 else (20 if scale_days >= 181 else (40 if scale_days >= 91 else 60))) if F('variant_name') == 'Association Convention Room Block' else 0))))))"
      - loyalty_tier: "CFIELD('loyalty', 'variant_name', status='active')"
      - enrolled: "CFIELD('loyalty', 'enrolled_date', status='active')"
      - tenure_months: "MONTHS(enrolled, NOW) if enrolled else 0"
      - scale_pct: "next_pct if (loyalty_tier == 'Ashbury Rewards Titanium Elite' or loyalty_tier == 'Ashbury Rewards Ambassador Elite') and tenure_months >= K('long_tenure_months') else ((matched_pct + next_pct) / 2 if (loyalty_tier == 'Ashbury Rewards Gold Elite' or loyalty_tier == 'Ashbury Rewards Platinum Elite') and tenure_months >= K('mid_tenure_months') else matched_pct)"
      - hotel_stays: "XCOUNT('booking', 'booking_reservations', within_months=24, date_field='actual_check_out_date', status='checked_out', property_code=F('property_code'))"
      - relationship_relief: "K('relationship_relief_high') if hotel_stays >= K('hotel_stays_high') else (K('relationship_relief_low') if hotel_stays >= K('hotel_stays_low') else 0)"
      - damages_pct: "MX(scale_pct - relationship_relief, 0)"
      - list_rooms: "XCOUNT('booking', 'booking_reservations', status='confirmed', variant_name='Group Block Rate', group_block_id=HID)"
      - list_adults: "XSUM('booking', 'booking_reservations', 'adults', status='confirmed', variant_name='Group Block Rate', group_block_id=HID)"
      - damages_rate: "F('group_rate') - K('double_breakfast_usd') if P('group_rate_includes_breakfast') == True and list_rooms > 0 and list_adults >= K('shared_room_adults') * list_rooms else (F('group_rate') - K('single_breakfast_usd') if P('group_rate_includes_breakfast') == True and list_rooms > 0 and list_adults < K('shared_room_adults') * list_rooms else F('group_rate'))"
      - list_nights: "XSUM('booking', 'booking_reservations', 'nights', status='confirmed', variant_name='Group Block Rate', group_block_id=HID)"
      - card_nights: "XSUM('booking', 'booking_reservations', 'nights', status='confirmed', variant_name='Group Block Rate', guarantee_type='credit_card', group_block_id=HID)"
      - card_exclusion: "card_nights if card_nights > 0 and card_nights * 100 <= list_nights * K('card_share_limit_pct') else (int(card_nights * K('card_partial_share')) if card_nights > 0 and card_nights * 100 > list_nights * K('card_share_limit_pct') else 0)"
      - chargeable_nights: "contracted_nights - card_exclusion"
      - released_nights: "SUM('group_ledger', 'room_nights', event_type='group_cutoff_release', entry_basis='cutoff_release')"
      - days_since_cutoff: "DAYS(F('cutoff_date'), NOW)"
      - release_share: "K('early_release_share') if released_nights > 0 and days_since_cutoff >= K('release_window_days') else (K('recent_release_share') if released_nights > 0 and days_since_cutoff < K('release_window_days') else 1)"
      - allocated_nights: "SUM('group_ledger', 'room_nights', event_type='group_block_allocate')"
      - reduced_nights: "SUM('group_ledger', 'room_nights', event_type='group_block_reduce')"
      - increase_committed: "MX(contracted_nights - allocated_nights + reduced_nights, 0)"
      - last_increase_date: "LATEST('group_ledger', 'entry_date', date_field='entry_date', event_type='group_block_increase')"
      - increase_vs_cutoff: "DAYS(F('cutoff_date'), last_increase_date) if last_increase_date else -9999"
      - increase_share: "K('late_increase_share') if increase_committed > 0 and increase_vs_cutoff > 0 else (K('near_increase_share') if increase_committed > 0 and increase_vs_cutoff <= 0 and increase_vs_cutoff >= 0 - K('prior_increase_days') else 1)"
      - released_part: "MN(released_nights, chargeable_nights)"
      - late_part: "MN(increase_committed, chargeable_nights - released_part)"
      - regular_part: "chargeable_nights - released_part - late_part"
      - result: "RND((regular_part + released_part * release_share + late_part * increase_share) * damages_rate * damages_pct / 100, 2)"
    compute_basis:
      contracted_nights: "The chargeable room nights are the contracted room nights, the damages rate is the group rate, and the damages percentage is the scale percentage of the matching step"
