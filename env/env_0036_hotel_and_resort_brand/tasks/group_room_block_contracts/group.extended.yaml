      list_nights: "their nights are no more than card_share_limit_pct percent of the nights of all the confirmed Group Block Rate reservations naming the block"
      card_nights: "The card-guaranteed exclusion follows the confirmed Group Block Rate reservations naming the block that a guest's own card guarantees, whose guests carry their own reservation penalties"
