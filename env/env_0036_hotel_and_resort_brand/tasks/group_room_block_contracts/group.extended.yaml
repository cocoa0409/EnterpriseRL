    factors:
      - id: tenure_scale_step
        effect: method
        decides: scale_pct
        bindings: [loyalty_tier, enrolled, tenure_months, scale_pct]
        ladder:
          - when: "the organiser's membership is active at Titanium or Ambassador Elite AND was enrolled at least long_tenure_months months before the notice"
            method: "the percentage of the step one longer lead than the matching step is taken"
          - when: "it is active at Gold or Platinum Elite AND was enrolled at least mid_tenure_months months before the notice"
            method: "the average of the matching step and the step one longer lead is taken"
          - when: "otherwise"
            method: "the matching step is taken"
        baseline:
          scale_pct: "matched_pct"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: hotel_relationship_relief
        effect: parameter
        decides: relationship_relief
        bindings: [hotel_stays, relationship_relief]
        ladder:
          - when: "the organiser has at least hotel_stays_high checked-out stays at the block's hotel in the last 24 months"
            value: "K('relationship_relief_high') points"
          - when: "the organiser has at least hotel_stays_low but fewer than hotel_stays_high such stays"
            value: "K('relationship_relief_low') points"
          - when: "otherwise"
            value: "no relief"
        baseline:
          relationship_relief: "0"
        evidence: [cross_category, history]
        cross_difficulty: booking
      - id: breakfast_rate_basis
        effect: parameter
        decides: damages_rate
        bindings: [list_rooms, list_adults, damages_rate]
        ladder:
          - when: "the group rate includes breakfast AND the named rooms average at least shared_room_adults adults"
            value: "the group rate less K('double_breakfast_usd')"
          - when: "the group rate includes breakfast AND the named rooms average fewer adults"
            value: "the group rate less K('single_breakfast_usd')"
          - when: "otherwise"
            value: "the group rate"
        baseline:
          damages_rate: "F('group_rate')"
        evidence: [cross_category, tier_param]
        cross_difficulty: booking
      - id: card_guaranteed_exclusion
        effect: parameter
        decides: card_exclusion
        bindings: [list_nights, card_nights, card_exclusion]
        ladder:
          - when: "there are card-guaranteed rooming-list nights AND they are no more than card_share_limit_pct percent of the rooming-list nights"
            value: "all of them excluded"
          - when: "there are card-guaranteed rooming-list nights AND they are more than that"
            value: "K('card_partial_share') of them excluded, rounded down"
          - when: "otherwise"
            value: "nothing excluded"
        baseline:
          card_exclusion: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: release_share
        effect: parameter
        decides: release_share
        bindings: [released_nights, days_since_cutoff, release_share]
        ladder:
          - when: "the ledger carries a cut-off release entry AND the notice comes at least release_window_days days after the cut-off date"
            value: "K('early_release_share')"
          - when: "the ledger carries a cut-off release entry AND the notice comes fewer days after it"
            value: "K('recent_release_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          release_share: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: late_increase_share
        effect: parameter
        decides: increase_share
        bindings: [allocated_nights, reduced_nights, increase_committed, last_increase_date, increase_vs_cutoff, increase_share]
        ladder:
          - when: "increases added contracted room nights AND the latest increase entry is dated after the cut-off date"
            value: "K('late_increase_share')"
          - when: "increases added contracted room nights AND the latest increase entry is dated on the cut-off date or up to prior_increase_days days before it"
            value: "K('near_increase_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          increase_share: "1"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The cancellation damages are the chargeable room nights times the damages rate times the damages percentage,
        rounded to the cent once. The chargeable room nights are the contracted room nights, the damages rate is the
        group rate, and the damages percentage is the scale percentage of the matching step, which is the first step
