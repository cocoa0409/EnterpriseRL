      history: []
      cross_category: [booking]
  - id: loyalty_ext_late_award_cancellation_redeposit
    base_policy_refs: [loyalty_award_redemption]
    overwrite:
      - base_policy: loyalty_award_redemption
        superseded_clause: >-
          on a cancellation recorded after_deadline or a no-show under the first_night_points basis,
          everything except the price of the first night is returned when the first night was paid with
          points, and everything is returned when the first night was paid with a Free Night Award.
        replaced_by: >-
          On a cancellation recorded after_deadline, and on a no-show, the redeposit is the points the
          reservation deducted less the retained night charge, and it never exceeds the points it
          deducted.
    trigger: state_due
    subject: [loyalty_points_redeposit]
    computes: points
    target_tool: return_award_cancellation_points_76b4b6d2
    params:
      fifth_night_cycle: 5
      half_share_pct: 50
      share_nights: 50
      two_day_notice_reduction: 20
      one_day_notice_reduction: 10
      high_activity_redemptions: 5
      mid_activity_redemptions: 2
      high_activity_reduction: 15
      mid_activity_reduction: 5
    rule: >-
      Points deducted for a Reward Night Rate reservation come back after a cancellation or a no-show as
      one award_redeposit transaction naming the redemption they return. The award reservation concerned
      is the member's Reward Night Rate reservation attached to the membership whose status is cancelled
      or, when there is none, whose status is no_show. The points the reservation deducted are the
      award_redemption transactions naming it less any redeposit already naming it. On a cancellation
      recorded before_deadline the points the reservation deducted are returned in full. On a cancellation
      recorded after_deadline, and on a no-show, the redeposit is the points the reservation deducted less
      the retained night charge, and it never exceeds the points it deducted. The points nights of the
      reservation are its nights less its certificate nights, and its charged points nights are the
      points nights less one free night for every five points nights when the member's tier has
      fifth_night_free_on_points true. The standard retained night charge is the whole night value, and
      the standard night value is the points the reservation deducted divided by its charged points
      nights, rounded down to a whole point. The night value depends on how the reservation was paid: a
      reservation with one or more certificate nights had its first night paid with a Free Night Award
      and its night value is zero; a reservation whose first night was paid with points and which has
      five or more points nights on a tier with the fifth-night saving takes as night value the points
      it deducted divided by all of its points nights, rounded down to a whole point; any other
      reservation takes as night value the points it deducted divided by its charged points nights,
      rounded down to a whole point. The retained share of the night value is set by the tier and by the
      elite night credits posted in the twelve months before the handling date, less the night credits
      reversed in those months: a member at Ashbury Rewards Ambassador Elite has a retained share of zero
      percent; a member at Ashbury Rewards Platinum Elite or Titanium Elite with at least fifty such night
      credits has a retained share of fifty percent; any other member has a retained share of one
      hundred percent. The retained share is reduced by a notice reduction of twenty percentage points
      when the cancellation was recorded two or more calendar days before the arrival date, of ten
      percentage points when it was recorded one calendar day before the arrival date, and of nothing
      when it was recorded on the arrival date or later or when the reservation is a no-show; the days
      are counted from the date of the moment the cancellation was recorded to the arrival date. The
      retained share is further reduced by an award-activity reduction of fifteen percentage points when
      at least five award_redemption transactions were posted on the account in the twelve months before
      the handling date, of five percentage points when two to four were posted, and of nothing when
      fewer were posted; the reservation's own redemption counts among them. The twelve months before the
      handling date are the transactions posted after the same day number twelve months earlier, up to
      and including the handling date. The retained share after the reductions is the retained share less
      the notice reduction and less the award-activity reduction, never below zero percent, and the
      retained night charge is the night value times that share divided by one hundred, rounded down to
      a whole point. Points come back as a redeposit naming the redemption they return, and the points
      returned against a redemption never exceed the points it deducted.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [reservation_id, status, variant_name, loyalty_member_id, cancellation_timing, nights, certificate_nights, cancelled_at, arrival_date]
        note: The cancelled or no-show Reward Night Rate reservation gives the cancellation timing, the nights and certificate nights behind the night value, and the moment of cancellation and arrival date behind the notice reduction.
    compute:
      - cancelled_award: "CFIELD('booking','reservation_id', status='cancelled', variant_name='Reward Night Rate', loyalty_member_id=HID)"
      - no_show_award: "CFIELD('booking','reservation_id', status='no_show', variant_name='Reward Night Rate', loyalty_member_id=HID)"
      - award_reservation: "cancelled_award if cancelled_award else no_show_award"
      - deducted: "SUM('loyalty_transactions','points', date_field='posted_date', event_type='loyalty_points_redeem', earning_source='award_redemption', reservation_id=award_reservation) - SUM('loyalty_transactions','points', date_field='posted_date', event_type='loyalty_points_redeposit', earning_source='award_redeposit', reservation_id=award_reservation)"
      - late: "CFIELD('booking','cancellation_timing', reservation_id=award_reservation) == 'after_deadline' or CFIELD('booking','status', reservation_id=award_reservation) == 'no_show'"
      - award_nights: "CFIELD('booking','nights', reservation_id=award_reservation)"
      - certificate_nights: "CFIELD('booking','certificate_nights', reservation_id=award_reservation)"
      - points_nights: "award_nights - certificate_nights"
      - charged_points_nights: "points_nights - ((points_nights // K('fifth_night_cycle')) if P('fifth_night_free_on_points') else 0)"
      - night_value: "0 if certificate_nights >= 1 else ((deducted // points_nights) if (points_nights >= K('fifth_night_cycle') and P('fifth_night_free_on_points')) else (deducted // charged_points_nights))"
      - night_credits_12m: "SUM('loyalty_transactions','nights', within_months=12, date_field='posted_date', event_type='loyalty_night_credit') - SUM('loyalty_transactions','nights', within_months=12, date_field='posted_date', event_type='loyalty_night_reversal')"
      - retained_share: "0 if F('variant_name') == 'Ashbury Rewards Ambassador Elite' else (K('half_share_pct') if ((F('variant_name') == 'Ashbury Rewards Platinum Elite' or F('variant_name') == 'Ashbury Rewards Titanium Elite') and night_credits_12m >= K('share_nights')) else 100)"
      - notice_days: "DAYS(CFIELD('booking','cancelled_at', reservation_id=award_reservation), CFIELD('booking','arrival_date', reservation_id=award_reservation)) if CFIELD('booking','cancelled_at', reservation_id=award_reservation) else 0"
      - notice_reduction: "K('two_day_notice_reduction') if notice_days >= 2 else (K('one_day_notice_reduction') if notice_days >= 1 else 0)"
      - redemptions_12m: "COUNT('loyalty_transactions', within_months=12, date_field='posted_date', event_type='loyalty_points_redeem', earning_source='award_redemption')"
      - activity_reduction: "K('high_activity_reduction') if redemptions_12m >= K('high_activity_redemptions') else (K('mid_activity_reduction') if redemptions_12m >= K('mid_activity_redemptions') else 0)"
      - share_after_reductions: "MX(0, retained_share - notice_reduction - activity_reduction)"
      - retained_night_charge: "(night_value * share_after_reductions) // 100"
      - result: "MN(deducted, MX(0, deducted - retained_night_charge)) if late else deducted"
    compute_basis:
      cancelled_award: "The award reservation concerned is the member's Reward Night Rate reservation attached to the membership whose status is cancelled or, when there is none, whose status is no_show."
      no_show_award: "The award reservation concerned is the member's Reward Night Rate reservation attached to the membership whose status is cancelled or, when there is none, whose status is no_show."
      award_reservation: "The award reservation concerned is the member's Reward Night Rate reservation attached to the membership whose status is cancelled or, when there is none, whose status is no_show."
      deducted: "The points the reservation deducted are the award_redemption transactions naming it less any redeposit already naming it."
      late: "On a cancellation recorded after_deadline, and on a no-show, the redeposit is the points the reservation deducted less the retained night charge, and it never exceeds the points it deducted."
      award_nights: "The points nights of the reservation are its nights less its certificate nights"
      certificate_nights: "The points nights of the reservation are its nights less its certificate nights"
      charged_points_nights: "its charged points nights are the points nights less one free night for every five points nights when the member's tier has fifth_night_free_on_points true."
      night_value: "The night value depends on how the reservation was paid: a reservation with one or more certificate nights had its first night paid with a Free Night Award and its night value is zero; a reservation whose first night was paid with points and which has five or more points nights on a tier with the fifth-night saving takes as night value the points it deducted divided by all of its points nights, rounded down to a whole point; any other reservation takes as night value the points it deducted divided by its charged points nights, rounded down to a whole point."
      night_credits_12m: "The retained share of the night value is set by the tier and by the elite night credits posted in the twelve months before the handling date, less the night credits reversed in those months"
      retained_share: "a member at Ashbury Rewards Ambassador Elite has a retained share of zero percent; a member at Ashbury Rewards Platinum Elite or Titanium Elite with at least fifty such night credits has a retained share of fifty percent; any other member has a retained share of one hundred percent."
      notice_days: "the days are counted from the date of the moment the cancellation was recorded to the arrival date."
      notice_reduction: "The retained share is reduced by a notice reduction of twenty percentage points when the cancellation was recorded two or more calendar days before the arrival date, of ten percentage points when it was recorded one calendar day before the arrival date, and of nothing when it was recorded on the arrival date or later or when the reservation is a no-show"
      redemptions_12m: "The twelve months before the handling date are the transactions posted after the same day number twelve months earlier, up to and including the handling date."
      activity_reduction: "The retained share is further reduced by an award-activity reduction of fifteen percentage points when at least five award_redemption transactions were posted on the account in the twelve months before the handling date, of five percentage points when two to four were posted, and of nothing when fewer were posted; the reservation's own redemption counts among them."
      share_after_reductions: "The retained share after the reductions is the retained share less the notice reduction and less the award-activity reduction, never below zero percent"
      retained_night_charge: "the retained night charge is the night value times that share divided by one hundred, rounded down to a whole point."
      result: "On a cancellation recorded before_deadline the points the reservation deducted are returned in full. On a cancellation recorded after_deadline, and on a no-show, the redeposit is the points the reservation deducted less the retained night charge, and it never exceeds the points it deducted."
    factors:
      - id: award_night_value
        effect: method
        decides: night_value
        bindings: [certificate_nights, night_value]
        ladder:
          - when: "the reservation has one or more certificate nights, so its first night was paid with a Free Night Award"
            method: "the night value is zero"
          - when: "the first night was paid with points and the reservation has five or more points nights on a tier with the fifth-night saving"
            method: "the points deducted divided by all of the points nights, rounded down to a whole point"
          - when: "otherwise"
            method: "the points deducted divided by the charged points nights, rounded down to a whole point"
        baseline:
          night_value: "deducted // charged_points_nights"
        evidence: [cross_category, history]
        cross_difficulty: booking
      - id: award_retained_share
        effect: parameter
        decides: retained_share
        bindings: [night_credits_12m, retained_share]
        ladder:
          - when: "the member holds Ashbury Rewards Ambassador Elite"
            value: "0"
          - when: "the member holds Platinum or Titanium Elite and at least fifty net night credits were posted in the twelve months before the handling date"
            value: "K('half_share_pct')"
          - when: "otherwise"
            value: "100"
        baseline:
          retained_share: "100"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: award_notice_reduction
        effect: parameter
        decides: notice_reduction
        bindings: [notice_days, notice_reduction]
        ladder:
          - when: "the cancellation was recorded two or more calendar days before the arrival date"
            value: "K('two_day_notice_reduction')"
          - when: "it was recorded one calendar day before the arrival date"
            value: "K('one_day_notice_reduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          notice_reduction: "0"
        evidence: [cross_category, date]
        cross_difficulty: booking
      - id: award_activity_reduction
        effect: parameter
        decides: activity_reduction
        bindings: [redemptions_12m, activity_reduction]
        ladder:
          - when: "at least five award redemptions were posted in the twelve months before the handling date"
            value: "K('high_activity_reduction')"
          - when: "two to four were posted"
            value: "K('mid_activity_reduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          activity_reduction: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The award reservation concerned is the member's Reward Night Rate reservation attached to the
        membership whose status is cancelled or, when there is none, whose status is no_show. The points
        the reservation deducted are the award_redemption transactions naming it less any redeposit
        already naming it. On a cancellation recorded before_deadline the points the reservation deducted
        are returned in full. On a cancellation recorded after_deadline, and on a no-show, the redeposit is
        the points the reservation deducted less the retained night charge, and it never exceeds the
        points it deducted. The points nights of the reservation are its nights less its certificate
        nights, and its charged points nights are the points nights less one free night for every five
        points nights when the member's tier has fifth_night_free_on_points true. The standard retained
        night charge is the whole night value, and the standard night value is the points the reservation
        deducted divided by its charged points nights, rounded down to a whole point.
      params: [fifth_night_cycle, fifth_night_free_on_points]
    inputs:
      history:
        - {table: loyalty_transactions, aggregate: sum, field: points, filters: {event_type: loyalty_points_redeem, earning_source: award_redemption}}
        - {table: loyalty_transactions, aggregate: sum, field: nights, within_months: 12, filters: {event_type: loyalty_night_credit}}
        - {table: loyalty_transactions, aggregate: count, field: transaction_id, within_months: 12, filters: {event_type: loyalty_points_redeem, earning_source: award_redemption}}
      cross_category: [booking]
  - id: loyalty_ext_largest_points_transfer
    base_policy_refs: [loyalty_transfer_rules]
    overwrite:
      - base_policy: loyalty_transfer_rules
        superseded_clause: >-
          The sender's transfers in the calendar year, counted with loyalty_msr_transferred_out_ytd and
          including this transfer, may not exceed points_transfer_out_annual_cap of the sender's tier, and
          the recipient's receipts, counted with loyalty_msr_received_ytd and including this transfer, may
          not exceed points_transfer_in_annual_cap of the recipient's tier.
        replaced_by: >-
          A transfer may not exceed the sender's remaining transfer allowance, and the recipient's receipts
          in the calendar year, counted with loyalty_msr_received_ytd and including this transfer, may not
          exceed points_transfer_in_annual_cap of the recipient's tier.
    trigger: on_request
    subject: [loyalty_points_transfer_out]
    computes: points
    target_tool: give_points_to_member_c374aed0
    params:
      top_allowance: 300000
      top_allowance_nights: 75
      platinum_allowance: 200000
      platinum_allowance_nights: 50
      long_tenure_months: 120
      mid_tenure_months: 60
      short_received_hold: 3
      mid_received_hold: 6
      standard_received_hold: 12
      mid_bought_hold: 1
      standard_bought_hold: 3
      usage_exemption: 25000
    rule: >-
      A member may give points from their own account to another Ashbury Rewards member; giving away
      points is the sender's own decision, made by the sender personally. A member who asks to give
      another member the largest transfer their account allows gives, in one transfer, the lower of the
      transferable balance and the remaining transfer allowance, rounded down to a multiple of the tier's
      points transfer increment. The largest transfer is worked out only after the points balance carries
      a relocation compensation transaction for every relocated reservation attached to the membership.
      The largest transfer is not worked out until every cancelled or no-show Reward Night Rate
      reservation attached to the membership carries an award redeposit transaction naming its
      redemption. The transfer allowance is set only once the account carries a night-credit transaction
      for every checked-out Reward Night Rate stay attached to the membership. The standard transferable
      balance is the points balance less the points received by transfer in the twelve months before the
      handling date and less the points bought in the three months before the handling date. The
      standard transfer allowance is the points transfer out annual cap of the sender's tier, and the
      standard allowance used is the points the member transferred out in the twelve months before the
      handling date. The remaining transfer allowance is the transfer allowance less the allowance used,
      never below zero. The transfer allowance is set by the tier and by the elite night credits posted in
      the twelve months before the handling date, less the night credits reversed in those months: a
      member at Ashbury Rewards Titanium Elite or Ambassador Elite with at least seventy-five such night
      credits has a transfer allowance of three hundred thousand points; a member at Ashbury Rewards
      Platinum Elite with at least fifty such night credits, or at Ashbury Rewards Titanium Elite or
      Ambassador Elite with fifty to seventy-four such night credits, has a transfer allowance of two
      hundred thousand points; any other member has the points transfer out annual cap of the tier. Points
      received by transfer are held back from the transferable balance for a received-points hold period
      set by the tier and by the whole calendar months since enrolment: three months for a member at
      Platinum Elite or higher enrolled for at least one hundred and twenty months, six months for a member
      at Platinum Elite or higher enrolled for sixty to one hundred and nineteen months, and twelve months
      for any other member; the points held back are those received by transfer in that many months
      before the handling date. Points bought are held back from the transferable balance for a
      purchased-points hold period set by the tier: no months for a member at Titanium Elite or
      Ambassador Elite, one month for a member at Gold Elite or Platinum Elite, and three months for any
      other member; the points held back are those bought in that many months before the handling date.
      The allowance used depends on the tier and on the months since enrolment: for a member at Titanium
      Elite or Ambassador Elite it is the points transferred out in the twelve months before the handling
      date less the points received by transfer in the same twelve months, never below zero; for a member
      at Gold Elite or Platinum Elite enrolled for at least one hundred and twenty months it is the points
      transferred out in those twelve months less an exemption of twenty-five thousand points, never below
      zero; for any other member it is the points transferred out in those twelve months. A period of
      months before the handling date covers the transactions posted after the same day number that many
      months earlier, up to and including the handling date. The transferable balance is the points
      balance less the received points held back and less the bought points held back, never below zero.
      Points are transferred without a fee, and a completed transfer is irrevocable when
      points_transfer_irrevocable is true. Both accounts must be active, and the sender must hold at least
      the points transferred. Both accounts must have been open for points_transfer_min_account_age_days
      before a transfer. A transfer may not exceed the sender's remaining transfer allowance, and the
      recipient's receipts in the calendar year, counted with loyalty_msr_received_ytd and including this
      transfer, may not exceed points_transfer_in_annual_cap of the recipient's tier. A sender makes at
      most one transfer to the same recipient on one calendar day. The recipient's arrival transaction
      mirrors the sender's transfer and names it.
    prerequisite:
      - problem: loyalty_ext_relocation_compensation
        kind: value_input
        gate: balance
        form: state
        policy_source: >-
          The largest transfer is worked out only after the points balance carries a relocation
          compensation transaction for every relocated reservation attached to the membership.
        condition: >-
          Every booking_reservations row attached to the membership with status relocated has a
          loyalty_transactions row of event_type loyalty_points_bonus with earning_source
          relocation_compensation naming it, and points_balance includes those points.
        resolved_by: post_relocation_compensation_5afb8ff3
        effect: >-
          The relocation compensation posted raises the points balance by the compensation points, so the
          balance binding and the transferable balance rise by the same amount.
      - problem: loyalty_ext_late_award_cancellation_redeposit
        kind: value_input
        gate: balance
        form: state
        policy_source: >-
          The largest transfer is not worked out until every cancelled or no-show Reward Night Rate
          reservation attached to the membership carries an award redeposit transaction naming its
          redemption.
        condition: >-
          Every booking_reservations row of the Reward Night Rate attached to the membership with status
          cancelled or no_show has a loyalty_transactions row of event_type loyalty_points_redeposit with
          earning_source award_redeposit naming its redemption, and points_balance includes those points.
        resolved_by: return_award_cancellation_points_76b4b6d2
        effect: >-
          The redeposit posted raises the points balance by the points returned, so the balance binding
          and the transferable balance rise by the same amount.
      - problem: loyalty_ext_award_stay_night_credits
        kind: value_input
        gate: net_nights_12m
        form: state
        policy_source: >-
          The transfer allowance is set only once the account carries a night-credit transaction for every
          checked-out Reward Night Rate stay attached to the membership.
        condition: >-
          Every booking_reservations row of the Reward Night Rate attached to the membership with status
          checked_out has a loyalty_transactions row of event_type loyalty_night_credit with earning_source
          stay_nights naming it.
        resolved_by: post_award_stay_night_credits_8b07b6a3
        effect: >-
          The award stay's night credits are added to the net night credits of the twelve months before the
          handling date, which can move the member onto a higher transfer allowance tier.
    cross_category: []
    compute:
      - balance: "F('points_balance')"
      - top_tier: "F('variant_name') == 'Ashbury Rewards Titanium Elite' or F('variant_name') == 'Ashbury Rewards Ambassador Elite'"
      - platinum_or_higher: "F('variant_name') == 'Ashbury Rewards Platinum Elite' or F('variant_name') == 'Ashbury Rewards Titanium Elite' or F('variant_name') == 'Ashbury Rewards Ambassador Elite'"
      - gold_or_platinum: "F('variant_name') == 'Ashbury Rewards Gold Elite' or F('variant_name') == 'Ashbury Rewards Platinum Elite'"
      - net_nights_12m: "SUM('loyalty_transactions','nights', within_months=12, date_field='posted_date', event_type='loyalty_night_credit') - SUM('loyalty_transactions','nights', within_months=12, date_field='posted_date', event_type='loyalty_night_reversal')"
      - transfer_allowance: "K('top_allowance') if (top_tier and net_nights_12m >= K('top_allowance_nights')) else (K('platinum_allowance') if ((F('variant_name') == 'Ashbury Rewards Platinum Elite' and net_nights_12m >= K('platinum_allowance_nights')) or (top_tier and net_nights_12m >= K('platinum_allowance_nights') and net_nights_12m < K('top_allowance_nights'))) else P('points_transfer_out_annual_cap'))"
      - enrolled_months: "MONTHS(F('enrolled_date'), NOW)"
      - received_hold_months: "K('short_received_hold') if (platinum_or_higher and enrolled_months >= K('long_tenure_months')) else (K('mid_received_hold') if (platinum_or_higher and enrolled_months >= K('mid_tenure_months')) else K('standard_received_hold'))"
      - received_held: "SUM('loyalty_transactions','points', within_months=received_hold_months, date_field='posted_date', event_type='loyalty_points_transfer_in')"
      - bought_hold_months: "0 if top_tier else (K('mid_bought_hold') if gold_or_platinum else K('standard_bought_hold'))"
      - bought_held: "SUM('loyalty_transactions','points', within_months=bought_hold_months, date_field='posted_date', event_type='loyalty_points_purchase')"
      - transferable: "MX(0, balance - received_held - bought_held)"
      - sent_12m: "SUM('loyalty_transactions','points', within_months=12, date_field='posted_date', event_type='loyalty_points_transfer_out')"
      - received_12m: "SUM('loyalty_transactions','points', within_months=12, date_field='posted_date', event_type='loyalty_points_transfer_in')"
      - allowance_used: "MX(0, sent_12m - received_12m) if top_tier else (MX(0, sent_12m - K('usage_exemption')) if (gold_or_platinum and enrolled_months >= K('long_tenure_months')) else sent_12m)"
      - remaining_allowance: "MX(0, transfer_allowance - allowance_used)"
      - result: "(MN(transferable, remaining_allowance) // P('points_transfer_increment')) * P('points_transfer_increment')"
    compute_basis:
      balance: "The transferable balance is the points balance less the received points held back and less the bought points held back, never below zero."
      net_nights_12m: "The transfer allowance is set by the tier and by the elite night credits posted in the twelve months before the handling date, less the night credits reversed in those months"
      transfer_allowance: "a member at Ashbury Rewards Titanium Elite or Ambassador Elite with at least seventy-five such night credits has a transfer allowance of three hundred thousand points; a member at Ashbury Rewards Platinum Elite with at least fifty such night credits, or at Ashbury Rewards Titanium Elite or Ambassador Elite with fifty to seventy-four such night credits, has a transfer allowance of two hundred thousand points; any other member has the points transfer out annual cap of the tier."
      enrolled_months: "set by the tier and by the whole calendar months since enrolment"
      received_hold_months: "three months for a member at Platinum Elite or higher enrolled for at least one hundred and twenty months, six months for a member at Platinum Elite or higher enrolled for sixty to one hundred and nineteen months, and twelve months for any other member"
      received_held: "the points held back are those received by transfer in that many months before the handling date."
      bought_hold_months: "Points bought are held back from the transferable balance for a purchased-points hold period set by the tier: no months for a member at Titanium Elite or Ambassador Elite, one month for a member at Gold Elite or Platinum Elite, and three months for any other member"
      bought_held: "the points held back are those bought in that many months before the handling date."
      transferable: "The transferable balance is the points balance less the received points held back and less the bought points held back, never below zero."
      sent_12m: "A period of months before the handling date covers the transactions posted after the same day number that many months earlier, up to and including the handling date."
      received_12m: "A period of months before the handling date covers the transactions posted after the same day number that many months earlier, up to and including the handling date."
      allowance_used: "The allowance used depends on the tier and on the months since enrolment: for a member at Titanium Elite or Ambassador Elite it is the points transferred out in the twelve months before the handling date less the points received by transfer in the same twelve months, never below zero; for a member at Gold Elite or Platinum Elite enrolled for at least one hundred and twenty months it is the points transferred out in those twelve months less an exemption of twenty-five thousand points, never below zero; for any other member it is the points transferred out in those twelve months."
      remaining_allowance: "The remaining transfer allowance is the transfer allowance less the allowance used, never below zero."
      result: "A member who asks to give another member the largest transfer their account allows gives, in one transfer, the lower of the transferable balance and the remaining transfer allowance, rounded down to a multiple of the tier's points transfer increment."
    factors:
      - id: transfer_allowance_tier
        effect: parameter
        decides: transfer_allowance
        bindings: [net_nights_12m, transfer_allowance]
        ladder:
          - when: "the member holds Titanium or Ambassador Elite and at least seventy-five net night credits were posted in the twelve months before the handling date"
            value: "K('top_allowance')"
          - when: "the member holds Platinum Elite with at least fifty net night credits in those twelve months, or Titanium or Ambassador Elite with fifty to seventy-four"
            value: "K('platinum_allowance')"
          - when: "otherwise"
            value: "P('points_transfer_out_annual_cap')"
        baseline:
          transfer_allowance: "P('points_transfer_out_annual_cap')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: received_points_hold
        effect: parameter
        decides: received_hold_months
        bindings: [enrolled_months, received_hold_months, received_held]
        ladder:
          - when: "the member holds Platinum Elite or higher and has been enrolled for at least 120 whole calendar months"
            value: "K('short_received_hold')"
          - when: "the member holds Platinum Elite or higher and has been enrolled for 60 to 119 whole calendar months"
            value: "K('mid_received_hold')"
          - when: "otherwise"
            value: "K('standard_received_hold')"
        baseline:
          received_hold_months: "K('standard_received_hold')"
        evidence: [history, date]
        cross_difficulty: null
      - id: purchased_points_hold
        effect: parameter
        decides: bought_hold_months
        bindings: [bought_hold_months, bought_held]
        ladder:
          - when: "the member holds Titanium or Ambassador Elite"
            value: "0"
          - when: "the member holds Gold or Platinum Elite"
            value: "K('mid_bought_hold')"
          - when: "otherwise"
            value: "K('standard_bought_hold')"
        baseline:
          bought_hold_months: "K('standard_bought_hold')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: transfer_allowance_used
        effect: method
        decides: allowance_used
        bindings: [sent_12m, received_12m, allowance_used]
        ladder:
          - when: "the member holds Titanium or Ambassador Elite"
            method: "points transferred out in the twelve months less points received by transfer in the same months, never below zero"
          - when: "the member holds Gold or Platinum Elite and has been enrolled for at least 120 whole calendar months"
            method: "points transferred out in the twelve months less a fixed exemption of twenty-five thousand points, never below zero"
          - when: "otherwise"
            method: "points transferred out in the twelve months"
        baseline:
          allowance_used: "sent_12m"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A member who asks to give another member the largest transfer their account allows gives, in one
        transfer, the lower of the transferable balance and the remaining transfer allowance, rounded down
        to a multiple of the tier's points transfer increment. The standard transferable balance is the
        points balance less the points received by transfer in the twelve months before the handling date
        and less the points bought in the three months before the handling date. The standard transfer
        allowance is the points transfer out annual cap of the sender's tier, and the standard allowance
        used is the points the member transferred out in the twelve months before the handling date. The
        remaining transfer allowance is the transfer allowance less the allowance used, never below zero.
      params: [points_transfer_out_annual_cap, points_transfer_increment, standard_received_hold, standard_bought_hold]
    inputs:
      history:
        - {table: loyalty_transactions, aggregate: sum, field: nights, within_months: 12, filters: {event_type: loyalty_night_credit}}
        - {table: loyalty_transactions, aggregate: sum, field: points, within_months: 12, filters: {event_type: loyalty_points_transfer_in}}
        - {table: loyalty_transactions, aggregate: sum, field: points, within_months: 12, filters: {event_type: loyalty_points_transfer_out}}
        - {table: loyalty_transactions, aggregate: sum, field: points, within_months: 3, filters: {event_type: loyalty_points_purchase}}
      cross_category: []
  - id: loyalty_ext_stay_elite_bonus
    base_policy_refs: [loyalty_stay_earning, loyalty_missing_stay_credit]
    overwrite:
      - base_policy: loyalty_stay_earning
        superseded_clause: >-
          The elite bonus is the base points times the elite_bonus_pct of the member's tier, rounded down;
          when elite_bonus_on_incidentals is true it is applied to all base points.
        replaced_by: >-
          The elite bonus of the stay is the elite bonus base times the elite bonus percentage divided by
          one hundred, rounded down to a whole point.
    trigger: state_due
    subject: [loyalty_points_earn]
    computes: points
    target_tool: post_stay_elite_bonus_1ee6f132
    params:
      max_bonus_pct: 100
      card_min_transactions: 6
      premier_card_bonus_pct: 10
      standard_card_bonus_pct: 5
      long_stay_nights: 7
      mid_stay_nights: 4
      long_stay_bonus_pct: 10
      mid_stay_bonus_pct: 5
      high_engagement_nights: 50
      mid_engagement_nights: 25
      high_engagement_bonus_pct: 10
      mid_engagement_bonus_pct: 5
      tenure_long_months: 120
      tenure_mid_months: 36
      tenure_long_bonus_pct: 10
      tenure_mid_bonus_pct: 5
    rule: >-
      A completed stay credited to the membership earns, at elite tiers, an elite bonus posted as its own
      stay_elite_bonus transaction naming the stay, separate from the stay's base points. The stay
      concerned is the stay of the latest base points transaction on the account, and its posted base
      points are the stay_base points naming it. The standard elite bonus base is the stay's posted base
      points, and the standard elite bonus percentage is the elite bonus percentage of the member's tier.
      The elite bonus of the stay is the elite bonus base times the elite bonus percentage divided by one
      hundred, rounded down to a whole point. The elite bonus base depends on the rate plan of the stay: a
      stay booked under the Corporate Negotiated Rate or the Group Block Rate takes as elite bonus base the
      base points its room nights earned, which are its nightly rate times its nights times the base
      points per US dollar of the hotel's brand, rounded down to a whole point and never more than its
      posted base points; a stay booked under the Bed & Breakfast Package Rate takes as elite bonus base
      its posted base points less the base points of the plan's package supplement, which are the package
      supplement per night times its nights times the base points per US dollar of the brand, rounded
      down to a whole point; a stay under any other rate plan takes its posted base points. The base points
      per US dollar are five at Ashbury Express and Ashbury Inn & Suites hotels and ten at the other
      brands, as the tier parameters set them. The elite bonus percentage is raised by four add-ons, each
      added in percentage points to the tier's percentage. The card add-on is ten points for a member whose
      linked co-brand card is the Ashbury Rewards Premier card and whose account shows at least six
      co-brand card points transactions posted in the twelve months before the handling date, five points
      for a member whose linked card is the Ashbury Rewards card with at least six such transactions, and
      nothing for any other member. The stay-length add-on is ten points for a stay of seven or more
      nights stayed, five points for a stay of four to six nights stayed, and nothing for a shorter stay;
      the nights stayed are the whole calendar days from the actual check-in date to the actual check-out
      date. The engagement add-on is ten points when the elite night credits posted in the twelve months
      before the handling date, less the night credits reversed in those months, are at least fifty, five
      points when they are twenty-five to forty-nine, and nothing when they are fewer. The tenure add-on is
      ten points for a member enrolled for at least one hundred and twenty whole calendar months by the
      handling date, five points for a member enrolled for thirty-six to one hundred and nineteen whole
      months, and nothing for a member enrolled for fewer months. The elite bonus percentage after the
      add-ons is the tier's percentage plus the four add-ons, never more than one hundred percent. The
      twelve months before the handling date are the transactions posted after the same day number twelve
      months earlier, up to and including the handling date. The elite bonus is posted only when the
      reservation's plan has earns_elite_bonus_points true, only to a membership whose status is active,
      and a stay earns each earning component at most once.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [variant_name, property_brand, nightly_rate, nights, actual_check_in_date, actual_check_out_date, package_supplement_per_night_usd]
        note: The stay's rate plan, brand, nightly rate and nights decide the elite bonus base, and its actual dates decide the stay-length add-on.
    compute:
      - bonus_stay: "LATEST('loyalty_transactions','reservation_id', date_field='posted_date', event_type='loyalty_points_earn', earning_source='stay_base')"
      - posted_base_points: "SUM('loyalty_transactions','points', date_field='posted_date', event_type='loyalty_points_earn', earning_source='stay_base', reservation_id=bonus_stay)"
      - stay_brand: "CFIELD('booking','property_brand', reservation_id=bonus_stay)"
      - brand_points_per_usd: "P('base_points_per_usd_express') if stay_brand == 'Ashbury Express' else (P('base_points_per_usd_inn_suites') if stay_brand == 'Ashbury Inn & Suites' else (P('base_points_per_usd_hotel') if stay_brand == 'Ashbury Hotel' else (P('base_points_per_usd_grand') if stay_brand == 'Ashbury Grand' else (P('base_points_per_usd_resort') if stay_brand == 'Ashbury Resort & Spa' else P('base_points_per_usd_reserve')))))"
      - stay_rate_plan: "CFIELD('booking','variant_name', reservation_id=bonus_stay)"
      - bonus_base: "MN(posted_base_points, int(CFIELD('booking','nightly_rate', reservation_id=bonus_stay) * CFIELD('booking','nights', reservation_id=bonus_stay) * brand_points_per_usd)) if (stay_rate_plan == 'Corporate Negotiated Rate' or stay_rate_plan == 'Group Block Rate') else ((posted_base_points - int(CPARAM('booking','package_supplement_per_night_usd', reservation_id=bonus_stay) * CFIELD('booking','nights', reservation_id=bonus_stay) * brand_points_per_usd)) if stay_rate_plan == 'Bed & Breakfast Package Rate' else posted_base_points)"
      - card_transactions_12m: "COUNT('loyalty_transactions', within_months=12, date_field='posted_date', event_type='loyalty_points_bonus', earning_source='cobrand_spend')"
      - card_addon: "K('premier_card_bonus_pct') if (F('cobrand_card') == 'ashbury_rewards_premier_card' and card_transactions_12m >= K('card_min_transactions')) else (K('standard_card_bonus_pct') if (F('cobrand_card') == 'ashbury_rewards_card' and card_transactions_12m >= K('card_min_transactions')) else 0)"
      - bonus_stay_nights: "DAYS(CFIELD('booking','actual_check_in_date', reservation_id=bonus_stay), CFIELD('booking','actual_check_out_date', reservation_id=bonus_stay))"
      - length_addon: "K('long_stay_bonus_pct') if bonus_stay_nights >= K('long_stay_nights') else (K('mid_stay_bonus_pct') if bonus_stay_nights >= K('mid_stay_nights') else 0)"
      - engagement_nights_12m: "SUM('loyalty_transactions','nights', within_months=12, date_field='posted_date', event_type='loyalty_night_credit') - SUM('loyalty_transactions','nights', within_months=12, date_field='posted_date', event_type='loyalty_night_reversal')"
      - engagement_addon: "K('high_engagement_bonus_pct') if engagement_nights_12m >= K('high_engagement_nights') else (K('mid_engagement_bonus_pct') if engagement_nights_12m >= K('mid_engagement_nights') else 0)"
      - enrolled_months: "MONTHS(F('enrolled_date'), NOW)"
      - tenure_addon: "K('tenure_long_bonus_pct') if enrolled_months >= K('tenure_long_months') else (K('tenure_mid_bonus_pct') if enrolled_months >= K('tenure_mid_months') else 0)"
      - bonus_pct: "MN(K('max_bonus_pct'), P('elite_bonus_pct') + card_addon + length_addon + engagement_addon + tenure_addon)"
      - result: "(bonus_base * bonus_pct) // 100"
    compute_basis:
      bonus_stay: "The stay concerned is the stay of the latest base points transaction on the account, and its posted base points are the stay_base points naming it."
      posted_base_points: "The stay concerned is the stay of the latest base points transaction on the account, and its posted base points are the stay_base points naming it."
      stay_brand: "The base points per US dollar are five at Ashbury Express and Ashbury Inn & Suites hotels and ten at the other brands, as the tier parameters set them."
      brand_points_per_usd: "The base points per US dollar are five at Ashbury Express and Ashbury Inn & Suites hotels and ten at the other brands, as the tier parameters set them."
      stay_rate_plan: "The elite bonus base depends on the rate plan of the stay"
      bonus_base: "a stay booked under the Corporate Negotiated Rate or the Group Block Rate takes as elite bonus base the base points its room nights earned, which are its nightly rate times its nights times the base points per US dollar of the hotel's brand, rounded down to a whole point and never more than its posted base points; a stay booked under the Bed & Breakfast Package Rate takes as elite bonus base its posted base points less the base points of the plan's package supplement, which are the package supplement per night times its nights times the base points per US dollar of the brand, rounded down to a whole point; a stay under any other rate plan takes its posted base points."
      card_transactions_12m: "The twelve months before the handling date are the transactions posted after the same day number twelve months earlier, up to and including the handling date."
      card_addon: "The card add-on is ten points for a member whose linked co-brand card is the Ashbury Rewards Premier card and whose account shows at least six co-brand card points transactions posted in the twelve months before the handling date, five points for a member whose linked card is the Ashbury Rewards card with at least six such transactions, and nothing for any other member."
      bonus_stay_nights: "the nights stayed are the whole calendar days from the actual check-in date to the actual check-out date."
      length_addon: "The stay-length add-on is ten points for a stay of seven or more nights stayed, five points for a stay of four to six nights stayed, and nothing for a shorter stay"
      engagement_nights_12m: "The engagement add-on is ten points when the elite night credits posted in the twelve months before the handling date, less the night credits reversed in those months, are at least fifty"
      engagement_addon: "The engagement add-on is ten points when the elite night credits posted in the twelve months before the handling date, less the night credits reversed in those months, are at least fifty, five points when they are twenty-five to forty-nine, and nothing when they are fewer."
      enrolled_months: "The tenure add-on is ten points for a member enrolled for at least one hundred and twenty whole calendar months by the handling date"
      tenure_addon: "The tenure add-on is ten points for a member enrolled for at least one hundred and twenty whole calendar months by the handling date, five points for a member enrolled for thirty-six to one hundred and nineteen whole months, and nothing for a member enrolled for fewer months."
      bonus_pct: "The elite bonus percentage after the add-ons is the tier's percentage plus the four add-ons, never more than one hundred percent."
      result: "The elite bonus of the stay is the elite bonus base times the elite bonus percentage divided by one hundred, rounded down to a whole point."
    factors:
      - id: elite_bonus_base_by_rate_plan
        effect: method
        decides: bonus_base
        bindings: [stay_rate_plan, bonus_base]
        ladder:
          - when: "the stay was booked under the Corporate Negotiated Rate or the Group Block Rate"
            method: "the base points its room nights earned: nightly rate times nights times the brand's base points per US dollar, rounded down, never more than the posted base points"
          - when: "the stay was booked under the Bed & Breakfast Package Rate"
            method: "the posted base points less the base points of the package supplement (supplement per night times nights times the brand rate, rounded down)"
          - when: "otherwise"
            method: "the posted base points"
        baseline:
          bonus_base: "posted_base_points"
        evidence: [cross_category, history]
        cross_difficulty: booking
      - id: elite_bonus_card_addon
        effect: parameter
        decides: card_addon
        bindings: [card_transactions_12m, card_addon]
        ladder:
          - when: "the linked card is the Ashbury Rewards Premier card and at least six co-brand card points transactions were posted in the twelve months before the handling date"
            value: "K('premier_card_bonus_pct')"
          - when: "the linked card is the Ashbury Rewards card and at least six such transactions were posted"
            value: "K('standard_card_bonus_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          card_addon: "0"
        evidence: [history]
        cross_difficulty: null
      - id: elite_bonus_length_addon
        effect: parameter
        decides: length_addon
        bindings: [bonus_stay_nights, length_addon]
        ladder:
          - when: "the stay has seven or more nights stayed"
            value: "K('long_stay_bonus_pct')"
          - when: "the stay has four to six nights stayed"
            value: "K('mid_stay_bonus_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          length_addon: "0"
        evidence: [cross_category, date]
        cross_difficulty: booking
      - id: elite_bonus_engagement_addon
        effect: parameter
        decides: engagement_addon
        bindings: [engagement_nights_12m, engagement_addon]
        ladder:
          - when: "at least fifty net night credits were posted in the twelve months before the handling date"
            value: "K('high_engagement_bonus_pct')"
          - when: "twenty-five to forty-nine net night credits were posted"
            value: "K('mid_engagement_bonus_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          engagement_addon: "0"
        evidence: [history]
        cross_difficulty: null
      - id: elite_bonus_tenure_addon
        effect: parameter
        decides: tenure_addon
        bindings: [enrolled_months, tenure_addon]
        ladder:
          - when: "enrolled for at least 120 whole calendar months by the handling date"
            value: "K('tenure_long_bonus_pct')"
          - when: "enrolled for 36 to 119 whole calendar months"
            value: "K('tenure_mid_bonus_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_addon: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The stay concerned is the stay of the latest base points transaction on the account, and its
        posted base points are the stay_base points naming it. The standard elite bonus base is the stay's
        posted base points, and the standard elite bonus percentage is the elite bonus percentage of the
        member's tier. The elite bonus of the stay is the elite bonus base times the elite bonus
        percentage divided by one hundred, rounded down to a whole point.
      params: [elite_bonus_pct]
    inputs:
      history:
        - {table: loyalty_transactions, aggregate: sum, field: points, filters: {event_type: loyalty_points_earn, earning_source: stay_base}}
        - {table: loyalty_transactions, aggregate: count, field: transaction_id, within_months: 12, filters: {event_type: loyalty_points_bonus, earning_source: cobrand_spend}}
        - {table: loyalty_transactions, aggregate: sum, field: nights, within_months: 12, filters: {event_type: loyalty_night_credit}}
      cross_category: [booking]
  - id: loyalty_ext_stay_welcome_points
    base_policy_refs: [loyalty_welcome_amenity, loyalty_relocation_compensation, loyalty_promotion_and_card_points]
    overwrite:
      - base_policy: loyalty_welcome_amenity
        superseded_clause: >-
          Elite members receive welcome points once per stay, posted with earning_source welcome_amenity
          when the folio is settled.
        replaced_by: >-
          Elite members receive welcome points in one welcome_amenity transaction per stay naming the stay,
          posted when the folio is settled; that one posting may carry the welcome amount more than once,
          so the tier parameter welcome_amenity_once_per_stay is read as one welcome posting per stay and no
          longer as one welcome amount regardless of the number of nights.
      - base_policy: loyalty_welcome_amenity
        superseded_clause: >-
          The amount is the tier's welcome_amenity_points at Ashbury Hotel, Ashbury Grand, Ashbury Resort &
          Spa and Ashbury Reserve hotels and its welcome_amenity_points_select_service at Ashbury Express and
          Ashbury Inn & Suites hotels; a tier whose amount is 0 receives nothing.
        replaced_by: >-
          The welcome points of the stay are the welcome amount times the welcome units, plus the welcome
          brand supplement, the welcome on-property spend supplement, the welcome stay-frequency supplement
          and the welcome card supplement; a tier whose welcome amount is zero receives nothing.
    trigger: state_due
    subject: [loyalty_points_bonus]
    computes: points
    target_tool: post_stay_welcome_points_0494e852
    params:
      top_tier_nights_per_unit: 2
      top_tier_min_nights: 2
      mid_tier_min_nights: 4
      mid_tier_nights_per_extra_unit: 4
      luxury_brand_supplement: 500
      full_service_brand_supplement: 250
      high_spend_usd: 300.00
      mid_spend_usd: 100.00
      high_spend_supplement: 500
      mid_spend_supplement: 250
      high_frequency_stays: 10
      mid_frequency_stays: 5
      high_frequency_supplement: 500
      mid_frequency_supplement: 250
      card_points_threshold: 20000
      premier_card_supplement: 500
      standard_card_supplement: 250
    rule: >-
      Elite members receive welcome points in one welcome_amenity transaction per stay naming the stay,
      posted when the folio is settled; that one posting may carry the welcome amount more than once, so
      the tier parameter welcome_amenity_once_per_stay is read as one welcome posting per stay and no
      longer as one welcome amount regardless of the number of nights. The stay concerned is the stay of the latest base points
      transaction on the account. The welcome amount is the tier's welcome amenity points at Ashbury
      Hotel, Ashbury Grand, Ashbury Resort & Spa and Ashbury Reserve hotels and the tier's select-service
      welcome amenity points at Ashbury Express and Ashbury Inn & Suites hotels. The standard welcome
      points are the welcome amount, once for the stay. The welcome points of the stay are the welcome
      amount times the welcome units, plus the welcome brand supplement, the welcome on-property spend
      supplement, the welcome stay-frequency supplement and the welcome card supplement; a tier whose
      welcome amount is zero receives nothing. The welcome units depend on the tier and on the nights
      stayed: a member at Ashbury Rewards Platinum Elite, Titanium Elite or Ambassador Elite with two or
      more nights stayed receives one welcome unit for every two nights stayed, an odd last night earning
      nothing; a member at Ashbury Rewards Silver Elite or Gold Elite with four or more nights stayed
      receives one welcome unit plus one more for every four nights stayed; any other member receives one
      welcome unit. The nights stayed are the whole calendar days from the actual check-in date to the
      actual check-out date. A stay at an Ashbury Reserve or Ashbury Resort & Spa hotel carries a welcome
      brand supplement of five hundred points, a stay at an Ashbury Grand or Ashbury Hotel carries two
      hundred and fifty points, and a stay at an Ashbury Express or Ashbury Inn & Suites hotel carries
      none. The on-property spend of the stay is the breakfast, food and beverage and spa charges on its
      folio less the adjustments posted against those charges; an on-property spend of three hundred US
      dollars or more carries a welcome on-property spend supplement of five hundred points, one from one
      hundred dollars up to but not including three hundred dollars carries two hundred and fifty points,
      and a lower one carries none. A member whose account shows ten or more stay night-credit
      transactions posted in the twelve months before the handling date carries a welcome stay-frequency
      supplement of five hundred points, five to nine such transactions carry two hundred and fifty points,
      and fewer carry none. A member whose linked co-brand card is the Ashbury Rewards Premier card and
      whose co-brand card points posted in the twelve months before the handling date total at least
      twenty thousand carries a welcome card supplement of five hundred points; a member whose linked card
      is the Ashbury Rewards card with card points of at least twenty thousand in those months carries two
      hundred and fifty points; any other member carries none. The twelve months before the handling date
      are the transactions posted after the same day number twelve months earlier, up to and including the
      handling date. Reward Night Rate stays receive welcome points when welcome_amenity_on_reward_stays is
      true. Reservations booked through an online travel agency receive none. The tier is read as under
      loyalty_stay_earning, and when it cannot be read the welcome points are left to Ashbury Rewards
      member services. A stay receives welcome points at most once. Welcome points are posted only to a
      membership whose status is active.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [property_brand, actual_check_in_date, actual_check_out_date]
        note: The stay's brand sets the welcome amount and brand supplement, and its actual dates set the nights stayed behind the welcome units.
      - category: folio
        as: history
        reads: [folio_accounts.folio_id, folio_postings.amount]
        note: The on-property spend supplement is decided from the breakfast, food and beverage and spa lines of the stay's folio and their adjustments.
    compute:
      - welcome_stay: "LATEST('loyalty_transactions','reservation_id', date_field='posted_date', event_type='loyalty_points_earn', earning_source='stay_base')"
      - welcome_brand: "CFIELD('booking','property_brand', reservation_id=welcome_stay)"
      - welcome_amount: "P('welcome_amenity_points_select_service') if (welcome_brand == 'Ashbury Express' or welcome_brand == 'Ashbury Inn & Suites') else P('welcome_amenity_points')"
      - welcome_nights: "DAYS(CFIELD('booking','actual_check_in_date', reservation_id=welcome_stay), CFIELD('booking','actual_check_out_date', reservation_id=welcome_stay))"
      - top_welcome_tier: "F('variant_name') == 'Ashbury Rewards Platinum Elite' or F('variant_name') == 'Ashbury Rewards Titanium Elite' or F('variant_name') == 'Ashbury Rewards Ambassador Elite'"
      - mid_welcome_tier: "F('variant_name') == 'Ashbury Rewards Silver Elite' or F('variant_name') == 'Ashbury Rewards Gold Elite'"
      - welcome_units: "(welcome_nights // K('top_tier_nights_per_unit')) if (top_welcome_tier and welcome_nights >= K('top_tier_min_nights')) else ((1 + welcome_nights // K('mid_tier_nights_per_extra_unit')) if (mid_welcome_tier and welcome_nights >= K('mid_tier_min_nights')) else 1)"
      - brand_supplement: "K('luxury_brand_supplement') if (CFIELD('booking','property_brand', reservation_id=welcome_stay) == 'Ashbury Reserve' or CFIELD('booking','property_brand', reservation_id=welcome_stay) == 'Ashbury Resort & Spa') else (K('full_service_brand_supplement') if (CFIELD('booking','property_brand', reservation_id=welcome_stay) == 'Ashbury Grand' or CFIELD('booking','property_brand', reservation_id=welcome_stay) == 'Ashbury Hotel') else 0)"
      - stay_folio: "CFIELD('folio','folio_id', reservation_id=welcome_stay)"
      - onproperty_spend: "XSUM('folio','folio_postings','amount', folio_id=stay_folio, event_type='folio_incidental_charge', charge_code='breakfast') + XSUM('folio','folio_postings','amount', folio_id=stay_folio, event_type='folio_incidental_charge', charge_code='food_beverage') + XSUM('folio','folio_postings','amount', folio_id=stay_folio, event_type='folio_incidental_charge', charge_code='spa') - XSUM('folio','folio_postings','amount', folio_id=stay_folio, event_type='folio_adjustment', charge_code='breakfast') - XSUM('folio','folio_postings','amount', folio_id=stay_folio, event_type='folio_adjustment', charge_code='food_beverage') - XSUM('folio','folio_postings','amount', folio_id=stay_folio, event_type='folio_adjustment', charge_code='spa')"
      - spend_supplement: "K('high_spend_supplement') if onproperty_spend >= K('high_spend_usd') else (K('mid_spend_supplement') if onproperty_spend >= K('mid_spend_usd') else 0)"
      - stays_12m: "COUNT('loyalty_transactions', within_months=12, date_field='posted_date', event_type='loyalty_night_credit', earning_source='stay_nights')"
      - frequency_supplement: "K('high_frequency_supplement') if stays_12m >= K('high_frequency_stays') else (K('mid_frequency_supplement') if stays_12m >= K('mid_frequency_stays') else 0)"
      - card_points_12m: "SUM('loyalty_transactions','points', within_months=12, date_field='posted_date', event_type='loyalty_points_bonus', earning_source='cobrand_spend')"
      - card_supplement: "K('premier_card_supplement') if (F('cobrand_card') == 'ashbury_rewards_premier_card' and card_points_12m >= K('card_points_threshold')) else (K('standard_card_supplement') if (F('cobrand_card') == 'ashbury_rewards_card' and card_points_12m >= K('card_points_threshold')) else 0)"
      - result: "0 if welcome_amount == 0 else (welcome_amount * welcome_units + brand_supplement + spend_supplement + frequency_supplement + card_supplement)"
    compute_basis:
      welcome_stay: "The stay concerned is the stay of the latest base points transaction on the account."
      welcome_brand: "The welcome amount is the tier's welcome amenity points at Ashbury Hotel, Ashbury Grand, Ashbury Resort & Spa and Ashbury Reserve hotels and the tier's select-service welcome amenity points at Ashbury Express and Ashbury Inn & Suites hotels."
      welcome_amount: "The welcome amount is the tier's welcome amenity points at Ashbury Hotel, Ashbury Grand, Ashbury Resort & Spa and Ashbury Reserve hotels and the tier's select-service welcome amenity points at Ashbury Express and Ashbury Inn & Suites hotels."
      welcome_nights: "The nights stayed are the whole calendar days from the actual check-in date to the actual check-out date."
      welcome_units: "The welcome units depend on the tier and on the nights stayed: a member at Ashbury Rewards Platinum Elite, Titanium Elite or Ambassador Elite with two or more nights stayed receives one welcome unit for every two nights stayed, an odd last night earning nothing; a member at Ashbury Rewards Silver Elite or Gold Elite with four or more nights stayed receives one welcome unit plus one more for every four nights stayed; any other member receives one welcome unit."
      brand_supplement: "A stay at an Ashbury Reserve or Ashbury Resort & Spa hotel carries a welcome brand supplement of five hundred points, a stay at an Ashbury Grand or Ashbury Hotel carries two hundred and fifty points, and a stay at an Ashbury Express or Ashbury Inn & Suites hotel carries none."
      stay_folio: "The on-property spend of the stay is the breakfast, food and beverage and spa charges on its folio less the adjustments posted against those charges"
      onproperty_spend: "The on-property spend of the stay is the breakfast, food and beverage and spa charges on its folio less the adjustments posted against those charges"
      spend_supplement: "an on-property spend of three hundred US dollars or more carries a welcome on-property spend supplement of five hundred points, one from one hundred dollars up to but not including three hundred dollars carries two hundred and fifty points, and a lower one carries none."
      stays_12m: "The twelve months before the handling date are the transactions posted after the same day number twelve months earlier, up to and including the handling date."
      frequency_supplement: "A member whose account shows ten or more stay night-credit transactions posted in the twelve months before the handling date carries a welcome stay-frequency supplement of five hundred points, five to nine such transactions carry two hundred and fifty points, and fewer carry none."
      card_points_12m: "The twelve months before the handling date are the transactions posted after the same day number twelve months earlier, up to and including the handling date."
      card_supplement: "A member whose linked co-brand card is the Ashbury Rewards Premier card and whose co-brand card points posted in the twelve months before the handling date total at least twenty thousand carries a welcome card supplement of five hundred points; a member whose linked card is the Ashbury Rewards card with card points of at least twenty thousand in those months carries two hundred and fifty points; any other member carries none."
      result: "The welcome points of the stay are the welcome amount times the welcome units, plus the welcome brand supplement, the welcome on-property spend supplement, the welcome stay-frequency supplement and the welcome card supplement; a tier whose welcome amount is zero receives nothing."
    factors:
      - id: welcome_units_by_tier_and_nights
        effect: method
        decides: welcome_units
        bindings: [welcome_nights, top_welcome_tier, mid_welcome_tier, welcome_units]
        ladder:
          - when: "the member holds Platinum, Titanium or Ambassador Elite and stayed two or more nights"
            method: "one welcome unit for every two nights stayed, an odd last night earning nothing"
          - when: "the member holds Silver or Gold Elite and stayed four or more nights"
            method: "one welcome unit plus one more for every four nights stayed"
          - when: "otherwise"
            method: "one welcome unit for the stay"
        baseline:
          welcome_units: "1"
        evidence: [cross_category, date, tier_param]
        cross_difficulty: booking
      - id: welcome_brand_supplement
        effect: parameter
        decides: brand_supplement
        bindings: [brand_supplement]
        ladder:
          - when: "the stay was at an Ashbury Reserve or Ashbury Resort & Spa hotel"
            value: "K('luxury_brand_supplement')"
          - when: "the stay was at an Ashbury Grand or Ashbury Hotel"
            value: "K('full_service_brand_supplement')"
          - when: "otherwise"
            value: "0"
        baseline:
          brand_supplement: "0"
        evidence: [cross_category]
        cross_difficulty: booking
      - id: welcome_onproperty_spend_supplement
        effect: parameter
        decides: spend_supplement
        bindings: [stay_folio, onproperty_spend, spend_supplement]
        ladder:
          - when: "the stay's on-property spend is three hundred US dollars or more"
            value: "K('high_spend_supplement')"
          - when: "it is from one hundred dollars up to but not including three hundred dollars"
            value: "K('mid_spend_supplement')"
          - when: "otherwise"
            value: "0"
        baseline:
          spend_supplement: "0"
        evidence: [cross_category, history]
        cross_difficulty: folio
      - id: welcome_frequency_supplement
        effect: parameter
        decides: frequency_supplement
        bindings: [stays_12m, frequency_supplement]
        ladder:
          - when: "ten or more stay night-credit transactions were posted in the twelve months before the handling date"
            value: "K('high_frequency_supplement')"
          - when: "five to nine were posted"
            value: "K('mid_frequency_supplement')"
          - when: "otherwise"
            value: "0"
        baseline:
          frequency_supplement: "0"
        evidence: [history]
        cross_difficulty: null
      - id: welcome_card_supplement
        effect: parameter
        decides: card_supplement
        bindings: [card_points_12m, card_supplement]
        ladder:
          - when: "the linked card is the Ashbury Rewards Premier card and co-brand card points of the twelve months total at least twenty thousand"
            value: "K('premier_card_supplement')"
          - when: "the linked card is the Ashbury Rewards card and those card points total at least twenty thousand"
            value: "K('standard_card_supplement')"
          - when: "otherwise"
            value: "0"
        baseline:
          card_supplement: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The stay concerned is the stay of the latest base points transaction on the account. The welcome
        amount is the tier's welcome amenity points at Ashbury Hotel, Ashbury Grand, Ashbury Resort & Spa
        and Ashbury Reserve hotels and the tier's select-service welcome amenity points at Ashbury Express
        and Ashbury Inn & Suites hotels. The standard welcome points are the welcome amount, once for the
        stay.
      params: [welcome_amenity_points, welcome_amenity_points_select_service]
    inputs:
      history:
        - {table: loyalty_transactions, aggregate: count, field: transaction_id, within_months: 12, filters: {event_type: loyalty_night_credit, earning_source: stay_nights}}
        - {table: loyalty_transactions, aggregate: sum, field: points, within_months: 12, filters: {event_type: loyalty_points_bonus, earning_source: cobrand_spend}}
        - {category: folio, table: folio_postings, aggregate: sum, field: amount, filters: {event_type: folio_incidental_charge}}
      cross_category: [booking, folio]
  - id: loyalty_ext_corrected_stay_reversal
    base_policy_refs: [loyalty_stay_credit_reversal]
    overwrite:
      - base_policy: loyalty_stay_credit_reversal
        superseded_clause: >-
          The points reversed are the base points and elite bonus posted for the stay less the base points
          and elite bonus that loyalty_stay_earning gives on the corrected eligible spend, with the same
          tier and brand rate, and the reversal names the stay_base earning transaction it reduces and
          records the eligible spend removed.
        replaced_by: >-
          The points reversed are the reversal before relief, reduced by the late-correction reduction and
          then by the goodwill waiver and the tenure waiver, never below zero, and the reversal names the
          stay_base earning transaction it reduces and records the eligible spend removed.
    trigger: state_due
    subject: [loyalty_points_reversal]
    computes: points
    target_tool: reverse_corrected_stay_points_b6469913
    params:
      high_waiver_nights: 50
      mid_waiver_nights: 25
      high_goodwill_waiver: 2000
      mid_goodwill_waiver: 1000
      long_delay_days: 90
      mid_delay_days: 30
      long_delay_reduction_pct: 50
      mid_delay_reduction_pct: 25
      tenure_long_months: 120
      tenure_mid_months: 36
      tenure_long_waiver: 1000
      tenure_mid_waiver: 500
    rule: >-
      When a folio correction removes eligible spend from a stay that was already credited, the points
      earned on the removed spend are taken back as one stay_credit_reversal transaction. The corrected
      stay is the stay of the folio that carries the latest adjustment posted on the member's folios, and
      the correction date is the posted date of that adjustment. The removed eligible spend is the
      adjustments on that folio posted against room, breakfast, food and beverage and spa charges; the
      hotel-error spend is the part of it whose adjustments carry the reason duplicate_posting or
      incorrect_rate, and the other removed spend is the rest. The credited rate of the stay is its posted
      base points divided by the eligible spend they were posted on, and its credited bonus ratio is its
      posted elite bonus divided by its posted base points, each rounded to four decimal places. The base
      points removed are the removed eligible spend times the credited rate, rounded down to a whole point,
      and the elite bonus removed is the base points of the bonus-bearing spend, which are that spend times
      the credited rate rounded down to a whole point, times the credited bonus ratio, rounded down to a
      whole point. The reversal before relief is the base points removed plus the elite bonus removed. The
      standard bonus-bearing spend is the whole removed eligible spend, and the standard reversal is the
      reversal before relief with no reduction and no waiver. The bonus-bearing spend depends on why the
      spend was removed: when every eligible-spend adjustment on the folio carries a hotel-error reason,
      the bonus-bearing spend is nothing and the elite bonus stays with the member; when the folio carries
      both hotel-error adjustments and other adjustments and the member holds Ashbury Rewards Gold Elite
      or higher, the bonus-bearing spend is the other removed spend only; in any other case it is the
      whole removed eligible spend. The reversal before relief is reduced by a late-correction reduction of
      fifty percent when the correction date is more than ninety calendar days after the stay's actual
      check-out date, of twenty-five percent when it is thirty-one to ninety days after, and of nothing
      when it is thirty days or fewer after; the reduced reversal is rounded down to a whole point. A
      member at Ashbury Rewards Platinum Elite or higher whose elite night credits posted in the twelve
      months before the handling date, less the night credits reversed in those months, are at least fifty
      has the first two thousand points of the reduced reversal waived; a member at Ashbury Rewards Gold
      Elite with at least twenty-five such night credits, or at Ashbury Rewards Platinum Elite or higher
      with twenty-five to forty-nine, has the first one thousand points waived; any other member has no
      goodwill waiver. A member enrolled for at least one hundred
      and twenty whole calendar months by the handling date has a further tenure waiver of one thousand
      points, a member enrolled for thirty-six to one hundred and nineteen whole months has a tenure waiver
      of five hundred points, and a member enrolled for fewer months has none. The twelve months before the
      handling date are the transactions posted after the same day number twelve months earlier, up to and
      including the handling date. The points reversed are the reversal before relief, reduced by the
      late-correction reduction and then by the goodwill waiver and the tenure waiver, never below zero,
      and the reversal names the stay_base earning transaction it reduces and records the eligible spend
      removed. A reversal is posted only when the stay has an earning transaction. Corrections that do not
      touch eligible spend, such as resort fee, tax, parking or late check-out adjustments, reverse
      nothing. A reversal is posted even when it leaves the points balance below zero; a negative balance
      blocks redemptions and transfers until it is restored by later earning.
    prerequisite: []
    cross_category:
      - category: folio
        as: history
        reads: [folio_postings.folio_id, folio_postings.posted_date, folio_postings.amount, folio_postings.charge_code, folio_postings.adjustment_reason, folio_accounts.reservation_id]
        note: The latest adjustment on the member's folios selects the corrected stay and its date, and the adjustments by charge code and reason decide the removed and bonus-bearing spend.
      - category: booking
        as: branch
        reads: [actual_check_out_date]
        note: The corrected stay's actual check-out date anchors the late-correction reduction.
    compute:
      - corrected_folio: "XLATEST('folio','folio_postings','folio_id', date_field='posted_date', event_type='folio_adjustment')"
      - correction_date: "XLATEST('folio','folio_postings','posted_date', date_field='posted_date', event_type='folio_adjustment')"
      - corrected_stay: "CFIELD('folio','reservation_id', folio_id=corrected_folio)"
      - posted_base_points: "SUM('loyalty_transactions','points', date_field='posted_date', event_type='loyalty_points_earn', earning_source='stay_base', reservation_id=corrected_stay)"
      - posted_spend: "SUM('loyalty_transactions','eligible_spend_usd', date_field='posted_date', event_type='loyalty_points_earn', earning_source='stay_base', reservation_id=corrected_stay)"
      - posted_bonus_points: "SUM('loyalty_transactions','points', date_field='posted_date', event_type='loyalty_points_earn', earning_source='stay_elite_bonus', reservation_id=corrected_stay)"
      - removed_spend: "XSUM('folio','folio_postings','amount', folio_id=corrected_folio, event_type='folio_adjustment', charge_code='room') + XSUM('folio','folio_postings','amount', folio_id=corrected_folio, event_type='folio_adjustment', charge_code='breakfast') + XSUM('folio','folio_postings','amount', folio_id=corrected_folio, event_type='folio_adjustment', charge_code='food_beverage') + XSUM('folio','folio_postings','amount', folio_id=corrected_folio, event_type='folio_adjustment', charge_code='spa')"
      - hotel_error_spend: "XSUM('folio','folio_postings','amount', folio_id=corrected_folio, event_type='folio_adjustment', charge_code='room', adjustment_reason='duplicate_posting') + XSUM('folio','folio_postings','amount', folio_id=corrected_folio, event_type='folio_adjustment', charge_code='room', adjustment_reason='incorrect_rate') + XSUM('folio','folio_postings','amount', folio_id=corrected_folio, event_type='folio_adjustment', charge_code='breakfast', adjustment_reason='duplicate_posting') + XSUM('folio','folio_postings','amount', folio_id=corrected_folio, event_type='folio_adjustment', charge_code='breakfast', adjustment_reason='incorrect_rate') + XSUM('folio','folio_postings','amount', folio_id=corrected_folio, event_type='folio_adjustment', charge_code='food_beverage', adjustment_reason='duplicate_posting') + XSUM('folio','folio_postings','amount', folio_id=corrected_folio, event_type='folio_adjustment', charge_code='food_beverage', adjustment_reason='incorrect_rate') + XSUM('folio','folio_postings','amount', folio_id=corrected_folio, event_type='folio_adjustment', charge_code='spa', adjustment_reason='duplicate_posting') + XSUM('folio','folio_postings','amount', folio_id=corrected_folio, event_type='folio_adjustment', charge_code='spa', adjustment_reason='incorrect_rate')"
      - other_removed_spend: "RND(removed_spend - hotel_error_spend, 2)"
      - credited_rate: "RND(posted_base_points / posted_spend, 4)"
      - credited_bonus_ratio: "RND(posted_bonus_points / posted_base_points, 4)"
      - gold_or_higher: "F('variant_name') == 'Ashbury Rewards Gold Elite' or F('variant_name') == 'Ashbury Rewards Platinum Elite' or F('variant_name') == 'Ashbury Rewards Titanium Elite' or F('variant_name') == 'Ashbury Rewards Ambassador Elite'"
      - bonus_bearing_spend: "0 if (hotel_error_spend > 0 and other_removed_spend == 0) else (other_removed_spend if (hotel_error_spend > 0 and other_removed_spend > 0 and gold_or_higher) else removed_spend)"
      - reversal_before_relief: "int(removed_spend * credited_rate) + int(int(bonus_bearing_spend * credited_rate) * credited_bonus_ratio)"
      - delay_days: "DAYS(CFIELD('booking','actual_check_out_date', reservation_id=corrected_stay), correction_date)"
      - late_reduction_pct: "K('long_delay_reduction_pct') if delay_days > K('long_delay_days') else (K('mid_delay_reduction_pct') if delay_days > K('mid_delay_days') else 0)"
      - waiver_nights_12m: "SUM('loyalty_transactions','nights', within_months=12, date_field='posted_date', event_type='loyalty_night_credit') - SUM('loyalty_transactions','nights', within_months=12, date_field='posted_date', event_type='loyalty_night_reversal')"
      - goodwill_waiver: "K('high_goodwill_waiver') if ((F('variant_name') == 'Ashbury Rewards Platinum Elite' or F('variant_name') == 'Ashbury Rewards Titanium Elite' or F('variant_name') == 'Ashbury Rewards Ambassador Elite') and waiver_nights_12m >= K('high_waiver_nights')) else (K('mid_goodwill_waiver') if ((F('variant_name') == 'Ashbury Rewards Gold Elite' and waiver_nights_12m >= K('mid_waiver_nights')) or ((F('variant_name') == 'Ashbury Rewards Platinum Elite' or F('variant_name') == 'Ashbury Rewards Titanium Elite' or F('variant_name') == 'Ashbury Rewards Ambassador Elite') and waiver_nights_12m >= K('mid_waiver_nights') and waiver_nights_12m < K('high_waiver_nights'))) else 0)"
      - enrolled_months: "MONTHS(F('enrolled_date'), NOW)"
      - tenure_waiver: "K('tenure_long_waiver') if enrolled_months >= K('tenure_long_months') else (K('tenure_mid_waiver') if enrolled_months >= K('tenure_mid_months') else 0)"
      - result: "MX(0, (reversal_before_relief * (100 - late_reduction_pct)) // 100 - goodwill_waiver - tenure_waiver)"
    compute_basis:
      corrected_folio: "The corrected stay is the stay of the folio that carries the latest adjustment posted on the member's folios, and the correction date is the posted date of that adjustment."
      correction_date: "The corrected stay is the stay of the folio that carries the latest adjustment posted on the member's folios, and the correction date is the posted date of that adjustment."
      corrected_stay: "The corrected stay is the stay of the folio that carries the latest adjustment posted on the member's folios"
      posted_base_points: "The credited rate of the stay is its posted base points divided by the eligible spend they were posted on"
      posted_spend: "The credited rate of the stay is its posted base points divided by the eligible spend they were posted on"
      posted_bonus_points: "its credited bonus ratio is its posted elite bonus divided by its posted base points, each rounded to four decimal places."
      removed_spend: "The removed eligible spend is the adjustments on that folio posted against room, breakfast, food and beverage and spa charges"
      hotel_error_spend: "the hotel-error spend is the part of it whose adjustments carry the reason duplicate_posting or incorrect_rate, and the other removed spend is the rest."
      other_removed_spend: "the hotel-error spend is the part of it whose adjustments carry the reason duplicate_posting or incorrect_rate, and the other removed spend is the rest."
      credited_rate: "The credited rate of the stay is its posted base points divided by the eligible spend they were posted on, and its credited bonus ratio is its posted elite bonus divided by its posted base points, each rounded to four decimal places."
      credited_bonus_ratio: "The credited rate of the stay is its posted base points divided by the eligible spend they were posted on, and its credited bonus ratio is its posted elite bonus divided by its posted base points, each rounded to four decimal places."
      bonus_bearing_spend: "The bonus-bearing spend depends on why the spend was removed: when every eligible-spend adjustment on the folio carries a hotel-error reason, the bonus-bearing spend is nothing and the elite bonus stays with the member; when the folio carries both hotel-error adjustments and other adjustments and the member holds Ashbury Rewards Gold Elite or higher, the bonus-bearing spend is the other removed spend only; in any other case it is the whole removed eligible spend."
      reversal_before_relief: "The base points removed are the removed eligible spend times the credited rate, rounded down to a whole point, and the elite bonus removed is the base points of the bonus-bearing spend, which are that spend times the credited rate rounded down to a whole point, times the credited bonus ratio, rounded down to a whole point. The reversal before relief is the base points removed plus the elite bonus removed."
      delay_days: "when the correction date is more than ninety calendar days after the stay's actual check-out date"
      late_reduction_pct: "The reversal before relief is reduced by a late-correction reduction of fifty percent when the correction date is more than ninety calendar days after the stay's actual check-out date, of twenty-five percent when it is thirty-one to ninety days after, and of nothing when it is thirty days or fewer after; the reduced reversal is rounded down to a whole point."
      waiver_nights_12m: "The twelve months before the handling date are the transactions posted after the same day number twelve months earlier, up to and including the handling date."
      goodwill_waiver: "A member at Ashbury Rewards Platinum Elite or higher whose elite night credits posted in the twelve months before the handling date, less the night credits reversed in those months, are at least fifty has the first two thousand points of the reduced reversal waived; a member at Ashbury Rewards Gold Elite with at least twenty-five such night credits, or at Ashbury Rewards Platinum Elite or higher with twenty-five to forty-nine, has the first one thousand points waived; any other member has no goodwill waiver."
      enrolled_months: "A member enrolled for at least one hundred and twenty whole calendar months by the handling date has a further tenure waiver of one thousand points"
      tenure_waiver: "A member enrolled for at least one hundred and twenty whole calendar months by the handling date has a further tenure waiver of one thousand points, a member enrolled for thirty-six to one hundred and nineteen whole months has a tenure waiver of five hundred points, and a member enrolled for fewer months has none."
      result: "The points reversed are the reversal before relief, reduced by the late-correction reduction and then by the goodwill waiver and the tenure waiver, never below zero, and the reversal names the stay_base earning transaction it reduces and records the eligible spend removed."
    factors:
      - id: reversal_bonus_bearing_spend
        effect: method
        decides: bonus_bearing_spend
        bindings: [hotel_error_spend, other_removed_spend, gold_or_higher, bonus_bearing_spend]
        ladder:
          - when: "every eligible-spend adjustment on the folio carries a hotel-error reason (duplicate_posting or incorrect_rate)"
            method: "no bonus-bearing spend: only base points are taken back and the elite bonus stays with the member"
          - when: "the folio carries both hotel-error and other adjustments and the member holds Gold Elite or higher"
            method: "the elite bonus is taken back on the other removed spend only"
          - when: "otherwise"
            method: "the elite bonus is taken back on the whole removed eligible spend"
        baseline:
          bonus_bearing_spend: "removed_spend"
        evidence: [cross_category, history]
        cross_difficulty: folio
      - id: reversal_late_correction_reduction
        effect: parameter
        decides: late_reduction_pct
        bindings: [delay_days, late_reduction_pct]
        ladder:
          - when: "the correction date is more than ninety calendar days after the actual check-out date"
            value: "K('long_delay_reduction_pct')"
          - when: "it is thirty-one to ninety days after"
            value: "K('mid_delay_reduction_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          late_reduction_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: booking
      - id: reversal_goodwill_waiver
        effect: parameter
        decides: goodwill_waiver
        bindings: [waiver_nights_12m, goodwill_waiver]
        ladder:
          - when: "the member holds Platinum Elite or higher and at least fifty net night credits were posted in the twelve months before the handling date"
            value: "K('high_goodwill_waiver')"
          - when: "the member holds Gold Elite with at least twenty-five net night credits, or Platinum Elite or higher with twenty-five to forty-nine"
            value: "K('mid_goodwill_waiver')"
          - when: "otherwise"
            value: "0"
        baseline:
          goodwill_waiver: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: reversal_tenure_waiver
        effect: parameter
        decides: tenure_waiver
        bindings: [enrolled_months, tenure_waiver]
        ladder:
          - when: "enrolled for at least 120 whole calendar months by the handling date"
            value: "K('tenure_long_waiver')"
          - when: "enrolled for 36 to 119 whole calendar months"
            value: "K('tenure_mid_waiver')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_waiver: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The corrected stay is the stay of the folio that carries the latest adjustment posted on the
        member's folios, and the correction date is the posted date of that adjustment. The removed
        eligible spend is the adjustments on that folio posted against room, breakfast, food and beverage
        and spa charges; the hotel-error spend is the part of it whose adjustments carry the reason
        duplicate_posting or incorrect_rate, and the other removed spend is the rest. The credited rate of
        the stay is its posted base points divided by the eligible spend they were posted on, and its
        credited bonus ratio is its posted elite bonus divided by its posted base points, each rounded to
        four decimal places. The base points removed are the removed eligible spend times the credited
        rate, rounded down to a whole point, and the elite bonus removed is the base points of the
        bonus-bearing spend, which are that spend times the credited rate rounded down to a whole point,
        times the credited bonus ratio, rounded down to a whole point. The reversal before relief is the
        base points removed plus the elite bonus removed. The standard bonus-bearing spend is the whole
        removed eligible spend, and the standard reversal is the reversal before relief with no reduction
        and no waiver.
      params: []
    inputs:
      history:
        - {table: loyalty_transactions, aggregate: sum, field: points, filters: {event_type: loyalty_points_earn, earning_source: stay_base}}
        - {table: loyalty_transactions, aggregate: sum, field: nights, within_months: 12, filters: {event_type: loyalty_night_credit}}
        - {category: folio, table: folio_postings, aggregate: sum, field: amount, filters: {event_type: folio_adjustment}}
      cross_category: [folio, booking]
  - id: loyalty_ext_largest_points_purchase
    base_policy_refs: [loyalty_purchase_rules]
    overwrite:
      - base_policy: loyalty_purchase_rules
        superseded_clause: >-
          Points are bought in multiples of points_purchase_increment at points_purchase_price_per_1000_usd
          for each 1,000 points, before any sales tax.
        replaced_by: >-
          The price of the purchase is the points bought divided by one thousand times the price per
          thousand points, rounded to two decimal places, before any sales tax.
      - base_policy: loyalty_purchase_rules
        superseded_clause: >-
          The points bought in one calendar year, counted with loyalty_msr_purchased_ytd and including the
          purchase being made, may not exceed points_purchase_annual_cap; a request beyond the cap is reduced
          to the remaining allowance or declined, never split across another member's account.
        replaced_by: >-
          The points bought in the twelve months before the handling date, including the purchase being
          made, may not exceed the purchase allowance; a request beyond it is reduced to the remaining
          allowance or declined, never split across another member's account.
    trigger: on_request
    subject: [loyalty_points_purchase]
    computes: purchase_amount_usd
    target_tool: buy_points_b3668dab
    params:
      young_account_months: 24
      matched_extra_points: 10000
      high_spend_usd: 10000.00
      mid_spend_usd: 5000.00
      high_spend_extra_points: 10000
      mid_spend_extra_points: 5000
      large_order_points: 50000
      mid_order_points: 20000
      large_order_price_usd: 11.50
      mid_order_price_usd: 12.00
      high_activity_redemptions: 3
      mid_activity_redemptions: 1
      high_activity_discount_usd: 0.75
      mid_activity_discount_usd: 0.25
      tenure_long_months: 120
      tenure_mid_months: 36
      tenure_long_discount_usd: 0.75
      tenure_mid_discount_usd: 0.25
    rule: >-
      A member may buy points for their own account, paying with their own card; buying is the member's
      own decision and payment, made by the member personally. A member who asks to buy the most points
      they are allowed buys, in one purchase, the remaining purchase allowance rounded down to a multiple
      of the tier's points purchase increment. The purchase allowance is fixed only after every stay
      credited at an elite tier whose base points stand on the account carries its elite bonus
      transaction. The purchase allowance is not fixed until the stay of the latest base points transaction
      on the account carries its welcome points transaction whenever the tier in effect by that stay's
      check-out date gives it a welcome amount above zero. The purchase allowance is fixed only once every
      credited stay whose folio carries an eligible-spend adjustment posted after its base points carries
      a stay credit reversal naming its base points transaction. The points earned from stays in the twelve
      months before the handling date are the stay_base and stay_elite_bonus points and the welcome points
      posted in those months less the stay credit reversals posted in those months. The standard purchase
      allowance is the points purchase annual cap of the tier, and the remaining purchase allowance is the
      purchase allowance less the points bought in the twelve months before the handling date, never below
      zero. The standard price per thousand points is the tier's points purchase price per 1,000 points.
      The price of the purchase is the points bought divided by one thousand times the price per thousand
      points, rounded to two decimal places, before any sales tax. The base of the purchase allowance
      depends on the age of the account and on the tier: an account enrolled for fewer than twenty-four
      whole calendar months by the handling date takes as base the points earned from stays in the twelve
      months; an account enrolled for twenty-four or more whole months whose member holds Ashbury Rewards
      Member, Silver Elite or Gold Elite takes as base the points earned from stays in the twelve months
      plus ten thousand points; any other account takes the points purchase annual cap of the tier. The
      qualifying spend of the twelve months is the eligible spend of the stay_base transactions posted in
      those months less the eligible spend removed by the stay credit reversals posted in them; a
      qualifying spend of ten thousand US dollars or more adds a spend supplement of ten thousand points to
      the base, five thousand to nine thousand nine hundred ninety-nine dollars and ninety-nine cents adds
      five thousand points, and a lower spend adds none. The purchase allowance is the base plus the spend
      supplement, never more than the points purchase annual cap of the tier; the cap is applied after the
      supplement is added. The price per thousand points is the order price less the award-activity
      discount and less the tenure discount. The order price is eleven US dollars and fifty cents per
      thousand points for a purchase of fifty thousand points or more, twelve dollars for a purchase of
      twenty thousand to forty-nine thousand points, and the tier's points purchase price per 1,000 points
      for a smaller purchase. The award-activity discount is seventy-five cents per thousand points when at
      least three award_redemption transactions were posted in the twelve months before the handling date,
      twenty-five cents when one or two were posted, and nothing when none was posted. The tenure discount
      is seventy-five cents per thousand points for a member enrolled for at least one hundred and twenty
      whole calendar months by the handling date, twenty-five cents for a member enrolled for thirty-six to
      one hundred and nineteen whole months, and nothing for a member enrolled for fewer months. The twelve
      months before the handling date are the transactions posted after the same day number twelve months
      earlier, up to and including the handling date. Points may be bought only once the account has been
      open for points_purchase_min_account_age_days. The age of the account is counted in whole calendar
      days from the enrolment date, which is day zero; a purchase on the day the minimum is reached is
      allowed. The points bought in the twelve months before the handling date, including the purchase
      being made, may not exceed the purchase allowance; a request beyond it is reduced to the remaining
      allowance or declined, never split across another member's account. A member makes at most one
      purchase per calendar day. Purchased points are not refundable when points_purchase_refundable is
      false. Points are bought only for a membership whose status is active.
    prerequisite:
      - problem: loyalty_ext_stay_elite_bonus
        kind: value_input
        gate: stay_points_12m
        form: state
        policy_source: >-
          The purchase allowance is fixed only after every stay credited at an elite tier whose base points
          stand on the account carries its elite bonus transaction.
        condition: >-
          Every booking_reservations row whose stay_base loyalty_transactions row stands on the membership,
          credited while the membership held an elite tier on a plan with earns_elite_bonus_points true, has
          a loyalty_transactions row of event_type loyalty_points_earn with earning_source stay_elite_bonus
          naming it.
        resolved_by: post_stay_elite_bonus_1ee6f132
        effect: >-
          The elite bonus posted is added to the points earned from stays in the twelve months, which raises
          the purchase allowance base and so the points bought and the price.
      - problem: loyalty_ext_stay_welcome_points
        kind: value_input
        gate: stay_points_12m
        form: state
        policy_source: >-
          The purchase allowance is not fixed until the stay of the latest base points transaction on the
          account carries its welcome points transaction whenever the tier in effect by that stay's
          check-out date gives it a welcome amount above zero.
        condition: >-
          The booking_reservations row named by the latest stay_base loyalty_transactions row of the
          membership, when loyalty_memberships.tier_effective_date is on or before its actual_check_out_date,
          the tier's welcome amount for its brand is above zero and it was not booked through an online
          travel agency, has a loyalty_transactions row of event_type loyalty_points_bonus with earning_source
          welcome_amenity naming it.
        resolved_by: post_stay_welcome_points_0494e852
        effect: >-
          The welcome points posted are added to the points earned from stays in the twelve months, which
          raises the purchase allowance base and so the points bought and the price.
      - problem: loyalty_ext_corrected_stay_reversal
        kind: value_input
        gate: stay_points_12m
        form: state
        policy_source: >-
          The purchase allowance is fixed only once every credited stay whose folio carries an
          eligible-spend adjustment posted after its base points carries a stay credit reversal naming its
          base points transaction.
        condition: >-
          Every stay whose folio_postings carry a folio_adjustment on room, breakfast, food_beverage or spa
          posted after the posted_date of its stay_base transaction has a loyalty_transactions row of
          event_type loyalty_points_reversal with earning_source stay_credit_reversal naming that stay_base
          transaction.
        resolved_by: reverse_corrected_stay_points_b6469913
        effect: >-
          The reversal posted is taken off the points earned from stays in the twelve months and its removed
          spend off the qualifying spend, which lowers the purchase allowance base and so the points bought
          and the price.
    cross_category: []
    compute:
      - stay_points_12m: "SUM('loyalty_transactions','points', within_months=12, date_field='posted_date', event_type='loyalty_points_earn') + SUM('loyalty_transactions','points', within_months=12, date_field='posted_date', event_type='loyalty_points_bonus', earning_source='welcome_amenity') - SUM('loyalty_transactions','points', within_months=12, date_field='posted_date', event_type='loyalty_points_reversal')"
      - account_months: "MONTHS(F('enrolled_date'), NOW)"
      - below_platinum: "F('variant_name') == 'Ashbury Rewards Member' or F('variant_name') == 'Ashbury Rewards Silver Elite' or F('variant_name') == 'Ashbury Rewards Gold Elite'"
      - allowance_base: "stay_points_12m if account_months < K('young_account_months') else ((stay_points_12m + K('matched_extra_points')) if (account_months >= K('young_account_months') and below_platinum) else P('points_purchase_annual_cap'))"
      - qualifying_spend_12m: "SUM('loyalty_transactions','eligible_spend_usd', within_months=12, date_field='posted_date', event_type='loyalty_points_earn', earning_source='stay_base') - SUM('loyalty_transactions','eligible_spend_usd', within_months=12, date_field='posted_date', event_type='loyalty_points_reversal')"
      - spend_supplement: "K('high_spend_extra_points') if qualifying_spend_12m >= K('high_spend_usd') else (K('mid_spend_extra_points') if qualifying_spend_12m >= K('mid_spend_usd') else 0)"
      - purchase_allowance: "MN(P('points_purchase_annual_cap'), allowance_base + spend_supplement)"
      - bought_12m: "SUM('loyalty_transactions','points', within_months=12, date_field='posted_date', event_type='loyalty_points_purchase')"
      - points_to_buy: "(MX(0, purchase_allowance - bought_12m) // P('points_purchase_increment')) * P('points_purchase_increment')"
      - order_price: "K('large_order_price_usd') if points_to_buy >= K('large_order_points') else (K('mid_order_price_usd') if points_to_buy >= K('mid_order_points') else P('points_purchase_price_per_1000_usd'))"
      - redemptions_12m: "COUNT('loyalty_transactions', within_months=12, date_field='posted_date', event_type='loyalty_points_redeem', earning_source='award_redemption')"
      - activity_discount: "K('high_activity_discount_usd') if redemptions_12m >= K('high_activity_redemptions') else (K('mid_activity_discount_usd') if redemptions_12m >= K('mid_activity_redemptions') else 0)"
      - tenure_months: "MONTHS(F('enrolled_date'), NOW)"
      - tenure_discount: "K('tenure_long_discount_usd') if tenure_months >= K('tenure_long_months') else (K('tenure_mid_discount_usd') if tenure_months >= K('tenure_mid_months') else 0)"
      - price_per_1000: "order_price - activity_discount - tenure_discount"
      - result: "RND(points_to_buy / 1000 * price_per_1000, 2)"
    compute_basis:
      stay_points_12m: "The points earned from stays in the twelve months before the handling date are the stay_base and stay_elite_bonus points and the welcome points posted in those months less the stay credit reversals posted in those months."
      account_months: "an account enrolled for fewer than twenty-four whole calendar months by the handling date takes as base the points earned from stays in the twelve months"
      allowance_base: "The base of the purchase allowance depends on the age of the account and on the tier: an account enrolled for fewer than twenty-four whole calendar months by the handling date takes as base the points earned from stays in the twelve months; an account enrolled for twenty-four or more whole months whose member holds Ashbury Rewards Member, Silver Elite or Gold Elite takes as base the points earned from stays in the twelve months plus ten thousand points; any other account takes the points purchase annual cap of the tier."
      qualifying_spend_12m: "The qualifying spend of the twelve months is the eligible spend of the stay_base transactions posted in those months less the eligible spend removed by the stay credit reversals posted in them"
      spend_supplement: "a qualifying spend of ten thousand US dollars or more adds a spend supplement of ten thousand points to the base, five thousand to nine thousand nine hundred ninety-nine dollars and ninety-nine cents adds five thousand points, and a lower spend adds none."
      purchase_allowance: "The purchase allowance is the base plus the spend supplement, never more than the points purchase annual cap of the tier; the cap is applied after the supplement is added."
      bought_12m: "the remaining purchase allowance is the purchase allowance less the points bought in the twelve months before the handling date, never below zero."
      points_to_buy: "A member who asks to buy the most points they are allowed buys, in one purchase, the remaining purchase allowance rounded down to a multiple of the tier's points purchase increment."
      order_price: "The order price is eleven US dollars and fifty cents per thousand points for a purchase of fifty thousand points or more, twelve dollars for a purchase of twenty thousand to forty-nine thousand points, and the tier's points purchase price per 1,000 points for a smaller purchase."
      redemptions_12m: "The twelve months before the handling date are the transactions posted after the same day number twelve months earlier, up to and including the handling date."
      activity_discount: "The award-activity discount is seventy-five cents per thousand points when at least three award_redemption transactions were posted in the twelve months before the handling date, twenty-five cents when one or two were posted, and nothing when none was posted."
      tenure_months: "The tenure discount is seventy-five cents per thousand points for a member enrolled for at least one hundred and twenty whole calendar months by the handling date"
      tenure_discount: "The tenure discount is seventy-five cents per thousand points for a member enrolled for at least one hundred and twenty whole calendar months by the handling date, twenty-five cents for a member enrolled for thirty-six to one hundred and nineteen whole months, and nothing for a member enrolled for fewer months."
      price_per_1000: "The price per thousand points is the order price less the award-activity discount and less the tenure discount."
      result: "The price of the purchase is the points bought divided by one thousand times the price per thousand points, rounded to two decimal places, before any sales tax."
    factors:
      - id: purchase_allowance_base
        effect: method
        decides: allowance_base
        bindings: [stay_points_12m, account_months, below_platinum, allowance_base]
        ladder:
          - when: "the account has been enrolled for fewer than twenty-four whole calendar months"
            method: "the points earned from stays in the twelve months before the handling date"
          - when: "the account has been enrolled for twenty-four or more whole months and the member holds Member, Silver Elite or Gold Elite"
            method: "the points earned from stays in the twelve months plus ten thousand points"
          - when: "otherwise"
            method: "the points purchase annual cap of the tier"
        baseline:
          allowance_base: "P('points_purchase_annual_cap')"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: purchase_spend_supplement
        effect: parameter
        decides: spend_supplement
        bindings: [qualifying_spend_12m, spend_supplement]
        ladder:
          - when: "the qualifying spend of the twelve months is ten thousand US dollars or more"
            value: "K('high_spend_extra_points')"
          - when: "it is five thousand to nine thousand nine hundred ninety-nine dollars and ninety-nine cents"
            value: "K('mid_spend_extra_points')"
          - when: "otherwise"
            value: "0"
        baseline:
          spend_supplement: "0"
        evidence: [history]
        cross_difficulty: null
      - id: purchase_order_price
        effect: parameter
        decides: order_price
        bindings: [bought_12m, points_to_buy, order_price]
        ladder:
          - when: "the purchase is fifty thousand points or more"
            value: "K('large_order_price_usd')"
          - when: "the purchase is twenty thousand to forty-nine thousand points"
            value: "K('mid_order_price_usd')"
          - when: "otherwise"
            value: "P('points_purchase_price_per_1000_usd')"
        baseline:
          order_price: "P('points_purchase_price_per_1000_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: purchase_activity_discount
        effect: parameter
        decides: activity_discount
        bindings: [redemptions_12m, activity_discount]
        ladder:
          - when: "at least three award redemptions were posted in the twelve months before the handling date"
            value: "K('high_activity_discount_usd')"
          - when: "one or two were posted"
            value: "K('mid_activity_discount_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          activity_discount: "0"
        evidence: [history]
        cross_difficulty: null
      - id: purchase_tenure_discount
        effect: parameter
        decides: tenure_discount
        bindings: [tenure_months, tenure_discount]
        ladder:
          - when: "enrolled for at least 120 whole calendar months by the handling date"
            value: "K('tenure_long_discount_usd')"
          - when: "enrolled for 36 to 119 whole calendar months"
            value: "K('tenure_mid_discount_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_discount: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        A member who asks to buy the most points they are allowed buys, in one purchase, the remaining
        purchase allowance rounded down to a multiple of the tier's points purchase increment. The standard
        purchase allowance is the points purchase annual cap of the tier, and the remaining purchase
        allowance is the purchase allowance less the points bought in the twelve months before the handling
        date, never below zero. The standard price per thousand points is the tier's points purchase price
        per 1,000 points. The price of the purchase is the points bought divided by one thousand times the
        price per thousand points, rounded to two decimal places, before any sales tax.
      params: [points_purchase_annual_cap, points_purchase_increment, points_purchase_price_per_1000_usd]
    inputs:
      history:
        - {table: loyalty_transactions, aggregate: sum, field: points, within_months: 12, filters: {event_type: loyalty_points_earn}}
        - {table: loyalty_transactions, aggregate: sum, field: points, within_months: 12, filters: {event_type: loyalty_points_purchase}}
        - {table: loyalty_transactions, aggregate: count, field: transaction_id, within_months: 12, filters: {event_type: loyalty_points_redeem, earning_source: award_redemption}}
      cross_category: []
