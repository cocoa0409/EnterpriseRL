  - id: loyalty_promotion_and_card_points
    subject: [loyalty_points_bonus]
    rule: >-
      Promotion bonuses are posted by Ashbury Rewards to members who registered for the promotion
      before the qualifying stay, carrying the promotion_code; co-brand card points are posted by the
      card issuer with each statement as earning_source cobrand_spend and count as qualifying activity
      when activity_includes_cobrand_spend is true. Guest services posts neither: a member who reports
      a missing promotion bonus or missing card points is outside the rules guest services can apply,
      because neither the promotion registrations nor the card statements are held in the member's
      records. A bonus row carries the promotion_code it was earned under, and a promotion bonus is
      posted at most once per promotion code and stay.
    eligibility:
      - id: once_per_promotion_and_stay
        applies_to: [loyalty_points_bonus]
        kind: dedup
        condition: "A bonus row carries the promotion_code it was earned under, and a promotion bonus is posted at most once per promotion code and stay."
        evidence_fields: [loyalty_transactions.reservation_id, loyalty_transactions.promotion_code, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.reservation_id, loyalty_transactions.promotion_code]
          action_bindings:
            loyalty_transactions.reservation_id: reservation_id
            loyalty_transactions.promotion_code: promotion_code
        dedup_contract:
          table: loyalty_transactions
          mode: separate_record
          object_bindings: {reservation_id: reservation_id, promotion_code: promotion_code}
          duplicate_filters: {event_type: [loyalty_points_bonus]}
          distinct_fields: []

  - id: loyalty_purchase_rules
    subject: [loyalty_points_purchase]
    rule: >-
      A member may buy points for their own account, paying with their own card; buying is the
      member's own decision and payment. Points are bought in multiples of points_purchase_increment
      at points_purchase_price_per_1000_usd for each 1,000 points, before any sales tax. Points may be
      bought only once the account has been open for points_purchase_min_account_age_days. The age of
      the account is counted in whole calendar days from the enrolment date, which is day zero; a
      purchase on the day the minimum is reached is allowed. The points bought in one calendar year,
      counted with loyalty_msr_purchased_ytd and including the purchase being made, may not exceed
      points_purchase_annual_cap; a request beyond the cap is reduced to the remaining allowance or
      declined, never split across another member's account. A member makes at most one purchase per
      calendar day. Purchased points are not refundable when points_purchase_refundable is false.
      Points are bought only for a membership whose status is active.
    eligibility:
      - id: account_age
        applies_to: [loyalty_points_purchase]
        kind: time
        condition: "Points may be bought only once the account has been open for points_purchase_min_account_age_days."
        evidence_fields: [loyalty_memberships.enrolled_date, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account has been open"
          anchor_source: loyalty_memberships.enrolled_date
          relation: not_before
          duration_source: variants.points_purchase_min_account_age_days
          unit: calendar_days
          counting_rule: "The age of the account is counted in whole calendar days from the enrolment date, which is day zero; a purchase on the day the minimum is reached is allowed."
          boundary: inclusive
      - id: annual_cap
        applies_to: [loyalty_points_purchase]
        kind: authorization
        condition: "The points bought in one calendar year, counted with loyalty_msr_purchased_ytd and including the purchase being made, may not exceed points_purchase_annual_cap; a request beyond the cap is reduced to the remaining allowance or declined, never split across another member's account."
        evidence_fields: [loyalty_transactions.loyalty_member_id, loyalty_transactions.points, loyalty_transactions.posted_date, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.loyalty_member_id]
          action_bindings:
            loyalty_transactions.loyalty_member_id: loyalty_member_id
      - id: one_purchase_per_day
        applies_to: [loyalty_points_purchase]
        kind: dedup
        condition: "A member makes at most one purchase per calendar day."
        evidence_fields: [loyalty_transactions.loyalty_member_id, loyalty_transactions.posted_date, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.loyalty_member_id, loyalty_transactions.posted_date]
          action_bindings:
            loyalty_transactions.loyalty_member_id: loyalty_member_id
            loyalty_transactions.posted_date: posted_date
        dedup_contract:
          table: loyalty_transactions
          mode: separate_record
          object_bindings: {loyalty_member_id: loyalty_member_id, posted_date: posted_date}
          duplicate_filters: {event_type: [loyalty_points_purchase]}
          distinct_fields: []
      - id: member_active
        applies_to: [loyalty_points_purchase]
        kind: state
        condition: "Points are bought only for a membership whose status is active."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    measures: [loyalty_msr_purchased_ytd]
    formula:
      purchase_amount_usd: "round(points / 1000 * points_purchase_price_per_1000_usd, 2)"
      within_cap: "loyalty_msr_purchased_ytd + points <= points_purchase_annual_cap"

  - id: loyalty_transfer_rules
    subject: [loyalty_points_transfer_out, loyalty_points_transfer_in]
    rule: >-
      A member may give points from their own account to another Ashbury Rewards member; giving away
      points is the sender's own decision. Points are transferred in multiples of
      points_transfer_increment, without a fee, and a completed transfer is irrevocable when
      points_transfer_irrevocable is true. Both accounts must be active, and the sender must hold at
      least the points transferred. Both accounts must have been open for
      points_transfer_min_account_age_days before a transfer. The age of each account is counted in
      whole calendar days from its enrolment date, which is day zero; a transfer on the day both
      accounts reach the minimum is allowed. The sender's transfers in the calendar year, counted with
      loyalty_msr_transferred_out_ytd and including this transfer, may not exceed
      points_transfer_out_annual_cap of the sender's tier, and the recipient's receipts, counted with
      loyalty_msr_received_ytd and including this transfer, may not exceed
      points_transfer_in_annual_cap of the recipient's tier. A sender makes at most one transfer to
      the same recipient on one calendar day. The recipient's arrival transaction mirrors the
      sender's transfer and names it.
    eligibility:
      - id: both_active
        applies_to: [loyalty_points_transfer_out]
        kind: state
        condition: "Both accounts must be active, and the sender must hold at least the points transferred."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.points_balance, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
      - id: account_age
        applies_to: [loyalty_points_transfer_out]
        kind: time
        condition: "Both accounts must have been open for points_transfer_min_account_age_days before a transfer."
        evidence_fields: [loyalty_memberships.enrolled_date, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "Both accounts must have been open"
          anchor_source: loyalty_memberships.enrolled_date
          relation: not_before
          duration_source: variants.points_transfer_min_account_age_days
          unit: calendar_days
          counting_rule: "The age of each account is counted in whole calendar days from its enrolment date, which is day zero; a transfer on the day both accounts reach the minimum is allowed."
          boundary: inclusive
      - id: annual_caps
        applies_to: [loyalty_points_transfer_out]
        kind: authorization
        condition: "The sender's transfers in the calendar year, counted with loyalty_msr_transferred_out_ytd and including this transfer, may not exceed points_transfer_out_annual_cap of the sender's tier, and the recipient's receipts, counted with loyalty_msr_received_ytd and including this transfer, may not exceed points_transfer_in_annual_cap of the recipient's tier."
        evidence_fields: [loyalty_transactions.loyalty_member_id, loyalty_transactions.points, loyalty_transactions.posted_date, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.loyalty_member_id]
          action_bindings:
            loyalty_transactions.loyalty_member_id: loyalty_member_id
      - id: one_transfer_per_recipient_day
        applies_to: [loyalty_points_transfer_out]
        kind: dedup
        condition: "A sender makes at most one transfer to the same recipient on one calendar day."
        evidence_fields: [loyalty_transactions.loyalty_member_id, loyalty_transactions.counterparty_member_id, loyalty_transactions.posted_date, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.loyalty_member_id, loyalty_transactions.counterparty_member_id]
          action_bindings:
            loyalty_transactions.loyalty_member_id: loyalty_member_id
            loyalty_transactions.counterparty_member_id: counterparty_member_id
        dedup_contract:
          table: loyalty_transactions
          mode: separate_record
          object_bindings: {loyalty_member_id: loyalty_member_id, counterparty_member_id: counterparty_member_id}
          duplicate_filters: {event_type: [loyalty_points_transfer_out]}
          distinct_fields: [posted_date]
    measures: [loyalty_msr_transferred_out_ytd, loyalty_msr_received_ytd]
    formula:
      sender_within_cap: "loyalty_msr_transferred_out_ytd + points <= points_transfer_out_annual_cap"
      recipient_within_cap: "loyalty_msr_received_ytd + points <= points_transfer_in_annual_cap"

  - id: loyalty_award_redemption
    subject: [loyalty_points_redeem, loyalty_points_redeposit]
    rule: >-
      A Reward Night Rate night paid with points costs the standard-room price of award_chart for the
      hotel's award_category and the award_season recorded on the reservation. Free Night Awards are
      applied to the earliest nights of a reservation and points pay the remaining nights, which are
      always consecutive. When the member's tier has fifth_night_free_on_points true, every fifth
      points-paid night of the reservation is free, so a reservation with P points nights is charged
      for P less the whole number of times 5 goes into P. Points are deducted at booking as one
      award_redemption transaction for the reservation. Points are redeemed only from a membership
      whose status is active and whose points_balance covers the redemption; a suspended account can
      neither redeem nor receive redeposits until reinstated. A Free Night Award top-off is deducted
      as a separate certificate_top_off transaction naming the award, for the amount the Free Night
      Awards charter sets. Points come back as a redeposit naming the redemption they return: in full
      on a cancellation recorded before_deadline, on a relocation, and when a change removes points
      nights; on a cancellation recorded after_deadline or a no-show under the first_night_points
      basis, everything except the price of the first night is returned when the first night was paid
      with points, and everything is returned when the first night was paid with a Free Night Award.
      When a change adds points nights or moves to a dearer season or category, the difference is
      redeemed as a further award_redemption on the day of the change. Top-off points come back as a
      top_off_redeposit when the award they topped off is released. The points returned against a
      redemption never exceed the points it deducted.
    eligibility:
      - id: member_active
        applies_to: [loyalty_points_redeem]
        kind: state
        condition: "Points are redeemed only from a membership whose status is active and whose points_balance covers the redemption; a suspended account can neither redeem nor receive redeposits until reinstated."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.points_balance, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
      - id: redeposit_bounded
        applies_to: [loyalty_points_redeposit]
        kind: authorization
        condition: "The points returned against a redemption never exceed the points it deducted."
        evidence_fields: [loyalty_transactions.transaction_id, loyalty_transactions.points, loyalty_transactions.related_transaction_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.transaction_id]
          action_bindings:
            loyalty_transactions.transaction_id: related_transaction_id
    params:
      award_chart:
        1: {off_peak: 5000, standard: 7500, peak: 10000}
        2: {off_peak: 10000, standard: 12500, peak: 15000}
        3: {off_peak: 15000, standard: 17500, peak: 20000}
        4: {off_peak: 20000, standard: 25000, peak: 30000}
        5: {off_peak: 30000, standard: 35000, peak: 40000}
        6: {off_peak: 40000, standard: 45000, peak: 50000}
        7: {off_peak: 50000, standard: 60000, peak: 70000}
        8: {off_peak: 70000, standard: 85000, peak: 100000}
      per_tier:
        "Ashbury Rewards Member": {fifth_night_free: "=fifth_night_free_on_points"}
        "Ashbury Rewards Silver Elite": {fifth_night_free: "=fifth_night_free_on_points"}
        "Ashbury Rewards Gold Elite": {fifth_night_free: "=fifth_night_free_on_points"}
        "Ashbury Rewards Platinum Elite": {fifth_night_free: "=fifth_night_free_on_points"}
        "Ashbury Rewards Titanium Elite": {fifth_night_free: "=fifth_night_free_on_points"}
        "Ashbury Rewards Ambassador Elite": {fifth_night_free: "=fifth_night_free_on_points"}

  - id: loyalty_points_expiry
    subject: [loyalty_points_expire]
    rule: >-
      Points stay valid while the account shows qualifying activity: earning, a bonus, a purchase, a
      transfer given or received, or a redemption, read with loyalty_msr_last_activity_date; when
      expiry_reset_by_any_activity is true any one of them restarts the period for the whole balance.
      The balance expires only when points_expire_months_inactive calendar months have passed since the
      last qualifying activity. The months are counted from the posted date of the last qualifying
      activity; the balance expires on the same day number that many months later, or on the last day
      of that month when it has no such day, and points are still valid on the day before. Members whose
      tier has points_expiry_exempt true never lose points to inactivity. The whole balance is removed
      in one inactivity_expiry transaction; expired points are not reinstated. When the account is
      closed the whole balance is removed as closure_forfeit when closure_forfeits_points is true.
    eligibility:
      - id: inactivity_period
        applies_to: [loyalty_points_expire]
        kind: time
        condition: "The balance expires only when points_expire_months_inactive calendar months have passed since the last qualifying activity."
        evidence_fields: [loyalty_transactions.posted_date, loyalty_transactions.event_type, loyalty_transactions.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.loyalty_member_id]
          action_bindings:
            loyalty_transactions.loyalty_member_id: loyalty_member_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the last qualifying activity"
          anchor_source: loyalty_transactions.posted_date
          relation: not_before
          duration_source: variants.points_expire_months_inactive
          unit: calendar_months
          counting_rule: "The months are counted from the posted date of the last qualifying activity; the balance expires on the same day number that many months later, or on the last day of that month when it has no such day, and points are still valid on the day before."
          boundary: inclusive
    measures: [loyalty_msr_last_activity_date]

  - id: loyalty_stay_credit_reversal
    subject: [loyalty_points_reversal]
    rule: >-
      When a folio correction removes eligible spend from a stay that was already credited, the
      points earned on the removed spend are taken back. The points reversed are the base points and
      elite bonus posted for the stay less the base points and elite bonus that loyalty_stay_earning
      gives on the corrected eligible spend, with the same tier and brand rate, and the reversal names
      the stay_base earning transaction it reduces and records the eligible spend removed. A reversal
      is posted only when the stay has an earning transaction. Corrections that do not touch eligible
      spend, such as resort fee, tax, parking or late check-out adjustments, reverse nothing. A
      reversal is posted even when it leaves the points balance below zero; a negative balance blocks
      redemptions and transfers until it is restored by later earning.
    eligibility:
      - id: earning_exists
        applies_to: [loyalty_points_reversal]
        kind: authorization
        condition: "A reversal is posted only when the stay has an earning transaction."
        evidence_fields: [loyalty_transactions.reservation_id, loyalty_transactions.event_type, loyalty_transactions.transaction_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.transaction_id]
          action_bindings:
            loyalty_transactions.transaction_id: related_transaction_id

  - id: loyalty_account_status
    subject: [loyalty_suspend, loyalty_reinstate, loyalty_close, loyalty_close_after_review]
    rule: >-
      Suspension, reinstatement and closure after review are decided by Ashbury Rewards account
      security; guest services neither suspends nor reinstates an account and does not discuss the
      review. While an account is suspended, points can be neither redeemed, transferred nor bought
      when suspension_freezes_points is true, and earning continues. A member may close their own
      account only by signing a closure request; closing is the member's own decision about their
      own points and awards. A closure takes effect only on an account whose status is active; a
      suspended account cannot be closed at the member's request until the review ends. On closure the
      points balance is forfeited when closure_forfeits_points is true and every unused Free Night
      Award is forfeited when closure_forfeits_free_night_awards is true; future award reservations
      already paid remain valid. A closed account is never reopened.
    eligibility:
      - id: closable_state
        applies_to: [loyalty_close]
        kind: authorization
        condition: "A closure takes effect only on an account whose status is active; a suspended account cannot be closed at the member's request until the review ends."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id

extended_policies:
  - id: loyalty_ext_award_stay_night_credits
    base_policy_refs: [loyalty_night_credits, loyalty_missing_stay_credit]
    overwrite:
      - base_policy: loyalty_night_credits
        superseded_clause: >-
          A completed stay credited to the membership posts elite_night_credit_per_stay_night night credit
          for each night between the actual check-in and actual check-out dates when the reservation's plan
          has counts_toward_elite_nights true and its booking channel earns under the plan's channel rules;
          Reward Night Rate stays count.
        replaced_by: >-
          The night credits posted for an award stay are the credits for the nights stayed plus the length
          credits, the card credits and the tenure credits of the award stay, all of them whole credits.
      - base_policy: loyalty_night_credits
        superseded_clause: >-
          When the nights credited for a stay exceed the nights stayed, the excess is reversed against that
          stay's night-credit transaction.
        replaced_by: >-
          The top-tier, length, card and tenure credits of an award stay are credits the award stay is owed
          and are never an excess over its nights stayed; only night credits posted for an award stay beyond
          the total this rule gives it are reversed against its night-credit transaction.
    trigger: state_due
    subject: [loyalty_night_credit]
    computes: nights
    target_tool: post_award_stay_night_credits_8b07b6a3
    params:
      low_tier_nights_per_credit: 2
      top_tier_stay_credit: 1
      long_award_stay_nights: 7
      mid_award_stay_nights: 4
      long_award_stay_credits: 2
      mid_award_stay_credits: 1
      card_min_transactions: 6
      premier_card_award_stay_credits: 2
      standard_card_award_stay_credits: 1
      tenure_long_months: 240
      tenure_mid_months: 120
      tenure_long_award_stay_credits: 2
      tenure_mid_award_stay_credits: 1
    rule: >-
      A completed Reward Night Rate stay credited to the membership posts its elite night credits as
      one stay_nights transaction naming the stay. The award stay concerned is the member's checked-out
      Reward Night Rate reservation attached to the membership. The nights stayed on the award stay are
      the whole calendar days from its actual check-in date to its actual check-out date. The award stay
      receives the tier's night credit per night stayed for each night stayed. The credits for the nights
      of an award stay depend on the tier the membership holds: a member at Ashbury Rewards Member or
      Ashbury Rewards Silver Elite receives one night credit for every two nights stayed, an odd last
      night earning nothing; a member at Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador
      Elite receives the tier's night credit for each night stayed plus one further credit for the award
      stay; a member at any other tier receives the tier's night credit for each night stayed. An award
      stay of seven or more nights stayed carries two length credits, an award stay of four to six
      nights stayed carries one length credit, and a shorter award stay carries none. A member whose
      linked co-brand card is the Ashbury Rewards Premier card and whose account shows at least six
      co-brand card points transactions posted in the twelve months before the handling date receives
      two card credits on the award stay; a member whose linked card is the Ashbury Rewards card and
      whose account shows at least six such transactions receives one card credit; any other member
      receives no card credit. A member enrolled for at least two hundred and forty whole calendar months
      by the handling date receives two tenure credits on the award stay, a member enrolled for one
      hundred and twenty to two hundred and thirty-nine whole months receives one tenure credit, and a
      member enrolled for less than one hundred and twenty whole months receives none. The twelve months
      before the handling date are the transactions posted after the same day number twelve months
      earlier, up to and including the handling date. The night credits posted for an award stay are the
      credits for the nights stayed plus the length credits, the card credits and the tenure credits of
      the award stay, all of them whole credits. The top-tier, length, card and tenure credits of an award
      stay are credits the award stay is owed and are never an excess over its nights stayed; only night
      credits posted for an award stay beyond the total this rule gives it are reversed against its
      night-credit transaction. Night credits are posted only to a membership whose status is active, and
      an award stay posts night credits at most once.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [reservation_id, status, variant_name, loyalty_member_id, actual_check_in_date, actual_check_out_date]
        note: The award stay and its actual check-in and check-out dates come from the member's Reward Night Rate reservation, which sets the nights stayed behind the tier crediting and the length credits.
    compute:
      - award_stay: "CFIELD('booking','reservation_id', status='checked_out', variant_name='Reward Night Rate', loyalty_member_id=HID)"
      - nights_stayed: "DAYS(CFIELD('booking','actual_check_in_date', reservation_id=award_stay), CFIELD('booking','actual_check_out_date', reservation_id=award_stay))"
      - low_tier: "F('variant_name') == 'Ashbury Rewards Member' or F('variant_name') == 'Ashbury Rewards Silver Elite'"
      - top_tier: "F('variant_name') == 'Ashbury Rewards Titanium Elite' or F('variant_name') == 'Ashbury Rewards Ambassador Elite'"
      - stay_night_credits: "(nights_stayed // K('low_tier_nights_per_credit')) if low_tier else ((nights_stayed * P('elite_night_credit_per_stay_night') + K('top_tier_stay_credit')) if top_tier else (nights_stayed * P('elite_night_credit_per_stay_night')))"
      - length_nights: "DAYS(CFIELD('booking','actual_check_in_date', reservation_id=award_stay), CFIELD('booking','actual_check_out_date', reservation_id=award_stay))"
      - length_credits: "K('long_award_stay_credits') if length_nights >= K('long_award_stay_nights') else (K('mid_award_stay_credits') if length_nights >= K('mid_award_stay_nights') else 0)"
      - card_transactions_12m: "COUNT('loyalty_transactions', within_months=12, date_field='posted_date', event_type='loyalty_points_bonus', earning_source='cobrand_spend')"
      - card_credits: "K('premier_card_award_stay_credits') if (F('cobrand_card') == 'ashbury_rewards_premier_card' and card_transactions_12m >= K('card_min_transactions')) else (K('standard_card_award_stay_credits') if (F('cobrand_card') == 'ashbury_rewards_card' and card_transactions_12m >= K('card_min_transactions')) else 0)"
      - enrolled_months: "MONTHS(F('enrolled_date'), NOW)"
      - tenure_credits: "K('tenure_long_award_stay_credits') if enrolled_months >= K('tenure_long_months') else (K('tenure_mid_award_stay_credits') if enrolled_months >= K('tenure_mid_months') else 0)"
      - result: "stay_night_credits + length_credits + card_credits + tenure_credits"
    compute_basis:
      award_stay: "The award stay concerned is the member's checked-out Reward Night Rate reservation attached to the membership."
      nights_stayed: "The nights stayed on the award stay are the whole calendar days from its actual check-in date to its actual check-out date."
      stay_night_credits: "The credits for the nights of an award stay depend on the tier the membership holds: a member at Ashbury Rewards Member or Ashbury Rewards Silver Elite receives one night credit for every two nights stayed, an odd last night earning nothing; a member at Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite receives the tier's night credit for each night stayed plus one further credit for the award stay; a member at any other tier receives the tier's night credit for each night stayed."
      length_nights: "The nights stayed on the award stay are the whole calendar days from its actual check-in date to its actual check-out date."
      length_credits: "An award stay of seven or more nights stayed carries two length credits, an award stay of four to six nights stayed carries one length credit, and a shorter award stay carries none."
      card_transactions_12m: "The twelve months before the handling date are the transactions posted after the same day number twelve months earlier, up to and including the handling date."
      card_credits: "A member whose linked co-brand card is the Ashbury Rewards Premier card and whose account shows at least six co-brand card points transactions posted in the twelve months before the handling date receives two card credits on the award stay; a member whose linked card is the Ashbury Rewards card and whose account shows at least six such transactions receives one card credit; any other member receives no card credit."
      enrolled_months: "A member enrolled for at least two hundred and forty whole calendar months by the handling date receives two tenure credits on the award stay"
      tenure_credits: "A member enrolled for at least two hundred and forty whole calendar months by the handling date receives two tenure credits on the award stay, a member enrolled for one hundred and twenty to two hundred and thirty-nine whole months receives one tenure credit, and a member enrolled for less than one hundred and twenty whole months receives none."
      result: "The night credits posted for an award stay are the credits for the nights stayed plus the length credits, the card credits and the tenure credits of the award stay, all of them whole credits."
    factors:
      - id: award_stay_tier_crediting
        effect: method
        decides: stay_night_credits
        bindings: [nights_stayed, low_tier, top_tier, stay_night_credits]
        ladder:
          - when: "the membership holds Ashbury Rewards Member or Ashbury Rewards Silver Elite"
            method: "one night credit for every two nights stayed, an odd last night earning nothing"
          - when: "the membership holds Ashbury Rewards Titanium Elite or Ashbury Rewards Ambassador Elite"
            method: "the tier's night credit for each night stayed plus one further credit for the award stay"
          - when: "otherwise"
            method: "the tier's night credit for each night stayed"
        baseline:
          stay_night_credits: "nights_stayed * P('elite_night_credit_per_stay_night')"
        evidence: [cross_category, date, tier_param]
        cross_difficulty: null
      - id: award_stay_length_credits
        effect: parameter
        decides: length_credits
        bindings: [length_nights, length_credits]
        ladder:
          - when: "the award stay has seven or more nights stayed"
            value: "K('long_award_stay_credits')"
          - when: "the award stay has four to six nights stayed"
            value: "K('mid_award_stay_credits')"
          - when: "otherwise"
            value: "0"
        baseline:
          length_credits: "0"
        evidence: [cross_category, date]
        cross_difficulty: booking
      - id: award_stay_card_credits
        effect: parameter
        decides: card_credits
        bindings: [card_transactions_12m, card_credits]
        ladder:
          - when: "the linked card is the Ashbury Rewards Premier card and at least six co-brand card points transactions were posted in the twelve months before the handling date"
            value: "K('premier_card_award_stay_credits')"
          - when: "the linked card is the Ashbury Rewards card and at least six co-brand card points transactions were posted in the twelve months before the handling date"
            value: "K('standard_card_award_stay_credits')"
          - when: "otherwise"
            value: "0"
        baseline:
          card_credits: "0"
        evidence: [history]
        cross_difficulty: null
      - id: award_stay_tenure_credits
        effect: parameter
        decides: tenure_credits
        bindings: [enrolled_months, tenure_credits]
        ladder:
          - when: "enrolled for at least 240 whole calendar months by the handling date"
            value: "K('tenure_long_award_stay_credits')"
          - when: "enrolled for 120 to 239 whole calendar months"
            value: "K('tenure_mid_award_stay_credits')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_credits: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The award stay concerned is the member's checked-out Reward Night Rate reservation attached to the
        membership. The nights stayed on the award stay are the whole calendar days from its actual
        check-in date to its actual check-out date. The award stay receives the tier's night credit per
        night stayed for each night stayed.
      params: [elite_night_credit_per_stay_night]
    inputs:
      history:
        - {table: loyalty_transactions, aggregate: count, field: transaction_id, within_months: 12, filters: {event_type: loyalty_points_bonus, earning_source: cobrand_spend}}
      cross_category: [booking]
  - id: loyalty_ext_relocation_compensation
    base_policy_refs: [loyalty_relocation_compensation, loyalty_welcome_amenity, loyalty_promotion_and_card_points]
    overwrite:
      - base_policy: loyalty_relocation_compensation
        superseded_clause: >-
          When a hotel relocates a reservation credited to the membership, the member receives the
          relocation_compensation_points of their tier, posted with earning_source
          relocation_compensation and the relocated reservation's reference.
        replaced_by: >-
          The relocation compensation is the tier's relocation compensation points times the compensation
          units, raised by the direct-booking uplift and rounded down to a whole point, plus the
          relocation brand supplement, the relocation advance-booking supplement, the relocation tenure
          supplement and the relocation booking-value supplement.
      - base_policy: loyalty_relocation_compensation
        superseded_clause: >-
          Compensation is posted once per relocated reservation, whatever the number of nights, and is the
          member's only compensation from Ashbury Rewards for the relocation; guest services adds no other
          goodwill points.
        replaced_by: >-
          Relocation compensation is posted as one transaction per relocated reservation and is the
          member's only compensation from Ashbury Rewards for the relocation; guest services adds no other
          goodwill points.
    trigger: state_due
    subject: [loyalty_points_bonus]
    computes: points
    target_tool: post_relocation_compensation_5afb8ff3
    params:
      per_night_min_nights: 2
      double_unit_min_nights: 3
      double_units: 2
      website_app_uplift_pct: 20
      call_centre_hotel_uplift_pct: 10
      luxury_brand_supplement: 5000
      full_service_brand_supplement: 2500
      long_lead_days: 60
      mid_lead_days: 14
      long_lead_supplement: 5000
      mid_lead_supplement: 2500
      tenure_long_months: 240
      tenure_mid_months: 120
      tenure_long_supplement: 7500
      tenure_mid_supplement: 5000
      high_value_usd: 1000.00
      mid_value_usd: 500.00
      high_value_supplement: 7500
      mid_value_supplement: 2500
    rule: >-
      When a hotel relocates a reservation credited to the membership, the member receives relocation
      compensation posted with earning_source relocation_compensation and the relocated reservation's
      reference. The relocated reservation concerned is the member's reservation attached to the
      membership whose status is relocated. The standard relocation compensation is the tier's relocation
      compensation points, once for the relocated reservation. The number of compensation units depends on
      the tier and on the nights booked on the relocated reservation: a member at Ashbury Rewards Platinum
      Elite, Titanium Elite or Ambassador Elite whose relocated reservation was booked for two or more
      nights receives one unit for each night booked; a member at Ashbury Rewards Silver Elite or Gold
      Elite whose relocated reservation was booked for three or more nights receives two units; any other
      member receives one unit. The units are raised by a direct-booking uplift of twenty percent when the
      relocated reservation was booked on the brand website or the mobile app, of ten percent when it was
      booked through the call centre or directly with the hotel, and of nothing when it was booked through
      any other channel. A relocated reservation at an Ashbury Reserve or Ashbury Resort & Spa hotel
      carries a relocation brand supplement of five thousand points, one at an Ashbury Grand or Ashbury
      Hotel carries two thousand five hundred points, and one at an Ashbury Express or Ashbury Inn &
      Suites hotel carries none. A relocated reservation booked sixty or more calendar days before its
      arrival date carries a relocation advance-booking supplement of five thousand points, one booked
      fourteen to fifty-nine days before carries two thousand five hundred points, and one booked fewer
      than fourteen days before carries none; the days are counted from the booked date to the arrival
      date. A member enrolled for at least two hundred and forty whole calendar months by the handling date
      carries a relocation tenure supplement of seven thousand five hundred points, a member enrolled for
      one hundred and twenty to two hundred and thirty-nine whole months carries five thousand points, and
      a member enrolled for fewer months carries none. The room value of the relocated reservation is its
      nightly rate times its nights booked; a room value of one thousand US dollars or more carries a
      relocation booking-value supplement of seven thousand five hundred points, a room value from five
      hundred dollars up to but not including one thousand dollars carries two thousand five hundred
      points, and a lower room value carries none. The relocation compensation is the tier's relocation
      compensation points times the compensation units, raised by the direct-booking uplift and rounded
      down to a whole point, plus the relocation brand supplement, the relocation advance-booking
      supplement, the relocation tenure supplement and the relocation booking-value supplement.
      Compensation is posted only for a reservation whose status is relocated. When
      relocation_compensation_requires_guarantee is true the reservation must have been guaranteed, which
      every reservation booked under an Ashbury rate plan is, and the rate plan's
      relocation_compensation_eligible must be true. Relocation compensation is posted as one transaction
      per relocated reservation and is the member's only compensation from Ashbury Rewards for the
      relocation; guest services adds no other goodwill points.
    prerequisite: []
    cross_category:
      - category: booking
        as: branch
        reads: [reservation_id, status, loyalty_member_id, nights, property_brand, booking_channel, booked_date, arrival_date, nightly_rate]
        note: The relocated reservation's nights, brand, booking channel, booked and arrival dates and nightly rate decide the compensation units, the uplift and the brand, advance-booking and booking-value supplements.
    compute:
      - relocated_reservation: "CFIELD('booking','reservation_id', status='relocated', loyalty_member_id=HID)"
      - booked_nights: "CFIELD('booking','nights', reservation_id=relocated_reservation)"
      - upper_tier: "F('variant_name') == 'Ashbury Rewards Platinum Elite' or F('variant_name') == 'Ashbury Rewards Titanium Elite' or F('variant_name') == 'Ashbury Rewards Ambassador Elite'"
      - middle_tier: "F('variant_name') == 'Ashbury Rewards Silver Elite' or F('variant_name') == 'Ashbury Rewards Gold Elite'"
      - compensation_units: "booked_nights if (upper_tier and booked_nights >= K('per_night_min_nights')) else (K('double_units') if (middle_tier and booked_nights >= K('double_unit_min_nights')) else 1)"
      - booked_channel: "CFIELD('booking','booking_channel', reservation_id=relocated_reservation)"
      - uplift_pct: "K('website_app_uplift_pct') if (booked_channel == 'brand_website' or booked_channel == 'mobile_app') else (K('call_centre_hotel_uplift_pct') if (booked_channel == 'call_center' or booked_channel == 'property_direct') else 0)"
      - relocated_brand: "CFIELD('booking','property_brand', reservation_id=relocated_reservation)"
      - brand_supplement: "K('luxury_brand_supplement') if (relocated_brand == 'Ashbury Reserve' or relocated_brand == 'Ashbury Resort & Spa') else (K('full_service_brand_supplement') if (relocated_brand == 'Ashbury Grand' or relocated_brand == 'Ashbury Hotel') else 0)"
      - lead_days: "DAYS(CFIELD('booking','booked_date', reservation_id=relocated_reservation), CFIELD('booking','arrival_date', reservation_id=relocated_reservation))"
      - lead_supplement: "K('long_lead_supplement') if lead_days >= K('long_lead_days') else (K('mid_lead_supplement') if lead_days >= K('mid_lead_days') else 0)"
      - enrolled_months: "MONTHS(F('enrolled_date'), NOW)"
      - tenure_supplement: "K('tenure_long_supplement') if enrolled_months >= K('tenure_long_months') else (K('tenure_mid_supplement') if enrolled_months >= K('tenure_mid_months') else 0)"
      - room_value: "CFIELD('booking','nightly_rate', reservation_id=relocated_reservation) * booked_nights"
      - value_supplement: "K('high_value_supplement') if room_value >= K('high_value_usd') else (K('mid_value_supplement') if room_value >= K('mid_value_usd') else 0)"
      - result: "int(P('relocation_compensation_points') * compensation_units * (100 + uplift_pct) / 100) + brand_supplement + lead_supplement + tenure_supplement + value_supplement"
    compute_basis:
      relocated_reservation: "The relocated reservation concerned is the member's reservation attached to the membership whose status is relocated."
      booked_nights: "The number of compensation units depends on the tier and on the nights booked on the relocated reservation"
      compensation_units: "a member at Ashbury Rewards Platinum Elite, Titanium Elite or Ambassador Elite whose relocated reservation was booked for two or more nights receives one unit for each night booked; a member at Ashbury Rewards Silver Elite or Gold Elite whose relocated reservation was booked for three or more nights receives two units; any other member receives one unit."
      booked_channel: "The units are raised by a direct-booking uplift of twenty percent when the relocated reservation was booked on the brand website or the mobile app"
      uplift_pct: "The units are raised by a direct-booking uplift of twenty percent when the relocated reservation was booked on the brand website or the mobile app, of ten percent when it was booked through the call centre or directly with the hotel, and of nothing when it was booked through any other channel."
      relocated_brand: "A relocated reservation at an Ashbury Reserve or Ashbury Resort & Spa hotel carries a relocation brand supplement of five thousand points"
      brand_supplement: "A relocated reservation at an Ashbury Reserve or Ashbury Resort & Spa hotel carries a relocation brand supplement of five thousand points, one at an Ashbury Grand or Ashbury Hotel carries two thousand five hundred points, and one at an Ashbury Express or Ashbury Inn & Suites hotel carries none."
      lead_days: "the days are counted from the booked date to the arrival date."
      lead_supplement: "A relocated reservation booked sixty or more calendar days before its arrival date carries a relocation advance-booking supplement of five thousand points, one booked fourteen to fifty-nine days before carries two thousand five hundred points, and one booked fewer than fourteen days before carries none"
      enrolled_months: "A member enrolled for at least two hundred and forty whole calendar months by the handling date carries a relocation tenure supplement of seven thousand five hundred points"
      tenure_supplement: "A member enrolled for at least two hundred and forty whole calendar months by the handling date carries a relocation tenure supplement of seven thousand five hundred points, a member enrolled for one hundred and twenty to two hundred and thirty-nine whole months carries five thousand points, and a member enrolled for fewer months carries none."
      room_value: "The room value of the relocated reservation is its nightly rate times its nights booked"
      value_supplement: "a room value of one thousand US dollars or more carries a relocation booking-value supplement of seven thousand five hundred points, a room value from five hundred dollars up to but not including one thousand dollars carries two thousand five hundred points, and a lower room value carries none."
      result: "The relocation compensation is the tier's relocation compensation points times the compensation units, raised by the direct-booking uplift and rounded down to a whole point, plus the relocation brand supplement, the relocation advance-booking supplement, the relocation tenure supplement and the relocation booking-value supplement."
    factors:
      - id: relocation_compensation_units
        effect: method
        decides: compensation_units
        bindings: [booked_nights, upper_tier, middle_tier, compensation_units]
        ladder:
          - when: "the member holds Platinum, Titanium or Ambassador Elite and the relocated reservation was booked for two or more nights"
            method: "one compensation unit for each night booked"
