events:
  - type: loyalty_enroll
    target: loyalty_memberships
    mutation: create
    meaning: "A guest enrols in Ashbury Rewards and receives a member number at the base tier."
    grain: "One row per transaction."
    fields:
      loyalty_member_id: "reference number of the new membership"
      customer_id: "guest enrolling"
      member_number: "member number issued"
      variant_name: "Ashbury Rewards Member at enrolment"
      enrolled_date: "enrolment date"
      tier_effective_date: "enrolment date"
      cobrand_card: "none unless the issuing bank has already linked a card"
      points_balance: "0 at enrolment"
      elite_night_credits: "0 at enrolment"
    triggers: []

  - type: loyalty_tier_change
    target: loyalty_memberships
    mutation: update
    meaning: "The member's elite tier changes: an upgrade when a threshold is reached, or the annual reassessment."
    grain: "One row per transaction."
    fields:
      loyalty_member_id: "membership changed"
      variant_name: "new tier"
      tier_effective_date: "date the new tier takes effect"
      status_valid_through: "last day the new tier is guaranteed"
    triggers: []

  - type: loyalty_cobrand_link
    target: loyalty_memberships
    mutation: update
    meaning: "The co-brand card issuer reports that an Ashbury Rewards credit card was opened, upgraded or closed on the member's account."
    grain: "One row per transaction."
    fields:
      loyalty_member_id: "membership concerned"
      cobrand_card: "card now linked, or none"
    triggers: []

  - type: loyalty_points_earn
    target: loyalty_transactions
    meaning: "Base points or the elite bonus earned on a completed stay are credited."
    grain: "One row per earning component per stay."
    distinguish_by: [reservation_id, earning_source]
    fields:
      loyalty_member_id: "membership credited"
      customer_id: "member"
      points: "points credited"
      reservation_id: "stay credited"
      posted_date: "date credited"
      earning_source: "stay_base or stay_elite_bonus"
      eligible_spend_usd: "eligible spend the points were computed on"
    account: points
    direction: in
    triggers: []

  - type: loyalty_points_bonus
    target: loyalty_transactions
    meaning: "Points that do not come from stay spend are credited: welcome points, promotion bonuses, relocation compensation and co-brand card points."
    grain: "One row per bonus per stay, promotion or card statement."
    distinguish_by: [reservation_id, earning_source, promotion_code, posted_date]
    fields:
      loyalty_member_id: "membership credited"
      customer_id: "member"
      points: "points credited"
      reservation_id: "stay concerned; empty for co-brand card points"
      posted_date: "date credited"
      earning_source: "welcome_amenity, promotion, relocation_compensation or cobrand_spend"
      promotion_code: "registered promotion, for promotion bonuses"
    account: points
    direction: in
    triggers: []

  - type: loyalty_points_purchase
    target: loyalty_transactions
    meaning: "The member buys points with a card payment."
    grain: "One row per purchase; a member makes at most one purchase per calendar day."
    distinguish_by: [posted_date]
    fields:
      loyalty_member_id: "membership credited"
      customer_id: "member paying"
      points: "points bought"
      posted_date: "date of purchase"
      earning_source: "points_purchase"
      purchase_amount_usd: "price paid before tax"
    account: points
    direction: in
    triggers: []

  - type: loyalty_points_transfer_out
    target: loyalty_transactions
    meaning: "The member gives points from their account to another member."
    grain: "One row per transfer to one recipient on one day."
    distinguish_by: [counterparty_member_id, posted_date]
    fields:
      loyalty_member_id: "membership giving the points"
      customer_id: "member giving the points"
      points: "points transferred"
      posted_date: "date of transfer"
      earning_source: "points_transfer"
      counterparty_member_id: "membership receiving the points"
    account: points
    direction: out
    triggers:
      - event: loyalty:loyalty_points_transfer_in
        map: {loyalty_member_id: counterparty_member_id, counterparty_member_id: loyalty_member_id, points: points, posted_date: posted_date, earning_source: points_transfer, related_transaction_id: transaction_id}

  - type: loyalty_points_transfer_in
    target: loyalty_transactions
    meaning: "Points transferred by another member arrive in the recipient's account."
    grain: "One row per transfer received."
    distinguish_by: [related_transaction_id]
    fields:
      loyalty_member_id: "membership receiving the points"
      customer_id: "member receiving the points"
      points: "points received"
      posted_date: "date of transfer"
      earning_source: "points_transfer"
      counterparty_member_id: "membership that gave the points"
      related_transaction_id: "the sender's transfer transaction"
    account: points
    direction: in
    triggers: []

  - type: loyalty_points_redeem
    target: loyalty_transactions
    meaning: "Points are deducted for an award reservation or to top off a Free Night Award."
    grain: "One row per redemption on one reservation, or per top-off of one award."
    distinguish_by: [reservation_id, earning_source, certificate_id, posted_date]
    fields:
      loyalty_member_id: "membership debited"
      customer_id: "member"
      points: "points deducted"
      reservation_id: "award reservation"
      certificate_id: "award topped off, for certificate_top_off"
      posted_date: "date deducted"
      earning_source: "award_redemption or certificate_top_off"
    account: points
    direction: out
    triggers: []

  - type: loyalty_points_redeposit
    target: loyalty_transactions
    meaning: "Points deducted for an award reservation or a top-off are returned after a cancellation, relocation or re-pricing."
    grain: "One row per return against one original redemption."
    distinguish_by: [related_transaction_id, earning_source, posted_date]
    fields:
      loyalty_member_id: "membership credited"
      customer_id: "member"
      points: "points returned"
      reservation_id: "award reservation"
      certificate_id: "award whose top-off is returned, for top_off_redeposit"
      posted_date: "date returned"
      earning_source: "award_redeposit or top_off_redeposit"
      related_transaction_id: "the redemption the points are returned from"
    account: points
    direction: in
    triggers: []

  - type: loyalty_points_expire
    target: loyalty_transactions
    meaning: "The whole points balance is removed because of inactivity or because the account is closed."
    grain: "One row per expiry or closure."
    distinguish_by: [earning_source, posted_date]
    fields:
      loyalty_member_id: "membership debited"
      customer_id: "member"
      points: "balance removed"
      posted_date: "date removed"
      earning_source: "inactivity_expiry or closure_forfeit"
    account: points
    direction: out
    triggers: []

  - type: loyalty_points_reversal
    target: loyalty_transactions
    meaning: "Points credited on a stay are taken back because the eligible spend they were computed on was corrected."
    grain: "One row per reversal of one earning transaction on one day."
    distinguish_by: [related_transaction_id, posted_date]
    fields:
      loyalty_member_id: "membership debited"
      customer_id: "member"
      points: "points taken back"
      reservation_id: "stay concerned"
      posted_date: "date reversed"
      earning_source: "stay_credit_reversal"
      eligible_spend_usd: "eligible spend removed by the folio correction"
      related_transaction_id: "the earning transaction reduced"
    account: points
    direction: out
    triggers: []

  - type: loyalty_night_credit
    target: loyalty_transactions
    meaning: "Elite night credits are posted for a completed stay or by the annual co-brand card credit."
    grain: "One row per stay, or per card anniversary credit."
    distinguish_by: [reservation_id, earning_source, posted_date]
    fields:
      loyalty_member_id: "membership credited"
      customer_id: "member"
      nights: "night credits posted"
      reservation_id: "stay credited; empty for card credits"
      posted_date: "date posted"
      earning_source: "stay_nights or cobrand_annual_nights"
    account: elite_nights
    direction: in
    triggers: []

  - type: loyalty_night_reversal
    target: loyalty_transactions
    meaning: "Night credits posted for a stay are taken back because they exceeded the nights actually stayed or the stay did not qualify."
    grain: "One row per reversal of one night-credit transaction."
    distinguish_by: [related_transaction_id]
    fields:
      loyalty_member_id: "membership debited"
      customer_id: "member"
      nights: "night credits taken back"
      reservation_id: "stay concerned"
      posted_date: "date reversed"
      earning_source: "stay_credit_reversal"
      related_transaction_id: "the night-credit transaction reduced"
    account: elite_nights
    direction: out
    triggers: []

  - type: loyalty_night_reset
    target: loyalty_transactions
    meaning: "Elite night credits restart from zero at the start of a calendar year."
    grain: "One row per member per year."
    distinguish_by: [posted_date]
    fields:
      loyalty_member_id: "membership reset"
      customer_id: "member"
      nights: "night credits removed"
      posted_date: "January 1 of the new year"
      earning_source: "year_end_reset"
    account: elite_nights
    direction: out
    triggers: []

  - type: loyalty_suspend
    target: loyalty_memberships
    mutation: {transition: {from: active, to: suspended}}
    meaning: "Account security suspends the membership while suspected misuse is reviewed."
    grain: "One row per transaction."
    fields:
      loyalty_member_id: "membership suspended"
    triggers: []

  - type: loyalty_reinstate
    target: loyalty_memberships
    mutation: {transition: {from: suspended, to: active}}
    meaning: "The review clears a suspended membership."
    grain: "One row per transaction."
    fields:
      loyalty_member_id: "membership reinstated"
    triggers: []

  - type: loyalty_close
    target: loyalty_memberships
    mutation: {transition: {from: active, to: closed}}
    meaning: "The member's signed request to close their own account takes effect."
    grain: "One row per transaction."
    fields:
      loyalty_member_id: "membership closed"
      closed_date: "date closed"
      customer_id: "member (read, not changed)"
    triggers:
      - event: loyalty:loyalty_points_expire
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, posted_date: closed_date, earning_source: closure_forfeit}
      - event: certificate:certificate_forfeit
        map: {loyalty_member_id: loyalty_member_id, closed_date: closed_date}

  - type: loyalty_close_after_review
    target: loyalty_memberships
    mutation: {transition: {from: suspended, to: closed}}
    meaning: "Account security closes a suspended membership after confirming misuse."
    grain: "One row per transaction."
    fields:
      loyalty_member_id: "membership closed"
      closed_date: "date closed"
      customer_id: "member (read, not changed)"
    triggers:
      - event: loyalty:loyalty_points_expire
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, posted_date: closed_date, earning_source: closure_forfeit}
      - event: certificate:certificate_forfeit
        map: {loyalty_member_id: loyalty_member_id, closed_date: closed_date}

measures:
  - id: loyalty_msr_nights_ytd
    window: "The calendar year containing the handling date, from January 1 to the handling date inclusive, by posted_date."
    measure: "Sum of nights over the membership's loyalty_night_credit rows minus the sum over its loyalty_night_reversal rows (equal to elite_night_credits)."
  - id: loyalty_msr_spend_ytd
    window: "The calendar year containing the handling date, by posted_date."
    measure: "Sum of eligible_spend_usd over the membership's loyalty_points_earn rows with earning_source stay_base minus the sum over its loyalty_points_reversal rows."
  - id: loyalty_msr_purchased_ytd
    window: "The calendar year containing the handling date, by posted_date."
    measure: "Sum of points over the membership's loyalty_points_purchase rows."
  - id: loyalty_msr_transferred_out_ytd
    window: "The calendar year containing the handling date, by posted_date."
    measure: "Sum of points over the membership's loyalty_points_transfer_out rows."
  - id: loyalty_msr_received_ytd
    window: "The calendar year containing the handling date, by posted_date."
    measure: "Sum of points over the membership's loyalty_points_transfer_in rows."
  - id: loyalty_msr_last_activity_date
    window: "The whole life of the membership up to the handling date."
    measure: "Latest posted_date among the membership's loyalty_points_earn, loyalty_points_bonus, loyalty_points_purchase, loyalty_points_transfer_in, loyalty_points_transfer_out and loyalty_points_redeem rows; the enrolment date when there are none."
  - id: loyalty_msr_nights_prior_year
    window: "The calendar year before the year containing the handling date, by posted_date."
    measure: "Sum of nights over the membership's loyalty_night_credit rows minus the sum over its loyalty_night_reversal rows posted in that year."
  - id: loyalty_msr_spend_prior_year
    window: "The calendar year before the year containing the handling date, by posted_date."
    measure: "Sum of eligible_spend_usd over the membership's loyalty_points_earn rows with earning_source stay_base minus the sum over its loyalty_points_reversal rows posted in that year."

policies:
  - id: loyalty_agg_multi_holding
    subject: [loyalty_enroll]
    rule: >-
      A person holds at most one Ashbury Rewards account. A guest profile is enrolled only if it has
      no membership whose status is active or suspended. A guest who already has an account and
      enrols again by mistake keeps the original account; the duplicate is not opened. A closed
      account is never reopened, but the person may enrol again with a new member number, starting
      from the base tier with no points, nights or awards carried over.
    eligibility:
      - id: one_open_account
        applies_to: [loyalty_enroll]
        kind: dedup
        condition: "A guest profile is enrolled only if it has no membership whose status is active or suspended."
        evidence_fields: [loyalty_memberships.customer_id, loyalty_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.customer_id]
          action_bindings:
            loyalty_memberships.customer_id: customer_id
        dedup_contract:
          table: loyalty_memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [active, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: loyalty_enrollment
    subject: [loyalty_enroll]
    rule: >-
      Enrolment is free and opens the account at Ashbury Rewards Member with no points and no night
      credits; the enrolment date is also the date the tier takes effect. A guest may enrol only once
      they have reached the minimum enrolment age. Age is counted in whole calendar months from the
      date of birth on the guest profile; a guest whose birthday month and day fall on the enrolment
      date has reached the age, and a birthday of February 29 is reached on March 1 in years without
      that day. Enrolling does not by itself credit any past stay; past stays are credited only under
      loyalty_missing_stay_credit. When the issuing bank has already linked an Ashbury Rewards
      co-brand card, the tier floor of that card applies from the enrolment date under
      loyalty_elite_qualification.
    eligibility:
      - id: minimum_age
        applies_to: [loyalty_enroll]
        kind: time
        condition: "A guest may enrol only once they have reached the minimum enrolment age."
        evidence_fields: [customers.date_of_birth, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the minimum enrolment age"
          anchor_source: customers.date_of_birth
          relation: not_before
          duration_source: params.minimum_enrolment_age_months
          unit: calendar_months
          counting_rule: "Age is counted in whole calendar months from the date of birth on the guest profile; a guest whose birthday month and day fall on the enrolment date has reached the age, and a birthday of February 29 is reached on March 1 in years without that day."
          boundary: inclusive
    params:
      minimum_enrolment_age_months: 216

  - id: loyalty_stay_earning
    subject: [loyalty_points_earn]
    rule: >-
      A completed stay credited to the membership earns base points and, at elite tiers, an elite
      bonus, posted as two separate transactions when the folio is settled. The stay earns only when
      the reservation's rate plan has earns_base_points true and its booking channel earns under the
      plan's ota_booking_earns and gds_booking_earns; the elite bonus is posted only when the plan's
      earns_elite_bonus_points is also true. Eligible spend is the sum of the folio's room lines and,
      when earns_on_incidentals is true, its lines whose charge code is in
      eligible_incidental_charge_codes, less every adjustment and elite breakfast credit posted
      against those lines; taxes, resort fees, parking, pet, smoking cleaning, late check-out and
      early departure charges never count. Base points are the eligible spend times the base points
      per USD of the hotel's brand (base_points_per_usd_express, base_points_per_usd_inn_suites,
      base_points_per_usd_hotel, base_points_per_usd_grand, base_points_per_usd_resort or
      base_points_per_usd_reserve), rounded down to a whole point. The elite bonus is the base points
      times the elite_bonus_pct of the member's tier, rounded down; when elite_bonus_on_incidentals is
      true it is applied to all base points. The member's tier is the variant_name on the membership
      when its tier_effective_date is on or before the stay's check-out date. When the tier took
      effect after the check-out date, the tier held during the stay cannot be read from the records;
      the base points are posted and the elite bonus is left to Ashbury Rewards member services. When
      one member holds several rooms with overlapping nights at one hotel, at most
      rooms_earning_points_per_stay of them earn points. Points are posted only to a membership whose
      status is active. A stay earns each earning component at most once.
    eligibility:
      - id: member_active
        applies_to: [loyalty_points_earn]
        kind: state
        condition: "Points are posted only to a membership whose status is active."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
      - id: tier_held_at_checkout
        applies_to: [loyalty_points_earn]
        kind: authorization
        condition: "The member's tier is the variant_name on the membership when its tier_effective_date is on or before the stay's check-out date."
        evidence_fields: [loyalty_memberships.variant_name, loyalty_memberships.tier_effective_date, booking_reservations.actual_check_out_date, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
      - id: once_per_component
        applies_to: [loyalty_points_earn]
        kind: dedup
        condition: "A stay earns each earning component at most once."
        evidence_fields: [loyalty_transactions.reservation_id, loyalty_transactions.earning_source, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.reservation_id, loyalty_transactions.earning_source]
          action_bindings:
            loyalty_transactions.reservation_id: reservation_id
            loyalty_transactions.earning_source: earning_source
        dedup_contract:
          table: loyalty_transactions
          mode: separate_record
          object_bindings: {reservation_id: reservation_id, earning_source: earning_source}
          duplicate_filters: {event_type: [loyalty_points_earn]}
          distinct_fields: []
    params:
      brand_base_points_per_usd:
        "Ashbury Express": "=base_points_per_usd_express"
        "Ashbury Inn & Suites": "=base_points_per_usd_inn_suites"
        "Ashbury Hotel": "=base_points_per_usd_hotel"
        "Ashbury Grand": "=base_points_per_usd_grand"
        "Ashbury Resort & Spa": "=base_points_per_usd_resort"
        "Ashbury Reserve": "=base_points_per_usd_reserve"
      per_tier:
        "Ashbury Rewards Member": {bonus_pct: "=elite_bonus_pct"}
        "Ashbury Rewards Silver Elite": {bonus_pct: "=elite_bonus_pct"}
        "Ashbury Rewards Gold Elite": {bonus_pct: "=elite_bonus_pct"}
        "Ashbury Rewards Platinum Elite": {bonus_pct: "=elite_bonus_pct"}
        "Ashbury Rewards Titanium Elite": {bonus_pct: "=elite_bonus_pct"}
        "Ashbury Rewards Ambassador Elite": {bonus_pct: "=elite_bonus_pct"}
    formula:
      base_points: "eligible_spend_usd * brand_base_points_per_usd"
      elite_bonus_points: "base_points * elite_bonus_pct / 100"

  - id: loyalty_missing_stay_credit
    subject: [loyalty_points_earn, loyalty_night_credit]
    rule: >-
      A completed stay that was not credited when its folio was settled may be credited later at the
      member's request. A missing stay is credited only if the request is made no later than
      missing_stay_claim_window_days calendar days after the guest checked out. Days are counted as
      whole calendar days from the actual check-out date, which is day zero; a request on the last day
      of the window is accepted. The stay must be a reservation whose status is checked_out and whose
      guest profile is the member's own profile; a stay booked in another person's name is never
      credited to the member, even when the member paid for it. The stay's check-out date must not be
      earlier than the enrolment date less retro_enrollment_credit_days calendar days. The stay earns
      exactly what loyalty_stay_earning and loyalty_night_credits would have posted at check-out,
      including the plan and channel conditions, and is posted with today's date. A stay already
      credited is not credited again; the request is closed by pointing the member to the existing
      transactions.
    eligibility:
      - id: claim_window
        applies_to: [loyalty_points_earn, loyalty_night_credit]
        kind: time
        condition: "A missing stay is credited only if the request is made no later than missing_stay_claim_window_days calendar days after the guest checked out."
        evidence_fields: [booking_reservations.actual_check_out_date, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the guest checked out"
          anchor_source: booking_reservations.actual_check_out_date
          relation: not_after
          duration_source: variants.missing_stay_claim_window_days
          unit: calendar_days
          counting_rule: "Days are counted as whole calendar days from the actual check-out date, which is day zero; a request on the last day of the window is accepted."
          boundary: inclusive
      - id: own_completed_stay
        applies_to: [loyalty_points_earn, loyalty_night_credit]
        kind: authorization
        condition: "The stay must be a reservation whose status is checked_out and whose guest profile is the member's own profile; a stay booked in another person's name is never credited to the member, even when the member paid for it."
        evidence_fields: [booking_reservations.status, booking_reservations.customer_id, loyalty_memberships.customer_id, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
      - id: retro_enrolment
        applies_to: [loyalty_points_earn, loyalty_night_credit]
        kind: authorization
        condition: "The stay's check-out date must not be earlier than the enrolment date less retro_enrollment_credit_days calendar days."
        evidence_fields: [booking_reservations.actual_check_out_date, loyalty_memberships.enrolled_date, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
      - id: not_yet_credited
        applies_to: [loyalty_points_earn, loyalty_night_credit]
        kind: dedup
        condition: "A stay already credited is not credited again; the request is closed by pointing the member to the existing transactions."
        evidence_fields: [loyalty_transactions.reservation_id, loyalty_transactions.earning_source, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.reservation_id, loyalty_transactions.earning_source]
          action_bindings:
            loyalty_transactions.reservation_id: reservation_id
            loyalty_transactions.earning_source: earning_source
        dedup_contract:
          table: loyalty_transactions
          mode: separate_record
          object_bindings: {reservation_id: reservation_id, earning_source: earning_source}
          duplicate_filters: {event_type: [loyalty_points_earn, loyalty_night_credit]}
          distinct_fields: []

  - id: loyalty_night_credits
    subject: [loyalty_night_credit, loyalty_night_reversal, loyalty_night_reset]
    rule: >-
      A completed stay credited to the membership posts elite_night_credit_per_stay_night night credit
      for each night between the actual check-in and actual check-out dates when the reservation's plan
      has counts_toward_elite_nights true and its booking channel earns under the plan's channel rules;
      Reward Night Rate stays count. When one member holds several rooms with overlapping nights at
      one hotel, only rooms_earning_nights_per_stay of them earn night credits. On each anniversary of
      the card account the co-brand card linked on that date posts the card's
      cobrand_annual_night_credits. Night credits are posted only to a membership whose status is
      active. A stay posts night credits at most once. When the nights credited for a stay exceed the
      nights stayed, the excess is reversed against that stay's night-credit transaction. On
      night_credit_year_start every membership's elite_night_credits are reset to zero by a
      year_end_reset transaction equal to the balance; the reset never changes the tier already held.
    eligibility:
      - id: member_active
        applies_to: [loyalty_night_credit]
        kind: state
        condition: "Night credits are posted only to a membership whose status is active."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
      - id: once_per_stay
        applies_to: [loyalty_night_credit]
        kind: dedup
        condition: "A stay posts night credits at most once."
        evidence_fields: [loyalty_transactions.reservation_id, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.reservation_id]
          action_bindings:
            loyalty_transactions.reservation_id: reservation_id
        dedup_contract:
          table: loyalty_transactions
          mode: separate_record
          object_bindings: {reservation_id: reservation_id}
          duplicate_filters: {event_type: [loyalty_night_credit]}
          distinct_fields: []
    params:
      cobrand_annual_night_credits: {ashbury_rewards_card: 15, ashbury_rewards_premier_card: 25}

  - id: loyalty_elite_qualification
    subject: [loyalty_tier_change, loyalty_cobrand_link]
    rule: >-
      A member is upgraded on the day loyalty_msr_nights_ytd first reaches the qualifying_nights_required
      of a higher tier and, for a tier with qualifying_spend_required_usd above zero,
      loyalty_msr_spend_ytd also reaches that spend. The upgrade takes effect that day and is
      guaranteed through the last day of the status_valid_through_month of the calendar year
      status_valid_years_after_qualification years after the year of qualification. A tier is never
      removed before its status_valid_through date. On March 1 every member whose status_valid_through
      has passed is reassessed: the new tier is the highest tier whose thresholds are met by
      loyalty_msr_nights_prior_year and loyalty_msr_spend_prior_year, but not lower than the
      downgrade_floor_tier of the tier held, and the new guaranteed period is computed from the prior
      year as the year of qualification. Holding an Ashbury Rewards co-brand card changes the tier: a
      member whose linked card appears in cobrand_status_floor holds at least the tier listed for it,
      with no status_valid_through, for as long as the card stays linked; when the card is closed the
      member keeps the higher of the tier earned by nights and the floor of any card still linked. A
      tier change is applied only when the membership's status is active. Tier changes are made by
      Ashbury Rewards; guest services does not grant, match or extend a tier.
    eligibility:
      - id: member_active
        applies_to: [loyalty_tier_change, loyalty_cobrand_link]
        kind: state
        condition: "A tier change is applied only when the membership's status is active."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.loyalty_member_id]
          action_bindings:
            loyalty_memberships.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    params:
      cobrand_status_floor: {ashbury_rewards_card: "Ashbury Rewards Silver Elite", ashbury_rewards_premier_card: "Ashbury Rewards Gold Elite"}
      per_tier:
        "Ashbury Rewards Member": {nights: "=qualifying_nights_required", spend: "=qualifying_spend_required_usd", floor: "=downgrade_floor_tier"}
        "Ashbury Rewards Silver Elite": {nights: "=qualifying_nights_required", spend: "=qualifying_spend_required_usd", floor: "=downgrade_floor_tier"}
        "Ashbury Rewards Gold Elite": {nights: "=qualifying_nights_required", spend: "=qualifying_spend_required_usd", floor: "=downgrade_floor_tier"}
        "Ashbury Rewards Platinum Elite": {nights: "=qualifying_nights_required", spend: "=qualifying_spend_required_usd", floor: "=downgrade_floor_tier"}
        "Ashbury Rewards Titanium Elite": {nights: "=qualifying_nights_required", spend: "=qualifying_spend_required_usd", floor: "=downgrade_floor_tier"}
        "Ashbury Rewards Ambassador Elite": {nights: "=qualifying_nights_required", spend: "=qualifying_spend_required_usd", floor: "=downgrade_floor_tier"}
    measures: [loyalty_msr_nights_ytd, loyalty_msr_spend_ytd, loyalty_msr_nights_prior_year, loyalty_msr_spend_prior_year]
    formula:
      qualifies: "loyalty_msr_nights_ytd >= qualifying_nights_required and loyalty_msr_spend_ytd >= qualifying_spend_required_usd"

  - id: loyalty_welcome_amenity
    subject: [loyalty_points_bonus]
    rule: >-
      Elite members receive welcome points once per stay, posted with earning_source welcome_amenity
      when the folio is settled. The amount is the tier's welcome_amenity_points at Ashbury Hotel,
      Ashbury Grand, Ashbury Resort & Spa and Ashbury Reserve hotels and its
      welcome_amenity_points_select_service at Ashbury Express and Ashbury Inn & Suites hotels; a tier
      whose amount is 0 receives nothing. Reward Night Rate stays receive welcome points when
      welcome_amenity_on_reward_stays is true. Reservations booked through an online travel agency
      receive none. The tier is read as under loyalty_stay_earning, and when it cannot be read the
      welcome points are left to Ashbury Rewards member services. A stay receives welcome points at
      most once. Welcome points are posted only to a membership whose status is active.
    eligibility:
      - id: once_per_stay
        applies_to: [loyalty_points_bonus]
        kind: dedup
        condition: "A stay receives welcome points at most once."
        evidence_fields: [loyalty_transactions.reservation_id, loyalty_transactions.earning_source, loyalty_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_transactions.reservation_id, loyalty_transactions.earning_source]
          action_bindings:
