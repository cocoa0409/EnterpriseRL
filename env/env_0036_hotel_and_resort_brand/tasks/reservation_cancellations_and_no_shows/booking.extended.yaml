          - when: "the guest's Ashbury Rewards account shows at least the steady number of stays credited in the twelve months before the day of handling (stay night-credit postings, a posting on or before the same date twelve months earlier excluded)"
            value: "K('steady_relief')"
          - when: "it shows at least the repeat number of such stays but fewer than the steady number"
            value: "K('repeat_relief')"
          - when: "otherwise"
            value: "K('history_relief_none')"
        baseline:
          stay_relief: "K('history_relief_none')"
        evidence: [history, cross_category]
        cross_difficulty: loyalty
      - id: direct_booking_courtesy
        effect: parameter
        decides: direct_relief
        bindings: [member_status, direct_channel, direct_relief]
        ladder:
          - when: "the reservation was booked directly with Ashbury and carries an active Ashbury Rewards membership"
            value: "K('member_direct_relief')"
          - when: "the reservation was booked directly with Ashbury and carries no active Ashbury Rewards membership"
            value: "K('guest_direct_relief')"
          - when: "otherwise"
            value: "K('direct_relief_none')"
        baseline:
          direct_relief: "K('direct_relief_none')"
        evidence: [cross_category]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The no-show charge is the no-show night the plan's no-show basis gives, that is one night at the nightly rate on the reservation where the basis is the first night and every night of the stay where it is the full stay, with room tax added at the hotel's tax rate where the plan adds tax to penalties, rounded to the cent. A no-show charge settled from money held is never more than the money held, that is every deposit payment collected for the reservation less every refund, forfeit and transfer of deposit money posted on it.
      params: [no_show_penalty_basis, penalty_includes_tax]
    inputs:
      history:
        - {table: booking_charges, aggregate: sum, field: amount, filters: {event_type: booking_deposit_collect}}
        - {table: booking_charges, aggregate: sum, field: amount, filters: {event_type: booking_deposit_refund}}
        - {table: booking_charges, aggregate: sum, field: amount, filters: {event_type: booking_deposit_forfeit}}
        - {table: booking_charges, aggregate: sum, field: amount, filters: {event_type: booking_deposit_transfer}}
        - {category: loyalty, table: loyalty_transactions, aggregate: count, field: transaction_id, within_months: 12, filters: {event_type: loyalty_night_credit, earning_source: stay_nights}}
      cross_category: [loyalty]

  - id: booking_ext_deposit_refund
    base_policy_refs: [booking_evt_deposit_settlement]
    overwrite:
      - base_policy: booking_evt_deposit_settlement
        superseded_clause: >-
          A refund is made only for a reservation whose status is cancelled or relocated.
        replaced_by: >-
          A refund of money held is made only for a reservation whose status is cancelled, relocated or no-show.
      - base_policy: booking_evt_deposit_settlement
        superseded_clause: >-
          On a late cancellation or a no-show an amount equal to the penalty is retained as a forfeit and any amount held beyond the penalty is refunded.
        replaced_by: >-
          After a no-show the hotel keeps from the money held the no-show charge settled from it, without a separate forfeit entry, and refunds the rest of the money held less the deposit handling fee.
    trigger: on_request
    subject: [booking_deposit_refund]
    computes: amount
    target_tool: request_deposit_refund_05a65982
    params:
      long_hold_days: 100
      reserve_long_hold_fee: 45.00
      resort_long_hold_fee: 25.00
      no_handling_fee: 0.00
      small_refund_limit: 150.00
      small_refund_share: 0.10
      large_refund_limit: 1000.00
      large_refund_fee_cap: 20.00
      top_fee_waiver: 1.00
      mid_fee_waiver: 0.50
      silver_fee_waiver: 0.25
      no_fee_waiver: 0.00
      top_nights: 50
      mid_nights: 25
      silver_nights: 10
      member_direct_waiver: 0.40
      guest_direct_waiver: 0.20
      no_direct_waiver: 0.00
    rule: >
      After a no-show the hotel keeps from the money held the no-show charge settled from it, without a
      separate forfeit entry, and refunds the rest of the money held less the deposit handling fee. A
      refund of money held is made only for a reservation whose status is cancelled, relocated or
      no-show. A refund of money held after a no-show is made on the guest's own instruction to return it to the card on file, as one refund entry naming the most recent deposit payment on the reservation, and each payment is named by a refund at most once. The refund of money held after a no-show is not made until a no-show charge stands
      among the reservation's charges. The money held is every deposit payment collected for the
      reservation less every refund, forfeit and transfer of deposit money posted on it. The amount kept
      is every no-show charge on the reservation settled from money held, less every reversal posted
      against it. The refund is the money held less the amount kept, never below zero, rounded to the
      cent. When the hotel is an Ashbury Reserve and the reservation was booked at least the long-hold
      days before the refund is made, the deposit handling fee is the Reserve long-hold fee; when the
      hotel is an Ashbury Resort & Spa and the reservation was booked at least the long-hold days before
      the refund, it is the resort long-hold fee; any other refund carries no handling fee. When the
      money held less the amount kept is below the small-refund limit, the fee charged is the lesser of
      the handling fee and the small-refund share of that amount; when that amount is at least the
      large-refund limit, the fee charged is the lesser of the handling fee and the large-refund fee
      cap; any other refund is charged the handling fee as it stands. A guest whose attached Ashbury
      Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night
      threshold of elite night credits this year has the fee waived in full; one whose membership holds
      the Platinum Elite or Gold Elite tier with at least the middle night threshold has the middle
      share of the fee waived; one holding the Silver Elite tier with at least the silver night threshold
      has the silver share waived; any other guest has no tier waiver. A reservation booked directly with Ashbury, through the brand website, the mobile app, the call center or the hotel itself, that carries an active Ashbury Rewards membership has the member direct-booking share of the fee waived; one booked directly without an active membership has the guest direct-booking share waived; a reservation booked through any other channel has no direct-booking waiver. The fee charged is first reduced by the tier waiver and that result by the direct-booking waiver, each acting on the result of the step before; the fee is then taken off the money held less
      the amount kept, and rounding to the cent happens once, on the refund.
    prerequisite:
      - problem: booking_ext_no_show_charge
        kind: value_input
        gate: kept
        form: state
        policy_source: >-
          The refund of money held after a no-show is not made until a no-show charge stands among the reservation's charges.
        condition: >-
          booking_charges carries a booking_no_show_charge entry for the reservation.
        resolved_by: post_no_show_charge_68d6e4c0
        effect: >-
          The amount kept rises from zero to the no-show charge, so the kept binding and the refund change: without the charge the whole money held would be refunded.
    cross_category:
      - category: loyalty
        as: branch
        reads: [variant_name, elite_night_credits, status]
        note: The tier waiver reads the tier and this year's elite night credits, the direct-booking waiver whether the attached membership is active.
    compute:
      - held: "SUM('booking_charges', 'amount', event_type='booking_deposit_collect') - SUM('booking_charges', 'amount', event_type='booking_deposit_refund') - SUM('booking_charges', 'amount', event_type='booking_deposit_forfeit') - SUM('booking_charges', 'amount', event_type='booking_deposit_transfer')"
      - kept: "SUM('booking_charges', 'amount', event_type='booking_no_show_charge', settlement_source='advance_deposit') - SUM('booking_charges', 'amount', event_type='booking_penalty_reversal', settlement_source='advance_deposit')"
      - before_fee: "MX(held - kept, 0)"
      - hold_days: "DAYS(F('booked_date'), NOW)"
      - handling_fee: "K('reserve_long_hold_fee') if (F('property_brand') == 'Ashbury Reserve' and hold_days >= K('long_hold_days')) else (K('resort_long_hold_fee') if (F('property_brand') == 'Ashbury Resort & Spa' and hold_days >= K('long_hold_days')) else K('no_handling_fee'))"
      - fee_charged: "MN(handling_fee, K('small_refund_share') * before_fee) if before_fee < K('small_refund_limit') else (MN(handling_fee, K('large_refund_fee_cap')) if before_fee >= K('large_refund_limit') else handling_fee)"
      - tier_name: "CFIELD('loyalty', 'variant_name', loyalty_member_id=F('loyalty_member_id'))"
      - tier_nights: "CFIELD('loyalty', 'elite_night_credits', loyalty_member_id=F('loyalty_member_id'))"
      - tier_waiver: "K('top_fee_waiver') if ((tier_name == 'Ashbury Rewards Titanium Elite' or tier_name == 'Ashbury Rewards Ambassador Elite') and tier_nights >= K('top_nights')) else (K('mid_fee_waiver') if ((tier_name == 'Ashbury Rewards Platinum Elite' or tier_name == 'Ashbury Rewards Gold Elite') and tier_nights >= K('mid_nights')) else (K('silver_fee_waiver') if (tier_name == 'Ashbury Rewards Silver Elite' and tier_nights >= K('silver_nights')) else K('no_fee_waiver')))"
      - member_status: "CFIELD('loyalty', 'status', loyalty_member_id=F('loyalty_member_id'))"
      - direct_channel: "F('booking_channel') == 'brand_website' or F('booking_channel') == 'mobile_app' or F('booking_channel') == 'call_center' or F('booking_channel') == 'property_direct'"
      - direct_waiver: "K('member_direct_waiver') if (direct_channel and member_status == 'active') else (K('guest_direct_waiver') if (direct_channel and member_status != 'active') else K('no_direct_waiver'))"
      - result: "RND(MX(before_fee - fee_charged * (1 - tier_waiver) * (1 - direct_waiver), 0), 2)"
    compute_basis:
      held: "The money held is every deposit payment collected for the reservation less every refund, forfeit and transfer of deposit money posted on it."
      kept: "The amount kept is every no-show charge on the reservation settled from money held, less every reversal posted against it."
      before_fee: "The refund is the money held less the amount kept, never below zero, rounded to the cent."
      hold_days: "When the hotel is an Ashbury Reserve and the reservation was booked at least the long-hold days before the refund is made, the deposit handling fee is the Reserve long-hold fee;"
      handling_fee: "When the hotel is an Ashbury Reserve and the reservation was booked at least the long-hold days before the refund is made, the deposit handling fee is the Reserve long-hold fee; when the hotel is an Ashbury Resort & Spa and the reservation was booked at least the long-hold days before the refund, it is the resort long-hold fee; any other refund carries no handling fee."
      fee_charged: "When the money held less the amount kept is below the small-refund limit, the fee charged is the lesser of the handling fee and the small-refund share of that amount; when that amount is at least the large-refund limit, the fee charged is the lesser of the handling fee and the large-refund fee cap; any other refund is charged the handling fee as it stands."
      tier_name: "A guest whose attached Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night credits this year has the fee waived in full;"
      tier_nights: "A guest whose attached Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night credits this year has the fee waived in full;"
      tier_waiver: "A guest whose attached Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night credits this year has the fee waived in full; one whose membership holds the Platinum Elite or Gold Elite tier with at least the middle night threshold has the middle share of the fee waived; one holding the Silver Elite tier with at least the silver night threshold has the silver share waived; any other guest has no tier waiver."
      member_status: "A reservation booked directly with Ashbury, through the brand website, the mobile app, the call center or the hotel itself, that carries an active Ashbury Rewards membership has the member direct-booking share of the fee waived;"
      direct_channel: "A reservation booked directly with Ashbury, through the brand website, the mobile app, the call center or the hotel itself, that carries an active Ashbury Rewards membership has the member direct-booking share of the fee waived;"
      direct_waiver: "A reservation booked directly with Ashbury, through the brand website, the mobile app, the call center or the hotel itself, that carries an active Ashbury Rewards membership has the member direct-booking share of the fee waived; one booked directly without an active membership has the guest direct-booking share waived; a reservation booked through any other channel has no direct-booking waiver."
      result: "The fee charged is first reduced by the tier waiver and that result by the direct-booking waiver, each acting on the result of the step before; the fee is then taken off the money held less the amount kept, and rounding to the cent happens once, on the refund."
    factors:
      - id: long_hold_handling_fee
        effect: parameter
        decides: handling_fee
        bindings: [hold_days, handling_fee]
        ladder:
          - when: "the hotel is an Ashbury Reserve and the reservation was booked at least the long-hold days before the refund"
            value: "K('reserve_long_hold_fee')"
          - when: "the hotel is an Ashbury Resort & Spa and the reservation was booked at least the long-hold days before the refund"
            value: "K('resort_long_hold_fee')"
          - when: "otherwise"
            value: "K('no_handling_fee')"
        baseline:
          handling_fee: "K('no_handling_fee')"
        evidence: [date]
        cross_difficulty: null
      - id: refund_size_fee_cap
        effect: method
        decides: fee_charged
        bindings: [held, kept, before_fee, fee_charged]
        ladder:
          - when: "the money held less the amount kept is below the small-refund limit"
            method: "the fee charged is the lesser of the handling fee and the small-refund share of that amount"
          - when: "the money held less the amount kept is at least the large-refund limit"
            method: "the fee charged is the lesser of the handling fee and the large-refund fee cap"
          - when: "otherwise"
            method: "the fee charged is the handling fee as it stands"
        baseline:
          fee_charged: "handling_fee"
        evidence: [history]
        cross_difficulty: null
      - id: tier_fee_waiver
        effect: parameter
        decides: tier_waiver
        bindings: [tier_name, tier_nights, tier_waiver]
        ladder:
          - when: "the attached membership holds the Titanium Elite or Ambassador Elite tier and has at least the top night threshold of elite night credits this year"
            value: "K('top_fee_waiver')"
          - when: "the attached membership holds the Platinum Elite or Gold Elite tier and has at least the middle night threshold of elite night credits this year"
            value: "K('mid_fee_waiver')"
          - when: "the attached membership holds the Silver Elite tier and has at least the silver night threshold of elite night credits this year"
            value: "K('silver_fee_waiver')"
          - when: "otherwise"
            value: "K('no_fee_waiver')"
        baseline:
          tier_waiver: "K('no_fee_waiver')"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: direct_booking_fee_waiver
        effect: parameter
        decides: direct_waiver
        bindings: [member_status, direct_channel, direct_waiver]
        ladder:
          - when: "the reservation was booked directly with Ashbury and carries an active Ashbury Rewards membership"
            value: "K('member_direct_waiver')"
          - when: "the reservation was booked directly with Ashbury and carries no active Ashbury Rewards membership"
            value: "K('guest_direct_waiver')"
          - when: "otherwise"
