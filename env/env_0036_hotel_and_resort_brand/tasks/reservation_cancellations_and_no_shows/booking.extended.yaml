      brg_extra_discount_pct: 0
      points_redeposit_on_timely_cancel: true
      certificate_nights_allowed: true
      relocation_first_night_paid: true
      relocation_refunds_advance_payments: true
      relocation_compensation_eligible: true

events:
  - type: booking_reservation_create
    target: booking_reservations
    mutation: create
    meaning: "A guest books one room at one hotel under one rate plan and receives a confirmation number."
    grain: "One row per room reserved."
    fields:
      reservation_id: "reference number of the new reservation"
      customer_id: "guest holding the reservation"
      variant_name: "rate plan booked"
      confirmation_number: "confirmation number issued"
      property_code: "hotel booked"
      property_brand: "brand of the hotel booked"
      award_category: "award category of the hotel at booking"
      award_season: "award pricing season of the arrival night"
      room_type: "room type booked"
      arrival_date: "arrival date"
      departure_date: "departure date"
      nights: "nights booked"
      adults: "adults registered"
      nightly_rate: "nightly room rate before tax, including any package supplement and extra-adult charge"
      tax_rate_pct: "hotel room tax rate"
      booked_date: "booking date"
      booking_channel: "channel booked through"
      guarantee_type: "guarantee recorded at booking"
      loyalty_member_id: "membership attached for credit"
      group_block_id: "group block picked up, if any"
      corporate_client_code: "corporate client code quoted, if any"
      points_redeemed: "points redeemed for points-paid nights"
      certificate_nights: "nights paid with Free Night Awards"
      cancellation_timing: "set to not_cancelled at booking"
    triggers:
      - event: booking:booking_deposit_collect
        when: {guarantee_type: full_prepayment}
        map: {reservation_id: reservation_id, customer_id: customer_id, posted_date: booked_date, charge_basis: full_prepayment, settlement_source: card_on_file, reversal_reason: not_applicable}
      - event: booking:booking_deposit_collect
        when: {guarantee_type: advance_deposit}
        map: {reservation_id: reservation_id, customer_id: customer_id, posted_date: booked_date, charge_basis: resort_deposit, settlement_source: card_on_file, reversal_reason: not_applicable}
      - event: loyalty:loyalty_points_redeem
        when: {points_redeemed: {not: 0}}
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, reservation_id: reservation_id, points: points_redeemed, posted_date: booked_date, earning_source: award_redemption}
      - event: certificate:certificate_apply
        when: {certificate_nights: {not: 0}}
        map: {reservation_id: reservation_id}

  - type: booking_reservation_modify
    target: booking_reservations
    mutation: update
    meaning: "The dates, room type, occupancy or guest of a confirmed reservation are changed at the guest's request."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation changed"
      customer_id: "guest profile now holding the reservation (changes only on a name change)"
      arrival_date: "new arrival date"
      departure_date: "new departure date"
      nights: "new number of nights"
      room_type: "new room type"
      adults: "new number of adults"
      nightly_rate: "nightly rate after re-pricing"
      points_redeemed: "points redeemed after re-pricing a Reward Night Rate reservation"
    triggers: []

  - type: booking_rate_guarantee_adjust
    target: booking_reservations
    mutation: update
    meaning: "The Best Rate Guarantee team validates a lower publicly available rate for the same stay and lowers the reservation's nightly rate."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation adjusted"
      nightly_rate: "matched nightly rate after the additional discount"
      rate_guarantee_date: "date the adjustment was applied"
    triggers: []

  - type: booking_reservation_cancel
    target: booking_reservations
    mutation: {transition: {from: confirmed, to: cancelled}}
    meaning: "A confirmed reservation is cancelled at the guest's request before arrival."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation cancelled"
      cancelled_at: "moment the cancellation was recorded"
      cancellation_timing: "before_deadline or after_deadline, decided against the effective deadline"
      guarantee_type: "guarantee of the reservation (read, not changed)"
      points_redeemed: "points redeemed on the reservation (read, not changed)"
      certificate_nights: "Free Night Award nights on the reservation (read, not changed)"
      loyalty_member_id: "membership attached (read, not changed)"
    triggers:
      - event: booking:booking_cancellation_penalty
        when: {cancellation_timing: after_deadline, guarantee_type: credit_card}
        map: {reservation_id: reservation_id, settlement_source: card_on_file, reversal_reason: not_applicable}
      - event: booking:booking_cancellation_penalty
        when: {cancellation_timing: after_deadline, guarantee_type: [advance_deposit, full_prepayment]}
        map: {reservation_id: reservation_id, settlement_source: advance_deposit, reversal_reason: not_applicable}
      - event: booking:booking_deposit_refund
        when: {cancellation_timing: before_deadline, guarantee_type: advance_deposit}
        map: {reservation_id: reservation_id, charge_basis: deposit_refund, settlement_source: card_on_file, reversal_reason: not_applicable}
      - event: loyalty:loyalty_points_redeposit
        when: {cancellation_timing: before_deadline, points_redeemed: {not: 0}}
        map: {loyalty_member_id: loyalty_member_id, reservation_id: reservation_id, points: points_redeemed, earning_source: award_redeposit}
      - event: certificate:certificate_release
        when: {cancellation_timing: before_deadline, certificate_nights: {not: 0}}
        map: {reservation_id: reservation_id}
      - event: certificate:certificate_forfeit
        when: {cancellation_timing: after_deadline, certificate_nights: {not: 0}}
        map: {reservation_id: reservation_id}

  - type: booking_check_in
    target: booking_reservations
    mutation: {transition: {from: confirmed, to: in_house}}
    meaning: "The guest arrives and the front desk checks them in."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation checked in"
      actual_check_in_date: "date of check-in"
      customer_id: "guest (read, not changed)"
      property_code: "hotel (read, not changed)"
      property_brand: "hotel brand (read, not changed)"
      loyalty_member_id: "membership attached (read, not changed)"
      guarantee_type: "guarantee of the reservation (read, not changed)"
      certificate_nights: "Free Night Award nights (read, not changed)"
    triggers:
      - event: folio:folio_open
        map: {reservation_id: reservation_id, customer_id: customer_id, property_code: property_code, variant_name: property_brand, loyalty_member_id: loyalty_member_id, opened_date: actual_check_in_date}
      - event: booking:booking_deposit_transfer
        when: {guarantee_type: [advance_deposit, full_prepayment]}
        map: {reservation_id: reservation_id, customer_id: customer_id, posted_date: actual_check_in_date, charge_basis: deposit_transfer, settlement_source: advance_deposit, reversal_reason: not_applicable}
      - event: certificate:certificate_redeem
        when: {certificate_nights: {not: 0}}
        map: {reservation_id: reservation_id}

  - type: booking_check_out
    target: booking_reservations
    mutation: {transition: {from: in_house, to: checked_out}}
    meaning: "The guest checks out and the stay ends, on the scheduled departure date or earlier."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation checked out"
      actual_check_out_date: "date of check-out"
      customer_id: "guest (read, not changed)"
      loyalty_member_id: "membership attached (read, not changed)"
      variant_name: "rate plan (read, not changed)"
      booking_channel: "booking channel (read, not changed)"
    triggers:
      - event: loyalty:loyalty_night_credit
        when: {loyalty_member_id: {not: ""}}
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, reservation_id: reservation_id, posted_date: actual_check_out_date, earning_source: stay_nights}

  - type: booking_no_show_mark
    target: booking_reservations
    mutation: {transition: {from: confirmed, to: no_show}}
    meaning: "The night audit finds that the guest of a guaranteed reservation never arrived and marks it a no-show."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation marked"
      no_show_date: "hotel business date of the no-show (the arrival date)"
      guarantee_type: "guarantee of the reservation (read, not changed)"
      points_redeemed: "points redeemed (read, not changed)"
      certificate_nights: "Free Night Award nights (read, not changed)"
    triggers:
      - event: booking:booking_no_show_charge
        when: {guarantee_type: credit_card}
        map: {reservation_id: reservation_id, settlement_source: card_on_file, reversal_reason: not_applicable}
      - event: booking:booking_no_show_charge
        when: {guarantee_type: [advance_deposit, full_prepayment]}
        map: {reservation_id: reservation_id, settlement_source: advance_deposit, reversal_reason: not_applicable}
      - event: certificate:certificate_forfeit
        when: {certificate_nights: {not: 0}}
        map: {reservation_id: reservation_id}

  - type: booking_relocate
    target: booking_reservations
    mutation: {transition: {from: confirmed, to: relocated}}
    meaning: "The hotel cannot provide the guaranteed room on arrival and relocates the guest to another hotel at its own cost."
    grain: "One row per transaction."
    fields:
      reservation_id: "reservation relocated"
      relocated_date: "date of the relocation (the arrival date)"
      customer_id: "guest (read, not changed)"
      guarantee_type: "guarantee of the reservation (read, not changed)"
      loyalty_member_id: "membership attached (read, not changed)"
      points_redeemed: "points redeemed (read, not changed)"
      certificate_nights: "Free Night Award nights (read, not changed)"
    triggers:
      - event: booking:booking_deposit_refund
        when: {guarantee_type: [advance_deposit, full_prepayment]}
        map: {reservation_id: reservation_id, customer_id: customer_id, posted_date: relocated_date, charge_basis: deposit_refund, settlement_source: card_on_file, reversal_reason: not_applicable}
      - event: loyalty:loyalty_points_bonus
        when: {loyalty_member_id: {not: ""}}
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, reservation_id: reservation_id, posted_date: relocated_date, earning_source: relocation_compensation}
      - event: loyalty:loyalty_points_redeposit
        when: {points_redeemed: {not: 0}}
        map: {loyalty_member_id: loyalty_member_id, customer_id: customer_id, reservation_id: reservation_id, points: points_redeemed, posted_date: relocated_date, earning_source: award_redeposit}
      - event: certificate:certificate_release
        when: {certificate_nights: {not: 0}}
        map: {reservation_id: reservation_id}

  - type: booking_deposit_collect
    target: booking_charges
    meaning: "A full prepayment or a resort advance deposit is charged to the guest's card and held for the reservation."
    grain: "One row per collection on one reservation."
    distinguish_by: [charge_basis, posted_date]
    fields:
      reservation_id: "reservation the money is held for"
      customer_id: "guest charged"
      amount: "amount collected"
      posted_date: "date collected"
      charge_basis: "full_prepayment or resort_deposit"
      settlement_source: "card_on_file"
      reversal_reason: "not_applicable"
    account: advance_deposit
    direction: in
    triggers: []

  - type: booking_deposit_refund
    target: booking_charges
    meaning: "Money held for a reservation is returned to the guest's card."
    grain: "One row per refund of one held collection."
    distinguish_by: [related_charge_id, posted_date]
    fields:
      reservation_id: "reservation the money was held for"
      customer_id: "guest refunded"
      amount: "amount refunded"
      posted_date: "date refunded"
      charge_basis: "deposit_refund"
      settlement_source: "card_on_file"
      related_charge_id: "the collection being refunded"
      reversal_reason: "not_applicable"
    account: advance_deposit
    direction: out
    triggers: []

  - type: booking_deposit_forfeit
    target: booking_charges
    meaning: "Money held for a reservation is retained by the hotel to settle a cancellation or no-show penalty."
    grain: "One row per penalty settled from held money."
    distinguish_by: [related_charge_id]
    fields:
      reservation_id: "reservation the money was held for"
      customer_id: "guest"
      amount: "amount retained, equal to the penalty it settles"
      posted_date: "date retained"
      charge_basis: "deposit_forfeit"
      settlement_source: "advance_deposit"
      related_charge_id: "the penalty or no-show charge being settled"
      reversal_reason: "not_applicable"
    account: advance_deposit
    direction: out
    triggers: []

  - type: booking_deposit_transfer
    target: booking_charges
    meaning: "At check-in the money held for the reservation is moved to the guest folio as a payment."
    grain: "One row per transfer at one check-in."
    distinguish_by: [posted_date]
    fields:
      reservation_id: "reservation checked in"
      customer_id: "guest"
      amount: "entire amount still held"
      posted_date: "check-in date"
      charge_basis: "deposit_transfer"
      settlement_source: "advance_deposit"
      reversal_reason: "not_applicable"
    account: advance_deposit
    direction: out
    triggers:
      - event: folio:folio_payment
        map: {amount: amount, customer_id: customer_id, business_date: posted_date, posted_date: posted_date, charge_code: payment_deposit_transfer, adjustment_reason: not_applicable}

  - type: booking_cancellation_penalty
    target: booking_charges
    meaning: "A late cancellation penalty is assessed on a reservation cancelled after its effective deadline."
    grain: "One row per late-cancelled reservation."
    distinguish_by: [charge_basis]
    fields:
      reservation_id: "reservation cancelled late"
      customer_id: "guest charged"
      amount: "penalty amount"
      posted_date: "date assessed"
      charge_basis: "first_night_room_and_tax or full_stay_room_and_tax"
      settlement_source: "card_on_file, or advance_deposit when money is held"
      reversal_reason: "not_applicable"
    account: penalty_charged
    direction: in
    triggers:
      - event: booking:booking_deposit_forfeit
        when: {settlement_source: advance_deposit}
        map: {reservation_id: reservation_id, customer_id: customer_id, amount: amount, posted_date: posted_date, charge_basis: deposit_forfeit, settlement_source: advance_deposit, related_charge_id: charge_id, reversal_reason: not_applicable}

  - type: booking_no_show_charge
    target: booking_charges
    meaning: "A no-show charge is assessed on a guaranteed reservation whose guest never arrived."
    grain: "One row per no-show reservation."
    distinguish_by: [charge_basis]
    fields:
      reservation_id: "reservation marked a no-show"
      customer_id: "guest charged"
      amount: "no-show charge amount"
      posted_date: "date assessed"
      charge_basis: "first_night_room_and_tax or full_stay_room_and_tax"
      settlement_source: "card_on_file, or advance_deposit when money is held"
      reversal_reason: "not_applicable"
    account: penalty_charged
    direction: in
    triggers:
      - event: booking:booking_deposit_forfeit
        when: {settlement_source: advance_deposit}
        map: {reservation_id: reservation_id, customer_id: customer_id, amount: amount, posted_date: posted_date, charge_basis: deposit_forfeit, settlement_source: advance_deposit, related_charge_id: charge_id, reversal_reason: not_applicable}

  - type: booking_penalty_reversal
    target: booking_charges
    meaning: "All or part of a cancellation penalty or no-show charge is reversed because it should not have been charged as it was."
    grain: "One row per reversal of one penalty."
    distinguish_by: [related_charge_id]
    fields:
      reservation_id: "reservation the penalty was charged on"
      customer_id: "guest credited"
      amount: "amount reversed"
      posted_date: "date reversed"
      charge_basis: "penalty_reversal"
      settlement_source: "where the penalty was settled; the reversal is returned to the card on file in both cases"
      related_charge_id: "the penalty or no-show charge being reversed"
      reversal_reason: "duplicate_reservation, deadline_misapplied or penalty_basis_misapplied"
    account: penalty_charged
    direction: out
    triggers: []

measures:
  - id: booking_msr_overlapping_rooms
    window: "The nights from the requested arrival date up to (not including) the requested departure date."
    measure: "Count of the same customer's booking_reservations rows at the same property_code with status confirmed or in_house whose nights [arrival_date, departure_date) overlap the requested nights."
  - id: booking_msr_deposit_held
    window: "The whole life of one reservation, up to the moment of handling."
    measure: "Sum of amount over the reservation's booking_deposit_collect rows minus the sum over its booking_deposit_refund, booking_deposit_forfeit and booking_deposit_transfer rows (the advance_deposit account of that reservation)."
  - id: booking_msr_net_penalty_charged
    window: "The whole life of one reservation, up to the moment of handling."
    measure: "Sum of amount over the reservation's booking_cancellation_penalty and booking_no_show_charge rows minus the sum over its booking_penalty_reversal rows (the penalty_charged account of that reservation)."

policies:
  - id: booking_agg_multi_holding
    subject: [booking_reservation_create]
    rule: >-
      A guest profile may hold any number of reservations at any number of hotels at the same time;
      there is no brand-wide cap on reservations per guest. Reservations at the same hotel for
      overlapping nights are limited separately by booking_agg_rooms_per_stay. Each reservation
      covers exactly one room and is cancelled, changed, checked in and charged on its own; a request
      about one confirmation number never changes another reservation.
    eligibility: []
    params:
      max_per_customer: null

  - id: booking_agg_rooms_per_stay
    subject: [booking_reservation_create]
    rule: >-
      The rooms a guest holds at one hotel are combined by counting, with
      booking_msr_overlapping_rooms, the guest's confirmed and in-house reservations at the same
      property_code whose nights overlap the nights requested. A new reservation is booked only if
      the count of overlapping rooms plus the room being booked does not exceed the max_rooms_per_stay
      of the rate plan requested. Where the overlapping reservations are on different rate plans, the
      lowest max_rooms_per_stay among those plans and the plan requested applies. A request that
      would exceed the cap is never split across profiles or dates to fit; a request for
      group_referral_min_rooms or more rooms for the same nights is referred to group sales to be
      contracted as a group block, and a smaller excess request is declined.
    eligibility:
      - id: room_cap
        applies_to: [booking_reservation_create]
        kind: authorization
        condition: "A new reservation is booked only if the count of overlapping rooms plus the room being booked does not exceed the max_rooms_per_stay of the rate plan requested."
        evidence_fields: [booking_reservations.customer_id, booking_reservations.property_code, booking_reservations.status, booking_reservations.arrival_date, booking_reservations.departure_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.customer_id, booking_reservations.property_code]
          action_bindings:
            booking_reservations.customer_id: customer_id
            booking_reservations.property_code: property_code
    params:
      group_referral_min_rooms: 10
    measures: [booking_msr_overlapping_rooms]
    formula:
      rooms_after_booking: "booking_msr_overlapping_rooms + 1"
      within_cap: "booking_msr_overlapping_rooms + 1 <= max_rooms_per_stay"

  - id: booking_rate_plan_eligibility
    subject: [booking_reservation_create]
    rule: >-
      Each rate plan is sold only to reservations that meet its entry conditions at the moment of
      booking. When member_only is true, the reservation must carry an Ashbury Rewards membership of
      the same guest. The attached Ashbury Rewards membership must be active when the plan is
      member-only. When direct_channels_only is true, the booking_channel must be brand_website,
      mobile_app, call_center or property_direct. When corporate_code_required is true, the guest must
      quote a corporate client code, recorded verbatim in corporate_client_code. When
      group_code_required is true, the reservation must name a group block whose status is definite,
      and its nights must fall between the block's arrival and departure dates widened by
      shoulder_nights_at_group_rate on each side. The arrival date must fall no fewer than
      min_advance_booking_days calendar days after the booking date, counted back from the
      reservation's arrival date. Days are counted as whole calendar days between the two dates in
      hotel local time; a booking made exactly min_advance_booking_days calendar days before arrival
      qualifies. The arrival date may be no more than max_advance_booking_days calendar days after the
      booking date, and the stay must have at least min_length_of_stay_nights and at most
      max_length_of_stay_nights nights. A plan is not sold at the brands listed in its
      unavailable_at_brands. Combination rules: a reservation carries at most one of a corporate
      client code, a group block and a Reward Night Rate redemption, so a Reward Night Rate
      reservation never names a group block or a corporate client code and a Corporate Negotiated
      Rate reservation never names a group block. Free Night Award nights may appear only when
      certificate_nights_allowed is true. A reservation that fails any of these conditions is not
      booked under that plan; the guest may be offered the Flexible Rate, which has no entry
      condition.
    eligibility:
      - id: member_active
        applies_to: [booking_reservation_create]
        kind: state
        condition: "The attached Ashbury Rewards membership must be active when the plan is member-only."
        evidence_fields: [loyalty_memberships.status, booking_reservations.loyalty_member_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.loyalty_member_id]
          action_bindings:
            booking_reservations.loyalty_member_id: loyalty_member_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
      - id: corporate_code_quoted
        applies_to: [booking_reservation_create]
        kind: caller_fact
        condition: "When corporate_code_required is true, the guest must quote a corporate client code, recorded verbatim in corporate_client_code."
        evidence_fields: [booking_reservations.corporate_client_code]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [booking_reservations.corporate_client_code]
          action_bindings:
            booking_reservations.corporate_client_code: corporate_client_code
      - id: group_block_definite
        applies_to: [booking_reservation_create]
        kind: state
        condition: "When group_code_required is true, the reservation must name a group block whose status is definite, and its nights must fall between the block's arrival and departure dates widened by shoulder_nights_at_group_rate on each side."
        evidence_fields: [group_blocks.status, group_blocks.arrival_date, group_blocks.departure_date, booking_reservations.group_block_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.group_block_id]
          action_bindings:
            booking_reservations.group_block_id: group_block_id
        state_contract:
          field: group_blocks.status
          allowed: [definite]
      - id: advance_booking_days
        applies_to: [booking_reservation_create]
        kind: time
        condition: "The arrival date must fall no fewer than min_advance_booking_days calendar days after the booking date, counted back from the reservation's arrival date."
        evidence_fields: [booking_reservations.arrival_date, booking_reservations.booked_date, booking_reservations.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.customer_id]
          action_bindings:
            booking_reservations.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the reservation's arrival date"
          anchor_source: booking_reservations.arrival_date
          relation: not_after
          duration_source: variants.min_advance_booking_days
          unit: calendar_days
          counting_rule: "Days are counted as whole calendar days between the two dates in hotel local time; a booking made exactly min_advance_booking_days calendar days before arrival qualifies."
          boundary: inclusive

  - id: booking_rate_plan_pricing
    subject: [booking_reservation_create, booking_reservation_modify]
    rule: >-
      The nightly rate of a reservation is fixed at booking from the hotel's Flexible Rate quote for
      the room type and night: the plan's price is the Flexible Rate less discount_off_flexible_pct
      percent, plus package_supplement_per_night_usd, rounded to the cent. Group Block Rate
      reservations take the block's group_rate instead, and Corporate Negotiated Rate reservations
      take the rate of the client agreement, which is never higher than the Flexible Rate less
      discount_off_flexible_pct percent. Reward Night Rate reservations carry a nightly rate of 0.00
      and are paid in points under the Ashbury Rewards award chart or with Free Night Awards. The rate
      covers included_adults adults; each further adult adds extra_adult_charge_per_night_usd per
      night, and children up to children_stay_free_max_age years sharing existing bedding are not
      counted as adults. The nightly_rate recorded on the reservation includes the package supplement
      and the extra-adult charge and excludes tax; tax is applied at the hotel's tax_rate_pct. When
      breakfast_included is true, breakfast_covers_per_night covers are served at the hotel's
      breakfast outlet each morning of the stay and are not billed to the folio. When a reservation is
      changed, nights that are added or moved are priced at the plan's price for the new nights if
      date_change_reprices is true; otherwise the original nightly rate is kept for every night. A
      Group Block Rate reservation keeps the group rate only for nights inside the block dates and the
      shoulder nights; nights beyond them are priced at the Flexible Rate.
    eligibility: []
    formula:
      extra_adults: "max(adults - included_adults, 0)"

  - id: booking_evt_advance_payment
    subject: [booking_deposit_collect]
    rule: >-
      Money is collected before arrival in two cases. When payment_timing is prepaid_at_booking,
      prepayment_pct_of_stay percent of the total room and tax of the stay is charged to the card on
      file at booking and the reservation is guaranteed by full_prepayment. When the reservation's
      property_brand is Ashbury Resort & Spa or Ashbury Reserve and the plan's resort_deposit_nights
      is above zero, a resort advance deposit of resort_deposit_nights nights of room and tax is
      charged at booking and the reservation is guaranteed by advance_deposit instead of the plan's
      default_guarantee_type. At every other brand, and on plans whose resort_deposit_nights is zero,
      nothing is collected before arrival and the reservation keeps the default_guarantee_type. Money
      is collected only for a reservation whose status is confirmed. Each reservation has at most one
      collection; a later change of nights neither collects a second deposit nor refunds part of the
      first. The money collected is held in the reservation's advance deposit until it is refunded,
      retained against a penalty or transferred to the folio at check-in.
    eligibility:
      - id: reservation_confirmed
        applies_to: [booking_deposit_collect]
        kind: state
        condition: "Money is collected only for a reservation whose status is confirmed."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [confirmed]
      - id: single_collection
        applies_to: [booking_deposit_collect]
        kind: dedup
        condition: "Each reservation has at most one collection; a later change of nights neither collects a second deposit nor refunds part of the first."
        evidence_fields: [booking_charges.reservation_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.reservation_id]
          action_bindings:
            booking_charges.reservation_id: reservation_id
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {reservation_id: reservation_id}
          duplicate_filters: {event_type: [booking_deposit_collect]}
          distinct_fields: []
    formula:
      prepayment_amount: "round(nightly_rate * nights * (1 + tax_rate_pct / 100) * prepayment_pct_of_stay / 100, 2)"
      resort_deposit_amount: "round(nightly_rate * resort_deposit_nights * (1 + tax_rate_pct / 100), 2)"

  - id: booking_cancellation_deadline
    subject: [booking_reservation_cancel]
    rule: >-
      A confirmed reservation may be cancelled at the guest's request at any time before arrival; the
      cancellation is recorded at the moment the guest's request is taken, and its timing decides
      every consequence. The effective deadline days are resort_cancellation_deadline_days when the
      reservation's property_brand is Ashbury Resort & Spa or Ashbury Reserve, and
      cancellation_deadline_days at every other brand; the brand recorded on the reservation decides.
      The cancellation is timely only if the moment the guest's cancellation request is recorded is
      not later than the effective cancellation deadline counted back from the reservation's arrival
      date. The effective cancellation deadline is cancellation_deadline_time hotel local time on the
      calendar date obtained by subtracting the effective deadline days, in whole calendar days, from
      the arrival date currently on the reservation; a cancellation recorded exactly at that minute is
      timely. A timely cancellation is recorded with cancellation_timing before_deadline and any other
      with after_deadline. On a plan whose free_cancellation_allowed is false every cancellation is
      recorded after_deadline whatever the clock shows. Reservations booked through an online travel
      agency are cancelled only by that agency and not by guest services. A reservation that is in
      house, checked out, marked a no-show or relocated cannot be cancelled.
    eligibility:
      - id: cancellation_deadline
        applies_to: [booking_reservation_cancel]
        kind: time
        condition: "The cancellation is timely only if the moment the guest's cancellation request is recorded is not later than the effective cancellation deadline counted back from the reservation's arrival date."
        evidence_fields: [booking_reservations.arrival_date, booking_reservations.property_brand, booking_reservations.variant_name, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the reservation's arrival date"
          anchor_source: booking_reservations.arrival_date
          relation: not_after
          duration_source: variants.cancellation_deadline_days
          unit: calendar_days
          counting_rule: "The effective cancellation deadline is cancellation_deadline_time hotel local time on the calendar date obtained by subtracting the effective deadline days, in whole calendar days, from the arrival date currently on the reservation; a cancellation recorded exactly at that minute is timely."
          boundary: inclusive
      - id: direct_booking_channel
        applies_to: [booking_reservation_cancel]
        kind: authorization
        condition: "Reservations booked through an online travel agency are cancelled only by that agency and not by guest services."
        evidence_fields: [booking_reservations.booking_channel, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
    params:
      per_tier:
        "Advance Purchase Non-Refundable Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Semi-Flexible Saver Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Flexible Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Member Flexible Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Bed & Breakfast Package Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Corporate Negotiated Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Group Block Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
        "Reward Night Rate": {free_cancellation: "=free_cancellation_allowed", deadline_days: "=cancellation_deadline_days", resort_deadline_days: "=resort_cancellation_deadline_days", deadline_time: "=cancellation_deadline_time"}
    formula:
      effective_deadline_days: "resort_cancellation_deadline_days if property_brand in ('Ashbury Resort & Spa', 'Ashbury Reserve') else cancellation_deadline_days"

  - id: booking_late_cancellation_penalty
    subject: [booking_cancellation_penalty]
    rule: >-
      A late cancellation penalty is charged only when the reservation's recorded cancellation_timing
      is after_deadline. A penalty is posted only on a reservation whose status is cancelled. The
      penalty basis is the plan's late_cancellation_penalty_basis. Under first_night_room_and_tax the
      penalty is one night at the reservation's nightly rate plus tax at tax_rate_pct; under
      full_stay_room_and_tax it is every night of the stay at the nightly rate plus tax; tax is added
      only when penalty_includes_tax is true. Under first_night_points no cash penalty is charged: the
      points or the Free Night Award paying the first night are retained and the rest of the
      redemption is returned under the Ashbury Rewards and Free Night Award rules. The nightly rate and
      nights are those on the reservation at the moment of cancellation, after any change or Best Rate
      Guarantee adjustment. When the reservation's guarantee is advance_deposit or full_prepayment the
      penalty is settled from the money held, with settlement_source advance_deposit, and any money
      held beyond the penalty is refunded to the card; otherwise the penalty is charged to the card on
      file with settlement_source card_on_file. A reservation carries at most one cancellation penalty
      or no-show charge. A timely cancellation never carries a penalty.
    eligibility:
      - id: late_cancellation_recorded
        applies_to: [booking_cancellation_penalty]
        kind: authorization
        condition: "A late cancellation penalty is charged only when the reservation's recorded cancellation_timing is after_deadline."
        evidence_fields: [booking_reservations.cancellation_timing, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
      - id: reservation_cancelled
        applies_to: [booking_cancellation_penalty]
        kind: state
        condition: "A penalty is posted only on a reservation whose status is cancelled."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [cancelled]
      - id: single_penalty
        applies_to: [booking_cancellation_penalty]
        kind: dedup
        condition: "A reservation carries at most one cancellation penalty or no-show charge."
        evidence_fields: [booking_charges.reservation_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.reservation_id]
          action_bindings:
            booking_charges.reservation_id: reservation_id
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {reservation_id: reservation_id}
          duplicate_filters: {event_type: [booking_cancellation_penalty, booking_no_show_charge]}
          distinct_fields: []
    params:
      per_tier:
        "Advance Purchase Non-Refundable Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Semi-Flexible Saver Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Flexible Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Member Flexible Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Bed & Breakfast Package Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Corporate Negotiated Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Group Block Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
        "Reward Night Rate": {penalty_basis: "=late_cancellation_penalty_basis", tax_added: "=penalty_includes_tax"}
    formula:
      first_night_penalty: "round(nightly_rate * (1 + tax_rate_pct / 100), 2)"
      full_stay_penalty: "round(nightly_rate * nights * (1 + tax_rate_pct / 100), 2)"
      amount: "first_night_penalty if late_cancellation_penalty_basis == 'first_night_room_and_tax' else full_stay_penalty"

  - id: booking_no_show
    subject: [booking_no_show_mark, booking_no_show_charge]
    rule: >-
      A reservation becomes a no-show only when the guest has not checked in by the night audit that
      closes the arrival date. A reservation may be marked a no-show only after the night audit
      following the reservation's arrival date has run without a check-in. The night audit runs at
      no_show_audit_time hotel local time on the calendar day obtained by adding
      no_show_audit_offset_days to the arrival date; a reservation is marked no earlier than that
      moment. Reservations that were cancelled, relocated or checked in are never marked. The no-show
      charge follows the plan's no_show_penalty_basis and is computed exactly as the late cancellation
      penalty: first_night_room_and_tax is one night of room and tax and full_stay_room_and_tax is
      every night of the stay. A no-show charge is posted only on a reservation whose status is
      no_show. When no_show_releases_remaining_nights is true the nights after the first are released
      and not charged; when it is false the whole stay is retained. Under first_night_points no cash is
      charged: the points or Free Night Award of the first night are retained and the rest of the
      redemption is returned. Settlement follows the guarantee as for late cancellations: from the
      money held when the guarantee is advance_deposit or full_prepayment, otherwise to the card on
      file. A reservation carries at most one cancellation penalty or no-show charge. Marking a
      no-show is a hotel action; guest services never marks one.
    eligibility:
      - id: night_audit_passed
        applies_to: [booking_no_show_mark]
        kind: time
        condition: "A reservation may be marked a no-show only after the night audit following the reservation's arrival date has run without a check-in."
        evidence_fields: [booking_reservations.arrival_date, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the reservation's arrival date"
          anchor_source: booking_reservations.arrival_date
          relation: not_before
          duration_source: params.no_show_audit_offset_days
          unit: calendar_days
          counting_rule: "The night audit runs at no_show_audit_time hotel local time on the calendar day obtained by adding no_show_audit_offset_days to the arrival date; a reservation is marked no earlier than that moment."
          boundary: inclusive
      - id: reservation_no_show
        applies_to: [booking_no_show_charge]
        kind: state
        condition: "A no-show charge is posted only on a reservation whose status is no_show."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [no_show]
      - id: single_no_show_charge
        applies_to: [booking_no_show_charge]
        kind: dedup
        condition: "A reservation carries at most one cancellation penalty or no-show charge."
        evidence_fields: [booking_charges.reservation_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.reservation_id]
          action_bindings:
            booking_charges.reservation_id: reservation_id
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {reservation_id: reservation_id}
          duplicate_filters: {event_type: [booking_cancellation_penalty, booking_no_show_charge]}
          distinct_fields: []
    params:
      no_show_audit_offset_days: 1
      no_show_audit_time: "03:00"
    formula:
      amount: "round(nightly_rate * (1 + tax_rate_pct / 100), 2) if no_show_penalty_basis == 'first_night_room_and_tax' else round(nightly_rate * nights * (1 + tax_rate_pct / 100), 2)"

  - id: booking_evt_deposit_settlement
    subject: [booking_deposit_refund, booking_deposit_forfeit, booking_deposit_transfer]
    rule: >-
      Money held for a reservation leaves the advance deposit in one of four ways. On a timely
      cancellation the full amount held is refunded to the card when deposit_refundable_before_deadline
      is true, and retained as a forfeit when it is false. On a late cancellation or a no-show an
      amount equal to the penalty is retained as a forfeit and any amount held beyond the penalty is
      refunded. On a relocation the full amount held is refunded when
      relocation_refunds_advance_payments is true. At check-in whatever is still held is transferred to
      the guest folio as a payment. The amount held is read from booking_msr_deposit_held; no refund,
      forfeit or transfer exceeds it. A refund is made only for a reservation whose status is cancelled
      or relocated. A forfeit is made only for a reservation whose status is cancelled or no_show. A
      transfer is made only for a reservation whose status is in_house. Each collection is refunded at
      most once, and each penalty is settled from held money at most once.
    eligibility:
      - id: refund_state
        applies_to: [booking_deposit_refund]
        kind: state
        condition: "A refund is made only for a reservation whose status is cancelled or relocated."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [cancelled, relocated]
      - id: forfeit_state
        applies_to: [booking_deposit_forfeit]
        kind: state
        condition: "A forfeit is made only for a reservation whose status is cancelled or no_show."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [cancelled, no_show]
      - id: transfer_state
        applies_to: [booking_deposit_transfer]
        kind: state
        condition: "A transfer is made only for a reservation whose status is in_house."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [in_house]
      - id: single_refund
        applies_to: [booking_deposit_refund]
        kind: dedup
        condition: "Each collection is refunded at most once, and each penalty is settled from held money at most once."
        evidence_fields: [booking_charges.related_charge_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.related_charge_id]
          action_bindings:
            booking_charges.related_charge_id: related_charge_id
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {related_charge_id: related_charge_id}
          duplicate_filters: {event_type: [booking_deposit_refund]}
          distinct_fields: []
    measures: [booking_msr_deposit_held]
    formula:
      transfer_amount: "booking_msr_deposit_held"
      refund_after_forfeit: "max(booking_msr_deposit_held - amount, 0)"

  - id: booking_modification
    subject: [booking_reservation_modify]
    rule: >-
      A confirmed reservation may be changed before arrival within the limits of its plan. A
      reservation is changed only while its status is confirmed. Dates may be changed only when
      date_change_allowed is true, the room type only when room_type_change_allowed is true, and the
      reservation may be moved to another guest profile only when name_change_allowed is true; an
      Advance Purchase Non-Refundable Rate reservation therefore stays exactly as booked. The changed
      stay must still meet the plan's length-of-stay and advance-booking limits and, for Group Block
      Rate, fall inside the block dates and shoulder nights; a change that would break them can only be
      made by cancelling under the cancellation rules and booking again. Re-pricing follows
      booking_rate_plan_pricing. When reduction_after_deadline_penalized is true, nights cannot be
      removed once the effective cancellation deadline computed from the arrival date currently on
      the reservation has passed; the guest keeps the reservation as booked or cancels it as a late
      cancellation. Reservations booked through an online travel agency are changed only by that
      agency. A change to a Reward Night Rate reservation re-prices its points nights under the award
      chart, and the points difference is redeemed or redeposited by Ashbury Rewards.
    eligibility:
      - id: reservation_confirmed
        applies_to: [booking_reservation_modify]
        kind: state
        condition: "A reservation is changed only while its status is confirmed."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [confirmed]
      - id: direct_booking_channel
        applies_to: [booking_reservation_modify]
        kind: authorization
        condition: "Reservations booked through an online travel agency are changed only by that agency."
        evidence_fields: [booking_reservations.booking_channel, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id

  - id: booking_best_rate_guarantee
    subject: [booking_rate_guarantee_adjust]
    rule: >-
      When a guest finds the same hotel, room type, dates and occupancy offered to the public at a
      lower rate, the Best Rate Guarantee team may match it. A claim is accepted only on plans whose
      best_rate_guarantee_eligible is true. The claim must be made no later than the end of the
      brg_claim_window_days calendar days following the day the reservation was booked. The window
      closes at 23:59 hotel local time on the calendar date obtained by adding brg_claim_window_days
      whole calendar days to the booked date; a claim made at that minute is accepted. A claim must
      also be made no later than 23:59 hotel local time on the calendar date
      brg_claim_cutoff_days_before_arrival days before the arrival date. The lower rate must undercut
      the reservation's nightly rate by more than brg_min_difference_pct percent, be bookable at the
      time of the claim, and not be a member-only, opaque, package or group rate of another seller.
      When matched, the nightly rate becomes the lower rate less brg_extra_discount_pct percent,
      rounded to the cent, for every night of the reservation, and the adjustment date is recorded. A
      reservation is adjusted at most once and only while its status is confirmed. Guest services does
      not validate competitor rates and never changes a rate under this guarantee; the Best Rate
      Guarantee team's validation is the only basis for an adjustment.
    eligibility:
      - id: claim_window
        applies_to: [booking_rate_guarantee_adjust]
        kind: time
        condition: "The claim must be made no later than the end of the brg_claim_window_days calendar days following the day the reservation was booked."
        evidence_fields: [booking_reservations.booked_date, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the day the reservation was booked"
          anchor_source: booking_reservations.booked_date
          relation: not_after
          duration_source: variants.brg_claim_window_days
          unit: calendar_days
          counting_rule: "The window closes at 23:59 hotel local time on the calendar date obtained by adding brg_claim_window_days whole calendar days to the booked date; a claim made at that minute is accepted."
          boundary: inclusive
      - id: adjusted_once_confirmed
        applies_to: [booking_rate_guarantee_adjust]
        kind: state
        condition: "A reservation is adjusted at most once and only while its status is confirmed."
        evidence_fields: [booking_reservations.status, booking_reservations.rate_guarantee_date, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [confirmed]
    params:
      brg_min_difference_pct: 1

  - id: booking_evt_penalty_reversal
    subject: [booking_penalty_reversal]
    rule: >-
      A cancellation penalty or no-show charge is reversed only for one of three recorded reasons, and
      each reversal names the single original charge it reverses. A reversal is posted only on a
      reservation whose status is cancelled or no_show. The original charge must be a
      booking_cancellation_penalty or booking_no_show_charge recorded on the same reservation.
      duplicate_reservation applies when the charged reservation duplicates another reservation of
      the same guest at the same property_code with the same arrival and departure dates, booked on
      the same booked date, and that other reservation was checked in; the whole charge is reversed.
      deadline_misapplied applies when a late cancellation penalty sits on a reservation whose
      cancelled_at is not later than the effective cancellation deadline under
      booking_cancellation_deadline; the whole charge is reversed. penalty_basis_misapplied applies
      when the amount charged exceeds the amount the plan's penalty basis yields for the reservation;
      only the excess is reversed. Each original charge is reversed at most once, and the amount
      reversed never exceeds booking_msr_net_penalty_charged. Illness, travel disruption, weather,
      flight cancellations, bereavement and changes of plan are not reasons under this policy, and
      guest services does not waive or reduce a penalty for them.
    eligibility:
      - id: reservation_charged_state
        applies_to: [booking_penalty_reversal]
        kind: state
        condition: "A reversal is posted only on a reservation whose status is cancelled or no_show."
        evidence_fields: [booking_reservations.status, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        state_contract:
          field: booking_reservations.status
          allowed: [cancelled, no_show]
      - id: original_charge_exists
        applies_to: [booking_penalty_reversal]
        kind: authorization
        condition: "The original charge must be a booking_cancellation_penalty or booking_no_show_charge recorded on the same reservation."
        evidence_fields: [booking_charges.charge_id, booking_charges.event_type, booking_charges.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.charge_id]
          action_bindings:
            booking_charges.charge_id: related_charge_id
      - id: single_reversal
        applies_to: [booking_penalty_reversal]
        kind: dedup
        condition: "Each original charge is reversed at most once, and the amount reversed never exceeds booking_msr_net_penalty_charged."
        evidence_fields: [booking_charges.related_charge_id, booking_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_charges.related_charge_id]
          action_bindings:
            booking_charges.related_charge_id: related_charge_id
        dedup_contract:
          table: booking_charges
          mode: separate_record
          object_bindings: {related_charge_id: related_charge_id}
          duplicate_filters: {event_type: [booking_penalty_reversal]}
          distinct_fields: []
    measures: [booking_msr_net_penalty_charged]
    formula:
      reversal_cap: "booking_msr_net_penalty_charged"

  - id: booking_arrival_and_departure
    subject: [booking_check_in, booking_check_out]
    rule: >-
      Check-in and check-out are recorded by the hotel's front desk. Check-in is recorded only on or
      after the reservation's arrival date. The check-in date is compared with the arrival date as
      calendar dates in hotel local time; check-in on the arrival date itself is allowed. At check-in
      the folio of the stay is opened under the hotel's brand, any money held for the reservation is
      transferred to it as a payment, and Free Night Awards applied to the reservation are redeemed.
      Check-out may happen on the scheduled departure date or earlier; a check-out before the
      departure date is an early departure, and the nights stayed are the nights between the actual
      check-in and actual check-out dates. At check-out, when the reservation carries an Ashbury
      Rewards membership, elite night credits are posted for the nights stayed when
      counts_toward_elite_nights is true and points are posted when earns_base_points is true, with
      the elite bonus when earns_elite_bonus_points is true. A reservation booked through an online
      travel agency earns nothing unless ota_booking_earns is true, and one booked through
      travel_agency_gds earns only when gds_booking_earns is true; elite on-property benefits are not
      honoured on online travel agency reservations unless ota_booking_elite_benefits is true. Guest
      services cannot check a guest in or out.
    eligibility:
      - id: arrival_reached
        applies_to: [booking_check_in]
        kind: time
        condition: "Check-in is recorded only on or after the reservation's arrival date."
        evidence_fields: [booking_reservations.arrival_date, booking_reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [booking_reservations.reservation_id]
          action_bindings:
            booking_reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the reservation's arrival date"
          anchor_source: booking_reservations.arrival_date
          relation: not_before
          duration_source: params.check_in_offset_days
          unit: calendar_days
          counting_rule: "The check-in date is compared with the arrival date as calendar dates in hotel local time; check-in on the arrival date itself is allowed."
          boundary: inclusive
    params:
      check_in_offset_days: 0

  - id: booking_relocation
    subject: [booking_relocate]
    rule: >-
      When a hotel cannot provide a guaranteed reservation on the arrival date it relocates the guest
      to a comparable hotel nearby. A relocated reservation is never charged a cancellation penalty or
      no-show charge. When relocation_first_night_paid is true the hotel pays the first night at the
      alternate hotel directly, and that payment does not pass through the guest's records.
      Prepayments and advance deposits held are refunded in full when
      relocation_refunds_advance_payments is true, points redeemed are returned in full, and Free
      Night Awards applied are released back to the member's account. When the reservation carries an
      Ashbury Rewards membership and relocation_compensation_eligible is true, relocation compensation
      points are posted under the Ashbury Rewards relocation compensation rule. Relocation is
      recorded by the hotel; guest services never relocates a reservation and adds no compensation
      beyond these rules.
    eligibility: []

# ============================================================================
# extended_policies (reservation_cancellations_and_no_shows)
# ============================================================================
extended_policies:
  - id: booking_ext_capacity_room_move
    base_policy_refs: [booking_modification, booking_rate_plan_pricing]
    overwrite:
      - base_policy: booking_modification
        superseded_clause: >-
          Re-pricing follows booking_rate_plan_pricing.
        replaced_by: >-
          The new nightly rate is the nightly rate on the reservation plus the move supplement, rounded to the cent.
    trigger: state_due
    subject: [booking_reservation_modify]
    computes: nightly_rate
    target_tool: move_reservation_room_563d533b
    params:
      sleeps_standard_king: 2
      sleeps_deluxe_king: 2
      sleeps_standard_two_queens: 4
      sleeps_junior_suite: 4
      sleeps_one_bedroom_suite: 6
      move_diff_standard_king: 0.00
      move_diff_standard_two_queens: 40.00
      move_diff_deluxe_king: 55.00
      move_diff_junior_suite: 120.00
      move_diff_one_bedroom_suite: 210.00
      close_in_days: 14
      lead_mult_close: 1.50
      lead_mult_advance: 1.25
      lead_mult_standard: 1.00
      top_nights: 50
      mid_nights: 25
      elite_upgrade_top: 0.50
      elite_upgrade_mid: 0.30
      elite_upgrade_none: 0.00
      club_rate_family: 0.70
      club_rate_other: 0.85
      club_rate_none: 1.00
      card_credit_premier: 10.00
      card_credit_standard: 5.00
      card_credit_none: 0.00
      week_nights: 7
      long_stay_min: 5
      advance_days: 120
    rule: >
      When the adults registered on a confirmed reservation are more than its room type sleeps, the
      reservation is moved to the lowest-priced room type that sleeps them, each room type sleeping the
      number of adults the room-type capacity schedule gives it and being priced by its published move
      differential. A move is made only on a confirmed reservation whose plan allows room-type changes
      and that was not booked through an online travel agency; it changes the room type and the nightly
      rate and nothing else. The move supplement is the published differential of the new room type
      less that of the room type it leaves, charged on every night at the plan's share of the Flexible
      Rate, that is reduced by the plan's discount off the Flexible Rate. A move never lowers the nightly
      rate: where the new room type's differential is below that of the room type it leaves, no
      differential is charged. The new nightly rate is the
      nightly rate on the reservation plus the move supplement, rounded to the cent. When the arrival
      night is in the peak season and the move is recorded no more than the close-in days before
      arrival, the differential is raised by the close-in multiplier; when the arrival night is in the
      peak season and the move is recorded more than the close-in days before arrival, or the arrival
      night is in the standard season and the move is recorded no more than the close-in days before
      arrival, it is raised by the advance multiplier; in every other case the published differential
      is charged at the standard multiplier. A guest whose attached Ashbury Rewards membership holds
      the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night
      credits in the current year receives the top elite upgrade discount on the differential; one
      whose membership holds the Platinum Elite or Gold Elite tier with at least the middle night
      threshold of elite night credits receives the middle elite upgrade discount; any other guest
      receives no elite upgrade discount. When the guest holds an active Family Resort Club or Founders
      Resort Club membership at the same resort, the differential is charged at the family club rate;
      an active membership of any other level at that resort is charged at the club rate; a guest with
      no active club membership at that resort pays the full club-free rate. A guest whose attached
      membership has the Ashbury Rewards Premier card linked has the premier card credit taken off the
      supplement of each night; one with the Ashbury Rewards card linked has the card credit taken off;
      a guest with no co-brand card linked has no credit taken off. For a stay of at least a week of
      nights, the supplement is charged on the nights left after one free night for every full week,
      spread evenly over all nights of the stay; for a stay of at least the long-stay minimum but less
      than a week that was booked at least the advance-booking days before arrival, it is charged on
      every night but one, spread evenly over all nights of the stay; any other stay pays the supplement
      on every night. The differential is first multiplied by the season multiplier, that result by the
      club rate, that result by one less the elite upgrade discount and that result by the share of
      nights charged; the card credit is then taken off that result, never below zero, and only then is
      the result reduced by the plan's discount off the Flexible Rate; rounding to the cent happens
      once, on the new nightly rate.
    prerequisite: []
    cross_category:
      - category: loyalty
        as: branch
        reads: [variant_name, elite_night_credits, cobrand_card]
        note: The elite upgrade discount reads the tier and this year's elite night credits, the card credit reads the linked co-brand card of the attached membership.
      - category: club
        as: branch
        reads: [variant_name, status]
        note: The club rate reads the level and status of the guest's Resort Club membership at the same resort.
    compute:
      - adults_now: "F('adults')"
      - new_diff: "K('move_diff_standard_king') if adults_now <= K('sleeps_standard_king') else (K('move_diff_standard_two_queens') if adults_now <= K('sleeps_standard_two_queens') else K('move_diff_one_bedroom_suite'))"
      - old_diff: "K('move_diff_standard_king') if F('room_type') == 'standard_king' else (K('move_diff_standard_two_queens') if F('room_type') == 'standard_two_queens' else (K('move_diff_deluxe_king') if F('room_type') == 'deluxe_king' else (K('move_diff_junior_suite') if F('room_type') == 'junior_suite' else K('move_diff_one_bedroom_suite'))))"
      - gross_diff: "MX(new_diff - old_diff, 0)"
      - days_to_arrival: "DAYS(NOW, F('arrival_date'))"
      - season_mult: "K('lead_mult_close') if (F('award_season') == 'peak' and days_to_arrival <= K('close_in_days')) else (K('lead_mult_advance') if ((F('award_season') == 'peak' and days_to_arrival > K('close_in_days')) or (F('award_season') == 'standard' and days_to_arrival <= K('close_in_days'))) else K('lead_mult_standard'))"
      - tier_name: "CFIELD('loyalty', 'variant_name', loyalty_member_id=F('loyalty_member_id'))"
      - tier_nights: "CFIELD('loyalty', 'elite_night_credits', loyalty_member_id=F('loyalty_member_id'))"
      - elite_disc: "K('elite_upgrade_top') if ((tier_name == 'Ashbury Rewards Titanium Elite' or tier_name == 'Ashbury Rewards Ambassador Elite') and tier_nights >= K('top_nights')) else (K('elite_upgrade_mid') if ((tier_name == 'Ashbury Rewards Platinum Elite' or tier_name == 'Ashbury Rewards Gold Elite') and tier_nights >= K('mid_nights')) else K('elite_upgrade_none'))"
      - club_level: "CFIELD('club', 'variant_name', property_code=F('property_code'))"
      - club_status: "CFIELD('club', 'status', property_code=F('property_code'))"
      - club_rate: "K('club_rate_family') if (club_status == 'active' and (club_level == 'Family Resort Club Membership' or club_level == 'Founders Resort Club Membership')) else (K('club_rate_other') if (club_status == 'active' and club_level != None) else K('club_rate_none'))"
      - linked_card: "CFIELD('loyalty', 'cobrand_card', loyalty_member_id=F('loyalty_member_id'))"
      - card_credit: "K('card_credit_premier') if linked_card == 'ashbury_rewards_premier_card' else (K('card_credit_standard') if linked_card == 'ashbury_rewards_card' else K('card_credit_none'))"
      - share_stay: "DAYS(F('arrival_date'), F('departure_date'))"
      - share_lead: "DAYS(F('booked_date'), F('arrival_date'))"
      - night_share: "(share_stay - int(share_stay / K('week_nights'))) / share_stay if share_stay >= K('week_nights') else ((share_stay - 1) / share_stay if (share_stay >= K('long_stay_min') and share_lead >= K('advance_days')) else 1)"
      - supplement: "MX(gross_diff * season_mult * club_rate * (1 - elite_disc) * night_share - card_credit, 0) * (1 - P('discount_off_flexible_pct') / 100)"
      - result: "RND(F('nightly_rate') + supplement, 2)"
    compute_basis:
      new_diff: "When the adults registered on a confirmed reservation are more than its room type sleeps, the reservation is moved to the lowest-priced room type that sleeps them, each room type sleeping the number of adults the room-type capacity schedule gives it and being priced by its published move differential."
      old_diff: "The move supplement is the published differential of the new room type less that of the room type it leaves, charged on every night at the plan's share of the Flexible Rate, that is reduced by the plan's discount off the Flexible Rate."
      gross_diff: "A move never lowers the nightly rate: where the new room type's differential is below that of the room type it leaves, no differential is charged."
      days_to_arrival: "When the arrival night is in the peak season and the move is recorded no more than the close-in days before arrival, the differential is raised by the close-in multiplier;"
      season_mult: "When the arrival night is in the peak season and the move is recorded no more than the close-in days before arrival, the differential is raised by the close-in multiplier; when the arrival night is in the peak season and the move is recorded more than the close-in days before arrival, or the arrival night is in the standard season and the move is recorded no more than the close-in days before arrival, it is raised by the advance multiplier; in every other case the published differential is charged at the standard multiplier."
      tier_name: "A guest whose attached Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night credits in the current year receives the top elite upgrade discount on the differential;"
      tier_nights: "A guest whose attached Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night credits in the current year receives the top elite upgrade discount on the differential;"
      elite_disc: "A guest whose attached Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night credits in the current year receives the top elite upgrade discount on the differential; one whose membership holds the Platinum Elite or Gold Elite tier with at least the middle night threshold of elite night credits receives the middle elite upgrade discount; any other guest receives no elite upgrade discount."
      club_level: "When the guest holds an active Family Resort Club or Founders Resort Club membership at the same resort, the differential is charged at the family club rate;"
      club_status: "When the guest holds an active Family Resort Club or Founders Resort Club membership at the same resort, the differential is charged at the family club rate;"
      club_rate: "When the guest holds an active Family Resort Club or Founders Resort Club membership at the same resort, the differential is charged at the family club rate; an active membership of any other level at that resort is charged at the club rate; a guest with no active club membership at that resort pays the full club-free rate."
      linked_card: "A guest whose attached membership has the Ashbury Rewards Premier card linked has the premier card credit taken off the supplement of each night;"
      card_credit: "A guest whose attached membership has the Ashbury Rewards Premier card linked has the premier card credit taken off the supplement of each night; one with the Ashbury Rewards card linked has the card credit taken off; a guest with no co-brand card linked has no credit taken off."
      share_stay: "For a stay of at least a week of nights, the supplement is charged on the nights left after one free night for every full week, spread evenly over all nights of the stay;"
      share_lead: "for a stay of at least the long-stay minimum but less than a week that was booked at least the advance-booking days before arrival, it is charged on every night but one, spread evenly over all nights of the stay;"
      night_share: "For a stay of at least a week of nights, the supplement is charged on the nights left after one free night for every full week, spread evenly over all nights of the stay; for a stay of at least the long-stay minimum but less than a week that was booked at least the advance-booking days before arrival, it is charged on every night but one, spread evenly over all nights of the stay; any other stay pays the supplement on every night."
      supplement: "The differential is first multiplied by the season multiplier, that result by the club rate, that result by one less the elite upgrade discount and that result by the share of nights charged; the card credit is then taken off that result, never below zero, and only then is the result reduced by the plan's discount off the Flexible Rate; rounding to the cent happens once, on the new nightly rate."
      result: "The new nightly rate is the nightly rate on the reservation plus the move supplement, rounded to the cent."
    factors:
      - id: season_lead_multiplier
        effect: parameter
        decides: season_mult
        bindings: [days_to_arrival, season_mult]
        ladder:
          - when: "the arrival night is in the peak season and the move is recorded no more than the close-in days before arrival"
            value: "K('lead_mult_close')"
          - when: "the arrival night is in the peak season and the move is recorded more than the close-in days before arrival, or the arrival night is in the standard season and the move is recorded no more than the close-in days before arrival"
            value: "K('lead_mult_advance')"
          - when: "otherwise"
            value: "K('lead_mult_standard')"
        baseline:
          season_mult: "K('lead_mult_standard')"
        evidence: [date]
        cross_difficulty: null
      - id: elite_upgrade_discount
        effect: parameter
        decides: elite_disc
        bindings: [tier_name, tier_nights, elite_disc]
        ladder:
          - when: "the attached membership holds the Titanium Elite or Ambassador Elite tier and has at least the top night threshold of elite night credits this year"
            value: "K('elite_upgrade_top')"
          - when: "the attached membership holds the Platinum Elite or Gold Elite tier and has at least the middle night threshold of elite night credits this year"
            value: "K('elite_upgrade_mid')"
          - when: "otherwise"
            value: "K('elite_upgrade_none')"
        baseline:
          elite_disc: "K('elite_upgrade_none')"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: club_upgrade_rate
        effect: parameter
        decides: club_rate
        bindings: [club_level, club_status, club_rate]
        ladder:
          - when: "the guest's Resort Club membership at the same resort is active and is a Family Resort Club or Founders Resort Club membership"
            value: "K('club_rate_family')"
          - when: "the guest's Resort Club membership at the same resort is active and is of any other level"
            value: "K('club_rate_other')"
          - when: "otherwise"
            value: "K('club_rate_none')"
        baseline:
          club_rate: "K('club_rate_none')"
        evidence: [cross_category]
        cross_difficulty: club
      - id: card_upgrade_credit
        effect: parameter
        decides: card_credit
        bindings: [linked_card, card_credit]
        ladder:
          - when: "the attached membership has the Ashbury Rewards Premier card linked"
            value: "K('card_credit_premier')"
          - when: "the attached membership has the Ashbury Rewards card linked"
            value: "K('card_credit_standard')"
          - when: "otherwise"
            value: "K('card_credit_none')"
        baseline:
          card_credit: "K('card_credit_none')"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: supplement_night_share
        effect: method
        decides: night_share
        bindings: [share_stay, share_lead, night_share]
        ladder:
          - when: "the stay is at least a week of nights"
            method: "the supplement is charged on the nights left after one free night for every full week, spread evenly over all nights"
          - when: "the stay is at least the long-stay minimum but less than a week and was booked at least the advance-booking days before arrival"
            method: "the supplement is charged on every night but one, spread evenly over all nights"
          - when: "otherwise"
            method: "the supplement is charged on every night"
        baseline:
          night_share: "1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        When the adults registered on a confirmed reservation are more than its room type sleeps, the reservation is moved to the lowest-priced room type that sleeps them, each room type sleeping the number of adults the room-type capacity schedule gives it and being priced by its published move differential. The move supplement is the published differential of the new room type less that of the room type it leaves, charged on every night at the plan's share of the Flexible Rate, that is reduced by the plan's discount off the Flexible Rate. A move never lowers the nightly rate: where the new room type's differential is below that of the room type it leaves, no differential is charged. The new nightly rate is the nightly rate on the reservation plus the move supplement, rounded to the cent.
      params: [move_diff_standard_king, move_diff_standard_two_queens, move_diff_deluxe_king, move_diff_junior_suite, move_diff_one_bedroom_suite, sleeps_standard_king, sleeps_deluxe_king, sleeps_standard_two_queens, sleeps_junior_suite, sleeps_one_bedroom_suite, discount_off_flexible_pct]
    inputs:
      history: []
      cross_category: [loyalty, club]

  - id: booking_ext_extra_person_reprice
    base_policy_refs: [booking_modification, booking_rate_plan_pricing]
    overwrite:
      - base_policy: booking_rate_plan_pricing
        superseded_clause: >-
          The rate covers included_adults adults; each further adult adds extra_adult_charge_per_night_usd per night, and children up to children_stay_free_max_age years sharing existing bedding are not counted as adults.
        replaced_by: >-
          The extra-person charge for one night is the plan's extra-adult charge for every adult registered beyond the adults the plan's rate covers, on every night of the stay.
    trigger: state_due
    subject: [booking_reservation_modify]
    computes: nightly_rate
    target_tool: reprice_extra_persons_22837316
    params:
      long_stay_nights: 5
      peak_long_supplement: 15.00
      season_mid_supplement: 7.00
      club_guest_cover: 1
      club_cover_none: 0
      frequent_stays: 6
      regular_stays: 3
      frequent_share: 0.40
      regular_share: 0.20
      stay_share_none: 0.00
      week_nights: 7
      advance_days: 120
    rule: >
      A reservation whose adults were raised in the mobile app or on the brand website keeps the
      double-occupancy nightly rate of its room type until guest services adds the extra-person charge
      for the adults beyond those the plan's rate covers; the charge is added only on a confirmed
      reservation not booked through an online travel agency, and only the nightly rate changes. The
      extra-person charge is added to the nightly rate only after the room type on the reservation
      sleeps every adult registered on it. The extra-person charge for one night is the plan's
      extra-adult charge for every adult registered beyond the adults the plan's rate covers, on every
      night of the stay. The new nightly rate is the nightly rate on the reservation plus the
      extra-person charge for one night, rounded to the cent. When the arrival night is in the peak
      season and the stay is at least the long-stay nights, each charged adult pays the plan's extra-adult charge plus the peak long-stay supplement; when the arrival night is in the peak season and
      the stay is shorter, or the arrival night is in the standard season and the stay is at least the
      long-stay nights, each charged adult pays the plan's extra-adult charge plus the mid-season supplement; any other stay pays the plan's extra-adult charge alone. When the guest holds an active Family Resort Club or Founders Resort Club
      membership at the same resort, as many of the adults beyond those the rate covers as the
      membership registers dependants are not charged; an active membership of any other level at that
      resort leaves one such adult uncharged as the member's guest; without an active club membership at
      that resort no adult is left uncharged. A guest whose Ashbury Rewards account shows at least the frequent number of stays credited in the twelve months before the day of handling, each stay night-credit posting counting as one stay whatever its nights and a posting dated on or before the same calendar date twelve months earlier being outside them, pays the charge less the frequent-guest share; one whose account shows at least the regular number of such stays pays it less the regular-guest share; any other guest pays it in full. For a stay of at least a week of nights,
      the charge is collected on the nights left after one free night for every full week, spread
      evenly over all nights of the stay; for a stay of at least the long-stay nights but less than a
      week that was booked at least the advance-booking days before arrival, it is collected on every
      night but one, spread evenly over all nights of the stay; any other stay pays it on every night.
      The adults left uncharged are first taken off the adults beyond those the rate covers, never
      below zero; the remaining adults are then multiplied by the per-adult charge, that result by one
      less the stay share and that result by the share of nights charged, and the result is added to
      the nightly rate on the reservation; rounding to the cent happens once, on the new nightly rate.
    prerequisite:
      - problem: booking_ext_capacity_room_move
        kind: value_input
        gate: room_rate
        form: state
        policy_source: >-
          The extra-person charge is added to the nightly rate only after the room type on the reservation sleeps every adult registered on it.
        condition: >-
          booking_reservations.room_type of the reservation is a room type whose capacity in the room-type capacity schedule is at least booking_reservations.adults.
        resolved_by: move_reservation_room_563d533b
        effect: >-
          The nightly rate the extra-person charge is added to becomes the double-occupancy rate of the room type that sleeps the adults, so the room_rate binding takes the moved rate instead of the rate of the room type that cannot hold them.
    cross_category:
      - category: club
        as: branch
        reads: [variant_name, status, family_members]
        note: The adults left uncharged read the level, status and registered dependants of the guest's Resort Club membership at the same resort.
      - category: loyalty
        as: history
        reads: [loyalty_transactions.event_type, loyalty_transactions.posted_date]
        note: The stay share counts the stays credited (stay night-credit postings) on the guest's Ashbury Rewards account in the twelve months before the day of handling.
    compute:
      - room_rate: "F('nightly_rate')"
      - extra_adults: "MX(F('adults') - P('included_adults'), 0)"
      - charge_stay: "DAYS(F('arrival_date'), F('departure_date'))"
      - adult_charge: "P('extra_adult_charge_per_night_usd') + K('peak_long_supplement') if (F('award_season') == 'peak' and charge_stay >= K('long_stay_nights')) else (P('extra_adult_charge_per_night_usd') + K('season_mid_supplement') if ((F('award_season') == 'peak' and charge_stay < K('long_stay_nights')) or (F('award_season') == 'standard' and charge_stay >= K('long_stay_nights'))) else P('extra_adult_charge_per_night_usd'))"
      - club_level: "CFIELD('club', 'variant_name', property_code=F('property_code'))"
      - club_status: "CFIELD('club', 'status', property_code=F('property_code'))"
      - club_dependants: "CFIELD('club', 'family_members', property_code=F('property_code'))"
      - uncharged: "MN(extra_adults, club_dependants) if (club_status == 'active' and (club_level == 'Family Resort Club Membership' or club_level == 'Founders Resort Club Membership')) else (MN(extra_adults, K('club_guest_cover')) if (club_status == 'active' and club_level != None) else K('club_cover_none'))"
      - stay_credits: "XCOUNT('loyalty', 'loyalty_transactions', within_months=12, date_field='posted_date', event_type='loyalty_night_credit', earning_source='stay_nights')"
      - stay_share: "K('frequent_share') if stay_credits >= K('frequent_stays') else (K('regular_share') if stay_credits >= K('regular_stays') else K('stay_share_none'))"
      - share_stay: "DAYS(F('arrival_date'), F('departure_date'))"
      - share_lead: "DAYS(F('booked_date'), F('arrival_date'))"
      - night_share: "(share_stay - int(share_stay / K('week_nights'))) / share_stay if share_stay >= K('week_nights') else ((share_stay - 1) / share_stay if (share_stay >= K('long_stay_nights') and share_lead >= K('advance_days')) else 1)"
      - charged_adults: "MX(extra_adults - uncharged, 0)"
      - extra_per_night: "charged_adults * adult_charge * (1 - stay_share) * night_share"
      - result: "RND(room_rate + extra_per_night, 2)"
    compute_basis:
      room_rate: "The new nightly rate is the nightly rate on the reservation plus the extra-person charge for one night, rounded to the cent."
      extra_adults: "The extra-person charge for one night is the plan's extra-adult charge for every adult registered beyond the adults the plan's rate covers, on every night of the stay."
      charge_stay: "When the arrival night is in the peak season and the stay is at least the long-stay nights, each charged adult pays the plan's extra-adult charge plus the peak long-stay supplement;"
      adult_charge: "When the arrival night is in the peak season and the stay is at least the long-stay nights, each charged adult pays the plan's extra-adult charge plus the peak long-stay supplement; when the arrival night is in the peak season and the stay is shorter, or the arrival night is in the standard season and the stay is at least the long-stay nights, each charged adult pays the plan's extra-adult charge plus the mid-season supplement; any other stay pays the plan's extra-adult charge alone."
      club_level: "When the guest holds an active Family Resort Club or Founders Resort Club membership at the same resort, as many of the adults beyond those the rate covers as the membership registers dependants are not charged;"
      club_status: "When the guest holds an active Family Resort Club or Founders Resort Club membership at the same resort, as many of the adults beyond those the rate covers as the membership registers dependants are not charged;"
      club_dependants: "When the guest holds an active Family Resort Club or Founders Resort Club membership at the same resort, as many of the adults beyond those the rate covers as the membership registers dependants are not charged;"
      uncharged: "When the guest holds an active Family Resort Club or Founders Resort Club membership at the same resort, as many of the adults beyond those the rate covers as the membership registers dependants are not charged; an active membership of any other level at that resort leaves one such adult uncharged as the member's guest; without an active club membership at that resort no adult is left uncharged."
      stay_credits: "A guest whose Ashbury Rewards account shows at least the frequent number of stays credited in the twelve months before the day of handling, each stay night-credit posting counting as one stay whatever its nights and a posting dated on or before the same calendar date twelve months earlier being outside them, pays the charge less the frequent-guest share;"
      stay_share: "A guest whose Ashbury Rewards account shows at least the frequent number of stays credited in the twelve months before the day of handling, each stay night-credit posting counting as one stay whatever its nights and a posting dated on or before the same calendar date twelve months earlier being outside them, pays the charge less the frequent-guest share; one whose account shows at least the regular number of such stays pays it less the regular-guest share; any other guest pays it in full."
      share_stay: "For a stay of at least a week of nights, the charge is collected on the nights left after one free night for every full week, spread evenly over all nights of the stay;"
      share_lead: "for a stay of at least the long-stay nights but less than a week that was booked at least the advance-booking days before arrival, it is collected on every night but one, spread evenly over all nights of the stay;"
      night_share: "For a stay of at least a week of nights, the charge is collected on the nights left after one free night for every full week, spread evenly over all nights of the stay; for a stay of at least the long-stay nights but less than a week that was booked at least the advance-booking days before arrival, it is collected on every night but one, spread evenly over all nights of the stay; any other stay pays it on every night."
      charged_adults: "The adults left uncharged are first taken off the adults beyond those the rate covers, never below zero;"
      extra_per_night: "the remaining adults are then multiplied by the per-adult charge, that result by one less the stay share and that result by the share of nights charged, and the result is added to the nightly rate on the reservation; rounding to the cent happens once, on the new nightly rate."
      result: "The new nightly rate is the nightly rate on the reservation plus the extra-person charge for one night, rounded to the cent."
    factors:
      - id: extra_person_season_charge
        effect: parameter
        decides: adult_charge
        bindings: [charge_stay, adult_charge]
        ladder:
          - when: "the arrival night is in the peak season and the stay is at least the long-stay nights"
            value: "P('extra_adult_charge_per_night_usd') + K('peak_long_supplement')"
          - when: "the arrival night is in the peak season and the stay is shorter than the long-stay nights, or the arrival night is in the standard season and the stay is at least the long-stay nights"
            value: "P('extra_adult_charge_per_night_usd') + K('season_mid_supplement')"
          - when: "otherwise"
            value: "P('extra_adult_charge_per_night_usd')"
        baseline:
          adult_charge: "P('extra_adult_charge_per_night_usd')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: club_dependant_cover
        effect: parameter
        decides: uncharged
        bindings: [club_level, club_status, club_dependants, uncharged]
        ladder:
          - when: "the guest's Resort Club membership at the same resort is active and is a Family Resort Club or Founders Resort Club membership"
            value: "as many charged adults as the membership registers dependants"
          - when: "the guest's Resort Club membership at the same resort is active and is of any other level"
            value: "K('club_guest_cover')"
          - when: "otherwise"
            value: "K('club_cover_none')"
        baseline:
          uncharged: "K('club_cover_none')"
        evidence: [cross_category]
        cross_difficulty: club
      - id: frequent_guest_share
        effect: parameter
        decides: stay_share
        bindings: [stay_credits, stay_share]
        ladder:
          - when: "the guest's Ashbury Rewards account shows at least the frequent number of stays credited in the twelve months before the day of handling (stay night-credit postings, a posting on or before the same date twelve months earlier excluded)"
            value: "K('frequent_share')"
          - when: "it shows at least the regular number of such stays but fewer than the frequent number"
            value: "K('regular_share')"
          - when: "otherwise"
            value: "K('stay_share_none')"
        baseline:
          stay_share: "K('stay_share_none')"
        evidence: [history, cross_category]
        cross_difficulty: loyalty
      - id: extra_person_night_share
        effect: method
        decides: night_share
        bindings: [share_stay, share_lead, night_share]
        ladder:
          - when: "the stay is at least a week of nights"
            method: "the charge is collected on the nights left after one free night for every full week, spread evenly over all nights"
          - when: "the stay is at least the long-stay nights but less than a week and was booked at least the advance-booking days before arrival"
            method: "the charge is collected on every night but one, spread evenly over all nights"
          - when: "otherwise"
            method: "the charge is collected on every night"
        baseline:
          night_share: "1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The extra-person charge for one night is the plan's extra-adult charge for every adult registered beyond the adults the plan's rate covers, on every night of the stay. The new nightly rate is the nightly rate on the reservation plus the extra-person charge for one night, rounded to the cent.
      params: [included_adults, extra_adult_charge_per_night_usd]
    inputs:
      history:
        - {category: loyalty, table: loyalty_transactions, aggregate: count, field: transaction_id, within_months: 12, filters: {event_type: loyalty_night_credit, earning_source: stay_nights}}
      cross_category: [club, loyalty]

  - id: booking_ext_deposit_topup
    base_policy_refs: [booking_evt_advance_payment]
    overwrite:
      - base_policy: booking_evt_advance_payment
        superseded_clause: >-
          Each reservation has at most one collection; a later change of nights neither collects a second deposit nor refunds part of the first.
        replaced_by: >-
          When a change raises the nightly rate of a confirmed resort reservation guaranteed by an advance deposit, the deposit the reservation requires is worked out again and the part of it the money held does not cover is collected from the guest's card as a further deposit; money already held is never refunded by this rule.
    trigger: state_due
    subject: [booking_deposit_collect]
    computes: amount
    target_tool: pay_deposit_topup_8cd35ccc
    params:
      peak_long_stay: 6
      peak_deposit_nights: 2
      short_stay_nights: 3
      offpeak_short_deposit_nights: 0
      cap_min_stay: 6
      cap_lead_days: 120
      cap_long_stay: 10
      pct_cap_advance: 0.25
      pct_cap_long: 0.20
      top_nights: 50
      mid_nights: 25
      elite_relief_top: 0.50
      elite_relief_mid: 0.20
      elite_relief_none: 0.00
      club_relief_family: 0.25
      club_relief_other: 0.10
      club_relief_none: 0.00
    rule: >
      When a change raises the nightly rate of a confirmed resort reservation guaranteed by an advance
      deposit, the deposit the reservation requires is worked out again and the part of it the money
      held does not cover is collected from the guest's card as a further deposit; money already held
      is never refunded by this rule. The money held is every deposit collected for the reservation less
      every refund, forfeit and transfer of deposit money posted on it. The deposit the reservation
      requires is the plan's resort deposit nights of the nightly rate on the reservation, with room tax
      added at the hotel's tax rate. The further deposit is the deposit the reservation requires less
      the money held, never below zero, rounded to the cent. A further deposit is collected only on a
      reservation whose status is confirmed, and it is the guest who pays it with the card on file. No
      further advance deposit is collected until the extra-person charge for every adult beyond those
      the nightly rate covers has been added to the reservation's nightly rate. An additional deposit is collected only after each late cancellation penalty kept from money held on another reservation of the same guest at the same hotel for overlapping nights, where it exceeds the penalty that cancellation owes, carries a penalty reversal entry naming it. When the
      arrival night is in the peak season and the stay is at least the peak long-stay nights, the
      deposit covers the peak deposit nights instead of the plan's resort deposit nights; when the
      arrival night is in the off-peak season and the stay is shorter than the short-stay nights, it
      covers the off-peak short-stay deposit nights; any other stay keeps the plan's resort deposit
      nights. For a stay of at least the cap minimum nights booked at least the cap lead days before
      arrival, the deposit is the lesser of the deposit by nights and the advance-booking share of the
      whole stay's room and tax; for a stay of at least the long-stay cap nights booked fewer than the
      cap lead days before arrival, it is the lesser of the deposit by nights and the long-stay share of
      the whole stay's room and tax; any other stay pays the deposit by nights. A guest whose attached
      Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top
      night threshold of elite night credits this year has the top elite deposit relief taken off the
      deposit; one whose membership holds the Platinum Elite or Gold Elite tier with at least the middle
      night threshold has the middle elite deposit relief taken off; any other guest has none taken
      off. When the guest holds an active Family Resort Club or Founders Resort Club membership at the
      same resort, the family club deposit relief is taken off the deposit; an active membership of any
      other level at that resort takes off the club deposit relief; a guest with no active club
      membership at that resort has no club relief taken off. The deposit chosen by the stay rule is
      first reduced by the elite deposit relief and that result by the club deposit relief, each acting
      on the result of the step before; the money held is then taken off and rounding to the cent
      happens once, on the further deposit.
    prerequisite:
      - problem: booking_ext_extra_person_reprice
        kind: value_input
        gate: rate_now
        form: action
        policy_source: >-
          No further advance deposit is collected until the extra-person charge for every adult beyond those the nightly rate covers has been added to the reservation's nightly rate.
        fallback_reason: >-
          The nightly rate on a reservation is a single figure; the records do not show which charges it already includes, so no record-visible state tells a reader that the extra-person charge has been added, and the sentence names the action instead.
        condition: >-
          booking_reservations.nightly_rate of the reservation carries the extra-person charge for every adult in booking_reservations.adults beyond the adults the plan's rate covers.
        resolved_by: reprice_extra_persons_22837316
        effect: >-
          The nightly rate the further deposit is worked out from rises by the extra-person charge, so the rate_now binding, the deposit the reservation requires and the further deposit all rise.
      - problem: booking_ext_penalty_excess_reversal
        kind: state_gate
        gate: booking_charges.event_type
        form: state
        policy_source: >-
          An additional deposit is collected only after each late cancellation penalty kept from money held on another reservation of the same guest at the same hotel for overlapping nights, where it exceeds the penalty that cancellation owes, carries a penalty reversal entry naming it.
        condition: >-
          Every booking_cancellation_penalty settled from money held on another reservation of the same customer_id and property_code whose nights overlap, where it exceeds the penalty its cancellation owes, has a booking_penalty_reversal entry whose related_charge_id names it.
        resolved_by: reverse_penalty_excess_975f0de4
        effect: >-
          The guest's credits at the hotel for the same stay are settled before any further money is taken, so the further deposit may be collected.
    cross_category:
      - category: loyalty
        as: branch
        reads: [variant_name, elite_night_credits]
        note: The elite deposit relief reads the tier and this year's elite night credits of the attached membership.
      - category: club
        as: branch
        reads: [variant_name, status]
        note: The club deposit relief reads the level and status of the guest's Resort Club membership at the same resort.
    compute:
      - held: "SUM('booking_charges', 'amount', event_type='booking_deposit_collect') - SUM('booking_charges', 'amount', event_type='booking_deposit_refund') - SUM('booking_charges', 'amount', event_type='booking_deposit_forfeit') - SUM('booking_charges', 'amount', event_type='booking_deposit_transfer')"
      - rate_now: "F('nightly_rate')"
      - tax_factor: "1 + F('tax_rate_pct') / 100"
      - nights_stay: "DAYS(F('arrival_date'), F('departure_date'))"
      - deposit_nights: "K('peak_deposit_nights') if (F('award_season') == 'peak' and nights_stay >= K('peak_long_stay')) else (K('offpeak_short_deposit_nights') if (F('award_season') == 'off_peak' and nights_stay < K('short_stay_nights')) else P('resort_deposit_nights'))"
      - by_nights: "deposit_nights * rate_now * tax_factor"
      - cap_stay: "DAYS(F('arrival_date'), F('departure_date'))"
      - cap_lead: "DAYS(F('booked_date'), F('arrival_date'))"
      - deposit_base: "MN(by_nights, K('pct_cap_advance') * cap_stay * rate_now * tax_factor) if (cap_stay >= K('cap_min_stay') and cap_lead >= K('cap_lead_days')) else (MN(by_nights, K('pct_cap_long') * cap_stay * rate_now * tax_factor) if (cap_stay >= K('cap_long_stay') and cap_lead < K('cap_lead_days')) else by_nights)"
      - tier_name: "CFIELD('loyalty', 'variant_name', loyalty_member_id=F('loyalty_member_id'))"
      - tier_nights: "CFIELD('loyalty', 'elite_night_credits', loyalty_member_id=F('loyalty_member_id'))"
      - elite_relief: "K('elite_relief_top') if ((tier_name == 'Ashbury Rewards Titanium Elite' or tier_name == 'Ashbury Rewards Ambassador Elite') and tier_nights >= K('top_nights')) else (K('elite_relief_mid') if ((tier_name == 'Ashbury Rewards Platinum Elite' or tier_name == 'Ashbury Rewards Gold Elite') and tier_nights >= K('mid_nights')) else K('elite_relief_none'))"
      - club_level: "CFIELD('club', 'variant_name', property_code=F('property_code'))"
      - club_status: "CFIELD('club', 'status', property_code=F('property_code'))"
      - club_relief: "K('club_relief_family') if (club_status == 'active' and (club_level == 'Family Resort Club Membership' or club_level == 'Founders Resort Club Membership')) else (K('club_relief_other') if (club_status == 'active' and club_level != None) else K('club_relief_none'))"
      - required: "deposit_base * (1 - elite_relief) * (1 - club_relief)"
      - result: "RND(MX(required - held, 0), 2)"
    compute_basis:
      held: "The money held is every deposit collected for the reservation less every refund, forfeit and transfer of deposit money posted on it."
      rate_now: "The deposit the reservation requires is the plan's resort deposit nights of the nightly rate on the reservation, with room tax added at the hotel's tax rate."
      tax_factor: "The deposit the reservation requires is the plan's resort deposit nights of the nightly rate on the reservation, with room tax added at the hotel's tax rate."
      nights_stay: "When the arrival night is in the peak season and the stay is at least the peak long-stay nights, the deposit covers the peak deposit nights instead of the plan's resort deposit nights;"
      deposit_nights: "When the arrival night is in the peak season and the stay is at least the peak long-stay nights, the deposit covers the peak deposit nights instead of the plan's resort deposit nights; when the arrival night is in the off-peak season and the stay is shorter than the short-stay nights, it covers the off-peak short-stay deposit nights; any other stay keeps the plan's resort deposit nights."
      by_nights: "The deposit the reservation requires is the plan's resort deposit nights of the nightly rate on the reservation, with room tax added at the hotel's tax rate."
      cap_stay: "For a stay of at least the cap minimum nights booked at least the cap lead days before arrival, the deposit is the lesser of the deposit by nights and the advance-booking share of the whole stay's room and tax;"
      cap_lead: "For a stay of at least the cap minimum nights booked at least the cap lead days before arrival, the deposit is the lesser of the deposit by nights and the advance-booking share of the whole stay's room and tax;"
      deposit_base: "For a stay of at least the cap minimum nights booked at least the cap lead days before arrival, the deposit is the lesser of the deposit by nights and the advance-booking share of the whole stay's room and tax; for a stay of at least the long-stay cap nights booked fewer than the cap lead days before arrival, it is the lesser of the deposit by nights and the long-stay share of the whole stay's room and tax; any other stay pays the deposit by nights."
      tier_name: "A guest whose attached Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night credits this year has the top elite deposit relief taken off the deposit;"
      tier_nights: "A guest whose attached Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night credits this year has the top elite deposit relief taken off the deposit;"
      elite_relief: "A guest whose attached Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night credits this year has the top elite deposit relief taken off the deposit; one whose membership holds the Platinum Elite or Gold Elite tier with at least the middle night threshold has the middle elite deposit relief taken off; any other guest has none taken off."
      club_level: "When the guest holds an active Family Resort Club or Founders Resort Club membership at the same resort, the family club deposit relief is taken off the deposit;"
      club_status: "When the guest holds an active Family Resort Club or Founders Resort Club membership at the same resort, the family club deposit relief is taken off the deposit;"
      club_relief: "When the guest holds an active Family Resort Club or Founders Resort Club membership at the same resort, the family club deposit relief is taken off the deposit; an active membership of any other level at that resort takes off the club deposit relief; a guest with no active club membership at that resort has no club relief taken off."
      required: "The deposit chosen by the stay rule is first reduced by the elite deposit relief and that result by the club deposit relief, each acting on the result of the step before;"
      result: "The further deposit is the deposit the reservation requires less the money held, never below zero, rounded to the cent."
    factors:
      - id: season_deposit_nights
        effect: parameter
        decides: deposit_nights
        bindings: [nights_stay, deposit_nights]
        ladder:
          - when: "the arrival night is in the peak season and the stay is at least the peak long-stay nights"
            value: "K('peak_deposit_nights')"
          - when: "the arrival night is in the off-peak season and the stay is shorter than the short-stay nights"
            value: "K('offpeak_short_deposit_nights')"
          - when: "otherwise"
            value: "P('resort_deposit_nights')"
        baseline:
          deposit_nights: "P('resort_deposit_nights')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: stay_share_cap
        effect: method
        decides: deposit_base
        bindings: [cap_stay, cap_lead, deposit_base]
        ladder:
          - when: "the stay is at least the cap minimum nights and was booked at least the cap lead days before arrival"
            method: "the deposit is the lesser of the deposit by nights and the advance-booking share of the whole stay's room and tax"
          - when: "the stay is at least the long-stay cap nights and was booked fewer than the cap lead days before arrival"
            method: "the deposit is the lesser of the deposit by nights and the long-stay share of the whole stay's room and tax"
          - when: "otherwise"
            method: "the deposit is the deposit by nights"
        baseline:
          deposit_base: "by_nights"
        evidence: [date]
        cross_difficulty: null
      - id: elite_deposit_relief
        effect: parameter
        decides: elite_relief
        bindings: [tier_name, tier_nights, elite_relief]
        ladder:
          - when: "the attached membership holds the Titanium Elite or Ambassador Elite tier and has at least the top night threshold of elite night credits this year"
            value: "K('elite_relief_top')"
          - when: "the attached membership holds the Platinum Elite or Gold Elite tier and has at least the middle night threshold of elite night credits this year"
            value: "K('elite_relief_mid')"
          - when: "otherwise"
            value: "K('elite_relief_none')"
        baseline:
          elite_relief: "K('elite_relief_none')"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: club_deposit_relief
        effect: parameter
        decides: club_relief
        bindings: [club_level, club_status, club_relief]
        ladder:
          - when: "the guest's Resort Club membership at the same resort is active and is a Family Resort Club or Founders Resort Club membership"
            value: "K('club_relief_family')"
          - when: "the guest's Resort Club membership at the same resort is active and is of any other level"
            value: "K('club_relief_other')"
          - when: "otherwise"
            value: "K('club_relief_none')"
        baseline:
          club_relief: "K('club_relief_none')"
        evidence: [cross_category]
        cross_difficulty: club
    baseline:
      rule: >-
        The money held is every deposit collected for the reservation less every refund, forfeit and transfer of deposit money posted on it. The deposit the reservation requires is the plan's resort deposit nights of the nightly rate on the reservation, with room tax added at the hotel's tax rate. The further deposit is the deposit the reservation requires less the money held, never below zero, rounded to the cent.
      params: [resort_deposit_nights]
    inputs:
      history:
        - {table: booking_charges, aggregate: sum, field: amount, filters: {event_type: booking_deposit_collect}}
        - {table: booking_charges, aggregate: sum, field: amount, filters: {event_type: booking_deposit_refund}}
        - {table: booking_charges, aggregate: sum, field: amount, filters: {event_type: booking_deposit_forfeit}}
        - {table: booking_charges, aggregate: sum, field: amount, filters: {event_type: booking_deposit_transfer}}
      cross_category: [loyalty, club]

  - id: booking_ext_penalty_excess_reversal
    base_policy_refs: [booking_evt_penalty_reversal, booking_late_cancellation_penalty]
    overwrite:
      - base_policy: booking_late_cancellation_penalty
        superseded_clause: >-
          Under first_night_room_and_tax the penalty is one night at the reservation's nightly rate plus tax at tax_rate_pct; under full_stay_room_and_tax it is every night of the stay at the nightly rate plus tax; tax is added only when penalty_includes_tax is true.
        replaced_by: >-
          The penalty a late cancellation owes is the penalty night the plan's late-cancellation basis gives, that is one night at the nightly rate on the reservation where the basis is the first night and every night of the stay where it is the full stay, with room tax added at the hotel's tax rate where the plan adds tax to penalties.
      - base_policy: booking_evt_penalty_reversal
        superseded_clause: >-
          penalty_basis_misapplied applies when the amount charged exceeds the amount the plan's penalty basis yields for the reservation; only the excess is reversed.
        replaced_by: >-
          A late cancellation penalty that was kept at more than the penalty a late cancellation owes is reversed for the excess, under the reason that the plan's penalty basis was misapplied, naming the original penalty it reverses.
    trigger: state_due
    subject: [booking_penalty_reversal]
    computes: amount
    target_tool: reverse_penalty_excess_975f0de4
    params:
      early_late_days: 2
      eve_days: 1
      share_early_late: 0.50
      share_eve: 0.75
      share_full: 1.00
      floor_long_nights: 5
      floor_standard_nights: 7
      holiday_floor_long: 0.75
      holiday_floor_short: 0.60
      no_floor: 0.00
      long_stay_nights: 7
      long_stay_pct: 0.15
      top_nights: 50
      mid_nights: 25
      penalty_relief_top: 0.40
      penalty_relief_mid: 0.20
      penalty_relief_none: 0.00
    rule: >
      A late cancellation penalty that was kept at more than the penalty a late cancellation owes is
      reversed for the excess, under the reason that the plan's penalty basis was misapplied, naming the
      original penalty it reverses. A reversal is posted only on a reservation whose status is
      cancelled, against a late cancellation penalty recorded on that same reservation, and each penalty
      is reversed at most once. The penalty a late cancellation owes is the penalty night the plan's
      late-cancellation basis gives, that is one night at the nightly rate on the reservation where the
      basis is the first night and every night of the stay where it is the full stay, with room tax
      added at the hotel's tax rate where the plan adds tax to penalties. The penalty charged is every
      late cancellation penalty on the reservation less every reversal already posted against it. The
      amount reversed is the penalty charged less the penalty a late cancellation owes rounded to the
      cent, never below zero and never above the penalty charged. When the cancellation was recorded at
      least the early-late days before the arrival date, counted in calendar days from the date of the
      cancellation to the arrival date, the penalty owed is the early-late share of the penalty night;
      when it was recorded at least the eve days but fewer than the early-late days before arrival, it
      is the eve share; a cancellation recorded on the arrival date pays the full share. Holiday terms
      set a floor under that share: when the arrival night is in the peak season and the stay is at
      least the holiday floor nights, the share charged is never less than the holiday long-stay floor;
      when the arrival night is in the peak season and the stay is shorter than the holiday floor nights,
      or the arrival night is in the standard season and the stay is at least the standard floor nights,
      it is never less than the holiday short-stay floor; any other stay has no floor. For a stay of at
      least the long-stay nights the penalty night is the long-stay share of the whole stay at the
      nightly rate; for a stay shorter than that on a package plan the penalty night is one night at the
      nightly rate less the package supplement, the package's inclusions not being served; any other
      stay keeps the penalty night the plan's basis gives. A guest whose attached Ashbury Rewards
      membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold
      of elite night credits this year has the top elite penalty relief taken off; one whose membership
      holds the Platinum Elite or Gold Elite tier with at least the middle night threshold has the middle
      elite penalty relief taken off; any other guest has no elite penalty relief. The share charged is
      the larger of the lateness share and the holiday floor; the penalty night is first multiplied by
      the share charged, that result is reduced by the elite penalty relief, and room tax is added last
      on what remains; the penalty owed is rounded to the cent before the amount reversed is worked out.
      When the penalty was kept from money held, the reversed amount is returned to the card on file.
    prerequisite: []
    cross_category:
