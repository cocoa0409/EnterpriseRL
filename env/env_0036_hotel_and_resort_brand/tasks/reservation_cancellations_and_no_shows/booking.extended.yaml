        as: branch
        reads: [variant_name, elite_night_credits]
        note: The elite penalty relief reads the tier and this year's elite night credits of the attached membership.
    compute:
      - charged: "SUM('booking_charges', 'amount', event_type='booking_cancellation_penalty')"
      - reversed_before: "SUM('booking_charges', 'amount', event_type='booking_penalty_reversal')"
      - net_charged: "charged - reversed_before"
      - late_days: "DAYS(F('cancelled_at'), F('arrival_date'))"
      - late_share: "K('share_early_late') if late_days >= K('early_late_days') else (K('share_eve') if late_days >= K('eve_days') else K('share_full'))"
      - floor_stay: "DAYS(F('arrival_date'), F('departure_date'))"
      - floor_share: "K('holiday_floor_long') if (F('award_season') == 'peak' and floor_stay >= K('floor_long_nights')) else (K('holiday_floor_short') if ((F('award_season') == 'peak' and floor_stay < K('floor_long_nights')) or (F('award_season') == 'standard' and floor_stay >= K('floor_standard_nights'))) else K('no_floor'))"
      - share_charged: "MX(late_share, floor_share)"
      - pen_stay: "DAYS(F('arrival_date'), F('departure_date'))"
      - night_base: "K('long_stay_pct') * pen_stay * F('nightly_rate') if pen_stay >= K('long_stay_nights') else ((F('nightly_rate') - P('package_supplement_per_night_usd')) if (P('breakfast_included') and pen_stay < K('long_stay_nights')) else (F('nightly_rate') * pen_stay if P('late_cancellation_penalty_basis') == 'full_stay_room_and_tax' else F('nightly_rate')))"
