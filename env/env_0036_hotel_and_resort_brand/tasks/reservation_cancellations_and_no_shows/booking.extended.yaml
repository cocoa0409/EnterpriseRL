      - tier_nights: "CFIELD('loyalty', 'elite_night_credits', loyalty_member_id=F('loyalty_member_id'))"
      - elite_relief: "K('penalty_relief_top') if ((tier_name == 'Ashbury Rewards Titanium Elite' or tier_name == 'Ashbury Rewards Ambassador Elite') and tier_nights >= K('top_nights')) else (K('penalty_relief_mid') if ((tier_name == 'Ashbury Rewards Platinum Elite' or tier_name == 'Ashbury Rewards Gold Elite') and tier_nights >= K('mid_nights')) else K('penalty_relief_none'))"
      - owed_pre_tax: "night_base * share_charged * (1 - elite_relief)"
      - owed: "RND(owed_pre_tax * (1 + F('tax_rate_pct') / 100) if P('penalty_includes_tax') else owed_pre_tax, 2)"
      - result: "RND(MN(MX(net_charged - owed, 0), net_charged), 2)"
    compute_basis:
