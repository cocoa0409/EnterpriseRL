      tier_name: "A guest whose attached Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night credits this year has the top elite penalty relief taken off;"
      tier_nights: "A guest whose attached Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night credits this year has the top elite penalty relief taken off;"
      elite_relief: "A guest whose attached Ashbury Rewards membership holds the Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night credits this year has the top elite penalty relief taken off; one whose membership holds the Platinum Elite or Gold Elite tier with at least the middle night threshold has the middle elite penalty relief taken off; any other guest has no elite penalty relief."
      owed_pre_tax: "the penalty night is first multiplied by the share charged, that result is reduced by the elite penalty relief, and room tax is added last on what remains;"
      owed: "the penalty owed is rounded to the cent before the amount reversed is worked out."
      result: "The amount reversed is the penalty charged less the penalty a late cancellation owes rounded to the cent, never below zero and never above the penalty charged."
    factors:
      - id: lateness_share
        effect: parameter
        decides: late_share
        bindings: [late_days, late_share]
