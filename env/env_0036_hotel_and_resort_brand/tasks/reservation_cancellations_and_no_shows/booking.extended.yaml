  - id: booking_ext_no_show_charge
    base_policy_refs: [booking_no_show]
    overwrite:
      - base_policy: booking_no_show
        superseded_clause: >-
          The no-show charge follows the plan's no_show_penalty_basis and is computed exactly as the late cancellation penalty: first_night_room_and_tax is one night of room and tax and full_stay_room_and_tax is every night of the stay.
        replaced_by: >-
          The no-show charge is the no-show night the plan's no-show basis gives, that is one night at the nightly rate on the reservation where the basis is the first night and every night of the stay where it is the full stay, with room tax added at the hotel's tax rate where the plan adds tax to penalties, rounded to the cent.
    trigger: state_due
    subject: [booking_no_show_charge]
    computes: amount
    target_tool: post_no_show_charge_68d6e4c0
    params:
      top_nights: 50
      mid_nights: 25
      silver_nights: 10
      no_show_relief_top: 0.30
      no_show_relief_mid: 0.20
      no_show_relief_silver: 0.10
      no_show_relief_none: 0.00
      steady_stays: 6
      repeat_stays: 4
      steady_relief: 0.10
      repeat_relief: 0.05
      history_relief_none: 0.00
      member_direct_relief: 0.03
      guest_direct_relief: 0.01
      direct_relief_none: 0.00
    rule: >
      A no-show charge is posted by guest services on a guaranteed reservation the night audit has
      marked a no-show, once, at the amount below, recorded under the plan's no-show basis and settled
      from the money held when the reservation is guaranteed by an advance deposit or a full
      prepayment, and to the card on file otherwise. A no-show charge is posted only on a reservation
      whose status is no-show, and a reservation carries at most one cancellation penalty or no-show
      charge. The no-show charge is the no-show night the plan's no-show basis gives, that is one night
      at the nightly rate on the reservation where the basis is the first night and every night of the
      stay where it is the full stay, with room tax added at the hotel's tax rate where the plan adds
      tax to penalties, rounded to the cent. A no-show charge settled from money held is never more than
      the money held, that is every deposit payment collected for the reservation less every refund,
      forfeit and transfer of deposit money posted on it. The nights after the first are released or retained as the plan's no-show release rule provides, and what the no-show night contains follows the services that were never provided: on a package plan the no-show night is one night at the nightly rate less the package supplement, the package's inclusions not being served; on any other plan that releases the nights after the first, where the reservation registers adults beyond those the plan's rate covers, it is one night at the nightly rate less the extra-adult charge for those adults; any other reservation keeps the no-show night the plan's basis gives. A guest whose attached Ashbury Rewards membership holds the
      Titanium Elite or Ambassador Elite tier with at least the top night threshold of elite night
      credits this year has the top no-show courtesy taken off the charge; one whose membership holds
      the Platinum Elite or Gold Elite tier with at least the middle night threshold has the middle
      no-show courtesy taken off; one whose membership holds the Silver Elite tier with at least the
      silver night threshold has the silver no-show courtesy taken off; any other guest has no tier
      courtesy. A guest whose Ashbury Rewards account shows at least the steady number of stays credited
      in the twelve months before the day of handling, each stay night-credit posting counting as one
      stay whatever its nights and a posting dated on or before the same calendar date twelve months
      earlier being outside them, has the steady-guest courtesy taken off; one whose account shows at
      least the repeat number of such stays has the repeat-guest courtesy taken off; any other guest has
      no stay courtesy. A reservation booked directly with Ashbury, through the brand website, the
      mobile app, the call center or the hotel itself, that carries an active Ashbury Rewards
      membership has the member direct-booking courtesy taken off; one booked directly without an
      active membership has the guest direct-booking courtesy taken off; a reservation booked through
      any other channel has no direct-booking courtesy. The no-show night is first multiplied by one
      plus the room tax where the plan adds tax, that result is reduced by the tier courtesy, that
      result by the stay courtesy and that result by the direct-booking courtesy, each acting on the
      result of the step before, and the charge is rounded to the cent once, at the end; the limit of
      the money held is applied last, to the rounded charge.
    prerequisite: []
    cross_category:
      - category: loyalty
        as: history
        reads: [variant_name, elite_night_credits, status, loyalty_transactions.event_type, loyalty_transactions.posted_date]
        note: The tier courtesy reads the tier and this year's elite night credits, the stay courtesy counts the stays credited in the twelve months before handling, the direct-booking courtesy reads whether the attached membership is active.
    compute:
      - held: "SUM('booking_charges', 'amount', event_type='booking_deposit_collect') - SUM('booking_charges', 'amount', event_type='booking_deposit_refund') - SUM('booking_charges', 'amount', event_type='booking_deposit_forfeit') - SUM('booking_charges', 'amount', event_type='booking_deposit_transfer')"
      - basis_stay: "DAYS(F('arrival_date'), F('departure_date'))"
      - room_portion: "F('nightly_rate') - P('package_supplement_per_night_usd')"
      - extra_adult_part: "MX(F('adults') - P('included_adults'), 0) * P('extra_adult_charge_per_night_usd')"
      - no_show_night: "room_portion if P('breakfast_included') else ((F('nightly_rate') - extra_adult_part) if (extra_adult_part > 0 and P('no_show_releases_remaining_nights')) else (F('nightly_rate') * basis_stay if P('no_show_penalty_basis') == 'full_stay_room_and_tax' else F('nightly_rate')))"
      - taxed: "no_show_night * (1 + F('tax_rate_pct') / 100) if P('penalty_includes_tax') else no_show_night"
      - tier_name: "CFIELD('loyalty', 'variant_name', loyalty_member_id=F('loyalty_member_id'))"
      - tier_nights: "CFIELD('loyalty', 'elite_night_credits', loyalty_member_id=F('loyalty_member_id'))"
      - tier_relief: "K('no_show_relief_top') if ((tier_name == 'Ashbury Rewards Titanium Elite' or tier_name == 'Ashbury Rewards Ambassador Elite') and tier_nights >= K('top_nights')) else (K('no_show_relief_mid') if ((tier_name == 'Ashbury Rewards Platinum Elite' or tier_name == 'Ashbury Rewards Gold Elite') and tier_nights >= K('mid_nights')) else (K('no_show_relief_silver') if (tier_name == 'Ashbury Rewards Silver Elite' and tier_nights >= K('silver_nights')) else K('no_show_relief_none')))"
      - stay_credits: "XCOUNT('loyalty', 'loyalty_transactions', within_months=12, date_field='posted_date', event_type='loyalty_night_credit', earning_source='stay_nights')"
      - stay_relief: "K('steady_relief') if stay_credits >= K('steady_stays') else (K('repeat_relief') if stay_credits >= K('repeat_stays') else K('history_relief_none'))"
      - member_status: "CFIELD('loyalty', 'status', loyalty_member_id=F('loyalty_member_id'))"
      - direct_channel: "F('booking_channel') == 'brand_website' or F('booking_channel') == 'mobile_app' or F('booking_channel') == 'call_center' or F('booking_channel') == 'property_direct'"
      - direct_relief: "K('member_direct_relief') if (direct_channel and member_status == 'active') else (K('guest_direct_relief') if (direct_channel and member_status != 'active') else K('direct_relief_none'))"
      - charge: "RND(taxed * (1 - tier_relief) * (1 - stay_relief) * (1 - direct_relief), 2)"
      - result: "MN(charge, held) if (F('guarantee_type') == 'advance_deposit' or F('guarantee_type') == 'full_prepayment') else charge"
