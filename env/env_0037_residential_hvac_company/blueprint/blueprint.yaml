name: env_0037_residential_hvac_company
company: Harbison Heating & Air

background: |
  Harbison Heating & Air is a family-founded residential heating and cooling contractor headquartered in Columbus, Ohio, serving about 61,000 households across Franklin, Delaware and the neighbouring counties with roughly 140 field technicians and installation crews. It sells and services furnaces, air conditioners, heat pumps, ductless systems, boilers and tank water heaters for homeowners, and its customer care centre speaks in a plain, neighbourly voice that explains charges line by line.
  The best-known product is the Comfort Club maintenance agreement, held in six tiers from Comfort Club Basic through Comfort Club Silver, Comfort Club Gold, Comfort Club Platinum and Comfort Club Platinum Plus to Comfort Club Total Home; an agreement runs term by term, bills dues annually or monthly, and books seasonal tune-ups, member benefits and, at the top tiers, covered repairs against the term.
  Equipment is protected by Harbison protection contracts in six tiers: the Harbison 2-Year Workmanship Warranty that comes with every installation, the Harbison 5-Year Labor Protection, the Harbison 10-Year Labor Protection, the Harbison 10-Year Parts & Labor Protection, the Harbison 12-Year Total Protection and the Harbison 12-Year Total Protection Plus; each contract is tied to one unit or matched system and books claims, decisions and payouts against a lifetime claim benefit.
  Repairs are booked as service calls under six call classes, the Standard Service Call, the Same-Day Priority Service Call, the Evening Service Call, the Weekend Service Call, the Overnight Emergency Service Call and the Holiday Emergency Service Call, and every call carries an itemised flat-rate invoice of fees, parts, labor, refrigerant, discounts, coverage credits and payments.
  Replacement systems are sold as six installation packages, the Harbison Essential Series System, the Harbison Advantage Series System, the Harbison Performance Series System, the Harbison Performance Hybrid Heat Pump System, the Harbison Signature Series System and the Harbison Signature Elite Communicating System, each held as a signed installation contract that moves through permitting, installation, municipal inspection and close-out while its project ledger records charges, credits, deposits and lender funding.
  Installations can be paid through Harbison Home Comfort Financing, originated with a partner bank and serviced in-house under six plans: the 12-Month Same-As-Cash Deferred Interest Plan, the 18-Month 0% APR Equal Payment Plan, the 36-Month 0% APR Equal Payment Plan, the 60-Month 5.99% APR Fixed-Rate Plan, the 120-Month 7.99% APR Fixed-Rate Plan and the 144-Month 9.99% APR Fixed-Rate Plan, each an account that books its disbursement, monthly statements, payments and adjustments.
  Two smaller lines round out the catalogue: FilterDirect filter subscriptions, shipped in six grades from FilterDirect Standard MERV 8 to FilterDirect Media Cabinet MERV 16, and ComfortLease equipment leases, offered as ComfortLease Gas Furnace, ComfortLease Central Air, ComfortLease Heat Pump, ComfortLease Furnace & Central Air, ComfortLease Dual-Fuel System and ComfortLease Ductless Multi-Zone, each billing rent monthly.
  Every household has one customer profile for its service address, and the equipment at that address is registered unit by unit with brand, model, serial number, installation date, refrigerant and capacity.
  Callers are mostly homeowners between their thirties and their eighties, many of them long-time members who hold a Comfort Club agreement alongside a protection contract on a system Harbison installed, and a growing number who financed that system and are still paying it down.
  They bring years of history with them: tune-ups kept or missed, past repair invoices, earlier warranty claims, dues paid by card or autopay, change orders and rebates on an installation, and financing statements.
  The busiest weeks follow the first heat wave and the first hard freeze, when no-cool and no-heat calls, after-hours dispatches and questions about what a membership or a protection contract really covers arrive together.
  Spring and autumn bring tune-up bookings, renewals and cancellations, while home sales, equipment replacements and financing payoffs keep a steady flow of contract changes moving through the year.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: comfort_club_membership_care
    claim:
      categories: [plan]
      event_types: [plan_enroll, plan_activate, plan_dues_charge, plan_dues_payment, plan_dues_credit, plan_refund_issued, plan_visit_grant, plan_tuneup_visit, plan_visit_expiry, plan_coverage_grant, plan_coverage_draw, plan_coverage_expiry, plan_renew, plan_tier_change, plan_add_system, plan_preferences_update, plan_past_due, plan_cure, plan_lapse, plan_reinstate, plan_customer_cancel, plan_terminate]
    summary: >
      Callers are Comfort Club members and prospective members: homeowners enrolling a newly installed or long-serving system, members booking or missing a seasonal tune-up, adding a second system, changing tier, switching off automatic renewal, reinstating an agreement that lapsed at term end, disputing a late fee on monthly dues, or cancelling and asking what comes back to them; the setting varies by tier from Comfort Club Basic to Comfort Club Total Home, by status (pending, active, past_due, lapsed, cancelled), by annual versus monthly billing, by how many systems are enrolled and how old they are, and by a term's history of visits used, forfeited or still available.
      The governing records are the agreement itself, its dues ledger and its visit and coverage entries, read against the equipment register and, for response guarantees and covered repairs, the member's service calls; the rules gate enrollment on one open agreement per customer and on equipment age (plan_agg_multi_holding, plan_enrollment_eligibility), price dues per tier, per system and per channel (plan_dues_pricing), meter tune-ups by season and term (plan_evt_tuneup_allowance, plan_evt_missed_appointment), and settle money by tier-specific grace, late-fee, renewal, reinstatement, upgrade and cancellation formulas (plan_billing_collections, plan_renewal, plan_reinstatement, plan_tier_changes, plan_cancellation_refund), while the covered-repair and response-guarantee benefits of the upper tiers depend on waiting periods, caps and dispatch times (plan_evt_repair_coverage, plan_evt_response_guarantee).
      In the natural course of an agreement, dues are billed and paid before it activates, visits are granted with each term before they can be used, and a term ends in renewal, lapse or cancellation before the next term's dues, visits and coverage exist.
      Booking visits, posting charges, credits, waivers, renewals, reinstatements, tier and system changes and preference updates are agent service actions on a verified account, whereas cancelling the agreement or arranging a downgrade at renewal is the member's own decision, recorded as a request that only the member can confirm.
      Requests the charter does not decide, such as transferring an agreement to a different property, pausing a term while the home stands vacant, or suspending dues while a member is hospitalised or deployed, leave no policy route and call for a POLICY_NOT_COVERED handoff.

  - name: protection_contract_claims
    claim:
      categories: [warranty]
      event_types: [warranty_register, warranty_activate, warranty_charge, warranty_payment, warranty_credit, warranty_refund_issued, warranty_limit_grant, warranty_claim_file, warranty_claim_decide, warranty_claim_payout, warranty_transfer, warranty_cancel, warranty_decline, warranty_expire]
    summary: >
      Callers are homeowners holding, or wanting to buy, a Harbison protection contract on a furnace, air conditioner, heat pump or matched system: a member whose compressor or heat exchanger failed and who wants to know what the contract pays, a homeowner whose claim was denied and who now has a maintenance receipt, a seller closing on a house who wants the coverage to pass to the buyer, a holder cancelling for a refund, or an owner of older equipment asking to buy coverage after the fact; the setting varies by tier from the Harbison 2-Year Workmanship Warranty to the Harbison 12-Year Total Protection Plus, by status, by purchase channel, by single-unit versus matched-system scope, and by the claims already paid against the lifetime limit.
      The governing records are the contract, its claim entries and billing entries, read against the equipment register, the installation project and its manufacturer registration, the service call and its invoice lines, and the Comfort Club visit history that proves maintenance; the rules fix one contract per unit and one claim service fee per visit (warranty_agg_one_contract_per_unit, warranty_agg_claim_service_fee_per_visit), purchase windows, inspection, waiting periods and prices (warranty_purchase_eligibility, warranty_pricing, warranty_activation), and decide claims on coverage term, covered components, documented maintenance, filing deadline and manufacturer-first parts coverage (warranty_evt_claim_coverage) before payouts are capped by per-claim, component and lifetime limits (warranty_evt_claim_payout).
      In the natural course of a contract, coverage starts only once it is active, a claim is filed before it is decided, a decision exists before any payout or appeal, and a payout flows into the service invoice it reimburses.
      Filing, deciding and paying claims, charging or waiving service fees and processing activation, expiry or a failed inspection are agent service actions, whereas cancelling a contract or transferring it on a home sale is the holder's own decision, recorded as a request that only the holder can confirm.
      Situations the charter does not decide, such as reimbursing a repair done by another contractor, covering consequential water damage from a leaking coil, or extending coverage past its end date as a courtesy, have no policy route and call for a POLICY_NOT_COVERED handoff.

  - name: repair_and_emergency_service
    claim:
      categories: [service]
      event_types: [service_book, service_dispatch, service_complete, service_close, service_cancel, service_reclass, service_charge, service_discount, service_coverage_credit, service_payment, service_refund]
    summary: >
      Callers are homeowners with no heat, no cooling, a leak, a noise or a tripped safety device who want someone out today, tonight or over the holiday, and customers questioning an invoice afterwards: why an after-hours premium was charged, why a member discount or a senior discount did not appear, whether the diagnostic fee should have been credited, whether a return visit on last spring's repair is free, or why a warranty or Comfort Club coverage line is missing; the setting varies by call class from the Standard Service Call to the Holiday Emergency Service Call, by ticket status, by whether the customer holds a Comfort Club tier, a protection contract or a courtesy discount program, and by the ticket's line-by-line history.
      The governing records are the service ticket and its invoice lines, read against the equipment register, the customer's Comfort Club agreement, any protection contract and claim on the failed unit, and earlier tickets on the same unit; the rules fix which class a booking falls in and when a safety symptom cannot be booked at all (service_call_class_eligibility, service_safety_triage), how fees, premiums, flat-rate parts and labor and refrigerant are priced per class (service_evt_dispatch_fees, service_evt_flat_rate_pricing, service_maintenance_tuneup), how member, courtesy and diagnostic credits apply and stack (service_evt_member_benefits, service_evt_discount_stacking, service_evt_diagnostic_credit), how warranty and plan coverage reduce the invoice (service_evt_coverage_credit), when a return visit is free under the repair guarantee (service_evt_repair_guarantee), and how cancellations, payments, refunds and late balances are settled (service_cancellation, service_payment_and_collections).
      In the natural course of a call, it is booked before dispatch, charges post only once a technician is dispatched or the work is done, discounts and coverage apply to a charge line that already exists, and a ticket closes only once its balance is settled.
      Booking, reclassifying, cancelling, posting charges, discounts, coverage credits and refunds and taking a payment the customer authorises are agent service actions on a verified account.
      Requests the charter does not decide, such as matching another contractor's quote, waiving a premium because the customer disliked the arrival window, or paying for a hotel night while the heat was out, have no policy route and call for a POLICY_NOT_COVERED handoff.

  - name: replacement_installation_projects
    claim:
      categories: [install]
      event_types: [install_contract, install_schedule, install_complete, install_inspect, install_close, install_cancel, install_charge, install_credit, install_payment, install_refund, install_mfr_registration]
    summary: >
      Callers are homeowners replacing a furnace, air conditioner or heat pump: a buyer who signed at the kitchen table and wants out two days later, one who changed their mind after the equipment was ordered, a homeowner asking why the member credit or a manufacturer rebate is missing from the invoice, one approving or disputing a change order for a new line set, one asking when the permit and inspection happen, or one confirming that the manufacturer registration was filed in time for the longer parts warranty; the setting varies by package from the Harbison Essential Series System to the Harbison Signature Elite Communicating System, by project status, by tonnage and municipality, by sale channel, and by whether the project is financed and whether the customer holds a Comfort Club tier.
      The governing records are the installation project and its ledger, read against the equipment being replaced, the customer's Comfort Club agreement, the financing account that funds the project and the cancellation or change-order requests on file; the rules price the package by tonnage and municipality with deposits and change orders (install_contract_pricing, install_deposit_and_payment, install_change_orders), credit members and manufacturer promotions (install_member_credit, install_manufacturer_rebate, install_accessories_and_protection, install_agg_multi_system_discount), govern the three-business-day right to cancel and the restocking terms after it (install_rescission, install_cancellation_after_rescission), and fix scheduling, completion, registration, inspection, close-out and refunds (install_scheduling_permit, install_completion_and_registration, install_refunds, install_financing_link).
      In the natural course of a project, the contract is signed before it is scheduled, scheduled before it is installed, installed before inspection and registration, and inspected before it closes, while lender funding follows completion.
      Scheduling, posting charges and credits, recording payments, refunds and the manufacturer registration are agent service actions, whereas cancelling the contract or approving a change order is the homeowner's own decision, recorded as a request that only the homeowner can confirm.
      Requests the charter does not decide, such as substituting a different brand than the package specifies, moving a contract to another property, or compensating for a delay caused by the municipal inspector, have no policy route and call for a POLICY_NOT_COVERED handoff.

  - name: home_comfort_financing_servicing
    claim:
      categories: [finance]
      event_types: [finance_apply, finance_approve, finance_decline, finance_fund, finance_disbursement, finance_statement_charge, finance_payment, finance_payment_reversal, finance_adjustment, finance_delinquent, finance_cure, finance_payoff, finance_chargeoff, finance_withdraw, finance_expire, finance_plan_change, finance_servicing_update]
    summary: >
      Callers are borrowers financing a Harbison installation: an applicant asking which plans their package and credit tier allow, a borrower whose deferred-interest promotion is about to end, one disputing a late fee or asking for a returned-payment fee to be reversed, one whose installation was partly refunded and who wants the refund applied to the loan, one changing the due date or turning on autopay, or one withdrawing an approval before the system is installed; the setting varies by plan from the 12-Month Same-As-Cash Deferred Interest Plan to the 144-Month 9.99% APR Fixed-Rate Plan, by account status, by credit tier, by the amount financed against other open accounts, and by the statement history of payments, fees and adjustments.
      The governing records are the financing account and its transactions, read against the installation project and its ledger and the borrower's other financing accounts; the rules cap total exposure and gate applications by package, amount and credit tier (finance_agg_total_exposure, finance_application_eligibility, finance_credit_decision), fund on completion (finance_funding), set payment, due-day and autopay terms (finance_payment_terms, finance_servicing_changes), assess deferred interest, late and returned-payment fees (finance_deferred_interest, finance_late_and_returned_fees), escalate delinquency (finance_delinquency_and_chargeoff), and apply merchant refunds, payoffs, fee reversals, withdrawals and approval expiry (finance_merchant_refund, finance_payoff_rules, finance_fee_reversal, finance_withdrawal_and_expiry).
      In the natural course of an account, an application is decided before it can fund, funding follows the completion of the installation it pays for, statements and payments follow funding, and fees exist before any reversal of them.
      Posting statement charges, reversals, merchant refund credits and servicing changes are agent service actions on a verified account, whereas withdrawing an application or changing the plan before funding is the borrower's own decision, recorded as a request that only the borrower can confirm.
      Requests the charter does not decide, such as re-amortising a fixed-rate loan into a lower payment, extending a promotional period, or removing a reported delinquency from a credit file, have no policy route and call for a POLICY_NOT_COVERED handoff.
