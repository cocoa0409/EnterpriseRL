events:
  - type: filter_subscribe
    target: filter_subscriptions
    mutation: create
    meaning: A customer signs up for filter deliveries in a grade and size.
    grain: One row per subscription.
    fields:
      subscription_id: Reference number assigned.
      customer_id: Subscriber.
      variant_name: Grade subscribed.
      started_date: Sign-up date.
      filter_size: Size shipped.
      next_ship_date: First ship date.
    triggers: []

  - type: filter_activate
    target: filter_subscriptions
    mutation: {transition: {from: pending, to: active}}
    meaning: The first shipment leaves the warehouse.
    grain: One row per transaction.
    fields:
      subscription_id: Subscription.
      status: Set to active.
    triggers: []

  - type: filter_pause
    target: filter_subscriptions
    mutation: {transition: {from: active, to: paused}}
    meaning: Shipments are paused.
    grain: One row per transaction.
    fields:
      subscription_id: Subscription.
      status: Set to paused.
      paused_until: Date the pause ends.
    triggers: []

  - type: filter_resume
    target: filter_subscriptions
    mutation: {transition: {from: paused, to: active}}
    meaning: Shipments resume.
    grain: One row per transaction.
    fields:
      subscription_id: Subscription.
      status: Set to active.
      next_ship_date: Next ship date.
    triggers: []

  - type: filter_cancel
    target: filter_subscriptions
    mutation:
      transition:
        - {from: pending, to: cancelled}
        - {from: active, to: cancelled}
        - {from: paused, to: cancelled}
    meaning: The subscription is cancelled.
    grain: One row per transaction.
    fields:
      subscription_id: Subscription.
      status: Set to cancelled.
      cancelled_date: Date of cancellation.
    triggers: []

  - type: filter_size_update
    target: filter_subscriptions
    mutation: update
    meaning: The filter size or the next ship date is changed.
    grain: One row per transaction.
    fields:
      subscription_id: Subscription.
      filter_size: New size.
      next_ship_date: New next ship date, for a skip.
    triggers: []

  - type: filter_shipment
    target: filter_entries
    meaning: A shipment of filters leaves the warehouse.
    grain: One row per shipment cycle.
    distinguish_by: [ship_cycle]
    fields:
      subscription_id: Subscription.
      customer_id: Subscriber.
      line_type: Always shipment.
      ship_cycle: Cycle shipped.
      filters_shipped: Filters in the box.
      posted_date: Ship date.
    triggers:
      - event: filter:filter_charge
        map: {subscription_id: subscription_id, customer_id: customer_id, ship_cycle: ship_cycle, line_type: shipment_charge}

  - type: filter_charge
    target: filter_entries
    meaning: A shipment, shipping fee or size-change fee is charged.
    grain: One row per charge kind per shipment cycle.
    distinguish_by: [line_type, ship_cycle]
    fields:
      subscription_id: Subscription.
      customer_id: Subscriber.
      line_type: shipment_charge, shipping_fee or size_change_fee.
      ship_cycle: Cycle charged.
      amount: Amount.
      posted_date: Date posted.
    account: subscription_balance
    direction: in
    triggers: []

  - type: filter_payment
    target: filter_entries
    meaning: The card on file is charged successfully.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      subscription_id: Subscription.
      customer_id: Subscriber.
      line_type: Always payment.
      ship_cycle: Cycle paid.
      amount: Amount.
      posted_date: Date posted.
      payment_reference: Processor confirmation.
    account: subscription_balance
    direction: out
    triggers: []

  - type: filter_credit
    target: filter_entries
    meaning: A discount or a credit for a damaged or wrong-size shipment reduces what the subscriber owes.
    grain: One row per credit kind per shipment or charge.
    distinguish_by: [line_type, source_entry_id]
    fields:
      subscription_id: Subscription.
      customer_id: Subscriber.
      line_type: damaged_shipment_credit, wrong_size_credit or member_filter_discount.
      ship_cycle: Cycle concerned.
      amount: Amount credited.
      posted_date: Date posted.
      source_entry_id: The shipment or charge concerned.
    account: subscription_balance
    direction: out
    triggers: []

measures:
  - id: filter_msr_pauses_12m
    window: Rolling 12 calendar months ending on the date of handling.
    measure: Count of filter_pause writes on the subscription within the window.
  - id: filter_msr_skips_12m
    window: Rolling 12 calendar months ending on the date of handling.
    measure: Count of filter_size_update writes that moved next_ship_date one interval later (skips) within the window.

policies:
  - id: filter_agg_multi_holding
    subject: [filter_subscribe]
    rule: >-
      A customer may hold up to max_subscriptions_per_customer subscriptions, one per filter return or size in the home; each
      is billed and shipped on its own cycle.
    eligibility: []
    params:
      max_per_customer: 3

  - id: filter_agg_combined_shipping
    subject: [filter_charge]
    rule: >-
      Where combined_shipping is true, the shipments of all of a customer's active subscriptions that leave on the same ship date
      travel in one box: their shipment charges are added together against free_shipping_min_order_usd, and at most one
      shipping_fee is charged for that date, on the subscription with the earliest started_date. Only one shipping fee is
      charged per ship date across a customer's subscriptions.
    eligibility:
      - id: one_shipping_fee_per_date
        applies_to: [filter_charge]
        kind: dedup
        condition: Only one shipping fee is charged per ship date across a customer's subscriptions.
        evidence_fields: [filter_entries.customer_id, filter_entries.posted_date, filter_entries.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [filter_entries.customer_id, filter_entries.posted_date]
          action_bindings:
            filter_entries.customer_id: customer_id
            filter_entries.posted_date: posted_date
        dedup_contract:
          table: filter_entries
          mode: separate_record
          object_bindings: {customer_id: customer_id, posted_date: posted_date}
          duplicate_filters: {line_type: [shipping_fee]}
          distinct_fields: []
    params:
      per_tier:
        FilterDirect Standard MERV 8: {shipping_fee: "=shipping_fee_usd", free_min: "=free_shipping_min_order_usd", combined: "=combined_shipping"}
        FilterDirect Pleated MERV 11: {shipping_fee: "=shipping_fee_usd", free_min: "=free_shipping_min_order_usd", combined: "=combined_shipping"}
        FilterDirect Allergen MERV 13: {shipping_fee: "=shipping_fee_usd", free_min: "=free_shipping_min_order_usd", combined: "=combined_shipping"}
        FilterDirect Media Cabinet MERV 11: {shipping_fee: "=shipping_fee_usd", free_min: "=free_shipping_min_order_usd", combined: "=combined_shipping"}
        FilterDirect Media Cabinet MERV 13: {shipping_fee: "=shipping_fee_usd", free_min: "=free_shipping_min_order_usd", combined: "=combined_shipping"}
        FilterDirect Media Cabinet MERV 16: {shipping_fee: "=shipping_fee_usd", free_min: "=free_shipping_min_order_usd", combined: "=combined_shipping"}

  - id: filter_shipment_pricing
    subject: [filter_shipment, filter_charge, filter_credit, filter_activate]
    rule: >-
      A shipment leaves on ship_day_of_month of each shipment_interval_months cycle with filters_per_shipment filters and is
      charged on the ship date: filters_per_shipment times price_per_filter_usd, plus custom_size_surcharge_per_filter_usd per
      filter when the size is not in standard_sizes. The first shipment of a new subscription is reduced by
      first_shipment_discount_pct. A subscriber holding an active Comfort Club agreement on the ship date receives
      member_discount_pct off the shipment charge as a member_filter_discount; the first-shipment and member discounts never
      stack, and the larger applies. Shipping is free when the combined shipment charge is at least free_shipping_min_order_usd,
      otherwise shipping_fee_usd is charged. A subscription's price is held for price_lock_months after sign-up, and a later
      price change applies only to shipments at least price_change_notice_days after notice. A pending subscription becomes
      active when its first shipment leaves.
    eligibility:
      - id: member_discount_active
        applies_to: [filter_credit]
        kind: state
        condition: A subscriber holding an active Comfort Club agreement on the ship date receives member_discount_pct off the shipment charge
        evidence_fields: [plan_agreements.customer_id, plan_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.customer_id]
          action_bindings:
            plan_agreements.customer_id: customer_id
        state_contract:
          field: plan_agreements.status
          allowed: [active]
    formula:
      shipment_charge: filters_per_shipment * price_per_filter_usd
    params:
      per_tier:
        FilterDirect Standard MERV 8: {price: "=price_per_filter_usd", per_shipment: "=filters_per_shipment", interval_months: "=shipment_interval_months", first_pct: "=first_shipment_discount_pct", member_pct: "=member_discount_pct"}
        FilterDirect Pleated MERV 11: {price: "=price_per_filter_usd", per_shipment: "=filters_per_shipment", interval_months: "=shipment_interval_months", first_pct: "=first_shipment_discount_pct", member_pct: "=member_discount_pct"}
        FilterDirect Allergen MERV 13: {price: "=price_per_filter_usd", per_shipment: "=filters_per_shipment", interval_months: "=shipment_interval_months", first_pct: "=first_shipment_discount_pct", member_pct: "=member_discount_pct"}
        FilterDirect Media Cabinet MERV 11: {price: "=price_per_filter_usd", per_shipment: "=filters_per_shipment", interval_months: "=shipment_interval_months", first_pct: "=first_shipment_discount_pct", member_pct: "=member_discount_pct"}
        FilterDirect Media Cabinet MERV 13: {price: "=price_per_filter_usd", per_shipment: "=filters_per_shipment", interval_months: "=shipment_interval_months", first_pct: "=first_shipment_discount_pct", member_pct: "=member_discount_pct"}
        FilterDirect Media Cabinet MERV 16: {price: "=price_per_filter_usd", per_shipment: "=filters_per_shipment", interval_months: "=shipment_interval_months", first_pct: "=first_shipment_discount_pct", member_pct: "=member_discount_pct"}

  - id: filter_pause_and_skip
    subject: [filter_pause, filter_resume, filter_size_update]
    rule: >-
      A subscriber may skip a single shipment up to skips_per_12_months times, or pause shipments up to pauses_per_12_months
      times for no more than max_pause_months each, when the request arrives at least skip_notice_days before the ship date; a
      later request applies from the following cycle. A pause is accepted only while fewer than pauses_per_12_months pauses have
      been taken in the preceding 12 months. A paused subscription resumes on paused_until, and one still paused beyond
      max_pause_months is cancelled. A charge that fails is retried every failed_payment_retry_days days up to
      failed_payment_retries times, after which shipments pause until a card is updated.
    eligibility:
      - id: pause_allowance
        applies_to: [filter_pause]
        kind: authorization
        condition: A pause is accepted only while fewer than pauses_per_12_months pauses have been taken in the preceding 12 months.
        evidence_fields: [filter_subscriptions.subscription_id, filter_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [filter_subscriptions.subscription_id]
          action_bindings:
            filter_subscriptions.subscription_id: subscription_id
    measures: [filter_msr_pauses_12m, filter_msr_skips_12m]
    params:
      per_tier:
        FilterDirect Standard MERV 8: {skips: "=skips_per_12_months", pauses: "=pauses_per_12_months", max_pause: "=max_pause_months", notice_days: "=skip_notice_days"}
        FilterDirect Pleated MERV 11: {skips: "=skips_per_12_months", pauses: "=pauses_per_12_months", max_pause: "=max_pause_months", notice_days: "=skip_notice_days"}
        FilterDirect Allergen MERV 13: {skips: "=skips_per_12_months", pauses: "=pauses_per_12_months", max_pause: "=max_pause_months", notice_days: "=skip_notice_days"}
        FilterDirect Media Cabinet MERV 11: {skips: "=skips_per_12_months", pauses: "=pauses_per_12_months", max_pause: "=max_pause_months", notice_days: "=skip_notice_days"}
        FilterDirect Media Cabinet MERV 13: {skips: "=skips_per_12_months", pauses: "=pauses_per_12_months", max_pause: "=max_pause_months", notice_days: "=skip_notice_days"}
        FilterDirect Media Cabinet MERV 16: {skips: "=skips_per_12_months", pauses: "=pauses_per_12_months", max_pause: "=max_pause_months", notice_days: "=skip_notice_days"}

  - id: filter_size_changes
    subject: [filter_size_update, filter_charge]
    rule: >-
      A size change requested at least size_change_notice_days before the ship date applies to that shipment, otherwise to the
      next, and carries size_change_fee_usd where it is above 0.00. A size taken from the equipment record at sign-up is used
      where auto_size_from_equipment_record is true. A media cabinet grade can be shipped only to a home whose system has a media
      cabinet of the grade's depth.
    eligibility: []
    params:
      per_tier:
        FilterDirect Standard MERV 8: {notice_days: "=size_change_notice_days", fee: "=size_change_fee_usd", depth: "=filter_depth_in"}
        FilterDirect Pleated MERV 11: {notice_days: "=size_change_notice_days", fee: "=size_change_fee_usd", depth: "=filter_depth_in"}
        FilterDirect Allergen MERV 13: {notice_days: "=size_change_notice_days", fee: "=size_change_fee_usd", depth: "=filter_depth_in"}
        FilterDirect Media Cabinet MERV 11: {notice_days: "=size_change_notice_days", fee: "=size_change_fee_usd", depth: "=filter_depth_in"}
        FilterDirect Media Cabinet MERV 13: {notice_days: "=size_change_notice_days", fee: "=size_change_fee_usd", depth: "=filter_depth_in"}
        FilterDirect Media Cabinet MERV 16: {notice_days: "=size_change_notice_days", fee: "=size_change_fee_usd", depth: "=filter_depth_in"}

  - id: filter_shipment_problems
    subject: [filter_credit]
    rule: >-
      A shipment reported damaged no later than damaged_claim_window_days after delivery is credited in full by a
      damaged_shipment_credit naming the shipment, and replacement filters ship with the next cycle. A shipment in a size other
      than the one on the subscription, reported no later than wrong_size_claim_window_days after delivery, is credited by a
      wrong_size_credit and the correct size is reshipped free where wrong_size_reship_free is true. A credit is posted only once
      per shipment and credit kind. A filter the subscriber ordered in the wrong size is not credited; unopened, it may be returned
      within customer_error_return_window_days less customer_error_return_fee_pct.
    eligibility:
      - id: one_credit_per_shipment
        applies_to: [filter_credit]
        kind: dedup
        condition: A credit is posted only once per shipment and credit kind.
        evidence_fields: [filter_entries.source_entry_id, filter_entries.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [filter_entries.source_entry_id]
          action_bindings:
            filter_entries.source_entry_id: source_entry_id
        dedup_contract:
          table: filter_entries
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {line_type: [damaged_shipment_credit, wrong_size_credit]}
          distinct_fields: []
    params:
      per_tier:
        FilterDirect Standard MERV 8: {damaged_days: "=damaged_claim_window_days", wrong_size_days: "=wrong_size_claim_window_days", return_days: "=customer_error_return_window_days"}
        FilterDirect Pleated MERV 11: {damaged_days: "=damaged_claim_window_days", wrong_size_days: "=wrong_size_claim_window_days", return_days: "=customer_error_return_window_days"}
        FilterDirect Allergen MERV 13: {damaged_days: "=damaged_claim_window_days", wrong_size_days: "=wrong_size_claim_window_days", return_days: "=customer_error_return_window_days"}
        FilterDirect Media Cabinet MERV 11: {damaged_days: "=damaged_claim_window_days", wrong_size_days: "=wrong_size_claim_window_days", return_days: "=customer_error_return_window_days"}
        FilterDirect Media Cabinet MERV 13: {damaged_days: "=damaged_claim_window_days", wrong_size_days: "=wrong_size_claim_window_days", return_days: "=customer_error_return_window_days"}
        FilterDirect Media Cabinet MERV 16: {damaged_days: "=damaged_claim_window_days", wrong_size_days: "=wrong_size_claim_window_days", return_days: "=customer_error_return_window_days"}

  - id: filter_cancellation
    subject: [filter_cancel]
    rule: >-
      A subscription may be cancelled at any time with no fee where cancellation_fee_usd is 0.00; a cancellation received at
      least cancellation_cutoff_days before the ship date stops that shipment, and a later one takes effect after it ships.
      Shipments already sent are not refunded except under filter_shipment_problems.
    eligibility: []
    params:
      per_tier:
        FilterDirect Standard MERV 8: {fee: "=cancellation_fee_usd", cutoff_days: "=cancellation_cutoff_days"}
        FilterDirect Pleated MERV 11: {fee: "=cancellation_fee_usd", cutoff_days: "=cancellation_cutoff_days"}
        FilterDirect Allergen MERV 13: {fee: "=cancellation_fee_usd", cutoff_days: "=cancellation_cutoff_days"}
        FilterDirect Media Cabinet MERV 11: {fee: "=cancellation_fee_usd", cutoff_days: "=cancellation_cutoff_days"}
        FilterDirect Media Cabinet MERV 13: {fee: "=cancellation_fee_usd", cutoff_days: "=cancellation_cutoff_days"}
        FilterDirect Media Cabinet MERV 16: {fee: "=cancellation_fee_usd", cutoff_days: "=cancellation_cutoff_days"}

  - id: filter_billing
    subject: [filter_payment, filter_charge]
    rule: >-
      Shipments are charged to the card on file on the ship date and paid by the same card the same day. Sales tax is charged at
      the delivery county rate. A balance left by a failed charge is collected by the retries under filter_pause_and_skip, and no
      new shipment leaves while a balance is owing.
    eligibility: []

  - id: filter_product_specifications
    subject: [filter_subscribe, filter_shipment]
    rule: >-
      Each grade ships filters of its merv_rating and filter_depth_in, built on the grade's frame_material with pleat_count_per_foot
      pleats (0 for media filters), with an activated-carbon layer only where odor_control_layer is true, and rated for
      recommended_change_days of use. A grade whose media_cabinet_required is true is sold only to a home with a media cabinet of that
      depth, and where technician_swap_with_tuneup is true a Comfort Club technician installs the filter during a tune-up at no
      charge. Shipments leave from the warehouse by the carrier and arrive in delivery_business_days business days, with a
      signature only where signature_required is true; shipments go only to the subscriber's service address unless
      gift_subscription_allowed is true. A reminder email goes out reminder_email_days_before_ship days before each ship date, and a
      full-year case may be shipped at once where bulk_case_option is true. Charges follow charge_timing to the
      payment_method_required, with tax on the tax_basis.
    eligibility: []
    params:
      per_tier:
        FilterDirect Standard MERV 8: {merv: "=merv_rating", depth: "=filter_depth_in", change_days: "=recommended_change_days"}
        FilterDirect Pleated MERV 11: {merv: "=merv_rating", depth: "=filter_depth_in", change_days: "=recommended_change_days"}
        FilterDirect Allergen MERV 13: {merv: "=merv_rating", depth: "=filter_depth_in", change_days: "=recommended_change_days"}
        FilterDirect Media Cabinet MERV 11: {merv: "=merv_rating", depth: "=filter_depth_in", change_days: "=recommended_change_days"}
        FilterDirect Media Cabinet MERV 13: {merv: "=merv_rating", depth: "=filter_depth_in", change_days: "=recommended_change_days"}
        FilterDirect Media Cabinet MERV 16: {merv: "=merv_rating", depth: "=filter_depth_in", change_days: "=recommended_change_days"}

