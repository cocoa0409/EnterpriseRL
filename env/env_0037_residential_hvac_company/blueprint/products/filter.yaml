# FilterDirect filter subscriptions — product and event policy charter.
# Functional surface: sign-up by filter grade and size, activation on first shipment, shipment cycles and
# charges, shipping fees and the free-shipping threshold, first-shipment and Comfort Club discounts,
# custom-size surcharges, size changes, pauses and skips, failed payments, credits for damaged or wrong-size
# shipments, price changes with notice, combined shipping across subscriptions, and cancellation.

category: filter
display_name: FilterDirect Filter Subscriptions

binding:
  holding_table: filter_subscriptions
  event_tables: [filter_entries]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    subscription_balance: subscription_balance

lifecycle:
  states: [pending, active, paused, cancelled]
  transitions:
    - {from: pending, to: active, by: system, means: "The first shipment leaves the warehouse and is charged."}
    - {from: pending, to: cancelled, by: agent, means: "The subscription is cancelled before the first shipment."}
    - {from: active, to: paused, by: agent, means: "Shipments are paused at the subscriber's request or after failed payment retries."}
    - {from: paused, to: active, by: system, means: "The pause ends or the subscriber resumes shipments."}
    - {from: active, to: cancelled, by: agent, means: "The subscription is cancelled at the subscriber's request."}
    - {from: paused, to: cancelled, by: agent, means: "A paused subscription is cancelled at the subscriber's request or when a pause runs past its limit."}

accounts:
  - key: subscription_balance
    unit: USD
    meaning: Amount the subscriber owes; shipment and fee charges raise it, payments and credits lower it.

parameter_schema:
  merv_rating: Filter efficiency rating shipped, MERV.
  filter_depth_in: Nominal filter depth, inches.
  filters_per_shipment: Filters in each shipment per subscribed size, integer.
  shipment_interval_months: Months between shipments, integer months.
  price_per_filter_usd: Price per filter of a standard size, USD.
  custom_size_surcharge_per_filter_usd: Surcharge per filter for a size not on the standard size list, USD.
  standard_sizes: Nominal sizes stocked without surcharge, list of WxHxD.
  shipping_fee_usd: Shipping fee per shipment below the free-shipping threshold, USD.
  free_shipping_min_order_usd: Shipment charge at or above which shipping is free, USD.
  first_shipment_discount_pct: Discount on the first shipment of a new subscription, percent.
  member_discount_pct: Discount on shipment charges while the subscriber holds an active Comfort Club agreement, percent.
  ship_day_of_month: Day of the month shipments leave the warehouse, integer.
  charge_timing: When a shipment is charged, text.
  payment_method_required: Payment method required on file, text.
  failed_payment_retry_days: Days between automatic retries of a failed charge, integer days.
  failed_payment_retries: Retries before shipments are paused for non-payment, integer.
  pauses_per_12_months: Pauses allowed in any 12 months, integer.
  max_pause_months: Longest pause, integer months.
  skips_per_12_months: Single shipments that may be skipped in any 12 months, integer.
  skip_notice_days: Calendar days before the ship date by which a skip or pause must be requested, integer days.
  size_change_notice_days: Calendar days before the ship date by which a size change applies to that shipment, integer days.
  size_change_fee_usd: Fee for changing the filter size; 0.00 means none, USD.
  damaged_claim_window_days: Calendar days after delivery within which damage must be reported, integer days.
  wrong_size_claim_window_days: Calendar days after delivery within which a wrong size shipped by Harbison must be reported, integer days.
  wrong_size_reship_free: Whether the correct size is reshipped at no charge after a wrong-size claim, boolean.
  customer_error_return_window_days: Calendar days an unopened filter ordered in the wrong size by the subscriber may be returned, integer days.
  customer_error_return_fee_pct: Restocking fee on a subscriber-error return, percent of the filter price.
  price_lock_months: Months a subscriber's price is held after sign-up, integer months.
  price_change_notice_days: Calendar days of notice before a price change applies, integer days.
  cancellation_fee_usd: Fee to cancel; 0.00 means none, USD.
  cancellation_cutoff_days: Calendar days before the ship date by which a cancellation stops that shipment, integer days.
  combined_shipping: Whether shipments of several subscriptions in the same cycle ship together with one shipping fee, boolean.
  max_subscriptions_per_customer: Subscriptions one customer may hold, integer.
  technician_swap_with_tuneup: Whether a Comfort Club technician installs the media filter during a tune-up at no charge, boolean.
  media_cabinet_required: Whether a media cabinet must be installed to use the grade, boolean.
  odor_control_layer: Whether the filter has an activated-carbon layer, boolean.
  recommended_change_days: Days between filter changes the grade is rated for, integer days.
  pleat_count_per_foot: Pleats per foot of the filter media, integer.
  frame_material: Filter frame material, text.
  warehouse: Fulfilment location, text.
  carrier: Shipping carrier, text.
  delivery_business_days: Business days in transit after shipping, integer days.
  signature_required: Whether delivery needs a signature, boolean.
  tax_basis: How sales tax is charged, text.
  gift_subscription_allowed: Whether a subscription may ship to a different address, boolean.
  auto_size_from_equipment_record: Whether the size is taken from the equipment record at sign-up, boolean.
  reminder_email_days_before_ship: Days before shipping that the reminder email goes out, integer days.
  bulk_case_option: Whether a full-year case can be shipped at once, boolean.

