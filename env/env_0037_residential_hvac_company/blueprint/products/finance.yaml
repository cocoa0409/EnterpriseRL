events:
  - type: finance_apply
    target: finance_accounts
    mutation: create
    meaning: A homeowner applies to finance an installation project under a plan.
    grain: One row per application.
    fields:
      finance_account_id: Reference number assigned to the account.
      customer_id: Applicant.
      install_id: Project to be financed.
      variant_name: Plan applied for.
      application_date: Date of application (the date of handling).
      amount_requested: Amount the applicant asks to finance.
    triggers: []

  - type: finance_approve
    target: finance_accounts
    mutation: {transition: {from: applied, to: approved}}
    meaning: The credit decision approves the application.
    grain: One row per transaction.
    fields:
      finance_account_id: Account approved.
      status: Set to approved.
      decision_date: Date of decision.
      credit_tier: Credit tier assigned.
      amount_financed: Approved amount under finance_credit_decision.
      apr_pct: Plan APR.
      term_months: Plan term.
    triggers: []

  - type: finance_decline
    target: finance_accounts
    mutation: {transition: {from: applied, to: declined}}
    meaning: The credit decision declines the application.
    grain: One row per transaction.
    fields:
      finance_account_id: Account declined.
      status: Set to declined.
      decision_date: Date of decision.
      closed_date: Same as decision_date.
    triggers: []

  - type: finance_fund
    target: finance_accounts
    mutation: {transition: {from: approved, to: active}}
    meaning: The loan funds on completion of the installation.
    grain: One row per transaction.
    fields:
      finance_account_id: Account funded.
      install_id: Project funded.
      status: Set to active.
      funded_date: Date of funding.
      amount_financed: Amount disbursed.
      promo_end_date: Last day of the promotional period, else empty.
      monthly_payment: Required monthly payment under finance_funding.
      payment_due_day: Day of month payments are due.
    triggers:
      - event: finance:finance_disbursement
        map: {finance_account_id: finance_account_id, install_id: install_id, amount: amount_financed, line_type: disbursement}

  - type: finance_disbursement
    target: finance_transactions
    meaning: The amount financed is paid to Harbison for the project and becomes the borrower's balance.
    grain: One row per funded account.
    distinguish_by: [install_id]
    fields:
      finance_account_id: Account.
      customer_id: Borrower.
      line_type: Always disbursement.
      statement_period: Month of funding.
      amount: Amount disbursed.
      posted_date: Date of funding.
      install_id: Project paid.
    account: loan_balance
    direction: in
    triggers:
      - event: install:install_payment
        map: {install_id: install_id, customer_id: customer_id, finance_account_id: finance_account_id, amount: amount, line_type: financing_disbursement, payment_method: financing}

  - type: finance_statement_charge
    target: finance_transactions
    meaning: Interest, deferred interest, a late fee or a returned-payment fee is posted on a statement.
    grain: One row per charge kind per statement period, and per returned payment for returned-payment fees.
    distinguish_by: [line_type, statement_period, source_txn_id]
    fields:
      finance_account_id: Account.
      customer_id: Borrower.
      line_type: interest, deferred_interest_assessment, late_fee or returned_payment_fee.
      statement_period: Statement month.
      amount: Amount charged.
      posted_date: Date posted.
      source_txn_id: The returned payment a returned-payment fee concerns, else empty.
    account: loan_balance
    direction: in
    triggers: []

  - type: finance_payment
    target: finance_transactions
    meaning: The borrower makes a payment.
    grain: One row per payment received.
    distinguish_by: [payment_reference]
    fields:
      finance_account_id: Account.
      customer_id: Borrower.
      line_type: Always payment.
      statement_period: Statement month the payment posts in.
      amount: Amount paid.
      posted_date: Date posted.
      payment_method: autopay_ach, online_ach, debit_card, check or phone_payment.
      payment_reference: Confirmation number.
    account: loan_balance
    direction: out
    triggers: []

  - type: finance_payment_reversal
    target: finance_transactions
    meaning: A payment is returned unpaid by the borrower's bank and its amount is added back to the balance.
    grain: One row per returned payment.
    distinguish_by: [source_txn_id]
    fields:
      finance_account_id: Account.
      customer_id: Borrower.
      line_type: Always payment_returned.
      statement_period: Statement month of the return.
      amount: Amount of the returned payment.
      posted_date: Date of return.
      source_txn_id: The payment returned.
    account: loan_balance
    direction: in
    triggers:
      - event: finance:finance_statement_charge
        map: {finance_account_id: finance_account_id, customer_id: customer_id, source_txn_id: source_txn_id, statement_period: statement_period, line_type: returned_payment_fee}

  - type: finance_adjustment
    target: finance_transactions
    meaning: A merchant refund from Harbison or a reversal of a fee or interest charge reduces the balance.
    grain: One row per adjustment, tied to the refund entry or the charge it reverses.
    distinguish_by: [line_type, source_txn_id, install_entry_id]
    fields:
      finance_account_id: Account.
      customer_id: Borrower.
      line_type: merchant_refund_credit, late_fee_reversal or interest_reversal.
      statement_period: Statement month posted.
      amount: Amount credited.
      posted_date: Date posted.
      install_id: Project of a merchant refund, else empty.
      install_entry_id: Installation refund entry of a merchant refund, else empty.
      source_txn_id: The charge a reversal reverses, else empty.
    account: loan_balance
    direction: out
    triggers: []

  - type: finance_delinquent
    target: finance_accounts
    mutation: {transition: {from: active, to: delinquent}}
    meaning: A required payment reaches the delinquency threshold.
    grain: One row per transaction.
    fields:
      finance_account_id: Account.
      status: Set to delinquent.
    triggers: []

  - type: finance_cure
    target: finance_accounts
    mutation: {transition: {from: delinquent, to: active}}
    meaning: Every past-due amount is paid.
    grain: One row per transaction.
    fields:
      finance_account_id: Account.
      status: Set to active.
    triggers: []

  - type: finance_payoff
    target: finance_accounts
    mutation:
      transition:
        - {from: active, to: paid_off}
        - {from: delinquent, to: paid_off}
    meaning: The balance reaches zero and the account is paid off.
    grain: One row per transaction.
    fields:
      finance_account_id: Account.
      status: Set to paid_off.
      closed_date: Date the balance reached zero.
    triggers: []

  - type: finance_chargeoff
    target: finance_accounts
    mutation: {transition: {from: delinquent, to: charged_off}}
    meaning: A delinquent account reaches the charge-off threshold.
    grain: One row per transaction.
    fields:
      finance_account_id: Account.
      status: Set to charged_off.
      closed_date: Date of charge-off.
    triggers: []

  - type: finance_withdraw
    target: finance_accounts
    mutation:
      transition:
        - {from: applied, to: withdrawn}
        - {from: approved, to: withdrawn}
    meaning: The borrower's confirmed withdrawal ends an application or approval before funding.
    grain: One row per transaction.
    fields:
      finance_account_id: Account.
      status: Set to withdrawn.
      closed_date: Date of withdrawal.
    triggers: []

  - type: finance_expire
    target: finance_accounts
    mutation: {transition: {from: approved, to: expired}}
    meaning: An approval passes its validity without funding.
    grain: One row per transaction.
    fields:
      finance_account_id: Account.
      status: Set to expired.
      closed_date: Day after the approval's last valid day.
    triggers: []

  - type: finance_plan_change
    target: finance_accounts
    mutation: update
    meaning: An approval is moved to another plan at the borrower's confirmed request before funding.
    grain: One row per transaction.
    fields:
      finance_account_id: Account.
      variant_name: New plan.
      apr_pct: New plan's APR.
      term_months: New plan's term.
      amount_financed: Approved amount under the new plan.
    triggers: []

  - type: finance_servicing_update
    target: finance_accounts
    mutation: update
    meaning: The borrower's due day or autopay enrollment is changed.
    grain: One row per transaction.
    fields:
      finance_account_id: Account.
      payment_due_day: New due day.
      autopay_enrolled: New autopay setting.
      apr_pct: APR after the autopay reduction is added or removed.
    triggers: []

measures:
  - id: finance_msr_customer_exposure
    window: The customer's accounts as they stand on the date of handling.
    measure: Sum of amount_financed over the customer's accounts in approved, active or delinquent status, plus amount_requested on the application being decided.
  - id: finance_msr_days_past_due
    window: From the due date of the oldest unpaid required payment to the date of handling.
    measure: Calendar days elapsed since that due date, counted from the day after it; 0 when no required payment is unpaid.
  - id: finance_msr_late_fee_reversals_12m
    window: Rolling 12 calendar months ending on the date of handling.
    measure: Count of finance_adjustment entries with line_type late_fee_reversal on the account within the window.
  - id: finance_msr_due_day_changes_12m
    window: Rolling 12 calendar months ending on the date of handling.
    measure: Count of finance_servicing_update writes on the account that changed payment_due_day within the window.
  - id: finance_msr_promo_balance_at_end
    window: The promotional period, from funded_date through promo_end_date inclusive.
    measure: Account balance at the end of promo_end_date, excluding any deferred interest not yet assessed.
  - id: finance_msr_accrued_deferred_interest
    window: From funded_date through promo_end_date inclusive.
    measure: Sum over each day of the daily promotional principal balance times deferred_interest_apr_pct divided by 100 and by 365, rounded to the cent half up at the end.
  - id: finance_msr_returned_autopay_12m
    window: Rolling 12 calendar months ending on the date of handling.
    measure: Count of finance_payment_reversal entries on the account whose returned payment had payment_method autopay_ach.

policies:
  - id: finance_agg_multi_holding
    subject: [finance_apply]
    rule: >-
      A customer may hold more than one financing account, one per installation project, up to max_open_accounts_per_customer
      accounts in approved, active or delinquent status at once; declined, withdrawn, expired, paid-off and charged-off accounts
      do not count.
    eligibility: []
    params:
      max_per_customer: 2

  - id: finance_agg_total_exposure
    subject: [finance_apply, finance_approve, finance_decline]
    rule: >-
      A project can be financed by only one account: an application is accepted only when no other account for the same
      installation project is in applied, approved, active or delinquent status. Credit is decided on the customer's whole
      exposure: the amounts financed on every approved, active or delinquent account plus the amount requested may not exceed
      the exposure cap for the credit tier the decision assigns; when it would, the application is approved for the largest
      amount within the cap that still meets the plan's min_amount_financed_usd, or declined when no such amount exists. The
      exposure caps by credit tier are fixed below and do not vary by plan.
    eligibility:
      - id: one_account_per_project
        applies_to: [finance_apply]
        kind: dedup
        condition: an application is accepted only when no other account for the same installation project is in applied, approved, active or delinquent status
        evidence_fields: [finance_accounts.install_id, finance_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.install_id]
          action_bindings:
            finance_accounts.install_id: install_id
        dedup_contract:
          table: finance_accounts
          mode: separate_record
          object_bindings: {install_id: install_id}
          duplicate_filters: {status: [applied, approved, active, delinquent]}
          distinct_fields: []
    measures: [finance_msr_customer_exposure]
    params:
      exposure_cap_by_credit_tier:
        tier_1: 65000.00
        tier_2: 40000.00
        tier_3: 25000.00
        tier_4: 15000.00

  - id: finance_application_eligibility
    subject: [finance_apply]
    rule: >-
      An application is taken only for a Harbison installation project in signed or scheduled status, under a plan listed in that
      package's eligible_financing_plans, for an amount between the plan's min_amount_financed_usd and max_amount_financed_usd
      that does not exceed the project's contract price plus approved change orders, upgrades and accessories less credits known
      at application. An application is taken only for a project in signed or scheduled status. A customer whose earlier
      application was declined may apply again only when the date of handling is more than reapply_wait_days calendar days after
      that decline was decided. Reapply days are counted as calendar days with the decline's decision_date as day 0. A
      co-applicant may join where co_applicant_allowed is true, and a soft prequalification is offered first where
      soft_prequalification_available is true; the applicant states their own income and consent, and the credit decision rests
      on the bureau report, never on the applicant's own statement of their credit standing.
    eligibility:
      - id: project_not_installed
        applies_to: [finance_apply]
        kind: state
        condition: An application is taken only for a project in signed or scheduled status.
        evidence_fields: [install_projects.install_id, install_projects.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_projects.install_id]
          action_bindings:
            install_projects.install_id: install_id
        state_contract:
          field: install_projects.status
          allowed: [signed, scheduled]
      - id: reapply_wait
        applies_to: [finance_apply]
        kind: time
        condition: A customer whose earlier application was declined may apply again only when the date of handling is more than reapply_wait_days calendar days after that decline was decided.
        evidence_fields: [finance_accounts.customer_id, finance_accounts.status, finance_accounts.decision_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.customer_id]
          action_bindings:
            finance_accounts.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: that decline was decided
          anchor_source: finance_accounts.decision_date
          relation: not_before
          duration_source: variants.reapply_wait_days
          unit: calendar_days
          counting_rule: Reapply days are counted as calendar days with the decline's decision_date as day 0.
          boundary: exclusive
    params:
      per_tier:
        12-Month Same-As-Cash Deferred Interest Plan: {min_amount: "=min_amount_financed_usd", max_amount: "=max_amount_financed_usd", reapply_days: "=reapply_wait_days"}
        18-Month 0% APR Equal Payment Plan: {min_amount: "=min_amount_financed_usd", max_amount: "=max_amount_financed_usd", reapply_days: "=reapply_wait_days"}
        36-Month 0% APR Equal Payment Plan: {min_amount: "=min_amount_financed_usd", max_amount: "=max_amount_financed_usd", reapply_days: "=reapply_wait_days"}
        60-Month 5.99% APR Fixed-Rate Plan: {min_amount: "=min_amount_financed_usd", max_amount: "=max_amount_financed_usd", reapply_days: "=reapply_wait_days"}
        120-Month 7.99% APR Fixed-Rate Plan: {min_amount: "=min_amount_financed_usd", max_amount: "=max_amount_financed_usd", reapply_days: "=reapply_wait_days"}
        144-Month 9.99% APR Fixed-Rate Plan: {min_amount: "=min_amount_financed_usd", max_amount: "=max_amount_financed_usd", reapply_days: "=reapply_wait_days"}

  - id: finance_credit_decision
    subject: [finance_approve, finance_decline]
    rule: >-
      The credit decision assigns a credit tier from the bureau report and approves the application only when that tier is in
      the plan's eligible_credit_tiers; an applicant whose tier is not eligible for the requested plan is declined for that plan
      and may apply for another plan whose tiers include it. A tier_3 approval requires a down payment of tier_3_down_payment_pct
      of the project amount and a tier_4 approval tier_4_down_payment_pct, both rounded to the cent half up; the approved amount
      is the amount requested less the required down payment, within the plan's limits and the exposure cap. The approval
      records the plan's apr_pct and term_months, and is valid for funding for approval_valid_days after the decision.
    eligibility:
      - id: tier_eligible
        applies_to: [finance_approve]
        kind: authorization
        condition: approves the application only when that tier is in the plan's eligible_credit_tiers
        evidence_fields: [finance_accounts.finance_account_id, finance_accounts.credit_tier, finance_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.finance_account_id]
          action_bindings:
            finance_accounts.finance_account_id: finance_account_id
    params:
      per_tier:
        12-Month Same-As-Cash Deferred Interest Plan: {tiers: "=eligible_credit_tiers", tier_3_down_pct: "=tier_3_down_payment_pct", tier_4_down_pct: "=tier_4_down_payment_pct", valid_days: "=approval_valid_days"}
        18-Month 0% APR Equal Payment Plan: {tiers: "=eligible_credit_tiers", tier_3_down_pct: "=tier_3_down_payment_pct", tier_4_down_pct: "=tier_4_down_payment_pct", valid_days: "=approval_valid_days"}
        36-Month 0% APR Equal Payment Plan: {tiers: "=eligible_credit_tiers", tier_3_down_pct: "=tier_3_down_payment_pct", tier_4_down_pct: "=tier_4_down_payment_pct", valid_days: "=approval_valid_days"}
        60-Month 5.99% APR Fixed-Rate Plan: {tiers: "=eligible_credit_tiers", tier_3_down_pct: "=tier_3_down_payment_pct", tier_4_down_pct: "=tier_4_down_payment_pct", valid_days: "=approval_valid_days"}
        120-Month 7.99% APR Fixed-Rate Plan: {tiers: "=eligible_credit_tiers", tier_3_down_pct: "=tier_3_down_payment_pct", tier_4_down_pct: "=tier_4_down_payment_pct", valid_days: "=approval_valid_days"}
        144-Month 9.99% APR Fixed-Rate Plan: {tiers: "=eligible_credit_tiers", tier_3_down_pct: "=tier_3_down_payment_pct", tier_4_down_pct: "=tier_4_down_payment_pct", valid_days: "=approval_valid_days"}

  - id: finance_funding
    subject: [finance_fund, finance_disbursement]
    rule: >-
      An approved account funds on the plan's funding_trigger, the day the installation it finances is completed, and only then; funding never happens at
      signing or at scheduling. An approval funds only when the installation is completed no later than approval_valid_days
      calendar days after the approval was decided. Approval days are counted as calendar days with the decision_date as day 0,
      and an installation completed on the last valid day still funds. Funding disburses the approved amount_financed to the
      project, sets the first payment due first_payment_due_days after funded_date with that day of the month as payment_due_day
      (a day after the 28th moves to the 28th), sets promo_end_date to the day before the same calendar date promo_period_months
      after funded_date for promotional plans, and sets monthly_payment, whatever the plan's payment_structure, to amount_financed times payment_factor_pct divided by
      100, rounded up to the next cent and never below minimum_payment_floor_usd.
    eligibility:
      - id: funds_within_approval
        applies_to: [finance_fund]
        kind: time
        condition: An approval funds only when the installation is completed no later than approval_valid_days calendar days after the approval was decided.
        evidence_fields: [finance_accounts.finance_account_id, finance_accounts.decision_date, install_projects.installed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.finance_account_id]
          action_bindings:
            finance_accounts.finance_account_id: finance_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the approval was decided
          anchor_source: finance_accounts.decision_date
          relation: not_after
          duration_source: variants.approval_valid_days
          unit: calendar_days
          counting_rule: Approval days are counted as calendar days with the decision_date as day 0, and an installation completed on the last valid day still funds.
          boundary: inclusive
    formula:
      monthly_payment: max(minimum_payment_floor_usd, amount_financed * payment_factor_pct / 100)
    params:
      per_tier:
        12-Month Same-As-Cash Deferred Interest Plan: {factor_pct: "=payment_factor_pct", floor: "=minimum_payment_floor_usd", first_due_days: "=first_payment_due_days", promo_months: "=promo_period_months"}
        18-Month 0% APR Equal Payment Plan: {factor_pct: "=payment_factor_pct", floor: "=minimum_payment_floor_usd", first_due_days: "=first_payment_due_days", promo_months: "=promo_period_months"}
        36-Month 0% APR Equal Payment Plan: {factor_pct: "=payment_factor_pct", floor: "=minimum_payment_floor_usd", first_due_days: "=first_payment_due_days", promo_months: "=promo_period_months"}
        60-Month 5.99% APR Fixed-Rate Plan: {factor_pct: "=payment_factor_pct", floor: "=minimum_payment_floor_usd", first_due_days: "=first_payment_due_days", promo_months: "=promo_period_months"}
        120-Month 7.99% APR Fixed-Rate Plan: {factor_pct: "=payment_factor_pct", floor: "=minimum_payment_floor_usd", first_due_days: "=first_payment_due_days", promo_months: "=promo_period_months"}
        144-Month 9.99% APR Fixed-Rate Plan: {factor_pct: "=payment_factor_pct", floor: "=minimum_payment_floor_usd", first_due_days: "=first_payment_due_days", promo_months: "=promo_period_months"}

  - id: finance_payment_terms
    subject: [finance_payment, finance_statement_charge, finance_payment_reversal]
    rule: >-
      Statements follow the statement_period_basis, running by calendar month, and a payment is due each month on payment_due_day.
      Plans whose interest_rate_type is fixed accrue interest from funding; promotional plans follow finance_deferred_interest. A payment is applied in the plan's
      payment_application_order: returned-payment fees, then late fees, then interest, then principal. Paying more than the
      monthly payment, or paying the balance off early, carries no penalty where prepayment_penalty is false and shortens the
      term without changing the monthly payment. On fixed-rate plans interest accrues as daily simple interest at apr_pct on the
      daily principal balance over a 365-day year and posts as one interest charge for each statement period; on equal-payment
      0% plans no interest posts during the promotional period. A payment returned unpaid by the borrower's bank is added back
      to the balance as a payment_returned entry naming that payment, and the original payment is treated as never made. No
      annual fee is charged where annual_fee_usd is 0.00, and a payment made by phone carries phone_payment_fee_usd.
    eligibility: []
    params:
      per_tier:
        12-Month Same-As-Cash Deferred Interest Plan: {application_order: "=payment_application_order", accrual: "=interest_accrual_basis", prepayment_penalty: "=prepayment_penalty"}
        18-Month 0% APR Equal Payment Plan: {application_order: "=payment_application_order", accrual: "=interest_accrual_basis", prepayment_penalty: "=prepayment_penalty"}
        36-Month 0% APR Equal Payment Plan: {application_order: "=payment_application_order", accrual: "=interest_accrual_basis", prepayment_penalty: "=prepayment_penalty"}
        60-Month 5.99% APR Fixed-Rate Plan: {application_order: "=payment_application_order", accrual: "=interest_accrual_basis", prepayment_penalty: "=prepayment_penalty"}
        120-Month 7.99% APR Fixed-Rate Plan: {application_order: "=payment_application_order", accrual: "=interest_accrual_basis", prepayment_penalty: "=prepayment_penalty"}
        144-Month 9.99% APR Fixed-Rate Plan: {application_order: "=payment_application_order", accrual: "=interest_accrual_basis", prepayment_penalty: "=prepayment_penalty"}

  - id: finance_deferred_interest
    subject: [finance_statement_charge]
    rule: >-
      On a plan whose deferred_interest is true, interest accrues from funded_date on the daily promotional balance at
      deferred_interest_apr_pct but is not charged while the promotion lasts. A reminder of the remaining promotional balance is
      sent promo_expiry_notice_days before promo_end_date. A deferred-interest assessment posts only when a promotional balance
      remains unpaid at the end of promo_end_date. The assessment follows the deferred_interest_assessment_basis: it equals all interest accrued from funded_date through
      promo_end_date, posted once as a deferred_interest_assessment on the first statement after promo end; when the balance is
      paid in full by the end of promo_end_date, nothing is assessed. From the day after promo_end_date any remaining balance on a
      promotional plan accrues interest at post_promo_apr_pct, posted monthly as interest. Merchant refunds and payments posted on
      or before promo_end_date count toward paying the promotional balance. On equal-payment plans no interest is deferred, and the equal_payment_promo_balance_rule applies: a balance left at promo end
      simply starts accruing at post_promo_apr_pct.
    eligibility:
      - id: promo_balance_unpaid
        applies_to: [finance_statement_charge]
        kind: authorization
        condition: A deferred-interest assessment posts only when a promotional balance remains unpaid at the end of promo_end_date.
        evidence_fields: [finance_accounts.finance_account_id, finance_accounts.promo_end_date, finance_accounts.account_balance, finance_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.finance_account_id]
          action_bindings:
            finance_accounts.finance_account_id: finance_account_id
    formula:
      when: deferred_interest
      deferred_interest_assessment: finance_msr_accrued_deferred_interest if finance_msr_promo_balance_at_end > 0 else 0
    measures: [finance_msr_promo_balance_at_end, finance_msr_accrued_deferred_interest]
    params:
      per_tier:
        12-Month Same-As-Cash Deferred Interest Plan: {deferred: "=deferred_interest", deferred_apr: "=deferred_interest_apr_pct", post_promo_apr: "=post_promo_apr_pct", notice_days: "=promo_expiry_notice_days"}
        18-Month 0% APR Equal Payment Plan: {deferred: "=deferred_interest", deferred_apr: "=deferred_interest_apr_pct", post_promo_apr: "=post_promo_apr_pct", notice_days: "=promo_expiry_notice_days"}
        36-Month 0% APR Equal Payment Plan: {deferred: "=deferred_interest", deferred_apr: "=deferred_interest_apr_pct", post_promo_apr: "=post_promo_apr_pct", notice_days: "=promo_expiry_notice_days"}
        60-Month 5.99% APR Fixed-Rate Plan: {deferred: "=deferred_interest", deferred_apr: "=deferred_interest_apr_pct", post_promo_apr: "=post_promo_apr_pct", notice_days: "=promo_expiry_notice_days"}
        120-Month 7.99% APR Fixed-Rate Plan: {deferred: "=deferred_interest", deferred_apr: "=deferred_interest_apr_pct", post_promo_apr: "=post_promo_apr_pct", notice_days: "=promo_expiry_notice_days"}
        144-Month 9.99% APR Fixed-Rate Plan: {deferred: "=deferred_interest", deferred_apr: "=deferred_interest_apr_pct", post_promo_apr: "=post_promo_apr_pct", notice_days: "=promo_expiry_notice_days"}

  - id: finance_late_and_returned_fees
    subject: [finance_statement_charge, finance_payment_reversal, finance_servicing_update]
    rule: >-
      A late fee is charged only when the required payment is still unpaid more than late_fee_grace_days calendar days after its
      due date. Late-fee days are counted as calendar days with the due date as day 0. The late fee is late_fee_usd, never more
      than late_fee_max_pct_of_payment_due percent of the payment that was due, and only one late fee is charged per statement
      period. Each returned payment is charged one returned_payment_fee of returned_payment_fee_usd naming that payment; a returned
      payment also leaves the payment it replaced unpaid, so a late fee may follow if the grace period then passes. When
      autopay_removal_after_returns autopay payments have been returned within 12 months, autopay is removed and any autopay APR
      reduction ends with it.
    eligibility:
      - id: late_after_grace
        applies_to: [finance_statement_charge]
        kind: time
        condition: A late fee is charged only when the required payment is still unpaid more than late_fee_grace_days calendar days after its due date.
        evidence_fields: [finance_accounts.finance_account_id, finance_accounts.payment_due_day, finance_transactions.statement_period]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.finance_account_id]
          action_bindings:
            finance_accounts.finance_account_id: finance_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its due date
          anchor_source: finance_accounts.payment_due_day
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: Late-fee days are counted as calendar days with the due date as day 0.
          boundary: exclusive
      - id: one_late_fee_per_period
        applies_to: [finance_statement_charge]
        kind: dedup
        condition: only one late fee is charged per statement period
        evidence_fields: [finance_transactions.finance_account_id, finance_transactions.statement_period, finance_transactions.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_transactions.finance_account_id, finance_transactions.statement_period]
          action_bindings:
            finance_transactions.finance_account_id: finance_account_id
            finance_transactions.statement_period: statement_period
        dedup_contract:
          table: finance_transactions
          mode: separate_record
          object_bindings: {finance_account_id: finance_account_id, statement_period: statement_period}
          duplicate_filters: {line_type: [late_fee]}
          distinct_fields: []
    measures: [finance_msr_returned_autopay_12m]
    params:
      per_tier:
        12-Month Same-As-Cash Deferred Interest Plan: {late_fee: "=late_fee_usd", grace_days: "=late_fee_grace_days", returned_fee: "=returned_payment_fee_usd", autopay_removal_returns: "=autopay_removal_after_returns"}
        18-Month 0% APR Equal Payment Plan: {late_fee: "=late_fee_usd", grace_days: "=late_fee_grace_days", returned_fee: "=returned_payment_fee_usd", autopay_removal_returns: "=autopay_removal_after_returns"}
        36-Month 0% APR Equal Payment Plan: {late_fee: "=late_fee_usd", grace_days: "=late_fee_grace_days", returned_fee: "=returned_payment_fee_usd", autopay_removal_returns: "=autopay_removal_after_returns"}
        60-Month 5.99% APR Fixed-Rate Plan: {late_fee: "=late_fee_usd", grace_days: "=late_fee_grace_days", returned_fee: "=returned_payment_fee_usd", autopay_removal_returns: "=autopay_removal_after_returns"}
        120-Month 7.99% APR Fixed-Rate Plan: {late_fee: "=late_fee_usd", grace_days: "=late_fee_grace_days", returned_fee: "=returned_payment_fee_usd", autopay_removal_returns: "=autopay_removal_after_returns"}
        144-Month 9.99% APR Fixed-Rate Plan: {late_fee: "=late_fee_usd", grace_days: "=late_fee_grace_days", returned_fee: "=returned_payment_fee_usd", autopay_removal_returns: "=autopay_removal_after_returns"}

  - id: finance_delinquency_and_chargeoff
    subject: [finance_delinquent, finance_cure, finance_chargeoff]
    rule: >-
      Days past due are counted from the day after the due date of the oldest required payment still unpaid. An account becomes
      delinquent when that count reaches delinquent_after_days_past_due, and a late payment is reported to the credit bureaus when
      it reaches credit_reporting_days_past_due; a reported late payment stays reported because it was accurate. A delinquent
      account returns to active on the day a payment brings every past-due amount, including fees, current. A delinquent account
      is charged off only when its days past due reach chargeoff_after_days_past_due. A charged-off account is closed to new
      payments by Harbison and passed to the recovery unit of the servicing_partner.
    eligibility:
      - id: chargeoff_threshold
        applies_to: [finance_chargeoff]
        kind: authorization
        condition: A delinquent account is charged off only when its days past due reach chargeoff_after_days_past_due.
        evidence_fields: [finance_accounts.finance_account_id, finance_accounts.payment_due_day, finance_transactions.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.finance_account_id]
          action_bindings:
            finance_accounts.finance_account_id: finance_account_id
    measures: [finance_msr_days_past_due]
    params:
      per_tier:
        12-Month Same-As-Cash Deferred Interest Plan: {delinquent_days: "=delinquent_after_days_past_due", reporting_days: "=credit_reporting_days_past_due", chargeoff_days: "=chargeoff_after_days_past_due"}
        18-Month 0% APR Equal Payment Plan: {delinquent_days: "=delinquent_after_days_past_due", reporting_days: "=credit_reporting_days_past_due", chargeoff_days: "=chargeoff_after_days_past_due"}
        36-Month 0% APR Equal Payment Plan: {delinquent_days: "=delinquent_after_days_past_due", reporting_days: "=credit_reporting_days_past_due", chargeoff_days: "=chargeoff_after_days_past_due"}
        60-Month 5.99% APR Fixed-Rate Plan: {delinquent_days: "=delinquent_after_days_past_due", reporting_days: "=credit_reporting_days_past_due", chargeoff_days: "=chargeoff_after_days_past_due"}
        120-Month 7.99% APR Fixed-Rate Plan: {delinquent_days: "=delinquent_after_days_past_due", reporting_days: "=credit_reporting_days_past_due", chargeoff_days: "=chargeoff_after_days_past_due"}
        144-Month 9.99% APR Fixed-Rate Plan: {delinquent_days: "=delinquent_after_days_past_due", reporting_days: "=credit_reporting_days_past_due", chargeoff_days: "=chargeoff_after_days_past_due"}

  - id: finance_merchant_refund
    subject: [finance_adjustment]
    rule: >-
      When Harbison refunds money on a financed installation project to the financing account, the refund posts on the account as
      a merchant_refund_credit naming the installation refund entry and the project, in the same amount and on the same day.
      It is applied as the plan's merchant_refund_application states: it reduces the balance as principal, the monthly payment is
      not recalculated, and on a promotional plan it counts toward paying the promotional balance. A merchant refund credit is
      posted only for an installation refund entry returned to this account. A merchant refund never reverses interest or fees
      already posted, and when it exceeds the balance the excess is returned to the borrower by the partner bank.
    eligibility:
      - id: refund_entry_exists
        applies_to: [finance_adjustment]
        kind: dedup
        condition: A merchant refund credit is posted only for an installation refund entry returned to this account.
        evidence_fields: [install_ledger.install_entry_id, install_ledger.finance_account_id, finance_transactions.install_entry_id, finance_transactions.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_ledger.install_entry_id]
          action_bindings:
            install_ledger.install_entry_id: install_entry_id
        dedup_contract:
          table: finance_transactions
          mode: separate_record
          object_bindings: {install_entry_id: install_entry_id}
          duplicate_filters: {line_type: [merchant_refund_credit]}
          distinct_fields: []
    params:
      per_tier:
        12-Month Same-As-Cash Deferred Interest Plan: {application: "=merchant_refund_application"}
        18-Month 0% APR Equal Payment Plan: {application: "=merchant_refund_application"}
        36-Month 0% APR Equal Payment Plan: {application: "=merchant_refund_application"}
        60-Month 5.99% APR Fixed-Rate Plan: {application: "=merchant_refund_application"}
        120-Month 7.99% APR Fixed-Rate Plan: {application: "=merchant_refund_application"}
        144-Month 9.99% APR Fixed-Rate Plan: {application: "=merchant_refund_application"}

  - id: finance_fee_reversal
    subject: [finance_adjustment]
    rule: >-
      A late fee may be reversed as a courtesy, by a late_fee_reversal naming that fee, only while fewer than
      late_fee_reversals_per_12_months late fees have been reversed on the account in the 12 months before the reversal date, and
      only when the account is active and the late payment has since been made. A late fee may be reversed as a courtesy only
      while the count of late-fee reversals in the preceding 12 months is below late_fee_reversals_per_12_months. A late fee or
      returned-payment fee charged in error, such as one posted although the payment arrived within the grace period, is
      reversed in full regardless of that count. Interest is reversed, by an interest_reversal naming the charge, only when it was
      charged in error: an autopay APR reduction not applied while autopay was enrolled, interest posted during an equal-payment
      promotion, or deferred interest assessed although the promotional balance was paid in full by the end of promo_end_date.
      Deferred interest correctly assessed is never reversed as a courtesy.
    eligibility:
      - id: courtesy_reversal_allowance
        applies_to: [finance_adjustment]
        kind: authorization
        condition: A late fee may be reversed as a courtesy only while the count of late-fee reversals in the preceding 12 months is below late_fee_reversals_per_12_months.
        evidence_fields: [finance_transactions.finance_account_id, finance_transactions.line_type, finance_transactions.posted_date, finance_transactions.source_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_transactions.source_txn_id]
          action_bindings:
            finance_transactions.source_txn_id: source_txn_id
      - id: one_reversal_per_charge
        applies_to: [finance_adjustment]
        kind: dedup
        condition: by a late_fee_reversal naming that fee
        evidence_fields: [finance_transactions.source_txn_id, finance_transactions.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_transactions.source_txn_id]
          action_bindings:
            finance_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: finance_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {line_type: [late_fee_reversal, interest_reversal]}
          distinct_fields: []
    measures: [finance_msr_late_fee_reversals_12m]
    params:
      per_tier:
        12-Month Same-As-Cash Deferred Interest Plan: {reversals_per_12_months: "=late_fee_reversals_per_12_months"}
        18-Month 0% APR Equal Payment Plan: {reversals_per_12_months: "=late_fee_reversals_per_12_months"}
        36-Month 0% APR Equal Payment Plan: {reversals_per_12_months: "=late_fee_reversals_per_12_months"}
        60-Month 5.99% APR Fixed-Rate Plan: {reversals_per_12_months: "=late_fee_reversals_per_12_months"}
        120-Month 7.99% APR Fixed-Rate Plan: {reversals_per_12_months: "=late_fee_reversals_per_12_months"}
        144-Month 9.99% APR Fixed-Rate Plan: {reversals_per_12_months: "=late_fee_reversals_per_12_months"}

  - id: finance_payoff_rules
    subject: [finance_payoff, finance_payment]
    rule: >-
      A payoff quote is the balance on the quote date plus interest accruing daily to the payoff date, and it stays valid for
      payoff_quote_valid_days. An account is paid off on the day its account_balance reaches 0.00 after every posted charge,
      including any deferred-interest assessment; a payment of less than the full balance never closes the account. An account
      is paid off only when its balance reaches 0.00. On a deferred-interest plan, paying the promotional balance in full by the
      end of promo_end_date avoids the deferred-interest assessment.
    eligibility:
      - id: zero_balance
        applies_to: [finance_payoff]
        kind: authorization
        condition: An account is paid off only when its balance reaches 0.00.
        evidence_fields: [finance_accounts.finance_account_id, finance_accounts.account_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.finance_account_id]
          action_bindings:
            finance_accounts.finance_account_id: finance_account_id
    params:
      per_tier:
        12-Month Same-As-Cash Deferred Interest Plan: {quote_valid_days: "=payoff_quote_valid_days"}
        18-Month 0% APR Equal Payment Plan: {quote_valid_days: "=payoff_quote_valid_days"}
        36-Month 0% APR Equal Payment Plan: {quote_valid_days: "=payoff_quote_valid_days"}
        60-Month 5.99% APR Fixed-Rate Plan: {quote_valid_days: "=payoff_quote_valid_days"}
        120-Month 7.99% APR Fixed-Rate Plan: {quote_valid_days: "=payoff_quote_valid_days"}
        144-Month 9.99% APR Fixed-Rate Plan: {quote_valid_days: "=payoff_quote_valid_days"}

  - id: finance_withdrawal_and_expiry
    subject: [finance_withdraw, finance_expire, finance_plan_change]
    rule: >-
      Withdrawing an application or approval, or moving an approval to another plan, is the borrower's own decision: the agent
      records the request and the borrower confirms it. A withdrawal or plan change takes effect only once the borrower has
      confirmed the request on the account. Either is possible only before funding; a funded account can only be paid off. A plan
      change is open only where plan_change_before_funding_allowed is true, only to a plan listed in the project's package, and only
      when the account's credit tier is eligible for the new plan; it keeps the decision_date, so the approval's validity is not
      extended, and it applies the new plan's apr_pct, term_months and limits to the approved amount. An approval not funded
      within approval_valid_days of its decision expires on the following day, and the borrower must apply again.
    eligibility:
      - id: borrower_confirmed_request
        applies_to: [finance_withdraw, finance_plan_change]
        kind: authorization
        condition: A withdrawal or plan change takes effect only once the borrower has confirmed the request on the account.
        evidence_fields: [finance_requests.finance_account_id, finance_requests.request_type, finance_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_requests.finance_account_id]
          action_bindings:
            finance_requests.finance_account_id: finance_account_id
      - id: plan_change_before_funding
        applies_to: [finance_plan_change]
        kind: state
        condition: Either is possible only before funding
        evidence_fields: [finance_accounts.finance_account_id, finance_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.finance_account_id]
          action_bindings:
            finance_accounts.finance_account_id: finance_account_id
        state_contract:
          field: finance_accounts.status
          allowed: [approved]
    params:
      per_tier:
        12-Month Same-As-Cash Deferred Interest Plan: {plan_change_allowed: "=plan_change_before_funding_allowed", valid_days: "=approval_valid_days"}
        18-Month 0% APR Equal Payment Plan: {plan_change_allowed: "=plan_change_before_funding_allowed", valid_days: "=approval_valid_days"}
        36-Month 0% APR Equal Payment Plan: {plan_change_allowed: "=plan_change_before_funding_allowed", valid_days: "=approval_valid_days"}
        60-Month 5.99% APR Fixed-Rate Plan: {plan_change_allowed: "=plan_change_before_funding_allowed", valid_days: "=approval_valid_days"}
        120-Month 7.99% APR Fixed-Rate Plan: {plan_change_allowed: "=plan_change_before_funding_allowed", valid_days: "=approval_valid_days"}
        144-Month 9.99% APR Fixed-Rate Plan: {plan_change_allowed: "=plan_change_before_funding_allowed", valid_days: "=approval_valid_days"}

  - id: finance_servicing_changes
    subject: [finance_servicing_update]
    rule: >-
      A borrower may move the payment due day to any day within due_day_allowed_range, at most due_day_changes_per_12_months times
      in any 12 months, and the new day applies from the next statement. A due-day change is accepted only while fewer than
      due_day_changes_per_12_months changes have been made in the preceding 12 months. Autopay may be turned on or off at any time
      on an active or delinquent account; while autopay is enrolled on a plan whose autopay_apr_discount_pct is above 0.00, the
      APR is reduced by that many percentage points from the next statement and restored when autopay ends. A term extension is
      never granted where max_term_extension_months is 0.
    eligibility:
      - id: due_day_change_allowance
        applies_to: [finance_servicing_update]
        kind: authorization
        condition: A due-day change is accepted only while fewer than due_day_changes_per_12_months changes have been made in the preceding 12 months.
        evidence_fields: [finance_accounts.finance_account_id, finance_accounts.payment_due_day]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.finance_account_id]
          action_bindings:
            finance_accounts.finance_account_id: finance_account_id
      - id: servicing_on_open_account
        applies_to: [finance_servicing_update]
        kind: state
        condition: Autopay may be turned on or off at any time on an active or delinquent account
        evidence_fields: [finance_accounts.finance_account_id, finance_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.finance_account_id]
          action_bindings:
            finance_accounts.finance_account_id: finance_account_id
        state_contract:
          field: finance_accounts.status
          allowed: [active, delinquent]
    formula:
      apr_with_autopay: apr_pct - autopay_apr_discount_pct
    measures: [finance_msr_due_day_changes_12m]
    params:
      per_tier:
        12-Month Same-As-Cash Deferred Interest Plan: {due_day_range: "=due_day_allowed_range", changes_per_12_months: "=due_day_changes_per_12_months", autopay_discount: "=autopay_apr_discount_pct", extension_months: "=max_term_extension_months"}
        18-Month 0% APR Equal Payment Plan: {due_day_range: "=due_day_allowed_range", changes_per_12_months: "=due_day_changes_per_12_months", autopay_discount: "=autopay_apr_discount_pct", extension_months: "=max_term_extension_months"}
        36-Month 0% APR Equal Payment Plan: {due_day_range: "=due_day_allowed_range", changes_per_12_months: "=due_day_changes_per_12_months", autopay_discount: "=autopay_apr_discount_pct", extension_months: "=max_term_extension_months"}
        60-Month 5.99% APR Fixed-Rate Plan: {due_day_range: "=due_day_allowed_range", changes_per_12_months: "=due_day_changes_per_12_months", autopay_discount: "=autopay_apr_discount_pct", extension_months: "=max_term_extension_months"}
        120-Month 7.99% APR Fixed-Rate Plan: {due_day_range: "=due_day_allowed_range", changes_per_12_months: "=due_day_changes_per_12_months", autopay_discount: "=autopay_apr_discount_pct", extension_months: "=max_term_extension_months"}
        144-Month 9.99% APR Fixed-Rate Plan: {due_day_range: "=due_day_allowed_range", changes_per_12_months: "=due_day_changes_per_12_months", autopay_discount: "=autopay_apr_discount_pct", extension_months: "=max_term_extension_months"}

