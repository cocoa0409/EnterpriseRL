# Harbison Home Comfort Financing — product and event policy charter.
# Functional surface: application against an eligible package, aggregate exposure and one account per
# project, credit decision by credit tier with down payments, approval validity and expiry, plan changes and
# withdrawal before funding, funding on installation completion and the disbursement to the project,
# monthly payment and due-day terms, autopay and its APR reduction, interest accrual, deferred-interest
# assessment at promo end and post-promotional APR, payment application, late and returned-payment fees
# and their reversal, delinquency, credit reporting and charge-off, merchant refunds from the installation,
# and payoff.

category: finance
display_name: Home Comfort Financing

binding:
  holding_table: finance_accounts
  event_tables: [finance_transactions]
  intake_tables: [finance_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    account_balance: loan_balance

lifecycle:
  states: [applied, approved, declined, active, delinquent, paid_off, charged_off, withdrawn, expired]
  transitions:
    - {from: applied, to: approved, by: system, means: "The credit decision approves the application."}
    - {from: applied, to: declined, by: system, means: "The credit decision declines the application."}
    - {from: applied, to: withdrawn, by: user, means: "The applicant confirms withdrawal of the application before a decision."}
    - {from: approved, to: withdrawn, by: user, means: "The borrower confirms withdrawal of an approval before funding."}
    - {from: approved, to: expired, by: system, means: "The approval reaches the end of its validity without funding."}
    - {from: approved, to: active, by: system, means: "The loan funds on completion of the installation."}
    - {from: active, to: delinquent, by: system, means: "A required payment reaches the delinquency threshold of days past due."}
    - {from: delinquent, to: active, by: system, means: "Every past-due amount is paid."}
    - {from: active, to: paid_off, by: system, means: "The balance reaches zero."}
    - {from: delinquent, to: paid_off, by: system, means: "The balance reaches zero while past due."}
    - {from: delinquent, to: charged_off, by: system, means: "A required payment reaches the charge-off threshold of days past due."}

accounts:
  - key: loan_balance
    unit: USD
    meaning: Amount the borrower owes on the account, including posted interest and fees; the disbursement, statement charges and returned payments raise it, payments and adjustments lower it.

parameter_schema:
  apr_pct: Contract APR during the plan's term or promotional period before any autopay reduction, percent.
  deferred_interest: Whether interest accrues during the promotion and is assessed if the promotional balance is not paid in full by promo end, boolean.
  deferred_interest_apr_pct: APR at which deferred interest accrues from funding; 0.00 where the plan is not deferred-interest, percent.
  promo_period_months: Length of the promotional period from funding; 0 for fixed-rate plans, integer months.
  post_promo_apr_pct: APR applied to any balance remaining after the promotional period ends; 0.00 for fixed-rate plans, percent.
  term_months: Repayment term from funding, integer months.
  payment_structure: How the monthly payment is set; enum promotional_minimum | equal_payment | fixed_installment.
  payment_factor_pct: Monthly payment as a percent of the amount financed, percent.
  minimum_payment_floor_usd: Smallest monthly payment required, USD.
  min_amount_financed_usd: Smallest amount the plan finances, USD.
  max_amount_financed_usd: Largest amount the plan finances, USD.
  eligible_credit_tiers: Credit tiers that may be approved for the plan, list.
  tier_3_down_payment_pct: Down payment required of a tier_3 approval, percent of the project amount.
  tier_4_down_payment_pct: Down payment required of a tier_4 approval, percent of the project amount.
  approval_valid_days: Calendar days after the decision during which an approval can fund, integer days.
  reapply_wait_days: Calendar days after a decline before the same customer may apply again, integer days.
  plan_change_before_funding_allowed: Whether the borrower may move an approval to another plan before funding, boolean.
  funding_trigger: Event that funds the loan, text.
  first_payment_due_days: Calendar days after funding to the first payment due date, integer days.
  due_day_allowed_range: Days of the month the payment can be due, text.
  due_day_changes_per_12_months: Due-day changes allowed in any 12 months, integer.
  autopay_apr_discount_pct: APR reduction while autopay is enrolled; 0.00 where none, percentage points.
  autopay_removal_after_returns: Returned autopay payments within 12 months after which autopay is removed, integer.
  interest_accrual_basis: How interest accrues, text.
  payment_application_order: Order in which a payment is applied, list.
  prepayment_penalty: Whether paying early carries a penalty, boolean.
  promo_expiry_notice_days: Calendar days before promo end that the borrower is reminded of the remaining promotional balance; 0 for fixed-rate plans, integer days.
  deferred_interest_assessment_basis: What is assessed when the promotional balance is not paid by promo end, text.
  merchant_refund_application: How a refund from Harbison is applied to the account, text.
  late_fee_usd: Late fee per statement period whose payment is late, USD.
  late_fee_grace_days: Calendar days after the due date before the late fee is charged, integer days.
  late_fee_max_pct_of_payment_due: Late fee may not exceed this percent of the payment that was due, percent.
  late_fee_reversals_per_12_months: Late fees that may be reversed as a courtesy in any 12 months, integer.
  returned_payment_fee_usd: Fee per returned payment, USD.
  delinquent_after_days_past_due: Days past due at which the account becomes delinquent, integer days.
  credit_reporting_days_past_due: Days past due at which a late payment is reported to the credit bureaus, integer days.
  chargeoff_after_days_past_due: Days past due at which a delinquent account is charged off, integer days.
  payoff_quote_valid_days: Calendar days a payoff quote stays valid, integer days.
  annual_fee_usd: Annual account fee, USD.
  co_applicant_allowed: Whether a co-applicant may join the application, boolean.
  max_open_accounts_per_customer: Accounts in approved, active or delinquent status one customer may hold at once, integer.
  statement_period_basis: How statement periods run, text.
  soft_prequalification_available: Whether a prequalification without a hard credit inquiry is offered, boolean.
  phone_payment_fee_usd: Fee for a payment made by phone with an agent, USD.
  interest_rate_type: Whether the APR is fixed or promotional; enum promotional | fixed.
  equal_payment_promo_balance_rule: What happens to an equal-payment balance left at promo end, text.
  max_term_extension_months: Months the term can be extended on request; 0 means no extension, integer.
  servicing_partner: Bank that originates the loans Harbison services, text.

