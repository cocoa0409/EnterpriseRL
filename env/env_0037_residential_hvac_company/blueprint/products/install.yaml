# Replacement system installations — product and event policy charter.
# Functional surface: package pricing by capacity, included scope and specifications, permit fees by
# municipality, deposits and payment application, lender funding, the statutory three-business-day right to
# cancel a home solicitation sale and the restocking terms after it, change orders approved by the
# homeowner, Comfort Club member credits and accessory discounts, multi-system discounts, seasonal
# manufacturer rebates, scheduling after the cancellation period, completion with the included workmanship
# warranty and package protection, manufacturer warranty registration within its window, municipal
# inspection, close-out, refunds (including merchant refunds to the lender) and no-lemon replacement credits.

category: install
display_name: Replacement System Installations

binding:
  holding_table: install_projects
  event_tables: [install_ledger]
  intake_tables: [install_change_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    project_balance: project_balance

lifecycle:
  states: [signed, scheduled, installed, inspected, closed, cancelled]
  transitions:
    - {from: signed, to: scheduled, by: agent, means: "The permit is pulled and the installation day is booked."}
    - {from: signed, to: cancelled, by: user, means: "The homeowner confirms cancellation of the contract before it is scheduled."}
    - {from: scheduled, to: cancelled, by: user, means: "The homeowner confirms cancellation of the contract before installation."}
    - {from: scheduled, to: installed, by: system, means: "The crew completes the installation and starts up the system."}
    - {from: installed, to: inspected, by: system, means: "The municipal mechanical inspection passes."}
    - {from: inspected, to: closed, by: system, means: "The project balance is settled and the project is closed out."}

accounts:
  - key: project_balance
    unit: USD
    meaning: Amount the homeowner owes on the project; charges and refunds raise it, credits and payments (including lender funding) lower it, and a negative value is money Harbison owes the homeowner.

parameter_schema:
  price_2_0_tons_usd: Package price for a 2.0-ton system, USD.
  price_2_5_tons_usd: Package price for a 2.5-ton system, USD.
  price_3_0_tons_usd: Package price for a 3.0-ton system, USD.
  price_3_5_tons_usd: Package price for a 3.5-ton system, USD.
  price_4_0_tons_usd: Package price for a 4.0-ton system, USD.
  price_5_0_tons_usd: Package price for a 5.0-ton system, USD.
  equipment_brand: Manufacturer of the package's equipment, text.
  cooling_seer2: Cooling efficiency of the outdoor unit, SEER2.
  furnace_afue_pct: Efficiency of the gas furnace supplied with the package, AFUE percent.
  heat_pump_hspf2: Heating efficiency of the heat pump; 0.0 where the package has no heat pump, HSPF2.
  heat_pump_included: Whether the outdoor unit is a heat pump paired with a gas furnace (dual fuel), boolean.
  compressor_staging: Compressor type; enum single_stage | two_stage | variable_speed.
  blower_type: Indoor blower motor; enum constant_torque_ecm | variable_speed_ecm.
  sound_rating_db: Outdoor unit sound rating at its lowest stage, decibels.
  refrigerant_type: Refrigerant of the new outdoor unit, text.
  thermostat_included: Thermostat supplied with the package, text.
  filter_cabinet: Filter housing supplied with the package, text.
  surge_protector_included: Whether a whole-home surge protector is included, boolean.
  humidifier_included: Whether a steam humidifier is included, boolean.
  uv_light_included: Whether a UV germicidal light is included, boolean.
  condensate_pump_included: Whether a condensate pump is included where the drain needs one, boolean.
  load_calculation_included: Whether a Manual J load calculation is performed before sizing, boolean.
  removal_and_disposal_included: Whether the old equipment is removed and its refrigerant recovered at no charge, boolean.
  line_set_replacement_included: Whether a new refrigerant line set is included, boolean.
  line_set_change_order_usd: Change-order price for a new line set where the package does not include one; 0.00 where it is included, USD.
  duct_transition_allowance_ft: Linear feet of duct transition and modification included, feet.
  duct_modification_per_ft_usd: Change-order price per linear foot of duct modification beyond the allowance, USD per foot.
  change_order_max_pct: Most the signed change orders on one project may add, as a percent of the contract price, before a new contract is required, percent.
  included_labor_protection: Protection tier issued with the installation at no extra charge besides the workmanship warranty, text naming a warranty tier or none.
  labor_protection_upgrade_options: Protection tiers that may be added to the contract as a labor-warranty upgrade, list of warranty tier names.
  mfr_parts_years_registered: Manufacturer parts warranty when the equipment is registered within the window, integer years.
  mfr_parts_years_unregistered: Manufacturer parts warranty when the equipment is not registered within the window, integer years.
  mfr_registration_window_days: Calendar days after installation within which the manufacturer accepts registration, integer days.
  deposit_pct: Deposit due at signing on a project not financed in full, percent of the contract price.
  deposit_min_usd: Smallest deposit taken, USD.
  final_payment_due_days: Days after installation by which the remaining balance is due; 0 means due on the installation day, integer days.
  rescission_business_days: Business days after signing within which a home solicitation sale may be cancelled for a full refund, integer days.
  restocking_fee_pct: Fee on cancellation after the cancellation period and before installation, percent of the contract price.
  equipment_order_lead_business_days: Business days after the cancellation period ends before the equipment arrives and installation can be scheduled, integer days.
  install_days: Working days the crew needs on site, integer days.
  permit_required: Whether a municipal mechanical permit and inspection are required, boolean.
  manufacturer_rebate_usd: Manufacturer seasonal rebate credited on the package; 0.00 where none, USD.
  manufacturer_rebate_window: Installation dates that qualify for the seasonal rebate, YYYY-MM-DD to YYYY-MM-DD, or none.
  multi_system_discount_pct: Discount on each additional system contracted on the same day for the same address, percent of its contract price.
  eligible_financing_plans: Home Comfort Financing plans available for the package, list of finance plan names.
  proposal_validity_days: Calendar days a written proposal can be signed at its quoted price, integer days.
  smart_thermostat_upgrade_available: Whether the smart thermostat upgrade accessory can be added, boolean.
  commissioning_report_included: Whether a start-up and commissioning report is delivered at completion, boolean.

