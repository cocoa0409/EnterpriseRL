# ComfortLease equipment leases — product and event policy charter.
# Functional surface: signing with a credit gate and installation fee, rent start at installation, monthly
# rent with an annual escalator, included maintenance and repairs with outage credits, grace, late fees,
# past due and default termination with removal, buyout by a lease-year schedule, early termination,
# transfer on home sale, ownership at term end, and cancellation before installation.

category: lease
display_name: ComfortLease Equipment Leases

binding:
  holding_table: lease_agreements
  event_tables: [lease_entries]
  intake_tables: [lease_change_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    lease_balance: lease_balance

lifecycle:
  states: [pending_install, active, past_due, bought_out, terminated]
  transitions:
    - {from: pending_install, to: active, by: system, means: "The leased equipment is installed and rent begins."}
    - {from: pending_install, to: terminated, by: user, means: "The lessee confirms cancellation before installation."}
    - {from: active, to: past_due, by: system, means: "Rent stays unpaid past the grace period."}
    - {from: past_due, to: active, by: system, means: "Every overdue amount is paid."}
    - {from: active, to: bought_out, by: user, means: "The lessee confirms a buyout, or reaches the end of the term and the equipment passes to them."}
    - {from: active, to: terminated, by: user, means: "The lessee confirms early termination."}
    - {from: past_due, to: terminated, by: system, means: "Rent stays unpaid through the default period and the lease is terminated for default."}

accounts:
  - key: lease_balance
    unit: USD
    meaning: Amount the lessee owes; rent and fee charges raise it, payments and credits lower it.

parameter_schema:
  monthly_rent_usd: Monthly rent in the first lease year, USD.
  term_months: Lease term, integer months.
  annual_escalator_pct: Rent increase applied on each lease anniversary, percent.
  installation_fee_usd: One-time installation fee charged at installation, USD.
  security_deposit_usd: Deposit taken at signing; 0.00 means none, USD.
  min_credit_tier: Lowest credit tier accepted, enum tier_1 | tier_2 | tier_3 | tier_4.
  buyout_price_by_lease_year: Buyout price by lease year (1 = first twelve months), mapping of year to USD.
  early_termination_months_rent: Months of current rent charged on early termination, integer months.
  removal_fee_usd: Fee to remove the equipment when a lease ends other than by buyout, USD.
  ownership_at_term_end: Whether the equipment passes to the lessee at the end of the term, boolean.
  maintenance_visits_per_year: Maintenance visits included per lease year, integer.
  repairs_included: Whether parts and labor for repairs are included in the rent, boolean.
  after_hours_service_included: Whether after-hours service calls carry no premium for the lessee, boolean.
  outage_credit_after_hours: Elapsed hours without heat or cooling, after the lessee reports it, before an outage credit is earned, integer hours.
  outage_credit_per_day_usd: Outage credit per full day beyond that, USD.
  outage_credit_cap_per_month_usd: Most outage credit earned in one rent month, USD.
  rent_due_day: Day of the month rent is due, integer.
  grace_days: Calendar days after the due date before rent is late, integer days.
  late_fee_usd: Late fee per late rent month, USD.
  late_fee_waivers_per_12_months: Late fees that may be waived in any 12 months, integer.
  default_days: Calendar days rent may stay unpaid before the lease is terminated for default, integer days.
  autopay_required: Whether rent must be paid by autopay, boolean.
  transfer_on_sale_allowed: Whether the lease may pass to the buyer of the home, boolean.
  transfer_fee_usd: Fee to transfer the lease to a buyer, USD.
  transfer_window_days: Calendar days after the home sale closes within which a transfer must be completed, integer days.
  cancellation_before_install_fee_usd: Fee to cancel before installation; 0.00 means none, USD.
  equipment_type: Equipment leased, text.
  equipment_brand: Equipment brand, text.
  efficiency_rating: Efficiency of the leased equipment, text.
  capacity_range: Capacities offered, text.
  thermostat_included: Thermostat supplied, text.
  filters_included: Whether replacement filters are supplied at each maintenance visit, boolean.
  water_heater_bundle_available: Whether a water heater can be added to the lease, boolean.
  upgrade_during_lease_allowed: Whether the lessee may move to another lease mid-term, boolean.
  upgrade_credit_pct_of_paid_rent: Share of rent paid credited toward a new lease on an upgrade, percent.
  max_leases_per_customer: Leases one customer may hold, integer.
  rent_increase_notice_days: Calendar days of notice before an anniversary increase applies, integer days.
  damage_exclusions: Damage not covered by the included repairs, list.
  insurance_required: Whether the lessee must keep homeowner's insurance covering the equipment, boolean.
  property_owner_required: Whether the lessee must own the home, boolean.
  min_lease_amount_usd: Smallest installed value leased, USD.
  equipment_value_usd: Installed value of the leased system used for insurance and loss claims, USD.
  loss_payment_basis: What the lessee owes if the equipment is destroyed, text.
  statement_delivery: How monthly statements are delivered, text.
  payment_methods: Accepted payment methods, list.
  returned_payment_fee_usd: Fee per returned rent payment, USD.
  buyout_quote_valid_days: Calendar days a buyout quote stays valid, integer days.
  service_priority: Dispatch priority of the lessee's service calls, text.

