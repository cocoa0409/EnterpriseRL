events:
  - type: lease_sign
    target: lease_agreements
    mutation: create
    meaning: A homeowner signs an equipment lease.
    grain: One row per lease signed.
    fields:
      lease_id: Reference number assigned.
      customer_id: Lessee.
      variant_name: System leased.
      signed_date: Date signed.
      monthly_rent: First-year monthly rent.
    triggers: []

  - type: lease_activate
    target: lease_agreements
    mutation: {transition: {from: pending_install, to: active}}
    meaning: The leased equipment is installed and rent begins.
    grain: One row per transaction.
    fields:
      lease_id: Lease.
      customer_id: Lessee.
      status: Set to active.
      installed_date: Installation date.
      equipment_id: Leased unit.
    triggers:
      - event: lease:lease_charge
        map: {lease_id: lease_id, customer_id: customer_id, line_type: installation_fee}

  - type: lease_charge
    target: lease_entries
    meaning: Rent or a fee is billed on the lease.
    grain: One row per charge kind per rent month, and per returned payment for returned-payment fees.
    distinguish_by: [line_type, rent_period, source_entry_id]
    fields:
      lease_id: Lease.
      customer_id: Lessee.
      line_type: monthly_rent, installation_fee, late_fee, buyout_charge, early_termination_charge, removal_fee, returned_payment_fee or transfer_fee.
      rent_period: Rent month.
      amount: Amount.
      posted_date: Date posted.
      source_entry_id: The returned payment a returned-payment fee concerns, else empty.
    account: lease_balance
    direction: in
    triggers: []

  - type: lease_payment
    target: lease_entries
    meaning: The lessee pays rent or fees.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      lease_id: Lease.
      customer_id: Lessee.
      line_type: Always payment.
      rent_period: Rent month paid.
      amount: Amount.
      posted_date: Date posted.
      payment_reference: Confirmation number.
    account: lease_balance
    direction: out
    triggers: []

  - type: lease_credit
    target: lease_entries
    meaning: An outage credit or a late-fee waiver reduces what the lessee owes.
    grain: One row per credit kind per rent month and source.
    distinguish_by: [line_type, rent_period, source_entry_id]
    fields:
      lease_id: Lease.
      customer_id: Lessee.
      line_type: service_outage_credit or late_fee_waiver.
      rent_period: Rent month credited.
      amount: Amount.
      posted_date: Date posted.
      source_entry_id: The late fee waived, else empty.
    account: lease_balance
    direction: out
    triggers: []

  - type: lease_past_due
    target: lease_agreements
    mutation: {transition: {from: active, to: past_due}}
    meaning: Rent stays unpaid past the grace period.
    grain: One row per transaction.
    fields:
      lease_id: Lease.
      status: Set to past_due.
    triggers:
      - event: lease:lease_charge
        map: {lease_id: lease_id, line_type: late_fee}

  - type: lease_cure
    target: lease_agreements
    mutation: {transition: {from: past_due, to: active}}
    meaning: Every overdue amount is paid.
    grain: One row per transaction.
    fields:
      lease_id: Lease.
      status: Set to active.
    triggers: []

  - type: lease_buyout
    target: lease_agreements
    mutation: {transition: {from: active, to: bought_out}}
    meaning: The lessee buys the equipment or reaches the end of the term.
    grain: One row per transaction.
    fields:
      lease_id: Lease.
      status: Set to bought_out.
      end_date: Date ownership passes.
    triggers: []

  - type: lease_terminate
    target: lease_agreements
    mutation:
      transition:
        - {from: pending_install, to: terminated}
        - {from: active, to: terminated}
        - {from: past_due, to: terminated}
    meaning: The lease ends without a buyout - cancelled before installation, terminated early by the lessee, or terminated for default.
    grain: One row per transaction.
    fields:
      lease_id: Lease.
      status: Set to terminated.
      end_date: Date the lease ends.
    triggers: []

  - type: lease_rent_increase
    target: lease_agreements
    mutation: update
    meaning: The anniversary escalator is applied to the rent.
    grain: One row per transaction.
    fields:
      lease_id: Lease.
      monthly_rent: New monthly rent.
    triggers: []

  - type: lease_transfer
    target: lease_agreements
    mutation: update
    meaning: The lease is assigned to the buyer of the home.
    grain: One row per transaction.
    fields:
      lease_id: Lease.
      customer_id: Buyer who takes over the lease.
    triggers:
      - event: lease:lease_charge
        map: {lease_id: lease_id, customer_id: customer_id, line_type: transfer_fee}

measures:
  - id: lease_msr_lease_year
    window: From installed_date to the date of handling.
    measure: Lease year in effect, counting the twelve months starting on installed_date as year 1.
  - id: lease_msr_outage_days
    window: One reported outage, from the lessee's report to restoration.
    measure: Full 24-hour days of outage beyond outage_credit_after_hours elapsed hours.
  - id: lease_msr_late_fee_waivers_12m
    window: Rolling 12 calendar months ending on the date of handling.
    measure: Count of lease_credit entries with line_type late_fee_waiver on the lease.

policies:
  - id: lease_agg_multi_holding
    subject: [lease_sign]
    rule: >-
      A customer may hold up to max_leases_per_customer leases at the service address, in pending_install, active or past_due
      status, typically one for heating and one for cooling or one per zone.
    eligibility: []
    params:
      max_per_customer: 2

  - id: lease_agg_no_overlap
    subject: [lease_sign]
    rule: >-
      Two leases at one address may not cover the same function: a lease that heats the home (gas furnace, heat pump, dual-fuel or
      ductless) cannot be signed while another heating lease is in pending_install, active or past_due status, and likewise for
      cooling; a combination lease counts as both. A customer who has a lease in past_due status cannot sign a new lease.
    eligibility:
      - id: no_past_due_lease
        applies_to: [lease_sign]
        kind: dedup
        condition: A customer who has a lease in past_due status cannot sign a new lease.
        evidence_fields: [lease_agreements.customer_id, lease_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_agreements.customer_id]
          action_bindings:
            lease_agreements.customer_id: customer_id
        dedup_contract:
          table: lease_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [past_due]}
          distinct_fields: []
    params:
      per_tier:
        ComfortLease Gas Furnace: {max_leases: "=max_leases_per_customer"}
        ComfortLease Central Air: {max_leases: "=max_leases_per_customer"}
        ComfortLease Heat Pump: {max_leases: "=max_leases_per_customer"}
        ComfortLease Furnace & Central Air: {max_leases: "=max_leases_per_customer"}
        ComfortLease Dual-Fuel System: {max_leases: "=max_leases_per_customer"}
        ComfortLease Ductless Multi-Zone: {max_leases: "=max_leases_per_customer"}

  - id: lease_signing_eligibility
    subject: [lease_sign, lease_activate, lease_charge]
    rule: >-
      A lease covers the equipment_type of its tier at the tier's efficiency_rating and within its capacity_range, with a water heater
      added only where water_heater_bundle_available is true. A lease is signed only by the owner of the home where
      property_owner_required is true, with a credit tier at or above
      min_credit_tier, for an installed value of at least min_lease_amount_usd, and with homeowner's insurance covering the
      equipment where insurance_required is true. No security deposit is taken where security_deposit_usd is 0.00. Rent begins on
      the installed_date, when the installation_fee_usd and the first month's rent are charged; rent for later months is charged
      on rent_due_day and paid by autopay where autopay_required is true, using one of the payment_methods, with statements sent by
      statement_delivery. Equipment destroyed while leased is settled on the loss_payment_basis, with equipment_value_usd as the
      insured value. A lease cancelled before installation is terminated
      with cancellation_before_install_fee_usd, and 0.00 means no fee.
    eligibility: []
    params:
      per_tier:
        ComfortLease Gas Furnace: {rent: "=monthly_rent_usd", install_fee: "=installation_fee_usd", min_tier: "=min_credit_tier"}
        ComfortLease Central Air: {rent: "=monthly_rent_usd", install_fee: "=installation_fee_usd", min_tier: "=min_credit_tier"}
        ComfortLease Heat Pump: {rent: "=monthly_rent_usd", install_fee: "=installation_fee_usd", min_tier: "=min_credit_tier"}
        ComfortLease Furnace & Central Air: {rent: "=monthly_rent_usd", install_fee: "=installation_fee_usd", min_tier: "=min_credit_tier"}
        ComfortLease Dual-Fuel System: {rent: "=monthly_rent_usd", install_fee: "=installation_fee_usd", min_tier: "=min_credit_tier"}
        ComfortLease Ductless Multi-Zone: {rent: "=monthly_rent_usd", install_fee: "=installation_fee_usd", min_tier: "=min_credit_tier"}

  - id: lease_rent_and_escalator
    subject: [lease_rent_increase, lease_charge, lease_payment]
    rule: >-
      On each anniversary of installed_date the monthly rent rises by annual_escalator_pct of the rent then in effect, rounded to
      the cent half up, after notice sent at least rent_increase_notice_days before. Rent is charged per calendar month on
      rent_due_day; the first month is charged in full at installation. Payments apply to the oldest charge first. A returned
      payment is charged returned_payment_fee_usd naming that payment.
    eligibility: []
    formula:
      new_rent: round(monthly_rent * (1 + annual_escalator_pct / 100), 2)
    params:
      per_tier:
        ComfortLease Gas Furnace: {escalator_pct: "=annual_escalator_pct", notice_days: "=rent_increase_notice_days"}
        ComfortLease Central Air: {escalator_pct: "=annual_escalator_pct", notice_days: "=rent_increase_notice_days"}
        ComfortLease Heat Pump: {escalator_pct: "=annual_escalator_pct", notice_days: "=rent_increase_notice_days"}
        ComfortLease Furnace & Central Air: {escalator_pct: "=annual_escalator_pct", notice_days: "=rent_increase_notice_days"}
        ComfortLease Dual-Fuel System: {escalator_pct: "=annual_escalator_pct", notice_days: "=rent_increase_notice_days"}
        ComfortLease Ductless Multi-Zone: {escalator_pct: "=annual_escalator_pct", notice_days: "=rent_increase_notice_days"}

  - id: lease_service_and_outage_credit
    subject: [lease_credit]
    rule: >-
      The lessee's service calls are dispatched at the service_priority. Maintenance visits (maintenance_visits_per_year), repairs where repairs_included is true, and after-hours service where
      after_hours_service_included is true are provided at no charge to the lessee, except damage from the causes in
      damage_exclusions. When the leased system is out of service, the outage credit is earned only for full days beyond
      outage_credit_after_hours elapsed hours after the lessee reported it, at outage_credit_per_day_usd per day, up to
      outage_credit_cap_per_month_usd in one rent month, posted as a service_outage_credit on the next rent month.
    eligibility:
      - id: outage_beyond_threshold
        applies_to: [lease_credit]
        kind: authorization
        condition: the outage credit is earned only for full days beyond outage_credit_after_hours elapsed hours after the lessee reported it
        evidence_fields: [service_tickets.ticket_id, service_tickets.booked_at, service_tickets.completed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
    formula:
      outage_credit: min(lease_msr_outage_days * outage_credit_per_day_usd, outage_credit_cap_per_month_usd)
    measures: [lease_msr_outage_days]
    params:
      per_tier:
        ComfortLease Gas Furnace: {per_day: "=outage_credit_per_day_usd", cap: "=outage_credit_cap_per_month_usd", after_hours: "=outage_credit_after_hours"}
        ComfortLease Central Air: {per_day: "=outage_credit_per_day_usd", cap: "=outage_credit_cap_per_month_usd", after_hours: "=outage_credit_after_hours"}
        ComfortLease Heat Pump: {per_day: "=outage_credit_per_day_usd", cap: "=outage_credit_cap_per_month_usd", after_hours: "=outage_credit_after_hours"}
        ComfortLease Furnace & Central Air: {per_day: "=outage_credit_per_day_usd", cap: "=outage_credit_cap_per_month_usd", after_hours: "=outage_credit_after_hours"}
        ComfortLease Dual-Fuel System: {per_day: "=outage_credit_per_day_usd", cap: "=outage_credit_cap_per_month_usd", after_hours: "=outage_credit_after_hours"}
        ComfortLease Ductless Multi-Zone: {per_day: "=outage_credit_per_day_usd", cap: "=outage_credit_cap_per_month_usd", after_hours: "=outage_credit_after_hours"}

  - id: lease_late_and_default
    subject: [lease_past_due, lease_cure, lease_terminate, lease_charge, lease_credit]
    rule: >-
      Rent unpaid grace_days after rent_due_day makes the lease past_due and posts one late_fee of late_fee_usd for that rent
      month. A late fee may be waived only while fewer than late_fee_waivers_per_12_months waivers were granted in the preceding
      12 months. Paying every overdue amount returns the lease to active. Rent unpaid default_days after its due date terminates the
      lease for default: the equipment is removed, removal_fee_usd is charged and every unpaid amount remains owed.
    eligibility:
      - id: late_fee_waiver_allowance
        applies_to: [lease_credit]
        kind: authorization
        condition: A late fee may be waived only while fewer than late_fee_waivers_per_12_months waivers were granted in the preceding 12 months.
        evidence_fields: [lease_entries.lease_id, lease_entries.line_type, lease_entries.posted_date, lease_entries.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_entries.source_entry_id]
          action_bindings:
            lease_entries.source_entry_id: source_entry_id
    measures: [lease_msr_late_fee_waivers_12m]
    params:
      per_tier:
        ComfortLease Gas Furnace: {grace_days: "=grace_days", late_fee: "=late_fee_usd", default_days: "=default_days", removal_fee: "=removal_fee_usd"}
        ComfortLease Central Air: {grace_days: "=grace_days", late_fee: "=late_fee_usd", default_days: "=default_days", removal_fee: "=removal_fee_usd"}
        ComfortLease Heat Pump: {grace_days: "=grace_days", late_fee: "=late_fee_usd", default_days: "=default_days", removal_fee: "=removal_fee_usd"}
        ComfortLease Furnace & Central Air: {grace_days: "=grace_days", late_fee: "=late_fee_usd", default_days: "=default_days", removal_fee: "=removal_fee_usd"}
        ComfortLease Dual-Fuel System: {grace_days: "=grace_days", late_fee: "=late_fee_usd", default_days: "=default_days", removal_fee: "=removal_fee_usd"}
        ComfortLease Ductless Multi-Zone: {grace_days: "=grace_days", late_fee: "=late_fee_usd", default_days: "=default_days", removal_fee: "=removal_fee_usd"}

  - id: lease_buyout_and_termination
    subject: [lease_buyout, lease_terminate, lease_charge]
    rule: >-
      Buying out or terminating a lease early is the lessee's own decision, recorded as a request the lessee confirms. A buyout
      or early termination takes effect only once the lessee has confirmed the request on the lease. A buyout charges the price
      for the current lease year from buyout_price_by_lease_year, quoted for buyout_quote_valid_days, and ownership passes on
      payment; at the end of term_months the equipment passes to the lessee with no buyout charge where ownership_at_term_end is
      true. An early termination charges early_termination_months_rent months of the current rent plus removal_fee_usd, and the
      equipment is removed. A lessee who upgrades to another lease mid-term, where upgrade_during_lease_allowed is true, receives
      upgrade_credit_pct_of_paid_rent of the rent paid toward the new lease and pays no early termination charge.
    eligibility:
      - id: lessee_confirmed
        applies_to: [lease_buyout, lease_terminate]
        kind: authorization
        condition: A buyout or early termination takes effect only once the lessee has confirmed the request on the lease.
        evidence_fields: [lease_change_requests.lease_id, lease_change_requests.request_type, lease_change_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_change_requests.lease_id]
          action_bindings:
            lease_change_requests.lease_id: lease_id
    measures: [lease_msr_lease_year]
    params:
      per_tier:
        ComfortLease Gas Furnace: {buyout_schedule: "=buyout_price_by_lease_year", etf_months: "=early_termination_months_rent", removal_fee: "=removal_fee_usd", term_months: "=term_months"}
        ComfortLease Central Air: {buyout_schedule: "=buyout_price_by_lease_year", etf_months: "=early_termination_months_rent", removal_fee: "=removal_fee_usd", term_months: "=term_months"}
        ComfortLease Heat Pump: {buyout_schedule: "=buyout_price_by_lease_year", etf_months: "=early_termination_months_rent", removal_fee: "=removal_fee_usd", term_months: "=term_months"}
        ComfortLease Furnace & Central Air: {buyout_schedule: "=buyout_price_by_lease_year", etf_months: "=early_termination_months_rent", removal_fee: "=removal_fee_usd", term_months: "=term_months"}
        ComfortLease Dual-Fuel System: {buyout_schedule: "=buyout_price_by_lease_year", etf_months: "=early_termination_months_rent", removal_fee: "=removal_fee_usd", term_months: "=term_months"}
        ComfortLease Ductless Multi-Zone: {buyout_schedule: "=buyout_price_by_lease_year", etf_months: "=early_termination_months_rent", removal_fee: "=removal_fee_usd", term_months: "=term_months"}

  - id: lease_transfer_rules
    subject: [lease_transfer, lease_charge]
    rule: >-
      Where transfer_on_sale_allowed is true, a lease passes to the buyer of the home when the buyer meets lease_signing_eligibility
      and the transfer is completed no later than transfer_window_days after the sale closes; transfer_fee_usd is charged to the
      buyer. A lease is transferred only while its status is active. A lease not transferred in time stays with the seller, who
      may buy it out or terminate it.
    eligibility:
      - id: transfer_active_lease
        applies_to: [lease_transfer]
        kind: state
        condition: A lease is transferred only while its status is active.
        evidence_fields: [lease_agreements.lease_id, lease_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_agreements.lease_id]
          action_bindings:
            lease_agreements.lease_id: lease_id
        state_contract:
          field: lease_agreements.status
          allowed: [active]
    params:
      per_tier:
        ComfortLease Gas Furnace: {allowed: "=transfer_on_sale_allowed", fee: "=transfer_fee_usd", window_days: "=transfer_window_days"}
        ComfortLease Central Air: {allowed: "=transfer_on_sale_allowed", fee: "=transfer_fee_usd", window_days: "=transfer_window_days"}
        ComfortLease Heat Pump: {allowed: "=transfer_on_sale_allowed", fee: "=transfer_fee_usd", window_days: "=transfer_window_days"}
        ComfortLease Furnace & Central Air: {allowed: "=transfer_on_sale_allowed", fee: "=transfer_fee_usd", window_days: "=transfer_window_days"}
        ComfortLease Dual-Fuel System: {allowed: "=transfer_on_sale_allowed", fee: "=transfer_fee_usd", window_days: "=transfer_window_days"}
        ComfortLease Ductless Multi-Zone: {allowed: "=transfer_on_sale_allowed", fee: "=transfer_fee_usd", window_days: "=transfer_window_days"}

