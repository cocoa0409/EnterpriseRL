# Comfort Club maintenance agreements — product and event policy charter.
# Functional surface: enrollment (eligibility, inspection, pricing by channel), activation on first payment,
# annual and monthly dues billing, payment application, grace, late fees and waivers, past-due cure and
# nonpayment termination, seasonal tune-up allowance and its forfeiture, adding a system, mid-term
# upgrades and renewal-time downgrades, auto-renewal with price lock and loyalty pricing, lapse and
# reinstatement, member-confirmed cancellation with proration and payout, covered repairs at the top tiers,
# and the no-heat/no-cool response guarantee. Member benefits that other categories apply (repair discount,
# diagnostic rate, after-hours and holiday premium discounts, refrigerant allowance, installation credit,
# accessory and duct-cleaning discounts, repair-guarantee extension, warranty claim fee waiver) are
# catalogued here and consumed by the service, install and warranty charters.

category: plan
display_name: Comfort Club Maintenance Agreements

binding:
  holding_table: plan_agreements
  event_tables: [plan_billing_entries, plan_service_entries]
  intake_tables: [plan_change_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    dues_balance: dues_receivable
    visits_remaining: visit_allowance
    repair_coverage_remaining: repair_coverage

lifecycle:
  states: [pending, active, past_due, lapsed, cancelled]
  transitions:
    - {from: pending, to: active, by: system, means: "The payment covering the agreement's first dues charge posts and the membership starts."}
    - {from: pending, to: cancelled, by: agent, means: "An enrollment whose first dues were never paid is withdrawn before it starts."}
    - {from: active, to: past_due, by: system, means: "A dues charge stays unpaid past the tier's payment grace period."}
    - {from: past_due, to: active, by: system, means: "A payment clears every overdue dues charge and fee."}
    - {from: past_due, to: cancelled, by: system, means: "A dues charge stays unpaid through the nonpayment termination period and the agreement is terminated."}
    - {from: active, to: lapsed, by: system, means: "The term ends on an agreement that is not set to renew automatically."}
    - {from: lapsed, to: active, by: agent, means: "A lapsed agreement is reinstated within its renewal grace period."}
    - {from: lapsed, to: cancelled, by: system, means: "The renewal grace period ends without reinstatement."}
    - {from: active, to: cancelled, by: user, means: "The member confirms their own cancellation request."}

accounts:
  - key: dues_receivable
    unit: USD
    meaning: Dues and fees the member owes on the agreement; charges and payouts of credit balances raise it, payments and credits lower it, and a negative value is money Harbison owes the member.
  - key: visit_allowance
    unit: visits
    meaning: Maintenance visits available to the member in the current term; term and system grants raise it, completed or forfeited visits and expiry lower it.
  - key: repair_coverage
    unit: USD
    meaning: Covered-repair benefit available in the current term on tiers that include covered repairs; term grants raise it, draws for covered repairs and expiry lower it.

parameter_schema:
  annual_dues_first_system_usd: Annual dues for the first enrolled system when billed once per term in advance, USD.
  annual_dues_additional_system_usd: Annual dues for each enrolled system beyond the first, USD per system per term.
  monthly_dues_first_system_usd: Monthly dues for the first enrolled system when billed monthly, USD per month.
  monthly_dues_additional_system_usd: Monthly dues for each enrolled system beyond the first, USD per system per month.
  max_systems_covered: Maximum number of heating/cooling systems one agreement may enroll, integer.
  tuneup_visits_per_system_per_term: Precision tune-up visits granted per enrolled system per term, integer.
  whole_home_visits_per_term: Whole-home visits (water heater flush, attic and duct inspection, indoor air quality check) granted per term regardless of system count, integer.
  tuneup_retail_value_usd: Retail value charged back for each completed tune-up when a cancellation credit is computed, USD.
  whole_home_visit_retail_value_usd: Retail value charged back for each completed whole-home visit when a cancellation credit is computed, USD.
  repair_discount_pct: Member discount on flat-rate repair parts and labor lines of a service call, percent.
  diagnostic_fee_member_usd: Diagnostic fee a member pays on a service call in place of the call class's standard diagnostic fee, USD.
  after_hours_premium_discount_pct: Member discount on the after-hours premium of Evening, Weekend and Overnight Emergency calls, percent.
  holiday_premium_discount_pct: Member discount on the after-hours premium of a Holiday Emergency call, percent.
  scheduling_priority: Dispatch queue position of the member's calls; enum standard | priority | front_of_line.
  no_heat_no_cool_response_hours: Guaranteed maximum elapsed hours from booking to technician arrival on a no-heat or no-cool call; 0 means the tier carries no response guarantee, integer hours.
  response_guarantee_credit_usd: Dues credit posted when the response guarantee is missed, USD per qualifying call.
  filters_included_per_visit: Standard 1-inch filters replaced at no charge on each tune-up, integer.
  condensate_treatment_included: Whether condensate drain line treatment is part of the cooling tune-up, boolean.
  iaq_inspection_included: Whether an indoor air quality inspection is part of each tune-up, boolean.
  refrigerant_allowance_lbs_per_term: Pounds of refrigerant per term that member service calls add without charge, pounds.
  install_credit_usd: Member credit applied to a replacement installation contract signed while the agreement is active, USD.
  accessory_discount_pct: Member discount on accessories added to an installation contract, percent.
  duct_cleaning_discount_pct: Member discount on the whole-home duct cleaning task, percent.
  repair_guarantee_extension_months: Months added to Harbison's standard repair guarantee for repairs done while the agreement is active, integer months.
  warranty_claim_fee_waiver: Whether the member's protection contract claim service fee is waived, boolean.
  covered_repair_annual_cap_usd: Covered-repair benefit granted per term; 0.00 means the tier carries no covered repairs, USD.
  covered_repair_per_incident_cap_usd: Most the covered-repair benefit pays on one service call, USD.
  covered_repair_waiting_period_days: Calendar days after the agreement's first covered-repair grant before a newly booked repair can be covered, integer days.
  max_equipment_age_years: Oldest equipment age, counted from install date, that may be enrolled under the tier, integer years.
  enrollment_inspection_age_years: Equipment older than this many years must pass an enrollment inspection before it is enrolled, integer years.
  enrollment_inspection_fee_usd: Fee per inspected system for the enrollment inspection; 0.00 means performed without charge, USD.
  term_months: Length of one agreement term, integer months.
  renewal_notice_days: Calendar days before term end that the renewal notice is sent, integer days.
  renewal_grace_days: Calendar days after term end during which a lapsed agreement may be reinstated, integer days.
  reinstatement_fee_usd: Fee charged when a lapsed agreement is reinstated; 0.00 means none, USD.
  price_lock_on_renewal: Whether the first-system annual rate the member last paid is locked for automatic renewals, boolean.
  loyalty_discount_pct: Discount on annual renewal dues once the loyalty term count is reached, percent.
  loyalty_consecutive_terms_required: Consecutive terms, counting the renewing term, needed for the loyalty discount, integer.
  cancellation_full_refund_days: Calendar days after term start within which a cancellation gets the full-refund treatment, integer days.
  cancellation_fee_usd: Fee charged on a cancellation outside the full-refund window; 0.00 means none, USD.
  monthly_payment_grace_days: Calendar days after a dues charge posts before the agreement becomes past due, integer days.
  late_fee_usd: Late fee charged once per overdue billing period, USD.
  late_fee_waivers_per_12_months: Late fees that may be waived in any 12 months, integer.
  nonpayment_termination_days: Calendar days after an unpaid dues charge posts at which the agreement is terminated, integer days.
  tuneup_reschedule_notice_hours: Elapsed hours before the start of the arrival window by which a tune-up must be cancelled or rescheduled to avoid forfeiture, integer hours.
  missed_appointment_fee_usd: Fee for a tune-up missed or cancelled late on a tier that forfeits the visit; 0.00 means none, USD.
  no_show_forfeits_visit: Whether a missed or late-cancelled tune-up uses up the visit, boolean.
  min_days_between_tuneups_same_system: Minimum calendar days between two tune-ups on the same system, integer days.
  cooling_season_window: Month-day window in which cooling tune-ups are performed each year, MM-DD to MM-DD.
  heating_season_window: Month-day window in which heating tune-ups are performed each year, MM-DD to MM-DD.
  web_enrollment_discount_pct: Discount on first-term dues for agreements enrolled through the web channel, percent.
  monthly_billing_autopay_required: Whether monthly billing requires card-on-file or ACH autopay, boolean.
  midterm_upgrade_into_allowed: Whether an active agreement may move into this tier in the middle of a term, boolean.

