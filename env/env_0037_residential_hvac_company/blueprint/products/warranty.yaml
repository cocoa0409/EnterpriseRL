        Harbison 12-Year Total Protection Plus: {single_up_to_3: "=price_single_unit_up_to_3_tons_usd", single_over_3: "=price_single_unit_over_3_tons_usd", matched_up_to_3: "=price_matched_system_up_to_3_tons_usd", matched_over_3: "=price_matched_system_over_3_tons_usd", install_discount_pct: "=with_installation_upgrade_discount_pct"}

  - id: warranty_activation
    subject: [warranty_activate, warranty_limit_grant]
    rule: >-
      A contract issued with purchase_channel with_installation or post_install_window starts coverage on the installation's
      installed_date, so its term runs from the day the equipment was started up even when it was bought later, and it activates
      on issue once any contract price billed on the contract is paid. A purchased contract is activated only after its contract
      price has been paid in full. An aftermarket contract is activated only once aftermarket_waiting_period_days calendar days
      have passed since the contract was purchased. Waiting-period days are counted as calendar days with the purchase date as day
      0, and coverage starts on the day after the last waiting day. An aftermarket contract's coverage_start is that day, and a
      failure diagnosed before it is never covered. coverage_end is the day before the same calendar date labor_coverage_years
      after coverage_start. A contract issued by transfer activates on issue with the seller's coverage_start and coverage_end
      unchanged. Activation grants the claim benefit: lifetime_claim_limit_usd with reason activation, or, on a transfer, the
      seller's claim_limit_remaining with reason transfer_carryover.
    eligibility:
      - id: price_paid
        applies_to: [warranty_activate]
        kind: authorization
        condition: A purchased contract is activated only after its contract price has been paid in full.
        evidence_fields: [warranty_contracts.contract_id, warranty_contracts.contract_balance, warranty_billing_entries.contract_id, warranty_billing_entries.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_contracts.contract_id]
          action_bindings:
            warranty_contracts.contract_id: contract_id
      - id: aftermarket_waiting_period
        applies_to: [warranty_activate]
        kind: time
        condition: An aftermarket contract is activated only once aftermarket_waiting_period_days calendar days have passed since the contract was purchased.
        evidence_fields: [warranty_contracts.contract_id, warranty_contracts.purchase_date, warranty_contracts.purchase_channel]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_contracts.contract_id]
          action_bindings:
            warranty_contracts.contract_id: contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was purchased
          anchor_source: warranty_contracts.purchase_date
          relation: not_before
          duration_source: variants.aftermarket_waiting_period_days
          unit: calendar_days
          counting_rule: Waiting-period days are counted as calendar days with the purchase date as day 0, and coverage starts on the day after the last waiting day.
          boundary: exclusive
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {term_years: "=labor_coverage_years", waiting_days: "=aftermarket_waiting_period_days", lifetime_limit: "=lifetime_claim_limit_usd"}
        Harbison 5-Year Labor Protection: {term_years: "=labor_coverage_years", waiting_days: "=aftermarket_waiting_period_days", lifetime_limit: "=lifetime_claim_limit_usd"}
        Harbison 10-Year Labor Protection: {term_years: "=labor_coverage_years", waiting_days: "=aftermarket_waiting_period_days", lifetime_limit: "=lifetime_claim_limit_usd"}
        Harbison 10-Year Parts & Labor Protection: {term_years: "=labor_coverage_years", waiting_days: "=aftermarket_waiting_period_days", lifetime_limit: "=lifetime_claim_limit_usd"}
        Harbison 12-Year Total Protection: {term_years: "=labor_coverage_years", waiting_days: "=aftermarket_waiting_period_days", lifetime_limit: "=lifetime_claim_limit_usd"}
        Harbison 12-Year Total Protection Plus: {term_years: "=labor_coverage_years", waiting_days: "=aftermarket_waiting_period_days", lifetime_limit: "=lifetime_claim_limit_usd"}

  - id: warranty_evt_claim_coverage
    subject: [warranty_claim_file, warranty_claim_decide]
    rule: >-
      A claim is opened by the agent for each failed component a Harbison technician diagnosed and repaired on a service call;
      repairs by any other contractor are never reimbursed where third_party_repair_reimbursed is false. A claim is filed only against a contract whose status is active. A
      claim is accepted for decision only when it is filed no later than claim_filing_deadline_days calendar days after the
      failure was diagnosed. Filing-deadline days are counted as calendar days with the service call's completed_date as day 0,
      and a claim filed on the last day is accepted. The failure date is the completed_date of that service call, and the
      original decision is made on the filing date. The claim is decided in this order, and the first failing test governs the
      denial_reason: the failure date must fall within coverage_start through coverage_end (outside_coverage_term); the
      component must be in the tier's covered_components (component_not_covered); the claim must have been filed within the
      deadline (filed_after_deadline); where maintenance_required is true, documented maintenance must be current
      (maintenance_not_documented); the failure must not stem from an excluded cause - flood, fire, lightning or power surge,
      freezing of an unheated space, rodent or pest damage, or repair or alteration by anyone other than Harbison
      (excluded_cause); and claim_limit_remaining must be above 0.00 (limit_exhausted). Maintenance is current only when the most
      recent documented maintenance on the failed unit was completed no more than maintenance_interval_months months plus
      maintenance_grace_days days before the failure date; when coverage_start is itself later than that same cut-off, no
      maintenance record is required. Documented maintenance is one of the tier's maintenance_proof_sources: a completed Comfort Club tune-up on that unit or a
      paid precision tune-up service call on that unit, and a customer's own receipt from another contractor is not accepted. Parts are paid
      only for components the tier covers within parts_coverage_years and only when no manufacturer parts warranty applies on the
      failure date, because parts_secondary_to_manufacturer is true on every tier; the manufacturer term is the registered_parts_years confirmed by the installation's registration entry, or
      the manufacturer's unregistered term set in the install charter when no registration exists, counted from the installed
      date. When the manufacturer warranty supplies the part, the claim is partially_approved with denial_reason
      manufacturer_parts_coverage_applies for the parts and pays the remaining covered components; otherwise a claim passing every
      test is approved. Labor is paid only within labor_coverage_years, which is the contract term.
    eligibility:
      - id: claim_on_active_contract
        applies_to: [warranty_claim_file]
        kind: state
        condition: A claim is filed only against a contract whose status is active.
        evidence_fields: [warranty_contracts.contract_id, warranty_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_contracts.contract_id]
          action_bindings:
            warranty_contracts.contract_id: contract_id
        state_contract:
          field: warranty_contracts.status
          allowed: [active]
      - id: filing_deadline
        applies_to: [warranty_claim_file, warranty_claim_decide]
        kind: time
        condition: A claim is accepted for decision only when it is filed no later than claim_filing_deadline_days calendar days after the failure was diagnosed.
        evidence_fields: [service_tickets.ticket_id, service_tickets.completed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the failure was diagnosed
          anchor_source: service_tickets.completed_date
          relation: not_after
          duration_source: variants.claim_filing_deadline_days
          unit: calendar_days
          counting_rule: Filing-deadline days are counted as calendar days with the service call's completed_date as day 0, and a claim filed on the last day is accepted.
          boundary: inclusive
      - id: maintenance_current
        applies_to: [warranty_claim_decide]
        kind: authorization
        condition: Maintenance is current only when the most recent documented maintenance on the failed unit was completed no more than maintenance_interval_months months plus maintenance_grace_days days before the failure date
        evidence_fields: [plan_service_entries.equipment_id, plan_service_entries.entry_reason, plan_service_entries.entry_date, service_lines.ticket_id, service_lines.line_type, service_tickets.equipment_id, service_tickets.completed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.equipment_id]
          action_bindings:
            service_tickets.equipment_id: equipment_id
      - id: manufacturer_parts_first
        applies_to: [warranty_claim_decide]
        kind: authorization
        condition: Parts are paid only for components the tier covers within parts_coverage_years and only when no manufacturer parts warranty applies on the failure date
        evidence_fields: [install_ledger.install_id, install_ledger.line_type, install_ledger.registered_parts_years, install_projects.install_id, install_projects.installed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_projects.install_id]
          action_bindings:
            install_projects.install_id: install_id
    measures: [warranty_msr_last_maintenance_date]
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {components: "=covered_components", parts_years: "=parts_coverage_years", labor_years: "=labor_coverage_years", deadline_days: "=claim_filing_deadline_days", maintenance_required: "=maintenance_required"}
        Harbison 5-Year Labor Protection: {components: "=covered_components", parts_years: "=parts_coverage_years", labor_years: "=labor_coverage_years", deadline_days: "=claim_filing_deadline_days", maintenance_required: "=maintenance_required"}
        Harbison 10-Year Labor Protection: {components: "=covered_components", parts_years: "=parts_coverage_years", labor_years: "=labor_coverage_years", deadline_days: "=claim_filing_deadline_days", maintenance_required: "=maintenance_required"}
        Harbison 10-Year Parts & Labor Protection: {components: "=covered_components", parts_years: "=parts_coverage_years", labor_years: "=labor_coverage_years", deadline_days: "=claim_filing_deadline_days", maintenance_required: "=maintenance_required"}
        Harbison 12-Year Total Protection: {components: "=covered_components", parts_years: "=parts_coverage_years", labor_years: "=labor_coverage_years", deadline_days: "=claim_filing_deadline_days", maintenance_required: "=maintenance_required"}
        Harbison 12-Year Total Protection Plus: {components: "=covered_components", parts_years: "=parts_coverage_years", labor_years: "=labor_coverage_years", deadline_days: "=claim_filing_deadline_days", maintenance_required: "=maintenance_required"}

  - id: warranty_evt_claim_payout
    subject: [warranty_claim_payout, warranty_claim_decide]
    rule: >-
      An approved or partially approved claim pays the failed component's lines on the service invoice after the Comfort Club
      member discount on each line has been applied: labor is paid up to the labor sublimit for that component
      (compressor_labor_sublimit_usd for a compressor, coil_labor_sublimit_usd for an evaporator or condenser coil,
      heat_exchanger_labor_sublimit_usd for a heat exchanger, motor_labor_sublimit_usd for a blower, condenser fan or inducer
      motor, control_labor_sublimit_usd for a control board, defrost board or gas valve, and no sublimit for any other covered
      component); parts are paid in full where the claim covers parts; refrigerant is paid where refrigerant_covered is true for
      a failure in the refrigerant circuit, up to refrigerant_max_lbs_per_claim pounds, together with the leak search task where
      refrigerant_leak_search_covered is true; the visit's diagnostic fee is paid where diagnostic_fee_covered is true and its
      after-hours premium where after_hours_premium_covered is true, each only on the first claim of the visit. The total is
      capped at per_claim_limit_usd and at claim_limit_remaining; when a cap binds, the payout is allocated in the order labor,
      parts, refrigerant, diagnostic, after_hours_premium. The approved amount on the decision equals that capped total. Each
      payout component posts as one payout naming the claim and the service call, and lands on the invoice as a warranty
      coverage credit; anything the payout does not cover stays on the invoice for the customer or for Comfort Club covered
      repairs.
    eligibility:
      - id: decision_approves
        applies_to: [warranty_claim_payout]
        kind: authorization
        condition: An approved or partially approved claim pays the failed component's lines on the service invoice after the Comfort Club member discount on each line has been applied
        evidence_fields: [warranty_claim_entries.claim_id, warranty_claim_entries.decision, warranty_claim_entries.decision_round]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_claim_entries.claim_id]
          action_bindings:
            warranty_claim_entries.claim_id: claim_id
    formula:
      approved_amount: min(warranty_msr_claim_covered_lines_net, per_claim_limit_usd, claim_limit)
    measures: [warranty_msr_claim_covered_lines_net]
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {per_claim_limit: "=per_claim_limit_usd", compressor_labor: "=compressor_labor_sublimit_usd", coil_labor: "=coil_labor_sublimit_usd", heat_exchanger_labor: "=heat_exchanger_labor_sublimit_usd", motor_labor: "=motor_labor_sublimit_usd", control_labor: "=control_labor_sublimit_usd", refrigerant_lbs: "=refrigerant_max_lbs_per_claim"}
        Harbison 5-Year Labor Protection: {per_claim_limit: "=per_claim_limit_usd", compressor_labor: "=compressor_labor_sublimit_usd", coil_labor: "=coil_labor_sublimit_usd", heat_exchanger_labor: "=heat_exchanger_labor_sublimit_usd", motor_labor: "=motor_labor_sublimit_usd", control_labor: "=control_labor_sublimit_usd", refrigerant_lbs: "=refrigerant_max_lbs_per_claim"}
        Harbison 10-Year Labor Protection: {per_claim_limit: "=per_claim_limit_usd", compressor_labor: "=compressor_labor_sublimit_usd", coil_labor: "=coil_labor_sublimit_usd", heat_exchanger_labor: "=heat_exchanger_labor_sublimit_usd", motor_labor: "=motor_labor_sublimit_usd", control_labor: "=control_labor_sublimit_usd", refrigerant_lbs: "=refrigerant_max_lbs_per_claim"}
        Harbison 10-Year Parts & Labor Protection: {per_claim_limit: "=per_claim_limit_usd", compressor_labor: "=compressor_labor_sublimit_usd", coil_labor: "=coil_labor_sublimit_usd", heat_exchanger_labor: "=heat_exchanger_labor_sublimit_usd", motor_labor: "=motor_labor_sublimit_usd", control_labor: "=control_labor_sublimit_usd", refrigerant_lbs: "=refrigerant_max_lbs_per_claim"}
        Harbison 12-Year Total Protection: {per_claim_limit: "=per_claim_limit_usd", compressor_labor: "=compressor_labor_sublimit_usd", coil_labor: "=coil_labor_sublimit_usd", heat_exchanger_labor: "=heat_exchanger_labor_sublimit_usd", motor_labor: "=motor_labor_sublimit_usd", control_labor: "=control_labor_sublimit_usd", refrigerant_lbs: "=refrigerant_max_lbs_per_claim"}
        Harbison 12-Year Total Protection Plus: {per_claim_limit: "=per_claim_limit_usd", compressor_labor: "=compressor_labor_sublimit_usd", coil_labor: "=coil_labor_sublimit_usd", heat_exchanger_labor: "=heat_exchanger_labor_sublimit_usd", motor_labor: "=motor_labor_sublimit_usd", control_labor: "=control_labor_sublimit_usd", refrigerant_lbs: "=refrigerant_max_lbs_per_claim"}

  - id: warranty_evt_claim_appeal
    subject: [warranty_claim_decide, warranty_claim_payout]
    rule: >-
      A denied or partially approved claim may be decided again on appeal, at most appeal_max_rounds time per claim, recorded as
      decision_round 2. An appeal is decided only when the date of handling is no later than appeal_window_days calendar days
      after the original decision was posted. Appeal-window days are counted as calendar days with the original decision date as
      day 0, and an appeal decided on the last day is accepted. An appeal is decided on the same tests as the original decision,
      using the records as they stand on the appeal date, so a maintenance visit or a manufacturer registration that existed
      before the failure but was missed in the original decision can change the outcome, whereas maintenance performed after the
      failure date never can. When the appeal approves more than the original decision, only the difference is paid out, under
      the payout components not already paid; an appeal never reduces an amount already paid. A denial for outside_coverage_term,
      component_not_covered or excluded_cause cannot be overturned by new documents and is upheld on appeal.
    eligibility:
      - id: appeal_window
        applies_to: [warranty_claim_decide]
        kind: time
        condition: An appeal is decided only when the date of handling is no later than appeal_window_days calendar days after the original decision was posted.
        evidence_fields: [warranty_claim_entries.claim_id, warranty_claim_entries.entry_date, warranty_claim_entries.decision_round]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_claim_entries.claim_id]
          action_bindings:
            warranty_claim_entries.claim_id: claim_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the original decision was posted
          anchor_source: warranty_claim_entries.entry_date
          relation: not_after
          duration_source: variants.appeal_window_days
          unit: calendar_days
          counting_rule: Appeal-window days are counted as calendar days with the original decision date as day 0, and an appeal decided on the last day is accepted.
          boundary: inclusive
      - id: one_appeal_per_claim
        applies_to: [warranty_claim_decide]
        kind: dedup
        condition: A denied or partially approved claim may be decided again on appeal, at most appeal_max_rounds time per claim, recorded as decision_round 2.
        evidence_fields: [warranty_claim_entries.claim_id, warranty_claim_entries.decision_round]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_claim_entries.claim_id]
          action_bindings:
            warranty_claim_entries.claim_id: claim_id
        dedup_contract:
          table: warranty_claim_entries
          mode: separate_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {decision_round: [2]}
          distinct_fields: []
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {appeal_days: "=appeal_window_days", appeal_rounds: "=appeal_max_rounds"}
        Harbison 5-Year Labor Protection: {appeal_days: "=appeal_window_days", appeal_rounds: "=appeal_max_rounds"}
        Harbison 10-Year Labor Protection: {appeal_days: "=appeal_window_days", appeal_rounds: "=appeal_max_rounds"}
        Harbison 10-Year Parts & Labor Protection: {appeal_days: "=appeal_window_days", appeal_rounds: "=appeal_max_rounds"}
        Harbison 12-Year Total Protection: {appeal_days: "=appeal_window_days", appeal_rounds: "=appeal_max_rounds"}
        Harbison 12-Year Total Protection Plus: {appeal_days: "=appeal_window_days", appeal_rounds: "=appeal_max_rounds"}

  - id: warranty_evt_no_lemon
    subject: [warranty_claim_payout, warranty_claim_decide]
    rule: >-
      On a tier whose unit_replacement_guarantee is true, an approved compressor or heat exchanger claim that brings the unit's
      approved compressor and heat exchanger failures within no_lemon_window_years of coverage_start to
      no_lemon_qualifying_failures is settled by replacing the unit instead of repairing it again. The replacement is paid as a
      unit_replacement payout of the cost of an equivalent unit installed by Harbison, up to unit_replacement_cap_usd and never
      beyond claim_limit_remaining, credited to the replacement installation contract the homeowner signs for it; the claim pays
      no repair lines on that visit beyond the diagnostic fee and after-hours premium the tier covers. The replacement is offered
      only when the qualifying count is reached; a failure of any other component never counts, and a failure after the window
      is repaired normally. The replacement equipment receives a new included workmanship warranty through its installation,
      while this contract stays in force on the replaced unit's record until it expires.
    eligibility:
      - id: qualifying_failures_reached
        applies_to: [warranty_claim_payout]
        kind: authorization
        condition: On a tier whose unit_replacement_guarantee is true, an approved compressor or heat exchanger claim that brings the unit's approved compressor and heat exchanger failures within no_lemon_window_years of coverage_start to no_lemon_qualifying_failures is settled by replacing the unit instead of repairing it again.
        evidence_fields: [warranty_claim_entries.equipment_id, warranty_claim_entries.component, warranty_claim_entries.decision, warranty_contracts.coverage_start]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_claim_entries.equipment_id]
          action_bindings:
            warranty_claim_entries.equipment_id: equipment_id
    measures: [warranty_msr_no_lemon_failures]
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {guarantee: "=unit_replacement_guarantee", failures: "=no_lemon_qualifying_failures", window_years: "=no_lemon_window_years", cap: "=unit_replacement_cap_usd"}
        Harbison 5-Year Labor Protection: {guarantee: "=unit_replacement_guarantee", failures: "=no_lemon_qualifying_failures", window_years: "=no_lemon_window_years", cap: "=unit_replacement_cap_usd"}
        Harbison 10-Year Labor Protection: {guarantee: "=unit_replacement_guarantee", failures: "=no_lemon_qualifying_failures", window_years: "=no_lemon_window_years", cap: "=unit_replacement_cap_usd"}
        Harbison 10-Year Parts & Labor Protection: {guarantee: "=unit_replacement_guarantee", failures: "=no_lemon_qualifying_failures", window_years: "=no_lemon_window_years", cap: "=unit_replacement_cap_usd"}
        Harbison 12-Year Total Protection: {guarantee: "=unit_replacement_guarantee", failures: "=no_lemon_qualifying_failures", window_years: "=no_lemon_window_years", cap: "=unit_replacement_cap_usd"}
        Harbison 12-Year Total Protection Plus: {guarantee: "=unit_replacement_guarantee", failures: "=no_lemon_qualifying_failures", window_years: "=no_lemon_window_years", cap: "=unit_replacement_cap_usd"}

  - id: warranty_home_sale_transfer
    subject: [warranty_transfer, warranty_register, warranty_limit_grant, warranty_charge]
    rule: >-
      Transferring a contract to the buyer of the home is the holder's own decision: the agent records a transfer request naming
      the closing date of the sale and the buyer's customer profile, and the holder confirms it. A transfer takes effect only
      once the holder has confirmed a transfer request on the contract. A transfer is accepted only when the date of handling is
      no later than transfer_window_days calendar days after the home sale closed. Transfer-window days are counted as calendar
      days with the closing date on the request as day 0, and a transfer handled on the last day is accepted. The tier must have
      transfer_allowed true, the number of transfers already made in the contract's chain must be below transfers_max, and the
      buyer must have a customer profile at the same service address. On transfer the seller's contract closes as transferred and
      a new contract is issued to the buyer with purchase_channel transfer, the same tier, scope, units and coverage dates, a
      contract_price of 0.00, and the seller's remaining claim benefit carried over; a transfer_fee of transfer_fee_usd is
      charged on the buyer's contract where it is above 0.00. Claims filed before the transfer stay with the seller's contract.
    eligibility:
      - id: holder_confirmed_transfer
        applies_to: [warranty_transfer]
        kind: authorization
        condition: A transfer takes effect only once the holder has confirmed a transfer request on the contract.
        evidence_fields: [warranty_change_requests.contract_id, warranty_change_requests.request_type, warranty_change_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_change_requests.contract_id]
          action_bindings:
            warranty_change_requests.contract_id: contract_id
      - id: transfer_window
        applies_to: [warranty_transfer]
        kind: time
        condition: A transfer is accepted only when the date of handling is no later than transfer_window_days calendar days after the home sale closed.
        evidence_fields: [warranty_change_requests.contract_id, warranty_change_requests.property_sale_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [warranty_change_requests.contract_id]
          action_bindings:
            warranty_change_requests.contract_id: contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the home sale closed
          anchor_source: warranty_change_requests.property_sale_date
          relation: not_after
          duration_source: variants.transfer_window_days
          unit: calendar_days
          counting_rule: Transfer-window days are counted as calendar days with the closing date on the request as day 0, and a transfer handled on the last day is accepted.
          boundary: inclusive
    measures: [warranty_msr_transfer_count]
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {allowed: "=transfer_allowed", window_days: "=transfer_window_days", fee: "=transfer_fee_usd", max_transfers: "=transfers_max"}
        Harbison 5-Year Labor Protection: {allowed: "=transfer_allowed", window_days: "=transfer_window_days", fee: "=transfer_fee_usd", max_transfers: "=transfers_max"}
        Harbison 10-Year Labor Protection: {allowed: "=transfer_allowed", window_days: "=transfer_window_days", fee: "=transfer_fee_usd", max_transfers: "=transfers_max"}
        Harbison 10-Year Parts & Labor Protection: {allowed: "=transfer_allowed", window_days: "=transfer_window_days", fee: "=transfer_fee_usd", max_transfers: "=transfers_max"}
        Harbison 12-Year Total Protection: {allowed: "=transfer_allowed", window_days: "=transfer_window_days", fee: "=transfer_fee_usd", max_transfers: "=transfers_max"}
        Harbison 12-Year Total Protection Plus: {allowed: "=transfer_allowed", window_days: "=transfer_window_days", fee: "=transfer_fee_usd", max_transfers: "=transfers_max"}

  - id: warranty_cancellation
    subject: [warranty_cancel, warranty_credit, warranty_refund_issued]
    rule: >-
      Cancelling a contract is the holder's own decision: the agent records a cancellation request and the holder confirms it,
      and the cancellation takes effect on the date of confirmation. A cancellation takes effect only once the holder has
      confirmed a cancellation request on the contract. Only tiers whose cancellation_allowed is true can be cancelled; the
      included workmanship warranty cannot. A full refund of contract_price is given only when the holder gives notice of this
      cancellation no later than cancellation_full_refund_days calendar days after the contract was purchased and no claim
      payout has been made on the contract. Refund-window days are counted as calendar days with the purchase date as day 0, and
      notice on the last day qualifies. Otherwise the refund is contract_price multiplied by the unused full months of the
      coverage term divided by the term's months (labor_coverage_years times twelve), rounded to the cent half up, less every
      claim payout made on the contract and less cancellation_admin_fee_usd, and never below zero. A contract still pending is
      cancelled on the same terms and counts its full term as unused. The refund posts as a cancellation_refund_credit naming the
      contract-price charge, or, for a tier bought on the installation contract, naming no charge on this contract, and the
      resulting credit balance is paid out to the original payment method. The aftermarket inspection fee is never refunded.
    eligibility:
      - id: holder_confirmed_cancellation
        applies_to: [warranty_cancel]
        kind: authorization
        condition: A cancellation takes effect only once the holder has confirmed a cancellation request on the contract.
        evidence_fields: [warranty_change_requests.contract_id, warranty_change_requests.request_type, warranty_change_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_change_requests.contract_id]
          action_bindings:
            warranty_change_requests.contract_id: contract_id
      - id: full_refund_window
        applies_to: [warranty_credit]
        kind: time
        condition: A full refund of contract_price is given only when the holder gives notice of this cancellation no later than cancellation_full_refund_days calendar days after the contract was purchased and no claim payout has been made on the contract.
        evidence_fields: [warranty_contracts.contract_id, warranty_contracts.purchase_date, warranty_claim_entries.contract_id, warranty_claim_entries.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_contracts.contract_id]
          action_bindings:
            warranty_contracts.contract_id: contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was purchased
          anchor_source: warranty_contracts.purchase_date
          relation: not_after
          duration_source: variants.cancellation_full_refund_days
          unit: calendar_days
          counting_rule: Refund-window days are counted as calendar days with the purchase date as day 0, and notice on the last day qualifies.
          boundary: inclusive
    formula:
      refund_after_window: max(0, round(contract_price * warranty_msr_unused_full_months / (labor_coverage_years * 12), 2) - warranty_msr_claims_paid - cancellation_admin_fee_usd)
    measures: [warranty_msr_unused_full_months, warranty_msr_claims_paid]
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {allowed: "=cancellation_allowed", refund_days: "=cancellation_full_refund_days", admin_fee: "=cancellation_admin_fee_usd"}
        Harbison 5-Year Labor Protection: {allowed: "=cancellation_allowed", refund_days: "=cancellation_full_refund_days", admin_fee: "=cancellation_admin_fee_usd"}
        Harbison 10-Year Labor Protection: {allowed: "=cancellation_allowed", refund_days: "=cancellation_full_refund_days", admin_fee: "=cancellation_admin_fee_usd"}
        Harbison 10-Year Parts & Labor Protection: {allowed: "=cancellation_allowed", refund_days: "=cancellation_full_refund_days", admin_fee: "=cancellation_admin_fee_usd"}
        Harbison 12-Year Total Protection: {allowed: "=cancellation_allowed", refund_days: "=cancellation_full_refund_days", admin_fee: "=cancellation_admin_fee_usd"}
        Harbison 12-Year Total Protection Plus: {allowed: "=cancellation_allowed", refund_days: "=cancellation_full_refund_days", admin_fee: "=cancellation_admin_fee_usd"}

  - id: warranty_lifecycle_closure
    subject: [warranty_expire, warranty_decline, warranty_credit, warranty_refund_issued]
    rule: >-
      An active contract expires on the day after coverage_end; failures diagnosed after coverage_end are not covered even when
      the claim would otherwise qualify, and claims already filed before expiry are still decided and paid. An aftermarket
      purchase whose inspection finds the equipment failing, leaking refrigerant, cracked, or already under a repair
      recommendation is declined: the contract closes from pending to cancelled and its contract price is credited back in full
      as an inspection_failure_credit naming the contract-price charge, while the inspection fee stays charged. A declined
      purchase is decided only while the contract status is pending. Any credit balance left on a closed contract is paid out to
      the original payment method as a refund_payout naming the credit.
    eligibility:
      - id: decline_while_pending
        applies_to: [warranty_decline]
        kind: authorization
        condition: A declined purchase is decided only while the contract status is pending.
        evidence_fields: [warranty_contracts.contract_id, warranty_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_contracts.contract_id]
          action_bindings:
            warranty_contracts.contract_id: contract_id

  - id: warranty_billing
    subject: [warranty_payment, warranty_charge, warranty_refund_issued]
    rule: >-
      A payment is applied to the contract's oldest unpaid charge first. A post-installation or aftermarket contract price and
      the inspection fee are due on purchase, and the contract does not activate until the contract price is paid. A claim
      service fee is due with the service invoice of the visit; an unpaid fee is collected with that invoice and never suspends
      coverage or delays a payout. A transfer fee is due from the buyer before the buyer's next claim is paid. Refund payouts go
      to the original payment method only, never as cash, and a payout equals the negative contract_balance it clears.
    eligibility: []

