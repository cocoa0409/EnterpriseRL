# Harbison protection contracts — product and event policy charter.
# Functional surface: issue of the included workmanship warranty at installation, purchase of protection
# with an installation, within the post-installation window or on inspected existing equipment; pricing by
# scope and capacity; activation, waiting periods and the lifetime claim benefit; claim filing, decision
# (coverage term, covered components, manufacturer-first parts, documented maintenance, filing deadline,
# exclusions), payout with component sublimits and per-claim and lifetime limits, the one-fee-per-visit
# claim service fee and its Comfort Club waiver, one appeal per claim, the no-lemon unit replacement,
# home-sale transfer, holder-confirmed cancellation with pro-rata refund, failed-inspection decline,
# expiry, payments and refund payouts.

category: warranty
display_name: Harbison Protection Contracts

binding:
  holding_table: warranty_contracts
  event_tables: [warranty_claim_entries, warranty_billing_entries]
  intake_tables: [warranty_change_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    claim_limit_remaining: claim_limit
    contract_balance: contract_balance

lifecycle:
  states: [pending, active, expired, transferred, cancelled]
  transitions:
    - {from: pending, to: active, by: system, means: "Coverage starts: the installation is complete, or a purchased contract is paid and its waiting period has passed, or a transferred contract is issued to the buyer."}
    - {from: pending, to: cancelled, by: agent, means: "Existing equipment fails the aftermarket inspection and the purchase is declined."}
    - {from: active, to: expired, by: system, means: "The day after coverage_end arrives."}
    - {from: active, to: transferred, by: user, means: "The holder confirms a transfer of the contract to the buyer of the home."}
    - {from: active, to: cancelled, by: user, means: "The holder confirms their own cancellation request."}

accounts:
  - key: claim_limit
    unit: USD
    meaning: Aggregate claim benefit still available over the contract's life; the activation or transfer grant raises it and each claim payout lowers it.
  - key: contract_balance
    unit: USD
    meaning: Amount the holder owes on the contract; charges and refund payouts raise it, payments and credits lower it, and a negative value is money Harbison owes the holder.

parameter_schema:
  labor_coverage_years: Years from coverage_start during which covered labor is paid; also the contract term, integer years.
  parts_coverage_years: Years from coverage_start during which covered parts are paid once no manufacturer parts warranty applies; 0 means parts are never paid, integer years.
  covered_components: Components whose failure the contract covers, list of warranty_claim_entries.component values.
  refrigerant_covered: Whether refrigerant added during a covered repair is paid, boolean.
  refrigerant_max_lbs_per_claim: Most pounds of refrigerant paid on one claim, pounds.
  refrigerant_leak_search_covered: Whether the refrigerant leak search task is paid on a covered refrigerant-circuit failure, boolean.
  diagnostic_fee_covered: Whether the diagnostic fee of the visit on which a covered failure was diagnosed is paid, boolean.
  after_hours_premium_covered: Whether the after-hours premium of that visit is paid, boolean.
  claim_service_fee_usd: Service fee the holder pays per visit on which a claim is approved; 0.00 means none, USD.
  per_claim_limit_usd: Most the contract pays on one claim, USD.
  lifetime_claim_limit_usd: Aggregate claim benefit granted at activation for the life of the contract, USD.
  compressor_labor_sublimit_usd: Most paid for labor on a compressor claim; 0.00 where compressors are not covered, USD.
  coil_labor_sublimit_usd: Most paid for labor on an evaporator or condenser coil claim; 0.00 where coils are not covered, USD.
  heat_exchanger_labor_sublimit_usd: Most paid for labor on a heat exchanger claim; 0.00 where heat exchangers are not covered, USD.
  motor_labor_sublimit_usd: Most paid for labor on a blower, condenser fan or inducer motor claim; 0.00 where motors are not covered, USD.
  control_labor_sublimit_usd: Most paid for labor on a control board, defrost board or gas valve claim; 0.00 where these are not covered, USD.
  price_single_unit_up_to_3_tons_usd: Price for one unit of up to 3.0 nominal tons, or for heating-only equipment, USD.
  price_single_unit_over_3_tons_usd: Price for one unit over 3.0 nominal tons, USD.
  price_matched_system_up_to_3_tons_usd: Price for a matched indoor and outdoor system whose outdoor unit is up to 3.0 nominal tons, USD.
  price_matched_system_over_3_tons_usd: Price for a matched system whose outdoor unit is over 3.0 nominal tons, USD.
  matched_system_scope_available: Whether the tier can be bought to cover a matched system, boolean.
  included_with_installation: Whether the tier is issued at no charge with every Harbison installation, boolean.
  with_installation_upgrade_discount_pct: Discount when the tier is bought on the installation contract, percent.
  post_install_purchase_window_days: Calendar days after a Harbison installation is completed during which the tier can still be bought without inspection; 0 means not offered this way, integer days.
  aftermarket_purchase_allowed: Whether the tier can be bought on existing equipment after inspection, boolean.
  aftermarket_max_equipment_age_years: Oldest equipment age, from install date, eligible for an aftermarket purchase; 0 where aftermarket purchase is not offered, integer years.
  aftermarket_inspection_fee_usd: Inspection fee for an aftermarket purchase, USD.
  aftermarket_waiting_period_days: Calendar days after an aftermarket purchase before coverage starts, integer days.
  aftermarket_eligible_brands: Equipment brands eligible for aftermarket purchase, list of brand names.
  maintenance_required: Whether claims require documented maintenance on the failed unit, boolean.
  maintenance_interval_months: Longest span, in months, allowed between the most recent documented maintenance and the failure, before grace, integer months.
  maintenance_grace_days: Calendar days added to the maintenance interval, integer days.
  maintenance_proof_sources: Records accepted as documented maintenance, list.
  claim_filing_deadline_days: Calendar days after the failure is diagnosed within which a claim must be filed, integer days.
  appeal_window_days: Calendar days after the original decision within which an appeal may be decided, integer days.
  appeal_max_rounds: Appeals allowed per claim, integer.
  transfer_allowed: Whether the contract may pass to the buyer of the home, boolean.
  transfer_window_days: Calendar days after the home sale closes within which a transfer must be requested, integer days.
  transfer_fee_usd: Fee charged on the buyer's contract for a transfer; 0.00 means none, USD.
  transfers_max: Transfers allowed over the contract's life, integer.
  cancellation_allowed: Whether the holder may cancel for a refund, boolean.
  cancellation_full_refund_days: Calendar days after purchase within which a cancellation with no claims paid is refunded in full; 0 where cancellation is not allowed, integer days.
  cancellation_admin_fee_usd: Administrative fee deducted from a pro-rata cancellation refund, USD.
  unit_replacement_guarantee: Whether the no-lemon unit replacement applies, boolean.
  no_lemon_qualifying_failures: Approved compressor or heat exchanger failures on the same unit that trigger replacement; 0 where the guarantee does not apply, integer.
  no_lemon_window_years: Years from coverage_start within which the qualifying failures must occur; 0 where the guarantee does not apply, integer years.
  unit_replacement_cap_usd: Most paid toward a no-lemon replacement unit and its installation; 0.00 where the guarantee does not apply, USD.
  deductible_waived_for_unit_replacement: Whether no claim service fee is charged on a no-lemon replacement, boolean.
  parts_secondary_to_manufacturer: Whether parts are paid only once no manufacturer parts warranty applies, boolean.
  third_party_repair_reimbursed: Whether repairs performed by another contractor are reimbursed, boolean.
  max_contracts_per_unit: Purchased protection contracts that may be in force on one unit at the same time, integer.

