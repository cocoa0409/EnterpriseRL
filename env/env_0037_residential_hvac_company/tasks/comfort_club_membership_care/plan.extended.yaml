events:
  - type: plan_enroll
    target: plan_agreements
    mutation: create
    meaning: A homeowner enrolls the systems at their address in a Comfort Club tier, opening a pending agreement.
    grain: One row per agreement enrolled.
    fields:
      agreement_id: Reference number assigned to the new agreement.
      customer_id: Enrolling homeowner.
      variant_name: Comfort Club tier chosen.
      enrolled_date: Date of enrollment (the date of handling).
      term_start: First day of the first term, equal to enrolled_date.
      term_end: Last day of the first term, one day before the same calendar date term_months later.
      billing_frequency: Annual or monthly billing chosen at enrollment.
      systems_covered: Number of systems enrolled.
      auto_renew: Automatic renewal setting, true at enrollment unless the member declines it.
      enrollment_channel: Channel the enrollment came through.
      consecutive_terms: Set to 1.
      locked_annual_rate: The first-system annual rate for the tier when the tier carries a price lock, else 0.00.
    triggers:
      - event: plan:plan_dues_charge
        when: {billing_frequency: annual}
        map: {agreement_id: agreement_id, customer_id: customer_id, line_type: annual_dues}
      - event: plan:plan_dues_charge
        when: {billing_frequency: monthly}
        map: {agreement_id: agreement_id, customer_id: customer_id, line_type: monthly_dues}
      - event: plan:plan_visit_grant
        map: {agreement_id: agreement_id, customer_id: customer_id, term_start: term_start, entry_reason: new_term}
      - event: plan:plan_coverage_grant
        when: {variant_name: [Comfort Club Platinum Plus, Comfort Club Total Home]}
        map: {agreement_id: agreement_id, customer_id: customer_id, term_start: term_start, entry_reason: new_term}

  - type: plan_activate
    target: plan_agreements
    mutation: {transition: {from: pending, to: active}}
    meaning: The first dues payment posts and the membership starts.
    grain: One row per transaction.
    fields:
      agreement_id: Agreement activated.
      status: Set to active.
    triggers: []

  - type: plan_dues_charge
    target: plan_billing_entries
    meaning: A dues or fee amount is billed to the agreement.
    grain: One row per dues or fee charge for one billing period.
    distinguish_by: [line_type, billing_period, posted_date]
    fields:
      agreement_id: Agreement billed.
      customer_id: Member billed.
      line_type: "Charge kind: annual_dues, monthly_dues, additional_system_dues, upgrade_proration, renewal_dues, reinstatement_fee, late_fee, missed_appointment_fee, enrollment_inspection_fee or cancellation_fee."
      billing_period: Billing month the charge belongs to.
      amount: Amount billed.
      posted_date: Date posted.
    account: dues_receivable
    direction: in
    triggers: []

  - type: plan_dues_payment
    target: plan_billing_entries
    meaning: The member pays dues or fees on the agreement.
    grain: One row per payment received.
    distinguish_by: [payment_reference]
    fields:
      agreement_id: Agreement paid.
      customer_id: Paying member.
      line_type: Always dues_payment.
      billing_period: Month the payment posts.
      amount: Amount paid.
      posted_date: Date the payment posted.
      payment_method: How the payment was made.
      payment_reference: Processor confirmation number.
    account: dues_receivable
    direction: out
    triggers: []

  - type: plan_dues_credit
    target: plan_billing_entries
    meaning: A credit reduces what the member owes on the agreement.
    grain: One row per credit, tied to the charge or service call that earned it.
    distinguish_by: [line_type, source_entry_id, ticket_id]
    fields:
      agreement_id: Agreement credited.
      customer_id: Member credited.
      line_type: "Credit kind: cancellation_proration_credit, response_guarantee_credit or late_fee_waiver."
      billing_period: Month the credit posts.
      amount: Amount credited.
      posted_date: Date posted.
      source_entry_id: The late fee a waiver reverses, or the term's dues charge a cancellation credit refunds.
      ticket_id: Service call a response-guarantee credit was earned on.
    account: dues_receivable
    direction: out
    triggers:
      - event: plan:plan_refund_issued
        when: {line_type: cancellation_proration_credit}
        map: {agreement_id: agreement_id, customer_id: customer_id, source_entry_id: billing_entry_id, line_type: refund_payout}

  - type: plan_refund_issued
    target: plan_billing_entries
    meaning: A credit balance on a closed agreement is paid back to the member.
    grain: One row per payout, tied to the credit it pays out.
    distinguish_by: [source_entry_id]
    fields:
      agreement_id: Agreement refunded.
      customer_id: Member refunded.
      line_type: Always refund_payout.
      billing_period: Month the payout posts.
      amount: Amount paid out, equal to the negative dues balance being cleared.
      posted_date: Date of payout.
      payment_method: Always original_payment_method.
      payment_reference: Payout confirmation number.
      source_entry_id: The credit being paid out.
    account: dues_receivable
    direction: in
    triggers: []

  - type: plan_visit_grant
    target: plan_service_entries
    meaning: Maintenance visits are made available for a term, an added system or an upgrade.
    grain: One row per grant per enrolled system (or one whole-home grant) per term and reason.
    distinguish_by: [term_start, entry_reason, equipment_id]
    fields:
      agreement_id: Agreement granted.
      customer_id: Member.
      entry_reason: new_term, renewal_term, additional_system or tier_upgrade.
      term_start: Term the visits belong to.
      equipment_id: System the tune-up visits are for; empty for the whole-home grant.
      visits: Visits granted.
      entry_date: Date posted.
    account: visit_allowance
    direction: in
    triggers: []

  - type: plan_tuneup_visit
    target: plan_service_entries
    meaning: A maintenance visit is performed, or a booked visit is forfeited because the member missed it or cancelled too late.
    grain: One row per visit appointment that consumed a visit.
    distinguish_by: [equipment_id, season, entry_date]
    fields:
      agreement_id: Agreement used.
      customer_id: Member.
      entry_reason: completed_visit, no_show_forfeit or late_cancel_forfeit.
      term_start: Term the visit is charged to.
      equipment_id: System tuned up; empty for a whole-home visit.
      season: cooling, heating or whole_home.
      visits: Always 1.
      entry_date: Date of the appointment.
    account: visit_allowance
    direction: out
    triggers:
      - event: plan:plan_dues_charge
        when: {entry_reason: [no_show_forfeit, late_cancel_forfeit]}
        map: {agreement_id: agreement_id, customer_id: customer_id, line_type: missed_appointment_fee}

  - type: plan_visit_expiry
    target: plan_service_entries
    meaning: Visits left unused are removed when the term ends or the agreement closes.
    grain: One row per term and expiry reason.
    distinguish_by: [term_start, entry_reason]
    fields:
      agreement_id: Agreement.
      customer_id: Member.
      entry_reason: term_expiry or agreement_closed.
      term_start: Term whose visits expire.
      visits: Unused visits removed, equal to visits_remaining at that moment.
      entry_date: Date posted.
    account: visit_allowance
    direction: out
    triggers: []

  - type: plan_coverage_grant
    target: plan_service_entries
    meaning: Covered-repair benefit is made available for a term on a tier that includes covered repairs.
    grain: One row per term and grant reason.
    distinguish_by: [term_start, entry_reason]
    fields:
      agreement_id: Agreement granted.
      customer_id: Member.
      entry_reason: new_term or renewal_term.
      term_start: Term the benefit belongs to.
      amount: Benefit granted.
      entry_date: Date posted.
    account: repair_coverage
    direction: in
    triggers: []

  - type: plan_coverage_draw
    target: plan_service_entries
    meaning: Covered-repair benefit pays part of a repair invoice line on a member's service call.
    grain: One row per invoice line paid.
    distinguish_by: [ticket_id, source_line_id]
    fields:
      agreement_id: Agreement drawn on.
      customer_id: Member.
      entry_reason: Always covered_repair.
      term_start: Term whose benefit is drawn.
      amount: Amount paid toward the line.
      entry_date: Date posted.
      ticket_id: Service call repaired.
      source_line_id: Invoice line paid.
    account: repair_coverage
    direction: out
    triggers: []

  - type: plan_coverage_expiry
    target: plan_service_entries
    meaning: Covered-repair benefit left unused is removed when the term ends or the agreement closes.
    grain: One row per term and expiry reason.
    distinguish_by: [term_start, entry_reason]
    fields:
      agreement_id: Agreement.
      customer_id: Member.
      entry_reason: term_expiry or agreement_closed.
      term_start: Term whose benefit expires.
      amount: Unused benefit removed, equal to repair_coverage_remaining at that moment.
      entry_date: Date posted.
    account: repair_coverage
    direction: out
    triggers: []

  - type: plan_renew
    target: plan_agreements
    mutation: update
    meaning: The agreement rolls into a new twelve-month term.
    grain: One row per transaction.
    fields:
      agreement_id: Agreement renewed.
      variant_name: Tier for the new term (changes only when a confirmed downgrade or a renewal-time upgrade applies).
      billing_frequency: Billing frequency for the new term.
      term_start: Day after the previous term_end.
      term_end: One day before the same calendar date term_months later.
      consecutive_terms: Previous count plus 1.
      locked_annual_rate: First-system annual rate the new term was billed at when the tier carries a price lock, else 0.00.
    triggers:
      - event: plan:plan_dues_charge
        when: {billing_frequency: annual}
        map: {agreement_id: agreement_id, line_type: renewal_dues}
      - event: plan:plan_dues_charge
        when: {billing_frequency: monthly}
        map: {agreement_id: agreement_id, line_type: monthly_dues}
      - event: plan:plan_visit_grant
        map: {agreement_id: agreement_id, term_start: term_start, entry_reason: renewal_term}
      - event: plan:plan_coverage_grant
        when: {variant_name: [Comfort Club Platinum Plus, Comfort Club Total Home]}
        map: {agreement_id: agreement_id, term_start: term_start, entry_reason: renewal_term}

  - type: plan_tier_change
    target: plan_agreements
    mutation: update
    meaning: An active agreement moves up to a higher tier in the middle of a term.
    grain: One row per transaction.
    fields:
      agreement_id: Agreement changed.
      variant_name: New tier.
      locked_annual_rate: First-system annual rate of the new tier when it carries a price lock, else 0.00.
    triggers:
      - event: plan:plan_dues_charge
        map: {agreement_id: agreement_id, line_type: upgrade_proration}

  - type: plan_add_system
    target: plan_agreements
    mutation: update
    meaning: Another system at the address is enrolled under an active agreement in the middle of a term.
    grain: One row per transaction.
    fields:
      agreement_id: Agreement changed.
      systems_covered: New count of enrolled systems.
    triggers:
      - event: plan:plan_dues_charge
        map: {agreement_id: agreement_id, line_type: additional_system_dues}
      - event: plan:plan_visit_grant
        map: {agreement_id: agreement_id, entry_reason: additional_system}

  - type: plan_preferences_update
    target: plan_agreements
    mutation: update
    meaning: The member turns automatic renewal off or back on.
    grain: One row per transaction.
    fields:
      agreement_id: Agreement changed.
      auto_renew: New automatic renewal setting.
    triggers: []

  - type: plan_past_due
    target: plan_agreements
    mutation: {transition: {from: active, to: past_due}}
    meaning: A dues charge stays unpaid past the grace period.
    grain: One row per transaction.
    fields:
      agreement_id: Agreement.
      status: Set to past_due.
    triggers:
      - event: plan:plan_dues_charge
        map: {agreement_id: agreement_id, line_type: late_fee}

  - type: plan_cure
    target: plan_agreements
    mutation: {transition: {from: past_due, to: active}}
    meaning: Every overdue dues charge and fee is paid and the agreement returns to good standing.
    grain: One row per transaction.
    fields:
      agreement_id: Agreement.
      status: Set to active.
    triggers: []

  - type: plan_lapse
    target: plan_agreements
    mutation: {transition: {from: active, to: lapsed}}
    meaning: The term ends on an agreement that is not set to renew automatically.
    grain: One row per transaction.
    fields:
      agreement_id: Agreement.
      status: Set to lapsed.
    triggers: []

  - type: plan_reinstate
    target: plan_agreements
    mutation: {transition: {from: lapsed, to: active}}
    meaning: A lapsed agreement is brought back within its renewal grace period.
    grain: One row per transaction.
    fields:
      agreement_id: Agreement.
      status: Set to active.
      variant_name: Tier being reinstated.
    triggers:
      - event: plan:plan_renew
        map: {agreement_id: agreement_id}
      - event: plan:plan_dues_charge
        when: {variant_name: [Comfort Club Basic, Comfort Club Silver, Comfort Club Gold]}
        map: {agreement_id: agreement_id, line_type: reinstatement_fee}

  - type: plan_customer_cancel
    target: plan_agreements
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The member's own confirmed cancellation takes effect.
    grain: One row per transaction.
    fields:
      agreement_id: Agreement.
      status: Set to cancelled.
      cancelled_date: Date the cancellation takes effect.
      billing_frequency: Billing frequency of the term being cancelled.
    triggers:
      - event: plan:plan_dues_credit
        when: {billing_frequency: annual}
        map: {agreement_id: agreement_id, line_type: cancellation_proration_credit}

  - type: plan_terminate
    target: plan_agreements
    mutation:
      transition:
        - {from: past_due, to: cancelled}
        - {from: lapsed, to: cancelled}
        - {from: pending, to: cancelled}
    meaning: An agreement is closed without a member cancellation - for nonpayment, at the end of the renewal grace period, or because its first dues were never paid.
    grain: One row per transaction.
    fields:
      agreement_id: Agreement.
      status: Set to cancelled.
      cancelled_date: Date the closure takes effect.
    triggers: []

measures:
  - id: plan_msr_term_dues_billed
    window: The agreement's current term, from term_start through term_end inclusive.
    measure: Sum of amount over plan_dues_charge entries with line_type annual_dues, renewal_dues, additional_system_dues or upgrade_proration whose billing_period falls within the current term.
  - id: plan_msr_term_tuneups_completed
    window: The agreement's current term, from term_start through term_end inclusive.
    measure: Count of plan_tuneup_visit entries with entry_reason completed_visit and season cooling or heating whose term_start equals the current term_start.
  - id: plan_msr_term_whole_home_completed
    window: The agreement's current term, from term_start through term_end inclusive.
    measure: Count of plan_tuneup_visit entries with entry_reason completed_visit and season whole_home whose term_start equals the current term_start.
  - id: plan_msr_term_coverage_drawn
    window: The agreement's current term, from term_start through term_end inclusive.
    measure: Sum of amount over plan_coverage_draw entries whose term_start equals the current term_start.
  - id: plan_msr_unused_full_months
    window: From the date the change takes effect through the current term_end inclusive.
    measure: Count of whole calendar months remaining, counted as complete month-to-month steps from the effective date that end on or before term_end (a partial month counts as zero).
  - id: plan_msr_late_fee_waivers_12m
    window: Rolling 12 calendar months ending on the date of handling (the same calendar date one year earlier is excluded).
    measure: Count of plan_dues_credit entries with line_type late_fee_waiver posted to the agreement within the window.
  - id: plan_msr_ticket_covered_repair_net
    window: One service ticket.
    measure: Sum of amount over the ticket's service_charge lines with line_type repair_parts or repair_labor on enrolled systems, less the member_repair_discount lines and warranty_claim_coverage credits applied to those same lines.

policies:
  - id: plan_agg_multi_holding
    subject: [plan_enroll]
    rule: >-
      A customer may hold only one Comfort Club agreement, and that one agreement covers every enrolled system at the customer's
      single service address up to the tier's max_systems_covered. A new agreement may be enrolled only when the customer has no
      other Comfort Club agreement in pending, active, past_due or lapsed status. A customer whose agreement is lapsed and still
      inside its renewal grace period is reinstated under plan_reinstatement rather than enrolled again; a customer whose earlier
      agreement is cancelled may enroll a new agreement, which starts consecutive_terms again at 1 and carries no locked rate from
      the old agreement.
    eligibility:
      - id: one_open_agreement
        applies_to: [plan_enroll]
        kind: dedup
        condition: A new agreement may be enrolled only when the customer has no other Comfort Club agreement in pending, active, past_due or lapsed status.
        evidence_fields: [plan_agreements.customer_id, plan_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.customer_id]
          action_bindings:
            plan_agreements.customer_id: customer_id
        dedup_contract:
          table: plan_agreements
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending, active, past_due, lapsed]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: plan_enrollment_eligibility
    subject: [plan_enroll, plan_add_system, plan_dues_charge]
    rule: >-
      Every system enrolled must be an equipment unit registered at the customer's address with equipment_status in_service, and
      it must be a heating or cooling unit (central air conditioner, heat pump, gas furnace, air handler, ductless mini-split or
      boiler); a tank water heater is never enrolled as a system, and on tiers with whole-home visits the water heater is serviced
      on the whole-home visit instead. An indoor unit and the outdoor unit it is paired with count as one system. Each enrolled
      system must be no older than the tier's max_equipment_age_years on the enrollment date: the enrollment date must not be
      later than the equipment's install date plus max_equipment_age_years. The age limit is counted in calendar months as
      max_equipment_age_years times twelve added to the install date, falling back to the last day of the month when that day
      does not exist, and an enrollment dated exactly on that boundary is accepted. A system older than the tier's
      enrollment_inspection_age_years but within the age limit is enrolled only with an enrollment inspection, billed once per
      inspected system as an enrollment_inspection_fee charge at the tier's enrollment_inspection_fee_usd; a fee of 0.00 means
      the inspection is performed without charge and no fee entry is posted. The number of systems enrolled, at enrollment or
      by adding a system, may not exceed the tier's max_systems_covered; a customer with more systems enrolls the ones they
      choose or takes a tier with a higher limit. The same age limit and inspection rule apply to a system added mid-term,
      measured on the date it is added. Enrollment opens the agreement in pending status with term_start equal to the enrollment
      date, term_end one day before the same calendar date term_months later, and consecutive_terms set to 1.
    eligibility:
      - id: equipment_in_service
        applies_to: [plan_enroll, plan_add_system]
        kind: state
        condition: Every system enrolled must be an equipment unit registered at the customer's address with equipment_status in_service
        evidence_fields: [equipment.equipment_id, equipment.customer_id, equipment.equipment_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [equipment.equipment_id]
          action_bindings:
            equipment.equipment_id: equipment_id
        state_contract:
          field: equipment.equipment_status
          allowed: [in_service]
      - id: equipment_age_limit
        applies_to: [plan_enroll, plan_add_system]
        kind: time
        condition: "Each enrolled system must be no older than the tier's max_equipment_age_years on the enrollment date: the enrollment date must not be later than the equipment's install date plus max_equipment_age_years."
        evidence_fields: [equipment.equipment_id, equipment.install_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [equipment.equipment_id]
          action_bindings:
            equipment.equipment_id: equipment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the equipment's install date
          anchor_source: equipment.install_date
          relation: not_after
          duration_source: variants.max_equipment_age_years
          unit: calendar_months
          counting_rule: The age limit is counted in calendar months as max_equipment_age_years times twelve added to the install date, falling back to the last day of the month when that day does not exist, and an enrollment dated exactly on that boundary is accepted.
          boundary: inclusive
    params:
      per_tier:
        Comfort Club Basic: {age_limit_years: "=max_equipment_age_years", inspection_over_years: "=enrollment_inspection_age_years", inspection_fee: "=enrollment_inspection_fee_usd"}
        Comfort Club Silver: {age_limit_years: "=max_equipment_age_years", inspection_over_years: "=enrollment_inspection_age_years", inspection_fee: "=enrollment_inspection_fee_usd"}
        Comfort Club Gold: {age_limit_years: "=max_equipment_age_years", inspection_over_years: "=enrollment_inspection_age_years", inspection_fee: "=enrollment_inspection_fee_usd"}
        Comfort Club Platinum: {age_limit_years: "=max_equipment_age_years", inspection_over_years: "=enrollment_inspection_age_years", inspection_fee: "=enrollment_inspection_fee_usd"}
        Comfort Club Platinum Plus: {age_limit_years: "=max_equipment_age_years", inspection_over_years: "=enrollment_inspection_age_years", inspection_fee: "=enrollment_inspection_fee_usd"}
        Comfort Club Total Home: {age_limit_years: "=max_equipment_age_years", inspection_over_years: "=enrollment_inspection_age_years", inspection_fee: "=enrollment_inspection_fee_usd"}

  - id: plan_dues_pricing
    subject: [plan_dues_charge, plan_enroll, plan_renew]
    rule: >-
      Annual dues for a term are annual_dues_first_system_usd plus annual_dues_additional_system_usd for each enrolled system
      beyond the first, billed once in advance as annual_dues for the first term or renewal_dues for later terms, with
      billing_period equal to the month of term_start. Monthly dues are monthly_dues_first_system_usd plus
      monthly_dues_additional_system_usd for each system beyond the first, billed as monthly_dues on the first day of each
      calendar month for that month; the first monthly charge posts on the enrollment date for the enrollment month in full,
      with no partial-month proration. Monthly billing is available only with card-on-file or ACH autopay when the tier's
      monthly_billing_autopay_required is true. An agreement enrolled through the web channel receives web_enrollment_discount_pct
      off every dues charge of its first term only; renewal terms never carry it, and it does not apply to fees. At an automatic
      renewal of an annually billed agreement on a tier whose price_lock_on_renewal is true, the first-system rate for the new
      term is the lower of the agreement's locked_annual_rate and the current annual_dues_first_system_usd, and additional
      systems are billed at the current catalogue rate. When the renewing term's consecutive_terms reaches
      loyalty_consecutive_terms_required, the annual renewal dues after the price lock are reduced by loyalty_discount_pct.
      Monthly agreements renew at the current monthly catalogue rates with neither price lock nor loyalty discount. Every
      discounted amount is rounded to the cent, half up. A billing-frequency change requested mid-term is applied only at the
      next renewal.
    eligibility: []
    formula:
      annual_dues: annual_dues_first_system_usd + annual_dues_additional_system_usd * (systems_covered - 1)
      monthly_dues: monthly_dues_first_system_usd + monthly_dues_additional_system_usd * (systems_covered - 1)
      renewal_first_rate: min(locked_annual_rate, annual_dues_first_system_usd) if price_lock_on_renewal else annual_dues_first_system_usd
      renewal_dues: round((renewal_first_rate + annual_dues_additional_system_usd * (systems_covered - 1)) * ((1 - loyalty_discount_pct / 100) if consecutive_terms >= loyalty_consecutive_terms_required else 1), 2)
    params:
      per_tier:
        Comfort Club Basic: {annual_first: "=annual_dues_first_system_usd", annual_additional: "=annual_dues_additional_system_usd", monthly_first: "=monthly_dues_first_system_usd", monthly_additional: "=monthly_dues_additional_system_usd", loyalty_pct: "=loyalty_discount_pct", web_pct: "=web_enrollment_discount_pct"}
        Comfort Club Silver: {annual_first: "=annual_dues_first_system_usd", annual_additional: "=annual_dues_additional_system_usd", monthly_first: "=monthly_dues_first_system_usd", monthly_additional: "=monthly_dues_additional_system_usd", loyalty_pct: "=loyalty_discount_pct", web_pct: "=web_enrollment_discount_pct"}
        Comfort Club Gold: {annual_first: "=annual_dues_first_system_usd", annual_additional: "=annual_dues_additional_system_usd", monthly_first: "=monthly_dues_first_system_usd", monthly_additional: "=monthly_dues_additional_system_usd", loyalty_pct: "=loyalty_discount_pct", web_pct: "=web_enrollment_discount_pct"}
        Comfort Club Platinum: {annual_first: "=annual_dues_first_system_usd", annual_additional: "=annual_dues_additional_system_usd", monthly_first: "=monthly_dues_first_system_usd", monthly_additional: "=monthly_dues_additional_system_usd", loyalty_pct: "=loyalty_discount_pct", web_pct: "=web_enrollment_discount_pct"}
        Comfort Club Platinum Plus: {annual_first: "=annual_dues_first_system_usd", annual_additional: "=annual_dues_additional_system_usd", monthly_first: "=monthly_dues_first_system_usd", monthly_additional: "=monthly_dues_additional_system_usd", loyalty_pct: "=loyalty_discount_pct", web_pct: "=web_enrollment_discount_pct"}
        Comfort Club Total Home: {annual_first: "=annual_dues_first_system_usd", annual_additional: "=annual_dues_additional_system_usd", monthly_first: "=monthly_dues_first_system_usd", monthly_additional: "=monthly_dues_additional_system_usd", loyalty_pct: "=loyalty_discount_pct", web_pct: "=web_enrollment_discount_pct"}

  - id: plan_billing_collections
    subject: [plan_dues_payment, plan_activate, plan_past_due, plan_cure, plan_terminate, plan_dues_charge, plan_dues_credit]
    rule: >-
      A payment is applied to the agreement's oldest unpaid charge first, then to the next oldest. A pending agreement becomes
      active on the day the payment covering its first dues charge posts; an enrollment whose first dues charge is still unpaid
      nonpayment_termination_days after it posted is closed from pending to cancelled. An agreement is moved to past_due only
      once a dues charge has stayed unpaid for more than monthly_payment_grace_days calendar days after the dues charge was
      posted. Grace and termination days are counted as calendar days from the day after the posting date, so day 1 is the day
      after the charge posts. Moving to past_due posts a late_fee of late_fee_usd for that billing_period. Only one late fee is
      charged per unpaid billing_period. A payment that clears every overdue charge and fee returns the agreement to active the
      day it posts. An agreement still holding a dues charge unpaid nonpayment_termination_days after that charge was posted is
      terminated from past_due to cancelled with no cancellation credit and no cancellation fee, and its unpaid charges remain
      owed. A late fee may be waived only while the number of late_fee_waiver credits posted to the agreement in the 12 months
      before the waiver date is below the tier's late_fee_waivers_per_12_months. A waiver credits the full late fee, names that
      fee as its source, and is never granted on a late fee that has already been waived; a tier with zero waivers never waives
      late fees. While an agreement is past_due its member benefits are suspended: no tune-up is booked, no covered repair is
      drawn and no response-guarantee credit is earned until it is active again.
    eligibility:
      - id: grace_elapsed
        applies_to: [plan_past_due]
        kind: time
        condition: An agreement is moved to past_due only once a dues charge has stayed unpaid for more than monthly_payment_grace_days calendar days after the dues charge was posted.
        evidence_fields: [plan_billing_entries.billing_entry_id, plan_billing_entries.posted_date, plan_billing_entries.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_billing_entries.billing_entry_id]
          action_bindings:
            plan_billing_entries.billing_entry_id: billing_entry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the dues charge was posted
          anchor_source: plan_billing_entries.posted_date
          relation: not_before
          duration_source: variants.monthly_payment_grace_days
          unit: calendar_days
          counting_rule: Grace and termination days are counted as calendar days from the day after the posting date, so day 1 is the day after the charge posts.
          boundary: exclusive
      - id: one_late_fee_per_period
        applies_to: [plan_dues_charge]
        kind: dedup
        condition: Only one late fee is charged per unpaid billing_period.
        evidence_fields: [plan_billing_entries.agreement_id, plan_billing_entries.billing_period, plan_billing_entries.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_billing_entries.agreement_id, plan_billing_entries.billing_period]
          action_bindings:
            plan_billing_entries.agreement_id: agreement_id
            plan_billing_entries.billing_period: billing_period
        dedup_contract:
          table: plan_billing_entries
          mode: separate_record
          object_bindings: {agreement_id: agreement_id, billing_period: billing_period}
          duplicate_filters: {line_type: [late_fee]}
          distinct_fields: []
      - id: waiver_allowance
        applies_to: [plan_dues_credit]
        kind: authorization
        condition: A late fee may be waived only while the number of late_fee_waiver credits posted to the agreement in the 12 months before the waiver date is below the tier's late_fee_waivers_per_12_months.
        evidence_fields: [plan_billing_entries.agreement_id, plan_billing_entries.line_type, plan_billing_entries.posted_date, plan_billing_entries.source_entry_id, plan_agreements.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_billing_entries.source_entry_id]
          action_bindings:
            plan_billing_entries.source_entry_id: source_entry_id
    measures: [plan_msr_late_fee_waivers_12m]
    params:
      per_tier:
        Comfort Club Basic: {grace_days: "=monthly_payment_grace_days", late_fee: "=late_fee_usd", waivers_per_12_months: "=late_fee_waivers_per_12_months", termination_days: "=nonpayment_termination_days"}
        Comfort Club Silver: {grace_days: "=monthly_payment_grace_days", late_fee: "=late_fee_usd", waivers_per_12_months: "=late_fee_waivers_per_12_months", termination_days: "=nonpayment_termination_days"}
        Comfort Club Gold: {grace_days: "=monthly_payment_grace_days", late_fee: "=late_fee_usd", waivers_per_12_months: "=late_fee_waivers_per_12_months", termination_days: "=nonpayment_termination_days"}
        Comfort Club Platinum: {grace_days: "=monthly_payment_grace_days", late_fee: "=late_fee_usd", waivers_per_12_months: "=late_fee_waivers_per_12_months", termination_days: "=nonpayment_termination_days"}
        Comfort Club Platinum Plus: {grace_days: "=monthly_payment_grace_days", late_fee: "=late_fee_usd", waivers_per_12_months: "=late_fee_waivers_per_12_months", termination_days: "=nonpayment_termination_days"}
        Comfort Club Total Home: {grace_days: "=monthly_payment_grace_days", late_fee: "=late_fee_usd", waivers_per_12_months: "=late_fee_waivers_per_12_months", termination_days: "=nonpayment_termination_days"}

  - id: plan_evt_tuneup_allowance
    subject: [plan_visit_grant, plan_tuneup_visit, plan_visit_expiry]
    rule: >-
      Each term grants tuneup_visits_per_system_per_term visits for every enrolled system, posted as one grant per system, plus
      whole_home_visits_per_term visits posted as one whole-home grant with no equipment; grants are posted with reason new_term
      at enrollment and renewal_term at renewal. Visits are granted only to an agreement in pending or active status. A system
      added mid-term receives that system's full per-term visits with reason additional_system, and a mid-term upgrade grants,
      with reason tier_upgrade, the difference between the new and old tier's per-system visits for each enrolled system and
      the difference in whole-home visits, never a negative grant. A maintenance visit is booked and recorded only while the
      agreement status is active. Where a tier grants two visits per system, one is a cooling tune-up performed within
      cooling_season_window and the other a heating tune-up performed within heating_season_window; where it grants one, the
      member chooses either season. A system receives at most one tune-up per season per term, and two tune-ups on the same
      system are at least min_days_between_tuneups_same_system calendar days apart. Whole-home visits may be taken on any date in
      the term and cover the water heater flush, the attic and duct inspection and, where iaq_inspection_included is true, the
      indoor air quality check. Every tune-up includes, at no charge, filters_included_per_visit standard 1-inch filters, the
      condensate drain treatment where condensate_treatment_included is true, and the indoor air quality inspection where
      iaq_inspection_included is true. A visit is recorded only when visits_remaining is above zero. Unused visits never roll
      over: at term end, at lapse and at closure any nonzero visits_remaining is removed by a plan_visit_expiry entry with
      reason term_expiry or agreement_closed, and no expiry entry is posted when nothing remains.
    eligibility:
      - id: grant_to_open_agreement
        applies_to: [plan_visit_grant]
        kind: state
        condition: Visits are granted only to an agreement in pending or active status.
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
        state_contract:
          field: plan_agreements.status
          allowed: [pending, active]
      - id: visit_on_active_agreement
        applies_to: [plan_tuneup_visit]
        kind: state
        condition: A maintenance visit is booked and recorded only while the agreement status is active.
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
        state_contract:
          field: plan_agreements.status
          allowed: [active]
    formula:
      term_visits: tuneup_visits_per_system_per_term * systems_covered + whole_home_visits_per_term
    params:
      per_tier:
        Comfort Club Basic: {per_system: "=tuneup_visits_per_system_per_term", whole_home: "=whole_home_visits_per_term", filters: "=filters_included_per_visit", iaq: "=iaq_inspection_included"}
        Comfort Club Silver: {per_system: "=tuneup_visits_per_system_per_term", whole_home: "=whole_home_visits_per_term", filters: "=filters_included_per_visit", iaq: "=iaq_inspection_included"}
        Comfort Club Gold: {per_system: "=tuneup_visits_per_system_per_term", whole_home: "=whole_home_visits_per_term", filters: "=filters_included_per_visit", iaq: "=iaq_inspection_included"}
        Comfort Club Platinum: {per_system: "=tuneup_visits_per_system_per_term", whole_home: "=whole_home_visits_per_term", filters: "=filters_included_per_visit", iaq: "=iaq_inspection_included"}
        Comfort Club Platinum Plus: {per_system: "=tuneup_visits_per_system_per_term", whole_home: "=whole_home_visits_per_term", filters: "=filters_included_per_visit", iaq: "=iaq_inspection_included"}
        Comfort Club Total Home: {per_system: "=tuneup_visits_per_system_per_term", whole_home: "=whole_home_visits_per_term", filters: "=filters_included_per_visit", iaq: "=iaq_inspection_included"}

  - id: plan_evt_missed_appointment
    subject: [plan_tuneup_visit, plan_dues_charge]
    rule: >-
      A member may reschedule or cancel a booked tune-up without consequence when the request is received at least
      tuneup_reschedule_notice_hours elapsed hours before the start of the booked arrival window. A tune-up cancelled with less
      notice than that, or one where the technician finds no one home during the arrival window, is a missed appointment. A
      visit is forfeited only on a tier whose no_show_forfeits_visit is true; on such a tier the missed appointment is recorded
      as a plan_tuneup_visit with reason no_show_forfeit or late_cancel_forfeit, which uses up the visit, and a
      missed_appointment_fee of missed_appointment_fee_usd is charged. On tiers whose no_show_forfeits_visit is false the visit
      stays available, nothing is recorded and no fee is charged. A visit the technician cancels, or one missed because the
      member's home lost power or road travel was closed by a declared weather emergency, is never forfeited.
    eligibility:
      - id: forfeiting_tier
        applies_to: [plan_tuneup_visit, plan_dues_charge]
        kind: authorization
        condition: A visit is forfeited only on a tier whose no_show_forfeits_visit is true
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
    params:
      per_tier:
        Comfort Club Basic: {forfeits: "=no_show_forfeits_visit", fee: "=missed_appointment_fee_usd", notice_hours: "=tuneup_reschedule_notice_hours"}
        Comfort Club Silver: {forfeits: "=no_show_forfeits_visit", fee: "=missed_appointment_fee_usd", notice_hours: "=tuneup_reschedule_notice_hours"}
        Comfort Club Gold: {forfeits: "=no_show_forfeits_visit", fee: "=missed_appointment_fee_usd", notice_hours: "=tuneup_reschedule_notice_hours"}
        Comfort Club Platinum: {forfeits: "=no_show_forfeits_visit", fee: "=missed_appointment_fee_usd", notice_hours: "=tuneup_reschedule_notice_hours"}
        Comfort Club Platinum Plus: {forfeits: "=no_show_forfeits_visit", fee: "=missed_appointment_fee_usd", notice_hours: "=tuneup_reschedule_notice_hours"}
        Comfort Club Total Home: {forfeits: "=no_show_forfeits_visit", fee: "=missed_appointment_fee_usd", notice_hours: "=tuneup_reschedule_notice_hours"}

  - id: plan_renewal
    subject: [plan_renew, plan_lapse, plan_preferences_update, plan_visit_expiry, plan_coverage_expiry]
    rule: >-
      The renewal notice is sent renewal_notice_days before term_end. On the day after term_end, an agreement in active status
      whose auto_renew is true renews: the new term_start is the day after the old term_end, the new term_end is one day before
      the same calendar date term_months later, consecutive_terms increases by one, renewal dues are billed under
      plan_dues_pricing, and the new term's visits and covered-repair benefit are granted while the old term's unused visits and
      benefit expire. Only an agreement in active status on its term_end is renewed. An active agreement whose auto_renew is
      false lapses on the day after term_end, and its unused visits and benefit expire. An agreement that is past_due at term_end
      is neither renewed nor lapsed on that day; if it is cured before it is terminated it renews on the day it returns to
      active, with the new term still starting the day after the old term_end, and if it is not cured it is terminated under
      plan_billing_collections. The member may turn automatic renewal off or on at any time while the agreement is active or
      past_due, up to and including term_end; a change made after term_end has no effect on the term already renewed or lapsed.
      A confirmed downgrade_at_renewal request is applied at the next renewal by writing the requested tier for the new term,
      and a member's request to switch billing frequency is applied at the next renewal in the same way.
    eligibility:
      - id: preference_change_window
        applies_to: [plan_preferences_update]
        kind: state
        condition: The member may turn automatic renewal off or on at any time while the agreement is active or past_due, up to and including term_end
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
        state_contract:
          field: plan_agreements.status
          allowed: [active, past_due]
    params:
      per_tier:
        Comfort Club Basic: {notice_days: "=renewal_notice_days", term_months: "=term_months", price_lock: "=price_lock_on_renewal"}
        Comfort Club Silver: {notice_days: "=renewal_notice_days", term_months: "=term_months", price_lock: "=price_lock_on_renewal"}
        Comfort Club Gold: {notice_days: "=renewal_notice_days", term_months: "=term_months", price_lock: "=price_lock_on_renewal"}
        Comfort Club Platinum: {notice_days: "=renewal_notice_days", term_months: "=term_months", price_lock: "=price_lock_on_renewal"}
        Comfort Club Platinum Plus: {notice_days: "=renewal_notice_days", term_months: "=term_months", price_lock: "=price_lock_on_renewal"}
        Comfort Club Total Home: {notice_days: "=renewal_notice_days", term_months: "=term_months", price_lock: "=price_lock_on_renewal"}

  - id: plan_reinstatement
    subject: [plan_reinstate, plan_terminate, plan_dues_charge, plan_renew]
    rule: >-
      A lapsed agreement may be reinstated only when the date of handling is no later than renewal_grace_days calendar days after
      the agreement's term_end passed. Grace days are counted as calendar days starting the day after term_end, so the last day
      of grace is term_end plus renewal_grace_days. Reinstatement returns the agreement to active and renews it exactly as an
      automatic renewal would, with the new term starting the day after the old term_end so no gap is left, and consecutive_terms
      continues. A reinstated agreement loses its price lock: its renewal dues use the current annual_dues_first_system_usd, and
      its locked_annual_rate is reset to that rate where the tier carries a price lock; the loyalty discount still applies when
      the count is reached. A reinstatement_fee of reinstatement_fee_usd is charged, and a fee of 0.00 means no fee entry is
      posted. A lapsed agreement not reinstated by the last day of grace is closed from lapsed to cancelled on the following
      day, and the customer must enroll a new agreement.
    eligibility:
      - id: within_renewal_grace
        applies_to: [plan_reinstate]
        kind: time
        condition: A lapsed agreement may be reinstated only when the date of handling is no later than renewal_grace_days calendar days after the agreement's term_end passed.
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.term_end, plan_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the agreement's term_end passed
          anchor_source: plan_agreements.term_end
          relation: not_after
          duration_source: variants.renewal_grace_days
          unit: calendar_days
          counting_rule: Grace days are counted as calendar days starting the day after term_end, so the last day of grace is term_end plus renewal_grace_days.
          boundary: inclusive
    params:
      per_tier:
        Comfort Club Basic: {grace_days: "=renewal_grace_days", fee: "=reinstatement_fee_usd"}
        Comfort Club Silver: {grace_days: "=renewal_grace_days", fee: "=reinstatement_fee_usd"}
        Comfort Club Gold: {grace_days: "=renewal_grace_days", fee: "=reinstatement_fee_usd"}
        Comfort Club Platinum: {grace_days: "=renewal_grace_days", fee: "=reinstatement_fee_usd"}
        Comfort Club Platinum Plus: {grace_days: "=renewal_grace_days", fee: "=reinstatement_fee_usd"}
        Comfort Club Total Home: {grace_days: "=renewal_grace_days", fee: "=reinstatement_fee_usd"}

  - id: plan_cancellation_refund
    subject: [plan_customer_cancel, plan_dues_credit, plan_refund_issued, plan_dues_charge, plan_visit_expiry, plan_coverage_expiry]
    rule: >-
      Cancelling an agreement is the member's own decision: the agent records a cancellation request that the member confirms
      themselves. The cancellation takes effect only once the member has confirmed a cancellation request on the agreement, and
      it takes effect on the date of confirmation, which becomes cancelled_date. For an annually billed agreement a
      cancellation_proration_credit is computed for the current term. The full-refund treatment applies only when the member
      gives notice of this cancellation no later than cancellation_full_refund_days calendar days after the current term began.
      Refund-window days are counted as calendar days with term_start as day 0, and notice received on the last day of the
      window qualifies. Under the full-refund treatment the credit is the dues billed for the current term less the retail value
      of the visits completed in the term (tuneup_retail_value_usd per completed tune-up and whole_home_visit_retail_value_usd
      per completed whole-home visit) less the covered-repair benefit drawn in the term, and no cancellation fee is charged.
      Outside the window the credit is the dues billed for the term multiplied by the unused full months divided by twelve,
      rounded to the cent half up, less the same retail value of completed visits and covered-repair benefit drawn, and a
      cancellation_fee of cancellation_fee_usd is charged where it is above 0.00. A credit is never negative; when the
      deduction exceeds the dues, the credit is zero and the member owes nothing further for the visits. A cancellation proration
      credit is posted only to an agreement whose status is cancelled. A monthly agreement earns no proration credit: dues
      already billed are not refunded, the cancellation fee rule above still applies outside the window, and any unpaid dues
      remain owed. At cancellation the remaining visits and covered-repair benefit expire with reason agreement_closed. When the
      agreement's dues_balance is negative after the credit and any fee, that credit balance is paid out as a refund_payout to
      the original payment method, naming the credit as its source.
    eligibility:
      - id: member_confirmed_cancellation
        applies_to: [plan_customer_cancel]
        kind: authorization
        condition: The cancellation takes effect only once the member has confirmed a cancellation request on the agreement
        evidence_fields: [plan_change_requests.agreement_id, plan_change_requests.request_type, plan_change_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_change_requests.agreement_id]
          action_bindings:
            plan_change_requests.agreement_id: agreement_id
      - id: full_refund_window
        applies_to: [plan_dues_credit]
        kind: time
        condition: The full-refund treatment applies only when the member gives notice of this cancellation no later than cancellation_full_refund_days calendar days after the current term began.
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.term_start, plan_change_requests.created_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the current term began
          anchor_source: plan_agreements.term_start
          relation: not_after
          duration_source: variants.cancellation_full_refund_days
          unit: calendar_days
          counting_rule: Refund-window days are counted as calendar days with term_start as day 0, and notice received on the last day of the window qualifies.
          boundary: inclusive
      - id: credit_on_cancelled_agreement
        applies_to: [plan_dues_credit]
        kind: state
        condition: A cancellation proration credit is posted only to an agreement whose status is cancelled.
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
        state_contract:
          field: plan_agreements.status
          allowed: [cancelled]
    formula:
      when: billing_frequency == "annual"
      visits_value: tuneup_retail_value_usd * plan_msr_term_tuneups_completed + whole_home_visit_retail_value_usd * plan_msr_term_whole_home_completed
      credit_within_window: max(0, plan_msr_term_dues_billed - visits_value - plan_msr_term_coverage_drawn)
      credit_after_window: max(0, round(plan_msr_term_dues_billed * plan_msr_unused_full_months / 12, 2) - visits_value - plan_msr_term_coverage_drawn)
    measures: [plan_msr_term_dues_billed, plan_msr_term_tuneups_completed, plan_msr_term_whole_home_completed, plan_msr_term_coverage_drawn, plan_msr_unused_full_months]
    params:
      per_tier:
        Comfort Club Basic: {refund_window_days: "=cancellation_full_refund_days", fee: "=cancellation_fee_usd", tuneup_value: "=tuneup_retail_value_usd", whole_home_value: "=whole_home_visit_retail_value_usd"}
        Comfort Club Silver: {refund_window_days: "=cancellation_full_refund_days", fee: "=cancellation_fee_usd", tuneup_value: "=tuneup_retail_value_usd", whole_home_value: "=whole_home_visit_retail_value_usd"}
        Comfort Club Gold: {refund_window_days: "=cancellation_full_refund_days", fee: "=cancellation_fee_usd", tuneup_value: "=tuneup_retail_value_usd", whole_home_value: "=whole_home_visit_retail_value_usd"}
        Comfort Club Platinum: {refund_window_days: "=cancellation_full_refund_days", fee: "=cancellation_fee_usd", tuneup_value: "=tuneup_retail_value_usd", whole_home_value: "=whole_home_visit_retail_value_usd"}
        Comfort Club Platinum Plus: {refund_window_days: "=cancellation_full_refund_days", fee: "=cancellation_fee_usd", tuneup_value: "=tuneup_retail_value_usd", whole_home_value: "=whole_home_visit_retail_value_usd"}
        Comfort Club Total Home: {refund_window_days: "=cancellation_full_refund_days", fee: "=cancellation_fee_usd", tuneup_value: "=tuneup_retail_value_usd", whole_home_value: "=whole_home_visit_retail_value_usd"}

  - id: plan_tier_changes
    subject: [plan_tier_change, plan_dues_charge, plan_visit_grant, plan_renew]
    rule: >-
      A mid-term upgrade is processed only while the agreement status is active. A mid-term upgrade is accepted only into a tier
      whose midterm_upgrade_into_allowed is true and that ranks above the current tier; every enrolled system must meet the new
      tier's max_equipment_age_years on the upgrade date and the systems enrolled may not exceed its max_systems_covered. For an
      annually billed agreement the upgrade_proration charge is the new tier's annual dues for the enrolled systems minus the
      current tier's annual dues for the same systems, multiplied by the unused full months from the upgrade date to term_end
      divided by twelve and rounded to the cent half up; an upgrade with no unused full month posts no proration charge. For a
      monthly agreement no proration is charged and the new tier's monthly dues start with the next billing month. Visit grants
      for the upgrade follow plan_evt_tuneup_allowance. A move into a tier whose midterm_upgrade_into_allowed is false takes
      effect only at renewal, as the tier written for the new term, and its covered-repair benefit and waiting period then start
      with that term's first coverage grant. Downgrades never take effect mid-term: the member requests a downgrade_at_renewal,
      which the member confirms, and the lower tier applies from the next renewal provided systems_covered does not exceed that
      tier's max_systems_covered; when it would, the downgrade cannot be accepted until systems are removed at renewal.
    eligibility:
      - id: upgrade_on_active_agreement
        applies_to: [plan_tier_change]
        kind: state
        condition: A mid-term upgrade is processed only while the agreement status is active.
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
        state_contract:
          field: plan_agreements.status
          allowed: [active]
      - id: midterm_target_allowed
        applies_to: [plan_tier_change]
        kind: authorization
        condition: A mid-term upgrade is accepted only into a tier whose midterm_upgrade_into_allowed is true and that ranks above the current tier
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
    measures: [plan_msr_unused_full_months]
    params:
      per_tier:
        Comfort Club Basic: {midterm_into_allowed: "=midterm_upgrade_into_allowed", annual_first: "=annual_dues_first_system_usd", annual_additional: "=annual_dues_additional_system_usd"}
        Comfort Club Silver: {midterm_into_allowed: "=midterm_upgrade_into_allowed", annual_first: "=annual_dues_first_system_usd", annual_additional: "=annual_dues_additional_system_usd"}
        Comfort Club Gold: {midterm_into_allowed: "=midterm_upgrade_into_allowed", annual_first: "=annual_dues_first_system_usd", annual_additional: "=annual_dues_additional_system_usd"}
        Comfort Club Platinum: {midterm_into_allowed: "=midterm_upgrade_into_allowed", annual_first: "=annual_dues_first_system_usd", annual_additional: "=annual_dues_additional_system_usd"}
        Comfort Club Platinum Plus: {midterm_into_allowed: "=midterm_upgrade_into_allowed", annual_first: "=annual_dues_first_system_usd", annual_additional: "=annual_dues_additional_system_usd"}
        Comfort Club Total Home: {midterm_into_allowed: "=midterm_upgrade_into_allowed", annual_first: "=annual_dues_first_system_usd", annual_additional: "=annual_dues_additional_system_usd"}

  - id: plan_evt_repair_coverage
    subject: [plan_coverage_grant, plan_coverage_draw, plan_coverage_expiry]
    rule: >-
      A tier whose covered_repair_annual_cap_usd is above 0.00 receives, at each new or renewal term, a coverage grant equal to
      that cap. Covered-repair benefit is granted only to an agreement in pending or active status. Covered-repair benefit is
      drawn only while the agreement status is active. A repair is covered only when its service call was booked no earlier than
      covered_repair_waiting_period_days calendar days after the agreement's first covered-repair grant; a call booked earlier
      is billed normally. Covered lines are the repair_parts and repair_labor lines of a service call on an enrolled system;
      diagnostic fees, after-hours premiums, refrigerant, maintenance tune-ups, duct cleaning, thermostat replacement and
      condensate pump replacement are never covered. The member repair discount is applied to the line first; when a protection
      contract claim pays part of the same line, that warranty coverage is applied next, and the plan covers what remains. The
      draw for one service call is the lowest of the remaining covered amount of its covered lines, covered_repair_per_incident_cap_usd
      and repair_coverage_remaining, allocated to the covered lines in invoice order and posted as one draw per line it pays.
      Failures that the enrollment inspection recorded as existing, damage from flooding, fire, lightning or freezing of an
      unheated space, and repairs on equipment that is not enrolled are not covered. Benefit not drawn by term end expires with
      reason term_expiry, and at closure with reason agreement_closed; an expiry entry is posted only for a nonzero remainder.
    eligibility:
      - id: coverage_grant_open_agreement
        applies_to: [plan_coverage_grant]
        kind: state
        condition: Covered-repair benefit is granted only to an agreement in pending or active status.
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
        state_contract:
          field: plan_agreements.status
          allowed: [pending, active]
      - id: draw_on_active_agreement
        applies_to: [plan_coverage_draw]
        kind: state
        condition: Covered-repair benefit is drawn only while the agreement status is active.
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
        state_contract:
          field: plan_agreements.status
          allowed: [active]
      - id: waiting_period_elapsed
        applies_to: [plan_coverage_draw]
        kind: authorization
        condition: A repair is covered only when its service call was booked no earlier than covered_repair_waiting_period_days calendar days after the agreement's first covered-repair grant
        evidence_fields: [service_tickets.ticket_id, service_tickets.booked_at, plan_service_entries.agreement_id, plan_service_entries.entry_date, plan_service_entries.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
    formula:
      when: covered_repair_annual_cap_usd > 0
      draw: min(plan_msr_ticket_covered_repair_net, covered_repair_per_incident_cap_usd, repair_coverage)
    measures: [plan_msr_ticket_covered_repair_net]
    params:
      per_tier:
        Comfort Club Basic: {annual_cap: "=covered_repair_annual_cap_usd", per_incident_cap: "=covered_repair_per_incident_cap_usd", waiting_days: "=covered_repair_waiting_period_days"}
        Comfort Club Silver: {annual_cap: "=covered_repair_annual_cap_usd", per_incident_cap: "=covered_repair_per_incident_cap_usd", waiting_days: "=covered_repair_waiting_period_days"}
        Comfort Club Gold: {annual_cap: "=covered_repair_annual_cap_usd", per_incident_cap: "=covered_repair_per_incident_cap_usd", waiting_days: "=covered_repair_waiting_period_days"}
        Comfort Club Platinum: {annual_cap: "=covered_repair_annual_cap_usd", per_incident_cap: "=covered_repair_per_incident_cap_usd", waiting_days: "=covered_repair_waiting_period_days"}
        Comfort Club Platinum Plus: {annual_cap: "=covered_repair_annual_cap_usd", per_incident_cap: "=covered_repair_per_incident_cap_usd", waiting_days: "=covered_repair_waiting_period_days"}
        Comfort Club Total Home: {annual_cap: "=covered_repair_annual_cap_usd", per_incident_cap: "=covered_repair_per_incident_cap_usd", waiting_days: "=covered_repair_waiting_period_days"}

  - id: plan_evt_response_guarantee
    subject: [plan_dues_credit]
    rule: >-
      A tier whose no_heat_no_cool_response_hours is above 0 guarantees technician arrival on a no-heat or no-cool service call
      for an enrolled system within that many elapsed hours of booking. The credit is earned only when the technician arrived
      more than no_heat_no_cool_response_hours elapsed hours after the call was booked. The call must have symptom no_heat or
      no_cool, must have been booked while the agreement was active, and must not have been booked by the member for a later
      scheduled_date than the earliest arrival window offered; elapsed hours are measured from booked_at to arrived_at on the
      service call. A missed guarantee earns a response_guarantee_credit of response_guarantee_credit_usd posted to the dues
      balance and naming the service call; it offsets future dues and is paid out only if the agreement later closes with a
      credit balance. Only one response-guarantee credit is posted per service call. Calls cancelled before arrival earn no
      credit, and tiers whose hours are 0 carry no guarantee.
    eligibility:
      - id: guarantee_missed
        applies_to: [plan_dues_credit]
        kind: authorization
        condition: The credit is earned only when the technician arrived more than no_heat_no_cool_response_hours elapsed hours after the call was booked.
        evidence_fields: [service_tickets.ticket_id, service_tickets.booked_at, service_tickets.arrived_at, service_tickets.symptom]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
      - id: one_credit_per_call
        applies_to: [plan_dues_credit]
        kind: dedup
        condition: Only one response-guarantee credit is posted per service call.
        evidence_fields: [plan_billing_entries.ticket_id, plan_billing_entries.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_billing_entries.ticket_id]
          action_bindings:
            plan_billing_entries.ticket_id: ticket_id
        dedup_contract:
          table: plan_billing_entries
          mode: separate_record
          object_bindings: {ticket_id: ticket_id}
          duplicate_filters: {line_type: [response_guarantee_credit]}
          distinct_fields: []
    params:
      per_tier:
        Comfort Club Basic: {response_hours: "=no_heat_no_cool_response_hours", credit: "=response_guarantee_credit_usd"}
        Comfort Club Silver: {response_hours: "=no_heat_no_cool_response_hours", credit: "=response_guarantee_credit_usd"}
        Comfort Club Gold: {response_hours: "=no_heat_no_cool_response_hours", credit: "=response_guarantee_credit_usd"}
        Comfort Club Platinum: {response_hours: "=no_heat_no_cool_response_hours", credit: "=response_guarantee_credit_usd"}
        Comfort Club Platinum Plus: {response_hours: "=no_heat_no_cool_response_hours", credit: "=response_guarantee_credit_usd"}
        Comfort Club Total Home: {response_hours: "=no_heat_no_cool_response_hours", credit: "=response_guarantee_credit_usd"}

  - id: plan_evt_add_system
    subject: [plan_add_system, plan_dues_charge, plan_visit_grant]
    rule: >-
      A system is added only while the agreement status is active. The added system must meet plan_enrollment_eligibility on the
      date it is added, and the new systems_covered may not exceed the tier's max_systems_covered. On an annually billed
      agreement the additional_system_dues charge is annual_dues_additional_system_usd multiplied by the unused full months from
      the date added to term_end divided by twelve, rounded to the cent half up, and no charge is posted when no full month
      remains; on a monthly agreement monthly_dues_additional_system_usd is added to the dues from the next billing month and
      nothing is charged for the current month. The added system receives its visits under plan_evt_tuneup_allowance. Systems
      are removed only at renewal, never mid-term, and removing a system earns no credit.
    eligibility:
      - id: add_on_active_agreement
        applies_to: [plan_add_system]
        kind: state
        condition: A system is added only while the agreement status is active.
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
        state_contract:
          field: plan_agreements.status
          allowed: [active]
    formula:
      additional_system_dues: round(annual_dues_additional_system_usd * plan_msr_unused_full_months / 12, 2)
    measures: [plan_msr_unused_full_months]
    params:
      per_tier:
        Comfort Club Basic: {annual_additional: "=annual_dues_additional_system_usd", monthly_additional: "=monthly_dues_additional_system_usd", max_systems: "=max_systems_covered"}
        Comfort Club Silver: {annual_additional: "=annual_dues_additional_system_usd", monthly_additional: "=monthly_dues_additional_system_usd", max_systems: "=max_systems_covered"}
        Comfort Club Gold: {annual_additional: "=annual_dues_additional_system_usd", monthly_additional: "=monthly_dues_additional_system_usd", max_systems: "=max_systems_covered"}
        Comfort Club Platinum: {annual_additional: "=annual_dues_additional_system_usd", monthly_additional: "=monthly_dues_additional_system_usd", max_systems: "=max_systems_covered"}
        Comfort Club Platinum Plus: {annual_additional: "=annual_dues_additional_system_usd", monthly_additional: "=monthly_dues_additional_system_usd", max_systems: "=max_systems_covered"}
        Comfort Club Total Home: {annual_additional: "=annual_dues_additional_system_usd", monthly_additional: "=monthly_dues_additional_system_usd", max_systems: "=max_systems_covered"}

extended_policies:
  - id: plan_ext_covered_repair_draw
    base_policy_refs: [plan_evt_repair_coverage, plan_evt_tuneup_allowance]
    overwrite:
      - base_policy: plan_evt_repair_coverage
        superseded_clause: >-
          diagnostic fees, after-hours premiums, refrigerant, maintenance tune-ups, duct cleaning, thermostat replacement and
          condensate pump replacement are never covered.
        replaced_by: >-
          Diagnostic fees, after-hours premiums, maintenance tune-ups, duct cleaning, thermostat replacement and condensate pump
          replacement are never covered, and refrigerant is covered only at the refrigerant coverage rate.
      - base_policy: plan_evt_repair_coverage
        superseded_clause: >-
          The member repair discount is applied to the line first; when a protection contract claim pays part of the same line,
          that warranty coverage is applied next, and the plan covers what remains.
        replaced_by: >-
          The covered lines of the call are its repair parts lines and its repair labor lines, other than thermostat replacement
          and condensate pump replacement lines, and the call's covered amount is worked out from them in this order, the plan
          covering that covered amount and not simply what remains of the lines.
      - base_policy: plan_evt_repair_coverage
        superseded_clause: >-
          The draw for one service call is the lowest of the remaining covered amount of its covered lines,
          covered_repair_per_incident_cap_usd and repair_coverage_remaining, allocated to the covered lines in invoice order and
          posted as one draw per line it pays.
        replaced_by: >-
          The covered-repair draw for the call is the lowest of the call's covered amount, the per-call cap and the
          covered-repair benefit remaining on the agreement for the term, never below zero, and it is posted as one draw for the
          call naming the call and its covered repair line with the lowest invoice position.
    trigger: state_due
    subject: [plan_coverage_draw]
    computes: draw_amount
    target_tool: post_covered_repair_draw_a854dec6
    params:
      labor_divisor_daytime: 1.0
      evening_weekend_labor_multiplier: 1.25
      overnight_holiday_labor_multiplier: 1.5
      long_standing_terms: 10
      steady_terms: 5
      cap_increase_long_standing_usd: 250.0
      cap_increase_steady_usd: 125.0
      deductible_total_protection: 0.0
      deductible_other_contract: 25.0
      deductible_standard: 50.0
      refrigerant_rate_long_standing: 1.0
      refrigerant_rate_sealed: 0.5
    rule: >-
      On a tier that includes covered repairs, a covered-repair draw settles a completed service call of the member on an
      enrolled system while the agreement is active, and it settles the repair lines of that call posted within the month
      before the date of handling, meaning fewer than one whole calendar month earlier. The covered lines of the call are its
      repair parts lines and its repair labor lines, other than thermostat replacement and condensate pump replacement lines,
      and the call's covered amount is worked out from them in this order, the plan covering that covered amount and not
      simply what remains of the lines. First the repair parts lines as billed and the valued repair labor lines are added,
      and the tier's member repair discount percentage is taken off that sum once, giving the discounted repair amount. Next
      the maintained repair amount is taken from the discounted repair amount. Next the refrigerant lines of the call, less the
      member refrigerant allowance already posted on the call, are multiplied by the refrigerant coverage rate and added. Next
      any protection contract coverage already posted on the call is subtracted, and last the member deductible is
      subtracted; the covered amount is rounded to the cent half up. Diagnostic fees, after-hours premiums, maintenance
      tune-ups, duct cleaning, thermostat replacement and condensate pump replacement are never covered, and refrigerant is
      covered only at the refrigerant coverage rate. The covered-repair draw for the call is the lowest of the call's covered
      amount, the per-call cap and the covered-repair benefit remaining on the agreement for the term, never below zero, and
      it is posted as one draw for the call naming the call and its covered repair line with the lowest invoice position. The
      repair labor lines are valued as billed, the maintained repair amount is the discounted repair amount, the per-call cap
      is the tier's covered-repair per-incident cap, the refrigerant coverage rate is zero, and the member deductible is the
      standard deductible. Labor rule: the repair labor lines of a call booked as an Overnight Emergency Service Call or a
      Holiday Emergency Service Call are valued by dividing them by the overnight and holiday labor multiplier, so the plan
      pays the daytime labor price; those of a call booked as an Evening Service Call or a Weekend Service Call are valued by
      dividing them by the evening and weekend labor multiplier; those of any other call are valued as billed; each divided
      amount is rounded to the cent half up. Maintenance rule: for an agreement with no completed cooling or heating tune-up
      dated within the 12 months before the date of handling, the maintained repair amount covers the repair parts only,
      being the repair parts lines less the tier's member repair discount percentage, rounded to the cent half up, and the
      labor stays with the member; for one with exactly one such completed tune-up, the maintained repair amount is the
      discounted repair amount less the tier's tune-up retail value for the maintenance visit that was not kept, never below
      zero; for one with two or more, the maintained repair amount is the discounted repair amount. Per-call cap rule: an
      agreement in at least its tenth consecutive term with no covered-repair draw dated within the 24 months before the date
      of handling has the tier's covered-repair per-incident cap raised by the long-standing cap increase; one in at least
      its fifth but fewer than its tenth consecutive term with no such draw has that cap raised by the steady-member cap
      increase; any other agreement has the tier's covered-repair per-incident cap. Refrigerant rule: when the repair lines
      posted on the call include a sealed-system major repair task (compressor, evaporator coil, condenser coil, reversing
      valve or TXV replacement) and the agreement is in at least its tenth consecutive term, the refrigerant beyond the
      allowance is covered at the long-standing refrigerant rate; when they include such a task and the agreement is in fewer
      than its tenth consecutive term, it is covered at the sealed-system refrigerant rate; when they include no such task,
      the refrigerant coverage rate is zero. Deductible rule: a member whose active Harbison protection contract is a Harbison
      12-Year Total Protection or a Harbison 12-Year Total Protection Plus pays the Total Protection deductible; a member whose
      active protection contract is of any other tier pays the contract-holder deductible; a member with no active protection
      contract pays the standard deductible. A draw is posted only for a call booked no earlier than the tier's covered-repair
      waiting period after the agreement's first covered-repair grant; the waiting period decides whether a call is drawn on,
      not how much is drawn.
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [service_tickets.variant_name, service_tickets.status, service_lines.amount, service_lines.line_type, service_lines.task_code, service_lines.posted_date]
        note: The labor rule and the refrigerant rule read the call class of the member's completed call and the repair, refrigerant, allowance and warranty lines posted on it.
      - category: warranty
        as: branch
        reads: [warranty_contracts.variant_name, warranty_contracts.status]
        note: The deductible rule reads the tier of the member's active protection contract.
    compute:
      - draw_parts_billed: "XSUM('service', 'service_lines', 'amount', within_months=1, date_field='posted_date', event_type='service_charge', line_type='repair_parts') - XSUM('service', 'service_lines', 'amount', within_months=1, date_field='posted_date', line_type='repair_parts', task_code='thermostat_replace') - XSUM('service', 'service_lines', 'amount', within_months=1, date_field='posted_date', line_type='repair_parts', task_code='condensate_pump_replace')"
      - draw_labor_billed: "XSUM('service', 'service_lines', 'amount', within_months=1, date_field='posted_date', event_type='service_charge', line_type='repair_labor') - XSUM('service', 'service_lines', 'amount', within_months=1, date_field='posted_date', line_type='repair_labor', task_code='thermostat_replace') - XSUM('service', 'service_lines', 'amount', within_months=1, date_field='posted_date', line_type='repair_labor', task_code='condensate_pump_replace')"
      - draw_refrigerant_billed: "XSUM('service', 'service_lines', 'amount', within_months=1, date_field='posted_date', event_type='service_charge', line_type='refrigerant')"
      - draw_refrigerant_allowance: "XSUM('service', 'service_lines', 'amount', within_months=1, date_field='posted_date', line_type='member_refrigerant_allowance')"
      - draw_warranty_paid: "XSUM('service', 'service_lines', 'amount', within_months=1, date_field='posted_date', line_type='warranty_claim_coverage')"
      - draw_call_class: "CFIELD('service', 'variant_name', status='completed')"
      - draw_labor_divisor: "K('overnight_holiday_labor_multiplier') if (draw_call_class == 'Overnight Emergency Service Call' or draw_call_class == 'Holiday Emergency Service Call') else (K('evening_weekend_labor_multiplier') if (draw_call_class == 'Evening Service Call' or draw_call_class == 'Weekend Service Call') else K('labor_divisor_daytime'))"
      - draw_labor_valued: "int(draw_labor_billed / draw_labor_divisor * 100 + 0.5 + 1e-9) / 100"
      - draw_discounted: "int((draw_parts_billed + draw_labor_valued) * (1 - P('repair_discount_pct') / 100) * 100 + 0.5 + 1e-9) / 100"
      - draw_tuneups_12m: "COUNT('plan_service_entries', within_months=12, date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit', season='cooling') + COUNT('plan_service_entries', within_months=12, date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit', season='heating')"
      - draw_maintained: "int(draw_parts_billed * (1 - P('repair_discount_pct') / 100) * 100 + 0.5 + 1e-9) / 100 if draw_tuneups_12m == 0 else (MX(0, draw_discounted - P('tuneup_retail_value_usd')) if draw_tuneups_12m == 1 else draw_discounted)"
      - draw_prior_draws_24m: "COUNT('plan_service_entries', within_months=24, date_field='entry_date', event_type='plan_coverage_draw')"
      - draw_incident_cap: "P('covered_repair_per_incident_cap_usd') + K('cap_increase_long_standing_usd') if (F('consecutive_terms') >= K('long_standing_terms') and draw_prior_draws_24m == 0) else (P('covered_repair_per_incident_cap_usd') + K('cap_increase_steady_usd') if (F('consecutive_terms') >= K('steady_terms') and draw_prior_draws_24m == 0) else P('covered_repair_per_incident_cap_usd'))"
      - draw_major_tasks: "XCOUNT('service', 'service_lines', within_months=1, date_field='posted_date', task_code='compressor_replace') + XCOUNT('service', 'service_lines', within_months=1, date_field='posted_date', task_code='evaporator_coil_replace') + XCOUNT('service', 'service_lines', within_months=1, date_field='posted_date', task_code='condenser_coil_replace') + XCOUNT('service', 'service_lines', within_months=1, date_field='posted_date', task_code='reversing_valve_replace') + XCOUNT('service', 'service_lines', within_months=1, date_field='posted_date', task_code='txv_replace')"
      - draw_refrigerant_rate: "K('refrigerant_rate_long_standing') if (draw_major_tasks > 0 and F('consecutive_terms') >= K('long_standing_terms')) else (K('refrigerant_rate_sealed') if draw_major_tasks > 0 else 0)"
      - draw_contract_tier: "CFIELD('warranty', 'variant_name', status='active')"
      - draw_deductible: "K('deductible_total_protection') if (draw_contract_tier == 'Harbison 12-Year Total Protection' or draw_contract_tier == 'Harbison 12-Year Total Protection Plus') else (K('deductible_other_contract') if draw_contract_tier != None else K('deductible_standard'))"
      - draw_covered_amount: "int((draw_maintained + (draw_refrigerant_billed - draw_refrigerant_allowance) * draw_refrigerant_rate - draw_warranty_paid - draw_deductible) * 100 + 0.5 + 1e-9) / 100"
      - result: "MX(0, MN(draw_covered_amount, draw_incident_cap, F('repair_coverage_remaining')))"
    compute_basis:
      draw_parts_billed: "it settles the repair lines of that call posted within the month before the date of handling, meaning fewer than one whole calendar month earlier. The covered lines of the call are its repair parts lines and its repair labor lines, other than thermostat replacement and condensate pump replacement lines"
      draw_labor_billed: "The covered lines of the call are its repair parts lines and its repair labor lines, other than thermostat replacement and condensate pump replacement lines"
      draw_refrigerant_billed: "Next the refrigerant lines of the call, less the member refrigerant allowance already posted on the call, are multiplied by the refrigerant coverage rate and added."
      draw_refrigerant_allowance: "less the member refrigerant allowance already posted on the call"
      draw_warranty_paid: "Next any protection contract coverage already posted on the call is subtracted"
      draw_call_class: "the repair labor lines of a call booked as an Overnight Emergency Service Call or a Holiday Emergency Service Call"
      draw_labor_divisor: "Labor rule: the repair labor lines of a call booked as an Overnight Emergency Service Call or a Holiday Emergency Service Call are valued by dividing them by the overnight and holiday labor multiplier, so the plan pays the daytime labor price; those of a call booked as an Evening Service Call or a Weekend Service Call are valued by dividing them by the evening and weekend labor multiplier; those of any other call are valued as billed"
      draw_labor_valued: "each divided amount is rounded to the cent half up"
      draw_discounted: "First the repair parts lines as billed and the valued repair labor lines are added, and the tier's member repair discount percentage is taken off that sum once, giving the discounted repair amount."
      draw_tuneups_12m: "for an agreement with no completed cooling or heating tune-up dated within the 12 months before the date of handling"
      draw_maintained: "Maintenance rule: for an agreement with no completed cooling or heating tune-up dated within the 12 months before the date of handling, the maintained repair amount covers the repair parts only, being the repair parts lines less the tier's member repair discount percentage, rounded to the cent half up, and the labor stays with the member; for one with exactly one such completed tune-up, the maintained repair amount is the discounted repair amount less the tier's tune-up retail value for the maintenance visit that was not kept, never below zero; for one with two or more, the maintained repair amount is the discounted repair amount."
      draw_prior_draws_24m: "with no covered-repair draw dated within the 24 months before the date of handling"
      draw_incident_cap: "Per-call cap rule: an agreement in at least its tenth consecutive term with no covered-repair draw dated within the 24 months before the date of handling has the tier's covered-repair per-incident cap raised by the long-standing cap increase; one in at least its fifth but fewer than its tenth consecutive term with no such draw has that cap raised by the steady-member cap increase; any other agreement has the tier's covered-repair per-incident cap."
      draw_major_tasks: "when the repair lines posted on the call include a sealed-system major repair task (compressor, evaporator coil, condenser coil, reversing valve or TXV replacement)"
      draw_refrigerant_rate: "Refrigerant rule: when the repair lines posted on the call include a sealed-system major repair task (compressor, evaporator coil, condenser coil, reversing valve or TXV replacement) and the agreement is in at least its tenth consecutive term, the refrigerant beyond the allowance is covered at the long-standing refrigerant rate; when they include such a task and the agreement is in fewer than its tenth consecutive term, it is covered at the sealed-system refrigerant rate; when they include no such task, the refrigerant coverage rate is zero."
      draw_contract_tier: "a member whose active Harbison protection contract is a Harbison 12-Year Total Protection or a Harbison 12-Year Total Protection Plus"
      draw_deductible: "Deductible rule: a member whose active Harbison protection contract is a Harbison 12-Year Total Protection or a Harbison 12-Year Total Protection Plus pays the Total Protection deductible; a member whose active protection contract is of any other tier pays the contract-holder deductible; a member with no active protection contract pays the standard deductible."
      draw_covered_amount: "Next any protection contract coverage already posted on the call is subtracted, and last the member deductible is subtracted; the covered amount is rounded to the cent half up."
      result: "The covered-repair draw for the call is the lowest of the call's covered amount, the per-call cap and the covered-repair benefit remaining on the agreement for the term, never below zero"
    factors:
      - id: after_hours_labor_divisor
        effect: parameter
        decides: draw_labor_divisor
        bindings: [draw_call_class, draw_labor_divisor]
        ladder:
          - when: "the call was booked as an Overnight Emergency Service Call or a Holiday Emergency Service Call"
            value: "K('overnight_holiday_labor_multiplier')"
          - when: "the call was booked as an Evening Service Call or a Weekend Service Call"
            value: "K('evening_weekend_labor_multiplier')"
          - when: "otherwise"
            value: "K('labor_divisor_daytime') (labor valued as billed)"
        baseline:
          draw_labor_divisor: "K('labor_divisor_daytime')"
        evidence: [cross_category]
        cross_difficulty: service
      - id: maintenance_coverage_basis
        effect: method
        decides: draw_maintained
        bindings: [draw_tuneups_12m, draw_maintained]
        ladder:
          - when: "no completed cooling or heating tune-up dated within the 12 months before the date of handling"
            method: "the plan covers the repair parts only: the repair parts lines less the member repair discount, rounded half up; the labor stays with the member"
          - when: "exactly one such completed tune-up"
            method: "the discounted repair amount less the tier's tune-up retail value for the maintenance visit not kept, never below zero"
          - when: "otherwise (two or more such completed tune-ups)"
            method: "the discounted repair amount as it stands"
        baseline:
          draw_maintained: "draw_discounted"
        evidence: [history, date]
        cross_difficulty: null
      - id: loyal_member_call_cap
        effect: parameter
        decides: draw_incident_cap
        bindings: [draw_prior_draws_24m, draw_incident_cap]
        ladder:
          - when: "the agreement is in at least its tenth consecutive term and no covered-repair draw is dated within the 24 months before the date of handling"
            value: "P('covered_repair_per_incident_cap_usd') + K('cap_increase_long_standing_usd')"
          - when: "the agreement is in at least its fifth but fewer than its tenth consecutive term and no covered-repair draw is dated within those 24 months"
            value: "P('covered_repair_per_incident_cap_usd') + K('cap_increase_steady_usd')"
          - when: "otherwise"
            value: "P('covered_repair_per_incident_cap_usd')"
        baseline:
          draw_incident_cap: "P('covered_repair_per_incident_cap_usd')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: sealed_system_refrigerant_rate
        effect: parameter
        decides: draw_refrigerant_rate
        bindings: [draw_major_tasks, draw_refrigerant_rate]
        ladder:
          - when: "the call's repair lines include a sealed-system major repair task and the agreement is in at least its tenth consecutive term"
            value: "K('refrigerant_rate_long_standing')"
          - when: "the call's repair lines include a sealed-system major repair task and the agreement is in fewer than its tenth consecutive term"
            value: "K('refrigerant_rate_sealed')"
          - when: "otherwise (no sealed-system major repair task on the call)"
            value: "0"
        baseline:
          draw_refrigerant_rate: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: protection_holder_deductible
        effect: parameter
        decides: draw_deductible
        bindings: [draw_contract_tier, draw_deductible]
        ladder:
          - when: "the member's active protection contract is a Harbison 12-Year Total Protection or a Harbison 12-Year Total Protection Plus"
            value: "K('deductible_total_protection')"
          - when: "the member's active protection contract is of any other tier"
            value: "K('deductible_other_contract')"
          - when: "otherwise (no active protection contract)"
            value: "K('deductible_standard')"
        baseline:
          draw_deductible: "K('deductible_standard')"
        evidence: [cross_category]
        cross_difficulty: warranty
    baseline:
      rule: >-
        The covered lines of the call are its repair parts lines and its repair labor lines, other than thermostat replacement
        and condensate pump replacement lines, and the call's covered amount is worked out from them in this order, the plan
        covering that covered amount and not simply what remains of the lines. First the repair parts lines as billed and the
        valued repair labor lines are added, and the tier's member repair discount percentage is taken off that sum once,
        giving the discounted repair amount. Next the maintained repair amount is taken from the discounted repair amount. Next
        the refrigerant lines of the call, less the member refrigerant allowance already posted on the call, are multiplied by
        the refrigerant coverage rate and added. Next any protection contract coverage already posted on the call is
        subtracted, and last the member deductible is subtracted; the covered amount is rounded to the cent half up. The
        covered-repair draw for the call is the lowest of the call's covered amount, the per-call cap and the covered-repair
        benefit remaining on the agreement for the term, never below zero, and it is posted as one draw for the call naming the
        call and its covered repair line with the lowest invoice position. The repair labor lines are valued as billed, the
        maintained repair amount is the discounted repair amount, the per-call cap is the tier's covered-repair per-incident
        cap, the refrigerant coverage rate is zero, and the member deductible is the standard deductible.
      params: [repair_discount_pct, covered_repair_per_incident_cap_usd, labor_divisor_daytime, deductible_standard]
    inputs:
      history:
        - {table: plan_service_entries, aggregate: count, field: entry_date, within_months: 12, filters: {event_type: plan_tuneup_visit, entry_reason: completed_visit}}
        - {table: plan_service_entries, aggregate: count, field: entry_date, within_months: 24, filters: {event_type: plan_coverage_draw}}
        - {category: service, table: service_lines, aggregate: sum, field: amount, within_months: 1, filters: {line_type: repair_parts}}
        - {category: service, table: service_lines, aggregate: sum, field: amount, within_months: 1, filters: {line_type: repair_labor}}
        - {category: service, table: service_lines, aggregate: count, field: task_code, within_months: 1, filters: {task_code: txv_replace}}
      cross_category: [service, warranty]
  - id: plan_ext_cancellation_settlement
    base_policy_refs: [plan_cancellation_refund, plan_evt_tuneup_allowance, plan_evt_repair_coverage]
    overwrite:
      - base_policy: plan_cancellation_refund
        superseded_clause: >-
          Under the full-refund treatment the credit is the dues billed for the current term less the retail value of the
          visits completed in the term (tuneup_retail_value_usd per completed tune-up and whole_home_visit_retail_value_usd per
          completed whole-home visit) less the covered-repair benefit drawn in the term, and no cancellation fee is charged.
        replaced_by: >-
          The cancellation credit is the refundable dues less the visit chargeback, the coverage chargeback, the install credit
          recapture and the discount recapture, rounded to the cent half up, and never below zero.
      - base_policy: plan_cancellation_refund
        superseded_clause: >-
          Outside the window the credit is the dues billed for the term multiplied by the unused full months divided by
          twelve, rounded to the cent half up, less the same retail value of completed visits and covered-repair benefit drawn
        replaced_by: >-
          The refundable dues are the term dues billed multiplied by the unused full months divided by twelve, rounded to the
          cent half up, where the unused full months are the whole calendar months counted as complete month-to-month steps
          from the date of handling that end on or before the term end.
    trigger: on_request
    subject: [plan_customer_cancel]
    computes: proration_credit
    target_tool: confirm_agreement_cancellation_08dfa488
    params:
      long_standing_terms: 10
      steady_terms: 5
      long_standing_notice_days: 60
      long_standing_enrolled_months: 120
      long_standing_visits: 8
      established_enrolled_months: 60
      established_visits: 4
      visit_rate_long_standing: 0.6
      visit_rate_established: 0.8
      visit_rate_retail: 1.0
      coverage_rate_long_standing: 0.25
      coverage_rate_steady: 0.5
      coverage_rate_standard: 1.0
      install_recapture_recent: 0.5
      install_recapture_within_year: 0.25
      discount_recapture_full: 1.0
      discount_recapture_partial: 0.4
      discount_full_threshold_usd: 250.0
      discount_partial_threshold_usd: 100.0
    rule: >-
      Cancelling an agreement is the member's own decision: the member confirms the pending cancellation request on the
      agreement in person, the cancellation takes effect on the date of that confirmation, which becomes the cancelled date,
      and for an annually billed agreement the cancellation credit is posted with the confirmation, naming the current term's
      dues charge it refunds. When the notice falls outside the full-refund window and the tier's cancellation fee is above 0.00, that cancellation fee is billed with the confirmation; otherwise no cancellation fee is billed. The cancellation credit is fixed only after every completed service call on an enrolled system
      with repair lines posted since the current term began carries its covered-repair draw on the agreement. The credit is
      worked out in this order. The term dues billed are the annual, renewal, additional-system and upgrade proration dues charges of the current term, being those posted fewer whole calendar months before the date of handling than the whole calendar months elapsed since the term began, plus one. The refundable dues are the term dues billed multiplied by the unused full
      months divided by twelve, rounded to the cent half up, where the unused full months are the whole calendar months
      counted as complete month-to-month steps from the date of handling that end on or before the term end. The visit
      chargeback is the completed cooling and heating tune-ups charged to the current term times the tier's tune-up retail
      value plus the completed whole-home visits charged to the current term times the tier's whole-home visit retail value,
      that sum multiplied by the visit chargeback rate and rounded to the cent half up. The coverage chargeback is the
      covered-repair benefit drawn in the current term multiplied by the coverage chargeback rate and rounded to the cent half
      up. The install credit recapture is the member installation credit posted on the member's Harbison installation
      contracts within the 12 months before the date of handling multiplied by the install credit recapture rate, rounded to
      the cent half up. The discount recapture is the member repair discounts posted on the member's service calls within that same current-term window multiplied by the discount recapture rate, rounded to the cent half up. The cancellation credit is
      the refundable dues less the visit chargeback, the coverage chargeback, the install credit recapture and the discount
      recapture, rounded to the cent half up, and never below zero. The visit chargeback rate is one, the coverage chargeback
      rate is one, and the install credit recapture rate and the discount recapture rate are zero. Refund basis rule: when the
      member gave notice of this cancellation, the notice date being the date the pending cancellation request was received,
      no later than the tier's full-refund window after the current term began, counted in calendar days with the term start
      as day 0, the refundable dues are the term dues billed in full; when notice came later than that window but no later
      than the long-standing notice window after the term began and the agreement is in at least its tenth consecutive term,
      the refundable dues are the term dues billed multiplied by the calendar days from the date of handling to the term end
      divided by 365, rounded to the cent half up; in every other case the refundable dues follow the unused full months.
      Visit chargeback rule: an agreement first enrolled at least the long-standing enrollment months before the date of
      handling whose completed tune-up and whole-home visits on record number at least the long-standing visit count is
      charged back at the long-standing visit rate; one enrolled at least the established enrollment months with at least the
      established visit count that does not meet both long-standing conditions is charged back at the established visit
      rate; any other agreement is charged back at the full retail value. Coverage chargeback rule: an agreement in at least
      its tenth consecutive term with no covered-repair draw dated within the 24 months before the date of handling apart
      from draws charged to the current term has the long-standing coverage rate; an agreement in at least its fifth
      consecutive term that does not meet that condition has the steady-member coverage rate; any other agreement has a
      coverage chargeback rate of one. Install credit recapture rule: when the member's most recent member installation
      credit was posted fewer than six whole calendar months before the date of handling the recent-credit recapture rate
      applies; when it was posted six or more but fewer than twelve whole calendar months before, the within-a-year recapture
      rate applies; when none was posted within the 12 months before the date of handling the rate is zero. Discount recapture rule: member repair discounts within the current-term window totalling at least the full recapture threshold are
      recaptured at the full recapture rate; a total of at least the partial recapture threshold but below the full recapture
      threshold is recaptured at the partial recapture rate; a smaller total is not recaptured. A monthly agreement earns no
      proration credit. At cancellation the visits and covered-repair benefit still available in the term are removed as
      closed with the agreement.
    prerequisite:
      - problem: plan_ext_covered_repair_draw
        kind: value_input
        gate: settle_coverage_drawn
        form: state
        policy_source: >-
          The cancellation credit is fixed only after every completed service call on an enrolled system with repair lines
          posted since the current term began carries its covered-repair draw on the agreement.
        condition: >-
          Every completed member service call on an enrolled system whose repair lines were posted in the current term has a
          plan coverage draw entry on the agreement naming that call, charged to the current term.
        resolved_by: post_covered_repair_draw_a854dec6
        effect: >-
          The covered-repair benefit drawn in the current term, which the coverage chargeback is taken from, rises from what
          stood before the draw to include the draw for the call, so the cancellation credit falls accordingly.
    cross_category:
      - category: install
        as: history
        reads: [install_ledger.line_type, install_ledger.amount, install_ledger.posted_date]
        note: The install credit recapture rule reads the member installation credits posted on the member's installation contracts and the date of the most recent one.
      - category: service
        as: history
        reads: [service_lines.line_type, service_lines.amount, service_lines.posted_date]
        note: The discount recapture rule reads the member repair discounts posted on the member's service calls since the term began.
    compute:
      - settle_term_months_elapsed: "MONTHS(F('term_start'), NOW)"
      - settle_term_dues_billed: "SUM('plan_billing_entries', 'amount', within_months=settle_term_months_elapsed + 1, date_field='posted_date', event_type='plan_dues_charge', line_type='renewal_dues') + SUM('plan_billing_entries', 'amount', within_months=settle_term_months_elapsed + 1, date_field='posted_date', event_type='plan_dues_charge', line_type='annual_dues') + SUM('plan_billing_entries', 'amount', within_months=settle_term_months_elapsed + 1, date_field='posted_date', event_type='plan_dues_charge', line_type='additional_system_dues') + SUM('plan_billing_entries', 'amount', within_months=settle_term_months_elapsed + 1, date_field='posted_date', event_type='plan_dues_charge', line_type='upgrade_proration')"
      - settle_notice_date: "LATEST('plan_change_requests', 'created_at', date_field='created_at', request_type='cancellation')"
      - settle_notice_day: "DAYS(F('term_start'), settle_notice_date)"
      - settle_unused_months: "MONTHS(NOW, F('term_end'))"
      - settle_refundable_dues: "settle_term_dues_billed if settle_notice_day <= P('cancellation_full_refund_days') else (int((settle_term_dues_billed * DAYS(NOW, F('term_end')) / 365) * 100 + 0.5 + 1e-9) / 100 if (settle_notice_day <= K('long_standing_notice_days') and F('consecutive_terms') >= K('long_standing_terms')) else int((settle_term_dues_billed * settle_unused_months / 12) * 100 + 0.5 + 1e-9) / 100)"
      - settle_tuneups_done: "COUNT('plan_service_entries', event_type='plan_tuneup_visit', entry_reason='completed_visit', term_start=F('term_start'), season='cooling') + COUNT('plan_service_entries', event_type='plan_tuneup_visit', entry_reason='completed_visit', term_start=F('term_start'), season='heating')"
      - settle_whole_home_done: "COUNT('plan_service_entries', event_type='plan_tuneup_visit', entry_reason='completed_visit', term_start=F('term_start'), season='whole_home')"
      - settle_visits_on_record: "COUNT('plan_service_entries', event_type='plan_tuneup_visit', entry_reason='completed_visit')"
      - settle_months_enrolled: "MONTHS(F('enrolled_date'), NOW)"
      - settle_visit_rate: "K('visit_rate_long_standing') if (settle_months_enrolled >= K('long_standing_enrolled_months') and settle_visits_on_record >= K('long_standing_visits')) else (K('visit_rate_established') if (settle_months_enrolled >= K('established_enrolled_months') and settle_visits_on_record >= K('established_visits')) else K('visit_rate_retail'))"
      - settle_visit_chargeback: "int(((settle_tuneups_done * P('tuneup_retail_value_usd') + settle_whole_home_done * P('whole_home_visit_retail_value_usd')) * settle_visit_rate) * 100 + 0.5 + 1e-9) / 100"
      - settle_coverage_drawn: "SUM('plan_service_entries', 'amount', event_type='plan_coverage_draw', term_start=F('term_start'))"
      - settle_draws_24m: "COUNT('plan_service_entries', within_months=24, date_field='entry_date', event_type='plan_coverage_draw')"
      - settle_draws_this_term: "COUNT('plan_service_entries', event_type='plan_coverage_draw', term_start=F('term_start'))"
      - settle_coverage_rate: "K('coverage_rate_long_standing') if (F('consecutive_terms') >= K('long_standing_terms') and settle_draws_24m - settle_draws_this_term == 0) else (K('coverage_rate_steady') if F('consecutive_terms') >= K('steady_terms') else K('coverage_rate_standard'))"
      - settle_coverage_chargeback: "int((settle_coverage_drawn * settle_coverage_rate) * 100 + 0.5 + 1e-9) / 100"
      - settle_install_credit: "XSUM('install', 'install_ledger', 'amount', within_months=12, date_field='posted_date', line_type='member_install_credit')"
      - settle_install_credit_date: "XLATEST('install', 'install_ledger', 'posted_date', date_field='posted_date', line_type='member_install_credit')"
      - settle_install_recapture_rate: "K('install_recapture_recent') if (settle_install_credit_date != None and MONTHS(settle_install_credit_date, NOW) < 6) else (K('install_recapture_within_year') if (settle_install_credit_date != None and MONTHS(settle_install_credit_date, NOW) < 12) else 0)"
      - settle_install_recapture: "int((settle_install_credit * settle_install_recapture_rate) * 100 + 0.5 + 1e-9) / 100"
      - settle_member_discounts: "XSUM('service', 'service_lines', 'amount', within_months=settle_term_months_elapsed + 1, date_field='posted_date', line_type='member_repair_discount')"
      - settle_discount_recapture_rate: "K('discount_recapture_full') if settle_member_discounts >= K('discount_full_threshold_usd') else (K('discount_recapture_partial') if settle_member_discounts >= K('discount_partial_threshold_usd') else 0)"
      - settle_discount_recapture: "int((settle_member_discounts * settle_discount_recapture_rate) * 100 + 0.5 + 1e-9) / 100"
      - result: "MX(0, int((settle_refundable_dues - settle_visit_chargeback - settle_coverage_chargeback - settle_install_recapture - settle_discount_recapture) * 100 + 0.5 + 1e-9) / 100)"
    compute_basis:
      settle_term_dues_billed: "The term dues billed are the annual, renewal, additional-system and upgrade proration dues charges of the current term, being those posted fewer whole calendar months before the date of handling than the whole calendar months elapsed since the term began, plus one."
      settle_notice_date: "the notice date being the date the pending cancellation request was received"
      settle_notice_day: "counted in calendar days with the term start as day 0"
      settle_unused_months: "where the unused full months are the whole calendar months counted as complete month-to-month steps from the date of handling that end on or before the term end"
      settle_refundable_dues: "Refund basis rule: when the member gave notice of this cancellation, the notice date being the date the pending cancellation request was received, no later than the tier's full-refund window after the current term began, counted in calendar days with the term start as day 0, the refundable dues are the term dues billed in full; when notice came later than that window but no later than the long-standing notice window after the term began and the agreement is in at least its tenth consecutive term, the refundable dues are the term dues billed multiplied by the calendar days from the date of handling to the term end divided by 365, rounded to the cent half up; in every other case the refundable dues follow the unused full months."
      settle_tuneups_done: "the completed cooling and heating tune-ups charged to the current term times the tier's tune-up retail value"
      settle_whole_home_done: "the completed whole-home visits charged to the current term times the tier's whole-home visit retail value"
      settle_visits_on_record: "whose completed tune-up and whole-home visits on record number at least the long-standing visit count"
      settle_months_enrolled: "an agreement first enrolled at least the long-standing enrollment months before the date of handling"
      settle_visit_rate: "Visit chargeback rule: an agreement first enrolled at least the long-standing enrollment months before the date of handling whose completed tune-up and whole-home visits on record number at least the long-standing visit count is charged back at the long-standing visit rate; one enrolled at least the established enrollment months with at least the established visit count that does not meet both long-standing conditions is charged back at the established visit rate; any other agreement is charged back at the full retail value."
      settle_visit_chargeback: "that sum multiplied by the visit chargeback rate and rounded to the cent half up"
      settle_coverage_drawn: "The coverage chargeback is the covered-repair benefit drawn in the current term multiplied by the coverage chargeback rate and rounded to the cent half up."
      settle_draws_24m: "with no covered-repair draw dated within the 24 months before the date of handling apart from draws charged to the current term"
      settle_draws_this_term: "apart from draws charged to the current term"
      settle_coverage_rate: "Coverage chargeback rule: an agreement in at least its tenth consecutive term with no covered-repair draw dated within the 24 months before the date of handling apart from draws charged to the current term has the long-standing coverage rate; an agreement in at least its fifth consecutive term that does not meet that condition has the steady-member coverage rate; any other agreement has a coverage chargeback rate of one."
      settle_coverage_chargeback: "multiplied by the coverage chargeback rate and rounded to the cent half up"
      settle_install_credit: "The install credit recapture is the member installation credit posted on the member's Harbison installation contracts within the 12 months before the date of handling multiplied by the install credit recapture rate, rounded to the cent half up."
      settle_install_credit_date: "when the member's most recent member installation credit was posted"
      settle_install_recapture_rate: "Install credit recapture rule: when the member's most recent member installation credit was posted fewer than six whole calendar months before the date of handling the recent-credit recapture rate applies; when it was posted six or more but fewer than twelve whole calendar months before, the within-a-year recapture rate applies; when none was posted within the 12 months before the date of handling the rate is zero."
      settle_install_recapture: "multiplied by the install credit recapture rate, rounded to the cent half up"
      settle_member_discounts: "The discount recapture is the member repair discounts posted on the member's service calls within that same current-term window multiplied by the discount recapture rate, rounded to the cent half up."
      settle_discount_recapture_rate: "Discount recapture rule: member repair discounts within the current-term window totalling at least the full recapture threshold are recaptured at the full recapture rate; a total of at least the partial recapture threshold but below the full recapture threshold is recaptured at the partial recapture rate; a smaller total is not recaptured."
      settle_discount_recapture: "multiplied by the discount recapture rate, rounded to the cent half up"
      result: "The cancellation credit is the refundable dues less the visit chargeback, the coverage chargeback, the install credit recapture and the discount recapture, rounded to the cent half up, and never below zero."
    factors:
      - id: notice_refund_basis
        effect: method
        decides: settle_refundable_dues
        bindings: [settle_notice_date, settle_notice_day, settle_unused_months, settle_refundable_dues]
        ladder:
          - when: "notice of the cancellation was received no later than the tier's full-refund window after the current term began"
            method: "the refundable dues are the term dues billed in full"
          - when: "notice came later than that window but no later than the long-standing notice window after the term began, and the agreement is in at least its tenth consecutive term"
            method: "the refundable dues are the term dues billed times the calendar days from the date of handling to the term end divided by 365, rounded to the cent half up"
          - when: "otherwise"
            method: "the refundable dues are the term dues billed times the unused full months divided by twelve, rounded to the cent half up"
        baseline:
          settle_refundable_dues: "int((settle_term_dues_billed * settle_unused_months / 12) * 100 + 0.5 + 1e-9) / 100"
        evidence: [date, history]
        cross_difficulty: null
      - id: long_tenure_visit_rate
        effect: parameter
        decides: settle_visit_rate
        bindings: [settle_visits_on_record, settle_months_enrolled, settle_visit_rate]
        ladder:
          - when: "the agreement was first enrolled at least the long-standing enrollment months ago and its completed visits on record number at least the long-standing visit count"
            value: "K('visit_rate_long_standing')"
          - when: "the agreement was first enrolled at least the established enrollment months ago with at least the established visit count, and does not meet both long-standing conditions"
            value: "K('visit_rate_established')"
          - when: "otherwise"
            value: "K('visit_rate_retail')"
        baseline:
          settle_visit_rate: "K('visit_rate_retail')"
        evidence: [history, date]
        cross_difficulty: null
      - id: claim_history_coverage_rate
        effect: parameter
        decides: settle_coverage_rate
        bindings: [settle_draws_24m, settle_draws_this_term, settle_coverage_rate]
        ladder:
          - when: "the agreement is in at least its tenth consecutive term and has no covered-repair draw within the 24 months before the date of handling apart from draws charged to the current term"
            value: "K('coverage_rate_long_standing')"
          - when: "the agreement is in at least its fifth consecutive term and does not meet the long-standing condition"
            value: "K('coverage_rate_steady')"
          - when: "otherwise"
            value: "K('coverage_rate_standard')"
        baseline:
          settle_coverage_rate: "K('coverage_rate_standard')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: install_credit_recapture
        effect: parameter
        decides: settle_install_recapture_rate
        bindings: [settle_install_credit, settle_install_credit_date, settle_install_recapture_rate, settle_install_recapture]
        ladder:
          - when: "the most recent member installation credit was posted fewer than six whole calendar months before the date of handling"
            value: "K('install_recapture_recent')"
          - when: "it was posted six or more but fewer than twelve whole calendar months before"
            value: "K('install_recapture_within_year')"
          - when: "otherwise (none posted within the 12 months before the date of handling)"
            value: "0"
        baseline:
          settle_install_recapture_rate: "0"
        evidence: [cross_category, date]
        cross_difficulty: install
      - id: member_discount_recapture
        effect: parameter
        decides: settle_discount_recapture_rate
        bindings: [settle_member_discounts, settle_discount_recapture_rate, settle_discount_recapture]
        ladder:
          - when: "the member repair discounts posted on the member's service calls within the current-term window total at least the full recapture threshold"
            value: "K('discount_recapture_full')"
          - when: "they total at least the partial recapture threshold but below the full recapture threshold"
            value: "K('discount_recapture_partial')"
          - when: "otherwise"
            value: "0"
        baseline:
          settle_discount_recapture_rate: "0"
        evidence: [cross_category]
        cross_difficulty: service
    baseline:
      rule: >-
        The credit is worked out in this order. The term dues billed are the annual, renewal, additional-system and upgrade proration dues charges of the current term, being those posted fewer whole calendar months before the date of handling than the whole calendar months elapsed since the term began, plus one. The refundable dues are the term dues billed multiplied
        by the unused full months divided by twelve, rounded to the cent half up, where the unused full months are the whole
        calendar months counted as complete month-to-month steps from the date of handling that end on or before the term
        end. The visit chargeback is the completed cooling and heating tune-ups charged to the current term times the tier's
        tune-up retail value plus the completed whole-home visits charged to the current term times the tier's whole-home
        visit retail value, that sum multiplied by the visit chargeback rate and rounded to the cent half up. The coverage
        chargeback is the covered-repair benefit drawn in the current term multiplied by the coverage chargeback rate and
        rounded to the cent half up. The install credit recapture is the member installation credit posted on the member's
        Harbison installation contracts within the 12 months before the date of handling multiplied by the install credit
        recapture rate, rounded to the cent half up. The discount recapture is the member repair discounts posted on the member's service calls within that same current-term window multiplied by the discount recapture rate, rounded to the cent
        half up. The cancellation credit is the refundable dues less the visit chargeback, the coverage chargeback, the
        install credit recapture and the discount recapture, rounded to the cent half up, and never below zero. The visit
        chargeback rate is one, the coverage chargeback rate is one, and the install credit recapture rate and the discount
        recapture rate are zero.
      params: [tuneup_retail_value_usd, whole_home_visit_retail_value_usd, visit_rate_retail, coverage_rate_standard]
    inputs:
      history:
        - {table: plan_billing_entries, aggregate: sum, field: amount, within_months: 1, filters: {event_type: plan_dues_charge, line_type: renewal_dues}}
        - {table: plan_service_entries, aggregate: count, field: entry_date, filters: {event_type: plan_tuneup_visit, entry_reason: completed_visit}}
        - {table: plan_service_entries, aggregate: sum, field: amount, filters: {event_type: plan_coverage_draw}}
        - {table: plan_change_requests, aggregate: latest, field: created_at, filters: {request_type: cancellation}}
        - {category: install, table: install_ledger, aggregate: sum, field: amount, within_months: 12, filters: {line_type: member_install_credit}}
        - {category: service, table: service_lines, aggregate: sum, field: amount, within_months: 1, filters: {line_type: member_repair_discount}}
      cross_category: [install, service]
  - id: plan_ext_reinstatement_fee
    base_policy_refs: [plan_reinstatement, plan_evt_missed_appointment]
    overwrite:
      - base_policy: plan_reinstatement
        superseded_clause: >-
          Reinstatement returns the agreement to active and renews it exactly as an automatic renewal would, with the new term
          starting the day after the old term_end so no gap is left, and consecutive_terms continues.
        replaced_by: >-
          A lapsed agreement is reinstated within its renewal grace period at the member's request: reinstatement returns the
          agreement to active status, starts the new term on the day after the lapsed term ended and ends it one day before the
          same calendar date twelve months later, raises the consecutive term count by one, and grants the new term the same
          maintenance visits and covered-repair benefit that the lapsed term was granted at its start and for systems added
          during it, as a renewal would.
      - base_policy: plan_reinstatement
        superseded_clause: >-
          A reinstatement_fee of reinstatement_fee_usd is charged, and a fee of 0.00 means no fee entry is posted.
        replaced_by: >-
          The reinstatement fee is the lapse-adjusted fee multiplied by the tenure share,
          plus the forfeit surcharge, less the installation courtesy and the protection courtesy, rounded to the cent half up and
          never below zero; a fee of 0.00 posts no fee entry.
      - base_policy: plan_reinstatement
        superseded_clause: >-
          A reinstated agreement loses its price lock: its renewal dues use the current annual_dues_first_system_usd, and
          its locked_annual_rate is reset to that rate where the tier carries a price lock; the loyalty discount still applies
          when the count is reached.
        replaced_by: >-
          Reinstatement leaves the locked rate on file and posts no renewal dues of its own; the locked rate and the dues of
          the reinstated term are decided by the policies that settle them.
    trigger: on_request
    subject: [plan_reinstate]
    computes: reinstatement_fee
    target_tool: reinstate_lapsed_agreement_6e8e1b28
    params:
      waiver_days: 7
      standard_days: 30
      long_tenure_terms: 7
      tenure_share_long: 0.5
      tenure_share_loyal: 0.8
      tenure_share_standard: 1.0
      forfeit_surcharge_repeat: 15.0
      forfeit_surcharge_single: 5.0
      install_courtesy_recent: 10.0
      install_courtesy_older: 5.0
      protection_courtesy_long: 10.0
      protection_courtesy_other: 5.0
    rule: >-
      A lapsed agreement is reinstated within its renewal grace period at the member's request: reinstatement returns the
      agreement to active status, starts the new term on the day after the lapsed term ended and ends it one day before the
      same calendar date twelve months later, raises the consecutive term count by one, and grants the new term the same
      maintenance visits and covered-repair benefit that the lapsed term was granted at its start and for systems added
      during it, as a renewal would. Reinstatement leaves the locked rate on file and posts no renewal dues of its own; the
      locked rate and the dues of the reinstated term are decided by the policies that settle them. On a tier whose
      reinstatement fee is 0.00 no reinstatement fee is charged and the fee rules below do not apply. On any other tier the
      reinstatement fee is worked out at the moment of reinstatement from the records of the lapsed term, in this order. The
      reinstatement fee is the lapse-adjusted fee multiplied by the tenure share, plus the forfeit surcharge, less the
      installation courtesy and the protection courtesy, rounded to the cent half up and never below zero; a fee of 0.00
      posts no fee entry. The lapse days are the calendar days from the lapsed term's last day to the date of handling. The
      lapse-adjusted fee is the tier's reinstatement fee as it stands, the tenure share is one, and the forfeit surcharge,
      the installation courtesy and the protection courtesy are zero. Lapse rule: an agreement reinstated no more than the
      waiver days after its lapsed term's last day is charged no reinstatement fee; one reinstated more than the waiver days
      but no more than the standard days after is charged the tier's reinstatement fee as it stands; one reinstated more
      than the standard days after is charged the tier's reinstatement fee multiplied by the lapse days divided by the
      standard days and rounded up to the next whole dollar. Tenure share rule: an agreement that held at least the long-tenure
       term count of consecutive terms when it lapsed and has no reinstatement fee anywhere on its dues ledger pays
      the long-tenure share; one that held at least the tier's loyalty term count but does not meet both long-tenure
      conditions pays the loyal share; any other agreement pays the full share. Forfeit surcharge rule: a lapsed term
      holding two or more visits forfeited by a no-show or a late cancellation adds the repeat surcharge; a lapsed term
      holding exactly one such forfeited visit adds the single surcharge; a lapsed term with none adds nothing. Installation
      courtesy rule: a member whose most recent member installation credit on a Harbison installation contract was posted
      fewer than twelve whole calendar months before the date of handling receives the recent-installation courtesy; one
      whose most recent such credit was posted twelve or more but fewer than thirty-six whole calendar months before
      receives the older-installation courtesy; any other member receives none. Protection courtesy rule: a member holding
      an active Harbison 10-Year Parts & Labor Protection, Harbison 12-Year Total Protection or Harbison 12-Year Total
      Protection Plus contract receives the long-protection courtesy; a member holding an active protection contract of any
      other tier receives the other-protection courtesy; a member with no active protection contract receives none.
    prerequisite: []
    cross_category:
      - category: install
        as: history
        reads: [install_ledger.line_type, install_ledger.posted_date]
        note: The installation courtesy reads the date of the member's most recent member installation credit.
      - category: warranty
        as: branch
        reads: [warranty_contracts.variant_name, warranty_contracts.status]
        note: The protection courtesy reads the tier of the member's active protection contract.
    compute:
      - fee_lapse_days: "DAYS(F('term_end'), NOW)"
      - fee_after_lapse: "0 if fee_lapse_days <= K('waiver_days') else (P('reinstatement_fee_usd') if fee_lapse_days <= K('standard_days') else -(-(P('reinstatement_fee_usd') * fee_lapse_days) // K('standard_days')))"
      - fee_prior_reinstatements: "COUNT('plan_billing_entries', event_type='plan_dues_charge', line_type='reinstatement_fee')"
      - fee_tenure_share: "K('tenure_share_long') if (F('consecutive_terms') >= K('long_tenure_terms') and fee_prior_reinstatements == 0) else (K('tenure_share_loyal') if F('consecutive_terms') >= P('loyalty_consecutive_terms_required') else K('tenure_share_standard'))"
      - fee_term_forfeits: "COUNT('plan_service_entries', event_type='plan_tuneup_visit', entry_reason='no_show_forfeit', term_start=F('term_start')) + COUNT('plan_service_entries', event_type='plan_tuneup_visit', entry_reason='late_cancel_forfeit', term_start=F('term_start'))"
      - fee_forfeit_surcharge: "K('forfeit_surcharge_repeat') if fee_term_forfeits >= 2 else (K('forfeit_surcharge_single') if fee_term_forfeits == 1 else 0)"
      - fee_install_credit_date: "XLATEST('install', 'install_ledger', 'posted_date', date_field='posted_date', line_type='member_install_credit')"
      - fee_install_courtesy: "K('install_courtesy_recent') if (fee_install_credit_date != None and MONTHS(fee_install_credit_date, NOW) < 12) else (K('install_courtesy_older') if (fee_install_credit_date != None and MONTHS(fee_install_credit_date, NOW) < 36) else 0)"
      - fee_protection_tier: "CFIELD('warranty', 'variant_name', status='active')"
      - fee_protection_courtesy: "K('protection_courtesy_long') if (fee_protection_tier == 'Harbison 10-Year Parts & Labor Protection' or fee_protection_tier == 'Harbison 12-Year Total Protection' or fee_protection_tier == 'Harbison 12-Year Total Protection Plus') else (K('protection_courtesy_other') if fee_protection_tier != None else 0)"
      - result: "0 if P('reinstatement_fee_usd') == 0 else MX(0, int((fee_after_lapse * fee_tenure_share + fee_forfeit_surcharge - fee_install_courtesy - fee_protection_courtesy) * 100 + 0.5 + 1e-9) / 100)"
    compute_basis:
      fee_lapse_days: "The lapse days are the calendar days from the lapsed term's last day to the date of handling."
      fee_after_lapse: "Lapse rule: an agreement reinstated no more than the waiver days after its lapsed term's last day is charged no reinstatement fee; one reinstated more than the waiver days but no more than the standard days after is charged the tier's reinstatement fee as it stands; one reinstated more than the standard days after is charged the tier's reinstatement fee multiplied by the lapse days divided by the standard days and rounded up to the next whole dollar."
      fee_prior_reinstatements: "has no reinstatement fee anywhere on its dues ledger"
      fee_tenure_share: "Tenure share rule: an agreement that held at least the long-tenure term count of consecutive terms when it lapsed and has no reinstatement fee anywhere on its dues ledger pays the long-tenure share; one that held at least the tier's loyalty term count but does not meet both long-tenure conditions pays the loyal share; any other agreement pays the full share."
      fee_term_forfeits: "a lapsed term holding two or more visits forfeited by a no-show or a late cancellation"
      fee_forfeit_surcharge: "Forfeit surcharge rule: a lapsed term holding two or more visits forfeited by a no-show or a late cancellation adds the repeat surcharge; a lapsed term holding exactly one such forfeited visit adds the single surcharge; a lapsed term with none adds nothing."
      fee_install_credit_date: "a member whose most recent member installation credit on a Harbison installation contract was posted"
      fee_install_courtesy: "Installation courtesy rule: a member whose most recent member installation credit on a Harbison installation contract was posted fewer than twelve whole calendar months before the date of handling receives the recent-installation courtesy; one whose most recent such credit was posted twelve or more but fewer than thirty-six whole calendar months before receives the older-installation courtesy; any other member receives none."
      fee_protection_tier: "a member holding an active Harbison 10-Year Parts & Labor Protection, Harbison 12-Year Total Protection or Harbison 12-Year Total Protection Plus contract"
      fee_protection_courtesy: "Protection courtesy rule: a member holding an active Harbison 10-Year Parts & Labor Protection, Harbison 12-Year Total Protection or Harbison 12-Year Total Protection Plus contract receives the long-protection courtesy; a member holding an active protection contract of any other tier receives the other-protection courtesy; a member with no active protection contract receives none."
      result: "On any other tier the reinstatement fee is worked out at the moment of reinstatement from the records of the lapsed term, in this order. The reinstatement fee is the lapse-adjusted fee multiplied by the tenure share, plus the forfeit surcharge, less the installation courtesy and the protection courtesy, rounded to the cent half up and never below zero"
    factors:
      - id: lapse_length_fee
        effect: method
        decides: fee_after_lapse
        bindings: [fee_lapse_days, fee_after_lapse]
        ladder:
          - when: "reinstated no more than the waiver days after the lapsed term's last day"
            method: "no reinstatement fee is charged"
          - when: "reinstated more than the waiver days but no more than the standard days after"
            method: "the tier's reinstatement fee is charged as it stands"
          - when: "reinstated more than the standard days after"
            method: "the tier's reinstatement fee is multiplied by the lapse days divided by the standard days and rounded up to the next whole dollar"
        baseline:
          fee_after_lapse: "P('reinstatement_fee_usd')"
        evidence: [date]
        cross_difficulty: null
      - id: tenure_fee_share
        effect: parameter
        decides: fee_tenure_share
        bindings: [fee_prior_reinstatements, fee_tenure_share]
        ladder:
          - when: "at least the long-tenure term count of consecutive terms at lapse and no reinstatement fee anywhere on the dues ledger"
            value: "K('tenure_share_long')"
          - when: "at least the tier's loyalty term count of consecutive terms, not meeting both long-tenure conditions"
            value: "K('tenure_share_loyal')"
          - when: "otherwise"
            value: "K('tenure_share_standard')"
        baseline:
          fee_tenure_share: "K('tenure_share_standard')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: forfeited_visit_surcharge
        effect: parameter
        decides: fee_forfeit_surcharge
        bindings: [fee_term_forfeits, fee_forfeit_surcharge]
        ladder:
          - when: "the lapsed term holds two or more visits forfeited by a no-show or a late cancellation"
            value: "K('forfeit_surcharge_repeat')"
          - when: "the lapsed term holds exactly one such forfeited visit"
            value: "K('forfeit_surcharge_single')"
          - when: "otherwise"
            value: "0"
        baseline:
          fee_forfeit_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: installation_customer_courtesy
        effect: parameter
        decides: fee_install_courtesy
        bindings: [fee_install_credit_date, fee_install_courtesy]
        ladder:
          - when: "the most recent member installation credit was posted fewer than twelve whole calendar months before the date of handling"
            value: "K('install_courtesy_recent')"
          - when: "it was posted twelve or more but fewer than thirty-six whole calendar months before"
            value: "K('install_courtesy_older')"
          - when: "otherwise"
            value: "0"
        baseline:
          fee_install_courtesy: "0"
        evidence: [cross_category, date]
        cross_difficulty: install
      - id: protection_holder_courtesy
        effect: parameter
        decides: fee_protection_courtesy
        bindings: [fee_protection_tier, fee_protection_courtesy]
        ladder:
          - when: "an active Harbison 10-Year Parts & Labor Protection, 12-Year Total Protection or 12-Year Total Protection Plus contract"
            value: "K('protection_courtesy_long')"
          - when: "an active protection contract of any other tier"
            value: "K('protection_courtesy_other')"
          - when: "otherwise"
            value: "0"
        baseline:
          fee_protection_courtesy: "0"
        evidence: [cross_category]
        cross_difficulty: warranty
    baseline:
      rule: >-
        The lapse days are the calendar days from the lapsed term's last day to the date of handling. The reinstatement fee
        is the lapse-adjusted fee multiplied by the tenure share, plus the forfeit
        surcharge, less the installation courtesy and the protection courtesy, rounded to the cent half up and never below
        zero; a fee of 0.00 posts no fee entry. The lapse-adjusted fee is the tier's reinstatement fee as it stands, the tenure share is one,
        and the forfeit surcharge, the installation courtesy and the protection courtesy are zero.
      params: [reinstatement_fee_usd, tenure_share_standard]
    inputs:
      history:
        - {table: plan_billing_entries, aggregate: count, field: line_type, filters: {line_type: reinstatement_fee}}
        - {table: plan_service_entries, aggregate: count, field: entry_reason, filters: {event_type: plan_tuneup_visit}}
        - {category: install, table: install_ledger, aggregate: latest, field: posted_date, filters: {line_type: member_install_credit}}
      cross_category: [install, warranty]
  - id: plan_ext_reinstated_rate_lock
    base_policy_refs: [plan_dues_pricing, plan_renewal, plan_reinstatement, plan_tier_changes]
    overwrite:
      - base_policy: plan_reinstatement
        superseded_clause: >-
          A reinstated agreement loses its price lock: its renewal dues use the current annual_dues_first_system_usd, and
          its locked_annual_rate is reset to that rate where the tier carries a price lock; the loyalty discount still applies
          when the count is reached.
        replaced_by: >-
          The locked rate for the reinstated term is the retained rate plus the maintenance surcharge, less the registration
          credit and the protection credit, rounded to the cent half up, and never above the tier's current first-system
          annual rate.
    trigger: on_request
    subject: [plan_renew]
    computes: locked_annual_rate
    target_tool: set_reinstated_rate_lock_0c66ac3f
    params:
      keep_days: 15
      halfway_terms: 6
      surcharge_no_tuneup: 10.0
      surcharge_one_tuneup: 5.0
      registration_credit_twelve: 6.0
      registration_credit_ten: 3.0
      protection_credit_long: 6.0
      protection_credit_other: 3.0
    rule: >-
      On a tier that carries a price lock, the price lock of an agreement reinstated within its renewal grace period is
      decided once for the reinstated term and written as the agreement's locked rate. The locked rate for a reinstated term
      is set only once the agreement shows active status with a current term that began the day after the lapsed term ended.
      The days since lapse are the calendar days from the lapsed term's last day, which is the day before the agreement's current term start, to the date of handling. The locked rate for
      the reinstated term is the retained rate plus the maintenance surcharge, less the registration credit and the
      protection credit, rounded to the cent half up, and never above the tier's current first-system annual rate. The
      retained rate is the tier's current first-system annual rate, and the maintenance surcharge, the registration credit and
      the protection credit are zero. Retention rule: an agreement reinstated no more than the keep days after its lapsed term's last day keeps the locked rate on file as its retained rate; one reinstated more than the keep days after and in at least the halfway term count of consecutive terms counting the reinstated term retains the locked rate on file plus half of the difference up to the tier's current first-system annual rate, rounded to the cent half up; any other agreement retains the tier's current first-system annual rate. Maintenance surcharge rule: an agreement with no completed cooling or heating tune-up dated
      within the 12 months before the date of handling adds the no-maintenance surcharge; one with exactly one such tune-up adds
      the single-tune-up surcharge; one with two or more adds nothing. Registration credit rule: a member whose Harbison
      installation carries a manufacturer registration confirming a parts warranty of twelve years or more receives the
      twelve-year registration credit; one whose longest registered parts warranty is ten or eleven years receives the
      ten-year registration credit; any other member receives none. Protection credit rule: a member holding an active
      Harbison 10-Year Parts & Labor Protection, Harbison 12-Year Total Protection or Harbison 12-Year Total Protection Plus
      contract receives the long-protection credit; a member holding an active protection contract of any other tier
      receives the other-protection credit; a member with no active protection contract receives none.
    prerequisite:
      - problem: plan_ext_reinstatement_fee
        kind: state_gate
        gate: plan_agreements.status
        form: state
        policy_source: >-
          The locked rate for a reinstated term is set only once the agreement shows active status with a current term that
          began the day after the lapsed term ended.
        condition: >-
          The agreement's status is active and its current term start is the day after the lapsed term's last day.
        resolved_by: reinstate_lapsed_agreement_6e8e1b28
        effect: >-
          The agreement leaves lapsed status and its current term start becomes the day after the lapsed term's last day, the date the days since lapse are counted back to, and its consecutive term count, which the retention rule reads, rises by one.
    cross_category:
      - category: install
        as: history
        reads: [install_ledger.line_type, install_ledger.registered_parts_years]
        note: The registration credit reads the longest manufacturer parts warranty registered on the member's installations.
      - category: warranty
        as: branch
        reads: [warranty_contracts.variant_name, warranty_contracts.status]
        note: The protection credit reads the tier of the member's active protection contract.
    compute:
      - lock_lapse_days: "DAYS(F('term_start'), NOW) + 1"
      - lock_retained: "F('locked_annual_rate') if lock_lapse_days <= K('keep_days') else (int((F('locked_annual_rate') + (P('annual_dues_first_system_usd') - F('locked_annual_rate')) / 2) * 100 + 0.5 + 1e-9) / 100 if (lock_lapse_days > K('keep_days') and F('consecutive_terms') >= K('halfway_terms')) else P('annual_dues_first_system_usd'))"
      - lock_tuneups_12m: "COUNT('plan_service_entries', within_months=12, date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit', season='cooling') + COUNT('plan_service_entries', within_months=12, date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit', season='heating')"
      - lock_maintenance_surcharge: "K('surcharge_no_tuneup') if lock_tuneups_12m == 0 else (K('surcharge_one_tuneup') if lock_tuneups_12m == 1 else 0)"
      - lock_registered_years: "XMAX('install', 'install_ledger', 'registered_parts_years', line_type='mfr_registration')"
      - lock_registration_credit: "K('registration_credit_twelve') if lock_registered_years >= 12 else (K('registration_credit_ten') if lock_registered_years >= 10 else 0)"
      - lock_protection_tier: "CFIELD('warranty', 'variant_name', status='active')"
      - lock_protection_credit: "K('protection_credit_long') if (lock_protection_tier == 'Harbison 10-Year Parts & Labor Protection' or lock_protection_tier == 'Harbison 12-Year Total Protection' or lock_protection_tier == 'Harbison 12-Year Total Protection Plus') else (K('protection_credit_other') if lock_protection_tier != None else 0)"
      - result: "MN(P('annual_dues_first_system_usd'), int((lock_retained + lock_maintenance_surcharge - lock_registration_credit - lock_protection_credit) * 100 + 0.5 + 1e-9) / 100)"
    compute_basis:
      lock_lapse_days: "The days since lapse are the calendar days from the lapsed term's last day, which is the day before the agreement's current term start, to the date of handling."
      lock_retained: "Retention rule: an agreement reinstated no more than the keep days after its lapsed term's last day keeps the locked rate on file as its retained rate; one reinstated more than the keep days after and in at least the halfway term count of consecutive terms counting the reinstated term retains the locked rate on file plus half of the difference up to the tier's current first-system annual rate, rounded to the cent half up; any other agreement retains the tier's current first-system annual rate."
      lock_tuneups_12m: "no completed cooling or heating tune-up dated within the 12 months before the date of handling"
      lock_maintenance_surcharge: "Maintenance surcharge rule: an agreement with no completed cooling or heating tune-up dated within the 12 months before the date of handling adds the no-maintenance surcharge; one with exactly one such tune-up adds the single-tune-up surcharge; one with two or more adds nothing."
      lock_registered_years: "a manufacturer registration confirming a parts warranty of twelve years or more"
      lock_registration_credit: "Registration credit rule: a member whose Harbison installation carries a manufacturer registration confirming a parts warranty of twelve years or more receives the twelve-year registration credit; one whose longest registered parts warranty is ten or eleven years receives the ten-year registration credit; any other member receives none."
      lock_protection_tier: "a member holding an active Harbison 10-Year Parts & Labor Protection, Harbison 12-Year Total Protection or Harbison 12-Year Total Protection Plus contract"
      lock_protection_credit: "Protection credit rule: a member holding an active Harbison 10-Year Parts & Labor Protection, Harbison 12-Year Total Protection or Harbison 12-Year Total Protection Plus contract receives the long-protection credit; a member holding an active protection contract of any other tier receives the other-protection credit; a member with no active protection contract receives none."
      result: "The locked rate for the reinstated term is the retained rate plus the maintenance surcharge, less the registration credit and the protection credit, rounded to the cent half up, and never above the tier's current first-system annual rate."
    factors:
      - id: lock_retention
        effect: method
        decides: lock_retained
        bindings: [lock_lapse_days, lock_retained]
        ladder:
          - when: "reinstated no more than the keep days after the lapsed term's last day"
            method: "the locked rate on file is kept as it stands"
          - when: "reinstated more than the keep days after and in at least the halfway term count of consecutive terms counting the reinstated term"
            method: "the locked rate on file plus half of the difference up to the current first-system rate, rounded to the cent half up"
          - when: "otherwise"
            method: "the tier's current first-system annual rate"
        baseline:
          lock_retained: "P('annual_dues_first_system_usd')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: maintenance_lock_surcharge
        effect: parameter
        decides: lock_maintenance_surcharge
        bindings: [lock_tuneups_12m, lock_maintenance_surcharge]
        ladder:
          - when: "no completed cooling or heating tune-up dated within the 12 months before the date of handling"
            value: "K('surcharge_no_tuneup')"
          - when: "exactly one such completed tune-up"
            value: "K('surcharge_one_tuneup')"
          - when: "otherwise (two or more)"
            value: "0"
        baseline:
          lock_maintenance_surcharge: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: registration_lock_credit
        effect: parameter
        decides: lock_registration_credit
        bindings: [lock_registered_years, lock_registration_credit]
        ladder:
          - when: "a manufacturer registration on the member's Harbison installation confirms a parts warranty of twelve years or more"
            value: "K('registration_credit_twelve')"
          - when: "the longest registered parts warranty is ten or eleven years"
            value: "K('registration_credit_ten')"
          - when: "otherwise"
            value: "0"
        baseline:
          lock_registration_credit: "0"
        evidence: [cross_category]
        cross_difficulty: install
      - id: protection_lock_credit
        effect: parameter
        decides: lock_protection_credit
        bindings: [lock_protection_tier, lock_protection_credit]
        ladder:
          - when: "an active Harbison 10-Year Parts & Labor Protection, 12-Year Total Protection or 12-Year Total Protection Plus contract"
            value: "K('protection_credit_long')"
          - when: "an active protection contract of any other tier"
            value: "K('protection_credit_other')"
          - when: "otherwise"
            value: "0"
        baseline:
          lock_protection_credit: "0"
        evidence: [cross_category]
        cross_difficulty: warranty
    baseline:
      rule: >-
        The days since lapse are the calendar days from the lapsed term's last day, which is the day before the agreement's current term start, to the date of handling. The locked rate
        for the reinstated term is the retained rate plus the maintenance surcharge, less the registration credit and the
        protection credit, rounded to the cent half up, and never above the tier's current first-system annual rate. The
        retained rate is the tier's current first-system annual rate, and the maintenance surcharge, the registration credit
        and the protection credit are zero.
      params: [annual_dues_first_system_usd]
    inputs:
      history:
        - {table: plan_service_entries, aggregate: count, field: entry_date, within_months: 12, filters: {event_type: plan_tuneup_visit, entry_reason: completed_visit}}
        - {category: install, table: install_ledger, aggregate: max, field: registered_parts_years, filters: {line_type: mfr_registration}}
      cross_category: [install, warranty]
  - id: plan_ext_missed_visit_fee
    base_policy_refs: [plan_enrollment_eligibility, plan_dues_pricing, plan_billing_collections, plan_evt_missed_appointment, plan_reinstatement, plan_cancellation_refund, plan_tier_changes, plan_evt_add_system]
    overwrite:
      - base_policy: plan_evt_missed_appointment
        superseded_clause: >-
          on such a tier the missed appointment is recorded as a plan_tuneup_visit with reason no_show_forfeit or
          late_cancel_forfeit, which uses up the visit, and a missed_appointment_fee of missed_appointment_fee_usd is charged.
        replaced_by: >-
          The missed-visit fee is the repeat-miss fee or the tenure cap, whichever is lower, less the attendance reduction,
          with the forfeit treatment applied to that amount, and never below zero.
    trigger: state_due
    subject: [plan_dues_charge]
    computes: fee_amount
    target_tool: post_missed_visit_fee_325d3ccb
    params:
      fee_increase_second_miss: 10.0
      fee_increase_third_miss: 25.0
      cap_long_months: 84
      cap_mid_months: 48
      cap_long_tenure: 30.0
      cap_mid_tenure: 40.0
      cap_none: 1000.0
      reduction_four: 5.0
      reduction_two: 3.0
      halving_terms: 5
    rule: >-
      On a tier whose missed visits are forfeited, a visit recorded as a no-show or a late-cancellation forfeit is charged a
      missed-visit fee on the agreement's dues ledger, billed to the month in which the fee is posted. A missed-appointment fee
      for a visit forfeited in a lapsed term is not posted until the agreement is back in active status with its reinstated
      term on record. The fee is worked out when the most recent forfeited visit on record is one that carries no fee, and the forfeit treatment reads that most recent forfeited visit; the amount is worked out in this order. The
      missed-visit fee is the repeat-miss fee or the tenure cap, whichever is lower, less the attendance reduction, with the
      forfeit treatment applied to that amount, and never below zero. The repeat-miss fee is the tier's missed-appointment
      fee, the tenure cap does not limit it, the attendance reduction is zero, and the forfeit treatment charges the amount as
      it stands. Repeat-miss rule: an agreement with three or more visits forfeited by a no-show or a late cancellation dated within the 24 months before the date of handling pays the tier's missed-appointment fee raised by the third-miss increase; one with exactly two such forfeits pays it raised by the second-miss increase; one with fewer pays the tier's missed-appointment fee. Tenure cap rule: an agreement first enrolled at least the long-tenure months before the date of handling caps the fee at the long-tenure cap; one first enrolled at least the mid-tenure months but fewer than the long-tenure months before caps it at the mid-tenure cap; any other agreement has no cap. Attendance rule: an agreement with four or
      more completed cooling or heating tune-ups dated within the 24 months before the date of handling receives the
      four-visit reduction; one with two or three receives the two-visit reduction; one with fewer receives none. Forfeit
      treatment rule: when the most recent forfeited visit was a late cancellation and the agreement is in at least its fifth
      consecutive term, the amount is halved and rounded down to a whole dollar; when it was a late cancellation and the
      agreement is in fewer than its fifth consecutive term, the amount is multiplied by three quarters and rounded up to a
      whole dollar; when it was a no-show, the amount is charged as it stands.
    prerequisite:
      - problem: plan_ext_reinstatement_fee
        kind: state_gate
        gate: plan_agreements.status
        form: state
        policy_source: >-
          A missed-appointment fee for a visit forfeited in a lapsed term is not posted until the agreement is back in active
          status with its reinstated term on record.
        condition: >-
          The agreement's status is active and its current term starts the day after the lapsed term's last day.
        resolved_by: reinstate_lapsed_agreement_6e8e1b28
        effect: >-
          The agreement leaves lapsed status and carries its reinstated term, and the consecutive term count the forfeit treatment
          reads rises by one.
    cross_category: []
    compute:
      - miss_forfeits_24m: "COUNT('plan_service_entries', within_months=24, date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='no_show_forfeit') + COUNT('plan_service_entries', within_months=24, date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='late_cancel_forfeit')"
      - miss_repeat_fee: "P('missed_appointment_fee_usd') + K('fee_increase_third_miss') if miss_forfeits_24m >= 3 else (P('missed_appointment_fee_usd') + K('fee_increase_second_miss') if miss_forfeits_24m == 2 else P('missed_appointment_fee_usd'))"
      - miss_enrolled_months: "MONTHS(F('enrolled_date'), NOW)"
      - miss_tenure_cap: "K('cap_long_tenure') if miss_enrolled_months >= K('cap_long_months') else (K('cap_mid_tenure') if miss_enrolled_months >= K('cap_mid_months') else K('cap_none'))"
      - miss_completed_24m: "COUNT('plan_service_entries', within_months=24, date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit', season='cooling') + COUNT('plan_service_entries', within_months=24, date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit', season='heating')"
      - miss_attendance_reduction: "K('reduction_four') if miss_completed_24m >= 4 else (K('reduction_two') if miss_completed_24m >= 2 else 0)"
      - miss_net: "MN(miss_repeat_fee, miss_tenure_cap) - miss_attendance_reduction"
      - miss_late_cancel_date: "LATEST('plan_service_entries', 'entry_date', date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='late_cancel_forfeit')"
      - miss_no_show_date: "LATEST('plan_service_entries', 'entry_date', date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='no_show_forfeit')"
      - miss_treated: "int(miss_net / 2) if (miss_late_cancel_date != None and (miss_no_show_date == None or miss_late_cancel_date > miss_no_show_date) and F('consecutive_terms') >= K('halving_terms')) else (-(-(miss_net * 3) // 4) if (miss_late_cancel_date != None and (miss_no_show_date == None or miss_late_cancel_date > miss_no_show_date)) else miss_net)"
      - result: "MX(0, int((miss_treated) * 100 + 0.5 + 1e-9) / 100)"
    compute_basis:
      miss_forfeits_24m: "visits forfeited by a no-show or a late cancellation dated within the 24 months before the date of handling"
      miss_repeat_fee: "Repeat-miss rule: an agreement with three or more visits forfeited by a no-show or a late cancellation dated within the 24 months before the date of handling pays the tier's missed-appointment fee raised by the third-miss increase; one with exactly two such forfeits pays it raised by the second-miss increase; one with fewer pays the tier's missed-appointment fee."
      miss_enrolled_months: "an agreement first enrolled at least the long-tenure months before the date of handling"
      miss_tenure_cap: "Tenure cap rule: an agreement first enrolled at least the long-tenure months before the date of handling caps the fee at the long-tenure cap; one first enrolled at least the mid-tenure months but fewer than the long-tenure months before caps it at the mid-tenure cap; any other agreement has no cap."
      miss_completed_24m: "completed cooling or heating tune-ups dated within the 24 months before the date of handling"
      miss_attendance_reduction: "Attendance rule: an agreement with four or more completed cooling or heating tune-ups dated within the 24 months before the date of handling receives the four-visit reduction; one with two or three receives the two-visit reduction; one with fewer receives none."
      miss_net: "The missed-visit fee is the repeat-miss fee or the tenure cap, whichever is lower, less the attendance reduction"
      miss_late_cancel_date: "the forfeit treatment reads that most recent forfeited visit"
      miss_no_show_date: "when it was a no-show, the amount is charged as it stands"
      miss_treated: "Forfeit treatment rule: when the most recent forfeited visit was a late cancellation and the agreement is in at least its fifth consecutive term, the amount is halved and rounded down to a whole dollar; when it was a late cancellation and the agreement is in fewer than its fifth consecutive term, the amount is multiplied by three quarters and rounded up to a whole dollar; when it was a no-show, the amount is charged as it stands."
      result: "with the forfeit treatment applied to that amount, and never below zero"
    factors:
      - id: repeat_miss_fee
        effect: parameter
        decides: miss_repeat_fee
        bindings: [miss_forfeits_24m, miss_repeat_fee]
        ladder:
          - when: "three or more no-show or late-cancellation forfeits dated within the 24 months before the date of handling"
            value: "P('missed_appointment_fee_usd') + K('fee_increase_third_miss')"
          - when: "exactly two such forfeits"
            value: "P('missed_appointment_fee_usd') + K('fee_increase_second_miss')"
          - when: "otherwise"
            value: "P('missed_appointment_fee_usd')"
        baseline:
          miss_repeat_fee: "P('missed_appointment_fee_usd')"
        evidence: [history, date]
        cross_difficulty: null
      - id: tenure_fee_cap
        effect: parameter
        decides: miss_tenure_cap
        bindings: [miss_enrolled_months, miss_tenure_cap]
        ladder:
          - when: "the agreement was first enrolled at least the long-tenure months before the date of handling"
            value: "K('cap_long_tenure')"
          - when: "first enrolled at least the mid-tenure months but fewer than the long-tenure months before"
            value: "K('cap_mid_tenure')"
          - when: "otherwise"
            value: "no cap"
        baseline:
          miss_tenure_cap: "K('cap_none')"
        evidence: [date]
        cross_difficulty: null
      - id: attendance_reduction
        effect: parameter
        decides: miss_attendance_reduction
        bindings: [miss_completed_24m, miss_attendance_reduction]
        ladder:
          - when: "four or more completed cooling or heating tune-ups dated within the 24 months before the date of handling"
            value: "K('reduction_four')"
          - when: "two or three such completed tune-ups"
            value: "K('reduction_two')"
          - when: "otherwise"
            value: "0"
        baseline:
          miss_attendance_reduction: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: forfeit_treatment
        effect: method
        decides: miss_treated
        bindings: [miss_late_cancel_date, miss_no_show_date, miss_treated]
        ladder:
          - when: "the most recent forfeited visit was a late cancellation and the agreement is in at least its fifth consecutive term"
            method: "the amount is halved and rounded down to a whole dollar"
          - when: "the most recent forfeited visit was a late cancellation and the agreement is in fewer than its fifth consecutive term"
            method: "the amount is multiplied by three quarters and rounded up to a whole dollar"
          - when: "otherwise (the most recent forfeited visit was a no-show)"
            method: "the amount is charged as it stands"
        baseline:
          miss_treated: "miss_net"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The missed-visit fee is the repeat-miss fee or the tenure cap, whichever is lower, less the attendance reduction, with
        the forfeit treatment applied to that amount, and never below zero. The repeat-miss fee is the tier's
        missed-appointment fee, the tenure cap does not limit it, the attendance reduction is zero, and the forfeit treatment
        charges the amount as it stands.
      params: [missed_appointment_fee_usd, cap_none]
    inputs:
      history:
        - {table: plan_service_entries, aggregate: count, field: entry_reason, within_months: 24, filters: {event_type: plan_tuneup_visit}}
        - {table: plan_service_entries, aggregate: latest, field: entry_date, filters: {entry_reason: late_cancel_forfeit}}
      cross_category: []
  - id: plan_ext_reinstated_term_dues
    base_policy_refs: [plan_billing_collections, plan_dues_pricing, plan_reinstatement]
    overwrite:
      - base_policy: plan_dues_pricing
        superseded_clause: >-
          When the renewing term's consecutive_terms reaches loyalty_consecutive_terms_required, the annual renewal dues
          after the price lock are reduced by loyalty_discount_pct.
        replaced_by: >-
          The dues discount is the loyalty discount, the trouble-free discount and the protection bundle discount added
          together into one percentage, taken once off the gross dues
      - base_policy: plan_dues_pricing
        superseded_clause: >-
          Annual dues for a term are annual_dues_first_system_usd plus annual_dues_additional_system_usd for each enrolled
          system beyond the first
        replaced_by: >-
          The gross dues are the first-system rate plus the tier's additional-system annual rate multiplied by the
          additional-system share for each enrolled system beyond the first.
      - base_policy: plan_dues_pricing
        superseded_clause: >-
          billed once in advance as annual_dues for the first term or renewal_dues for later terms, with billing_period equal
          to the month of term_start
        replaced_by: >-
          The dues of an annually billed agreement reinstated within its renewal grace period are billed and paid by the
          member in one payment for the reinstated term, which runs from the day after the lapsed term ended, and the amount
          billed follows the gap rule
      - base_policy: plan_dues_pricing
        superseded_clause: >-
          the first-system rate for the new term is the lower of the agreement's locked_annual_rate and the current
          annual_dues_first_system_usd
        replaced_by: >-
          Price lock rule: when the agreement carries a locked rate below the tier's current first-system annual rate and was
          first enrolled at least the lock tenure months before the date of handling, the first-system rate is the locked
          rate; when it carries such a locked rate and was first enrolled fewer months before, the first-system rate is the
          average of the locked rate and the current rate, rounded to the cent half up; otherwise it is the current rate.
      - base_policy: plan_dues_pricing
        superseded_clause: >-
          and additional systems are billed at the current catalogue rate
        replaced_by: >-
          Additional-system share rule: when the member's most recently signed Harbison installation contract was signed
          fewer than the new-installation months before the date of handling, the share is the new-installation share; when
          it was signed at least the new-installation months but fewer than the recent-installation months before, the share
          is the recent-installation share; otherwise the share is one.
      - base_policy: plan_reinstatement
        superseded_clause: >-
          A reinstated agreement loses its price lock: its renewal dues use the current annual_dues_first_system_usd, and
          its locked_annual_rate is reset to that rate where the tier carries a price lock; the loyalty discount still applies
          when the count is reached.
        replaced_by: >-
          Price lock rule: when the agreement carries a locked rate below the tier's current first-system annual rate and was
          first enrolled at least the lock tenure months before the date of handling, the first-system rate is the locked
          rate; when it carries such a locked rate and was first enrolled fewer months before, the first-system rate is the
          average of the locked rate and the current rate, rounded to the cent half up; otherwise it is the current rate.
    trigger: on_request
    subject: [plan_dues_payment]
    computes: term_dues
    target_tool: pay_reinstated_term_dues_c2f743bd
    params:
      lock_tenure_months: 60
      add_share_new: 0.6
      add_share_recent: 0.8
      add_share_standard: 1.0
      install_new_months: 12
      install_recent_months: 36
      loyalty_enhanced_terms: 7
      loyalty_enhanced_pct: 8.0
      trouble_free_none_pct: 3.0
      trouble_free_low_pct: 1.5
      trouble_free_threshold_usd: 500.0
      bundle_with_install_pct: 2.0
      bundle_other_pct: 1.0
      gap_full_days: 30
      gap_partial_days: 15
      gap_terms: 5
    rule: >-
      The dues of an annually billed agreement reinstated within its renewal grace period are billed and paid by the member
      in one payment for the reinstated term, which runs from the day after the lapsed term ended, and the amount billed
      follows the gap rule; fees standing on the agreement are billed separately. The dues of a reinstated term are fixed
      only after the agreement shows active status with a term starting the day after the lapsed term ended. The dues of a
      reinstated term are not billed until the price lock for that term has been decided. The dues of a reinstated term are
      not fixed until the dues ledger carries a missed-visit fee for every visit forfeited in the lapsed term. The term dues
      are worked out in this order. The gross dues are the first-system rate plus the tier's additional-system annual rate
      multiplied by the additional-system share for each enrolled system beyond the first. The dues discount is the loyalty
      discount, the trouble-free discount and the protection bundle discount added together into one percentage, taken once
      off the gross dues; the discounted dues are rounded to the cent half up. The term dues are the discounted dues for the
      whole term. The first-system rate is the tier's current first-system annual rate, the additional-system share is one,
      and the loyalty, trouble-free and protection bundle discounts are zero. The reinstatement gap is the calendar days from
      the lapsed term's last day, which is the day before the agreement's current term start, to the date of handling. Price
      lock rule: when the agreement carries a locked rate below the tier's current first-system annual rate and was first
      enrolled at least the lock tenure months before the date of handling, the first-system rate is the locked rate; when it
      carries such a locked rate and was first enrolled fewer months before, the first-system rate is the average of the
      locked rate and the current rate, rounded to the cent half up; otherwise it is the current rate. Additional-system share
      rule: when the member's most recently signed Harbison installation contract was signed fewer than the new-installation
      months before the date of handling, the share is the new-installation share; when it was signed at least the
      new-installation months but fewer than the recent-installation months before, the share is the recent-installation
      share; otherwise the share is one. Loyalty rule: an agreement in at least the enhanced loyalty term count of
      consecutive terms with no missed-visit fee charged within the 12 months before the date of handling takes the enhanced
      loyalty discount; one in at least the tier's loyalty term count that does not meet both enhanced conditions takes the
      tier's loyalty discount; any other agreement takes none. Trouble-free rule: a member with no repair parts or repair
      labor billed on service calls within the 24 months before the date of handling takes the trouble-free discount; one
      whose repair parts and labor billed in those months total less than the trouble-free threshold takes the low-repair
      discount; any other member takes none. Protection bundle rule: a member holding an active Harbison protection contract
      bought with its installation takes the installation-bundle discount; a member holding an active protection contract
      obtained any other way takes the other bundle discount; a member with no active protection contract takes none. Gap
      rule: an agreement whose reinstatement gap is more than the full-gap days and that is in at least the gap term count of
      consecutive terms pays the discounted dues multiplied by the whole calendar months counted as complete month-to-month
      steps from the date of handling that end on or before the term end, divided by twelve; one whose reinstatement gap is
      more than the partial-gap days and that does not meet that condition pays the discounted dues multiplied by the
      calendar days from the date of handling through the term end, both counted, divided by 365; any other agreement pays
      the discounted dues for the whole term; each prorated amount is rounded to the cent half up.
    prerequisite:
      - problem: plan_ext_reinstatement_fee
        kind: value_input
        gate: due_gap_days
        form: state
        policy_source: >-
          The dues of a reinstated term are fixed only after the agreement shows active status with a term starting the day
          after the lapsed term ended.
        condition: >-
          The agreement is active and its current term starts the day after the lapsed term's last day.
        resolved_by: reinstate_lapsed_agreement_6e8e1b28
        effect: >-
          The agreement's current term start and term end move to the reinstated term, so the reinstatement gap is counted
          back to the lapsed term's last day and the gap rule prorates the dues by the whole months left before the reinstated
          term's end.
      - problem: plan_ext_reinstated_rate_lock
        kind: value_input
        gate: due_first_rate
        form: action
        fallback_reason: >-
          Deciding the price lock writes only a new figure into the locked-rate field the agreement already carried in its
          lapsed term, so no record shows whether that figure is the old term's or the one decided for the reinstated term.
        policy_source: >-
          The dues of a reinstated term are not billed until the price lock for that term has been decided.
        condition: >-
          The agreement's locked rate is the rate decided for the reinstated term.
        resolved_by: set_reinstated_rate_lock_0c66ac3f
        effect: >-
          The locked rate the price lock rule reads changes from the lapsed term's figure to the figure decided for the
          reinstated term, which changes the first-system rate.
      - problem: plan_ext_missed_visit_fee
        kind: value_input
        gate: due_loyalty_pct
        form: state
        policy_source: >-
          The dues of a reinstated term are not fixed until the dues ledger carries a missed-visit fee for every visit
          forfeited in the lapsed term.
        condition: >-
          Every visit recorded as a no-show or late-cancellation forfeit in the lapsed term has a missed-appointment fee charge
          on the dues ledger.
        resolved_by: post_missed_visit_fee_325d3ccb
        effect: >-
          A missed-visit fee charged within the 12 months before the date of handling now stands on the ledger, so the loyalty
          rule moves the agreement from the enhanced loyalty discount to the tier's loyalty discount.
    cross_category:
      - category: install
        as: history
        reads: [install_ledger.line_type, install_ledger.posted_date]
        note: The additional-system share reads when the member's most recent Harbison installation contract was signed.
      - category: service
        as: history
        reads: [service_lines.line_type, service_lines.amount, service_lines.posted_date]
        note: The trouble-free discount reads the repair parts and labor billed on the member's service calls in 24 months.
      - category: warranty
        as: branch
        reads: [warranty_contracts.purchase_channel, warranty_contracts.status]
        note: The protection bundle discount reads how the member's active protection contract was obtained.
    compute:
      - due_enrolled_months: "MONTHS(F('enrolled_date'), NOW)"
      - due_first_rate: "F('locked_annual_rate') if (F('locked_annual_rate') < P('annual_dues_first_system_usd') and due_enrolled_months >= K('lock_tenure_months')) else (int((F('locked_annual_rate') + P('annual_dues_first_system_usd')) / 2 * 100 + 0.5 + 1e-9) / 100 if (F('locked_annual_rate') < P('annual_dues_first_system_usd') and due_enrolled_months < K('lock_tenure_months')) else P('annual_dues_first_system_usd'))"
      - due_contract_date: "XLATEST('install', 'install_ledger', 'posted_date', date_field='posted_date', line_type='contract_price')"
      - due_additional_share: "K('add_share_new') if (due_contract_date != None and MONTHS(due_contract_date, NOW) < K('install_new_months')) else (K('add_share_recent') if (due_contract_date != None and MONTHS(due_contract_date, NOW) < K('install_recent_months')) else K('add_share_standard'))"
      - due_gross: "due_first_rate + P('annual_dues_additional_system_usd') * due_additional_share * (F('systems_covered') - 1)"
      - due_fees_12m: "COUNT('plan_billing_entries', within_months=12, date_field='posted_date', event_type='plan_dues_charge', line_type='missed_appointment_fee')"
      - due_loyalty_pct: "K('loyalty_enhanced_pct') if (F('consecutive_terms') >= K('loyalty_enhanced_terms') and due_fees_12m == 0) else (P('loyalty_discount_pct') if F('consecutive_terms') >= P('loyalty_consecutive_terms_required') else 0)"
      - due_repairs_24m: "XSUM('service', 'service_lines', 'amount', within_months=24, date_field='posted_date', line_type='repair_parts') + XSUM('service', 'service_lines', 'amount', within_months=24, date_field='posted_date', line_type='repair_labor')"
      - due_trouble_free_pct: "K('trouble_free_none_pct') if due_repairs_24m == 0 else (K('trouble_free_low_pct') if due_repairs_24m < K('trouble_free_threshold_usd') else 0)"
      - due_protection_channel: "CFIELD('warranty', 'purchase_channel', status='active')"
      - due_bundle_pct: "K('bundle_with_install_pct') if due_protection_channel == 'with_installation' else (K('bundle_other_pct') if due_protection_channel != None else 0)"
      - due_discounted: "int(due_gross * (1 - (due_loyalty_pct + due_trouble_free_pct + due_bundle_pct) / 100) * 100 + 0.5 + 1e-9) / 100"
      - due_gap_days: "DAYS(F('term_start'), NOW) + 1"
      - due_term_dues: "int(due_discounted * MX(0, MONTHS(NOW, F('term_end'))) / 12 * 100 + 0.5 + 1e-9) / 100 if (due_gap_days > K('gap_full_days') and F('consecutive_terms') >= K('gap_terms')) else (int(due_discounted * MX(0, DAYS(NOW, F('term_end')) + 1) / 365 * 100 + 0.5 + 1e-9) / 100 if due_gap_days > K('gap_partial_days') else due_discounted)"
      - result: "due_term_dues"
    compute_basis:
      due_enrolled_months: "was first enrolled at least the lock tenure months before the date of handling"
      due_first_rate: "Price lock rule: when the agreement carries a locked rate below the tier's current first-system annual rate and was first enrolled at least the lock tenure months before the date of handling, the first-system rate is the locked rate; when it carries such a locked rate and was first enrolled fewer months before, the first-system rate is the average of the locked rate and the current rate, rounded to the cent half up; otherwise it is the current rate."
      due_contract_date: "when the member's most recently signed Harbison installation contract was signed"
      due_additional_share: "Additional-system share rule: when the member's most recently signed Harbison installation contract was signed fewer than the new-installation months before the date of handling, the share is the new-installation share; when it was signed at least the new-installation months but fewer than the recent-installation months before, the share is the recent-installation share; otherwise the share is one."
      due_gross: "The gross dues are the first-system rate plus the tier's additional-system annual rate multiplied by the additional-system share for each enrolled system beyond the first."
      due_fees_12m: "with no missed-visit fee charged within the 12 months before the date of handling"
      due_loyalty_pct: "Loyalty rule: an agreement in at least the enhanced loyalty term count of consecutive terms with no missed-visit fee charged within the 12 months before the date of handling takes the enhanced loyalty discount; one in at least the tier's loyalty term count that does not meet both enhanced conditions takes the tier's loyalty discount; any other agreement takes none."
      due_repairs_24m: "a member with no repair parts or repair labor billed on service calls within the 24 months before the date of handling"
      due_trouble_free_pct: "Trouble-free rule: a member with no repair parts or repair labor billed on service calls within the 24 months before the date of handling takes the trouble-free discount; one whose repair parts and labor billed in those months total less than the trouble-free threshold takes the low-repair discount; any other member takes none."
      due_protection_channel: "a member holding an active Harbison protection contract bought with its installation"
      due_bundle_pct: "Protection bundle rule: a member holding an active Harbison protection contract bought with its installation takes the installation-bundle discount; a member holding an active protection contract obtained any other way takes the other bundle discount; a member with no active protection contract takes none."
      due_discounted: "The dues discount is the loyalty discount, the trouble-free discount and the protection bundle discount added together into one percentage, taken once off the gross dues; the discounted dues are rounded to the cent half up."
      due_gap_days: "The reinstatement gap is the calendar days from the lapsed term's last day, which is the day before the agreement's current term start, to the date of handling."
      due_term_dues: "Gap rule: an agreement whose reinstatement gap is more than the full-gap days and that is in at least the gap term count of consecutive terms pays the discounted dues multiplied by the whole calendar months counted as complete month-to-month steps from the date of handling that end on or before the term end, divided by twelve; one whose reinstatement gap is more than the partial-gap days and that does not meet that condition pays the discounted dues multiplied by the calendar days from the date of handling through the term end, both counted, divided by 365; any other agreement pays the discounted dues for the whole term; each prorated amount is rounded to the cent half up."
      result: "and the amount billed follows the gap rule"
    factors:
      - id: price_lock_application
        effect: method
        decides: due_first_rate
        bindings: [due_enrolled_months, due_first_rate]
        ladder:
          - when: "a locked rate below the current first-system rate and first enrolled at least the lock tenure months before"
            method: "the first-system rate is the locked rate"
          - when: "a locked rate below the current first-system rate and first enrolled fewer months before"
            method: "the first-system rate is the average of the locked rate and the current rate, rounded to the cent half up"
          - when: "otherwise (no locked rate below the current rate)"
            method: "the first-system rate is the tier's current first-system annual rate"
        baseline:
          due_first_rate: "P('annual_dues_first_system_usd')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: new_installation_share
        effect: parameter
        decides: due_additional_share
        bindings: [due_contract_date, due_additional_share]
        ladder:
          - when: "the member's most recently signed Harbison installation contract was signed fewer than the new-installation months before the date of handling"
            value: "K('add_share_new')"
          - when: "it was signed at least the new-installation months but fewer than the recent-installation months before"
            value: "K('add_share_recent')"
          - when: "otherwise"
            value: "K('add_share_standard')"
        baseline:
          due_additional_share: "K('add_share_standard')"
        evidence: [cross_category, date]
        cross_difficulty: install
      - id: appointment_loyalty
        effect: parameter
        decides: due_loyalty_pct
        bindings: [due_fees_12m, due_loyalty_pct]
        ladder:
          - when: "at least the enhanced loyalty term count of consecutive terms and no missed-visit fee charged within the 12 months before the date of handling"
            value: "K('loyalty_enhanced_pct')"
          - when: "at least the tier's loyalty term count of consecutive terms, not meeting both enhanced conditions"
            value: "P('loyalty_discount_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          due_loyalty_pct: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: trouble_free_discount
        effect: parameter
        decides: due_trouble_free_pct
        bindings: [due_repairs_24m, due_trouble_free_pct]
        ladder:
          - when: "no repair parts or repair labor billed on the member's service calls within the 24 months before the date of handling"
            value: "K('trouble_free_none_pct')"
          - when: "repair parts and labor billed in those months total less than the trouble-free threshold"
            value: "K('trouble_free_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          due_trouble_free_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: service
      - id: protection_bundle_discount
        effect: parameter
        decides: due_bundle_pct
        bindings: [due_protection_channel, due_bundle_pct]
        ladder:
          - when: "an active Harbison protection contract bought with its installation"
            value: "K('bundle_with_install_pct')"
          - when: "an active protection contract obtained any other way"
            value: "K('bundle_other_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          due_bundle_pct: "0"
        evidence: [cross_category]
        cross_difficulty: warranty
      - id: lapse_gap_proration
        effect: method
        decides: due_term_dues
        bindings: [due_gap_days, due_term_dues]
        ladder:
          - when: "a reinstatement gap of more than the full-gap days and at least the gap term count of consecutive terms"
            method: "the discounted dues times the whole calendar months left to the term end, divided by twelve, rounded to the cent half up"
          - when: "a reinstatement gap of more than the partial-gap days, not meeting the first condition"
            method: "the discounted dues times the calendar days from the date of handling through the term end, both counted, divided by 365, rounded to the cent half up"
          - when: "otherwise"
            method: "the discounted dues for the whole term"
        baseline:
          due_term_dues: "due_discounted"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The term dues are worked out in this order. The gross dues are the first-system rate plus the tier's additional-system
        annual rate multiplied by the additional-system share for each enrolled system beyond the first. The dues discount is
        the loyalty discount, the trouble-free discount and the protection bundle discount added together into one
        percentage, taken once off the gross dues; the discounted dues are rounded to the cent half up. The term dues are the
        discounted dues for the whole term. The first-system rate is the tier's current first-system annual rate, the
        additional-system share is one, and the loyalty, trouble-free and protection bundle discounts are zero.
      params: [annual_dues_first_system_usd, annual_dues_additional_system_usd, add_share_standard]
    inputs:
      history:
        - {table: plan_billing_entries, aggregate: count, field: line_type, within_months: 12, filters: {line_type: missed_appointment_fee}}
        - {category: install, table: install_ledger, aggregate: latest, field: posted_date, filters: {line_type: contract_price}}
        - {category: service, table: service_lines, aggregate: sum, field: amount, within_months: 24, filters: {line_type: repair_parts}}
      cross_category: [install, service, warranty]
