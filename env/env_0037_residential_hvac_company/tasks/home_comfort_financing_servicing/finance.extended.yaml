    rf_paid12: >-
      The returned-payment payment-record count follows how the borrower pays: when autopay is enrolled it counts
      the autopay drafts posted less than record_window_months whole months before the date of handling, less the
      returned payments posted in that time; when autopay is not enrolled but autopay drafts were posted in that
      time, the borrower having just left autopay, it counts only the payments other than autopay drafts posted
      in that time, less the returned payments; otherwise it counts every payment posted in that time, less the
      returned payments.
    rf_record_pct: >-
      The returned-payment payment-record relief is record_relief_full_pct percent when the returned-payment payment-record
      count is at least record_payments_full, record_relief_mid_pct percent when it is at least record_payments_mid
      but below record_payments_full, and zero when it is below record_payments_mid.
    rf_relief_pct: >-
      The returned-payment relief percentage is the prompt-replacement relief, the returned-payment member relief,
      the returned-payment account-age relief and the returned-payment payment-record relief added together, and
      the scheduled returned-payment fee is reduced once by that total; the reliefs never act one after another.
    result: >-
