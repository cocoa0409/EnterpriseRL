- id: finance_ext_post_promo_interest
  base_policy_refs:
  - finance_payment_terms
  - finance_deferred_interest
  - finance_late_and_returned_fees
  overwrite:
  - base_policy: finance_deferred_interest
    superseded_clause: >-
      From the day after promo_end_date any remaining balance on a promotional plan accrues interest at post_promo_apr_pct,
      posted monthly as interest.
    replaced_by: >-
      The post-promotional rate is the plan's post_promo_apr_pct reduced once by the post-promotional relief percentage,
      which is the post-promotional member relief, account-age relief, payment-record relief and leftover relief
      added together; the reliefs never act one after another.
  - base_policy: finance_deferred_interest
    superseded_clause: >-
      On equal-payment plans no interest is deferred, and the equal_payment_promo_balance_rule applies: a balance
      left at promo end simply starts accruing at post_promo_apr_pct.
    replaced_by: >-
      The post-promotional rate is the plan's post_promo_apr_pct reduced once by the post-promotional relief percentage,
      which is the post-promotional member relief, account-age relief, payment-record relief and leftover relief
      added together; the reliefs never act one after another.
  trigger: state_due
  subject:
  - finance_statement_charge
  computes: amount
  target_tool: post_post_promo_interest_b0f5a17d
  params:
    member_terms_long: 5
    member_relief_long_pct: 15
    member_relief_short_pct: 8
    long_account_months: 36
    mid_account_months: 12
    age_relief_long_pct: 10
    age_relief_mid_pct: 5
    record_window_months: 12
    record_payments_full: 12
    record_payments_mid: 6
    record_relief_full_pct: 10
    record_relief_mid_pct: 5
    leftover_relief_one_pct: 20
    leftover_relief_three_pct: 10
  rule: >-
    On a promotional plan whose promotion has ended, the balance left accrues post-promotional interest, posted
    once for each statement period as an interest charge on the first day after that period's statement closes.
    The post-promotional interest charge for a statement period is worked out only after the account carries the
    late fee owed for that same period whenever its installment stayed unpaid past its grace period, so that the
    interest base is measured on the period's closed fee position. The post-promotional interest charge for a statement
    period is the post-promotional interest base, multiplied by the post-promotional rate and by the number of accrual
    days, divided by 100 and by 365, and rounded to the cent half up only at the end. The accrual days run from
    the day after promo_end_date when no interest charge has yet posted on the account, and otherwise from the day
    the previous interest charge posted, up to but not including the day this charge posts. As the standard method,
    the post-promotional interest base is the account_balance on the day the charge posts, and the post-promotional
    rate is the plan's post_promo_apr_pct. The post-promotional interest base leaves out charges that are not principal:
    where the most recent payment on the account was returned, the base is the account_balance less the most recent
    interest charge and less every late fee and returned-payment fee posted less than one whole month before the
    date of handling; where the most recent payment was not returned and such fees were posted in that month, the
    base is the account_balance less those fees; otherwise the base is the account_balance; a base below zero counts
    as zero. The post-promotional member relief is member_relief_long_pct percent when the borrower's Comfort Club
    agreement is active and has run at least member_terms_long consecutive terms, member_relief_short_pct percent
    when that agreement is active and has run fewer than member_terms_long consecutive terms, and zero when the
    borrower holds no active Comfort Club agreement. The post-promotional account-age relief is age_relief_long_pct
    percent when the account funded at least long_account_months whole months before the date of handling, age_relief_mid_pct
    percent when it funded at least mid_account_months but fewer than long_account_months whole months before, and
    zero when it funded fewer than mid_account_months whole months before. The post-promotional payment-record relief
    counts the payments posted less than record_window_months whole months before the date of handling less the
    returned payments posted in that time: it is record_relief_full_pct percent when that count is at least record_payments_full,
    record_relief_mid_pct percent when the count is at least record_payments_mid but below record_payments_full,
    and zero when the count is below record_payments_mid. The post-promotional leftover relief measures the amount_financed
    less every payment that stood, a payment standing when it was not returned, in units of the account's monthly_payment:
    it is leftover_relief_one_pct percent when that measure is at most one, leftover_relief_three_pct percent when
    it is above one but at most three, and zero when it is above three. The post-promotional rate is the plan's
    post_promo_apr_pct reduced once by the post-promotional relief percentage, which is the post-promotional member
    relief, account-age relief, payment-record relief and leftover relief added together; the reliefs never act
    one after another.
  prerequisite:
  - problem: finance_ext_late_fee_schedule
    kind: state_gate
    gate: finance_transactions.line_type
    form: state
    policy_source: >-
      The post-promotional interest charge for a statement period is worked out only after the account carries the
      late fee owed for that same period whenever its installment stayed unpaid past its grace period, so that the
      interest base is measured on the period's closed fee position.
    condition: >-
      finance_transactions carries a late_fee entry for the statement period being closed whenever that period's
      required payment was still unpaid more than late_fee_grace_days calendar days after its due date.
    resolved_by: post_late_fee_ce58c754
    effect: >-
      With the period's late fee on the account, the interest base is taken on the closed fee position: the fee
      posted this month is one of the charges the base leaves out, so the base ladder is read on the world in which
      the period's fees stand.
  cross_category:
  - category: plan
    as: branch
    reads:
    - status
    - consecutive_terms
    note: >-
      The post-promotional member relief tier is decided from the borrower's Comfort Club agreement: whether it
      is active and how many consecutive terms it has run.
  compute:
  - ip_promo_days: DAYS(F('promo_end_date'), NOW)
  - ip_int_count: COUNT('finance_transactions', line_type='interest')
  - ip_last_int: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='interest')
  - ip_days: (ip_promo_days - 1) if ip_int_count == 0 else DAYS(ip_last_int, NOW)
  - ip_bal: F('account_balance')
  - ip_fees_recent: >-
      SUM('finance_transactions', 'amount', within_months=1, date_field='posted_date', line_type='late_fee') + SUM('finance_transactions',
      'amount', within_months=1, date_field='posted_date', line_type='returned_payment_fee')
  - ip_ret_count: COUNT('finance_transactions', line_type='payment_returned')
  - ip_last_pay: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='payment')
  - ip_last_ret: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='payment_returned')
  - ip_pay_returned: ip_ret_count > 0 and DAYS(ip_last_pay, ip_last_ret) >= 0
  - ip_last_int_amt: >-
      LATEST('finance_transactions', 'amount', date_field='posted_date', line_type='interest') if ip_int_count >
      0 else 0
  - ip_base: >-
      MX(0, ip_bal - ip_fees_recent - ip_last_int_amt) if ip_pay_returned else (MX(0, ip_bal - ip_fees_recent) if
      ip_fees_recent > 0 else MX(0, ip_bal))
  - ip_cc_status: CFIELD('plan', 'status', status='active')
  - ip_cc_terms: CFIELD('plan', 'consecutive_terms', status='active')
  - ip_member_pct: >-
      K('member_relief_long_pct') if (ip_cc_status == 'active' and ip_cc_terms >= K('member_terms_long')) else (K('member_relief_short_pct')
      if (ip_cc_status == 'active' and ip_cc_terms < K('member_terms_long')) else 0)
  - ip_age_months: MONTHS(F('funded_date'), NOW)
  - ip_age_pct: >-
      K('age_relief_long_pct') if ip_age_months >= K('long_account_months') else (K('age_relief_mid_pct') if ip_age_months
      >= K('mid_account_months') else 0)
  - ip_paid_count: >-
      COUNT('finance_transactions', within_months=K('record_window_months'), date_field='posted_date', line_type='payment')
      - COUNT('finance_transactions', within_months=K('record_window_months'), date_field='posted_date', line_type='payment_returned')
  - ip_record_pct: >-
      K('record_relief_full_pct') if ip_paid_count >= K('record_payments_full') else (K('record_relief_mid_pct')
      if ip_paid_count >= K('record_payments_mid') else 0)
  - ip_stood_total: >-
      SUM('finance_transactions', 'amount', line_type='payment') - SUM('finance_transactions', 'amount', line_type='payment_returned')
  - ip_left_units: (F('amount_financed') - ip_stood_total) / F('monthly_payment')
  - ip_left_pct: >-
      K('leftover_relief_one_pct') if ip_left_units <= 1 else (K('leftover_relief_three_pct') if ip_left_units <=
      3 else 0)
  - ip_relief_pct: ip_member_pct + ip_age_pct + ip_record_pct + ip_left_pct
  - ip_rate: P('post_promo_apr_pct') * (100 - ip_relief_pct) / 100
  - result: RND(ip_base * ip_rate / 100 / 365 * ip_days, 2)
  compute_basis:
