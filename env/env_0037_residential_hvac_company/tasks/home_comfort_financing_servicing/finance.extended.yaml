  rule: >-
    Each returned payment is charged one returned-payment fee naming that payment, posted on the statement of the
    period in which the payment came back, on the first day after that period's statement closes or on the day the
    fee is fixed if later. The returned-payment fee is fixed only after a replacement payment has posted for the
    returned installment or the installment's grace period has run out. The returned-payment fee is the scheduled
    returned-payment fee reduced once by the returned-payment relief percentage, never below zero, and rounded to
    the cent half up only at the end. As the standard method, the scheduled returned-payment fee is the plan's returned_payment_fee_usd
    and the returned-payment relief percentage is zero. The scheduled returned-payment fee steps down with the number
    of other payments returned within the returned-payment lookback, the payment this fee concerns not counted:
    when none it is first_return_fee_usd, when exactly one it is second_return_fee_usd, and when two or more it
    is the plan's returned_payment_fee_usd. The returned-payment lookback covers payments returned less than standard_lookback_months
    whole months before the date of handling. The prompt-replacement relief is prompt_relief_short_pct percent when
    the most recent payment posted on the day the most recent returned payment came back or no more than prompt_days_short
    days after it, prompt_relief_long_pct percent when it posted more than prompt_days_short but no more than prompt_days_long
    days after it, and zero when no payment has posted since the return or it posted later. The returned-payment
    member relief is member_relief_long_pct percent when the borrower's Comfort Club agreement is active and has
    run at least member_terms_long consecutive terms, member_relief_short_pct percent when that agreement is active
    and has run fewer than member_terms_long consecutive terms, and zero when the borrower holds no active Comfort
    Club agreement. The returned-payment account-age relief is age_relief_long_pct percent when the account funded
    at least long_account_months whole months before the date of handling, age_relief_mid_pct percent when it funded
    at least mid_account_months but fewer than long_account_months whole months before, and zero when it funded
    fewer than mid_account_months whole months before. The returned-payment payment-record count follows how the
    borrower pays: when autopay is enrolled it counts the autopay drafts posted less than record_window_months whole
    months before the date of handling, less the returned payments posted in that time; when autopay is not enrolled
    but autopay drafts were posted in that time, the borrower having just left autopay, it counts only the payments
    other than autopay drafts posted in that time, less the returned payments; otherwise it counts every payment
    posted in that time, less the returned payments. The returned-payment payment-record relief is record_relief_full_pct
    percent when the returned-payment payment-record count is at least record_payments_full, record_relief_mid_pct
    percent when it is at least record_payments_mid but below record_payments_full, and zero when it is below record_payments_mid.
    The returned-payment relief percentage is the prompt-replacement relief, the returned-payment member relief,
    the returned-payment account-age relief and the returned-payment payment-record relief added together, and the
    scheduled returned-payment fee is reduced once by that total; the reliefs never act one after another.
  prerequisite:
  - problem: finance_ext_makeup_payment
    kind: value_input
    gate: rf_gap
    form: state
    policy_source: >-
      The returned-payment fee is fixed only after a replacement payment has posted for the returned installment
      or the installment's grace period has run out.
    condition: >-
      finance_transactions carries a payment posted on or after the most recent payment_returned entry, or the returned
      installment's due date is more than late_fee_grace_days calendar days past.
    resolved_by: submit_makeup_payment_e9bd505b
    effect: >-
      The make-up payment becomes the most recent payment, so rf_gap becomes the days from the return to it and
      the prompt-replacement relief applies.
  cross_category:
  - category: plan
    as: branch
    reads:
    - status
    - consecutive_terms
    note: >-
      The returned-payment member relief tier is decided from the borrower's Comfort Club agreement: whether it
      is active and how many consecutive terms it has run.
  compute:
  - rf_prior: >-
      MX(0, COUNT('finance_transactions', within_months=K('standard_lookback_months'), date_field='posted_date',
      line_type='payment_returned') - 1)
  - rf_scheduled: >-
      K('first_return_fee_usd') if rf_prior == 0 else (K('second_return_fee_usd') if rf_prior == 1 else P('returned_payment_fee_usd'))
  - rf_last_ret: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='payment_returned')
  - rf_last_pay: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='payment')
  - rf_gap: DAYS(rf_last_ret, rf_last_pay)
  - rf_prompt_pct: >-
      K('prompt_relief_short_pct') if (rf_gap >= 0 and rf_gap <= K('prompt_days_short')) else (K('prompt_relief_long_pct')
      if (rf_gap > K('prompt_days_short') and rf_gap <= K('prompt_days_long')) else 0)
  - rf_cc_status: CFIELD('plan', 'status', status='active')
  - rf_cc_terms: CFIELD('plan', 'consecutive_terms', status='active')
  - rf_member_pct: >-
      K('member_relief_long_pct') if (rf_cc_status == 'active' and rf_cc_terms >= K('member_terms_long')) else (K('member_relief_short_pct')
      if (rf_cc_status == 'active' and rf_cc_terms < K('member_terms_long')) else 0)
  - rf_age_months: MONTHS(F('funded_date'), NOW)
  - rf_age_pct: >-
      K('age_relief_long_pct') if rf_age_months >= K('long_account_months') else (K('age_relief_mid_pct') if rf_age_months
      >= K('mid_account_months') else 0)
  - rf_rec_autopay_on: F('autopay_enrolled')
  - rf_rec_drafts: >-
      COUNT('finance_transactions', within_months=K('record_window_months'), date_field='posted_date', line_type='payment',
      payment_method='autopay_ach')
  - rf_rec_all: >-
      COUNT('finance_transactions', within_months=K('record_window_months'), date_field='posted_date', line_type='payment')
  - rf_paid_selected: >-
      rf_rec_drafts if rf_rec_autopay_on == True else ((rf_rec_all - rf_rec_drafts) if (rf_rec_autopay_on != True
      and rf_rec_drafts > 0) else rf_rec_all)
  - rf_rec_returns: >-
      COUNT('finance_transactions', within_months=K('record_window_months'), date_field='posted_date', line_type='payment_returned')
  - rf_paid12: rf_paid_selected - rf_rec_returns
  - rf_record_pct: >-
      K('record_relief_full_pct') if rf_paid12 >= K('record_payments_full') else (K('record_relief_mid_pct') if
      rf_paid12 >= K('record_payments_mid') else 0)
  - rf_relief_pct: rf_prompt_pct + rf_member_pct + rf_age_pct + rf_record_pct
  - result: RND(MX(0, rf_scheduled * (100 - rf_relief_pct) / 100), 2)
  compute_basis:
    rf_prior: >-
      The returned-payment lookback covers payments returned less than standard_lookback_months whole months before
      the date of handling.
    rf_scheduled: >-
      The scheduled returned-payment fee steps down with the number of other payments returned within the returned-payment
      lookback, the payment this fee concerns not counted: when none it is first_return_fee_usd, when exactly one
      it is second_return_fee_usd, and when two or more it is the plan's returned_payment_fee_usd.
    rf_last_ret: >-
      The prompt-replacement relief is prompt_relief_short_pct percent when the most recent payment posted on the
      day the most recent returned payment came back or no more than prompt_days_short days after it, prompt_relief_long_pct
      percent when it posted more than prompt_days_short but no more than prompt_days_long days after it, and zero
      when no payment has posted since the return or it posted later.
    rf_last_pay: >-
      The prompt-replacement relief is prompt_relief_short_pct percent when the most recent payment posted on the
      day the most recent returned payment came back or no more than prompt_days_short days after it, prompt_relief_long_pct
      percent when it posted more than prompt_days_short but no more than prompt_days_long days after it, and zero
      when no payment has posted since the return or it posted later.
    rf_gap: >-
      The prompt-replacement relief is prompt_relief_short_pct percent when the most recent payment posted on the
      day the most recent returned payment came back or no more than prompt_days_short days after it, prompt_relief_long_pct
      percent when it posted more than prompt_days_short but no more than prompt_days_long days after it, and zero
      when no payment has posted since the return or it posted later.
    rf_prompt_pct: >-
      The prompt-replacement relief is prompt_relief_short_pct percent when the most recent payment posted on the
      day the most recent returned payment came back or no more than prompt_days_short days after it, prompt_relief_long_pct
      percent when it posted more than prompt_days_short but no more than prompt_days_long days after it, and zero
      when no payment has posted since the return or it posted later.
    rf_cc_status: >-
      The returned-payment member relief is member_relief_long_pct percent when the borrower's Comfort Club agreement
      is active and has run at least member_terms_long consecutive terms, member_relief_short_pct percent when that
      agreement is active and has run fewer than member_terms_long consecutive terms, and zero when the borrower
      holds no active Comfort Club agreement.
    rf_cc_terms: >-
      The returned-payment member relief is member_relief_long_pct percent when the borrower's Comfort Club agreement
      is active and has run at least member_terms_long consecutive terms, member_relief_short_pct percent when that
      agreement is active and has run fewer than member_terms_long consecutive terms, and zero when the borrower
      holds no active Comfort Club agreement.
    rf_member_pct: >-
      The returned-payment member relief is member_relief_long_pct percent when the borrower's Comfort Club agreement
      is active and has run at least member_terms_long consecutive terms, member_relief_short_pct percent when that
      agreement is active and has run fewer than member_terms_long consecutive terms, and zero when the borrower
      holds no active Comfort Club agreement.
    rf_age_months: >-
      The returned-payment account-age relief is age_relief_long_pct percent when the account funded at least long_account_months
      whole months before the date of handling, age_relief_mid_pct percent when it funded at least mid_account_months
      but fewer than long_account_months whole months before, and zero when it funded fewer than mid_account_months
      whole months before.
    rf_age_pct: >-
      The returned-payment account-age relief is age_relief_long_pct percent when the account funded at least long_account_months
      whole months before the date of handling, age_relief_mid_pct percent when it funded at least mid_account_months
      but fewer than long_account_months whole months before, and zero when it funded fewer than mid_account_months
      whole months before.
    rf_rec_autopay_on: >-
      The returned-payment payment-record count follows how the borrower pays: when autopay is enrolled it counts
      the autopay drafts posted less than record_window_months whole months before the date of handling, less the
      returned payments posted in that time; when autopay is not enrolled but autopay drafts were posted in that
      time, the borrower having just left autopay, it counts only the payments other than autopay drafts posted
      in that time, less the returned payments; otherwise it counts every payment posted in that time, less the
      returned payments.
    rf_rec_drafts: >-
      The returned-payment payment-record count follows how the borrower pays: when autopay is enrolled it counts
      the autopay drafts posted less than record_window_months whole months before the date of handling, less the
      returned payments posted in that time; when autopay is not enrolled but autopay drafts were posted in that
      time, the borrower having just left autopay, it counts only the payments other than autopay drafts posted
      in that time, less the returned payments; otherwise it counts every payment posted in that time, less the
      returned payments.
    rf_rec_all: >-
      The returned-payment payment-record count follows how the borrower pays: when autopay is enrolled it counts
      the autopay drafts posted less than record_window_months whole months before the date of handling, less the
      returned payments posted in that time; when autopay is not enrolled but autopay drafts were posted in that
      time, the borrower having just left autopay, it counts only the payments other than autopay drafts posted
      in that time, less the returned payments; otherwise it counts every payment posted in that time, less the
      returned payments.
    rf_paid_selected: >-
      The returned-payment payment-record count follows how the borrower pays: when autopay is enrolled it counts
      the autopay drafts posted less than record_window_months whole months before the date of handling, less the
      returned payments posted in that time; when autopay is not enrolled but autopay drafts were posted in that
      time, the borrower having just left autopay, it counts only the payments other than autopay drafts posted
      in that time, less the returned payments; otherwise it counts every payment posted in that time, less the
      returned payments.
    rf_rec_returns: >-
      The returned-payment payment-record count follows how the borrower pays: when autopay is enrolled it counts
      the autopay drafts posted less than record_window_months whole months before the date of handling, less the
      returned payments posted in that time; when autopay is not enrolled but autopay drafts were posted in that
      time, the borrower having just left autopay, it counts only the payments other than autopay drafts posted
