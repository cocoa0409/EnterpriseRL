    mu_pull_last_pay: >-
      The pull-forward share of the next installment is pull_share_full_pct percent when the most recent payment
      was returned and autopay is still enrolled, pull_share_half_pct percent when the most recent payment was returned
      and autopay is not enrolled, and zero when the most recent payment was not returned.
    mu_pull_last_ret: >-
      The pull-forward share of the next installment is pull_share_full_pct percent when the most recent payment
      was returned and autopay is still enrolled, pull_share_half_pct percent when the most recent payment was returned
