      The post-promotional member relief is member_relief_long_pct percent when the borrower's Comfort Club agreement
      is active and has run at least member_terms_long consecutive terms, member_relief_short_pct percent when that
      agreement is active and has run fewer than member_terms_long consecutive terms, and zero when the borrower
      holds no active Comfort Club agreement.
    ip_age_months: >-
      The post-promotional account-age relief is age_relief_long_pct percent when the account funded at least long_account_months
      whole months before the date of handling, age_relief_mid_pct percent when it funded at least mid_account_months
      but fewer than long_account_months whole months before, and zero when it funded fewer than mid_account_months
      whole months before.
    ip_age_pct: >-
      The post-promotional account-age relief is age_relief_long_pct percent when the account funded at least long_account_months
      whole months before the date of handling, age_relief_mid_pct percent when it funded at least mid_account_months
      but fewer than long_account_months whole months before, and zero when it funded fewer than mid_account_months
      whole months before.
    ip_paid_count: >-
      The post-promotional payment-record relief counts the payments posted less than record_window_months whole
      months before the date of handling less the returned payments posted in that time: it is record_relief_full_pct
      percent when that count is at least record_payments_full, record_relief_mid_pct percent when the count is
      at least record_payments_mid but below record_payments_full, and zero when the count is below record_payments_mid.
    ip_record_pct: >-
      The post-promotional payment-record relief counts the payments posted less than record_window_months whole
      months before the date of handling less the returned payments posted in that time: it is record_relief_full_pct
      percent when that count is at least record_payments_full, record_relief_mid_pct percent when the count is
      at least record_payments_mid but below record_payments_full, and zero when the count is below record_payments_mid.
    ip_stood_total: >-
      The post-promotional leftover relief measures the amount_financed less every payment that stood, a payment
      standing when it was not returned, in units of the account's monthly_payment: it is leftover_relief_one_pct
      percent when that measure is at most one, leftover_relief_three_pct percent when it is above one but at most
      three, and zero when it is above three.
    ip_left_units: >-
      The post-promotional leftover relief measures the amount_financed less every payment that stood, a payment
      standing when it was not returned, in units of the account's monthly_payment: it is leftover_relief_one_pct
      percent when that measure is at most one, leftover_relief_three_pct percent when it is above one but at most
      three, and zero when it is above three.
    ip_left_pct: >-
      The post-promotional leftover relief measures the amount_financed less every payment that stood, a payment
      standing when it was not returned, in units of the account's monthly_payment: it is leftover_relief_one_pct
      percent when that measure is at most one, leftover_relief_three_pct percent when it is above one but at most
      three, and zero when it is above three.
    ip_relief_pct: >-
      The post-promotional rate is the plan's post_promo_apr_pct reduced once by the post-promotional relief percentage,
      which is the post-promotional member relief, account-age relief, payment-record relief and leftover relief
      added together; the reliefs never act one after another.
    ip_rate: >-
      The post-promotional rate is the plan's post_promo_apr_pct reduced once by the post-promotional relief percentage,
      which is the post-promotional member relief, account-age relief, payment-record relief and leftover relief
      added together; the reliefs never act one after another.
    result: >-
      The post-promotional interest charge for a statement period is the post-promotional interest base, multiplied
      by the post-promotional rate and by the number of accrual days, divided by 100 and by 365, and rounded to
      the cent half up only at the end.
  factors:
  - id: post_promo_interest_base
    effect: method
    decides: ip_base
    bindings:
    - ip_bal
    - ip_fees_recent
    - ip_ret_count
    - ip_last_pay
    - ip_last_ret
    - ip_pay_returned
    - ip_last_int_amt
    - ip_base
    ladder:
    - when: the most recent payment on the account was returned
      method: >-
        account_balance less the most recent interest charge and less the late fees and returned-payment fees posted
        less than one whole month before the date of handling
    - when: >-
        the most recent payment was not returned and late fees or returned-payment fees were posted less than one
        whole month before the date of handling
      method: account_balance less those fees
    - when: otherwise
      method: account_balance as it stands
    baseline:
      ip_base: ip_bal
    evidence:
    - history
    cross_difficulty: null
  - id: post_promo_member_relief
    effect: parameter
    decides: ip_member_pct
    bindings:
    - ip_cc_status
    - ip_cc_terms
    - ip_member_pct
    ladder:
    - when: >-
        the Comfort Club agreement is active and has run at least member_terms_long consecutive terms
      value: K('member_relief_long_pct')
    - when: >-
        the Comfort Club agreement is active and has run fewer than member_terms_long consecutive terms
      value: K('member_relief_short_pct')
    - when: otherwise (no active Comfort Club agreement)
      value: '0'
    baseline:
      ip_member_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: plan
  - id: post_promo_account_age_relief
    effect: parameter
    decides: ip_age_pct
    bindings:
    - ip_age_months
    - ip_age_pct
    ladder:
    - when: the account funded at least long_account_months whole months before the date of handling
      value: K('age_relief_long_pct')
    - when: >-
        the account funded at least mid_account_months but fewer than long_account_months whole months before
      value: K('age_relief_mid_pct')
    - when: otherwise (funded fewer than mid_account_months whole months before)
      value: '0'
    baseline:
      ip_age_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: post_promo_payment_record_relief
    effect: parameter
    decides: ip_record_pct
    bindings:
    - ip_paid_count
    - ip_record_pct
    ladder:
    - when: >-
        payments less returned payments in the record_window_months window number at least record_payments_full
      value: K('record_relief_full_pct')
    - when: that count is at least record_payments_mid but below record_payments_full
      value: K('record_relief_mid_pct')
    - when: otherwise (below record_payments_mid)
      value: '0'
    baseline:
      ip_record_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: post_promo_leftover_relief
    effect: parameter
    decides: ip_left_pct
    bindings:
    - ip_stood_total
    - ip_left_units
    - ip_left_pct
    ladder:
    - when: amount_financed less the payments that stood is at most one monthly_payment
      value: K('leftover_relief_one_pct')
    - when: it is above one but at most three monthly_payment amounts
      value: K('leftover_relief_three_pct')
    - when: otherwise (above three)
      value: '0'
    baseline:
      ip_left_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The post-promotional interest charge for a statement period is the post-promotional interest base, multiplied
      by the post-promotional rate and by the number of accrual days, divided by 100 and by 365, and rounded to
      the cent half up only at the end. The accrual days run from the day after promo_end_date when no interest
      charge has yet posted on the account, and otherwise from the day the previous interest charge posted, up to
      but not including the day this charge posts. As the standard method, the post-promotional interest base is
      the account_balance on the day the charge posts, and the post-promotional rate is the plan's post_promo_apr_pct.
    params:
    - post_promo_apr_pct
  inputs:
    history:
    - table: finance_transactions
      aggregate: latest
      field: posted_date
      within_months: null
      filters:
        line_type: interest
    - table: finance_transactions
      aggregate: sum
      field: amount
      within_months: 1
      filters:
        line_type: late_fee
    - table: finance_transactions
      aggregate: sum
      field: amount
      within_months: 1
      filters:
        line_type: returned_payment_fee
    - table: finance_transactions
      aggregate: count
      field: finance_txn_id
      within_months: 12
      filters:
        line_type: payment
    - table: finance_transactions
      aggregate: sum
      field: amount
      within_months: null
      filters:
        line_type: payment
    - table: finance_transactions
      aggregate: sum
      field: amount
      within_months: null
      filters:
        line_type: payment_returned
    cross_category:
    - plan
- id: finance_ext_payoff_figure
  base_policy_refs:
  - finance_payment_terms
  - finance_payoff_rules
  - finance_servicing_changes
  overwrite:
  - base_policy: finance_payoff_rules
    superseded_clause: >-
      A payoff quote is the balance on the quote date plus interest accruing daily to the payoff date
    replaced_by: >-
      The payoff figure is the account_balance on the day of payoff plus the payoff per-diem interest, rounded to
      the cent half up only at the end.
  - base_policy: finance_servicing_changes
    superseded_clause: >-
      while autopay is enrolled on a plan whose autopay_apr_discount_pct is above 0.00, the APR is reduced by that
      many percentage points from the next statement and restored when autopay ends
    replaced_by: >-
      The payoff per-diem rate starts from the rate the balance is accruing at: the plan's post_promo_apr_pct when
      the plan has a promotional period and promo_end_date has passed; the plan's apr_pct less autopay_apr_discount_pct
      when no promotional period has ended, autopay is enrolled and no payment was returned less than lookback_months
      whole months before the day of payoff; the plan's apr_pct less probation_share_pct percent of autopay_apr_discount_pct
      when no promotional period has ended, autopay is enrolled and exactly one payment was returned in that time;
      and the plan's apr_pct in every other case.
  trigger: on_request
  subject:
  - finance_payment
  - finance_payoff
  computes: amount
  target_tool: submit_payoff_payment_45ecd350
  params:
    lookback_months: 12
    probation_share_pct: 50
    member_terms_long: 5
    member_relief_long_pct: 15
    member_relief_short_pct: 8
    long_account_months: 36
    mid_account_months: 12
    age_relief_long_pct: 10
    age_relief_mid_pct: 5
    record_payments_full: 12
    record_payments_mid: 6
    record_relief_full_pct: 10
    record_relief_mid_pct: 5
    leftover_relief_one_pct: 20
    leftover_relief_three_pct: 10
  rule: >-
    A borrower who pays the account off in full pays the payoff figure, and that payment closes the account as paid
    off on the day it is made. The payoff figure is fixed only after the account carries the late fee owed for every
    statement period whose installment stayed unpaid past its grace period. The payoff figure is not fixed until
    the account carries the post-promotional interest charge for every statement period that closed after the promotion
    ended. The payoff figure is the account_balance on the day of payoff plus the payoff per-diem interest, rounded
    to the cent half up only at the end. The payoff per-diem interest is the payoff principal, multiplied by the
    payoff per-diem rate and by the number of payoff per-diem days, divided by 100 and by 365. The payoff principal
    is the account_balance less every late fee, returned-payment fee and interest charge posted less than one whole
    month before the day of payoff, and never below zero. As the standard method, the payoff per-diem rate is the
    plan's apr_pct, and the payoff per-diem days run from the day after the most recent payment through the day
    of payoff, or from the funded_date through the day of payoff when no payment has posted. The payoff per-diem
    rate starts from the rate the balance is accruing at: the plan's post_promo_apr_pct when the plan has a promotional
    period and promo_end_date has passed; the plan's apr_pct less autopay_apr_discount_pct when no promotional period
    has ended, autopay is enrolled and no payment was returned less than lookback_months whole months before the
    day of payoff; the plan's apr_pct less probation_share_pct percent of autopay_apr_discount_pct when no promotional
    period has ended, autopay is enrolled and exactly one payment was returned in that time; and the plan's apr_pct
    in every other case. The payoff member relief is member_relief_long_pct percent when the borrower's Comfort
    Club agreement is active and has run at least member_terms_long consecutive terms, member_relief_short_pct percent
    when that agreement is active and has run fewer than member_terms_long consecutive terms, and zero when the
    borrower holds no active Comfort Club agreement. The payoff account-age relief is age_relief_long_pct percent
    when the account funded at least long_account_months whole months before the day of payoff, age_relief_mid_pct
    percent when it funded at least mid_account_months but fewer than long_account_months whole months before, and
    zero when it funded fewer than mid_account_months whole months before. The payoff payment-record relief applies
    only when the plan's promotion has ended: it is record_relief_full_pct percent when the payments posted less
    than lookback_months whole months before the day of payoff, less the returned payments posted in that time,
    number at least record_payments_full, record_relief_mid_pct percent when that count is at least record_payments_mid
    but below record_payments_full, and zero when the count is lower or the promotion has not ended. The payoff
    leftover relief applies only when the plan's promotion has ended and measures the amount_financed less every
    payment that stood, a payment standing when it was not returned, in units of the account's monthly_payment:
    it is leftover_relief_one_pct percent when that measure is at most one, leftover_relief_three_pct percent when
    it is above one but at most three, and zero when it is above three or the promotion has not ended. The payoff
    per-diem rate is that starting rate reduced once by the payoff relief percentage, which is the payoff member
    relief, account-age relief, payment-record relief and leftover relief added together; the reliefs never act
    one after another. The payoff per-diem days run from the day the most recent interest charge posted through
    the day of payoff, both days counted, when that charge posted after the most recent payment; they run from the
    day after promo_end_date through the day of payoff when the promotion has ended and no interest charge has posted
    since it ended; otherwise they run from the day after the most recent payment through the day of payoff, or
    from the funded_date through the day of payoff when no payment has posted.
  prerequisite:
  - problem: finance_ext_late_fee_schedule
    kind: value_input
    gate: po_bal
    form: state
    policy_source: >-
      The payoff figure is fixed only after the account carries the late fee owed for every statement period whose
      installment stayed unpaid past its grace period.
    condition: >-
      finance_transactions carries a late_fee entry for every statement period whose required payment was still
      unpaid more than late_fee_grace_days calendar days after its due date.
    resolved_by: post_late_fee_ce58c754
    effect: >-
      The posted late fee raises account_balance, so po_bal and with it the payoff figure include the fee; the payoff
      principal leaves the fee out, so the per-diem interest is unchanged.
  - problem: finance_ext_post_promo_interest
    kind: value_input
    gate: po_days
    form: state
    policy_source: >-
      The payoff figure is not fixed until the account carries the post-promotional interest charge for every statement
      period that closed after the promotion ended.
    condition: >-
      finance_transactions carries an interest entry for every statement period that closed after promo_end_date.
    resolved_by: post_post_promo_interest_b0f5a17d
    effect: >-
      The posted post-promotional interest charge raises account_balance and moves the per-diem start to the day
      that charge posted, so po_days falls to the days since that posting and po_bal rises by the charge.
  cross_category:
  - category: plan
    as: branch
    reads:
    - status
    - consecutive_terms
    note: >-
      The payoff member relief tier is decided from the borrower's Comfort Club agreement: whether it is active
      and how many consecutive terms it has run.
  compute:
  - po_bal: F('account_balance')
  - po_fees_recent: >-
      SUM('finance_transactions', 'amount', within_months=1, date_field='posted_date', line_type='late_fee') + SUM('finance_transactions',
      'amount', within_months=1, date_field='posted_date', line_type='returned_payment_fee')
  - po_int_recent: >-
      SUM('finance_transactions', 'amount', within_months=1, date_field='posted_date', line_type='interest')
  - po_principal: MX(0, po_bal - po_fees_recent - po_int_recent)
  - po_promo_months: P('promo_period_months')
  - po_promo_days: DAYS(F('promo_end_date'), NOW) if P('promo_period_months') > 0 else 0
  - po_post_promo: P('promo_period_months') > 0 and po_promo_days > 0
  - po_autopay_on: F('autopay_enrolled')
  - po_returns12: >-
      COUNT('finance_transactions', within_months=K('lookback_months'), date_field='posted_date', line_type='payment_returned')
  - po_rate_base: >-
      P('post_promo_apr_pct') if (po_promo_months > 0 and po_promo_days > 0) else ((P('apr_pct') - P('autopay_apr_discount_pct'))
      if (po_autopay_on == True and po_returns12 == 0) else ((P('apr_pct') - P('autopay_apr_discount_pct') * K('probation_share_pct')
      / 100) if (po_autopay_on == True and po_returns12 == 1) else P('apr_pct')))
  - po_cc_status: CFIELD('plan', 'status', status='active')
  - po_cc_terms: CFIELD('plan', 'consecutive_terms', status='active')
  - po_member_pct: >-
      K('member_relief_long_pct') if (po_cc_status == 'active' and po_cc_terms >= K('member_terms_long')) else (K('member_relief_short_pct')
      if (po_cc_status == 'active' and po_cc_terms < K('member_terms_long')) else 0)
  - po_age_months: MONTHS(F('funded_date'), NOW)
  - po_age_pct: >-
      K('age_relief_long_pct') if po_age_months >= K('long_account_months') else (K('age_relief_mid_pct') if po_age_months
      >= K('mid_account_months') else 0)
  - po_paid12: >-
      COUNT('finance_transactions', within_months=K('lookback_months'), date_field='posted_date', line_type='payment')
      - COUNT('finance_transactions', within_months=K('lookback_months'), date_field='posted_date', line_type='payment_returned')
  - po_record_pct: >-
      K('record_relief_full_pct') if (po_post_promo and po_paid12 >= K('record_payments_full')) else (K('record_relief_mid_pct')
      if (po_post_promo and po_paid12 >= K('record_payments_mid')) else 0)
  - po_stood_total: >-
      SUM('finance_transactions', 'amount', line_type='payment') - SUM('finance_transactions', 'amount', line_type='payment_returned')
  - po_left_units: (F('amount_financed') - po_stood_total) / F('monthly_payment')
  - po_left_pct: >-
      K('leftover_relief_one_pct') if (po_post_promo and po_left_units <= 1) else (K('leftover_relief_three_pct')
      if (po_post_promo and po_left_units <= 3) else 0)
  - po_relief_pct: po_member_pct + po_age_pct + po_record_pct + po_left_pct
  - po_rate: po_rate_base * (100 - po_relief_pct) / 100
  - po_int_count: COUNT('finance_transactions', line_type='interest')
  - po_last_int: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='interest')
  - po_pay_count: COUNT('finance_transactions', line_type='payment')
  - po_last_pay: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='payment')
  - po_days: >-
      (DAYS(po_last_int, NOW) + 1) if (po_int_count > 0 and po_pay_count > 0 and DAYS(po_last_pay, po_last_int)
      > 0) else (po_promo_days if (po_post_promo and (po_int_count == 0 or DAYS(F('promo_end_date'), po_last_int)
      <= 0)) else (DAYS(po_last_pay, NOW) if po_pay_count > 0 else DAYS(F('funded_date'), NOW) + 1))
  - po_per_diem: po_principal * po_rate / 100 / 365 * po_days
  - result: RND(po_bal + po_per_diem, 2)
  compute_basis:
    po_bal: >-
      The payoff figure is the account_balance on the day of payoff plus the payoff per-diem interest, rounded to
      the cent half up only at the end.
    po_fees_recent: >-
      The payoff principal is the account_balance less every late fee, returned-payment fee and interest charge
      posted less than one whole month before the day of payoff, and never below zero.
    po_int_recent: >-
      The payoff principal is the account_balance less every late fee, returned-payment fee and interest charge
      posted less than one whole month before the day of payoff, and never below zero.
    po_principal: >-
      The payoff principal is the account_balance less every late fee, returned-payment fee and interest charge
      posted less than one whole month before the day of payoff, and never below zero.
    po_promo_months: >-
      The payoff per-diem rate starts from the rate the balance is accruing at: the plan's post_promo_apr_pct when
      the plan has a promotional period and promo_end_date has passed; the plan's apr_pct less autopay_apr_discount_pct
      when no promotional period has ended, autopay is enrolled and no payment was returned less than lookback_months
      whole months before the day of payoff; the plan's apr_pct less probation_share_pct percent of autopay_apr_discount_pct
      when no promotional period has ended, autopay is enrolled and exactly one payment was returned in that time;
      and the plan's apr_pct in every other case.
    po_promo_days: >-
      The payoff per-diem rate starts from the rate the balance is accruing at: the plan's post_promo_apr_pct when
      the plan has a promotional period and promo_end_date has passed; the plan's apr_pct less autopay_apr_discount_pct
      when no promotional period has ended, autopay is enrolled and no payment was returned less than lookback_months
      whole months before the day of payoff; the plan's apr_pct less probation_share_pct percent of autopay_apr_discount_pct
      when no promotional period has ended, autopay is enrolled and exactly one payment was returned in that time;
      and the plan's apr_pct in every other case.
    po_post_promo: >-
      The payoff payment-record relief applies only when the plan's promotion has ended: it is record_relief_full_pct
      percent when the payments posted less than lookback_months whole months before the day of payoff, less the
      returned payments posted in that time, number at least record_payments_full, record_relief_mid_pct percent
      when that count is at least record_payments_mid but below record_payments_full, and zero when the count is
      lower or the promotion has not ended.
    po_autopay_on: >-
      The payoff per-diem rate starts from the rate the balance is accruing at: the plan's post_promo_apr_pct when
      the plan has a promotional period and promo_end_date has passed; the plan's apr_pct less autopay_apr_discount_pct
      when no promotional period has ended, autopay is enrolled and no payment was returned less than lookback_months
      whole months before the day of payoff; the plan's apr_pct less probation_share_pct percent of autopay_apr_discount_pct
      when no promotional period has ended, autopay is enrolled and exactly one payment was returned in that time;
      and the plan's apr_pct in every other case.
    po_returns12: >-
      The payoff per-diem rate starts from the rate the balance is accruing at: the plan's post_promo_apr_pct when
      the plan has a promotional period and promo_end_date has passed; the plan's apr_pct less autopay_apr_discount_pct
      when no promotional period has ended, autopay is enrolled and no payment was returned less than lookback_months
      whole months before the day of payoff; the plan's apr_pct less probation_share_pct percent of autopay_apr_discount_pct
      when no promotional period has ended, autopay is enrolled and exactly one payment was returned in that time;
      and the plan's apr_pct in every other case.
    po_rate_base: >-
      The payoff per-diem rate starts from the rate the balance is accruing at: the plan's post_promo_apr_pct when
      the plan has a promotional period and promo_end_date has passed; the plan's apr_pct less autopay_apr_discount_pct
      when no promotional period has ended, autopay is enrolled and no payment was returned less than lookback_months
      whole months before the day of payoff; the plan's apr_pct less probation_share_pct percent of autopay_apr_discount_pct
      when no promotional period has ended, autopay is enrolled and exactly one payment was returned in that time;
      and the plan's apr_pct in every other case.
    po_cc_status: >-
      The payoff member relief is member_relief_long_pct percent when the borrower's Comfort Club agreement is active
      and has run at least member_terms_long consecutive terms, member_relief_short_pct percent when that agreement
      is active and has run fewer than member_terms_long consecutive terms, and zero when the borrower holds no
      active Comfort Club agreement.
    po_cc_terms: >-
      The payoff member relief is member_relief_long_pct percent when the borrower's Comfort Club agreement is active
      and has run at least member_terms_long consecutive terms, member_relief_short_pct percent when that agreement
      is active and has run fewer than member_terms_long consecutive terms, and zero when the borrower holds no
      active Comfort Club agreement.
    po_member_pct: >-
      The payoff member relief is member_relief_long_pct percent when the borrower's Comfort Club agreement is active
      and has run at least member_terms_long consecutive terms, member_relief_short_pct percent when that agreement
      is active and has run fewer than member_terms_long consecutive terms, and zero when the borrower holds no
      active Comfort Club agreement.
    po_age_months: >-
      The payoff account-age relief is age_relief_long_pct percent when the account funded at least long_account_months
      whole months before the day of payoff, age_relief_mid_pct percent when it funded at least mid_account_months
      but fewer than long_account_months whole months before, and zero when it funded fewer than mid_account_months
      whole months before.
    po_age_pct: >-
      The payoff account-age relief is age_relief_long_pct percent when the account funded at least long_account_months
      whole months before the day of payoff, age_relief_mid_pct percent when it funded at least mid_account_months
      but fewer than long_account_months whole months before, and zero when it funded fewer than mid_account_months
      whole months before.
    po_paid12: >-
      The payoff payment-record relief applies only when the plan's promotion has ended: it is record_relief_full_pct
      percent when the payments posted less than lookback_months whole months before the day of payoff, less the
      returned payments posted in that time, number at least record_payments_full, record_relief_mid_pct percent
      when that count is at least record_payments_mid but below record_payments_full, and zero when the count is
      lower or the promotion has not ended.
    po_record_pct: >-
      The payoff payment-record relief applies only when the plan's promotion has ended: it is record_relief_full_pct
      percent when the payments posted less than lookback_months whole months before the day of payoff, less the
      returned payments posted in that time, number at least record_payments_full, record_relief_mid_pct percent
      when that count is at least record_payments_mid but below record_payments_full, and zero when the count is
      lower or the promotion has not ended.
    po_stood_total: >-
      The payoff leftover relief applies only when the plan's promotion has ended and measures the amount_financed
      less every payment that stood, a payment standing when it was not returned, in units of the account's monthly_payment:
      it is leftover_relief_one_pct percent when that measure is at most one, leftover_relief_three_pct percent
      when it is above one but at most three, and zero when it is above three or the promotion has not ended.
    po_left_units: >-
      The payoff leftover relief applies only when the plan's promotion has ended and measures the amount_financed
      less every payment that stood, a payment standing when it was not returned, in units of the account's monthly_payment:
      it is leftover_relief_one_pct percent when that measure is at most one, leftover_relief_three_pct percent
      when it is above one but at most three, and zero when it is above three or the promotion has not ended.
    po_left_pct: >-
      The payoff leftover relief applies only when the plan's promotion has ended and measures the amount_financed
      less every payment that stood, a payment standing when it was not returned, in units of the account's monthly_payment:
      it is leftover_relief_one_pct percent when that measure is at most one, leftover_relief_three_pct percent
      when it is above one but at most three, and zero when it is above three or the promotion has not ended.
    po_relief_pct: >-
      The payoff per-diem rate is that starting rate reduced once by the payoff relief percentage, which is the
      payoff member relief, account-age relief, payment-record relief and leftover relief added together; the reliefs
      never act one after another.
    po_rate: >-
      The payoff per-diem rate is that starting rate reduced once by the payoff relief percentage, which is the
      payoff member relief, account-age relief, payment-record relief and leftover relief added together; the reliefs
      never act one after another.
    po_int_count: >-
      The payoff per-diem days run from the day the most recent interest charge posted through the day of payoff,
      both days counted, when that charge posted after the most recent payment; they run from the day after promo_end_date
      through the day of payoff when the promotion has ended and no interest charge has posted since it ended; otherwise
      they run from the day after the most recent payment through the day of payoff, or from the funded_date through
      the day of payoff when no payment has posted.
    po_last_int: >-
      The payoff per-diem days run from the day the most recent interest charge posted through the day of payoff,
      both days counted, when that charge posted after the most recent payment; they run from the day after promo_end_date
      through the day of payoff when the promotion has ended and no interest charge has posted since it ended; otherwise
      they run from the day after the most recent payment through the day of payoff, or from the funded_date through
      the day of payoff when no payment has posted.
    po_pay_count: >-
      The payoff per-diem days run from the day the most recent interest charge posted through the day of payoff,
      both days counted, when that charge posted after the most recent payment; they run from the day after promo_end_date
      through the day of payoff when the promotion has ended and no interest charge has posted since it ended; otherwise
      they run from the day after the most recent payment through the day of payoff, or from the funded_date through
      the day of payoff when no payment has posted.
    po_last_pay: >-
      The payoff per-diem days run from the day the most recent interest charge posted through the day of payoff,
      both days counted, when that charge posted after the most recent payment; they run from the day after promo_end_date
      through the day of payoff when the promotion has ended and no interest charge has posted since it ended; otherwise
      they run from the day after the most recent payment through the day of payoff, or from the funded_date through
      the day of payoff when no payment has posted.
    po_days: >-
      The payoff per-diem days run from the day the most recent interest charge posted through the day of payoff,
      both days counted, when that charge posted after the most recent payment; they run from the day after promo_end_date
      through the day of payoff when the promotion has ended and no interest charge has posted since it ended; otherwise
      they run from the day after the most recent payment through the day of payoff, or from the funded_date through
      the day of payoff when no payment has posted.
    po_per_diem: >-
      The payoff per-diem interest is the payoff principal, multiplied by the payoff per-diem rate and by the number
      of payoff per-diem days, divided by 100 and by 365.
    result: >-
      The payoff figure is the account_balance on the day of payoff plus the payoff per-diem interest, rounded to
      the cent half up only at the end.
  factors:
  - id: payoff_rate_start
    effect: parameter
    decides: po_rate_base
    bindings:
    - po_promo_months
    - po_autopay_on
    - po_returns12
    - po_rate_base
    ladder:
    - when: the plan has a promotional period and promo_end_date has passed
      value: P('post_promo_apr_pct')
    - when: >-
        no promotional period has ended, autopay is enrolled and no payment was returned in the lookback_months
        window
      value: P('apr_pct') - P('autopay_apr_discount_pct')
    - when: >-
        no promotional period has ended, autopay is enrolled and exactly one payment was returned in the lookback_months
        window
      value: P('apr_pct') - P('autopay_apr_discount_pct') * K('probation_share_pct') / 100
    - when: otherwise
      value: P('apr_pct')
    baseline:
      po_rate_base: P('apr_pct')
    evidence:
    - date
    - history
    - tier_param
    cross_difficulty: null
  - id: payoff_member_relief
    effect: parameter
    decides: po_member_pct
    bindings:
    - po_cc_status
    - po_cc_terms
    - po_member_pct
    ladder:
    - when: >-
        the Comfort Club agreement is active and has run at least member_terms_long consecutive terms
      value: K('member_relief_long_pct')
    - when: >-
        the Comfort Club agreement is active and has run fewer than member_terms_long consecutive terms
      value: K('member_relief_short_pct')
    - when: otherwise (no active Comfort Club agreement)
      value: '0'
    baseline:
      po_member_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: plan
  - id: payoff_account_age_relief
    effect: parameter
    decides: po_age_pct
    bindings:
    - po_age_months
    - po_age_pct
    ladder:
    - when: the account funded at least long_account_months whole months before the day of payoff
      value: K('age_relief_long_pct')
    - when: >-
        the account funded at least mid_account_months but fewer than long_account_months whole months before
      value: K('age_relief_mid_pct')
    - when: otherwise (funded fewer than mid_account_months whole months before)
      value: '0'
    baseline:
      po_age_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: payoff_payment_record_relief
    effect: parameter
    decides: po_record_pct
    bindings:
    - po_paid12
    - po_record_pct
    ladder:
    - when: >-
        the promotion has ended and payments less returned payments in the lookback_months window number at least
        record_payments_full
      value: K('record_relief_full_pct')
    - when: >-
        the promotion has ended and that count is at least record_payments_mid but below record_payments_full
      value: K('record_relief_mid_pct')
    - when: otherwise (a lower count, or the promotion has not ended)
      value: '0'
    baseline:
      po_record_pct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: payoff_leftover_relief
    effect: parameter
    decides: po_left_pct
    bindings:
    - po_stood_total
    - po_left_units
    - po_left_pct
    ladder:
    - when: >-
        the promotion has ended and amount_financed less the payments that stood is at most one monthly_payment
      value: K('leftover_relief_one_pct')
    - when: >-
        the promotion has ended and that measure is above one but at most three monthly_payment amounts
      value: K('leftover_relief_three_pct')
    - when: otherwise (above three, or the promotion has not ended)
      value: '0'
    baseline:
      po_left_pct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: payoff_per_diem_anchor
    effect: method
    decides: po_days
    bindings:
    - po_int_count
    - po_last_int
    - po_pay_count
    - po_last_pay
    - po_days
    ladder:
    - when: the most recent interest charge posted after the most recent payment
      method: >-
        count from the day that interest charge posted through the day of payoff, both days counted
    - when: the promotion has ended and no interest charge has posted since it ended
      method: count from the day after promo_end_date through the day of payoff
    - when: otherwise
      method: >-
        count from the day after the most recent payment through the day of payoff, or from the funded_date when
        no payment has posted
    baseline:
      po_days: DAYS(po_last_pay, NOW) if po_pay_count > 0 else DAYS(F('funded_date'), NOW) + 1
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The payoff figure is the account_balance on the day of payoff plus the payoff per-diem interest, rounded to
      the cent half up only at the end. The payoff per-diem interest is the payoff principal, multiplied by the
      payoff per-diem rate and by the number of payoff per-diem days, divided by 100 and by 365. The payoff principal
      is the account_balance less every late fee, returned-payment fee and interest charge posted less than one
      whole month before the day of payoff, and never below zero. As the standard method, the payoff per-diem rate
      is the plan's apr_pct, and the payoff per-diem days run from the day after the most recent payment through
      the day of payoff, or from the funded_date through the day of payoff when no payment has posted.
    params:
    - apr_pct
  inputs:
