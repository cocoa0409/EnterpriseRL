- id: finance_ext_makeup_payment
  base_policy_refs:
  - finance_payment_terms
  - finance_payoff_rules
  overwrite: []
  trigger: on_request
  subject:
  - finance_payment
  computes: amount
  target_tool: submit_makeup_payment_e9bd505b
  params:
    pull_share_full_pct: 100
    pull_share_half_pct: 50
    member_terms_long: 5
    member_relief_long_pct: 50
    member_relief_short_pct: 25
    long_account_months: 36
    mid_account_months: 12
    age_relief_long_pct: 30
    age_relief_mid_pct: 20
  rule: >-
    A borrower who brings a missed or returned installment up to date pays the make-up amount as a one-time payment
    on the account. The make-up amount on a fixed-rate account is not fixed until the account carries the closing
    interest charge for every statement period that has closed. The make-up amount is the installment still owed
    plus the pulled-forward share of the next installment, rounded to the cent half up only at the end. As the standard
    method, the installment still owed is the account's monthly_payment less the payments posted less than one whole
    month before the date of handling, never below zero, and nothing of the next installment is pulled forward.
    The installment still owed is measured by what happened to the most recent payment: where it was returned, the
    returned payment counts as never made and the full monthly_payment is owed; where it was not returned and the
    payments posted less than one whole month before the date of handling, less the returned payments posted in
    that time, came to more than zero but less than the monthly_payment, the monthly_payment less those payments
    is owed; otherwise the monthly_payment less the payments posted in that month is owed, never below zero. The
    pull-forward share of the next installment is pull_share_full_pct percent when the most recent payment was returned
    and autopay is still enrolled, pull_share_half_pct percent when the most recent payment was returned and autopay
    is not enrolled, and zero when the most recent payment was not returned. The pull-forward member relief is member_relief_long_pct
    percent when the borrower's Comfort Club agreement is active and has run at least member_terms_long consecutive
    terms, member_relief_short_pct percent when that agreement is active and has run fewer than member_terms_long
    consecutive terms, and zero when the borrower holds no active Comfort Club agreement. The pull-forward account-age
    relief is age_relief_long_pct percent when the account funded at least long_account_months whole months before
    the date of handling, age_relief_mid_pct percent when it funded at least mid_account_months but fewer than long_account_months
    whole months before, and zero when it funded fewer than mid_account_months whole months before. The pulled-forward
    share of the next installment is the monthly_payment multiplied by the pull-forward share and then reduced once
    by the pull-forward member relief and the pull-forward account-age relief added together; the two reliefs never
    act one after another.
  prerequisite:
  - problem: finance_ext_fixed_rate_interest
    kind: state_gate
    gate: finance_transactions.line_type
    form: state
    policy_source: >-
      The make-up amount on a fixed-rate account is not fixed until the account carries the closing interest charge
      for every statement period that has closed.
    condition: >-
      On a fixed-rate account, finance_transactions carries an interest entry for every statement period that has
      closed since funding.
    resolved_by: post_fixed_rate_interest_d84dbec7
    effect: >-
      Once the closing interest charge of the last closed statement is on the account, the make-up payment may be
      taken; the payment then lands after that charge in the payment application order.
  cross_category:
  - category: plan
    as: branch
    reads:
    - status
    - consecutive_terms
    note: >-
      The pull-forward member relief tier is decided from the borrower's Comfort Club agreement: whether it is active
      and how many consecutive terms it has run.
  compute:
  - mu_paid_month: >-
      SUM('finance_transactions', 'amount', within_months=1, date_field='posted_date', line_type='payment')
  - mu_ret_month: >-
      SUM('finance_transactions', 'amount', within_months=1, date_field='posted_date', line_type='payment_returned')
  - mu_ret_count: COUNT('finance_transactions', line_type='payment_returned')
  - mu_last_pay: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='payment')
  - mu_last_ret: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='payment_returned')
  - mu_returned: mu_ret_count > 0 and DAYS(mu_last_pay, mu_last_ret) >= 0
  - mu_owed: >-
      F('monthly_payment') if mu_returned else ((F('monthly_payment') - (mu_paid_month - mu_ret_month)) if ((mu_paid_month
      - mu_ret_month) > 0 and (mu_paid_month - mu_ret_month) < F('monthly_payment')) else MX(0, F('monthly_payment')
      - mu_paid_month))
  - mu_pull_ret_count: COUNT('finance_transactions', line_type='payment_returned')
  - mu_pull_last_pay: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='payment')
  - mu_pull_last_ret: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='payment_returned')
  - mu_pull_returned: mu_pull_ret_count > 0 and DAYS(mu_pull_last_pay, mu_pull_last_ret) >= 0
  - mu_autopay_on: F('autopay_enrolled')
  - mu_pull_pct: >-
      K('pull_share_full_pct') if (mu_pull_returned and mu_autopay_on == True) else (K('pull_share_half_pct') if
      (mu_pull_returned and mu_autopay_on != True) else 0)
  - mu_cc_status: CFIELD('plan', 'status', status='active')
  - mu_cc_terms: CFIELD('plan', 'consecutive_terms', status='active')
  - mu_member_pct: >-
      K('member_relief_long_pct') if (mu_cc_status == 'active' and mu_cc_terms >= K('member_terms_long')) else (K('member_relief_short_pct')
      if (mu_cc_status == 'active' and mu_cc_terms < K('member_terms_long')) else 0)
  - mu_age_months: MONTHS(F('funded_date'), NOW)
  - mu_age_pct: >-
      K('age_relief_long_pct') if mu_age_months >= K('long_account_months') else (K('age_relief_mid_pct') if mu_age_months
      >= K('mid_account_months') else 0)
  - mu_pull: F('monthly_payment') * mu_pull_pct / 100 * (100 - mu_member_pct - mu_age_pct) / 100
  - result: RND(mu_owed + mu_pull, 2)
  compute_basis:
    mu_paid_month: >-
      The installment still owed is measured by what happened to the most recent payment: where it was returned,
      the returned payment counts as never made and the full monthly_payment is owed; where it was not returned
      and the payments posted less than one whole month before the date of handling, less the returned payments
      posted in that time, came to more than zero but less than the monthly_payment, the monthly_payment less those
      payments is owed; otherwise the monthly_payment less the payments posted in that month is owed, never below
      zero.
