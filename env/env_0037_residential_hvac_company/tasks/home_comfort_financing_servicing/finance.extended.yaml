  factors:
  - id: returned_fee_occurrence_schedule
    effect: parameter
    decides: rf_scheduled
    bindings:
    - rf_prior
    - rf_scheduled
    ladder:
    - when: no other payment was returned within the returned-payment lookback
      value: K('first_return_fee_usd')
    - when: exactly one other payment was returned within the returned-payment lookback
      value: K('second_return_fee_usd')
    - when: otherwise (two or more)
      value: P('returned_payment_fee_usd')
    baseline:
      rf_scheduled: P('returned_payment_fee_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: returned_fee_prompt_replacement_relief
    effect: parameter
    decides: rf_prompt_pct
    bindings:
    - rf_last_ret
    - rf_last_pay
    - rf_gap
    - rf_prompt_pct
    ladder:
    - when: >-
        the most recent payment posted no more than prompt_days_short days after the most recent return
      value: K('prompt_relief_short_pct')
    - when: it posted more than prompt_days_short but no more than prompt_days_long days after it
      value: K('prompt_relief_long_pct')
    - when: otherwise (no payment since the return, or a later one)
      value: '0'
    baseline:
      rf_prompt_pct: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: returned_fee_member_relief
    effect: parameter
    decides: rf_member_pct
    bindings:
    - rf_cc_status
    - rf_cc_terms
    - rf_member_pct
    ladder:
    - when: >-
        the Comfort Club agreement is active and has run at least member_terms_long consecutive terms
      value: K('member_relief_long_pct')
    - when: >-
        the Comfort Club agreement is active and has run fewer than member_terms_long consecutive terms
      value: K('member_relief_short_pct')
    - when: otherwise (no active Comfort Club agreement)
      value: '0'
    baseline:
      rf_member_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: plan
  - id: returned_fee_account_age_relief
    effect: parameter
    decides: rf_age_pct
    bindings:
    - rf_age_months
    - rf_age_pct
    ladder:
    - when: the account funded at least long_account_months whole months before the date of handling
      value: K('age_relief_long_pct')
    - when: >-
        the account funded at least mid_account_months but fewer than long_account_months whole months before
      value: K('age_relief_mid_pct')
    - when: otherwise (funded fewer than mid_account_months whole months before)
      value: '0'
    baseline:
      rf_age_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: returned_fee_payment_record_count
    effect: method
    decides: rf_paid_selected
    bindings:
    - rf_rec_autopay_on
    - rf_rec_drafts
    - rf_rec_all
    - rf_paid_selected
    ladder:
    - when: autopay is enrolled
      method: the payments counted are the autopay drafts posted in the record_window_months window
    - when: autopay is not enrolled and autopay drafts were posted in the record_window_months window
      method: the payments counted are only those other than autopay drafts posted in that window
    - when: otherwise
      method: the payments counted are every payment posted in the record_window_months window
    baseline:
      rf_paid_selected: rf_rec_all
    evidence:
    - history
    cross_difficulty: null
  - id: returned_fee_payment_record_relief
    effect: parameter
    decides: rf_record_pct
    bindings:
    - rf_rec_returns
    - rf_paid12
    - rf_record_pct
    ladder:
    - when: the returned-payment payment-record count is at least record_payments_full
      value: K('record_relief_full_pct')
    - when: the count is at least record_payments_mid but below record_payments_full
      value: K('record_relief_mid_pct')
    - when: otherwise (below record_payments_mid)
      value: '0'
    baseline:
      rf_record_pct: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The returned-payment fee is the scheduled returned-payment fee reduced once by the returned-payment relief
      percentage, never below zero, and rounded to the cent half up only at the end. As the standard method, the
      scheduled returned-payment fee is the plan's returned_payment_fee_usd and the returned-payment relief percentage
      is zero.
    params:
    - returned_payment_fee_usd
  inputs:
    history:
    - table: finance_transactions
      aggregate: count
      field: finance_txn_id
      within_months: 24
      filters:
        line_type: payment_returned
    - table: finance_transactions
      aggregate: latest
      field: posted_date
      within_months: null
      filters:
        line_type: payment
    - table: finance_transactions
      aggregate: count
      field: finance_txn_id
      within_months: 12
      filters:
        line_type: payment
        payment_method: autopay_ach
    - table: finance_transactions
      aggregate: count
      field: finance_txn_id
      within_months: 12
      filters:
        line_type: payment
    cross_category:
    - plan
