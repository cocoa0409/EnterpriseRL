      is enrolled and exactly one payment was returned in that time; and the plan's apr_pct when autopay is not
      enrolled or two or more payments were returned in that time.
    fx_cc_status: >-
      The fixed-rate member relief is member_relief_long_pct percent when the borrower's Comfort Club agreement
      is active and has run at least member_terms_long consecutive terms, member_relief_short_pct percent when that
      agreement is active and has run fewer than member_terms_long consecutive terms, and zero when the borrower
      holds no active Comfort Club agreement.
    fx_cc_terms: >-
      The fixed-rate member relief is member_relief_long_pct percent when the borrower's Comfort Club agreement
      is active and has run at least member_terms_long consecutive terms, member_relief_short_pct percent when that
      agreement is active and has run fewer than member_terms_long consecutive terms, and zero when the borrower
      holds no active Comfort Club agreement.
    fx_member_pct: >-
      The fixed-rate member relief is member_relief_long_pct percent when the borrower's Comfort Club agreement
      is active and has run at least member_terms_long consecutive terms, member_relief_short_pct percent when that
      agreement is active and has run fewer than member_terms_long consecutive terms, and zero when the borrower
      holds no active Comfort Club agreement.
    fx_age_months: >-
      The fixed-rate account-age relief is age_relief_long_pct percent when the account funded at least long_account_months
      whole months before the date of handling, age_relief_mid_pct percent when it funded at least mid_account_months
      but fewer than long_account_months whole months before, and zero when it funded fewer than mid_account_months
      whole months before.
    fx_age_pct: >-
      The fixed-rate account-age relief is age_relief_long_pct percent when the account funded at least long_account_months
      whole months before the date of handling, age_relief_mid_pct percent when it funded at least mid_account_months
      but fewer than long_account_months whole months before, and zero when it funded fewer than mid_account_months
      whole months before.
    fx_rate: >-
      The fixed-rate charging rate is that starting rate reduced once by the fixed-rate member relief and the fixed-rate
      account-age relief added together; the two reliefs never act one after another.
    result: >-
      The fixed-rate closing interest charge is the fixed-rate interest base, multiplied by the fixed-rate charging
      rate and by the number of fixed-rate accrual days, divided by 100 and by 365, and rounded to the cent half
      up only at the end.
  factors:
  - id: fixed_rate_interest_base
    effect: method
    decides: fx_base
    bindings:
    - fx_bal
    - fx_fees_recent
    - fx_ret_count
    - fx_last_pay
    - fx_last_ret
    - fx_pay_returned
    - fx_last_int_amt
    - fx_base
    ladder:
    - when: the most recent payment on the account was returned
      method: >-
        account_balance less the most recent interest charge and less the late fees and returned-payment fees posted
        less than one whole month before the date of handling
    - when: >-
        the most recent payment was not returned and late fees or returned-payment fees were posted less than one
        whole month before the date of handling
      method: account_balance less those fees
    - when: otherwise
      method: account_balance as it stands
    baseline:
      fx_base: fx_bal
    evidence:
    - history
    cross_difficulty: null
  - id: fixed_rate_autopay_standing
    effect: parameter
    decides: fx_rate_start
    bindings:
    - fx_autopay_on
    - fx_returns12
    - fx_rate_start
    ladder:
    - when: autopay is enrolled and no payment was returned in the lookback_months window
      value: P('apr_pct') - P('autopay_apr_discount_pct')
    - when: autopay is enrolled and exactly one payment was returned in the lookback_months window
      value: P('apr_pct') - P('autopay_apr_discount_pct') * K('probation_share_pct') / 100
    - when: otherwise (autopay not enrolled, or two or more returned payments)
      value: P('apr_pct')
    baseline:
      fx_rate_start: P('apr_pct')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: fixed_rate_member_relief
    effect: parameter
    decides: fx_member_pct
    bindings:
    - fx_cc_status
    - fx_cc_terms
    - fx_member_pct
    ladder:
    - when: >-
        the Comfort Club agreement is active and has run at least member_terms_long consecutive terms
      value: K('member_relief_long_pct')
    - when: >-
        the Comfort Club agreement is active and has run fewer than member_terms_long consecutive terms
      value: K('member_relief_short_pct')
    - when: otherwise (no active Comfort Club agreement)
      value: '0'
    baseline:
      fx_member_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: plan
  - id: fixed_rate_account_age_relief
    effect: parameter
    decides: fx_age_pct
    bindings:
    - fx_age_months
    - fx_age_pct
    ladder:
    - when: the account funded at least long_account_months whole months before the date of handling
      value: K('age_relief_long_pct')
    - when: >-
        the account funded at least mid_account_months but fewer than long_account_months whole months before
      value: K('age_relief_mid_pct')
    - when: otherwise (funded fewer than mid_account_months whole months before)
      value: '0'
    baseline:
      fx_age_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The fixed-rate closing interest charge is the fixed-rate interest base, multiplied by the fixed-rate charging
      rate and by the number of fixed-rate accrual days, divided by 100 and by 365, and rounded to the cent half
      up only at the end. The fixed-rate accrual days run from the day the previous interest charge posted, or from
      the funded_date when none has posted, up to but not including the day this charge posts, and the fixed-rate
      interest base is applied to every one of those days. As the standard method, the fixed-rate interest base
      is the account_balance on the day the charge posts, and the fixed-rate charging rate is the plan's apr_pct.
    params:
    - apr_pct
