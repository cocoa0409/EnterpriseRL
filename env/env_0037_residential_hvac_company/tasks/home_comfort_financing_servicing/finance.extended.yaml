      field: posted_date
      within_months: null
      filters:
        line_type: interest
    cross_category:
    - plan
- id: finance_ext_fixed_rate_interest
  base_policy_refs:
  - finance_payment_terms
  - finance_deferred_interest
  - finance_late_and_returned_fees
  - finance_servicing_changes
  overwrite:
  - base_policy: finance_payment_terms
    superseded_clause: >-
      On fixed-rate plans interest accrues as daily simple interest at apr_pct on the daily principal balance over
      a 365-day year and posts as one interest charge for each statement period
    replaced_by: >-
      The fixed-rate accrual days run from the day the previous interest charge posted, or from the funded_date
      when none has posted, up to but not including the day this charge posts, and the fixed-rate interest base
      is applied to every one of those days.
  - base_policy: finance_servicing_changes
    superseded_clause: >-
      while autopay is enrolled on a plan whose autopay_apr_discount_pct is above 0.00, the APR is reduced by that
      many percentage points from the next statement and restored when autopay ends
    replaced_by: >-
      The fixed-rate charging rate starts from the autopay standing of the account: the plan's apr_pct less autopay_apr_discount_pct
      when autopay is enrolled and no payment was returned less than lookback_months whole months before the date
      of handling; the plan's apr_pct less probation_share_pct percent of autopay_apr_discount_pct when autopay
      is enrolled and exactly one payment was returned in that time; and the plan's apr_pct when autopay is not
      enrolled or two or more payments were returned in that time.
  trigger: state_due
  subject:
  - finance_statement_charge
  computes: amount
  target_tool: post_fixed_rate_interest_d84dbec7
  params:
    lookback_months: 12
    probation_share_pct: 50
    member_terms_long: 5
    member_relief_long_pct: 15
    member_relief_short_pct: 8
    long_account_months: 36
    mid_account_months: 12
    age_relief_long_pct: 10
    age_relief_mid_pct: 5
  rule: >-
    On a plan whose interest_rate_type is fixed, interest is posted once for each statement period as a closing
    interest charge on the first day after that period's statement closes. The fixed-rate closing interest charge
    is the fixed-rate interest base, multiplied by the fixed-rate charging rate and by the number of fixed-rate
    accrual days, divided by 100 and by 365, and rounded to the cent half up only at the end. The fixed-rate accrual
    days run from the day the previous interest charge posted, or from the funded_date when none has posted, up
    to but not including the day this charge posts, and the fixed-rate interest base is applied to every one of
    those days. As the standard method, the fixed-rate interest base is the account_balance on the day the charge
    posts, and the fixed-rate charging rate is the plan's apr_pct. The fixed-rate interest base leaves out charges
    that are not principal: where the most recent payment on the account was returned, the base is the account_balance
    less the most recent interest charge and less every late fee and returned-payment fee posted less than one whole
    month before the date of handling; where the most recent payment was not returned and such fees were posted
    in that month, the base is the account_balance less those fees; otherwise the base is the account_balance; a
    base below zero counts as zero. The fixed-rate charging rate starts from the autopay standing of the account:
    the plan's apr_pct less autopay_apr_discount_pct when autopay is enrolled and no payment was returned less than
    lookback_months whole months before the date of handling; the plan's apr_pct less probation_share_pct percent
    of autopay_apr_discount_pct when autopay is enrolled and exactly one payment was returned in that time; and
    the plan's apr_pct when autopay is not enrolled or two or more payments were returned in that time. The fixed-rate
    member relief is member_relief_long_pct percent when the borrower's Comfort Club agreement is active and has
    run at least member_terms_long consecutive terms, member_relief_short_pct percent when that agreement is active
    and has run fewer than member_terms_long consecutive terms, and zero when the borrower holds no active Comfort
    Club agreement. The fixed-rate account-age relief is age_relief_long_pct percent when the account funded at
    least long_account_months whole months before the date of handling, age_relief_mid_pct percent when it funded
    at least mid_account_months but fewer than long_account_months whole months before, and zero when it funded
    fewer than mid_account_months whole months before. The fixed-rate charging rate is that starting rate reduced
    once by the fixed-rate member relief and the fixed-rate account-age relief added together; the two reliefs never
    act one after another.
  prerequisite: []
  cross_category:
  - category: plan
    as: branch
    reads:
    - status
    - consecutive_terms
    note: >-
      The fixed-rate member relief tier is decided from the borrower's Comfort Club agreement: whether it is active
      and how many consecutive terms it has run.
  compute:
  - fx_int_count: COUNT('finance_transactions', line_type='interest')
  - fx_last_int: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='interest')
  - fx_days: DAYS(fx_last_int, NOW) if fx_int_count > 0 else DAYS(F('funded_date'), NOW)
  - fx_bal: F('account_balance')
  - fx_fees_recent: >-
      SUM('finance_transactions', 'amount', within_months=1, date_field='posted_date', line_type='late_fee') + SUM('finance_transactions',
      'amount', within_months=1, date_field='posted_date', line_type='returned_payment_fee')
  - fx_ret_count: COUNT('finance_transactions', line_type='payment_returned')
  - fx_last_pay: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='payment')
  - fx_last_ret: >-
      LATEST('finance_transactions', 'posted_date', date_field='posted_date', line_type='payment_returned')
  - fx_pay_returned: fx_ret_count > 0 and DAYS(fx_last_pay, fx_last_ret) >= 0
  - fx_last_int_amt: >-
      LATEST('finance_transactions', 'amount', date_field='posted_date', line_type='interest') if fx_int_count >
      0 else 0
  - fx_base: >-
      MX(0, fx_bal - fx_fees_recent - fx_last_int_amt) if fx_pay_returned else (MX(0, fx_bal - fx_fees_recent) if
      fx_fees_recent > 0 else MX(0, fx_bal))
  - fx_autopay_on: F('autopay_enrolled')
  - fx_returns12: >-
      COUNT('finance_transactions', within_months=K('lookback_months'), date_field='posted_date', line_type='payment_returned')
  - fx_rate_start: >-
      (P('apr_pct') - P('autopay_apr_discount_pct')) if (fx_autopay_on == True and fx_returns12 == 0) else ((P('apr_pct')
      - P('autopay_apr_discount_pct') * K('probation_share_pct') / 100) if (fx_autopay_on == True and fx_returns12
      == 1) else P('apr_pct'))
  - fx_cc_status: CFIELD('plan', 'status', status='active')
  - fx_cc_terms: CFIELD('plan', 'consecutive_terms', status='active')
  - fx_member_pct: >-
      K('member_relief_long_pct') if (fx_cc_status == 'active' and fx_cc_terms >= K('member_terms_long')) else (K('member_relief_short_pct')
      if (fx_cc_status == 'active' and fx_cc_terms < K('member_terms_long')) else 0)
  - fx_age_months: MONTHS(F('funded_date'), NOW)
  - fx_age_pct: >-
      K('age_relief_long_pct') if fx_age_months >= K('long_account_months') else (K('age_relief_mid_pct') if fx_age_months
      >= K('mid_account_months') else 0)
  - fx_rate: fx_rate_start * (100 - fx_member_pct - fx_age_pct) / 100
  - result: RND(fx_base * fx_rate / 100 / 365 * fx_days, 2)
