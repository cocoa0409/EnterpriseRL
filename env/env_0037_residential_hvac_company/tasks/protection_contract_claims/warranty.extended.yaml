    factors:
      - id: after_hours_sublimit_basis
        effect: method
        decides: labor_allowed
        bindings: [call_multiplier, tier_covers_after_hours, labor_allowed]
        ladder:
          - when: "the call class carries a labor multiplier above one AND the tier covers the after-hours premium"
            method: "the labor net is allowed up to the member sublimit multiplied by the call class's labor multiplier"
          - when: "the call class carries a labor multiplier above one AND the tier does not cover the after-hours premium"
            method: "the labor net is divided by the call class's labor multiplier and allowed up to the member sublimit"
          - when: "otherwise (labor multiplier of one)"
            method: "the labor net is allowed up to the member sublimit"
        baseline:
          labor_allowed: "MN(labor_net, member_sublimit)"
        evidence: [cross_category, tier_param]
        cross_difficulty: service
      - id: member_sublimit_uplift
        effect: parameter
        decides: member_uplift
        bindings: [member_active, member_discount_pct, member_terms, member_uplift]
        ladder:
          - when: "the holder's Comfort Club agreement is in active status AND its tier's member repair discount is at least the top-tier repair discount"
            value: "K('member_uplift_top_tier')"
          - when: "the agreement is in active status AND (at a lower tier) it has been held for three or more consecutive terms"
            value: "K('member_uplift_loyal')"
          - when: "otherwise"
            value: "1"
        baseline:
          member_uplift: "1"
        evidence: [cross_category]
        cross_difficulty: plan
      - id: refrigerant_pounds_method
        effect: method
        decides: lbs_paid
        bindings: [lbs_12m, earlier_lbs, lbs_paid]
        ladder:
          - when: "refrigerant added on the holder's other Harbison calls in the twelve calendar months before the date of handling reaches the pre-existing-leak pounds"
            method: "no refrigerant is paid"
          - when: "such earlier refrigerant is above zero and below the pre-existing-leak pounds"
            method: "the pounds paid are the pounds billed less the earlier pounds, never below zero, up to the tier's refrigerant pound limit"
          - when: "otherwise (none added)"
            method: "the pounds paid are the pounds billed up to the tier's refrigerant pound limit"
        baseline:
          lbs_paid: "MN(billed_lbs, P('refrigerant_max_lbs_per_claim'))"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: manufacturer_part_handling
        effect: parameter
        decides: parts_paid
        bindings: [registered_years, mfr_years, mfr_supplies_part, major_part, parts_paid]
        ladder:
          - when: "the manufacturer's parts warranty supplies the part AND the failed component is a compressor, condenser coil or evaporator coil"
            value: "the parts net up to K('major_part_handling_usd')"
          - when: "the manufacturer's parts warranty supplies the part AND the failed component is any other component"
            value: "the parts net up to K('minor_part_handling_usd')"
          - when: "otherwise (no manufacturer warranty supplies the part)"
            value: "the standard parts paid (the parts net where the tier covers parts within its parts years)"
        baseline:
          parts_paid: "parts_std"
        evidence: [cross_category, date]
        cross_difficulty: install
      - id: leak_search_component_share
        effect: parameter
        decides: leak_share
        bindings: [leak_component, leak_share]
        ladder:
          - when: "the failed component is a compressor"
            value: "K('leak_search_share_compressor')"
          - when: "the failed component is a metering device or reversing valve"
            value: "K('leak_search_share_valve')"
          - when: "otherwise"
            value: "the tier's own leak-search coverage (one where covered, zero where not)"
        baseline:
          leak_share: "1 if P('refrigerant_leak_search_covered') else 0"
        evidence: [history]
        cross_difficulty: null
      - id: booking_premium_share
        effect: parameter
        decides: premium_share
        bindings: [booked_symptom, booked_urgent, booking_lead_days, premium_covered, premium_share]
        ladder:
          - when: "the tier covers the after-hours premium AND the call was booked for a symptom other than no heat, no cooling or a carbon monoxide alarm"
            value: "0"
          - when: "the tier covers the after-hours premium AND the call was booked for one of those symptoms one or more calendar days before its scheduled date"
            value: "K('booked_ahead_premium_share')"
          - when: "otherwise (an urgent call booked for its own day on a covering tier, or any call on a tier without premium coverage)"
            value: "the tier's own after-hours coverage (one where covered, zero where not)"
        baseline:
          premium_share: "1 if P('after_hours_premium_covered') else 0"
        evidence: [cross_category, date]
        cross_difficulty: service
    baseline:
      rule: >-
        The parts-and-labor claim payable is the labor allowed plus the parts paid plus the refrigerant paid plus the leak
        search paid plus the diagnostic paid plus the premium paid, capped at the tier's per-claim limit and at the contract's
        remaining claim benefit, and the approved amount written on the decision is that capped figure rounded to the cent,
        half up, with every intermediate figure kept unrounded.
        Each line's net is the line charged on the claim's service call less the Comfort Club member discount posted against
        that line, which is the member repair discount on a labor, parts or leak search line, the member diagnostic rate on
        the diagnostic fee and the member premium discount on the after-hours premium; the labor and parts lines are the ones
        billed under the price-book task of the failed component, and the leak search line is the one billed under the
        refrigerant leak search task.
        Under the standard method the labor allowed is the labor net up to the tier's labor sublimit for the failed component
        (motor, control, compressor, coil or heat exchanger sublimit, and no sublimit for any other covered component), and
        the parts paid are the parts net where the tier covers parts within its parts coverage years and no manufacturer parts
        warranty applies on the failure date, and zero where one applies.
        The manufacturer parts warranty applies while the failure date is within the parts years confirmed by the manufacturer
        registration on the contract's Harbison installation, or within the manufacturer's unregistered parts term where no
        registration exists, counted in whole calendar months from the installed date.
        Under the standard method, on a failure in the refrigerant circuit (a compressor, condenser coil, evaporator coil,
        metering device or reversing valve), the refrigerant paid is the pounds billed on the claim's service call up to the
        tier's refrigerant pound limit times the billed price per pound where the tier covers refrigerant, and the leak search
        paid is the leak search net where the tier covers the leak search.
        Under the standard method the diagnostic paid and the premium paid are the diagnostic net and the premium net where the
        tier covers each of them, and each is paid only on the first claim decided on that service call.
      params: [per_claim_limit_usd, motor_labor_sublimit_usd, control_labor_sublimit_usd, compressor_labor_sublimit_usd, coil_labor_sublimit_usd, heat_exchanger_labor_sublimit_usd, parts_coverage_years, refrigerant_covered, refrigerant_max_lbs_per_claim, refrigerant_leak_search_covered, diagnostic_fee_covered, after_hours_premium_covered]
    inputs:
      history:
        - {table: warranty_claim_entries, aggregate: latest, field: ticket_id, filters: {event_type: warranty_claim_file}}
        - {table: warranty_claim_entries, aggregate: count, field: claim_entry_id, filters: {event_type: warranty_claim_decide}}
        - {category: service, table: service_lines, aggregate: sum, field: quantity, within_months: 12, filters: {line_type: refrigerant}}
        - {category: service, table: service_lines, aggregate: sum, field: amount, filters: {event_type: service_charge}}
        - {category: install, table: install_ledger, aggregate: latest, field: registered_parts_years, filters: {line_type: mfr_registration}}
      cross_category: [service, install, plan]
  - id: warranty_ext_transfer_benefit_carryover
    base_policy_refs: [warranty_activation, warranty_home_sale_transfer]
    overwrite:
      - base_policy: warranty_activation
        superseded_clause: >-
          or, on a transfer, the seller's claim_limit_remaining with reason transfer_carryover
        replaced_by: >-
          On a transfer of a parts-and-labor contract the buyer's contract is granted the carried benefit, with reason
          transfer carryover.
      - base_policy: warranty_home_sale_transfer
        superseded_clause: >-
          and the seller's remaining claim benefit carried over
        replaced_by: >-
          The carried benefit is the open benefit multiplied by the maintenance-continuity share, the equipment-age share,
          the term-proration share, the claims-experience share and the transfer-timing share, all applied to the same open
          benefit, and rounded to the cent, half up, once at the end.
    trigger: on_request
    subject: [warranty_limit_grant]
    computes: carried_benefit
    target_tool: confirm_protection_transfer_64743e30
    params:
      maint_share_twelve_months_or_more: 0.75
      maint_share_seven_to_eleven_months: 0.90
      age_share_over_120_months: 0.80
      age_share_85_to_120_months: 0.90
      experience_share_two_or_more: 0.85
      experience_share_one: 0.95
      timing_share_over_30_days: 0.93
      timing_share_15_to_30_days: 0.97
    rule: >-
      This policy fixes the claim benefit carried to the buyer when the holder of a Harbison 10-Year Parts & Labor
      Protection, Harbison 12-Year Total Protection or Harbison 12-Year Total Protection Plus contract, the parts-and-labor
      tiers, confirms the home-sale transfer request on file; the transfer takes effect on the date of confirmation, the
      seller's contract closes as transferred and the buyer's contract is issued and activated on the same day with the
      same tier, scope, units and coverage dates.
      The claim benefit carried to the buyer is fixed only after every claim filed on the seller's contract carries its
      original decision.
      Under the standard method the open benefit is the seller's remaining claim benefit less the reserve for the seller's
      claims, which is the approved amounts of the original decisions on the seller's contract not yet matched by claim
      payouts, never below zero, and the carried benefit is the open benefit rounded to the cent, half up.
      On a transfer of a parts-and-labor contract the buyer's contract is granted the carried benefit, with reason
      transfer carryover.
      The carried benefit is the open benefit multiplied by the maintenance-continuity share, the equipment-age share,
      the term-proration share, the claims-experience share and the transfer-timing share, all applied to the same open
      benefit, and rounded to the cent, half up, once at the end.
      The maintenance-continuity share is set by the latest documented maintenance on a covered unit recorded by the date of
      handling, being the latest of the completed Comfort Club tune-ups recorded on the primary and on the paired covered
      unit and the latest precision tune-up charge line on the holder's Harbison invoices, counted in whole calendar months
      to the closing date on the transfer request: twelve months or more takes the twelve-months-or-more continuity share,
      seven to eleven months takes the seven-to-eleven-month continuity share, and six months or fewer, a record dated after
      the closing included, takes a share of one.
      The equipment-age share is set by the whole calendar months from the installed date of the Harbison installation named
      on the contract, or from the coverage start where it names none, to the closing date: more than one hundred twenty
      months takes the over-one-hundred-twenty-month equipment-age share, more than eighty-four and up to one hundred twenty
      months takes the eighty-five-to-one-hundred-twenty-month equipment-age share, and eighty-four months or fewer takes a
      share of one.
      The term-proration share is set by the whole calendar months of the coverage term elapsed from the coverage start to the
      closing date: where more than three quarters of the term's months have elapsed, the share is the months still to run
      divided by the term's months; where more than half but no more than three quarters have elapsed, the share is one less
      the months elapsed beyond the midpoint divided by the term's months; where half or less has elapsed, the share is one.
      The claims-experience share is set by the number of claims on the seller's contract whose original decision approved or
      partially approved them within the thirty-six calendar months before the date of handling: two or more takes the
      two-or-more-claims transfer experience share, exactly one takes the one-claim transfer experience share, and none
      takes a share of one.
      The transfer-timing share is set by the calendar days from the closing date to the date of handling: more than thirty
      days takes the over-thirty-day timing share, fifteen to thirty days takes the fifteen-to-thirty-day timing share, and
      fourteen days or fewer takes a share of one.
    prerequisite:
      - problem: warranty_ext_parts_labor_claim_decision
        kind: value_input
        gate: reserved_claims
        form: state
        policy_source: >-
          The claim benefit carried to the buyer is fixed only after every claim filed on the seller's contract carries its
          original decision.
        condition: >-
          Every claim-file entry on the seller's contract has a decision entry (decision round 1) posted on the contract.
        resolved_by: decide_parts_labor_claim_22401446
        effect: >-
          The original decision adds its approved amount to the approved amounts not yet matched by payouts, which raises the
          reserve for the seller's claims and lowers the open benefit, and adds one approved claim to the claims-experience
          count.
    cross_category:
      - category: plan
        as: history
        reads: [plan_service_entries.entry_date]
        note: The latest completed Comfort Club tune-up on a covered unit sets the maintenance-continuity share.
      - category: service
        as: history
        reads: [service_lines.posted_date]
        note: Paid precision tune-up lines on the holder's invoices also count as documented maintenance for the continuity share.
      - category: install
        as: branch
        reads: [installed_date]
        note: The installation's installed date sets the equipment-age share.
    compute:
      - remaining_benefit: "F('claim_limit_remaining')"
      - approved_original: "SUM('warranty_claim_entries', 'amount', date_field='entry_date', event_type='warranty_claim_decide', decision_round=1, decision='approved') + SUM('warranty_claim_entries', 'amount', date_field='entry_date', event_type='warranty_claim_decide', decision_round=1, decision='partially_approved')"
      - payouts_made: "SUM('warranty_claim_entries', 'amount', date_field='entry_date', event_type='warranty_claim_payout')"
      - reserved_claims: "MX(0, approved_original - payouts_made)"
      - open_benefit: "MX(0, remaining_benefit - reserved_claims)"
      - closing_date: "LATEST('warranty_change_requests', 'property_sale_date', date_field='created_at', request_type='transfer')"
      - primary_maint: "XLATEST('plan', 'plan_service_entries', 'entry_date', date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit', equipment_id=F('equipment_id'))"
      - paired_maint: "XLATEST('plan', 'plan_service_entries', 'entry_date', date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit', equipment_id=F('paired_equipment_id'))"
      - paid_maint: "XLATEST('service', 'service_lines', 'posted_date', date_field='posted_date', event_type='service_charge', line_type='maintenance_tuneup', task_code='precision_tuneup')"
      - latest_maint: "MX(primary_maint or '0000-01-01', paired_maint or '0000-01-01', paid_maint or '0000-01-01')"
      - months_since_maint: "MONTHS(latest_maint, closing_date)"
      - continuity_share: "K('maint_share_twelve_months_or_more') if months_since_maint >= 12 else (K('maint_share_seven_to_eleven_months') if months_since_maint >= 7 else 1)"
      - installed_on: "CFIELD('install', 'installed_date', install_id=F('install_id')) or F('coverage_start')"
      - months_installed: "MONTHS(installed_on, closing_date)"
      - equipment_age_share: "K('age_share_over_120_months') if months_installed > 120 else (K('age_share_85_to_120_months') if months_installed > 84 else 1)"
      - term_months: "P('labor_coverage_years') * 12"
      - months_elapsed: "MONTHS(F('coverage_start'), closing_date)"
      - proration_share: "(term_months - months_elapsed) / term_months if months_elapsed > term_months * 0.75 else ((1 - (months_elapsed - term_months / 2) / term_months) if months_elapsed > term_months / 2 else 1)"
      - approved_36m: "COUNT('warranty_claim_entries', within_months=36, date_field='entry_date', event_type='warranty_claim_decide', decision_round=1, decision='approved') + COUNT('warranty_claim_entries', within_months=36, date_field='entry_date', event_type='warranty_claim_decide', decision_round=1, decision='partially_approved')"
      - transfer_experience_share: "K('experience_share_two_or_more') if approved_36m >= 2 else (K('experience_share_one') if approved_36m == 1 else 1)"
      - days_since_closing: "DAYS(closing_date, NOW)"
      - timing_share: "K('timing_share_over_30_days') if days_since_closing > 30 else (K('timing_share_15_to_30_days') if days_since_closing >= 15 else 1)"
      - carried_unrounded: "open_benefit * continuity_share * equipment_age_share * proration_share * transfer_experience_share * timing_share"
      - result: "int(carried_unrounded * 100 + 0.5) / 100"
    compute_basis:
      remaining_benefit: "the seller's remaining claim benefit"
      approved_original: "the approved amounts of the original decisions on the seller's contract"
      payouts_made: "not yet matched by claim payouts"
      reserved_claims: "the reserve for the seller's claims, which is the approved amounts of the original decisions on the seller's contract not yet matched by claim payouts, never below zero"
      open_benefit: "Under the standard method the open benefit is the seller's remaining claim benefit less the reserve for the seller's claims"
      closing_date: "counted in whole calendar months to the closing date on the transfer request"
      primary_maint: "the completed Comfort Club tune-ups recorded on the primary and on the paired covered unit"
      paired_maint: "the completed Comfort Club tune-ups recorded on the primary and on the paired covered unit"
      paid_maint: "the latest precision tune-up charge line on the holder's Harbison invoices"
      latest_maint: "The maintenance-continuity share is set by the latest documented maintenance on a covered unit recorded by the date of handling"
      months_since_maint: "counted in whole calendar months to the closing date on the transfer request"
      continuity_share: "twelve months or more takes the twelve-months-or-more continuity share, seven to eleven months takes the seven-to-eleven-month continuity share, and six months or fewer, a record dated after the closing included, takes a share of one."
      installed_on: "from the installed date of the Harbison installation named on the contract, or from the coverage start where it names none, to the closing date"
      months_installed: "The equipment-age share is set by the whole calendar months from the installed date of the Harbison installation named on the contract, or from the coverage start where it names none, to the closing date"
      equipment_age_share: "more than one hundred twenty months takes the over-one-hundred-twenty-month equipment-age share, more than eighty-four and up to one hundred twenty months takes the eighty-five-to-one-hundred-twenty-month equipment-age share, and eighty-four months or fewer takes a share of one."
      term_months: "divided by the term's months"
      months_elapsed: "The term-proration share is set by the whole calendar months of the coverage term elapsed from the coverage start to the closing date"
      proration_share: "where more than three quarters of the term's months have elapsed, the share is the months still to run divided by the term's months; where more than half but no more than three quarters have elapsed, the share is one less the months elapsed beyond the midpoint divided by the term's months; where half or less has elapsed, the share is one."
      approved_36m: "The claims-experience share is set by the number of claims on the seller's contract whose original decision approved or partially approved them within the thirty-six calendar months before the date of handling"
      transfer_experience_share: "two or more takes the two-or-more-claims transfer experience share, exactly one takes the one-claim transfer experience share, and none takes a share of one."
      days_since_closing: "The transfer-timing share is set by the calendar days from the closing date to the date of handling"
      timing_share: "more than thirty days takes the over-thirty-day timing share, fifteen to thirty days takes the fifteen-to-thirty-day timing share, and fourteen days or fewer takes a share of one."
      carried_unrounded: "The carried benefit is the open benefit multiplied by the maintenance-continuity share, the equipment-age share, the term-proration share, the claims-experience share and the transfer-timing share, all applied to the same open benefit"
      result: "and rounded to the cent, half up, once at the end."
    factors:
      - id: maintenance_continuity_share
        effect: parameter
        decides: continuity_share
        bindings: [primary_maint, paired_maint, paid_maint, latest_maint, months_since_maint, continuity_share]
        ladder:
          - when: "the latest documented maintenance on a covered unit is twelve or more whole months before the closing date"
            value: "K('maint_share_twelve_months_or_more')"
          - when: "seven to eleven whole months before the closing date"
            value: "K('maint_share_seven_to_eleven_months')"
          - when: "otherwise (six months or fewer, or recorded after the closing)"
            value: "1"
        baseline:
          continuity_share: "1"
        evidence: [cross_category, history, date]
        cross_difficulty: plan
      - id: equipment_age_transfer_share
        effect: parameter
        decides: equipment_age_share
        bindings: [installed_on, months_installed, equipment_age_share]
        ladder:
          - when: "more than one hundred twenty whole months from the installed date to the closing date"
            value: "K('age_share_over_120_months')"
          - when: "more than eighty-four and up to one hundred twenty months"
            value: "K('age_share_85_to_120_months')"
          - when: "otherwise (eighty-four months or fewer)"
            value: "1"
        baseline:
          equipment_age_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: install
      - id: term_proration_method
        effect: method
        decides: proration_share
        bindings: [months_elapsed, proration_share]
        ladder:
          - when: "more than three quarters of the term's months have elapsed at the closing date"
            method: "share = months still to run divided by the term's months"
          - when: "more than half but no more than three quarters have elapsed"
            method: "share = one less the months elapsed beyond the midpoint divided by the term's months"
          - when: "otherwise (half or less elapsed)"
            method: "share of one (no proration)"
        baseline:
          proration_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: transfer_claims_experience_share
        effect: parameter
        decides: transfer_experience_share
        bindings: [approved_36m, transfer_experience_share]
        ladder:
          - when: "two or more claims approved or partially approved on their original decision within the thirty-six months before the date of handling"
            value: "K('experience_share_two_or_more')"
          - when: "exactly one such claim"
            value: "K('experience_share_one')"
          - when: "otherwise (none)"
            value: "1"
        baseline:
          transfer_experience_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: transfer_timing_share
        effect: parameter
        decides: timing_share
        bindings: [days_since_closing, timing_share]
        ladder:
          - when: "more than thirty calendar days from the closing date to the date of handling"
            value: "K('timing_share_over_30_days')"
          - when: "fifteen to thirty days"
            value: "K('timing_share_15_to_30_days')"
          - when: "otherwise (fourteen days or fewer)"
            value: "1"
        baseline:
          timing_share: "1"
        evidence: [date, history]
        cross_difficulty: null
    baseline:
      rule: >-
        Under the standard method the open benefit is the seller's remaining claim benefit less the reserve for the seller's
        claims, which is the approved amounts of the original decisions on the seller's contract not yet matched by claim
        payouts, never below zero, and the carried benefit is the open benefit rounded to the cent, half up.
        On a transfer of a parts-and-labor contract the buyer's contract is granted the carried benefit, with reason
        transfer carryover.
      params: [labor_coverage_years]
    inputs:
      history:
        - {table: warranty_claim_entries, aggregate: sum, field: amount, filters: {event_type: warranty_claim_decide, decision_round: 1}}
        - {table: warranty_claim_entries, aggregate: sum, field: amount, filters: {event_type: warranty_claim_payout}}
        - {table: warranty_claim_entries, aggregate: count, field: claim_entry_id, within_months: 36, filters: {event_type: warranty_claim_decide}}
        - {table: warranty_change_requests, aggregate: latest, field: property_sale_date, filters: {request_type: transfer}}
        - {category: plan, table: plan_service_entries, aggregate: latest, field: entry_date, filters: {entry_reason: completed_visit}}
      cross_category: [plan, service, install]
