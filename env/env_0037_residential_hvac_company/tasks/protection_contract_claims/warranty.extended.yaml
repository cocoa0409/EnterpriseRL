events:
  - type: warranty_register
    target: warranty_contracts
    mutation: create
    meaning: A protection contract is issued on a unit or matched system - included with an installation, bought, or issued to a home buyer by transfer - and waits in pending until coverage starts.
    grain: One row per contract issued.
    fields:
      contract_id: Reference number assigned to the contract.
      customer_id: Holder.
      equipment_id: Primary covered unit.
      paired_equipment_id: Paired unit of a matched system, else empty.
      install_id: Harbison installation of the covered equipment, else empty.
      variant_name: Protection tier.
      purchase_date: Date issued (the date of handling).
      purchase_channel: with_installation, post_install_window, aftermarket_inspected or transfer.
      equipment_scope: single_unit or matched_system.
      contract_price: Price under warranty_pricing; 0.00 for the included workmanship warranty and for transfers.
      transferred_from_contract_id: Seller's contract for a transfer, else empty.
    triggers:
      - event: warranty:warranty_charge
        when: {purchase_channel: [post_install_window, aftermarket_inspected]}
        map: {contract_id: contract_id, customer_id: customer_id, line_type: contract_price, amount: contract_price}
      - event: warranty:warranty_charge
        when: {purchase_channel: aftermarket_inspected}
        map: {contract_id: contract_id, customer_id: customer_id, line_type: inspection_fee}
      - event: warranty:warranty_charge
        when: {purchase_channel: transfer, variant_name: [Harbison 5-Year Labor Protection, Harbison 10-Year Labor Protection, Harbison 10-Year Parts & Labor Protection, Harbison 12-Year Total Protection, Harbison 12-Year Total Protection Plus]}
        map: {contract_id: contract_id, customer_id: customer_id, line_type: transfer_fee}

  - type: warranty_activate
    target: warranty_contracts
    mutation: {transition: {from: pending, to: active}}
    meaning: Coverage starts on the contract.
    grain: One row per transaction.
    fields:
      contract_id: Contract activated.
      status: Set to active.
      purchase_channel: How the contract was obtained.
      coverage_start: First covered day under warranty_activation.
      coverage_end: Last covered day under warranty_activation.
    triggers:
      - event: warranty:warranty_limit_grant
        when: {purchase_channel: [with_installation, post_install_window, aftermarket_inspected]}
        map: {contract_id: contract_id, grant_reason: activation}
      - event: warranty:warranty_limit_grant
        when: {purchase_channel: transfer}
        map: {contract_id: contract_id, grant_reason: transfer_carryover}

  - type: warranty_charge
    target: warranty_billing_entries
    meaning: An amount is billed on the contract - its price, the aftermarket inspection, a claim service fee or a transfer fee.
    grain: One row per charge; claim service fees are one per service visit.
    distinguish_by: [line_type, ticket_id]
    fields:
      contract_id: Contract billed.
      customer_id: Holder billed.
      line_type: contract_price, inspection_fee, claim_service_fee or transfer_fee.
      amount: Amount billed.
      posted_date: Date posted.
      claim_id: Claim whose approval made a claim service fee due, else empty.
      ticket_id: Service visit a claim service fee is charged for, else empty.
    account: contract_balance
    direction: in
    triggers: []

  - type: warranty_payment
    target: warranty_billing_entries
    meaning: The holder pays an amount owed on the contract.
    grain: One row per payment received.
    distinguish_by: [payment_reference]
    fields:
      contract_id: Contract paid.
      customer_id: Paying holder.
      line_type: Always contract_payment.
      amount: Amount paid.
      posted_date: Date posted.
      payment_method: card, ach or check.
      payment_reference: Processor confirmation or check number.
    account: contract_balance
    direction: out
    triggers: []

  - type: warranty_credit
    target: warranty_billing_entries
    meaning: A credit reduces what the holder owes - a cancellation refund, a waived claim service fee, or the price of a contract declined at inspection.
    grain: One row per credit, tied to the charge it offsets.
    distinguish_by: [line_type, source_billing_id]
    fields:
      contract_id: Contract credited.
      customer_id: Holder credited.
      line_type: cancellation_refund_credit, service_fee_waiver_credit or inspection_failure_credit.
      amount: Amount credited.
      posted_date: Date posted.
      claim_id: Claim whose service fee is waived, else empty.
      source_billing_id: The contract-price charge being refunded or the claim service fee being waived.
    account: contract_balance
    direction: out
    triggers:
      - event: warranty:warranty_refund_issued
        when: {line_type: [cancellation_refund_credit, inspection_failure_credit]}
        map: {contract_id: contract_id, customer_id: customer_id, source_billing_id: warranty_billing_id, line_type: refund_payout}

  - type: warranty_refund_issued
    target: warranty_billing_entries
    meaning: A credit balance on a closed contract is paid back to the holder.
    grain: One row per payout, tied to the credit it pays out.
    distinguish_by: [source_billing_id]
    fields:
      contract_id: Contract refunded.
      customer_id: Holder refunded.
      line_type: Always refund_payout.
      amount: Amount paid out, equal to the negative contract balance being cleared.
      posted_date: Date of payout.
      payment_method: Always original_payment_method.
      payment_reference: Payout confirmation number.
      source_billing_id: The credit being paid out.
    account: contract_balance
    direction: in
    triggers: []

  - type: warranty_limit_grant
    target: warranty_claim_entries
    meaning: The contract's lifetime claim benefit is made available when coverage starts.
    grain: One row per contract and grant reason.
    distinguish_by: [grant_reason]
    fields:
      contract_id: Contract granted.
      customer_id: Holder.
      grant_reason: activation or transfer_carryover.
      amount: lifetime_claim_limit_usd on activation; the seller's claim_limit_remaining on a transfer.
      entry_date: Date posted.
    account: claim_limit
    direction: in
    triggers: []

  - type: warranty_claim_file
    target: warranty_claim_entries
    meaning: A claim is opened for a failed component diagnosed on a Harbison service call.
    grain: One row per failed component per service call.
    distinguish_by: [ticket_id, component]
    fields:
      contract_id: Contract claimed against.
      customer_id: Holder.
      claim_id: Equal to this entry's own reference number.
      ticket_id: Service call on which the failure was diagnosed and repaired.
      equipment_id: Failed unit.
      component: Failed component.
      failure_date: Completed date of that service call.
      entry_date: Filing date (the date of handling).
    triggers: []

  - type: warranty_claim_decide
    target: warranty_claim_entries
    meaning: A claim is approved, partly approved or denied, originally or on appeal.
    grain: One row per decision round per claim.
    distinguish_by: [claim_id, decision_round]
    fields:
      contract_id: Contract.
      customer_id: Holder.
      claim_id: Claim decided.
      ticket_id: Service call of the claim.
      decision: approved, partially_approved or denied.
      denial_reason: Governing reason for a denial or for the denied part of a partial approval.
      decision_round: 1 for the original decision, 2 for an appeal.
      amount: Approved amount; 0.00 on a denial.
      entry_date: Decision date (the date of handling).
    triggers:
      - event: warranty:warranty_claim_payout
        when: {decision: [approved, partially_approved]}
        map: {contract_id: contract_id, customer_id: customer_id, claim_id: claim_id, ticket_id: ticket_id}

  - type: warranty_claim_payout
    target: warranty_claim_entries
    meaning: An approved claim pays part of the service invoice, or pays toward a no-lemon replacement unit.
    grain: One row per claim per payout component.
    distinguish_by: [claim_id, payout_component]
    fields:
      contract_id: Contract paying.
      customer_id: Holder.
      claim_id: Claim paid.
      ticket_id: Service call whose invoice is paid.
      payout_component: parts, labor, refrigerant, diagnostic, after_hours_premium or unit_replacement.
      amount: Amount paid.
      entry_date: Date posted.
    account: claim_limit
    direction: out
    triggers:
      - event: service:service_coverage_credit
        when: {payout_component: {not: unit_replacement}}
        map: {ticket_id: ticket_id, customer_id: customer_id, claim_id: claim_id, amount: amount, line_type: warranty_claim_coverage}
      - event: install:install_credit
        when: {payout_component: unit_replacement}
        map: {customer_id: customer_id, claim_id: claim_id, amount: amount, line_type: warranty_unit_replacement_credit}

  - type: warranty_transfer
    target: warranty_contracts
    mutation: {transition: {from: active, to: transferred}}
    meaning: The holder's confirmed transfer moves the contract to the buyer of the home.
    grain: One row per transaction.
    fields:
      contract_id: Seller's contract.
      status: Set to transferred.
      closed_date: Date the transfer takes effect.
      equipment_id: Covered unit.
      paired_equipment_id: Paired unit, if any.
      install_id: Installation of the covered equipment, if any.
      variant_name: Tier carried over.
      equipment_scope: Scope carried over.
    triggers:
      - event: warranty:warranty_register
        map: {equipment_id: equipment_id, paired_equipment_id: paired_equipment_id, install_id: install_id, variant_name: variant_name, equipment_scope: equipment_scope, transferred_from_contract_id: contract_id, purchase_channel: transfer, contract_price: 0.0}

  - type: warranty_cancel
    target: warranty_contracts
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The holder's confirmed cancellation takes effect.
    grain: One row per transaction.
    fields:
      contract_id: Contract.
      status: Set to cancelled.
      closed_date: Date the cancellation takes effect.
      variant_name: Tier cancelled.
    triggers:
      - event: warranty:warranty_credit
        when: {variant_name: [Harbison 5-Year Labor Protection, Harbison 10-Year Labor Protection, Harbison 10-Year Parts & Labor Protection, Harbison 12-Year Total Protection, Harbison 12-Year Total Protection Plus]}
        map: {contract_id: contract_id, line_type: cancellation_refund_credit}

  - type: warranty_decline
    target: warranty_contracts
    mutation: {transition: {from: pending, to: cancelled}}
    meaning: Existing equipment fails the aftermarket inspection and the purchase is declined.
    grain: One row per transaction.
    fields:
      contract_id: Contract.
      status: Set to cancelled.
      closed_date: Date of the declined inspection.
    triggers:
      - event: warranty:warranty_credit
        map: {contract_id: contract_id, line_type: inspection_failure_credit}

  - type: warranty_expire
    target: warranty_contracts
    mutation: {transition: {from: active, to: expired}}
    meaning: Coverage ends after coverage_end.
    grain: One row per transaction.
    fields:
      contract_id: Contract.
      status: Set to expired.
      closed_date: The day after coverage_end.
    triggers: []

measures:
  - id: warranty_msr_last_maintenance_date
    window: All history of the failed unit up to and including the failure_date.
    measure: Latest date among plan_tuneup_visit entries with entry_reason completed_visit for that equipment_id and service tickets on that equipment_id carrying a paid maintenance_tuneup charge line (the ticket's completed_date), on or before the failure_date; empty when none exists.
  - id: warranty_msr_claim_covered_lines_net
    window: One claim (the claim's service ticket and failed component).
    measure: Per payout component, sum of amount over the ticket's service_charge lines for the failed component's task (repair_parts, repair_labor, refrigerant for refrigerant-circuit failures) and, where covered, the visit's diagnostic_fee and after_hours_premium lines, each net of the member discounts applied to the same line, labor capped at the component's labor sublimit and refrigerant capped at refrigerant_max_lbs_per_claim pounds at the billed price per pound.
  - id: warranty_msr_claims_paid
    window: The contract's whole life up to the date of handling.
    measure: Sum of amount over warranty_claim_payout entries on the contract.
  - id: warranty_msr_unused_full_months
    window: From the date a cancellation takes effect through coverage_end inclusive.
    measure: Count of whole calendar months remaining, counted as complete month-to-month steps from the effective date that end on or before coverage_end (a partial month counts as zero).
  - id: warranty_msr_no_lemon_failures
    window: From the covered unit's coverage_start through no_lemon_window_years later, including the failure being decided.
    measure: Count of claims on the unit for component compressor or heat_exchanger whose latest decision is approved or partially_approved, counting the claim being decided.
  - id: warranty_msr_transfer_count
    window: The contract's whole chain of predecessors.
    measure: Number of transfers already made, counted by following transferred_from_contract_id back to the original contract.

policies:
  - id: warranty_agg_multi_holding
    subject: [warranty_register]
    rule: >-
      A customer may hold any number of protection contracts, one chain per unit or matched system at the service address; there
      is no per-customer cap. Each contract covers only the unit named on it, plus the paired unit when its scope is
      matched_system, and claims, limits and fees are kept per contract.
    eligibility: []
    params:
      max_per_customer: null

  - id: warranty_agg_one_contract_per_unit
    subject: [warranty_register, warranty_claim_file]
    rule: >-
      A unit may be covered by only one purchased protection contract in pending or active status at a time, counting a matched
      system contract against both of its units; the included Harbison 2-Year Workmanship Warranty does not count toward this
      limit and runs alongside a purchased contract on the same unit. When both are active on the failed unit, a claim for
      installation_workmanship or line_set is filed against the workmanship warranty, and every other component is filed against
      the purchased contract; when the workmanship warranty has ended, installation_workmanship and line_set claims go to the
      purchased contract only if that tier covers them. A buyer who wants a higher tier on a unit that already carries a
      purchased contract must cancel the existing contract first.
    eligibility:
      - id: one_purchased_contract_per_unit
        applies_to: [warranty_register]
        kind: dedup
        condition: A unit may be covered by only one purchased protection contract in pending or active status at a time
        evidence_fields: [warranty_contracts.equipment_id, warranty_contracts.paired_equipment_id, warranty_contracts.status, warranty_contracts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_contracts.equipment_id]
          action_bindings:
            warranty_contracts.equipment_id: equipment_id
        dedup_contract:
          table: warranty_contracts
          mode: separate_record
          object_bindings: {equipment_id: equipment_id}
          duplicate_filters:
            status: [pending, active]
            variant_name: [Harbison 5-Year Labor Protection, Harbison 10-Year Labor Protection, Harbison 10-Year Parts & Labor Protection, Harbison 12-Year Total Protection, Harbison 12-Year Total Protection Plus]
          distinct_fields: []
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {max_contracts: "=max_contracts_per_unit"}
        Harbison 5-Year Labor Protection: {max_contracts: "=max_contracts_per_unit"}
        Harbison 10-Year Labor Protection: {max_contracts: "=max_contracts_per_unit"}
        Harbison 10-Year Parts & Labor Protection: {max_contracts: "=max_contracts_per_unit"}
        Harbison 12-Year Total Protection: {max_contracts: "=max_contracts_per_unit"}
        Harbison 12-Year Total Protection Plus: {max_contracts: "=max_contracts_per_unit"}

  - id: warranty_agg_claim_service_fee_per_visit
    subject: [warranty_charge, warranty_credit]
    rule: >-
      A claim service fee is charged once per service visit on which at least one claim is approved or partially approved, no
      matter how many claims or contracts that visit involves; a visit whose claims are all denied carries no fee. Only one claim
      service fee is charged per service visit. When approved claims on one visit fall under contracts with different fees, the
      single fee is the highest of their claim_service_fee_usd values, charged on the contract carrying it and naming the first
      approved claim of the visit. No fee is charged when that highest fee is 0.00, and none is charged for a no-lemon unit
      replacement on a tier whose deductible_waived_for_unit_replacement is true. The fee is waived when the holder held a Comfort
      Club agreement in active status on the visit's completed_date at a tier whose warranty_claim_fee_waiver is true; a waived
      fee is not charged at all, and a fee already charged in error is reversed by a service_fee_waiver_credit naming it. The fee
      is due with the service invoice and an unpaid fee never suspends coverage.
    eligibility:
      - id: one_fee_per_visit
        applies_to: [warranty_charge]
        kind: dedup
        condition: Only one claim service fee is charged per service visit.
        evidence_fields: [warranty_billing_entries.ticket_id, warranty_billing_entries.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_billing_entries.ticket_id]
          action_bindings:
            warranty_billing_entries.ticket_id: ticket_id
        dedup_contract:
          table: warranty_billing_entries
          mode: separate_record
          object_bindings: {ticket_id: ticket_id}
          duplicate_filters: {line_type: [claim_service_fee]}
          distinct_fields: []
      - id: member_fee_waiver
        applies_to: [warranty_charge, warranty_credit]
        kind: authorization
        condition: The fee is waived when the holder held a Comfort Club agreement in active status on the visit's completed_date at a tier whose warranty_claim_fee_waiver is true
        evidence_fields: [plan_agreements.customer_id, plan_agreements.status, plan_agreements.variant_name, service_tickets.ticket_id, service_tickets.completed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {fee: "=claim_service_fee_usd", unit_replacement_fee_waived: "=deductible_waived_for_unit_replacement"}
        Harbison 5-Year Labor Protection: {fee: "=claim_service_fee_usd", unit_replacement_fee_waived: "=deductible_waived_for_unit_replacement"}
        Harbison 10-Year Labor Protection: {fee: "=claim_service_fee_usd", unit_replacement_fee_waived: "=deductible_waived_for_unit_replacement"}
        Harbison 10-Year Parts & Labor Protection: {fee: "=claim_service_fee_usd", unit_replacement_fee_waived: "=deductible_waived_for_unit_replacement"}
        Harbison 12-Year Total Protection: {fee: "=claim_service_fee_usd", unit_replacement_fee_waived: "=deductible_waived_for_unit_replacement"}
        Harbison 12-Year Total Protection Plus: {fee: "=claim_service_fee_usd", unit_replacement_fee_waived: "=deductible_waived_for_unit_replacement"}

  - id: warranty_purchase_eligibility
    subject: [warranty_register, warranty_charge]
    rule: >-
      The tier whose included_with_installation is true, the Harbison 2-Year Workmanship Warranty, is issued at no charge, with purchase_channel with_installation, on the day every
      Harbison installation is completed, covering the new equipment as a matched system when an indoor and outdoor unit were
      installed together; it can never be bought separately. A higher tier bought on the installation contract is billed on the
      installation project as a labor_warranty_upgrade and issued with purchase_channel with_installation on the day the
      installation is completed. A post-installation purchase is accepted only when the date of handling is no later than
      post_install_purchase_window_days calendar days after the installation was completed. Purchase-window days are counted as
      calendar days with the installed date as day 0, and a purchase on the last day of the window is accepted. A post-installation
      purchase needs no inspection and is open only on equipment Harbison installed, on tiers whose window is above 0. An
      aftermarket purchase on existing equipment is open only on tiers whose aftermarket_purchase_allowed is true, only for a
      brand listed in aftermarket_eligible_brands, and only after an inspection billed at aftermarket_inspection_fee_usd. An
      aftermarket purchase is accepted only when the date of handling is no later than aftermarket_max_equipment_age_years after
      the equipment was installed. Aftermarket age is counted in calendar months as aftermarket_max_equipment_age_years times
      twelve added to the equipment install date, falling back to the last day of the month when that day does not exist, and a
      purchase dated on that boundary is accepted. For a matched-system scope every age and window rule applies to both units,
      and matched_system scope is open only where matched_system_scope_available is true. The covered equipment must be in
      service at the holder's address. Contracts issued by transfer follow warranty_transfer only.
    eligibility:
      - id: post_install_window
        applies_to: [warranty_register]
        kind: time
        condition: A post-installation purchase is accepted only when the date of handling is no later than post_install_purchase_window_days calendar days after the installation was completed.
        evidence_fields: [install_projects.install_id, install_projects.installed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_projects.install_id]
          action_bindings:
            install_projects.install_id: install_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the installation was completed
          anchor_source: install_projects.installed_date
          relation: not_after
          duration_source: variants.post_install_purchase_window_days
          unit: calendar_days
          counting_rule: Purchase-window days are counted as calendar days with the installed date as day 0, and a purchase on the last day of the window is accepted.
          boundary: inclusive
      - id: aftermarket_age_limit
        applies_to: [warranty_register]
        kind: time
        condition: An aftermarket purchase is accepted only when the date of handling is no later than aftermarket_max_equipment_age_years after the equipment was installed.
        evidence_fields: [equipment.equipment_id, equipment.install_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [equipment.equipment_id]
          action_bindings:
            equipment.equipment_id: equipment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the equipment was installed
          anchor_source: equipment.install_date
          relation: not_after
          duration_source: variants.aftermarket_max_equipment_age_years
          unit: calendar_months
          counting_rule: Aftermarket age is counted in calendar months as aftermarket_max_equipment_age_years times twelve added to the equipment install date, falling back to the last day of the month when that day does not exist, and a purchase dated on that boundary is accepted.
          boundary: inclusive
      - id: covered_unit_in_service
        applies_to: [warranty_register]
        kind: state
        condition: The covered equipment must be in service at the holder's address.
        evidence_fields: [equipment.equipment_id, equipment.equipment_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [equipment.equipment_id]
          action_bindings:
            equipment.equipment_id: equipment_id
        state_contract:
          field: equipment.equipment_status
          allowed: [in_service]
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {window_days: "=post_install_purchase_window_days", aftermarket: "=aftermarket_purchase_allowed", max_age_years: "=aftermarket_max_equipment_age_years", inspection_fee: "=aftermarket_inspection_fee_usd"}
        Harbison 5-Year Labor Protection: {window_days: "=post_install_purchase_window_days", aftermarket: "=aftermarket_purchase_allowed", max_age_years: "=aftermarket_max_equipment_age_years", inspection_fee: "=aftermarket_inspection_fee_usd"}
        Harbison 10-Year Labor Protection: {window_days: "=post_install_purchase_window_days", aftermarket: "=aftermarket_purchase_allowed", max_age_years: "=aftermarket_max_equipment_age_years", inspection_fee: "=aftermarket_inspection_fee_usd"}
        Harbison 10-Year Parts & Labor Protection: {window_days: "=post_install_purchase_window_days", aftermarket: "=aftermarket_purchase_allowed", max_age_years: "=aftermarket_max_equipment_age_years", inspection_fee: "=aftermarket_inspection_fee_usd"}
        Harbison 12-Year Total Protection: {window_days: "=post_install_purchase_window_days", aftermarket: "=aftermarket_purchase_allowed", max_age_years: "=aftermarket_max_equipment_age_years", inspection_fee: "=aftermarket_inspection_fee_usd"}
        Harbison 12-Year Total Protection Plus: {window_days: "=post_install_purchase_window_days", aftermarket: "=aftermarket_purchase_allowed", max_age_years: "=aftermarket_max_equipment_age_years", inspection_fee: "=aftermarket_inspection_fee_usd"}

  - id: warranty_pricing
    subject: [warranty_register, warranty_charge]
    rule: >-
      The contract price depends on scope and capacity: a single unit of up to 3.0 nominal tons, or any heating-only unit, is
      priced at price_single_unit_up_to_3_tons_usd; a single unit over 3.0 tons at price_single_unit_over_3_tons_usd; a matched
      system whose outdoor unit is up to 3.0 tons at price_matched_system_up_to_3_tons_usd; and a matched system whose outdoor
      unit is over 3.0 tons at price_matched_system_over_3_tons_usd. Capacity is the nominal_tons on the equipment register,
      and exactly 3.0 tons falls in the up-to-3-tons band. A tier bought on the installation contract is discounted by
      with_installation_upgrade_discount_pct, rounded to the cent half up, and billed on the installation project rather than on
      the contract; contract_price records that discounted price. A post-installation or aftermarket purchase is billed on the
      contract as a contract_price charge at the full price, and an aftermarket purchase also carries an inspection_fee charge.
      The included workmanship warranty and a contract issued by transfer have a contract_price of 0.00.
    eligibility: []
    formula:
      with_installation_price_up_to_3_single: round(price_single_unit_up_to_3_tons_usd * (1 - with_installation_upgrade_discount_pct / 100), 2)
      with_installation_price_over_3_single: round(price_single_unit_over_3_tons_usd * (1 - with_installation_upgrade_discount_pct / 100), 2)
      with_installation_price_up_to_3_matched: round(price_matched_system_up_to_3_tons_usd * (1 - with_installation_upgrade_discount_pct / 100), 2)
      with_installation_price_over_3_matched: round(price_matched_system_over_3_tons_usd * (1 - with_installation_upgrade_discount_pct / 100), 2)
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {single_up_to_3: "=price_single_unit_up_to_3_tons_usd", single_over_3: "=price_single_unit_over_3_tons_usd", matched_up_to_3: "=price_matched_system_up_to_3_tons_usd", matched_over_3: "=price_matched_system_over_3_tons_usd", install_discount_pct: "=with_installation_upgrade_discount_pct"}
        Harbison 5-Year Labor Protection: {single_up_to_3: "=price_single_unit_up_to_3_tons_usd", single_over_3: "=price_single_unit_over_3_tons_usd", matched_up_to_3: "=price_matched_system_up_to_3_tons_usd", matched_over_3: "=price_matched_system_over_3_tons_usd", install_discount_pct: "=with_installation_upgrade_discount_pct"}
        Harbison 10-Year Labor Protection: {single_up_to_3: "=price_single_unit_up_to_3_tons_usd", single_over_3: "=price_single_unit_over_3_tons_usd", matched_up_to_3: "=price_matched_system_up_to_3_tons_usd", matched_over_3: "=price_matched_system_over_3_tons_usd", install_discount_pct: "=with_installation_upgrade_discount_pct"}
        Harbison 10-Year Parts & Labor Protection: {single_up_to_3: "=price_single_unit_up_to_3_tons_usd", single_over_3: "=price_single_unit_over_3_tons_usd", matched_up_to_3: "=price_matched_system_up_to_3_tons_usd", matched_over_3: "=price_matched_system_over_3_tons_usd", install_discount_pct: "=with_installation_upgrade_discount_pct"}
