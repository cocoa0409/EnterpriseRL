        Harbison 12-Year Total Protection Plus: {single_up_to_3: "=price_single_unit_up_to_3_tons_usd", single_over_3: "=price_single_unit_over_3_tons_usd", matched_up_to_3: "=price_matched_system_up_to_3_tons_usd", matched_over_3: "=price_matched_system_over_3_tons_usd", install_discount_pct: "=with_installation_upgrade_discount_pct"}

  - id: warranty_activation
    subject: [warranty_activate, warranty_limit_grant]
    rule: >-
      A contract issued with purchase_channel with_installation or post_install_window starts coverage on the installation's
      installed_date, so its term runs from the day the equipment was started up even when it was bought later, and it activates
      on issue once any contract price billed on the contract is paid. A purchased contract is activated only after its contract
      price has been paid in full. An aftermarket contract is activated only once aftermarket_waiting_period_days calendar days
      have passed since the contract was purchased. Waiting-period days are counted as calendar days with the purchase date as day
      0, and coverage starts on the day after the last waiting day. An aftermarket contract's coverage_start is that day, and a
      failure diagnosed before it is never covered. coverage_end is the day before the same calendar date labor_coverage_years
      after coverage_start. A contract issued by transfer activates on issue with the seller's coverage_start and coverage_end
      unchanged. Activation grants the claim benefit: lifetime_claim_limit_usd with reason activation, or, on a transfer, the
      seller's claim_limit_remaining with reason transfer_carryover.
    eligibility:
      - id: price_paid
        applies_to: [warranty_activate]
        kind: authorization
        condition: A purchased contract is activated only after its contract price has been paid in full.
        evidence_fields: [warranty_contracts.contract_id, warranty_contracts.contract_balance, warranty_billing_entries.contract_id, warranty_billing_entries.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_contracts.contract_id]
          action_bindings:
            warranty_contracts.contract_id: contract_id
      - id: aftermarket_waiting_period
        applies_to: [warranty_activate]
        kind: time
        condition: An aftermarket contract is activated only once aftermarket_waiting_period_days calendar days have passed since the contract was purchased.
        evidence_fields: [warranty_contracts.contract_id, warranty_contracts.purchase_date, warranty_contracts.purchase_channel]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_contracts.contract_id]
          action_bindings:
            warranty_contracts.contract_id: contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was purchased
          anchor_source: warranty_contracts.purchase_date
          relation: not_before
          duration_source: variants.aftermarket_waiting_period_days
          unit: calendar_days
          counting_rule: Waiting-period days are counted as calendar days with the purchase date as day 0, and coverage starts on the day after the last waiting day.
          boundary: exclusive
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {term_years: "=labor_coverage_years", waiting_days: "=aftermarket_waiting_period_days", lifetime_limit: "=lifetime_claim_limit_usd"}
        Harbison 5-Year Labor Protection: {term_years: "=labor_coverage_years", waiting_days: "=aftermarket_waiting_period_days", lifetime_limit: "=lifetime_claim_limit_usd"}
        Harbison 10-Year Labor Protection: {term_years: "=labor_coverage_years", waiting_days: "=aftermarket_waiting_period_days", lifetime_limit: "=lifetime_claim_limit_usd"}
        Harbison 10-Year Parts & Labor Protection: {term_years: "=labor_coverage_years", waiting_days: "=aftermarket_waiting_period_days", lifetime_limit: "=lifetime_claim_limit_usd"}
        Harbison 12-Year Total Protection: {term_years: "=labor_coverage_years", waiting_days: "=aftermarket_waiting_period_days", lifetime_limit: "=lifetime_claim_limit_usd"}
        Harbison 12-Year Total Protection Plus: {term_years: "=labor_coverage_years", waiting_days: "=aftermarket_waiting_period_days", lifetime_limit: "=lifetime_claim_limit_usd"}

  - id: warranty_evt_claim_coverage
    subject: [warranty_claim_file, warranty_claim_decide]
    rule: >-
      A claim is opened by the agent for each failed component a Harbison technician diagnosed and repaired on a service call;
      repairs by any other contractor are never reimbursed where third_party_repair_reimbursed is false. A claim is filed only against a contract whose status is active. A
      claim is accepted for decision only when it is filed no later than claim_filing_deadline_days calendar days after the
      failure was diagnosed. Filing-deadline days are counted as calendar days with the service call's completed_date as day 0,
      and a claim filed on the last day is accepted. The failure date is the completed_date of that service call, and the
      original decision is made on the filing date. The claim is decided in this order, and the first failing test governs the
      denial_reason: the failure date must fall within coverage_start through coverage_end (outside_coverage_term); the
      component must be in the tier's covered_components (component_not_covered); the claim must have been filed within the
      deadline (filed_after_deadline); where maintenance_required is true, documented maintenance must be current
      (maintenance_not_documented); the failure must not stem from an excluded cause - flood, fire, lightning or power surge,
      freezing of an unheated space, rodent or pest damage, or repair or alteration by anyone other than Harbison
      (excluded_cause); and claim_limit_remaining must be above 0.00 (limit_exhausted). Maintenance is current only when the most
      recent documented maintenance on the failed unit was completed no more than maintenance_interval_months months plus
      maintenance_grace_days days before the failure date; when coverage_start is itself later than that same cut-off, no
      maintenance record is required. Documented maintenance is one of the tier's maintenance_proof_sources: a completed Comfort Club tune-up on that unit or a
      paid precision tune-up service call on that unit, and a customer's own receipt from another contractor is not accepted. Parts are paid
      only for components the tier covers within parts_coverage_years and only when no manufacturer parts warranty applies on the
      failure date, because parts_secondary_to_manufacturer is true on every tier; the manufacturer term is the registered_parts_years confirmed by the installation's registration entry, or
      the manufacturer's unregistered term set in the install charter when no registration exists, counted from the installed
      date. When the manufacturer warranty supplies the part, the claim is partially_approved with denial_reason
      manufacturer_parts_coverage_applies for the parts and pays the remaining covered components; otherwise a claim passing every
      test is approved. Labor is paid only within labor_coverage_years, which is the contract term.
    eligibility:
      - id: claim_on_active_contract
        applies_to: [warranty_claim_file]
        kind: state
        condition: A claim is filed only against a contract whose status is active.
        evidence_fields: [warranty_contracts.contract_id, warranty_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_contracts.contract_id]
          action_bindings:
            warranty_contracts.contract_id: contract_id
        state_contract:
          field: warranty_contracts.status
          allowed: [active]
      - id: filing_deadline
        applies_to: [warranty_claim_file, warranty_claim_decide]
        kind: time
        condition: A claim is accepted for decision only when it is filed no later than claim_filing_deadline_days calendar days after the failure was diagnosed.
        evidence_fields: [service_tickets.ticket_id, service_tickets.completed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the failure was diagnosed
          anchor_source: service_tickets.completed_date
          relation: not_after
          duration_source: variants.claim_filing_deadline_days
          unit: calendar_days
          counting_rule: Filing-deadline days are counted as calendar days with the service call's completed_date as day 0, and a claim filed on the last day is accepted.
          boundary: inclusive
      - id: maintenance_current
        applies_to: [warranty_claim_decide]
        kind: authorization
        condition: Maintenance is current only when the most recent documented maintenance on the failed unit was completed no more than maintenance_interval_months months plus maintenance_grace_days days before the failure date
        evidence_fields: [plan_service_entries.equipment_id, plan_service_entries.entry_reason, plan_service_entries.entry_date, service_lines.ticket_id, service_lines.line_type, service_tickets.equipment_id, service_tickets.completed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.equipment_id]
          action_bindings:
            service_tickets.equipment_id: equipment_id
      - id: manufacturer_parts_first
        applies_to: [warranty_claim_decide]
        kind: authorization
        condition: Parts are paid only for components the tier covers within parts_coverage_years and only when no manufacturer parts warranty applies on the failure date
        evidence_fields: [install_ledger.install_id, install_ledger.line_type, install_ledger.registered_parts_years, install_projects.install_id, install_projects.installed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_projects.install_id]
          action_bindings:
            install_projects.install_id: install_id
    measures: [warranty_msr_last_maintenance_date]
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {components: "=covered_components", parts_years: "=parts_coverage_years", labor_years: "=labor_coverage_years", deadline_days: "=claim_filing_deadline_days", maintenance_required: "=maintenance_required"}
        Harbison 5-Year Labor Protection: {components: "=covered_components", parts_years: "=parts_coverage_years", labor_years: "=labor_coverage_years", deadline_days: "=claim_filing_deadline_days", maintenance_required: "=maintenance_required"}
        Harbison 10-Year Labor Protection: {components: "=covered_components", parts_years: "=parts_coverage_years", labor_years: "=labor_coverage_years", deadline_days: "=claim_filing_deadline_days", maintenance_required: "=maintenance_required"}
        Harbison 10-Year Parts & Labor Protection: {components: "=covered_components", parts_years: "=parts_coverage_years", labor_years: "=labor_coverage_years", deadline_days: "=claim_filing_deadline_days", maintenance_required: "=maintenance_required"}
        Harbison 12-Year Total Protection: {components: "=covered_components", parts_years: "=parts_coverage_years", labor_years: "=labor_coverage_years", deadline_days: "=claim_filing_deadline_days", maintenance_required: "=maintenance_required"}
        Harbison 12-Year Total Protection Plus: {components: "=covered_components", parts_years: "=parts_coverage_years", labor_years: "=labor_coverage_years", deadline_days: "=claim_filing_deadline_days", maintenance_required: "=maintenance_required"}

  - id: warranty_evt_claim_payout
    subject: [warranty_claim_payout, warranty_claim_decide]
    rule: >-
      An approved or partially approved claim pays the failed component's lines on the service invoice after the Comfort Club
      member discount on each line has been applied: labor is paid up to the labor sublimit for that component
      (compressor_labor_sublimit_usd for a compressor, coil_labor_sublimit_usd for an evaporator or condenser coil,
      heat_exchanger_labor_sublimit_usd for a heat exchanger, motor_labor_sublimit_usd for a blower, condenser fan or inducer
      motor, control_labor_sublimit_usd for a control board, defrost board or gas valve, and no sublimit for any other covered
      component); parts are paid in full where the claim covers parts; refrigerant is paid where refrigerant_covered is true for
      a failure in the refrigerant circuit, up to refrigerant_max_lbs_per_claim pounds, together with the leak search task where
      refrigerant_leak_search_covered is true; the visit's diagnostic fee is paid where diagnostic_fee_covered is true and its
      after-hours premium where after_hours_premium_covered is true, each only on the first claim of the visit. The total is
      capped at per_claim_limit_usd and at claim_limit_remaining; when a cap binds, the payout is allocated in the order labor,
      parts, refrigerant, diagnostic, after_hours_premium. The approved amount on the decision equals that capped total. Each
      payout component posts as one payout naming the claim and the service call, and lands on the invoice as a warranty
      coverage credit; anything the payout does not cover stays on the invoice for the customer or for Comfort Club covered
      repairs.
    eligibility:
      - id: decision_approves
        applies_to: [warranty_claim_payout]
        kind: authorization
        condition: An approved or partially approved claim pays the failed component's lines on the service invoice after the Comfort Club member discount on each line has been applied
        evidence_fields: [warranty_claim_entries.claim_id, warranty_claim_entries.decision, warranty_claim_entries.decision_round]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_claim_entries.claim_id]
          action_bindings:
            warranty_claim_entries.claim_id: claim_id
    formula:
      approved_amount: min(warranty_msr_claim_covered_lines_net, per_claim_limit_usd, claim_limit)
    measures: [warranty_msr_claim_covered_lines_net]
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {per_claim_limit: "=per_claim_limit_usd", compressor_labor: "=compressor_labor_sublimit_usd", coil_labor: "=coil_labor_sublimit_usd", heat_exchanger_labor: "=heat_exchanger_labor_sublimit_usd", motor_labor: "=motor_labor_sublimit_usd", control_labor: "=control_labor_sublimit_usd", refrigerant_lbs: "=refrigerant_max_lbs_per_claim"}
        Harbison 5-Year Labor Protection: {per_claim_limit: "=per_claim_limit_usd", compressor_labor: "=compressor_labor_sublimit_usd", coil_labor: "=coil_labor_sublimit_usd", heat_exchanger_labor: "=heat_exchanger_labor_sublimit_usd", motor_labor: "=motor_labor_sublimit_usd", control_labor: "=control_labor_sublimit_usd", refrigerant_lbs: "=refrigerant_max_lbs_per_claim"}
        Harbison 10-Year Labor Protection: {per_claim_limit: "=per_claim_limit_usd", compressor_labor: "=compressor_labor_sublimit_usd", coil_labor: "=coil_labor_sublimit_usd", heat_exchanger_labor: "=heat_exchanger_labor_sublimit_usd", motor_labor: "=motor_labor_sublimit_usd", control_labor: "=control_labor_sublimit_usd", refrigerant_lbs: "=refrigerant_max_lbs_per_claim"}
        Harbison 10-Year Parts & Labor Protection: {per_claim_limit: "=per_claim_limit_usd", compressor_labor: "=compressor_labor_sublimit_usd", coil_labor: "=coil_labor_sublimit_usd", heat_exchanger_labor: "=heat_exchanger_labor_sublimit_usd", motor_labor: "=motor_labor_sublimit_usd", control_labor: "=control_labor_sublimit_usd", refrigerant_lbs: "=refrigerant_max_lbs_per_claim"}
        Harbison 12-Year Total Protection: {per_claim_limit: "=per_claim_limit_usd", compressor_labor: "=compressor_labor_sublimit_usd", coil_labor: "=coil_labor_sublimit_usd", heat_exchanger_labor: "=heat_exchanger_labor_sublimit_usd", motor_labor: "=motor_labor_sublimit_usd", control_labor: "=control_labor_sublimit_usd", refrigerant_lbs: "=refrigerant_max_lbs_per_claim"}
        Harbison 12-Year Total Protection Plus: {per_claim_limit: "=per_claim_limit_usd", compressor_labor: "=compressor_labor_sublimit_usd", coil_labor: "=coil_labor_sublimit_usd", heat_exchanger_labor: "=heat_exchanger_labor_sublimit_usd", motor_labor: "=motor_labor_sublimit_usd", control_labor: "=control_labor_sublimit_usd", refrigerant_lbs: "=refrigerant_max_lbs_per_claim"}

  - id: warranty_evt_claim_appeal
    subject: [warranty_claim_decide, warranty_claim_payout]
    rule: >-
      A denied or partially approved claim may be decided again on appeal, at most appeal_max_rounds time per claim, recorded as
      decision_round 2. An appeal is decided only when the date of handling is no later than appeal_window_days calendar days
      after the original decision was posted. Appeal-window days are counted as calendar days with the original decision date as
      day 0, and an appeal decided on the last day is accepted. An appeal is decided on the same tests as the original decision,
      using the records as they stand on the appeal date, so a maintenance visit or a manufacturer registration that existed
      before the failure but was missed in the original decision can change the outcome, whereas maintenance performed after the
      failure date never can. When the appeal approves more than the original decision, only the difference is paid out, under
      the payout components not already paid; an appeal never reduces an amount already paid. A denial for outside_coverage_term,
      component_not_covered or excluded_cause cannot be overturned by new documents and is upheld on appeal.
    eligibility:
      - id: appeal_window
        applies_to: [warranty_claim_decide]
        kind: time
        condition: An appeal is decided only when the date of handling is no later than appeal_window_days calendar days after the original decision was posted.
        evidence_fields: [warranty_claim_entries.claim_id, warranty_claim_entries.entry_date, warranty_claim_entries.decision_round]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_claim_entries.claim_id]
          action_bindings:
            warranty_claim_entries.claim_id: claim_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the original decision was posted
          anchor_source: warranty_claim_entries.entry_date
          relation: not_after
          duration_source: variants.appeal_window_days
          unit: calendar_days
          counting_rule: Appeal-window days are counted as calendar days with the original decision date as day 0, and an appeal decided on the last day is accepted.
          boundary: inclusive
      - id: one_appeal_per_claim
        applies_to: [warranty_claim_decide]
        kind: dedup
        condition: A denied or partially approved claim may be decided again on appeal, at most appeal_max_rounds time per claim, recorded as decision_round 2.
        evidence_fields: [warranty_claim_entries.claim_id, warranty_claim_entries.decision_round]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_claim_entries.claim_id]
          action_bindings:
            warranty_claim_entries.claim_id: claim_id
        dedup_contract:
          table: warranty_claim_entries
          mode: separate_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {decision_round: [2]}
          distinct_fields: []
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {appeal_days: "=appeal_window_days", appeal_rounds: "=appeal_max_rounds"}
        Harbison 5-Year Labor Protection: {appeal_days: "=appeal_window_days", appeal_rounds: "=appeal_max_rounds"}
        Harbison 10-Year Labor Protection: {appeal_days: "=appeal_window_days", appeal_rounds: "=appeal_max_rounds"}
        Harbison 10-Year Parts & Labor Protection: {appeal_days: "=appeal_window_days", appeal_rounds: "=appeal_max_rounds"}
        Harbison 12-Year Total Protection: {appeal_days: "=appeal_window_days", appeal_rounds: "=appeal_max_rounds"}
        Harbison 12-Year Total Protection Plus: {appeal_days: "=appeal_window_days", appeal_rounds: "=appeal_max_rounds"}

  - id: warranty_evt_no_lemon
    subject: [warranty_claim_payout, warranty_claim_decide]
    rule: >-
      On a tier whose unit_replacement_guarantee is true, an approved compressor or heat exchanger claim that brings the unit's
      approved compressor and heat exchanger failures within no_lemon_window_years of coverage_start to
      no_lemon_qualifying_failures is settled by replacing the unit instead of repairing it again. The replacement is paid as a
      unit_replacement payout of the cost of an equivalent unit installed by Harbison, up to unit_replacement_cap_usd and never
      beyond claim_limit_remaining, credited to the replacement installation contract the homeowner signs for it; the claim pays
      no repair lines on that visit beyond the diagnostic fee and after-hours premium the tier covers. The replacement is offered
      only when the qualifying count is reached; a failure of any other component never counts, and a failure after the window
      is repaired normally. The replacement equipment receives a new included workmanship warranty through its installation,
      while this contract stays in force on the replaced unit's record until it expires.
    eligibility:
      - id: qualifying_failures_reached
        applies_to: [warranty_claim_payout]
        kind: authorization
        condition: On a tier whose unit_replacement_guarantee is true, an approved compressor or heat exchanger claim that brings the unit's approved compressor and heat exchanger failures within no_lemon_window_years of coverage_start to no_lemon_qualifying_failures is settled by replacing the unit instead of repairing it again.
        evidence_fields: [warranty_claim_entries.equipment_id, warranty_claim_entries.component, warranty_claim_entries.decision, warranty_contracts.coverage_start]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_claim_entries.equipment_id]
          action_bindings:
            warranty_claim_entries.equipment_id: equipment_id
    measures: [warranty_msr_no_lemon_failures]
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {guarantee: "=unit_replacement_guarantee", failures: "=no_lemon_qualifying_failures", window_years: "=no_lemon_window_years", cap: "=unit_replacement_cap_usd"}
        Harbison 5-Year Labor Protection: {guarantee: "=unit_replacement_guarantee", failures: "=no_lemon_qualifying_failures", window_years: "=no_lemon_window_years", cap: "=unit_replacement_cap_usd"}
        Harbison 10-Year Labor Protection: {guarantee: "=unit_replacement_guarantee", failures: "=no_lemon_qualifying_failures", window_years: "=no_lemon_window_years", cap: "=unit_replacement_cap_usd"}
        Harbison 10-Year Parts & Labor Protection: {guarantee: "=unit_replacement_guarantee", failures: "=no_lemon_qualifying_failures", window_years: "=no_lemon_window_years", cap: "=unit_replacement_cap_usd"}
        Harbison 12-Year Total Protection: {guarantee: "=unit_replacement_guarantee", failures: "=no_lemon_qualifying_failures", window_years: "=no_lemon_window_years", cap: "=unit_replacement_cap_usd"}
        Harbison 12-Year Total Protection Plus: {guarantee: "=unit_replacement_guarantee", failures: "=no_lemon_qualifying_failures", window_years: "=no_lemon_window_years", cap: "=unit_replacement_cap_usd"}

  - id: warranty_home_sale_transfer
    subject: [warranty_transfer, warranty_register, warranty_limit_grant, warranty_charge]
    rule: >-
      Transferring a contract to the buyer of the home is the holder's own decision: the agent records a transfer request naming
      the closing date of the sale and the buyer's customer profile, and the holder confirms it. A transfer takes effect only
      once the holder has confirmed a transfer request on the contract. A transfer is accepted only when the date of handling is
      no later than transfer_window_days calendar days after the home sale closed. Transfer-window days are counted as calendar
      days with the closing date on the request as day 0, and a transfer handled on the last day is accepted. The tier must have
      transfer_allowed true, the number of transfers already made in the contract's chain must be below transfers_max, and the
      buyer must have a customer profile at the same service address. On transfer the seller's contract closes as transferred and
      a new contract is issued to the buyer with purchase_channel transfer, the same tier, scope, units and coverage dates, a
      contract_price of 0.00, and the seller's remaining claim benefit carried over; a transfer_fee of transfer_fee_usd is
      charged on the buyer's contract where it is above 0.00. Claims filed before the transfer stay with the seller's contract.
    eligibility:
      - id: holder_confirmed_transfer
        applies_to: [warranty_transfer]
        kind: authorization
        condition: A transfer takes effect only once the holder has confirmed a transfer request on the contract.
        evidence_fields: [warranty_change_requests.contract_id, warranty_change_requests.request_type, warranty_change_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_change_requests.contract_id]
          action_bindings:
            warranty_change_requests.contract_id: contract_id
      - id: transfer_window
        applies_to: [warranty_transfer]
        kind: time
        condition: A transfer is accepted only when the date of handling is no later than transfer_window_days calendar days after the home sale closed.
        evidence_fields: [warranty_change_requests.contract_id, warranty_change_requests.property_sale_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [warranty_change_requests.contract_id]
          action_bindings:
            warranty_change_requests.contract_id: contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the home sale closed
          anchor_source: warranty_change_requests.property_sale_date
          relation: not_after
          duration_source: variants.transfer_window_days
          unit: calendar_days
          counting_rule: Transfer-window days are counted as calendar days with the closing date on the request as day 0, and a transfer handled on the last day is accepted.
          boundary: inclusive
    measures: [warranty_msr_transfer_count]
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {allowed: "=transfer_allowed", window_days: "=transfer_window_days", fee: "=transfer_fee_usd", max_transfers: "=transfers_max"}
        Harbison 5-Year Labor Protection: {allowed: "=transfer_allowed", window_days: "=transfer_window_days", fee: "=transfer_fee_usd", max_transfers: "=transfers_max"}
        Harbison 10-Year Labor Protection: {allowed: "=transfer_allowed", window_days: "=transfer_window_days", fee: "=transfer_fee_usd", max_transfers: "=transfers_max"}
        Harbison 10-Year Parts & Labor Protection: {allowed: "=transfer_allowed", window_days: "=transfer_window_days", fee: "=transfer_fee_usd", max_transfers: "=transfers_max"}
        Harbison 12-Year Total Protection: {allowed: "=transfer_allowed", window_days: "=transfer_window_days", fee: "=transfer_fee_usd", max_transfers: "=transfers_max"}
        Harbison 12-Year Total Protection Plus: {allowed: "=transfer_allowed", window_days: "=transfer_window_days", fee: "=transfer_fee_usd", max_transfers: "=transfers_max"}

  - id: warranty_cancellation
    subject: [warranty_cancel, warranty_credit, warranty_refund_issued]
    rule: >-
      Cancelling a contract is the holder's own decision: the agent records a cancellation request and the holder confirms it,
      and the cancellation takes effect on the date of confirmation. A cancellation takes effect only once the holder has
      confirmed a cancellation request on the contract. Only tiers whose cancellation_allowed is true can be cancelled; the
      included workmanship warranty cannot. A full refund of contract_price is given only when the holder gives notice of this
      cancellation no later than cancellation_full_refund_days calendar days after the contract was purchased and no claim
      payout has been made on the contract. Refund-window days are counted as calendar days with the purchase date as day 0, and
      notice on the last day qualifies. Otherwise the refund is contract_price multiplied by the unused full months of the
      coverage term divided by the term's months (labor_coverage_years times twelve), rounded to the cent half up, less every
      claim payout made on the contract and less cancellation_admin_fee_usd, and never below zero. A contract still pending is
      cancelled on the same terms and counts its full term as unused. The refund posts as a cancellation_refund_credit naming the
      contract-price charge, or, for a tier bought on the installation contract, naming no charge on this contract, and the
      resulting credit balance is paid out to the original payment method. The aftermarket inspection fee is never refunded.
    eligibility:
      - id: holder_confirmed_cancellation
        applies_to: [warranty_cancel]
        kind: authorization
        condition: A cancellation takes effect only once the holder has confirmed a cancellation request on the contract.
        evidence_fields: [warranty_change_requests.contract_id, warranty_change_requests.request_type, warranty_change_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_change_requests.contract_id]
          action_bindings:
            warranty_change_requests.contract_id: contract_id
      - id: full_refund_window
        applies_to: [warranty_credit]
        kind: time
        condition: A full refund of contract_price is given only when the holder gives notice of this cancellation no later than cancellation_full_refund_days calendar days after the contract was purchased and no claim payout has been made on the contract.
        evidence_fields: [warranty_contracts.contract_id, warranty_contracts.purchase_date, warranty_claim_entries.contract_id, warranty_claim_entries.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_contracts.contract_id]
          action_bindings:
            warranty_contracts.contract_id: contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was purchased
          anchor_source: warranty_contracts.purchase_date
          relation: not_after
          duration_source: variants.cancellation_full_refund_days
          unit: calendar_days
          counting_rule: Refund-window days are counted as calendar days with the purchase date as day 0, and notice on the last day qualifies.
          boundary: inclusive
    formula:
      refund_after_window: max(0, round(contract_price * warranty_msr_unused_full_months / (labor_coverage_years * 12), 2) - warranty_msr_claims_paid - cancellation_admin_fee_usd)
    measures: [warranty_msr_unused_full_months, warranty_msr_claims_paid]
    params:
      per_tier:
        Harbison 2-Year Workmanship Warranty: {allowed: "=cancellation_allowed", refund_days: "=cancellation_full_refund_days", admin_fee: "=cancellation_admin_fee_usd"}
        Harbison 5-Year Labor Protection: {allowed: "=cancellation_allowed", refund_days: "=cancellation_full_refund_days", admin_fee: "=cancellation_admin_fee_usd"}
        Harbison 10-Year Labor Protection: {allowed: "=cancellation_allowed", refund_days: "=cancellation_full_refund_days", admin_fee: "=cancellation_admin_fee_usd"}
        Harbison 10-Year Parts & Labor Protection: {allowed: "=cancellation_allowed", refund_days: "=cancellation_full_refund_days", admin_fee: "=cancellation_admin_fee_usd"}
        Harbison 12-Year Total Protection: {allowed: "=cancellation_allowed", refund_days: "=cancellation_full_refund_days", admin_fee: "=cancellation_admin_fee_usd"}
        Harbison 12-Year Total Protection Plus: {allowed: "=cancellation_allowed", refund_days: "=cancellation_full_refund_days", admin_fee: "=cancellation_admin_fee_usd"}

  - id: warranty_lifecycle_closure
    subject: [warranty_expire, warranty_decline, warranty_credit, warranty_refund_issued]
    rule: >-
      An active contract expires on the day after coverage_end; failures diagnosed after coverage_end are not covered even when
      the claim would otherwise qualify, and claims already filed before expiry are still decided and paid. An aftermarket
      purchase whose inspection finds the equipment failing, leaking refrigerant, cracked, or already under a repair
      recommendation is declined: the contract closes from pending to cancelled and its contract price is credited back in full
      as an inspection_failure_credit naming the contract-price charge, while the inspection fee stays charged. A declined
      purchase is decided only while the contract status is pending. Any credit balance left on a closed contract is paid out to
      the original payment method as a refund_payout naming the credit.
    eligibility:
      - id: decline_while_pending
        applies_to: [warranty_decline]
        kind: authorization
        condition: A declined purchase is decided only while the contract status is pending.
        evidence_fields: [warranty_contracts.contract_id, warranty_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [warranty_contracts.contract_id]
          action_bindings:
            warranty_contracts.contract_id: contract_id

  - id: warranty_billing
    subject: [warranty_payment, warranty_charge, warranty_refund_issued]
    rule: >-
      A payment is applied to the contract's oldest unpaid charge first. A post-installation or aftermarket contract price and
      the inspection fee are due on purchase, and the contract does not activate until the contract price is paid. A claim
      service fee is due with the service invoice of the visit; an unpaid fee is collected with that invoice and never suspends
      coverage or delays a payout. A transfer fee is due from the buyer before the buyer's next claim is paid. Refund payouts go
      to the original payment method only, never as cash, and a payout equals the negative contract_balance it clears.
    eligibility: []


# ============================================================================
# extended_policies (erl-task-instantiate, difficulty protection_contract_claims)
# ============================================================================
extended_policies:
  - id: warranty_ext_labor_plan_claim_decision
    base_policy_refs: [warranty_evt_claim_coverage, warranty_evt_claim_payout, warranty_evt_claim_appeal, warranty_evt_no_lemon]
    overwrite:
      - base_policy: warranty_evt_claim_coverage
        superseded_clause: >-
          When the manufacturer warranty supplies the part, the claim is partially_approved with denial_reason
          manufacturer_parts_coverage_applies for the parts and pays the remaining covered components; otherwise a claim
          passing every test is approved.
        replaced_by: >-
          A labor-only tier never pays a part, so a claim on a labor-only contract that passes every coverage test is
          approved with no denial reason, whether or not the manufacturer's parts warranty is still in term, and a claim that
          fails a test is denied with the first failing test as its reason.
      - base_policy: warranty_evt_claim_payout
        superseded_clause: >-
          labor is paid up to the labor sublimit for that component
        replaced_by: >-
          Where the claim's service call was booked for no heat, no cooling or a carbon monoxide alarm and its call class
          carries a labor multiplier above one, the labor allowed is the labor net up to the component sublimit multiplied by
          that labor multiplier; where the call class carries a labor multiplier above one and the call was booked for any
          other symptom, the labor allowed is the labor net divided by that labor multiplier, up to the component sublimit;
          on a call class whose labor multiplier is one, the labor allowed is the standard one.
          The unit age share is set by the whole calendar months from the installed date of the Harbison installation named on the
          contract, or from the contract's coverage start where it names none, to the failure date: more than ninety-six months
          takes the over-ninety-six-month age share, more than sixty and up to ninety-six months takes the sixty-one-to-ninety-six-month
          age share, and sixty months or fewer takes a unit age share of one.
          The maintenance-recency share is set by the latest documented maintenance completed on or before the failure
          date, read from the failed unit's most recent heating-season Comfort Club tune-up, its most recent cooling-
          season Comfort Club tune-up and the most recent precision tune-up charge line on the holder's Harbison
          invoices, each of these three records counting only when it is dated on or before the failure date, because
          maintenance done after a failure is no evidence of care before it; the latest counting record is measured in
          whole calendar months to the failure date: twelve months or more, or no counting record at all, takes the
          twelve-months-or-more maintenance share, nine to eleven months takes the nine-to-eleven-month maintenance
          share, and fewer than nine months takes a maintenance-recency share of one.
          The purchase-timing share is set by the calendar days from the contract's coverage start to its purchase date: a
          contract bought before its coverage started, which is a purchase on existing equipment ahead of a waiting period,
          takes the waiting-period purchase share, a contract bought after its coverage started, which is a purchase made after
          the installation was completed, takes the bought-after-installation share, and a contract bought on the day its
          coverage started takes a purchase-timing share of one.
          The labor payable on a labor-only contract is the labor allowed multiplied by the unit age share, the
          maintenance-recency share and the purchase-timing share, all three applied to the same labor allowed.
      - base_policy: warranty_evt_claim_payout
        superseded_clause: >-
          the visit's diagnostic fee is paid where diagnostic_fee_covered is true and its after-hours premium where
          after_hours_premium_covered is true, each only on the first claim of the visit
        replaced_by: >-
          On a labor-only contract the diagnostic share depends on the failed component: a heat exchanger, gas valve, flame
          sensor, igniter or pressure switch takes the safety-component diagnostic share, a blower motor, inducer motor,
          condenser fan motor, control board or defrost board takes the motor-and-board diagnostic share, and any other
          component takes the standard diagnostic share.
          On a labor-only contract the premium share depends on the call class of the claim's service call: an Overnight
          Emergency Service Call or a Holiday Emergency Service Call takes the emergency-call premium share, an Evening Service
          Call or a Weekend Service Call takes the evening-and-weekend premium share, and any other call class takes the standard
          premium share.
          The diagnostic payable is the diagnostic net times the diagnostic share and the premium payable is the premium net
          times the premium share, both only on the lead claim of the service call.
      - base_policy: warranty_evt_claim_payout
        superseded_clause: >-
          The approved amount on the decision equals that capped total.
        replaced_by: >-
          The labor-only claim payable is the labor payable plus the diagnostic payable plus the premium payable, capped at
          the tier's per-claim limit and at the contract's remaining claim benefit, and the approved amount written on the
          decision is that capped figure rounded to the cent, half up, with every intermediate figure kept unrounded.
    trigger: state_due
    subject: [warranty_claim_decide]
    computes: approved_amount
    target_tool: decide_labor_plan_claim_66c3e056
    params:
      age_share_over_96_months: 0.80
      age_share_61_to_96_months: 0.90
      maint_share_twelve_months_or_more: 0.85
      maint_share_nine_to_eleven_months: 0.95
      diag_share_safety_component: 1.00
      diag_share_motor_or_board: 0.50
      timing_share_bought_after_installation: 0.95
      timing_share_waiting_period_purchase: 0.85
      premium_share_emergency_call: 1.00
      premium_share_evening_weekend_call: 0.50
    rule: >-
      This policy sets the original decision on a claim filed against a Harbison 5-Year Labor Protection or Harbison
      10-Year Labor Protection contract, the labor-only tiers, and fixes the approved amount written on that decision; the
      coverage tests of the base claim rules decide whether the claim passes, and the decision is made on the filing date.
      The claim decided is the claim filed on the contract on the date of handling, and its service call, failed unit,
      failed component and failure date are the ones recorded on that claim.
      A labor-only tier never pays a part, so a claim on a labor-only contract that passes every coverage test is
      approved with no denial reason, whether or not the manufacturer's parts warranty is still in term, and a claim that
      fails a test is denied with the first failing test as its reason.
      The labor-only claim payable is the labor payable plus the diagnostic payable plus the premium payable, capped at
      the tier's per-claim limit and at the contract's remaining claim benefit, and the approved amount written on the
      decision is that capped figure rounded to the cent, half up, with every intermediate figure kept unrounded.
      The labor net is the repair labor line charged on the claim's service call under the price-book task of the failed
      component, less the Comfort Club member repair discount posted against that labor line.
      The component sublimit is the tier's motor labor sublimit for a blower, inducer or condenser fan motor, its control labor
      sublimit for a control board, defrost board or gas valve, its compressor, coil or heat exchanger labor sublimit for
      those components, and there is no sublimit for any other covered component.
      Under the standard method the labor allowed is the labor net up to the component sublimit, and the labor payable equals
      the labor allowed.
      Under the standard method the diagnostic payable is the diagnostic net times the tier's own diagnostic coverage, which
      is one where the tier covers the diagnostic fee and zero where it does not, and the premium payable is the premium net
      times the tier's own after-hours coverage, one where the tier covers the after-hours premium and zero where it does not.
      The diagnostic net is the diagnostic fee charged on the claim's service call less the member diagnostic rate posted
      against it, and the premium net is the after-hours premium charged on that call less the member premium discount
      posted against it; both are payable only on the lead claim of the service call, which is the claim whose failed
      component carries the largest repair labor line charged on that call. Parts are never paid on a labor-only tier.
      Where the claim's service call was booked for no heat, no cooling or a carbon monoxide alarm and its call class
      carries a labor multiplier above one, the labor allowed is the labor net up to the component sublimit multiplied by
      that labor multiplier; where the call class carries a labor multiplier above one and the call was booked for any
      other symptom, the labor allowed is the labor net divided by that labor multiplier, up to the component sublimit;
      on a call class whose labor multiplier is one, the labor allowed is the standard one.
      The unit age share is set by the whole calendar months from the installed date of the Harbison installation named on the
      contract, or from the contract's coverage start where it names none, to the failure date: more than ninety-six months
      takes the over-ninety-six-month age share, more than sixty and up to ninety-six months takes the sixty-one-to-ninety-six-month
      age share, and sixty months or fewer takes a unit age share of one.
      The maintenance-recency share is set by the latest documented maintenance completed on or before the failure
      date, read from the failed unit's most recent heating-season Comfort Club tune-up, its most recent cooling-
      season Comfort Club tune-up and the most recent precision tune-up charge line on the holder's Harbison invoices,
      each of these three records counting only when it is dated on or before the failure date, because maintenance
      done after a failure is no evidence of care before it; the latest counting record is measured in whole calendar
      months to the failure date: twelve months or more, or no counting record at all, takes the twelve-months-or-more
      maintenance share, nine to eleven months takes the nine-to-eleven-month maintenance share, and fewer than nine
      months takes a maintenance-recency share of one.
      The purchase-timing share is set by the calendar days from the contract's coverage start to its purchase date: a
      contract bought before its coverage started, which is a purchase on existing equipment ahead of a waiting period,
      takes the waiting-period purchase share, a contract bought after its coverage started, which is a purchase made after
      the installation was completed, takes the bought-after-installation share, and a contract bought on the day its
      coverage started takes a purchase-timing share of one.
      The labor payable on a labor-only contract is the labor allowed multiplied by the unit age share, the
      maintenance-recency share and the purchase-timing share, all three applied to the same labor allowed.
      On a labor-only contract the diagnostic share depends on the failed component: a heat exchanger, gas valve, flame
      sensor, igniter or pressure switch takes the safety-component diagnostic share, a blower motor, inducer motor,
      condenser fan motor, control board or defrost board takes the motor-and-board diagnostic share, and any other
      component takes the standard diagnostic share.
      On a labor-only contract the premium share depends on the call class of the claim's service call: an Overnight
      Emergency Service Call or a Holiday Emergency Service Call takes the emergency-call premium share, an Evening Service
      Call or a Weekend Service Call takes the evening-and-weekend premium share, and any other call class takes the standard
      premium share.
      The diagnostic payable is the diagnostic net times the diagnostic share and the premium payable is the premium net
      times the premium share, both only on the lead claim of the service call.
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [service_tickets.completed_date, service_tickets.symptom, service_tickets.variant_name, labor_multiplier, service_lines.amount, service_lines.line_id, service_lines.posted_date]
        note: The labor, diagnostic and premium lines, the call class, its labor multiplier and the booked symptom of the claim's service call decide the after-hours labor basis and the premium share; precision tune-up lines count toward maintenance recency.
      - category: install
        as: branch
        reads: [installed_date]
        note: The installed date of the contract's Harbison installation decides the unit age share.
      - category: plan
        as: history
        reads: [plan_service_entries.entry_date]
        note: The latest completed Comfort Club tune-up on the failed unit decides the maintenance-recency share.
    compute:
      - claim_ticket: "LATEST('warranty_claim_entries', 'ticket_id', date_field='entry_date', event_type='warranty_claim_file', entry_date=NOW)"
      - claim_component: "LATEST('warranty_claim_entries', 'component', date_field='entry_date', event_type='warranty_claim_file', entry_date=NOW)"
      - claim_unit: "LATEST('warranty_claim_entries', 'equipment_id', date_field='entry_date', event_type='warranty_claim_file', entry_date=NOW)"
      - failure_date: "CFIELD('service', 'completed_date', ticket_id=claim_ticket)"
      - repair_task: "'blower_motor_replace' if claim_component == 'blower_motor' else ('inducer_motor_replace' if claim_component == 'inducer_motor' else ('condenser_fan_motor_replace' if claim_component == 'condenser_fan_motor' else ('control_board_replace' if claim_component == 'control_board' else ('defrost_board_replace' if claim_component == 'defrost_board' else ('gas_valve_replace' if claim_component == 'gas_valve' else ('igniter_replace' if claim_component == 'igniter' else ('flame_sensor_service' if claim_component == 'flame_sensor' else ('pressure_switch_replace' if claim_component == 'pressure_switch' else ('capacitor_replace' if claim_component == 'capacitor' else ('contactor_replace' if claim_component == 'contactor' else ('compressor_replace' if claim_component == 'compressor' else ('condenser_coil_replace' if claim_component == 'condenser_coil' else ('evaporator_coil_replace' if claim_component == 'evaporator_coil' else ('txv_replace' if claim_component == 'txv_metering_device' else ('reversing_valve_replace' if claim_component == 'reversing_valve' else 'none')))))))))))))))"
      - labor_line: "XLATEST('service', 'service_lines', 'line_id', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='repair_labor', task_code=repair_task)"
      - labor_gross: "XSUM('service', 'service_lines', 'amount', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='repair_labor', task_code=repair_task)"
      - labor_discount: "XSUM('service', 'service_lines', 'amount', date_field='posted_date', event_type='service_discount', line_type='member_repair_discount', source_line_id=labor_line)"
      - labor_net: "labor_gross - labor_discount"
      - labor_sublimit: "P('motor_labor_sublimit_usd') if (claim_component == 'blower_motor' or claim_component == 'inducer_motor' or claim_component == 'condenser_fan_motor') else (P('control_labor_sublimit_usd') if (claim_component == 'control_board' or claim_component == 'defrost_board' or claim_component == 'gas_valve') else (P('compressor_labor_sublimit_usd') if claim_component == 'compressor' else (P('coil_labor_sublimit_usd') if (claim_component == 'condenser_coil' or claim_component == 'evaporator_coil') else (P('heat_exchanger_labor_sublimit_usd') if claim_component == 'heat_exchanger' else -1))))"
      - labor_cap_std: "labor_sublimit if labor_sublimit >= 0 else labor_net"
      - call_symptom: "CFIELD('service', 'symptom', ticket_id=claim_ticket)"
      - call_multiplier: "CPARAM('service', 'labor_multiplier', ticket_id=claim_ticket)"
      - urgent_call: "1 if (call_symptom == 'no_heat' or call_symptom == 'no_cool' or call_symptom == 'carbon_monoxide_alarm') else 0"
      - labor_allowed: "MN(labor_net, labor_cap_std * call_multiplier) if (urgent_call == 1 and call_multiplier > 1) else (MN(labor_net / call_multiplier, labor_cap_std) if call_multiplier > 1 else MN(labor_net, labor_cap_std))"
      - unit_installed_date: "CFIELD('install', 'installed_date', install_id=F('install_id'))"
      - months_in_service: "MONTHS(unit_installed_date if unit_installed_date != None else F('coverage_start'), failure_date)"
      - age_share: "K('age_share_over_96_months') if months_in_service > 96 else (K('age_share_61_to_96_months') if months_in_service > 60 else 1)"
      - heat_maint_date: "XLATEST('plan', 'plan_service_entries', 'entry_date', date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit', equipment_id=claim_unit, season='heating')"
      - cool_maint_date: "XLATEST('plan', 'plan_service_entries', 'entry_date', date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit', equipment_id=claim_unit, season='cooling')"
      - paid_maint_date: "XLATEST('service', 'service_lines', 'posted_date', date_field='posted_date', event_type='service_charge', line_type='maintenance_tuneup', task_code='precision_tuneup')"
      - last_maint_date: "MX(heat_maint_date if (heat_maint_date != None and heat_maint_date <= failure_date) else '0000-01-01', cool_maint_date if (cool_maint_date != None and cool_maint_date <= failure_date) else '0000-01-01', paid_maint_date if (paid_maint_date != None and paid_maint_date <= failure_date) else '0000-01-01')"
      - months_since_maint: "MONTHS(last_maint_date, failure_date)"
      - maint_share: "K('maint_share_twelve_months_or_more') if months_since_maint >= 12 else (K('maint_share_nine_to_eleven_months') if months_since_maint >= 9 else 1)"
      - days_bought_after_start: "DAYS(F('coverage_start'), F('purchase_date'))"
      - timing_share: "K('timing_share_waiting_period_purchase') if days_bought_after_start < 0 else (K('timing_share_bought_after_installation') if days_bought_after_start > 0 else 1)"
      - labor_payable: "labor_allowed * age_share * maint_share * timing_share"
      - largest_labor_on_call: "XMAX('service', 'service_lines', 'amount', ticket_id=claim_ticket, event_type='service_charge', line_type='repair_labor')"
      - lead_claim: "1 if (COUNT('warranty_claim_entries', event_type='warranty_claim_file', ticket_id=claim_ticket) >= 1 and labor_gross >= largest_labor_on_call) else 0"
      - diag_line: "XLATEST('service', 'service_lines', 'line_id', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='diagnostic_fee')"
      - diag_gross: "XSUM('service', 'service_lines', 'amount', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='diagnostic_fee')"
      - diag_discount: "XSUM('service', 'service_lines', 'amount', date_field='posted_date', event_type='service_discount', line_type='member_diagnostic_rate', source_line_id=diag_line)"
      - diag_net: "diag_gross - diag_discount"
      - diag_component: "LATEST('warranty_claim_entries', 'component', date_field='entry_date', event_type='warranty_claim_file', entry_date=NOW)"
      - diag_share: "K('diag_share_safety_component') if (diag_component == 'heat_exchanger' or diag_component == 'gas_valve' or diag_component == 'flame_sensor' or diag_component == 'igniter' or diag_component == 'pressure_switch') else (K('diag_share_motor_or_board') if (diag_component == 'blower_motor' or diag_component == 'inducer_motor' or diag_component == 'condenser_fan_motor' or diag_component == 'control_board' or diag_component == 'defrost_board') else (1 if P('diagnostic_fee_covered') else 0))"
      - premium_line: "XLATEST('service', 'service_lines', 'line_id', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='after_hours_premium')"
      - premium_gross: "XSUM('service', 'service_lines', 'amount', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='after_hours_premium')"
      - premium_discount: "XSUM('service', 'service_lines', 'amount', date_field='posted_date', event_type='service_discount', line_type='member_premium_discount', source_line_id=premium_line)"
      - premium_net: "premium_gross - premium_discount"
      - call_class: "CFIELD('service', 'variant_name', ticket_id=claim_ticket)"
      - premium_share: "K('premium_share_emergency_call') if (call_class == 'Overnight Emergency Service Call' or call_class == 'Holiday Emergency Service Call') else (K('premium_share_evening_weekend_call') if (call_class == 'Evening Service Call' or call_class == 'Weekend Service Call') else (1 if P('after_hours_premium_covered') else 0))"
      - diag_payable: "diag_net * diag_share * lead_claim"
      - premium_payable: "premium_net * premium_share * lead_claim"
      - claim_total: "labor_payable + diag_payable + premium_payable"
      - capped_total: "MN(claim_total, P('per_claim_limit_usd'), F('claim_limit_remaining'))"
      - result: "int(capped_total * 100 + 0.5) / 100"
    compute_basis:
      claim_ticket: "The claim decided is the claim filed on the contract on the date of handling, and its service call, failed unit, failed component and failure date are the ones recorded on that claim."
      claim_component: "The claim decided is the claim filed on the contract on the date of handling, and its service call, failed unit, failed component and failure date are the ones recorded on that claim."
      claim_unit: "The claim decided is the claim filed on the contract on the date of handling, and its service call, failed unit, failed component and failure date are the ones recorded on that claim."
      failure_date: "The claim decided is the claim filed on the contract on the date of handling, and its service call, failed unit, failed component and failure date are the ones recorded on that claim."
      repair_task: "The labor net is the repair labor line charged on the claim's service call under the price-book task of the failed component"
      labor_line: "The labor net is the repair labor line charged on the claim's service call under the price-book task of the failed component"
      labor_gross: "The labor net is the repair labor line charged on the claim's service call under the price-book task of the failed component"
      labor_discount: "less the Comfort Club member repair discount posted against that labor line"
      labor_sublimit: "The component sublimit is the tier's motor labor sublimit for a blower, inducer or condenser fan motor, its control labor sublimit for a control board, defrost board or gas valve, its compressor, coil or heat exchanger labor sublimit for those components, and there is no sublimit for any other covered component."
      labor_cap_std: "there is no sublimit for any other covered component"
      call_symptom: "Where the claim's service call was booked for no heat, no cooling or a carbon monoxide alarm"
      call_multiplier: "its call class carries a labor multiplier above one"
      urgent_call: "Where the claim's service call was booked for no heat, no cooling or a carbon monoxide alarm"
      labor_allowed: "Where the claim's service call was booked for no heat, no cooling or a carbon monoxide alarm and its call class carries a labor multiplier above one, the labor allowed is the labor net up to the component sublimit multiplied by that labor multiplier; where the call class carries a labor multiplier above one and the call was booked for any other symptom, the labor allowed is the labor net divided by that labor multiplier, up to the component sublimit; on a call class whose labor multiplier is one, the labor allowed is the standard one."
      unit_installed_date: "from the installed date of the Harbison installation named on the contract, or from the contract's coverage start where it names none, to the failure date"
      months_in_service: "The unit age share is set by the whole calendar months from the installed date of the Harbison installation named on the contract, or from the contract's coverage start where it names none, to the failure date"
      age_share: "more than ninety-six months takes the over-ninety-six-month age share, more than sixty and up to ninety-six months takes the sixty-one-to-ninety-six-month age share, and sixty months or fewer takes a unit age share of one."
      heat_maint_date: "the failed unit's most recent heating-season Comfort Club tune-up"
      cool_maint_date: "its most recent cooling-season Comfort Club tune-up"
      paid_maint_date: "the most recent precision tune-up charge line on the holder's Harbison invoices"
      last_maint_date: "each of these three records counting only when it is dated on or before the failure date, because maintenance done after a failure is no evidence of care before it"
      months_since_maint: "the latest counting record is measured in whole calendar months to the failure date"
      maint_share: "twelve months or more, or no counting record at all, takes the twelve-months-or-more maintenance share, nine to eleven months takes the nine-to-eleven-month maintenance share, and fewer than nine months takes a maintenance-recency share of one."
      days_bought_after_start: "The purchase-timing share is set by the calendar days from the contract's coverage start to its purchase date"
      timing_share: "a contract bought before its coverage started, which is a purchase on existing equipment ahead of a waiting period, takes the waiting-period purchase share, a contract bought after its coverage started, which is a purchase made after the installation was completed, takes the bought-after-installation share, and a contract bought on the day its coverage started takes a purchase-timing share of one."
      labor_payable: "The labor payable on a labor-only contract is the labor allowed multiplied by the unit age share, the maintenance-recency share and the purchase-timing share, all three applied to the same labor allowed."
      largest_labor_on_call: "the claim whose failed component carries the largest repair labor line charged on that call"
      lead_claim: "both are payable only on the lead claim of the service call, which is the claim whose failed component carries the largest repair labor line charged on that call"
      diag_line: "The diagnostic net is the diagnostic fee charged on the claim's service call less the member diagnostic rate posted against it"
      diag_gross: "The diagnostic net is the diagnostic fee charged on the claim's service call less the member diagnostic rate posted against it"
      diag_discount: "less the member diagnostic rate posted against it"
      diag_component: "On a labor-only contract the diagnostic share depends on the failed component"
      diag_share: "a heat exchanger, gas valve, flame sensor, igniter or pressure switch takes the safety-component diagnostic share, a blower motor, inducer motor, condenser fan motor, control board or defrost board takes the motor-and-board diagnostic share, and any other component takes the standard diagnostic share."
      premium_line: "the premium net is the after-hours premium charged on that call less the member premium discount posted against it"
      premium_gross: "the premium net is the after-hours premium charged on that call less the member premium discount posted against it"
      premium_discount: "less the member premium discount posted against it"
      call_class: "On a labor-only contract the premium share depends on the call class of the claim's service call"
      premium_share: "an Overnight Emergency Service Call or a Holiday Emergency Service Call takes the emergency-call premium share, an Evening Service Call or a Weekend Service Call takes the evening-and-weekend premium share, and any other call class takes the standard premium share."
      diag_payable: "The diagnostic payable is the diagnostic net times the diagnostic share and the premium payable is the premium net times the premium share, both only on the lead claim of the service call."
      premium_payable: "The diagnostic payable is the diagnostic net times the diagnostic share and the premium payable is the premium net times the premium share, both only on the lead claim of the service call."
      claim_total: "The labor-only claim payable is the labor payable plus the diagnostic payable plus the premium payable"
      capped_total: "capped at the tier's per-claim limit and at the contract's remaining claim benefit"
      result: "the approved amount written on the decision is that capped figure rounded to the cent, half up, with every intermediate figure kept unrounded."
    factors:
      - id: after_hours_labor_basis
        effect: method
        decides: labor_allowed
        bindings: [call_symptom, call_multiplier, urgent_call, labor_allowed]
        ladder:
          - when: "the claim's service call was booked for no heat, no cooling or a carbon monoxide alarm and its call class carries a labor multiplier above one"
            method: "the labor net is allowed up to the component sublimit multiplied by the call class's labor multiplier"
          - when: "the call class carries a labor multiplier above one and the call was booked for any other symptom"
            method: "the labor net is divided by the call class's labor multiplier and allowed up to the component sublimit"
          - when: "otherwise (a call class whose labor multiplier is one)"
            method: "the labor net is allowed up to the component sublimit"
        baseline:
          labor_allowed: "MN(labor_net, labor_cap_std)"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: unit_age_share
        effect: parameter
        decides: age_share
        bindings: [unit_installed_date, months_in_service, age_share]
        ladder:
          - when: "more than ninety-six whole calendar months from the installed date to the failure date"
            value: "K('age_share_over_96_months')"
          - when: "more than sixty and up to ninety-six whole calendar months"
            value: "K('age_share_61_to_96_months')"
          - when: "otherwise (sixty months or fewer)"
            value: "1"
        baseline:
          age_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: install
      - id: maintenance_recency_share
        effect: parameter
        decides: maint_share
        bindings: [heat_maint_date, cool_maint_date, paid_maint_date, last_maint_date, months_since_maint, maint_share]
        ladder:
          - when: "the latest documented maintenance completed on or before the failure date is twelve or more whole calendar months before it, or there is none"
            value: "K('maint_share_twelve_months_or_more')"
          - when: "the latest documented maintenance completed on or before the failure date is nine to eleven whole calendar months before it"
            value: "K('maint_share_nine_to_eleven_months')"
          - when: "otherwise (fewer than nine months before the failure; records dated after the failure never count)"
            value: "1"
        baseline:
          maint_share: "1"
        evidence: [cross_category, history, date]
        cross_difficulty: plan
      - id: purchase_timing_share
        effect: parameter
        decides: timing_share
        bindings: [days_bought_after_start, timing_share]
        ladder:
          - when: "the contract was bought before its coverage started (a purchase on existing equipment ahead of a waiting period)"
            value: "K('timing_share_waiting_period_purchase')"
          - when: "the contract was bought after its coverage started (a purchase made after the installation was completed)"
            value: "K('timing_share_bought_after_installation')"
          - when: "otherwise (bought on the day its coverage started)"
            value: "1"
        baseline:
          timing_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: diagnostic_component_share
        effect: parameter
        decides: diag_share
        bindings: [diag_component, diag_share]
        ladder:
          - when: "the failed component is a heat exchanger, gas valve, flame sensor, igniter or pressure switch"
            value: "K('diag_share_safety_component')"
          - when: "the failed component is a blower motor, inducer motor, condenser fan motor, control board or defrost board"
            value: "K('diag_share_motor_or_board')"
          - when: "otherwise"
            value: "the tier's own diagnostic coverage (one where the tier covers the diagnostic fee, zero where it does not)"
        baseline:
          diag_share: "1 if P('diagnostic_fee_covered') else 0"
        evidence: [history]
        cross_difficulty: null
      - id: call_class_premium_share
        effect: parameter
        decides: premium_share
        bindings: [call_class, premium_share]
        ladder:
          - when: "the claim's service call is an Overnight Emergency Service Call or a Holiday Emergency Service Call"
            value: "K('premium_share_emergency_call')"
          - when: "the claim's service call is an Evening Service Call or a Weekend Service Call"
            value: "K('premium_share_evening_weekend_call')"
          - when: "otherwise"
            value: "the tier's own after-hours coverage (one where the tier covers the after-hours premium, zero where it does not)"
        baseline:
          premium_share: "1 if P('after_hours_premium_covered') else 0"
        evidence: [cross_category]
        cross_difficulty: service
    baseline:
      rule: >-
        The labor-only claim payable is the labor payable plus the diagnostic payable plus the premium payable, capped at
        the tier's per-claim limit and at the contract's remaining claim benefit, and the approved amount written on the
        decision is that capped figure rounded to the cent, half up, with every intermediate figure kept unrounded.
        The labor net is the repair labor line charged on the claim's service call under the price-book task of the failed
        component, less the Comfort Club member repair discount posted against that labor line.
        The component sublimit is the tier's motor labor sublimit for a blower, inducer or condenser fan motor, its control labor
        sublimit for a control board, defrost board or gas valve, its compressor, coil or heat exchanger labor sublimit for
        those components, and there is no sublimit for any other covered component.
        Under the standard method the labor allowed is the labor net up to the component sublimit, and the labor payable equals
        the labor allowed.
        Under the standard method the diagnostic payable is the diagnostic net times the tier's own diagnostic coverage, which
        is one where the tier covers the diagnostic fee and zero where it does not, and the premium payable is the premium net
        times the tier's own after-hours coverage, one where the tier covers the after-hours premium and zero where it does not.
        The diagnostic net is the diagnostic fee charged on the claim's service call less the member diagnostic rate posted
        against it, and the premium net is the after-hours premium charged on that call less the member premium discount
        posted against it; both are payable only on the lead claim of the service call, which is the claim whose failed
        component carries the largest repair labor line charged on that call. Parts are never paid on a labor-only tier.
      params: [per_claim_limit_usd, motor_labor_sublimit_usd, control_labor_sublimit_usd, compressor_labor_sublimit_usd, coil_labor_sublimit_usd, heat_exchanger_labor_sublimit_usd, diagnostic_fee_covered, after_hours_premium_covered]
    inputs:
      history:
        - {table: warranty_claim_entries, aggregate: latest, field: ticket_id, filters: {event_type: warranty_claim_file}}
        - {table: warranty_claim_entries, aggregate: count, field: claim_entry_id, filters: {event_type: warranty_claim_file}}
        - {category: service, table: service_lines, aggregate: sum, field: amount, filters: {event_type: service_charge}}
        - {category: service, table: service_lines, aggregate: sum, field: amount, filters: {event_type: service_discount}}
        - {category: service, table: service_lines, aggregate: max, field: amount, filters: {line_type: repair_labor}}
        - {category: service, table: service_lines, aggregate: latest, field: posted_date, filters: {line_type: maintenance_tuneup}}
        - {category: plan, table: plan_service_entries, aggregate: latest, field: entry_date, filters: {event_type: plan_tuneup_visit, entry_reason: completed_visit}}
      cross_category: [service, install, plan]
  - id: warranty_ext_visit_claim_service_fee
    base_policy_refs: [warranty_agg_claim_service_fee_per_visit, warranty_purchase_eligibility, warranty_pricing, warranty_home_sale_transfer, warranty_billing]
    overwrite:
      - base_policy: warranty_agg_claim_service_fee_per_visit
        superseded_clause: >-
          the single fee is the highest of their claim_service_fee_usd values
        replaced_by: >-
          The claim service fee charged on a labor-only contract is the after-hours visit fee multiplied by the member fee
          share, the claim-size fee share and the repeat-visit fee share, all three applied to the same after-hours visit
          fee, and rounded to the cent, half up, once at the end.
    trigger: state_due
    subject: [warranty_charge]
    computes: fee_amount
    target_tool: charge_claim_service_fee_b62a9756
    params:
      member_loyalty_fee_share: 0.50
      evening_weekend_premium_fraction: 0.25
      small_claim_limit_usd: 300.00
      mid_claim_limit_usd: 750.00
      small_claim_fee_share: 0.50
      mid_claim_fee_share: 0.75
      repeat_two_or_more_fee_share: 0.25
      repeat_one_fee_share: 0.50
    rule: >-
      This policy fixes the claim service fee charged on a Harbison 5-Year Labor Protection or Harbison 10-Year Labor
      Protection contract, the labor-only tiers, for the service call on which a claim against that contract was decided on
      the date of handling; one fee is charged per service call, and none is charged on a service call whose claims against
      the contract are all denied.
      The fee charge names the first approved claim of the service call, which is the claim on that call whose approving
      original decision was posted earliest, even where a later decision on the same call is the one that lets the fee be
      fixed.
      The claim service fee for a service call is fixed only after every claim filed on that call against the contract
      carries its original decision.
      Under the standard method the visit fee is the tier's claim service fee where at least one claim on the service call
      was approved or partially approved, and zero otherwise, and the fee charged is the visit fee, rounded to the cent, half
      up.
      The claim service fee charged on a labor-only contract is the after-hours visit fee multiplied by the member fee
      share, the claim-size fee share and the repeat-visit fee share, all three applied to the same after-hours visit
      fee, and rounded to the cent, half up, once at the end.
      The member fee share is set by the holder's Comfort Club agreement in active status on the date of handling, read
      against the completed date of the service call: such an agreement whose term covers that date at a tier that waives
      the claim service fee takes a member fee share of zero, so that no fee is charged; such an agreement whose term covers
      that date, at a tier that does not waive the fee, held for three or more consecutive terms takes the loyal-member fee
      share; and any other holder takes a member fee share of one.
      The after-hours visit fee is worked out from the visit fee by the call class of the service call: on an Overnight
      Emergency Service Call or a Holiday Emergency Service Call it is the visit fee multiplied by that call class's labor
      multiplier; on an Evening Service Call or a Weekend Service Call it is the visit fee plus the evening-and-weekend
      premium fraction of that call class's listed after-hours premium, added only where the visit fee is above zero; on
      any other call class it is the visit fee unchanged.
      The claim-size fee share is set by the total amount approved on the original decisions of the contract's claims for
      the service call: below the
      small-claim limit takes the small-claim fee share, from the small-claim limit up to but not including the mid-claim
      limit takes the mid-claim fee share, and the mid-claim limit or more takes a claim-size fee share of one.
      Repeat-visit relief keeps the service fees of a holder whose equipment needs repeated repairs within a year from
      stacking up: the repeat-visit fee share is set by the number of other claims on the contract approved or partially
      approved on their original decision in the twelve calendar months before the date of handling, the claims of this
      service call not counted: two or more takes the repeat-two-or-more fee share, exactly one takes the repeat-one fee
      share, and none takes a repeat-visit fee share of one.
    prerequisite:
      - problem: warranty_ext_labor_plan_claim_decision
        kind: value_input
        gate: approved_on_visit
        form: state
        policy_source: >-
          The claim service fee for a service call is fixed only after every claim filed on that call against the contract
          carries its original decision.
        condition: >-
          Every claim-file entry on the contract for the service call has a decision entry (decision round 1) posted on the
          contract, so the approved amounts of the call are on record.
        resolved_by: decide_labor_plan_claim_66c3e056
        effect: >-
          Once the original decision is posted, the approved amount on the service call becomes the decision's approved
          amount, which turns the visit fee from zero to the tier's claim service fee and sets the claim-size fee share.
    cross_category:
      - category: service
        as: branch
        reads: [service_tickets.completed_date, service_tickets.variant_name]
        note: The service call's completed date anchors the membership test and its call class sets the after-hours fee share.
      - category: plan
        as: branch
        reads: [status, term_start, term_end, consecutive_terms, warranty_claim_fee_waiver]
        note: The holder's Comfort Club agreement status, term dates, tier waiver and consecutive terms set the member fee share.
    compute:
      - visit_ticket: "LATEST('warranty_claim_entries', 'ticket_id', date_field='entry_date', event_type='warranty_claim_decide', entry_date=NOW)"
      - approved_count: "COUNT('warranty_claim_entries', event_type='warranty_claim_decide', ticket_id=visit_ticket, decision_round=1, decision='approved') + COUNT('warranty_claim_entries', event_type='warranty_claim_decide', ticket_id=visit_ticket, decision_round=1, decision='partially_approved')"
      - visit_fee: "P('claim_service_fee_usd') if approved_count > 0 else 0"
      - visit_date: "CFIELD('service', 'completed_date', ticket_id=visit_ticket) or ''"
      - member_status_active: "EXISTS('plan', status='active')"
      - member_term_covers_visit: "(CFIELD('plan', 'term_start', status='active') or '9999-12-31') <= visit_date and (CFIELD('plan', 'term_end', status='active') or '0000-01-01') >= visit_date"
      - member_tier_waives: "CPARAM('plan', 'warranty_claim_fee_waiver', status='active') == True"
      - member_terms_held: "CFIELD('plan', 'consecutive_terms', status='active') or 0"
      - member_fee_share: "0 if (member_status_active and member_term_covers_visit and member_tier_waives) else (K('member_loyalty_fee_share') if (member_status_active and member_term_covers_visit and member_terms_held >= 3) else 1)"
      - fee_call_class: "CFIELD('service', 'variant_name', ticket_id=visit_ticket)"
      - fee_call_multiplier: "CPARAM('service', 'labor_multiplier', ticket_id=visit_ticket)"
      - fee_call_premium: "CPARAM('service', 'after_hours_premium_usd', ticket_id=visit_ticket)"
      - after_hours_visit_fee: "visit_fee * fee_call_multiplier if (fee_call_class == 'Overnight Emergency Service Call' or fee_call_class == 'Holiday Emergency Service Call') else ((visit_fee + K('evening_weekend_premium_fraction') * fee_call_premium if visit_fee > 0 else 0) if (fee_call_class == 'Evening Service Call' or fee_call_class == 'Weekend Service Call') else visit_fee)"
      - approved_on_visit: "SUM('warranty_claim_entries', 'amount', date_field='entry_date', event_type='warranty_claim_decide', ticket_id=visit_ticket, decision_round=1, decision='approved') + SUM('warranty_claim_entries', 'amount', date_field='entry_date', event_type='warranty_claim_decide', ticket_id=visit_ticket, decision_round=1, decision='partially_approved')"
      - claim_size_fee_share: "K('small_claim_fee_share') if approved_on_visit < K('small_claim_limit_usd') else (K('mid_claim_fee_share') if approved_on_visit < K('mid_claim_limit_usd') else 1)"
      - approved_claims_12m: "COUNT('warranty_claim_entries', within_months=12, date_field='entry_date', event_type='warranty_claim_decide', decision_round=1, decision='approved') + COUNT('warranty_claim_entries', within_months=12, date_field='entry_date', event_type='warranty_claim_decide', decision_round=1, decision='partially_approved')"
      - other_claims_12m: "approved_claims_12m - approved_count"
      - repeat_visit_fee_share: "K('repeat_two_or_more_fee_share') if other_claims_12m >= 2 else (K('repeat_one_fee_share') if other_claims_12m == 1 else 1)"
      - fee_unrounded: "after_hours_visit_fee * member_fee_share * claim_size_fee_share * repeat_visit_fee_share"
      - result: "int(fee_unrounded * 100 + 0.5) / 100"
    compute_basis:
      visit_ticket: "for the service call on which a claim against that contract was decided on the date of handling"
      approved_count: "where at least one claim on the service call was approved or partially approved"
      visit_fee: "Under the standard method the visit fee is the tier's claim service fee where at least one claim on the service call was approved or partially approved, and zero otherwise"
      visit_date: "read against the completed date of the service call"
      member_status_active: "The member fee share is set by the holder's Comfort Club agreement in active status on the date of handling"
      member_term_covers_visit: "such an agreement whose term covers that date"
      member_tier_waives: "at a tier that waives the claim service fee takes a member fee share of zero, so that no fee is charged"
      member_terms_held: "held for three or more consecutive terms takes the loyal-member fee share"
      member_fee_share: "such an agreement whose term covers that date at a tier that waives the claim service fee takes a member fee share of zero, so that no fee is charged; such an agreement whose term covers that date, at a tier that does not waive the fee, held for three or more consecutive terms takes the loyal-member fee share; and any other holder takes a member fee share of one."
      fee_call_class: "The after-hours visit fee is worked out from the visit fee by the call class of the service call"
      fee_call_multiplier: "it is the visit fee multiplied by that call class's labor multiplier"
      fee_call_premium: "the evening-and-weekend premium fraction of that call class's listed after-hours premium"
      after_hours_visit_fee: "on an Overnight Emergency Service Call or a Holiday Emergency Service Call it is the visit fee multiplied by that call class's labor multiplier; on an Evening Service Call or a Weekend Service Call it is the visit fee plus the evening-and-weekend premium fraction of that call class's listed after-hours premium, added only where the visit fee is above zero; on any other call class it is the visit fee unchanged."
      approved_on_visit: "The claim-size fee share is set by the total amount approved on the original decisions of the contract's claims for the service call"
      claim_size_fee_share: "below the small-claim limit takes the small-claim fee share, from the small-claim limit up to but not including the mid-claim limit takes the mid-claim fee share, and the mid-claim limit or more takes a claim-size fee share of one."
      approved_claims_12m: "the number of other claims on the contract approved or partially approved on their original decision in the twelve calendar months before the date of handling"
      other_claims_12m: "the claims of this service call not counted"
      repeat_visit_fee_share: "two or more takes the repeat-two-or-more fee share, exactly one takes the repeat-one fee share, and none takes a repeat-visit fee share of one."
      fee_unrounded: "The claim service fee charged on a labor-only contract is the after-hours visit fee multiplied by the member fee share, the claim-size fee share and the repeat-visit fee share, all three applied to the same after-hours visit fee"
      result: "and rounded to the cent, half up, once at the end."
    factors:
      - id: member_fee_share
        effect: parameter
        decides: member_fee_share
        bindings: [member_status_active, member_term_covers_visit, member_tier_waives, member_terms_held, member_fee_share]
        ladder:
          - when: "the holder's Comfort Club agreement is in active status with a term covering the call's completed date AND its tier waives the claim service fee"
            value: "0"
          - when: "the agreement is in active status with a term covering the call's completed date AND (tier without the waiver) it has been held for three or more consecutive terms"
            value: "K('member_loyalty_fee_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          member_fee_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: plan
      - id: after_hours_visit_fee
        effect: method
        decides: after_hours_visit_fee
        bindings: [fee_call_class, fee_call_multiplier, fee_call_premium, after_hours_visit_fee]
        ladder:
          - when: "the service call is an Overnight Emergency Service Call or a Holiday Emergency Service Call"
            method: "the visit fee is multiplied by the call class's labor multiplier"
          - when: "the service call is an Evening Service Call or a Weekend Service Call"
            method: "the evening-and-weekend premium fraction of the call class's listed after-hours premium is added to the visit fee, where the visit fee is above zero"
          - when: "otherwise"
            method: "the visit fee is used unchanged"
        baseline:
          after_hours_visit_fee: "visit_fee"
        evidence: [cross_category]
        cross_difficulty: service
      - id: claim_size_fee_share
        effect: parameter
        decides: claim_size_fee_share
        bindings: [approved_on_visit, claim_size_fee_share]
        ladder:
          - when: "the amount approved on the contract's claims for the call is below the small-claim limit"
            value: "K('small_claim_fee_share')"
          - when: "it is at least the small-claim limit and below the mid-claim limit"
            value: "K('mid_claim_fee_share')"
          - when: "otherwise (the mid-claim limit or more)"
            value: "1"
        baseline:
          claim_size_fee_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_visit_fee_share
        effect: parameter
        decides: repeat_visit_fee_share
        bindings: [approved_claims_12m, other_claims_12m, repeat_visit_fee_share]
        ladder:
          - when: "two or more other claims on the contract were approved or partially approved in the twelve calendar months before the date of handling"
            value: "K('repeat_two_or_more_fee_share')"
          - when: "exactly one other such claim"
            value: "K('repeat_one_fee_share')"
          - when: "otherwise (none)"
            value: "1"
        baseline:
          repeat_visit_fee_share: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        Under the standard method the visit fee is the tier's claim service fee where at least one claim on the service call
        was approved or partially approved, and zero otherwise, and the fee charged is the visit fee, rounded to the cent, half
        up.
      params: [claim_service_fee_usd]
    inputs:
      history:
        - {table: warranty_claim_entries, aggregate: sum, field: amount, filters: {event_type: warranty_claim_decide}}
        - {table: warranty_claim_entries, aggregate: count, field: claim_entry_id, within_months: 12, filters: {event_type: warranty_claim_decide}}
      cross_category: [service, plan]
  - id: warranty_ext_cancellation_refund
    base_policy_refs: [warranty_cancellation]
    overwrite:
      - base_policy: warranty_cancellation
        superseded_clause: >-
          Otherwise the refund is contract_price multiplied by the unused full months of the coverage term divided by the
          term's months (labor_coverage_years times twelve), rounded to the cent half up, less every claim payout made on the
          contract and less cancellation_admin_fee_usd, and never below zero.
        replaced_by: >-
          Outside that full-refund case the labor-only refund is the unused value less the claims deducted and less the
          administrative fee charged, never below zero, rounded to the cent, half up.
    trigger: on_request
    subject: [warranty_cancel]
    computes: refund_amount
    target_tool: confirm_protection_cancellation_57f0aac4
    params:
      short_rate_share: 0.90
      refund_age_share_over_120_months: 0.80
      refund_age_share_61_to_120_months: 0.90
      experience_share_two_or_more_claims: 0.85
      experience_share_one_claim: 0.95
      admin_fee_share_loyal_member: 0.00
      admin_fee_share_member: 0.50
      recent_decision_days: 30
      forgiven_payout_age_days: 1095
    rule: >-
      This policy fixes the refund credited when the holder of a Harbison 5-Year Labor Protection or Harbison 10-Year Labor
      Protection contract, the labor-only tiers, confirms the cancellation request on file; the cancellation takes effect on
      the date of confirmation and the refund is credited against the contract-price charge on the contract, or against no
      charge on the contract where the tier was bought on the installation contract and its price billed on the
      installation project.
      A cancellation refund is not fixed until every claim filed on the contract carries its original decision.
      Before a cancellation refund is recorded, the contract must carry the claim service fee owed for every service call on
      which a claim against it was approved or partially approved.
      A holder who gives notice within the tier's full-refund days of the purchase date, the day of notice being the day the
      pending written cancellation request was received or else the date of confirmation, with no claim payout made on the
      contract, is refunded the full contract price.
      Under the standard method the unused value is the contract price multiplied by the unused full months, counted as
      complete month-to-month steps from the date the cancellation takes effect that end on or before the coverage end,
      divided by the term's months, which are the tier's labor coverage years times twelve.
      Under the standard method the claims deducted are every claim payout made on the contract, and the administrative fee
      charged is the tier's cancellation administrative fee.
      Outside that full-refund case the labor-only refund is the unused value less the claims deducted and less the
      administrative fee charged, never below zero, rounded to the cent, half up.
      The unused period starts on the refund start date: where a Harbison installation contract in scheduled status replaces
      the covered unit, the refund start date is that installation's scheduled date; where no such installation is
      scheduled and the holder's pending written cancellation request was received before the date of confirmation, it is the date
      that request was received; otherwise it is the date the cancellation takes effect.
      The unused share depends on how long the holder has held the contract, in whole calendar months from the purchase date
      to the date of confirmation: more than thirty-six months takes the daily share, which is the calendar days from the
      refund start date through the coverage end, both counted, divided by the calendar days from the coverage start
      through the coverage end, both counted; twelve months or fewer takes the short-rate share of the whole-month share;
      and any other holding period takes the whole-month share, which is the complete month-to-month steps from the refund
      start date that end on or before the coverage end, divided by the term's months. A contract still pending counts its
      whole term as unused, so its unused share is one.
      The unused value of a labor-only contract is the contract price multiplied by the unused share, the equipment-age
      refund share and the claims-experience share, all applied to the same contract price, and rounded to the cent, half up.
      The equipment-age refund share is set by the whole calendar months from the installed date of the Harbison installation
      named on the contract, or from the coverage start where it names none, to the date of confirmation: more than one
      hundred twenty months takes the over-one-hundred-twenty-month refund share, more than sixty and up to one hundred twenty
      months takes the sixty-one-to-one-hundred-twenty-month refund share, and sixty months or fewer takes a share of one.
      The claims-experience share is set by the number of claims on the contract whose original decision approved or
      partially approved them: two or more takes the two-or-more-claims experience share, exactly one takes the one-claim
      experience share, and none takes a claims-experience share of one.
      The claims deducted on a labor-only cancellation follow the claim history: where an original decision was posted on
      the contract within the recent-decision days before the date of confirmation, the claims deducted are the larger of
      the total of every claim payout made on the contract and the total approved on its original decisions; where no decision is that recent and the latest claim
      payout was made more than the forgiven-payout age in days before the date of confirmation, or no payout was ever made,
      nothing is deducted; otherwise the claims deducted are every claim payout made.
      The administrative fee charged is the tier's cancellation administrative fee times the member admin-fee share, set by
      the holder's Comfort Club agreement in active status on the date of confirmation: such an agreement held for three or
      more consecutive terms takes the loyal-member admin-fee share, such an agreement held for fewer than three
      consecutive terms takes the member admin-fee share, and a holder with no agreement in active status takes an
      admin-fee share of one.
    prerequisite:
      - problem: warranty_ext_labor_plan_claim_decision
        kind: value_input
        gate: claims_deducted
        form: state
        policy_source: >-
          A cancellation refund is not fixed until every claim filed on the contract carries its original decision.
        condition: >-
          Every claim-file entry on the contract has a decision entry (decision round 1) posted on the contract.
        resolved_by: decide_labor_plan_claim_66c3e056
        effect: >-
          The original decision adds the claim's approved amount to the approved amounts of original decisions and a recent
          decision date, so the claims deducted become the larger of the payouts and the approved amounts, and the
          claims-experience share counts the newly approved claim.
      - problem: warranty_ext_visit_claim_service_fee
        kind: state_gate
        gate: warranty_billing_entries.line_type
        form: state
        policy_source: >-
          Before a cancellation refund is recorded, the contract must carry the claim service fee owed for every service call on
          which a claim against it was approved or partially approved.
        condition: >-
          Every service call that carries an approved or partially approved original decision on the contract has a claim
          service fee charge entry (line type claim_service_fee) naming it on the contract, unless the fee is waived for the
          holder's Comfort Club tier.
        resolved_by: charge_claim_service_fee_b62a9756
        effect: >-
          The fee charge stands on the contract balance, so the refund credit first clears it and only the remaining credit
          balance is paid out to the original payment method when the cancellation is recorded.
    cross_category:
      - category: install
        as: branch
        reads: [installed_date, scheduled_date, status, replaced_equipment_id]
        note: A scheduled Harbison replacement of the covered unit sets the refund start date, and the contract's installation date sets the equipment-age refund share.
      - category: plan
        as: branch
        reads: [status, consecutive_terms]
        note: The holder's Comfort Club agreement status and consecutive terms set the member admin-fee share.
    compute:
      - notice_date: "LATEST('warranty_change_requests', 'created_at', date_field='created_at', request_type='cancellation', request_status='pending_customer_confirmation') or NOW"
      - full_refund_case: "1 if (DAYS(F('purchase_date'), MN(notice_date, NOW)) <= P('cancellation_full_refund_days') and SUM('warranty_claim_entries', 'amount', date_field='entry_date', event_type='warranty_claim_payout') == 0) else 0"
      - term_months: "P('labor_coverage_years') * 12"
      - replacement_date: "CFIELD('install', 'scheduled_date', replaced_equipment_id=F('equipment_id'), status='scheduled')"
      - request_received: "LATEST('warranty_change_requests', 'created_at', date_field='created_at', request_type='cancellation', request_status='pending_customer_confirmation')"
      - refund_start: "replacement_date if replacement_date != None else (request_received if (request_received != None and request_received < NOW) else NOW)"
      - months_held: "MONTHS(F('purchase_date'), NOW)"
      - unused_share: "((DAYS(refund_start, F('coverage_end')) + 1) / (DAYS(F('coverage_start'), F('coverage_end')) + 1)) if months_held > 36 else ((MONTHS(refund_start, F('coverage_end')) * K('short_rate_share') / term_months) if months_held <= 12 else (MONTHS(refund_start, F('coverage_end')) / term_months))"
      - refund_installed_date: "CFIELD('install', 'installed_date', install_id=F('install_id'))"
      - months_in_service_now: "MONTHS(refund_installed_date if refund_installed_date != None else F('coverage_start'), NOW)"
      - refund_age_share: "K('refund_age_share_over_120_months') if months_in_service_now > 120 else (K('refund_age_share_61_to_120_months') if months_in_service_now > 60 else 1)"
      - approved_claim_count: "COUNT('warranty_claim_entries', event_type='warranty_claim_decide', decision_round=1, decision='approved') + COUNT('warranty_claim_entries', event_type='warranty_claim_decide', decision_round=1, decision='partially_approved')"
      - experience_share: "K('experience_share_two_or_more_claims') if approved_claim_count >= 2 else (K('experience_share_one_claim') if approved_claim_count == 1 else 1)"
      - unused_share_applied: "1 if F('status') == 'pending' else unused_share"
      - unused_value: "int(F('contract_price') * unused_share_applied * refund_age_share * experience_share * 100 + 0.5) / 100"
      - payouts_made: "SUM('warranty_claim_entries', 'amount', date_field='entry_date', event_type='warranty_claim_payout')"
      - approved_original: "SUM('warranty_claim_entries', 'amount', date_field='entry_date', event_type='warranty_claim_decide', decision_round=1, decision='approved') + SUM('warranty_claim_entries', 'amount', date_field='entry_date', event_type='warranty_claim_decide', decision_round=1, decision='partially_approved')"
      - last_decision_date: "LATEST('warranty_claim_entries', 'entry_date', date_field='entry_date', event_type='warranty_claim_decide', decision_round=1)"
      - last_payout_date: "LATEST('warranty_claim_entries', 'entry_date', date_field='entry_date', event_type='warranty_claim_payout')"
      - claims_deducted: "MX(payouts_made, approved_original) if (last_decision_date != None and DAYS(last_decision_date, NOW) <= K('recent_decision_days')) else (0 if (last_payout_date == None or DAYS(last_payout_date, NOW) > K('forgiven_payout_age_days')) else payouts_made)"
      - member_active_now: "EXISTS('plan', status='active')"
      - member_terms_now: "CFIELD('plan', 'consecutive_terms', status='active') or 0"
      - admin_fee_share: "K('admin_fee_share_loyal_member') if (member_active_now and member_terms_now >= 3) else (K('admin_fee_share_member') if (member_active_now and member_terms_now < 3) else 1)"
      - admin_fee_charged: "P('cancellation_admin_fee_usd') * admin_fee_share"
      - refund_unrounded: "F('contract_price') if full_refund_case == 1 else MX(0, unused_value - claims_deducted - admin_fee_charged)"
      - result: "int(refund_unrounded * 100 + 0.5) / 100"
    compute_basis:
      notice_date: "the day of notice being the day the pending written cancellation request was received or else the date of confirmation"
      full_refund_case: "A holder who gives notice within the tier's full-refund days of the purchase date, the day of notice being the day the pending written cancellation request was received or else the date of confirmation, with no claim payout made on the contract, is refunded the full contract price."
      term_months: "divided by the term's months, which are the tier's labor coverage years times twelve"
      replacement_date: "where a Harbison installation contract in scheduled status replaces the covered unit, the refund start date is that installation's scheduled date"
      request_received: "where no such installation is scheduled and the holder's pending written cancellation request was received before the date of confirmation, it is the date that request was received"
      refund_start: "The unused period starts on the refund start date: where a Harbison installation contract in scheduled status replaces the covered unit, the refund start date is that installation's scheduled date; where no such installation is scheduled and the holder's pending written cancellation request was received before the date of confirmation, it is the date that request was received; otherwise it is the date the cancellation takes effect."
      months_held: "The unused share depends on how long the holder has held the contract, in whole calendar months from the purchase date to the date of confirmation"
      unused_share: "more than thirty-six months takes the daily share, which is the calendar days from the refund start date through the coverage end, both counted, divided by the calendar days from the coverage start through the coverage end, both counted; twelve months or fewer takes the short-rate share of the whole-month share; and any other holding period takes the whole-month share, which is the complete month-to-month steps from the refund start date that end on or before the coverage end, divided by the term's months."
      unused_share_applied: "A contract still pending counts its whole term as unused, so its unused share is one."
      refund_installed_date: "from the installed date of the Harbison installation named on the contract, or from the coverage start where it names none, to the date of confirmation"
      months_in_service_now: "The equipment-age refund share is set by the whole calendar months from the installed date of the Harbison installation named on the contract, or from the coverage start where it names none, to the date of confirmation"
      refund_age_share: "more than one hundred twenty months takes the over-one-hundred-twenty-month refund share, more than sixty and up to one hundred twenty months takes the sixty-one-to-one-hundred-twenty-month refund share, and sixty months or fewer takes a share of one."
      approved_claim_count: "The claims-experience share is set by the number of claims on the contract whose original decision approved or partially approved them"
      experience_share: "two or more takes the two-or-more-claims experience share, exactly one takes the one-claim experience share, and none takes a claims-experience share of one."
      unused_value: "The unused value of a labor-only contract is the contract price multiplied by the unused share, the equipment-age refund share and the claims-experience share, all applied to the same contract price, and rounded to the cent, half up."
      payouts_made: "the claims deducted are every claim payout made"
      approved_original: "the total approved on its original decisions"
      last_decision_date: "where an original decision was posted on the contract within the recent-decision days before the date of confirmation"
      last_payout_date: "where no decision is that recent and the latest claim payout was made more than the forgiven-payout age in days before the date of confirmation, or no payout was ever made, nothing is deducted"
      claims_deducted: "where an original decision was posted on the contract within the recent-decision days before the date of confirmation, the claims deducted are the larger of the total of every claim payout made on the contract and the total approved on its original decisions; where no decision is that recent and the latest claim payout was made more than the forgiven-payout age in days before the date of confirmation, or no payout was ever made, nothing is deducted; otherwise the claims deducted are every claim payout made."
      member_active_now: "set by the holder's Comfort Club agreement in active status on the date of confirmation"
      member_terms_now: "held for three or more consecutive terms"
      admin_fee_share: "such an agreement held for three or more consecutive terms takes the loyal-member admin-fee share, such an agreement held for fewer than three consecutive terms takes the member admin-fee share, and a holder with no agreement in active status takes an admin-fee share of one."
      admin_fee_charged: "The administrative fee charged is the tier's cancellation administrative fee times the member admin-fee share"
      refund_unrounded: "Outside that full-refund case the labor-only refund is the unused value less the claims deducted and less the administrative fee charged, never below zero, rounded to the cent, half up."
      result: "rounded to the cent, half up"
    factors:
      - id: refund_start_anchor
        effect: parameter
        decides: refund_start
        bindings: [replacement_date, request_received, refund_start]
        ladder:
          - when: "a Harbison installation contract in scheduled status replaces the covered unit"
            value: "the installation's scheduled date"
          - when: "no such installation is scheduled AND the holder's pending written cancellation request was received before the date of confirmation"
            value: "the date the request was received"
          - when: "otherwise"
            value: "the date the cancellation takes effect (the date of confirmation)"
        baseline:
          refund_start: "NOW"
        evidence: [cross_category, history, date]
        cross_difficulty: install
      - id: unused_share_day_count
        effect: method
        decides: unused_share
        bindings: [months_held, unused_share]
        ladder:
          - when: "the contract has been held more than thirty-six whole calendar months"
            method: "daily share: calendar days from the refund start date through the coverage end, both counted, over the calendar days of the whole coverage term, both ends counted"
          - when: "the contract has been held twelve whole calendar months or fewer"
            method: "short-rate share: the whole-month share multiplied by the short-rate share"
          - when: "otherwise (held more than twelve and up to thirty-six months)"
            method: "whole-month share: complete month-to-month steps from the refund start date ending on or before the coverage end, over the term's months"
        baseline:
          unused_share: "MONTHS(refund_start, F('coverage_end')) / term_months"
        evidence: [date]
        cross_difficulty: null
      - id: equipment_age_refund_share
        effect: parameter
        decides: refund_age_share
        bindings: [refund_installed_date, months_in_service_now, refund_age_share]
        ladder:
          - when: "more than one hundred twenty whole calendar months from the installed date to the date of confirmation"
            value: "K('refund_age_share_over_120_months')"
          - when: "more than sixty and up to one hundred twenty months"
            value: "K('refund_age_share_61_to_120_months')"
          - when: "otherwise (sixty months or fewer)"
            value: "1"
        baseline:
          refund_age_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: install
      - id: claims_experience_share
        effect: parameter
        decides: experience_share
        bindings: [approved_claim_count, experience_share]
        ladder:
          - when: "two or more claims on the contract were approved or partially approved on their original decision"
            value: "K('experience_share_two_or_more_claims')"
          - when: "exactly one such claim"
            value: "K('experience_share_one_claim')"
          - when: "otherwise (none)"
            value: "1"
        baseline:
          experience_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: claims_deducted_method
        effect: method
        decides: claims_deducted
        bindings: [payouts_made, approved_original, last_decision_date, last_payout_date, claims_deducted]
        ladder:
          - when: "an original decision was posted on the contract within the recent-decision days before the date of confirmation"
            method: "deduct the larger of the total of the payouts made and the total approved on original decisions"
          - when: "no decision is that recent AND the latest payout is older than the forgiven-payout age, or no payout was ever made"
            method: "deduct nothing"
          - when: "otherwise"
            method: "deduct every claim payout made"
        baseline:
          claims_deducted: "payouts_made"
        evidence: [history, date]
        cross_difficulty: null
      - id: member_admin_fee_share
        effect: parameter
        decides: admin_fee_share
        bindings: [member_active_now, member_terms_now, admin_fee_share]
        ladder:
          - when: "the holder's Comfort Club agreement is in active status AND has been held for three or more consecutive terms"
            value: "K('admin_fee_share_loyal_member')"
          - when: "the agreement is in active status AND has been held for fewer than three consecutive terms"
            value: "K('admin_fee_share_member')"
          - when: "otherwise"
            value: "1"
        baseline:
          admin_fee_share: "1"
        evidence: [cross_category]
        cross_difficulty: plan
    baseline:
      rule: >-
        A holder who gives notice within the tier's full-refund days of the purchase date, the day of notice being the day the
        pending written cancellation request was received or else the date of confirmation, with no claim payout made on the
        contract, is refunded the full contract price.
        Under the standard method the unused value is the contract price multiplied by the unused full months, counted as
        complete month-to-month steps from the date the cancellation takes effect that end on or before the coverage end,
        divided by the term's months, which are the tier's labor coverage years times twelve.
        Under the standard method the claims deducted are every claim payout made on the contract, and the administrative fee
        charged is the tier's cancellation administrative fee.
        Outside that full-refund case the labor-only refund is the unused value less the claims deducted and less the
        administrative fee charged, never below zero, rounded to the cent, half up.
      params: [cancellation_full_refund_days, labor_coverage_years, cancellation_admin_fee_usd]
    inputs:
      history:
        - {table: warranty_claim_entries, aggregate: sum, field: amount, filters: {event_type: warranty_claim_payout}}
        - {table: warranty_claim_entries, aggregate: sum, field: amount, filters: {event_type: warranty_claim_decide, decision_round: 1}}
        - {table: warranty_claim_entries, aggregate: count, field: claim_entry_id, filters: {event_type: warranty_claim_decide, decision_round: 1}}
        - {table: warranty_change_requests, aggregate: latest, field: created_at, filters: {request_type: cancellation}}
      cross_category: [install, plan]
  - id: warranty_ext_parts_labor_claim_decision
    base_policy_refs: [warranty_evt_claim_coverage, warranty_evt_claim_payout, warranty_evt_claim_appeal, warranty_evt_no_lemon]
    overwrite:
      - base_policy: warranty_evt_claim_payout
        superseded_clause: >-
          labor is paid up to the labor sublimit for that component
        replaced_by: >-
          On a parts-and-labor contract, where the claim's service call class carries a labor multiplier above one and the
          tier covers the after-hours premium, the labor allowed is the labor net up to the member sublimit multiplied by that
          labor multiplier; where the call class carries a labor multiplier above one and the tier does not cover the
          after-hours premium, the labor allowed is the labor net divided by that labor multiplier, up to the member sublimit;
          on a call class whose labor multiplier is one, the labor allowed is the labor net up to the member sublimit.
      - base_policy: warranty_evt_claim_payout
        superseded_clause: >-
          refrigerant is paid where refrigerant_covered is true for a failure in the refrigerant circuit, up to
          refrigerant_max_lbs_per_claim pounds, together with the leak search task where refrigerant_leak_search_covered is
          true
        replaced_by: >-
          The refrigerant pounds paid on a refrigerant-circuit claim follow the refrigerant the holder's Harbison invoices
          show added in the twelve calendar months before the date of handling, the claim's own service call not counted:
          where those earlier pounds reach the pre-existing-leak pounds, no refrigerant is paid; where they are above zero and
          below that, the pounds paid are the pounds billed on the claim's service call less those earlier pounds, never below
          zero, up to the tier's refrigerant pound limit; where there are none, the pounds paid are the pounds billed up to
          that limit.
          The leak-search share of a refrigerant-circuit claim follows the failed component: a compressor takes the
          compressor leak-search share, a metering device or reversing valve takes the valve leak-search share, and any other
          component takes the tier's own leak-search coverage; the leak search paid is the leak search net times that share.
      - base_policy: warranty_evt_claim_coverage
        superseded_clause: >-
          When the manufacturer warranty supplies the part, the claim is partially_approved with denial_reason
          manufacturer_parts_coverage_applies for the parts and pays the remaining covered components
        replaced_by: >-
          Where the manufacturer's parts warranty supplies the part, the parts line is paid up to a parts-handling allowance:
          a compressor, condenser coil or evaporator coil takes the major-part handling allowance and any other component
          takes the minor-part handling allowance; where the manufacturer's parts warranty does not supply the part, the parts
          paid are the standard ones.
      - base_policy: warranty_evt_claim_payout
        superseded_clause: >-
          its after-hours premium where after_hours_premium_covered is true
        replaced_by: >-
          The premium share of a parts-and-labor claim follows how the service call was booked: on a tier that covers the
          after-hours premium, a call booked for any symptom other than no heat, no cooling or a carbon monoxide alarm takes a
          premium share of zero, and a call booked for one of those symptoms one or more calendar days before its scheduled
          date takes the booked-ahead premium share; any other call takes the tier's own after-hours coverage, which is one on a
          tier that covers the premium and zero on a tier that does not.
    trigger: state_due
    subject: [warranty_claim_decide]
    computes: approved_amount
    target_tool: decide_parts_labor_claim_22401446
    params:
      member_uplift_top_tier: 1.25
      member_uplift_loyal: 1.10
      top_tier_repair_discount_pct: 20
      preexisting_leak_lbs: 3.0
      booked_ahead_premium_share: 0.50
      major_part_handling_usd: 150.00
      minor_part_handling_usd: 60.00
      leak_search_share_compressor: 0.50
      leak_search_share_valve: 0.75
    rule: >-
      This policy sets the original decision on a claim filed against a Harbison 10-Year Parts & Labor Protection, Harbison
      12-Year Total Protection or Harbison 12-Year Total Protection Plus contract, the parts-and-labor tiers, and fixes the
      approved amount written on that decision; the coverage tests of the base claim rules decide whether the claim is
      approved at all, a claim whose part the manufacturer supplies is partially approved for the parts, and the decision is
      made on the filing date. The claim decided is the claim filed on the contract on the date of handling, together with the
      service call, failed unit, failed component and failure date recorded on it.
      The parts-and-labor claim payable is the labor allowed plus the parts paid plus the refrigerant paid plus the leak
      search paid plus the diagnostic paid plus the premium paid, capped at the tier's per-claim limit and at the contract's
      remaining claim benefit, and the approved amount written on the decision is that capped figure rounded to the cent,
      half up, with every intermediate figure kept unrounded.
      Each line's net is the line charged on the claim's service call less the Comfort Club member discount posted against
      that line, which is the member repair discount on a labor, parts or leak search line, the member diagnostic rate on
      the diagnostic fee and the member premium discount on the after-hours premium; the labor and parts lines are the ones
      billed under the price-book task of the failed component, and the leak search line is the one billed under the
      refrigerant leak search task.
      Under the standard method the labor allowed is the labor net up to the tier's labor sublimit for the failed component
      (motor, control, compressor, coil or heat exchanger sublimit, and no sublimit for any other covered component), and
      the parts paid are the parts net where the tier covers parts within its parts coverage years and no manufacturer parts
      warranty applies on the failure date, and zero where one applies.
      The manufacturer parts warranty applies while the failure date is within the parts years confirmed by the manufacturer
      registration on the contract's Harbison installation, or within the manufacturer's unregistered parts term where no
      registration exists, counted in whole calendar months from the installed date.
      Under the standard method, on a failure in the refrigerant circuit (a compressor, condenser coil, evaporator coil,
      metering device or reversing valve), the refrigerant paid is the pounds billed on the claim's service call up to the
      tier's refrigerant pound limit times the billed price per pound where the tier covers refrigerant, and the leak search
      paid is the leak search net where the tier covers the leak search.
      Under the standard method the diagnostic paid and the premium paid are the diagnostic net and the premium net where the
      tier covers each of them, and each is paid only on the first claim decided on that service call.
      The member sublimit is the tier's labor sublimit for the failed component multiplied by the member uplift, set by the
      holder's Comfort Club agreement: an agreement in active status at a tier whose member repair discount is at least the
      top-tier repair discount takes the top-tier member uplift; an agreement in active status at a lower tier held for three
      or more consecutive terms takes the loyal-member uplift; any other holder takes a member uplift of one.
      On a parts-and-labor contract, where the claim's service call class carries a labor multiplier above one and the
      tier covers the after-hours premium, the labor allowed is the labor net up to the member sublimit multiplied by that
      labor multiplier; where the call class carries a labor multiplier above one and the tier does not cover the
      after-hours premium, the labor allowed is the labor net divided by that labor multiplier, up to the member sublimit;
      on a call class whose labor multiplier is one, the labor allowed is the labor net up to the member sublimit.
      The refrigerant pounds paid on a refrigerant-circuit claim follow the refrigerant the holder's Harbison invoices
      show added in the twelve calendar months before the date of handling, the claim's own service call not counted:
      where those earlier pounds reach the pre-existing-leak pounds, no refrigerant is paid; where they are above zero and
      below that, the pounds paid are the pounds billed on the claim's service call less those earlier pounds, never below
      zero, up to the tier's refrigerant pound limit; where there are none, the pounds paid are the pounds billed up to
      that limit.
      The leak-search share of a refrigerant-circuit claim follows the failed component: a compressor takes the
      compressor leak-search share, a metering device or reversing valve takes the valve leak-search share, and any other
      component takes the tier's own leak-search coverage; the leak search paid is the leak search net times that share.
      Where the manufacturer's parts warranty supplies the part, the parts line is paid up to a parts-handling allowance:
      a compressor, condenser coil or evaporator coil takes the major-part handling allowance and any other component
      takes the minor-part handling allowance; where the manufacturer's parts warranty does not supply the part, the parts
      paid are the standard ones.
      The premium share of a parts-and-labor claim follows how the service call was booked: on a tier that covers the
      after-hours premium, a call booked for any symptom other than no heat, no cooling or a carbon monoxide alarm takes a
      premium share of zero, and a call booked for one of those symptoms one or more calendar days before its scheduled
      date takes the booked-ahead premium share; any other call takes the tier's own after-hours coverage, which is one on a
      tier that covers the premium and zero on a tier that does not. The premium paid is the premium net times the premium share, only on
      the first claim decided on the service call.
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [service_tickets.completed_date, service_tickets.symptom, service_tickets.booked_at, service_tickets.scheduled_date, labor_multiplier, service_lines.amount, service_lines.quantity, service_lines.line_id]
        note: The claim's invoice lines, the call class multiplier, the booking date and symptom, and the refrigerant added on earlier calls decide the after-hours labor basis, the refrigerant pounds and the premium share.
      - category: install
        as: history
        reads: [installed_date, install_ledger.registered_parts_years, mfr_parts_years_unregistered]
        note: The installation's registration decides whether the manufacturer supplies the part and so the parts-handling allowance.
      - category: plan
        as: branch
        reads: [status, consecutive_terms, repair_discount_pct]
        note: The holder's Comfort Club agreement sets the member uplift on the labor sublimit.
    compute:
      - claim_ticket: "LATEST('warranty_claim_entries', 'ticket_id', date_field='entry_date', event_type='warranty_claim_file', entry_date=NOW)"
      - claim_component: "LATEST('warranty_claim_entries', 'component', date_field='entry_date', event_type='warranty_claim_file', entry_date=NOW)"
      - failure_date: "CFIELD('service', 'completed_date', ticket_id=claim_ticket)"
      - refrigerant_circuit: "claim_component == 'compressor' or claim_component == 'condenser_coil' or claim_component == 'evaporator_coil' or claim_component == 'txv_metering_device' or claim_component == 'reversing_valve'"
      - repair_task: "'blower_motor_replace' if claim_component == 'blower_motor' else ('inducer_motor_replace' if claim_component == 'inducer_motor' else ('condenser_fan_motor_replace' if claim_component == 'condenser_fan_motor' else ('control_board_replace' if claim_component == 'control_board' else ('defrost_board_replace' if claim_component == 'defrost_board' else ('gas_valve_replace' if claim_component == 'gas_valve' else ('igniter_replace' if claim_component == 'igniter' else ('flame_sensor_service' if claim_component == 'flame_sensor' else ('pressure_switch_replace' if claim_component == 'pressure_switch' else ('capacitor_replace' if claim_component == 'capacitor' else ('contactor_replace' if claim_component == 'contactor' else ('compressor_replace' if claim_component == 'compressor' else ('condenser_coil_replace' if claim_component == 'condenser_coil' else ('evaporator_coil_replace' if claim_component == 'evaporator_coil' else ('txv_replace' if claim_component == 'txv_metering_device' else ('reversing_valve_replace' if claim_component == 'reversing_valve' else ('condensate_pump_replace' if claim_component == 'condensate_pump' else ('thermostat_replace' if claim_component == 'thermostat' else 'none')))))))))))))))))"
      - labor_line: "XLATEST('service', 'service_lines', 'line_id', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='repair_labor', task_code=repair_task)"
      - labor_net: "XSUM('service', 'service_lines', 'amount', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='repair_labor', task_code=repair_task) - XSUM('service', 'service_lines', 'amount', date_field='posted_date', event_type='service_discount', line_type='member_repair_discount', source_line_id=labor_line)"
      - parts_line: "XLATEST('service', 'service_lines', 'line_id', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='repair_parts', task_code=repair_task)"
      - parts_net: "XSUM('service', 'service_lines', 'amount', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='repair_parts', task_code=repair_task) - XSUM('service', 'service_lines', 'amount', date_field='posted_date', event_type='service_discount', line_type='member_repair_discount', source_line_id=parts_line)"
      - leak_line: "XLATEST('service', 'service_lines', 'line_id', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', task_code='refrigerant_leak_search')"
      - leak_net: "XSUM('service', 'service_lines', 'amount', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', task_code='refrigerant_leak_search') - XSUM('service', 'service_lines', 'amount', date_field='posted_date', event_type='service_discount', line_type='member_repair_discount', source_line_id=leak_line)"
      - billed_lbs: "XSUM('service', 'service_lines', 'quantity', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='refrigerant')"
      - billed_refrigerant: "XSUM('service', 'service_lines', 'amount', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='refrigerant')"
      - price_per_lb: "billed_refrigerant / billed_lbs if billed_lbs > 0 else 0"
      - labor_sublimit: "P('motor_labor_sublimit_usd') if (claim_component == 'blower_motor' or claim_component == 'inducer_motor' or claim_component == 'condenser_fan_motor') else (P('control_labor_sublimit_usd') if (claim_component == 'control_board' or claim_component == 'defrost_board' or claim_component == 'gas_valve') else (P('compressor_labor_sublimit_usd') if claim_component == 'compressor' else (P('coil_labor_sublimit_usd') if (claim_component == 'condenser_coil' or claim_component == 'evaporator_coil') else (P('heat_exchanger_labor_sublimit_usd') if claim_component == 'heat_exchanger' else -1))))"
      - member_active: "EXISTS('plan', status='active')"
      - member_discount_pct: "CPARAM('plan', 'repair_discount_pct', status='active') or 0"
      - member_terms: "CFIELD('plan', 'consecutive_terms', status='active') or 0"
      - member_uplift: "K('member_uplift_top_tier') if (member_active and member_discount_pct >= K('top_tier_repair_discount_pct')) else (K('member_uplift_loyal') if (member_active and member_terms >= 3) else 1)"
      - member_sublimit: "labor_sublimit * member_uplift if labor_sublimit >= 0 else labor_net"
      - call_multiplier: "CPARAM('service', 'labor_multiplier', ticket_id=claim_ticket)"
      - tier_covers_after_hours: "P('after_hours_premium_covered') == True"
      - labor_allowed: "MN(labor_net, member_sublimit * call_multiplier) if (call_multiplier > 1 and tier_covers_after_hours) else (MN(labor_net / call_multiplier, member_sublimit) if (call_multiplier > 1 and not tier_covers_after_hours) else MN(labor_net, member_sublimit))"
      - unit_installed_date: "CFIELD('install', 'installed_date', install_id=F('install_id')) or F('coverage_start')"
      - registered_years: "XLATEST('install', 'install_ledger', 'registered_parts_years', date_field='posted_date', install_id=F('install_id'), line_type='mfr_registration')"
      - mfr_years: "registered_years if registered_years != None else (CPARAM('install', 'mfr_parts_years_unregistered', install_id=F('install_id')) or 0)"
      - mfr_supplies_part: "MONTHS(unit_installed_date, failure_date) < mfr_years * 12"
      - parts_std: "parts_net if (P('parts_coverage_years') > 0 and MONTHS(F('coverage_start'), failure_date) < P('parts_coverage_years') * 12 and not mfr_supplies_part) else 0"
      - major_part: "claim_component == 'compressor' or claim_component == 'condenser_coil' or claim_component == 'evaporator_coil'"
      - parts_paid: "MN(parts_net, K('major_part_handling_usd')) if (mfr_supplies_part and major_part) else (MN(parts_net, K('minor_part_handling_usd')) if (mfr_supplies_part and not major_part) else parts_std)"
      - lbs_12m: "XSUM('service', 'service_lines', 'quantity', within_months=12, date_field='posted_date', event_type='service_charge', line_type='refrigerant')"
      - earlier_lbs: "lbs_12m - billed_lbs"
      - lbs_paid: "0 if earlier_lbs >= K('preexisting_leak_lbs') else (MN(MX(billed_lbs - earlier_lbs, 0), P('refrigerant_max_lbs_per_claim')) if earlier_lbs > 0 else MN(billed_lbs, P('refrigerant_max_lbs_per_claim')))"
      - refrigerant_paid: "lbs_paid * price_per_lb if (refrigerant_circuit and P('refrigerant_covered')) else 0"
      - leak_component: "LATEST('warranty_claim_entries', 'component', date_field='entry_date', event_type='warranty_claim_file', entry_date=NOW)"
      - leak_share: "K('leak_search_share_compressor') if leak_component == 'compressor' else (K('leak_search_share_valve') if (leak_component == 'txv_metering_device' or leak_component == 'reversing_valve') else (1 if P('refrigerant_leak_search_covered') else 0))"
      - leak_paid: "leak_net * leak_share if (refrigerant_circuit and P('refrigerant_leak_search_covered')) else 0"
      - first_on_call: "1 if (COUNT('warranty_claim_entries', event_type='warranty_claim_decide', ticket_id=claim_ticket) == 0 and COUNT('warranty_claim_entries', event_type='warranty_claim_file', ticket_id=claim_ticket) >= 1) else 0"
      - diag_line: "XLATEST('service', 'service_lines', 'line_id', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='diagnostic_fee')"
      - diag_net: "XSUM('service', 'service_lines', 'amount', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='diagnostic_fee') - XSUM('service', 'service_lines', 'amount', date_field='posted_date', event_type='service_discount', line_type='member_diagnostic_rate', source_line_id=diag_line)"
      - diag_paid: "diag_net * first_on_call if P('diagnostic_fee_covered') else 0"
      - premium_line: "XLATEST('service', 'service_lines', 'line_id', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='after_hours_premium')"
      - premium_net: "XSUM('service', 'service_lines', 'amount', date_field='posted_date', ticket_id=claim_ticket, event_type='service_charge', line_type='after_hours_premium') - XSUM('service', 'service_lines', 'amount', date_field='posted_date', event_type='service_discount', line_type='member_premium_discount', source_line_id=premium_line)"
      - booked_symptom: "CFIELD('service', 'symptom', ticket_id=claim_ticket)"
      - booked_urgent: "booked_symptom == 'no_heat' or booked_symptom == 'no_cool' or booked_symptom == 'carbon_monoxide_alarm'"
      - booking_lead_days: "DAYS(CFIELD('service', 'booked_at', ticket_id=claim_ticket), CFIELD('service', 'scheduled_date', ticket_id=claim_ticket))"
      - premium_covered: "P('after_hours_premium_covered') == True"
      - premium_share: "0 if (premium_covered and not booked_urgent) else (K('booked_ahead_premium_share') if (premium_covered and booked_urgent and booking_lead_days >= 1) else (1 if premium_covered else 0))"
      - premium_paid: "premium_net * premium_share * first_on_call"
      - claim_total: "labor_allowed + parts_paid + refrigerant_paid + leak_paid + diag_paid + premium_paid"
      - capped_total: "MN(claim_total, P('per_claim_limit_usd'), F('claim_limit_remaining'))"
      - result: "int(capped_total * 100 + 0.5) / 100"
    compute_basis:
