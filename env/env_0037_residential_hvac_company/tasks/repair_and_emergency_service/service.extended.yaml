events:
  - type: service_book
    target: service_tickets
    mutation: create
    meaning: A service call is booked for a home under a call class.
    grain: One row per call booked.
    fields:
      ticket_id: Reference number assigned to the call.
      customer_id: Customer.
      equipment_id: Unit the call is about, empty when no single unit is concerned.
      variant_name: Call class under service_call_class_eligibility.
      booked_at: Moment of booking (the handling moment).
      booked_channel: Channel of booking.
      scheduled_date: Date of the arrival window.
      arrival_window: Arrival window booked.
      symptom: Primary symptom.
      recall_of_ticket_id: Earlier call this one returns to under the repair guarantee, else empty.
    triggers: []

  - type: service_dispatch
    target: service_tickets
    mutation: {transition: {from: booked, to: dispatched}}
    meaning: A technician is dispatched to the call.
    grain: One row per transaction.
    fields:
      ticket_id: Call dispatched.
      status: Set to dispatched.
      dispatched_at: Moment of dispatch.
    triggers: []

  - type: service_complete
    target: service_tickets
    mutation: {transition: {from: dispatched, to: completed}}
    meaning: The technician finishes the work and the invoice is issued; the visit's diagnostic fee or tune-up charge and any premium are billed.
    grain: One row per transaction.
    fields:
      ticket_id: Call completed.
      status: Set to completed.
      arrived_at: Moment the technician arrived.
      completed_date: Date of completion.
      variant_name: Call class of the visit.
      symptom: Symptom of the call.
    triggers:
      - event: service:service_charge
        when: {symptom: {not: maintenance_request}}
        map: {ticket_id: ticket_id, line_type: diagnostic_fee}
      - event: service:service_charge
        when: {variant_name: [Evening Service Call, Weekend Service Call, Overnight Emergency Service Call, Holiday Emergency Service Call]}
        map: {ticket_id: ticket_id, line_type: after_hours_premium}
      - event: service:service_charge
        when: {symptom: maintenance_request}
        map: {ticket_id: ticket_id, line_type: maintenance_tuneup, task_code: precision_tuneup}

  - type: service_close
    target: service_tickets
    mutation: {transition: {from: completed, to: closed}}
    meaning: The invoice balance reaches zero and the call is closed out.
    grain: One row per transaction.
    fields:
      ticket_id: Call closed.
      status: Set to closed.
      closed_date: Date the balance reached zero.
    triggers: []

  - type: service_cancel
    target: service_tickets
    mutation:
      transition:
        - {from: booked, to: cancelled}
        - {from: dispatched, to: cancelled}
    meaning: The call is cancelled before the work is done.
    grain: One row per transaction.
    fields:
      ticket_id: Call cancelled.
      status: Set to cancelled.
      cancelled_at: Moment of cancellation (the handling moment).
    triggers: []

  - type: service_reclass
    target: service_tickets
    mutation: update
    meaning: A booked call is moved to another call class, date or arrival window before dispatch.
    grain: One row per transaction.
    fields:
      ticket_id: Call changed.
      variant_name: New call class.
      scheduled_date: New date.
      arrival_window: New arrival window.
    triggers: []

  - type: service_charge
    target: service_lines
    meaning: A fee, task, refrigerant quantity or late charge is billed on the invoice.
    grain: One row per invoice charge line.
    distinguish_by: [line_type, task_code, line_seq]
    fields:
      ticket_id: Call billed.
      customer_id: Customer billed.
      line_seq: Position on the invoice.
      line_type: diagnostic_fee, after_hours_premium, repair_parts, repair_labor, refrigerant, maintenance_tuneup, trip_fee, late_cancellation_fee or late_payment_charge.
      task_code: Price-book task for parts, labor, refrigerant and tune-up lines; empty on fee lines.
      quantity: Pounds for refrigerant, 1 otherwise.
      amount: Amount billed under service_evt_flat_rate_pricing or service_evt_dispatch_fees.
      posted_date: Date posted.
    account: ticket_balance
    direction: in
    triggers: []

  - type: service_discount
    target: service_lines
    meaning: A member, courtesy, diagnostic, guarantee or on-time discount reduces one charge line.
    grain: One row per discount kind per charge line.
    distinguish_by: [line_type, source_line_id]
    fields:
      ticket_id: Call.
      customer_id: Customer.
      line_seq: Position on the invoice.
      line_type: member_repair_discount, discount_program, member_diagnostic_rate, member_premium_discount, diagnostic_credit, member_refrigerant_allowance, recall_no_charge or late_arrival_credit.
      quantity: Pounds for a refrigerant allowance, 0 otherwise.
      amount: Amount of the discount.
      posted_date: Date posted.
      source_line_id: The charge line discounted (for the on-time credit, the visit's diagnostic fee line).
      agreement_id: Comfort Club agreement whose benefit applies, for member discounts.
    account: ticket_balance
    direction: out
    triggers: []

  - type: service_coverage_credit
    target: service_lines
    meaning: A protection contract claim or Comfort Club covered-repair benefit pays part of one charge line.
    grain: One row per coverage source per charge line.
    distinguish_by: [line_type, source_line_id, claim_id]
    fields:
      ticket_id: Call.
      customer_id: Customer.
      line_seq: Position on the invoice.
      line_type: warranty_claim_coverage or plan_repair_coverage.
      amount: Amount covered.
      posted_date: Date posted.
      source_line_id: The charge line paid.
      claim_id: Claim paying a warranty coverage line, else empty.
      agreement_id: Agreement paying a plan coverage line, else empty.
    account: ticket_balance
    direction: out
    triggers:
      - event: plan:plan_coverage_draw
        when: {line_type: plan_repair_coverage}
        map: {ticket_id: ticket_id, customer_id: customer_id, source_line_id: source_line_id, amount: amount, agreement_id: agreement_id, entry_reason: covered_repair}

  - type: service_payment
    target: service_lines
    meaning: The customer pays toward the invoice.
    grain: One row per payment received.
    distinguish_by: [payment_reference]
    fields:
      ticket_id: Call paid.
      customer_id: Paying customer.
      line_seq: Position on the invoice.
      line_type: Always payment.
      amount: Amount paid.
      posted_date: Date posted.
      payment_method: card, ach, check or cash.
      payment_reference: Confirmation or check number.
    account: ticket_balance
    direction: out
    triggers: []

  - type: service_refund
    target: service_lines
    meaning: An overpayment or credit balance on the invoice is returned to the customer.
    grain: One row per refund, tied to the payment it returns.
    distinguish_by: [source_line_id]
    fields:
      ticket_id: Call refunded.
      customer_id: Customer.
      line_seq: Position on the invoice.
      line_type: Always refund.
      amount: Amount returned.
      posted_date: Date posted.
      source_line_id: The payment line being returned.
      payment_method: Method of the payment being returned.
      payment_reference: Refund confirmation number.
    account: ticket_balance
    direction: in
    triggers: []

measures:
  - id: service_msr_ticket_repair_subtotal
    window: One service ticket, plus any follow-up ticket on the same unit booked within the diagnostic credit window.
    measure: Sum of amount over repair_parts and repair_labor charge lines, before any discount or coverage.
  - id: service_msr_member_refrigerant_used_term
    window: The member's current Comfort Club term, from term_start through term_end inclusive.
    measure: Sum of quantity over member_refrigerant_allowance discount lines naming the agreement and posted within the term.
  - id: service_msr_unit_refrigerant_12m
    window: Rolling 12 calendar months ending on the date of handling.
    measure: Sum of quantity over refrigerant charge lines on tickets for the same equipment_id posted within the window.
  - id: service_msr_days_unpaid
    window: From the ticket's completed_date to the date of handling.
    measure: Calendar days elapsed while ticket_balance stayed above 0.00, counted from the day after completed_date.

policies:
  - id: service_agg_multi_holding
    subject: [service_book]
    rule: >-
      A customer may have any number of service calls over time and more than one open at once when they concern different
      units; there is no per-customer cap. Each call is invoiced on its own and its balance is settled on that call.
    eligibility: []
    params:
      max_per_customer: null

  - id: service_agg_one_open_call_per_unit
    subject: [service_book, service_charge]
    rule: >-
      A unit may have only one call in booked or dispatched status at a time; a new problem on a unit that already has an open
      call is added to that call rather than booked again. Two or more units at the same home looked at on the same visit share
      one call's diagnostic fee where multi_unit_single_diagnostic_fee is true: the second unit is diagnosed on the open call and
      no second diagnostic fee or premium is charged. Calls on different units booked for different days are separate visits,
      each with its own fees.
    eligibility:
      - id: one_open_call_per_unit
        applies_to: [service_book]
        kind: dedup
        condition: A unit may have only one call in booked or dispatched status at a time
        evidence_fields: [service_tickets.equipment_id, service_tickets.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.equipment_id]
          action_bindings:
            service_tickets.equipment_id: equipment_id
        dedup_contract:
          table: service_tickets
          mode: separate_record
          object_bindings: {equipment_id: equipment_id}
          duplicate_filters: {status: [booked, dispatched]}
          distinct_fields: []
    params:
      per_tier:
        Standard Service Call: {max_open: "=max_open_calls_per_unit", single_fee: "=multi_unit_single_diagnostic_fee"}
        Same-Day Priority Service Call: {max_open: "=max_open_calls_per_unit", single_fee: "=multi_unit_single_diagnostic_fee"}
        Evening Service Call: {max_open: "=max_open_calls_per_unit", single_fee: "=multi_unit_single_diagnostic_fee"}
        Weekend Service Call: {max_open: "=max_open_calls_per_unit", single_fee: "=multi_unit_single_diagnostic_fee"}
        Overnight Emergency Service Call: {max_open: "=max_open_calls_per_unit", single_fee: "=multi_unit_single_diagnostic_fee"}
        Holiday Emergency Service Call: {max_open: "=max_open_calls_per_unit", single_fee: "=multi_unit_single_diagnostic_fee"}

  - id: service_call_class_eligibility
    subject: [service_book, service_reclass, service_dispatch]
    rule: >-
      The call class is fixed by when the technician is booked to arrive, not by how urgent the caller feels it is, and each class
      runs only on its service_days and within its service_hours: a weekday
      arrival window between 08:00 and 17:00 booked by 17:00 on the prior business day is a Standard Service Call; a weekday
      daytime window on the booking day itself, booked by 12:00, is a Same-Day Priority Service Call; a weekday 17:00-22:00
      window is an Evening Service Call; a Saturday or Sunday daytime window is a Weekend Service Call; any 22:00-08:00 window is
      an Overnight Emergency Service Call; and any window on a company holiday (New Year's Day, Memorial Day, Independence Day,
      Labor Day, Thanksgiving Day, Christmas Eve and Christmas Day) is a Holiday Emergency Service Call, which overrides every
      other class. The window must be one of the class's arrival_windows_offered and the scheduled_date no later than
      max_booking_horizon_days after the booking date. Paid precision tune-ups and duct cleaning are booked only in classes where
      tuneup_bookable or duct_cleaning_bookable is true; tank water heater calls only where water_heater_service_available is
      true. Where member_queue_applies is true, Comfort Club members are offered the earliest window first according to their
      tier's scheduling_priority, and technicians of the class's technician_type are dispatched in window order toward the class's response_target_hours for
      no-heat and no-cool calls, with no-heat and
      no-cool calls ahead of other symptoms in the same window. A booked call may be moved before dispatch: a call is reclassified only while its status is
      booked, and the new class follows from the new window under the same rules; moving an after-hours or same-day call to a
      Standard Service Call is open only where reclass_to_standard_allowed is true. Each move counts against reschedules_free
      when the call keeps its class; a move made with less than free_cancellation_notice_hours of notice is handled under
      service_cancellation.
    eligibility:
      - id: reclass_before_dispatch
        applies_to: [service_reclass]
        kind: state
        condition: a call is reclassified only while its status is booked
        evidence_fields: [service_tickets.ticket_id, service_tickets.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
        state_contract:
          field: service_tickets.status
          allowed: [booked]
    params:
      holidays: [New Year's Day, Memorial Day, Independence Day, Labor Day, Thanksgiving Day, Christmas Eve, Christmas Day]
      per_tier:
        Standard Service Call: {windows: "=arrival_windows_offered", cutoff: "=booking_cutoff", horizon_days: "=max_booking_horizon_days", tuneup: "=tuneup_bookable", reclass_to_standard: "=reclass_to_standard_allowed"}
        Same-Day Priority Service Call: {windows: "=arrival_windows_offered", cutoff: "=booking_cutoff", horizon_days: "=max_booking_horizon_days", tuneup: "=tuneup_bookable", reclass_to_standard: "=reclass_to_standard_allowed"}
        Evening Service Call: {windows: "=arrival_windows_offered", cutoff: "=booking_cutoff", horizon_days: "=max_booking_horizon_days", tuneup: "=tuneup_bookable", reclass_to_standard: "=reclass_to_standard_allowed"}
        Weekend Service Call: {windows: "=arrival_windows_offered", cutoff: "=booking_cutoff", horizon_days: "=max_booking_horizon_days", tuneup: "=tuneup_bookable", reclass_to_standard: "=reclass_to_standard_allowed"}
        Overnight Emergency Service Call: {windows: "=arrival_windows_offered", cutoff: "=booking_cutoff", horizon_days: "=max_booking_horizon_days", tuneup: "=tuneup_bookable", reclass_to_standard: "=reclass_to_standard_allowed"}
        Holiday Emergency Service Call: {windows: "=arrival_windows_offered", cutoff: "=booking_cutoff", horizon_days: "=max_booking_horizon_days", tuneup: "=tuneup_bookable", reclass_to_standard: "=reclass_to_standard_allowed"}

  - id: service_safety_triage
    subject: [service_book]
    rule: >-
      A call with symptom carbon_monoxide_alarm is booked only after the caller confirms that everyone has left the home and the
      gas utility's emergency line or 911 has been called. Such a call is then booked in the earliest class whose window is
      available, never deferred to a later Standard window at the customer's request, and the technician performs the combustion
      and carbon monoxide test at no charge where co_safety_test_on_heating_calls is true. A caller who reports the smell of gas is
      told to leave the home and call the gas utility from outside, and no call is booked until the utility has made the line
      safe. A carbon monoxide alarm caused by a confirmed appliance fault is billed like any other repair.
    eligibility:
      - id: evacuated_and_utility_called
        applies_to: [service_book]
        kind: caller_fact
        condition: A call with symptom carbon_monoxide_alarm is booked only after the caller confirms that everyone has left the home and the gas utility's emergency line or 911 has been called.
        evidence_fields: [service_tickets.symptom, customers.customer_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params:
      per_tier:
        Standard Service Call: {co_test: "=co_safety_test_on_heating_calls"}
        Same-Day Priority Service Call: {co_test: "=co_safety_test_on_heating_calls"}
        Evening Service Call: {co_test: "=co_safety_test_on_heating_calls"}
        Weekend Service Call: {co_test: "=co_safety_test_on_heating_calls"}
        Overnight Emergency Service Call: {co_test: "=co_safety_test_on_heating_calls"}
        Holiday Emergency Service Call: {co_test: "=co_safety_test_on_heating_calls"}

  - id: service_evt_dispatch_fees
    subject: [service_charge, service_discount, service_complete]
    rule: >-
      When the technician completes a visit, it is charged the class's diagnostic_fee_usd and, in Evening, Weekend, Overnight
      Emergency and Holiday Emergency classes, the class's after_hours_premium_usd; a maintenance_request call is charged the
      tune-up price instead of a diagnostic fee. Charges are posted only to a call in dispatched, completed or cancelled status.
      A Comfort Club member whose agreement is active on the completion date pays the tier's diagnostic_fee_member_usd instead of
      the diagnostic fee, posted as a member_diagnostic_rate discount equal to the difference, and receives the tier's
      after_hours_premium_discount_pct off the premium of an Evening, Weekend or Overnight Emergency call, or the tier's
      holiday_premium_discount_pct off the premium of a Holiday Emergency call, posted as a member_premium_discount. The courtesy
      discount program never applies to the diagnostic fee or the premium. Each discount names the fee line it reduces and is
      rounded to the cent half up.
    eligibility:
      - id: charge_on_dispatched_call
        applies_to: [service_charge]
        kind: state
        condition: Charges are posted only to a call in dispatched, completed or cancelled status.
        evidence_fields: [service_tickets.ticket_id, service_tickets.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
        state_contract:
          field: service_tickets.status
          allowed: [dispatched, completed, cancelled]
    formula:
      member_diagnostic_rate: max(0, diagnostic_fee_usd - member_diagnostic_fee)
      member_premium_discount: round(after_hours_premium_usd * member_premium_pct / 100, 2)
      member_holiday_premium_discount: round(after_hours_premium_usd * member_holiday_premium_pct / 100, 2)
    params:
      member_diagnostic_fee: "plan:diagnostic_fee_member_usd"
      member_premium_pct: "plan:after_hours_premium_discount_pct"
      member_holiday_premium_pct: "plan:holiday_premium_discount_pct"
      per_tier:
        Standard Service Call: {diagnostic_fee: "=diagnostic_fee_usd", premium: "=after_hours_premium_usd"}
        Same-Day Priority Service Call: {diagnostic_fee: "=diagnostic_fee_usd", premium: "=after_hours_premium_usd"}
        Evening Service Call: {diagnostic_fee: "=diagnostic_fee_usd", premium: "=after_hours_premium_usd"}
        Weekend Service Call: {diagnostic_fee: "=diagnostic_fee_usd", premium: "=after_hours_premium_usd"}
        Overnight Emergency Service Call: {diagnostic_fee: "=diagnostic_fee_usd", premium: "=after_hours_premium_usd"}
        Holiday Emergency Service Call: {diagnostic_fee: "=diagnostic_fee_usd", premium: "=after_hours_premium_usd"}

  - id: service_evt_flat_rate_pricing
    subject: [service_charge]
    rule: >-
      Every repair is billed from the price book of the class's price_book_edition as two lines for its task code: a repair_parts line at the task's parts amount
      and a repair_labor line at the task's labor amount multiplied by the class's labor_multiplier, rounded to the cent half up;
      tasks with no parts amount post only the labor line. The price quoted from the book and approved by the customer before
      work begins is final where upfront_price_guarantee is true, even if the job takes longer. Refrigerant is billed per pound
      added, by refrigerant type, at refrigerant_r410a_price_per_lb_usd, refrigerant_r22_price_per_lb_usd or
      refrigerant_r454b_price_per_lb_usd, with no labor multiplier, up to refrigerant_max_lbs_per_visit pounds on one visit and
      never more than r22_max_lbs_per_visit pounds of R-22. When refrigerant added to the same unit within 12 months would exceed
      leak_search_offer_over_lbs pounds, the refrigerant_leak_search task must be offered before more is added, and a customer who
      declines it is still limited to the visit cap. Major repairs (compressor, evaporator coil, condenser coil, reversing valve
      and TXV replacement) are performed only in classes whose major_repair_allowed is true; in other classes the technician
      restores operation where possible and the major repair is booked as a follow-up Standard Service Call priced at the
      Standard multiplier. Where truck_stock_only is true, a part not carried on the truck is installed on a return visit that
      carries parts_return_visit_fee_usd and no new diagnostic fee. Special-order parts require a deposit of
      special_order_parts_deposit_pct of the parts amount before they are ordered. A written estimate stays valid at the quoted
      price for estimate_validity_days.
    eligibility: []
    formula:
      repair_labor_amount: round(price_book_labor[task_code] * labor_multiplier, 2)
      repair_parts_amount: price_book_parts[task_code]
    measures: [service_msr_unit_refrigerant_12m]
    params:
      price_book_parts:
        capacitor_replace: 96.00
        contactor_replace: 84.00
        condenser_fan_motor_replace: 289.00
        blower_motor_replace: 342.00
        ecm_blower_motor_replace: 868.00
        inducer_motor_replace: 412.00
        igniter_replace: 74.00
        flame_sensor_service: 18.00
        pressure_switch_replace: 89.00
        control_board_replace: 386.00
        gas_valve_replace: 312.00
        txv_replace: 196.00
        evaporator_coil_replace: 1180.00
        condenser_coil_replace: 1340.00
        compressor_replace: 1640.00
        reversing_valve_replace: 287.00
        defrost_board_replace: 268.00
        refrigerant_leak_search: 0.00
        condensate_drain_clear: 0.00
        condensate_pump_replace: 126.00
        thermostat_replace: 189.00
        duct_cleaning_whole_home: 0.00
      price_book_labor:
        capacitor_replace: 153.00
        contactor_replace: 165.00
        condenser_fan_motor_replace: 346.00
        blower_motor_replace: 387.00
        ecm_blower_motor_replace: 461.00
        inducer_motor_replace: 377.00
        igniter_replace: 165.00
        flame_sensor_service: 121.00
        pressure_switch_replace: 176.00
        control_board_replace: 289.00
        gas_valve_replace: 341.00
        txv_replace: 689.00
        evaporator_coil_replace: 1145.00
        condenser_coil_replace: 1260.00
        compressor_replace: 1585.00
        reversing_valve_replace: 1093.00
        defrost_board_replace: 247.00
        refrigerant_leak_search: 349.00
        condensate_drain_clear: 159.00
        condensate_pump_replace: 163.00
        thermostat_replace: 140.00
        duct_cleaning_whole_home: 589.00
      major_repair_tasks: [compressor_replace, evaporator_coil_replace, condenser_coil_replace, reversing_valve_replace, txv_replace]
      per_tier:
        Standard Service Call: {labor_multiplier: "=labor_multiplier", refrigerant_cap_lbs: "=refrigerant_max_lbs_per_visit", major_repairs: "=major_repair_allowed", truck_stock_only: "=truck_stock_only"}
        Same-Day Priority Service Call: {labor_multiplier: "=labor_multiplier", refrigerant_cap_lbs: "=refrigerant_max_lbs_per_visit", major_repairs: "=major_repair_allowed", truck_stock_only: "=truck_stock_only"}
        Evening Service Call: {labor_multiplier: "=labor_multiplier", refrigerant_cap_lbs: "=refrigerant_max_lbs_per_visit", major_repairs: "=major_repair_allowed", truck_stock_only: "=truck_stock_only"}
        Weekend Service Call: {labor_multiplier: "=labor_multiplier", refrigerant_cap_lbs: "=refrigerant_max_lbs_per_visit", major_repairs: "=major_repair_allowed", truck_stock_only: "=truck_stock_only"}
        Overnight Emergency Service Call: {labor_multiplier: "=labor_multiplier", refrigerant_cap_lbs: "=refrigerant_max_lbs_per_visit", major_repairs: "=major_repair_allowed", truck_stock_only: "=truck_stock_only"}
        Holiday Emergency Service Call: {labor_multiplier: "=labor_multiplier", refrigerant_cap_lbs: "=refrigerant_max_lbs_per_visit", major_repairs: "=major_repair_allowed", truck_stock_only: "=truck_stock_only"}

  - id: service_maintenance_tuneup
    subject: [service_charge, service_book]
    rule: >-
      A customer without an active Comfort Club agreement, or a member who has no visit left for that system and season, may book
      a paid precision tune-up as a maintenance_request call in a class where tuneup_bookable is true; it is billed as one
      maintenance_tuneup line at the class's tuneup_price_usd per system with task_code precision_tuneup, and no diagnostic fee is
      charged. A member with a visit available books the tune-up against the agreement instead and is not billed here. Repairs
      found during a paid tune-up are quoted and billed as repair tasks on the same call, with no diagnostic fee added. A paid
      tune-up on a unit counts as documented maintenance for protection contract claims once the call's balance is paid.
    eligibility:
      - id: tuneup_class
        applies_to: [service_book, service_charge]
        kind: authorization
        condition: may book a paid precision tune-up as a maintenance_request call in a class where tuneup_bookable is true
        evidence_fields: [service_tickets.ticket_id, service_tickets.variant_name, service_tickets.symptom]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
    params:
      per_tier:
        Standard Service Call: {bookable: "=tuneup_bookable", price: "=tuneup_price_usd"}
        Same-Day Priority Service Call: {bookable: "=tuneup_bookable", price: "=tuneup_price_usd"}
        Evening Service Call: {bookable: "=tuneup_bookable", price: "=tuneup_price_usd"}
        Weekend Service Call: {bookable: "=tuneup_bookable", price: "=tuneup_price_usd"}
        Overnight Emergency Service Call: {bookable: "=tuneup_bookable", price: "=tuneup_price_usd"}
        Holiday Emergency Service Call: {bookable: "=tuneup_bookable", price: "=tuneup_price_usd"}

  - id: service_evt_member_benefits
    subject: [service_discount]
    rule: >-
      Member benefits apply only when the customer's Comfort Club agreement is in active status on the date the charge line
      posts; a pending, past_due, lapsed or cancelled agreement earns none, and benefits are never applied retroactively to
      lines posted before the agreement became active. Each repair_parts and repair_labor line receives the tier's
      repair_discount_pct as a member_repair_discount, except the duct cleaning task, which receives the tier's
      duct_cleaning_discount_pct instead. Refrigerant added on an enrolled system is free up to the tier's
      refrigerant_allowance_lbs_per_term, counted across all of the member's calls in the current term, and posted as a
      member_refrigerant_allowance discount for the pounds covered at the billed price per pound. Member diagnostic rates and
      premium discounts follow service_evt_dispatch_fees. A repair done while the agreement is active carries a repair guarantee
      extended by the tier's repair_guarantee_extension_months under service_evt_repair_guarantee. Each member discount names
      the agreement and the line it reduces, and is rounded to the cent half up.
    eligibility:
      - id: member_active_on_posting
        applies_to: [service_discount]
        kind: state
        condition: Member benefits apply only when the customer's Comfort Club agreement is in active status on the date the charge line posts
        evidence_fields: [plan_agreements.customer_id, plan_agreements.status, plan_agreements.agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
        state_contract:
          field: plan_agreements.status
          allowed: [active]
    formula:
      member_repair_discount: round(amount * member_repair_pct / 100, 2)
      member_refrigerant_lbs: min(quantity, member_refrigerant_lbs_per_term - service_msr_member_refrigerant_used_term)
    measures: [service_msr_member_refrigerant_used_term]
    params:
      member_repair_pct: "plan:repair_discount_pct"
      member_duct_cleaning_pct: "plan:duct_cleaning_discount_pct"
      member_refrigerant_lbs_per_term: "plan:refrigerant_allowance_lbs_per_term"
      member_guarantee_extension_months: "plan:repair_guarantee_extension_months"

  - id: service_evt_discount_stacking
    subject: [service_discount]
    rule: >-
      The courtesy discount program and the member repair discount never stack on the same line: a customer enrolled in a
      courtesy program (senior_65_plus, military_veteran or first_responder on the profile) receives discount_program_pct as a
      discount_program line only on a repair_parts, repair_labor or maintenance_tuneup line that receives no member repair
      discount, or, when the courtesy percentage is higher than the member percentage, in place of the member discount on that
      line. The courtesy discount applies only in classes where discount_program_applies is true, and never to diagnostic fees,
      premiums, refrigerant, trip fees, cancellation fees or late-payment charges. Discounts are taken on the line's charged
      amount and rounded per line to the cent half up; coverage credits are applied only after every discount on that line, and
      a line's discounts and coverage together never exceed its charged amount.
    eligibility:
      - id: courtesy_program_on_file
        applies_to: [service_discount]
        kind: authorization
        condition: a customer enrolled in a courtesy program (senior_65_plus, military_veteran or first_responder on the profile) receives discount_program_pct as a discount_program line
        evidence_fields: [customers.customer_id, customers.discount_program]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params:
      per_tier:
        Standard Service Call: {courtesy_pct: "=discount_program_pct", courtesy_applies: "=discount_program_applies"}
        Same-Day Priority Service Call: {courtesy_pct: "=discount_program_pct", courtesy_applies: "=discount_program_applies"}
        Evening Service Call: {courtesy_pct: "=discount_program_pct", courtesy_applies: "=discount_program_applies"}
        Weekend Service Call: {courtesy_pct: "=discount_program_pct", courtesy_applies: "=discount_program_applies"}
        Overnight Emergency Service Call: {courtesy_pct: "=discount_program_pct", courtesy_applies: "=discount_program_applies"}
        Holiday Emergency Service Call: {courtesy_pct: "=discount_program_pct", courtesy_applies: "=discount_program_applies"}

  - id: service_evt_diagnostic_credit
    subject: [service_discount]
    rule: >-
      In classes whose diagnostic_credit_on_repair is true, the diagnostic fee the customer actually owes after any member rate is
      credited back as a diagnostic_credit naming the diagnostic fee line when the customer approves a repair whose repair_parts
      and repair_labor subtotal, before discounts, is at least diagnostic_credit_min_repair_usd. The repair may be done on the
      diagnosing visit or on a follow-up call on the same unit. A follow-up repair earns the credit only when it is booked no later
      than diagnostic_credit_window_days calendar days after the diagnosing visit was completed. Credit-window days are counted as
      calendar days with the diagnosing visit's completed_date as day 0, and a follow-up booked on the last day qualifies. The
      credit is given once per diagnostic fee, never on after-hours classes, and never when the diagnostic fee was already reduced
      to zero by a member rate or a recall.
    eligibility:
      - id: follow_up_within_window
        applies_to: [service_discount]
        kind: time
        condition: A follow-up repair earns the credit only when it is booked no later than diagnostic_credit_window_days calendar days after the diagnosing visit was completed.
        evidence_fields: [service_tickets.ticket_id, service_tickets.completed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the diagnosing visit was completed
          anchor_source: service_tickets.completed_date
          relation: not_after
          duration_source: variants.diagnostic_credit_window_days
          unit: calendar_days
          counting_rule: Credit-window days are counted as calendar days with the diagnosing visit's completed_date as day 0, and a follow-up booked on the last day qualifies.
          boundary: inclusive
    formula:
      when: service_msr_ticket_repair_subtotal >= diagnostic_credit_min_repair_usd
    measures: [service_msr_ticket_repair_subtotal]
    params:
      per_tier:
        Standard Service Call: {credit_on_repair: "=diagnostic_credit_on_repair", min_repair: "=diagnostic_credit_min_repair_usd", window_days: "=diagnostic_credit_window_days"}
        Same-Day Priority Service Call: {credit_on_repair: "=diagnostic_credit_on_repair", min_repair: "=diagnostic_credit_min_repair_usd", window_days: "=diagnostic_credit_window_days"}
        Evening Service Call: {credit_on_repair: "=diagnostic_credit_on_repair", min_repair: "=diagnostic_credit_min_repair_usd", window_days: "=diagnostic_credit_window_days"}
        Weekend Service Call: {credit_on_repair: "=diagnostic_credit_on_repair", min_repair: "=diagnostic_credit_min_repair_usd", window_days: "=diagnostic_credit_window_days"}
        Overnight Emergency Service Call: {credit_on_repair: "=diagnostic_credit_on_repair", min_repair: "=diagnostic_credit_min_repair_usd", window_days: "=diagnostic_credit_window_days"}
        Holiday Emergency Service Call: {credit_on_repair: "=diagnostic_credit_on_repair", min_repair: "=diagnostic_credit_min_repair_usd", window_days: "=diagnostic_credit_window_days"}

  - id: service_evt_coverage_credit
    subject: [service_coverage_credit]
    rule: >-
      Coverage credits are posted against a specific charge line already on the invoice and never against the invoice as a
      whole. A warranty_claim_coverage line is posted for each payout of an approved protection contract claim, naming the claim
      and the line it pays: labor payouts go to the failed task's repair_labor line, parts payouts to its repair_parts line,
      refrigerant payouts to the refrigerant line, and diagnostic and premium payouts to those fee lines. A plan_repair_coverage
      line is posted for each Comfort Club covered-repair draw, naming the agreement and the line it pays. The order on each line
      is fixed: discounts first, protection contract coverage next, Comfort Club covered repairs last, and the sum of discounts and
      coverage on a line never exceeds the line's amount. A coverage credit is posted only to a call in completed or closed
      status. Whatever remains after coverage is owed by the customer.
    eligibility:
      - id: coverage_on_completed_call
        applies_to: [service_coverage_credit]
        kind: state
        condition: A coverage credit is posted only to a call in completed or closed status.
        evidence_fields: [service_tickets.ticket_id, service_tickets.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
        state_contract:
          field: service_tickets.status
          allowed: [completed, closed]

  - id: service_evt_repair_guarantee
    subject: [service_book, service_discount, service_charge]
    rule: >-
      Labor on every completed repair is guaranteed for repair_guarantee_days, and a Harbison-supplied part for
      parts_guarantee_days, counted from the completed_date of the call that performed it. A return visit is free under the
      repair guarantee only when it is booked no later than repair_guarantee_days calendar days after the original repair was
      completed. Guarantee days are counted as calendar days with the original completed_date as day 0, and a return visit booked
      on the last day qualifies; for a repair completed while the customer's Comfort Club agreement was active, the guarantee is
      extended by the tier's repair_guarantee_extension_months, added as calendar months to the end of the guarantee. The return
      visit is booked with recall_of_ticket_id naming the original call, and only when the technician finds the same task's part
      or workmanship has failed on the same unit: its diagnostic fee, any premium and the repeated task's parts and labor are
      each offset by a recall_no_charge discount naming the line. A different failure found on the return visit is billed
      normally, and when the guaranteed repair has not failed, the diagnostic fee of the return visit stands.
    eligibility:
      - id: within_guarantee
        applies_to: [service_discount]
        kind: time
        condition: A return visit is free under the repair guarantee only when it is booked no later than repair_guarantee_days calendar days after the original repair was completed.
        evidence_fields: [service_tickets.ticket_id, service_tickets.completed_date, service_tickets.recall_of_ticket_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.recall_of_ticket_id]
          action_bindings:
            service_tickets.recall_of_ticket_id: recall_of_ticket_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the original repair was completed
          anchor_source: service_tickets.completed_date
          relation: not_after
          duration_source: variants.repair_guarantee_days
          unit: calendar_days
          counting_rule: Guarantee days are counted as calendar days with the original completed_date as day 0, and a return visit booked on the last day qualifies
          boundary: inclusive
    params:
      member_guarantee_extension_months: "plan:repair_guarantee_extension_months"
      per_tier:
        Standard Service Call: {labor_days: "=repair_guarantee_days", parts_days: "=parts_guarantee_days"}
        Same-Day Priority Service Call: {labor_days: "=repair_guarantee_days", parts_days: "=parts_guarantee_days"}
        Evening Service Call: {labor_days: "=repair_guarantee_days", parts_days: "=parts_guarantee_days"}
        Weekend Service Call: {labor_days: "=repair_guarantee_days", parts_days: "=parts_guarantee_days"}
        Overnight Emergency Service Call: {labor_days: "=repair_guarantee_days", parts_days: "=parts_guarantee_days"}
        Holiday Emergency Service Call: {labor_days: "=repair_guarantee_days", parts_days: "=parts_guarantee_days"}

  - id: service_evt_late_arrival_credit
    subject: [service_discount]
    rule: >-
      In classes whose late_arrival_credit_usd is above 0.00, Harbison guarantees arrival within the booked window: the on-time
      credit is earned only when the technician arrived more than late_arrival_grace_minutes minutes after the end of the booked
      arrival window. The credit is late_arrival_credit_usd, posted as a late_arrival_credit naming the visit's diagnostic fee line,
      and it may reduce the invoice below the diagnostic fee but never below zero. Only one on-time credit is posted per call. A
      call the customer rescheduled after dispatch, or one delayed because the customer asked the technician to come later, earns
      no credit. This credit is separate from, and may be earned together with, a Comfort Club response-guarantee credit.
    eligibility:
      - id: arrived_late
        applies_to: [service_discount]
        kind: authorization
        condition: the on-time credit is earned only when the technician arrived more than late_arrival_grace_minutes minutes after the end of the booked arrival window
        evidence_fields: [service_tickets.ticket_id, service_tickets.arrived_at, service_tickets.scheduled_date, service_tickets.arrival_window]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
      - id: one_on_time_credit
        applies_to: [service_discount]
        kind: dedup
        condition: Only one on-time credit is posted per call.
        evidence_fields: [service_lines.ticket_id, service_lines.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_lines.ticket_id]
          action_bindings:
            service_lines.ticket_id: ticket_id
        dedup_contract:
          table: service_lines
          mode: separate_record
          object_bindings: {ticket_id: ticket_id}
          duplicate_filters: {line_type: [late_arrival_credit]}
          distinct_fields: []
    params:
      per_tier:
        Standard Service Call: {credit: "=late_arrival_credit_usd", grace_minutes: "=late_arrival_grace_minutes"}
        Same-Day Priority Service Call: {credit: "=late_arrival_credit_usd", grace_minutes: "=late_arrival_grace_minutes"}
        Evening Service Call: {credit: "=late_arrival_credit_usd", grace_minutes: "=late_arrival_grace_minutes"}
        Weekend Service Call: {credit: "=late_arrival_credit_usd", grace_minutes: "=late_arrival_grace_minutes"}
        Overnight Emergency Service Call: {credit: "=late_arrival_credit_usd", grace_minutes: "=late_arrival_grace_minutes"}
        Holiday Emergency Service Call: {credit: "=late_arrival_credit_usd", grace_minutes: "=late_arrival_grace_minutes"}

  - id: service_cancellation
    subject: [service_cancel, service_charge]
    rule: >-
      A booked call cancelled at the customer's request at least free_cancellation_notice_hours elapsed hours before the start of
      its arrival window is cancelled without charge. A booked call cancelled with less notice but before dispatch is charged a
      late_cancellation_fee of late_cancellation_fee_usd where it is above 0.00. A call cancelled after dispatch, or one where the
      technician waits no_access_wait_minutes on site without getting access, is cancelled with a trip_fee of trip_fee_usd; a
      call that never reaches completion carries no diagnostic fee, premium or tune-up charge. A call cancelled by Harbison, or because a declared weather emergency closed the roads, carries no fee. Only
      one cancellation fee, late or trip, is charged per call.
    eligibility:
      - id: one_cancellation_fee
        applies_to: [service_charge]
        kind: dedup
        condition: Only one cancellation fee, late or trip, is charged per call.
        evidence_fields: [service_lines.ticket_id, service_lines.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_lines.ticket_id]
          action_bindings:
            service_lines.ticket_id: ticket_id
        dedup_contract:
          table: service_lines
          mode: separate_record
          object_bindings: {ticket_id: ticket_id}
          duplicate_filters: {line_type: [trip_fee, late_cancellation_fee]}
          distinct_fields: []
    params:
      per_tier:
        Standard Service Call: {notice_hours: "=free_cancellation_notice_hours", late_fee: "=late_cancellation_fee_usd", trip_fee: "=trip_fee_usd", wait_minutes: "=no_access_wait_minutes"}
        Same-Day Priority Service Call: {notice_hours: "=free_cancellation_notice_hours", late_fee: "=late_cancellation_fee_usd", trip_fee: "=trip_fee_usd", wait_minutes: "=no_access_wait_minutes"}
        Evening Service Call: {notice_hours: "=free_cancellation_notice_hours", late_fee: "=late_cancellation_fee_usd", trip_fee: "=trip_fee_usd", wait_minutes: "=no_access_wait_minutes"}
        Weekend Service Call: {notice_hours: "=free_cancellation_notice_hours", late_fee: "=late_cancellation_fee_usd", trip_fee: "=trip_fee_usd", wait_minutes: "=no_access_wait_minutes"}
        Overnight Emergency Service Call: {notice_hours: "=free_cancellation_notice_hours", late_fee: "=late_cancellation_fee_usd", trip_fee: "=trip_fee_usd", wait_minutes: "=no_access_wait_minutes"}
        Holiday Emergency Service Call: {notice_hours: "=free_cancellation_notice_hours", late_fee: "=late_cancellation_fee_usd", trip_fee: "=trip_fee_usd", wait_minutes: "=no_access_wait_minutes"}

  - id: service_payment_and_collections
    subject: [service_payment, service_refund, service_close, service_charge]
    rule: >-
      The invoice is due payment_due_days after completion, and 0 means it is due on completion. Payments are applied to the
      invoice as a whole and a call closes on the day its ticket_balance reaches 0.00, once every discount and coverage credit the
      customer is entitled to has been posted. A late_payment_charge is posted only once more than late_payment_after_days calendar
      days have passed since the call was completed with a balance still owing. Late-payment days are counted as calendar days with
      the completed_date as day 0. Each charge is late_payment_charge_pct_monthly percent of the balance owing on the day it posts,
      rounded to the cent half up and never less than late_payment_charge_min_usd, and one further charge may post for each
      additional full 30 days the balance stays unpaid. A balance that is owing only because a protection contract claim or a
      Comfort Club covered repair is still being decided accrues no late-payment charge until the decision is posted. When
      payments exceed what is owed, so the balance is negative, the excess is refunded to the method of the payment that created
      it, naming that payment line; cash overpayments are refunded by check. A refund never exceeds the payment it returns.
    eligibility:
      - id: late_charge_after_grace
        applies_to: [service_charge]
        kind: time
        condition: A late_payment_charge is posted only once more than late_payment_after_days calendar days have passed since the call was completed with a balance still owing.
        evidence_fields: [service_tickets.ticket_id, service_tickets.completed_date, service_tickets.ticket_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_tickets.ticket_id]
          action_bindings:
            service_tickets.ticket_id: ticket_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the call was completed
          anchor_source: service_tickets.completed_date
          relation: not_before
          duration_source: variants.late_payment_after_days
          unit: calendar_days
          counting_rule: Late-payment days are counted as calendar days with the completed_date as day 0.
          boundary: exclusive
    formula:
      late_payment_charge: max(late_payment_charge_min_usd, round(ticket_balance * late_payment_charge_pct_monthly / 100, 2))
    measures: [service_msr_days_unpaid]
    params:
      per_tier:
        Standard Service Call: {due_days: "=payment_due_days", late_after_days: "=late_payment_after_days", late_pct: "=late_payment_charge_pct_monthly", late_min: "=late_payment_charge_min_usd"}
        Same-Day Priority Service Call: {due_days: "=payment_due_days", late_after_days: "=late_payment_after_days", late_pct: "=late_payment_charge_pct_monthly", late_min: "=late_payment_charge_min_usd"}
        Evening Service Call: {due_days: "=payment_due_days", late_after_days: "=late_payment_after_days", late_pct: "=late_payment_charge_pct_monthly", late_min: "=late_payment_charge_min_usd"}
        Weekend Service Call: {due_days: "=payment_due_days", late_after_days: "=late_payment_after_days", late_pct: "=late_payment_charge_pct_monthly", late_min: "=late_payment_charge_min_usd"}
        Overnight Emergency Service Call: {due_days: "=payment_due_days", late_after_days: "=late_payment_after_days", late_pct: "=late_payment_charge_pct_monthly", late_min: "=late_payment_charge_min_usd"}
        Holiday Emergency Service Call: {due_days: "=payment_due_days", late_after_days: "=late_payment_after_days", late_pct: "=late_payment_charge_pct_monthly", late_min: "=late_payment_charge_min_usd"}

extended_policies:
  - id: service_ext_refrigerant_allowance
    base_policy_refs: [service_evt_dispatch_fees, service_evt_member_benefits, service_evt_discount_stacking, service_evt_diagnostic_credit, service_evt_repair_guarantee, service_evt_late_arrival_credit]
    overwrite:
      - base_policy: service_evt_member_benefits
        superseded_clause: >-
          Refrigerant added on an enrolled system is free up to the tier's refrigerant_allowance_lbs_per_term, counted across all of the member's calls in the current term, and posted as a member_refrigerant_allowance discount for the pounds covered at the billed price per pound.
        replaced_by: >-
          The refrigerant allowance is settled call by call: on each completed call for a Comfort Club member whose agreement is active, the refrigerant allowance pounds are the pounds of refrigerant allowance the member's tier lists, and no pounds are carried between calls.
    trigger: state_due
    subject: [service_discount]
    computes: amount
    target_tool: post_refrigerant_allowance_39aa6c52
    params:
      loyalty_terms_long: 6
      loyalty_terms_mid: 3
      loyalty_lbs_long: 0.5
      loyalty_lbs_mid: 0.3
      upkeep_window_long: 24
      upkeep_window_short: 12
      upkeep_high_count: 3
      upkeep_lbs_high: 0.5
      upkeep_lbs_low: 0.3
      install_recent_months: 120
      install_lbs_recent: 0.4
      install_lbs_older: 0.2
      contract_lbs_unit: 0.3
      contract_lbs_home: 0.1
      filter_high_merv: 13
      filter_lbs_high: 0.4
      filter_lbs_std: 0.2
      half_up_nudge: 0.000000001
    rule: >-
      The refrigerant allowance is settled call by call: on each completed call for a Comfort Club member whose agreement is active, the refrigerant allowance pounds are the pounds of refrigerant allowance the member's tier lists, and no pounds are carried between calls.
      The pounds covered are the smaller of the pounds billed on the call's refrigerant lines and the refrigerant allowance pounds, rounded to one decimal place.
      The allowance is worth the pounds covered multiplied by the billed price per pound, which is the amount of the call's refrigerant lines divided by their pounds, rounded once at the end to the cent half up, and it is posted as one member refrigerant allowance line naming the refrigerant line and the agreement.
      A member who has held the agreement for six or more consecutive terms adds 0.5 pound to the refrigerant allowance pounds, a member holding it for three to five consecutive terms adds 0.3 pound, and a member holding it for fewer terms adds nothing.
      The maintenance count for the refrigerant allowance looks back as far as the membership reaches: for a member first enrolled 24 or more whole calendar months before the date of handling, the completed tune-up visits posted to the agreement in the last 24 months; for a member first enrolled 12 to 23 months before, the completed tune-up visits in the last 12 months; otherwise, the completed tune-up visits of the agreement's current term only.
      A visit is within the last 24 or 12 months while fewer than that many whole calendar months have passed from its visit date to the date of handling.
      A maintenance count of three or more completed tune-up visits adds 0.5 pound to the refrigerant allowance pounds, a count of one or two adds 0.3 pound, and a count of none adds nothing.
      A customer whose Harbison installation project was closed less than 120 whole months before the date of handling adds 0.4 pound to the refrigerant allowance pounds, one whose Harbison installation project was closed 120 or more months before adds 0.2 pound, and a customer with no closed Harbison installation adds nothing.
      A call on a unit covered by an active Harbison protection contract adds 0.3 pound to the refrigerant allowance pounds, a call on a unit without one at a home where another unit carries an active protection contract adds 0.1 pound, and any other call adds nothing.
      A customer with an active FilterDirect subscription of MERV 13 or higher adds 0.4 pound to the refrigerant allowance pounds, one with an active FilterDirect subscription below MERV 13 adds 0.2 pound, and a customer without an active subscription adds nothing.
      These additions are summed with the tier's pounds before the pounds covered are taken; a customer without an active agreement has no refrigerant allowance.
      An amount that falls exactly halfway between two cents is rounded up to the higher cent.
    prerequisite: []
    cross_category:
      - category: plan
        as: history
        reads: [status, consecutive_terms, enrolled_date, term_start, refrigerant_allowance_lbs_per_term, plan_service_entries.event_type]
        note: The loyalty addition reads consecutive terms, the maintenance count reads the completed tune-up visits of the agreement over the window its enrollment length selects, and the tier pounds read the tier parameter.
      - category: install
        as: branch
        reads: [status, closed_date]
        note: The installation addition is decided from the customer's closed Harbison installation project and how long ago it closed.
      - category: warranty
        as: existence
        reads: [status, equipment_id]
        note: The protection-contract addition is decided from an active contract on the call's unit or elsewhere at the home.
      - category: filter
        as: branch
        reads: [status, merv_rating]
        note: The filter addition is decided from the customer's active FilterDirect subscription and its MERV rating.
    compute:
      - plan_active: "CFIELD('plan','status') == 'active'"
      - r_qty: "SUM('service_lines','quantity', line_type='refrigerant')"
      - r_billed: "SUM('service_lines','amount', line_type='refrigerant')"
      - r_price: "(r_billed / r_qty) if r_qty > 0 else 0"
      - r_tier_lbs: "(CPARAM('plan','refrigerant_allowance_lbs_per_term') or 0) if plan_active else 0"
      - r_terms: "(CFIELD('plan','consecutive_terms') or 0) if plan_active else 0"
      - r_loyalty_lbs: "K('loyalty_lbs_long') if r_terms >= K('loyalty_terms_long') else (K('loyalty_lbs_mid') if r_terms >= K('loyalty_terms_mid') else 0)"
      - r_tenure: "MONTHS(CFIELD('plan','enrolled_date'), NOW) if plan_active else 0"
      - r_visits_24: "XCOUNT('plan','plan_service_entries', within_months=K('upkeep_window_long'), date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit')"
      - r_visits_12: "XCOUNT('plan','plan_service_entries', within_months=K('upkeep_window_short'), date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit')"
      - r_visits_term: "XCOUNT('plan','plan_service_entries', event_type='plan_tuneup_visit', entry_reason='completed_visit', term_start=CFIELD('plan','term_start'))"
      - r_upkeep_count: "r_visits_24 if r_tenure >= K('upkeep_window_long') else (r_visits_12 if r_tenure >= K('upkeep_window_short') else r_visits_term)"
      - r_upkeep_lbs: "K('upkeep_lbs_high') if r_upkeep_count >= K('upkeep_high_count') else (K('upkeep_lbs_low') if r_upkeep_count >= 1 else 0)"
      - r_install_status: "CFIELD('install','status')"
      - r_install_months: "MONTHS(CFIELD('install','closed_date'), NOW) if r_install_status == 'closed' else 0"
      - r_install_lbs: "K('install_lbs_recent') if (r_install_status == 'closed' and r_install_months < K('install_recent_months')) else (K('install_lbs_older') if r_install_status == 'closed' else 0)"
      - r_unit_contract: "CFIELD('warranty','status', equipment_id=F('equipment_id'))"
      - r_contract_lbs: "K('contract_lbs_unit') if r_unit_contract == 'active' else (K('contract_lbs_home') if EXISTS('warranty', status='active') else 0)"
      - r_filter_status: "CFIELD('filter','status')"
      - r_filter_merv: "CPARAM('filter','merv_rating', status='active')"
      - r_filter_lbs: "K('filter_lbs_high') if (r_filter_status == 'active' and r_filter_merv >= K('filter_high_merv')) else (K('filter_lbs_std') if r_filter_status == 'active' else 0)"
      - r_allowance: "(r_tier_lbs + r_loyalty_lbs + r_upkeep_lbs + r_install_lbs + r_contract_lbs + r_filter_lbs) if plan_active else 0"
      - r_covered: "RND(MN(r_qty, r_allowance), 1)"
