      r_qty: "The pounds covered are the smaller of the pounds billed on the call's refrigerant lines and the refrigerant allowance pounds, rounded to one decimal place."
      r_billed: "the billed price per pound, which is the amount of the call's refrigerant lines divided by their pounds"
      r_price: "the billed price per pound, which is the amount of the call's refrigerant lines divided by their pounds"
      r_tier_lbs: "the refrigerant allowance pounds are the pounds of refrigerant allowance the member's tier lists, and no pounds are carried between calls"
      r_terms: "A member who has held the agreement for six or more consecutive terms adds 0.5 pound to the refrigerant allowance pounds, a member holding it for three to five consecutive terms adds 0.3 pound, and a member holding it for fewer terms adds nothing."
      r_loyalty_lbs: "A member who has held the agreement for six or more consecutive terms adds 0.5 pound to the refrigerant allowance pounds, a member holding it for three to five consecutive terms adds 0.3 pound, and a member holding it for fewer terms adds nothing."
      r_tenure: "for a member first enrolled 24 or more whole calendar months before the date of handling"
      r_visits_24: "A visit is within the last 24 or 12 months while fewer than that many whole calendar months have passed from its visit date to the date of handling."
      r_visits_12: "A visit is within the last 24 or 12 months while fewer than that many whole calendar months have passed from its visit date to the date of handling."
      r_visits_term: "otherwise, the completed tune-up visits of the agreement's current term only."
      r_upkeep_count: "The maintenance count for the refrigerant allowance looks back as far as the membership reaches: for a member first enrolled 24 or more whole calendar months before the date of handling, the completed tune-up visits posted to the agreement in the last 24 months; for a member first enrolled 12 to 23 months before, the completed tune-up visits in the last 12 months; otherwise, the completed tune-up visits of the agreement's current term only."
      r_upkeep_lbs: "A maintenance count of three or more completed tune-up visits adds 0.5 pound to the refrigerant allowance pounds, a count of one or two adds 0.3 pound, and a count of none adds nothing."
      r_install_status: "and a customer with no closed Harbison installation adds nothing."
      r_install_months: "A customer whose Harbison installation project was closed less than 120 whole months before the date of handling adds 0.4 pound to the refrigerant allowance pounds"
      r_install_lbs: "A customer whose Harbison installation project was closed less than 120 whole months before the date of handling adds 0.4 pound to the refrigerant allowance pounds, one whose Harbison installation project was closed 120 or more months before adds 0.2 pound, and a customer with no closed Harbison installation adds nothing."
      r_unit_contract: "A call on a unit covered by an active Harbison protection contract adds 0.3 pound to the refrigerant allowance pounds"
      r_contract_lbs: "A call on a unit covered by an active Harbison protection contract adds 0.3 pound to the refrigerant allowance pounds, a call on a unit without one at a home where another unit carries an active protection contract adds 0.1 pound, and any other call adds nothing."
      r_filter_status: "a customer without an active subscription adds nothing."
      r_filter_merv: "A customer with an active FilterDirect subscription of MERV 13 or higher adds 0.4 pound to the refrigerant allowance pounds"
      r_filter_lbs: "A customer with an active FilterDirect subscription of MERV 13 or higher adds 0.4 pound to the refrigerant allowance pounds, one with an active FilterDirect subscription below MERV 13 adds 0.2 pound, and a customer without an active subscription adds nothing."
      r_allowance: "These additions are summed with the tier's pounds before the pounds covered are taken; a customer without an active agreement has no refrigerant allowance."
      r_covered: "The pounds covered are the smaller of the pounds billed on the call's refrigerant lines and the refrigerant allowance pounds, rounded to one decimal place."
      result: "The allowance is worth the pounds covered multiplied by the billed price per pound, which is the amount of the call's refrigerant lines divided by their pounds, rounded once at the end to the cent half up"
    factors:
