  - id: service_ext_past_due_installment
    base_policy_refs: [service_payment_and_collections]
    overwrite:
      - base_policy: service_payment_and_collections
        superseded_clause: >-
          The invoice is due payment_due_days after completion, and 0 means it is due on completion.
        replaced_by: >-
          Under a payment arrangement only the first installment is due when the arrangement is made; each later installment falls due 30 days after the one before it, and the balance stays on the call until they are paid.
    trigger: on_request
    subject: [service_payment]
    computes: amount
    target_tool: pay_past_due_installment_4c600ae8
    params:
      past_due_days: 30
      terms_long: 6
      installments_long: 3
      installments_member: 2
      large_balance: 1000
      mid_balance: 500
      extra_large: 2
      extra_mid: 1
      half_up_nudge: 0.000000001
      min_protected: 300
      min_member: 500
      min_standard: 750
      front_window_months: 12
    rule: >-
      A customer whose completed call still carries a balance more than 30 days after its completion date may ask to settle that past-due balance under a payment arrangement, and pays the first installment in person at once.
      Under the standard terms a past-due balance is paid in a single payment of the whole balance owing on the call when it is paid.
      Under a payment arrangement only the first installment is due when the arrangement is made; each later installment falls due 30 days after the one before it, and the balance stays on the call until they are paid.
      The first installment of a payment arrangement is not taken until the invoice carries a late-payment charge for every charging period that has run past the customer's late-payment grace.
      The arrangement is figured on the balance owing on the call when the first installment is paid: the amount paid up front is set aside from that balance, the rest is divided by the number of installments, and the first installment is the amount paid up front plus one such share rounded to the cent half up.
      The number of installments is 3 for a customer whose active Comfort Club agreement has run six or more consecutive terms, 2 for any other customer with an active agreement, and 1 for every other customer.
      The balance owing for this purpose is worked out from the invoice lines: the call's charge lines, less its discount, coverage-credit and payment lines, plus its refund lines; a balance owing of 1,000 dollars or more adds two installments to that number, a balance owing of 500 dollars or more but under 1,000 dollars adds one installment, and a smaller balance adds none.
      An arrangement is open only when the balance owing is at least 300 dollars on a call for a unit covered by an active Harbison protection contract, at least 500 dollars on any other call of a customer with an active agreement, and at least 750 dollars on every other call; a smaller balance is paid in one installment.
      The amount paid up front is the call's late-payment charges together with its diagnostic fee and after-hours premium net of the member diagnostic rate and member premium discount for a customer whose active agreement had no dues drafted by bank autopay in the last 12 months, the call's late-payment charges alone for any other customer with an active agreement, and nothing for every other customer, in which case the whole balance is divided equally.
      An amount that falls exactly halfway between two cents is rounded up to the higher cent.
    prerequisite:
      - problem: service_ext_late_payment_charge
        kind: value_input
        gate: p_bal
        form: state
        policy_source: >-
          The first installment of a payment arrangement is not taken until the invoice carries a late-payment charge for every charging period that has run past the customer's late-payment grace.
        condition: >-
          Every charging period that has run past the customer's late-payment grace since the call's completed_date is covered by a late_payment_charge line among the call's service_lines.
        resolved_by: post_late_payment_charge_b790dc9b
        effect: >-
          The late-payment charge raises the call's ticket_balance and its late-payment charges, so both p_bal and the amount paid up front rise by the charge and the first installment rises with them.
    cross_category:
      - category: plan
        as: history
        reads: [status, consecutive_terms, plan_billing_entries.line_type]
        note: The number of installments reads the agreement's consecutive terms, and the amount paid up front counts its bank autopay dues drafts in the last 12 months.
      - category: warranty
        as: existence
        reads: [status, equipment_id]
        note: The arrangement minimum reads whether the call's unit carries an active protection contract.
    compute:
      - plan_active: "CFIELD('plan','status') == 'active'"
      - p_bal: "F('ticket_balance')"
      - p_late: "SUM('service_lines','amount', line_type='late_payment_charge')"
      - p_fees: "SUM('service_lines','amount', line_type='diagnostic_fee') + SUM('service_lines','amount', line_type='after_hours_premium') - SUM('service_lines','amount', line_type='member_diagnostic_rate') - SUM('service_lines','amount', line_type='member_premium_discount')"
      - p_autopay_12: "XCOUNT('plan','plan_billing_entries', within_months=K('front_window_months'), date_field='posted_date', line_type='dues_payment', payment_method='ach_autopay')"
      - p_front: "(p_late + MX(0, p_fees)) if (plan_active and p_autopay_12 == 0) else (p_late if plan_active else 0)"
      - p_terms: "(CFIELD('plan','consecutive_terms') or 0) if plan_active else 0"
      - p_count: "K('installments_long') if (plan_active and p_terms >= K('terms_long')) else (K('installments_member') if plan_active else 1)"
      - p_ledger: "SUM('service_lines','amount', event_type='service_charge') - SUM('service_lines','amount', event_type='service_discount') - SUM('service_lines','amount', event_type='service_coverage_credit') - SUM('service_lines','amount', event_type='service_payment') + SUM('service_lines','amount', event_type='service_refund')"
      - p_extra: "K('extra_large') if p_ledger >= K('large_balance') else (K('extra_mid') if p_ledger >= K('mid_balance') else 0)"
      - p_unit_contract: "CFIELD('warranty','status', equipment_id=F('equipment_id'))"
      - p_min: "K('min_protected') if p_unit_contract == 'active' else (K('min_member') if plan_active else K('min_standard'))"
      - p_n: "(p_count + p_extra) if p_bal >= p_min else 1"
      - p_rest: "p_bal - p_front"
      - result: "RND(p_front + RND(p_rest / p_n + K('half_up_nudge'), 2), 2)"
    compute_basis:
      plan_active: "2 for any other customer with an active agreement, and 1 for every other customer."
      p_bal: "The arrangement is figured on the balance owing on the call when the first installment is paid"
      p_late: "the call's late-payment charges alone for any other customer with an active agreement"
      p_fees: "the call's late-payment charges together with its diagnostic fee and after-hours premium net of the member diagnostic rate and member premium discount"
      p_autopay_12: "for a customer whose active agreement had no dues drafted by bank autopay in the last 12 months"
      p_front: "The amount paid up front is the call's late-payment charges together with its diagnostic fee and after-hours premium net of the member diagnostic rate and member premium discount for a customer whose active agreement had no dues drafted by bank autopay in the last 12 months, the call's late-payment charges alone for any other customer with an active agreement, and nothing for every other customer, in which case the whole balance is divided equally."
      p_terms: "The number of installments is 3 for a customer whose active Comfort Club agreement has run six or more consecutive terms"
      p_count: "The number of installments is 3 for a customer whose active Comfort Club agreement has run six or more consecutive terms, 2 for any other customer with an active agreement, and 1 for every other customer."
      p_ledger: "The balance owing for this purpose is worked out from the invoice lines: the call's charge lines, less its discount, coverage-credit and payment lines, plus its refund lines"
      p_extra: "a balance owing of 1,000 dollars or more adds two installments to that number, a balance owing of 500 dollars or more but under 1,000 dollars adds one installment, and a smaller balance adds none."
      p_unit_contract: "at least 300 dollars on a call for a unit covered by an active Harbison protection contract"
      p_min: "An arrangement is open only when the balance owing is at least 300 dollars on a call for a unit covered by an active Harbison protection contract, at least 500 dollars on any other call of a customer with an active agreement, and at least 750 dollars on every other call; a smaller balance is paid in one installment."
      p_n: "a smaller balance is paid in one installment."
      p_rest: "the amount paid up front is set aside from that balance, the rest is divided by the number of installments"
      result: "the first installment is the amount paid up front plus one such share rounded to the cent half up."
    factors:
      - id: installment_count
        effect: parameter
        decides: p_count
        bindings: [p_terms, p_count]
        ladder:
          - when: "active agreement with six or more consecutive terms"
            value: "K('installments_long') = 3 installments"
          - when: "active agreement with fewer than six consecutive terms"
            value: "K('installments_member') = 2 installments"
          - when: "otherwise"
            value: "1 installment"
        baseline:
          p_count: "1"
        evidence: [cross_category]
        cross_difficulty: plan
      - id: balance_size_installments
        effect: parameter
        decides: p_extra
        bindings: [p_ledger, p_extra]
        ladder:
          - when: "balance owing of 1,000 dollars or more, worked out from the invoice lines"
            value: "K('extra_large') = 2 added installments"
          - when: "balance owing of 500 dollars or more but under 1,000 dollars"
            value: "K('extra_mid') = 1 added installment"
          - when: "otherwise"
            value: "no added installment"
        baseline:
          p_extra: "0"
        evidence: [history]
        cross_difficulty: null
      - id: arrangement_minimum
        effect: parameter
        decides: p_min
        bindings: [p_unit_contract, p_min]
        ladder:
          - when: "call on a unit covered by an active protection contract"
            value: "K('min_protected') = 300 dollars"
          - when: "other call of a customer with an active agreement"
            value: "K('min_member') = 500 dollars"
          - when: "otherwise"
            value: "K('min_standard') = 750 dollars"
        baseline:
          p_min: "K('min_standard')"
        evidence: [cross_category]
        cross_difficulty: warranty
      - id: up_front_amount
        effect: method
        decides: p_front
        bindings: [p_late, p_fees, p_autopay_12, p_front]
        ladder:
          - when: "active agreement with no dues drafted by bank autopay in the last 12 months"
            method: "late-payment charges plus the net diagnostic fee and premium are paid up front, the rest divided"
          - when: "active agreement with dues drafted by bank autopay in the last 12 months"
            method: "the late-payment charges alone are paid up front, the rest divided"
          - when: "otherwise"
            method: "nothing is paid up front; the whole balance is divided equally"
        baseline:
          p_front: "0"
        evidence: [history, cross_category]
        cross_difficulty: plan
    baseline:
      rule: >-
        A customer whose completed call still carries a balance more than 30 days after its completion date may ask to settle that past-due balance under a payment arrangement, and pays the first installment in person at once.
        Under the standard terms a past-due balance is paid in a single payment of the whole balance owing on the call when it is paid.
      params: [past_due_days, min_standard]
    inputs:
      history:
        - {table: service_lines, aggregate: sum, field: amount, filters: {line_type: late_payment_charge}}
        - {table: service_lines, aggregate: sum, field: amount, filters: {event_type: service_charge}}
        - {category: plan, table: plan_billing_entries, aggregate: count, field: billing_entry_id, within_months: 12, filters: {line_type: dues_payment, payment_method: ach_autopay}}
      cross_category: [plan, warranty]
  - id: service_ext_member_premium_discount
    base_policy_refs: [service_evt_dispatch_fees, service_evt_member_benefits, service_evt_discount_stacking, service_evt_diagnostic_credit, service_evt_repair_guarantee, service_evt_late_arrival_credit]
    overwrite:
      - base_policy: service_evt_dispatch_fees
        superseded_clause: >-
          receives the tier's after_hours_premium_discount_pct off the premium of an Evening, Weekend or Overnight Emergency call, or the tier's holiday_premium_discount_pct off the premium of a Holiday Emergency call, posted as a member_premium_discount
        replaced_by: >-
          The member premium discount on an after-hours call is the after-hours premium billed on the call multiplied by the member premium percentage, rounded once to the cent half up, and posted as one member premium discount line naming the premium line and the agreement.
    trigger: state_due
    subject: [service_discount]
    computes: amount
    target_tool: post_member_premium_discount_f1d91bca
    params:
      tenure_long_months: 96
      tenure_mid_months: 36
      tenure_pts_long: 15
      tenure_pts_mid: 10
      prepay_pts_renewing: 5
      prepay_pts_annual: 3
      visits_window_long: 24
      visits_window_short: 12
      visits_high_count: 3
      visits_pts_high: 10
      visits_pts_low: 5
      install_recent_months: 60
      install_pts_recent: 10
      install_pts_older: 5
      filter_high_merv: 13
      filter_pts_high: 5
      filter_pts_std: 3
      pct_cap: 100
      terms_long: 3
      terms_mid: 2
      half_up_nudge: 0.000000001
    rule: >-
      A Comfort Club member whose agreement is active on the completion date of an Evening, Weekend, Overnight Emergency or Holiday Emergency call receives a member premium discount on the after-hours premium of that call.
      The standard member premium percentage is the member's tier after-hours premium discount percentage, or on a Holiday Emergency call the tier's holiday premium discount percentage, and a customer without an active agreement receives no member premium discount.
      The member premium discount on an after-hours call is the after-hours premium billed on the call multiplied by the member premium percentage, rounded once to the cent half up, and posted as one member premium discount line naming the premium line and the agreement.
      The member premium percentage never exceeds 100 percent.
      A member whose agreement was first enrolled 96 or more whole calendar months before the date of handling adds 15 points to the member premium percentage, a member first enrolled 36 to 95 months before adds 10 points, and a member first enrolled more recently adds nothing.
      A member whose agreement is billed annually and set to renew automatically adds 5 points to the member premium percentage, a member billed annually without automatic renewal adds 3 points, and a member billed monthly adds nothing.
      The completed tune-ups counted toward the member premium percentage are taken this way: for a member in at least the third consecutive term, the completed tune-up visits posted in the last 24 months; for a member in the second consecutive term, those in the last 12 months; for a member in the first term, the completed tune-up visits of the agreement's current term only; a visit is within the last 24 or 12 months while fewer than that many whole calendar months have passed from its visit date to the date of handling.
      Three or more completed tune-ups counted add 10 points to the member premium percentage, one or two add 5 points, and none add nothing.
      A member whose Harbison installation project was closed less than 60 whole months before the date of handling adds 10 points to the member premium percentage, one whose Harbison installation project was closed 60 or more months before adds 5 points, and a customer with no closed Harbison installation adds nothing.
      A member with an active FilterDirect subscription of MERV 13 or higher adds 5 points to the member premium percentage, one with an active FilterDirect subscription below MERV 13 adds 3 points, and a customer without an active subscription adds nothing.
      The points are added to the standard percentage before the 100 percent ceiling is applied.
      An amount that falls exactly halfway between two cents is rounded up to the higher cent.
    prerequisite: []
    cross_category:
      - category: plan
        as: history
        reads: [status, variant_name, enrolled_date, billing_frequency, auto_renew, consecutive_terms, term_start, after_hours_premium_discount_pct, holiday_premium_discount_pct, plan_service_entries.event_type]
        note: The standard percentage reads the tier, the tenure points the enrollment date, the prepay points billing and renewal, and the tune-up points count completed visits over the window the member's consecutive terms select.
      - category: install
        as: branch
        reads: [status, closed_date]
        note: The installation points read the customer's closed Harbison installation project and its close date.
      - category: filter
        as: branch
        reads: [status, merv_rating]
        note: The filter points read the active FilterDirect subscription and its MERV rating.
    compute:
      - plan_active: "CFIELD('plan','status') == 'active'"
      - m_premium: "SUM('service_lines','amount', line_type='after_hours_premium')"
      - m_std_pct: "0 if not plan_active else ((CPARAM('plan','holiday_premium_discount_pct') or 0) if F('variant_name') == 'Holiday Emergency Service Call' else (CPARAM('plan','after_hours_premium_discount_pct') or 0))"
      - m_tenure: "MONTHS(CFIELD('plan','enrolled_date'), NOW) if plan_active else 0"
      - m_tenure_pts: "K('tenure_pts_long') if m_tenure >= K('tenure_long_months') else (K('tenure_pts_mid') if m_tenure >= K('tenure_mid_months') else 0)"
      - m_freq: "CFIELD('plan','billing_frequency')"
      - m_renew: "CFIELD('plan','auto_renew')"
      - m_prepay_pts: "K('prepay_pts_renewing') if (m_freq == 'annual' and m_renew == True) else (K('prepay_pts_annual') if (m_freq == 'annual' and m_renew == False) else 0)"
      - m_visits_24: "XCOUNT('plan','plan_service_entries', within_months=K('visits_window_long'), date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit')"
      - m_visits_12: "XCOUNT('plan','plan_service_entries', within_months=K('visits_window_short'), date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit')"
      - m_visits_term: "XCOUNT('plan','plan_service_entries', event_type='plan_tuneup_visit', entry_reason='completed_visit', term_start=CFIELD('plan','term_start'))"
      - m_terms: "(CFIELD('plan','consecutive_terms') or 0) if plan_active else 0"
      - m_visits: "m_visits_24 if m_terms >= K('terms_long') else (m_visits_12 if m_terms >= K('terms_mid') else m_visits_term)"
      - m_visit_pts: "K('visits_pts_high') if m_visits >= K('visits_high_count') else (K('visits_pts_low') if m_visits >= 1 else 0)"
      - m_install_status: "CFIELD('install','status')"
      - m_install_months: "MONTHS(CFIELD('install','closed_date'), NOW) if m_install_status == 'closed' else 0"
      - m_install_pts: "K('install_pts_recent') if (m_install_status == 'closed' and m_install_months < K('install_recent_months')) else (K('install_pts_older') if m_install_status == 'closed' else 0)"
      - m_filter_status: "CFIELD('filter','status')"
      - m_filter_merv: "CPARAM('filter','merv_rating', status='active')"
      - m_filter_pts: "K('filter_pts_high') if (m_filter_status == 'active' and m_filter_merv >= K('filter_high_merv')) else (K('filter_pts_std') if m_filter_status == 'active' else 0)"
      - m_pct: "MN(K('pct_cap'), m_std_pct + m_tenure_pts + m_prepay_pts + m_visit_pts + m_install_pts + m_filter_pts) if plan_active else 0"
      - result: "RND(m_premium * m_pct / 100 + K('half_up_nudge'), 2)"
    compute_basis:
      plan_active: "A Comfort Club member whose agreement is active on the completion date of an Evening, Weekend, Overnight Emergency or Holiday Emergency call receives a member premium discount on the after-hours premium of that call."
      m_premium: "The member premium discount on an after-hours call is the after-hours premium billed on the call multiplied by the member premium percentage"
      m_std_pct: "The standard member premium percentage is the member's tier after-hours premium discount percentage, or on a Holiday Emergency call the tier's holiday premium discount percentage, and a customer without an active agreement receives no member premium discount."
      m_tenure: "A member whose agreement was first enrolled 96 or more whole calendar months before the date of handling adds 15 points to the member premium percentage"
      m_tenure_pts: "A member whose agreement was first enrolled 96 or more whole calendar months before the date of handling adds 15 points to the member premium percentage, a member first enrolled 36 to 95 months before adds 10 points, and a member first enrolled more recently adds nothing."
      m_freq: "A member whose agreement is billed annually and set to renew automatically adds 5 points to the member premium percentage"
      m_renew: "a member billed annually without automatic renewal adds 3 points, and a member billed monthly adds nothing."
      m_prepay_pts: "A member whose agreement is billed annually and set to renew automatically adds 5 points to the member premium percentage, a member billed annually without automatic renewal adds 3 points, and a member billed monthly adds nothing."
      m_terms: "for a member in at least the third consecutive term"
      m_visits_24: "a visit is within the last 24 or 12 months while fewer than that many whole calendar months have passed from its visit date to the date of handling."
      m_visits_12: "a visit is within the last 24 or 12 months while fewer than that many whole calendar months have passed from its visit date to the date of handling."
      m_visits_term: "for a member in the first term, the completed tune-up visits of the agreement's current term only"
      m_visits: "The completed tune-ups counted toward the member premium percentage are taken this way: for a member in at least the third consecutive term, the completed tune-up visits posted in the last 24 months; for a member in the second consecutive term, those in the last 12 months; for a member in the first term, the completed tune-up visits of the agreement's current term only"
      m_visit_pts: "Three or more completed tune-ups counted add 10 points to the member premium percentage, one or two add 5 points, and none add nothing."
      m_install_status: "and a customer with no closed Harbison installation adds nothing."
      m_install_months: "A member whose Harbison installation project was closed less than 60 whole months before the date of handling adds 10 points to the member premium percentage"
      m_install_pts: "A member whose Harbison installation project was closed less than 60 whole months before the date of handling adds 10 points to the member premium percentage, one whose Harbison installation project was closed 60 or more months before adds 5 points, and a customer with no closed Harbison installation adds nothing."
      m_filter_status: "a customer without an active subscription adds nothing."
      m_filter_merv: "A member with an active FilterDirect subscription of MERV 13 or higher adds 5 points to the member premium percentage"
      m_filter_pts: "A member with an active FilterDirect subscription of MERV 13 or higher adds 5 points to the member premium percentage, one with an active FilterDirect subscription below MERV 13 adds 3 points, and a customer without an active subscription adds nothing."
      m_pct: "The points are added to the standard percentage before the 100 percent ceiling is applied."
      result: "rounded once to the cent half up, and posted as one member premium discount line naming the premium line and the agreement."
    factors:
      - id: enrollment_tenure_points
        effect: parameter
        decides: m_tenure_pts
        bindings: [m_tenure, m_tenure_pts]
        ladder:
          - when: "member first enrolled 96 or more months before handling"
            value: "K('tenure_pts_long') = 15 points"
          - when: "member first enrolled 36 to 95 months before handling"
            value: "K('tenure_pts_mid') = 10 points"
          - when: "otherwise"
            value: "0 points"
        baseline:
          m_tenure_pts: "0"
        evidence: [date, cross_category]
        cross_difficulty: plan
      - id: prepaid_renewal_points
        effect: parameter
        decides: m_prepay_pts
        bindings: [m_freq, m_renew, m_prepay_pts]
        ladder:
          - when: "agreement billed annually and set to renew automatically"
            value: "K('prepay_pts_renewing') = 5 points"
          - when: "agreement billed annually without automatic renewal"
            value: "K('prepay_pts_annual') = 3 points"
          - when: "otherwise"
            value: "0 points"
        baseline:
          m_prepay_pts: "0"
        evidence: [cross_category]
        cross_difficulty: plan
      - id: tune_up_count_window
        effect: method
        decides: m_visits
        bindings: [m_terms, m_visits_24, m_visits_12, m_visits]
        ladder:
          - when: "member in at least the third consecutive term"
            method: "count the completed tune-up visits of the last 24 months"
          - when: "member in the second consecutive term"
            method: "count the completed tune-up visits of the last 12 months"
          - when: "otherwise"
            method: "count the completed tune-up visits of the current term only (member in the first term)"
        baseline:
          m_visits: "m_visits_term"
        evidence: [history, cross_category]
        cross_difficulty: plan
      - id: tune_up_points
        effect: parameter
        decides: m_visit_pts
        bindings: [m_visits_term, m_visit_pts]
        ladder:
          - when: "three or more completed tune-ups counted"
            value: "K('visits_pts_high') = 10 points"
          - when: "one or two completed tune-ups counted"
            value: "K('visits_pts_low') = 5 points"
          - when: "otherwise (none)"
            value: "0 points"
        baseline:
          m_visit_pts: "0"
        evidence: [history]
        cross_difficulty: plan
      - id: installation_points
        effect: parameter
        decides: m_install_pts
        bindings: [m_install_status, m_install_months, m_install_pts]
        ladder:
          - when: "Harbison installation project closed less than 60 months ago"
            value: "K('install_pts_recent') = 10 points"
          - when: "Harbison installation project closed 60 or more months ago"
            value: "K('install_pts_older') = 5 points"
          - when: "otherwise (no closed Harbison installation)"
            value: "0 points"
        baseline:
          m_install_pts: "0"
        evidence: [cross_category, date]
        cross_difficulty: install
      - id: filter_points
        effect: parameter
        decides: m_filter_pts
        bindings: [m_filter_status, m_filter_merv, m_filter_pts]
        ladder:
          - when: "active FilterDirect subscription of MERV 13 or higher"
            value: "K('filter_pts_high') = 5 points"
          - when: "active FilterDirect subscription below MERV 13"
            value: "K('filter_pts_std') = 3 points"
          - when: "otherwise"
            value: "0 points"
        baseline:
          m_filter_pts: "0"
        evidence: [cross_category]
        cross_difficulty: filter
    baseline:
      rule: >-
        A Comfort Club member whose agreement is active on the completion date of an Evening, Weekend, Overnight Emergency or Holiday Emergency call receives a member premium discount on the after-hours premium of that call.
        The standard member premium percentage is the member's tier after-hours premium discount percentage, or on a Holiday Emergency call the tier's holiday premium discount percentage, and a customer without an active agreement receives no member premium discount.
        The member premium discount on an after-hours call is the after-hours premium billed on the call multiplied by the member premium percentage, rounded once to the cent half up, and posted as one member premium discount line naming the premium line and the agreement.
