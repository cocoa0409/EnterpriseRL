  - id: service_ext_late_payment_charge
    base_policy_refs: [service_agg_one_open_call_per_unit, service_evt_dispatch_fees, service_evt_flat_rate_pricing, service_maintenance_tuneup, service_evt_repair_guarantee, service_cancellation, service_payment_and_collections]
    overwrite:
      - base_policy: service_payment_and_collections
        superseded_clause: >-
          A late_payment_charge is posted only once more than late_payment_after_days calendar days have passed since the call was completed with a balance still owing.
        replaced_by: >-
          A late-payment charge is owed on a completed call whose balance is still owing once more than the late-payment grace days that apply to the customer have passed since its completion date.
      - base_policy: service_payment_and_collections
        superseded_clause: >-
          Each charge is late_payment_charge_pct_monthly percent of the balance owing on the day it posts, rounded to the cent half up and never less than late_payment_charge_min_usd, and one further charge may post for each additional full 30 days the balance stays unpaid.
        replaced_by: >-
          Under the standard count, once the grace has passed, one charging period is counted for the first day past the grace and one more for each further full charging period, and the charge for every period counted and not yet charged is posted together as one late-payment charge line on the invoice.
    trigger: state_due
    subject: [service_charge]
    computes: amount
    target_tool: post_late_payment_charge_b790dc9b
    params:
      autopay_window_months: 3
      autopay_drafts_required: 3
      grace_autopay: 45
      grace_member: 40
      period_days: 30
      late_fee_window_months: 24
      rate_member_clean: 1.0
      rate_member: 1.25
      tenure_long_months: 60
      tenure_mid_months: 24
      relief_long: 0.5
      relief_mid: 0.75
      paid_share_full: 0.25
      half_period: 0.5
      half_up_nudge: 0.000000001
    rule: >-
      A late-payment charge is owed on a completed call whose balance is still owing once more than the late-payment grace days that apply to the customer have passed since its completion date.
      Late-payment days are counted as calendar days with the completion date as day 0.
      The standard late-payment grace is the call class's 30 days, the charging period is 30 days, and the standard rate is the call class's late-payment charge of 1.5 percent for each charging period.
      Under the standard count, once the grace has passed, one charging period is counted for the first day past the grace and one more for each further full charging period, and the charge for every period counted and not yet charged is posted together as one late-payment charge line on the invoice.
      Periods already charged are the periods counted, in the same way, as of the posting date of the call's latest late-payment charge line, and only the periods counted beyond them are charged now.
      The late-payment charge is the balance owing on the call on the day it posts multiplied by the rate in percent and by the number of periods counted, rounded once at the end to the cent half up, and never less than the call class's minimum late-payment charge of 2 dollars.
      No late-payment charge is figured until the invoice of a call whose technician arrived after the end of the booked window and the arrival grace carries the late-arrival credit owed on it.
      The late-payment charge is fixed only after every refrigerant line on an active member's call carries the member refrigerant allowance line owed on it.
      The late-payment grace is 45 days for a customer with an active Comfort Club agreement whose dues were drafted by bank autopay three or more times in the last 3 months, 40 days for any other customer with an active agreement, and the class's 30 days for every other customer; a draft is within the last 3 months while fewer than 3 whole calendar months have passed from its posting date to the date of handling.
      Which count applies depends on what the customer has paid toward the call: when the payments posted on the call cover at least a quarter of its charges, only charging periods that have run in full past the grace are counted instead of the standard count; when the customer has paid something toward the call but less than a quarter of its charges, the charging periods that have run in full are counted and a period still running counts as half a period, instead of the standard count; when nothing has been paid toward the call, the standard count applies.
      The rate is 1 percent for each charging period for a customer whose active agreement has carried no Comfort Club late fee in the last 24 months, 1.25 percent for any other customer with an active agreement, and the class's 1.5 percent for every other customer.
      The relief factor is 0.5 for a customer whose active agreement was first enrolled 60 or more whole calendar months before the date of handling, 0.75 for one first enrolled 24 to 59 months before, and 1 for every other customer.
      The product of balance, rate and periods is multiplied by the relief factor before the single rounding, and the minimum charge is compared with the rounded result.
      An amount that falls exactly halfway between two cents is rounded up to the higher cent.
    prerequisite:
      - problem: service_ext_on_time_credit
        kind: value_input
        gate: l_bal
        form: state
        policy_source: >-
          No late-payment charge is figured until the invoice of a call whose technician arrived after the end of the booked window and the arrival grace carries the late-arrival credit owed on it.
        condition: >-
          When the call's arrived_at falls after its arrival window end plus the customer's arrival grace (or on a later day) in a class with an on-time credit above zero, a late_arrival_credit line naming the call's diagnostic fee line stands among its service_lines.
        resolved_by: post_on_time_credit_a011cbd0
        effect: >-
          The late-arrival credit lowers the call's ticket_balance by the credit, so the balance l_bal the charge is figured on drops by the same amount and the charge falls with it.
      - problem: service_ext_refrigerant_allowance
        kind: value_input
        gate: l_bal
        form: state
        policy_source: >-
          The late-payment charge is fixed only after every refrigerant line on an active member's call carries the member refrigerant allowance line owed on it.
        condition: >-
          For a customer with an active Comfort Club agreement, each refrigerant charge line of the call is named as source by a member_refrigerant_allowance line among its service_lines.
        resolved_by: post_refrigerant_allowance_39aa6c52
        effect: >-
          The member refrigerant allowance lowers the call's ticket_balance by the value of the pounds covered, so l_bal drops by that value and the charge falls with it.
    cross_category:
      - category: plan
        as: history
        reads: [status, enrolled_date, plan_billing_entries.line_type, plan_billing_entries.payment_method]
        note: The grace counts the agreement's autopay dues drafts, the rate counts its late fees and the relief factor reads its first enrollment date.
    compute:
      - plan_active: "CFIELD('plan','status') == 'active'"
      - l_bal: "F('ticket_balance')"
      - l_days: "DAYS(F('completed_date'), NOW) if F('completed_date') else 0"
      - l_autopays: "XCOUNT('plan','plan_billing_entries', within_months=K('autopay_window_months'), date_field='posted_date', line_type='dues_payment', payment_method='ach_autopay')"
      - l_grace: "K('grace_autopay') if (plan_active and l_autopays >= K('autopay_drafts_required')) else (K('grace_member') if plan_active else P('late_payment_after_days'))"
      - l_elapsed: "l_days - l_grace"
      - l_last_charge: "LATEST('service_lines','posted_date', date_field='posted_date', line_type='late_payment_charge')"
      - l_elapsed_last: "(DAYS(F('completed_date'), l_last_charge) - l_grace) if l_last_charge else 0"
      - l_charges: "SUM('service_lines','amount', event_type='service_charge')"
      - l_paid: "SUM('service_lines','amount', event_type='service_payment')"
      - l_convention: "'completed' if (l_charges > 0 and l_paid / l_charges >= K('paid_share_full')) else ('prorated' if l_paid > 0 else 'started')"
      - l_periods_now: "0 if l_elapsed <= 0 else (int(l_elapsed / K('period_days')) if l_convention == 'completed' else ((int(l_elapsed / K('period_days')) + (K('half_period') if l_elapsed - int(l_elapsed / K('period_days')) * K('period_days') > 0 else 0)) if l_convention == 'prorated' else (int((l_elapsed - 1) / K('period_days')) + 1)))"
      - l_periods_charged: "0 if l_elapsed_last <= 0 else (int(l_elapsed_last / K('period_days')) if l_convention == 'completed' else ((int(l_elapsed_last / K('period_days')) + (K('half_period') if l_elapsed_last - int(l_elapsed_last / K('period_days')) * K('period_days') > 0 else 0)) if l_convention == 'prorated' else (int((l_elapsed_last - 1) / K('period_days')) + 1)))"
      - l_periods: "MX(0, l_periods_now - l_periods_charged)"
      - l_late_fees: "XCOUNT('plan','plan_billing_entries', within_months=K('late_fee_window_months'), date_field='posted_date', line_type='late_fee')"
      - l_rate: "K('rate_member_clean') if (plan_active and l_late_fees == 0) else (K('rate_member') if plan_active else P('late_payment_charge_pct_monthly'))"
      - l_tenure: "MONTHS(CFIELD('plan','enrolled_date'), NOW) if plan_active else 0"
      - l_relief: "K('relief_long') if (plan_active and l_tenure >= K('tenure_long_months')) else (K('relief_mid') if (plan_active and l_tenure >= K('tenure_mid_months')) else 1)"
      - l_raw: "RND(l_bal * l_rate / 100 * l_periods * l_relief + K('half_up_nudge'), 2)"
      - result: "MX(P('late_payment_charge_min_usd'), l_raw) if (l_periods > 0 and l_bal > 0) else 0"
    compute_basis:
      plan_active: "The late-payment grace is 45 days for a customer with an active Comfort Club agreement"
      l_bal: "The late-payment charge is the balance owing on the call on the day it posts multiplied by the rate in percent and by the number of periods counted"
      l_days: "Late-payment days are counted as calendar days with the completion date as day 0."
      l_autopays: "a draft is within the last 3 months while fewer than 3 whole calendar months have passed from its posting date to the date of handling."
      l_grace: "The late-payment grace is 45 days for a customer with an active Comfort Club agreement whose dues were drafted by bank autopay three or more times in the last 3 months, 40 days for any other customer with an active agreement, and the class's 30 days for every other customer"
      l_elapsed: "A late-payment charge is owed on a completed call whose balance is still owing once more than the late-payment grace days that apply to the customer have passed since its completion date."
      l_last_charge: "Periods already charged are the periods counted, in the same way, as of the posting date of the call's latest late-payment charge line, and only the periods counted beyond them are charged now."
      l_elapsed_last: "Periods already charged are the periods counted, in the same way, as of the posting date of the call's latest late-payment charge line, and only the periods counted beyond them are charged now."
      l_charges: "when the payments posted on the call cover at least a quarter of its charges"
