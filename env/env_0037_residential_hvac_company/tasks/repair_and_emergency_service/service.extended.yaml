        evidence: [history, cross_category]
        cross_difficulty: plan
      - id: unit_enrollment_multiplier
        effect: parameter
        decides: d_mult
        bindings: [d_unit_visits, d_mult]
        ladder:
          - when: "member, call's unit has a completed Comfort Club tune-up on record"
            value: "K('unit_mult_enrolled') = 0.75"
          - when: "member, call's unit has no completed Comfort Club tune-up on record"
            value: "K('unit_mult_other') = 0.9"
          - when: "otherwise"
            value: "1"
        baseline:
          d_mult: "1"
        evidence: [history, cross_category]
        cross_difficulty: plan
      - id: reduction_combination
        effect: method
        decides: d_off
        bindings: [d_products, d_off]
        ladder:
          - when: "three or more Harbison products held (active agreement, closed installation, active protection contract, active FilterDirect subscription)"
            method: "take both deposit reductions off the rate"
          - when: "exactly two Harbison products held"
            method: "take only the larger deposit reduction off the rate"
          - when: "otherwise (one product or none)"
            method: "take no reduction off the rate"
        baseline:
          d_off: "0"
        evidence: [cross_category]
        cross_difficulty: install
