# Repair and emergency service calls — product and event policy charter.
# Functional surface: booking under a call class (hours, cut-offs, horizon, tune-up and duct-cleaning
# availability), safety triage for carbon monoxide alarms, one open call per unit, reclassification,
# dispatch fees and after-hours premiums, flat-rate price book with class labor multipliers, refrigerant by
# the pound with visit limits, restore-only scope after hours, Comfort Club member benefits, courtesy
# discount programs and their stacking basis, diagnostic credit on approved repairs, warranty and Comfort
# Club coverage credits, the on-time arrival credit, the repair guarantee and free return visits,
# cancellation and no-access fees, payment application, late-payment charges, refunds and close-out.

category: service
display_name: Repair and Emergency Service Calls

binding:
  holding_table: service_tickets
  event_tables: [service_lines]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    ticket_balance: ticket_balance

lifecycle:
  states: [booked, dispatched, completed, closed, cancelled]
  transitions:
    - {from: booked, to: dispatched, by: system, means: "A technician is dispatched to the call."}
    - {from: booked, to: cancelled, by: agent, means: "The call is cancelled at the customer's request before a technician is dispatched."}
    - {from: dispatched, to: cancelled, by: agent, means: "The call is cancelled after dispatch, at the customer's request or because the technician could not get access."}
    - {from: dispatched, to: completed, by: system, means: "The technician finishes the work and the invoice is issued."}
    - {from: completed, to: closed, by: system, means: "The invoice balance reaches zero."}

accounts:
  - key: ticket_balance
    unit: USD
    meaning: Amount owed on the service invoice; charges and refunds raise it, discounts, coverage credits and payments lower it, and a negative value is money Harbison owes the customer.

parameter_schema:
  diagnostic_fee_usd: Diagnostic (dispatch) fee charged once per visit, USD.
  after_hours_premium_usd: Flat premium added to a visit in this class; 0.00 for daytime weekday classes, USD.
  labor_multiplier: Multiplier applied to the price-book labor amount of every repair task in this class, decimal.
  response_target_hours: Target elapsed hours from booking to arrival for a no-heat or no-cool call in this class, integer hours.
  service_days: Days on which this class's arrival windows run, text.
  service_hours: Clock hours (Eastern) covered by this class's arrival windows, HH:MM-HH:MM.
  arrival_windows_offered: Arrival windows that can be booked under this class, list of service_tickets.arrival_window values.
  booking_cutoff: Latest booking moment for this class's earliest window, text.
  max_booking_horizon_days: Furthest ahead, in calendar days from the booking date, a call in this class can be scheduled; 0 means only the current day or night, integer days.
  member_queue_applies: Whether Comfort Club scheduling priority orders the dispatch queue in this class, boolean.
  free_cancellation_notice_hours: Elapsed hours before the start of the arrival window by which a call can be cancelled without a fee, integer hours.
  late_cancellation_fee_usd: Fee when a call is cancelled with less notice but before dispatch; 0.00 means none, USD.
  trip_fee_usd: Fee when a call is cancelled after dispatch or the technician cannot get access, USD.
  no_access_wait_minutes: Minutes the technician waits on site before recording no access, integer minutes.
  diagnostic_credit_on_repair: Whether the diagnostic fee paid is credited when a qualifying repair is approved, boolean.
  diagnostic_credit_min_repair_usd: Smallest repair subtotal, before discounts, that earns the diagnostic credit, USD.
  diagnostic_credit_window_days: Calendar days after the diagnosing visit within which a follow-up repair still earns the credit, integer days.
  multi_unit_single_diagnostic_fee: Whether a second unit diagnosed on the same visit is charged no second diagnostic fee, boolean.
  discount_program_pct: Courtesy discount for customers enrolled in the senior, military veteran or first responder program, percent.
  discount_program_applies: Whether the courtesy discount program applies in this class, boolean.
  tuneup_bookable: Whether a paid precision tune-up can be booked in this class, boolean.
  tuneup_price_usd: Price of a paid precision tune-up in this class, USD.
  duct_cleaning_bookable: Whether whole-home duct cleaning can be booked in this class, boolean.
  upfront_price_guarantee: Whether the task price quoted and approved before work begins is final, boolean.
  major_repair_allowed: Whether major repairs (compressor, coil, reversing valve, TXV replacement) are performed in this class rather than scheduled as a follow-up Standard call, boolean.
  truck_stock_only: Whether repairs in this class are limited to parts carried on the truck, boolean.
  refrigerant_max_lbs_per_visit: Most pounds of refrigerant added on one visit in this class, pounds.
  refrigerant_r410a_price_per_lb_usd: R-410A price per pound, USD.
  refrigerant_r22_price_per_lb_usd: R-22 price per pound, USD.
  refrigerant_r454b_price_per_lb_usd: R-454B price per pound, USD.
  r22_max_lbs_per_visit: Most pounds of R-22 added on one visit, pounds.
  leak_search_offer_over_lbs: Refrigerant added on one unit within 12 months above which a leak search must be offered before more is added, pounds.
  repair_guarantee_days: Calendar days after a repair is completed during which a return visit for the same failure is free, integer days.
  parts_guarantee_days: Calendar days after a repair is completed during which a Harbison-supplied part that fails is replaced free, integer days.
  late_arrival_credit_usd: Credit when the technician arrives after the arrival window plus grace; 0.00 means no on-time guarantee in this class, USD.
  late_arrival_grace_minutes: Minutes after the end of the arrival window before the on-time guarantee is missed, integer minutes.
  payment_due_days: Days after completion by which the invoice is due; 0 means due on completion, integer days.
  late_payment_after_days: Calendar days after completion after which an unpaid balance accrues a late-payment charge, integer days.
  late_payment_charge_pct_monthly: Late-payment charge per 30-day period on the unpaid balance, percent.
  late_payment_charge_min_usd: Smallest late-payment charge posted, USD.
  special_order_parts_deposit_pct: Deposit taken on special-order parts before they are ordered, percent of the parts amount.
  technician_type: Technician pool dispatched for this class; enum service_technician | on_call_technician.
  reclass_to_standard_allowed: Whether a booking in this class may be moved to a Standard Service Call at the customer's request before dispatch, boolean.
  reschedules_free: Reschedules allowed without a fee before dispatch when made with the required notice, integer.
  estimate_validity_days: Calendar days a written repair estimate from a visit stays valid at the quoted price, integer days.
  max_open_calls_per_unit: Booked or dispatched calls one unit may have at the same time, integer.
  water_heater_service_available: Whether tank water heater repairs are booked in this class, boolean.
  co_safety_test_on_heating_calls: Whether every heating call includes a combustion and carbon monoxide test at no charge, boolean.
  parts_return_visit_fee_usd: Fee for the return visit to install a part not on the truck; 0.00 means none, USD.
  price_book_edition: Price book edition the class prices from, YYYY-MM.

