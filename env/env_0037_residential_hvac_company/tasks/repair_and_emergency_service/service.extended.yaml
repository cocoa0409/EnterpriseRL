      l_convention: "Which count applies depends on what the customer has paid toward the call: when the payments posted on the call cover at least a quarter of its charges, only charging periods that have run in full past the grace are counted instead of the standard count; when the customer has paid something toward the call but less than a quarter of its charges, the charging periods that have run in full are counted and a period still running counts as half a period, instead of the standard count; when nothing has been paid toward the call, the standard count applies."
      l_periods_now: "Under the standard count, once the grace has passed, one charging period is counted for the first day past the grace and one more for each further full charging period, and the charge for every period counted and not yet charged is posted together as one late-payment charge line on the invoice."
      l_periods_charged: "Periods already charged are the periods counted, in the same way, as of the posting date of the call's latest late-payment charge line, and only the periods counted beyond them are charged now."
      l_periods: "Periods already charged are the periods counted, in the same way, as of the posting date of the call's latest late-payment charge line, and only the periods counted beyond them are charged now."
      l_late_fees: "The rate is 1 percent for each charging period for a customer whose active agreement has carried no Comfort Club late fee in the last 24 months"
      l_rate: "The rate is 1 percent for each charging period for a customer whose active agreement has carried no Comfort Club late fee in the last 24 months, 1.25 percent for any other customer with an active agreement, and the class's 1.5 percent for every other customer."
      l_tenure: "The relief factor is 0.5 for a customer whose active agreement was first enrolled 60 or more whole calendar months before the date of handling"
      l_relief: "The relief factor is 0.5 for a customer whose active agreement was first enrolled 60 or more whole calendar months before the date of handling, 0.75 for one first enrolled 24 to 59 months before, and 1 for every other customer."
      l_raw: "The product of balance, rate and periods is multiplied by the relief factor before the single rounding, and the minimum charge is compared with the rounded result."
      result: "rounded once at the end to the cent half up, and never less than the call class's minimum late-payment charge of 2 dollars."
    factors:
      - id: late_payment_grace
        effect: parameter
        decides: l_grace
        bindings: [l_autopays, l_grace]
        ladder:
          - when: "active agreement with three or more autopay dues drafts in the last 3 months"
            value: "K('grace_autopay') = 45 days"
          - when: "active agreement with fewer than three autopay drafts in the last 3 months"
            value: "K('grace_member') = 40 days"
          - when: "otherwise"
            value: "P('late_payment_after_days') = 30 days"
        baseline:
          l_grace: "P('late_payment_after_days')"
        evidence: [history, cross_category]
        cross_difficulty: plan
      - id: period_counting_convention
        effect: method
        decides: l_convention
        bindings: [l_charges, l_paid, l_convention]
        ladder:
          - when: "payments posted on the call cover at least a quarter of its charges"
            method: "count only charging periods that have run in full past the grace"
          - when: "something has been paid toward the call, but less than a quarter of its charges"
            method: "count the periods run in full and a period still running as half a period"
          - when: "otherwise (nothing paid toward the call)"
            method: "the standard count: every period started past the grace counts in full, the first from the first day past the grace"
        baseline:
          l_convention: "'started'"
        evidence: [history]
        cross_difficulty: null
      - id: late_payment_rate
        effect: parameter
        decides: l_rate
        bindings: [l_late_fees, l_rate]
        ladder:
          - when: "active agreement with no Comfort Club late fee in the last 24 months"
            value: "K('rate_member_clean') = 1 percent"
          - when: "active agreement with one or more late fees in the last 24 months"
            value: "K('rate_member') = 1.25 percent"
          - when: "otherwise"
            value: "P('late_payment_charge_pct_monthly') = 1.5 percent"
        baseline:
          l_rate: "P('late_payment_charge_pct_monthly')"
        evidence: [history, cross_category]
        cross_difficulty: plan
      - id: tenure_relief
        effect: parameter
        decides: l_relief
        bindings: [l_tenure, l_relief]
        ladder:
          - when: "active agreement first enrolled 60 or more months before handling"
            value: "K('relief_long') = 0.5"
          - when: "active agreement first enrolled 24 to 59 months before handling"
            value: "K('relief_mid') = 0.75"
          - when: "otherwise"
            value: "1"
        baseline:
          l_relief: "1"
        evidence: [date, cross_category]
        cross_difficulty: plan
    baseline:
