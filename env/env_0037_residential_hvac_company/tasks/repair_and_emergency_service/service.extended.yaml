        bindings: [d_dues_paid, d_dues_off]
        ladder:
          - when: "active agreement with two or more dues payments in the last 24 months"
            value: "K('dues_off_regular') = 5 points off"
          - when: "active agreement with a single dues payment in the last 24 months"
