  - id: service_ext_on_time_credit
    base_policy_refs: [service_evt_dispatch_fees, service_evt_member_benefits, service_evt_discount_stacking, service_evt_diagnostic_credit, service_evt_repair_guarantee, service_evt_late_arrival_credit]
    overwrite:
      - base_policy: service_evt_late_arrival_credit
        superseded_clause: >-
          the on-time credit is earned only when the technician arrived more than late_arrival_grace_minutes minutes after the end of the booked arrival window
        replaced_by: >-
          The on-time credit is earned only when the technician arrived after the end of the booked arrival window plus the arrival grace that applies to the customer, or on a later calendar day than the scheduled date.
      - base_policy: service_evt_late_arrival_credit
        superseded_clause: >-
          The credit is late_arrival_credit_usd, posted as a late_arrival_credit naming the visit's diagnostic fee line, and it may reduce the invoice below the diagnostic fee but never below zero.
        replaced_by: >-
          The on-time credit is the credit base multiplied by the lateness multiplier, rounded to the cent half up, with the comfort-call addition added after that rounding; the result is posted as one late-arrival credit line naming the visit's diagnostic fee line and the customer's agreement, and it never exceeds the balance owing on the invoice when it posts.
      - base_policy: service_evt_discount_stacking
        superseded_clause: >-
          a line's discounts and coverage together never exceed its charged amount
        replaced_by: >-
          The on-time credit is measured against the balance owing on the whole invoice and not against the amount left on the diagnostic fee line it names.
    trigger: state_due
    subject: [service_discount]
    computes: amount
    target_tool: post_on_time_credit_a011cbd0
    params:
      grace_front: 0
      grace_priority: 10
      labor_share_protected: 10
      labor_share_member: 5
      half_up_nudge: 0.000000001
      mult_very_late: 2
      mult_late: 1.5
      bonus_unguaranteed: 15
      bonus_comfort: 10
    rule: >-
      In call classes whose on-time credit is above zero, Harbison guarantees arrival within the booked window.
      The on-time credit is earned only when the technician arrived after the end of the booked arrival window plus the arrival grace that applies to the customer, or on a later calendar day than the scheduled date.
      The standard arrival grace is the call class's late-arrival grace of 15 minutes, and the standard credit base is the call class's on-time credit.
      The on-time credit is the credit base multiplied by the lateness multiplier, rounded to the cent half up, with the comfort-call addition added after that rounding; the result is posted as one late-arrival credit line naming the visit's diagnostic fee line and the customer's agreement, and it never exceeds the balance owing on the invoice when it posts.
      The on-time credit is measured against the balance owing on the whole invoice and not against the amount left on the diagnostic fee line it names.
      Only one on-time credit is posted per call, and a call class whose on-time credit is zero earns no credit, no multiplier and no addition.
      Under the standard terms the on-time credit is the class's on-time credit, earned when the technician arrived after the end of the booked arrival window plus the class's 15-minute grace, posted as one late-arrival credit line naming the visit's diagnostic fee line, and never more than the balance owing on the invoice when it posts.
      The arrival grace is 0 minutes for a customer whose active Comfort Club tier schedules front of line, 10 minutes for a customer whose active tier schedules with priority, and the class's 15 minutes for every other customer.
      The lateness multiplier is 2 when the technician arrived on a later calendar day than the scheduled date or more than 120 minutes after the window end plus grace, 1.5 when the technician arrived the same day more than 60 and no more than 120 minutes after the window end plus grace, and 1 otherwise.
      The credit base is figured this way: for a customer with an active Comfort Club agreement whose call concerns a unit covered by an active Harbison protection contract, it is 10 percent of the call's repair labor charges as billed; for any other customer with an active agreement, it is 5 percent of the call's repair labor charges as billed; in both cases it is rounded to the cent half up and never less than the class's on-time credit; for every other customer it is the class's on-time credit.
      The comfort-call addition is 15 dollars on a no-heat or no-cool call of a customer with an active agreement whose tier carries no no-heat or no-cool response guarantee, 10 dollars on any other no-heat or no-cool call, and nothing on calls for any other symptom.
      An amount that falls exactly halfway between two cents is rounded up to the higher cent.
    prerequisite: []
    cross_category:
      - category: plan
        as: branch
        reads: [status, scheduling_priority, no_heat_no_cool_response_hours]
        note: The arrival grace reads the active tier's scheduling priority, the credit base and the comfort-call addition read whether the agreement is active and whether its tier carries a response guarantee.
      - category: warranty
