        - {table: service_lines, aggregate: sum, field: amount, filters: {line_type: after_hours_premium}}
        - {category: plan, table: plan_service_entries, aggregate: count, field: service_entry_id, within_months: 24, filters: {event_type: plan_tuneup_visit, entry_reason: completed_visit}}
      cross_category: [plan, install, filter]
  - id: service_ext_courtesy_discount
    base_policy_refs: [service_evt_dispatch_fees, service_evt_member_benefits, service_evt_discount_stacking, service_evt_diagnostic_credit, service_evt_repair_guarantee, service_evt_late_arrival_credit]
    overwrite:
      - base_policy: service_evt_discount_stacking
        superseded_clause: >-
          a customer enrolled in a courtesy program (senior_65_plus, military_veteran or first_responder on the profile) receives discount_program_pct as a discount_program line
        replaced_by: >-
          On a paid tune-up line, a customer enrolled in the senior, military veteran or first responder courtesy program receives the courtesy rate as one courtesy discount line naming the tune-up line and the customer's agreement.
    trigger: state_due
    subject: [service_discount]
    computes: amount
    target_tool: post_courtesy_discount_1179d4e9
    params:
      terms_long: 8
      terms_mid: 4
      terms_pts_long: 4
      terms_pts_mid: 2
      staged_pts: 3
      single_stage_pts: 2
      ship_window_long: 24
      ship_high_count: 4
      ship_pts_high: 3
      ship_pts_low: 2
      matched_pts: 3
      single_unit_pts: 2
      card_window_months: 12
      card_pts: 2
      other_pay_pts: 1
      products_full: 3
      products_two: 2
      half_up_nudge: 0.000000001
    rule: >-
      On a paid tune-up line, a customer enrolled in the senior, military veteran or first responder courtesy program receives the courtesy rate as one courtesy discount line naming the tune-up line and the customer's agreement.
      The paid tune-up line qualifies in every call class where the courtesy program applies, because no member repair discount ever applies to it; on repair lines the courtesy program percentage still applies only to a line that receives no member repair discount, or in place of the member repair discount when the courtesy percentage is higher, and fees, premiums, refrigerant and late-payment charges never qualify.
      The standard courtesy rate is the call class's courtesy program percentage.
      The tune-up courtesy discount is the tune-up line's charged amount multiplied by the courtesy rate, rounded once to the cent half up.
      A customer whose active Comfort Club agreement has run eight or more consecutive terms earns a courtesy bonus award of 4 points, one whose active agreement has run four to seven consecutive terms earns 2 points, and any other customer earns no award.
      A customer whose closed Harbison installation installed a two-stage or variable-speed system earns a courtesy bonus award of 3 points, one whose closed Harbison installation installed a single-stage system earns 2 points, and a customer with no closed Harbison installation earns no award.
      The FilterDirect shipments counted toward the courtesy rate are those of the last 24 months; a shipment is within the last 24 months while fewer than 24 whole calendar months have passed from its ship date to the date of handling.
      Four or more shipments counted earn a courtesy bonus award of 3 points, one to three earn an award of 2 points, and none earn no award.
      A customer holding an active Harbison protection contract on a matched indoor and outdoor system earns a courtesy bonus award of 3 points, one holding an active single-unit protection contract earns 2 points, and a customer with no active protection contract earns no award.
      A customer whose active agreement's dues were paid by card on file at least once in the last 12 months earns a courtesy bonus award of 2 points, one whose active agreement's dues were paid only by other means in that time earns 1 point, and any other customer earns no award.
      How the courtesy bonus awards are added to the courtesy rate depends on how many Harbison products the customer holds among an active Comfort Club agreement, a closed Harbison installation, an active protection contract and an active FilterDirect subscription: with three or more, every bonus award is added; with exactly two, only the two largest awards are added; with one or none, no bonus award is added.
      The points so combined are added to the standard courtesy rate before the discount is figured.
      An amount that falls exactly halfway between two cents is rounded up to the higher cent.
    prerequisite: []
    cross_category:
      - category: plan
        as: history
        reads: [status, consecutive_terms, plan_billing_entries.payment_method]
        note: The term points read consecutive terms and the payment points count dues paid by card on file in the last 12 months.
      - category: install
        as: branch
        reads: [status, compressor_staging]
        note: The installation points read the staging of the system the closed Harbison installation put in.
      - category: filter
        as: history
        reads: [status, filter_entries.line_type]
        note: The shipment points count FilterDirect shipments over the last 24 months, and the product count reads whether the subscription is active.
      - category: warranty
        as: branch
        reads: [status, equipment_scope]
        note: The contract points read the scope of the customer's active protection contract.
    compute:
      - plan_active: "CFIELD('plan','status') == 'active'"
      - c_line: "SUM('service_lines','amount', line_type='maintenance_tuneup')"
      - c_std_rate: "P('discount_program_pct') if P('discount_program_applies') else 0"
      - c_terms: "(CFIELD('plan','consecutive_terms') or 0) if plan_active else 0"
      - c_term_pts: "K('terms_pts_long') if (plan_active and c_terms >= K('terms_long')) else (K('terms_pts_mid') if (plan_active and c_terms >= K('terms_mid')) else 0)"
      - c_staging: "CPARAM('install','compressor_staging', status='closed')"
      - c_install_pts: "K('staged_pts') if (c_staging == 'two_stage' or c_staging == 'variable_speed') else (K('single_stage_pts') if c_staging == 'single_stage' else 0)"
      - c_ship_24: "XCOUNT('filter','filter_entries', within_months=K('ship_window_long'), date_field='posted_date', line_type='shipment')"
      - c_ship_pts: "K('ship_pts_high') if c_ship_24 >= K('ship_high_count') else (K('ship_pts_low') if c_ship_24 >= 1 else 0)"
      - c_scope: "CFIELD('warranty','equipment_scope', status='active')"
      - c_contract_pts: "K('matched_pts') if c_scope == 'matched_system' else (K('single_unit_pts') if c_scope == 'single_unit' else 0)"
      - c_card_paid: "XCOUNT('plan','plan_billing_entries', within_months=K('card_window_months'), date_field='posted_date', line_type='dues_payment', payment_method='card_on_file')"
      - c_pay_pts: "K('card_pts') if (plan_active and c_card_paid >= 1) else (K('other_pay_pts') if plan_active else 0)"
      - c_products: "(1 if plan_active else 0) + (1 if EXISTS('install', status='closed') else 0) + (1 if EXISTS('warranty', status='active') else 0) + (1 if EXISTS('filter', status='active') else 0)"
      - c_bonus: "(c_term_pts + c_install_pts + c_ship_pts + c_contract_pts + c_pay_pts) if c_products >= K('products_full') else (max(c_term_pts + c_install_pts, c_term_pts + c_ship_pts, c_term_pts + c_contract_pts, c_term_pts + c_pay_pts, c_install_pts + c_ship_pts, c_install_pts + c_contract_pts, c_install_pts + c_pay_pts, c_ship_pts + c_contract_pts, c_ship_pts + c_pay_pts, c_contract_pts + c_pay_pts) if c_products == K('products_two') else 0)"
      - c_rate: "(c_std_rate + c_bonus) if c_std_rate > 0 else 0"
      - result: "RND(c_line * c_rate / 100 + K('half_up_nudge'), 2)"
    compute_basis:
      plan_active: "A customer whose active Comfort Club agreement has run eight or more consecutive terms earns a courtesy bonus award of 4 points"
      c_line: "The tune-up courtesy discount is the tune-up line's charged amount multiplied by the courtesy rate"
      c_std_rate: "The standard courtesy rate is the call class's courtesy program percentage."
      c_terms: "A customer whose active Comfort Club agreement has run eight or more consecutive terms earns a courtesy bonus award of 4 points"
      c_term_pts: "A customer whose active Comfort Club agreement has run eight or more consecutive terms earns a courtesy bonus award of 4 points, one whose active agreement has run four to seven consecutive terms earns 2 points, and any other customer earns no award."
      c_staging: "A customer whose closed Harbison installation installed a two-stage or variable-speed system earns a courtesy bonus award of 3 points"
      c_install_pts: "A customer whose closed Harbison installation installed a two-stage or variable-speed system earns a courtesy bonus award of 3 points, one whose closed Harbison installation installed a single-stage system earns 2 points, and a customer with no closed Harbison installation earns no award."
      c_ship_24: "The FilterDirect shipments counted toward the courtesy rate are those of the last 24 months; a shipment is within the last 24 months while fewer than 24 whole calendar months have passed from its ship date to the date of handling."
      c_ship_pts: "Four or more shipments counted earn a courtesy bonus award of 3 points, one to three earn an award of 2 points, and none earn no award."
      c_scope: "A customer holding an active Harbison protection contract on a matched indoor and outdoor system earns a courtesy bonus award of 3 points"
      c_contract_pts: "A customer holding an active Harbison protection contract on a matched indoor and outdoor system earns a courtesy bonus award of 3 points, one holding an active single-unit protection contract earns 2 points, and a customer with no active protection contract earns no award."
      c_card_paid: "A customer whose active agreement's dues were paid by card on file at least once in the last 12 months earns a courtesy bonus award of 2 points"
      c_pay_pts: "A customer whose active agreement's dues were paid by card on file at least once in the last 12 months earns a courtesy bonus award of 2 points, one whose active agreement's dues were paid only by other means in that time earns 1 point, and any other customer earns no award."
      c_products: "How the courtesy bonus awards are added to the courtesy rate depends on how many Harbison products the customer holds among an active Comfort Club agreement, a closed Harbison installation, an active protection contract and an active FilterDirect subscription"
      c_bonus: "with three or more, every bonus award is added; with exactly two, only the two largest awards are added; with one or none, no bonus award is added."
      c_rate: "The points so combined are added to the standard courtesy rate before the discount is figured."
      result: "The tune-up courtesy discount is the tune-up line's charged amount multiplied by the courtesy rate, rounded once to the cent half up."
    factors:
      - id: consecutive_term_points
        effect: parameter
        decides: c_term_pts
        bindings: [c_terms, c_term_pts]
        ladder:
          - when: "active agreement with eight or more consecutive terms"
            value: "K('terms_pts_long') = 4 points"
          - when: "active agreement with four to seven consecutive terms"
