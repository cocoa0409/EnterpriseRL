        note: The credit base reads whether the call's unit carries an active protection contract.
    compute:
      - plan_active: "CFIELD('plan','status') == 'active'"
      - t_class_credit: "P('late_arrival_credit_usd')"
      - t_priority: "CPARAM('plan','scheduling_priority')"
      - t_grace: "K('grace_front') if (plan_active and t_priority == 'front_of_line') else (K('grace_priority') if (plan_active and t_priority == 'priority') else P('late_arrival_grace_minutes'))"
      - t_cut0: "F('scheduled_date') + (('T12:00:00' if t_grace == 0 else ('T12:10:00' if t_grace == 10 else 'T12:15:00')) if F('arrival_window') == '08:00-12:00' else (('T17:00:00' if t_grace == 0 else ('T17:10:00' if t_grace == 10 else 'T17:15:00')) if F('arrival_window') == '12:00-17:00' else (('T22:00:00' if t_grace == 0 else ('T22:10:00' if t_grace == 10 else 'T22:15:00')) if F('arrival_window') == '17:00-22:00' else 'T99:99:99')))"
      - t_day_after: "DAYS(F('scheduled_date'), F('arrived_at')) if F('arrived_at') else 0"
      - t_cut60: "F('scheduled_date') + (('T13:00:00' if t_grace == 0 else ('T13:10:00' if t_grace == 10 else 'T13:15:00')) if F('arrival_window') == '08:00-12:00' else (('T18:00:00' if t_grace == 0 else ('T18:10:00' if t_grace == 10 else 'T18:15:00')) if F('arrival_window') == '12:00-17:00' else (('T23:00:00' if t_grace == 0 else ('T23:10:00' if t_grace == 10 else 'T23:15:00')) if F('arrival_window') == '17:00-22:00' else 'T99:99:99')))"
      - t_cut120: "F('scheduled_date') + (('T14:00:00' if t_grace == 0 else ('T14:10:00' if t_grace == 10 else 'T14:15:00')) if F('arrival_window') == '08:00-12:00' else (('T19:00:00' if t_grace == 0 else ('T19:10:00' if t_grace == 10 else 'T19:15:00')) if F('arrival_window') == '12:00-17:00' else (('T24:00:00' if t_grace == 0 else ('T24:10:00' if t_grace == 10 else 'T24:15:00')) if F('arrival_window') == '17:00-22:00' else 'T99:99:99')))"
      - t_mult: "K('mult_very_late') if (t_day_after > 0 or F('arrived_at') > t_cut120) else (K('mult_late') if F('arrived_at') > t_cut60 else 1)"
      - t_late: "(t_class_credit > 0) and (t_day_after > 0 or F('arrived_at') > t_cut0)"
      - t_unit_contract: "CFIELD('warranty','status', equipment_id=F('equipment_id'))"
      - t_labor: "SUM('service_lines','amount', line_type='repair_labor')"
      - t_base: "0 if t_class_credit == 0 else (MX(t_class_credit, RND(t_labor * K('labor_share_protected') / 100 + K('half_up_nudge'), 2)) if (plan_active and t_unit_contract == 'active') else (MX(t_class_credit, RND(t_labor * K('labor_share_member') / 100 + K('half_up_nudge'), 2)) if plan_active else t_class_credit))"
      - t_rg_hours: "CPARAM('plan','no_heat_no_cool_response_hours')"
      - t_comfort: "F('symptom') == 'no_heat' or F('symptom') == 'no_cool'"
      - t_bonus: "0 if t_class_credit == 0 else (K('bonus_unguaranteed') if (t_comfort and plan_active and t_rg_hours == 0) else (K('bonus_comfort') if t_comfort else 0))"
      - t_open: "F('ticket_balance')"
      - t_amount: "RND(t_base * t_mult + K('half_up_nudge'), 2) + t_bonus"
      - result: "RND(MX(0, MN(t_amount, t_open)), 2) if t_late else 0"
    compute_basis:
      plan_active: "for a customer with an active Comfort Club agreement whose call concerns a unit covered by an active Harbison protection contract"
      t_comfort: "10 dollars on any other no-heat or no-cool call, and nothing on calls for any other symptom."
