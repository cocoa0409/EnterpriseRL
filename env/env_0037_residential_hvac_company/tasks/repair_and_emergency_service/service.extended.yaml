      t_unit_contract: "for a customer with an active Comfort Club agreement whose call concerns a unit covered by an active Harbison protection contract"
      t_base: "The credit base is figured this way: for a customer with an active Comfort Club agreement whose call concerns a unit covered by an active Harbison protection contract, it is 10 percent of the call's repair labor charges as billed; for any other customer with an active agreement, it is 5 percent of the call's repair labor charges as billed; in both cases it is rounded to the cent half up and never less than the class's on-time credit; for every other customer it is the class's on-time credit."
      t_rg_hours: "The comfort-call addition is 15 dollars on a no-heat or no-cool call of a customer with an active agreement whose tier carries no no-heat or no-cool response guarantee"
      t_bonus: "The comfort-call addition is 15 dollars on a no-heat or no-cool call of a customer with an active agreement whose tier carries no no-heat or no-cool response guarantee, 10 dollars on any other no-heat or no-cool call, and nothing on calls for any other symptom."
      t_open: "it never exceeds the balance owing on the invoice when it posts."
