            value: "0 points"
        baseline:
          c_contract_pts: "0"
        evidence: [cross_category]
        cross_difficulty: warranty
      - id: dues_payment_points
        effect: parameter
        decides: c_pay_pts
        bindings: [c_card_paid, c_pay_pts]
        ladder:
          - when: "active agreement with dues paid by card on file in the last 12 months"
            value: "K('card_pts') = 2 points"
          - when: "active agreement with dues paid only by other means in the last 12 months"
            value: "K('other_pay_pts') = 1 point"
          - when: "otherwise"
            value: "0 points"
        baseline:
          c_pay_pts: "0"
        evidence: [history, cross_category]
        cross_difficulty: plan
      - id: bonus_combination
        effect: method
        decides: c_bonus
        bindings: [c_products, c_bonus]
        ladder:
          - when: "three or more Harbison products held (active agreement, closed installation, active protection contract, active FilterDirect subscription)"
            method: "add every bonus award"
          - when: "exactly two Harbison products held"
            method: "add only the two largest bonus awards"
          - when: "otherwise (one product or none)"
            method: "add no bonus award"
        baseline:
          c_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: filter
    baseline:
      rule: >-
        On a paid tune-up line, a customer enrolled in the senior, military veteran or first responder courtesy program receives the courtesy rate as one courtesy discount line naming the tune-up line and the customer's agreement.
        The paid tune-up line qualifies in every call class where the courtesy program applies, because no member repair discount ever applies to it; on repair lines the courtesy program percentage still applies only to a line that receives no member repair discount, or in place of the member repair discount when the courtesy percentage is higher, and fees, premiums, refrigerant and late-payment charges never qualify.
        The standard courtesy rate is the call class's courtesy program percentage.
        The tune-up courtesy discount is the tune-up line's charged amount multiplied by the courtesy rate, rounded once to the cent half up.
      params: [discount_program_pct]
    inputs:
      history:
        - {table: service_lines, aggregate: sum, field: amount, filters: {line_type: maintenance_tuneup}}
        - {category: filter, table: filter_entries, aggregate: count, field: filter_entry_id, within_months: 24, filters: {line_type: shipment}}
        - {category: plan, table: plan_billing_entries, aggregate: count, field: billing_entry_id, within_months: 12, filters: {line_type: dues_payment, payment_method: card_on_file}}
      cross_category: [plan, install, filter, warranty]
  - id: service_ext_special_order_release
    base_policy_refs: [service_payment_and_collections, service_evt_flat_rate_pricing]
    overwrite:
      - base_policy: service_evt_flat_rate_pricing
        superseded_clause: >-
          Special-order parts require a deposit of special_order_parts_deposit_pct of the parts amount before they are ordered.
        replaced_by: >-
          A special-order part is ordered only when the customer has paid, in person, the release payment for it: the visit balance of the call together with the special-order deposit.
      - base_policy: service_payment_and_collections
        superseded_clause: >-
          The invoice is due payment_due_days after completion, and 0 means it is due on completion.
        replaced_by: >-
          On a call whose approved repair waits for a special-order part, the repair's parts and labor lines, net of their member repair discounts, fall due when the repair is performed on the return visit, and everything else on the invoice is the visit balance, due now.
    trigger: on_request
    subject: [service_payment]
    computes: amount
    target_tool: pay_special_order_deposit_ccffba41
    params:
      rate_front: 25
      rate_priority: 35
      premium_install_price: 12000
      install_off_premium: 10
      install_off_other: 5
      unit_mult_enrolled: 0.75
      unit_mult_other: 0.9
      dues_window_months: 24
      dues_off_regular: 5
      dues_off_single: 3
      products_full: 3
      products_two: 2
      half_up_nudge: 0.000000001
    rule: >-
      A special-order part is ordered only when the customer has paid, in person, the release payment for it: the visit balance of the call together with the special-order deposit.
      On a call whose approved repair waits for a special-order part, the repair's parts and labor lines, net of their member repair discounts, fall due when the repair is performed on the return visit, and everything else on the invoice is the visit balance, due now.
      The visit balance is worked out from the invoice lines: the call's charge lines, less its discount, coverage-credit and payment lines, plus its refund lines, with the repair's parts and labor lines and their member repair discounts set aside; it is never less than zero.
      The standard deposit rate is the call class's special-order parts deposit percentage.
      The special-order deposit is the repair's parts amount as billed, before any discount, multiplied by the deposit rate, rounded once to the cent half up; the release payment is the visit balance plus the special-order deposit.
      The special-order deposit payment is taken only after the after-hours premium line on a member's call carries the member premium discount line owed on it.
      No special-order deposit payment is taken until the paid tune-up line of a courtesy-program customer's call carries the courtesy discount line owed on it.
      The deposit rate is 25 percent for a customer whose active Comfort Club tier schedules front of line, 35 percent for a customer whose active tier schedules with priority, and the class's special-order parts deposit percentage for every other customer.
      A customer whose closed Harbison installation carried a contract price of 12,000 dollars or more earns a deposit reduction of 10 points, one whose closed Harbison installation carried a lower contract price earns 5 points, and a customer with no closed Harbison installation earns no reduction.
      A customer whose active agreement shows two or more dues payments in the last 24 months earns a deposit reduction of 5 points, one with a single dues payment in that time earns 3 points, and any other customer earns no reduction; a payment is within the last 24 months while fewer than 24 whole calendar months have passed from its posting date to the date of handling.
      How the deposit reductions combine depends on how many Harbison products the customer holds among an active Comfort Club agreement, a closed Harbison installation, an active protection contract and an active FilterDirect subscription: with three or more, both reductions are taken off; with exactly two, only the larger reduction is taken off; with one or none, no reduction is taken off. The points so taken off reduce the deposit rate before it is applied, and the rate never falls below zero.
      For a member whose call concerns a unit with a completed Comfort Club tune-up on record, the deposit figured at that rate is multiplied by 0.75; for a member whose call concerns a unit with no completed Comfort Club tune-up on record, it is multiplied by 0.9; for any other customer it is taken as figured; the multiplication comes before the single rounding.
      An amount that falls exactly halfway between two cents is rounded up to the higher cent.
    prerequisite:
      - problem: service_ext_member_premium_discount
        kind: value_input
        gate: d_open
        form: state
        policy_source: >-
          The special-order deposit payment is taken only after the after-hours premium line on a member's call carries the member premium discount line owed on it.
        condition: >-
          For a customer with an active Comfort Club agreement, the call's after_hours_premium line is named as source by a member_premium_discount line among its service_lines.
        resolved_by: post_member_premium_discount_f1d91bca
        effect: >-
          The member premium discount lowers ticket_balance and so the visit balance d_open by the discount, and the release payment falls by the same amount.
      - problem: service_ext_courtesy_discount
        kind: value_input
        gate: d_open
        form: state
        policy_source: >-
          No special-order deposit payment is taken until the paid tune-up line of a courtesy-program customer's call carries the courtesy discount line owed on it.
        condition: >-
          For a customer enrolled in a courtesy program, the call's maintenance_tuneup line is named as source by a discount_program line among its service_lines.
        resolved_by: post_courtesy_discount_1179d4e9
        effect: >-
          The courtesy discount lowers ticket_balance and so the visit balance d_open by the discount, and the release payment falls by the same amount.
    cross_category:
      - category: plan
        as: history
        reads: [status, scheduling_priority, plan_service_entries.equipment_id, plan_billing_entries.line_type]
        note: The deposit rate reads the active tier's scheduling priority, the dues points count dues payments over 24 months and the unit multiplier checks the call's unit for completed tune-ups.
      - category: install
        as: branch
        reads: [status, contract_price]
        note: The installation points read the contract price of the customer's closed Harbison installation.
      - category: warranty
        as: branch
        reads: [status]
        note: The product count behind the reduction combination reads whether the customer holds an active protection contract.
      - category: filter
        as: existence
        reads: [status]
        note: The product count behind the reduction combination reads whether the customer holds an active FilterDirect subscription.
    compute:
      - plan_active: "CFIELD('plan','status') == 'active'"
      - d_parts: "SUM('service_lines','amount', line_type='repair_parts')"
      - d_labor: "SUM('service_lines','amount', line_type='repair_labor')"
      - d_repair_disc: "SUM('service_lines','amount', line_type='member_repair_discount')"
      - d_charges: "SUM('service_lines','amount', event_type='service_charge')"
      - d_credits: "SUM('service_lines','amount', event_type='service_discount') + SUM('service_lines','amount', event_type='service_coverage_credit') + SUM('service_lines','amount', event_type='service_payment')"
      - d_refunds: "SUM('service_lines','amount', event_type='service_refund')"
      - d_open: "MX(0, (d_charges - d_credits + d_refunds) - (d_parts + d_labor - d_repair_disc))"
      - d_priority: "CPARAM('plan','scheduling_priority')"
      - d_rate: "K('rate_front') if (plan_active and d_priority == 'front_of_line') else (K('rate_priority') if (plan_active and d_priority == 'priority') else P('special_order_parts_deposit_pct'))"
      - d_install_price: "CFIELD('install','contract_price', status='closed')"
      - d_install_off: "K('install_off_premium') if (d_install_price or 0) >= K('premium_install_price') else (K('install_off_other') if (d_install_price or 0) > 0 else 0)"
      - d_dues_paid: "XCOUNT('plan','plan_billing_entries', within_months=K('dues_window_months'), date_field='posted_date', line_type='dues_payment')"
      - d_dues_off: "K('dues_off_regular') if (plan_active and d_dues_paid >= 2) else (K('dues_off_single') if (plan_active and d_dues_paid == 1) else 0)"
      - d_products: "(1 if plan_active else 0) + (1 if EXISTS('install', status='closed') else 0) + (1 if EXISTS('warranty', status='active') else 0) + (1 if EXISTS('filter', status='active') else 0)"
      - d_off: "(d_install_off + d_dues_off) if d_products >= K('products_full') else (max(d_install_off, d_dues_off) if d_products == K('products_two') else 0)"
      - d_pct: "MX(0, d_rate - d_off)"
      - d_unit_visits: "XCOUNT('plan','plan_service_entries', event_type='plan_tuneup_visit', equipment_id=F('equipment_id'), entry_reason='completed_visit')"
      - d_mult: "K('unit_mult_enrolled') if (plan_active and d_unit_visits > 0) else (K('unit_mult_other') if plan_active else 1)"
      - d_deposit: "RND(d_parts * d_pct / 100 * d_mult + K('half_up_nudge'), 2)"
      - result: "RND(d_open + d_deposit, 2)"
    compute_basis:
      plan_active: "35 percent for a customer whose active tier schedules with priority"
      d_parts: "The special-order deposit is the repair's parts amount as billed, before any discount, multiplied by the deposit rate"
      d_labor: "The visit balance is worked out from the invoice lines: the call's charge lines, less its discount, coverage-credit and payment lines, plus its refund lines, with the repair's parts and labor lines and their member repair discounts set aside; it is never less than zero."
      d_repair_disc: "The visit balance is worked out from the invoice lines: the call's charge lines, less its discount, coverage-credit and payment lines, plus its refund lines, with the repair's parts and labor lines and their member repair discounts set aside; it is never less than zero."
      d_open: "The visit balance is worked out from the invoice lines: the call's charge lines, less its discount, coverage-credit and payment lines, plus its refund lines, with the repair's parts and labor lines and their member repair discounts set aside; it is never less than zero."
      d_charges: "the call's charge lines, less its discount, coverage-credit and payment lines, plus its refund lines"
      d_credits: "less its discount, coverage-credit and payment lines"
      d_refunds: "plus its refund lines"
      d_priority: "The deposit rate is 25 percent for a customer whose active Comfort Club tier schedules front of line"
      d_rate: "The deposit rate is 25 percent for a customer whose active Comfort Club tier schedules front of line, 35 percent for a customer whose active tier schedules with priority, and the class's special-order parts deposit percentage for every other customer."
      d_install_price: "A customer whose closed Harbison installation carried a contract price of 12,000 dollars or more earns a deposit reduction of 10 points"
      d_install_off: "A customer whose closed Harbison installation carried a contract price of 12,000 dollars or more earns a deposit reduction of 10 points, one whose closed Harbison installation carried a lower contract price earns 5 points, and a customer with no closed Harbison installation earns no reduction."
      d_dues_paid: "a payment is within the last 24 months while fewer than 24 whole calendar months have passed from its posting date to the date of handling."
      d_dues_off: "A customer whose active agreement shows two or more dues payments in the last 24 months earns a deposit reduction of 5 points, one with a single dues payment in that time earns 3 points, and any other customer earns no reduction"
      d_products: "How the deposit reductions combine depends on how many Harbison products the customer holds among an active Comfort Club agreement, a closed Harbison installation, an active protection contract and an active FilterDirect subscription"
      d_off: "with three or more, both reductions are taken off; with exactly two, only the larger reduction is taken off; with one or none, no reduction is taken off."
      d_pct: "The points so taken off reduce the deposit rate before it is applied, and the rate never falls below zero."
      d_unit_visits: "For a member whose call concerns a unit with a completed Comfort Club tune-up on record, the deposit figured at that rate is multiplied by 0.75"
      d_mult: "For a member whose call concerns a unit with a completed Comfort Club tune-up on record, the deposit figured at that rate is multiplied by 0.75; for a member whose call concerns a unit with no completed Comfort Club tune-up on record, it is multiplied by 0.9; for any other customer it is taken as figured; the multiplication comes before the single rounding."
      d_deposit: "The special-order deposit is the repair's parts amount as billed, before any discount, multiplied by the deposit rate, rounded once to the cent half up"
      result: "the release payment is the visit balance plus the special-order deposit."
    factors:
      - id: deposit_rate_by_scheduling
        effect: parameter
        decides: d_rate
        bindings: [d_priority, d_rate]
        ladder:
          - when: "active Comfort Club tier scheduling front of line"
            value: "K('rate_front') = 25 percent"
          - when: "active Comfort Club tier scheduling with priority"
            value: "K('rate_priority') = 35 percent"
          - when: "otherwise"
            value: "P('special_order_parts_deposit_pct') = 50 percent"
        baseline:
          d_rate: "P('special_order_parts_deposit_pct')"
        evidence: [cross_category, tier_param]
        cross_difficulty: plan
      - id: installation_price_points
        effect: parameter
        decides: d_install_off
        bindings: [d_install_price, d_install_off]
        ladder:
          - when: "closed Harbison installation with a contract price of 12,000 dollars or more"
            value: "K('install_off_premium') = 10 points off"
          - when: "closed Harbison installation with a lower contract price"
            value: "K('install_off_other') = 5 points off"
          - when: "otherwise"
            value: "nothing off"
        baseline:
          d_install_off: "0"
        evidence: [cross_category]
        cross_difficulty: install
      - id: dues_payment_history_points
