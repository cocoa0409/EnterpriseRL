- id: install_ext_contract_deposit
  base_policy_refs:
  - install_deposit_and_payment
  - install_financing_link
  overwrite:
  - base_policy: install_deposit_and_payment
    superseded_clause: takes a deposit at signing of deposit_pct of the contract price or deposit_min_usd, whichever is higher, rounded to the cent half up
    replaced_by: The contract deposit is the higher of deposit_min_usd and deposit_pct of the contract's net price, which is the contract-price charge plus every accessory charge, less every member install credit, accessory member discount, manufacturer rebate and multi-system discount posted on the project, rounded to the cent half up.
  trigger: on_request
  subject:
  - install_payment
  computes: amount
  target_tool: pay_contract_deposit_7afff78b
  params:
    dp_premier_member_pct: 8
    dp_member_pct: 12
    dp_upkeep_window_months: 12
    dp_no_upkeep_factor: 1.0
    dp_total_upgrade_share_pct: 100
    dp_other_upgrade_share_pct: 50
    dp_premium_iaq_usd: 1200.0
    dp_premium_iaq_share_pct: 100
    dp_iaq_share_pct: 50
    dp_kept_visits_high: 4
    dp_kept_visits_low: 2
    dp_high_upkeep_factor: 0.85
    dp_low_upkeep_factor: 0.92
  rule: 'A project not financed for its full contract price takes a contract deposit worked out under this rule, and a project whose approved financing covers the full contract price takes no deposit. The contract deposit is the higher of deposit_min_usd and deposit_pct of the contract''s net price, which is the contract-price charge plus every accessory charge, less every member install credit, accessory member discount, manufacturer rebate and multi-system discount posted on the project, rounded to the cent half up. The deposit rate follows the homeowner''s Comfort Club agreement: an agreement in active status on the Comfort Club Platinum, Comfort Club Platinum Plus or Comfort Club Total Home tier pays dp_premier_member_pct percent of the net price in place of deposit_pct, an agreement in active status on any other tier pays dp_member_pct percent, and a homeowner with no agreement in active status pays deposit_pct. The seasonal-upkeep factor of the contract deposit counts only tune-up visits completed on the Comfort Club agreement, never a visit forfeited for a missed or late-cancelled appointment, and counts them in one of three ways: for an agreement in active status billed annually, the completed tune-up visits of its current agreement term, from its term_start; for an agreement in active status billed monthly, the completed tune-up visits in the dp_upkeep_window_months months before the date of handling; for a homeowner with no agreement in active status, no visits are counted and the factor is dp_no_upkeep_factor. On that count, dp_kept_visits_high or more completed visits multiply the percentage deposit by dp_high_upkeep_factor, at least dp_kept_visits_low but fewer than dp_kept_visits_high multiply it by dp_low_upkeep_factor, and fewer than dp_kept_visits_low keep dp_no_upkeep_factor. The protection-upgrade share of the contract deposit collects part of any labor-warranty upgrade charged on the contract: an upgrade to the Harbison 12-Year Total Protection or the Harbison 12-Year Total Protection Plus is collected at dp_total_upgrade_share_pct percent of its charge, an upgrade to any other protection tier at dp_other_upgrade_share_pct percent, and a contract with no upgrade adds nothing. The air-quality accessory share of the contract deposit collects special-order air-quality accessories with the deposit, taken on the total of every uv_germicidal_light, media_air_cleaner and steam_humidifier charge on the contract: a total of dp_premium_iaq_usd or more is collected at dp_premium_iaq_share_pct percent, a total above zero but below dp_premium_iaq_usd at dp_iaq_share_pct percent, and a contract with none of those accessories adds nothing. The contract deposit is worked out in this order: the deposit rate is applied to the net price, that amount is multiplied by the seasonal-upkeep factor and rounded to the cent half up, and the higher of it and deposit_min_usd is taken; the protection-upgrade share and the air-quality accessory share, each rounded to the cent half up, are then added. The contract deposit is fixed only after the project ledger carries the Comfort Club member install credit owed on the contract-price charge. The contract deposit is not worked out until the accessories charged on the contract carry the accessory member discount owed on them.'
  prerequisite:
  - problem: install_ext_member_install_credit
    kind: value_input
    gate: dp_member_credit
    form: state
    policy_source: The contract deposit is fixed only after the project ledger carries the Comfort Club member install credit owed on the contract-price charge.
    condition: For a homeowner whose Comfort Club agreement was active on the contract's signed_date, the project's install_ledger carries an install_credit entry of line_type member_install_credit naming the contract-price charge.
    resolved_by: post_member_install_credit_c2d484b0
    effect: The member install credit enters dp_member_credit, lowering the net price (dp_net_price) on which the deposit rate acts, so the percentage deposit falls accordingly.
  - problem: install_ext_accessory_member_discount
    kind: value_input
    gate: dp_acc_discount
    form: state
    policy_source: The contract deposit is not worked out until the accessories charged on the contract carry the accessory member discount owed on them.
    condition: Where the project carries install_charge entries of line_type accessory and the homeowner's Comfort Club agreement is in active status, the project carries an install_credit entry of line_type accessory_member_discount naming its highest-priced accessory charge.
    resolved_by: post_accessory_member_discount_3312a288
    effect: The accessory member discount enters dp_acc_discount, lowering the net price (dp_net_price) on which the deposit rate acts.
  cross_category:
  - category: plan
    as: history
    reads:
    - status
    - variant_name
    - billing_frequency
    - term_start
    - plan_service_entries.event_type
    - plan_service_entries.entry_reason
    - plan_service_entries.entry_date
    - plan_service_entries.term_start
    note: The deposit rate and the seasonal-upkeep counting method are decided from the Comfort Club agreement and its tune-up history.
  compute:
  - dp_price: SUM('install_ledger', 'amount', event_type='install_charge', line_type='contract_price')
  - dp_acc_charge: SUM('install_ledger', 'amount', event_type='install_charge', line_type='accessory')
  - dp_member_credit: SUM('install_ledger', 'amount', event_type='install_credit', line_type='member_install_credit')
  - dp_acc_discount: SUM('install_ledger', 'amount', event_type='install_credit', line_type='accessory_member_discount')
  - dp_rebate: SUM('install_ledger', 'amount', event_type='install_credit', line_type='manufacturer_rebate')
  - dp_multi: SUM('install_ledger', 'amount', event_type='install_credit', line_type='multi_system_discount')
  - dp_net_price: dp_price + dp_acc_charge - dp_member_credit - dp_acc_discount - dp_rebate - dp_multi
  - dp_status: CFIELD('plan', 'status')
  - dp_tier: CFIELD('plan', 'variant_name')
  - dp_pct: K('dp_premier_member_pct') if (dp_status == 'active' and (dp_tier == 'Comfort Club Platinum' or dp_tier == 'Comfort Club Platinum Plus' or dp_tier == 'Comfort Club Total Home')) else (K('dp_member_pct') if (dp_status == 'active' and dp_tier != 'Comfort Club Platinum' and dp_tier != 'Comfort Club Platinum Plus' and dp_tier != 'Comfort Club Total Home') else P('deposit_pct'))
  - dp_billing: CFIELD('plan', 'billing_frequency')
  - dp_term_start: CFIELD('plan', 'term_start')
  - dp_term_visits: XCOUNT('plan', 'plan_service_entries', event_type='plan_tuneup_visit', entry_reason='completed_visit', term_start=dp_term_start)
  - dp_rolling_visits: XCOUNT('plan', 'plan_service_entries', within_months=K('dp_upkeep_window_months'), date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit')
  - dp_upkeep: (K('dp_high_upkeep_factor') if dp_term_visits >= K('dp_kept_visits_high') else (K('dp_low_upkeep_factor') if dp_term_visits >= K('dp_kept_visits_low') else K('dp_no_upkeep_factor'))) if (dp_status == 'active' and dp_billing == 'annual') else ((K('dp_high_upkeep_factor') if dp_rolling_visits >= K('dp_kept_visits_high') else (K('dp_low_upkeep_factor') if dp_rolling_visits >= K('dp_kept_visits_low') else K('dp_no_upkeep_factor'))) if (dp_status == 'active' and dp_billing == 'monthly') else K('dp_no_upkeep_factor'))
  - dp_pct_amount: MX(P('deposit_min_usd'), RND(dp_net_price * dp_pct / 100 * dp_upkeep + 0.000001, 2))
  - dp_upgrade_name: LATEST('install_ledger', 'upgrade_variant_name', date_field='posted_date', event_type='install_charge', line_type='labor_warranty_upgrade')
  - dp_upgrade_charge: SUM('install_ledger', 'amount', event_type='install_charge', line_type='labor_warranty_upgrade')
  - dp_upgrade_share: RND(dp_upgrade_charge * K('dp_total_upgrade_share_pct') / 100 + 0.000001, 2) if (dp_upgrade_name == 'Harbison 12-Year Total Protection' or dp_upgrade_name == 'Harbison 12-Year Total Protection Plus') else (RND(dp_upgrade_charge * K('dp_other_upgrade_share_pct') / 100 + 0.000001, 2) if (dp_upgrade_name != None and dp_upgrade_name != '') else 0)
  - dp_iaq_total: SUM('install_ledger', 'amount', event_type='install_charge', line_type='accessory', accessory_code='uv_germicidal_light') + SUM('install_ledger', 'amount', event_type='install_charge', line_type='accessory', accessory_code='media_air_cleaner') + SUM('install_ledger', 'amount', event_type='install_charge', line_type='accessory', accessory_code='steam_humidifier')
  - dp_iaq_share: RND(dp_iaq_total * K('dp_premium_iaq_share_pct') / 100 + 0.000001, 2) if dp_iaq_total >= K('dp_premium_iaq_usd') else (RND(dp_iaq_total * K('dp_iaq_share_pct') / 100 + 0.000001, 2) if dp_iaq_total > 0 else 0)
  - result: RND(dp_pct_amount + dp_upgrade_share + dp_iaq_share + 0.000001, 2)
  compute_basis:
    dp_price: The contract deposit is the higher of deposit_min_usd and deposit_pct of the contract's net price, which is the contract-price charge plus every accessory charge, less every member install credit, accessory member discount, manufacturer rebate and multi-system discount posted on the project, rounded to the cent half up.
    dp_acc_charge: The contract deposit is the higher of deposit_min_usd and deposit_pct of the contract's net price, which is the contract-price charge plus every accessory charge, less every member install credit, accessory member discount, manufacturer rebate and multi-system discount posted on the project, rounded to the cent half up.
