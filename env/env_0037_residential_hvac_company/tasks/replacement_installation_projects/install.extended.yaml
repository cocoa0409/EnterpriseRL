events:
  - type: install_contract
    target: install_projects
    mutation: create
    meaning: A homeowner signs a replacement-system installation contract.
    grain: One row per contract signed.
    fields:
      install_id: Reference number assigned to the project.
      customer_id: Homeowner.
      variant_name: Package contracted.
      signed_date: Date of signing (the date of handling).
      sale_channel: Where the contract was signed.
      municipality: Permitting jurisdiction of the address.
      nominal_tons: Capacity contracted.
      contract_price: Package price under install_contract_pricing.
      replaced_equipment_id: Unit being replaced.
      finance_account_id: Financing account funding the project, else empty.
    triggers:
      - event: install:install_charge
        map: {install_id: install_id, customer_id: customer_id, line_type: contract_price, amount: contract_price}

  - type: install_schedule
    target: install_projects
    mutation: {transition: {from: signed, to: scheduled}}
    meaning: The permit is pulled and the installation day is booked.
    grain: One row per transaction.
    fields:
      install_id: Project scheduled.
      status: Set to scheduled.
      scheduled_date: Installation day.
      permit_number: Permit number issued.
    triggers:
      - event: install:install_charge
        map: {install_id: install_id, line_type: permit_fee}

  - type: install_complete
    target: install_projects
    mutation: {transition: {from: scheduled, to: installed}}
    meaning: The crew completes the installation and starts the system up.
    grain: One row per transaction.
    fields:
      install_id: Project installed.
      customer_id: Homeowner.
      status: Set to installed.
      installed_date: Date of completion.
      new_equipment_serial: Serial number of the new unit.
      finance_account_id: Financing account funding the project, if any.
    triggers:
      - event: warranty:warranty_register
        map: {customer_id: customer_id, install_id: install_id, variant_name: Harbison 2-Year Workmanship Warranty, purchase_channel: with_installation, contract_price: 0.0}
      - event: finance:finance_fund
        when: {finance_account_id: {not: ""}}
        map: {finance_account_id: finance_account_id}

  - type: install_inspect
    target: install_projects
    mutation: {transition: {from: installed, to: inspected}}
    meaning: The municipal mechanical inspection passes.
    grain: One row per transaction.
    fields:
      install_id: Project inspected.
      status: Set to inspected.
      inspected_date: Date the inspection passed.
    triggers: []

  - type: install_close
    target: install_projects
    mutation: {transition: {from: inspected, to: closed}}
    meaning: The project balance is settled and the project is closed out.
    grain: One row per transaction.
    fields:
      install_id: Project closed.
      status: Set to closed.
      closed_date: Date of close-out.
    triggers: []

  - type: install_cancel
    target: install_projects
    mutation:
      transition:
        - {from: signed, to: cancelled}
        - {from: scheduled, to: cancelled}
    meaning: The homeowner's confirmed cancellation of the contract takes effect.
    grain: One row per transaction.
    fields:
      install_id: Project cancelled.
      status: Set to cancelled.
      cancelled_date: Date the cancellation takes effect.
    triggers: []

  - type: install_charge
    target: install_ledger
    meaning: An amount is billed on the project - the package, a change order, the permit, a protection upgrade, an accessory or a cancellation fee.
    grain: One row per charge; change orders by number, accessories by code, upgrades by tier.
    distinguish_by: [line_type, change_order_no, accessory_code, upgrade_variant_name]
    fields:
      install_id: Project billed.
      customer_id: Homeowner billed.
      line_type: contract_price, change_order, permit_fee, labor_warranty_upgrade, accessory or cancellation_fee.
      change_order_no: Change order number for change orders, else 0.
      accessory_code: Accessory billed, else empty.
      upgrade_variant_name: Protection tier bought, else empty.
      amount: Amount billed.
      posted_date: Date posted.
    account: project_balance
    direction: in
    triggers: []

  - type: install_credit
    target: install_ledger
    meaning: A credit reduces what the homeowner owes on the project.
    grain: One row per credit kind per charge it applies to.
    distinguish_by: [line_type, source_entry_id, claim_id]
    fields:
      install_id: Project credited.
      customer_id: Homeowner.
      line_type: member_install_credit, manufacturer_rebate, accessory_member_discount, multi_system_discount, cancellation_credit or warranty_unit_replacement_credit.
      accessory_code: Accessory discounted, else empty.
      amount: Amount credited.
      posted_date: Date posted.
      source_entry_id: The charge the credit applies to.
      claim_id: Protection claim paying a unit replacement, else empty.
    account: project_balance
    direction: out
    triggers: []

  - type: install_payment
    target: install_ledger
    meaning: The homeowner or the lender pays toward the project.
    grain: One row per payment received.
    distinguish_by: [payment_reference]
    fields:
      install_id: Project paid.
      customer_id: Homeowner.
      line_type: deposit, progress_payment, final_payment or financing_disbursement.
      amount: Amount paid.
      posted_date: Date posted.
      payment_method: card, ach, check or financing.
      payment_reference: Confirmation, check number or lender funding reference.
      finance_account_id: Financing account of a disbursement, else empty.
    account: project_balance
    direction: out
    triggers: []

  - type: install_refund
    target: install_ledger
    meaning: Money paid on the project is returned, to the homeowner or to the lender.
    grain: One row per refund, tied to the payment it returns.
    distinguish_by: [source_entry_id]
    fields:
      install_entry_id: Reference number of this refund entry.
      install_id: Project refunded.
      customer_id: Homeowner.
      line_type: Always refund.
      amount: Amount returned.
      posted_date: Date posted.
      payment_method: Method of the payment being returned.
      payment_reference: Refund confirmation.
      finance_account_id: Financing account a lender refund returns to, else empty.
      source_entry_id: The payment being returned.
    account: project_balance
    direction: in
    triggers:
      - event: finance:finance_adjustment
        when: {payment_method: financing}
        map: {finance_account_id: finance_account_id, customer_id: customer_id, install_id: install_id, install_entry_id: install_entry_id, amount: amount, line_type: merchant_refund_credit}

  - type: install_mfr_registration
    target: install_ledger
    meaning: Harbison registers the new equipment with the manufacturer for its parts warranty.
    grain: One row per registered serial number.
    distinguish_by: [equipment_serial]
    fields:
      install_id: Project.
      customer_id: Homeowner.
      line_type: Always mfr_registration.
      amount: Always 0.00.
      posted_date: Date the registration was submitted.
      equipment_serial: Serial number registered.
      registered_parts_years: Parts term the registration confirms.
    triggers: []

measures:
  - id: install_msr_change_orders_total
    window: The project's whole life up to the date of handling.
    measure: Sum of amount over install_charge entries with line_type change_order on the project.
  - id: install_msr_payments_received
    window: The project's whole life up to the date of handling.
    measure: Sum of amount over install_payment entries on the project less install_refund entries returning them, kept separately for financing_disbursement payments and for all other payments.
  - id: install_msr_refundable_charges
    window: The project's whole life up to the date of handling.
    measure: Sum of amount over install_charge entries other than cancellation_fee, less every install_credit already applied to them.

policies:
  - id: install_agg_multi_holding
    subject: [install_contract]
    rule: >-
      A homeowner may hold more than one installation project, one per system replaced at the service address, and an address
      with an upstairs and a downstairs system commonly signs two at once; there is no per-customer cap. Each project is priced,
      paid, financed, cancelled and closed on its own.
    eligibility: []
    params:
      max_per_customer: null

  - id: install_agg_multi_system_discount
    subject: [install_credit, install_contract]
    rule: >-
      When a homeowner signs two or more installation contracts for the same service address on the same signed_date, the
      contract with the highest contract_price is the first system and every other contract signed that day receives a
      multi_system_discount of its own package's multi_system_discount_pct of its contract price, rounded to the cent half up and
      naming that contract's contract-price charge. The discount is posted once per qualifying contract. Contracts signed on
      different days never qualify, even when installed together, and a qualifying contract that is later cancelled keeps no
      discount because its charges are credited in full under the cancellation rules.
    eligibility:
      - id: same_day_signing
        applies_to: [install_credit]
        kind: authorization
        condition: When a homeowner signs two or more installation contracts for the same service address on the same signed_date
        evidence_fields: [install_projects.customer_id, install_projects.signed_date, install_projects.contract_price, install_projects.install_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_projects.install_id]
          action_bindings:
            install_projects.install_id: install_id
      - id: one_multi_system_discount
        applies_to: [install_credit]
        kind: dedup
        condition: The discount is posted once per qualifying contract.
        evidence_fields: [install_ledger.install_id, install_ledger.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_ledger.install_id]
          action_bindings:
            install_ledger.install_id: install_id
        dedup_contract:
          table: install_ledger
          mode: separate_record
          object_bindings: {install_id: install_id}
          duplicate_filters: {line_type: [multi_system_discount]}
          distinct_fields: []
    params:
      per_tier:
        Harbison Essential Series System: {discount_pct: "=multi_system_discount_pct"}
        Harbison Advantage Series System: {discount_pct: "=multi_system_discount_pct"}
        Harbison Performance Series System: {discount_pct: "=multi_system_discount_pct"}
        Harbison Performance Hybrid Heat Pump System: {discount_pct: "=multi_system_discount_pct"}
        Harbison Signature Series System: {discount_pct: "=multi_system_discount_pct"}
        Harbison Signature Elite Communicating System: {discount_pct: "=multi_system_discount_pct"}

  - id: install_contract_pricing
    subject: [install_contract, install_charge, install_schedule]
    rule: >-
      The contract price is the package's price for the contracted capacity: price_2_0_tons_usd, price_2_5_tons_usd,
      price_3_0_tons_usd, price_3_5_tons_usd, price_4_0_tons_usd or price_5_0_tons_usd, and no other capacity is sold. A proposal
      is signed at its quoted price only within proposal_validity_days of being written; after that it is re-priced from the
      current package prices. The price includes the equipment and specifications of the package (equipment_brand, cooling_seer2,
      furnace_afue_pct, heat_pump_hspf2, compressor_staging, blower_type, sound_rating_db, refrigerant_type, thermostat_included and
      filter_cabinet), removal and disposal where removal_and_disposal_included is true, the Manual J load calculation where
      load_calculation_included is true, the start-up commissioning report where commissioning_report_included is true, the
      surge protector where surge_protector_included is true, the humidifier where humidifier_included is true, the UV light where
      uv_light_included is true, the condensate pump where condensate_pump_included is true and the drain needs one, a new line set where
      line_set_replacement_included is true, and duct transitions up to duct_transition_allowance_ft linear feet. The municipal
      permit fee is billed as a separate permit_fee charge when the project is scheduled, at the fee for the project's
      municipality, where permit_required is true. A package whose heat_pump_included is true requires gas service at the
      address for its furnace.
    eligibility: []
    params:
      permit_fee_by_municipality:
        columbus: 112.00
        dublin: 135.00
        westerville: 95.00
        hilliard: 105.00
        grove_city: 90.00
        gahanna: 100.00
        upper_arlington: 125.00
        worthington: 110.00
        franklin_county_unincorporated: 85.00
        delaware_county_unincorporated: 80.00
      per_tier:
        Harbison Essential Series System: {p20: "=price_2_0_tons_usd", p25: "=price_2_5_tons_usd", p30: "=price_3_0_tons_usd", p35: "=price_3_5_tons_usd", p40: "=price_4_0_tons_usd", p50: "=price_5_0_tons_usd"}
        Harbison Advantage Series System: {p20: "=price_2_0_tons_usd", p25: "=price_2_5_tons_usd", p30: "=price_3_0_tons_usd", p35: "=price_3_5_tons_usd", p40: "=price_4_0_tons_usd", p50: "=price_5_0_tons_usd"}
        Harbison Performance Series System: {p20: "=price_2_0_tons_usd", p25: "=price_2_5_tons_usd", p30: "=price_3_0_tons_usd", p35: "=price_3_5_tons_usd", p40: "=price_4_0_tons_usd", p50: "=price_5_0_tons_usd"}
        Harbison Performance Hybrid Heat Pump System: {p20: "=price_2_0_tons_usd", p25: "=price_2_5_tons_usd", p30: "=price_3_0_tons_usd", p35: "=price_3_5_tons_usd", p40: "=price_4_0_tons_usd", p50: "=price_5_0_tons_usd"}
        Harbison Signature Series System: {p20: "=price_2_0_tons_usd", p25: "=price_2_5_tons_usd", p30: "=price_3_0_tons_usd", p35: "=price_3_5_tons_usd", p40: "=price_4_0_tons_usd", p50: "=price_5_0_tons_usd"}
        Harbison Signature Elite Communicating System: {p20: "=price_2_0_tons_usd", p25: "=price_2_5_tons_usd", p30: "=price_3_0_tons_usd", p35: "=price_3_5_tons_usd", p40: "=price_4_0_tons_usd", p50: "=price_5_0_tons_usd"}

  - id: install_change_orders
    subject: [install_charge]
    rule: >-
      Work beyond the package scope is billed only through a numbered change order: a new line set at line_set_change_order_usd
      where the package does not include one, duct modification beyond the allowance at duct_modification_per_ft_usd per linear
      foot, and other scope at the price written on the change order. A change order is billed only after the homeowner has
      confirmed a change_order_approval request for that change order number. Approving a change order is the homeowner's own
      decision; the agent records the request and the homeowner confirms it. Change orders are numbered from 1 in the order
      approved, and their total may not exceed change_order_max_pct of the contract price; work beyond that limit requires a new
      contract. A change order cannot be added once the project is installed, and a change order the homeowner declines is never
      billed.
    eligibility:
      - id: homeowner_approved_change_order
        applies_to: [install_charge]
        kind: authorization
        condition: A change order is billed only after the homeowner has confirmed a change_order_approval request for that change order number.
        evidence_fields: [install_change_requests.install_id, install_change_requests.change_order_no, install_change_requests.request_type, install_change_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_change_requests.install_id, install_change_requests.change_order_no]
          action_bindings:
            install_change_requests.install_id: install_id
            install_change_requests.change_order_no: change_order_no
    formula:
      change_order_cap: contract_price * change_order_max_pct / 100
      remaining_change_order_room: contract_price * change_order_max_pct / 100 - install_msr_change_orders_total
    measures: [install_msr_change_orders_total]
    params:
      per_tier:
        Harbison Essential Series System: {line_set: "=line_set_change_order_usd", duct_per_ft: "=duct_modification_per_ft_usd", max_pct: "=change_order_max_pct"}
        Harbison Advantage Series System: {line_set: "=line_set_change_order_usd", duct_per_ft: "=duct_modification_per_ft_usd", max_pct: "=change_order_max_pct"}
        Harbison Performance Series System: {line_set: "=line_set_change_order_usd", duct_per_ft: "=duct_modification_per_ft_usd", max_pct: "=change_order_max_pct"}
        Harbison Performance Hybrid Heat Pump System: {line_set: "=line_set_change_order_usd", duct_per_ft: "=duct_modification_per_ft_usd", max_pct: "=change_order_max_pct"}
        Harbison Signature Series System: {line_set: "=line_set_change_order_usd", duct_per_ft: "=duct_modification_per_ft_usd", max_pct: "=change_order_max_pct"}
        Harbison Signature Elite Communicating System: {line_set: "=line_set_change_order_usd", duct_per_ft: "=duct_modification_per_ft_usd", max_pct: "=change_order_max_pct"}

  - id: install_accessories_and_protection
    subject: [install_charge, install_credit]
    rule: >-
      Accessories not included in the package may be added at the accessory prices below as one accessory charge per accessory
      code; an accessory the package already includes is never billed, and the smart thermostat upgrade is offered only where
      smart_thermostat_upgrade_available is true. A Comfort Club member whose agreement is active on the date the accessory is
      added receives the tier's accessory_discount_pct on that accessory, posted as an accessory_member_discount naming the
      accessory charge and rounded to the cent half up. The package's included_labor_protection is issued at completion at no
      charge; a higher protection tier from labor_protection_upgrade_options may be added before installation as one
      labor_warranty_upgrade charge priced under the protection contract charter's installation price for that tier, scope and
      capacity, and only one upgrade tier may be bought per project.
    eligibility:
      - id: member_active_for_accessory_discount
        applies_to: [install_credit]
        kind: state
        condition: A Comfort Club member whose agreement is active on the date the accessory is added receives the tier's accessory_discount_pct on that accessory
        evidence_fields: [plan_agreements.agreement_id, plan_agreements.customer_id, plan_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.customer_id]
          action_bindings:
            plan_agreements.customer_id: customer_id
        state_contract:
          field: plan_agreements.status
          allowed: [active]
    params:
      accessory_prices:
        smart_thermostat_upgrade: 389.00
        whole_home_surge_protector: 295.00
        uv_germicidal_light: 849.00
        media_air_cleaner: 1195.00
        steam_humidifier: 2450.00
        condensate_pump: 289.00
      member_accessory_pct: "plan:accessory_discount_pct"
      per_tier:
        Harbison Essential Series System: {included_protection: "=included_labor_protection", upgrade_options: "=labor_protection_upgrade_options", thermostat_upgrade: "=smart_thermostat_upgrade_available"}
        Harbison Advantage Series System: {included_protection: "=included_labor_protection", upgrade_options: "=labor_protection_upgrade_options", thermostat_upgrade: "=smart_thermostat_upgrade_available"}
        Harbison Performance Series System: {included_protection: "=included_labor_protection", upgrade_options: "=labor_protection_upgrade_options", thermostat_upgrade: "=smart_thermostat_upgrade_available"}
        Harbison Performance Hybrid Heat Pump System: {included_protection: "=included_labor_protection", upgrade_options: "=labor_protection_upgrade_options", thermostat_upgrade: "=smart_thermostat_upgrade_available"}
        Harbison Signature Series System: {included_protection: "=included_labor_protection", upgrade_options: "=labor_protection_upgrade_options", thermostat_upgrade: "=smart_thermostat_upgrade_available"}
        Harbison Signature Elite Communicating System: {included_protection: "=included_labor_protection", upgrade_options: "=labor_protection_upgrade_options", thermostat_upgrade: "=smart_thermostat_upgrade_available"}

  - id: install_deposit_and_payment
    subject: [install_payment, install_close]
    rule: >-
      A project not financed for its full contract price takes a deposit at signing of deposit_pct of the contract price or
      deposit_min_usd, whichever is higher, rounded to the cent half up; a project whose approved financing covers the full
      contract price takes no deposit. The remaining balance is due final_payment_due_days after installed_date, and 0 means on
      the installation day; a financed project's balance is paid by the lender's disbursement, which posts as a
      financing_disbursement payment naming the financing account, and the homeowner pays any part of the balance the
      financing does not cover. Payments are applied to the oldest charge first. A project closes only once it is inspected and
      its project_balance is 0.00; a project balance owing after inspection keeps the project in inspected status until paid.
    eligibility: []
    formula:
      deposit_due: max(deposit_min_usd, round(contract_price * deposit_pct / 100, 2))
    params:
      per_tier:
        Harbison Essential Series System: {deposit_pct: "=deposit_pct", deposit_min: "=deposit_min_usd", final_due_days: "=final_payment_due_days"}
        Harbison Advantage Series System: {deposit_pct: "=deposit_pct", deposit_min: "=deposit_min_usd", final_due_days: "=final_payment_due_days"}
        Harbison Performance Series System: {deposit_pct: "=deposit_pct", deposit_min: "=deposit_min_usd", final_due_days: "=final_payment_due_days"}
        Harbison Performance Hybrid Heat Pump System: {deposit_pct: "=deposit_pct", deposit_min: "=deposit_min_usd", final_due_days: "=final_payment_due_days"}
        Harbison Signature Series System: {deposit_pct: "=deposit_pct", deposit_min: "=deposit_min_usd", final_due_days: "=final_payment_due_days"}
        Harbison Signature Elite Communicating System: {deposit_pct: "=deposit_pct", deposit_min: "=deposit_min_usd", final_due_days: "=final_payment_due_days"}

  - id: install_rescission
    subject: [install_cancel, install_credit, install_refund]
    rule: >-
      Cancelling an installation contract is the homeowner's own decision: the agent records a cancellation request and the
      homeowner confirms it, and the cancellation takes effect when it is confirmed. A cancellation takes effect only once the
      homeowner has confirmed a cancellation request on the project. A contract signed in an in-home consultation is a home
      solicitation sale that the homeowner may cancel for a full refund within the statutory cancellation period. The full-refund
      cancellation applies only when the homeowner gives notice of cancellation no later than rescission_business_days business
      days after the contract was signed. Business days are every calendar day except Sundays and federal public holidays, counted
      from the day after the signed_date, and notice received at any time through the end of the last such day is timely. Within
      the period every charge on the project is credited in full by a cancellation_credit naming it, no cancellation fee is
      charged, and every payment is refunded, the lender's disbursement to the lender and every other payment to the method it
      came from. A contract signed in the showroom or by phone or web carries no statutory cancellation period, and its
      cancellation follows install_cancellation_after_rescission from the day it is signed. Equipment is not ordered and no
      installation is scheduled before an in-home contract's cancellation period has ended.
    eligibility:
      - id: homeowner_confirmed_cancellation
        applies_to: [install_cancel]
        kind: authorization
        condition: A cancellation takes effect only once the homeowner has confirmed a cancellation request on the project.
        evidence_fields: [install_change_requests.install_id, install_change_requests.request_type, install_change_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_change_requests.install_id]
          action_bindings:
            install_change_requests.install_id: install_id
      - id: within_cancellation_period
        applies_to: [install_credit, install_refund]
        kind: time
        condition: The full-refund cancellation applies only when the homeowner gives notice of cancellation no later than rescission_business_days business days after the contract was signed.
        evidence_fields: [install_projects.install_id, install_projects.signed_date, install_projects.sale_channel, install_change_requests.created_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_projects.install_id]
          action_bindings:
            install_projects.install_id: install_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract was signed
          anchor_source: install_projects.signed_date
          relation: not_after
          duration_source: variants.rescission_business_days
          unit: business_days
          counting_rule: Business days are every calendar day except Sundays and federal public holidays, counted from the day after the signed_date, and notice received at any time through the end of the last such day is timely.
          boundary: inclusive
    params:
      per_tier:
        Harbison Essential Series System: {rescission_days: "=rescission_business_days"}
        Harbison Advantage Series System: {rescission_days: "=rescission_business_days"}
        Harbison Performance Series System: {rescission_days: "=rescission_business_days"}
        Harbison Performance Hybrid Heat Pump System: {rescission_days: "=rescission_business_days"}
        Harbison Signature Series System: {rescission_days: "=rescission_business_days"}
        Harbison Signature Elite Communicating System: {rescission_days: "=rescission_business_days"}

  - id: install_cancellation_after_rescission
    subject: [install_cancel, install_charge, install_credit, install_refund]
    rule: >-
      A contract cancelled after its cancellation period has ended, or a showroom, phone or web contract cancelled at any time, is
      cancelled only while the project is signed or scheduled; once installed it can no longer be cancelled. A cancellation is
      accepted only while the project status is signed or scheduled. The cancellation charges a cancellation_fee of
      restocking_fee_pct of the contract price, rounded to the cent half up; every other charge on the project, including the
      permit fee once the permit is pulled, is credited by a cancellation_credit naming it, and member, rebate and multi-system
      credits already posted stay as they are only to the extent they do not exceed the charges they named. The homeowner's
      payments, then the lender's disbursement, are applied to the cancellation fee, and anything paid beyond it is refunded
      under install_refunds. A cancellation with nothing paid leaves the cancellation fee owing.
    eligibility:
      - id: cancel_before_installation
        applies_to: [install_cancel]
        kind: authorization
        condition: A cancellation is accepted only while the project status is signed or scheduled.
        evidence_fields: [install_projects.install_id, install_projects.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_projects.install_id]
          action_bindings:
            install_projects.install_id: install_id
    formula:
      cancellation_fee: round(contract_price * restocking_fee_pct / 100, 2)
    measures: [install_msr_refundable_charges]
    params:
      per_tier:
        Harbison Essential Series System: {restocking_pct: "=restocking_fee_pct"}
        Harbison Advantage Series System: {restocking_pct: "=restocking_fee_pct"}
        Harbison Performance Series System: {restocking_pct: "=restocking_fee_pct"}
        Harbison Performance Hybrid Heat Pump System: {restocking_pct: "=restocking_fee_pct"}
        Harbison Signature Series System: {restocking_pct: "=restocking_fee_pct"}
        Harbison Signature Elite Communicating System: {restocking_pct: "=restocking_fee_pct"}

  - id: install_member_credit
    subject: [install_credit]
    rule: >-
      A Comfort Club member receives the tier's install_credit_usd on a replacement installation contract, posted once as a
      member_install_credit naming the contract-price charge. The member credit applies only when the customer's Comfort Club
      agreement is in active status on the contract's signed_date; a pending, past_due, lapsed or cancelled agreement earns no
      credit, and enrolling or reinstating after signing does not earn it retroactively. The credit is given once per project,
      is not paid out in cash, and on a cancelled project it is reversed together with the charge it named. It stacks with the
      manufacturer rebate and the multi-system discount, all three applying to the contract price independently.
    eligibility:
      - id: member_active_on_signing
        applies_to: [install_credit]
        kind: state
        condition: The member credit applies only when the customer's Comfort Club agreement is in active status on the contract's signed_date
        evidence_fields: [plan_agreements.customer_id, plan_agreements.status, plan_agreements.agreement_id, install_projects.signed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [plan_agreements.agreement_id]
          action_bindings:
            plan_agreements.agreement_id: agreement_id
        state_contract:
          field: plan_agreements.status
          allowed: [active]
      - id: one_member_credit
        applies_to: [install_credit]
        kind: dedup
        condition: The credit is given once per project
        evidence_fields: [install_ledger.install_id, install_ledger.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_ledger.install_id]
          action_bindings:
            install_ledger.install_id: install_id
        dedup_contract:
          table: install_ledger
          mode: separate_record
          object_bindings: {install_id: install_id}
          duplicate_filters: {line_type: [member_install_credit]}
          distinct_fields: []
    params:
      member_install_credit: "plan:install_credit_usd"

  - id: install_manufacturer_rebate
    subject: [install_credit]
    rule: >-
      A package whose manufacturer_rebate_usd is above 0.00 earns that rebate as a manufacturer_rebate credit naming the
      contract-price charge. The rebate is credited only when the project's installed_date falls within the package's
      manufacturer_rebate_window, both end dates included, and it is posted on or after the installed_date, never at signing; a
      project signed inside the window but installed after it earns nothing, and one signed before the window but installed
      inside it qualifies. The rebate is posted once per project and is not available on a cancelled project.
    eligibility:
      - id: installed_in_window
        applies_to: [install_credit]
        kind: authorization
        condition: The rebate is credited only when the project's installed_date falls within the package's manufacturer_rebate_window, both end dates included
        evidence_fields: [install_projects.install_id, install_projects.installed_date, install_projects.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_projects.install_id]
          action_bindings:
            install_projects.install_id: install_id
    params:
      per_tier:
        Harbison Essential Series System: {rebate: "=manufacturer_rebate_usd", window: "=manufacturer_rebate_window"}
        Harbison Advantage Series System: {rebate: "=manufacturer_rebate_usd", window: "=manufacturer_rebate_window"}
        Harbison Performance Series System: {rebate: "=manufacturer_rebate_usd", window: "=manufacturer_rebate_window"}
        Harbison Performance Hybrid Heat Pump System: {rebate: "=manufacturer_rebate_usd", window: "=manufacturer_rebate_window"}
        Harbison Signature Series System: {rebate: "=manufacturer_rebate_usd", window: "=manufacturer_rebate_window"}
        Harbison Signature Elite Communicating System: {rebate: "=manufacturer_rebate_usd", window: "=manufacturer_rebate_window"}

  - id: install_scheduling_permit
    subject: [install_schedule, install_charge]
    rule: >-
      A project is scheduled once its permit is pulled, and the installation day may be no earlier than
      equipment_order_lead_business_days business days after the in-home cancellation period ends, or after the signed_date for a
      showroom, phone or web contract; business days here are Monday through Friday except federal public holidays. A financed
      project is scheduled only once its financing account is approved. A project whose financing is declined, withdrawn or
      expired is scheduled only after the homeowner pays the deposit required of an unfinanced project or arranges other
      approved financing. The crew needs install_days working days on site, and the permit fee posts when the project is
      scheduled.
    eligibility:
      - id: financing_approved
        applies_to: [install_schedule]
        kind: authorization
        condition: A financed project is scheduled only once its financing account is approved.
        evidence_fields: [finance_accounts.finance_account_id, finance_accounts.status, install_projects.finance_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.finance_account_id]
          action_bindings:
            finance_accounts.finance_account_id: finance_account_id
    params:
      per_tier:
        Harbison Essential Series System: {lead_business_days: "=equipment_order_lead_business_days", install_days: "=install_days", permit: "=permit_required"}
        Harbison Advantage Series System: {lead_business_days: "=equipment_order_lead_business_days", install_days: "=install_days", permit: "=permit_required"}
        Harbison Performance Series System: {lead_business_days: "=equipment_order_lead_business_days", install_days: "=install_days", permit: "=permit_required"}
        Harbison Performance Hybrid Heat Pump System: {lead_business_days: "=equipment_order_lead_business_days", install_days: "=install_days", permit: "=permit_required"}
        Harbison Signature Series System: {lead_business_days: "=equipment_order_lead_business_days", install_days: "=install_days", permit: "=permit_required"}
        Harbison Signature Elite Communicating System: {lead_business_days: "=equipment_order_lead_business_days", install_days: "=install_days", permit: "=permit_required"}

  - id: install_completion_and_registration
    subject: [install_complete, install_inspect, install_close, install_mfr_registration]
    rule: >-
      When the installation is completed, the Harbison 2-Year Workmanship Warranty is issued on the new equipment, together with
      the package's included_labor_protection where it is not none and any protection tier bought as a labor-warranty upgrade,
      each with purchase_channel with_installation; a financed project's lender funding is then requested. Harbison registers
      the new equipment with the manufacturer. A registration confirms the registered parts term only when it is submitted no
      later than mfr_registration_window_days calendar days after the installation was completed. Registration days are counted
      as calendar days with the installed_date as day 0, and a registration submitted on the last day qualifies. A timely
      registration records registered_parts_years of mfr_parts_years_registered; a registration submitted later records
      mfr_parts_years_unregistered, and with no registration the manufacturer's unregistered term applies. The replaced unit is
      marked replaced in the equipment register by the records team. The municipal inspection follows installation; a failed
      inspection is corrected at no charge and re-inspected, and the project closes once inspected with a zero balance.
    eligibility:
      - id: registration_window
        applies_to: [install_mfr_registration]
        kind: time
        condition: A registration confirms the registered parts term only when it is submitted no later than mfr_registration_window_days calendar days after the installation was completed.
        evidence_fields: [install_projects.install_id, install_projects.installed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_projects.install_id]
          action_bindings:
            install_projects.install_id: install_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the installation was completed
          anchor_source: install_projects.installed_date
          relation: not_after
          duration_source: variants.mfr_registration_window_days
          unit: calendar_days
          counting_rule: Registration days are counted as calendar days with the installed_date as day 0, and a registration submitted on the last day qualifies.
          boundary: inclusive
    params:
      per_tier:
        Harbison Essential Series System: {registered_years: "=mfr_parts_years_registered", unregistered_years: "=mfr_parts_years_unregistered", window_days: "=mfr_registration_window_days", included_protection: "=included_labor_protection"}
        Harbison Advantage Series System: {registered_years: "=mfr_parts_years_registered", unregistered_years: "=mfr_parts_years_unregistered", window_days: "=mfr_registration_window_days", included_protection: "=included_labor_protection"}
        Harbison Performance Series System: {registered_years: "=mfr_parts_years_registered", unregistered_years: "=mfr_parts_years_unregistered", window_days: "=mfr_registration_window_days", included_protection: "=included_labor_protection"}
        Harbison Performance Hybrid Heat Pump System: {registered_years: "=mfr_parts_years_registered", unregistered_years: "=mfr_parts_years_unregistered", window_days: "=mfr_registration_window_days", included_protection: "=included_labor_protection"}
        Harbison Signature Series System: {registered_years: "=mfr_parts_years_registered", unregistered_years: "=mfr_parts_years_unregistered", window_days: "=mfr_registration_window_days", included_protection: "=included_labor_protection"}
        Harbison Signature Elite Communicating System: {registered_years: "=mfr_parts_years_registered", unregistered_years: "=mfr_parts_years_unregistered", window_days: "=mfr_registration_window_days", included_protection: "=included_labor_protection"}

  - id: install_refunds
    subject: [install_refund, install_credit]
    rule: >-
      A refund is owed whenever the project_balance is negative after cancellation credits, other credits and fees. The lender's
      financing disbursement is returned first, to the financing account it came from, up to the amount disbursed, so that a
      financed homeowner's loan balance falls before any money is returned to the homeowner; any remainder is returned to the
      homeowner's own payments in reverse order of posting, each refund to the method of the payment it names and never more
      than that payment. A refund returned to the financing account reduces the loan as a merchant refund credit on that
      account. A refund is posted only for a payment that exists on the project. A warranty unit replacement credit from a
      protection contract claim reduces a replacement project's balance like any other credit and is never refunded in cash.
    eligibility:
      - id: refund_names_payment
        applies_to: [install_refund]
        kind: authorization
        condition: A refund is posted only for a payment that exists on the project.
        evidence_fields: [install_ledger.install_entry_id, install_ledger.install_id, install_ledger.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_ledger.install_entry_id]
          action_bindings:
            install_ledger.install_entry_id: source_entry_id
    measures: [install_msr_payments_received]

  - id: install_financing_link
    subject: [install_contract, install_payment]
    rule: >-
      A project may be financed only through a Home Comfort Financing plan listed in the package's eligible_financing_plans, and
      the amount financed may not exceed the contract price plus approved change orders, upgrades and accessories, less member,
      rebate and multi-system credits known at signing. A financing account linked to the project funds once, on the day the
      installation is completed, and the disbursement posts on the project as a financing_disbursement payment equal to the
      amount financed. A financing disbursement is posted only to a project that is installed. A project can carry only one
      financing account; switching plans happens on the financing account before funding, not on the project.
    eligibility:
      - id: plan_eligible_for_package
        applies_to: [install_contract]
        kind: authorization
        condition: A project may be financed only through a Home Comfort Financing plan listed in the package's eligible_financing_plans
        evidence_fields: [finance_accounts.finance_account_id, finance_accounts.variant_name, install_projects.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_accounts.finance_account_id]
          action_bindings:
            finance_accounts.finance_account_id: finance_account_id
      - id: disbursement_after_install
        applies_to: [install_payment]
        kind: state
        condition: A financing disbursement is posted only to a project that is installed.
        evidence_fields: [install_projects.install_id, install_projects.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [install_projects.install_id]
          action_bindings:
            install_projects.install_id: install_id
        state_contract:
          field: install_projects.status
          allowed: [installed, inspected, closed]
    params:
      per_tier:
        Harbison Essential Series System: {plans: "=eligible_financing_plans"}
        Harbison Advantage Series System: {plans: "=eligible_financing_plans"}
        Harbison Performance Series System: {plans: "=eligible_financing_plans"}
        Harbison Performance Hybrid Heat Pump System: {plans: "=eligible_financing_plans"}
        Harbison Signature Series System: {plans: "=eligible_financing_plans"}
        Harbison Signature Elite Communicating System: {plans: "=eligible_financing_plans"}


# ==========================================================================================
# extended_policies: the multi-factor calculation policies of replacement_installation_projects
# ==========================================================================================
extended_policies:
- id: install_ext_line_set_change_order_charge
  base_policy_refs:
  - install_contract_pricing
  - install_change_orders
  - install_accessories_and_protection
  - install_cancellation_after_rescission
  - install_scheduling_permit
  overwrite:
  - base_policy: install_change_orders
    superseded_clause: 'Work beyond the package scope is billed only through a numbered change order: a new line set at line_set_change_order_usd where the package does not include one, duct modification beyond the allowance at duct_modification_per_ft_usd per linear foot, and other scope at the price written on the change order.'
    replaced_by: 'Work beyond the package scope is billed only through a numbered change order: a new line set at the line-set change-order charge worked out under this rule, duct modification beyond the allowance at duct_modification_per_ft_usd per linear foot, and other scope at the price written on the change order.'
  trigger: state_due
  subject:
  - install_charge
  computes: amount
  target_tool: bill_change_order_a6215d22
  params:
    co_refrig_window_months: 24
    co_after_schedule_share_pct: 60
    co_after_signing_share_pct: 80
    co_standard_share_pct: 100
    co_loyal_terms: 5
    co_loyal_extra_pct: 5
    co_deferred_promo_fee_pct: 6
    co_equal_promo_fee_pct: 4
    co_admin_fee_second_usd: 45.0
    co_admin_fee_third_usd: 95.0
  rule: 'A new refrigerant line set that the package does not include is billed as a numbered change order, and the line-set change-order charge is the package''s line_set_change_order_usd, rounded to the cent half up. Work beyond the package scope is billed only through a numbered change order: a new line set at the line-set change-order charge worked out under this rule, duct modification beyond the allowance at duct_modification_per_ft_usd per linear foot, and other scope at the price written on the change order. The refrigerant-history credit on a line-set change order is worked out from the homeowner''s Harbison service calls in the co_refrig_window_months months before the date of handling: where those calls billed both a refrigerant_leak_search and refrigerant, the credit is the refrigerant_leak_search labor billed on them, since that search located the leak the new line set cures; where they billed refrigerant but no refrigerant_leak_search, the credit is the most recent refrigerant charge billed; where they billed no refrigerant, no refrigerant-history credit is given. The discovery share of a line-set change order depends on when the homeowner confirmed its change-order approval, the most recent change-order approval confirmed on the project: confirmed on or after the day the project was scheduled, which is the day its permit_fee charge was posted, the line-set change order is charged at co_after_schedule_share_pct percent; confirmed after the signed_date and before the project was scheduled, or on a project not yet scheduled, at co_after_signing_share_pct percent; confirmed on the signed_date itself, at co_standard_share_pct percent. The member change-order discount follows the homeowner''s Comfort Club agreement: an agreement in active status whose consecutive_terms are at least co_loyal_terms takes the tier''s accessory_discount_pct plus co_loyal_extra_pct percentage points off the line-set change order; an agreement in active status whose consecutive_terms are fewer than co_loyal_terms takes the tier''s accessory_discount_pct; a homeowner with no agreement in active status takes no member change-order discount. The promotional-financing fee on a line-set change order follows the financing account linked to the project: an account in approved or active status on the 12-Month Same-As-Cash Deferred Interest Plan adds co_deferred_promo_fee_pct percent, an account in approved or active status on the 18-Month 0% APR Equal Payment Plan or the 36-Month 0% APR Equal Payment Plan adds co_equal_promo_fee_pct percent, and a project with no account in approved or active status on one of those three plans adds no promotional-financing fee. The change-order administration fee on a line-set change order is set by the change-order charges already posted on the project: with two or more already posted it is co_admin_fee_third_usd, with exactly one already posted it is co_admin_fee_second_usd, and with none it is zero. The line-set change-order charge is worked out in this order: the refrigerant-history credit is taken off the package''s line_set_change_order_usd, never below zero; the amount left is then multiplied by the discovery share; that result is reduced by the member change-order discount, a percentage of that same result; the reduced amount is then increased by the promotional-financing fee, a percentage of the reduced amount; the change-order administration fee is added last, and only the final total is rounded to the cent half up. The line-set change order is charged once, under the change-order number the homeowner approved, and a change order the homeowner declined or withdrew is never charged.'
  prerequisite: []
  cross_category:
  - category: service
    as: history
    reads:
    - service_lines.amount
    - service_lines.line_type
    - service_lines.task_code
    - service_lines.posted_date
    note: The refrigerant-history credit method is chosen and computed from the leak-search and refrigerant charges on the homeowner's service calls.
  - category: plan
    as: branch
    reads:
    - status
    - consecutive_terms
    - accessory_discount_pct
    note: The member change-order discount tier is decided from the Comfort Club agreement's status and consecutive terms.
  - category: finance
    as: branch
    reads:
    - status
    - variant_name
    note: The promotional-financing fee tier is decided from the plan and status of the project's financing account.
  compute:
  - co_list_price: P('line_set_change_order_usd')
  - co_refrig_spend: XSUM('service', 'service_lines', 'amount', within_months=K('co_refrig_window_months'), date_field='posted_date', event_type='service_charge', line_type='refrigerant')
  - co_leak_labor: XSUM('service', 'service_lines', 'amount', within_months=K('co_refrig_window_months'), date_field='posted_date', event_type='service_charge', line_type='repair_labor', task_code='refrigerant_leak_search')
  - co_last_refrig: XLATEST('service', 'service_lines', 'amount', date_field='posted_date', event_type='service_charge', line_type='refrigerant')
  - co_refrig_credit: co_leak_labor if (co_leak_labor > 0 and co_refrig_spend > 0) else (co_last_refrig if (co_leak_labor <= 0 and co_refrig_spend > 0) else 0)
  - co_appr_date: LATEST('install_change_requests', 'created_at', date_field='created_at', request_type='change_order_approval', request_status='confirmed')
  - co_sched_date: LATEST('install_ledger', 'posted_date', date_field='posted_date', event_type='install_charge', line_type='permit_fee')
  - co_field_share: K('co_after_schedule_share_pct') if (co_sched_date != None and DAYS(co_sched_date, co_appr_date) >= 0) else (K('co_after_signing_share_pct') if DAYS(F('signed_date'), co_appr_date) > 0 else K('co_standard_share_pct'))
  - co_member_status: CFIELD('plan', 'status')
  - co_member_terms: CFIELD('plan', 'consecutive_terms')
  - co_member_pct: (CPARAM('plan', 'accessory_discount_pct') + K('co_loyal_extra_pct')) if (co_member_status == 'active' and co_member_terms >= K('co_loyal_terms')) else (CPARAM('plan', 'accessory_discount_pct') if (co_member_status == 'active' and co_member_terms < K('co_loyal_terms')) else 0)
  - co_fin_plan: CFIELD('finance', 'variant_name', install_id=HID)
  - co_fin_status: CFIELD('finance', 'status', install_id=HID)
  - co_fin_fee_pct: K('co_deferred_promo_fee_pct') if ((co_fin_status == 'approved' or co_fin_status == 'active') and co_fin_plan == '12-Month Same-As-Cash Deferred Interest Plan') else (K('co_equal_promo_fee_pct') if ((co_fin_status == 'approved' or co_fin_status == 'active') and (co_fin_plan == '18-Month 0% APR Equal Payment Plan' or co_fin_plan == '36-Month 0% APR Equal Payment Plan')) else 0)
  - co_prior_count: COUNT('install_ledger', event_type='install_charge', line_type='change_order')
  - co_admin_fee: K('co_admin_fee_third_usd') if co_prior_count >= 2 else (K('co_admin_fee_second_usd') if co_prior_count == 1 else 0)
  - co_after_credit: MX(0, co_list_price - co_refrig_credit)
  - co_after_share: co_after_credit * co_field_share / 100
  - co_after_member: co_after_share * (100 - co_member_pct) / 100
  - co_after_fee: co_after_member * (100 + co_fin_fee_pct) / 100
  - result: RND(co_after_fee + co_admin_fee + 0.000001, 2)
  compute_basis:
    co_list_price: A new refrigerant line set that the package does not include is billed as a numbered change order, and the line-set change-order charge is the package's line_set_change_order_usd, rounded to the cent half up.
    co_refrig_spend: 'The refrigerant-history credit on a line-set change order is worked out from the homeowner''s Harbison service calls in the co_refrig_window_months months before the date of handling: where those calls billed both a refrigerant_leak_search and refrigerant, the credit is the refrigerant_leak_search labor billed on them, since that search located the leak the new line set cures; where they billed refrigerant but no refrigerant_leak_search, the credit is the most recent refrigerant charge billed; where they billed no refrigerant, no refrigerant-history credit is given.'
    co_refrig_credit: 'The refrigerant-history credit on a line-set change order is worked out from the homeowner''s Harbison service calls in the co_refrig_window_months months before the date of handling: where those calls billed both a refrigerant_leak_search and refrigerant, the credit is the refrigerant_leak_search labor billed on them, since that search located the leak the new line set cures; where they billed refrigerant but no refrigerant_leak_search, the credit is the most recent refrigerant charge billed; where they billed no refrigerant, no refrigerant-history credit is given.'
    co_appr_date: 'The discovery share of a line-set change order depends on when the homeowner confirmed its change-order approval, the most recent change-order approval confirmed on the project: confirmed on or after the day the project was scheduled, which is the day its permit_fee charge was posted, the line-set change order is charged at co_after_schedule_share_pct percent; confirmed after the signed_date and before the project was scheduled, or on a project not yet scheduled, at co_after_signing_share_pct percent; confirmed on the signed_date itself, at co_standard_share_pct percent.'
    co_sched_date: 'The discovery share of a line-set change order depends on when the homeowner confirmed its change-order approval, the most recent change-order approval confirmed on the project: confirmed on or after the day the project was scheduled, which is the day its permit_fee charge was posted, the line-set change order is charged at co_after_schedule_share_pct percent; confirmed after the signed_date and before the project was scheduled, or on a project not yet scheduled, at co_after_signing_share_pct percent; confirmed on the signed_date itself, at co_standard_share_pct percent.'
    co_field_share: 'The discovery share of a line-set change order depends on when the homeowner confirmed its change-order approval, the most recent change-order approval confirmed on the project: confirmed on or after the day the project was scheduled, which is the day its permit_fee charge was posted, the line-set change order is charged at co_after_schedule_share_pct percent; confirmed after the signed_date and before the project was scheduled, or on a project not yet scheduled, at co_after_signing_share_pct percent; confirmed on the signed_date itself, at co_standard_share_pct percent.'
    co_member_status: 'The member change-order discount follows the homeowner''s Comfort Club agreement: an agreement in active status whose consecutive_terms are at least co_loyal_terms takes the tier''s accessory_discount_pct plus co_loyal_extra_pct percentage points off the line-set change order; an agreement in active status whose consecutive_terms are fewer than co_loyal_terms takes the tier''s accessory_discount_pct; a homeowner with no agreement in active status takes no member change-order discount.'
    co_member_terms: 'The member change-order discount follows the homeowner''s Comfort Club agreement: an agreement in active status whose consecutive_terms are at least co_loyal_terms takes the tier''s accessory_discount_pct plus co_loyal_extra_pct percentage points off the line-set change order; an agreement in active status whose consecutive_terms are fewer than co_loyal_terms takes the tier''s accessory_discount_pct; a homeowner with no agreement in active status takes no member change-order discount.'
    co_member_pct: 'The member change-order discount follows the homeowner''s Comfort Club agreement: an agreement in active status whose consecutive_terms are at least co_loyal_terms takes the tier''s accessory_discount_pct plus co_loyal_extra_pct percentage points off the line-set change order; an agreement in active status whose consecutive_terms are fewer than co_loyal_terms takes the tier''s accessory_discount_pct; a homeowner with no agreement in active status takes no member change-order discount.'
    co_fin_plan: 'The promotional-financing fee on a line-set change order follows the financing account linked to the project: an account in approved or active status on the 12-Month Same-As-Cash Deferred Interest Plan adds co_deferred_promo_fee_pct percent, an account in approved or active status on the 18-Month 0% APR Equal Payment Plan or the 36-Month 0% APR Equal Payment Plan adds co_equal_promo_fee_pct percent, and a project with no account in approved or active status on one of those three plans adds no promotional-financing fee.'
    co_fin_status: 'The promotional-financing fee on a line-set change order follows the financing account linked to the project: an account in approved or active status on the 12-Month Same-As-Cash Deferred Interest Plan adds co_deferred_promo_fee_pct percent, an account in approved or active status on the 18-Month 0% APR Equal Payment Plan or the 36-Month 0% APR Equal Payment Plan adds co_equal_promo_fee_pct percent, and a project with no account in approved or active status on one of those three plans adds no promotional-financing fee.'
    co_fin_fee_pct: 'The promotional-financing fee on a line-set change order follows the financing account linked to the project: an account in approved or active status on the 12-Month Same-As-Cash Deferred Interest Plan adds co_deferred_promo_fee_pct percent, an account in approved or active status on the 18-Month 0% APR Equal Payment Plan or the 36-Month 0% APR Equal Payment Plan adds co_equal_promo_fee_pct percent, and a project with no account in approved or active status on one of those three plans adds no promotional-financing fee.'
    co_prior_count: 'The change-order administration fee on a line-set change order is set by the change-order charges already posted on the project: with two or more already posted it is co_admin_fee_third_usd, with exactly one already posted it is co_admin_fee_second_usd, and with none it is zero.'
    co_admin_fee: 'The change-order administration fee on a line-set change order is set by the change-order charges already posted on the project: with two or more already posted it is co_admin_fee_third_usd, with exactly one already posted it is co_admin_fee_second_usd, and with none it is zero.'
    co_after_credit: 'The line-set change-order charge is worked out in this order: the refrigerant-history credit is taken off the package''s line_set_change_order_usd, never below zero; the amount left is then multiplied by the discovery share; that result is reduced by the member change-order discount, a percentage of that same result; the reduced amount is then increased by the promotional-financing fee, a percentage of the reduced amount; the change-order administration fee is added last, and only the final total is rounded to the cent half up.'
    co_after_share: 'The line-set change-order charge is worked out in this order: the refrigerant-history credit is taken off the package''s line_set_change_order_usd, never below zero; the amount left is then multiplied by the discovery share; that result is reduced by the member change-order discount, a percentage of that same result; the reduced amount is then increased by the promotional-financing fee, a percentage of the reduced amount; the change-order administration fee is added last, and only the final total is rounded to the cent half up.'
    co_after_member: 'The line-set change-order charge is worked out in this order: the refrigerant-history credit is taken off the package''s line_set_change_order_usd, never below zero; the amount left is then multiplied by the discovery share; that result is reduced by the member change-order discount, a percentage of that same result; the reduced amount is then increased by the promotional-financing fee, a percentage of the reduced amount; the change-order administration fee is added last, and only the final total is rounded to the cent half up.'
    co_after_fee: 'The line-set change-order charge is worked out in this order: the refrigerant-history credit is taken off the package''s line_set_change_order_usd, never below zero; the amount left is then multiplied by the discovery share; that result is reduced by the member change-order discount, a percentage of that same result; the reduced amount is then increased by the promotional-financing fee, a percentage of the reduced amount; the change-order administration fee is added last, and only the final total is rounded to the cent half up.'
    result: 'The line-set change-order charge is worked out in this order: the refrigerant-history credit is taken off the package''s line_set_change_order_usd, never below zero; the amount left is then multiplied by the discovery share; that result is reduced by the member change-order discount, a percentage of that same result; the reduced amount is then increased by the promotional-financing fee, a percentage of the reduced amount; the change-order administration fee is added last, and only the final total is rounded to the cent half up.'
    co_leak_labor: 'The refrigerant-history credit on a line-set change order is worked out from the homeowner''s Harbison service calls in the co_refrig_window_months months before the date of handling: where those calls billed both a refrigerant_leak_search and refrigerant, the credit is the refrigerant_leak_search labor billed on them, since that search located the leak the new line set cures; where they billed refrigerant but no refrigerant_leak_search, the credit is the most recent refrigerant charge billed; where they billed no refrigerant, no refrigerant-history credit is given.'
    co_last_refrig: 'The refrigerant-history credit on a line-set change order is worked out from the homeowner''s Harbison service calls in the co_refrig_window_months months before the date of handling: where those calls billed both a refrigerant_leak_search and refrigerant, the credit is the refrigerant_leak_search labor billed on them, since that search located the leak the new line set cures; where they billed refrigerant but no refrigerant_leak_search, the credit is the most recent refrigerant charge billed; where they billed no refrigerant, no refrigerant-history credit is given.'
  factors:
  - id: refrigerant_history_credit
    effect: method
    decides: co_refrig_credit
    bindings:
    - co_refrig_spend
    - co_leak_labor
    - co_last_refrig
    - co_refrig_credit
    ladder:
    - when: the homeowner's service calls in the co_refrig_window_months months before the date of handling billed both a refrigerant_leak_search and refrigerant
      method: the credit is the refrigerant_leak_search labor billed on those calls (a sum of the leak-search labor lines)
    - when: those calls billed refrigerant but no refrigerant_leak_search
      method: the credit is the most recent refrigerant charge billed (a single latest line)
    - when: otherwise (no refrigerant billed in that window)
      method: no refrigerant-history credit is given
    baseline:
      co_refrig_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: discovery_share
    effect: parameter
    decides: co_field_share
    bindings:
    - co_appr_date
    - co_sched_date
    - co_field_share
    ladder:
    - when: the most recent confirmed change-order approval on the project was confirmed on or after the day its permit_fee charge was posted
      value: the line-set change order is multiplied by co_after_schedule_share_pct percent
    - when: that approval was confirmed after the signed_date and before the project was scheduled, or on a project not yet scheduled
      value: the line-set change order is multiplied by co_after_signing_share_pct percent
    - when: otherwise (that approval was confirmed on the signed_date itself)
      value: the line-set change order is taken at co_standard_share_pct percent
    baseline:
      co_field_share: K('co_standard_share_pct')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: member_change_order_discount
    effect: parameter
    decides: co_member_pct
    bindings:
    - co_member_status
    - co_member_terms
    - co_member_pct
    ladder:
    - when: a Comfort Club agreement in active status and consecutive_terms of at least co_loyal_terms
      value: the tier's accessory_discount_pct plus co_loyal_extra_pct points off the line-set change order
    - when: a Comfort Club agreement in active status and consecutive_terms fewer than co_loyal_terms
      value: the tier's accessory_discount_pct off the line-set change order
    - when: otherwise (no Comfort Club agreement in active status)
      value: no member change-order discount
    baseline:
      co_member_pct: '0'
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: plan
  - id: promotional_financing_fee
    effect: parameter
    decides: co_fin_fee_pct
    bindings:
    - co_fin_plan
    - co_fin_status
    - co_fin_fee_pct
    ladder:
    - when: the project's financing account is in approved or active status and is on the 12-Month Same-As-Cash Deferred Interest Plan
      value: a promotional-financing fee of co_deferred_promo_fee_pct percent on the line-set change order
    - when: the project's financing account is in approved or active status and is on the 18-Month or 36-Month 0% APR Equal Payment Plan
      value: a promotional-financing fee of co_equal_promo_fee_pct percent on the line-set change order
    - when: otherwise (no financing account in approved or active status on one of those plans)
      value: no promotional-financing fee on the line-set change order
    baseline:
      co_fin_fee_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: finance
  - id: change_order_admin_fee
    effect: parameter
    decides: co_admin_fee
    bindings:
    - co_prior_count
    - co_admin_fee
    ladder:
    - when: two or more change-order charges already posted on the project
      value: a change-order administration fee of co_admin_fee_third_usd
    - when: exactly one change-order charge already posted on the project
      value: a change-order administration fee of co_admin_fee_second_usd
    - when: otherwise (no change-order charge yet posted on the project)
      value: no change-order administration fee
    baseline:
      co_admin_fee: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: A new refrigerant line set that the package does not include is billed as a numbered change order, and the line-set change-order charge is the package's line_set_change_order_usd, rounded to the cent half up.
    params:
    - line_set_change_order_usd
  inputs:
    history:
    - table: install_ledger
      aggregate: latest
      field: posted_date
      filters:
        line_type: permit_fee
    - table: install_change_requests
      aggregate: latest
      field: created_at
      filters:
        request_type: change_order_approval
        request_status: confirmed
    - table: install_ledger
      aggregate: count
      field: install_entry_id
      filters:
        line_type: change_order
    - category: service
      table: service_lines
      aggregate: sum
      field: amount
      within_months: 24
      filters:
        event_type: service_charge
        line_type: refrigerant
    - category: service
      table: service_lines
      aggregate: sum
      field: amount
      within_months: 24
      filters:
        event_type: service_charge
        line_type: repair_labor
        task_code: refrigerant_leak_search
    - category: service
      table: service_lines
      aggregate: latest
      field: amount
      filters:
        event_type: service_charge
        line_type: refrigerant
    cross_category:
    - service
    - plan
    - finance
- id: install_ext_progress_installment
  base_policy_refs:
  - install_deposit_and_payment
  - install_financing_link
  overwrite:
  - base_policy: install_deposit_and_payment
    superseded_clause: The remaining balance is due final_payment_due_days after installed_date, and 0 means on the installation day
    replaced_by: A project that has been scheduled takes a progress installment from the homeowner ahead of its installation day, and the rest of the balance is due final_payment_due_days after installed_date, where 0 means on the installation day.
  trigger: on_request
  subject:
  - install_payment
  computes: amount
  target_tool: pay_progress_installment_728e8d1f
  params:
    pp_standard_share_pct: 30
    pp_mid_share_pct: 40
    pp_large_share_pct: 50
    pp_mid_total_usd: 11000.0
    pp_large_total_usd: 15000.0
    pp_upkeep_window_months: 24
    pp_kept_visits_high: 4
    pp_kept_visits_low: 2
    pp_high_upkeep_factor: 0.8
    pp_low_upkeep_factor: 0.9
    pp_standard_factor: 1.0
    pp_collect_all_count: 3
    pp_collect_latest_count: 2
  rule: 'A project that has been scheduled takes a progress installment from the homeowner ahead of its installation day, and the rest of the balance is due final_payment_due_days after installed_date, where 0 means on the installation day. The progress installment is pp_standard_share_pct percent of the project''s net amount, which is every charge on the project less every credit on it, rounded to the cent half up. The progress share follows the total of every charge on the project: where those charges total at least pp_large_total_usd the progress share is pp_large_share_pct percent, where they total at least pp_mid_total_usd but less than pp_large_total_usd it is pp_mid_share_pct percent, and where they total less than pp_mid_total_usd it is pp_standard_share_pct percent. The financed exclusion follows the financing account linked to the project: where the account is in approved status and its amount_financed is below the project''s net amount, the amount_financed is excluded from the progress base; where the account is in approved status and its amount_financed is at or above the net amount, the whole net amount is excluded and no progress share is owed; with no account in approved status nothing is excluded. The upkeep factor of the progress installment follows the Comfort Club tune-up visits completed on the homeowner''s agreement in the pp_upkeep_window_months months before the date of handling, never counting a visit forfeited for a missed or late-cancelled appointment: with at least pp_kept_visits_high such visits the progress share amount is multiplied by pp_high_upkeep_factor, with at least pp_kept_visits_low but fewer than pp_kept_visits_high it is multiplied by pp_low_upkeep_factor, and with fewer than pp_kept_visits_low it is multiplied by pp_standard_factor. The change-order collection of the progress installment follows the change-order approvals the homeowner has confirmed on the project: with pp_collect_all_count or more confirmed approvals every change-order charge on the project is collected in full with the progress installment instead of at the progress share; with exactly pp_collect_latest_count confirmed approvals the change-order charge carrying the highest change-order number, which is the most recently approved one, is collected in full and the others stay at the progress share; with fewer every change-order charge stays at the progress share. The progress installment is worked out in this order: the financed exclusion and the change-order charges collected in full are taken off the project''s net amount, never below zero; the progress share is applied once to what remains; that amount is multiplied by the upkeep factor; the change-order charges collected in full are then added, and only the final amount is rounded to the cent half up. The progress installment is fixed only after every change order the homeowner has confirmed carries its charge on the project ledger.'
  prerequisite:
  - problem: install_ext_line_set_change_order_charge
    kind: value_input
    gate: pp_net
    form: state
    policy_source: The progress installment is fixed only after every change order the homeowner has confirmed carries its charge on the project ledger.
    condition: Every install_change_requests row of request_type change_order_approval and request_status confirmed on the project has an install_ledger install_charge entry of line_type change_order carrying the same change_order_no.
    resolved_by: bill_change_order_a6215d22
    effect: The confirmed change order's charge enters every charge on the project and, with two confirmed approvals, is the change-order charge carrying the highest change-order number that is collected in full, so pp_net, pp_latest_co and the progress installment computed on them change.
  cross_category:
  - category: finance
    as: branch
    reads:
    - status
    - amount_financed
    note: The financed exclusion tier is decided from the status and amount financed of the project's financing account.
  - category: plan
    as: history
    reads:
    - plan_service_entries.event_type
    - plan_service_entries.entry_date
    note: The upkeep factor tier is decided from the tune-up visits on the homeowner's Comfort Club agreement.
  compute:
  - pp_charges: SUM('install_ledger', 'amount', event_type='install_charge')
  - pp_credits: SUM('install_ledger', 'amount', event_type='install_credit')
  - pp_net: pp_charges - pp_credits
  - pp_share_pct: K('pp_large_share_pct') if pp_charges >= K('pp_large_total_usd') else (K('pp_mid_share_pct') if pp_charges >= K('pp_mid_total_usd') else K('pp_standard_share_pct'))
  - pp_fin_status: CFIELD('finance', 'status', install_id=HID)
  - pp_fin_amount: CFIELD('finance', 'amount_financed', install_id=HID)
  - pp_fin_excluded: pp_fin_amount if (pp_fin_status == 'approved' and pp_fin_amount < pp_net) else (pp_net if (pp_fin_status == 'approved' and pp_fin_amount >= pp_net) else 0)
  - pp_visits: XCOUNT('plan', 'plan_service_entries', within_months=K('pp_upkeep_window_months'), date_field='entry_date', event_type='plan_tuneup_visit', entry_reason='completed_visit')
  - pp_upkeep: K('pp_high_upkeep_factor') if pp_visits >= K('pp_kept_visits_high') else (K('pp_low_upkeep_factor') if pp_visits >= K('pp_kept_visits_low') else K('pp_standard_factor'))
  - pp_confirmed_cos: COUNT('install_change_requests', request_type='change_order_approval', request_status='confirmed')
  - pp_all_co: SUM('install_ledger', 'amount', event_type='install_charge', line_type='change_order')
  - pp_top_co_no: MAX('install_ledger', 'change_order_no', event_type='install_charge', line_type='change_order')
  - pp_latest_co: SUM('install_ledger', 'amount', event_type='install_charge', line_type='change_order', change_order_no=int(pp_top_co_no))
  - pp_co_full: pp_all_co if pp_confirmed_cos >= K('pp_collect_all_count') else (pp_latest_co if pp_confirmed_cos == K('pp_collect_latest_count') else 0)
  - result: RND(MX(0, pp_net - pp_fin_excluded - pp_co_full) * pp_share_pct / 100 * pp_upkeep + pp_co_full + 0.000001, 2)
  compute_basis:
    pp_charges: 'The progress share follows the total of every charge on the project: where those charges total at least pp_large_total_usd the progress share is pp_large_share_pct percent, where they total at least pp_mid_total_usd but less than pp_large_total_usd it is pp_mid_share_pct percent, and where they total less than pp_mid_total_usd it is pp_standard_share_pct percent.'
    pp_credits: The progress installment is pp_standard_share_pct percent of the project's net amount, which is every charge on the project less every credit on it, rounded to the cent half up.
    pp_net: The progress installment is pp_standard_share_pct percent of the project's net amount, which is every charge on the project less every credit on it, rounded to the cent half up.
    pp_share_pct: 'The progress share follows the total of every charge on the project: where those charges total at least pp_large_total_usd the progress share is pp_large_share_pct percent, where they total at least pp_mid_total_usd but less than pp_large_total_usd it is pp_mid_share_pct percent, and where they total less than pp_mid_total_usd it is pp_standard_share_pct percent.'
    pp_fin_status: 'The financed exclusion follows the financing account linked to the project: where the account is in approved status and its amount_financed is below the project''s net amount, the amount_financed is excluded from the progress base; where the account is in approved status and its amount_financed is at or above the net amount, the whole net amount is excluded and no progress share is owed; with no account in approved status nothing is excluded.'
    pp_fin_amount: 'The financed exclusion follows the financing account linked to the project: where the account is in approved status and its amount_financed is below the project''s net amount, the amount_financed is excluded from the progress base; where the account is in approved status and its amount_financed is at or above the net amount, the whole net amount is excluded and no progress share is owed; with no account in approved status nothing is excluded.'
    pp_fin_excluded: 'The financed exclusion follows the financing account linked to the project: where the account is in approved status and its amount_financed is below the project''s net amount, the amount_financed is excluded from the progress base; where the account is in approved status and its amount_financed is at or above the net amount, the whole net amount is excluded and no progress share is owed; with no account in approved status nothing is excluded.'
    pp_visits: 'The upkeep factor of the progress installment follows the Comfort Club tune-up visits completed on the homeowner''s agreement in the pp_upkeep_window_months months before the date of handling, never counting a visit forfeited for a missed or late-cancelled appointment: with at least pp_kept_visits_high such visits the progress share amount is multiplied by pp_high_upkeep_factor, with at least pp_kept_visits_low but fewer than pp_kept_visits_high it is multiplied by pp_low_upkeep_factor, and with fewer than pp_kept_visits_low it is multiplied by pp_standard_factor.'
    pp_upkeep: 'The upkeep factor of the progress installment follows the Comfort Club tune-up visits completed on the homeowner''s agreement in the pp_upkeep_window_months months before the date of handling, never counting a visit forfeited for a missed or late-cancelled appointment: with at least pp_kept_visits_high such visits the progress share amount is multiplied by pp_high_upkeep_factor, with at least pp_kept_visits_low but fewer than pp_kept_visits_high it is multiplied by pp_low_upkeep_factor, and with fewer than pp_kept_visits_low it is multiplied by pp_standard_factor.'
    pp_confirmed_cos: 'The change-order collection of the progress installment follows the change-order approvals the homeowner has confirmed on the project: with pp_collect_all_count or more confirmed approvals every change-order charge on the project is collected in full with the progress installment instead of at the progress share; with exactly pp_collect_latest_count confirmed approvals the change-order charge carrying the highest change-order number, which is the most recently approved one, is collected in full and the others stay at the progress share; with fewer every change-order charge stays at the progress share.'
    result: 'The progress installment is worked out in this order: the financed exclusion and the change-order charges collected in full are taken off the project''s net amount, never below zero; the progress share is applied once to what remains; that amount is multiplied by the upkeep factor; the change-order charges collected in full are then added, and only the final amount is rounded to the cent half up.'
    pp_all_co: 'The change-order collection of the progress installment follows the change-order approvals the homeowner has confirmed on the project: with pp_collect_all_count or more confirmed approvals every change-order charge on the project is collected in full with the progress installment instead of at the progress share; with exactly pp_collect_latest_count confirmed approvals the change-order charge carrying the highest change-order number, which is the most recently approved one, is collected in full and the others stay at the progress share; with fewer every change-order charge stays at the progress share.'
    pp_latest_co: 'The change-order collection of the progress installment follows the change-order approvals the homeowner has confirmed on the project: with pp_collect_all_count or more confirmed approvals every change-order charge on the project is collected in full with the progress installment instead of at the progress share; with exactly pp_collect_latest_count confirmed approvals the change-order charge carrying the highest change-order number, which is the most recently approved one, is collected in full and the others stay at the progress share; with fewer every change-order charge stays at the progress share.'
    pp_co_full: 'The change-order collection of the progress installment follows the change-order approvals the homeowner has confirmed on the project: with pp_collect_all_count or more confirmed approvals every change-order charge on the project is collected in full with the progress installment instead of at the progress share; with exactly pp_collect_latest_count confirmed approvals the change-order charge carrying the highest change-order number, which is the most recently approved one, is collected in full and the others stay at the progress share; with fewer every change-order charge stays at the progress share.'
    pp_top_co_no: 'The change-order collection of the progress installment follows the change-order approvals the homeowner has confirmed on the project: with pp_collect_all_count or more confirmed approvals every change-order charge on the project is collected in full with the progress installment instead of at the progress share; with exactly pp_collect_latest_count confirmed approvals the change-order charge carrying the highest change-order number, which is the most recently approved one, is collected in full and the others stay at the progress share; with fewer every change-order charge stays at the progress share.'
  factors:
  - id: progress_share_by_size
    effect: parameter
    decides: pp_share_pct
    bindings:
    - pp_charges
    - pp_share_pct
    ladder:
    - when: every charge on the project totals at least pp_large_total_usd
      value: a progress share of pp_large_share_pct percent
    - when: every charge on the project totals at least pp_mid_total_usd but less than pp_large_total_usd
      value: a progress share of pp_mid_share_pct percent
    - when: otherwise (the charges total less than pp_mid_total_usd)
      value: a progress share of pp_standard_share_pct percent
    baseline:
      pp_share_pct: K('pp_standard_share_pct')
    evidence:
    - history
    cross_difficulty: null
  - id: financed_exclusion
    effect: parameter
    decides: pp_fin_excluded
    bindings:
    - pp_fin_status
    - pp_fin_amount
    - pp_fin_excluded
    ladder:
    - when: the project's financing account is in approved status and its amount_financed is below the project's net amount
      value: the amount_financed is excluded from the progress base
    - when: the project's financing account is in approved status and its amount_financed is at or above the project's net amount
      value: the whole net amount is excluded from the progress base
    - when: otherwise (no financing account in approved status)
      value: nothing is excluded from the progress base
    baseline:
      pp_fin_excluded: '0'
    evidence:
    - cross_category
    cross_difficulty: finance
  - id: upkeep_factor
    effect: parameter
    decides: pp_upkeep
    bindings:
    - pp_visits
    - pp_upkeep
    ladder:
    - when: at least pp_kept_visits_high Comfort Club tune-up visits completed (forfeited visits not counted) in the pp_upkeep_window_months months before the date of handling
      value: the progress share amount is multiplied by pp_high_upkeep_factor
    - when: at least pp_kept_visits_low but fewer than pp_kept_visits_high such tune-up visits
      value: the progress share amount is multiplied by pp_low_upkeep_factor
    - when: otherwise (fewer than pp_kept_visits_low such tune-up visits)
      value: the progress share amount is multiplied by pp_standard_factor
    baseline:
      pp_upkeep: K('pp_standard_factor')
    evidence:
    - cross_category
    - history
    cross_difficulty: plan
  - id: change_order_collection
    effect: method
    decides: pp_co_full
    bindings:
    - pp_confirmed_cos
    - pp_all_co
    - pp_top_co_no
    - pp_latest_co
    - pp_co_full
    ladder:
    - when: pp_collect_all_count or more change-order approvals confirmed by the homeowner on the project
      method: every change-order charge is taken out of the progress base and collected in full (the sum of all change-order charges)
    - when: exactly pp_collect_latest_count confirmed change-order approvals
      method: only the change-order charge carrying the highest change-order number is taken out of the progress base and collected in full
    - when: otherwise (fewer confirmed change-order approvals)
      method: every change-order charge stays in the progress base and is collected at the progress share
    baseline:
      pp_co_full: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The progress installment is pp_standard_share_pct percent of the project's net amount, which is every charge on the project less every credit on it, rounded to the cent half up.
    params:
    - pp_standard_share_pct
  inputs:
    history:
    - table: install_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: install_charge
    - table: install_ledger
      aggregate: sum
      field: amount
      filters:
        event_type: install_credit
    - table: install_change_requests
      aggregate: count
      field: install_request_id
      filters:
        request_type: change_order_approval
        request_status: confirmed
    - category: plan
      table: plan_service_entries
      aggregate: count
      field: service_entry_id
      within_months: 24
      filters:
        event_type: plan_tuneup_visit
        entry_reason: completed_visit
    - table: install_ledger
      aggregate: max
      field: change_order_no
      filters:
        line_type: change_order
    cross_category:
    - finance
    - plan
