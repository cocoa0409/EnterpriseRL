  factors:
  - id: tenure_bonus
    effect: parameter
    decides: mc_tenure_bonus
    bindings:
    - mc_enrolled
    - mc_renew
    - mc_tenure_months
    - mc_tenure_bonus
    ladder:
    - when: auto_renew set and at least mc_long_tenure_months whole months from enrolled_date to the contract's signed_date
      value: a tenure bonus of mc_long_tenure_bonus_usd on the member install credit
    - when: auto_renew set and at least mc_mid_tenure_months but fewer than mc_long_tenure_months such months
      value: a tenure bonus of mc_mid_tenure_bonus_usd on the member install credit
    - when: otherwise (auto_renew not set, or fewer than mc_mid_tenure_months such months)
      value: no tenure bonus on the member install credit
    baseline:
      mc_tenure_bonus: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: plan
  - id: covered_systems_bonus
    effect: parameter
    decides: mc_systems_bonus
    bindings:
    - mc_systems
    - mc_systems_bonus
    ladder:
    - when: the agreement's systems_covered is three or more
      value: a covered-systems bonus of mc_three_system_bonus_usd on the member install credit
    - when: the agreement's systems_covered is exactly two
      value: a covered-systems bonus of mc_two_system_bonus_usd on the member install credit
    - when: otherwise (a single covered system)
      value: no covered-systems bonus on the member install credit
    baseline:
      mc_systems_bonus: '0'
    evidence:
    - cross_category
    cross_difficulty: plan
  - id: standing_factor
    effect: parameter
    decides: mc_standing
    bindings:
    - mc_late_fees
    - mc_standing
    ladder:
    - when: two or more late fees charged on the agreement in the mc_standing_window_months months before the date of handling
      value: the member install credit is multiplied by mc_two_late_fee_factor
    - when: exactly one such late fee
      value: the member install credit is multiplied by mc_one_late_fee_factor
    - when: otherwise (no such late fee)
      value: the member install credit is multiplied by mc_good_standing_factor
    baseline:
      mc_standing: K('mc_good_standing_factor')
    evidence:
    - cross_category
    - history
    cross_difficulty: plan
  - id: tier_age_factor
    effect: parameter
    decides: mc_tier_age
    bindings:
    - mc_recent_upgrades
    - mc_settling_upgrades
    - mc_tier_age
    ladder:
    - when: a tier-upgrade visit grant on the agreement in the mc_recent_upgrade_months months before the date of handling
      value: the member install credit is multiplied by mc_recent_upgrade_factor
    - when: a tier-upgrade visit grant in the mc_settling_upgrade_months months before the date of handling but none in the last mc_recent_upgrade_months months
      value: the member install credit is multiplied by mc_settling_upgrade_factor
    - when: otherwise (no tier-upgrade visit grant in the last mc_settling_upgrade_months months)
      value: the member install credit keeps mc_settled_tier_factor
    baseline:
      mc_tier_age: K('mc_settled_tier_factor')
    evidence:
    - cross_category
    - history
    cross_difficulty: plan
  - id: repair_to_replace_credit
    effect: method
    decides: mc_repair_credit
    bindings:
    - mc_repair_parts
    - mc_repair_labor
    - mc_last_labor
    - mc_repair_credit
    ladder:
    - when: repair_parts and repair_labor charges on the homeowner's service calls in the mc_repair_window_months months before the date of handling total at least mc_repair_high_usd
      method: the credit is every repair_labor charge billed in that window (a sum of labor lines)
    - when: those repair charges total at least mc_repair_mid_usd but less than mc_repair_high_usd
      method: the credit is the most recently posted repair_labor charge (a single latest labor line)
    - when: otherwise (those repair charges total less than mc_repair_mid_usd)
      method: no repair-to-replace credit is given
    baseline:
      mc_repair_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  baseline:
    rule: A Comfort Club member whose agreement is in active status on the contract's signed_date receives a member install credit on a replacement installation contract, posted once as a member_install_credit naming the contract-price charge, and the member install credit is the tier's install_credit_usd, rounded to the cent half up.
    params: []
  inputs:
    history:
    - category: plan
      table: plan_billing_entries
      aggregate: count
      field: billing_entry_id
      within_months: 12
      filters:
        line_type: late_fee
    - category: plan
      table: plan_service_entries
      aggregate: count
      field: service_entry_id
      within_months: 6
      filters:
        entry_reason: tier_upgrade
    - category: service
      table: service_lines
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        line_type: repair_parts
    - category: service
      table: service_lines
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        line_type: repair_labor
    - category: service
      table: service_lines
      aggregate: latest
      field: amount
      filters:
        line_type: repair_labor
    cross_category:
    - plan
    - service
- id: install_ext_accessory_member_discount
  base_policy_refs:
  - install_agg_multi_system_discount
  - install_accessories_and_protection
  - install_rescission
  - install_cancellation_after_rescission
  - install_member_credit
  - install_manufacturer_rebate
  - install_refunds
  overwrite:
  - base_policy: install_accessories_and_protection
    superseded_clause: A Comfort Club member whose agreement is active on the date the accessory is added receives the tier's accessory_discount_pct on that accessory, posted as an accessory_member_discount naming the accessory charge and rounded to the cent half up.
    replaced_by: A Comfort Club member whose agreement is in active status on the date the accessory member discount is posted receives one accessory member discount covering every accessory charged on the contract, posted once per contract as an accessory_member_discount naming the contract's highest-priced accessory charge; a homeowner whose agreement is not in active status on that date receives none.
  trigger: state_due
  subject:
  - install_credit
  computes: amount
  target_tool: post_accessory_member_discount_3312a288
  params:
    ad_filter_max_pts: 5
    ad_other_filter_bonus_pts: 2
    ad_same_day_bonus_pts: 2
    ad_some_same_day_bonus_pts: 1
    ad_premium_accessory_usd: 1000.0
    ad_mid_accessory_usd: 500.0
    ad_premium_bonus_pts: 2
    ad_mid_bonus_pts: 1
    ad_annual_renew_bonus_pts: 2
    ad_annual_bonus_pts: 1
    ad_total_bundle_factor: 1.4
    ad_other_bundle_factor: 1.2
    ad_no_bundle_factor: 1.0
  rule: 'A Comfort Club member whose agreement is in active status on the date the accessory member discount is posted receives one accessory member discount covering every accessory charged on the contract, posted once per contract as an accessory_member_discount naming the contract''s highest-priced accessory charge; a homeowner whose agreement is not in active status on that date receives none. The accessory member discount is the tier''s accessory_discount_pct of the accessory charges on the contract, rounded to the cent half up. The filter-subscriber points of the accessory member discount follow the homeowner''s FilterDirect subscription: where the subscription is in active status and the contract carries a uv_germicidal_light, a media_air_cleaner or a steam_humidifier, the points are one percentage point for each whole year from the subscription''s started_date to the date of handling, at most ad_filter_max_pts; where the subscription is in active status and the contract carries none of those air-quality accessories, the points are ad_other_filter_bonus_pts; a homeowner with no subscription in active status receives no filter-subscriber points. The point-of-sale points of the accessory member discount compare the accessory charges with the contract''s signed_date: where every accessory charge on the contract was posted on the signed_date, ad_same_day_bonus_pts percentage points are added; where some but not all were, ad_some_same_day_bonus_pts percentage point is added; where none was, no point-of-sale points are added. The premium-accessory points of the accessory member discount follow the total of the accessory charges on the contract, which never includes a labor-warranty upgrade: a total of at least ad_premium_accessory_usd adds ad_premium_bonus_pts percentage points, a total of at least ad_mid_accessory_usd but less than ad_premium_accessory_usd adds ad_mid_bonus_pts percentage point, and a smaller total adds no premium-accessory points. The prepaid-dues points of the accessory member discount follow how the Comfort Club agreement''s dues are billed and renewed: annual billing with auto_renew set adds ad_annual_renew_bonus_pts percentage points, annual billing without auto_renew adds ad_annual_bonus_pts percentage point, and monthly billing adds no prepaid-dues points. The protection-bundle factor of the accessory member discount follows the labor-warranty upgrade charged on the same contract: an upgrade to the Harbison 12-Year Total Protection or the Harbison 12-Year Total Protection Plus multiplies the discount by ad_total_bundle_factor, an upgrade to any other protection tier multiplies it by ad_other_bundle_factor, and a contract with no upgrade keeps ad_no_bundle_factor. The accessory member discount is worked out in this order: the tier''s accessory_discount_pct and every filter-subscriber, point-of-sale, premium-accessory and prepaid-dues point are added into one percentage, which is applied once to the total of the accessory charges on the contract; that amount is multiplied by the protection-bundle factor, and only the final amount is rounded to the cent half up.'
  prerequisite: []
  cross_category:
  - category: filter
    as: branch
    reads:
    - status
    - started_date
    note: The filter-subscriber points method is chosen and computed from the FilterDirect subscription's status and start date.
  - category: plan
    as: branch
    reads:
    - status
    - billing_frequency
    - auto_renew
    - accessory_discount_pct
    note: The prepaid-dues points tier is decided from the Comfort Club agreement's billing frequency and auto_renew.
  compute:
  - ad_member_status: CFIELD('plan', 'status')
  - ad_tier_pct: CPARAM('plan', 'accessory_discount_pct')
  - ad_acc_total: SUM('install_ledger', 'amount', event_type='install_charge', line_type='accessory')
  - ad_iaq_count: COUNT('install_ledger', event_type='install_charge', line_type='accessory', accessory_code='uv_germicidal_light') + COUNT('install_ledger', event_type='install_charge', line_type='accessory', accessory_code='media_air_cleaner') + COUNT('install_ledger', event_type='install_charge', line_type='accessory', accessory_code='steam_humidifier')
  - ad_filter_status: CFIELD('filter', 'status')
  - ad_filter_started: CFIELD('filter', 'started_date')
  - ad_filter_pts: MN(K('ad_filter_max_pts'), int(MONTHS(ad_filter_started, NOW) / 12)) if (ad_filter_status == 'active' and ad_iaq_count >= 1) else (K('ad_other_filter_bonus_pts') if (ad_filter_status == 'active' and ad_iaq_count == 0) else 0)
  - ad_acc_count: COUNT('install_ledger', event_type='install_charge', line_type='accessory')
  - ad_same_day_count: COUNT('install_ledger', event_type='install_charge', line_type='accessory', posted_date=F('signed_date'))
  - ad_pos_pts: K('ad_same_day_bonus_pts') if (ad_acc_count > 0 and ad_same_day_count == ad_acc_count) else (K('ad_some_same_day_bonus_pts') if (ad_same_day_count > 0 and ad_same_day_count < ad_acc_count) else 0)
  - ad_premium_pts: K('ad_premium_bonus_pts') if ad_acc_total >= K('ad_premium_accessory_usd') else (K('ad_mid_bonus_pts') if ad_acc_total >= K('ad_mid_accessory_usd') else 0)
  - ad_billing: CFIELD('plan', 'billing_frequency')
  - ad_renew: CFIELD('plan', 'auto_renew')
  - ad_dues_pts: K('ad_annual_renew_bonus_pts') if (ad_billing == 'annual' and ad_renew == True) else (K('ad_annual_bonus_pts') if (ad_billing == 'annual' and ad_renew != True) else 0)
  - ad_upgrade: LATEST('install_ledger', 'upgrade_variant_name', date_field='posted_date', event_type='install_charge', line_type='labor_warranty_upgrade')
  - ad_bundle: K('ad_total_bundle_factor') if (ad_upgrade == 'Harbison 12-Year Total Protection' or ad_upgrade == 'Harbison 12-Year Total Protection Plus') else (K('ad_other_bundle_factor') if (ad_upgrade != None and ad_upgrade != '') else K('ad_no_bundle_factor'))
  - ad_pct: ad_tier_pct + ad_filter_pts + ad_pos_pts + ad_premium_pts + ad_dues_pts
  - result: RND(ad_acc_total * ad_pct / 100 * ad_bundle + 0.000001, 2) if ad_member_status == 'active' else 0
  compute_basis:
    ad_tier_pct: The accessory member discount is the tier's accessory_discount_pct of the accessory charges on the contract, rounded to the cent half up.
    ad_acc_total: The accessory member discount is the tier's accessory_discount_pct of the accessory charges on the contract, rounded to the cent half up.
    ad_iaq_count: 'The filter-subscriber points of the accessory member discount follow the homeowner''s FilterDirect subscription: where the subscription is in active status and the contract carries a uv_germicidal_light, a media_air_cleaner or a steam_humidifier, the points are one percentage point for each whole year from the subscription''s started_date to the date of handling, at most ad_filter_max_pts; where the subscription is in active status and the contract carries none of those air-quality accessories, the points are ad_other_filter_bonus_pts; a homeowner with no subscription in active status receives no filter-subscriber points.'
    ad_filter_status: 'The filter-subscriber points of the accessory member discount follow the homeowner''s FilterDirect subscription: where the subscription is in active status and the contract carries a uv_germicidal_light, a media_air_cleaner or a steam_humidifier, the points are one percentage point for each whole year from the subscription''s started_date to the date of handling, at most ad_filter_max_pts; where the subscription is in active status and the contract carries none of those air-quality accessories, the points are ad_other_filter_bonus_pts; a homeowner with no subscription in active status receives no filter-subscriber points.'
    ad_filter_started: 'The filter-subscriber points of the accessory member discount follow the homeowner''s FilterDirect subscription: where the subscription is in active status and the contract carries a uv_germicidal_light, a media_air_cleaner or a steam_humidifier, the points are one percentage point for each whole year from the subscription''s started_date to the date of handling, at most ad_filter_max_pts; where the subscription is in active status and the contract carries none of those air-quality accessories, the points are ad_other_filter_bonus_pts; a homeowner with no subscription in active status receives no filter-subscriber points.'
    ad_filter_pts: 'The filter-subscriber points of the accessory member discount follow the homeowner''s FilterDirect subscription: where the subscription is in active status and the contract carries a uv_germicidal_light, a media_air_cleaner or a steam_humidifier, the points are one percentage point for each whole year from the subscription''s started_date to the date of handling, at most ad_filter_max_pts; where the subscription is in active status and the contract carries none of those air-quality accessories, the points are ad_other_filter_bonus_pts; a homeowner with no subscription in active status receives no filter-subscriber points.'
    ad_acc_count: 'The point-of-sale points of the accessory member discount compare the accessory charges with the contract''s signed_date: where every accessory charge on the contract was posted on the signed_date, ad_same_day_bonus_pts percentage points are added; where some but not all were, ad_some_same_day_bonus_pts percentage point is added; where none was, no point-of-sale points are added.'
    ad_same_day_count: 'The point-of-sale points of the accessory member discount compare the accessory charges with the contract''s signed_date: where every accessory charge on the contract was posted on the signed_date, ad_same_day_bonus_pts percentage points are added; where some but not all were, ad_some_same_day_bonus_pts percentage point is added; where none was, no point-of-sale points are added.'
    ad_pos_pts: 'The point-of-sale points of the accessory member discount compare the accessory charges with the contract''s signed_date: where every accessory charge on the contract was posted on the signed_date, ad_same_day_bonus_pts percentage points are added; where some but not all were, ad_some_same_day_bonus_pts percentage point is added; where none was, no point-of-sale points are added.'
    ad_premium_pts: 'The premium-accessory points of the accessory member discount follow the total of the accessory charges on the contract, which never includes a labor-warranty upgrade: a total of at least ad_premium_accessory_usd adds ad_premium_bonus_pts percentage points, a total of at least ad_mid_accessory_usd but less than ad_premium_accessory_usd adds ad_mid_bonus_pts percentage point, and a smaller total adds no premium-accessory points.'
    ad_billing: 'The prepaid-dues points of the accessory member discount follow how the Comfort Club agreement''s dues are billed and renewed: annual billing with auto_renew set adds ad_annual_renew_bonus_pts percentage points, annual billing without auto_renew adds ad_annual_bonus_pts percentage point, and monthly billing adds no prepaid-dues points.'
    ad_renew: 'The prepaid-dues points of the accessory member discount follow how the Comfort Club agreement''s dues are billed and renewed: annual billing with auto_renew set adds ad_annual_renew_bonus_pts percentage points, annual billing without auto_renew adds ad_annual_bonus_pts percentage point, and monthly billing adds no prepaid-dues points.'
    ad_dues_pts: 'The prepaid-dues points of the accessory member discount follow how the Comfort Club agreement''s dues are billed and renewed: annual billing with auto_renew set adds ad_annual_renew_bonus_pts percentage points, annual billing without auto_renew adds ad_annual_bonus_pts percentage point, and monthly billing adds no prepaid-dues points.'
    ad_upgrade: 'The protection-bundle factor of the accessory member discount follows the labor-warranty upgrade charged on the same contract: an upgrade to the Harbison 12-Year Total Protection or the Harbison 12-Year Total Protection Plus multiplies the discount by ad_total_bundle_factor, an upgrade to any other protection tier multiplies it by ad_other_bundle_factor, and a contract with no upgrade keeps ad_no_bundle_factor.'
    ad_bundle: 'The protection-bundle factor of the accessory member discount follows the labor-warranty upgrade charged on the same contract: an upgrade to the Harbison 12-Year Total Protection or the Harbison 12-Year Total Protection Plus multiplies the discount by ad_total_bundle_factor, an upgrade to any other protection tier multiplies it by ad_other_bundle_factor, and a contract with no upgrade keeps ad_no_bundle_factor.'
    ad_pct: 'The accessory member discount is worked out in this order: the tier''s accessory_discount_pct and every filter-subscriber, point-of-sale, premium-accessory and prepaid-dues point are added into one percentage, which is applied once to the total of the accessory charges on the contract; that amount is multiplied by the protection-bundle factor, and only the final amount is rounded to the cent half up.'
    result: 'The accessory member discount is worked out in this order: the tier''s accessory_discount_pct and every filter-subscriber, point-of-sale, premium-accessory and prepaid-dues point are added into one percentage, which is applied once to the total of the accessory charges on the contract; that amount is multiplied by the protection-bundle factor, and only the final amount is rounded to the cent half up.'
    ad_member_status: A Comfort Club member whose agreement is in active status on the date the accessory member discount is posted receives one accessory member discount covering every accessory charged on the contract, posted once per contract as an accessory_member_discount naming the contract's highest-priced accessory charge; a homeowner whose agreement is not in active status on that date receives none.
  factors:
  - id: filter_subscriber_points
    effect: method
    decides: ad_filter_pts
    bindings:
    - ad_iaq_count
    - ad_filter_status
    - ad_filter_started
    - ad_filter_pts
    ladder:
    - when: a FilterDirect subscription in active status and the contract carries a uv_germicidal_light, media_air_cleaner or steam_humidifier
      method: 'the points are counted from the subscription: one point per whole year from started_date to the date of handling, at most ad_filter_max_pts'
    - when: a FilterDirect subscription in active status and the contract carries none of those air-quality accessories
      method: a flat ad_other_filter_bonus_pts points, whatever the subscription's age
    - when: otherwise (no FilterDirect subscription in active status)
      method: no filter-subscriber points
    baseline:
      ad_filter_pts: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: filter
  - id: point_of_sale_points
    effect: parameter
    decides: ad_pos_pts
    bindings:
    - ad_acc_count
    - ad_same_day_count
    - ad_pos_pts
    ladder:
    - when: every accessory charge on the contract was posted on the signed_date
      value: ad_same_day_bonus_pts points added to the accessory member discount
    - when: some but not all accessory charges were posted on the signed_date
      value: ad_some_same_day_bonus_pts point added to the accessory member discount
    - when: otherwise (no accessory charge posted on the signed_date)
      value: no point-of-sale points
    baseline:
      ad_pos_pts: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: premium_accessory_points
    effect: parameter
    decides: ad_premium_pts
    bindings:
    - ad_acc_total
    - ad_premium_pts
    ladder:
    - when: the accessory charges on the contract total at least ad_premium_accessory_usd
      value: ad_premium_bonus_pts points added to the accessory member discount
    - when: they total at least ad_mid_accessory_usd but less than ad_premium_accessory_usd
      value: ad_mid_bonus_pts point added to the accessory member discount
    - when: otherwise (a smaller accessory total)
      value: no premium-accessory points
    baseline:
      ad_premium_pts: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: prepaid_dues_points
    effect: parameter
    decides: ad_dues_pts
    bindings:
    - ad_billing
    - ad_renew
    - ad_dues_pts
    ladder:
    - when: the Comfort Club agreement is billed annually and auto_renew is set
      value: ad_annual_renew_bonus_pts points added to the accessory member discount
    - when: the agreement is billed annually and auto_renew is not set
      value: ad_annual_bonus_pts point added to the accessory member discount
    - when: otherwise (the agreement is billed monthly)
      value: no prepaid-dues points
    baseline:
      ad_dues_pts: '0'
    evidence:
    - cross_category
    cross_difficulty: plan
  - id: protection_bundle_factor
    effect: parameter
    decides: ad_bundle
    bindings:
    - ad_upgrade
    - ad_bundle
    ladder:
    - when: the contract carries a labor-warranty upgrade to the Harbison 12-Year Total Protection or the Harbison 12-Year Total Protection Plus
      value: the accessory member discount is multiplied by ad_total_bundle_factor
    - when: the contract carries a labor-warranty upgrade to any other protection tier
      value: the accessory member discount is multiplied by ad_other_bundle_factor
    - when: otherwise (no labor-warranty upgrade on the contract)
      value: the accessory member discount keeps ad_no_bundle_factor
    baseline:
      ad_bundle: K('ad_no_bundle_factor')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The accessory member discount is the tier's accessory_discount_pct of the accessory charges on the contract, rounded to the cent half up.
    params: []
  inputs:
    history:
    - table: install_ledger
      aggregate: sum
      field: amount
      filters:
        line_type: accessory
    - table: install_ledger
      aggregate: count
      field: install_entry_id
      filters:
        line_type: accessory
        posted_date: <signed_date>
    - table: install_ledger
      aggregate: latest
      field: upgrade_variant_name
      filters:
        line_type: labor_warranty_upgrade
    cross_category:
    - filter
