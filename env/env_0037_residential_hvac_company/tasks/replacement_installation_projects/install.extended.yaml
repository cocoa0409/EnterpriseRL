  compute:
  - mc_tier_credit: CPARAM('plan', 'install_credit_usd')
  - mc_enrolled: CFIELD('plan', 'enrolled_date')
  - mc_renew: CFIELD('plan', 'auto_renew')
  - mc_tenure_months: MONTHS(mc_enrolled, F('signed_date'))
  - mc_tenure_bonus: K('mc_long_tenure_bonus_usd') if (mc_tenure_months >= K('mc_long_tenure_months') and mc_renew == True) else (K('mc_mid_tenure_bonus_usd') if (mc_tenure_months >= K('mc_mid_tenure_months') and mc_tenure_months < K('mc_long_tenure_months') and mc_renew == True) else 0)
  - mc_systems: CFIELD('plan', 'systems_covered')
  - mc_systems_bonus: K('mc_three_system_bonus_usd') if mc_systems >= 3 else (K('mc_two_system_bonus_usd') if mc_systems == 2 else 0)
  - mc_late_fees: XCOUNT('plan', 'plan_billing_entries', within_months=K('mc_standing_window_months'), date_field='posted_date', line_type='late_fee')
  - mc_standing: K('mc_two_late_fee_factor') if mc_late_fees >= 2 else (K('mc_one_late_fee_factor') if mc_late_fees == 1 else K('mc_good_standing_factor'))
  - mc_recent_upgrades: XCOUNT('plan', 'plan_service_entries', within_months=K('mc_recent_upgrade_months'), date_field='entry_date', entry_reason='tier_upgrade')
  - mc_settling_upgrades: XCOUNT('plan', 'plan_service_entries', within_months=K('mc_settling_upgrade_months'), date_field='entry_date', entry_reason='tier_upgrade')
  - mc_tier_age: K('mc_recent_upgrade_factor') if mc_recent_upgrades >= 1 else (K('mc_settling_upgrade_factor') if mc_settling_upgrades >= 1 else K('mc_settled_tier_factor'))
  - mc_repair_parts: XSUM('service', 'service_lines', 'amount', within_months=K('mc_repair_window_months'), date_field='posted_date', event_type='service_charge', line_type='repair_parts')
  - mc_repair_labor: XSUM('service', 'service_lines', 'amount', within_months=K('mc_repair_window_months'), date_field='posted_date', event_type='service_charge', line_type='repair_labor')
  - mc_last_labor: XLATEST('service', 'service_lines', 'amount', date_field='posted_date', event_type='service_charge', line_type='repair_labor')
  - mc_repair_credit: mc_repair_labor if mc_repair_parts + mc_repair_labor >= K('mc_repair_high_usd') else (mc_last_labor if mc_repair_parts + mc_repair_labor >= K('mc_repair_mid_usd') else 0)
  - mc_subtotal: mc_tier_credit + mc_tenure_bonus + mc_systems_bonus
  - result: RND(mc_subtotal * mc_standing * mc_tier_age + mc_repair_credit + 0.000001, 2)
