    mc_repair_high_usd: 1500.0
    mc_repair_mid_usd: 600.0
  rule: 'A Comfort Club member whose agreement is in active status on the contract''s signed_date receives a member install credit on a replacement installation contract, posted once as a member_install_credit naming the contract-price charge, and the member install credit is the tier''s install_credit_usd, rounded to the cent half up. The tenure bonus of the member install credit counts the whole months from the agreement''s enrolled_date to the contract''s signed_date: an agreement with auto_renew set and at least mc_long_tenure_months such months adds mc_long_tenure_bonus_usd, an agreement with auto_renew set and at least mc_mid_tenure_months but fewer than mc_long_tenure_months such months adds mc_mid_tenure_bonus_usd, and any other agreement adds no tenure bonus. The covered-systems bonus of the member install credit follows the agreement''s systems_covered: three or more systems add mc_three_system_bonus_usd, exactly two systems add mc_two_system_bonus_usd, and a single system adds no covered-systems bonus. The standing factor of the member install credit counts the late fees charged on the agreement in the mc_standing_window_months months before the date of handling: with two or more such late fees the credit is multiplied by mc_two_late_fee_factor, with exactly one by mc_one_late_fee_factor, and with none by mc_good_standing_factor. The tier-age factor of the member install credit looks at the visit grants posted to the agreement for a tier upgrade: a tier-upgrade grant in the mc_recent_upgrade_months months before the date of handling multiplies the credit by mc_recent_upgrade_factor; a tier-upgrade grant in the mc_settling_upgrade_months months before the date of handling but none in the last mc_recent_upgrade_months months multiplies it by mc_settling_upgrade_factor; with no tier-upgrade grant in the last mc_settling_upgrade_months months the credit keeps mc_settled_tier_factor. The repair-to-replace credit adds to the member install credit according to the repair_parts and repair_labor charges billed on the homeowner''s Harbison service calls in the mc_repair_window_months months before the date of handling, counted before any member discount: where they total at least mc_repair_high_usd, the credit is every repair_labor charge billed in that window; where they total at least mc_repair_mid_usd but less than mc_repair_high_usd, the credit is the most recently posted repair_labor charge, the labor line of the latest repair; where they total less than mc_repair_mid_usd, no repair-to-replace credit is given. The member install credit is worked out in this order: the tier''s install_credit_usd, the tenure bonus and the covered-systems bonus are added together; that sum is multiplied by the standing factor and the result by the tier-age factor; the repair-to-replace credit is added last, and only the final amount is rounded to the cent half up. The member install credit stacks with the manufacturer rebate and the multi-system discount, all three applying to the contract price independently, and it is given once per project.'
