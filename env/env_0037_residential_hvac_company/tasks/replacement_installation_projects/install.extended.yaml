    dp_term_start: 'The seasonal-upkeep factor of the contract deposit counts only tune-up visits completed on the Comfort Club agreement, never a visit forfeited for a missed or late-cancelled appointment, and counts them in one of three ways: for an agreement in active status billed annually, the completed tune-up visits of its current agreement term, from its term_start; for an agreement in active status billed monthly, the completed tune-up visits in the dp_upkeep_window_months months before the date of handling; for a homeowner with no agreement in active status, no visits are counted and the factor is dp_no_upkeep_factor. On that count, dp_kept_visits_high or more completed visits multiply the percentage deposit by dp_high_upkeep_factor, at least dp_kept_visits_low but fewer than dp_kept_visits_high multiply it by dp_low_upkeep_factor, and fewer than dp_kept_visits_low keep dp_no_upkeep_factor.'
    dp_term_visits: 'The seasonal-upkeep factor of the contract deposit counts only tune-up visits completed on the Comfort Club agreement, never a visit forfeited for a missed or late-cancelled appointment, and counts them in one of three ways: for an agreement in active status billed annually, the completed tune-up visits of its current agreement term, from its term_start; for an agreement in active status billed monthly, the completed tune-up visits in the dp_upkeep_window_months months before the date of handling; for a homeowner with no agreement in active status, no visits are counted and the factor is dp_no_upkeep_factor. On that count, dp_kept_visits_high or more completed visits multiply the percentage deposit by dp_high_upkeep_factor, at least dp_kept_visits_low but fewer than dp_kept_visits_high multiply it by dp_low_upkeep_factor, and fewer than dp_kept_visits_low keep dp_no_upkeep_factor.'
    dp_rolling_visits: 'The seasonal-upkeep factor of the contract deposit counts only tune-up visits completed on the Comfort Club agreement, never a visit forfeited for a missed or late-cancelled appointment, and counts them in one of three ways: for an agreement in active status billed annually, the completed tune-up visits of its current agreement term, from its term_start; for an agreement in active status billed monthly, the completed tune-up visits in the dp_upkeep_window_months months before the date of handling; for a homeowner with no agreement in active status, no visits are counted and the factor is dp_no_upkeep_factor. On that count, dp_kept_visits_high or more completed visits multiply the percentage deposit by dp_high_upkeep_factor, at least dp_kept_visits_low but fewer than dp_kept_visits_high multiply it by dp_low_upkeep_factor, and fewer than dp_kept_visits_low keep dp_no_upkeep_factor.'
    dp_upkeep: 'The seasonal-upkeep factor of the contract deposit counts only tune-up visits completed on the Comfort Club agreement, never a visit forfeited for a missed or late-cancelled appointment, and counts them in one of three ways: for an agreement in active status billed annually, the completed tune-up visits of its current agreement term, from its term_start; for an agreement in active status billed monthly, the completed tune-up visits in the dp_upkeep_window_months months before the date of handling; for a homeowner with no agreement in active status, no visits are counted and the factor is dp_no_upkeep_factor. On that count, dp_kept_visits_high or more completed visits multiply the percentage deposit by dp_high_upkeep_factor, at least dp_kept_visits_low but fewer than dp_kept_visits_high multiply it by dp_low_upkeep_factor, and fewer than dp_kept_visits_low keep dp_no_upkeep_factor.'
    dp_pct_amount: 'The contract deposit is worked out in this order: the deposit rate is applied to the net price, that amount is multiplied by the seasonal-upkeep factor and rounded to the cent half up, and the higher of it and deposit_min_usd is taken; the protection-upgrade share and the air-quality accessory share, each rounded to the cent half up, are then added.'
    dp_upgrade_name: 'The protection-upgrade share of the contract deposit collects part of any labor-warranty upgrade charged on the contract: an upgrade to the Harbison 12-Year Total Protection or the Harbison 12-Year Total Protection Plus is collected at dp_total_upgrade_share_pct percent of its charge, an upgrade to any other protection tier at dp_other_upgrade_share_pct percent, and a contract with no upgrade adds nothing.'
    dp_upgrade_charge: 'The protection-upgrade share of the contract deposit collects part of any labor-warranty upgrade charged on the contract: an upgrade to the Harbison 12-Year Total Protection or the Harbison 12-Year Total Protection Plus is collected at dp_total_upgrade_share_pct percent of its charge, an upgrade to any other protection tier at dp_other_upgrade_share_pct percent, and a contract with no upgrade adds nothing.'
    dp_upgrade_share: 'The protection-upgrade share of the contract deposit collects part of any labor-warranty upgrade charged on the contract: an upgrade to the Harbison 12-Year Total Protection or the Harbison 12-Year Total Protection Plus is collected at dp_total_upgrade_share_pct percent of its charge, an upgrade to any other protection tier at dp_other_upgrade_share_pct percent, and a contract with no upgrade adds nothing.'
    dp_iaq_total: 'The air-quality accessory share of the contract deposit collects special-order air-quality accessories with the deposit, taken on the total of every uv_germicidal_light, media_air_cleaner and steam_humidifier charge on the contract: a total of dp_premium_iaq_usd or more is collected at dp_premium_iaq_share_pct percent, a total above zero but below dp_premium_iaq_usd at dp_iaq_share_pct percent, and a contract with none of those accessories adds nothing.'
    dp_iaq_share: 'The air-quality accessory share of the contract deposit collects special-order air-quality accessories with the deposit, taken on the total of every uv_germicidal_light, media_air_cleaner and steam_humidifier charge on the contract: a total of dp_premium_iaq_usd or more is collected at dp_premium_iaq_share_pct percent, a total above zero but below dp_premium_iaq_usd at dp_iaq_share_pct percent, and a contract with none of those accessories adds nothing.'
    result: 'The contract deposit is worked out in this order: the deposit rate is applied to the net price, that amount is multiplied by the seasonal-upkeep factor and rounded to the cent half up, and the higher of it and deposit_min_usd is taken; the protection-upgrade share and the air-quality accessory share, each rounded to the cent half up, are then added.'
  factors:
  - id: deposit_rate
    effect: parameter
    decides: dp_pct
    bindings:
    - dp_status
    - dp_tier
    - dp_pct
    ladder:
    - when: a Comfort Club agreement in active status on the Comfort Club Platinum, Platinum Plus or Total Home tier
      value: a deposit rate of dp_premier_member_pct percent of the net price
    - when: a Comfort Club agreement in active status on any other tier
      value: a deposit rate of dp_member_pct percent of the net price
    - when: otherwise (no Comfort Club agreement in active status)
      value: the package's deposit_pct
    baseline:
      dp_pct: P('deposit_pct')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: plan
  - id: seasonal_upkeep_factor
    effect: method
    decides: dp_upkeep
    bindings:
    - dp_billing
    - dp_term_start
    - dp_term_visits
    - dp_rolling_visits
    - dp_upkeep
    ladder:
    - when: a Comfort Club agreement in active status billed annually
      method: completed tune-up visits are counted over the agreement's current term from its term_start, and that count sets the factor (dp_kept_visits_high or more -> dp_high_upkeep_factor, dp_kept_visits_low or more -> dp_low_upkeep_factor, else dp_no_upkeep_factor)
    - when: a Comfort Club agreement in active status billed monthly
      method: completed tune-up visits are counted over the dp_upkeep_window_months months before the date of handling, and that count sets the factor on the same thresholds
    - when: otherwise (no Comfort Club agreement in active status)
      method: no visits are counted; the factor is dp_no_upkeep_factor
    baseline:
      dp_upkeep: K('dp_no_upkeep_factor')
    evidence:
    - cross_category
    - history
    cross_difficulty: plan
  - id: protection_upgrade_share
    effect: parameter
    decides: dp_upgrade_share
    bindings:
    - dp_upgrade_name
    - dp_upgrade_charge
    - dp_upgrade_share
    ladder:
    - when: a labor-warranty upgrade to the Harbison 12-Year Total Protection or Total Protection Plus on the contract
      value: dp_total_upgrade_share_pct percent of the upgrade charge collected with the deposit
    - when: a labor-warranty upgrade to any other protection tier on the contract
      value: dp_other_upgrade_share_pct percent of the upgrade charge collected with the deposit
    - when: otherwise (no labor-warranty upgrade on the contract)
      value: nothing collected for an upgrade
    baseline:
      dp_upgrade_share: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: air_quality_accessory_share
    effect: parameter
    decides: dp_iaq_share
    bindings:
    - dp_iaq_total
    - dp_iaq_share
    ladder:
    - when: uv_germicidal_light, media_air_cleaner and steam_humidifier charges on the contract total dp_premium_iaq_usd or more
      value: dp_premium_iaq_share_pct percent of that total collected with the deposit
    - when: those charges total above zero but below dp_premium_iaq_usd
      value: dp_iaq_share_pct percent of that total collected with the deposit
    - when: otherwise (no air-quality accessory on the contract)
      value: nothing collected for accessories
    baseline:
      dp_iaq_share: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The contract deposit is the higher of deposit_min_usd and deposit_pct of the contract's net price, which is the contract-price charge plus every accessory charge, less every member install credit, accessory member discount, manufacturer rebate and multi-system discount posted on the project, rounded to the cent half up.
    params:
    - deposit_pct
    - deposit_min_usd
  inputs:
    history:
    - table: install_ledger
      aggregate: sum
      field: amount
      filters:
        line_type: contract_price
    - table: install_ledger
      aggregate: sum
      field: amount
      filters:
        line_type: accessory
    - table: install_ledger
      aggregate: sum
      field: amount
      filters:
        line_type: member_install_credit
    - table: install_ledger
      aggregate: sum
      field: amount
      filters:
        line_type: accessory_member_discount
    - category: plan
      table: plan_service_entries
      aggregate: count
      field: service_entry_id
      filters:
        event_type: plan_tuneup_visit
        entry_reason: completed_visit
        term_start: <agreement term_start>
    - category: plan
      table: plan_service_entries
      aggregate: count
      field: service_entry_id
      within_months: 12
      filters:
        event_type: plan_tuneup_visit
        entry_reason: completed_visit
    cross_category:
    - plan
