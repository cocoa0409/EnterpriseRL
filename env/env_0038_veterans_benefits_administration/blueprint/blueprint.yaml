name: env_0038_veterans_benefits_administration
company: Veterans Benefits Administration

background: |
  The Veterans Benefits Administration is the benefits arm of the U.S. Department of Veterans Affairs, paying monetary benefits to roughly six million veterans, survivors and dependents through regional offices, the Debt Management Center, the Regional Loan Centers and a national contact center whose Veterans Service Representatives speak in a plain, respectful and patient register.
  Disability Compensation is held as one award per veteran at a combined service-connected rating, from Disability Compensation (10% Combined Rating) through Disability Compensation (100% Combined Rating) in ten-point steps, and is booked as monthly payments in arrears, retroactive releases, rating decisions, claims and intents to file, and dependents added to or removed from the award.
  Veterans Pension is held by wartime veterans with limited income as Veterans Pension (Basic Rate, No Dependents), Veterans Pension (Basic Rate, One Dependent), Veterans Pension (Housebound, No Dependents), Veterans Pension (Housebound, One Dependent), Veterans Pension (Aid and Attendance, No Dependents) or Veterans Pension (Aid and Attendance, One Dependent), and is booked as monthly payments alongside income, medical expense and asset reports, data-match findings and rate adjustments.
  Education benefits are held one record per chapter - Montgomery GI Bill - Selected Reserve (Chapter 1606), Survivors' and Dependents' Educational Assistance (Chapter 35), Montgomery GI Bill - Active Duty (Chapter 30), and the Post-9/11 GI Bill (Chapter 33) at the 60%, 70%, 80%, 90% and 100% Benefit Levels - each carrying a balance of entitlement days.
  Schools certify each term's enrollment, and education is booked as tuition paid to schools, monthly housing allowances, books stipends and flat monthly payments to students, monthly enrollment verifications, enrollment amendments, and entitlement charged and restored.
  The VA Home Loan Guaranty backs loans made by private lenders and VA's own direct loans in seven programs: VA Interest Rate Reduction Refinance Loan (IRRRL), VA Manufactured Home Loan, VA Purchase Loan (10% or More Down), VA Purchase Loan (5% to Less Than 10% Down), VA Purchase Loan (Less Than 5% Down), VA Cash-Out Refinance Loan and Native American Direct Loan (NADL).
  Each guaranteed loan is booked with its funding fee and any refund, the entitlement charged and restored, servicer default reports, partial claims and guaranty claims.
  Overpayments and paid guaranty claims become debts at the Debt Management Center, typed as Education Overpayment (Chapters 30, 35 and 1606), Post-9/11 GI Bill Housing and Books Overpayment, Post-9/11 GI Bill Tuition and Fees Overpayment, Disability Compensation Overpayment, Veterans Pension Overpayment or Home Loan Guaranty Debt, each with a running balance moved by benefit offsets, direct payments, credits, interest and the debtor's waiver, dispute, compromise and repayment requests.
  Claimants who disagree with a decision hold reviews in the Supplemental Claim, Higher-Level Review, Higher-Level Review with Informal Conference, Board Appeal - Direct Review Docket, Board Appeal - Evidence Submission Docket and Board Appeal - Hearing Docket lanes, each booked with its evidence, conferences, hearings and decisions.
  Separated service members keep life insurance as VGLI $50,000 Coverage through VGLI $500,000 Coverage, booked as premiums by age band, refunds, beneficiary designations and benefits paid.
  Surviving spouses hold Dependency and Indemnity Compensation as DIC Surviving Spouse (Basic Rate), DIC Surviving Spouse (Basic Rate with 8-Year Provision), DIC Surviving Spouse (Housebound), DIC Surviving Spouse (Housebound with 8-Year Provision), DIC Surviving Spouse (Aid and Attendance) or DIC Surviving Spouse (Aid and Attendance with 8-Year Provision), booked as monthly payments and children added and removed.
  Most callers are veterans of the Gulf War, Post-9/11 and Vietnam eras who hold a compensation award and often a VA home loan, education benefits or a debt at the same time; older wartime veterans call about pension, students and their parents call about GI Bill payments, and surviving spouses call about DIC and the benefits their late spouse held.
  They bring years of history with them - rating decisions and pending claims, dependents who married, divorced, aged out or left school, terms dropped mid-semester, loans refinanced or sold, letters about debts they did not expect, and payments that arrived late, came back or stopped.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: comp_dependents_claims_and_payments
    claim:
      categories: [comp]
      event_types: [comp_intent_to_file, comp_claim_filed, comp_claim_withdrawn, comp_hearing_requested, comp_dependent_added, comp_dependent_removed, comp_payment_profile_updated, comp_payment_reissued, comp_retro_payment, comp_award_resumed]
    summary: >-
      Veterans holding a Disability Compensation award call because a spouse, child, school child or parent must be added
      or removed after a marriage, divorce, birth, death, birthday or the end of school, because a monthly payment came back,
      went to a closed account or was withheld while the award was suspended, because they want to protect a date of claim,
      file or withdraw a claim, or answer a proposed reduction; the setting varies with the combined rating tier, the award
      status, the dependents already recorded and their dates of birth and events, the payment history month by month, and
      whether the veteran also holds Veterans Pension, has a child paid Chapter 35, or owes a VA debt. The records involved
      are the award, its payments, rating decisions and notices, claims and intents to file, and dependency actions; the
      governing rules include the tier-dependent additions and the payability gate in comp_monthly_entitlement and
      comp_evt_dependency_add, the effective-date and payment-start rules in comp_payment_schedule, the removal and
      overpayment rules in comp_evt_dependency_remove, the intent-to-file window and channel limits in
      comp_evt_intent_and_claims, the due-process windows in comp_evt_reduction_due_process, the suspension and release
      rules in comp_evt_suspension and the return and reissue rules in comp_evt_payment_return, while in the domain's
      natural course a claim is filed before it is decided and a payment is issued before it can come back. Recording an
      intent to file, a dependency report, a hearing request, a reissue or a resumption is the representative's service
      action on a verified caller, whereas withdrawing a claim, changing the payment account and electing between
      compensation and pension are the veteran's own acts that the representative hands over to the veteran. Apportionment
      requests by an incarcerated veteran's family, elections between compensation and pension, original claims from
      someone who holds no award, and anything a rating specialist must weigh on medical evidence fall outside what the
      published rules let a representative decide and go to a human representative as POLICY_NOT_COVERED.

  - name: pension_income_and_rate_adjustments
    claim:
      categories: [pension]
      event_types: [pension_income_change_reported, pension_medical_expenses_reported, pension_asset_transfer_reported, pension_rate_adjusted, pension_financials_updated, pension_rate_category_changed, pension_payment_profile_updated, pension_retro_payment]
    summary: >-
      Wartime veterans receiving Veterans Pension, and family members helping them, call to report that Social Security,
      a retirement annuity, wages or a spouse's income changed, to report unreimbursed medical expenses such as assisted
      living or insurance premiums, to disclose a gift or sale of assets, to answer an income-match letter, or to ask why
      the monthly amount went up or down; the setting varies with the rate category (basic, housebound or aid and
      attendance, with or without a dependent), the income and expenses already on the award, net worth, Medicaid
      nursing-home status, the timing of each change against the payments already issued, and whether the veteran also
      holds a compensation award or an outstanding debt. The records involved are the pension award, its payments, and the
      income, expense, asset and adjustment reports; the governing rules are the income-for-value computation and medical
      deduction in pension_rate_computation, the effective dates and overpayment consequences in pension_evt_income_change,
      the expense reporting window in pension_evt_medical_expenses, the net worth limit and look-back penalty in
      pension_evt_net_worth_and_transfers, the due-process period in pension_evt_income_match, the Medicaid limit in
      pension_evt_medicaid_nursing_home and the care-level and dependent rules in pension_evt_care_and_dependents, with
      the natural order that a change happens, is reported or matched, and is then adjusted and paid. Taking a report and
      recording the resulting adjustment are the representative's service actions on a verified caller, while the
      veteran's own written election between pension and compensation, a change of payment account and any statement only
      the veteran can make about their finances are acts the veteran performs. Questions about Survivors Pension, about
      original eligibility for someone with no pension award, or about hardship relief beyond the published rules, and any
      decision that requires a medical determination, are not covered and are transferred as POLICY_NOT_COVERED.

  - name: edu_enrollment_payments_and_changes
    claim:
      categories: [edu]
      event_types: [edu_enrollment_verified, edu_housing_payment, edu_monthly_benefit_payment, edu_books_stipend_payment, edu_enrollment_amended, edu_entitlement_restored, edu_school_profile_updated, edu_benefit_relinquished]
    summary: >-
      Students and student veterans call because a monthly housing allowance or flat monthly payment did not arrive, was
      smaller than expected, or stopped, because they dropped a class or withdrew mid-term and want to know what they now
      owe, because their school closed, or because they want to switch chapters; the setting varies with the chapter and
      benefit level held, the term certified (credits, rate of pursuit, online or in person, the campus housing rate),
      which months have been verified, the payments already issued, the entitlement remaining across every chapter they
      hold, and whether they are a Chapter 35 child whose sponsor holds a compensation award. The records involved are the
      education benefits, enrollment certifications, amendments and verifications, payments and the entitlement ledger;
      the governing rules are the tier-dependent tuition, housing and books computations in edu_ch33_tuition,
      edu_ch33_housing and edu_ch33_books, the flat rates in edu_flat_rate_monthly, the verification gate and suspension
      in edu_evt_monthly_verification, the effective dates, mitigating circumstances and debt routing in
      edu_evt_enrollment_change, the charging and restoration rules in edu_entitlement_charging, the cross-chapter cap in
      edu_agg_combined_cap and the election rules in edu_excl_chapter_election, with the natural order that a school
      certifies a term, the student attends and verifies each month, and payment follows. Releasing a verified month's
      payment, recording an amendment's consequences and restoring entitlement are the representative's service actions,
      while verifying attendance and irrevocably relinquishing a chapter are statements and elections only the student
      can make and are handed over to the student. Requests to change what a school certified, to transfer entitlement to
      a family member, to reissue a returned student payment, or to excuse a withdrawal on grounds the rules do not list
      are not covered and go to a human representative as POLICY_NOT_COVERED.

  - name: loan_funding_fee_and_entitlement
    claim:
      categories: [loan]
      event_types: [loan_exemption_updated, loan_funding_fee_refunded, loan_entitlement_restored, loan_assumed_with_release, loan_partial_claim_paid, loan_servicing_updated]
    summary: >-
      Veterans with one or more VA home loans call because they were later awarded disability compensation and believe a
      funding fee they paid should come back, because they sold or refinanced a home and want entitlement restored for the
      next purchase, because a buyer is assuming their loan, or because they have fallen behind and want to know about a
      partial claim; the setting varies with the loan program and down-payment band, first or subsequent use, the closing
      date against the effective date of any compensation award, the loan's status, the entitlement charged across every
      loan they hold and earlier one-time restorations. The records involved are the loans, their money transactions and
      entitlement actions, read together with the compensation award; the governing rules are the program fee tables in
      loan_funding_fee, the exemption test in loan_evt_exemption_from_compensation, the refund conditions in
      loan_evt_funding_fee_refund, the entitlement arithmetic in loan_agg_entitlement, the restoration conditions in
      loan_evt_entitlement_restoration, the assumption terms in loan_evt_assumption and the default and partial claim
      limits in loan_evt_default_servicing, with the natural order that a loan closes with or without a fee, a later
      award may change the exemption, and only a recognized exemption is refunded. Correcting an exemption, refunding a
      fee, restoring entitlement and recording a partial claim are the representative's service actions on a verified
      caller, while asking to be released from liability on a sale and choosing to dispose of the property are the
      veteran's own acts. Approving a lender's repayment plan or modification, deciding creditworthiness of a buyer,
      questions on a loan VA did not guarantee, and grievances with a lender's closing costs are not covered and go to a
      human representative as POLICY_NOT_COVERED.

  - name: debt_waivers_disputes_and_repayment
    claim:
      categories: [debt]
      event_types: [debt_waiver_requested, debt_dispute_filed, debt_compromise_offered, debt_repayment_plan_requested, debt_collection_held, debt_plan_started, debt_payment_received, debt_overcollection_refunded]
    summary: >-
      Beneficiaries call after receiving a letter about a VA debt, or after money went missing from a compensation, pension
      or education payment, to ask why they owe, to have the debt forgiven, to say the debt is wrong, to offer a smaller
      lump sum, to set up monthly payments or lower withholding, or to pay; the setting varies with the debt type, the
      notice date and how long ago it was, the balance and what has already been collected and from which benefit, any
      fraud finding, other open debts, earlier requests and their outcomes, and whether a running benefit award exists to
      offset. The records involved are the debts, their transactions and the debtor's requests and decisions, read
      together with the originating benefit records; the governing rules are the collection order across debts in
      debt_agg_collection_order, the offset start and status gates in debt_evt_offset, the tier-dependent waiver window,
      collection hold and refund rules in debt_evt_waiver, the dispute rules in debt_evt_dispute, the plan limits and
      formula in debt_evt_repayment_plan, the compromise authority in debt_evt_compromise, the one-pending-request limit
      in debt_excl_single_pending_request, interest in debt_evt_interest and referral in debt_evt_treasury_referral, with
      the natural order that a debt is established and noticed before it is collected and that a request is received
      before it is decided. Recording a request, holding collection for a timely request, starting an approved plan,
      taking a payment and refunding an overcollection are the representative's service actions on a verified caller,
      while signing a waiver request with its Financial Status Report, offering a compromise and authorizing a payment
      are the debtor's own acts. Debts already referred to Treasury, compromises beyond VA's authority, debts of schools
      rather than students, bankruptcy questions and requests to stop collection on grounds the rules do not list are not
      covered and go to a human representative as POLICY_NOT_COVERED.
