events:
  - type: appeal_review_requested
    target: decision_reviews
    mutation: create
    meaning: A claimant asks for review of a decision on one issue in a chosen lane.
    grain: one row per issue per lane request
    fields:
      customer_id: The claimant.
      variant_name: Lane chosen.
      status: Set to submitted.
      benefit_line: Benefit line of the decision.
      contested_decision_id: Decision under review.
      issue_name: Issue contested.
      decision_notice_date: Notice date of the decision.
      received_date: Date received.
      prior_review_id: Earlier review continuously pursued, or empty.
      hearing_type: Hearing type requested, or none.
      advanced_on_docket: Always false at request.
      decision_outcome: Always pending.
      opened_date: Date recorded.
    triggers: []

  - type: appeal_review_established
    target: decision_reviews
    mutation: {transition: {from: submitted, to: pending}}
    meaning: The request is complete and established in its lane.
    grain: one row per transaction
    fields:
      status: Set to pending.
    triggers: []

  - type: appeal_review_decided
    target: decision_reviews
    mutation: {transition: {from: pending, to: decided}}
    meaning: The review is decided.
    grain: one row per transaction
    fields:
      status: Set to decided.
      decision_outcome: Result.
      decided_date: Decision date.
      closed_date: Decision date.
    triggers: []

  - type: appeal_review_withdrawn
    target: decision_reviews
    mutation: {transition: [{from: submitted, to: withdrawn}, {from: pending, to: withdrawn}]}
    meaning: The claimant withdraws the review before a decision.
    grain: one row per transaction
    fields:
      status: Set to withdrawn.
      closed_date: Withdrawal date.
    triggers: []

  - type: appeal_docket_changed
    target: decision_reviews
    mutation: update
    meaning: A Board appeal is moved to a different docket, or advanced on the docket.
    grain: one row per transaction
    fields:
      variant_name: New docket.
      hearing_type: Hearing type for the Hearing Docket, otherwise none.
      advanced_on_docket: Whether the appeal is advanced on the docket.
    triggers: []

  - type: appeal_evidence_submitted
    target: appeal_actions
    meaning: The claimant submits evidence for a review.
    grain: one row per evidence kind per receipt date
    distinguish_by: [action_date, evidence_kind]
    fields:
      review_id: Review.
      customer_id: Claimant.
      action_date: Date received.
      evidence_kind: Kind of evidence.
      within_evidence_window: Whether inside the Board docket's window (true for regional office lanes that take evidence).
    triggers: []

  - type: appeal_informal_conference_held
    target: appeal_actions
    meaning: The senior reviewer holds the telephone informal conference.
    grain: one row per conference
    distinguish_by: [action_date]
    fields:
      review_id: Review.
      customer_id: Claimant.
      action_date: Conference date.
    triggers: []

  - type: appeal_hearing_held
    target: appeal_actions
    meaning: A Veterans Law Judge holds the Board hearing.
    grain: one row per hearing
    distinguish_by: [action_date]
    fields:
      review_id: Review.
      customer_id: Claimant.
      action_date: Hearing date.
      hearing_type: Hearing type held.
    triggers: []

  - type: appeal_decision_issued
    target: appeal_actions
    meaning: The decision on the review is issued.
    grain: one row per review decided
    distinguish_by: [action_date, outcome]
    fields:
      review_id: Review.
      customer_id: Claimant.
      action_date: Decision date.
      outcome: Result.
    triggers:
      - event: appeal:appeal_review_decided
        map: {decision_outcome: outcome, decided_date: action_date, closed_date: action_date}

  - type: appeal_dta_error_found
    target: appeal_actions
    meaning: The reviewer finds a duty-to-assist error made before the decision under review and returns the issue for correction.
    grain: one row per error found
    distinguish_by: [action_date, dta_error_kind]
    fields:
      review_id: Review.
      customer_id: Claimant.
      action_date: Date found.
      dta_error_kind: Kind of error.
    triggers: []

measures:
  - id: appeal_msr_open_reviews_same_issue
    window: Current state.
    measure: Count of the claimant's decision reviews with the same contested_decision_id and issue_name whose status is submitted or pending.

policies:
  - id: appeal_agg_multi_holding
    subject: [appeal_review_requested]
    rule: >-
      A claimant may have several reviews open at once, on different issues and in different lanes, with no limit on the
      number; each issue of a decision may be placed in its own lane. One issue is never pending in two lanes at the same
      time (appeal_msr_open_reviews_same_issue): a review is recorded only when no review of the same issue of the same decision is submitted or pending.
    eligibility:
      - id: one_open_lane_per_issue
        applies_to: [appeal_review_requested]
        kind: dedup
        condition: a review is recorded only when no review of the same issue of the same decision is submitted or pending
        evidence_fields: [decision_reviews.contested_decision_id, decision_reviews.issue_name, decision_reviews.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [decision_reviews.contested_decision_id, decision_reviews.issue_name]
          action_bindings:
            decision_reviews.contested_decision_id: contested_decision_id
            decision_reviews.issue_name: issue_name
        dedup_contract:
          table: decision_reviews
          mode: separate_record
          object_bindings: {contested_decision_id: contested_decision_id, issue_name: issue_name}
          duplicate_filters: {status: [submitted, pending]}
          distinct_fields: [variant_name]
    params:
      max_per_customer: null
      concurrent_lanes_same_issue: =concurrent_lanes_same_issue
      issue_level_lane_choice: =issue_level_lane_choice
    measures: [appeal_msr_open_reviews_same_issue]

  - id: appeal_agg_continuous_pursuit
    subject: [appeal_review_requested, appeal_review_decided]
    rule: >-
      When a claimant files the next review lane on an issue within continuous_pursuit_window_days days after the earlier
      review decision, the chain of reviews is continuous and any grant is effective as of the original claim's date of
      claim; a chain broken by a late filing keeps only the date of the new supplemental claim. Each request in a chain
      cites the review it continues.
    eligibility: []
    params:
      continuous_pursuit_window_days: =continuous_pursuit_window_days
      effective_date_protection: =effective_date_protection

  - id: appeal_evt_filing_window
    subject: [appeal_review_requested]
    rule: >-
      A Higher-Level Review or Board appeal is accepted only if it is received not later than filing_window_days calendar days after the date of the notice of the decision under review. Count calendar days starting the day after the notice date; a request received on the last day is timely.
      A supplemental claim may be filed at any time, but only one filed within that window keeps the effective date. A
      contested claim must be filed within contested_claim_window_days days. A late request may be accepted only on a
      showing of good cause decided by the Board or the regional office, never on a service call. The request is made on
      the lane's required form and signed by the claimant.
    eligibility:
      - id: timely_request
        applies_to: [appeal_review_requested]
        kind: time
        condition: A Higher-Level Review or Board appeal is accepted only if it is received not later than filing_window_days calendar days after the date of the notice of the decision under review.
        evidence_fields: [decision_reviews.decision_notice_date, decision_reviews.contested_decision_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [decision_reviews.contested_decision_id]
          action_bindings:
            decision_reviews.contested_decision_id: contested_decision_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the notice of the decision under review
          anchor_source: decision_reviews.decision_notice_date
          relation: not_after
          duration_source: variants.filing_window_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after the notice date; a request received on the last day is timely.
          boundary: inclusive
    params:
      filing_window_days: =filing_window_days
      contested_claim_window_days: =contested_claim_window_days
      filing_extension_for_good_cause: =filing_extension_for_good_cause
      required_form: =required_form
      filing_fee: =filing_fee
      itf_applies: =itf_applies

  - id: appeal_evt_lane_rules
    subject: [appeal_review_requested, appeal_evidence_submitted, appeal_review_decided]
    rule: >-
      Each lane decides on its own record: a supplemental claim needs new and relevant evidence and VA helps gather it; a
      Higher-Level Review is a new look by a senior reviewer at the same evidence and takes no new evidence; a Board
      appeal on the Direct Review Docket takes no new evidence, while the Evidence Submission and Hearing Dockets take
      evidence only within their window. A Higher-Level Review cannot be requested on a Higher-Level Review decision or on
      a Board decision for the same issue; after a Board decision only a supplemental claim (or an appeal to the Court of
      Appeals for Veterans Claims within court_appeal_window_days days) is available. A reviewer who finds a pre-decisional
      duty-to-assist error returns the issue for correction and priority readjudication. Decision goals by lane are
      decision_goal_days.
    eligibility: []
    params:
      per_tier:
        Supplemental Claim: {new_evidence_allowed: =new_evidence_allowed, duty_to_assist_applies: =duty_to_assist_applies, decision_goal_days: =decision_goal_days, reviewer_level: =reviewer_level}
        Higher-Level Review: {new_evidence_allowed: =new_evidence_allowed, duty_to_assist_applies: =duty_to_assist_applies, decision_goal_days: =decision_goal_days, reviewer_level: =reviewer_level}
        Higher-Level Review with Informal Conference: {new_evidence_allowed: =new_evidence_allowed, duty_to_assist_applies: =duty_to_assist_applies, decision_goal_days: =decision_goal_days, reviewer_level: =reviewer_level}
        Board Appeal - Direct Review Docket: {new_evidence_allowed: =new_evidence_allowed, duty_to_assist_applies: =duty_to_assist_applies, decision_goal_days: =decision_goal_days, reviewer_level: =reviewer_level}
        Board Appeal - Evidence Submission Docket: {new_evidence_allowed: =new_evidence_allowed, duty_to_assist_applies: =duty_to_assist_applies, decision_goal_days: =decision_goal_days, reviewer_level: =reviewer_level}
        Board Appeal - Hearing Docket: {new_evidence_allowed: =new_evidence_allowed, duty_to_assist_applies: =duty_to_assist_applies, decision_goal_days: =decision_goal_days, reviewer_level: =reviewer_level}
      new_and_relevant_standard: =new_and_relevant_standard
      remand_on_dta_error: =remand_on_dta_error
      remand_priority: =remand_priority
      court_appeal_window_days: =court_appeal_window_days
      de_novo_review: =de_novo_review
      decided_by_original_adjudicator: =decided_by_original_adjudicator
      sc_readjudication_basis: =sc_readjudication_basis
      board_review_scope: =board_review_scope
      evidence_kinds_accepted: =evidence_kinds_accepted
      medical_exam_may_be_ordered: =medical_exam_may_be_ordered

  - id: appeal_excl_lane_sequence
    subject: [appeal_review_requested]
    rule: >-
      The lane chosen must be one allowed after the decision being reviewed: a lane whose may_follow_same_lane is false
      cannot review a decision issued in that same lane, and only a lane whose allowed_after_board_decision is true can
      follow a Board decision. A claimant can never hold a Higher-Level Review and a supplemental claim on the same issue
      at the same time.
    eligibility: []
    params:
      per_tier:
        Supplemental Claim: {may_follow_same_lane: =may_follow_same_lane, allowed_after_board_decision: =allowed_after_board_decision}
        Higher-Level Review: {may_follow_same_lane: =may_follow_same_lane, allowed_after_board_decision: =allowed_after_board_decision}
        Higher-Level Review with Informal Conference: {may_follow_same_lane: =may_follow_same_lane, allowed_after_board_decision: =allowed_after_board_decision}
        Board Appeal - Direct Review Docket: {may_follow_same_lane: =may_follow_same_lane, allowed_after_board_decision: =allowed_after_board_decision}
        Board Appeal - Evidence Submission Docket: {may_follow_same_lane: =may_follow_same_lane, allowed_after_board_decision: =allowed_after_board_decision}
        Board Appeal - Hearing Docket: {may_follow_same_lane: =may_follow_same_lane, allowed_after_board_decision: =allowed_after_board_decision}

  - id: appeal_evt_evidence_window
    subject: [appeal_evidence_submitted]
    rule: >-
      On the Evidence Submission Docket, evidence counts only if it is received within evidence_window_days days after the
      Board receives the notice of disagreement; on the Hearing Docket, only at the hearing or within evidence_window_days
      days after it. Evidence received outside the window is not considered by the Board and may instead support a new
      supplemental claim. Lanes that take no evidence never record evidence as considered.
    eligibility: []
    params:
      per_tier:
        Supplemental Claim: {evidence_window_days: =evidence_window_days, evidence_window_anchor: =evidence_window_anchor}
        Higher-Level Review: {evidence_window_days: =evidence_window_days, evidence_window_anchor: =evidence_window_anchor}
        Higher-Level Review with Informal Conference: {evidence_window_days: =evidence_window_days, evidence_window_anchor: =evidence_window_anchor}
        Board Appeal - Direct Review Docket: {evidence_window_days: =evidence_window_days, evidence_window_anchor: =evidence_window_anchor}
        Board Appeal - Evidence Submission Docket: {evidence_window_days: =evidence_window_days, evidence_window_anchor: =evidence_window_anchor}
        Board Appeal - Hearing Docket: {evidence_window_days: =evidence_window_days, evidence_window_anchor: =evidence_window_anchor}
      evidence_outside_window_considered: =evidence_outside_window_considered

  - id: appeal_evt_docket_switch
    subject: [appeal_docket_changed]
    rule: >-
      A Board appellant may move to another docket within docket_switch_window_days days after the Board received the
      notice of disagreement or within one year of the decision notice, whichever is later, and only before any evidence
      or testimony has been submitted on the current docket. An appeal is advanced on the docket when the appellant is
      aod_age_years or older or shows one of the aod_grounds; advancement does not change the docket.
    eligibility: []
    params:
      docket_switch_allowed: =docket_switch_allowed
      docket_switch_window_days: =docket_switch_window_days
      docket_switch_requires_no_evidence_or_testimony: =docket_switch_requires_no_evidence_or_testimony
      aod_age_years: =aod_age_years
      aod_grounds: =aod_grounds

  - id: appeal_evt_conference_and_hearing
    subject: [appeal_informal_conference_held, appeal_hearing_held]
    rule: >-
      A Higher-Level Review with Informal Conference includes one telephone conference in which the claimant or
      representative may point out specific errors but may not present new evidence. A Hearing Docket appeal includes one
      hearing of the requested type before a Veterans Law Judge, which can be rescheduled hearing_reschedule_limit times for
      good cause; a transcript is added to the record. Hearings are scheduled in docket order with advanced appeals first.
    eligibility: []
    params:
      per_tier:
        Supplemental Claim: {informal_conference_available: =informal_conference_available, informal_conference_max_count: =informal_conference_max_count, hearing_available: =hearing_available, hearing_reschedule_limit: =hearing_reschedule_limit}
        Higher-Level Review: {informal_conference_available: =informal_conference_available, informal_conference_max_count: =informal_conference_max_count, hearing_available: =hearing_available, hearing_reschedule_limit: =hearing_reschedule_limit}
        Higher-Level Review with Informal Conference: {informal_conference_available: =informal_conference_available, informal_conference_max_count: =informal_conference_max_count, hearing_available: =hearing_available, hearing_reschedule_limit: =hearing_reschedule_limit}
        Board Appeal - Direct Review Docket: {informal_conference_available: =informal_conference_available, informal_conference_max_count: =informal_conference_max_count, hearing_available: =hearing_available, hearing_reschedule_limit: =hearing_reschedule_limit}
        Board Appeal - Evidence Submission Docket: {informal_conference_available: =informal_conference_available, informal_conference_max_count: =informal_conference_max_count, hearing_available: =hearing_available, hearing_reschedule_limit: =hearing_reschedule_limit}
        Board Appeal - Hearing Docket: {informal_conference_available: =informal_conference_available, informal_conference_max_count: =informal_conference_max_count, hearing_available: =hearing_available, hearing_reschedule_limit: =hearing_reschedule_limit}
      hearing_types: =hearing_types
      transcript_provided: =transcript_provided
      hearing_wait_priority: =hearing_wait_priority
      informal_conference_scope: =informal_conference_scope

  - id: appeal_evt_withdrawal_and_representation
    subject: [appeal_review_withdrawn, appeal_review_established]
    rule: >-
      A claimant may withdraw a review at any time before a decision is issued; withdrawal is the claimant's own act, and
      the decision under review then stands, though another lane can still be chosen within the original filing window.
      An accredited representative may act for the claimant, and an attorney or agent may charge a fee for work after the
      initial decision. A legacy appeal may opt into a new lane within legacy_opt_in_window_days days of a statement of the
      case. Every decision notice lists the review options available next.
    eligibility: []
    params:
      withdrawal_allowed_before_decision: =withdrawal_allowed_before_decision
      representative_allowed: =representative_allowed
      fee_chargeable_by_representative: =fee_chargeable_by_representative
      legacy_opt_in_allowed: =legacy_opt_in_allowed
      legacy_opt_in_window_days: =legacy_opt_in_window_days
      decision_notice_lists_options: =decision_notice_lists_options

  - id: appeal_interact_benefit_effectuation
    subject: [appeal_decision_issued, appeal_dta_error_found]
    rule: >-
      A review only decides the issue; the money follows in the benefit line. A granted review of a compensation,
      pension, education, loan, survivor or insurance decision is carried out by the office that owns that benefit line,
      which issues its own decision and any past-due payment under that line's rules, and a granted review of a debt
      decision changes the debt only through the debt line's own records. A remanded issue is readjudicated by the
      original office.
    eligibility: []
