category: appeal
display_name: Decision Reviews and Appeals

binding:
  holding_table: decision_reviews
  event_tables: [appeal_actions]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [submitted, pending, decided, withdrawn]
  transitions:
    - {from: submitted, to: pending, by: system, means: The review request is accepted as complete and established in the review lane (or docketed at the Board).}
    - {from: pending, to: decided, by: system, means: The reviewer or Veterans Law Judge issues a decision.}
    - {from: submitted, to: withdrawn, by: user, means: The claimant withdraws the request before it is established.}
    - {from: pending, to: withdrawn, by: user, means: The claimant withdraws the review before a decision is issued.}

accounts: []

parameter_schema:
  filing_window_days: Days after the notice of the decision under review within which the request must be received, calendar days.
  contested_claim_window_days: Days within which a request must be filed when another claimant contests the same benefit, calendar days.
  decision_goal_days: VA's published average-days goal for completing a request in this lane, calendar days.
  new_evidence_allowed: Whether the claimant may submit new evidence in this lane, boolean.
  new_and_relevant_standard: Whether the request must identify or include new and relevant evidence, boolean.
  evidence_window_days: Days during which evidence may be submitted on a Board docket, calendar days (0 where evidence is not taken).
  evidence_window_anchor: Event from which the evidence window runs, enum text (not_applicable, notice_of_disagreement_receipt, hearing_date).
  evidence_outside_window_considered: Whether evidence received outside the window is considered on this docket, boolean.
  duty_to_assist_applies: Whether VA must help gather evidence in this lane, boolean.
  medical_exam_may_be_ordered: Whether a VA examination may be ordered in this lane, boolean.
  informal_conference_available: Whether a telephone informal conference with the reviewer is held, boolean.
  informal_conference_max_count: Number of informal conferences held per request, count.
  reviewer_level: Who decides the request, enum text.
  de_novo_review: Whether the review is new and gives no deference to the earlier decision, boolean.
  hearing_available: Whether a hearing before a Veterans Law Judge is held, boolean.
  hearing_types: Hearing types available, list.
  hearing_reschedule_limit: Number of times a scheduled hearing may be rescheduled for good cause, count.
  transcript_provided: Whether a hearing transcript is placed in the record, boolean.
  docket_switch_allowed: Whether the claimant may move the appeal to another Board docket, boolean.
  docket_switch_window_days: Days after the Board receives the notice of disagreement within which a docket switch is allowed (or one year from the decision notice, if later), calendar days.
  docket_switch_requires_no_evidence_or_testimony: Whether a docket switch is barred once evidence or testimony has been submitted on the current docket, boolean.
  required_form: VA form used to request this lane, text.
  continuous_pursuit_window_days: Days after a review decision within which filing the next lane keeps the original effective date, calendar days.
  effective_date_protection: Whether continuous pursuit preserves the effective date of the original claim, boolean.
  may_follow_same_lane: Whether this lane may be chosen again for a decision issued in the same lane on the same issue, boolean.
  allowed_after_board_decision: Whether this lane may be chosen to review a Board decision, boolean.
  withdrawal_allowed_before_decision: Whether the claimant may withdraw the request before a decision, boolean.
  itf_applies: Whether an intent to file can protect the date of a request in this lane, boolean.
  aod_age_years: Age at or above which an appeal is advanced on the Board docket, years.
  aod_grounds: Other grounds on which an appeal is advanced on the docket, list.
  remand_on_dta_error: Whether a pre-decisional duty-to-assist error found in this lane is returned to the regional office for correction, boolean.
  remand_priority: Whether a returned issue is readjudicated with priority, boolean.
  issue_level_lane_choice: Whether each issue in a decision may be placed in a different lane, boolean.
  concurrent_lanes_same_issue: Whether one issue may be pending in two lanes at once, boolean.
  representative_allowed: Whether an accredited representative may act for the claimant, boolean.
  fee_chargeable_by_representative: Whether an accredited attorney or agent may charge a fee for this lane after the initial decision, boolean.
  filing_extension_for_good_cause: Whether the filing deadline may be extended on a showing of good cause filed before or after it, boolean.
  court_appeal_window_days: Days after a Board decision within which an appeal can be filed with the Court of Appeals for Veterans Claims, calendar days (0 for regional office lanes).
  legacy_opt_in_allowed: Whether a legacy appeal can be opted into this lane after a statement of the case, boolean.
  legacy_opt_in_window_days: Days after a statement of the case or supplemental statement of the case within which a legacy appeal may opt in, calendar days.
  decision_notice_lists_options: Whether the decision notice lists every review option available next, boolean.
  filing_fee: Fee to request a review in this lane, USD.
  evidence_kinds_accepted: Evidence kinds accepted in this lane, list.
  board_review_scope: What a Veterans Law Judge reviews on this docket, enum text.
  hearing_wait_priority: Order in which hearings are scheduled, enum text.
  informal_conference_scope: What may be raised in an informal conference, enum text.
  sc_readjudication_basis: Basis on which a supplemental claim is readjudicated, enum text.
  decided_by_original_adjudicator: Whether the person who made the earlier decision may decide the review, boolean.

