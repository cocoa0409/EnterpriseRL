category: comp
display_name: Disability Compensation

binding:
  holding_table: comp_awards
  event_tables: [comp_payments, comp_decisions, comp_claims, comp_dependents]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [authorized, running, suspended, terminated]
  transitions:
    - {from: authorized, to: running, by: system, means: The first monthly payment under a newly authorized award is released and the award becomes a running award.}
    - {from: running, to: suspended, by: agent, means: Payments are suspended because the veteran's whereabouts are unknown, payments keep coming back, or the veteran failed to report for a scheduled examination after due process.}
    - {from: suspended, to: running, by: agent, means: The cause of the suspension is cured (address or payment account confirmed, examination attended) and monthly payments resume.}
    - {from: running, to: terminated, by: agent, means: The award ends because of the veteran's death, severance of service connection, renunciation, or an election to receive pension instead.}
    - {from: suspended, to: terminated, by: agent, means: A suspended award ends for one of the same reasons without first resuming.}

accounts:
  - key: benefits_paid
    unit: USD
    meaning: Net disability compensation actually delivered to the veteran - monthly payments, retroactive releases and reissues credit it, and payments the Treasury returns to VA debit it.

parameter_schema:
  combined_rating_percent: The combined service-connected rating this tier represents, integer percent.
  monthly_rate_veteran_alone: Monthly compensation for a veteran with no recognized dependents at this rating, USD, rates effective December 1, 2025.
  dependents_payable: Whether additional amounts for dependents are payable at this rating, boolean (payable only at 30 percent or higher).
  spouse_addition: Monthly amount added for a recognized spouse, USD.
  child_under_18_addition: Monthly amount added for each recognized child under the child age limit, USD.
  school_child_addition: Monthly amount added for each recognized school child between the school-child minimum age and the school-child age limit, USD.
  spouse_aid_attendance_addition: Monthly amount added when the recognized spouse needs regular aid and attendance, USD, on top of the spouse addition.
  dependent_parent_addition: Monthly amount added for each recognized dependent parent, USD.
  dependent_parent_max_count: Maximum number of dependent parents that can be recognized on one award, count.
  child_age_limit_years: Age at which a child stops being recognized as a minor child, years (removal effective the day before this birthday).
  school_child_min_age_years: Age from which a child attending an approved school can be recognized as a school child, years.
  school_child_age_limit_years: Age at which school-child recognition ends, years (removal effective the day before this birthday).
  smc_k_monthly_addition: Monthly amount of each special monthly compensation (k) award, USD.
  smc_k_max_awards: Maximum number of SMC (k) awards payable together with a schedular rate below the statutory ceiling, count.
  incarcerated_monthly_rate: Monthly amount payable to a veteran from the 61st day of incarceration for a felony, USD (the 10 percent rate, or half of it for a 10 percent rating).
  incarceration_reduction_start_day: Day of continuous felony incarceration from which the reduced rate applies, day count (day 1 is the first day of incarceration).
  incarceration_restoration_notice_days: Days after release within which VA must be notified for full benefits to be restored from the release date, calendar days.
  tdiu_schedular_eligible: Whether a veteran at this combined rating can meet the schedular thresholds for individual unemployability, boolean.
  tdiu_monthly_rate: Monthly amount paid when individual unemployability is granted, USD (equal to the 100 percent veteran-alone rate).
  tdiu_marginal_income_threshold: Annual earned income at or below which employment is treated as marginal and does not bar individual unemployability, USD (federal poverty guideline for one person).
  temporary_total_monthly_rate: Monthly amount paid during a temporary total rating for hospitalization or convalescence, USD.
  hospitalization_temp_total_days: Days of continuous hospitalization for a service-connected disability that trigger a temporary total rating, days (more than this number).
  convalescence_initial_max_months: Maximum length of an initial convalescence temporary total rating, months.
  convalescence_extension_max_months: Maximum additional months by which a convalescence rating can be extended, months.
  itf_validity_days: Days after VA receives an intent to file during which a completed claim takes the intent-to-file date as its date of claim, calendar days.
  post_separation_claim_window_days: Days after release from active duty within which an original claim takes the day after separation as its effective date, calendar days.
  dependency_report_window_days: Days after a marriage, birth or adoption within which a dependency claim takes the event date as its effective date, calendar days.
  increase_lookback_days: Maximum days before the date of claim to which an increase can be made effective when the increase is factually ascertainable, calendar days.
  payment_start_lag_months: Months after the effective date month before the first entitlement month is paid, months (payment begins the first day of the following month).
  payment_day_of_month: Day of the following month on which a monthly payment is issued (moved to the prior business day when it falls on a weekend or federal holiday), day number.
  direct_deposit_change_lead_days: Minimum days before the payment date that a payment account change must be recorded to apply to that payment, calendar days.
  proposed_reduction_response_days: Days after the proposed-reduction notice during which the veteran may submit evidence before a reduction can be implemented, calendar days.
  predetermination_hearing_request_days: Days after the proposed-reduction notice within which a hearing request keeps payments at the current rate until the hearing, calendar days.
  reduction_effective_after_notice_days: Days after notice of the final reduction decision that must expire; the reduction takes effect the last day of the month in which they expire, calendar days.
  rating_protection_years: Years a rating must have been continuously in effect before it can no longer be reduced below that level except for fraud, years.
  rating_stabilization_years: Years a rating must have been in effect before a reduction requires sustained material improvement shown by a full examination, years.
  reexam_exempt_age: Age at or above which a veteran is not scheduled for routine future examinations, years.
  retro_second_signature_threshold: Gross retroactive amount at or above which a second authorizer must sign before release, USD.
  attorney_fee_withholding_pct: Percentage of past-due benefits withheld for direct payment of an accredited attorney or agent under a fee agreement, percent.
  month_of_death_payable: Whether the payment for the month in which the veteran dies is released to the surviving spouse, boolean.
  returned_payments_suspension_count: Number of payments returned within the window that requires suspension until the payee's address or account is confirmed, count.
  returned_payments_window_months: Rolling window over which returned payments are counted for suspension, months.
  combined_rounding_step: Step to which the combined value from the combined ratings table is rounded (values ending in 5 round up), percent.
  bilateral_factor_pct: Percentage of the combined value of bilateral disabilities added before combining with other disabilities, percent.
  school_child_ch35_concurrent: Whether a school child may be paid as a dependent on the award for the same months the child is paid Chapter 35 education benefits, boolean.
  oral_report_reduction_allowed: Whether an oral report by telephone is accepted to reduce or discontinue a dependent addition, boolean.
  oral_report_addition_allowed: Whether an oral report by telephone is accepted to add a dependent, boolean.
  itf_phone_allowed: Whether an intent to file may be recorded through a telephone contact, boolean.
  claim_phone_allowed: Whether a substantive claim (increase, new or secondary condition, individual unemployability) may be filed through a telephone contact, boolean.
  reissue_requires_profile_update: Whether a returned direct-deposit payment is reissued only after the payment account on the award has been updated, boolean.

