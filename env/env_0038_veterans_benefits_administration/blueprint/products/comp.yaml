events:
  - type: comp_award_established
    target: comp_awards
    mutation: create
    meaning: A rating decision grants service connection at a compensable combined rating and VA authorizes a disability compensation award.
    grain: one row per veteran's compensation award
    fields:
      customer_id: The veteran granted compensation.
      variant_name: Official tier name of the combined rating granted.
      effective_date: Effective date of the combined rating granted.
      original_service_connection_date: Effective date of the earliest service connection on the award.
      rating_static: Whether the decision marked the disabilities static.
      permanent_and_total: Whether the decision found a total disability permanent and total.
      tdiu_granted: Whether individual unemployability was granted.
      smc_k_count: Number of SMC (k) awards granted.
      attorney_fee_agreement_on_file: Whether a direct-pay fee agreement is on file.
      payment_method: Delivery method chosen on the claim.
      payment_account_last4: Last four digits of the direct-deposit account, empty for paper checks.
      opened_date: Date the award was authorized.
    triggers: []

  - type: comp_award_activated
    target: comp_awards
    mutation: {transition: {from: authorized, to: running}}
    meaning: The first monthly payment under an authorized award is released and the award becomes a running award.
    grain: one row per transaction
    fields:
      status: Set to running.
    triggers: []

  - type: comp_award_suspended
    target: comp_awards
    mutation: {transition: {from: running, to: suspended}}
    meaning: VA stops releasing monthly payments on a running award while a cause of suspension is unresolved.
    grain: one row per transaction
    fields:
      status: Set to suspended.
      suspension_reason: The cause of the suspension.
    triggers: []

  - type: comp_award_resumed
    target: comp_awards
    mutation: {transition: {from: suspended, to: running}}
    meaning: The cause of a suspension is cured and monthly payments resume.
    grain: one row per transaction
    fields:
      status: Set to running.
      suspension_reason: Reset to none.
    triggers:
      - event: comp:comp_retro_payment
        map: {award_id: award_id, customer_id: customer_id}

  - type: comp_award_terminated
    target: comp_awards
    mutation: {transition: [{from: running, to: terminated}, {from: suspended, to: terminated}]}
    meaning: The award ends and no further entitlement months accrue.
    grain: one row per transaction
    fields:
      status: Set to terminated.
      termination_reason: Why the award ended.
      closed_date: Date the termination was processed.
    triggers: []

  - type: comp_rating_updated
    target: comp_awards
    mutation: update
    meaning: A rating decision changes the combined rating or award-level findings recorded on the award.
    grain: one row per transaction
    fields:
      variant_name: Official tier name of the new combined rating.
      effective_date: Effective date of the new combined rating.
      rating_static: Updated static finding.
      permanent_and_total: Updated permanent-and-total finding.
      tdiu_granted: Updated individual unemployability finding.
      smc_k_count: Updated number of SMC (k) awards.
    triggers: []

  - type: comp_payment_profile_updated
    target: comp_awards
    mutation: update
    meaning: The veteran changes how compensation is delivered or which bank account receives it.
    grain: one row per transaction
    fields:
      payment_method: New delivery method.
      payment_account_last4: Last four digits of the new account, empty for paper checks.
    triggers: []

  - type: comp_monthly_payment
    target: comp_payments
    meaning: The monthly compensation for one entitlement month is issued in arrears.
    grain: one row per award per entitlement month
    distinguish_by: [payment_month]
    fields:
      award_id: The award paid.
      customer_id: The veteran paid.
      payment_month: Entitlement month covered.
      payment_date: Issue date.
      gross_amount: Monthly entitlement before withholding.
      offset_withheld_amount: Amount withheld to collect a VA debt.
      attorney_fee_withheld_amount: Always 0.00 for a monthly payment.
      net_amount: Amount deposited or mailed.
      offset_applied: Whether a debt offset was taken.
      review_level: Authorization level (single_signature for routine monthly payments).
    account: benefits_paid
    direction: in
    triggers:
      - event: debt:debt_offset_collected
        when: {offset_applied: true}
        map: {customer_id: customer_id, amount: offset_withheld_amount, source_payment_id: payment_id, transaction_date: payment_date, collection_source: compensation_offset}

  - type: comp_retro_payment
    target: comp_payments
    meaning: Past-due compensation for a span of entitlement months is released in one lump sum, after a favorable decision or the end of a suspension.
    grain: one row per release of past-due benefits
    distinguish_by: [decision_id, retro_period_start, retro_period_end]
    fields:
      award_id: The award paid.
      customer_id: The veteran paid.
      decision_id: The rating decision that created the past-due amount; empty for a release after suspension.
      retro_period_start: First entitlement month covered.
      retro_period_end: Last entitlement month covered.
      payment_month: Last entitlement month covered.
      payment_date: Issue date.
      gross_amount: Past-due amount before withholding.
      offset_withheld_amount: Amount withheld to collect a VA debt.
      attorney_fee_withheld_amount: Amount withheld for the representative's fee.
      net_amount: Amount deposited or mailed.
      offset_applied: Whether a debt offset was taken.
      review_level: Authorization level required.
    account: benefits_paid
    direction: in
    triggers:
      - event: debt:debt_offset_collected
        when: {offset_applied: true}
        map: {customer_id: customer_id, amount: offset_withheld_amount, source_payment_id: payment_id, transaction_date: payment_date, collection_source: compensation_offset}

  - type: comp_payment_returned
    target: comp_payments
    meaning: The Treasury returns an issued payment to VA (closed or invalid account, undeliverable check, or payee deceased).
    grain: one row per returned payment
    distinguish_by: [source_payment_id]
    fields:
      award_id: The award.
      customer_id: The veteran.
      source_payment_id: The payment that came back.
      payment_month: Entitlement month of the payment that came back.
      payment_date: Date the funds were received back.
      gross_amount: Gross amount of the payment that came back.
      net_amount: Negative of the net amount that came back.
      return_reason: Why it came back.
    account: benefits_paid
    direction: out
    triggers: []

  - type: comp_payment_reissued
    target: comp_payments
    meaning: A returned payment is issued again to the payment account now on the award.
    grain: one row per reissue of a returned payment
    distinguish_by: [source_payment_id]
    fields:
      award_id: The award.
      customer_id: The veteran.
      source_payment_id: The original payment being reissued.
      payment_month: Entitlement month of the original payment.
      payment_date: Reissue date.
      gross_amount: Gross amount reissued.
      net_amount: Amount reissued.
      review_level: Authorization level (single_signature).
    account: benefits_paid
    direction: in
    triggers: []

  - type: comp_rating_decision
    target: comp_decisions
    meaning: A rating decision decides a claim or implements a VA-initiated rating action.
    grain: one row per decision outcome per disability
    distinguish_by: [decision_date, decision_outcome, diagnostic_code, claim_id]
    fields:
      award_id: The award acted on.
      customer_id: The veteran.
      decision_date: Promulgation date.
      notice_date: Notification letter date.
      decision_outcome: What the decision did.
      prior_rating_percent: Combined rating before.
      new_rating_percent: Combined rating after.
      rating_effective_date: Effective date assigned.
      diagnostic_code: Disability addressed.
      condition_name: Disability name as written.
      claim_id: Claim decided, empty for a VA-initiated action.
      proposal_decision_id: For an implemented reduction, the proposal it finalizes.
    triggers:
      - event: comp:comp_rating_updated
        when: {decision_outcome: [increase_granted, service_connection_granted, tdiu_granted, temporary_total_granted, smc_k_granted, reduction_implemented]}
        map: {effective_date: rating_effective_date}
      - event: comp:comp_retro_payment
        when: {decision_outcome: [increase_granted, service_connection_granted, tdiu_granted, temporary_total_granted, smc_k_granted]}
        map: {award_id: award_id, customer_id: customer_id, decision_id: decision_id}

  - type: comp_reduction_proposed
    target: comp_decisions
    meaning: VA notifies the veteran that it proposes to reduce a rating, opening the due-process response period.
    grain: one row per proposal notice per disability
    distinguish_by: [notice_date, diagnostic_code]
    fields:
      award_id: The award.
      customer_id: The veteran.
      decision_date: Date the proposal was prepared.
      notice_date: Date of the proposal notice.
      decision_outcome: Always reduction_proposed.
      prior_rating_percent: Current combined rating.
      new_rating_percent: Proposed combined rating.
      diagnostic_code: Disability proposed for reduction.
      condition_name: Disability name.
    triggers: []

  - type: comp_incarceration_adjustment
    target: comp_decisions
    meaning: VA reduces payments because the veteran has been incarcerated for a felony beyond the reduction start day.
    grain: one row per period of incarceration
    distinguish_by: [incarceration_start_date]
    fields:
      award_id: The award.
      customer_id: The veteran.
      decision_date: Date the adjustment was processed.
      notice_date: Date of the adjustment notice.
      decision_outcome: Always incarceration_reduction.
      incarceration_start_date: First day of the felony incarceration.
      rating_effective_date: Date the reduced rate starts (the reduction start day of incarceration).
      diagnostic_code: Always 0000 (award-level action).
    triggers: []

  - type: comp_intent_to_file
    target: comp_claims
    meaning: VA records the veteran's intent to file a compensation claim, protecting the date of claim.
    grain: one row per intent to file
    distinguish_by: [received_date]
    fields:
      award_id: The award.
      customer_id: The veteran.
      claim_type: Always not_applicable.
      received_date: Date VA received the intent to file.
      channel: Channel used.
    triggers: []

  - type: comp_claim_filed
    target: comp_claims
    meaning: VA receives a completed compensation claim on the prescribed form.
    grain: one row per claim per claim type per receipt date
    distinguish_by: [claim_type, received_date]
    fields:
      award_id: The award.
      customer_id: The veteran.
      claim_type: Kind of claim.
      received_date: Date VA received the completed claim.
      channel: Channel used.
      itf_id: Intent to file that protects the date of claim, or empty.
    triggers: []

  - type: comp_claim_withdrawn
    target: comp_claims
    meaning: The veteran withdraws a pending claim before it is decided.
    grain: one row per withdrawn claim
    distinguish_by: [source_claim_id]
    fields:
      award_id: The award.
      customer_id: The veteran.
      claim_type: Always not_applicable.
      source_claim_id: Claim withdrawn.
      received_date: Date the withdrawal was received.
      channel: Channel used.
    triggers: []

  - type: comp_hearing_requested
    target: comp_claims
    meaning: The veteran asks for a predetermination hearing on a proposed reduction.
    grain: one row per proposal answered
    distinguish_by: [related_decision_id]
    fields:
      award_id: The award.
      customer_id: The veteran.
      claim_type: Always not_applicable.
      related_decision_id: The proposed-reduction notice answered.
      received_date: Date the request was received.
      channel: Channel used.
    triggers: []

  - type: comp_dependent_added
    target: comp_dependents
    meaning: A spouse, child, school child or dependent parent is recognized on the award.
    grain: one row per dependent per recognized relationship
    distinguish_by: [relationship, dependent_name, dependent_birth_date]
    fields:
      award_id: The award.
      customer_id: The veteran.
      relationship: Relationship recognized.
      dependent_name: Dependent's name as reported.
      dependent_birth_date: Dependent's date of birth.
      qualifying_event_date: Marriage, birth or adoption date, or start date of the school term.
      effective_date: Date the addition takes effect.
      payment_adjust_month: First entitlement month paid at the higher rate.
      removal_reason: Always not_applicable.
      spouse_aid_attendance: Whether the spouse needs regular aid and attendance.
      report_channel: Channel used.
      overpayment_created: Always false.
      claim_id: Dependency claim behind the addition.
    triggers: []

  - type: comp_dependent_removed
    target: comp_dependents
    meaning: A dependent stops being recognized on the award.
    grain: one row per dependent removal
    distinguish_by: [source_dependent_event_id]
    fields:
      award_id: The award.
      customer_id: The veteran.
      relationship: Relationship being ended.
      dependent_name: Dependent's name.
      dependent_birth_date: Dependent's date of birth.
      qualifying_event_date: Divorce, death, marriage of the child, end of school attendance, or the age-limit birthday.
      effective_date: Date the removal takes effect.
      payment_adjust_month: First entitlement month paid at the lower rate.
      removal_reason: Why the dependent was removed.
      source_dependent_event_id: Addition being ended.
      report_channel: Channel used.
      overpayment_created: Whether higher-rate payments were already issued for months on or after the adjust month.
      claim_id: Dependency claim, or empty for an oral report.
    triggers:
      - event: debt:debt_established
        when: {overpayment_created: true}
        map: {customer_id: customer_id, variant_name: Disability Compensation Overpayment, source_record_id: dependent_event_id, source_category: comp}

measures:
  - id: comp_msr_payments_at_superseded_rate
    window: From the payment_adjust_month of one dependent removal through the most recent comp_monthly_payment on the same award, inclusive.
    measure: Count of comp_monthly_payment entries on the award whose payment_month is on or after that removal's payment_adjust_month and whose gross_amount still includes the removed dependent's addition.
  - id: comp_msr_returned_payments_window
    window: Rolling returned_payments_window_months calendar months ending on the current date.
    measure: Count of comp_payment_returned entries on the award whose payment_date falls in the window.
  - id: comp_msr_unpaid_running_months
    window: From the first entitlement month withheld at suspension through the entitlement month before the resumption date.
    measure: Count of entitlement months on the award with no comp_monthly_payment entry while the award status was suspended.

policies:
  - id: comp_agg_multi_holding
    subject: [comp_award_established]
    rule: >-
      A veteran holds at most one disability compensation award; every service-connected disability, whenever
      granted, is rated on that single award and the combined rating replaces the earlier one through a rating
      update rather than a second award. A new award is established only when the veteran holds no award whose
      status is authorized, running or suspended. A veteran whose earlier award was terminated (for example after
      renunciation or an election of pension) is given a new award when compensation is granted again. Survivors
      never hold a compensation award in their own name; survivor benefits are Dependency and Indemnity
      Compensation.
    eligibility:
      - id: no_open_award
        applies_to: [comp_award_established]
        kind: dedup
        condition: A new award is established only when the veteran holds no award whose status is authorized, running or suspended.
        evidence_fields: [comp_awards.customer_id, comp_awards.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [comp_awards.customer_id]
          action_bindings:
            comp_awards.customer_id: customer_id
        dedup_contract:
          table: comp_awards
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [authorized, running, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: comp_monthly_entitlement
    subject: [comp_monthly_payment, comp_payment_reissued]
    rule: >-
      The gross monthly entitlement for an entitlement month is the veteran-alone rate of the combined rating tier in
      effect for that whole month, plus the SMC (k) addition for each SMC (k) award on the award up to the SMC (k)
      maximum, plus, only where the tier's dependents_payable is true, the spouse addition when a spouse is
      recognized, the spouse aid-and-attendance addition when the recognized spouse is marked as needing aid and
      attendance, the child addition for each recognized child under the child age limit, the school-child addition
      for each recognized school child, and the parent addition for each recognized dependent parent up to the parent
      maximum. A dependent counts for an entitlement month when the month is on or after the payment_adjust_month of
      its addition and before the payment_adjust_month of its removal. When individual unemployability is in effect,
      the individual unemployability rate replaces the veteran-alone rate and dependent additions are taken from the
      100 percent tier. Where the incarceration adjustment applies to the month, the incarcerated rate replaces the
      whole computation. Amounts are kept to the cent and never rounded to the dollar. A monthly payment is released
      only while the award status is running. A reissue repeats the gross amount of the payment it replaces.
    eligibility:
      - id: award_running
        applies_to: [comp_monthly_payment, comp_payment_reissued]
        kind: state
        condition: A monthly payment is released only while the award status is running.
        evidence_fields: [comp_awards.status, comp_awards.award_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [comp_awards.award_id]
          action_bindings:
            comp_awards.award_id: award_id
        state_contract:
          field: comp_awards.status
          allowed: [running]
    params:
      per_tier:
        Disability Compensation (10% Combined Rating): {monthly_rate_veteran_alone: =monthly_rate_veteran_alone, dependents_payable: =dependents_payable, spouse_addition: =spouse_addition, child_under_18_addition: =child_under_18_addition, school_child_addition: =school_child_addition, spouse_aid_attendance_addition: =spouse_aid_attendance_addition, dependent_parent_addition: =dependent_parent_addition}
        Disability Compensation (20% Combined Rating): {monthly_rate_veteran_alone: =monthly_rate_veteran_alone, dependents_payable: =dependents_payable, spouse_addition: =spouse_addition, child_under_18_addition: =child_under_18_addition, school_child_addition: =school_child_addition, spouse_aid_attendance_addition: =spouse_aid_attendance_addition, dependent_parent_addition: =dependent_parent_addition}
        Disability Compensation (30% Combined Rating): {monthly_rate_veteran_alone: =monthly_rate_veteran_alone, dependents_payable: =dependents_payable, spouse_addition: =spouse_addition, child_under_18_addition: =child_under_18_addition, school_child_addition: =school_child_addition, spouse_aid_attendance_addition: =spouse_aid_attendance_addition, dependent_parent_addition: =dependent_parent_addition}
        Disability Compensation (40% Combined Rating): {monthly_rate_veteran_alone: =monthly_rate_veteran_alone, dependents_payable: =dependents_payable, spouse_addition: =spouse_addition, child_under_18_addition: =child_under_18_addition, school_child_addition: =school_child_addition, spouse_aid_attendance_addition: =spouse_aid_attendance_addition, dependent_parent_addition: =dependent_parent_addition}
        Disability Compensation (50% Combined Rating): {monthly_rate_veteran_alone: =monthly_rate_veteran_alone, dependents_payable: =dependents_payable, spouse_addition: =spouse_addition, child_under_18_addition: =child_under_18_addition, school_child_addition: =school_child_addition, spouse_aid_attendance_addition: =spouse_aid_attendance_addition, dependent_parent_addition: =dependent_parent_addition}
        Disability Compensation (60% Combined Rating): {monthly_rate_veteran_alone: =monthly_rate_veteran_alone, dependents_payable: =dependents_payable, spouse_addition: =spouse_addition, child_under_18_addition: =child_under_18_addition, school_child_addition: =school_child_addition, spouse_aid_attendance_addition: =spouse_aid_attendance_addition, dependent_parent_addition: =dependent_parent_addition}
        Disability Compensation (70% Combined Rating): {monthly_rate_veteran_alone: =monthly_rate_veteran_alone, dependents_payable: =dependents_payable, spouse_addition: =spouse_addition, child_under_18_addition: =child_under_18_addition, school_child_addition: =school_child_addition, spouse_aid_attendance_addition: =spouse_aid_attendance_addition, dependent_parent_addition: =dependent_parent_addition}
        Disability Compensation (80% Combined Rating): {monthly_rate_veteran_alone: =monthly_rate_veteran_alone, dependents_payable: =dependents_payable, spouse_addition: =spouse_addition, child_under_18_addition: =child_under_18_addition, school_child_addition: =school_child_addition, spouse_aid_attendance_addition: =spouse_aid_attendance_addition, dependent_parent_addition: =dependent_parent_addition}
        Disability Compensation (90% Combined Rating): {monthly_rate_veteran_alone: =monthly_rate_veteran_alone, dependents_payable: =dependents_payable, spouse_addition: =spouse_addition, child_under_18_addition: =child_under_18_addition, school_child_addition: =school_child_addition, spouse_aid_attendance_addition: =spouse_aid_attendance_addition, dependent_parent_addition: =dependent_parent_addition}
        Disability Compensation (100% Combined Rating): {monthly_rate_veteran_alone: =monthly_rate_veteran_alone, dependents_payable: =dependents_payable, spouse_addition: =spouse_addition, child_under_18_addition: =child_under_18_addition, school_child_addition: =school_child_addition, spouse_aid_attendance_addition: =spouse_aid_attendance_addition, dependent_parent_addition: =dependent_parent_addition}
      smc_k_monthly_addition: =smc_k_monthly_addition
      smc_k_max_awards: =smc_k_max_awards
      dependent_parent_max_count: =dependent_parent_max_count
      child_age_limit_years: =child_age_limit_years
      school_child_min_age_years: =school_child_min_age_years
      school_child_age_limit_years: =school_child_age_limit_years
    formula:
      gross_amount: "monthly_rate_veteran_alone + smc_k_monthly_addition * min(smc_k_count, smc_k_max_awards)"
      net_amount: "gross_amount - offset_withheld_amount - attorney_fee_withheld_amount"

  - id: comp_payment_schedule
    subject: [comp_award_activated, comp_monthly_payment, comp_payment_profile_updated]
    rule: >-
      Compensation is paid monthly in arrears: the payment for an entitlement month is issued on the
      payment_day_of_month of the following month, moved to the last preceding business day when that day is a
      Saturday, Sunday or federal holiday. Payment of a new or increased rate begins with the entitlement month that
      starts payment_start_lag_months after the month containing the effective date, so the month containing the
      effective date itself is never paid at the new rate. An authorized award becomes running when its first monthly
      payment is released. A change of payment account or delivery method applies to a payment only when it is
      recorded at least direct_deposit_change_lead_days calendar days before that payment's issue date; otherwise
      the pending payment goes to the account on file before the change. Changing the payment account is a request
      only the veteran can make for their own benefits, and it is accepted only after the caller's identity has been
      verified on this contact.
    eligibility:
      - id: identity_verified_for_account_change
        applies_to: [comp_payment_profile_updated]
        kind: authorization
        condition: it is accepted only after the caller's identity has been verified on this contact
        evidence_fields: [identity_verifications.verified, identity_verifications.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [identity_verifications.customer_id]
          action_bindings:
            identity_verifications.customer_id: customer_id
    params:
      payment_day_of_month: =payment_day_of_month
      payment_start_lag_months: =payment_start_lag_months
      direct_deposit_change_lead_days: =direct_deposit_change_lead_days

  - id: comp_evt_rating_change
    subject: [comp_rating_decision, comp_rating_updated, comp_retro_payment]
    rule: >-
      An increase is effective on the date of claim or the date entitlement arose, whichever is later; when the
      evidence shows the increase was factually ascertainable within increase_lookback_days before the date of claim,
      it is effective on the date the increase became ascertainable. The date of claim is the received date of the
      claim, or the received date of the intent to file the claim cites. Past-due benefits for a favorable decision
      cover every entitlement month from the first month payable under the payment schedule through the last month
      already paid at the old rate, and equal, for each such month, the new gross monthly entitlement minus the gross
      amount already paid for that month. A rating decision acts only on an award whose status is running or
      suspended. Past-due benefits on a suspended award are computed but released only when the award resumes. The
      combined rating is derived from the VA combined ratings table, applying the bilateral factor to disabilities of
      paired extremities first and rounding the combined value to the nearest combined_rounding_step, with values
      ending in 5 rounded up. After a decision, the award carries the tier whose combined_rating_percent equals the
      decision's new combined rating.
    eligibility:
      - id: award_open_for_decision
        applies_to: [comp_rating_decision]
        kind: state
        condition: A rating decision acts only on an award whose status is running or suspended.
        evidence_fields: [comp_awards.status, comp_awards.award_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [comp_awards.award_id]
          action_bindings:
            comp_awards.award_id: award_id
        state_contract:
          field: comp_awards.status
          allowed: [running, suspended]
    params:
      increase_lookback_days: =increase_lookback_days
      combined_rating_percent: =combined_rating_percent
      combined_rounding_step: =combined_rounding_step
      bilateral_factor_pct: =bilateral_factor_pct
      post_separation_claim_window_days: =post_separation_claim_window_days

  - id: comp_evt_reduction_due_process
    subject: [comp_reduction_proposed, comp_hearing_requested, comp_rating_decision, comp_rating_updated]
    rule: >-
      A rating cannot be reduced without first sending a proposed-reduction notice that sets out the evidence and
      the proposed rating. The veteran has proposed_reduction_response_days calendar days from the notice date to
      submit evidence, during which the current rate continues. A predetermination hearing request counts only if it
      is received not later than predetermination_hearing_request_days calendar days after the date of the proposed reduction notice. Count calendar days starting the day after the notice date, so the last day to request is the notice date plus the predetermination_hearing_request_days. A timely
      hearing request keeps payments at the current rate until the hearing is held and a final decision is issued;
      a late request is still accepted as a hearing but does not hold the reduction. A final reduction takes effect
      on the last day of the month in which reduction_effective_after_notice_days expire after the notice of the
      final decision, and payment at the lower rate begins with the next entitlement month. A rating in effect
      continuously for rating_protection_years or more is never reduced below that level, and a rating in effect for
      rating_stabilization_years or more is reduced only on a full examination showing sustained material
      improvement; a rating marked static or permanent and total is not proposed for reduction on a routine
      examination. Veterans at or above reexam_exempt_age are not scheduled for routine future examinations.
    eligibility:
      - id: timely_hearing_request
        applies_to: [comp_hearing_requested]
        kind: time
        condition: A predetermination hearing request counts only if it is received not later than predetermination_hearing_request_days calendar days after the date of the proposed reduction notice.
        evidence_fields: [comp_decisions.notice_date, comp_decisions.decision_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [comp_decisions.decision_id]
          action_bindings:
            comp_decisions.decision_id: related_decision_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the proposed reduction notice
          anchor_source: comp_decisions.notice_date
          relation: not_after
          duration_source: variants.predetermination_hearing_request_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after the notice date, so the last day to request is the notice date plus the predetermination_hearing_request_days.
          boundary: inclusive
    params:
      proposed_reduction_response_days: =proposed_reduction_response_days
      predetermination_hearing_request_days: =predetermination_hearing_request_days
      reduction_effective_after_notice_days: =reduction_effective_after_notice_days
      rating_protection_years: =rating_protection_years
      rating_stabilization_years: =rating_stabilization_years
      reexam_exempt_age: =reexam_exempt_age

  - id: comp_evt_dependency_add
    subject: [comp_dependent_added, comp_claim_filed]
    rule: >-
      Additional compensation for dependents is payable only when the tier in effect on the award has dependents_payable set to true.
      A spouse, child, school child or dependent parent is added only on a dependency claim received online or by
      mail; a telephone report cannot add a dependent. A school child is added only on a school-attendance claim
      showing enrollment at an approved school, from the school_child_min_age_years birthday (or the term start, if
      later) until the day before the school_child_age_limit_years birthday. No more than dependent_parent_max_count
      parents are recognized. The addition is effective on the date of the marriage, birth or adoption when the
      dependency claim is received within dependency_report_window_days calendar days after that event, and on the
      date the claim was received otherwise; the first entitlement month paid at the higher rate is the month after
      the effective date. Past-due dependent additions for months already paid at the lower rate are released as a
      retroactive payment.
    eligibility:
      - id: rating_at_least_30
        applies_to: [comp_dependent_added]
        kind: state
        condition: Additional compensation for dependents is payable only when the tier in effect on the award has dependents_payable set to true.
        evidence_fields: [comp_awards.variant_name, comp_awards.award_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [comp_awards.award_id]
          action_bindings:
            comp_awards.award_id: award_id
        state_contract:
          field: comp_awards.variant_name
          allowed: [Disability Compensation (30% Combined Rating), Disability Compensation (40% Combined Rating), Disability Compensation (50% Combined Rating), Disability Compensation (60% Combined Rating), Disability Compensation (70% Combined Rating), Disability Compensation (80% Combined Rating), Disability Compensation (90% Combined Rating), Disability Compensation (100% Combined Rating)]
      - id: written_dependency_claim
        applies_to: [comp_dependent_added]
        kind: authorization
        condition: A spouse, child, school child or dependent parent is added only on a dependency claim received online or by mail; a telephone report cannot add a dependent.
        evidence_fields: [comp_claims.claim_id, comp_claims.channel, comp_claims.claim_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [comp_claims.claim_id]
          action_bindings:
            comp_claims.claim_id: claim_id
    params:
      dependency_report_window_days: =dependency_report_window_days
      oral_report_addition_allowed: =oral_report_addition_allowed
      dependent_parent_max_count: =dependent_parent_max_count
      school_child_min_age_years: =school_child_min_age_years
      school_child_age_limit_years: =school_child_age_limit_years

  - id: comp_evt_dependency_remove
    subject: [comp_dependent_removed]
    rule: >-
      A dependent is removed effective the last day of the month in which a divorce, the dependent's death or a
      child's marriage occurred, the day before a child's child_age_limit_years birthday (unless the child is then
      added as a school child), the day before a school child's school_child_age_limit_years birthday, or the last
      day of the month in which school attendance ended; the first entitlement month paid at the lower rate is the
      month after the effective date. A removal may be reported by telephone, online or by mail, because a report
      that reduces benefits is accepted orally. A dependent addition is removed only once. When monthly payments
      that still included the removed dependent's addition were issued for entitlement months on or after the
      removal's payment_adjust_month, the removal records an overpayment equal to that dependent's monthly addition
      for the tier in effect, multiplied by the number of such months (comp_msr_payments_at_superseded_rate), and a
      Disability Compensation Overpayment debt is established for it.
    eligibility:
      - id: removed_once
        applies_to: [comp_dependent_removed]
        kind: dedup
        condition: A dependent addition is removed only once.
        evidence_fields: [comp_dependents.source_dependent_event_id, comp_dependents.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [comp_dependents.source_dependent_event_id]
          action_bindings:
            comp_dependents.source_dependent_event_id: source_dependent_event_id
        dedup_contract:
          table: comp_dependents
          mode: separate_record
          object_bindings: {source_dependent_event_id: source_dependent_event_id}
          duplicate_filters: {event_type: [comp_dependent_removed]}
          distinct_fields: []
    params:
      oral_report_reduction_allowed: =oral_report_reduction_allowed
      child_age_limit_years: =child_age_limit_years
      school_child_age_limit_years: =school_child_age_limit_years
    measures: [comp_msr_payments_at_superseded_rate]

  - id: comp_evt_intent_and_claims
    subject: [comp_intent_to_file, comp_claim_filed, comp_claim_withdrawn]
    rule: >-
      An intent to file may be recorded by telephone, online, by mail or in person, and it stays in effect for
      itf_validity_days calendar days. A claim takes the intent-to-file date as its date of claim only if it is received not later than itf_validity_days calendar days after the date VA received the intent to file. Count calendar days starting the day after the intent to file was received; a claim received on the last day still qualifies. Only the first
      completed claim received in that period uses the intent to file, and a later claim takes its own received date.
      A substantive claim for an increase, a new or secondary condition, individual unemployability or a temporary
      total rating must be submitted online, by mail or in person on the prescribed form and is never taken by
      telephone. A claim can be withdrawn only while no rating decision citing that claim exists; a withdrawn claim
      does not keep its date of claim, and refiling starts a new date of claim unless an unused intent to file still
      protects it.
    eligibility:
      - id: itf_window
        applies_to: [comp_claim_filed]
        kind: time
        condition: A claim takes the intent-to-file date as its date of claim only if it is received not later than itf_validity_days calendar days after the date VA received the intent to file.
        evidence_fields: [comp_claims.received_date, comp_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [comp_claims.claim_id]
          action_bindings:
            comp_claims.claim_id: itf_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date VA received the intent to file
          anchor_source: comp_claims.received_date
          relation: not_after
          duration_source: variants.itf_validity_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after the intent to file was received; a claim received on the last day still qualifies.
          boundary: inclusive
      - id: withdraw_before_decision
        applies_to: [comp_claim_withdrawn]
        kind: dedup
        condition: A claim can be withdrawn only while no rating decision citing that claim exists
        evidence_fields: [comp_decisions.claim_id, comp_decisions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [comp_decisions.claim_id]
          action_bindings:
            comp_decisions.claim_id: source_claim_id
        dedup_contract:
          table: comp_decisions
          mode: separate_record
          object_bindings: {claim_id: source_claim_id}
          duplicate_filters: {event_type: [comp_rating_decision]}
          distinct_fields: []
    params:
      itf_validity_days: =itf_validity_days
      itf_phone_allowed: =itf_phone_allowed
      claim_phone_allowed: =claim_phone_allowed

  - id: comp_evt_incarceration
    subject: [comp_incarceration_adjustment, comp_monthly_payment]
    rule: >-
      When a veteran is incarcerated for a felony, payments from the incarceration_reduction_start_day of continuous
      incarceration are limited to the tier's incarcerated_monthly_rate, and dependent and SMC (k) additions stop for
      the same months. Incarceration for a misdemeanor, or felony incarceration that ends before the reduction start
      day, changes nothing. Full payment is restored from the date of release when VA is notified of the release
      within incarceration_restoration_notice_days calendar days after it, and from the date VA is notified
      otherwise. Requests by the veteran's spouse or children for an apportionment of the withheld amount are decided
      by a claims processor and cannot be granted on a service call.
    eligibility: []
    params:
      per_tier:
        Disability Compensation (10% Combined Rating): {incarcerated_monthly_rate: =incarcerated_monthly_rate}
        Disability Compensation (20% Combined Rating): {incarcerated_monthly_rate: =incarcerated_monthly_rate}
        Disability Compensation (30% Combined Rating): {incarcerated_monthly_rate: =incarcerated_monthly_rate}
        Disability Compensation (40% Combined Rating): {incarcerated_monthly_rate: =incarcerated_monthly_rate}
        Disability Compensation (50% Combined Rating): {incarcerated_monthly_rate: =incarcerated_monthly_rate}
        Disability Compensation (60% Combined Rating): {incarcerated_monthly_rate: =incarcerated_monthly_rate}
        Disability Compensation (70% Combined Rating): {incarcerated_monthly_rate: =incarcerated_monthly_rate}
        Disability Compensation (80% Combined Rating): {incarcerated_monthly_rate: =incarcerated_monthly_rate}
        Disability Compensation (90% Combined Rating): {incarcerated_monthly_rate: =incarcerated_monthly_rate}
        Disability Compensation (100% Combined Rating): {incarcerated_monthly_rate: =incarcerated_monthly_rate}
      incarceration_reduction_start_day: =incarceration_reduction_start_day
      incarceration_restoration_notice_days: =incarceration_restoration_notice_days

  - id: comp_evt_suspension
    subject: [comp_award_suspended, comp_award_resumed, comp_retro_payment]
    rule: >-
      An award is suspended when returned_payments_suspension_count or more payments come back within the rolling
      returned_payments_window_months (comp_msr_returned_payments_window), when mail is returned and the veteran's
      whereabouts are unknown, or when the veteran failed to report for a scheduled examination and the due-process
      period has run. A suspended award resumes only after the veteran confirms a current mailing address or payment
      account on this contact or reports for the examination. On resumption, entitlement months withheld while the
      award was suspended (comp_msr_unpaid_running_months) are released as one retroactive payment at the rates in
      effect for those months, less any debt offset.
    eligibility:
      - id: cure_confirmed
        applies_to: [comp_award_resumed]
        kind: caller_fact
        condition: A suspended award resumes only after the veteran confirms a current mailing address or payment account on this contact or reports for the examination.
        evidence_fields: [comp_awards.award_id, comp_awards.suspension_reason]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [comp_awards.award_id]
          action_bindings:
            comp_awards.award_id: award_id
    params:
      returned_payments_suspension_count: =returned_payments_suspension_count
      returned_payments_window_months: =returned_payments_window_months
    measures: [comp_msr_returned_payments_window, comp_msr_unpaid_running_months]

  - id: comp_evt_payment_return
    subject: [comp_payment_returned, comp_payment_reissued, comp_award_terminated]
    rule: >-
      A payment returned for a closed or invalid account or as an undeliverable check is reissued only after the
      payment account or mailing address on the award has been updated, and each returned payment is reissued only
      once. When the veteran dies, the award terminates effective the last day of the month of death; the payment for
      the month of death is released to the surviving spouse, and every payment issued for an entitlement month
      after the month of death is reclaimed from the bank as a returned payment with reason payee_deceased and is
      never reissued.
    eligibility:
      - id: reissue_once
        applies_to: [comp_payment_reissued]
        kind: dedup
        condition: each returned payment is reissued only once
        evidence_fields: [comp_payments.source_payment_id, comp_payments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [comp_payments.source_payment_id]
          action_bindings:
            comp_payments.source_payment_id: source_payment_id
        dedup_contract:
          table: comp_payments
          mode: separate_record
          object_bindings: {source_payment_id: source_payment_id}
          duplicate_filters: {event_type: [comp_payment_reissued]}
          distinct_fields: []
    params:
      reissue_requires_profile_update: =reissue_requires_profile_update
      month_of_death_payable: =month_of_death_payable

  - id: comp_tdiu
    subject: [comp_rating_decision, comp_rating_updated]
    rule: >-
      Individual unemployability can be granted only when the tier's tdiu_schedular_eligible is true and the veteran
      has one service-connected disability rated 60 percent or more, or two or more disabilities with at least one
      rated 40 percent or more and a combined rating of 70 percent or more, and is unable to secure substantially
      gainful employment; employment with annual earned income at or below tdiu_marginal_income_threshold is
      marginal and does not bar the grant. When granted, the award is paid at tdiu_monthly_rate while the tier is
      unchanged. Individual unemployability is not available at the 100 percent tier.
    eligibility: []
    params:
      per_tier:
        Disability Compensation (10% Combined Rating): {tdiu_schedular_eligible: =tdiu_schedular_eligible}
        Disability Compensation (20% Combined Rating): {tdiu_schedular_eligible: =tdiu_schedular_eligible}
        Disability Compensation (30% Combined Rating): {tdiu_schedular_eligible: =tdiu_schedular_eligible}
        Disability Compensation (40% Combined Rating): {tdiu_schedular_eligible: =tdiu_schedular_eligible}
        Disability Compensation (50% Combined Rating): {tdiu_schedular_eligible: =tdiu_schedular_eligible}
        Disability Compensation (60% Combined Rating): {tdiu_schedular_eligible: =tdiu_schedular_eligible}
        Disability Compensation (70% Combined Rating): {tdiu_schedular_eligible: =tdiu_schedular_eligible}
        Disability Compensation (80% Combined Rating): {tdiu_schedular_eligible: =tdiu_schedular_eligible}
        Disability Compensation (90% Combined Rating): {tdiu_schedular_eligible: =tdiu_schedular_eligible}
        Disability Compensation (100% Combined Rating): {tdiu_schedular_eligible: =tdiu_schedular_eligible}
      tdiu_monthly_rate: =tdiu_monthly_rate
      tdiu_marginal_income_threshold: =tdiu_marginal_income_threshold

  - id: comp_temporary_total
    subject: [comp_rating_decision, comp_retro_payment]
    rule: >-
      A temporary total rating is assigned when a service-connected disability required hospitalization for more
      than hospitalization_temp_total_days days, or surgery or treatment requiring convalescence; it is paid at
      temporary_total_monthly_rate from the first day of hospitalization or the date of surgery and ends on the last
      day of the month of discharge or of the convalescence period. An initial convalescence period runs for 1 to
      convalescence_initial_max_months months, and it can be extended by no more than convalescence_extension_max_months
      further months in total. When it ends, the prior combined rating resumes without a reduction proposal.
    eligibility: []
    params:
      temporary_total_monthly_rate: =temporary_total_monthly_rate
      hospitalization_temp_total_days: =hospitalization_temp_total_days
      convalescence_initial_max_months: =convalescence_initial_max_months
      convalescence_extension_max_months: =convalescence_extension_max_months

  - id: comp_retro_withholding
    subject: [comp_retro_payment]
    rule: >-
      From every retroactive payment, attorney_fee_withholding_pct percent of the past-due amount is withheld for
      direct payment of the representative's fee when a direct-pay fee agreement is on file, and nothing is withheld
      otherwise; past-due amounts created only by adding dependents or by releasing suspended months are not subject
      to fee withholding. When the veteran has a VA benefit debt in active collection, the remaining amount is applied
      to that debt before any release (see the debt offset rules), and only the balance is paid. A retroactive payment
      whose gross amount is retro_second_signature_threshold or more requires a second signature before release.
    eligibility: []
    params:
      attorney_fee_withholding_pct: =attorney_fee_withholding_pct
      retro_second_signature_threshold: =retro_second_signature_threshold
    formula:
      attorney_fee_withheld_amount: "round(gross_amount * attorney_fee_withholding_pct / 100, 2)"
      net_amount: "gross_amount - attorney_fee_withheld_amount - offset_withheld_amount"

  - id: comp_excl_pension_election
    subject: [comp_award_established, comp_award_terminated, comp_monthly_payment]
    rule: >-
      Compensation and Veterans Pension are never paid to the same veteran for the same month. A veteran with a
      running Veterans Pension award who is granted compensation receives whichever benefit is greater unless they
      elect otherwise in writing; when compensation is greater, the pension award is terminated by election effective
      the last day of the month before compensation becomes payable, and compensation is paid from that month. A
      veteran who elects pension over a greater compensation award has the compensation award terminated with reason
      election_of_pension. An election is the veteran's own decision and is never made for them on a call.
    eligibility: []

  - id: comp_interact_school_child_ch35
    subject: [comp_dependent_added]
    rule: >-
      A child who holds Survivors' and Dependents' Educational Assistance (Chapter 35) and is paid it for an
      enrollment cannot also be recognized as a school child on the veteran's award for the same months, because
      school_child_ch35_concurrent is false; the child elects which benefit to take, and the school-child addition
      starts or stops with the first month the Chapter 35 enrollment does not cover. A child under the child age limit
      can be paid as a minor child on the award regardless of Chapter 35 status.
    eligibility: []
    params:
      school_child_ch35_concurrent: =school_child_ch35_concurrent
