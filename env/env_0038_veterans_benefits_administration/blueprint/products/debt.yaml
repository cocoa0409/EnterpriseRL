category: debt
display_name: Benefit Debts and Overpayment Recovery

binding:
  holding_table: debt_accounts
  event_tables: [debt_transactions, debt_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {current_balance: debt_balance}

lifecycle:
  states: [active, on_hold, repayment_plan, referred_to_treasury, paid_in_full, waived, compromised]
  transitions:
    - {from: active, to: on_hold, by: agent, means: Collection is held because a waiver, dispute or compromise offer arrived within the collection-hold window.}
    - {from: on_hold, to: active, by: system, means: The held request is decided without fully resolving the debt, and collection resumes.}
    - {from: active, to: repayment_plan, by: agent, means: A repayment plan or reduced monthly withholding is approved for the debtor.}
    - {from: repayment_plan, to: active, by: system, means: The debtor misses the defaulting number of consecutive installments and the plan is cancelled.}
    - {from: active, to: referred_to_treasury, by: system, means: The debt stays delinquent past the referral threshold and is referred to Treasury cross-servicing.}
    - {from: active, to: paid_in_full, by: system, means: Collections and credits bring the balance to zero.}
    - {from: repayment_plan, to: paid_in_full, by: system, means: The final plan installment brings the balance to zero.}
    - {from: referred_to_treasury, to: paid_in_full, by: system, means: Treasury collections bring the balance to zero.}
    - {from: active, to: waived, by: system, means: The Committee on Waivers and Compromises waives the entire remaining balance.}
    - {from: on_hold, to: waived, by: system, means: A held waiver request is granted for the entire remaining balance.}
    - {from: active, to: compromised, by: system, means: An accepted compromise is paid and the remainder is forgiven.}
    - {from: on_hold, to: compromised, by: system, means: A held compromise offer is accepted and paid and the remainder is forgiven.}

accounts:
  - key: debt_balance
    unit: USD
    meaning: Outstanding amount the debtor owes VA on one debt - establishment, interest accrual and refunds of overcollection raise it; offsets, direct payments, waiver credits and compromise credits lower it.

parameter_schema:
  waiver_request_window_days: Days after the initial debt notice within which a waiver request must be received to be considered, calendar days.
  collection_hold_window_days: Days after the initial debt notice within which a waiver request or dispute stops collection until it is decided, calendar days.
  offset_start_after_notice_days: Days after the initial debt notice before VA begins withholding from benefit payments, calendar days.
  default_offset_pct_of_benefit: Share of each benefit payment withheld while a debt is in active collection and no plan applies, percent.
  reduced_withholding_min_monthly: Smallest monthly reduced withholding VA approves on hardship, USD.
  repayment_plan_min_installment: Smallest monthly installment accepted for a repayment plan, USD.
  plan_max_months_without_fsr: Longest repayment plan approved without a Financial Status Report, months.
  plan_max_months_with_fsr: Longest repayment plan approved with a Financial Status Report, months.
  plan_first_installment_due_days: Days after plan approval by which the first installment is due, calendar days.
  missed_installments_default_count: Consecutive missed installments that cancel a repayment plan, count.
  treasury_referral_delinquency_days: Days of delinquency after which a debt not on hold or in a plan is referred to Treasury cross-servicing, calendar days.
  treasury_referral_min_balance: Smallest balance referred to Treasury cross-servicing, USD.
  treasury_cross_servicing_fee_pct: Fee Treasury adds to a referred debt's balance, percent of the balance referred.
  interest_rate_pct: Annual interest rate charged on the outstanding balance, percent per year (0.00 where no interest is charged).
  interest_accrual_start_days: Days after the initial debt notice after which interest starts to accrue on an unpaid balance, calendar days.
  interest_compounding: How interest is computed, enum text (simple_monthly = simple interest on the balance at the start of each month).
  compromise_va_authority_max: Largest debt VA may compromise without referral to the Department of Justice, USD.
  compromise_lump_sum_due_days: Days after acceptance by which an accepted compromise must be paid in one lump sum, calendar days.
  compromise_requires_fsr: Whether a compromise offer must be accompanied by a Financial Status Report, boolean.
  waiver_requires_fsr: Whether a waiver request must be accompanied by a Financial Status Report, boolean.
  waiver_fraud_bar: Whether a finding of fraud, misrepresentation or bad faith bars waiver, boolean.
  waiver_partial_allowed: Whether the Committee may waive part of a debt, boolean.
  waiver_refund_collected_after_request: Whether amounts collected after a timely waiver request are refunded when that portion is waived, boolean.
  dispute_holds_collection: Whether a timely dispute of the debt's existence or amount holds collection until resolved, boolean.
  reduced_withholding_requires_fsr: Whether reduced monthly withholding requires a Financial Status Report, boolean.
  one_pending_request_only: Whether only one waiver, dispute or compromise request may be pending on a debt at a time, boolean.
  credit_bureau_reporting: Whether a delinquent debt of this type is reported to consumer credit bureaus, boolean.
  credit_bureau_reporting_after_days: Days after the initial notice before a delinquent reportable debt is reported, calendar days.
  tax_refund_offset_eligible: Whether a referred debt can be collected from federal tax refunds, boolean.
  social_security_offset_max_pct: Maximum share of a monthly Social Security benefit Treasury can offset, percent.
  social_security_protected_amount: Monthly Social Security benefit amount protected from Treasury offset, USD.
  federal_salary_offset_max_pct: Maximum share of disposable federal pay that can be offset, percent.
  wage_garnishment_max_pct: Maximum share of disposable pay administrative wage garnishment can take, percent.
  offset_sources: Benefit lines from which this debt type can be collected by offset, list of compensation / pension / education.
  payment_application_order: Order in which a collection is applied within one debt, ordered list.
  multi_debt_offset_order: Basis on which a single benefit offset is applied across several of the debtor's debts, enum text.
  overcollection_refund_min: Smallest overcollection refunded to the debtor, USD.
  overcollection_refund_days: Days after the overcollection posts within which the refund is issued, calendar days.
  direct_payment_channels: Channels through which a debtor may pay directly, list.
  due_process_notice_required: Whether the initial notice of rights and obligations must be sent before any collection, boolean.
  release_of_liability_bars_debt: Whether a release of liability granted on an assumed loan bars establishing a guaranty debt against the veteran, boolean.
  student_vs_school_liability_split: Whether this debt type can be split between the student and the school, boolean.
  first_notice_followup_days: Days after the initial notice at which the second demand letter is sent when no response is received, calendar days.
  waiver_decision_goal_days: Target days for the Committee on Waivers and Compromises to decide a complete waiver request, calendar days.
  dispute_review_goal_days: Target days for the regional office to complete a dispute review, calendar days.
  estate_collection_only: Whether, after the debtor's death, collection proceeds only against the estate and benefit offsets stop, boolean.
  retro_offset_full_amount: Whether a retroactive benefit release is offset up to the full outstanding balance even while a reduced-withholding plan is in effect, boolean.
  payment_designation_honored: Whether a direct payment designated by the debtor for a specific debt is applied to that debt rather than by the multi-debt order, boolean.
  installment_rounding: How a computed monthly installment is rounded, enum text (up_to_cent).

