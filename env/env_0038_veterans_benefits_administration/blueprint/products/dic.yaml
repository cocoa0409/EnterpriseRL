category: dic
display_name: Dependency and Indemnity Compensation (DIC)

binding:
  holding_table: dic_awards
  event_tables: [dic_payments, dic_children]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [authorized, running, suspended, terminated]
  transitions:
    - {from: authorized, to: running, by: system, means: The first monthly DIC payment is released.}
    - {from: running, to: suspended, by: agent, means: Payments are suspended because the surviving spouse's whereabouts are unknown or payments keep coming back.}
    - {from: suspended, to: running, by: agent, means: A current address or account is confirmed and payments resume.}
    - {from: running, to: terminated, by: agent, means: The award ends on the surviving spouse's death, remarriage before the age limit, an election of Survivors Pension, or renunciation.}
    - {from: suspended, to: terminated, by: agent, means: A suspended award ends for one of the same reasons.}

accounts:
  - key: dic_paid
    unit: USD
    meaning: Net DIC delivered to the surviving spouse - monthly and retroactive payments credit it, returned payments debit it.

parameter_schema:
  monthly_basic_rate: Basic monthly DIC rate for a surviving spouse, USD, effective December 1, 2025.
  eight_year_addition: Monthly amount added under the 8-year provision, USD (0.00 where the tier excludes it).
  housebound_addition: Monthly amount added for a housebound surviving spouse, USD (0.00 where not applicable).
  aid_attendance_addition: Monthly amount added for a surviving spouse needing aid and attendance, USD (0.00 where not applicable).
  child_addition: Monthly amount added for each child under the child age limit, USD.
  transitional_benefit_monthly: Monthly transitional benefit for a surviving spouse with a child under 18, USD.
  transitional_benefit_months: Months the transitional benefit is paid from the start of DIC entitlement, months.
  eight_year_disability_years: Years the veteran must have been rated totally disabled immediately before death, while married to the spouse throughout, for the 8-year provision, years.
  child_age_limit_years: Age at which a child stops being added to the spouse's award, years.
  school_child_age_limit_years: Age until which a school child may receive DIC in their own right, years.
  remarriage_retention_age: Age at or after which a surviving spouse who remarries keeps DIC, years.
  remarriage_before_age_terminates: Whether remarriage before the retention age ends DIC, boolean.
  marriage_min_years: Years of marriage before death that qualify a spouse when no other marriage condition is met, years.
  marriage_within_years_of_discharge: Years after the end of the period of service in which the disability arose within which a marriage qualifies, years.
  child_of_marriage_qualifies: Whether a child born of the marriage qualifies the spouse regardless of marriage length, boolean.
  total_disability_years_before_death: Years of continuous total disability before death that make DIC payable for a non-service-connected death, years.
  total_disability_since_discharge_years: Years of total disability continuously from discharge that make DIC payable, years.
  former_pow_total_disability_years: Years of total disability before death that make DIC payable for a former prisoner of war, years.
  claim_window_days: Days after the veteran's death within which a DIC claim takes the first day of the month of death as its effective date, calendar days.
  payment_start_rule: First entitlement month paid when the claim is timely, enum text.
  payment_day_of_month: Day of the following month on which a monthly payment is issued, day number.
  direct_deposit_change_lead_days: Minimum days before a payment date that an account change must be recorded to apply, calendar days.
  aa_medical_evidence_required: Whether aid and attendance or housebound status requires medical evidence, boolean.
  housebound_definition: Basis for housebound status, enum text.
  sbp_offset_applies: Whether DIC is offset against the Survivor Benefit Plan annuity, boolean.
  survivors_pension_election: Whether a spouse entitled to both DIC and Survivors Pension is paid the greater unless electing otherwise, boolean.
  accrued_benefits_claim_window_days: Days after the veteran's death within which a claim for benefits due and unpaid to the veteran must be filed, calendar days.
  month_of_death_payment_released: Whether the veteran's payment for the month of death is released to the surviving spouse, boolean.
  ch35_eligibility_for_spouse: Whether the DIC spouse is eligible for Chapter 35 education benefits, boolean.
  funding_fee_exemption_for_spouse: Whether the DIC spouse is exempt from the home loan funding fee, boolean.
  champva_eligibility: Whether the spouse may be eligible for CHAMPVA health coverage, boolean.
  returned_payments_suspension_count: Returned payments within the window that require suspension, count.
  returned_payments_window_months: Rolling window for counting returned payments, months.
  child_removal_effective_rule: When a child addition ends, enum text.
  child_addition_effective_rule: When a child addition starts on a timely report, enum text.
  dependency_report_window_days: Days after a birth or adoption within which a report takes the event date as the effective date, calendar days.
  helpless_child_no_age_limit: Whether a child permanently incapable of self-support before 18 stays on the award without an age limit, boolean.
  remarriage_report_effective_rule: When termination for remarriage takes effect, enum text.
  cohabitation_treated_as_remarriage: Whether living with another person and holding out as spouses is treated as remarriage, boolean.
  reinstatement_after_marriage_ends: Whether DIC can be resumed after a disqualifying remarriage ends by death or divorce, boolean.
  rate_rounding: How monthly amounts are rounded, enum text.
  dependency_oral_reduction_allowed: Whether a telephone report may remove a child or end the award, boolean.
  dependency_oral_addition_allowed: Whether a telephone report may add a child, boolean.
  itf_validity_days: Days after VA receives an intent to file during which a DIC claim takes that date, calendar days.
  aid_attendance_includes_housebound: Whether a spouse meeting both standards is paid only the aid-and-attendance addition, boolean.
  eight_year_requires_rating_record: Whether the 8-year provision is proven only from the veteran's rating record, boolean.
  parents_dic_separate: Whether parents' DIC is a separate income-based benefit not paid on the spouse's award, boolean.
  restored_entitlement_ages: Ages from which remarried surviving spouses keep or may restore DIC, enum text.

