events:
  - type: dic_award_established
    target: dic_awards
    mutation: create
    meaning: VA grants DIC to a surviving spouse.
    grain: one row per surviving spouse award
    fields:
      customer_id: Surviving spouse.
      variant_name: Rate category.
      veteran_customer_id: Deceased veteran.
      veteran_date_of_death: Date of death.
      marriage_date: Marriage date.
      effective_date: Effective date.
      transitional_benefit_end_month: Last transitional month, or empty.
      payment_method: Delivery method.
      payment_account_last4: Account last four digits, or empty.
      opened_date: Authorization date.
    triggers: []

  - type: dic_award_activated
    target: dic_awards
    mutation: {transition: {from: authorized, to: running}}
    meaning: The first DIC payment is released.
    grain: one row per transaction
    fields:
      status: Set to running.
    triggers: []

  - type: dic_award_suspended
    target: dic_awards
    mutation: {transition: {from: running, to: suspended}}
    meaning: Payments are suspended.
    grain: one row per transaction
    fields:
      status: Set to suspended.
    triggers: []

  - type: dic_award_resumed
    target: dic_awards
    mutation: {transition: {from: suspended, to: running}}
    meaning: Payments resume.
    grain: one row per transaction
    fields:
      status: Set to running.
    triggers:
      - event: dic:dic_retro_payment
        map: {dic_award_id: dic_award_id, customer_id: customer_id}

  - type: dic_award_terminated
    target: dic_awards
    mutation: {transition: [{from: running, to: terminated}, {from: suspended, to: terminated}]}
    meaning: The DIC award ends.
    grain: one row per transaction
    fields:
      status: Set to terminated.
      termination_reason: Reason.
      closed_date: Termination date.
    triggers: []

  - type: dic_rate_category_changed
    target: dic_awards
    mutation: update
    meaning: Housebound or aid-and-attendance status is granted or ends, or the 8-year provision is established.
    grain: one row per transaction
    fields:
      variant_name: New rate category.
      effective_date: Effective date.
    triggers: []

  - type: dic_payment_profile_updated
    target: dic_awards
    mutation: update
    meaning: The surviving spouse changes how DIC is delivered.
    grain: one row per transaction
    fields:
      payment_method: New method.
      payment_account_last4: New account last four digits, or empty.
    triggers: []

  - type: dic_monthly_payment
    target: dic_payments
    meaning: DIC for one entitlement month is issued.
    grain: one row per award per entitlement month
    distinguish_by: [payment_month]
    fields:
      dic_award_id: Award.
      customer_id: Spouse.
      payment_month: Month covered.
      payment_date: Issue date.
      gross_amount: Entitlement.
      net_amount: Delivered amount.
    account: dic_paid
    direction: in
    triggers: []

  - type: dic_retro_payment
    target: dic_payments
    meaning: Past-due DIC for a span of months is released.
    grain: one row per release
    distinguish_by: [retro_period_start, payment_month]
    fields:
      dic_award_id: Award.
      customer_id: Spouse.
      retro_period_start: First month covered.
      payment_month: Last month covered.
      payment_date: Issue date.
      gross_amount: Past-due amount.
      net_amount: Delivered amount.
    account: dic_paid
    direction: in
    triggers: []

  - type: dic_payment_returned
    target: dic_payments
    meaning: The Treasury returns an issued DIC payment.
    grain: one row per payment returned
    distinguish_by: [source_payment_id]
    fields:
      dic_award_id: Award.
      customer_id: Spouse.
      source_payment_id: Payment returned.
      payment_month: Month of the payment returned.
      payment_date: Date funds came back.
      gross_amount: Gross of the payment returned.
      net_amount: Negative of the net returned.
      return_reason: Reason.
    account: dic_paid
    direction: out
    triggers: []

  - type: dic_child_added
    target: dic_children
    meaning: A child under the age limit is added to the surviving spouse's award.
    grain: one row per child added
    distinguish_by: [child_name, child_birth_date]
    fields:
      dic_award_id: Award.
      customer_id: Spouse.
      child_name: Child's name.
      child_birth_date: Child's birth date.
      effective_date: Effective date.
      removal_reason: Always not_applicable.
    triggers: []

  - type: dic_child_removed
    target: dic_children
    meaning: A child stops being paid on the surviving spouse's award.
    grain: one row per child removed
    distinguish_by: [source_child_event_id]
    fields:
      dic_award_id: Award.
      customer_id: Spouse.
      child_name: Child's name.
      child_birth_date: Child's birth date.
      effective_date: Effective date.
      removal_reason: Reason.
      source_child_event_id: Addition ended.
    triggers: []

measures:
  - id: dic_msr_returned_payments_window
    window: Rolling returned_payments_window_months calendar months ending on the current date.
    measure: Count of dic_payment_returned entries on the award whose payment_date falls in the window.

policies:
  - id: dic_agg_multi_holding
    subject: [dic_award_established]
    rule: >-
      A surviving spouse holds at most one DIC award, based on one veteran's death. An award is established only when the spouse holds no DIC award whose status is authorized, running or suspended. Parents' DIC and DIC paid to children in their own right are separate benefits and are never paid on the spouse's award.
    eligibility:
      - id: one_dic
        applies_to: [dic_award_established]
        kind: dedup
        condition: An award is established only when the spouse holds no DIC award whose status is authorized, running or suspended.
        evidence_fields: [dic_awards.customer_id, dic_awards.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dic_awards.customer_id]
          action_bindings:
            dic_awards.customer_id: customer_id
        dedup_contract:
          table: dic_awards
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [authorized, running, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1
      parents_dic_separate: =parents_dic_separate

  - id: dic_monthly_rate
    subject: [dic_monthly_payment, dic_retro_payment]
    rule: >-
      The monthly DIC is the basic rate, plus the 8-year addition on an 8-year provision tier, plus the housebound or the
      aid-and-attendance addition of the tier (never both), plus the child addition for each child on the award under the
      child age limit, plus the transitional benefit for the first transitional_benefit_months months of entitlement while
      a child under 18 is on the award. Amounts are kept to the cent. A monthly payment is released only while the award status is running.
    eligibility:
      - id: dic_running
        applies_to: [dic_monthly_payment]
        kind: state
        condition: A monthly payment is released only while the award status is running.
        evidence_fields: [dic_awards.status, dic_awards.dic_award_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dic_awards.dic_award_id]
          action_bindings:
            dic_awards.dic_award_id: dic_award_id
        state_contract:
          field: dic_awards.status
          allowed: [running]
    params:
      per_tier:
        DIC Surviving Spouse (Basic Rate): {eight_year_addition: =eight_year_addition, housebound_addition: =housebound_addition, aid_attendance_addition: =aid_attendance_addition}
        DIC Surviving Spouse (Basic Rate with 8-Year Provision): {eight_year_addition: =eight_year_addition, housebound_addition: =housebound_addition, aid_attendance_addition: =aid_attendance_addition}
        DIC Surviving Spouse (Housebound): {eight_year_addition: =eight_year_addition, housebound_addition: =housebound_addition, aid_attendance_addition: =aid_attendance_addition}
        DIC Surviving Spouse (Housebound with 8-Year Provision): {eight_year_addition: =eight_year_addition, housebound_addition: =housebound_addition, aid_attendance_addition: =aid_attendance_addition}
        DIC Surviving Spouse (Aid and Attendance): {eight_year_addition: =eight_year_addition, housebound_addition: =housebound_addition, aid_attendance_addition: =aid_attendance_addition}
        DIC Surviving Spouse (Aid and Attendance with 8-Year Provision): {eight_year_addition: =eight_year_addition, housebound_addition: =housebound_addition, aid_attendance_addition: =aid_attendance_addition}
      monthly_basic_rate: =monthly_basic_rate
      child_addition: =child_addition
      transitional_benefit_monthly: =transitional_benefit_monthly
      transitional_benefit_months: =transitional_benefit_months
      rate_rounding: =rate_rounding
      aid_attendance_includes_housebound: =aid_attendance_includes_housebound
    formula:
      gross_amount: "monthly_basic_rate + eight_year_addition + housebound_addition + aid_attendance_addition"

  - id: dic_entitlement
    subject: [dic_award_established, dic_retro_payment]
    rule: >-
      DIC is payable to a surviving spouse when the veteran died in service, died of a service-connected disability, or was
      rated totally disabled for total_disability_years_before_death years before death (or continuously from discharge for
      total_disability_since_discharge_years years, or former_pow_total_disability_years year for a former prisoner of
      war). The spouse must have married the veteran within marriage_within_years_of_discharge years after the period of
      service, or been married marriage_min_years year or more, or had a child with the veteran. A claim received within
      claim_window_days days of the death is effective the first day of the month of death; a later claim is effective the
      date of claim, or of an intent to file received within itf_validity_days days before it. The 8-year provision applies
      only when the rating record shows the veteran rated totally disabled for eight_year_disability_years years
      immediately before death while married to the spouse throughout. Benefits due to the veteran and unpaid at death are
      claimed within accrued_benefits_claim_window_days days.
    eligibility: []
    params:
      total_disability_years_before_death: =total_disability_years_before_death
      total_disability_since_discharge_years: =total_disability_since_discharge_years
      former_pow_total_disability_years: =former_pow_total_disability_years
      marriage_within_years_of_discharge: =marriage_within_years_of_discharge
      marriage_min_years: =marriage_min_years
      child_of_marriage_qualifies: =child_of_marriage_qualifies
      claim_window_days: =claim_window_days
      itf_validity_days: =itf_validity_days
      eight_year_disability_years: =eight_year_disability_years
      eight_year_requires_rating_record: =eight_year_requires_rating_record
      accrued_benefits_claim_window_days: =accrued_benefits_claim_window_days
      payment_start_rule: =payment_start_rule
      month_of_death_payment_released: =month_of_death_payment_released

  - id: dic_evt_children
    subject: [dic_child_added, dic_child_removed]
    rule: >-
      A child is added on a dependency report received online or by mail, effective on the birth or adoption date when the
      report arrives within dependency_report_window_days days of it; a telephone report cannot add a child but can remove
      one. A child is removed the day before the child_age_limit_years birthday, or the last day of the month in which
      the child marries or dies; a child permanently incapable of self-support before 18 stays on the award without an age
      limit. A school child from 18 to school_child_age_limit_years receives DIC in their own right, not on the spouse's
      award. Each child addition is removed only once.
    eligibility:
      - id: child_removed_once
        applies_to: [dic_child_removed]
        kind: dedup
        condition: Each child addition is removed only once.
        evidence_fields: [dic_children.source_child_event_id, dic_children.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dic_children.source_child_event_id]
          action_bindings:
            dic_children.source_child_event_id: source_child_event_id
        dedup_contract:
          table: dic_children
          mode: separate_record
          object_bindings: {source_child_event_id: source_child_event_id}
          duplicate_filters: {event_type: [dic_child_removed]}
          distinct_fields: []
    params:
      child_age_limit_years: =child_age_limit_years
      school_child_age_limit_years: =school_child_age_limit_years
      dependency_report_window_days: =dependency_report_window_days
      helpless_child_no_age_limit: =helpless_child_no_age_limit
      child_removal_effective_rule: =child_removal_effective_rule
      child_addition_effective_rule: =child_addition_effective_rule
      dependency_oral_reduction_allowed: =dependency_oral_reduction_allowed
      dependency_oral_addition_allowed: =dependency_oral_addition_allowed

  - id: dic_evt_remarriage
    subject: [dic_award_terminated]
    rule: >-
      A surviving spouse who remarries before age remarriage_retention_age loses DIC effective the last day of the month
      before the remarriage, and living with another person while holding out as spouses is treated as remarriage; a
      spouse who remarries at or after that age keeps DIC. DIC can be resumed after a disqualifying remarriage ends by
      death or divorce. The award also ends on the spouse's death or an election of Survivors Pension.
    eligibility: []
    params:
      remarriage_retention_age: =remarriage_retention_age
      remarriage_before_age_terminates: =remarriage_before_age_terminates
      cohabitation_treated_as_remarriage: =cohabitation_treated_as_remarriage
      reinstatement_after_marriage_ends: =reinstatement_after_marriage_ends
      remarriage_report_effective_rule: =remarriage_report_effective_rule
      restored_entitlement_ages: =restored_entitlement_ages

  - id: dic_evt_care_level
    subject: [dic_rate_category_changed]
    rule: >-
      A housebound or aid-and-attendance tier is granted on medical evidence showing the spouse is permanently housebound or
      needs the regular aid and attendance of another person; a spouse meeting both standards is paid only the
      aid-and-attendance addition. The higher rate is paid from the month after its effective date.
    eligibility: []
    params:
      per_tier:
        DIC Surviving Spouse (Basic Rate): {aa_medical_evidence_required: =aa_medical_evidence_required}
        DIC Surviving Spouse (Basic Rate with 8-Year Provision): {aa_medical_evidence_required: =aa_medical_evidence_required}
        DIC Surviving Spouse (Housebound): {aa_medical_evidence_required: =aa_medical_evidence_required}
        DIC Surviving Spouse (Housebound with 8-Year Provision): {aa_medical_evidence_required: =aa_medical_evidence_required}
        DIC Surviving Spouse (Aid and Attendance): {aa_medical_evidence_required: =aa_medical_evidence_required}
        DIC Surviving Spouse (Aid and Attendance with 8-Year Provision): {aa_medical_evidence_required: =aa_medical_evidence_required}
      housebound_definition: =housebound_definition

  - id: dic_payment_schedule
    subject: [dic_award_activated, dic_payment_profile_updated, dic_payment_returned, dic_award_suspended, dic_award_resumed]
    rule: >-
      DIC is paid monthly in arrears on payment_day_of_month of the following month. An account change applies to a payment
      only when recorded direct_deposit_change_lead_days days before its issue date and only after the caller's identity is
      verified. The award is suspended when returned_payments_suspension_count payments come back within
      returned_payments_window_months months (dic_msr_returned_payments_window) and resumes when a current address or account
      is confirmed, with the withheld months released retroactively.
    eligibility: []
    params:
      payment_day_of_month: =payment_day_of_month
      direct_deposit_change_lead_days: =direct_deposit_change_lead_days
      returned_payments_suspension_count: =returned_payments_suspension_count
      returned_payments_window_months: =returned_payments_window_months
    measures: [dic_msr_returned_payments_window]

  - id: dic_interact_other_benefits
    subject: [dic_award_established, dic_monthly_payment]
    rule: >-
      Holding DIC opens other benefits: the spouse is eligible for Chapter 35 education benefits, is exempt from the home loan
      funding fee, and may be eligible for CHAMPVA. DIC is no longer offset against a Survivor Benefit Plan annuity.
    eligibility: []
    params:
      ch35_eligibility_for_spouse: =ch35_eligibility_for_spouse
      funding_fee_exemption_for_spouse: =funding_fee_exemption_for_spouse
      champva_eligibility: =champva_eligibility
      sbp_offset_applies: =sbp_offset_applies

  - id: dic_excl_survivors_pension
    subject: [dic_award_established, dic_award_terminated]
    rule: >-
      DIC and Survivors Pension are never paid to the same surviving spouse for the same month; a spouse entitled to both is
      paid the greater benefit unless they elect otherwise in writing, and the election is the spouse's own act.
    eligibility: []
    params:
      survivors_pension_election: =survivors_pension_election
