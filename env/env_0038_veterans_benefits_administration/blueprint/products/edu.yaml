    tuition_overpayment_debt_type: Post-9/11 GI Bill Tuition and Fees Overpayment
    school_closure_restoration: true
    certification_advance_days: 120
    books_paid_at_term_start: true

events:
  - type: edu_benefit_established
    target: edu_benefits
    mutation: create
    meaning: VA finds the beneficiary eligible under a chapter and issues a Certificate of Eligibility granting entitlement.
    grain: one row per beneficiary per chapter
    fields:
      customer_id: The beneficiary.
      variant_name: Chapter and benefit level granted.
      status: Set to active.
      original_entitlement_days: Entitlement granted.
      entitlement_days_remaining: Equal to the entitlement granted at establishment.
      delimiting_date: Last usable date, or empty when there is no time limit.
      coe_issued_date: Certificate date.
      yellow_ribbon_school_agreement: Whether the current school has a Yellow Ribbon agreement for the program.
      payment_method: Delivery method.
      payment_account_last4: Account last four digits, or empty.
      opened_date: Establishment date.
    account: entitlement_days
    direction: in
    triggers: []

  - type: edu_benefit_exhausted
    target: edu_benefits
    mutation: {transition: {from: active, to: exhausted}}
    meaning: The last day of entitlement has been charged.
    grain: one row per transaction
    fields:
      status: Set to exhausted.
      closed_date: Date entitlement ran out.
    triggers: []

  - type: edu_benefit_reactivated
    target: edu_benefits
    mutation: {transition: {from: exhausted, to: active}}
    meaning: Restored entitlement makes an exhausted benefit usable again.
    grain: one row per transaction
    fields:
      status: Set to active.
      closed_date: Reset to empty.
    triggers: []

  - type: edu_benefit_delimited
    target: edu_benefits
    mutation: {transition: {from: active, to: delimited}}
    meaning: The delimiting date has passed.
    grain: one row per transaction
    fields:
      status: Set to delimited.
      closed_date: The delimiting date.
    triggers: []

  - type: edu_benefit_relinquished
    target: edu_benefits
    mutation: {transition: {from: active, to: relinquished}}
    meaning: The beneficiary irrevocably relinquishes this chapter to elect the Post-9/11 GI Bill.
    grain: one row per transaction
    fields:
      status: Set to relinquished.
      closed_date: Date of the election.
    triggers: []

  - type: edu_benefit_level_changed
    target: edu_benefits
    mutation: update
    meaning: Additional qualifying active service raises the Post-9/11 GI Bill benefit level.
    grain: one row per transaction
    fields:
      variant_name: New benefit level.
    triggers: []

  - type: edu_school_profile_updated
    target: edu_benefits
    mutation: update
    meaning: The Yellow Ribbon status of the student's current school program or the student's payment account changes.
    grain: one row per transaction
    fields:
      yellow_ribbon_school_agreement: Updated Yellow Ribbon status.
      payment_method: Updated delivery method.
      payment_account_last4: Updated account last four digits, or empty.
    triggers: []

  - type: edu_enrollment_certified
    target: edu_enrollments
    meaning: The school certifying official certifies the student's enrollment for a term.
    grain: one row per benefit per school per term
    distinguish_by: [facility_code, term_start_date]
    fields:
      edu_benefit_id: Benefit used.
      customer_id: Student.
      school_name: School.
      facility_code: Facility code.
      term_start_date: Term start.
      term_end_date: Term end.
      credit_hours: Credits certified.
      training_time: Training time.
      rate_of_pursuit_pct: Rate of pursuit.
      online_only: Whether all courses are distance learning.
      tuition_fees_charged: Net tuition and fees.
      mha_bah_rate: Housing allowance rate for the campus ZIP.
    triggers:
      - event: edu:edu_entitlement_charged
        map: {edu_benefit_id: edu_benefit_id, customer_id: customer_id, enrollment_id: enrollment_id, charge_period_start: term_start_date, charge_period_end: term_end_date}

  - type: edu_enrollment_amended
    target: edu_enrollments
    meaning: The school reports a reduction in credits, a withdrawal, or a correction to a certified term.
    grain: one row per amendment of one certification per effective date
    distinguish_by: [source_enrollment_id, amendment_effective_date]
    fields:
      edu_benefit_id: Benefit used.
      customer_id: Student.
      source_enrollment_id: Certification amended.
      school_name: School.
      facility_code: Facility code.
      term_start_date: Term start of the certification amended.
      term_end_date: Term end of the certification amended.
      credit_hours: Credits remaining.
      training_time: Training time after the change.
      rate_of_pursuit_pct: Rate of pursuit after the change.
      tuition_fees_charged: Net tuition and fees after the change.
      amendment_reason: Reason.
      amendment_effective_date: Last date of attendance in the dropped courses.
      mitigating_circumstances: Whether mitigating circumstances were accepted.
      overpayment_created: Whether payments already issued exceed the amended entitlement.
    triggers:
      - event: debt:debt_established
        when: {overpayment_created: true}
        map: {customer_id: customer_id, source_record_id: enrollment_id, source_category: edu}

  - type: edu_enrollment_verified
    target: edu_enrollments
    meaning: The student confirms that their enrollment for a completed month is unchanged.
    grain: one row per certification per month verified
    distinguish_by: [source_enrollment_id, verification_month]
    fields:
      edu_benefit_id: Benefit used.
      customer_id: Student.
      source_enrollment_id: Certification verified.
      verification_month: Month verified.
      verification_channel: Channel used.
    triggers: []

  - type: edu_tuition_payment
    target: edu_payments
    meaning: Post-9/11 GI Bill tuition and fees for a certified term are paid to the school.
    grain: one row per certification
    distinguish_by: [enrollment_id]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification paid.
      payment_month: Month of the term start.
      payment_date: Issue date.
      payee: Always school.
      days_paid: Always 0.
      amount: Amount paid.
    account: edu_benefits_paid
    direction: in
    triggers: []

  - type: edu_housing_payment
    target: edu_payments
    meaning: The Post-9/11 GI Bill monthly housing allowance for a verified month of training is paid to the student.
    grain: one row per certification per month of training
    distinguish_by: [enrollment_id, payment_month]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification.
      payment_month: Month of training.
      payment_date: Issue date.
      payee: Always student.
      days_paid: Days of the month in the term.
      amount: Amount paid.
    account: edu_benefits_paid
    direction: in
    triggers: []

  - type: edu_books_stipend_payment
    target: edu_payments
    meaning: The Post-9/11 GI Bill books and supplies stipend for a certified term is paid to the student.
    grain: one row per certification
    distinguish_by: [enrollment_id]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification.
      payment_month: Month of the term start.
      payment_date: Issue date.
      payee: Always student.
      days_paid: Always 0.
      amount: Amount paid.
    account: edu_benefits_paid
    direction: in
    triggers: []

  - type: edu_monthly_benefit_payment
    target: edu_payments
    meaning: The flat monthly benefit under Chapter 30, 35 or 1606 for a verified month of training is paid to the student.
    grain: one row per certification per month of training
    distinguish_by: [enrollment_id, payment_month]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification.
      payment_month: Month of training.
      payment_date: Issue date.
      payee: Always student.
      days_paid: Days of the month in the term.
      amount: Amount paid.
    account: edu_benefits_paid
    direction: in
    triggers: []

  - type: edu_payment_returned
    target: edu_payments
    meaning: Money paid on the benefit comes back - a school refunding tuition after a withdrawal, or a student payment returned by the bank.
    grain: one row per payment returned
    distinguish_by: [source_payment_id]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification of the payment returned.
      source_payment_id: Payment returned.
      payment_month: Month of the payment returned.
      payment_date: Date funds came back.
      payee: Payee of the payment returned.
      days_paid: Always 0.
      amount: Negative of the amount returned.
      return_reason: Why it came back.
    account: edu_benefits_paid
    direction: out
    triggers: []

  - type: edu_entitlement_charged
    target: edu_entitlement_ledger
    meaning: Entitlement is charged for a certified period of training.
    grain: one row per certification charged
    distinguish_by: [enrollment_id, charge_period_start]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification charged.
      days: Days charged.
      charge_period_start: First day charged.
      charge_period_end: Last day charged.
      restoration_reason: Always not_applicable.
    account: entitlement_days
    direction: out
    triggers: []

  - type: edu_entitlement_restored
    target: edu_entitlement_ledger
    meaning: Entitlement charged for training is given back because the training was cut short by a school closure, a program disapproval, or an amendment.
    grain: one row per certification restored per reason
    distinguish_by: [enrollment_id, restoration_reason]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification whose charge is restored.
      days: Days restored.
      charge_period_start: First day restored.
      charge_period_end: Last day restored.
      restoration_reason: Reason.
    account: entitlement_days
    direction: in
    triggers: []

measures:
  - id: edu_msr_unverified_months
    window: Consecutive completed months of the current certified term, ending with the month before the current month.
    measure: Count of the most recent consecutive months of training with no edu_enrollment_verified entry for the certification.
  - id: edu_msr_housing_paid_after_change
    window: From the amendment's effective date (or the term start date when no mitigating circumstances apply) through the term end date.
    measure: Sum of amount over edu_housing_payment and edu_monthly_benefit_payment entries for the amended certification covering days in the window, minus what the amended enrollment supports for those days.
  - id: edu_msr_total_months_used_all_chapters
    window: Lifetime of the beneficiary.
    measure: Sum over all of the beneficiary's education benefits of (original_entitlement_days minus entitlement_days_remaining) divided by 30.
  - id: edu_msr_books_paid_academic_year
    window: Academic year August 1 through July 31 containing the term start.
    measure: Sum of amount over edu_books_stipend_payment entries on the benefit whose payment_month falls in the window.

policies:
  - id: edu_agg_multi_holding
    subject: [edu_benefit_established]
    rule: >-
      A beneficiary may hold education benefits under more than one chapter (for example the Selected Reserve
      Montgomery GI Bill earned in the Reserve and the Post-9/11 GI Bill earned on active duty, or Chapter 35 as a child
      and a chapter earned through their own service), with no fixed limit on the number of chapters, but holds at most
      one benefit record per chapter; a change of Post-9/11 benefit level updates that record. A benefit record is established only when the beneficiary holds no benefit record under the same official tier.
    eligibility:
      - id: one_record_per_chapter
        applies_to: [edu_benefit_established]
        kind: dedup
        condition: A benefit record is established only when the beneficiary holds no benefit record under the same official tier.
        evidence_fields: [edu_benefits.customer_id, edu_benefits.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [edu_benefits.customer_id, edu_benefits.variant_name]
          action_bindings:
            edu_benefits.customer_id: customer_id
            edu_benefits.variant_name: variant_name
        dedup_contract:
          table: edu_benefits
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name}
          duplicate_filters: {status: [active, exhausted, delimited, relinquished]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: edu_agg_combined_cap
    subject: [edu_entitlement_charged, edu_benefit_established]
    rule: >-
      A beneficiary who holds two or more chapters can use no more than combined_entitlement_cap_months months of
      entitlement in total across all of them (edu_msr_total_months_used_all_chapters), even though each chapter grants
      its own entitlement_months. When the next charge would cross the combined cap, only the days up to the cap are
      charged and paid; the benefit with remaining days is then treated as having none. Chapter 35 entitlement used as a
      dependent counts toward the cap together with chapters earned through the beneficiary's own service.
    eligibility: []
    params:
      combined_entitlement_cap_months: =combined_entitlement_cap_months
      entitlement_months: =entitlement_months
    measures: [edu_msr_total_months_used_all_chapters]

  - id: edu_ch33_tuition
    subject: [edu_tuition_payment]
    rule: >-
      Post-9/11 GI Bill tuition and fees are paid directly to the school once per certified term. At a public school
      the actual net in-state tuition and fees are covered without a dollar cap; at a private or foreign school the
      payment for an academic year is limited to private_tuition_cap_annual; in either case the result is multiplied by
      the benefit_level_pct of the tier. Tuition above the cap at a private school can be partly covered by Yellow Ribbon
      matching only where the tier is yellow_ribbon_eligible and the school has a Yellow Ribbon agreement covering the
      student's program. Flat-rate chapters never pay tuition to the school. Tuition is paid only for a certification on a benefit whose status is active.
    eligibility:
      - id: benefit_active_tuition
        applies_to: [edu_tuition_payment]
        kind: state
        condition: Tuition is paid only for a certification on a benefit whose status is active.
        evidence_fields: [edu_benefits.status, edu_benefits.edu_benefit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [edu_benefits.edu_benefit_id]
          action_bindings:
            edu_benefits.edu_benefit_id: edu_benefit_id
        state_contract:
          field: edu_benefits.status
          allowed: [active]
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        Montgomery GI Bill - Active Duty (Chapter 30): {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
      public_instate_full_coverage: =public_instate_full_coverage
      yellow_ribbon_requires_school_agreement: =yellow_ribbon_requires_school_agreement
      tuition_paid_per_term: =tuition_paid_per_term
    formula:
      amount: "round(min(tuition_fees_charged, private_tuition_cap_annual) * benefit_level_pct / 100, 2)"

  - id: edu_ch33_housing
    subject: [edu_housing_payment]
    rule: >-
      The Post-9/11 GI Bill monthly housing allowance is paid to the student only when the rate of pursuit is greater
      than housing_min_rate_of_pursuit_pct percent. For a month of training it equals the campus housing rate on the
      certification (or online_only_housing_monthly when every course is distance learning, or
      foreign_school_housing_monthly at a foreign school), multiplied by the benefit_level_pct of the tier and by the rate
      of pursuit rounded to the nearest tenth, prorated by the days of the month inside the term over a
      housing_month_days_basis-day month, and kept to the cent. Nothing is paid for days between terms. A housing payment for a month is released only after the student has verified enrollment for that month.
    eligibility:
      - id: month_verified
        applies_to: [edu_housing_payment]
        kind: authorization
        condition: A housing payment for a month is released only after the student has verified enrollment for that month.
        evidence_fields: [edu_enrollments.source_enrollment_id, edu_enrollments.verification_month]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [edu_enrollments.source_enrollment_id, edu_enrollments.verification_month]
          action_bindings:
            edu_enrollments.source_enrollment_id: enrollment_id
            edu_enrollments.verification_month: payment_month
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        Montgomery GI Bill - Active Duty (Chapter 30): {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
      housing_min_rate_of_pursuit_pct: =housing_min_rate_of_pursuit_pct
      housing_rate_of_pursuit_rounding: =housing_rate_of_pursuit_rounding
      housing_month_days_basis: =housing_month_days_basis
      break_pay_allowed: =break_pay_allowed
    formula:
      when_not: "rate_of_pursuit_pct <= housing_min_rate_of_pursuit_pct"
      amount: "round(mha_bah_rate * benefit_level_pct / 100 * round(rate_of_pursuit_pct / 100, 1) * days_paid / housing_month_days_basis, 2)"

  - id: edu_ch33_books
    subject: [edu_books_stipend_payment]
    rule: >-
      The Post-9/11 GI Bill books and supplies stipend is paid to the student in one lump sum at the start of each
      certified term: books_stipend_per_credit for each credit certified, multiplied by the benefit_level_pct of the tier,
      and limited so that the stipends paid in one academic year (edu_msr_books_paid_academic_year) never exceed
      books_stipend_annual_cap multiplied by the benefit level. Flat-rate chapters pay no books stipend.
    eligibility: []
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        Montgomery GI Bill - Active Duty (Chapter 30): {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
      books_paid_at_term_start: =books_paid_at_term_start
    formula:
      amount: "round(books_stipend_per_credit * credit_hours * benefit_level_pct / 100, 2)"
    measures: [edu_msr_books_paid_academic_year]

  - id: edu_flat_rate_monthly
    subject: [edu_monthly_benefit_payment]
    rule: >-
      Chapter 30, Chapter 35 and Chapter 1606 pay the student a flat monthly rate by training time - the full-time,
      three-quarter-time, half-time or less-than-half-time rate of the tier - prorated by the days of the month inside the
      term over a housing_month_days_basis-day month; the less-than-half-time amount never exceeds the tuition and fees
      charged for the month. The school is paid nothing directly. A monthly payment is released only after the student has verified enrollment for that month, and it is paid on payment_day_of_month of the following month.
    eligibility:
      - id: flat_month_verified
        applies_to: [edu_monthly_benefit_payment]
        kind: authorization
        condition: A monthly payment is released only after the student has verified enrollment for that month
        evidence_fields: [edu_enrollments.source_enrollment_id, edu_enrollments.verification_month]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [edu_enrollments.source_enrollment_id, edu_enrollments.verification_month]
          action_bindings:
            edu_enrollments.source_enrollment_id: enrollment_id
            edu_enrollments.verification_month: payment_month
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        Montgomery GI Bill - Active Duty (Chapter 30): {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
      housing_month_days_basis: =housing_month_days_basis
      payment_day_of_month: =payment_day_of_month

  - id: edu_evt_monthly_verification
    subject: [edu_enrollment_verified]
    rule: >-
      A student paid a housing allowance or a flat monthly rate must verify each month of enrollment, from
      verification_open_day of that month (or its last day, if earlier) onward, online, by text message or by telephone.
      Verifying is the student's own statement about their attendance and is never given on their behalf. Each month of a certification is verified only once. When verification_missed_months_suspend consecutive months go unverified
      (edu_msr_unverified_months), payments to the student stop until the missing months are verified; once verified,
      the held months are paid. Tuition paid to the school does not depend on monthly verification.
    eligibility:
      - id: verify_once
        applies_to: [edu_enrollment_verified]
        kind: dedup
        condition: Each month of a certification is verified only once.
        evidence_fields: [edu_enrollments.source_enrollment_id, edu_enrollments.verification_month, edu_enrollments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [edu_enrollments.source_enrollment_id, edu_enrollments.verification_month]
          action_bindings:
            edu_enrollments.source_enrollment_id: source_enrollment_id
            edu_enrollments.verification_month: verification_month
        dedup_contract:
          table: edu_enrollments
          mode: separate_record
          object_bindings: {source_enrollment_id: source_enrollment_id, verification_month: verification_month}
          duplicate_filters: {event_type: [edu_enrollment_verified]}
          distinct_fields: []
    params:
      monthly_verification_required: =monthly_verification_required
      verification_missed_months_suspend: =verification_missed_months_suspend
      verification_open_day: =verification_open_day
    measures: [edu_msr_unverified_months]

  - id: edu_evt_enrollment_change
    subject: [edu_enrollment_amended, edu_payment_returned, edu_entitlement_restored]
    rule: >-
      When a student reduces credits or withdraws, the change is effective on the term start date unless VA accepts
      mitigating circumstances, in which case it is effective on the last date of attendance; the first
      mitigating_excused_credits credit hours a student ever drops are accepted as mitigating without evidence, and other
      reasons (serious illness, a family emergency, military orders) require evidence. Payments already issued for days
      after the effective date beyond what the amended enrollment supports (edu_msr_housing_paid_after_change) become an
      overpayment, established as the tier's overpayment_debt_type for housing, books and flat monthly payments. A
      tuition and fees overpayment is established against the school when the change took effect before the term
      started and the tier's tuition_debt_school_liable_before_start is true, and as the tier's
      tuition_overpayment_debt_type against the student otherwise. Entitlement charged for days no longer certified is
      restored, and tuition the school refunds is recorded as a return.
    eligibility: []
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        Montgomery GI Bill - Active Duty (Chapter 30): {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
      mitigating_excused_credits: =mitigating_excused_credits
      no_mitigating_effective_rule: =no_mitigating_effective_rule
      mitigating_effective_rule: =mitigating_effective_rule
    measures: [edu_msr_housing_paid_after_change]

  - id: edu_entitlement_charging
    subject: [edu_entitlement_charged, edu_entitlement_restored, edu_benefit_exhausted, edu_benefit_reactivated]
    rule: >-
      Entitlement is charged for every day of a certified term. Under the rate_of_pursuit basis each day is charged at
      the rate of pursuit (a term at 75 percent rate of pursuit is charged 0.75 day per day, rounded to the whole day for
      the term); under the training_time basis each day is charged at 1 for full time, 0.75 for three-quarter time, 0.5
      for half time and 0.25 for less than half time. When entitlement runs out partway through a term, a Post-9/11 GI
      Bill student is paid to the end of that term, while a flat-rate chapter stops paying on the day entitlement runs
      out. Entitlement charged for a term interrupted by a school closure or program disapproval is restored when
      school_closure_restoration is true, and an exhausted benefit becomes usable again by that restoration. Schools may
      certify up to certification_advance_days days before the term starts. Entitlement is charged only on a benefit whose status is active.
    eligibility:
      - id: charge_active
        applies_to: [edu_entitlement_charged]
        kind: state
        condition: Entitlement is charged only on a benefit whose status is active.
        evidence_fields: [edu_benefits.status, edu_benefits.edu_benefit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [edu_benefits.edu_benefit_id]
          action_bindings:
            edu_benefits.edu_benefit_id: edu_benefit_id
        state_contract:
          field: edu_benefits.status
          allowed: [active]
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {entitlement_charge_basis: =entitlement_charge_basis}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {entitlement_charge_basis: =entitlement_charge_basis}
        Montgomery GI Bill - Active Duty (Chapter 30): {entitlement_charge_basis: =entitlement_charge_basis}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {entitlement_charge_basis: =entitlement_charge_basis}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {entitlement_charge_basis: =entitlement_charge_basis}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {entitlement_charge_basis: =entitlement_charge_basis}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {entitlement_charge_basis: =entitlement_charge_basis}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {entitlement_charge_basis: =entitlement_charge_basis}
      school_closure_restoration: =school_closure_restoration
      certification_advance_days: =certification_advance_days
      full_time_credit_standard: =full_time_credit_standard

  - id: edu_evt_delimiting
    subject: [edu_benefit_delimited, edu_enrollment_certified]
    rule: >-
      A benefit with a delimiting date pays nothing for training after that date; a tier whose delimiting_years is 0 has
      no time limit (the Forever GI Bill for veterans separated on or after January 1, 2013, and Chapter 35 for children
      who turned 18 on or after August 1, 2023). The delimiting date of Chapter 30 runs delimiting_years years from the
      last release from active duty. A term that straddles the delimiting date is paid only through that date.
    eligibility: []
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {delimiting_years: =delimiting_years}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {delimiting_years: =delimiting_years}
        Montgomery GI Bill - Active Duty (Chapter 30): {delimiting_years: =delimiting_years}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {delimiting_years: =delimiting_years}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {delimiting_years: =delimiting_years}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {delimiting_years: =delimiting_years}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {delimiting_years: =delimiting_years}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {delimiting_years: =delimiting_years}

  - id: edu_excl_chapter_election
    subject: [edu_benefit_relinquished, edu_benefit_established, edu_monthly_benefit_payment, edu_housing_payment]
    rule: >-
      Two education chapters are never paid for the same period of training, because concurrent_chapter_payment is
      false; the student chooses which chapter each term is certified under. Electing the Post-9/11 GI Bill in place of
      Chapter 30 or Chapter 1606 relinquishes that chapter irrevocably, and only the beneficiary can make that election.
      A veteran who relinquished Chapter 30 for a single period of service receives Post-9/11 entitlement equal to the
      Chapter 30 months remaining at the election, and receives the Chapter 30 basic pay reduction refund
      (ch30_buyin_refund_amount, prorated by unused Chapter 30 months) with the last housing payment when Post-9/11
      entitlement is exhausted. Chapter 35 cannot be relinquished for the Post-9/11 GI Bill.
    eligibility: []
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        Montgomery GI Bill - Active Duty (Chapter 30): {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
      concurrent_chapter_payment: =concurrent_chapter_payment

  - id: edu_interact_sponsor_and_comp
    subject: [edu_benefit_established, edu_enrollment_certified]
    rule: >-
      Holding Disability Compensation shapes education eligibility: Chapter 35 is established for a child or spouse only
      while the sponsor's compensation award is permanent and total (or the sponsor died of a service-connected cause),
      and a child paid Chapter 35 for a term cannot be recognized as a school child on the sponsor's compensation award
      for the same months. A Post-9/11 GI Bill benefit level rises when added qualifying active service moves the
      aggregate service into a higher band, and a 30-day continuous period ending in a service-connected disability
      discharge qualifies for the 100 percent level. Transfer of entitlement to dependents is available only on tiers with
      transfer_to_dependents_allowed and is requested by the service member through the Department of Defense, never on a
      VA service call. A student moving from a highly rural county to attend school receives rural_relocation_benefit once,
      and tutorial assistance, licensing test reimbursement and the STEM Scholarship extension are paid within their tier
      limits.
    eligibility: []
    params:
      transfer_to_dependents_allowed: =transfer_to_dependents_allowed
      rural_relocation_benefit: =rural_relocation_benefit
      tutorial_assistance_monthly_max: =tutorial_assistance_monthly_max
      tutorial_assistance_lifetime_max: =tutorial_assistance_lifetime_max
      licensing_test_reimbursement_max: =licensing_test_reimbursement_max
      stem_extension_months: =stem_extension_months
      stem_extension_max_amount: =stem_extension_max_amount

  - id: edu_evt_payment_profile_and_returns
    subject: [edu_school_profile_updated, edu_payment_returned, edu_benefit_level_changed]
    rule: >-
      A student may change the account that receives housing, books and monthly payments only after the caller's
      identity is verified; the school's payment address is maintained by the school and never changed on a student's
      call. A student payment returned by the bank is recorded as a return; reissuing it is done by the education payment unit after the account is updated and is not done on a service call. A benefit level change takes
      effect for terms beginning on or after the date the qualifying service was completed.
    eligibility: []
