category: edu
display_name: Education Benefits (GI Bill and Dependents' Education)

binding:
  holding_table: edu_benefits
  event_tables: [edu_enrollments, edu_payments, edu_entitlement_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {entitlement_days_remaining: entitlement_days}

lifecycle:
  states: [active, exhausted, delimited, relinquished]
  transitions:
    - {from: active, to: exhausted, by: system, means: The last day of entitlement is charged.}
    - {from: exhausted, to: active, by: agent, means: Entitlement is restored (for example after a school closure) and the benefit can be used again.}
    - {from: active, to: delimited, by: system, means: The delimiting date passes and the benefit can no longer be used.}
    - {from: active, to: relinquished, by: user, means: The beneficiary irrevocably gives up this benefit by electing the Post-9/11 GI Bill in its place.}

accounts:
  - key: entitlement_days
    unit: days
    meaning: Education entitlement remaining on the benefit - the grant on the Certificate of Eligibility and restorations credit it, charges for training debit it.
  - key: edu_benefits_paid
    unit: USD
    meaning: Education money paid out on the benefit to the student or the school - tuition, housing, books and monthly payments credit it, returns debit it.

parameter_schema:
  benefit_level_pct: Post-9/11 GI Bill benefit level applied to tuition, housing and books, percent (0 for chapters paid at a flat monthly rate).
  tuition_paid_to_school: Whether tuition and fees are paid directly to the school, boolean.
  private_tuition_cap_annual: Maximum tuition and fees payable per academic year at a private or foreign school before applying the benefit level, USD, academic year August 1, 2025 - July 31, 2026.
  public_instate_full_coverage: Whether actual net in-state tuition and fees at a public school are paid without a dollar cap (before the benefit level), boolean.
  yellow_ribbon_eligible: Whether the beneficiary can receive Yellow Ribbon matching for tuition above the private cap, boolean.
  housing_allowance_paid: Whether a monthly housing allowance is paid to the student, boolean.
  housing_min_rate_of_pursuit_pct: Rate of pursuit that must be exceeded for any housing allowance, percent.
  housing_rate_of_pursuit_rounding: How the rate of pursuit is rounded when prorating housing, enum text (nearest_tenth).
  online_only_housing_monthly: Monthly housing allowance for a term of distance learning only, before the benefit level and rate of pursuit, USD.
  foreign_school_housing_monthly: Monthly housing allowance for training at a foreign school, before the benefit level and rate of pursuit, USD.
  housing_month_days_basis: Number of days treated as a full month when prorating housing or monthly payments, days.
  break_pay_allowed: Whether housing or monthly payments continue between terms, boolean.
  books_stipend_per_credit: Books and supplies stipend per credit hour before the benefit level, USD.
  books_stipend_annual_cap: Maximum books and supplies stipend per academic year before the benefit level, USD.
  monthly_full_time_rate: Flat monthly rate paid to the student for full-time training (chapters 30, 35 and 1606), USD.
  monthly_three_quarter_rate: Flat monthly rate for three-quarter-time training, USD.
  monthly_half_time_rate: Flat monthly rate for half-time training, USD.
  monthly_less_than_half_rate: Maximum monthly amount for less than half-time training (never more than tuition and fees), USD.
  entitlement_months: Months of entitlement granted on a full Certificate of Eligibility, months.
  entitlement_charge_basis: How entitlement is charged for training, enum text (rate_of_pursuit for Chapter 33; training_time for the flat-rate chapters).
  combined_entitlement_cap_months: Maximum total months of entitlement usable across two or more education chapters, months.
  delimiting_years: Years after release from active duty (or the eligibility event) after which the benefit can no longer be used, years (0 = no time limit).
  monthly_verification_required: Whether the student must verify enrollment each month before the month's housing or monthly payment is released, boolean.
  verification_missed_months_suspend: Consecutive unverified months after which payments to the student stop until verification, count.
  verification_open_day: Day of the month from which the student may verify the month just completed, day number (last day of the month = 31 cap).
  payment_day_of_month: Day of the following month on which housing and monthly payments for a verified month are issued, day number.
  tuition_paid_per_term: Whether tuition is paid to the school once per certified term rather than monthly, boolean.
  mitigating_excused_credits: Credit hours dropped for the first time that VA excuses as mitigating circumstances without evidence, credit hours (one time only).
  no_mitigating_effective_rule: Effective date of a reduction or withdrawal without mitigating circumstances, enum text (term_start_date).
  mitigating_effective_rule: Effective date of a reduction or withdrawal with mitigating circumstances, enum text (last_date_of_attendance).
  tuition_debt_school_liable_before_start: Whether a tuition and fees overpayment from a change made before the term start is the school's debt, boolean.
  full_time_credit_standard: Credit hours that make full time for an undergraduate standard term, credit hours.
  rural_relocation_benefit: One-time payment to a student relocating from a highly rural county to attend school, USD.
  tutorial_assistance_monthly_max: Maximum tutorial assistance per month, USD.
  tutorial_assistance_lifetime_max: Maximum tutorial assistance over the life of the benefit, USD.
  licensing_test_reimbursement_max: Maximum reimbursement for one licensing or certification test, USD.
  yellow_ribbon_requires_school_agreement: Whether Yellow Ribbon is paid only where the school has an agreement covering the student's program, boolean.
  transfer_to_dependents_allowed: Whether entitlement under this tier can be transferred to dependents by a qualifying service member, boolean.
  relinquishable_for_ch33: Whether this chapter can be irrevocably relinquished to elect the Post-9/11 GI Bill, boolean.
  ch30_buyin_refund_amount: Basic pay reduction refunded with the last housing payment when a Chapter 30 relinquisher exhausts Post-9/11 entitlement, prorated by unused Chapter 30 months, USD (0 where not applicable).
  stem_extension_months: Additional months available under the Edith Nourse Rogers STEM Scholarship, months.
  stem_extension_max_amount: Maximum benefit under the STEM Scholarship, USD.
  concurrent_chapter_payment: Whether two education chapters can be paid for the same period of training, boolean.
  overpayment_debt_type: Debt type under which a student overpayment on this tier is established, enum text naming the official debt type (housing and books for Chapter 33).
  tuition_overpayment_debt_type: Debt type under which a tuition and fees overpayment on this tier is established, enum text naming the official debt type or not_applicable.
  school_closure_restoration: Whether entitlement used for a term interrupted by a school closure or program disapproval is restored, boolean.
  certification_advance_days: Days before a term starts that a school may certify the enrollment, calendar days.
  books_paid_at_term_start: Whether the books stipend for a term is paid as a lump sum at the start of the term, boolean.

