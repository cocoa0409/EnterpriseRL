events:
  - type: ins_policy_issued
    target: ins_policies
    mutation: create
    meaning: A VGLI application is approved and the policy is issued.
    grain: one row per policy
    fields:
      customer_id: Insured.
      variant_name: Coverage tier.
      status: Set to issued.
      policy_number: Policy number.
      separation_date: Date SGLI coverage ended.
      application_received_date: Application date.
      health_questions_required: Whether health questions were required.
      premium_mode: Billing frequency.
      premium_payment_method: Payment method.
      paid_to_date: Empty until the first premium.
      accelerated_benefit_paid: Always false at issue.
      opened_date: Coverage effective date.
    triggers: []

  - type: ins_policy_activated
    target: ins_policies
    mutation: {transition: {from: issued, to: active}}
    meaning: The first premium is received and coverage is in force.
    grain: one row per transaction
    fields:
      status: Set to active.
    triggers: []

  - type: ins_grace_started
    target: ins_policies
    mutation: {transition: {from: active, to: grace}}
    meaning: A premium is unpaid on its due date.
    grain: one row per transaction
    fields:
      status: Set to grace.
    triggers: []

  - type: ins_grace_cured
    target: ins_policies
    mutation: {transition: {from: grace, to: active}}
    meaning: The overdue premium is paid within the grace period.
    grain: one row per transaction
    fields:
      status: Set to active.
    triggers: []

  - type: ins_policy_lapsed
    target: ins_policies
    mutation: {transition: {from: grace, to: lapsed}}
    meaning: Coverage ends for non-payment at the end of the grace period.
    grain: one row per transaction
    fields:
      status: Set to lapsed.
      closed_date: Lapse date (the paid-to date).
    triggers: []

  - type: ins_policy_reinstated
    target: ins_policies
    mutation: {transition: {from: lapsed, to: active}}
    meaning: A lapsed policy is reinstated.
    grain: one row per transaction
    fields:
      status: Set to active.
      closed_date: Reset to empty.
    triggers: []

  - type: ins_policy_cancelled
    target: ins_policies
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The insured cancels coverage.
    grain: one row per transaction
    fields:
      status: Set to cancelled.
      closed_date: Cancellation date.
    triggers: []

  - type: ins_policy_converted
    target: ins_policies
    mutation: {transition: {from: active, to: converted}}
    meaning: The insured converts to an individual commercial policy.
    grain: one row per transaction
    fields:
      status: Set to converted.
      closed_date: Conversion date.
    triggers: []

  - type: ins_policy_matured
    target: ins_policies
    mutation: {transition: [{from: active, to: matured}, {from: grace, to: matured}]}
    meaning: The insured has died and the death benefit is paid.
    grain: one row per transaction
    fields:
      status: Set to matured.
      closed_date: Date of death.
    triggers: []

  - type: ins_billing_updated
    target: ins_policies
    mutation: update
    meaning: The insured changes billing frequency or payment method, or a premium advances the paid-to date.
    grain: one row per transaction
    fields:
      premium_mode: Billing frequency.
      premium_payment_method: Payment method.
      paid_to_date: Last day of paid coverage.
    triggers: []

  - type: ins_premium_paid
    target: ins_premium_ledger
    meaning: A premium covering a period of coverage is received.
    grain: one row per premium per coverage period
    distinguish_by: [coverage_period_start]
    fields:
      ins_policy_id: Policy.
      customer_id: Insured.
      coverage_period_start: First day covered.
      coverage_period_end: Last day covered.
      amount: Premium received.
      transaction_date: Date received.
      age_band: Age band priced.
      payment_method: Method used.
    account: premiums_paid
    direction: in
    triggers:
      - event: ins:ins_billing_updated
        map: {paid_to_date: coverage_period_end}

  - type: ins_premium_refunded
    target: ins_premium_ledger
    meaning: Premium paid for coverage after cancellation, conversion or death is refunded.
    grain: one row per premium refunded
    distinguish_by: [source_txn_id]
    fields:
      ins_policy_id: Policy.
      customer_id: Insured.
      source_txn_id: Premium refunded.
      coverage_period_start: First unearned day.
      coverage_period_end: Last unearned day.
      amount: Amount refunded.
      transaction_date: Refund date.
    account: premiums_paid
    direction: out
    triggers: []

  - type: ins_accelerated_benefit_paid
    target: ins_premium_ledger
    meaning: Part of the coverage is paid early to a terminally ill insured.
    grain: one row per policy
    distinguish_by: [transaction_date]
    fields:
      ins_policy_id: Policy.
      customer_id: Insured.
      amount: Amount paid.
      transaction_date: Payment date.
    triggers: []

  - type: ins_death_benefit_paid
    target: ins_premium_ledger
    meaning: The death benefit is paid to a beneficiary.
    grain: one row per beneficiary paid
    distinguish_by: [beneficiary_name]
    fields:
      ins_policy_id: Policy.
      customer_id: Insured.
      amount: Benefit paid to this beneficiary.
      transaction_date: Payment date.
      beneficiary_name: Beneficiary paid.
      payout_option: Option chosen.
    triggers:
      - event: ins:ins_policy_matured
        map: {}

  - type: ins_beneficiary_designated
    target: ins_premium_ledger
    meaning: The insured files a new beneficiary designation.
    grain: one row per beneficiary per designation date
    distinguish_by: [transaction_date, beneficiary_name]
    fields:
      ins_policy_id: Policy.
      customer_id: Insured.
      amount: Always 0.00.
      transaction_date: Date received.
      beneficiary_name: Beneficiary named.
    triggers: []

measures:
  - id: ins_msr_unpaid_days
    window: From the day after paid_to_date through the current date.
    measure: Calendar days of coverage with no ins_premium_paid entry covering them.

policies:
  - id: ins_agg_multi_holding
    subject: [ins_policy_issued]
    rule: >-
      An insured holds at most one VGLI policy; a different amount of coverage is a change to that policy, never a second
      one. A policy is issued only when the insured holds no VGLI policy whose status is issued, active, grace or lapsed. VALife may be held alongside VGLI.
    eligibility:
      - id: one_vgli
        applies_to: [ins_policy_issued]
        kind: dedup
        condition: A policy is issued only when the insured holds no VGLI policy whose status is issued, active, grace or lapsed.
        evidence_fields: [ins_policies.customer_id, ins_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [ins_policies.customer_id]
          action_bindings:
            ins_policies.customer_id: customer_id
        dedup_contract:
          table: ins_policies
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [issued, active, grace, lapsed]}
          distinct_fields: []
    params:
      max_per_customer: 1
      valife_concurrent_allowed: =valife_concurrent_allowed

  - id: ins_premium_rates
    subject: [ins_premium_paid]
    rule: >-
      The monthly premium is the tier's amount for the insured's age band on each premium due date; when the insured
      enters a new age band, the premium changes on the first due date after the birthday. A quarterly, semiannual or
      annual premium is the monthly premium times 3, 6 or 12 months, with no discount, and a partial month is billed as
      a full month. Premiums may be paid by electronic funds transfer, direct bill, deduction from VA compensation or
      pension, or allotment from military retired pay.
    eligibility: []
    params:
      per_tier:
        "VGLI $50,000 Coverage": {coverage_amount: =coverage_amount, monthly_premium_by_age_band: =monthly_premium_by_age_band}
        "VGLI $100,000 Coverage": {coverage_amount: =coverage_amount, monthly_premium_by_age_band: =monthly_premium_by_age_band}
        "VGLI $200,000 Coverage": {coverage_amount: =coverage_amount, monthly_premium_by_age_band: =monthly_premium_by_age_band}
        "VGLI $300,000 Coverage": {coverage_amount: =coverage_amount, monthly_premium_by_age_band: =monthly_premium_by_age_band}
        "VGLI $400,000 Coverage": {coverage_amount: =coverage_amount, monthly_premium_by_age_band: =monthly_premium_by_age_band}
        "VGLI $500,000 Coverage": {coverage_amount: =coverage_amount, monthly_premium_by_age_band: =monthly_premium_by_age_band}
      age_band_basis: =age_band_basis
      premium_modes: =premium_modes
      premium_due_day: =premium_due_day
      premium_for_partial_month: =premium_for_partial_month
      premium_rounding: =premium_rounding
      premium_increase_on_age_band_change: =premium_increase_on_age_band_change
      va_benefit_deduction_allowed: =va_benefit_deduction_allowed
      allotment_from_military_retired_pay_allowed: =allotment_from_military_retired_pay_allowed

  - id: ins_evt_application_window
    subject: [ins_policy_issued, ins_policy_activated]
    rule: >-
      A VGLI application is accepted without health questions only if it is received not later than no_health_window_days calendar days after the date SGLI coverage ended. Count calendar days starting the day after SGLI coverage ended; an application received on the last day qualifies.
      An application received after that but within health_window_days days must show good health, and a later
      application is not accepted. Initial coverage cannot exceed the SGLI coverage held at separation and is chosen in
      multiples of coverage_increment between min_coverage and max_coverage. Coverage begins when the first premium is
      received with the application.
    eligibility:
      - id: no_health_window
        applies_to: [ins_policy_issued]
        kind: time
        condition: A VGLI application is accepted without health questions only if it is received not later than no_health_window_days calendar days after the date SGLI coverage ended.
        evidence_fields: [ins_policies.separation_date, ins_policies.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [ins_policies.customer_id]
          action_bindings:
            ins_policies.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date SGLI coverage ended
          anchor_source: ins_policies.separation_date
          relation: not_after
          duration_source: variants.no_health_window_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after SGLI coverage ended; an application received on the last day qualifies.
          boundary: inclusive
    params:
      no_health_window_days: =no_health_window_days
      health_window_days: =health_window_days
      coverage_cannot_exceed_sgli: =coverage_cannot_exceed_sgli
      coverage_increment: =coverage_increment
      min_coverage: =min_coverage
      max_coverage: =max_coverage
      application_first_premium_required: =application_first_premium_required
      eligible_discharge_characters: =eligible_discharge_characters

  - id: ins_evt_grace_and_lapse
    subject: [ins_grace_started, ins_grace_cured, ins_policy_lapsed, ins_policy_reinstated]
    rule: >-
      A premium not received by its due date starts a grace period of grace_period_days days (ins_msr_unpaid_days), during
      which coverage stays in force; a lapse warning is sent lapse_warning_after_due_days days after the due date. Paying
      the overdue premium within the grace period keeps the policy active; otherwise coverage lapses at the end of the paid
      period. A lapsed policy can be reinstated within reinstatement_window_years years by paying all premiums from the lapse
      date and, when reinstatement_requires_good_health is true, showing good health.
    eligibility: []
    params:
      grace_period_days: =grace_period_days
      lapse_warning_after_due_days: =lapse_warning_after_due_days
      reinstatement_window_years: =reinstatement_window_years
      reinstatement_requires_good_health: =reinstatement_requires_good_health
      reinstatement_back_premiums_required: =reinstatement_back_premiums_required
    measures: [ins_msr_unpaid_days]

  - id: ins_evt_coverage_changes
    subject: [ins_billing_updated, ins_policy_cancelled, ins_policy_converted, ins_premium_refunded]
    rule: >-
      The insured may change the billing frequency or payment method at any time, effective with the next due date. At
      each increase anniversary (every coverage_increase_interval_years years from the coverage date) up to age
      coverage_increase_max_age, the insured may add coverage_increase_amount without health questions up to max_coverage;
      increases are processed by the insurance service, not on a service call. Cancelling or converting is the insured's own
      decision; premiums paid for coverage after the cancellation or conversion date are refunded when at least
      overpaid_premium_refund_min, without interest. Conversion needs no health evidence. The policy has no cash value,
      no loans and no dividends, and renews for life in terms of term_length_years years.
    eligibility: []
    params:
      coverage_increase_interval_years: =coverage_increase_interval_years
      coverage_increase_max_age: =coverage_increase_max_age
      coverage_increase_amount: =coverage_increase_amount
      cancellation_refund_unearned: =cancellation_refund_unearned
      overpaid_premium_refund_min: =overpaid_premium_refund_min
      interest_on_refunds: =interest_on_refunds
      conversion_allowed: =conversion_allowed
      conversion_requires_health: =conversion_requires_health
      cash_value: =cash_value
      policy_loan_available: =policy_loan_available
      dividends_paid: =dividends_paid
      renewable_for_life: =renewable_for_life
      term_length_years: =term_length_years

  - id: ins_evt_accelerated_benefit
    subject: [ins_accelerated_benefit_paid]
    rule: >-
      An insured with a medically documented life expectancy of accelerated_benefit_life_expectancy_months months or less
      may receive up to accelerated_benefit_max_pct percent of the coverage in advance, once per policy; the rest is paid
      to the beneficiaries at death. An accelerated benefit is paid only on a policy whose status is active.
    eligibility:
      - id: ab_active
        applies_to: [ins_accelerated_benefit_paid]
        kind: state
        condition: An accelerated benefit is paid only on a policy whose status is active.
        evidence_fields: [ins_policies.status, ins_policies.ins_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [ins_policies.ins_policy_id]
          action_bindings:
            ins_policies.ins_policy_id: ins_policy_id
        state_contract:
          field: ins_policies.status
          allowed: [active]
    params:
      per_tier:
        "VGLI $50,000 Coverage": {coverage_amount: =coverage_amount}
        "VGLI $100,000 Coverage": {coverage_amount: =coverage_amount}
        "VGLI $200,000 Coverage": {coverage_amount: =coverage_amount}
        "VGLI $300,000 Coverage": {coverage_amount: =coverage_amount}
        "VGLI $400,000 Coverage": {coverage_amount: =coverage_amount}
        "VGLI $500,000 Coverage": {coverage_amount: =coverage_amount}
      accelerated_benefit_max_pct: =accelerated_benefit_max_pct
      accelerated_benefit_life_expectancy_months: =accelerated_benefit_life_expectancy_months
      accelerated_benefit_once: =accelerated_benefit_once
    formula:
      max_accelerated: "coverage_amount * accelerated_benefit_max_pct / 100"

  - id: ins_evt_beneficiary
    subject: [ins_beneficiary_designated]
    rule: >-
      A beneficiary designation is effective on the date it is received and must be signed by the insured; a phone request
      cannot change a beneficiary. When no valid designation exists at death, the benefit is paid in the order of
      beneficiary_default_order.
    eligibility: []
    params:
      beneficiary_change_effective: =beneficiary_change_effective
      beneficiary_change_requires_insured_signature: =beneficiary_change_requires_insured_signature
      beneficiary_default_order: =beneficiary_default_order

  - id: ins_evt_death_claim
    subject: [ins_death_benefit_paid, ins_policy_matured, ins_premium_refunded]
    rule: >-
      On the insured's death while coverage is in force (including the grace period), the coverage less any accelerated
      benefit already paid, and less an overdue premium when death occurs in the grace period, is paid to the beneficiaries
      as a lump sum or in installment_months monthly installments. Premiums paid for months after the month of death are
      refunded to the estate. A claim should be filed within claim_filing_limit_years years of the death.
    eligibility: []
    params:
      death_claim_payout_options: =death_claim_payout_options
      installment_months: =installment_months
      death_refund_unearned: =death_refund_unearned
      death_benefit_less_overdue_premium: =death_benefit_less_overdue_premium
      claim_filing_limit_years: =claim_filing_limit_years
