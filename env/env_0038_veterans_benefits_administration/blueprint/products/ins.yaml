category: ins
display_name: Veterans' Group Life Insurance (VGLI)

binding:
  holding_table: ins_policies
  event_tables: [ins_premium_ledger]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [issued, active, grace, lapsed, converted, cancelled, matured]
  transitions:
    - {from: issued, to: active, by: system, means: The first premium is received and coverage is in force.}
    - {from: active, to: grace, by: system, means: A premium is unpaid on its due date and the grace period begins.}
    - {from: grace, to: active, by: system, means: The overdue premium is paid within the grace period.}
    - {from: grace, to: lapsed, by: system, means: The grace period ends without payment and coverage ends.}
    - {from: lapsed, to: active, by: agent, means: A lapsed policy is reinstated after back premiums are paid and any required health evidence is accepted.}
    - {from: active, to: cancelled, by: user, means: The insured cancels coverage.}
    - {from: active, to: converted, by: user, means: The insured converts to an individual commercial policy with a participating insurer.}
    - {from: active, to: matured, by: system, means: The insured dies while covered and the death benefit is paid.}
    - {from: grace, to: matured, by: system, means: The insured dies during the grace period and the death benefit is paid less the overdue premium.}

accounts:
  - key: premiums_paid
    unit: USD
    meaning: Premiums the insured has paid on the policy - premium payments credit it, refunds of unearned premium debit it.

parameter_schema:
  coverage_amount: Face amount of coverage for this tier, USD.
  monthly_premium_by_age_band: Monthly premium for this coverage by the insured's age band, mapping of age band to USD.
  age_band_basis: Age used to place the insured in an age band, enum text (age on the premium due date).
  no_health_window_days: Days after SGLI coverage ends within which an application is accepted without health questions, calendar days.
  health_window_days: Days after SGLI coverage ends within which an application is still accepted with proof of good health, calendar days.
  grace_period_days: Days after a premium due date before unpaid coverage lapses, calendar days.
  reinstatement_window_years: Years after a lapse within which the policy can be reinstated, years.
  reinstatement_requires_good_health: Whether reinstatement requires proof of good health, boolean.
  reinstatement_back_premiums_required: Whether all premiums from the lapse date must be paid to reinstate, boolean.
  premium_modes: Billing frequencies offered, list.
  premium_due_day: Day of the month on which a monthly premium is due, day number.
  va_benefit_deduction_allowed: Whether premiums may be deducted from VA compensation or pension, boolean.
  accelerated_benefit_max_pct: Largest share of the coverage payable early to a terminally ill insured, percent.
  accelerated_benefit_life_expectancy_months: Life expectancy at or below which the accelerated benefit is available, months.
  accelerated_benefit_once: Whether the accelerated benefit can be paid only once per policy, boolean.
  conversion_allowed: Whether coverage can be converted to an individual commercial policy, boolean.
  conversion_requires_health: Whether conversion requires proof of good health, boolean.
  cancellation_refund_unearned: Whether premiums paid for coverage after the cancellation date are refunded, boolean.
  death_refund_unearned: Whether premiums paid for months after the month of death are refunded to the estate, boolean.
  death_claim_payout_options: Ways a beneficiary may receive the death benefit, list.
  installment_months: Number of monthly installments under the installment option, months.
  beneficiary_change_effective: When a new beneficiary designation takes effect, enum text.
  beneficiary_change_requires_insured_signature: Whether a beneficiary designation must be signed by the insured, boolean.
  max_coverage: Highest VGLI coverage available, USD.
  min_coverage: Lowest VGLI coverage available, USD.
  coverage_increment: Multiple in which coverage is chosen, USD.
  coverage_increase_amount: Coverage increase available without health questions at each increase anniversary, USD.
  coverage_increase_interval_years: Years between increase anniversaries, years.
  coverage_increase_max_age: Age after which no further increases are available, years.
  coverage_cannot_exceed_sgli: Whether initial VGLI coverage cannot exceed the SGLI coverage held at separation, boolean.
  renewable_for_life: Whether coverage renews for life as long as premiums are paid, boolean.
  term_length_years: Length of each renewable term, years.
  cash_value: Whether the policy builds cash value, boolean.
  policy_loan_available: Whether the insured can borrow against the policy, boolean.
  dividends_paid: Whether the policy pays dividends, boolean.
  premium_for_partial_month: How coverage for part of a month is billed, enum text.
  overpaid_premium_refund_min: Smallest overpaid premium refunded rather than credited forward, USD.
  lapse_warning_after_due_days: Days after an unpaid due date when the lapse warning notice is sent, calendar days.
  eligible_discharge_characters: Characters of discharge with which SGLI-insured members may obtain VGLI, list.
  valife_concurrent_allowed: Whether an insured may hold VALife together with VGLI, boolean.
  premium_rounding: How premiums are rounded, enum text.
  interest_on_refunds: Whether interest is paid on premium refunds, boolean.
  death_benefit_less_overdue_premium: Whether an overdue premium during grace is deducted from the death benefit, boolean.
  beneficiary_default_order: Order of precedence when no valid beneficiary designation exists, ordered list.
  claim_filing_limit_years: Years after the insured's death within which a death claim should be filed before payment to an alternate is considered, years.
  premium_increase_on_age_band_change: Whether the premium changes on the first due date after the insured enters a new age band, boolean.
  allotment_from_military_retired_pay_allowed: Whether premiums may be paid by allotment from military retired pay, boolean.
  application_first_premium_required: Whether the first premium must accompany the application for coverage to start, boolean.

