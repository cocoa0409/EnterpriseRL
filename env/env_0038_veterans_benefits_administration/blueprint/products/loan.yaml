category: loan
display_name: VA Home Loan Guaranty

binding:
  holding_table: loan_guaranties
  event_tables: [loan_transactions, loan_entitlement_actions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {partial_claim_balance: partial_claim_balance}

lifecycle:
  states: [active, in_default, paid_in_full, foreclosed, released_by_assumption]
  transitions:
    - {from: active, to: in_default, by: system, means: The servicer reports the loan in default after the default reporting threshold of missed payments.}
    - {from: in_default, to: active, by: system, means: The default is cured by reinstatement, a repayment plan, a modification or a partial claim.}
    - {from: active, to: paid_in_full, by: system, means: The loan is paid off by sale or refinance.}
    - {from: in_default, to: paid_in_full, by: system, means: A loan in default is paid off in full by a sale or refinance.}
    - {from: in_default, to: foreclosed, by: system, means: The loan is liquidated by foreclosure, compromise sale or deed in lieu.}
    - {from: active, to: released_by_assumption, by: agent, means: A qualified buyer assumes the loan and VA releases the veteran from liability.}

accounts:
  - key: funding_fee_paid
    unit: USD
    meaning: VA funding fee paid on the loan - the charge at closing credits it, refunds debit it.
  - key: entitlement_in_use
    unit: USD
    meaning: Home loan entitlement tied up in the loan - the charge at guaranty credits it, restorations debit it.
  - key: partial_claim_balance
    unit: USD
    meaning: VA partial claim the veteran owes as a subordinate lien - partial claims paid credit it, repayments debit it.

parameter_schema:
  funding_fee_first_use_pct: Funding fee for a first use of the benefit, percent of the loan amount.
  funding_fee_subsequent_use_pct: Funding fee for a subsequent use of the benefit, percent of the loan amount.
  down_payment_band_min_pct: Lowest down payment (inclusive) that places a purchase in this band, percent of the price.
  down_payment_band_max_pct: Down payment (exclusive) at which a purchase moves to the next band, percent of the price.
  max_ltv_pct: Maximum loan amount as a percent of the reasonable value, before the financed funding fee, percent.
  funding_fee_financeable: Whether the funding fee may be added to the loan amount, boolean.
  funding_fee_remit_days: Days after closing within which the lender must remit the funding fee to VA, calendar days.
  funding_fee_late_charge_pct: Late charge on a funding fee remitted after the remittance deadline, percent of the fee.
  guaranty_small_loan_pct: Guaranty on a loan of 45,000 dollars or less, percent of the loan.
  guaranty_45001_56250_flat: Guaranty on a loan above 45,000 and up to 56,250 dollars, USD.
  guaranty_mid_band_pct: Guaranty on a loan above 56,250 and up to 144,000 dollars, percent of the loan.
  guaranty_mid_band_cap: Maximum guaranty on a loan above 56,250 and up to 144,000 dollars, USD.
  guaranty_large_loan_pct: Guaranty on a loan above 144,000 dollars, percent of the loan (subject to remaining entitlement).
  basic_entitlement: Basic entitlement available to every eligible veteran, USD.
  bonus_entitlement_pct_of_county_limit: Total entitlement for loans above 144,000 dollars, percent of the county loan limit.
  county_limit_baseline: Baseline conforming loan limit for one-unit properties in calendar year 2026, USD.
  full_entitlement_no_limit: Whether a veteran with full entitlement has no maximum guaranteed loan amount, boolean.
  funding_fee_exemption_bases: Grounds on which a veteran or surviving spouse is exempt from the funding fee, list.
  refund_on_retroactive_award: Whether a funding fee paid is refunded when compensation is later awarded effective on or before the closing date, boolean.
  refund_method: How a funding fee refund is paid, enum text.
  partial_claim_max_pct_upb: Largest VA partial claim, percent of the unpaid principal balance at the first unpaid installment.
  partial_claim_interest_rate_pct: Annual interest on a VA partial claim, percent.
  partial_claim_due_on_payoff: Whether the partial claim becomes due when the first mortgage is paid off, refinanced or the property is sold, boolean.
  partial_claim_min_delinquent_payments: Missed monthly payments a borrower must have before a partial claim is offered, count.
  default_report_days: Days a payment must be past due before the servicer reports the loan in default, calendar days.
  foreclosure_min_delinquency_days: Days of delinquency before a servicer may make the first foreclosure filing, calendar days.
  relocation_assistance_max: Maximum relocation assistance paid to a borrower completing a compromise sale or deed in lieu, USD.
  assumption_fee_pct: Funding fee charged to the buyer on an assumption, percent of the loan balance.
  assumption_processing_fee_max: Maximum fee a servicer may charge to process an assumption, USD.
  release_requires_buyer_creditworthy: Whether a release of liability requires the buyer to qualify and assume the obligations, boolean.
  substitution_of_entitlement_allowed: Whether an assuming veteran may substitute their entitlement so the seller's is restored, boolean.
  one_time_restoration_allowed: Whether a veteran who paid the loan in full but still owns the property may restore entitlement once, boolean.
  restoration_requires_disposal: Whether ordinary restoration requires the property to have been sold or otherwise disposed of, boolean.
  claim_deficiency_creates_debt: Whether a guaranty claim paid on a liquidated loan creates a Home Loan Guaranty Debt for the veteran, boolean.
  refinance_seasoning_days: Days from the first payment due date of the loan being refinanced that must pass before the new loan closes, calendar days.
  refinance_min_payments: Monthly payments on the loan being refinanced that must have been made before the new loan closes, count.
  irrrl_recoupment_months: Months within which the fees and closing costs of a rate reduction refinance must be recouped from the payment savings, months.
  irrrl_min_rate_reduction_pct: Minimum interest rate reduction for a fixed-to-fixed rate reduction refinance, percentage points.
  irrrl_term_extension_max_years: Years beyond the original loan term by which a rate reduction refinance may extend the term, years.
  occupancy_deadline_days: Days after closing within which the veteran must occupy the home, calendar days.
  occupancy_max_delay_months: Longest delayed occupancy accepted with a documented reason, months.
  origination_fee_max_pct: Maximum flat origination fee a lender may charge, percent of the loan amount.
  seller_concession_max_pct: Maximum seller concessions, percent of the reasonable value.
  max_term_years: Longest loan term available for this program, years.
  energy_efficient_improvements_max: Maximum energy efficient improvements that may be added to the loan without a new appraisal, USD.
  nadl_interest_rate_pct: Interest rate VA charges on a Native American Direct Loan, percent per year (0.00 for lender-made loans).
  trust_land_required: Whether the home must be on federal trust land, boolean.
  appraisal_validity_days: Days a VA appraisal remains valid for a loan to close, calendar days.

