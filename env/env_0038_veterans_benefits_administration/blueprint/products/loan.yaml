  - id: loan_excl_irrrl_source
    subject: [loan_guaranty_issued, loan_paid_off]
    rule: >-
      A rate reduction refinance can only refinance an existing VA-guaranteed loan on the same property and pays that loan
      off, so the two loans are never active together; it reuses the entitlement of the loan it replaces rather than
      charging new entitlement. A cash-out refinance can refinance any loan type but charges entitlement like a purchase.
    eligibility: []
