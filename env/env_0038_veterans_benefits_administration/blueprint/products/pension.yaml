events:
  - type: pension_award_established
    target: pension_awards
    mutation: create
    meaning: VA grants a Veterans Pension claim and authorizes an award at the applicable rate category.
    grain: one row per veteran's pension award
    fields:
      customer_id: The veteran.
      variant_name: Rate category granted.
      effective_date: Effective date of the award.
      qualifying_wartime_period: Wartime period of qualifying service.
      annual_countable_income: Countable income determined on the claim.
      unreimbursed_medical_expenses: Medical expenses accepted on the claim.
      net_worth: Net worth determined on the claim.
      additional_children_count: Additional children recognized.
      medicaid_nursing_home: Whether in a Medicaid-covered nursing home.
      payment_method: Delivery method.
      payment_account_last4: Account last four digits, or empty.
      opened_date: Authorization date.
    triggers: []

  - type: pension_award_activated
    target: pension_awards
    mutation: {transition: {from: authorized, to: running}}
    meaning: The first monthly pension payment is released.
    grain: one row per transaction
    fields:
      status: Set to running.
    triggers: []

  - type: pension_award_suspended
    target: pension_awards
    mutation: {transition: {from: running, to: suspended}}
    meaning: Payments stop while a cause of suspension is unresolved.
    grain: one row per transaction
    fields:
      status: Set to suspended.
      suspension_reason: Cause.
    triggers: []

  - type: pension_award_resumed
    target: pension_awards
    mutation: {transition: {from: suspended, to: running}}
    meaning: The cause of suspension is cured and payments resume.
    grain: one row per transaction
    fields:
      status: Set to running.
      suspension_reason: Reset to none.
    triggers:
      - event: pension:pension_retro_payment
        map: {pension_award_id: pension_award_id, customer_id: customer_id}

  - type: pension_award_terminated
    target: pension_awards
    mutation: {transition: [{from: running, to: terminated}, {from: suspended, to: terminated}]}
    meaning: The pension award ends.
    grain: one row per transaction
    fields:
      status: Set to terminated.
      termination_reason: Why it ended.
      closed_date: Termination date.
    triggers: []

  - type: pension_rate_category_changed
    target: pension_awards
    mutation: update
    meaning: The rate category changes because aid and attendance or housebound status is granted or a dependent is added or removed.
    grain: one row per transaction
    fields:
      variant_name: New rate category.
      effective_date: Effective date of the new category.
      additional_children_count: Updated additional children.
    triggers: []

  - type: pension_financials_updated
    target: pension_awards
    mutation: update
    meaning: The income, medical expense, net worth or nursing-home facts on the award are updated from an accepted report or adjustment.
    grain: one row per transaction
    fields:
      annual_countable_income: Updated countable income.
      unreimbursed_medical_expenses: Updated accepted medical expenses.
      net_worth: Updated net worth.
      medicaid_nursing_home: Updated Medicaid nursing-home flag.
      medicaid_admission_date: Admission date, or empty.
    triggers: []

  - type: pension_payment_profile_updated
    target: pension_awards
    mutation: update
    meaning: The veteran changes how pension is delivered.
    grain: one row per transaction
    fields:
      payment_method: New method.
      payment_account_last4: New account last four digits, or empty.
    triggers: []

  - type: pension_monthly_payment
    target: pension_payments
    meaning: Pension for one entitlement month is issued in arrears.
    grain: one row per award per entitlement month
    distinguish_by: [payment_month]
    fields:
      pension_award_id: Award paid.
      customer_id: Veteran paid.
      payment_month: Month covered.
      payment_date: Issue date.
      gross_amount: Monthly entitlement.
      offset_withheld_amount: Withheld for a debt.
      net_amount: Delivered amount.
      offset_applied: Whether an offset was taken.
    account: pension_paid
    direction: in
    triggers:
      - event: debt:debt_offset_collected
        when: {offset_applied: true}
        map: {customer_id: customer_id, amount: offset_withheld_amount, source_payment_id: pension_payment_id, transaction_date: payment_date, collection_source: pension_offset}

  - type: pension_retro_payment
    target: pension_payments
    meaning: Past-due pension for a span of months is released after a favorable adjustment or the end of a suspension.
    grain: one row per release of past-due pension
    distinguish_by: [adjustment_id, retro_period_start, retro_period_end]
    fields:
      pension_award_id: Award paid.
      customer_id: Veteran paid.
      adjustment_id: Rate adjustment that created it, or empty for a release after suspension.
      retro_period_start: First month covered.
      retro_period_end: Last month covered.
      payment_month: Last month covered.
      payment_date: Issue date.
      gross_amount: Past-due amount.
      offset_withheld_amount: Withheld for a debt.
      net_amount: Delivered amount.
      offset_applied: Whether an offset was taken.
    account: pension_paid
    direction: in
    triggers:
      - event: debt:debt_offset_collected
        when: {offset_applied: true}
        map: {customer_id: customer_id, amount: offset_withheld_amount, source_payment_id: pension_payment_id, transaction_date: payment_date, collection_source: pension_offset}

  - type: pension_payment_returned
    target: pension_payments
    meaning: The Treasury returns an issued pension payment.
    grain: one row per returned payment
    distinguish_by: [source_payment_id]
    fields:
      pension_award_id: Award.
      customer_id: Veteran.
      source_payment_id: Payment returned.
      payment_month: Month of the payment returned.
      payment_date: Date funds came back.
      gross_amount: Gross of the payment returned.
      net_amount: Negative of the net returned.
      return_reason: Why it came back.
    account: pension_paid
    direction: out
    triggers: []

  - type: pension_income_change_reported
    target: pension_income_reports
    meaning: The veteran reports that a source of household income started, stopped or changed.
    grain: one row per income source change reported
    distinguish_by: [income_source, change_effective_date]
    fields:
      pension_award_id: Award.
      customer_id: Veteran.
      income_source: Source that changed.
      annual_amount: New annualized amount from that source (0.00 when it stopped).
      change_effective_date: Date the change began.
      received_date: Date VA received the report.
      report_channel: Channel used.
    triggers: []

  - type: pension_medical_expenses_reported
    target: pension_income_reports
    meaning: The veteran reports unreimbursed medical expenses paid for a period.
    grain: one row per expense period reported
    distinguish_by: [expense_period_start, expense_period_end]
    fields:
      pension_award_id: Award.
      customer_id: Veteran.
      expense_period_start: Period start.
      expense_period_end: Period end.
      medical_expense_amount: Unreimbursed expenses paid.
      received_date: Date received.
      report_channel: Channel used.
    triggers: []

  - type: pension_asset_transfer_reported
    target: pension_income_reports
    meaning: A transfer of assets for less than fair market value is reported or discovered.
    grain: one row per transfer
    distinguish_by: [transfer_date, transfer_amount]
    fields:
      pension_award_id: Award.
      customer_id: Veteran.
      transfer_date: Transfer date.
      transfer_amount: Uncompensated value.
      received_date: Date VA learned of it.
      report_channel: Channel used.
    triggers: []

  - type: pension_income_match_found
    target: pension_income_reports
    meaning: A data match with the Social Security Administration or the IRS shows income the award does not reflect, and VA sends a due-process notice.
    grain: one row per matched source per year
    distinguish_by: [income_source, change_effective_date]
    fields:
      pension_award_id: Award.
      customer_id: Veteran.
      income_source: Matched source.
      annual_amount: Matched annual amount.
      change_effective_date: Date the matched income began.
      received_date: Date of the due-process notice.
      report_channel: Always va_initiated.
    triggers: []

  - type: pension_rate_adjusted
    target: pension_income_reports
    meaning: VA recomputes the annual pension from an accepted report or a matched discrepancy.
    grain: one row per adjustment per source report
    distinguish_by: [source_report_id]
    fields:
      pension_award_id: Award.
      customer_id: Veteran.
      source_report_id: Report or match behind the adjustment.
      change_effective_date: Effective date of the new rate.
      received_date: Date the adjustment was processed.
      adjusted_annual_rate: New annual pension.
      penalty_months: Penalty months for an asset transfer, otherwise 0.
      overpayment_created: Whether months already paid at a higher rate are reached.
      report_channel: Channel of the source report.
    triggers:
      - event: pension:pension_financials_updated
        map: {}
      - event: debt:debt_established
        when: {overpayment_created: true}
        map: {customer_id: customer_id, variant_name: Veterans Pension Overpayment, source_record_id: report_id, source_category: pension}

measures:
  - id: pension_msr_months_overpaid
    window: From the first entitlement month paid at the new rate under one adjustment's effective date through the most recent pension_monthly_payment.
    measure: Count of pension_monthly_payment entries on the award whose payment_month is on or after that first month and whose gross_amount exceeds the adjusted monthly rate.
  - id: pension_msr_returned_payments_window
    window: Rolling returned_payments_window_months calendar months ending on the current date.
    measure: Count of pension_payment_returned entries on the award whose payment_date falls in the window.
  - id: pension_msr_annual_medical_expenses
    window: The twelve-month expense period being evaluated (calendar year for a retroactive report, the next twelve months for a prospective one).
    measure: Sum of medical_expense_amount over pension_medical_expenses_reported entries whose expense period lies inside the window.

policies:
  - id: pension_agg_multi_holding
    subject: [pension_award_established]
    rule: >-
      A veteran holds at most one Veterans Pension award; a change of rate category is an update to that award, never a
      second award. A new award is established only when the veteran holds no pension award whose status is
      authorized, running or suspended. When two veterans are married to each other, each holds their own award.
    eligibility:
      - id: no_open_pension
        applies_to: [pension_award_established]
        kind: dedup
        condition: A new award is established only when the veteran holds no pension award whose status is authorized, running or suspended.
        evidence_fields: [pension_awards.customer_id, pension_awards.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pension_awards.customer_id]
          action_bindings:
            pension_awards.customer_id: customer_id
        dedup_contract:
          table: pension_awards
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [authorized, running, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: pension_rate_computation
    subject: [pension_monthly_payment, pension_rate_adjusted, pension_financials_updated]
    rule: >-
      Pension is income-based: the annual pension equals the maximum annual pension rate of the rate category, plus the
      additional child increment for each additional child, minus countable income after the medical deduction, and is
      never below zero. Countable income is the annualized income of the veteran from every source except the excluded
      sources, plus the spouse's income where the rate category counts spouse income. Unreimbursed medical expenses
      reduce countable income only by the amount that exceeds medical_expense_threshold_pct percent of the category's
      medical_deduction_base_mapr, and the deduction can bring countable income down to zero but never below it. The
      monthly pension is the annual pension divided by 12, rounded down to the whole dollar. A monthly payment is released only while the award status is running.
    eligibility:
      - id: pension_running
        applies_to: [pension_monthly_payment]
        kind: state
        condition: A monthly payment is released only while the award status is running.
        evidence_fields: [pension_awards.status, pension_awards.pension_award_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pension_awards.pension_award_id]
          action_bindings:
            pension_awards.pension_award_id: pension_award_id
        state_contract:
          field: pension_awards.status
          allowed: [running]
    params:
      per_tier:
        Veterans Pension (Basic Rate, No Dependents): {mapr_annual: =mapr_annual, medical_deduction_base_mapr: =medical_deduction_base_mapr, spouse_income_counted: =spouse_income_counted}
        Veterans Pension (Basic Rate, One Dependent): {mapr_annual: =mapr_annual, medical_deduction_base_mapr: =medical_deduction_base_mapr, spouse_income_counted: =spouse_income_counted}
        Veterans Pension (Housebound, No Dependents): {mapr_annual: =mapr_annual, medical_deduction_base_mapr: =medical_deduction_base_mapr, spouse_income_counted: =spouse_income_counted}
        Veterans Pension (Housebound, One Dependent): {mapr_annual: =mapr_annual, medical_deduction_base_mapr: =medical_deduction_base_mapr, spouse_income_counted: =spouse_income_counted}
        Veterans Pension (Aid and Attendance, No Dependents): {mapr_annual: =mapr_annual, medical_deduction_base_mapr: =medical_deduction_base_mapr, spouse_income_counted: =spouse_income_counted}
        Veterans Pension (Aid and Attendance, One Dependent): {mapr_annual: =mapr_annual, medical_deduction_base_mapr: =medical_deduction_base_mapr, spouse_income_counted: =spouse_income_counted}
      additional_child_increment: =additional_child_increment
      medical_expense_threshold_pct: =medical_expense_threshold_pct
      excluded_income_sources: =excluded_income_sources
      monthly_rate_rounding: =monthly_rate_rounding
      final_expenses_deductible: =final_expenses_deductible
    formula:
      deductible_medical: "max(0, unreimbursed_medical_expenses - medical_deduction_base_mapr * medical_expense_threshold_pct / 100)"
      annual_pension: "max(0, mapr_annual + additional_child_increment * additional_children_count - max(0, annual_countable_income - deductible_medical))"
      monthly_pension: "annual_pension / 12"

  - id: pension_payment_schedule
    subject: [pension_award_activated, pension_monthly_payment, pension_payment_profile_updated, pension_payment_returned, pension_award_suspended, pension_award_resumed]
    rule: >-
      Pension is paid monthly in arrears on the payment_day_of_month of the following month, moved to the last preceding
      business day when that day falls on a weekend or federal holiday, and payment of a new award begins with the month
      after the month of the effective date. An account change applies to a payment only when recorded at least
      direct_deposit_change_lead_days calendar days before its issue date, and only the veteran can make it after the
      caller's identity is verified. An award is suspended when returned_payments_suspension_count or more payments come
      back within returned_payments_window_months (pension_msr_returned_payments_window) or the veteran's whereabouts are
      unknown, and it resumes once a current address or account is confirmed, with the withheld months released in one
      retroactive payment. The payment for the month of the veteran's death is released to the surviving spouse; payments
      for later months are reclaimed.
    eligibility: []
    params:
      payment_day_of_month: =payment_day_of_month
      payment_start_lag_months: =payment_start_lag_months
      direct_deposit_change_lead_days: =direct_deposit_change_lead_days
      returned_payments_suspension_count: =returned_payments_suspension_count
      returned_payments_window_months: =returned_payments_window_months
      month_of_death_payable: =month_of_death_payable
    measures: [pension_msr_returned_payments_window]

  - id: pension_evt_income_change
    subject: [pension_income_change_reported, pension_rate_adjusted, pension_retro_payment]
    rule: >-
      Every change in a household income source must be reported, and the veteran may report it by telephone, online or
      by mail. An income decrease raises the rate from the first day of the month after the month the change began, and
      the higher amount for months already paid is released as a retroactive payment. An income increase lowers the rate
      effective the last day of the month in which the change began, and the lower rate is paid from the following month;
      when months at the old higher rate have already been paid, the adjustment records an overpayment equal to the
      difference between the old and new monthly amounts for each such month (pension_msr_months_overpaid) and a Veterans
      Pension Overpayment debt is established. When the new countable income leaves no pension payable, the award is
      terminated for excess income.
    eligibility: []
    params:
      income_change_effective_lag_months: =income_change_effective_lag_months
      income_decrease_effective_rule: =income_decrease_effective_rule
      income_increase_effective_rule: =income_increase_effective_rule
      unreported_income_creates_overpayment: =unreported_income_creates_overpayment
    measures: [pension_msr_months_overpaid]

  - id: pension_evt_medical_expenses
    subject: [pension_medical_expenses_reported, pension_rate_adjusted, pension_retro_payment]
    rule: >-
      Unreimbursed medical expenses (insurance premiums including Medicare Part B, in-home attendant and assisted-living
      care costs, and out-of-pocket treatment) reduce countable income. Recurring expenses are annualized over
      prospective_expense_annualization_months months for the prospective rate. Unreimbursed medical expenses for a past expense period are used for a retroactive adjustment only if they are reported not later than medical_expense_report_window_months calendar months after the last day of the expense period. Add the months to the last day of the expense period; when the resulting month has no such day, use the last day of that month, and a report received on that date is timely.
      The annual total for the evaluated period (pension_msr_annual_medical_expenses) replaces the prior figure, and
      any resulting increase for months already paid is released as a retroactive payment.
    eligibility:
      - id: retro_expense_window
        applies_to: [pension_medical_expenses_reported]
        kind: time
        condition: Unreimbursed medical expenses for a past expense period are used for a retroactive adjustment only if they are reported not later than medical_expense_report_window_months calendar months after the last day of the expense period.
        evidence_fields: [pension_income_reports.expense_period_end, pension_income_reports.report_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [pension_income_reports.report_id]
          action_bindings:
            pension_income_reports.report_id: report_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the last day of the expense period
          anchor_source: pension_income_reports.expense_period_end
          relation: not_after
          duration_source: variants.medical_expense_report_window_months
          unit: calendar_months
          counting_rule: Add the months to the last day of the expense period; when the resulting month has no such day, use the last day of that month, and a report received on that date is timely.
          boundary: inclusive
    params:
      prospective_expense_annualization_months: =prospective_expense_annualization_months
      medical_expense_report_window_months: =medical_expense_report_window_months
    measures: [pension_msr_annual_medical_expenses]

  - id: pension_evt_net_worth_and_transfers
    subject: [pension_asset_transfer_reported, pension_rate_adjusted, pension_award_terminated]
    rule: >-
      No pension is payable while net worth - assets other than the primary residence and a residential lot of up to
      residence_lot_exclusion_acres acres, plus annual countable income - exceeds net_worth_limit; an award whose net worth
      rises above the limit is terminated for excess net worth, and the veteran may reapply once net worth is at or below
      it. A transfer is penalized only when the date of the asset transfer is not more than asset_transfer_lookback_months calendar months before the date VA receives the claim or the report of the transfer. Add the look-back months to the transfer date; when the resulting month has no such day, use the last day of that month, and a report received on that date is still within the look-back period.
      The covered amount is the part of the uncompensated transfer that would have put net worth above the limit; the
      penalty period is the covered amount divided by penalty_rate_monthly, rounded down to whole months, never more than
      penalty_max_months, and it starts the first day of the month after the month of the last transfer. No pension is
      paid during the penalty period. A transfer to a trust for a child who cannot self-support is not penalized.
    eligibility:
      - id: lookback
        applies_to: [pension_asset_transfer_reported]
        kind: time
        condition: A transfer is penalized only when the date of the asset transfer is not more than asset_transfer_lookback_months calendar months before the date VA receives the claim or the report of the transfer.
        evidence_fields: [pension_income_reports.transfer_date, pension_income_reports.report_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [pension_income_reports.report_id]
          action_bindings:
            pension_income_reports.report_id: report_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the asset transfer
          anchor_source: pension_income_reports.transfer_date
          relation: not_after
          duration_source: variants.asset_transfer_lookback_months
          unit: calendar_months
          counting_rule: Add the look-back months to the transfer date; when the resulting month has no such day, use the last day of that month, and a report received on that date is still within the look-back period.
          boundary: inclusive
    params:
      net_worth_limit: =net_worth_limit
      net_worth_includes_annual_income: =net_worth_includes_annual_income
      residence_lot_exclusion_acres: =residence_lot_exclusion_acres
      asset_transfer_lookback_months: =asset_transfer_lookback_months
      penalty_rate_monthly: =penalty_rate_monthly
      penalty_max_months: =penalty_max_months
      penalty_month_rounding: =penalty_month_rounding
      exempt_transfer_child_trust: =exempt_transfer_child_trust
      reapply_after_net_worth_decrease: =reapply_after_net_worth_decrease
    formula:
      covered_amount: "max(0, min(transfer_amount, net_worth + transfer_amount - net_worth_limit))"
      penalty_months: "min(penalty_max_months, covered_amount / penalty_rate_monthly)"

  - id: pension_evt_income_match
    subject: [pension_income_match_found, pension_rate_adjusted, pension_award_suspended]
    rule: >-
      When a Social Security or IRS data match shows income the award does not reflect, VA sends a due-process notice
      proposing to adjust the rate from the date the matched income began. The proposed adjustment from an income match is made only after income_match_response_days calendar days have passed since the date of the income-match notice. Count calendar days starting the day after the notice date; the adjustment may be made on the day after the last day of the period.
      A hearing requested within income_match_hearing_request_days days of the notice delays the adjustment until the
      hearing. Evidence that the matched income is wrong or was already reported is weighed before adjusting; a
      confirmed discrepancy is adjusted like a late-reported income increase and may create an overpayment.
    eligibility:
      - id: due_process_elapsed
        applies_to: [pension_rate_adjusted]
        kind: time
        condition: The proposed adjustment from an income match is made only after income_match_response_days calendar days have passed since the date of the income-match notice.
        evidence_fields: [pension_income_reports.received_date, pension_income_reports.report_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pension_income_reports.report_id]
          action_bindings:
            pension_income_reports.report_id: source_report_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the income-match notice
          anchor_source: pension_income_reports.received_date
          relation: not_before
          duration_source: variants.income_match_response_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after the notice date; the adjustment may be made on the day after the last day of the period.
          boundary: exclusive
    params:
      income_match_response_days: =income_match_response_days
      income_match_hearing_request_days: =income_match_hearing_request_days

  - id: pension_evt_medicaid_nursing_home
    subject: [pension_financials_updated, pension_monthly_payment]
    rule: >-
      A veteran whose rate category has medicaid_cap_applies true and who resides in a Medicaid-approved nursing home with
      Medicaid covering the cost is paid no more than medicaid_nursing_home_cap_monthly per month, starting with the first
      month after medicaid_cap_start_months_after_admission full months following the month of admission; the limit does
      not apply to a veteran with a spouse or child. Leaving the facility or losing Medicaid coverage ends the limit from
      the first day of the following month.
    eligibility: []
    params:
      per_tier:
        Veterans Pension (Basic Rate, No Dependents): {medicaid_cap_applies: =medicaid_cap_applies}
        Veterans Pension (Basic Rate, One Dependent): {medicaid_cap_applies: =medicaid_cap_applies}
        Veterans Pension (Housebound, No Dependents): {medicaid_cap_applies: =medicaid_cap_applies}
        Veterans Pension (Housebound, One Dependent): {medicaid_cap_applies: =medicaid_cap_applies}
        Veterans Pension (Aid and Attendance, No Dependents): {medicaid_cap_applies: =medicaid_cap_applies}
        Veterans Pension (Aid and Attendance, One Dependent): {medicaid_cap_applies: =medicaid_cap_applies}
      medicaid_nursing_home_cap_monthly: =medicaid_nursing_home_cap_monthly
      medicaid_cap_start_months_after_admission: =medicaid_cap_start_months_after_admission

  - id: pension_evt_care_and_dependents
    subject: [pension_rate_category_changed, pension_retro_payment]
    rule: >-
      An aid-and-attendance or housebound rate category is granted only on a physician's examination report where the
      category requires one. Housebound status needs a single permanent disability rated housebound_single_disability_pct
      percent plus a separate disability rated housebound_additional_disability_pct percent or more, or permanent
      confinement to the home; a veteran who meets aid-and-attendance criteria is paid at the aid-and-attendance rate
      instead. Moving between a no-dependent and a one-dependent category requires a dependency claim received online or
      by mail, effective on the marriage or birth date when the claim arrives within dependency_report_window_days of it
      and on the claim date otherwise; a child counts until the child_age_limit_years birthday, or the
      school_child_age_limit_years birthday while in school. A higher category is paid from the month after its effective
      date, with months already paid at the lower rate released as a retroactive payment.
    eligibility: []
    params:
      per_tier:
        Veterans Pension (Basic Rate, No Dependents): {aa_medical_form_required: =aa_medical_form_required}
        Veterans Pension (Basic Rate, One Dependent): {aa_medical_form_required: =aa_medical_form_required}
        Veterans Pension (Housebound, No Dependents): {aa_medical_form_required: =aa_medical_form_required}
        Veterans Pension (Housebound, One Dependent): {aa_medical_form_required: =aa_medical_form_required}
        Veterans Pension (Aid and Attendance, No Dependents): {aa_medical_form_required: =aa_medical_form_required}
        Veterans Pension (Aid and Attendance, One Dependent): {aa_medical_form_required: =aa_medical_form_required}
      housebound_single_disability_pct: =housebound_single_disability_pct
      housebound_additional_disability_pct: =housebound_additional_disability_pct
      aa_includes_housebound: =aa_includes_housebound
      dependent_rate_requires_dependency_claim: =dependent_rate_requires_dependency_claim
      dependency_report_window_days: =dependency_report_window_days
      child_age_limit_years: =child_age_limit_years
      school_child_age_limit_years: =school_child_age_limit_years

  - id: pension_entitlement_basics
    subject: [pension_award_established]
    rule: >-
      Pension is payable only to a veteran discharged under conditions other than dishonorable who served at least
      min_wartime_service_days days of active duty with at least one day during a wartime period (or, for an enlisted
      veteran who entered after September 7, 1980, at least post_1980_min_service_months months or the full period called
      up), and who is age_presumption_total_disability or older, permanently and totally disabled, a nursing-home patient
      or receiving Social Security disability benefits. A claim takes the date of an intent to file received within
      itf_validity_days days before it; a veteran whose disability prevented filing may have the award reach back
      incapacity_retro_days days before the date of claim.
    eligibility: []
    params:
      min_wartime_service_days: =min_wartime_service_days
      post_1980_min_service_months: =post_1980_min_service_months
      age_presumption_total_disability: =age_presumption_total_disability
      itf_validity_days: =itf_validity_days
      incapacity_retro_days: =incapacity_retro_days

  - id: pension_excl_compensation
    subject: [pension_award_established, pension_award_terminated]
    rule: >-
      Veterans Pension and Disability Compensation are never paid to the same veteran for the same month. A veteran
      holding a running compensation award who qualifies for pension, or a pensioner later granted compensation, is
      paid the greater benefit unless they elect otherwise in writing, because election_greater_benefit_default is true;
      when compensation is the greater, the pension award is terminated with reason election_of_compensation effective
      the last day of the month before compensation becomes payable. The election is the veteran's own act and is never
      made for them on a call. Compensation paid to the veteran counts as income for pension.
    eligibility: []
    params:
      election_greater_benefit_default: =election_greater_benefit_default
