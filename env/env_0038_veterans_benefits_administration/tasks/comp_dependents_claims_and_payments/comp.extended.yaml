- id: comp_ext_dependency_past_due
  base_policy_refs:
  - comp_evt_rating_change
  - comp_evt_suspension
  - comp_temporary_total
  - comp_retro_withholding
  - comp_evt_dependency_add
  - comp_monthly_entitlement
  overwrite:
  - base_policy: comp_evt_dependency_add
    superseded_clause: the first entitlement month paid at the higher rate is the month after the effective date
    replaced_by: >-
      The months a dependency release covers, when the claims' effective date lies further back than the number of monthly
      payments the award has issued, are the monthly payments issued less one for each monthly payment that came back if
      any came back, and the monthly payments issued if none came back; when the claims' effective date lies within the
      months the award has paid, they are the whole months elapsed from the claims' effective date to the issue date of
      the most recent monthly payment less one for each monthly payment that came back if any came back, and those whole
      months otherwise.
  - base_policy: comp_monthly_entitlement
    superseded_clause: >-
      A dependent counts for an entitlement month when the month is on or after the payment_adjust_month of its addition
      and before the payment_adjust_month of its removal.
    replaced_by: >-
      The additions owed each month are one spouse addition for each spouse, one child addition for each child and one parent
      addition for each dependent parent, up to the parent maximum, recorded on those claims, at the rates of the award's
      own tier.
  trigger: state_due
  subject:
  - comp_retro_payment
  computes: gross_amount
  target_tool: release_dependency_past_due_602dcd04
  params:
    total_tier_spouse_addition: 220.3
    total_tier_spouse_aid_attendance_addition: 201.41
    total_tier_child_addition: 146.1
    total_tier_school_child_addition: 472.95
    total_tier_parent_addition: 176.88
  rule: >-
    Past-due additions for dependents are released once, as one retroactive payment, for the dependents recorded on the
    award's most recent dependency claim and on any school-attendance claim received the same day, when the award has already
    issued monthly payments without them and no incarceration adjustment applies to the months covered; it applies when
    no debt is in active collection, so nothing is withheld, and past-due amounts created only by adding dependents carry
    no fee withholding. The dependency release is the additions owed each month for the claims' dependents multiplied by
    the months it covers, and the product is rounded half up to the cent. The additions owed each month are one spouse addition
    for each spouse, one child addition for each child and one parent addition for each dependent parent, up to the parent
    maximum, recorded on those claims, at the rates of the award's own tier. The months a dependency release covers are
    the whole months elapsed from the claims' effective date to the issue date of the most recent monthly payment on the
    award. The claims' effective date is the latest date of marriage, birth or adoption recorded on the dependency claim
    when it was received no later than the dependency report window after that date, and the date it was received otherwise.
    The months a dependency release covers, when the claims' effective date lies further back than the number of monthly
    payments the award has issued, are the monthly payments issued less one for each monthly payment that came back if any
    came back, and the monthly payments issued if none came back; when the claims' effective date lies within the months
    the award has paid, they are the whole months elapsed from the claims' effective date to the issue date of the most
    recent monthly payment less one for each monthly payment that came back if any came back, and those whole months otherwise.
    The months of a dependency release priced from the 100 percent tier are every month it covers when individual unemployability
    is granted and the whole months from individual unemployability's effective date to the issue date of the most recent
    monthly payment, less one for each monthly payment that came back, are at least the months covered; that many months
    alone, the others priced from the award's own tier, when individual unemployability is granted and they are fewer; and
    none, every month priced from the award's own tier, when the decision history shows no individual unemployability granted.
    The spouse addition in a dependency release is the spouse addition plus the spouse aid-and-attendance addition when
    the most recent spouse addition on the claims is marked as needing aid and attendance, nothing when the claims record
    no spouse, and one spouse addition for each spouse recorded on them otherwise. The child additions in a dependency release
    are one school-child addition for each school child plus one child addition for each minor child when the claims record
    a school child, nothing when they record no child, and one child addition for each child recorded on them otherwise.
    The parent additions in a dependency release are as many parent additions as the parent maximum when the claims record
    at least that many dependent parents and one parent addition for each dependent parent recorded on them otherwise.
  prerequisite: []
  cross_category: []
  compute:
  - dep_claim_id: >-
      LATEST('comp_claims', 'claim_id', date_field='received_date', event_type='comp_claim_filed', claim_type='dependency')
  - dep_claim_received: >-
      LATEST('comp_claims', 'received_date', date_field='received_date', event_type='comp_claim_filed', claim_type='dependency')
  - dep_school_claim: >-
      LATEST('comp_claims', 'claim_id', date_field='received_date', event_type='comp_claim_filed', claim_type='school_child',
      received_date=dep_claim_received)
  - dep_event_date: >-
      LATEST('comp_dependents', 'qualifying_event_date', date_field='qualifying_event_date', event_type='comp_dependent_added',
      claim_id=dep_claim_id)
  - dep_effective: >-
      dep_event_date if DAYS(dep_event_date, dep_claim_received) <= P('dependency_report_window_days') else dep_claim_received
  - dep_last_issue: LATEST('comp_payments', 'payment_date', date_field='payment_date', event_type='comp_monthly_payment')
  - dep_issued: COUNT('comp_payments', event_type='comp_monthly_payment')
  - dep_returned: COUNT('comp_payments', event_type='comp_payment_returned')
  - dep_calendar: MONTHS(dep_effective, dep_last_issue)
  - dep_months: >-
      (dep_issued - dep_returned) if (dep_calendar > dep_issued and dep_returned >= 1) else (dep_issued if (dep_calendar
      > dep_issued and dep_returned == 0) else ((dep_calendar - dep_returned) if (dep_calendar <= dep_issued and dep_returned
      >= 1) else dep_calendar))
  - dep_iu_grants: COUNT('comp_decisions', decision_outcome='tdiu_granted')
  - dep_iu_span: >-
      MX(0, MONTHS(LATEST('comp_decisions', 'rating_effective_date', date_field='decision_date', decision_outcome='tdiu_granted'),
      dep_last_issue) - dep_returned) if dep_iu_grants >= 1 else 0
  - dep_iu_months: >-
      dep_months if (dep_iu_grants >= 1 and dep_iu_span >= dep_months) else (dep_iu_span if (dep_iu_grants >= 1 and dep_iu_span
      < dep_months) else 0)
  - dep_spouses: COUNT('comp_dependents', event_type='comp_dependent_added', relationship='spouse', claim_id=dep_claim_id)
  - dep_spouse_aa: >-
      LATEST('comp_dependents', 'spouse_aid_attendance', date_field='effective_date', event_type='comp_dependent_added',
      relationship='spouse', claim_id=dep_claim_id) == True
  - dep_spouse_own: >-
      ((P('spouse_addition')) + (P('spouse_aid_attendance_addition'))) * dep_spouses if (dep_spouses >= 1 and dep_spouse_aa)
      else (0 if dep_spouses == 0 else (P('spouse_addition')) * dep_spouses)
  - dep_spouse_full: >-
      ((K('total_tier_spouse_addition')) + (K('total_tier_spouse_aid_attendance_addition'))) * dep_spouses if (dep_spouses
      >= 1 and dep_spouse_aa) else (0 if dep_spouses == 0 else (K('total_tier_spouse_addition')) * dep_spouses)
  - dep_minors: COUNT('comp_dependents', event_type='comp_dependent_added', relationship='child', claim_id=dep_claim_id)
  - dep_schools: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='school_child', claim_id=dep_claim_id) +
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='school_child', claim_id=dep_school_claim)
  - dep_child_own: >-
      (dep_minors * (P('child_under_18_addition')) + dep_schools * (P('school_child_addition'))) if dep_schools >= 1 else
      (0 if dep_minors == 0 else dep_minors * (P('child_under_18_addition')))
  - dep_child_full: >-
      (dep_minors * (K('total_tier_child_addition')) + dep_schools * (K('total_tier_school_child_addition'))) if dep_schools
      >= 1 else (0 if dep_minors == 0 else dep_minors * (K('total_tier_child_addition')))
  - dep_parents: COUNT('comp_dependents', event_type='comp_dependent_added', relationship='parent', claim_id=dep_claim_id)
  - dep_parent_own: >-
      P('dependent_parent_max_count') * (P('dependent_parent_addition')) if dep_parents >= P('dependent_parent_max_count')
      else dep_parents * (P('dependent_parent_addition'))
  - dep_parent_full: >-
      P('dependent_parent_max_count') * (K('total_tier_parent_addition')) if dep_parents >= P('dependent_parent_max_count')
      else dep_parents * (K('total_tier_parent_addition'))
  - dep_owed: >-
      (dep_spouse_own + dep_child_own + dep_parent_own) * (dep_months - dep_iu_months) + (dep_spouse_full + dep_child_full
      + dep_parent_full) * dep_iu_months
  - result: RND(MX(0, dep_owed), 2)
  compute_basis:
