    total_tier_parent_addition: 176.88
  rule: >-
    When compensation becomes payable for months before an award began running, the past-due for those months is released
    once as one retroactive payment that cites the decision granting the compensation, together with whatever the award's
    later months still lack; it applies when no direct-pay fee agreement is on file, no debt is in active collection and
    no incarceration adjustment applies to the months it covers, so nothing is withheld from it. The opening past-due release
    is fixed only after every monthly payment on the award that came back has a replacement standing in the award's payment
    history. Before the opening past-due release is fixed, the past-due additions owed for dependents recorded on the award's
    most recent dependency claim must have been released. The opening past-due release is not worked out until the award's
    payment history carries a past-due release citing the most recent favorable rating decision made after the award's first
    monthly payment. The opening past-due release is the compensation owed for the months owed, less what stands paid against
    it, and never less than nothing; it is rounded half up to the cent once, at the end. The months owed are the whole months
    elapsed from the award's effective date to the issue date of the most recent monthly payment on the award, and the compensation
    owed is the veteran-alone rate of the award's combined rating for each month owed. What stands paid against the opening
    past-due release is the gross of every monthly payment issued, less the gross of every payment that came back, plus
    the gross of every replacement and of every past-due release already on the award. The months owed at the individual
    unemployability rate in the opening past-due release are every month owed when individual unemployability is granted
    with an effective date no later than the award's own, the whole months from its effective date to the issue date of
    the most recent monthly payment when it is granted with a later effective date, and none when the decision history shows
    no individual unemployability granted; those months take the individual unemployability rate in place of the veteran-alone
    rate and their additions from the 100 percent tier, and every other month owed takes its additions from the award's
    own tier. The SMC (k) additions in the opening past-due release are one SMC (k) addition for each SMC (k) grant, up
    to the SMC (k) maximum, for every month owed when the latest grant's effective date is no later than the award's own,
    for each of the whole months from that grant's effective date to the issue date of the most recent monthly payment when
    it is later, and nothing when the decision history shows no SMC (k) grant. The pension taken off the opening past-due
    release is the monthly pension last paid times the months both benefits cover when Veterans Pension was paid for months
    the release covers and no Veterans Pension Overpayment debt has been established from the pension award; that amount
    less what such a debt has already collected when one has been established; and nothing when no Veterans Pension was
    paid for months the release covers, because compensation and pension are never paid to the same veteran for the same
    month. The months both benefits cover are the whole months elapsed from the compensation award's effective date to the
    issue date of the last pension payment, and none when no pension payment was issued after it. The spouse addition in
    the opening past-due release is the spouse addition plus the spouse aid-and-attendance addition when a spouse is recorded
    on the award and the most recent spouse addition is marked as needing aid and attendance, the spouse addition alone
    when a spouse is recorded and the most recent spouse addition is not so marked, and nothing when no spouse is recorded.
    The child additions in the opening past-due release are one child addition for each recorded minor child plus one school-child
    addition for each recorded school child when the award records both, one child addition for each recorded minor child
    when it records minor children and no school child, one school-child addition for each recorded school child when it
    records school children and no minor child, and nothing when it records no child. The parent additions in the opening
    past-due release are as many parent additions as the parent maximum when the award records at least that many dependent
    parents, one parent addition when it records exactly one dependent parent, and nothing when it records none. The dependents
    of a relationship that count in the opening past-due release are that relationship's additions on the award less its
    removals, each counted for the whole months elapsed from the most recent such addition's effective date to the issue
    date of the most recent monthly payment, those of them that fall in the months owed at the individual unemployability
    rate taking the 100 percent tier.
  prerequisite:
  - problem: comp_ext_returned_payment_replacement
    kind: value_input
    gate: sw_paid
    form: state
    policy_source: >-
      The opening past-due release is fixed only after every monthly payment on the award that came back has a replacement
      standing in the award's payment history.
    condition: >-
      For every returned-payment entry on the award, the award's payment history carries a replacement entry that points
      to the same original monthly payment.
    resolved_by: request_payment_replacement_543b1fec
    effect: >-
      The replacement's gross enters what stands paid against this release, so the returned month no longer counts as unpaid
      and the release falls by the replacement amount.
  - problem: comp_ext_dependency_past_due
    kind: value_input
    gate: sw_paid
    form: action
    policy_source: >-
      Before the opening past-due release is fixed, the past-due additions owed for dependents recorded on the award's most
      recent dependency claim must have been released.
    fallback_reason: >-
      The release of past-due dependent additions books a retroactive entry that cites no decision and names no dependent
      or claim, the same shape as a release made when a suspension ends, so no state the records show singles out that those
      additions were released; the sentence therefore names the release itself.
    condition: >-
      The award's payment history carries one retroactive release, citing no decision, that pays the additions of the dependents
      recorded on the most recent dependency claim for every month whose standing monthly payment was issued without them.
    resolved_by: release_dependency_past_due_602dcd04
    effect: >-
      The dependency release's gross enters what stands paid against this release, so it falls by the additions that release
      already paid.
  - problem: comp_ext_decision_past_due
    kind: value_input
    gate: sw_paid
    form: state
    policy_source: >-
      The opening past-due release is not worked out until the award's payment history carries a past-due release citing
      the most recent favorable rating decision made after the award's first monthly payment.
    condition: >-
      The award's payment history carries a retroactive entry whose decision link is the most recent favorable rating decision
      made after the award's first monthly payment.
    resolved_by: release_decision_past_due_fbf191c5
    effect: >-
      The decision past-due's gross enters what stands paid against this release, so it falls by the amount the decision
      past-due already paid for the months issued.
  cross_category:
  - category: pension
    as: history
    reads:
    - pension_award_id
    - pension_payments.gross_amount
    - pension_payments.payment_date
    note: >-
      The pension offset factor reads the veteran's pension award and its payment ledger (last monthly amount and last issue
      date) to decide how much pension is taken off.
  - category: debt
    as: branch
    reads:
    - original_amount
    - current_balance
    note: >-
      The pension offset factor checks whether a Veterans Pension Overpayment debt was established from the pension award
      and how much it has collected.
  compute:
  - sw_last_issue: LATEST('comp_payments', 'payment_date', date_field='payment_date', event_type='comp_monthly_payment')
  - sw_months: MONTHS(F('effective_date'), sw_last_issue)
  - sw_iu_grants: COUNT('comp_decisions', decision_outcome='tdiu_granted')
  - sw_iu_eff: LATEST('comp_decisions', 'rating_effective_date', date_field='decision_date', decision_outcome='tdiu_granted')
  - sw_iu_span: MX(0, MONTHS(sw_iu_eff, sw_last_issue)) if sw_iu_grants >= 1 else 0
  - sw_iu_months: >-
      sw_months if (sw_iu_grants >= 1 and sw_iu_eff <= F('effective_date')) else (sw_iu_span if (sw_iu_grants >= 1 and sw_iu_eff
      > F('effective_date')) else 0)
  - sw_smc_grants: COUNT('comp_decisions', decision_outcome='smc_k_granted')
  - sw_smc_eff: >-
      LATEST('comp_decisions', 'rating_effective_date', date_field='decision_date', decision_outcome='smc_k_granted')
  - sw_smc_span: MX(0, MONTHS(sw_smc_eff, sw_last_issue)) if sw_smc_grants >= 1 else 0
  - sw_smc_months: >-
      sw_months if (sw_smc_grants >= 1 and sw_smc_eff <= F('effective_date')) else (sw_smc_span if (sw_smc_grants >= 1 and
      sw_smc_eff > F('effective_date')) else 0)
  - sw_spouses: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='spouse') - COUNT('comp_dependents', event_type='comp_dependent_removed',
      relationship='spouse')
  - sw_spouse_aa: >-
      LATEST('comp_dependents', 'spouse_aid_attendance', date_field='effective_date', event_type='comp_dependent_added',
      relationship='spouse') == True
  - sw_spouse_m: >-
      MONTHS(LATEST('comp_dependents', 'effective_date', date_field='effective_date', event_type='comp_dependent_added',
      relationship='spouse'), sw_last_issue) if sw_spouses >= 1 else 0
  - sw_spouse_part: >-
      ((P('spouse_addition') + P('spouse_aid_attendance_addition')) * (sw_spouse_m - MN(sw_spouse_m, sw_iu_months)) + (K('total_tier_spouse_addition')
      + K('total_tier_spouse_aid_attendance_addition')) * MN(sw_spouse_m, sw_iu_months)) if (sw_spouses >= 1 and sw_spouse_aa)
      else ((P('spouse_addition')) * (sw_spouse_m - MN(sw_spouse_m, sw_iu_months)) + (K('total_tier_spouse_addition')) *
      MN(sw_spouse_m, sw_iu_months) if (sw_spouses >= 1 and not sw_spouse_aa) else 0)
  - sw_minors: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='child') - COUNT('comp_dependents', event_type='comp_dependent_removed',
      relationship='child')
  - sw_schools: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='school_child') - COUNT('comp_dependents',
      event_type='comp_dependent_removed', relationship='school_child')
  - sw_minor_m: >-
      MONTHS(LATEST('comp_dependents', 'effective_date', date_field='effective_date', event_type='comp_dependent_added',
      relationship='child'), sw_last_issue) if sw_minors >= 1 else 0
  - sw_school_m: >-
      MONTHS(LATEST('comp_dependents', 'effective_date', date_field='effective_date', event_type='comp_dependent_added',
      relationship='school_child'), sw_last_issue) if sw_schools >= 1 else 0
  - sw_minor_amt: >-
      sw_minors * (P('child_under_18_addition') * (sw_minor_m - MN(sw_minor_m, sw_iu_months)) + K('total_tier_child_addition')
      * MN(sw_minor_m, sw_iu_months))
  - sw_school_amt: >-
      sw_schools * (P('school_child_addition') * (sw_school_m - MN(sw_school_m, sw_iu_months)) + K('total_tier_school_child_addition')
      * MN(sw_school_m, sw_iu_months))
  - sw_child_part: >-
      (sw_minor_amt + sw_school_amt) if (sw_minors >= 1 and sw_schools >= 1) else (sw_minor_amt if (sw_minors >= 1 and sw_schools
      == 0) else (sw_school_amt if (sw_schools >= 1 and sw_minors == 0) else 0))
  - sw_parents: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='parent') - COUNT('comp_dependents', event_type='comp_dependent_removed',
      relationship='parent')
  - sw_parent_m: >-
      MONTHS(LATEST('comp_dependents', 'effective_date', date_field='effective_date', event_type='comp_dependent_added',
      relationship='parent'), sw_last_issue) if sw_parents >= 1 else 0
  - sw_parent_unit: >-
      P('dependent_parent_addition') * (sw_parent_m - MN(sw_parent_m, sw_iu_months)) + K('total_tier_parent_addition') *
      MN(sw_parent_m, sw_iu_months)
  - sw_parent_part: >-
      P('dependent_parent_max_count') * sw_parent_unit if sw_parents >= P('dependent_parent_max_count') else (sw_parent_unit
      if sw_parents == 1 else 0)
  - sw_owed: >-
      P('monthly_rate_veteran_alone') * sw_months + (P('tdiu_monthly_rate') - P('monthly_rate_veteran_alone')) * sw_iu_months
      + P('smc_k_monthly_addition') * MN(sw_smc_grants, P('smc_k_max_awards')) * sw_smc_months + sw_spouse_part + sw_child_part
      + sw_parent_part
  - sw_paid: >-
      SUM('comp_payments', 'gross_amount', event_type='comp_monthly_payment') - SUM('comp_payments', 'gross_amount', event_type='comp_payment_returned')
      + SUM('comp_payments', 'gross_amount', event_type='comp_payment_reissued') + SUM('comp_payments', 'gross_amount',
      event_type='comp_retro_payment')
  - sw_pension_id: CFIELD('pension', 'pension_award_id')
  - sw_pension_monthly: >-
      XLATEST('pension', 'pension_payments', 'gross_amount', date_field='payment_date', event_type='pension_monthly_payment')
  - sw_pension_last: >-
      XLATEST('pension', 'pension_payments', 'payment_date', date_field='payment_date', event_type='pension_monthly_payment')
  - sw_overlap: MX(0, MONTHS(F('effective_date'), sw_pension_last)) if sw_pension_last else 0
  - sw_pension_debt: EXISTS('debt', variant_name='Veterans Pension Overpayment', source_record_id=sw_pension_id)
  - sw_debt_collected: >-
      (CFIELD('debt', 'original_amount', variant_name='Veterans Pension Overpayment', source_record_id=sw_pension_id) -
      CFIELD('debt', 'current_balance', variant_name='Veterans Pension Overpayment', source_record_id=sw_pension_id)) if
      sw_pension_debt else 0
  - sw_pension_off: >-
      sw_pension_monthly * sw_overlap if (sw_overlap >= 1 and not sw_pension_debt) else (MX(0, sw_pension_monthly * sw_overlap
      - sw_debt_collected) if (sw_overlap >= 1 and sw_pension_debt) else 0)
  - result: RND(MX(0, sw_owed - sw_paid - sw_pension_off), 2)
