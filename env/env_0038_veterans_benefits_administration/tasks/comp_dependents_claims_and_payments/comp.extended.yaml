    dep_iu_grants: when the decision history shows no individual unemployability granted
    dep_iu_span: >-
      the whole months from individual unemployability's effective date to the issue date of the most recent monthly payment,
      less one for each monthly payment that came back
    dep_iu_months: >-
      The months of a dependency release priced from the 100 percent tier are every month it covers when individual unemployability
