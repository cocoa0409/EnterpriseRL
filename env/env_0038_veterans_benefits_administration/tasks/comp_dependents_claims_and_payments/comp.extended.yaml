      and was replaced. What stands paid toward a decision past-due is the gross of every monthly payment issued, less the
      gross of every payment that came back, plus the gross of every replacement and of every past-due release already on
      the award. The monthly entitlement for a decision past-due is the veteran-alone rate of the award's combined rating
      for each standing month.
    params:
