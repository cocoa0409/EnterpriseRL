    rr_prior_received: from the date the earlier review was received
    rr_prior_decided: within the continuous-pursuit window after that earlier review's decision
    rr_prior_window: the earlier review was itself received after its lane's filing window following the reduction notice
    rr_pursuit_window: within the continuous-pursuit window after that earlier review's decision
    rr_review_late: when that review was received after its lane's filing window following the reduction notice
