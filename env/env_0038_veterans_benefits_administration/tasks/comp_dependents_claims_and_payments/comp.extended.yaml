    - when: an SMC (k) grant is recorded with a later effective date
      method: >-
        add the SMC (k) additions for the restoration months less the whole months from the start date to that grant's effective
        date
    - when: otherwise (no SMC (k) grant)
      method: add no SMC (k) addition
    baseline:
      rr_smc_months: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: restoration_spouse
    effect: parameter
    decides: rr_spouse_own
    bindings:
    - rr_spouses
    - rr_spouse_aa
    - rr_spouse_own
    - rr_spouse_full
    ladder:
    - when: a spouse is recorded on the award and the most recent spouse addition is marked as needing aid and attendance
      value: the spouse addition plus the spouse aid-and-attendance addition
    - when: a spouse is recorded on the award and the most recent spouse addition is not so marked
      value: the spouse addition
    - when: otherwise (no spouse recorded)
      value: nothing
    baseline:
      rr_spouse_own: '0'
      rr_spouse_full: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: restoration_children
    effect: parameter
    decides: rr_child_own
    bindings:
    - rr_minors
    - rr_schools
    - rr_child_own
    - rr_child_full
    ladder:
    - when: the award records minor children and school children
      value: one child addition per minor child plus one school-child addition per school child
    - when: the award records minor children and no school child
      value: one child addition per minor child
    - when: the award records school children and no minor child
      value: one school-child addition per school child
    - when: otherwise (no child recorded)
      value: nothing
    baseline:
      rr_child_own: '0'
      rr_child_full: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: restoration_parents
    effect: parameter
    decides: rr_parent_own
    bindings:
    - rr_parents
    - rr_parent_own
    - rr_parent_full
    ladder:
    - when: the award records at least as many dependent parents as the parent maximum
      value: as many parent additions as the parent maximum
    - when: the award records exactly one dependent parent
      value: one parent addition
    - when: otherwise (no dependent parent recorded)
      value: nothing
    baseline:
      rr_parent_own: '0'
      rr_parent_full: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The restoration is the entitlement the award now carries for the restoration months, less what stands paid for those
      months, and never less than nothing; it is rounded half up to the cent once, at the end. The restoration months are
      the whole months elapsed from the restoration's start date to today, less one for the current month. The restoration's
      start date is the date the reduced rate took effect. What stands paid for the restoration months is the gross of every
      monthly payment, replacement and past-due release issued on the award within that many whole months before today,
      less the gross of every payment that came back within the same months. The entitlement for each restoration month
      is the veteran-alone rate of the award's combined rating.
    params:
    - monthly_rate_veteran_alone
  inputs:
    history:
    - table: comp_decisions
      aggregate: latest
      field: decision_id
      filters:
        decision_outcome: reduction_implemented
    - table: comp_payments
      aggregate: sum
      field: gross_amount
      filters: {}
    - table: comp_dependents
      aggregate: count
      field: dependent_event_id
      filters: {}
    cross_category:
    - appeal
