  factors:
  - id: opening_release_unemployability_months
    effect: method
    decides: sw_iu_months
    bindings:
    - sw_iu_grants
    - sw_iu_eff
    - sw_iu_months
    ladder:
    - when: individual unemployability is granted with an effective date no later than the award's own
      method: pay every month owed at the individual unemployability rate with 100 percent tier additions
    - when: individual unemployability is granted with a later effective date
      method: >-
        pay the whole months from its effective date to the latest monthly issue at that rate and the earlier months at
        the veteran-alone rate
    - when: otherwise (no individual unemployability granted)
      method: pay every month owed at the veteran-alone rate with own-tier additions
    baseline:
      sw_iu_months: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: opening_release_smc_k_months
    effect: method
    decides: sw_smc_months
    bindings:
    - sw_smc_grants
    - sw_smc_eff
    - sw_smc_months
    ladder:
    - when: an SMC (k) grant is recorded with an effective date no later than the award's own
      method: add the SMC (k) additions for every month owed
    - when: an SMC (k) grant is recorded with a later effective date
      method: add the SMC (k) additions for the whole months from that grant's effective date only
    - when: otherwise (no SMC (k) grant)
      method: add no SMC (k) addition
    baseline:
      sw_smc_months: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: opening_release_pension_offset
    effect: method
    decides: sw_pension_off
    bindings:
    - sw_pension_id
    - sw_pension_monthly
    - sw_pension_last
    - sw_pension_debt
    - sw_pension_off
    ladder:
    - when: >-
        Veterans Pension was paid for months the release covers and no Veterans Pension Overpayment debt was established
        from the pension award
      method: take off the monthly pension last paid times the months both benefits cover
    - when: >-
        Veterans Pension was paid for months the release covers and a Veterans Pension Overpayment debt was established
        from the pension award
      method: take off that amount less what the debt has already collected
    - when: otherwise (no pension paid for months the release covers)
      method: take nothing off
    baseline:
      sw_pension_off: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: pension
  - id: opening_release_spouse
    effect: parameter
    decides: sw_spouse_part
    bindings:
    - sw_spouses
    - sw_spouse_aa
    - sw_spouse_part
    ladder:
    - when: a spouse is recorded on the award and the most recent spouse addition is marked as needing aid and attendance
      value: >-
        the spouse addition plus the spouse aid-and-attendance addition for each month from the spouse's effective date
    - when: a spouse is recorded on the award and the most recent spouse addition is not so marked
      value: the spouse addition for each month from the spouse's effective date
    - when: otherwise (no spouse recorded)
      value: nothing
    baseline:
      sw_spouse_part: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: opening_release_children
    effect: parameter
    decides: sw_child_part
    bindings:
    - sw_minors
    - sw_schools
    - sw_child_part
    ladder:
    - when: the award records minor children and school children
      value: one child addition per minor child plus one school-child addition per school child, each for its months
    - when: the award records minor children and no school child
      value: one child addition per minor child, each for its months
    - when: the award records school children and no minor child
      value: one school-child addition per school child, each for its months
    - when: otherwise (no child recorded)
      value: nothing
    baseline:
      sw_child_part: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: opening_release_parents
    effect: parameter
    decides: sw_parent_part
    bindings:
    - sw_parents
    - sw_parent_part
    ladder:
    - when: the award records at least as many dependent parents as the parent maximum
      value: as many parent additions as the parent maximum for each month from the latest parent's effective date
    - when: the award records exactly one dependent parent
      value: one parent addition for each month from the latest parent's effective date
    - when: otherwise (no dependent parent recorded)
      value: nothing
    baseline:
      sw_parent_part: '0'
    evidence:
    - history
    - date
