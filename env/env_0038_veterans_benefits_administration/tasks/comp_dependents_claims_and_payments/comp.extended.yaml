    - date
    cross_difficulty: null
  - id: temporary_total_spouse
    effect: parameter
    decides: tt_spouse_part
    bindings:
    - tt_spouses
    - tt_spouse_aa
    - tt_spouse_part
    ladder:
    - when: a spouse is recorded on the award and the most recent spouse addition is marked as needing aid and attendance
      value: the spouse addition plus the spouse aid-and-attendance addition
    - when: a spouse is recorded on the award and the most recent spouse addition is not so marked
      value: the spouse addition
    - when: otherwise (no spouse recorded)
      value: nothing
    baseline:
      tt_spouse_part: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: temporary_total_children
    effect: parameter
    decides: tt_child_part
    bindings:
    - tt_minors
    - tt_schools
    - tt_child_part
    ladder:
    - when: the award records minor children and school children
      value: one child addition per minor child plus one school-child addition per school child
    - when: the award records minor children and no school child
      value: one child addition per minor child
    - when: the award records school children and no minor child
      value: one school-child addition per school child
    - when: otherwise (no child recorded)
      value: nothing
    baseline:
      tt_child_part: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: temporary_total_parents
    effect: parameter
    decides: tt_parent_part
    bindings:
    - tt_parents
    - tt_parent_part
    ladder:
    - when: the award records at least as many dependent parents as the parent maximum
      value: as many parent additions as the parent maximum
    - when: the award records exactly one dependent parent
      value: one parent addition
    - when: otherwise (no dependent parent recorded)
      value: nothing
    baseline:
      tt_parent_part: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The temporary total past-due is the temporary total entitlement for the temporary total months, less what the award
      paid for those months, and never less than nothing; it is rounded half up to the cent once, at the end. The temporary
      total months are the whole months elapsed from the temporary total rating's effective date to the effective date of
      the decision on the same claim recording that the prior rating resumed, and none while no such decision is recorded.
      What the award paid for the temporary total months is the gross of the monthly payments issued no fewer whole months
      before today than that resumption's effective date lies, and fewer whole months before today than the temporary total
      rating's effective date lies. The temporary total entitlement for each temporary total month is the temporary total
      rate.
    params:
    - temporary_total_monthly_rate
  inputs:
    history:
    - table: comp_decisions
      aggregate: latest
      field: rating_effective_date
      filters:
        decision_outcome: temporary_total_granted
    - table: comp_payments
      aggregate: sum
      field: gross_amount
      filters:
        event_type: comp_monthly_payment
    - table: comp_dependents
      aggregate: count
      field: dependent_event_id
      filters: {}
    cross_category: []
- id: comp_ext_review_restoration
  base_policy_refs:
  - comp_evt_rating_change
  - comp_evt_suspension
  - comp_temporary_total
  - comp_retro_withholding
  - comp_evt_reduction_due_process
  - comp_monthly_entitlement
  overwrite:
  - base_policy: comp_evt_rating_change
    superseded_clause: >-
      Past-due benefits for a favorable decision cover every entitlement month from the first month payable under the payment
      schedule through the last month already paid at the old rate, and equal, for each such month, the new gross monthly
      entitlement minus the gross amount already paid for that month.
    replaced_by: >-
      The restoration is the entitlement the award now carries for the restoration months, less what stands paid for those
      months, and never less than nothing; it is rounded half up to the cent once, at the end.
  - base_policy: comp_monthly_entitlement
    superseded_clause: >-
      A dependent counts for an entitlement month when the month is on or after the payment_adjust_month of its addition
      and before the payment_adjust_month of its removal.
    replaced_by: >-
      The dependents of a relationship that count in a restoration are that relationship's additions on the award less its
      removals, every month a restoration covers counting the dependents so recorded.
  trigger: state_due
  subject:
  - comp_retro_payment
  computes: gross_amount
  target_tool: release_review_restoration_92058ca9
  params:
    total_tier_spouse_addition: 220.3
    total_tier_spouse_aid_attendance_addition: 201.41
    total_tier_child_addition: 146.1
    total_tier_school_child_addition: 472.95
    total_tier_parent_addition: 176.88
  rule: >-
    When a decision review overturns a reduction of the veteran's rating and the award again carries the rating as it stood
    before the reduction, the compensation the reduction withheld is restored once as one retroactive payment that cites
    the overturned reduction decision; nothing is withheld from it when no fee agreement is on file and no debt is in active
    collection, and no incarceration adjustment applies to the restoration months. A restoration after a reduction overturned
    on review is not worked out until the award's status is running again. A restoration after a reduction overturned on
    review is fixed only after the award's payment history carries a past-due release citing every temporary total rating
    decision on the award. The restoration is the entitlement the award now carries for the restoration months, less what
    stands paid for those months, and never less than nothing; it is rounded half up to the cent once, at the end. The restoration
    months are the whole months elapsed from the restoration's start date to today, less one for the current month. The
    restoration's start date is the date the reduced rate took effect. What stands paid for the restoration months is the
    gross of every monthly payment, replacement and past-due release issued on the award within that many whole months before
    today, less the gross of every payment that came back within the same months. The entitlement for each restoration month
    is the veteran-alone rate of the award's combined rating. The restoration starts instead from the date the review was
    received when that review was received after its lane's filing window following the reduction notice and does not continue
    an earlier review within the continuous-pursuit window after that earlier review's decision; and from the date the earlier
    review was received when the review does continue an earlier review within that window and the earlier review was itself
    received after its lane's filing window following the reduction notice. The restoration months priced from the 100 percent
    tier are the temporary total months that fall within the restoration months, each at the temporary total rate, when
    the decision history shows a temporary total rating and no individual unemployability; the individual unemployability
    months that fall within the restoration months, each at the individual unemployability rate, when it shows individual
    unemployability and no temporary total rating; both sets together, but no more than the restoration months, when it
    shows both; and none otherwise. The temporary total months that fall within the restoration months are the whole months
    from the temporary total rating's effective date to the effective date of the decision on the same claim recording that
    the prior rating resumed, less the whole months from the temporary total rating's effective date to the restoration's
    start date. The individual unemployability months that fall within the restoration months are the whole months from
    individual unemployability's effective date to today less one for the current month, but no more than the restoration
    months. Every other restoration month takes its additions from the award's own tier. The SMC (k) additions in a restoration
    are one SMC (k) addition for each SMC (k) grant, up to the SMC (k) maximum, for every restoration month when the latest
    grant's effective date is no later than the restoration's start date; for the restoration months less the whole months
    elapsed from the start date to that grant's effective date when it is later; and nothing when the decision history shows
    no SMC (k) grant. The spouse addition in a restoration is the spouse addition plus the spouse aid-and-attendance addition
    when a spouse is recorded on the award and the most recent spouse addition is marked as needing aid and attendance,
    the spouse addition alone when a spouse is recorded and the most recent spouse addition is not so marked, and nothing
    when no spouse is recorded. The child additions in a restoration are one child addition for each recorded minor child
    plus one school-child addition for each recorded school child when the award records both, one child addition for each
    recorded minor child when it records minor children and no school child, one school-child addition for each recorded
    school child when it records school children and no minor child, and nothing when it records no child. The parent additions
    in a restoration are as many parent additions as the parent maximum when the award records at least that many dependent
    parents, one parent addition when it records exactly one dependent parent, and nothing when it records none. The dependents
    of a relationship that count in a restoration are that relationship's additions on the award less its removals, every
    month a restoration covers counting the dependents so recorded.
  prerequisite:
  - problem: comp_ext_suspension_release
    kind: value_input
    gate: rr_paid
    form: state
    policy_source: >-
      A restoration after a reduction overturned on review is not worked out until the award's status is running again.
    condition: >-
      The compensation award's status is running, which on a suspended award comes about only through the resumption that
      also releases the months the suspension left unpaid.
    resolved_by: resume_award_release_withheld_86166e35
    effect: >-
      The resumption sets the award running and books the release of the unpaid months; that release enters what stands
      paid for the restoration months, so the restoration falls by it.
  - problem: comp_ext_temporary_total_past_due
    kind: value_input
    gate: rr_paid
    form: state
    policy_source: >-
      A restoration after a reduction overturned on review is fixed only after the award's payment history carries a past-due
      release citing every temporary total rating decision on the award.
    condition: >-
      For every temporary total rating decision on the award, a retroactive entry whose decision link is that decision stands
      in the award's payment history.
    resolved_by: release_temporary_total_past_due_0acb107c
    effect: >-
      The temporary total past-due enters what stands paid for the restoration months, so the restoration falls by the temporary
      total amount already released for the temporary total months.
  cross_category:
  - category: appeal
    as: branch
    reads:
    - received_date
    - prior_review_id
    - decided_date
    - filing_window_days
    - continuous_pursuit_window_days
    note: >-
      The restoration start factor reads the veteran's review of the reduction decision and any earlier review it continues
      (received and decided dates, lane filing and continuous-pursuit windows) to decide from which date the reduced months
      are restored.
  compute:
  - rr_reduction_id: LATEST('comp_decisions', 'decision_id', date_field='decision_date', decision_outcome='reduction_implemented')
  - rr_reduction_notice: LATEST('comp_decisions', 'notice_date', date_field='decision_date', decision_outcome='reduction_implemented')
  - rr_reduced_from: >-
      LATEST('comp_decisions', 'rating_effective_date', date_field='decision_date', decision_outcome='reduction_implemented')
  - rr_review_received: CFIELD('appeal', 'received_date', contested_decision_id=rr_reduction_id)
  - rr_review_window: CPARAM('appeal', 'filing_window_days', contested_decision_id=rr_reduction_id)
  - rr_review_prior: CFIELD('appeal', 'prior_review_id', contested_decision_id=rr_reduction_id)
  - rr_prior_received: CFIELD('appeal', 'received_date', review_id=rr_review_prior) if rr_review_prior else None
  - rr_prior_decided: CFIELD('appeal', 'decided_date', review_id=rr_review_prior) if rr_review_prior else None
  - rr_prior_window: CPARAM('appeal', 'filing_window_days', review_id=rr_review_prior) if rr_review_prior else 0
  - rr_pursuit_window: CPARAM('appeal', 'continuous_pursuit_window_days', review_id=rr_review_prior) if rr_review_prior
      else 0
  - rr_review_late: >-
      (DAYS(rr_reduction_notice, rr_review_received) > rr_review_window) if (rr_review_received and rr_reduction_notice)
      else False
  - rr_continuous: >-
      (DAYS(rr_prior_decided, rr_review_received) <= rr_pursuit_window) if (rr_prior_decided and rr_review_received) else
      False
  - rr_prior_late: >-
      (DAYS(rr_reduction_notice, rr_prior_received) > rr_prior_window) if (rr_prior_received and rr_reduction_notice) else
      False
  - rr_start: >-
      rr_review_received if (rr_review_late and not rr_continuous) else (rr_prior_received if (rr_continuous and rr_prior_late)
      else rr_reduced_from)
  - rr_months: MX(0, MONTHS(rr_start, NOW) - 1)
  - rr_tt_grants: COUNT('comp_decisions', decision_outcome='temporary_total_granted')
  - rr_iu_grants: COUNT('comp_decisions', decision_outcome='tdiu_granted')
  - rr_tt_start: >-
      LATEST('comp_decisions', 'rating_effective_date', date_field='decision_date', decision_outcome='temporary_total_granted')
  - rr_tt_claim: LATEST('comp_decisions', 'claim_id', date_field='decision_date', decision_outcome='temporary_total_granted')
  - rr_tt_end: >-
      LATEST('comp_decisions', 'rating_effective_date', date_field='decision_date', decision_outcome='rating_continued',
      claim_id=rr_tt_claim)
  - rr_tt_in: >-
      MX(0, MONTHS(rr_tt_start, rr_tt_end) - MX(0, MONTHS(rr_tt_start, rr_start))) if (rr_tt_start and rr_tt_end) else 0
  - rr_iu_eff: LATEST('comp_decisions', 'rating_effective_date', date_field='decision_date', decision_outcome='tdiu_granted')
  - rr_iu_in: MN(rr_months, MX(0, MONTHS(rr_iu_eff, NOW) - 1)) if rr_iu_grants >= 1 else 0
  - rr_high_months: >-
      rr_tt_in if (rr_tt_grants >= 1 and rr_iu_grants == 0) else (rr_iu_in if (rr_iu_grants >= 1 and rr_tt_grants == 0)
      else (MN(rr_months, rr_tt_in + rr_iu_in) if (rr_tt_grants >= 1 and rr_iu_grants >= 1) else 0))
  - rr_high_rate: P('temporary_total_monthly_rate') if (rr_tt_grants >= 1 and rr_iu_grants == 0) else P('tdiu_monthly_rate')
  - rr_smc_grants: COUNT('comp_decisions', decision_outcome='smc_k_granted')
  - rr_smc_eff: >-
      LATEST('comp_decisions', 'rating_effective_date', date_field='decision_date', decision_outcome='smc_k_granted')
  - rr_smc_months: >-
      rr_months if (rr_smc_grants >= 1 and rr_smc_eff <= rr_start) else (MX(0, rr_months - MONTHS(rr_start, rr_smc_eff))
      if (rr_smc_grants >= 1 and rr_smc_eff > rr_start) else 0)
  - rr_spouses: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='spouse') - COUNT('comp_dependents', event_type='comp_dependent_removed',
      relationship='spouse')
  - rr_spouse_aa: >-
      LATEST('comp_dependents', 'spouse_aid_attendance', date_field='effective_date', event_type='comp_dependent_added',
      relationship='spouse') == True
  - rr_spouse_own: >-
      ((P('spouse_addition')) + (P('spouse_aid_attendance_addition'))) if (rr_spouses >= 1 and rr_spouse_aa) else ((P('spouse_addition'))
      if (rr_spouses >= 1 and not rr_spouse_aa) else 0)
  - rr_spouse_full: >-
      ((K('total_tier_spouse_addition')) + (K('total_tier_spouse_aid_attendance_addition'))) if (rr_spouses >= 1 and rr_spouse_aa)
      else ((K('total_tier_spouse_addition')) if (rr_spouses >= 1 and not rr_spouse_aa) else 0)
  - rr_minors: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='child') - COUNT('comp_dependents', event_type='comp_dependent_removed',
      relationship='child')
  - rr_schools: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='school_child') - COUNT('comp_dependents',
      event_type='comp_dependent_removed', relationship='school_child')
  - rr_child_own: >-
      (rr_minors * (P('child_under_18_addition')) + rr_schools * (P('school_child_addition'))) if (rr_minors >= 1 and rr_schools
      >= 1) else ((rr_minors * (P('child_under_18_addition'))) if (rr_minors >= 1 and rr_schools == 0) else ((rr_schools
      * (P('school_child_addition'))) if (rr_schools >= 1 and rr_minors == 0) else 0))
  - rr_child_full: >-
      (rr_minors * (K('total_tier_child_addition')) + rr_schools * (K('total_tier_school_child_addition'))) if (rr_minors
      >= 1 and rr_schools >= 1) else ((rr_minors * (K('total_tier_child_addition'))) if (rr_minors >= 1 and rr_schools ==
      0) else ((rr_schools * (K('total_tier_school_child_addition'))) if (rr_schools >= 1 and rr_minors == 0) else 0))
  - rr_parents: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='parent') - COUNT('comp_dependents', event_type='comp_dependent_removed',
      relationship='parent')
  - rr_parent_own: >-
      P('dependent_parent_max_count') * (P('dependent_parent_addition')) if rr_parents >= P('dependent_parent_max_count')
      else ((P('dependent_parent_addition')) if rr_parents == 1 else 0)
  - rr_parent_full: >-
      P('dependent_parent_max_count') * (K('total_tier_parent_addition')) if rr_parents >= P('dependent_parent_max_count')
      else ((K('total_tier_parent_addition')) if rr_parents == 1 else 0)
  - rr_owed: >-
      P('monthly_rate_veteran_alone') * rr_months + (rr_high_rate - P('monthly_rate_veteran_alone')) * rr_high_months +
      (rr_spouse_own + rr_child_own + rr_parent_own) * (rr_months - rr_high_months) + (rr_spouse_full + rr_child_full +
      rr_parent_full) * rr_high_months + P('smc_k_monthly_addition') * MN(rr_smc_grants, P('smc_k_max_awards')) * rr_smc_months
  - rr_paid: >-
      SUM('comp_payments', 'gross_amount', within_months=rr_months, date_field='payment_date', event_type='comp_monthly_payment')
      + SUM('comp_payments', 'gross_amount', within_months=rr_months, date_field='payment_date', event_type='comp_payment_reissued')
      + SUM('comp_payments', 'gross_amount', within_months=rr_months, date_field='payment_date', event_type='comp_retro_payment')
      - SUM('comp_payments', 'gross_amount', within_months=rr_months, date_field='payment_date', event_type='comp_payment_returned')
  - result: RND(MX(0, rr_owed - rr_paid), 2)
  compute_basis:
    rr_reduction_id: that cites the overturned reduction decision
    rr_reduction_notice: following the reduction notice
    rr_reduced_from: The restoration's start date is the date the reduced rate took effect.
    rr_review_received: from the date the review was received
    rr_review_window: after its lane's filing window following the reduction notice
    rr_review_prior: does not continue an earlier review within the continuous-pursuit window after that earlier review's
