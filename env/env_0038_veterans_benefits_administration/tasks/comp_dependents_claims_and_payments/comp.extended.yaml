    - dep_iu_grants
    - dep_iu_span
    - dep_iu_months
    ladder:
    - when: >-
        individual unemployability is granted and its months up to the latest monthly issue, less those that came back,
        are at least the months covered
      method: price every month covered from the 100 percent tier
    - when: individual unemployability is granted and those months are fewer than the months covered
      method: price that many months from the 100 percent tier and the rest from the award's own tier
    - when: otherwise (no individual unemployability granted)
      method: price every month from the award's own tier
    baseline:
      dep_iu_months: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: dependency_release_spouse
    effect: parameter
    decides: dep_spouse_own
    bindings:
    - dep_spouses
    - dep_spouse_aa
    - dep_spouse_own
    - dep_spouse_full
    ladder:
    - when: >-
        a spouse is recorded on the claims and the most recent spouse addition on them is marked as needing aid and attendance
      value: the spouse addition plus the spouse aid-and-attendance addition for each spouse
    - when: the claims record no spouse
      value: nothing
    - when: otherwise (a spouse whose most recent addition is not so marked)
      value: one spouse addition for each spouse recorded
    baseline:
      dep_spouse_own: P('spouse_addition') * dep_spouses
      dep_spouse_full: K('total_tier_spouse_addition') * dep_spouses
    evidence:
    - history
    cross_difficulty: null
  - id: dependency_release_children
    effect: parameter
    decides: dep_child_own
    bindings:
    - dep_minors
    - dep_schools
    - dep_child_own
    - dep_child_full
    ladder:
    - when: the claims record a school child
      value: one school-child addition per school child plus one child addition per minor child
    - when: the claims record no child
      value: nothing
    - when: otherwise (minor children only)
      value: one child addition for each child recorded
    baseline:
      dep_child_own: (dep_minors + dep_schools) * P('child_under_18_addition')
      dep_child_full: (dep_minors + dep_schools) * K('total_tier_child_addition')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The dependency release is the additions owed each month for the claims' dependents multiplied by the months it covers,
      and the product is rounded half up to the cent. The additions owed each month are one spouse addition for each spouse,
      one child addition for each child and one parent addition for each dependent parent, up to the parent maximum, recorded
      on those claims, at the rates of the award's own tier. The months a dependency release covers are the whole months
      elapsed from the claims' effective date to the issue date of the most recent monthly payment on the award. The claims'
      effective date is the latest date of marriage, birth or adoption recorded on the dependency claim when it was received
      no later than the dependency report window after that date, and the date it was received otherwise.
    params:
    - spouse_addition
    - child_under_18_addition
    - dependent_parent_addition
    - dependent_parent_max_count
    - dependency_report_window_days
  inputs:
    history:
    - table: comp_claims
      aggregate: latest
      field: claim_id
      filters:
        event_type: comp_claim_filed
        claim_type: dependency
    - table: comp_payments
      aggregate: count
      field: payment_id
      filters:
        event_type: comp_monthly_payment
    - table: comp_payments
      aggregate: count
      field: payment_id
      filters:
        event_type: comp_payment_returned
    - table: comp_decisions
      aggregate: latest
      field: rating_effective_date
      filters:
        decision_outcome: tdiu_granted
    - table: comp_dependents
      aggregate: count
      field: dependent_event_id
      filters: {}
    cross_category: []
- id: comp_ext_decision_past_due
  base_policy_refs:
  - comp_evt_rating_change
  - comp_evt_suspension
  - comp_temporary_total
  - comp_retro_withholding
  - comp_monthly_entitlement
  - comp_tdiu
  overwrite:
  - base_policy: comp_evt_rating_change
    superseded_clause: >-
      Past-due benefits for a favorable decision cover every entitlement month from the first month payable under the payment
      schedule through the last month already paid at the old rate, and equal, for each such month, the new gross monthly
      entitlement minus the gross amount already paid for that month.
    replaced_by: >-
      The decision past-due is the monthly entitlement the decisions support for the months with a standing monthly payment,
      less what stands paid toward it, and never less than nothing; it is rounded half up to the cent once, at the end.
  - base_policy: comp_monthly_entitlement
    superseded_clause: >-
      A dependent counts for an entitlement month when the month is on or after the payment_adjust_month of its addition
      and before the payment_adjust_month of its removal.
    replaced_by: >-
      The dependents of a relationship that count in a decision past-due are that relationship's additions on the award
      less its removals, every month a decision past-due covers counting the dependents so recorded.
  trigger: state_due
  subject:
  - comp_retro_payment
  computes: gross_amount
  target_tool: release_decision_past_due_fbf191c5
  params:
    total_tier_spouse_addition: 220.3
    total_tier_spouse_aid_attendance_addition: 201.41
    total_tier_child_addition: 146.1
    total_tier_school_child_addition: 472.95
    total_tier_parent_addition: 176.88
  rule: >-
    A qualifying decision is a favorable rating decision that grants service connection, an increase, individual unemployability
    or SMC (k) and whose effective date makes payable an entitlement month whose monthly payment had already been issued
    when that decision was made; a favorable decision made before the month it first makes payable was paid is not a qualifying
    decision. Past-due compensation from qualifying decisions is released once as one retroactive payment that cites the
    most recent qualifying decision, when no incarceration adjustment applies to the months covered; it applies when no
    direct-pay fee agreement is on file and no debt is in active collection, so nothing is withheld from it. Its span runs
    from the first entitlement month made payable by the earliest qualifying decision through the last entitlement month
    whose monthly payment was issued before the most recent qualifying decision was made. The past-due for a favorable rating
    decision is not fixed until the past-due additions owed for dependents recorded on the award's most recent dependency
    claim have been released. The decision past-due is the monthly entitlement the decisions support for the months with
    a standing monthly payment, less what stands paid toward it, and never less than nothing; it is rounded half up to the
    cent once, at the end. A month has a standing monthly payment when a monthly payment was issued for it and did not come
    back, or came back and was replaced. What stands paid toward a decision past-due is the gross of every monthly payment
    issued, less the gross of every payment that came back, plus the gross of every replacement and of every past-due release
    already on the award. The monthly entitlement for a decision past-due is the veteran-alone rate of the award's combined
    rating for each standing month. The standing months of a decision past-due paid at the individual unemployability rate
    are every standing month when individual unemployability is granted and the whole months from its effective date to
    the issue date of the most recent monthly payment, less one for each payment that came back and has no replacement,
    are at least the standing months; that many months alone, the others at the veteran-alone rate, when they are fewer;
    and none when the decision history shows no individual unemployability granted. A standing month at the individual unemployability
    rate takes that rate in place of the veteran-alone rate and its additions from the 100 percent tier; any other standing
    month takes its additions from the award's own tier. The SMC (k) additions in a decision past-due are one SMC (k) addition
    for each SMC (k) grant, up to the SMC (k) maximum, for every standing month when the whole months from the latest grant's
    effective date to the issue date of the most recent monthly payment, less one for each payment that came back and has
    no replacement, are at least the standing months; for that many months alone when they are fewer; and nothing when the
    decision history shows no SMC (k) grant. The spouse addition in a decision past-due is the spouse addition plus the
    spouse aid-and-attendance addition when a spouse is recorded on the award and the most recent spouse addition is marked
    as needing aid and attendance, the spouse addition alone when a spouse is recorded and the most recent spouse addition
    is not so marked, and nothing when no spouse is recorded. The child additions in a decision past-due are one child addition
    for each recorded minor child plus one school-child addition for each recorded school child when the award records both,
    one child addition for each recorded minor child when it records minor children and no school child, one school-child
    addition for each recorded school child when it records school children and no minor child, and nothing when it records
    no child. The parent additions in a decision past-due are as many parent additions as the parent maximum when the award
    records at least that many dependent parents, one parent addition when it records exactly one dependent parent, and
    nothing when it records none. The dependents of a relationship that count in a decision past-due are that relationship's
    additions on the award less its removals, every month a decision past-due covers counting the dependents so recorded.
  prerequisite:
  - problem: comp_ext_dependency_past_due
    kind: value_input
    gate: dpd_paid
    form: action
    policy_source: >-
      The past-due for a favorable rating decision is not fixed until the past-due additions owed for dependents recorded
      on the award's most recent dependency claim have been released.
    fallback_reason: >-
      The release of past-due dependent additions books a retroactive entry that cites no decision and names no dependent
      or claim, the same shape as a release made when a suspension ends, so no state the records show singles out that those
      additions were released; the sentence therefore names the release itself.
    condition: >-
      The award's payment history carries one retroactive release, citing no decision, that pays the additions of the dependents
      recorded on the most recent dependency claim for every month whose standing monthly payment was issued without them.
    resolved_by: release_dependency_past_due_602dcd04
    effect: >-
      Once the dependency release stands, its gross enters what stands paid toward this past-due, so it falls by the additions
      that release already paid for the standing months.
  cross_category: []
  compute:
  - dpd_last_issue: LATEST('comp_payments', 'payment_date', date_field='payment_date', event_type='comp_monthly_payment')
  - dpd_open_returns: >-
      COUNT('comp_payments', event_type='comp_payment_returned') - COUNT('comp_payments', event_type='comp_payment_reissued')
  - dpd_standing: >-
      COUNT('comp_payments', event_type='comp_monthly_payment') - COUNT('comp_payments', event_type='comp_payment_returned')
      + COUNT('comp_payments', event_type='comp_payment_reissued')
  - dpd_iu_grants: COUNT('comp_decisions', decision_outcome='tdiu_granted')
  - dpd_iu_span: >-
      MX(0, MONTHS(LATEST('comp_decisions', 'rating_effective_date', date_field='decision_date', decision_outcome='tdiu_granted'),
      dpd_last_issue) - dpd_open_returns) if dpd_iu_grants >= 1 else 0
  - dpd_iu_months: >-
      dpd_standing if (dpd_iu_grants >= 1 and dpd_iu_span >= dpd_standing) else (dpd_iu_span if (dpd_iu_grants >= 1 and
      dpd_iu_span < dpd_standing) else 0)
  - dpd_smc_grants: COUNT('comp_decisions', decision_outcome='smc_k_granted')
  - dpd_smc_span: >-
      MX(0, MONTHS(LATEST('comp_decisions', 'rating_effective_date', date_field='decision_date', decision_outcome='smc_k_granted'),
      dpd_last_issue) - dpd_open_returns) if dpd_smc_grants >= 1 else 0
  - dpd_smc_months: >-
      dpd_standing if (dpd_smc_grants >= 1 and dpd_smc_span >= dpd_standing) else (dpd_smc_span if (dpd_smc_grants >= 1
      and dpd_smc_span < dpd_standing) else 0)
  - dpd_spouses: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='spouse') - COUNT('comp_dependents', event_type='comp_dependent_removed',
      relationship='spouse')
  - dpd_spouse_aa: >-
      LATEST('comp_dependents', 'spouse_aid_attendance', date_field='effective_date', event_type='comp_dependent_added',
      relationship='spouse') == True
  - dpd_spouse_own: >-
      ((P('spouse_addition')) + (P('spouse_aid_attendance_addition'))) if (dpd_spouses >= 1 and dpd_spouse_aa) else ((P('spouse_addition'))
      if (dpd_spouses >= 1 and not dpd_spouse_aa) else 0)
  - dpd_spouse_full: >-
      ((K('total_tier_spouse_addition')) + (K('total_tier_spouse_aid_attendance_addition'))) if (dpd_spouses >= 1 and dpd_spouse_aa)
      else ((K('total_tier_spouse_addition')) if (dpd_spouses >= 1 and not dpd_spouse_aa) else 0)
  - dpd_minors: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='child') - COUNT('comp_dependents', event_type='comp_dependent_removed',
      relationship='child')
  - dpd_schools: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='school_child') - COUNT('comp_dependents',
      event_type='comp_dependent_removed', relationship='school_child')
  - dpd_child_own: >-
      (dpd_minors * (P('child_under_18_addition')) + dpd_schools * (P('school_child_addition'))) if (dpd_minors >= 1 and
      dpd_schools >= 1) else ((dpd_minors * (P('child_under_18_addition'))) if (dpd_minors >= 1 and dpd_schools == 0) else
      ((dpd_schools * (P('school_child_addition'))) if (dpd_schools >= 1 and dpd_minors == 0) else 0))
  - dpd_child_full: >-
      (dpd_minors * (K('total_tier_child_addition')) + dpd_schools * (K('total_tier_school_child_addition'))) if (dpd_minors
      >= 1 and dpd_schools >= 1) else ((dpd_minors * (K('total_tier_child_addition'))) if (dpd_minors >= 1 and dpd_schools
      == 0) else ((dpd_schools * (K('total_tier_school_child_addition'))) if (dpd_schools >= 1 and dpd_minors == 0) else
      0))
  - dpd_parents: >-
      COUNT('comp_dependents', event_type='comp_dependent_added', relationship='parent') - COUNT('comp_dependents', event_type='comp_dependent_removed',
      relationship='parent')
  - dpd_parent_own: >-
      P('dependent_parent_max_count') * (P('dependent_parent_addition')) if dpd_parents >= P('dependent_parent_max_count')
      else ((P('dependent_parent_addition')) if dpd_parents == 1 else 0)
  - dpd_parent_full: >-
      P('dependent_parent_max_count') * (K('total_tier_parent_addition')) if dpd_parents >= P('dependent_parent_max_count')
      else ((K('total_tier_parent_addition')) if dpd_parents == 1 else 0)
  - dpd_owed: >-
      P('monthly_rate_veteran_alone') * dpd_standing + (P('tdiu_monthly_rate') - P('monthly_rate_veteran_alone')) * dpd_iu_months
      + (dpd_spouse_own + dpd_child_own + dpd_parent_own) * (dpd_standing - dpd_iu_months) + (dpd_spouse_full + dpd_child_full
      + dpd_parent_full) * dpd_iu_months + P('smc_k_monthly_addition') * MN(dpd_smc_grants, P('smc_k_max_awards')) * dpd_smc_months
  - dpd_paid: >-
      SUM('comp_payments', 'gross_amount', event_type='comp_monthly_payment') - SUM('comp_payments', 'gross_amount', event_type='comp_payment_returned')
      + SUM('comp_payments', 'gross_amount', event_type='comp_payment_reissued') + SUM('comp_payments', 'gross_amount',
      event_type='comp_retro_payment')
  - result: RND(MX(0, dpd_owed - dpd_paid), 2)
  compute_basis:
    dpd_last_issue: to the issue date of the most recent monthly payment
    dpd_open_returns: less one for each payment that came back and has no replacement
    dpd_standing: >-
      A month has a standing monthly payment when a monthly payment was issued for it and did not come back, or came back
      and was replaced.
    dpd_iu_grants: when the decision history shows no individual unemployability granted
    dpd_iu_span: >-
      the whole months from its effective date to the issue date of the most recent monthly payment, less one for each payment
      that came back and has no replacement
    dpd_iu_months: >-
      The standing months of a decision past-due paid at the individual unemployability rate are every standing month when
      individual unemployability is granted and the whole months from its effective date to the issue date of the most recent
      monthly payment, less one for each payment that came back and has no replacement, are at least the standing months;
      that many months alone, the others at the veteran-alone rate, when they are fewer; and none when the decision history
      shows no individual unemployability granted. A standing month at the individual unemployability rate takes that rate
      in place of the veteran-alone rate and its additions from the 100 percent tier; any other standing month takes its
      additions from the award's own tier.
    dpd_smc_grants: when the decision history shows no SMC (k) grant
    dpd_smc_span: >-
      the whole months from the latest grant's effective date to the issue date of the most recent monthly payment, less
      one for each payment that came back and has no replacement
    dpd_smc_months: >-
      The SMC (k) additions in a decision past-due are one SMC (k) addition for each SMC (k) grant, up to the SMC (k) maximum,
      for every standing month when the whole months from the latest grant's effective date to the issue date of the most
      recent monthly payment, less one for each payment that came back and has no replacement, are at least the standing
      months; for that many months alone when they are fewer; and nothing when the decision history shows no SMC (k) grant.
    dpd_spouses: >-
      The dependents of a relationship that count in a decision past-due are that relationship's additions on the award
      less its removals, every month a decision past-due covers counting the dependents so recorded.
    dpd_spouse_aa: the most recent spouse addition is marked as needing aid and attendance
    dpd_spouse_own: >-
      The spouse addition in a decision past-due is the spouse addition plus the spouse aid-and-attendance addition when
      a spouse is recorded on the award and the most recent spouse addition is marked as needing aid and attendance, the
      spouse addition alone when a spouse is recorded and the most recent spouse addition is not so marked, and nothing
      when no spouse is recorded.
    dpd_spouse_full: its additions from the 100 percent tier
    dpd_minors: >-
      The dependents of a relationship that count in a decision past-due are that relationship's additions on the award
      less its removals, every month a decision past-due covers counting the dependents so recorded.
    dpd_schools: >-
      The dependents of a relationship that count in a decision past-due are that relationship's additions on the award
      less its removals, every month a decision past-due covers counting the dependents so recorded.
    dpd_child_own: >-
      The child additions in a decision past-due are one child addition for each recorded minor child plus one school-child
      addition for each recorded school child when the award records both, one child addition for each recorded minor child
      when it records minor children and no school child, one school-child addition for each recorded school child when
      it records school children and no minor child, and nothing when it records no child.
    dpd_child_full: its additions from the 100 percent tier
    dpd_parents: >-
      The dependents of a relationship that count in a decision past-due are that relationship's additions on the award
      less its removals, every month a decision past-due covers counting the dependents so recorded.
    dpd_parent_own: >-
      The parent additions in a decision past-due are as many parent additions as the parent maximum when the award records
      at least that many dependent parents, one parent addition when it records exactly one dependent parent, and nothing
      when it records none.
    dpd_parent_full: its additions from the 100 percent tier
    dpd_owed: >-
      The monthly entitlement for a decision past-due is the veteran-alone rate of the award's combined rating for each
      standing month.
    dpd_paid: >-
      What stands paid toward a decision past-due is the gross of every monthly payment issued, less the gross of every
      payment that came back, plus the gross of every replacement and of every past-due release already on the award.
    result: >-
      The decision past-due is the monthly entitlement the decisions support for the months with a standing monthly payment,
      less what stands paid toward it, and never less than nothing; it is rounded half up to the cent once, at the end.
  factors:
  - id: decision_past_due_unemployability_months
    effect: method
    decides: dpd_iu_months
    bindings:
    - dpd_iu_grants
    - dpd_iu_months
    ladder:
    - when: >-
        individual unemployability is granted and its months to the latest monthly issue, less open returns, are at least
        the standing months
      method: pay every standing month at the individual unemployability rate with 100 percent tier additions
    - when: individual unemployability is granted and those months are fewer than the standing months
      method: >-
        pay that many standing months at the individual unemployability rate and the rest at the veteran-alone rate with
        own-tier additions
    - when: otherwise (no individual unemployability granted)
      method: pay every standing month at the veteran-alone rate with own-tier additions
    baseline:
      dpd_iu_months: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: decision_past_due_smc_k_months
    effect: method
    decides: dpd_smc_months
    bindings:
    - dpd_smc_grants
    - dpd_smc_months
    ladder:
    - when: >-
        an SMC (k) grant is recorded and its months to the latest monthly issue, less open returns, are at least the standing
        months
      method: add the SMC (k) additions for every standing month
    - when: an SMC (k) grant is recorded and those months are fewer than the standing months
      method: add the SMC (k) additions for that many standing months only
    - when: otherwise (no SMC (k) grant)
      method: add no SMC (k) addition
    baseline:
