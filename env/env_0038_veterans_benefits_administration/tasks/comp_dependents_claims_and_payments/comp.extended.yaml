  factors:
  - id: dependency_release_months
    effect: method
    decides: dep_months
    bindings:
    - dep_last_issue
    - dep_issued
    - dep_returned
    - dep_calendar
    - dep_months
    ladder:
    - when: >-
        the claim's effective date lies further back than the number of monthly payments the award has issued and a monthly
        payment came back
      method: count the monthly payments issued less one for each that came back
    - when: >-
        the claim's effective date lies further back than the number of monthly payments the award has issued and no monthly
