events:
  - type: debt_established
    target: debt_accounts
    mutation: create
    meaning: VA establishes a debt for an overpayment or a paid guaranty claim and sends the initial notice of rights and obligations.
    grain: one row per debt established from one originating record
    fields:
      customer_id: The debtor.
      variant_name: Debt type.
      status: Set to active.
      source_category: Benefit line the debt arose in.
      source_record_id: Originating record.
      original_amount: Principal established.
      current_balance: Equal to the original amount at establishment.
      notice_date: Date of the initial notice.
      fraud_finding: Whether fraud, misrepresentation or bad faith was found.
      opened_date: Date established.
    account: debt_balance
    direction: in
    triggers: []

  - type: debt_collection_held
    target: debt_accounts
    mutation: {transition: {from: active, to: on_hold}}
    meaning: Collection on the debt stops while a timely waiver request, dispute or compromise offer is decided.
    grain: one row per transaction
    fields:
      status: Set to on_hold.
      collection_hold_reason: The request type holding collection.
    triggers: []

  - type: debt_collection_resumed
    target: debt_accounts
    mutation: {transition: {from: on_hold, to: active}}
    meaning: The held request was decided without fully resolving the debt and collection resumes.
    grain: one row per transaction
    fields:
      status: Set to active.
      collection_hold_reason: Reset to none.
    triggers: []

  - type: debt_plan_started
    target: debt_accounts
    mutation: {transition: {from: active, to: repayment_plan}}
    meaning: A repayment plan or reduced monthly withholding is approved.
    grain: one row per transaction
    fields:
      status: Set to repayment_plan.
      repayment_plan_method: direct_payment or benefit_withholding.
      repayment_plan_monthly_amount: Approved monthly amount.
      repayment_plan_start_month: First plan month.
    triggers: []

  - type: debt_plan_defaulted
    target: debt_accounts
    mutation: {transition: {from: repayment_plan, to: active}}
    meaning: The plan is cancelled after consecutive missed installments and full collection resumes.
    grain: one row per transaction
    fields:
      status: Set to active.
      repayment_plan_method: Reset to none.
      repayment_plan_monthly_amount: Reset to 0.00.
      repayment_plan_start_month: Reset to empty.
    triggers: []

  - type: debt_referred_to_treasury
    target: debt_accounts
    mutation: {transition: {from: active, to: referred_to_treasury}}
    meaning: A delinquent debt is referred to the Treasury cross-servicing program.
    grain: one row per transaction
    fields:
      status: Set to referred_to_treasury.
      treasury_referral_date: Referral date.
    triggers:
      - event: debt:debt_treasury_fee_assessed
        map: {debt_id: debt_id, customer_id: customer_id}

  - type: debt_paid_in_full
    target: debt_accounts
    mutation: {transition: [{from: active, to: paid_in_full}, {from: repayment_plan, to: paid_in_full}, {from: referred_to_treasury, to: paid_in_full}]}
    meaning: The balance reaches zero through collections and credits.
    grain: one row per transaction
    fields:
      status: Set to paid_in_full.
      closed_date: Date the balance reached zero.
    triggers: []

  - type: debt_waived
    target: debt_accounts
    mutation: {transition: [{from: active, to: waived}, {from: on_hold, to: waived}]}
    meaning: The entire remaining balance is waived.
    grain: one row per transaction
    fields:
      status: Set to waived.
      collection_hold_reason: Reset to none.
      closed_date: Waiver decision date.
    triggers: []

  - type: debt_compromised
    target: debt_accounts
    mutation: {transition: [{from: active, to: compromised}, {from: on_hold, to: compromised}]}
    meaning: An accepted compromise has been paid and the remaining balance is forgiven.
    grain: one row per transaction
    fields:
      status: Set to compromised.
      collection_hold_reason: Reset to none.
      closed_date: Date the compromise payment posted.
    triggers: []

  - type: debt_credit_reported
    target: debt_accounts
    mutation: update
    meaning: A delinquent debt of a reportable type is reported to the consumer credit bureaus.
    grain: one row per transaction
    fields:
      credit_bureau_reported_date: Date reported.
    triggers: []

  - type: debt_offset_collected
    target: debt_transactions
    meaning: Money withheld from a VA benefit payment is applied to the debt.
    grain: one row per benefit payment offset per debt
    distinguish_by: [source_payment_id]
    fields:
      debt_id: Debt credited.
      customer_id: Debtor.
      amount: Amount applied.
      transaction_date: Posting date (the benefit payment date).
      collection_source: compensation_offset, pension_offset or education_offset.
      source_payment_id: Benefit payment withheld from.
    account: debt_balance
    direction: out
    triggers: []

  - type: debt_payment_received
    target: debt_transactions
    meaning: The debtor pays VA directly, as a lump sum or a plan installment.
    grain: one row per direct payment
    distinguish_by: [transaction_date, payment_channel, period_month]
    fields:
      debt_id: Debt paid.
      customer_id: Debtor.
      amount: Amount paid.
      transaction_date: Posting date.
      collection_source: Always direct_payment.
      payment_channel: Channel used.
      period_month: Plan month paid, or empty for an unscheduled payment.
    account: debt_balance
    direction: out
    triggers: []

  - type: debt_waiver_credit
    target: debt_transactions
    meaning: A granted or partially granted waiver reduces the balance.
    grain: one row per waiver decision
    distinguish_by: [request_id]
    fields:
      debt_id: Debt credited.
      customer_id: Debtor.
      amount: Amount waived.
      transaction_date: Decision date.
      collection_source: Always not_applicable.
      request_id: Decided waiver request.
    account: debt_balance
    direction: out
    triggers: []

  - type: debt_compromise_credit
    target: debt_transactions
    meaning: After an accepted compromise is paid, the remaining balance is credited off.
    grain: one row per accepted compromise
    distinguish_by: [request_id]
    fields:
      debt_id: Debt credited.
      customer_id: Debtor.
      amount: Balance forgiven.
      transaction_date: Date the compromise payment posted.
      collection_source: Always not_applicable.
      request_id: Accepted compromise offer.
    account: debt_balance
    direction: out
    triggers: []

  - type: debt_balance_corrected
    target: debt_transactions
    meaning: A dispute review finds the debt invalid or overstated and the originating office removes the unsupported amount.
    grain: one row per dispute decision that changes the amount
    distinguish_by: [request_id]
    fields:
      debt_id: Debt corrected.
      customer_id: Debtor.
      amount: Amount removed.
      transaction_date: Decision date.
      collection_source: Always not_applicable.
      request_id: The dispute decision.
    account: debt_balance
    direction: out
    triggers: []

  - type: debt_interest_accrued
    target: debt_transactions
    meaning: A month's interest is added to an interest-bearing debt.
    grain: one row per debt per accrual month
    distinguish_by: [period_month]
    fields:
      debt_id: Debt charged.
      customer_id: Debtor.
      amount: Interest added.
      transaction_date: Last day of the accrual month.
      collection_source: Always not_applicable.
      period_month: Accrual month.
    account: debt_balance
    direction: in
    triggers: []

  - type: debt_treasury_fee_assessed
    target: debt_transactions
    meaning: Treasury adds its cross-servicing fee to a referred debt.
    grain: one row per referral
    distinguish_by: [transaction_date]
    fields:
      debt_id: Debt charged.
      customer_id: Debtor.
      amount: Fee added.
      transaction_date: Referral date.
      collection_source: Always not_applicable.
    account: debt_balance
    direction: in
    triggers: []

  - type: debt_overcollection_refunded
    target: debt_transactions
    meaning: Money collected beyond the balance, or collected after a timely waiver request on a portion later waived, is refunded to the debtor.
    grain: one row per refund
    distinguish_by: [transaction_date, request_id]
    fields:
      debt_id: Debt refunded on.
      customer_id: Debtor.
      amount: Amount refunded.
      transaction_date: Refund date.
      collection_source: Always not_applicable.
      request_id: The waiver decision that made the collected amount refundable, or empty for a plain overcollection.
    account: debt_balance
    direction: in
    triggers: []

  - type: debt_waiver_requested
    target: debt_requests
    meaning: The debtor asks VA to waive all or part of the debt.
    grain: one row per waiver request
    distinguish_by: [received_date, requested_amount]
    fields:
      debt_id: Debt concerned.
      customer_id: Debtor.
      request_kind: Always waiver.
      received_date: Date received.
      requested_amount: Amount asked to be waived.
      fsr_submitted: Whether a Financial Status Report accompanies it.
      received_within_hold_window: Whether received within the collection-hold window.
      decision_outcome: Always pending.
      channel: Channel used.
    triggers:
      - event: debt:debt_collection_held
        when: {received_within_hold_window: true}
        map: {collection_hold_reason: waiver_pending}

  - type: debt_dispute_filed
    target: debt_requests
    meaning: The debtor disputes that the debt exists or that the amount is correct.
    grain: one row per dispute
    distinguish_by: [received_date]
    fields:
      debt_id: Debt concerned.
      customer_id: Debtor.
      request_kind: Always dispute.
      received_date: Date received.
      requested_amount: Always 0.00.
      received_within_hold_window: Whether received within the collection-hold window.
      decision_outcome: Always pending.
      channel: Channel used.
    triggers:
      - event: debt:debt_collection_held
        when: {received_within_hold_window: true}
        map: {collection_hold_reason: dispute_pending}

  - type: debt_compromise_offered
    target: debt_requests
    meaning: The debtor offers a lump sum smaller than the balance to settle the debt.
    grain: one row per offer
    distinguish_by: [received_date, requested_amount]
    fields:
      debt_id: Debt concerned.
      customer_id: Debtor.
      request_kind: Always compromise.
      received_date: Date received.
      requested_amount: Lump sum offered.
      fsr_submitted: Whether a Financial Status Report accompanies it.
      received_within_hold_window: Whether received within the collection-hold window.
      decision_outcome: Always pending.
      channel: Channel used.
    triggers: []

  - type: debt_repayment_plan_requested
    target: debt_requests
    meaning: The debtor asks to repay in monthly installments or to have monthly withholding reduced.
    grain: one row per plan request
    distinguish_by: [request_kind, received_date, requested_amount]
    fields:
      debt_id: Debt concerned.
      customer_id: Debtor.
      request_kind: repayment_plan or reduced_withholding.
      received_date: Date received.
      requested_amount: Monthly installment or withholding proposed.
      requested_term_months: Months proposed.
      fsr_submitted: Whether a Financial Status Report accompanies it.
      received_within_hold_window: Whether received within the collection-hold window.
      decision_outcome: Always pending.
      channel: Channel used.
    triggers: []

  - type: debt_request_decided
    target: debt_requests
    meaning: VA decides a waiver, dispute, compromise or plan request.
    grain: one row per request decided
    distinguish_by: [source_request_id]
    fields:
      debt_id: Debt concerned.
      customer_id: Debtor.
      request_kind: Kind of the request decided.
      received_date: Decision date.
      decision_outcome: granted, partially_granted or denied.
      decided_amount: Amount waived, compromise accepted, or installment approved.
      source_request_id: The request decided.
      channel: Channel of the request decided.
    triggers:
      - event: debt:debt_waiver_credit
        when: {request_kind: waiver, decision_outcome: [granted, partially_granted]}
        map: {debt_id: debt_id, customer_id: customer_id, amount: decided_amount, request_id: source_request_id}

measures:
  - id: debt_msr_days_delinquent
    window: From the initial notice date (or the date the last plan installment or hold ended, whichever is later) to the current date.
    measure: Calendar days with no debt_payment_received or debt_offset_collected entry on the debt while its status was active.
  - id: debt_msr_consecutive_missed_installments
    window: Plan months from repayment_plan_start_month through the month before the current month.
    measure: Count of consecutive most-recent plan months with no debt_payment_received entry whose period_month equals that month.
  - id: debt_msr_collected_after_request
    window: From the received_date of one timely waiver request through the date of its decision.
    measure: Sum of amount over debt_offset_collected and debt_payment_received entries on the debt whose transaction_date falls in the window.
  - id: debt_msr_open_balance_all_debts
    window: Current state.
    measure: Sum of current_balance over all of the debtor's debts whose status is active, on_hold, repayment_plan or referred_to_treasury.

policies:
  - id: debt_agg_multi_holding
    subject: [debt_established]
    rule: >-
      A beneficiary may owe several debts at once, of the same or different types, with no limit on their number;
      each overpayment or paid guaranty claim is established as its own debt with its own notice date, balance and
      windows, and debts are never merged. One originating record creates at most one debt: a debt is established
      only when no debt already cites the same originating record. Amounts that later prove to be overpaid on the same
      originating record are added as a new debt with its own notice, not by raising the old balance.
    eligibility:
      - id: one_debt_per_source
        applies_to: [debt_established]
        kind: dedup
        condition: a debt is established only when no debt already cites the same originating record
        evidence_fields: [debt_accounts.source_record_id, debt_accounts.debt_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [debt_accounts.source_record_id]
          action_bindings:
            debt_accounts.source_record_id: source_record_id
        dedup_contract:
          table: debt_accounts
          mode: separate_record
          object_bindings: {source_record_id: source_record_id}
          duplicate_filters: {status: [active, on_hold, repayment_plan, referred_to_treasury, paid_in_full, waived, compromised]}
          distinct_fields: []
    params:
      max_per_customer: null
      due_process_notice_required: =due_process_notice_required

  - id: debt_agg_collection_order
    subject: [debt_offset_collected, debt_payment_received]
    rule: >-
      When a debtor has more than one debt open for collection, an amount withheld from one benefit payment is applied
      first to the debt with the earliest notice date, and only the remainder passes to the next debt in that order;
      debts on hold are skipped. A direct payment the debtor designates for a specific debt is applied to that debt;
      an undesignated direct payment follows the same earliest-notice order. Within one debt, a collection is applied
      in the payment_application_order of its type, so interest accrued is paid before principal on an
      interest-bearing debt. The combined open balance across all the debtor's debts
      (debt_msr_open_balance_all_debts) is what a debtor is quoted as their total amount owed.
    eligibility: []
    params:
      multi_debt_offset_order: =multi_debt_offset_order
      payment_application_order: =payment_application_order
      payment_designation_honored: =payment_designation_honored
    measures: [debt_msr_open_balance_all_debts]

  - id: debt_evt_offset
    subject: [debt_offset_collected]
    rule: >-
      VA collects an active debt by withholding default_offset_pct_of_benefit percent of each compensation, pension or
      education payment listed in the debt type's offset_sources, never more than the remaining balance. Withholding from a benefit payment begins only for payments issued not earlier than offset_start_after_notice_days calendar days after the date of the initial debt notice. Count calendar days starting the day after the notice date; a payment issued on the last day of the period is subject to offset.
      Benefit offset is applied only to a debt whose status is active or repayment_plan. Under a reduced-withholding
      plan, each monthly benefit payment is withheld only the approved monthly amount, but a retroactive benefit
      release is still offset up to the full balance when retro_offset_full_amount is true. A debt that is on hold,
      referred to Treasury, or whose debtor has died is not offset from VA benefits.
    eligibility:
      - id: offset_start
        applies_to: [debt_offset_collected]
        kind: time
        condition: Withholding from a benefit payment begins only for payments issued not earlier than offset_start_after_notice_days calendar days after the date of the initial debt notice.
        evidence_fields: [debt_accounts.notice_date, debt_accounts.debt_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [debt_accounts.debt_id]
          action_bindings:
            debt_accounts.debt_id: debt_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the initial debt notice
          anchor_source: debt_accounts.notice_date
          relation: not_before
          duration_source: variants.offset_start_after_notice_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after the notice date; a payment issued on the last day of the period is subject to offset.
          boundary: inclusive
      - id: offset_status
        applies_to: [debt_offset_collected]
        kind: state
        condition: Benefit offset is applied only to a debt whose status is active or repayment_plan.
        evidence_fields: [debt_accounts.status, debt_accounts.debt_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [debt_accounts.debt_id]
          action_bindings:
            debt_accounts.debt_id: debt_id
        state_contract:
          field: debt_accounts.status
          allowed: [active, repayment_plan]
    params:
      default_offset_pct_of_benefit: =default_offset_pct_of_benefit
      offset_start_after_notice_days: =offset_start_after_notice_days
      offset_sources: =offset_sources
      retro_offset_full_amount: =retro_offset_full_amount
      estate_collection_only: =estate_collection_only

  - id: debt_evt_waiver
    subject: [debt_waiver_requested, debt_request_decided, debt_waiver_credit, debt_waived, debt_collection_held, debt_collection_resumed]
    rule: >-
      A waiver request is considered only if it is received not later than waiver_request_window_days calendar days after the date of the initial debt notice. Count calendar days starting the day after the notice date; a request received on the last day of the window is timely.
      A waiver request is complete only with a Financial Status Report, because the Committee on Waivers and Compromises
      weighs equity and good conscience against the debtor's finances; a request without one is recorded but the
      debtor is asked to send it. Waiver is never granted when the debt record carries a fraud, misrepresentation or
      bad faith finding. A request received within collection_hold_window_days calendar days after the notice date holds
      collection until it is decided; a later but timely request is decided while collection continues. The Committee
      may grant all, part or none of the amount; a partial grant credits the waived amount and collection resumes on
      the remainder, and a grant of the entire balance closes the debt as waived. Amounts collected after a timely
      request (debt_msr_collected_after_request) that fall within the waived amount are refunded. Submitting the
      waiver request and the Financial Status Report is the debtor's own act.
    eligibility:
      - id: waiver_window
        applies_to: [debt_waiver_requested]
        kind: time
        condition: A waiver request is considered only if it is received not later than waiver_request_window_days calendar days after the date of the initial debt notice.
        evidence_fields: [debt_accounts.notice_date, debt_accounts.debt_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [debt_accounts.debt_id]
          action_bindings:
            debt_accounts.debt_id: debt_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the initial debt notice
          anchor_source: debt_accounts.notice_date
          relation: not_after
          duration_source: variants.waiver_request_window_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after the notice date; a request received on the last day of the window is timely.
          boundary: inclusive
      - id: no_fraud_finding
        applies_to: [debt_request_decided]
        kind: authorization
        condition: Waiver is never granted when the debt record carries a fraud, misrepresentation or bad faith finding.
        evidence_fields: [debt_accounts.fraud_finding, debt_accounts.debt_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [debt_accounts.debt_id]
          action_bindings:
            debt_accounts.debt_id: debt_id
    params:
      per_tier:
        Education Overpayment (Chapters 30, 35 and 1606): {waiver_request_window_days: =waiver_request_window_days}
        Post-9/11 GI Bill Housing and Books Overpayment: {waiver_request_window_days: =waiver_request_window_days}
        Post-9/11 GI Bill Tuition and Fees Overpayment: {waiver_request_window_days: =waiver_request_window_days}
        Disability Compensation Overpayment: {waiver_request_window_days: =waiver_request_window_days}
        Veterans Pension Overpayment: {waiver_request_window_days: =waiver_request_window_days}
        Home Loan Guaranty Debt: {waiver_request_window_days: =waiver_request_window_days}
      collection_hold_window_days: =collection_hold_window_days
      waiver_requires_fsr: =waiver_requires_fsr
      waiver_fraud_bar: =waiver_fraud_bar
      waiver_partial_allowed: =waiver_partial_allowed
      waiver_refund_collected_after_request: =waiver_refund_collected_after_request
      waiver_decision_goal_days: =waiver_decision_goal_days
    measures: [debt_msr_collected_after_request]

  - id: debt_evt_dispute
    subject: [debt_dispute_filed, debt_request_decided, debt_balance_corrected, debt_collection_held, debt_collection_resumed]
    rule: >-
      A debtor may dispute at any time that a debt exists or that its amount is correct; a dispute is a challenge to
      validity, not a request for forgiveness, and is reviewed by the regional office that created the debt within
      dispute_review_goal_days. A dispute received within collection_hold_window_days calendar days after the notice
      date holds collection until the review is complete. When the review finds the debt invalid, the whole balance is
      removed by a balance correction citing the dispute decision and the debt closes as paid in full; when it finds
      the amount overstated, a balance correction removes the difference; otherwise collection resumes unchanged. A dispute
      does not stop the waiver window from running.
    eligibility: []
    params:
      dispute_holds_collection: =dispute_holds_collection
      dispute_review_goal_days: =dispute_review_goal_days
      collection_hold_window_days: =collection_hold_window_days

  - id: debt_evt_repayment_plan
    subject: [debt_repayment_plan_requested, debt_request_decided, debt_plan_started, debt_plan_defaulted, debt_payment_received]
    rule: >-
      A debtor may ask to repay in monthly installments paid directly, or to have the monthly withholding from benefit
      payments reduced. A repayment plan request is taken only on a debt whose status is active. The installment
      must be at least repayment_plan_min_installment and at least the balance divided by the plan's number of months,
      rounded up to the cent; a plan of up to plan_max_months_without_fsr months is approved on request, and a plan of up
      to plan_max_months_with_fsr months only with a Financial Status Report; a longer plan is not available. Reduced
      withholding is approved only with a Financial Status Report and never below reduced_withholding_min_monthly.
      The first installment is due plan_first_installment_due_days calendar days after approval, and the plan is
      cancelled when missed_installments_default_count consecutive installments are missed
      (debt_msr_consecutive_missed_installments), after which full offset resumes. A debtor may pay off the balance
      early at any time without penalty.
    eligibility:
      - id: plan_on_active_debt
        applies_to: [debt_repayment_plan_requested]
        kind: state
        condition: A repayment plan request is taken only on a debt whose status is active.
        evidence_fields: [debt_accounts.status, debt_accounts.debt_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [debt_accounts.debt_id]
          action_bindings:
            debt_accounts.debt_id: debt_id
        state_contract:
          field: debt_accounts.status
          allowed: [active]
    params:
      per_tier:
        Education Overpayment (Chapters 30, 35 and 1606): {repayment_plan_min_installment: =repayment_plan_min_installment, reduced_withholding_min_monthly: =reduced_withholding_min_monthly}
        Post-9/11 GI Bill Housing and Books Overpayment: {repayment_plan_min_installment: =repayment_plan_min_installment, reduced_withholding_min_monthly: =reduced_withholding_min_monthly}
        Post-9/11 GI Bill Tuition and Fees Overpayment: {repayment_plan_min_installment: =repayment_plan_min_installment, reduced_withholding_min_monthly: =reduced_withholding_min_monthly}
        Disability Compensation Overpayment: {repayment_plan_min_installment: =repayment_plan_min_installment, reduced_withholding_min_monthly: =reduced_withholding_min_monthly}
        Veterans Pension Overpayment: {repayment_plan_min_installment: =repayment_plan_min_installment, reduced_withholding_min_monthly: =reduced_withholding_min_monthly}
        Home Loan Guaranty Debt: {repayment_plan_min_installment: =repayment_plan_min_installment, reduced_withholding_min_monthly: =reduced_withholding_min_monthly}
      plan_max_months_without_fsr: =plan_max_months_without_fsr
      plan_max_months_with_fsr: =plan_max_months_with_fsr
      plan_first_installment_due_days: =plan_first_installment_due_days
      missed_installments_default_count: =missed_installments_default_count
      reduced_withholding_requires_fsr: =reduced_withholding_requires_fsr
      installment_rounding: =installment_rounding
      direct_payment_channels: =direct_payment_channels
    formula:
      minimum_installment: "max(repayment_plan_min_installment, current_balance / requested_term_months)"
    measures: [debt_msr_consecutive_missed_installments]

  - id: debt_evt_compromise
    subject: [debt_compromise_offered, debt_request_decided, debt_compromise_credit, debt_compromised]
    rule: >-
      A debtor may offer a lump sum smaller than the balance to settle a debt. An offer is considered only with a
      Financial Status Report showing the debtor cannot pay the full amount within a reasonable time. VA can accept a
      compromise only on a debt whose balance is not more than compromise_va_authority_max; a larger debt can be
      compromised only through the Department of Justice and is never decided on a service call. An accepted amount
      must be paid in one lump sum within compromise_lump_sum_due_days calendar days of acceptance; when it is paid,
      the remaining balance is credited off and the debt closes as compromised, and when it is not paid on time the
      acceptance lapses and collection resumes. Offers received within the collection-hold window hold collection
      like a waiver request.
    eligibility:
      - id: within_va_authority
        applies_to: [debt_request_decided]
        kind: authorization
        condition: VA can accept a compromise only on a debt whose balance is not more than compromise_va_authority_max
        evidence_fields: [debt_accounts.current_balance, debt_accounts.debt_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [debt_accounts.debt_id]
          action_bindings:
            debt_accounts.debt_id: debt_id
    params:
      compromise_va_authority_max: =compromise_va_authority_max
      compromise_lump_sum_due_days: =compromise_lump_sum_due_days
      compromise_requires_fsr: =compromise_requires_fsr

  - id: debt_evt_treasury_referral
    subject: [debt_referred_to_treasury, debt_treasury_fee_assessed, debt_credit_reported]
    rule: >-
      A debt that has been delinquent for more than treasury_referral_delinquency_days (debt_msr_days_delinquent), is
      not on hold or in a repayment plan, and has a balance of at least treasury_referral_min_balance is referred to
      Treasury cross-servicing, and Treasury adds treasury_cross_servicing_fee_pct percent of the referred balance as its
      fee. A referred debt can be collected from federal tax refunds, from Social Security benefits (no more than
      social_security_offset_max_pct percent, and never from the first social_security_protected_amount of a monthly
      benefit), from federal salary (no more than federal_salary_offset_max_pct percent of disposable pay) and by
      administrative wage garnishment (no more than wage_garnishment_max_pct percent of disposable pay). Once
      referred, VA no longer sets up plans or takes compromise offers on the debt; the debtor deals with Treasury.
      A delinquent debt of a type whose credit_bureau_reporting is true is reported to the consumer credit bureaus once
      credit_bureau_reporting_after_days have passed since the notice; other debt types are never reported.
      The second demand letter goes out first_notice_followup_days after the notice when there is no response.
    eligibility: []
    params:
      per_tier:
        Education Overpayment (Chapters 30, 35 and 1606): {credit_bureau_reporting: =credit_bureau_reporting, credit_bureau_reporting_after_days: =credit_bureau_reporting_after_days}
        Post-9/11 GI Bill Housing and Books Overpayment: {credit_bureau_reporting: =credit_bureau_reporting, credit_bureau_reporting_after_days: =credit_bureau_reporting_after_days}
        Post-9/11 GI Bill Tuition and Fees Overpayment: {credit_bureau_reporting: =credit_bureau_reporting, credit_bureau_reporting_after_days: =credit_bureau_reporting_after_days}
        Disability Compensation Overpayment: {credit_bureau_reporting: =credit_bureau_reporting, credit_bureau_reporting_after_days: =credit_bureau_reporting_after_days}
        Veterans Pension Overpayment: {credit_bureau_reporting: =credit_bureau_reporting, credit_bureau_reporting_after_days: =credit_bureau_reporting_after_days}
        Home Loan Guaranty Debt: {credit_bureau_reporting: =credit_bureau_reporting, credit_bureau_reporting_after_days: =credit_bureau_reporting_after_days}
      treasury_referral_delinquency_days: =treasury_referral_delinquency_days
      treasury_referral_min_balance: =treasury_referral_min_balance
      treasury_cross_servicing_fee_pct: =treasury_cross_servicing_fee_pct
      tax_refund_offset_eligible: =tax_refund_offset_eligible
      social_security_offset_max_pct: =social_security_offset_max_pct
      social_security_protected_amount: =social_security_protected_amount
      federal_salary_offset_max_pct: =federal_salary_offset_max_pct
      wage_garnishment_max_pct: =wage_garnishment_max_pct
      first_notice_followup_days: =first_notice_followup_days
    formula:
      fee_amount: "round(current_balance * treasury_cross_servicing_fee_pct / 100, 2)"
    measures: [debt_msr_days_delinquent]

  - id: debt_evt_interest
    subject: [debt_interest_accrued]
    rule: >-
      Interest accrues only on debt types whose interest_rate_pct is above zero; compensation, pension and education
      overpayments never bear interest. On an interest-bearing debt, interest starts once interest_accrual_start_days
      have passed after the notice date without payment in full, and each month adds simple interest at one twelfth of
      the annual rate on the balance at the start of that month, rounded to the cent. No interest accrues for a month in
      which the debt is on hold or in a repayment plan that is current.
    eligibility: []
    params:
      per_tier:
        Education Overpayment (Chapters 30, 35 and 1606): {interest_rate_pct: =interest_rate_pct}
        Post-9/11 GI Bill Housing and Books Overpayment: {interest_rate_pct: =interest_rate_pct}
        Post-9/11 GI Bill Tuition and Fees Overpayment: {interest_rate_pct: =interest_rate_pct}
        Disability Compensation Overpayment: {interest_rate_pct: =interest_rate_pct}
        Veterans Pension Overpayment: {interest_rate_pct: =interest_rate_pct}
        Home Loan Guaranty Debt: {interest_rate_pct: =interest_rate_pct}
      interest_accrual_start_days: =interest_accrual_start_days
      interest_compounding: =interest_compounding
    formula:
      amount: "round(current_balance * interest_rate_pct / 100 / 12, 2)"

  - id: debt_evt_refunds
    subject: [debt_overcollection_refunded, debt_paid_in_full]
    rule: >-
      When collections on a debt exceed its balance, the excess is refunded to the debtor within
      overcollection_refund_days calendar days, provided it is at least overcollection_refund_min; a smaller excess is
      applied to the debtor's next open debt in the multi-debt order, or released when there is none. When a waiver is
      granted for a portion that VA had already collected after a timely request, that collected portion is refunded and
      the refund cites the waiver decision. A debt closes as paid in full when its balance reaches zero.
    eligibility: []
    params:
      overcollection_refund_min: =overcollection_refund_min
      overcollection_refund_days: =overcollection_refund_days

  - id: debt_interact_benefit_lines
    subject: [debt_established, debt_offset_collected]
    rule: >-
      Holding a running benefit award changes how a debt is collected: a debtor with a running compensation, pension or
      education award listed in the debt type's offset_sources is collected by offset from that award, while a debtor
      with no running award is billed for direct payment and moves toward Treasury referral if it goes unpaid. A Home
      Loan Guaranty Debt is never established against a veteran whose loan was assumed with a release of liability,
      because release_of_liability_bars_debt is true for that type. A Post-9/11 GI Bill Tuition and Fees Overpayment
      created by the student's own reduction or withdrawal is the student's debt, while one created by a school's
      certification error is established against the school and never against the student.
    eligibility: []
    params:
      per_tier:
        Education Overpayment (Chapters 30, 35 and 1606): {release_of_liability_bars_debt: =release_of_liability_bars_debt, student_vs_school_liability_split: =student_vs_school_liability_split}
        Post-9/11 GI Bill Housing and Books Overpayment: {release_of_liability_bars_debt: =release_of_liability_bars_debt, student_vs_school_liability_split: =student_vs_school_liability_split}
        Post-9/11 GI Bill Tuition and Fees Overpayment: {release_of_liability_bars_debt: =release_of_liability_bars_debt, student_vs_school_liability_split: =student_vs_school_liability_split}
        Disability Compensation Overpayment: {release_of_liability_bars_debt: =release_of_liability_bars_debt, student_vs_school_liability_split: =student_vs_school_liability_split}
        Veterans Pension Overpayment: {release_of_liability_bars_debt: =release_of_liability_bars_debt, student_vs_school_liability_split: =student_vs_school_liability_split}
        Home Loan Guaranty Debt: {release_of_liability_bars_debt: =release_of_liability_bars_debt, student_vs_school_liability_split: =student_vs_school_liability_split}
      offset_sources: =offset_sources

  - id: debt_excl_single_pending_request
    subject: [debt_waiver_requested, debt_dispute_filed, debt_compromise_offered]
    rule: >-
      Only one waiver request, dispute or compromise offer may be pending on a debt at a time, because one_pending_request_only is true. A request is pending until a decision citing it exists. A debtor whose waiver request is pending can
      withdraw it and offer a compromise instead, but the two are never decided side by side; a new request of any of
      these kinds is taken only when no earlier one on the same debt is still undecided. A repayment plan request is
      not affected by this limit.
    eligibility:
      - id: no_undecided_request
        applies_to: [debt_waiver_requested, debt_dispute_filed, debt_compromise_offered]
        kind: dedup
        condition: a new request of any of these kinds is taken only when no earlier one on the same debt is still undecided
        evidence_fields: [debt_requests.debt_id, debt_requests.event_type, debt_requests.source_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [debt_requests.debt_id]
          action_bindings:
            debt_requests.debt_id: debt_id
        dedup_contract:
          table: debt_requests
          mode: separate_record
          object_bindings: {debt_id: debt_id}
          duplicate_filters: {event_type: [debt_waiver_requested, debt_dispute_filed, debt_compromise_offered]}
          distinct_fields: [request_kind]
    params:
      one_pending_request_only: =one_pending_request_only

extended_policies:
  - id: debt_ext_plan_reinstatement_deposit
    base_policy_refs: [debt_agg_collection_order, debt_evt_repayment_plan]
    overwrite: []
    trigger: on_request
    subject: [debt_payment_received]
    computes: amount
    target_tool: pay_plan_reinstatement_66656e17
    params:
      refigure_balance_min: 5000.0
      small_balance_max: 1000.0
      reinstatement_window_months: 6
      deposit_floor_comp: 450.0
      deposit_floor_other: 200.0
      deposit_pct_high: 55
      deposit_pct_mid: 80
      deposit_pct_standard: 100
      excess_credit_late_pct: 50
    rule: >-
      A debtor whose repayment plan on a debt was cancelled for missed installments may pay a reinstatement
      deposit by direct payment, which the debtor authorizes in person on the call and which is applied to that
      debt. The amount a debtor pays to reinstate a repayment plan cancelled for
      missed installments is figured from the cancelled plan's own record. The installments counted are the plan
      months that have fallen due since the cancelled plan was approved, counted in whole calendar months from
      the approval date to the day of the payment, less the installments already paid by direct payment on the
      debt. Each counted installment is valued at the installment approved for the cancelled plan. The
      reinstatement deposit is the counted installments multiplied by that installment value, never less than
      the smallest plan installment of the debt type, taken at the standard deposit percentage of 100 percent,
      and rounded to the cent.
      How many installments are counted depends on how the plan failed: when at least one installment was paid
      and no more installments are missing than the number of consecutive misses that cancels a plan, only the
      single latest missed installment is counted; when no installment was ever paid and at least one plan month
      has fallen due, every plan month that has fallen due is counted; in every other case the installments
      missed are counted as booked, that is the plan months fallen due less the installments paid.
      The value of each counted installment depends on the plan and the balance: when the cancelled plan was
      approved without a Financial Status Report and the balance now outstanding is at least the re-figuring
      threshold of the policy, each counted installment is re-figured as the current balance divided by the
      cancelled plan's number of months, rounded up to the cent; when the balance now outstanding is below the
      small-balance limit of the policy and at least one installment was paid, each counted installment is
      valued at the smallest plan installment of the debt type; otherwise each counted installment is valued at
      the installment approved for the cancelled plan.
      The deposit floor depends on how recently the plan was approved and on the debtor's compensation: when
      the cancelled plan was approved no more than the reinstatement window of the policy in whole months ago and
      the debtor holds a running Disability Compensation award, the counted installments are raised to at least
      the compensation deposit floor of the policy; when the plan was approved within that window and the
      debtor holds no running Disability Compensation award, they are raised to at least the other deposit floor
      of the policy; otherwise the floor is the smallest plan installment of the debt type.
      The deposit percentage depends on the debtor's combined compensation rating and on the waiver window: a
      debtor whose running Disability Compensation award is rated 60 percent or more and whose debt notice is no
      more than the debt type's waiver window in calendar days old pays the high-rating deposit percentage of the
      policy; a debtor whose running award is rated 30 to 50 percent and whose notice is within that window pays
      the mid-rating deposit percentage of the policy; every other debtor pays the standard deposit percentage.
      Money already paid on the cancelled plan above the approved installments is credited against the deposit:
      when the direct payments on the debt exceed the installments paid times the approved installment and the
      notice is within the waiver window, the whole excess is credited; when there is such an excess and the
      notice is older than the waiver window, the late-credit percentage of the policy of that excess, rounded to
      the cent, is credited; when there is no excess nothing is credited.
      The deposit is worked out in this order: first the counted installments are multiplied by the installment
      value, then that product is raised to the deposit floor if it is lower, then that result is multiplied by
      the deposit percentage, then the credit is subtracted from that result, the outcome is never below zero,
      and it is rounded to the cent only once, at the end.
    prerequisite: []
    cross_category:
      - category: comp
        as: branch
        reads: [status, variant_name]
        note: The deposit floor tier reads whether the debtor's Disability Compensation award is running, and the deposit percentage tier reads that award's combined rating.
    compute:
      - approved_installment: "LATEST('debt_requests','decided_amount', date_field='received_date', event_type='debt_request_decided', request_kind='repayment_plan')"
      - approved_on: "LATEST('debt_requests','received_date', date_field='received_date', event_type='debt_request_decided', request_kind='repayment_plan')"
      - plan_term: "LATEST('debt_requests','requested_term_months', date_field='received_date', event_type='debt_repayment_plan_requested', request_kind='repayment_plan')"
      - plan_fsr: "LATEST('debt_requests','fsr_submitted', date_field='received_date', event_type='debt_repayment_plan_requested', request_kind='repayment_plan')"
      - balance: "F('current_balance')"
      - days_since_notice: "DAYS(F('notice_date'), NOW)"
      - months_due: "MONTHS(approved_on, NOW)"
      - installments_paid: "COUNT('debt_transactions', event_type='debt_payment_received')"
      - installments_counted: "1 if (installments_paid >= 1 and months_due - installments_paid <= P('missed_installments_default_count')) else (months_due if (installments_paid < 1 and months_due >= 1) else months_due - installments_paid)"
      - installment_value: "-((-(balance / plan_term) * 100) // 1) / 100 if ((not plan_fsr) and balance >= K('refigure_balance_min')) else (P('repayment_plan_min_installment') if (balance < K('small_balance_max') and installments_paid >= 1) else approved_installment)"
      - comp_status: "CFIELD('comp','status')"
      - deposit_floor: "K('deposit_floor_comp') if (months_due <= K('reinstatement_window_months') and comp_status == 'running') else (K('deposit_floor_other') if (months_due <= K('reinstatement_window_months') and comp_status != 'running') else P('repayment_plan_min_installment'))"
      - comp_rating: "CPARAM('comp','combined_rating_percent', status='running') or 0"
      - deposit_pct: "K('deposit_pct_high') if (comp_rating >= 60 and days_since_notice <= P('waiver_request_window_days')) else (K('deposit_pct_mid') if (comp_rating >= 30 and comp_rating < 60 and days_since_notice <= P('waiver_request_window_days')) else K('deposit_pct_standard'))"
      - paid_total: "SUM('debt_transactions','amount', event_type='debt_payment_received')"
      - excess_paid: "MX(0, paid_total - installments_paid * approved_installment)"
      - excess_credit: "excess_paid if (excess_paid > 0 and days_since_notice <= P('waiver_request_window_days')) else (RND(excess_paid * K('excess_credit_late_pct') / 100, 2) if (excess_paid > 0 and days_since_notice > P('waiver_request_window_days')) else 0)"
      - deposit_base: "MX(installments_counted * installment_value, deposit_floor)"
      - result: "RND(MX(0, deposit_base * deposit_pct / 100 - excess_credit), 2)"
    compute_basis:
      approved_installment: "Each counted installment is valued at the installment approved for the cancelled plan."
      approved_on: "counted in whole calendar months from the approval date to the day of the payment"
      plan_term: "each counted installment is re-figured as the current balance divided by the cancelled plan's number of months, rounded up to the cent"
      plan_fsr: "when the cancelled plan was approved without a Financial Status Report"
      days_since_notice: "whose debt notice is no more than the debt type's waiver window in calendar days old"
      months_due: "The installments counted are the plan months that have fallen due since the cancelled plan was approved, counted in whole calendar months from the approval date to the day of the payment, less the installments already paid by direct payment on the debt."
      installments_paid: "less the installments already paid by direct payment on the debt"
      installments_counted: "when at least one installment was paid and no more installments are missing than the number of consecutive misses that cancels a plan, only the single latest missed installment is counted; when no installment was ever paid and at least one plan month has fallen due, every plan month that has fallen due is counted; in every other case the installments missed are counted as booked, that is the plan months fallen due less the installments paid."
      installment_value: "when the cancelled plan was approved without a Financial Status Report and the balance now outstanding is at least the re-figuring threshold of the policy, each counted installment is re-figured as the current balance divided by the cancelled plan's number of months, rounded up to the cent; when the balance now outstanding is below the small-balance limit of the policy and at least one installment was paid, each counted installment is valued at the smallest plan installment of the debt type; otherwise each counted installment is valued at the installment approved for the cancelled plan."
      comp_status: "the debtor holds a running Disability Compensation award"
      deposit_floor: "when the cancelled plan was approved no more than the reinstatement window of the policy in whole months ago and the debtor holds a running Disability Compensation award, the counted installments are raised to at least the compensation deposit floor of the policy; when the plan was approved within that window and the debtor holds no running Disability Compensation award, they are raised to at least the other deposit floor of the policy; otherwise the floor is the smallest plan installment of the debt type."
      comp_rating: "a debtor whose running Disability Compensation award is rated 60 percent or more"
      deposit_pct: "a debtor whose running Disability Compensation award is rated 60 percent or more and whose debt notice is no more than the debt type's waiver window in calendar days old pays the high-rating deposit percentage of the policy; a debtor whose running award is rated 30 to 50 percent and whose notice is within that window pays the mid-rating deposit percentage of the policy; every other debtor pays the standard deposit percentage."
      paid_total: "when the direct payments on the debt exceed the installments paid times the approved installment"
      excess_paid: "when the direct payments on the debt exceed the installments paid times the approved installment"
      excess_credit: "when the direct payments on the debt exceed the installments paid times the approved installment and the notice is within the waiver window, the whole excess is credited; when there is such an excess and the notice is older than the waiver window, the late-credit percentage of the policy of that excess, rounded to the cent, is credited; when there is no excess nothing is credited."
      deposit_base: "first the counted installments are multiplied by the installment value, then that product is raised to the deposit floor if it is lower"
      result: "then that result is multiplied by the deposit percentage, then the credit is subtracted from that result, the outcome is never below zero, and it is rounded to the cent only once, at the end."
    factors:
      - id: installments_counted
        effect: method
        decides: installments_counted
        bindings: [months_due, installments_paid, installments_counted]
        ladder:
          - when: "at least one installment paid AND no more installments missing than the consecutive misses that cancel a plan"
            method: "only the single latest missed installment is counted"
          - when: "no installment ever paid AND at least one plan month fallen due"
            method: "every plan month fallen due since approval is counted"
          - when: "otherwise"
            method: "the plan months fallen due less the installments paid, counted as booked"
        baseline:
          installments_counted: "months_due - installments_paid"
        evidence: [history, date]
        cross_difficulty: null
      - id: installment_value
        effect: method
        decides: installment_value
        bindings: [plan_term, plan_fsr, installment_value]
        ladder:
          - when: "the cancelled plan was approved without a Financial Status Report AND the balance now outstanding is at least the re-figuring threshold"
            method: "the current balance divided by the cancelled plan's number of months, rounded up to the cent"
          - when: "the balance now outstanding is below the small-balance limit AND at least one installment was paid"
            method: "the smallest plan installment of the debt type"
          - when: "otherwise"
            method: "the installment approved for the cancelled plan"
        baseline:
          installment_value: "approved_installment"
        evidence: [history]
        cross_difficulty: null
      - id: deposit_floor
        effect: parameter
        decides: deposit_floor
        bindings: [comp_status, deposit_floor]
        ladder:
          - when: "plan approved within the reinstatement window AND a running Disability Compensation award"
            value: "K('deposit_floor_comp')"
          - when: "plan approved within the reinstatement window AND no running Disability Compensation award"
            value: "K('deposit_floor_other')"
          - when: "otherwise"
            value: "P('repayment_plan_min_installment')"
        baseline:
          deposit_floor: "P('repayment_plan_min_installment')"
        evidence: [cross_category, date]
        cross_difficulty: comp
      - id: deposit_pct
        effect: parameter
        decides: deposit_pct
        bindings: [comp_rating, deposit_pct]
        ladder:
          - when: "running compensation award rated 60 percent or more AND notice within the waiver window"
            value: "K('deposit_pct_high')"
          - when: "running compensation award rated 30 to 50 percent AND notice within the waiver window"
            value: "K('deposit_pct_mid')"
          - when: "otherwise"
            value: "K('deposit_pct_standard')"
        baseline:
          deposit_pct: "K('deposit_pct_standard')"
        evidence: [cross_category, date]
        cross_difficulty: comp
      - id: excess_credit
        effect: parameter
        decides: excess_credit
        bindings: [paid_total, excess_paid, excess_credit]
        ladder:
          - when: "direct payments above the approved installments AND notice within the waiver window"
            value: "the whole excess"
          - when: "direct payments above the approved installments AND notice older than the waiver window"
            value: "K('excess_credit_late_pct') percent of the excess"
          - when: "otherwise"
            value: "nothing"
        baseline:
          excess_credit: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The amount a debtor pays to reinstate a repayment plan cancelled for missed installments is figured from
        the cancelled plan's own record. The installments counted are the plan months that have fallen due since
        the cancelled plan was approved, counted in whole calendar months from the approval date to the day of
        the payment, less the installments already paid by direct payment on the debt. Each counted installment
        is valued at the installment approved for the cancelled plan. The reinstatement deposit is the counted
        installments multiplied by that installment value, never less than the smallest plan installment of the
        debt type, taken at the standard deposit percentage of 100 percent, and rounded to the cent.
      params: [repayment_plan_min_installment, deposit_pct_standard]
    inputs:
      history:
        - {table: debt_requests, aggregate: latest, field: decided_amount, filters: {event_type: debt_request_decided, request_kind: repayment_plan}}
        - {table: debt_transactions, aggregate: count, field: debt_txn_id, filters: {event_type: debt_payment_received}}
        - {table: debt_transactions, aggregate: sum, field: amount, filters: {event_type: debt_payment_received}}
      cross_category: [comp]

  - id: debt_ext_waiver_request_amount
    base_policy_refs: [debt_evt_waiver, debt_excl_single_pending_request]
    overwrite: []
    trigger: on_request
    subject: [debt_waiver_requested]
    computes: requested_amount
    target_tool: submit_waiver_request_4f8614a0
    params:
      capacity_pct_high: 10
      capacity_pct_mid: 5
      horizon_large_months: 24
      horizon_small_months: 18
      large_balance_min: 2500.0
      partial_credit_pct: 50
    rule: >-
      A waiver request is signed by the debtor and goes in with the debtor's Financial Status Report attached;
      the amount it asks VA to waive is the part of the debt the debtor cannot be expected to repay from their
      own means. The amount a waiver request asks VA to waive is fixed only after the debt's ledger carries the
      reinstatement deposit owed on any repayment plan of the debt that was cancelled for missed installments.
      The amount a waiver request asks VA to waive is the debt's outstanding balance less the amount the debtor
      is expected to repay from their own means. The expected repayment is a monthly repayment capacity equal to
      the smallest plan installment of the debt type, carried over a repayment horizon equal to the longest plan
      approved without a Financial Status Report, with every month of the horizon counted. The request never
      asks for less than zero and is rounded to the cent.
      The monthly repayment capacity depends on the debtor's compensation: a debtor whose running Disability
      Compensation award is rated 60 percent or more has a capacity of the high-rating capacity percentage of the
      policy of that award's monthly veteran-alone rate; a debtor whose running award is rated 10 to 50 percent
      has a capacity of the mid-rating capacity percentage of the policy of that monthly rate; a debtor with no
      running award has the smallest plan installment of the debt type as capacity.
      The repayment horizon depends on the notice and the balance: when the debt notice is no more than the debt
      type's waiver window in calendar days old and the outstanding balance is at least the large-balance limit
      of the policy, the horizon is the large-balance horizon of the policy in months; when the notice is within
      that window and the balance is below that limit, the horizon is the small-balance horizon of the policy in
      months; otherwise the horizon is the longest plan approved without a Financial Status Report.
      Which horizon months are counted depends on any plan on the debt: when a repayment plan on the debt was
      approved and the debt is again in active collection, the whole calendar months from that plan's approval
      to today are taken out of the horizon; when a plan was approved and the debt is still in repayment-plan
      status, one month is taken out of the horizon; otherwise every month of the horizon is counted.
      Direct payments the debtor has already made are credited against the expected repayment: when two or more
      direct payments posted on the debt in the last six calendar months counted back from today, their whole
      total is credited; when exactly one did, the partial-credit percentage of the policy of it, rounded to the
      cent, is credited; otherwise nothing is credited.
      The amount is worked out in this order: first the monthly capacity is multiplied by the horizon months
      counted, then the credit is subtracted from that product to give the expected repayment, then the expected
      repayment is subtracted from the outstanding balance, the outcome is never below zero, and it is rounded
      to the cent only at the end.
    prerequisite:
      - problem: debt_ext_plan_reinstatement_deposit
        kind: value_input
        gate: balance
        form: state
        policy_source: >-
          The amount a waiver request asks VA to waive is fixed only after the debt's ledger carries the
          reinstatement deposit owed on any repayment plan of the debt that was cancelled for missed installments.
        condition: >-
          For a debt whose repayment plan was cancelled for missed installments, a direct payment equal to the
          reinstatement deposit stands among the debt's transactions, and the outstanding balance and the direct
          payments of the last six months reflect it.
        resolved_by: pay_plan_reinstatement_66656e17
        effect: >-
          The deposit lowers the outstanding balance the waiver amount starts from and adds one direct payment
          to those credited against the expected repayment, so the amount asked changes.
    cross_category:
      - category: comp
        as: branch
        reads: [status, variant_name]
        note: The monthly repayment capacity tier reads the combined rating and the veteran-alone monthly rate of the debtor's running Disability Compensation award.
    compute:
      - balance: "F('current_balance')"
      - days_since_notice: "DAYS(F('notice_date'), NOW)"
      - comp_rating: "CPARAM('comp','combined_rating_percent', status='running') or 0"
      - comp_monthly_rate: "CPARAM('comp','monthly_rate_veteran_alone', status='running') or 0"
      - monthly_capacity: "comp_monthly_rate * K('capacity_pct_high') / 100 if (comp_rating >= 60 and comp_monthly_rate > 0) else (comp_monthly_rate * K('capacity_pct_mid') / 100 if (comp_rating >= 10 and comp_rating < 60 and comp_monthly_rate > 0) else P('repayment_plan_min_installment'))"
      - horizon_months: "K('horizon_large_months') if (days_since_notice <= P('waiver_request_window_days') and balance >= K('large_balance_min')) else (K('horizon_small_months') if (days_since_notice <= P('waiver_request_window_days') and balance < K('large_balance_min')) else P('plan_max_months_without_fsr'))"
      - plan_approvals: "COUNT('debt_requests', event_type='debt_request_decided', request_kind='repayment_plan', decision_outcome='granted')"
      - plan_approved_on: "LATEST('debt_requests','received_date', date_field='received_date', event_type='debt_request_decided', request_kind='repayment_plan', decision_outcome='granted')"
      - horizon_counted: "horizon_months - MONTHS(plan_approved_on, NOW) if (plan_approvals >= 1 and F('status') == 'active') else (horizon_months - 1 if (plan_approvals >= 1 and F('status') == 'repayment_plan') else horizon_months)"
      - recent_payment_total: "SUM('debt_transactions','amount', within_months=6, date_field='transaction_date', event_type='debt_payment_received')"
      - recent_payment_count: "COUNT('debt_transactions', within_months=6, date_field='transaction_date', event_type='debt_payment_received')"
      - repaid_credit: "recent_payment_total if recent_payment_count >= 2 else (RND(recent_payment_total * K('partial_credit_pct') / 100, 2) if recent_payment_count == 1 else 0)"
      - expected_repayment: "monthly_capacity * horizon_counted - repaid_credit"
      - result: "RND(MX(0, balance - expected_repayment), 2)"
    compute_basis:
      balance: "The amount a waiver request asks VA to waive is the debt's outstanding balance less the amount the debtor is expected to repay from their own means."
      days_since_notice: "when the debt notice is no more than the debt type's waiver window in calendar days old"
      comp_rating: "a debtor whose running Disability Compensation award is rated 60 percent or more"
      comp_monthly_rate: "of that award's monthly veteran-alone rate"
      monthly_capacity: "a debtor whose running Disability Compensation award is rated 60 percent or more has a capacity of the high-rating capacity percentage of the policy of that award's monthly veteran-alone rate; a debtor whose running award is rated 10 to 50 percent has a capacity of the mid-rating capacity percentage of the policy of that monthly rate; a debtor with no running award has the smallest plan installment of the debt type as capacity."
      horizon_months: "when the debt notice is no more than the debt type's waiver window in calendar days old and the outstanding balance is at least the large-balance limit of the policy, the horizon is the large-balance horizon of the policy in months; when the notice is within that window and the balance is below that limit, the horizon is the small-balance horizon of the policy in months; otherwise the horizon is the longest plan approved without a Financial Status Report."
      plan_approvals: "when a repayment plan on the debt was approved"
      plan_approved_on: "the whole calendar months from that plan's approval to today"
      horizon_counted: "when a repayment plan on the debt was approved and the debt is again in active collection, the whole calendar months from that plan's approval to today are taken out of the horizon; when a plan was approved and the debt is still in repayment-plan status, one month is taken out of the horizon; otherwise every month of the horizon is counted."
      recent_payment_total: "when two or more direct payments posted on the debt in the last six calendar months counted back from today, their whole total is credited"
      recent_payment_count: "when exactly one did"
      repaid_credit: "when two or more direct payments posted on the debt in the last six calendar months counted back from today, their whole total is credited; when exactly one did, the partial-credit percentage of the policy of it, rounded to the cent, is credited; otherwise nothing is credited."
      expected_repayment: "first the monthly capacity is multiplied by the horizon months counted, then the credit is subtracted from that product to give the expected repayment"
      result: "then the expected repayment is subtracted from the outstanding balance, the outcome is never below zero, and it is rounded to the cent only at the end."
    factors:
      - id: monthly_capacity
        effect: parameter
        decides: monthly_capacity
        bindings: [comp_rating, comp_monthly_rate, monthly_capacity]
        ladder:
          - when: "running Disability Compensation award rated 60 percent or more AND a monthly veteran-alone rate on that award"
            value: "K('capacity_pct_high') percent of the award's monthly veteran-alone rate"
          - when: "running Disability Compensation award rated 10 to 50 percent"
            value: "K('capacity_pct_mid') percent of the award's monthly veteran-alone rate"
          - when: "otherwise (no running award)"
            value: "P('repayment_plan_min_installment')"
        baseline:
          monthly_capacity: "P('repayment_plan_min_installment')"
        evidence: [cross_category, tier_param]
        cross_difficulty: comp
      - id: horizon_months
        effect: parameter
        decides: horizon_months
        bindings: [days_since_notice, horizon_months]
        ladder:
          - when: "notice within the waiver window AND balance at least the large-balance limit"
            value: "K('horizon_large_months')"
          - when: "notice within the waiver window AND balance below the large-balance limit"
            value: "K('horizon_small_months')"
          - when: "otherwise"
            value: "P('plan_max_months_without_fsr')"
        baseline:
          horizon_months: "P('plan_max_months_without_fsr')"
        evidence: [date, history]
        cross_difficulty: null
      - id: horizon_counted
        effect: method
        decides: horizon_counted
        bindings: [plan_approvals, plan_approved_on, horizon_counted]
        ladder:
          - when: "a repayment plan on the debt was approved AND the debt is again in active collection"
            method: "the whole calendar months from the plan's approval to today are taken out of the horizon"
          - when: "a repayment plan on the debt was approved AND the debt is still in repayment-plan status"
            method: "one month is taken out of the horizon"
          - when: "otherwise"
            method: "every month of the horizon is counted"
        baseline:
          horizon_counted: "horizon_months"
        evidence: [history, date]
        cross_difficulty: null
      - id: repaid_credit
        effect: parameter
        decides: repaid_credit
        bindings: [recent_payment_total, recent_payment_count, repaid_credit]
        ladder:
          - when: "two or more direct payments posted in the last six calendar months"
            value: "their whole total"
          - when: "exactly one direct payment posted in the last six calendar months"
            value: "K('partial_credit_pct') percent of it"
          - when: "otherwise"
            value: "nothing"
        baseline:
          repaid_credit: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The amount a waiver request asks VA to waive is the debt's outstanding balance less the amount the debtor
        is expected to repay from their own means. The expected repayment is a monthly repayment capacity equal to
        the smallest plan installment of the debt type, carried over a repayment horizon equal to the longest plan
        approved without a Financial Status Report, with every month of the horizon counted. The request never
        asks for less than zero and is rounded to the cent.
      params: [repayment_plan_min_installment, plan_max_months_without_fsr]
    inputs:
      history:
        - {table: debt_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: debt_payment_received}}
        - {table: debt_requests, aggregate: count, field: request_id, filters: {event_type: debt_request_decided, request_kind: repayment_plan, decision_outcome: granted}}
      cross_category: [comp]

  - id: debt_ext_plan_request_term
    base_policy_refs: [debt_evt_repayment_plan]
    overwrite:
      - base_policy: debt_evt_repayment_plan
        superseded_clause: >-
          a plan of up to plan_max_months_with_fsr months only with a Financial Status Report
        replaced_by: >-
          For a debtor who asks for a plan longer than the longest plan approved without a Financial Status Report,
          the number of months on the repayment plan request is fixed only after the debt carries a waiver request,
          received in the last six months, with the debtor's signed Financial Status Report attached.
    trigger: on_request
    subject: [debt_repayment_plan_requested]
    computes: requested_term_months
    target_tool: record_repayment_plan_request_018c5870
    params:
      fsr_balance_min: 3000.0
      mid_term_months: 36
      rating_cut_high_months: 6
      rating_cut_mid_months: 3
      pending_cut_fsr_months: 4
      pending_cut_plain_months: 2
      no_cut_months: 0
    rule: >-
      A repayment plan request records the number of months the plan is to run, and that number is the longest
      term the debtor qualifies for. A plan of up to the longest plan approved without a Financial Status Report is
      approved on request. A Financial Status Report reaches a debt only with a request the debtor signs; a
      repayment plan request recorded by a representative carries none. For a debtor who asks for a plan longer
      than the longest plan approved without a Financial Status Report, the number of months on the repayment plan
      request is fixed only after the debt carries a waiver request, received in the last six months, with the
      debtor's signed Financial Status Report attached.
      The number of months on a repayment plan request is the longest plan approved without a Financial Status
      Report, and nothing is taken off it; the result is a whole number of months and never less than one.
      The longest term depends on the Financial Status Report and the balance: when a waiver request with a
      Financial Status Report attached was received on the debt in the last six calendar months counted back
      from today and the outstanding balance is at least the report-balance threshold of the policy, the longest
      term is the longest plan approved with a Financial Status Report; when such a request was received and the
      balance is below that threshold, the longest term is the mid-length term of the policy in months;
      otherwise it is the longest plan approved without a Financial Status Report.
      Months already run under a cancelled plan are counted against the term: when a plan on the debt was
      approved, the debt is again in active collection and at least one direct payment was made on it, the whole
      calendar months from that plan's approval to today are taken off the term; when a plan was approved, the
      debt is again in active collection and no direct payment was ever made on it, the number of consecutive
      missed installments that cancels a plan is taken off the term; otherwise nothing is taken off.
      The debtor's compensation shortens the term: a debtor whose running Disability Compensation award is
      rated 60 percent or more has the high-rating cut of the policy in months taken off; a debtor whose running
      award is rated 30 to 50 percent has the mid-rating cut of the policy taken off; any other debtor has
      nothing taken off.
      A waiver request awaiting the Committee shortens the term because a grant would lower the balance: when a
      waiver request with a Financial Status Report attached was received on the debt within the last calendar
      month counted back from today, the pending-report cut of the policy in months is taken off; when only a
      waiver request without a report was received in that month, the pending-plain cut of the policy is taken
      off; otherwise nothing is taken off.
      The term is worked out in this order: the longest term, less the months run under a cancelled plan, less
      the compensation cut, less the pending-waiver cut, and never less than one month.
    prerequisite:
      - problem: debt_ext_waiver_request_amount
        kind: value_input
        gate: waiver_fsr_requests
        form: state
        policy_source: >-
          For a debtor who asks for a plan longer than the longest plan approved without a Financial Status Report,
          the number of months on the repayment plan request is fixed only after the debt carries a waiver request,
          received in the last six months, with the debtor's signed Financial Status Report attached.
        condition: >-
          Where the debtor asks for a plan longer than the no-report limit, the debt's requests include a waiver
          request received within the last six calendar months with a Financial Status Report attached; a debtor
          asking for a plan within the no-report limit needs none.
        resolved_by: submit_waiver_request_4f8614a0
        effect: >-
          The waiver request with its report raises the longest term to the term allowed with a Financial Status
          Report and brings in the pending-waiver cut, so the number of months changes.
    cross_category:
      - category: comp
        as: branch
        reads: [variant_name]
        note: The compensation cut tier reads the combined rating of the debtor's running Disability Compensation award.
    compute:
      - balance: "F('current_balance')"
      - waiver_fsr_requests: "COUNT('debt_requests', within_months=6, date_field='received_date', event_type='debt_waiver_requested', fsr_submitted=True)"
      - longest_term: "P('plan_max_months_with_fsr') if (waiver_fsr_requests >= 1 and balance >= K('fsr_balance_min')) else (K('mid_term_months') if (waiver_fsr_requests >= 1 and balance < K('fsr_balance_min')) else P('plan_max_months_without_fsr'))"
      - plan_approvals: "COUNT('debt_requests', event_type='debt_request_decided', request_kind='repayment_plan', decision_outcome='granted')"
      - plan_approved_on: "LATEST('debt_requests','received_date', date_field='received_date', event_type='debt_request_decided', request_kind='repayment_plan', decision_outcome='granted')"
      - direct_payments: "COUNT('debt_transactions', event_type='debt_payment_received')"
      - months_run: "MONTHS(plan_approved_on, NOW) if (plan_approvals >= 1 and F('status') == 'active' and direct_payments >= 1) else (P('missed_installments_default_count') if (plan_approvals >= 1 and F('status') == 'active' and direct_payments < 1) else K('no_cut_months'))"
      - comp_rating: "CPARAM('comp','combined_rating_percent', status='running') or 0"
      - rating_cut: "K('rating_cut_high_months') if comp_rating >= 60 else (K('rating_cut_mid_months') if comp_rating >= 30 else K('no_cut_months'))"
      - pending_fsr_waivers: "COUNT('debt_requests', within_months=1, date_field='received_date', event_type='debt_waiver_requested', fsr_submitted=True)"
      - pending_plain_waivers: "COUNT('debt_requests', within_months=1, date_field='received_date', event_type='debt_waiver_requested', fsr_submitted=False)"
      - pending_cut: "K('pending_cut_fsr_months') if pending_fsr_waivers >= 1 else (K('pending_cut_plain_months') if pending_plain_waivers >= 1 else K('no_cut_months'))"
      - result: "MX(1, longest_term - months_run - rating_cut - pending_cut)"
    compute_basis:
      balance: "the outstanding balance is at least the report-balance threshold of the policy"
      waiver_fsr_requests: "when a waiver request with a Financial Status Report attached was received on the debt in the last six calendar months counted back from today"
      longest_term: "when a waiver request with a Financial Status Report attached was received on the debt in the last six calendar months counted back from today and the outstanding balance is at least the report-balance threshold of the policy, the longest term is the longest plan approved with a Financial Status Report; when such a request was received and the balance is below that threshold, the longest term is the mid-length term of the policy in months; otherwise it is the longest plan approved without a Financial Status Report."
      plan_approvals: "when a plan on the debt was approved"
      plan_approved_on: "the whole calendar months from that plan's approval to today are taken off the term"
      direct_payments: "at least one direct payment was made on it"
      months_run: "when a plan on the debt was approved, the debt is again in active collection and at least one direct payment was made on it, the whole calendar months from that plan's approval to today are taken off the term; when a plan was approved, the debt is again in active collection and no direct payment was ever made on it, the number of consecutive missed installments that cancels a plan is taken off the term; otherwise nothing is taken off."
      comp_rating: "a debtor whose running Disability Compensation award is rated 60 percent or more"
      rating_cut: "a debtor whose running Disability Compensation award is rated 60 percent or more has the high-rating cut of the policy in months taken off; a debtor whose running award is rated 30 to 50 percent has the mid-rating cut of the policy taken off; any other debtor has nothing taken off."
      pending_fsr_waivers: "when a waiver request with a Financial Status Report attached was received on the debt within the last calendar month counted back from today"
      pending_plain_waivers: "when only a waiver request without a report was received in that month"
      pending_cut: "when a waiver request with a Financial Status Report attached was received on the debt within the last calendar month counted back from today, the pending-report cut of the policy in months is taken off; when only a waiver request without a report was received in that month, the pending-plain cut of the policy is taken off; otherwise nothing is taken off."
      result: "the longest term, less the months run under a cancelled plan, less the compensation cut, less the pending-waiver cut, and never less than one month."
    factors:
      - id: longest_term
        effect: parameter
        decides: longest_term
        bindings: [balance, waiver_fsr_requests, longest_term]
        ladder:
          - when: "waiver request with a Financial Status Report received in the last six months AND balance at least the report-balance threshold"
            value: "P('plan_max_months_with_fsr')"
          - when: "waiver request with a Financial Status Report received in the last six months AND balance below the report-balance threshold"
            value: "K('mid_term_months')"
          - when: "otherwise"
            value: "P('plan_max_months_without_fsr')"
        baseline:
          longest_term: "P('plan_max_months_without_fsr')"
        evidence: [history]
        cross_difficulty: null
      - id: months_run
        effect: method
        decides: months_run
        bindings: [plan_approvals, plan_approved_on, direct_payments, months_run]
        ladder:
          - when: "a plan on the debt was approved AND the debt is again in active collection AND at least one direct payment was made"
            method: "the whole calendar months from the plan's approval to today are taken off"
          - when: "a plan on the debt was approved AND the debt is again in active collection AND no direct payment was ever made"
            method: "the consecutive missed installments that cancel a plan are taken off"
          - when: "otherwise"
            method: "nothing is taken off"
        baseline:
          months_run: "K('no_cut_months')"
        evidence: [history, date]
        cross_difficulty: null
      - id: rating_cut
        effect: parameter
        decides: rating_cut
        bindings: [comp_rating, rating_cut]
        ladder:
          - when: "running Disability Compensation award rated 60 percent or more"
            value: "K('rating_cut_high_months')"
          - when: "running Disability Compensation award rated 30 to 50 percent"
            value: "K('rating_cut_mid_months')"
          - when: "otherwise"
            value: "K('no_cut_months')"
        baseline:
          rating_cut: "K('no_cut_months')"
        evidence: [cross_category]
        cross_difficulty: comp
      - id: pending_cut
        effect: parameter
        decides: pending_cut
        bindings: [pending_fsr_waivers, pending_plain_waivers, pending_cut]
        ladder:
          - when: "a waiver request with a Financial Status Report received within the last calendar month"
            value: "K('pending_cut_fsr_months')"
          - when: "only a waiver request without a report received within the last calendar month"
            value: "K('pending_cut_plain_months')"
          - when: "otherwise"
            value: "K('no_cut_months')"
        baseline:
          pending_cut: "K('no_cut_months')"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The number of months on a repayment plan request is the longest plan approved without a Financial Status
        Report, and nothing is taken off it; the result is a whole number of months and never less than one.
      params: [plan_max_months_without_fsr, no_cut_months]
    inputs:
      history:
        - {table: debt_requests, aggregate: count, field: request_id, within_months: 6, filters: {event_type: debt_waiver_requested, fsr_submitted: true}}
        - {table: debt_transactions, aggregate: count, field: debt_txn_id, filters: {event_type: debt_payment_received}}
      cross_category: [comp]

  - id: debt_ext_plan_installment
    base_policy_refs: [debt_evt_repayment_plan]
    overwrite:
      - base_policy: debt_evt_repayment_plan
        superseded_clause: >-
          The installment must be at least repayment_plan_min_installment and at least the balance divided by the
          plan's number of months, rounded up to the cent;
        replaced_by: >-
          The monthly installment of a repayment plan paid by direct payment is the balance to be spread divided by
          the months it is spread over, taken at the standard rate of 100 percent, rounded up to the cent, and never
          less than the smallest plan installment of the debt type.
    trigger: on_request
    subject: [debt_plan_started]
    computes: monthly_amount
    target_tool: start_repayment_plan_5152504c
    params:
      plain_request_reduction_pct: 20
      uplift_pct_high: 110
      uplift_pct_mid: 105
      relief_pct_high: 95
      relief_pct_low: 90
      restart_pct_deposit: 105
      restart_pct_no_deposit: 115
      notice_pct_recent: 98
      notice_pct_year: 99
      standard_pct: 100
      restart_months_off_comp: 1
      restart_months_off_other: 2
    rule: >-
      A repayment plan paid by direct payment starts on the debt with the installment worked out here, and the
      plan's first month is the calendar month after the month in which it starts. A repayment plan's monthly
      installment is not fixed until the debt carries a repayment plan request received on the day the plan
      starts, stating the number of months the plan is to run.
      The monthly installment of a repayment plan paid by direct payment is the balance to be spread divided by
      the months it is spread over, taken at the standard rate of 100 percent, rounded up to the cent, and never
      less than the smallest plan installment of the debt type. The balance to be spread is the debt's
      outstanding balance, and the months it is spread over are the months stated on the latest repayment plan
      request on the debt.
      The balance to be spread depends on a waiver request awaiting the Committee: when a waiver request with a
      Financial Status Report attached was received on the debt within the last calendar month counted back from
      today and the debt notice is no more than the debt type's waiver window in calendar days old, the balance
      to be spread is the outstanding balance less the amount that waiver request asks VA to waive; when only a
      waiver request without a report was received in that month and the notice is within that window, the
      amount asked is not relied on because the request is incomplete, and the balance to be spread is instead
      the outstanding balance scaled down by the plain-request reduction of the policy as a percentage of that
      balance, rounded to the cent; otherwise it is the outstanding balance.
      The months the balance is spread over depend on how a restarted plan is collected: when a repayment plan
      on the debt was approved before and the debtor holds a running Disability Compensation award, the restart
      months for compensation recipients of the policy are taken off the months on the latest request; when a
      plan was approved before and the debtor holds no running award, the restart months for other debtors of
      the policy are taken off; otherwise the months on the latest request are used as stated.
      The rate depends on the debtor's combined compensation rating: a running Disability Compensation award rated
      70 percent or more puts the installment at the high-rating rate of the policy; a running award rated 30 to
      60 percent puts it at the mid-rating rate of the policy; otherwise the standard rate applies.
      A recent fall in the debtor's compensation lowers the installment: when the monthly compensation payments of
      the last six calendar months counted back from today add up to more than that many months at the award's
      current veteran-alone monthly rate and the award is rated 60 percent or more, the higher relief rate of the
      policy applies; when they add up to more and the award is rated below 60 percent, the lower relief rate of
      the policy applies; otherwise the standard rate applies.
      A restarted plan carries a restart rate: when a plan on the debt was approved before and a direct payment
      posted on the debt within the last calendar month counted back from today, the deposit restart rate of the
      policy applies; when a plan was approved before and no direct payment posted in that month, the no-deposit
      restart rate of the policy applies; otherwise the standard rate applies.
      The age of the debt sets a notice rate: when the notice is no more than the waiver window in calendar days
      old and the debt carries no fraud, misrepresentation or bad faith finding, the recent-notice rate of the
      policy applies; when the notice is older than the waiver window but no more than 365 calendar days old and
      there is no such finding, the one-year rate of the policy applies; otherwise the standard rate applies.
      The installment is worked out in this order: first the balance to be spread is divided by the months it is
      spread over, then that quotient is multiplied in turn by the compensation rate, the relief rate, the restart
      rate and the notice rate, each rate taken as a percentage and all of them acting on that one quotient, then
      the product is rounded up to the cent once, and the rounded figure is raised to the smallest plan installment
      of the debt type if it is lower.
    prerequisite:
      - problem: debt_ext_plan_request_term
        kind: value_input
        gate: months_requested
        form: state
        policy_source: >-
          A repayment plan's monthly installment is not fixed until the debt carries a repayment plan request
          received on the day the plan starts, stating the number of months the plan is to run.
        condition: >-
          The latest repayment plan request on the debt is dated the day the plan starts and states the number of
          months the plan is to run.
        resolved_by: record_repayment_plan_request_018c5870
        effect: >-
          The months the balance is spread over are read from that request; without it the months of an older,
          cancelled plan's request would be used and the installment would differ.
    cross_category:
      - category: comp
        as: history
        reads: [status, variant_name, comp_payments.gross_amount]
        note: The restart months and the compensation rate read the debtor's running Disability Compensation award; the relief rate aggregates its monthly payments of the last six months.
    compute:
      - balance: "F('current_balance')"
      - months_requested: "LATEST('debt_requests','requested_term_months', date_field='received_date', event_type='debt_repayment_plan_requested', request_kind='repayment_plan')"
      - days_since_notice: "DAYS(F('notice_date'), NOW)"
      - waiver_amount_asked: "LATEST('debt_requests','requested_amount', date_field='received_date', event_type='debt_waiver_requested')"
      - recent_fsr_waivers: "COUNT('debt_requests', within_months=1, date_field='received_date', event_type='debt_waiver_requested', fsr_submitted=True)"
      - recent_plain_waivers: "COUNT('debt_requests', within_months=1, date_field='received_date', event_type='debt_waiver_requested', fsr_submitted=False)"
      - spread_balance: "balance - waiver_amount_asked if (recent_fsr_waivers >= 1 and days_since_notice <= P('waiver_request_window_days')) else (RND(balance * (100 - K('plain_request_reduction_pct')) / 100, 2) if (recent_plain_waivers >= 1 and days_since_notice <= P('waiver_request_window_days')) else balance)"
      - plan_approvals: "COUNT('debt_requests', event_type='debt_request_decided', request_kind='repayment_plan', decision_outcome='granted')"
      - comp_status: "CFIELD('comp','status')"
      - spread_months: "months_requested - K('restart_months_off_comp') if (plan_approvals >= 1 and comp_status == 'running') else (months_requested - K('restart_months_off_other') if (plan_approvals >= 1 and comp_status != 'running') else months_requested)"
      - comp_rating: "CPARAM('comp','combined_rating_percent', status='running') or 0"
      - uplift_pct: "K('uplift_pct_high') if comp_rating >= 70 else (K('uplift_pct_mid') if comp_rating >= 30 else K('standard_pct'))"
      - comp_rate_now: "CPARAM('comp','monthly_rate_veteran_alone', status='running') or 0"
      - comp_recent_gross: "XSUM('comp','comp_payments','gross_amount', within_months=6, date_field='payment_date', event_type='comp_monthly_payment')"
      - comp_recent_count: "XCOUNT('comp','comp_payments', within_months=6, date_field='payment_date', event_type='comp_monthly_payment')"
      - relief_pct: "K('relief_pct_high') if (comp_recent_gross > comp_recent_count * comp_rate_now and comp_rating >= 60) else (K('relief_pct_low') if (comp_recent_gross > comp_recent_count * comp_rate_now and comp_rating < 60) else K('standard_pct'))"
      - recent_direct_payments: "COUNT('debt_transactions', within_months=1, date_field='transaction_date', event_type='debt_payment_received')"
      - restart_pct: "K('restart_pct_deposit') if (plan_approvals >= 1 and recent_direct_payments >= 1) else (K('restart_pct_no_deposit') if (plan_approvals >= 1 and recent_direct_payments < 1) else K('standard_pct'))"
      - notice_pct: "K('notice_pct_recent') if (days_since_notice <= P('waiver_request_window_days') and not F('fraud_finding')) else (K('notice_pct_year') if (days_since_notice > P('waiver_request_window_days') and days_since_notice <= 365 and not F('fraud_finding')) else K('standard_pct'))"
      - result: "MX(P('repayment_plan_min_installment'), -((-(spread_balance / spread_months * uplift_pct / 100 * relief_pct / 100 * restart_pct / 100 * notice_pct / 100) * 100) // 1) / 100)"
    compute_basis:
      balance: "The balance to be spread is the debt's outstanding balance"
      months_requested: "the months it is spread over are the months stated on the latest repayment plan request on the debt."
      days_since_notice: "the debt notice is no more than the debt type's waiver window in calendar days old"
      waiver_amount_asked: "the outstanding balance less the amount that waiver request asks VA to waive"
      recent_fsr_waivers: "when a waiver request with a Financial Status Report attached was received on the debt within the last calendar month counted back from today"
      recent_plain_waivers: "when only a waiver request without a report was received in that month"
      spread_balance: "when a waiver request with a Financial Status Report attached was received on the debt within the last calendar month counted back from today and the debt notice is no more than the debt type's waiver window in calendar days old, the balance to be spread is the outstanding balance less the amount that waiver request asks VA to waive; when only a waiver request without a report was received in that month and the notice is within that window, the amount asked is not relied on because the request is incomplete, and the balance to be spread is instead the outstanding balance scaled down by the plain-request reduction of the policy as a percentage of that balance, rounded to the cent; otherwise it is the outstanding balance."
      plan_approvals: "when a repayment plan on the debt was approved before"
      comp_status: "the debtor holds a running Disability Compensation award"
      spread_months: "when a repayment plan on the debt was approved before and the debtor holds a running Disability Compensation award, the restart months for compensation recipients of the policy are taken off the months on the latest request; when a plan was approved before and the debtor holds no running award, the restart months for other debtors of the policy are taken off; otherwise the months on the latest request are used as stated."
      comp_rating: "a running Disability Compensation award rated 70 percent or more"
      uplift_pct: "a running Disability Compensation award rated 70 percent or more puts the installment at the high-rating rate of the policy; a running award rated 30 to 60 percent puts it at the mid-rating rate of the policy; otherwise the standard rate applies."
      comp_rate_now: "that many months at the award's current veteran-alone monthly rate"
      comp_recent_gross: "the monthly compensation payments of the last six calendar months counted back from today add up to more than"
      comp_recent_count: "that many months"
      relief_pct: "when the monthly compensation payments of the last six calendar months counted back from today add up to more than that many months at the award's current veteran-alone monthly rate and the award is rated 60 percent or more, the higher relief rate of the policy applies; when they add up to more and the award is rated below 60 percent, the lower relief rate of the policy applies; otherwise the standard rate applies."
      recent_direct_payments: "a direct payment posted on the debt within the last calendar month counted back from today"
      restart_pct: "when a plan on the debt was approved before and a direct payment posted on the debt within the last calendar month counted back from today, the deposit restart rate of the policy applies; when a plan was approved before and no direct payment posted in that month, the no-deposit restart rate of the policy applies; otherwise the standard rate applies."
      notice_pct: "when the notice is no more than the waiver window in calendar days old and the debt carries no fraud, misrepresentation or bad faith finding, the recent-notice rate of the policy applies; when the notice is older than the waiver window but no more than 365 calendar days old and there is no such finding, the one-year rate of the policy applies; otherwise the standard rate applies."
      result: "first the balance to be spread is divided by the months it is spread over, then that quotient is multiplied in turn by the compensation rate, the relief rate, the restart rate and the notice rate, each rate taken as a percentage and all of them acting on that one quotient, then the product is rounded up to the cent once, and the rounded figure is raised to the smallest plan installment of the debt type if it is lower."
    factors:
      - id: spread_balance
        effect: method
        decides: spread_balance
        bindings: [waiver_amount_asked, recent_fsr_waivers, recent_plain_waivers, spread_balance]
        ladder:
          - when: "a waiver request with a Financial Status Report received within the last calendar month AND notice within the waiver window"
            method: "the outstanding balance less the whole amount the waiver request asks VA to waive"
          - when: "only a waiver request without a report received within the last calendar month AND notice within the waiver window"
            method: "the amount asked is not relied on; the outstanding balance is scaled down by K('plain_request_reduction_pct') percent of itself, rounded to the cent"
          - when: "otherwise"
            method: "the outstanding balance"
        baseline:
          spread_balance: "balance"
        evidence: [history, date]
        cross_difficulty: null
      - id: spread_months
        effect: parameter
        decides: spread_months
        bindings: [comp_status, spread_months]
        ladder:
          - when: "a repayment plan on the debt was approved before AND a running Disability Compensation award"
            value: "K('restart_months_off_comp') month(s) taken off the months on the latest request"
          - when: "a repayment plan on the debt was approved before AND no running Disability Compensation award"
            value: "K('restart_months_off_other') months taken off the months on the latest request"
          - when: "otherwise"
            value: "no months taken off (the months on the latest request as stated)"
        baseline:
          spread_months: "months_requested"
        evidence: [cross_category, history]
        cross_difficulty: comp
      - id: uplift_pct
        effect: parameter
        decides: uplift_pct
        bindings: [comp_rating, uplift_pct]
        ladder:
          - when: "running Disability Compensation award rated 70 percent or more"
            value: "K('uplift_pct_high')"
          - when: "running Disability Compensation award rated 30 to 60 percent"
            value: "K('uplift_pct_mid')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          uplift_pct: "K('standard_pct')"
        evidence: [cross_category]
        cross_difficulty: comp
      - id: relief_pct
        effect: parameter
        decides: relief_pct
        bindings: [comp_rate_now, comp_recent_gross, comp_recent_count, relief_pct]
        ladder:
          - when: "compensation payments of the last six months above that many months at the current rate AND award rated 60 percent or more"
            value: "K('relief_pct_high')"
          - when: "compensation payments of the last six months above that many months at the current rate AND award rated below 60 percent"
            value: "K('relief_pct_low')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          relief_pct: "K('standard_pct')"
        evidence: [cross_category, history]
        cross_difficulty: comp
      - id: restart_pct
        effect: parameter
        decides: restart_pct
        bindings: [plan_approvals, recent_direct_payments, restart_pct]
        ladder:
          - when: "a repayment plan on the debt was approved before AND a direct payment posted within the last calendar month"
            value: "K('restart_pct_deposit')"
          - when: "a repayment plan on the debt was approved before AND no direct payment posted within the last calendar month"
            value: "K('restart_pct_no_deposit')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          restart_pct: "K('standard_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: notice_pct
        effect: parameter
        decides: notice_pct
        bindings: [days_since_notice, notice_pct]
        ladder:
          - when: "notice within the waiver window AND no fraud, misrepresentation or bad faith finding"
            value: "K('notice_pct_recent')"
          - when: "notice older than the waiver window but no more than 365 days AND no such finding"
            value: "K('notice_pct_year')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          notice_pct: "K('standard_pct')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The monthly installment of a repayment plan paid by direct payment is the balance to be spread divided by
        the months it is spread over, taken at the standard rate of 100 percent, rounded up to the cent, and never
        less than the smallest plan installment of the debt type. The balance to be spread is the debt's
        outstanding balance, and the months it is spread over are the months stated on the latest repayment plan
        request on the debt.
      params: [repayment_plan_min_installment, standard_pct]
    inputs:
      history:
        - {table: debt_requests, aggregate: latest, field: requested_term_months, filters: {event_type: debt_repayment_plan_requested, request_kind: repayment_plan}}
        - {table: debt_transactions, aggregate: count, field: debt_txn_id, within_months: 1, filters: {event_type: debt_payment_received}}
        - {category: comp, table: comp_payments, aggregate: sum, field: gross_amount, within_months: 6, filters: {event_type: comp_monthly_payment}}
      cross_category: [comp]

  - id: debt_ext_reduced_withholding_proposal
    base_policy_refs: [debt_evt_repayment_plan]
    overwrite: []
    trigger: on_request
    subject: [debt_repayment_plan_requested]
    computes: requested_amount
    target_tool: record_reduced_withholding_request_043db99b
    params:
      report_share_pct: 10
      no_report_share_pct: 25
      care_pct_aid_attendance: 70
      care_pct_housebound: 80
      offset_pct_long: 90
      offset_pct_short: 95
      denial_pct_report: 85
      denial_pct_plain: 95
      standard_pct: 100
    rule: >-
      A reduced-withholding request records the monthly withholding proposed for the debtor's benefit payments.
      The monthly withholding proposed on a reduced-withholding request is the debt's outstanding balance spread
      over the longest plan approved with a Financial Status Report, at the standard rate of 100 percent, rounded
      up to the cent, and never below the smallest reduced withholding of the debt type.
      The figure the proposal starts from depends on the pension and the report: when the debtor holds a running
      Veterans Pension award paid monthly and a request carrying a Financial Status Report was received on the
      debt in the last six calendar months counted back from today, the proposal starts from the report share of
      the policy of the latest monthly pension payment's gross amount; when the debtor holds such a pension award
      and no request with a report was received in that period, it starts from the no-report share of the policy
      of that payment; otherwise it starts from the outstanding balance spread over the longest plan approved
      with a Financial Status Report.
      The pension's care level sets a care rate: a running pension at the Aid and Attendance rate takes the
      aid-and-attendance rate of the policy; a running pension at the Housebound rate takes the housebound rate
      of the policy; any other debtor takes the standard rate.
      The withholding already suffered sets an offset rate: when four or more benefit offsets posted on the debt
      in the last six calendar months counted back from today, the long-offset rate of the policy applies; when
      one to three did, the short-offset rate of the policy applies; otherwise the standard rate applies.
      A waiver already refused sets a denial rate: when a waiver decision of denied was recorded on the debt in
      the last six calendar months and a request with a Financial Status Report was received in that period, the
      denial-with-report rate of the policy applies; when a waiver was denied in that period and no such report
      was received, the plain denial rate of the policy applies; otherwise the standard rate applies.
      The proposal is worked out in this order: the starting figure is multiplied in turn by the care rate, the
      offset rate and the denial rate, each taken as a percentage and all acting on that one figure, the product
      is rounded up to the cent once, and the rounded figure is raised to the smallest reduced withholding of the
      debt type if it is lower.
    prerequisite: []
    cross_category:
      - category: pension
        as: history
        reads: [variant_name, pension_payments.gross_amount]
        note: The starting figure reads the latest monthly pension payment; the care rate reads the pension award's rate category.
    compute:
      - balance: "F('current_balance')"
      - pension_payment: "(XLATEST('pension','pension_payments','gross_amount', date_field='payment_date', event_type='pension_monthly_payment') or 0) if CFIELD('pension','status') == 'running' else 0"
      - report_requests: "COUNT('debt_requests', within_months=6, date_field='received_date', fsr_submitted=True)"
      - starting_figure: "pension_payment * K('report_share_pct') / 100 if (pension_payment > 0 and report_requests >= 1) else (pension_payment * K('no_report_share_pct') / 100 if (pension_payment > 0 and report_requests < 1) else balance / P('plan_max_months_with_fsr'))"
      - pension_category: "CFIELD('pension','variant_name', status='running') or ''"
      - care_pct: "K('care_pct_aid_attendance') if 'Aid and Attendance' in pension_category else (K('care_pct_housebound') if 'Housebound' in pension_category else K('standard_pct'))"
      - offsets_six_months: "COUNT('debt_transactions', within_months=6, date_field='transaction_date', event_type='debt_offset_collected')"
      - offset_pct: "K('offset_pct_long') if offsets_six_months >= 4 else (K('offset_pct_short') if offsets_six_months >= 1 else K('standard_pct'))"
      - denied_waivers: "COUNT('debt_requests', within_months=6, date_field='received_date', event_type='debt_request_decided', request_kind='waiver', decision_outcome='denied')"
      - denial_pct: "K('denial_pct_report') if (denied_waivers >= 1 and report_requests >= 1) else (K('denial_pct_plain') if (denied_waivers >= 1 and report_requests < 1) else K('standard_pct'))"
      - result: "MX(P('reduced_withholding_min_monthly'), -((-(starting_figure * care_pct / 100 * offset_pct / 100 * denial_pct / 100) * 100) // 1) / 100)"
    compute_basis:
      balance: "the debt's outstanding balance spread over the longest plan approved with a Financial Status Report"
      pension_payment: "when the debtor holds a running Veterans Pension award paid monthly and a request carrying a Financial Status Report was received on the debt in the last six calendar months counted back from today, the proposal starts from the report share of the policy of the latest monthly pension payment's gross amount"
      report_requests: "a request carrying a Financial Status Report was received on the debt in the last six calendar months counted back from today"
      starting_figure: "when the debtor holds a running Veterans Pension award paid monthly and a request carrying a Financial Status Report was received on the debt in the last six calendar months counted back from today, the proposal starts from the report share of the policy of the latest monthly pension payment's gross amount; when the debtor holds such a pension award and no request with a report was received in that period, it starts from the no-report share of the policy of that payment; otherwise it starts from the outstanding balance spread over the longest plan approved with a Financial Status Report."
      pension_category: "a running pension at the Aid and Attendance rate"
      care_pct: "a running pension at the Aid and Attendance rate takes the aid-and-attendance rate of the policy; a running pension at the Housebound rate takes the housebound rate of the policy; any other debtor takes the standard rate."
      offsets_six_months: "when four or more benefit offsets posted on the debt in the last six calendar months counted back from today"
      offset_pct: "when four or more benefit offsets posted on the debt in the last six calendar months counted back from today, the long-offset rate of the policy applies; when one to three did, the short-offset rate of the policy applies; otherwise the standard rate applies."
      denied_waivers: "when a waiver decision of denied was recorded on the debt in the last six calendar months"
      denial_pct: "when a waiver decision of denied was recorded on the debt in the last six calendar months and a request with a Financial Status Report was received in that period, the denial-with-report rate of the policy applies; when a waiver was denied in that period and no such report was received, the plain denial rate of the policy applies; otherwise the standard rate applies."
      result: "the starting figure is multiplied in turn by the care rate, the offset rate and the denial rate, each taken as a percentage and all acting on that one figure, the product is rounded up to the cent once, and the rounded figure is raised to the smallest reduced withholding of the debt type if it is lower."
    factors:
      - id: starting_figure
        effect: method
        decides: starting_figure
        bindings: [pension_payment, report_requests, starting_figure]
        ladder:
          - when: "running Veterans Pension paid monthly AND a request with a Financial Status Report in the last six months"
            method: "K('report_share_pct') percent of the latest monthly pension payment's gross amount"
          - when: "running Veterans Pension paid monthly AND no request with a report in the last six months"
            method: "K('no_report_share_pct') percent of the latest monthly pension payment's gross amount"
          - when: "otherwise"
            method: "the outstanding balance spread over the longest plan approved with a Financial Status Report"
        baseline:
          starting_figure: "balance / P('plan_max_months_with_fsr')"
        evidence: [cross_category, history]
        cross_difficulty: pension
      - id: care_pct
        effect: parameter
        decides: care_pct
        bindings: [pension_category, care_pct]
        ladder:
          - when: "running pension at the Aid and Attendance rate"
            value: "K('care_pct_aid_attendance')"
          - when: "running pension at the Housebound rate"
            value: "K('care_pct_housebound')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          care_pct: "K('standard_pct')"
        evidence: [cross_category]
        cross_difficulty: pension
      - id: offset_pct
        effect: parameter
        decides: offset_pct
        bindings: [offsets_six_months, offset_pct]
        ladder:
          - when: "four or more benefit offsets in the last six months"
            value: "K('offset_pct_long')"
          - when: "one to three benefit offsets in the last six months"
            value: "K('offset_pct_short')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          offset_pct: "K('standard_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: denial_pct
        effect: parameter
        decides: denial_pct
        bindings: [denied_waivers, denial_pct]
        ladder:
          - when: "a waiver denied in the last six months AND a request with a Financial Status Report in that period"
            value: "K('denial_pct_report')"
          - when: "a waiver denied in the last six months AND no request with a report in that period"
            value: "K('denial_pct_plain')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          denial_pct: "K('standard_pct')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The monthly withholding proposed on a reduced-withholding request is the debt's outstanding balance spread
        over the longest plan approved with a Financial Status Report, at the standard rate of 100 percent, rounded
        up to the cent, and never below the smallest reduced withholding of the debt type.
      params: [plan_max_months_with_fsr, reduced_withholding_min_monthly, standard_pct]
    inputs:
      history:
        - {table: debt_transactions, aggregate: count, field: debt_txn_id, within_months: 6, filters: {event_type: debt_offset_collected}}
        - {table: debt_requests, aggregate: count, field: request_id, within_months: 6, filters: {event_type: debt_request_decided, request_kind: waiver, decision_outcome: denied}}
        - {category: pension, table: pension_payments, aggregate: latest, field: gross_amount, filters: {event_type: pension_monthly_payment}}
      cross_category: [pension]

  - id: debt_ext_reduced_withholding_amount
    base_policy_refs: [debt_evt_repayment_plan]
    overwrite: []
    trigger: on_request
    subject: [debt_plan_started]
    computes: monthly_amount
    target_tool: start_reduced_withholding_20dc00ef
    params:
      full_take_share_pct: 75
      assets_low_max: 25000.0
      assets_mid_max: 75000.0
      assets_pct_low: 90
      assets_pct_mid: 95
      income_low_max: 10000.0
      income_mid_max: 20000.0
      income_pct_low: 92
      income_pct_mid: 96
      collected_share_min_pct: 40
      history_pct_heavy: 95
      history_pct_light: 98
      standard_pct: 100
    rule: >-
      Reduced withholding starts on the debt with the monthly amount worked out here, and its first month is the
      calendar month after the month in which it starts. Reduced withholding does not start on a debt until the
      debt carries a reduced-withholding request received on the day it starts.
      The approved monthly withholding is the withholding proposed on the latest reduced-withholding request on
      the debt, at the standard rate of 100 percent, rounded up to the cent, and never below the smallest reduced
      withholding of the debt type.
      How the approved figure is taken from the proposal depends on the withholding the debtor has already borne:
      when three or more monthly Veterans Pension payments were issued in the last three calendar months counted
      back from today, every one of them was withheld in full, and a request carrying a Financial Status Report
      was received on the debt in the last six calendar months, the approved figure is the full-withholding share
      of the policy of the proposal, rounded up to the cent; when pension payments in those three months were
      withheld in part but not in full and such a report was received, the approved figure is the proposal less
      the smallest reduced withholding of the debt type; otherwise the approved figure is the proposal as made.
      The debtor's assets set an asset rate: a debtor with a running Veterans Pension award whose recorded net
      worth is below the low-asset limit of the policy takes the low-asset rate of the policy; one whose net worth
      is at least that limit but below the mid-asset limit of the policy takes the mid-asset rate of the policy;
      any other debtor takes the standard rate.
      The debtor's income sets an income rate: a debtor with a running Veterans Pension award whose annual
      countable income is no more than the low-income limit of the policy takes the low-income rate of the
      policy; one whose countable income is above that limit but no more than the mid-income limit of the policy
      takes the mid-income rate of the policy; any other debtor takes the standard rate.
      The collection history sets a history rate: when a waiver was denied on the debt in the last six calendar
      months and the benefit offsets posted on the debt add up to at least the collected-share percentage of the
      policy of the original amount, the heavy-collection rate of the policy applies; when a waiver was denied in
      that period and the offsets add up to less, the light-collection rate of the policy applies; otherwise the
      standard rate applies.
      The approved withholding is worked out in this order: the approved figure is multiplied in turn by the asset
      rate, the income rate and the history rate, each taken as a percentage and all acting on that one figure,
      the product is rounded up to the cent once, and the rounded figure is raised to the smallest reduced
      withholding of the debt type if it is lower.
    prerequisite:
      - problem: debt_ext_reduced_withholding_proposal
        kind: value_input
        gate: proposal
        form: state
        policy_source: >-
          Reduced withholding does not start on a debt until the debt carries a reduced-withholding request received
          on the day it starts.
        condition: >-
          The latest reduced-withholding request on the debt is dated the day the withholding starts and states the
          monthly withholding proposed.
        resolved_by: record_reduced_withholding_request_043db99b
        effect: >-
          The approved figure is taken from the proposal on that request; without it there is no proposal and the
          approved withholding falls to the smallest reduced withholding of the debt type.
    cross_category:
      - category: pension
        as: history
        reads: [status, net_worth, annual_countable_income, pension_payments.gross_amount, pension_payments.offset_withheld_amount]
        note: The approved-figure method reads three months of pension payments and their withholding; the asset and income rates read the pension award's net worth and countable income.
    compute:
      - proposal: "LATEST('debt_requests','requested_amount', date_field='received_date', event_type='debt_repayment_plan_requested', request_kind='reduced_withholding') or 0"
      - report_requests: "COUNT('debt_requests', within_months=6, date_field='received_date', fsr_submitted=True)"
      - pension_paid_3m: "XCOUNT('pension','pension_payments', within_months=3, date_field='payment_date', event_type='pension_monthly_payment')"
      - pension_gross_3m: "XSUM('pension','pension_payments','gross_amount', within_months=3, date_field='payment_date', event_type='pension_monthly_payment')"
      - pension_withheld_3m: "XSUM('pension','pension_payments','offset_withheld_amount', within_months=3, date_field='payment_date', event_type='pension_monthly_payment')"
      - approved_figure: "-((-(proposal * K('full_take_share_pct') / 100) * 100) // 1) / 100 if (pension_paid_3m >= 3 and pension_withheld_3m >= pension_gross_3m and report_requests >= 1) else (proposal - P('reduced_withholding_min_monthly') if (pension_withheld_3m > 0 and pension_withheld_3m < pension_gross_3m and report_requests >= 1) else proposal)"
      - pension_status: "CFIELD('pension','status')"
      - net_worth: "CFIELD('pension','net_worth') or 0"
      - assets_pct: "K('assets_pct_low') if (pension_status == 'running' and net_worth < K('assets_low_max')) else (K('assets_pct_mid') if (pension_status == 'running' and net_worth >= K('assets_low_max') and net_worth < K('assets_mid_max')) else K('standard_pct'))"
      - countable_income: "CFIELD('pension','annual_countable_income') or 0"
      - income_pct: "K('income_pct_low') if (pension_status == 'running' and countable_income <= K('income_low_max')) else (K('income_pct_mid') if (pension_status == 'running' and countable_income > K('income_low_max') and countable_income <= K('income_mid_max')) else K('standard_pct'))"
      - waiver_denials: "COUNT('debt_requests', within_months=6, date_field='received_date', event_type='debt_request_decided', request_kind='waiver', decision_outcome='denied')"
      - offsets_total: "SUM('debt_transactions','amount', event_type='debt_offset_collected')"
      - history_pct: "K('history_pct_heavy') if (waiver_denials >= 1 and offsets_total >= F('original_amount') * K('collected_share_min_pct') / 100) else (K('history_pct_light') if (waiver_denials >= 1 and offsets_total < F('original_amount') * K('collected_share_min_pct') / 100) else K('standard_pct'))"
      - result: "MX(P('reduced_withholding_min_monthly'), -((-(approved_figure * assets_pct / 100 * income_pct / 100 * history_pct / 100) * 100) // 1) / 100)"
    compute_basis:
      proposal: "the withholding proposed on the latest reduced-withholding request on the debt"
      report_requests: "a request carrying a Financial Status Report was received on the debt in the last six calendar months"
      pension_paid_3m: "when three or more monthly Veterans Pension payments were issued in the last three calendar months counted back from today"
      pension_gross_3m: "every one of them was withheld in full"
      pension_withheld_3m: "every one of them was withheld in full"
      approved_figure: "when three or more monthly Veterans Pension payments were issued in the last three calendar months counted back from today, every one of them was withheld in full, and a request carrying a Financial Status Report was received on the debt in the last six calendar months, the approved figure is the full-withholding share of the policy of the proposal, rounded up to the cent; when pension payments in those three months were withheld in part but not in full and such a report was received, the approved figure is the proposal less the smallest reduced withholding of the debt type; otherwise the approved figure is the proposal as made."
      pension_status: "a debtor with a running Veterans Pension award"
      net_worth: "whose recorded net worth is below the low-asset limit of the policy"
      assets_pct: "a debtor with a running Veterans Pension award whose recorded net worth is below the low-asset limit of the policy takes the low-asset rate of the policy; one whose net worth is at least that limit but below the mid-asset limit of the policy takes the mid-asset rate of the policy; any other debtor takes the standard rate."
      countable_income: "whose annual countable income is no more than the low-income limit of the policy"
      income_pct: "a debtor with a running Veterans Pension award whose annual countable income is no more than the low-income limit of the policy takes the low-income rate of the policy; one whose countable income is above that limit but no more than the mid-income limit of the policy takes the mid-income rate of the policy; any other debtor takes the standard rate."
      waiver_denials: "when a waiver was denied on the debt in the last six calendar months"
      offsets_total: "the benefit offsets posted on the debt add up to at least the collected-share percentage of the policy of the original amount"
      history_pct: "when a waiver was denied on the debt in the last six calendar months and the benefit offsets posted on the debt add up to at least the collected-share percentage of the policy of the original amount, the heavy-collection rate of the policy applies; when a waiver was denied in that period and the offsets add up to less, the light-collection rate of the policy applies; otherwise the standard rate applies."
      result: "the approved figure is multiplied in turn by the asset rate, the income rate and the history rate, each taken as a percentage and all acting on that one figure, the product is rounded up to the cent once, and the rounded figure is raised to the smallest reduced withholding of the debt type if it is lower."
    factors:
      - id: approved_figure
        effect: method
        decides: approved_figure
        bindings: [report_requests, pension_paid_3m, pension_gross_3m, pension_withheld_3m, approved_figure]
        ladder:
          - when: "three or more monthly pension payments in the last three months, all withheld in full, AND a request with a Financial Status Report in the last six months"
            method: "K('full_take_share_pct') percent of the proposal, rounded up to the cent"
          - when: "pension payments in the last three months withheld in part but not in full AND a request with a report in the last six months"
            method: "the proposal less the smallest reduced withholding of the debt type"
          - when: "otherwise"
            method: "the proposal as made"
        baseline:
          approved_figure: "proposal"
        evidence: [cross_category, history]
        cross_difficulty: pension
      - id: assets_pct
        effect: parameter
        decides: assets_pct
        bindings: [pension_status, net_worth, assets_pct]
        ladder:
          - when: "running pension AND net worth below the low-asset limit"
            value: "K('assets_pct_low')"
          - when: "running pension AND net worth from the low-asset limit up to below the mid-asset limit"
            value: "K('assets_pct_mid')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          assets_pct: "K('standard_pct')"
        evidence: [cross_category]
        cross_difficulty: pension
      - id: income_pct
        effect: parameter
        decides: income_pct
        bindings: [countable_income, income_pct]
        ladder:
          - when: "running pension AND countable income no more than the low-income limit"
            value: "K('income_pct_low')"
          - when: "running pension AND countable income above the low-income limit and no more than the mid-income limit"
            value: "K('income_pct_mid')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          income_pct: "K('standard_pct')"
        evidence: [cross_category]
        cross_difficulty: pension
      - id: history_pct
        effect: parameter
        decides: history_pct
        bindings: [waiver_denials, offsets_total, history_pct]
        ladder:
          - when: "a waiver denied in the last six months AND offsets at least the collected-share percentage of the original amount"
            value: "K('history_pct_heavy')"
          - when: "a waiver denied in the last six months AND offsets below that share"
            value: "K('history_pct_light')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          history_pct: "K('standard_pct')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The approved monthly withholding is the withholding proposed on the latest reduced-withholding request on
        the debt, at the standard rate of 100 percent, rounded up to the cent, and never below the smallest reduced
        withholding of the debt type.
      params: [reduced_withholding_min_monthly, standard_pct]
    inputs:
      history:
        - {table: debt_requests, aggregate: latest, field: requested_amount, filters: {event_type: debt_repayment_plan_requested, request_kind: reduced_withholding}}
        - {table: debt_transactions, aggregate: sum, field: amount, filters: {event_type: debt_offset_collected}}
        - {category: pension, table: pension_payments, aggregate: sum, field: offset_withheld_amount, within_months: 3, filters: {event_type: pension_monthly_payment}}
      cross_category: [pension]

  - id: debt_ext_compromise_offer_amount
    base_policy_refs: [debt_evt_compromise, debt_excl_single_pending_request]
    overwrite:
      - base_policy: debt_evt_compromise
        superseded_clause: >-
          A debtor may offer a lump sum smaller than the balance to settle a debt.
        replaced_by: >-
          For a debtor whose VA benefit payments are being withheld for the debt, the lump sum a compromise offer
          puts forward is worked out only after the debt carries an approved reduced monthly withholding from the
          debtor's benefit payments.
    trigger: on_request
    subject: [debt_compromise_offered]
    computes: requested_amount
    target_tool: submit_compromise_offer_8c2d0269
    params:
      assets_limit: 25000.0
      care_level_months: 36
      basic_pension_months: 48
      discount_balance_min: 5000.0
      pv_rate_monthly_pct: 0.5
      simple_discount_pct: 15
      cost_pct_offset: 2
      cost_pct_billed: 10
      cost_pct_standard: 5
      hardship_pct_report: 90
      hardship_pct_plain: 95
      rate_cut_pct_overpaid: 85
      rate_cut_pct_plain: 95
      notice_pct_year: 97
      notice_pct_old: 94
      standard_pct: 100
    rule: >-
      A compromise offer is signed by the debtor, goes in with the debtor's Financial Status Report attached, and
      puts forward the lump sum VA measures against what it can recover from the debtor over time. A debtor whose
      debt is not being collected by withholding from VA benefit payments is not held to the reduced-withholding
      step below; every other condition on taking an offer still applies to that debtor. For a debtor whose VA benefit payments are being withheld for the debt, the lump sum a compromise offer
      puts forward is worked out only after the debt carries an approved reduced monthly withholding from the
      debtor's benefit payments.
      The lump sum a compromise offer puts forward is the monthly amount VA recovers on the debt multiplied by the
      longest plan approved with a Financial Status Report, less the standard cost of collection of the policy as
      a percentage, taken at the standard rate of 100 percent, never more than the outstanding balance, and
      rounded to the cent. The monthly amount VA recovers is the approved reduced withholding or plan installment
      recorded on the debt, or, where none is recorded, the smallest plan installment of the debt type.
      The months of recovery depend on the pension and the assets: a debtor with a running Veterans Pension award
      at the Housebound or Aid and Attendance rate whose recorded net worth is below the asset limit of the policy
      is measured over the care-level months of the policy; a debtor with a running Veterans Pension award at the
      basic rate whose net worth is below that limit is measured over the basic-pension months of the policy; any
      other debtor is measured over the longest plan approved with a Financial Status Report.
      How the recovery is valued depends on how it would be collected and on the balance: when an approved reduced
      withholding from benefit payments is recorded on the debt and the outstanding balance, that is the original
      amount less the benefit offsets and direct payments posted on the debt, is at least the discounting
      threshold of the policy, the recovery is the present value of the monthly amount paid over the months of
      recovery, discounted at the monthly rate of the policy, that is the monthly amount times one less
      one-plus-the-rate raised to minus the months, divided by the rate; when a repayment plan paid by direct
      payment is recorded on the debt and that balance is at least the discounting threshold, the recovery is the
      monthly amount times the months less the direct-plan discount of the policy as a percentage, because the
      debtor can stop paying; otherwise the recovery is the monthly amount times the months, undiscounted.
      VA's cost of collecting sets the cost deduction: when a benefit offset posted on the debt in each of the
      last three calendar months counted back from today (three or more offsets in that period), the
      offset-collection cost of the policy is deducted; when no offset posted on the debt in that period, the
      billing cost of the policy is deducted; otherwise (one or two offsets in that period) the standard cost of
      collection of the policy is deducted.
      Documented hardship sets a hardship rate: when a waiver was denied on the debt in the last six calendar
      months and a request with a Financial Status Report was received in that period, the hardship-with-report
      rate of the policy applies; when a waiver was denied in that period without such a report, the plain
      hardship rate of the policy applies; otherwise the standard rate applies.
      A recent pension rate cut sets a rate-cut rate: when the debtor's pension rate was adjusted in the last
      twelve calendar months by an adjustment that created an overpayment, the overpaid rate-cut rate of the
      policy applies; when it was adjusted in that period without creating an overpayment, the plain rate-cut
      rate of the policy applies; otherwise the standard rate applies.
      The age of the debt sets a notice rate: when the notice is older than the collection-hold window but no more
      than 365 calendar days old and the debt carries no fraud, misrepresentation or bad faith finding, the
      one-year notice rate of the policy applies; when the notice is more than 365 calendar days old and there is
      no such finding, the older notice rate of the policy applies; otherwise the standard rate applies.
      The lump sum is worked out in this order: first the recovery is valued, then the cost deduction is taken off
      it as a percentage of the recovery, then that result is multiplied in turn by the hardship rate, the
      rate-cut rate and the notice rate, each taken as a percentage of that one result, then the figure is
      limited to the outstanding balance, and it is rounded to the cent only at the end.
    prerequisite:
      - problem: debt_ext_reduced_withholding_amount
        kind: value_input
        gate: monthly_withholding
        form: state
        policy_source: >-
          For a debtor whose VA benefit payments are being withheld for the debt, the lump sum a compromise offer
          puts forward is worked out only after the debt carries an approved reduced monthly withholding from the
          debtor's benefit payments.
        condition: >-
          Where benefit offsets are being taken on the debt, the debt is in repayment-plan status with benefit
          withholding as the method and an approved monthly withholding recorded on it; a debt not collected by
          benefit offset needs none.
        resolved_by: start_reduced_withholding_20dc00ef
        effect: >-
          The approved monthly withholding becomes the monthly amount the recovery is valued from and moves the
          recovery to present-value valuation; without it the monthly amount falls to the smallest plan installment,
          valued undiscounted, and the lump sum changes.
    cross_category:
      - category: pension
        as: history
        reads: [status, variant_name, net_worth, pension_income_reports.event_type, pension_income_reports.overpayment_created]
        note: The months of recovery read the pension's rate category and net worth; the rate-cut rate counts the pension rate adjustments of the last twelve months.
    compute:
      - balance: "F('current_balance')"
      - monthly_withholding: "F('repayment_plan_monthly_amount') if (F('repayment_plan_method') != 'none' and F('repayment_plan_monthly_amount') > 0) else P('repayment_plan_min_installment')"
      - pension_status: "CFIELD('pension','status')"
      - pension_category: "CFIELD('pension','variant_name') or ''"
      - pension_net_worth: "CFIELD('pension','net_worth') or 0"
      - recovery_months: "K('care_level_months') if (pension_status == 'running' and ('Housebound' in pension_category or 'Aid and Attendance' in pension_category) and pension_net_worth < K('assets_limit')) else (K('basic_pension_months') if (pension_status == 'running' and 'Basic Rate' in pension_category and pension_net_worth < K('assets_limit')) else P('plan_max_months_with_fsr'))"
      - ledger_balance: "F('original_amount') - SUM('debt_transactions','amount', event_type='debt_offset_collected') - SUM('debt_transactions','amount', event_type='debt_payment_received')"
      - recovery_value: "monthly_withholding * (1 - (1 + K('pv_rate_monthly_pct') / 100) ** (-recovery_months)) / (K('pv_rate_monthly_pct') / 100) if (F('repayment_plan_method') == 'benefit_withholding' and ledger_balance >= K('discount_balance_min')) else (monthly_withholding * recovery_months * (100 - K('simple_discount_pct')) / 100 if (F('repayment_plan_method') == 'direct_payment' and ledger_balance >= K('discount_balance_min')) else monthly_withholding * recovery_months)"
      - offsets_3m: "COUNT('debt_transactions', within_months=3, date_field='transaction_date', event_type='debt_offset_collected')"
      - cost_pct: "K('cost_pct_offset') if offsets_3m >= 3 else (K('cost_pct_billed') if offsets_3m < 1 else K('cost_pct_standard'))"
      - report_requests: "COUNT('debt_requests', within_months=6, date_field='received_date', fsr_submitted=True)"
      - waiver_denials: "COUNT('debt_requests', within_months=6, date_field='received_date', event_type='debt_request_decided', request_kind='waiver', decision_outcome='denied')"
      - hardship_pct: "K('hardship_pct_report') if (waiver_denials >= 1 and report_requests >= 1) else (K('hardship_pct_plain') if (waiver_denials >= 1 and report_requests < 1) else K('standard_pct'))"
      - overpaying_rate_cuts: "XCOUNT('pension','pension_income_reports', within_months=12, date_field='received_date', event_type='pension_rate_adjusted', overpayment_created=True)"
      - plain_rate_cuts: "XCOUNT('pension','pension_income_reports', within_months=12, date_field='received_date', event_type='pension_rate_adjusted', overpayment_created=False)"
      - rate_cut_pct: "K('rate_cut_pct_overpaid') if overpaying_rate_cuts >= 1 else (K('rate_cut_pct_plain') if plain_rate_cuts >= 1 else K('standard_pct'))"
      - days_since_notice: "DAYS(F('notice_date'), NOW)"
      - notice_pct: "K('notice_pct_year') if (days_since_notice > P('collection_hold_window_days') and days_since_notice <= 365 and not F('fraud_finding')) else (K('notice_pct_old') if (days_since_notice > 365 and not F('fraud_finding')) else K('standard_pct'))"
      - result: "RND(MN(balance, recovery_value * (100 - cost_pct) / 100 * hardship_pct / 100 * rate_cut_pct / 100 * notice_pct / 100), 2)"
    compute_basis:
      balance: "never more than the outstanding balance"
      monthly_withholding: "The monthly amount VA recovers is the approved reduced withholding or plan installment recorded on the debt, or, where none is recorded, the smallest plan installment of the debt type."
      pension_status: "a debtor with a running Veterans Pension award"
      pension_category: "at the Housebound or Aid and Attendance rate"
      pension_net_worth: "whose recorded net worth is below the asset limit of the policy"
      recovery_months: "a debtor with a running Veterans Pension award at the Housebound or Aid and Attendance rate whose recorded net worth is below the asset limit of the policy is measured over the care-level months of the policy; a debtor with a running Veterans Pension award at the basic rate whose net worth is below that limit is measured over the basic-pension months of the policy; any other debtor is measured over the longest plan approved with a Financial Status Report."
      recovery_value: "when an approved reduced withholding from benefit payments is recorded on the debt and the outstanding balance, that is the original amount less the benefit offsets and direct payments posted on the debt, is at least the discounting threshold of the policy, the recovery is the present value of the monthly amount paid over the months of recovery, discounted at the monthly rate of the policy, that is the monthly amount times one less one-plus-the-rate raised to minus the months, divided by the rate; when a repayment plan paid by direct payment is recorded on the debt and that balance is at least the discounting threshold, the recovery is the monthly amount times the months less the direct-plan discount of the policy as a percentage, because the debtor can stop paying; otherwise the recovery is the monthly amount times the months, undiscounted."
      ledger_balance: "the outstanding balance, that is the original amount less the benefit offsets and direct payments posted on the debt, is at least the discounting threshold of the policy"
      offsets_3m: "when a benefit offset posted on the debt in each of the last three calendar months counted back from today (three or more offsets in that period)"
      cost_pct: "when a benefit offset posted on the debt in each of the last three calendar months counted back from today (three or more offsets in that period), the offset-collection cost of the policy is deducted; when no offset posted on the debt in that period, the billing cost of the policy is deducted; otherwise (one or two offsets in that period) the standard cost of collection of the policy is deducted."
      report_requests: "a request with a Financial Status Report was received in that period"
      waiver_denials: "when a waiver was denied on the debt in the last six calendar months"
      hardship_pct: "when a waiver was denied on the debt in the last six calendar months and a request with a Financial Status Report was received in that period, the hardship-with-report rate of the policy applies; when a waiver was denied in that period without such a report, the plain hardship rate of the policy applies; otherwise the standard rate applies."
      overpaying_rate_cuts: "when the debtor's pension rate was adjusted in the last twelve calendar months by an adjustment that created an overpayment"
      plain_rate_cuts: "when it was adjusted in that period without creating an overpayment"
      rate_cut_pct: "when the debtor's pension rate was adjusted in the last twelve calendar months by an adjustment that created an overpayment, the overpaid rate-cut rate of the policy applies; when it was adjusted in that period without creating an overpayment, the plain rate-cut rate of the policy applies; otherwise the standard rate applies."
      days_since_notice: "when the notice is older than the collection-hold window but no more than 365 calendar days old"
      notice_pct: "when the notice is older than the collection-hold window but no more than 365 calendar days old and the debt carries no fraud, misrepresentation or bad faith finding, the one-year notice rate of the policy applies; when the notice is more than 365 calendar days old and there is no such finding, the older notice rate of the policy applies; otherwise the standard rate applies."
      result: "first the recovery is valued, then the cost deduction is taken off it as a percentage of the recovery, then that result is multiplied in turn by the hardship rate, the rate-cut rate and the notice rate, each taken as a percentage of that one result, then the figure is limited to the outstanding balance, and it is rounded to the cent only at the end."
    factors:
      - id: recovery_months
        effect: parameter
        decides: recovery_months
        bindings: [pension_status, pension_category, pension_net_worth, recovery_months]
        ladder:
          - when: "running pension at the Housebound or Aid and Attendance rate AND net worth below the asset limit"
            value: "K('care_level_months')"
          - when: "running pension at the basic rate AND net worth below the asset limit"
            value: "K('basic_pension_months')"
          - when: "otherwise"
            value: "P('plan_max_months_with_fsr')"
        baseline:
          recovery_months: "P('plan_max_months_with_fsr')"
        evidence: [cross_category]
        cross_difficulty: pension
      - id: recovery_value
        effect: method
        decides: recovery_value
        bindings: [ledger_balance, recovery_value]
        ladder:
          - when: "an approved reduced withholding from benefit payments on the debt AND balance at least the discounting threshold"
            method: "present value of the monthly amount over the months of recovery at K('pv_rate_monthly_pct') percent a month"
          - when: "a repayment plan paid by direct payment on the debt AND balance at least the discounting threshold"
            method: "monthly amount times the months less K('simple_discount_pct') percent"
          - when: "otherwise"
            method: "monthly amount times the months, undiscounted"
        baseline:
          recovery_value: "monthly_withholding * recovery_months"
        evidence: [history, cross_category]
        cross_difficulty: null
      - id: cost_pct
        effect: parameter
        decides: cost_pct
        bindings: [offsets_3m, cost_pct]
        ladder:
          - when: "three or more benefit offsets in the last three months"
            value: "K('cost_pct_offset')"
          - when: "no benefit offset in the last three months"
            value: "K('cost_pct_billed')"
          - when: "otherwise (one or two offsets in the last three months)"
            value: "K('cost_pct_standard')"
        baseline:
          cost_pct: "K('cost_pct_standard')"
        evidence: [history]
        cross_difficulty: null
      - id: hardship_pct
        effect: parameter
        decides: hardship_pct
        bindings: [report_requests, waiver_denials, hardship_pct]
        ladder:
          - when: "a waiver denied in the last six months AND a request with a Financial Status Report in that period"
            value: "K('hardship_pct_report')"
          - when: "a waiver denied in the last six months AND no request with a report in that period"
            value: "K('hardship_pct_plain')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          hardship_pct: "K('standard_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: rate_cut_pct
        effect: parameter
        decides: rate_cut_pct
        bindings: [overpaying_rate_cuts, plain_rate_cuts, rate_cut_pct]
        ladder:
          - when: "a pension rate adjustment in the last twelve months that created an overpayment"
            value: "K('rate_cut_pct_overpaid')"
          - when: "a pension rate adjustment in the last twelve months that created no overpayment"
            value: "K('rate_cut_pct_plain')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          rate_cut_pct: "K('standard_pct')"
        evidence: [cross_category, history]
        cross_difficulty: pension
      - id: notice_pct
        effect: parameter
        decides: notice_pct
        bindings: [days_since_notice, notice_pct]
        ladder:
          - when: "notice older than the collection-hold window but no more than 365 days AND no fraud finding"
            value: "K('notice_pct_year')"
          - when: "notice more than 365 days old AND no fraud finding"
            value: "K('notice_pct_old')"
          - when: "otherwise"
            value: "K('standard_pct')"
        baseline:
          notice_pct: "K('standard_pct')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The lump sum a compromise offer puts forward is the monthly amount VA recovers on the debt multiplied by the
        longest plan approved with a Financial Status Report, less the standard cost of collection of the policy as
        a percentage, taken at the standard rate of 100 percent, never more than the outstanding balance, and
        rounded to the cent. The monthly amount VA recovers is the approved reduced withholding or plan installment
        recorded on the debt, or, where none is recorded, the smallest plan installment of the debt type.
      params: [plan_max_months_with_fsr, standard_pct, cost_pct_standard, repayment_plan_min_installment]
    inputs:
      history:
        - {table: debt_transactions, aggregate: count, field: debt_txn_id, within_months: 3, filters: {event_type: debt_offset_collected}}
        - {table: debt_requests, aggregate: count, field: request_id, within_months: 6, filters: {event_type: debt_request_decided, request_kind: waiver, decision_outcome: denied}}
        - {category: pension, table: pension_income_reports, aggregate: count, field: report_id, within_months: 12, filters: {event_type: pension_rate_adjusted, overpayment_created: true}}
      cross_category: [pension]
