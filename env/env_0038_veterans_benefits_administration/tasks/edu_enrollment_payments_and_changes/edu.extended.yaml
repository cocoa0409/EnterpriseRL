    tuition_overpayment_debt_type: Post-9/11 GI Bill Tuition and Fees Overpayment
    school_closure_restoration: true
    certification_advance_days: 120
    books_paid_at_term_start: true

events:
  - type: edu_benefit_established
    target: edu_benefits
    mutation: create
    meaning: VA finds the beneficiary eligible under a chapter and issues a Certificate of Eligibility granting entitlement.
    grain: one row per beneficiary per chapter
    fields:
      customer_id: The beneficiary.
      variant_name: Chapter and benefit level granted.
      status: Set to active.
      original_entitlement_days: Entitlement granted.
      entitlement_days_remaining: Equal to the entitlement granted at establishment.
      delimiting_date: Last usable date, or empty when there is no time limit.
      coe_issued_date: Certificate date.
      yellow_ribbon_school_agreement: Whether the current school has a Yellow Ribbon agreement for the program.
      payment_method: Delivery method.
      payment_account_last4: Account last four digits, or empty.
      opened_date: Establishment date.
    account: entitlement_days
    direction: in
    triggers: []

  - type: edu_benefit_exhausted
    target: edu_benefits
    mutation: {transition: {from: active, to: exhausted}}
    meaning: The last day of entitlement has been charged.
    grain: one row per transaction
    fields:
      status: Set to exhausted.
      closed_date: Date entitlement ran out.
    triggers: []

  - type: edu_benefit_reactivated
    target: edu_benefits
    mutation: {transition: {from: exhausted, to: active}}
    meaning: Restored entitlement makes an exhausted benefit usable again.
    grain: one row per transaction
    fields:
      status: Set to active.
      closed_date: Reset to empty.
    triggers: []

  - type: edu_benefit_delimited
    target: edu_benefits
    mutation: {transition: {from: active, to: delimited}}
    meaning: The delimiting date has passed.
    grain: one row per transaction
    fields:
      status: Set to delimited.
      closed_date: The delimiting date.
    triggers: []

  - type: edu_benefit_relinquished
    target: edu_benefits
    mutation: {transition: {from: active, to: relinquished}}
    meaning: The beneficiary irrevocably relinquishes this chapter to elect the Post-9/11 GI Bill.
    grain: one row per transaction
    fields:
      status: Set to relinquished.
      closed_date: Date of the election.
    triggers: []

  - type: edu_benefit_level_changed
    target: edu_benefits
    mutation: update
    meaning: Additional qualifying active service raises the Post-9/11 GI Bill benefit level.
    grain: one row per transaction
    fields:
      variant_name: New benefit level.
    triggers: []

  - type: edu_school_profile_updated
    target: edu_benefits
    mutation: update
    meaning: The Yellow Ribbon status of the student's current school program or the student's payment account changes.
    grain: one row per transaction
    fields:
      yellow_ribbon_school_agreement: Updated Yellow Ribbon status.
      payment_method: Updated delivery method.
      payment_account_last4: Updated account last four digits, or empty.
    triggers: []

  - type: edu_enrollment_certified
    target: edu_enrollments
    meaning: The school certifying official certifies the student's enrollment for a term.
    grain: one row per benefit per school per term
    distinguish_by: [facility_code, term_start_date]
    fields:
      edu_benefit_id: Benefit used.
      customer_id: Student.
      school_name: School.
      facility_code: Facility code.
      term_start_date: Term start.
      term_end_date: Term end.
      credit_hours: Credits certified.
      training_time: Training time.
      rate_of_pursuit_pct: Rate of pursuit.
      online_only: Whether all courses are distance learning.
      tuition_fees_charged: Net tuition and fees.
      mha_bah_rate: Housing allowance rate for the campus ZIP.
    triggers:
      - event: edu:edu_entitlement_charged
        map: {edu_benefit_id: edu_benefit_id, customer_id: customer_id, enrollment_id: enrollment_id, charge_period_start: term_start_date, charge_period_end: term_end_date}

  - type: edu_enrollment_amended
    target: edu_enrollments
    meaning: The school reports a reduction in credits, a withdrawal, or a correction to a certified term.
    grain: one row per amendment of one certification per effective date
    distinguish_by: [source_enrollment_id, amendment_effective_date]
    fields:
      edu_benefit_id: Benefit used.
      customer_id: Student.
      source_enrollment_id: Certification amended.
      school_name: School.
      facility_code: Facility code.
      term_start_date: Term start of the certification amended.
      term_end_date: Term end of the certification amended.
      credit_hours: Credits remaining.
      training_time: Training time after the change.
      rate_of_pursuit_pct: Rate of pursuit after the change.
      tuition_fees_charged: Net tuition and fees after the change.
      amendment_reason: Reason.
      amendment_effective_date: Last date of attendance in the dropped courses.
      mitigating_circumstances: Whether mitigating circumstances were accepted.
      overpayment_created: Whether payments already issued exceed the amended entitlement.
    triggers:
      - event: debt:debt_established
        when: {overpayment_created: true}
        map: {customer_id: customer_id, source_record_id: enrollment_id, source_category: edu}

  - type: edu_enrollment_verified
    target: edu_enrollments
    meaning: The student confirms that their enrollment for a completed month is unchanged.
    grain: one row per certification per month verified
    distinguish_by: [source_enrollment_id, verification_month]
    fields:
      edu_benefit_id: Benefit used.
      customer_id: Student.
      source_enrollment_id: Certification verified.
      verification_month: Month verified.
      verification_channel: Channel used.
    triggers: []

  - type: edu_tuition_payment
    target: edu_payments
    meaning: Post-9/11 GI Bill tuition and fees for a certified term are paid to the school.
    grain: one row per certification
    distinguish_by: [enrollment_id]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification paid.
      payment_month: Month of the term start.
      payment_date: Issue date.
      payee: Always school.
      days_paid: Always 0.
      amount: Amount paid.
    account: edu_benefits_paid
    direction: in
    triggers: []

  - type: edu_housing_payment
    target: edu_payments
    meaning: The Post-9/11 GI Bill monthly housing allowance for a verified month of training is paid to the student.
    grain: one row per certification per month of training
    distinguish_by: [enrollment_id, payment_month]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification.
      payment_month: Month of training.
      payment_date: Issue date.
      payee: Always student.
      days_paid: Days of the month in the term.
      amount: Amount paid.
    account: edu_benefits_paid
    direction: in
    triggers: []

  - type: edu_books_stipend_payment
    target: edu_payments
    meaning: The Post-9/11 GI Bill books and supplies stipend for a certified term is paid to the student.
    grain: one row per certification
    distinguish_by: [enrollment_id]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification.
      payment_month: Month of the term start.
      payment_date: Issue date.
      payee: Always student.
      days_paid: Always 0.
      amount: Amount paid.
    account: edu_benefits_paid
    direction: in
    triggers: []

  - type: edu_monthly_benefit_payment
    target: edu_payments
    meaning: The flat monthly benefit under Chapter 30, 35 or 1606 for a verified month of training is paid to the student.
    grain: one row per certification per month of training
    distinguish_by: [enrollment_id, payment_month]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification.
      payment_month: Month of training.
      payment_date: Issue date.
      payee: Always student.
      days_paid: Days of the month in the term.
      amount: Amount paid.
    account: edu_benefits_paid
    direction: in
    triggers: []

  - type: edu_payment_returned
    target: edu_payments
    meaning: Money paid on the benefit comes back - a school refunding tuition after a withdrawal, or a student payment returned by the bank.
    grain: one row per payment returned
    distinguish_by: [source_payment_id]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification of the payment returned.
      source_payment_id: Payment returned.
      payment_month: Month of the payment returned.
      payment_date: Date funds came back.
      payee: Payee of the payment returned.
      days_paid: Always 0.
      amount: Negative of the amount returned.
      return_reason: Why it came back.
    account: edu_benefits_paid
    direction: out
    triggers: []

  - type: edu_entitlement_charged
    target: edu_entitlement_ledger
    meaning: Entitlement is charged for a certified period of training.
    grain: one row per certification charged
    distinguish_by: [enrollment_id, charge_period_start]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification charged.
      days: Days charged.
      charge_period_start: First day charged.
      charge_period_end: Last day charged.
      restoration_reason: Always not_applicable.
    account: entitlement_days
    direction: out
    triggers: []

  - type: edu_entitlement_restored
    target: edu_entitlement_ledger
    meaning: Entitlement charged for training is given back because the training was cut short by a school closure, a program disapproval, or an amendment.
    grain: one row per certification restored per reason
    distinguish_by: [enrollment_id, restoration_reason]
    fields:
      edu_benefit_id: Benefit.
      customer_id: Student.
      enrollment_id: Certification whose charge is restored.
      days: Days restored.
      charge_period_start: First day restored.
      charge_period_end: Last day restored.
      restoration_reason: Reason.
    account: entitlement_days
    direction: in
    triggers: []

measures:
  - id: edu_msr_unverified_months
    window: Consecutive completed months of the current certified term, ending with the month before the current month.
    measure: Count of the most recent consecutive months of training with no edu_enrollment_verified entry for the certification.
  - id: edu_msr_housing_paid_after_change
    window: From the amendment's effective date (or the term start date when no mitigating circumstances apply) through the term end date.
    measure: Sum of amount over edu_housing_payment and edu_monthly_benefit_payment entries for the amended certification covering days in the window, minus what the amended enrollment supports for those days.
  - id: edu_msr_total_months_used_all_chapters
    window: Lifetime of the beneficiary.
    measure: Sum over all of the beneficiary's education benefits of (original_entitlement_days minus entitlement_days_remaining) divided by 30.
  - id: edu_msr_books_paid_academic_year
    window: Academic year August 1 through July 31 containing the term start.
    measure: Sum of amount over edu_books_stipend_payment entries on the benefit whose payment_month falls in the window.

policies:
  - id: edu_agg_multi_holding
    subject: [edu_benefit_established]
    rule: >-
      A beneficiary may hold education benefits under more than one chapter (for example the Selected Reserve
      Montgomery GI Bill earned in the Reserve and the Post-9/11 GI Bill earned on active duty, or Chapter 35 as a child
      and a chapter earned through their own service), with no fixed limit on the number of chapters, but holds at most
      one benefit record per chapter; a change of Post-9/11 benefit level updates that record. A benefit record is established only when the beneficiary holds no benefit record under the same official tier.
    eligibility:
      - id: one_record_per_chapter
        applies_to: [edu_benefit_established]
        kind: dedup
        condition: A benefit record is established only when the beneficiary holds no benefit record under the same official tier.
        evidence_fields: [edu_benefits.customer_id, edu_benefits.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [edu_benefits.customer_id, edu_benefits.variant_name]
          action_bindings:
            edu_benefits.customer_id: customer_id
            edu_benefits.variant_name: variant_name
        dedup_contract:
          table: edu_benefits
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name}
          duplicate_filters: {status: [active, exhausted, delimited, relinquished]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: edu_agg_combined_cap
    subject: [edu_entitlement_charged, edu_benefit_established]
    rule: >-
      A beneficiary who holds two or more chapters can use no more than combined_entitlement_cap_months months of
      entitlement in total across all of them (edu_msr_total_months_used_all_chapters), even though each chapter grants
      its own entitlement_months. When the next charge would cross the combined cap, only the days up to the cap are
      charged and paid; the benefit with remaining days is then treated as having none. Chapter 35 entitlement used as a
      dependent counts toward the cap together with chapters earned through the beneficiary's own service.
    eligibility: []
    params:
      combined_entitlement_cap_months: =combined_entitlement_cap_months
      entitlement_months: =entitlement_months
    measures: [edu_msr_total_months_used_all_chapters]

  - id: edu_ch33_tuition
    subject: [edu_tuition_payment]
    rule: >-
      Post-9/11 GI Bill tuition and fees are paid directly to the school once per certified term. At a public school
      the actual net in-state tuition and fees are covered without a dollar cap; at a private or foreign school the
      payment for an academic year is limited to private_tuition_cap_annual; in either case the result is multiplied by
      the benefit_level_pct of the tier. Tuition above the cap at a private school can be partly covered by Yellow Ribbon
      matching only where the tier is yellow_ribbon_eligible and the school has a Yellow Ribbon agreement covering the
      student's program. Flat-rate chapters never pay tuition to the school. Tuition is paid only for a certification on a benefit whose status is active.
    eligibility:
      - id: benefit_active_tuition
        applies_to: [edu_tuition_payment]
        kind: state
        condition: Tuition is paid only for a certification on a benefit whose status is active.
        evidence_fields: [edu_benefits.status, edu_benefits.edu_benefit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [edu_benefits.edu_benefit_id]
          action_bindings:
            edu_benefits.edu_benefit_id: edu_benefit_id
        state_contract:
          field: edu_benefits.status
          allowed: [active]
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        Montgomery GI Bill - Active Duty (Chapter 30): {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {benefit_level_pct: =benefit_level_pct, tuition_paid_to_school: =tuition_paid_to_school, private_tuition_cap_annual: =private_tuition_cap_annual, yellow_ribbon_eligible: =yellow_ribbon_eligible}
      public_instate_full_coverage: =public_instate_full_coverage
      yellow_ribbon_requires_school_agreement: =yellow_ribbon_requires_school_agreement
      tuition_paid_per_term: =tuition_paid_per_term
    formula:
      amount: "round(min(tuition_fees_charged, private_tuition_cap_annual) * benefit_level_pct / 100, 2)"

  - id: edu_ch33_housing
    subject: [edu_housing_payment]
    rule: >-
      The Post-9/11 GI Bill monthly housing allowance is paid to the student only when the rate of pursuit is greater
      than housing_min_rate_of_pursuit_pct percent. For a month of training it equals the campus housing rate on the
      certification (or online_only_housing_monthly when every course is distance learning, or
      foreign_school_housing_monthly at a foreign school), multiplied by the benefit_level_pct of the tier and by the rate
      of pursuit rounded to the nearest tenth, prorated by the days of the month inside the term over a
      housing_month_days_basis-day month, and kept to the cent. Nothing is paid for days between terms. A housing payment for a month is released only after the student has verified enrollment for that month.
    eligibility:
      - id: month_verified
        applies_to: [edu_housing_payment]
        kind: authorization
        condition: A housing payment for a month is released only after the student has verified enrollment for that month.
        evidence_fields: [edu_enrollments.source_enrollment_id, edu_enrollments.verification_month]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [edu_enrollments.source_enrollment_id, edu_enrollments.verification_month]
          action_bindings:
            edu_enrollments.source_enrollment_id: enrollment_id
            edu_enrollments.verification_month: payment_month
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        Montgomery GI Bill - Active Duty (Chapter 30): {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {benefit_level_pct: =benefit_level_pct, housing_allowance_paid: =housing_allowance_paid, online_only_housing_monthly: =online_only_housing_monthly, foreign_school_housing_monthly: =foreign_school_housing_monthly}
      housing_min_rate_of_pursuit_pct: =housing_min_rate_of_pursuit_pct
      housing_rate_of_pursuit_rounding: =housing_rate_of_pursuit_rounding
      housing_month_days_basis: =housing_month_days_basis
      break_pay_allowed: =break_pay_allowed
    formula:
      when_not: "rate_of_pursuit_pct <= housing_min_rate_of_pursuit_pct"
      amount: "round(mha_bah_rate * benefit_level_pct / 100 * round(rate_of_pursuit_pct / 100, 1) * days_paid / housing_month_days_basis, 2)"

  - id: edu_ch33_books
    subject: [edu_books_stipend_payment]
    rule: >-
      The Post-9/11 GI Bill books and supplies stipend is paid to the student in one lump sum at the start of each
      certified term: books_stipend_per_credit for each credit certified, multiplied by the benefit_level_pct of the tier,
      and limited so that the stipends paid in one academic year (edu_msr_books_paid_academic_year) never exceed
      books_stipend_annual_cap multiplied by the benefit level. Flat-rate chapters pay no books stipend.
    eligibility: []
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        Montgomery GI Bill - Active Duty (Chapter 30): {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {benefit_level_pct: =benefit_level_pct, books_stipend_per_credit: =books_stipend_per_credit, books_stipend_annual_cap: =books_stipend_annual_cap}
      books_paid_at_term_start: =books_paid_at_term_start
    formula:
      amount: "round(books_stipend_per_credit * credit_hours * benefit_level_pct / 100, 2)"
    measures: [edu_msr_books_paid_academic_year]

  - id: edu_flat_rate_monthly
    subject: [edu_monthly_benefit_payment]
    rule: >-
      Chapter 30, Chapter 35 and Chapter 1606 pay the student a flat monthly rate by training time - the full-time,
      three-quarter-time, half-time or less-than-half-time rate of the tier - prorated by the days of the month inside the
      term over a housing_month_days_basis-day month; the less-than-half-time amount never exceeds the tuition and fees
      charged for the month. The school is paid nothing directly. A monthly payment is released only after the student has verified enrollment for that month, and it is paid on payment_day_of_month of the following month.
    eligibility:
      - id: flat_month_verified
        applies_to: [edu_monthly_benefit_payment]
        kind: authorization
        condition: A monthly payment is released only after the student has verified enrollment for that month
        evidence_fields: [edu_enrollments.source_enrollment_id, edu_enrollments.verification_month]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [edu_enrollments.source_enrollment_id, edu_enrollments.verification_month]
          action_bindings:
            edu_enrollments.source_enrollment_id: enrollment_id
            edu_enrollments.verification_month: payment_month
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        Montgomery GI Bill - Active Duty (Chapter 30): {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {monthly_full_time_rate: =monthly_full_time_rate, monthly_three_quarter_rate: =monthly_three_quarter_rate, monthly_half_time_rate: =monthly_half_time_rate, monthly_less_than_half_rate: =monthly_less_than_half_rate}
      housing_month_days_basis: =housing_month_days_basis
      payment_day_of_month: =payment_day_of_month

  - id: edu_evt_monthly_verification
    subject: [edu_enrollment_verified]
    rule: >-
      A student paid a housing allowance or a flat monthly rate must verify each month of enrollment, from
      verification_open_day of that month (or its last day, if earlier) onward, online, by text message or by telephone.
      Verifying is the student's own statement about their attendance and is never given on their behalf. Each month of a certification is verified only once. When verification_missed_months_suspend consecutive months go unverified
      (edu_msr_unverified_months), payments to the student stop until the missing months are verified; once verified,
      the held months are paid. Tuition paid to the school does not depend on monthly verification.
    eligibility:
      - id: verify_once
        applies_to: [edu_enrollment_verified]
        kind: dedup
        condition: Each month of a certification is verified only once.
        evidence_fields: [edu_enrollments.source_enrollment_id, edu_enrollments.verification_month, edu_enrollments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [edu_enrollments.source_enrollment_id, edu_enrollments.verification_month]
          action_bindings:
            edu_enrollments.source_enrollment_id: source_enrollment_id
            edu_enrollments.verification_month: verification_month
        dedup_contract:
          table: edu_enrollments
          mode: separate_record
          object_bindings: {source_enrollment_id: source_enrollment_id, verification_month: verification_month}
          duplicate_filters: {event_type: [edu_enrollment_verified]}
          distinct_fields: []
    params:
      monthly_verification_required: =monthly_verification_required
      verification_missed_months_suspend: =verification_missed_months_suspend
      verification_open_day: =verification_open_day
    measures: [edu_msr_unverified_months]

  - id: edu_evt_enrollment_change
    subject: [edu_enrollment_amended, edu_payment_returned, edu_entitlement_restored]
    rule: >-
      When a student reduces credits or withdraws, the change is effective on the term start date unless VA accepts
      mitigating circumstances, in which case it is effective on the last date of attendance; the first
      mitigating_excused_credits credit hours a student ever drops are accepted as mitigating without evidence, and other
      reasons (serious illness, a family emergency, military orders) require evidence. Payments already issued for days
      after the effective date beyond what the amended enrollment supports (edu_msr_housing_paid_after_change) become an
      overpayment, established as the tier's overpayment_debt_type for housing, books and flat monthly payments. A
      tuition and fees overpayment is established against the school when the change took effect before the term
      started and the tier's tuition_debt_school_liable_before_start is true, and as the tier's
      tuition_overpayment_debt_type against the student otherwise. Entitlement charged for days no longer certified is
      restored, and tuition the school refunds is recorded as a return.
    eligibility: []
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        Montgomery GI Bill - Active Duty (Chapter 30): {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {overpayment_debt_type: =overpayment_debt_type, tuition_overpayment_debt_type: =tuition_overpayment_debt_type, tuition_debt_school_liable_before_start: =tuition_debt_school_liable_before_start}
      mitigating_excused_credits: =mitigating_excused_credits
      no_mitigating_effective_rule: =no_mitigating_effective_rule
      mitigating_effective_rule: =mitigating_effective_rule
    measures: [edu_msr_housing_paid_after_change]

  - id: edu_entitlement_charging
    subject: [edu_entitlement_charged, edu_entitlement_restored, edu_benefit_exhausted, edu_benefit_reactivated]
    rule: >-
      Entitlement is charged for every day of a certified term. Under the rate_of_pursuit basis each day is charged at
      the rate of pursuit (a term at 75 percent rate of pursuit is charged 0.75 day per day, rounded to the whole day for
      the term); under the training_time basis each day is charged at 1 for full time, 0.75 for three-quarter time, 0.5
      for half time and 0.25 for less than half time. When entitlement runs out partway through a term, a Post-9/11 GI
      Bill student is paid to the end of that term, while a flat-rate chapter stops paying on the day entitlement runs
      out. Entitlement charged for a term interrupted by a school closure or program disapproval is restored when
      school_closure_restoration is true, and an exhausted benefit becomes usable again by that restoration. Schools may
      certify up to certification_advance_days days before the term starts. Entitlement is charged only on a benefit whose status is active.
    eligibility:
      - id: charge_active
        applies_to: [edu_entitlement_charged]
        kind: state
        condition: Entitlement is charged only on a benefit whose status is active.
        evidence_fields: [edu_benefits.status, edu_benefits.edu_benefit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [edu_benefits.edu_benefit_id]
          action_bindings:
            edu_benefits.edu_benefit_id: edu_benefit_id
        state_contract:
          field: edu_benefits.status
          allowed: [active]
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {entitlement_charge_basis: =entitlement_charge_basis}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {entitlement_charge_basis: =entitlement_charge_basis}
        Montgomery GI Bill - Active Duty (Chapter 30): {entitlement_charge_basis: =entitlement_charge_basis}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {entitlement_charge_basis: =entitlement_charge_basis}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {entitlement_charge_basis: =entitlement_charge_basis}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {entitlement_charge_basis: =entitlement_charge_basis}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {entitlement_charge_basis: =entitlement_charge_basis}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {entitlement_charge_basis: =entitlement_charge_basis}
      school_closure_restoration: =school_closure_restoration
      certification_advance_days: =certification_advance_days
      full_time_credit_standard: =full_time_credit_standard

  - id: edu_evt_delimiting
    subject: [edu_benefit_delimited, edu_enrollment_certified]
    rule: >-
      A benefit with a delimiting date pays nothing for training after that date; a tier whose delimiting_years is 0 has
      no time limit (the Forever GI Bill for veterans separated on or after January 1, 2013, and Chapter 35 for children
      who turned 18 on or after August 1, 2023). The delimiting date of Chapter 30 runs delimiting_years years from the
      last release from active duty. A term that straddles the delimiting date is paid only through that date.
    eligibility: []
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {delimiting_years: =delimiting_years}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {delimiting_years: =delimiting_years}
        Montgomery GI Bill - Active Duty (Chapter 30): {delimiting_years: =delimiting_years}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {delimiting_years: =delimiting_years}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {delimiting_years: =delimiting_years}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {delimiting_years: =delimiting_years}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {delimiting_years: =delimiting_years}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {delimiting_years: =delimiting_years}

  - id: edu_excl_chapter_election
    subject: [edu_benefit_relinquished, edu_benefit_established, edu_monthly_benefit_payment, edu_housing_payment]
    rule: >-
      Two education chapters are never paid for the same period of training, because concurrent_chapter_payment is
      false; the student chooses which chapter each term is certified under. Electing the Post-9/11 GI Bill in place of
      Chapter 30 or Chapter 1606 relinquishes that chapter irrevocably, and only the beneficiary can make that election.
      A veteran who relinquished Chapter 30 for a single period of service receives Post-9/11 entitlement equal to the
      Chapter 30 months remaining at the election, and receives the Chapter 30 basic pay reduction refund
      (ch30_buyin_refund_amount, prorated by unused Chapter 30 months) with the last housing payment when Post-9/11
      entitlement is exhausted. Chapter 35 cannot be relinquished for the Post-9/11 GI Bill.
    eligibility: []
    params:
      per_tier:
        Montgomery GI Bill - Selected Reserve (Chapter 1606): {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        "Survivors' and Dependents' Educational Assistance (Chapter 35)": {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        Montgomery GI Bill - Active Duty (Chapter 30): {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        Post-9/11 GI Bill (Chapter 33) - 60% Benefit Level: {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        Post-9/11 GI Bill (Chapter 33) - 70% Benefit Level: {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        Post-9/11 GI Bill (Chapter 33) - 80% Benefit Level: {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        Post-9/11 GI Bill (Chapter 33) - 90% Benefit Level: {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
        Post-9/11 GI Bill (Chapter 33) - 100% Benefit Level: {relinquishable_for_ch33: =relinquishable_for_ch33, ch30_buyin_refund_amount: =ch30_buyin_refund_amount}
      concurrent_chapter_payment: =concurrent_chapter_payment

  - id: edu_interact_sponsor_and_comp
    subject: [edu_benefit_established, edu_enrollment_certified]
    rule: >-
      Holding Disability Compensation shapes education eligibility: Chapter 35 is established for a child or spouse only
      while the sponsor's compensation award is permanent and total (or the sponsor died of a service-connected cause),
      and a child paid Chapter 35 for a term cannot be recognized as a school child on the sponsor's compensation award
      for the same months. A Post-9/11 GI Bill benefit level rises when added qualifying active service moves the
      aggregate service into a higher band, and a 30-day continuous period ending in a service-connected disability
      discharge qualifies for the 100 percent level. Transfer of entitlement to dependents is available only on tiers with
      transfer_to_dependents_allowed and is requested by the service member through the Department of Defense, never on a
      VA service call. A student moving from a highly rural county to attend school receives rural_relocation_benefit once,
      and tutorial assistance, licensing test reimbursement and the STEM Scholarship extension are paid within their tier
      limits.
    eligibility: []
    params:
      transfer_to_dependents_allowed: =transfer_to_dependents_allowed
      rural_relocation_benefit: =rural_relocation_benefit
      tutorial_assistance_monthly_max: =tutorial_assistance_monthly_max
      tutorial_assistance_lifetime_max: =tutorial_assistance_lifetime_max
      licensing_test_reimbursement_max: =licensing_test_reimbursement_max
      stem_extension_months: =stem_extension_months
      stem_extension_max_amount: =stem_extension_max_amount

  - id: edu_evt_payment_profile_and_returns
    subject: [edu_school_profile_updated, edu_payment_returned, edu_benefit_level_changed]
    rule: >-
      A student may change the account that receives housing, books and monthly payments only after the caller's
      identity is verified; the school's payment address is maintained by the school and never changed on a student's
      call. A student payment returned by the bank is recorded as a return; reissuing it is done by the education payment unit after the account is updated and is not done on a service call. A benefit level change takes
      effect for terms beginning on or after the date the qualifying service was completed.
    eligibility: []





extended_policies:
- id: edu_ext_verified_rate_of_pursuit
  base_policy_refs:
  - edu_evt_monthly_verification
  - edu_evt_enrollment_change
  - edu_entitlement_charging
  overwrite: []
  trigger: on_request
  subject:
  - edu_enrollment_verified
  computes: rate_of_pursuit_pct
  target_tool: verify_enrollment_month_96d675a6
  params:
    short_term_credits: 6
    mid_term_credits: 9
    mid_term_min_weeks: 10
    standard_term_min_weeks: 15
    max_rate_of_pursuit_pct: 100
  rule: 'A student who verifies a month of enrollment confirms the rate of pursuit read back to them, and that rate of pursuit
    is worked out on the day of the verification from the term certifications and amendments on the benefit. The rate of
    pursuit the student confirms for a verified month is worked out on the student''s resident term certification, the latest
    certification on the benefit whose courses are not all distance learning. The credit hours certified on it are divided
    by the full-time standard of full_time_credit_standard credit hours, and the result is multiplied by 100, rounded half
    up to a whole percent and never set above max_rate_of_pursuit_pct. Resident credits after a reduction are counted over
    the days of the resident term, from its term start to its term end with both days counted: when the latest reduction
    reported on the benefit has a last date of attendance inside the resident term, the credits remaining plus the student''s
    excused credits count for the days from the term start through the last date of attendance and the credits remaining
    count for the rest of the term, so the dropped credits that are not excused count as dropped from the term start; when
    the latest reduction reported on the benefit belongs to the resident term but its last date of attendance is before
    the term start, the credits remaining are counted for the whole term; otherwise the credits certified are counted. The
    student''s excused credits are the dropped credits VA treats as dropped on the last date of attendance: when VA accepted
    mitigating circumstances for the reduction on the student''s evidence, every credit dropped is excused; when VA did
    not accept mitigating circumstances on evidence and the reduction is the first ever reported on the benefit, the credits
    dropped are excused up to the tier''s one-time exclusion of the first mitigating_excused_credits credit hours a student
    ever drops; when VA did not accept mitigating circumstances on evidence and an earlier reduction is on the benefit,
    the one-time exclusion has been used and no credit is excused. The full-time measure of the resident term follows its
    length in weeks, the days from term start to term end with both counted divided by 7: a resident term shorter than mid_term_min_weeks
    weeks is measured against short_term_credits credit hours, a resident term of at least mid_term_min_weeks and shorter
    than standard_term_min_weeks weeks is measured against mid_term_credits credit hours, and any other resident term is
    measured against the full-time standard. Credits of a concurrent distance-learning certification, the latest certification
    on the benefit whose courses are all distance learning, are added as follows: when its term lies wholly inside the resident
    term, all of its credits are added; when its term only partly overlaps the resident term, its credits are added in proportion
    to the days of its term that fall inside the resident term, counting the overlapping days with both ends included over
    the days of its term with both ends included; when its term does not overlap the resident term, or there is no such
    certification, nothing is added. The full-time measure of the distance-learning term follows its own length in weeks,
    the days from its term start to its term end with both counted divided by 7: shorter than mid_term_min_weeks weeks is
    measured against short_term_credits credit hours, at least mid_term_min_weeks and shorter than standard_term_min_weeks
    weeks against mid_term_credits credit hours, and any other length against the full-time standard. The rate of pursuit
    confirmed is the resident credits counted divided by the resident term''s full-time measure, plus the distance-learning
    credits added divided by the distance-learning term''s full-time measure; that sum is multiplied by 100 once, rounded
    half up to a whole percent only at that final step, and never set above max_rate_of_pursuit_pct.'
  prerequisite: []
  cross_category: []
  compute:
  - res_start: LATEST('edu_enrollments', 'term_start_date', date_field='term_start_date', event_type='edu_enrollment_certified',
      online_only=False)
  - res_end: LATEST('edu_enrollments', 'term_end_date', date_field='term_start_date', event_type='edu_enrollment_certified',
      online_only=False)
  - res_credits: LATEST('edu_enrollments', 'credit_hours', date_field='term_start_date', event_type='edu_enrollment_certified',
      online_only=False)
  - res_days: DAYS(res_start, res_end) + 1
  - res_weeks: (DAYS(res_start, res_end) + 1) / 7
  - resident_measure: K('short_term_credits') if res_weeks < K('mid_term_min_weeks') else (K('mid_term_credits') if res_weeks
      < K('standard_term_min_weeks') else P('full_time_credit_standard'))
  - reductions_on_file: COUNT('edu_enrollments', event_type='edu_enrollment_amended', amendment_reason='reduction')
  - red_lda: LATEST('edu_enrollments', 'amendment_effective_date', date_field='amendment_effective_date', event_type='edu_enrollment_amended',
      amendment_reason='reduction')
  - red_credits: LATEST('edu_enrollments', 'credit_hours', date_field='amendment_effective_date', event_type='edu_enrollment_amended',
      amendment_reason='reduction')
  - red_mitigating: LATEST('edu_enrollments', 'mitigating_circumstances', date_field='amendment_effective_date', event_type='edu_enrollment_amended',
      amendment_reason='reduction')
  - red_term_start: LATEST('edu_enrollments', 'term_start_date', date_field='amendment_effective_date', event_type='edu_enrollment_amended',
      amendment_reason='reduction')
  - red_in_term: reductions_on_file > 0 and red_lda >= res_start and red_lda <= res_end
  - credits_dropped: res_credits - red_credits if red_in_term else 0
  - earlier_reductions: COUNT('edu_enrollments', event_type='edu_enrollment_amended', amendment_reason='reduction') - (1
      if red_in_term else 0)
  - excused_allowance: credits_dropped if (red_in_term and red_mitigating == True) else (MN(credits_dropped, P('mitigating_excused_credits'))
      if (red_in_term and red_mitigating == False and earlier_reductions == 0) else 0)
  - excused_credits: MN(credits_dropped, excused_allowance)
  - days_attended: DAYS(res_start, red_lda) + 1 if red_in_term else res_days
  - resident_credits: ((red_credits + excused_credits) * days_attended + red_credits * (res_days - days_attended)) / res_days
      if (red_in_term and days_attended > 0) else (red_credits if (reductions_on_file > 0 and red_term_start == res_start
      and red_lda < res_start) else res_credits)
  - dl_count: COUNT('edu_enrollments', event_type='edu_enrollment_certified', online_only=True)
  - dl_start: LATEST('edu_enrollments', 'term_start_date', date_field='term_start_date', event_type='edu_enrollment_certified',
      online_only=True)
  - dl_end: LATEST('edu_enrollments', 'term_end_date', date_field='term_start_date', event_type='edu_enrollment_certified',
      online_only=True)
  - dl_credits: LATEST('edu_enrollments', 'credit_hours', date_field='term_start_date', event_type='edu_enrollment_certified',
      online_only=True)
  - dl_overlap: DAYS(MX(res_start, dl_start), MN(res_end, dl_end)) + 1 if dl_count > 0 else 0
  - dl_credits_added: dl_credits if (dl_count > 0 and dl_start >= res_start and dl_end <= res_end) else (dl_credits * dl_overlap
      / (DAYS(dl_start, dl_end) + 1) if (dl_count > 0 and dl_overlap > 0) else 0)
  - dl_weeks: (DAYS(dl_start, dl_end) + 1) / 7 if dl_count > 0 else 0
  - dl_measure: K('short_term_credits') if dl_weeks < K('mid_term_min_weeks') else (K('mid_term_credits') if dl_weeks <
      K('standard_term_min_weeks') else P('full_time_credit_standard'))
  - result: MN(K('max_rate_of_pursuit_pct'), int((resident_credits / resident_measure + dl_credits_added / dl_measure) *
      100 + 0.5))
  compute_basis:
    res_start: The rate of pursuit the student confirms for a verified month is worked out on the student's resident term
      certification, the latest certification on the benefit whose courses are not all distance learning.
    res_end: The rate of pursuit the student confirms for a verified month is worked out on the student's resident term
      certification, the latest certification on the benefit whose courses are not all distance learning.
    res_credits: The credit hours certified on it are divided by the full-time standard of full_time_credit_standard credit
      hours
    res_days: Resident credits after a reduction are counted over the days of the resident term, from its term start to
      its term end with both days counted
    reductions_on_file: when the latest reduction reported on the benefit has a last date of attendance inside the resident
      term
    red_lda: when the latest reduction reported on the benefit has a last date of attendance inside the resident term
    red_credits: the credits remaining count for the rest of the term
    red_mitigating: when VA accepted mitigating circumstances for the reduction on the student's evidence, every credit
      dropped is excused
    red_in_term: when the latest reduction reported on the benefit has a last date of attendance inside the resident term
    credits_dropped: the credits dropped are excused up to the tier's one-time exclusion of the first mitigating_excused_credits
      credit hours a student ever drops
    earlier_reductions: when VA did not accept mitigating circumstances on evidence and an earlier reduction is on the benefit,
      the one-time exclusion has been used and no credit is excused.
    excused_allowance: when VA accepted mitigating circumstances for the reduction on the student's evidence, every credit
      dropped is excused; when VA did not accept mitigating circumstances on evidence and the reduction is the first ever
      reported on the benefit, the credits dropped are excused up to the tier's one-time exclusion of the first mitigating_excused_credits
      credit hours a student ever drops; when VA did not accept mitigating circumstances on evidence and an earlier reduction
      is on the benefit, the one-time exclusion has been used and no credit is excused.
    excused_credits: The student's excused credits are the dropped credits VA treats as dropped on the last date of attendance
    days_attended: the credits remaining plus the student's excused credits count for the days from the term start through
      the last date of attendance
    resident_credits: when the latest reduction reported on the benefit has a last date of attendance inside the resident
      term, the credits remaining plus the student's excused credits count for the days from the term start through the
      last date of attendance and the credits remaining count for the rest of the term, so the dropped credits that are
      not excused count as dropped from the term start; when the latest reduction reported on the benefit belongs to the
      resident term but its last date of attendance is before the term start, the credits remaining are counted for the
      whole term; otherwise the credits certified are counted.
    res_weeks: The full-time measure of the resident term follows its length in weeks, the days from term start to term
      end with both counted divided by 7
    resident_measure: a resident term shorter than mid_term_min_weeks weeks is measured against short_term_credits credit
      hours, a resident term of at least mid_term_min_weeks and shorter than standard_term_min_weeks weeks is measured against
      mid_term_credits credit hours, and any other resident term is measured against the full-time standard.
    dl_count: Credits of a concurrent distance-learning certification, the latest certification on the benefit whose courses
      are all distance learning, are added as follows
    dl_start: Credits of a concurrent distance-learning certification, the latest certification on the benefit whose courses
      are all distance learning, are added as follows
    dl_end: Credits of a concurrent distance-learning certification, the latest certification on the benefit whose courses
      are all distance learning, are added as follows
    dl_credits: Credits of a concurrent distance-learning certification, the latest certification on the benefit whose courses
      are all distance learning, are added as follows
    dl_overlap: counting the overlapping days with both ends included over the days of its term with both ends included
    dl_credits_added: when its term lies wholly inside the resident term, all of its credits are added; when its term only
      partly overlaps the resident term, its credits are added in proportion to the days of its term that fall inside the
      resident term, counting the overlapping days with both ends included over the days of its term with both ends included;
      when its term does not overlap the resident term, or there is no such certification, nothing is added.
    dl_weeks: The full-time measure of the distance-learning term follows its own length in weeks, the days from its term
      start to its term end with both counted divided by 7
    dl_measure: shorter than mid_term_min_weeks weeks is measured against short_term_credits credit hours, at least mid_term_min_weeks
      and shorter than standard_term_min_weeks weeks against mid_term_credits credit hours, and any other length against
      the full-time standard.
    result: The rate of pursuit confirmed is the resident credits counted divided by the resident term's full-time measure,
      plus the distance-learning credits added divided by the distance-learning term's full-time measure; that sum is multiplied
      by 100 once, rounded half up to a whole percent only at that final step, and never set above max_rate_of_pursuit_pct.
    red_term_start: when the latest reduction reported on the benefit belongs to the resident term but its last date of
      attendance is before the term start, the credits remaining are counted for the whole term
  factors:
  - id: reduced_resident_credits
    effect: method
    decides: resident_credits
    bindings:
    - days_attended
    - resident_credits
    ladder:
    - when: the latest reduction on the benefit has its last date of attendance inside the resident term
      method: the credits remaining plus the excused credits count through the last date of attendance and the credits remaining
        for the rest of the term, averaged over the term's days
    - when: the latest reduction belongs to the resident term and its last date of attendance is before the term start
      method: the credits remaining are counted for the whole term
    - when: otherwise
      method: the credits certified are counted
    baseline:
      resident_credits: res_credits
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: excused_credit_allowance
    effect: parameter
    decides: excused_allowance
    bindings:
    - earlier_reductions
    - excused_allowance
    ladder:
    - when: VA accepted mitigating circumstances for the reduction on the student's evidence
      value: every credit dropped
    - when: no mitigating circumstances accepted on evidence and the reduction is the first ever reported on the benefit
      value: the credits dropped, up to P('mitigating_excused_credits')
    - when: otherwise (no evidence accepted and an earlier reduction on the benefit)
      value: '0'
    baseline:
      excused_allowance: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: resident_term_measure
    effect: parameter
    decides: resident_measure
    bindings:
    - res_weeks
    - resident_measure
    ladder:
    - when: the resident term is shorter than mid_term_min_weeks weeks
      value: K('short_term_credits')
    - when: the resident term is at least mid_term_min_weeks and shorter than standard_term_min_weeks weeks
      value: K('mid_term_credits')
    - when: otherwise
      value: P('full_time_credit_standard')
    baseline:
      resident_measure: P('full_time_credit_standard')
    evidence:
    - date
    cross_difficulty: null
  - id: distance_learning_credits_added
    effect: method
    decides: dl_credits_added
    bindings:
    - dl_overlap
    - dl_credits_added
    ladder:
    - when: the latest distance-learning certification's term lies wholly inside the resident term
      method: all of its credits are added
    - when: the latest distance-learning certification's term only partly overlaps the resident term
      method: its credits are added in proportion to the overlapping days over the days of its term
    - when: otherwise
      method: nothing is added
    baseline:
      dl_credits_added: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: distance_learning_term_measure
    effect: parameter
    decides: dl_measure
    bindings:
    - dl_weeks
    - dl_measure
    ladder:
    - when: the distance-learning term is shorter than mid_term_min_weeks weeks
      value: K('short_term_credits')
    - when: the distance-learning term is at least mid_term_min_weeks and shorter than standard_term_min_weeks weeks
      value: K('mid_term_credits')
    - when: otherwise
      value: P('full_time_credit_standard')
    baseline:
      dl_measure: P('full_time_credit_standard')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: The rate of pursuit the student confirms for a verified month is worked out on the student's resident term certification,
      the latest certification on the benefit whose courses are not all distance learning. The credit hours certified on
      it are divided by the full-time standard of full_time_credit_standard credit hours, and the result is multiplied by
      100, rounded half up to a whole percent and never set above max_rate_of_pursuit_pct.
    params:
    - full_time_credit_standard
    - max_rate_of_pursuit_pct
  inputs:
    history:
    - table: edu_enrollments
      aggregate: latest
      field: credit_hours
      filters:
        event_type: edu_enrollment_certified
    - table: edu_enrollments
      aggregate: count
      field: enrollment_id
      filters:
        event_type: edu_enrollment_amended
        amendment_reason: reduction
    - table: edu_enrollments
      aggregate: latest
      field: amendment_effective_date
      filters:
        event_type: edu_enrollment_amended
        amendment_reason: reduction
    cross_category: []
- id: edu_ext_flat_monthly_release
  base_policy_refs:
  - edu_flat_rate_monthly
  - edu_excl_chapter_election
  - edu_evt_delimiting
  - edu_entitlement_charging
  overwrite:
  - base_policy: edu_evt_delimiting
    superseded_clause: A term that straddles the delimiting date is paid only through that date.
    replaced_by: The delimiting cut-off is the thirtieth day of the month, or, when the benefit carries a delimiting date,
      the earlier of the thirtieth day and the day of the month on which the delimiting date falls once it has been moved
      later by the delimiting extension, counting the first day of the month as day 1.
  - base_policy: edu_evt_delimiting
    superseded_clause: A benefit with a delimiting date pays nothing for training after that date
    replaced_by: The delimiting cut-off is the thirtieth day of the month, or, when the benefit carries a delimiting date,
      the earlier of the thirtieth day and the day of the month on which the delimiting date falls once it has been moved
      later by the delimiting extension, counting the first day of the month as day 1.
  - base_policy: edu_evt_delimiting
    superseded_clause: The delimiting date of Chapter 30 runs delimiting_years years from the last release from active duty.
    replaced_by: The delimiting extension for a period of total disability is worked out from the student's compensation
      award
  - base_policy: edu_flat_rate_monthly
    superseded_clause: Chapter 30, Chapter 35 and Chapter 1606 pay the student a flat monthly rate by training time
    replaced_by: The rate paid follows the rate of pursuit confirmed on the student's most recent verification
  - base_policy: edu_entitlement_charging
    superseded_clause: while a flat-rate chapter stops paying on the day entitlement runs out
    replaced_by: because entitlement that runs out after the middle of a term is extended to the end of that term
  trigger: on_request
  subject:
  - edu_monthly_benefit_payment
  computes: amount
  target_tool: release_monthly_benefit_payment_750f9b6a
  params:
    full_time_rop: 100
    three_quarter_rop: 75
    half_time_rop: 50
  rule: 'The monthly benefit released for a verified month is the flat monthly rate of the tier for the training time recorded
    on the student''s resident term certification, multiplied by the days payable over a housing_month_days_basis-day month
    and rounded half up to the cent. The month paid is the month covered by the student''s most recent verification on the
    benefit. When no verification is on file at all, the day of the call stands in for the first day of the month paid.
    The days payable run from the first day of that month through the earliest of its thirtieth day, the term end of the
    resident term certification and the delimiting date on the benefit record, none when the delimiting date is before the
    month, with no delimiting limit when the benefit has no delimiting date. The flat monthly rate for the training time
    recorded is the full-time rate for full time, the three-quarter-time rate for three-quarter time, the half-time rate
    for half time, and for less than half time the less-than-half-time rate, never more than the tuition and fees on the
    resident certification spread over its term at housing_month_days_basis days a month. The monthly benefit for a month
    is fixed only after the certification carries the student''s own verification entry for that month, because the rate
    of pursuit confirmed there is the one the month is paid at. The rate paid follows the rate of pursuit confirmed on the
    student''s most recent verification: a confirmed rate of pursuit of at least full_time_rop percent is paid the full-time
    rate, at least three_quarter_rop and below full_time_rop percent the three-quarter-time rate, at least half_time_rop
    and below three_quarter_rop percent the half-time rate, above 0 and below half_time_rop percent the less-than-half-time
    rate subject to the same tuition limit, and a benefit with no verification on file, or whose most recent verification
    confirms 0 percent, is paid at the rate for the training time recorded. The delimiting extension for a period of total
    disability is worked out from the student''s compensation award: when the award carries a temporary total rating that
    took effect after the education benefit was established and a later decision has brought the rating down from 100 percent,
    and the award is neither paid for individual unemployability nor rated 100 percent today, the extension is the days
    from the temporary total rating''s effective date to the effective date of the decision that ended it; when the award
    is paid for individual unemployability or is rated 100 percent today, the extension is the days from the award''s current
    effective date to today; otherwise there is no extension. The delimiting cut-off is the thirtieth day of the month,
    or, when the benefit carries a delimiting date, the earlier of the thirtieth day and the day of the month on which the
    delimiting date falls once it has been moved later by the delimiting extension, counting the first day of the month
    as day 1. The entitlement cut-off follows the entitlement ledger, the days granted plus every restoration minus every
    charge, and the resident term: when no entitlement remains, the last charged day falls inside the month and more than
    half of the resident term''s days, counted from the term start with both ends included, had passed by that day, payment
    continues through the earlier of the thirtieth day and the term end, because entitlement that runs out after the middle
    of a term is extended to the end of that term; when no entitlement remains, the last charged day falls inside the month
    and no more than half of the resident term''s days had passed by that day, payment stops on that last charged day; when
    no entitlement remains and the last charged day falls before the month, nothing is payable; otherwise the entitlement
    cut-off is the thirtieth day. The first day paid follows the resident certification: when its term starts after the
    first day of the month and within it, the days paid begin on the term start; when its term started earlier and a school
    correction of the benefit took effect after the first day of the month, the days paid begin on that correction''s effective
    date; otherwise they begin on the first day of the month. The days payable are the days from the first day paid through
    the earliest of the delimiting cut-off, the entitlement cut-off and the term cut-off, which is the day of the month
    on which the resident term ends or the thirtieth day when it ends later, both ends counted, and never fewer than none;
    the amount is the rate paid multiplied by those days over a housing_month_days_basis-day month, rounded half up to the
    cent once, at the end.'
  prerequisite:
  - problem: edu_ext_verified_rate_of_pursuit
    kind: value_input
    gate: verified_rop
    form: state
    policy_source: The monthly benefit for a month is fixed only after the certification carries the student's own verification
      entry for that month, because the rate of pursuit confirmed there is the one the month is paid at.
    condition: The benefit's enrollment records carry a verification entry for the resident certification and the month
      being paid, with the rate of pursuit the student confirmed.
    resolved_by: verify_enrollment_month_96d675a6
    effect: Once the student's verification for the month is recorded, the rate of pursuit it confirms becomes the verified
      rate of pursuit that selects the monthly rate paid, and its month becomes the month paid.
  cross_category:
  - category: comp
    as: history
    reads:
    - comp_decisions.decision_outcome
    - comp_decisions.rating_effective_date
    - comp_decisions.prior_rating_percent
    - tdiu_granted
    - variant_name
    - effective_date
    note: The delimiting extension's tier is decided from the student's own compensation award and its rating decisions
      (a temporary total period, or a total rating today).
  compute:
  - n_verified: COUNT('edu_enrollments', event_type='edu_enrollment_verified')
  - month_start: LATEST('edu_enrollments', 'verification_month', date_field='verification_month', event_type='edu_enrollment_verified')
      + '-01' if n_verified > 0 else NOW
  - verified_rop: LATEST('edu_enrollments', 'rate_of_pursuit_pct', date_field='verification_month', event_type='edu_enrollment_verified')
      if n_verified > 0 else 0
  - res_start: LATEST('edu_enrollments', 'term_start_date', date_field='term_start_date', event_type='edu_enrollment_certified',
      online_only=False)
  - res_end: LATEST('edu_enrollments', 'term_end_date', date_field='term_start_date', event_type='edu_enrollment_certified',
      online_only=False)
  - res_training_time: LATEST('edu_enrollments', 'training_time', date_field='term_start_date', event_type='edu_enrollment_certified',
      online_only=False)
  - res_tuition: LATEST('edu_enrollments', 'tuition_fees_charged', date_field='term_start_date', event_type='edu_enrollment_certified',
      online_only=False)
  - tuition_month: res_tuition * P('housing_month_days_basis') / (DAYS(res_start, res_end) + 1)
  - certified_rate: P('monthly_full_time_rate') if res_training_time == 'full_time' else (P('monthly_three_quarter_rate')
      if res_training_time == 'three_quarter_time' else (P('monthly_half_time_rate') if res_training_time == 'half_time'
      else MN(P('monthly_less_than_half_rate'), tuition_month)))
  - monthly_rate: P('monthly_full_time_rate') if verified_rop >= K('full_time_rop') else (P('monthly_three_quarter_rate')
      if verified_rop >= K('three_quarter_rop') else (P('monthly_half_time_rate') if verified_rop >= K('half_time_rop')
      else (MN(P('monthly_less_than_half_rate'), tuition_month) if verified_rop > 0 else certified_rate)))
  - tt_count: XCOUNT('comp', 'comp_decisions', decision_outcome='temporary_total_granted')
  - tt_end_count: XCOUNT('comp', 'comp_decisions', prior_rating_percent=100)
  - tt_start: XLATEST('comp', 'comp_decisions', 'rating_effective_date', date_field='rating_effective_date', decision_outcome='temporary_total_granted')
      if tt_count > 0 else F('opened_date')
  - tt_end: XLATEST('comp', 'comp_decisions', 'rating_effective_date', date_field='rating_effective_date', prior_rating_percent=100)
      if tt_end_count > 0 else F('opened_date')
  - comp_iu_now: CFIELD('comp', 'tdiu_granted') == True
  - comp_total_now: CFIELD('comp', 'variant_name') == 'Disability Compensation (100% Combined Rating)'
  - extension_days: DAYS(tt_start, tt_end) if (tt_count > 0 and tt_end_count > 0 and tt_start > F('opened_date') and tt_end
      > tt_start and not comp_iu_now and not comp_total_now) else (DAYS(CFIELD('comp', 'effective_date'), NOW) if (comp_iu_now
      or comp_total_now) else 0)
  - delimiting_cut: MN(P('housing_month_days_basis'), DAYS(month_start, F('delimiting_date')) + 1 + extension_days) if F('delimiting_date')
      else P('housing_month_days_basis')
  - remaining_days: F('original_entitlement_days') + SUM('edu_entitlement_ledger', 'days', event_type='edu_entitlement_restored')
      - SUM('edu_entitlement_ledger', 'days', event_type='edu_entitlement_charged')
  - last_charged_day: LATEST('edu_entitlement_ledger', 'charge_period_end', date_field='charge_period_end', event_type='edu_entitlement_charged')
  - entitlement_cut: MN(P('housing_month_days_basis'), DAYS(month_start, res_end) + 1) if (remaining_days <= 0 and DAYS(month_start,
      last_charged_day) >= 0 and DAYS(month_start, last_charged_day) < P('housing_month_days_basis') and (DAYS(res_start,
      last_charged_day) + 1) * 2 > DAYS(res_start, res_end) + 1) else (DAYS(month_start, last_charged_day) + 1 if (remaining_days
      <= 0 and DAYS(month_start, last_charged_day) >= 0 and DAYS(month_start, last_charged_day) < P('housing_month_days_basis'))
      else (0 if (remaining_days <= 0 and DAYS(month_start, last_charged_day) < 0) else P('housing_month_days_basis')))
  - term_cut: MN(P('housing_month_days_basis'), DAYS(month_start, res_end) + 1)
  - corrections: COUNT('edu_enrollments', event_type='edu_enrollment_amended', amendment_reason='school_correction')
  - correction_date: LATEST('edu_enrollments', 'amendment_effective_date', date_field='amendment_effective_date', event_type='edu_enrollment_amended',
      amendment_reason='school_correction')
  - first_day_offset: DAYS(month_start, res_start) if (DAYS(month_start, res_start) > 0 and DAYS(month_start, res_start)
      < P('housing_month_days_basis')) else (DAYS(month_start, correction_date) if (corrections > 0 and DAYS(month_start,
      correction_date) > 0) else 0)
  - days_paid: MX(0, MN(delimiting_cut, entitlement_cut, term_cut) - first_day_offset)
  - result: RND(monthly_rate * days_paid / P('housing_month_days_basis'), 2)
  compute_basis:
    n_verified: The month paid is the month covered by the student's most recent verification on the benefit.
    month_start: The month paid is the month covered by the student's most recent verification on the benefit. When no verification
      is on file at all, the day of the call stands in for the first day of the month paid.
    verified_rop: The rate paid follows the rate of pursuit confirmed on the student's most recent verification
    res_start: the training time recorded on the student's resident term certification
    res_end: never more than the tuition and fees on the resident certification spread over its term at housing_month_days_basis
      days a month
    res_training_time: the training time recorded on the student's resident term certification
    res_tuition: never more than the tuition and fees on the resident certification spread over its term at housing_month_days_basis
      days a month
    tuition_month: never more than the tuition and fees on the resident certification spread over its term at housing_month_days_basis
      days a month
    certified_rate: The flat monthly rate for the training time recorded is the full-time rate for full time, the three-quarter-time
      rate for three-quarter time, the half-time rate for half time, and for less than half time the less-than-half-time
      rate, never more than the tuition and fees on the resident certification spread over its term at housing_month_days_basis
      days a month.
    monthly_rate: a confirmed rate of pursuit of at least full_time_rop percent is paid the full-time rate, at least three_quarter_rop
      and below full_time_rop percent the three-quarter-time rate, at least half_time_rop and below three_quarter_rop percent
      the half-time rate, above 0 and below half_time_rop percent the less-than-half-time rate subject to the same tuition
      limit, and a benefit with no verification on file, or whose most recent verification confirms 0 percent, is paid at
      the rate for the training time recorded.
    tt_count: when the award carries a temporary total rating that took effect after the education benefit was established
    tt_end_count: and a later decision has brought the rating down from 100 percent
    tt_start: the extension is the days from the temporary total rating's effective date to the effective date of the decision
      that ended it
    tt_end: the extension is the days from the temporary total rating's effective date to the effective date of the decision
      that ended it
    comp_iu_now: when the award is paid for individual unemployability or is rated 100 percent today
    comp_total_now: when the award is paid for individual unemployability or is rated 100 percent today
    extension_days: when the award carries a temporary total rating that took effect after the education benefit was established
      and a later decision has brought the rating down from 100 percent, and the award is neither paid for individual unemployability
      nor rated 100 percent today, the extension is the days from the temporary total rating's effective date to the effective
      date of the decision that ended it; when the award is paid for individual unemployability or is rated 100 percent
      today, the extension is the days from the award's current effective date to today; otherwise there is no extension.
    delimiting_cut: The delimiting cut-off is the thirtieth day of the month, or, when the benefit carries a delimiting
      date, the earlier of the thirtieth day and the day of the month on which the delimiting date falls once it has been
      moved later by the delimiting extension, counting the first day of the month as day 1.
    remaining_days: The entitlement cut-off follows the entitlement ledger, the days granted plus every restoration minus
      every charge
    last_charged_day: when no entitlement remains, the last charged day falls inside the month and no more than half of
      the resident term's days had passed by that day, payment stops on that last charged day
    term_cut: the term cut-off, which is the day of the month on which the resident term ends or the thirtieth day when
      it ends later
    entitlement_cut: when no entitlement remains, the last charged day falls inside the month and more than half of the
      resident term's days, counted from the term start with both ends included, had passed by that day, payment continues
      through the earlier of the thirtieth day and the term end, because entitlement that runs out after the middle of a
      term is extended to the end of that term; when no entitlement remains, the last charged day falls inside the month
      and no more than half of the resident term's days had passed by that day, payment stops on that last charged day;
      when no entitlement remains and the last charged day falls before the month, nothing is payable; otherwise the entitlement
      cut-off is the thirtieth day.
    corrections: when its term started earlier and a school correction of the benefit took effect after the first day of
      the month
    correction_date: the days paid begin on that correction's effective date
    first_day_offset: when its term starts after the first day of the month and within it, the days paid begin on the term
      start; when its term started earlier and a school correction of the benefit took effect after the first day of the
      month, the days paid begin on that correction's effective date; otherwise they begin on the first day of the month.
    days_paid: The days payable are the days from the first day paid through the earliest of the delimiting cut-off, the
      entitlement cut-off and the term cut-off, which is the day of the month on which the resident term ends or the thirtieth
      day when it ends later, both ends counted, and never fewer than none
    result: the amount is the rate paid multiplied by those days over a housing_month_days_basis-day month, rounded half
      up to the cent once, at the end.
  factors:
  - id: verified_rate_paid
    effect: parameter
    decides: monthly_rate
    bindings:
    - verified_rop
    - monthly_rate
    ladder:
    - when: the most recent verification confirms a rate of pursuit of at least full_time_rop percent
      value: P('monthly_full_time_rate')
    - when: the most recent verification confirms at least three_quarter_rop and below full_time_rop percent
      value: P('monthly_three_quarter_rate')
    - when: the most recent verification confirms at least half_time_rop and below three_quarter_rop percent
      value: P('monthly_half_time_rate')
    - when: the most recent verification confirms above 0 and below half_time_rop percent
      value: MN(P('monthly_less_than_half_rate'), tuition per month)
    - when: otherwise (no verification on file, or the most recent verification confirms 0 percent)
      value: the rate for the training time recorded
    baseline:
      monthly_rate: certified_rate
    evidence:
    - history
    cross_difficulty: null
  - id: total_disability_extension
    effect: parameter
    decides: extension_days
    bindings:
    - tt_count
    - tt_end_count
    - comp_iu_now
    - comp_total_now
    - extension_days
    ladder:
    - when: the compensation award carries a temporary total rating that began after the education benefit was established
        and a later decision ended it, and the award is not paid at the total rate today
      value: the days from the temporary total rating's effective date to the effective date of the decision that ended
        it
    - when: the compensation award is paid for individual unemployability or is rated 100 percent today
      value: the days from the award's current effective date to today
    - when: otherwise
      value: '0'
    baseline:
      extension_days: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: comp
  - id: entitlement_stop_day
    effect: method
    decides: entitlement_cut
    bindings:
    - remaining_days
    - last_charged_day
    - entitlement_cut
    ladder:
    - when: no entitlement remains on the ledger, the last charged day falls inside the month and more than half of the
        resident term's days had passed by it
      method: payment continues through the earlier of the thirtieth day and the term end
    - when: no entitlement remains on the ledger, the last charged day falls inside the month and no more than half of the
        resident term's days had passed by it
      method: payment stops on the last charged day
    - when: no entitlement remains on the ledger and the last charged day falls before the month
      method: nothing is payable for the month
    - when: otherwise
      method: the cut-off is the thirtieth day
    baseline:
      entitlement_cut: P('housing_month_days_basis')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: first_day_paid
    effect: method
    decides: first_day_offset
    bindings:
    - corrections
    - correction_date
    - first_day_offset
    ladder:
    - when: the resident term starts after the first day of the month and within it
      method: the days paid begin on the term start
    - when: the resident term started earlier and a school correction took effect after the first day of the month
      method: the days paid begin on the correction's effective date
    - when: otherwise
      method: the days paid begin on the first day of the month
    baseline:
      first_day_offset: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: The monthly benefit released for a verified month is the flat monthly rate of the tier for the training time recorded
      on the student's resident term certification, multiplied by the days payable over a housing_month_days_basis-day month
      and rounded half up to the cent. The month paid is the month covered by the student's most recent verification on
      the benefit. When no verification is on file at all, the day of the call stands in for the first day of the month
      paid. The days payable run from the first day of that month through the earliest of its thirtieth day, the term end
      of the resident term certification and the delimiting date on the benefit record, none when the delimiting date is
      before the month, with no delimiting limit when the benefit has no delimiting date. The flat monthly rate for the
      training time recorded is the full-time rate for full time, the three-quarter-time rate for three-quarter time, the
      half-time rate for half time, and for less than half time the less-than-half-time rate, never more than the tuition
      and fees on the resident certification spread over its term at housing_month_days_basis days a month.
    params:
    - monthly_full_time_rate
    - monthly_three_quarter_rate
    - monthly_half_time_rate
    - monthly_less_than_half_rate
    - housing_month_days_basis
  inputs:
    history:
    - table: edu_enrollments
      aggregate: latest
      field: rate_of_pursuit_pct
      filters:
        event_type: edu_enrollment_verified
    - table: edu_entitlement_ledger
      aggregate: sum
      field: days
      filters:
        event_type: edu_entitlement_charged
    - table: edu_entitlement_ledger
      aggregate: sum
      field: days
      filters:
        event_type: edu_entitlement_restored
    - category: comp
      table: comp_decisions
      aggregate: latest
      field: rating_effective_date
      filters:
        decision_outcome: temporary_total_granted
    cross_category:
    - comp
- id: edu_ext_amended_entitlement_restoration
  base_policy_refs:
  - edu_evt_enrollment_change
  - edu_entitlement_charging
  overwrite:
  - base_policy: edu_evt_enrollment_change
    superseded_clause: Entitlement charged for days no longer certified is restored
    replaced_by: From the days given back so worked out, the days equal to any part of the resulting education overpayment
      that VA has forgiven are taken off, because entitlement paid for by VA stays charged
  trigger: state_due
  subject:
  - edu_entitlement_restored
  computes: days
  target_tool: restore_amended_entitlement_47573840
  params:
    lth_charge: 0.25
    half_charge: 0.5
    three_quarter_charge: 0.75
    full_charge: 1
    shortest_session_credits: 6
    accelerated_session_credits: 9
    accelerated_session_min_weeks: 10
    semester_min_weeks: 15
  rule: 'When a school reports a reduction of a Chapter 30, Chapter 35 or Chapter 1606 term, VA gives back the entitlement
    charged for the training no longer certified on the latest reduction reported on the benefit, whose term start and term
    end are carried on the amendment; the credits certified for that term are those of the certifications whose term began
    in the twelve months before today. The entitlement days given back for a reduced term are the days of that term, from
    its term start to its term end with both days counted, multiplied by the daily charge of the credits certified less
    the daily charge of the credits remaining, and rounded half up to a whole day. Under the standard measurement a credit
    load is charged day for day, 1 a day while any credits are certified, and nothing is charged once no credits remain.
    The restored term''s daily charges follow its own measurement: credits certified of at least the full-time measure are
    charged full_charge a day, at least three quarters of it three_quarter_charge, at least half of it half_charge, and
    less than half of it lth_charge; credits remaining are charged on the same scale, with nothing charged when no credits
    remain. The full-time measure of a restored term follows its length in weeks, the days from term start to term end with
    both counted divided by 7: a term shorter than accelerated_session_min_weeks weeks is measured on shortest_session_credits
    credit hours, a term of at least accelerated_session_min_weeks and shorter than semester_min_weeks weeks on accelerated_session_credits
    credit hours, and any other term on the full-time standard of full_time_credit_standard credit hours. The days a restoration
    covers depend on the last date of attendance and on how far the term''s own charge reached, a restoration never giving
    back days that were never charged: when the latest reduction has a last date of attendance inside its term and the entitlement
    charged for the term, the charge entries for training that began in the twelve months before today, covers every day
    of the term at the certified charge, the days through the last date of attendance are restored at the difference between
    the certified charge and the charge of the credits remaining plus the credits excused in a restoration, and the days
    after it at the difference between the certified and the remaining charges; when the last date of attendance is inside
    the term but that charge ran out before the term end, the days after the last date of attendance are restored only up
    to the day the charge covers, the days the charge covers being the entitlement charged divided by the certified charge,
    and the days through the last date of attendance as in the first case; otherwise, for a reduction whose last date of
    attendance is not inside its term, every day of the term is restored at the difference between the certified and the
    remaining charges. Credits excused in a restoration are the dropped credits VA treats as dropped on the last date of
    attendance: every credit dropped when VA accepted mitigating circumstances for the restored reduction on the student''s
    evidence; when it did not and the restored reduction is the first reported on the benefit, the credits dropped up to
    the tier''s exclusion of the first mitigating_excused_credits credit hours a student ever drops, granted once; and none
    for a restored reduction without accepted evidence that follows an earlier reduction on the benefit. The overpayment
    VA has forgiven on the resulting debt follows the student''s debt records: when a waiver credit is posted on an education
    debt and a waiver decision is on file, the forgiven amount is the waiver credits; when a compromise credit is posted
    and a compromise decision is on file, it is the compromise credits; otherwise nothing is forgiven. From the days given
    back so worked out, the days equal to any part of the resulting education overpayment that VA has forgiven are taken
    off, because entitlement paid for by VA stays charged; the forgiven amount is turned into days over a housing_month_days_basis-day
    month at the flat monthly rate matching the daily charge of the credits certified worked out above, the full-time rate
    for full_charge, the three-quarter-time rate for three_quarter_charge, the half-time rate for half_charge and the less-than-half-time
    rate for lth_charge, whatever training time the certification itself records. The days are rounded half up to a whole
    day only once, after the forgiven days are taken off, and are never fewer than none. The entitlement is given back once
    the reduced term has ended and its enrollment is final: while the term end carried on the amendment is today or a later
    day, nothing is given back yet and no restoration entry is booked for that term. The restoration entry records as its
    first day of training the term start when the days through the last date of attendance are restored at a difference
    above none, or when the last date of attendance is not inside the term, and otherwise the day after the last date of
    attendance; it records as its last day of training the term end, or, when the term''s charge ran out before the term
    end, the last day that charge covers, counting the term start as the first day covered.'
  prerequisite: []
  cross_category:
  - category: debt
    as: history
    reads:
    - current_balance
    - debt_transactions.amount
    - debt_requests.request_kind
    note: The forgiven-overpayment tier is decided from the student's own education debt ledger (waiver or compromise credits
      and decisions).
  compute:
  - red_count: COUNT('edu_enrollments', event_type='edu_enrollment_amended', amendment_reason='reduction')
  - red_start: LATEST('edu_enrollments', 'term_start_date', date_field='amendment_effective_date', event_type='edu_enrollment_amended',
      amendment_reason='reduction')
  - red_end: LATEST('edu_enrollments', 'term_end_date', date_field='amendment_effective_date', event_type='edu_enrollment_amended',
      amendment_reason='reduction')
  - red_lda: LATEST('edu_enrollments', 'amendment_effective_date', date_field='amendment_effective_date', event_type='edu_enrollment_amended',
      amendment_reason='reduction')
  - red_mitigating: LATEST('edu_enrollments', 'mitigating_circumstances', date_field='amendment_effective_date', event_type='edu_enrollment_amended',
      amendment_reason='reduction')
  - term_days: DAYS(red_start, red_end) + 1
  - through_days: DAYS(red_start, red_lda) + 1
  - after_days: term_days - through_days
  - restored_weeks: (DAYS(red_start, red_end) + 1) / 7
  - restored_measure: K('shortest_session_credits') if restored_weeks < K('accelerated_session_min_weeks') else (K('accelerated_session_credits')
      if restored_weeks < K('semester_min_weeks') else P('full_time_credit_standard'))
  - certified_credits: SUM('edu_enrollments', 'credit_hours', within_months=12, date_field='term_start_date', event_type='edu_enrollment_certified')
  - certified_charge: K('lth_charge') if certified_credits < K('half_charge') * restored_measure else (K('half_charge')
      if certified_credits < K('three_quarter_charge') * restored_measure else (K('three_quarter_charge') if certified_credits
      < restored_measure else K('full_charge')))
  - remaining_credits: LATEST('edu_enrollments', 'credit_hours', date_field='amendment_effective_date', event_type='edu_enrollment_amended',
      amendment_reason='reduction')
  - remaining_charge: 0 if remaining_credits <= 0 else (K('lth_charge') if remaining_credits < K('half_charge') * restored_measure
      else (K('half_charge') if remaining_credits < K('three_quarter_charge') * restored_measure else (K('three_quarter_charge')
      if remaining_credits < restored_measure else K('full_charge'))))
  - earlier_reported: COUNT('edu_enrollments', event_type='edu_enrollment_amended', amendment_reason='reduction') - 1
  - exclusion_left: MX(0, certified_credits - remaining_credits) if (red_count > 0 and red_mitigating == True) else (MN(MX(0,
      certified_credits - remaining_credits), P('mitigating_excused_credits')) if (red_count > 0 and red_mitigating == False
      and earlier_reported == 0) else 0)
  - excused: MN(MX(0, certified_credits - remaining_credits), exclusion_left)
  - kept_credits: remaining_credits + excused
  - kept_charge: 0 if kept_credits <= 0 else (K('lth_charge') if kept_credits < K('half_charge') * restored_measure else
      (K('half_charge') if kept_credits < K('three_quarter_charge') * restored_measure else (K('three_quarter_charge') if
      kept_credits < restored_measure else K('full_charge'))))
  - term_charge: SUM('edu_entitlement_ledger', 'days', within_months=12, date_field='charge_period_start', event_type='edu_entitlement_charged')
  - covered_days: term_charge / certified_charge if certified_charge > 0 else 0
  - days_given_back: through_days * (certified_charge - kept_charge) + after_days * (certified_charge - remaining_charge)
      if (red_count > 0 and red_lda >= red_start and red_lda <= red_end and covered_days >= term_days) else (through_days
      * (certified_charge - kept_charge) + MX(0, MN(after_days, covered_days - through_days)) * (certified_charge - remaining_charge)
      if (red_count > 0 and red_lda >= red_start and red_lda <= red_end and covered_days < term_days) else term_days * (certified_charge
      - remaining_charge))
  - waiver_credits: XSUM('debt', 'debt_transactions', 'amount', event_type='debt_waiver_credit')
  - waiver_decisions: XCOUNT('debt', 'debt_requests', event_type='debt_request_decided', request_kind='waiver')
  - compromise_credits: XSUM('debt', 'debt_transactions', 'amount', event_type='debt_compromise_credit')
  - compromise_decisions: XCOUNT('debt', 'debt_requests', event_type='debt_request_decided', request_kind='compromise')
  - forgiven_amount: waiver_credits if (waiver_credits > 0 and waiver_decisions > 0) else (compromise_credits if (compromise_credits
      > 0 and compromise_decisions > 0) else 0)
  - certified_monthly_rate: P('monthly_full_time_rate') if certified_charge == K('full_charge') else (P('monthly_three_quarter_rate')
      if certified_charge == K('three_quarter_charge') else (P('monthly_half_time_rate') if certified_charge == K('half_charge')
      else P('monthly_less_than_half_rate')))
  - forgiven_days: forgiven_amount * P('housing_month_days_basis') / certified_monthly_rate
  - result: 0 if (red_count == 0 or DAYS(red_end, NOW) <= 0) else MX(0, int(days_given_back - forgiven_days + 0.5))
  compute_basis:
    red_count: on the latest reduction reported on the benefit, whose term start and term end are carried on the amendment
    red_start: on the latest reduction reported on the benefit, whose term start and term end are carried on the amendment
    red_end: on the latest reduction reported on the benefit, whose term start and term end are carried on the amendment
    red_lda: when the latest reduction has a last date of attendance inside its term
    red_mitigating: every credit dropped when VA accepted mitigating circumstances for the restored reduction on the student's
      evidence
    term_days: The entitlement days given back for a reduced term are the days of that term, from its term start to its
      term end with both days counted
    through_days: the days through the last date of attendance are restored at the difference between the certified charge
      and the charge of the credits remaining plus the credits excused in a restoration
    after_days: and the days after it at the difference between the certified and the remaining charges
    restored_weeks: The full-time measure of a restored term follows its length in weeks, the days from term start to term
      end with both counted divided by 7
    restored_measure: a term shorter than accelerated_session_min_weeks weeks is measured on shortest_session_credits credit
      hours, a term of at least accelerated_session_min_weeks and shorter than semester_min_weeks weeks on accelerated_session_credits
      credit hours, and any other term on the full-time standard of full_time_credit_standard credit hours.
    certified_credits: the credits certified for that term are those of the certifications whose term began in the twelve
      months before today.
    certified_charge: credits certified of at least the full-time measure are charged full_charge a day, at least three
      quarters of it three_quarter_charge, at least half of it half_charge, and less than half of it lth_charge
    remaining_credits: credits remaining are charged on the same scale, with nothing charged when no credits remain.
    remaining_charge: credits remaining are charged on the same scale, with nothing charged when no credits remain.
    earlier_reported: and none for a restored reduction without accepted evidence that follows an earlier reduction on the
      benefit.
    exclusion_left: every credit dropped when VA accepted mitigating circumstances for the restored reduction on the student's
      evidence; when it did not and the restored reduction is the first reported on the benefit, the credits dropped up
      to the tier's exclusion of the first mitigating_excused_credits credit hours a student ever drops, granted once; and
      none for a restored reduction without accepted evidence that follows an earlier reduction on the benefit.
    excused: Credits excused in a restoration are the dropped credits VA treats as dropped on the last date of attendance
    kept_credits: the charge of the credits remaining plus the credits excused in a restoration
    kept_charge: credits remaining are charged on the same scale, with nothing charged when no credits remain.
    days_given_back: when the latest reduction has a last date of attendance inside its term and the entitlement charged
      for the term, the charge entries for training that began in the twelve months before today, covers every day of the
      term at the certified charge, the days through the last date of attendance are restored at the difference between
      the certified charge and the charge of the credits remaining plus the credits excused in a restoration, and the days
      after it at the difference between the certified and the remaining charges; when the last date of attendance is inside
      the term but that charge ran out before the term end, the days after the last date of attendance are restored only
      up to the day the charge covers, the days the charge covers being the entitlement charged divided by the certified
      charge, and the days through the last date of attendance as in the first case; otherwise, for a reduction whose last
      date of attendance is not inside its term, every day of the term is restored at the difference between the certified
      and the remaining charges.
    waiver_credits: when a waiver credit is posted on an education debt and a waiver decision is on file, the forgiven amount
      is the waiver credits
    waiver_decisions: when a waiver credit is posted on an education debt and a waiver decision is on file
    compromise_credits: when a compromise credit is posted and a compromise decision is on file, it is the compromise credits
    compromise_decisions: when a compromise credit is posted and a compromise decision is on file
    forgiven_amount: when a waiver credit is posted on an education debt and a waiver decision is on file, the forgiven
      amount is the waiver credits; when a compromise credit is posted and a compromise decision is on file, it is the compromise
      credits; otherwise nothing is forgiven.
    certified_monthly_rate: the forgiven amount is turned into days over a housing_month_days_basis-day month at the flat
      monthly rate matching the daily charge of the credits certified worked out above, the full-time rate for full_charge,
      the three-quarter-time rate for three_quarter_charge, the half-time rate for half_charge and the less-than-half-time
      rate for lth_charge, whatever training time the certification itself records.
    forgiven_days: the forgiven amount is turned into days over a housing_month_days_basis-day month at the flat monthly
      rate matching the daily charge of the credits certified worked out above, the full-time rate for full_charge, the
      three-quarter-time rate for three_quarter_charge, the half-time rate for half_charge and the less-than-half-time rate
      for lth_charge, whatever training time the certification itself records.
    result: 'The days are rounded half up to a whole day only once, after the forgiven days are taken off, and are never
      fewer than none. The entitlement is given back once the reduced term has ended and its enrollment is final: while
      the term end carried on the amendment is today or a later day, nothing is given back yet and no restoration entry
      is booked for that term.'
    term_charge: the entitlement charged for the term, the charge entries for training that began in the twelve months before
      today
    covered_days: the days the charge covers being the entitlement charged divided by the certified charge
  factors:
  - id: restoration_start_point
    effect: method
    decides: days_given_back
    bindings:
    - through_days
    - term_charge
    - covered_days
    - days_given_back
    ladder:
    - when: the latest reduction's last date of attendance is inside its term and the term's charge covers every day of
        the term
      method: the days through the last date of attendance at the certified less the kept-credit charge, and the days after
        it to the term end at the certified less the remaining charge
    - when: the last date of attendance is inside the term but the term's charge ran out before the term end
      method: as the first case, but the days after the last date of attendance are counted only up to the last day the
        charge covers
    - when: otherwise (the last date of attendance is not inside the term)
      method: every day of the term at the certified less the remaining charge
    baseline:
      days_given_back: term_days * (certified_charge - remaining_charge)
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: restoration_exclusion_left
    effect: parameter
    decides: exclusion_left
    bindings:
    - earlier_reported
    - exclusion_left
    ladder:
    - when: VA accepted mitigating circumstances for the restored reduction on the student's evidence
      value: every credit dropped
    - when: no evidence accepted and the restored reduction is the first reported on the benefit
      value: the credits dropped, up to P('mitigating_excused_credits')
    - when: otherwise (no evidence accepted and an earlier reduction on the benefit)
      value: '0'
    baseline:
      exclusion_left: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: restored_term_measure
    effect: parameter
    decides: restored_measure
    bindings:
    - restored_weeks
    - restored_measure
    ladder:
    - when: the restored term is shorter than accelerated_session_min_weeks weeks
      value: K('shortest_session_credits')
    - when: the restored term is at least accelerated_session_min_weeks and shorter than semester_min_weeks weeks
      value: K('accelerated_session_credits')
    - when: otherwise
      value: P('full_time_credit_standard')
    baseline:
      restored_measure: P('full_time_credit_standard')
    evidence:
    - date
    cross_difficulty: null
  - id: certified_daily_charge
    effect: parameter
    decides: certified_charge
    bindings:
    - certified_credits
    - certified_charge
    ladder:
    - when: credits certified are less than half of the restored term's full-time measure
      value: K('lth_charge')
    - when: credits certified are at least half and less than three quarters of the measure
      value: K('half_charge')
    - when: credits certified are at least three quarters of the measure and less than all of it
      value: K('three_quarter_charge')
    - when: otherwise
      value: K('full_charge')
    baseline:
      certified_charge: K('full_charge')
    evidence:
    - history
    cross_difficulty: null
  - id: remaining_daily_charge
    effect: parameter
    decides: remaining_charge
    bindings:
    - remaining_credits
    - remaining_charge
    ladder:
    - when: no credits remain
      value: '0'
    - when: credits remaining are at least three quarters and less than all of the measure
      value: K('three_quarter_charge')
    - when: credits remaining are at least half and less than three quarters of the measure
      value: K('half_charge')
    - when: credits remaining are above none and less than half of the measure
      value: K('lth_charge')
    - when: otherwise (credits remaining at least the restored term's full-time measure)
      value: K('full_charge')
    baseline:
      remaining_charge: 0 if remaining_credits <= 0 else K('full_charge')
    evidence:
    - history
    cross_difficulty: null
  - id: forgiven_overpayment
    effect: parameter
    decides: forgiven_amount
    bindings:
    - waiver_credits
    - waiver_decisions
    - compromise_credits
    - compromise_decisions
    - forgiven_amount
    ladder:
    - when: a waiver credit is posted on the student's education debt and a waiver decision is on file
      value: the waiver credits
    - when: a compromise credit is posted and a compromise decision is on file
      value: the compromise credits
    - when: otherwise
      value: '0'
    baseline:
      forgiven_amount: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: debt
  baseline:
    rule: The entitlement days given back for a reduced term are the days of that term, from its term start to its term
      end with both days counted, multiplied by the daily charge of the credits certified less the daily charge of the credits
      remaining, and rounded half up to a whole day. Under the standard measurement a credit load is charged day for day,
      1 a day while any credits are certified, and nothing is charged once no credits remain.
    params:
    - full_charge
    - full_time_credit_standard
  inputs:
    history:
    - table: edu_enrollments
      aggregate: sum
      field: credit_hours
      within_months: 12
      filters:
        event_type: edu_enrollment_certified
    - table: edu_enrollments
      aggregate: latest
      field: amendment_effective_date
      filters:
        event_type: edu_enrollment_amended
        amendment_reason: reduction
    - category: debt
      table: debt_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: debt_waiver_credit
    cross_category:
    - debt
- id: edu_ext_post911_election_entitlement
  base_policy_refs:
  - edu_excl_chapter_election
  - edu_entitlement_charging
  overwrite:
  - base_policy: edu_excl_chapter_election
    superseded_clause: A veteran who relinquished Chapter 30 for a single period of service receives Post-9/11 entitlement
      equal to the Chapter 30 months remaining at the election
    replaced_by: The Post-9/11 entitlement credited on the election is the carried days plus the days released from a certified
      term, less the days held back for an unpaid overpayment
  trigger: on_request
  subject:
  - edu_benefit_relinquished
  computes: post911_entitlement_days
  target_tool: elect_post911_in_place_of_chapter_2e090e13
  params:
    exhausted_carry_months: 12
  rule: 'A student who elects the Post-9/11 GI Bill in place of Chapter 30 or Chapter 1606 relinquishes that chapter on
    the day of the election and is credited Post-9/11 entitlement measured in days of a housing_month_days_basis-day month.
    The Post-9/11 entitlement credited on an election is the full grant of entitlement_months months of housing_month_days_basis
    days, never more than that full grant, rounded half up to a whole day. The Post-9/11 entitlement credited on an election
    is not fixed until the relinquished chapter''s entitlement ledger carries a restoration entry for every amended certification
    whose dropped days were charged. The days carried from the relinquished chapter follow its entitlement ledger, the days
    granted plus every restoration minus every charge: when entitlement has been charged and days remain, the days remaining
    are carried; when entitlement has been charged and no days remain, exhausted_carry_months months of housing_month_days_basis
    days are carried; when no entitlement has ever been charged, the full grant is carried. Days released from a certified
    term follow the latest certification on the relinquished chapter and its charge, the latest charge entry: when that
    term has not begun by the day of the election, its whole charge is released to the student; when the term is under way
    on the day of the election, its charge is released in proportion to the days from the election through the term end,
    both counted, over the days of the term, both counted; when the term has ended, nothing is released. Days held back
    for an unpaid overpayment follow the student''s education debt: when the education debt is being collected, in a repayment
    plan or active, with a balance above nothing, the current balance is held back; when the education debt is on hold for
    a pending request, the original amount is held back; otherwise nothing is held back. An amount held back is turned into
    days over a housing_month_days_basis-day month at the student''s paid monthly rate, the flat monthly payments issued
    in the twelve months before today summed and divided by the days they paid, times housing_month_days_basis: a paid monthly
    rate of at least the three-quarter-time rate converts at the three-quarter-time rate when it is below the full-time
    rate, a paid monthly rate of at least the half-time rate and below the three-quarter-time rate converts at the half-time
    rate, and any other paid monthly rate converts at the full-time rate. The Post-9/11 entitlement credited on the election
    is the carried days plus the days released from a certified term, less the days held back for an unpaid overpayment,
    rounded half up to a whole day once at the end and never more than the full grant.'
  prerequisite:
  - problem: edu_ext_amended_entitlement_restoration
    kind: value_input
    gate: ch30_days_left
    form: state
    policy_source: The Post-9/11 entitlement credited on an election is not fixed until the relinquished chapter's entitlement
      ledger carries a restoration entry for every amended certification whose dropped days were charged.
    condition: The relinquished chapter's entitlement ledger carries an edu_entitlement_restored entry for the reduced certification
      behind every amendment whose dropped days had been charged.
    resolved_by: restore_amended_entitlement_47573840
    effect: The restoration entry raises the days restored on the ledger, so the days remaining on the relinquished chapter,
      and with them the days carried into the Post-9/11 entitlement, rise by the days given back.
  cross_category:
  - category: debt
    as: branch
    reads:
    - status
    - current_balance
    - original_amount
    note: The held-back tier is decided from the student's own education debt record (its collection status and balance).
  compute:
  - charged: SUM('edu_entitlement_ledger', 'days', event_type='edu_entitlement_charged')
  - restored: SUM('edu_entitlement_ledger', 'days', event_type='edu_entitlement_restored')
  - ch30_days_left: F('original_entitlement_days') + restored - charged
  - full_grant: P('entitlement_months') * P('housing_month_days_basis')
  - carried_days: ch30_days_left if (charged > 0 and ch30_days_left > 0) else (K('exhausted_carry_months') * P('housing_month_days_basis')
      if (charged > 0 and ch30_days_left <= 0) else full_grant)
  - last_term_start: LATEST('edu_enrollments', 'term_start_date', date_field='term_start_date', event_type='edu_enrollment_certified')
  - last_term_end: LATEST('edu_enrollments', 'term_end_date', date_field='term_start_date', event_type='edu_enrollment_certified')
  - last_term_charge: LATEST('edu_entitlement_ledger', 'days', date_field='charge_period_start', event_type='edu_entitlement_charged')
  - released_days: last_term_charge if (DAYS(NOW, last_term_start) > 0 and last_term_charge > 0) else (last_term_charge
      * (DAYS(NOW, last_term_end) + 1) / (DAYS(last_term_start, last_term_end) + 1) if (DAYS(last_term_start, NOW) >= 0
      and DAYS(NOW, last_term_end) >= 0) else 0)
  - has_debt: EXISTS('debt', source_category='edu')
  - debt_status: CFIELD('debt', 'status', source_category='edu') if has_debt else 'none'
  - debt_balance: CFIELD('debt', 'current_balance', source_category='edu') if has_debt else 0
  - debt_original: CFIELD('debt', 'original_amount', source_category='edu') if has_debt else 0
  - held_amount: debt_balance if ((debt_status == 'repayment_plan' or debt_status == 'active') and debt_balance > 0) else
      (debt_original if (debt_status == 'on_hold' and debt_original > 0) else 0)
  - paid_amount_12m: SUM('edu_payments', 'amount', within_months=12, date_field='payment_date', event_type='edu_monthly_benefit_payment')
  - paid_days_12m: SUM('edu_payments', 'days_paid', within_months=12, date_field='payment_date', event_type='edu_monthly_benefit_payment')
  - paid_monthly_rate: paid_amount_12m * P('housing_month_days_basis') / paid_days_12m if paid_days_12m > 0 else 0
  - conversion_rate: P('monthly_three_quarter_rate') if (paid_monthly_rate >= P('monthly_three_quarter_rate') and paid_monthly_rate
      < P('monthly_full_time_rate')) else (P('monthly_half_time_rate') if (paid_monthly_rate >= P('monthly_half_time_rate')
      and paid_monthly_rate < P('monthly_three_quarter_rate')) else P('monthly_full_time_rate'))
  - held_days: held_amount * P('housing_month_days_basis') / conversion_rate
  - result: MN(full_grant, int(carried_days + released_days - held_days + 0.5))
  compute_basis:
    charged: the days granted plus every restoration minus every charge
    restored: the days granted plus every restoration minus every charge
    ch30_days_left: The days carried from the relinquished chapter follow its entitlement ledger, the days granted plus
      every restoration minus every charge
    full_grant: The Post-9/11 entitlement credited on an election is the full grant of entitlement_months months of housing_month_days_basis
      days, never more than that full grant, rounded half up to a whole day.
    carried_days: when entitlement has been charged and days remain, the days remaining are carried; when entitlement has
      been charged and no days remain, exhausted_carry_months months of housing_month_days_basis days are carried; when
      no entitlement has ever been charged, the full grant is carried.
    last_term_start: Days released from a certified term follow the latest certification on the relinquished chapter and
      its charge, the latest charge entry
    last_term_end: Days released from a certified term follow the latest certification on the relinquished chapter and its
      charge, the latest charge entry
    last_term_charge: Days released from a certified term follow the latest certification on the relinquished chapter and
      its charge, the latest charge entry
    released_days: when that term has not begun by the day of the election, its whole charge is released to the student;
      when the term is under way on the day of the election, its charge is released in proportion to the days from the election
      through the term end, both counted, over the days of the term, both counted; when the term has ended, nothing is released.
    has_debt: Days held back for an unpaid overpayment follow the student's education debt
    debt_status: Days held back for an unpaid overpayment follow the student's education debt
    debt_balance: the current balance is held back
    debt_original: the original amount is held back
    held_amount: when the education debt is being collected, in a repayment plan or active, with a balance above nothing,
      the current balance is held back; when the education debt is on hold for a pending request, the original amount is
      held back; otherwise nothing is held back.
    paid_amount_12m: the flat monthly payments issued in the twelve months before today summed and divided by the days they
      paid, times housing_month_days_basis
    paid_days_12m: the flat monthly payments issued in the twelve months before today summed and divided by the days they
      paid, times housing_month_days_basis
    paid_monthly_rate: the flat monthly payments issued in the twelve months before today summed and divided by the days
      they paid, times housing_month_days_basis
    conversion_rate: a paid monthly rate of at least the three-quarter-time rate converts at the three-quarter-time rate
      when it is below the full-time rate, a paid monthly rate of at least the half-time rate and below the three-quarter-time
      rate converts at the half-time rate, and any other paid monthly rate converts at the full-time rate.
    held_days: An amount held back is turned into days over a housing_month_days_basis-day month at the student's paid monthly
      rate
    result: The Post-9/11 entitlement credited on the election is the carried days plus the days released from a certified
      term, less the days held back for an unpaid overpayment, rounded half up to a whole day once at the end and never
      more than the full grant.
  factors:
  - id: carried_chapter_days
    effect: parameter
    decides: carried_days
    bindings:
    - charged
    - carried_days
    ladder:
    - when: entitlement has been charged on the relinquished chapter and days remain
      value: the days remaining on the ledger
    - when: entitlement has been charged and no days remain
      value: K('exhausted_carry_months') months of housing_month_days_basis days
    - when: otherwise (never charged)
      value: the full grant
    baseline:
      carried_days: full_grant
    evidence:
    - history
    cross_difficulty: null
  - id: certified_term_release
    effect: method
    decides: released_days
    bindings:
    - last_term_charge
    - released_days
    ladder:
    - when: the latest certified term has not begun on the day of the election
      method: its whole charge is released
    - when: the latest certified term is under way on the day of the election
      method: its charge is released in proportion to the days from the election through the term end over the term's days
    - when: otherwise
      method: nothing is released
    baseline:
      released_days: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: unpaid_overpayment_holdback
    effect: parameter
    decides: held_amount
    bindings:
    - has_debt
    - debt_status
    - debt_balance
    - debt_original
    - held_amount
    ladder:
    - when: the education debt is in a repayment plan or active and its balance is above nothing
      value: the current balance
    - when: the education debt is on hold for a pending request and has an original amount
      value: the original amount
    - when: otherwise
      value: '0'
    baseline:
      held_amount: '0'
    evidence:
    - cross_category
    cross_difficulty: debt
  - id: holdback_conversion_rate
    effect: parameter
    decides: conversion_rate
    bindings:
    - paid_amount_12m
    - paid_days_12m
    - paid_monthly_rate
    - conversion_rate
    ladder:
    - when: the paid monthly rate of the last twelve months is at least the three-quarter-time rate and below the full-time
        rate
      value: P('monthly_three_quarter_rate')
    - when: the paid monthly rate is at least the half-time rate and below the three-quarter-time rate
      value: P('monthly_half_time_rate')
    - when: otherwise
      value: P('monthly_full_time_rate')
    baseline:
      conversion_rate: P('monthly_full_time_rate')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: A student who elects the Post-9/11 GI Bill in place of Chapter 30 or Chapter 1606 relinquishes that chapter on
      the day of the election and is credited Post-9/11 entitlement measured in days of a housing_month_days_basis-day month.
      The Post-9/11 entitlement credited on an election is the full grant of entitlement_months months of housing_month_days_basis
      days, never more than that full grant, rounded half up to a whole day.
    params:
    - entitlement_months
    - housing_month_days_basis
  inputs:
    history:
    - table: edu_entitlement_ledger
      aggregate: sum
      field: days
      filters:
        event_type: edu_entitlement_charged
    - table: edu_entitlement_ledger
      aggregate: sum
      field: days
      filters:
        event_type: edu_entitlement_restored
    - table: edu_payments
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: edu_monthly_benefit_payment
    cross_category:
    - debt
