  - id: loan_excl_irrrl_source
    subject: [loan_guaranty_issued, loan_paid_off]
    rule: >-
      A rate reduction refinance can only refinance an existing VA-guaranteed loan on the same property and pays that loan
      off, so the two loans are never active together; it reuses the entitlement of the loan it replaces rather than
      charging new entitlement. A cash-out refinance can refinance any loan type but charges entitlement like a purchase.
    eligibility: []

extended_policies:
  - id: loan_ext_exempt_fee_refund
    base_policy_refs: [loan_evt_funding_fee_refund, loan_funding_fee]
    overwrite:
      - base_policy: loan_evt_funding_fee_refund
        superseded_clause: >-
          The refund equals the full fee collected on that loan, is paid by VA directly to the veteran
        replaced_by: >-
          The refund paid to the veteran on the charge is the fee returned less the amount applied against the
          debt, rounded to the cent.
    trigger: state_due
    subject: [loan_funding_fee_refunded]
    computes: amount
    target_tool: refund_funding_fee_5c21eab8
    params:
      plan_installments_applied: 12
      share_direct_plan: 50
      share_withholding_plan: 75
      hardship_high_rating: 50
      hardship_low_rating: 10
      hardship_high_limit: 50
      hardship_low_limit: 75
      recent_offset_months: 6
      earlier_offset_months: 24
      recent_offset_relief: 50
      earlier_offset_relief: 75
    rule: >-
      A funding fee refund is figured on one funding fee charge of the loan, and the fee charged is the sum of the
      funding fee charge entries on the loan. On a loan the record shows exempt from the funding fee, the fee
      returned is the whole fee charged; on any other loan it is the amount by which the fee charged exceeds the
      fee due under the program's funding fee table for the loan's recorded use, never less than zero. The refund
      on a funding fee charge is the fee returned, rounded to the cent, and it is paid to the veteran in full.
      Where the veteran owes VA a home loan guaranty debt, VA applies part of the fee returned against that debt
      before paying the rest out, and the most it applies is figured by the state of that debt: where the debt is
      under a repayment plan, the most applied is the plan's monthly installment times the number of installments
      applied; where the debt is in active collection with no repayment plan, the most applied is the debt's whole
      balance; otherwise nothing is applied. The share of the fee returned that may be applied is the direct-plan
      share where the debt is being repaid under a repayment plan by direct payment, the withholding-plan share
      where it is being repaid under a repayment plan by benefit withholding, and the whole fee returned
      otherwise. That share is further limited to the high hardship limit where the veteran's compensation award
      is at a combined rating of at least the high hardship rating, to the low hardship limit where the award's
      combined rating is below that but at least the low hardship rating, and is not limited where the veteran
      holds no compensation award. It is limited once more to the recent-offset relief where VA last collected an
      offset on the veteran's VA debts less than the recent-offset number of months before today, to the
      earlier-offset relief where it last collected one at least the recent-offset number but less than the
      earlier-offset number of months before today, and is not limited otherwise. The amount applied against the
      debt is the fee returned times the share divided by one hundred, times the hardship limit divided by one
      hundred, times the offset relief divided by one hundred, but never more than the most applied, rounded to the
      cent. The refund paid to the veteran on the charge is the fee returned less the amount applied against the
      debt, rounded to the cent.
    prerequisite: []
    cross_category:
      - category: debt
        as: history
        reads: [variant_name, status, current_balance, repayment_plan_method, repayment_plan_monthly_amount, debt_transactions.event_type, debt_transactions.transaction_date]
        note: The home loan guaranty debt's plan or collection state decides how much of the refund can be applied and the share applied, and the date of the latest offset on the veteran's debts decides the offset relief.
      - category: comp
        as: branch
        reads: [variant_name]
        note: The combined rating of the veteran's compensation award decides the hardship limit.
    compute:
      - fee_charged: "SUM('loan_transactions', 'amount', date_field='transaction_date', event_type='loan_funding_fee_charged')"
      - fee_pct_due: "P('funding_fee_first_use_pct') if F('use_type') == 'first_use' else P('funding_fee_subsequent_use_pct')"
      - table_fee: "RND(F('loan_amount') * fee_pct_due / 100, 2)"
      - fee_returned: "fee_charged if F('funding_fee_exempt') == True else MX(0, fee_charged - table_fee)"
      - plan_installment: "CFIELD('debt', 'repayment_plan_monthly_amount', variant_name='Home Loan Guaranty Debt', status='repayment_plan') or 0"
      - active_debt_balance: "CFIELD('debt', 'current_balance', variant_name='Home Loan Guaranty Debt', status='active') or 0"
      - most_applied: "plan_installment * K('plan_installments_applied') if plan_installment > 0 else (active_debt_balance if active_debt_balance > 0 else 0)"
      - plan_method: "CFIELD('debt', 'repayment_plan_method', variant_name='Home Loan Guaranty Debt', status='repayment_plan') or 'none'"
      - applied_share: "K('share_direct_plan') if plan_method == 'direct_payment' else (K('share_withholding_plan') if plan_method == 'benefit_withholding' else 100)"
      - comp_rating: "CPARAM('comp', 'combined_rating_percent') or 0"
      - hardship_limit: "K('hardship_high_limit') if comp_rating >= K('hardship_high_rating') else (K('hardship_low_limit') if comp_rating >= K('hardship_low_rating') else 100)"
      - last_offset_date: "XLATEST('debt', 'debt_transactions', 'transaction_date', date_field='transaction_date', event_type='debt_offset_collected') or '1900-01-01'"
      - months_since_offset: "MONTHS(last_offset_date, NOW)"
      - offset_relief: "K('recent_offset_relief') if months_since_offset < K('recent_offset_months') else (K('earlier_offset_relief') if months_since_offset < K('earlier_offset_months') else 100)"
      - applied: "RND(MN(most_applied, fee_returned * applied_share / 100 * hardship_limit / 100 * offset_relief / 100), 2)"
      - result: "RND(fee_returned - applied, 2)"
    compute_basis:
      fee_charged: "the fee charged is the sum of the funding fee charge entries on the loan."
      fee_pct_due: "the fee due under the program's funding fee table for the loan's recorded use, never less than zero."
      table_fee: "on any other loan it is the amount by which the fee charged exceeds the fee due under the program's funding fee table for the loan's recorded use, never less than zero."
      fee_returned: "On a loan the record shows exempt from the funding fee, the fee returned is the whole fee charged; on any other loan it is the amount by which the fee charged exceeds the fee due under the program's funding fee table for the loan's recorded use, never less than zero."
      plan_installment: "where the debt is under a repayment plan, the most applied is the plan's monthly installment times the number of installments applied;"
      active_debt_balance: "where the debt is in active collection with no repayment plan, the most applied is the debt's whole balance;"
      most_applied: "Where the veteran owes VA a home loan guaranty debt, VA applies part of the fee returned against that debt before paying the rest out, and the most it applies is figured by the state of that debt: where the debt is under a repayment plan, the most applied is the plan's monthly installment times the number of installments applied; where the debt is in active collection with no repayment plan, the most applied is the debt's whole balance; otherwise nothing is applied."
      plan_method: "where the debt is being repaid under a repayment plan by direct payment,"
      applied_share: "The share of the fee returned that may be applied is the direct-plan share where the debt is being repaid under a repayment plan by direct payment, the withholding-plan share where it is being repaid under a repayment plan by benefit withholding, and the whole fee returned otherwise."
      comp_rating: "where the veteran's compensation award is at a combined rating of at least the high hardship rating,"
      hardship_limit: "That share is further limited to the high hardship limit where the veteran's compensation award is at a combined rating of at least the high hardship rating, to the low hardship limit where the award's combined rating is below that but at least the low hardship rating, and is not limited where the veteran holds no compensation award."
      last_offset_date: "where VA last collected an offset on the veteran's VA debts less than the recent-offset number of months before today,"
      months_since_offset: "where VA last collected an offset on the veteran's VA debts less than the recent-offset number of months before today,"
      offset_relief: "It is limited once more to the recent-offset relief where VA last collected an offset on the veteran's VA debts less than the recent-offset number of months before today, to the earlier-offset relief where it last collected one at least the recent-offset number but less than the earlier-offset number of months before today, and is not limited otherwise."
      applied: "The amount applied against the debt is the fee returned times the share divided by one hundred, times the hardship limit divided by one hundred, times the offset relief divided by one hundred, but never more than the most applied, rounded to the cent."
      result: "The refund paid to the veteran on the charge is the fee returned less the amount applied against the debt, rounded to the cent."
    factors:
      - id: refund_application_ceiling
        effect: method
        decides: most_applied
        bindings: [plan_installment, active_debt_balance, most_applied]
        ladder:
          - when: "the veteran's home loan guaranty debt is under a repayment plan"
            method: "the most applied is the plan's monthly installment times the number of installments applied"
          - when: "the home loan guaranty debt is in active collection with no repayment plan"
            method: "the most applied is the debt's whole balance"
          - when: "otherwise"
            method: "nothing is applied; the fee returned is paid out in full"
        baseline:
          most_applied: "0"
        evidence: [cross_category]
        cross_difficulty: debt
      - id: refund_applied_share
        effect: parameter
        decides: applied_share
        bindings: [plan_method, applied_share]
        ladder:
          - when: "the home loan guaranty debt is being repaid under a repayment plan by direct payment"
            value: "K('share_direct_plan')"
          - when: "the home loan guaranty debt is being repaid under a repayment plan by benefit withholding"
            value: "K('share_withholding_plan')"
          - when: "otherwise"
            value: "100"
        baseline:
          applied_share: "100"
        evidence: [cross_category]
        cross_difficulty: debt
      - id: refund_hardship_limit
        effect: parameter
        decides: hardship_limit
        bindings: [comp_rating, hardship_limit]
        ladder:
          - when: "the veteran's compensation award is at a combined rating of at least the high hardship rating"
            value: "K('hardship_high_limit')"
          - when: "the award's combined rating is below the high hardship rating but at least the low hardship rating"
            value: "K('hardship_low_limit')"
          - when: "otherwise (no compensation award)"
            value: "100"
        baseline:
          hardship_limit: "100"
        evidence: [cross_category]
        cross_difficulty: comp
      - id: recent_offset_relief
        effect: parameter
        decides: offset_relief
        bindings: [last_offset_date, months_since_offset, offset_relief]
        ladder:
          - when: "VA last collected an offset on the veteran's VA debts less than the recent-offset number of months ago"
            value: "K('recent_offset_relief')"
          - when: "VA last collected an offset at least the recent-offset number but less than the earlier-offset number of months ago"
            value: "K('earlier_offset_relief')"
          - when: "otherwise"
            value: "100"
        baseline:
          offset_relief: "100"
        evidence: [cross_category, history, date]
        cross_difficulty: debt
    baseline:
      rule: >-
        A funding fee refund is figured on one funding fee charge of the loan, and the fee charged is the sum of the
        funding fee charge entries on the loan. On a loan the record shows exempt from the funding fee, the fee
        returned is the whole fee charged; on any other loan it is the amount by which the fee charged exceeds the
        fee due under the program's funding fee table for the loan's recorded use, never less than zero. The refund
        on a funding fee charge is the fee returned, rounded to the cent, and it is paid to the veteran in full.
      params: [funding_fee_first_use_pct, funding_fee_subsequent_use_pct]
    inputs:
      history:
        - {table: loan_transactions, aggregate: sum, field: amount, filters: {event_type: loan_funding_fee_charged}}
        - {category: debt, table: debt_transactions, aggregate: latest, field: transaction_date, filters: {event_type: debt_offset_collected}}
      cross_category: [debt, comp]

  - id: loan_ext_liquidated_loan_restoration
    base_policy_refs: [loan_evt_entitlement_restoration, loan_agg_entitlement, loan_evt_liquidation_and_debt]
    overwrite:
      - base_policy: loan_evt_entitlement_restoration
        superseded_clause: >-
          Entitlement on a foreclosed loan is restored only after the resulting guaranty debt is repaid in full.
        replaced_by: >-
          The entitlement restored on a liquidated loan is the entitlement charged to the loan less the entitlement
          already restored from it, less the entitlement held back, never less than zero, rounded to the cent;
      - base_policy: loan_agg_entitlement
        superseded_clause: >-
          entitlement lost on a foreclosed loan stays in use until the resulting debt is repaid.
        replaced_by: >-
          Entitlement on a liquidated loan is restored on request while its guaranty debt is still being repaid,
          and only the entitlement held back stays in use until that debt is repaid.
    trigger: on_request
    subject: [loan_entitlement_restored]
    computes: entitlement_amount
    target_tool: apply_entitlement_restoration_1db0e5c4
    params:
      hold_back_share_current_plan: 0.5
      hold_back_share_lapsed_plan: 0.75
      current_plan_payments: 3
      seasoning_long_years: 5
      seasoning_short_years: 3
      seasoning_relief_long_pct: 20
      seasoning_relief_short_pct: 10
      deed_in_lieu_relief_pct: 30
      compromise_sale_relief_pct: 15
    rule: >-
      Entitlement on a loan liquidated by foreclosure, compromise sale or deed in lieu is restored on the
      veteran's own request, figured from the entitlement still charged to that loan. Entitlement on a liquidated
      loan is restored on request while its guaranty debt is still being repaid, and only the entitlement held
      back stays in use until that debt is repaid. The entitlement restored on a liquidated loan is the
      entitlement charged to the loan less the entitlement already restored from it, less the entitlement held
      back, never less than zero, rounded to the cent; the entitlement held back is the guaranty loss VA has not
      recovered on the loan, which is the balance of the home loan guaranty debt that arose from the loan. Where
      that home loan guaranty debt is active or under a repayment plan, the loan record shows the veteran exempt
      from the funding fee and the loan carries a funding fee refund entry, the unrecovered loss is the debt's
      balance less the part of the funding fees charged on the loan that was not paid out in refunds, never less
      than zero; where the debt was closed by a waiver or a compromise and a guaranty claim was paid on the loan,
      the unrecovered loss is the whole guaranty claim paid; otherwise the unrecovered loss is the debt's balance.
      Entitlement is held back at the current-plan share of the unrecovered loss where the debt is under a
      repayment plan and at least the current-plan number of payments were received on the veteran's VA debts
      within the last three months counted back from today; at the lapsed-plan share where the debt is under a
      repayment plan with fewer such payments; and at the whole unrecovered loss otherwise. The amount held back
      is reduced by the long seasoning relief percentage where the loan was liquidated at least the long seasoning
      years before today, by the short seasoning relief percentage where it was liquidated at least the short
      seasoning years but less than the long seasoning years before today, and is not reduced for seasoning
      otherwise. It is further reduced by the deed-in-lieu relief percentage where the guaranty claim paid on the
      loan followed a deed in lieu, by the compromise-sale relief percentage where it followed a compromise sale,
      and is not reduced for the way the loan was liquidated where the claim followed a foreclosure sale. The
      entitlement held back is the unrecovered loss times the hold-back share, times one minus the seasoning
      relief percentage divided by one hundred, times one minus the liquidation relief percentage divided by one
      hundred, rounded to the cent once at the end. The entitlement restored on a liquidated loan is fixed only
      after the loan's money transactions carry a refund entry for every funding fee charge on a loan the record
      shows exempt from the funding fee.
    prerequisite:
      - problem: loan_ext_exempt_fee_refund
        kind: value_input
        gate: loss_unrecovered
        form: state
        policy_source: >-
          The entitlement restored on a liquidated loan is fixed only after the loan's money transactions carry a
          refund entry for every funding fee charge on a loan the record shows exempt from the funding fee.
        condition: >-
          On a loan whose record shows funding_fee_exempt true, every loan_funding_fee_charged entry has a
          loan_funding_fee_refunded entry on the same loan whose source_txn_id is that charge.
        resolved_by: refund_funding_fee_5c21eab8
        effect: >-
          Once the refund entry is booked, the part of the fee charged that was not paid out (the amount VA applied
          against the guaranty debt) comes off the debt's balance, so the unrecovered loss falls from the debt's
          balance to that balance less the amount applied, and the entitlement held back falls with it.
    cross_category:
      - category: debt
        as: history
        reads: [variant_name, source_category, status, current_balance, debt_transactions.event_type, debt_transactions.transaction_date]
        note: The home loan guaranty debt's status and balance decide the unrecovered loss, and the payments received on the veteran's debts in the last three months decide the hold-back share.
    compute:
      - ent_charged: "SUM('loan_entitlement_actions', 'entitlement_amount', date_field='action_date', event_type='loan_entitlement_charged')"
      - ent_restored: "SUM('loan_entitlement_actions', 'entitlement_amount', date_field='action_date', event_type='loan_entitlement_restored')"
      - ent_open: "ent_charged - ent_restored"
      - debt_balance: "CFIELD('debt', 'current_balance', variant_name='Home Loan Guaranty Debt', source_category='loan') or 0"
      - debt_status: "CFIELD('debt', 'status', variant_name='Home Loan Guaranty Debt', source_category='loan') or 'none'"
      - fees_charged: "SUM('loan_transactions', 'amount', date_field='transaction_date', event_type='loan_funding_fee_charged')"
      - refunds_booked: "SUM('loan_transactions', 'amount', date_field='transaction_date', event_type='loan_funding_fee_refunded')"
      - claim_paid: "SUM('loan_transactions', 'amount', date_field='transaction_date', event_type='loan_guaranty_claim_paid')"
      - loss_unrecovered: "MX(0, debt_balance - MX(0, fees_charged - refunds_booked)) if ((debt_status == 'active' or debt_status == 'repayment_plan') and F('funding_fee_exempt') == True and refunds_booked > 0) else (claim_paid if ((debt_status == 'waived' or debt_status == 'compromised') and claim_paid > 0) else debt_balance)"
      - recent_payments: "XCOUNT('debt', 'debt_transactions', within_months=3, date_field='transaction_date', event_type='debt_payment_received')"
      - hold_back_share: "K('hold_back_share_current_plan') if (debt_status == 'repayment_plan' and recent_payments >= K('current_plan_payments')) else (K('hold_back_share_lapsed_plan') if (debt_status == 'repayment_plan' and recent_payments < K('current_plan_payments')) else 1)"
      - liquidated_months: "MONTHS(F('closed_date'), NOW)"
      - seasoning_relief_pct: "K('seasoning_relief_long_pct') if liquidated_months >= 12 * K('seasoning_long_years') else (K('seasoning_relief_short_pct') if liquidated_months >= 12 * K('seasoning_short_years') else 0)"
      - claim_basis: "LATEST('loan_transactions', 'claim_basis', date_field='transaction_date', event_type='loan_guaranty_claim_paid') or 'none'"
      - liquidation_relief_pct: "K('deed_in_lieu_relief_pct') if claim_basis == 'deed_in_lieu' else (K('compromise_sale_relief_pct') if claim_basis == 'compromise_sale' else 0)"
      - held_back: "RND(loss_unrecovered * hold_back_share * (1 - seasoning_relief_pct / 100) * (1 - liquidation_relief_pct / 100), 2)"
      - result: "RND(MX(0, ent_open - held_back), 2)"
    compute_basis:
      ent_charged: "The entitlement restored on a liquidated loan is the entitlement charged to the loan less the entitlement already restored from it, less the entitlement held back, never less than zero, rounded to the cent;"
      ent_restored: "The entitlement restored on a liquidated loan is the entitlement charged to the loan less the entitlement already restored from it, less the entitlement held back, never less than zero, rounded to the cent;"
      debt_balance: "the entitlement held back is the guaranty loss VA has not recovered on the loan, which is the balance of the home loan guaranty debt that arose from the loan."
      debt_status: "Where that home loan guaranty debt is active or under a repayment plan, the loan record shows the veteran exempt from the funding fee and the loan carries a funding fee refund entry,"
      fees_charged: "the unrecovered loss is the debt's balance less the part of the funding fees charged on the loan that was not paid out in refunds, never less than zero;"
      refunds_booked: "the unrecovered loss is the debt's balance less the part of the funding fees charged on the loan that was not paid out in refunds, never less than zero;"
      claim_paid: "where the debt was closed by a waiver or a compromise and a guaranty claim was paid on the loan, the unrecovered loss is the whole guaranty claim paid;"
      loss_unrecovered: "Where that home loan guaranty debt is active or under a repayment plan, the loan record shows the veteran exempt from the funding fee and the loan carries a funding fee refund entry, the unrecovered loss is the debt's balance less the part of the funding fees charged on the loan that was not paid out in refunds, never less than zero; where the debt was closed by a waiver or a compromise and a guaranty claim was paid on the loan, the unrecovered loss is the whole guaranty claim paid; otherwise the unrecovered loss is the debt's balance."
      recent_payments: "at least the current-plan number of payments were received on the veteran's VA debts within the last three months counted back from today;"
      hold_back_share: "Entitlement is held back at the current-plan share of the unrecovered loss where the debt is under a repayment plan and at least the current-plan number of payments were received on the veteran's VA debts within the last three months counted back from today; at the lapsed-plan share where the debt is under a repayment plan with fewer such payments; and at the whole unrecovered loss otherwise."
      liquidated_months: "where the loan was liquidated at least the long seasoning years before today,"
      seasoning_relief_pct: "The amount held back is reduced by the long seasoning relief percentage where the loan was liquidated at least the long seasoning years before today, by the short seasoning relief percentage where it was liquidated at least the short seasoning years but less than the long seasoning years before today, and is not reduced for seasoning otherwise."
      claim_basis: "where the guaranty claim paid on the loan followed a deed in lieu,"
      liquidation_relief_pct: "It is further reduced by the deed-in-lieu relief percentage where the guaranty claim paid on the loan followed a deed in lieu, by the compromise-sale relief percentage where it followed a compromise sale, and is not reduced for the way the loan was liquidated where the claim followed a foreclosure sale."
      held_back: "The entitlement held back is the unrecovered loss times the hold-back share, times one minus the seasoning relief percentage divided by one hundred, times one minus the liquidation relief percentage divided by one hundred, rounded to the cent once at the end."
      result: "The entitlement restored on a liquidated loan is the entitlement charged to the loan less the entitlement already restored from it, less the entitlement held back, never less than zero, rounded to the cent;"
    factors:
      - id: unrecovered_loss_measure
        effect: method
        decides: loss_unrecovered
        bindings: [debt_status, fees_charged, loss_unrecovered]
        ladder:
          - when: "the home loan guaranty debt from the loan is active or under a repayment plan AND the loan record shows the veteran exempt AND the loan carries a funding fee refund entry"
            method: "the debt's balance less the part of the funding fees charged on the loan that was not paid out in refunds, never less than zero"
          - when: "the debt was closed by a waiver or a compromise AND a guaranty claim was paid on the loan"
            method: "the whole guaranty claim paid on the loan"
          - when: "otherwise"
            method: "the debt's balance"
        baseline:
          loss_unrecovered: "debt_balance"
        evidence: [cross_category, history]
        cross_difficulty: debt
      - id: hold_back_share
        effect: parameter
        decides: hold_back_share
        bindings: [recent_payments, hold_back_share]
        ladder:
          - when: "the debt is under a repayment plan AND at least the current-plan number of payments were received on the veteran's VA debts within the last three months"
            value: "K('hold_back_share_current_plan')"
          - when: "the debt is under a repayment plan AND fewer such payments were received"
            value: "K('hold_back_share_lapsed_plan')"
          - when: "otherwise"
            value: "1"
        baseline:
          hold_back_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: debt
      - id: liquidation_seasoning_relief
        effect: parameter
        decides: seasoning_relief_pct
        bindings: [liquidated_months, seasoning_relief_pct]
        ladder:
          - when: "the loan was liquidated at least the long seasoning years before today"
            value: "K('seasoning_relief_long_pct')"
          - when: "the loan was liquidated at least the short seasoning years but less than the long seasoning years before today"
            value: "K('seasoning_relief_short_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          seasoning_relief_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: liquidation_route_relief
        effect: parameter
        decides: liquidation_relief_pct
        bindings: [claim_basis, liquidation_relief_pct]
        ladder:
          - when: "the guaranty claim paid on the loan followed a deed in lieu"
            value: "K('deed_in_lieu_relief_pct')"
          - when: "the guaranty claim paid on the loan followed a compromise sale"
            value: "K('compromise_sale_relief_pct')"
          - when: "otherwise (the claim followed a foreclosure sale)"
            value: "0"
        baseline:
          liquidation_relief_pct: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        Entitlement on a loan liquidated by foreclosure, compromise sale or deed in lieu is restored on the
        veteran's own request, figured from the entitlement still charged to that loan. The entitlement restored on
        a liquidated loan is the entitlement charged to the loan less the entitlement already restored from it, less
        the entitlement held back, never less than zero, rounded to the cent; the entitlement held back is the
        guaranty loss VA has not recovered on the loan, which is the balance of the home loan guaranty debt that
        arose from the loan.
      params: []
    inputs:
      history:
        - {table: loan_entitlement_actions, aggregate: sum, field: entitlement_amount, filters: {event_type: loan_entitlement_charged}}
        - {table: loan_transactions, aggregate: sum, field: amount, filters: {event_type: loan_funding_fee_refunded}}
        - {table: loan_transactions, aggregate: latest, field: claim_basis, filters: {event_type: loan_guaranty_claim_paid}}
        - {category: debt, table: debt_transactions, aggregate: count, field: debt_txn_id, within_months: 3, filters: {event_type: debt_payment_received}}
      cross_category: [debt]

  - id: loan_ext_default_partial_claim
    base_policy_refs: [loan_evt_default_servicing]
    overwrite:
      - base_policy: loan_evt_default_servicing
        superseded_clause: >-
          never exceeds partial_claim_max_pct_upb percent of the unpaid principal balance at the first unpaid installment
        replaced_by: >-
          the ceiling percentage plus the service-connected uplift, applied to the unpaid principal balance the record
          shows at the first unpaid installment,
    trigger: state_due
    subject: [loan_partial_claim_paid]
    computes: amount
    target_tool: record_partial_claim_d52e4f0e
    params:
      repeat_window_months: 24
      repeat_ceiling_recent_pct: 15
      repeat_ceiling_older_pct: 25
      uplift_high_rating: 70
      uplift_low_rating: 30
      uplift_high_pct: 5
      uplift_low_pct: 2.5
    rule: >-
      A VA partial claim on a loan in default is paid at the largest amount the partial claim room allows. The
      partial claim paid is the partial claim ceiling percentage of the unpaid principal balance the record shows at
      the first unpaid installment, less the partial claims already paid on the loan, never less than zero, rounded
      to the cent. Where a partial claim was already paid on the loan and the latest one was paid less than the
      repeat window of months before today, the ceiling percentage is the recent-repeat ceiling; where a partial
      claim was already paid and the latest one was paid at least the repeat window of months before today, it is
      the older-repeat ceiling; otherwise it is the program's partial claim ceiling. Where the latest partial claim on the loan was paid at least twelve months before today, the partial claim debt carried against the ceiling is the partial claims paid less the repayments received, plus simple interest on that remainder at the partial claim interest rate for each whole year since the latest was paid; where the latest was paid less than twelve months before today and partial claim repayments were received, it is the partial claims paid less the repayments received; otherwise it is the partial claims paid. The ceiling is
      raised by the higher service-connected uplift where the veteran's compensation award is running at a combined
      rating of at least the higher uplift rating, by the lower service-connected uplift where the award is running
      at a combined rating of at least the lower uplift rating but below the higher one, and is not raised
      otherwise. Where the veteran owes a disability compensation overpayment in active collection and no such
      overpayment is under a repayment plan, the partial claim is reduced by that overpayment's balance; where a
      disability compensation overpayment is under a repayment plan and none is in active collection, it is
      reduced by that plan's monthly amount; otherwise it is not reduced for other debts. The ceiling amount is
      the ceiling percentage plus the service-connected uplift, applied to the unpaid principal balance the record
      shows at the first unpaid installment, divided by one hundred and rounded to the cent; the partial claim paid is the ceiling amount less the partial claim debt carried against the ceiling and less the reduction for other debts, never less
      than zero, rounded to the cent.
    prerequisite: []
    cross_category:
      - category: comp
        as: branch
        reads: [variant_name, status]
        note: The combined rating and status of the veteran's compensation award decide the service-connected uplift on the ceiling.
      - category: debt
        as: branch
        reads: [variant_name, status, current_balance, repayment_plan_monthly_amount]
        note: A disability compensation overpayment in active collection or under a plan decides the reduction for other debts.
    compute:
      - pc_paid: "SUM('loan_transactions', 'amount', date_field='transaction_date', event_type='loan_partial_claim_paid')"
      - pc_repaid: "SUM('loan_transactions', 'amount', date_field='transaction_date', event_type='loan_partial_claim_repaid')"
      - last_pc_date: "LATEST('loan_transactions', 'transaction_date', date_field='transaction_date', event_type='loan_partial_claim_paid') or '1900-01-01'"
      - months_since_pc: "MONTHS(last_pc_date, NOW)"
      - ceiling_pct: "K('repeat_ceiling_recent_pct') if (pc_paid > 0 and months_since_pc < K('repeat_window_months')) else (K('repeat_ceiling_older_pct') if (pc_paid > 0 and months_since_pc >= K('repeat_window_months')) else P('partial_claim_max_pct_upb'))"
      - claim_owed: "RND((pc_paid - pc_repaid) * (1 + P('partial_claim_interest_rate_pct') / 100 * int(months_since_pc / 12)), 2) if (pc_paid > 0 and months_since_pc >= 12) else (pc_paid - pc_repaid if (pc_paid > 0 and pc_repaid > 0) else pc_paid)"
      - comp_rating: "CPARAM('comp', 'combined_rating_percent') or 0"
      - comp_status: "CFIELD('comp', 'status') or 'none'"
      - ceiling_uplift: "K('uplift_high_pct') if (comp_rating >= K('uplift_high_rating') and comp_status == 'running') else (K('uplift_low_pct') if (comp_rating >= K('uplift_low_rating') and comp_status == 'running') else 0)"
      - overpay_active: "CFIELD('debt', 'current_balance', variant_name='Disability Compensation Overpayment', status='active') or 0"
      - overpay_plan: "CFIELD('debt', 'repayment_plan_monthly_amount', variant_name='Disability Compensation Overpayment', status='repayment_plan') or 0"
      - debt_reduction: "overpay_active if (overpay_active > 0 and overpay_plan == 0) else (overpay_plan if (overpay_plan > 0 and overpay_active == 0) else 0)"
      - ceiling_amount: "RND(F('unpaid_principal_balance') * (ceiling_pct + ceiling_uplift) / 100, 2)"
      - result: "RND(MX(0, ceiling_amount - claim_owed - debt_reduction), 2)"
    compute_basis:
      pc_paid: "less the partial claims already paid on the loan, never less than zero, rounded to the cent."
      pc_repaid: "it is the partial claims paid less the repayments received;"
      last_pc_date: "where a partial claim was already paid and the latest one was paid at least the repeat window of months before today, it is the older-repeat ceiling;"
      months_since_pc: "Where a partial claim was already paid on the loan and the latest one was paid less than the repeat window of months before today, the ceiling percentage is the recent-repeat ceiling;"
      ceiling_pct: "Where a partial claim was already paid on the loan and the latest one was paid less than the repeat window of months before today, the ceiling percentage is the recent-repeat ceiling; where a partial claim was already paid and the latest one was paid at least the repeat window of months before today, it is the older-repeat ceiling; otherwise it is the program's partial claim ceiling."
      claim_owed: "Where the latest partial claim on the loan was paid at least twelve months before today, the partial claim debt carried against the ceiling is the partial claims paid less the repayments received, plus simple interest on that remainder at the partial claim interest rate for each whole year since the latest was paid; where the latest was paid less than twelve months before today and partial claim repayments were received, it is the partial claims paid less the repayments received; otherwise it is the partial claims paid."
      comp_rating: "where the veteran's compensation award is running at a combined rating of at least the higher uplift rating,"
      comp_status: "where the veteran's compensation award is running at a combined rating of at least the higher uplift rating,"
      ceiling_uplift: "The ceiling is raised by the higher service-connected uplift where the veteran's compensation award is running at a combined rating of at least the higher uplift rating, by the lower service-connected uplift where the award is running at a combined rating of at least the lower uplift rating but below the higher one, and is not raised otherwise."
      overpay_active: "Where the veteran owes a disability compensation overpayment in active collection and no such overpayment is under a repayment plan, the partial claim is reduced by that overpayment's balance;"
      overpay_plan: "where a disability compensation overpayment is under a repayment plan and none is in active collection, it is reduced by that plan's monthly amount;"
      debt_reduction: "Where the veteran owes a disability compensation overpayment in active collection and no such overpayment is under a repayment plan, the partial claim is reduced by that overpayment's balance; where a disability compensation overpayment is under a repayment plan and none is in active collection, it is reduced by that plan's monthly amount; otherwise it is not reduced for other debts."
      ceiling_amount: "The ceiling amount is the ceiling percentage plus the service-connected uplift, applied to the unpaid principal balance the record shows at the first unpaid installment, divided by one hundred and rounded to the cent;"
      result: "the partial claim paid is the ceiling amount less the partial claim debt carried against the ceiling and less the reduction for other debts, never less than zero, rounded to the cent."
    factors:
      - id: repeat_claim_ceiling
        effect: parameter
        decides: ceiling_pct
        bindings: [last_pc_date, months_since_pc, ceiling_pct]
        ladder:
          - when: "a partial claim was already paid on the loan AND the latest was paid less than the repeat window of months ago"
            value: "K('repeat_ceiling_recent_pct')"
          - when: "a partial claim was already paid on the loan AND the latest was paid at least the repeat window of months ago"
            value: "K('repeat_ceiling_older_pct')"
          - when: "otherwise"
            value: "P('partial_claim_max_pct_upb')"
        baseline:
          ceiling_pct: "P('partial_claim_max_pct_upb')"
        evidence: [history, date]
        cross_difficulty: null
      - id: partial_claim_still_owed
        effect: method
        decides: claim_owed
        bindings: [pc_repaid, claim_owed]
        ladder:
          - when: "a partial claim was paid on the loan AND the latest was paid at least twelve months ago"
            method: "the partial claims paid less the repayments received, plus simple interest on that remainder at the partial claim interest rate for each whole year since the latest was paid"
          - when: "the latest partial claim was paid less than twelve months ago AND partial claim repayments were received"
            method: "the partial claims paid less the repayments received"
          - when: "otherwise"
            method: "the partial claims paid on the loan"
        baseline:
          claim_owed: "pc_paid"
        evidence: [history]
        cross_difficulty: null
      - id: service_connected_ceiling_uplift
        effect: parameter
        decides: ceiling_uplift
        bindings: [comp_rating, comp_status, ceiling_uplift]
        ladder:
          - when: "the compensation award is running AND its combined rating is at least the higher uplift rating"
            value: "K('uplift_high_pct')"
          - when: "the compensation award is running AND its combined rating is at least the lower uplift rating but below the higher one"
            value: "K('uplift_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          ceiling_uplift: "0"
        evidence: [cross_category]
        cross_difficulty: comp
      - id: other_debt_reduction
        effect: parameter
        decides: debt_reduction
        bindings: [overpay_active, overpay_plan, debt_reduction]
        ladder:
          - when: "a disability compensation overpayment is in active collection AND none is under a repayment plan"
            value: "that overpayment's balance"
          - when: "a disability compensation overpayment is under a repayment plan AND none is in active collection"
            value: "that plan's monthly amount"
          - when: "otherwise"
            value: "0"
        baseline:
          debt_reduction: "0"
        evidence: [cross_category]
        cross_difficulty: debt
    baseline:
      rule: >-
        A VA partial claim on a loan in default is paid at the largest amount the partial claim room allows. The
        partial claim paid is the partial claim ceiling percentage of the unpaid principal balance the record shows at
        the first unpaid installment, less the partial claims already paid on the loan, never less than zero, rounded
        to the cent.
      params: [partial_claim_max_pct_upb]
    inputs:
      history:
        - {table: loan_transactions, aggregate: sum, field: amount, filters: {event_type: loan_partial_claim_paid}}
        - {table: loan_transactions, aggregate: sum, field: amount, filters: {event_type: loan_partial_claim_repaid}}
        - {table: loan_transactions, aggregate: latest, field: transaction_date, filters: {event_type: loan_partial_claim_paid}}
      cross_category: [comp, debt]

  - id: loan_ext_assumption_guaranty_in_force
    base_policy_refs: [loan_evt_assumption, loan_agg_entitlement]
    overwrite: []
    trigger: on_request
    subject: [loan_assumed_with_release]
    computes: guaranty_amount
    target_tool: request_release_of_liability_741ed869
    params:
      recent_cure_months: 12
      older_cure_months: 36
      recent_cure_share: 90
      older_cure_share: 95
      early_assumption_years: 5
      middle_assumption_years: 10
      early_assumption_share: 95
      middle_assumption_share: 98
      repeat_claim_share: 90
      single_claim_share: 95
    rule: >-
      When a veteran selling a home to a buyer who assumes the VA loan asks to be released from liability, the
      release records the guaranty that stays in force on the loan for the assuming buyer. The guaranty that stays
      in force is the guaranty on the loan record, rounded to the cent. The guaranty follows the loan's balance at
      the rate the guaranty on the record bears to the original loan amount, so it never exceeds the guaranty
      issued against the veteran's entitlement. Where the loan's first payment is already due, its unpaid
      principal balance is below the original loan amount and no partial claim is owed on it, the guaranty is
      figured on that unpaid principal balance; where the first payment is already due, the unpaid principal
      balance is below the original loan amount and a partial claim is owed on it, the guaranty is figured on that
      unpaid principal balance less the partial claim still owed, the partial claims paid less the repayments
      received, never less than zero; otherwise it is figured on the original loan amount. The guaranty carried
      forward is the recent-cure share of it where the latest partial claim on the loan was paid less than the
      recent-cure number of months before today, the older-cure share where the latest was paid at least the
      recent-cure number of months but less than the older-cure number of months before today, and the whole of
      it otherwise. It is also the early-assumption share where the release comes less than the early-assumption
      years after the closing date, counting whole months from the closing date to today, the middle-assumption
      share where it comes at least the early-assumption years but less than the middle-assumption years after
      closing, and the whole otherwise. It is also the repeat-claim share where two or more partial claims have
      been paid on the loan, the single-claim share where exactly one has been paid, and the whole where none has.
      The figure recorded is the balance figured, times the guaranty on the record divided by the original loan
      amount, times each of the three shares divided by one hundred, rounded to the cent once at the end. The
      guaranty that stays in force on an assumed loan is fixed only after the loan record shows the loan current
      again, with every reported default cured by a partial claim entry in its money transactions.
    prerequisite:
      - problem: loan_ext_default_partial_claim
        kind: value_input
        gate: balance_basis
        form: state
        policy_source: >-
          The guaranty that stays in force on an assumed loan is fixed only after the loan record shows the loan
          current again, with every reported default cured by a partial claim entry in its money transactions.
        condition: >-
          loan_guaranties.status is active (no longer in_default) and loan_transactions carries the
          loan_partial_claim_paid entry that cured the reported default.
        resolved_by: record_partial_claim_d52e4f0e
        effect: >-
          Once the partial claim is booked, the partial claim still owed rises by it, so the balance figured falls
          by the same amount; the latest partial claim becomes one paid today and the count of partial claims rises
          by one, moving the cure and repeat-claim shares.
    cross_category: []
    compute:
      - days_since_first_due: "DAYS(F('first_payment_due_date'), NOW)"
      - pc_paid_on_loan: "SUM('loan_transactions', 'amount', date_field='transaction_date', event_type='loan_partial_claim_paid')"
      - pc_repaid_on_loan: "SUM('loan_transactions', 'amount', date_field='transaction_date', event_type='loan_partial_claim_repaid')"
      - pc_owed_on_loan: "MX(0, pc_paid_on_loan - pc_repaid_on_loan)"
      - balance_basis: "F('unpaid_principal_balance') if (days_since_first_due > 0 and F('unpaid_principal_balance') < F('loan_amount') and pc_owed_on_loan == 0) else (MX(0, F('unpaid_principal_balance') - pc_owed_on_loan) if (days_since_first_due > 0 and F('unpaid_principal_balance') < F('loan_amount') and pc_owed_on_loan > 0) else F('loan_amount'))"
      - last_cure_date: "LATEST('loan_transactions', 'transaction_date', date_field='transaction_date', event_type='loan_partial_claim_paid') or '1900-01-01'"
      - months_since_cure: "MONTHS(last_cure_date, NOW)"
      - cure_share: "K('recent_cure_share') if months_since_cure < K('recent_cure_months') else (K('older_cure_share') if months_since_cure < K('older_cure_months') else 100)"
      - months_since_closing: "MONTHS(F('closing_date'), NOW)"
      - assumption_share: "K('early_assumption_share') if months_since_closing < 12 * K('early_assumption_years') else (K('middle_assumption_share') if months_since_closing < 12 * K('middle_assumption_years') else 100)"
      - pc_count: "COUNT('loan_transactions', date_field='transaction_date', event_type='loan_partial_claim_paid')"
      - repeat_share: "K('repeat_claim_share') if pc_count >= 2 else (K('single_claim_share') if pc_count == 1 else 100)"
      - result: "RND(balance_basis * F('guaranty_amount') / F('loan_amount') * cure_share / 100 * assumption_share / 100 * repeat_share / 100, 2)"
    compute_basis:
      days_since_first_due: "Where the loan's first payment is already due,"
      pc_paid_on_loan: "the partial claim still owed, the partial claims paid less the repayments received, never less than zero;"
      pc_repaid_on_loan: "the partial claim still owed, the partial claims paid less the repayments received, never less than zero;"
      pc_owed_on_loan: "the partial claim still owed, the partial claims paid less the repayments received, never less than zero;"
      balance_basis: "Where the loan's first payment is already due, its unpaid principal balance is below the original loan amount and no partial claim is owed on it, the guaranty is figured on that unpaid principal balance; where the first payment is already due, the unpaid principal balance is below the original loan amount and a partial claim is owed on it, the guaranty is figured on that unpaid principal balance less the partial claim still owed, the partial claims paid less the repayments received, never less than zero; otherwise it is figured on the original loan amount."
      last_cure_date: "where the latest partial claim on the loan was paid less than the recent-cure number of months before today,"
      months_since_cure: "where the latest partial claim on the loan was paid less than the recent-cure number of months before today,"
      cure_share: "The guaranty carried forward is the recent-cure share of it where the latest partial claim on the loan was paid less than the recent-cure number of months before today, the older-cure share where the latest was paid at least the recent-cure number of months but less than the older-cure number of months before today, and the whole of it otherwise."
      months_since_closing: "counting whole months from the closing date to today,"
      assumption_share: "It is also the early-assumption share where the release comes less than the early-assumption years after the closing date, counting whole months from the closing date to today, the middle-assumption share where it comes at least the early-assumption years but less than the middle-assumption years after closing, and the whole otherwise."
      pc_count: "where two or more partial claims have been paid on the loan,"
      repeat_share: "It is also the repeat-claim share where two or more partial claims have been paid on the loan, the single-claim share where exactly one has been paid, and the whole where none has."
      result: "The figure recorded is the balance figured, times the guaranty on the record divided by the original loan amount, times each of the three shares divided by one hundred, rounded to the cent once at the end."
    factors:
      - id: guaranty_balance_basis
        effect: method
        decides: balance_basis
        bindings: [days_since_first_due, pc_paid_on_loan, pc_repaid_on_loan, pc_owed_on_loan, balance_basis]
        ladder:
          - when: "the first payment is already due AND the unpaid principal balance is below the original loan amount AND no partial claim is owed on the loan"
            method: "the guaranty is figured on the unpaid principal balance"
          - when: "the first payment is already due AND the unpaid principal balance is below the original loan amount AND a partial claim is owed on the loan"
            method: "the guaranty is figured on the unpaid principal balance less the partial claim still owed, never below zero"
          - when: "otherwise"
            method: "the guaranty is figured on the original loan amount"
        baseline:
          balance_basis: "F('loan_amount')"
        evidence: [history, date]
        cross_difficulty: null
      - id: cure_carry_share
        effect: parameter
        decides: cure_share
        bindings: [last_cure_date, months_since_cure, cure_share]
        ladder:
          - when: "the latest partial claim on the loan was paid less than the recent-cure number of months ago"
            value: "K('recent_cure_share')"
          - when: "the latest partial claim was paid at least the recent-cure number of months but less than the older-cure number of months ago"
            value: "K('older_cure_share')"
          - when: "otherwise"
            value: "100"
        baseline:
          cure_share: "100"
        evidence: [history, date]
        cross_difficulty: null
      - id: early_assumption_carry
        effect: parameter
        decides: assumption_share
        bindings: [months_since_closing, assumption_share]
        ladder:
          - when: "the release comes less than the early-assumption years after the closing date"
            value: "K('early_assumption_share')"
          - when: "the release comes at least the early-assumption years but less than the middle-assumption years after closing"
            value: "K('middle_assumption_share')"
          - when: "otherwise"
            value: "100"
        baseline:
          assumption_share: "100"
        evidence: [date]
        cross_difficulty: null
      - id: repeat_claim_carry
        effect: parameter
        decides: repeat_share
        bindings: [pc_count, repeat_share]
        ladder:
          - when: "two or more partial claims have been paid on the loan"
            value: "K('repeat_claim_share')"
          - when: "exactly one partial claim has been paid on the loan"
            value: "K('single_claim_share')"
          - when: "otherwise"
            value: "100"
        baseline:
          repeat_share: "100"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        When a veteran selling a home to a buyer who assumes the VA loan asks to be released from liability, the
        release records the guaranty that stays in force on the loan for the assuming buyer. The guaranty that stays
        in force is the guaranty on the loan record, rounded to the cent.
      params: []
    inputs:
      history:
        - {table: loan_transactions, aggregate: sum, field: amount, filters: {event_type: loan_partial_claim_paid}}
        - {table: loan_transactions, aggregate: latest, field: transaction_date, filters: {event_type: loan_partial_claim_paid}}
        - {table: loan_transactions, aggregate: count, field: loan_txn_id, filters: {event_type: loan_partial_claim_paid}}
      cross_category: []

  - id: loan_ext_substitution_restoration
    base_policy_refs: [loan_evt_entitlement_restoration, loan_agg_entitlement, loan_evt_assumption]
    overwrite:
      - base_policy: loan_evt_entitlement_restoration
        superseded_clause: >-
          or when a qualifying veteran buyer assumes the loan and substitutes their own entitlement.
        replaced_by: >-
          The entitlement restored to the seller by substitution is the substitution measure, less the partial claim
          reserve after its service-connected relief, less the overpayment reserve, plus the repayment credit, never
          less than zero and never more than the entitlement still charged, rounded to the cent once at the end.
      - base_policy: loan_evt_assumption
        superseded_clause: >-
          The veteran's entitlement stays charged after a release unless the buyer is a veteran who substitutes
          entitlement.
        replaced_by: >-
          When the buyer substitutes, the part of the seller's entitlement that this restoration does not restore stays
          charged to the loan.
    trigger: on_request
    subject: [loan_entitlement_restored]
    computes: entitlement_amount
    target_tool: restore_entitlement_by_substitution_1ad1d2fb
    params:
      reserve_above_guaranty_pct: 15
      reserve_within_guaranty_pct: 10
      reserve_relief_high_rating: 50
      reserve_relief_low_rating: 30
      reserve_relief_high_pct: 50
      reserve_relief_low_pct: 25
      overpayment_plan_reserve_pct: 50
      repayment_credit_window_months: 24
      repayment_credit_recent_pct: 50
      repayment_credit_older_pct: 25
    rule: >-
      When a qualifying veteran buyer assumes a VA loan and substitutes their own entitlement, the seller's
      entitlement tied to that loan is restored to the seller. The entitlement restored to the seller by
      substitution is the entitlement charged to the loan less the entitlement already restored from it, never less
      than zero, rounded to the cent. When the buyer substitutes, the part of the seller's entitlement that this
      restoration does not restore stays charged to the loan. The substitution measure is the guaranty in force on the loan record where that guaranty is below the entitlement still charged but not below the basic entitlement; where the guaranty in force is below both the entitlement still charged and the basic entitlement, it is the basic entitlement, never more than the entitlement still charged; otherwise it is the entitlement still charged. The partial claim reserve is a percentage of the partial claim still
      owed on the loan, the partial claims paid less the repayments received: the above-guaranty percentage where
      that amount exceeds the guaranty in force on the loan record, the within-guaranty percentage where some
      partial claim is owed but no more than that guaranty, and nothing where none is owed. The partial claim
      reserve is relieved by the higher reserve relief percentage where the seller's compensation award is at a
      combined rating of at least the higher relief rating, by the lower reserve relief percentage where it is
      below that but at least the lower relief rating, and is not relieved otherwise. The overpayment reserve is
      the balance of a disability compensation overpayment the seller owes in active collection where none is
      under a repayment plan; the plan reserve percentage of the balance of one under a repayment plan where none
      is in active collection; and nothing otherwise. The repayment credit is the recent-credit percentage of the
      partial claim repayments received on the loan where a repayment was received within the credit window of
      months before today; the older-credit percentage of them where repayments were received but none within the
      credit window; and nothing otherwise. The entitlement restored to the seller by substitution is the
      substitution measure, less the partial claim reserve after its service-connected relief, less the
      overpayment reserve, plus the repayment credit, never less than zero and never more than the entitlement
      still charged, rounded to the cent once at the end. A seller's entitlement is not restored by substitution
      until the loan record shows the seller released from liability on the assumption.
    prerequisite:
      - problem: loan_ext_assumption_guaranty_in_force
        kind: value_input
        gate: substitution_base
        form: state
        policy_source: >-
          A seller's entitlement is not restored by substitution until the loan record shows the seller released
          from liability on the assumption.
        condition: >-
          loan_guaranties.status is released_by_assumption and release_of_liability is true, which the release
          records together with the guaranty in force on the loan.
        resolved_by: request_release_of_liability_741ed869
        effect: >-
          Once the release is recorded, the guaranty in force on the loan record is the figure the release set, so
          the substitution measure moves from the entitlement still charged to that guaranty and the partial claim
          reserve is measured against it.
    cross_category:
      - category: debt
        as: branch
        reads: [variant_name, status, current_balance]
        note: A disability compensation overpayment the seller owes in active collection or under a plan decides the overpayment reserve.
      - category: comp
        as: branch
        reads: [variant_name]
        note: The seller's combined rating decides the service-connected relief on the partial claim reserve.
    compute:
      - ent_charged: "SUM('loan_entitlement_actions', 'entitlement_amount', date_field='action_date', event_type='loan_entitlement_charged')"
      - ent_restored: "SUM('loan_entitlement_actions', 'entitlement_amount', date_field='action_date', event_type='loan_entitlement_restored')"
      - ent_still_charged: "MX(0, ent_charged - ent_restored)"
      - substitution_base: "MN(ent_still_charged, F('guaranty_amount')) if (F('guaranty_amount') < ent_still_charged and F('guaranty_amount') >= P('basic_entitlement')) else (MN(ent_still_charged, P('basic_entitlement')) if (F('guaranty_amount') < ent_still_charged and F('guaranty_amount') < P('basic_entitlement')) else ent_still_charged)"
      - pc_paid_total: "SUM('loan_transactions', 'amount', date_field='transaction_date', event_type='loan_partial_claim_paid')"
      - pc_repaid_total: "SUM('loan_transactions', 'amount', date_field='transaction_date', event_type='loan_partial_claim_repaid')"
      - pc_still_owed: "MX(0, pc_paid_total - pc_repaid_total)"
      - pc_reserve_pct: "K('reserve_above_guaranty_pct') if (pc_still_owed > 0 and pc_still_owed > F('guaranty_amount')) else (K('reserve_within_guaranty_pct') if (pc_still_owed > 0 and pc_still_owed <= F('guaranty_amount')) else 0)"
      - comp_rating: "CPARAM('comp', 'combined_rating_percent') or 0"
      - reserve_relief_pct: "K('reserve_relief_high_pct') if comp_rating >= K('reserve_relief_high_rating') else (K('reserve_relief_low_pct') if comp_rating >= K('reserve_relief_low_rating') else 0)"
      - overpay_active_bal: "CFIELD('debt', 'current_balance', variant_name='Disability Compensation Overpayment', status='active') or 0"
      - overpay_plan_bal: "CFIELD('debt', 'current_balance', variant_name='Disability Compensation Overpayment', status='repayment_plan') or 0"
      - overpayment_reserve: "overpay_active_bal if (overpay_active_bal > 0 and overpay_plan_bal == 0) else (overpay_plan_bal * K('overpayment_plan_reserve_pct') / 100 if (overpay_plan_bal > 0 and overpay_active_bal == 0) else 0)"
      - repaid_recent: "SUM('loan_transactions', 'amount', within_months=24, date_field='transaction_date', event_type='loan_partial_claim_repaid')"
      - credit_pct: "K('repayment_credit_recent_pct') if repaid_recent > 0 else (K('repayment_credit_older_pct') if pc_repaid_total > 0 else 0)"
      - result: "RND(MN(ent_still_charged, MX(0, substitution_base - pc_still_owed * pc_reserve_pct / 100 * (1 - reserve_relief_pct / 100) - overpayment_reserve + pc_repaid_total * credit_pct / 100)), 2)"
    compute_basis:
      ent_charged: "The entitlement restored to the seller by substitution is the entitlement charged to the loan less the entitlement already restored from it, never less than zero, rounded to the cent."
      ent_restored: "The entitlement restored to the seller by substitution is the entitlement charged to the loan less the entitlement already restored from it, never less than zero, rounded to the cent."
      ent_still_charged: "The entitlement restored to the seller by substitution is the entitlement charged to the loan less the entitlement already restored from it, never less than zero, rounded to the cent."
      substitution_base: "The substitution measure is the guaranty in force on the loan record where that guaranty is below the entitlement still charged but not below the basic entitlement; where the guaranty in force is below both the entitlement still charged and the basic entitlement, it is the basic entitlement, never more than the entitlement still charged; otherwise it is the entitlement still charged."
      pc_paid_total: "the partial claim still owed on the loan, the partial claims paid less the repayments received:"
      pc_repaid_total: "the partial claim still owed on the loan, the partial claims paid less the repayments received:"
      pc_still_owed: "the partial claim still owed on the loan, the partial claims paid less the repayments received:"
      pc_reserve_pct: "The partial claim reserve is a percentage of the partial claim still owed on the loan, the partial claims paid less the repayments received: the above-guaranty percentage where that amount exceeds the guaranty in force on the loan record, the within-guaranty percentage where some partial claim is owed but no more than that guaranty, and nothing where none is owed."
      comp_rating: "where the seller's compensation award is at a combined rating of at least the higher relief rating,"
      reserve_relief_pct: "The partial claim reserve is relieved by the higher reserve relief percentage where the seller's compensation award is at a combined rating of at least the higher relief rating, by the lower reserve relief percentage where it is below that but at least the lower relief rating, and is not relieved otherwise."
      overpay_active_bal: "The overpayment reserve is the balance of a disability compensation overpayment the seller owes in active collection where none is under a repayment plan;"
      overpay_plan_bal: "the plan reserve percentage of the balance of one under a repayment plan where none is in active collection;"
      overpayment_reserve: "The overpayment reserve is the balance of a disability compensation overpayment the seller owes in active collection where none is under a repayment plan; the plan reserve percentage of the balance of one under a repayment plan where none is in active collection; and nothing otherwise."
      repaid_recent: "where a repayment was received within the credit window of months before today;"
      credit_pct: "The repayment credit is the recent-credit percentage of the partial claim repayments received on the loan where a repayment was received within the credit window of months before today; the older-credit percentage of them where repayments were received but none within the credit window; and nothing otherwise."
      result: "The entitlement restored to the seller by substitution is the substitution measure, less the partial claim reserve after its service-connected relief, less the overpayment reserve, plus the repayment credit, never less than zero and never more than the entitlement still charged, rounded to the cent once at the end."
    factors:
      - id: substitution_measure
        effect: method
        decides: substitution_base
        bindings: [ent_charged, substitution_base]
        ladder:
          - when: "the guaranty in force on the loan record is below the entitlement still charged AND it is not below the basic entitlement"
            method: "the guaranty in force on the loan record"
          - when: "the guaranty in force on the loan record is below the entitlement still charged AND it is below the basic entitlement"
            method: "the basic entitlement, never more than the entitlement still charged"
          - when: "otherwise"
            method: "the entitlement still charged to the loan"
        baseline:
          substitution_base: "ent_still_charged"
        evidence: [history]
        cross_difficulty: null
      - id: partial_claim_reserve
        effect: parameter
        decides: pc_reserve_pct
        bindings: [pc_paid_total, pc_still_owed, pc_reserve_pct]
        ladder:
          - when: "some partial claim is still owed on the loan AND it exceeds the guaranty in force on the loan record"
            value: "K('reserve_above_guaranty_pct')"
          - when: "some partial claim is still owed AND it does not exceed the guaranty in force"
            value: "K('reserve_within_guaranty_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          pc_reserve_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: reserve_service_connected_relief
        effect: parameter
        decides: reserve_relief_pct
        bindings: [comp_rating, reserve_relief_pct]
        ladder:
          - when: "the seller's compensation award is at a combined rating of at least the higher relief rating"
            value: "K('reserve_relief_high_pct')"
          - when: "the seller's combined rating is below the higher relief rating but at least the lower relief rating"
            value: "K('reserve_relief_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          reserve_relief_pct: "0"
        evidence: [cross_category]
        cross_difficulty: comp
      - id: overpayment_reserve
        effect: parameter
        decides: overpayment_reserve
        bindings: [overpay_active_bal, overpay_plan_bal, overpayment_reserve]
        ladder:
          - when: "the seller owes a disability compensation overpayment in active collection AND none is under a repayment plan"
            value: "that overpayment's balance"
          - when: "a disability compensation overpayment is under a repayment plan AND none is in active collection"
            value: "K('overpayment_plan_reserve_pct') percent of that overpayment's balance"
          - when: "otherwise"
            value: "0"
        baseline:
          overpayment_reserve: "0"
        evidence: [cross_category]
        cross_difficulty: debt
      - id: repayment_credit
        effect: parameter
        decides: credit_pct
        bindings: [pc_repaid_total, repaid_recent, credit_pct]
        ladder:
          - when: "a partial claim repayment was received within the credit window of months"
            value: "K('repayment_credit_recent_pct')"
          - when: "partial claim repayments were received AND none within the credit window"
            value: "K('repayment_credit_older_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          credit_pct: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        When a qualifying veteran buyer assumes a VA loan and substitutes their own entitlement, the seller's
        entitlement tied to that loan is restored to the seller. The entitlement restored to the seller by
        substitution is the entitlement charged to the loan less the entitlement already restored from it, never less
        than zero, rounded to the cent.
      params: []
    inputs:
      history:
        - {table: loan_entitlement_actions, aggregate: sum, field: entitlement_amount, filters: {event_type: loan_entitlement_charged}}
        - {table: loan_transactions, aggregate: sum, field: amount, filters: {event_type: loan_partial_claim_paid}}
        - {table: loan_transactions, aggregate: sum, field: amount, within_months: 24, filters: {event_type: loan_partial_claim_repaid}}
      cross_category: [debt, comp]
