    target: loan_guaranties
    mutation: create
    meaning: VA issues the guaranty on a closed loan (or makes a direct loan) and records it against the veteran's entitlement.
    grain: one row per loan guaranteed
    fields:
      customer_id: The veteran borrower.
      variant_name: Loan program and band.
      status: Set to active.
      va_loan_number: VA loan identification number.
      lender_name: Lender or servicer.
      property_state: Property state.
      county_loan_limit: County conforming limit for the closing year.
      closing_date: Closing date.
      loan_amount: Loan amount excluding a financed funding fee.
      use_type: First or subsequent use.
      down_payment_pct: Down payment percent.
      guaranty_amount: Guaranty issued.
      funding_fee_exempt: Exemption recognized at closing.
      unpaid_principal_balance: Equal to the loan amount plus any financed funding fee at closing.
      first_payment_due_date: First payment due date.
      occupancy_certified: Occupancy certification.
      release_of_liability: Always false at issuance.
      partial_claim_balance: Always 0.00 at issuance.
      opened_date: Guaranty date.
    triggers:
      - event: loan:loan_entitlement_charged
        when: {variant_name: {not: VA Interest Rate Reduction Refinance Loan (IRRRL)}}
        map: {customer_id: customer_id, entitlement_amount: guaranty_amount, action_date: opened_date}
      - event: loan:loan_funding_fee_charged
        when: {funding_fee_exempt: false}
        map: {customer_id: customer_id, transaction_date: closing_date}

  - type: loan_default_reported
    target: loan_guaranties
    mutation: {transition: {from: active, to: in_default}}
    meaning: The servicer reports the loan in default.
    grain: one row per transaction
    fields:
      status: Set to in_default.
      unpaid_principal_balance: Balance at the first unpaid installment.
    triggers: []

  - type: loan_default_cured
    target: loan_guaranties
    mutation: {transition: {from: in_default, to: active}}
    meaning: The default is cured and the loan is current again.
    grain: one row per transaction
    fields:
      status: Set to active.
      unpaid_principal_balance: Balance after the cure.
    triggers: []

  - type: loan_paid_off
    target: loan_guaranties
    mutation: {transition: [{from: active, to: paid_in_full}, {from: in_default, to: paid_in_full}]}
    meaning: The loan is paid in full by sale or refinance.
    grain: one row per transaction
    fields:
      status: Set to paid_in_full.
      unpaid_principal_balance: Set to 0.00.
      closed_date: Payoff date.
    triggers: []

  - type: loan_foreclosed
    target: loan_guaranties
    mutation: {transition: {from: in_default, to: foreclosed}}
    meaning: The loan is liquidated by foreclosure, compromise sale or deed in lieu.
    grain: one row per transaction
    fields:
      status: Set to foreclosed.
      closed_date: Liquidation date.
    triggers: []

  - type: loan_assumed_with_release
    target: loan_guaranties
    mutation: {transition: {from: active, to: released_by_assumption}}
    meaning: A qualified buyer assumes the loan and the veteran is released from liability.
    grain: one row per transaction
    fields:
      status: Set to released_by_assumption.
      release_of_liability: Set to true.
      closed_date: Release date.
    triggers: []

  - type: loan_exemption_updated
    target: loan_guaranties
    mutation: update
    meaning: VA corrects the funding fee exemption on a loan after a later finding (for example a compensation award effective on or before the closing date).
    grain: one row per transaction
    fields:
      funding_fee_exempt: Corrected exemption.
    triggers: []

  - type: loan_servicing_updated
    target: loan_guaranties
    mutation: update
    meaning: The servicer reports a new unpaid balance or the servicing is transferred.
    grain: one row per transaction
    fields:
      lender_name: Current servicer.
      unpaid_principal_balance: Balance reported.
    triggers: []

  - type: loan_funding_fee_charged
    target: loan_transactions
    meaning: The funding fee is collected at closing and remitted to VA.
    grain: one row per loan
    distinguish_by: [transaction_date]
    fields:
      loan_id: Loan.
      customer_id: Veteran.
      amount: Fee paid.
      transaction_date: Closing date.
      fee_pct_applied: Fee percentage applied.
    account: funding_fee_paid
    direction: in
    triggers: []

  - type: loan_funding_fee_refunded
    target: loan_transactions
    meaning: VA refunds a funding fee the veteran should not have paid.
    grain: one row per funding fee charge refunded
    distinguish_by: [source_txn_id]
    fields:
      loan_id: Loan.
      customer_id: Veteran.
      amount: Amount refunded.
      transaction_date: Refund date.
      source_txn_id: Funding fee charge refunded.
      refund_basis: Ground for the refund.
    account: funding_fee_paid
    direction: out
    triggers: []

  - type: loan_partial_claim_paid
    target: loan_transactions
    meaning: VA pays the servicer a partial claim to bring a defaulted loan current, secured by a subordinate lien.
    grain: one row per partial claim
    distinguish_by: [transaction_date]
    fields:
      loan_id: Loan.
      customer_id: Veteran.
      amount: Partial claim paid.
      transaction_date: Payment date.
    account: partial_claim_balance
    direction: in
    triggers:
      - event: loan:loan_default_cured
        map: {}

  - type: loan_partial_claim_repaid
    target: loan_transactions
    meaning: The veteran repays the partial claim, usually at payoff or sale.
    grain: one row per repayment
    distinguish_by: [source_txn_id, transaction_date]
    fields:
      loan_id: Loan.
      customer_id: Veteran.
      amount: Amount repaid.
      transaction_date: Repayment date.
      source_txn_id: Partial claim repaid.
    account: partial_claim_balance
    direction: out
    triggers: []

  - type: loan_guaranty_claim_paid
    target: loan_transactions
    meaning: VA pays the holder's guaranty claim after the loan is liquidated.
    grain: one row per liquidated loan
    distinguish_by: [claim_basis, transaction_date]
    fields:
      loan_id: Loan.
      customer_id: Veteran.
      amount: Claim paid.
      transaction_date: Payment date.
      claim_basis: Liquidation type.
      deficiency_created: Whether the veteran owes VA the claim paid.
    triggers:
      - event: debt:debt_established
        when: {deficiency_created: true}
        map: {customer_id: customer_id, variant_name: Home Loan Guaranty Debt, source_record_id: loan_txn_id, source_category: loan}

  - type: loan_entitlement_charged
    target: loan_entitlement_actions
    meaning: Entitlement equal to the guaranty is charged when the guaranty issues.
    grain: one row per loan
    distinguish_by: [action_date]
    fields:
      loan_id: Loan.
      customer_id: Veteran.
      entitlement_amount: Entitlement charged.
      action_date: Charge date.
      restoration_basis: Always not_applicable.
    account: entitlement_in_use
    direction: in
    triggers: []

  - type: loan_entitlement_restored
    target: loan_entitlement_actions
    meaning: Entitlement charged to a loan is restored for future use.
    grain: one row per loan restored
    distinguish_by: [restoration_basis]
    fields:
      loan_id: Loan.
      customer_id: Veteran.
      entitlement_amount: Entitlement restored.
      action_date: Restoration date.
      restoration_basis: Ground.
      substitute_customer_id: Assuming veteran for a substitution, otherwise empty.
    account: entitlement_in_use
    direction: out
    triggers: []

measures:
  - id: loan_msr_entitlement_in_use_all_loans
    window: Current state.
    measure: Sum over all the veteran's loans of loan_entitlement_charged entitlement_amount minus loan_entitlement_restored entitlement_amount.
  - id: loan_msr_one_time_restorations_used
    window: Lifetime of the veteran.
    measure: Count of loan_entitlement_restored entries across the veteran's loans whose restoration_basis is one_time_restoration.

policies:
  - id: loan_agg_multi_holding
    subject: [loan_guaranty_issued]
    rule: >-
      A veteran may have more than one VA-guaranteed loan outstanding at the same time, with no fixed limit on the
      number, as long as enough entitlement remains to support each new guaranty (for example keeping a former home with
      a VA loan as a rental while buying a new home with remaining entitlement); each loan is its own record with its
      own guaranty and entitlement charge. A guaranty is issued only once for a given VA loan number.
    eligibility:
      - id: one_guaranty_per_loan_number
        applies_to: [loan_guaranty_issued]
        kind: dedup
        condition: A guaranty is issued only once for a given VA loan number.
        evidence_fields: [loan_guaranties.va_loan_number, loan_guaranties.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_guaranties.va_loan_number]
          action_bindings:
            loan_guaranties.va_loan_number: va_loan_number
        dedup_contract:
          table: loan_guaranties
          mode: separate_record
          object_bindings: {va_loan_number: va_loan_number}
          duplicate_filters: {status: [active, in_default, paid_in_full, foreclosed, released_by_assumption]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: loan_agg_entitlement
    subject: [loan_guaranty_issued, loan_entitlement_charged, loan_entitlement_restored]
    rule: >-
      Entitlement in use is the sum, over all of the veteran's loans, of entitlement charged minus entitlement restored
      (loan_msr_entitlement_in_use_all_loans); entitlement lost on a foreclosed loan stays in use until the resulting
      debt is repaid. A veteran with no entitlement in use has full entitlement and no maximum guaranteed loan amount.
      A veteran with entitlement in use has remaining entitlement equal to bonus_entitlement_pct_of_county_limit percent
      of the county loan limit minus the entitlement in use, and the guaranty on a new loan cannot exceed that remainder.
      The guaranty on a loan is guaranty_small_loan_pct percent of a loan of 45,000 dollars or less,
      guaranty_45001_56250_flat on a loan above 45,000 and up to 56,250 dollars, guaranty_mid_band_pct percent (at most
      guaranty_mid_band_cap) on a loan above 56,250 and up to 144,000 dollars, and guaranty_large_loan_pct percent of a
      larger loan, limited to the remaining entitlement; entitlement equal to the guaranty is charged when it issues.
    eligibility: []
    params:
      guaranty_small_loan_pct: =guaranty_small_loan_pct
      guaranty_45001_56250_flat: =guaranty_45001_56250_flat
      guaranty_mid_band_pct: =guaranty_mid_band_pct
      guaranty_mid_band_cap: =guaranty_mid_band_cap
      guaranty_large_loan_pct: =guaranty_large_loan_pct
      basic_entitlement: =basic_entitlement
      bonus_entitlement_pct_of_county_limit: =bonus_entitlement_pct_of_county_limit
      county_limit_baseline: =county_limit_baseline
      full_entitlement_no_limit: =full_entitlement_no_limit
    measures: [loan_msr_entitlement_in_use_all_loans]

  - id: loan_funding_fee
    subject: [loan_funding_fee_charged, loan_guaranty_issued]
    rule: >-
      The funding fee is the loan amount (excluding the fee itself) multiplied by the program's funding fee percentage -
      the first-use percentage when the loan is the veteran's first use of the benefit and the subsequent-use percentage
      otherwise - rounded to the cent. A purchase is placed in the down-payment band whose minimum (inclusive) and maximum
      (exclusive) contain its down payment. No fee is charged when the veteran is exempt on any of the
      funding_fee_exemption_bases as of the closing date. The lender remits the fee within funding_fee_remit_days days
      of closing, and a late remittance adds funding_fee_late_charge_pct percent; the fee may be financed into the loan.
    eligibility: []
    params:
      per_tier:
        VA Interest Rate Reduction Refinance Loan (IRRRL): {funding_fee_first_use_pct: =funding_fee_first_use_pct, funding_fee_subsequent_use_pct: =funding_fee_subsequent_use_pct, down_payment_band_min_pct: =down_payment_band_min_pct, down_payment_band_max_pct: =down_payment_band_max_pct}
        VA Manufactured Home Loan: {funding_fee_first_use_pct: =funding_fee_first_use_pct, funding_fee_subsequent_use_pct: =funding_fee_subsequent_use_pct, down_payment_band_min_pct: =down_payment_band_min_pct, down_payment_band_max_pct: =down_payment_band_max_pct}
        VA Purchase Loan (10% or More Down): {funding_fee_first_use_pct: =funding_fee_first_use_pct, funding_fee_subsequent_use_pct: =funding_fee_subsequent_use_pct, down_payment_band_min_pct: =down_payment_band_min_pct, down_payment_band_max_pct: =down_payment_band_max_pct}
        VA Purchase Loan (5% to Less Than 10% Down): {funding_fee_first_use_pct: =funding_fee_first_use_pct, funding_fee_subsequent_use_pct: =funding_fee_subsequent_use_pct, down_payment_band_min_pct: =down_payment_band_min_pct, down_payment_band_max_pct: =down_payment_band_max_pct}
        VA Purchase Loan (Less Than 5% Down): {funding_fee_first_use_pct: =funding_fee_first_use_pct, funding_fee_subsequent_use_pct: =funding_fee_subsequent_use_pct, down_payment_band_min_pct: =down_payment_band_min_pct, down_payment_band_max_pct: =down_payment_band_max_pct}
        VA Cash-Out Refinance Loan: {funding_fee_first_use_pct: =funding_fee_first_use_pct, funding_fee_subsequent_use_pct: =funding_fee_subsequent_use_pct, down_payment_band_min_pct: =down_payment_band_min_pct, down_payment_band_max_pct: =down_payment_band_max_pct}
        Native American Direct Loan (NADL): {funding_fee_first_use_pct: =funding_fee_first_use_pct, funding_fee_subsequent_use_pct: =funding_fee_subsequent_use_pct, down_payment_band_min_pct: =down_payment_band_min_pct, down_payment_band_max_pct: =down_payment_band_max_pct}
      funding_fee_exemption_bases: =funding_fee_exemption_bases
      funding_fee_financeable: =funding_fee_financeable
      funding_fee_remit_days: =funding_fee_remit_days
      funding_fee_late_charge_pct: =funding_fee_late_charge_pct
    formula:
      amount: "round(loan_amount * fee_pct_applied / 100, 2)"

  - id: loan_evt_exemption_from_compensation
    subject: [loan_exemption_updated]
    rule: >-
      Holding a compensation award changes the funding fee on a loan: a veteran is exempt for a loan when, on its closing
      date, they were receiving compensation, were entitled to compensation but receiving retired or active-duty pay
      instead, had a pre-discharge or proposed rating, or were an active-duty Purple Heart recipient. A veteran who paid
      the fee and is later awarded compensation becomes exempt for that loan when the award is effective on or before the
      closing date. The exemption on a loan is corrected only when the veteran's compensation award shows an effective
      date of service connection on or before the loan's closing date. A compensation award effective after the closing
      date never makes an earlier loan exempt, and a pending claim is not enough.
    eligibility:
      - id: award_effective_by_closing
        applies_to: [loan_exemption_updated]
        kind: authorization
        condition: The exemption on a loan is corrected only when the veteran's compensation award shows an effective date of service connection on or before the loan's closing date.
        evidence_fields: [comp_awards.original_service_connection_date, comp_awards.customer_id, loan_guaranties.closing_date, loan_guaranties.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_guaranties.loan_id]
            - [comp_awards.customer_id]
          action_bindings:
            loan_guaranties.loan_id: loan_id
            comp_awards.customer_id: customer_id
    params:
      funding_fee_exemption_bases: =funding_fee_exemption_bases

  - id: loan_evt_funding_fee_refund
    subject: [loan_funding_fee_refunded]
    rule: >-
      A funding fee is refunded when the loan's exemption has been recognized after closing (a retroactive compensation
      award or a Purple Heart received after closing) or the fee was collected in error. A refund is issued only when the loan record shows the veteran as exempt from the funding fee. The refund equals the
      full fee collected on that loan, is paid by VA directly to the veteran, and each funding fee charge is refunded
      only once. A fee on a loan the veteran has since paid off or refinanced is still refundable.
    eligibility:
      - id: loan_marked_exempt
        applies_to: [loan_funding_fee_refunded]
        kind: state
        condition: A refund is issued only when the loan record shows the veteran as exempt from the funding fee.
        evidence_fields: [loan_guaranties.funding_fee_exempt, loan_guaranties.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_guaranties.loan_id]
          action_bindings:
            loan_guaranties.loan_id: loan_id
        state_contract:
          field: loan_guaranties.funding_fee_exempt
          allowed: [true]
      - id: refund_once
        applies_to: [loan_funding_fee_refunded]
        kind: dedup
        condition: each funding fee charge is refunded only once
        evidence_fields: [loan_transactions.source_txn_id, loan_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_transactions.source_txn_id]
          action_bindings:
            loan_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: loan_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [loan_funding_fee_refunded]}
          distinct_fields: []
    params:
      refund_on_retroactive_award: =refund_on_retroactive_award
      refund_method: =refund_method

  - id: loan_evt_default_servicing
    subject: [loan_default_reported, loan_default_cured, loan_partial_claim_paid, loan_servicing_updated]
    rule: >-
      A loan is reported in default when a payment is default_report_days days past due. The servicer must consider home
      retention before liquidation, in this order: repayment plan, forbearance, loan modification, then a VA partial
      claim, then a compromise sale or deed in lieu; a servicer may not make the first foreclosure filing before
      foreclosure_min_delinquency_days days of delinquency. A partial claim is paid only on a loan whose status is in_default. It requires at least partial_claim_min_delinquent_payments missed monthly payments, never exceeds
      partial_claim_max_pct_upb percent of the unpaid principal balance at the first unpaid installment, bears
      partial_claim_interest_rate_pct percent interest, and becomes due when the loan is paid off, refinanced or the home
      sold. The servicer, not VA, decides plans, forbearance and modifications; VA's agent can explain options but
      cannot approve them.
    eligibility:
      - id: partial_claim_delinquency
        applies_to: [loan_partial_claim_paid]
        kind: state
        condition: A partial claim is paid only on a loan whose status is in_default.
        evidence_fields: [loan_guaranties.status, loan_guaranties.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_guaranties.loan_id]
          action_bindings:
            loan_guaranties.loan_id: loan_id
        state_contract:
          field: loan_guaranties.status
          allowed: [in_default]
    params:
      default_report_days: =default_report_days
      foreclosure_min_delinquency_days: =foreclosure_min_delinquency_days
      partial_claim_max_pct_upb: =partial_claim_max_pct_upb
      partial_claim_interest_rate_pct: =partial_claim_interest_rate_pct
      partial_claim_due_on_payoff: =partial_claim_due_on_payoff
      partial_claim_min_delinquent_payments: =partial_claim_min_delinquent_payments
    formula:
      max_partial_claim: "round(unpaid_principal_balance * partial_claim_max_pct_upb / 100, 2)"

  - id: loan_evt_liquidation_and_debt
    subject: [loan_foreclosed, loan_guaranty_claim_paid, loan_partial_claim_repaid]
    rule: >-
      When a defaulted loan is liquidated by foreclosure, compromise sale or deed in lieu, VA pays the holder a guaranty
      claim no larger than the guaranty. The claim paid creates a Home Loan Guaranty Debt for the veteran unless the
      veteran was released from liability on an approved assumption. A borrower completing a compromise sale or deed in
      lieu may receive up to relocation_assistance_max in relocation assistance. Any unpaid partial claim is repaid from
      sale proceeds before the veteran receives anything.
    eligibility: []
    params:
      claim_deficiency_creates_debt: =claim_deficiency_creates_debt
      relocation_assistance_max: =relocation_assistance_max

  - id: loan_evt_entitlement_restoration
    subject: [loan_entitlement_restored]
    rule: >-
      Entitlement charged to a loan is restored when the loan has been paid in full and the property sold or otherwise
      disposed of, or when a qualifying veteran buyer assumes the loan and substitutes their own entitlement.
      Entitlement is restored only for a loan whose status is paid_in_full, released_by_assumption or foreclosed. A veteran
      who paid the loan in full but still owns the property may restore entitlement under one_time_restoration_allowed
      only once in a lifetime (loan_msr_one_time_restorations_used); a further restoration requires disposal of every
      property restored that way. Entitlement on a foreclosed loan is restored only after the resulting guaranty debt is
      repaid in full. Each loan's entitlement is restored only once.
    eligibility:
      - id: loan_closed_for_restoration
        applies_to: [loan_entitlement_restored]
        kind: state
        condition: Entitlement is restored only for a loan whose status is paid_in_full, released_by_assumption or foreclosed.
        evidence_fields: [loan_guaranties.status, loan_guaranties.loan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loan_guaranties.loan_id]
          action_bindings:
            loan_guaranties.loan_id: loan_id
        state_contract:
          field: loan_guaranties.status
          allowed: [paid_in_full, released_by_assumption, foreclosed]
    params:
      one_time_restoration_allowed: =one_time_restoration_allowed
      restoration_requires_disposal: =restoration_requires_disposal
      substitution_of_entitlement_allowed: =substitution_of_entitlement_allowed
    measures: [loan_msr_one_time_restorations_used]

  - id: loan_evt_assumption
    subject: [loan_assumed_with_release]
    rule: >-
      A buyer may assume a VA loan; the veteran is released from liability only when the buyer qualifies with the
      servicer or VA and contractually assumes the obligations. The buyer pays an assumption funding fee of
      assumption_fee_pct percent of the balance, and the servicer may charge no more than assumption_processing_fee_max
      for processing. Releasing the veteran's liability is requested by the veteran as the seller and is never initiated
      by VA on their behalf; without a release, the veteran stays liable for any later claim. The veteran's entitlement
      stays charged after a release unless the buyer is a veteran who substitutes entitlement.
    eligibility: []
    params:
      assumption_fee_pct: =assumption_fee_pct
      assumption_processing_fee_max: =assumption_processing_fee_max
      release_requires_buyer_creditworthy: =release_requires_buyer_creditworthy

  - id: loan_program_terms
    subject: [loan_guaranty_issued]
    rule: >-
      Each program sets its own maximum loan-to-value, maximum term and, for the Native American Direct Loan, a VA interest
      rate and a trust-land requirement. A refinance (rate reduction or cash-out) closes only after refinance_seasoning_days
      days from the first payment due date of the loan being refinanced and refinance_min_payments monthly payments; a rate
      reduction refinance must lower a fixed rate by at least irrrl_min_rate_reduction_pct points, recoup its costs within
      irrrl_recoupment_months months, and extend the term by no more than irrrl_term_extension_max_years years. The veteran
      must occupy the home within occupancy_deadline_days days of closing (up to occupancy_max_delay_months months with a
      documented reason); a rate reduction refinance needs only prior occupancy. Lenders may charge an origination fee of
      no more than origination_fee_max_pct percent, seller concessions are limited to seller_concession_max_pct percent,
      energy efficient improvements up to energy_efficient_improvements_max may be added, and an appraisal is valid for
      appraisal_validity_days days.
    eligibility: []
    params:
      per_tier:
        VA Interest Rate Reduction Refinance Loan (IRRRL): {max_ltv_pct: =max_ltv_pct, max_term_years: =max_term_years, nadl_interest_rate_pct: =nadl_interest_rate_pct, trust_land_required: =trust_land_required}
        VA Manufactured Home Loan: {max_ltv_pct: =max_ltv_pct, max_term_years: =max_term_years, nadl_interest_rate_pct: =nadl_interest_rate_pct, trust_land_required: =trust_land_required}
        VA Purchase Loan (10% or More Down): {max_ltv_pct: =max_ltv_pct, max_term_years: =max_term_years, nadl_interest_rate_pct: =nadl_interest_rate_pct, trust_land_required: =trust_land_required}
        VA Purchase Loan (5% to Less Than 10% Down): {max_ltv_pct: =max_ltv_pct, max_term_years: =max_term_years, nadl_interest_rate_pct: =nadl_interest_rate_pct, trust_land_required: =trust_land_required}
        VA Purchase Loan (Less Than 5% Down): {max_ltv_pct: =max_ltv_pct, max_term_years: =max_term_years, nadl_interest_rate_pct: =nadl_interest_rate_pct, trust_land_required: =trust_land_required}
        VA Cash-Out Refinance Loan: {max_ltv_pct: =max_ltv_pct, max_term_years: =max_term_years, nadl_interest_rate_pct: =nadl_interest_rate_pct, trust_land_required: =trust_land_required}
        Native American Direct Loan (NADL): {max_ltv_pct: =max_ltv_pct, max_term_years: =max_term_years, nadl_interest_rate_pct: =nadl_interest_rate_pct, trust_land_required: =trust_land_required}
      refinance_seasoning_days: =refinance_seasoning_days
      refinance_min_payments: =refinance_min_payments
      irrrl_min_rate_reduction_pct: =irrrl_min_rate_reduction_pct
      irrrl_recoupment_months: =irrrl_recoupment_months
      irrrl_term_extension_max_years: =irrrl_term_extension_max_years
      occupancy_deadline_days: =occupancy_deadline_days
      occupancy_max_delay_months: =occupancy_max_delay_months
      origination_fee_max_pct: =origination_fee_max_pct
