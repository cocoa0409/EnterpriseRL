events:
  - type: pension_award_established
    target: pension_awards
    mutation: create
    meaning: VA grants a Veterans Pension claim and authorizes an award at the applicable rate category.
    grain: one row per veteran's pension award
    fields:
      customer_id: The veteran.
      variant_name: Rate category granted.
      effective_date: Effective date of the award.
      qualifying_wartime_period: Wartime period of qualifying service.
      annual_countable_income: Countable income determined on the claim.
      unreimbursed_medical_expenses: Medical expenses accepted on the claim.
      net_worth: Net worth determined on the claim.
      additional_children_count: Additional children recognized.
      medicaid_nursing_home: Whether in a Medicaid-covered nursing home.
      payment_method: Delivery method.
      payment_account_last4: Account last four digits, or empty.
      opened_date: Authorization date.
    triggers: []

  - type: pension_award_activated
    target: pension_awards
    mutation: {transition: {from: authorized, to: running}}
    meaning: The first monthly pension payment is released.
    grain: one row per transaction
    fields:
      status: Set to running.
    triggers: []

  - type: pension_award_suspended
    target: pension_awards
    mutation: {transition: {from: running, to: suspended}}
    meaning: Payments stop while a cause of suspension is unresolved.
    grain: one row per transaction
    fields:
      status: Set to suspended.
      suspension_reason: Cause.
    triggers: []

  - type: pension_award_resumed
    target: pension_awards
    mutation: {transition: {from: suspended, to: running}}
    meaning: The cause of suspension is cured and payments resume.
    grain: one row per transaction
    fields:
      status: Set to running.
      suspension_reason: Reset to none.
    triggers:
      - event: pension:pension_retro_payment
        map: {pension_award_id: pension_award_id, customer_id: customer_id}

  - type: pension_award_terminated
    target: pension_awards
    mutation: {transition: [{from: running, to: terminated}, {from: suspended, to: terminated}]}
    meaning: The pension award ends.
    grain: one row per transaction
    fields:
      status: Set to terminated.
      termination_reason: Why it ended.
      closed_date: Termination date.
    triggers: []

  - type: pension_rate_category_changed
    target: pension_awards
    mutation: update
    meaning: The rate category changes because aid and attendance or housebound status is granted or a dependent is added or removed.
    grain: one row per transaction
    fields:
      variant_name: New rate category.
      effective_date: Effective date of the new category.
      additional_children_count: Updated additional children.
    triggers: []

  - type: pension_financials_updated
    target: pension_awards
    mutation: update
    meaning: The income, medical expense, net worth or nursing-home facts on the award are updated from an accepted report or adjustment.
    grain: one row per transaction
    fields:
      annual_countable_income: Updated countable income.
      unreimbursed_medical_expenses: Updated accepted medical expenses.
      net_worth: Updated net worth.
      medicaid_nursing_home: Updated Medicaid nursing-home flag.
      medicaid_admission_date: Admission date, or empty.
    triggers: []

  - type: pension_payment_profile_updated
    target: pension_awards
    mutation: update
    meaning: The veteran changes how pension is delivered.
    grain: one row per transaction
    fields:
      payment_method: New method.
      payment_account_last4: New account last four digits, or empty.
    triggers: []

  - type: pension_monthly_payment
    target: pension_payments
    meaning: Pension for one entitlement month is issued in arrears.
    grain: one row per award per entitlement month
    distinguish_by: [payment_month]
    fields:
      pension_award_id: Award paid.
      customer_id: Veteran paid.
      payment_month: Month covered.
      payment_date: Issue date.
      gross_amount: Monthly entitlement.
      offset_withheld_amount: Withheld for a debt.
      net_amount: Delivered amount.
      offset_applied: Whether an offset was taken.
    account: pension_paid
    direction: in
    triggers:
      - event: debt:debt_offset_collected
        when: {offset_applied: true}
        map: {customer_id: customer_id, amount: offset_withheld_amount, source_payment_id: pension_payment_id, transaction_date: payment_date, collection_source: pension_offset}

  - type: pension_retro_payment
    target: pension_payments
    meaning: Past-due pension for a span of months is released after a favorable adjustment or the end of a suspension.
    grain: one row per release of past-due pension
    distinguish_by: [adjustment_id, retro_period_start, retro_period_end]
    fields:
      pension_award_id: Award paid.
      customer_id: Veteran paid.
      adjustment_id: Rate adjustment that created it, or empty for a release after suspension.
      retro_period_start: First month covered.
      retro_period_end: Last month covered.
      payment_month: Last month covered.
      payment_date: Issue date.
      gross_amount: Past-due amount.
      offset_withheld_amount: Withheld for a debt.
      net_amount: Delivered amount.
      offset_applied: Whether an offset was taken.
    account: pension_paid
    direction: in
    triggers:
      - event: debt:debt_offset_collected
        when: {offset_applied: true}
        map: {customer_id: customer_id, amount: offset_withheld_amount, source_payment_id: pension_payment_id, transaction_date: payment_date, collection_source: pension_offset}

  - type: pension_payment_returned
    target: pension_payments
    meaning: The Treasury returns an issued pension payment.
    grain: one row per returned payment
    distinguish_by: [source_payment_id]
    fields:
      pension_award_id: Award.
      customer_id: Veteran.
      source_payment_id: Payment returned.
      payment_month: Month of the payment returned.
      payment_date: Date funds came back.
      gross_amount: Gross of the payment returned.
      net_amount: Negative of the net returned.
      return_reason: Why it came back.
    account: pension_paid
    direction: out
    triggers: []

  - type: pension_income_change_reported
    target: pension_income_reports
    meaning: The veteran reports that a source of household income started, stopped or changed.
    grain: one row per income source change reported
    distinguish_by: [income_source, change_effective_date]
    fields:
      pension_award_id: Award.
      customer_id: Veteran.
      income_source: Source that changed.
      annual_amount: New annualized amount from that source (0.00 when it stopped).
      change_effective_date: Date the change began.
      received_date: Date VA received the report.
      report_channel: Channel used.
    triggers: []

  - type: pension_medical_expenses_reported
    target: pension_income_reports
    meaning: The veteran reports unreimbursed medical expenses paid for a period.
    grain: one row per expense period reported
    distinguish_by: [expense_period_start, expense_period_end]
    fields:
      pension_award_id: Award.
      customer_id: Veteran.
      expense_period_start: Period start.
      expense_period_end: Period end.
      medical_expense_amount: Unreimbursed expenses paid.
      received_date: Date received.
      report_channel: Channel used.
    triggers: []

  - type: pension_asset_transfer_reported
    target: pension_income_reports
    meaning: A transfer of assets for less than fair market value is reported or discovered.
    grain: one row per transfer
    distinguish_by: [transfer_date, transfer_amount]
    fields:
      pension_award_id: Award.
      customer_id: Veteran.
      transfer_date: Transfer date.
      transfer_amount: Uncompensated value.
      received_date: Date VA learned of it.
      report_channel: Channel used.
    triggers: []

  - type: pension_income_match_found
    target: pension_income_reports
    meaning: A data match with the Social Security Administration or the IRS shows income the award does not reflect, and VA sends a due-process notice.
    grain: one row per matched source per year
    distinguish_by: [income_source, change_effective_date]
    fields:
      pension_award_id: Award.
      customer_id: Veteran.
      income_source: Matched source.
      annual_amount: Matched annual amount.
      change_effective_date: Date the matched income began.
      received_date: Date of the due-process notice.
      report_channel: Always va_initiated.
    triggers: []

  - type: pension_rate_adjusted
    target: pension_income_reports
    meaning: VA recomputes the annual pension from an accepted report or a matched discrepancy.
    grain: one row per adjustment per source report
    distinguish_by: [source_report_id]
    fields:
      pension_award_id: Award.
      customer_id: Veteran.
      source_report_id: Report or match behind the adjustment.
      change_effective_date: Effective date of the new rate.
      received_date: Date the adjustment was processed.
      adjusted_annual_rate: New annual pension.
      penalty_months: Penalty months for an asset transfer, otherwise 0.
      overpayment_created: Whether months already paid at a higher rate are reached.
      report_channel: Channel of the source report.
    triggers:
      - event: pension:pension_financials_updated
        map: {}
      - event: debt:debt_established
        when: {overpayment_created: true}
        map: {customer_id: customer_id, variant_name: Veterans Pension Overpayment, source_record_id: report_id, source_category: pension}

measures:
  - id: pension_msr_months_overpaid
    window: From the first entitlement month paid at the new rate under one adjustment's effective date through the most recent pension_monthly_payment.
    measure: Count of pension_monthly_payment entries on the award whose payment_month is on or after that first month and whose gross_amount exceeds the adjusted monthly rate.
  - id: pension_msr_returned_payments_window
    window: Rolling returned_payments_window_months calendar months ending on the current date.
    measure: Count of pension_payment_returned entries on the award whose payment_date falls in the window.
  - id: pension_msr_annual_medical_expenses
    window: The twelve-month expense period being evaluated (calendar year for a retroactive report, the next twelve months for a prospective one).
    measure: Sum of medical_expense_amount over pension_medical_expenses_reported entries whose expense period lies inside the window.

policies:
  - id: pension_agg_multi_holding
    subject: [pension_award_established]
    rule: >-
      A veteran holds at most one Veterans Pension award; a change of rate category is an update to that award, never a
      second award. A new award is established only when the veteran holds no pension award whose status is
      authorized, running or suspended. When two veterans are married to each other, each holds their own award.
    eligibility:
      - id: no_open_pension
        applies_to: [pension_award_established]
        kind: dedup
        condition: A new award is established only when the veteran holds no pension award whose status is authorized, running or suspended.
        evidence_fields: [pension_awards.customer_id, pension_awards.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pension_awards.customer_id]
          action_bindings:
            pension_awards.customer_id: customer_id
        dedup_contract:
          table: pension_awards
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [authorized, running, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: pension_rate_computation
    subject: [pension_monthly_payment, pension_rate_adjusted, pension_financials_updated]
    rule: >-
      Pension is income-based: the annual pension equals the maximum annual pension rate of the rate category, plus the
      additional child increment for each additional child, minus countable income after the medical deduction, and is
      never below zero. Countable income is the annualized income of the veteran from every source except the excluded
      sources, plus the spouse's income where the rate category counts spouse income. Unreimbursed medical expenses
      reduce countable income only by the amount that exceeds medical_expense_threshold_pct percent of the category's
      medical_deduction_base_mapr, and the deduction can bring countable income down to zero but never below it. The
      monthly pension is the annual pension divided by 12, rounded down to the whole dollar. A monthly payment is released only while the award status is running.
    eligibility:
      - id: pension_running
        applies_to: [pension_monthly_payment]
        kind: state
        condition: A monthly payment is released only while the award status is running.
        evidence_fields: [pension_awards.status, pension_awards.pension_award_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pension_awards.pension_award_id]
          action_bindings:
            pension_awards.pension_award_id: pension_award_id
        state_contract:
          field: pension_awards.status
          allowed: [running]
    params:
      per_tier:
        Veterans Pension (Basic Rate, No Dependents): {mapr_annual: =mapr_annual, medical_deduction_base_mapr: =medical_deduction_base_mapr, spouse_income_counted: =spouse_income_counted}
        Veterans Pension (Basic Rate, One Dependent): {mapr_annual: =mapr_annual, medical_deduction_base_mapr: =medical_deduction_base_mapr, spouse_income_counted: =spouse_income_counted}
        Veterans Pension (Housebound, No Dependents): {mapr_annual: =mapr_annual, medical_deduction_base_mapr: =medical_deduction_base_mapr, spouse_income_counted: =spouse_income_counted}
        Veterans Pension (Housebound, One Dependent): {mapr_annual: =mapr_annual, medical_deduction_base_mapr: =medical_deduction_base_mapr, spouse_income_counted: =spouse_income_counted}
        Veterans Pension (Aid and Attendance, No Dependents): {mapr_annual: =mapr_annual, medical_deduction_base_mapr: =medical_deduction_base_mapr, spouse_income_counted: =spouse_income_counted}
        Veterans Pension (Aid and Attendance, One Dependent): {mapr_annual: =mapr_annual, medical_deduction_base_mapr: =medical_deduction_base_mapr, spouse_income_counted: =spouse_income_counted}
      additional_child_increment: =additional_child_increment
      medical_expense_threshold_pct: =medical_expense_threshold_pct
      excluded_income_sources: =excluded_income_sources
      monthly_rate_rounding: =monthly_rate_rounding
      final_expenses_deductible: =final_expenses_deductible
    formula:
      deductible_medical: "max(0, unreimbursed_medical_expenses - medical_deduction_base_mapr * medical_expense_threshold_pct / 100)"
      annual_pension: "max(0, mapr_annual + additional_child_increment * additional_children_count - max(0, annual_countable_income - deductible_medical))"
      monthly_pension: "annual_pension / 12"

  - id: pension_payment_schedule
    subject: [pension_award_activated, pension_monthly_payment, pension_payment_profile_updated, pension_payment_returned, pension_award_suspended, pension_award_resumed]
    rule: >-
      Pension is paid monthly in arrears on the payment_day_of_month of the following month, moved to the last preceding
      business day when that day falls on a weekend or federal holiday, and payment of a new award begins with the month
      after the month of the effective date. An account change applies to a payment only when recorded at least
      direct_deposit_change_lead_days calendar days before its issue date, and only the veteran can make it after the
      caller's identity is verified. An award is suspended when returned_payments_suspension_count or more payments come
      back within returned_payments_window_months (pension_msr_returned_payments_window) or the veteran's whereabouts are
      unknown, and it resumes once a current address or account is confirmed, with the withheld months released in one
      retroactive payment. The payment for the month of the veteran's death is released to the surviving spouse; payments
      for later months are reclaimed.
    eligibility: []
    params:
      payment_day_of_month: =payment_day_of_month
      payment_start_lag_months: =payment_start_lag_months
      direct_deposit_change_lead_days: =direct_deposit_change_lead_days
      returned_payments_suspension_count: =returned_payments_suspension_count
      returned_payments_window_months: =returned_payments_window_months
      month_of_death_payable: =month_of_death_payable
    measures: [pension_msr_returned_payments_window]

  - id: pension_evt_income_change
    subject: [pension_income_change_reported, pension_rate_adjusted, pension_retro_payment]
    rule: >-
      Every change in a household income source must be reported, and the veteran may report it by telephone, online or
      by mail. An income decrease raises the rate from the first day of the month after the month the change began, and
      the higher amount for months already paid is released as a retroactive payment. An income increase lowers the rate
      effective the last day of the month in which the change began, and the lower rate is paid from the following month;
      when months at the old higher rate have already been paid, the adjustment records an overpayment equal to the
      difference between the old and new monthly amounts for each such month (pension_msr_months_overpaid) and a Veterans
      Pension Overpayment debt is established. When the new countable income leaves no pension payable, the award is
      terminated for excess income.
    eligibility: []
    params:
      income_change_effective_lag_months: =income_change_effective_lag_months
      income_decrease_effective_rule: =income_decrease_effective_rule
      income_increase_effective_rule: =income_increase_effective_rule
      unreported_income_creates_overpayment: =unreported_income_creates_overpayment
    measures: [pension_msr_months_overpaid]

  - id: pension_evt_medical_expenses
    subject: [pension_medical_expenses_reported, pension_rate_adjusted, pension_retro_payment]
    rule: >-
      Unreimbursed medical expenses (insurance premiums including Medicare Part B, in-home attendant and assisted-living
      care costs, and out-of-pocket treatment) reduce countable income. Recurring expenses are annualized over
      prospective_expense_annualization_months months for the prospective rate. Unreimbursed medical expenses for a past expense period are used for a retroactive adjustment only if they are reported not later than medical_expense_report_window_months calendar months after the last day of the expense period. Add the months to the last day of the expense period; when the resulting month has no such day, use the last day of that month, and a report received on that date is timely.
      The annual total for the evaluated period (pension_msr_annual_medical_expenses) replaces the prior figure, and
      any resulting increase for months already paid is released as a retroactive payment.
    eligibility:
      - id: retro_expense_window
        applies_to: [pension_medical_expenses_reported]
        kind: time
        condition: Unreimbursed medical expenses for a past expense period are used for a retroactive adjustment only if they are reported not later than medical_expense_report_window_months calendar months after the last day of the expense period.
        evidence_fields: [pension_income_reports.expense_period_end, pension_income_reports.report_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [pension_income_reports.report_id]
          action_bindings:
            pension_income_reports.report_id: report_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the last day of the expense period
          anchor_source: pension_income_reports.expense_period_end
          relation: not_after
          duration_source: variants.medical_expense_report_window_months
          unit: calendar_months
          counting_rule: Add the months to the last day of the expense period; when the resulting month has no such day, use the last day of that month, and a report received on that date is timely.
          boundary: inclusive
    params:
      prospective_expense_annualization_months: =prospective_expense_annualization_months
      medical_expense_report_window_months: =medical_expense_report_window_months
    measures: [pension_msr_annual_medical_expenses]

  - id: pension_evt_net_worth_and_transfers
    subject: [pension_asset_transfer_reported, pension_rate_adjusted, pension_award_terminated]
    rule: >-
      No pension is payable while net worth - assets other than the primary residence and a residential lot of up to
      residence_lot_exclusion_acres acres, plus annual countable income - exceeds net_worth_limit; an award whose net worth
      rises above the limit is terminated for excess net worth, and the veteran may reapply once net worth is at or below
      it. A transfer is penalized only when the date of the asset transfer is not more than asset_transfer_lookback_months calendar months before the date VA receives the claim or the report of the transfer. Add the look-back months to the transfer date; when the resulting month has no such day, use the last day of that month, and a report received on that date is still within the look-back period.
      The covered amount is the part of the uncompensated transfer that would have put net worth above the limit; the
      penalty period is the covered amount divided by penalty_rate_monthly, rounded down to whole months, never more than
      penalty_max_months, and it starts the first day of the month after the month of the last transfer. No pension is
      paid during the penalty period. A transfer to a trust for a child who cannot self-support is not penalized.
    eligibility:
      - id: lookback
        applies_to: [pension_asset_transfer_reported]
        kind: time
        condition: A transfer is penalized only when the date of the asset transfer is not more than asset_transfer_lookback_months calendar months before the date VA receives the claim or the report of the transfer.
        evidence_fields: [pension_income_reports.transfer_date, pension_income_reports.report_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [pension_income_reports.report_id]
          action_bindings:
            pension_income_reports.report_id: report_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the asset transfer
          anchor_source: pension_income_reports.transfer_date
          relation: not_after
          duration_source: variants.asset_transfer_lookback_months
          unit: calendar_months
          counting_rule: Add the look-back months to the transfer date; when the resulting month has no such day, use the last day of that month, and a report received on that date is still within the look-back period.
          boundary: inclusive
    params:
      net_worth_limit: =net_worth_limit
      net_worth_includes_annual_income: =net_worth_includes_annual_income
      residence_lot_exclusion_acres: =residence_lot_exclusion_acres
      asset_transfer_lookback_months: =asset_transfer_lookback_months
      penalty_rate_monthly: =penalty_rate_monthly
      penalty_max_months: =penalty_max_months
      penalty_month_rounding: =penalty_month_rounding
      exempt_transfer_child_trust: =exempt_transfer_child_trust
      reapply_after_net_worth_decrease: =reapply_after_net_worth_decrease
    formula:
      covered_amount: "max(0, min(transfer_amount, net_worth + transfer_amount - net_worth_limit))"
      penalty_months: "min(penalty_max_months, covered_amount / penalty_rate_monthly)"

  - id: pension_evt_income_match
    subject: [pension_income_match_found, pension_rate_adjusted, pension_award_suspended]
    rule: >-
      When a Social Security or IRS data match shows income the award does not reflect, VA sends a due-process notice
      proposing to adjust the rate from the date the matched income began. The proposed adjustment from an income match is made only after income_match_response_days calendar days have passed since the date of the income-match notice. Count calendar days starting the day after the notice date; the adjustment may be made on the day after the last day of the period.
      A hearing requested within income_match_hearing_request_days days of the notice delays the adjustment until the
      hearing. Evidence that the matched income is wrong or was already reported is weighed before adjusting; a
      confirmed discrepancy is adjusted like a late-reported income increase and may create an overpayment.
    eligibility:
      - id: due_process_elapsed
        applies_to: [pension_rate_adjusted]
        kind: time
        condition: The proposed adjustment from an income match is made only after income_match_response_days calendar days have passed since the date of the income-match notice.
        evidence_fields: [pension_income_reports.received_date, pension_income_reports.report_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pension_income_reports.report_id]
          action_bindings:
            pension_income_reports.report_id: source_report_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the income-match notice
          anchor_source: pension_income_reports.received_date
          relation: not_before
          duration_source: variants.income_match_response_days
          unit: calendar_days
          counting_rule: Count calendar days starting the day after the notice date; the adjustment may be made on the day after the last day of the period.
          boundary: exclusive
    params:
      income_match_response_days: =income_match_response_days
      income_match_hearing_request_days: =income_match_hearing_request_days

  - id: pension_evt_medicaid_nursing_home
    subject: [pension_financials_updated, pension_monthly_payment]
    rule: >-
      A veteran whose rate category has medicaid_cap_applies true and who resides in a Medicaid-approved nursing home with
      Medicaid covering the cost is paid no more than medicaid_nursing_home_cap_monthly per month, starting with the first
      month after medicaid_cap_start_months_after_admission full months following the month of admission; the limit does
      not apply to a veteran with a spouse or child. Leaving the facility or losing Medicaid coverage ends the limit from
      the first day of the following month.
    eligibility: []
    params:
      per_tier:
        Veterans Pension (Basic Rate, No Dependents): {medicaid_cap_applies: =medicaid_cap_applies}
        Veterans Pension (Basic Rate, One Dependent): {medicaid_cap_applies: =medicaid_cap_applies}
        Veterans Pension (Housebound, No Dependents): {medicaid_cap_applies: =medicaid_cap_applies}
        Veterans Pension (Housebound, One Dependent): {medicaid_cap_applies: =medicaid_cap_applies}
        Veterans Pension (Aid and Attendance, No Dependents): {medicaid_cap_applies: =medicaid_cap_applies}
        Veterans Pension (Aid and Attendance, One Dependent): {medicaid_cap_applies: =medicaid_cap_applies}
      medicaid_nursing_home_cap_monthly: =medicaid_nursing_home_cap_monthly
      medicaid_cap_start_months_after_admission: =medicaid_cap_start_months_after_admission

  - id: pension_evt_care_and_dependents
    subject: [pension_rate_category_changed, pension_retro_payment]
    rule: >-
      An aid-and-attendance or housebound rate category is granted only on a physician's examination report where the
      category requires one. Housebound status needs a single permanent disability rated housebound_single_disability_pct
      percent plus a separate disability rated housebound_additional_disability_pct percent or more, or permanent
      confinement to the home; a veteran who meets aid-and-attendance criteria is paid at the aid-and-attendance rate
      instead. Moving between a no-dependent and a one-dependent category requires a dependency claim received online or
      by mail, effective on the marriage or birth date when the claim arrives within dependency_report_window_days of it
      and on the claim date otherwise; a child counts until the child_age_limit_years birthday, or the
      school_child_age_limit_years birthday while in school. A higher category is paid from the month after its effective
      date, with months already paid at the lower rate released as a retroactive payment.
    eligibility: []
    params:
      per_tier:
        Veterans Pension (Basic Rate, No Dependents): {aa_medical_form_required: =aa_medical_form_required}
        Veterans Pension (Basic Rate, One Dependent): {aa_medical_form_required: =aa_medical_form_required}
        Veterans Pension (Housebound, No Dependents): {aa_medical_form_required: =aa_medical_form_required}
        Veterans Pension (Housebound, One Dependent): {aa_medical_form_required: =aa_medical_form_required}
        Veterans Pension (Aid and Attendance, No Dependents): {aa_medical_form_required: =aa_medical_form_required}
        Veterans Pension (Aid and Attendance, One Dependent): {aa_medical_form_required: =aa_medical_form_required}
      housebound_single_disability_pct: =housebound_single_disability_pct
      housebound_additional_disability_pct: =housebound_additional_disability_pct
      aa_includes_housebound: =aa_includes_housebound
      dependent_rate_requires_dependency_claim: =dependent_rate_requires_dependency_claim
      dependency_report_window_days: =dependency_report_window_days
      child_age_limit_years: =child_age_limit_years
      school_child_age_limit_years: =school_child_age_limit_years

  - id: pension_entitlement_basics
    subject: [pension_award_established]
    rule: >-
      Pension is payable only to a veteran discharged under conditions other than dishonorable who served at least
      min_wartime_service_days days of active duty with at least one day during a wartime period (or, for an enlisted
      veteran who entered after September 7, 1980, at least post_1980_min_service_months months or the full period called
      up), and who is age_presumption_total_disability or older, permanently and totally disabled, a nursing-home patient
      or receiving Social Security disability benefits. A claim takes the date of an intent to file received within
      itf_validity_days days before it; a veteran whose disability prevented filing may have the award reach back
      incapacity_retro_days days before the date of claim.
    eligibility: []
    params:
      min_wartime_service_days: =min_wartime_service_days
      post_1980_min_service_months: =post_1980_min_service_months
      age_presumption_total_disability: =age_presumption_total_disability
      itf_validity_days: =itf_validity_days
      incapacity_retro_days: =incapacity_retro_days

  - id: pension_excl_compensation
    subject: [pension_award_established, pension_award_terminated]
    rule: >-
      Veterans Pension and Disability Compensation are never paid to the same veteran for the same month. A veteran
      holding a running compensation award who qualifies for pension, or a pensioner later granted compensation, is
      paid the greater benefit unless they elect otherwise in writing, because election_greater_benefit_default is true;
      when compensation is the greater, the pension award is terminated with reason election_of_compensation effective
      the last day of the month before compensation becomes payable. The election is the veteran's own act and is never
      made for them on a call. Compensation paid to the veteran counts as income for pension.
    eligibility: []
    params:
      election_greater_benefit_default: =election_greater_benefit_default

extended_policies:
  - id: pension_ext_benefit_income_statement
    base_policy_refs: [pension_evt_income_change, pension_excl_compensation]
    overwrite:
      - base_policy: pension_excl_compensation
        superseded_clause: >-
          Compensation paid to the veteran counts as income for pension.
        replaced_by: >-
          Compensation paid to the veteran counts as income for pension only for months before pension was first
          paid; compensation paid for a month that pension also paid is settled against the pension for that month and
          is not counted as income.
    trigger: state_due
    subject: [pension_income_change_reported]
    computes: annual_amount
    target_tool: certify_benefit_income_d2f4edcf
    params:
      no_adjustment_factor: 1
      one_adjustment_factor: 1.028
      two_adjustment_factor: 1.0537
      one_adjustment_months: 12
      two_adjustment_months: 24
      months_per_year: 12
      fee_cap_share: 0.20
      fers_one_adjustment_factor: 1.02
      fers_two_adjustment_factor: 1.0404
      fresh_release_days: 90
      stale_release_days: 365
    rule: >-
      When monthly VA disability compensation paid to a pensioner for months his pension was also paid stops
      or changes, the veteran states in his own words the annual benefit income he receives in his own name,
      which is his Social Security, his federal civil service annuity and his VA disability compensation, and
      that statement is the income change report for the source that changed. The statement is dated as a
      change that began on the date the compensation award closed, or on the date of the latest compensation
      payment when the award has not closed. Every age the statement measures is measured to the date it
      carries, the day the change began, and not to the day the veteran files it. Compensation paid to the
      veteran counts as income for pension only for months before pension was first paid; compensation paid
      for a month that pension also paid is settled against the pension for that month and is not counted as
      income. The benefit income statement is the veteran's own Social Security figure plus his federal civil
      service annuity plus the VA disability compensation counted for him, rounded to the cent. In the
      standard statement the veteran's Social Security is the annual figure on his most recent Social Security
      report, or nothing when no Social Security report is on file, his annuity is the annual figure on his
      most recent annuity report, or nothing when none is on file, the monthly compensation is the total of
      the monthly compensation payments issued to him since the pension effective date, and every retroactive
      compensation release issued to him counts at its gross amount. A Social Security figure whose benefit
      level took effect 24 or more whole months before the statement is raised by the two most recent December
      cost-of-living increases together; a figure whose benefit level took effect 12 to 23 whole months before
      is raised by the most recent December increase; a figure under 12 whole months old is stated as
      reported. A federal civil service annuity under the Federal Employees Retirement System receives the
      reduced cost-of-living increase that system grants each December: an annuity figure whose level took
      effect 24 or more whole months before the statement is raised by the two most recent of those increases
      together; one that took effect 12 to 23 whole months before is raised by the most recent one; one under
      12 whole months old is stated as reported; the raised figure is rounded to the cent. When the
      compensation award ended by the veteran's election of pension and monthly compensation was issued since
      the pension effective date, no monthly compensation is stated, because every month it paid was also a
      month of pension; when the compensation award is still running and monthly compensation was issued in
      that period, the most recent monthly payment is stated for twelve months; in every other case the
      monthly compensation issued in that period is stated as issued. An accredited representative's fee
      withheld from a retroactive release under a direct-pay fee agreement is not the veteran's income: when a
      fee agreement is on file and the fee withheld is no more than the fee cap share of the release, the
      whole fee is taken out of the release; when an agreement is on file and the fee withheld exceeds that
      share, only the fee cap share of the release, rounded to the cent, is taken out; with no agreement on
      file nothing is taken out. The share of a retroactive release that counts is set by the months it
      covers: when the compensation effective date falls before the pension effective date and the release was
      issued after the pension effective date, only the share equal to the months before pension was first
      paid divided by the whole months from the compensation effective date to the release date counts, the
      months before pension was first paid being the whole months from the compensation effective date to the
      pension effective date plus the months by which pension payment starts after its effective date; when
      the compensation effective date falls on or after the pension effective date, none of it counts, because
      every month it covers is a month of pension; in every other case all of it counts. A retroactive release
      is one-time income that counts for the twelve months after it was deposited, so the releases count by
      when the most recent of them was deposited: when it was deposited after the fresh period but within one
      year before the statement, they count for the months left of its twelve-month year divided by twelve;
      when it was deposited more than one year before the statement, none of them counts; otherwise, deposited
      within the fresh period, they count in full. The share and that weight are applied to the releases less
      the fee taken out, and the result is rounded to the cent before the statement is totalled.
    prerequisite: []
    cross_category:
      - category: comp
        as: history
        reads: [termination_reason, status, effective_date, closed_date, attorney_fee_agreement_on_file, comp_payments.gross_amount, comp_payments.attorney_fee_withheld_amount, comp_payments.payment_date]
        note: The statement date, monthly, fee, share and deposit factors read the compensation award and its payment ledger for this veteran.
    compute:
      - statement_date: "CFIELD('comp','closed_date') or XLATEST('comp','comp_payments','payment_date', date_field='payment_date')"
      - ss_figure: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='social_security')"
      - ss_level_date: "LATEST('pension_income_reports','change_effective_date', date_field='received_date', event_type='pension_income_change_reported', income_source='social_security')"
      - ss_level_age: "MONTHS(ss_level_date, statement_date)"
      - ss_uplift: "K('two_adjustment_factor') if ss_level_age >= K('two_adjustment_months') else (K('one_adjustment_factor') if ss_level_age >= K('one_adjustment_months') else K('no_adjustment_factor'))"
      - ss_reports: "COUNT('pension_income_reports', event_type='pension_income_change_reported', income_source='social_security')"
      - ss_stated: "RND(ss_figure * ss_uplift, 2) if ss_reports > 0 else 0"
      - annuity_figure: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='retirement_pension') or 0"
      - annuity_level_date: "LATEST('pension_income_reports','change_effective_date', date_field='received_date', event_type='pension_income_change_reported', income_source='retirement_pension')"
      - annuity_level_age: "MONTHS(annuity_level_date, statement_date) if annuity_level_date else 0"
      - annuity_uplift: "K('fers_two_adjustment_factor') if annuity_level_age >= K('two_adjustment_months') else (K('fers_one_adjustment_factor') if annuity_level_age >= K('one_adjustment_months') else K('no_adjustment_factor'))"
      - annuity_stated: "RND(annuity_figure * annuity_uplift, 2)"
      - comp_ended_by_election: "CFIELD('comp','termination_reason') == 'election_of_pension'"
      - comp_running: "CFIELD('comp','status') == 'running'"
      - comp_monthly_count: "XCOUNT('comp','comp_payments', within_months=MONTHS(F('effective_date'), NOW), date_field='payment_date', event_type='comp_monthly_payment')"
      - comp_monthly_issued: "XSUM('comp','comp_payments','gross_amount', within_months=MONTHS(F('effective_date'), NOW), date_field='payment_date', event_type='comp_monthly_payment')"
      - comp_latest_monthly: "XLATEST('comp','comp_payments','gross_amount', date_field='payment_date', event_type='comp_monthly_payment')"
      - comp_monthly_stated: "0 if (comp_ended_by_election and comp_monthly_count > 0) else (comp_latest_monthly * K('months_per_year') if (comp_running and comp_monthly_count > 0) else comp_monthly_issued)"
      - retro_gross: "XSUM('comp','comp_payments','gross_amount', date_field='payment_date', event_type='comp_retro_payment')"
      - retro_fee: "XSUM('comp','comp_payments','attorney_fee_withheld_amount', date_field='payment_date', event_type='comp_retro_payment')"
      - fee_agreement: "CFIELD('comp','attorney_fee_agreement_on_file') == True"
      - fee_cap: "RND(retro_gross * K('fee_cap_share'), 2)"
      - fee_taken_out: "retro_fee if (fee_agreement and retro_fee <= fee_cap) else (fee_cap if (fee_agreement and retro_fee > fee_cap) else 0)"
      - comp_effective: "CFIELD('comp','effective_date')"
      - retro_release_date: "XLATEST('comp','comp_payments','payment_date', date_field='payment_date', event_type='comp_retro_payment')"
      - months_before_pension: "MONTHS(comp_effective, F('effective_date')) + P('payment_start_lag_months')"
      - months_to_release: "MONTHS(comp_effective, retro_release_date) if retro_release_date else 1"
      - retro_share: "months_before_pension / months_to_release if (comp_effective < F('effective_date') and retro_release_date and retro_release_date > F('effective_date')) else (0 if comp_effective >= F('effective_date') else K('no_adjustment_factor'))"
      - release_deposited: "XLATEST('comp','comp_payments','payment_date', date_field='payment_date', event_type='comp_retro_payment')"
      - release_age: "DAYS(release_deposited, statement_date) if release_deposited else K('stale_release_days') + 1"
      - release_weight: "(K('months_per_year') - MONTHS(release_deposited, statement_date)) / K('months_per_year') if (release_age > K('fresh_release_days') and release_age <= K('stale_release_days')) else (0 if release_age > K('stale_release_days') else K('no_adjustment_factor'))"
      - retro_counted: "RND((retro_gross - fee_taken_out) * retro_share * release_weight, 2)"
      - result: "RND(ss_stated + annuity_stated + comp_monthly_stated + retro_counted, 2)"
    compute_basis:
      statement_date: "Every age the statement measures is measured to the date it carries, the day the change began, and not to the day the veteran files it."
      ss_figure: "In the standard statement the veteran's Social Security is the annual figure on his most recent Social Security report"
      ss_level_date: "A Social Security figure whose benefit level took effect 24 or more whole months before the statement is raised by the two most recent December cost-of-living increases together"
      ss_level_age: "a figure whose benefit level took effect 12 to 23 whole months before is raised by the most recent December increase"
      ss_uplift: "A Social Security figure whose benefit level took effect 24 or more whole months before the statement is raised by the two most recent December cost-of-living increases together; a figure whose benefit level took effect 12 to 23 whole months before is raised by the most recent December increase; a figure under 12 whole months old is stated as reported."
      ss_reports: "or nothing when no Social Security report is on file"
      ss_stated: "the veteran's Social Security is the annual figure on his most recent Social Security report, or nothing when no Social Security report is on file"
      annuity_figure: "his annuity is the annual figure on his most recent annuity report, or nothing when none is on file"
      annuity_level_date: "an annuity figure whose level took effect 24 or more whole months before the statement"
      annuity_level_age: "one that took effect 12 to 23 whole months before is raised by the most recent one"
      annuity_uplift: "A federal civil service annuity under the Federal Employees Retirement System receives the reduced cost-of-living increase that system grants each December: an annuity figure whose level took effect 24 or more whole months before the statement is raised by the two most recent of those increases together; one that took effect 12 to 23 whole months before is raised by the most recent one; one under 12 whole months old is stated as reported"
      annuity_stated: "the raised figure is rounded to the cent."
      comp_ended_by_election: "When the compensation award ended by the veteran's election of pension and monthly compensation was issued since the pension effective date, no monthly compensation is stated"
      comp_running: "when the compensation award is still running and monthly compensation was issued in that period, the most recent monthly payment is stated for twelve months"
      comp_monthly_count: "monthly compensation was issued since the pension effective date"
      comp_monthly_issued: "the monthly compensation is the total of the monthly compensation payments issued to him since the pension effective date"
      comp_latest_monthly: "the most recent monthly payment is stated for twelve months"
      comp_monthly_stated: "When the compensation award ended by the veteran's election of pension and monthly compensation was issued since the pension effective date, no monthly compensation is stated, because every month it paid was also a month of pension; when the compensation award is still running and monthly compensation was issued in that period, the most recent monthly payment is stated for twelve months; in every other case the monthly compensation issued in that period is stated as issued."
      retro_gross: "every retroactive compensation release issued to him counts at its gross amount"
      retro_fee: "the fee withheld"
      fee_agreement: "when a fee agreement is on file"
      fee_cap: "only the fee cap share of the release, rounded to the cent, is taken out"
      fee_taken_out: "when a fee agreement is on file and the fee withheld is no more than the fee cap share of the release, the whole fee is taken out of the release; when an agreement is on file and the fee withheld exceeds that share, only the fee cap share of the release, rounded to the cent, is taken out; with no agreement on file nothing is taken out."
      comp_effective: "when the compensation effective date falls before the pension effective date and the release was issued after the pension effective date"
      retro_release_date: "the release was issued after the pension effective date"
      months_before_pension: "the months before pension was first paid being the whole months from the compensation effective date to the pension effective date plus the months by which pension payment starts after its effective date"
      months_to_release: "the whole months from the compensation effective date to the release date"
      retro_share: "The share of a retroactive release that counts is set by the months it covers: when the compensation effective date falls before the pension effective date and the release was issued after the pension effective date, only the share equal to the months before pension was first paid divided by the whole months from the compensation effective date to the release date counts, the months before pension was first paid being the whole months from the compensation effective date to the pension effective date plus the months by which pension payment starts after its effective date; when the compensation effective date falls on or after the pension effective date, none of it counts, because every month it covers is a month of pension; in every other case all of it counts."
      release_deposited: "the releases count by when the most recent of them was deposited"
      release_age: "when it was deposited more than one year before the statement, none of them counts"
      release_weight: "A retroactive release is one-time income that counts for the twelve months after it was deposited, so the releases count by when the most recent of them was deposited: when it was deposited after the fresh period but within one year before the statement, they count for the months left of its twelve-month year divided by twelve; when it was deposited more than one year before the statement, none of them counts; otherwise, deposited within the fresh period, they count in full."
      retro_counted: "The share and that weight are applied to the releases less the fee taken out, and the result is rounded to the cent before the statement is totalled."
      result: "The benefit income statement is the veteran's own Social Security figure plus his federal civil service annuity plus the VA disability compensation counted for him, rounded to the cent."
    factors:
      - id: social_security_adjustment_years
        effect: parameter
        decides: ss_uplift
        bindings: [ss_level_date, ss_level_age, ss_uplift]
        ladder:
          - when: "the veteran's Social Security figure took effect 24 or more whole months before the statement"
            value: "K('two_adjustment_factor') - the two most recent December cost-of-living increases together"
          - when: "the figure took effect 12 to 23 whole months before the statement"
            value: "K('one_adjustment_factor') - the most recent December increase"
          - when: "otherwise (under 12 whole months old)"
            value: "K('no_adjustment_factor') - stated as reported"
        baseline:
          ss_uplift: "K('no_adjustment_factor')"
        evidence: [history, date]
        cross_difficulty: null
      - id: monthly_compensation_treatment
        effect: method
        decides: comp_monthly_stated
        bindings: [comp_ended_by_election, comp_running, comp_monthly_count, comp_monthly_issued, comp_latest_monthly, comp_monthly_stated]
        ladder:
          - when: "the compensation award ended by an election of pension AND monthly compensation was issued since the pension effective date"
            method: "no monthly compensation is stated; those months are settled against the pension"
          - when: "the compensation award is running AND monthly compensation was issued in that period"
            method: "the most recent monthly payment is projected for twelve months"
          - when: "otherwise"
            method: "the monthly compensation issued since the pension effective date is stated as issued"
        baseline:
          comp_monthly_stated: "comp_monthly_issued"
        evidence: [cross_category, history]
        cross_difficulty: comp
      - id: representative_fee_on_release
        effect: parameter
        decides: fee_taken_out
        bindings: [retro_fee, fee_agreement, fee_cap, fee_taken_out]
        ladder:
          - when: "a direct-pay fee agreement is on file AND the fee withheld is no more than the fee cap share of the release"
            value: "the whole fee withheld"
          - when: "a direct-pay fee agreement is on file AND the fee withheld exceeds the fee cap share"
            value: "K('fee_cap_share') of the release, rounded to the cent"
          - when: "otherwise (no agreement on file)"
            value: "0"
        baseline:
          fee_taken_out: "0"
        evidence: [cross_category, history]
        cross_difficulty: comp
      - id: retroactive_release_pension_months
        effect: parameter
        decides: retro_share
        bindings: [comp_effective, retro_release_date, months_before_pension, months_to_release, retro_share]
        ladder:
          - when: "the compensation effective date is before the pension effective date AND the release was issued after the pension effective date"
            value: "months before pension was first paid (whole months from compensation effective date to pension effective date plus the payment start lag) divided by whole months from compensation effective date to release date"
          - when: "the compensation effective date is on or after the pension effective date"
            value: "0 - none of the release counts"
          - when: "otherwise"
            value: "K('no_adjustment_factor') - all of the release counts"
        baseline:
          retro_share: "K('no_adjustment_factor')"
        evidence: [cross_category, date]
        cross_difficulty: comp
      - id: civil_service_annuity_adjustment_years
        effect: parameter
        decides: annuity_uplift
        bindings: [annuity_level_date, annuity_level_age, annuity_uplift]
        ladder:
          - when: "the annuity figure took effect 24 or more whole months before the statement"
            value: "K('fers_two_adjustment_factor') - the two most recent reduced FERS increases together"
          - when: "it took effect 12 to 23 whole months before the statement"
            value: "K('fers_one_adjustment_factor') - the most recent reduced FERS increase"
          - when: "otherwise (under 12 whole months old)"
            value: "K('no_adjustment_factor') - stated as reported"
        baseline:
          annuity_uplift: "K('no_adjustment_factor')"
        evidence: [history, date]
        cross_difficulty: null
      - id: retroactive_release_deposit_recency
        effect: method
        decides: release_weight
        bindings: [release_deposited, release_age, release_weight]
        ladder:
          - when: "the most recent release was deposited after the fresh period but within one year before the statement"
            method: "the releases count for the months left of its twelve-month year, divided by twelve"
          - when: "it was deposited more than one year before the statement"
            method: "none of them counts"
          - when: "otherwise (deposited within the fresh period)"
            method: "they count in full"
        baseline:
          release_weight: "K('no_adjustment_factor')"
        evidence: [cross_category, date]
        cross_difficulty: comp
    baseline:
      rule: >-
        The benefit income statement is the veteran's own Social Security figure plus his federal civil
        service annuity plus the VA disability compensation counted for him, rounded to the cent. In the
        standard statement the veteran's Social Security is the annual figure on his most recent Social
        Security report, or nothing when no Social Security report is on file, his annuity is the annual
        figure on his most recent annuity report, or nothing when none is on file, the monthly compensation
        is the total of the monthly compensation payments issued to him since the pension effective date,
        and every retroactive compensation release issued to him counts at its gross amount.
      params: [months_per_year, no_adjustment_factor]
    inputs:
      history:
        - {table: pension_income_reports, aggregate: latest, field: annual_amount, filters: {event_type: pension_income_change_reported, income_source: social_security}}
        - {category: comp, table: comp_payments, aggregate: sum, field: gross_amount, within_months: 12, filters: {event_type: comp_monthly_payment}}
        - {category: comp, table: comp_payments, aggregate: sum, field: gross_amount, filters: {event_type: comp_retro_payment}}
        - {table: pension_income_reports, aggregate: latest, field: annual_amount, filters: {event_type: pension_income_change_reported, income_source: retirement_pension}}
      cross_category: [comp]

  - id: pension_ext_care_cost_rate_adjustment
    base_policy_refs: [pension_rate_computation, pension_evt_income_change, pension_evt_medical_expenses, pension_evt_net_worth_and_transfers, pension_evt_income_match]
    overwrite:
      - base_policy: pension_evt_income_match
        superseded_clause: >-
          The proposed adjustment from an income match is made only after income_match_response_days calendar days
          have passed since the date of the income-match notice.
        replaced_by: >-
          A proposed adjustment that lowers the rate on an income match is made only after the response period
          has passed since the date of the income-match notice; an adjustment that raises the rate, or one that
          rests on a report the veteran sent, is recorded as soon as it is computed.
    trigger: state_due
    subject: [pension_rate_adjusted]
    computes: adjusted_annual_rate
    target_tool: record_rate_adjustment_fee79930
    params:
      fresh_statement_days: 90
      stale_statement_days: 365
      no_adjustment_factor: 1
      one_adjustment_factor: 1.028
      two_adjustment_factor: 1.0537
      one_adjustment_months: 12
      two_adjustment_months: 24
      premium_confirmed_days: 365
      premium_stale_days: 730
      part_b_monthly_premium: 202.90
      household_with_spouse: 2
      household_alone: 1
      months_per_year: 12
      care_report_months: 3
      min_care_months: 3
      ongoing_gap_days: 92
      single_count: 1
    rule: >-
      A care-cost rate adjustment recomputes the annual pension from an earlier effective date when the
      veteran reports recurring care costs, such as an in-home aide, that he pays himself. A care-cost rate
      adjustment is not recorded for a veteran who has asked VA to redetermine his pension going forward; the
      care costs he reported are then taken into that redetermination. A proposed adjustment that lowers the
      rate on an income match is made only after the response period has passed since the date of the
      income-match notice; an adjustment that raises the rate, or one that rests on a report the veteran sent,
      is recorded as soon as it is computed. The new annual rate is fixed only after the award carries a
      benefit income statement from the veteran dated on the day his VA disability compensation stopped. The
      adjustment takes effect on the first day of the month after the month in which the earliest reported
      care month began, it names as its source the report of the most recent care month, and it carries the
      channel through which that report reached VA. The annual pension is the maximum annual pension rate of
      the rate category plus the additional child increment for each additional child, less countable income
      after the medical deduction, never below zero and rounded down to the whole dollar. Countable income is
      the veteran's benefit income, which includes his federal civil service annuity, plus the spouse's income
      where the rate category counts spouse income. The medical deduction is the medical figure less the
      medical threshold when medical expense reports are on file, and nothing otherwise, and the medical
      threshold is the rate category's medical expense threshold percentage of the category's basic rate for
      the medical deduction, rounded to the cent. Countable income after the medical deduction follows the
      deduction: when the deduction is positive and smaller than the countable income, the countable income
      less the deduction is used; when the deduction is positive and at least the countable income, no
      countable income is used; otherwise the countable income is used whole. In the standard computation the
      veteran's benefit income is the countable income on the award less the spouse's annual figure on file,
      the spouse's income is its annual figure on file, insurance premiums add nothing, the care cost is the
      total of the care months reported in the three whole months before the adjustment, counted once, and the
      countable income is used whole. The veteran's benefit income is taken by recency of his benefit income
      statement: a statement received within the fresh period is used as stated; a statement received after
      the fresh period but within one year is replaced by the higher of the statement and the benefit income
      on the award; with no statement received within one year the benefit income on the award is used. A
      spouse Social Security figure whose benefit level took effect 24 or more whole months before the
      adjustment is raised by the two most recent December cost-of-living increases together; one that took
      effect 12 to 23 whole months before is raised by the most recent December increase; one under 12 whole
      months old is used as reported; the raised figure is rounded to the cent. Insurance premiums on the
      award count by how recently they were last confirmed, which is by the most recent rate adjustment on the
      award or, when it has none, by the grant of the award: when they were last confirmed within one year,
      the medical expense figure on the award is counted in full; when they were last confirmed more than one
      year but no more than two years ago, only the standard Medicare Part B premium for twelve months for
      each member of the household the rate category covers is counted; otherwise premiums add nothing until
      the veteran reports them again. The monthly care figure follows the care months reported: with at least
      three care months reported and the most recent month above the average of the reported months, the most
      recent month is the monthly figure; with at least three care months reported and the most recent month
      at or below that average, the average rounded to the cent is the monthly figure; otherwise the total
      reported stands in its place. The care figure is then counted over a number of months: when at least
      three care months are reported and the most recent care month ended no more than the ongoing-care gap
      before the report reached VA, the care is ongoing and the monthly figure is counted for twelve months;
      when at least three care months are reported and it ended more than that gap before the report reached
      VA, the care has ended and the monthly figure is counted once for each care month reported; otherwise it
      is counted once. The care cost is the monthly figure times the months counted, rounded to the cent, and
      the medical figure is the premiums counted plus the care cost.
    prerequisite:
      - problem: pension_ext_benefit_income_statement
        kind: value_input
        gate: statement_amount
        form: state
        policy_source: >-
          The new annual rate is fixed only after the award carries a benefit income statement from the veteran
          dated on the day his VA disability compensation stopped.
        condition: >-
          pension_income_reports holds a pension_income_change_reported entry with income_source other on the award whose change_effective_date equals the compensation award's closed_date.
        resolved_by: certify_benefit_income_d2f4edcf
        effect: >-
          The statement's annual amount becomes the veteran's benefit income in the adjustment (statement_amount and
          the fresh-statement tier), replacing the benefit income on the award.
    cross_category: []
    compute:
      - statement_amount: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='other')"
      - statement_received: "LATEST('pension_income_reports','received_date', date_field='received_date', event_type='pension_income_change_reported', income_source='other')"
      - statement_age: "DAYS(statement_received, NOW) if statement_received else K('stale_statement_days') + K('single_count')"
      - spouse_figure: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='spouse_income') or 0"
      - spouse_level_date: "LATEST('pension_income_reports','change_effective_date', date_field='received_date', event_type='pension_income_change_reported', income_source='spouse_income')"
      - benefits_on_award: "F('annual_countable_income') - spouse_figure"
      - own_income: "statement_amount if statement_age <= K('fresh_statement_days') else (max(statement_amount, benefits_on_award) if statement_age <= K('stale_statement_days') else benefits_on_award)"
      - spouse_level_age: "MONTHS(spouse_level_date, NOW) if spouse_level_date else 0"
      - spouse_uplift: "K('two_adjustment_factor') if spouse_level_age >= K('two_adjustment_months') else (K('one_adjustment_factor') if spouse_level_age >= K('one_adjustment_months') else K('no_adjustment_factor'))"
      - spouse_income: "RND(spouse_figure * spouse_uplift, 2) if P('spouse_income_counted') else 0"
      - countable_income: "own_income + spouse_income"
      - threshold: "RND(P('medical_deduction_base_mapr') * P('medical_expense_threshold_pct') / 100, 2)"
      - last_adjustment_recorded: "LATEST('pension_income_reports','received_date', date_field='received_date', event_type='pension_rate_adjusted')"
      - last_confirmed: "last_adjustment_recorded if last_adjustment_recorded else F('opened_date')"
      - confirmation_age: "DAYS(last_confirmed, NOW)"
      - premiums_counted: "F('unreimbursed_medical_expenses') if confirmation_age <= K('premium_confirmed_days') else (K('part_b_monthly_premium') * K('months_per_year') * (K('household_with_spouse') if P('spouse_income_counted') else K('household_alone')) if confirmation_age <= K('premium_stale_days') else 0)"
      - care_total: "SUM('pension_income_reports','medical_expense_amount', within_months=K('care_report_months'), date_field='received_date', event_type='pension_medical_expenses_reported')"
      - care_count: "COUNT('pension_income_reports', within_months=K('care_report_months'), date_field='received_date', event_type='pension_medical_expenses_reported')"
      - care_latest: "LATEST('pension_income_reports','medical_expense_amount', date_field='expense_period_start', event_type='pension_medical_expenses_reported')"
      - care_average: "care_total / care_count if care_count > 0 else 0"
      - care_monthly: "care_latest if (care_count >= K('min_care_months') and care_latest > care_average) else (RND(care_average, 2) if (care_count >= K('min_care_months') and care_latest <= care_average) else care_total)"
      - care_latest_end: "LATEST('pension_income_reports','expense_period_end', date_field='expense_period_start', event_type='pension_medical_expenses_reported')"
      - care_received: "LATEST('pension_income_reports','received_date', date_field='expense_period_start', event_type='pension_medical_expenses_reported')"
      - care_gap_days: "DAYS(care_latest_end, care_received) if care_latest_end else 0"
      - care_months_counted: "K('months_per_year') if (care_count >= K('min_care_months') and care_gap_days <= K('ongoing_gap_days')) else (care_count if (care_count >= K('min_care_months') and care_gap_days > K('ongoing_gap_days')) else K('single_count'))"
      - care_cost: "RND(care_monthly * care_months_counted, 2)"
      - medical_figure: "premiums_counted + care_cost"
      - medical_reports: "COUNT('pension_income_reports', event_type='pension_medical_expenses_reported')"
      - medical_deduction: "medical_figure - threshold if medical_reports > 0 else 0"
      - income_after_deduction: "countable_income - medical_deduction if (medical_deduction > 0 and medical_deduction < countable_income) else (0 if (medical_deduction > 0 and medical_deduction >= countable_income) else countable_income)"
      - result: "int(max(0, P('mapr_annual') + P('additional_child_increment') * F('additional_children_count') - income_after_deduction))"
    compute_basis:
      statement_amount: "a statement received within the fresh period is used as stated"
      statement_received: "The veteran's benefit income is taken by recency of his benefit income statement"
      statement_age: "a statement received after the fresh period but within one year is replaced by the higher of the statement and the benefit income on the award; with no statement received within one year the benefit income on the award is used."
      spouse_figure: "the spouse's income is its annual figure on file"
      spouse_level_date: "A spouse Social Security figure whose benefit level took effect 24 or more whole months before the adjustment is raised by the two most recent December cost-of-living increases together"
      benefits_on_award: "In the standard computation the veteran's benefit income is the countable income on the award less the spouse's annual figure on file"
      own_income: "The veteran's benefit income is taken by recency of his benefit income statement: a statement received within the fresh period is used as stated; a statement received after the fresh period but within one year is replaced by the higher of the statement and the benefit income on the award; with no statement received within one year the benefit income on the award is used."
      spouse_level_age: "one that took effect 12 to 23 whole months before is raised by the most recent December increase; one under 12 whole months old is used as reported"
      spouse_uplift: "A spouse Social Security figure whose benefit level took effect 24 or more whole months before the adjustment is raised by the two most recent December cost-of-living increases together; one that took effect 12 to 23 whole months before is raised by the most recent December increase; one under 12 whole months old is used as reported; the raised figure is rounded to the cent."
      spouse_income: "plus the spouse's income where the rate category counts spouse income"
      countable_income: "Countable income is the veteran's benefit income, which includes his federal civil service annuity, plus the spouse's income where the rate category counts spouse income."
      threshold: "the medical threshold is the rate category's medical expense threshold percentage of the category's basic rate for the medical deduction, rounded to the cent."
      last_adjustment_recorded: "which is by the most recent rate adjustment on the award"
      last_confirmed: "which is by the most recent rate adjustment on the award or, when it has none, by the grant of the award"
      confirmation_age: "Insurance premiums on the award count by how recently they were last confirmed"
      premiums_counted: "Insurance premiums on the award count by how recently they were last confirmed, which is by the most recent rate adjustment on the award or, when it has none, by the grant of the award: when they were last confirmed within one year, the medical expense figure on the award is counted in full; when they were last confirmed more than one year but no more than two years ago, only the standard Medicare Part B premium for twelve months for each member of the household the rate category covers is counted; otherwise premiums add nothing until the veteran reports them again."
      care_total: "the care cost is the total of the care months reported in the three whole months before the adjustment, counted once"
      care_count: "with at least three care months reported"
      care_latest: "the most recent month is the monthly figure"
      care_average: "the average of the reported months"
      care_monthly: "The monthly care figure follows the care months reported: with at least three care months reported and the most recent month above the average of the reported months, the most recent month is the monthly figure; with at least three care months reported and the most recent month at or below that average, the average rounded to the cent is the monthly figure; otherwise the total reported stands in its place."
      care_latest_end: "the most recent care month ended no more than the ongoing-care gap before the report reached VA"
      care_received: "before the report reached VA"
      care_gap_days: "it ended more than that gap before the report reached VA"
      care_months_counted: "The care figure is then counted over a number of months: when at least three care months are reported and the most recent care month ended no more than the ongoing-care gap before the report reached VA, the care is ongoing and the monthly figure is counted for twelve months; when at least three care months are reported and it ended more than that gap before the report reached VA, the care has ended and the monthly figure is counted once for each care month reported; otherwise it is counted once."
      care_cost: "The care cost is the monthly figure times the months counted, rounded to the cent, and the medical figure is the premiums counted plus the care cost."
      medical_figure: "the medical figure is the premiums counted plus the care cost."
      medical_deduction: "The medical deduction is the medical figure less the medical threshold when medical expense reports are on file, and nothing otherwise"
      medical_reports: "when medical expense reports are on file, and nothing otherwise"
      income_after_deduction: "Countable income after the medical deduction follows the deduction: when the deduction is positive and smaller than the countable income, the countable income less the deduction is used; when the deduction is positive and at least the countable income, no countable income is used; otherwise the countable income is used whole."
      result: "The annual pension is the maximum annual pension rate of the rate category plus the additional child increment for each additional child, less countable income after the medical deduction, never below zero and rounded down to the whole dollar."
    factors:
      - id: own_income_statement_recency
        effect: method
        decides: own_income
        bindings: [statement_amount, statement_received, statement_age, own_income]
        ladder:
          - when: "a benefit income statement from the veteran was received within the fresh period"
            method: "the statement is used as stated"
          - when: "the latest statement was received after the fresh period but within one year"
            method: "the higher of the statement and the benefit income on the award is used"
          - when: "otherwise (no statement within one year)"
            method: "the benefit income on the award is used"
        baseline:
          own_income: "benefits_on_award"
        evidence: [history, date]
        cross_difficulty: null
      - id: spouse_social_security_adjustment_years
        effect: parameter
        decides: spouse_uplift
        bindings: [spouse_level_date, spouse_level_age, spouse_uplift]
        ladder:
          - when: "the spouse's Social Security figure took effect 24 or more whole months before the adjustment"
            value: "K('two_adjustment_factor')"
          - when: "the spouse figure took effect 12 to 23 whole months before"
            value: "K('one_adjustment_factor')"
          - when: "otherwise (under 12 whole months old)"
            value: "K('no_adjustment_factor')"
        baseline:
          spouse_uplift: "K('no_adjustment_factor')"
        evidence: [history, date]
        cross_difficulty: null
      - id: care_income_after_deduction
        effect: parameter
        decides: income_after_deduction
        bindings: [medical_reports, medical_deduction, income_after_deduction]
        ladder:
          - when: "the medical deduction is positive AND smaller than the countable income"
            value: "the countable income less the deduction"
          - when: "the medical deduction is positive AND at least the countable income"
            value: "0 - no countable income is used"
          - when: "otherwise"
            value: "the countable income whole"
        baseline:
          income_after_deduction: "countable_income"
        evidence: [history]
        cross_difficulty: null
      - id: premium_confirmation_recency
        effect: parameter
        decides: premiums_counted
        bindings: [last_adjustment_recorded, last_confirmed, confirmation_age, premiums_counted]
        ladder:
          - when: "the premiums were last confirmed (by the most recent rate adjustment, or by the grant when the award has none) within one year"
            value: "F('unreimbursed_medical_expenses') in full"
          - when: "they were last confirmed more than one year but no more than two years ago"
            value: "K('part_b_monthly_premium') x K('months_per_year') x household members"
          - when: "otherwise (last confirmed more than two years ago)"
            value: "0 - premiums wait until the veteran reports them again"
        baseline:
          premiums_counted: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: care_monthly_figure
        effect: method
        decides: care_monthly
        bindings: [care_count, care_latest, care_average, care_monthly]
        ladder:
          - when: "at least three care months are reported AND the most recent month is above their average"
            method: "the most recent month is the monthly figure"
          - when: "at least three care months are reported AND the most recent month is at or below their average"
            method: "the average of the reported months, rounded to the cent"
          - when: "otherwise"
            method: "the total reported stands as the figure"
        baseline:
          care_monthly: "care_total"
        evidence: [history]
        cross_difficulty: null
      - id: care_months_counted
        effect: parameter
        decides: care_months_counted
        bindings: [care_latest_end, care_received, care_gap_days, care_months_counted]
        ladder:
          - when: "at least three care months are reported AND the most recent care month ended no more than the ongoing-care gap before the report reached VA"
            value: "K('months_per_year') - care is ongoing"
          - when: "at least three care months are reported AND it ended more than that gap before the report reached VA"
            value: "the number of care months reported - care has ended"
          - when: "otherwise"
            value: "K('single_count') - counted once"
        baseline:
          care_months_counted: "K('single_count')"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The annual pension is the maximum annual pension rate of the rate category plus the additional child
        increment for each additional child, less countable income after the medical deduction, never below
        zero and rounded down to the whole dollar. Countable income is the veteran's benefit income, which
        includes his federal civil service annuity, plus the spouse's income where the rate category counts
        spouse income. The medical deduction is the medical figure less the medical threshold when medical
        expense reports are on file, and nothing otherwise, and the medical threshold is the rate category's
        medical expense threshold percentage of the category's basic rate for the medical deduction, rounded
        to the cent. Countable income after the medical deduction follows the deduction: when the deduction
        is positive and smaller than the countable income, the countable income less the deduction is used;
        when the deduction is positive and at least the countable income, no countable income is used;
        otherwise the countable income is used whole. In the standard computation the veteran's benefit
        income is the countable income on the award less the spouse's annual figure on file, the spouse's
        income is its annual figure on file, insurance premiums add nothing, the care cost is the total of
        the care months reported in the three whole months before the adjustment, counted once, and the
        countable income is used whole.
      params: [care_report_months, mapr_annual, additional_child_increment, medical_expense_threshold_pct, medical_deduction_base_mapr, spouse_income_counted]
    inputs:
      history:
        - {table: pension_income_reports, aggregate: latest, field: annual_amount, filters: {event_type: pension_income_change_reported, income_source: other}}
        - {table: pension_income_reports, aggregate: latest, field: annual_amount, filters: {event_type: pension_income_change_reported, income_source: spouse_income}}
        - {table: pension_income_reports, aggregate: count, field: report_id, filters: {event_type: pension_medical_expenses_reported}}
        - {table: pension_income_reports, aggregate: sum, field: medical_expense_amount, within_months: 3, filters: {event_type: pension_medical_expenses_reported}}
        - {table: pension_income_reports, aggregate: latest, field: received_date, filters: {event_type: pension_rate_adjusted}}
      cross_category: []

  - id: pension_ext_increase_retro_release
    base_policy_refs: [pension_evt_income_change, pension_evt_medical_expenses, pension_evt_care_and_dependents, pension_excl_compensation]
    overwrite: []
    trigger: state_due
    subject: [pension_retro_payment]
    computes: gross_amount
    target_tool: release_retro_payment_a1af7a43
    params:
      months_per_year: 12
      current_month: 1
      fee_cap_share: 0.20
    rule: >-
      When a rate adjustment raises the annual pension from an effective date that lies before months already
      paid, the higher amount for those months is released as one retroactive payment. A retroactive release
      for months already paid is not issued until the award carries a rate adjustment that raises the annual
      pension for those months. The release names the raising adjustment, runs from the month of that
      adjustment's effective date through the entitlement month of the most recent monthly payment, and is
      never below zero. The new monthly rate is the adjustment's annual pension divided by 12 and rounded down
      to the whole dollar. The release is the new monthly rate times the months owed, less what was already
      paid for those months, plus the payments returned in those months, less the VA disability compensation
      paid for months of pension, rounded to the cent. In the standard computation the months owed run from
      the month of the adjustment's effective date through the current month, and compensation subtracts
      nothing. The months owed follow the payments already issued: when monthly payments have been issued in
      the whole months since the adjustment's effective date, the months owed are the number of those
      payments; when none has been issued but whole months have passed since that date, the months owed are
      those whole months; otherwise the months owed run through the current month. What was already paid is
      the monthly payments issued in the months owed plus any earlier retroactive release issued in those
      months. A payment returned in the months owed is owed again, and the amount that came back from it is
      added. Monthly compensation paid for months of pension is subtracted: when the compensation award ended
      by the veteran's election of pension, all monthly compensation issued in the whole months since the
      pension effective date is subtracted; when the compensation award is still running, the monthly
      compensation issued in the months owed is subtracted; otherwise nothing is subtracted. A retroactive
      compensation release issued since the pension effective date is subtracted in part, from the amount
      considered, which is the release less the representative's fee taken out of it: when a direct-pay fee
      agreement is on file and the fee withheld is no more than the fee cap share of the release, the whole
      fee is taken out; when an agreement is on file and the fee withheld exceeds that share, only the fee cap
      share of the release, rounded to the cent, is taken out; with no agreement on file nothing is taken out.
      The share of the amount considered that is subtracted is the share covering months of pension: when the
      compensation effective date falls before the pension effective date and the release was issued after it,
      the share is the months of pension paid before the release divided by the whole months from the
      compensation effective date to the release date, the months of pension paid before the release being the
      whole months from the pension effective date to the release date less the months by which pension
      payment starts after its effective date; when the compensation effective date falls on or after the
      pension effective date, the whole amount considered is subtracted; otherwise none of it is subtracted.
      The share is applied to the amount considered and rounded to the cent before it is subtracted.
    prerequisite:
      - problem: pension_ext_care_cost_rate_adjustment
        kind: value_input
        gate: new_annual
        form: state
        policy_source: >-
          A retroactive release for months already paid is not issued until the award carries a rate adjustment that
          raises the annual pension for those months.
        condition: >-
          pension_income_reports holds a pension_rate_adjusted entry on the award, recorded after the most recent
          monthly payment, whose adjusted_annual_rate divided by 12 and rounded down exceeds that payment's
          gross_amount and whose change_effective_date precedes it.
        resolved_by: record_rate_adjustment_fee79930
        effect: >-
          The raising adjustment's annual pension becomes new_annual, so the new monthly rate, the effective month
          and every month owed are those of the raising adjustment instead of the earlier adjustment on file.
    cross_category:
      - category: comp
        as: history
        reads: [termination_reason, status, effective_date, attorney_fee_agreement_on_file, comp_payments.gross_amount, comp_payments.attorney_fee_withheld_amount, comp_payments.payment_date]
        note: The compensation subtraction factors read the compensation award and its payment ledger for this veteran.
    compute:
      - new_annual: "LATEST('pension_income_reports','adjusted_annual_rate', date_field='received_date', event_type='pension_rate_adjusted')"
      - new_monthly: "int(new_annual / K('months_per_year'))"
      - adjustment_effective: "LATEST('pension_income_reports','change_effective_date', date_field='received_date', event_type='pension_rate_adjusted')"
      - prior_monthly: "LATEST('pension_payments','gross_amount', date_field='payment_date', event_type='pension_monthly_payment')"
      - rate_raised: "new_monthly > prior_monthly"
      - effective_span: "MONTHS(adjustment_effective, NOW)"
      - issued_since_effective: "COUNT('pension_payments', within_months=effective_span, date_field='payment_date', event_type='pension_monthly_payment')"
      - months_owed: "issued_since_effective if issued_since_effective > 0 else (effective_span if effective_span > 0 else effective_span + K('current_month'))"
      - issued_gross: "SUM('pension_payments','gross_amount', within_months=months_owed, date_field='payment_date', event_type='pension_monthly_payment')"
      - earlier_release: "SUM('pension_payments','gross_amount', within_months=months_owed, date_field='payment_date', event_type='pension_retro_payment')"
      - already_paid: "issued_gross + earlier_release"
      - returned_net: "SUM('pension_payments','net_amount', within_months=months_owed, date_field='payment_date', event_type='pension_payment_returned')"
      - returned_owed: "0 - returned_net"
      - pension_span: "MONTHS(F('effective_date'), NOW)"
      - comp_ended_by_election: "CFIELD('comp','termination_reason') == 'election_of_pension'"
      - comp_running: "CFIELD('comp','status') == 'running'"
      - comp_monthly_on_pension: "XSUM('comp','comp_payments','gross_amount', within_months=pension_span, date_field='payment_date', event_type='comp_monthly_payment')"
      - comp_monthly_in_window: "XSUM('comp','comp_payments','gross_amount', within_months=months_owed, date_field='payment_date', event_type='comp_monthly_payment')"
      - comp_monthly_subtracted: "comp_monthly_on_pension if (comp_ended_by_election and comp_monthly_on_pension > 0) else (comp_monthly_in_window if (comp_running and comp_monthly_in_window > 0) else 0)"
      - lump_gross: "XSUM('comp','comp_payments','gross_amount', within_months=pension_span, date_field='payment_date', event_type='comp_retro_payment')"
      - lump_fee: "XSUM('comp','comp_payments','attorney_fee_withheld_amount', within_months=pension_span, date_field='payment_date', event_type='comp_retro_payment')"
      - fee_agreement: "CFIELD('comp','attorney_fee_agreement_on_file') == True"
      - fee_cap: "RND(lump_gross * K('fee_cap_share'), 2)"
      - lump_fee_taken_out: "lump_fee if (fee_agreement and lump_fee <= fee_cap) else (fee_cap if (fee_agreement and lump_fee > fee_cap) else 0)"
      - lump_considered: "lump_gross - lump_fee_taken_out"
      - comp_effective: "CFIELD('comp','effective_date')"
      - lump_release_date: "XLATEST('comp','comp_payments','payment_date', date_field='payment_date', event_type='comp_retro_payment')"
      - lump_pension_months: "MONTHS(F('effective_date'), lump_release_date) - P('payment_start_lag_months')"
      - lump_all_months: "MONTHS(comp_effective, lump_release_date)"
      - lump_share: "lump_pension_months / lump_all_months if (comp_effective < F('effective_date') and lump_release_date > F('effective_date')) else (1 if comp_effective >= F('effective_date') else 0)"
      - lump_subtracted: "RND(lump_considered * lump_share, 2)"
      - gross_due: "new_monthly * months_owed - already_paid + returned_owed"
      - result: "RND(max(0, gross_due - comp_monthly_subtracted - lump_subtracted), 2) if rate_raised else 0"
    compute_basis:
      new_annual: "A retroactive release for months already paid is not issued until the award carries a rate adjustment that raises the annual pension for those months."
      new_monthly: "The new monthly rate is the adjustment's annual pension divided by 12 and rounded down to the whole dollar."
      adjustment_effective: "runs from the month of that adjustment's effective date through the entitlement month of the most recent monthly payment"
      prior_monthly: "through the entitlement month of the most recent monthly payment"
      rate_raised: "When a rate adjustment raises the annual pension from an effective date that lies before months already paid"
      effective_span: "when none has been issued but whole months have passed since that date, the months owed are those whole months"
      issued_since_effective: "when monthly payments have been issued in the whole months since the adjustment's effective date, the months owed are the number of those payments"
      months_owed: "The months owed follow the payments already issued: when monthly payments have been issued in the whole months since the adjustment's effective date, the months owed are the number of those payments; when none has been issued but whole months have passed since that date, the months owed are those whole months; otherwise the months owed run through the current month."
      issued_gross: "What was already paid is the monthly payments issued in the months owed"
      earlier_release: "plus any earlier retroactive release issued in those months"
      already_paid: "What was already paid is the monthly payments issued in the months owed plus any earlier retroactive release issued in those months."
      returned_net: "the amount that came back from it"
      returned_owed: "A payment returned in the months owed is owed again, and the amount that came back from it is added."
      pension_span: "all monthly compensation issued in the whole months since the pension effective date is subtracted"
      comp_ended_by_election: "when the compensation award ended by the veteran's election of pension"
      comp_running: "when the compensation award is still running, the monthly compensation issued in the months owed is subtracted"
      comp_monthly_on_pension: "all monthly compensation issued in the whole months since the pension effective date is subtracted"
      comp_monthly_in_window: "the monthly compensation issued in the months owed is subtracted"
      comp_monthly_subtracted: "Monthly compensation paid for months of pension is subtracted: when the compensation award ended by the veteran's election of pension, all monthly compensation issued in the whole months since the pension effective date is subtracted; when the compensation award is still running, the monthly compensation issued in the months owed is subtracted; otherwise nothing is subtracted."
      lump_gross: "A retroactive compensation release issued since the pension effective date is subtracted in part"
      lump_fee: "the fee withheld"
      fee_agreement: "when a direct-pay fee agreement is on file"
      fee_cap: "only the fee cap share of the release, rounded to the cent, is taken out"
      lump_fee_taken_out: "when a direct-pay fee agreement is on file and the fee withheld is no more than the fee cap share of the release, the whole fee is taken out; when an agreement is on file and the fee withheld exceeds that share, only the fee cap share of the release, rounded to the cent, is taken out; with no agreement on file nothing is taken out."
      lump_considered: "from the amount considered, which is the release less the representative's fee taken out of it"
      comp_effective: "when the compensation effective date falls before the pension effective date and the release was issued after it"
      lump_release_date: "the release was issued after it"
      lump_pension_months: "the months of pension paid before the release being the whole months from the pension effective date to the release date less the months by which pension payment starts after its effective date"
      lump_all_months: "the whole months from the compensation effective date to the release date"
      lump_share: "The share of the amount considered that is subtracted is the share covering months of pension: when the compensation effective date falls before the pension effective date and the release was issued after it, the share is the months of pension paid before the release divided by the whole months from the compensation effective date to the release date, the months of pension paid before the release being the whole months from the pension effective date to the release date less the months by which pension payment starts after its effective date; when the compensation effective date falls on or after the pension effective date, the whole amount considered is subtracted; otherwise none of it is subtracted."
      lump_subtracted: "The share is applied to the amount considered and rounded to the cent before it is subtracted."
      gross_due: "The release is the new monthly rate times the months owed, less what was already paid for those months, plus the payments returned in those months, less the VA disability compensation paid for months of pension, rounded to the cent."
      result: "The release names the raising adjustment, runs from the month of that adjustment's effective date through the entitlement month of the most recent monthly payment, and is never below zero."
    factors:
      - id: months_owed_from_payments
        effect: method
        decides: months_owed
        bindings: [effective_span, issued_since_effective, months_owed]
        ladder:
          - when: "monthly payments have been issued in the whole months since the adjustment's effective date"
            method: "the months owed are the number of those payments"
          - when: "no monthly payment has been issued since that date AND whole months have passed since it"
            method: "the months owed are the whole months since that date"
          - when: "otherwise"
            method: "the months owed run from the effective month through the current month"
        baseline:
          months_owed: "effective_span + K('current_month')"
        evidence: [history, date]
        cross_difficulty: null
      - id: monthly_compensation_subtracted
        effect: parameter
        decides: comp_monthly_subtracted
        bindings: [comp_monthly_on_pension, comp_monthly_in_window, comp_monthly_subtracted]
        ladder:
          - when: "the compensation award ended by an election of pension AND monthly compensation was issued since the pension effective date"
            value: "all monthly compensation issued since the pension effective date"
          - when: "the compensation award is running AND monthly compensation was issued in the months owed"
            value: "the monthly compensation issued in the months owed"
          - when: "otherwise"
            value: "0"
        baseline:
          comp_monthly_subtracted: "0"
        evidence: [cross_category, history]
        cross_difficulty: comp
      - id: retroactive_compensation_fee_taken_out
        effect: parameter
        decides: lump_fee_taken_out
        bindings: [lump_fee, fee_agreement, fee_cap, lump_fee_taken_out]
        ladder:
          - when: "a direct-pay fee agreement is on file AND the fee withheld is no more than the fee cap share of the release"
            value: "the whole fee withheld"
          - when: "a direct-pay fee agreement is on file AND the fee withheld exceeds the fee cap share"
            value: "K('fee_cap_share') of the release, rounded to the cent"
          - when: "otherwise (no agreement on file)"
            value: "0"
        baseline:
          lump_fee_taken_out: "0"
        evidence: [cross_category, history]
        cross_difficulty: comp
      - id: retroactive_compensation_pension_share
        effect: parameter
        decides: lump_share
        bindings: [comp_effective, lump_release_date, lump_pension_months, lump_all_months, lump_share]
        ladder:
          - when: "the compensation effective date is before the pension effective date AND the release was issued after it"
            value: "months of pension paid before the release (whole months from pension effective date to release date less the payment start lag) divided by whole months from compensation effective date to release date"
          - when: "the compensation effective date is on or after the pension effective date"
            value: "1 - the whole amount considered"
          - when: "otherwise"
            value: "0"
        baseline:
          lump_share: "0"
        evidence: [cross_category, date]
        cross_difficulty: comp
    baseline:
      rule: >-
        The new monthly rate is the adjustment's annual pension divided by 12 and rounded down to the whole
        dollar. The release is the new monthly rate times the months owed, less what was already paid for
        those months, plus the payments returned in those months, less the VA disability compensation paid
        for months of pension, rounded to the cent. In the standard computation the months owed run from the
        month of the adjustment's effective date through the current month, and compensation subtracts
        nothing.
      params: [months_per_year, current_month]
    inputs:
      history:
        - {table: pension_income_reports, aggregate: latest, field: adjusted_annual_rate, filters: {event_type: pension_rate_adjusted}}
        - {table: pension_payments, aggregate: sum, field: gross_amount, filters: {event_type: pension_monthly_payment}}
        - {table: pension_payments, aggregate: sum, field: net_amount, filters: {event_type: pension_payment_returned}}
        - {category: comp, table: comp_payments, aggregate: sum, field: gross_amount, filters: {event_type: comp_monthly_payment}}
        - {category: comp, table: comp_payments, aggregate: sum, field: gross_amount, filters: {event_type: comp_retro_payment}}
      cross_category: [comp]

  - id: pension_ext_one_time_payment_declaration
    base_policy_refs: [pension_evt_income_change, pension_excl_compensation]
    overwrite:
      - base_policy: pension_excl_compensation
        superseded_clause: >-
          Compensation paid to the veteran counts as income for pension.
        replaced_by: >-
          Compensation paid to the veteran counts as income for pension only for months before pension was
          first paid; compensation paid for a month that pension also paid is settled against the pension
          for that month and is not counted as income.
    trigger: state_due
    subject: [pension_income_change_reported]
    computes: annual_amount
    target_tool: declare_lump_sum_cb649dee
    params:
      year_months: 12
      fee_cap_share: 0.20
      fresh_deposit_days: 90
      stale_deposit_days: 365
      no_adjustment_factor: 1
    rule: >-
      A retroactive compensation release deposited to a pensioner after his compensation award has ended is a
      one-time VA payment, nonrecurring income that the veteran declares in his own words as an income change
      report, dated on the date of the most recent compensation release he declares. Every age and period the
      declaration measures is measured to the day the veteran files it, not to the date it carries. The
      declaration is the one-time amount counted, rounded to the cent. The period the declaration covers
      follows the award: when the pension award took effect fewer than twelve whole months before the
      declaration, only releases deposited in the whole months since the pension effective date are declared;
      when the award is older and a one-time declaration was already received in the twelve whole months
      before, only releases deposited since that declaration are declared; otherwise the twelve whole months
      before the declaration are covered. A representative's fee withheld from a release is taken out of the
      declared amount by how it was withheld: when a direct-pay fee agreement is on file and the fee withheld
      is no more than the fee cap share of the release, the whole fee is taken out; when an agreement is on
      file and the fee exceeds that share, only the fee cap share of the release, rounded to the cent, is
      taken out; with no agreement on file nothing is taken out. The part of a release withheld to repay a VA
      debt was paid on the veteran's behalf and stays in the declared amount. VA refunds of the veteran's own
      money, such as a home loan funding fee refund or the refund of a debt overcollection, are not income and
      are not declared. Compensation paid to the veteran counts as income for pension only for months before
      pension was first paid; compensation paid for a month that pension also paid is settled against the
      pension for that month and is not counted as income. The releases in the period, less the fee taken out,
      count by the months the most recent release was paid for: when every month it was paid for came before
      the pension effective date, they count in full; when its first month came before the pension effective
      date and its months run into the effective month or later, only the share equal to the months before
      pension was first paid divided by all the months it was paid for counts, the months before pension was
      first paid being the whole months from its first month to the pension effective date plus the months by
      which pension payment starts after its effective date; otherwise every month it was paid for is a month
      of pension, it is settled against the pension, and nothing counts. What counts is then weighed by when
      the most recent release was deposited: when it was deposited within the fresh period before the
      declaration, it counts in full; when it was deposited after the fresh period but within one year, it
      counts for the months left of its twelve-month year, divided by twelve; otherwise nothing counts. In the
      standard declaration the period is the twelve whole months before the declaration, the representative's
      fee is left in the releases, and the releases are taken as paid only for months the pension was also
      paid, so they are settled against the pension and nothing is counted.
    prerequisite: []
    cross_category:
      - category: comp
        as: history
        reads: [attorney_fee_agreement_on_file, comp_payments.gross_amount, comp_payments.attorney_fee_withheld_amount, comp_payments.payment_date, comp_payments.retro_period_start, comp_payments.retro_period_end]
        note: The fee, months and deposit factors read the compensation award and its retroactive releases.
    compute:
      - pension_age: "MONTHS(F('effective_date'), NOW)"
      - prior_declarations: "COUNT('pension_income_reports', within_months=K('year_months'), date_field='received_date', event_type='pension_income_change_reported', income_source='other')"
      - prior_declaration_date: "LATEST('pension_income_reports','received_date', date_field='received_date', event_type='pension_income_change_reported', income_source='other')"
      - window_months: "pension_age if pension_age < K('year_months') else (MONTHS(prior_declaration_date, NOW) if prior_declarations > 0 else K('year_months'))"
      - release_gross: "XSUM('comp','comp_payments','gross_amount', within_months=window_months, date_field='payment_date', event_type='comp_retro_payment')"
      - release_fee: "XSUM('comp','comp_payments','attorney_fee_withheld_amount', within_months=window_months, date_field='payment_date', event_type='comp_retro_payment')"
      - fee_agreement: "CFIELD('comp','attorney_fee_agreement_on_file') == True"
      - fee_cap: "RND(release_gross * K('fee_cap_share'), 2)"
      - fee_taken_out: "release_fee if (fee_agreement and release_fee <= fee_cap) else (fee_cap if (fee_agreement and release_fee > fee_cap) else 0)"
      - release_counted: "release_gross - fee_taken_out"
      - latest_period_start: "XLATEST('comp','comp_payments','retro_period_start', date_field='payment_date', event_type='comp_retro_payment')"
      - latest_period_end: "XLATEST('comp','comp_payments','retro_period_end', date_field='payment_date', event_type='comp_retro_payment')"
      - months_paid_for: "MONTHS(latest_period_start + '-01', latest_period_end + '-01') + 1 if latest_period_start else 0"
      - months_before_pension: "MONTHS(latest_period_start + '-01', F('effective_date')) + P('payment_start_lag_months') if latest_period_start else 0"
      - pension_share: "K('no_adjustment_factor') if (latest_period_end and latest_period_end + '-01' < F('effective_date')) else (months_before_pension / months_paid_for if (latest_period_start and latest_period_start + '-01' < F('effective_date')) else 0)"
      - latest_deposit: "XLATEST('comp','comp_payments','payment_date', date_field='payment_date', event_type='comp_retro_payment')"
      - deposit_age: "DAYS(latest_deposit, NOW) if latest_deposit else K('stale_deposit_days') + 1"
      - deposit_weight: "1 if deposit_age <= K('fresh_deposit_days') else ((K('year_months') - MONTHS(latest_deposit, NOW)) / K('year_months') if deposit_age <= K('stale_deposit_days') else 0)"
      - result: "RND(release_counted * pension_share * deposit_weight, 2)"
    compute_basis:
      pension_age: "when the pension award took effect fewer than twelve whole months before the declaration, only releases deposited in the whole months since the pension effective date are declared"
      prior_declarations: "when the award is older and a one-time declaration was already received in the twelve whole months before"
      prior_declaration_date: "only releases deposited since that declaration are declared"
      window_months: "The period the declaration covers follows the award: when the pension award took effect fewer than twelve whole months before the declaration, only releases deposited in the whole months since the pension effective date are declared; when the award is older and a one-time declaration was already received in the twelve whole months before, only releases deposited since that declaration are declared; otherwise the twelve whole months before the declaration are covered."
      release_gross: "The releases in the period, less the fee taken out"
      release_fee: "A representative's fee withheld from a release is taken out of the declared amount by how it was withheld"
      fee_agreement: "when a direct-pay fee agreement is on file"
      fee_cap: "only the fee cap share of the release, rounded to the cent, is taken out"
      fee_taken_out: "A representative's fee withheld from a release is taken out of the declared amount by how it was withheld: when a direct-pay fee agreement is on file and the fee withheld is no more than the fee cap share of the release, the whole fee is taken out; when an agreement is on file and the fee exceeds that share, only the fee cap share of the release, rounded to the cent, is taken out; with no agreement on file nothing is taken out."
      release_counted: "The releases in the period, less the fee taken out"
      latest_period_start: "when its first month came before the pension effective date"
      latest_period_end: "when every month it was paid for came before the pension effective date, they count in full"
      months_paid_for: "divided by all the months it was paid for"
      months_before_pension: "the months before pension was first paid being the whole months from its first month to the pension effective date plus the months by which pension payment starts after its effective date"
      pension_share: "Compensation paid to the veteran counts as income for pension only for months before pension was first paid; compensation paid for a month that pension also paid is settled against the pension for that month and is not counted as income. The releases in the period, less the fee taken out, count by the months the most recent release was paid for: when every month it was paid for came before the pension effective date, they count in full; when its first month came before the pension effective date and its months run into the effective month or later, only the share equal to the months before pension was first paid divided by all the months it was paid for counts, the months before pension was first paid being the whole months from its first month to the pension effective date plus the months by which pension payment starts after its effective date; otherwise every month it was paid for is a month of pension, it is settled against the pension, and nothing counts."
      latest_deposit: "What counts is then weighed by when the most recent release was deposited"
      deposit_age: "when it was deposited within the fresh period before the declaration, it counts in full"
      deposit_weight: "What counts is then weighed by when the most recent release was deposited: when it was deposited within the fresh period before the declaration, it counts in full; when it was deposited after the fresh period but within one year, it counts for the months left of its twelve-month year, divided by twelve; otherwise nothing counts."
      result: "The declaration is the one-time amount counted, rounded to the cent."
    factors:
      - id: declaration_period
        effect: method
        decides: window_months
        bindings: [pension_age, prior_declarations, prior_declaration_date, window_months]
        ladder:
          - when: "the pension award took effect fewer than twelve whole months before the declaration"
            method: "only releases deposited in the whole months since the pension effective date are declared"
          - when: "the award is older AND a one-time declaration was received in the twelve whole months before"
            method: "only releases deposited since that earlier declaration are declared"
          - when: "otherwise"
            method: "the twelve whole months before the declaration are covered"
        baseline:
          window_months: "K('year_months')"
        evidence: [history, date]
        cross_difficulty: null
      - id: representative_fee_taken_out
        effect: parameter
        decides: fee_taken_out
        bindings: [release_fee, fee_agreement, fee_cap, fee_taken_out]
        ladder:
          - when: "a direct-pay fee agreement is on file AND the fee withheld is no more than the fee cap share of the release"
            value: "the whole fee withheld"
          - when: "a direct-pay fee agreement is on file AND the fee withheld exceeds the fee cap share"
            value: "K('fee_cap_share') of the release, rounded to the cent"
          - when: "otherwise (no agreement on file)"
            value: "0"
        baseline:
          fee_taken_out: "0"
        evidence: [cross_category, history]
        cross_difficulty: comp
      - id: release_months_before_pension
        effect: parameter
        decides: pension_share
        bindings: [latest_period_start, latest_period_end, months_paid_for, months_before_pension, pension_share]
        ladder:
          - when: "every month the most recent release was paid for came before the pension effective date"
            value: "K('no_adjustment_factor') - the releases count in full"
          - when: "its first month came before the pension effective date AND its months run into the effective month or later"
            value: "months before pension was first paid (whole months from its first month to the pension effective date plus the payment start lag) / all months it was paid for"
          - when: "otherwise (every month it was paid for is a month of pension)"
            value: "0 - settled against the pension"
        baseline:
          pension_share: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: comp
      - id: release_deposit_recency
        effect: method
        decides: deposit_weight
        bindings: [latest_deposit, deposit_age, deposit_weight]
        ladder:
          - when: "the most recent release was deposited within the fresh period before the declaration"
            method: "what counts is taken in full"
          - when: "it was deposited after the fresh period but within one year"
            method: "what counts is taken for the months left of its twelve-month year, divided by twelve"
          - when: "otherwise"
            method: "nothing counts"
        baseline:
          deposit_weight: "0"
        evidence: [cross_category, date]
        cross_difficulty: comp
    baseline:
      rule: >-
        The declaration is the one-time amount counted, rounded to the cent. In the standard declaration the
        period is the twelve whole months before the declaration, the representative's fee is left in the
        releases, and the releases are taken as paid only for months the pension was also paid, so they are
        settled against the pension and nothing is counted.
      params: [year_months]
    inputs:
      history:
        - {category: comp, table: comp_payments, aggregate: sum, field: gross_amount, within_months: 12, filters: {event_type: comp_retro_payment}}
        - {category: comp, table: comp_payments, aggregate: latest, field: payment_date, filters: {event_type: comp_retro_payment}}
        - {table: pension_income_reports, aggregate: count, field: report_id, within_months: 12, filters: {event_type: pension_income_change_reported, income_source: other}}
      cross_category: [comp]
  - id: pension_ext_recurring_income_redetermination
    base_policy_refs: [pension_rate_computation, pension_evt_medicaid_nursing_home]
    overwrite: []
    trigger: state_due
    subject: [pension_financials_updated]
    computes: annual_countable_income
    target_tool: update_countable_income_81bdd26c
    params:
      no_adjustment_factor: 1
      one_adjustment_factor: 1.028
      two_adjustment_factor: 1.0537
      one_adjustment_months: 12
      two_adjustment_months: 24
      year_months: 12
      fers_one_adjustment_factor: 1.02
      fers_two_adjustment_factor: 1.0404
    rule: >-
      When a retroactive compensation release reaches a pensioner after his compensation award has ended, VA
      redetermines the recurring countable income on the award: the household's annualized income from
      recurring sources, before any medical deduction, rounded to the cent; one-time payments are counted
      separately at each rate determination and are not part of this figure. The recurring countable income is
      the veteran's Social Security, plus the spouse's Social Security where the rate category counts spouse
      income, plus his federal civil service annuity, plus interest and dividends, plus recurring VA
      disability compensation. In the standard redetermination each Social Security figure, the annuity figure
      and the interest figure are taken as reported on the most recent report of that source, and recurring
      compensation is the monthly rate of the veteran's compensation rating for a veteran alone for twelve
      months. A veteran's Social Security figure whose benefit level took effect 24 or more whole months
      before the redetermination is raised by the two most recent December cost-of-living increases together;
      one that took effect 12 to 23 whole months before is raised by the most recent December increase; one
      under 12 whole months old is used as reported. A spouse's Social Security figure is raised the same way
      by the age of its own benefit level: 24 or more whole months by the two most recent December increases
      together, 12 to 23 whole months by the most recent one, under 12 whole months not at all. Each raised
      figure is rounded to the cent. Interest and dividends are counted at the figure most recently reported.
      A federal civil service annuity under the Federal Employees Retirement System receives the reduced
      cost-of-living increase that system grants each December: an annuity figure whose level took effect 24
      or more whole months before the redetermination is raised by the two most recent of those increases
      together; one that took effect 12 to 23 whole months before is raised by the most recent one; one under
      12 whole months old is used as reported; the raised figure is rounded to the cent. Recurring
      compensation follows the compensation award: when it ended by the veteran's election of pension, no
      compensation recurs; when it ended for any other reason, the compensation actually issued in the twelve
      whole months before is counted; while it is running, the monthly rate of its rating for a veteran alone
      recurs for twelve months.
    prerequisite: []
    cross_category:
      - category: comp
        as: branch
        reads: [termination_reason, status, monthly_rate_veteran_alone, comp_payments.gross_amount, comp_payments.payment_date]
        note: The recurring-compensation factor reads the compensation award's status, rate and ledger.
    compute:
      - ss_figure: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='social_security')"
      - ss_reports: "COUNT('pension_income_reports', event_type='pension_income_change_reported', income_source='social_security')"
      - ss_level_date: "LATEST('pension_income_reports','change_effective_date', date_field='received_date', event_type='pension_income_change_reported', income_source='social_security')"
      - ss_level_age: "MONTHS(ss_level_date, NOW) if ss_level_date else 0"
      - ss_uplift: "K('two_adjustment_factor') if ss_level_age >= K('two_adjustment_months') else (K('one_adjustment_factor') if ss_level_age >= K('one_adjustment_months') else K('no_adjustment_factor'))"
      - ss_counted: "RND(ss_figure * ss_uplift, 2) if ss_reports > 0 else 0"
      - spouse_figure: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='spouse_income')"
      - spouse_level_date: "LATEST('pension_income_reports','change_effective_date', date_field='received_date', event_type='pension_income_change_reported', income_source='spouse_income')"
      - spouse_level_age: "MONTHS(spouse_level_date, NOW) if spouse_level_date else 0"
      - spouse_uplift: "K('two_adjustment_factor') if spouse_level_age >= K('two_adjustment_months') else (K('one_adjustment_factor') if spouse_level_age >= K('one_adjustment_months') else K('no_adjustment_factor'))"
      - spouse_counted: "RND(spouse_figure * spouse_uplift, 2) if (P('spouse_income_counted') and spouse_figure) else 0"
      - interest_counted: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='interest_dividends') or 0"
      - annuity_figure: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='retirement_pension') or 0"
      - annuity_level_date: "LATEST('pension_income_reports','change_effective_date', date_field='received_date', event_type='pension_income_change_reported', income_source='retirement_pension')"
      - annuity_level_age: "MONTHS(annuity_level_date, NOW) if annuity_level_date else 0"
      - annuity_uplift: "K('fers_two_adjustment_factor') if annuity_level_age >= K('two_adjustment_months') else (K('fers_one_adjustment_factor') if annuity_level_age >= K('one_adjustment_months') else K('no_adjustment_factor'))"
      - annuity_counted: "RND(annuity_figure * annuity_uplift, 2)"
      - comp_ended_by_election: "CFIELD('comp','termination_reason') == 'election_of_pension'"
      - comp_ended_otherwise: "CFIELD('comp','status') == 'terminated' and CFIELD('comp','termination_reason') != 'election_of_pension'"
      - comp_issued: "XSUM('comp','comp_payments','gross_amount', within_months=K('year_months'), date_field='payment_date', event_type='comp_monthly_payment') + XSUM('comp','comp_payments','gross_amount', within_months=K('year_months'), date_field='payment_date', event_type='comp_retro_payment')"
      - comp_recurring: "0 if comp_ended_by_election else (comp_issued if comp_ended_otherwise else CPARAM('comp','monthly_rate_veteran_alone') * K('year_months'))"
      - result: "RND(ss_counted + spouse_counted + annuity_counted + interest_counted + comp_recurring, 2)"
    compute_basis:
      ss_figure: "In the standard redetermination each Social Security figure, the annuity figure and the interest figure are taken as reported on the most recent report of that source"
      ss_reports: "the veteran's Social Security"
      ss_level_date: "A veteran's Social Security figure whose benefit level took effect 24 or more whole months before the redetermination is raised by the two most recent December cost-of-living increases together"
      ss_level_age: "one that took effect 12 to 23 whole months before is raised by the most recent December increase; one under 12 whole months old is used as reported"
      ss_uplift: "A veteran's Social Security figure whose benefit level took effect 24 or more whole months before the redetermination is raised by the two most recent December cost-of-living increases together; one that took effect 12 to 23 whole months before is raised by the most recent December increase; one under 12 whole months old is used as reported."
      ss_counted: "Each raised figure is rounded to the cent."
      spouse_figure: "plus the spouse's Social Security where the rate category counts spouse income"
      spouse_level_date: "A spouse's Social Security figure is raised the same way by the age of its own benefit level"
      spouse_level_age: "24 or more whole months by the two most recent December increases together, 12 to 23 whole months by the most recent one, under 12 whole months not at all."
      spouse_uplift: "A spouse's Social Security figure is raised the same way by the age of its own benefit level: 24 or more whole months by the two most recent December increases together, 12 to 23 whole months by the most recent one, under 12 whole months not at all."
      spouse_counted: "plus the spouse's Social Security where the rate category counts spouse income"
      interest_counted: "Interest and dividends are counted at the figure most recently reported."
      annuity_figure: "plus his federal civil service annuity"
      annuity_level_date: "an annuity figure whose level took effect 24 or more whole months before the redetermination is raised by the two most recent of those increases together"
      annuity_level_age: "one that took effect 12 to 23 whole months before is raised by the most recent one; one under 12 whole months old is used as reported"
      annuity_uplift: "A federal civil service annuity under the Federal Employees Retirement System receives the reduced cost-of-living increase that system grants each December: an annuity figure whose level took effect 24 or more whole months before the redetermination is raised by the two most recent of those increases together; one that took effect 12 to 23 whole months before is raised by the most recent one; one under 12 whole months old is used as reported; the raised figure is rounded to the cent."
      annuity_counted: "the raised figure is rounded to the cent."
      comp_ended_by_election: "when it ended by the veteran's election of pension, no compensation recurs"
      comp_ended_otherwise: "when it ended for any other reason, the compensation actually issued in the twelve whole months before is counted"
      comp_issued: "the compensation actually issued in the twelve whole months before is counted"
      comp_recurring: "Recurring compensation follows the compensation award: when it ended by the veteran's election of pension, no compensation recurs; when it ended for any other reason, the compensation actually issued in the twelve whole months before is counted; while it is running, the monthly rate of its rating for a veteran alone recurs for twelve months."
      result: "the household's annualized income from recurring sources, before any medical deduction, rounded to the cent"
    factors:
      - id: veteran_social_security_adjustment_years
        effect: parameter
        decides: ss_uplift
        bindings: [ss_level_date, ss_level_age, ss_uplift]
        ladder:
          - when: "the veteran's Social Security figure took effect 24 or more whole months before"
            value: "K('two_adjustment_factor')"
          - when: "it took effect 12 to 23 whole months before"
            value: "K('one_adjustment_factor')"
          - when: "otherwise"
            value: "K('no_adjustment_factor')"
        baseline:
          ss_uplift: "K('no_adjustment_factor')"
        evidence: [history, date]
        cross_difficulty: null
      - id: spouse_social_security_level_age
        effect: parameter
        decides: spouse_uplift
        bindings: [spouse_level_date, spouse_level_age, spouse_uplift]
        ladder:
          - when: "the spouse's Social Security figure took effect 24 or more whole months before"
            value: "K('two_adjustment_factor')"
          - when: "it took effect 12 to 23 whole months before"
            value: "K('one_adjustment_factor')"
          - when: "otherwise"
            value: "K('no_adjustment_factor')"
        baseline:
          spouse_uplift: "K('no_adjustment_factor')"
        evidence: [history, date]
        cross_difficulty: null
      - id: civil_service_annuity_level_age
        effect: parameter
        decides: annuity_uplift
        bindings: [annuity_level_date, annuity_level_age, annuity_uplift]
        ladder:
          - when: "the annuity figure took effect 24 or more whole months before the redetermination"
            value: "K('fers_two_adjustment_factor') - the two most recent reduced December increases together"
          - when: "it took effect 12 to 23 whole months before"
            value: "K('fers_one_adjustment_factor') - the most recent reduced December increase"
          - when: "otherwise"
            value: "K('no_adjustment_factor')"
        baseline:
          annuity_uplift: "K('no_adjustment_factor')"
        evidence: [history, date]
        cross_difficulty: null
      - id: compensation_recurrence
        effect: method
        decides: comp_recurring
        bindings: [comp_ended_by_election, comp_ended_otherwise, comp_issued, comp_recurring]
        ladder:
          - when: "the compensation award ended by the veteran's election of pension"
            method: "no compensation recurs"
          - when: "the compensation award ended for any other reason"
            method: "the compensation actually issued in the twelve whole months before is counted"
          - when: "otherwise (the award is running)"
            method: "the monthly rate of its rating for a veteran alone recurs for twelve months"
        baseline:
          comp_recurring: "CPARAM('comp','monthly_rate_veteran_alone') * K('year_months')"
        evidence: [cross_category, history]
        cross_difficulty: comp
    baseline:
      rule: >-
        The recurring countable income is the veteran's Social Security, plus the spouse's Social Security where the rate category counts spouse income, plus his federal civil service annuity, plus interest and dividends, plus recurring VA disability compensation.
        In the standard redetermination each Social Security figure, the annuity figure and the interest figure are taken as reported on the most recent report of that source, and recurring compensation is the monthly rate of the veteran's compensation rating for a veteran alone for twelve months.
      params: [year_months, spouse_income_counted]
    inputs:
      history:
        - {table: pension_income_reports, aggregate: latest, field: annual_amount, filters: {event_type: pension_income_change_reported}}
        - {category: comp, table: comp_payments, aggregate: sum, field: gross_amount, within_months: 12, filters: {event_type: comp_retro_payment}}
      cross_category: [comp]

  - id: pension_ext_net_worth_redetermination
    base_policy_refs: [pension_rate_computation, pension_evt_medicaid_nursing_home, pension_evt_net_worth_and_transfers]
    overwrite: []
    trigger: state_due
    subject: [pension_financials_updated]
    computes: net_worth
    target_tool: update_net_worth_02de4f94
    params:
      fresh_declaration_days: 90
      stale_declaration_days: 365
      year_months: 12
      care_report_months: 3
      min_care_months: 3
      ongoing_gap_days: 92
      single_count: 1
      premium_recent_months: 12
      premium_lapse_months: 24
      part_b_monthly_premium: 202.90
      household_with_spouse: 2
      household_alone: 1
    rule: >-
      When a retroactive compensation release reaches a pensioner after his compensation award has ended, VA
      redetermines the net worth on the award: the assets last determined, adjusted for what has been
      deposited since, plus annual income, rounded to the cent. When a compensation release is paid to a
      pensioner, its gross amount is posted to the net worth on the award at once and stays there until net
      worth is redetermined. Net worth is not redetermined until the award carries the veteran's own
      declaration of the one-time VA payments deposited to him, dated on the date of the most recent
      compensation release. Net worth is redetermined only after the countable income on the award reflects
      the recurring income on file as of the redetermination. The assets last determined are the net worth on
      the award less the income on the reports it was determined from, which is the most recent figure for
      each of the veteran's Social Security, the spouse's Social Security, his federal civil service annuity
      and interest and dividends, and less every compensation release posted to it since the award was
      granted. Every compensation release deposited since the award was granted adds the net amount that
      reached the veteran's account, and every home loan funding fee VA refunded to him since then adds the
      amount refunded, because that money is now his to hold. A VA home loan is subtracted by what it secures:
      when the loan is active on the home the veteran occupies and no partial claim is owed, nothing is
      subtracted, because the home itself is excluded; when the loan is active and a partial claim is owed,
      only the partial claim balance is subtracted; otherwise its unpaid principal balance is subtracted.
      Annual income is the countable income on the award plus the one-time payments the veteran declared,
      reduced by the medical deduction. Annual income adds the one-time payments the veteran declared: a
      declaration received within the fresh period adds its full amount; one received after the fresh period
      but within one year adds its amount times the months left of its twelve-month year divided by twelve,
      rounded to the cent; with no declaration within one year nothing is added. The medical deduction for net
      worth is the medical figure, which is the insurance premiums counted plus the care cost, less the
      medical threshold when medical expense reports are on file, and nothing otherwise; the medical threshold
      is the rate category's medical expense threshold percentage of the category's basic rate for the medical
      deduction, rounded to the cent. Annual income after the medical deduction follows the deduction: when
      the deduction is positive and smaller than the income, the income less the deduction is used; when the
      deduction is positive and at least the income, no income is used; otherwise the income is used whole. In
      the standard redetermination the unpaid principal balance of every VA home loan the veteran holds is
      subtracted, no one-time payment is added to annual income, insurance premiums add nothing, the care cost
      is the total of the care months reported in the three whole months before the redetermination, counted
      once, and annual income is used whole. Insurance premiums for net worth count by how recently they were
      reported: medical expense reports received three to eleven whole months before the redetermination count
      as premiums at their total; when none was received in that span and some were received twelve to
      twenty-three whole months before, the standard Medicare Part B premium for twelve months for each member
      of the household the rate category covers is counted instead; otherwise premiums add nothing. The
      monthly care figure for net worth follows the care months reported: with at least three care months
      reported and the most recent month above the average of the reported months, the most recent month is
      the monthly figure; with at least three care months reported and the most recent month at or below that
      average, the average rounded to the cent is the monthly figure; otherwise the total reported stands in
      its place. That care figure is then counted over a number of months: when at least three care months are
      reported and the most recent care month ended no more than the ongoing-care gap before the report
      reached VA, or ended after it, the care is ongoing and the monthly figure is counted for twelve months;
      when at least three care months are reported and it ended more than that gap before the report reached
      VA, the care has ended and the monthly figure is counted once for each care month reported; otherwise it
      is counted once. The care cost for net worth is the monthly figure times the months counted, rounded to
      the cent.
    prerequisite:
      - problem: pension_ext_one_time_payment_declaration
        kind: value_input
        gate: declared_amount
        form: state
        policy_source: >-
          Net worth is not redetermined until the award carries the veteran's own declaration of the one-time VA
          payments deposited to him, dated on the date of the most recent compensation release.
        condition: >-
          pension_income_reports holds a pension_income_change_reported entry with income_source other on the award
          whose change_effective_date equals the payment_date of the most recent comp_retro_payment of the veteran.
        resolved_by: declare_lump_sum_cb649dee
        effect: >-
          The declaration's annual amount becomes declared_amount, and the fresh-declaration tier adds it in full to
          the annual income counted in net worth.
      - problem: pension_ext_recurring_income_redetermination
        kind: value_input
        gate: income_on_award
        form: state
        policy_source: >-
          Net worth is redetermined only after the countable income on the award reflects the recurring income on
          file as of the redetermination.
        condition: >-
          pension_awards.annual_countable_income equals the recurring countable income redetermined from the income
          reports, compensation status and deposits on file at the redetermination.
        resolved_by: update_countable_income_81bdd26c
        effect: >-
          income_on_award becomes the redetermined recurring income instead of the figure set when the award was
          granted, changing the annual income part of net worth.
    cross_category:
      - category: comp
        as: history
        reads: [comp_payments.gross_amount, comp_payments.net_amount, comp_payments.payment_date]
        note: The assets last determined take out the releases posted at gross, and each release adds the net amount that reached the veteran.
      - category: loan
        as: branch
        reads: [status, occupancy_certified, unpaid_principal_balance, partial_claim_balance, loan_transactions.amount, loan_transactions.transaction_date]
        note: The home loan factor reads the VA loan on the residence; the funding fee refunded since the grant is added as cash.
    compute:
      - ss_on_file: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='social_security') or 0"
      - spouse_on_file: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='spouse_income') or 0"
      - interest_on_file: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='interest_dividends') or 0"
      - annuity_on_file: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='retirement_pension') or 0"
      - since_grant: "MONTHS(F('opened_date'), NOW)"
      - releases_posted: "XSUM('comp','comp_payments','gross_amount', within_months=since_grant, date_field='payment_date', event_type='comp_retro_payment')"
      - assets_last: "F('net_worth') - (ss_on_file + spouse_on_file + annuity_on_file + interest_on_file) - releases_posted"
      - release_net: "XSUM('comp','comp_payments','net_amount', within_months=since_grant, date_field='payment_date', event_type='comp_retro_payment')"
      - fee_refund: "XSUM('loan','loan_transactions','amount', within_months=since_grant, date_field='transaction_date', event_type='loan_funding_fee_refunded')"
      - loan_status: "CFIELD('loan','status')"
      - loan_occupied: "CFIELD('loan','occupancy_certified') == True"
      - loan_partial: "CFIELD('loan','partial_claim_balance') or 0"
      - loan_balance: "CFIELD('loan','unpaid_principal_balance') or 0"
      - loan_subtracted: "0 if (loan_status == 'active' and loan_occupied and loan_partial == 0) else (loan_partial if (loan_status == 'active' and loan_partial > 0) else loan_balance)"
      - declared_amount: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='other')"
      - declared_received: "LATEST('pension_income_reports','received_date', date_field='received_date', event_type='pension_income_change_reported', income_source='other')"
      - declaration_age: "DAYS(declared_received, NOW) if declared_received else K('stale_declaration_days') + 1"
      - one_time_added: "declared_amount if declaration_age <= K('fresh_declaration_days') else (RND(declared_amount * (K('year_months') - MONTHS(declared_received, NOW)) / K('year_months'), 2) if declaration_age <= K('stale_declaration_days') else 0)"
      - income_on_award: "F('annual_countable_income')"
      - premiums_recent_total: "SUM('pension_income_reports','medical_expense_amount', within_months=K('premium_recent_months'), date_field='received_date', event_type='pension_medical_expenses_reported') - SUM('pension_income_reports','medical_expense_amount', within_months=K('care_report_months'), date_field='received_date', event_type='pension_medical_expenses_reported')"
      - premiums_recent_count: "COUNT('pension_income_reports', within_months=K('premium_recent_months'), date_field='received_date', event_type='pension_medical_expenses_reported') - COUNT('pension_income_reports', within_months=K('care_report_months'), date_field='received_date', event_type='pension_medical_expenses_reported')"
      - premiums_lapsed_count: "COUNT('pension_income_reports', within_months=K('premium_lapse_months'), date_field='received_date', event_type='pension_medical_expenses_reported') - COUNT('pension_income_reports', within_months=K('premium_recent_months'), date_field='received_date', event_type='pension_medical_expenses_reported')"
      - premiums_counted: "premiums_recent_total if premiums_recent_count > 0 else (K('part_b_monthly_premium') * K('year_months') * (K('household_with_spouse') if P('spouse_income_counted') else K('household_alone')) if premiums_lapsed_count > 0 else 0)"
      - care_total: "SUM('pension_income_reports','medical_expense_amount', within_months=K('care_report_months'), date_field='received_date', event_type='pension_medical_expenses_reported')"
      - care_count: "COUNT('pension_income_reports', within_months=K('care_report_months'), date_field='received_date', event_type='pension_medical_expenses_reported')"
      - care_latest: "LATEST('pension_income_reports','medical_expense_amount', date_field='expense_period_start', event_type='pension_medical_expenses_reported')"
      - care_average: "care_total / care_count if care_count > 0 else 0"
      - care_monthly: "care_latest if (care_count >= K('min_care_months') and care_latest > care_average) else (RND(care_average, 2) if (care_count >= K('min_care_months') and care_latest <= care_average) else care_total)"
      - care_latest_end: "LATEST('pension_income_reports','expense_period_end', date_field='expense_period_start', event_type='pension_medical_expenses_reported')"
      - care_received: "LATEST('pension_income_reports','received_date', date_field='expense_period_start', event_type='pension_medical_expenses_reported')"
      - care_gap_days: "DAYS(care_latest_end, care_received) if care_latest_end else 0"
      - care_months_counted: "K('year_months') if (care_count >= K('min_care_months') and care_gap_days <= K('ongoing_gap_days')) else (care_count if (care_count >= K('min_care_months') and care_gap_days > K('ongoing_gap_days')) else K('single_count'))"
      - care_cost: "RND(care_monthly * care_months_counted, 2)"
      - threshold: "RND(P('medical_deduction_base_mapr') * P('medical_expense_threshold_pct') / 100, 2)"
      - medical_reports: "COUNT('pension_income_reports', event_type='pension_medical_expenses_reported')"
      - medical_deduction: "premiums_counted + care_cost - threshold if medical_reports > 0 else 0"
      - income_for_net_worth: "income_on_award + one_time_added"
      - income_counted: "income_for_net_worth - medical_deduction if (medical_deduction > 0 and medical_deduction < income_for_net_worth) else (0 if (medical_deduction > 0 and medical_deduction >= income_for_net_worth) else income_for_net_worth)"
      - result: "RND(assets_last + release_net + fee_refund - loan_subtracted + income_counted, 2)"
    compute_basis:
      ss_on_file: "the most recent figure for each of the veteran's Social Security, the spouse's Social Security, his federal civil service annuity and interest and dividends"
      spouse_on_file: "the most recent figure for each of the veteran's Social Security, the spouse's Social Security, his federal civil service annuity and interest and dividends"
      interest_on_file: "the most recent figure for each of the veteran's Social Security, the spouse's Social Security, his federal civil service annuity and interest and dividends"
      annuity_on_file: "his federal civil service annuity"
      since_grant: "since the award was granted"
      releases_posted: "and less every compensation release posted to it since the award was granted"
      assets_last: "The assets last determined are the net worth on the award less the income on the reports it was determined from"
      release_net: "Every compensation release deposited since the award was granted adds the net amount that reached the veteran's account"
      fee_refund: "every home loan funding fee VA refunded to him since then adds the amount refunded, because that money is now his to hold"
      loan_status: "when the loan is active on the home the veteran occupies"
      loan_occupied: "the home the veteran occupies"
      loan_partial: "when the loan is active and a partial claim is owed, only the partial claim balance is subtracted"
      loan_balance: "otherwise its unpaid principal balance is subtracted"
      loan_subtracted: "A VA home loan is subtracted by what it secures: when the loan is active on the home the veteran occupies and no partial claim is owed, nothing is subtracted, because the home itself is excluded; when the loan is active and a partial claim is owed, only the partial claim balance is subtracted; otherwise its unpaid principal balance is subtracted."
      declared_amount: "Annual income adds the one-time payments the veteran declared"
      declared_received: "a declaration received within the fresh period adds its full amount"
      declaration_age: "one received after the fresh period but within one year adds its amount times the months left of its twelve-month year divided by twelve, rounded to the cent; with no declaration within one year nothing is added."
      one_time_added: "Annual income adds the one-time payments the veteran declared: a declaration received within the fresh period adds its full amount; one received after the fresh period but within one year adds its amount times the months left of its twelve-month year divided by twelve, rounded to the cent; with no declaration within one year nothing is added."
      income_on_award: "Annual income is the countable income on the award plus the one-time payments the veteran declared, reduced by the medical deduction."
      premiums_recent_total: "medical expense reports received three to eleven whole months before the redetermination count as premiums at their total"
      premiums_recent_count: "medical expense reports received three to eleven whole months before the redetermination"
      premiums_lapsed_count: "when none was received in that span and some were received twelve to twenty-three whole months before"
      premiums_counted: "Insurance premiums for net worth count by how recently they were reported: medical expense reports received three to eleven whole months before the redetermination count as premiums at their total; when none was received in that span and some were received twelve to twenty-three whole months before, the standard Medicare Part B premium for twelve months for each member of the household the rate category covers is counted instead; otherwise premiums add nothing."
      care_total: "otherwise the total reported stands in its place"
      care_count: "with at least three care months reported"
      care_latest: "the most recent month is the monthly figure"
      care_average: "the average rounded to the cent is the monthly figure"
      care_monthly: "The monthly care figure for net worth follows the care months reported: with at least three care months reported and the most recent month above the average of the reported months, the most recent month is the monthly figure; with at least three care months reported and the most recent month at or below that average, the average rounded to the cent is the monthly figure; otherwise the total reported stands in its place."
      care_latest_end: "the most recent care month ended no more than the ongoing-care gap before the report reached VA, or ended after it"
      care_received: "before the report reached VA"
      care_gap_days: "when at least three care months are reported and it ended more than that gap before the report reached VA, the care has ended"
      care_months_counted: "That care figure is then counted over a number of months: when at least three care months are reported and the most recent care month ended no more than the ongoing-care gap before the report reached VA, or ended after it, the care is ongoing and the monthly figure is counted for twelve months; when at least three care months are reported and it ended more than that gap before the report reached VA, the care has ended and the monthly figure is counted once for each care month reported; otherwise it is counted once."
      care_cost: "The care cost for net worth is the monthly figure times the months counted, rounded to the cent."
      threshold: "the medical threshold is the rate category's medical expense threshold percentage of the category's basic rate for the medical deduction, rounded to the cent"
      medical_reports: "when medical expense reports are on file, and nothing otherwise"
      medical_deduction: "The medical deduction for net worth is the medical figure, which is the insurance premiums counted plus the care cost, less the medical threshold when medical expense reports are on file, and nothing otherwise"
      income_for_net_worth: "Annual income is the countable income on the award plus the one-time payments the veteran declared"
      income_counted: "Annual income after the medical deduction follows the deduction: when the deduction is positive and smaller than the income, the income less the deduction is used; when the deduction is positive and at least the income, no income is used; otherwise the income is used whole."
      result: "the assets last determined, adjusted for what has been deposited since, plus annual income, rounded to the cent."
    factors:
      - id: home_loan_subtraction
        effect: parameter
        decides: loan_subtracted
        bindings: [loan_status, loan_occupied, loan_partial, loan_balance, loan_subtracted]
        ladder:
          - when: "the VA loan is active on the home the veteran occupies AND no partial claim is owed"
            value: "0 - the excluded home's loan is not subtracted"
          - when: "the VA loan is active AND a partial claim is owed"
            value: "the partial claim balance"
          - when: "otherwise"
            value: "the unpaid principal balance"
        baseline:
          loan_subtracted: "loan_balance"
        evidence: [cross_category]
        cross_difficulty: loan
      - id: declared_one_time_income
        effect: method
        decides: one_time_added
        bindings: [declared_amount, declared_received, declaration_age, one_time_added]
        ladder:
          - when: "the veteran's one-time declaration was received within the fresh period"
            method: "its full amount is added"
          - when: "it was received after the fresh period but within one year"
            method: "its amount times the months left of its twelve-month year, divided by twelve"
          - when: "otherwise"
            method: "nothing is added"
        baseline:
          one_time_added: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: income_after_medical_deduction
        effect: parameter
        decides: income_counted
        bindings: [medical_reports, medical_deduction, income_counted]
        ladder:
          - when: "the medical deduction is positive AND smaller than the annual income"
            value: "the income less the deduction"
          - when: "the medical deduction is positive AND at least the annual income"
            value: "0 - no income is used"
          - when: "otherwise"
            value: "the income whole"
        baseline:
          income_counted: "income_for_net_worth"
        evidence: [history]
        cross_difficulty: null
      - id: net_worth_premium_report_age
        effect: parameter
        decides: premiums_counted
        bindings: [premiums_recent_total, premiums_recent_count, premiums_lapsed_count, premiums_counted]
        ladder:
          - when: "medical expense reports were received three to eleven whole months before"
            value: "their total"
          - when: "none was received in that span AND some were received twelve to twenty-three whole months before"
            value: "K('part_b_monthly_premium') x K('year_months') x household members"
          - when: "otherwise"
            value: "0"
        baseline:
          premiums_counted: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: net_worth_care_monthly
        effect: method
        decides: care_monthly
        bindings: [care_count, care_latest, care_average, care_monthly]
        ladder:
          - when: "at least three care months are reported AND the most recent month is above their average"
            method: "the most recent month is the monthly figure"
          - when: "at least three care months are reported AND the most recent month is at or below their average"
            method: "the average of the reported months, rounded to the cent"
          - when: "otherwise"
            method: "the total reported stands as the figure"
        baseline:
          care_monthly: "care_total"
        evidence: [history]
        cross_difficulty: null
      - id: net_worth_care_months
        effect: parameter
        decides: care_months_counted
        bindings: [care_latest_end, care_received, care_gap_days, care_months_counted]
        ladder:
          - when: "at least three care months are reported AND the most recent care month ended no more than the ongoing-care gap before the report reached VA, or ended after it"
            value: "K('year_months') - care is ongoing"
          - when: "at least three care months are reported AND it ended more than that gap before the report reached VA"
            value: "the number of care months reported"
          - when: "otherwise"
            value: "K('single_count')"
        baseline:
          care_months_counted: "K('single_count')"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The assets last determined are the net worth on the award less the income on the reports it was
        determined from, which is the most recent figure for each of the veteran's Social Security, the
        spouse's Social Security, his federal civil service annuity and interest and dividends, and less
        every compensation release posted to it since the award was granted. Every compensation release
        deposited since the award was granted adds the net amount that reached the veteran's account, and
        every home loan funding fee VA refunded to him since then adds the amount refunded, because that
        money is now his to hold. In the standard redetermination the unpaid principal balance of every VA
        home loan the veteran holds is subtracted, no one-time payment is added to annual income, insurance
        premiums add nothing, the care cost is the total of the care months reported in the three whole
        months before the redetermination, counted once, and annual income is used whole.
      params: [care_report_months, medical_expense_threshold_pct, medical_deduction_base_mapr]
    inputs:
      history:
        - {table: pension_income_reports, aggregate: latest, field: annual_amount, filters: {event_type: pension_income_change_reported}}
        - {table: pension_income_reports, aggregate: sum, field: medical_expense_amount, within_months: 24, filters: {event_type: pension_medical_expenses_reported}}
        - {table: pension_income_reports, aggregate: count, field: report_id, filters: {event_type: pension_medical_expenses_reported}}
        - {category: comp, table: comp_payments, aggregate: sum, field: net_amount, filters: {event_type: comp_retro_payment}}
        - {category: loan, table: loan_transactions, aggregate: sum, field: amount, filters: {event_type: loan_funding_fee_refunded}}
      cross_category: [comp, loan]
  - id: pension_ext_annual_rate_redetermination
    base_policy_refs: [pension_rate_computation, pension_evt_income_change, pension_evt_medical_expenses, pension_evt_net_worth_and_transfers, pension_evt_income_match]
    overwrite: []
    trigger: on_request
    subject: [pension_rate_adjusted]
    computes: adjusted_annual_rate
    target_tool: record_annual_rate_redetermination_a1a40d3e
    params:
      fresh_declaration_days: 90
      stale_declaration_days: 365
      year_months: 12
      care_report_months: 3
      min_care_months: 3
      ongoing_gap_days: 92
      single_count: 1
      premium_recent_months: 12
      premium_lapse_months: 24
      part_b_monthly_premium: 202.90
      household_with_spouse: 2
      household_alone: 1
    rule: >-
      When a veteran asks VA to settle what his pension will be after one-time payments and new care costs, VA
      redetermines the annual pension going forward and records it as a rate adjustment. Recurring care costs
      the veteran has reported that no rate adjustment has yet taken in are taken into the redetermination,
      and no separate care-cost rate adjustment is recorded for them. The redetermined annual rate is fixed
      only after the countable income on the award matches the recurring income on file. A redetermined annual
      rate is not recorded until the net worth on the award counts every one-time VA payment deposited since
      the award was granted. When the redetermined rate is lower than the rate being paid, it takes effect on
      the last day of the month in which the most recent change it reflects began and the lower rate is paid
      from the following month; when it is higher, it takes effect on the first day of the month after that
      month; it names as its source the veteran's one-time payment declaration, and it carries the channel of
      that declaration. While the net worth on the award exceeds the net worth limit no pension is payable and
      the redetermined rate is zero. The annual pension is the maximum annual pension rate of the rate
      category plus the additional child increment for each additional child, less countable income after the
      medical deduction, never below zero and rounded down to the whole dollar. Countable income is the
      countable income on the award plus the one-time payments counted. The medical deduction is the medical
      figure, which is the insurance premiums counted plus the care cost, less the medical threshold when
      medical expense reports are on file, and nothing otherwise; the medical threshold is the rate category's
      medical expense threshold percentage of the category's basic rate for the medical deduction, rounded to
      the cent. Countable income after the medical deduction follows the deduction: when the deduction is
      positive and smaller than the countable income, the countable income less the deduction is used; when
      the deduction is positive and at least the countable income, no countable income is used; otherwise the
      countable income is used whole. In the standard redetermination no one-time payment is counted,
      insurance premiums add nothing, the care cost is the total of the care months reported in the three
      whole months before the redetermination, counted once, and the countable income is used whole. One-time
      payments are counted by the age of the veteran's declaration: a declaration received within the fresh
      period counts in full; one received after the fresh period but within one year counts its amount times
      the months left of its twelve-month year divided by twelve, rounded to the cent; with no declaration
      within one year none counts. Insurance premiums count by how recently they were reported: medical
      expense reports received three to eleven whole months before the redetermination count as premiums at
      their total; when none was received in that span and some were received twelve to twenty-three whole
      months before, the standard Medicare Part B premium for twelve months for each member of the household
      the rate category covers is counted instead; otherwise premiums add nothing. The monthly care figure
      follows the care months reported: with at least three care months reported and the most recent month
      above the average of the reported months, the most recent month is the monthly figure; with at least
      three care months reported and the most recent month at or below that average, the average rounded to
      the cent is the monthly figure; otherwise the total reported stands in its place. The care figure is
      then counted over a number of months: when at least three care months are reported and the most recent
      care month ended no more than the ongoing-care gap before the report reached VA, or ended after it, the
      care is ongoing and the monthly figure is counted for twelve months; when at least three care months are
      reported and it ended more than that gap before the report reached VA, the care has ended and the
      monthly figure is counted once for each care month reported; otherwise it is counted once. The care cost
      is the monthly figure times the months counted, rounded to the cent.
    prerequisite:
      - problem: pension_ext_recurring_income_redetermination
        kind: value_input
        gate: income_on_award
        form: state
        policy_source: >-
          The redetermined annual rate is fixed only after the countable income on the award matches the recurring income on file.
        condition: >-
          pension_awards.annual_countable_income equals the recurring countable income redetermined from the income
          reports, compensation status and deposits on file at the redetermination.
        resolved_by: update_countable_income_81bdd26c
        effect: >-
          income_on_award becomes the redetermined recurring income, which enters countable income in place of the
          figure set when the award was granted.
      - problem: pension_ext_net_worth_redetermination
        kind: state_gate
        gate: pension_awards.net_worth
        form: state
        policy_source: >-
          A redetermined annual rate is not recorded until the net worth on the award counts every one-time VA payment
          deposited since the award was granted.
        condition: >-
          pension_awards.net_worth counts every one-time VA payment deposited since pension_awards.opened_date at the cash it brought, with no compensation release left posted at its gross amount.
        resolved_by: update_net_worth_02de4f94
        effect: >-
          The payability gate (net worth at or below the limit) is judged on the redetermined net worth, so the rate
          is recorded on a confirmed net worth instead of the figure set when the award was granted.
    cross_category: []
    compute:
      - income_on_award: "F('annual_countable_income')"
      - declared_amount: "LATEST('pension_income_reports','annual_amount', date_field='received_date', event_type='pension_income_change_reported', income_source='other')"
      - declared_received: "LATEST('pension_income_reports','received_date', date_field='received_date', event_type='pension_income_change_reported', income_source='other')"
      - declaration_age: "DAYS(declared_received, NOW) if declared_received else K('stale_declaration_days') + 1"
      - one_time_counted: "declared_amount if declaration_age <= K('fresh_declaration_days') else (RND(declared_amount * (K('year_months') - MONTHS(declared_received, NOW)) / K('year_months'), 2) if declaration_age <= K('stale_declaration_days') else 0)"
      - countable_income: "income_on_award + one_time_counted"
      - threshold: "RND(P('medical_deduction_base_mapr') * P('medical_expense_threshold_pct') / 100, 2)"
      - premiums_recent_total: "SUM('pension_income_reports','medical_expense_amount', within_months=K('premium_recent_months'), date_field='received_date', event_type='pension_medical_expenses_reported') - SUM('pension_income_reports','medical_expense_amount', within_months=K('care_report_months'), date_field='received_date', event_type='pension_medical_expenses_reported')"
      - premiums_recent_count: "COUNT('pension_income_reports', within_months=K('premium_recent_months'), date_field='received_date', event_type='pension_medical_expenses_reported') - COUNT('pension_income_reports', within_months=K('care_report_months'), date_field='received_date', event_type='pension_medical_expenses_reported')"
      - premiums_lapsed_count: "COUNT('pension_income_reports', within_months=K('premium_lapse_months'), date_field='received_date', event_type='pension_medical_expenses_reported') - COUNT('pension_income_reports', within_months=K('premium_recent_months'), date_field='received_date', event_type='pension_medical_expenses_reported')"
      - premiums_counted: "premiums_recent_total if premiums_recent_count > 0 else (K('part_b_monthly_premium') * K('year_months') * (K('household_with_spouse') if P('spouse_income_counted') else K('household_alone')) if premiums_lapsed_count > 0 else 0)"
      - care_total: "SUM('pension_income_reports','medical_expense_amount', within_months=K('care_report_months'), date_field='received_date', event_type='pension_medical_expenses_reported')"
      - care_count: "COUNT('pension_income_reports', within_months=K('care_report_months'), date_field='received_date', event_type='pension_medical_expenses_reported')"
      - care_latest: "LATEST('pension_income_reports','medical_expense_amount', date_field='expense_period_start', event_type='pension_medical_expenses_reported')"
      - care_average: "care_total / care_count if care_count > 0 else 0"
      - care_monthly: "care_latest if (care_count >= K('min_care_months') and care_latest > care_average) else (RND(care_average, 2) if (care_count >= K('min_care_months') and care_latest <= care_average) else care_total)"
      - care_latest_end: "LATEST('pension_income_reports','expense_period_end', date_field='expense_period_start', event_type='pension_medical_expenses_reported')"
      - care_received: "LATEST('pension_income_reports','received_date', date_field='expense_period_start', event_type='pension_medical_expenses_reported')"
      - care_gap_days: "DAYS(care_latest_end, care_received) if care_latest_end else 0"
      - care_months_counted: "K('year_months') if (care_count >= K('min_care_months') and care_gap_days <= K('ongoing_gap_days')) else (care_count if (care_count >= K('min_care_months') and care_gap_days > K('ongoing_gap_days')) else K('single_count'))"
      - care_cost: "RND(care_monthly * care_months_counted, 2)"
      - medical_reports: "COUNT('pension_income_reports', event_type='pension_medical_expenses_reported')"
      - medical_deduction: "premiums_counted + care_cost - threshold if medical_reports > 0 else 0"
      - income_after_deduction: "countable_income - medical_deduction if (medical_deduction > 0 and medical_deduction < countable_income) else (0 if (medical_deduction > 0 and medical_deduction >= countable_income) else countable_income)"
      - payable: "F('net_worth') <= P('net_worth_limit')"
      - result: "int(max(0, P('mapr_annual') + P('additional_child_increment') * F('additional_children_count') - income_after_deduction)) if payable else 0"
    compute_basis:
      income_on_award: "Countable income is the countable income on the award plus the one-time payments counted."
      declared_amount: "One-time payments are counted by the age of the veteran's declaration"
      declared_received: "a declaration received within the fresh period counts in full"
      declaration_age: "one received after the fresh period but within one year counts its amount times the months left of its twelve-month year divided by twelve, rounded to the cent; with no declaration within one year none counts."
      one_time_counted: "One-time payments are counted by the age of the veteran's declaration: a declaration received within the fresh period counts in full; one received after the fresh period but within one year counts its amount times the months left of its twelve-month year divided by twelve, rounded to the cent; with no declaration within one year none counts."
      countable_income: "Countable income is the countable income on the award plus the one-time payments counted."
      threshold: "the medical threshold is the rate category's medical expense threshold percentage of the category's basic rate for the medical deduction, rounded to the cent"
      premiums_recent_total: "medical expense reports received three to eleven whole months before the redetermination count as premiums at their total"
      premiums_recent_count: "medical expense reports received three to eleven whole months before the redetermination"
      premiums_lapsed_count: "when none was received in that span and some were received twelve to twenty-three whole months before"
      premiums_counted: "Insurance premiums count by how recently they were reported: medical expense reports received three to eleven whole months before the redetermination count as premiums at their total; when none was received in that span and some were received twelve to twenty-three whole months before, the standard Medicare Part B premium for twelve months for each member of the household the rate category covers is counted instead; otherwise premiums add nothing."
      care_total: "the care cost is the total of the care months reported in the three whole months before the redetermination, counted once"
      care_count: "with at least three care months reported"
      care_latest: "the most recent month is the monthly figure"
      care_average: "the average of the reported months"
      care_monthly: "The monthly care figure follows the care months reported: with at least three care months reported and the most recent month above the average of the reported months, the most recent month is the monthly figure; with at least three care months reported and the most recent month at or below that average, the average rounded to the cent is the monthly figure; otherwise the total reported stands in its place."
      care_latest_end: "the most recent care month ended no more than the ongoing-care gap before the report reached VA, or ended after it"
      care_received: "before the report reached VA"
      care_gap_days: "when at least three care months are reported and it ended more than that gap before the report reached VA, the care has ended"
      care_months_counted: "The care figure is then counted over a number of months: when at least three care months are reported and the most recent care month ended no more than the ongoing-care gap before the report reached VA, or ended after it, the care is ongoing and the monthly figure is counted for twelve months; when at least three care months are reported and it ended more than that gap before the report reached VA, the care has ended and the monthly figure is counted once for each care month reported; otherwise it is counted once."
      care_cost: "The care cost is the monthly figure times the months counted, rounded to the cent."
      medical_reports: "when medical expense reports are on file, and nothing otherwise"
      medical_deduction: "The medical deduction is the medical figure, which is the insurance premiums counted plus the care cost, less the medical threshold when medical expense reports are on file, and nothing otherwise"
      income_after_deduction: "Countable income after the medical deduction follows the deduction: when the deduction is positive and smaller than the countable income, the countable income less the deduction is used; when the deduction is positive and at least the countable income, no countable income is used; otherwise the countable income is used whole."
      payable: "While the net worth on the award exceeds the net worth limit no pension is payable and the redetermined rate is zero."
      result: "The annual pension is the maximum annual pension rate of the rate category plus the additional child increment for each additional child, less countable income after the medical deduction, never below zero and rounded down to the whole dollar."
    factors:
      - id: one_time_payments_counted
        effect: method
        decides: one_time_counted
        bindings: [declared_amount, declared_received, declaration_age, one_time_counted]
        ladder:
          - when: "the veteran's one-time declaration was received within the fresh period"
            method: "it counts in full"
          - when: "it was received after the fresh period but within one year"
            method: "its amount times the months left of its twelve-month year, divided by twelve"
          - when: "otherwise"
            method: "none counts"
        baseline:
          one_time_counted: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: rate_income_after_deduction
        effect: parameter
        decides: income_after_deduction
        bindings: [medical_reports, medical_deduction, income_after_deduction]
        ladder:
          - when: "the medical deduction is positive AND smaller than the countable income"
            value: "the countable income less the deduction"
          - when: "the medical deduction is positive AND at least the countable income"
            value: "0 - no countable income is used"
          - when: "otherwise"
            value: "the countable income whole"
        baseline:
          income_after_deduction: "countable_income"
        evidence: [history]
        cross_difficulty: null
      - id: premium_report_age
        effect: parameter
        decides: premiums_counted
        bindings: [premiums_recent_total, premiums_recent_count, premiums_lapsed_count, premiums_counted]
        ladder:
          - when: "medical expense reports were received three to eleven whole months before"
            value: "their total"
          - when: "none was received in that span AND some were received twelve to twenty-three whole months before"
            value: "K('part_b_monthly_premium') x K('year_months') x household members"
          - when: "otherwise"
            value: "0"
        baseline:
          premiums_counted: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: redetermined_care_monthly
        effect: method
        decides: care_monthly
        bindings: [care_count, care_latest, care_average, care_monthly]
        ladder:
          - when: "at least three care months are reported AND the most recent month is above their average"
            method: "the most recent month is the monthly figure"
          - when: "at least three care months are reported AND the most recent month is at or below their average"
            method: "the average of the reported months, rounded to the cent"
          - when: "otherwise"
            method: "the total reported stands as the figure"
        baseline:
          care_monthly: "care_total"
        evidence: [history]
        cross_difficulty: null
      - id: redetermined_care_months
        effect: parameter
        decides: care_months_counted
        bindings: [care_latest_end, care_received, care_gap_days, care_months_counted]
        ladder:
          - when: "at least three care months are reported AND the most recent care month ended no more than the ongoing-care gap before the report reached VA, or ended after it"
            value: "K('year_months') - care is ongoing"
          - when: "at least three care months are reported AND it ended more than that gap before the report reached VA"
            value: "the number of care months reported"
          - when: "otherwise"
            value: "K('single_count')"
        baseline:
          care_months_counted: "K('single_count')"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The annual pension is the maximum annual pension rate of the rate category plus the additional child
        increment for each additional child, less countable income after the medical deduction, never below
        zero and rounded down to the whole dollar. Countable income is the countable income on the award
        plus the one-time payments counted. In the standard redetermination no one-time payment is counted,
        insurance premiums add nothing, the care cost is the total of the care months reported in the three
        whole months before the redetermination, counted once, and the countable income is used whole.
      params: [care_report_months, mapr_annual, additional_child_increment, medical_expense_threshold_pct, medical_deduction_base_mapr]
    inputs:
      history:
        - {table: pension_income_reports, aggregate: latest, field: annual_amount, filters: {event_type: pension_income_change_reported, income_source: other}}
        - {table: pension_income_reports, aggregate: sum, field: medical_expense_amount, within_months: 24, filters: {event_type: pension_medical_expenses_reported}}
        - {table: pension_income_reports, aggregate: count, field: report_id, filters: {event_type: pension_medical_expenses_reported}}
      cross_category: []
