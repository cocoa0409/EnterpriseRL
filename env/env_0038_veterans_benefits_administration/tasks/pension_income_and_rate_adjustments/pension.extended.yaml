category: pension
display_name: Veterans Pension

binding:
  holding_table: pension_awards
  event_tables: [pension_payments, pension_income_reports]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [authorized, running, suspended, terminated]
  transitions:
    - {from: authorized, to: running, by: system, means: The first monthly pension payment under a newly authorized award is released.}
    - {from: running, to: suspended, by: agent, means: Payments are suspended because the veteran's whereabouts are unknown, payments keep coming back, or an income match is awaiting the veteran's response after due process.}
    - {from: suspended, to: running, by: agent, means: The cause of suspension is cured and payments resume.}
    - {from: running, to: terminated, by: agent, means: The award ends because of death, income or net worth above the limit, an election of compensation, or renunciation.}
    - {from: suspended, to: terminated, by: agent, means: A suspended award ends for one of the same reasons.}

accounts:
  - key: pension_paid
    unit: USD
    meaning: Net pension actually delivered to the veteran - monthly and retroactive payments credit it, payments returned by the Treasury debit it.

parameter_schema:
  mapr_annual: Maximum annual pension rate for the rate category, USD per year, effective December 1, 2025.
  additional_child_increment: Amount added to the maximum annual pension rate for each additional dependent child, USD per year.
  medical_deduction_base_mapr: The basic maximum annual pension rate for the household size (without housebound or aid-and-attendance increments) on which the medical expense threshold is computed, USD per year.
  medical_expense_threshold_pct: Share of the medical deduction base that unreimbursed medical expenses must exceed before the excess is deducted from income, percent.
  net_worth_limit: Net worth (assets plus annual income) above which no pension is payable, USD.
  net_worth_includes_annual_income: Whether annual countable income is added to assets when net worth is measured, boolean.
  residence_lot_exclusion_acres: Acreage of the residential lot excluded with the primary residence from assets, acres.
  asset_transfer_lookback_months: Months before the date of claim or report during which a transfer of a covered asset for less than fair market value is penalized, months.
  penalty_rate_monthly: Monthly penalty rate by which the covered transfer amount is divided to set the penalty period, USD.
  penalty_max_months: Longest penalty period that can be imposed, months.
  penalty_month_rounding: How the computed penalty period is rounded, enum text (down_to_whole_month).
  exempt_transfer_child_trust: Whether a transfer to a trust for a child who cannot self-support is exempt from penalty, boolean.
  min_wartime_service_days: Minimum days of active duty, at least one during a wartime period, for a veteran who entered service before September 8, 1980, days.
  post_1980_min_service_months: Minimum continuous active duty for an enlisted veteran who entered after September 7, 1980 (or the full period called up), months.
  age_presumption_total_disability: Age at which a veteran is treated as permanently and totally disabled for pension purposes, years.
  monthly_rate_rounding: How the monthly pension amount is rounded, enum text (whole_dollar_down).
  payment_day_of_month: Day of the following month on which a monthly payment is issued (prior business day when it falls on a weekend or holiday), day number.
  payment_start_lag_months: Months after the effective date month before the first entitlement month is paid, months.
  income_change_effective_lag_months: Months after the month in which an income change occurs before the adjusted rate is paid, months.
  medical_expense_report_window_months: Months after the end of the expense year within which unreimbursed medical expenses for that year may be reported for a retroactive adjustment, calendar months.
  prospective_expense_annualization_months: Number of months over which a recurring monthly medical expense is annualized for a prospective rate, months.
  medicaid_nursing_home_cap_monthly: Monthly pension payable to a veteran without dependents residing in a Medicaid-covered nursing home, USD.
  medicaid_cap_applies: Whether the Medicaid nursing-home limit applies to this rate category, boolean (it applies only without a spouse or child).
  medicaid_cap_start_months_after_admission: Full calendar months after the month of admission after which the Medicaid nursing-home limit applies, months.
  spouse_income_counted: Whether the spouse's income is included in countable income for this rate category, boolean.
  excluded_income_sources: Income kinds never counted, list.
  income_match_response_days: Days after VA's notice of an income-match discrepancy within which the veteran may respond before the proposed adjustment is made, calendar days.
  income_match_hearing_request_days: Days after the income-match notice within which a hearing request delays the adjustment, calendar days.
  unreported_income_creates_overpayment: Whether an adjustment reaching back over months already paid creates an overpayment debt, boolean.
  election_greater_benefit_default: Whether a veteran entitled to both pension and compensation is paid the greater benefit absent a written election, boolean.
  reapply_after_net_worth_decrease: Whether a veteran denied or terminated for net worth may reapply once net worth falls to or below the limit, boolean.
  incapacity_retro_days: Days before the date of claim to which an original award can reach back when a disability prevented filing, calendar days.
  itf_validity_days: Days after VA receives an intent to file during which a completed pension claim takes that date, calendar days.
  aa_medical_form_required: Whether an aid-and-attendance or housebound rate requires a physician's examination report, boolean.
  housebound_single_disability_pct: Rating of a single permanent disability that, with a separate disability rated at the second threshold or confinement to the home, establishes housebound status, percent.
  housebound_additional_disability_pct: Rating of the separate disability that, together with the single 100 percent disability, establishes housebound status, percent.
  aa_includes_housebound: Whether a veteran who meets aid-and-attendance criteria is paid at the aid-and-attendance rate rather than housebound, boolean.
  direct_deposit_change_lead_days: Minimum days before a payment date that an account change must be recorded to apply to that payment, calendar days.
  month_of_death_payable: Whether the payment for the month of the veteran's death is released to the surviving spouse, boolean.
  returned_payments_suspension_count: Returned payments within the window that require suspension, count.
  returned_payments_window_months: Rolling window for counting returned payments, months.
  dependent_rate_requires_dependency_claim: Whether moving from a no-dependent to a one-dependent rate requires a dependency claim received online or by mail, boolean.
  dependency_report_window_days: Days after a marriage or birth within which a dependency claim takes the event date as its effective date, calendar days.
  child_age_limit_years: Age at which a child stops counting as a dependent unless in school or helpless, years.
  school_child_age_limit_years: Age at which a child attending school stops counting as a dependent, years.
  income_decrease_effective_rule: When a decrease in countable income raises the rate, enum text (first_of_month_after_change).
  income_increase_effective_rule: When an increase in countable income lowers the rate, enum text (last_day_of_month_of_change).
  final_expenses_deductible: Whether a veteran's paid final expenses for a deceased spouse or child are deductible from countable income, boolean.

