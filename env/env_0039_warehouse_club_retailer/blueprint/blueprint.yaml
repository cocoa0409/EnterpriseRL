name: env_0039_warehouse_club_retailer
company: Northgate Wholesale Club

background: |
  Northgate Wholesale Club is a membership warehouse club operating 214 clubs across 31 US states, together
  with Northgate.com, a same-day delivery partnership and a network of business delivery routes, and it
  serves about 21 million cardholders from a member services center in Columbus, Ohio. Its tone is plain,
  practical and value-minded: members pay an annual fee for the right to shop, and the club earns their
  renewal through low prices and dependable service.
  Shopping rights come from a membership held at one of six tiers — Northgate Student Club Membership,
  Northgate Heroes Club Membership, Northgate Club Membership, Northgate Business Membership, Northgate
  Club Plus Membership and Northgate Business Plus Membership — each a yearly contract with its own
  membership number, household and business add-on cardholders, and a ledger of fees, refunds and, on the
  Plus tiers, Annual Reward accruals and certificates.
  Meridian Trust Bank issues the co-branded and store cards linked to those memberships: the Northgate Store
  Card, Northgate Business Store Card, Northgate Rewards Visa Signature, Northgate Rewards Visa Business,
  Northgate Rewards Visa Signature Plus and Northgate Rewards Visa Business Plus, each booking statement
  rewards that turn into a yearly reward certificate.
  Every purchase is kept as a record on its channel — Northgate In-Club Purchase, Northgate Club Pickup
  Order, Northgate Same-Day Delivery Order, Northgate.com Ship-to-Home Order, Northgate Business Delivery
  Order or Northgate Special Order — with line-level sales, returns, price adjustments, mail-in rebate
  credits and order fees.
  Big and bulky merchandise travels on a delivery appointment booked as Northgate Curbside Delivery,
  Northgate Threshold Delivery, Northgate Room of Choice Delivery, Northgate White Glove Delivery,
  Northgate Appliance Delivery & Installation or Northgate TV Delivery & Wall-Mount Installation, each
  carrying its own fees, credits and claims.
  The Tire Center installs tires under the Northgate Tire Mount & Balance, Northgate Tire Installation
  Package, Northgate Light Truck Tire Installation Package, Northgate Tire Installation Package with Road
  Hazard, Northgate Premium Tire Care or Northgate Light Truck Tire Installation Package with Road Hazard,
  and logs every rotation, repair, replacement and credit against that package for the life of the set.
  Optical counters make prescription eyewear in Northgate Single Vision Lenses, Northgate Lined Bifocal
  Lenses, Northgate Lined Trifocal Lenses, Northgate Standard Progressive Lenses, Northgate Premium
  Progressive Lenses and Northgate Digital Freeform Progressive Lenses, each pair a job with its charges,
  vision plan allowances, remakes and refunds.
  Electronics, appliances and furniture can be covered by Northgate Care protection plans — the 2-Year
  Electronics Plan, 3-Year Electronics Plan, 3-Year Electronics Plan with Accident Protection, 4-Year
  Mattress & Furniture Plan, 3-Year Appliance Plan and 5-Year Appliance Plan — each tied to one sale line
  and booked through its plan charge, claims and refunds.
  Callers are mostly households holding one consumer membership with a household card, often a Northgate
  Rewards Visa, a few recent purchases and perhaps an eyewear job or a tire package, alongside small
  business owners who hold a Business or Business Plus membership with several add-on cardholders,
  sometimes next to a personal membership.
  They bring years of history: memberships renewed on time or late, tiers upgraded and downgraded,
  certificates issued and lost, returns and price adjustments across many receipts, deliveries moved or
  missed, tires rotated and replaced, and glasses remade.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: membership_fees_renewals_and_cardholders
    claim:
      categories: [membership]
      event_types: [membership_term_renewed, membership_renewed_after_lapse, membership_upgraded, membership_downgraded, membership_auto_renew_changed, membership_cancelled, membership_fee_charged, membership_fee_refunded, membership_reward_certificate_reissued, membership_card_issued, membership_card_deactivated]
    summary: >
      Primary members of every tier call about the membership contract itself: renewing on time or after a
      lapse, upgrading a base tier to its Plus counterpart, switching automatic renewal or its payment card,
      adding, replacing or removing household and business add-on cardholders, recovering a lost Annual
      Reward certificate, claiming the Plus guarantee after a weak reward year, or cancelling for a refund —
      and the same request plays out differently for a Student Club member whose verification has lapsed, a
      Business Plus member with every add-on card slot in use, a Club Plus member who also holds a business membership,
      or a member whose membership is expired, suspended or already closed. The governing records are the
      membership's tier, status, membership year dates, automatic renewal setting and verification date, its
      fee, reward and certificate ledger, its card issuance history and any open membership request, and
      the rules are shaped as state gates on which statuses allow renewal, upgrade, card issuance or refunds
      (membership_renewal_dating, membership_upgrade, membership_cardholders, membership_cancellation_refund),
      time windows anchored on the expiry date or the first day of the membership year
      (membership_renewal_dating, membership_plus_guarantee, membership_reward_certificates), per-tier fee,
      refund and reward parameters (membership_fee_schedule, membership_annual_reward_earning), and
      combination rules such as one membership per segment (membership_agg_multi_holding), rewards following
      the card presented (membership_agg_reward_attribution) and automatic renewal on the Northgate Visa
      needing an active linked card (membership_auto_renewal). In the natural order of the business, a
      membership year is paid before it is used, rewards accrue during the year and are converted at its end,
      and a membership's history is never rewritten by later tier changes. Member services renews, upgrades,
      changes automatic renewal, issues and deactivates cards, reissues certificates and posts fee charges
      and refunds, while a cancellation, a downgrade at renewal or a guarantee claim is recorded as a request
      that only the primary member can confirm through their own confirmation step. Lifting a suspension,
      moving reward between memberships, reopening a closed membership number, or paying out an expired
      certificate are not decided by any Northgate policy available to member services and leave a transfer
      to a human representative as the only correct route.

  - name: purchases_returns_and_price_adjustments
    claim:
      categories: [order]
      event_types: [order_cancelled, order_line_returned, order_partially_returned, order_fully_returned, order_price_adjusted, order_rebate_credited, order_fee_charged, order_fee_refunded]
    summary: >
      Members call about things they bought — an online order to cancel, a television or sofa to send back,
      a parcel that never arrived or arrived damaged, an item that went on Instant Savings a week after
      purchase, a manufacturer rebate that was never paid, or a delivery fee or non-member surcharge they
      think they should not have paid — and the answer depends on the purchase channel, the merchandise
      class, how long ago the purchase was fulfilled, what has already been refunded or adjusted on the same
      line, whether a Plus membership was presented, and how many returns the membership has made across all
      its receipts. The records involved are the purchase with its channel, status, fulfillment date and
      tender, its sale lines and every refund, adjustment, rebate and fee entry pointing back to them, the
      return authorizations, the item price history and the presenting membership; the rules take the shape
      of per-channel and per-class windows anchored on the fulfillment or order date (order_returns,
      order_cancellation, order_price_adjustment, order_mail_in_rebates, order_returnless_refunds), state
      gates on the purchase and on its return authorization (order_returns), per-line deduplication and
      stacking of adjustments, rebates and refunds (order_returns, order_price_adjustment), fee waivers that
      depend on order size and membership tier (order_fees), and a membership-wide review of changed-mind
      returns (order_agg_return_review). In the natural flow of a purchase, merchandise is sold, fulfilled,
      and only then adjusted, rebated or refunded, and merchandise that must come back is received before its
      refund. Member services cancels qualifying orders, opens return authorizations, posts refunds,
      returnless refunds, price adjustments, rebate credits and fee entries, while confirming a return
      authorization for pickup or label is the member's own step taken through their confirmation tool.
      Matching a competitor's price, crediting a same-day partner order, granting a changed-mind return once
      the membership has reached the return review threshold, or opening a carrier investigation are outside
      every policy member services holds and call for a POLICY_NOT_COVERED transfer.

  - name: delivery_and_installation_appointments
    claim:
      categories: [delivery]
      event_types: [delivery_scheduled, delivery_rescheduled, delivery_rebooked, delivery_cancelled, delivery_service_charged, delivery_charge_credited]
    summary: >
      Members who bought big and bulky merchandise in a club or as a special order call to book, move,
      rebook or cancel a delivery appointment, to question its fees, or to report what went wrong — a crew
      that arrived after the window, a failed attempt, a dented refrigerator, a wall mount that was declined,
      or a haul-away that never happened — and the setting varies with the service level booked, the
      appointment's status, how many times it has been moved or attempted, the crew's logged arrival time and
      failure reason, whether a Plus membership was presented on the purchase, and whether the purchase
      already has another open appointment. The records are the appointment with its booked date, window,
      distance, reschedule and attempt counts, crew arrival time and failure reason, its fee and credit
      entries, its post-delivery claims, and the underlying purchase and membership; the rules are shaped as
      state gates on the appointment and the purchase (delivery_reschedule, delivery_agg_one_open_per_purchase,
      delivery_missed_window_credit), notice and lead-time conditions measured against the booked date
      (delivery_reschedule, delivery_cancellation, delivery_booking_and_fees), windows anchored on the failed
      attempt or the completion date (delivery_failed_attempts, delivery_post_delivery_claims), per-level fee
      and credit parameters with a Plus discount (delivery_booking_and_fees, delivery_missed_window_credit)
      and the crew's installation scope (delivery_crew_scope). In the natural course an appointment is
      booked and charged, dispatched, then completed or failed, and credits and claims only follow what the
      crew logged. Member services books, moves, rebooks and cancels appointments and posts fees and credits,
      while a post-delivery claim is recorded for the member to confirm themselves before the claims desk
      decides it. Settling damage to a member's home, overriding a claims-desk decision, mounting on masonry
      or installing gas appliances, or crediting a delivery that a third party performed are covered by no
      policy available to member services and are transferred as POLICY_NOT_COVERED.

  - name: tire_center_services
    claim:
      categories: [tire]
      event_types: [tire_install_booked, tire_appointment_rescheduled, tire_install_cancelled, tire_set_retired, tire_service_charged, tire_service_credited, tire_road_hazard_replaced, tire_treadwear_adjusted]
    summary: >
      Members with tires bought at Northgate call to book or move an installation, to cancel one, to report
      a vehicle sold, or to settle what a Tire Center visit should have cost — a non-repairable puncture
      under road hazard protection, tires worn out before their treadwear mileage, a rotation or TPMS kit
      they believe their package includes, or a replacement priced against the wrong credit — and the
      setting turns on the installation package held, the package's status, the installation date and
      odometer, the tread measured and damage found on each visit, the rotation history, the number of road
      hazard replacements already made, and whether the membership on the tires' purchase is still active.
      The records are the package with its vehicle, tire item, price paid, tire count and treadwear warranty,
      its service, charge and credit entries, the purchase and its membership, and the item price history
      for the current tire price; the rules are shaped as state gates on the package and the membership
      (tire_service_eligibility, tire_appointments), a road hazard term anchored on the installation date and
      a replacement limit (tire_road_hazard_protection), treadwear conditions on miles driven and rotation
      gaps (tire_treadwear_warranty), per-package fee and inclusion parameters (tire_installation_charges,
      tire_lifetime_services), pro-rata credit formulas, and one package per vehicle
      (tire_agg_vehicle_package). In the natural order tires are bought, installed under a package, serviced
      over their life, and replaced or retired, with every credit applied only toward a replacement. Member
      services books, moves and cancels installations, retires packages and records road hazard and
      treadwear determinations with their charges and credits, and corrects package charges. Paying a credit
      out in cash, transferring a package to a vehicle's buyer, covering collision or off-road damage, or
      overriding a manufacturer's treadwear decision fall outside every Northgate policy and are handed off
      as POLICY_NOT_COVERED.

  - name: optical_eyewear_orders
    claim:
      categories: [optical]
      event_types: [optical_remake_opened, optical_lens_design_changed, optical_order_cancelled, optical_order_returned, optical_charge_posted, optical_credit_posted]
    summary: >
      Members call about prescription eyewear they ordered for themselves or a household dependent — a
      progressive lens they cannot adapt to, a prescription their doctor changed, a coating that peeled, a
      frame that snapped, glasses they want to return, a job they want to cancel while it is at the lab, or a
      bill that does not reflect their vision plan or Plus discount — and the setting varies with the lens
      design, the job's status and dispensed date, the remakes already opened and why, the vision plan
      billed, the membership tier presented on the order date, and the charges and credits already posted.
      The records are the eyewear job with its prescription issue date, material, plan, dates and remake
      count, its charge and credit entries with remake numbers and reasons, and the presenting membership;
      the rules are shaped as windows anchored on the dispensed date or the prescription's issue date
      (optical_remake_guarantees, optical_satisfaction_returns, optical_prescription_rules), per-design
      counts and charge percentages (optical_remake_guarantees, optical_cancellation), per-design and
      per-plan price and copay tables (optical_job_pricing, optical_vision_plan_billing), and the stacking
      rule that a job takes either its vision plan or the Plus discount (optical_agg_discount_stacking). In
      the natural course a job is ordered and charged, made in the lab, dispensed, and only then remade or
      returned, and every credit points back to the exact charge it offsets. Member services opens remakes,
      switches a non-adapt remake's design, cancels jobs, accepts satisfaction returns, and posts the
      resulting charges and credits. Checking or overriding a vision plan's eligibility decision, entering a
      prescription read over the phone, fitting lenses into a member's own frame, or expediting a lab are
      decided by no policy available to member services, leaving a POLICY_NOT_COVERED transfer as the correct
      route.
