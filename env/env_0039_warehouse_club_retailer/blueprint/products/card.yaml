# Northgate Wholesale Club — co-branded and store credit card charter.
# Northgate's credit cards are issued by Meridian Trust Bank and linked to a Northgate membership. Northgate
# member services owns the reward side of the program — earning, reversals, the annual reward certificate,
# the membership link and product changes — while credit decisions, statements, payments, interest and fees
# are serviced by the bank. Each card account is a holding whose tier is the card product; it is booked
# through statement-level reward earnings, reversals, certificates and forfeitures.

category: card
display_name: Northgate Credit Cards

binding:
  holding_table: card_holdings
  event_tables: [card_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {rewards_balance: card_rewards}

lifecycle:
  states: [applied, active, restricted, declined, closed]
  transitions:
    - {from: applied, to: active, by: system, means: "Meridian Trust Bank approves the application and assigns a credit line."}
    - {from: applied, to: declined, by: system, means: "Meridian Trust Bank declines the application."}
    - {from: active, to: restricted, by: system, means: "The linked membership stops being active, so the card stops working at Northgate and its certificate is held."}
    - {from: restricted, to: active, by: system, means: "The linked membership becomes active again, or the card is relinked to an active membership."}
    - {from: active, to: closed, by: system, means: "The bank closes the account at the cardholder's request or for its own credit reasons."}
    - {from: restricted, to: closed, by: system, means: "The bank closes a restricted account at the cardholder's request or after restricted_close_days."}

accounts:
  - key: card_rewards
    unit: USD
    meaning: Card rewards earned in the current reward year and not yet converted into a certificate.

parameter_schema:
  card_network: "network the card runs on (string code)"
  issuing_bank: "the bank that issues and services the account (string)"
  annual_fee_usd: "annual card fee while the linked membership is paid (USD)"
  requires_membership_segment: "membership segment the card must be linked to (string code)"
  required_membership_tiers: "membership tiers the card can be linked to (list of official membership tier names)"
  min_fico_score: "lowest credit score the bank's published underwriting approves (score)"
  accepted_where: "where the card can be used (string code)"
  gas_ev_reward_pct: "reward on gas and EV charging (percent)"
  gas_ev_annual_cap_usd: "qualifying gas and EV spend per reward year that earns gas_ev_reward_pct (USD)"
  gas_above_cap_reward_pct: "reward on gas and EV spend beyond the annual cap (percent)"
  restaurant_reward_pct: "reward on restaurant spend (percent)"
  travel_reward_pct: "reward on travel spend (percent)"
  northgate_reward_pct: "reward on Northgate purchases, in clubs and online (percent)"
  other_reward_pct: "reward on all other purchases (percent)"
  northgate_fuel_counts_as: "earning category of Northgate Fuel Center purchases (spend_category value)"
  reward_year_basis: "which statements make up a reward year (string code)"
  reward_cap_basis: "what the gas cap counts (string code)"
  earned_rewards_rounding: "how earned rewards are rounded (string code)"
  certificate_issue_month: "calendar month after the reward year in which the certificate is issued (month number)"
  certificate_expiry_month: "calendar month of the issue year at whose end the certificate expires (month number)"
  certificate_min_issue_usd: "smallest reward-year balance issued as a certificate; less is carried into the next year (USD)"
  certificate_redemption_requires_active_membership: "whether a certificate is redeemable only while the linked membership is active (boolean)"
  certificate_cash_redemption_allowed: "whether a certificate may be taken in cash at a club register (boolean)"
  certificate_single_use: "whether a certificate must be redeemed in one transaction (boolean)"
  certificate_reissues_allowed: "times a lost certificate may be reissued (count)"
  certificate_held_while_restricted: "whether a certificate due while the card is restricted is held until the card is active again (boolean)"
  rewards_forfeited_on_closure: "whether rewards not yet issued are forfeited when the account closes (boolean)"
  restricted_close_days: "calendar days a card may stay restricted before the bank closes it (days)"
  authorized_users_max: "authorized users or employee cards on the account (count)"
  authorized_user_rewards_count: "whether authorized users' purchases earn rewards to the account (boolean)"
  rewards_reversal_on_returns: "whether returns and purchase credits reverse rewards (boolean)"
  reversal_rate_basis: "the rate a reversal is computed at (string code)"
  product_change_target: "the card product the account moves to when the linked membership changes tier, or none (string)"
  product_change_keeps_account_number: "whether a product change keeps the card number and history (boolean)"
  product_change_rate_effective: "from when the new product's rates apply (string code)"
  business_ein_required: "whether the application requires the business's EIN (boolean)"
  personal_guarantee_required: "whether the applicant personally guarantees the account (boolean)"
  instant_credit_at_approval: "whether an approved applicant can use the credit line the same day in a club (boolean)"
  linked_membership_required_status: "membership statuses in which the card works at Northgate (list of membership status values)"
  membership_fee_earns: "whether membership fees charged to the card earn rewards (boolean)"
  shop_card_purchases_earn: "whether Northgate Shop Card purchases earn rewards (boolean)"
  cash_advance_earns: "whether cash advances earn rewards (boolean)"
  balance_transfer_earns: "whether balance transfers earn rewards (boolean)"
  purchase_apr_pct: "standard variable purchase APR disclosed at account opening (percent)"
  foreign_transaction_fee_pct: "fee on purchases made in a foreign currency (percent)"
  promotional_financing_months: "deferred-interest months on qualifying Northgate purchases; 0 = none (months)"
  promotional_financing_min_purchase_usd: "smallest single Northgate purchase that qualifies for promotional financing (USD)"
  credit_limit_min_usd: "smallest credit line the bank assigns on approval (USD)"

