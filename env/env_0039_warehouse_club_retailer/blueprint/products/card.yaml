events:
  - type: card_applied
    target: card_holdings
    mutation: create
    meaning: A member applies for a Northgate card at a club, online or through member services' referral to the bank.
    grain: one row per application
    fields:
      customer_id: the applicant
      variant_name: the card product applied for
      status: always applied on creation
      linked_membership_id: the membership the card is to be linked to
      opened_date: the application date
      card_last4: empty until approved
      credit_limit: 0.00 until approved
      rewards_balance: always 0.00 on creation
    triggers: []

  - type: card_approved
    target: card_holdings
    mutation: {transition: {from: applied, to: active}}
    meaning: The bank approves the application.
    grain: one row per approval
    fields:
      status: becomes active
      card_last4: the last four digits of the new card
      credit_limit: the credit line assigned
    triggers: []

  - type: card_declined
    target: card_holdings
    mutation: {transition: {from: applied, to: declined}}
    meaning: The bank declines the application.
    grain: one row per decline
    fields:
      status: becomes declined
      closed_date: the decision date
    triggers: []

  - type: card_restricted
    target: card_holdings
    mutation: {transition: {from: active, to: restricted}}
    meaning: The linked membership is no longer active, so the card stops working at Northgate.
    grain: one row per restriction
    fields:
      status: becomes restricted
    triggers: []

  - type: card_unrestricted
    target: card_holdings
    mutation: {transition: {from: restricted, to: active}}
    meaning: The linked membership is active again, or the card is relinked to an active membership.
    grain: one row per lifting of a restriction
    fields:
      status: becomes active
    triggers: []

  - type: card_closed
    target: card_holdings
    mutation: {transition: [{from: active, to: closed}, {from: restricted, to: closed}]}
    meaning: The bank closes the account.
    grain: one row per closure
    fields:
      status: becomes closed
      closed_date: the closure date
    triggers: []

  - type: card_product_changed
    target: card_holdings
    mutation: update
    meaning: The account moves to another card product because the linked membership changed tier.
    grain: one row per product change
    fields:
      variant_name: the new card product
    triggers: []

  - type: card_membership_relinked
    target: card_holdings
    mutation: update
    meaning: The card is linked to another membership of the cardholder in the same segment.
    grain: one row per relink
    fields:
      linked_membership_id: the newly linked membership
    triggers: []

  - type: card_rewards_earned
    target: card_transactions
    meaning: Rewards are earned on one statement's net qualifying purchases in one earning category.
    grain: one row per statement period per earning category
    distinguish_by: [statement_period, spend_category]
    fields:
      transaction_date: the statement closing date
      statement_period: the statement month
      spend_category: the earning category
      qualifying_spend: net qualifying purchases in the category on the statement
      amount: the reward earned
      reward_year: the reward year of the statement
    account: card_rewards
    direction: in
    triggers: []

  - type: card_rewards_reversed
    target: card_transactions
    meaning: Rewards are taken back because returns and purchase credits in a statement exceeded that category's purchases.
    grain: one row per statement period per earning category with net credits
    distinguish_by: [statement_period, spend_category]
    fields:
      transaction_date: the statement closing date
      statement_period: the statement month
      spend_category: the earning category
      qualifying_spend: net credits in the category on the statement
      amount: the reward reversed
      reward_year: the reward year of the statement
    account: card_rewards
    direction: out
    triggers: []

  - type: card_reward_certificate_issued
    target: card_transactions
    meaning: The reward year's balance is issued as an annual reward certificate redeemable at Northgate.
    grain: one row per reward year issued
    distinguish_by: [reward_year]
    fields:
      transaction_date: the issue date
      statement_period: the reward year's last statement month
      spend_category: always all_categories
      qualifying_spend: always 0.00
      amount: the certificate value
      reward_year: the reward year converted
    account: card_rewards
    direction: out
    triggers: []

  - type: card_reward_certificate_reissued
    target: card_transactions
    meaning: A lost or undelivered annual reward certificate is voided and reissued for the same value and expiry.
    grain: one row per reissue
    distinguish_by: [source_txn_id, transaction_date]
    fields:
      transaction_date: the reissue date
      amount: the value carried over
      reward_year: the reward year of the original certificate
      source_txn_id: the original certificate
    triggers: []

  - type: card_rewards_forfeited
    target: card_transactions
    meaning: Rewards not yet issued are forfeited when the account closes.
    grain: one row per closure with a balance
    distinguish_by: [reward_year, transaction_date]
    fields:
      transaction_date: the closure date
      statement_period: the month of closure
      spend_category: always all_categories
      qualifying_spend: always 0.00
      amount: the balance forfeited
      reward_year: the reward year in which the account closed
    account: card_rewards
    direction: out
    triggers: []

measures:
  - id: card_msr_gas_spend_ytd
    window: the statements of the current reward year before the statement being computed
    measure: sum of qualifying_spend over card_rewards_earned entries with spend_category gas_ev_charging minus qualifying_spend over card_rewards_reversed entries with spend_category gas_ev_charging
  - id: card_msr_reissues_of_certificate
    window: the life of one certificate
    measure: count of card_reward_certificate_reissued entries whose source_txn_id is that certificate

policies:
  - id: card_agg_multi_holding
    subject: [card_applied]
    rule: >
      A person may hold at most one Northgate card linked to a consumer membership and at most one linked to a
      business membership. An application is not taken for a membership that already has a card whose status
      is applied, active or restricted. Rewards of a consumer card and a business card are never combined.
    eligibility:
      - id: one_card_per_membership
        applies_to: [card_applied]
        kind: dedup
        condition: An application is not taken for a membership that already has a card whose status is applied, active or restricted.
        evidence_fields: [card_holdings.linked_membership_id, card_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.linked_membership_id]
          action_bindings:
            card_holdings.linked_membership_id: linked_membership_id
        dedup_contract:
          table: card_holdings
          mode: separate_record
          object_bindings: {linked_membership_id: linked_membership_id}
          duplicate_filters: {status: [applied, active, restricted]}
          distinct_fields: [opened_date]
    params:
      max_per_customer: 2

  - id: card_agg_reward_pooling
    subject: [card_rewards_earned, card_reward_certificate_issued]
    rule: >
      All purchases on one account, including those of authorized users where authorized_user_rewards_count is
      true, earn to that account and are issued on one certificate per reward year. The gas cap is counted per
      account across the reward year, never across a cardholder's two accounts. Card rewards are a separate
      program from the membership's Annual Reward: the two are earned, issued and redeemed independently, and
      a purchase on the card at a club can earn both.
    eligibility: []
    params:
      per_tier:
        Northgate Store Card: {users: "=authorized_users_max", users_earn: "=authorized_user_rewards_count", cap_basis: "=reward_cap_basis"}
        Northgate Business Store Card: {users: "=authorized_users_max", users_earn: "=authorized_user_rewards_count", cap_basis: "=reward_cap_basis"}
        Northgate Rewards Visa Signature: {users: "=authorized_users_max", users_earn: "=authorized_user_rewards_count", cap_basis: "=reward_cap_basis"}
        Northgate Rewards Visa Business: {users: "=authorized_users_max", users_earn: "=authorized_user_rewards_count", cap_basis: "=reward_cap_basis"}
        Northgate Rewards Visa Signature Plus: {users: "=authorized_users_max", users_earn: "=authorized_user_rewards_count", cap_basis: "=reward_cap_basis"}
        Northgate Rewards Visa Business Plus: {users: "=authorized_users_max", users_earn: "=authorized_user_rewards_count", cap_basis: "=reward_cap_basis"}

  - id: card_application_eligibility
    subject: [card_applied, card_approved, card_declined]
    rule: >
      A card is applied for only while the membership it will be linked to has status active, and only for a
      product whose required_membership_tiers include that membership's tier and whose
      requires_membership_segment matches its segment. Business products also require the business's EIN
      where business_ein_required and a personal guarantee where personal_guarantee_required. The credit
      decision, the credit line (never below credit_limit_min_usd), the APR and every other credit term are
      the bank's; Northgate member services can neither approve, reconsider nor change them, and an applicant
      who disputes a decision is referred to the bank. Where instant_credit_at_approval is true the approved
      applicant may use the line in a club the same day.
    eligibility:
      - id: membership_active_to_apply
        applies_to: [card_applied]
        kind: state
        condition: A card is applied for only while the membership it will be linked to has status active
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: linked_membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [active]
    params:
      per_tier:
        Northgate Store Card: {tiers: "=required_membership_tiers", segment: "=requires_membership_segment", ein: "=business_ein_required", guarantee: "=personal_guarantee_required", min_line: "=credit_limit_min_usd", instant: "=instant_credit_at_approval", fico: "=min_fico_score", bank: "=issuing_bank"}
        Northgate Business Store Card: {tiers: "=required_membership_tiers", segment: "=requires_membership_segment", ein: "=business_ein_required", guarantee: "=personal_guarantee_required", min_line: "=credit_limit_min_usd", instant: "=instant_credit_at_approval", fico: "=min_fico_score", bank: "=issuing_bank"}
        Northgate Rewards Visa Signature: {tiers: "=required_membership_tiers", segment: "=requires_membership_segment", ein: "=business_ein_required", guarantee: "=personal_guarantee_required", min_line: "=credit_limit_min_usd", instant: "=instant_credit_at_approval", fico: "=min_fico_score", bank: "=issuing_bank"}
        Northgate Rewards Visa Business: {tiers: "=required_membership_tiers", segment: "=requires_membership_segment", ein: "=business_ein_required", guarantee: "=personal_guarantee_required", min_line: "=credit_limit_min_usd", instant: "=instant_credit_at_approval", fico: "=min_fico_score", bank: "=issuing_bank"}
        Northgate Rewards Visa Signature Plus: {tiers: "=required_membership_tiers", segment: "=requires_membership_segment", ein: "=business_ein_required", guarantee: "=personal_guarantee_required", min_line: "=credit_limit_min_usd", instant: "=instant_credit_at_approval", fico: "=min_fico_score", bank: "=issuing_bank"}
        Northgate Rewards Visa Business Plus: {tiers: "=required_membership_tiers", segment: "=requires_membership_segment", ein: "=business_ein_required", guarantee: "=personal_guarantee_required", min_line: "=credit_limit_min_usd", instant: "=instant_credit_at_approval", fico: "=min_fico_score", bank: "=issuing_bank"}

  - id: card_rewards_earning
    subject: [card_rewards_earned]
    rule: >
      Rewards are computed at each statement close on the statement's net qualifying purchases per earning
      category: gas_ev_reward_pct on gas and EV charging until card_msr_gas_spend_ytd reaches
      gas_ev_annual_cap_usd and gas_above_cap_reward_pct beyond it, restaurant_reward_pct on restaurants,
      travel_reward_pct on travel, northgate_reward_pct on Northgate purchases and other_reward_pct on all else;
      Northgate Fuel Center purchases earn in the category northgate_fuel_counts_as. A card usable only at
      Northgate earns only on Northgate purchases. Membership fees earn only where membership_fee_earns is
      true, Shop Card purchases where shop_card_purchases_earn, and cash advances and balance transfers never
      while cash_advance_earns and balance_transfer_earns are false. Each category's reward is rounded per
      earned_rewards_rounding, and the reward year runs per reward_year_basis.
    eligibility: []
    measures: [card_msr_gas_spend_ytd]
    params:
      per_tier:
        Northgate Store Card: {gas: "=gas_ev_reward_pct", gas_cap: "=gas_ev_annual_cap_usd", gas_after_cap: "=gas_above_cap_reward_pct", restaurants: "=restaurant_reward_pct", travel: "=travel_reward_pct", northgate: "=northgate_reward_pct", other: "=other_reward_pct", fuel_as: "=northgate_fuel_counts_as", accepted: "=accepted_where", fee_earns: "=membership_fee_earns", shop_card_earns: "=shop_card_purchases_earn", advance_earns: "=cash_advance_earns", transfer_earns: "=balance_transfer_earns", rounding: "=earned_rewards_rounding", year_basis: "=reward_year_basis"}
        Northgate Business Store Card: {gas: "=gas_ev_reward_pct", gas_cap: "=gas_ev_annual_cap_usd", gas_after_cap: "=gas_above_cap_reward_pct", restaurants: "=restaurant_reward_pct", travel: "=travel_reward_pct", northgate: "=northgate_reward_pct", other: "=other_reward_pct", fuel_as: "=northgate_fuel_counts_as", accepted: "=accepted_where", fee_earns: "=membership_fee_earns", shop_card_earns: "=shop_card_purchases_earn", advance_earns: "=cash_advance_earns", transfer_earns: "=balance_transfer_earns", rounding: "=earned_rewards_rounding", year_basis: "=reward_year_basis"}
        Northgate Rewards Visa Signature: {gas: "=gas_ev_reward_pct", gas_cap: "=gas_ev_annual_cap_usd", gas_after_cap: "=gas_above_cap_reward_pct", restaurants: "=restaurant_reward_pct", travel: "=travel_reward_pct", northgate: "=northgate_reward_pct", other: "=other_reward_pct", fuel_as: "=northgate_fuel_counts_as", accepted: "=accepted_where", fee_earns: "=membership_fee_earns", shop_card_earns: "=shop_card_purchases_earn", advance_earns: "=cash_advance_earns", transfer_earns: "=balance_transfer_earns", rounding: "=earned_rewards_rounding", year_basis: "=reward_year_basis"}
        Northgate Rewards Visa Business: {gas: "=gas_ev_reward_pct", gas_cap: "=gas_ev_annual_cap_usd", gas_after_cap: "=gas_above_cap_reward_pct", restaurants: "=restaurant_reward_pct", travel: "=travel_reward_pct", northgate: "=northgate_reward_pct", other: "=other_reward_pct", fuel_as: "=northgate_fuel_counts_as", accepted: "=accepted_where", fee_earns: "=membership_fee_earns", shop_card_earns: "=shop_card_purchases_earn", advance_earns: "=cash_advance_earns", transfer_earns: "=balance_transfer_earns", rounding: "=earned_rewards_rounding", year_basis: "=reward_year_basis"}
        Northgate Rewards Visa Signature Plus: {gas: "=gas_ev_reward_pct", gas_cap: "=gas_ev_annual_cap_usd", gas_after_cap: "=gas_above_cap_reward_pct", restaurants: "=restaurant_reward_pct", travel: "=travel_reward_pct", northgate: "=northgate_reward_pct", other: "=other_reward_pct", fuel_as: "=northgate_fuel_counts_as", accepted: "=accepted_where", fee_earns: "=membership_fee_earns", shop_card_earns: "=shop_card_purchases_earn", advance_earns: "=cash_advance_earns", transfer_earns: "=balance_transfer_earns", rounding: "=earned_rewards_rounding", year_basis: "=reward_year_basis"}
        Northgate Rewards Visa Business Plus: {gas: "=gas_ev_reward_pct", gas_cap: "=gas_ev_annual_cap_usd", gas_after_cap: "=gas_above_cap_reward_pct", restaurants: "=restaurant_reward_pct", travel: "=travel_reward_pct", northgate: "=northgate_reward_pct", other: "=other_reward_pct", fuel_as: "=northgate_fuel_counts_as", accepted: "=accepted_where", fee_earns: "=membership_fee_earns", shop_card_earns: "=shop_card_purchases_earn", advance_earns: "=cash_advance_earns", transfer_earns: "=balance_transfer_earns", rounding: "=earned_rewards_rounding", year_basis: "=reward_year_basis"}
    formula:
      category_rate: gas_ev_reward_pct if spend_category == "gas_ev_charging" else (restaurant_reward_pct if spend_category == "restaurants" else (travel_reward_pct if spend_category == "travel" else (northgate_reward_pct if spend_category == "northgate_purchases" else other_reward_pct)))
      gas_room: max(0, gas_ev_annual_cap_usd - card_msr_gas_spend_ytd)
      earned_amount: round(min(qualifying_spend, gas_room) * gas_ev_reward_pct / 100 + max(0, qualifying_spend - gas_room) * gas_above_cap_reward_pct / 100, 2) if spend_category == "gas_ev_charging" else round(qualifying_spend * category_rate / 100, 2)

  - id: card_rewards_reversal
    subject: [card_rewards_reversed]
    rule: >
      Where rewards_reversal_on_returns is true, returns and purchase credits reduce the rewards of the
      statement they post on, in the same earning category, at the rate per reversal_rate_basis. When a
      category's credits on a statement exceed its purchases the net credit is booked as a reversal; the
      reversal never takes rewards_balance below zero, and a reversal after the reward year's certificate was
      issued is booked in the current reward year.
    eligibility: []
    params:
      per_tier:
        Northgate Store Card: {reverses: "=rewards_reversal_on_returns", basis: "=reversal_rate_basis"}
        Northgate Business Store Card: {reverses: "=rewards_reversal_on_returns", basis: "=reversal_rate_basis"}
        Northgate Rewards Visa Signature: {reverses: "=rewards_reversal_on_returns", basis: "=reversal_rate_basis"}
        Northgate Rewards Visa Business: {reverses: "=rewards_reversal_on_returns", basis: "=reversal_rate_basis"}
        Northgate Rewards Visa Signature Plus: {reverses: "=rewards_reversal_on_returns", basis: "=reversal_rate_basis"}
        Northgate Rewards Visa Business Plus: {reverses: "=rewards_reversal_on_returns", basis: "=reversal_rate_basis"}

  - id: card_reward_certificates
    subject: [card_reward_certificate_issued, card_reward_certificate_reissued]
    rule: >
      The rewards_balance of a reward year is issued as a certificate with the statement closing in
      certificate_issue_month of the following year when it is at least certificate_min_issue_usd; a smaller
      balance carries forward. A certificate is issued only on an account whose status is active; where
      certificate_held_while_restricted is true a certificate due while the card is restricted is issued when
      the card becomes active again. The certificate expires at the end of certificate_expiry_month of its
      issue year, is redeemable at a club register — in merchandise, or in cash where
      certificate_cash_redemption_allowed — only while the linked membership is active, and must be used in
      one transaction where certificate_single_use. A lost certificate is reissued at most
      certificate_reissues_allowed times, before it expires, for the same value and expiry. An expired
      certificate is never reissued, extended or paid.
    eligibility:
      - id: issue_on_active_card
        applies_to: [card_reward_certificate_issued]
        kind: state
        condition: A certificate is issued only on an account whose status is active
        evidence_fields: [card_holdings.status, card_holdings.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.card_account_id]
          action_bindings:
            card_holdings.card_account_id: card_account_id
        state_contract:
          field: card_holdings.status
          allowed: [active]
      - id: certificate_reissue_limit
        applies_to: [card_reward_certificate_reissued]
        kind: dedup
        condition: A lost certificate is reissued at most certificate_reissues_allowed times, before it expires, for the same value and expiry.
        evidence_fields: [card_transactions.source_txn_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.source_txn_id]
          action_bindings:
            card_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [card_reward_certificate_reissued]}
          distinct_fields: [transaction_date]
    measures: [card_msr_reissues_of_certificate]
    params:
      per_tier:
        Northgate Store Card: {issue_month: "=certificate_issue_month", expiry_month: "=certificate_expiry_month", min_issue: "=certificate_min_issue_usd", needs_membership: "=certificate_redemption_requires_active_membership", cash: "=certificate_cash_redemption_allowed", single_use: "=certificate_single_use", reissues: "=certificate_reissues_allowed", held: "=certificate_held_while_restricted"}
        Northgate Business Store Card: {issue_month: "=certificate_issue_month", expiry_month: "=certificate_expiry_month", min_issue: "=certificate_min_issue_usd", needs_membership: "=certificate_redemption_requires_active_membership", cash: "=certificate_cash_redemption_allowed", single_use: "=certificate_single_use", reissues: "=certificate_reissues_allowed", held: "=certificate_held_while_restricted"}
        Northgate Rewards Visa Signature: {issue_month: "=certificate_issue_month", expiry_month: "=certificate_expiry_month", min_issue: "=certificate_min_issue_usd", needs_membership: "=certificate_redemption_requires_active_membership", cash: "=certificate_cash_redemption_allowed", single_use: "=certificate_single_use", reissues: "=certificate_reissues_allowed", held: "=certificate_held_while_restricted"}
        Northgate Rewards Visa Business: {issue_month: "=certificate_issue_month", expiry_month: "=certificate_expiry_month", min_issue: "=certificate_min_issue_usd", needs_membership: "=certificate_redemption_requires_active_membership", cash: "=certificate_cash_redemption_allowed", single_use: "=certificate_single_use", reissues: "=certificate_reissues_allowed", held: "=certificate_held_while_restricted"}
        Northgate Rewards Visa Signature Plus: {issue_month: "=certificate_issue_month", expiry_month: "=certificate_expiry_month", min_issue: "=certificate_min_issue_usd", needs_membership: "=certificate_redemption_requires_active_membership", cash: "=certificate_cash_redemption_allowed", single_use: "=certificate_single_use", reissues: "=certificate_reissues_allowed", held: "=certificate_held_while_restricted"}
        Northgate Rewards Visa Business Plus: {issue_month: "=certificate_issue_month", expiry_month: "=certificate_expiry_month", min_issue: "=certificate_min_issue_usd", needs_membership: "=certificate_redemption_requires_active_membership", cash: "=certificate_cash_redemption_allowed", single_use: "=certificate_single_use", reissues: "=certificate_reissues_allowed", held: "=certificate_held_while_restricted"}
    formula:
      certificate_amount: rewards_balance if rewards_balance >= certificate_min_issue_usd else 0

  - id: card_membership_link
    subject: [card_restricted, card_unrestricted, card_membership_relinked]
    rule: >
      A card works at Northgate only while its linked membership's status is in
      linked_membership_required_status. When the linked membership expires, is suspended, cancelled or
      closed the card is restricted: it keeps working elsewhere on its network but not at Northgate, and its
      certificate is held. The restriction is lifted when the linked membership is active again. A card is
      relinked only to another membership of the cardholder whose status is active and whose segment matches
      requires_membership_segment. A card left restricted for restricted_close_days calendar days is closed by
      the bank.
    eligibility:
      - id: relink_to_active_membership
        applies_to: [card_membership_relinked]
        kind: state
        condition: A card is relinked only to another membership of the cardholder whose status is active and whose segment matches requires_membership_segment.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id, membership_holdings.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: linked_membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [active]
    params:
      per_tier:
        Northgate Store Card: {working_statuses: "=linked_membership_required_status", close_after_days: "=restricted_close_days", segment: "=requires_membership_segment"}
        Northgate Business Store Card: {working_statuses: "=linked_membership_required_status", close_after_days: "=restricted_close_days", segment: "=requires_membership_segment"}
        Northgate Rewards Visa Signature: {working_statuses: "=linked_membership_required_status", close_after_days: "=restricted_close_days", segment: "=requires_membership_segment"}
        Northgate Rewards Visa Business: {working_statuses: "=linked_membership_required_status", close_after_days: "=restricted_close_days", segment: "=requires_membership_segment"}
        Northgate Rewards Visa Signature Plus: {working_statuses: "=linked_membership_required_status", close_after_days: "=restricted_close_days", segment: "=requires_membership_segment"}
        Northgate Rewards Visa Business Plus: {working_statuses: "=linked_membership_required_status", close_after_days: "=restricted_close_days", segment: "=requires_membership_segment"}

  - id: card_product_changes
    subject: [card_product_changed]
    rule: >
      When the linked membership moves to a tier outside the card's required_membership_tiers — an upgrade
      to a Plus tier, or a downgrade from one — the account moves to its product_change_target. A product change
      is made only on an account whose status is active. The card number and history are kept where
      product_change_keeps_account_number is true, rewards already earned stay on the account, and the new
      product's rates apply per product_change_rate_effective. A store card has no product change; a member
      who wants a Visa product applies for it.
    eligibility:
      - id: change_on_active_account
        applies_to: [card_product_changed]
        kind: state
        condition: A product change is made only on an account whose status is active.
        evidence_fields: [card_holdings.status, card_holdings.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.card_account_id]
          action_bindings:
            card_holdings.card_account_id: card_account_id
        state_contract:
          field: card_holdings.status
          allowed: [active]
    params:
      per_tier:
        Northgate Store Card: {target: "=product_change_target", keeps_number: "=product_change_keeps_account_number", effective: "=product_change_rate_effective"}
        Northgate Business Store Card: {target: "=product_change_target", keeps_number: "=product_change_keeps_account_number", effective: "=product_change_rate_effective"}
        Northgate Rewards Visa Signature: {target: "=product_change_target", keeps_number: "=product_change_keeps_account_number", effective: "=product_change_rate_effective"}
        Northgate Rewards Visa Business: {target: "=product_change_target", keeps_number: "=product_change_keeps_account_number", effective: "=product_change_rate_effective"}
        Northgate Rewards Visa Signature Plus: {target: "=product_change_target", keeps_number: "=product_change_keeps_account_number", effective: "=product_change_rate_effective"}
        Northgate Rewards Visa Business Plus: {target: "=product_change_target", keeps_number: "=product_change_keeps_account_number", effective: "=product_change_rate_effective"}

  - id: card_closure_forfeiture
    subject: [card_closed, card_rewards_forfeited]
    rule: >
      Accounts are closed only by the bank, at the cardholder's request or on its own credit grounds; member
      services takes no closure request itself and refers the cardholder to the bank. Where
      rewards_forfeited_on_closure is true, a rewards_balance not yet issued is forfeited on the closure date.
      A forfeiture is booked only on an account whose status is closed. A certificate already issued before
      the closure stays redeemable until it expires.
    eligibility:
      - id: forfeit_on_closed
        applies_to: [card_rewards_forfeited]
        kind: state
        condition: A forfeiture is booked only on an account whose status is closed.
        evidence_fields: [card_holdings.status, card_holdings.card_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.card_account_id]
          action_bindings:
            card_holdings.card_account_id: card_account_id
        state_contract:
          field: card_holdings.status
          allowed: [closed]
    params:
      per_tier:
        Northgate Store Card: {forfeit: "=rewards_forfeited_on_closure"}
        Northgate Business Store Card: {forfeit: "=rewards_forfeited_on_closure"}
        Northgate Rewards Visa Signature: {forfeit: "=rewards_forfeited_on_closure"}
        Northgate Rewards Visa Business: {forfeit: "=rewards_forfeited_on_closure"}
        Northgate Rewards Visa Signature Plus: {forfeit: "=rewards_forfeited_on_closure"}
        Northgate Rewards Visa Business Plus: {forfeit: "=rewards_forfeited_on_closure"}

  - id: card_bank_terms
    subject: [card_approved]
    rule: >
      The account terms disclosed at opening are the bank's: annual_fee_usd while the linked membership is
      paid, purchase_apr_pct, foreign_transaction_fee_pct and, on cards that offer it, promotional deferred
      interest for promotional_financing_months on a single Northgate purchase of at least
      promotional_financing_min_purchase_usd. Statements, payments, interest, late fees, credit line changes,
      fraud and purchase disputes are serviced by the bank; member services explains the terms but changes
      none of them and records nothing on the account for them.
    eligibility: []
    params:
      per_tier:
        Northgate Store Card: {annual_fee: "=annual_fee_usd", apr: "=purchase_apr_pct", fx_fee: "=foreign_transaction_fee_pct", promo_months: "=promotional_financing_months", promo_min: "=promotional_financing_min_purchase_usd", network: "=card_network"}
        Northgate Business Store Card: {annual_fee: "=annual_fee_usd", apr: "=purchase_apr_pct", fx_fee: "=foreign_transaction_fee_pct", promo_months: "=promotional_financing_months", promo_min: "=promotional_financing_min_purchase_usd", network: "=card_network"}
