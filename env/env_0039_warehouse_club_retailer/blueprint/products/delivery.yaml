  - id: delivery_crew_scope
    subject: [delivery_dispatched, delivery_completed]
    rule: >
      On the delivery date the crew of crew_size takes the merchandise to the placement_location. Where
      customer_presence_required is true an adult must be at the address throughout the window, and a crew
      finding nobody logs customer_not_home. The crew unpacks only where unpacking_included, assembles only
      where assembly_included, and removes packaging only where debris_removal_included. Installation is
      limited to appliance_installation_types where installation_labor_included is true — gas appliances,
      built-in or cabinet-modified installations, new water, gas or electrical lines and permits are never
      performed — and the appliance being replaced is disconnected only where
      old_appliance_disconnect_included. A television is wall-mounted only up to wall_mount_max_screen_inches
      and only on wall_mount_surfaces_supported; masonry, plaster and metal-stud walls and above-fireplace
      mounts are declined at the door without a fee. A completed appointment fulfills its purchase on the
      completion date when the purchase is still placed.
    eligibility: []
    params:
      per_tier:
        Northgate Curbside Delivery: {placement: "=placement_location", crew: "=crew_size", unpack: "=unpacking_included", assemble: "=assembly_included", debris: "=debris_removal_included", presence: "=customer_presence_required", installs: "=appliance_installation_types", install_labor: "=installation_labor_included", disconnect: "=old_appliance_disconnect_included", max_screen: "=wall_mount_max_screen_inches", surfaces: "=wall_mount_surfaces_supported"}
