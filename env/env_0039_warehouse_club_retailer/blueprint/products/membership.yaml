# Northgate Wholesale Club — membership charter.
# A membership is the annual contract that admits a member (and the cardholders on it) to the clubs,
# Northgate.com, the Tire Center, Optical and delivery services. It is booked through membership fees
# (new, renewal, upgrade, add-on), fee refunds, and — on Plus tiers — the Annual Reward stream that
# purchases and refunds elsewhere in the club feed into it.

category: membership
display_name: Northgate Memberships

binding:
  holding_table: membership_holdings
  event_tables: [membership_transactions, membership_cards]
  intake_tables: [membership_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {annual_reward_balance: annual_reward}

lifecycle:
  states: [active, expired, suspended, cancelled, closed]
  transitions:
    - {from: active, to: expired, by: system, means: "The day after expiry_date passes without a renewal fee being paid, the membership stops admitting its cardholders."}
    - {from: expired, to: active, by: agent, means: "A lapsed membership is renewed by paying the renewal fee; the new membership year is dated by the late-renewal rule."}
    - {from: active, to: suspended, by: system, means: "The membership office suspends privileges after a membership fee payment is charged back by the card issuer."}
    - {from: suspended, to: active, by: system, means: "The membership office lifts the suspension once the charged-back fee has been repaid at a club."}
    - {from: active, to: cancelled, by: user, means: "The primary member confirms a cancellation request; the membership ends and any refundable fee is returned."}
    - {from: expired, to: closed, by: system, means: "A membership that stays expired for lapsed_close_months is closed; the member must enroll again under a new number."}
    - {from: suspended, to: closed, by: system, means: "A suspension not cleared within suspension_close_days ends in closure of the membership."}

accounts:
  - key: fee_paid
    unit: USD
    meaning: Net membership fees paid on the membership (new, renewal, upgrade and add-on fees, less refunds of them).
  - key: annual_reward
    unit: USD
    meaning: Annual Reward accrued in the current membership year and not yet converted to a certificate (Plus tiers only).

parameter_schema:
  membership_segment: "consumer | business — the segment the tier belongs to; a person may hold at most one membership per segment (string)"
  annual_fee_usd: "the fee for one membership year at this tier, charged on enrollment and on every renewal (USD)"
  upgrade_target_tier: "the official tier a mid-term upgrade moves to, or none (string)"
  downgrade_target_tier: "the official tier a downgrade or shortfall-guarantee claim moves to, or none (string)"
  mid_term_upgrade_allowed: "whether the tier can be upgraded during a membership year (boolean)"
  plus_premium_usd: "the part of a Plus tier's annual fee above its base tier's fee; the Annual Reward guarantee threshold; 0.00 on non-Plus tiers (USD)"
  min_primary_age_years: "minimum age of the primary member on the enrollment date (years)"
  requires_student_verification: "whether enrollment and every renewal require third-party verification of current college enrollment (boolean)"
  requires_service_verification: "whether enrollment and every renewal require third-party verification of military, veteran or first-responder status (boolean)"
  requires_business_license: "whether enrollment requires a business license, resale certificate or EIN letter in the business name (boolean)"
  eligible_status_categories: "the verified statuses that qualify for the tier; empty list where no status is required (list of strings)"
  eligibility_reverification_months: "how many calendar months a successful status verification stays valid; 0 = no verification (months)"
  eligibility_lapse_conversion_tier: "the tier the membership renews into when the status verification is not valid on the first day of the new membership year; none where not applicable (string)"
  discounted_term_limit: "maximum number of consecutive membership years at this discounted tier; 0 = no limit (count)"
  free_household_cards: "household cards included free with the membership (count)"
  household_card_min_age_years: "minimum age of a household cardholder (years)"
  household_same_address_required: "whether the household cardholder must live at the primary member's address (boolean)"
  max_addon_cards: "maximum paid business add-on cards that may be active on the membership at once (count)"
  addon_card_fee_usd: "fee for each business add-on card for each membership year (USD)"
  addon_fee_prorated: "whether an add-on card issued mid-year is charged only for the remaining whole months (boolean)"
  replacement_cards_per_membership_year: "replacement cards member services may issue on the membership in one membership year (count)"
  card_issue_photo_id_required: "whether a new cardholder's card is only activated after a photo is taken at a club membership counter (boolean)"
  term_length_months: "length of one membership year (calendar months)"
  late_renewal_anchor_months: "how many calendar months after expiry_date a lapsed membership may be renewed and still keep its original anniversary (months)"
  lapsed_close_months: "calendar months after expiry_date after which an unrenewed membership is closed (months)"
  expired_shopping_allowed: "whether cardholders of an expired membership may purchase merchandise (boolean)"
  auto_renew_allowed: "whether automatic renewal may be switched on for the tier (boolean)"
  auto_renew_tenders: "payment methods accepted for automatic renewal (list of tender codes)"
  auto_renew_charge_day_offset: "days after expiry_date on which the automatic renewal charge is attempted; 0 = on expiry_date (days)"
  auto_renew_reminder_days: "days before expiry_date the automatic renewal reminder email is sent (days)"
  auto_renew_retry_count: "number of retries after a declined automatic renewal charge before the attempt lapses (count)"
  auto_renew_retry_interval_days: "calendar days between automatic renewal retries (days)"
  full_refund_window_days: "calendar days from term_start_date during which a cancellation refunds the current-year fees in full (days)"
  prorated_refund_after_window: "whether a cancellation after the full-refund window refunds the current-year fees for the unused whole months (boolean)"
  refund_deducts_annual_reward: "whether a cancellation refund is reduced by the Annual Reward accrued in the current membership year (boolean)"
  refund_includes_addon_fees: "whether a cancellation refund also covers add-on card fees paid for the current membership year on the same basis (boolean)"
  annual_reward_rate_pct: "Annual Reward earned as a percentage of qualifying purchases; 0 on non-Plus tiers (percent)"
  annual_reward_cap_usd: "maximum Annual Reward that can accrue in one membership year; 0.00 on non-Plus tiers (USD)"
  annual_reward_basis: "what the percentage is applied to (string code)"
  annual_reward_excluded_classes: "merchandise classes that never earn Annual Reward (list of order_lines.merchandise_class values)"
  cardholder_purchases_earn_to_primary: "whether purchases by the household and add-on cardholders earn Annual Reward to the membership (boolean)"
  annual_reward_min_certificate_usd: "minimum year-end balance converted into a certificate; a smaller balance carries into the next membership year (USD)"
  reward_certificate_validity_months: "calendar months after the reward year's end during which the certificate can be redeemed (months)"
  reward_certificate_reissues_allowed: "how many times one lost certificate may be reissued (count)"
  reward_certificate_renewal_tender_allowed: "whether an Annual Reward certificate may be used to pay a renewal fee (boolean)"
  shortfall_guarantee_enabled: "whether the Plus guarantee applies: a member whose year's Annual Reward is below plus_premium_usd may claim the difference (boolean)"
  shortfall_claim_window_days: "calendar days after the end of the membership year during which the guarantee may be claimed (days)"
  early_shopping_minutes: "minutes before regular opening the cardholders may shop (minutes)"
  guest_limit_per_visit: "guests a cardholder may bring per club visit (count)"
  fuel_discount_cents_per_gallon: "discount off the posted Northgate Fuel Center price (cents per gallon)"
  suspension_close_days: "calendar days a suspension may stay uncleared before the membership is closed (days)"

