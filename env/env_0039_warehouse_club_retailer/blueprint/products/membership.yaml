events:
  - type: membership_enrolled
    target: membership_holdings
    mutation: create
    meaning: A new membership is purchased and a membership number is assigned; the first membership year starts on the enrollment date.
    grain: one row per membership opened
    fields:
      customer_id: the primary member
      variant_name: the tier purchased
      status: always active on enrollment
      member_number: the newly assigned membership number
      business_name: the business name for Business tiers, empty for consumer tiers
      opened_date: the enrollment date
      term_start_date: the enrollment date
      expiry_date: the last day of the first membership year
      auto_renew: whether automatic renewal was switched on at sign-up
      auto_renew_tender: the tender on file for automatic renewal, none if off
      eligibility_verified_through: the verification validity date returned by the status-verification partner, empty for tiers without verification
      annual_reward_balance: always 0.00 on enrollment
    triggers:
      - event: membership:membership_fee_charged
        map: {fee_type: new_term, term_start_date: term_start_date}
      - event: membership:membership_card_issued
        map: {card_type: primary, issue_reason: new_membership}

  - type: membership_term_renewed
    target: membership_holdings
    mutation: update
    meaning: An active membership is renewed for the following membership year (on-time renewal, by the member or by automatic renewal), possibly converting tier at the renewal.
    grain: one row per renewal of an active membership
    fields:
      term_start_date: the day after the previous expiry_date
      expiry_date: the last day of the new membership year
      variant_name: the tier the new membership year is held at (unchanged unless the renewal converts or downgrades the tier)
    triggers:
      - event: membership:membership_fee_charged
        map: {fee_type: renewal_term, term_start_date: term_start_date}

  - type: membership_renewed_after_lapse
    target: membership_holdings
    mutation: {transition: {from: expired, to: active}}
    meaning: An expired membership is renewed by paying the renewal fee and becomes active again under the same membership number.
    grain: one row per late renewal
    fields:
      status: becomes active
      term_start_date: the first day of the new membership year, dated by the late-renewal rule
      expiry_date: the last day of the new membership year
      variant_name: the tier the new membership year is held at
    triggers:
      - event: membership:membership_fee_charged
        map: {fee_type: renewal_term, term_start_date: term_start_date}

  - type: membership_upgraded
    target: membership_holdings
    mutation: update
    meaning: A base-tier membership is upgraded mid-year to its Plus counterpart; the expiry date does not move.
    grain: one row per upgrade
    fields:
      variant_name: the Plus tier upgraded to
    triggers:
      - event: membership:membership_fee_charged
        map: {fee_type: upgrade_difference}

  - type: membership_downgraded
    target: membership_holdings
    mutation: update
    meaning: A Plus membership is moved to its base tier when a guarantee claim is confirmed.
    grain: one row per downgrade
    fields:
      variant_name: the base tier downgraded to
    triggers: []

  - type: membership_auto_renew_changed
    target: membership_holdings
    mutation: update
    meaning: Automatic renewal is switched on, switched off, or moved to a different payment method.
    grain: one row per change of the automatic renewal setting
    fields:
      auto_renew: the new setting
      auto_renew_tender: the tender billed for automatic renewal, none when switched off
    triggers: []

  - type: membership_eligibility_reverified
    target: membership_holdings
    mutation: update
    meaning: The status-verification partner returns a new successful student or service verification for a Student Club or Heroes Club membership.
    grain: one row per verification result received
    fields:
      eligibility_verified_through: the new last date through which the verification is valid
    triggers: []

  - type: membership_expired
    target: membership_holdings
    mutation: {transition: {from: active, to: expired}}
    meaning: The membership year ends without a renewal fee being paid.
    grain: one row per lapse
    fields:
      status: becomes expired
    triggers: []

  - type: membership_suspended
    target: membership_holdings
    mutation: {transition: {from: active, to: suspended}}
    meaning: The membership office suspends privileges after a membership fee payment is charged back.
    grain: one row per suspension
    fields:
      status: becomes suspended
    triggers: []

  - type: membership_reinstated
    target: membership_holdings
    mutation: {transition: {from: suspended, to: active}}
    meaning: The membership office lifts a suspension after the charged-back fee is repaid at a club.
    grain: one row per reinstatement
    fields:
      status: becomes active
    triggers: []

  - type: membership_cancelled
    target: membership_holdings
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The primary member's confirmed cancellation ends the membership and every card on it.
    grain: one row per cancellation
    fields:
      status: becomes cancelled
      closed_date: the date the cancellation was confirmed
    triggers:
      - event: membership:membership_card_deactivated
        map: {deactivation_reason: membership_ended}

  - type: membership_closed
    target: membership_holdings
    mutation: {transition: [{from: expired, to: closed}, {from: suspended, to: closed}]}
    meaning: A long-lapsed or unresolved-suspension membership is closed and its number retired.
    grain: one row per closure
    fields:
      status: becomes closed
      closed_date: the closure date
    triggers:
      - event: membership:membership_card_deactivated
        map: {deactivation_reason: membership_ended}

  - type: membership_fee_charged
    target: membership_transactions
    meaning: A membership fee is charged — for a new membership year, a renewal, a mid-year upgrade, or a business add-on card.
    grain: one row per fee, per membership year, per tender (per add-on card for add-on fees)
    distinguish_by: [fee_type, term_start_date, membership_card_id, tender]
    fields:
      transaction_date: the date the fee was charged
      amount: the fee charged
      fee_type: new_term, renewal_term, upgrade_difference or addon_card_fee
      term_start_date: the first day of the membership year the fee pays for
      term_end_date: the last day of the membership year the fee pays for
      membership_card_id: the add-on card issuance the fee is for (add-on fees only)
      tender: how the fee was paid
    account: fee_paid
    direction: in
    triggers: []

  - type: membership_fee_refunded
    target: membership_transactions
    meaning: All or part of one membership fee charge is refunded.
    grain: one row per refund of one fee charge for one reason
    distinguish_by: [source_txn_id, refund_reason]
    fields:
      transaction_date: the date the refund was issued
      amount: the amount refunded
      fee_type: the fee type of the charge being refunded
      refund_reason: why the refund was issued
      source_txn_id: the exact fee charge being refunded
      term_start_date: the first day of the membership year of the refunded charge
      term_end_date: the last day of the membership year of the refunded charge
      membership_card_id: the add-on card issuance, for add-on fee refunds
      tender: the tender the refund is returned to
    account: fee_paid
    direction: out
    triggers: []

  - type: membership_reward_accrued
    target: membership_transactions
    meaning: Annual Reward is earned on one qualifying purchase line or optical charge.
    grain: one row per qualifying source entry
    distinguish_by: [source_ref_id]
    fields:
      transaction_date: the date of the qualifying purchase
      amount: the reward earned
      basis_amount: the qualifying pre-tax amount of the source entry
      source_category: order or optical
      source_ref_id: the order sale line or optical charge that earned the reward
      term_start_date: the first day of the membership year the reward belongs to
      term_end_date: the last day of the membership year the reward belongs to
    account: annual_reward
    direction: in
    triggers: []

  - type: membership_reward_reversed
    target: membership_transactions
    meaning: Annual Reward earned on a purchase is taken back because the purchase was returned, price-adjusted, rebated or refunded.
    grain: one row per refund-side source entry
    distinguish_by: [source_ref_id]
    fields:
      transaction_date: the date of the return or refund
      amount: the reward reversed
      basis_amount: the pre-tax amount of the return or refund
      source_category: order or optical
      source_ref_id: the order return, adjustment or rebate entry, or the optical credit, that caused the reversal
      term_start_date: the first day of the membership year the reversal is booked in
      term_end_date: the last day of the membership year the reversal is booked in
    account: annual_reward
    direction: out
    triggers: []

  - type: membership_reward_certificate_issued
    target: membership_transactions
    meaning: At the end of a Plus membership year the Annual Reward balance is converted into a certificate redeemable at the clubs.
    grain: one row per membership year converted
    distinguish_by: [term_end_date]
    fields:
      transaction_date: the reward year's end date, on which the certificate is issued
      amount: the certificate value
      term_start_date: the first day of the reward year
      term_end_date: the last day of the reward year
    account: annual_reward
    direction: out
    triggers: []

  - type: membership_reward_certificate_reissued
    target: membership_transactions
    meaning: A lost or undelivered Annual Reward certificate is voided and reissued for the same value and expiry.
    grain: one row per reissue of one certificate
    distinguish_by: [source_txn_id, transaction_date]
    fields:
      transaction_date: the date of the reissue
      amount: the value carried over from the original certificate
      source_txn_id: the original certificate issuance
      term_end_date: the reward year end of the original certificate
    triggers: []

  - type: membership_card_issued
    target: membership_cards
    meaning: A membership card is issued to the primary member, a household cardholder or a business add-on cardholder, new or as a replacement.
    grain: one row per physical card issued
    distinguish_by: [card_type, cardholder_name, event_date, issue_reason]
    fields:
      card_type: primary, household or business_addon
      cardholder_name: the name printed on the card
      event_date: the issue date
      issue_reason: why the card was issued
      source_card_id: the card being replaced, for replacements
    triggers:
      - event: membership:membership_fee_charged
        when: {card_type: business_addon, issue_reason: added_cardholder}
        map: {fee_type: addon_card_fee, membership_card_id: membership_card_id}

  - type: membership_card_deactivated
    target: membership_cards
    meaning: A card on the membership stops admitting its holder — reported lost or stolen, removed by the primary member, or ended with the membership.
    grain: one row per card deactivated
    distinguish_by: [source_card_id]
    fields:
      card_type: the type of the card deactivated
      cardholder_name: the name on the card deactivated
      event_date: the deactivation date
      deactivation_reason: why the card was deactivated
      source_card_id: the card issuance being deactivated
    triggers: []

measures:
  - id: membership_msr_year_reward_net
    window: the membership year that starts on the membership's current term_start_date, through the frozen date
    measure: sum of membership_reward_accrued amounts minus sum of membership_reward_reversed amounts on the membership whose term_start_date equals the current term_start_date
  - id: membership_msr_completed_year_reward
    window: one completed membership year, identified by its term_end_date
    measure: sum of membership_reward_accrued amounts minus sum of membership_reward_reversed amounts on the membership whose term_end_date equals that year's end date (the reward actually earned for that year, whatever part was carried forward)
  - id: membership_msr_unreversed_line_reward
    window: the life of one original accrual, identified by the sale line or optical charge in its source_ref_id
    measure: the amount of that membership_reward_accrued entry minus every membership_reward_reversed amount already posted for refund-side entries that point back to the same sale line (order_lines.source_order_line_id) or the same optical charge (optical_transactions.source_txn_id)
  - id: membership_msr_term_base_fees_paid
    window: the current membership year (fee entries whose term_start_date equals the membership's current term_start_date)
    measure: sum of membership_fee_charged amounts with fee_type new_term, renewal_term or upgrade_difference, minus membership_fee_refunded amounts already posted against those charges
  - id: membership_msr_term_addon_fees_paid
    window: the current membership year (fee entries whose term_start_date equals the membership's current term_start_date)
    measure: sum of membership_fee_charged amounts with fee_type addon_card_fee, minus membership_fee_refunded amounts already posted against those charges
  - id: membership_msr_unused_whole_months
    window: from the cancellation request's requested_date to the membership's expiry_date
    measure: the number of whole calendar months of the current membership year that begin after the requested_date (the month in which the request falls counts as used)
  - id: membership_msr_active_household_cards
    window: the life of the membership
    measure: count of membership_card_issued entries with card_type household whose card has no membership_card_deactivated entry pointing to it in source_card_id
  - id: membership_msr_active_addon_cards
    window: the life of the membership
    measure: count of membership_card_issued entries with card_type business_addon whose card has no membership_card_deactivated entry pointing to it in source_card_id
  - id: membership_msr_replacements_this_year
    window: the current membership year, event_date from term_start_date through the frozen date
    measure: count of membership_card_issued entries with issue_reason replacement_lost_or_stolen or replacement_damaged
  - id: membership_msr_student_terms
    window: the life of the membership while it has only ever been held at the Student tier
    measure: count of membership_fee_charged entries with fee_type new_term or renewal_term

policies:
  - id: membership_agg_multi_holding
    subject: [membership_enrolled]
    rule: >
      A person may be the primary member of at most one consumer-segment membership and at most one
      business-segment membership at a time, the segment of each tier being its membership_segment; holding
      a consumer membership never prevents opening a business membership, and the reverse. A customer may not
      be enrolled in a new membership of a segment while already the primary member of a membership of that
      same segment whose status is active, expired or suspended. A member whose existing membership of the
      segment is expired renews it instead of enrolling again, so the membership number and history are kept;
      only a cancelled or closed membership leaves the segment free for a new enrollment. Being a household or
      add-on cardholder on someone else's membership does not count toward these limits.
    eligibility:
      - id: one_open_membership_per_segment
        applies_to: [membership_enrolled]
        kind: dedup
        condition: A customer may not be enrolled in a new membership of a segment while already the primary member of a membership of that same segment whose status is active, expired or suspended.
        evidence_fields: [membership_holdings.customer_id, membership_holdings.variant_name, membership_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.customer_id]
          action_bindings:
            membership_holdings.customer_id: customer_id
        dedup_contract:
          table: membership_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [active, expired, suspended]}
          distinct_fields: [variant_name]
    params:
      max_per_customer: 2
      max_per_segment: 1

  - id: membership_agg_reward_attribution
    subject: [membership_reward_accrued, membership_reward_reversed]
    rule: >
      When a customer holds both a consumer and a business membership, or is a cardholder on several, the
      memberships are never pooled: each purchase earns Annual Reward only on the membership recorded on that
      purchase (order_holdings.membership_id for merchandise, optical_holdings.membership_id for eyewear), and
      each membership's cap, balance and certificate are computed separately. Annual Reward for a purchase
      accrues only to the membership whose card was presented for it. Purchases made with a household or
      business add-on card belong to the membership the card is issued on and earn to it when that tier's
      cardholder_purchases_earn_to_primary is true. A reversal is always booked on the same membership as the
      accrual it takes back, found through the source sale line or optical charge, even when the member now
      presents a different card for the return; a member asking to move reward between memberships, or to
      merge two memberships' balances, is asking for something no Northgate policy provides.
    eligibility:
      - id: reward_follows_presented_card
        applies_to: [membership_reward_accrued, membership_reward_reversed]
        kind: authorization
        condition: Annual Reward for a purchase accrues only to the membership whose card was presented for it.
        evidence_fields: [order_holdings.membership_id, optical_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.membership_id]
            - [optical_holdings.membership_id]
          action_bindings:
            order_holdings.membership_id: membership_id
            optical_holdings.membership_id: membership_id

  - id: membership_enrollment_terms
    subject: [membership_enrolled, membership_fee_charged]
    rule: >
      A membership is opened at the tier the applicant chooses, provided the tier's entry gate is met: the
      primary member must be at least min_primary_age_years years old on the enrollment date; a tier with
      requires_student_verification or requires_service_verification is opened only with a successful result
      from the status-verification partner, whose validity date is recorded as eligibility_verified_through;
      and a tier with requires_business_license is opened only in the name of a licensed business. The primary
      member must be at least min_primary_age_years years old on the enrollment date. A Business or Business
      Plus membership is opened only for a business name the applicant states exactly as it appears on the
      business license. The first membership year starts on the enrollment date and its expiry_date is the day
      before the same calendar date term_length_months later (a start on the 29th-31st that has no
      counterpart day ends on the last day of the month before). The tier's annual_fee_usd is charged on the
      enrollment date as a new_term fee; no other fee is due at sign-up, and the free household cards may be
      added the same day.
    eligibility:
      - id: primary_minimum_age
        applies_to: [membership_enrolled]
        kind: authorization
        condition: The primary member must be at least min_primary_age_years years old on the enrollment date.
        evidence_fields: [customers.customer_id, customers.date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: business_name_on_license
        applies_to: [membership_enrolled]
        kind: caller_fact
        condition: A Business or Business Plus membership is opened only for a business name the applicant states exactly as it appears on the business license.
        evidence_fields: [membership_holdings.business_name, membership_holdings.customer_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [membership_holdings.customer_id]
          action_bindings:
            membership_holdings.customer_id: customer_id
    params:
      per_tier:
        Northgate Student Club Membership: {enrollment_fee: "=annual_fee_usd", min_age: "=min_primary_age_years", needs_status_verification: "=requires_student_verification"}
        Northgate Heroes Club Membership: {enrollment_fee: "=annual_fee_usd", min_age: "=min_primary_age_years", needs_status_verification: "=requires_service_verification"}
        Northgate Club Membership: {enrollment_fee: "=annual_fee_usd", min_age: "=min_primary_age_years", needs_status_verification: false}
        Northgate Business Membership: {enrollment_fee: "=annual_fee_usd", min_age: "=min_primary_age_years", needs_status_verification: false}
        Northgate Club Plus Membership: {enrollment_fee: "=annual_fee_usd", min_age: "=min_primary_age_years", needs_status_verification: false}
        Northgate Business Plus Membership: {enrollment_fee: "=annual_fee_usd", min_age: "=min_primary_age_years", needs_status_verification: false}

  - id: membership_fee_schedule
    subject: [membership_fee_charged]
    rule: >
      Every membership fee is charged as its own entry with its fee_type and the membership year it pays for.
      A new_term or renewal_term fee equals the annual_fee_usd of the tier the membership year is held at. An
      upgrade_difference fee equals the annual_fee_usd of the upgrade_target_tier minus the annual_fee_usd of
      the current tier; it is never prorated and pays only for the rest of the current membership year. An
      addon_card_fee equals the tier's addon_card_fee_usd for each add-on card for the membership year in
      which it is issued, charged in full whatever the issue date when addon_fee_prorated is false, and is
      charged again for every active add-on card at each renewal. A renewal paid with an Annual Reward
      certificate is allowed only where reward_certificate_renewal_tender_allowed is true; the certificate is
      applied in full as a renewal_term entry with tender reward_certificate and, when its value is smaller
      than the fee, the remainder is charged as a second renewal_term entry on the member's other tender; a
      certificate worth more than the renewal fee is not applied to a renewal and is redeemed at a club
      register instead. Sales tax on membership fees is not charged by Northgate. A charge repeated for the
      same fee_type, membership year and add-on card is a duplicate and is refunded with refund_reason
      duplicate_charge.
    eligibility: []
    params:
      per_tier:
        Northgate Student Club Membership: {term_fee: "=annual_fee_usd", addon_fee: "=addon_card_fee_usd", certificate_for_renewal: "=reward_certificate_renewal_tender_allowed"}
        Northgate Heroes Club Membership: {term_fee: "=annual_fee_usd", addon_fee: "=addon_card_fee_usd", certificate_for_renewal: "=reward_certificate_renewal_tender_allowed"}
        Northgate Club Membership: {term_fee: "=annual_fee_usd", addon_fee: "=addon_card_fee_usd", certificate_for_renewal: "=reward_certificate_renewal_tender_allowed"}
        Northgate Business Membership: {term_fee: "=annual_fee_usd", addon_fee: "=addon_card_fee_usd", certificate_for_renewal: "=reward_certificate_renewal_tender_allowed"}
        Northgate Club Plus Membership: {term_fee: "=annual_fee_usd", addon_fee: "=addon_card_fee_usd", certificate_for_renewal: "=reward_certificate_renewal_tender_allowed"}
        Northgate Business Plus Membership: {term_fee: "=annual_fee_usd", addon_fee: "=addon_card_fee_usd", certificate_for_renewal: "=reward_certificate_renewal_tender_allowed"}
    formula:
      term_fee_amount: annual_fee_usd
      addon_fee_amount: addon_card_fee_usd

  - id: membership_renewal_dating
    subject: [membership_term_renewed, membership_renewed_after_lapse]
    rule: >
      A renewal is taken only on a membership whose status is active or expired; a suspended membership must
      first be reinstated by the membership office, and a cancelled or closed membership cannot be renewed and
      needs a new enrollment. An active membership renewed on or before its expiry_date continues without a
      gap: the new membership year starts the day after the current expiry_date and runs term_length_months.
      An expired membership is renewed back to active, and its new membership year is dated by the late
      renewal rule. A lapsed membership keeps its original anniversary only when the renewal fee is paid no
      later than late_renewal_anchor_months calendar months after the expiry date of the lapsed membership
      year. Calendar months are added to the expiry date and, when the resulting month has no such day, the
      boundary falls on that month's last day. Within that limit the new year starts the day after the lapsed
      expiry_date, so the lapsed weeks count as part of the new year; beyond it the new year starts on the date
      the renewal fee is paid. Cardholders of an expired membership may not purchase merchandise while
      expired_shopping_allowed is false, but returns of earlier purchases are never refused because the
      membership has lapsed. When the primary member has confirmed a downgrade_at_renewal request, the next
      renewal is taken at the tier's downgrade_target_tier and charged that tier's annual fee; until that
      renewal the current tier and its privileges continue. The renewal fee follows membership_fee_schedule.
    eligibility:
      - id: renewable_status
        applies_to: [membership_term_renewed, membership_renewed_after_lapse]
        kind: state
        condition: A renewal is taken only on a membership whose status is active or expired; a suspended membership must first be reinstated by the membership office, and a cancelled or closed membership cannot be renewed and needs a new enrollment.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [active, expired]
      - id: late_renewal_keeps_anniversary
        applies_to: [membership_renewed_after_lapse]
        kind: time
        condition: A lapsed membership keeps its original anniversary only when the renewal fee is paid no later than late_renewal_anchor_months calendar months after the expiry date of the lapsed membership year.
        evidence_fields: [membership_holdings.expiry_date, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the expiry date of the lapsed membership year
          anchor_source: membership_holdings.expiry_date
          relation: not_after
          duration_source: variants.late_renewal_anchor_months
          unit: calendar_months
          counting_rule: Calendar months are added to the expiry date and, when the resulting month has no such day, the boundary falls on that month's last day.
          boundary: inclusive
    params:
      per_tier:
        Northgate Student Club Membership: {anchor_months: "=late_renewal_anchor_months", term_months: "=term_length_months", shop_while_expired: "=expired_shopping_allowed"}
        Northgate Heroes Club Membership: {anchor_months: "=late_renewal_anchor_months", term_months: "=term_length_months", shop_while_expired: "=expired_shopping_allowed"}
        Northgate Club Membership: {anchor_months: "=late_renewal_anchor_months", term_months: "=term_length_months", shop_while_expired: "=expired_shopping_allowed"}
        Northgate Business Membership: {anchor_months: "=late_renewal_anchor_months", term_months: "=term_length_months", shop_while_expired: "=expired_shopping_allowed"}
        Northgate Club Plus Membership: {anchor_months: "=late_renewal_anchor_months", term_months: "=term_length_months", shop_while_expired: "=expired_shopping_allowed"}
        Northgate Business Plus Membership: {anchor_months: "=late_renewal_anchor_months", term_months: "=term_length_months", shop_while_expired: "=expired_shopping_allowed"}

  - id: membership_status_tier_renewal
    subject: [membership_eligibility_reverified, membership_term_renewed, membership_renewed_after_lapse]
    rule: >
      Student Club and Heroes Club memberships are discounted on the strength of a verified status. A Student
      Club or Heroes Club renewal keeps its tier only when the status verification on record is valid on the
      first day of the new membership year. Verification results come only from the status-verification
      partner; each successful result sets eligibility_verified_through to the day before the same calendar
      date eligibility_reverification_months later, and a member's own statement of status is never recorded
      as verification. A Student Club membership also keeps its tier only while membership_msr_student_terms
      is below the tier's discounted_term_limit. When either condition fails, the renewal is taken at the
      tier's eligibility_lapse_conversion_tier and charged that tier's annual fee, and the membership stays at
      the converted tier from then on; a later verification does not restore the discounted tier.
    eligibility:
      - id: verification_valid_at_renewal
        applies_to: [membership_term_renewed, membership_renewed_after_lapse]
        kind: authorization
        condition: A Student Club or Heroes Club renewal keeps its tier only when the status verification on record is valid on the first day of the new membership year.
        evidence_fields: [membership_holdings.eligibility_verified_through, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
    measures: [membership_msr_student_terms]
    params:
      per_tier:
        Northgate Student Club Membership: {reverify_months: "=eligibility_reverification_months", term_limit: "=discounted_term_limit", converts_to: "=eligibility_lapse_conversion_tier"}
        Northgate Heroes Club Membership: {reverify_months: "=eligibility_reverification_months", term_limit: "=discounted_term_limit", converts_to: "=eligibility_lapse_conversion_tier"}
        Northgate Club Membership: {reverify_months: "=eligibility_reverification_months", term_limit: "=discounted_term_limit", converts_to: "=eligibility_lapse_conversion_tier"}
        Northgate Business Membership: {reverify_months: "=eligibility_reverification_months", term_limit: "=discounted_term_limit", converts_to: "=eligibility_lapse_conversion_tier"}
        Northgate Club Plus Membership: {reverify_months: "=eligibility_reverification_months", term_limit: "=discounted_term_limit", converts_to: "=eligibility_lapse_conversion_tier"}
        Northgate Business Plus Membership: {reverify_months: "=eligibility_reverification_months", term_limit: "=discounted_term_limit", converts_to: "=eligibility_lapse_conversion_tier"}

  - id: membership_upgrade
    subject: [membership_upgraded]
    rule: >
      A member may upgrade during the membership year to the tier's upgrade_target_tier where
      mid_term_upgrade_allowed is true; Student Club and both Plus tiers cannot be upgraded mid-year. An
      upgrade is processed only on a membership whose status is active. The upgrade_difference fee is charged
      on the upgrade date, the expiry_date does not change, and Annual Reward accrues only on qualifying
      purchases made on or after the upgrade date — purchases earlier in the year are not rewarded
      retroactively. A Heroes Club membership upgraded to Club Plus no longer needs status verification. The
      household card and any add-on cards move to the new tier with the membership at no charge. Moving a
      membership between the consumer and business segments is not an upgrade: it requires a new membership
      in the other segment.
    eligibility:
      - id: upgrade_needs_active
        applies_to: [membership_upgraded]
        kind: state
        condition: An upgrade is processed only on a membership whose status is active.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [active]
    params:
      per_tier:
        Northgate Student Club Membership: {upgrade_allowed: "=mid_term_upgrade_allowed", upgrade_to: "=upgrade_target_tier"}
        Northgate Heroes Club Membership: {upgrade_allowed: "=mid_term_upgrade_allowed", upgrade_to: "=upgrade_target_tier"}
        Northgate Club Membership: {upgrade_allowed: "=mid_term_upgrade_allowed", upgrade_to: "=upgrade_target_tier"}
        Northgate Business Membership: {upgrade_allowed: "=mid_term_upgrade_allowed", upgrade_to: "=upgrade_target_tier"}
        Northgate Club Plus Membership: {upgrade_allowed: "=mid_term_upgrade_allowed", upgrade_to: "=upgrade_target_tier"}
        Northgate Business Plus Membership: {upgrade_allowed: "=mid_term_upgrade_allowed", upgrade_to: "=upgrade_target_tier"}

  - id: membership_plus_guarantee
    subject: [membership_fee_refunded, membership_downgraded]
    rule: >
      On a tier with shortfall_guarantee_enabled, Northgate guarantees that the Annual Reward earned in a
      membership year is worth at least the tier's plus_premium_usd. For a completed membership year whose
      membership_msr_completed_year_reward is below plus_premium_usd, the primary member may claim the
      difference; the claim is recorded as a shortfall_guarantee_claim request and takes effect only when the
      primary member confirms it. A guarantee claim is accepted only when it is requested no later than
      shortfall_claim_window_days calendar days after the expiry date of the completed membership year. Days
      are counted as calendar days, the day after the expiry date being day 1. A guarantee claim is paid only
      on a membership whose status is active or expired. Only one guarantee claim is paid per membership year.
      The refund equals plus_premium_usd minus membership_msr_completed_year_reward, is booked with
      refund_reason shortfall_guarantee against the fee charge that paid the Plus premium for that year (the
      new_term or renewal_term charge at the Plus tier, or the upgrade_difference charge when the year was
      upgraded mid-term), and goes back to that charge's tender, or to a Northgate Shop Card when the charge
      was paid with a reward certificate. A confirmed claim moves the membership to its downgrade_target_tier
      the same day; when the current membership year has already been paid at the Plus fee, the
      plus_premium_usd of the current year is also refunded with refund_reason downgrade_difference against
      that renewal charge. The member keeps any certificate already issued for the completed year. A year with
      reward at or above plus_premium_usd has no shortfall, and a member who simply wants a cheaper tier
      without a shortfall downgrades at the next renewal instead.
    eligibility:
      - id: guarantee_claim_window
        applies_to: [membership_fee_refunded]
        kind: time
        condition: A guarantee claim is accepted only when it is requested no later than shortfall_claim_window_days calendar days after the expiry date of the completed membership year.
        evidence_fields: [membership_transactions.term_end_date, membership_requests.requested_date, membership_transactions.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_transactions.membership_id, membership_transactions.term_end_date]
          action_bindings:
            membership_transactions.membership_id: membership_id
            membership_transactions.term_end_date: term_end_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the expiry date of the completed membership year
          anchor_source: membership_transactions.term_end_date
          relation: not_after
          duration_source: variants.shortfall_claim_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the day after the expiry date being day 1.
          boundary: inclusive
      - id: guarantee_status
        applies_to: [membership_fee_refunded]
        kind: state
        condition: A guarantee claim is paid only on a membership whose status is active or expired.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [active, expired]
      - id: one_claim_per_year
        applies_to: [membership_fee_refunded]
        kind: dedup
        condition: Only one guarantee claim is paid per membership year.
        evidence_fields: [membership_transactions.membership_id, membership_transactions.term_end_date, membership_transactions.refund_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_transactions.membership_id, membership_transactions.term_end_date]
          action_bindings:
            membership_transactions.membership_id: membership_id
            membership_transactions.term_end_date: term_end_date
        dedup_contract:
          table: membership_transactions
          mode: separate_record
          object_bindings: {membership_id: membership_id, term_end_date: term_end_date}
          duplicate_filters: {refund_reason: [shortfall_guarantee]}
          distinct_fields: [transaction_date]
    measures: [membership_msr_completed_year_reward]
    params:
      per_tier:
        Northgate Student Club Membership: {guarantee: "=shortfall_guarantee_enabled", threshold: "=plus_premium_usd", window_days: "=shortfall_claim_window_days", downgrade_to: "=downgrade_target_tier"}
        Northgate Heroes Club Membership: {guarantee: "=shortfall_guarantee_enabled", threshold: "=plus_premium_usd", window_days: "=shortfall_claim_window_days", downgrade_to: "=downgrade_target_tier"}
        Northgate Club Membership: {guarantee: "=shortfall_guarantee_enabled", threshold: "=plus_premium_usd", window_days: "=shortfall_claim_window_days", downgrade_to: "=downgrade_target_tier"}
        Northgate Business Membership: {guarantee: "=shortfall_guarantee_enabled", threshold: "=plus_premium_usd", window_days: "=shortfall_claim_window_days", downgrade_to: "=downgrade_target_tier"}
        Northgate Club Plus Membership: {guarantee: "=shortfall_guarantee_enabled", threshold: "=plus_premium_usd", window_days: "=shortfall_claim_window_days", downgrade_to: "=downgrade_target_tier"}
        Northgate Business Plus Membership: {guarantee: "=shortfall_guarantee_enabled", threshold: "=plus_premium_usd", window_days: "=shortfall_claim_window_days", downgrade_to: "=downgrade_target_tier"}
    formula:
      when: refund_reason == "shortfall_guarantee"
      amount: max(0, round(plus_premium_usd - membership_msr_completed_year_reward, 2))

  - id: membership_cancellation_refund
    subject: [membership_cancelled, membership_fee_refunded, membership_card_deactivated]
    rule: >
      The primary member may cancel a membership at any time while it is active; member services records a
      cancel_with_refund request dated the day the member asks, and the membership is cancelled only when the
      primary member confirms it. A cancellation refund is issued only while the membership's status is active
      or cancelled; an expired membership has no unused year to refund, and a suspended membership's fees are
      settled by the membership office. The current-year fees are refunded in full only when the cancellation
      is requested no later than full_refund_window_days calendar days after the first day of the current
      membership year. Days are counted as calendar days from the first day of the current membership year,
      that day being day 0. After that window the tier refunds membership_msr_unused_whole_months twelfths of
      the current-year fees where prorated_refund_after_window is true, and nothing where it is false. The
      current-year fees are membership_msr_term_base_fees_paid, plus membership_msr_term_addon_fees_paid where
      refund_includes_addon_fees is true. Where refund_deducts_annual_reward is true, the refund is reduced by
      membership_msr_year_reward_net and never goes below zero; the Annual Reward balance is then forfeited
      and no certificate is issued for the year. Each refunded fee charge gets its own refund entry
      (cancellation_full or cancellation_prorated) against that charge, returned to its tender, or to a
      Northgate Shop Card when the charge was paid with a reward certificate. Cancellation deactivates every
      card on the membership. Fees of earlier membership years are never refunded.
    eligibility:
      - id: refund_status
        applies_to: [membership_fee_refunded]
        kind: state
        condition: A cancellation refund is issued only while the membership's status is active or cancelled; an expired membership has no unused year to refund, and a suspended membership's fees are settled by the membership office.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [active, cancelled]
      - id: full_refund_window
        applies_to: [membership_fee_refunded]
        kind: time
        condition: The current-year fees are refunded in full only when the cancellation is requested no later than full_refund_window_days calendar days after the first day of the current membership year.
        evidence_fields: [membership_holdings.term_start_date, membership_requests.requested_date, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the first day of the current membership year
          anchor_source: membership_holdings.term_start_date
          relation: not_after
          duration_source: variants.full_refund_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days from the first day of the current membership year, that day being day 0.
          boundary: inclusive
    measures: [membership_msr_term_base_fees_paid, membership_msr_term_addon_fees_paid, membership_msr_unused_whole_months, membership_msr_year_reward_net]
    params:
      per_tier:
        Northgate Student Club Membership: {full_window_days: "=full_refund_window_days", prorate_after: "=prorated_refund_after_window", deduct_reward: "=refund_deducts_annual_reward", include_addons: "=refund_includes_addon_fees"}
        Northgate Heroes Club Membership: {full_window_days: "=full_refund_window_days", prorate_after: "=prorated_refund_after_window", deduct_reward: "=refund_deducts_annual_reward", include_addons: "=refund_includes_addon_fees"}
        Northgate Club Membership: {full_window_days: "=full_refund_window_days", prorate_after: "=prorated_refund_after_window", deduct_reward: "=refund_deducts_annual_reward", include_addons: "=refund_includes_addon_fees"}
        Northgate Business Membership: {full_window_days: "=full_refund_window_days", prorate_after: "=prorated_refund_after_window", deduct_reward: "=refund_deducts_annual_reward", include_addons: "=refund_includes_addon_fees"}
        Northgate Club Plus Membership: {full_window_days: "=full_refund_window_days", prorate_after: "=prorated_refund_after_window", deduct_reward: "=refund_deducts_annual_reward", include_addons: "=refund_includes_addon_fees"}
        Northgate Business Plus Membership: {full_window_days: "=full_refund_window_days", prorate_after: "=prorated_refund_after_window", deduct_reward: "=refund_deducts_annual_reward", include_addons: "=refund_includes_addon_fees"}
    formula:
      when: refund_reason in ["cancellation_full", "cancellation_prorated"]
      refundable_fees: membership_msr_term_base_fees_paid + (membership_msr_term_addon_fees_paid if refund_includes_addon_fees else 0)
      prorated_share: (membership_msr_unused_whole_months / term_length_months) if prorated_refund_after_window else 0
      share: 1 if refund_reason == "cancellation_full" else prorated_share
      reward_deduction: membership_msr_year_reward_net if refund_deducts_annual_reward else 0
      total_refund: max(0, round(refundable_fees * share - reward_deduction, 2))

  - id: membership_annual_reward_earning
    subject: [membership_reward_accrued, membership_reward_reversed]
    rule: >
      Annual Reward is earned at the tier's annual_reward_rate_pct on the annual_reward_basis of each
      qualifying order sale line and optical charge, rounded to the cent per entry. Annual Reward accrues only
      on a membership whose tier carries a non-zero annual_reward_rate_pct on the date of the purchase.
      Annual Reward accrues only while the membership's status is active. Merchandise classes in
      annual_reward_excluded_classes never earn; delivery fees, Tire Center installation and service fees,
      Northgate Care protection plans and membership fees are not merchandise and never earn either. The
      reward of one membership year may not exceed annual_reward_cap_usd: an entry that would take
      membership_msr_year_reward_net past the cap accrues only the remaining room, and nothing accrues once
      the cap is reached. When a qualifying purchase is returned, price-adjusted, rebated or refunded, the
      reward on the refunded amount is reversed at the rate the original entry earned, never more than
      membership_msr_unreversed_line_reward and never more than the current annual_reward_balance; the
      reversal is booked in the membership year in which the refund happens, and a refund that falls after the
      original year's certificate was issued reduces the current year's balance instead. A purchase on a
      non-Plus tier earns nothing, and a later upgrade does not make it earn.
    eligibility:
      - id: plus_tier_on_purchase_date
        applies_to: [membership_reward_accrued]
        kind: authorization
        condition: Annual Reward accrues only on a membership whose tier carries a non-zero annual_reward_rate_pct on the date of the purchase.
        evidence_fields: [membership_holdings.variant_name, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
      - id: accrual_needs_active
        applies_to: [membership_reward_accrued]
        kind: state
        condition: Annual Reward accrues only while the membership's status is active.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [active]
    measures: [membership_msr_year_reward_net, membership_msr_unreversed_line_reward]
    params:
      per_tier:
        Northgate Student Club Membership: {rate_pct: "=annual_reward_rate_pct", year_cap: "=annual_reward_cap_usd", excluded: "=annual_reward_excluded_classes", cardholders_count: "=cardholder_purchases_earn_to_primary"}
        Northgate Heroes Club Membership: {rate_pct: "=annual_reward_rate_pct", year_cap: "=annual_reward_cap_usd", excluded: "=annual_reward_excluded_classes", cardholders_count: "=cardholder_purchases_earn_to_primary"}
        Northgate Club Membership: {rate_pct: "=annual_reward_rate_pct", year_cap: "=annual_reward_cap_usd", excluded: "=annual_reward_excluded_classes", cardholders_count: "=cardholder_purchases_earn_to_primary"}
        Northgate Business Membership: {rate_pct: "=annual_reward_rate_pct", year_cap: "=annual_reward_cap_usd", excluded: "=annual_reward_excluded_classes", cardholders_count: "=cardholder_purchases_earn_to_primary"}
        Northgate Club Plus Membership: {rate_pct: "=annual_reward_rate_pct", year_cap: "=annual_reward_cap_usd", excluded: "=annual_reward_excluded_classes", cardholders_count: "=cardholder_purchases_earn_to_primary"}
        Northgate Business Plus Membership: {rate_pct: "=annual_reward_rate_pct", year_cap: "=annual_reward_cap_usd", excluded: "=annual_reward_excluded_classes", cardholders_count: "=cardholder_purchases_earn_to_primary"}
    formula:
      uncapped_reward: round(basis_amount * annual_reward_rate_pct / 100, 2)
      accrual_amount: min(uncapped_reward, max(0, annual_reward_cap_usd - membership_msr_year_reward_net))
      reversal_amount: min(uncapped_reward, membership_msr_unreversed_line_reward, annual_reward_balance)

  - id: membership_reward_certificates
    subject: [membership_reward_certificate_issued, membership_reward_certificate_reissued]
    rule: >
      On the last day of each membership year held at a tier with a non-zero annual_reward_rate_pct, the
      annual_reward_balance is converted into a certificate for its full value when it is at least
      annual_reward_min_certificate_usd; a smaller balance is not issued and carries into the next membership
      year. A certificate is issued only on a membership whose status is active or expired; the balance of a
      cancelled, suspended or closed membership is not converted. A certificate is redeemable at any club
      register as tender, or toward the renewal of the same membership under membership_fee_schedule, until
      reward_certificate_validity_months calendar months after the reward year's end; redemption at a register
      needs a membership that is active, while a renewal of the same membership may use it even if that
      membership has expired. An unredeemed certificate the member reports lost or never received is voided
      and reissued for the same value and expiry. A lost certificate is reissued only when the reissue is
      requested no later than reward_certificate_validity_months calendar months after the end of the reward
      year it was issued for. Calendar months are added to the reward year's end date and, when the resulting
      month has no such day, the boundary falls on that month's last day. A certificate is reissued at most
      reward_certificate_reissues_allowed times. An expired certificate has no value and is never reissued,
      extended or paid out.
    eligibility:
      - id: issue_status
        applies_to: [membership_reward_certificate_issued]
        kind: state
        condition: A certificate is issued only on a membership whose status is active or expired; the balance of a cancelled, suspended or closed membership is not converted.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [active, expired]
      - id: reissue_before_certificate_expiry
        applies_to: [membership_reward_certificate_reissued]
        kind: time
        condition: A lost certificate is reissued only when the reissue is requested no later than reward_certificate_validity_months calendar months after the end of the reward year it was issued for.
        evidence_fields: [membership_transactions.term_end_date, membership_transactions.membership_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_transactions.membership_txn_id]
          action_bindings:
            membership_transactions.membership_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the end of the reward year it was issued for
          anchor_source: membership_transactions.term_end_date
          relation: not_after
          duration_source: variants.reward_certificate_validity_months
          unit: calendar_months
          counting_rule: Calendar months are added to the reward year's end date and, when the resulting month has no such day, the boundary falls on that month's last day.
          boundary: inclusive
      - id: reissue_limit
        applies_to: [membership_reward_certificate_reissued]
        kind: dedup
        condition: A certificate is reissued at most reward_certificate_reissues_allowed times.
        evidence_fields: [membership_transactions.source_txn_id, membership_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_transactions.source_txn_id]
          action_bindings:
            membership_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: membership_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [membership_reward_certificate_reissued]}
          distinct_fields: [transaction_date]
    params:
      per_tier:
        Northgate Student Club Membership: {min_certificate: "=annual_reward_min_certificate_usd", validity_months: "=reward_certificate_validity_months", reissues: "=reward_certificate_reissues_allowed"}
        Northgate Heroes Club Membership: {min_certificate: "=annual_reward_min_certificate_usd", validity_months: "=reward_certificate_validity_months", reissues: "=reward_certificate_reissues_allowed"}
        Northgate Club Membership: {min_certificate: "=annual_reward_min_certificate_usd", validity_months: "=reward_certificate_validity_months", reissues: "=reward_certificate_reissues_allowed"}
        Northgate Business Membership: {min_certificate: "=annual_reward_min_certificate_usd", validity_months: "=reward_certificate_validity_months", reissues: "=reward_certificate_reissues_allowed"}
        Northgate Club Plus Membership: {min_certificate: "=annual_reward_min_certificate_usd", validity_months: "=reward_certificate_validity_months", reissues: "=reward_certificate_reissues_allowed"}
        Northgate Business Plus Membership: {min_certificate: "=annual_reward_min_certificate_usd", validity_months: "=reward_certificate_validity_months", reissues: "=reward_certificate_reissues_allowed"}
    formula:
      certificate_amount: annual_reward_balance if annual_reward_balance >= annual_reward_min_certificate_usd else 0

  - id: membership_cardholders
    subject: [membership_card_issued, membership_card_deactivated, membership_fee_refunded]
    rule: >
      Every card on a membership carries the same membership number and expiry date. A card is issued only on a
      membership whose status is active. A household card is issued only while
      membership_msr_active_household_cards is below free_household_cards; the household cardholder must be at
      least household_card_min_age_years old and, where household_same_address_required is true, live at the
      primary member's address — the primary member states these facts. A business add-on card is issued only
      while membership_msr_active_addon_cards is below max_addon_cards, and its addon_card_fee_usd is charged
      under membership_fee_schedule. Where card_issue_photo_id_required is true, a newly added cardholder's
      card is activated when the cardholder's photo is taken at any club membership counter; member services
      records the issuance. A replacement card is issued only after the lost or stolen card has been
      deactivated. Member services issues a replacement only while membership_msr_replacements_this_year is
      below replacement_cards_per_membership_year; beyond that the cardholder obtains a replacement in person
      at a club membership counter with photo ID. Only the primary member may add or remove cardholders. When
      the primary member removes a business add-on cardholder within full_refund_window_days calendar days
      after that card's add-on fee was charged, the fee is refunded in full with refund_reason
      addon_card_removed; after that no add-on fee is refunded until the membership itself is cancelled.
    eligibility:
      - id: issue_needs_active
        applies_to: [membership_card_issued]
        kind: state
        condition: A card is issued only on a membership whose status is active.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [active]
      - id: replacement_after_deactivation
        applies_to: [membership_card_issued]
        kind: authorization
        condition: A replacement card is issued only after the lost or stolen card has been deactivated.
        evidence_fields: [membership_cards.source_card_id, membership_cards.deactivation_reason, membership_cards.membership_card_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_cards.source_card_id]
          action_bindings:
            membership_cards.source_card_id: source_card_id
      - id: household_card_room
        applies_to: [membership_card_issued]
        kind: authorization
        condition: A household card is issued only while membership_msr_active_household_cards is below free_household_cards; the household cardholder must be at least household_card_min_age_years old and, where household_same_address_required is true, live at the primary member's address — the primary member states these facts.
        evidence_fields: [membership_cards.membership_id, membership_cards.card_type, membership_cards.event_type]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [membership_cards.membership_id]
          action_bindings:
            membership_cards.membership_id: membership_id
      - id: addon_card_room
        applies_to: [membership_card_issued]
        kind: authorization
        condition: A business add-on card is issued only while membership_msr_active_addon_cards is below max_addon_cards, and its addon_card_fee_usd is charged under membership_fee_schedule.
        evidence_fields: [membership_cards.membership_id, membership_cards.card_type, membership_cards.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
