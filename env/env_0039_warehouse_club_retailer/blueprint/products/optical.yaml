events:
  - type: optical_order_placed
    target: optical_holdings
    mutation: create
    meaning: A prescription eyewear job is ordered at an Optical counter; its frame and base lenses (and any ordered options) are charged the same day.
    grain: one row per pair of eyewear ordered
    fields:
      customer_id: the member who placed the job
      membership_id: the membership presented
      variant_name: the lens design ordered
      status: always ordered on creation
      rx_issue_date: the issue date of the prescription used
      frame_description: the frame on the work order
      lens_material: the lens material ordered
      vision_plan: the plan billed, or none
      order_date: the order date
      dispensed_date: empty until dispensed
      remake_count: always 0 on creation
    triggers:
      - event: optical:optical_charge_posted
        map: {remake_number: 0, remake_reason: not_applicable, event_date: order_date}

  - type: optical_lab_submitted
    target: optical_holdings
    mutation: {transition: {from: ordered, to: in_lab}}
    meaning: The verified job is sent to the lens lab.
    grain: one row per job submitted
    fields:
      status: becomes in_lab
    triggers: []

  - type: optical_ready
    target: optical_holdings
    mutation: {transition: [{from: in_lab, to: ready_for_pickup}, {from: remake_in_lab, to: ready_for_pickup}]}
    meaning: Finished or remade eyewear arrives at the club and passes inspection.
    grain: one row per arrival at the club
    fields:
      status: becomes ready_for_pickup
    triggers: []

  - type: optical_dispensed
    target: optical_holdings
    mutation: {transition: {from: ready_for_pickup, to: dispensed}}
    meaning: The optician fits the eyewear and hands it to the patient.
    grain: one row per dispensing
    fields:
      status: becomes dispensed
      dispensed_date: the date of the first dispensing (not moved by later remakes)
    triggers: []

  - type: optical_remake_opened
    target: optical_holdings
    mutation: {transition: {from: dispensed, to: remake_in_lab}}
    meaning: A remake of dispensed eyewear is opened and sent to the lab.
    grain: one row per remake opened
    fields:
      status: becomes remake_in_lab
      remake_count: increased by one
    triggers:
      - event: optical:optical_charge_posted
        map: {charge_component: remake_charge}

  - type: optical_lens_design_changed
    target: optical_holdings
    mutation: update
    meaning: A non-adapt remake switches the job to another lens design.
    grain: one row per design switch
    fields:
      variant_name: the lens design the job is remade in
    triggers: []

  - type: optical_order_cancelled
    target: optical_holdings
    mutation: {transition: [{from: ordered, to: cancelled}, {from: in_lab, to: cancelled}]}
    meaning: The job is cancelled before the eyewear is dispensed.
    grain: one row per job cancelled
    fields:
      status: becomes cancelled
      closed_date: the cancellation date
    triggers: []

  - type: optical_order_returned
    target: optical_holdings
    mutation: {transition: {from: dispensed, to: returned}}
    meaning: Dispensed eyewear is returned for a refund within the satisfaction window.
    grain: one row per job returned
    fields:
      status: becomes returned
      closed_date: the return date
    triggers: []

  - type: optical_charge_posted
    target: optical_transactions
    meaning: A component of the job, or a remake, is charged.
    grain: one row per charge component per remake number
    distinguish_by: [charge_component, remake_number]
    fields:
      event_date: the date of the charge
      charge_component: the component charged
      amount: the charge after any Plus discount
      remake_number: 0 for the original job, n for the n-th remake
      remake_reason: why the remake was opened
      reward_eligible: whether the charge earns Annual Reward
    account: optical_balance
    direction: in
    triggers:
      - event: membership:membership_reward_accrued
        when: {reward_eligible: true}
        map: {basis_amount: amount, source_category: optical, source_ref_id: optical_txn_id, transaction_date: event_date}

  - type: optical_credit_posted
    target: optical_transactions
    meaning: A credit is posted against one charge — a vision plan allowance, a refund, or a waived remake charge.
    grain: one row per credit of one charge for one reason
    distinguish_by: [source_txn_id, credit_reason]
    fields:
      event_date: the date of the credit
      charge_component: the component of the charge credited, or the allowance type
      amount: the credit
      remake_number: the remake number of the charge credited
      credit_reason: why the credit was posted
      source_txn_id: the exact charge credited
      reward_eligible: copied from the charge credited
    account: optical_balance
    direction: out
    triggers:
      - event: membership:membership_reward_reversed
        when: {reward_eligible: true}
        map: {basis_amount: amount, source_category: optical, source_ref_id: optical_txn_id, transaction_date: event_date}

measures:
  - id: optical_msr_remakes_for_reason
    window: the life of the job
    measure: count of optical_charge_posted entries with charge_component remake_charge whose remake_reason is the reason in question
  - id: optical_msr_plus_on_order_date
    window: the job, on its order_date
    measure: true when the membership on the job was held at Northgate Club Plus Membership or Northgate Business Plus Membership on the order date
  - id: optical_msr_charge_net
    window: the life of one charge
    measure: the charge's amount minus every optical_credit_posted amount whose source_txn_id is that charge
  - id: optical_msr_original_lens_charges
    window: the original job (remake_number 0)
    measure: sum of optical_msr_charge_net over the base_lenses, material_upgrade, anti_reflective_coating, photochromic and blue_light_filter charges with remake_number 0

policies:
  - id: optical_agg_multi_holding
    subject: [optical_order_placed]
    rule: >
      A member may have any number of eyewear jobs, including several open at once for different patients in
      the household or for different pairs. Each job is priced, billed to insurance, remade and refunded on
      its own; a charge, credit, remake or guarantee on one job never applies to another, and no multi-pair
      discount exists.
    eligibility: []
    params:
      max_per_customer: null

  - id: optical_agg_discount_stacking
    subject: [optical_charge_posted, optical_credit_posted]
    rule: >
      A job is billed either with the member's vision plan or with the Plus lens discount, never both, because
      insurance_combinable_with_plus_discount is false: when the job's vision_plan is not none the Plus
      discount is not applied, and when it is none the Plus discount applies if optical_msr_plus_on_order_date
      is true. A job belongs to the membership presented on it, and eyewear for a household dependent is
      ordered under the primary member's membership where household_dependents_eligible is true; the patient's
      own membership, if any, has no bearing on the job.
    eligibility:
      - id: one_discount_route
        applies_to: [optical_charge_posted]
        kind: authorization
        condition: when the job's vision_plan is not none the Plus discount is not applied, and when it is none the Plus discount applies if optical_msr_plus_on_order_date is true
        evidence_fields: [optical_holdings.vision_plan, optical_holdings.membership_id, optical_holdings.optical_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_holdings.optical_order_id]
          action_bindings:
            optical_holdings.optical_order_id: optical_order_id
    measures: [optical_msr_plus_on_order_date]
    params:
      per_tier:
        Northgate Single Vision Lenses: {combinable: "=insurance_combinable_with_plus_discount", dependents: "=household_dependents_eligible"}
        Northgate Lined Bifocal Lenses: {combinable: "=insurance_combinable_with_plus_discount", dependents: "=household_dependents_eligible"}
        Northgate Lined Trifocal Lenses: {combinable: "=insurance_combinable_with_plus_discount", dependents: "=household_dependents_eligible"}
        Northgate Standard Progressive Lenses: {combinable: "=insurance_combinable_with_plus_discount", dependents: "=household_dependents_eligible"}
        Northgate Premium Progressive Lenses: {combinable: "=insurance_combinable_with_plus_discount", dependents: "=household_dependents_eligible"}
        Northgate Digital Freeform Progressive Lenses: {combinable: "=insurance_combinable_with_plus_discount", dependents: "=household_dependents_eligible"}

  - id: optical_job_pricing
    subject: [optical_order_placed, optical_charge_posted]
    rule: >
      A job is charged component by component on the order date: base_lenses at base_lens_price_usd; the frame
      at its tagged price; a material_upgrade at the lens design's upgrade price for the lens_material when it
      is not cr39_plastic; anti_reflective_coating at ar_coating_price_usd unless ar_coating_included; and
      photochromic or blue_light_filter at their prices when ordered. Scratch coating and UV protection are
      included where the design's switches say so. When the Plus discount applies under
      optical_agg_discount_stacking, the components in plus_discount_applies_to are charged after
      plus_member_lens_discount_pct, rounded to the cent per component. A lens material is ordered only when
      it is in the design's materials_available. Lenses are fitted only into frames sold by Northgate while
      own_frame_lenses_allowed is false.
    eligibility:
      - id: material_offered
        applies_to: [optical_order_placed]
        kind: authorization
        condition: A lens material is ordered only when it is in the design's materials_available.
        evidence_fields: [optical_holdings.lens_material, optical_holdings.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_holdings.variant_name]
          action_bindings:
            optical_holdings.variant_name: variant_name
    measures: [optical_msr_plus_on_order_date]
    params:
      per_tier:
        Northgate Single Vision Lenses: {lenses: "=base_lens_price_usd", poly: "=polycarbonate_upgrade_usd", trivex: "=trivex_upgrade_usd", hi160: "=high_index_160_upgrade_usd", hi167: "=high_index_167_upgrade_usd", hi174: "=high_index_174_upgrade_usd", ar_included: "=ar_coating_included", ar: "=ar_coating_price_usd", photochromic: "=photochromic_price_usd", blue_light: "=blue_light_filter_price_usd", plus_pct: "=plus_member_lens_discount_pct", plus_applies: "=plus_discount_applies_to", materials: "=materials_available", scratch: "=scratch_coating_included", uv: "=uv_protection_included", own_frame: "=own_frame_lenses_allowed"}
        Northgate Lined Bifocal Lenses: {lenses: "=base_lens_price_usd", poly: "=polycarbonate_upgrade_usd", trivex: "=trivex_upgrade_usd", hi160: "=high_index_160_upgrade_usd", hi167: "=high_index_167_upgrade_usd", hi174: "=high_index_174_upgrade_usd", ar_included: "=ar_coating_included", ar: "=ar_coating_price_usd", photochromic: "=photochromic_price_usd", blue_light: "=blue_light_filter_price_usd", plus_pct: "=plus_member_lens_discount_pct", plus_applies: "=plus_discount_applies_to", materials: "=materials_available", scratch: "=scratch_coating_included", uv: "=uv_protection_included", own_frame: "=own_frame_lenses_allowed"}
        Northgate Lined Trifocal Lenses: {lenses: "=base_lens_price_usd", poly: "=polycarbonate_upgrade_usd", trivex: "=trivex_upgrade_usd", hi160: "=high_index_160_upgrade_usd", hi167: "=high_index_167_upgrade_usd", hi174: "=high_index_174_upgrade_usd", ar_included: "=ar_coating_included", ar: "=ar_coating_price_usd", photochromic: "=photochromic_price_usd", blue_light: "=blue_light_filter_price_usd", plus_pct: "=plus_member_lens_discount_pct", plus_applies: "=plus_discount_applies_to", materials: "=materials_available", scratch: "=scratch_coating_included", uv: "=uv_protection_included", own_frame: "=own_frame_lenses_allowed"}
        Northgate Standard Progressive Lenses: {lenses: "=base_lens_price_usd", poly: "=polycarbonate_upgrade_usd", trivex: "=trivex_upgrade_usd", hi160: "=high_index_160_upgrade_usd", hi167: "=high_index_167_upgrade_usd", hi174: "=high_index_174_upgrade_usd", ar_included: "=ar_coating_included", ar: "=ar_coating_price_usd", photochromic: "=photochromic_price_usd", blue_light: "=blue_light_filter_price_usd", plus_pct: "=plus_member_lens_discount_pct", plus_applies: "=plus_discount_applies_to", materials: "=materials_available", scratch: "=scratch_coating_included", uv: "=uv_protection_included", own_frame: "=own_frame_lenses_allowed"}
        Northgate Premium Progressive Lenses: {lenses: "=base_lens_price_usd", poly: "=polycarbonate_upgrade_usd", trivex: "=trivex_upgrade_usd", hi160: "=high_index_160_upgrade_usd", hi167: "=high_index_167_upgrade_usd", hi174: "=high_index_174_upgrade_usd", ar_included: "=ar_coating_included", ar: "=ar_coating_price_usd", photochromic: "=photochromic_price_usd", blue_light: "=blue_light_filter_price_usd", plus_pct: "=plus_member_lens_discount_pct", plus_applies: "=plus_discount_applies_to", materials: "=materials_available", scratch: "=scratch_coating_included", uv: "=uv_protection_included", own_frame: "=own_frame_lenses_allowed"}
        Northgate Digital Freeform Progressive Lenses: {lenses: "=base_lens_price_usd", poly: "=polycarbonate_upgrade_usd", trivex: "=trivex_upgrade_usd", hi160: "=high_index_160_upgrade_usd", hi167: "=high_index_167_upgrade_usd", hi174: "=high_index_174_upgrade_usd", ar_included: "=ar_coating_included", ar: "=ar_coating_price_usd", photochromic: "=photochromic_price_usd", blue_light: "=blue_light_filter_price_usd", plus_pct: "=plus_member_lens_discount_pct", plus_applies: "=plus_discount_applies_to", materials: "=materials_available", scratch: "=scratch_coating_included", uv: "=uv_protection_included", own_frame: "=own_frame_lenses_allowed"}
    formula:
      lens_charge: round(base_lens_price_usd * (1 - plus_member_lens_discount_pct / 100), 2) if optical_msr_plus_on_order_date and vision_plan == "none" else base_lens_price_usd

  - id: optical_prescription_rules
    subject: [optical_order_placed, optical_lab_submitted]
    rule: >
      A job is ordered only when the order is placed no later than rx_max_age_months calendar months after the
      prescription's issue date. Calendar months are added to the issue date and, when the resulting month has
      no such day, the boundary falls on that month's last day. The prescription's sphere, cylinder and add
      powers must be within the design's max_sphere_power, max_cylinder_power and max_add_power, and the frame's
      fitting height at least min_fitting_height_mm; a prescription outside those limits is ordered in a design
      that accepts it. Where minor_impact_resistant_required is true, eyewear for a patient under 18 is made
      only in polycarbonate or Trivex. The optical counter verifies the prescription with the prescribing
      office before lab submission; a prescription read to member services over the phone is never
      entered by member services.
    eligibility:
      - id: prescription_current
        applies_to: [optical_order_placed]
        kind: time
        condition: A job is ordered only when the order is placed no later than rx_max_age_months calendar months after the prescription's issue date.
        evidence_fields: [optical_holdings.rx_issue_date, optical_holdings.optical_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_holdings.optical_order_id]
          action_bindings:
            optical_holdings.optical_order_id: optical_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the prescription's issue date
          anchor_source: optical_holdings.rx_issue_date
          relation: not_after
          duration_source: variants.rx_max_age_months
          unit: calendar_months
          counting_rule: Calendar months are added to the issue date and, when the resulting month has no such day, the boundary falls on that month's last day.
          boundary: inclusive
    params:
      per_tier:
        Northgate Single Vision Lenses: {rx_age_months: "=rx_max_age_months", sphere: "=max_sphere_power", cylinder: "=max_cylinder_power", add: "=max_add_power", fitting_height: "=min_fitting_height_mm", minors_impact: "=minor_impact_resistant_required", design: "=lens_design"}
        Northgate Lined Bifocal Lenses: {rx_age_months: "=rx_max_age_months", sphere: "=max_sphere_power", cylinder: "=max_cylinder_power", add: "=max_add_power", fitting_height: "=min_fitting_height_mm", minors_impact: "=minor_impact_resistant_required", design: "=lens_design"}
        Northgate Lined Trifocal Lenses: {rx_age_months: "=rx_max_age_months", sphere: "=max_sphere_power", cylinder: "=max_cylinder_power", add: "=max_add_power", fitting_height: "=min_fitting_height_mm", minors_impact: "=minor_impact_resistant_required", design: "=lens_design"}
        Northgate Standard Progressive Lenses: {rx_age_months: "=rx_max_age_months", sphere: "=max_sphere_power", cylinder: "=max_cylinder_power", add: "=max_add_power", fitting_height: "=min_fitting_height_mm", minors_impact: "=minor_impact_resistant_required", design: "=lens_design"}
        Northgate Premium Progressive Lenses: {rx_age_months: "=rx_max_age_months", sphere: "=max_sphere_power", cylinder: "=max_cylinder_power", add: "=max_add_power", fitting_height: "=min_fitting_height_mm", minors_impact: "=minor_impact_resistant_required", design: "=lens_design"}
        Northgate Digital Freeform Progressive Lenses: {rx_age_months: "=rx_max_age_months", sphere: "=max_sphere_power", cylinder: "=max_cylinder_power", add: "=max_add_power", fitting_height: "=min_fitting_height_mm", minors_impact: "=minor_impact_resistant_required", design: "=lens_design"}

  - id: optical_vision_plan_billing
    subject: [optical_credit_posted]
    rule: >
      Northgate Optical bills only the plans in vision_plans_accepted; a plan not on the list is not billed
      and the member pays privately. When the job's vision_plan is a listed plan, the plan's share is posted
      on the order date as credits against the charges it covers: an insurance_allowance credit of the
      base_lenses charge minus the design's vision_plan_lens_copay_usd for that plan (nothing when the copay is
      at least the charge), and an insurance_allowance credit of the frame charge up to the plan's
      vision_plan_frame_allowance_usd. Material upgrades, coatings and options are not covered and are paid
      by the member. Each covered charge receives at most one allowance credit. Plan eligibility,
      authorization numbers and benefit frequency are confirmed by the optical counter with the plan; member
      services cannot check or override a plan's decision.
    eligibility:
      - id: one_allowance_per_charge
        applies_to: [optical_credit_posted]
        kind: dedup
        condition: Each covered charge receives at most one allowance credit.
        evidence_fields: [optical_transactions.source_txn_id, optical_transactions.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_transactions.source_txn_id]
          action_bindings:
            optical_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: optical_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {credit_reason: [insurance_allowance]}
          distinct_fields: []
    params:
      per_tier:
        Northgate Single Vision Lenses: {plans: "=vision_plans_accepted", lens_copay: "=vision_plan_lens_copay_usd", frame_allowance: "=vision_plan_frame_allowance_usd"}
        Northgate Lined Bifocal Lenses: {plans: "=vision_plans_accepted", lens_copay: "=vision_plan_lens_copay_usd", frame_allowance: "=vision_plan_frame_allowance_usd"}
        Northgate Lined Trifocal Lenses: {plans: "=vision_plans_accepted", lens_copay: "=vision_plan_lens_copay_usd", frame_allowance: "=vision_plan_frame_allowance_usd"}
        Northgate Standard Progressive Lenses: {plans: "=vision_plans_accepted", lens_copay: "=vision_plan_lens_copay_usd", frame_allowance: "=vision_plan_frame_allowance_usd"}
        Northgate Premium Progressive Lenses: {plans: "=vision_plans_accepted", lens_copay: "=vision_plan_lens_copay_usd", frame_allowance: "=vision_plan_frame_allowance_usd"}
        Northgate Digital Freeform Progressive Lenses: {plans: "=vision_plans_accepted", lens_copay: "=vision_plan_lens_copay_usd", frame_allowance: "=vision_plan_frame_allowance_usd"}

  - id: optical_remake_guarantees
    subject: [optical_remake_opened, optical_lens_design_changed, optical_charge_posted, optical_credit_posted]
    rule: >
      A remake is opened only on dispensed eyewear and every remake posts a remake_charge entry carrying its
      remake_number and remake_reason — 0.00 when a guarantee covers it. A job is remade at most
      max_remakes_total times. A non_adapt remake is free only when it is requested no later than
      non_adapt_window_days calendar days after the dispensed date of the job. Days are counted as calendar
      days, the dispensed date being day 0. A job gets at most non_adapt_remakes_allowed free non_adapt
      remakes, counted by optical_msr_remakes_for_reason. Where non_adapt_switch_allowed is true the non_adapt
      remake may switch to another lens design: when the new design's base_lens_price_usd is lower the
      difference on the base_lenses charge is credited as a return_refund, and when it is higher the member
      pays the difference as the remake charge. A prescription_change remake is free only when the prescribing
      doctor changed the prescription and it is requested within rx_change_remake_window_days calendar days of
      the dispensed date, at most rx_change_remakes_allowed times. A lab_defect or frame_defect remake is free
      within lab_defect_window_months and frame_warranty_months of dispensing where lab_defect_remake_free is
      true, and a coating defect within coating_warranty_months. An accidental_damage remake is available only
      within accidental_damage_coverage_months, at most accidental_damage_replacements_allowed times, for
      accidental_damage_charge_pct of the job's frame and base_lenses charges. Any other remake, or one past
      its window or count, costs remake_charge_pct_outside_coverage of the job's base_lenses price. The
      dispensed date never moves with a remake.
    eligibility:
      - id: non_adapt_window
        applies_to: [optical_remake_opened]
        kind: time
        condition: A non_adapt remake is free only when it is requested no later than non_adapt_window_days calendar days after the dispensed date of the job.
        evidence_fields: [optical_holdings.dispensed_date, optical_holdings.optical_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_holdings.optical_order_id]
          action_bindings:
            optical_holdings.optical_order_id: optical_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the dispensed date of the job
          anchor_source: optical_holdings.dispensed_date
          relation: not_after
          duration_source: variants.non_adapt_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the dispensed date being day 0.
          boundary: inclusive
      - id: non_adapt_count
        applies_to: [optical_remake_opened]
        kind: authorization
        condition: A job gets at most non_adapt_remakes_allowed free non_adapt remakes, counted by optical_msr_remakes_for_reason.
        evidence_fields: [optical_transactions.optical_order_id, optical_transactions.remake_reason, optical_transactions.charge_component]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_transactions.optical_order_id]
          action_bindings:
            optical_transactions.optical_order_id: optical_order_id
      - id: total_remake_limit
        applies_to: [optical_remake_opened]
        kind: authorization
        condition: A job is remade at most max_remakes_total times.
        evidence_fields: [optical_holdings.remake_count, optical_holdings.optical_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_holdings.optical_order_id]
          action_bindings:
            optical_holdings.optical_order_id: optical_order_id
    measures: [optical_msr_remakes_for_reason]
    params:
      per_tier:
        Northgate Single Vision Lenses: {non_adapt_days: "=non_adapt_window_days", non_adapt_count: "=non_adapt_remakes_allowed", switch: "=non_adapt_switch_allowed", rx_change_days: "=rx_change_remake_window_days", rx_change_count: "=rx_change_remakes_allowed", lab_free: "=lab_defect_remake_free", lab_months: "=lab_defect_window_months", frame_months: "=frame_warranty_months", coating_months: "=coating_warranty_months", accident_months: "=accidental_damage_coverage_months", accident_pct: "=accidental_damage_charge_pct", accident_count: "=accidental_damage_replacements_allowed", outside_pct: "=remake_charge_pct_outside_coverage", max_total: "=max_remakes_total"}
        Northgate Lined Bifocal Lenses: {non_adapt_days: "=non_adapt_window_days", non_adapt_count: "=non_adapt_remakes_allowed", switch: "=non_adapt_switch_allowed", rx_change_days: "=rx_change_remake_window_days", rx_change_count: "=rx_change_remakes_allowed", lab_free: "=lab_defect_remake_free", lab_months: "=lab_defect_window_months", frame_months: "=frame_warranty_months", coating_months: "=coating_warranty_months", accident_months: "=accidental_damage_coverage_months", accident_pct: "=accidental_damage_charge_pct", accident_count: "=accidental_damage_replacements_allowed", outside_pct: "=remake_charge_pct_outside_coverage", max_total: "=max_remakes_total"}
        Northgate Lined Trifocal Lenses: {non_adapt_days: "=non_adapt_window_days", non_adapt_count: "=non_adapt_remakes_allowed", switch: "=non_adapt_switch_allowed", rx_change_days: "=rx_change_remake_window_days", rx_change_count: "=rx_change_remakes_allowed", lab_free: "=lab_defect_remake_free", lab_months: "=lab_defect_window_months", frame_months: "=frame_warranty_months", coating_months: "=coating_warranty_months", accident_months: "=accidental_damage_coverage_months", accident_pct: "=accidental_damage_charge_pct", accident_count: "=accidental_damage_replacements_allowed", outside_pct: "=remake_charge_pct_outside_coverage", max_total: "=max_remakes_total"}
        Northgate Standard Progressive Lenses: {non_adapt_days: "=non_adapt_window_days", non_adapt_count: "=non_adapt_remakes_allowed", switch: "=non_adapt_switch_allowed", rx_change_days: "=rx_change_remake_window_days", rx_change_count: "=rx_change_remakes_allowed", lab_free: "=lab_defect_remake_free", lab_months: "=lab_defect_window_months", frame_months: "=frame_warranty_months", coating_months: "=coating_warranty_months", accident_months: "=accidental_damage_coverage_months", accident_pct: "=accidental_damage_charge_pct", accident_count: "=accidental_damage_replacements_allowed", outside_pct: "=remake_charge_pct_outside_coverage", max_total: "=max_remakes_total"}
        Northgate Premium Progressive Lenses: {non_adapt_days: "=non_adapt_window_days", non_adapt_count: "=non_adapt_remakes_allowed", switch: "=non_adapt_switch_allowed", rx_change_days: "=rx_change_remake_window_days", rx_change_count: "=rx_change_remakes_allowed", lab_free: "=lab_defect_remake_free", lab_months: "=lab_defect_window_months", frame_months: "=frame_warranty_months", coating_months: "=coating_warranty_months", accident_months: "=accidental_damage_coverage_months", accident_pct: "=accidental_damage_charge_pct", accident_count: "=accidental_damage_replacements_allowed", outside_pct: "=remake_charge_pct_outside_coverage", max_total: "=max_remakes_total"}
        Northgate Digital Freeform Progressive Lenses: {non_adapt_days: "=non_adapt_window_days", non_adapt_count: "=non_adapt_remakes_allowed", switch: "=non_adapt_switch_allowed", rx_change_days: "=rx_change_remake_window_days", rx_change_count: "=rx_change_remakes_allowed", lab_free: "=lab_defect_remake_free", lab_months: "=lab_defect_window_months", frame_months: "=frame_warranty_months", coating_months: "=coating_warranty_months", accident_months: "=accidental_damage_coverage_months", accident_pct: "=accidental_damage_charge_pct", accident_count: "=accidental_damage_replacements_allowed", outside_pct: "=remake_charge_pct_outside_coverage", max_total: "=max_remakes_total"}
    formula:
      outside_coverage_charge: round(base_lens_price_usd * remake_charge_pct_outside_coverage / 100, 2)

  - id: optical_cancellation
    subject: [optical_order_cancelled, optical_credit_posted]
    rule: >
      A job not yet submitted to the lab is cancelled with every charge credited in full as a
      cancellation_refund where cancellation_before_lab_full_refund is true. A job cancelled while in the lab
      keeps in_lab_cancellation_retained_pct of optical_msr_original_lens_charges, because the lenses are
      already being cut to the prescription; the frame, which returns to stock, and the rest of the lens
      charges are credited. Every refund credit is posted against the exact charge it returns and never
      exceeds that charge's optical_msr_charge_net, so a vision plan allowance already credited is not
      refunded to the member a second time. Ready or dispensed eyewear is not cancelled; it is returned under
      optical_satisfaction_returns.
    eligibility: []
    measures: [optical_msr_original_lens_charges, optical_msr_charge_net]
    params:
      per_tier:
        Northgate Single Vision Lenses: {before_lab_full: "=cancellation_before_lab_full_refund", in_lab_retained_pct: "=in_lab_cancellation_retained_pct"}
        Northgate Lined Bifocal Lenses: {before_lab_full: "=cancellation_before_lab_full_refund", in_lab_retained_pct: "=in_lab_cancellation_retained_pct"}
        Northgate Lined Trifocal Lenses: {before_lab_full: "=cancellation_before_lab_full_refund", in_lab_retained_pct: "=in_lab_cancellation_retained_pct"}
        Northgate Standard Progressive Lenses: {before_lab_full: "=cancellation_before_lab_full_refund", in_lab_retained_pct: "=in_lab_cancellation_retained_pct"}
        Northgate Premium Progressive Lenses: {before_lab_full: "=cancellation_before_lab_full_refund", in_lab_retained_pct: "=in_lab_cancellation_retained_pct"}
        Northgate Digital Freeform Progressive Lenses: {before_lab_full: "=cancellation_before_lab_full_refund", in_lab_retained_pct: "=in_lab_cancellation_retained_pct"}
    formula:
      retained_lens_amount: round(optical_msr_original_lens_charges * in_lab_cancellation_retained_pct / 100, 2)

  - id: optical_satisfaction_returns
    subject: [optical_order_returned, optical_credit_posted]
    rule: >
      Dispensed eyewear may be returned for a refund. A return is accepted only when it is requested no later
      than satisfaction_return_window_days calendar days after the dispensed date of the job. Days are counted
      as calendar days, the dispensed date being day 0. A return refunds the optical_msr_charge_net of every
      lens, option and remake charge and, where return_refund_includes_frame is true, of the frame, each as a
      return_refund credit against its own charge, to the member's original tender. After the window the
      eyewear is not refundable and problems are handled only under optical_remake_guarantees.
    eligibility:
      - id: satisfaction_window
        applies_to: [optical_order_returned]
        kind: time
        condition: A return is accepted only when it is requested no later than satisfaction_return_window_days calendar days after the dispensed date of the job.
        evidence_fields: [optical_holdings.dispensed_date, optical_holdings.optical_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_holdings.optical_order_id]
          action_bindings:
            optical_holdings.optical_order_id: optical_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the dispensed date of the job
          anchor_source: optical_holdings.dispensed_date
          relation: not_after
          duration_source: variants.satisfaction_return_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the dispensed date being day 0.
          boundary: inclusive
    measures: [optical_msr_charge_net]
    params:
      per_tier:
        Northgate Single Vision Lenses: {window_days: "=satisfaction_return_window_days", frame_refunded: "=return_refund_includes_frame"}
        Northgate Lined Bifocal Lenses: {window_days: "=satisfaction_return_window_days", frame_refunded: "=return_refund_includes_frame"}
        Northgate Lined Trifocal Lenses: {window_days: "=satisfaction_return_window_days", frame_refunded: "=return_refund_includes_frame"}
        Northgate Standard Progressive Lenses: {window_days: "=satisfaction_return_window_days", frame_refunded: "=return_refund_includes_frame"}
        Northgate Premium Progressive Lenses: {window_days: "=satisfaction_return_window_days", frame_refunded: "=return_refund_includes_frame"}
        Northgate Digital Freeform Progressive Lenses: {window_days: "=satisfaction_return_window_days", frame_refunded: "=return_refund_includes_frame"}

  - id: optical_dispensing_care
    subject: [optical_lab_submitted, optical_ready, optical_dispensed]
    rule: >
      The optical counter submits a verified job to the lab, and the eyewear is dispensed only by an optician
      who fits it on the patient; eyewear is never shipped. Frame adjustments and nose pad replacements are free
      for the life of the eyewear where free_adjustments is true. A frame that breaks from a manufacturing
      defect within frame_warranty_months of dispensing is replaced through a frame_defect remake. Lab status
      questions are answered from the job's status; member services cannot expedite a lab.
    eligibility: []
    params:
      per_tier:
        Northgate Single Vision Lenses: {adjustments: "=free_adjustments", frame_warranty: "=frame_warranty_months"}
        Northgate Lined Bifocal Lenses: {adjustments: "=free_adjustments", frame_warranty: "=frame_warranty_months"}
        Northgate Lined Trifocal Lenses: {adjustments: "=free_adjustments", frame_warranty: "=frame_warranty_months"}
        Northgate Standard Progressive Lenses: {adjustments: "=free_adjustments", frame_warranty: "=frame_warranty_months"}
        Northgate Premium Progressive Lenses: {adjustments: "=free_adjustments", frame_warranty: "=frame_warranty_months"}
        Northgate Digital Freeform Progressive Lenses: {adjustments: "=free_adjustments", frame_warranty: "=frame_warranty_months"}

  - id: optical_reward_flag
    subject: [optical_charge_posted]
    rule: >
      An optical charge is reward_eligible only when its charge_component is in reward_eligible_components and
      the membership on the job is held at a tier with a non-zero Annual Reward rate on the charge date;
      remake charges never earn. Credits against a charge copy its flag, so allowances and refunds take back
      the reward the charge earned.
    eligibility: []
    params:
      per_tier:
        Northgate Single Vision Lenses: {earning_components: "=reward_eligible_components"}
        Northgate Lined Bifocal Lenses: {earning_components: "=reward_eligible_components"}
        Northgate Lined Trifocal Lenses: {earning_components: "=reward_eligible_components"}
        Northgate Standard Progressive Lenses: {earning_components: "=reward_eligible_components"}
        Northgate Premium Progressive Lenses: {earning_components: "=reward_eligible_components"}
        Northgate Digital Freeform Progressive Lenses: {earning_components: "=reward_eligible_components"}
