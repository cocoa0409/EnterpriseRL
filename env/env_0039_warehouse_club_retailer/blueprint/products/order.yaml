events:
  - type: order_placed
    target: order_holdings
    mutation: create
    meaning: A purchase is rung up at a register or an order is placed on a Northgate channel.
    grain: one row per receipt or order number
    fields:
      customer_id: the member making the purchase
      membership_id: the membership whose card was presented
      variant_name: the purchase channel
      status: always placed on creation
      receipt_number: the receipt or order number
      club_number: the club that rang up or fulfills the purchase
      order_date: the date of the purchase or order
      tender: the primary tender
      net_paid_amount: starts at 0.00 and follows the net_paid account
    triggers:
      - event: order:order_line_sold
        map: {event_date: order_date}

  - type: order_fulfilled
    target: order_holdings
    mutation: {transition: {from: placed, to: fulfilled}}
    meaning: The member receives the merchandise of the purchase.
    grain: one row per purchase fulfilled
    fields:
      status: becomes fulfilled
      fulfilled_date: the date the merchandise was received
    triggers: []

  - type: order_cancelled
    target: order_holdings
    mutation: {transition: {from: placed, to: cancelled}}
    meaning: An order that has not been fulfilled is cancelled and refunded in full.
    grain: one row per order cancelled
    fields:
      status: becomes cancelled
      closed_date: the cancellation date
    triggers:
      - event: order:order_line_returned
        map: {return_reason: order_cancelled}

  - type: order_partially_returned
    target: order_holdings
    mutation: {transition: {from: fulfilled, to: partially_returned}}
    meaning: A refund leaves some, but not all, sold units of the purchase refunded.
    grain: one row per purchase reaching partial return
    fields:
      status: becomes partially_returned
    triggers: []

  - type: order_fully_returned
    target: order_holdings
    mutation: {transition: [{from: fulfilled, to: fully_returned}, {from: partially_returned, to: fully_returned}]}
    meaning: A refund leaves every sold unit of the purchase refunded.
    grain: one row per purchase reaching full return
    fields:
      status: becomes fully_returned
      closed_date: the date of the refund that completed the return
    triggers: []

  - type: order_line_sold
    target: order_lines
    meaning: One item is sold on the purchase.
    grain: one row per item number and unit price on one purchase
    distinguish_by: [item_number, unit_price]
    fields:
      item_number: the item sold
      item_description: the receipt description
      merchandise_class: the item's merchandise class
      quantity: units sold
      unit_price: member price per unit after any Instant Savings at the register
      line_amount: quantity x unit_price
      event_date: the date of the sale
      reward_eligible: whether the line earns Annual Reward
    account: net_paid
    direction: in
    triggers:
      - event: membership:membership_reward_accrued
        when: {reward_eligible: true}
        map: {basis_amount: line_amount, source_category: order, source_ref_id: order_line_id, transaction_date: event_date}

  - type: order_line_returned
    target: order_lines
    meaning: Units of one sale line are refunded — returned at a club, received back on a return authorization, refunded without return, or refunded because the order was cancelled.
    grain: one row per refund of some units of one sale line on one date
    distinguish_by: [source_order_line_id, event_date, quantity]
    fields:
      item_number: the item refunded
      merchandise_class: the item's merchandise class
      quantity: units refunded
      unit_price: the per-unit refund
      line_amount: quantity x unit_price
      event_date: the date of the refund
      source_order_line_id: the sale line refunded
      return_reason: why the units were refunded
      reward_eligible: copied from the sale line
    account: net_paid
    direction: out
    triggers:
      - event: membership:membership_reward_reversed
        when: {reward_eligible: true}
        map: {basis_amount: line_amount, source_category: order, source_ref_id: order_line_id, transaction_date: event_date}

  - type: order_price_adjusted
    target: order_lines
    meaning: The difference between the price paid and a lower qualifying price is credited on one sale line.
    grain: one row per adjustment of one sale line
    distinguish_by: [source_order_line_id, item_price_id]
    fields:
      item_number: the item adjusted
      quantity: units adjusted
      unit_price: the credit per unit
      line_amount: quantity x unit_price
      event_date: the date of the adjustment
      source_order_line_id: the sale line adjusted
      adjustment_type: price_adjustment or instant_savings
      item_price_id: the lower price record the credit is computed from
      reward_eligible: copied from the sale line
    account: net_paid
    direction: out
    triggers:
      - event: membership:membership_reward_reversed
        when: {reward_eligible: true}
        map: {basis_amount: line_amount, source_category: order, source_ref_id: order_line_id, transaction_date: event_date}

  - type: order_rebate_credited
    target: order_lines
    meaning: A manufacturer mail-in rebate on one sale line is approved and paid on a Northgate Shop Card.
    grain: one row per rebate offer paid on one sale line
    distinguish_by: [source_order_line_id, item_price_id]
    fields:
      item_number: the item the rebate is for
      quantity: units rebated
      unit_price: the rebate per unit from the offer
      line_amount: quantity x unit_price
      event_date: the date the rebate was credited
      source_order_line_id: the sale line rebated
      adjustment_type: always manufacturer_rebate
      item_price_id: the mail-in rebate offer record
    account: net_paid
    direction: out
    triggers: []

  - type: order_fee_charged
    target: order_lines
    meaning: An order-level fee is charged — delivery fee, non-member surcharge, restocking fee or changed-mind freight pickup fee.
    grain: one row per fee type per triggering occasion on one purchase
    distinguish_by: [fee_type, event_date, source_order_line_id]
    fields:
      fee_type: the fee charged
      quantity: always 1
      unit_price: the fee amount
      line_amount: the fee amount
      event_date: the date the fee was charged
      source_order_line_id: for restocking and pickup fees, the sale line being returned; empty for delivery fee and surcharge
    account: net_paid
    direction: in
    triggers: []

  - type: order_fee_refunded
    target: order_lines
    meaning: A previously charged order-level fee is refunded.
    grain: one row per refund of one fee entry
    distinguish_by: [source_order_line_id]
    fields:
      fee_type: the fee refunded
      quantity: always 1
      unit_price: the refund amount
      line_amount: the refund amount
      event_date: the date of the refund
      source_order_line_id: the fee entry being refunded
    account: net_paid
    direction: out
    triggers: []

measures:
  - id: order_msr_sale_unit_price
    window: the sale line referenced by source_order_line_id
    measure: the unit_price of that order_line_sold entry
  - id: order_msr_units_refunded_on_line
    window: the life of one sale line
    measure: sum of quantity over order_line_returned entries whose source_order_line_id is that sale line
  - id: order_msr_units_kept_on_line
    window: the life of one sale line
    measure: the sale line's quantity minus order_msr_units_refunded_on_line
  - id: order_msr_adjusted_unit_credit
    window: the life of one sale line
    measure: sum of unit_price over order_price_adjusted entries whose source_order_line_id is that sale line (the per-unit credit already granted)
  - id: order_msr_rebated_unit_credit
    window: the life of one sale line
    measure: sum of unit_price over order_rebate_credited entries whose source_order_line_id is that sale line (the per-unit rebate already paid)
  - id: order_msr_adjustments_on_line
    window: the life of one sale line
    measure: count of order_price_adjusted entries whose source_order_line_id is that sale line
  - id: order_msr_lowest_qualifying_price
    window: from the day after the sale line's event_date through the earlier of the frozen date and the last day of the price adjustment window
    measure: the lowest unit_price among item_price_history records for the sale line's item_number, on the purchase's channel, with price_type regular or instant_savings (and clearance only where clearance_price_adjustable is true), whose start_date to end_date period overlaps the window
  - id: order_msr_promotion_units_remaining
    window: the period of the instant_savings record that sets order_msr_lowest_qualifying_price
    measure: that record's member_limit minus units already sold at that promotion price or adjusted to it on any purchase of the same membership; unlimited when member_limit is 0 or the lowest price is a regular price
  - id: order_msr_merchandise_total
    window: one purchase
    measure: sum of line_amount over the purchase's order_line_sold entries
  - id: order_msr_plus_presented
    window: one purchase, on its order_date
    measure: true when the membership on the purchase was held at Northgate Club Plus Membership or Northgate Business Plus Membership on the order date
  - id: order_msr_member_active_on_order_date
    window: one purchase, on its order_date
    measure: true when the membership on the purchase had status active on the order date
  - id: order_msr_changed_mind_returns_365d
    window: rolling 365 calendar days ending on the frozen date, across every purchase carrying the same membership_id
    measure: count of order_line_returned entries with return_reason changed_mind
  - id: order_msr_changed_mind_value_365d
    window: rolling 365 calendar days ending on the frozen date, across every purchase carrying the same membership_id
    measure: sum of line_amount over order_line_returned entries with return_reason changed_mind
  - id: order_msr_returnless_claims_365d
    window: rolling 365 calendar days ending on the frozen date, across every purchase carrying the same membership_id
    measure: count of order_line_returned entries with return_reason not_received or damaged_in_transit that have no return authorization in status received for their sale line

policies:
  - id: order_agg_multi_holding
    subject: [order_placed]
    rule: >
      A member may hold any number of purchases on any channels; every purchase is its own record with its own
      lines, and nothing on one purchase — refunds, adjustments, rebates or fees — is ever booked against
      another. A purchase on a channel whose membership_required_for_purchase is true is accepted only when
      the membership presented has status active on the order date. On a channel whose
      membership_required_for_purchase is false the purchase is accepted whatever the membership status, and
      the nonmember_surcharge_pct applies when order_msr_member_active_on_order_date is false. A channel with
      business_segment_required accepts only a business-segment membership.
    eligibility:
      - id: membership_active_for_channel
        applies_to: [order_placed]
        kind: authorization
        condition: A purchase on a channel whose membership_required_for_purchase is true is accepted only when the membership presented has status active on the order date.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
    params:
      max_per_customer: null

  - id: order_agg_return_review
    subject: [order_line_returned]
    rule: >
      Returns are reviewed across all purchases of a membership, not purchase by purchase. A changed_mind
      return is refunded by member services only while order_msr_changed_mind_returns_365d is below
      changed_mind_returns_review_count and order_msr_changed_mind_value_365d is below
      changed_mind_returns_review_value_usd. Once either measure reaches its threshold, further changed_mind
      returns on that membership are decided by the club's membership office, not by member services; returns
      for defective, not_as_described, damaged_in_transit, missing_parts or not_received merchandise and
      cancellation refunds are never held by this review. When a refunded sale line is covered by an active
      Northgate Care protection plan, the plan is refunded under the protection charter's own rule; the
      merchandise refund here is not reduced for it.
    eligibility:
      - id: changed_mind_review_threshold
        applies_to: [order_line_returned]
        kind: authorization
        condition: A changed_mind return is refunded by member services only while order_msr_changed_mind_returns_365d is below changed_mind_returns_review_count and order_msr_changed_mind_value_365d is below changed_mind_returns_review_value_usd.
        evidence_fields: [order_lines.return_reason, order_lines.event_date, order_lines.line_amount, order_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.membership_id]
          action_bindings:
            order_holdings.membership_id: membership_id
    measures: [order_msr_changed_mind_returns_365d, order_msr_changed_mind_value_365d]
    params:
      changed_mind_returns_review_count: 18
      changed_mind_returns_review_value_usd: 2500.00

  - id: order_channel_fulfillment
    subject: [order_placed, order_fulfilled, order_cancelled]
    rule: >
      Each channel sells everything except its channel_excluded_classes and accepts an order only when
      order_msr_merchandise_total reaches order_minimum_usd. An in-club purchase taken away by the member is fulfilled at the register
      on its order date, while an in-club purchase or special order whose merchandise is booked for a Northgate
      delivery appointment is fulfilled on the date that delivery is completed. A club pickup order is held at the club for pickup_hold_days calendar days after the
      order date and, if still uncollected, is cancelled and refunded in full; where alternate_pickup_allowed
      is true, a person the member names on the order may collect it with photo ID. On a channel with
      third_party_fulfillment, the delivery partner shops, delivers and handles substitutions, missing items
      and delivery problems on its own app — member services cannot change, cancel or credit those orders, and
      their merchandise can only be returned at a club counter. The fulfillment date is the date recorded when
      the member received the merchandise and is the anchor of every window in this charter.
    eligibility: []
    params:
      per_tier:
        Northgate In-Club Purchase: {excluded: "=channel_excluded_classes", minimum: "=order_minimum_usd", hold_days: "=pickup_hold_days", alternate_pickup: "=alternate_pickup_allowed", partner: "=third_party_fulfillment", business_only: "=business_segment_required"}
        Northgate Club Pickup Order: {excluded: "=channel_excluded_classes", minimum: "=order_minimum_usd", hold_days: "=pickup_hold_days", alternate_pickup: "=alternate_pickup_allowed", partner: "=third_party_fulfillment", business_only: "=business_segment_required"}
        Northgate Same-Day Delivery Order: {excluded: "=channel_excluded_classes", minimum: "=order_minimum_usd", hold_days: "=pickup_hold_days", alternate_pickup: "=alternate_pickup_allowed", partner: "=third_party_fulfillment", business_only: "=business_segment_required"}
        Northgate.com Ship-to-Home Order: {excluded: "=channel_excluded_classes", minimum: "=order_minimum_usd", hold_days: "=pickup_hold_days", alternate_pickup: "=alternate_pickup_allowed", partner: "=third_party_fulfillment", business_only: "=business_segment_required"}
        Northgate Business Delivery Order: {excluded: "=channel_excluded_classes", minimum: "=order_minimum_usd", hold_days: "=pickup_hold_days", alternate_pickup: "=alternate_pickup_allowed", partner: "=third_party_fulfillment", business_only: "=business_segment_required"}
        Northgate Special Order: {excluded: "=channel_excluded_classes", minimum: "=order_minimum_usd", hold_days: "=pickup_hold_days", alternate_pickup: "=alternate_pickup_allowed", partner: "=third_party_fulfillment", business_only: "=business_segment_required"}
    measures: [order_msr_merchandise_total]

  - id: order_cancellation
    subject: [order_cancelled, order_line_returned, order_fee_refunded]
    rule: >
      Member services cancels an order only on a channel where cancellation_allowed is true and only while
      the order has not been fulfilled. A not-yet-fulfilled order is cancelled only when the member asks no
      later than cancellation_cutoff_days calendar days after the order date, on channels whose
      cancellation_cutoff_days is not zero. Days are counted as calendar days, the order date being day 0. A
      channel whose cancellation_cutoff_days is zero can be cancelled at any time before fulfillment. After the
      cutoff the order is delivered and the member may return it under order_returns, where a Special Order's
      restocking and pickup fees apply. A cancellation refunds every sale line in full with return_reason
      order_cancelled, at the sale unit_price, together with every fee charged on the order, each fee by its
      own fee refund entry. A cancellation is never partial: removing some lines from an unfulfilled order is
      not offered.
    eligibility:
      - id: cancellation_cutoff
        applies_to: [order_cancelled]
        kind: time
        condition: A not-yet-fulfilled order is cancelled only when the member asks no later than cancellation_cutoff_days calendar days after the order date, on channels whose cancellation_cutoff_days is not zero.
        evidence_fields: [order_holdings.order_date, order_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.order_id]
          action_bindings:
            order_holdings.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the order date
          anchor_source: order_holdings.order_date
          relation: not_after
          duration_source: variants.cancellation_cutoff_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the order date being day 0.
          boundary: inclusive
    params:
      per_tier:
        Northgate In-Club Purchase: {cancellable: "=cancellation_allowed", cutoff_days: "=cancellation_cutoff_days"}
        Northgate Club Pickup Order: {cancellable: "=cancellation_allowed", cutoff_days: "=cancellation_cutoff_days"}
        Northgate Same-Day Delivery Order: {cancellable: "=cancellation_allowed", cutoff_days: "=cancellation_cutoff_days"}
        Northgate.com Ship-to-Home Order: {cancellable: "=cancellation_allowed", cutoff_days: "=cancellation_cutoff_days"}
        Northgate Business Delivery Order: {cancellable: "=cancellation_allowed", cutoff_days: "=cancellation_cutoff_days"}
        Northgate Special Order: {cancellable: "=cancellation_allowed", cutoff_days: "=cancellation_cutoff_days"}

  - id: order_returns
    subject: [order_line_returned, order_partially_returned, order_fully_returned, order_fee_charged, order_fee_refunded]
    rule: >
      Merchandise is returnable for a refund except classes in non_returnable_classes. A return refund is
      posted only on a purchase whose status is fulfilled or partially_returned, or as a cancellation refund
      on a purchase whose status is cancelled. A return is accepted only when it is requested no later than
      the effective return window in calendar days after the fulfillment date of the purchase. Days are
      counted as calendar days, the fulfillment date being day 0; the effective return window is
      channel_return_window_override_days when it is not zero and otherwise the line's class window in
      return_window_days_by_class, and a class window of no_limit never closes. The request date is the
      requested_date of the return authorization, or the day the merchandise is handed in at a club counter.
      A defect first reported after the window is directed to post_window_defect_route, never refunded.
      Merchandise from a channel with return_at_any_club can be handed in at any club counter, where the
      refund posts at the counter; member services opens a return authorization only on a channel whose
      return_methods_allowed is not empty, choosing freight_pickup for freight_pickup_classes and the
      member's choice of the other listed methods otherwise. The authorization is recorded as submitted and
      takes effect when the member confirms it; the merchandise must reach the carrier within rma_ship_by_days
      calendar days of confirmation or the authorization is withdrawn. A refund for merchandise that must come
      back is posted only after the return authorization for that sale line shows status received. Units
      already refunded on a sale line are never refunded again: a return covers at most
      order_msr_units_kept_on_line units. Each returned unit is refunded at order_msr_sale_unit_price, less
      the per-unit price adjustment already credited when returned_units_reprice_adjusted is true, and less
      order_msr_rebated_unit_credit when a mail-in rebate was paid on the line. Television,
      computer_tablet, cell_phone and camera_drone returns must include every accessory where
      electronics_accessories_required is true, or the returns center refuses them. A changed_mind return on a
      channel with a restocking_fee_pct is charged that percentage of the refund as a restocking_fee entry,
      and a changed_mind freight pickup is charged changed_mind_pickup_fee_usd as a return_pickup_fee entry;
      neither is charged for a reason in restocking_fee_waived_reasons. The refund goes to the purchase's
      tender, or to a Northgate Shop Card when that tender is in refund_to_shop_card_tenders. The
      non-member surcharge on a returned line is refunded with it where nonmember_surcharge_refunded_with_line
      is true, and the delivery fee is refunded when the purchase ends fully returned and every refund on it
      carried a reason in delivery_fee_refund_reasons. Where exchanges_allowed is true an even exchange of
      the same item is made at a club counter without a refund. After each refund the purchase becomes
      partially_returned while any sold unit remains unrefunded and fully_returned when none does.
    eligibility:
      - id: return_status
        applies_to: [order_line_returned]
        kind: state
        condition: A return refund is posted only on a purchase whose status is fulfilled or partially_returned, or as a cancellation refund on a purchase whose status is cancelled.
        evidence_fields: [order_holdings.status, order_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.order_id]
          action_bindings:
            order_holdings.order_id: order_id
        state_contract:
          field: order_holdings.status
          allowed: [fulfilled, partially_returned, cancelled]
      - id: return_window
        applies_to: [order_line_returned]
        kind: time
        condition: A return is accepted only when it is requested no later than the effective return window in calendar days after the fulfillment date of the purchase.
        evidence_fields: [order_holdings.fulfilled_date, order_lines.merchandise_class, order_return_authorizations.requested_date, order_lines.order_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_lines.order_line_id]
          action_bindings:
            order_lines.order_line_id: source_order_line_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the fulfillment date of the purchase
          anchor_source: order_holdings.fulfilled_date
          relation: not_after
          duration_source: variants.return_window_days_by_class
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the fulfillment date being day 0; the effective return window is channel_return_window_override_days when it is not zero and otherwise the line's class window in return_window_days_by_class, and a class window of no_limit never closes.
          boundary: inclusive
      - id: authorization_received
        applies_to: [order_line_returned]
        kind: state
        condition: A refund for merchandise that must come back is posted only after the return authorization for that sale line shows status received.
        evidence_fields: [order_return_authorizations.status, order_return_authorizations.order_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_return_authorizations.order_line_id]
          action_bindings:
            order_return_authorizations.order_line_id: source_order_line_id
        state_contract:
          field: order_return_authorizations.status
          allowed: [received]
      - id: no_double_refund
        applies_to: [order_line_returned]
        kind: dedup
        condition: Units already refunded on a sale line are never refunded again
        evidence_fields: [order_lines.source_order_line_id, order_lines.event_type, order_lines.quantity]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_lines.source_order_line_id]
          action_bindings:
            order_lines.source_order_line_id: source_order_line_id
        dedup_contract:
          table: order_lines
          mode: separate_record
          object_bindings: {source_order_line_id: source_order_line_id}
          duplicate_filters: {event_type: [order_line_returned]}
          distinct_fields: [event_date, quantity]
    measures: [order_msr_sale_unit_price, order_msr_units_refunded_on_line, order_msr_units_kept_on_line, order_msr_adjusted_unit_credit, order_msr_rebated_unit_credit]
    params:
      per_tier:
        Northgate In-Club Purchase: {window_by_class: "=return_window_days_by_class", window_override: "=channel_return_window_override_days", methods: "=return_methods_allowed", restocking_pct: "=restocking_fee_pct", pickup_fee: "=changed_mind_pickup_fee_usd", any_club: "=return_at_any_club", ship_by_days: "=rma_ship_by_days"}
        Northgate Club Pickup Order: {window_by_class: "=return_window_days_by_class", window_override: "=channel_return_window_override_days", methods: "=return_methods_allowed", restocking_pct: "=restocking_fee_pct", pickup_fee: "=changed_mind_pickup_fee_usd", any_club: "=return_at_any_club", ship_by_days: "=rma_ship_by_days"}
        Northgate Same-Day Delivery Order: {window_by_class: "=return_window_days_by_class", window_override: "=channel_return_window_override_days", methods: "=return_methods_allowed", restocking_pct: "=restocking_fee_pct", pickup_fee: "=changed_mind_pickup_fee_usd", any_club: "=return_at_any_club", ship_by_days: "=rma_ship_by_days"}
        Northgate.com Ship-to-Home Order: {window_by_class: "=return_window_days_by_class", window_override: "=channel_return_window_override_days", methods: "=return_methods_allowed", restocking_pct: "=restocking_fee_pct", pickup_fee: "=changed_mind_pickup_fee_usd", any_club: "=return_at_any_club", ship_by_days: "=rma_ship_by_days"}
        Northgate Business Delivery Order: {window_by_class: "=return_window_days_by_class", window_override: "=channel_return_window_override_days", methods: "=return_methods_allowed", restocking_pct: "=restocking_fee_pct", pickup_fee: "=changed_mind_pickup_fee_usd", any_club: "=return_at_any_club", ship_by_days: "=rma_ship_by_days"}
        Northgate Special Order: {window_by_class: "=return_window_days_by_class", window_override: "=channel_return_window_override_days", methods: "=return_methods_allowed", restocking_pct: "=restocking_fee_pct", pickup_fee: "=changed_mind_pickup_fee_usd", any_club: "=return_at_any_club", ship_by_days: "=rma_ship_by_days"}
    formula:
      when_not: return_reason == "order_cancelled"
      refund_per_unit: order_msr_sale_unit_price - (order_msr_adjusted_unit_credit if returned_units_reprice_adjusted else 0) - order_msr_rebated_unit_credit
      refund_amount: round(quantity * refund_per_unit, 2)
      restocking_amount: round(refund_amount * restocking_fee_pct / 100, 2) if return_reason == "changed_mind" else 0

  - id: order_returnless_refunds
    subject: [order_line_returned]
    rule: >
      Merchandise reported as damaged_in_transit, not_received or missing_parts is refunded without coming back
      only on a channel whose returnless_refund_reasons include the reported reason and only when the refunded
      line amount does not exceed returnless_refund_max_usd; larger lines, and every other reason, go through a
      return authorization under order_returns. A damaged, missing-part or not-received report qualifies only
      when it is made no later than missing_or_damaged_report_days calendar days after the fulfillment date of
      the purchase. Days are counted as calendar days, the fulfillment date being day 0. Member services grants
      a not_received or damaged_in_transit returnless refund only while order_msr_returnless_claims_365d is
      below missing_item_claims_per_12m; beyond that the claim needs a carrier investigation that member
      services cannot open. A missing_parts returnless refund covers only the units whose parts are missing,
      at the sale unit price.
    eligibility:
      - id: report_window
        applies_to: [order_line_returned]
        kind: time
        condition: A damaged, missing-part or not-received report qualifies only when it is made no later than missing_or_damaged_report_days calendar days after the fulfillment date of the purchase.
        evidence_fields: [order_holdings.fulfilled_date, order_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.order_id]
          action_bindings:
            order_holdings.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the fulfillment date of the purchase
          anchor_source: order_holdings.fulfilled_date
          relation: not_after
          duration_source: variants.missing_or_damaged_report_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the fulfillment date being day 0.
          boundary: inclusive
      - id: returnless_claim_limit
        applies_to: [order_line_returned]
        kind: authorization
        condition: Member services grants a not_received or damaged_in_transit returnless refund only while order_msr_returnless_claims_365d is below missing_item_claims_per_12m
        evidence_fields: [order_lines.return_reason, order_lines.event_date, order_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.membership_id]
          action_bindings:
            order_holdings.membership_id: membership_id
    measures: [order_msr_returnless_claims_365d]
    params:
      per_tier:
        Northgate In-Club Purchase: {reasons: "=returnless_refund_reasons", max_line: "=returnless_refund_max_usd", report_days: "=missing_or_damaged_report_days", claims_365d: "=missing_item_claims_per_12m"}
        Northgate Club Pickup Order: {reasons: "=returnless_refund_reasons", max_line: "=returnless_refund_max_usd", report_days: "=missing_or_damaged_report_days", claims_365d: "=missing_item_claims_per_12m"}
        Northgate Same-Day Delivery Order: {reasons: "=returnless_refund_reasons", max_line: "=returnless_refund_max_usd", report_days: "=missing_or_damaged_report_days", claims_365d: "=missing_item_claims_per_12m"}
        Northgate.com Ship-to-Home Order: {reasons: "=returnless_refund_reasons", max_line: "=returnless_refund_max_usd", report_days: "=missing_or_damaged_report_days", claims_365d: "=missing_item_claims_per_12m"}
        Northgate Business Delivery Order: {reasons: "=returnless_refund_reasons", max_line: "=returnless_refund_max_usd", report_days: "=missing_or_damaged_report_days", claims_365d: "=missing_item_claims_per_12m"}
        Northgate Special Order: {reasons: "=returnless_refund_reasons", max_line: "=returnless_refund_max_usd", report_days: "=missing_or_damaged_report_days", claims_365d: "=missing_item_claims_per_12m"}

  - id: order_price_adjustment
    subject: [order_price_adjusted]
    rule: >
      When the price of an item a member bought drops, Northgate credits the difference. A price adjustment
      is made only when it is requested no later than price_adjustment_window_days calendar days after the
      fulfillment date of the purchase. Days are counted as calendar days, the fulfillment date being day 0;
      a channel whose price_adjustment_window_days is zero gives no price adjustments. The lower price must be
      a record in item_price_history for the same item_number on the same channel where
      price_adjustment_same_channel_only is true, of price_type regular or instant_savings, in effect on some
      day inside the window; clearance prices count only where clearance_price_adjustable is true, and since
      price_match_competitors is false another retailer's price never qualifies. The credit per unit is
      order_msr_sale_unit_price minus order_msr_lowest_qualifying_price under price_adjustment_basis, applied to
      order_msr_units_kept_on_line where price_adjustment_kept_units_only is true and, for an Instant Savings
      price with a member_limit, to no more than order_msr_promotion_units_remaining. A sale line receives at
      most price_adjustment_max_per_line adjustments. Classes in price_adjustment_excluded_classes are never
      adjusted. The credit goes to the purchase's tender or a Shop Card as for refunds, and is entered with
      adjustment_type instant_savings when the lower price is an Instant Savings price and price_adjustment
      otherwise.
    eligibility:
      - id: adjustment_window
        applies_to: [order_price_adjusted]
        kind: time
        condition: A price adjustment is made only when it is requested no later than price_adjustment_window_days calendar days after the fulfillment date of the purchase.
        evidence_fields: [order_holdings.fulfilled_date, order_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.order_id]
          action_bindings:
            order_holdings.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the fulfillment date of the purchase
          anchor_source: order_holdings.fulfilled_date
          relation: not_after
          duration_source: variants.price_adjustment_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the fulfillment date being day 0; a channel whose price_adjustment_window_days is zero gives no price adjustments.
          boundary: inclusive
      - id: one_adjustment_per_line
        applies_to: [order_price_adjusted]
        kind: dedup
        condition: A sale line receives at most price_adjustment_max_per_line adjustments.
        evidence_fields: [order_lines.source_order_line_id, order_lines.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_lines.source_order_line_id]
          action_bindings:
            order_lines.source_order_line_id: source_order_line_id
        dedup_contract:
          table: order_lines
          mode: separate_record
          object_bindings: {source_order_line_id: source_order_line_id}
          duplicate_filters: {event_type: [order_price_adjusted]}
          distinct_fields: [item_price_id]
    measures: [order_msr_sale_unit_price, order_msr_lowest_qualifying_price, order_msr_units_kept_on_line, order_msr_promotion_units_remaining, order_msr_adjustments_on_line]
    params:
      per_tier:
        Northgate In-Club Purchase: {window_days: "=price_adjustment_window_days", max_per_line: "=price_adjustment_max_per_line", excluded: "=price_adjustment_excluded_classes", same_channel: "=price_adjustment_same_channel_only", clearance_ok: "=clearance_price_adjustable", member_limit_applies: "=instant_savings_member_limit_applies", competitor_match: "=price_match_competitors", basis: "=price_adjustment_basis", kept_only: "=price_adjustment_kept_units_only"}
        Northgate Club Pickup Order: {window_days: "=price_adjustment_window_days", max_per_line: "=price_adjustment_max_per_line", excluded: "=price_adjustment_excluded_classes", same_channel: "=price_adjustment_same_channel_only", clearance_ok: "=clearance_price_adjustable", member_limit_applies: "=instant_savings_member_limit_applies", competitor_match: "=price_match_competitors", basis: "=price_adjustment_basis", kept_only: "=price_adjustment_kept_units_only"}
        Northgate Same-Day Delivery Order: {window_days: "=price_adjustment_window_days", max_per_line: "=price_adjustment_max_per_line", excluded: "=price_adjustment_excluded_classes", same_channel: "=price_adjustment_same_channel_only", clearance_ok: "=clearance_price_adjustable", member_limit_applies: "=instant_savings_member_limit_applies", competitor_match: "=price_match_competitors", basis: "=price_adjustment_basis", kept_only: "=price_adjustment_kept_units_only"}
        Northgate.com Ship-to-Home Order: {window_days: "=price_adjustment_window_days", max_per_line: "=price_adjustment_max_per_line", excluded: "=price_adjustment_excluded_classes", same_channel: "=price_adjustment_same_channel_only", clearance_ok: "=clearance_price_adjustable", member_limit_applies: "=instant_savings_member_limit_applies", competitor_match: "=price_match_competitors", basis: "=price_adjustment_basis", kept_only: "=price_adjustment_kept_units_only"}
        Northgate Business Delivery Order: {window_days: "=price_adjustment_window_days", max_per_line: "=price_adjustment_max_per_line", excluded: "=price_adjustment_excluded_classes", same_channel: "=price_adjustment_same_channel_only", clearance_ok: "=clearance_price_adjustable", member_limit_applies: "=instant_savings_member_limit_applies", competitor_match: "=price_match_competitors", basis: "=price_adjustment_basis", kept_only: "=price_adjustment_kept_units_only"}
        Northgate Special Order: {window_days: "=price_adjustment_window_days", max_per_line: "=price_adjustment_max_per_line", excluded: "=price_adjustment_excluded_classes", same_channel: "=price_adjustment_same_channel_only", clearance_ok: "=clearance_price_adjustable", member_limit_applies: "=instant_savings_member_limit_applies", competitor_match: "=price_match_competitors", basis: "=price_adjustment_basis", kept_only: "=price_adjustment_kept_units_only"}
    formula:
      credit_per_unit: max(0, order_msr_sale_unit_price - order_msr_lowest_qualifying_price)
      adjusted_units: min(order_msr_units_kept_on_line, order_msr_promotion_units_remaining)
      adjustment_amount: round(credit_per_unit * adjusted_units, 2)

  - id: order_mail_in_rebates
    subject: [order_rebate_credited]
    rule: >
      A manufacturer mail-in rebate is paid only for a purchase on a channel where mail_in_rebate_eligible is
      true, for an item with a mail_in_rebate record in item_price_history whose start_date to end_date period
      contains the order date. A rebate is claimed only when the claim is made no later than
      rebate_claim_window_days calendar days after the fulfillment date of the purchase. Days are counted as
      calendar days, the fulfillment date being day 0; the claim must also be made on or before the offer's
      own claim_deadline, so the earlier of the two dates is the last day to claim. The rebate is the offer's
      unit_price for each unit still kept on the sale line, up to the offer's member_limit when it is not
      zero, and is paid on a Northgate Shop Card per rebate_payment_tender. One sale line is paid at most once
      per offer. Rebates are funded by the manufacturer and do not reduce Annual Reward; a rebated unit returned
      later is refunded at its sale price minus the rebate already paid on it.
    eligibility:
      - id: rebate_claim_window
        applies_to: [order_rebate_credited]
        kind: time
        condition: A rebate is claimed only when the claim is made no later than rebate_claim_window_days calendar days after the fulfillment date of the purchase.
        evidence_fields: [order_holdings.fulfilled_date, order_holdings.order_id, item_price_history.claim_deadline]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.order_id]
          action_bindings:
            order_holdings.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the fulfillment date of the purchase
          anchor_source: order_holdings.fulfilled_date
          relation: not_after
          duration_source: variants.rebate_claim_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the fulfillment date being day 0; the claim must also be made on or before the offer's own claim_deadline, so the earlier of the two dates is the last day to claim.
          boundary: inclusive
      - id: one_rebate_per_offer
        applies_to: [order_rebate_credited]
        kind: dedup
        condition: One sale line is paid at most once per offer.
        evidence_fields: [order_lines.source_order_line_id, order_lines.item_price_id, order_lines.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_lines.source_order_line_id, order_lines.item_price_id]
          action_bindings:
            order_lines.source_order_line_id: source_order_line_id
            order_lines.item_price_id: item_price_id
        dedup_contract:
          table: order_lines
          mode: separate_record
          object_bindings: {source_order_line_id: source_order_line_id, item_price_id: item_price_id}
          duplicate_filters: {event_type: [order_rebate_credited]}
          distinct_fields: [event_date]
    measures: [order_msr_units_kept_on_line]
    params:
      per_tier:
        Northgate In-Club Purchase: {eligible: "=mail_in_rebate_eligible", claim_days: "=rebate_claim_window_days", paid_as: "=rebate_payment_tender"}
        Northgate Club Pickup Order: {eligible: "=mail_in_rebate_eligible", claim_days: "=rebate_claim_window_days", paid_as: "=rebate_payment_tender"}
        Northgate Same-Day Delivery Order: {eligible: "=mail_in_rebate_eligible", claim_days: "=rebate_claim_window_days", paid_as: "=rebate_payment_tender"}
        Northgate.com Ship-to-Home Order: {eligible: "=mail_in_rebate_eligible", claim_days: "=rebate_claim_window_days", paid_as: "=rebate_payment_tender"}
        Northgate Business Delivery Order: {eligible: "=mail_in_rebate_eligible", claim_days: "=rebate_claim_window_days", paid_as: "=rebate_payment_tender"}
        Northgate Special Order: {eligible: "=mail_in_rebate_eligible", claim_days: "=rebate_claim_window_days", paid_as: "=rebate_payment_tender"}

  - id: order_fees
    subject: [order_fee_charged, order_fee_refunded]
    rule: >
      The delivery_fee_usd is charged once per order on channels that have one, except that it is not charged
      when order_msr_merchandise_total is at or above a non-zero free_delivery_threshold_usd, and not charged
      when plus_free_delivery is true and order_msr_plus_presented is true. The non-member surcharge is
      nonmember_surcharge_pct of order_msr_merchandise_total and is charged only on a channel that sells to
      non-members when order_msr_member_active_on_order_date is false; a member who renews later does not get
      the surcharge back, but it is refunded line by line with returned merchandise where
      nonmember_surcharge_refunded_with_line is true. Restocking and changed-mind pickup fees are charged only
      as order_returns provides. A fee is refunded in full by its own fee refund entry when the order is
      cancelled, and the delivery fee when order_returns provides; a fee is never refunded twice.
    eligibility:
      - id: fee_refunded_once
        applies_to: [order_fee_refunded]
        kind: dedup
        condition: a fee is never refunded twice
        evidence_fields: [order_lines.source_order_line_id, order_lines.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_lines.source_order_line_id]
          action_bindings:
            order_lines.source_order_line_id: source_order_line_id
        dedup_contract:
          table: order_lines
          mode: separate_record
          object_bindings: {source_order_line_id: source_order_line_id}
          duplicate_filters: {event_type: [order_fee_refunded]}
          distinct_fields: []
    measures: [order_msr_merchandise_total, order_msr_plus_presented, order_msr_member_active_on_order_date]
    params:
      per_tier:
        Northgate In-Club Purchase: {delivery_fee: "=delivery_fee_usd", free_threshold: "=free_delivery_threshold_usd", plus_waiver: "=plus_free_delivery", surcharge_pct: "=nonmember_surcharge_pct", members_only: "=membership_required_for_purchase", surcharge_refund: "=nonmember_surcharge_refunded_with_line", fee_refund_reasons: "=delivery_fee_refund_reasons"}
        Northgate Club Pickup Order: {delivery_fee: "=delivery_fee_usd", free_threshold: "=free_delivery_threshold_usd", plus_waiver: "=plus_free_delivery", surcharge_pct: "=nonmember_surcharge_pct", members_only: "=membership_required_for_purchase", surcharge_refund: "=nonmember_surcharge_refunded_with_line", fee_refund_reasons: "=delivery_fee_refund_reasons"}
        Northgate Same-Day Delivery Order: {delivery_fee: "=delivery_fee_usd", free_threshold: "=free_delivery_threshold_usd", plus_waiver: "=plus_free_delivery", surcharge_pct: "=nonmember_surcharge_pct", members_only: "=membership_required_for_purchase", surcharge_refund: "=nonmember_surcharge_refunded_with_line", fee_refund_reasons: "=delivery_fee_refund_reasons"}
        Northgate.com Ship-to-Home Order: {delivery_fee: "=delivery_fee_usd", free_threshold: "=free_delivery_threshold_usd", plus_waiver: "=plus_free_delivery", surcharge_pct: "=nonmember_surcharge_pct", members_only: "=membership_required_for_purchase", surcharge_refund: "=nonmember_surcharge_refunded_with_line", fee_refund_reasons: "=delivery_fee_refund_reasons"}
        Northgate Business Delivery Order: {delivery_fee: "=delivery_fee_usd", free_threshold: "=free_delivery_threshold_usd", plus_waiver: "=plus_free_delivery", surcharge_pct: "=nonmember_surcharge_pct", members_only: "=membership_required_for_purchase", surcharge_refund: "=nonmember_surcharge_refunded_with_line", fee_refund_reasons: "=delivery_fee_refund_reasons"}
        Northgate Special Order: {delivery_fee: "=delivery_fee_usd", free_threshold: "=free_delivery_threshold_usd", plus_waiver: "=plus_free_delivery", surcharge_pct: "=nonmember_surcharge_pct", members_only: "=membership_required_for_purchase", surcharge_refund: "=nonmember_surcharge_refunded_with_line", fee_refund_reasons: "=delivery_fee_refund_reasons"}
    formula:
      delivery_fee_due: 0 if ((free_delivery_threshold_usd > 0 and order_msr_merchandise_total >= free_delivery_threshold_usd) or (plus_free_delivery and order_msr_plus_presented)) else delivery_fee_usd
      surcharge_due: round(order_msr_merchandise_total * nonmember_surcharge_pct / 100, 2) if not order_msr_member_active_on_order_date else 0

  - id: order_reward_flag
    subject: [order_line_sold]
    rule: >
      Whether a sale line earns Annual Reward is fixed at the register and recorded as reward_eligible on the
      line; returns, adjustments and rebates against it copy the flag. A sale line is reward_eligible only when
      the channel's reward_eligible_channel is true, order_msr_plus_presented is true, and the line's
      merchandise_class is not in that membership tier's annual_reward_excluded_classes. Purchases made through
      the same-day delivery partner never earn, whatever the member's tier. A flag recorded at the register is
      never changed later because the member upgrades, downgrades or presents another card.
    eligibility: []
    measures: [order_msr_plus_presented]
    params:
      per_tier:
        Northgate In-Club Purchase: {earns: "=reward_eligible_channel"}
        Northgate Club Pickup Order: {earns: "=reward_eligible_channel"}
        Northgate Same-Day Delivery Order: {earns: "=reward_eligible_channel"}
        Northgate.com Ship-to-Home Order: {earns: "=reward_eligible_channel"}
        Northgate Business Delivery Order: {earns: "=reward_eligible_channel"}
        Northgate Special Order: {earns: "=reward_eligible_channel"}
