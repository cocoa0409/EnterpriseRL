# Northgate Wholesale Club — purchases and returns charter.
# Every purchase a member makes — at a register, for club pickup, through the same-day delivery partner,
# shipped from Northgate.com, on a business delivery route or as a special order — is held as one purchase
# record whose tier is its purchase channel. It is booked line by line: sales, returns, price adjustments,
# mail-in rebate credits and order-level fees, all against the net_paid account.

category: order
display_name: Northgate Purchases & Returns

binding:
  holding_table: order_holdings
  event_tables: [order_lines]
  intake_tables: [order_return_authorizations]
  status_field: status
  variant_field: variant_name
  quantity_fields: {net_paid_amount: net_paid}

lifecycle:
  states: [placed, fulfilled, partially_returned, fully_returned, cancelled]
  transitions:
    - {from: placed, to: fulfilled, by: system, means: "The member receives the merchandise — at the register, at club pickup, or on carrier or crew delivery."}
    - {from: placed, to: cancelled, by: agent, means: "An order not yet fulfilled is cancelled at the member's request and every line is refunded."}
    - {from: fulfilled, to: partially_returned, by: agent, means: "A refund is posted for some, but not all, of the units sold on the purchase."}
    - {from: fulfilled, to: fully_returned, by: agent, means: "A refund is posted that leaves no sold unit on the purchase unrefunded."}
    - {from: partially_returned, to: fully_returned, by: agent, means: "A further refund leaves no sold unit on the purchase unrefunded."}

accounts:
  - key: net_paid
    unit: USD
    meaning: What the member has paid on the purchase for merchandise and order fees, net of returns, price adjustments, rebate credits and fee refunds.

parameter_schema:
  membership_required_for_purchase: "whether the channel sells only to holders of an active membership (boolean)"
  nonmember_surcharge_pct: "surcharge on merchandise when the buyer's membership is not active, on channels that sell to non-members (percent)"
  business_segment_required: "whether the channel is open only to business-segment memberships (boolean)"
  channel_excluded_classes: "merchandise classes the channel does not sell (list of merchandise_class values)"
  order_minimum_usd: "minimum pre-tax merchandise total for an order on the channel; 0.00 = no minimum (USD)"
  delivery_fee_usd: "delivery or shipping fee charged once per order on the channel (USD)"
  free_delivery_threshold_usd: "pre-tax merchandise total at or above which the delivery fee is not charged; 0.00 where no fee applies (USD)"
  plus_free_delivery: "whether a Plus-tier membership presented on the order waives the delivery fee regardless of order size (boolean)"
  third_party_fulfillment: "whether a delivery partner, not Northgate, shops and delivers the order (boolean)"
  cancellation_allowed: "whether member services may cancel an order on the channel before it is fulfilled (boolean)"
  cancellation_cutoff_days: "calendar days after the order date after which a not-yet-fulfilled order can no longer be cancelled; 0 = cancellable until fulfilled (days)"
  pickup_hold_days: "calendar days a club pickup order is held after it is ready before it is cancelled and refunded; 0 where not applicable (days)"
  alternate_pickup_allowed: "whether a person named by the member may collect the order with photo ID (boolean)"
  return_window_days_by_class: "return window per merchandise class counted from the fulfillment date, or no_limit (mapping merchandise_class -> days or no_limit)"
  non_returnable_classes: "merchandise classes that are never returnable for a refund (list)"
  channel_return_window_override_days: "a channel-wide return window that replaces the class window for every returnable class when non-zero; 0 = no override (days)"
  return_window_anchor: "the record date the return window counts from (string code)"
  return_at_any_club: "whether merchandise from the channel may be returned at any club membership counter (boolean)"
  return_methods_allowed: "ways merchandise may be sent back without a club visit through a return authorization (list of return_method values; empty = club counter only)"
  freight_pickup_classes: "merchandise classes that go back by freight pickup rather than parcel (list)"
  changed_mind_pickup_fee_usd: "fee for a freight pickup of a changed_mind return (USD)"
  rma_ship_by_days: "calendar days after the return authorization is confirmed within which the merchandise must be handed to the carrier; 0 where no authorizations are issued (days)"
  restocking_fee_pct: "restocking fee on a changed_mind return as a percentage of the returned amount (percent)"
  restocking_fee_waived_reasons: "return reasons on which the restocking fee is never charged (list)"
  returnless_refund_max_usd: "highest line refund that may be issued without the merchandise coming back, for the qualifying reasons; 0.00 = never (USD)"
  returnless_refund_reasons: "return reasons that qualify for a returnless refund (list)"
  missing_or_damaged_report_days: "calendar days after the fulfillment date within which damaged, missing-part or not-received merchandise must be reported (days)"
  missing_item_claims_per_12m: "returnless refunds for not_received or damaged_in_transit merchandise member services may grant one membership in a rolling 365 days (count)"
  refund_to_shop_card_tenders: "original tenders whose refunds are issued on a Northgate Shop Card instead (list of tender values)"
  returned_units_reprice_adjusted: "whether a returned unit that already received a price adjustment is refunded at its adjusted price rather than its sale price (boolean)"
  nonmember_surcharge_refunded_with_line: "whether the non-member surcharge on a returned line is refunded with it (boolean)"
  delivery_fee_refund_reasons: "return reasons that refund the order's delivery fee when the order ends fully returned (list)"
  exchanges_allowed: "whether an even exchange of the same item may be made without a refund (boolean)"
  post_window_defect_route: "where a defect reported after the return window is directed (string code)"
  electronics_accessories_required: "whether returns of television, computer_tablet, cell_phone and camera_drone lines must include every accessory and part, a missing one being charged at its replacement cost (boolean)"
  price_adjustment_window_days: "calendar days after the fulfillment date during which a lower price on the same item earns a price adjustment; 0 = no price adjustments on the channel (days)"
  price_adjustment_excluded_classes: "merchandise classes never price-adjusted (list)"
  price_adjustment_same_channel_only: "whether only a lower price on the same channel qualifies (boolean)"
  price_adjustment_max_per_line: "price adjustments allowed on one sale line (count)"
  clearance_price_adjustable: "whether a clearance price counts as a lower price for adjustment (boolean)"
  price_match_competitors: "whether Northgate matches another retailer's price (boolean)"
  instant_savings_member_limit_applies: "whether an Instant Savings promotion's member_limit caps the units adjusted to its price (boolean)"
  price_adjustment_basis: "how the lower price is chosen (string code)"
  price_adjustment_kept_units_only: "whether only units of the sale line not already refunded are adjusted (boolean)"
  mail_in_rebate_eligible: "whether purchases on the channel qualify for manufacturer mail-in rebate offers (boolean)"
  rebate_payment_tender: "how an approved mail-in rebate is paid (tender value)"
  rebate_claim_window_days: "calendar days after the fulfillment date within which a mail-in rebate claim must be made, in addition to the offer's own claim_deadline (days)"
  reward_eligible_channel: "whether purchases on the channel can earn Annual Reward (boolean)"

