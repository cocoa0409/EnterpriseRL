events:
  - type: protection_plan_purchased
    target: protection_holdings
    mutation: create
    meaning: A Northgate Care plan is bought for the product on one sale line.
    grain: one row per plan
    fields:
      customer_id: the plan holder
      order_line_id: the covered product's sale line
      variant_name: the plan bought
      status: always active on purchase
      covered_product_price: the price paid for the covered product, the limit of liability
      purchase_date: the plan purchase date
      coverage_start_date: the product's sale date
      coverage_end_date: the last day of the term
    triggers:
      - event: protection:protection_plan_charged
        map: {event_date: purchase_date}

  - type: protection_plan_expired
    target: protection_holdings
    mutation: {transition: {from: active, to: expired}}
    meaning: The plan's coverage end date passes.
    grain: one row per plan expiring
    fields:
      status: becomes expired
    triggers: []

  - type: protection_plan_fulfilled
    target: protection_holdings
    mutation: {transition: {from: active, to: fulfilled}}
    meaning: A claim is settled by replacement or cash settlement and the plan ends.
    grain: one row per plan fulfilled
    fields:
      status: becomes fulfilled
      closed_date: the settlement date
    triggers: []

  - type: protection_plan_cancelled
    target: protection_holdings
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The plan is cancelled at the holder's request or because the covered product was returned.
    grain: one row per plan cancelled
    fields:
      status: becomes cancelled
      closed_date: the cancellation date
    triggers: []

  - type: protection_plan_charged
    target: protection_events
    meaning: The plan price is charged.
    grain: one row per plan purchase
    distinguish_by: [event_date]
    fields:
      event_date: the purchase date
      amount: the plan price from the ladder
    account: plan_fees
    direction: in
    triggers: []

  - type: protection_plan_refunded
    target: protection_events
    meaning: All or part of the plan price is refunded on cancellation.
    grain: one row per refund of the plan charge
    distinguish_by: [source_event_id]
    fields:
      event_date: the refund date
      amount: the refund
      source_event_id: the plan charge refunded
    account: plan_fees
    direction: out
    triggers: []

  - type: protection_claim_filed
    target: protection_events
    meaning: The plan holder reports a failure of the covered product.
    grain: one row per failure reported
    distinguish_by: [failure_date, failure_type]
    fields:
      event_date: the date the claim is filed
      failure_date: the date the product failed
      failure_type: the failure reported
      amount: always 0.00
    triggers: []

  - type: protection_claim_settled
    target: protection_events
    meaning: A filed claim is settled by repair, replacement or cash, or denied.
    grain: one row per claim settled
    distinguish_by: [source_event_id]
    fields:
      event_date: the settlement date
      failure_date: copied from the claim
      failure_type: copied from the claim
      claim_outcome: repair, replacement, cash_settlement or denied
      amount: the value paid out, 0.00 on a denial
      source_event_id: the claim settled
    triggers:
      - event: protection:protection_plan_fulfilled
        when: {claim_outcome: [replacement, cash_settlement]}
        map: {closed_date: event_date}

measures:
  - id: protection_msr_claims_paid
    window: the life of the plan
    measure: sum of amount over protection_claim_settled entries whose claim_outcome is repair, replacement or cash_settlement
  - id: protection_msr_repairs_same_failure
    window: the life of the plan
    measure: count of protection_claim_settled entries with claim_outcome repair and the same failure_type as the claim being settled
  - id: protection_msr_accident_claims
    window: the life of the plan
    measure: count of protection_claim_settled entries with failure_type accidental_drop or liquid_spill and claim_outcome other than denied
  - id: protection_msr_unused_whole_months
    window: from the cancellation date to coverage_end_date
    measure: whole calendar months of the term that begin after the cancellation date
  - id: protection_msr_plan_charge
    window: the life of the plan
    measure: the amount of the plan's protection_plan_charged entry

policies:
  - id: protection_agg_multi_holding
    subject: [protection_plan_purchased]
    rule: >
      A member may hold any number of Northgate Care plans, one for each covered product. Every plan stands
      alone: its limit of liability, claim counts, refunds and term are never pooled with another plan, even
      for products on the same purchase.
    eligibility: []
    params:
      max_per_customer: null

  - id: protection_agg_one_plan_per_line
    subject: [protection_plan_purchased]
    rule: >
      A plan covers exactly one sale line, and a sale line may be covered by at most plans_per_sale_line plan.
      A sale line already covered by a plan whose status is active may not be covered by another plan. A plan
      is bought only when it is purchased no later than purchase_window_days calendar days after the sale date
      of the covered product. Days are counted as calendar days, the sale date being day 0. The sale line must
      be in the plan's eligible_merchandise_classes, on one of its purchase_channels, at a price between
      min_product_price_usd and max_product_price_usd.
    eligibility:
      - id: one_active_plan_per_line
        applies_to: [protection_plan_purchased]
        kind: dedup
        condition: A sale line already covered by a plan whose status is active may not be covered by another plan.
        evidence_fields: [protection_holdings.order_line_id, protection_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_holdings.order_line_id]
          action_bindings:
            protection_holdings.order_line_id: order_line_id
        dedup_contract:
          table: protection_holdings
          mode: separate_record
          object_bindings: {order_line_id: order_line_id}
          duplicate_filters: {status: [active]}
          distinct_fields: [purchase_date]
      - id: plan_purchase_window
        applies_to: [protection_plan_purchased]
        kind: time
        condition: A plan is bought only when it is purchased no later than purchase_window_days calendar days after the sale date of the covered product.
        evidence_fields: [order_lines.event_date, order_lines.order_line_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_lines.order_line_id]
          action_bindings:
            order_lines.order_line_id: order_line_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the sale date of the covered product
          anchor_source: order_lines.event_date
          relation: not_after
          duration_source: variants.purchase_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the sale date being day 0.
          boundary: inclusive
    params:
      per_tier:
        Northgate Care 2-Year Electronics Plan: {per_line: "=plans_per_sale_line", window_days: "=purchase_window_days", classes: "=eligible_merchandise_classes", channels: "=purchase_channels", min_price: "=min_product_price_usd", max_price: "=max_product_price_usd"}
        Northgate Care 3-Year Electronics Plan: {per_line: "=plans_per_sale_line", window_days: "=purchase_window_days", classes: "=eligible_merchandise_classes", channels: "=purchase_channels", min_price: "=min_product_price_usd", max_price: "=max_product_price_usd"}
        Northgate Care 3-Year Electronics Plan with Accident Protection: {per_line: "=plans_per_sale_line", window_days: "=purchase_window_days", classes: "=eligible_merchandise_classes", channels: "=purchase_channels", min_price: "=min_product_price_usd", max_price: "=max_product_price_usd"}
        Northgate Care 4-Year Mattress & Furniture Plan: {per_line: "=plans_per_sale_line", window_days: "=purchase_window_days", classes: "=eligible_merchandise_classes", channels: "=purchase_channels", min_price: "=min_product_price_usd", max_price: "=max_product_price_usd"}
        Northgate Care 3-Year Appliance Plan: {per_line: "=plans_per_sale_line", window_days: "=purchase_window_days", classes: "=eligible_merchandise_classes", channels: "=purchase_channels", min_price: "=min_product_price_usd", max_price: "=max_product_price_usd"}
        Northgate Care 5-Year Appliance Plan: {per_line: "=plans_per_sale_line", window_days: "=purchase_window_days", classes: "=eligible_merchandise_classes", channels: "=purchase_channels", min_price: "=min_product_price_usd", max_price: "=max_product_price_usd"}

  - id: protection_plan_pricing
    subject: [protection_plan_purchased, protection_plan_charged]
    rule: >
      The plan price is read from plan_price_ladder_usd: the first band whose up_to is at or above
      covered_product_price sets the price. Coverage starts on the covered product's sale date per
      coverage_start_basis and runs term_months calendar months, ending the day before the same calendar date;
      it runs alongside the manufacturer's warranty where overlaps_manufacturer_warranty is true. The plan is
      charged once on its purchase date to the tender of the purchase, and while plan_price_reward_eligible is
      false the plan price never earns Annual Reward.
    eligibility: []
    params:
      per_tier:
        Northgate Care 2-Year Electronics Plan: {ladder: "=plan_price_ladder_usd", term: "=term_months", start: "=coverage_start_basis", overlap: "=overlaps_manufacturer_warranty", earns: "=plan_price_reward_eligible"}
        Northgate Care 3-Year Electronics Plan: {ladder: "=plan_price_ladder_usd", term: "=term_months", start: "=coverage_start_basis", overlap: "=overlaps_manufacturer_warranty", earns: "=plan_price_reward_eligible"}
        Northgate Care 3-Year Electronics Plan with Accident Protection: {ladder: "=plan_price_ladder_usd", term: "=term_months", start: "=coverage_start_basis", overlap: "=overlaps_manufacturer_warranty", earns: "=plan_price_reward_eligible"}
        Northgate Care 4-Year Mattress & Furniture Plan: {ladder: "=plan_price_ladder_usd", term: "=term_months", start: "=coverage_start_basis", overlap: "=overlaps_manufacturer_warranty", earns: "=plan_price_reward_eligible"}
        Northgate Care 3-Year Appliance Plan: {ladder: "=plan_price_ladder_usd", term: "=term_months", start: "=coverage_start_basis", overlap: "=overlaps_manufacturer_warranty", earns: "=plan_price_reward_eligible"}
        Northgate Care 5-Year Appliance Plan: {ladder: "=plan_price_ladder_usd", term: "=term_months", start: "=coverage_start_basis", overlap: "=overlaps_manufacturer_warranty", earns: "=plan_price_reward_eligible"}

  - id: protection_coverage_scope
    subject: [protection_claim_filed, protection_claim_settled]
    rule: >
      A claim is taken only on a plan whose status is active. A claim is accepted only when it is filed no later
      than claim_report_days_after_failure calendar days after the failure date. Days are counted as calendar
      days, the failure date being day 0. The failure date must fall between coverage_start_date and
      coverage_end_date. Covered failures are exactly those the plan's switches name: mechanical and
      electrical failures where covers_mechanical_electrical, power surges where covers_power_surge, drops and
      spills where covers_accidental_damage, the stain_types_covered where covers_stains, and structural
      failures — including body impressions of at least mattress_sag_depth_inches — where
      covers_structural_failure. A built-in battery holding less than battery_capacity_threshold_pct of its
      capacity counts as failed where covers_batteries, and a display with at least dead_pixel_min_count dead
      pixels counts as failed. Cosmetic damage, normal wear, consumable parts and damage present before
      coverage are excluded as the plan's switches say, and commercial use is covered only for products bought
      on a business-segment membership where commercial_use_covered_for_business_members is true. A failure
      of any other type is denied. Televisions of at least in_home_min_screen_inches and appliances are
      serviced in the home where in_home_service_available; other products go to the depot, with shipping
      paid where depot_shipping_paid.
    eligibility:
      - id: claim_on_active_plan
        applies_to: [protection_claim_filed]
        kind: state
        condition: A claim is taken only on a plan whose status is active.
        evidence_fields: [protection_holdings.status, protection_holdings.protection_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_holdings.protection_plan_id]
          action_bindings:
            protection_holdings.protection_plan_id: protection_plan_id
        state_contract:
          field: protection_holdings.status
          allowed: [active]
      - id: claim_report_window
        applies_to: [protection_claim_filed]
        kind: time
        condition: A claim is accepted only when it is filed no later than claim_report_days_after_failure calendar days after the failure date.
        evidence_fields: [protection_events.failure_date, protection_events.protection_plan_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [protection_events.protection_plan_id]
          action_bindings:
            protection_events.protection_plan_id: protection_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the failure date
          anchor_source: protection_events.failure_date
          relation: not_after
          duration_source: variants.claim_report_days_after_failure
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the failure date being day 0.
          boundary: inclusive
    params:
      per_tier:
        Northgate Care 2-Year Electronics Plan: {mech: "=covers_mechanical_electrical", surge: "=covers_power_surge", accident: "=covers_accidental_damage", stains: "=covers_stains", stain_types: "=stain_types_covered", structural: "=covers_structural_failure", sag_inches: "=mattress_sag_depth_inches", cosmetic: "=covers_cosmetic_damage", batteries: "=covers_batteries", battery_pct: "=battery_capacity_threshold_pct", pixels: "=dead_pixel_min_count", in_home: "=in_home_service_available", in_home_screen: "=in_home_min_screen_inches", depot_shipping: "=depot_shipping_paid", report_days: "=claim_report_days_after_failure", commercial: "=commercial_use_covered_for_business_members", pre_existing: "=pre_existing_damage_excluded", wear: "=normal_wear_excluded", consumables: "=consumable_parts_excluded", channel: "=claim_channel"}
        Northgate Care 3-Year Electronics Plan: {mech: "=covers_mechanical_electrical", surge: "=covers_power_surge", accident: "=covers_accidental_damage", stains: "=covers_stains", stain_types: "=stain_types_covered", structural: "=covers_structural_failure", sag_inches: "=mattress_sag_depth_inches", cosmetic: "=covers_cosmetic_damage", batteries: "=covers_batteries", battery_pct: "=battery_capacity_threshold_pct", pixels: "=dead_pixel_min_count", in_home: "=in_home_service_available", in_home_screen: "=in_home_min_screen_inches", depot_shipping: "=depot_shipping_paid", report_days: "=claim_report_days_after_failure", commercial: "=commercial_use_covered_for_business_members", pre_existing: "=pre_existing_damage_excluded", wear: "=normal_wear_excluded", consumables: "=consumable_parts_excluded", channel: "=claim_channel"}
        Northgate Care 3-Year Electronics Plan with Accident Protection: {mech: "=covers_mechanical_electrical", surge: "=covers_power_surge", accident: "=covers_accidental_damage", stains: "=covers_stains", stain_types: "=stain_types_covered", structural: "=covers_structural_failure", sag_inches: "=mattress_sag_depth_inches", cosmetic: "=covers_cosmetic_damage", batteries: "=covers_batteries", battery_pct: "=battery_capacity_threshold_pct", pixels: "=dead_pixel_min_count", in_home: "=in_home_service_available", in_home_screen: "=in_home_min_screen_inches", depot_shipping: "=depot_shipping_paid", report_days: "=claim_report_days_after_failure", commercial: "=commercial_use_covered_for_business_members", pre_existing: "=pre_existing_damage_excluded", wear: "=normal_wear_excluded", consumables: "=consumable_parts_excluded", channel: "=claim_channel"}
        Northgate Care 4-Year Mattress & Furniture Plan: {mech: "=covers_mechanical_electrical", surge: "=covers_power_surge", accident: "=covers_accidental_damage", stains: "=covers_stains", stain_types: "=stain_types_covered", structural: "=covers_structural_failure", sag_inches: "=mattress_sag_depth_inches", cosmetic: "=covers_cosmetic_damage", batteries: "=covers_batteries", battery_pct: "=battery_capacity_threshold_pct", pixels: "=dead_pixel_min_count", in_home: "=in_home_service_available", in_home_screen: "=in_home_min_screen_inches", depot_shipping: "=depot_shipping_paid", report_days: "=claim_report_days_after_failure", commercial: "=commercial_use_covered_for_business_members", pre_existing: "=pre_existing_damage_excluded", wear: "=normal_wear_excluded", consumables: "=consumable_parts_excluded", channel: "=claim_channel"}
        Northgate Care 3-Year Appliance Plan: {mech: "=covers_mechanical_electrical", surge: "=covers_power_surge", accident: "=covers_accidental_damage", stains: "=covers_stains", stain_types: "=stain_types_covered", structural: "=covers_structural_failure", sag_inches: "=mattress_sag_depth_inches", cosmetic: "=covers_cosmetic_damage", batteries: "=covers_batteries", battery_pct: "=battery_capacity_threshold_pct", pixels: "=dead_pixel_min_count", in_home: "=in_home_service_available", in_home_screen: "=in_home_min_screen_inches", depot_shipping: "=depot_shipping_paid", report_days: "=claim_report_days_after_failure", commercial: "=commercial_use_covered_for_business_members", pre_existing: "=pre_existing_damage_excluded", wear: "=normal_wear_excluded", consumables: "=consumable_parts_excluded", channel: "=claim_channel"}
        Northgate Care 5-Year Appliance Plan: {mech: "=covers_mechanical_electrical", surge: "=covers_power_surge", accident: "=covers_accidental_damage", stains: "=covers_stains", stain_types: "=stain_types_covered", structural: "=covers_structural_failure", sag_inches: "=mattress_sag_depth_inches", cosmetic: "=covers_cosmetic_damage", batteries: "=covers_batteries", battery_pct: "=battery_capacity_threshold_pct", pixels: "=dead_pixel_min_count", in_home: "=in_home_service_available", in_home_screen: "=in_home_min_screen_inches", depot_shipping: "=depot_shipping_paid", report_days: "=claim_report_days_after_failure", commercial: "=commercial_use_covered_for_business_members", pre_existing: "=pre_existing_damage_excluded", wear: "=normal_wear_excluded", consumables: "=consumable_parts_excluded", channel: "=claim_channel"}

  - id: protection_claim_settlement
    subject: [protection_claim_settled, protection_plan_fulfilled]
    rule: >
      A covered claim is settled by repair first. Once protection_msr_repairs_same_failure has reached
      no_lemon_repair_count, the next claim for that failure is settled by replacement per replacement_basis.
      When no comparable model is available, the claim is settled in cash per cash_settlement_basis. Every
      settlement is limited by the limit of liability: covered_product_price minus protection_msr_claims_paid.
      An accidental damage claim is settled only while protection_msr_accident_claims is below
      accident_claims_max, and accident_deductible_usd is collected before the settlement. A refrigerator or
      freezer failure also reimburses spoiled food up to food_spoilage_limit_usd. A replacement or cash
      settlement fulfills the plan where plan_ends_on_replacement is true; a repair leaves it active. Time in
      repair never extends the term while repair_period_extends_term is false.
    eligibility:
      - id: accident_claim_limit
        applies_to: [protection_claim_settled]
        kind: authorization
        condition: An accidental damage claim is settled only while protection_msr_accident_claims is below accident_claims_max, and accident_deductible_usd is collected before the settlement.
        evidence_fields: [protection_events.protection_plan_id, protection_events.failure_type, protection_events.claim_outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_events.protection_plan_id]
          action_bindings:
            protection_events.protection_plan_id: protection_plan_id
    measures: [protection_msr_claims_paid, protection_msr_repairs_same_failure, protection_msr_accident_claims]
    params:
      per_tier:
        Northgate Care 2-Year Electronics Plan: {lemon_count: "=no_lemon_repair_count", replacement: "=replacement_basis", cash: "=cash_settlement_basis", limit: "=limit_of_liability_basis", accident_max: "=accident_claims_max", deductible: "=accident_deductible_usd", food: "=food_spoilage_limit_usd", ends: "=plan_ends_on_replacement", extends: "=repair_period_extends_term"}
        Northgate Care 3-Year Electronics Plan: {lemon_count: "=no_lemon_repair_count", replacement: "=replacement_basis", cash: "=cash_settlement_basis", limit: "=limit_of_liability_basis", accident_max: "=accident_claims_max", deductible: "=accident_deductible_usd", food: "=food_spoilage_limit_usd", ends: "=plan_ends_on_replacement", extends: "=repair_period_extends_term"}
        Northgate Care 3-Year Electronics Plan with Accident Protection: {lemon_count: "=no_lemon_repair_count", replacement: "=replacement_basis", cash: "=cash_settlement_basis", limit: "=limit_of_liability_basis", accident_max: "=accident_claims_max", deductible: "=accident_deductible_usd", food: "=food_spoilage_limit_usd", ends: "=plan_ends_on_replacement", extends: "=repair_period_extends_term"}
        Northgate Care 4-Year Mattress & Furniture Plan: {lemon_count: "=no_lemon_repair_count", replacement: "=replacement_basis", cash: "=cash_settlement_basis", limit: "=limit_of_liability_basis", accident_max: "=accident_claims_max", deductible: "=accident_deductible_usd", food: "=food_spoilage_limit_usd", ends: "=plan_ends_on_replacement", extends: "=repair_period_extends_term"}
        Northgate Care 3-Year Appliance Plan: {lemon_count: "=no_lemon_repair_count", replacement: "=replacement_basis", cash: "=cash_settlement_basis", limit: "=limit_of_liability_basis", accident_max: "=accident_claims_max", deductible: "=accident_deductible_usd", food: "=food_spoilage_limit_usd", ends: "=plan_ends_on_replacement", extends: "=repair_period_extends_term"}
        Northgate Care 5-Year Appliance Plan: {lemon_count: "=no_lemon_repair_count", replacement: "=replacement_basis", cash: "=cash_settlement_basis", limit: "=limit_of_liability_basis", accident_max: "=accident_claims_max", deductible: "=accident_deductible_usd", food: "=food_spoilage_limit_usd", ends: "=plan_ends_on_replacement", extends: "=repair_period_extends_term"}
    formula:
      remaining_limit: max(0, covered_product_price - protection_msr_claims_paid)

  - id: protection_cancellation_refunds
    subject: [protection_plan_cancelled, protection_plan_refunded]
    rule: >
      The plan holder may cancel an active plan at any time. A cancellation is refunded in full only when it
      is requested no later than cancellation_full_refund_days calendar days after the plan purchase date and
      no claim has been paid. Days are counted as calendar days, the plan purchase date being day 0. Otherwise,
      where cancellation_prorated_after_window is true, the refund is protection_msr_plan_charge times
      protection_msr_unused_whole_months divided by term_months, less cancellation_admin_fee_usd and, where
      refund_deducts_claims_paid, less protection_msr_claims_paid, never below zero. When the covered product
      is returned for a refund and product_return_cancels_plan is true, the plan is cancelled and refunded in
      full whatever the date. The refund goes per plan_refund_tender against the plan charge.
    eligibility:
      - id: full_refund_window
        applies_to: [protection_plan_refunded]
        kind: time
        condition: A cancellation is refunded in full only when it is requested no later than cancellation_full_refund_days calendar days after the plan purchase date and no claim has been paid.
        evidence_fields: [protection_holdings.purchase_date, protection_holdings.protection_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_holdings.protection_plan_id]
          action_bindings:
            protection_holdings.protection_plan_id: protection_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the plan purchase date
          anchor_source: protection_holdings.purchase_date
          relation: not_after
          duration_source: variants.cancellation_full_refund_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the plan purchase date being day 0.
          boundary: inclusive
    measures: [protection_msr_plan_charge, protection_msr_unused_whole_months, protection_msr_claims_paid]
    params:
      per_tier:
        Northgate Care 2-Year Electronics Plan: {full_days: "=cancellation_full_refund_days", prorate: "=cancellation_prorated_after_window", admin_fee: "=cancellation_admin_fee_usd", deduct_claims: "=refund_deducts_claims_paid", return_cancels: "=product_return_cancels_plan", tender: "=plan_refund_tender"}
        Northgate Care 3-Year Electronics Plan: {full_days: "=cancellation_full_refund_days", prorate: "=cancellation_prorated_after_window", admin_fee: "=cancellation_admin_fee_usd", deduct_claims: "=refund_deducts_claims_paid", return_cancels: "=product_return_cancels_plan", tender: "=plan_refund_tender"}
        Northgate Care 3-Year Electronics Plan with Accident Protection: {full_days: "=cancellation_full_refund_days", prorate: "=cancellation_prorated_after_window", admin_fee: "=cancellation_admin_fee_usd", deduct_claims: "=refund_deducts_claims_paid", return_cancels: "=product_return_cancels_plan", tender: "=plan_refund_tender"}
        Northgate Care 4-Year Mattress & Furniture Plan: {full_days: "=cancellation_full_refund_days", prorate: "=cancellation_prorated_after_window", admin_fee: "=cancellation_admin_fee_usd", deduct_claims: "=refund_deducts_claims_paid", return_cancels: "=product_return_cancels_plan", tender: "=plan_refund_tender"}
        Northgate Care 3-Year Appliance Plan: {full_days: "=cancellation_full_refund_days", prorate: "=cancellation_prorated_after_window", admin_fee: "=cancellation_admin_fee_usd", deduct_claims: "=refund_deducts_claims_paid", return_cancels: "=product_return_cancels_plan", tender: "=plan_refund_tender"}
        Northgate Care 5-Year Appliance Plan: {full_days: "=cancellation_full_refund_days", prorate: "=cancellation_prorated_after_window", admin_fee: "=cancellation_admin_fee_usd", deduct_claims: "=refund_deducts_claims_paid", return_cancels: "=product_return_cancels_plan", tender: "=plan_refund_tender"}
    formula:
      prorated_refund: max(0, round(protection_msr_plan_charge * protection_msr_unused_whole_months / term_months - cancellation_admin_fee_usd - (protection_msr_claims_paid if refund_deducts_claims_paid else 0), 2))

  - id: protection_term_end_transfer
    subject: [protection_plan_expired]
    rule: >
      A plan expires the day after its coverage_end_date and is never renewed or extended while renewal_offered
      is false. Where transferable_with_product is true, a plan passes with the product to a new owner through
      the plan administrator, keeping its dates, limit and claim history; member services does not move a plan
      to another member's profile.
    eligibility: []
    params:
      per_tier:
        Northgate Care 2-Year Electronics Plan: {renewal: "=renewal_offered", transferable: "=transferable_with_product"}
        Northgate Care 3-Year Electronics Plan: {renewal: "=renewal_offered", transferable: "=transferable_with_product"}
        Northgate Care 3-Year Electronics Plan with Accident Protection: {renewal: "=renewal_offered", transferable: "=transferable_with_product"}
        Northgate Care 4-Year Mattress & Furniture Plan: {renewal: "=renewal_offered", transferable: "=transferable_with_product"}
        Northgate Care 3-Year Appliance Plan: {renewal: "=renewal_offered", transferable: "=transferable_with_product"}
        Northgate Care 5-Year Appliance Plan: {renewal: "=renewal_offered", transferable: "=transferable_with_product"}

  - id: protection_plan_refund_once
    subject: [protection_plan_refunded, protection_plan_charged]
    rule: >
      A plan is charged once and refunded at most once: a plan charge already refunded is never refunded
      again, whether the cancellation came from the holder or from a product return. A plan charge is never
      reduced after purchase for a price change on the product.
    eligibility:
      - id: refund_once
        applies_to: [protection_plan_refunded]
        kind: dedup
        condition: a plan charge already refunded is never refunded again
        evidence_fields: [protection_events.source_event_id, protection_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protection_events.source_event_id]
          action_bindings:
            protection_events.source_event_id: source_event_id
        dedup_contract:
          table: protection_events
          mode: separate_record
          object_bindings: {source_event_id: source_event_id}
          duplicate_filters: {event_type: [protection_plan_refunded]}
          distinct_fields: []
