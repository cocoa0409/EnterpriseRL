# Northgate Wholesale Club — Northgate Care protection plan charter.
# Northgate Care plans are extended service contracts bought for one product on one sale line, priced from a
# threshold ladder on the product's price and administered for Northgate by its plan administrator. Each plan
# is a holding whose tier is the plan; it is booked through the plan charge and refunds, and its claims and
# settlements run against the product's price as the limit of liability.

category: protection
display_name: Northgate Care Protection Plans

binding:
  holding_table: protection_holdings
  event_tables: [protection_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [active, fulfilled, expired, cancelled]
  transitions:
    - {from: active, to: expired, by: system, means: "The coverage end date passes."}
    - {from: active, to: fulfilled, by: agent, means: "A claim is settled by replacement or cash settlement, which ends the plan."}
    - {from: active, to: cancelled, by: agent, means: "The plan holder cancels the plan, or the covered product is returned."}

accounts:
  - key: plan_fees
    unit: USD
    meaning: What the plan holder has paid for the plan, net of refunds.

parameter_schema:
  term_months: "length of coverage from the coverage start date (calendar months)"
  coverage_start_basis: "the record date coverage starts on (string code)"
  overlaps_manufacturer_warranty: "whether the plan runs alongside the manufacturer's warranty rather than after it (boolean)"
  eligible_merchandise_classes: "merchandise classes the plan can be bought for (list of merchandise_class values)"
  min_product_price_usd: "lowest product price the plan can cover (USD)"
  max_product_price_usd: "highest product price the plan can cover (USD)"
  plan_price_ladder_usd: "plan price by the product's price band; the first band whose up_to is at or above the product price applies (ladder of {up_to, price})"
  purchase_window_days: "calendar days after the product's sale date within which the plan can be bought (days)"
  purchase_channels: "purchase channels whose sale lines the plan can cover (list of official channel names)"
  covers_mechanical_electrical: "whether mechanical and electrical failures from normal use are covered (boolean)"
  covers_power_surge: "whether power surge damage is covered (boolean)"
  covers_accidental_damage: "whether drops, spills and cracked screens are covered (boolean)"
  accident_claims_max: "accidental damage claims allowed over the term (count)"
  accident_deductible_usd: "deductible per accidental damage claim (USD)"
  covers_stains: "whether accidental stains are covered (boolean)"
  stain_types_covered: "stain types covered (list of strings)"
  covers_structural_failure: "whether frame, spring and support failures are covered (boolean)"
  mattress_sag_depth_inches: "body impression depth at which sagging counts as a structural failure; 0 where not applicable (inches)"
  covers_cosmetic_damage: "whether cosmetic damage that does not affect function is covered (boolean)"
  covers_batteries: "whether built-in batteries are covered (boolean)"
  battery_capacity_threshold_pct: "battery capacity below which a covered battery counts as failed (percent)"
  dead_pixel_min_count: "dead pixels at which a display counts as failed; 0 where not applicable (count)"
  in_home_service_available: "whether repairs or inspections are done in the home (boolean)"
  in_home_min_screen_inches: "smallest television screen serviced in the home; 0 where not applicable (inches)"
  depot_shipping_paid: "whether shipping to and from the repair depot is paid by the plan (boolean)"
  no_lemon_repair_count: "repairs of the same failure after which the next failure is settled by replacement (count)"
  replacement_basis: "what a replacement is (string code)"
  cash_settlement_basis: "how a cash settlement is valued (string code)"
  limit_of_liability_basis: "what caps all claims paid on the plan (string code)"
  plan_ends_on_replacement: "whether a replacement or cash settlement fulfills and ends the plan (boolean)"
  food_spoilage_limit_usd: "reimbursement for food lost to a covered refrigerator or freezer failure; 0.00 where not applicable (USD)"
  claim_report_days_after_failure: "calendar days after the failure date within which the claim must be filed (days)"
  cancellation_full_refund_days: "calendar days after plan purchase during which a cancellation with no claim paid is refunded in full (days)"
  cancellation_prorated_after_window: "whether a later cancellation refunds the unused whole months (boolean)"
  cancellation_admin_fee_usd: "administrative fee deducted from a prorated cancellation refund (USD)"
  refund_deducts_claims_paid: "whether claims already paid are deducted from a cancellation refund (boolean)"
  transferable_with_product: "whether the plan passes to a new owner of the product (boolean)"
  product_return_cancels_plan: "whether returning the covered product cancels the plan with a full refund (boolean)"
  commercial_use_covered_for_business_members: "whether products bought on a business-segment membership stay covered in commercial use (boolean)"
  pre_existing_damage_excluded: "whether damage present before coverage started is excluded (boolean)"
  normal_wear_excluded: "whether normal wear and tear is excluded (boolean)"
  consumable_parts_excluded: "whether filters, bulbs, remotes and other consumables are excluded (boolean)"
  claim_channel: "how a claim is filed (string code)"
  plan_price_reward_eligible: "whether the plan price earns Annual Reward (boolean)"
  plan_refund_tender: "where plan refunds are paid (string code)"
  plans_per_sale_line: "plans that may cover one sale line (count)"
  repair_period_extends_term: "whether time spent in repair extends the coverage end date (boolean)"
  renewal_offered: "whether the plan can be renewed or extended at the end of its term (boolean)"

