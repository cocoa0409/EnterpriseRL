events:
  - type: tire_install_booked
    target: tire_holdings
    mutation: create
    meaning: An installation appointment is booked for tires bought on a Northgate purchase, under the package the member chose.
    grain: one row per set of tires booked for one vehicle
    fields:
      customer_id: the member
      order_id: the purchase on which the tires were bought
      variant_name: the installation package chosen
      status: always awaiting_install on booking
      vehicle_description: the vehicle on the work order
      tire_size: the tire size
      tire_item_number: the tire model's item number
      tire_unit_price: the price paid per tire
      tire_count: the number of tires in the set
      treadwear_warranty_miles: the manufacturer's treadwear mileage warranty
      appointment_date: the booked installation date
      install_date: empty until installed
      install_odometer: 0 until installed
    triggers: []

  - type: tire_appointment_rescheduled
    target: tire_holdings
    mutation: update
    meaning: The member moves the installation appointment to another date.
    grain: one row per reschedule
    fields:
      appointment_date: the new installation date
    triggers: []

  - type: tire_installed
    target: tire_holdings
    mutation: {transition: {from: awaiting_install, to: installed}}
    meaning: The Tire Center mounts the set and closes the installation work order.
    grain: one row per set installed
    fields:
      status: becomes installed
      install_date: the installation date
      install_odometer: the odometer on the installation work order
    triggers:
      - event: tire:tire_service_charged
        map: {charge_component: installation_package, tire_position: all_positions, service_date: install_date, odometer_miles: install_odometer}

  - type: tire_install_cancelled
    target: tire_holdings
    mutation: {transition: {from: awaiting_install, to: cancelled}}
    meaning: The installation is cancelled before the tires are mounted.
    grain: one row per cancelled installation
    fields:
      status: becomes cancelled
      closed_date: the cancellation date
    triggers: []

  - type: tire_set_retired
    target: tire_holdings
    mutation: {transition: {from: installed, to: retired}}
    meaning: The package ends for the set.
    grain: one row per package ended
    fields:
      status: becomes retired
      closed_date: the date the package ended
    triggers: []

  - type: tire_service_charged
    target: tire_services
    meaning: A Tire Center fee or a replacement tire is charged on the package.
    grain: one row per charge component per wheel position per service date
    distinguish_by: [charge_component, tire_position, service_date]
    fields:
      service_date: the date of the work order
      odometer_miles: the odometer on the work order
      tire_position: the wheel position charged, or all_positions
      charge_component: what is charged
      amount: the charge
      source_event_id: for a replacement tire, the road hazard or treadwear entry that led to it
    account: tire_charges
    direction: in
    triggers: []

  - type: tire_service_credited
    target: tire_services
    meaning: A credit is applied on the package — a road hazard or treadwear credit toward a replacement, or a refund of a charge.
    grain: one row per credit of one kind against one source entry
    distinguish_by: [source_event_id, charge_component]
    fields:
      service_date: the date of the credit
      tire_position: the wheel position concerned
      charge_component: road_hazard_credit, treadwear_credit or package_refund
      amount: the credit
      source_event_id: the road hazard or treadwear entry, or the charge refunded
    account: tire_charges
    direction: out
    triggers: []

  - type: tire_rotation_performed
    target: tire_services
    meaning: The set is rotated (and rebalanced where needed) at a Tire Center.
    grain: one row per rotation visit
    distinguish_by: [service_date]
    fields:
      service_date: the visit date
      odometer_miles: the odometer on the work order
      tire_position: always all_positions
      remaining_tread_32nds: the shallowest tread measured on the set
    triggers: []

  - type: tire_flat_repaired
    target: tire_services
    meaning: A repairable puncture in one tire is plugged and patched.
    grain: one row per tire repaired per visit
    distinguish_by: [service_date, tire_position]
    fields:
      service_date: the visit date
      odometer_miles: the odometer on the work order
      tire_position: the tire repaired
      damage_cause: always puncture_repairable
      remaining_tread_32nds: the tread measured on the tire
    triggers: []

  - type: tire_road_hazard_replaced
    target: tire_services
    meaning: A tire damaged beyond repair by a road hazard is replaced under the package's road hazard protection.
    grain: one row per tire replaced per visit
    distinguish_by: [service_date, tire_position]
    fields:
      service_date: the visit date
      odometer_miles: the odometer on the work order
      tire_position: the tire replaced
      damage_cause: the damage found
      remaining_tread_32nds: the tread measured on the damaged tire
      amount: the credit determined for the damaged tire
    triggers:
      - event: tire:tire_service_credited
        map: {charge_component: road_hazard_credit, source_event_id: tire_event_id, tire_position: tire_position, service_date: service_date}
      - event: tire:tire_service_charged
        map: {charge_component: replacement_tire, source_event_id: tire_event_id, tire_position: tire_position, service_date: service_date}

  - type: tire_treadwear_adjusted
    target: tire_services
    meaning: A tire worn out before its manufacturer's treadwear mileage is credited pro rata toward a replacement.
    grain: one row per tire adjusted per visit
    distinguish_by: [service_date, tire_position]
    fields:
      service_date: the visit date
      odometer_miles: the odometer on the claim work order
      tire_position: the tire adjusted
      remaining_tread_32nds: the tread measured on the worn tire
      amount: the credit determined for the worn tire
    triggers:
      - event: tire:tire_service_credited
        map: {charge_component: treadwear_credit, source_event_id: tire_event_id, tire_position: tire_position, service_date: service_date}
      - event: tire:tire_service_charged
        map: {charge_component: replacement_tire, source_event_id: tire_event_id, tire_position: tire_position, service_date: service_date}

measures:
  - id: tire_msr_road_hazard_replacements
    window: the life of the package
    measure: count of tire_road_hazard_replaced entries on the package
  - id: tire_msr_wear_pct
    window: the tire concerned, on the visit
    measure: (new_tread_depth_32nds minus remaining_tread_32nds) divided by (new_tread_depth_32nds minus coverage_end_tread_32nds), times 100
  - id: tire_msr_remaining_usable_fraction
    window: the tire concerned, on the visit
    measure: (remaining_tread_32nds minus coverage_end_tread_32nds) divided by (new_tread_depth_32nds minus coverage_end_tread_32nds), never below 0
  - id: tire_msr_miles_driven
    window: from installation to the visit
    measure: odometer_miles on the visit's work order minus install_odometer
  - id: tire_msr_max_rotation_gap_miles
    window: from installation to the claim visit
    measure: the largest difference between consecutive odometer readings in the sequence formed by install_odometer, the odometer_miles of every tire_rotation_performed entry on the package in date order, and the claim visit's odometer_miles
  - id: tire_msr_current_tire_price
    window: the service date
    measure: the unit_price of the item_price_history record of price_type regular for tire_item_number on Northgate In-Club Purchase in effect on the service date

policies:
  - id: tire_agg_multi_holding
    subject: [tire_install_booked]
    rule: >
      A member may hold installation packages on as many vehicles as they own, and a new package on another
      vehicle never affects an existing one. Each package covers only the set it was sold with; charges,
      credits, rotations and road hazard replacements on one package are never applied to another.
    eligibility: []
    params:
      max_per_customer: null

  - id: tire_agg_vehicle_package
    subject: [tire_install_booked, tire_set_retired]
    rule: >
      A new set may not be booked for a vehicle that already has a package whose status is awaiting_install.
      A vehicle may carry an installed package and a newly booked one only until the new set is installed:
      when the new set replaces every tire of the earlier set, the earlier package is retired on the new
      installation date; when it replaces only some, the replaced tires leave the earlier package's coverage
      and the others stay covered by it. Road hazard replacements, rotations and treadwear claims are counted
      across the whole package, not per tire, and a replacement tire stays on the package it replaced into.
    eligibility:
      - id: one_package_per_vehicle
        applies_to: [tire_install_booked]
        kind: dedup
        condition: A new set may not be booked for a vehicle that already has a package whose status is awaiting_install.
        evidence_fields: [tire_holdings.customer_id, tire_holdings.vehicle_description, tire_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_holdings.customer_id, tire_holdings.vehicle_description]
          action_bindings:
            tire_holdings.customer_id: customer_id
            tire_holdings.vehicle_description: vehicle_description
        dedup_contract:
          table: tire_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id, vehicle_description: vehicle_description}
          duplicate_filters: {status: [awaiting_install]}
          distinct_fields: [tire_size, appointment_date]

  - id: tire_installation_charges
    subject: [tire_installed, tire_service_charged]
    rule: >
      The Tire Center installs a package only on a vehicle of the package's vehicle_class with a gross vehicle
      weight rating no higher than max_gvwr_lbs and wheels no larger than max_wheel_diameter_inches; tires for
      a vehicle outside those limits are refused at the bay. On the installation date the package is charged
      package_price_per_tire_usd for each tire in tire_count as one installation_package entry, a
      tire_disposal_fee entry of tire_disposal_fee_usd for each old tire removed when that fee is not zero,
      and a tpms_service_kit entry of tpms_service_kit_fee_usd for each wheel with a pressure sensor when that
      fee is not zero. Mounting, balancing by balance_method, new valve stems, nitrogen inflation, an alignment
      check and a re-torque check are included exactly as the package's switches say. Tire Center fees never
      earn Annual Reward; the tires themselves are merchandise on the purchase.
    eligibility: []
    params:
      per_tier:
        Northgate Tire Mount & Balance: {per_tire: "=package_price_per_tire_usd", disposal: "=tire_disposal_fee_usd", tpms_kit: "=tpms_service_kit_fee_usd", gvwr: "=max_gvwr_lbs", wheel: "=max_wheel_diameter_inches", class: "=vehicle_class", balance: "=balance_method", stems: "=new_valve_stems_included", nitrogen: "=nitrogen_inflation_included", alignment: "=alignment_check_included", retorque: "=retorque_check_included", mount: "=mount_and_balance_included"}
        Northgate Tire Installation Package: {per_tire: "=package_price_per_tire_usd", disposal: "=tire_disposal_fee_usd", tpms_kit: "=tpms_service_kit_fee_usd", gvwr: "=max_gvwr_lbs", wheel: "=max_wheel_diameter_inches", class: "=vehicle_class", balance: "=balance_method", stems: "=new_valve_stems_included", nitrogen: "=nitrogen_inflation_included", alignment: "=alignment_check_included", retorque: "=retorque_check_included", mount: "=mount_and_balance_included"}
        Northgate Light Truck Tire Installation Package: {per_tire: "=package_price_per_tire_usd", disposal: "=tire_disposal_fee_usd", tpms_kit: "=tpms_service_kit_fee_usd", gvwr: "=max_gvwr_lbs", wheel: "=max_wheel_diameter_inches", class: "=vehicle_class", balance: "=balance_method", stems: "=new_valve_stems_included", nitrogen: "=nitrogen_inflation_included", alignment: "=alignment_check_included", retorque: "=retorque_check_included", mount: "=mount_and_balance_included"}
        Northgate Tire Installation Package with Road Hazard: {per_tire: "=package_price_per_tire_usd", disposal: "=tire_disposal_fee_usd", tpms_kit: "=tpms_service_kit_fee_usd", gvwr: "=max_gvwr_lbs", wheel: "=max_wheel_diameter_inches", class: "=vehicle_class", balance: "=balance_method", stems: "=new_valve_stems_included", nitrogen: "=nitrogen_inflation_included", alignment: "=alignment_check_included", retorque: "=retorque_check_included", mount: "=mount_and_balance_included"}
        Northgate Premium Tire Care: {per_tire: "=package_price_per_tire_usd", disposal: "=tire_disposal_fee_usd", tpms_kit: "=tpms_service_kit_fee_usd", gvwr: "=max_gvwr_lbs", wheel: "=max_wheel_diameter_inches", class: "=vehicle_class", balance: "=balance_method", stems: "=new_valve_stems_included", nitrogen: "=nitrogen_inflation_included", alignment: "=alignment_check_included", retorque: "=retorque_check_included", mount: "=mount_and_balance_included"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {per_tire: "=package_price_per_tire_usd", disposal: "=tire_disposal_fee_usd", tpms_kit: "=tpms_service_kit_fee_usd", gvwr: "=max_gvwr_lbs", wheel: "=max_wheel_diameter_inches", class: "=vehicle_class", balance: "=balance_method", stems: "=new_valve_stems_included", nitrogen: "=nitrogen_inflation_included", alignment: "=alignment_check_included", retorque: "=retorque_check_included", mount: "=mount_and_balance_included"}
    formula:
      package_amount: round(package_price_per_tire_usd * tire_count, 2)
      disposal_amount: round(tire_disposal_fee_usd * tire_count, 2)

  - id: tire_service_eligibility
    subject: [tire_rotation_performed, tire_flat_repaired, tire_road_hazard_replaced, tire_treadwear_adjusted]
    rule: >
      Services under a package are performed at any Northgate Tire Center where service_at_any_club is true,
      and every work order records the odometer where work_order_odometer_required is true. Package services
      are performed only on a package whose status is installed. Where membership_required_for_service is
      true, package services are performed only while the membership on the tires' purchase has status
      active; a member whose membership has lapsed renews it before the Tire Center will rotate, repair,
      replace or adjust a tire, and the lapse does not shorten or extend any term of the package.
    eligibility:
      - id: package_installed
        applies_to: [tire_rotation_performed, tire_flat_repaired, tire_road_hazard_replaced, tire_treadwear_adjusted]
        kind: state
        condition: Package services are performed only on a package whose status is installed.
        evidence_fields: [tire_holdings.status, tire_holdings.tire_service_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_holdings.tire_service_id]
          action_bindings:
            tire_holdings.tire_service_id: tire_service_id
        state_contract:
          field: tire_holdings.status
          allowed: [installed]
      - id: membership_active_for_service
        applies_to: [tire_rotation_performed, tire_flat_repaired, tire_road_hazard_replaced, tire_treadwear_adjusted]
        kind: state
        condition: Where membership_required_for_service is true, package services are performed only while the membership on the tires' purchase has status active; a member whose membership has lapsed renews it before the Tire Center will rotate, repair, replace or adjust a tire, and the lapse does not shorten or extend any term of the package.
        evidence_fields: [membership_holdings.status, order_holdings.membership_id, tire_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_holdings.order_id]
          action_bindings:
            tire_holdings.order_id: order_id
        state_contract:
          field: membership_holdings.status
          allowed: [active]
    params:
      per_tier:
        Northgate Tire Mount & Balance: {members_only: "=membership_required_for_service", any_club: "=service_at_any_club", odometer: "=work_order_odometer_required"}
        Northgate Tire Installation Package: {members_only: "=membership_required_for_service", any_club: "=service_at_any_club", odometer: "=work_order_odometer_required"}
        Northgate Light Truck Tire Installation Package: {members_only: "=membership_required_for_service", any_club: "=service_at_any_club", odometer: "=work_order_odometer_required"}
        Northgate Tire Installation Package with Road Hazard: {members_only: "=membership_required_for_service", any_club: "=service_at_any_club", odometer: "=work_order_odometer_required"}
        Northgate Premium Tire Care: {members_only: "=membership_required_for_service", any_club: "=service_at_any_club", odometer: "=work_order_odometer_required"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {members_only: "=membership_required_for_service", any_club: "=service_at_any_club", odometer: "=work_order_odometer_required"}

  - id: tire_lifetime_services
    subject: [tire_rotation_performed, tire_flat_repaired, tire_service_charged]
    rule: >
      Rotations are free where lifetime_rotation_included is true and otherwise cost rotation_fee_usd per
      visit; the Tire Center recommends one every recommended_rotation_interval_miles. Rebalancing is free
      where lifetime_rebalance_included is true and otherwise costs rebalance_fee_per_tire_usd per tire. A
      puncture is repairable only when it is no wider than flat_repair_max_puncture_inches and, where
      flat_repair_tread_area_only is true, lies in the tread area; repairable flats are free where
      flat_repair_included is true and otherwise cost flat_repair_fee_usd. A puncture that is wider, in the
      shoulder or sidewall, or overlaps an earlier repair is non-repairable and can only be replaced — under
      road hazard protection where the package has it, at the member's expense otherwise. Flat-tire roadside
      assistance is available for roadside_assistance_months from installation. Each fee is its own entry on
      the visit's service date.
    eligibility: []
    params:
      per_tier:
        Northgate Tire Mount & Balance: {rotation_free: "=lifetime_rotation_included", rotation_fee: "=rotation_fee_usd", interval: "=recommended_rotation_interval_miles", rebalance_free: "=lifetime_rebalance_included", rebalance_fee: "=rebalance_fee_per_tire_usd", flat_free: "=flat_repair_included", flat_fee: "=flat_repair_fee_usd", max_puncture: "=flat_repair_max_puncture_inches", tread_only: "=flat_repair_tread_area_only", roadside_months: "=roadside_assistance_months"}
        Northgate Tire Installation Package: {rotation_free: "=lifetime_rotation_included", rotation_fee: "=rotation_fee_usd", interval: "=recommended_rotation_interval_miles", rebalance_free: "=lifetime_rebalance_included", rebalance_fee: "=rebalance_fee_per_tire_usd", flat_free: "=flat_repair_included", flat_fee: "=flat_repair_fee_usd", max_puncture: "=flat_repair_max_puncture_inches", tread_only: "=flat_repair_tread_area_only", roadside_months: "=roadside_assistance_months"}
        Northgate Light Truck Tire Installation Package: {rotation_free: "=lifetime_rotation_included", rotation_fee: "=rotation_fee_usd", interval: "=recommended_rotation_interval_miles", rebalance_free: "=lifetime_rebalance_included", rebalance_fee: "=rebalance_fee_per_tire_usd", flat_free: "=flat_repair_included", flat_fee: "=flat_repair_fee_usd", max_puncture: "=flat_repair_max_puncture_inches", tread_only: "=flat_repair_tread_area_only", roadside_months: "=roadside_assistance_months"}
        Northgate Tire Installation Package with Road Hazard: {rotation_free: "=lifetime_rotation_included", rotation_fee: "=rotation_fee_usd", interval: "=recommended_rotation_interval_miles", rebalance_free: "=lifetime_rebalance_included", rebalance_fee: "=rebalance_fee_per_tire_usd", flat_free: "=flat_repair_included", flat_fee: "=flat_repair_fee_usd", max_puncture: "=flat_repair_max_puncture_inches", tread_only: "=flat_repair_tread_area_only", roadside_months: "=roadside_assistance_months"}
        Northgate Premium Tire Care: {rotation_free: "=lifetime_rotation_included", rotation_fee: "=rotation_fee_usd", interval: "=recommended_rotation_interval_miles", rebalance_free: "=lifetime_rebalance_included", rebalance_fee: "=rebalance_fee_per_tire_usd", flat_free: "=flat_repair_included", flat_fee: "=flat_repair_fee_usd", max_puncture: "=flat_repair_max_puncture_inches", tread_only: "=flat_repair_tread_area_only", roadside_months: "=roadside_assistance_months"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {rotation_free: "=lifetime_rotation_included", rotation_fee: "=rotation_fee_usd", interval: "=recommended_rotation_interval_miles", rebalance_free: "=lifetime_rebalance_included", rebalance_fee: "=rebalance_fee_per_tire_usd", flat_free: "=flat_repair_included", flat_fee: "=flat_repair_fee_usd", max_puncture: "=flat_repair_max_puncture_inches", tread_only: "=flat_repair_tread_area_only", roadside_months: "=roadside_assistance_months"}

  - id: tire_road_hazard_protection
    subject: [tire_road_hazard_replaced, tire_service_credited, tire_service_charged]
    rule: >
      On a package with road_hazard_included, a tire damaged by a cause in road_hazard_covered_causes is
      replaced with a new tire of the same item. A road hazard replacement is made only when the damage is
      brought to a Tire Center no later than road_hazard_term_months calendar months after the installation
      date of the package. Calendar months are added to the installation date and, when the resulting month
      has no such day, the boundary falls on that month's last day. A tire is covered only while its
      remaining_tread_32nds is above coverage_end_tread_32nds. A package receives at most
      road_hazard_replacements_max road hazard replacements, counted by tire_msr_road_hazard_replacements. The
      damaged tire is credited at the full tire_unit_price when tire_msr_wear_pct is at or below
      road_hazard_full_credit_max_wear_pct and otherwise at tire_unit_price times
      tire_msr_remaining_usable_fraction; the new tire is charged at tire_msr_current_tire_price per
      replacement_tire_price_basis, so the member pays the difference. Mounting, balancing and a valve stem
      for the replacement are free where road_hazard_replacement_install_included is true and charged at the
      package's per-tire price otherwise. A credit is applied only to the replacement and is never paid out in
      cash while road_hazard_credit_cash_out is false. A matching full-size spare bought in the set is covered
      where full_size_spare_covered is true. The replacement keeps the package's remaining term where
      replacement_inherits_remaining_term is true. Damage from collision, vandalism, off-road or racing use,
      improper inflation or mechanical faults of the vehicle is not a road hazard.
    eligibility:
      - id: road_hazard_term
        applies_to: [tire_road_hazard_replaced]
        kind: time
        condition: A road hazard replacement is made only when the damage is brought to a Tire Center no later than road_hazard_term_months calendar months after the installation date of the package.
        evidence_fields: [tire_holdings.install_date, tire_holdings.tire_service_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_holdings.tire_service_id]
          action_bindings:
            tire_holdings.tire_service_id: tire_service_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the installation date of the package
          anchor_source: tire_holdings.install_date
          relation: not_after
          duration_source: variants.road_hazard_term_months
          unit: calendar_months
          counting_rule: Calendar months are added to the installation date and, when the resulting month has no such day, the boundary falls on that month's last day.
          boundary: inclusive
      - id: tread_above_coverage_end
        applies_to: [tire_road_hazard_replaced]
        kind: authorization
        condition: A tire is covered only while its remaining_tread_32nds is above coverage_end_tread_32nds.
        evidence_fields: [tire_services.remaining_tread_32nds, tire_services.tire_service_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_services.tire_service_id]
          action_bindings:
            tire_services.tire_service_id: tire_service_id
      - id: replacement_count_limit
        applies_to: [tire_road_hazard_replaced]
        kind: authorization
        condition: A package receives at most road_hazard_replacements_max road hazard replacements, counted by tire_msr_road_hazard_replacements.
        evidence_fields: [tire_services.tire_service_id, tire_services.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_services.tire_service_id]
          action_bindings:
            tire_services.tire_service_id: tire_service_id
    measures: [tire_msr_road_hazard_replacements, tire_msr_wear_pct, tire_msr_remaining_usable_fraction, tire_msr_current_tire_price]
    params:
      per_tier:
        Northgate Tire Mount & Balance: {covered: "=road_hazard_included", term_months: "=road_hazard_term_months", causes: "=road_hazard_covered_causes", full_credit_wear_pct: "=road_hazard_full_credit_max_wear_pct", max_replacements: "=road_hazard_replacements_max", free_install: "=road_hazard_replacement_install_included", spare: "=full_size_spare_covered", proration: "=road_hazard_proration_basis", cash_out: "=road_hazard_credit_cash_out", inherits_term: "=replacement_inherits_remaining_term", end_tread: "=coverage_end_tread_32nds", new_tread: "=new_tread_depth_32nds", price_basis: "=replacement_tire_price_basis", measured_at: "=tread_measurement_point"}
        Northgate Tire Installation Package: {covered: "=road_hazard_included", term_months: "=road_hazard_term_months", causes: "=road_hazard_covered_causes", full_credit_wear_pct: "=road_hazard_full_credit_max_wear_pct", max_replacements: "=road_hazard_replacements_max", free_install: "=road_hazard_replacement_install_included", spare: "=full_size_spare_covered", proration: "=road_hazard_proration_basis", cash_out: "=road_hazard_credit_cash_out", inherits_term: "=replacement_inherits_remaining_term", end_tread: "=coverage_end_tread_32nds", new_tread: "=new_tread_depth_32nds", price_basis: "=replacement_tire_price_basis", measured_at: "=tread_measurement_point"}
        Northgate Light Truck Tire Installation Package: {covered: "=road_hazard_included", term_months: "=road_hazard_term_months", causes: "=road_hazard_covered_causes", full_credit_wear_pct: "=road_hazard_full_credit_max_wear_pct", max_replacements: "=road_hazard_replacements_max", free_install: "=road_hazard_replacement_install_included", spare: "=full_size_spare_covered", proration: "=road_hazard_proration_basis", cash_out: "=road_hazard_credit_cash_out", inherits_term: "=replacement_inherits_remaining_term", end_tread: "=coverage_end_tread_32nds", new_tread: "=new_tread_depth_32nds", price_basis: "=replacement_tire_price_basis", measured_at: "=tread_measurement_point"}
        Northgate Tire Installation Package with Road Hazard: {covered: "=road_hazard_included", term_months: "=road_hazard_term_months", causes: "=road_hazard_covered_causes", full_credit_wear_pct: "=road_hazard_full_credit_max_wear_pct", max_replacements: "=road_hazard_replacements_max", free_install: "=road_hazard_replacement_install_included", spare: "=full_size_spare_covered", proration: "=road_hazard_proration_basis", cash_out: "=road_hazard_credit_cash_out", inherits_term: "=replacement_inherits_remaining_term", end_tread: "=coverage_end_tread_32nds", new_tread: "=new_tread_depth_32nds", price_basis: "=replacement_tire_price_basis", measured_at: "=tread_measurement_point"}
        Northgate Premium Tire Care: {covered: "=road_hazard_included", term_months: "=road_hazard_term_months", causes: "=road_hazard_covered_causes", full_credit_wear_pct: "=road_hazard_full_credit_max_wear_pct", max_replacements: "=road_hazard_replacements_max", free_install: "=road_hazard_replacement_install_included", spare: "=full_size_spare_covered", proration: "=road_hazard_proration_basis", cash_out: "=road_hazard_credit_cash_out", inherits_term: "=replacement_inherits_remaining_term", end_tread: "=coverage_end_tread_32nds", new_tread: "=new_tread_depth_32nds", price_basis: "=replacement_tire_price_basis", measured_at: "=tread_measurement_point"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {covered: "=road_hazard_included", term_months: "=road_hazard_term_months", causes: "=road_hazard_covered_causes", full_credit_wear_pct: "=road_hazard_full_credit_max_wear_pct", max_replacements: "=road_hazard_replacements_max", free_install: "=road_hazard_replacement_install_included", spare: "=full_size_spare_covered", proration: "=road_hazard_proration_basis", cash_out: "=road_hazard_credit_cash_out", inherits_term: "=replacement_inherits_remaining_term", end_tread: "=coverage_end_tread_32nds", new_tread: "=new_tread_depth_32nds", price_basis: "=replacement_tire_price_basis", measured_at: "=tread_measurement_point"}
    formula:
      road_hazard_credit: tire_unit_price if tire_msr_wear_pct <= road_hazard_full_credit_max_wear_pct else round(tire_unit_price * tire_msr_remaining_usable_fraction, 2)
      replacement_charge: tire_msr_current_tire_price

  - id: tire_treadwear_warranty
    subject: [tire_treadwear_adjusted, tire_service_credited, tire_service_charged]
    rule: >
      Where treadwear_claim_supported is true, the Tire Center processes the manufacturer's treadwear mileage
      warranty for tires on the package. A tire qualifies for a treadwear claim only when its
      remaining_tread_32nds is at or below treadwear_claim_max_tread_32nds while tire_msr_miles_driven is below
      treadwear_warranty_miles. The claim also requires proof of regular rotation: tire_msr_max_rotation_gap_miles
      may not exceed treadwear_rotation_max_interval_miles. The credit is tire_unit_price times the miles
      remaining on the warranty divided by treadwear_warranty_miles, per treadwear_proration_basis, rounded to
      the cent; the replacement of the same item is charged at tire_msr_current_tire_price and installed at
      the package's per-tire price. A tire model with treadwear_warranty_miles of zero has no treadwear
      warranty. Uneven wear caused by alignment or suspension faults, and tires already replaced under road
      hazard protection, are not treadwear claims. A credit is applied only to the replacement.
    eligibility:
      - id: worn_before_warranty_miles
        applies_to: [tire_treadwear_adjusted]
        kind: authorization
        condition: A tire qualifies for a treadwear claim only when its remaining_tread_32nds is at or below treadwear_claim_max_tread_32nds while tire_msr_miles_driven is below treadwear_warranty_miles.
        evidence_fields: [tire_holdings.install_odometer, tire_holdings.treadwear_warranty_miles, tire_holdings.tire_service_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_holdings.tire_service_id]
          action_bindings:
            tire_holdings.tire_service_id: tire_service_id
      - id: rotation_records
        applies_to: [tire_treadwear_adjusted]
        kind: authorization
        condition: The claim also requires proof of regular rotation
        evidence_fields: [tire_services.odometer_miles, tire_services.event_type, tire_services.tire_service_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_services.tire_service_id]
          action_bindings:
            tire_services.tire_service_id: tire_service_id
    measures: [tire_msr_miles_driven, tire_msr_max_rotation_gap_miles, tire_msr_current_tire_price]
    params:
      per_tier:
        Northgate Tire Mount & Balance: {supported: "=treadwear_claim_supported", worn_at: "=treadwear_claim_max_tread_32nds", max_gap: "=treadwear_rotation_max_interval_miles", proration: "=treadwear_proration_basis", install_price: "=package_price_per_tire_usd"}
        Northgate Tire Installation Package: {supported: "=treadwear_claim_supported", worn_at: "=treadwear_claim_max_tread_32nds", max_gap: "=treadwear_rotation_max_interval_miles", proration: "=treadwear_proration_basis", install_price: "=package_price_per_tire_usd"}
        Northgate Light Truck Tire Installation Package: {supported: "=treadwear_claim_supported", worn_at: "=treadwear_claim_max_tread_32nds", max_gap: "=treadwear_rotation_max_interval_miles", proration: "=treadwear_proration_basis", install_price: "=package_price_per_tire_usd"}
        Northgate Tire Installation Package with Road Hazard: {supported: "=treadwear_claim_supported", worn_at: "=treadwear_claim_max_tread_32nds", max_gap: "=treadwear_rotation_max_interval_miles", proration: "=treadwear_proration_basis", install_price: "=package_price_per_tire_usd"}
        Northgate Premium Tire Care: {supported: "=treadwear_claim_supported", worn_at: "=treadwear_claim_max_tread_32nds", max_gap: "=treadwear_rotation_max_interval_miles", proration: "=treadwear_proration_basis", install_price: "=package_price_per_tire_usd"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {supported: "=treadwear_claim_supported", worn_at: "=treadwear_claim_max_tread_32nds", max_gap: "=treadwear_rotation_max_interval_miles", proration: "=treadwear_proration_basis", install_price: "=package_price_per_tire_usd"}
    formula:
      treadwear_credit: round(tire_unit_price * max(0, treadwear_warranty_miles - tire_msr_miles_driven) / treadwear_warranty_miles, 2)

  - id: tire_appointments
    subject: [tire_install_booked, tire_appointment_rescheduled, tire_install_cancelled]
    rule: >
      An installation appointment is booked for tires bought on a Northgate purchase. An appointment is moved
      only while its status is awaiting_install, and at most appointment_reschedules_allowed times. When the
      member misses the appointment the unmounted tires are held tire_hold_days_after_no_show calendar days;
      if no new date is booked by then the installation is cancelled. A cancelled installation leaves nothing
      charged on the package where cancel_refund_before_install is true, and the unmounted tires can be
      returned under the purchase's own return rules. Once mounted, tires are never returnable for a refund
      while mounted_tires_returnable is false — problems with mounted tires are handled by this charter's
      services, road hazard and treadwear rules.
    eligibility:
      - id: reschedule_before_install
        applies_to: [tire_appointment_rescheduled]
        kind: state
        condition: An appointment is moved only while its status is awaiting_install, and at most appointment_reschedules_allowed times.
        evidence_fields: [tire_holdings.status, tire_holdings.tire_service_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_holdings.tire_service_id]
          action_bindings:
            tire_holdings.tire_service_id: tire_service_id
        state_contract:
          field: tire_holdings.status
          allowed: [awaiting_install]
    params:
      per_tier:
        Northgate Tire Mount & Balance: {reschedules: "=appointment_reschedules_allowed", hold_days: "=tire_hold_days_after_no_show", nothing_charged: "=cancel_refund_before_install", mounted_returnable: "=mounted_tires_returnable"}
        Northgate Tire Installation Package: {reschedules: "=appointment_reschedules_allowed", hold_days: "=tire_hold_days_after_no_show", nothing_charged: "=cancel_refund_before_install", mounted_returnable: "=mounted_tires_returnable"}
        Northgate Light Truck Tire Installation Package: {reschedules: "=appointment_reschedules_allowed", hold_days: "=tire_hold_days_after_no_show", nothing_charged: "=cancel_refund_before_install", mounted_returnable: "=mounted_tires_returnable"}
        Northgate Tire Installation Package with Road Hazard: {reschedules: "=appointment_reschedules_allowed", hold_days: "=tire_hold_days_after_no_show", nothing_charged: "=cancel_refund_before_install", mounted_returnable: "=mounted_tires_returnable"}
        Northgate Premium Tire Care: {reschedules: "=appointment_reschedules_allowed", hold_days: "=tire_hold_days_after_no_show", nothing_charged: "=cancel_refund_before_install", mounted_returnable: "=mounted_tires_returnable"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {reschedules: "=appointment_reschedules_allowed", hold_days: "=tire_hold_days_after_no_show", nothing_charged: "=cancel_refund_before_install", mounted_returnable: "=mounted_tires_returnable"}

  - id: tire_package_end
    subject: [tire_set_retired, tire_service_credited]
    rule: >
      A package ends — is retired — when the member reports the vehicle sold or the set removed from it, when
      every tire of the set has been replaced outside the package, or when a full new set is installed on the
      vehicle. While package_transferable is false the package and every remaining protection end with the
      sale of the vehicle and never pass to the buyer or to another vehicle. Retirement refunds nothing: the
      installation package is a one-time service charge. The only refund of a package charge is a
      package_refund credit when the Tire Center charged a component the package includes or charged twice for
      the same component, credited against that exact charge.
    eligibility:
      - id: refund_once_per_charge
        applies_to: [tire_service_credited]
        kind: dedup
        condition: The only refund of a package charge is a package_refund credit when the Tire Center charged a component the package includes or charged twice for the same component, credited against that exact charge.
        evidence_fields: [tire_services.source_event_id, tire_services.charge_component]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_services.source_event_id]
          action_bindings:
            tire_services.source_event_id: source_event_id
        dedup_contract:
          table: tire_services
          mode: separate_record
          object_bindings: {source_event_id: source_event_id}
          duplicate_filters: {charge_component: [package_refund]}
          distinct_fields: []
    params:
      per_tier:
        Northgate Tire Mount & Balance: {transferable: "=package_transferable"}
        Northgate Tire Installation Package: {transferable: "=package_transferable"}
        Northgate Light Truck Tire Installation Package: {transferable: "=package_transferable"}
        Northgate Tire Installation Package with Road Hazard: {transferable: "=package_transferable"}
        Northgate Premium Tire Care: {transferable: "=package_transferable"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {transferable: "=package_transferable"}
