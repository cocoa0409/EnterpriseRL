        Northgate TV Delivery & Wall-Mount Installation: {placement: "=placement_location", crew: "=crew_size", unpack: "=unpacking_included", assemble: "=assembly_included", debris: "=debris_removal_included", presence: "=customer_presence_required", installs: "=appliance_installation_types", install_labor: "=installation_labor_included", disconnect: "=old_appliance_disconnect_included", max_screen: "=wall_mount_max_screen_inches", surfaces: "=wall_mount_surfaces_supported"}

extended_policies:
  - id: delivery_ext_distance_settlement
    base_policy_refs: [delivery_booking_and_fees, delivery_reschedule, delivery_failed_attempts]
    overwrite:
      - base_policy: delivery_booking_and_fees
        superseded_clause: >-
          road miles beyond included_radius_miles at extended_distance_fee_per_mile_usd each
        replaced_by: >-
          The extended-distance charge is every road mile beyond the included radius at the service level's
          per-mile fee, with no reduction, schedule or discount.
      - base_policy: delivery_booking_and_fees
        superseded_clause: >-
          At booking the following are charged, each as its own entry dated the booking date with the
          appointment date as service_date
        replaced_by: >-
          An appointment whose road miles from the delivering club exceed the service level's included radius
          owes an extended-distance charge, posted as one extended-distance entry dated the posting date with the
          appointment's currently booked delivery date as its service date.
    trigger: state_due
    subject: [delivery_service_charged]
    computes: amount
    target_tool: post_extended_distance_charge_120a0e6d
    params:
      plus_reduction_business_plus: 0.30
      plus_reduction_club_plus: 0.20
      large_purchase_usd: 3000.00
      mid_purchase_usd: 2000.00
      rate_large_purchase: 0.90
      rate_mid_purchase: 1.10
      year_spend_high: 5000.00
      year_spend_mid: 2500.00
      schedule_band_miles: 10
      schedule_outer_share: 0.5
      tenure_long_months: 120
      tenure_mid_months: 60
      tenure_long_pct: 10
      tenure_mid_pct: 5
    rule: >
      An appointment whose road miles from the delivering club exceed the service level's included radius
      owes an extended-distance charge, posted as one extended-distance entry dated the posting date with the
      appointment's currently booked delivery date as its service date. The entry carries as its units the
      appointment's road miles beyond the included radius. An appointment whose road miles do not exceed the
      included radius owes no extended-distance charge. The extended-distance charge is every road mile beyond
      the included radius at the service level's per-mile fee, with no reduction, schedule or discount. The
      charge is rounded to the cent once, at the end, half up.
      The per-mile fee follows the merchandise on the purchase being delivered, counted as the amounts of its
      sale lines less the amounts of its returned lines: merchandise of $3,000.00 or more is charged $0.90 a
      mile, merchandise of $2,000.00 or more but under $3,000.00 is charged $1.10 a mile, and merchandise under
      $2,000.00 is charged the service level's per-mile fee.
      A Plus reduction then comes off that per-mile fee: a purchase that presented a Northgate Business Plus
      Membership takes $0.30 off each mile, a purchase that presented a Northgate Club Plus Membership takes
      $0.20 off each mile, and a purchase that presented any other membership takes nothing off. Because the
      reduced per-mile fee is never below $0.60, an appointment beyond the included radius always owes a
      charge of more than zero.
      Which of the miles beyond the included radius are charged follows the member's twelve-month spending at
      Northgate, which is the amounts of every sale line the member posted on any purchase less the amounts of
      every returned line the member posted, a line counting only when fewer than twelve whole months separate
      its posting date from today: with twelve-month spending of $5,000.00 or more only the first 10 miles
      beyond the radius are charged and the rest are carried free; with twelve-month spending of $2,500.00 or
      more but under $5,000.00 the first 10 miles beyond the radius are charged in full and every further mile
      counts as half a mile; and with twelve-month spending under $2,500.00 every mile beyond the radius is
      charged in full.
      The mileage amount is the miles so charged times the reduced per-mile fee. A tenure discount is then taken
      off the mileage amount once: a presented membership opened 120 or more whole months before today takes 10
      percent off, one opened 60 to 119 whole months before today takes 5 percent off, and one opened fewer than
      60 whole months before today takes nothing off. Only the final amount is rounded.
    prerequisite: []
    cross_category:
      - category: order
        as: history
        reads: [order_holdings.membership_id, order_lines.line_amount, order_lines.event_type, order_lines.event_date]
        note: The per-mile fee tier reads the delivered purchase's sale and returned line amounts, and the mileage schedule reads every sale and returned line the member posted in the last twelve whole months.
      - category: membership
        as: branch
        reads: [variant_name, opened_date]
        note: The Plus reduction reads the tier of the membership presented on the delivered purchase and the tenure discount its opened date.
    compute:
      - miles_beyond: "MX(0, F('distance_miles') - P('included_radius_miles'))"
      - purchase_sold: "XSUM('order', 'order_lines', 'line_amount', event_type='order_line_sold', order_id=F('order_id'))"
      - purchase_returned: "XSUM('order', 'order_lines', 'line_amount', event_type='order_line_returned', order_id=F('order_id'))"
      - purchase_merchandise: "purchase_sold - purchase_returned"
      - mile_rate: "K('rate_large_purchase') if purchase_merchandise >= K('large_purchase_usd') else (K('rate_mid_purchase') if purchase_merchandise >= K('mid_purchase_usd') else P('extended_distance_fee_per_mile_usd'))"
      - plus_membership: "CFIELD('order', 'membership_id', order_id=F('order_id'))"
      - plus_tier: "CFIELD('membership', 'variant_name', membership_id=plus_membership)"
      - plus_reduction: "K('plus_reduction_business_plus') if plus_tier == 'Northgate Business Plus Membership' else (K('plus_reduction_club_plus') if plus_tier == 'Northgate Club Plus Membership' else 0)"
      - year_sold: "XSUM('order', 'order_lines', 'line_amount', within_months=12, date_field='event_date', event_type='order_line_sold')"
      - year_returned: "XSUM('order', 'order_lines', 'line_amount', within_months=12, date_field='event_date', event_type='order_line_returned')"
      - year_spend: "year_sold - year_returned"
      - inner_miles: "MN(miles_beyond, K('schedule_band_miles'))"
      - outer_miles: "MX(0, miles_beyond - K('schedule_band_miles'))"
      - miles_charged: "inner_miles if year_spend >= K('year_spend_high') else ((inner_miles + K('schedule_outer_share') * outer_miles) if year_spend >= K('year_spend_mid') else miles_beyond)"
      - tenure_months: "MONTHS(CFIELD('membership', 'opened_date', membership_id=plus_membership), NOW)"
      - tenure_pct: "K('tenure_long_pct') if tenure_months >= K('tenure_long_months') else (K('tenure_mid_pct') if tenure_months >= K('tenure_mid_months') else 0)"
      - result: "RND(miles_charged * (mile_rate - plus_reduction) * (1 - tenure_pct / 100), 2)"
    compute_basis:
      miles_beyond: "The entry carries as its units the appointment's road miles beyond the included radius."
      purchase_sold: "The per-mile fee follows the merchandise on the purchase being delivered, counted as the amounts of its sale lines less the amounts of its returned lines"
      purchase_returned: "The per-mile fee follows the merchandise on the purchase being delivered, counted as the amounts of its sale lines less the amounts of its returned lines"
      mile_rate: "merchandise of $3,000.00 or more is charged $0.90 a mile, merchandise of $2,000.00 or more but under $3,000.00 is charged $1.10 a mile, and merchandise under $2,000.00 is charged the service level's per-mile fee."
      plus_membership: "a purchase that presented a Northgate Business Plus Membership takes $0.30 off each mile"
      plus_tier: "a purchase that presented a Northgate Business Plus Membership takes $0.30 off each mile, a purchase that presented a Northgate Club Plus Membership takes $0.20 off each mile, and a purchase that presented any other membership takes nothing off."
      plus_reduction: "A Plus reduction then comes off that per-mile fee: a purchase that presented a Northgate Business Plus Membership takes $0.30 off each mile, a purchase that presented a Northgate Club Plus Membership takes $0.20 off each mile, and a purchase that presented any other membership takes nothing off."
      year_sold: "which is the amounts of every sale line the member posted on any purchase less the amounts of every returned line the member posted, a line counting only when fewer than twelve whole months separate its posting date from today"
      year_returned: "which is the amounts of every sale line the member posted on any purchase less the amounts of every returned line the member posted, a line counting only when fewer than twelve whole months separate its posting date from today"
      inner_miles: "only the first 10 miles beyond the radius are charged and the rest are carried free"
      outer_miles: "the first 10 miles beyond the radius are charged in full and every further mile counts as half a mile"
      miles_charged: "with twelve-month spending of $5,000.00 or more only the first 10 miles beyond the radius are charged and the rest are carried free; with twelve-month spending of $2,500.00 or more but under $5,000.00 the first 10 miles beyond the radius are charged in full and every further mile counts as half a mile; and with twelve-month spending under $2,500.00 every mile beyond the radius is charged in full."
      tenure_months: "a presented membership opened 120 or more whole months before today takes 10 percent off"
      tenure_pct: "A tenure discount is then taken off the mileage amount once: a presented membership opened 120 or more whole months before today takes 10 percent off, one opened 60 to 119 whole months before today takes 5 percent off, and one opened fewer than 60 whole months before today takes nothing off."
      result: "The mileage amount is the miles so charged times the reduced per-mile fee."
    factors:
      - id: purchase_size_mile_rate
        effect: parameter
        decides: mile_rate
        bindings: [purchase_sold, purchase_returned, purchase_merchandise, mile_rate]
        ladder:
          - when: "the delivered purchase's sale-line amounts less its returned-line amounts come to $3,000.00 or more"
            value: "K('rate_large_purchase') = $0.90 a mile"
          - when: "they come to $2,000.00 or more but under $3,000.00"
            value: "K('rate_mid_purchase') = $1.10 a mile"
          - when: "otherwise (under $2,000.00)"
            value: "P('extended_distance_fee_per_mile_usd'), the service level's per-mile fee ($1.25 or $1.50, never $0.90 or $1.10)"
        baseline:
          mile_rate: "P('extended_distance_fee_per_mile_usd')"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: plus_mile_reduction
        effect: parameter
        decides: plus_reduction
        bindings: [plus_membership, plus_tier, plus_reduction]
        ladder:
          - when: "the purchase being delivered presented a Northgate Business Plus Membership"
            value: "K('plus_reduction_business_plus') = $0.30 off each mile"
          - when: "the purchase being delivered presented a Northgate Club Plus Membership"
            value: "K('plus_reduction_club_plus') = $0.20 off each mile"
          - when: "otherwise (any other membership presented)"
            value: "nothing off"
        baseline:
          plus_reduction: "0"
        evidence: [cross_category]
        cross_difficulty: membership
      - id: twelve_month_mileage_schedule
        effect: method
        decides: miles_charged
        bindings: [year_sold, year_returned, year_spend, inner_miles, outer_miles, miles_charged]
        ladder:
          - when: "the member's sale-line amounts less returned-line amounts posted within the last twelve whole months come to $5,000.00 or more"
            method: "capped schedule: only the first 10 miles beyond the radius are charged; the rest ride free"
          - when: "they come to $2,500.00 or more but under $5,000.00"
            method: "graduated schedule: the first 10 miles beyond the radius in full, every further mile as half a mile"
          - when: "otherwise (under $2,500.00)"
            method: "flat schedule: every mile beyond the radius charged in full"
        baseline:
          miles_charged: "miles_beyond"
        evidence: [cross_category, history, date]
        cross_difficulty: order
      - id: distance_tenure_discount
        effect: parameter
        decides: tenure_pct
        bindings: [tenure_months, tenure_pct]
        ladder:
          - when: "the presented membership was opened 120 or more whole months before today"
            value: "K('tenure_long_pct') = 10 percent off"
          - when: "it was opened 60 to 119 whole months before today"
            value: "K('tenure_mid_pct') = 5 percent off"
          - when: "otherwise (fewer than 60 whole months)"
            value: "nothing off"
        baseline:
          tenure_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: membership
    baseline:
      rule: >-
        The extended-distance charge is every road mile beyond the included radius at the service level's
        per-mile fee, with no reduction, schedule or discount. The charge is rounded to the cent once, at the end,
        half up.
      params: [included_radius_miles, extended_distance_fee_per_mile_usd]
    inputs:
      history:
        - {category: order, table: order_lines, aggregate: sum, field: line_amount, filters: {event_type: order_line_sold}}
        - {category: order, table: order_lines, aggregate: sum, field: line_amount, filters: {event_type: order_line_returned}}
        - {category: order, table: order_lines, aggregate: sum, field: line_amount, within_months: 12, filters: {event_type: order_line_sold}}
        - {category: order, table: order_lines, aggregate: sum, field: line_amount, within_months: 12, filters: {event_type: order_line_returned}}
      cross_category: [order, membership]
  - id: delivery_ext_reschedule_settlement
    base_policy_refs: [delivery_booking_and_fees, delivery_reschedule, delivery_failed_attempts]
    overwrite:
      - base_policy: delivery_reschedule
        superseded_clause: >-
          A reschedule is free only when at least reschedule_notice_days calendar days separate the request date
          from the booked delivery date and the appointment has made fewer than free_reschedules free reschedules
          (reschedule_count minus delivery_msr_paid_reschedules); otherwise reschedule_fee_usd is charged as a
          reschedule_fee entry whose service_date is the new date.
        replaced_by: >-
          A move is free only when the member asks for it at least the service level's reschedule notice days,
          counted in calendar days, before the delivery date then booked, and the appointment has made fewer free
          moves than the service level's free reschedules; whether a move had that notice is judged when it is
          made, and a short-notice move owes its fee at that moment. A move already recorded on the appointment is
          judged by the record alone, since no request date is kept: the recorded moves that owe a fee are the
          appointment's reschedule count less the service level's free reschedules less the reschedule fee entries
          already standing on the appointment, never fewer than none, and a recorded move within the free
          reschedules that carries no reschedule fee entry stands as a free move.
      - base_policy: delivery_booking_and_fees
        superseded_clause: >-
          At booking the following are charged, each as its own entry dated the booking date with the
          appointment date as service_date
        replaced_by: >-
          the fee owed for them is posted as one reschedule fee entry dated the posting date with the
          appointment's currently booked delivery date as its service date
    trigger: state_due
    subject: [delivery_service_charged]
    computes: amount
    target_tool: post_reschedule_fee_c618067c
    params:
      storage_free_days: 14
      storage_daily_days: 21
      storage_daily_rate: 1.20
      storage_flat_days: 15
      storage_flat_fee: 10.00
      route_far_miles: 20
      route_surcharge_far: 20.00
      route_surcharge_near: 8.00
      visa_both_pct: 50
      visa_one_pct: 25
      reslot_many_flights: 3
      reslot_surcharge_many: 15.00
      reslot_surcharge_some: 5.00
    rule: >
      A move is free only when the member asks for it at least the service level's reschedule notice days,
      counted in calendar days, before the delivery date then booked, and the appointment has made fewer free
      moves than the service level's free reschedules; whether a move had that notice is judged when it is
      made, and a short-notice move owes its fee at that moment. A move already recorded on the appointment is
      judged by the record alone, since no request date is kept: the recorded moves that owe a fee are the
      appointment's reschedule count less the service level's free reschedules less the reschedule fee entries
      already standing on the appointment, never fewer than none, and a recorded move within the free
      reschedules that carries no reschedule fee entry stands as a free move. For recorded moves that owe a fee,
      the fee owed for them is posted as one reschedule fee entry dated the posting date with the
      appointment's currently booked delivery date as its service date. The reschedule fee owed is the service
      level's reschedule fee for each move that owes one, with no storage charge, surcharge or discount. The fee
      is rounded to the cent once, at the end, half up.
      A storage charge is added to the reschedule fee of each owed move according to the calendar days from the
      appointment's booking date to its currently booked delivery date, and the way it is worked out depends on
      that span: when 21 or more days separate them the merchandise is charged storage by the day, $1.20 for
      every day beyond the 14th; when 15 to 20 days separate them a flat storage charge of $10.00 applies; and
      when fewer than 15 days separate them no storage is charged.
      A long-route surcharge is added to the reschedule fee of each owed move according to the road miles that
      the appointment's extended-distance entry carries as its units: 20 or more miles add $20.00, fewer than
      20 miles add $8.00, and an appointment with no extended-distance entry adds nothing.
      A crew re-slot surcharge is added to the reschedule fee of each owed move, because moving an appointment
      that needs a stair-capable crew means finding such a crew again, according to the flights of stairs the
      appointment's stair-carry entries carry as their units in all: 3 or more flights add $15.00, 1 or 2
      flights add $5.00, and an appointment with no stair-carry entry adds nothing.
      A Northgate Visa discount is then taken off once, from the reschedule fee with its storage charge and both
      surcharges, times the moves that owe one: when the purchase being delivered was paid with the Northgate
      Visa and the automatic renewal of the membership presented on it is billed to the Northgate Visa as well,
      50 percent comes off; when exactly one of those two is on the Northgate Visa, 25 percent comes off; and
      when neither is, nothing comes off.
      The reschedule fee owed on an appointment whose road miles exceed the included radius is not fixed
      until the appointment's extended-distance entry stands on it.
    prerequisite:
      - problem: delivery_ext_distance_settlement
        kind: value_input
        gate: route_miles
        form: state
        policy_source: >-
          The reschedule fee owed on an appointment whose road miles exceed the included radius is not fixed
          until the appointment's extended-distance entry stands on it.
        condition: >-
          Whenever delivery_holdings.distance_miles exceeds the service level's included_radius_miles,
          delivery_charges holds a delivery_service_charged row of charge_type extended_distance for the
          appointment.
        resolved_by: post_extended_distance_charge_120a0e6d
        effect: >-
          route_miles becomes the units the extended-distance entry carries, which selects the long-route
          surcharge tier added to every owed move's fee.
    cross_category:
      - category: order
        as: branch
        reads: [membership_id, tender]
        note: The Northgate Visa discount reads the tender the delivered purchase was paid with and locates the membership presented on that purchase.
      - category: membership
        as: branch
        reads: [auto_renew_tender]
        note: The Northgate Visa discount reads where the presented membership's automatic renewal is billed.
    compute:
      - moves_owed: "MX(0, F('reschedule_count') - P('free_reschedules') - COUNT('delivery_charges', event_type='delivery_service_charged', charge_type='reschedule_fee'))"
      - hold_days: "DAYS(F('booked_date'), F('scheduled_date'))"
      - storage_charge: "(K('storage_daily_rate') * (hold_days - K('storage_free_days'))) if hold_days >= K('storage_daily_days') else (K('storage_flat_fee') if hold_days >= K('storage_flat_days') else 0)"
      - route_miles: "SUM('delivery_charges', 'units', event_type='delivery_service_charged', charge_type='extended_distance')"
      - route_surcharge: "K('route_surcharge_far') if route_miles >= K('route_far_miles') else (K('route_surcharge_near') if route_miles > 0 else 0)"
      - pay_membership: "CFIELD('order', 'membership_id', order_id=F('order_id'))"
      - purchase_tender: "CFIELD('order', 'tender', order_id=F('order_id'))"
      - renewal_tender: "CFIELD('membership', 'auto_renew_tender', membership_id=pay_membership)"
      - visa_pct: "K('visa_both_pct') if (purchase_tender == 'northgate_visa' and renewal_tender == 'northgate_visa') else (K('visa_one_pct') if (purchase_tender == 'northgate_visa' or renewal_tender == 'northgate_visa') else 0)"
      - stair_flights: "SUM('delivery_charges', 'units', event_type='delivery_service_charged', charge_type='stair_carry')"
      - reslot_surcharge: "K('reslot_surcharge_many') if stair_flights >= K('reslot_many_flights') else (K('reslot_surcharge_some') if stair_flights > 0 else 0)"
      - result: "RND((P('reschedule_fee_usd') + storage_charge + route_surcharge + reslot_surcharge) * moves_owed * (1 - visa_pct / 100), 2)"
    compute_basis:
      moves_owed: "the recorded moves that owe a fee are the appointment's reschedule count less the service level's free reschedules less the reschedule fee entries already standing on the appointment, never fewer than none"
      hold_days: "A storage charge is added to the reschedule fee of each owed move according to the calendar days from the appointment's booking date to its currently booked delivery date"
      storage_charge: "when 21 or more days separate them the merchandise is charged storage by the day, $1.20 for every day beyond the 14th; when 15 to 20 days separate them a flat storage charge of $10.00 applies; and when fewer than 15 days separate them no storage is charged."
      route_miles: "A long-route surcharge is added to the reschedule fee of each owed move according to the road miles that the appointment's extended-distance entry carries as its units"
      route_surcharge: "20 or more miles add $20.00, fewer than 20 miles add $8.00, and an appointment with no extended-distance entry adds nothing."
      pay_membership: "the automatic renewal of the membership presented on it is billed to the Northgate Visa as well"
      purchase_tender: "when the purchase being delivered was paid with the Northgate Visa"
      renewal_tender: "the automatic renewal of the membership presented on it is billed to the Northgate Visa as well"
      visa_pct: "when the purchase being delivered was paid with the Northgate Visa and the automatic renewal of the membership presented on it is billed to the Northgate Visa as well, 50 percent comes off; when exactly one of those two is on the Northgate Visa, 25 percent comes off; and when neither is, nothing comes off."
      stair_flights: "according to the flights of stairs the appointment's stair-carry entries carry as their units in all"
      reslot_surcharge: "3 or more flights add $15.00, 1 or 2 flights add $5.00, and an appointment with no stair-carry entry adds nothing."
      result: "A Northgate Visa discount is then taken off once, from the reschedule fee with its storage charge and both surcharges, times the moves that owe one"
    factors:
      - id: storage_by_hold_span
        effect: method
        decides: storage_charge
        bindings: [hold_days, storage_charge]
        ladder:
          - when: "21 or more calendar days from the appointment's booking date to its currently booked delivery date"
            method: "storage accrues by the day: $1.20 for every day beyond the 14th"
          - when: "15 to 20 calendar days"
            method: "a single flat storage charge of $10.00, whatever the number of days"
          - when: "otherwise (fewer than 15 days)"
            method: "no storage is charged"
        baseline:
          storage_charge: "0"
        evidence: [date]
        cross_difficulty: null
      - id: long_route_surcharge
        effect: parameter
        decides: route_surcharge
        bindings: [route_miles, route_surcharge]
        ladder:
          - when: "the appointment's extended-distance entry carries 20 or more road miles as its units"
            value: "K('route_surcharge_far') = $20.00 added per owed move"
          - when: "the appointment's extended-distance entry carries fewer than 20 road miles"
            value: "K('route_surcharge_near') = $8.00 added per owed move"
          - when: "otherwise (no extended-distance entry on the appointment)"
            value: "no long-route surcharge"
        baseline:
          route_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: northgate_visa_discount
        effect: parameter
        decides: visa_pct
        bindings: [purchase_tender, renewal_tender, visa_pct]
        ladder:
          - when: "the delivered purchase was paid with the Northgate Visa and the presented membership's automatic renewal is billed to the Northgate Visa"
            value: "K('visa_both_pct') = 50 percent off"
          - when: "exactly one of those two is on the Northgate Visa (the purchase tender or the automatic renewal billing)"
            value: "K('visa_one_pct') = 25 percent off"
          - when: "otherwise (neither is on the Northgate Visa)"
            value: "nothing off"
        baseline:
          visa_pct: "0"
        evidence: [cross_category]
        cross_difficulty: order
      - id: crew_reslot_surcharge
        effect: parameter
        decides: reslot_surcharge
        bindings: [stair_flights, reslot_surcharge]
        ladder:
          - when: "the appointment's stair-carry entries carry 3 or more flights in all"
            value: "K('reslot_surcharge_many') = $15.00 added per owed move"
          - when: "they carry 1 or 2 flights"
            value: "K('reslot_surcharge_some') = $5.00 added per owed move"
          - when: "otherwise (no stair-carry entry on the appointment)"
            value: "no re-slot surcharge"
        baseline:
          reslot_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The reschedule fee owed is the service level's reschedule fee for each move that owes one, with no
        storage charge, surcharge or discount. The fee is rounded to the cent once, at the end, half up.
      params: [reschedule_fee_usd, free_reschedules]
    inputs:
      history:
        - {table: delivery_charges, aggregate: count, filters: {event_type: delivery_service_charged, charge_type: reschedule_fee}}
        - {table: delivery_charges, aggregate: sum, field: units, filters: {event_type: delivery_service_charged, charge_type: extended_distance}}
        - {table: delivery_charges, aggregate: sum, field: units, filters: {event_type: delivery_service_charged, charge_type: stair_carry}}
      cross_category: [order, membership]
  - id: delivery_ext_wall_mount_addition
    base_policy_refs: [delivery_booking_and_fees, delivery_reschedule, delivery_failed_attempts, delivery_crew_scope]
    overwrite:
      - base_policy: delivery_booking_and_fees
        superseded_clause: >-
          and wall_mount_labor_usd per television mounted
        replaced_by: >-
          The wall-mounting charge is the service level's wall-mount labor fee for each television mounted,
          every television at the full labor fee, with no allowance, surcharge or discount.
      - base_policy: delivery_booking_and_fees
        superseded_clause: >-
          At booking the following are charged, each as its own entry dated the booking date with the
          appointment date as service_date
        replaced_by: >-
          is booked on the member's own authorization as one wall-mount labor entry dated the posting date,
          with the appointment's currently booked delivery date as its service date.
    trigger: on_request
    subject: [delivery_service_charged]
    computes: amount
    target_tool: authorize_wall_mounting_3e376943
    params:
      second_tv_share: 0.75
      further_tv_share: 0.5
      tv_spend_high: 2500.00
      tv_spend_mid: 1500.00
      spend_allowance_high: 25.00
      spend_allowance_mid: 10.00
      visa_allowance: 15.00
      store_card_allowance: 5.00
      late_short_days: 2
      late_mid_days: 6
      late_surcharge_short_pct: 50
      late_surcharge_mid_pct: 25
      plus_tier_pct: 15
      loyal_member_months: 120
      loyal_member_pct: 10
      bundle_many_components: 3
      bundle_many_pct: 15
      bundle_some_pct: 10
    rule: >
      Wall mounting that a member adds to a Northgate TV Delivery & Wall-Mount Installation appointment after
      its booking date is booked on the member's own authorization as one wall-mount labor entry dated the
      posting date, with the appointment's currently booked delivery date as its service date. Mounting added
      this way covers every television the appointment delivers, and the entry carries as its units the
      televisions mounted, which are the television units sold on the purchase being delivered less the
      television units returned from it. The crew's mounting limits on screen size and wall construction still
      apply at the door. The wall-mounting charge is the service level's wall-mount labor fee for each
      television mounted, every television at the full labor fee, with no allowance, surcharge or discount.
      The charge is rounded to the cent once, at the end, half up.
      How the televisions are priced follows how many the appointment mounts: when it mounts three or more,
      the first is charged the full labor fee and every other one half of it; when it mounts exactly two, the
      first is charged the full labor fee and the second three quarters of it; and when it mounts one, that one
      is charged the full labor fee.
      The labor fee for each television is first lowered by a television-spend allowance that follows the
      television merchandise on the purchase, counted as the amounts of its television sale lines less the
      amounts of its television returned lines: $2,500.00 or more lowers it by $25.00, $1,500.00 or more but
      under $2,500.00 lowers it by $10.00, and under $1,500.00 does not lower it.
      The labor fee for each television is also lowered by a tender allowance that follows how the purchase was
      paid: paid with the Northgate Visa lowers it by $15.00, paid with the Northgate Store Card lowers it by
      $5.00, and paid any other way does not lower it.
      The priced labor, being the lowered labor fee taken over the televisions as priced above, then carries a
      late-addition surcharge, a percentage of the priced labor added to it, according to the calendar days
      from today to the currently booked delivery date: two days or fewer add 50 percent, three to six days add
      25 percent, and seven or more days add nothing.
      Two percentage discounts are then added together into one total rate, and the surcharged amount is
      reduced once by that total rate; the two discounts do not act successively. The member-tier discount is
      15 percent when the purchase presented a Northgate Club Plus Membership or a Northgate Business Plus
      Membership, 10 percent when it presented any other membership opened 120 or more whole months before
      today, and nothing when it presented any other membership opened fewer than 120 whole months before
      today. The multi-service discount counts which of the four extra-charge components haul-away, stair
      carry, extended distance and installation parts kit already have at least one entry on the appointment:
      three or four of them give 15 percent, one or two of them give 10 percent, and none gives nothing.
      Where the appointment's road miles exceed the included radius, the wall-mounting charge is fixed only
      after the appointment carries its extended-distance entry.
      On an appointment moved more times than its free reschedules, wall mounting is booked only after the
      appointment carries a reschedule fee entry for every move beyond them.
    prerequisite:
      - problem: delivery_ext_distance_settlement
        kind: value_input
        gate: n_distance
        form: state
        policy_source: >-
          Where the appointment's road miles exceed the included radius, the wall-mounting charge is fixed only
          after the appointment carries its extended-distance entry.
        condition: >-
          Whenever delivery_holdings.distance_miles exceeds the service level's included_radius_miles,
          delivery_charges holds at least one delivery_service_charged row of charge_type extended_distance for
          the appointment.
        resolved_by: post_extended_distance_charge_120a0e6d
        effect: >-
          n_distance rises from 0 to 1, so extended distance counts among the extra-charge components that
          select the multi-service discount tier.
      - problem: delivery_ext_reschedule_settlement
        kind: state_gate
        gate: delivery_charges.charge_type
        form: state
        policy_source: >-
          On an appointment moved more times than its free reschedules, wall mounting is booked only after the
          appointment carries a reschedule fee entry for every move beyond them.
        condition: >-
          The count of delivery_service_charged rows of charge_type reschedule_fee on the appointment is at least
          delivery_holdings.reschedule_count less the service level's free_reschedules.
        resolved_by: post_reschedule_fee_c618067c
        effect: >-
          Once the reschedule fee entry for every move beyond the free reschedules stands, the gate on booking
          the wall-mounting charge holds; the charge's amount is not changed by it.
    cross_category:
      - category: order
        as: history
        reads: [order_holdings.membership_id, order_holdings.tender, order_lines.quantity, order_lines.line_amount, order_lines.merchandise_class, order_lines.event_type]
        note: The television count and pricing method, the television-spend allowance and the tender allowance read the delivered purchase and its television sale and returned lines.
      - category: membership
        as: branch
        reads: [variant_name, opened_date]
        note: The member-tier discount reads the presented membership's tier and opened date.
    compute:
      - tv_sold: "XSUM('order', 'order_lines', 'quantity', event_type='order_line_sold', merchandise_class='television', order_id=F('order_id'))"
      - tv_returned: "XSUM('order', 'order_lines', 'quantity', event_type='order_line_returned', merchandise_class='television', order_id=F('order_id'))"
      - televisions: "tv_sold - tv_returned"
      - mount_units: "(1 + K('further_tv_share') * (televisions - 1)) if televisions >= 3 else ((1 + K('second_tv_share')) if televisions == 2 else televisions)"
      - tv_spend_sold: "XSUM('order', 'order_lines', 'line_amount', event_type='order_line_sold', merchandise_class='television', order_id=F('order_id'))"
      - tv_spend_returned: "XSUM('order', 'order_lines', 'line_amount', event_type='order_line_returned', merchandise_class='television', order_id=F('order_id'))"
      - tv_spend: "tv_spend_sold - tv_spend_returned"
      - spend_allowance: "K('spend_allowance_high') if tv_spend >= K('tv_spend_high') else (K('spend_allowance_mid') if tv_spend >= K('tv_spend_mid') else 0)"
      - pay_tender: "CFIELD('order', 'tender', order_id=F('order_id'))"
      - tender_allowance: "K('visa_allowance') if pay_tender == 'northgate_visa' else (K('store_card_allowance') if pay_tender == 'northgate_store_card' else 0)"
      - notice_days: "DAYS(NOW, F('scheduled_date'))"
      - late_pct: "K('late_surcharge_short_pct') if notice_days <= K('late_short_days') else (K('late_surcharge_mid_pct') if notice_days <= K('late_mid_days') else 0)"
      - tier_membership: "CFIELD('order', 'membership_id', order_id=F('order_id'))"
      - member_tier: "CFIELD('membership', 'variant_name', membership_id=tier_membership)"
      - member_months: "MONTHS(CFIELD('membership', 'opened_date', membership_id=tier_membership), NOW)"
      - tier_pct: "K('plus_tier_pct') if (member_tier == 'Northgate Club Plus Membership' or member_tier == 'Northgate Business Plus Membership') else (K('loyal_member_pct') if member_months >= K('loyal_member_months') else 0)"
      - n_haul: "COUNT('delivery_charges', event_type='delivery_service_charged', charge_type='haul_away')"
      - n_stairs: "COUNT('delivery_charges', event_type='delivery_service_charged', charge_type='stair_carry')"
      - n_distance: "COUNT('delivery_charges', event_type='delivery_service_charged', charge_type='extended_distance')"
      - n_kit: "COUNT('delivery_charges', event_type='delivery_service_charged', charge_type='installation_parts_kit')"
      - extra_components: "(1 if n_haul > 0 else 0) + (1 if n_stairs > 0 else 0) + (1 if n_distance > 0 else 0) + (1 if n_kit > 0 else 0)"
      - bundle_pct: "K('bundle_many_pct') if extra_components >= K('bundle_many_components') else (K('bundle_some_pct') if extra_components > 0 else 0)"
      - result: "RND(mount_units * (P('wall_mount_labor_usd') - spend_allowance - tender_allowance) * (1 + late_pct / 100) * (1 - (tier_pct + bundle_pct) / 100), 2)"
    compute_basis:
      tv_sold: "the entry carries as its units the televisions mounted, which are the television units sold on the purchase being delivered less the television units returned from it."
      tv_returned: "the entry carries as its units the televisions mounted, which are the television units sold on the purchase being delivered less the television units returned from it."
      mount_units: "when it mounts three or more, the first is charged the full labor fee and every other one half of it; when it mounts exactly two, the first is charged the full labor fee and the second three quarters of it; and when it mounts one, that one is charged the full labor fee."
      tv_spend_sold: "counted as the amounts of its television sale lines less the amounts of its television returned lines"
      tv_spend_returned: "counted as the amounts of its television sale lines less the amounts of its television returned lines"
      spend_allowance: "$2,500.00 or more lowers it by $25.00, $1,500.00 or more but under $2,500.00 lowers it by $10.00, and under $1,500.00 does not lower it."
      pay_tender: "The labor fee for each television is also lowered by a tender allowance that follows how the purchase was paid"
      tender_allowance: "paid with the Northgate Visa lowers it by $15.00, paid with the Northgate Store Card lowers it by $5.00, and paid any other way does not lower it."
      notice_days: "according to the calendar days from today to the currently booked delivery date"
      late_pct: "then carries a late-addition surcharge, a percentage of the priced labor added to it, according to the calendar days from today to the currently booked delivery date: two days or fewer add 50 percent, three to six days add 25 percent, and seven or more days add nothing."
      tier_membership: "The member-tier discount is 15 percent when the purchase presented a Northgate Club Plus Membership or a Northgate Business Plus Membership"
      member_tier: "The member-tier discount is 15 percent when the purchase presented a Northgate Club Plus Membership or a Northgate Business Plus Membership"
      member_months: "10 percent when it presented any other membership opened 120 or more whole months before today"
      tier_pct: "The member-tier discount is 15 percent when the purchase presented a Northgate Club Plus Membership or a Northgate Business Plus Membership, 10 percent when it presented any other membership opened 120 or more whole months before today, and nothing when it presented any other membership opened fewer than 120 whole months before today."
      n_haul: "The multi-service discount counts which of the four extra-charge components haul-away, stair carry, extended distance and installation parts kit already have at least one entry on the appointment"
      n_stairs: "The multi-service discount counts which of the four extra-charge components haul-away, stair carry, extended distance and installation parts kit already have at least one entry on the appointment"
      n_distance: "The multi-service discount counts which of the four extra-charge components haul-away, stair carry, extended distance and installation parts kit already have at least one entry on the appointment"
      n_kit: "The multi-service discount counts which of the four extra-charge components haul-away, stair carry, extended distance and installation parts kit already have at least one entry on the appointment"
      extra_components: "The multi-service discount counts which of the four extra-charge components haul-away, stair carry, extended distance and installation parts kit already have at least one entry on the appointment"
      bundle_pct: "three or four of them give 15 percent, one or two of them give 10 percent, and none gives nothing."
      result: "Two percentage discounts are then added together into one total rate, and the surcharged amount is reduced once by that total rate; the two discounts do not act successively."
    factors:
      - id: multi_television_pricing
        effect: method
        decides: mount_units
        bindings: [tv_sold, tv_returned, televisions, mount_units]
        ladder:
          - when: "the appointment mounts three or more televisions (television units sold on the purchase less those returned)"
            method: "the first television at the full labor fee and every other one at half of it"
          - when: "the appointment mounts exactly two televisions"
            method: "the first television at the full labor fee and the second at three quarters of it"
          - when: "otherwise (one television)"
            method: "each television at the full labor fee"
        baseline:
          mount_units: "televisions"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: television_spend_allowance
        effect: parameter
        decides: spend_allowance
        bindings: [tv_spend_sold, tv_spend_returned, tv_spend, spend_allowance]
        ladder:
          - when: "the purchase's television sale-line amounts less its television returned-line amounts come to $2,500.00 or more"
            value: "K('spend_allowance_high') = $25.00 off the labor fee per television"
          - when: "they come to $1,500.00 or more but under $2,500.00"
            value: "K('spend_allowance_mid') = $10.00 off the labor fee per television"
          - when: "otherwise (under $1,500.00)"
            value: "no allowance"
        baseline:
          spend_allowance: "0"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: mounting_tender_allowance
        effect: parameter
        decides: tender_allowance
        bindings: [pay_tender, tender_allowance]
        ladder:
          - when: "the delivered purchase was paid with the Northgate Visa"
            value: "K('visa_allowance') = $15.00 off the labor fee per television"
          - when: "the delivered purchase was paid with the Northgate Store Card"
            value: "K('store_card_allowance') = $5.00 off the labor fee per television"
          - when: "otherwise (any other tender)"
            value: "no allowance"
        baseline:
          tender_allowance: "0"
        evidence: [cross_category]
        cross_difficulty: order
      - id: late_mounting_surcharge
        effect: parameter
        decides: late_pct
        bindings: [notice_days, late_pct]
        ladder:
          - when: "two or fewer calendar days from today to the currently booked delivery date"
            value: "K('late_surcharge_short_pct') = 50 percent added"
          - when: "three to six calendar days"
            value: "K('late_surcharge_mid_pct') = 25 percent added"
          - when: "otherwise (seven or more days)"
            value: "nothing added"
        baseline:
          late_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: mounting_member_tier_discount
        effect: parameter
        decides: tier_pct
        bindings: [tier_membership, member_tier, member_months, tier_pct]
        ladder:
          - when: "the purchase presented a Northgate Club Plus Membership or a Northgate Business Plus Membership"
            value: "K('plus_tier_pct') = 15 percent"
          - when: "the purchase presented any other membership opened 120 or more whole months before today"
            value: "K('loyal_member_pct') = 10 percent"
          - when: "otherwise (any other membership opened fewer than 120 whole months before today)"
            value: "nothing"
        baseline:
          tier_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: membership
      - id: multi_service_discount
        effect: parameter
        decides: bundle_pct
        bindings: [n_haul, n_stairs, n_distance, n_kit, extra_components, bundle_pct]
        ladder:
          - when: "three or four of the extra-charge components haul-away, stair carry, extended distance and installation parts kit have an entry on the appointment"
            value: "K('bundle_many_pct') = 15 percent"
          - when: "one or two of them have an entry"
            value: "K('bundle_some_pct') = 10 percent"
          - when: "otherwise (none of them has an entry)"
            value: "nothing"
        baseline:
          bundle_pct: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The wall-mounting charge is the service level's wall-mount labor fee for each television mounted,
        every television at the full labor fee, with no allowance, surcharge or discount. The charge is rounded
        to the cent once, at the end, half up.
      params: [wall_mount_labor_usd]
    inputs:
      history:
        - {table: delivery_charges, aggregate: count, filters: {event_type: delivery_service_charged, charge_type: haul_away}}
        - {table: delivery_charges, aggregate: count, filters: {event_type: delivery_service_charged, charge_type: stair_carry}}
        - {table: delivery_charges, aggregate: count, filters: {event_type: delivery_service_charged, charge_type: extended_distance}}
        - {table: delivery_charges, aggregate: count, filters: {event_type: delivery_service_charged, charge_type: installation_parts_kit}}
        - {category: order, table: order_lines, aggregate: sum, field: quantity, filters: {event_type: order_line_sold, merchandise_class: television}}
        - {category: order, table: order_lines, aggregate: sum, field: quantity, filters: {event_type: order_line_returned, merchandise_class: television}}
        - {category: order, table: order_lines, aggregate: sum, field: line_amount, filters: {event_type: order_line_sold, merchandise_class: television}}
        - {category: order, table: order_lines, aggregate: sum, field: line_amount, filters: {event_type: order_line_returned, merchandise_class: television}}
      cross_category: [order, membership]
  - id: delivery_ext_install_kit_settlement
    base_policy_refs: [delivery_booking_and_fees, delivery_reschedule, delivery_failed_attempts]
    overwrite:
      - base_policy: delivery_booking_and_fees
        superseded_clause: >-
          one installation_parts_kit per appliance installed at installation_parts_kit_fee_usd
        replaced_by: >-
          The installation parts kit charge is the service level's installation parts kit fee for each kit
          owed, with no contractor price, reduction, schedule or discount.
      - base_policy: delivery_booking_and_fees
        superseded_clause: >-
          At booking the following are charged, each as its own entry dated the booking date with the
          appointment date as service_date
        replaced_by: >-
          they are posted together as one installation parts kit entry dated the posting date, with the
          appointment's currently booked delivery date as its service date and the kits owed as its units.
    trigger: state_due
    subject: [delivery_service_charged]
    computes: amount
    target_tool: post_installation_kit_charge_19cc3b17
    params:
      volume_units: 4
      contractor_kit_high_volume: 27.99
      contractor_kit_low_volume: 33.99
      later_kit_share_pair: 0.75
      later_kit_share_multi: 0.5
      visa_kit_pct: 10
      store_card_kit_pct: 5
      tenure_long_months: 180
      tenure_mid_months: 96
      tenure_long_reduction: 4.00
      tenure_mid_reduction: 2.00
      stocked_two_reduction: 5.00
      stocked_one_reduction: 2.50
    rule: >
      An installation appointment charges one installation parts kit for every appliance it installs, the
      appliances it installs being the major appliance units sold on the purchase being delivered less the
      major appliance units returned from it. Kits the appointment's installation parts kit entries do not yet
      cover are owed, and they are posted together as one installation parts kit entry dated the posting date,
      with the appointment's currently booked delivery date as its service date and the kits owed as its units.
      The installation parts kit charge is the service level's installation parts kit fee for each kit owed,
      with no contractor price, reduction, schedule or discount. The charge is rounded to the cent once, at
      the end, half up.
      The kit price for each kit follows the membership presented on the purchase and the member's recent
      appliance buying, counted as the major appliance units the member bought on any purchase less those
      returned, a line counting only when fewer than twelve whole months separate its posting date from
      today: a Northgate Business Membership or Northgate Business Plus Membership with 4 or more such units
      pays the contractor price of $27.99, a Northgate Business Membership or Northgate Business Plus
      Membership with fewer than 4 such units pays the contractor price of $33.99, and any other membership
      pays the service level's installation parts kit fee.
      The kit price is lowered by a fittings-stock reduction that follows the kit units already standing on the
      appointment's installation parts kit entries: 2 or more units lower it by $5.00, 1 unit lowers it by
      $2.50, and none leaves it unlowered.
      The kit price is also lowered by a tenure reduction that follows the whole months from the presented
      membership's opened date to today: 180 or more months lower it by $4.00, 96 to 179 months lower it by
      $2.00, and fewer than 96 months leave it unlowered.
      Each kit's place in the appointment decides how much of the lowered kit price it carries, counting the
      kits in order, the kits already standing first and the kits owed after them, and the schedule follows how
      many appliances the appointment installs: when it installs three or more, the first kit carries the full
      lowered price and every later kit one half of it; when it installs exactly two, the first kit carries the
      full lowered price and the second three quarters of it; and when it installs one, that kit carries the
      full lowered price. The kits' amount is the lowered kit price taken over the kits owed as their places
      give.
      A tender discount is then taken off the kits' amount once: a purchase paid with the Northgate Visa takes
      10 percent off, a purchase paid with the Northgate Store Card takes 5 percent off, and a purchase paid any
      other way takes nothing off.
    prerequisite: []
