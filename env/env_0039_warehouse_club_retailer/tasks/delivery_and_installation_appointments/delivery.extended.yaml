        - {category: order, table: order_lines, aggregate: sum, field: quantity, filters: {event_type: order_line_sold, merchandise_class: major_appliance}}
        - {category: order, table: order_lines, aggregate: sum, field: quantity, filters: {event_type: order_line_returned, merchandise_class: major_appliance}}
