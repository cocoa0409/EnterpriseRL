  - id: delivery_ext_replacement_haul_away
    base_policy_refs: [delivery_booking_and_fees, delivery_reschedule, delivery_failed_attempts, delivery_crew_scope]
    overwrite:
      - base_policy: delivery_booking_and_fees
        superseded_clause: >-
          haul-away of old items beyond haul_away_included_items at haul_away_fee_per_item_usd each, only where
          haul_away_available
        replaced_by: >-
          The haul-away charge is the old appliances removed beyond the service level's included haul-away
          items, at the service level's per-item haul-away fee, with no allowance, schedule, surcharge or discount.
      - base_policy: delivery_booking_and_fees
        superseded_clause: >-
          At booking the following are charged, each as its own entry dated the booking date with the
          appointment date as service_date
        replaced_by: >-
          it is booked as one haul-away entry dated the posting date with the appointment's currently booked
          delivery date as its service date.
    trigger: on_request
    subject: [delivery_service_charged]
    computes: amount
    target_tool: authorize_haul_away_734a64e4
    params:
      plus_included_items: 2
      spend_high_usd: 2500.00
      spend_mid_usd: 1500.00
      removal_fee_high_spend: 15.00
      removal_fee_mid_spend: 20.00
      late_short_days: 1
      late_mid_days: 5
      late_surcharge_short_pct: 100
      late_surcharge_mid_pct: 50
      consolidated_days: 21
      graduated_days: 10
      further_item_share: 0.5
      renewal_visa_pct: 20
      renewal_other_pct: 10
    rule: >
      A member who asks, after booking, for the crew to take away the old appliances that an installation
      appointment replaces authorizes the removal personally, and it is booked as one haul-away entry dated the
      posting date with the appointment's currently booked delivery date as its service date. The old appliances
      removed are one for each appliance the appointment installs, the appliances installed being the kit units
      its installation parts kit entries carry, and the entry carries that number as its units. The haul-away
      charge is the old appliances removed beyond the service level's included haul-away items, at the service
      level's per-item haul-away fee, with no allowance, schedule, surcharge or discount. The charge is rounded to
      the cent once, at the end, half up.
      The included haul-away items follow the membership presented on the purchase being delivered: a Northgate
      Business Membership or Northgate Business Plus Membership has no included items, because removal for a
      business account is never free; a Northgate Club Plus Membership has 2 included items; and any other
      membership has the service level's included haul-away items. The removed appliances beyond the included
      items never fall below zero.
      The per-item removal fee follows the merchandise on the purchase being delivered, counted as the amounts of
      its sale lines less the amounts of its returned lines: $2,500.00 or more pays $15.00 an item, $1,500.00 or
      more but under $2,500.00 pays $20.00 an item, and under $1,500.00 pays the service level's per-item
      haul-away fee.
      How the removed appliances beyond the included items are priced follows how far ahead the removal can be
      planned with the recycler, counted in calendar days from the appointment's booking date to its currently
      booked delivery date: with 21 or more days the removal rides one consolidated recycler trip and is charged
      the per-item removal fee once, whatever the number of appliances; with 10 to 20 days the first appliance is
      charged the per-item removal fee and every further appliance half of it; and with fewer than 10 days every
      appliance is charged the per-item removal fee.
      The removal amount so priced then carries a late-request surcharge, a percentage of it added to it,
      according to the calendar days from today to the currently booked delivery date: one day or fewer adds 100
      percent, two to five days add 50 percent, and six or more days add nothing.
      A renewal-billing discount is then taken off the surcharged amount once: a presented membership whose
      automatic renewal is billed to the Northgate Visa takes 20 percent off, one whose automatic renewal is
      billed to any other tender takes 10 percent off, and one not on automatic renewal takes nothing off.
      The haul-away charge for the old appliances an installation replaces is fixed only once the
      appointment's installation parts kit entries cover every appliance it installs.
    prerequisite:
      - problem: delivery_ext_install_kit_settlement
        kind: value_input
        gate: old_appliances
        form: state
        policy_source: >-
          The haul-away charge for the old appliances an installation replaces is fixed only once the
          appointment's installation parts kit entries cover every appliance it installs.
        condition: >-
          The units of the appointment's delivery_service_charged rows of charge_type installation_parts_kit add up
          to the major_appliance units sold on the delivered purchase less those returned.
        resolved_by: post_installation_kit_charge_19cc3b17
        effect: >-
          old_appliances rises to the number of appliances the appointment installs, which is the count of old
          appliances removed and so the quantity the per-item fee is charged on.
    cross_category:
      - category: order
        as: history
        reads: [order_holdings.membership_id, order_lines.line_amount, order_lines.event_type]
        note: The per-item removal fee reads the delivered purchase's sale and returned line amounts, and the included items and renewal discount locate the presented membership through it.
      - category: membership
        as: branch
        reads: [variant_name, auto_renew, auto_renew_tender]
        note: The included items read the presented membership's tier; the renewal-billing discount reads its automatic renewal setting and tender.
    compute:
      - old_appliances: "SUM('delivery_charges', 'units', event_type='delivery_service_charged', charge_type='installation_parts_kit')"
      - removal_membership: "CFIELD('order', 'membership_id', order_id=F('order_id'))"
      - removal_tier: "CFIELD('membership', 'variant_name', membership_id=removal_membership)"
      - included_items: "0 if (removal_tier == 'Northgate Business Membership' or removal_tier == 'Northgate Business Plus Membership') else (K('plus_included_items') if removal_tier == 'Northgate Club Plus Membership' else P('haul_away_included_items'))"
      - removed_beyond: "MX(0, old_appliances - included_items)"
      - removal_sold: "XSUM('order', 'order_lines', 'line_amount', event_type='order_line_sold', order_id=F('order_id'))"
      - removal_returned: "XSUM('order', 'order_lines', 'line_amount', event_type='order_line_returned', order_id=F('order_id'))"
      - removal_merchandise: "removal_sold - removal_returned"
      - removal_fee: "K('removal_fee_high_spend') if removal_merchandise >= K('spend_high_usd') else (K('removal_fee_mid_spend') if removal_merchandise >= K('spend_mid_usd') else P('haul_away_fee_per_item_usd'))"
      - planning_days: "DAYS(F('booked_date'), F('scheduled_date'))"
      - removal_amount: "(removal_fee if removed_beyond > 0 else 0) if planning_days >= K('consolidated_days') else ((MN(removed_beyond, 1) * removal_fee + MX(0, removed_beyond - 1) * removal_fee * K('further_item_share')) if planning_days >= K('graduated_days') else removed_beyond * removal_fee)"
      - request_days: "DAYS(NOW, F('scheduled_date'))"
      - late_removal_pct: "K('late_surcharge_short_pct') if request_days <= K('late_short_days') else (K('late_surcharge_mid_pct') if request_days <= K('late_mid_days') else 0)"
      - renew_on: "CFIELD('membership', 'auto_renew', membership_id=removal_membership)"
      - renew_tender: "CFIELD('membership', 'auto_renew_tender', membership_id=removal_membership)"
      - renewal_pct: "K('renewal_visa_pct') if (renew_on == True and renew_tender == 'northgate_visa') else (K('renewal_other_pct') if (renew_on == True and renew_tender != 'northgate_visa') else 0)"
      - result: "RND(removal_amount * (1 + late_removal_pct / 100) * (1 - renewal_pct / 100), 2)"
    compute_basis:
      old_appliances: "The old appliances removed are one for each appliance the appointment installs, the appliances installed being the kit units its installation parts kit entries carry, and the entry carries that number as its units."
      removal_membership: "The included haul-away items follow the membership presented on the purchase being delivered"
      removal_tier: "The included haul-away items follow the membership presented on the purchase being delivered"
      included_items: "a Northgate Business Membership or Northgate Business Plus Membership has no included items, because removal for a business account is never free; a Northgate Club Plus Membership has 2 included items; and any other membership has the service level's included haul-away items."
      removed_beyond: "The removed appliances beyond the included items never fall below zero."
      removal_sold: "The per-item removal fee follows the merchandise on the purchase being delivered, counted as the amounts of its sale lines less the amounts of its returned lines"
      removal_returned: "The per-item removal fee follows the merchandise on the purchase being delivered, counted as the amounts of its sale lines less the amounts of its returned lines"
      removal_fee: "$2,500.00 or more pays $15.00 an item, $1,500.00 or more but under $2,500.00 pays $20.00 an item, and under $1,500.00 pays the service level's per-item haul-away fee."
      planning_days: "counted in calendar days from the appointment's booking date to its currently booked delivery date"
      removal_amount: "with 21 or more days the removal rides one consolidated recycler trip and is charged the per-item removal fee once, whatever the number of appliances; with 10 to 20 days the first appliance is charged the per-item removal fee and every further appliance half of it; and with fewer than 10 days every appliance is charged the per-item removal fee."
      request_days: "according to the calendar days from today to the currently booked delivery date"
      late_removal_pct: "The removal amount so priced then carries a late-request surcharge, a percentage of it added to it, according to the calendar days from today to the currently booked delivery date: one day or fewer adds 100 percent, two to five days add 50 percent, and six or more days add nothing."
      renew_on: "a presented membership whose automatic renewal is billed to the Northgate Visa takes 20 percent off, one whose automatic renewal is billed to any other tender takes 10 percent off, and one not on automatic renewal takes nothing off."
      renew_tender: "a presented membership whose automatic renewal is billed to the Northgate Visa takes 20 percent off, one whose automatic renewal is billed to any other tender takes 10 percent off, and one not on automatic renewal takes nothing off."
      renewal_pct: "A renewal-billing discount is then taken off the surcharged amount once: a presented membership whose automatic renewal is billed to the Northgate Visa takes 20 percent off, one whose automatic renewal is billed to any other tender takes 10 percent off, and one not on automatic renewal takes nothing off."
      result: "The charge is rounded to the cent once, at the end, half up."
    factors:
      - id: removal_included_items
        effect: parameter
        decides: included_items
        bindings: [removal_membership, removal_tier, included_items]
        ladder:
          - when: "the delivered purchase presented a Northgate Business Membership or Northgate Business Plus Membership"
            value: "no included items"
          - when: "the delivered purchase presented a Northgate Club Plus Membership"
            value: "K('plus_included_items') = 2 included items"
          - when: "otherwise (any other membership presented)"
            value: "P('haul_away_included_items'), the service level's included items"
        baseline:
          included_items: "P('haul_away_included_items')"
        evidence: [cross_category]
        cross_difficulty: membership
      - id: removal_fee_by_purchase
        effect: parameter
        decides: removal_fee
        bindings: [removal_sold, removal_returned, removal_merchandise, removal_fee]
        ladder:
          - when: "the delivered purchase's sale-line amounts less its returned-line amounts come to $2,500.00 or more"
            value: "K('removal_fee_high_spend') = $15.00 an item"
          - when: "they come to $1,500.00 or more but under $2,500.00"
            value: "K('removal_fee_mid_spend') = $20.00 an item"
          - when: "otherwise (under $1,500.00)"
            value: "P('haul_away_fee_per_item_usd'), the service level's per-item fee"
        baseline:
          removal_fee: "P('haul_away_fee_per_item_usd')"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: recycler_trip_schedule
        effect: method
        decides: removal_amount
        bindings: [planning_days, removal_amount]
        ladder:
          - when: "21 or more calendar days from the appointment's booking date to its currently booked delivery date"
            method: "one consolidated recycler trip: the per-item removal fee charged once, whatever the number of appliances"
          - when: "10 to 20 calendar days"
            method: "graduated: the first appliance at the per-item removal fee, every further appliance at half of it"
          - when: "otherwise (fewer than 10 days)"
            method: "itemized: every appliance at the per-item removal fee"
        baseline:
          removal_amount: "removed_beyond * removal_fee"
        evidence: [date]
        cross_difficulty: null
      - id: late_removal_surcharge
        effect: parameter
        decides: late_removal_pct
        bindings: [request_days, late_removal_pct]
        ladder:
          - when: "one or fewer calendar days from today to the currently booked delivery date"
