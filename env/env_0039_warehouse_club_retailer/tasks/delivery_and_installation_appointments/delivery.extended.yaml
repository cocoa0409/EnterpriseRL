      - volume_sold: "XSUM('order', 'order_lines', 'quantity', within_months=12, date_field='event_date', event_type='order_line_sold', merchandise_class='major_appliance')"
      - volume_returned: "XSUM('order', 'order_lines', 'quantity', within_months=12, date_field='event_date', event_type='order_line_returned', merchandise_class='major_appliance')"
      - volume_units: "volume_sold - volume_returned"
      - kit_price: "K('contractor_kit_high_volume') if (kit_business and volume_units >= K('volume_units')) else (K('contractor_kit_low_volume') if (kit_business and volume_units < K('volume_units')) else P('installation_parts_kit_fee_usd'))"
      - stock_reduction: "K('stocked_two_reduction') if kits_standing >= 2 else (K('stocked_one_reduction') if kits_standing == 1 else 0)"
      - kit_months: "MONTHS(CFIELD('membership', 'opened_date', membership_id=kit_membership), NOW)"
      - tenure_reduction: "K('tenure_long_reduction') if kit_months >= K('tenure_long_months') else (K('tenure_mid_reduction') if kit_months >= K('tenure_mid_months') else 0)"
      - first_place_owed: "1 if (kits_standing == 0 and kits_owed > 0) else 0"
      - later_share: "K('later_kit_share_multi') if appliances >= 3 else (K('later_kit_share_pair') if appliances == 2 else 1)"
      - kit_places: "first_place_owed + (kits_owed - first_place_owed) * later_share"
      - kit_tender: "CFIELD('order', 'tender', order_id=F('order_id'))"
      - kit_tender_pct: "K('visa_kit_pct') if kit_tender == 'northgate_visa' else (K('store_card_kit_pct') if kit_tender == 'northgate_store_card' else 0)"
      - result: "RND(kit_places * (kit_price - stock_reduction - tenure_reduction) * (1 - kit_tender_pct / 100), 2)"
    compute_basis:
      appl_sold: "the appliances it installs being the major appliance units sold on the purchase being delivered less the major appliance units returned from it."
      appl_returned: "the appliances it installs being the major appliance units sold on the purchase being delivered less the major appliance units returned from it."
