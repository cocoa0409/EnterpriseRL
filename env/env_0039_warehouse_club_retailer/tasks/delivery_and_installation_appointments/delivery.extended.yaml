    baseline:
      rule: >-
        The haul-away charge is the old appliances removed beyond the service level's included haul-away items,
        at the service level's per-item haul-away fee, with no allowance, schedule, surcharge or discount. The
        charge is rounded to the cent once, at the end, half up.
      params: [haul_away_included_items, haul_away_fee_per_item_usd]
    inputs:
      history:
        - {table: delivery_charges, aggregate: sum, field: units, filters: {event_type: delivery_service_charged, charge_type: installation_parts_kit}}
        - {category: order, table: order_lines, aggregate: sum, field: line_amount, filters: {event_type: order_line_sold}}
        - {category: order, table: order_lines, aggregate: sum, field: line_amount, filters: {event_type: order_line_returned}}
      cross_category: [order, membership]
