        Northgate Threshold Delivery: {placement: "=placement_location", crew: "=crew_size", unpack: "=unpacking_included", assemble: "=assembly_included", debris: "=debris_removal_included", presence: "=customer_presence_required", installs: "=appliance_installation_types", install_labor: "=installation_labor_included", disconnect: "=old_appliance_disconnect_included", max_screen: "=wall_mount_max_screen_inches", surfaces: "=wall_mount_surfaces_supported"}
        Northgate Room of Choice Delivery: {placement: "=placement_location", crew: "=crew_size", unpack: "=unpacking_included", assemble: "=assembly_included", debris: "=debris_removal_included", presence: "=customer_presence_required", installs: "=appliance_installation_types", install_labor: "=installation_labor_included", disconnect: "=old_appliance_disconnect_included", max_screen: "=wall_mount_max_screen_inches", surfaces: "=wall_mount_surfaces_supported"}
        Northgate White Glove Delivery: {placement: "=placement_location", crew: "=crew_size", unpack: "=unpacking_included", assemble: "=assembly_included", debris: "=debris_removal_included", presence: "=customer_presence_required", installs: "=appliance_installation_types", install_labor: "=installation_labor_included", disconnect: "=old_appliance_disconnect_included", max_screen: "=wall_mount_max_screen_inches", surfaces: "=wall_mount_surfaces_supported"}
