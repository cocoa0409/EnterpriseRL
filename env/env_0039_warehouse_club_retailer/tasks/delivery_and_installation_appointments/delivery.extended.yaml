        Northgate Appliance Delivery & Installation: {visible_days: "=visible_damage_claim_window_days", concealed_days: "=concealed_damage_claim_window_days", property_days: "=property_damage_claim_window_days", workmanship_days: "=installation_workmanship_warranty_days"}
