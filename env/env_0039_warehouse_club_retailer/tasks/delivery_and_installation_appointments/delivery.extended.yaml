        ladder:
          - when: "the delivered purchase was paid with the Northgate Visa"
            value: "K('visa_kit_pct') = 10 percent off"
          - when: "the delivered purchase was paid with the Northgate Store Card"
            value: "K('store_card_kit_pct') = 5 percent off"
          - when: "otherwise (any other tender)"
            value: "nothing off"
        baseline:
          kit_tender_pct: "0"
        evidence: [cross_category]
        cross_difficulty: order
    baseline:
