events:
  - type: delivery_scheduled
    target: delivery_holdings
    mutation: create
    meaning: A delivery appointment is booked at a service level for merchandise on one purchase.
    grain: one row per appointment booked
    fields:
      customer_id: the member receiving the delivery
      order_id: the purchase being delivered
      variant_name: the service level booked
      status: always scheduled on booking
      scheduled_date: the delivery date booked
      delivery_window: the arrival window booked
      delivery_postal_code: the ZIP code of the delivery address
      distance_miles: road miles from the delivering club, computed at booking
      booked_date: the date of booking
      reschedule_count: always 0 on booking
      attempt_count: always 0 on booking
    triggers: []

  - type: delivery_rescheduled
    target: delivery_holdings
    mutation: update
    meaning: The member moves a scheduled appointment to another date or window.
    grain: one row per reschedule
    fields:
      scheduled_date: the new delivery date
      delivery_window: the new arrival window
      reschedule_count: increased by one
    triggers: []

  - type: delivery_dispatched
    target: delivery_holdings
    mutation: {transition: {from: scheduled, to: out_for_delivery}}
    meaning: The crew leaves with the merchandise on the delivery date.
    grain: one row per attempt dispatched
    fields:
      status: becomes out_for_delivery
      attempt_count: increased by one
    triggers: []

  - type: delivery_completed
    target: delivery_holdings
    mutation: {transition: {from: out_for_delivery, to: completed}}
    meaning: The crew completes the delivery and any installation and the member signs for it.
    grain: one row per appointment completed
    fields:
      status: becomes completed
      completed_date: the completion date
      crew_arrival_time: the crew's logged arrival time
    triggers:
      - event: order:order_fulfilled
        map: {fulfilled_date: completed_date}

  - type: delivery_attempt_failed
    target: delivery_holdings
    mutation: {transition: {from: out_for_delivery, to: attempt_failed}}
    meaning: The crew cannot complete the delivery on the attempt and logs why.
    grain: one row per failed attempt
    fields:
      status: becomes attempt_failed
      crew_arrival_time: the crew's logged arrival time
      attempt_failure_reason: the reason the crew logged
    triggers: []

  - type: delivery_rebooked
    target: delivery_holdings
    mutation: {transition: {from: attempt_failed, to: scheduled}}
    meaning: A new date is booked after a failed attempt.
    grain: one row per rebooking
    fields:
      status: becomes scheduled
      scheduled_date: the new delivery date
      delivery_window: the new arrival window
    triggers: []

  - type: delivery_cancelled
    target: delivery_holdings
    mutation: {transition: [{from: scheduled, to: cancelled}, {from: attempt_failed, to: cancelled}]}
    meaning: The appointment is cancelled before a successful delivery.
    grain: one row per appointment cancelled
    fields:
      status: becomes cancelled
      closed_date: the cancellation date
    triggers: []

  - type: delivery_service_charged
    target: delivery_charges
    meaning: A delivery or installation fee is charged on the appointment.
    grain: one row per fee component per appointment date per posting
    distinguish_by: [charge_type, service_date, event_date]
    fields:
      charge_type: the fee component
      amount: the fee
      event_date: the posting date
      service_date: the appointment date the fee relates to
      units: billing units (items, flights, miles, or 1)
    account: delivery_fees
    direction: in
    triggers: []

  - type: delivery_charge_credited
    target: delivery_charges
    meaning: All or part of one delivery charge is credited back to the member.
    grain: one row per credit of one charge for one reason
    distinguish_by: [source_charge_id, credit_reason]
    fields:
      charge_type: the fee component credited
      amount: the credit
      event_date: the posting date
      service_date: the appointment date of the credited charge
      units: units credited
      credit_reason: why the credit was issued
      source_charge_id: the exact charge credited
    account: delivery_fees
    direction: out
    triggers: []

measures:
  - id: delivery_msr_plus_on_purchase
    window: the purchase being delivered, on its order_date
    measure: true when the membership on the purchase (order_holdings.membership_id) was held at Northgate Club Plus Membership or Northgate Business Plus Membership on the order date
  - id: delivery_msr_notice_days
    window: from the frozen date to the appointment's currently booked scheduled_date
    measure: number of calendar days from the request date to the booked scheduled_date (the request date being day 0)
  - id: delivery_msr_paid_reschedules
    window: the life of one appointment
    measure: count of delivery_service_charged entries with charge_type reschedule_fee
  - id: delivery_msr_minutes_late
    window: the most recent attempt of one appointment
    measure: minutes from the end time of the booked delivery_window to crew_arrival_time; 0 when the crew arrived before the end of the window
  - id: delivery_msr_charge_net
    window: the life of one charge
    measure: the charge's amount minus every delivery_charge_credited amount whose source_charge_id is that charge

policies:
  - id: delivery_agg_multi_holding
    subject: [delivery_scheduled]
    rule: >
      A member may hold any number of delivery appointments, and one purchase may have several when its
      merchandise needs different service levels — for example a refrigerator on an installation appointment
      and a sofa on a white glove appointment. Each appointment carries its own fees, credits and claims; a
      credit or claim on one appointment is never applied to another, even on the same purchase.
    eligibility: []
    params:
      max_per_customer: null

  - id: delivery_agg_one_open_per_purchase
    subject: [delivery_scheduled]
    rule: >
      A delivery is booked only for a purchase whose status is placed, or fulfilled when the appointment is a
      free workmanship revisit of an earlier installation. A purchase may not have two open appointments at
      the same service level: an appointment is open while its status is scheduled, out_for_delivery or
      attempt_failed, and merchandise to be added to an open appointment is added to it rather than booked
      again. Only purchases on Northgate In-Club Purchase and Northgate Special Order are delivered by
      Northgate crews; orders on the other channels are fulfilled by pickup, the delivery partner, parcel
      carriers or the business delivery routes and are never booked here.
    eligibility:
      - id: purchase_open_for_delivery
        applies_to: [delivery_scheduled]
        kind: state
        condition: A delivery is booked only for a purchase whose status is placed, or fulfilled when the appointment is a free workmanship revisit of an earlier installation.
        evidence_fields: [order_holdings.status, order_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [order_holdings.order_id]
          action_bindings:
            order_holdings.order_id: order_id
        state_contract:
          field: order_holdings.status
          allowed: [placed, fulfilled]
      - id: one_open_appointment_per_level
        applies_to: [delivery_scheduled]
        kind: dedup
        condition: A purchase may not have two open appointments at the same service level
        evidence_fields: [delivery_holdings.order_id, delivery_holdings.variant_name, delivery_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_holdings.order_id]
          action_bindings:
            delivery_holdings.order_id: order_id
        dedup_contract:
          table: delivery_holdings
          mode: separate_record
          object_bindings: {order_id: order_id, variant_name: variant_name}
          duplicate_filters: {status: [scheduled, out_for_delivery, attempt_failed]}
          distinct_fields: [booked_date]
    params:
      delivered_channels: [Northgate In-Club Purchase, Northgate Special Order]

  - id: delivery_booking_and_fees
    subject: [delivery_scheduled, delivery_service_charged]
    rule: >
      A service level is booked only for merchandise in its eligible_merchandise_classes and no heavier than
      max_item_weight_lbs. An address farther than max_service_distance_miles from the delivering club is not
      served. The delivery date booked must fall no earlier than advance_booking_min_days and no later than
      advance_booking_max_days calendar days after the booking date, in one of the delivery_windows_offered.
      At booking the following are charged, each as its own entry dated the booking date with the appointment
      date as service_date: the base_delivery_fee_usd as base_delivery, reduced by plus_base_fee_discount_pct
      when delivery_msr_plus_on_purchase is true; haul-away of old items beyond haul_away_included_items at
      haul_away_fee_per_item_usd each, only where haul_away_available; flights of stairs beyond
      stair_carry_included_flights at stair_carry_fee_per_flight_usd each, only where stair_carry_available
      and never beyond stair_carry_max_flights; road miles beyond included_radius_miles at
      extended_distance_fee_per_mile_usd each; one installation_parts_kit per appliance installed at
      installation_parts_kit_fee_usd; and wall_mount_labor_usd per television mounted. A component whose
      amount comes to zero is not entered. Delivery and installation fees never earn Annual Reward.
    eligibility:
      - id: service_area
        applies_to: [delivery_scheduled]
        kind: authorization
        condition: An address farther than max_service_distance_miles from the delivering club is not served.
        evidence_fields: [delivery_holdings.distance_miles, delivery_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_holdings.order_id]
          action_bindings:
            delivery_holdings.order_id: order_id
      - id: booking_lead_time
        applies_to: [delivery_scheduled]
        kind: authorization
        condition: The delivery date booked must fall no earlier than advance_booking_min_days and no later than advance_booking_max_days calendar days after the booking date, in one of the delivery_windows_offered.
        evidence_fields: [delivery_holdings.scheduled_date, delivery_holdings.booked_date, delivery_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_holdings.order_id]
          action_bindings:
            delivery_holdings.order_id: order_id
    measures: [delivery_msr_plus_on_purchase]
    params:
      per_tier:
        Northgate Curbside Delivery: {base_fee: "=base_delivery_fee_usd", plus_discount_pct: "=plus_base_fee_discount_pct", radius: "=included_radius_miles", per_mile: "=extended_distance_fee_per_mile_usd", max_miles: "=max_service_distance_miles", classes: "=eligible_merchandise_classes", max_weight: "=max_item_weight_lbs", windows: "=delivery_windows_offered", min_lead: "=advance_booking_min_days", max_lead: "=advance_booking_max_days"}
        Northgate Threshold Delivery: {base_fee: "=base_delivery_fee_usd", plus_discount_pct: "=plus_base_fee_discount_pct", radius: "=included_radius_miles", per_mile: "=extended_distance_fee_per_mile_usd", max_miles: "=max_service_distance_miles", classes: "=eligible_merchandise_classes", max_weight: "=max_item_weight_lbs", windows: "=delivery_windows_offered", min_lead: "=advance_booking_min_days", max_lead: "=advance_booking_max_days"}
        Northgate Room of Choice Delivery: {base_fee: "=base_delivery_fee_usd", plus_discount_pct: "=plus_base_fee_discount_pct", radius: "=included_radius_miles", per_mile: "=extended_distance_fee_per_mile_usd", max_miles: "=max_service_distance_miles", classes: "=eligible_merchandise_classes", max_weight: "=max_item_weight_lbs", windows: "=delivery_windows_offered", min_lead: "=advance_booking_min_days", max_lead: "=advance_booking_max_days"}
        Northgate White Glove Delivery: {base_fee: "=base_delivery_fee_usd", plus_discount_pct: "=plus_base_fee_discount_pct", radius: "=included_radius_miles", per_mile: "=extended_distance_fee_per_mile_usd", max_miles: "=max_service_distance_miles", classes: "=eligible_merchandise_classes", max_weight: "=max_item_weight_lbs", windows: "=delivery_windows_offered", min_lead: "=advance_booking_min_days", max_lead: "=advance_booking_max_days"}
        Northgate Appliance Delivery & Installation: {base_fee: "=base_delivery_fee_usd", plus_discount_pct: "=plus_base_fee_discount_pct", radius: "=included_radius_miles", per_mile: "=extended_distance_fee_per_mile_usd", max_miles: "=max_service_distance_miles", classes: "=eligible_merchandise_classes", max_weight: "=max_item_weight_lbs", windows: "=delivery_windows_offered", min_lead: "=advance_booking_min_days", max_lead: "=advance_booking_max_days"}
        Northgate TV Delivery & Wall-Mount Installation: {base_fee: "=base_delivery_fee_usd", plus_discount_pct: "=plus_base_fee_discount_pct", radius: "=included_radius_miles", per_mile: "=extended_distance_fee_per_mile_usd", max_miles: "=max_service_distance_miles", classes: "=eligible_merchandise_classes", max_weight: "=max_item_weight_lbs", windows: "=delivery_windows_offered", min_lead: "=advance_booking_min_days", max_lead: "=advance_booking_max_days"}
    formula:
      base_fee_amount: round(base_delivery_fee_usd * (1 - (plus_base_fee_discount_pct / 100 if delivery_msr_plus_on_purchase else 0)), 2)
      distance_fee_amount: round(max(0, distance_miles - included_radius_miles) * extended_distance_fee_per_mile_usd, 2)
      haul_away_amount: round(max(0, units - haul_away_included_items) * haul_away_fee_per_item_usd, 2)
      stair_amount: round(max(0, units - stair_carry_included_flights) * stair_carry_fee_per_flight_usd, 2)
      parts_kit_amount: round(units * installation_parts_kit_fee_usd, 2)
      wall_mount_amount: round(units * wall_mount_labor_usd, 2)

  - id: delivery_reschedule
    subject: [delivery_rescheduled, delivery_service_charged]
    rule: >
      A member may move an appointment to another date and window offered for the service level. An
      appointment is rescheduled only while its status is scheduled; once the crew is out for delivery the
      date can no longer be moved, and a failed attempt is rebooked under delivery_failed_attempts instead. The
      new date must satisfy the booking lead times measured from the request date, and where
      same_day_reschedule_allowed is false it may not be the request date itself. An appointment is moved at
      most max_reschedules times. A reschedule is free only when at least reschedule_notice_days calendar days
      separate the request date from the booked delivery date and the appointment has made fewer than
      free_reschedules free reschedules (reschedule_count minus delivery_msr_paid_reschedules); otherwise
      reschedule_fee_usd is charged as a reschedule_fee entry whose service_date is the new date. Changing
      only the window on the same date counts as a reschedule.
    eligibility:
      - id: reschedule_needs_scheduled
        applies_to: [delivery_rescheduled]
        kind: state
        condition: An appointment is rescheduled only while its status is scheduled; once the crew is out for delivery the date can no longer be moved, and a failed attempt is rebooked under delivery_failed_attempts instead.
        evidence_fields: [delivery_holdings.status, delivery_holdings.delivery_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_holdings.delivery_id]
          action_bindings:
            delivery_holdings.delivery_id: delivery_id
        state_contract:
          field: delivery_holdings.status
          allowed: [scheduled]
      - id: reschedule_limit
        applies_to: [delivery_rescheduled]
        kind: authorization
        condition: An appointment is moved at most max_reschedules times.
        evidence_fields: [delivery_holdings.reschedule_count, delivery_holdings.delivery_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_holdings.delivery_id]
          action_bindings:
            delivery_holdings.delivery_id: delivery_id
      - id: free_reschedule_notice
        applies_to: [delivery_service_charged]
        kind: authorization
        condition: A reschedule is free only when at least reschedule_notice_days calendar days separate the request date from the booked delivery date and the appointment has made fewer than free_reschedules free reschedules (reschedule_count minus delivery_msr_paid_reschedules); otherwise reschedule_fee_usd is charged as a reschedule_fee entry whose service_date is the new date.
        evidence_fields: [delivery_holdings.scheduled_date, delivery_holdings.reschedule_count, delivery_holdings.delivery_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_holdings.delivery_id]
          action_bindings:
            delivery_holdings.delivery_id: delivery_id
    measures: [delivery_msr_notice_days, delivery_msr_paid_reschedules]
    params:
      per_tier:
        Northgate Curbside Delivery: {notice_days: "=reschedule_notice_days", free_count: "=free_reschedules", fee: "=reschedule_fee_usd", max_count: "=max_reschedules", same_day: "=same_day_reschedule_allowed"}
        Northgate Threshold Delivery: {notice_days: "=reschedule_notice_days", free_count: "=free_reschedules", fee: "=reschedule_fee_usd", max_count: "=max_reschedules", same_day: "=same_day_reschedule_allowed"}
        Northgate Room of Choice Delivery: {notice_days: "=reschedule_notice_days", free_count: "=free_reschedules", fee: "=reschedule_fee_usd", max_count: "=max_reschedules", same_day: "=same_day_reschedule_allowed"}
        Northgate White Glove Delivery: {notice_days: "=reschedule_notice_days", free_count: "=free_reschedules", fee: "=reschedule_fee_usd", max_count: "=max_reschedules", same_day: "=same_day_reschedule_allowed"}
        Northgate Appliance Delivery & Installation: {notice_days: "=reschedule_notice_days", free_count: "=free_reschedules", fee: "=reschedule_fee_usd", max_count: "=max_reschedules", same_day: "=same_day_reschedule_allowed"}
        Northgate TV Delivery & Wall-Mount Installation: {notice_days: "=reschedule_notice_days", free_count: "=free_reschedules", fee: "=reschedule_fee_usd", max_count: "=max_reschedules", same_day: "=same_day_reschedule_allowed"}
    formula:
      reschedule_fee_due: 0 if (delivery_msr_notice_days >= reschedule_notice_days and reschedule_count - delivery_msr_paid_reschedules < free_reschedules) else reschedule_fee_usd

  - id: delivery_failed_attempts
    subject: [delivery_attempt_failed, delivery_rebooked, delivery_cancelled, delivery_service_charged]
    rule: >
      When a crew cannot complete an attempt it logs the attempt_failure_reason. A failed delivery is rebooked
      only when the new date is booked no later than rebook_deadline_days calendar days after the date of the
      failed attempt. Days are counted as calendar days, the date of the failed attempt being day 0. A failed
      delivery is rebooked only while attempt_count is below max_delivery_attempts. The new date follows the
      booking lead times measured from the rebooking date. When the logged reason is in attempt_fault_reasons
      the rebooking is charged redelivery_fee_usd as a redelivery_fee entry whose service_date is the failed
      date; a failure for merchandise_damaged_on_truck or carrier_delay is Northgate's and is rebooked free. A
      failed appointment not rebooked by the deadline, or whose attempts have reached max_delivery_attempts,
      is cancelled and its merchandise returned to the club; its fees are then credited under
      delivery_cancellation as if cancelled without notice when the last failure was member-caused, and in
      full otherwise.
    eligibility:
      - id: rebook_deadline
        applies_to: [delivery_rebooked]
        kind: time
        condition: A failed delivery is rebooked only when the new date is booked no later than rebook_deadline_days calendar days after the date of the failed attempt.
        evidence_fields: [delivery_holdings.scheduled_date, delivery_holdings.delivery_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_holdings.delivery_id]
          action_bindings:
            delivery_holdings.delivery_id: delivery_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the failed attempt
          anchor_source: delivery_holdings.scheduled_date
          relation: not_after
          duration_source: variants.rebook_deadline_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the date of the failed attempt being day 0.
          boundary: inclusive
      - id: attempt_limit
        applies_to: [delivery_rebooked]
        kind: authorization
        condition: A failed delivery is rebooked only while attempt_count is below max_delivery_attempts.
        evidence_fields: [delivery_holdings.attempt_count, delivery_holdings.delivery_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_holdings.delivery_id]
          action_bindings:
            delivery_holdings.delivery_id: delivery_id
    params:
      per_tier:
        Northgate Curbside Delivery: {fault_reasons: "=attempt_fault_reasons", redelivery_fee: "=redelivery_fee_usd", max_attempts: "=max_delivery_attempts", rebook_days: "=rebook_deadline_days"}
        Northgate Threshold Delivery: {fault_reasons: "=attempt_fault_reasons", redelivery_fee: "=redelivery_fee_usd", max_attempts: "=max_delivery_attempts", rebook_days: "=rebook_deadline_days"}
        Northgate Room of Choice Delivery: {fault_reasons: "=attempt_fault_reasons", redelivery_fee: "=redelivery_fee_usd", max_attempts: "=max_delivery_attempts", rebook_days: "=rebook_deadline_days"}
        Northgate White Glove Delivery: {fault_reasons: "=attempt_fault_reasons", redelivery_fee: "=redelivery_fee_usd", max_attempts: "=max_delivery_attempts", rebook_days: "=rebook_deadline_days"}
        Northgate Appliance Delivery & Installation: {fault_reasons: "=attempt_fault_reasons", redelivery_fee: "=redelivery_fee_usd", max_attempts: "=max_delivery_attempts", rebook_days: "=rebook_deadline_days"}
        Northgate TV Delivery & Wall-Mount Installation: {fault_reasons: "=attempt_fault_reasons", redelivery_fee: "=redelivery_fee_usd", max_attempts: "=max_delivery_attempts", rebook_days: "=rebook_deadline_days"}

  - id: delivery_missed_window_credit
    subject: [delivery_charge_credited]
    rule: >
      Northgate credits a late crew. A crew arrival counts as late only when delivery_msr_minutes_late exceeds
      late_arrival_grace_minutes. A late arrival earns a credit of missed_window_credit_usd applied to the
      appointment's charge of type missed_window_credit_against, never more than that charge's
      delivery_msr_charge_net; a service level whose credit is zero, or an appointment with no such charge,
      earns nothing. A delivery credit is posted only on an appointment whose status is completed,
      attempt_failed or cancelled; nothing is credited while the delivery is still scheduled or under way. An
      appointment earns at most one late-arrival credit, and a late attempt that then failed for a reason in
      attempt_fault_reasons earns none.
    eligibility:
      - id: crew_arrived_late
        applies_to: [delivery_charge_credited]
        kind: authorization
        condition: A crew arrival counts as late only when delivery_msr_minutes_late exceeds late_arrival_grace_minutes.
        evidence_fields: [delivery_holdings.crew_arrival_time, delivery_holdings.delivery_window, delivery_holdings.delivery_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_holdings.delivery_id]
          action_bindings:
            delivery_holdings.delivery_id: delivery_id
      - id: credit_status
        applies_to: [delivery_charge_credited]
        kind: state
        condition: A delivery credit is posted only on an appointment whose status is completed, attempt_failed or cancelled; nothing is credited while the delivery is still scheduled or under way.
        evidence_fields: [delivery_holdings.status, delivery_holdings.delivery_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_holdings.delivery_id]
          action_bindings:
            delivery_holdings.delivery_id: delivery_id
        state_contract:
          field: delivery_holdings.status
          allowed: [completed, attempt_failed, cancelled]
      - id: one_late_credit
        applies_to: [delivery_charge_credited]
        kind: dedup
        condition: An appointment earns at most one late-arrival credit
        evidence_fields: [delivery_charges.delivery_id, delivery_charges.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_charges.delivery_id]
          action_bindings:
            delivery_charges.delivery_id: delivery_id
        dedup_contract:
          table: delivery_charges
          mode: separate_record
          object_bindings: {delivery_id: delivery_id}
          duplicate_filters: {credit_reason: [missed_window]}
          distinct_fields: []
    measures: [delivery_msr_minutes_late, delivery_msr_charge_net]
    params:
      per_tier:
        Northgate Curbside Delivery: {grace_minutes: "=late_arrival_grace_minutes", credit: "=missed_window_credit_usd", against: "=missed_window_credit_against"}
        Northgate Threshold Delivery: {grace_minutes: "=late_arrival_grace_minutes", credit: "=missed_window_credit_usd", against: "=missed_window_credit_against"}
        Northgate Room of Choice Delivery: {grace_minutes: "=late_arrival_grace_minutes", credit: "=missed_window_credit_usd", against: "=missed_window_credit_against"}
        Northgate White Glove Delivery: {grace_minutes: "=late_arrival_grace_minutes", credit: "=missed_window_credit_usd", against: "=missed_window_credit_against"}
        Northgate Appliance Delivery & Installation: {grace_minutes: "=late_arrival_grace_minutes", credit: "=missed_window_credit_usd", against: "=missed_window_credit_against"}
        Northgate TV Delivery & Wall-Mount Installation: {grace_minutes: "=late_arrival_grace_minutes", credit: "=missed_window_credit_usd", against: "=missed_window_credit_against"}
    formula:
      late_credit_amount: min(missed_window_credit_usd, delivery_msr_charge_net) if delivery_msr_minutes_late > late_arrival_grace_minutes else 0

  - id: delivery_cancellation
    subject: [delivery_cancelled, delivery_charge_credited]
    rule: >
      A member may cancel an appointment that is scheduled or whose attempt failed. Every fee on the
      appointment is credited in full only when at least cancel_full_refund_notice_days calendar days separate
      the cancellation request from the booked delivery date. With less notice, the base_delivery charge is
      kept where late_cancellation_retains_base_fee is true and every other charge is credited in full. Each
      credit is a cancellation_refund entry against the charge it returns, for that charge's
      delivery_msr_charge_net. Cancelling an appointment does not cancel or return the purchase: the
      merchandise is held at the club for pickup, and the member who no longer wants it returns it under the
      purchase's own return rules.
    eligibility:
      - id: cancellation_notice
        applies_to: [delivery_charge_credited]
        kind: authorization
        condition: Every fee on the appointment is credited in full only when at least cancel_full_refund_notice_days calendar days separate the cancellation request from the booked delivery date.
        evidence_fields: [delivery_holdings.scheduled_date, delivery_holdings.delivery_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_holdings.delivery_id]
          action_bindings:
            delivery_holdings.delivery_id: delivery_id
    measures: [delivery_msr_notice_days, delivery_msr_charge_net]
    params:
      per_tier:
        Northgate Curbside Delivery: {notice_days: "=cancel_full_refund_notice_days", keep_base: "=late_cancellation_retains_base_fee"}
        Northgate Threshold Delivery: {notice_days: "=cancel_full_refund_notice_days", keep_base: "=late_cancellation_retains_base_fee"}
        Northgate Room of Choice Delivery: {notice_days: "=cancel_full_refund_notice_days", keep_base: "=late_cancellation_retains_base_fee"}
        Northgate White Glove Delivery: {notice_days: "=cancel_full_refund_notice_days", keep_base: "=late_cancellation_retains_base_fee"}
        Northgate Appliance Delivery & Installation: {notice_days: "=cancel_full_refund_notice_days", keep_base: "=late_cancellation_retains_base_fee"}
        Northgate TV Delivery & Wall-Mount Installation: {notice_days: "=cancel_full_refund_notice_days", keep_base: "=late_cancellation_retains_base_fee"}

  - id: delivery_post_delivery_claims
    subject: [delivery_charge_credited, delivery_completed]
    rule: >
      Problems found after a completed delivery are taken as claims: member services records the claim as
      submitted, the member confirms it, and the delivery claims desk approves or denies it. Merchandise
      damage seen at delivery is claimed only when it is reported no later than
      visible_damage_claim_window_days calendar days after the completion date. Days are counted as calendar
      days, the completion date being day 0. Damage found on unpacking packaged merchandise may be reported
      until concealed_damage_claim_window_days, damage to the home until property_damage_claim_window_days, and
      a faulty installation until installation_workmanship_warranty_days, each counted the same way from the
      completion date. An approved merchandise_damaged claim credits the appointment's base_delivery charge in
      full as a damage_settlement entry, while the damaged merchandise itself is replaced or refunded under the
      purchase's return rules. An installation_defect within the workmanship warranty is corrected on a free
      revisit appointment at the same service level; a paid add-on that the crew did not perform (haul-away,
      stairs, parts kit or wall mount) is credited as service_not_performed. Property damage is settled by the
      claims desk with the crew's contractor and member services never credits or pays it. Missing items are
      handled under the purchase's returnless refund rules.
    eligibility:
      - id: visible_damage_window
        applies_to: [delivery_charge_credited]
        kind: time
        condition: Merchandise damage seen at delivery is claimed only when it is reported no later than visible_damage_claim_window_days calendar days after the completion date.
        evidence_fields: [delivery_holdings.completed_date, delivery_claims.reported_date, delivery_holdings.delivery_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_holdings.delivery_id]
          action_bindings:
            delivery_holdings.delivery_id: delivery_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the completion date
          anchor_source: delivery_holdings.completed_date
          relation: not_after
          duration_source: variants.visible_damage_claim_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the completion date being day 0.
          boundary: inclusive
      - id: claim_approved_before_credit
        applies_to: [delivery_charge_credited]
        kind: state
