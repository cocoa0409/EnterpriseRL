      kit_business: "a Northgate Business Membership or Northgate Business Plus Membership with 4 or more such units pays the contractor price of $27.99"
      volume_sold: "counted as the major appliance units the member bought on any purchase less those returned, a line counting only when fewer than twelve whole months separate its posting date from today"
      volume_returned: "counted as the major appliance units the member bought on any purchase less those returned, a line counting only when fewer than twelve whole months separate its posting date from today"
      kit_price: "a Northgate Business Membership or Northgate Business Plus Membership with 4 or more such units pays the contractor price of $27.99, a Northgate Business Membership or Northgate Business Plus Membership with fewer than 4 such units pays the contractor price of $33.99, and any other membership pays the service level's installation parts kit fee."
      stock_reduction: "The kit price is lowered by a fittings-stock reduction that follows the kit units already standing on the appointment's installation parts kit entries: 2 or more units lower it by $5.00, 1 unit lowers it by $2.50, and none leaves it unlowered."
      kit_months: "The kit price is also lowered by a tenure reduction that follows the whole months from the presented membership's opened date to today"
      tenure_reduction: "180 or more months lower it by $4.00, 96 to 179 months lower it by $2.00, and fewer than 96 months leave it unlowered."
      first_place_owed: "counting the kits in order, the kits already standing first and the kits owed after them"
      later_share: "when it installs three or more, the first kit carries the full lowered price and every later kit one half of it; when it installs exactly two, the first kit carries the full lowered price and the second three quarters of it; and when it installs one, that kit carries the full lowered price."
      kit_places: "The kits' amount is the lowered kit price taken over the kits owed as their places give."
      kit_tender: "a purchase paid with the Northgate Visa takes 10 percent off"
      kit_tender_pct: "A tender discount is then taken off the kits' amount once: a purchase paid with the Northgate Visa takes 10 percent off, a purchase paid with the Northgate Store Card takes 5 percent off, and a purchase paid any other way takes nothing off."
      result: "The charge is rounded to the cent once, at the end, half up."
    factors:
      - id: contractor_kit_price
        effect: parameter
        decides: kit_price
        bindings: [kit_tier, kit_business, volume_sold, volume_returned, volume_units, kit_price]
        ladder:
          - when: "the purchase presented a Northgate Business or Business Plus Membership and the member bought 4 or more major appliance units (net of returns) within the last twelve whole months"
            value: "K('contractor_kit_high_volume') = $27.99 per kit"
          - when: "the purchase presented a Northgate Business or Business Plus Membership and the member bought fewer than 4 such units"
            value: "K('contractor_kit_low_volume') = $33.99 per kit"
          - when: "otherwise (any other membership presented)"
            value: "P('installation_parts_kit_fee_usd'), the service level's kit fee"
        baseline:
          kit_price: "P('installation_parts_kit_fee_usd')"
        evidence: [cross_category, history, date]
        cross_difficulty: membership
      - id: fittings_stock_reduction
        effect: parameter
        decides: stock_reduction
        bindings: [kits_standing, stock_reduction]
        ladder:
          - when: "the appointment's installation parts kit entries already carry 2 or more kit units"
            value: "K('stocked_two_reduction') = $5.00 off each kit"
          - when: "they carry exactly 1 kit unit"
            value: "K('stocked_one_reduction') = $2.50 off each kit"
          - when: "otherwise (no kit unit standing)"
            value: "no reduction"
        baseline:
          stock_reduction: "0"
        evidence: [history]
        cross_difficulty: null
      - id: kit_tenure_reduction
        effect: parameter
        decides: tenure_reduction
        bindings: [kit_months, tenure_reduction]
        ladder:
          - when: "180 or more whole months from the presented membership's opened date to today"
            value: "K('tenure_long_reduction') = $4.00 off each kit"
          - when: "96 to 179 whole months"
            value: "K('tenure_mid_reduction') = $2.00 off each kit"
          - when: "otherwise (fewer than 96 months)"
            value: "no reduction"
        baseline:
          tenure_reduction: "0"
        evidence: [cross_category, date]
        cross_difficulty: membership
      - id: kit_place_schedule
        effect: method
        decides: kit_places
        bindings: [appl_sold, appl_returned, appliances, first_place_owed, later_share, kit_places]
        ladder:
          - when: "the appointment installs three or more appliances (major appliance units sold on the delivered purchase less those returned)"
            method: "kits priced by place: the first kit of the appointment at the full lowered price, every later kit at half of it"
          - when: "the appointment installs exactly two appliances"
            method: "kits priced by place: the first kit at the full lowered price, the second at three quarters of it"
          - when: "otherwise (one appliance)"
            method: "every kit owed at the full lowered price, whatever its place"
        baseline:
