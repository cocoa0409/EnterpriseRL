      - appl_returned: "XSUM('order', 'order_lines', 'quantity', event_type='order_line_returned', merchandise_class='major_appliance', order_id=F('order_id'))"
      - appliances: "appl_sold - appl_returned"
      - kits_standing: "SUM('delivery_charges', 'units', event_type='delivery_service_charged', charge_type='installation_parts_kit')"
      - kits_owed: "MX(0, appliances - kits_standing)"
      - kit_membership: "CFIELD('order', 'membership_id', order_id=F('order_id'))"
      - kit_tier: "CFIELD('membership', 'variant_name', membership_id=kit_membership)"
