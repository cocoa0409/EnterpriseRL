# Northgate Wholesale Club — delivery and installation charter.
# Big and bulky merchandise bought in a club or as a special order is delivered by Northgate's contracted
# crews on a booked appointment. The appointment is held at a service level (the tier) and booked through
# delivery charges (base fee, haul-away, stairs, distance, installation) and delivery credits.

category: delivery
display_name: Northgate Delivery & Installation

binding:
  holding_table: delivery_holdings
  event_tables: [delivery_charges]
  intake_tables: [delivery_claims]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [scheduled, out_for_delivery, completed, attempt_failed, cancelled]
  transitions:
    - {from: scheduled, to: out_for_delivery, by: system, means: "The crew is dispatched with the merchandise on the booked date."}
    - {from: out_for_delivery, to: completed, by: system, means: "The crew finishes delivery (and installation) and the member signs the handheld."}
    - {from: out_for_delivery, to: attempt_failed, by: system, means: "The crew cannot complete the delivery and logs the reason on the handheld."}
    - {from: attempt_failed, to: scheduled, by: agent, means: "Member services books a new date for a failed delivery."}
    - {from: scheduled, to: cancelled, by: agent, means: "The member cancels the appointment before the crew is dispatched."}
    - {from: attempt_failed, to: cancelled, by: agent, means: "A failed delivery is cancelled because the member cancels it, the attempt limit is reached or the rebooking deadline passes; the merchandise goes back to the club."}

accounts:
  - key: delivery_fees
    unit: USD
    meaning: Delivery and installation fees charged on the appointment, net of credits.

parameter_schema:
  base_delivery_fee_usd: "base fee for the service level, charged at booking (USD)"
  placement_location: "where the crew leaves the merchandise (string code)"
  crew_size: "number of crew members sent (count)"
  unpacking_included: "whether the crew unpacks the merchandise (boolean)"
  assembly_included: "whether the crew assembles furniture and fitness equipment that ships unassembled (boolean)"
  debris_removal_included: "whether the crew removes packaging from the home (boolean)"
  eligible_merchandise_classes: "merchandise classes the service level can be booked for (list of merchandise_class values)"
  max_item_weight_lbs: "heaviest single item the service level accepts (pounds)"
  haul_away_available: "whether the crew can remove old items (boolean)"
  haul_away_included_items: "old items removed at no charge (count)"
  haul_away_fee_per_item_usd: "fee per old item removed beyond those included (USD)"
  stair_carry_available: "whether the crew carries merchandise up or down stairs (boolean)"
  stair_carry_included_flights: "flights of stairs included in the base fee (count)"
  stair_carry_fee_per_flight_usd: "fee per flight of stairs beyond those included (USD)"
  stair_carry_max_flights: "most flights of stairs the crew will carry (count)"
  included_radius_miles: "road miles from the delivering club included in the base fee (miles)"
  extended_distance_fee_per_mile_usd: "fee per road mile beyond the included radius (USD per mile)"
  max_service_distance_miles: "farthest delivery address served (miles)"
  installation_labor_included: "whether basic installation labor is included (boolean)"
  appliance_installation_types: "appliance installations the crew performs (list of strings)"
  old_appliance_disconnect_included: "whether the crew disconnects the appliance being replaced (boolean)"
  installation_parts_kit_fee_usd: "fee per appliance for the installation parts kit (hoses, cords, vent, water line) (USD)"
  wall_mount_labor_usd: "fee for mounting one television on the wall (USD)"
  wall_mount_max_screen_inches: "largest screen size mounted (inches; 0 = no wall mounting)"
  wall_mount_surfaces_supported: "wall constructions the crew mounts on (list of strings)"
  delivery_windows_offered: "arrival windows that can be booked (list of delivery_window values)"
  advance_booking_min_days: "earliest delivery date, in calendar days after the booking date (days)"
  advance_booking_max_days: "latest delivery date, in calendar days after the booking date (days)"
  customer_presence_required: "whether an adult must be at the address during the window (boolean)"
  same_day_reschedule_allowed: "whether an appointment can be moved to the date the request is made (boolean)"
  reschedule_notice_days: "calendar days that must separate the request date from the booked date for a reschedule to be free (days)"
  free_reschedules: "reschedules made with notice that are free (count)"
  reschedule_fee_usd: "fee for a reschedule made without notice or beyond the free reschedules (USD)"
  max_reschedules: "most times an appointment can be moved (count)"
  attempt_fault_reasons: "attempt failure reasons that count as caused by the member (list of attempt_failure_reason values)"
  redelivery_fee_usd: "fee for a new attempt after a member-caused failed attempt (USD)"
  max_delivery_attempts: "attempts after which an undelivered appointment is cancelled (count)"
  rebook_deadline_days: "calendar days after a failed attempt within which a new date must be booked (days)"
  late_arrival_grace_minutes: "minutes after the end of the booked window before a crew arrival counts as late (minutes)"
  missed_window_credit_usd: "credit for a late crew arrival, never more than the charge it is applied to (USD)"
  missed_window_credit_against: "the charge_type the late-arrival credit is applied to (charge_type value)"
  cancel_full_refund_notice_days: "calendar days that must separate the cancellation request from the booked date for every fee to be refunded (days)"
  late_cancellation_retains_base_fee: "whether a cancellation without that notice keeps the base delivery fee (boolean)"
  visible_damage_claim_window_days: "calendar days after completion within which visible merchandise damage must be reported (days)"
  concealed_damage_claim_window_days: "calendar days after completion within which damage found on unpacking must be reported (days)"
  property_damage_claim_window_days: "calendar days after completion within which damage to the home must be reported (days)"
  installation_workmanship_warranty_days: "calendar days after completion during which a faulty installation is redone free (days)"
  plus_base_fee_discount_pct: "discount on the base delivery fee when the purchase carried a Plus-tier membership (percent)"

