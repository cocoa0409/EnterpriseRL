  - id: membership_auto_renewal
    subject: [membership_auto_renew_changed, membership_term_renewed]
    rule: >
      Automatic renewal may be switched on only for a tier with auto_renew_allowed and only on a tender listed
      in the tier's auto_renew_tenders. Automatic renewal is changed only on a membership whose status is
      active; an expired membership must be renewed first. Automatic renewal on the northgate_visa tender is
      set up only when the member holds a Northgate Rewards Visa card account in active status linked to this
      membership. The reminder email goes out auto_renew_reminder_days before expiry_date; the renewal fee is
      charged auto_renew_charge_day_offset days after expiry_date as an on-time renewal under
      membership_renewal_dating. A declined charge is retried auto_renew_retry_count times,
      auto_renew_retry_interval_days apart; if every retry is declined the membership lapses to expired and
      auto_renew stays on until the member changes it. The member may switch automatic renewal off at any time
      before the charge posts; switching it off after the renewal fee has posted does not reverse that fee,
      which can only be recovered through a cancellation under membership_cancellation_refund.
    eligibility:
      - id: auto_renew_needs_active
        applies_to: [membership_auto_renew_changed]
        kind: state
        condition: Automatic renewal is changed only on a membership whose status is active; an expired membership must be renewed first.
        evidence_fields: [membership_holdings.status, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        state_contract:
          field: membership_holdings.status
          allowed: [active]
      - id: visa_tender_needs_linked_card
        applies_to: [membership_auto_renew_changed]
        kind: state
        condition: Automatic renewal on the northgate_visa tender is set up only when the member holds a Northgate Rewards Visa card account in active status linked to this membership.
        evidence_fields: [card_holdings.status, card_holdings.linked_membership_id, card_holdings.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_holdings.linked_membership_id]
          action_bindings:
            card_holdings.linked_membership_id: membership_id
        state_contract:
          field: card_holdings.status
          allowed: [active]
    params:
      per_tier:
        Northgate Student Club Membership: {allowed: "=auto_renew_allowed", tenders: "=auto_renew_tenders", reminder_days: "=auto_renew_reminder_days", charge_offset: "=auto_renew_charge_day_offset", retries: "=auto_renew_retry_count", retry_interval: "=auto_renew_retry_interval_days"}
        Northgate Heroes Club Membership: {allowed: "=auto_renew_allowed", tenders: "=auto_renew_tenders", reminder_days: "=auto_renew_reminder_days", charge_offset: "=auto_renew_charge_day_offset", retries: "=auto_renew_retry_count", retry_interval: "=auto_renew_retry_interval_days"}
        Northgate Club Membership: {allowed: "=auto_renew_allowed", tenders: "=auto_renew_tenders", reminder_days: "=auto_renew_reminder_days", charge_offset: "=auto_renew_charge_day_offset", retries: "=auto_renew_retry_count", retry_interval: "=auto_renew_retry_interval_days"}
        Northgate Business Membership: {allowed: "=auto_renew_allowed", tenders: "=auto_renew_tenders", reminder_days: "=auto_renew_reminder_days", charge_offset: "=auto_renew_charge_day_offset", retries: "=auto_renew_retry_count", retry_interval: "=auto_renew_retry_interval_days"}
        Northgate Club Plus Membership: {allowed: "=auto_renew_allowed", tenders: "=auto_renew_tenders", reminder_days: "=auto_renew_reminder_days", charge_offset: "=auto_renew_charge_day_offset", retries: "=auto_renew_retry_count", retry_interval: "=auto_renew_retry_interval_days"}
        Northgate Business Plus Membership: {allowed: "=auto_renew_allowed", tenders: "=auto_renew_tenders", reminder_days: "=auto_renew_reminder_days", charge_offset: "=auto_renew_charge_day_offset", retries: "=auto_renew_retry_count", retry_interval: "=auto_renew_retry_interval_days"}

  - id: membership_status_enforcement
    subject: [membership_expired, membership_suspended, membership_reinstated, membership_closed]
    rule: >
      A membership not renewed by the end of its expiry_date becomes expired the next day. When a membership
      fee payment is charged back by the card issuer, the membership office suspends the membership; member
      services cannot lift a suspension, and the suspension is lifted by the membership office once the
      charged-back fee has been repaid at a club membership counter. An expired membership is closed only when
      the frozen date is later than lapsed_close_months calendar months after the expiry date of its last
      membership year. Calendar months are added to the expiry date and, when the resulting month has no such
      day, the boundary falls on that month's last day. A suspension not cleared within suspension_close_days
      calendar days ends in closure. A closed membership keeps its history but can never be renewed or
      reopened; the person enrolls again under a new membership number, and any unredeemed certificate of the
      closed membership is void.
    eligibility:
      - id: close_after_lapse_period
        applies_to: [membership_closed]
        kind: time
        condition: An expired membership is closed only when the frozen date is later than lapsed_close_months calendar months after the expiry date of its last membership year.
        evidence_fields: [membership_holdings.expiry_date, membership_holdings.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [membership_holdings.membership_id]
          action_bindings:
            membership_holdings.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the expiry date of its last membership year
          anchor_source: membership_holdings.expiry_date
          relation: not_before
          duration_source: variants.lapsed_close_months
          unit: calendar_months
          counting_rule: Calendar months are added to the expiry date and, when the resulting month has no such day, the boundary falls on that month's last day.
          boundary: exclusive
    params:
      per_tier:
        Northgate Student Club Membership: {close_after_months: "=lapsed_close_months", suspension_close: "=suspension_close_days"}
        Northgate Heroes Club Membership: {close_after_months: "=lapsed_close_months", suspension_close: "=suspension_close_days"}
        Northgate Club Membership: {close_after_months: "=lapsed_close_months", suspension_close: "=suspension_close_days"}
        Northgate Business Membership: {close_after_months: "=lapsed_close_months", suspension_close: "=suspension_close_days"}
        Northgate Club Plus Membership: {close_after_months: "=lapsed_close_months", suspension_close: "=suspension_close_days"}
        Northgate Business Plus Membership: {close_after_months: "=lapsed_close_months", suspension_close: "=suspension_close_days"}

  - id: membership_tier_benefits
    subject: [membership_enrolled, membership_upgraded, membership_downgraded]
    rule: >
      The everyday privileges of a tier — early_shopping_minutes before regular club hours, up to
      guest_limit_per_visit guests per visit (a guest may not make purchases), and fuel_discount_cents_per_gallon
      off the posted Northgate Fuel Center price — apply to every active card on the membership from the day
      the tier is recorded on the membership and are never applied retroactively to earlier visits or fuel
      purchases. A downgrade removes the Plus privileges from the day it is recorded; Annual Reward already
      accrued stays on the membership and is issued at the year end under membership_reward_certificates.
    eligibility: []
    params:
      per_tier:
        Northgate Student Club Membership: {early_minutes: "=early_shopping_minutes", guests: "=guest_limit_per_visit", fuel_cents: "=fuel_discount_cents_per_gallon"}
        Northgate Heroes Club Membership: {early_minutes: "=early_shopping_minutes", guests: "=guest_limit_per_visit", fuel_cents: "=fuel_discount_cents_per_gallon"}
        Northgate Club Membership: {early_minutes: "=early_shopping_minutes", guests: "=guest_limit_per_visit", fuel_cents: "=fuel_discount_cents_per_gallon"}
        Northgate Business Membership: {early_minutes: "=early_shopping_minutes", guests: "=guest_limit_per_visit", fuel_cents: "=fuel_discount_cents_per_gallon"}
        Northgate Club Plus Membership: {early_minutes: "=early_shopping_minutes", guests: "=guest_limit_per_visit", fuel_cents: "=fuel_discount_cents_per_gallon"}
        Northgate Business Plus Membership: {early_minutes: "=early_shopping_minutes", guests: "=guest_limit_per_visit", fuel_cents: "=fuel_discount_cents_per_gallon"}

extended_policies:
  - id: membership_ext_lapsed_renewal_fee
    base_policy_refs: [membership_renewal_dating, membership_status_tier_renewal, membership_fee_schedule]
    overwrite:
      - base_policy: membership_renewal_dating
        superseded_clause: >-
          The renewal fee follows membership_fee_schedule.
        replaced_by: &lapsed_scope >-
          When an expired membership is renewed, the renewal fee of a lapsed membership set out below takes the
          place of the plain annual fee; an on-time renewal, a new membership, and a conversion or downgrade taken at an
          on-time renewal are still charged the annual fee of the tier the membership year is held at.
      - base_policy: membership_renewal_dating
        superseded_clause: >-
          When the primary member has confirmed a downgrade_at_renewal request, the next renewal is taken at the
          tier's downgrade_target_tier and charged that tier's annual fee
        replaced_by: *lapsed_scope
      - base_policy: membership_status_tier_renewal
        superseded_clause: >-
          When either condition fails, the renewal is taken at the tier's eligibility_lapse_conversion_tier and
          charged that tier's annual fee
        replaced_by: *lapsed_scope
      - base_policy: membership_fee_schedule
        superseded_clause: >-
          A new_term or renewal_term fee equals the annual_fee_usd of the tier the membership year is held at.
        replaced_by: *lapsed_scope
      - base_policy: membership_status_tier_renewal
        superseded_clause: >-
          A Student Club membership also keeps its tier only while membership_msr_student_terms is below the tier's
          discounted_term_limit.
        replaced_by: >-
          The Student Club membership years a Student Club membership has paid are counted as its new membership and
          renewal fee charges less every charge that was refunded as a duplicate charge.
    trigger: on_request
    subject: [membership_renewed_after_lapse]
    computes: renewal_fee
    target_tool: pay_lapsed_membership_renewal_7a245505
    params:
      conversion_tier_fee_usd: 65.00
      loyalty_years_high: 10
      loyalty_years_mid: 5
      loyalty_pct_high: 8
      loyalty_flat_mid: 4.50
      card_credit_plus: 18.00
      card_credit_visa: 12.00
      card_credit_store: 6.00
      late_days_short: 14
      late_days_long: 45
      late_fee_mid: 5.00
      late_fee_long: 10.00
      grace_days_near: 60
      grace_days_far: 180
      grace_credit_near: 10.00
      grace_credit_far: 5.00
    rule: >
      An expired membership is renewed back to active by the primary member paying one renewal fee, and the new
      membership year is dated by the late renewal rule: it starts the day after the lapsed expiry date when the
      anniversary is kept, and on the payment date when it is not. When an expired membership is renewed, the renewal fee of a lapsed membership set out below takes the
      place of the plain annual fee; an on-time renewal, a new membership, and a conversion or downgrade taken at an
      on-time renewal are still charged the annual fee of the tier the membership year is held at. The standard renewal fee of a lapsed membership
      is the annual fee of the tier the new membership year is held at, charged once for the new membership year
      and kept to the cent. The new membership year is held at the Northgate Club Membership, the tier a Student
      Club or Heroes Club renewal converts to, when the membership is a Student Club or Heroes Club membership whose
      status verification on record is not valid on the first day of the new membership year, or a Student Club
      membership that has already paid as many Student Club membership years as its discounted term limit; it is
      held at the base tier named as the downgrade target when the membership is a Plus tier with a confirmed
      downgrade at renewal request; and it is held at the tier the membership already has in every other case.
      The Student Club membership years a Student Club membership has paid are counted as its new membership and
      renewal fee charges less every charge that was refunded as a duplicate charge. The paid membership years of a membership are counted as its new membership and renewal fee charges on the
      membership ledger, less every charge that was refunded as a duplicate charge. A membership with ten or more
      paid membership years receives a loyalty reduction of eight percent of the annual fee of the tier the new
      membership year is held at, rounded to the cent; a membership with five to nine paid membership years
      receives a flat loyalty reduction of 4.50 dollars; a membership with fewer than five paid membership years
      receives no loyalty reduction. A Northgate credit card account that is linked to the membership and open, in
      active or restricted status, earns a cardmember renewal credit of 18.00 dollars when it is a Northgate
      Rewards Visa Signature Plus or Northgate Rewards Visa Business Plus, 12.00 dollars when it is a Northgate
      Rewards Visa Signature or Northgate Rewards Visa Business, and 6.00 dollars when it is a Northgate Store Card
      or Northgate Business Store Card; a membership with no open linked card account earns no cardmember renewal
      credit, and a closed card account never counts. A renewal that converts a Student Club or Heroes Club
      membership because its status verification is not valid on the first day of the new membership year earns a
      conversion grace credit of 10.00 dollars when the verification ended no more than 60 days before that first
      day, 5.00 dollars when it ended 61 to 180 days before it, and nothing when it ended earlier; a renewal that
      does not convert for that reason earns no conversion grace credit. The days a membership has lapsed are
      counted in calendar days from its expiry date to the day the renewal is paid, the expiry date itself not
      counted. A renewal paid more than 45 days after the expiry date carries a late renewal reinstatement fee of
      10.00 dollars, a renewal paid 15 to 45 days after the expiry date carries a late renewal reinstatement fee of
      5.00 dollars, and a renewal paid within 14 days of the expiry date carries no late renewal reinstatement fee.
      The renewal fee of a lapsed membership is the annual fee of the tier the new membership year is held at,
      less the loyalty reduction, less the cardmember renewal credit, less the conversion grace credit, plus the
      late renewal reinstatement fee, never below zero and rounded to the cent once at the end.
    prerequisite: []
    cross_category:
      - category: card
        as: branch
        reads: [status, variant_name, linked_membership_id]
        note: The cardmember renewal credit tier is decided from the open Northgate credit card account linked to the membership.
    compute:
      - rf_months_back: "MONTHS(NOW, F('expiry_date'))"
      - rf_anniversary_kept: "rf_months_back >= -P('late_renewal_anchor_months')"
      - rf_status_tier: "P('requires_student_verification') or P('requires_service_verification')"
      - rf_verification_margin: "(DAYS(F('expiry_date'), F('eligibility_verified_through')) if rf_anniversary_kept else DAYS(NOW, F('eligibility_verified_through')) + 1) if rf_status_tier else 1"
      - rf_verification_lapsed: "rf_status_tier and rf_verification_margin < 1"
      - rf_student_terms: "COUNT('membership_transactions', event_type='membership_fee_charged', fee_type='new_term') + COUNT('membership_transactions', event_type='membership_fee_charged', fee_type='renewal_term') - COUNT('membership_transactions', event_type='membership_fee_refunded', refund_reason='duplicate_charge')"
      - rf_term_limit_reached: "P('requires_student_verification') and P('discounted_term_limit') > 0 and rf_student_terms >= P('discounted_term_limit')"
      - rf_downgrade_confirmed: "COUNT('membership_requests', request_type='downgrade_at_renewal', status='confirmed')"
      - rf_tier_fee: "K('conversion_tier_fee_usd') if (rf_verification_lapsed or rf_term_limit_reached) else ((P('annual_fee_usd') - P('plus_premium_usd')) if (rf_downgrade_confirmed > 0 and P('plus_premium_usd') > 0) else P('annual_fee_usd'))"
      - rf_paid_years: "COUNT('membership_transactions', event_type='membership_fee_charged', fee_type='new_term') + COUNT('membership_transactions', event_type='membership_fee_charged', fee_type='renewal_term') - COUNT('membership_transactions', event_type='membership_fee_refunded', refund_reason='duplicate_charge')"
      - rf_loyalty_reduction: "RND(rf_tier_fee * K('loyalty_pct_high') / 100, 2) if rf_paid_years >= K('loyalty_years_high') else (K('loyalty_flat_mid') if rf_paid_years >= K('loyalty_years_mid') else 0)"
      - rf_card_product: "CFIELD('card', 'variant_name', linked_membership_id=HID, status='active') or CFIELD('card', 'variant_name', linked_membership_id=HID, status='restricted') or 'none'"
      - rf_card_credit: "K('card_credit_plus') if (rf_card_product == 'Northgate Rewards Visa Signature Plus' or rf_card_product == 'Northgate Rewards Visa Business Plus') else (K('card_credit_visa') if (rf_card_product == 'Northgate Rewards Visa Signature' or rf_card_product == 'Northgate Rewards Visa Business') else (K('card_credit_store') if (rf_card_product == 'Northgate Store Card' or rf_card_product == 'Northgate Business Store Card') else 0))"
      - rf_verification_gap: "((DAYS(F('eligibility_verified_through'), F('expiry_date')) + 1) if rf_anniversary_kept else DAYS(F('eligibility_verified_through'), NOW)) if rf_verification_lapsed else 9999"
      - rf_grace_credit: "K('grace_credit_near') if (rf_verification_lapsed and rf_verification_gap <= K('grace_days_near')) else (K('grace_credit_far') if (rf_verification_lapsed and rf_verification_gap <= K('grace_days_far')) else 0)"
      - rf_days_lapsed: "DAYS(F('expiry_date'), NOW)"
      - rf_late_fee: "K('late_fee_long') if rf_days_lapsed > K('late_days_long') else (K('late_fee_mid') if rf_days_lapsed > K('late_days_short') else 0)"
      - result: "RND(MX(0, rf_tier_fee - rf_loyalty_reduction - rf_card_credit - rf_grace_credit + rf_late_fee), 2)"
    compute_basis:
      rf_months_back: "the new membership year is dated by the late renewal rule: it starts the day after the lapsed expiry date when the anniversary is kept, and on the payment date when it is not."
      rf_anniversary_kept: "the new membership year is dated by the late renewal rule: it starts the day after the lapsed expiry date when the anniversary is kept, and on the payment date when it is not."
      rf_status_tier: "when the membership is a Student Club or Heroes Club membership whose status verification on record is not valid on the first day of the new membership year"
      rf_verification_margin: "when the membership is a Student Club or Heroes Club membership whose status verification on record is not valid on the first day of the new membership year"
      rf_verification_lapsed: "when the membership is a Student Club or Heroes Club membership whose status verification on record is not valid on the first day of the new membership year"
      rf_student_terms: "The Student Club membership years a Student Club membership has paid are counted as its new membership and renewal fee charges less every charge that was refunded as a duplicate charge."
      rf_term_limit_reached: "or a Student Club membership that has already paid as many Student Club membership years as its discounted term limit"
      rf_downgrade_confirmed: "it is held at the base tier named as the downgrade target when the membership is a Plus tier with a confirmed downgrade at renewal request"
      rf_tier_fee: "The new membership year is held at the Northgate Club Membership, the tier a Student Club or Heroes Club renewal converts to, when the membership is a Student Club or Heroes Club membership whose status verification on record is not valid on the first day of the new membership year, or a Student Club membership that has already paid as many Student Club membership years as its discounted term limit; it is held at the base tier named as the downgrade target when the membership is a Plus tier with a confirmed downgrade at renewal request; and it is held at the tier the membership already has in every other case."
      rf_paid_years: "The paid membership years of a membership are counted as its new membership and renewal fee charges on the membership ledger, less every charge that was refunded as a duplicate charge."
      rf_loyalty_reduction: "A membership with ten or more paid membership years receives a loyalty reduction of eight percent of the annual fee of the tier the new membership year is held at, rounded to the cent; a membership with five to nine paid membership years receives a flat loyalty reduction of 4.50 dollars; a membership with fewer than five paid membership years receives no loyalty reduction."
      rf_card_product: "A Northgate credit card account that is linked to the membership and open, in active or restricted status, earns a cardmember renewal credit"
      rf_card_credit: "earns a cardmember renewal credit of 18.00 dollars when it is a Northgate Rewards Visa Signature Plus or Northgate Rewards Visa Business Plus, 12.00 dollars when it is a Northgate Rewards Visa Signature or Northgate Rewards Visa Business, and 6.00 dollars when it is a Northgate Store Card or Northgate Business Store Card; a membership with no open linked card account earns no cardmember renewal credit, and a closed card account never counts."
      rf_verification_gap: "when the verification ended no more than 60 days before that first day, 5.00 dollars when it ended 61 to 180 days before it, and nothing when it ended earlier"
      rf_grace_credit: "A renewal that converts a Student Club or Heroes Club membership because its status verification is not valid on the first day of the new membership year earns a conversion grace credit of 10.00 dollars when the verification ended no more than 60 days before that first day, 5.00 dollars when it ended 61 to 180 days before it, and nothing when it ended earlier; a renewal that does not convert for that reason earns no conversion grace credit."
      rf_days_lapsed: "The days a membership has lapsed are counted in calendar days from its expiry date to the day the renewal is paid, the expiry date itself not counted."
      rf_late_fee: "A renewal paid more than 45 days after the expiry date carries a late renewal reinstatement fee of 10.00 dollars, a renewal paid 15 to 45 days after the expiry date carries a late renewal reinstatement fee of 5.00 dollars, and a renewal paid within 14 days of the expiry date carries no late renewal reinstatement fee."
      result: "The renewal fee of a lapsed membership is the annual fee of the tier the new membership year is held at, less the loyalty reduction, less the cardmember renewal credit, less the conversion grace credit, plus the late renewal reinstatement fee, never below zero and rounded to the cent once at the end."
    factors:
      - id: renewal_loyalty_reduction
        effect: method
        decides: rf_loyalty_reduction
        bindings: [rf_paid_years, rf_loyalty_reduction]
        ladder:
          - when: "ten or more paid membership years (new membership and renewal fee charges less charges refunded as duplicates)"
            method: "eight percent of the annual fee of the tier the new year is held at, rounded to the cent, is taken off"
          - when: "five to nine paid membership years"
            method: "a flat 4.50 dollars is taken off"
          - when: "otherwise"
            method: "nothing is taken off"
        baseline:
          rf_loyalty_reduction: "0"
        evidence: [history]
        cross_difficulty: null
      - id: renewal_cardmember_credit
        effect: parameter
        decides: rf_card_credit
        bindings: [rf_card_product, rf_card_credit]
        ladder:
          - when: "an open (active or restricted) Northgate Rewards Visa Signature Plus or Business Plus account linked to the membership"
            value: "K('card_credit_plus')"
          - when: "an open Northgate Rewards Visa Signature or Business account linked to the membership"
            value: "K('card_credit_visa')"
          - when: "an open Northgate Store Card or Business Store Card account linked to the membership"
            value: "K('card_credit_store')"
          - when: "otherwise (no open linked card account)"
            value: "0"
        baseline:
          rf_card_credit: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: renewal_conversion_grace_credit
        effect: parameter
        decides: rf_grace_credit
        bindings: [rf_verification_gap, rf_grace_credit]
        ladder:
          - when: "the renewal converts because the status verification is not valid on the first day of the new year AND the verification ended no more than 60 days before that day"
            value: "K('grace_credit_near')"
          - when: "the renewal converts for that reason AND the verification ended 61 to 180 days before that day"
            value: "K('grace_credit_far')"
          - when: "otherwise (no conversion for that reason, or the verification ended earlier)"
            value: "0"
        baseline:
          rf_grace_credit: "0"
        evidence: [date]
        cross_difficulty: null
      - id: renewal_late_reinstatement_fee
        effect: parameter
        decides: rf_late_fee
        bindings: [rf_days_lapsed, rf_late_fee]
        ladder:
          - when: "renewal paid more than 45 days after the expiry date"
            value: "K('late_fee_long')"
          - when: "renewal paid 15 to 45 days after the expiry date"
            value: "K('late_fee_mid')"
          - when: "otherwise (within 14 days of the expiry date)"
            value: "0"
        baseline:
          rf_late_fee: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard renewal fee of a lapsed membership is the annual fee of the tier the new membership year is held
        at, charged once for the new membership year and kept to the cent. The new membership year is held at the
        Northgate Club Membership, the tier a Student Club or Heroes Club renewal converts to, when the membership is a
        Student Club or Heroes Club membership whose status verification on record is not valid on the first day of
        the new membership year, or a Student Club membership that has already paid as many Student Club membership
        years as its discounted term limit; it is held at the base tier named as the downgrade target when the
        membership is a Plus tier with a confirmed downgrade at renewal request; and it is held at the tier the
        membership already has in every other case.
      params: [annual_fee_usd, conversion_tier_fee_usd, plus_premium_usd, discounted_term_limit]
    inputs:
      history:
        - {table: membership_transactions, aggregate: count, field: membership_txn_id, filters: {event_type: membership_fee_charged, fee_type: renewal_term}}
        - {table: membership_transactions, aggregate: count, field: membership_txn_id, filters: {event_type: membership_fee_refunded, refund_reason: duplicate_charge}}
        - {table: membership_requests, aggregate: count, field: membership_request_id, filters: {request_type: downgrade_at_renewal, status: confirmed}}
      cross_category: [card]

  - id: membership_ext_upgrade_fee
    base_policy_refs: [membership_upgrade, membership_tier_benefits, membership_fee_schedule]
    overwrite:
      - base_policy: membership_fee_schedule
        superseded_clause: >-
          An upgrade_difference fee equals the annual_fee_usd of the upgrade_target_tier minus the annual_fee_usd of
          the current tier; it is never prorated and pays only for the rest of the current membership year.
        replaced_by: >-
          The upgrade fee is the upgrade fee basis less the upgrade spend credit, the service-member upgrade credit
          and the member-since upgrade credit, never below zero and rounded to the cent once at the end.
    trigger: on_request
    subject: [membership_upgraded]
    computes: upgrade_fee
    target_tool: upgrade_membership_to_plus_9f256f7b
    params:
      plus_tier_fee_usd: 130.00
      credit_window_days: 60
      prorate_months_below: 6
      spend_high: 4000.00
      spend_mid: 1500.00
      lines_high: 20
      lines_mid: 8
      spend_credit_high: 20.00
      spend_credit_mid: 10.00
      heroes_fee_usd: 45.50
      service_count_high: 3
      service_credit_high: 14.50
      service_credit_mid: 7.25
      tenure_months_high: 96
      tenure_months_mid: 48
      tenure_credit_high: 8.00
      tenure_credit_mid: 4.00
    rule: >
      A membership whose tier allows a mid-year upgrade is moved to its Plus counterpart on the upgrade date, the
      expiry date does not move, and the upgrade fee is charged that day to the tender the member chooses. The
      standard upgrade fee is the annual fee of the Plus tier the membership moves to, 130.00 dollars, less the
      annual fee of the tier the membership is held at, charged in full on the upgrade date and kept to the cent.
      The upgrade fee is fixed only after the membership stands active with a renewal or new membership fee for
      its current membership year recorded on the membership ledger. The base fee paid for the current membership
      year is the sum of the new membership and renewal fee charges recorded for the membership year that is
      current on the upgrade date, less any refunds of those charges. A first upgrade is one made on a membership
      whose ledger carries no upgrade difference fee from any earlier upgrade. When the upgrade date is no more than
      60 days after the first day of the current membership year and the upgrade is a first upgrade, the upgrade is
      priced as a renewal at the Plus tier, and the upgrade fee basis is the Plus annual fee less the base fee
      actually paid for the year, rounded to the cent. When fewer than six whole months of the membership year
      remain on the upgrade date and the upgrade is a first upgrade, the upgrade fee basis is the
      difference between the Plus annual fee and the annual fee of the tier held, multiplied by the whole months
      remaining from the upgrade date to the expiry date and divided by twelve, rounded to the cent. In every
      other case the upgrade fee basis is that difference in full. The member's net Northgate purchases are the
      merchandise sale lines posted in the twelve months before the upgrade date less the merchandise returns
      posted in those months, and the purchase lines are the number of those sale lines. Net purchases of at
      least 4000.00 dollars over at least 20 purchase lines earn an upgrade spend credit of 20.00 dollars; net
      purchases of at least 1500.00 dollars over at least 8 purchase lines earn an upgrade spend credit of 10.00
      dollars; anything less earns no upgrade spend credit. Membership fees charged at the Heroes Club annual fee
      of 45.50 dollars in the 36 months before the upgrade date earn a service-member upgrade credit of 14.50
      dollars when there are three or more of them, 7.25 dollars when there are one or two, and nothing when
      there are none. The member-since upgrade credit is 8.00 dollars when the membership was opened 96 or more
      whole months before the upgrade date, 4.00 dollars when it was opened 48 to 95 whole months before, and
      nothing when it was opened fewer than 48 whole months before. The upgrade fee is the upgrade fee basis less
      the upgrade spend credit, the service-member upgrade credit and the member-since upgrade credit, never below
      zero and rounded to the cent once at the end.
    prerequisite:
      - problem: membership_ext_lapsed_renewal_fee
        kind: value_input
        gate: uf_fee_basis
        form: state
        policy_source: >-
          The upgrade fee is fixed only after the membership stands active with a renewal or new membership fee for
          its current membership year recorded on the membership ledger.
        condition: >-
          membership_holdings.status is active and membership_transactions holds a membership_fee_charged entry
          (fee_type renewal_term or new_term) whose term_start_date equals the holding's term_start_date, the
          holding's term_start_date..expiry_date covering the upgrade date.
        resolved_by: pay_lapsed_membership_renewal_7a245505
        effect: >-
          Once the lapsed membership is renewed, the holding is active with the renewed year's tier and dates and a
          renewal fee entry for that year stands on the ledger, so uf_days_into_year, uf_base_fee_paid and
          uf_tier_difference take the renewed year's values and uf_fee_basis moves from the expired year's figure
          to the renewal-priced Plus fee less the renewal fee actually paid.
    cross_category:
      - category: order
        as: history
        reads: [order_lines.event_type, order_lines.line_amount, order_lines.event_date]
        note: The upgrade spend credit tier is decided from the member's sale and return lines in the order ledger over the past twelve months.
    compute:
      - uf_days_into_year: "DAYS(F('term_start_date'), NOW)"
      - uf_months_left: "MONTHS(NOW, F('expiry_date'))"
      - uf_base_fee_paid: "SUM('membership_transactions', 'amount', event_type='membership_fee_charged', fee_type='new_term', term_start_date=F('term_start_date')) + SUM('membership_transactions', 'amount', event_type='membership_fee_charged', fee_type='renewal_term', term_start_date=F('term_start_date')) - SUM('membership_transactions', 'amount', event_type='membership_fee_refunded', fee_type='new_term', term_start_date=F('term_start_date')) - SUM('membership_transactions', 'amount', event_type='membership_fee_refunded', fee_type='renewal_term', term_start_date=F('term_start_date'))"
      - uf_tier_difference: "K('plus_tier_fee_usd') - P('annual_fee_usd')"
      - uf_prior_upgrades: "COUNT('membership_transactions', event_type='membership_fee_charged', fee_type='upgrade_difference')"
      - uf_fee_basis: "RND(K('plus_tier_fee_usd') - uf_base_fee_paid, 2) if (uf_days_into_year <= K('credit_window_days') and uf_prior_upgrades == 0) else (RND(uf_tier_difference * uf_months_left / 12, 2) if (uf_months_left < K('prorate_months_below') and uf_prior_upgrades == 0) else uf_tier_difference)"
      - uf_net_purchases: "XSUM('order', 'order_lines', 'line_amount', within_months=12, event_type='order_line_sold') - XSUM('order', 'order_lines', 'line_amount', within_months=12, event_type='order_line_returned')"
      - uf_purchase_lines: "XCOUNT('order', 'order_lines', within_months=12, event_type='order_line_sold')"
      - uf_spend_credit: "K('spend_credit_high') if (uf_net_purchases >= K('spend_high') and uf_purchase_lines >= K('lines_high')) else (K('spend_credit_mid') if (uf_net_purchases >= K('spend_mid') and uf_purchase_lines >= K('lines_mid')) else 0)"
      - uf_service_fees: "COUNT('membership_transactions', within_months=36, date_field='transaction_date', event_type='membership_fee_charged', amount=K('heroes_fee_usd'))"
      - uf_service_credit: "K('service_credit_high') if uf_service_fees >= K('service_count_high') else (K('service_credit_mid') if uf_service_fees >= 1 else 0)"
      - uf_member_months: "MONTHS(F('opened_date'), NOW)"
      - uf_tenure_credit: "K('tenure_credit_high') if uf_member_months >= K('tenure_months_high') else (K('tenure_credit_mid') if uf_member_months >= K('tenure_months_mid') else 0)"
      - result: "RND(MX(0, uf_fee_basis - uf_spend_credit - uf_service_credit - uf_tenure_credit), 2)"
    compute_basis:
      uf_days_into_year: "When the upgrade date is no more than 60 days after the first day of the current membership year and the upgrade is a first upgrade"
      uf_months_left: "When fewer than six whole months of the membership year remain on the upgrade date and the upgrade is a first upgrade"
      uf_prior_upgrades: "A first upgrade is one made on a membership whose ledger carries no upgrade difference fee from any earlier upgrade."
      uf_base_fee_paid: "The base fee paid for the current membership year is the sum of the new membership and renewal fee charges recorded for the membership year that is current on the upgrade date, less any refunds of those charges."
      uf_tier_difference: "The standard upgrade fee is the annual fee of the Plus tier the membership moves to, 130.00 dollars, less the annual fee of the tier the membership is held at, charged in full on the upgrade date and kept to the cent."
      uf_fee_basis: "When the upgrade date is no more than 60 days after the first day of the current membership year and the upgrade is a first upgrade, the upgrade is priced as a renewal at the Plus tier, and the upgrade fee basis is the Plus annual fee less the base fee actually paid for the year, rounded to the cent. When fewer than six whole months of the membership year remain on the upgrade date and the upgrade is a first upgrade, the upgrade fee basis is the difference between the Plus annual fee and the annual fee of the tier held, multiplied by the whole months remaining from the upgrade date to the expiry date and divided by twelve, rounded to the cent. In every other case the upgrade fee basis is that difference in full."
      uf_net_purchases: "The member's net Northgate purchases are the merchandise sale lines posted in the twelve months before the upgrade date less the merchandise returns posted in those months"
      uf_purchase_lines: "the purchase lines are the number of those sale lines."
      uf_spend_credit: "Net purchases of at least 4000.00 dollars over at least 20 purchase lines earn an upgrade spend credit of 20.00 dollars; net purchases of at least 1500.00 dollars over at least 8 purchase lines earn an upgrade spend credit of 10.00 dollars; anything less earns no upgrade spend credit."
      uf_service_fees: "Membership fees charged at the Heroes Club annual fee of 45.50 dollars in the 36 months before the upgrade date"
      uf_service_credit: "earn a service-member upgrade credit of 14.50 dollars when there are three or more of them, 7.25 dollars when there are one or two, and nothing when there are none."
      uf_member_months: "The member-since upgrade credit is 8.00 dollars when the membership was opened 96 or more whole months before the upgrade date"
      uf_tenure_credit: "The member-since upgrade credit is 8.00 dollars when the membership was opened 96 or more whole months before the upgrade date, 4.00 dollars when it was opened 48 to 95 whole months before, and nothing when it was opened fewer than 48 whole months before."
      result: "The upgrade fee is the upgrade fee basis less the upgrade spend credit, the service-member upgrade credit and the member-since upgrade credit, never below zero and rounded to the cent once at the end."
    factors:
      - id: upgrade_fee_basis
        effect: method
        decides: uf_fee_basis
        bindings: [uf_days_into_year, uf_months_left, uf_base_fee_paid, uf_tier_difference, uf_prior_upgrades, uf_fee_basis]
        ladder:
          - when: "the upgrade date is no more than 60 days after the first day of the current membership year AND no upgrade difference fee from an earlier upgrade stands on the ledger"
            method: "priced as a renewal at the Plus tier: the Plus annual fee less the base fee actually paid for the year"
          - when: "fewer than six whole months of the membership year remain AND no upgrade difference fee from an earlier upgrade stands on the ledger"
            method: "the tier difference prorated by whole months remaining to the expiry date over twelve"
          - when: "otherwise"
            method: "the tier difference in full"
        baseline:
          uf_fee_basis: "uf_tier_difference"
        evidence: [date, history, tier_param]
        cross_difficulty: null
      - id: upgrade_spend_credit
        effect: parameter
        decides: uf_spend_credit
        bindings: [uf_net_purchases, uf_purchase_lines, uf_spend_credit]
        ladder:
          - when: "net Northgate purchases in the past twelve months of at least 4000.00 dollars AND at least 20 purchase lines"
            value: "K('spend_credit_high')"
          - when: "net purchases of at least 1500.00 dollars AND at least 8 purchase lines, short of the top tier"
            value: "K('spend_credit_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          uf_spend_credit: "0"
        evidence: [cross_category, history]
        cross_difficulty: order
      - id: upgrade_service_member_credit
        effect: parameter
        decides: uf_service_credit
        bindings: [uf_service_fees, uf_service_credit]
        ladder:
          - when: "three or more membership fees charged at the Heroes Club annual fee in the past 36 months"
            value: "K('service_credit_high')"
          - when: "one or two such fees"
            value: "K('service_credit_mid')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          uf_service_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: upgrade_member_since_credit
        effect: parameter
        decides: uf_tenure_credit
        bindings: [uf_member_months, uf_tenure_credit]
        ladder:
          - when: "membership opened 96 or more whole months before the upgrade date"
            value: "K('tenure_credit_high')"
          - when: "opened 48 to 95 whole months before"
            value: "K('tenure_credit_mid')"
          - when: "otherwise (fewer than 48 whole months)"
            value: "0"
        baseline:
          uf_tenure_credit: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard upgrade fee is the annual fee of the Plus tier the membership moves to, 130.00 dollars, less
        the annual fee of the tier the membership is held at, charged in full on the upgrade date and kept to the
        cent.
      params: [plus_tier_fee_usd, annual_fee_usd]
    inputs:
      history:
        - {table: membership_transactions, aggregate: sum, field: amount, filters: {event_type: membership_fee_charged, fee_type: renewal_term}}
        - {table: membership_transactions, aggregate: count, field: membership_txn_id, within_months: 36, filters: {event_type: membership_fee_charged, amount: 45.50}}
        - {category: order, table: order_lines, aggregate: sum, field: line_amount, within_months: 12, filters: {event_type: order_line_sold}}
        - {category: order, table: order_lines, aggregate: sum, field: line_amount, within_months: 12, filters: {event_type: order_line_returned}}
      cross_category: [order]

  - id: membership_ext_plus_guarantee_refund
    base_policy_refs: [membership_plus_guarantee, membership_cancellation_refund, membership_cardholders, membership_tier_benefits]
    overwrite:
      - base_policy: membership_plus_guarantee
        superseded_clause: >-
          The refund equals plus_premium_usd minus membership_msr_completed_year_reward, is booked with refund_reason
          shortfall_guarantee against the fee charge that paid the Plus premium for that year (the new_term or
          renewal_term charge at the Plus tier, or the upgrade_difference charge when the year was upgraded
          mid-term), and goes back to that charge's tender, or to a Northgate Shop Card when the charge was paid with
          a reward certificate.
        replaced_by: >-
          The guarantee refund is the guarantee shortfall multiplied by the repeat-claim share, plus the cardmember
          guarantee bonus, the business cardholder guarantee uplift and the long-standing member guarantee uplift,
          rounded to the cent once at the end; a year without a guarantee shortfall pays nothing.
      - base_policy: membership_plus_guarantee
        superseded_clause: >-
          For a completed membership year whose membership_msr_completed_year_reward is below plus_premium_usd, the
          primary member may claim the difference
        replaced_by: >-
          The primary member may claim the guarantee for a completed membership year only where that year shows a
          guarantee shortfall, and the amount the claim pays is the guarantee refund worked out below rather than the
          plain difference between the Plus premium and the year's Annual Reward.
    trigger: on_request
    subject: [membership_fee_refunded, membership_downgraded]
    computes: guarantee_refund
    target_tool: confirm_plus_guarantee_claim_e9c317f9
    params:
      min_months_held: 3
      share_one_prior: 0.75
      share_two_prior: 0.5
      card_bonus_plus: 5.00
      card_bonus_visa: 3.00
      card_bonus_store: 1.00
      cardholders_high: 3
      cardholder_uplift_high: 2.50
      cardholder_uplift_mid: 1.00
      member_months_high: 84
      member_months_mid: 36
      member_uplift_high: 3.00
      member_uplift_mid: 1.50
    rule: >
      A Plus guarantee claim that the primary member confirms settles one completed membership year, the reward
      year of the most recent year-end Annual Reward conversion on the membership; the refund is booked against the
      fee charge that paid the Plus premium for that year and returned to that charge's tender, and the membership
      moves to its base tier the same day. The primary member may claim the guarantee for a completed membership
      year only where that year shows a guarantee shortfall, and the amount the claim pays is the guarantee refund
      worked out below rather than the plain difference between the Plus premium and the year's Annual Reward. The
      standard guarantee refund is the tier's Plus premium less the Annual
      Reward earned for the completed year, that is the reward accrued for that year less the reward reversed for
      that year, never below zero and rounded to the cent. The guarantee premium basis depends on how the completed
      year was held at Plus. When an upgrade difference fee was charged for the completed year and the membership
      was held at Plus for at least three months of it, the guarantee premium basis is the Plus premium multiplied
      by the months held at Plus and divided by twelve, rounded to the cent, the months held being the whole months
      from the upgrade date to the end of the year plus one for the month of the upgrade. When an upgrade difference
      fee was charged for the completed year and the membership was held at Plus for fewer than three months of it,
      the guarantee premium basis is zero. A year held at Plus from its first day has the full Plus premium as its
      guarantee premium basis. The guarantee shortfall is the guarantee premium basis less the Annual Reward earned
      for the completed year, rounded to the cent. Guarantee refunds already paid on the membership in the 36
      months before the claim set the repeat-claim share: two or more earlier guarantee refunds give a share of
      one half, one earlier guarantee refund gives a share of three quarters, and none gives the whole shortfall. An
      active Northgate credit card account linked to the membership adds a cardmember guarantee bonus of 5.00
      dollars for a Northgate Rewards Visa Signature Plus or Northgate Rewards Visa Business Plus, 3.00 dollars for
      a Northgate Rewards Visa Signature or Northgate Rewards Visa Business, and 1.00 dollar for a Northgate Store
      Card or Northgate Business Store Card; a membership without an active linked card account gets no
      cardmember guarantee bonus. The business add-on cards in use are those issued on the membership without a
      later deactivation; three or more in use add a business cardholder guarantee uplift of 2.50 dollars, one or
      two in use add 1.00 dollar, and none adds nothing. A membership opened 84 or more whole months before the
      claim adds a long-standing member guarantee uplift of 3.00 dollars, one opened 36 to 83 whole months before
      adds 1.50 dollars, and one opened fewer than 36 whole months before adds nothing. The guarantee refund is the
      guarantee shortfall multiplied by the repeat-claim share, plus the cardmember guarantee bonus, the business
      cardholder guarantee uplift and the long-standing member guarantee uplift, rounded to the cent once at the
      end; a year without a guarantee shortfall pays nothing.
    prerequisite: []
    cross_category:
      - category: card
        as: branch
        reads: [status, variant_name, linked_membership_id]
        note: The cardmember guarantee bonus tier is decided from the active Northgate credit card account linked to the membership.
    compute:
      - gb_year_end: "LATEST('membership_transactions', 'term_end_date', date_field='transaction_date', event_type='membership_reward_certificate_issued')"
      - gb_year_earned: "RND(SUM('membership_transactions', 'amount', event_type='membership_reward_accrued', term_end_date=gb_year_end) - SUM('membership_transactions', 'amount', event_type='membership_reward_reversed', term_end_date=gb_year_end), 2)"
      - gb_upgrades: "COUNT('membership_transactions', event_type='membership_fee_charged', fee_type='upgrade_difference', term_end_date=gb_year_end)"
      - gb_upgrade_date: "LATEST('membership_transactions', 'transaction_date', date_field='transaction_date', event_type='membership_fee_charged', fee_type='upgrade_difference', term_end_date=gb_year_end)"
      - gb_months_held: "(MONTHS(gb_upgrade_date, gb_year_end) + 1) if gb_upgrades > 0 else 12"
      - gb_premium_basis: "RND(P('plus_premium_usd') * gb_months_held / 12, 2) if (gb_upgrades > 0 and gb_months_held >= K('min_months_held')) else (0 if (gb_upgrades > 0 and gb_months_held < K('min_months_held')) else P('plus_premium_usd'))"
      - gb_shortfall: "RND(gb_premium_basis - gb_year_earned, 2)"
      - gb_prior_claims: "COUNT('membership_transactions', within_months=36, date_field='transaction_date', event_type='membership_fee_refunded', refund_reason='shortfall_guarantee')"
      - gb_claim_share: "K('share_two_prior') if gb_prior_claims >= 2 else (K('share_one_prior') if gb_prior_claims == 1 else 1)"
      - gb_card_product: "CFIELD('card', 'variant_name', linked_membership_id=HID, status='active') or 'none'"
      - gb_card_bonus: "K('card_bonus_plus') if (gb_card_product == 'Northgate Rewards Visa Signature Plus' or gb_card_product == 'Northgate Rewards Visa Business Plus') else (K('card_bonus_visa') if (gb_card_product == 'Northgate Rewards Visa Signature' or gb_card_product == 'Northgate Rewards Visa Business') else (K('card_bonus_store') if (gb_card_product == 'Northgate Store Card' or gb_card_product == 'Northgate Business Store Card') else 0))"
      - gb_addon_in_use: "COUNT('membership_cards', event_type='membership_card_issued', card_type='business_addon') - COUNT('membership_cards', event_type='membership_card_deactivated', card_type='business_addon')"
      - gb_cardholder_uplift: "K('cardholder_uplift_high') if gb_addon_in_use >= K('cardholders_high') else (K('cardholder_uplift_mid') if gb_addon_in_use >= 1 else 0)"
      - gb_member_months: "MONTHS(F('opened_date'), NOW)"
      - gb_member_uplift: "K('member_uplift_high') if gb_member_months >= K('member_months_high') else (K('member_uplift_mid') if gb_member_months >= K('member_months_mid') else 0)"
      - result: "RND(gb_shortfall * gb_claim_share + gb_card_bonus + gb_cardholder_uplift + gb_member_uplift, 2) if gb_shortfall > 0 else 0"
    compute_basis:
      gb_year_end: "A Plus guarantee claim that the primary member confirms settles one completed membership year, the reward year of the most recent year-end Annual Reward conversion on the membership"
      gb_year_earned: "the Annual Reward earned for the completed year, that is the reward accrued for that year less the reward reversed for that year"
      gb_upgrades: "When an upgrade difference fee was charged for the completed year and the membership was held at Plus for at least three months of it"
      gb_upgrade_date: "the months held being the whole months from the upgrade date to the end of the year plus one for the month of the upgrade."
      gb_months_held: "the months held being the whole months from the upgrade date to the end of the year plus one for the month of the upgrade."
      gb_premium_basis: "When an upgrade difference fee was charged for the completed year and the membership was held at Plus for at least three months of it, the guarantee premium basis is the Plus premium multiplied by the months held at Plus and divided by twelve, rounded to the cent, the months held being the whole months from the upgrade date to the end of the year plus one for the month of the upgrade. When an upgrade difference fee was charged for the completed year and the membership was held at Plus for fewer than three months of it, the guarantee premium basis is zero. A year held at Plus from its first day has the full Plus premium as its guarantee premium basis."
      gb_shortfall: "The guarantee shortfall is the guarantee premium basis less the Annual Reward earned for the completed year, rounded to the cent."
      gb_prior_claims: "Guarantee refunds already paid on the membership in the 36 months before the claim set the repeat-claim share"
      gb_claim_share: "two or more earlier guarantee refunds give a share of one half, one earlier guarantee refund gives a share of three quarters, and none gives the whole shortfall."
      gb_card_product: "An active Northgate credit card account linked to the membership adds a cardmember guarantee bonus"
      gb_card_bonus: "adds a cardmember guarantee bonus of 5.00 dollars for a Northgate Rewards Visa Signature Plus or Northgate Rewards Visa Business Plus, 3.00 dollars for a Northgate Rewards Visa Signature or Northgate Rewards Visa Business, and 1.00 dollar for a Northgate Store Card or Northgate Business Store Card; a membership without an active linked card account gets no cardmember guarantee bonus."
      gb_addon_in_use: "The business add-on cards in use are those issued on the membership without a later deactivation"
      gb_cardholder_uplift: "three or more in use add a business cardholder guarantee uplift of 2.50 dollars, one or two in use add 1.00 dollar, and none adds nothing."
      gb_member_months: "A membership opened 84 or more whole months before the claim adds a long-standing member guarantee uplift of 3.00 dollars"
      gb_member_uplift: "A membership opened 84 or more whole months before the claim adds a long-standing member guarantee uplift of 3.00 dollars, one opened 36 to 83 whole months before adds 1.50 dollars, and one opened fewer than 36 whole months before adds nothing."
      result: "The guarantee refund is the guarantee shortfall multiplied by the repeat-claim share, plus the cardmember guarantee bonus, the business cardholder guarantee uplift and the long-standing member guarantee uplift, rounded to the cent once at the end; a year without a guarantee shortfall pays nothing."
    factors:
      - id: guarantee_premium_basis
        effect: method
        decides: gb_premium_basis
        bindings: [gb_upgrades, gb_upgrade_date, gb_months_held, gb_premium_basis]
        ladder:
          - when: "an upgrade difference fee was charged for the completed year AND the membership was held at Plus for at least three months of it"
            method: "the Plus premium is prorated: multiplied by the months held at Plus (whole months from the upgrade date to the year end, plus one) and divided by twelve"
          - when: "an upgrade difference fee was charged for the completed year AND the membership was held at Plus for fewer than three months of it"
            method: "no premium is guaranteed for the year (basis zero)"
          - when: "otherwise (the year was held at Plus from its first day)"
            method: "the full Plus premium is the basis"
        baseline:
          gb_premium_basis: "P('plus_premium_usd')"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: repeat_claim_share
        effect: parameter
        decides: gb_claim_share
        bindings: [gb_prior_claims, gb_claim_share]
        ladder:
          - when: "two or more guarantee refunds paid on the membership in the preceding 36 months"
            value: "K('share_two_prior')"
          - when: "exactly one guarantee refund paid in the preceding 36 months"
            value: "K('share_one_prior')"
          - when: "otherwise (none)"
            value: "1"
        baseline:
          gb_claim_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: cardmember_guarantee_bonus
        effect: parameter
        decides: gb_card_bonus
        bindings: [gb_card_product, gb_card_bonus]
        ladder:
          - when: "an active linked Northgate Rewards Visa Signature Plus or Business Plus account"
            value: "K('card_bonus_plus')"
          - when: "an active linked Northgate Rewards Visa Signature or Business account"
            value: "K('card_bonus_visa')"
          - when: "an active linked Northgate Store Card or Business Store Card account"
            value: "K('card_bonus_store')"
          - when: "otherwise (no active linked card account)"
            value: "0"
        baseline:
          gb_card_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: business_cardholder_guarantee_uplift
        effect: parameter
        decides: gb_cardholder_uplift
        bindings: [gb_addon_in_use, gb_cardholder_uplift]
        ladder:
          - when: "three or more business add-on cards in use"
            value: "K('cardholder_uplift_high')"
          - when: "one or two business add-on cards in use"
            value: "K('cardholder_uplift_mid')"
          - when: "otherwise (none in use)"
            value: "0"
        baseline:
          gb_cardholder_uplift: "0"
        evidence: [history]
        cross_difficulty: null
      - id: long_standing_member_guarantee_uplift
        effect: parameter
        decides: gb_member_uplift
        bindings: [gb_member_months, gb_member_uplift]
        ladder:
          - when: "membership opened 84 or more whole months before the claim"
            value: "K('member_uplift_high')"
          - when: "opened 36 to 83 whole months before the claim"
            value: "K('member_uplift_mid')"
          - when: "otherwise (fewer than 36 whole months)"
            value: "0"
        baseline:
          gb_member_uplift: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard guarantee refund is the tier's Plus premium less the Annual Reward earned for the completed
        year, that is the reward accrued for that year less the reward reversed for that year, never below zero and
        rounded to the cent.
      params: [plus_premium_usd]
    inputs:
      history:
        - {table: membership_transactions, aggregate: sum, field: amount, filters: {event_type: membership_reward_accrued}}
        - {table: membership_transactions, aggregate: sum, field: amount, filters: {event_type: membership_reward_reversed}}
        - {table: membership_transactions, aggregate: count, field: membership_txn_id, within_months: 36, filters: {event_type: membership_fee_refunded, refund_reason: shortfall_guarantee}}
        - {table: membership_cards, aggregate: count, field: membership_card_id, filters: {card_type: business_addon}}
      cross_category: [card]

  - id: membership_ext_downgrade_difference_refund
    base_policy_refs: [membership_plus_guarantee, membership_cancellation_refund, membership_cardholders]
    overwrite:
      - base_policy: membership_plus_guarantee
        superseded_clause: >-
          A confirmed claim moves the membership to its downgrade_target_tier the same day; when the current
          membership year has already been paid at the Plus fee, the plus_premium_usd of the current year is also
          refunded with refund_reason downgrade_difference against that renewal charge.
        replaced_by: >-
          The downgrade difference refund is the downgrade premium basis less the repeat-downgrade retention charge,
          plus the Plus history downgrade credit and the business volume downgrade credit, never below zero and
          rounded to the cent once at the end; a membership with no current-year Plus premium gets nothing.
    trigger: state_due
    subject: [membership_fee_refunded]
    computes: refund_amount
    target_tool: refund_downgrade_difference_0adda8cc
    params:
      early_days: 60
      retention_recent: 10.00
      retention_older: 5.00
      plus_fee_usd: 130.00
      plus_years_high: 4
      plus_years_mid: 2
      plus_credit_high: 4.00
      plus_credit_mid: 2.00
      volume_high: 6000.00
      volume_mid: 2000.00
      volume_credit_high: 7.50
      volume_credit_mid: 3.00
    rule: >
      A membership that leaves its Plus tier for its base tier during a membership year it has already paid at the
      Plus fee gets the Plus premium of that year back as a downgrade difference refund, booked against the current
      year's renewal charge and returned to that charge's tender. The downgrade difference refund is not booked until the
      membership's tier stands at the base tier its confirmed guarantee claim moved it to. The standard downgrade
      difference refund is the current-year Plus premium, that is the new membership and renewal fees paid for the
      current membership year net of refunds of them, less the annual fee of the base tier now held, never below
      zero and kept to the cent. The Annual Reward earned in the current year is the reward accrued for the current
      membership year less the reward reversed for it. When the downgrade falls no more than 60 days after the
      first day of the current membership year and the membership has earned Annual Reward in the current year,
      the downgrade premium basis is the current-year Plus premium less that Annual Reward, rounded to the cent.
      When the downgrade falls more than 60 days after the first day of the current membership year and the
      membership has earned Annual Reward in the current year, the downgrade premium basis is the current-year Plus
      premium multiplied by the whole months remaining from the downgrade date to the expiry date and divided by
      twelve, rounded to the cent. A membership that has earned no Annual Reward in the current year has the full
      current-year Plus premium as its downgrade premium basis. A repeat-downgrade retention charge is kept back
      when a downgrade difference refund was already paid on the membership: 10.00 dollars when one was paid in the
      36 months before the downgrade, 5.00 dollars when the latest was paid 36 to 71 whole months before, and
      nothing otherwise. The Plus history years are the renewal and new membership fees charged at the Plus annual
      fee of 130.00 dollars, less those refunded as duplicate charges; four or more Plus history years add a Plus
      history downgrade credit of 4.00 dollars, two or three add 2.00 dollars, and fewer add nothing. The business
      purchase volume is the member's merchandise sale lines posted in the twelve months before the downgrade less
      the merchandise returns posted in those months; a business purchase volume of 6000.00 dollars or more adds a
      business volume downgrade credit of 7.50 dollars, one of 2000.00 dollars or more adds 3.00 dollars, and a
      smaller one adds nothing. The downgrade difference refund is the downgrade premium basis less the
      repeat-downgrade retention charge, plus the Plus history downgrade credit and the business volume downgrade
      credit, never below zero and rounded to the cent once at the end; a membership with no current-year Plus
      premium gets nothing.
    prerequisite:
      - problem: membership_ext_plus_guarantee_refund
        kind: value_input
        gate: dd_premium
        form: state
        policy_source: >-
          The downgrade difference refund is not booked until the membership's tier stands at the base tier its
          confirmed guarantee claim moved it to.
        condition: >-
          membership_holdings.variant_name equals the downgrade_target_tier of the Plus tier the membership held, and
          the membership's shortfall_guarantee_claim request that moved it there has status confirmed.
        resolved_by: confirm_plus_guarantee_claim_e9c317f9
        effect: >-
          Once the guarantee claim is confirmed the membership is held at its base tier, so the annual fee in
          dd_premium drops from the Plus fee to the base fee and dd_premium moves from 0.00 to the current-year Plus
          premium, which every later binding of the refund rests on.
    cross_category:
      - category: order
        as: history
        reads: [order_lines.event_type, order_lines.line_amount, order_lines.event_date]
        note: The business volume downgrade credit tier is decided from the member's sale and return lines in the order ledger over the past twelve months.
    compute:
      - dd_days_into_year: "DAYS(F('term_start_date'), NOW)"
      - dd_plus_paid: "SUM('membership_transactions', 'amount', event_type='membership_fee_charged', fee_type='new_term', term_start_date=F('term_start_date')) + SUM('membership_transactions', 'amount', event_type='membership_fee_charged', fee_type='renewal_term', term_start_date=F('term_start_date')) - SUM('membership_transactions', 'amount', event_type='membership_fee_refunded', fee_type='new_term', term_start_date=F('term_start_date')) - SUM('membership_transactions', 'amount', event_type='membership_fee_refunded', fee_type='renewal_term', term_start_date=F('term_start_date'))"
      - dd_premium: "MX(0, RND(dd_plus_paid - P('annual_fee_usd'), 2))"
      - dd_year_reward: "RND(SUM('membership_transactions', 'amount', event_type='membership_reward_accrued', term_start_date=F('term_start_date')) - SUM('membership_transactions', 'amount', event_type='membership_reward_reversed', term_start_date=F('term_start_date')), 2)"
      - dd_basis: "RND(dd_premium - dd_year_reward, 2) if (dd_days_into_year <= K('early_days') and dd_year_reward > 0) else (RND(dd_premium * MONTHS(NOW, F('expiry_date')) / 12, 2) if (dd_days_into_year > K('early_days') and dd_year_reward > 0) else dd_premium)"
      - dd_downgrades_recent: "COUNT('membership_transactions', within_months=36, date_field='transaction_date', event_type='membership_fee_refunded', refund_reason='downgrade_difference')"
      - dd_downgrades_older: "COUNT('membership_transactions', within_months=72, date_field='transaction_date', event_type='membership_fee_refunded', refund_reason='downgrade_difference') - dd_downgrades_recent"
      - dd_retention_charge: "K('retention_recent') if dd_downgrades_recent >= 1 else (K('retention_older') if dd_downgrades_older >= 1 else 0)"
      - dd_plus_years: "COUNT('membership_transactions', event_type='membership_fee_charged', fee_type='renewal_term', amount=K('plus_fee_usd')) + COUNT('membership_transactions', event_type='membership_fee_charged', fee_type='new_term', amount=K('plus_fee_usd')) - COUNT('membership_transactions', event_type='membership_fee_refunded', refund_reason='duplicate_charge', amount=K('plus_fee_usd'))"
      - dd_plus_history_credit: "K('plus_credit_high') if dd_plus_years >= K('plus_years_high') else (K('plus_credit_mid') if dd_plus_years >= K('plus_years_mid') else 0)"
      - dd_volume: "XSUM('order', 'order_lines', 'line_amount', within_months=12, event_type='order_line_sold') - XSUM('order', 'order_lines', 'line_amount', within_months=12, event_type='order_line_returned')"
      - dd_volume_credit: "K('volume_credit_high') if dd_volume >= K('volume_high') else (K('volume_credit_mid') if dd_volume >= K('volume_mid') else 0)"
      - result: "RND(MX(0, dd_basis - dd_retention_charge + dd_plus_history_credit + dd_volume_credit), 2) if dd_premium > 0 else 0"
    compute_basis:
      dd_days_into_year: "When the downgrade falls no more than 60 days after the first day of the current membership year"
      dd_plus_paid: "the current-year Plus premium, that is the new membership and renewal fees paid for the current membership year net of refunds of them, less the annual fee of the base tier now held"
      dd_premium: "The standard downgrade difference refund is the current-year Plus premium, that is the new membership and renewal fees paid for the current membership year net of refunds of them, less the annual fee of the base tier now held, never below zero and kept to the cent."
      dd_year_reward: "The Annual Reward earned in the current year is the reward accrued for the current membership year less the reward reversed for it."
      dd_basis: "When the downgrade falls no more than 60 days after the first day of the current membership year and the membership has earned Annual Reward in the current year, the downgrade premium basis is the current-year Plus premium less that Annual Reward, rounded to the cent. When the downgrade falls more than 60 days after the first day of the current membership year and the membership has earned Annual Reward in the current year, the downgrade premium basis is the current-year Plus premium multiplied by the whole months remaining from the downgrade date to the expiry date and divided by twelve, rounded to the cent. A membership that has earned no Annual Reward in the current year has the full current-year Plus premium as its downgrade premium basis."
      dd_downgrades_recent: "10.00 dollars when one was paid in the 36 months before the downgrade"
      dd_downgrades_older: "5.00 dollars when the latest was paid 36 to 71 whole months before"
      dd_retention_charge: "A repeat-downgrade retention charge is kept back when a downgrade difference refund was already paid on the membership: 10.00 dollars when one was paid in the 36 months before the downgrade, 5.00 dollars when the latest was paid 36 to 71 whole months before, and nothing otherwise."
      dd_plus_years: "The Plus history years are the renewal and new membership fees charged at the Plus annual fee of 130.00 dollars, less those refunded as duplicate charges"
      dd_plus_history_credit: "four or more Plus history years add a Plus history downgrade credit of 4.00 dollars, two or three add 2.00 dollars, and fewer add nothing."
      dd_volume: "The business purchase volume is the member's merchandise sale lines posted in the twelve months before the downgrade less the merchandise returns posted in those months"
      dd_volume_credit: "a business purchase volume of 6000.00 dollars or more adds a business volume downgrade credit of 7.50 dollars, one of 2000.00 dollars or more adds 3.00 dollars, and a smaller one adds nothing."
      result: "The downgrade difference refund is the downgrade premium basis less the repeat-downgrade retention charge, plus the Plus history downgrade credit and the business volume downgrade credit, never below zero and rounded to the cent once at the end; a membership with no current-year Plus premium gets nothing."
    factors:
      - id: downgrade_premium_basis
        effect: method
        decides: dd_basis
        bindings: [dd_days_into_year, dd_year_reward, dd_basis]
        ladder:
          - when: "the downgrade falls no more than 60 days into the current membership year AND Annual Reward has been earned in the current year"
            method: "the current-year Plus premium less the Annual Reward earned in the current year"
          - when: "the downgrade falls more than 60 days into the current membership year AND Annual Reward has been earned in the current year"
            method: "the current-year Plus premium prorated by whole months remaining to the expiry date over twelve"
          - when: "otherwise (no Annual Reward earned in the current year)"
            method: "the full current-year Plus premium"
        baseline:
          dd_basis: "dd_premium"
        evidence: [date, history]
        cross_difficulty: null
      - id: repeat_downgrade_retention_charge
        effect: parameter
        decides: dd_retention_charge
        bindings: [dd_downgrades_recent, dd_downgrades_older, dd_retention_charge]
        ladder:
          - when: "a downgrade difference refund paid in the preceding 36 months"
            value: "K('retention_recent')"
          - when: "the latest downgrade difference refund paid 36 to 71 whole months before"
            value: "K('retention_older')"
          - when: "otherwise"
            value: "0"
        baseline:
          dd_retention_charge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: plus_history_downgrade_credit
        effect: parameter
        decides: dd_plus_history_credit
        bindings: [dd_plus_years, dd_plus_history_credit]
        ladder:
          - when: "four or more Plus history years (fees at the Plus annual fee less duplicates)"
            value: "K('plus_credit_high')"
          - when: "two or three Plus history years"
            value: "K('plus_credit_mid')"
          - when: "otherwise (fewer than two)"
            value: "0"
        baseline:
          dd_plus_history_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: business_volume_downgrade_credit
        effect: parameter
        decides: dd_volume_credit
        bindings: [dd_volume, dd_volume_credit]
        ladder:
          - when: "business purchase volume of 6000.00 dollars or more in the past twelve months"
            value: "K('volume_credit_high')"
          - when: "business purchase volume of 2000.00 to 5999.99 dollars"
            value: "K('volume_credit_mid')"
          - when: "otherwise (below 2000.00 dollars)"
            value: "0"
        baseline:
          dd_volume_credit: "0"
        evidence: [cross_category, history]
        cross_difficulty: order
    baseline:
      rule: >-
        The standard downgrade difference refund is the current-year Plus premium, that is the new membership and
        renewal fees paid for the current membership year net of refunds of them, less the annual fee of the base
        tier now held, never below zero and kept to the cent.
      params: [annual_fee_usd]
    inputs:
      history:
        - {table: membership_transactions, aggregate: sum, field: amount, filters: {event_type: membership_fee_charged, fee_type: renewal_term}}
        - {table: membership_transactions, aggregate: sum, field: amount, filters: {event_type: membership_reward_accrued}}
        - {table: membership_transactions, aggregate: count, field: membership_txn_id, within_months: 72, filters: {event_type: membership_fee_refunded, refund_reason: downgrade_difference}}
        - {category: order, table: order_lines, aggregate: sum, field: line_amount, within_months: 12, filters: {event_type: order_line_sold}}
      cross_category: [order]

  - id: membership_ext_addon_removal_refund
    base_policy_refs: [membership_cardholders, membership_cancellation_refund, membership_plus_guarantee]
    overwrite:
      - base_policy: membership_cardholders
        superseded_clause: >-
          When the primary member removes a business add-on cardholder within full_refund_window_days calendar days
          after that card's add-on fee was charged, the fee is refunded in full with refund_reason
          addon_card_removed; after that no add-on fee is refunded until the membership itself is cancelled.
        replaced_by: >-
          The removed card refund is the removed card refund share, increased by the Northgate card refund bonus
          percentage of that share and rounded to the cent, less the repeat-removal processing charge and the card
          replacement cost recovery, never below zero and rounded to the cent once at the end.
    trigger: state_due
    subject: [membership_fee_refunded]
    computes: refund_amount
    target_tool: refund_removed_addon_card_fee_e7b2031f
    params:
      full_share_days: 30
      half_share_days: 120
      removals_high: 3
      removals_mid: 2
      removal_charge_high: 10.00
      removal_charge_mid: 4.00
      bonus_pct_visa: 4
      bonus_pct_store: 2
      replacements_high: 2
      replacement_recovery_high: 10.00
      replacement_recovery_mid: 5.00
    rule: >
      When the primary member removes a business add-on cardholder, the add-on card fee charged for that card for
      the current membership year is refunded against that fee charge and returned to the charge's tender; the
      refund is worked out for the most recent removal of an add-on card by the primary member, from the date of
      that removal, the date the card was first issued, and the date and amount of the add-on fee charge for that
      card. The standard removed card refund is the full add-on fee when the card is removed no more than the
      tier's full refund window of days after its add-on fee was charged, and nothing when it is removed later, kept
      to the cent. The removed card refund share depends on how long after the fee charge the card was removed and
      on whether the card was first issued before the current membership year began. When the card was removed
      more than 30 days and no more than the tier's full refund window of days after its add-on fee was charged and
      was first issued before the current membership year began, the removed card refund share is the add-on fee
      multiplied by the whole months from the removal date to the expiry date and divided by twelve, rounded to the
      cent. When the card was removed more than the tier's full refund window of days and no more than 120 days
      after its add-on fee was charged and was first issued before the current membership year began, the removed card refund share is half the add-on fee, rounded to the cent. Any
      other removal takes the standard removed card refund as its share. An add-on fee charged to a Northgate
      Rewards Visa earns a Northgate card refund bonus of four percent of the share, one charged to a Northgate
      Store Card earns two percent, and one charged to any other tender earns none. Removals of add-on cards by the
      primary member in the three months before the refund carry a repeat-removal processing charge of 10.00
      dollars when there are three or more of them, 4.00 dollars when there are two, and nothing when there is
      one. Replacement cards issued on the membership for a lost, stolen or damaged card in the three months before
      the refund carry a card replacement cost recovery of 10.00 dollars when there are two or more, 5.00 dollars
      when there is one, and nothing when there is none. The removed card refund is the removed card refund share,
      increased by the Northgate card refund bonus percentage of that share and rounded to the cent, less the
      repeat-removal processing charge and the card replacement cost recovery, never below zero and rounded to the
      cent once at the end.
    prerequisite: []
    cross_category: []
    compute:
      - cr_removed_card: "LATEST('membership_cards', 'source_card_id', event_type='membership_card_deactivated', deactivation_reason='removed_by_primary')"
      - cr_removed_on: "LATEST('membership_cards', 'event_date', event_type='membership_card_deactivated', deactivation_reason='removed_by_primary')"
      - cr_card_issued_on: "LATEST('membership_cards', 'event_date', membership_card_id=cr_removed_card)"
      - cr_fee_charged_on: "LATEST('membership_transactions', 'transaction_date', date_field='transaction_date', event_type='membership_fee_charged', fee_type='addon_card_fee', membership_card_id=cr_removed_card)"
      - cr_fee: "LATEST('membership_transactions', 'amount', date_field='transaction_date', event_type='membership_fee_charged', fee_type='addon_card_fee', membership_card_id=cr_removed_card)"
      - cr_standard_refund: "cr_fee if DAYS(cr_fee_charged_on, cr_removed_on) <= P('full_refund_window_days') else 0"
      - cr_days_to_removal: "DAYS(cr_fee_charged_on, cr_removed_on)"
      - cr_issued_earlier_year: "DAYS(cr_card_issued_on, F('term_start_date')) > 0"
      - cr_share: "RND(cr_fee * MONTHS(cr_removed_on, F('expiry_date')) / 12, 2) if (cr_days_to_removal > K('full_share_days') and cr_days_to_removal <= P('full_refund_window_days') and cr_issued_earlier_year) else (RND(cr_fee / 2, 2) if (cr_days_to_removal > P('full_refund_window_days') and cr_days_to_removal <= K('half_share_days') and cr_issued_earlier_year) else cr_standard_refund)"
      - cr_fee_tender: "LATEST('membership_transactions', 'tender', date_field='transaction_date', event_type='membership_fee_charged', fee_type='addon_card_fee', membership_card_id=cr_removed_card)"
      - cr_bonus_pct: "K('bonus_pct_visa') if cr_fee_tender == 'northgate_visa' else (K('bonus_pct_store') if cr_fee_tender == 'northgate_store_card' else 0)"
      - cr_removals_recent: "COUNT('membership_cards', within_months=3, event_type='membership_card_deactivated', deactivation_reason='removed_by_primary')"
      - cr_removal_charge: "K('removal_charge_high') if cr_removals_recent >= K('removals_high') else (K('removal_charge_mid') if cr_removals_recent >= K('removals_mid') else 0)"
      - cr_replacements_recent: "COUNT('membership_cards', within_months=3, event_type='membership_card_issued', issue_reason='replacement_lost_or_stolen') + COUNT('membership_cards', within_months=3, event_type='membership_card_issued', issue_reason='replacement_damaged')"
      - cr_replacement_recovery: "K('replacement_recovery_high') if cr_replacements_recent >= K('replacements_high') else (K('replacement_recovery_mid') if cr_replacements_recent >= 1 else 0)"
      - result: "RND(MX(0, RND(cr_share * (100 + cr_bonus_pct) / 100, 2) - cr_removal_charge - cr_replacement_recovery), 2)"
    compute_basis:
      cr_removed_card: "the refund is worked out for the most recent removal of an add-on card by the primary member, from the date of that removal, the date the card was first issued, and the date and amount of the add-on fee charge for that card."
      cr_removed_on: "the refund is worked out for the most recent removal of an add-on card by the primary member, from the date of that removal"
      cr_card_issued_on: "the date the card was first issued"
      cr_fee_charged_on: "the date and amount of the add-on fee charge for that card."
      cr_fee: "the date and amount of the add-on fee charge for that card."
      cr_standard_refund: "The standard removed card refund is the full add-on fee when the card is removed no more than the tier's full refund window of days after its add-on fee was charged, and nothing when it is removed later, kept to the cent."
      cr_days_to_removal: "The removed card refund share depends on how long after the fee charge the card was removed and on whether the card was first issued before the current membership year began."
      cr_issued_earlier_year: "The removed card refund share depends on how long after the fee charge the card was removed and on whether the card was first issued before the current membership year began."
      cr_share: "When the card was removed more than 30 days and no more than the tier's full refund window of days after its add-on fee was charged and was first issued before the current membership year began, the removed card refund share is the add-on fee multiplied by the whole months from the removal date to the expiry date and divided by twelve, rounded to the cent. When the card was removed more than the tier's full refund window of days and no more than 120 days after its add-on fee was charged and was first issued before the current membership year began, the removed card refund share is half the add-on fee, rounded to the cent. Any other removal takes the standard removed card refund as its share."
      cr_fee_tender: "An add-on fee charged to a Northgate Rewards Visa earns a Northgate card refund bonus of four percent of the share"
      cr_bonus_pct: "An add-on fee charged to a Northgate Rewards Visa earns a Northgate card refund bonus of four percent of the share, one charged to a Northgate Store Card earns two percent, and one charged to any other tender earns none."
      cr_removals_recent: "Removals of add-on cards by the primary member in the three months before the refund carry a repeat-removal processing charge"
      cr_removal_charge: "carry a repeat-removal processing charge of 10.00 dollars when there are three or more of them, 4.00 dollars when there are two, and nothing when there is one."
      cr_replacements_recent: "Replacement cards issued on the membership for a lost, stolen or damaged card in the three months before the refund carry a card replacement cost recovery"
      cr_replacement_recovery: "carry a card replacement cost recovery of 10.00 dollars when there are two or more, 5.00 dollars when there is one, and nothing when there is none."
      result: "The removed card refund is the removed card refund share, increased by the Northgate card refund bonus percentage of that share and rounded to the cent, less the repeat-removal processing charge and the card replacement cost recovery, never below zero and rounded to the cent once at the end."
    factors:
      - id: removed_card_refund_share
        effect: method
        decides: cr_share
        bindings: [cr_days_to_removal, cr_issued_earlier_year, cr_share]
        ladder:
          - when: "removed more than 30 days and no more than the tier's full refund window of days after its add-on fee was charged AND first issued before the current membership year"
            method: "the add-on fee prorated by whole months from the removal date to the expiry date over twelve"
          - when: "removed more than the tier's full refund window of days and no more than 120 days after the fee charge AND first issued before the current membership year"
            method: "half the add-on fee"
          - when: "otherwise"
            method: "the standard removed card refund: the full fee within the tier's full refund window, nothing after it"
        baseline:
          cr_share: "cr_standard_refund"
        evidence: [date, history, tier_param]
        cross_difficulty: null
      - id: northgate_card_refund_bonus
        effect: parameter
        decides: cr_bonus_pct
        bindings: [cr_fee_tender, cr_bonus_pct]
        ladder:
          - when: "the add-on fee was charged to a Northgate Rewards Visa"
            value: "K('bonus_pct_visa')"
          - when: "the add-on fee was charged to a Northgate Store Card"
            value: "K('bonus_pct_store')"
          - when: "otherwise (any other tender)"
            value: "0"
        baseline:
          cr_bonus_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_removal_processing_charge
        effect: parameter
        decides: cr_removal_charge
        bindings: [cr_removals_recent, cr_removal_charge]
        ladder:
          - when: "three or more add-on card removals by the primary member in the past three months"
            value: "K('removal_charge_high')"
          - when: "two such removals"
            value: "K('removal_charge_mid')"
          - when: "otherwise (one)"
            value: "0"
        baseline:
          cr_removal_charge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: card_replacement_cost_recovery
        effect: parameter
        decides: cr_replacement_recovery
        bindings: [cr_replacements_recent, cr_replacement_recovery]
        ladder:
          - when: "two or more replacement cards issued on the membership in the past three months"
            value: "K('replacement_recovery_high')"
          - when: "one replacement card issued in the past three months"
            value: "K('replacement_recovery_mid')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          cr_replacement_recovery: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard removed card refund is the full add-on fee when the card is removed no more than the tier's
        full refund window of days after its add-on fee was charged, and nothing when it is removed later, kept to
        the cent.
      params: [full_refund_window_days]
    inputs:
      history:
        - {table: membership_cards, aggregate: latest, field: event_date, filters: {event_type: membership_card_deactivated, deactivation_reason: removed_by_primary}}
        - {table: membership_cards, aggregate: count, field: membership_card_id, within_months: 3, filters: {event_type: membership_card_issued, issue_reason: replacement_lost_or_stolen}}
        - {table: membership_transactions, aggregate: latest, field: amount, filters: {event_type: membership_fee_charged, fee_type: addon_card_fee}}
      cross_category: []

  - id: membership_ext_cancellation_refund
    base_policy_refs: [membership_cancellation_refund, membership_plus_guarantee, membership_cardholders]
    overwrite:
      - base_policy: membership_cancellation_refund
        superseded_clause: >-
          The current-year fees are refunded in full only when the cancellation is requested no later than
          full_refund_window_days calendar days after the first day of the current membership year.
        replaced_by: >-
          When the cancellation comes within the full refund window and the member has recent Northgate purchases,
          the cancellation refund share is the unused months divided by twelve.
      - base_policy: membership_cancellation_refund
        superseded_clause: >-
          After that window the tier refunds membership_msr_unused_whole_months twelfths of the current-year fees
          where prorated_refund_after_window is true, and nothing where it is false.
        replaced_by: >-
          When the cancellation comes after the full refund window and the member has no recent Northgate purchases,
          the cancellation refund share is the whole of the refundable current-year fees.
      - base_policy: membership_cancellation_refund
        superseded_clause: >-
          Each refunded fee charge gets its own refund entry (cancellation_full or cancellation_prorated) against
          that charge, returned to its tender, or to a Northgate Shop Card when the charge was paid with a reward
          certificate.
        replaced_by: >-
          its refund is booked as one cancellation refund entry against the current year's renewal or new membership
          charge, returned to that charge's tender.
      - base_policy: membership_cancellation_refund
        superseded_clause: >-
          Where refund_deducts_annual_reward is true, the refund is reduced by membership_msr_year_reward_net and
          never goes below zero; the Annual Reward balance is then forfeited and no certificate is issued for the
          year.
        replaced_by: >-
          The cancellation refund is the refundable current-year fees multiplied by the cancellation refund share and
          rounded to the cent, less the Annual Reward deducted, the recent certificate recovery and the
          repeat-cancellation administration charge, plus the automatic renewal courtesy credit and the billing-error
          courtesy credit, never below zero and rounded to the cent once at the end.
    trigger: on_request
    subject: [membership_cancelled, membership_fee_refunded]
    computes: refund_amount
    target_tool: confirm_membership_cancellation_5b4de829
    params:
      recent_purchase_months: 2
      cert_full_days: 60
      cert_half_days: 120
      auto_early_days: 30
      auto_late_days: 60
      auto_courtesy_early: 10.00
      auto_courtesy_late: 5.00
      recancel_charge_recent: 10.00
      recancel_charge_older: 5.00
      billing_courtesy_recent: 10.00
      billing_courtesy_older: 5.00
    rule: >
      The primary member may cancel an active membership; the cancellation is confirmed by the primary member, ends
      the membership and every card on it the same day, the Annual Reward balance is forfeited, and its refund is
      booked as one cancellation refund entry against the current year's renewal or new membership charge, returned
      to that charge's tender. The cancellation refund is fixed only after every add-on card fee of the current
      membership year whose card the primary member has removed carries a removal refund entry against that fee.
      The cancellation refund is not worked out until, where a Plus guarantee claim request is dated within the
      current membership year, the current year's renewal charge carries its downgrade difference refund entry. The
      refundable current-year fees are the new membership, renewal and upgrade difference fees charged for the
      current membership year less every refund already booked against them, plus, where the tier's refund includes
      add-on fees, the add-on card fees charged for the current membership year less every refund already booked
      against them. The unused months are the whole months from the cancellation date to the expiry date. The
      standard cancellation refund share is the whole of the refundable current-year fees when the cancellation
      comes no more than the tier's full refund window of days after the first day of the current membership year,
      and after that window the unused months divided by twelve where the tier prorates after the window and
      nothing where it does not. The standard cancellation refund is the refundable current-year fees multiplied by
      the standard cancellation refund share and rounded to the cent, less the Annual Reward earned in the current
      year where the tier's refund deducts it, never below zero. The member's recent Northgate purchases are the
      merchandise sale lines posted in the two whole months before the cancellation. When the cancellation comes
      within the full refund window and the member has recent Northgate purchases, the cancellation refund share is
      the unused months divided by twelve. When the cancellation comes after the full refund window and the member
      has no recent Northgate purchases, the cancellation refund share is the whole of the refundable current-year
      fees. Any other cancellation takes the standard cancellation refund share. The Annual Reward earned in the
      current year is the reward accrued for the current membership year less the reward reversed for it, and it is
      deducted only where the tier's refund deducts it. A year-end Annual Reward certificate issued no more than 60
      days before the cancellation is recovered at its full value, one issued 61 to 120 days before is recovered at
      half its value rounded to the cent, and an older certificate or none is not recovered. When the current
      year's renewal fee was charged by automatic renewal, to the tender automatic renewal is set on, an automatic
      renewal courtesy credit of 10.00 dollars is added for a cancellation no more than 30 days after that charge
      and 5.00 dollars for one 31 to 60 days after it; any other cancellation gets no automatic renewal courtesy
      credit. A cancellation request the member raised in the twelve months before the cancellation, by its request date, and
      later withdrew carries a repeat-cancellation administration charge of 10.00 dollars, one raised 12 to 23 whole
      months before and later withdrawn carries 5.00 dollars, and none carries nothing. A duplicate charge refunded on the membership in the three months
      before the cancellation adds a billing-error courtesy credit of 10.00 dollars, one refunded 3 to 11 whole
      months before adds 5.00 dollars, and none adds nothing. The cancellation refund is the refundable current-year
      fees multiplied by the cancellation refund share and rounded to the cent, less the Annual Reward deducted, the
      recent certificate recovery and the repeat-cancellation administration charge, plus the automatic renewal
      courtesy credit and the billing-error courtesy credit, never below zero and rounded to the cent once at the
      end.
    prerequisite:
      - problem: membership_ext_addon_removal_refund
        kind: value_input
        gate: ca_addon_fees_net
        form: state
        policy_source: >-
          The cancellation refund is fixed only after every add-on card fee of the current membership year whose
          card the primary member has removed carries a removal refund entry against that fee.
        condition: >-
          For every membership_cards deactivation with deactivation_reason removed_by_primary whose card has an
          addon_card_fee charge with the holding's current term_start_date, membership_transactions holds a
          membership_fee_refunded entry with refund_reason addon_card_removed and source_txn_id equal to that charge.
        resolved_by: refund_removed_addon_card_fee_e7b2031f
        effect: >-
          The removal refund entry lowers the current-year add-on fees net of refunds, so ca_addon_fees_net,
          ca_refundable and the prorated share all fall by the removal refund amount.
      - problem: membership_ext_downgrade_difference_refund
        kind: value_input
        gate: ca_base_fees_net
        form: state
        policy_source: >-
          The cancellation refund is not worked out until, where a Plus guarantee claim request is dated within the
          current membership year, the current year's renewal charge carries its downgrade difference refund entry.
        condition: >-
          When membership_requests holds a shortfall_guarantee_claim request whose requested_date is on or after the
          holding's term_start_date, membership_transactions holds a membership_fee_refunded entry with refund_reason
          downgrade_difference whose source_txn_id is the current year's renewal_term charge.
        resolved_by: refund_downgrade_difference_0adda8cc
        effect: >-
          The downgrade difference refund entry lowers the current-year base fees net of refunds, so
          ca_base_fees_net, ca_refundable and the prorated share fall by the downgrade difference refund amount.
    cross_category:
      - category: order
        as: history
        reads: [order_lines.event_type, order_lines.event_date]
        note: The cancellation refund share tier is decided from whether the member has sale lines in the order ledger in the two months before the cancellation.
    compute:
      - ca_days_into_year: "DAYS(F('term_start_date'), NOW)"
      - ca_unused_months: "MONTHS(NOW, F('expiry_date'))"
      - ca_base_fees_net: "SUM('membership_transactions', 'amount', event_type='membership_fee_charged', fee_type='new_term', term_start_date=F('term_start_date')) + SUM('membership_transactions', 'amount', event_type='membership_fee_charged', fee_type='renewal_term', term_start_date=F('term_start_date')) + SUM('membership_transactions', 'amount', event_type='membership_fee_charged', fee_type='upgrade_difference', term_start_date=F('term_start_date')) - SUM('membership_transactions', 'amount', event_type='membership_fee_refunded', fee_type='new_term', term_start_date=F('term_start_date')) - SUM('membership_transactions', 'amount', event_type='membership_fee_refunded', fee_type='renewal_term', term_start_date=F('term_start_date')) - SUM('membership_transactions', 'amount', event_type='membership_fee_refunded', fee_type='upgrade_difference', term_start_date=F('term_start_date'))"
      - ca_addon_fees_net: "SUM('membership_transactions', 'amount', event_type='membership_fee_charged', fee_type='addon_card_fee', term_start_date=F('term_start_date')) - SUM('membership_transactions', 'amount', event_type='membership_fee_refunded', fee_type='addon_card_fee', term_start_date=F('term_start_date'))"
      - ca_refundable: "RND(ca_base_fees_net + (ca_addon_fees_net if P('refund_includes_addon_fees') else 0), 2)"
      - ca_standard_share: "1 if ca_days_into_year <= P('full_refund_window_days') else ((ca_unused_months / 12) if P('prorated_refund_after_window') else 0)"
      - ca_recent_purchases: "XCOUNT('order', 'order_lines', within_months=K('recent_purchase_months'), event_type='order_line_sold')"
      - ca_share: "(ca_unused_months / 12) if (ca_days_into_year <= P('full_refund_window_days') and ca_recent_purchases > 0) else (1 if (ca_days_into_year > P('full_refund_window_days') and ca_recent_purchases == 0) else ca_standard_share)"
      - ca_share_amount: "RND(ca_refundable * ca_share, 2)"
      - ca_year_reward: "RND(SUM('membership_transactions', 'amount', event_type='membership_reward_accrued', term_start_date=F('term_start_date')) - SUM('membership_transactions', 'amount', event_type='membership_reward_reversed', term_start_date=F('term_start_date')), 2)"
      - ca_reward_deduction: "MX(0, ca_year_reward) if P('refund_deducts_annual_reward') else 0"
      - ca_cert_count: "COUNT('membership_transactions', event_type='membership_reward_certificate_issued')"
      - ca_cert_days: "DAYS(LATEST('membership_transactions', 'transaction_date', date_field='transaction_date', event_type='membership_reward_certificate_issued'), NOW) if ca_cert_count > 0 else 9999"
      - ca_cert_value: "LATEST('membership_transactions', 'amount', date_field='transaction_date', event_type='membership_reward_certificate_issued') if ca_cert_count > 0 else 0"
      - ca_cert_recovery: "ca_cert_value if (ca_cert_count > 0 and ca_cert_days <= K('cert_full_days')) else (RND(ca_cert_value / 2, 2) if (ca_cert_days > K('cert_full_days') and ca_cert_days <= K('cert_half_days')) else 0)"
      - ca_renewal_count: "COUNT('membership_transactions', event_type='membership_fee_charged', fee_type='renewal_term', term_start_date=F('term_start_date'))"
      - ca_renewal_tender: "LATEST('membership_transactions', 'tender', date_field='transaction_date', event_type='membership_fee_charged', fee_type='renewal_term', term_start_date=F('term_start_date')) if ca_renewal_count > 0 else 'none'"
      - ca_renewal_days: "DAYS(LATEST('membership_transactions', 'transaction_date', date_field='transaction_date', event_type='membership_fee_charged', fee_type='renewal_term', term_start_date=F('term_start_date')), NOW) if ca_renewal_count > 0 else 9999"
      - ca_auto_renewed: "F('auto_renew') == True and ca_renewal_tender == F('auto_renew_tender')"
      - ca_auto_courtesy: "K('auto_courtesy_early') if (ca_auto_renewed and ca_renewal_days <= K('auto_early_days')) else (K('auto_courtesy_late') if (ca_auto_renewed and ca_renewal_days > K('auto_early_days') and ca_renewal_days <= K('auto_late_days')) else 0)"
      - ca_withdrawn_recent: "COUNT('membership_requests', within_months=12, date_field='requested_date', request_type='cancel_with_refund', status='withdrawn')"
      - ca_withdrawn_older: "COUNT('membership_requests', within_months=24, date_field='requested_date', request_type='cancel_with_refund', status='withdrawn') - ca_withdrawn_recent"
      - ca_recancel_charge: "K('recancel_charge_recent') if ca_withdrawn_recent >= 1 else (K('recancel_charge_older') if ca_withdrawn_older >= 1 else 0)"
      - ca_dup_recent: "COUNT('membership_transactions', within_months=3, date_field='transaction_date', event_type='membership_fee_refunded', refund_reason='duplicate_charge')"
      - ca_dup_year: "COUNT('membership_transactions', within_months=12, date_field='transaction_date', event_type='membership_fee_refunded', refund_reason='duplicate_charge') - ca_dup_recent"
      - ca_billing_courtesy: "K('billing_courtesy_recent') if ca_dup_recent >= 1 else (K('billing_courtesy_older') if ca_dup_year >= 1 else 0)"
      - result: "RND(MX(0, ca_share_amount - ca_reward_deduction - ca_cert_recovery - ca_recancel_charge + ca_auto_courtesy + ca_billing_courtesy), 2)"
    compute_basis:
      ca_days_into_year: "when the cancellation comes no more than the tier's full refund window of days after the first day of the current membership year"
      ca_unused_months: "The unused months are the whole months from the cancellation date to the expiry date."
      ca_base_fees_net: "The refundable current-year fees are the new membership, renewal and upgrade difference fees charged for the current membership year less every refund already booked against them"
      ca_addon_fees_net: "plus, where the tier's refund includes add-on fees, the add-on card fees charged for the current membership year less every refund already booked against them."
      ca_refundable: "The refundable current-year fees are the new membership, renewal and upgrade difference fees charged for the current membership year less every refund already booked against them, plus, where the tier's refund includes add-on fees, the add-on card fees charged for the current membership year less every refund already booked against them."
      ca_standard_share: "The standard cancellation refund share is the whole of the refundable current-year fees when the cancellation comes no more than the tier's full refund window of days after the first day of the current membership year, and after that window the unused months divided by twelve where the tier prorates after the window and nothing where it does not."
      ca_recent_purchases: "The member's recent Northgate purchases are the merchandise sale lines posted in the two whole months before the cancellation."
      ca_share: "When the cancellation comes within the full refund window and the member has recent Northgate purchases, the cancellation refund share is the unused months divided by twelve. When the cancellation comes after the full refund window and the member has no recent Northgate purchases, the cancellation refund share is the whole of the refundable current-year fees. Any other cancellation takes the standard cancellation refund share."
      ca_share_amount: "the refundable current-year fees multiplied by the cancellation refund share and rounded to the cent"
      ca_year_reward: "The Annual Reward earned in the current year is the reward accrued for the current membership year less the reward reversed for it"
      ca_reward_deduction: "and it is deducted only where the tier's refund deducts it."
      ca_cert_count: "A year-end Annual Reward certificate issued no more than 60 days before the cancellation is recovered at its full value"
      ca_cert_days: "A year-end Annual Reward certificate issued no more than 60 days before the cancellation is recovered at its full value, one issued 61 to 120 days before is recovered at half its value rounded to the cent, and an older certificate or none is not recovered."
      ca_cert_value: "is recovered at its full value"
      ca_cert_recovery: "A year-end Annual Reward certificate issued no more than 60 days before the cancellation is recovered at its full value, one issued 61 to 120 days before is recovered at half its value rounded to the cent, and an older certificate or none is not recovered."
      ca_renewal_count: "When the current year's renewal fee was charged by automatic renewal, to the tender automatic renewal is set on"
      ca_renewal_tender: "When the current year's renewal fee was charged by automatic renewal, to the tender automatic renewal is set on"
      ca_renewal_days: "for a cancellation no more than 30 days after that charge and 5.00 dollars for one 31 to 60 days after it"
      ca_auto_renewed: "When the current year's renewal fee was charged by automatic renewal, to the tender automatic renewal is set on"
      ca_auto_courtesy: "an automatic renewal courtesy credit of 10.00 dollars is added for a cancellation no more than 30 days after that charge and 5.00 dollars for one 31 to 60 days after it; any other cancellation gets no automatic renewal courtesy credit."
      ca_withdrawn_recent: "A cancellation request the member raised in the twelve months before the cancellation, by its request date, and later withdrew carries a repeat-cancellation administration charge of 10.00 dollars"
      ca_withdrawn_older: "one raised 12 to 23 whole months before and later withdrawn carries 5.00 dollars"
      ca_recancel_charge: "A cancellation request the member raised in the twelve months before the cancellation, by its request date, and later withdrew carries a repeat-cancellation administration charge of 10.00 dollars, one raised 12 to 23 whole months before and later withdrawn carries 5.00 dollars, and none carries nothing."
      ca_dup_recent: "A duplicate charge refunded on the membership in the three months before the cancellation adds a billing-error courtesy credit of 10.00 dollars"
      ca_dup_year: "one refunded 3 to 11 whole months before adds 5.00 dollars"
      ca_billing_courtesy: "A duplicate charge refunded on the membership in the three months before the cancellation adds a billing-error courtesy credit of 10.00 dollars, one refunded 3 to 11 whole months before adds 5.00 dollars, and none adds nothing."
      result: "The cancellation refund is the refundable current-year fees multiplied by the cancellation refund share and rounded to the cent, less the Annual Reward deducted, the recent certificate recovery and the repeat-cancellation administration charge, plus the automatic renewal courtesy credit and the billing-error courtesy credit, never below zero and rounded to the cent once at the end."
    factors:
      - id: cancellation_refund_share
        effect: method
        decides: ca_share
        bindings: [ca_days_into_year, ca_unused_months, ca_recent_purchases, ca_share]
        ladder:
          - when: "the cancellation comes within the full refund window AND the member has recent Northgate purchases"
            method: "the refundable fees are prorated: unused whole months to the expiry date over twelve"
          - when: "the cancellation comes after the full refund window AND the member has no recent Northgate purchases"
            method: "the whole of the refundable fees is refunded"
          - when: "otherwise"
            method: "the standard share: the whole within the full refund window, unused months over twelve after it where the tier prorates"
        baseline:
          ca_share: "ca_standard_share"
        evidence: [date, cross_category, history]
        cross_difficulty: order
      - id: recent_certificate_recovery
        effect: parameter
        decides: ca_cert_recovery
        bindings: [ca_cert_count, ca_cert_days, ca_cert_value, ca_cert_recovery]
        ladder:
          - when: "a year-end Annual Reward certificate issued no more than 60 days before the cancellation"
            value: "the certificate's full value"
          - when: "the latest certificate issued 61 to 120 days before the cancellation"
            value: "half the certificate's value"
          - when: "otherwise (older or none)"
            value: "0"
        baseline:
          ca_cert_recovery: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: automatic_renewal_courtesy_credit
        effect: parameter
        decides: ca_auto_courtesy
        bindings: [ca_renewal_count, ca_renewal_tender, ca_renewal_days, ca_auto_renewed, ca_auto_courtesy]
        ladder:
          - when: "the current year's renewal was charged by automatic renewal to its set tender AND the cancellation is no more than 30 days after that charge"
            value: "K('auto_courtesy_early')"
          - when: "renewed by automatic renewal AND the cancellation is 31 to 60 days after that charge"
            value: "K('auto_courtesy_late')"
          - when: "otherwise"
            value: "0"
        baseline:
          ca_auto_courtesy: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: repeat_cancellation_administration_charge
        effect: parameter
        decides: ca_recancel_charge
        bindings: [ca_withdrawn_recent, ca_withdrawn_older, ca_recancel_charge]
        ladder:
          - when: "a cancellation request raised (by request date) in the twelve months before the cancellation and later withdrawn"
            value: "K('recancel_charge_recent')"
          - when: "one raised 12 to 23 whole months before and later withdrawn"
            value: "K('recancel_charge_older')"
          - when: "otherwise"
            value: "0"
        baseline:
          ca_recancel_charge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: billing_error_courtesy_credit
        effect: parameter
        decides: ca_billing_courtesy
        bindings: [ca_dup_recent, ca_dup_year, ca_billing_courtesy]
        ladder:
          - when: "a duplicate charge refunded in the three months before the cancellation"
            value: "K('billing_courtesy_recent')"
          - when: "one refunded 3 to 11 whole months before"
            value: "K('billing_courtesy_older')"
          - when: "otherwise"
            value: "0"
        baseline:
          ca_billing_courtesy: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The refundable current-year fees are the new membership, renewal and upgrade difference fees charged for the
        current membership year less every refund already booked against them, plus, where the tier's refund
        includes add-on fees, the add-on card fees charged for the current membership year less every refund already
        booked against them. The unused months are the whole months from the cancellation date to the expiry date.
        The standard cancellation refund share is the whole of the refundable current-year fees when the
        cancellation comes no more than the tier's full refund window of days after the first day of the current
        membership year, and after that window the unused months divided by twelve where the tier prorates after the
        window and nothing where it does not. The standard cancellation refund is the refundable current-year fees
        multiplied by the standard cancellation refund share and rounded to the cent, less the Annual Reward earned
        in the current year where the tier's refund deducts it, never below zero.
      params: [full_refund_window_days, prorated_refund_after_window, refund_includes_addon_fees, refund_deducts_annual_reward]
    inputs:
      history:
        - {table: membership_transactions, aggregate: sum, field: amount, filters: {event_type: membership_fee_charged}}
        - {table: membership_transactions, aggregate: sum, field: amount, filters: {event_type: membership_fee_refunded}}
        - {table: membership_requests, aggregate: count, field: membership_request_id, within_months: 24, filters: {request_type: cancel_with_refund, status: withdrawn}}
        - {category: order, table: order_lines, aggregate: count, field: order_line_id, within_months: 2, filters: {event_type: order_line_sold}}
      cross_category: [order]
