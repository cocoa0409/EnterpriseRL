# Northgate Wholesale Club — Optical charter.
# Members order prescription eyewear at the club Optical counter. Each pair is held as one eyewear job whose
# tier is its lens design; the job runs through the lab, is dispensed, may be remade under the lens design's
# guarantees, and is booked through optical charges (frame, lenses, options, remakes) and optical credits
# (vision plan allowances, refunds, waived remake charges).

category: optical
display_name: Northgate Optical

binding:
  holding_table: optical_holdings
  event_tables: [optical_transactions]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [ordered, in_lab, ready_for_pickup, dispensed, remake_in_lab, returned, cancelled]
  transitions:
    - {from: ordered, to: in_lab, by: system, means: "The optical counter submits the verified job to the lens lab."}
    - {from: in_lab, to: ready_for_pickup, by: system, means: "The finished eyewear arrives at the club and passes inspection."}
    - {from: remake_in_lab, to: ready_for_pickup, by: system, means: "The remade eyewear arrives at the club and passes inspection."}
    - {from: ready_for_pickup, to: dispensed, by: system, means: "The optician fits the eyewear and hands it to the patient."}
    - {from: dispensed, to: remake_in_lab, by: agent, means: "A remake of dispensed eyewear is opened and sent to the lab."}
    - {from: ordered, to: cancelled, by: agent, means: "The job is cancelled before it reaches the lab."}
    - {from: in_lab, to: cancelled, by: agent, means: "The job is cancelled while the lab is making it."}
    - {from: dispensed, to: returned, by: agent, means: "Dispensed eyewear is returned for a refund within the satisfaction window."}

accounts:
  - key: optical_balance
    unit: USD
    meaning: What the member owes or has paid on the eyewear job — charges less vision plan allowances, refunds and waived charges.

parameter_schema:
  base_lens_price_usd: "price of a pair of the lens design in standard plastic with scratch coating and UV protection (USD)"
  lens_design: "the optical design of the lens (string code)"
  min_fitting_height_mm: "smallest frame fitting height the design can be cut into; 0 = no minimum (millimetres)"
  max_sphere_power: "highest absolute sphere power the design is made in (diopters)"
  max_cylinder_power: "highest absolute cylinder power the design is made in (diopters)"
  max_add_power: "highest reading add power the design is made in; 0.00 for single vision (diopters)"
  materials_available: "lens materials the design is made in (list of lens_material values)"
  polycarbonate_upgrade_usd: "upgrade price from plastic to polycarbonate (USD)"
  trivex_upgrade_usd: "upgrade price from plastic to Trivex (USD)"
  high_index_160_upgrade_usd: "upgrade price from plastic to 1.60 high index; 0.00 where not available (USD)"
  high_index_167_upgrade_usd: "upgrade price from plastic to 1.67 high index; 0.00 where not available (USD)"
  high_index_174_upgrade_usd: "upgrade price from plastic to 1.74 high index; 0.00 where not available (USD)"
  minor_impact_resistant_required: "whether eyewear for a patient under 18 must be polycarbonate or Trivex (boolean)"
  ar_coating_included: "whether anti-reflective coating is included in the lens price (boolean)"
  ar_coating_price_usd: "price of anti-reflective coating where not included (USD)"
  photochromic_price_usd: "price of the light-adaptive option (USD)"
  blue_light_filter_price_usd: "price of the blue-light filtering option (USD)"
  scratch_coating_included: "whether scratch-resistant coating is included (boolean)"
  uv_protection_included: "whether UV protection is included (boolean)"
  plus_member_lens_discount_pct: "discount on the components in plus_discount_applies_to when the membership on the job is a Plus tier on the order date (percent)"
  plus_discount_applies_to: "charge components the Plus discount applies to (list of charge_component values)"
  insurance_combinable_with_plus_discount: "whether the Plus discount can be combined with vision plan billing on the same job (boolean)"
  vision_plans_accepted: "vision insurance plans Northgate Optical bills (list of vision_plan values)"
  vision_plan_lens_copay_usd: "what the member pays for the lens design under each plan; the plan covers the rest of base_lenses (mapping vision_plan -> USD)"
  vision_plan_frame_allowance_usd: "how much of the frame charge each plan covers (mapping vision_plan -> USD)"
  rx_max_age_months: "oldest prescription, by its issue date, a job may be made from (calendar months)"
  frame_warranty_months: "months after dispensing a frame defect is replaced free (months)"
  coating_warranty_months: "months after dispensing a coating defect such as peeling or crazing is remade free (months)"
  non_adapt_window_days: "calendar days after dispensing during which a patient who cannot adapt to the design gets a free remake; 0 = no non-adapt guarantee (days)"
  non_adapt_remakes_allowed: "free non-adapt remakes per job (count)"
  non_adapt_switch_allowed: "whether a non-adapt remake may switch to another lens design (boolean)"
  rx_change_remake_window_days: "calendar days after dispensing during which a prescription changed by the doctor is remade free (days)"
  rx_change_remakes_allowed: "free prescription-change remakes per job (count)"
  lab_defect_remake_free: "whether a lab defect is remade free (boolean)"
  lab_defect_window_months: "months after dispensing during which a lab defect is remade free (months)"
  remake_charge_pct_outside_coverage: "charge for a remake no guarantee covers, as a percentage of the job's base_lenses price (percent)"
  accidental_damage_coverage_months: "months after dispensing during which accidentally damaged eyewear is replaced for a charge; 0 = no coverage (months)"
  accidental_damage_charge_pct: "charge for an accidental damage replacement, as a percentage of the job's frame and base_lenses charges (percent)"
  accidental_damage_replacements_allowed: "accidental damage replacements per job (count)"
  satisfaction_return_window_days: "calendar days after dispensing during which the eyewear may be returned for a full refund (days)"
  cancellation_before_lab_full_refund: "whether a job cancelled before lab submission is refunded in full (boolean)"
  in_lab_cancellation_retained_pct: "share of lens charges kept when a job is cancelled while in the lab (percent)"
  reward_eligible_components: "charge components that can earn Annual Reward (list of charge_component values)"
  free_adjustments: "whether frame adjustments and nose pad replacements are free for the life of the eyewear (boolean)"
  household_dependents_eligible: "whether the member may order eyewear for household dependents under the membership (boolean)"
  own_frame_lenses_allowed: "whether lenses are fitted into a frame the member brings in (boolean)"
  return_refund_includes_frame: "whether a satisfaction return refunds the frame as well as the lenses (boolean)"
  max_remakes_total: "remakes of any kind allowed on one job (count)"

