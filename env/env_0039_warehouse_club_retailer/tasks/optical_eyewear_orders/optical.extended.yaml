events:
  - type: optical_order_placed
    target: optical_holdings
    mutation: create
    meaning: A prescription eyewear job is ordered at an Optical counter; its frame and base lenses (and any ordered options) are charged the same day.
    grain: one row per pair of eyewear ordered
    fields:
      customer_id: the member who placed the job
      membership_id: the membership presented
      variant_name: the lens design ordered
      status: always ordered on creation
      rx_issue_date: the issue date of the prescription used
      frame_description: the frame on the work order
      lens_material: the lens material ordered
      vision_plan: the plan billed, or none
      order_date: the order date
      dispensed_date: empty until dispensed
      remake_count: always 0 on creation
    triggers:
      - event: optical:optical_charge_posted
        map: {remake_number: 0, remake_reason: not_applicable, event_date: order_date}

  - type: optical_lab_submitted
    target: optical_holdings
    mutation: {transition: {from: ordered, to: in_lab}}
    meaning: The verified job is sent to the lens lab.
    grain: one row per job submitted
    fields:
      status: becomes in_lab
    triggers: []

  - type: optical_ready
    target: optical_holdings
    mutation: {transition: [{from: in_lab, to: ready_for_pickup}, {from: remake_in_lab, to: ready_for_pickup}]}
    meaning: Finished or remade eyewear arrives at the club and passes inspection.
    grain: one row per arrival at the club
    fields:
      status: becomes ready_for_pickup
    triggers: []

  - type: optical_dispensed
    target: optical_holdings
    mutation: {transition: {from: ready_for_pickup, to: dispensed}}
    meaning: The optician fits the eyewear and hands it to the patient.
    grain: one row per dispensing
    fields:
      status: becomes dispensed
      dispensed_date: the date of the first dispensing (not moved by later remakes)
    triggers: []

  - type: optical_remake_opened
    target: optical_holdings
    mutation: {transition: {from: dispensed, to: remake_in_lab}}
    meaning: A remake of dispensed eyewear is opened and sent to the lab.
    grain: one row per remake opened
    fields:
      status: becomes remake_in_lab
      remake_count: increased by one
    triggers:
      - event: optical:optical_charge_posted
        map: {charge_component: remake_charge}

  - type: optical_lens_design_changed
    target: optical_holdings
    mutation: update
    meaning: A non-adapt remake switches the job to another lens design.
    grain: one row per design switch
    fields:
      variant_name: the lens design the job is remade in
    triggers: []

  - type: optical_order_cancelled
    target: optical_holdings
    mutation: {transition: [{from: ordered, to: cancelled}, {from: in_lab, to: cancelled}]}
    meaning: The job is cancelled before the eyewear is dispensed.
    grain: one row per job cancelled
    fields:
      status: becomes cancelled
      closed_date: the cancellation date
    triggers: []

  - type: optical_order_returned
    target: optical_holdings
    mutation: {transition: {from: dispensed, to: returned}}
    meaning: Dispensed eyewear is returned for a refund within the satisfaction window.
    grain: one row per job returned
    fields:
      status: becomes returned
      closed_date: the return date
    triggers: []

  - type: optical_charge_posted
    target: optical_transactions
    meaning: A component of the job, or a remake, is charged.
    grain: one row per charge component per remake number
    distinguish_by: [charge_component, remake_number]
    fields:
      event_date: the date of the charge
      charge_component: the component charged
      amount: the charge after any Plus discount
      remake_number: 0 for the original job, n for the n-th remake
      remake_reason: why the remake was opened
      reward_eligible: whether the charge earns Annual Reward
    account: optical_balance
    direction: in
    triggers:
      - event: membership:membership_reward_accrued
        when: {reward_eligible: true}
        map: {basis_amount: amount, source_category: optical, source_ref_id: optical_txn_id, transaction_date: event_date}

  - type: optical_credit_posted
    target: optical_transactions
    meaning: A credit is posted against one charge — a vision plan allowance, a refund, or a waived remake charge.
    grain: one row per credit of one charge for one reason
    distinguish_by: [source_txn_id, credit_reason]
    fields:
      event_date: the date of the credit
      charge_component: the component of the charge credited, or the allowance type
      amount: the credit
      remake_number: the remake number of the charge credited
      credit_reason: why the credit was posted
      source_txn_id: the exact charge credited
      reward_eligible: copied from the charge credited
    account: optical_balance
    direction: out
    triggers:
      - event: membership:membership_reward_reversed
        when: {reward_eligible: true}
        map: {basis_amount: amount, source_category: optical, source_ref_id: optical_txn_id, transaction_date: event_date}

measures:
  - id: optical_msr_remakes_for_reason
    window: the life of the job
    measure: count of optical_charge_posted entries with charge_component remake_charge whose remake_reason is the reason in question
  - id: optical_msr_plus_on_order_date
    window: the job, on its order_date
    measure: true when the membership on the job was held at Northgate Club Plus Membership or Northgate Business Plus Membership on the order date
  - id: optical_msr_charge_net
    window: the life of one charge
    measure: the charge's amount minus every optical_credit_posted amount whose source_txn_id is that charge
  - id: optical_msr_original_lens_charges
    window: the original job (remake_number 0)
    measure: sum of optical_msr_charge_net over the base_lenses, material_upgrade, anti_reflective_coating, photochromic and blue_light_filter charges with remake_number 0

policies:
  - id: optical_agg_multi_holding
    subject: [optical_order_placed]
    rule: >
      A member may have any number of eyewear jobs, including several open at once for different patients in
      the household or for different pairs. Each job is priced, billed to insurance, remade and refunded on
      its own; a charge, credit, remake or guarantee on one job never applies to another, and no multi-pair
      discount exists.
    eligibility: []
    params:
      max_per_customer: null

  - id: optical_agg_discount_stacking
    subject: [optical_charge_posted, optical_credit_posted]
    rule: >
      A job is billed either with the member's vision plan or with the Plus lens discount, never both, because
      insurance_combinable_with_plus_discount is false: when the job's vision_plan is not none the Plus
      discount is not applied, and when it is none the Plus discount applies if optical_msr_plus_on_order_date
      is true. A job belongs to the membership presented on it, and eyewear for a household dependent is
      ordered under the primary member's membership where household_dependents_eligible is true; the patient's
      own membership, if any, has no bearing on the job.
    eligibility:
      - id: one_discount_route
        applies_to: [optical_charge_posted]
        kind: authorization
        condition: when the job's vision_plan is not none the Plus discount is not applied, and when it is none the Plus discount applies if optical_msr_plus_on_order_date is true
        evidence_fields: [optical_holdings.vision_plan, optical_holdings.membership_id, optical_holdings.optical_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_holdings.optical_order_id]
          action_bindings:
            optical_holdings.optical_order_id: optical_order_id
    measures: [optical_msr_plus_on_order_date]
    params:
      per_tier:
        Northgate Single Vision Lenses: {combinable: "=insurance_combinable_with_plus_discount", dependents: "=household_dependents_eligible"}
        Northgate Lined Bifocal Lenses: {combinable: "=insurance_combinable_with_plus_discount", dependents: "=household_dependents_eligible"}
        Northgate Lined Trifocal Lenses: {combinable: "=insurance_combinable_with_plus_discount", dependents: "=household_dependents_eligible"}
        Northgate Standard Progressive Lenses: {combinable: "=insurance_combinable_with_plus_discount", dependents: "=household_dependents_eligible"}
        Northgate Premium Progressive Lenses: {combinable: "=insurance_combinable_with_plus_discount", dependents: "=household_dependents_eligible"}
        Northgate Digital Freeform Progressive Lenses: {combinable: "=insurance_combinable_with_plus_discount", dependents: "=household_dependents_eligible"}

  - id: optical_job_pricing
    subject: [optical_order_placed, optical_charge_posted]
    rule: >
      A job is charged component by component on the order date: base_lenses at base_lens_price_usd; the frame
      at its tagged price; a material_upgrade at the lens design's upgrade price for the lens_material when it
      is not cr39_plastic; anti_reflective_coating at ar_coating_price_usd unless ar_coating_included; and
      photochromic or blue_light_filter at their prices when ordered. Scratch coating and UV protection are
      included where the design's switches say so. When the Plus discount applies under
      optical_agg_discount_stacking, the components in plus_discount_applies_to are charged after
      plus_member_lens_discount_pct, rounded to the cent per component. A lens material is ordered only when
      it is in the design's materials_available. Lenses are fitted only into frames sold by Northgate while
      own_frame_lenses_allowed is false.
    eligibility:
      - id: material_offered
        applies_to: [optical_order_placed]
        kind: authorization
        condition: A lens material is ordered only when it is in the design's materials_available.
        evidence_fields: [optical_holdings.lens_material, optical_holdings.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_holdings.variant_name]
          action_bindings:
            optical_holdings.variant_name: variant_name
    measures: [optical_msr_plus_on_order_date]
    params:
      per_tier:
        Northgate Single Vision Lenses: {lenses: "=base_lens_price_usd", poly: "=polycarbonate_upgrade_usd", trivex: "=trivex_upgrade_usd", hi160: "=high_index_160_upgrade_usd", hi167: "=high_index_167_upgrade_usd", hi174: "=high_index_174_upgrade_usd", ar_included: "=ar_coating_included", ar: "=ar_coating_price_usd", photochromic: "=photochromic_price_usd", blue_light: "=blue_light_filter_price_usd", plus_pct: "=plus_member_lens_discount_pct", plus_applies: "=plus_discount_applies_to", materials: "=materials_available", scratch: "=scratch_coating_included", uv: "=uv_protection_included", own_frame: "=own_frame_lenses_allowed"}
        Northgate Lined Bifocal Lenses: {lenses: "=base_lens_price_usd", poly: "=polycarbonate_upgrade_usd", trivex: "=trivex_upgrade_usd", hi160: "=high_index_160_upgrade_usd", hi167: "=high_index_167_upgrade_usd", hi174: "=high_index_174_upgrade_usd", ar_included: "=ar_coating_included", ar: "=ar_coating_price_usd", photochromic: "=photochromic_price_usd", blue_light: "=blue_light_filter_price_usd", plus_pct: "=plus_member_lens_discount_pct", plus_applies: "=plus_discount_applies_to", materials: "=materials_available", scratch: "=scratch_coating_included", uv: "=uv_protection_included", own_frame: "=own_frame_lenses_allowed"}
        Northgate Lined Trifocal Lenses: {lenses: "=base_lens_price_usd", poly: "=polycarbonate_upgrade_usd", trivex: "=trivex_upgrade_usd", hi160: "=high_index_160_upgrade_usd", hi167: "=high_index_167_upgrade_usd", hi174: "=high_index_174_upgrade_usd", ar_included: "=ar_coating_included", ar: "=ar_coating_price_usd", photochromic: "=photochromic_price_usd", blue_light: "=blue_light_filter_price_usd", plus_pct: "=plus_member_lens_discount_pct", plus_applies: "=plus_discount_applies_to", materials: "=materials_available", scratch: "=scratch_coating_included", uv: "=uv_protection_included", own_frame: "=own_frame_lenses_allowed"}
        Northgate Standard Progressive Lenses: {lenses: "=base_lens_price_usd", poly: "=polycarbonate_upgrade_usd", trivex: "=trivex_upgrade_usd", hi160: "=high_index_160_upgrade_usd", hi167: "=high_index_167_upgrade_usd", hi174: "=high_index_174_upgrade_usd", ar_included: "=ar_coating_included", ar: "=ar_coating_price_usd", photochromic: "=photochromic_price_usd", blue_light: "=blue_light_filter_price_usd", plus_pct: "=plus_member_lens_discount_pct", plus_applies: "=plus_discount_applies_to", materials: "=materials_available", scratch: "=scratch_coating_included", uv: "=uv_protection_included", own_frame: "=own_frame_lenses_allowed"}
        Northgate Premium Progressive Lenses: {lenses: "=base_lens_price_usd", poly: "=polycarbonate_upgrade_usd", trivex: "=trivex_upgrade_usd", hi160: "=high_index_160_upgrade_usd", hi167: "=high_index_167_upgrade_usd", hi174: "=high_index_174_upgrade_usd", ar_included: "=ar_coating_included", ar: "=ar_coating_price_usd", photochromic: "=photochromic_price_usd", blue_light: "=blue_light_filter_price_usd", plus_pct: "=plus_member_lens_discount_pct", plus_applies: "=plus_discount_applies_to", materials: "=materials_available", scratch: "=scratch_coating_included", uv: "=uv_protection_included", own_frame: "=own_frame_lenses_allowed"}
        Northgate Digital Freeform Progressive Lenses: {lenses: "=base_lens_price_usd", poly: "=polycarbonate_upgrade_usd", trivex: "=trivex_upgrade_usd", hi160: "=high_index_160_upgrade_usd", hi167: "=high_index_167_upgrade_usd", hi174: "=high_index_174_upgrade_usd", ar_included: "=ar_coating_included", ar: "=ar_coating_price_usd", photochromic: "=photochromic_price_usd", blue_light: "=blue_light_filter_price_usd", plus_pct: "=plus_member_lens_discount_pct", plus_applies: "=plus_discount_applies_to", materials: "=materials_available", scratch: "=scratch_coating_included", uv: "=uv_protection_included", own_frame: "=own_frame_lenses_allowed"}
    formula:
      lens_charge: round(base_lens_price_usd * (1 - plus_member_lens_discount_pct / 100), 2) if optical_msr_plus_on_order_date and vision_plan == "none" else base_lens_price_usd

  - id: optical_prescription_rules
    subject: [optical_order_placed, optical_lab_submitted]
    rule: >
      A job is ordered only when the order is placed no later than rx_max_age_months calendar months after the
      prescription's issue date. Calendar months are added to the issue date and, when the resulting month has
      no such day, the boundary falls on that month's last day. The prescription's sphere, cylinder and add
      powers must be within the design's max_sphere_power, max_cylinder_power and max_add_power, and the frame's
      fitting height at least min_fitting_height_mm; a prescription outside those limits is ordered in a design
      that accepts it. Where minor_impact_resistant_required is true, eyewear for a patient under 18 is made
      only in polycarbonate or Trivex. The optical counter verifies the prescription with the prescribing
      office before lab submission; a prescription read to member services over the phone is never
      entered by member services.
    eligibility:
      - id: prescription_current
        applies_to: [optical_order_placed]
        kind: time
        condition: A job is ordered only when the order is placed no later than rx_max_age_months calendar months after the prescription's issue date.
        evidence_fields: [optical_holdings.rx_issue_date, optical_holdings.optical_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_holdings.optical_order_id]
          action_bindings:
            optical_holdings.optical_order_id: optical_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the prescription's issue date
          anchor_source: optical_holdings.rx_issue_date
          relation: not_after
          duration_source: variants.rx_max_age_months
          unit: calendar_months
          counting_rule: Calendar months are added to the issue date and, when the resulting month has no such day, the boundary falls on that month's last day.
          boundary: inclusive
    params:
      per_tier:
        Northgate Single Vision Lenses: {rx_age_months: "=rx_max_age_months", sphere: "=max_sphere_power", cylinder: "=max_cylinder_power", add: "=max_add_power", fitting_height: "=min_fitting_height_mm", minors_impact: "=minor_impact_resistant_required", design: "=lens_design"}
        Northgate Lined Bifocal Lenses: {rx_age_months: "=rx_max_age_months", sphere: "=max_sphere_power", cylinder: "=max_cylinder_power", add: "=max_add_power", fitting_height: "=min_fitting_height_mm", minors_impact: "=minor_impact_resistant_required", design: "=lens_design"}
        Northgate Lined Trifocal Lenses: {rx_age_months: "=rx_max_age_months", sphere: "=max_sphere_power", cylinder: "=max_cylinder_power", add: "=max_add_power", fitting_height: "=min_fitting_height_mm", minors_impact: "=minor_impact_resistant_required", design: "=lens_design"}
        Northgate Standard Progressive Lenses: {rx_age_months: "=rx_max_age_months", sphere: "=max_sphere_power", cylinder: "=max_cylinder_power", add: "=max_add_power", fitting_height: "=min_fitting_height_mm", minors_impact: "=minor_impact_resistant_required", design: "=lens_design"}
        Northgate Premium Progressive Lenses: {rx_age_months: "=rx_max_age_months", sphere: "=max_sphere_power", cylinder: "=max_cylinder_power", add: "=max_add_power", fitting_height: "=min_fitting_height_mm", minors_impact: "=minor_impact_resistant_required", design: "=lens_design"}
        Northgate Digital Freeform Progressive Lenses: {rx_age_months: "=rx_max_age_months", sphere: "=max_sphere_power", cylinder: "=max_cylinder_power", add: "=max_add_power", fitting_height: "=min_fitting_height_mm", minors_impact: "=minor_impact_resistant_required", design: "=lens_design"}

  - id: optical_vision_plan_billing
    subject: [optical_credit_posted]
    rule: >
      Northgate Optical bills only the plans in vision_plans_accepted; a plan not on the list is not billed
      and the member pays privately. When the job's vision_plan is a listed plan, the plan's share is posted
      on the order date as credits against the charges it covers: an insurance_allowance credit of the
      base_lenses charge minus the design's vision_plan_lens_copay_usd for that plan (nothing when the copay is
      at least the charge), and an insurance_allowance credit of the frame charge up to the plan's
      vision_plan_frame_allowance_usd. Material upgrades, coatings and options are not covered and are paid
      by the member. Each covered charge receives at most one allowance credit. Plan eligibility,
      authorization numbers and benefit frequency are confirmed by the optical counter with the plan; member
      services cannot check or override a plan's decision.
    eligibility:
      - id: one_allowance_per_charge
        applies_to: [optical_credit_posted]
        kind: dedup
        condition: Each covered charge receives at most one allowance credit.
        evidence_fields: [optical_transactions.source_txn_id, optical_transactions.credit_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_transactions.source_txn_id]
          action_bindings:
            optical_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: optical_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {credit_reason: [insurance_allowance]}
          distinct_fields: []
    params:
      per_tier:
        Northgate Single Vision Lenses: {plans: "=vision_plans_accepted", lens_copay: "=vision_plan_lens_copay_usd", frame_allowance: "=vision_plan_frame_allowance_usd"}
        Northgate Lined Bifocal Lenses: {plans: "=vision_plans_accepted", lens_copay: "=vision_plan_lens_copay_usd", frame_allowance: "=vision_plan_frame_allowance_usd"}
        Northgate Lined Trifocal Lenses: {plans: "=vision_plans_accepted", lens_copay: "=vision_plan_lens_copay_usd", frame_allowance: "=vision_plan_frame_allowance_usd"}
        Northgate Standard Progressive Lenses: {plans: "=vision_plans_accepted", lens_copay: "=vision_plan_lens_copay_usd", frame_allowance: "=vision_plan_frame_allowance_usd"}
        Northgate Premium Progressive Lenses: {plans: "=vision_plans_accepted", lens_copay: "=vision_plan_lens_copay_usd", frame_allowance: "=vision_plan_frame_allowance_usd"}
        Northgate Digital Freeform Progressive Lenses: {plans: "=vision_plans_accepted", lens_copay: "=vision_plan_lens_copay_usd", frame_allowance: "=vision_plan_frame_allowance_usd"}

  - id: optical_remake_guarantees
    subject: [optical_remake_opened, optical_lens_design_changed, optical_charge_posted, optical_credit_posted]
    rule: >
      A remake is opened only on dispensed eyewear and every remake posts a remake_charge entry carrying its
      remake_number and remake_reason — 0.00 when a guarantee covers it. A job is remade at most
      max_remakes_total times. A non_adapt remake is free only when it is requested no later than
      non_adapt_window_days calendar days after the dispensed date of the job. Days are counted as calendar
      days, the dispensed date being day 0. A job gets at most non_adapt_remakes_allowed free non_adapt
      remakes, counted by optical_msr_remakes_for_reason. Where non_adapt_switch_allowed is true the non_adapt
      remake may switch to another lens design: when the new design's base_lens_price_usd is lower the
      difference on the base_lenses charge is credited as a return_refund, and when it is higher the member
      pays the difference as the remake charge. A prescription_change remake is free only when the prescribing
      doctor changed the prescription and it is requested within rx_change_remake_window_days calendar days of
      the dispensed date, at most rx_change_remakes_allowed times. A lab_defect or frame_defect remake is free
      within lab_defect_window_months and frame_warranty_months of dispensing where lab_defect_remake_free is
      true, and a coating defect within coating_warranty_months. An accidental_damage remake is available only
      within accidental_damage_coverage_months, at most accidental_damage_replacements_allowed times, for
      accidental_damage_charge_pct of the job's frame and base_lenses charges. Any other remake, or one past
      its window or count, costs remake_charge_pct_outside_coverage of the job's base_lenses price. The
      dispensed date never moves with a remake.
    eligibility:
      - id: non_adapt_window
        applies_to: [optical_remake_opened]
        kind: time
        condition: A non_adapt remake is free only when it is requested no later than non_adapt_window_days calendar days after the dispensed date of the job.
        evidence_fields: [optical_holdings.dispensed_date, optical_holdings.optical_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_holdings.optical_order_id]
          action_bindings:
            optical_holdings.optical_order_id: optical_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the dispensed date of the job
          anchor_source: optical_holdings.dispensed_date
          relation: not_after
          duration_source: variants.non_adapt_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the dispensed date being day 0.
          boundary: inclusive
      - id: non_adapt_count
        applies_to: [optical_remake_opened]
        kind: authorization
        condition: A job gets at most non_adapt_remakes_allowed free non_adapt remakes, counted by optical_msr_remakes_for_reason.
        evidence_fields: [optical_transactions.optical_order_id, optical_transactions.remake_reason, optical_transactions.charge_component]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_transactions.optical_order_id]
          action_bindings:
            optical_transactions.optical_order_id: optical_order_id
      - id: total_remake_limit
        applies_to: [optical_remake_opened]
        kind: authorization
        condition: A job is remade at most max_remakes_total times.
        evidence_fields: [optical_holdings.remake_count, optical_holdings.optical_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_holdings.optical_order_id]
          action_bindings:
            optical_holdings.optical_order_id: optical_order_id
    measures: [optical_msr_remakes_for_reason]
    params:
      per_tier:
        Northgate Single Vision Lenses: {non_adapt_days: "=non_adapt_window_days", non_adapt_count: "=non_adapt_remakes_allowed", switch: "=non_adapt_switch_allowed", rx_change_days: "=rx_change_remake_window_days", rx_change_count: "=rx_change_remakes_allowed", lab_free: "=lab_defect_remake_free", lab_months: "=lab_defect_window_months", frame_months: "=frame_warranty_months", coating_months: "=coating_warranty_months", accident_months: "=accidental_damage_coverage_months", accident_pct: "=accidental_damage_charge_pct", accident_count: "=accidental_damage_replacements_allowed", outside_pct: "=remake_charge_pct_outside_coverage", max_total: "=max_remakes_total"}
        Northgate Lined Bifocal Lenses: {non_adapt_days: "=non_adapt_window_days", non_adapt_count: "=non_adapt_remakes_allowed", switch: "=non_adapt_switch_allowed", rx_change_days: "=rx_change_remake_window_days", rx_change_count: "=rx_change_remakes_allowed", lab_free: "=lab_defect_remake_free", lab_months: "=lab_defect_window_months", frame_months: "=frame_warranty_months", coating_months: "=coating_warranty_months", accident_months: "=accidental_damage_coverage_months", accident_pct: "=accidental_damage_charge_pct", accident_count: "=accidental_damage_replacements_allowed", outside_pct: "=remake_charge_pct_outside_coverage", max_total: "=max_remakes_total"}
        Northgate Lined Trifocal Lenses: {non_adapt_days: "=non_adapt_window_days", non_adapt_count: "=non_adapt_remakes_allowed", switch: "=non_adapt_switch_allowed", rx_change_days: "=rx_change_remake_window_days", rx_change_count: "=rx_change_remakes_allowed", lab_free: "=lab_defect_remake_free", lab_months: "=lab_defect_window_months", frame_months: "=frame_warranty_months", coating_months: "=coating_warranty_months", accident_months: "=accidental_damage_coverage_months", accident_pct: "=accidental_damage_charge_pct", accident_count: "=accidental_damage_replacements_allowed", outside_pct: "=remake_charge_pct_outside_coverage", max_total: "=max_remakes_total"}
        Northgate Standard Progressive Lenses: {non_adapt_days: "=non_adapt_window_days", non_adapt_count: "=non_adapt_remakes_allowed", switch: "=non_adapt_switch_allowed", rx_change_days: "=rx_change_remake_window_days", rx_change_count: "=rx_change_remakes_allowed", lab_free: "=lab_defect_remake_free", lab_months: "=lab_defect_window_months", frame_months: "=frame_warranty_months", coating_months: "=coating_warranty_months", accident_months: "=accidental_damage_coverage_months", accident_pct: "=accidental_damage_charge_pct", accident_count: "=accidental_damage_replacements_allowed", outside_pct: "=remake_charge_pct_outside_coverage", max_total: "=max_remakes_total"}
        Northgate Premium Progressive Lenses: {non_adapt_days: "=non_adapt_window_days", non_adapt_count: "=non_adapt_remakes_allowed", switch: "=non_adapt_switch_allowed", rx_change_days: "=rx_change_remake_window_days", rx_change_count: "=rx_change_remakes_allowed", lab_free: "=lab_defect_remake_free", lab_months: "=lab_defect_window_months", frame_months: "=frame_warranty_months", coating_months: "=coating_warranty_months", accident_months: "=accidental_damage_coverage_months", accident_pct: "=accidental_damage_charge_pct", accident_count: "=accidental_damage_replacements_allowed", outside_pct: "=remake_charge_pct_outside_coverage", max_total: "=max_remakes_total"}
        Northgate Digital Freeform Progressive Lenses: {non_adapt_days: "=non_adapt_window_days", non_adapt_count: "=non_adapt_remakes_allowed", switch: "=non_adapt_switch_allowed", rx_change_days: "=rx_change_remake_window_days", rx_change_count: "=rx_change_remakes_allowed", lab_free: "=lab_defect_remake_free", lab_months: "=lab_defect_window_months", frame_months: "=frame_warranty_months", coating_months: "=coating_warranty_months", accident_months: "=accidental_damage_coverage_months", accident_pct: "=accidental_damage_charge_pct", accident_count: "=accidental_damage_replacements_allowed", outside_pct: "=remake_charge_pct_outside_coverage", max_total: "=max_remakes_total"}
    formula:
      outside_coverage_charge: round(base_lens_price_usd * remake_charge_pct_outside_coverage / 100, 2)

  - id: optical_cancellation
    subject: [optical_order_cancelled, optical_credit_posted]
    rule: >
      A job not yet submitted to the lab is cancelled with every charge credited in full as a
      cancellation_refund where cancellation_before_lab_full_refund is true. A job cancelled while in the lab
      keeps in_lab_cancellation_retained_pct of optical_msr_original_lens_charges, because the lenses are
      already being cut to the prescription; the frame, which returns to stock, and the rest of the lens
      charges are credited. Every refund credit is posted against the exact charge it returns and never
      exceeds that charge's optical_msr_charge_net, so a vision plan allowance already credited is not
      refunded to the member a second time. Ready or dispensed eyewear is not cancelled; it is returned under
      optical_satisfaction_returns.
    eligibility: []
    measures: [optical_msr_original_lens_charges, optical_msr_charge_net]
    params:
      per_tier:
        Northgate Single Vision Lenses: {before_lab_full: "=cancellation_before_lab_full_refund", in_lab_retained_pct: "=in_lab_cancellation_retained_pct"}
        Northgate Lined Bifocal Lenses: {before_lab_full: "=cancellation_before_lab_full_refund", in_lab_retained_pct: "=in_lab_cancellation_retained_pct"}
        Northgate Lined Trifocal Lenses: {before_lab_full: "=cancellation_before_lab_full_refund", in_lab_retained_pct: "=in_lab_cancellation_retained_pct"}
        Northgate Standard Progressive Lenses: {before_lab_full: "=cancellation_before_lab_full_refund", in_lab_retained_pct: "=in_lab_cancellation_retained_pct"}
        Northgate Premium Progressive Lenses: {before_lab_full: "=cancellation_before_lab_full_refund", in_lab_retained_pct: "=in_lab_cancellation_retained_pct"}
        Northgate Digital Freeform Progressive Lenses: {before_lab_full: "=cancellation_before_lab_full_refund", in_lab_retained_pct: "=in_lab_cancellation_retained_pct"}
    formula:
      retained_lens_amount: round(optical_msr_original_lens_charges * in_lab_cancellation_retained_pct / 100, 2)

  - id: optical_satisfaction_returns
    subject: [optical_order_returned, optical_credit_posted]
    rule: >
      Dispensed eyewear may be returned for a refund. A return is accepted only when it is requested no later
      than satisfaction_return_window_days calendar days after the dispensed date of the job. Days are counted
      as calendar days, the dispensed date being day 0. A return refunds the optical_msr_charge_net of every
      lens, option and remake charge and, where return_refund_includes_frame is true, of the frame, each as a
      return_refund credit against its own charge, to the member's original tender. After the window the
      eyewear is not refundable and problems are handled only under optical_remake_guarantees.
    eligibility:
      - id: satisfaction_window
        applies_to: [optical_order_returned]
        kind: time
        condition: A return is accepted only when it is requested no later than satisfaction_return_window_days calendar days after the dispensed date of the job.
        evidence_fields: [optical_holdings.dispensed_date, optical_holdings.optical_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [optical_holdings.optical_order_id]
          action_bindings:
            optical_holdings.optical_order_id: optical_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the dispensed date of the job
          anchor_source: optical_holdings.dispensed_date
          relation: not_after
          duration_source: variants.satisfaction_return_window_days
          unit: calendar_days
          counting_rule: Days are counted as calendar days, the dispensed date being day 0.
          boundary: inclusive
    measures: [optical_msr_charge_net]
    params:
      per_tier:
        Northgate Single Vision Lenses: {window_days: "=satisfaction_return_window_days", frame_refunded: "=return_refund_includes_frame"}
        Northgate Lined Bifocal Lenses: {window_days: "=satisfaction_return_window_days", frame_refunded: "=return_refund_includes_frame"}
        Northgate Lined Trifocal Lenses: {window_days: "=satisfaction_return_window_days", frame_refunded: "=return_refund_includes_frame"}
        Northgate Standard Progressive Lenses: {window_days: "=satisfaction_return_window_days", frame_refunded: "=return_refund_includes_frame"}
        Northgate Premium Progressive Lenses: {window_days: "=satisfaction_return_window_days", frame_refunded: "=return_refund_includes_frame"}
        Northgate Digital Freeform Progressive Lenses: {window_days: "=satisfaction_return_window_days", frame_refunded: "=return_refund_includes_frame"}

  - id: optical_dispensing_care
    subject: [optical_lab_submitted, optical_ready, optical_dispensed]
    rule: >
      The optical counter submits a verified job to the lab, and the eyewear is dispensed only by an optician
      who fits it on the patient; eyewear is never shipped. Frame adjustments and nose pad replacements are free
      for the life of the eyewear where free_adjustments is true. A frame that breaks from a manufacturing
      defect within frame_warranty_months of dispensing is replaced through a frame_defect remake. Lab status
      questions are answered from the job's status; member services cannot expedite a lab.
    eligibility: []
    params:
      per_tier:
        Northgate Single Vision Lenses: {adjustments: "=free_adjustments", frame_warranty: "=frame_warranty_months"}
        Northgate Lined Bifocal Lenses: {adjustments: "=free_adjustments", frame_warranty: "=frame_warranty_months"}
        Northgate Lined Trifocal Lenses: {adjustments: "=free_adjustments", frame_warranty: "=frame_warranty_months"}
        Northgate Standard Progressive Lenses: {adjustments: "=free_adjustments", frame_warranty: "=frame_warranty_months"}
        Northgate Premium Progressive Lenses: {adjustments: "=free_adjustments", frame_warranty: "=frame_warranty_months"}
        Northgate Digital Freeform Progressive Lenses: {adjustments: "=free_adjustments", frame_warranty: "=frame_warranty_months"}

  - id: optical_reward_flag
    subject: [optical_charge_posted]
    rule: >
      An optical charge is reward_eligible only when its charge_component is in reward_eligible_components and
      the membership on the job is held at a tier with a non-zero Annual Reward rate on the charge date;
      remake charges never earn. Credits against a charge copy its flag, so allowances and refunds take back
      the reward the charge earned.
    eligibility: []
    params:
      per_tier:
        Northgate Single Vision Lenses: {earning_components: "=reward_eligible_components"}
        Northgate Lined Bifocal Lenses: {earning_components: "=reward_eligible_components"}
        Northgate Lined Trifocal Lenses: {earning_components: "=reward_eligible_components"}
        Northgate Standard Progressive Lenses: {earning_components: "=reward_eligible_components"}
        Northgate Premium Progressive Lenses: {earning_components: "=reward_eligible_components"}
        Northgate Digital Freeform Progressive Lenses: {earning_components: "=reward_eligible_components"}

# ============================================================================
# extended_policies (optical_eyewear_orders difficulty)
# ============================================================================
extended_policies:
- id: optical_ext_switch_difference_credit
  base_policy_refs:
  - optical_agg_discount_stacking
  - optical_vision_plan_billing
  - optical_remake_guarantees
  - optical_cancellation
  - optical_satisfaction_returns
  overwrite:
  - base_policy: optical_remake_guarantees
    superseded_clause: >-
      when the new design's base_lens_price_usd is lower the difference on the base_lenses charge is credited as
      a return_refund
    replaced_by: >-
      The switch-down credit is half of the switch-down price gap, less a switch-down refit fee of 15.00, never
      less than zero, rounded to the cent.
  trigger: state_due
  subject:
  - optical_credit_posted
  computes: switch_credit_usd
  target_tool: post_switch_difference_credit_2fd39c69
  params:
    sw_standard_share: 0.5
    sw_courtesy_long_pct: 10
    sw_courtesy_mid_pct: 5
    sw_tenure_long_months: 120
    sw_tenure_mid_months: 60
    sw_spend_high_usd: 2500.0
    sw_spend_mid_usd: 750.0
    sw_spend_bonus_high_usd: 5.0
    sw_spend_bonus_mid_usd: 2.5
    sw_refit_free_days: 30
    sw_refit_mid_days: 60
    sw_refit_mid_usd: 7.5
    sw_refit_standard_usd: 15.0
  rule: >
    When a non-adapt remake moves an eyewear job to a lens design whose base lens price is lower than the original
    base-lens charge, a switch-down credit is owed on the job and is posted as one refund credit against that original
    base-lens charge, returned to the member's original tender. The switch-down price gap is the original base-lens
    charge, less every credit already posted against it, minus the base lens price of the lens design the job now
    carries, and never less than zero. The switch-down credit is half of the switch-down price gap, less a switch-down
    refit fee of 15.00, never less than zero, rounded to the cent. The days a switch-down remake is counted at are
    the calendar days from the dispensed date of the job to the opening date of the latest non-adapt remake, the
    dispensed date being day 0. Where that non-adapt remake was the job's first remake and was opened no later than
    the non-adapt window of the lens design now on the job, the whole switch-down price gap is credited instead
    of half of it. Where that non-adapt remake was opened no later than that window, the window being at least one
    day long, but was not the job's first remake, the switch-down price gap is credited in proportion to the unexpired
    part of the window: the gap is multiplied by the window's days not yet used when the remake was opened and divided
    by the window's length in days. Where the membership on the job has been held for at least 120 whole months,
    the switch-down courtesy uplift is 10 percent, and where it has been held for at least 60 but fewer than 120
    whole months, the uplift is 5 percent. The member's net Northgate purchases are the sale lines of the member's
    purchases dated less than twelve whole months before the day the credit is worked out, less the return lines
    of the member's purchases dated in the same months. Where those net Northgate purchases are at least 2,500.00,
    a switch-down spend bonus of 5.00 is added, and where they are at least 750.00 but less than 2,500.00, the spend
    bonus is 2.50. Where the latest non-adapt remake was opened no more than 30 days after the dispensed date, no
    switch-down refit fee is deducted, and where it was opened 31 to 60 days after the dispensed date, the refit
    fee is 7.50. The switch-down credit is worked out in this order: the credited part of the switch-down price
    gap is first raised by the switch-down courtesy uplift percentage, the switch-down spend bonus is then added
    and the switch-down refit fee deducted, and the result is floored at zero and rounded to the cent once.
  prerequisite: []
  cross_category:
  - category: membership
    as: branch
    reads:
    - opened_date
    note: >-
      The switch-down courtesy uplift is tiered on how many whole months the membership presented on the job has
      been held.
  - category: order
    as: history
    reads:
    - order_lines.line_amount
    note: >-
      The switch-down spend bonus is tiered on the member's net Northgate purchases over the last twelve months.
  compute:
  - sw_base_charge: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='base_lenses',
      remake_number=0)
  - sw_base_credits: >-
      SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='base_lenses')
  - sw_gap: MX(0, sw_base_charge - sw_base_credits - P('base_lens_price_usd'))
  - sw_switch_date: >-
      LATEST('optical_transactions', 'event_date', event_type='optical_charge_posted', charge_component='remake_charge',
      remake_reason='non_adapt')
  - sw_switch_number: >-
      LATEST('optical_transactions', 'remake_number', event_type='optical_charge_posted', charge_component='remake_charge',
      remake_reason='non_adapt')
  - sw_days_worn: DAYS(F('dispensed_date'), sw_switch_date)
  - sw_gap_credited: >-
      sw_gap if (sw_switch_number == 1 and sw_days_worn <= P('non_adapt_window_days')) else (sw_gap * (P('non_adapt_window_days')
      - sw_days_worn) / P('non_adapt_window_days') if (sw_days_worn <= P('non_adapt_window_days') and P('non_adapt_window_days')
      > 0) else sw_gap * K('sw_standard_share'))
  - sw_tenure_months: MONTHS(CFIELD('membership', 'opened_date', membership_id=F('membership_id')), NOW)
  - sw_courtesy_pct: >-
      K('sw_courtesy_long_pct') if sw_tenure_months >= K('sw_tenure_long_months') else (K('sw_courtesy_mid_pct')
      if sw_tenure_months >= K('sw_tenure_mid_months') else 0)
  - sw_spend_sales: >-
      XSUM('order', 'order_lines', 'line_amount', within_months=12, date_field='event_date', event_type='order_line_sold')
  - sw_spend_returns: >-
      XSUM('order', 'order_lines', 'line_amount', within_months=12, date_field='event_date', event_type='order_line_returned')
  - sw_spend_bonus: >-
      K('sw_spend_bonus_high_usd') if sw_spend_sales - sw_spend_returns >= K('sw_spend_high_usd') else (K('sw_spend_bonus_mid_usd')
      if sw_spend_sales - sw_spend_returns >= K('sw_spend_mid_usd') else 0)
  - sw_refit_days: >-
      DAYS(F('dispensed_date'), LATEST('optical_transactions', 'event_date', event_type='optical_charge_posted',
      charge_component='remake_charge', remake_reason='non_adapt'))
  - sw_refit_fee: >-
      0 if sw_refit_days <= K('sw_refit_free_days') else (K('sw_refit_mid_usd') if sw_refit_days <= K('sw_refit_mid_days')
      else K('sw_refit_standard_usd'))
  - result: >-
      RND(MX(0, sw_gap_credited * (1 + sw_courtesy_pct / 100) + sw_spend_bonus - sw_refit_fee), 2)
  compute_basis:
    sw_base_charge: >-
      The switch-down price gap is the original base-lens charge, less every credit already posted against it, minus
      the base lens price of the lens design the job now carries, and never less than zero.
    sw_base_credits: >-
      The switch-down price gap is the original base-lens charge, less every credit already posted against it, minus
      the base lens price of the lens design the job now carries, and never less than zero.
    sw_gap: >-
      The switch-down price gap is the original base-lens charge, less every credit already posted against it, minus
      the base lens price of the lens design the job now carries, and never less than zero.
    sw_switch_date: >-
      The days a switch-down remake is counted at are the calendar days from the dispensed date of the job to the
      opening date of the latest non-adapt remake, the dispensed date being day 0.
    sw_switch_number: >-
      Where that non-adapt remake was the job's first remake and was opened no later than the non-adapt window of
      the lens design now on the job, the whole switch-down price gap is credited instead of half of it.
    sw_days_worn: >-
      The days a switch-down remake is counted at are the calendar days from the dispensed date of the job to the
      opening date of the latest non-adapt remake, the dispensed date being day 0.
    sw_gap_credited: >-
      Where that non-adapt remake was the job's first remake and was opened no later than the non-adapt window of
      the lens design now on the job, the whole switch-down price gap is credited instead of half of it. Where that
      non-adapt remake was opened no later than that window, the window being at least one day long, but was not
      the job's first remake, the switch-down price gap is credited in proportion to the unexpired part of the window:
      the gap is multiplied by the window's days not yet used when the remake was opened and divided by the window's
      length in days. The switch-down credit is half of the switch-down price gap, less a switch-down refit fee
      of 15.00, never less than zero, rounded to the cent.
    sw_tenure_months: >-
      Where the membership on the job has been held for at least 120 whole months, the switch-down courtesy uplift
      is 10 percent, and where it has been held for at least 60 but fewer than 120 whole months, the uplift is 5
      percent.
    sw_courtesy_pct: >-
      Where the membership on the job has been held for at least 120 whole months, the switch-down courtesy uplift
      is 10 percent, and where it has been held for at least 60 but fewer than 120 whole months, the uplift is 5
      percent.
    sw_spend_sales: >-
      The member's net Northgate purchases are the sale lines of the member's purchases dated less than twelve whole
      months before the day the credit is worked out, less the return lines of the member's purchases dated in the
      same months.
    sw_spend_returns: >-
      The member's net Northgate purchases are the sale lines of the member's purchases dated less than twelve whole
      months before the day the credit is worked out, less the return lines of the member's purchases dated in the
      same months.
    sw_spend_bonus: >-
      Where those net Northgate purchases are at least 2,500.00, a switch-down spend bonus of 5.00 is added, and
      where they are at least 750.00 but less than 2,500.00, the spend bonus is 2.50.
    sw_refit_days: >-
      Where the latest non-adapt remake was opened no more than 30 days after the dispensed date, no switch-down
      refit fee is deducted, and where it was opened 31 to 60 days after the dispensed date, the refit fee is 7.50.
    sw_refit_fee: >-
      Where the latest non-adapt remake was opened no more than 30 days after the dispensed date, no switch-down
      refit fee is deducted, and where it was opened 31 to 60 days after the dispensed date, the refit fee is 7.50.
    result: >-
      The switch-down credit is worked out in this order: the credited part of the switch-down price gap is first
      raised by the switch-down courtesy uplift percentage, the switch-down spend bonus is then added and the switch-down
      refit fee deducted, and the result is floored at zero and rounded to the cent once.
  factors:
  - id: switch_gap_credit_method
    effect: method
    decides: sw_gap_credited
    bindings:
    - sw_switch_number
    - sw_days_worn
    - sw_gap_credited
    ladder:
    - when: >-
        the latest non-adapt remake was the job's first remake and was opened no later than the non-adapt window
        of the lens design now on the job
      method: the whole switch-down price gap is credited
    - when: >-
        the latest non-adapt remake was opened no later than that window, the window being at least one day long,
        but was not the job's first remake
      method: >-
        the gap is multiplied by the window's days not yet used when the remake was opened and divided by the window's
        length in days
    - when: otherwise
      method: half of the switch-down price gap is credited
    baseline:
      sw_gap_credited: sw_gap * K('sw_standard_share')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: switch_courtesy_uplift
    effect: parameter
    decides: sw_courtesy_pct
    bindings:
    - sw_tenure_months
    - sw_courtesy_pct
    ladder:
    - when: the membership on the job has been held for at least 120 whole months
      value: K('sw_courtesy_long_pct')
    - when: the membership has been held for at least 60 but fewer than 120 whole months
      value: K('sw_courtesy_mid_pct')
    - when: otherwise
      value: '0'
    baseline:
      sw_courtesy_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: membership
  - id: switch_spend_bonus
    effect: parameter
    decides: sw_spend_bonus
    bindings:
    - sw_spend_sales
    - sw_spend_returns
    - sw_spend_bonus
    ladder:
    - when: the member's net Northgate purchases over the last twelve months are at least 2,500.00
      value: K('sw_spend_bonus_high_usd')
    - when: they are at least 750.00 but less than 2,500.00
      value: K('sw_spend_bonus_mid_usd')
    - when: otherwise
      value: '0'
    baseline:
      sw_spend_bonus: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: order
  - id: switch_refit_fee
    effect: parameter
    decides: sw_refit_fee
    bindings:
    - sw_refit_days
    - sw_refit_fee
    ladder:
    - when: the latest non-adapt remake was opened no more than 30 days after the dispensed date
      value: '0'
    - when: it was opened 31 to 60 days after the dispensed date
      value: K('sw_refit_mid_usd')
    - when: otherwise
      value: K('sw_refit_standard_usd')
    baseline:
      sw_refit_fee: K('sw_refit_standard_usd')
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The switch-down price gap is the original base-lens charge, less every credit already posted against it, minus
      the base lens price of the lens design the job now carries, and never less than zero. The switch-down credit
      is half of the switch-down price gap, less a switch-down refit fee of 15.00, never less than zero, rounded
      to the cent.
    params:
    - sw_standard_share
    - sw_refit_standard_usd
    - base_lens_price_usd
  inputs:
    history:
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: base_lenses
        remake_number: 0
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_credit_posted
        charge_component: base_lenses
    - table: optical_transactions
      aggregate: latest
      field: event_date
      filters:
        event_type: optical_charge_posted
        charge_component: remake_charge
        remake_reason: non_adapt
    - category: order
      table: order_lines
      aggregate: sum
      field: line_amount
      within_months: 12
      filters:
        event_type: order_line_sold
    - category: order
      table: order_lines
      aggregate: sum
      field: line_amount
      within_months: 12
      filters:
        event_type: order_line_returned
    cross_category:
    - membership
    - order
- id: optical_ext_late_rx_remake_waiver
  base_policy_refs:
  - optical_agg_discount_stacking
  - optical_vision_plan_billing
  - optical_remake_guarantees
  - optical_cancellation
  - optical_satisfaction_returns
  overwrite:
  - base_policy: optical_remake_guarantees
    superseded_clause: >-
      Any other remake, or one past its window or count, costs remake_charge_pct_outside_coverage of the job's base_lenses
      price.
    replaced_by: >-
      A prescription-change remake past its window costs the outside-coverage remake percentage of the lens design
      the job carries, applied to that design's base lens price, plus a lab handling fee of 9.95, rounded to the
      cent.
  - base_policy: optical_remake_guarantees
    superseded_clause: >-
      A prescription_change remake is free only when the prescribing doctor changed the prescription and it is requested
      within rx_change_remake_window_days calendar days of the dispensed date, at most rx_change_remakes_allowed
      times.
    replaced_by: >-
      Where the latest non-adapt remake on the job was opened before the prescription-change remake, the window
      start is the opening date of that latest non-adapt remake. Where the job carries no non-adapt remake, or its
      latest non-adapt remake was not opened before the prescription-change remake, and the job's prescription was
      issued more than 12 whole months before the prescription-change remake was opened, the window start is the
      prescription's issue date.
  trigger: state_due
  subject:
  - optical_credit_posted
  computes: waived_amount_usd
  target_tool: waive_remake_overcharge_01693abf
  params:
    rx_old_prescription_months: 12
    rx_share_near_pct: 20
    rx_share_mid_pct: 30
    rx_near_days: 30
    rx_mid_days: 90
    rx_impact_material_share: 0.5
    rx_loyal_long_pct: 15
    rx_loyal_mid_pct: 10
    rx_loyal_long_months: 120
    rx_loyal_mid_months: 60
    rx_fresh_near_pct: 10
    rx_fresh_mid_pct: 5
    rx_fresh_near_months: 3
    rx_fresh_mid_months: 9
    rx_handling_one_usd: 4.95
    rx_handling_standard_usd: 9.95
  rule: >
    A prescription-change remake opened after its free window is charged the late prescription-change remake charge,
    and where the remake charge booked for that remake, less every waiver already posted against it, is higher than
    that charge, the difference is owed back to the member and is posted as one waiver credit against that remake
    charge. The days past the window are the calendar days from the window start to the opening date of the prescription-change
    remake, the window start being day 0, less the prescription-change remake window of the lens design the job
    carries. The window start is the dispensed date of the job. A prescription-change remake that is not past its
    window costs nothing. A prescription-change remake past its window costs the outside-coverage remake percentage
    of the lens design the job carries, applied to that design's base lens price, plus a lab handling fee of 9.95,
    rounded to the cent. The waiver is the booked remake charge, less every waiver already posted against it, less
    the late prescription-change remake charge, never less than zero, rounded to the cent. Where the latest non-adapt
    remake on the job was opened before the prescription-change remake, the window start is the opening date of
    that latest non-adapt remake. Where the job carries no non-adapt remake, or its latest non-adapt remake was
    not opened before the prescription-change remake, and the job's prescription was issued more than 12 whole months
    before the prescription-change remake was opened, the window start is the prescription's issue date. A prescription-change
    remake no more than 30 days past its window costs 20 percent of the base lens price instead of the outside-coverage
    remake percentage, and one 31 to 90 days past its window costs 30 percent. Where the job's lens material is
    a 1.60, 1.67 or 1.74 high index material and a material upgrade charge stands on the original job, net of credits
    against it, the late prescription-change remake charge also re-bills that whole net material upgrade charge;
    where the material is polycarbonate or Trivex and such a charge stands, it re-bills half of that net material
    upgrade charge. Where the membership on the job has been held for at least 120 whole months and a Northgate
    credit card account linked to that membership is active, the late prescription-change loyalty reduction is 15
    percent; where it has been held for at least 60 but fewer than 120 whole months and such a card account is active,
    the reduction is 10 percent. Where the job's prescription was issued no more than 3 whole months before the
    job was ordered, the fresh-prescription reduction is 10 percent, and where it was issued 4 to 9 whole months
    before the job was ordered, it is 5 percent. Where the job carries two or more remakes besides the prescription-change
    remake, no lab handling fee is charged, and where it carries exactly one, the lab handling fee is 4.95. The
    late prescription-change remake charge is worked out in this order: the late percentage of the base lens price
    is taken first and any re-billed material amount is added to it; that sum is reduced once by the late prescription-change
    loyalty reduction and the fresh-prescription reduction combined into one percentage, the two never applied one
    after the other; the lab handling fee is then added; and the result is floored at zero and rounded to the cent
    once.
  prerequisite: []
  cross_category:
  - category: membership
    as: branch
    reads:
    - opened_date
    note: >-
      The late prescription-change loyalty reduction is tiered on how many whole months the membership on the job
      has been held.
  - category: card
    as: branch
    reads:
    - status
    note: >-
      The same reduction requires an active Northgate credit card account linked to that membership.
  compute:
  - rx_remake_date: >-
      LATEST('optical_transactions', 'event_date', event_type='optical_charge_posted', charge_component='remake_charge',
      remake_reason='prescription_change')
  - rx_booked: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='remake_charge',
      remake_reason='prescription_change')
  - rx_waived_before: >-
      SUM('optical_transactions', 'amount', event_type='optical_credit_posted', credit_reason='remake_charge_waived',
      remake_reason='prescription_change')
  - rx_na_count: >-
      COUNT('optical_transactions', event_type='optical_charge_posted', charge_component='remake_charge', remake_reason='non_adapt')
  - rx_na_date: >-
      LATEST('optical_transactions', 'event_date', event_type='optical_charge_posted', charge_component='remake_charge',
      remake_reason='non_adapt')
  - rx_prescription_age_at_remake: MONTHS(F('rx_issue_date'), rx_remake_date)
  - rx_window_start: >-
      rx_na_date if (rx_na_count > 0 and rx_na_date < rx_remake_date) else (F('rx_issue_date') if (not (rx_na_count
      > 0 and rx_na_date < rx_remake_date) and rx_prescription_age_at_remake > K('rx_old_prescription_months'))
      else F('dispensed_date'))
  - rx_days_past: DAYS(rx_window_start, rx_remake_date) - P('rx_change_remake_window_days')
  - rx_late_share: >-
      0 if rx_days_past <= 0 else (K('rx_share_near_pct') if rx_days_past <= K('rx_near_days') else (K('rx_share_mid_pct')
      if rx_days_past <= K('rx_mid_days') else P('remake_charge_pct_outside_coverage')))
  - rx_material_net: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='material_upgrade',
      remake_number=0) - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='material_upgrade')
  - rx_material_rebill: >-
      rx_material_net if ((F('lens_material') == 'high_index_160' or F('lens_material') == 'high_index_167' or F('lens_material')
      == 'high_index_174') and rx_material_net > 0) else (rx_material_net * K('rx_impact_material_share') if ((F('lens_material')
      == 'polycarbonate' or F('lens_material') == 'trivex') and rx_material_net > 0) else 0)
  - rx_member_months: MONTHS(CFIELD('membership', 'opened_date', membership_id=F('membership_id')), NOW)
  - rx_card_status: CFIELD('card', 'status', linked_membership_id=F('membership_id'))
  - rx_loyal_pct: >-
      K('rx_loyal_long_pct') if (rx_member_months >= K('rx_loyal_long_months') and rx_card_status == 'active') else
      (K('rx_loyal_mid_pct') if (rx_member_months >= K('rx_loyal_mid_months') and rx_member_months < K('rx_loyal_long_months')
      and rx_card_status == 'active') else 0)
  - rx_prescription_age_at_order: MONTHS(F('rx_issue_date'), F('order_date'))
  - rx_fresh_pct: >-
      K('rx_fresh_near_pct') if rx_prescription_age_at_order <= K('rx_fresh_near_months') else (K('rx_fresh_mid_pct')
      if rx_prescription_age_at_order <= K('rx_fresh_mid_months') else 0)
  - rx_other_remakes: >-
      COUNT('optical_transactions', event_type='optical_charge_posted', charge_component='remake_charge') - COUNT('optical_transactions',
      event_type='optical_charge_posted', charge_component='remake_charge', remake_reason='prescription_change')
  - rx_handling_fee: >-
      0 if rx_other_remakes >= 2 else (K('rx_handling_one_usd') if rx_other_remakes == 1 else K('rx_handling_standard_usd'))
  - rx_late_charge: >-
      0 if rx_late_share == 0 else RND(MX(0, (P('base_lens_price_usd') * rx_late_share / 100 + rx_material_rebill)
      * (1 - (rx_loyal_pct + rx_fresh_pct) / 100) + rx_handling_fee), 2)
  - result: RND(MX(0, rx_booked - rx_waived_before - rx_late_charge), 2)
  compute_basis:
    rx_remake_date: >-
      The days past the window are the calendar days from the window start to the opening date of the prescription-change
      remake, the window start being day 0, less the prescription-change remake window of the lens design the job
      carries.
    rx_booked: >-
      The waiver is the booked remake charge, less every waiver already posted against it, less the late prescription-change
      remake charge, never less than zero, rounded to the cent.
    rx_waived_before: >-
      The waiver is the booked remake charge, less every waiver already posted against it, less the late prescription-change
      remake charge, never less than zero, rounded to the cent.
    rx_na_count: >-
      Where the latest non-adapt remake on the job was opened before the prescription-change remake, the window
      start is the opening date of that latest non-adapt remake.
    rx_na_date: >-
      Where the latest non-adapt remake on the job was opened before the prescription-change remake, the window
      start is the opening date of that latest non-adapt remake.
    rx_prescription_age_at_remake: >-
      Where the job carries no non-adapt remake, or its latest non-adapt remake was not opened before the prescription-change
      remake, and the job's prescription was issued more than 12 whole months before the prescription-change remake
      was opened, the window start is the prescription's issue date.
    rx_window_start: >-
      The window start is the dispensed date of the job. Where the latest non-adapt remake on the job was opened
      before the prescription-change remake, the window start is the opening date of that latest non-adapt remake.
      Where the job carries no non-adapt remake, or its latest non-adapt remake was not opened before the prescription-change
      remake, and the job's prescription was issued more than 12 whole months before the prescription-change remake
      was opened, the window start is the prescription's issue date.
    rx_days_past: >-
      The days past the window are the calendar days from the window start to the opening date of the prescription-change
      remake, the window start being day 0, less the prescription-change remake window of the lens design the job
      carries.
    rx_late_share: >-
      A prescription-change remake that is not past its window costs nothing. A prescription-change remake past
      its window costs the outside-coverage remake percentage of the lens design the job carries, applied to that
      design's base lens price, plus a lab handling fee of 9.95, rounded to the cent. A prescription-change remake
      no more than 30 days past its window costs 20 percent of the base lens price instead of the outside-coverage
      remake percentage, and one 31 to 90 days past its window costs 30 percent.
    rx_material_net: >-
      Where the job's lens material is a 1.60, 1.67 or 1.74 high index material and a material upgrade charge stands
      on the original job, net of credits against it, the late prescription-change remake charge also re-bills that
      whole net material upgrade charge; where the material is polycarbonate or Trivex and such a charge stands,
      it re-bills half of that net material upgrade charge.
    rx_material_rebill: >-
      Where the job's lens material is a 1.60, 1.67 or 1.74 high index material and a material upgrade charge stands
      on the original job, net of credits against it, the late prescription-change remake charge also re-bills that
      whole net material upgrade charge; where the material is polycarbonate or Trivex and such a charge stands,
      it re-bills half of that net material upgrade charge.
    rx_member_months: >-
      Where the membership on the job has been held for at least 120 whole months and a Northgate credit card account
      linked to that membership is active, the late prescription-change loyalty reduction is 15 percent; where it
      has been held for at least 60 but fewer than 120 whole months and such a card account is active, the reduction
      is 10 percent.
    rx_card_status: >-
      Where the membership on the job has been held for at least 120 whole months and a Northgate credit card account
      linked to that membership is active, the late prescription-change loyalty reduction is 15 percent; where it
      has been held for at least 60 but fewer than 120 whole months and such a card account is active, the reduction
      is 10 percent.
    rx_loyal_pct: >-
      Where the membership on the job has been held for at least 120 whole months and a Northgate credit card account
      linked to that membership is active, the late prescription-change loyalty reduction is 15 percent; where it
      has been held for at least 60 but fewer than 120 whole months and such a card account is active, the reduction
      is 10 percent.
    rx_prescription_age_at_order: >-
      Where the job's prescription was issued no more than 3 whole months before the job was ordered, the fresh-prescription
      reduction is 10 percent, and where it was issued 4 to 9 whole months before the job was ordered, it is 5 percent.
    rx_fresh_pct: >-
      Where the job's prescription was issued no more than 3 whole months before the job was ordered, the fresh-prescription
      reduction is 10 percent, and where it was issued 4 to 9 whole months before the job was ordered, it is 5 percent.
    rx_other_remakes: >-
      Where the job carries two or more remakes besides the prescription-change remake, no lab handling fee is charged,
      and where it carries exactly one, the lab handling fee is 4.95.
    rx_handling_fee: >-
      Where the job carries two or more remakes besides the prescription-change remake, no lab handling fee is charged,
      and where it carries exactly one, the lab handling fee is 4.95.
    rx_late_charge: >-
      The late prescription-change remake charge is worked out in this order: the late percentage of the base lens
      price is taken first and any re-billed material amount is added to it; that sum is reduced once by the late
      prescription-change loyalty reduction and the fresh-prescription reduction combined into one percentage, the
      two never applied one after the other; the lab handling fee is then added; and the result is floored at zero
      and rounded to the cent once.
    result: >-
      The waiver is the booked remake charge, less every waiver already posted against it, less the late prescription-change
      remake charge, never less than zero, rounded to the cent.
  factors:
  - id: rx_window_start_anchor
    effect: method
    decides: rx_window_start
    bindings:
    - rx_na_count
    - rx_na_date
    - rx_prescription_age_at_remake
    - rx_window_start
    ladder:
    - when: the latest non-adapt remake on the job was opened before the prescription-change remake
      method: the window start is the opening date of that latest non-adapt remake
    - when: >-
        the job carries no non-adapt remake, or its latest non-adapt remake was not opened before the prescription-change
        remake, and the job's prescription was issued more than 12 whole months before the prescription-change remake
        was opened
      method: the window start is the prescription's issue date
    - when: otherwise
      method: the window start is the dispensed date of the job
    baseline:
      rx_window_start: F('dispensed_date')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: rx_late_share_ladder
    effect: parameter
    decides: rx_late_share
    bindings:
    - rx_days_past
    - rx_late_share
    ladder:
    - when: the remake is not past its window
      value: '0'
    - when: no more than 30 days past its window
      value: K('rx_share_near_pct')
    - when: 31 to 90 days past its window
      value: K('rx_share_mid_pct')
    - when: >-
        otherwise (more than 90 days past): the outside-coverage remake percentage of the lens design
      value: P('remake_charge_pct_outside_coverage')
    baseline:
      rx_late_share: 0 if rx_days_past <= 0 else P('remake_charge_pct_outside_coverage')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: rx_material_rebill_share
    effect: parameter
    decides: rx_material_rebill
    bindings:
    - rx_material_net
    - rx_material_rebill
    ladder:
    - when: the lens material is a high index material and a net material upgrade charge stands
      value: the whole net material upgrade charge
    - when: the lens material is polycarbonate or Trivex and a net material upgrade charge stands
      value: half of the net material upgrade charge (K('rx_impact_material_share'))
    - when: otherwise
      value: '0'
    baseline:
      rx_material_rebill: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: rx_loyalty_reduction
    effect: parameter
    decides: rx_loyal_pct
    bindings:
    - rx_member_months
    - rx_card_status
    - rx_loyal_pct
    ladder:
    - when: >-
        the membership on the job has been held for at least 120 whole months and a linked Northgate credit card
        account is active
      value: K('rx_loyal_long_pct')
    - when: >-
        it has been held for at least 60 but fewer than 120 whole months and a linked Northgate credit card account
        is active
      value: K('rx_loyal_mid_pct')
    - when: otherwise
      value: '0'
    baseline:
      rx_loyal_pct: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: membership
  - id: rx_fresh_prescription_reduction
    effect: parameter
    decides: rx_fresh_pct
    bindings:
    - rx_prescription_age_at_order
    - rx_fresh_pct
    ladder:
    - when: the prescription was issued no more than 3 whole months before the job was ordered
      value: K('rx_fresh_near_pct')
    - when: it was issued 4 to 9 whole months before the job was ordered
      value: K('rx_fresh_mid_pct')
    - when: otherwise
      value: '0'
    baseline:
      rx_fresh_pct: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: rx_lab_handling_fee
    effect: parameter
    decides: rx_handling_fee
    bindings:
    - rx_other_remakes
    - rx_handling_fee
    ladder:
    - when: the job carries two or more remakes besides the prescription-change remake
      value: '0'
    - when: it carries exactly one other remake
      value: K('rx_handling_one_usd')
    - when: otherwise
      value: K('rx_handling_standard_usd')
    baseline:
      rx_handling_fee: K('rx_handling_standard_usd')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The days past the window are the calendar days from the window start to the opening date of the prescription-change
      remake, the window start being day 0, less the prescription-change remake window of the lens design the job
      carries. The window start is the dispensed date of the job. A prescription-change remake that is not past
      its window costs nothing. A prescription-change remake past its window costs the outside-coverage remake percentage
      of the lens design the job carries, applied to that design's base lens price, plus a lab handling fee of 9.95,
      rounded to the cent. The waiver is the booked remake charge, less every waiver already posted against it,
      less the late prescription-change remake charge, never less than zero, rounded to the cent.
    params:
    - rx_handling_standard_usd
    - remake_charge_pct_outside_coverage
    - rx_change_remake_window_days
    - base_lens_price_usd
  inputs:
    history:
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: remake_charge
        remake_reason: prescription_change
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_credit_posted
        credit_reason: remake_charge_waived
        remake_reason: prescription_change
    - table: optical_transactions
      aggregate: latest
      field: event_date
      filters:
        event_type: optical_charge_posted
        charge_component: remake_charge
        remake_reason: non_adapt
    - table: optical_transactions
      aggregate: count
      field: optical_txn_id
      filters:
        event_type: optical_charge_posted
        charge_component: remake_charge
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: material_upgrade
        remake_number: 0
    cross_category:
    - membership
    - card
- id: optical_ext_accidental_replacement_charge
  base_policy_refs:
  - optical_agg_discount_stacking
  - optical_job_pricing
  - optical_remake_guarantees
  - optical_reward_flag
  overwrite:
  - base_policy: optical_remake_guarantees
    superseded_clause: for accidental_damage_charge_pct of the job's frame and base_lenses charges
    replaced_by: >-
      The accidental replacement charge is 30 percent of the replacement basis, plus a replacement fitting fee of
      15.00, rounded to the cent.
  trigger: on_request
  subject:
  - optical_charge_posted
  computes: replacement_charge_usd
  target_tool: authorize_damage_replacement_0a7f54ae
  params:
    rd_pct_recent: 20
    rd_pct_middle: 25
    rd_recent_months: 6
    rd_middle_months: 9
    rd_history_high_usd: 50.0
    rd_history_mid_usd: 25.0
    rd_history_high_points: 10
    rd_history_mid_points: 5
    rd_card_high_usd: 2000.0
    rd_card_mid_usd: 750.0
    rd_card_high_pct: 10
    rd_card_mid_pct: 5
    rd_surcharge_high_index_usd: 25.0
    rd_surcharge_impact_usd: 10.0
    rd_fitting_one_usd: 7.5
    rd_fitting_standard_usd: 15.0
  rule: >
    Eyewear damaged by accident is replaced only within the accidental damage coverage months of the lens design
    counted from the dispensed date, and no more often than the design's allowed number of accidental damage replacements;
    the member authorizes the replacement and its accidental replacement charge, which is booked as the remake charge
    of the replacement. The replacement basis is the original frame charge and the original base-lens charge of
    the job, each less every credit already posted against it. The accidental replacement charge is 30 percent of
    the replacement basis, plus a replacement fitting fee of 15.00, rounded to the cent. The replacement percentage
    is set from the whole months between the replacement clock start and the day the replacement is authorized,
    and the replacement clock start is the dispensed date of the job. Where a prescription-change remake stands
    on the job, the replacement clock start is the opening date of the latest prescription-change remake; where
    none stands but a non-adapt remake stands, the replacement clock start is the opening date of the latest non-adapt
    remake. Where no more than 6 whole months have passed since the replacement clock start, the replacement percentage
    is 20 percent instead of 30 percent, and where 7 to 9 whole months have passed, it is 25 percent. Where the
    remake charges booked on the job, less every waiver posted against them, total at least 50.00, the replacement
    percentage is lowered by 10 percentage points, and where they total at least 25.00 but less than 50.00, it is
    lowered by 5 percentage points. The member's Northgate card spend is the Northgate qualifying spend on which
    the member's Northgate credit card earned card rewards, in statement entries dated less than twelve whole months
    before the day the replacement is authorized. Where that Northgate card spend is at least 2,000.00, the accidental
    replacement charge is reduced by 10 percent, and where it is at least 750.00 but less than 2,000.00, it is reduced
    by 5 percent. Where the job's lens material is a 1.60, 1.67 or 1.74 high index material and a material upgrade
    charge stands on the original job, net of credits against it, a replacement material surcharge of 25.00 is added;
    where the material is polycarbonate or Trivex and such a charge stands, the replacement material surcharge is
    10.00. Where the job already carries two or more remakes, no replacement fitting fee is charged, and where it
    carries exactly one, the replacement fitting fee is 7.50. The accidental replacement charge is worked out in
    this order: the replacement basis is first multiplied by the replacement percentage after any lowering, never
    below zero percent; that amount is then reduced by the card spend reduction; the replacement material surcharge
    and the replacement fitting fee are then added; and the result is rounded to the cent once. The accidental replacement
    charge is fixed only after the original base-lens charge carries the switch-down credit owed for any lower-priced
    lens design the job has been remade in. The accidental replacement charge is not fixed until each prescription-change
    remake charge on the job, less any waiver posted against it, stands no higher than the late prescription-change
    remake charge it is owed at.
  prerequisite:
  - problem: optical_ext_switch_difference_credit
    kind: value_input
    gate: rd_lens_net
    form: state
    policy_source: >-
      The accidental replacement charge is fixed only after the original base-lens charge carries the switch-down
      credit owed for any lower-priced lens design the job has been remade in.
    condition: >-
      The job's original base-lens charge carries a refund credit for the switch-down credit owed after a non-adapt
      remake moved the job to a lens design priced below that charge.
    resolved_by: post_switch_difference_credit_2fd39c69
    effect: >-
      Once the switch-down credit stands against the original base-lens charge, the net base-lens charge inside
      the replacement basis falls by the amount credited, and the accidental replacement charge is worked out on
      that lower basis.
  - problem: optical_ext_late_rx_remake_waiver
    kind: value_input
    gate: rd_paid_remakes
    form: state
    policy_source: >-
      The accidental replacement charge is not fixed until each prescription-change remake charge on the job, less
      any waiver posted against it, stands no higher than the late prescription-change remake charge it is owed
      at.
    condition: >-
      Every prescription-change remake charge on the job, net of the waiver credits posted against it, is no higher
      than the late prescription-change remake charge that remake is owed at.
    resolved_by: waive_remake_overcharge_01693abf
    effect: >-
      Once the waiver credit stands against the overbooked prescription-change remake charge, the net remake charges
      booked on the job fall, which can move the job to a different lowering of the replacement percentage.
  cross_category:
  - category: card
    as: history
    reads:
    - card_transactions.qualifying_spend
    note: >-
      The card spend reduction is tiered on the Northgate qualifying spend the member's card earned rewards on over
      the last twelve months.
  compute:
  - rd_frame_net: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='frame', remake_number=0)
      - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='frame')
  - rd_lens_net: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='base_lenses',
      remake_number=0) - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='base_lenses')
  - rd_basis: rd_frame_net + rd_lens_net
  - rd_rx_count: >-
      COUNT('optical_transactions', event_type='optical_charge_posted', charge_component='remake_charge', remake_reason='prescription_change')
  - rd_na_count: >-
      COUNT('optical_transactions', event_type='optical_charge_posted', charge_component='remake_charge', remake_reason='non_adapt')
  - rd_clock_start: >-
      LATEST('optical_transactions', 'event_date', event_type='optical_charge_posted', charge_component='remake_charge',
      remake_reason='prescription_change') if rd_rx_count > 0 else (LATEST('optical_transactions', 'event_date',
      event_type='optical_charge_posted', charge_component='remake_charge', remake_reason='non_adapt') if rd_na_count
      > 0 else F('dispensed_date'))
  - rd_months_on_clock: MONTHS(rd_clock_start, NOW)
  - rd_pct: >-
      K('rd_pct_recent') if rd_months_on_clock <= K('rd_recent_months') else (K('rd_pct_middle') if rd_months_on_clock
      <= K('rd_middle_months') else P('accidental_damage_charge_pct'))
  - rd_paid_remakes: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='remake_charge')
      - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', credit_reason='remake_charge_waived')
  - rd_history_points: >-
      K('rd_history_high_points') if rd_paid_remakes >= K('rd_history_high_usd') else (K('rd_history_mid_points')
      if rd_paid_remakes >= K('rd_history_mid_usd') else 0)
  - rd_card_spend: >-
      XSUM('card', 'card_transactions', 'qualifying_spend', within_months=12, date_field='transaction_date', event_type='card_rewards_earned',
      spend_category='northgate_purchases')
  - rd_card_pct: >-
      K('rd_card_high_pct') if rd_card_spend >= K('rd_card_high_usd') else (K('rd_card_mid_pct') if rd_card_spend
      >= K('rd_card_mid_usd') else 0)
  - rd_material_net: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='material_upgrade',
      remake_number=0) - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='material_upgrade')
  - rd_material_surcharge: >-
      K('rd_surcharge_high_index_usd') if ((F('lens_material') == 'high_index_160' or F('lens_material') == 'high_index_167'
      or F('lens_material') == 'high_index_174') and rd_material_net > 0) else (K('rd_surcharge_impact_usd') if
      ((F('lens_material') == 'polycarbonate' or F('lens_material') == 'trivex') and rd_material_net > 0) else 0)
  - rd_remakes_on_job: >-
      COUNT('optical_transactions', event_type='optical_charge_posted', charge_component='remake_charge')
  - rd_fitting_fee: >-
      0 if rd_remakes_on_job >= 2 else (K('rd_fitting_one_usd') if rd_remakes_on_job == 1 else K('rd_fitting_standard_usd'))
  - result: >-
      RND(rd_basis * MX(0, rd_pct - rd_history_points) / 100 * (1 - rd_card_pct / 100) + rd_material_surcharge +
      rd_fitting_fee, 2)
  compute_basis:
    rd_frame_net: >-
      The replacement basis is the original frame charge and the original base-lens charge of the job, each less
      every credit already posted against it.
    rd_lens_net: >-
      The replacement basis is the original frame charge and the original base-lens charge of the job, each less
      every credit already posted against it.
    rd_basis: >-
      The replacement basis is the original frame charge and the original base-lens charge of the job, each less
      every credit already posted against it.
    rd_rx_count: >-
      Where a prescription-change remake stands on the job, the replacement clock start is the opening date of the
      latest prescription-change remake; where none stands but a non-adapt remake stands, the replacement clock
      start is the opening date of the latest non-adapt remake.
    rd_na_count: >-
      Where a prescription-change remake stands on the job, the replacement clock start is the opening date of the
      latest prescription-change remake; where none stands but a non-adapt remake stands, the replacement clock
      start is the opening date of the latest non-adapt remake.
    rd_clock_start: >-
      The replacement percentage is set from the whole months between the replacement clock start and the day the
      replacement is authorized, and the replacement clock start is the dispensed date of the job. Where a prescription-change
      remake stands on the job, the replacement clock start is the opening date of the latest prescription-change
      remake; where none stands but a non-adapt remake stands, the replacement clock start is the opening date of
      the latest non-adapt remake.
    rd_months_on_clock: >-
      The replacement percentage is set from the whole months between the replacement clock start and the day the
      replacement is authorized, and the replacement clock start is the dispensed date of the job.
    rd_pct: >-
      The accidental replacement charge is 30 percent of the replacement basis, plus a replacement fitting fee of
      15.00, rounded to the cent. Where no more than 6 whole months have passed since the replacement clock start,
      the replacement percentage is 20 percent instead of 30 percent, and where 7 to 9 whole months have passed,
      it is 25 percent.
    rd_paid_remakes: >-
      Where the remake charges booked on the job, less every waiver posted against them, total at least 50.00, the
      replacement percentage is lowered by 10 percentage points, and where they total at least 25.00 but less than
      50.00, it is lowered by 5 percentage points.
    rd_history_points: >-
      Where the remake charges booked on the job, less every waiver posted against them, total at least 50.00, the
      replacement percentage is lowered by 10 percentage points, and where they total at least 25.00 but less than
      50.00, it is lowered by 5 percentage points.
    rd_card_spend: >-
      The member's Northgate card spend is the Northgate qualifying spend on which the member's Northgate credit
      card earned card rewards, in statement entries dated less than twelve whole months before the day the replacement
      is authorized.
    rd_card_pct: >-
      Where that Northgate card spend is at least 2,000.00, the accidental replacement charge is reduced by 10 percent,
      and where it is at least 750.00 but less than 2,000.00, it is reduced by 5 percent.
    rd_material_net: >-
      Where the job's lens material is a 1.60, 1.67 or 1.74 high index material and a material upgrade charge stands
      on the original job, net of credits against it, a replacement material surcharge of 25.00 is added; where
      the material is polycarbonate or Trivex and such a charge stands, the replacement material surcharge is 10.00.
    rd_material_surcharge: >-
      Where the job's lens material is a 1.60, 1.67 or 1.74 high index material and a material upgrade charge stands
      on the original job, net of credits against it, a replacement material surcharge of 25.00 is added; where
      the material is polycarbonate or Trivex and such a charge stands, the replacement material surcharge is 10.00.
    rd_remakes_on_job: >-
      Where the job already carries two or more remakes, no replacement fitting fee is charged, and where it carries
      exactly one, the replacement fitting fee is 7.50.
    rd_fitting_fee: >-
      Where the job already carries two or more remakes, no replacement fitting fee is charged, and where it carries
      exactly one, the replacement fitting fee is 7.50.
    result: >-
      The accidental replacement charge is worked out in this order: the replacement basis is first multiplied by
      the replacement percentage after any lowering, never below zero percent; that amount is then reduced by the
      card spend reduction; the replacement material surcharge and the replacement fitting fee are then added; and
      the result is rounded to the cent once.
  factors:
  - id: replacement_clock_anchor
    effect: method
    decides: rd_clock_start
    bindings:
    - rd_rx_count
    - rd_na_count
    - rd_clock_start
    ladder:
    - when: a prescription-change remake stands on the job
      method: the replacement clock starts at the opening date of the latest prescription-change remake
    - when: no prescription-change remake stands but a non-adapt remake stands
      method: the replacement clock starts at the opening date of the latest non-adapt remake
    - when: otherwise
      method: the replacement clock starts at the dispensed date of the job
    baseline:
      rd_clock_start: F('dispensed_date')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: replacement_percentage_ladder
    effect: parameter
    decides: rd_pct
    bindings:
    - rd_months_on_clock
    - rd_pct
    ladder:
    - when: no more than 6 whole months have passed since the replacement clock start
      value: K('rd_pct_recent')
    - when: 7 to 9 whole months have passed
      value: K('rd_pct_middle')
    - when: otherwise
      value: P('accidental_damage_charge_pct')
    baseline:
      rd_pct: P('accidental_damage_charge_pct')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: replacement_remake_history_lowering
    effect: parameter
    decides: rd_history_points
    bindings:
    - rd_paid_remakes
    - rd_history_points
    ladder:
    - when: the remake charges booked on the job, net of waivers, total at least 50.00
      value: K('rd_history_high_points')
    - when: they total at least 25.00 but less than 50.00
      value: K('rd_history_mid_points')
    - when: otherwise
      value: '0'
    baseline:
      rd_history_points: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: replacement_card_spend_reduction
    effect: parameter
    decides: rd_card_pct
    bindings:
    - rd_card_spend
    - rd_card_pct
    ladder:
    - when: the member's Northgate card spend over the last twelve months is at least 2,000.00
      value: K('rd_card_high_pct')
    - when: it is at least 750.00 but less than 2,000.00
      value: K('rd_card_mid_pct')
    - when: otherwise
      value: '0'
    baseline:
      rd_card_pct: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: replacement_material_surcharge
    effect: parameter
    decides: rd_material_surcharge
    bindings:
    - rd_material_net
    - rd_material_surcharge
    ladder:
    - when: the lens material is a high index material and a net material upgrade charge stands
      value: K('rd_surcharge_high_index_usd')
    - when: the lens material is polycarbonate or Trivex and a net material upgrade charge stands
      value: K('rd_surcharge_impact_usd')
    - when: otherwise
      value: '0'
    baseline:
      rd_material_surcharge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: replacement_fitting_fee
    effect: parameter
    decides: rd_fitting_fee
    bindings:
    - rd_remakes_on_job
    - rd_fitting_fee
    ladder:
    - when: the job already carries two or more remakes
      value: '0'
    - when: it carries exactly one remake
      value: K('rd_fitting_one_usd')
    - when: otherwise
      value: K('rd_fitting_standard_usd')
    baseline:
      rd_fitting_fee: K('rd_fitting_standard_usd')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The replacement basis is the original frame charge and the original base-lens charge of the job, each less
      every credit already posted against it. The accidental replacement charge is 30 percent of the replacement
      basis, plus a replacement fitting fee of 15.00, rounded to the cent. The replacement percentage is set from
      the whole months between the replacement clock start and the day the replacement is authorized, and the replacement
      clock start is the dispensed date of the job.
    params:
    - accidental_damage_charge_pct
    - rd_fitting_standard_usd
  inputs:
    history:
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: frame
        remake_number: 0
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: base_lenses
        remake_number: 0
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_credit_posted
        charge_component: base_lenses
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: remake_charge
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_credit_posted
        credit_reason: remake_charge_waived
    - category: card
      table: card_transactions
      aggregate: sum
      field: qualifying_spend
      within_months: 12
      filters:
        event_type: card_rewards_earned
        spend_category: northgate_purchases
    cross_category:
    - card
- id: optical_ext_frame_return_refund
  base_policy_refs:
  - optical_cancellation
  - optical_agg_discount_stacking
  - optical_vision_plan_billing
  - optical_remake_guarantees
  - optical_satisfaction_returns
  overwrite:
  - base_policy: optical_cancellation
    superseded_clause: the frame, which returns to stock, and the rest of the lens charges are credited
    replaced_by: >-
      The frame return refund is the frame charge less every credit already posted against it, refunded in full.
  trigger: on_request
  subject:
  - optical_credit_posted
  computes: frame_refund_usd
  target_tool: refund_frame_to_stock_fae456d1
  params:
    fr_designer_min_usd: 150.0
    fr_mid_min_usd: 75.0
    fr_flat_restock_usd: 12.0
    fr_pct_early: 5
    fr_pct_mid: 10
    fr_pct_standard: 15
    fr_early_days: 3
    fr_mid_days: 14
    fr_ship_both_usd: 6.0
    fr_ship_one_usd: 3.0
    fr_courtesy_long_usd: 5.0
    fr_courtesy_mid_usd: 2.5
    fr_long_months: 60
    fr_mid_months: 24
  rule: >
    In an in-lab cancellation the frame goes back to stock, and its frame return refund is booked as one refund
    credit against the frame charge, returned to the original tender. The frame return refund is the frame charge
    less every credit already posted against it, refunded in full. Where the frame charge is 150.00 or more, a frame
    restocking deduction of the frame restocking percentage of that net frame charge is kept; where the frame charge
    is at least 75.00 but less than 150.00, a flat frame restocking deduction of 12.00 is kept. The frame restocking
    percentage is 5 percent when the job is cancelled no more than 3 calendar days after its order date, 10 percent
    when it is cancelled 4 to 14 calendar days after it, and 15 percent when it is cancelled later. Where both a
    lens material upgrade charge and a lens option charge (a light-adaptive, blue-light filtering or anti-reflective
    coating charge) were posted on the job, the frame has travelled to the lab with special lenses and a lab shipping
    handling amount of 6.00 is kept; where exactly one of the two was posted, the lab shipping handling amount is
    3.00. Where the membership on the job has been held for at least 60 whole months, a frame courtesy of 5.00 is
    given back out of the amounts kept, and where it has been held for at least 24 but fewer than 60 whole months,
    the frame courtesy is 2.50. The frame return refund is worked out in this order: the frame restocking deduction
    and the lab shipping handling amount are added together and the frame courtesy is taken off that sum, never
    below zero; that amount is kept out of the net frame charge; the result is floored at zero and rounded to the
    cent once.
  prerequisite: []
  cross_category:
  - category: membership
    as: branch
    reads:
    - opened_date
    note: >-
      The frame courtesy is tiered on how many whole months the membership presented on the job has been held.
  compute:
  - fr_frame_net: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='frame', remake_number=0)
      - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='frame')
  - fr_frame_charge: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='frame', remake_number=0)
  - fr_days: DAYS(F('order_date'), NOW)
  - fr_restock_pct: >-
      K('fr_pct_early') if fr_days <= K('fr_early_days') else (K('fr_pct_mid') if fr_days <= K('fr_mid_days') else
      K('fr_pct_standard'))
  - fr_restock: >-
      fr_frame_net * fr_restock_pct / 100 if fr_frame_charge >= K('fr_designer_min_usd') else (K('fr_flat_restock_usd')
      if fr_frame_charge >= K('fr_mid_min_usd') else 0)
  - fr_material_count: >-
      COUNT('optical_transactions', event_type='optical_charge_posted', charge_component='material_upgrade')
  - fr_option_count: >-
      COUNT('optical_transactions', event_type='optical_charge_posted', charge_component='photochromic') + COUNT('optical_transactions',
      event_type='optical_charge_posted', charge_component='blue_light_filter') + COUNT('optical_transactions',
      event_type='optical_charge_posted', charge_component='anti_reflective_coating')
  - fr_ship: >-
      K('fr_ship_both_usd') if (fr_material_count > 0 and fr_option_count > 0) else (K('fr_ship_one_usd') if (fr_material_count
      > 0 or fr_option_count > 0) else 0)
  - fr_member_months: MONTHS(CFIELD('membership', 'opened_date', membership_id=F('membership_id')), NOW)
  - fr_courtesy: >-
      K('fr_courtesy_long_usd') if fr_member_months >= K('fr_long_months') else (K('fr_courtesy_mid_usd') if fr_member_months
      >= K('fr_mid_months') else 0)
  - result: RND(MX(0, fr_frame_net - MX(0, fr_restock + fr_ship - fr_courtesy)), 2)
  compute_basis:
    fr_frame_net: >-
      The frame return refund is the frame charge less every credit already posted against it, refunded in full.
    fr_frame_charge: >-
      Where the frame charge is 150.00 or more, a frame restocking deduction of the frame restocking percentage
      of that net frame charge is kept; where the frame charge is at least 75.00 but less than 150.00, a flat frame
      restocking deduction of 12.00 is kept.
    fr_days: >-
      The frame restocking percentage is 5 percent when the job is cancelled no more than 3 calendar days after
      its order date, 10 percent when it is cancelled 4 to 14 calendar days after it, and 15 percent when it is
      cancelled later.
    fr_restock_pct: >-
      The frame restocking percentage is 5 percent when the job is cancelled no more than 3 calendar days after
      its order date, 10 percent when it is cancelled 4 to 14 calendar days after it, and 15 percent when it is
      cancelled later.
    fr_restock: >-
      Where the frame charge is 150.00 or more, a frame restocking deduction of the frame restocking percentage
      of that net frame charge is kept; where the frame charge is at least 75.00 but less than 150.00, a flat frame
      restocking deduction of 12.00 is kept.
    fr_material_count: >-
      Where both a lens material upgrade charge and a lens option charge (a light-adaptive, blue-light filtering
      or anti-reflective coating charge) were posted on the job, the frame has travelled to the lab with special
      lenses and a lab shipping handling amount of 6.00 is kept; where exactly one of the two was posted, the lab
      shipping handling amount is 3.00.
    fr_option_count: >-
      Where both a lens material upgrade charge and a lens option charge (a light-adaptive, blue-light filtering
      or anti-reflective coating charge) were posted on the job, the frame has travelled to the lab with special
      lenses and a lab shipping handling amount of 6.00 is kept; where exactly one of the two was posted, the lab
      shipping handling amount is 3.00.
    fr_ship: >-
      Where both a lens material upgrade charge and a lens option charge (a light-adaptive, blue-light filtering
      or anti-reflective coating charge) were posted on the job, the frame has travelled to the lab with special
      lenses and a lab shipping handling amount of 6.00 is kept; where exactly one of the two was posted, the lab
      shipping handling amount is 3.00.
    fr_member_months: >-
      Where the membership on the job has been held for at least 60 whole months, a frame courtesy of 5.00 is given
      back out of the amounts kept, and where it has been held for at least 24 but fewer than 60 whole months, the
      frame courtesy is 2.50.
    fr_courtesy: >-
      Where the membership on the job has been held for at least 60 whole months, a frame courtesy of 5.00 is given
      back out of the amounts kept, and where it has been held for at least 24 but fewer than 60 whole months, the
      frame courtesy is 2.50.
    result: >-
      The frame return refund is worked out in this order: the frame restocking deduction and the lab shipping handling
      amount are added together and the frame courtesy is taken off that sum, never below zero; that amount is kept
      out of the net frame charge; the result is floored at zero and rounded to the cent once.
  factors:
  - id: frame_restocking_method
    effect: method
    decides: fr_restock
    bindings:
    - fr_frame_charge
    - fr_restock
    ladder:
    - when: the frame charge is 150.00 or more
      method: a percentage of the net frame charge is kept, at the frame restocking percentage
    - when: the frame charge is at least 75.00 but less than 150.00
      method: a flat 12.00 is kept
    - when: otherwise
      method: nothing is kept; the net frame charge is refunded in full
    baseline:
      fr_restock: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: frame_restocking_percentage
    effect: parameter
    decides: fr_restock_pct
    bindings:
    - fr_days
    - fr_restock_pct
    ladder:
    - when: the job is cancelled no more than 3 calendar days after its order date
      value: K('fr_pct_early')
    - when: it is cancelled 4 to 14 calendar days after its order date
      value: K('fr_pct_mid')
    - when: otherwise
      value: K('fr_pct_standard')
    baseline:
      fr_restock_pct: K('fr_pct_standard')
    evidence:
    - date
    cross_difficulty: null
  - id: frame_lab_shipping_handling
    effect: parameter
    decides: fr_ship
    bindings:
    - fr_material_count
    - fr_option_count
    - fr_ship
    ladder:
    - when: a lens material upgrade charge and a lens option charge were both posted on the job
      value: K('fr_ship_both_usd')
    - when: exactly one of the two was posted
      value: K('fr_ship_one_usd')
    - when: otherwise
      value: '0'
    baseline:
      fr_ship: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: frame_courtesy
    effect: parameter
    decides: fr_courtesy
    bindings:
    - fr_member_months
    - fr_courtesy
    ladder:
    - when: the membership on the job has been held for at least 60 whole months
      value: K('fr_courtesy_long_usd')
    - when: it has been held for at least 24 but fewer than 60 whole months
      value: K('fr_courtesy_mid_usd')
    - when: otherwise
      value: '0'
    baseline:
      fr_courtesy: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: membership
  baseline:
    rule: >-
      The frame return refund is the frame charge less every credit already posted against it, refunded in full.
    params: []
  inputs:
    history:
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: frame
        remake_number: 0
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_credit_posted
        charge_component: frame
    - table: optical_transactions
      aggregate: count
      field: optical_txn_id
      filters:
        event_type: optical_charge_posted
        charge_component: material_upgrade
    - table: optical_transactions
      aggregate: count
      field: optical_txn_id
      filters:
        event_type: optical_charge_posted
        charge_component: photochromic
    cross_category:
    - membership
- id: optical_ext_option_cancellation_refund
  base_policy_refs:
  - optical_cancellation
  - optical_agg_discount_stacking
  - optical_vision_plan_billing
  - optical_remake_guarantees
  - optical_satisfaction_returns
  overwrite:
  - base_policy: optical_cancellation
    superseded_clause: and the rest of the lens charges are credited
    replaced_by: >-
      The option cancellation refund of the option being refunded in an in-lab cancellation is that option charge
      less every credit already posted against it, refunded in full, less an option handling fee of 6.00, never
      less than zero, rounded to the cent.
  trigger: on_request
  subject:
  - optical_credit_posted
  computes: option_refund_usd
  target_tool: refund_lens_option_d067b0d2
  params:
    op_window_special_days: 21
    op_window_impact_days: 18
    op_window_standard_days: 14
    op_blue_light_fee_usd: 12.0
    op_card_high_usd: 1500.0
    op_card_mid_usd: 500.0
    op_card_high_pct: 10
    op_card_mid_pct: 5
    op_fee_free_days: 3
    op_fee_mid_days: 14
    op_fee_mid_usd: 3.0
    op_fee_standard_usd: 6.0
  rule: >
    In an in-lab cancellation, each light-adaptive, blue-light filtering or anti-reflective option charge of the
    job is refunded on its own, as one refund credit against that option charge returned to the original tender.
    The option charges are settled one at a time in a fixed order: the option being refunded is the first of the
    light-adaptive, the blue-light filtering and the anti-reflective option charge that carries no cancellation
    refund yet. The option cancellation refund of the option being refunded in an in-lab cancellation is that option
    charge less every credit already posted against it, refunded in full, less an option handling fee of 6.00, never
    less than zero, rounded to the cent. A light-adaptive option is applied during the lab's option window, so its
    net charge is refunded in proportion to the part of the window not yet used: the net charge is multiplied by
    the window's days not yet used and divided by the window's length in days, the days used being the calendar
    days from the date the light-adaptive charge was posted to the day the refund is worked out, and never more
    than the window. A blue-light filtering option is refunded at its net charge less a filter coating cost of 12.00,
    never less than zero. The option window is 21 days when the job was ordered with a Trivex or high index material
    upgrade charge, 18 days when it was ordered with a polycarbonate material upgrade charge, and 14 days otherwise.
    The member's Northgate card spend for options is the Northgate qualifying spend on which the member's Northgate
    credit card earned card rewards, in statement entries dated less than twelve whole months before the day the
    refund is worked out. Where that card spend for options is at least 1,500.00, an option card courtesy of 10
    percent of the net option charge is added to the refund, and where it is at least 500.00 but less than 1,500.00,
    the option card courtesy is 5 percent. The option handling fee is waived when the job is cancelled no more than
    3 calendar days after its order date and is 3.00 when it is cancelled 4 to 14 calendar days after it. The option
    cancellation refund is worked out in this order: the refundable part of the net option charge is taken first,
    the option card courtesy is then added and the option handling fee deducted, and the result is floored at zero
    and rounded to the cent once.
  prerequisite: []
  cross_category:
  - category: card
    as: history
    reads:
    - card_transactions.qualifying_spend
    note: >-
      The option card courtesy is tiered on the Northgate qualifying spend the member's card earned rewards on over
      the last twelve months.
  compute:
  - op_pc_net: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='photochromic')
      - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='photochromic')
  - op_bl_net: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='blue_light_filter')
      - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='blue_light_filter')
  - op_ar_net: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='anti_reflective_coating')
      - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='anti_reflective_coating')
  - op_pc_refunds: >-
      COUNT('optical_transactions', event_type='optical_credit_posted', charge_component='photochromic', credit_reason='cancellation_refund')
  - op_pc_open: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='photochromic')
      > 0 and op_pc_refunds == 0
  - op_bl_refunds: >-
      COUNT('optical_transactions', event_type='optical_credit_posted', charge_component='blue_light_filter', credit_reason='cancellation_refund')
  - op_bl_open: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='blue_light_filter')
      > 0 and op_bl_refunds == 0
  - op_option_net: op_pc_net if op_pc_open else (op_bl_net if op_bl_open else op_ar_net)
  - op_pc_days: >-
      DAYS(LATEST('optical_transactions', 'event_date', event_type='optical_charge_posted', charge_component='photochromic'),
      NOW) if op_pc_open else 0
  - op_special_material: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='material_upgrade',
      remake_number=0)
  - op_window: >-
      K('op_window_special_days') if ((F('lens_material') == 'trivex' or F('lens_material') == 'high_index_160'
      or F('lens_material') == 'high_index_167' or F('lens_material') == 'high_index_174') and op_special_material
      > 0) else (K('op_window_impact_days') if (F('lens_material') == 'polycarbonate' and op_special_material >
      0) else K('op_window_standard_days'))
  - op_refundable: >-
      op_pc_net * MX(0, op_window - MN(op_window, op_pc_days)) / op_window if op_pc_open else (MX(0, op_bl_net -
      K('op_blue_light_fee_usd')) if op_bl_open else op_option_net)
  - op_card_spend: >-
      XSUM('card', 'card_transactions', 'qualifying_spend', within_months=12, date_field='transaction_date', event_type='card_rewards_earned',
      spend_category='northgate_purchases')
  - op_card_pct: >-
      K('op_card_high_pct') if op_card_spend >= K('op_card_high_usd') else (K('op_card_mid_pct') if op_card_spend
      >= K('op_card_mid_usd') else 0)
  - op_fee_days: DAYS(F('order_date'), NOW)
  - op_fee: >-
      0 if op_fee_days <= K('op_fee_free_days') else (K('op_fee_mid_usd') if op_fee_days <= K('op_fee_mid_days')
      else K('op_fee_standard_usd'))
  - result: RND(MX(0, op_refundable + op_option_net * op_card_pct / 100 - op_fee), 2)
  compute_basis:
    op_pc_net: >-
      The option cancellation refund of the option being refunded in an in-lab cancellation is that option charge
      less every credit already posted against it, refunded in full, less an option handling fee of 6.00, never
      less than zero, rounded to the cent.
    op_bl_net: >-
      A blue-light filtering option is refunded at its net charge less a filter coating cost of 12.00, never less
      than zero.
    op_ar_net: >-
      The option cancellation refund of the option being refunded in an in-lab cancellation is that option charge
      less every credit already posted against it, refunded in full, less an option handling fee of 6.00, never
      less than zero, rounded to the cent.
    op_pc_refunds: >-
      The option charges are settled one at a time in a fixed order: the option being refunded is the first of the
      light-adaptive, the blue-light filtering and the anti-reflective option charge that carries no cancellation
      refund yet.
    op_pc_open: >-
      The option charges are settled one at a time in a fixed order: the option being refunded is the first of the
      light-adaptive, the blue-light filtering and the anti-reflective option charge that carries no cancellation
      refund yet.
    op_bl_refunds: >-
      The option charges are settled one at a time in a fixed order: the option being refunded is the first of the
      light-adaptive, the blue-light filtering and the anti-reflective option charge that carries no cancellation
      refund yet.
    op_bl_open: >-
      The option charges are settled one at a time in a fixed order: the option being refunded is the first of the
      light-adaptive, the blue-light filtering and the anti-reflective option charge that carries no cancellation
      refund yet.
    op_option_net: >-
      The option charges are settled one at a time in a fixed order: the option being refunded is the first of the
      light-adaptive, the blue-light filtering and the anti-reflective option charge that carries no cancellation
      refund yet.
    op_pc_days: >-
      A light-adaptive option is applied during the lab's option window, so its net charge is refunded in proportion
      to the part of the window not yet used: the net charge is multiplied by the window's days not yet used and
      divided by the window's length in days, the days used being the calendar days from the date the light-adaptive
      charge was posted to the day the refund is worked out, and never more than the window.
    op_special_material: >-
      The option window is 21 days when the job was ordered with a Trivex or high index material upgrade charge,
      18 days when it was ordered with a polycarbonate material upgrade charge, and 14 days otherwise.
    op_window: >-
      The option window is 21 days when the job was ordered with a Trivex or high index material upgrade charge,
      18 days when it was ordered with a polycarbonate material upgrade charge, and 14 days otherwise.
    op_refundable: >-
      The option charges are settled one at a time in a fixed order: the option being refunded is the first of the
      light-adaptive, the blue-light filtering and the anti-reflective option charge that carries no cancellation
      refund yet. A light-adaptive option is applied during the lab's option window, so its net charge is refunded
      in proportion to the part of the window not yet used: the net charge is multiplied by the window's days not
      yet used and divided by the window's length in days, the days used being the calendar days from the date the
      light-adaptive charge was posted to the day the refund is worked out, and never more than the window. A blue-light
      filtering option is refunded at its net charge less a filter coating cost of 12.00, never less than zero.
    op_card_spend: >-
      The member's Northgate card spend for options is the Northgate qualifying spend on which the member's Northgate
      credit card earned card rewards, in statement entries dated less than twelve whole months before the day the
      refund is worked out.
    op_card_pct: >-
      Where that card spend for options is at least 1,500.00, an option card courtesy of 10 percent of the net option
      charge is added to the refund, and where it is at least 500.00 but less than 1,500.00, the option card courtesy
      is 5 percent.
    op_fee_days: >-
      The option handling fee is waived when the job is cancelled no more than 3 calendar days after its order date
      and is 3.00 when it is cancelled 4 to 14 calendar days after it.
    op_fee: >-
      The option handling fee is waived when the job is cancelled no more than 3 calendar days after its order date
      and is 3.00 when it is cancelled 4 to 14 calendar days after it.
    result: >-
      The option cancellation refund is worked out in this order: the refundable part of the net option charge is
      taken first, the option card courtesy is then added and the option handling fee deducted, and the result is
      floored at zero and rounded to the cent once.
  factors:
  - id: option_refund_method
    effect: method
    decides: op_refundable
    bindings:
    - op_pc_refunds
    - op_pc_open
    - op_refundable
    ladder:
    - when: the option being refunded is the light-adaptive option
      method: >-
        the net option charge is multiplied by the option window's unused days and divided by the window's length
    - when: the option being refunded is the blue-light filtering option
      method: the net option charge less the 12.00 filter coating cost, never below zero
    - when: otherwise (the anti-reflective option)
      method: the net option charge is refunded in full
    baseline:
      op_refundable: op_option_net
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: option_window_length
    effect: parameter
    decides: op_window
    bindings:
    - op_special_material
    - op_window
    ladder:
    - when: the job was ordered with a Trivex or high index material upgrade charge
      value: K('op_window_special_days')
    - when: it was ordered with a polycarbonate material upgrade charge
      value: K('op_window_impact_days')
    - when: otherwise
      value: K('op_window_standard_days')
    baseline:
      op_window: K('op_window_standard_days')
    evidence:
    - history
    cross_difficulty: null
  - id: option_card_courtesy
    effect: parameter
    decides: op_card_pct
    bindings:
    - op_card_spend
    - op_card_pct
    ladder:
    - when: >-
        the member's Northgate card spend for options over the last twelve months is at least 1,500.00
      value: K('op_card_high_pct')
    - when: it is at least 500.00 but less than 1,500.00
      value: K('op_card_mid_pct')
    - when: otherwise
      value: '0'
    baseline:
      op_card_pct: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: option_handling_fee
    effect: parameter
    decides: op_fee
    bindings:
    - op_fee_days
    - op_fee
    ladder:
    - when: the job is cancelled no more than 3 calendar days after its order date
      value: '0'
    - when: it is cancelled 4 to 14 calendar days after its order date
      value: K('op_fee_mid_usd')
    - when: otherwise
      value: K('op_fee_standard_usd')
    baseline:
      op_fee: K('op_fee_standard_usd')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The option cancellation refund of the option being refunded in an in-lab cancellation is that option charge
      less every credit already posted against it, refunded in full, less an option handling fee of 6.00, never
      less than zero, rounded to the cent.
    params:
    - op_fee_standard_usd
  inputs:
    history:
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: photochromic
    - table: optical_transactions
      aggregate: latest
      field: event_date
      filters:
        event_type: optical_charge_posted
        charge_component: photochromic
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: material_upgrade
        remake_number: 0
    - category: card
      table: card_transactions
      aggregate: sum
      field: qualifying_spend
      within_months: 12
      filters:
        event_type: card_rewards_earned
        spend_category: northgate_purchases
    - table: optical_transactions
      aggregate: count
      field: optical_txn_id
      filters:
        event_type: optical_credit_posted
        charge_component: photochromic
        credit_reason: cancellation_refund
    cross_category:
    - card
- id: optical_ext_material_cancellation_refund
  base_policy_refs:
  - optical_cancellation
  - optical_agg_discount_stacking
  - optical_vision_plan_billing
  - optical_remake_guarantees
  - optical_satisfaction_returns
  overwrite:
  - base_policy: optical_cancellation
    superseded_clause: and the rest of the lens charges are credited
    replaced_by: >-
      The material cancellation refund in an in-lab cancellation is 60 percent of the material upgrade charge less
      every credit already posted against it, rounded to the cent.
  trigger: on_request
  subject:
  - optical_credit_posted
  computes: material_refund_usd
  target_tool: refund_lens_material_ad7f47c2
  params:
    mt_high_index_share: 0.5
    mt_share_early_pct: 100
    mt_share_mid_pct: 80
    mt_share_standard_pct: 60
    mt_early_days: 3
    mt_mid_days: 14
    mt_spend_high_usd: 3000.0
    mt_spend_mid_usd: 1000.0
    mt_bonus_high_usd: 5.0
    mt_bonus_mid_usd: 2.5
    mt_treated_light_usd: 5.0
    mt_treated_blue_usd: 2.5
  rule: >
    In an in-lab cancellation, the lens material upgrade charge of the job is refunded as one refund credit against
    that charge, returned to the original tender. The material cancellation refund in an in-lab cancellation is
    60 percent of the material upgrade charge less every credit already posted against it, rounded to the cent.
    The refundable material amount is the net material upgrade charge in full. Where the material is polycarbonate
    or Trivex, the lab keeps the cost of a standard impact blank, so the refundable material amount is the net material
    upgrade charge less the polycarbonate upgrade price of the job's lens design, never less than zero; where the
    material is a 1.60, 1.67 or 1.74 high index material, the refundable material amount is half of the net material
    upgrade charge. The material refund share is 100 percent when the job is cancelled no more than 3 calendar days
    after its order date and 80 percent when it is cancelled 4 to 14 calendar days after it. The member's net Northgate
    purchases for materials are the sale lines of the member's purchases dated less than twelve whole months before
    the day the refund is worked out, less the return lines of the member's purchases dated in the same months.
    Where those net Northgate purchases for materials are at least 3,000.00, a material spend bonus of 5.00 is added,
    and where they are at least 1,000.00 but less than 3,000.00, the material spend bonus is 2.50. Where a light-adaptive
    option charge was posted on the job, the blanks have been treated and a treated-blank deduction of 5.00 is kept;
    where no light-adaptive charge but a blue-light filtering charge was posted, the treated-blank deduction is
    2.50. The material cancellation refund is worked out in this order: the refundable material amount is first
    multiplied by the material refund share, the material spend bonus is then added and the treated-blank deduction
    taken off, and the result is floored at zero and rounded to the cent once.
  prerequisite: []
  cross_category:
  - category: order
    as: history
    reads:
    - order_lines.line_amount
    note: >-
      The material spend bonus is tiered on the member's net Northgate purchases over the last twelve months.
  compute:
  - mt_net: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='material_upgrade',
      remake_number=0) - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='material_upgrade')
  - mt_charge_posted: >-
      COUNT('optical_transactions', event_type='optical_charge_posted', charge_component='material_upgrade')
  - mt_refundable: >-
      MX(0, mt_net - P('polycarbonate_upgrade_usd')) if ((F('lens_material') == 'polycarbonate' or F('lens_material')
      == 'trivex') and mt_charge_posted > 0) else (mt_net * K('mt_high_index_share') if ((F('lens_material') ==
      'high_index_160' or F('lens_material') == 'high_index_167' or F('lens_material') == 'high_index_174') and
      mt_charge_posted > 0) else mt_net)
  - mt_days: DAYS(F('order_date'), NOW)
  - mt_share: >-
      K('mt_share_early_pct') if mt_days <= K('mt_early_days') else (K('mt_share_mid_pct') if mt_days <= K('mt_mid_days')
      else K('mt_share_standard_pct'))
  - mt_sales: >-
      XSUM('order', 'order_lines', 'line_amount', within_months=12, date_field='event_date', event_type='order_line_sold')
  - mt_returns: >-
      XSUM('order', 'order_lines', 'line_amount', within_months=12, date_field='event_date', event_type='order_line_returned')
  - mt_spend_bonus: >-
      K('mt_bonus_high_usd') if mt_sales - mt_returns >= K('mt_spend_high_usd') else (K('mt_bonus_mid_usd') if mt_sales
      - mt_returns >= K('mt_spend_mid_usd') else 0)
  - mt_light_count: >-
      COUNT('optical_transactions', event_type='optical_charge_posted', charge_component='photochromic')
  - mt_blue_count: >-
      COUNT('optical_transactions', event_type='optical_charge_posted', charge_component='blue_light_filter')
  - mt_treated: >-
      K('mt_treated_light_usd') if mt_light_count > 0 else (K('mt_treated_blue_usd') if mt_blue_count > 0 else 0)
  - result: RND(MX(0, mt_refundable * mt_share / 100 + mt_spend_bonus - mt_treated), 2)
  compute_basis:
    mt_net: >-
      The material cancellation refund in an in-lab cancellation is 60 percent of the material upgrade charge less
      every credit already posted against it, rounded to the cent.
    mt_charge_posted: >-
      Where the material is polycarbonate or Trivex, the lab keeps the cost of a standard impact blank, so the refundable
      material amount is the net material upgrade charge less the polycarbonate upgrade price of the job's lens
      design, never less than zero; where the material is a 1.60, 1.67 or 1.74 high index material, the refundable
      material amount is half of the net material upgrade charge.
    mt_refundable: >-
      The refundable material amount is the net material upgrade charge in full. Where the material is polycarbonate
      or Trivex, the lab keeps the cost of a standard impact blank, so the refundable material amount is the net
      material upgrade charge less the polycarbonate upgrade price of the job's lens design, never less than zero;
      where the material is a 1.60, 1.67 or 1.74 high index material, the refundable material amount is half of
      the net material upgrade charge.
    mt_days: >-
      The material refund share is 100 percent when the job is cancelled no more than 3 calendar days after its
      order date and 80 percent when it is cancelled 4 to 14 calendar days after it.
    mt_share: >-
      The material cancellation refund in an in-lab cancellation is 60 percent of the material upgrade charge less
      every credit already posted against it, rounded to the cent. The material refund share is 100 percent when
      the job is cancelled no more than 3 calendar days after its order date and 80 percent when it is cancelled
      4 to 14 calendar days after it.
    mt_sales: >-
      The member's net Northgate purchases for materials are the sale lines of the member's purchases dated less
      than twelve whole months before the day the refund is worked out, less the return lines of the member's purchases
      dated in the same months.
    mt_returns: >-
      The member's net Northgate purchases for materials are the sale lines of the member's purchases dated less
      than twelve whole months before the day the refund is worked out, less the return lines of the member's purchases
      dated in the same months.
    mt_spend_bonus: >-
      Where those net Northgate purchases for materials are at least 3,000.00, a material spend bonus of 5.00 is
      added, and where they are at least 1,000.00 but less than 3,000.00, the material spend bonus is 2.50.
    mt_light_count: >-
      Where a light-adaptive option charge was posted on the job, the blanks have been treated and a treated-blank
      deduction of 5.00 is kept; where no light-adaptive charge but a blue-light filtering charge was posted, the
      treated-blank deduction is 2.50.
    mt_blue_count: >-
      Where a light-adaptive option charge was posted on the job, the blanks have been treated and a treated-blank
      deduction of 5.00 is kept; where no light-adaptive charge but a blue-light filtering charge was posted, the
      treated-blank deduction is 2.50.
    mt_treated: >-
      Where a light-adaptive option charge was posted on the job, the blanks have been treated and a treated-blank
      deduction of 5.00 is kept; where no light-adaptive charge but a blue-light filtering charge was posted, the
      treated-blank deduction is 2.50.
    result: >-
      The material cancellation refund is worked out in this order: the refundable material amount is first multiplied
      by the material refund share, the material spend bonus is then added and the treated-blank deduction taken
      off, and the result is floored at zero and rounded to the cent once.
  factors:
  - id: material_refundable_method
    effect: method
    decides: mt_refundable
    bindings:
    - mt_charge_posted
    - mt_refundable
    ladder:
    - when: the material is polycarbonate or Trivex
      method: >-
        the net material upgrade charge less the polycarbonate upgrade price of the job's lens design, never below
        zero
    - when: the material is a 1.60, 1.67 or 1.74 high index material
      method: half of the net material upgrade charge
    - when: otherwise
      method: the net material upgrade charge in full
    baseline:
      mt_refundable: mt_net
    evidence:
    - history
    cross_difficulty: null
  - id: material_refund_share
    effect: parameter
    decides: mt_share
    bindings:
    - mt_days
    - mt_share
    ladder:
    - when: the job is cancelled no more than 3 calendar days after its order date
      value: K('mt_share_early_pct')
    - when: it is cancelled 4 to 14 calendar days after its order date
      value: K('mt_share_mid_pct')
    - when: otherwise
      value: K('mt_share_standard_pct')
    baseline:
      mt_share: K('mt_share_standard_pct')
    evidence:
    - date
    cross_difficulty: null
  - id: material_spend_bonus
    effect: parameter
    decides: mt_spend_bonus
    bindings:
    - mt_sales
    - mt_returns
    - mt_spend_bonus
    ladder:
    - when: >-
        the member's net Northgate purchases for materials over the last twelve months are at least 3,000.00
      value: K('mt_bonus_high_usd')
    - when: they are at least 1,000.00 but less than 3,000.00
      value: K('mt_bonus_mid_usd')
    - when: otherwise
      value: '0'
    baseline:
      mt_spend_bonus: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: order
  - id: material_treated_blank_deduction
    effect: parameter
    decides: mt_treated
    bindings:
    - mt_light_count
    - mt_blue_count
    - mt_treated
    ladder:
    - when: a light-adaptive option charge was posted on the job
      value: K('mt_treated_light_usd')
    - when: no light-adaptive charge but a blue-light filtering charge was posted
      value: K('mt_treated_blue_usd')
    - when: otherwise
      value: '0'
    baseline:
      mt_treated: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The material cancellation refund in an in-lab cancellation is 60 percent of the material upgrade charge less
      every credit already posted against it, rounded to the cent. The refundable material amount is the net material
      upgrade charge in full.
    params:
    - mt_share_standard_pct
  inputs:
    history:
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: material_upgrade
        remake_number: 0
    - table: optical_transactions
      aggregate: count
      field: optical_txn_id
      filters:
        event_type: optical_charge_posted
        charge_component: photochromic
    - category: order
      table: order_lines
      aggregate: sum
      field: line_amount
      within_months: 12
      filters:
        event_type: order_line_sold
    - category: order
      table: order_lines
      aggregate: sum
      field: line_amount
      within_months: 12
      filters:
        event_type: order_line_returned
    cross_category:
    - order
- id: optical_ext_lens_cancellation_refund
  base_policy_refs:
  - optical_cancellation
  - optical_agg_discount_stacking
  - optical_vision_plan_billing
  - optical_remake_guarantees
  - optical_satisfaction_returns
  overwrite:
  - base_policy: optical_cancellation
    superseded_clause: >-
      A job cancelled while in the lab keeps in_lab_cancellation_retained_pct of optical_msr_original_lens_charges
    replaced_by: >-
      The lab retention is the lab retention percentage of the lens charge pool, plus a lab cancellation fee of
      5.00.
  trigger: on_request
  subject:
  - optical_order_cancelled
  - optical_credit_posted
  computes: lens_refund_usd
  target_tool: confirm_eyewear_cancellation_51323feb
  params:
    rt_early_pct: 35
    rt_mid_pct: 45
    rt_early_days: 10
    rt_mid_days: 21
    rt_loyal_long_points: 5
    rt_loyal_mid_points: 2
    rt_loyal_long_months: 60
    rt_loyal_mid_months: 24
    rt_fee_premium_usd: 10.0
    rt_fee_progressive_usd: 7.5
    rt_fee_standard_usd: 5.0
    rt_premium_lens_usd: 140.0
    rt_progressive_lens_usd: 90.0
    rt_spend_high_usd: 1500.0
    rt_spend_mid_usd: 500.0
    rt_spend_high_points: 3
    rt_spend_mid_points: 1
  rule: >
    An eyewear job in the lab is cancelled by the member's own confirmation, which records the cancellation and
    books the lens cancellation refund as one refund credit against the base-lens charge, returned to the original
    tender; the lab keeps the lab retention for the lens work already started. The lens charge pool is the base-lens
    charge, the material upgrade charge and every light-adaptive, blue-light filtering or anti-reflective option
    charge of the job, each less every credit already posted against it. The lab retention is the lab retention
    percentage of the lens charge pool, plus a lab cancellation fee of 5.00. The lab retention percentage is the
    in-lab retained percentage of the job's lens design. The lens cancellation refund is the base-lens charge less
    every credit already posted against it, less the lab retention, never less than zero, rounded to the cent once
    at the end. The lab days are the calendar days from the lab-day start to the day the refund is worked out, and
    the lab-day start is the order date of the job. Where a charge was posted on the job after its order date, the
    job was changed and resubmitted to the lab, and the lab-day start is the date of the latest such charge; where
    no charge was posted after the order date but the job's prescription was issued after the order date, the job
    waited for that prescription and the lab-day start is the prescription's issue date. Where the lab days are
    no more than 10 and a material upgrade charge was posted on the job, the special-order blanks can still go back
    to the supplier and the lab retention percentage is 35 percent; where the lab days are 11 to 21 and a material
    upgrade charge was posted, it is 45 percent. Where the membership on the job has been held for at least 60 whole
    months and a Northgate credit card account linked to that membership is active, the lab retention percentage
    is lowered by 5 percentage points as a retention loyalty lowering; where it has been held for at least 24 but
    fewer than 60 whole months and such a card account is active, it is lowered by 2 points. The member's Northgate
    card spend for the retention is the Northgate qualifying spend on which the member's Northgate credit card earned
    card rewards, in statement entries dated less than twelve whole months before the day the cancellation is confirmed.
    Where that card spend for the retention is at least 1,500.00, a card spend lowering of 3 percentage points applies,
    and where it is at least 500.00 but less than 1,500.00, the card spend lowering is 1 point. Where the base-lens
    charge is 140.00 or more, the lab cancellation fee is 10.00, and where it is at least 90.00 but less than 140.00,
    the fee is 7.50. The lab retention is worked out in this order: the lowerings are taken off the lab retention
    percentage, never below zero; the lens charge pool is multiplied by the resulting percentage; the lab cancellation
    fee is then added. The cancellation of an in-lab job is not confirmed until its frame charge carries the frame
    return refund. The lab retention is worked out only after each light-adaptive, blue-light filtering or anti-reflective
    option charge on the job carries its option cancellation refund. The lab retention is not worked out before
    the material upgrade charge of the job carries its material cancellation refund.
  prerequisite:
  - problem: optical_ext_frame_return_refund
    kind: state_gate
    gate: optical_transactions.source_txn_id
    form: state
    policy_source: >-
      The cancellation of an in-lab job is not confirmed until its frame charge carries the frame return refund.
    condition: The job's frame charge carries a cancellation refund credit for its frame return refund.
    resolved_by: refund_frame_to_stock_fae456d1
    effect: >-
      Once the frame return refund stands against the frame charge, the frame is back in stock and the member's
      confirmation of the cancellation, with its lens cancellation refund, may be recorded.
  - problem: optical_ext_option_cancellation_refund
    kind: value_input
    gate: rt_pool
    form: state
    policy_source: >-
      The lab retention is worked out only after each light-adaptive, blue-light filtering or anti-reflective option
      charge on the job carries its option cancellation refund.
    condition: >-
      Every light-adaptive, blue-light filtering or anti-reflective option charge on the job carries a cancellation
      refund credit for its option cancellation refund.
    resolved_by: refund_lens_option_d067b0d2
    effect: >-
      Once the option cancellation refund stands against the option charge, that charge's net falls and the lens
      charge pool, and with it the lab retention, falls by the amount refunded times the retention percentage.
  - problem: optical_ext_material_cancellation_refund
    kind: value_input
    gate: rt_pool
    form: state
    policy_source: >-
      The lab retention is not worked out before the material upgrade charge of the job carries its material cancellation
      refund.
    condition: >-
      The job's material upgrade charge carries a cancellation refund credit for its material cancellation refund.
    resolved_by: refund_lens_material_ad7f47c2
    effect: >-
      Once the material cancellation refund stands against the material upgrade charge, the lens charge pool falls
      by that refund and the lab retention falls with it.
  cross_category:
  - category: membership
    as: branch
    reads:
    - opened_date
    note: >-
      The retention loyalty lowering is tiered on how many whole months the membership on the job has been held.
  - category: card
    as: history
    reads:
    - status
    - card_transactions.qualifying_spend
    note: >-
      An active linked card is the second condition of the retention loyalty lowering, and the card reward ledger
      sets the card spend lowering.
  compute:
  - rt_base_net: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='base_lenses',
      remake_number=0) - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='base_lenses')
  - rt_material_net: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='material_upgrade',
      remake_number=0) - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='material_upgrade')
  - rt_option_net: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='photochromic')
      + SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='blue_light_filter')
      + SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='anti_reflective_coating')
      - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='photochromic')
      - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='blue_light_filter')
      - SUM('optical_transactions', 'amount', event_type='optical_credit_posted', charge_component='anti_reflective_coating')
  - rt_pool: rt_base_net + rt_material_net + rt_option_net
  - rt_latest_charge: LATEST('optical_transactions', 'event_date', event_type='optical_charge_posted')
  - rt_lab_start: >-
      rt_latest_charge if rt_latest_charge > F('order_date') else (F('rx_issue_date') if (rt_latest_charge <= F('order_date')
      and F('rx_issue_date') > F('order_date')) else F('order_date'))
  - rt_lab_days: DAYS(rt_lab_start, NOW)
  - rt_material_posted: >-
      COUNT('optical_transactions', event_type='optical_charge_posted', charge_component='material_upgrade')
  - rt_pct: >-
      K('rt_early_pct') if (rt_lab_days <= K('rt_early_days') and rt_material_posted > 0) else (K('rt_mid_pct')
      if (rt_lab_days > K('rt_early_days') and rt_lab_days <= K('rt_mid_days') and rt_material_posted > 0) else
      P('in_lab_cancellation_retained_pct'))
  - rt_member_months: MONTHS(CFIELD('membership', 'opened_date', membership_id=F('membership_id')), NOW)
  - rt_card_status: CFIELD('card', 'status', linked_membership_id=F('membership_id'))
  - rt_loyal_points: >-
      K('rt_loyal_long_points') if (rt_member_months >= K('rt_loyal_long_months') and rt_card_status == 'active')
      else (K('rt_loyal_mid_points') if (rt_member_months >= K('rt_loyal_mid_months') and rt_member_months < K('rt_loyal_long_months')
      and rt_card_status == 'active') else 0)
  - rt_card_spend: >-
      XSUM('card', 'card_transactions', 'qualifying_spend', within_months=12, date_field='transaction_date', event_type='card_rewards_earned',
      spend_category='northgate_purchases')
  - rt_spend_points: >-
      K('rt_spend_high_points') if rt_card_spend >= K('rt_spend_high_usd') else (K('rt_spend_mid_points') if rt_card_spend
      >= K('rt_spend_mid_usd') else 0)
  - rt_base_charge: >-
      SUM('optical_transactions', 'amount', event_type='optical_charge_posted', charge_component='base_lenses',
      remake_number=0)
  - rt_fee: >-
      K('rt_fee_premium_usd') if rt_base_charge >= K('rt_premium_lens_usd') else (K('rt_fee_progressive_usd') if
      rt_base_charge >= K('rt_progressive_lens_usd') else K('rt_fee_standard_usd'))
  - rt_retention: rt_pool * MX(0, rt_pct - rt_loyal_points - rt_spend_points) / 100 + rt_fee
  - result: RND(MX(0, rt_base_net - rt_retention), 2)
  compute_basis:
    rt_base_net: >-
      The lens cancellation refund is the base-lens charge less every credit already posted against it, less the
      lab retention, never less than zero, rounded to the cent once at the end.
    rt_material_net: >-
      The lens charge pool is the base-lens charge, the material upgrade charge and every light-adaptive, blue-light
      filtering or anti-reflective option charge of the job, each less every credit already posted against it.
    rt_option_net: >-
      The lens charge pool is the base-lens charge, the material upgrade charge and every light-adaptive, blue-light
      filtering or anti-reflective option charge of the job, each less every credit already posted against it.
    rt_pool: >-
      The lens charge pool is the base-lens charge, the material upgrade charge and every light-adaptive, blue-light
      filtering or anti-reflective option charge of the job, each less every credit already posted against it.
    rt_latest_charge: >-
      Where a charge was posted on the job after its order date, the job was changed and resubmitted to the lab,
      and the lab-day start is the date of the latest such charge; where no charge was posted after the order date
      but the job's prescription was issued after the order date, the job waited for that prescription and the lab-day
      start is the prescription's issue date.
    rt_lab_start: >-
      The lab days are the calendar days from the lab-day start to the day the refund is worked out, and the lab-day
      start is the order date of the job. Where a charge was posted on the job after its order date, the job was
      changed and resubmitted to the lab, and the lab-day start is the date of the latest such charge; where no
      charge was posted after the order date but the job's prescription was issued after the order date, the job
      waited for that prescription and the lab-day start is the prescription's issue date.
    rt_lab_days: >-
      The lab days are the calendar days from the lab-day start to the day the refund is worked out, and the lab-day
      start is the order date of the job.
    rt_material_posted: >-
      Where the lab days are no more than 10 and a material upgrade charge was posted on the job, the special-order
      blanks can still go back to the supplier and the lab retention percentage is 35 percent; where the lab days
      are 11 to 21 and a material upgrade charge was posted, it is 45 percent.
    rt_pct: >-
      The lab retention percentage is the in-lab retained percentage of the job's lens design. Where the lab days
      are no more than 10 and a material upgrade charge was posted on the job, the special-order blanks can still
      go back to the supplier and the lab retention percentage is 35 percent; where the lab days are 11 to 21 and
      a material upgrade charge was posted, it is 45 percent.
    rt_member_months: >-
      Where the membership on the job has been held for at least 60 whole months and a Northgate credit card account
      linked to that membership is active, the lab retention percentage is lowered by 5 percentage points as a retention
      loyalty lowering; where it has been held for at least 24 but fewer than 60 whole months and such a card account
      is active, it is lowered by 2 points.
    rt_card_status: >-
      Where the membership on the job has been held for at least 60 whole months and a Northgate credit card account
      linked to that membership is active, the lab retention percentage is lowered by 5 percentage points as a retention
      loyalty lowering; where it has been held for at least 24 but fewer than 60 whole months and such a card account
      is active, it is lowered by 2 points.
    rt_loyal_points: >-
      Where the membership on the job has been held for at least 60 whole months and a Northgate credit card account
      linked to that membership is active, the lab retention percentage is lowered by 5 percentage points as a retention
      loyalty lowering; where it has been held for at least 24 but fewer than 60 whole months and such a card account
      is active, it is lowered by 2 points.
    rt_card_spend: >-
      The member's Northgate card spend for the retention is the Northgate qualifying spend on which the member's
      Northgate credit card earned card rewards, in statement entries dated less than twelve whole months before
      the day the cancellation is confirmed.
    rt_spend_points: >-
      Where that card spend for the retention is at least 1,500.00, a card spend lowering of 3 percentage points
      applies, and where it is at least 500.00 but less than 1,500.00, the card spend lowering is 1 point.
    rt_base_charge: >-
      Where the base-lens charge is 140.00 or more, the lab cancellation fee is 10.00, and where it is at least
      90.00 but less than 140.00, the fee is 7.50.
    rt_fee: >-
      The lab retention is the lab retention percentage of the lens charge pool, plus a lab cancellation fee of
      5.00. Where the base-lens charge is 140.00 or more, the lab cancellation fee is 10.00, and where it is at
      least 90.00 but less than 140.00, the fee is 7.50.
    rt_retention: >-
      The lab retention is worked out in this order: the lowerings are taken off the lab retention percentage, never
      below zero; the lens charge pool is multiplied by the resulting percentage; the lab cancellation fee is then
      added.
    result: >-
      The lens cancellation refund is the base-lens charge less every credit already posted against it, less the
      lab retention, never less than zero, rounded to the cent once at the end.
  factors:
  - id: lab_day_start_anchor
    effect: method
    decides: rt_lab_start
    bindings:
    - rt_latest_charge
    - rt_lab_start
    ladder:
    - when: a charge was posted on the job after its order date
      method: the lab days count from the date of the latest such charge
    - when: >-
        no charge was posted after the order date but the prescription was issued after the order date
      method: the lab days count from the prescription's issue date
    - when: otherwise
      method: the lab days count from the order date
    baseline:
      rt_lab_start: F('order_date')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: lab_retention_percentage
    effect: parameter
    decides: rt_pct
    bindings:
    - rt_lab_days
    - rt_material_posted
    - rt_pct
    ladder:
    - when: the lab days are no more than 10 and a material upgrade charge was posted on the job
      value: K('rt_early_pct')
    - when: the lab days are 11 to 21 and a material upgrade charge was posted on the job
      value: K('rt_mid_pct')
    - when: otherwise
      value: P('in_lab_cancellation_retained_pct')
    baseline:
      rt_pct: P('in_lab_cancellation_retained_pct')
    evidence:
    - date
    - history
    - tier_param
    cross_difficulty: null
  - id: retention_loyalty_lowering
    effect: parameter
    decides: rt_loyal_points
    bindings:
    - rt_member_months
    - rt_card_status
    - rt_loyal_points
    ladder:
    - when: >-
        the membership on the job has been held for at least 60 whole months and a linked Northgate credit card
        account is active
      value: K('rt_loyal_long_points')
    - when: >-
        it has been held for at least 24 but fewer than 60 whole months and a linked Northgate credit card account
        is active
      value: K('rt_loyal_mid_points')
    - when: otherwise
      value: '0'
    baseline:
      rt_loyal_points: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: membership
  - id: retention_card_spend_lowering
    effect: parameter
    decides: rt_spend_points
    bindings:
    - rt_card_spend
    - rt_spend_points
    ladder:
    - when: >-
        the member's Northgate card spend for the retention over the last twelve months is at least 1,500.00
      value: K('rt_spend_high_points')
    - when: it is at least 500.00 but less than 1,500.00
      value: K('rt_spend_mid_points')
    - when: otherwise
      value: '0'
    baseline:
      rt_spend_points: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: card
  - id: lab_cancellation_fee
    effect: parameter
    decides: rt_fee
    bindings:
    - rt_base_charge
    - rt_fee
    ladder:
    - when: the base-lens charge is 140.00 or more
      value: K('rt_fee_premium_usd')
    - when: it is at least 90.00 but less than 140.00
      value: K('rt_fee_progressive_usd')
    - when: otherwise
      value: K('rt_fee_standard_usd')
    baseline:
      rt_fee: K('rt_fee_standard_usd')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The lens charge pool is the base-lens charge, the material upgrade charge and every light-adaptive, blue-light
      filtering or anti-reflective option charge of the job, each less every credit already posted against it. The
      lab retention is the lab retention percentage of the lens charge pool, plus a lab cancellation fee of 5.00.
      The lab retention percentage is the in-lab retained percentage of the job's lens design. The lens cancellation
      refund is the base-lens charge less every credit already posted against it, less the lab retention, never
      less than zero, rounded to the cent once at the end.
    params:
    - in_lab_cancellation_retained_pct
    - rt_fee_standard_usd
  inputs:
    history:
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: base_lenses
        remake_number: 0
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: material_upgrade
        remake_number: 0
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_credit_posted
        charge_component: material_upgrade
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_charge_posted
        charge_component: photochromic
    - table: optical_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: optical_credit_posted
        charge_component: photochromic
    - table: optical_transactions
      aggregate: latest
      field: event_date
      filters:
        event_type: optical_charge_posted
    - category: card
      table: card_transactions
      aggregate: sum
      field: qualifying_spend
      within_months: 12
      filters:
        event_type: card_rewards_earned
        spend_category: northgate_purchases
    cross_category:
    - membership
    - card
