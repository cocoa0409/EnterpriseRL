events:
  - type: tire_install_booked
    target: tire_holdings
    mutation: create
    meaning: An installation appointment is booked for tires bought on a Northgate purchase, under the package the member chose.
    grain: one row per set of tires booked for one vehicle
    fields:
      customer_id: the member
      order_id: the purchase on which the tires were bought
      variant_name: the installation package chosen
      status: always awaiting_install on booking
      vehicle_description: the vehicle on the work order
      tire_size: the tire size
      tire_item_number: the tire model's item number
      tire_unit_price: the price paid per tire
      tire_count: the number of tires in the set
      treadwear_warranty_miles: the manufacturer's treadwear mileage warranty
      appointment_date: the booked installation date
      install_date: empty until installed
      install_odometer: 0 until installed
    triggers: []

  - type: tire_appointment_rescheduled
    target: tire_holdings
    mutation: update
    meaning: The member moves the installation appointment to another date.
    grain: one row per reschedule
    fields:
      appointment_date: the new installation date
    triggers: []

  - type: tire_installed
    target: tire_holdings
    mutation: {transition: {from: awaiting_install, to: installed}}
    meaning: The Tire Center mounts the set and closes the installation work order.
    grain: one row per set installed
    fields:
      status: becomes installed
      install_date: the installation date
      install_odometer: the odometer on the installation work order
    triggers:
      - event: tire:tire_service_charged
        map: {charge_component: installation_package, tire_position: all_positions, service_date: install_date, odometer_miles: install_odometer}

  - type: tire_install_cancelled
    target: tire_holdings
    mutation: {transition: {from: awaiting_install, to: cancelled}}
    meaning: The installation is cancelled before the tires are mounted.
    grain: one row per cancelled installation
    fields:
      status: becomes cancelled
      closed_date: the cancellation date
    triggers: []

  - type: tire_set_retired
    target: tire_holdings
    mutation: {transition: {from: installed, to: retired}}
    meaning: The package ends for the set.
    grain: one row per package ended
    fields:
      status: becomes retired
      closed_date: the date the package ended
    triggers: []

  - type: tire_service_charged
    target: tire_services
    meaning: A Tire Center fee or a replacement tire is charged on the package.
    grain: one row per charge component per wheel position per service date
    distinguish_by: [charge_component, tire_position, service_date]
    fields:
      service_date: the date of the work order
      odometer_miles: the odometer on the work order
      tire_position: the wheel position charged, or all_positions
      charge_component: what is charged
      amount: the charge
      source_event_id: for a replacement tire, the road hazard or treadwear entry that led to it
    account: tire_charges
    direction: in
    triggers: []

  - type: tire_service_credited
    target: tire_services
    meaning: A credit is applied on the package — a road hazard or treadwear credit toward a replacement, or a refund of a charge.
    grain: one row per credit of one kind against one source entry
    distinguish_by: [source_event_id, charge_component]
    fields:
      service_date: the date of the credit
      tire_position: the wheel position concerned
      charge_component: road_hazard_credit, treadwear_credit or package_refund
      amount: the credit
      source_event_id: the road hazard or treadwear entry, or the charge refunded
    account: tire_charges
    direction: out
    triggers: []

  - type: tire_rotation_performed
    target: tire_services
    meaning: The set is rotated (and rebalanced where needed) at a Tire Center.
    grain: one row per rotation visit
    distinguish_by: [service_date]
    fields:
      service_date: the visit date
      odometer_miles: the odometer on the work order
      tire_position: always all_positions
      remaining_tread_32nds: the shallowest tread measured on the set
    triggers: []

  - type: tire_flat_repaired
    target: tire_services
    meaning: A repairable puncture in one tire is plugged and patched.
    grain: one row per tire repaired per visit
    distinguish_by: [service_date, tire_position]
    fields:
      service_date: the visit date
      odometer_miles: the odometer on the work order
      tire_position: the tire repaired
      damage_cause: always puncture_repairable
      remaining_tread_32nds: the tread measured on the tire
    triggers: []

  - type: tire_road_hazard_replaced
    target: tire_services
    meaning: A tire damaged beyond repair by a road hazard is replaced under the package's road hazard protection.
    grain: one row per tire replaced per visit
    distinguish_by: [service_date, tire_position]
    fields:
      service_date: the visit date
      odometer_miles: the odometer on the work order
      tire_position: the tire replaced
      damage_cause: the damage found
      remaining_tread_32nds: the tread measured on the damaged tire
      amount: the credit determined for the damaged tire
    triggers:
      - event: tire:tire_service_credited
        map: {charge_component: road_hazard_credit, source_event_id: tire_event_id, tire_position: tire_position, service_date: service_date}
      - event: tire:tire_service_charged
        map: {charge_component: replacement_tire, source_event_id: tire_event_id, tire_position: tire_position, service_date: service_date}

  - type: tire_treadwear_adjusted
    target: tire_services
    meaning: A tire worn out before its manufacturer's treadwear mileage is credited pro rata toward a replacement.
    grain: one row per tire adjusted per visit
    distinguish_by: [service_date, tire_position]
    fields:
      service_date: the visit date
      odometer_miles: the odometer on the claim work order
      tire_position: the tire adjusted
      remaining_tread_32nds: the tread measured on the worn tire
      amount: the credit determined for the worn tire
    triggers:
      - event: tire:tire_service_credited
        map: {charge_component: treadwear_credit, source_event_id: tire_event_id, tire_position: tire_position, service_date: service_date}
      - event: tire:tire_service_charged
        map: {charge_component: replacement_tire, source_event_id: tire_event_id, tire_position: tire_position, service_date: service_date}

measures:
  - id: tire_msr_road_hazard_replacements
    window: the life of the package
    measure: count of tire_road_hazard_replaced entries on the package
  - id: tire_msr_wear_pct
    window: the tire concerned, on the visit
    measure: (new_tread_depth_32nds minus remaining_tread_32nds) divided by (new_tread_depth_32nds minus coverage_end_tread_32nds), times 100
  - id: tire_msr_remaining_usable_fraction
    window: the tire concerned, on the visit
    measure: (remaining_tread_32nds minus coverage_end_tread_32nds) divided by (new_tread_depth_32nds minus coverage_end_tread_32nds), never below 0
  - id: tire_msr_miles_driven
    window: from installation to the visit
    measure: odometer_miles on the visit's work order minus install_odometer
  - id: tire_msr_max_rotation_gap_miles
    window: from installation to the claim visit
    measure: the largest difference between consecutive odometer readings in the sequence formed by install_odometer, the odometer_miles of every tire_rotation_performed entry on the package in date order, and the claim visit's odometer_miles
  - id: tire_msr_current_tire_price
    window: the service date
    measure: the unit_price of the item_price_history record of price_type regular for tire_item_number on Northgate In-Club Purchase in effect on the service date

policies:
  - id: tire_agg_multi_holding
    subject: [tire_install_booked]
    rule: >
      A member may hold installation packages on as many vehicles as they own, and a new package on another
      vehicle never affects an existing one. Each package covers only the set it was sold with; charges,
      credits, rotations and road hazard replacements on one package are never applied to another.
    eligibility: []
    params:
      max_per_customer: null

  - id: tire_agg_vehicle_package
    subject: [tire_install_booked, tire_set_retired]
    rule: >
      A new set may not be booked for a vehicle that already has a package whose status is awaiting_install.
      A vehicle may carry an installed package and a newly booked one only until the new set is installed:
      when the new set replaces every tire of the earlier set, the earlier package is retired on the new
      installation date; when it replaces only some, the replaced tires leave the earlier package's coverage
      and the others stay covered by it. Road hazard replacements, rotations and treadwear claims are counted
      across the whole package, not per tire, and a replacement tire stays on the package it replaced into.
    eligibility:
      - id: one_package_per_vehicle
        applies_to: [tire_install_booked]
        kind: dedup
        condition: A new set may not be booked for a vehicle that already has a package whose status is awaiting_install.
        evidence_fields: [tire_holdings.customer_id, tire_holdings.vehicle_description, tire_holdings.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_holdings.customer_id, tire_holdings.vehicle_description]
          action_bindings:
            tire_holdings.customer_id: customer_id
            tire_holdings.vehicle_description: vehicle_description
        dedup_contract:
          table: tire_holdings
          mode: separate_record
          object_bindings: {customer_id: customer_id, vehicle_description: vehicle_description}
          duplicate_filters: {status: [awaiting_install]}
          distinct_fields: [tire_size, appointment_date]

  - id: tire_installation_charges
    subject: [tire_installed, tire_service_charged]
    rule: >
      The Tire Center installs a package only on a vehicle of the package's vehicle_class with a gross vehicle
      weight rating no higher than max_gvwr_lbs and wheels no larger than max_wheel_diameter_inches; tires for
      a vehicle outside those limits are refused at the bay. On the installation date the package is charged
      package_price_per_tire_usd for each tire in tire_count as one installation_package entry, a
      tire_disposal_fee entry of tire_disposal_fee_usd for each old tire removed when that fee is not zero,
      and a tpms_service_kit entry of tpms_service_kit_fee_usd for each wheel with a pressure sensor when that
      fee is not zero. Mounting, balancing by balance_method, new valve stems, nitrogen inflation, an alignment
      check and a re-torque check are included exactly as the package's switches say. Tire Center fees never
      earn Annual Reward; the tires themselves are merchandise on the purchase.
    eligibility: []
    params:
      per_tier:
        Northgate Tire Mount & Balance: {per_tire: "=package_price_per_tire_usd", disposal: "=tire_disposal_fee_usd", tpms_kit: "=tpms_service_kit_fee_usd", gvwr: "=max_gvwr_lbs", wheel: "=max_wheel_diameter_inches", class: "=vehicle_class", balance: "=balance_method", stems: "=new_valve_stems_included", nitrogen: "=nitrogen_inflation_included", alignment: "=alignment_check_included", retorque: "=retorque_check_included", mount: "=mount_and_balance_included"}
        Northgate Tire Installation Package: {per_tire: "=package_price_per_tire_usd", disposal: "=tire_disposal_fee_usd", tpms_kit: "=tpms_service_kit_fee_usd", gvwr: "=max_gvwr_lbs", wheel: "=max_wheel_diameter_inches", class: "=vehicle_class", balance: "=balance_method", stems: "=new_valve_stems_included", nitrogen: "=nitrogen_inflation_included", alignment: "=alignment_check_included", retorque: "=retorque_check_included", mount: "=mount_and_balance_included"}
        Northgate Light Truck Tire Installation Package: {per_tire: "=package_price_per_tire_usd", disposal: "=tire_disposal_fee_usd", tpms_kit: "=tpms_service_kit_fee_usd", gvwr: "=max_gvwr_lbs", wheel: "=max_wheel_diameter_inches", class: "=vehicle_class", balance: "=balance_method", stems: "=new_valve_stems_included", nitrogen: "=nitrogen_inflation_included", alignment: "=alignment_check_included", retorque: "=retorque_check_included", mount: "=mount_and_balance_included"}
        Northgate Tire Installation Package with Road Hazard: {per_tire: "=package_price_per_tire_usd", disposal: "=tire_disposal_fee_usd", tpms_kit: "=tpms_service_kit_fee_usd", gvwr: "=max_gvwr_lbs", wheel: "=max_wheel_diameter_inches", class: "=vehicle_class", balance: "=balance_method", stems: "=new_valve_stems_included", nitrogen: "=nitrogen_inflation_included", alignment: "=alignment_check_included", retorque: "=retorque_check_included", mount: "=mount_and_balance_included"}
        Northgate Premium Tire Care: {per_tire: "=package_price_per_tire_usd", disposal: "=tire_disposal_fee_usd", tpms_kit: "=tpms_service_kit_fee_usd", gvwr: "=max_gvwr_lbs", wheel: "=max_wheel_diameter_inches", class: "=vehicle_class", balance: "=balance_method", stems: "=new_valve_stems_included", nitrogen: "=nitrogen_inflation_included", alignment: "=alignment_check_included", retorque: "=retorque_check_included", mount: "=mount_and_balance_included"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {per_tire: "=package_price_per_tire_usd", disposal: "=tire_disposal_fee_usd", tpms_kit: "=tpms_service_kit_fee_usd", gvwr: "=max_gvwr_lbs", wheel: "=max_wheel_diameter_inches", class: "=vehicle_class", balance: "=balance_method", stems: "=new_valve_stems_included", nitrogen: "=nitrogen_inflation_included", alignment: "=alignment_check_included", retorque: "=retorque_check_included", mount: "=mount_and_balance_included"}
    formula:
      package_amount: round(package_price_per_tire_usd * tire_count, 2)
      disposal_amount: round(tire_disposal_fee_usd * tire_count, 2)

  - id: tire_service_eligibility
    subject: [tire_rotation_performed, tire_flat_repaired, tire_road_hazard_replaced, tire_treadwear_adjusted]
    rule: >
      Services under a package are performed at any Northgate Tire Center where service_at_any_club is true,
      and every work order records the odometer where work_order_odometer_required is true. Package services
      are performed only on a package whose status is installed. Where membership_required_for_service is
      true, package services are performed only while the membership on the tires' purchase has status
      active; a member whose membership has lapsed renews it before the Tire Center will rotate, repair,
      replace or adjust a tire, and the lapse does not shorten or extend any term of the package.
    eligibility:
      - id: package_installed
        applies_to: [tire_rotation_performed, tire_flat_repaired, tire_road_hazard_replaced, tire_treadwear_adjusted]
        kind: state
        condition: Package services are performed only on a package whose status is installed.
        evidence_fields: [tire_holdings.status, tire_holdings.tire_service_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_holdings.tire_service_id]
          action_bindings:
            tire_holdings.tire_service_id: tire_service_id
        state_contract:
          field: tire_holdings.status
          allowed: [installed]
      - id: membership_active_for_service
        applies_to: [tire_rotation_performed, tire_flat_repaired, tire_road_hazard_replaced, tire_treadwear_adjusted]
        kind: state
        condition: Where membership_required_for_service is true, package services are performed only while the membership on the tires' purchase has status active; a member whose membership has lapsed renews it before the Tire Center will rotate, repair, replace or adjust a tire, and the lapse does not shorten or extend any term of the package.
        evidence_fields: [membership_holdings.status, order_holdings.membership_id, tire_holdings.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_holdings.order_id]
          action_bindings:
            tire_holdings.order_id: order_id
        state_contract:
          field: membership_holdings.status
          allowed: [active]
    params:
      per_tier:
        Northgate Tire Mount & Balance: {members_only: "=membership_required_for_service", any_club: "=service_at_any_club", odometer: "=work_order_odometer_required"}
        Northgate Tire Installation Package: {members_only: "=membership_required_for_service", any_club: "=service_at_any_club", odometer: "=work_order_odometer_required"}
        Northgate Light Truck Tire Installation Package: {members_only: "=membership_required_for_service", any_club: "=service_at_any_club", odometer: "=work_order_odometer_required"}
        Northgate Tire Installation Package with Road Hazard: {members_only: "=membership_required_for_service", any_club: "=service_at_any_club", odometer: "=work_order_odometer_required"}
        Northgate Premium Tire Care: {members_only: "=membership_required_for_service", any_club: "=service_at_any_club", odometer: "=work_order_odometer_required"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {members_only: "=membership_required_for_service", any_club: "=service_at_any_club", odometer: "=work_order_odometer_required"}

  - id: tire_lifetime_services
    subject: [tire_rotation_performed, tire_flat_repaired, tire_service_charged]
    rule: >
      Rotations are free where lifetime_rotation_included is true and otherwise cost rotation_fee_usd per
      visit; the Tire Center recommends one every recommended_rotation_interval_miles. Rebalancing is free
      where lifetime_rebalance_included is true and otherwise costs rebalance_fee_per_tire_usd per tire. A
      puncture is repairable only when it is no wider than flat_repair_max_puncture_inches and, where
      flat_repair_tread_area_only is true, lies in the tread area; repairable flats are free where
      flat_repair_included is true and otherwise cost flat_repair_fee_usd. A puncture that is wider, in the
      shoulder or sidewall, or overlaps an earlier repair is non-repairable and can only be replaced — under
      road hazard protection where the package has it, at the member's expense otherwise. Flat-tire roadside
      assistance is available for roadside_assistance_months from installation. Each fee is its own entry on
      the visit's service date.
    eligibility: []
    params:
      per_tier:
        Northgate Tire Mount & Balance: {rotation_free: "=lifetime_rotation_included", rotation_fee: "=rotation_fee_usd", interval: "=recommended_rotation_interval_miles", rebalance_free: "=lifetime_rebalance_included", rebalance_fee: "=rebalance_fee_per_tire_usd", flat_free: "=flat_repair_included", flat_fee: "=flat_repair_fee_usd", max_puncture: "=flat_repair_max_puncture_inches", tread_only: "=flat_repair_tread_area_only", roadside_months: "=roadside_assistance_months"}
        Northgate Tire Installation Package: {rotation_free: "=lifetime_rotation_included", rotation_fee: "=rotation_fee_usd", interval: "=recommended_rotation_interval_miles", rebalance_free: "=lifetime_rebalance_included", rebalance_fee: "=rebalance_fee_per_tire_usd", flat_free: "=flat_repair_included", flat_fee: "=flat_repair_fee_usd", max_puncture: "=flat_repair_max_puncture_inches", tread_only: "=flat_repair_tread_area_only", roadside_months: "=roadside_assistance_months"}
        Northgate Light Truck Tire Installation Package: {rotation_free: "=lifetime_rotation_included", rotation_fee: "=rotation_fee_usd", interval: "=recommended_rotation_interval_miles", rebalance_free: "=lifetime_rebalance_included", rebalance_fee: "=rebalance_fee_per_tire_usd", flat_free: "=flat_repair_included", flat_fee: "=flat_repair_fee_usd", max_puncture: "=flat_repair_max_puncture_inches", tread_only: "=flat_repair_tread_area_only", roadside_months: "=roadside_assistance_months"}
        Northgate Tire Installation Package with Road Hazard: {rotation_free: "=lifetime_rotation_included", rotation_fee: "=rotation_fee_usd", interval: "=recommended_rotation_interval_miles", rebalance_free: "=lifetime_rebalance_included", rebalance_fee: "=rebalance_fee_per_tire_usd", flat_free: "=flat_repair_included", flat_fee: "=flat_repair_fee_usd", max_puncture: "=flat_repair_max_puncture_inches", tread_only: "=flat_repair_tread_area_only", roadside_months: "=roadside_assistance_months"}
        Northgate Premium Tire Care: {rotation_free: "=lifetime_rotation_included", rotation_fee: "=rotation_fee_usd", interval: "=recommended_rotation_interval_miles", rebalance_free: "=lifetime_rebalance_included", rebalance_fee: "=rebalance_fee_per_tire_usd", flat_free: "=flat_repair_included", flat_fee: "=flat_repair_fee_usd", max_puncture: "=flat_repair_max_puncture_inches", tread_only: "=flat_repair_tread_area_only", roadside_months: "=roadside_assistance_months"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {rotation_free: "=lifetime_rotation_included", rotation_fee: "=rotation_fee_usd", interval: "=recommended_rotation_interval_miles", rebalance_free: "=lifetime_rebalance_included", rebalance_fee: "=rebalance_fee_per_tire_usd", flat_free: "=flat_repair_included", flat_fee: "=flat_repair_fee_usd", max_puncture: "=flat_repair_max_puncture_inches", tread_only: "=flat_repair_tread_area_only", roadside_months: "=roadside_assistance_months"}

  - id: tire_road_hazard_protection
    subject: [tire_road_hazard_replaced, tire_service_credited, tire_service_charged]
    rule: >
      On a package with road_hazard_included, a tire damaged by a cause in road_hazard_covered_causes is
      replaced with a new tire of the same item. A road hazard replacement is made only when the damage is
      brought to a Tire Center no later than road_hazard_term_months calendar months after the installation
      date of the package. Calendar months are added to the installation date and, when the resulting month
      has no such day, the boundary falls on that month's last day. A tire is covered only while its
      remaining_tread_32nds is above coverage_end_tread_32nds. A package receives at most
      road_hazard_replacements_max road hazard replacements, counted by tire_msr_road_hazard_replacements. The
      damaged tire is credited at the full tire_unit_price when tire_msr_wear_pct is at or below
      road_hazard_full_credit_max_wear_pct and otherwise at tire_unit_price times
      tire_msr_remaining_usable_fraction; the new tire is charged at tire_msr_current_tire_price per
      replacement_tire_price_basis, so the member pays the difference. Mounting, balancing and a valve stem
      for the replacement are free where road_hazard_replacement_install_included is true and charged at the
      package's per-tire price otherwise. A credit is applied only to the replacement and is never paid out in
      cash while road_hazard_credit_cash_out is false. A matching full-size spare bought in the set is covered
      where full_size_spare_covered is true. The replacement keeps the package's remaining term where
      replacement_inherits_remaining_term is true. Damage from collision, vandalism, off-road or racing use,
      improper inflation or mechanical faults of the vehicle is not a road hazard.
    eligibility:
      - id: road_hazard_term
        applies_to: [tire_road_hazard_replaced]
        kind: time
        condition: A road hazard replacement is made only when the damage is brought to a Tire Center no later than road_hazard_term_months calendar months after the installation date of the package.
        evidence_fields: [tire_holdings.install_date, tire_holdings.tire_service_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_holdings.tire_service_id]
          action_bindings:
            tire_holdings.tire_service_id: tire_service_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the installation date of the package
          anchor_source: tire_holdings.install_date
          relation: not_after
          duration_source: variants.road_hazard_term_months
          unit: calendar_months
          counting_rule: Calendar months are added to the installation date and, when the resulting month has no such day, the boundary falls on that month's last day.
          boundary: inclusive
      - id: tread_above_coverage_end
        applies_to: [tire_road_hazard_replaced]
        kind: authorization
        condition: A tire is covered only while its remaining_tread_32nds is above coverage_end_tread_32nds.
        evidence_fields: [tire_services.remaining_tread_32nds, tire_services.tire_service_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_services.tire_service_id]
          action_bindings:
            tire_services.tire_service_id: tire_service_id
      - id: replacement_count_limit
        applies_to: [tire_road_hazard_replaced]
        kind: authorization
        condition: A package receives at most road_hazard_replacements_max road hazard replacements, counted by tire_msr_road_hazard_replacements.
        evidence_fields: [tire_services.tire_service_id, tire_services.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_services.tire_service_id]
          action_bindings:
            tire_services.tire_service_id: tire_service_id
    measures: [tire_msr_road_hazard_replacements, tire_msr_wear_pct, tire_msr_remaining_usable_fraction, tire_msr_current_tire_price]
    params:
      per_tier:
        Northgate Tire Mount & Balance: {covered: "=road_hazard_included", term_months: "=road_hazard_term_months", causes: "=road_hazard_covered_causes", full_credit_wear_pct: "=road_hazard_full_credit_max_wear_pct", max_replacements: "=road_hazard_replacements_max", free_install: "=road_hazard_replacement_install_included", spare: "=full_size_spare_covered", proration: "=road_hazard_proration_basis", cash_out: "=road_hazard_credit_cash_out", inherits_term: "=replacement_inherits_remaining_term", end_tread: "=coverage_end_tread_32nds", new_tread: "=new_tread_depth_32nds", price_basis: "=replacement_tire_price_basis", measured_at: "=tread_measurement_point"}
        Northgate Tire Installation Package: {covered: "=road_hazard_included", term_months: "=road_hazard_term_months", causes: "=road_hazard_covered_causes", full_credit_wear_pct: "=road_hazard_full_credit_max_wear_pct", max_replacements: "=road_hazard_replacements_max", free_install: "=road_hazard_replacement_install_included", spare: "=full_size_spare_covered", proration: "=road_hazard_proration_basis", cash_out: "=road_hazard_credit_cash_out", inherits_term: "=replacement_inherits_remaining_term", end_tread: "=coverage_end_tread_32nds", new_tread: "=new_tread_depth_32nds", price_basis: "=replacement_tire_price_basis", measured_at: "=tread_measurement_point"}
        Northgate Light Truck Tire Installation Package: {covered: "=road_hazard_included", term_months: "=road_hazard_term_months", causes: "=road_hazard_covered_causes", full_credit_wear_pct: "=road_hazard_full_credit_max_wear_pct", max_replacements: "=road_hazard_replacements_max", free_install: "=road_hazard_replacement_install_included", spare: "=full_size_spare_covered", proration: "=road_hazard_proration_basis", cash_out: "=road_hazard_credit_cash_out", inherits_term: "=replacement_inherits_remaining_term", end_tread: "=coverage_end_tread_32nds", new_tread: "=new_tread_depth_32nds", price_basis: "=replacement_tire_price_basis", measured_at: "=tread_measurement_point"}
        Northgate Tire Installation Package with Road Hazard: {covered: "=road_hazard_included", term_months: "=road_hazard_term_months", causes: "=road_hazard_covered_causes", full_credit_wear_pct: "=road_hazard_full_credit_max_wear_pct", max_replacements: "=road_hazard_replacements_max", free_install: "=road_hazard_replacement_install_included", spare: "=full_size_spare_covered", proration: "=road_hazard_proration_basis", cash_out: "=road_hazard_credit_cash_out", inherits_term: "=replacement_inherits_remaining_term", end_tread: "=coverage_end_tread_32nds", new_tread: "=new_tread_depth_32nds", price_basis: "=replacement_tire_price_basis", measured_at: "=tread_measurement_point"}
        Northgate Premium Tire Care: {covered: "=road_hazard_included", term_months: "=road_hazard_term_months", causes: "=road_hazard_covered_causes", full_credit_wear_pct: "=road_hazard_full_credit_max_wear_pct", max_replacements: "=road_hazard_replacements_max", free_install: "=road_hazard_replacement_install_included", spare: "=full_size_spare_covered", proration: "=road_hazard_proration_basis", cash_out: "=road_hazard_credit_cash_out", inherits_term: "=replacement_inherits_remaining_term", end_tread: "=coverage_end_tread_32nds", new_tread: "=new_tread_depth_32nds", price_basis: "=replacement_tire_price_basis", measured_at: "=tread_measurement_point"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {covered: "=road_hazard_included", term_months: "=road_hazard_term_months", causes: "=road_hazard_covered_causes", full_credit_wear_pct: "=road_hazard_full_credit_max_wear_pct", max_replacements: "=road_hazard_replacements_max", free_install: "=road_hazard_replacement_install_included", spare: "=full_size_spare_covered", proration: "=road_hazard_proration_basis", cash_out: "=road_hazard_credit_cash_out", inherits_term: "=replacement_inherits_remaining_term", end_tread: "=coverage_end_tread_32nds", new_tread: "=new_tread_depth_32nds", price_basis: "=replacement_tire_price_basis", measured_at: "=tread_measurement_point"}
    formula:
      road_hazard_credit: tire_unit_price if tire_msr_wear_pct <= road_hazard_full_credit_max_wear_pct else round(tire_unit_price * tire_msr_remaining_usable_fraction, 2)
      replacement_charge: tire_msr_current_tire_price

  - id: tire_treadwear_warranty
    subject: [tire_treadwear_adjusted, tire_service_credited, tire_service_charged]
    rule: >
      Where treadwear_claim_supported is true, the Tire Center processes the manufacturer's treadwear mileage
      warranty for tires on the package. A tire qualifies for a treadwear claim only when its
      remaining_tread_32nds is at or below treadwear_claim_max_tread_32nds while tire_msr_miles_driven is below
      treadwear_warranty_miles. The claim also requires proof of regular rotation: tire_msr_max_rotation_gap_miles
      may not exceed treadwear_rotation_max_interval_miles. The credit is tire_unit_price times the miles
      remaining on the warranty divided by treadwear_warranty_miles, per treadwear_proration_basis, rounded to
      the cent; the replacement of the same item is charged at tire_msr_current_tire_price and installed at
      the package's per-tire price. A tire model with treadwear_warranty_miles of zero has no treadwear
      warranty. Uneven wear caused by alignment or suspension faults, and tires already replaced under road
      hazard protection, are not treadwear claims. A credit is applied only to the replacement.
    eligibility:
      - id: worn_before_warranty_miles
        applies_to: [tire_treadwear_adjusted]
        kind: authorization
        condition: A tire qualifies for a treadwear claim only when its remaining_tread_32nds is at or below treadwear_claim_max_tread_32nds while tire_msr_miles_driven is below treadwear_warranty_miles.
        evidence_fields: [tire_holdings.install_odometer, tire_holdings.treadwear_warranty_miles, tire_holdings.tire_service_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_holdings.tire_service_id]
          action_bindings:
            tire_holdings.tire_service_id: tire_service_id
      - id: rotation_records
        applies_to: [tire_treadwear_adjusted]
        kind: authorization
        condition: The claim also requires proof of regular rotation
        evidence_fields: [tire_services.odometer_miles, tire_services.event_type, tire_services.tire_service_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_services.tire_service_id]
          action_bindings:
            tire_services.tire_service_id: tire_service_id
    measures: [tire_msr_miles_driven, tire_msr_max_rotation_gap_miles, tire_msr_current_tire_price]
    params:
      per_tier:
        Northgate Tire Mount & Balance: {supported: "=treadwear_claim_supported", worn_at: "=treadwear_claim_max_tread_32nds", max_gap: "=treadwear_rotation_max_interval_miles", proration: "=treadwear_proration_basis", install_price: "=package_price_per_tire_usd"}
        Northgate Tire Installation Package: {supported: "=treadwear_claim_supported", worn_at: "=treadwear_claim_max_tread_32nds", max_gap: "=treadwear_rotation_max_interval_miles", proration: "=treadwear_proration_basis", install_price: "=package_price_per_tire_usd"}
        Northgate Light Truck Tire Installation Package: {supported: "=treadwear_claim_supported", worn_at: "=treadwear_claim_max_tread_32nds", max_gap: "=treadwear_rotation_max_interval_miles", proration: "=treadwear_proration_basis", install_price: "=package_price_per_tire_usd"}
        Northgate Tire Installation Package with Road Hazard: {supported: "=treadwear_claim_supported", worn_at: "=treadwear_claim_max_tread_32nds", max_gap: "=treadwear_rotation_max_interval_miles", proration: "=treadwear_proration_basis", install_price: "=package_price_per_tire_usd"}
        Northgate Premium Tire Care: {supported: "=treadwear_claim_supported", worn_at: "=treadwear_claim_max_tread_32nds", max_gap: "=treadwear_rotation_max_interval_miles", proration: "=treadwear_proration_basis", install_price: "=package_price_per_tire_usd"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {supported: "=treadwear_claim_supported", worn_at: "=treadwear_claim_max_tread_32nds", max_gap: "=treadwear_rotation_max_interval_miles", proration: "=treadwear_proration_basis", install_price: "=package_price_per_tire_usd"}
    formula:
      treadwear_credit: round(tire_unit_price * max(0, treadwear_warranty_miles - tire_msr_miles_driven) / treadwear_warranty_miles, 2)

  - id: tire_appointments
    subject: [tire_install_booked, tire_appointment_rescheduled, tire_install_cancelled]
    rule: >
      An installation appointment is booked for tires bought on a Northgate purchase. An appointment is moved
      only while its status is awaiting_install, and at most appointment_reschedules_allowed times. When the
      member misses the appointment the unmounted tires are held tire_hold_days_after_no_show calendar days;
      if no new date is booked by then the installation is cancelled. A cancelled installation leaves nothing
      charged on the package where cancel_refund_before_install is true, and the unmounted tires can be
      returned under the purchase's own return rules. Once mounted, tires are never returnable for a refund
      while mounted_tires_returnable is false — problems with mounted tires are handled by this charter's
      services, road hazard and treadwear rules.
    eligibility:
      - id: reschedule_before_install
        applies_to: [tire_appointment_rescheduled]
        kind: state
        condition: An appointment is moved only while its status is awaiting_install, and at most appointment_reschedules_allowed times.
        evidence_fields: [tire_holdings.status, tire_holdings.tire_service_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_holdings.tire_service_id]
          action_bindings:
            tire_holdings.tire_service_id: tire_service_id
        state_contract:
          field: tire_holdings.status
          allowed: [awaiting_install]
    params:
      per_tier:
        Northgate Tire Mount & Balance: {reschedules: "=appointment_reschedules_allowed", hold_days: "=tire_hold_days_after_no_show", nothing_charged: "=cancel_refund_before_install", mounted_returnable: "=mounted_tires_returnable"}
        Northgate Tire Installation Package: {reschedules: "=appointment_reschedules_allowed", hold_days: "=tire_hold_days_after_no_show", nothing_charged: "=cancel_refund_before_install", mounted_returnable: "=mounted_tires_returnable"}
        Northgate Light Truck Tire Installation Package: {reschedules: "=appointment_reschedules_allowed", hold_days: "=tire_hold_days_after_no_show", nothing_charged: "=cancel_refund_before_install", mounted_returnable: "=mounted_tires_returnable"}
        Northgate Tire Installation Package with Road Hazard: {reschedules: "=appointment_reschedules_allowed", hold_days: "=tire_hold_days_after_no_show", nothing_charged: "=cancel_refund_before_install", mounted_returnable: "=mounted_tires_returnable"}
        Northgate Premium Tire Care: {reschedules: "=appointment_reschedules_allowed", hold_days: "=tire_hold_days_after_no_show", nothing_charged: "=cancel_refund_before_install", mounted_returnable: "=mounted_tires_returnable"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {reschedules: "=appointment_reschedules_allowed", hold_days: "=tire_hold_days_after_no_show", nothing_charged: "=cancel_refund_before_install", mounted_returnable: "=mounted_tires_returnable"}

  - id: tire_package_end
    subject: [tire_set_retired, tire_service_credited]
    rule: >
      A package ends — is retired — when the member reports the vehicle sold or the set removed from it, when
      every tire of the set has been replaced outside the package, or when a full new set is installed on the
      vehicle. While package_transferable is false the package and every remaining protection end with the
      sale of the vehicle and never pass to the buyer or to another vehicle. Retirement refunds nothing: the
      installation package is a one-time service charge. The only refund of a package charge is a
      package_refund credit when the Tire Center charged a component the package includes or charged twice for
      the same component, credited against that exact charge.
    eligibility:
      - id: refund_once_per_charge
        applies_to: [tire_service_credited]
        kind: dedup
        condition: The only refund of a package charge is a package_refund credit when the Tire Center charged a component the package includes or charged twice for the same component, credited against that exact charge.
        evidence_fields: [tire_services.source_event_id, tire_services.charge_component]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tire_services.source_event_id]
          action_bindings:
            tire_services.source_event_id: source_event_id
        dedup_contract:
          table: tire_services
          mode: separate_record
          object_bindings: {source_event_id: source_event_id}
          duplicate_filters: {charge_component: [package_refund]}
          distinct_fields: []
    params:
      per_tier:
        Northgate Tire Mount & Balance: {transferable: "=package_transferable"}
        Northgate Tire Installation Package: {transferable: "=package_transferable"}
        Northgate Light Truck Tire Installation Package: {transferable: "=package_transferable"}
        Northgate Tire Installation Package with Road Hazard: {transferable: "=package_transferable"}
        Northgate Premium Tire Care: {transferable: "=package_transferable"}
        Northgate Light Truck Tire Installation Package with Road Hazard: {transferable: "=package_transferable"}

extended_policies:
  - id: tire_ext_claim_fitting_charge
    base_policy_refs: [tire_installation_charges, tire_lifetime_services, tire_road_hazard_protection, tire_treadwear_warranty]
    overwrite:
      - base_policy: tire_treadwear_warranty
        superseded_clause: >-
          installed at the package's per-tire price
        replaced_by: >-
          The three claim fitting rates are first multiplied together into one combined rate, and the package's per-tire
          price is multiplied once by that combined rate, giving the rated claim fitting charge; the rates do not act one
          after another on separately rounded amounts.
    trigger: state_due
    subject: [tire_service_charged]
    computes: amount
    target_tool: post_claim_fitting_charge_0bdb2547
    params:
      full_rate: 1.0
      plus_long_rate: 0.5
      plus_rate: 0.75
      long_member_months: 120
      many_replacements: 3
      two_replacements: 2
      many_rate: 0.8
      two_rate: 0.9
      visa_rate: 0.9
      store_card_rate: 0.95
      prorate_below_share: 0.6
      full_from_share: 0.9
    rule: >
      This rule settles the claim fitting charge: the installation_package charge member services books for the one
      wheel whose tire was replaced under the treadwear mileage warranty, dated on the work order of the most recent
      treadwear claim entry recorded on the package and booked against that claim entry. The claim fitting charge is the
      package's package_price_per_tire_usd for the one tire fitted, rounded to the cent. The claim fitting member rate is
      read from the membership whose card was presented on the tires' purchase, its tenure being the whole calendar
      months from that membership's opened date to the service date of the claim entry (a month counts once its day of
      the month is reached): a Plus tier membership (plus_premium_usd above zero) with a tenure of at least
      long_member_months takes plus_long_rate; a Plus tier membership with a tenure below long_member_months takes
      plus_rate; a membership that is not a Plus tier takes full_rate. The claim fitting replacement rate is read from the
      count of road hazard replacement entries and treadwear claim entries recorded on the package together, whatever their service dates, entries dated after the claim entry included: a count of
      at least many_replacements takes many_rate; a count of exactly two_replacements takes two_rate; a count below
      two_replacements takes full_rate. The claim fitting tender rate is read from the primary tender of the tires'
      purchase: northgate_visa takes visa_rate; northgate_store_card takes store_card_rate; any other tender takes
      full_rate. The three claim fitting rates are first multiplied together into one combined rate, and the package's
      per-tire price is multiplied once by that combined rate, giving the rated claim fitting charge; the rates do not
      act one after another on separately rounded amounts. The claim fitting usage share is the miles driven from the
      package's installation odometer to the odometer on the claim entry, divided by the tire's
      treadwear_warranty_miles. Where the claim fitting usage share is below prorate_below_share, the claim fitting
      charge is the rated claim fitting charge multiplied by that share; where it is at least prorate_below_share and
      below full_from_share, the claim fitting charge is the rated claim fitting charge multiplied by one half of the sum
      of one and that share; where it is at least full_from_share, the claim fitting charge is the rated claim fitting
      charge in full. The claim fitting charge is rounded to the cent once, at the end, and no rate or intermediate
      amount is rounded on its own.
    prerequisite: []
    cross_category:
      - category: membership
        as: branch
        reads: [variant_name, opened_date, plus_premium_usd]
        note: the claim fitting member rate is decided from the Plus status and tenure of the membership presented on the tires' purchase
      - category: order
        as: branch
        reads: [membership_id, tender]
        note: the claim fitting tender rate is decided from the tires' purchase tender, and the purchase names the membership presented
    compute:
      - fit_claim_date: "LATEST('tire_services', 'service_date', date_field='service_date', event_type='tire_treadwear_adjusted')"
      - fit_mid: "CFIELD('order', 'membership_id', order_id=F('order_id'))"
      - fit_plus_premium: "CPARAM('membership', 'plus_premium_usd', membership_id=fit_mid)"
      - fit_member_months: "MONTHS(CFIELD('membership', 'opened_date', membership_id=fit_mid), fit_claim_date)"
      - fit_member_rate: "K('plus_long_rate') if (fit_plus_premium > 0 and fit_member_months >= K('long_member_months')) else (K('plus_rate') if (fit_plus_premium > 0 and fit_member_months < K('long_member_months')) else K('full_rate'))"
      - fit_replacements: "COUNT('tire_services', event_type='tire_road_hazard_replaced') + COUNT('tire_services', event_type='tire_treadwear_adjusted')"
      - fit_replacement_rate: "K('many_rate') if fit_replacements >= K('many_replacements') else (K('two_rate') if fit_replacements == K('two_replacements') else K('full_rate'))"
      - fit_tender: "CFIELD('order', 'tender', order_id=F('order_id'))"
      - fit_tender_rate: "K('visa_rate') if fit_tender == 'northgate_visa' else (K('store_card_rate') if fit_tender == 'northgate_store_card' else K('full_rate'))"
      - fit_rated_charge: "P('package_price_per_tire_usd') * (fit_member_rate * fit_replacement_rate * fit_tender_rate)"
      - fit_claim_odo: "LATEST('tire_services', 'odometer_miles', date_field='service_date', event_type='tire_treadwear_adjusted')"
      - fit_usage_share: "(fit_claim_odo - F('install_odometer')) / F('treadwear_warranty_miles')"
      - fit_usage_charge: "fit_rated_charge * fit_usage_share if fit_usage_share < K('prorate_below_share') else (fit_rated_charge * (1 + fit_usage_share) / 2 if fit_usage_share < K('full_from_share') else fit_rated_charge)"
      - result: "RND(fit_usage_charge, 2)"
    compute_basis:
      fit_claim_date: "its tenure being the whole calendar months from that membership's opened date to the service date of the claim entry (a month counts once its day of the month is reached)"
      fit_mid: "The claim fitting member rate is read from the membership whose card was presented on the tires' purchase"
      fit_plus_premium: "a Plus tier membership (plus_premium_usd above zero)"
      fit_member_months: "its tenure being the whole calendar months from that membership's opened date to the service date of the claim entry (a month counts once its day of the month is reached)"
      fit_member_rate: "a Plus tier membership (plus_premium_usd above zero) with a tenure of at least long_member_months takes plus_long_rate; a Plus tier membership with a tenure below long_member_months takes plus_rate; a membership that is not a Plus tier takes full_rate."
      fit_replacements: "The claim fitting replacement rate is read from the count of road hazard replacement entries and treadwear claim entries recorded on the package together, whatever their service dates, entries dated after the claim entry included"
      fit_replacement_rate: "a count of at least many_replacements takes many_rate; a count of exactly two_replacements takes two_rate; a count below two_replacements takes full_rate."
      fit_tender: "The claim fitting tender rate is read from the primary tender of the tires' purchase"
      fit_tender_rate: "northgate_visa takes visa_rate; northgate_store_card takes store_card_rate; any other tender takes full_rate."
      fit_rated_charge: "The three claim fitting rates are first multiplied together into one combined rate, and the package's per-tire price is multiplied once by that combined rate, giving the rated claim fitting charge; the rates do not act one after another on separately rounded amounts."
      fit_claim_odo: "The claim fitting usage share is the miles driven from the package's installation odometer to the odometer on the claim entry"
      fit_usage_share: "The claim fitting usage share is the miles driven from the package's installation odometer to the odometer on the claim entry, divided by the tire's treadwear_warranty_miles."
      fit_usage_charge: "Where the claim fitting usage share is below prorate_below_share, the claim fitting charge is the rated claim fitting charge multiplied by that share; where it is at least prorate_below_share and below full_from_share, the claim fitting charge is the rated claim fitting charge multiplied by one half of the sum of one and that share; where it is at least full_from_share, the claim fitting charge is the rated claim fitting charge in full."
      result: "The claim fitting charge is rounded to the cent once, at the end, and no rate or intermediate amount is rounded on its own."
    factors:
      - id: claim_fitting_member_rate
        effect: parameter
        decides: fit_member_rate
        bindings: [fit_claim_date, fit_mid, fit_plus_premium, fit_member_months, fit_member_rate]
        ladder:
          - when: "the membership presented on the tires' purchase is a Plus tier and its tenure to the claim entry is at least long_member_months"
            value: "K('plus_long_rate')"
          - when: "the membership presented on the tires' purchase is a Plus tier and its tenure to the claim entry is below long_member_months"
            value: "K('plus_rate')"
          - when: "otherwise (the membership is not a Plus tier)"
            value: "K('full_rate')"
        baseline:
          fit_member_rate: "K('full_rate')"
        evidence: [cross_category, date]
        cross_difficulty: membership
      - id: claim_fitting_replacement_rate
        effect: parameter
        decides: fit_replacement_rate
        bindings: [fit_replacements, fit_replacement_rate]
        ladder:
          - when: "the package records at least many_replacements road hazard replacement and treadwear claim entries together"
            value: "K('many_rate')"
          - when: "the package records exactly two_replacements such entries"
            value: "K('two_rate')"
          - when: "otherwise (fewer than two_replacements such entries)"
            value: "K('full_rate')"
        baseline:
          fit_replacement_rate: "K('full_rate')"
        evidence: [history]
        cross_difficulty: null
      - id: claim_fitting_tender_rate
        effect: parameter
        decides: fit_tender_rate
        bindings: [fit_tender, fit_tender_rate]
        ladder:
          - when: "the tires' purchase was paid with northgate_visa"
            value: "K('visa_rate')"
          - when: "the tires' purchase was paid with northgate_store_card"
            value: "K('store_card_rate')"
          - when: "otherwise (any other tender)"
            value: "K('full_rate')"
        baseline:
          fit_tender_rate: "K('full_rate')"
        evidence: [cross_category]
        cross_difficulty: order
      - id: claim_fitting_usage_share
        effect: method
        decides: fit_usage_charge
        bindings: [fit_claim_odo, fit_usage_share, fit_usage_charge]
        ladder:
          - when: "the miles driven to the claim entry are below prorate_below_share of the tire's treadwear_warranty_miles"
            method: "the rated claim fitting charge is multiplied by the claim fitting usage share (pro rata to the warranty miles used)"
          - when: "the miles driven to the claim entry are at least prorate_below_share and below full_from_share of the treadwear_warranty_miles"
            method: "the rated claim fitting charge is multiplied by one half of the sum of one and the claim fitting usage share"
          - when: "otherwise (at least full_from_share of the treadwear_warranty_miles used)"
            method: "the rated claim fitting charge is taken in full"
        baseline:
          fit_usage_charge: "fit_rated_charge"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The claim fitting charge is the package's package_price_per_tire_usd for the one tire fitted, rounded to the cent.
      params: [package_price_per_tire_usd]
    inputs:
      history:
        - {table: tire_services, aggregate: latest, field: service_date, filters: {event_type: tire_treadwear_adjusted}}
        - {table: tire_services, aggregate: latest, field: odometer_miles, filters: {event_type: tire_treadwear_adjusted}}
        - {table: tire_services, aggregate: count, field: tire_event_id, filters: {event_type: tire_road_hazard_replaced}}
        - {table: tire_services, aggregate: count, field: tire_event_id, filters: {event_type: tire_treadwear_adjusted}}
      cross_category: [membership, order]

  - id: tire_ext_treadwear_credit
    base_policy_refs: [tire_road_hazard_protection, tire_treadwear_warranty, tire_package_end]
    overwrite:
      - base_policy: tire_treadwear_warranty
        superseded_clause: >-
          The credit is tire_unit_price times the miles remaining on the warranty divided by treadwear_warranty_miles, per
          treadwear_proration_basis, rounded to the cent
        replaced_by: >-
          The treadwear price basis is multiplied by the treadwear remaining mileage share, giving the prorated treadwear
          amount, and that amount is multiplied once by the product of the treadwear rotation factor and the treadwear
          tread factor; the treadwear late-settlement allowance and the treadwear membership-years allowance are then
          added to that result, and the sum is rounded to the cent once, at the end.
    trigger: state_due
    subject: [tire_service_credited]
    computes: amount
    target_tool: post_treadwear_credit_0e44552f
    params:
      early_claim_months: 36
      late_claim_months: 60
      plus_extension: 1.1
      paid_extension: 1.05
      no_extension: 1.0
      full_fee_floor: 65.0
      fair_interval_miles: 7000
      kept_uplift: 1.1
      regular_uplift: 1.05
      no_uplift: 1.0
      bald_tread: 0
      bald_rate: 0.8
      below_legal_rate: 0.9
      no_reduction: 1.0
      long_delay_days: 180
      delay_days: 90
      long_delay_allowance: 10.0
      delay_allowance: 5.0
      no_allowance: 0.0
      long_member_years: 15
      member_years: 10
      long_member_allowance: 12.0
      member_allowance: 6.0
    rule: >
      This rule settles the treadwear credit member services books against the most recent treadwear claim entry
      recorded on the package, for the wheel position on that claim entry, and the credit is applied only toward that
      wheel's replacement. The treadwear credit is the price paid per tire, multiplied by the treadwear remaining
      mileage share and rounded to the cent. The price paid per tire is tire_unit_price less every price adjustment and
      every mail-in rebate credited per unit on the tires' purchase line for the tire item number, and is
      tire_unit_price where none was credited. The treadwear remaining mileage share is treadwear_warranty_miles less
      the miles driven from the package's installation odometer to the odometer on the claim entry, never below zero,
      divided by treadwear_warranty_miles, and is zero for a tire model whose treadwear_warranty_miles is zero. The
      treadwear price basis compares the price paid per tire with the replacement_tire charge booked against the claim
      entry, according to the whole calendar months from the installation date to the service date of the claim entry
      (a month counts once its day of the month is reached): a claim made fewer than early_claim_months months after
      installation takes the higher of the two; a claim made at least early_claim_months and fewer than
      late_claim_months months after installation takes the replacement_tire charge; a claim made late_claim_months or
      more months after installation takes the price paid per tire. The treadwear mileage factor is read from the
      membership whose card was presented on the tires' purchase: a Plus tier membership (plus_premium_usd above zero)
      takes plus_extension; a membership that is not a Plus tier and whose annual_fee_usd is at least full_fee_floor
      takes paid_extension; any other membership takes no_extension. Where the treadwear mileage factor applies,
      treadwear_warranty_miles is first multiplied by it, and the treadwear remaining mileage share is that extended
      mileage less the miles driven, never below zero, divided by that extended mileage. The treadwear rotation factor
      is read from the average rotation interval, being the miles driven to the claim entry divided by one more than the count of rotation entries recorded on the package, whatever their dates (a rotation entry dated after the claim entry counts too): an average interval of at most
      recommended_rotation_interval_miles takes kept_uplift; an average interval above
      recommended_rotation_interval_miles and at most fair_interval_miles takes regular_uplift; an average interval
      above fair_interval_miles takes no_uplift. The treadwear tread factor is read from the remaining_tread_32nds
      measured on the claim entry: bald_tread or less takes bald_rate; above bald_tread and below
      treadwear_claim_max_tread_32nds takes below_legal_rate; treadwear_claim_max_tread_32nds or more takes
      no_reduction. The treadwear late-settlement allowance is read from the calendar days from the service date of
      the claim entry to the day the credit is booked: more than long_delay_days takes long_delay_allowance; more than
      delay_days and at most long_delay_days takes delay_allowance; delay_days or fewer takes no_allowance. The
      treadwear membership-years allowance is read from the count of membership fee charges on the membership whose
      card was presented on the tires' purchase: long_member_years or more takes long_member_allowance; at least
      member_years and fewer than long_member_years takes member_allowance; fewer than member_years takes
      no_allowance. The treadwear price basis is multiplied by the treadwear remaining mileage share, giving the
      prorated treadwear amount, and that amount is multiplied once by the product of the treadwear rotation factor and
      the treadwear tread factor; the treadwear late-settlement allowance and the treadwear membership-years allowance
      are then added to that result, and the sum is rounded to the cent once, at the end. A treadwear credit is not
      booked until the wheel replaced under that claim carries its claim fitting charge on the package.
    prerequisite:
      - problem: tire_ext_claim_fitting_charge
        kind: state_gate
        gate: tire_services.charge_component
        form: state
        policy_source: >-
          A treadwear credit is not booked until the wheel replaced under that claim carries its claim fitting charge on
          the package.
        condition: >-
          An installation_package charge entry whose source_event_id is the treadwear claim entry stands among the
          package's tire_services entries.
        resolved_by: post_claim_fitting_charge_0bdb2547
        effect: >-
          Once the claim fitting charge is booked against the claim entry, the replacement the credit is applied toward
          carries its fitting on the package and the treadwear credit may be booked.
    cross_category:
      - category: order
        as: history
        reads: [membership_id, order_lines.unit_price]
        note: the price paid per tire nets the price adjustment and mail-in rebate lines of the tires' purchase, and the purchase names the membership presented
      - category: membership
        as: history
        reads: [plus_premium_usd, annual_fee_usd, membership_transactions.event_type]
        note: the treadwear mileage factor is decided from the tier of the presented membership and the membership-years allowance from its fee ledger
    compute:
      - tw_claim_id: "LATEST('tire_services', 'tire_event_id', date_field='service_date', event_type='tire_treadwear_adjusted')"
      - tw_claim_date: "LATEST('tire_services', 'service_date', date_field='service_date', event_type='tire_treadwear_adjusted')"
      - tw_claim_odo: "LATEST('tire_services', 'odometer_miles', date_field='service_date', event_type='tire_treadwear_adjusted')"
      - tw_miles: "tw_claim_odo - F('install_odometer')"
      - tw_adj_unit: "XSUM('order', 'order_lines', 'unit_price', event_type='order_price_adjusted', order_id=F('order_id'), item_number=F('tire_item_number'))"
      - tw_rebate_unit: "XSUM('order', 'order_lines', 'unit_price', event_type='order_rebate_credited', order_id=F('order_id'), item_number=F('tire_item_number'))"
      - tw_price_paid: "F('tire_unit_price') - tw_adj_unit - tw_rebate_unit"
      - tw_current_price: "SUM('tire_services', 'amount', event_type='tire_service_charged', charge_component='replacement_tire', source_event_id=tw_claim_id)"
      - tw_claim_months: "MONTHS(F('install_date'), tw_claim_date)"
      - tw_price_basis: "MX(tw_price_paid, tw_current_price) if tw_claim_months < K('early_claim_months') else (tw_current_price if tw_claim_months < K('late_claim_months') else tw_price_paid)"
      - tw_mid: "CFIELD('order', 'membership_id', order_id=F('order_id'))"
      - tw_plus_premium: "CPARAM('membership', 'plus_premium_usd', membership_id=tw_mid)"
      - tw_member_fee: "CPARAM('membership', 'annual_fee_usd', membership_id=tw_mid)"
      - tw_mileage_factor: "K('plus_extension') if tw_plus_premium > 0 else (K('paid_extension') if tw_member_fee >= K('full_fee_floor') else K('no_extension'))"
      - tw_warranty_miles: "F('treadwear_warranty_miles') * tw_mileage_factor"
      - tw_remaining_share: "(MX(0, tw_warranty_miles - tw_miles) / tw_warranty_miles) if tw_warranty_miles > 0 else 0"
      - tw_rotations: "COUNT('tire_services', event_type='tire_rotation_performed')"
      - tw_avg_interval: "tw_miles / (tw_rotations + 1)"
      - tw_rotation_factor: "K('kept_uplift') if tw_avg_interval <= P('recommended_rotation_interval_miles') else (K('regular_uplift') if tw_avg_interval <= K('fair_interval_miles') else K('no_uplift'))"
      - tw_claim_tread: "LATEST('tire_services', 'remaining_tread_32nds', date_field='service_date', event_type='tire_treadwear_adjusted')"
      - tw_tread_factor: "K('bald_rate') if tw_claim_tread <= K('bald_tread') else (K('below_legal_rate') if tw_claim_tread < P('treadwear_claim_max_tread_32nds') else K('no_reduction'))"
      - tw_days_open: "DAYS(tw_claim_date, NOW)"
      - tw_late_allowance: "K('long_delay_allowance') if tw_days_open > K('long_delay_days') else (K('delay_allowance') if tw_days_open > K('delay_days') else K('no_allowance'))"
      - tw_fee_years: "XCOUNT('membership', 'membership_transactions', event_type='membership_fee_charged', membership_id=tw_mid)"
      - tw_member_allowance: "K('long_member_allowance') if tw_fee_years >= K('long_member_years') else (K('member_allowance') if tw_fee_years >= K('member_years') else K('no_allowance'))"
      - tw_credit: "tw_price_basis * tw_remaining_share * (tw_rotation_factor * tw_tread_factor) + tw_late_allowance + tw_member_allowance"
      - result: "RND(tw_credit, 2)"
    compute_basis:
      tw_claim_id: "This rule settles the treadwear credit member services books against the most recent treadwear claim entry recorded on the package"
      tw_claim_date: "according to the whole calendar months from the installation date to the service date of the claim entry (a month counts once its day of the month is reached)"
      tw_claim_odo: "the miles driven from the package's installation odometer to the odometer on the claim entry"
      tw_miles: "the miles driven from the package's installation odometer to the odometer on the claim entry"
      tw_adj_unit: "The price paid per tire is tire_unit_price less every price adjustment and every mail-in rebate credited per unit on the tires' purchase line for the tire item number"
      tw_rebate_unit: "The price paid per tire is tire_unit_price less every price adjustment and every mail-in rebate credited per unit on the tires' purchase line for the tire item number"
      tw_price_paid: "The price paid per tire is tire_unit_price less every price adjustment and every mail-in rebate credited per unit on the tires' purchase line for the tire item number, and is tire_unit_price where none was credited."
      tw_current_price: "The treadwear price basis compares the price paid per tire with the replacement_tire charge booked against the claim entry"
      tw_claim_months: "according to the whole calendar months from the installation date to the service date of the claim entry (a month counts once its day of the month is reached)"
      tw_price_basis: "a claim made fewer than early_claim_months months after installation takes the higher of the two; a claim made at least early_claim_months and fewer than late_claim_months months after installation takes the replacement_tire charge; a claim made late_claim_months or more months after installation takes the price paid per tire."
      tw_mid: "The treadwear mileage factor is read from the membership whose card was presented on the tires' purchase"
      tw_plus_premium: "a Plus tier membership (plus_premium_usd above zero) takes plus_extension"
      tw_member_fee: "a membership that is not a Plus tier and whose annual_fee_usd is at least full_fee_floor takes paid_extension"
      tw_mileage_factor: "a Plus tier membership (plus_premium_usd above zero) takes plus_extension; a membership that is not a Plus tier and whose annual_fee_usd is at least full_fee_floor takes paid_extension; any other membership takes no_extension."
      tw_warranty_miles: "Where the treadwear mileage factor applies, treadwear_warranty_miles is first multiplied by it"
      tw_remaining_share: "the treadwear remaining mileage share is that extended mileage less the miles driven, never below zero, divided by that extended mileage."
      tw_rotations: "the count of rotation entries recorded on the package"
      tw_avg_interval: "The treadwear rotation factor is read from the average rotation interval, being the miles driven to the claim entry divided by one more than the count of rotation entries recorded on the package, whatever their dates (a rotation entry dated after the claim entry counts too)"
      tw_rotation_factor: "an average interval of at most recommended_rotation_interval_miles takes kept_uplift; an average interval above recommended_rotation_interval_miles and at most fair_interval_miles takes regular_uplift; an average interval above fair_interval_miles takes no_uplift."
      tw_claim_tread: "The treadwear tread factor is read from the remaining_tread_32nds measured on the claim entry"
      tw_tread_factor: "bald_tread or less takes bald_rate; above bald_tread and below treadwear_claim_max_tread_32nds takes below_legal_rate; treadwear_claim_max_tread_32nds or more takes no_reduction."
      tw_days_open: "The treadwear late-settlement allowance is read from the calendar days from the service date of the claim entry to the day the credit is booked"
      tw_late_allowance: "more than long_delay_days takes long_delay_allowance; more than delay_days and at most long_delay_days takes delay_allowance; delay_days or fewer takes no_allowance."
      tw_fee_years: "The treadwear membership-years allowance is read from the count of membership fee charges on the membership whose card was presented on the tires' purchase"
      tw_member_allowance: "long_member_years or more takes long_member_allowance; at least member_years and fewer than long_member_years takes member_allowance; fewer than member_years takes no_allowance."
      tw_credit: "The treadwear price basis is multiplied by the treadwear remaining mileage share, giving the prorated treadwear amount, and that amount is multiplied once by the product of the treadwear rotation factor and the treadwear tread factor; the treadwear late-settlement allowance and the treadwear membership-years allowance are then added to that result"
      result: "the sum is rounded to the cent once, at the end."
    factors:
      - id: treadwear_price_basis
        effect: method
        decides: tw_price_basis
        bindings: [tw_current_price, tw_claim_months, tw_price_basis]
        ladder:
          - when: "the claim entry is dated fewer than early_claim_months whole months after installation"
            method: "the higher of the price paid per tire and the replacement_tire charge booked against the claim entry is taken"
          - when: "the claim entry is dated at least early_claim_months and fewer than late_claim_months whole months after installation"
            method: "the replacement_tire charge booked against the claim entry is taken"
          - when: "otherwise (late_claim_months or more whole months after installation)"
            method: "the price paid per tire is taken"
        baseline:
          tw_price_basis: "tw_price_paid"
        evidence: [history, date]
        cross_difficulty: null
      - id: treadwear_mileage_factor
        effect: parameter
        decides: tw_mileage_factor
        bindings: [tw_mid, tw_plus_premium, tw_member_fee, tw_mileage_factor]
        ladder:
          - when: "the membership presented on the tires' purchase is a Plus tier"
            value: "K('plus_extension')"
          - when: "the membership is not a Plus tier and its annual_fee_usd is at least full_fee_floor"
            value: "K('paid_extension')"
          - when: "otherwise (a membership below full_fee_floor)"
            value: "K('no_extension')"
        baseline:
          tw_mileage_factor: "K('no_extension')"
        evidence: [cross_category]
        cross_difficulty: membership
      - id: treadwear_rotation_factor
        effect: parameter
        decides: tw_rotation_factor
        bindings: [tw_rotations, tw_avg_interval, tw_rotation_factor]
        ladder:
          - when: "the average rotation interval is at most recommended_rotation_interval_miles"
            value: "K('kept_uplift')"
          - when: "the average rotation interval is above recommended_rotation_interval_miles and at most fair_interval_miles"
            value: "K('regular_uplift')"
          - when: "otherwise (the average rotation interval is above fair_interval_miles)"
            value: "K('no_uplift')"
        baseline:
          tw_rotation_factor: "K('no_uplift')"
        evidence: [history]
        cross_difficulty: null
      - id: treadwear_tread_factor
        effect: parameter
        decides: tw_tread_factor
        bindings: [tw_claim_tread, tw_tread_factor]
        ladder:
          - when: "the claim entry measured bald_tread or less"
            value: "K('bald_rate')"
          - when: "the claim entry measured above bald_tread and below treadwear_claim_max_tread_32nds"
            value: "K('below_legal_rate')"
          - when: "otherwise (treadwear_claim_max_tread_32nds or more)"
            value: "K('no_reduction')"
        baseline:
          tw_tread_factor: "K('no_reduction')"
        evidence: [history]
        cross_difficulty: null
      - id: treadwear_late_settlement_allowance
        effect: parameter
        decides: tw_late_allowance
        bindings: [tw_days_open, tw_late_allowance]
        ladder:
          - when: "more than long_delay_days calendar days run from the claim entry's service date to the day the credit is booked"
            value: "K('long_delay_allowance')"
          - when: "more than delay_days and at most long_delay_days such days"
            value: "K('delay_allowance')"
          - when: "otherwise (delay_days or fewer)"
            value: "K('no_allowance')"
        baseline:
          tw_late_allowance: "K('no_allowance')"
        evidence: [date]
        cross_difficulty: null
      - id: treadwear_membership_years_allowance
        effect: parameter
        decides: tw_member_allowance
        bindings: [tw_fee_years, tw_member_allowance]
        ladder:
          - when: "the presented membership carries long_member_years or more membership fee charges"
            value: "K('long_member_allowance')"
          - when: "it carries at least member_years and fewer than long_member_years"
            value: "K('member_allowance')"
          - when: "otherwise (fewer than member_years)"
            value: "K('no_allowance')"
        baseline:
          tw_member_allowance: "K('no_allowance')"
        evidence: [cross_category, history]
        cross_difficulty: membership
    baseline:
      rule: >-
        The treadwear credit is the price paid per tire, multiplied by the treadwear remaining mileage share and rounded
        to the cent. The price paid per tire is tire_unit_price less every price adjustment and every mail-in rebate
        credited per unit on the tires' purchase line for the tire item number, and is tire_unit_price where none was
        credited. The treadwear remaining mileage share is treadwear_warranty_miles less the miles driven from the
        package's installation odometer to the odometer on the claim entry, never below zero, divided by
        treadwear_warranty_miles, and is zero for a tire model whose treadwear_warranty_miles is zero.
      params: []
    inputs:
      history:
        - {table: tire_services, aggregate: latest, field: odometer_miles, filters: {event_type: tire_treadwear_adjusted}}
        - {table: tire_services, aggregate: sum, field: amount, filters: {event_type: tire_service_charged, charge_component: replacement_tire}}
        - {table: tire_services, aggregate: count, field: tire_event_id, filters: {event_type: tire_rotation_performed}}
        - {category: order, table: order_lines, aggregate: sum, field: unit_price, filters: {event_type: order_price_adjusted}}
        - {category: order, table: order_lines, aggregate: sum, field: unit_price, filters: {event_type: order_rebate_credited}}
        - {category: membership, table: membership_transactions, aggregate: count, field: membership_txn_id, filters: {event_type: membership_fee_charged}}
      cross_category: [order, membership]

  - id: tire_ext_road_hazard_credit
    base_policy_refs: [tire_road_hazard_protection, tire_treadwear_warranty, tire_package_end]
    overwrite:
      - base_policy: tire_road_hazard_protection
        superseded_clause: >-
          The damaged tire is credited at the full tire_unit_price when tire_msr_wear_pct is at or below
          road_hazard_full_credit_max_wear_pct and otherwise at tire_unit_price times tire_msr_remaining_usable_fraction
        replaced_by: >-
          The road hazard price basis is multiplied once by the product of the road hazard credit share, the road hazard
          sequence share, the road hazard term share and the road hazard member share, and that amount is rounded to the
          cent once, at the end; no share is applied to a separately rounded amount.
    trigger: state_due
    subject: [tire_service_credited]
    computes: amount
    target_tool: accept_road_hazard_credit_d64b14f0
    params:
      full_share: 1.0
      young_tire_months: 12
      second_replacement: 2
      third_replacement: 3
      second_share: 0.9
      third_share: 0.8
      closing_months: 3
      late_months: 6
      closing_share: 0.85
      late_share: 0.95
      plus_visa_uplift: 1.1
      plus_uplift: 1.05
    rule: >
      This rule settles the road hazard credit booked against the most recent road hazard replacement entry recorded on
      the package, for the wheel position on that entry; the member accepts the credit, and it is applied only toward
      that wheel's replacement. The road hazard credit is the road hazard price paid per tire multiplied by the road hazard credit share and rounded to the cent. The road hazard price paid per tire is tire_unit_price reduced by the per-unit price adjustments and per-unit mail-in rebates recorded on the tires' purchase line for the tire item number (tire_unit_price itself where there are none). The road hazard credit share is full_share when the wear of the
      damaged tire, being new_tread_depth_32nds less the remaining_tread_32nds on the replacement entry, divided by
      new_tread_depth_32nds less coverage_end_tread_32nds, times one hundred, is at or below
      road_hazard_full_credit_max_wear_pct, and is otherwise the road hazard usable tread share, being
      remaining_tread_32nds less coverage_end_tread_32nds, divided by new_tread_depth_32nds less coverage_end_tread_32nds,
      never below zero. The road hazard price basis depends on the replacement history of the damaged wheel position: where a treadwear claim entry is recorded for that wheel position, it is the replacement_tire charge booked against the latest such claim entry less the treadwear credit booked against that same claim entry; where no treadwear claim entry is recorded for that wheel position and one or more road hazard replacement entries other than the current one are recorded for it, it is the average net cost of those earlier replacements: the replacement_tire charges booked on that wheel position, leaving out the one booked against the current replacement entry, less the road hazard credits booked on that wheel position, divided by the number of those earlier road hazard replacement entries; where no earlier replacement is recorded on that wheel, it is the road hazard price paid per tire. The tire on the damaged wheel counts as mounted at the package's installation
      odometer and installation date or, where a treadwear claim entry is recorded for that wheel position, at the
      odometer and service date of the latest such claim entry. The road hazard warranty miles share is
      treadwear_warranty_miles less the miles from that mounting odometer to the odometer on the replacement entry, never
      below zero, divided by treadwear_warranty_miles. Where the wear is above road_hazard_full_credit_max_wear_pct, the
      road hazard proration method decides the share: a tire whose treadwear_warranty_miles is above zero and that was on
      the wheel for fewer than young_tire_months whole calendar months up to the service date of the replacement entry
      takes the greater of the road hazard usable tread share and the road hazard warranty miles share; a tire whose
      treadwear_warranty_miles is above zero and that was on the wheel for young_tire_months or more such months takes the
      road hazard warranty miles share; a tire with no treadwear mileage warranty takes the road hazard usable tread
      share. The road hazard sequence share is read from the count of road hazard replacement entries recorded on the
      package, the current one included: a count of at least third_replacement takes third_share; a count of exactly
      second_replacement takes second_share; a count below second_replacement takes full_share. The road hazard term
      share is read from the months of the road_hazard_term_months term still to run, being road_hazard_term_months less
      the whole calendar months from the installation date to the service date of the replacement entry (a month counts
      once its day of the month is reached): fewer than closing_months still to run takes closing_share; at least
      closing_months and fewer than late_months takes late_share; late_months or more takes full_share. The road hazard
      member share is read from the membership whose card was presented on the tires' purchase and from that purchase's
      primary tender: a Plus tier membership (plus_premium_usd above zero) with the purchase paid by northgate_visa takes
      plus_visa_uplift; a Plus tier membership with the purchase paid by any other tender takes plus_uplift; a membership
      that is not a Plus tier takes full_share. The road hazard price basis is multiplied once by the product of the road
      hazard credit share, the road hazard sequence share, the road hazard term share and the road hazard member share,
      and that amount is rounded to the cent once, at the end; no share is applied to a separately rounded amount. The
      road hazard credit on a tire fitted under a treadwear claim is fixed only after that claim's treadwear credit stands
      on the package.
    prerequisite:
      - problem: tire_ext_treadwear_credit
        kind: value_input
        gate: rh_tw_credit
        form: state
        policy_source: >-
          The road hazard credit on a tire fitted under a treadwear claim is fixed only after that claim's treadwear credit
          stands on the package.
        condition: >-
          A treadwear_credit entry whose source_event_id is the latest treadwear claim entry of the damaged wheel position
          stands among the package's tire_services entries.
        resolved_by: post_treadwear_credit_0e44552f
        effect: >-
          The treadwear credit booked against the wheel's claim entry is subtracted from that claim's replacement_tire
          charge, so the road hazard price basis falls from the gross replacement charge to what the member paid net.
    cross_category:
      - category: order
        as: history
        reads: [membership_id, tender, order_lines.unit_price]
        note: the road hazard price paid per tire nets the price adjustment and rebate lines of the tires' purchase, and the purchase tender feeds the member share
      - category: membership
        as: branch
        reads: [plus_premium_usd]
        note: the road hazard member share is decided from the Plus status of the membership presented on the tires' purchase together with the purchase tender
    compute:
      - rh_det_date: "LATEST('tire_services', 'service_date', date_field='service_date', event_type='tire_road_hazard_replaced')"
      - rh_pos: "LATEST('tire_services', 'tire_position', date_field='service_date', event_type='tire_road_hazard_replaced')"
      - rh_odo: "LATEST('tire_services', 'odometer_miles', date_field='service_date', event_type='tire_road_hazard_replaced')"
      - rh_tread: "LATEST('tire_services', 'remaining_tread_32nds', date_field='service_date', event_type='tire_road_hazard_replaced')"
      - rh_wear_pct: "(P('new_tread_depth_32nds') - rh_tread) / (P('new_tread_depth_32nds') - P('coverage_end_tread_32nds')) * 100"
      - rh_tread_share: "MX(0, (rh_tread - P('coverage_end_tread_32nds')) / (P('new_tread_depth_32nds') - P('coverage_end_tread_32nds')))"
      - rh_tw_count: "COUNT('tire_services', event_type='tire_treadwear_adjusted', tire_position=rh_pos)"
      - rh_tw_id: "LATEST('tire_services', 'tire_event_id', date_field='service_date', event_type='tire_treadwear_adjusted', tire_position=rh_pos)"
      - rh_tw_charge: "SUM('tire_services', 'amount', event_type='tire_service_charged', charge_component='replacement_tire', source_event_id=rh_tw_id)"
      - rh_tw_credit: "SUM('tire_services', 'amount', event_type='tire_service_credited', charge_component='treadwear_credit', source_event_id=rh_tw_id)"
      - rh_adj_unit: "XSUM('order', 'order_lines', 'unit_price', event_type='order_price_adjusted', order_id=F('order_id'), item_number=F('tire_item_number'))"
      - rh_rebate_unit: "XSUM('order', 'order_lines', 'unit_price', event_type='order_rebate_credited', order_id=F('order_id'), item_number=F('tire_item_number'))"
      - rh_det_id: "LATEST('tire_services', 'tire_event_id', date_field='service_date', event_type='tire_road_hazard_replaced')"
      - rh_price_paid: "F('tire_unit_price') - rh_adj_unit - rh_rebate_unit"
      - rh_pos_rh_count: "COUNT('tire_services', event_type='tire_road_hazard_replaced', tire_position=rh_pos)"
      - rh_pos_repl_charges: "SUM('tire_services', 'amount', event_type='tire_service_charged', charge_component='replacement_tire', tire_position=rh_pos)"
      - rh_cur_charge: "SUM('tire_services', 'amount', event_type='tire_service_charged', charge_component='replacement_tire', source_event_id=rh_det_id)"
      - rh_pos_rh_credits: "SUM('tire_services', 'amount', event_type='tire_service_credited', charge_component='road_hazard_credit', tire_position=rh_pos)"
      - rh_price_basis: "(rh_tw_charge - rh_tw_credit) if rh_tw_count > 0 else (((rh_pos_repl_charges - rh_cur_charge - rh_pos_rh_credits) / (rh_pos_rh_count - 1)) if (rh_tw_count == 0 and rh_pos_rh_count >= 2) else rh_price_paid)"
      - rh_mount_odo: "LATEST('tire_services', 'odometer_miles', date_field='service_date', event_type='tire_treadwear_adjusted', tire_position=rh_pos) if rh_tw_count > 0 else F('install_odometer')"
      - rh_mount_date: "LATEST('tire_services', 'service_date', date_field='service_date', event_type='tire_treadwear_adjusted', tire_position=rh_pos) if rh_tw_count > 0 else F('install_date')"
      - rh_miles_share: "(MX(0, F('treadwear_warranty_miles') - (rh_odo - rh_mount_odo)) / F('treadwear_warranty_miles')) if F('treadwear_warranty_miles') > 0 else 0"
      - rh_months_on_wheel: "MONTHS(rh_mount_date, rh_det_date)"
      - rh_prorated_share: "MX(rh_tread_share, rh_miles_share) if (F('treadwear_warranty_miles') > 0 and rh_months_on_wheel < K('young_tire_months')) else (rh_miles_share if (F('treadwear_warranty_miles') > 0 and rh_months_on_wheel >= K('young_tire_months')) else rh_tread_share)"
      - rh_credit_share: "K('full_share') if rh_wear_pct <= P('road_hazard_full_credit_max_wear_pct') else rh_prorated_share"
      - rh_count: "COUNT('tire_services', event_type='tire_road_hazard_replaced')"
      - rh_sequence_share: "K('third_share') if rh_count >= K('third_replacement') else (K('second_share') if rh_count == K('second_replacement') else K('full_share'))"
      - rh_term_left: "P('road_hazard_term_months') - MONTHS(F('install_date'), rh_det_date)"
      - rh_term_share: "K('closing_share') if rh_term_left < K('closing_months') else (K('late_share') if rh_term_left < K('late_months') else K('full_share'))"
      - rh_mid: "CFIELD('order', 'membership_id', order_id=F('order_id'))"
      - rh_plus_premium: "CPARAM('membership', 'plus_premium_usd', membership_id=rh_mid)"
      - rh_tender: "CFIELD('order', 'tender', order_id=F('order_id'))"
      - rh_member_share: "K('plus_visa_uplift') if (rh_plus_premium > 0 and rh_tender == 'northgate_visa') else (K('plus_uplift') if (rh_plus_premium > 0 and rh_tender != 'northgate_visa') else K('full_share'))"
      - rh_credit: "rh_price_basis * (rh_credit_share * rh_sequence_share * rh_term_share * rh_member_share)"
      - result: "RND(rh_credit, 2)"
    compute_basis:
      rh_det_date: "This rule settles the road hazard credit booked against the most recent road hazard replacement entry recorded on the package, for the wheel position on that entry"
      rh_pos: "This rule settles the road hazard credit booked against the most recent road hazard replacement entry recorded on the package, for the wheel position on that entry"
      rh_odo: "the miles from that mounting odometer to the odometer on the replacement entry"
      rh_tread: "new_tread_depth_32nds less the remaining_tread_32nds on the replacement entry"
      rh_wear_pct: "the wear of the damaged tire, being new_tread_depth_32nds less the remaining_tread_32nds on the replacement entry, divided by new_tread_depth_32nds less coverage_end_tread_32nds, times one hundred"
      rh_tread_share: "the road hazard usable tread share, being remaining_tread_32nds less coverage_end_tread_32nds, divided by new_tread_depth_32nds less coverage_end_tread_32nds, never below zero."
      rh_tw_count: "where a treadwear claim entry is recorded for that wheel position"
      rh_tw_id: "the replacement_tire charge booked against the latest such claim entry less the treadwear credit booked against that same claim entry"
      rh_tw_charge: "the replacement_tire charge booked against the latest such claim entry less the treadwear credit booked against that same claim entry"
      rh_tw_credit: "the replacement_tire charge booked against the latest such claim entry less the treadwear credit booked against that same claim entry"
      rh_adj_unit: "The road hazard price paid per tire is tire_unit_price reduced by the per-unit price adjustments and per-unit mail-in rebates recorded on the tires' purchase line for the tire item number (tire_unit_price itself where there are none)."
      rh_rebate_unit: "The road hazard price paid per tire is tire_unit_price reduced by the per-unit price adjustments and per-unit mail-in rebates recorded on the tires' purchase line for the tire item number (tire_unit_price itself where there are none)."
      rh_det_id: "This rule settles the road hazard credit booked against the most recent road hazard replacement entry recorded on the package"
      rh_price_paid: "The road hazard price paid per tire is tire_unit_price reduced by the per-unit price adjustments and per-unit mail-in rebates recorded on the tires' purchase line for the tire item number (tire_unit_price itself where there are none)."
      rh_pos_rh_count: "one or more road hazard replacement entries other than the current one are recorded for it"
      rh_pos_repl_charges: "the replacement_tire charges booked on that wheel position, leaving out the one booked against the current replacement entry, less the road hazard credits booked on that wheel position, divided by the number of those earlier road hazard replacement entries"
      rh_cur_charge: "leaving out the one booked against the current replacement entry"
      rh_pos_rh_credits: "less the road hazard credits booked on that wheel position"
      rh_price_basis: "where a treadwear claim entry is recorded for that wheel position, it is the replacement_tire charge booked against the latest such claim entry less the treadwear credit booked against that same claim entry; where no treadwear claim entry is recorded for that wheel position and one or more road hazard replacement entries other than the current one are recorded for it, it is the average net cost of those earlier replacements: the replacement_tire charges booked on that wheel position, leaving out the one booked against the current replacement entry, less the road hazard credits booked on that wheel position, divided by the number of those earlier road hazard replacement entries; where no earlier replacement is recorded on that wheel, it is the road hazard price paid per tire."
      rh_mount_odo: "The tire on the damaged wheel counts as mounted at the package's installation odometer and installation date or, where a treadwear claim entry is recorded for that wheel position, at the odometer and service date of the latest such claim entry."
      rh_mount_date: "The tire on the damaged wheel counts as mounted at the package's installation odometer and installation date or, where a treadwear claim entry is recorded for that wheel position, at the odometer and service date of the latest such claim entry."
      rh_miles_share: "The road hazard warranty miles share is treadwear_warranty_miles less the miles from that mounting odometer to the odometer on the replacement entry, never below zero, divided by treadwear_warranty_miles."
      rh_months_on_wheel: "that was on the wheel for fewer than young_tire_months whole calendar months up to the service date of the replacement entry"
      rh_prorated_share: "a tire whose treadwear_warranty_miles is above zero and that was on the wheel for fewer than young_tire_months whole calendar months up to the service date of the replacement entry takes the greater of the road hazard usable tread share and the road hazard warranty miles share; a tire whose treadwear_warranty_miles is above zero and that was on the wheel for young_tire_months or more such months takes the road hazard warranty miles share; a tire with no treadwear mileage warranty takes the road hazard usable tread share."
      rh_credit_share: "The road hazard credit share is full_share when the wear of the damaged tire, being new_tread_depth_32nds less the remaining_tread_32nds on the replacement entry, divided by new_tread_depth_32nds less coverage_end_tread_32nds, times one hundred, is at or below road_hazard_full_credit_max_wear_pct, and is otherwise the road hazard usable tread share"
      rh_count: "The road hazard sequence share is read from the count of road hazard replacement entries recorded on the package, the current one included"
      rh_sequence_share: "a count of at least third_replacement takes third_share; a count of exactly second_replacement takes second_share; a count below second_replacement takes full_share."
      rh_term_left: "being road_hazard_term_months less the whole calendar months from the installation date to the service date of the replacement entry (a month counts once its day of the month is reached)"
      rh_term_share: "fewer than closing_months still to run takes closing_share; at least closing_months and fewer than late_months takes late_share; late_months or more takes full_share."
      rh_mid: "The road hazard member share is read from the membership whose card was presented on the tires' purchase and from that purchase's primary tender"
      rh_plus_premium: "a Plus tier membership (plus_premium_usd above zero)"
      rh_tender: "The road hazard member share is read from the membership whose card was presented on the tires' purchase and from that purchase's primary tender"
      rh_member_share: "a Plus tier membership (plus_premium_usd above zero) with the purchase paid by northgate_visa takes plus_visa_uplift; a Plus tier membership with the purchase paid by any other tender takes plus_uplift; a membership that is not a Plus tier takes full_share."
      rh_credit: "The road hazard price basis is multiplied once by the product of the road hazard credit share, the road hazard sequence share, the road hazard term share and the road hazard member share"
      result: "that amount is rounded to the cent once, at the end; no share is applied to a separately rounded amount."
    factors:
      - id: road_hazard_price_basis
        effect: method
        decides: rh_price_basis
        bindings: [rh_tw_count, rh_tw_id, rh_tw_charge, rh_tw_credit, rh_pos_rh_count, rh_pos_repl_charges, rh_cur_charge, rh_pos_rh_credits, rh_price_basis]
        ladder:
          - when: "a treadwear claim entry is recorded for the damaged wheel position"
            method: "the replacement_tire charge booked against the latest such claim entry less the treadwear credit booked against it"
          - when: "no treadwear claim entry is recorded for that wheel position and one or more road hazard replacement entries other than the current one are"
            method: "the average net cost of the earlier replacements: the replacement_tire charges booked on that wheel position, leaving out the current entry's, less the road hazard credits booked on it, divided by the number of earlier road hazard replacement entries"
          - when: "otherwise (no earlier replacement recorded on that wheel)"
            method: "the road hazard price paid per tire"
        baseline:
          rh_price_basis: "rh_price_paid"
        evidence: [history]
        cross_difficulty: null
      - id: road_hazard_proration_method
        effect: method
        decides: rh_prorated_share
        bindings: [rh_mount_odo, rh_mount_date, rh_miles_share, rh_months_on_wheel, rh_prorated_share]
        ladder:
          - when: "the tire carries treadwear_warranty_miles above zero and was on the wheel fewer than young_tire_months whole months"
            method: "the greater of the road hazard usable tread share and the road hazard warranty miles share"
          - when: "the tire carries treadwear_warranty_miles above zero and was on the wheel young_tire_months or more whole months"
            method: "the road hazard warranty miles share"
          - when: "otherwise (no treadwear mileage warranty)"
            method: "the road hazard usable tread share"
        baseline:
          rh_prorated_share: "rh_tread_share"
        evidence: [history, date]
        cross_difficulty: null
      - id: road_hazard_sequence_share
        effect: parameter
        decides: rh_sequence_share
        bindings: [rh_count, rh_sequence_share]
        ladder:
          - when: "the package records at least third_replacement road hazard replacement entries, the current one included"
            value: "K('third_share')"
          - when: "the package records exactly second_replacement such entries"
            value: "K('second_share')"
          - when: "otherwise (fewer than second_replacement)"
            value: "K('full_share')"
        baseline:
          rh_sequence_share: "K('full_share')"
        evidence: [history]
        cross_difficulty: null
      - id: road_hazard_term_share
        effect: parameter
        decides: rh_term_share
        bindings: [rh_term_left, rh_term_share]
        ladder:
          - when: "fewer than closing_months of the road hazard term still run at the replacement entry"
            value: "K('closing_share')"
          - when: "at least closing_months and fewer than late_months still run"
            value: "K('late_share')"
          - when: "otherwise (late_months or more still run)"
            value: "K('full_share')"
        baseline:
          rh_term_share: "K('full_share')"
        evidence: [date]
        cross_difficulty: null
      - id: road_hazard_member_share
        effect: parameter
        decides: rh_member_share
        bindings: [rh_mid, rh_plus_premium, rh_tender, rh_member_share]
        ladder:
          - when: "the membership presented on the tires' purchase is a Plus tier and the purchase was paid by northgate_visa"
            value: "K('plus_visa_uplift')"
          - when: "the membership is a Plus tier and the purchase was paid by another tender"
            value: "K('plus_uplift')"
          - when: "otherwise (not a Plus tier)"
            value: "K('full_share')"
        baseline:
          rh_member_share: "K('full_share')"
        evidence: [cross_category]
        cross_difficulty: membership
    baseline:
      rule: >-
        The road hazard credit is the road hazard price paid per tire multiplied by the road hazard credit share and rounded to the cent. The road hazard price paid per tire is tire_unit_price reduced by the per-unit price adjustments and per-unit mail-in rebates recorded on the tires' purchase line for the tire item number (tire_unit_price itself where there are none). The road hazard credit share is full_share when the wear of the damaged tire, being
        new_tread_depth_32nds less the remaining_tread_32nds on the replacement entry, divided by new_tread_depth_32nds less
        coverage_end_tread_32nds, times one hundred, is at or below road_hazard_full_credit_max_wear_pct, and is otherwise
        the road hazard usable tread share, being remaining_tread_32nds less coverage_end_tread_32nds, divided by
        new_tread_depth_32nds less coverage_end_tread_32nds, never below zero.
      params: [full_share, road_hazard_full_credit_max_wear_pct, new_tread_depth_32nds, coverage_end_tread_32nds]
    inputs:
      history:
        - {table: tire_services, aggregate: latest, field: remaining_tread_32nds, filters: {event_type: tire_road_hazard_replaced}}
        - {table: tire_services, aggregate: count, field: tire_event_id, filters: {event_type: tire_road_hazard_replaced}}
        - {table: tire_services, aggregate: sum, field: amount, filters: {event_type: tire_service_credited, charge_component: treadwear_credit}}
        - {table: tire_services, aggregate: sum, field: amount, filters: {event_type: tire_service_charged, charge_component: replacement_tire}}
        - {category: order, table: order_lines, aggregate: sum, field: unit_price, filters: {event_type: order_price_adjusted}}
      cross_category: [order, membership]

  - id: tire_ext_service_rotation_charge
    base_policy_refs: [tire_installation_charges, tire_lifetime_services, tire_road_hazard_protection, tire_treadwear_warranty]
    overwrite:
      - base_policy: tire_lifetime_services
        superseded_clause: >-
          Rotations are free where lifetime_rotation_included is true and otherwise cost rotation_fee_usd per visit
        replaced_by: >-
          The rotation work charge is multiplied once by the product of the rotation member rate, the rotation loyalty
          rate, the rotation tender rate and the rotation package-age rate, and that amount is rounded to the cent once,
          at the end; no rate is applied to a separately rounded amount.
      - base_policy: tire_lifetime_services
        superseded_clause: >-
          Rebalancing is free where lifetime_rebalance_included is true and otherwise costs rebalance_fee_per_tire_usd per
          tire
        replaced_by: >-
          Rebalancing done on a rotation visit is neither a separate per-tire charge nor an entry of its own: it is part of the rotation work charge booked in the one rotation_balance entry, and the rotation rates below scale it together with the rotation fee; this exception governs only the rotation_balance entry this rule books, the make-up of every other entry is settled by the rule that books that entry, and a fee that no rule folds into another entry stays its own entry at its own fee.
      - base_policy: tire_lifetime_services
        superseded_clause: >-
          Each fee is its own entry on the visit's service date
        replaced_by: >-
          Rebalancing done on a rotation visit is neither a separate per-tire charge nor an entry of its own: it is part of the rotation work charge booked in the one rotation_balance entry, and the rotation rates below scale it together with the rotation fee; this exception governs only the rotation_balance entry this rule books, the make-up of every other entry is settled by the rule that books that entry, and a fee that no rule folds into another entry stays its own entry at its own fee.
    trigger: state_due
    subject: [tire_service_charged]
    computes: amount
    target_tool: authorize_rotation_charge_d4760d29
    params:
      full_rate: 1.0
      plus_rate: 0.6
      business_rate: 0.8
      member_months: 60
      two_paid: 2
      one_paid: 1
      two_paid_rate: 0.75
      one_paid_rate: 0.9
      visa_rate: 0.9
      store_card_rate: 0.95
      first_year_months: 12
      second_year_months: 24
      first_year_rate: 0.5
      second_year_rate: 0.75
      half_set: 2
    rule: >
      This rule settles the rotation charge for the most recent rotation entry recorded on the package: one
      rotation_balance charge for the whole set, dated on that rotation's work order, which the member authorises.
      The rotation charge is the package's rotation_fee_usd for the visit, rounded to the cent, so a package whose
      rotation_fee_usd is zero is charged nothing. The rotation work method depends on the miles from the odometer of
      the last rotation charge booked on the package (or, where none is booked, from the installation odometer) to the
      odometer on the rotation entry: more than treadwear_rotation_max_interval_miles is charged as rotation_fee_usd plus
      rebalance_fee_per_tire_usd for every tire in tire_count, because an overdue set is rebalanced in full; more than
      recommended_rotation_interval_miles and at most treadwear_rotation_max_interval_miles is charged as rotation_fee_usd
      plus rebalance_fee_per_tire_usd for tire_count divided by half_set tires, the pair moved to the front axle;
      recommended_rotation_interval_miles or fewer is charged as rotation_fee_usd alone. Rebalancing done on a rotation visit is neither a separate per-tire charge nor an entry of its own: it is part of the rotation work charge booked in the one rotation_balance entry, and the rotation rates below scale it together with the rotation fee; this exception governs only the rotation_balance entry this rule books, the make-up of every other entry is settled by the rule that books that entry, and a fee that no rule folds into another entry stays its own entry at its own fee. The rotation member rate is read
      from the membership whose card was presented on the tires' purchase, its tenure being the whole calendar months
      from that membership's opened date to the service date of the rotation entry (a month counts once its day of the
      month is reached): a Plus tier membership (plus_premium_usd above zero) with a tenure of at least member_months
      takes plus_rate; a membership that is not a Plus tier, whose membership_segment is business and whose tenure is at
      least member_months takes business_rate; any other membership takes full_rate. The rotation loyalty rate is read
      from the count of rotation_balance charges booked on the package with a service date within the last 12 whole
      calendar months before today (a charge dated 12 or more whole months ago does not count): two_paid or more takes
      two_paid_rate; exactly one_paid takes one_paid_rate; none takes full_rate. The rotation tender rate is read from
      the primary tender of the tires' purchase: northgate_visa takes visa_rate; northgate_store_card takes
      store_card_rate; any other tender takes full_rate. The rotation package-age rate is read from the whole calendar
      months from the package's installation date to the service date of the rotation entry: fewer than
      first_year_months takes first_year_rate; at least first_year_months and fewer than second_year_months takes
      second_year_rate; second_year_months or more takes full_rate. The rotation work charge is multiplied once by the
      product of the rotation member rate, the rotation loyalty rate, the rotation tender rate and the rotation
      package-age rate, and that amount is rounded to the cent once, at the end; no rate is applied to a separately
      rounded amount.
    prerequisite: []
    cross_category:
      - category: order
        as: branch
        reads: [membership_id, tender]
        note: the rotation tender rate is decided from the tires' purchase tender, and the purchase names the membership presented
      - category: membership
        as: branch
        reads: [plus_premium_usd, membership_segment, opened_date]
        note: the rotation member rate is decided from the tier, segment and tenure of the membership presented on the tires' purchase
    compute:
      - rot_visit_date: "LATEST('tire_services', 'service_date', date_field='service_date', event_type='tire_rotation_performed')"
      - rot_visit_odo: "LATEST('tire_services', 'odometer_miles', date_field='service_date', event_type='tire_rotation_performed')"
      - rot_paid_count: "COUNT('tire_services', event_type='tire_service_charged', charge_component='rotation_balance')"
      - rot_prev_odo: "LATEST('tire_services', 'odometer_miles', date_field='service_date', event_type='tire_service_charged', charge_component='rotation_balance') if rot_paid_count > 0 else F('install_odometer')"
      - rot_gap: "rot_visit_odo - rot_prev_odo"
      - rot_work_charge: "(P('rotation_fee_usd') + P('rebalance_fee_per_tire_usd') * F('tire_count')) if rot_gap > P('treadwear_rotation_max_interval_miles') else ((P('rotation_fee_usd') + P('rebalance_fee_per_tire_usd') * F('tire_count') / K('half_set')) if rot_gap > P('recommended_rotation_interval_miles') else P('rotation_fee_usd'))"
      - rot_mid: "CFIELD('order', 'membership_id', order_id=F('order_id'))"
      - rot_plus_premium: "CPARAM('membership', 'plus_premium_usd', membership_id=rot_mid)"
      - rot_segment: "CPARAM('membership', 'membership_segment', membership_id=rot_mid)"
      - rot_member_months: "MONTHS(CFIELD('membership', 'opened_date', membership_id=rot_mid), rot_visit_date)"
      - rot_member_rate: "K('plus_rate') if (rot_plus_premium > 0 and rot_member_months >= K('member_months')) else (K('business_rate') if (rot_plus_premium == 0 and rot_segment == 'business' and rot_member_months >= K('member_months')) else K('full_rate'))"
      - rot_paid_12m: "COUNT('tire_services', within_months=12, date_field='service_date', event_type='tire_service_charged', charge_component='rotation_balance')"
      - rot_loyalty_rate: "K('two_paid_rate') if rot_paid_12m >= K('two_paid') else (K('one_paid_rate') if rot_paid_12m == K('one_paid') else K('full_rate'))"
      - rot_tender: "CFIELD('order', 'tender', order_id=F('order_id'))"
      - rot_tender_rate: "K('visa_rate') if rot_tender == 'northgate_visa' else (K('store_card_rate') if rot_tender == 'northgate_store_card' else K('full_rate'))"
      - rot_package_months: "MONTHS(F('install_date'), rot_visit_date)"
      - rot_age_rate: "K('first_year_rate') if rot_package_months < K('first_year_months') else (K('second_year_rate') if rot_package_months < K('second_year_months') else K('full_rate'))"
      - rot_charge: "rot_work_charge * (rot_member_rate * rot_loyalty_rate * rot_tender_rate * rot_age_rate)"
      - result: "RND(rot_charge, 2)"
    compute_basis:
      rot_visit_date: "This rule settles the rotation charge for the most recent rotation entry recorded on the package"
      rot_visit_odo: "to the odometer on the rotation entry"
      rot_paid_count: "the odometer of the last rotation charge booked on the package (or, where none is booked, from the installation odometer)"
      rot_prev_odo: "the odometer of the last rotation charge booked on the package (or, where none is booked, from the installation odometer)"
      rot_gap: "The rotation work method depends on the miles from the odometer of the last rotation charge booked on the package (or, where none is booked, from the installation odometer) to the odometer on the rotation entry"
      rot_work_charge: "more than treadwear_rotation_max_interval_miles is charged as rotation_fee_usd plus rebalance_fee_per_tire_usd for every tire in tire_count, because an overdue set is rebalanced in full; more than recommended_rotation_interval_miles and at most treadwear_rotation_max_interval_miles is charged as rotation_fee_usd plus rebalance_fee_per_tire_usd for tire_count divided by half_set tires, the pair moved to the front axle; recommended_rotation_interval_miles or fewer is charged as rotation_fee_usd alone. Rebalancing done on a rotation visit is neither a separate per-tire charge nor an entry of its own: it is part of the rotation work charge booked in the one rotation_balance entry, and the rotation rates below scale it together with the rotation fee; this exception governs only the rotation_balance entry this rule books, the make-up of every other entry is settled by the rule that books that entry, and a fee that no rule folds into another entry stays its own entry at its own fee."
      rot_mid: "The rotation member rate is read from the membership whose card was presented on the tires' purchase"
      rot_plus_premium: "a Plus tier membership (plus_premium_usd above zero)"
      rot_segment: "a membership that is not a Plus tier, whose membership_segment is business"
      rot_member_months: "its tenure being the whole calendar months from that membership's opened date to the service date of the rotation entry (a month counts once its day of the month is reached)"
      rot_member_rate: "a Plus tier membership (plus_premium_usd above zero) with a tenure of at least member_months takes plus_rate; a membership that is not a Plus tier, whose membership_segment is business and whose tenure is at least member_months takes business_rate; any other membership takes full_rate."
      rot_paid_12m: "The rotation loyalty rate is read from the count of rotation_balance charges booked on the package with a service date within the last 12 whole calendar months before today (a charge dated 12 or more whole months ago does not count)"
      rot_loyalty_rate: "two_paid or more takes two_paid_rate; exactly one_paid takes one_paid_rate; none takes full_rate."
      rot_tender: "The rotation tender rate is read from the primary tender of the tires' purchase"
      rot_tender_rate: "northgate_visa takes visa_rate; northgate_store_card takes store_card_rate; any other tender takes full_rate."
      rot_package_months: "The rotation package-age rate is read from the whole calendar months from the package's installation date to the service date of the rotation entry"
      rot_age_rate: "fewer than first_year_months takes first_year_rate; at least first_year_months and fewer than second_year_months takes second_year_rate; second_year_months or more takes full_rate."
      rot_charge: "The rotation work charge is multiplied once by the product of the rotation member rate, the rotation loyalty rate, the rotation tender rate and the rotation package-age rate"
      result: "that amount is rounded to the cent once, at the end; no rate is applied to a separately rounded amount."
    factors:
      - id: rotation_work_method
        effect: method
        decides: rot_work_charge
        bindings: [rot_visit_odo, rot_paid_count, rot_prev_odo, rot_gap, rot_work_charge]
        ladder:
          - when: "more than treadwear_rotation_max_interval_miles since the last rotation charge (or installation)"
            method: "rotation_fee_usd plus rebalance_fee_per_tire_usd for every tire in tire_count"
          - when: "more than recommended_rotation_interval_miles and at most treadwear_rotation_max_interval_miles"
            method: "rotation_fee_usd plus rebalance_fee_per_tire_usd for tire_count divided by half_set tires"
          - when: "otherwise (recommended_rotation_interval_miles or fewer)"
            method: "rotation_fee_usd alone"
        baseline:
          rot_work_charge: "P('rotation_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: rotation_member_rate
        effect: parameter
        decides: rot_member_rate
        bindings: [rot_visit_date, rot_mid, rot_plus_premium, rot_segment, rot_member_months, rot_member_rate]
        ladder:
          - when: "the membership presented on the tires' purchase is a Plus tier with a tenure of at least member_months"
            value: "K('plus_rate')"
          - when: "it is not a Plus tier, its segment is business and its tenure is at least member_months"
            value: "K('business_rate')"
          - when: "otherwise"
            value: "K('full_rate')"
        baseline:
          rot_member_rate: "K('full_rate')"
        evidence: [cross_category, date]
        cross_difficulty: membership
      - id: rotation_loyalty_rate
        effect: parameter
        decides: rot_loyalty_rate
        bindings: [rot_paid_12m, rot_loyalty_rate]
        ladder:
          - when: "two_paid or more rotation charges dated within the last 12 whole months"
            value: "K('two_paid_rate')"
          - when: "exactly one_paid such charge"
            value: "K('one_paid_rate')"
          - when: "otherwise (none)"
            value: "K('full_rate')"
        baseline:
          rot_loyalty_rate: "K('full_rate')"
        evidence: [history]
        cross_difficulty: null
      - id: rotation_tender_rate
        effect: parameter
        decides: rot_tender_rate
        bindings: [rot_tender, rot_tender_rate]
        ladder:
          - when: "the tires' purchase was paid with northgate_visa"
            value: "K('visa_rate')"
          - when: "the tires' purchase was paid with northgate_store_card"
            value: "K('store_card_rate')"
          - when: "otherwise (any other tender)"
            value: "K('full_rate')"
        baseline:
          rot_tender_rate: "K('full_rate')"
        evidence: [cross_category]
        cross_difficulty: order
      - id: rotation_package_age_rate
        effect: parameter
        decides: rot_age_rate
        bindings: [rot_package_months, rot_age_rate]
        ladder:
          - when: "the rotation entry is dated fewer than first_year_months whole months after installation"
            value: "K('first_year_rate')"
          - when: "at least first_year_months and fewer than second_year_months whole months after installation"
            value: "K('second_year_rate')"
          - when: "otherwise (second_year_months or more)"
            value: "K('full_rate')"
        baseline:
          rot_age_rate: "K('full_rate')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The rotation charge is the package's rotation_fee_usd for the visit, rounded to the cent, so a package whose
        rotation_fee_usd is zero is charged nothing.
      params: [rotation_fee_usd]
    inputs:
      history:
        - {table: tire_services, aggregate: latest, field: odometer_miles, filters: {event_type: tire_rotation_performed}}
        - {table: tire_services, aggregate: latest, field: odometer_miles, filters: {event_type: tire_service_charged, charge_component: rotation_balance}}
        - {table: tire_services, aggregate: count, field: tire_event_id, within_months: 12, filters: {event_type: tire_service_charged, charge_component: rotation_balance}}
      cross_category: [order, membership]

  - id: tire_ext_flat_repair_charge
    base_policy_refs: [tire_installation_charges, tire_lifetime_services, tire_road_hazard_protection, tire_treadwear_warranty]
    overwrite:
      - base_policy: tire_lifetime_services
        superseded_clause: >-
          repairable flats are free where flat_repair_included is true and otherwise cost flat_repair_fee_usd
        replaced_by: >-
          The flat repair work charge is multiplied once by the product of the flat repair bundle rate, the flat repair
          member rate and the flat repair mileage rate, and that amount is rounded to the cent once, at the end; no rate
          is applied to a separately rounded amount.
      - base_policy: tire_lifetime_services
        superseded_clause: >-
          Each fee is its own entry on the visit's service date
        replaced_by: >-
          On a repeat repair the sensor seal kit and the rebalancing are neither booked as entries of their own nor charged at their own fees: they are part of the one flat repair entry for the wheel, and the flat repair rates below scale them together with the repair fee; this exception governs only the flat_repair entry this rule books, the make-up of any other entry follows the rule that books it, and any fee that no rule folds into another entry, such as the sensor kits charged when a set is installed, remains a separate entry at its own fee.
      - base_policy: tire_lifetime_services
        superseded_clause: >-
          Rebalancing is free where lifetime_rebalance_included is true and otherwise costs rebalance_fee_per_tire_usd per
          tire
        replaced_by: >-
          On a repeat repair the sensor seal kit and the rebalancing are neither booked as entries of their own nor charged at their own fees: they are part of the one flat repair entry for the wheel, and the flat repair rates below scale them together with the repair fee; this exception governs only the flat_repair entry this rule books, the make-up of any other entry follows the rule that books it, and any fee that no rule folds into another entry, such as the sensor kits charged when a set is installed, remains a separate entry at its own fee.
      - base_policy: tire_installation_charges
        superseded_clause: >-
          a tpms_service_kit entry of tpms_service_kit_fee_usd for each wheel with a pressure sensor when that fee is not
          zero
        replaced_by: >-
          On a repeat repair the sensor seal kit and the rebalancing are neither booked as entries of their own nor charged at their own fees: they are part of the one flat repair entry for the wheel, and the flat repair rates below scale them together with the repair fee; this exception governs only the flat_repair entry this rule books, the make-up of any other entry follows the rule that books it, and any fee that no rule folds into another entry, such as the sensor kits charged when a set is installed, remains a separate entry at its own fee.
    trigger: state_due
    subject: [tire_service_charged]
    computes: amount
    target_tool: post_flat_repair_charge_9a2582c0
    params:
      full_rate: 1.0
      deep_tread: 4
      bundle_deep_rate: 0.5
      bundle_rate: 0.75
      long_member_years: 6
      member_years: 3
      long_member_rate: 0.8
      member_rate: 0.9
      one_earlier: 1
      two_earlier: 2
      early_miles: 10000
      mid_miles: 20000
      early_rate: 0.5
      mid_rate: 0.8
    rule: >
      This rule settles the flat repair charge for the most recent flat repair entry recorded on the package: one
      flat_repair charge for the repaired wheel, dated on that repair's work order. The flat repair charge is the
      package's flat_repair_fee_usd for the repaired tire, rounded to the cent, so a package whose flat_repair_fee_usd is
      zero is charged nothing. The flat repair work method depends on the count of earlier flat repair entries recorded
      on the package for the same wheel position, the current repair not counted: two_earlier or more is charged as
      flat_repair_fee_usd plus tpms_service_kit_fee_usd plus rebalance_fee_per_tire_usd, because a tire patched again is
      dismounted with a new sensor seal kit and rebalanced; exactly one_earlier is charged as flat_repair_fee_usd plus
      tpms_service_kit_fee_usd; none is charged as flat_repair_fee_usd alone. On a repeat repair the sensor seal kit and the rebalancing are neither booked as entries of their own nor charged at their own fees: they are part of the one flat repair entry for the wheel, and the flat repair rates below scale them together with the repair fee; this exception governs only the flat_repair entry this rule books, the make-up of any other entry follows the rule that books it, and any fee that no rule folds into another entry, such as the sensor kits charged when a set is installed, remains a separate entry at its own fee. The flat repair bundle rate is read from the
      rotation charge booked on the package with the same service date as the repair and from the remaining_tread_32nds
      measured on the repaired tire: a rotation charge above zero on that date with the tire measured at deep_tread or
      more takes bundle_deep_rate; a rotation charge above zero on that date with the tire measured below deep_tread takes
      bundle_rate; no rotation charge above zero on that date takes full_rate. The flat repair member rate is read from
      the count of membership fee charges on the membership whose card was presented on the tires' purchase: long_member_years
      or more takes long_member_rate; at least member_years and fewer than long_member_years takes member_rate; fewer
      than member_years takes full_rate. The flat repair mileage rate is read from the miles from the package's
      installation odometer to the odometer on the repair entry: fewer than early_miles takes early_rate; at least
      early_miles and fewer than mid_miles takes mid_rate; mid_miles or more takes full_rate. The flat repair work charge
      is multiplied once by the product of the flat repair bundle rate, the flat repair member rate and the flat repair
      mileage rate, and that amount is rounded to the cent once, at the end; no rate is applied to a separately rounded
      amount. The flat repair charge for a work order is fixed only after the rotation logged on that same work order
      carries its rotation charge on the package.
    prerequisite:
      - problem: tire_ext_service_rotation_charge
        kind: value_input
        gate: fl_rotation_paid
        form: state
        policy_source: >-
          The flat repair charge for a work order is fixed only after the rotation logged on that same work order carries
          its rotation charge on the package.
        condition: >-
          A rotation_balance charge entry whose service_date equals the flat repair entry's service_date stands among the
          package's tire_services entries.
        resolved_by: authorize_rotation_charge_d4760d29
        effect: >-
          Once the rotation charge of the same work order stands, fl_rotation_paid rises above zero and the flat repair
          bundle rate moves from full_rate to bundle_deep_rate or bundle_rate.
    cross_category:
      - category: order
        as: branch
        reads: [membership_id]
        note: the purchase names the membership whose fee ledger decides the flat repair member rate
      - category: membership
        as: history
        reads: [membership_transactions.event_type]
        note: the flat repair member rate is decided from the count of membership fee charges on the presented membership
    compute:
      - fl_visit_date: "LATEST('tire_services', 'service_date', date_field='service_date', event_type='tire_flat_repaired')"
      - fl_pos: "LATEST('tire_services', 'tire_position', date_field='service_date', event_type='tire_flat_repaired')"
      - fl_tread: "LATEST('tire_services', 'remaining_tread_32nds', date_field='service_date', event_type='tire_flat_repaired')"
      - fl_odo: "LATEST('tire_services', 'odometer_miles', date_field='service_date', event_type='tire_flat_repaired')"
      - fl_earlier: "COUNT('tire_services', event_type='tire_flat_repaired', tire_position=fl_pos) - 1"
      - fl_work_charge: "(P('flat_repair_fee_usd') + P('tpms_service_kit_fee_usd') + P('rebalance_fee_per_tire_usd')) if fl_earlier >= K('two_earlier') else ((P('flat_repair_fee_usd') + P('tpms_service_kit_fee_usd')) if fl_earlier == K('one_earlier') else P('flat_repair_fee_usd'))"
      - fl_rotation_paid: "SUM('tire_services', 'amount', event_type='tire_service_charged', charge_component='rotation_balance', service_date=fl_visit_date)"
      - fl_bundle_rate: "K('bundle_deep_rate') if (fl_rotation_paid > 0 and fl_tread >= K('deep_tread')) else (K('bundle_rate') if (fl_rotation_paid > 0 and fl_tread < K('deep_tread')) else K('full_rate'))"
      - fl_mid: "CFIELD('order', 'membership_id', order_id=F('order_id'))"
      - fl_fee_count: "XCOUNT('membership', 'membership_transactions', event_type='membership_fee_charged', membership_id=fl_mid)"
      - fl_member_rate: "K('long_member_rate') if fl_fee_count >= K('long_member_years') else (K('member_rate') if fl_fee_count >= K('member_years') else K('full_rate'))"
      - fl_miles: "fl_odo - F('install_odometer')"
      - fl_mileage_rate: "K('early_rate') if fl_miles < K('early_miles') else (K('mid_rate') if fl_miles < K('mid_miles') else K('full_rate'))"
      - fl_charge: "fl_work_charge * (fl_bundle_rate * fl_member_rate * fl_mileage_rate)"
      - result: "RND(fl_charge, 2)"
    compute_basis:
      fl_visit_date: "This rule settles the flat repair charge for the most recent flat repair entry recorded on the package"
      fl_pos: "one flat_repair charge for the repaired wheel, dated on that repair's work order"
      fl_tread: "the remaining_tread_32nds measured on the repaired tire"
      fl_odo: "to the odometer on the repair entry"
      fl_earlier: "The flat repair work method depends on the count of earlier flat repair entries recorded on the package for the same wheel position, the current repair not counted"
      fl_work_charge: "two_earlier or more is charged as flat_repair_fee_usd plus tpms_service_kit_fee_usd plus rebalance_fee_per_tire_usd, because a tire patched again is dismounted with a new sensor seal kit and rebalanced; exactly one_earlier is charged as flat_repair_fee_usd plus tpms_service_kit_fee_usd; none is charged as flat_repair_fee_usd alone. On a repeat repair the sensor seal kit and the rebalancing are neither booked as entries of their own nor charged at their own fees: they are part of the one flat repair entry for the wheel, and the flat repair rates below scale them together with the repair fee; this exception governs only the flat_repair entry this rule books, the make-up of any other entry follows the rule that books it, and any fee that no rule folds into another entry, such as the sensor kits charged when a set is installed, remains a separate entry at its own fee."
      fl_rotation_paid: "The flat repair bundle rate is read from the rotation charge booked on the package with the same service date as the repair"
      fl_bundle_rate: "a rotation charge above zero on that date with the tire measured at deep_tread or more takes bundle_deep_rate; a rotation charge above zero on that date with the tire measured below deep_tread takes bundle_rate; no rotation charge above zero on that date takes full_rate."
      fl_mid: "the membership whose card was presented on the tires' purchase"
      fl_fee_count: "The flat repair member rate is read from the count of membership fee charges on the membership whose card was presented on the tires' purchase"
      fl_member_rate: "long_member_years or more takes long_member_rate; at least member_years and fewer than long_member_years takes member_rate; fewer than member_years takes full_rate."
      fl_miles: "The flat repair mileage rate is read from the miles from the package's installation odometer to the odometer on the repair entry"
      fl_mileage_rate: "fewer than early_miles takes early_rate; at least early_miles and fewer than mid_miles takes mid_rate; mid_miles or more takes full_rate."
      fl_charge: "The flat repair work charge is multiplied once by the product of the flat repair bundle rate, the flat repair member rate and the flat repair mileage rate"
      result: "that amount is rounded to the cent once, at the end; no rate is applied to a separately rounded amount."
    factors:
      - id: flat_repair_work_method
        effect: method
        decides: fl_work_charge
        bindings: [fl_pos, fl_earlier, fl_work_charge]
        ladder:
          - when: "two_earlier or more earlier flat repair entries for the same wheel position"
            method: "flat_repair_fee_usd plus tpms_service_kit_fee_usd plus rebalance_fee_per_tire_usd"
          - when: "exactly one_earlier earlier flat repair entry for that wheel position"
            method: "flat_repair_fee_usd plus tpms_service_kit_fee_usd"
          - when: "otherwise (no earlier repair on that wheel)"
            method: "flat_repair_fee_usd alone"
        baseline:
          fl_work_charge: "P('flat_repair_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: flat_repair_bundle_rate
        effect: parameter
        decides: fl_bundle_rate
        bindings: [fl_visit_date, fl_tread, fl_rotation_paid, fl_bundle_rate]
        ladder:
          - when: "a rotation charge above zero is booked with the repair's service date and the repaired tire measured deep_tread or more"
            value: "K('bundle_deep_rate')"
          - when: "a rotation charge above zero is booked with the repair's service date and the tire measured below deep_tread"
            value: "K('bundle_rate')"
          - when: "otherwise (no rotation charge above zero on that date)"
            value: "K('full_rate')"
        baseline:
          fl_bundle_rate: "K('full_rate')"
        evidence: [history]
        cross_difficulty: null
      - id: flat_repair_member_rate
        effect: parameter
        decides: fl_member_rate
        bindings: [fl_mid, fl_fee_count, fl_member_rate]
        ladder:
          - when: "the presented membership carries long_member_years or more membership fee charges"
            value: "K('long_member_rate')"
          - when: "it carries at least member_years and fewer than long_member_years"
            value: "K('member_rate')"
          - when: "otherwise (fewer than member_years)"
            value: "K('full_rate')"
        baseline:
          fl_member_rate: "K('full_rate')"
        evidence: [cross_category, history]
        cross_difficulty: membership
      - id: flat_repair_mileage_rate
        effect: parameter
        decides: fl_mileage_rate
        bindings: [fl_odo, fl_miles, fl_mileage_rate]
        ladder:
          - when: "fewer than early_miles from the installation odometer to the repair entry"
            value: "K('early_rate')"
          - when: "at least early_miles and fewer than mid_miles"
            value: "K('mid_rate')"
          - when: "otherwise (mid_miles or more)"
            value: "K('full_rate')"
        baseline:
          fl_mileage_rate: "K('full_rate')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The flat repair charge is the package's flat_repair_fee_usd for the repaired tire, rounded to the cent, so a
        package whose flat_repair_fee_usd is zero is charged nothing.
      params: [flat_repair_fee_usd]
    inputs:
      history:
        - {table: tire_services, aggregate: latest, field: remaining_tread_32nds, filters: {event_type: tire_flat_repaired}}
        - {table: tire_services, aggregate: count, field: tire_event_id, filters: {event_type: tire_flat_repaired}}
        - {table: tire_services, aggregate: sum, field: amount, filters: {event_type: tire_service_charged, charge_component: rotation_balance}}
        - {category: membership, table: membership_transactions, aggregate: count, field: membership_txn_id, filters: {event_type: membership_fee_charged}}
      cross_category: [order, membership]
