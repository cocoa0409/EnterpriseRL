# Northgate Wholesale Club — Tire Center charter.
# Tires are bought as merchandise on a purchase; the Tire Center then installs them under an installation
# package (the tier) that is held for the life of that set of tires on that vehicle. The package is booked
# through Tire Center charges and credits and through the services performed under it: rotations, flat
# repairs, road hazard replacements and treadwear warranty adjustments.

category: tire
display_name: Northgate Tire Center

binding:
  holding_table: tire_holdings
  event_tables: [tire_services]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [awaiting_install, installed, cancelled, retired]
  transitions:
    - {from: awaiting_install, to: installed, by: system, means: "The Tire Center completes the installation work order and records the odometer."}
    - {from: awaiting_install, to: cancelled, by: agent, means: "The installation appointment is cancelled before the tires are mounted."}
    - {from: installed, to: retired, by: agent, means: "The package ends because the vehicle was sold, the tires were removed, or every tire of the set has been replaced outside the package."}

accounts:
  - key: tire_charges
    unit: USD
    meaning: Tire Center fees and replacement-tire charges on the package, net of credits.

parameter_schema:
  package_price_per_tire_usd: "installation package price for each tire installed (USD per tire)"
  vehicle_class: "the vehicle class the package is sold for (string code)"
  max_gvwr_lbs: "highest gross vehicle weight rating the package covers (pounds)"
  max_wheel_diameter_inches: "largest wheel diameter the Tire Center mounts under the package (inches)"
  mount_and_balance_included: "whether mounting and balancing at installation are included (boolean)"
  balance_method: "balancing method used (string code)"
  new_valve_stems_included: "whether new rubber valve stems are included (boolean)"
  tpms_service_kit_fee_usd: "fee per TPMS-equipped wheel for the sensor service kit; 0.00 = included (USD per tire)"
  tire_disposal_fee_usd: "fee for disposing of each old tire removed; 0.00 = included (USD per tire)"
  nitrogen_inflation_included: "whether tires are inflated and topped up with nitrogen (boolean)"
  retorque_check_included: "whether a lug-nut re-torque check is included after installation (boolean)"
  lifetime_rotation_included: "whether rotations are free for the life of the package (boolean)"
  rotation_fee_usd: "fee for one rotation of the set where not included (USD)"
  recommended_rotation_interval_miles: "the rotation interval the Tire Center recommends (miles)"
  lifetime_rebalance_included: "whether rebalancing is free for the life of the package (boolean)"
  rebalance_fee_per_tire_usd: "fee for rebalancing one tire where not included (USD per tire)"
  flat_repair_included: "whether repairable flats are repaired free (boolean)"
  flat_repair_fee_usd: "fee for one flat repair where not included (USD)"
  flat_repair_max_puncture_inches: "largest puncture diameter that can be repaired (inches)"
  flat_repair_tread_area_only: "whether only punctures in the tread area are repairable (boolean)"
  alignment_check_included: "whether a free alignment check is done at installation (boolean)"
  roadside_assistance_months: "months of flat-tire roadside assistance included from installation; 0 = none (months)"
  road_hazard_included: "whether the package includes road hazard protection (boolean)"
  road_hazard_term_months: "calendar months from installation during which road hazard protection applies; 0 = none (months)"
  road_hazard_covered_causes: "damage causes road hazard protection covers (list of damage_cause values)"
  road_hazard_full_credit_max_wear_pct: "tread wear, as a percentage of usable tread, up to which a road hazard replacement is credited at the full price paid (percent)"
  road_hazard_proration_basis: "how the credit is prorated beyond full-credit wear (string code)"
  road_hazard_replacements_max: "road hazard replacements allowed across the whole package (count)"
  road_hazard_replacement_install_included: "whether mounting, balancing and a new valve stem for a road hazard replacement are free (boolean)"
  road_hazard_credit_cash_out: "whether a road hazard or treadwear credit can be paid out in cash instead of applied to a replacement (boolean)"
  full_size_spare_covered: "whether a matching full-size spare bought in the same set is covered (boolean)"
  coverage_end_tread_32nds: "tread depth at or below which a tire is worn out and no road hazard protection applies (32nds of an inch)"
  new_tread_depth_32nds: "tread depth of a new tire of the class, used to measure wear (32nds of an inch)"
  treadwear_claim_supported: "whether the Tire Center processes the manufacturer's treadwear mileage warranty on the package (boolean)"
  treadwear_claim_max_tread_32nds: "tread depth at or below which a tire qualifies for a treadwear claim (32nds of an inch)"
  treadwear_rotation_max_interval_miles: "largest gap in miles allowed between installation, recorded rotations and the claim visit for a treadwear claim (miles)"
  treadwear_proration_basis: "how the treadwear credit is prorated (string code)"
  replacement_tire_price_basis: "the price a replacement tire is charged at (string code)"
  tread_measurement_point: "where tread depth is measured on a work order (string code)"
  work_order_odometer_required: "whether every work order records the vehicle odometer (boolean)"
  membership_required_for_service: "whether installation and every later service require an active membership (boolean)"
  mounted_tires_returnable: "whether tires that have been mounted can be returned for a refund (boolean)"
  cancel_refund_before_install: "whether a cancelled installation leaves nothing charged on the package (boolean)"
  tire_hold_days_after_no_show: "calendar days unmounted tires are held after a missed appointment before the appointment is cancelled (days)"
  appointment_reschedules_allowed: "times an installation appointment can be moved (count)"
  package_transferable: "whether the package passes to a new owner of the vehicle (boolean)"
  service_at_any_club: "whether package services are performed at any Northgate Tire Center (boolean)"
  replacement_inherits_remaining_term: "whether a road hazard replacement tire keeps the package's remaining term rather than starting a new one (boolean)"

