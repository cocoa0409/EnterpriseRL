name: env_0040_pet_supplies_retailer
company: Tailwise Pet Co.

background: |
  Tailwise Pet Co. is a US specialty pet retailer that sells food, treats, supplies and live aquatic and small animals online and through
  about 640 neighborhood stores, many of which house a grooming salon, a training ring or a Tailwise Vet Clinic. Its customer care team
  answers pet parents by phone, chat and app message in a warm, practical tone, and handles everything from a late kibble delivery to a
  prescription that is waiting on the family veterinarian. Everyday products are reordered through Tailwise Autoship, held per item as an
  Autoship Everyday, Autoship Litter & Bulk, Autoship Fresh & Frozen, Autoship Custom Meal Plan, Autoship Pharmacy or Autoship Compounded
  Pharmacy subscription, each billed shipment by shipment. Tailwise Pharmacy keeps prescriptions on file per pet in six classes: Rx
  Preventive, Rx Maintenance Medication, Rx Prescription Diet, Rx Short-Course Medication, Rx Controlled Substance and Rx Compounded
  Medication, each authorized by a veterinarian and then filled one fill at a time. The Tailwise Grooming Salon sells the Express Bath Pass
  3-Visit, Bath & Tidy Pass 4-Visit, Full Groom Pass 4-Visit, Full Groom Pass 6-Visit and Spa Groom Pass 6-Visit as prepaid visit
  passes, and Groom Club Monthly as a monthly club; appointments, visits, fees and redos are booked against the pet's pass. Tailwise
  Training runs the Puppy Training 6-Week Group, Adult Basic Training 6-Week Group, Intermediate Training 6-Week Group and Advanced
  Training & CGC Prep 6-Week Group courses, plus the Private Training 4-Session Pack and Private Training 8-Session Pack, with every
  session recorded. Tailwise Vet Clinics offer the Puppy, Kitten, Adult Dog, Adult Cat, Senior Dog and Senior Cat Wellness Plans as
  12-month contracts paid monthly or in full, against which included services are redeemed. One loyalty membership per customer, Pals
  Rewards and Tailwise Plus, carries the free tiers Pals Rewards Member, Pals Rewards Insider and Pals Rewards VIP and the paid tiers
  Tailwise Plus Monthly, Tailwise Plus Annual and Tailwise Plus Premier Annual, with a points ledger, reward certificates, fees and perk
  credit. Single purchases are Tailwise Online and In-Store Orders fulfilled as Standard Ship-to-Home, Expedited Ship-to-Home, Buy Online
  Pick Up In Store, Curbside Pickup, Same-Day Delivery or Large Item Freight Delivery, each line charged, cancelled, returned or credited on
  its own. Live animals come with a Live Pet Health Guarantee written as the Freshwater Fish, Saltwater Fish & Invertebrate, Live Coral,
  Small Animal, Bird or Reptile & Amphibian Guarantee. The people who contact care are mostly dog and cat owners with two or three pets
  on one profile, often holding a few Autoship subscriptions, a Pals Rewards membership and at least one pharmacy prescription at once.
  Many also keep a grooming pass or a wellness plan for one pet, a training enrollment for a new puppy, or a recent order on the way or
  just delivered. They arrive with a history of charged shipments, skipped dates, fills, salon visits, points and refunds, and their
  questions usually touch more than one of these programs.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: autoship_subscription_care
    claim:
      categories: [autoship]
      event_types: [autoship_enroll, autoship_modify, autoship_skip, autoship_pause, autoship_resume, autoship_cancel, autoship_payment_restore,
                    autoship_claim_refund, autoship_reship]
    summary: >
      Pet parents call about their Tailwise Autoship subscriptions across all six programs, from a bag of litter on Autoship Litter & Bulk to a
      heartworm preventive on Autoship Pharmacy, often holding several subscriptions for different pets with shipments falling on the same day,
      a subscription paused or on payment or prescription hold, and a history of skips, ship-now orders and earlier claims. The requests are to
      start a subscription, change frequency, quantity, item or next ship date, skip, pause or resume, release a payment hold, cancel, or claim
      a damaged, missing, wrong or disappointing shipment; each is decided against the subscription and its ledger, the customer's other
      subscriptions, the linked pet and prescription, the Pals Rewards tier and the refrigerated delivery zone on the profile. The governing
      rules are state gates on the subscription status, the change cutoff counted back from the next ship date (autoship_change_rules), skip
      limits over rolling windows (autoship_evt_skip), the discount and fee ladders that differ by program (autoship_evt_discount,
      autoship_agg_shipping_fees), prescription continuity (autoship_rx_continuity) and claim windows and remedies counted from the shipment's
      charge date (autoship_evt_shipment_claims); the natural order of the domain runs from enrollment through charged shipments to claims on a
      particular shipment. Changes, skips, pauses, holds and claims are service actions the agent performs once the facts support them, while
      cancelling a subscription is the customer's own decision and is carried out by the customer through the hand-over tool. Requests no
      rule decides, such as compensating a pet's illness blamed on a food, honouring a competitor's price, or reinstating a subscription that
      was cancelled automatically with its old discount standing, are outside the policies and go to a human representative as
      POLICY_NOT_COVERED.

  - name: pharmacy_prescription_care
    claim:
      categories: [rx]
      event_types: [rx_order_create, rx_fill, rx_pack_change, rx_cancel, rx_transfer_out, rx_error_remake, rx_error_refund, rx_fill_restore,
                    rx_diet_return_refund]
    summary: >
      Customers contact Tailwise Pharmacy about prescriptions for their pets across six classes, from a preventive bought in six-month packs to
      a compounded or controlled medication, with prescriptions in every state from awaiting the veterinarian's authorization to active,
      exhausted, expired, denied or transferred, sometimes linked to an Autoship Pharmacy subscription and often for more than one pet. They
      want a new prescription or a renewal ordered, a refill sent now, a package size changed, a prescription inactivated or transferred to
      another pharmacy, or a dispensing error or an unopened prescription diet put right. The records involved are the prescription with its
      fills authorized and remaining and its expiry, the pharmacy ledger of fills and remedies, the authorization requests sent to the
      veterinarian, the veterinarian's DEA registration, the pet's recorded weight and the customer's shipping state. The rules are the
      authorization requirements and response waits (rx_authorization), the fill gates of status, remaining fills, expiry and the
      refill-too-soon date with its class-specific overrides (rx_evt_fill_eligibility, rx_early_refill_overrides), renewal and transfer rules
      (rx_renewals, rx_transfers), first-order pricing (rx_evt_pricing) and the error and return windows (rx_dispensing_errors,
      rx_evt_returns); in the domain a prescription is authorized before any fill and a fill exists before any remedy on it. Requesting
      authorizations, dispensing within the rules, remaking or refunding errors and recording a prescriber's discontinuation are agent service
      actions, whereas withdrawing an order or inactivating a prescription at the customer's own wish is done by the customer through the
      hand-over tool. Asking the pharmacy to dispense without the veterinarian's approval, to change a dose on the customer's word, or to
      judge whether a medication caused a reaction is not covered by any policy and is handed to a human representative as
      POLICY_NOT_COVERED.

  - name: grooming_appointment_care
    claim:
      categories: [groom]
      event_types: [groom_pass_purchase, groom_appointment_book, groom_appointment_cancel, groom_late_cancel_fee, groom_visit_forfeit, groom_redo,
                    groom_reinstate, groom_pass_cancel, groom_pass_refund, groom_pass_transfer, groom_expiry_extension]
    summary: >
      Pet parents reach care about Tailwise Grooming Salon passes and appointments, holding anything from an Express Bath Pass 3-Visit for one
      dog to a Groom Club Monthly for another, with passes active, suspended for an unpaid month, exhausted or close to expiry, pets whose size
      class, coat or behaviour flag has changed since purchase, and a history of visits, cancellations, no-shows and redos. They ask to buy a
      pass, book, reschedule or cancel an appointment, dispute a late-cancellation fee or forfeited visit, get a redo, move visits to another
      pet, extend the expiry, reinstate the club or cancel the pass for a refund. Each request is decided from the pass and its ledger, the
      pet profile with its rabies expiry, size class and flags, the owner's recorded consents, the customer's other passes, wellness plans and
      Tailwise Plus tier, under booking requirements (groom_booking_requirements), size- and coat-based prices and household discounts
      (groom_pass_pricing, groom_agg_household_discounts, groom_evt_visit_charges), notice measured in hours before the start time
      (groom_cancellation_no_show), redo and refund windows (groom_satisfaction_redo, groom_pass_cancel_refund) and club billing
      (groom_club_monthly_billing); in the domain a pass is bought before bookings, a booking precedes its visit, and a visit precedes any redo. Booking,
      rescheduling, fees, redos, extensions and transfers are agent service actions, while consenting to a shave-down or muzzle handling and
      cancelling a pass are the owner's own acts done through the hand-over tools. Claims about an injury during grooming, a lost collar, or
      a request to waive charges no rule waives fall outside the policies and go to a human representative as POLICY_NOT_COVERED.

  - name: rewards_membership_care
    claim:
      categories: [member]
      event_types: [member_enroll, member_tier_change, member_bonus_points, member_certificate_reissue, member_cancel_request,
                    member_cancel_withdraw, member_fee_refund, member_reinstate, member_close]
    summary: >
      Customers ask about their single Pals Rewards and Tailwise Plus membership, on a free tier earned by spend or on a paid monthly or annual
      tier, sometimes in a trial, past due, or with a cancellation pending, and with a ledger of points earned and reversed across Autoship,
      pharmacy, salon, training, clinic and order purchases, certificates issued and expired, fees charged and perk credit used. They want
      a missing tier upgrade explained or applied, birthday or service-recovery points posted, an expired certificate reissued, a paid tier
      bought, upgraded, cancelled with or without a refund, a pending cancellation withdrawn, a past-due tier reinstated, or the account
      closed. The answers come from the membership record, the rewards ledger, the customer's pets and their profile dates, and the purchase
      records behind each earning, governed by tier qualification over calendar-year spend (member_tier_qualification), earn and reversal
      rules (member_evt_points_earn, member_evt_points_reverse), certificate validity and courtesy reissue (member_evt_certificates), bonus
      limits including per-pet birthday rules and rolling goodwill caps (member_evt_bonus_points), billing and grace periods
      (member_plus_billing) and the refund window and effective dates of a cancellation (member_plus_cancellation); in the domain points are
      earned from a purchase before they can be reversed or converted, and a fee is charged before it can be refunded. Posting points,
      reissuing certificates, applying earned tiers and reinstating a paid tier are agent service actions, while buying, cancelling or
      withdrawing the cancellation of a paid tier and closing the account are the customer's own decisions done through the hand-over tools.
      Requests to transfer points to another person, convert them to cash, or restore points that expired are not decided by any policy and
      go to a human representative as POLICY_NOT_COVERED.

  - name: order_returns_care
    claim:
      categories: [order]
      event_types: [order_update, order_cancel, order_line_cancel, order_fee_refund, order_return_refund, order_damage_credit,
                    order_replacement_ship]
    summary: >
      Shoppers contact care about Tailwise Online and In-Store Orders shipped to home, picked up in store or at the curb, delivered the same
      day or by freight, with orders placed, shipped, ready for pickup, completed or cancelled, lines bought with coupons, certificates or as
      final sale, and earlier partial refunds or replacements on the same lines. They ask to change the pickup person, store or hold, cancel an
      order, get a late-delivery fee back, return an item, or report something damaged, missing or wrong. Each request is decided from the
      order and its line ledger, the return authorizations, the customer's Pals Rewards tier and Tailwise Plus status, under the fee and
      threshold rules (order_agg_fees), line pricing and allocation of coupons and certificates (order_evt_line_pricing), cancellation and pickup
      rules (order_cancellation, order_pickup_rules), delivery promises (order_delivery_promises), return windows by item category with the
      holiday extension and fee deductions (order_returns) and report windows for damage and missing items (order_damage_missing_claims); in
      the domain an order is placed and its lines charged before fulfillment, and it is completed before any return or damage claim. Updating
      pickup details, crediting damage, sending replacements and refunding fees are agent service actions, while cancelling an order and
      authorizing a return of one's own purchase are the customer's acts done through the hand-over tools. Price matching another retailer,
      refunding a gift card, or compensating for a pet's reaction to a product are not covered by any policy and go to a human
      representative as POLICY_NOT_COVERED.
