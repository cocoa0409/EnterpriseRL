- id: autoship_pause_resume
  subject: [autoship_pause, autoship_resume]
  rule: The subscription status is active when the pause is requested. The paused-until date is chosen by the customer
    and may be at most pause_max_days calendar days after the request date; a longer break is offered as a cancellation.
    No shipment is processed while paused, and pausing does not consume the skip allowance. The subscription status
    is paused when the resume is requested. Where auto_resume_at_pause_end is true the subscription resumes by itself
    the day after paused_until with that day as the next ship date (moved to the next ship weekday when needed);
    where it is false the subscription stays paused until the customer resumes it. A customer may resume early,
    in which case the next ship date is the first ship weekday at least change_cutoff_days after the request.
