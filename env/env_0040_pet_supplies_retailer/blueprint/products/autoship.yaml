  subject: [autoship_rx_hold, autoship_rx_release, autoship_auto_cancel]
  rule: A pharmacy subscription follows its linked prescription. It goes on prescription hold when a shipment comes
    due and the prescription cannot be filled; the pharmacy then requests a renewal from the prescribing veterinarian.
    The hold is released as soon as the linked prescription is in status active with at least one fill remaining,
    and the held shipment is processed on the release date. A subscription still on prescription hold rx_hold_cancel_after_days
    calendar days after the hold began is cancelled automatically. Linking a different prescription to an existing
    pharmacy subscription is allowed only when it is for the same medication, strength and pet; otherwise a new
    subscription is needed. A prescription hold never moves the scheduled ship date backward and never counts as
    a skip.
