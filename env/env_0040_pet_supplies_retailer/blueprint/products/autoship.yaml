- id: autoship_evt_shipment_claims
  subject: [autoship_claim_refund, autoship_reship]
  rule: A claim is raised against one charged shipment, identified by its autoship_shipment_charge row. A claim
    is accepted only if it is reported no later than the claim window after the claimed shipment's charge date.
    The claim window is counted in calendar days from the event_date of the claimed autoship_shipment_charge row,
    the charge date itself being day 0; a claim reported on the last day of the window is in time. The window is
    damaged_claim_window_days for damaged or wrong_item claims, missing_claim_window_days for missing claims, satisfaction_guarantee_window_days
    for quality_guarantee claims (only where satisfaction_guarantee is true) and unopened_return_window_days for
    unopened_return claims (only where that window is above 0). No autoship_claim_refund or autoship_reship row
    already refers to the same original_event_id with the same claim_reason. For damaged, missing and wrong_item
    claims the customer chooses a free replacement where reship_allowed is true, otherwise a refund; quality_guarantee
    and unopened_return claims are always refunded. The refund is the claimed units' share of the shipment's merchandise
    subtotal after its Autoship discount, rounded half up to the cent, plus the shipping fee when every unit of
    the shipment is claimed and refund_shipping_fee_on_claim is true; heavy-item surcharges and packaging fees are
    refunded only on damaged, missing and wrong_item claims covering every unit. The refund goes to claim_refund_method.
    Pharmacy items are never accepted as quality_guarantee or unopened_return claims; a dispensing error is handled
    by the pharmacy, not as an Autoship claim.
