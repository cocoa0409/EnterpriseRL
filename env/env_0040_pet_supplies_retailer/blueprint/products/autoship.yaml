      timing: pre_action
      correlation_keys:
      - [autoship_events.autoship_event_id]
      action_bindings:
        autoship_events.autoship_event_id: original_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the claimed shipment's charge date
      anchor_source: autoship_events.event_date
      relation: not_after
      duration_source: variants.damaged_claim_window_days
      unit: calendar_days
      counting_rule: The claim window is counted in calendar days from the event_date of the claimed autoship_shipment_charge
        row, the charge date itself being day 0; a claim reported on the last day of the window is in time.
      boundary: inclusive
  - id: one_remedy_per_claim
    applies_to: [autoship_claim_refund, autoship_reship]
    kind: dedup
    condition: No autoship_claim_refund or autoship_reship row already refers to the same original_event_id with
      the same claim_reason.
    evidence_fields: [autoship_events.original_event_id, autoship_events.claim_reason]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [autoship_events.original_event_id]
      action_bindings:
        autoship_events.original_event_id: original_event_id
    dedup_contract:
      table: autoship_events
      mode: separate_record
      object_bindings:
        original_event_id: original_event_id
        claim_reason: claim_reason
      duplicate_filters:
        event_type: [autoship_claim_refund, autoship_reship]
      distinct_fields: []
  params:
    per_tier:
      Autoship Everyday:
        damaged_claim_window_days: =damaged_claim_window_days
        missing_claim_window_days: =missing_claim_window_days
        satisfaction_guarantee: =satisfaction_guarantee
        satisfaction_guarantee_window_days: =satisfaction_guarantee_window_days
        unopened_return_window_days: =unopened_return_window_days
        reship_allowed: =reship_allowed
        claim_refund_method: =claim_refund_method
        refund_shipping_fee_on_claim: =refund_shipping_fee_on_claim
        delivery_days_after_ship: =delivery_days_after_ship
      Autoship Litter & Bulk:
