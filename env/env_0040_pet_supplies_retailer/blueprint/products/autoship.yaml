events:
- type: autoship_enroll
  target: autoship_subscriptions
  mutation: create
  meaning: a customer creates an Autoship subscription for one item
  grain: one row per subscription
  fields:
    autoship_id: new subscription id
    customer_id: owner
    pet_id: linked pet when required
    variant_name: program
    sku: item number
    item_description: item
    quantity: units per shipment
    unit_price_usd: catalog price
    item_weight_lb: unit shipping weight
    frequency_weeks: frequency
    next_ship_date: first ship date chosen
    enrolled_on: creation date
    rx_prescription_id: linked prescription for pharmacy programs
    plan_basis_weight_lb: basis weight for a Custom Meal Plan
  triggers: []
- type: autoship_shipment_charge
  target: autoship_events
  meaning: a scheduled or ship-now shipment of the subscription is charged and released to the carrier
  grain: one row per charged shipment of one subscription
  distinguish_by: [scheduled_ship_date, shipment_kind]
  fields:
    event_date: processing date
    scheduled_ship_date: scheduled ship date served (processing date for ship-now)
    shipment_kind: scheduled or ship_now
    shipment_seq: ordinal of this charged shipment
    quantity: units shipped
    unit_price_usd: price per unit on the processing date
    merchandise_subtotal_usd: quantity x unit price
    discount_kind: first_order, recurring or none
    discount_usd: Autoship discount
    shipping_fee_usd: standard shipping fee charged
    heavy_surcharge_usd: heavy-item surcharge
    cold_pack_fee_usd: insulated packaging fee
    amount_usd: total billed for the shipment
    rx_prescription_id: linked prescription filled by a pharmacy shipment; empty for other programs
  account: billed_total
  direction: in
  triggers:
  - event: autoship:autoship_activate
    when: {shipment_seq: 1}
  - event: member:member_points_earn
    map:
      event_date: event_date
      source_category: autoship
      source_event_id: autoship_event_id
      qualifying_spend_usd: merchandise_subtotal_usd
  - event: rx:rx_fill
    when:
      rx_prescription_id:
        not: ''
    map:
      rx_prescription_id: rx_prescription_id
      event_date: event_date
      fill_channel: autoship
      quantity_dispensed: quantity
- type: autoship_activate
  target: autoship_subscriptions
  mutation:
    transition:
      from: pending_first_shipment
      to: active
  meaning: the subscription becomes active when its first shipment is charged
  grain: one transition per subscription
  fields:
    next_ship_date: processing date plus frequency_weeks
  triggers: []
- type: autoship_skip
  target: autoship_events
  meaning: the next scheduled shipment is skipped, at the customer's request or automatically for a backorder
  grain: one row per skipped scheduled ship date
  distinguish_by: [scheduled_ship_date]
  fields:
    event_date: date the skip was booked
    scheduled_ship_date: the ship date skipped
    shipment_kind: always none
    skip_reason: customer_request or backorder
  triggers:
  - event: autoship:autoship_modify
- type: autoship_modify
  target: autoship_subscriptions
  mutation: update
  meaning: the customer changes frequency, quantity, item or next ship date, or the system moves the next ship date
    after a skip or recalculates a meal plan
  grain: one row per change request
  fields:
    frequency_weeks: new frequency
    quantity: new units per shipment
    sku: new item number on a swap
    item_description: new item on a swap
    unit_price_usd: catalog price of the new item
    item_weight_lb: unit weight of the new item
    next_ship_date: new next ship date
    plan_basis_weight_lb: new basis weight after a meal plan recalculation
  triggers: []
- type: autoship_pause
  target: autoship_subscriptions
  mutation:
    transition:
      from: active
      to: paused
  meaning: the customer pauses the subscription until a chosen date
  grain: one transition per pause request
  fields:
    paused_until: last day of the pause
  triggers: []
- type: autoship_resume
  target: autoship_subscriptions
  mutation:
    transition:
      from: paused
      to: active
  meaning: a paused subscription resumes, early at the customer's request or automatically
  grain: one transition per resumption
  fields:
    paused_until: cleared
    next_ship_date: first ship date after the pause
  triggers: []
- type: autoship_payment_declined
  target: autoship_events
  meaning: the payment for a scheduled shipment is declined on the first attempt or an automatic retry
  grain: one row per declined attempt for one scheduled ship date
  distinguish_by: [scheduled_ship_date, payment_attempt]
  fields:
    event_date: date of the attempt
    scheduled_ship_date: the shipment that could not be paid
    shipment_kind: scheduled
    payment_attempt: 1 for the first decline, 2+ for retries
    amount_usd: amount that was attempted
  triggers:
  - event: autoship:autoship_payment_hold
    when: {payment_attempt: 1}
- type: autoship_payment_hold
  target: autoship_subscriptions
  mutation:
    transition:
    - from: active
      to: payment_hold
    - from: pending_first_shipment
      to: payment_hold
  meaning: the subscription is held after a payment decline
  grain: one transition per hold
  fields:
    next_ship_date: unchanged; the held shipment keeps its date
  triggers: []
- type: autoship_payment_restore
  target: autoship_subscriptions
  mutation:
    transition:
      from: payment_hold
      to: active
  meaning: the hold is released after the customer puts a working card on file and the held shipment is charged
  grain: one transition per release
  fields:
    next_ship_date: release date plus frequency_weeks
  triggers:
  - event: autoship:autoship_shipment_charge
    map:
      shipment_kind: scheduled
- type: autoship_rx_hold
  target: autoship_subscriptions
  mutation:
    transition:
      from: active
      to: rx_hold
  meaning: a pharmacy subscription is held because its prescription cannot be filled
  grain: one transition per hold
  fields:
    next_ship_date: unchanged
  triggers: []
- type: autoship_rx_release
  target: autoship_subscriptions
  mutation:
    transition:
      from: rx_hold
      to: active
  meaning: a prescription hold is released once the linked prescription is active with a fill remaining
  grain: one transition per release
  fields:
    next_ship_date: release date
  triggers: []
- type: autoship_claim_refund
  target: autoship_events
  meaning: an accepted claim on a charged shipment is refunded
  grain: one row per refunded claim on one shipment charge
  distinguish_by: [original_event_id, claim_reason]
  fields:
    event_date: date the refund was booked
    original_event_id: the shipment charge claimed
    claim_reason: damaged, missing, wrong_item, quality_guarantee or unopened_return
    quantity: units claimed
    shipping_fee_usd: shipping fee refunded
    amount_usd: total refunded
    refund_method: where the refund went
    shipment_kind: always none
  account: billed_total
  direction: out
  triggers:
  - event: member:member_points_reverse
    map:
      event_date: event_date
      source_category: autoship
      source_event_id: original_event_id
- type: autoship_reship
  target: autoship_events
  meaning: a free replacement is shipped for an accepted damaged, missing or wrong-item claim
  grain: one row per replacement of one shipment charge
  distinguish_by: [original_event_id]
  fields:
    event_date: date the replacement was released
    original_event_id: the shipment charge replaced
    claim_reason: damaged, missing or wrong_item
    quantity: units replaced
    shipment_kind: always reship
  triggers: []
- type: autoship_cancel
  target: autoship_subscriptions
  mutation:
    transition:
    - from: pending_first_shipment
      to: cancelled
    - from: active
      to: cancelled
    - from: paused
      to: cancelled
    - from: payment_hold
      to: cancelled
    - from: rx_hold
      to: cancelled
  meaning: the customer cancels the subscription
  grain: one transition per subscription
  fields:
    cancelled_on: date of cancellation
  triggers: []
- type: autoship_auto_cancel
  target: autoship_subscriptions
  mutation:
    transition:
    - from: payment_hold
      to: cancelled
    - from: rx_hold
      to: cancelled
  meaning: the system cancels a subscription whose payment or prescription hold ran past its limit
  grain: one transition per subscription
  fields:
    cancelled_on: date of cancellation
  triggers: []
measures:
- id: autoship_msr_skips_365d
  window: rolling 365 calendar days ending on the request date, by scheduled_ship_date
  measure: count of autoship_skip rows of this subscription with skip_reason customer_request (backorder skips added
    only where backorder_skip_counts_toward_limit is true)
- id: autoship_msr_consecutive_skips
  window: the subscription's scheduled ship dates, newest first, back to the most recent autoship_shipment_charge
  measure: count of autoship_skip rows with skip_reason customer_request on scheduled ship dates later than the
    subscription's most recent charged shipment
- id: autoship_msr_recent_autoship_charges
  window: first_order_lookback_days calendar days ending the day before the new subscription's enrolled_on
  measure: count of autoship_shipment_charge rows on any subscription of the customer, by event_date
- id: autoship_msr_same_day_subtotal
  window: a single scheduled ship date
  measure: sum of merchandise_subtotal_usd of every autoship_shipment_charge row of the customer with the same scheduled_ship_date
    and shipment_kind scheduled, across all subscriptions
policies:
- id: autoship_agg_multi_holding
  subject: [autoship_enroll]
  rule: A customer may hold any number of Autoship subscriptions; there is no portfolio cap, and each subscription
    carries exactly one item number on its own frequency. No other subscription of the same customer for the same
    item number and the same pet is in status pending_first_shipment, active, paused, payment_hold or rx_hold. A
    request that would duplicate one is handled as a change (quantity or frequency) to the existing subscription
    instead of a new enrollment. A cancelled subscription never blocks a new one for the same item. When the program's
    pet_profile_required is true, the subscription is linked to a pet profile of the same customer. Subscriptions
    for different pets of the same customer are separate even when the item number is the same.
  eligibility:
  - id: one_live_subscription_per_item_and_pet
    applies_to: [autoship_enroll]
    kind: dedup
    condition: No other subscription of the same customer for the same item number and the same pet is in status
      pending_first_shipment, active, paused, payment_hold or rx_hold.
    evidence_fields: [autoship_subscriptions.customer_id, autoship_subscriptions.sku, autoship_subscriptions.pet_id,
      autoship_subscriptions.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [autoship_subscriptions.customer_id, autoship_subscriptions.sku, autoship_subscriptions.pet_id]
      action_bindings:
        autoship_subscriptions.customer_id: customer_id
        autoship_subscriptions.sku: sku
        autoship_subscriptions.pet_id: pet_id
    dedup_contract:
      table: autoship_subscriptions
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        sku: sku
        pet_id: pet_id
      duplicate_filters:
        status: [pending_first_shipment, active, paused, payment_hold, rx_hold]
      distinct_fields: []
  - id: pet_profile_linked
    applies_to: [autoship_enroll]
    kind: authorization
    condition: When the program's pet_profile_required is true, the subscription is linked to a pet profile of the
      same customer.
    evidence_fields: [pets.pet_id, pets.customer_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pets.pet_id]
      action_bindings:
        pets.pet_id: pet_id
  params:
    max_per_customer: null
- id: autoship_enrollment_requirements
  subject: [autoship_enroll]
  rule: 'An Autoship subscription is created in status pending_first_shipment with the program chosen from the item''s
    class: standard catalog items enroll in Autoship Everyday, units weighing at least the Litter & Bulk entry weight
    in Autoship Litter & Bulk, refrigerated or frozen items in Autoship Fresh & Frozen, portioned fresh plans in
    Autoship Custom Meal Plan, prescription items in Autoship Pharmacy and compounded prescriptions in Autoship
    Compounded Pharmacy. When the program''s fresh_zone_required is true, the customer''s profile shows fresh_delivery_eligible
    true. When the program''s rx_required is true, the linked prescription is in status active with fills_remaining
    of at least 1 and an expires_on later than the first ship date. The frequency must lie between min_frequency_weeks
    and max_frequency_weeks in whole multiples of frequency_step_weeks, and the quantity may not exceed max_quantity_per_shipment;
    for a pharmacy program quantity x days'' supply per unit may not exceed rx_max_days_supply_per_shipment. The
    first ship date is the date the customer chooses, no earlier than the enrollment date and falling on one of
    the program''s ship_weekdays; a chosen date on another weekday moves to the next listed weekday. A Custom Meal
    Plan records the pet''s current weight_lb as plan_basis_weight_lb. Enrolling is free and carries no minimum
    term.'
  eligibility:
  - id: fresh_zone
    applies_to: [autoship_enroll]
    kind: authorization
    condition: When the program's fresh_zone_required is true, the customer's profile shows fresh_delivery_eligible
      true.
    evidence_fields: [customers.fresh_delivery_eligible, customers.customer_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [customers.customer_id]
      action_bindings:
        customers.customer_id: customer_id
  - id: rx_active_for_pharmacy
    applies_to: [autoship_enroll]
    kind: state
    condition: When the program's rx_required is true, the linked prescription is in status active with fills_remaining
      of at least 1 and an expires_on later than the first ship date.
    evidence_fields: [rx_prescriptions.status, rx_prescriptions.rx_prescription_id, rx_prescriptions.fills_remaining,
      rx_prescriptions.expires_on]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rx_prescriptions.rx_prescription_id]
      action_bindings:
        rx_prescriptions.rx_prescription_id: rx_prescription_id
    state_contract:
      field: rx_prescriptions.status
      allowed: [active]
  params:
    per_tier:
      Autoship Everyday:
        min_frequency_weeks: =min_frequency_weeks
        max_frequency_weeks: =max_frequency_weeks
        max_quantity_per_shipment: =max_quantity_per_shipment
        ship_weekdays: =ship_weekdays
        fresh_zone_required: =fresh_zone_required
        rx_required: =rx_required
      Autoship Litter & Bulk:
        min_frequency_weeks: =min_frequency_weeks
        max_frequency_weeks: =max_frequency_weeks
        max_quantity_per_shipment: =max_quantity_per_shipment
        ship_weekdays: =ship_weekdays
        fresh_zone_required: =fresh_zone_required
        rx_required: =rx_required
      Autoship Fresh & Frozen:
        min_frequency_weeks: =min_frequency_weeks
        max_frequency_weeks: =max_frequency_weeks
        max_quantity_per_shipment: =max_quantity_per_shipment
        ship_weekdays: =ship_weekdays
        fresh_zone_required: =fresh_zone_required
        rx_required: =rx_required
      Autoship Custom Meal Plan:
        min_frequency_weeks: =min_frequency_weeks
        max_frequency_weeks: =max_frequency_weeks
        max_quantity_per_shipment: =max_quantity_per_shipment
        ship_weekdays: =ship_weekdays
        fresh_zone_required: =fresh_zone_required
        rx_required: =rx_required
      Autoship Pharmacy:
        min_frequency_weeks: =min_frequency_weeks
        max_frequency_weeks: =max_frequency_weeks
        max_quantity_per_shipment: =max_quantity_per_shipment
        ship_weekdays: =ship_weekdays
        fresh_zone_required: =fresh_zone_required
        rx_required: =rx_required
      Autoship Compounded Pharmacy:
        min_frequency_weeks: =min_frequency_weeks
        max_frequency_weeks: =max_frequency_weeks
        max_quantity_per_shipment: =max_quantity_per_shipment
        ship_weekdays: =ship_weekdays
        fresh_zone_required: =fresh_zone_required
        rx_required: =rx_required
- id: autoship_evt_discount
  subject: [autoship_shipment_charge]
  rule: 'Every charged shipment carries exactly one Autoship discount kind. The first charged shipment (shipment_seq
    1) of a subscription takes the first-order discount, first_order_discount_pct of the merchandise subtotal capped
    at first_order_discount_cap_usd, only when the customer is new to Autoship: autoship_msr_recent_autoship_charges
    is 0. Otherwise the first shipment, and every later scheduled shipment, takes the recurring discount, recurring_discount_pct
    of the merchandise subtotal capped at recurring_discount_cap_usd. A ship-now shipment takes the recurring discount
    only when ship_now_discount_applies is true, otherwise discount_kind none. The discount is computed on the unit
    price on the processing date and rounded half up to the cent. A coupon may be added only where coupon_stacking_allowed
    is true, and the Autoship discount plus the coupon may never exceed max_combined_discount_pct of the merchandise
    subtotal; when the ceiling binds, the coupon is reduced and the Autoship discount is kept whole. The Autoship
    discount does not apply to shipping, surcharges or packaging fees, and a Pals Rewards certificate is applied
    after it, never before.'
  eligibility: []
  params:
    per_tier:
      Autoship Everyday:
        first_order_discount_pct: =first_order_discount_pct
        first_order_discount_cap_usd: =first_order_discount_cap_usd
        first_order_lookback_days: =first_order_lookback_days
        recurring_discount_pct: =recurring_discount_pct
        recurring_discount_cap_usd: =recurring_discount_cap_usd
        ship_now_discount_applies: =ship_now_discount_applies
        coupon_stacking_allowed: =coupon_stacking_allowed
        max_combined_discount_pct: =max_combined_discount_pct
      Autoship Litter & Bulk:
        first_order_discount_pct: =first_order_discount_pct
        first_order_discount_cap_usd: =first_order_discount_cap_usd
        first_order_lookback_days: =first_order_lookback_days
        recurring_discount_pct: =recurring_discount_pct
        recurring_discount_cap_usd: =recurring_discount_cap_usd
        ship_now_discount_applies: =ship_now_discount_applies
        coupon_stacking_allowed: =coupon_stacking_allowed
        max_combined_discount_pct: =max_combined_discount_pct
      Autoship Fresh & Frozen:
        first_order_discount_pct: =first_order_discount_pct
        first_order_discount_cap_usd: =first_order_discount_cap_usd
        first_order_lookback_days: =first_order_lookback_days
        recurring_discount_pct: =recurring_discount_pct
        recurring_discount_cap_usd: =recurring_discount_cap_usd
        ship_now_discount_applies: =ship_now_discount_applies
        coupon_stacking_allowed: =coupon_stacking_allowed
        max_combined_discount_pct: =max_combined_discount_pct
      Autoship Custom Meal Plan:
        first_order_discount_pct: =first_order_discount_pct
        first_order_discount_cap_usd: =first_order_discount_cap_usd
        first_order_lookback_days: =first_order_lookback_days
        recurring_discount_pct: =recurring_discount_pct
        recurring_discount_cap_usd: =recurring_discount_cap_usd
        ship_now_discount_applies: =ship_now_discount_applies
        coupon_stacking_allowed: =coupon_stacking_allowed
        max_combined_discount_pct: =max_combined_discount_pct
      Autoship Pharmacy:
        first_order_discount_pct: =first_order_discount_pct
        first_order_discount_cap_usd: =first_order_discount_cap_usd
        first_order_lookback_days: =first_order_lookback_days
        recurring_discount_pct: =recurring_discount_pct
        recurring_discount_cap_usd: =recurring_discount_cap_usd
        ship_now_discount_applies: =ship_now_discount_applies
        coupon_stacking_allowed: =coupon_stacking_allowed
        max_combined_discount_pct: =max_combined_discount_pct
      Autoship Compounded Pharmacy:
        first_order_discount_pct: =first_order_discount_pct
        first_order_discount_cap_usd: =first_order_discount_cap_usd
        first_order_lookback_days: =first_order_lookback_days
        recurring_discount_pct: =recurring_discount_pct
        recurring_discount_cap_usd: =recurring_discount_cap_usd
        ship_now_discount_applies: =ship_now_discount_applies
        coupon_stacking_allowed: =coupon_stacking_allowed
        max_combined_discount_pct: =max_combined_discount_pct
  formula:
    merchandise_subtotal_usd: round(quantity * unit_price_usd, 2)
    discount_usd: round(min(merchandise_subtotal_usd * first_order_discount_pct / 100, first_order_discount_cap_usd),
      2) if discount_kind == 'first_order' else (round(min(merchandise_subtotal_usd * recurring_discount_pct / 100,
      recurring_discount_cap_usd), 2) if discount_kind == 'recurring' else 0)
  measures: [autoship_msr_recent_autoship_charges]
- id: autoship_agg_shipping_fees
  subject: [autoship_shipment_charge]
  rule: 'Shipping is assessed across the customer''s whole Autoship portfolio for one scheduled ship date: when
    autoship_msr_same_day_subtotal is at least the free_shipping_threshold_usd of every program shipping that day,
    no standard shipping fee is charged on any of those shipments; otherwise one standard_shipping_fee_usd is charged
    on the shipment with the highest standard fee among them and 0.00 on the others. A ship-now shipment is assessed
    on its own subtotal. A customer whose Tailwise Plus membership is in status active pays no standard shipping
    fee on any Autoship shipment regardless of subtotal; Pals Rewards tiers without a paid membership do not change
    shipping. The heavy-item surcharge, heavy_item_surcharge_usd for every unit whose item_weight_lb is at least
    heavy_item_weight_lb, and the insulated packaging fee cold_pack_fee_usd of cold-chain programs are charged on
    every shipment and are never waived by the threshold or by membership.'
  eligibility: []
  params:
    per_tier:
      Autoship Everyday:
        free_shipping_threshold_usd: =free_shipping_threshold_usd
        standard_shipping_fee_usd: =standard_shipping_fee_usd
        heavy_item_weight_lb: =heavy_item_weight_lb
        heavy_item_surcharge_usd: =heavy_item_surcharge_usd
        cold_chain_required: =cold_chain_required
        cold_pack_fee_usd: =cold_pack_fee_usd
      Autoship Litter & Bulk:
        free_shipping_threshold_usd: =free_shipping_threshold_usd
        standard_shipping_fee_usd: =standard_shipping_fee_usd
        heavy_item_weight_lb: =heavy_item_weight_lb
        heavy_item_surcharge_usd: =heavy_item_surcharge_usd
        cold_chain_required: =cold_chain_required
        cold_pack_fee_usd: =cold_pack_fee_usd
      Autoship Fresh & Frozen:
        free_shipping_threshold_usd: =free_shipping_threshold_usd
        standard_shipping_fee_usd: =standard_shipping_fee_usd
        heavy_item_weight_lb: =heavy_item_weight_lb
        heavy_item_surcharge_usd: =heavy_item_surcharge_usd
        cold_chain_required: =cold_chain_required
        cold_pack_fee_usd: =cold_pack_fee_usd
      Autoship Custom Meal Plan:
        free_shipping_threshold_usd: =free_shipping_threshold_usd
        standard_shipping_fee_usd: =standard_shipping_fee_usd
        heavy_item_weight_lb: =heavy_item_weight_lb
        heavy_item_surcharge_usd: =heavy_item_surcharge_usd
        cold_chain_required: =cold_chain_required
        cold_pack_fee_usd: =cold_pack_fee_usd
      Autoship Pharmacy:
        free_shipping_threshold_usd: =free_shipping_threshold_usd
        standard_shipping_fee_usd: =standard_shipping_fee_usd
        heavy_item_weight_lb: =heavy_item_weight_lb
        heavy_item_surcharge_usd: =heavy_item_surcharge_usd
        cold_chain_required: =cold_chain_required
        cold_pack_fee_usd: =cold_pack_fee_usd
      Autoship Compounded Pharmacy:
        free_shipping_threshold_usd: =free_shipping_threshold_usd
        standard_shipping_fee_usd: =standard_shipping_fee_usd
        heavy_item_weight_lb: =heavy_item_weight_lb
        heavy_item_surcharge_usd: =heavy_item_surcharge_usd
        cold_chain_required: =cold_chain_required
        cold_pack_fee_usd: =cold_pack_fee_usd
  formula:
    heavy_surcharge_usd: round(quantity * heavy_item_surcharge_usd, 2) if item_weight_lb >= heavy_item_weight_lb
      else 0
    cold_pack_fee_usd: cold_pack_fee_usd if cold_chain_required else 0
  measures: [autoship_msr_same_day_subtotal]
- id: autoship_evt_shipment_processing
  subject: [autoship_shipment_charge, autoship_activate, autoship_rx_hold]
  rule: 'A shipment is processed on the subscription''s next ship date (a ship-now shipment on the day it is requested).
    The subscription status is pending_first_shipment or active when the shipment is processed. The amount billed
    is the merchandise subtotal minus the Autoship discount plus the standard shipping fee, the heavy-item surcharge
    and the packaging fee. A shipment whose merchandise subtotal is below min_order_subtotal_usd is not processed
    and nothing is charged; the customer is asked to raise the quantity before the next ship date, and the date
    is not recorded as a skip. A ship-now shipment requires ship_now_allowed and at least ship_now_min_days_since_last
    calendar days since the subscription''s most recent charged shipment, and it does not move the next ship date.
    Before a pharmacy shipment is charged the linked prescription is checked: when it is not in status active, has
    no fill remaining or its expires_on is not later than the processing date, the subscription moves to rx_hold
    and nothing is charged. A successful charge of a pharmacy shipment books one fill of the prescription. The first
    charged shipment activates a pending subscription, and every charged shipment sets the next ship date to the
    processing date plus frequency_weeks.'
  eligibility:
  - id: processable_status
    applies_to: [autoship_shipment_charge]
    kind: state
    condition: The subscription status is pending_first_shipment or active when the shipment is processed.
    evidence_fields: [autoship_subscriptions.status, autoship_subscriptions.autoship_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [autoship_subscriptions.autoship_id]
      action_bindings:
        autoship_subscriptions.autoship_id: autoship_id
    state_contract:
      field: autoship_subscriptions.status
      allowed: [pending_first_shipment, active]
  params:
    per_tier:
      Autoship Everyday:
        min_order_subtotal_usd: =min_order_subtotal_usd
        ship_now_allowed: =ship_now_allowed
        ship_now_min_days_since_last: =ship_now_min_days_since_last
        rx_required: =rx_required
      Autoship Litter & Bulk:
        min_order_subtotal_usd: =min_order_subtotal_usd
        ship_now_allowed: =ship_now_allowed
        ship_now_min_days_since_last: =ship_now_min_days_since_last
        rx_required: =rx_required
      Autoship Fresh & Frozen:
        min_order_subtotal_usd: =min_order_subtotal_usd
        ship_now_allowed: =ship_now_allowed
        ship_now_min_days_since_last: =ship_now_min_days_since_last
        rx_required: =rx_required
      Autoship Custom Meal Plan:
        min_order_subtotal_usd: =min_order_subtotal_usd
        ship_now_allowed: =ship_now_allowed
        ship_now_min_days_since_last: =ship_now_min_days_since_last
        rx_required: =rx_required
      Autoship Pharmacy:
        min_order_subtotal_usd: =min_order_subtotal_usd
        ship_now_allowed: =ship_now_allowed
        ship_now_min_days_since_last: =ship_now_min_days_since_last
        rx_required: =rx_required
      Autoship Compounded Pharmacy:
        min_order_subtotal_usd: =min_order_subtotal_usd
        ship_now_allowed: =ship_now_allowed
        ship_now_min_days_since_last: =ship_now_min_days_since_last
        rx_required: =rx_required
  formula:
    amount_usd: round(merchandise_subtotal_usd - discount_usd + shipping_fee_usd + heavy_surcharge_usd + cold_pack_fee_usd,
      2)
- id: autoship_change_rules
  subject: [autoship_modify]
  rule: 'The customer may change the frequency, the quantity, the next ship date and, where item_swap_allowed is
    true, the item. The subscription status is pending_first_shipment, active, paused, payment_hold or rx_hold when
    the change is requested. A change, skip or cancellation affects the upcoming shipment only if it is requested
    no later than change_cutoff_days before the subscription''s next ship date. The cutoff is counted in calendar
    days backward from the next ship date: a request dated exactly change_cutoff_days before the next ship date
    is in time, and a later request is late. A late change leaves the upcoming shipment as already scheduled and
    applies from the following one. A new frequency must respect min_frequency_weeks, max_frequency_weeks and frequency_step_weeks;
    a new quantity may not exceed max_quantity_per_shipment; a new next ship date must fall on one of ship_weekdays
    and may not be earlier than the day after the request. A swap keeps the subscription, its shipment history and
    its discount standing; the new item''s catalog price applies from the next shipment, and a swap to an item of
    a different program is a cancellation plus a new enrollment. For a Custom Meal Plan, when the pet''s recorded
    weight differs from plan_basis_weight_lb by at least meal_plan_recalc_weight_change_pct percent, the portions
    are recalculated, the plan basis weight is reset to the current weight and the box quantity is updated; a smaller
