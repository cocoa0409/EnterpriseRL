  - id: within_claim_window
    applies_to: [autoship_claim_refund, autoship_reship]
    kind: time
    condition: A claim is accepted only if it is reported no later than the claim window after the claimed shipment's
      charge date.
    evidence_fields: [autoship_events.event_date, autoship_events.autoship_event_id]
