    temporal_basis:
      clock: frozen_time
      anchor_event: the pass's expires_on
      anchor_source: groom_passes.expires_on
      relation: not_after
      duration_source: params.extension_request_offset_days
      unit: calendar_days
      counting_rule: The request date is compared with expires_on as calendar dates; a request on expires_on itself
        is in time.
      boundary: inclusive
