- id: groom_pass_expiry
  subject: [groom_expire, groom_expiry_extension, groom_exhaust]
  rule: Unused visits of a prepaid pass lapse after expires_on and are not refunded. The pass status is active when
    the extension is requested. Where expiry_extension_allowed is true the customer may ask once for an extension
    of expiry_extension_days added to expires_on. The extension is granted only if it is requested no later than
    the pass's expires_on and extension_used is false. The request date is compared with expires_on as calendar
    dates; a request on expires_on itself is in time. A pass whose last visit is used, forfeited or refunded becomes
    exhausted.
