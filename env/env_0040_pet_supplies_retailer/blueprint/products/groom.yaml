- id: groom_satisfaction_redo
  subject: [groom_redo]
  rule: A customer unhappy with the cut or finish of a completed visit may have the same service redone free at
    a Tailwise salon. A redo is free only if it is requested no later than satisfaction_redo_days after the original
    visit date. The redo window is counted in calendar days from the appointment_date of the groom_visit_complete
    row, that date being day 0; a request on the last day is in time. The visit has fewer redos than redo_per_visit.
    A redo uses no visit and carries no surcharges; add-ons are not redone. Dissatisfaction with the price, matting
    found at a later date, or an injury report is not a redo matter.
  eligibility:
  - id: redo_window
    applies_to: [groom_redo]
    kind: time
    condition: A redo is free only if it is requested no later than satisfaction_redo_days after the original visit
      date.
    evidence_fields: [groom_events.appointment_date, groom_events.groom_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [groom_events.groom_event_id]
      action_bindings:
        groom_events.groom_event_id: original_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the original visit date
      anchor_source: groom_events.appointment_date
      relation: not_after
      duration_source: variants.satisfaction_redo_days
      unit: calendar_days
      counting_rule: The redo window is counted in calendar days from the appointment_date of the groom_visit_complete
        row, that date being day 0; a request on the last day is in time.
      boundary: inclusive
  - id: redo_allowance
    applies_to: [groom_redo]
    kind: dedup
    condition: The visit has fewer redos than redo_per_visit.
    evidence_fields: [groom_events.original_event_id, groom_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [groom_events.original_event_id]
      action_bindings:
        groom_events.original_event_id: original_event_id
    dedup_contract:
      table: groom_events
      mode: separate_record
      object_bindings:
        original_event_id: original_event_id
      duplicate_filters:
        event_type: [groom_redo]
      distinct_fields: []
  params:
    per_tier:
      Express Bath Pass 3-Visit:
        satisfaction_redo_days: =satisfaction_redo_days
        redo_per_visit: =redo_per_visit
      Bath & Tidy Pass 4-Visit:
        satisfaction_redo_days: =satisfaction_redo_days
        redo_per_visit: =redo_per_visit
      Full Groom Pass 4-Visit:
        satisfaction_redo_days: =satisfaction_redo_days
        redo_per_visit: =redo_per_visit
      Full Groom Pass 6-Visit:
        satisfaction_redo_days: =satisfaction_redo_days
        redo_per_visit: =redo_per_visit
      Spa Groom Pass 6-Visit:
        satisfaction_redo_days: =satisfaction_redo_days
        redo_per_visit: =redo_per_visit
