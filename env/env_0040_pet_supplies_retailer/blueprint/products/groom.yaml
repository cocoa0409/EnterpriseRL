    temporal_basis:
      clock: frozen_time
      anchor_event: the pass's purchase date
      anchor_source: groom_passes.purchased_on
      relation: not_after
      duration_source: variants.full_refund_window_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days from purchased_on, that date being day 0; a request
        on the last day is in time.
      boundary: inclusive
