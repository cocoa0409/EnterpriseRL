        refund_admin_fee_usd: =refund_admin_fee_usd
        single_visit_price_by_size_usd: =single_visit_price_by_size_usd
        club_min_term_months: =club_min_term_months
        club_early_termination_fee_usd: =club_early_termination_fee_usd
        club_cancel_effective: =club_cancel_effective
      Full Groom Pass 6-Visit:
