    A full refund is given only if the cancellation is requested no later than full_refund_window_days after the
    pass''s purchase date and no visit has been used. The window is counted in calendar days from purchased_on,
    that date being day 0; a request on the last day is in time. Otherwise the refund is the price paid minus every
    used visit (groom_msr_visits_used) at the single_visit_price_by_size_usd for the size class at purchase, minus
    refund_admin_fee_usd, and never below 0.00; the unused visits are removed. Groom Club Monthly is not refunded
    for the current month: a cancellation takes effect per club_cancel_effective, and a cancellation before club_min_term_months
    billed months (groom_msr_billed_months) is charged club_early_termination_fee_usd. Refunds go to the original
    payment.'
