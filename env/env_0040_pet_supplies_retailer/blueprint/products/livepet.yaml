- id: livepet_evt_claims
  subject: [livepet_claim, livepet_water_test, livepet_settle]
  rule: Claims are made in store (claim_channel) with the specimen or a dated photo where specimen_or_photo_required.
    The guarantee status is active when the claim is made. A claim is accepted only if it is made no later than
    guarantee_days after the purchase date. The guarantee is counted in calendar days from purchased_on, that date
    being day 0; a claim on the last day is in time. When water_test_required is true, a livepet_water_test row
    with result pass dated within water_sample_max_age_hours of the claim exists. A failed water test, injury after
    purchase or an improper habitat voids the guarantee (guarantee_void_conditions). Where vet_exam_required_for_claim,
    an exam within vet_exam_within_days of the onset is needed. A death within doa_hours of purchase is refunded
    in full where dead_on_arrival_full_refund. One claim per purchase (max_claims_per_purchase); the purchase record
    may be found by phone where receipt_lookup_by_phone.
  eligibility:
  - id: within_guarantee
    applies_to: [livepet_claim]
    kind: time
    condition: A claim is accepted only if it is made no later than guarantee_days after the purchase date.
    evidence_fields: [livepet_guarantees.purchased_on, livepet_guarantees.livepet_guarantee_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [livepet_guarantees.livepet_guarantee_id]
      action_bindings:
        livepet_guarantees.livepet_guarantee_id: livepet_guarantee_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the purchase date
      anchor_source: livepet_guarantees.purchased_on
      relation: not_after
      duration_source: variants.guarantee_days
      unit: calendar_days
      counting_rule: The guarantee is counted in calendar days from purchased_on, that date being day 0; a claim
        on the last day is in time.
      boundary: inclusive
  - id: passing_water_test
    applies_to: [livepet_claim]
    kind: authorization
    condition: When water_test_required is true, a livepet_water_test row with result pass dated within water_sample_max_age_hours
      of the claim exists.
    evidence_fields: [livepet_events.water_test_result, livepet_events.event_date, livepet_events.livepet_guarantee_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [livepet_events.livepet_guarantee_id]
      action_bindings:
        livepet_events.livepet_guarantee_id: livepet_guarantee_id
  - id: claim_on_active
    applies_to: [livepet_claim]
    kind: state
    condition: The guarantee status is active when the claim is made.
    evidence_fields: [livepet_guarantees.status, livepet_guarantees.livepet_guarantee_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [livepet_guarantees.livepet_guarantee_id]
      action_bindings:
        livepet_guarantees.livepet_guarantee_id: livepet_guarantee_id
    state_contract:
      field: livepet_guarantees.status
      allowed: [active]
  params:
    per_tier:
      Freshwater Fish Guarantee:
        guarantee_days: =guarantee_days
        water_test_required: =water_test_required
        water_sample_max_age_hours: =water_sample_max_age_hours
        water_parameters_checked: =water_parameters_checked
        specimen_or_photo_required: =specimen_or_photo_required
        vet_exam_required_for_claim: =vet_exam_required_for_claim
        vet_exam_within_days: =vet_exam_within_days
        guarantee_void_conditions: =guarantee_void_conditions
        dead_on_arrival_full_refund: =dead_on_arrival_full_refund
        doa_hours: =doa_hours
        max_claims_per_purchase: =max_claims_per_purchase
        max_animals_per_claim: =max_animals_per_claim
        claim_channel: =claim_channel
        receipt_lookup_by_phone: =receipt_lookup_by_phone
        claim_processing_days: =claim_processing_days
      Saltwater Fish & Invertebrate Guarantee:
