category: livepet
display_name: Live Pet Health Guarantee
binding:
  holding_table: livepet_guarantees
  event_tables: [livepet_events]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    coverage_value_usd: coverage_value
lifecycle:
  states: [active, claimed, expired]
  transitions:
  - from: active
    to: claimed
    by: system
    means: a claim on the guarantee is settled
  - from: active
    to: expired
    by: system
    means: guarantee_days pass without a claim
accounts:
- key: coverage_value
  unit: USD
  meaning: 'covered value of the purchase line: the purchase books in, remedies book out'
parameter_schema:
  guarantee_days: calendar days after purchase during which a live animal that dies or falls ill is covered; integer,
    days
  water_test_required: whether a claim needs a water sample tested in store; boolean
  water_sample_max_age_hours: hours before the claim within which the water sample must have been drawn; integer,
    hours
  water_parameters_checked: water parameters that must be within range for the claim; list
  specimen_or_photo_required: whether the deceased animal or a dated photo must be presented; boolean
  vet_exam_required_for_claim: whether an illness or death claim needs a veterinary exam record; boolean
  vet_exam_within_days: calendar days after the onset reported within which the exam must take place; integer, days
  free_wellness_exam_days: calendar days after purchase within which one free exam at a Tailwise Vet Clinic is offered;
    0 means none; integer, days
  vet_cost_reimbursement_cap_usd: largest reimbursement of outside veterinary costs for a covered illness; USD
  remedy_options: remedies available on an accepted claim; list of replacement | store_credit | refund
  refund_requires_receipt: whether a refund needs the original purchase record; boolean
  max_claims_per_purchase: claims allowed per covered purchase; integer, count
  max_animals_per_claim: animals of the purchase that one claim may cover; integer, animals
  habitat_check_required: whether a habitat appropriate to the species must be on record (bought or confirmed by
    staff) at purchase; boolean
  min_buyer_age_years: youngest age of the purchaser of record; integer, years
  max_animals_per_purchase: largest number of animals per purchase; integer, animals
  healthy_return_days: calendar days after purchase within which a healthy animal may be brought back for rehoming;
    integer, days
  healthy_return_remedy: remedy for a healthy return; enum store_credit | none
  healthy_return_value_pct: share of the price paid given back on a healthy return; number, percent
  same_species_replacement_only: whether a replacement must be the same species; boolean
  replacement_price_difference_payable: whether a higher-priced replacement may be taken by paying the difference;
    boolean
  guarantee_void_conditions: situations in which the guarantee does not apply; list
  care_sheet_required: whether the species care sheet is given at purchase; boolean
  quarantine_days: days the store holds an animal before sale; integer, days
  starter_kit_discount_pct: discount on a habitat starter kit bought with the animal; number, percent
  plus_discount_pct: discount on the animal for an active Tailwise Plus tier; number, percent
  points_multiplier: multiplier on the Pals Rewards base earn rate for live animal purchases; integer
  certificate_accepted: whether Pals Rewards certificates can be used on the animal; boolean
  store_credit_validity_days: calendar days a store credit from a claim stays usable; integer, days
  replacement_window_days: calendar days after the claim within which a replacement must be collected; integer,
    days
  claim_channel: where a claim may be made; enum in_store_only
  dead_on_arrival_full_refund: whether an animal dead within 48 hours of purchase is refunded in full regardless
    of water test; boolean
  doa_hours: hours after purchase within which a death counts as dead on arrival; integer, hours
  acclimation_guide_required: whether drip or float acclimation instructions are given; boolean
  invertebrate_coverage: whether invertebrates bought with the fish are covered; boolean
  fish_per_gallon_guideline: stocking guideline used at the habitat check; number, inches of fish per gallon; 0
    means not applicable
  species_pairing_rules: species that may not be sold to share a habitat with the purchase; list
  exotic_permit_states: states where the species group needs a permit and is not sold; list of state codes
  transfer_to_new_owner: whether the guarantee transfers with the animal to another person; boolean
  receipt_lookup_by_phone: whether the purchase record may be found by the profile phone number instead of the paper
    receipt; boolean
  vet_records_required_for_reimbursement: whether an itemized invoice is needed for reimbursement; boolean
  reimbursement_method: how outside vet costs are reimbursed; enum original_payment | none
  claim_processing_days: business days to settle a claim after the evidence is complete; integer, business days
  free_exam_clinic_only: whether the free wellness exam is available only at a Tailwise Vet Clinic; boolean
  aquatic_restock_wait_days: days the customer is asked to wait before restocking the tank after a claim; integer,
    days
  multi_animal_discount_pct: discount when buying several animals of the same species at once; number, percent
  min_quantity_for_multi_discount: animals needed for the multi-animal discount; integer, animals
  live_food_excluded: whether feeder animals and live food are outside the guarantee; boolean
