        min_quantity_for_multi_discount: =min_quantity_for_multi_discount
- id: livepet_sale_requirements
  subject: [livepet_purchase]
  rule: A live animal is sold only to a purchaser of at least min_buyer_age_years with a habitat check on record
    (habitat_check_required), no more than max_animals_per_purchase per line, after the store's quarantine_days,
    with the care sheet and acclimation guide. Certificates are not accepted, live animals earn points only per
    points_multiplier, and starter kits take starter_kit_discount_pct.
  eligibility: []
  params:
    per_tier:
      Freshwater Fish Guarantee:
        min_buyer_age_years: =min_buyer_age_years
        habitat_check_required: =habitat_check_required
        max_animals_per_purchase: =max_animals_per_purchase
        quarantine_days: =quarantine_days
        care_sheet_required: =care_sheet_required
        acclimation_guide_required: =acclimation_guide_required
        certificate_accepted: =certificate_accepted
        points_multiplier: =points_multiplier
        starter_kit_discount_pct: =starter_kit_discount_pct
        plus_discount_pct: =plus_discount_pct
        fish_per_gallon_guideline: =fish_per_gallon_guideline
        live_food_excluded: =live_food_excluded
        invertebrate_coverage: =invertebrate_coverage
        transfer_to_new_owner: =transfer_to_new_owner
      Saltwater Fish & Invertebrate Guarantee:
        min_buyer_age_years: =min_buyer_age_years
        habitat_check_required: =habitat_check_required
        max_animals_per_purchase: =max_animals_per_purchase
        quarantine_days: =quarantine_days
        care_sheet_required: =care_sheet_required
        acclimation_guide_required: =acclimation_guide_required
        certificate_accepted: =certificate_accepted
        points_multiplier: =points_multiplier
        starter_kit_discount_pct: =starter_kit_discount_pct
        plus_discount_pct: =plus_discount_pct
        fish_per_gallon_guideline: =fish_per_gallon_guideline
        live_food_excluded: =live_food_excluded
        invertebrate_coverage: =invertebrate_coverage
        transfer_to_new_owner: =transfer_to_new_owner
      Live Coral Guarantee:
        min_buyer_age_years: =min_buyer_age_years
        habitat_check_required: =habitat_check_required
        max_animals_per_purchase: =max_animals_per_purchase
        quarantine_days: =quarantine_days
        care_sheet_required: =care_sheet_required
