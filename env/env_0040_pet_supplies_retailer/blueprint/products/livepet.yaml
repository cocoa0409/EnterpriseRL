        min_quantity_for_multi_discount: =min_quantity_for_multi_discount
      Live Coral Guarantee:
        species_pairing_rules: =species_pairing_rules
        exotic_permit_states: =exotic_permit_states
        multi_animal_discount_pct: =multi_animal_discount_pct
        min_quantity_for_multi_discount: =min_quantity_for_multi_discount
      Small Animal Guarantee:
        species_pairing_rules: =species_pairing_rules
        exotic_permit_states: =exotic_permit_states
