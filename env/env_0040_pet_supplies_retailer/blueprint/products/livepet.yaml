events:
- type: livepet_purchase
  target: livepet_guarantees
  mutation: create
  meaning: a live animal purchase line opens a guarantee
  grain: one row per purchase line
  fields:
    livepet_guarantee_id: new id
    customer_id: purchaser
    variant_name: guarantee
    store_id: store
    species_description: species
    quantity: animals
    unit_price_usd: price
    purchased_on: date
    purchase_time: time
    coverage_value_usd: quantity x price
  account: coverage_value
  direction: in
  triggers: []
- type: livepet_water_test
  target: livepet_events
  meaning: a water sample is tested in store
  grain: one row per test
  distinguish_by: [event_date, water_test_result]
  fields:
    event_date: test date
    water_test_result: pass or fail
  triggers: []
- type: livepet_free_exam
  target: livepet_events
  meaning: the free wellness exam is used
  grain: one row per guarantee
  distinguish_by: [event_date]
  fields:
    event_date: exam date
  triggers: []
- type: livepet_claim
  target: livepet_events
  meaning: a death or illness claim is accepted
  grain: one row per claim
  distinguish_by: [event_date]
  fields:
    event_date: claim date
    animals_claimed: animals
    remedy: remedy chosen
    amount_usd: value
  triggers:
  - event: livepet:livepet_remedy
    map:
      original_event_id: livepet_event_id
      remedy: remedy
      animals_claimed: animals_claimed
  - event: livepet:livepet_settle
- type: livepet_remedy
  target: livepet_events
  meaning: the remedy of a claim or healthy return is given
  grain: one row per remedy
  distinguish_by: [original_event_id, remedy]
  fields:
    event_date: date
    original_event_id: claim
    remedy: remedy
    animals_claimed: animals
    amount_usd: value
  account: coverage_value
  direction: out
  triggers: []
- type: livepet_healthy_return
  target: livepet_events
  meaning: a healthy animal is brought back for rehoming
  grain: one row per return
  distinguish_by: [event_date]
  fields:
    event_date: date
    animals_claimed: animals
    remedy: store_credit
    amount_usd: credit
  triggers:
  - event: livepet:livepet_remedy
    map:
      original_event_id: livepet_event_id
      remedy: store_credit
- type: livepet_settle
  target: livepet_guarantees
  mutation:
    transition:
      from: active
      to: claimed
  meaning: the guarantee is used
  grain: one transition per guarantee
  fields:
    closed_on: date
  triggers: []
- type: livepet_expire
  target: livepet_guarantees
  mutation:
    transition:
      from: active
      to: expired
  meaning: the guarantee lapses
  grain: one transition per guarantee
  fields:
    closed_on: date
  triggers: []
measures:
- id: livepet_msr_claims
  window: life of the guarantee
  measure: count of livepet_claim rows of the guarantee
policies:
- id: livepet_agg_multi_holding
  subject: [livepet_purchase]
  rule: 'Every live animal purchase line opens its own guarantee; a customer may hold any number. Guarantees are
    never combined: a claim covers animals of one purchase line only, at most max_animals_per_claim.'
  eligibility: []
  params:
    max_per_customer: null
- id: livepet_agg_household_limits
  subject: [livepet_purchase]
  rule: 'Purchases are checked against the customer''s whole household on record: species_pairing_rules are applied
    to the animals of the customer''s active guarantees, and exotic_permit_states to the customer''s shipping_state.
    The multi-animal discount applies per purchase line of at least min_quantity_for_multi_discount animals.'
  eligibility: []
  params:
    per_tier:
      Freshwater Fish Guarantee:
        species_pairing_rules: =species_pairing_rules
        exotic_permit_states: =exotic_permit_states
        multi_animal_discount_pct: =multi_animal_discount_pct
        min_quantity_for_multi_discount: =min_quantity_for_multi_discount
      Saltwater Fish & Invertebrate Guarantee:
        species_pairing_rules: =species_pairing_rules
        exotic_permit_states: =exotic_permit_states
