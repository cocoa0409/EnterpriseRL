- id: livepet_healthy_returns
  subject: [livepet_healthy_return]
  rule: A healthy animal may be brought back for rehoming where healthy_return_days is above 0. A healthy return
    is accepted only if it is made no later than healthy_return_days after the purchase date. The remedy is healthy_return_remedy
    worth healthy_return_value_pct of the price paid; fish, invertebrates and corals are not taken back healthy.
    The return window is counted in calendar days from purchased_on, that date being day 0.
  eligibility:
  - id: healthy_return_window
    applies_to: [livepet_healthy_return]
    kind: time
    condition: A healthy return is accepted only if it is made no later than healthy_return_days after the purchase
      date.
    evidence_fields: [livepet_guarantees.purchased_on, livepet_guarantees.livepet_guarantee_id]
    evidence_contract:
