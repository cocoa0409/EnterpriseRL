      timing: pre_action
      correlation_keys:
      - [livepet_guarantees.livepet_guarantee_id]
      action_bindings:
        livepet_guarantees.livepet_guarantee_id: livepet_guarantee_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the purchase date
      anchor_source: livepet_guarantees.purchased_on
      relation: not_after
      duration_source: variants.healthy_return_days
      unit: calendar_days
      counting_rule: The return window is counted in calendar days from purchased_on, that date being day 0.
      boundary: inclusive
  params:
    per_tier:
