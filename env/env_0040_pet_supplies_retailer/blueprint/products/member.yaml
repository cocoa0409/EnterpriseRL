- id: member_plus_cancellation
  subject: [member_cancel_request, member_cancel_withdraw, member_downgrade_effective, member_fee_refund, member_tier_change]
  rule: Only the customer can cancel a paid tier. The fee of the current term is refunded only if the cancellation
    is requested no later than cancel_full_refund_days after that fee was charged. The window is counted in calendar
    days from the event_date of the member_fee_charge row of the current term, that date being day 0; a request
    on the last day is in time. An in-window cancellation ends the paid tier the same day, refunds that fee to the
    original payment and moves the membership to the free tier earned by spend; perk credit already used in the
    term is deducted from the refund. Outside the window the cancellation takes effect per cancel_effective (end
    of the billing month for monthly, end of the term for annual), auto-renewal is switched off, paid benefits continue
    until then, and nothing is refunded unless cancel_prorated_refund_after_window. A pending cancellation may be
    withdrawn by the customer until it takes effect. Cancelling a trial before trial_end_date ends the paid tier
    at once with no fee.
  eligibility:
  - id: in_window_refund
    applies_to: [member_fee_refund]
    kind: time
    condition: The fee of the current term is refunded only if the cancellation is requested no later than cancel_full_refund_days
      after that fee was charged.
    evidence_fields: [member_events.event_date, member_events.member_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [member_events.member_event_id]
      action_bindings:
        member_events.member_event_id: original_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: that fee was charged
      anchor_source: member_events.event_date
      relation: not_after
      duration_source: variants.cancel_full_refund_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days from the event_date of the member_fee_charge row of
        the current term, that date being day 0; a request on the last day is in time.
      boundary: inclusive
  params:
    per_tier:
      Pals Rewards Member:
        cancel_full_refund_days: =cancel_full_refund_days
        cancel_effective: =cancel_effective
        cancel_prorated_refund_after_window: =cancel_prorated_refund_after_window
      Pals Rewards Insider:
        cancel_full_refund_days: =cancel_full_refund_days
        cancel_effective: =cancel_effective
        cancel_prorated_refund_after_window: =cancel_prorated_refund_after_window
      Pals Rewards VIP:
        cancel_full_refund_days: =cancel_full_refund_days
        cancel_effective: =cancel_effective
        cancel_prorated_refund_after_window: =cancel_prorated_refund_after_window
      Tailwise Plus Monthly:
        cancel_full_refund_days: =cancel_full_refund_days
        cancel_effective: =cancel_effective
        cancel_prorated_refund_after_window: =cancel_prorated_refund_after_window
      Tailwise Plus Annual:
        cancel_full_refund_days: =cancel_full_refund_days
        cancel_effective: =cancel_effective
        cancel_prorated_refund_after_window: =cancel_prorated_refund_after_window
      Tailwise Plus Premier Annual:
