  rule: Where perk_credit_grant_timing is term_start, each charged term fee grants annual_perk_credit_usd of perk
    credit. The membership status is active or pending_downgrade when perk credit is used. It pays only for services
    in perk_credit_eligible_categories, applied after every other discount of that service and never producing cash
    back; one service record may be paid by perk credit once. Where perk_credit_expires_with_term is true the unused
