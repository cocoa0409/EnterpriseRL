  measures: [member_msr_goodwill_365d, member_msr_birthday_pets_this_year]
- id: member_plus_billing
  subject: [member_fee_charge, member_fee_declined, member_past_due, member_reinstate, member_lapse]
  rule: A paid tier charges membership_fee_usd on each next_billing_date while auto_renew is true; an annual tier's
    next term starts the day after plus_term_end. A declined fee is retried for fee_retry_days calendar days, then
    the membership goes past due and, with benefits_during_past_due false, loses free shipping, perk credit use
    and points earning until reinstated. The overdue fee is paid no later than past_due_grace_days after the membership
    went past due. The grace period is counted in calendar days from the day the membership went past due. Paying
    the overdue fee reinstates the paid tier for the same term dates; otherwise the paid tier lapses to the free
    tier earned by spend. No late fee is ever charged.
  eligibility:
  - id: reinstate_in_grace
    applies_to: [member_reinstate]
    kind: time
    condition: The overdue fee is paid no later than past_due_grace_days after the membership went past due.
    evidence_fields: [member_events.event_date, member_events.member_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [member_events.member_event_id]
      action_bindings:
        member_events.member_event_id: declined_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the membership went past due
      anchor_source: member_events.event_date
      relation: not_after
      duration_source: variants.past_due_grace_days
      unit: calendar_days
      counting_rule: The grace period is counted in calendar days from the day the membership went past due.
      boundary: inclusive
  params:
    per_tier:
      Pals Rewards Member:
        membership_fee_usd: =membership_fee_usd
        fee_retry_days: =fee_retry_days
        past_due_grace_days: =past_due_grace_days
        benefits_during_past_due: =benefits_during_past_due
      Pals Rewards Insider:
        membership_fee_usd: =membership_fee_usd
        fee_retry_days: =fee_retry_days
        past_due_grace_days: =past_due_grace_days
        benefits_during_past_due: =benefits_during_past_due
      Pals Rewards VIP:
        membership_fee_usd: =membership_fee_usd
        fee_retry_days: =fee_retry_days
        past_due_grace_days: =past_due_grace_days
        benefits_during_past_due: =benefits_during_past_due
      Tailwise Plus Monthly:
