category: member
display_name: Pals Rewards and Tailwise Plus
binding:
  holding_table: member_memberships
  event_tables: [member_events]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    points_balance: points
    perk_credit_balance_usd: perk_credit
lifecycle:
  states: [active, past_due, pending_downgrade, closed]
  transitions:
  - from: active
    to: past_due
    by: system
    means: a paid tier's fee is still declined after fee_retry_days
  - from: past_due
    to: active
    by: agent
    means: the overdue fee is paid with a working card and the paid tier continues
  - from: past_due
    to: active
    by: system
    means: past_due_grace_days run out and the membership lapses to the free tier earned by spend
  - from: active
    to: pending_downgrade
    by: user
    means: the customer cancels a paid tier effective at the end of the period
  - from: pending_downgrade
    to: active
    by: user
    means: the customer withdraws the cancellation before it takes effect
  - from: pending_downgrade
    to: active
    by: system
    means: the cancellation takes effect and the membership moves to the free tier earned by spend
  - from: active
    to: closed
    by: user
    means: the customer closes the rewards account
accounts:
- key: points
  unit: points
  meaning: 'Pals Rewards points: earnings and bonuses book in; reversals, certificate conversions, expiry and forfeiture
    book out'
- key: perk_credit
  unit: USD
  meaning: 'perk credit of the current paid term: grants book in, service payments and lapses book out'
parameter_schema:
  membership_fee_usd: fee per billing period; USD
  billing_cycle: fee billing period; enum none | monthly | annual
  qualifying_spend_threshold_usd: qualifying spend in one calendar year that earns the tier; USD
  tier_qualification_period: spend window evaluated for a free tier; enum current_or_prior_calendar_year
  tier_upgrade_effective_days: calendar days after the qualifying purchase within which a free-tier upgrade takes
    effect; integer, days
  tier_retention_years: calendar years after the year of qualification through which an earned free tier is kept;
    integer, years
  base_points_per_usd: points earned per qualifying dollar before any program multiplier; integer, points
  points_rounding: how fractional points are treated per earning transaction; enum round_down
  max_points_per_transaction: largest number of points one earning transaction may post; integer, points
  points_earn_excluded_categories: purchases that never earn points; list
  points_earn_on_membership_fee: whether membership fees earn points; boolean
  points_per_certificate: points converted into one reward certificate; integer, points
  certificate_value_usd: value of one reward certificate; USD
  auto_certificate_issue: whether certificates are issued automatically whenever the balance reaches points_per_certificate;
    boolean
  certificate_validity_days: calendar days a certificate stays usable after issue; integer, days
  certificates_per_transaction_max: certificates usable on one order or checkout; integer, count
  certificate_excluded_categories: purchases on which certificates cannot be used; list
  certificate_partial_use_allowed: whether an unused remainder of a certificate stays usable; boolean
  certificate_combinable_with_coupons: whether certificates combine with promotional coupons; boolean
  certificate_reissue_on_return: whether a certificate used on a returned order is reissued with a fresh validity;
    boolean
  certificate_reissue_allowed: whether an expired, unused certificate may be reissued once as a courtesy; boolean
  certificate_reissue_window_days: calendar days after a certificate's expiry within which a courtesy reissue may
    be granted; integer, days
  points_inactivity_expiry_days: calendar days without any points earning after which the whole balance expires;
    0 means points never expire while the tier is held; integer, days
  points_reversal_on_refund: whether points earned on a refunded purchase are taken back; boolean
  negative_balance_allowed: whether a reversal may take the balance below zero; boolean
  enrollment_bonus_points: points posted when the tier is first joined; integer, points
  tier_upgrade_bonus_points: points posted when a free tier is earned by spend; integer, points
  pet_birthday_bonus_points: points posted per eligible pet in the pet's birthday month; integer, points
  pet_birthday_bonus_max_pets: pets per membership that can receive a birthday bonus in one calendar year; integer,
    count
  pet_birthday_profile_min_age_days: the pet profile must have been on the account this many calendar days before
    the birthday; integer, days
  goodwill_points_max_per_contact: largest service-recovery goodwill award in one contact; integer, points
  goodwill_points_max_per_365_days: largest total goodwill awarded to a membership in any rolling 365 days; integer,
    points
  order_free_shipping_threshold_usd: order subtotal at or above which standard ship-to-home shipping is free for
    this tier; 0.00 means always free; USD
  annual_perk_credit_usd: perk credit granted at the start of each membership term; USD
  perk_credit_eligible_categories: services the perk credit may pay for; list
  perk_credit_expires_with_term: whether unused perk credit lapses at the end of the term; boolean
  perk_credit_grant_timing: when the perk credit is granted; enum none | term_start
  free_trial_days: free days before the first fee for a customer eligible for a trial; integer, days
  trial_lookback_days: a trial is available only with no membership fee charged in this many calendar days before
    enrollment; integer, days
  trial_requires_card_on_file: whether a trial needs a payment card on file; boolean
  fee_retry_days: calendar days a declined fee is retried before the membership becomes past due; integer, days
  past_due_grace_days: calendar days in past due after which the paid tier lapses to the free tier earned by spend;
    integer, days
  benefits_during_past_due: whether paid benefits and points earning continue while past due; boolean
  cancel_full_refund_days: calendar days after the current term's fee was charged within which a cancellation refunds
    that fee in full; integer, days
  cancel_prorated_refund_after_window: whether a cancellation after the full-refund window refunds the unused part
    of the term; boolean
  cancel_effective: when a cancellation of the tier takes effect outside the full-refund window; enum immediate
    | end_of_billing_period | end_of_term
  auto_renew_default: whether the paid term renews automatically unless cancelled; boolean
  upgrade_credit_unused_fee: whether moving to a higher paid tier credits the unused part of the current fee against
    the new fee; boolean
  points_forfeited_on_close: whether the points balance and open certificates are forfeited when the rewards account
    is closed; boolean
