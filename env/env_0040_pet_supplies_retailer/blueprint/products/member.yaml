events:
- type: member_enroll
  target: member_memberships
  mutation: create
  meaning: a customer joins Pals Rewards on a free tier or directly on a paid tier
  grain: one row per customer
  fields:
    membership_id: new id
    customer_id: owner
    variant_name: tier joined
    enrolled_on: date
    tier_effective_on: date
    last_change_reason: enrollment or plus_purchase
    plus_term_start: paid term start
    plus_term_end: paid term end
    next_billing_date: first fee date
    auto_renew: auto-renewal
    trial_end_date: trial end
    points_balance: '0'
    perk_credit_balance_usd: '0.00'
  triggers:
  - event: member:member_bonus_points
    map:
      bonus_kind: enrollment
      event_date: enrolled_on
- type: member_tier_change
  target: member_memberships
  mutation: update
  meaning: 'the tier changes: earned by spend, re-evaluated in January, bought or upgraded, or ended by an in-window
    cancellation'
  grain: one row per tier change
  fields:
    variant_name: new tier
    tier_effective_on: date
    last_change_reason: why
    plus_term_start: paid term start
    plus_term_end: paid term end
    next_billing_date: next fee date
    auto_renew: auto-renewal
  triggers:
  - event: member:member_fee_refund
    when:
      last_change_reason: plus_cancel_refund
  - event: member:member_bonus_points
    when:
      last_change_reason: spend_upgrade
    map:
      bonus_kind: tier_upgrade
      event_date: tier_effective_on
  - event: member:member_fee_charge
    when:
      last_change_reason: [plus_purchase, plus_upgrade]
- type: member_points_earn
  target: member_events
  meaning: points are earned on a qualifying purchase
  grain: one row per earning purchase record
  distinguish_by: [source_category, source_event_id]
  fields:
    event_date: date of the purchase
    source_category: program
    source_event_id: purchase record
    qualifying_spend_usd: spend that earns
    points: points posted
  account: points
  direction: in
  triggers: []
- type: member_points_reverse
  target: member_events
  meaning: points earned on a purchase are taken back after a refund
  grain: one row per refunded purchase record
  distinguish_by: [source_category, source_event_id]
  fields:
    event_date: refund date
    source_category: program
    source_event_id: the original purchase record
    qualifying_spend_usd: refunded spend
    points: points taken back
  account: points
  direction: out
  triggers: []
- type: member_bonus_points
  target: member_events
  meaning: 'bonus points are posted: enrollment, tier upgrade, pet birthday or service-recovery goodwill'
  grain: one row per bonus award
  distinguish_by: [bonus_kind, event_date, pet_id]
  fields:
    event_date: award date
    bonus_kind: kind
    pet_id: pet for a birthday bonus
    points: points awarded
  account: points
  direction: in
  triggers: []
- type: member_certificate_issue
  target: member_events
  meaning: points are converted into a reward certificate
  grain: one row per certificate
  distinguish_by: [event_date, points]
  fields:
    event_date: issue date
    points: points converted
    certificate_value_usd: value
    certificate_expires_on: last usable day
  account: points
  direction: out
  triggers: []
- type: member_certificate_reissue
  target: member_events
  meaning: an expired unused certificate, or one used on a returned order, is reissued
  grain: one row per reissued certificate
  distinguish_by: [original_event_id]
  fields:
    event_date: reissue date
    original_event_id: the certificate reissued
    certificate_value_usd: value
    certificate_expires_on: new last usable day
  triggers: []
- type: member_points_expire
  target: member_events
  meaning: the balance expires after the inactivity period
  grain: one row per expiry
  distinguish_by: [event_date]
  fields:
    event_date: expiry date
    points: points expired
  account: points
  direction: out
  triggers: []
- type: member_fee_charge
  target: member_events
  meaning: a paid tier's fee is charged for a billing period
  grain: one row per billing period
  distinguish_by: [billing_period_start]
  fields:
    event_date: charge date
    billing_period_start: period start
    amount_usd: fee charged
  triggers:
  - event: member:member_perk_credit_grant
    map:
      event_date: event_date
      original_event_id: member_event_id
- type: member_fee_declined
  target: member_events
  meaning: a fee could not be collected by the end of the retry days
  grain: one row per billing period declined
  distinguish_by: [billing_period_start]
  fields:
    event_date: date
    billing_period_start: period
    amount_usd: fee attempted
  triggers:
  - event: member:member_past_due
- type: member_fee_refund
  target: member_events
  meaning: a charged fee is refunded on an in-window cancellation
  grain: one row per refunded fee
  distinguish_by: [original_event_id]
  fields:
    event_date: refund date
    original_event_id: fee charge refunded
    amount_usd: refund
    refund_method: original_payment
  triggers: []
- type: member_perk_credit_grant
  target: member_events
  meaning: the term's perk credit is granted
  grain: one row per term
  distinguish_by: [original_event_id]
  fields:
    event_date: grant date
    original_event_id: fee charge of the term
    perk_credit_usd: credit granted
  account: perk_credit
  direction: in
  triggers: []
- type: member_perk_credit_use
  target: member_events
  meaning: perk credit pays for an eligible service
  grain: one row per service record paid
  distinguish_by: [source_category, source_event_id]
  fields:
    event_date: date
    source_category: groom, train or vet
    source_event_id: service record paid
    perk_credit_usd: credit used
  account: perk_credit
  direction: out
  triggers: []
- type: member_perk_credit_lapse
  target: member_events
  meaning: unused perk credit lapses at the end of the term or when the paid tier ends
  grain: one row per term
  distinguish_by: [event_date]
  fields:
    event_date: lapse date
    perk_credit_usd: credit lapsed
  account: perk_credit
  direction: out
  triggers: []
- type: member_past_due
  target: member_memberships
  mutation:
    transition:
      from: active
      to: past_due
  meaning: a paid tier goes past due
  grain: one transition per occurrence
  fields:
    next_billing_date: unchanged
  triggers: []
- type: member_reinstate
  target: member_memberships
  mutation:
    transition:
      from: past_due
      to: active
  meaning: the overdue fee is paid and the paid tier continues
  grain: one transition per occurrence
  fields:
    next_billing_date: one billing period after the overdue period start
  triggers:
  - event: member:member_fee_charge
- type: member_lapse
  target: member_memberships
  mutation:
    transition:
      from: past_due
      to: active
  meaning: the paid tier lapses to the free tier earned by spend
  grain: one transition per occurrence
  fields:
    variant_name: free tier earned
    tier_effective_on: date
    last_change_reason: plus_lapsed
    plus_term_start: cleared
    plus_term_end: cleared
    next_billing_date: cleared
  triggers:
  - event: member:member_perk_credit_lapse
- type: member_cancel_request
  target: member_memberships
  mutation:
    transition:
      from: active
      to: pending_downgrade
  meaning: the customer cancels a paid tier effective at the end of the period
  grain: one transition per request
  fields:
    downgrade_effective_on: effective date
    auto_renew: 'false'
  triggers: []
- type: member_cancel_withdraw
  target: member_memberships
  mutation:
    transition:
      from: pending_downgrade
      to: active
  meaning: the customer withdraws a pending cancellation
  grain: one transition per withdrawal
  fields:
    downgrade_effective_on: cleared
    auto_renew: 'true'
  triggers: []
- type: member_downgrade_effective
  target: member_memberships
  mutation:
    transition:
      from: pending_downgrade
      to: active
  meaning: a pending cancellation takes effect and the membership moves to the free tier earned by spend
  grain: one transition per occurrence
  fields:
    variant_name: free tier earned
    tier_effective_on: date
    last_change_reason: plus_ended
    downgrade_effective_on: cleared
    plus_term_start: cleared
    plus_term_end: cleared
    next_billing_date: cleared
  triggers:
  - event: member:member_perk_credit_lapse
- type: member_close
  target: member_memberships
  mutation:
    transition:
      from: active
      to: closed
  meaning: the customer closes the rewards account
  grain: one transition per membership
  fields:
    closed_on: date
    points_balance: set to 0
  account: points
  direction: out
  triggers: []
measures:
- id: member_msr_spend_current_year
  window: 1 January to 31 December of the current calendar year, by event_date
  measure: sum of qualifying_spend_usd of member_points_earn rows minus that of member_points_reverse rows of the
    membership
- id: member_msr_spend_prior_year
  window: the previous calendar year, by event_date
  measure: sum of qualifying_spend_usd of member_points_earn rows minus that of member_points_reverse rows of the
    membership
- id: member_msr_goodwill_365d
  window: rolling 365 calendar days ending on the award date
  measure: sum of points of member_bonus_points rows with bonus_kind goodwill
- id: member_msr_birthday_pets_this_year
  window: current calendar year
  measure: count of distinct pet_id on member_bonus_points rows with bonus_kind pet_birthday
- id: member_msr_days_since_last_earn
  window: from the latest member_points_earn or member_bonus_points row to today
  measure: calendar days since the event_date of the most recent points-earning row
- id: member_msr_recent_fee_charges
  window: trial_lookback_days calendar days ending the day before enrollment or upgrade
  measure: count of member_fee_charge rows of the membership
policies:
- id: member_agg_multi_holding
  subject: [member_enroll]
  rule: Pals Rewards is one membership per customer; every tier, free or paid, lives on that one membership. The
    customer has no other membership in status active, past_due or pending_downgrade. A customer asking to join
    again while a membership is open is handled as a tier change on it. A closed membership may be replaced by a
    new enrollment, which starts with a zero balance; nothing carries over from the closed one.
  eligibility:
  - id: one_membership
    applies_to: [member_enroll]
    kind: dedup
    condition: The customer has no other membership in status active, past_due or pending_downgrade.
    evidence_fields: [member_memberships.customer_id, member_memberships.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [member_memberships.customer_id]
      action_bindings:
        member_memberships.customer_id: customer_id
    dedup_contract:
      table: member_memberships
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status: [active, past_due, pending_downgrade]
      distinct_fields: []
  params: {max_per_customer: 1}
- id: member_enrollment_and_trials
  subject: [member_enroll, member_tier_change]
  rule: Joining is free and starts on Pals Rewards Member unless the customer buys a paid tier at once. Buying Tailwise
    Plus Monthly, Tailwise Plus Annual or Tailwise Plus Premier Annual needs a payment card on file; the term starts
    on the purchase date and runs one billing_cycle. A customer with no membership fee charged in the trial_lookback_days
    before the purchase (member_msr_recent_fee_charges is 0) receives free_trial_days before the first fee, recorded
    as trial_end_date, where trial_requires_card_on_file is met; the first fee is charged the day after the trial
    ends unless the customer cancels before then. The enrollment_bonus_points of the tier joined are posted once,
    on the first enrollment of that tier. Moving from Tailwise Plus Monthly to an annual tier, or from Tailwise
    Plus Annual to Tailwise Plus Premier Annual, starts a new term on the change date; where upgrade_credit_unused_fee
    is true the unused days of the current fee, prorated by calendar day, are credited against the new fee.
  eligibility: []
  params:
    per_tier:
      Pals Rewards Member:
        membership_fee_usd: =membership_fee_usd
        billing_cycle: =billing_cycle
        free_trial_days: =free_trial_days
        trial_lookback_days: =trial_lookback_days
        trial_requires_card_on_file: =trial_requires_card_on_file
        enrollment_bonus_points: =enrollment_bonus_points
        upgrade_credit_unused_fee: =upgrade_credit_unused_fee
        auto_renew_default: =auto_renew_default
      Pals Rewards Insider:
        membership_fee_usd: =membership_fee_usd
        billing_cycle: =billing_cycle
        free_trial_days: =free_trial_days
        trial_lookback_days: =trial_lookback_days
        trial_requires_card_on_file: =trial_requires_card_on_file
        enrollment_bonus_points: =enrollment_bonus_points
        upgrade_credit_unused_fee: =upgrade_credit_unused_fee
        auto_renew_default: =auto_renew_default
      Pals Rewards VIP:
        membership_fee_usd: =membership_fee_usd
        billing_cycle: =billing_cycle
        free_trial_days: =free_trial_days
        trial_lookback_days: =trial_lookback_days
        trial_requires_card_on_file: =trial_requires_card_on_file
        enrollment_bonus_points: =enrollment_bonus_points
        upgrade_credit_unused_fee: =upgrade_credit_unused_fee
        auto_renew_default: =auto_renew_default
      Tailwise Plus Monthly:
        membership_fee_usd: =membership_fee_usd
        billing_cycle: =billing_cycle
        free_trial_days: =free_trial_days
        trial_lookback_days: =trial_lookback_days
        trial_requires_card_on_file: =trial_requires_card_on_file
        enrollment_bonus_points: =enrollment_bonus_points
        upgrade_credit_unused_fee: =upgrade_credit_unused_fee
        auto_renew_default: =auto_renew_default
      Tailwise Plus Annual:
        membership_fee_usd: =membership_fee_usd
        billing_cycle: =billing_cycle
        free_trial_days: =free_trial_days
        trial_lookback_days: =trial_lookback_days
        trial_requires_card_on_file: =trial_requires_card_on_file
        enrollment_bonus_points: =enrollment_bonus_points
        upgrade_credit_unused_fee: =upgrade_credit_unused_fee
        auto_renew_default: =auto_renew_default
      Tailwise Plus Premier Annual:
        membership_fee_usd: =membership_fee_usd
        billing_cycle: =billing_cycle
        free_trial_days: =free_trial_days
        trial_lookback_days: =trial_lookback_days
        trial_requires_card_on_file: =trial_requires_card_on_file
        enrollment_bonus_points: =enrollment_bonus_points
        upgrade_credit_unused_fee: =upgrade_credit_unused_fee
        auto_renew_default: =auto_renew_default
  measures: [member_msr_recent_fee_charges]
- id: member_tier_qualification
  subject: [member_tier_change, member_lapse, member_downgrade_effective]
  rule: 'Free tiers are earned by qualifying spend: purchases that earned points, net of reversals. A membership
    moves up to Pals Rewards Insider or Pals Rewards VIP within tier_upgrade_effective_days once member_msr_spend_current_year
    reaches that tier''s qualifying_spend_threshold_usd, and keeps the tier through the end of the calendar year
    after the year of qualification (tier_retention_years). On 1 January every free-tier membership is re-evaluated
    against the higher of member_msr_spend_prior_year and member_msr_spend_current_year; a free tier never moves
    down during the year. Paid tiers are not earned by spend. When a paid tier ends, lapses or is refunded, the
    membership takes the highest free tier its spend and retention support at that date, and the free tier''s earn
    rate applies from that day.'
  eligibility: []
  params:
    per_tier:
      Pals Rewards Member:
        qualifying_spend_threshold_usd: =qualifying_spend_threshold_usd
        tier_qualification_period: =tier_qualification_period
        tier_upgrade_effective_days: =tier_upgrade_effective_days
        tier_retention_years: =tier_retention_years
        tier_upgrade_bonus_points: =tier_upgrade_bonus_points
      Pals Rewards Insider:
        qualifying_spend_threshold_usd: =qualifying_spend_threshold_usd
        tier_qualification_period: =tier_qualification_period
        tier_upgrade_effective_days: =tier_upgrade_effective_days
        tier_retention_years: =tier_retention_years
        tier_upgrade_bonus_points: =tier_upgrade_bonus_points
      Pals Rewards VIP:
        qualifying_spend_threshold_usd: =qualifying_spend_threshold_usd
        tier_qualification_period: =tier_qualification_period
        tier_upgrade_effective_days: =tier_upgrade_effective_days
        tier_retention_years: =tier_retention_years
        tier_upgrade_bonus_points: =tier_upgrade_bonus_points
      Tailwise Plus Monthly:
        qualifying_spend_threshold_usd: =qualifying_spend_threshold_usd
        tier_qualification_period: =tier_qualification_period
        tier_upgrade_effective_days: =tier_upgrade_effective_days
        tier_retention_years: =tier_retention_years
        tier_upgrade_bonus_points: =tier_upgrade_bonus_points
      Tailwise Plus Annual:
        qualifying_spend_threshold_usd: =qualifying_spend_threshold_usd
        tier_qualification_period: =tier_qualification_period
        tier_upgrade_effective_days: =tier_upgrade_effective_days
        tier_retention_years: =tier_retention_years
        tier_upgrade_bonus_points: =tier_upgrade_bonus_points
      Tailwise Plus Premier Annual:
        qualifying_spend_threshold_usd: =qualifying_spend_threshold_usd
        tier_qualification_period: =tier_qualification_period
        tier_upgrade_effective_days: =tier_upgrade_effective_days
        tier_retention_years: =tier_retention_years
        tier_upgrade_bonus_points: =tier_upgrade_bonus_points
  measures: [member_msr_spend_current_year, member_msr_spend_prior_year]
- id: member_evt_points_earn
  subject: [member_points_earn]
  rule: Points are earned on the purchase record that paid for merchandise or a service. The membership status is
    active or pending_downgrade when the purchase is made. A past-due membership earns nothing for purchases made
    while past due, and earnings are never posted retroactively for purchases made before enrollment. Points equal
    the qualifying spend times base_points_per_usd times the program's own multiplier (the Autoship, grooming, training
    or other program's points_multiplier, 1 where the program declares none), rounded down to a whole point per
    transaction and capped at max_points_per_transaction. Spend in points_earn_excluded_categories never earns,
    and membership fees earn only where points_earn_on_membership_fee is true. One purchase record earns once.
  eligibility:
  - id: earning_status
    applies_to: [member_points_earn]
    kind: state
    condition: The membership status is active or pending_downgrade when the purchase is made.
    evidence_fields: [member_memberships.status, member_memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [member_memberships.membership_id]
      action_bindings:
        member_memberships.membership_id: membership_id
    state_contract:
      field: member_memberships.status
      allowed: [active, pending_downgrade]
  params:
    program_multiplier_default: 1
    per_tier:
      Pals Rewards Member:
        base_points_per_usd: =base_points_per_usd
        points_rounding: =points_rounding
        max_points_per_transaction: =max_points_per_transaction
        points_earn_excluded_categories: =points_earn_excluded_categories
        points_earn_on_membership_fee: =points_earn_on_membership_fee
        benefits_during_past_due: =benefits_during_past_due
      Pals Rewards Insider:
        base_points_per_usd: =base_points_per_usd
        points_rounding: =points_rounding
        max_points_per_transaction: =max_points_per_transaction
        points_earn_excluded_categories: =points_earn_excluded_categories
        points_earn_on_membership_fee: =points_earn_on_membership_fee
        benefits_during_past_due: =benefits_during_past_due
      Pals Rewards VIP:
        base_points_per_usd: =base_points_per_usd
        points_rounding: =points_rounding
        max_points_per_transaction: =max_points_per_transaction
        points_earn_excluded_categories: =points_earn_excluded_categories
        points_earn_on_membership_fee: =points_earn_on_membership_fee
        benefits_during_past_due: =benefits_during_past_due
      Tailwise Plus Monthly:
        base_points_per_usd: =base_points_per_usd
        points_rounding: =points_rounding
        max_points_per_transaction: =max_points_per_transaction
        points_earn_excluded_categories: =points_earn_excluded_categories
        points_earn_on_membership_fee: =points_earn_on_membership_fee
        benefits_during_past_due: =benefits_during_past_due
      Tailwise Plus Annual:
        base_points_per_usd: =base_points_per_usd
        points_rounding: =points_rounding
        max_points_per_transaction: =max_points_per_transaction
        points_earn_excluded_categories: =points_earn_excluded_categories
        points_earn_on_membership_fee: =points_earn_on_membership_fee
        benefits_during_past_due: =benefits_during_past_due
      Tailwise Plus Premier Annual:
        base_points_per_usd: =base_points_per_usd
        points_rounding: =points_rounding
        max_points_per_transaction: =max_points_per_transaction
        points_earn_excluded_categories: =points_earn_excluded_categories
        points_earn_on_membership_fee: =points_earn_on_membership_fee
        benefits_during_past_due: =benefits_during_past_due
  formula:
    points: min(round(qualifying_spend_usd * base_points_per_usd * program_multiplier_default - 0.5), max_points_per_transaction)
- id: member_evt_points_reverse
  subject: [member_points_reverse]
  rule: When a purchase that earned points is refunded in whole or in part and points_reversal_on_refund is true,
    the points it earned are taken back in proportion to the refunded share of its qualifying spend, rounded down,
    never more than the purchase earned. Where negative_balance_allowed is false a reversal larger than the current
    balance takes the balance to 0 and the remainder is waived. Certificates already issued are not cancelled by
    a reversal.
  eligibility: []
  params:
    per_tier:
      Pals Rewards Member:
        points_reversal_on_refund: =points_reversal_on_refund
        negative_balance_allowed: =negative_balance_allowed
      Pals Rewards Insider:
        points_reversal_on_refund: =points_reversal_on_refund
        negative_balance_allowed: =negative_balance_allowed
      Pals Rewards VIP:
        points_reversal_on_refund: =points_reversal_on_refund
        negative_balance_allowed: =negative_balance_allowed
      Tailwise Plus Monthly:
        points_reversal_on_refund: =points_reversal_on_refund
        negative_balance_allowed: =negative_balance_allowed
      Tailwise Plus Annual:
        points_reversal_on_refund: =points_reversal_on_refund
        negative_balance_allowed: =negative_balance_allowed
      Tailwise Plus Premier Annual:
        points_reversal_on_refund: =points_reversal_on_refund
        negative_balance_allowed: =negative_balance_allowed
- id: member_evt_certificates
  subject: [member_certificate_issue, member_certificate_reissue]
  rule: The membership status is active or pending_downgrade when the certificate is issued or reissued. Where auto_certificate_issue
    is true, every time the balance reaches points_per_certificate that many points are converted into one certificate
    worth certificate_value_usd, usable for certificate_validity_days calendar days from issue (the issue date counting
    as day 1). Up to certificates_per_transaction_max certificates may be used on one order; they cannot be used
    on certificate_excluded_categories, an unused remainder is lost unless certificate_partial_use_allowed, and
    they combine with coupons where certificate_combinable_with_coupons. A certificate used on an order that is
    later returned is reissued with a fresh validity where certificate_reissue_on_return is true. Where certificate_reissue_allowed
    is true an expired, unused certificate may be reissued once as a courtesy. A courtesy reissue of an expired
    certificate is granted only if it is requested no later than certificate_reissue_window_days after the certificate's
    expiry date. The window is counted in calendar days from the certificate_expires_on of the member_certificate_issue
    row, the day after expiry being day 1; a request on the last day is in time. No member_certificate_reissue row
    already refers to the same certificate. Certificates have no cash value and are never refunded.
  eligibility:
  - id: certificate_status
    applies_to: [member_certificate_issue, member_certificate_reissue]
    kind: state
    condition: The membership status is active or pending_downgrade when the certificate is issued or reissued.
    evidence_fields: [member_memberships.status, member_memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [member_memberships.membership_id]
      action_bindings:
        member_memberships.membership_id: membership_id
    state_contract:
      field: member_memberships.status
      allowed: [active, pending_downgrade]
  - id: reissue_window
    applies_to: [member_certificate_reissue]
    kind: time
    condition: A courtesy reissue of an expired certificate is granted only if it is requested no later than certificate_reissue_window_days
      after the certificate's expiry date.
    evidence_fields: [member_events.certificate_expires_on, member_events.member_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [member_events.member_event_id]
      action_bindings:
        member_events.member_event_id: original_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the certificate's expiry date
      anchor_source: member_events.certificate_expires_on
      relation: not_after
      duration_source: variants.certificate_reissue_window_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days from the certificate_expires_on of the member_certificate_issue
        row, the day after expiry being day 1; a request on the last day is in time.
      boundary: inclusive
  - id: one_reissue
    applies_to: [member_certificate_reissue]
    kind: dedup
    condition: No member_certificate_reissue row already refers to the same certificate.
    evidence_fields: [member_events.original_event_id, member_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [member_events.original_event_id]
      action_bindings:
        member_events.original_event_id: original_event_id
    dedup_contract:
      table: member_events
      mode: separate_record
      object_bindings:
        original_event_id: original_event_id
      duplicate_filters:
        event_type: [member_certificate_reissue]
      distinct_fields: []
  params:
    per_tier:
      Pals Rewards Member:
        points_per_certificate: =points_per_certificate
        certificate_value_usd: =certificate_value_usd
        auto_certificate_issue: =auto_certificate_issue
        certificate_validity_days: =certificate_validity_days
        certificates_per_transaction_max: =certificates_per_transaction_max
        certificate_excluded_categories: =certificate_excluded_categories
        certificate_partial_use_allowed: =certificate_partial_use_allowed
        certificate_combinable_with_coupons: =certificate_combinable_with_coupons
        certificate_reissue_on_return: =certificate_reissue_on_return
        certificate_reissue_allowed: =certificate_reissue_allowed
        certificate_reissue_window_days: =certificate_reissue_window_days
      Pals Rewards Insider:
        points_per_certificate: =points_per_certificate
        certificate_value_usd: =certificate_value_usd
        auto_certificate_issue: =auto_certificate_issue
        certificate_validity_days: =certificate_validity_days
        certificates_per_transaction_max: =certificates_per_transaction_max
        certificate_excluded_categories: =certificate_excluded_categories
        certificate_partial_use_allowed: =certificate_partial_use_allowed
        certificate_combinable_with_coupons: =certificate_combinable_with_coupons
