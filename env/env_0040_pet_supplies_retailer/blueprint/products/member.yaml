- id: member_evt_bonus_points
  subject: [member_bonus_points]
  rule: Bonus points are of four kinds. Enrollment bonuses and tier-upgrade bonuses post with the enrollment or
    the spend upgrade that earns them. In each pet's birthday month the membership receives pet_birthday_bonus_points
    for that pet, for at most pet_birthday_bonus_max_pets pets per calendar year (member_msr_birthday_pets_this_year).
    A pet earns a birthday bonus only if its profile was created no later than pet_birthday_profile_min_age_days
    before its birthday. The profile age is counted in calendar days back from the pet's birthday in the current
    year; a profile created exactly pet_birthday_profile_min_age_days before is eligible. No member_bonus_points
    row of kind pet_birthday already exists for the same pet in the same calendar year. Service-recovery goodwill
    may be awarded by an agent when a Tailwise failure is confirmed in the records (a late, missing or damaged shipment,
    a salon or clinic cancellation, a dispensing error). The membership status is active or pending_downgrade when
    goodwill is awarded. One award may not exceed goodwill_points_max_per_contact and the goodwill in any rolling
    365 days (member_msr_goodwill_365d plus the award) may not exceed goodwill_points_max_per_365_days. Goodwill
    is never awarded for a customer's own late cancellation or no-show, and never in place of a refund the customer
    is owed.
  eligibility:
  - id: birthday_profile_age
    applies_to: [member_bonus_points]
    kind: time
    condition: A pet earns a birthday bonus only if its profile was created no later than pet_birthday_profile_min_age_days
      before its birthday.
    evidence_fields: [pets.date_of_birth, pets.pet_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pets.pet_id]
      action_bindings:
        pets.pet_id: pet_id
    temporal_basis:
      clock: frozen_time
      anchor_event: its birthday
      anchor_source: pets.date_of_birth
      relation: not_before
      duration_source: variants.pet_birthday_profile_min_age_days
      unit: calendar_days
      counting_rule: The profile age is counted in calendar days back from the pet's birthday in the current year;
        a profile created exactly pet_birthday_profile_min_age_days before is eligible.
      boundary: inclusive
  - id: one_birthday_bonus_per_pet_year
    applies_to: [member_bonus_points]
    kind: dedup
    condition: No member_bonus_points row of kind pet_birthday already exists for the same pet in the same calendar
      year.
    evidence_fields: [member_events.pet_id, member_events.bonus_kind, member_events.event_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [member_events.pet_id]
      action_bindings:
        member_events.pet_id: pet_id
    dedup_contract:
      table: member_events
      mode: separate_record
      object_bindings:
        pet_id: pet_id
        bonus_kind: bonus_kind
      duplicate_filters:
        event_type: [member_bonus_points]
      distinct_fields: [event_date]
  - id: goodwill_status
    applies_to: [member_bonus_points]
    kind: state
    condition: The membership status is active or pending_downgrade when goodwill is awarded.
    evidence_fields: [member_memberships.status, member_memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [member_memberships.membership_id]
      action_bindings:
        member_memberships.membership_id: membership_id
    state_contract:
      field: member_memberships.status
      allowed: [active, pending_downgrade]
  params:
    per_tier:
      Pals Rewards Member:
        pet_birthday_bonus_points: =pet_birthday_bonus_points
        pet_birthday_bonus_max_pets: =pet_birthday_bonus_max_pets
        pet_birthday_profile_min_age_days: =pet_birthday_profile_min_age_days
        goodwill_points_max_per_contact: =goodwill_points_max_per_contact
        goodwill_points_max_per_365_days: =goodwill_points_max_per_365_days
        enrollment_bonus_points: =enrollment_bonus_points
        tier_upgrade_bonus_points: =tier_upgrade_bonus_points
      Pals Rewards Insider:
        pet_birthday_bonus_points: =pet_birthday_bonus_points
        pet_birthday_bonus_max_pets: =pet_birthday_bonus_max_pets
        pet_birthday_profile_min_age_days: =pet_birthday_profile_min_age_days
        goodwill_points_max_per_contact: =goodwill_points_max_per_contact
        goodwill_points_max_per_365_days: =goodwill_points_max_per_365_days
        enrollment_bonus_points: =enrollment_bonus_points
        tier_upgrade_bonus_points: =tier_upgrade_bonus_points
      Pals Rewards VIP:
        pet_birthday_bonus_points: =pet_birthday_bonus_points
