events:
- type: order_place
  target: orders
  mutation: create
  meaning: a customer places a retail order
  grain: one row per order
  fields:
    order_id: new id
    customer_id: customer
    variant_name: method
    placed_on: date
    store_id: fulfilling store
    promised_date: promise
    promised_window_end: same-day window end
    alternate_pickup_name: alternate person
    substitutions_allowed: preference
    delivery_attempts: '0'
    pickup_extension_used: 'false'
  triggers: []
- type: order_line_charge
  target: order_events
  meaning: one order line is charged
  grain: one row per order line
  distinguish_by: [line_number]
  fields:
    event_date: charge date
    line_number: line
    sku: item
    item_description: description
    item_category: category
    final_sale: final sale flag
    quantity: units
    unit_price_usd: price
    coupon_discount_usd: coupon allocated
    certificate_applied_usd: certificate allocated
    amount_usd: line amount billed
  account: order_billed
  direction: in
  triggers:
  - event: member:member_points_earn
    map:
      event_date: event_date
      source_category: order
      source_event_id: order_event_id
      qualifying_spend_usd: amount_usd
- type: order_fee_charge
  target: order_events
  meaning: a fulfillment or redelivery fee is charged
  grain: one row per fee
  distinguish_by: [fee_kind, event_date]
  fields:
    event_date: date
    fee_kind: kind
    amount_usd: fee
  account: order_billed
  direction: in
  triggers: []
- type: order_ship
  target: orders
  mutation:
    transition:
      from: placed
      to: shipped
  meaning: the order ships
  grain: one transition per order
  fields:
    promised_date: unchanged
  triggers: []
- type: order_ready
  target: orders
  mutation:
    transition:
      from: placed
      to: ready_for_pickup
  meaning: a pickup order is ready
  grain: one transition per order
  fields:
    promised_date: unchanged
  triggers: []
- type: order_complete
  target: orders
  mutation:
    transition:
    - from: shipped
      to: completed
    - from: ready_for_pickup
      to: completed
  meaning: the order is delivered or picked up
  grain: one transition per order
  fields:
    completed_date: date
    completed_time: time
  triggers: []
- type: order_cancel
  target: orders
  mutation:
    transition:
    - from: placed
      to: cancelled
    - from: ready_for_pickup
      to: cancelled
  meaning: the customer cancels the order
  grain: one transition per order
  fields:
    cancelled_on: date
  triggers:
  - event: order:order_line_cancel
  - event: order:order_fee_refund
- type: order_pickup_expire
  target: orders
  mutation:
    transition:
      from: ready_for_pickup
      to: cancelled
  meaning: a pickup order is not collected within the hold
  grain: one transition per order
  fields:
    cancelled_on: date
  triggers:
  - event: order:order_line_cancel
- type: order_return_to_sender
  target: orders
  mutation:
    transition:
      from: shipped
      to: cancelled
  meaning: the carrier returns an undeliverable order
  grain: one transition per order
  fields:
    cancelled_on: date
    delivery_attempts: attempts made
  triggers:
  - event: order:order_line_cancel
- type: order_line_cancel
  target: order_events
  meaning: a line is cancelled before fulfillment and its charge reversed
  grain: one row per cancelled line
  distinguish_by: [original_event_id]
  fields:
    event_date: date
    original_event_id: line charge
    line_number: line
    quantity: units
    amount_usd: amount reversed
    refund_method: original_payment
  account: order_billed
  direction: out
  triggers:
  - event: member:member_points_reverse
    map:
      event_date: event_date
      source_category: order
      source_event_id: original_event_id
- type: order_fee_refund
  target: order_events
  meaning: a fulfillment fee is refunded
  grain: one row per refunded fee
  distinguish_by: [original_event_id]
  fields:
    event_date: date
    original_event_id: fee charge
    fee_kind: kind
    amount_usd: refund
    refund_method: original_payment
  account: order_billed
  direction: out
  triggers: []
- type: order_return_refund
  target: order_events
  meaning: a returned line is refunded after the item is received
  grain: one row per return authorization
  distinguish_by: [rma_id]
  fields:
    event_date: refund date
    original_event_id: line charge
    rma_id: return authorization
    quantity: units
    return_reason: reason
    deduction_usd: fee withheld
    amount_usd: refund
    refund_method: original_payment
  account: order_billed
  direction: out
  triggers:
  - event: member:member_points_reverse
    map:
      event_date: event_date
      source_category: order
      source_event_id: original_event_id
- type: order_damage_credit
  target: order_events
  meaning: a damaged or missing item is refunded without being returned
  grain: one row per credited line and reason
  distinguish_by: [original_event_id, return_reason]
  fields:
    event_date: date
    original_event_id: line charge
    quantity: units
    return_reason: damaged or missing
    amount_usd: credit
    refund_method: original_payment
  account: order_billed
  direction: out
  triggers:
  - event: member:member_points_reverse
    map:
      event_date: event_date
      source_category: order
      source_event_id: original_event_id
- type: order_replacement_ship
  target: order_events
  meaning: a free replacement is sent for a damaged, missing or wrong item
  grain: one row per replaced line
  distinguish_by: [original_event_id]
  fields:
    event_date: date
    original_event_id: line charge
    quantity: units
    return_reason: damaged, missing or wrong_item
  triggers: []
- type: order_update
  target: orders
  mutation: update
  meaning: the alternate pickup person, pickup store or pickup hold changes before completion
  grain: one row per change
  fields:
    alternate_pickup_name: new alternate person
    store_id: new pickup store
    promised_date: new pickup-by date after an extension
    pickup_extension_used: true after an extension
    delivery_attempts: attempts after a failed delivery
  triggers: []
measures:
- id: order_msr_merchandise_subtotal
  window: the order
  measure: sum over order_line_charge rows of quantity x unit_price_usd minus coupon_discount_usd, before certificates
- id: order_msr_units_already_refunded
  window: the order line
  measure: sum of quantity of order_return_refund and order_damage_credit rows whose original_event_id is the line
policies:
- id: order_agg_multi_holding
  subject: [order_place]
  rule: A customer may place any number of orders; each order has one fulfillment method for all its lines. Lines
    that cannot use the chosen method (frozen food without frozen_food_allowed, large items outside Large Item Freight
    Delivery) are placed on a separate order with a method that can carry them; separate orders are assessed for
    fees separately.
  eligibility: []
  params:
    max_per_customer: null
- id: order_agg_fees
  subject: [order_fee_charge, order_place]
  rule: The fulfillment fee is assessed once per order. A customer whose Tailwise Plus tier is active (or pending_downgrade)
    pays plus_member_fee_usd; otherwise, where member_threshold_applies is true and order_msr_merchandise_subtotal
    reaches the order_free_shipping_threshold_usd of the customer's Pals Rewards tier on the order date, no fee
    is charged; otherwise fulfillment_fee_usd is charged. A customer without a membership uses the Pals Rewards
    Member threshold. Same-Day Delivery needs order_msr_merchandise_subtotal of at least min_order_subtotal_usd.
    Orders are never combined across order numbers to reach a threshold, and certificates do not reduce the subtotal
    used for the threshold.
  eligibility: []
  params:
    per_tier:
      Standard Ship-to-Home:
        fulfillment_fee_usd: =fulfillment_fee_usd
        member_threshold_applies: =member_threshold_applies
        plus_member_fee_usd: =plus_member_fee_usd
        min_order_subtotal_usd: =min_order_subtotal_usd
      Expedited Ship-to-Home:
        fulfillment_fee_usd: =fulfillment_fee_usd
        member_threshold_applies: =member_threshold_applies
        plus_member_fee_usd: =plus_member_fee_usd
        min_order_subtotal_usd: =min_order_subtotal_usd
      Buy Online Pick Up In Store:
        fulfillment_fee_usd: =fulfillment_fee_usd
        member_threshold_applies: =member_threshold_applies
        plus_member_fee_usd: =plus_member_fee_usd
        min_order_subtotal_usd: =min_order_subtotal_usd
      Curbside Pickup:
        fulfillment_fee_usd: =fulfillment_fee_usd
        member_threshold_applies: =member_threshold_applies
        plus_member_fee_usd: =plus_member_fee_usd
        min_order_subtotal_usd: =min_order_subtotal_usd
      Same-Day Delivery:
        fulfillment_fee_usd: =fulfillment_fee_usd
        member_threshold_applies: =member_threshold_applies
        plus_member_fee_usd: =plus_member_fee_usd
        min_order_subtotal_usd: =min_order_subtotal_usd
      Large Item Freight Delivery:
        fulfillment_fee_usd: =fulfillment_fee_usd
        member_threshold_applies: =member_threshold_applies
        plus_member_fee_usd: =plus_member_fee_usd
        min_order_subtotal_usd: =min_order_subtotal_usd
  measures: [order_msr_merchandise_subtotal]
- id: order_evt_line_pricing
  subject: [order_line_charge]
  rule: Each line is charged quantity x unit price, at most max_quantity_per_line units. At most coupons_per_order_max
    coupons apply to an order; an order-level coupon is allocated over lines by coupon_allocation_basis, and certificates,
    where certificates_accepted, are allocated by certificate_allocation_basis after coupons and never on excluded
    categories. The line amount billed is quantity x unit price minus the coupon and certificate allocated, rounded
    half up to the cent; a rounding cent goes to the highest line. A substitution, where substitution_allowed and
    the customer allowed substitutions, is charged by substitution_price_rule.
  eligibility: []
  params:
    per_tier:
      Standard Ship-to-Home:
        max_quantity_per_line: =max_quantity_per_line
        frozen_food_allowed: =frozen_food_allowed
        substitution_allowed: =substitution_allowed
        substitution_price_rule: =substitution_price_rule
        coupons_per_order_max: =coupons_per_order_max
        certificates_accepted: =certificates_accepted
        coupon_allocation_basis: =coupon_allocation_basis
        certificate_allocation_basis: =certificate_allocation_basis
      Expedited Ship-to-Home:
        max_quantity_per_line: =max_quantity_per_line
        frozen_food_allowed: =frozen_food_allowed
        substitution_allowed: =substitution_allowed
        substitution_price_rule: =substitution_price_rule
        coupons_per_order_max: =coupons_per_order_max
        certificates_accepted: =certificates_accepted
        coupon_allocation_basis: =coupon_allocation_basis
        certificate_allocation_basis: =certificate_allocation_basis
      Buy Online Pick Up In Store:
        max_quantity_per_line: =max_quantity_per_line
        frozen_food_allowed: =frozen_food_allowed
        substitution_allowed: =substitution_allowed
        substitution_price_rule: =substitution_price_rule
        coupons_per_order_max: =coupons_per_order_max
        certificates_accepted: =certificates_accepted
        coupon_allocation_basis: =coupon_allocation_basis
        certificate_allocation_basis: =certificate_allocation_basis
      Curbside Pickup:
        max_quantity_per_line: =max_quantity_per_line
        frozen_food_allowed: =frozen_food_allowed
        substitution_allowed: =substitution_allowed
        substitution_price_rule: =substitution_price_rule
        coupons_per_order_max: =coupons_per_order_max
        certificates_accepted: =certificates_accepted
        coupon_allocation_basis: =coupon_allocation_basis
        certificate_allocation_basis: =certificate_allocation_basis
      Same-Day Delivery:
        max_quantity_per_line: =max_quantity_per_line
        frozen_food_allowed: =frozen_food_allowed
        substitution_allowed: =substitution_allowed
        substitution_price_rule: =substitution_price_rule
        coupons_per_order_max: =coupons_per_order_max
        certificates_accepted: =certificates_accepted
        coupon_allocation_basis: =coupon_allocation_basis
        certificate_allocation_basis: =certificate_allocation_basis
      Large Item Freight Delivery:
        max_quantity_per_line: =max_quantity_per_line
        frozen_food_allowed: =frozen_food_allowed
        substitution_allowed: =substitution_allowed
        substitution_price_rule: =substitution_price_rule
        coupons_per_order_max: =coupons_per_order_max
        certificates_accepted: =certificates_accepted
        coupon_allocation_basis: =coupon_allocation_basis
        certificate_allocation_basis: =certificate_allocation_basis
  formula:
    amount_usd: round(quantity * unit_price_usd - coupon_discount_usd - certificate_applied_usd, 2)
- id: order_cancellation
  subject: [order_cancel, order_line_cancel, order_fee_refund]
  rule: Only the customer can cancel an order, before it ships or is ready; a pickup order may also be cancelled
    while ready for pickup where cancel_while_ready_allowed is true. The order status is placed when a line is cancelled,
    unless the method allows cancelling while ready for pickup and the status is ready_for_pickup. Cancelling reverses
    every line in full to the original payment and, where fees_refunded_on_full_cancel is true, refunds the fulfillment
    fee. A shipped order cannot be cancelled; it is handled as a return once completed. Certificates used on a cancelled
    order are reissued per the rewards rules.
  eligibility: []
  params:
    per_tier:
      Standard Ship-to-Home:
        cancel_while_ready_allowed: =cancel_while_ready_allowed
        fees_refunded_on_full_cancel: =fees_refunded_on_full_cancel
      Expedited Ship-to-Home:
        cancel_while_ready_allowed: =cancel_while_ready_allowed
        fees_refunded_on_full_cancel: =fees_refunded_on_full_cancel
      Buy Online Pick Up In Store:
        cancel_while_ready_allowed: =cancel_while_ready_allowed
        fees_refunded_on_full_cancel: =fees_refunded_on_full_cancel
      Curbside Pickup:
        cancel_while_ready_allowed: =cancel_while_ready_allowed
        fees_refunded_on_full_cancel: =fees_refunded_on_full_cancel
      Same-Day Delivery:
        cancel_while_ready_allowed: =cancel_while_ready_allowed
        fees_refunded_on_full_cancel: =fees_refunded_on_full_cancel
      Large Item Freight Delivery:
        cancel_while_ready_allowed: =cancel_while_ready_allowed
        fees_refunded_on_full_cancel: =fees_refunded_on_full_cancel
- id: order_pickup_rules
  subject: [order_ready, order_complete, order_pickup_expire, order_update]
  rule: A pickup order is promised ready pickup_ready_hours after placement and held pickup_hold_days calendar days
    from the day it became ready; a customer may ask once for pickup_hold_extension_days more, recorded as pickup_extension_used.
    An order not collected by the end of the hold is cancelled and fully refunded, fulfillment fees included. Where
    pickup_id_required is true the store hands the order only to the customer or the named alternate person showing
    photo ID; where alternate_pickup_person_allowed is true the customer may name one alternate person, given exactly
    as the customer states the name. The order status is placed or ready_for_pickup when the change is requested.
    Where pickup_store_change_allowed is true the pickup store may be changed before the order is ready, restarting
    the promise.
  eligibility:
  - id: changeable_order
    applies_to: [order_update]
    kind: state
    condition: The order status is placed or ready_for_pickup when the change is requested.
    evidence_fields: [orders.status, orders.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [orders.order_id]
      action_bindings:
        orders.order_id: order_id
    state_contract:
      field: orders.status
      allowed: [placed, ready_for_pickup]
  params:
    per_tier:
      Standard Ship-to-Home:
        pickup_ready_hours: =pickup_ready_hours
        pickup_hold_days: =pickup_hold_days
        pickup_hold_extension_days: =pickup_hold_extension_days
        pickup_id_required: =pickup_id_required
        alternate_pickup_person_allowed: =alternate_pickup_person_allowed
        pickup_store_change_allowed: =pickup_store_change_allowed
        address_change_before_ship_allowed: =address_change_before_ship_allowed
      Expedited Ship-to-Home:
        pickup_ready_hours: =pickup_ready_hours
        pickup_hold_days: =pickup_hold_days
        pickup_hold_extension_days: =pickup_hold_extension_days
        pickup_id_required: =pickup_id_required
        alternate_pickup_person_allowed: =alternate_pickup_person_allowed
        pickup_store_change_allowed: =pickup_store_change_allowed
        address_change_before_ship_allowed: =address_change_before_ship_allowed
      Buy Online Pick Up In Store:
        pickup_ready_hours: =pickup_ready_hours
        pickup_hold_days: =pickup_hold_days
        pickup_hold_extension_days: =pickup_hold_extension_days
        pickup_id_required: =pickup_id_required
        alternate_pickup_person_allowed: =alternate_pickup_person_allowed
        pickup_store_change_allowed: =pickup_store_change_allowed
        address_change_before_ship_allowed: =address_change_before_ship_allowed
      Curbside Pickup:
        pickup_ready_hours: =pickup_ready_hours
        pickup_hold_days: =pickup_hold_days
        pickup_hold_extension_days: =pickup_hold_extension_days
        pickup_id_required: =pickup_id_required
        alternate_pickup_person_allowed: =alternate_pickup_person_allowed
        pickup_store_change_allowed: =pickup_store_change_allowed
        address_change_before_ship_allowed: =address_change_before_ship_allowed
      Same-Day Delivery:
        pickup_ready_hours: =pickup_ready_hours
        pickup_hold_days: =pickup_hold_days
        pickup_hold_extension_days: =pickup_hold_extension_days
        pickup_id_required: =pickup_id_required
        alternate_pickup_person_allowed: =alternate_pickup_person_allowed
        pickup_store_change_allowed: =pickup_store_change_allowed
        address_change_before_ship_allowed: =address_change_before_ship_allowed
      Large Item Freight Delivery:
        pickup_ready_hours: =pickup_ready_hours
        pickup_hold_days: =pickup_hold_days
        pickup_hold_extension_days: =pickup_hold_extension_days
        pickup_id_required: =pickup_id_required
        alternate_pickup_person_allowed: =alternate_pickup_person_allowed
        pickup_store_change_allowed: =pickup_store_change_allowed
        address_change_before_ship_allowed: =address_change_before_ship_allowed
- id: order_delivery_promises
  subject: [order_ship, order_complete, order_return_to_sender, order_fee_refund, order_fee_charge]
  rule: Delivery is promised promised_transit_business_days business days after the order date (orders after order_cutoff_time
    count from the next day). Where late_delivery_fee_refund is true and the order is completed after promised_date,
    or for Same-Day Delivery more than late_delivery_grace_minutes after promised_window_end, the fulfillment fee
    is refunded; a delay caused by the customer's absence or a changed address is never late. After carrier_attempts_before_return
    failed attempts the carrier returns the order; the lines are refunded in full, and the fulfillment fee only
    where return_to_sender_fee_refund is true. A freight order whose included attempts failed may be redelivered
    for redelivery_fee_usd; delivery_signature_required orders are never left unattended.
  eligibility: []
  params:
    per_tier:
      Standard Ship-to-Home:
        promised_transit_business_days: =promised_transit_business_days
        order_cutoff_time: =order_cutoff_time
        late_delivery_fee_refund: =late_delivery_fee_refund
        late_delivery_grace_minutes: =late_delivery_grace_minutes
        carrier_attempts_before_return: =carrier_attempts_before_return
        return_to_sender_fee_refund: =return_to_sender_fee_refund
        redelivery_fee_usd: =redelivery_fee_usd
        delivery_signature_required: =delivery_signature_required
      Expedited Ship-to-Home:
        promised_transit_business_days: =promised_transit_business_days
        order_cutoff_time: =order_cutoff_time
        late_delivery_fee_refund: =late_delivery_fee_refund
        late_delivery_grace_minutes: =late_delivery_grace_minutes
        carrier_attempts_before_return: =carrier_attempts_before_return
        return_to_sender_fee_refund: =return_to_sender_fee_refund
        redelivery_fee_usd: =redelivery_fee_usd
        delivery_signature_required: =delivery_signature_required
      Buy Online Pick Up In Store:
        promised_transit_business_days: =promised_transit_business_days
        order_cutoff_time: =order_cutoff_time
        late_delivery_fee_refund: =late_delivery_fee_refund
        late_delivery_grace_minutes: =late_delivery_grace_minutes
        carrier_attempts_before_return: =carrier_attempts_before_return
        return_to_sender_fee_refund: =return_to_sender_fee_refund
        redelivery_fee_usd: =redelivery_fee_usd
        delivery_signature_required: =delivery_signature_required
      Curbside Pickup:
        promised_transit_business_days: =promised_transit_business_days
        order_cutoff_time: =order_cutoff_time
        late_delivery_fee_refund: =late_delivery_fee_refund
        late_delivery_grace_minutes: =late_delivery_grace_minutes
