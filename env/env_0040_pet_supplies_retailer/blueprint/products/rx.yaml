        first_pharmacy_order_discount_cap_usd: =first_pharmacy_order_discount_cap_usd
        first_pharmacy_order_lookback_days: =first_pharmacy_order_lookback_days
        compounding_fee_usd: =compounding_fee_usd
  formula:
    discount_usd: round(min(merchandise_subtotal_usd * first_pharmacy_order_discount_pct / 100, first_pharmacy_order_discount_cap_usd),
      2) if rx_msr_recent_pharmacy_fills == 0 and fill_channel == 'one_time_order' and fill_number == 1 else 0
    amount_usd: round(merchandise_subtotal_usd - discount_usd + shipping_fee_usd + service_fee_usd, 2)
  measures: [rx_msr_recent_pharmacy_fills]
- id: rx_renewals
  subject: [rx_order_create, rx_exhaust, rx_expire]
  rule: A prescription that is refills_exhausted or expired can never be filled again; continuing the medication
    needs a renewal, which is a new prescription with origin renewal and renewal_of_rx_id pointing at the old one,
    sent to the veterinarian like a new order. Where auto_renewal_request is true the pharmacy places the renewal
    itself when the last fill is dispensed, or renewal_request_lead_days calendar days before expires_on when fills
    remain; where it is false the customer must ask for the renewal. A renewal never extends the old prescription's
    expiry or restores its fills, and an Autoship subscription linked to the old prescription is relinked to the
    renewal once it is active.
  eligibility: []
  params:
    per_tier:
      Rx Preventive:
        auto_renewal_request: =auto_renewal_request
        renewal_request_lead_days: =renewal_request_lead_days
        autoship_eligible: =autoship_eligible
      Rx Maintenance Medication:
        auto_renewal_request: =auto_renewal_request
        renewal_request_lead_days: =renewal_request_lead_days
        autoship_eligible: =autoship_eligible
      Rx Prescription Diet:
        auto_renewal_request: =auto_renewal_request
        renewal_request_lead_days: =renewal_request_lead_days
        autoship_eligible: =autoship_eligible
      Rx Short-Course Medication:
        auto_renewal_request: =auto_renewal_request
        renewal_request_lead_days: =renewal_request_lead_days
        autoship_eligible: =autoship_eligible
      Rx Controlled Substance:
        auto_renewal_request: =auto_renewal_request
        renewal_request_lead_days: =renewal_request_lead_days
        autoship_eligible: =autoship_eligible
      Rx Compounded Medication:
        auto_renewal_request: =auto_renewal_request
        renewal_request_lead_days: =renewal_request_lead_days
        autoship_eligible: =autoship_eligible
- id: rx_transfers
  subject: [rx_order_create, rx_transfer_out]
  rule: A prescription may be transferred in from another pharmacy where transfer_in_allowed is true, and out where
    transfer_out_allowed is true, never more than max_transfers_per_prescription times in total over its life. With
    transfer_requires_fills_remaining a prescription with no fill left cannot be transferred; it needs a renewal
    from the veterinarian. A transfer-in arrives as a new prescription with origin transfer_in, pending until the
    transferring pharmacy confirms the remaining fills and the original expiry, which it keeps. The prescription
    status is active when the transfer out is recorded. A transfer out closes the prescription here; any Autoship
    subscription linked to it stops at its next shipment.
  eligibility: []
  params:
    per_tier:
      Rx Preventive:
        transfer_in_allowed: =transfer_in_allowed
        transfer_out_allowed: =transfer_out_allowed
        max_transfers_per_prescription: =max_transfers_per_prescription
        transfer_requires_fills_remaining: =transfer_requires_fills_remaining
      Rx Maintenance Medication:
        transfer_in_allowed: =transfer_in_allowed
        transfer_out_allowed: =transfer_out_allowed
        max_transfers_per_prescription: =max_transfers_per_prescription
        transfer_requires_fills_remaining: =transfer_requires_fills_remaining
      Rx Prescription Diet:
        transfer_in_allowed: =transfer_in_allowed
        transfer_out_allowed: =transfer_out_allowed
        max_transfers_per_prescription: =max_transfers_per_prescription
        transfer_requires_fills_remaining: =transfer_requires_fills_remaining
      Rx Short-Course Medication:
        transfer_in_allowed: =transfer_in_allowed
        transfer_out_allowed: =transfer_out_allowed
        max_transfers_per_prescription: =max_transfers_per_prescription
        transfer_requires_fills_remaining: =transfer_requires_fills_remaining
      Rx Controlled Substance:
        transfer_in_allowed: =transfer_in_allowed
        transfer_out_allowed: =transfer_out_allowed
        max_transfers_per_prescription: =max_transfers_per_prescription
        transfer_requires_fills_remaining: =transfer_requires_fills_remaining
      Rx Compounded Medication:
        transfer_in_allowed: =transfer_in_allowed
        transfer_out_allowed: =transfer_out_allowed
        max_transfers_per_prescription: =max_transfers_per_prescription
        transfer_requires_fills_remaining: =transfer_requires_fills_remaining
- id: rx_cancellation
  subject: [rx_cancel]
  rule: The prescription status is pending_vet_authorization or active when the cancellation is recorded. A pending
    order may be withdrawn by the customer at any time with cancel_before_dispense_fee_usd. An active prescription
    is inactivated at the customer's request or on the prescriber's written or telephoned discontinuation, which
    takes effect on the day it is received where discontinuation_by_prescriber_immediate is true. A fill already
    dispensed is not reversed by cancellation; a compounded fill cancelled after compounding started carries cancel_after_compounding_fee_usd.
    Cancelling never refunds earlier fills.
  eligibility: []
  params:
    per_tier:
      Rx Preventive:
        cancel_before_dispense_fee_usd: =cancel_before_dispense_fee_usd
        cancel_after_compounding_fee_usd: =cancel_after_compounding_fee_usd
        discontinuation_by_prescriber_immediate: =discontinuation_by_prescriber_immediate
      Rx Maintenance Medication:
        cancel_before_dispense_fee_usd: =cancel_before_dispense_fee_usd
        cancel_after_compounding_fee_usd: =cancel_after_compounding_fee_usd
        discontinuation_by_prescriber_immediate: =discontinuation_by_prescriber_immediate
      Rx Prescription Diet:
        cancel_before_dispense_fee_usd: =cancel_before_dispense_fee_usd
        cancel_after_compounding_fee_usd: =cancel_after_compounding_fee_usd
        discontinuation_by_prescriber_immediate: =discontinuation_by_prescriber_immediate
      Rx Short-Course Medication:
        cancel_before_dispense_fee_usd: =cancel_before_dispense_fee_usd
        cancel_after_compounding_fee_usd: =cancel_after_compounding_fee_usd
        discontinuation_by_prescriber_immediate: =discontinuation_by_prescriber_immediate
      Rx Controlled Substance:
        cancel_before_dispense_fee_usd: =cancel_before_dispense_fee_usd
        cancel_after_compounding_fee_usd: =cancel_after_compounding_fee_usd
        discontinuation_by_prescriber_immediate: =discontinuation_by_prescriber_immediate
      Rx Compounded Medication:
        cancel_before_dispense_fee_usd: =cancel_before_dispense_fee_usd
        cancel_after_compounding_fee_usd: =cancel_after_compounding_fee_usd
        discontinuation_by_prescriber_immediate: =discontinuation_by_prescriber_immediate
- id: rx_dispensing_errors
  subject: [rx_error_remake, rx_error_refund, rx_fill_restore]
  rule: A dispensing error is a wrong medication, wrong strength, wrong quantity or wrong label on a fill, confirmed
    against the fill record. A dispensing error is accepted only if it is reported no later than dispensing_error_report_days
    after the erroneous fill's dispense date. The window is counted in calendar days from the event_date of the
    erroneous rx_fill row, that date being day 0; a report on the last day is in time. No rx_error_remake or rx_error_refund
    row already refers to the same original_event_id. The customer chooses a free remake shipped at no charge where
    error_remake_allowed is true, otherwise a refund. A remake does not use a fill. A refund returns the fill's
    merchandise amount after discount and, with error_refund_includes_shipping, its shipping and service fees, to
    the original payment, and the refunded fill is credited back to fills_remaining. The erroneous product is never
    resold and need not be returned. A dissatisfaction that is not a dispensing error is not covered by this rule.
  eligibility:
  - id: error_window
    applies_to: [rx_error_remake, rx_error_refund]
    kind: time
    condition: A dispensing error is accepted only if it is reported no later than dispensing_error_report_days
      after the erroneous fill's dispense date.
    evidence_fields: [rx_events.event_date, rx_events.rx_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rx_events.rx_event_id]
      action_bindings:
        rx_events.rx_event_id: original_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the erroneous fill's dispense date
      anchor_source: rx_events.event_date
      relation: not_after
      duration_source: variants.dispensing_error_report_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days from the event_date of the erroneous rx_fill row, that
        date being day 0; a report on the last day is in time.
      boundary: inclusive
  - id: one_remedy_per_error
    applies_to: [rx_error_remake, rx_error_refund]
    kind: dedup
    condition: No rx_error_remake or rx_error_refund row already refers to the same original_event_id.
    evidence_fields: [rx_events.original_event_id, rx_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rx_events.original_event_id]
      action_bindings:
        rx_events.original_event_id: original_event_id
    dedup_contract:
      table: rx_events
      mode: separate_record
      object_bindings:
        original_event_id: original_event_id
      duplicate_filters:
        event_type: [rx_error_remake, rx_error_refund]
      distinct_fields: []
  params:
    per_tier:
      Rx Preventive:
        dispensing_error_report_days: =dispensing_error_report_days
        error_remake_allowed: =error_remake_allowed
        error_refund_includes_shipping: =error_refund_includes_shipping
      Rx Maintenance Medication:
        dispensing_error_report_days: =dispensing_error_report_days
        error_remake_allowed: =error_remake_allowed
        error_refund_includes_shipping: =error_refund_includes_shipping
      Rx Prescription Diet:
        dispensing_error_report_days: =dispensing_error_report_days
        error_remake_allowed: =error_remake_allowed
        error_refund_includes_shipping: =error_refund_includes_shipping
      Rx Short-Course Medication:
        dispensing_error_report_days: =dispensing_error_report_days
        error_remake_allowed: =error_remake_allowed
        error_refund_includes_shipping: =error_refund_includes_shipping
      Rx Controlled Substance:
        dispensing_error_report_days: =dispensing_error_report_days
        error_remake_allowed: =error_remake_allowed
        error_refund_includes_shipping: =error_refund_includes_shipping
      Rx Compounded Medication:
        dispensing_error_report_days: =dispensing_error_report_days
        error_remake_allowed: =error_remake_allowed
        error_refund_includes_shipping: =error_refund_includes_shipping
- id: rx_evt_returns
  subject: [rx_diet_return_refund]
  rule: Dispensed medications are never accepted back for resale or refund, opened or not; only unopened prescription
    diet product may be returned, where unopened_return_window_days is above 0. An unopened prescription diet return
    is accepted only if it is requested no later than unopened_return_window_days after the returned fill's dispense
    date. The return window is counted in calendar days from the event_date of the returned rx_fill row, that date
    being day 0; a request on the last day is in time. The refund is the returned packages' share of the fill's
    merchandise amount after discount, less return_restocking_fee_pct, to the original payment; shipping is not
    refunded, and the fill is not credited back.
  eligibility:
  - id: diet_return_window
    applies_to: [rx_diet_return_refund]
    kind: time
    condition: An unopened prescription diet return is accepted only if it is requested no later than unopened_return_window_days
      after the returned fill's dispense date.
    evidence_fields: [rx_events.event_date, rx_events.rx_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rx_events.rx_event_id]
      action_bindings:
        rx_events.rx_event_id: original_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the returned fill's dispense date
      anchor_source: rx_events.event_date
      relation: not_after
      duration_source: variants.unopened_return_window_days
      unit: calendar_days
      counting_rule: The return window is counted in calendar days from the event_date of the returned rx_fill row,
        that date being day 0; a request on the last day is in time.
      boundary: inclusive
  params:
    per_tier:
      Rx Preventive:
        unopened_return_window_days: =unopened_return_window_days
        return_restocking_fee_pct: =return_restocking_fee_pct
      Rx Maintenance Medication:
        unopened_return_window_days: =unopened_return_window_days
        return_restocking_fee_pct: =return_restocking_fee_pct
      Rx Prescription Diet:
        unopened_return_window_days: =unopened_return_window_days
        return_restocking_fee_pct: =return_restocking_fee_pct
      Rx Short-Course Medication:
        unopened_return_window_days: =unopened_return_window_days
        return_restocking_fee_pct: =return_restocking_fee_pct
      Rx Controlled Substance:
        unopened_return_window_days: =unopened_return_window_days
        return_restocking_fee_pct: =return_restocking_fee_pct
      Rx Compounded Medication:
        unopened_return_window_days: =unopened_return_window_days
        return_restocking_fee_pct: =return_restocking_fee_pct
- id: rx_pack_size_changes
  subject: [rx_pack_change]
  rule: The prescription status is active when the package size change is requested. Where pack_size_change_allowed
    is true the customer may switch to another package of the same product and strength, provided the new days'
    supply per fill stays within max_days_supply_per_fill; fills_remaining and expires_on are unchanged. Any change
    of medication, strength or directions needs a new authorization.
  eligibility:
  - id: pack_change_active
    applies_to: [rx_pack_change]
    kind: state
    condition: The prescription status is active when the package size change is requested.
    evidence_fields: [rx_prescriptions.status, rx_prescriptions.rx_prescription_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rx_prescriptions.rx_prescription_id]
      action_bindings:
        rx_prescriptions.rx_prescription_id: rx_prescription_id
    state_contract:
      field: rx_prescriptions.status
      allowed: [active]
  params:
    per_tier:
      Rx Preventive:
        pack_size_change_allowed: =pack_size_change_allowed
        max_days_supply_per_fill: =max_days_supply_per_fill
      Rx Maintenance Medication:
        pack_size_change_allowed: =pack_size_change_allowed
        max_days_supply_per_fill: =max_days_supply_per_fill
      Rx Prescription Diet:
        pack_size_change_allowed: =pack_size_change_allowed
        max_days_supply_per_fill: =max_days_supply_per_fill
      Rx Short-Course Medication:
        pack_size_change_allowed: =pack_size_change_allowed
        max_days_supply_per_fill: =max_days_supply_per_fill
      Rx Controlled Substance:
        pack_size_change_allowed: =pack_size_change_allowed
        max_days_supply_per_fill: =max_days_supply_per_fill
      Rx Compounded Medication:
        pack_size_change_allowed: =pack_size_change_allowed
        max_days_supply_per_fill: =max_days_supply_per_fill
