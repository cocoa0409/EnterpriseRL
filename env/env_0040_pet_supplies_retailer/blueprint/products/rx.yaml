events:
- type: rx_order_create
  target: rx_prescriptions
  mutation: create
  meaning: a new prescription order, renewal or transfer-in request is placed for a pet
  grain: one row per prescription
  fields:
    rx_prescription_id: new id
    customer_id: owner
    pet_id: patient
    vet_id: prescriber
    variant_name: class
    medication: medication
    strength: strength
    sku: package item number
    unit_price_usd: catalog price
    quantity_per_fill: packages per fill
    days_supply_per_fill: days' supply per fill
    origin: new_from_vet, renewal or transfer_in
    renewal_of_rx_id: renewed prescription
    transfer_count: 1 for a transfer-in, else 0
    ordered_on: order date
  triggers: []
- type: rx_authorize
  target: rx_prescriptions
  mutation:
    transition:
      from: pending_vet_authorization
      to: active
  meaning: the veterinarian approves the prescription (or the transferring pharmacy confirms the transfer)
  grain: one transition per prescription
  fields:
    authorized_on: approval date
    expires_on: expiry
    fills_authorized: fills approved
    fills_remaining: set to fills approved
  account: fills_remaining
  direction: in
  triggers: []
- type: rx_deny
  target: rx_prescriptions
  mutation:
    transition:
      from: pending_vet_authorization
      to: denied
  meaning: the veterinarian denies the request or never answers
  grain: one transition per prescription
  fields:
    denial_reason: reason
    closed_on: date
  triggers: []
- type: rx_fill
  target: rx_events
  meaning: one fill of the prescription is dispensed and shipped, through Autoship or a one-time order
  grain: one row per dispensed fill
  distinguish_by: [fill_number]
  fields:
    rx_prescription_id: prescription filled
    event_date: dispense date
    fill_number: ordinal of the fill
    fill_channel: autoship or one_time_order
    quantity_dispensed: packages
    days_supply: days' supply
    merchandise_subtotal_usd: packages x price
    discount_usd: first-pharmacy-order discount
    shipping_fee_usd: shipping
    service_fee_usd: compounding and signature fees
    amount_usd: total billed
    fills_remaining_after: fills left
    override_reason: early-refill override used
  account: fills_remaining
  direction: out
  triggers:
  - event: rx:rx_exhaust
    when: {fills_remaining_after: 0}
  - event: member:member_points_earn
    map:
      event_date: event_date
      source_category: rx
      source_event_id: rx_event_id
      qualifying_spend_usd: merchandise_subtotal_usd
- type: rx_exhaust
  target: rx_prescriptions
  mutation:
    transition:
      from: active
      to: refills_exhausted
  meaning: the last authorized fill has been dispensed
  grain: one transition per prescription
  fields:
    closed_on: date of the last fill
  triggers: []
- type: rx_expire
  target: rx_prescriptions
  mutation:
    transition:
    - from: active
      to: expired
    - from: refills_exhausted
      to: expired
  meaning: the prescription reaches its expiry date
  grain: one transition per prescription
  fields:
    closed_on: expires_on
  triggers: []
- type: rx_cancel
  target: rx_prescriptions
  mutation:
    transition:
    - from: pending_vet_authorization
      to: cancelled
    - from: active
      to: cancelled
  meaning: the order is withdrawn, the customer inactivates the prescription, or the prescriber discontinues it
  grain: one transition per prescription
  fields:
    closed_on: date
  triggers: []
- type: rx_transfer_out
  target: rx_prescriptions
  mutation:
    transition:
      from: active
      to: transferred_out
  meaning: the remaining fills are transferred to another pharmacy
  grain: one transition per prescription
  fields:
    closed_on: transfer date
    transfer_count: incremented by 1
  triggers: []
- type: rx_pack_change
  target: rx_prescriptions
  mutation: update
  meaning: the customer switches to another package size of the same product and strength
  grain: one row per change
  fields:
    sku: new package item number
    unit_price_usd: its price
    quantity_per_fill: packages per fill
    days_supply_per_fill: days' supply per fill
  triggers: []
- type: rx_error_remake
  target: rx_events
  meaning: a fill with a dispensing error is remade and shipped free
  grain: one row per remade fill
  distinguish_by: [original_event_id]
  fields:
    original_event_id: erroneous fill
    event_date: remake date
    error_type: error
    quantity_dispensed: packages
    days_supply: days' supply
    fill_channel: error_remake
  triggers: []
- type: rx_error_refund
  target: rx_events
  meaning: a fill with a dispensing error is refunded instead of remade
  grain: one row per refunded fill
  distinguish_by: [original_event_id]
  fields:
    original_event_id: erroneous fill
    event_date: refund date
    error_type: error
    merchandise_subtotal_usd: refunded merchandise
    shipping_fee_usd: refunded shipping
    service_fee_usd: refunded fees
    amount_usd: total refunded
    refund_method: original_payment
  triggers:
  - event: rx:rx_fill_restore
    map:
      original_event_id: original_event_id
      event_date: event_date
- type: rx_fill_restore
  target: rx_events
  meaning: a refunded erroneous fill is credited back to the prescription's fills
  grain: one row per restored fill
  distinguish_by: [original_event_id]
  fields:
    original_event_id: fill credited back
    event_date: credit date
    fills_remaining_after: fills left after the credit
  account: fills_remaining
  direction: in
  triggers: []
- type: rx_diet_return_refund
  target: rx_events
  meaning: unopened prescription diet product is returned and refunded
  grain: one row per returned fill
  distinguish_by: [original_event_id]
  fields:
    original_event_id: fill returned
    event_date: refund date
    quantity_dispensed: packages returned
    merchandise_subtotal_usd: refunded merchandise
    amount_usd: total refunded
    refund_method: original_payment
  triggers:
  - event: member:member_points_reverse
    map:
      event_date: event_date
      source_category: rx
      source_event_id: original_event_id
measures:
- id: rx_msr_overrides_365d
  window: rolling 365 calendar days ending on the fill date
  measure: count of rx_fill rows of this prescription with override_reason other than none
- id: rx_msr_recent_pharmacy_fills
  window: first_pharmacy_order_lookback_days calendar days ending the day before the fill
  measure: count of rx_fill rows on any prescription of the customer
- id: rx_msr_days_supply_dispensed
  window: life of the prescription
  measure: sum of days_supply of rx_fill rows of this prescription minus that of fills restored by rx_fill_restore
- id: rx_msr_same_day_subtotal
  window: a single dispense date
  measure: sum of merchandise_subtotal_usd of the customer's rx_fill rows with fill_channel one_time_order on that
    event_date, across prescriptions
policies:
- id: rx_agg_multi_holding
  subject: [rx_order_create]
  rule: A customer may hold any number of prescriptions across their pets. No other prescription of the same customer
    for the same pet, medication and strength is in status pending_vet_authorization or active. A second order for
    the same pet, medication and strength is handled on the existing prescription (a fill, a pack size change or,
    once it can no longer be filled, a renewal) and is not opened as a new prescription. A different strength of
    the same medication is a different prescription.
  eligibility:
  - id: one_live_rx_per_medication
    applies_to: [rx_order_create]
    kind: dedup
    condition: No other prescription of the same customer for the same pet, medication and strength is in status
      pending_vet_authorization or active.
    evidence_fields: [rx_prescriptions.customer_id, rx_prescriptions.pet_id, rx_prescriptions.medication, rx_prescriptions.strength,
      rx_prescriptions.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rx_prescriptions.pet_id, rx_prescriptions.medication, rx_prescriptions.strength]
      action_bindings:
        rx_prescriptions.pet_id: pet_id
        rx_prescriptions.medication: medication
        rx_prescriptions.strength: strength
    dedup_contract:
      table: rx_prescriptions
      mode: separate_record
      object_bindings:
        pet_id: pet_id
        medication: medication
        strength: strength
      duplicate_filters:
        status: [pending_vet_authorization, active]
      distinct_fields: []
  params:
    max_per_customer: null
- id: rx_agg_shipping
  subject: [rx_fill]
  rule: 'Shipping on one-time pharmacy orders is assessed per customer and dispense date: when rx_msr_same_day_subtotal
    is at least the rx_free_shipping_threshold_usd of every class shipped that day, no standard shipping fee is
    charged; otherwise one rx_shipping_fee_usd (the highest among the classes shipped) is charged on the fill with
    the largest subtotal and 0.00 on the others. A customer whose Tailwise Plus membership is in status active pays
    no standard shipping fee on pharmacy orders. Autoship fills follow the Autoship shipping rules and are never
    assessed here. The adult_signature_fee_usd of a class with signature_required is charged once per shipment containing
    such a fill and is never waived by the threshold or by membership.'
  eligibility: []
  params:
    per_tier:
      Rx Preventive:
        rx_shipping_fee_usd: =rx_shipping_fee_usd
        rx_free_shipping_threshold_usd: =rx_free_shipping_threshold_usd
        signature_required: =signature_required
        adult_signature_fee_usd: =adult_signature_fee_usd
      Rx Maintenance Medication:
        rx_shipping_fee_usd: =rx_shipping_fee_usd
        rx_free_shipping_threshold_usd: =rx_free_shipping_threshold_usd
        signature_required: =signature_required
        adult_signature_fee_usd: =adult_signature_fee_usd
      Rx Prescription Diet:
        rx_shipping_fee_usd: =rx_shipping_fee_usd
        rx_free_shipping_threshold_usd: =rx_free_shipping_threshold_usd
        signature_required: =signature_required
        adult_signature_fee_usd: =adult_signature_fee_usd
      Rx Short-Course Medication:
        rx_shipping_fee_usd: =rx_shipping_fee_usd
        rx_free_shipping_threshold_usd: =rx_free_shipping_threshold_usd
        signature_required: =signature_required
        adult_signature_fee_usd: =adult_signature_fee_usd
      Rx Controlled Substance:
