category: rx
display_name: Tailwise Pharmacy
binding:
  holding_table: rx_prescriptions
  event_tables: [rx_events]
  intake_tables: [rx_authorization_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    fills_remaining: fills_remaining
lifecycle:
  states: [pending_vet_authorization, active, refills_exhausted, expired, denied, cancelled, transferred_out]
  transitions:
  - from: pending_vet_authorization
    to: active
    by: system
    means: the veterinarian's or transferring pharmacy's approval is recorded
  - from: pending_vet_authorization
    to: denied
    by: system
    means: the veterinarian denies, or no response arrives after the last attempt
  - from: pending_vet_authorization
    to: cancelled
    by: user
    means: the customer withdraws the order before authorization
  - from: active
    to: refills_exhausted
    by: system
    means: the last authorized fill is dispensed
  - from: active
    to: expired
    by: system
    means: expires_on is reached with fills remaining
  - from: refills_exhausted
    to: expired
    by: system
    means: expires_on is reached after the fills ran out
  - from: active
    to: cancelled
    by: user
    means: the customer asks the pharmacy to inactivate the prescription
  - from: active
    to: cancelled
    by: agent
    means: the prescriber's discontinuation is recorded
  - from: active
    to: transferred_out
    by: agent
    means: the remaining fills are transferred to another pharmacy at the customer's request
accounts:
- key: fills_remaining
  unit: fills
  meaning: 'fills of the prescription still available: authorization books in, each dispensed fill books out, a
    refunded erroneous fill books back in'
parameter_schema:
  rx_validity_months: months from the authorization date after which the prescription can no longer be filled, unless
    the veterinarian wrote an earlier expiry; integer, calendar months
  max_refills_authorizable: largest number of refills (fills after the first) the pharmacy will record on one authorization;
    integer, count
  max_days_supply_per_fill: largest days' supply one fill may contain; integer, days
  refill_too_soon_pct: share of the previous fill's days' supply that must have elapsed before the next fill may
    be dispensed; integer, percent
  early_refill_override_allowed: whether a pharmacist may dispense before the refill-too-soon date for travel or
    lost or damaged medication; boolean
  early_refill_overrides_per_365_days: early-refill overrides allowed per prescription in any rolling 365 days;
    integer, count
  travel_override_max_days_supply: largest days' supply a travel override fill may contain; integer, days
  lost_replacement_allowed: whether lost or damaged medication may be replaced early as an override; boolean
  partial_fill_allowed: whether a fill may dispense less than the prescribed quantity per fill when the customer
    asks; boolean
  partial_fill_consumes_fill: whether a partial fill counts as a whole fill against fills_remaining; boolean
  dea_prescriber_required: whether the prescriber must hold a DEA registration; boolean
  auth_request_channels: channels the pharmacy may use to request veterinary authorization; list of e_authorization
    | fax | phone
  vet_contact_within_business_days: business days after the order within which the pharmacy sends the first authorization
    request; integer, business days
  vet_response_wait_business_days: business days the pharmacy waits for the veterinarian after each authorization
    attempt; integer, business days
  vet_followup_attempts: authorization attempts in total before an unanswered request closes as no_response; integer,
    count
  weight_check_required: whether the pet's recorded weight must fall in the product's labeled weight band before
    authorization is requested; boolean
  weight_record_max_age_months: a weight used for the weight-band check must have been recorded within this many
    months of the order date; integer, calendar months
  state_shipping_restrictions: shipping states to which this class is not dispensed; list of 2-letter state codes
  auto_renewal_request: whether the pharmacy requests a renewal from the veterinarian by itself when the prescription
    runs out or nears expiry; boolean
  renewal_request_lead_days: calendar days before expires_on at which an automatic renewal request is sent when
    fills remain; integer, days
  autoship_eligible: whether the class may be placed on Autoship Pharmacy or Autoship Compounded Pharmacy; boolean
  compounding_lead_business_days: business days the compounding partner needs after authorization before the first
    fill can ship; integer, business days
  beyond_use_days: days a compounded preparation stays usable after it is made; caps the days' supply of one fill;
    0 means not applicable; integer, days
  first_pharmacy_order_discount_pct: percent off the merchandise subtotal of the first fill for a customer with
    no pharmacy fill in the lookback; number, percent
  first_pharmacy_order_discount_cap_usd: maximum first-pharmacy-order discount; USD
  first_pharmacy_order_lookback_days: calendar days without any pharmacy fill that make a customer new to the pharmacy;
    integer, days
  compounding_fee_usd: fee per compounded fill; USD
  signature_required: whether the carrier must collect an adult signature on delivery; boolean
  adult_signature_fee_usd: fee per shipment requiring an adult signature; USD
  rx_shipping_fee_usd: standard shipping fee per one-time pharmacy shipment below the threshold; USD
  rx_free_shipping_threshold_usd: same-day combined pharmacy merchandise subtotal at or above which the standard
    shipping fee is waived; USD
  one_time_ship_days: transit days promised for a one-time pharmacy order after dispensing; integer, days
  transfer_in_allowed: whether a prescription of this class may be transferred in from another pharmacy; boolean
  transfer_out_allowed: whether a prescription of this class may be transferred out to another pharmacy; boolean
  max_transfers_per_prescription: transfers allowed over the life of one prescription, counting both in and out;
    integer, count
  transfer_requires_fills_remaining: whether a transfer needs at least one fill remaining; boolean
  dispensing_error_report_days: calendar days after the fill within which a dispensing error is accepted; integer,
    days
  error_remake_allowed: whether a dispensing error may be remedied by a free remake instead of a refund; boolean
  error_refund_includes_shipping: whether a dispensing-error refund also refunds the shipping and fees of that fill;
    boolean
  unopened_return_window_days: calendar days after the fill within which unopened product may be returned; 0 means
    never returnable; integer, days
  return_restocking_fee_pct: restocking fee withheld from an unopened-product return refund; number, percent
  points_eligible: whether pharmacy fills earn Pals Rewards points; boolean
  pack_size_change_allowed: whether the customer may switch to another package size of the same product and strength
    without a new authorization; boolean
  cancel_before_dispense_fee_usd: fee for cancelling a pending or undispensed order; USD
  cancel_after_compounding_fee_usd: fee for cancelling a compounded fill after compounding has started; USD
  denial_resubmission_requires_new_vet_contact: whether a denied prescription can only be resubmitted as a new order
    naming the veterinarian again; boolean
  discontinuation_by_prescriber_immediate: whether a prescriber's discontinuation takes effect the day it is received;
    boolean
  controlled_quantity_limit_days: largest total days' supply that may be dispensed across all fills of one prescription;
    0 means no limit beyond fills and validity; integer, days
