category: train
display_name: Tailwise Training
binding:
  holding_table: train_enrollments
  event_tables: [train_sessions]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    sessions_remaining: sessions
lifecycle:
  states: [enrolled, in_progress, completed, withdrawn, expired]
  transitions:
  - from: enrolled
    to: in_progress
    by: system
    means: the first session is attended or forfeited
  - from: in_progress
    to: completed
    by: system
    means: the last session is attended or forfeited
  - from: enrolled
    to: withdrawn
    by: user
    means: the customer withdraws before the first session
  - from: in_progress
    to: withdrawn
    by: user
    means: the customer withdraws after the course started
  - from: in_progress
    to: expired
    by: system
    means: validity_days pass with sessions unused
  - from: enrolled
    to: expired
    by: system
    means: validity_days pass before any session
accounts:
- key: sessions
  unit: sessions
  meaning: 'training sessions available: enrollment books in; attended, forfeited, refunded and expired sessions
    book out'
parameter_schema:
  price_usd: course or pack price; USD
  sessions_included: sessions credited at enrollment; integer, sessions
  session_minutes: length of one session; integer, minutes
  format: how sessions are delivered; enum group | private
  class_size_max: most dogs in one group class; 1 for private; integer, dogs
  min_age_weeks: youngest age at the first session; integer, weeks
  max_age_weeks: oldest age at the first session; 0 means no limit; integer, weeks
  prerequisite_course: course that must be completed (or waived by a trainer evaluation) before enrollment; enum
    course name or none
  rabies_required: whether a current rabies certificate is needed for dogs 16 weeks or older at the first session;
    boolean
  core_vaccine_required: whether a current DHPP (or the age-appropriate puppy series) is needed; boolean
  bordetella_required: whether a current bordetella vaccination is needed; boolean
  temperament_flags_accepted: pet behaviour flags accepted in this format; list
  validity_days: calendar days from enrollment within which sessions must be used; integer, days
  makeup_sessions_max: missed group sessions that may be made up in another class; integer, sessions
  excused_absence_notice_hours: notice before a session at or above which an absence is excused and credited for
    makeup or rescheduling; integer, hours
  makeup_window_days: calendar days after the last scheduled session within which makeups must be attended; integer,
    days
  unexcused_absence_forfeits: whether an absence without enough notice uses the session; boolean
  private_reschedules_max: private sessions that may be rescheduled with enough notice; integer, count
  in_home_available: whether private sessions may be held at the customer's home; boolean
  in_home_travel_fee_usd: travel fee per in-home session; USD
  class_transfer_allowed: whether the enrollment may move to another class start date or store before the second
    session; boolean
  class_transfers_max: transfers allowed per enrollment; integer, count
  class_transfer_fee_usd: fee per transfer; USD
  full_refund_before_start: whether withdrawal before the first session is refunded in full; boolean
  partial_refund_until_session: last session number before which a withdrawal earns a prorated refund; 0 means none
    after start; integer, session ordinal
  unused_session_refund_rate_usd: refund per unused session after start for private packs; USD
  refund_admin_fee_usd: fee withheld from a refund after the first session; USD
  guarantee_repeat_allowed: whether a dog that attended every session may repeat the same course free; boolean
  guarantee_attendance_required_pct: share of scheduled sessions attended for the guarantee; integer, percent
  guarantee_window_days: calendar days after completion within which the free repeat must start; integer, days
  guarantee_uses_max: free repeats per original enrollment; integer, count
  cgc_test_included: whether the AKC Canine Good Citizen evaluation is included; boolean
  cgc_test_fee_usd: fee for a CGC evaluation when not included; USD
  multi_dog_discount_pct: discount on a second enrollment of the same customer starting within 30 days of another;
    number, percent
  plus_discount_pct: discount for an active Tailwise Plus tier; number, percent
  discounts_combinable: whether the multi-dog and Plus discounts are added together; boolean
  perk_credit_accepted: whether Tailwise Plus Premier perk credit may pay toward the price; boolean
  points_multiplier: multiplier on the Pals Rewards base earn rate; integer
  trainer_cancel_credit: whether a session cancelled by Tailwise is credited and rescheduled; boolean
  graduation_certificate: whether a completion certificate is issued; boolean
  handlers_per_dog_max: family members who may attend with the dog; integer, people
  store_change_after_start_allowed: whether sessions may move to another store after the course started; boolean
  intact_dog_age_limit_months: age above which an unspayed or unneutered dog is not admitted to group classes; 0
    means no limit; integer, months
  female_in_heat_excused: whether a female in heat is excused with makeup credit regardless of notice; boolean
  enrollment_cutoff_days: calendar days before the first session after which enrollment closes; integer, days
  late_arrival_minutes: minutes late after which the dog may watch but the session counts as attended; integer,
    minutes
  homework_materials_included: whether the course workbook and clicker are included; boolean
  session_spacing_days: minimum calendar days between two sessions of the same enrollment; integer, days
