events:
- type: train_enroll
  target: train_enrollments
  mutation: create
  meaning: a dog is enrolled in a course or private pack, bought or as a guarantee repeat
  grain: one row per enrollment
  fields:
    train_enrollment_id: new id
    customer_id: owner
    pet_id: dog
    variant_name: course
    store_id: store
    enrollment_kind: paid or guarantee_repeat
    repeat_of_enrollment_id: original enrollment for a repeat
    class_start_date: first session
    price_paid_usd: price paid
    enrolled_on: date
    expires_on: validity end
    sessions_remaining: sessions credited
    transfers_used: '0'
  account: sessions
  direction: in
  triggers:
  - event: member:member_points_earn
    map:
      event_date: enrolled_on
      source_category: train
      source_event_id: train_enrollment_id
      qualifying_spend_usd: price_paid_usd
- type: train_session_attend
  target: train_sessions
  meaning: the dog attends a session
  grain: one row per session attended
  distinguish_by: [event_date, session_number]
  fields:
    event_date: date
    session_number: session
    session_time: time
    sessions_delta: '1'
  account: sessions
  direction: out
  triggers: []
- type: train_absence
  target: train_sessions
  meaning: the dog misses a session; unexcused absences use the session
  grain: one row per missed session
  distinguish_by: [event_date, session_number]
  fields:
    event_date: session date
    session_number: session
    absence_kind: excused, unexcused or trainer_cancelled
    notice_hours: notice
    sessions_delta: 1 when forfeited, else 0
  triggers:
  - event: train:train_session_forfeit
    when:
      absence_kind: unexcused
    map:
      event_date: event_date
      session_number: session_number
- type: train_session_forfeit
  target: train_sessions
  meaning: an unexcused absence uses the session
  grain: one row per forfeited session
  distinguish_by: [event_date, session_number]
  fields:
    event_date: session date
    session_number: session
    sessions_delta: '1'
  account: sessions
  direction: out
  triggers: []
- type: train_makeup_attend
  target: train_sessions
  meaning: an excused group session is made up in another class
  grain: one row per makeup
  distinguish_by: [original_event_id]
  fields:
    event_date: makeup date
    original_event_id: missed session
    session_time: time
  triggers: []
- type: train_start
  target: train_enrollments
  mutation:
    transition:
      from: enrolled
      to: in_progress
  meaning: the course starts
  grain: one transition per enrollment
  fields:
    sessions_remaining: after the first session
  triggers: []
- type: train_complete
  target: train_enrollments
  mutation:
    transition:
      from: in_progress
      to: completed
  meaning: the course or pack is finished
  grain: one transition per enrollment
  fields:
    closed_on: date
  triggers: []
- type: train_transfer
  target: train_enrollments
  mutation: update
  meaning: the enrollment moves to another class start date or store
  grain: one row per transfer
  fields:
    class_start_date: new start
    store_id: new store
    transfers_used: incremented
  triggers: []
- type: train_withdraw
  target: train_enrollments
  mutation:
    transition:
    - from: enrolled
      to: withdrawn
    - from: in_progress
      to: withdrawn
  meaning: the customer withdraws
  grain: one transition per enrollment
  fields:
    closed_on: date
  triggers:
  - event: train:train_refund
- type: train_refund
  target: train_sessions
  meaning: a withdrawal refund is paid
  grain: one row per withdrawn enrollment
  distinguish_by: [event_date]
  fields:
    event_date: date
    amount_usd: refund
    sessions_delta: unused sessions removed
  account: sessions
  direction: out
  triggers: []
- type: train_expire
  target: train_enrollments
  mutation:
    transition:
    - from: in_progress
      to: expired
    - from: enrolled
      to: expired
  meaning: the validity passes with sessions unused
  grain: one transition per enrollment
  fields:
    closed_on: date
    sessions_remaining: set to 0
  account: sessions
  direction: out
  triggers: []
measures:
- id: train_msr_attendance
  window: the enrollment
  measure: count of train_session_attend rows plus train_makeup_attend rows of the enrollment
- id: train_msr_makeups_used
  window: the enrollment
  measure: count of train_makeup_attend rows of the enrollment
- id: train_msr_guarantee_repeats
  window: life of the original enrollment
  measure: count of train_enrollments with enrollment_kind guarantee_repeat whose repeat_of_enrollment_id is the
    enrollment
policies:
- id: train_agg_multi_holding
  subject: [train_enroll]
  rule: A customer may enroll any number of dogs, and one dog may hold several enrollments in different courses.
    The dog has no other enrollment in the same course in status enrolled or in_progress. Sessions never pool across
    enrollments or dogs.
  eligibility:
  - id: one_live_enrollment_per_course
    applies_to: [train_enroll]
    kind: dedup
    condition: The dog has no other enrollment in the same course in status enrolled or in_progress.
    evidence_fields: [train_enrollments.pet_id, train_enrollments.variant_name, train_enrollments.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [train_enrollments.pet_id]
      action_bindings:
        train_enrollments.pet_id: pet_id
    dedup_contract:
      table: train_enrollments
      mode: separate_record
      object_bindings:
        pet_id: pet_id
        variant_name: variant_name
      duplicate_filters:
        status: [enrolled, in_progress]
      distinct_fields: []
  params:
    max_per_customer: null
- id: train_agg_household_discounts
  subject: [train_enroll]
  rule: A second group enrollment of the same customer whose class starts within 30 days of another active enrollment's
    start takes multi_dog_discount_pct; an active Tailwise Plus tier takes plus_discount_pct. Where discounts_combinable
    is false only the larger applies. Perk credit may pay the remainder where perk_credit_accepted. A guarantee
    repeat is free and takes no discount.
  eligibility: []
  params:
    per_tier:
      Puppy Training 6-Week Group:
        multi_dog_discount_pct: =multi_dog_discount_pct
        plus_discount_pct: =plus_discount_pct
        discounts_combinable: =discounts_combinable
        perk_credit_accepted: =perk_credit_accepted
        price_usd: =price_usd
      Adult Basic Training 6-Week Group:
        multi_dog_discount_pct: =multi_dog_discount_pct
        plus_discount_pct: =plus_discount_pct
        discounts_combinable: =discounts_combinable
        perk_credit_accepted: =perk_credit_accepted
        price_usd: =price_usd
      Intermediate Training 6-Week Group:
        multi_dog_discount_pct: =multi_dog_discount_pct
        plus_discount_pct: =plus_discount_pct
        discounts_combinable: =discounts_combinable
        perk_credit_accepted: =perk_credit_accepted
        price_usd: =price_usd
      Advanced Training & CGC Prep 6-Week Group:
        multi_dog_discount_pct: =multi_dog_discount_pct
        plus_discount_pct: =plus_discount_pct
        discounts_combinable: =discounts_combinable
        perk_credit_accepted: =perk_credit_accepted
        price_usd: =price_usd
      Private Training 4-Session Pack:
        multi_dog_discount_pct: =multi_dog_discount_pct
        plus_discount_pct: =plus_discount_pct
        discounts_combinable: =discounts_combinable
        perk_credit_accepted: =perk_credit_accepted
        price_usd: =price_usd
      Private Training 8-Session Pack:
        multi_dog_discount_pct: =multi_dog_discount_pct
        plus_discount_pct: =plus_discount_pct
        discounts_combinable: =discounts_combinable
        perk_credit_accepted: =perk_credit_accepted
        price_usd: =price_usd
- id: train_enrollment_requirements
  subject: [train_enroll]
  rule: The dog must be between min_age_weeks and max_age_weeks at the first session, carry a behaviour flag in
    temperament_flags_accepted (dogs flagged handling_caution or muzzle_required train privately), and have completed
    the prerequisite_course or passed a trainer evaluation. When rabies_required is true and the dog is 16 weeks
