- id: train_absences_makeups
  subject: [train_absence, train_session_forfeit, train_makeup_attend]
  rule: An absence is excused only if notice is given at least excused_absence_notice_hours before the session start.
    Notice is counted in full elapsed hours from the moment the customer's notice is recorded to the session date
    and start time; notice of exactly excused_absence_notice_hours is excused. A female in heat is excused regardless
    of notice where female_in_heat_excused, and a session cancelled by Tailwise is credited where trainer_cancel_credit.
    An unexcused absence uses the session where unexcused_absence_forfeits. An excused group session may be made
    up in another class of the same course up to makeup_sessions_max times, within makeup_window_days after the
    last scheduled session; a private session given enough notice is rescheduled, up to private_reschedules_max
    times.
  eligibility:
  - id: excused_notice
    applies_to: [train_absence]
    kind: time
    condition: An absence is excused only if notice is given at least excused_absence_notice_hours before the session
      start.
    evidence_fields: [train_sessions.event_date, train_sessions.session_time, train_sessions.train_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [train_sessions.train_event_id]
      action_bindings:
        train_sessions.train_event_id: train_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the session start
      anchor_source: train_sessions.event_date
      relation: not_after
      duration_source: variants.excused_absence_notice_hours
      unit: elapsed_hours
      counting_rule: Notice is counted in full elapsed hours from the moment the customer's notice is recorded to
        the session date and start time; notice of exactly excused_absence_notice_hours is excused.
      boundary: inclusive
  params:
    per_tier:
      Puppy Training 6-Week Group:
        excused_absence_notice_hours: =excused_absence_notice_hours
        female_in_heat_excused: =female_in_heat_excused
        trainer_cancel_credit: =trainer_cancel_credit
        unexcused_absence_forfeits: =unexcused_absence_forfeits
        makeup_sessions_max: =makeup_sessions_max
        makeup_window_days: =makeup_window_days
        private_reschedules_max: =private_reschedules_max
      Adult Basic Training 6-Week Group:
        excused_absence_notice_hours: =excused_absence_notice_hours
        female_in_heat_excused: =female_in_heat_excused
