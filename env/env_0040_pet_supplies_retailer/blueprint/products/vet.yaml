    on the service date (retail_value_basis). Unused services never carry over (unused_services_carry_over). Emergency,
    after-hours and specialist care are not covered. A redemption may be voided only if the void is recorded no
    later than void_window_days after the redemption date. The window is counted in calendar days from the event_date
    of the vet_service_redeem row, that date being day 0.
