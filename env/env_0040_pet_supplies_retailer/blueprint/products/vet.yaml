events:
- type: vet_plan_enroll
  target: vet_plans
  mutation: create
  meaning: a pet is enrolled in a wellness plan
  grain: one row per plan
  fields:
    vet_plan_id: new id
    customer_id: owner
    pet_id: pet
    variant_name: plan
    store_id: home clinic
    payment_mode: mode
    enrolled_on: date
    term_start: date
    term_end: term end
    next_payment_date: first monthly date
    fees_paid_usd: '0.00'
    services_value_used_usd: '0.00'
  triggers:
  - event: vet:vet_fee_charge
    map:
      event_date: enrolled_on
- type: vet_fee_charge
  target: vet_plan_events
  meaning: the enrollment fee, a monthly fee or a paid-in-full term is charged
  grain: one row per billing month (or term for paid in full)
  distinguish_by: [billing_month]
  fields:
    event_date: charge date
    billing_month: month covered
    amount_usd: amount charged
  account: fees_paid
  direction: in
  triggers:
  - event: member:member_points_earn
    map:
      event_date: event_date
      source_category: vet
      source_event_id: vet_event_id
      qualifying_spend_usd: amount_usd
- type: vet_fee_declined
  target: vet_plan_events
  meaning: a monthly fee is still declined after the retry days
  grain: one row per billing month
  distinguish_by: [billing_month]
  fields:
    event_date: date
    billing_month: month
    amount_usd: fee attempted
  triggers:
  - event: vet:vet_past_due
- type: vet_past_due
  target: vet_plans
  mutation:
    transition:
      from: active
      to: past_due
  meaning: the plan goes past due
  grain: one transition per occurrence
  fields:
    next_payment_date: unchanged
  triggers: []
- type: vet_reinstate
  target: vet_plans
  mutation:
    transition:
      from: past_due
      to: active
  meaning: overdue fees are paid
  grain: one transition per occurrence
  fields:
    next_payment_date: next unpaid month
  triggers:
  - event: vet:vet_fee_charge
- type: vet_service_redeem
  target: vet_plan_events
  meaning: an included service is performed at no charge
  grain: one row per service performed
  distinguish_by: [service_code, service_seq]
  fields:
    event_date: service date
    service_code: service
    service_seq: ordinal in the term
    list_value_usd: list price
  account: services_value
  direction: in
  triggers: []
- type: vet_service_void
  target: vet_plan_events
  meaning: a redemption entered in error is voided
  grain: one row per voided redemption
  distinguish_by: [original_event_id]
  fields:
    event_date: date
    original_event_id: redemption voided
    list_value_usd: value reversed
  account: services_value
  direction: out
  triggers: []
- type: vet_discounted_service
  target: vet_plan_events
  meaning: a non-included service is bought with the plan discount
  grain: one row per service bought
  distinguish_by: [event_date, service_code]
  fields:
    event_date: date
    service_code: service
    list_value_usd: list price
    discount_usd: discount
    amount_usd: billed
  triggers: []
- type: vet_renew
  target: vet_plans
  mutation: update
  meaning: the plan renews into a new term, possibly onto the graduation or senior plan
  grain: one row per renewal
  fields:
    variant_name: plan for the new term
    term_start: new start
    term_end: new end
    fees_paid_usd: reset to 0.00
    services_value_used_usd: reset to 0.00
    next_payment_date: first date of the new term
  triggers: []
- type: vet_clinic_transfer
  target: vet_plans
  mutation: update
  meaning: the home clinic changes
  grain: one row per transfer
  fields:
    store_id: new home clinic
  triggers: []
- type: vet_cancel
  target: vet_plans
  mutation:
    transition:
    - from: active
      to: cancelled
    - from: past_due
      to: cancelled
  meaning: the plan is cancelled at the customer's request or for non-payment
  grain: one transition per plan
  fields:
    cancelled_on: date
  triggers:
  - event: vet:vet_cancel_settlement
- type: vet_cancel_settlement
  target: vet_plan_events
  meaning: an early cancellation is settled
  grain: one row per cancelled plan
  distinguish_by: [event_date]
  fields:
    event_date: date
    amount_usd: balance owed or refunded
    settlement_direction: customer_owes, refund_due or none
  triggers: []
- type: vet_fee_refund
  target: vet_plan_events
  meaning: fees are refunded on a free-look cancellation
  grain: one row per refunded fee charge
  distinguish_by: [original_event_id]
  fields:
    event_date: date
    original_event_id: fee charge
    amount_usd: refund
  account: fees_paid
  direction: out
  triggers: []
- type: vet_expire
  target: vet_plans
  mutation:
    transition:
      from: active
      to: expired
  meaning: the term ends without renewal
  grain: one transition per plan
  fields:
    term_end: unchanged
  triggers: []
measures:
- id: vet_msr_services_used_term
  window: current term, term_start to term_end
  measure: count of vet_service_redeem rows per service_code not voided by a vet_service_void row
- id: vet_msr_value_used_term
  window: current term
  measure: sum of list_value_usd of vet_service_redeem rows minus voided ones
- id: vet_msr_fees_paid_term
  window: current term
  measure: sum of amount_usd of vet_fee_charge rows other than the enrollment fee, minus vet_fee_refund rows
policies:
- id: vet_agg_multi_holding
  subject: [vet_plan_enroll]
  rule: 'A customer may enroll each of their dogs and cats in one wellness plan; max_plans_per_pet applies per pet.
