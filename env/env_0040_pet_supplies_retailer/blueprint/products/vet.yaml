  rule: The plan status is active when the service is redeemed. Included services are those in included_service_counts
    up to their count per term, the core_vaccines_included as due, unlimited sick-pet office visits where unlimited_office_visits,
    telehealth where telehealth_included, a microchip where microchip_included and deworming where deworming_included.
