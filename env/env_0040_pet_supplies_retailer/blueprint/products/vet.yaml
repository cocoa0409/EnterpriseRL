- id: vet_cancellation_settlement
  subject: [vet_cancel, vet_cancel_settlement, vet_fee_refund]
  rule: 'A customer cancels by submitting a cancellation request; the plan is cancelled when the request is settled.
    A full refund is given only if the cancellation is requested no later than cancel_free_look_days after enrollment
    and no service has been redeemed. The free look is counted in calendar days from enrolled_on, that date being
    day 0; a request on the last day is in time. The enrollment fee is refunded on a free-look cancellation where
    enrollment_fee_refundable. Otherwise the settlement follows cancel_settlement_rule: the customer owes vet_msr_value_used_term
    minus vet_msr_fees_paid_term plus cancel_processing_fee_usd when that is positive; when fees paid exceed the
    value used nothing is refunded unless cancel_refund_if_fees_exceed_value. When the pet has died, the balance
    owed is waived where pet_death_waives_settlement and no processing fee is charged.'
  eligibility:
  - id: free_look
    applies_to: [vet_fee_refund]
    kind: time
    condition: A full refund is given only if the cancellation is requested no later than cancel_free_look_days
      after enrollment and no service has been redeemed.
    evidence_fields: [vet_plans.enrolled_on, vet_plans.vet_plan_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [vet_plans.vet_plan_id]
      action_bindings:
        vet_plans.vet_plan_id: vet_plan_id
    temporal_basis:
      clock: frozen_time
      anchor_event: enrollment
      anchor_source: vet_plans.enrolled_on
      relation: not_after
      duration_source: variants.cancel_free_look_days
      unit: calendar_days
      counting_rule: The free look is counted in calendar days from enrolled_on, that date being day 0; a request
        on the last day is in time.
      boundary: inclusive
  params:
    per_tier:
      Puppy Wellness Plan:
        cancel_settlement_rule: =cancel_settlement_rule
        cancel_processing_fee_usd: =cancel_processing_fee_usd
        cancel_refund_if_fees_exceed_value: =cancel_refund_if_fees_exceed_value
        cancel_free_look_days: =cancel_free_look_days
        enrollment_fee_refundable: =enrollment_fee_refundable
