category: vet
display_name: Tailwise Vet Clinic Wellness Plans
binding:
  holding_table: vet_plans
  event_tables: [vet_plan_events]
  intake_tables: [vet_cancellation_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    fees_paid_usd: fees_paid
    services_value_used_usd: services_value
lifecycle:
  states: [active, past_due, expired, cancelled]
  transitions:
  - from: active
    to: past_due
    by: system
    means: a monthly fee is still declined after payment_retry_days
  - from: past_due
    to: active
    by: agent
    means: the overdue fees are paid
  - from: past_due
    to: cancelled
    by: system
    means: past_due_grace_days run out and the plan is settled
  - from: active
    to: cancelled
    by: user
    means: the customer's cancellation request is settled
  - from: active
    to: expired
    by: system
    means: the term ends without renewal
accounts:
- key: fees_paid
  unit: USD
  meaning: 'plan fees paid in the current term: charges book in, refunds book out'
- key: services_value
  unit: USD
  meaning: 'list value of included services redeemed in the current term: redemptions book in, voids book out'
parameter_schema:
  enrollment_fee_usd: one-time enrollment fee at sign-up; USD
  monthly_fee_usd: monthly plan fee; USD
  paid_in_full_price_usd: price of the 12-month term when paid in full at enrollment or renewal; USD
  term_months: length of one plan term; integer, months
  min_age_weeks: youngest age at enrollment; integer, weeks
  max_age_weeks_at_enrollment: oldest age at enrollment; 0 means no upper limit; integer, weeks
  species: species the plan covers; enum dog | cat
  included_service_counts: included services per term and how many of each; mapping service -> count
  core_vaccines_included: core vaccines given at no charge as due during the term; list
  unlimited_office_visits: whether sick-pet office visit fees are included without limit; boolean
  telehealth_included: whether video and chat consultations are included; boolean
  spay_neuter_discount_pct: discount on a spay or neuter surgery during the term; number, percent
  microchip_included: whether one microchip implant is included; boolean
  deworming_included: whether age-appropriate deworming is included; boolean
  dental_anesthesia_included: whether anesthesia for an included dental cleaning is included; boolean
  other_services_discount_pct: discount on clinic services not included in the plan; number, percent
  clinic_rx_discount_pct: discount on medications dispensed at the clinic; number, percent
  emergency_and_specialty_covered: whether emergency, after-hours or specialist care is covered; boolean
  unused_services_carry_over: whether unused included services carry into the next term; boolean
  service_spacing_days: minimum calendar days between two included wellness exams; integer, days
  payment_retry_days: calendar days a declined monthly fee is retried before the plan becomes past due; integer,
    days
  past_due_grace_days: calendar days past due after which the plan is cancelled for non-payment and settled; integer,
    days
  services_during_past_due: whether included services and discounts may be used while past due; boolean
  late_fee_usd: late fee charged on a past-due month; USD
  auto_renew: whether the plan renews into a new term automatically; boolean
  renewal_enrollment_fee_usd: enrollment fee charged on renewal; USD
  graduation_plan: plan a juvenile plan renews into when the pet has aged out; enum of plan names or none
  senior_age_years: age at which a renewal moves to the senior plan of the species; 0 means not applicable; integer,
    years
  cancel_settlement_rule: how an early cancellation is settled; enum services_value_minus_fees_paid
  cancel_processing_fee_usd: processing fee on an early cancellation; USD
  cancel_refund_if_fees_exceed_value: whether fees paid in excess of services used are refunded on early cancellation;
    boolean
  cancel_free_look_days: calendar days after enrollment within which a plan with no service redeemed is cancelled
    with a full refund; integer, days
  enrollment_fee_refundable: whether the enrollment fee is refunded on a free-look cancellation; boolean
  pet_death_waives_settlement: whether the settlement balance is waived when the pet has died; boolean
  pet_transfer_allowed: whether the plan may be moved to another pet; boolean
  clinic_transfer_allowed: whether the home clinic may be changed to another Tailwise Vet Clinic; boolean
  max_plans_per_pet: plans one pet may hold at a time; integer, count
  perk_credit_accepted: whether Tailwise Plus Premier perk credit may pay for non-included services; boolean
  points_multiplier: multiplier on the Pals Rewards base earn rate for plan fees; integer
  groom_discount_eligible: whether the pet qualifies for the grooming pass wellness-plan discount; boolean
  retail_value_basis: price used to value included services for settlement; enum clinic_list_price_on_service_date
  exam_list_price_usd: clinic list price of a wellness exam; USD
  vaccine_list_price_usd: clinic list price per core vaccine dose; USD
  blood_panel_list_price_usd: clinic list price of a blood panel; USD
  dental_cleaning_list_price_usd: clinic list price of a dental cleaning; USD
  fecal_test_list_price_usd: clinic list price of a fecal test; USD
  office_visit_list_price_usd: clinic list price of a sick-pet office visit; USD
  void_window_days: calendar days after a redemption within which a redemption entered in error can be voided; integer,
    days
