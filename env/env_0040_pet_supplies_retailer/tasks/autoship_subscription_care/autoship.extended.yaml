      but no more than diet_older_days days ago, diet_older_overlap_days days are taken away; otherwise no days are taken away.'
    interval_days: 'The days between shared household food shipments are worked out in this order: the units per shipment times the days one unit lasts
      the pets that stay, plus the skip days, less the growing-pet days, less the ship-now days, less the outside-food days, less the switching days.'
    result: The weeks between shipments are those days divided by week_days, rounded down to a whole week, and never fewer than the program's min_frequency_weeks
      nor more than its max_frequency_weeks.
    latest_sched_date: 'When the household''s usage rose in the last six months the current usage is measured on its new footing: the usage rose when scheduled
      shipments were charged both in the last six months and between six and twelve months ago and the average units per scheduled shipment charged in the
      last six months exceed the average units per scheduled shipment charged between six and twelve months ago, and it did not rise when either period
      has no scheduled shipment; if it rose and the latest scheduled shipment charged carried the units per shipment the subscription holds now, the current
      usage is the units that latest scheduled shipment carried divided by the weeks it was booked to cover, which are the days from its charge date to
      the subscription''s next ship date divided by week_days; if it rose and the latest scheduled shipment charged carried a different number of units,
      the current usage is the units of scheduled shipments charged in the last six months divided by half_year_weeks weeks; otherwise it is measured over
      the last twelve months as stated.'
  factors:
  - id: usage_measuring_window
    effect: method
    decides: household_weekly_units
    bindings:
    - latest_sched_units
    - latest_sched_date
    - household_rose
    - household_weekly_units
    ladder:
    - when: the household's usage rose in the last six months and the latest scheduled shipment charged carried the units per shipment the subscription
        holds now
      method: current usage is the units the latest scheduled shipment carried divided by the weeks from its charge date to the subscription's next ship
        date
    - when: the household's usage rose in the last six months and the latest scheduled shipment charged carried a different number of units
      method: current usage is the units of scheduled shipments charged in the last six months divided by half_year_weeks weeks
    - when: otherwise
      method: current usage is the units of scheduled shipments charged in the last twelve months divided by year_weeks weeks
    baseline:
      household_weekly_units: units_12m / K('year_weeks')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: skip_stretch
    effect: parameter
    decides: skip_stretch_days
    bindings:
    - customer_skips_12m
    - skip_stretch_days
    ladder:
    - when: two or more customer-requested skips on the subscription in the last twelve months
      value: K('skip_multi_days')
    - when: exactly one customer-requested skip on the subscription in the last twelve months
      value: K('skip_single_days')
    - when: otherwise
      value: 0 days
    baseline:
      skip_stretch_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: growing_pet_pull
    effect: parameter
    decides: growth_pull_days
    bindings:
    - young_plan
    - adult_plan_age_days
    - growth_pull_days
    ladder:
    - when: the customer holds a Kitten Wellness Plan or Puppy Wellness Plan in status active
      value: K('young_growth_days')
    - when: no kitten or puppy plan, and an Adult Cat Wellness Plan or Adult Dog Wellness Plan in status active enrolled no more than young_adult_days days
        ago
      value: K('adult_growth_days')
    - when: otherwise
      value: 0 days
    baseline:
      growth_pull_days: '0'
    evidence:
    - cross_category
    cross_difficulty: vet
  - id: ship_now_pull
    effect: parameter
    decides: ship_now_pull_days
    bindings:
    - ship_now_6m
    - ship_now_pull_days
    ladder:
    - when: two or more ship-now shipments charged on the subscription in the last six months
      value: K('shipnow_multi_days')
    - when: exactly one ship-now shipment charged on the subscription in the last six months
      value: K('shipnow_single_days')
    - when: otherwise
      value: 0 days
    baseline:
      ship_now_pull_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: outside_food_pull
    effect: parameter
    decides: outside_food_pull_days
    bindings:
    - outside_food_orders
    - outside_food_pull_days
    ladder:
    - when: two or more one-time order lines of food charged to the customer in the last outside_window_months months
      value: K('outside_multi_days')
    - when: exactly one such order line in the last outside_window_months months
      value: K('outside_single_days')
    - when: otherwise
      value: 0 days
    baseline:
      outside_food_pull_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: order
  - id: diet_switch_overlap
    effect: parameter
    decides: diet_overlap_days
    bindings:
    - diet_start_age_days
    - diet_overlap_days
    ladder:
    - when: the customer's active Rx Prescription Diet prescription was authorized no more than diet_recent_days days ago
      value: K('diet_recent_overlap_days')
    - when: that prescription was authorized more than diet_recent_days but no more than diet_older_days days ago
      value: K('diet_older_overlap_days')
    - when: otherwise
      value: 0 days
    baseline:
      diet_overlap_days: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: rx
  baseline:
    rule: 'The pet that leaves is counted at the household''s usage of the six months before the last six months: the units of the subscription''s scheduled
      shipments charged between six and twelve months ago, divided by half_year_weeks weeks. The household''s current usage is the units of the subscription''s
      scheduled shipments charged in the last twelve months, divided by year_weeks weeks. The pets that stay use the household''s current usage less the
      leaving pet''s usage, and one unit lasts them week_days divided by that weekly usage, in days. The days between shared household food shipments are
      the subscription''s units per shipment multiplied by the days one unit lasts the pets that stay. The weeks between shipments are those days divided
      by week_days, rounded down to a whole week, and never fewer than the program''s min_frequency_weeks nor more than its max_frequency_weeks.'
    params:
    - half_year_weeks
    - year_weeks
    - week_days
    - min_frequency_weeks
    - max_frequency_weeks
  inputs:
    history:
    - table: autoship_events
      aggregate: sum
      field: quantity
      within_months: 12
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: sum
      field: quantity
      within_months: 6
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 12
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 6
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 12
      filters:
        event_type: autoship_skip
        skip_reason: customer_request
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 6
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: ship_now
    - category: order
      table: order_events
      aggregate: count
      field: event_date
      within_months: K('outside_window_months')
      filters:
        event_type: order_line_charge
        item_category: food
    - table: autoship_events
      aggregate: latest
      field: quantity
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: latest
      field: event_date
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    cross_category:
    - order
    - rx
    - vet
- id: autoship_ext_rx_diet_enrollment_bags
  base_policy_refs: &id002
  - autoship_agg_multi_holding
  - autoship_enrollment_requirements
  overwrite: []
  trigger: on_request
  subject:
  - autoship_enroll
  computes: quantity
  target_tool: enroll_rx_autoship_732fccd3
  params:
    consolidation_cushion_days: 21
    week_days: 7
    starter_recent_days: 30
    starter_older_days: 90
    starter_recent_trim_days: 4
    starter_older_trim_days: 2
    senior_transition_days: 4
    adult_transition_days: 2
    food_recent_days: 14
    food_older_days: 45
    food_recent_trim_days: 3
    food_older_trim_days: 1
    decline_multi_trim_days: 3
    decline_single_trim_days: 1
    skip_multi_trim_days: 4
    skip_single_trim_days: 2
  rule: 'This rule sets the bag count per shipment of a new Autoship Pharmacy subscription for a pet''s Rx Prescription Diet prescription when the pet already
    has an Autoship Pharmacy subscription in its name, written as the new subscription''s quantity; the new subscription ships on the same weeks between
    shipments as that existing prescription Autoship, and its first ship date is the date the customer chooses. The bag count of a prescription diet Autoship
    that ships alongside the pet''s medication Autoship is not fixed until the weeks between that medication Autoship''s shipments have been re-timed under
    its current package count. A prescription diet Autoship for a pet is not set up before the shared household food Autoship the pet has been eating from
    has been re-timed for the pets that stay on it. The diet days a new prescription diet Autoship shipment carries start from one full fill: the diet prescription''s
    days'' supply per fill. One bag lasts the diet prescription''s days'' supply per fill divided by its packages per fill. The bag count is the diet days
    divided by the days one bag lasts, rounded up to a whole bag, and never less than one bag. The bag count never exceeds the packages one fill of the
    diet prescription authorizes, the Autoship Pharmacy program''s max_quantity_per_shipment, or the whole number of bags whose combined days fit within
    the Autoship Pharmacy program''s rx_max_days_supply_per_shipment; Autoship Pharmacy is the program of both the new subscription and the pet''s existing
    subscription. The diet days follow the pet''s existing prescription Autoship, whose weeks between shipments are counted in days at week_days days a
    week: when that Autoship is in status active, its latest charged shipment is no more than its weeks between shipments in days plus consolidation_cushion_days
    days old, and those days plus consolidation_cushion_days are fewer than one full fill''s days, the diet days are its weeks between shipments in days
    plus consolidation_cushion_days days; when that Autoship is in status paused, payment_hold or rx_hold, the diet days are one full fill''s days less
    the days one bag lasts; otherwise the diet days are one full fill''s days. A starter bag already bought takes days off the diet days: when a one-time-order
    fill of the diet prescription was dispensed no more than starter_recent_days days ago, starter_recent_trim_days days come off; when the latest such
    fill was dispensed more than starter_recent_days but no more than starter_older_days days ago, starter_older_trim_days days come off; otherwise no days
    come off. The switch from the pet''s old food takes days off the diet days: a pet holding a Senior Cat Wellness Plan or Senior Dog Wellness Plan in
    status active takes senior_transition_days days off, a pet holding an Adult Cat Wellness Plan or Adult Dog Wellness Plan in status active takes adult_transition_days
    days off, and any other pet takes no days off. Regular food bought recently takes days off the diet days: when the customer''s latest one-time order
    line of food was charged no more than food_recent_days days ago, food_recent_trim_days days come off; when it was charged more than food_recent_days
    but no more than food_older_days days ago, food_older_trim_days days come off; otherwise no days come off. Skips on the pet''s existing Autoship Pharmacy
    subscription show that pharmacy deliveries for the pet have been arriving while stock remained, so the diet shipment, which joins those deliveries,
    carries fewer days: two or more skips the customer requested on it in the last twelve months take skip_multi_trim_days days off, exactly one takes skip_single_trim_days
    days off, and none takes no days off. Declined payments on the pet''s existing prescription Autoship take days off the diet days: two or more declined
    payment attempts on it in the last six months take decline_multi_trim_days days off, exactly one takes decline_single_trim_days days off, and none takes
    no days off. The diet days are worked out in this order: the days that follow the existing prescription Autoship, less the starter-bag days, less the
    switching days, less the regular-food days, less the skip days, less the declined-payment days. A record counts as dated in the last N months when its
    date is later than the same calendar day N months before the day the value is worked out, so a record dated exactly N months earlier does not count;
    a record dated between six and twelve months ago is one dated in the last twelve months but not in the last six months.'
  prerequisite:
  - problem: autoship_ext_rx_shipment_interval
    kind: value_input
    gate: companion_interval_days
    form: action
    policy_source: The bag count of a prescription diet Autoship that ships alongside the pet's medication Autoship is not fixed until the weeks between
      that medication Autoship's shipments have been re-timed under its current package count.
    fallback_reason: Re-timing leaves only a frequency in weeks on the medication Autoship, a number it may already have carried before; no record marks
      that the frequency was re-timed under the current package count, so no record-visible state singles out that write.
    condition: The pet's medication Autoship carries the frequency in weeks that the re-timing rule gives once its package count has been re-set under its
      linked prescription, the re-timing having been made after that re-set; a frequency left from before the re-set does not meet it even where the numbers
      happen to agree.
    resolved_by: set_rx_shipment_interval_b175142c
    effect: Once the medication Autoship is re-timed, its weeks between shipments in days feed the diet days that follow it, which moves the bag count.
  - problem: autoship_ext_household_interval
    kind: state_gate
    gate: autoship_subscriptions.frequency_weeks
    form: action
    policy_source: A prescription diet Autoship for a pet is not set up before the shared household food Autoship the pet has been eating from has been
      re-timed for the pets that stay on it.
    fallback_reason: Re-timing the shared household food Autoship leaves only a new frequency in weeks on that subscription, a number that could also have
      been set by any earlier ordinary frequency change; no record marks that it was re-timed for the pets that stay on it, so no record-visible state singles
      out that write.
    condition: The shared household food Autoship the pet ate from carries the frequency in weeks worked out by the household re-timing rule for the pets
      that stay on it.
    resolved_by: set_shipment_interval_36e38cde
    effect: Once the shared household food Autoship is re-timed for the pets that stay, the gate on setting up the pet's prescription diet Autoship is met.
  cross_category:
  - category: order
    as: history
    reads:
    - event_type
    - item_category
    - order_events.event_date
    - order_events.event_type
    note: read-only; decides the tier of regular_food_on_hand from the customer's order records
  - category: rx
    as: history
    reads:
    - days_supply_per_fill
    - event_type
    - fill_channel
    - quantity_per_fill
    - rx_events.event_date
    - rx_events.event_type
    - rx_prescription_id
    - status
    - variant_name
    - pet_id
    note: read-only; decides the tier of starter_bag_on_hand from the pet's own Rx Prescription Diet prescription and its fills, and supplies that prescription's
      days and packages per fill
  - category: vet
    as: history
    reads:
    - pet_id
    - status
    - variant_name
    note: read-only; decides the tier of life_stage_transition from the customer's vet records
  compute:
  - diet_fill_days: CFIELD('rx','days_supply_per_fill', variant_name='Rx Prescription Diet', status='active', pet_id=F('pet_id'))
  - diet_fill_bags: CFIELD('rx','quantity_per_fill', variant_name='Rx Prescription Diet', status='active', pet_id=F('pet_id'))
  - diet_bag_days: diet_fill_days / diet_fill_bags
  - companion_interval_days: F('frequency_weeks') * K('week_days')
  - companion_status: F('status')
  - companion_last_charge_age_days: DAYS(LATEST('autoship_events','event_date', event_type='autoship_shipment_charge'), NOW)
  - carried_diet_days: companion_interval_days + K('consolidation_cushion_days') if (companion_status == 'active' and companion_last_charge_age_days <=
      companion_interval_days + K('consolidation_cushion_days') and companion_interval_days + K('consolidation_cushion_days') < diet_fill_days) else (diet_fill_days
      - diet_bag_days if (companion_status == 'paused' or companion_status == 'payment_hold' or companion_status == 'rx_hold') else diet_fill_days)
  - diet_rx_id: CFIELD('rx','rx_prescription_id', variant_name='Rx Prescription Diet', status='active', pet_id=F('pet_id'))
  - starter_age_days: DAYS(XLATEST('rx','rx_events','event_date', event_type='rx_fill', fill_channel='one_time_order', rx_prescription_id=diet_rx_id), NOW)
      if XCOUNT('rx','rx_events', event_type='rx_fill', fill_channel='one_time_order', rx_prescription_id=diet_rx_id) >= 1 else 9999
  - starter_trim_days: K('starter_recent_trim_days') if starter_age_days <= K('starter_recent_days') else (K('starter_older_trim_days') if starter_age_days
      <= K('starter_older_days') else 0)
  - pet_life_plan: CFIELD('vet','variant_name', status='active', pet_id=F('pet_id'))
  - transition_trim_days: K('senior_transition_days') if (pet_life_plan == 'Senior Cat Wellness Plan' or pet_life_plan == 'Senior Dog Wellness Plan') else
      (K('adult_transition_days') if (pet_life_plan == 'Adult Cat Wellness Plan' or pet_life_plan == 'Adult Dog Wellness Plan') else 0)
  - food_order_age_days: DAYS(XLATEST('order','order_events','event_date', event_type='order_line_charge', item_category='food'), NOW) if XCOUNT('order','order_events',
      event_type='order_line_charge', item_category='food') >= 1 else 9999
  - food_on_hand_trim_days: K('food_recent_trim_days') if food_order_age_days <= K('food_recent_days') else (K('food_older_trim_days') if food_order_age_days
      <= K('food_older_days') else 0)
  - companion_skips_12m: COUNT('autoship_events', within_months=12, event_type='autoship_skip', skip_reason='customer_request')
  - companion_skip_trim_days: K('skip_multi_trim_days') if companion_skips_12m >= 2 else (K('skip_single_trim_days') if companion_skips_12m == 1 else 0)
