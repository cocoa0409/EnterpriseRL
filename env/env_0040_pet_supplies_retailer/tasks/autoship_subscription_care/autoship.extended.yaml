    note: read-only; decides the tier of life_stage_trim from the customer's vet records
  compute:
  - units_12m: SUM('autoship_events','quantity', within_months=12, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - units_6m: SUM('autoship_events','quantity', within_months=6, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - charges_12m: COUNT('autoship_events', within_months=12, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - charges_6m: COUNT('autoship_events', within_months=6, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - household_rose: (charges_6m > 0 and charges_12m - charges_6m > 0 and units_6m / charges_6m > (units_12m - units_6m) / (charges_12m - charges_6m))
  - own_pet_weekly_units: (units_12m - units_6m) / K('half_year_weeks') if (household_rose and charges_12m - charges_6m >= K('pre_rise_min_charges')) else
      ((units_12m - units_6m) / ((charges_12m - charges_6m) * F('frequency_weeks')) if (household_rose and charges_12m - charges_6m < K('pre_rise_min_charges'))
      else units_12m / K('year_weeks'))
  - own_pet_unit_days: K('week_days') / own_pet_weekly_units
  - own_interval_days: F('frequency_weeks') * K('week_days')
  - mem_tier: CFIELD('member','variant_name', status='active')
  - scheduled_charges_12m: COUNT('autoship_events', within_months=12, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - cushion_days: K('plus_cushion_days') if ((mem_tier == 'Tailwise Plus Monthly' or mem_tier == 'Tailwise Plus Annual' or mem_tier == 'Tailwise Plus Premier
      Annual') and scheduled_charges_12m >= K('member_min_charges')) else (K('rewards_cushion_days') if ((mem_tier == 'Pals Rewards VIP' or mem_tier ==
      'Pals Rewards Insider') and scheduled_charges_12m >= K('member_min_charges')) else K('standard_cushion_days'))
  - customer_skips_6m: COUNT('autoship_events', within_months=6, event_type='autoship_skip', skip_reason='customer_request')
  - skip_trim_days: K('skip_multi_trim_days') if customer_skips_6m >= 2 else (K('skip_single_trim_days') if customer_skips_6m == 1 else 0)
  - own_pet_plan: CFIELD('vet','variant_name', status='active', pet_id=F('pet_id'))
  - life_stage_trim_days: K('senior_trim_days') if (own_pet_plan == 'Senior Dog Wellness Plan' or own_pet_plan == 'Senior Cat Wellness Plan') else (K('young_trim_days')
      if (own_pet_plan == 'Puppy Wellness Plan' or own_pet_plan == 'Kitten Wellness Plan') else 0)
  - days_to_cover: own_interval_days + cushion_days - skip_trim_days - life_stage_trim_days
  - result: int(MN(P('max_quantity_per_shipment'), MX(1, -(-days_to_cover // own_pet_unit_days))))
