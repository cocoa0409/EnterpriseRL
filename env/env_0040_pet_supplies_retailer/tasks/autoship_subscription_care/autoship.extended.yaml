- id: autoship_payment_recovery
  subject: [autoship_payment_declined, autoship_payment_hold, autoship_payment_restore, autoship_auto_cancel]
  rule: When a scheduled shipment's payment is declined the subscription goes on payment hold and the shipment keeps
    its scheduled ship date. The card is retried automatically payment_retry_attempts times, payment_retry_interval_days
    calendar days apart; each failed retry is recorded with the next payment_attempt number. The subscription status
    is payment_hold when the release is requested. The hold is released by an agent only after the customer has
    put a working card on file in their own account; the held shipment is then charged on the release date at that
    day's price with the discount it would have received, and the next ship date becomes the release date plus frequency_weeks.
    A subscription still on payment hold payment_hold_cancel_after_days calendar days after the first decline is
    cancelled automatically, without any fee. Payment hold never carries a late fee.
