- id: autoship_evt_skip
  subject: [autoship_skip]
  rule: 'A customer may skip the next scheduled shipment. The subscription status is active when the skip is requested.
    A change, skip or cancellation affects the upcoming shipment only if it is requested no later than change_cutoff_days
    before the subscription''s next ship date. The cutoff is counted in calendar days backward from the next ship
    date: a request dated exactly change_cutoff_days before the next ship date is in time, and a later request is
    late. A late skip request leaves the upcoming shipment in place and skips the one after it. A customer-requested
    skip is refused when autoship_msr_skips_365d has already reached skip_limit_per_12_months or autoship_msr_consecutive_skips
    has already reached max_consecutive_skips; the alternatives then offered are a longer frequency or a pause.
    A shipment still out of stock backorder_skip_after_days after its scheduled ship date is skipped automatically
    with skip_reason backorder, without charge, and counts toward the limits only when backorder_skip_counts_toward_limit
    is true. Every skip moves the next ship date forward by one frequency_weeks interval from the skipped date.'
  eligibility:
  - id: skippable_status
    applies_to: [autoship_skip]
    kind: state
    condition: The subscription status is active when the skip is requested.
    evidence_fields: [autoship_subscriptions.status, autoship_subscriptions.autoship_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [autoship_subscriptions.autoship_id]
      action_bindings:
        autoship_subscriptions.autoship_id: autoship_id
    state_contract:
      field: autoship_subscriptions.status
      allowed: [active]
  - id: skip_before_cutoff
    applies_to: [autoship_skip]
    kind: time
    condition: A change, skip or cancellation affects the upcoming shipment only if it is requested no later than
      change_cutoff_days before the subscription's next ship date.
    evidence_fields: [autoship_subscriptions.next_ship_date, autoship_subscriptions.autoship_id]
    evidence_contract:
