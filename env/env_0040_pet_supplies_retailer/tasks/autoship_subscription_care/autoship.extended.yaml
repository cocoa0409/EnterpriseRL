      the current usage is the units of scheduled shipments charged in the last six months divided by half_year_weeks weeks; otherwise it is measured over
      the last twelve months as stated.'
    household_rose: 'When the household''s usage rose in the last six months the current usage is measured on its new footing: the usage rose when scheduled
      shipments were charged both in the last six months and between six and twelve months ago and the average units per scheduled shipment charged in the
      last six months exceed the average units per scheduled shipment charged between six and twelve months ago, and it did not rise when either period
      has no scheduled shipment; if it rose and the latest scheduled shipment charged carried the units per shipment the subscription holds now, the current
