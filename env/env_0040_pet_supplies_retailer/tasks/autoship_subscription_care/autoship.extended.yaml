      the current usage is the units that latest scheduled shipment carried divided by the weeks it was booked to cover, which are the days from its charge
      date to the subscription''s next ship date divided by week_days; if it rose and the latest scheduled shipment charged carried a different number of
      units, the current usage is the units of scheduled shipments charged in the last six months divided by half_year_weeks weeks; otherwise it is measured
      over the last twelve months as stated.'
    remaining_weekly_units: The pets that stay use the household's current usage less the leaving pet's usage, and one unit lasts them week_days divided
      by that weekly usage, in days.
    unit_days: The pets that stay use the household's current usage less the leaving pet's usage, and one unit lasts them week_days divided by that weekly
      usage, in days.
    customer_skips_12m: 'Customer-requested skips lengthen the days between shared household food shipments: two or more skips the customer requested on
      the subscription in the last twelve months add skip_multi_days days, exactly one adds skip_single_days days, and none adds no days.'
    skip_stretch_days: 'Customer-requested skips lengthen the days between shared household food shipments: two or more skips the customer requested on
      the subscription in the last twelve months add skip_multi_days days, exactly one adds skip_single_days days, and none adds no days.'
    young_plan: 'A growing pet in the household shortens the days between shared household food shipments: when the customer holds a Kitten Wellness Plan
      or Puppy Wellness Plan in status active, young_growth_days days are taken away; when there is no such plan but the customer holds an Adult Cat Wellness
      Plan or Adult Dog Wellness Plan in status active enrolled no more than young_adult_days days ago, adult_growth_days days are taken away; otherwise
      no days are taken away.'
    adult_plan_age_days: 'A growing pet in the household shortens the days between shared household food shipments: when the customer holds a Kitten Wellness
