  factors:
  - id: extended_supply_loyalty
    effect: parameter
    decides: loyalty_supply_days
    bindings:
    - mem_tier
    - autoship_tenure_days
    - loyalty_supply_days
    ladder:
    - when: rewards membership in status active is Pals Rewards VIP or a Tailwise Plus tier, and the pharmacy Autoship was enrolled at least loyalty_top_tenure_days
        days before the re-set
      value: K('loyalty_top_days')
    - when: rewards membership in status active is Pals Rewards Insider, and the pharmacy Autoship was enrolled at least loyalty_mid_tenure_days days before
        the re-set
      value: K('loyalty_mid_days')
    - when: otherwise
      value: 0 days
    baseline:
      loyalty_supply_days: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: member
  - id: steady_refill_record
    effect: parameter
    decides: steady_supply_days
    bindings:
    - scheduled_charges_12m
    - steady_supply_days
    ladder:
    - when: four or more scheduled shipments of the subscription charged in the last twelve months
      value: K('steady_full_days')
    - when: two or three scheduled shipments of the subscription charged in the last twelve months
      value: K('steady_part_days')
    - when: otherwise
      value: 0 days
    baseline:
      steady_supply_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: renewal_recheck_holdback
    effect: parameter
    decides: renewal_holdback_days
    bindings:
    - rx_origin
    - rx_authorized_age_days
    - renewal_holdback_days
    ladder:
    - when: the linked prescription came as a renewal and its authorization was recorded no more than renewal_recent_days days before the re-set
      value: K('renewal_recent_holdback_days')
    - when: the linked prescription came as a renewal and its authorization was recorded more than renewal_recent_days but no more than renewal_older_days
        days before the re-set
      value: K('renewal_older_holdback_days')
    - when: otherwise
      value: 0 days
    baseline:
      renewal_holdback_days: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: rx
  - id: payment_decline_holdback
    effect: parameter
    decides: decline_holdback_days
    bindings:
    - declines_6m
    - decline_holdback_days
    ladder:
    - when: two or more declined payment attempts on the subscription in the last six months
      value: K('decline_multi_holdback_days')
    - when: exactly one declined payment attempt on the subscription in the last six months
      value: K('decline_single_holdback_days')
    - when: otherwise
      value: 0 days
    baseline:
      decline_holdback_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: senior_recheck_cycle
    effect: method
    decides: counted_supply_days
    bindings:
    - pet_plan
    - rx_class
    - plan_term_end
    - counted_supply_days
    ladder:
    - when: the linked pet holds a Senior Cat Wellness Plan or Senior Dog Wellness Plan in status active and the linked prescription is of class Rx Maintenance
        Medication
      method: the planned supply days are cut down to whole blocks of recheck_block_days days
    - when: the linked pet holds such a senior plan in status active and the linked prescription is of any other class
      method: the planned supply days are capped at the days left from the day of the re-set to the last day of that wellness plan's current term
    - when: otherwise
      method: the planned supply days are used as worked out
    baseline:
      counted_supply_days: target_supply_days
    evidence:
    - cross_category
    - date
    cross_difficulty: vet
  baseline:
    rule: The package count is planned from the supply days a pharmacy Autoship shipment is planned to carry, and a standard shipment is planned to carry
      standard_supply_days days of supply. One package lasts the linked prescription's days' supply per fill divided by its packages per fill. The package
      count is the planned supply days divided by the days one package lasts, rounded up to a whole package, and never less than one package. The package
      count never exceeds the packages that one fill of the linked prescription authorizes, the program's max_quantity_per_shipment, or the whole number
      of packages whose combined days of supply fit within the program's rx_max_days_supply_per_shipment.
    params:
    - standard_supply_days
    - max_quantity_per_shipment
    - rx_max_days_supply_per_shipment
  inputs:
    history:
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 12
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 6
      filters:
        event_type: autoship_payment_declined
    cross_category:
    - member
    - rx
    - vet
- id: autoship_ext_rx_shipment_interval
  base_policy_refs: *id001
  overwrite: []
  trigger: state_due
  subject:
  - autoship_modify
  computes: frequency_weeks
  target_tool: set_rx_shipment_interval_b175142c
  params:
    travel_reserve_pct: 95
    replacement_multi_lead_days: 9
    replacement_single_lead_days: 5
    skip_multi_days: 21
    skip_single_days: 14
    shipnow_multi_days: 6
    shipnow_single_days: 3
    outside_multi_days: 6
    outside_single_days: 3
    panel_none_days: 4
    panel_aging_days: 2
    panel_recent_months: 6
    panel_window_months: 12
    week_days: 7
    lost_reserve_days: 6
  rule: 'This rule sets the weeks between shipments of an Autoship Pharmacy or Autoship Compounded Pharmacy subscription, written as the subscription''s
    frequency in weeks, whenever the subscription is re-timed under its linked prescription. Once a renewed prescription has been linked to a pharmacy Autoship,
    the subscription is due to be re-timed under the renewed prescription, whether or not the customer raises it. The weeks between shipments of a pharmacy
    Autoship are re-timed only after its package count per shipment has been re-set under the prescription it is linked to. The dosing days between prescription
    Autoship shipments start from the days of supply one shipment carries: the subscription''s package count multiplied by the days one package lasts, which
    is the linked prescription''s days'' supply per fill divided by its packages per fill. The dosing days between shipments leave room for delivery: they
    are reduced by the program''s delivery_days_after_ship. The weeks between shipments are the dosing days divided by week_days, rounded down to a whole
    week, and never fewer than the program''s min_frequency_weeks nor more than its max_frequency_weeks. Lost or travel doses shorten the usable supply
    before anything else is applied: when a fill of the linked prescription, or of the prescription it renewed, was dispensed in the last twelve months
    under an early-refill override for lost or damaged medication, lost_reserve_days days are held back from the days of supply one shipment carries as
    a standing reserve against another lost dose, never going below zero; when no such lost-or-damaged override exists but a fill of either prescription
    was dispensed in that period under a travel override, they are multiplied by travel_reserve_pct percent and rounded down to a whole day; otherwise they
    are used in full. Replacement shipments lengthen the delivery room: when two or more replacement shipments were released on the subscription in the
    last twelve months, the delivery room is replacement_multi_lead_days days; when exactly one was released in that period, it is replacement_single_lead_days
    days; otherwise it is the program''s delivery_days_after_ship. Customer-requested skips lengthen the dosing days between shipments: two or more skips
    the customer requested on the subscription in the last twelve months add skip_multi_days days, exactly one adds skip_single_days days, and none adds
    no days. Ship-now shipments shorten the dosing days between shipments: two or more ship-now shipments charged on the subscription in the last twelve
    months take away shipnow_multi_days days, exactly one takes away shipnow_single_days days, and none takes away no days. Fills ordered outside the Autoship
    shorten the dosing days between shipments: two or more one-time-order fills of the linked prescription, or of the prescription it renewed, dispensed
    in the last twelve months take away outside_multi_days days, exactly one takes away outside_single_days days, and none takes away no days. An aging
    recheck shortens the dosing days between shipments, counting blood panels redeemed less those voided on the plan in the same period: when no blood panel
    was redeemed on any of the customer''s wellness plans in the last panel_window_months months, panel_none_days days are taken away; when one was redeemed
    in that period but none in the last panel_recent_months months, panel_aging_days days are taken away; otherwise no days are taken away. The dosing days
    between shipments are worked out in this order: the usable days of supply one shipment carries, plus the skip days, less the delivery room, less the
    ship-now days, less the outside-fill days, less the recheck days. A record counts as dated in the last N months when its date is later than the same
    calendar day N months before the day the value is worked out, so a record dated exactly N months earlier does not count; a record dated between six
    and twelve months ago is one dated in the last twelve months but not in the last six months.'
  prerequisite:
  - problem: autoship_ext_rx_shipment_packages
    kind: value_input
    gate: shipment_supply_days
    form: action
    policy_source: The weeks between shipments of a pharmacy Autoship are re-timed only after its package count per shipment has been re-set under the prescription
      it is linked to.
    fallback_reason: The re-set leaves only a package count on the subscription, a number that the subscription may already carry by coincidence or from
      an earlier plan; no record marks that the count has been re-set under the linked prescription, so no record-visible state singles out that write.
    condition: The pharmacy Autoship's quantity holds the package count worked out under its linked prescription by the package-count rule before its frequency
      is re-timed.
    resolved_by: set_rx_shipment_packages_d23afb64
    effect: Once the package count is re-set, the days of supply one shipment carries (package count times the days one package lasts) take the re-set count,
      which moves the dosing days and so the weeks between shipments.
  cross_category:
  - category: rx
    as: history
    reads:
    - days_supply_per_fill
    - event_type
    - fill_channel
    - override_reason
    - quantity_per_fill
    - renewal_of_rx_id
    - rx_events.event_type
    - rx_prescription_id
    note: read-only; decides the tier of dose_loss_reserve, outside_fill_pull from the customer's rx records
  - category: vet
    as: history
    reads:
    - event_type
    - service_code
    - vet_plan_events.event_type
    note: read-only; decides the tier of lab_recheck_pull from the customer's vet records
  compute:
  - interval_package_days: CFIELD('rx','days_supply_per_fill', rx_prescription_id=F('rx_prescription_id')) / CFIELD('rx','quantity_per_fill', rx_prescription_id=F('rx_prescription_id'))
  - shipment_supply_days: F('quantity') * interval_package_days
  - lost_overrides_12m: XCOUNT('rx','rx_events', within_months=12, event_type='rx_fill', override_reason='lost_or_damaged', rx_prescription_id=F('rx_prescription_id'))
      + XCOUNT('rx','rx_events', within_months=12, event_type='rx_fill', override_reason='lost_or_damaged', rx_prescription_id=CFIELD('rx','renewal_of_rx_id',
      rx_prescription_id=F('rx_prescription_id')))
  - travel_overrides_12m: XCOUNT('rx','rx_events', within_months=12, event_type='rx_fill', override_reason='travel', rx_prescription_id=F('rx_prescription_id'))
      + XCOUNT('rx','rx_events', within_months=12, event_type='rx_fill', override_reason='travel', rx_prescription_id=CFIELD('rx','renewal_of_rx_id', rx_prescription_id=F('rx_prescription_id')))
  - usable_supply_days: MX(0, shipment_supply_days - K('lost_reserve_days')) if lost_overrides_12m >= 1 else (int(shipment_supply_days * K('travel_reserve_pct')
      / 100) if (lost_overrides_12m == 0 and travel_overrides_12m >= 1) else shipment_supply_days)
  - replacements_12m: COUNT('autoship_events', within_months=12, event_type='autoship_reship')
  - delivery_lead_days: K('replacement_multi_lead_days') if replacements_12m >= 2 else (K('replacement_single_lead_days') if replacements_12m == 1 else
      P('delivery_days_after_ship'))
  - customer_skips_12m: COUNT('autoship_events', within_months=12, event_type='autoship_skip', skip_reason='customer_request')
  - skip_stretch_days: K('skip_multi_days') if customer_skips_12m >= 2 else (K('skip_single_days') if customer_skips_12m == 1 else 0)
  - ship_now_12m: COUNT('autoship_events', within_months=12, event_type='autoship_shipment_charge', shipment_kind='ship_now')
  - ship_now_pull_days: K('shipnow_multi_days') if ship_now_12m >= 2 else (K('shipnow_single_days') if ship_now_12m == 1 else 0)
  - outside_fills_12m: XCOUNT('rx','rx_events', within_months=12, event_type='rx_fill', fill_channel='one_time_order', rx_prescription_id=F('rx_prescription_id'))
      + XCOUNT('rx','rx_events', within_months=12, event_type='rx_fill', fill_channel='one_time_order', rx_prescription_id=CFIELD('rx','renewal_of_rx_id',
      rx_prescription_id=F('rx_prescription_id')))
  - outside_fill_pull_days: K('outside_multi_days') if outside_fills_12m >= 2 else (K('outside_single_days') if outside_fills_12m == 1 else 0)
  - panels_recent: XCOUNT('vet','vet_plan_events', within_months=K('panel_recent_months'), event_type='vet_service_redeem', service_code='blood_panel')
      - XCOUNT('vet','vet_plan_events', within_months=K('panel_recent_months'), event_type='vet_service_void', service_code='blood_panel')
  - panels_year: XCOUNT('vet','vet_plan_events', within_months=K('panel_window_months'), event_type='vet_service_redeem', service_code='blood_panel') -
      XCOUNT('vet','vet_plan_events', within_months=K('panel_window_months'), event_type='vet_service_void', service_code='blood_panel')
  - panel_pull_days: K('panel_none_days') if panels_year == 0 else (K('panel_aging_days') if (panels_year >= 1 and panels_recent == 0) else 0)
  - interval_days: usable_supply_days + skip_stretch_days - delivery_lead_days - ship_now_pull_days - outside_fill_pull_days - panel_pull_days
  - result: int(MN(P('max_frequency_weeks'), MX(P('min_frequency_weeks'), int(interval_days / K('week_days')))))
  compute_basis:
    interval_package_days: 'The dosing days between prescription Autoship shipments start from the days of supply one shipment carries: the subscription''s
      package count multiplied by the days one package lasts, which is the linked prescription''s days'' supply per fill divided by its packages per fill.'
    shipment_supply_days: 'The dosing days between prescription Autoship shipments start from the days of supply one shipment carries: the subscription''s
      package count multiplied by the days one package lasts, which is the linked prescription''s days'' supply per fill divided by its packages per fill.'
    lost_overrides_12m: 'Lost or travel doses shorten the usable supply before anything else is applied: when a fill of the linked prescription, or of the
      prescription it renewed, was dispensed in the last twelve months under an early-refill override for lost or damaged medication, lost_reserve_days
      days are held back from the days of supply one shipment carries as a standing reserve against another lost dose, never going below zero; when no such
      lost-or-damaged override exists but a fill of either prescription was dispensed in that period under a travel override, they are multiplied by travel_reserve_pct
      percent and rounded down to a whole day; otherwise they are used in full.'
    travel_overrides_12m: 'Lost or travel doses shorten the usable supply before anything else is applied: when a fill of the linked prescription, or of
      the prescription it renewed, was dispensed in the last twelve months under an early-refill override for lost or damaged medication, lost_reserve_days
      days are held back from the days of supply one shipment carries as a standing reserve against another lost dose, never going below zero; when no such
      lost-or-damaged override exists but a fill of either prescription was dispensed in that period under a travel override, they are multiplied by travel_reserve_pct
      percent and rounded down to a whole day; otherwise they are used in full.'
    usable_supply_days: 'Lost or travel doses shorten the usable supply before anything else is applied: when a fill of the linked prescription, or of the
      prescription it renewed, was dispensed in the last twelve months under an early-refill override for lost or damaged medication, lost_reserve_days
      days are held back from the days of supply one shipment carries as a standing reserve against another lost dose, never going below zero; when no such
      lost-or-damaged override exists but a fill of either prescription was dispensed in that period under a travel override, they are multiplied by travel_reserve_pct
      percent and rounded down to a whole day; otherwise they are used in full.'
    replacements_12m: 'Replacement shipments lengthen the delivery room: when two or more replacement shipments were released on the subscription in the
      last twelve months, the delivery room is replacement_multi_lead_days days; when exactly one was released in that period, it is replacement_single_lead_days
      days; otherwise it is the program''s delivery_days_after_ship.'
    delivery_lead_days: 'Replacement shipments lengthen the delivery room: when two or more replacement shipments were released on the subscription in the
      last twelve months, the delivery room is replacement_multi_lead_days days; when exactly one was released in that period, it is replacement_single_lead_days
      days; otherwise it is the program''s delivery_days_after_ship.'
    customer_skips_12m: 'Customer-requested skips lengthen the dosing days between shipments: two or more skips the customer requested on the subscription
      in the last twelve months add skip_multi_days days, exactly one adds skip_single_days days, and none adds no days.'
    skip_stretch_days: 'Customer-requested skips lengthen the dosing days between shipments: two or more skips the customer requested on the subscription
      in the last twelve months add skip_multi_days days, exactly one adds skip_single_days days, and none adds no days.'
    ship_now_12m: 'Ship-now shipments shorten the dosing days between shipments: two or more ship-now shipments charged on the subscription in the last
      twelve months take away shipnow_multi_days days, exactly one takes away shipnow_single_days days, and none takes away no days.'
    ship_now_pull_days: 'Ship-now shipments shorten the dosing days between shipments: two or more ship-now shipments charged on the subscription in the
      last twelve months take away shipnow_multi_days days, exactly one takes away shipnow_single_days days, and none takes away no days.'
    outside_fills_12m: 'Fills ordered outside the Autoship shorten the dosing days between shipments: two or more one-time-order fills of the linked prescription,
      or of the prescription it renewed, dispensed in the last twelve months take away outside_multi_days days, exactly one takes away outside_single_days
      days, and none takes away no days.'
    outside_fill_pull_days: 'Fills ordered outside the Autoship shorten the dosing days between shipments: two or more one-time-order fills of the linked
      prescription, or of the prescription it renewed, dispensed in the last twelve months take away outside_multi_days days, exactly one takes away outside_single_days
      days, and none takes away no days.'
    panels_recent: 'An aging recheck shortens the dosing days between shipments, counting blood panels redeemed less those voided on the plan in the same
      period: when no blood panel was redeemed on any of the customer''s wellness plans in the last panel_window_months months, panel_none_days days are
      taken away; when one was redeemed in that period but none in the last panel_recent_months months, panel_aging_days days are taken away; otherwise
      no days are taken away.'
    panels_year: 'An aging recheck shortens the dosing days between shipments, counting blood panels redeemed less those voided on the plan in the same
      period: when no blood panel was redeemed on any of the customer''s wellness plans in the last panel_window_months months, panel_none_days days are
      taken away; when one was redeemed in that period but none in the last panel_recent_months months, panel_aging_days days are taken away; otherwise
      no days are taken away.'
    panel_pull_days: 'An aging recheck shortens the dosing days between shipments, counting blood panels redeemed less those voided on the plan in the same
      period: when no blood panel was redeemed on any of the customer''s wellness plans in the last panel_window_months months, panel_none_days days are
      taken away; when one was redeemed in that period but none in the last panel_recent_months months, panel_aging_days days are taken away; otherwise
      no days are taken away.'
    interval_days: 'The dosing days between shipments are worked out in this order: the usable days of supply one shipment carries, plus the skip days,
      less the delivery room, less the ship-now days, less the outside-fill days, less the recheck days.'
    result: The weeks between shipments are the dosing days divided by week_days, rounded down to a whole week, and never fewer than the program's min_frequency_weeks
      nor more than its max_frequency_weeks.
  factors:
  - id: dose_loss_reserve
    effect: method
    decides: usable_supply_days
    bindings:
    - lost_overrides_12m
    - travel_overrides_12m
    - usable_supply_days
    ladder:
    - when: a fill of the linked prescription or of the prescription it renewed was dispensed in the last twelve months under a lost-or-damaged early-refill
        override
      method: lost_reserve_days days are held back from the days of supply one shipment carries, never below zero
    - when: no lost-or-damaged override in that period, but a fill of either prescription was dispensed in the last twelve months under a travel override
      method: the days of supply one shipment carries are multiplied by travel_reserve_pct percent and rounded down to a whole day
    - when: otherwise
      method: the days of supply one shipment carries are used in full
    baseline:
      usable_supply_days: shipment_supply_days
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: replacement_delivery_lead
    effect: parameter
    decides: delivery_lead_days
    bindings:
    - replacements_12m
    - delivery_lead_days
    ladder:
    - when: two or more replacement shipments released on the subscription in the last twelve months
      value: K('replacement_multi_lead_days')
    - when: exactly one replacement shipment released on the subscription in the last twelve months
      value: K('replacement_single_lead_days')
    - when: otherwise
      value: P('delivery_days_after_ship')
    baseline:
      delivery_lead_days: P('delivery_days_after_ship')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: skip_stretch
    effect: parameter
    decides: skip_stretch_days
    bindings:
    - customer_skips_12m
    - skip_stretch_days
    ladder:
    - when: two or more customer-requested skips on the subscription in the last twelve months
      value: K('skip_multi_days')
    - when: exactly one customer-requested skip on the subscription in the last twelve months
      value: K('skip_single_days')
    - when: otherwise
      value: 0 days
    baseline:
      skip_stretch_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: ship_now_pull
    effect: parameter
    decides: ship_now_pull_days
    bindings:
    - ship_now_12m
    - ship_now_pull_days
    ladder:
    - when: two or more ship-now shipments charged on the subscription in the last twelve months
      value: K('shipnow_multi_days')
    - when: exactly one ship-now shipment charged on the subscription in the last twelve months
      value: K('shipnow_single_days')
    - when: otherwise
      value: 0 days
    baseline:
      ship_now_pull_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: outside_fill_pull
    effect: parameter
    decides: outside_fill_pull_days
    bindings:
    - outside_fills_12m
    - outside_fill_pull_days
    ladder:
    - when: two or more one-time-order fills of the linked prescription or the prescription it renewed in the last twelve months
      value: K('outside_multi_days')
    - when: exactly one such one-time-order fill in the last twelve months
      value: K('outside_single_days')
    - when: otherwise
      value: 0 days
    baseline:
      outside_fill_pull_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: lab_recheck_pull
    effect: parameter
    decides: panel_pull_days
    bindings:
    - panels_recent
    - panels_year
    - panel_pull_days
    ladder:
    - when: no blood panel redeemed (less any voided) on any of the customer's wellness plans in the last panel_window_months months
      value: K('panel_none_days')
    - when: a blood panel redeemed in the last panel_window_months months but none in the last panel_recent_months months
      value: K('panel_aging_days')
    - when: otherwise
      value: 0 days
    baseline:
      panel_pull_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: vet
