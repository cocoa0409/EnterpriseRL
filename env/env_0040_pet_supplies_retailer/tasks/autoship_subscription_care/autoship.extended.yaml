      in the last six months take away shipnow_multi_days days, exactly one takes away shipnow_single_days days, and none takes away no days.'
    ship_now_pull_days: 'Ship-now shipments shorten the days between shared household food shipments: two or more ship-now shipments charged on the subscription
      in the last six months take away shipnow_multi_days days, exactly one takes away shipnow_single_days days, and none takes away no days.'
    outside_food_orders: 'Food bought outside the Autoship shortens the days between shared household food shipments: two or more one-time order lines of
      food charged to the customer in the last outside_window_months months take away outside_multi_days days, exactly one takes away outside_single_days
      days, and none takes away no days.'
    outside_food_pull_days: 'Food bought outside the Autoship shortens the days between shared household food shipments: two or more one-time order lines
      of food charged to the customer in the last outside_window_months months take away outside_multi_days days, exactly one takes away outside_single_days
      days, and none takes away no days.'
    diet_start_age_days: 'The leaving pet still eats some household food while it switches: when the customer''s active Rx Prescription Diet prescription
