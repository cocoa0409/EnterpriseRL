- id: autoship_ext_rx_shipment_packages
  base_policy_refs: &id001
  - autoship_change_rules
  overwrite: []
  trigger: state_due
  subject:
  - autoship_modify
  computes: quantity
  target_tool: set_rx_shipment_packages_d23afb64
  params:
    standard_supply_days: 30
    loyalty_top_days: 60
    loyalty_mid_days: 30
    loyalty_top_tenure_days: 365
    loyalty_mid_tenure_days: 180
    steady_full_days: 42
    steady_part_days: 35
    renewal_recent_days: 90
    renewal_recent_holdback_days: 21
    renewal_older_days: 180
    renewal_older_holdback_days: 7
    decline_multi_holdback_days: 14
    decline_single_holdback_days: 10
    recheck_block_days: 14
  rule: 'This rule sets the package count per shipment of an Autoship Pharmacy or Autoship Compounded Pharmacy subscription, written as the subscription''s
    quantity, whenever that count is re-set under the prescription the subscription is linked to. Once a renewed prescription has been linked to a pharmacy
    Autoship, the package count of that subscription is due to be re-set under the renewed prescription, whether or not the customer raises it. The package
    count is planned from the supply days a pharmacy Autoship shipment is planned to carry, and a standard shipment is planned to carry standard_supply_days
    days of supply. One package lasts the linked prescription''s days'' supply per fill divided by its packages per fill. The package count is the planned
    supply days divided by the days one package lasts, rounded up to a whole package, and never less than one package. The package count never exceeds the
    packages that one fill of the linked prescription authorizes, the program''s max_quantity_per_shipment, or the whole number of packages whose combined
    days of supply fit within the program''s rx_max_days_supply_per_shipment. Extended supply for established members adds days to the planned supply days:
    a customer whose rewards membership in status active is Pals Rewards VIP or any Tailwise Plus tier, and whose pharmacy Autoship was enrolled at least
    loyalty_top_tenure_days days before the re-set, adds loyalty_top_days days; a customer whose rewards membership in status active is Pals Rewards Insider,
    and whose pharmacy Autoship was enrolled at least loyalty_mid_tenure_days days before the re-set, adds loyalty_mid_days days; every other customer adds
    no days. A steady refill record on the subscription adds days to the planned supply days: four or more scheduled shipments charged in the last twelve
    months add steady_full_days days, two or three such shipments add steady_part_days days, and fewer than two add no days; ship-now shipments never count
    toward the record. A recently renewed prescription holds back days from the planned supply days until the pet''s recheck: when the linked prescription
    came to the pharmacy as a renewal and its authorization was recorded no more than renewal_recent_days days before the re-set, renewal_recent_holdback_days
    days are held back; when it came as a renewal and its authorization was recorded more than renewal_recent_days but no more than renewal_older_days days
    before the re-set, renewal_older_holdback_days days are held back; a prescription that is not a renewal, or whose renewal is older, holds back no days.
    Declined payments hold back days from the planned supply days: two or more declined payment attempts on the subscription in the last six months hold
    back decline_multi_holdback_days days, exactly one declined attempt in that period holds back decline_single_holdback_days days, and none holds back
    no days. The planned supply days are worked out in this order: the standard supply days, plus the extended-supply days, plus the steady-record days,
    less the renewal hold-back days, less the declined-payment hold-back days. For a pet on a senior wellness plan the planned supply days are counted on
    the pet''s recheck cycle before they are turned into packages: when the pet linked to the subscription holds a Senior Cat Wellness Plan or Senior Dog
    Wellness Plan in status active and the linked prescription is of class Rx Maintenance Medication, the planned supply days are cut down to whole blocks
    of recheck_block_days days; when the pet holds such a senior plan and the linked prescription is of any other class, the planned supply days are capped
    at the days left from the day of the re-set to the last day of that wellness plan''s current term, when the plan''s annual exam falls; for every other
    pet the planned supply days are used as worked out. A record counts as dated in the last N months when its date is later than the same calendar day
    N months before the day the value is worked out, so a record dated exactly N months earlier does not count; a record dated between six and twelve months
    ago is one dated in the last twelve months but not in the last six months.'
  prerequisite: []
  cross_category:
  - category: member
    as: branch
    reads:
    - status
    - variant_name
    note: read-only; decides the tier of extended_supply_loyalty from the customer's member records
  - category: rx
