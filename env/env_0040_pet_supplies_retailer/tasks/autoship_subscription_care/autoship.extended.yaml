category: autoship
display_name: Tailwise Autoship
binding:
  holding_table: autoship_subscriptions
  event_tables: [autoship_events]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    billed_total_usd: billed_total
lifecycle:
  states: [pending_first_shipment, active, paused, payment_hold, rx_hold, cancelled]
  transitions:
  - from: pending_first_shipment
    to: active
    by: system
    means: the first shipment is charged and leaves the fulfillment center
  - from: pending_first_shipment
    to: payment_hold
    by: system
    means: the first shipment's payment is declined
  - from: active
    to: paused
    by: agent
    means: the customer asks to pause deliveries until a chosen date
  - from: paused
    to: active
    by: agent
    means: the customer asks to resume before the paused-until date
  - from: paused
    to: active
    by: system
    means: the paused-until date passes and the program resumes automatically
  - from: active
    to: payment_hold
    by: system
    means: a scheduled shipment's payment is declined
  - from: payment_hold
    to: active
    by: agent
    means: the customer has put a working card on file and the held shipment is charged
  - from: active
    to: rx_hold
    by: system
    means: a pharmacy shipment cannot be filled because the linked prescription is no longer active or has no refill
      left
  - from: rx_hold
    to: active
    by: system
    means: the linked prescription is active again with a fill remaining
  - from: pending_first_shipment
    to: cancelled
    by: user
    means: the customer cancels before the first shipment
  - from: active
    to: cancelled
    by: user
    means: the customer cancels the subscription
  - from: paused
    to: cancelled
    by: user
    means: the customer cancels a paused subscription
  - from: payment_hold
    to: cancelled
    by: user
    means: the customer cancels a subscription on payment hold
  - from: rx_hold
    to: cancelled
    by: user
    means: the customer cancels a subscription on prescription hold
  - from: payment_hold
    to: cancelled
    by: system
    means: the payment hold outlasts payment_hold_cancel_after_days
  - from: rx_hold
    to: cancelled
    by: system
    means: the prescription hold outlasts rx_hold_cancel_after_days
accounts:
- key: billed_total
  unit: USD
  meaning: 'net amount billed on the subscription: shipment charges book in, claim refunds book out'
parameter_schema:
  first_order_discount_pct: percent off the merchandise subtotal of the first shipment of a new-to-Autoship customer;
    number, percent
  first_order_discount_cap_usd: maximum first-shipment discount per subscription; USD
  first_order_lookback_days: a customer is new to Autoship when no Autoship shipment was charged on any of their
    subscriptions within this many calendar days before the enrollment date; integer, days
  recurring_discount_pct: percent off the merchandise subtotal of every shipment after the first; number, percent
  recurring_discount_cap_usd: maximum recurring discount per shipment; USD
  ship_now_discount_applies: whether an on-demand ship-now shipment receives the recurring discount; boolean
  coupon_stacking_allowed: whether a promotional coupon may be combined with the Autoship discount on the same shipment;
    boolean
  max_combined_discount_pct: ceiling on Autoship discount plus coupon discount as a percent of the merchandise subtotal;
    number, percent
  min_frequency_weeks: shortest delivery frequency that can be set; integer, weeks
  max_frequency_weeks: longest delivery frequency that can be set; integer, weeks
  frequency_step_weeks: frequencies must be a whole multiple of this step; integer, weeks
  change_cutoff_days: a change, skip or cancellation affects the upcoming shipment only when requested at least
    this many calendar days before its next ship date; integer, days
  max_quantity_per_shipment: maximum units of the item per shipment; integer, units
  item_swap_allowed: whether the item on an existing subscription may be swapped for another item of the same program;
    boolean
  ship_weekdays: weekdays on which a shipment of this program may leave the fulfillment center; list of weekday
    abbreviations
  pet_profile_required: whether the subscription must be linked to a pet profile on the account; boolean
  meal_plan_recalc_weight_change_pct: percent change of the pet's recorded weight from the plan's basis weight at
    which portions and box quantity are recalculated; 0 means not applicable; number, percent
  skip_limit_per_12_months: customer-requested skips allowed per subscription in any rolling 365 days; integer,
    count
  max_consecutive_skips: customer-requested skips allowed back to back without a shipment in between; integer, count
  backorder_skip_after_days: a shipment still out of stock this many calendar days after its scheduled ship date
    is skipped automatically; integer, days
  backorder_skip_counts_toward_limit: whether an automatic backorder skip counts toward the skip limits; boolean
  pause_max_days: longest pause that can be set in one request, counted from the pause request date; integer, days
  auto_resume_at_pause_end: whether a paused subscription resumes by itself on its paused-until date; boolean
  free_shipping_threshold_usd: same-day combined Autoship merchandise subtotal at or above which the standard shipping
    fee is waived; 0.00 means always waived; USD
  standard_shipping_fee_usd: standard shipping fee charged once per shipment below the threshold; USD
  heavy_item_weight_lb: shipping weight per unit at or above which the heavy-item surcharge applies; number, pounds
  heavy_item_surcharge_usd: surcharge per heavy unit shipped; never waived by the free-shipping threshold; USD
  cold_chain_required: whether the program ships refrigerated or frozen in insulated packaging; boolean
  cold_pack_fee_usd: insulated packaging fee per shipment; USD
  fresh_zone_required: whether the shipping ZIP must be inside the refrigerated delivery zone; boolean
  min_order_subtotal_usd: minimum merchandise subtotal per shipment for the program to ship; USD
  ship_now_allowed: whether the customer may trigger an extra on-demand shipment; boolean
  ship_now_min_days_since_last: minimum calendar days since the last charged shipment of the subscription before
    a ship-now shipment may be processed; integer, days
  payment_retry_attempts: automatic payment retries after the first decline on a scheduled shipment; integer, count
  payment_retry_interval_days: calendar days between automatic payment retries; integer, days
  payment_hold_cancel_after_days: calendar days a subscription may stay on payment hold before it is cancelled automatically;
    integer, days
  rx_required: whether every shipment requires a linked active prescription with a fill remaining; boolean
  rx_max_days_supply_per_shipment: largest days' supply a single pharmacy shipment may contain; 0 means not applicable;
    integer, days
  rx_hold_cancel_after_days: calendar days a subscription may stay on prescription hold before it is cancelled automatically;
    0 means not applicable; integer, days
  delivery_days_after_ship: carrier transit days the program promises after the ship date; integer, days
  damaged_claim_window_days: calendar days after the ship date within which a damaged or wrong-item claim is accepted;
    integer, days
  missing_claim_window_days: calendar days after the ship date within which a missing-shipment claim is accepted;
    integer, days
  reship_allowed: whether a free replacement shipment may be sent instead of a refund on an accepted claim; boolean
  claim_refund_method: where an accepted claim is refunded; enum original_payment | tailwise_credit
  refund_shipping_fee_on_claim: whether the shipping fee is refunded when every unit of the shipment is claimed;
    boolean
  satisfaction_guarantee: whether food and treats from the program may be refunded as a quality claim even when
    opened; boolean
  satisfaction_guarantee_window_days: calendar days after the ship date within which a quality claim is accepted;
    0 means not applicable; integer, days
  unopened_return_window_days: calendar days after the ship date within which an unopened item is refunded on return;
    0 means not returnable; integer, days
  points_multiplier: multiplier applied to the Pals Rewards base earn rate on the shipment's merchandise subtotal;
    integer
  cancellation_fee_usd: fee for cancelling a subscription; USD
