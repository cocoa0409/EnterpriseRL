      when the membership in status active is Pals Rewards VIP or Pals Rewards Insider with that same shipping record, the cushion is rewards_cushion_days
      days; otherwise the cushion is standard_cushion_days days.'
    customer_skips_6m: 'Customer-requested skips take days off the covered days: two or more skips the customer requested on the subscription in the last
      six months take skip_multi_trim_days days off, exactly one takes skip_single_trim_days days off, and none takes no days off.'
    skip_trim_days: 'Customer-requested skips take days off the covered days: two or more skips the customer requested on the subscription in the last six
      months take skip_multi_trim_days days off, exactly one takes skip_single_trim_days days off, and none takes no days off.'
    own_pet_plan: 'The existing pet''s life stage changes the covered days: when that pet holds a Senior Dog Wellness Plan or Senior Cat Wellness Plan in
      status active, senior_trim_days days come off; when it holds a Puppy Wellness Plan or Kitten Wellness Plan in status active, the days coming off are
      young_trim_days, which adds days; otherwise no days come off.'
    life_stage_trim_days: 'The existing pet''s life stage changes the covered days: when that pet holds a Senior Dog Wellness Plan or Senior Cat Wellness
      Plan in status active, senior_trim_days days come off; when it holds a Puppy Wellness Plan or Kitten Wellness Plan in status active, the days coming
      off are young_trim_days, which adds days; otherwise no days come off.'
    days_to_cover: 'The covered days are worked out in this order: the weeks between shipments in days, plus the cushion, less the skip days, less the life-stage
      days.'
    result: The units per shipment are those covered days divided by the days one unit lasts the existing pet, rounded up to a whole unit, never less than
      one unit and never more than the program's max_quantity_per_shipment.
  factors:
  - id: pre_rise_usage_basis
    effect: method
    decides: own_pet_weekly_units
    bindings:
    - units_6m
    - charges_12m
    - charges_6m
    - household_rose
    - own_pet_weekly_units
    ladder:
    - when: the household's usage rose in the last six months and pre_rise_min_charges or more scheduled shipments were charged between six and twelve months
        ago
      method: the existing pet's usage is the units of those shipments divided by half_year_weeks weeks
    - when: the household's usage rose in the last six months and fewer scheduled shipments were charged between six and twelve months ago
      method: the existing pet's usage is the units of those shipments divided by their number times the subscription's weeks between shipments
    - when: otherwise
      method: the existing pet's usage is the units of scheduled shipments charged in the last twelve months divided by year_weeks weeks
    baseline:
