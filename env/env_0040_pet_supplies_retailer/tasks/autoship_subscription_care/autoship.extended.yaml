    cross_difficulty: null
  - id: skip_stretch
    effect: parameter
    decides: skip_stretch_days
    bindings:
    - customer_skips_6m
    - skip_stretch_days
    ladder:
    - when: two or more customer-requested skips on the existing Autoship in the last six months
      value: K('skip_multi_days')
    - when: exactly one customer-requested skip on the existing Autoship in the last six months
      value: K('skip_single_days')
    - when: otherwise
      value: 0 days
    baseline:
      skip_stretch_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: training_treat_stretch
    effect: parameter
    decides: course_stretch_days
    bindings:
    - course_status
    - course_sessions_recent
    - course_stretch_days
    ladder:
    - when: a training enrollment in status in_progress and course_min_sessions or more of that enrollment's own sessions attended in the last course_window_months
        months
      value: K('course_active_days')
    - when: a training enrollment in status in_progress and fewer of its own sessions attended in that period
      value: K('course_light_days')
    - when: otherwise
      value: 0 days
    baseline:
      course_stretch_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: train
  - id: growing_pet_pull
    effect: parameter
    decides: growth_pull_days
    bindings:
    - young_plan
    - adult_plan_age_days
    - growth_pull_days
    ladder:
    - when: a Puppy Wellness Plan or Kitten Wellness Plan in status active
      value: K('puppy_pull_days')
    - when: no puppy or kitten plan, and an Adult Dog Wellness Plan or Adult Cat Wellness Plan in status active enrolled no more than young_adult_days days
        ago
      value: K('young_adult_pull_days')
    - when: otherwise
      value: 0 days
    baseline:
      growth_pull_days: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: vet
  - id: replacement_delivery_lead
    effect: parameter
    decides: delivery_lead_days
    bindings:
    - replacements_12m
    - delivery_lead_days
    ladder:
    - when: two or more replacement shipments released on the existing Autoship in the last twelve months
      value: K('replacement_multi_lead_days')
    - when: exactly one replacement shipment released on the existing Autoship in the last twelve months
      value: K('replacement_single_lead_days')
    - when: otherwise
      value: P('delivery_days_after_ship')
    baseline:
      delivery_lead_days: P('delivery_days_after_ship')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: ship_now_pull
    effect: parameter
    decides: ship_now_pull_days
    bindings:
    - ship_now_6m
    - ship_now_pull_days
    ladder:
    - when: two or more ship-now shipments charged on the existing Autoship in the last six months
      value: K('shipnow_multi_days')
    - when: exactly one ship-now shipment charged on the existing Autoship in the last six months
      value: K('shipnow_single_days')
    - when: otherwise
      value: 0 days
    baseline:
      ship_now_pull_days: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The household's usage of the item is the units of the existing Autoship's scheduled shipments charged in the last six months, divided by half_year_weeks
      weeks. The existing Autoship covers its own pet at its units per shipment divided by its weeks between shipments, per week. The new pet uses the household's
      usage less what the existing Autoship covers per week, and one unit lasts the new pet week_days divided by that weekly usage, in days. The days between
      the new pet's Autoship shipments are the units per shipment multiplied by the days one unit lasts the new pet, less the program's delivery_days_after_ship.
      The weeks between shipments are those days divided by week_days, rounded down to a whole week, and never fewer than the program's min_frequency_weeks
      nor more than its max_frequency_weeks.
    params:
    - half_year_weeks
    - week_days
    - delivery_days_after_ship
    - min_frequency_weeks
    - max_frequency_weeks
  inputs:
    history:
    - table: autoship_events
      aggregate: sum
      field: quantity
      within_months: 12
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: sum
      field: quantity
      within_months: 6
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 12
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 6
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: sum
      field: quantity
      within_months: 6
      filters:
        event_type: autoship_shipment_charge
    - table: autoship_events
      aggregate: sum
      field: quantity
      within_months: 3
      filters:
        event_type: autoship_shipment_charge
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 6
      filters:
        event_type: autoship_skip
        skip_reason: customer_request
    - category: train
      table: train_sessions
      aggregate: count
      field: event_date
      within_months: K('course_window_months')
      filters:
        event_type: train_session_attend
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 12
      filters:
        event_type: autoship_reship
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 6
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: ship_now
    cross_category:
    - train
    - vet
