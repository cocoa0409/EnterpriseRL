    cross_difficulty: vet
  baseline:
    rule: 'The existing pet''s usage is read from the subscription''s own record: the units of its scheduled shipments charged in the last twelve months,
      divided by year_weeks weeks, and one unit lasts that pet week_days divided by that weekly usage, in days. The days the existing pet''s re-sized Autoship
      covers are the subscription''s weeks between shipments multiplied by week_days, plus a cushion of standard_cushion_days days. The units per shipment
      are those covered days divided by the days one unit lasts the existing pet, rounded up to a whole unit, never less than one unit and never more than
      the program''s max_quantity_per_shipment.'
    params:
    - year_weeks
    - week_days
    - standard_cushion_days
    - max_quantity_per_shipment
  inputs:
    history:
    - table: autoship_events
      aggregate: sum
      field: quantity
      within_months: 12
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: sum
      field: quantity
      within_months: 6
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 12
      filters:
        event_type: autoship_shipment_charge
        shipment_kind: scheduled
    - table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 6
      filters:
        event_type: autoship_skip
        skip_reason: customer_request
    cross_category:
    - member
    - vet
- id: autoship_ext_second_pet_enrollment_interval
  base_policy_refs: *id002
  overwrite: []
  trigger: on_request
  subject:
  - autoship_enroll
  computes: frequency_weeks
  target_tool: enroll_everyday_autoship_7ae73b8d
  params:
    half_year_weeks: 26
    quarter_weeks: 13
    week_days: 7
    settled_min_charges: 3
    skip_single_days: 7
    skip_multi_days: 14
    course_active_days: 9
    course_light_days: 4
    course_min_sessions: 3
    course_window_months: 1
    puppy_pull_days: 4
    young_adult_pull_days: 2
    young_adult_days: 365
    replacement_single_lead_days: 5
    replacement_multi_lead_days: 9
    shipnow_single_days: 3
    shipnow_multi_days: 6
  rule: 'This rule sets the weeks between shipments of a new Autoship Everyday subscription that a customer opens for a pet for an item the household already
    receives on another pet''s Autoship, written as the new subscription''s frequency in weeks; the new subscription ships the same units per shipment as
    the existing Autoship carries, and its first ship date is the date the customer chooses. The weeks between shipments of a second pet''s own Autoship
    for an item the household already receives are worked out only after the existing Autoship of that item has been re-sized to its own pet''s usage. The
    household''s usage of the item is the units of the existing Autoship''s scheduled shipments charged in the last six months, divided by half_year_weeks
    weeks. The existing Autoship covers its own pet at its units per shipment divided by its weeks between shipments, per week. The new pet uses the household''s
    usage less what the existing Autoship covers per week, and one unit lasts the new pet week_days divided by that weekly usage, in days. The days between
    the new pet''s Autoship shipments are the units per shipment multiplied by the days one unit lasts the new pet, less the program''s delivery_days_after_ship.
    The weeks between shipments are those days divided by week_days, rounded down to a whole week, and never fewer than the program''s min_frequency_weeks
    nor more than its max_frequency_weeks. Once the household has settled into its larger usage, every charged unit counts: the usage rose when the average
    units per scheduled shipment charged in the last six months exceed the average units per scheduled shipment charged between six and twelve months ago,
    and it did not rise when either period has no scheduled shipment; if it rose and settled_min_charges or more scheduled shipments were charged in the
    last six months, the household''s usage is the units of all shipments charged in the last six months, ship-now shipments included, divided by half_year_weeks
    weeks; if it rose and fewer were charged, it is the units of all shipments charged in the last three months divided by quarter_weeks weeks; otherwise
    it is measured as stated. Customer-requested skips lengthen the days between the new pet''s shipments: two or more skips the customer requested on the
    existing Autoship in the last six months add skip_multi_days days, exactly one adds skip_single_days days, and none adds no days. Training treats stand
    in for part of a pet''s meals: when the customer holds a training enrollment in status in_progress and course_min_sessions or more of that enrollment''s
    own sessions were attended in the last course_window_months months, course_active_days days are added; when the enrollment is in status in_progress
    with fewer sessions attended in that period, course_light_days days are added; otherwise no days are added. A growing pet shortens the days between
    the new pet''s shipments: when the customer holds a Puppy Wellness Plan or Kitten Wellness Plan in status active, puppy_pull_days days are taken away;
    when there is no such plan but the customer holds an Adult Dog Wellness Plan or Adult Cat Wellness Plan in status active enrolled no more than young_adult_days
    days ago, young_adult_pull_days days are taken away; otherwise no days are taken away. Replacement shipments widen the delivery room: when two or more
    replacement shipments were released on the existing Autoship in the last twelve months, replacement_multi_lead_days days are taken away in place of
    the program''s delivery_days_after_ship; when exactly one was released in that period, replacement_single_lead_days days are taken away in its place;
    otherwise the program''s delivery_days_after_ship is taken away. Ship-now shipments shorten the days between the new pet''s shipments: two or more ship-now
    shipments charged on the existing Autoship in the last six months take away shipnow_multi_days days, exactly one takes away shipnow_single_days days,
    and none takes away no days. The days between the new pet''s Autoship shipments are worked out in this order: the units per shipment times the days
    one unit lasts the new pet, plus the skip days, plus the training days, less the growing-pet days, less the delivery room, less the ship-now days. A
    record counts as dated in the last N months when its date is later than the same calendar day N months before the day the value is worked out, so a
    record dated exactly N months earlier does not count; a record dated between six and twelve months ago is one dated in the last twelve months but not
    in the last six months.'
  prerequisite:
  - problem: autoship_ext_existing_pet_quantity
    kind: value_input
    gate: existing_weekly_units
    form: action
    policy_source: The weeks between shipments of a second pet's own Autoship for an item the household already receives are worked out only after the existing
      Autoship of that item has been re-sized to its own pet's usage.
    fallback_reason: Re-sizing leaves only a units-per-shipment number on the existing Autoship, which the customer could equally have set by an ordinary
      quantity change; no record marks that the existing Autoship was re-sized to its own pet's usage, so no record-visible state singles out that write.
    condition: The existing Autoship of the item carries the units per shipment worked out by the re-sizing rule for its own pet.
    resolved_by: set_shipment_quantity_8a323a9d
    effect: Once the existing Autoship is re-sized, what it covers per week (its units per shipment divided by its weeks between shipments) takes the re-sized
      count, which moves the new pet's weekly usage and so its weeks between shipments.
  cross_category:
  - category: train
    as: history
    reads:
    - event_type
    - status
    - train_sessions.event_type
    - train_enrollment_id
    note: read-only; decides the tier of training_treat_stretch from the customer's train records
  - category: vet
    as: history
    reads:
    - enrolled_on
    - status
    - variant_name
    note: read-only; decides the tier of growing_pet_pull from the customer's vet records
  compute:
  - units_12m: SUM('autoship_events','quantity', within_months=12, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - units_6m: SUM('autoship_events','quantity', within_months=6, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - charges_12m: COUNT('autoship_events', within_months=12, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - charges_6m: COUNT('autoship_events', within_months=6, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - all_units_6m: SUM('autoship_events','quantity', within_months=6, event_type='autoship_shipment_charge')
  - all_units_3m: SUM('autoship_events','quantity', within_months=3, event_type='autoship_shipment_charge')
  - household_rose: (charges_6m > 0 and charges_12m - charges_6m > 0 and units_6m / charges_6m > (units_12m - units_6m) / (charges_12m - charges_6m))
  - household_weekly_units: all_units_6m / K('half_year_weeks') if (household_rose and charges_6m >= K('settled_min_charges')) else (all_units_3m / K('quarter_weeks')
      if (household_rose and charges_6m < K('settled_min_charges')) else units_6m / K('half_year_weeks'))
  - existing_weekly_units: F('quantity') / F('frequency_weeks')
  - new_pet_weekly_units: household_weekly_units - existing_weekly_units
  - new_pet_unit_days: K('week_days') / new_pet_weekly_units
  - customer_skips_6m: COUNT('autoship_events', within_months=6, event_type='autoship_skip', skip_reason='customer_request')
  - skip_stretch_days: K('skip_multi_days') if customer_skips_6m >= 2 else (K('skip_single_days') if customer_skips_6m == 1 else 0)
  - course_status: CFIELD('train','status', status='in_progress')
  - course_sessions_recent: XCOUNT('train','train_sessions', within_months=K('course_window_months'), event_type='train_session_attend', train_enrollment_id=CFIELD('train','train_enrollment_id',
      status='in_progress'))
  - course_stretch_days: K('course_active_days') if (course_status == 'in_progress' and course_sessions_recent >= K('course_min_sessions')) else (K('course_light_days')
      if (course_status == 'in_progress' and course_sessions_recent < K('course_min_sessions')) else 0)
  - young_plan: EXISTS('vet', variant_name='Puppy Wellness Plan', status='active') or EXISTS('vet', variant_name='Kitten Wellness Plan', status='active')
  - adult_plan_age_days: MN(DAYS(CFIELD('vet','enrolled_on', variant_name='Adult Dog Wellness Plan', status='active'), NOW) if EXISTS('vet', variant_name='Adult
      Dog Wellness Plan', status='active') else 9999, DAYS(CFIELD('vet','enrolled_on', variant_name='Adult Cat Wellness Plan', status='active'), NOW) if
      EXISTS('vet', variant_name='Adult Cat Wellness Plan', status='active') else 9999)
  - growth_pull_days: K('puppy_pull_days') if young_plan else (K('young_adult_pull_days') if (not young_plan and adult_plan_age_days <= K('young_adult_days'))
      else 0)
  - replacements_12m: COUNT('autoship_events', within_months=12, event_type='autoship_reship')
  - delivery_lead_days: K('replacement_multi_lead_days') if replacements_12m >= 2 else (K('replacement_single_lead_days') if replacements_12m == 1 else
      P('delivery_days_after_ship'))
  - ship_now_6m: COUNT('autoship_events', within_months=6, event_type='autoship_shipment_charge', shipment_kind='ship_now')
  - ship_now_pull_days: K('shipnow_multi_days') if ship_now_6m >= 2 else (K('shipnow_single_days') if ship_now_6m == 1 else 0)
  - interval_days: F('quantity') * new_pet_unit_days + skip_stretch_days + course_stretch_days - growth_pull_days - delivery_lead_days - ship_now_pull_days
  - result: int(MN(P('max_frequency_weeks'), MX(P('min_frequency_weeks'), int(interval_days / K('week_days')))))
  compute_basis:
