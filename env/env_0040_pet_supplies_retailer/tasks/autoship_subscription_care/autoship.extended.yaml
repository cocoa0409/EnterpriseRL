    household_weekly_units: 'When the household''s usage rose in the last six months the current usage is measured on its new footing: the usage rose when
      scheduled shipments were charged both in the last six months and between six and twelve months ago and the average units per scheduled shipment charged
      in the last six months exceed the average units per scheduled shipment charged between six and twelve months ago, and it did not rise when either
