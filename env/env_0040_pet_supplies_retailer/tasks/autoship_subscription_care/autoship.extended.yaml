  compute:
  - rx_days_per_fill: CFIELD('rx','days_supply_per_fill', rx_prescription_id=F('rx_prescription_id'))
  - rx_packages_per_fill: CFIELD('rx','quantity_per_fill', rx_prescription_id=F('rx_prescription_id'))
  - package_days: rx_days_per_fill / rx_packages_per_fill
  - mem_tier: CFIELD('member','variant_name', status='active')
  - autoship_tenure_days: DAYS(F('enrolled_on'), NOW)
  - loyalty_supply_days: K('loyalty_top_days') if ((mem_tier == 'Pals Rewards VIP' or mem_tier == 'Tailwise Plus Monthly' or mem_tier == 'Tailwise Plus
      Annual' or mem_tier == 'Tailwise Plus Premier Annual') and autoship_tenure_days >= K('loyalty_top_tenure_days')) else (K('loyalty_mid_days') if (mem_tier
      == 'Pals Rewards Insider' and autoship_tenure_days >= K('loyalty_mid_tenure_days')) else 0)
  - scheduled_charges_12m: COUNT('autoship_events', within_months=12, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - steady_supply_days: K('steady_full_days') if scheduled_charges_12m >= 4 else (K('steady_part_days') if scheduled_charges_12m >= 2 else 0)
  - rx_origin: CFIELD('rx','origin', rx_prescription_id=F('rx_prescription_id'))
  - rx_authorized_age_days: DAYS(CFIELD('rx','authorized_on', rx_prescription_id=F('rx_prescription_id')), NOW)
  - renewal_holdback_days: K('renewal_recent_holdback_days') if (rx_origin == 'renewal' and rx_authorized_age_days <= K('renewal_recent_days')) else (K('renewal_older_holdback_days')
      if (rx_origin == 'renewal' and rx_authorized_age_days > K('renewal_recent_days') and rx_authorized_age_days <= K('renewal_older_days')) else 0)
  - declines_6m: COUNT('autoship_events', within_months=6, event_type='autoship_payment_declined')
  - decline_holdback_days: K('decline_multi_holdback_days') if declines_6m >= 2 else (K('decline_single_holdback_days') if declines_6m == 1 else 0)
  - target_supply_days: K('standard_supply_days') + loyalty_supply_days + steady_supply_days - renewal_holdback_days - decline_holdback_days
  - pet_plan: CFIELD('vet','variant_name', status='active', pet_id=F('pet_id'))
  - rx_class: CFIELD('rx','variant_name', rx_prescription_id=F('rx_prescription_id'))
  - plan_term_end: CFIELD('vet','term_end', status='active', pet_id=F('pet_id'))
  - counted_supply_days: int(target_supply_days / K('recheck_block_days')) * K('recheck_block_days') if ((pet_plan == 'Senior Cat Wellness Plan' or pet_plan
      == 'Senior Dog Wellness Plan') and rx_class == 'Rx Maintenance Medication') else (MN(target_supply_days, DAYS(NOW, plan_term_end)) if ((pet_plan ==
      'Senior Cat Wellness Plan' or pet_plan == 'Senior Dog Wellness Plan') and rx_class != 'Rx Maintenance Medication') else target_supply_days)
  - packages_needed: MX(1, -(-counted_supply_days // package_days))
  - result: int(MN(MN(P('max_quantity_per_shipment'), rx_packages_per_fill), MN(packages_needed, int(P('rx_max_days_supply_per_shipment') / package_days))))
  compute_basis:
