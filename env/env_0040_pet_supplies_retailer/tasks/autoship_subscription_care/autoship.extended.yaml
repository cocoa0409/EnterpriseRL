- id: autoship_ext_existing_pet_quantity
  base_policy_refs: *id001
  overwrite: []
  trigger: on_request
  subject:
  - autoship_modify
  computes: quantity
  target_tool: set_shipment_quantity_8a323a9d
  params:
    half_year_weeks: 26
    year_weeks: 52
    week_days: 7
    pre_rise_min_charges: 3
    standard_cushion_days: 14
    plus_cushion_days: 7
    rewards_cushion_days: 11
    member_min_charges: 3
    senior_trim_days: 2
    young_trim_days: -2
    skip_single_trim_days: 2
    skip_multi_trim_days: 4
  rule: 'This rule sets the units per shipment of a non-prescription Autoship that has been carrying food for more than one pet of the household, written
    as the subscription''s quantity, when another pet of the household gets its own Autoship for the same item and the existing subscription is re-sized
    to its own pet''s usage; the weeks between shipments stay as they are. The existing pet''s usage is read from the subscription''s own record: the units
    of its scheduled shipments charged in the last twelve months, divided by year_weeks weeks, and one unit lasts that pet week_days divided by that weekly
    usage, in days. The days the existing pet''s re-sized Autoship covers are the subscription''s weeks between shipments multiplied by week_days, plus
    a cushion of standard_cushion_days days. The units per shipment are those covered days divided by the days one unit lasts the existing pet, rounded
    up to a whole unit, never less than one unit and never more than the program''s max_quantity_per_shipment. When the household''s usage rose in the last
    six months the existing pet''s usage is read from the shipments before the rise: the usage rose when scheduled shipments were charged both in the last
    six months and between six and twelve months ago and the average units per scheduled shipment charged in the last six months exceed the average units
    per scheduled shipment charged between six and twelve months ago, and it did not rise when either period has no scheduled shipment; if it rose and pre_rise_min_charges
    or more scheduled shipments were charged between six and twelve months ago, the existing pet''s usage is the units of those shipments divided by half_year_weeks
    weeks; if it rose and fewer were charged in that period, it is the units of those shipments divided by their number multiplied by the subscription''s
    weeks between shipments, so each of them is taken to have lasted one interval; otherwise it is read from the last twelve months as stated. The cushion
    follows the customer''s rewards membership and shipping record: when the membership in status active is a Tailwise Plus tier and member_min_charges
    or more scheduled shipments of the subscription were charged in the last twelve months, the cushion is plus_cushion_days days; when the membership in
    status active is Pals Rewards VIP or Pals Rewards Insider with that same shipping record, the cushion is rewards_cushion_days days; otherwise the cushion
    is standard_cushion_days days. Customer-requested skips take days off the covered days: two or more skips the customer requested on the subscription
    in the last six months take skip_multi_trim_days days off, exactly one takes skip_single_trim_days days off, and none takes no days off. The existing
    pet''s life stage changes the covered days: when that pet holds a Senior Dog Wellness Plan or Senior Cat Wellness Plan in status active, senior_trim_days
    days come off; when it holds a Puppy Wellness Plan or Kitten Wellness Plan in status active, the days coming off are young_trim_days, which adds days;
    otherwise no days come off. The covered days are worked out in this order: the weeks between shipments in days, plus the cushion, less the skip days,
    less the life-stage days. A record counts as dated in the last N months when its date is later than the same calendar day N months before the day the
    value is worked out, so a record dated exactly N months earlier does not count; a record dated between six and twelve months ago is one dated in the
    last twelve months but not in the last six months.'
  prerequisite: []
  cross_category:
  - category: member
    as: branch
    reads:
    - status
    - variant_name
    note: read-only; decides the tier of member_cushion from the customer's member records
  - category: vet
    as: history
    reads:
    - pet_id
