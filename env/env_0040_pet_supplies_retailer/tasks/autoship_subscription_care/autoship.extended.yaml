- id: autoship_ext_household_interval
  base_policy_refs: *id001
  overwrite: []
  trigger: on_request
  subject:
  - autoship_modify
  computes: frequency_weeks
  target_tool: set_shipment_interval_36e38cde
  params:
    half_year_weeks: 26
    week_days: 7
    skip_single_days: 14
    skip_multi_days: 21
    young_growth_days: 7
    adult_growth_days: 3
    young_adult_days: 365
    shipnow_single_days: 2
    shipnow_multi_days: 4
    outside_single_days: 3
    outside_multi_days: 6
    outside_window_months: 2
    diet_recent_days: 30
    diet_older_days: 90
    diet_recent_overlap_days: 4
    diet_older_overlap_days: 2
    year_weeks: 52
  rule: 'This rule sets the weeks between shipments of a non-prescription food Autoship that feeds more than one pet of the household, written as the subscription''s
    frequency in weeks, when a pet that ate from it moves to a prescription diet and the subscription is re-timed for the pets that stay on it; the units
    per shipment stay as they are. The pet that leaves is counted at the household''s usage of the six months before the last six months: the units of the
    subscription''s scheduled shipments charged between six and twelve months ago, divided by half_year_weeks weeks. The household''s current usage is the
    units of the subscription''s scheduled shipments charged in the last twelve months, divided by year_weeks weeks. The pets that stay use the household''s
    current usage less the leaving pet''s usage, and one unit lasts them week_days divided by that weekly usage, in days. The days between shared household
    food shipments are the subscription''s units per shipment multiplied by the days one unit lasts the pets that stay. The weeks between shipments are
    those days divided by week_days, rounded down to a whole week, and never fewer than the program''s min_frequency_weeks nor more than its max_frequency_weeks.
    When the household''s usage rose in the last six months the current usage is measured on its new footing: the usage rose when scheduled shipments were
    charged both in the last six months and between six and twelve months ago and the average units per scheduled shipment charged in the last six months
    exceed the average units per scheduled shipment charged between six and twelve months ago, and it did not rise when either period has no scheduled shipment;
    if it rose and the latest scheduled shipment charged carried the units per shipment the subscription holds now, the current usage is the units that
    latest scheduled shipment carried divided by the weeks it was booked to cover, which are the days from its charge date to the subscription''s next ship
    date divided by week_days; if it rose and the latest scheduled shipment charged carried a different number of units, the current usage is the units
    of scheduled shipments charged in the last six months divided by half_year_weeks weeks; otherwise it is measured over the last twelve months as stated.
    Customer-requested skips lengthen the days between shared household food shipments: two or more skips the customer requested on the subscription in
    the last twelve months add skip_multi_days days, exactly one adds skip_single_days days, and none adds no days. A growing pet in the household shortens
    the days between shared household food shipments: when the customer holds a Kitten Wellness Plan or Puppy Wellness Plan in status active, young_growth_days
    days are taken away; when there is no such plan but the customer holds an Adult Cat Wellness Plan or Adult Dog Wellness Plan in status active enrolled
    no more than young_adult_days days ago, adult_growth_days days are taken away; otherwise no days are taken away. Ship-now shipments shorten the days
    between shared household food shipments: two or more ship-now shipments charged on the subscription in the last six months take away shipnow_multi_days
    days, exactly one takes away shipnow_single_days days, and none takes away no days. Food bought outside the Autoship shortens the days between shared
    household food shipments: two or more one-time order lines of food charged to the customer in the last outside_window_months months take away outside_multi_days
    days, exactly one takes away outside_single_days days, and none takes away no days. The leaving pet still eats some household food while it switches:
    when the customer''s active Rx Prescription Diet prescription was authorized no more than diet_recent_days days ago, diet_recent_overlap_days days are
    taken away; when it was authorized more than diet_recent_days but no more than diet_older_days days ago, diet_older_overlap_days days are taken away;
    otherwise no days are taken away. The days between shared household food shipments are worked out in this order: the units per shipment times the days
    one unit lasts the pets that stay, plus the skip days, less the growing-pet days, less the ship-now days, less the outside-food days, less the switching
    days. A record counts as dated in the last N months when its date is later than the same calendar day N months before the day the value is worked out,
    so a record dated exactly N months earlier does not count; a record dated between six and twelve months ago is one dated in the last twelve months but
    not in the last six months.'
  prerequisite: []
  cross_category:
  - category: order
    as: history
    reads:
    - event_type
    - item_category
    - order_events.event_type
    note: read-only; decides the tier of outside_food_pull from the customer's order records
  - category: rx
    as: history
    reads:
    - authorized_on
    - status
    - variant_name
    note: read-only; decides the tier of diet_switch_overlap from the customer's rx records
  - category: vet
    as: history
    reads:
    - enrolled_on
    - status
    - variant_name
    note: read-only; decides the tier of growing_pet_pull from the customer's vet records
  compute:
  - units_12m: SUM('autoship_events','quantity', within_months=12, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - units_6m: SUM('autoship_events','quantity', within_months=6, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - charges_12m: COUNT('autoship_events', within_months=12, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - charges_6m: COUNT('autoship_events', within_months=6, event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - departing_weekly_units: (units_12m - units_6m) / K('half_year_weeks')
  - latest_sched_units: LATEST('autoship_events','quantity', event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - latest_sched_date: LATEST('autoship_events','event_date', event_type='autoship_shipment_charge', shipment_kind='scheduled')
  - household_rose: (charges_6m > 0 and charges_12m - charges_6m > 0 and units_6m / charges_6m > (units_12m - units_6m) / (charges_12m - charges_6m))
  - household_weekly_units: latest_sched_units / (DAYS(latest_sched_date, F('next_ship_date')) / K('week_days')) if (household_rose and latest_sched_units
      == F('quantity')) else (units_6m / K('half_year_weeks') if (household_rose and latest_sched_units != F('quantity')) else units_12m / K('year_weeks'))
  - remaining_weekly_units: household_weekly_units - departing_weekly_units
  - unit_days: K('week_days') / remaining_weekly_units
  - customer_skips_12m: COUNT('autoship_events', within_months=12, event_type='autoship_skip', skip_reason='customer_request')
  - skip_stretch_days: K('skip_multi_days') if customer_skips_12m >= 2 else (K('skip_single_days') if customer_skips_12m == 1 else 0)
  - young_plan: EXISTS('vet', variant_name='Kitten Wellness Plan', status='active') or EXISTS('vet', variant_name='Puppy Wellness Plan', status='active')
  - adult_plan_age_days: MN(DAYS(CFIELD('vet','enrolled_on', variant_name='Adult Cat Wellness Plan', status='active'), NOW) if EXISTS('vet', variant_name='Adult
      Cat Wellness Plan', status='active') else 9999, DAYS(CFIELD('vet','enrolled_on', variant_name='Adult Dog Wellness Plan', status='active'), NOW) if
      EXISTS('vet', variant_name='Adult Dog Wellness Plan', status='active') else 9999)
  - growth_pull_days: K('young_growth_days') if young_plan else (K('adult_growth_days') if (not young_plan and adult_plan_age_days <= K('young_adult_days'))
      else 0)
  - ship_now_6m: COUNT('autoship_events', within_months=6, event_type='autoship_shipment_charge', shipment_kind='ship_now')
  - ship_now_pull_days: K('shipnow_multi_days') if ship_now_6m >= 2 else (K('shipnow_single_days') if ship_now_6m == 1 else 0)
  - outside_food_orders: XCOUNT('order','order_events', within_months=K('outside_window_months'), event_type='order_line_charge', item_category='food')
  - outside_food_pull_days: K('outside_multi_days') if outside_food_orders >= 2 else (K('outside_single_days') if outside_food_orders == 1 else 0)
  - diet_start_age_days: DAYS(CFIELD('rx','authorized_on', variant_name='Rx Prescription Diet', status='active'), NOW) if EXISTS('rx', variant_name='Rx
      Prescription Diet', status='active') else 9999
  - diet_overlap_days: K('diet_recent_overlap_days') if diet_start_age_days <= K('diet_recent_days') else (K('diet_older_overlap_days') if diet_start_age_days
      <= K('diet_older_days') else 0)
  - interval_days: F('quantity') * unit_days + skip_stretch_days - growth_pull_days - ship_now_pull_days - outside_food_pull_days - diet_overlap_days
  - result: int(MN(P('max_frequency_weeks'), MX(P('min_frequency_weeks'), int(interval_days / K('week_days')))))
  compute_basis:
    units_12m: The household's current usage is the units of the subscription's scheduled shipments charged in the last twelve months, divided by year_weeks
      weeks.
    units_6m: The household's current usage is the units of the subscription's scheduled shipments charged in the last twelve months, divided by year_weeks
      weeks.
    charges_12m: 'When the household''s usage rose in the last six months the current usage is measured on its new footing: the usage rose when scheduled
      shipments were charged both in the last six months and between six and twelve months ago and the average units per scheduled shipment charged in the
      last six months exceed the average units per scheduled shipment charged between six and twelve months ago, and it did not rise when either period
      has no scheduled shipment; if it rose and the latest scheduled shipment charged carried the units per shipment the subscription holds now, the current
      usage is the units that latest scheduled shipment carried divided by the weeks it was booked to cover, which are the days from its charge date to
      the subscription''s next ship date divided by week_days; if it rose and the latest scheduled shipment charged carried a different number of units,
      the current usage is the units of scheduled shipments charged in the last six months divided by half_year_weeks weeks; otherwise it is measured over
      the last twelve months as stated.'
    charges_6m: 'When the household''s usage rose in the last six months the current usage is measured on its new footing: the usage rose when scheduled
      shipments were charged both in the last six months and between six and twelve months ago and the average units per scheduled shipment charged in the
      last six months exceed the average units per scheduled shipment charged between six and twelve months ago, and it did not rise when either period
      has no scheduled shipment; if it rose and the latest scheduled shipment charged carried the units per shipment the subscription holds now, the current
      usage is the units that latest scheduled shipment carried divided by the weeks it was booked to cover, which are the days from its charge date to
      the subscription''s next ship date divided by week_days; if it rose and the latest scheduled shipment charged carried a different number of units,
