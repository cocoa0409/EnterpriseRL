      anchor_event: the appointment's start time
      anchor_source: groom_events.appointment_date
      relation: not_after
      duration_source: variants.free_cancel_notice_hours
      unit: elapsed_hours
      counting_rule: Notice is counted in full elapsed hours from the moment the cancellation is recorded to the
        appointment date and start time in salon local time; notice of exactly free_cancel_notice_hours is free.
      boundary: inclusive
