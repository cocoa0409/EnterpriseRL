- id: groom_cancellation_no_show
  subject: [groom_appointment_cancel, groom_late_cancel_fee, groom_visit_forfeit, groom_no_show]
  rule: A customer may cancel or reschedule a booking; a reschedule is a cancellation of the old slot plus a new
    booking. A cancellation is free only if it is recorded at least free_cancel_notice_hours before the appointment's
    start time. Notice is counted in full elapsed hours from the moment the cancellation is recorded to the appointment
    date and start time in salon local time; notice of exactly free_cancel_notice_hours is free. A late cancellation
    carries late_cancel_fee_usd, or, where late_cancel_forfeits_visit is true, forfeits one visit instead of the
    fee; the remedy is recorded on the cancellation. A booking the pet misses, or reaches more than late_arrival_grace_minutes
    late, is a no-show and, where no_show_forfeits_visit is true, forfeits one visit; no fee is added on top. A
    cancellation by the salon (staff illness, closure) is never late and never forfeits anything. A fee or forfeit
    is never charged twice for the same booking.
