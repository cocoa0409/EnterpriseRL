events:
- type: groom_pass_purchase
  target: groom_passes
  mutation: create
  meaning: a customer buys a grooming pass or joins Groom Club Monthly for one pet
  grain: one row per pass
  fields:
    groom_pass_id: new id
    customer_id: owner
    pet_id: pet
    variant_name: pass
    size_class_at_purchase: size class
    purchase_channel: salon or online
    store_id: salon
    price_paid_usd: amount paid
    discount_kind: discount applied
    purchased_on: date
    expires_on: expiry
    next_billing_date: club billing date
    visits_purchased: visits credited
    visits_remaining: visits credited
    extension_used: 'false'
  account: visits
  direction: in
  triggers:
  - event: member:member_points_earn
    map:
      event_date: purchased_on
      source_category: groom
      source_event_id: groom_pass_id
      qualifying_spend_usd: price_paid_usd
- type: groom_appointment_book
  target: groom_events
  meaning: a grooming appointment is booked on the pass
  grain: one row per booked appointment slot
  distinguish_by: [appointment_date, appointment_time]
  fields:
    event_date: booking date
    pet_id: pet
    store_id: salon
    appointment_date: date
    appointment_time: start time
    addon_code: add-on requested
  triggers: []
- type: groom_appointment_cancel
  target: groom_events
  meaning: a booked appointment is cancelled or rescheduled away by the customer
  grain: one row per cancelled booking
  distinguish_by: [original_event_id]
  fields:
    event_date: cancellation date
    original_event_id: booking cancelled
    appointment_date: date of the cancelled slot
    appointment_time: its start time
    notice_hours: full hours of notice
    late_cancel_remedy: none, fee or forfeit
  triggers:
  - event: groom:groom_late_cancel_fee
    when:
      late_cancel_remedy: fee
    map:
      original_event_id: original_event_id
      appointment_date: appointment_date
  - event: groom:groom_visit_forfeit
    when:
      late_cancel_remedy: forfeit
    map:
      original_event_id: original_event_id
      appointment_date: appointment_date
- type: groom_visit_complete
  target: groom_events
  meaning: a booked visit is performed and checked out
  grain: one row per completed visit
  distinguish_by: [appointment_date, appointment_time]
  fields:
    event_date: visit date
    pet_id: pet
    store_id: salon
    appointment_date: appointment date
    appointment_time: start time
    addon_code: add-on performed
    coat_surcharge_usd: coat surcharge
    dematting_minutes: dematting minutes
    dematting_fee_usd: dematting fee
    handling_surcharge_usd: handling surcharge
    addon_fee_usd: add-on fee
    shave_down_fee_usd: shave-down fee
    size_difference_usd: size difference
    amount_usd: total charged at checkout
    visits_delta: '1'
    visits_remaining_after: visits left
    minutes_late: minutes late on arrival
    original_event_id: the booking
  account: visits
  direction: out
  triggers:
  - event: groom:groom_exhaust
    when: {visits_remaining_after: 0}
  - event: member:member_points_earn
    map:
      event_date: event_date
      source_category: groom
      source_event_id: groom_event_id
      qualifying_spend_usd: amount_usd
- type: groom_no_show
  target: groom_events
  meaning: the pet did not arrive, or arrived after the grace period, for a booked appointment
  grain: one row per missed booking
  distinguish_by: [original_event_id]
  fields:
    event_date: appointment date
    original_event_id: booking missed
    appointment_date: date
    minutes_late: minutes late, 0 if never arrived
    visits_delta: 1 when a visit is forfeited
    visits_remaining_after: visits left
  account: visits
  direction: out
  triggers:
  - event: groom:groom_exhaust
    when: {visits_remaining_after: 0}
- type: groom_late_cancel_fee
  target: groom_events
  meaning: a late-cancellation fee is charged for a cancelled booking
  grain: one row per late-cancelled booking
  distinguish_by: [original_event_id]
  fields:
    event_date: charge date
    original_event_id: booking
    appointment_date: date of the cancelled slot
    amount_usd: fee charged
  triggers: []
- type: groom_visit_forfeit
  target: groom_events
  meaning: a visit is forfeited for a late cancellation
  grain: one row per late-cancelled booking
  distinguish_by: [original_event_id]
  fields:
    event_date: forfeit date
    original_event_id: booking
    appointment_date: date of the cancelled slot
    visits_delta: '1'
    visits_remaining_after: visits left
  account: visits
  direction: out
  triggers:
  - event: groom:groom_exhaust
    when: {visits_remaining_after: 0}
- type: groom_redo
  target: groom_events
  meaning: a free redo of a completed visit is performed
  grain: one row per redo of one visit
  distinguish_by: [original_event_id]
  fields:
    event_date: redo date
    original_event_id: visit redone
    appointment_date: redo appointment date
    appointment_time: start time
    store_id: salon
  triggers: []
- type: groom_club_billing
  target: groom_events
  meaning: the Groom Club Monthly fee is charged and the month's visit is credited
  grain: one row per billing month
  distinguish_by: [billing_month]
  fields:
    event_date: billing date
    billing_month: month billed
    amount_usd: monthly fee
    visits_delta: visits credited
    visits_remaining_after: visits after the credit
  account: visits
  direction: in
  triggers:
  - event: member:member_points_earn
    map:
      event_date: event_date
      source_category: groom
      source_event_id: groom_event_id
      qualifying_spend_usd: amount_usd
- type: groom_club_payment_declined
  target: groom_events
  meaning: the monthly fee could not be collected after the retry days
  grain: one row per billing month declined
  distinguish_by: [billing_month]
  fields:
    event_date: date
    billing_month: month
    amount_usd: fee attempted
  triggers:
  - event: groom:groom_suspend
- type: groom_suspend
  target: groom_passes
  mutation:
    transition:
      from: active
      to: suspended
  meaning: Groom Club Monthly is suspended for non-payment
  grain: one transition per suspension
  fields:
    next_billing_date: unchanged
  triggers: []
- type: groom_reinstate
  target: groom_passes
  mutation:
    transition:
      from: suspended
      to: active
  meaning: a suspended club is reinstated once the overdue fee is paid
  grain: one transition per reinstatement
  fields:
    next_billing_date: one month after the overdue billing date
  triggers:
  - event: groom:groom_club_billing
- type: groom_exhaust
  target: groom_passes
  mutation:
    transition:
      from: active
      to: exhausted
  meaning: a prepaid pass has no visits left
  grain: one transition per pass
  fields:
    closed_on: date
  triggers: []
- type: groom_expire
  target: groom_passes
  mutation:
    transition:
      from: active
      to: expired
  meaning: a prepaid pass passes its expiry date and its unused visits lapse
  grain: one transition per pass
  fields:
    closed_on: expires_on plus one day
    visits_remaining: set to 0
  account: visits
  direction: out
  triggers: []
- type: groom_pass_cancel
  target: groom_passes
  mutation:
    transition:
    - from: active
      to: cancelled
    - from: suspended
      to: cancelled
  meaning: the customer cancels a pass or Groom Club Monthly
  grain: one transition per pass
  fields:
    closed_on: effective date
  triggers:
  - event: groom:groom_pass_refund
- type: groom_pass_refund
  target: groom_events
  meaning: unused visits of a cancelled pass are refunded, or a club early termination is settled
  grain: one row per cancelled pass
  distinguish_by: [event_date]
  fields:
    event_date: refund date
    visits_delta: unused visits removed
    visits_remaining_after: '0'
    amount_usd: refund (0.00 when nothing is due)
    refund_method: original_payment
  account: visits
  direction: out
  triggers: []
- type: groom_pass_transfer
  target: groom_passes
  mutation: update
  meaning: remaining visits are moved to another pet of the same customer
  grain: one row per transfer
  fields:
    pet_id: new pet
  triggers: []
- type: groom_expiry_extension
  target: groom_passes
  mutation: update
  meaning: the one-time expiry extension is granted
  grain: one row per pass
  fields:
    expires_on: extended expiry
    extension_used: 'true'
  triggers: []
measures:
- id: groom_msr_open_bookings
  window: bookings on the pass with appointment_date on or after today
  measure: count of groom_appointment_book rows of the pass not referred to by any groom_appointment_cancel, groom_visit_complete
    or groom_no_show row
- id: groom_msr_redos_of_visit
  window: life of the visit
  measure: count of groom_redo rows whose original_event_id is the visit
- id: groom_msr_billed_months
  window: life of the club
  measure: count of groom_club_billing rows of the pass
- id: groom_msr_visits_used
  window: life of the pass
  measure: count of groom_visit_complete, groom_no_show and groom_visit_forfeit rows of the pass with visits_delta
    1
policies:
- id: groom_agg_multi_holding
  subject: [groom_pass_purchase]
  rule: 'A customer may hold one live grooming pass per pet and passes for as many pets as they have. No other pass
    of the same customer for the same pet is in status active or suspended. A second pass for the same pet is sold
    only once the current one is exhausted, expired or cancelled; buying ahead is not offered. Passes of different
    pets are never pooled: a visit is always redeemed from the serviced pet''s own pass.'
  eligibility:
  - id: one_live_pass_per_pet
    applies_to: [groom_pass_purchase]
    kind: dedup
    condition: No other pass of the same customer for the same pet is in status active or suspended.
    evidence_fields: [groom_passes.customer_id, groom_passes.pet_id, groom_passes.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [groom_passes.pet_id]
      action_bindings:
        groom_passes.pet_id: pet_id
    dedup_contract:
      table: groom_passes
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        pet_id: pet_id
      duplicate_filters:
        status: [active, suspended]
      distinct_fields: []
  params:
    max_per_customer: null
- id: groom_agg_household_discounts
  subject: [groom_pass_purchase]
  rule: 'Pass purchases look across the household: a pass bought while another pass of the same customer for a different
    pet is in status active qualifies for multi_pet_pass_discount_pct; a pet with a Tailwise Vet Clinic wellness
    plan in status active qualifies for wellness_plan_discount_pct; a pass bought online qualifies for online_purchase_discount_pct.
    Only one of these discounts is applied, the largest; equal discounts apply in the order multi_pet, wellness_plan,
    online, and the one applied is recorded as discount_kind. No discount applies to Groom Club Monthly fees, and
    coupons are not accepted on passes.'
  eligibility: []
  params:
    per_tier:
      Express Bath Pass 3-Visit:
        multi_pet_pass_discount_pct: =multi_pet_pass_discount_pct
        wellness_plan_discount_pct: =wellness_plan_discount_pct
        online_purchase_discount_pct: =online_purchase_discount_pct
      Bath & Tidy Pass 4-Visit:
        multi_pet_pass_discount_pct: =multi_pet_pass_discount_pct
        wellness_plan_discount_pct: =wellness_plan_discount_pct
        online_purchase_discount_pct: =online_purchase_discount_pct
      Full Groom Pass 4-Visit:
        multi_pet_pass_discount_pct: =multi_pet_pass_discount_pct
        wellness_plan_discount_pct: =wellness_plan_discount_pct
        online_purchase_discount_pct: =online_purchase_discount_pct
      Full Groom Pass 6-Visit:
        multi_pet_pass_discount_pct: =multi_pet_pass_discount_pct
        wellness_plan_discount_pct: =wellness_plan_discount_pct
        online_purchase_discount_pct: =online_purchase_discount_pct
      Spa Groom Pass 6-Visit:
        multi_pet_pass_discount_pct: =multi_pet_pass_discount_pct
        wellness_plan_discount_pct: =wellness_plan_discount_pct
        online_purchase_discount_pct: =online_purchase_discount_pct
      Groom Club Monthly:
        multi_pet_pass_discount_pct: =multi_pet_pass_discount_pct
        wellness_plan_discount_pct: =wellness_plan_discount_pct
        online_purchase_discount_pct: =online_purchase_discount_pct
- id: groom_pass_pricing
  subject: [groom_pass_purchase]
  rule: A pass is priced from pass_price_by_size_usd using the pet's size_class on the purchase date, which is recorded
    as size_class_at_purchase, less the single household discount, rounded half up to the cent. The pass credits
    visits_included visits, and expires_on is the purchase date plus pass_validity_months (falling back to the last
    day of the month). Groom Club Monthly charges its first monthly fee at purchase, credits one month's visits
    and sets next_billing_date one month after purchase. The pet's species must be in eligible_species and the pet
    must be at least min_pet_age_weeks old on the purchase date.
