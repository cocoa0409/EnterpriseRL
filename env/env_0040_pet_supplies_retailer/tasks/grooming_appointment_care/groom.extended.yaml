- id: groom_booking_requirements
  subject: [groom_appointment_book]
  rule: The pass status is active when the appointment is booked. When rabies_proof_required is true, the pet's
    rabies_expires_on is later than the appointment date. A pet without a current certificate on file is not booked
    until the owner provides one to the salon. The appointment date may be at most booking_window_days ahead and
    no later than expires_on, the pass may hold at most max_open_appointments open bookings (groom_msr_open_bookings),
    and two appointment dates on one pass must be at least min_days_between_visits apart. A pet flagged muzzle_required
    may be booked only where muzzle_required_pets_accepted is true, and only with the owner's recorded muzzle_handling
    consent. A pet with no completed Tailwise salon visit is booked with an assessment slot where first_visit_assessment_required
    is true. Booking is free and does not use a visit.
  eligibility:
  - id: bookable_pass
    applies_to: [groom_appointment_book]
    kind: state
    condition: The pass status is active when the appointment is booked.
    evidence_fields: [groom_passes.status, groom_passes.groom_pass_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [groom_passes.groom_pass_id]
      action_bindings:
        groom_passes.groom_pass_id: groom_pass_id
    state_contract:
      field: groom_passes.status
      allowed: [active]
  - id: rabies_current
    applies_to: [groom_appointment_book]
    kind: authorization
    condition: When rabies_proof_required is true, the pet's rabies_expires_on is later than the appointment date.
    evidence_fields: [pets.rabies_expires_on, pets.pet_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pets.pet_id]
      action_bindings:
        pets.pet_id: pet_id
  params:
    per_tier:
      Express Bath Pass 3-Visit:
        rabies_proof_required: =rabies_proof_required
        booking_window_days: =booking_window_days
        max_open_appointments: =max_open_appointments
        min_days_between_visits: =min_days_between_visits
        muzzle_required_pets_accepted: =muzzle_required_pets_accepted
        first_visit_assessment_required: =first_visit_assessment_required
