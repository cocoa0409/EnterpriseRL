category: groom
display_name: Tailwise Grooming Salon
binding:
  holding_table: groom_passes
  event_tables: [groom_events]
  intake_tables: [groom_consents]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    visits_remaining: visits
lifecycle:
  states: [active, suspended, exhausted, expired, cancelled]
  transitions:
  - from: active
    to: exhausted
    by: system
    means: the last visit of a prepaid pass is used, forfeited or refunded
  - from: active
    to: expired
    by: system
    means: expires_on passes with visits unused
  - from: active
    to: suspended
    by: system
    means: a Groom Club Monthly payment is still declined after the retry days
  - from: suspended
    to: active
    by: agent
    means: the overdue monthly fee is paid with a working card
  - from: active
    to: cancelled
    by: user
    means: the customer cancels the pass or club
  - from: suspended
    to: cancelled
    by: user
    means: the customer cancels a suspended club
  - from: suspended
    to: cancelled
    by: system
    means: the suspension outlasts club_suspension_cancel_days
accounts:
- key: visits
  unit: visits
  meaning: 'grooming visits available on the pass: purchases and monthly credits book in; completed visits, no-shows,
    forfeits, expiry and refunds book out'
parameter_schema:
  visits_included: grooming visits credited at purchase (for Groom Club Monthly, per billing month); integer, visits
  pass_price_by_size_usd: price of the pass by the pet's size class at purchase (for Groom Club Monthly, the monthly
    fee); mapping size_class -> USD
  single_visit_price_by_size_usd: salon price of one visit of the same service bought on its own, by size class;
    the basis for refunds and size differences; mapping size_class -> USD
  included_services: services performed on every visit; list
  eligible_species: species the service is offered for; list
  min_pet_age_weeks: youngest age at which a pet may be serviced, counted from date_of_birth to the appointment
    date; integer, weeks
  pass_validity_months: months from the purchase date after which unused visits expire (for Groom Club Monthly,
    the billing period); integer, calendar months
  multi_pet_pass_discount_pct: discount on a pass bought while another pass of the same customer for a different
    pet is active; number, percent
  wellness_plan_discount_pct: discount on a pass for a pet with a Tailwise Vet Clinic wellness plan in status active;
    number, percent
  online_purchase_discount_pct: discount on a pass bought online rather than at the salon; number, percent
  first_visit_assessment_required: whether a pet new to Tailwise salons must have its first visit booked with an
    extra assessment slot; boolean
  booking_window_days: farthest ahead an appointment may be booked; integer, days
  max_open_appointments: booked appointments that may be open at the same time on one pass; integer, count
  min_days_between_visits: minimum calendar days between two appointment dates on one pass; integer, days
  rabies_proof_required: whether a current rabies certificate must be on file for the appointment date; boolean
  muzzle_required_pets_accepted: whether pets flagged muzzle_required may be serviced on this pass; boolean
  handling_surcharge_usd: surcharge per visit for a pet flagged handling_caution or muzzle_required; USD
  coat_surcharge_usd: surcharge per visit by coat type; mapping coat_type -> USD
  dematting_fee_per_15min_usd: fee per started 15-minute block of dematting; USD
  dematting_max_minutes: longest dematting performed in one visit; beyond it only a shave-down is offered; integer,
    minutes
  shave_down_available: whether a shave-down for severe matting can be performed on this pass; boolean
  shave_down_fee_usd: fee for a shave-down; USD
  shave_down_consent_required: whether the owner's recorded consent is needed before a shave-down; boolean
  addon_flea_tick_bath_usd: add-on price of a flea and tick bath; USD
  addon_teeth_brushing_usd: add-on price of teeth brushing; USD
  addon_deshed_usd: add-on price of a deshedding treatment; USD
  plus_addon_discount_pct: discount on add-ons for a customer with a Tailwise Plus membership in status active;
    number, percent
  size_upgrade_charges_difference: whether a visit for a pet now in a larger size class than at purchase is charged
    the single-visit price difference; boolean
  free_cancel_notice_hours: notice before the appointment start at or above which cancelling or rescheduling is
    free; integer, hours
  late_cancel_fee_usd: fee for a cancellation with less notice; USD
  late_cancel_forfeits_visit: whether a late cancellation forfeits a visit instead of a fee; boolean
  no_show_forfeits_visit: whether a no-show forfeits one visit; boolean
  late_arrival_grace_minutes: minutes after the appointment start within which a late arrival is still serviced;
    later arrival is a no-show; integer, minutes
  satisfaction_redo_days: calendar days after a visit within which a free redo of the same service may be booked;
    integer, days
  redo_per_visit: free redos allowed per completed visit; integer, count
  pass_transfer_allowed: whether remaining visits may be moved to another pet of the same customer; boolean
  full_refund_window_days: calendar days after purchase within which an unused pass is refunded in full; integer,
    days
  refund_admin_fee_usd: fee withheld from a partial refund after the full-refund window; USD
  expiry_extension_allowed: whether a one-time extension of the expiry date may be granted on request before expiry;
    boolean
  expiry_extension_days: length of the one-time extension; integer, days
  points_multiplier: multiplier on the Pals Rewards base earn rate for visit charges and pass purchases; integer
  club_min_term_months: minimum number of billed months before Groom Club Monthly can be cancelled without the early
    termination fee; integer, months
  club_early_termination_fee_usd: fee for cancelling Groom Club Monthly before the minimum term; USD
  club_rollover_max_visits: unused monthly visits that may roll into the next billing month; integer, visits
  club_nail_trims_per_month: walk-in nail trims included per billing month; integer, count
  club_payment_retry_days: calendar days after a declined monthly payment during which it is retried before the
    club is suspended; integer, days
  club_suspension_cancel_days: calendar days in suspension after which the club is cancelled automatically; integer,
    days
  club_cancel_effective: when a Groom Club Monthly cancellation takes effect; enum end_of_billing_month | immediate
  walk_in_nail_trim_price_usd: price of a walk-in nail trim outside an included allowance; USD
