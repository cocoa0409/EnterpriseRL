- id: groom_evt_visit_charges
  subject: [groom_visit_complete]
  rule: 'The pass status is active when the visit is checked out. Each completed visit uses one visit of the pass,
    and the included_services are never charged. At checkout the salon charges: the coat_surcharge_usd for the pet''s
    coat_type; dematting at dematting_fee_per_15min_usd per started 15-minute block, never beyond dematting_max_minutes;
    the handling_surcharge_usd for a pet flagged handling_caution or muzzle_required; each add-on at its add-on
    price less plus_addon_discount_pct when the customer''s Tailwise Plus membership is in status active; and, where
    size_upgrade_charges_difference is true and the pet''s current size_class is larger than size_class_at_purchase,
    the difference between the two single_visit_price_by_size_usd prices. Matting beyond dematting_max_minutes is
    handled only by a shave-down where shave_down_available is true, at shave_down_fee_usd. A shave-down is performed
    only if the owner''s consent of kind shave_down for that booking is recorded with decision approved before the
    visit. Without that consent the salon brushes out what it can within the dematting limit. A pet arriving more
    than late_arrival_grace_minutes after the start time is not serviced and the booking is recorded as a no-show.
    All amounts round half up to the cent.'
  eligibility:
  - id: visit_on_active_pass
    applies_to: [groom_visit_complete]
    kind: state
    condition: The pass status is active when the visit is checked out.
    evidence_fields: [groom_passes.status, groom_passes.groom_pass_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [groom_passes.groom_pass_id]
      action_bindings:
