extended_policies:
- id: groom_ext_pass_late_cancel_fee
  base_policy_refs: [groom_cancellation_no_show]
  overwrite:
  - base_policy: groom_cancellation_no_show
    superseded_clause: >-
      A late cancellation carries late_cancel_fee_usd, or, where late_cancel_forfeits_visit is true, forfeits one visit instead of the fee
    replaced_by: >-
      On a prepaid pass a late cancellation carries the pass late-cancellation fee worked out under this rule, booked to the pass as a late-cancellation fee entry for the cancelled booking.
  trigger: state_due
  subject: [groom_late_cancel_fee]
  computes: amount_usd
  target_tool: charge_late_cancel_fee_38a40f67
  params:
    addon_share_pct: 50
    weekend_slot_multiplier: 1.25
    friday_slot_multiplier: 1.1
    saturday_anchor: '2024-01-06'
    half_notice_fraction: 0.5
    quarter_notice_fraction: 0.25
    short_notice_rate: 0.75
    repeat_window_months: 6
    repeat_two_multiplier: 1.5
    repeat_three_multiplier: 2.0
    plus_premier_relief_pct: 50
    plus_relief_pct: 25
    clinic_same_days: 2
    clinic_recent_days: 14
    clinic_waive_pct: 100
    clinic_recent_pct: 50
    relief_cap_pct: 100
    half_up_guard: 0.000001
  rule: >-
    This rule applies to prepaid passes (Express Bath, Bath & Tidy, Full Groom and Spa Groom passes); Groom Club Monthly
    follows its own rule. On a prepaid pass a late cancellation carries the pass late-cancellation fee worked out under this
    rule, booked to the pass as a late-cancellation fee entry for the cancelled booking. The fee is owed for every
    cancellation recorded on the pass with a fee remedy that does not yet carry such an entry. The cancellation a pass
    late-cancellation fee is worked out from is the most recently recorded cancellation on the pass with a fee remedy, and
    the cancelled booking is the booking that cancellation names; where more than one such cancellation lacks its entry,
    each of those fees is still worked out from that most recently recorded cancellation and the booking it names. The fee
    is worked out from that cancellation (its full hours of notice and its appointment date), the booking it names, the pass
    history and the customer's other Tailwise programs. The standard pass late-cancellation fee is the pass's late_cancel_fee_usd, rounded
    half up to the cent once on the final amount. The add-on part of the pass late-cancellation fee follows the add-on on
    the booking that cancellation names: a booking carrying a deshedding treatment adds addon_share_pct percent of addon_deshed_usd, a
    booking carrying a flea and tick bath adds addon_share_pct percent of addon_flea_tick_bath_usd, a booking carrying teeth
    brushing adds addon_share_pct percent of addon_teeth_brushing_usd, and a booking carrying no add-on adds nothing. The
    slot multiplier of the pass late-cancellation fee follows the weekday of the cancelled appointment date: a Saturday or
    Sunday appointment takes weekend_slot_multiplier, a Friday appointment takes friday_slot_multiplier, and an appointment
    on Monday through Thursday takes a multiplier of one. The fee basis is formed by adding the add-on part to
    late_cancel_fee_usd and multiplying that sum by the slot multiplier. The notice treatment of the pass late-cancellation
    fee follows the full hours of notice recorded on the cancellation: notice of at least half_notice_fraction of
    free_cancel_notice_hours prorates the fee basis by the share of free_cancel_notice_hours that was not given, that is the
    fee basis times free_cancel_notice_hours minus the notice, divided by free_cancel_notice_hours; notice of at least
    quarter_notice_fraction but less than half_notice_fraction of free_cancel_notice_hours multiplies the fee basis by
    short_notice_rate; notice of less than quarter_notice_fraction of free_cancel_notice_hours leaves the fee basis whole.
    The repeat multiplier of the pass late-cancellation fee counts the missed bookings of the pass dated within the last
    repeat_window_months whole calendar months before today, a missed booking being a no-show or a cancellation recorded
    with a fee remedy, the cancellation now being charged included, while cancellations recorded with no remedy are not
    missed bookings: three or more missed bookings take repeat_three_multiplier, exactly two take repeat_two_multiplier, and
    fewer than two take a multiplier of one. The Tailwise Plus relief on the pass late-cancellation fee follows the
    customer's rewards membership in status active: Tailwise Plus Premier Annual gives plus_premier_relief_pct percent,
    Tailwise Plus Monthly or Tailwise Plus Annual gives plus_relief_pct percent, and a free Pals Rewards tier or no active
    membership gives none. The clinic relief on the pass late-cancellation fee follows the pet's Tailwise Vet Clinic wellness
    plan and the latest office visit redeemed on it, counted in calendar days from that office visit to the cancelled
    appointment date: a plan in status active whose latest office visit falls zero to clinic_same_days days before the
    appointment gives clinic_waive_pct percent, a plan in status active whose latest office visit falls more than
    clinic_same_days and no more than clinic_recent_days days before the appointment gives clinic_recent_pct percent, and
    any other case gives none; telehealth consultations, wellness exams and other services are not office visits. The
    notice treatment acts on the fee basis, the repeat multiplier acts on the fee after the notice treatment, and the relief
    acts on the fee after the repeat multiplier. The Tailwise Plus relief and the clinic relief are first added into one
    relief percentage, never above relief_cap_pct, and the fee after the repeat multiplier is reduced once by that combined
    percentage; the two reliefs do not act one after the other. Only the final amount is rounded, half up to the cent. Half up means a figure lying exactly on a half cent goes to the higher cent.
  prerequisite: []
  cross_category:
  - category: member
    as: branch
    reads: [status, variant_name]
    note: decides the Tailwise Plus relief tier from the customer's active rewards membership.
  - category: vet
    as: history
    reads: [status, vet_plan_id, vet_plan_events.event_date, vet_plan_events.service_code]
    note: decides the clinic relief tier from the pet's wellness plan status and its latest office visit.
  compute:
  - base_fee: "P('late_cancel_fee_usd')"
  - charged_booking: "LATEST('groom_events', 'original_event_id', event_type='groom_appointment_cancel', late_cancel_remedy='fee')"
  - booked_addon: "LATEST('groom_events', 'addon_code', event_type='groom_appointment_book', groom_event_id=charged_booking)"
  - addon_part: "P('addon_deshed_usd') * K('addon_share_pct') / 100 if booked_addon == 'deshed_treatment' else (P('addon_flea_tick_bath_usd') * K('addon_share_pct') / 100 if booked_addon == 'flea_tick_bath' else (P('addon_teeth_brushing_usd') * K('addon_share_pct') / 100 if booked_addon == 'teeth_brushing' else 0))"
  - appt_date: "LATEST('groom_events', 'appointment_date', event_type='groom_appointment_cancel', late_cancel_remedy='fee')"
  - weekday_index: "DAYS(K('saturday_anchor'), appt_date) % 7"
  - slot_mult: "K('weekend_slot_multiplier') if (weekday_index == 0 or weekday_index == 1) else (K('friday_slot_multiplier') if weekday_index == 6 else 1)"
  - fee_basis: "(base_fee + addon_part) * slot_mult"
  - notice: "LATEST('groom_events', 'notice_hours', event_type='groom_appointment_cancel', late_cancel_remedy='fee')"
  - free_hours: "P('free_cancel_notice_hours')"
  - after_notice: "fee_basis * (free_hours - notice) / free_hours if notice >= free_hours * K('half_notice_fraction') else (fee_basis * K('short_notice_rate') if notice >= free_hours * K('quarter_notice_fraction') else fee_basis)"
  - missed: "COUNT('groom_events', within_months=K('repeat_window_months'), event_type='groom_no_show') + COUNT('groom_events', within_months=K('repeat_window_months'), event_type='groom_appointment_cancel', late_cancel_remedy='fee')"
  - repeat_mult: "K('repeat_three_multiplier') if missed >= 3 else (K('repeat_two_multiplier') if missed == 2 else 1)"
  - after_repeat: "after_notice * repeat_mult"
  - member_tier: "CFIELD('member', 'variant_name', status='active')"
  - plus_pct: "K('plus_premier_relief_pct') if member_tier == 'Tailwise Plus Premier Annual' else (K('plus_relief_pct') if (member_tier == 'Tailwise Plus Monthly' or member_tier == 'Tailwise Plus Annual') else 0)"
  - plan_status: "CFIELD('vet', 'status', pet_id=F('pet_id'))"
  - plan_ref: "CFIELD('vet', 'vet_plan_id', pet_id=F('pet_id'))"
  - office_visit_date: "XLATEST('vet', 'vet_plan_events', 'event_date', vet_plan_id=plan_ref, event_type='vet_service_redeem', service_code='office_visit')"
  - clinic_gap_days: "DAYS(office_visit_date, appt_date) if office_visit_date else -1"
  - clinic_pct: "K('clinic_waive_pct') if (plan_status == 'active' and 0 <= clinic_gap_days <= K('clinic_same_days')) else (K('clinic_recent_pct') if (plan_status == 'active' and K('clinic_same_days') < clinic_gap_days <= K('clinic_recent_days')) else 0)"
  - relief_pct: "MN(K('relief_cap_pct'), plus_pct + clinic_pct)"
  - result: "RND(after_repeat * (100 - relief_pct) / 100 + K('half_up_guard'), 2)"
  compute_basis:
    base_fee: "The standard pass late-cancellation fee is the pass's late_cancel_fee_usd, rounded half up to the cent once on the final amount."
    charged_booking: "the cancelled booking is the booking that cancellation names"
    booked_addon: "The add-on part of the pass late-cancellation fee follows the add-on on the booking that cancellation names"
    addon_part: "a booking carrying a deshedding treatment adds addon_share_pct percent of addon_deshed_usd, a booking carrying a flea and tick bath adds addon_share_pct percent of addon_flea_tick_bath_usd, a booking carrying teeth brushing adds addon_share_pct percent of addon_teeth_brushing_usd, and a booking carrying no add-on adds nothing."
    appt_date: "The cancellation a pass late-cancellation fee is worked out from is the most recently recorded cancellation on the pass with a fee remedy"
    weekday_index: "The slot multiplier of the pass late-cancellation fee follows the weekday of the cancelled appointment date"
    slot_mult: "a Saturday or Sunday appointment takes weekend_slot_multiplier, a Friday appointment takes friday_slot_multiplier, and an appointment on Monday through Thursday takes a multiplier of one."
    fee_basis: "The fee basis is formed by adding the add-on part to late_cancel_fee_usd and multiplying that sum by the slot multiplier."
    notice: "The notice treatment of the pass late-cancellation fee follows the full hours of notice recorded on the cancellation"
    after_notice: "notice of at least half_notice_fraction of free_cancel_notice_hours prorates the fee basis by the share of free_cancel_notice_hours that was not given, that is the fee basis times free_cancel_notice_hours minus the notice, divided by free_cancel_notice_hours; notice of at least quarter_notice_fraction but less than half_notice_fraction of free_cancel_notice_hours multiplies the fee basis by short_notice_rate; notice of less than quarter_notice_fraction of free_cancel_notice_hours leaves the fee basis whole."
    missed: "The repeat multiplier of the pass late-cancellation fee counts the missed bookings of the pass dated within the last repeat_window_months whole calendar months before today, a missed booking being a no-show or a cancellation recorded with a fee remedy, the cancellation now being charged included, while cancellations recorded with no remedy are not missed bookings"
    repeat_mult: "three or more missed bookings take repeat_three_multiplier, exactly two take repeat_two_multiplier, and fewer than two take a multiplier of one."
    after_repeat: "the repeat multiplier acts on the fee after the notice treatment"
    member_tier: "The Tailwise Plus relief on the pass late-cancellation fee follows the customer's rewards membership in status active"
    plus_pct: "Tailwise Plus Premier Annual gives plus_premier_relief_pct percent, Tailwise Plus Monthly or Tailwise Plus Annual gives plus_relief_pct percent, and a free Pals Rewards tier or no active membership gives none."
    plan_status: "The clinic relief on the pass late-cancellation fee follows the pet's Tailwise Vet Clinic wellness plan and the latest office visit redeemed on it"
    plan_ref: "The clinic relief on the pass late-cancellation fee follows the pet's Tailwise Vet Clinic wellness plan and the latest office visit redeemed on it"
    office_visit_date: "telehealth consultations, wellness exams and other services are not office visits."
    clinic_gap_days: "counted in calendar days from that office visit to the cancelled appointment date"
    clinic_pct: "a plan in status active whose latest office visit falls zero to clinic_same_days days before the appointment gives clinic_waive_pct percent, a plan in status active whose latest office visit falls more than clinic_same_days and no more than clinic_recent_days days before the appointment gives clinic_recent_pct percent, and any other case gives none"
    relief_pct: "The Tailwise Plus relief and the clinic relief are first added into one relief percentage, never above relief_cap_pct, and the fee after the repeat multiplier is reduced once by that combined percentage; the two reliefs do not act one after the other."
    result: "Only the final amount is rounded, half up to the cent. Half up means a figure lying exactly on a half cent goes to the higher cent."
  factors:
  - id: addon_part
    effect: parameter
    decides: addon_part
    bindings: [charged_booking, booked_addon, addon_part]
    ladder:
    - when: the cancelled booking carries a deshedding treatment
      value: addon_share_pct percent of P('addon_deshed_usd')
    - when: the cancelled booking carries a flea and tick bath
      value: addon_share_pct percent of P('addon_flea_tick_bath_usd')
    - when: the cancelled booking carries teeth brushing
      value: addon_share_pct percent of P('addon_teeth_brushing_usd')
    - when: otherwise (no add-on on the booking)
      value: '0'
    baseline:
      addon_part: '0'
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: slot_multiplier
    effect: parameter
    decides: slot_mult
    bindings: [appt_date, weekday_index, slot_mult]
    ladder:
    - when: the cancelled appointment date is a Saturday or a Sunday
      value: K('weekend_slot_multiplier')
    - when: the cancelled appointment date is a Friday
      value: K('friday_slot_multiplier')
    - when: otherwise (Monday through Thursday)
      value: '1'
    baseline:
      slot_mult: '1'
    evidence: [history, date]
    cross_difficulty: null
  - id: notice_treatment
    effect: method
    decides: after_notice
    bindings: [notice, after_notice]
    ladder:
    - when: the cancellation carries notice of at least half_notice_fraction of free_cancel_notice_hours
      method: the fee basis is prorated by the hours of notice not given, fee basis times (free_cancel_notice_hours minus notice) divided by free_cancel_notice_hours
    - when: the cancellation carries notice of at least quarter_notice_fraction but less than half_notice_fraction of free_cancel_notice_hours
      method: the fee basis is multiplied by short_notice_rate
    - when: otherwise (less than quarter_notice_fraction of free_cancel_notice_hours)
      method: the fee basis is charged whole
    baseline:
      after_notice: fee_basis
    evidence: [history]
    cross_difficulty: null
  - id: repeat_multiplier
    effect: parameter
    decides: repeat_mult
    bindings: [missed, repeat_mult]
    ladder:
    - when: three or more no-shows and fee-remedy cancellations dated within the last repeat_window_months calendar months
      value: K('repeat_three_multiplier')
    - when: exactly two such missed bookings
      value: K('repeat_two_multiplier')
    - when: otherwise (fewer than two)
      value: '1'
    baseline:
      repeat_mult: '1'
    evidence: [history]
    cross_difficulty: null
  - id: plus_relief
    effect: parameter
    decides: plus_pct
    bindings: [member_tier, plus_pct]
    ladder:
    - when: the active rewards membership is Tailwise Plus Premier Annual
      value: K('plus_premier_relief_pct')
    - when: the active rewards membership is Tailwise Plus Monthly or Tailwise Plus Annual
      value: K('plus_relief_pct')
    - when: otherwise (a free Pals Rewards tier or no active membership)
      value: '0'
    baseline:
      plus_pct: '0'
    evidence: [cross_category]
    cross_difficulty: member
  - id: clinic_relief
    effect: parameter
    decides: clinic_pct
    bindings: [plan_status, plan_ref, office_visit_date, clinic_pct]
    ladder:
    - when: the pet's wellness plan is active AND its latest office visit falls zero to clinic_same_days days before the appointment
      value: K('clinic_waive_pct')
    - when: the pet's wellness plan is active AND its latest office visit falls more than clinic_same_days and no more than clinic_recent_days days before the appointment
      value: K('clinic_recent_pct')
    - when: otherwise
      value: '0'
    baseline:
      clinic_pct: '0'
    evidence: [cross_category, date]
    cross_difficulty: null
  baseline:
    rule: >-
      The standard pass late-cancellation fee is the pass's late_cancel_fee_usd, rounded half up to the cent once on the
      final amount.
    params: [late_cancel_fee_usd]
  inputs:
    history:
    - {table: groom_events, aggregate: latest, field: original_event_id, filters: {event_type: groom_appointment_cancel, late_cancel_remedy: fee}}
    - {table: groom_events, aggregate: latest, field: addon_code, filters: {event_type: groom_appointment_book}}
    - {table: groom_events, aggregate: latest, field: notice_hours, filters: {event_type: groom_appointment_cancel, late_cancel_remedy: fee}}
    - {table: groom_events, aggregate: count, field: groom_event_id, within_months: 6, filters: {event_type: groom_no_show}}
    - {table: groom_events, aggregate: count, field: groom_event_id, within_months: 6, filters: {event_type: groom_appointment_cancel, late_cancel_remedy: fee}}
    - {category: vet, table: vet_plan_events, aggregate: latest, field: event_date, filters: {event_type: vet_service_redeem, service_code: office_visit}}
    cross_category: [member, vet]
- id: groom_ext_pass_cancel_refund
  base_policy_refs: [groom_pass_cancel_refund]
  overwrite:
  - base_policy: groom_pass_cancel_refund
    superseded_clause: >-
      A full refund is given only if the cancellation is requested no later than full_refund_window_days after the pass's purchase date and no visit has been used.
    replaced_by: >-
      A cancellation requested no later than full_refund_window_days calendar days after purchased_on, that date being day 0, of a pass with no used visit is refunded the price paid in full.
  - base_policy: groom_pass_cancel_refund
    superseded_clause: >-
      Otherwise the refund is the price paid minus every used visit (groom_msr_visits_used) at the single_visit_price_by_size_usd for the size class at purchase, minus refund_admin_fee_usd, and never below 0.00; the unused visits are removed.
    replaced_by: >-
      The standard refund on a cancelled pass is the unused value, that is price_paid_usd minus the used visits at the per-visit paid rate, less refund_admin_fee_usd and less the late-cancellation fees booked on the pass, rounded half up to the cent once on the final amount and never below 0.00; the unused visits are removed and the refund goes to the original payment.
  trigger: on_request
  subject: [groom_pass_cancel, groom_pass_refund]
  computes: refund_usd
  target_tool: cancel_groom_pass_241c8b1d
  params:
    half_validity_fraction: 0.5
    expiry_near_days: 30
    expiry_mid_days: 90
    expiry_near_share: 0.5
    expiry_mid_share: 0.75
    redo_multi_share: 1
    redo_single_share: 0.5
    half_up_guard: 0.000001
    autoship_window_months: 6
    autoship_waive_count: 6
    autoship_half_count: 3
    admin_half_share: 0.5
    fee_single_share: 0.5
    fee_double_share: 0.75
  rule: >-
    This rule settles the refund when the customer cancels a prepaid pass (Express Bath, Bath & Tidy, Full Groom or Spa
    Groom pass); Groom Club Monthly is settled under its own rule, and only the customer can cancel a pass. The refund on a
    cancelled pass is fixed only after every cancellation on the pass that is recorded with a fee remedy carries its
    late-cancellation fee entry. A cancellation requested no later than full_refund_window_days calendar days after
    purchased_on, that date being day 0, of a pass with no used visit is refunded the price paid in full. Every other
    cancellation is refunded as follows. A used visit is a completed visit, a no-show or a forfeit recorded on the pass with
    one visit taken, and the per-visit paid rate is price_paid_usd divided by visits_purchased. The standard refund on a
    cancelled pass is the unused value, that is price_paid_usd minus the used visits at the per-visit paid rate, less
    refund_admin_fee_usd and less the late-cancellation fees booked on the pass, rounded half up to the cent once on the
    final amount and never below 0.00; the unused visits are removed and the refund goes to the original payment. The value
    of the used visits on a cancelled pass follows the discount recorded at purchase and how far into its validity the pass
    is cancelled, counted in whole calendar months from purchased_on to the cancellation date: a pass bought with the
    multi-pet or the wellness-plan discount and cancelled before half_validity_fraction of pass_validity_months has passed
    values every used visit at the undiscounted rate, the per-visit paid rate divided by one minus that discount percentage
    (multi_pet_pass_discount_pct or wellness_plan_discount_pct); a pass bought with the multi-pet or the wellness-plan
    discount, cancelled once half_validity_fraction of pass_validity_months has passed and holding at least one used visit
    values its most recent used visit at that undiscounted rate and every other used visit at the per-visit paid rate; any
    other pass values every used visit at the per-visit paid rate. The expiry share of the unused value follows the calendar
    days from the cancellation date to expires_on: fewer than expiry_near_days days keeps expiry_near_share of it,
    expiry_near_days to fewer than expiry_mid_days days keeps expiry_mid_share of it, and expiry_mid_days days or more keeps
    all of it. The redo credit on a cancelled pass counts every redone visit at the per-visit paid rate times the redo share, and the redo
    share follows the free redos recorded on the pass: two or more redos take redo_multi_share, exactly one redo takes
    redo_single_share, and no redo takes a share of zero. The admin fee withheld on a cancelled pass follows the household's charged Tailwise Autoship
    shipments dated within the last autoship_window_months whole calendar months, skipped shipments not counting: at least
    autoship_waive_count charged shipments waive refund_admin_fee_usd, at least autoship_half_count but fewer than
    autoship_waive_count withhold admin_half_share of refund_admin_fee_usd, and fewer than autoship_half_count withhold all
    of refund_admin_fee_usd. The share of the late-cancellation fees withheld from the refund follows how many
    late-cancellation fee entries the pass carries: exactly one entry withholds fee_single_share of the fees booked,
    exactly two entries withhold fee_double_share of them, and none or three or more withhold them in full. The expiry share
    acts on the unused value; the redo credit is then added to that result in full, and the admin fee withheld and the
    share of the late-cancellation fees withheld are then subtracted from it; the result is rounded half up to the cent once
    and is never below 0.00. Half up means a figure lying exactly on a half cent goes to the higher cent.
  prerequisite:
  - problem: groom_ext_pass_late_cancel_fee
    kind: value_input
    gate: fees_booked
    form: state
    policy_source: >-
      The refund on a cancelled pass is fixed only after every cancellation on the pass that is recorded with a fee remedy carries its late-cancellation fee entry.
    condition: >-
      Every groom_appointment_cancel row of the pass with late_cancel_remedy fee has a groom_late_cancel_fee row on the same pass whose original_event_id is that cancellation's original_event_id.
    resolved_by: charge_late_cancel_fee_38a40f67
    effect: >-
      fees_booked grows by the pass late-cancellation fee booked for the cancelled booking and the count of fee entries grows by one, so the share of fees withheld moves with them and the refund falls accordingly.
  cross_category:
  - category: autoship
    as: history
    reads: [autoship_events.event_type, autoship_events.event_date]
    note: decides the admin fee withheld from the household's charged Autoship shipments in the window.
  compute:
  - price: "F('price_paid_usd')"
  - purchased: "F('visits_purchased')"
  - paid_rate: "price / purchased"
  - used_complete: "COUNT('groom_events', event_type='groom_visit_complete', visits_delta=1)"
  - used_noshow: "COUNT('groom_events', event_type='groom_no_show', visits_delta=1)"
  - used_forfeit: "COUNT('groom_events', event_type='groom_visit_forfeit', visits_delta=1)"
  - used_visits: "used_complete + used_noshow + used_forfeit"
  - months_in: "MONTHS(F('purchased_on'), NOW)"
  - discount_pct: "P('multi_pet_pass_discount_pct') if F('discount_kind') == 'multi_pet' else (P('wellness_plan_discount_pct') if F('discount_kind') == 'wellness_plan' else 0)"
  - used_value: "used_visits * paid_rate / (1 - discount_pct / 100) if (discount_pct > 0 and months_in < P('pass_validity_months') * K('half_validity_fraction')) else ((used_visits - 1) * paid_rate + paid_rate / (1 - discount_pct / 100) if (discount_pct > 0 and months_in >= P('pass_validity_months') * K('half_validity_fraction') and used_visits >= 1) else used_visits * paid_rate)"
  - unused_value: "price - used_value"
  - days_left: "DAYS(NOW, F('expires_on'))"
  - expiry_share: "K('expiry_near_share') if days_left < K('expiry_near_days') else (K('expiry_mid_share') if days_left < K('expiry_mid_days') else 1)"
  - redo_count: "COUNT('groom_events', event_type='groom_redo')"
  - redo_share: "K('redo_multi_share') if redo_count >= 2 else (K('redo_single_share') if redo_count == 1 else 0)"
  - redo_credit: "redo_count * paid_rate * redo_share"
  - autoship_shipments: "XCOUNT('autoship', 'autoship_events', within_months=K('autoship_window_months'), event_type='autoship_shipment_charge')"
  - admin_withheld: "0 if autoship_shipments >= K('autoship_waive_count') else (P('refund_admin_fee_usd') * K('admin_half_share') if autoship_shipments >= K('autoship_half_count') else P('refund_admin_fee_usd'))"
  - fees_booked: "SUM('groom_events', 'amount_usd', event_type='groom_late_cancel_fee')"
  - fee_entries: "COUNT('groom_events', event_type='groom_late_cancel_fee')"
  - fee_share: "K('fee_single_share') if fee_entries == 1 else (K('fee_double_share') if fee_entries == 2 else 1)"
  - full_refund: "DAYS(F('purchased_on'), NOW) <= P('full_refund_window_days') and used_visits == 0"
  - result: "price if full_refund else MX(0, RND(unused_value * expiry_share + redo_credit - admin_withheld - fees_booked * fee_share + K('half_up_guard'), 2))"
  compute_basis:
    price: "The standard refund on a cancelled pass is the unused value, that is price_paid_usd minus the used visits at the per-visit paid rate"
    paid_rate: "the per-visit paid rate is price_paid_usd divided by visits_purchased."
    used_complete: "A used visit is a completed visit, a no-show or a forfeit recorded on the pass with one visit taken"
    used_noshow: "A used visit is a completed visit, a no-show or a forfeit recorded on the pass with one visit taken"
    used_forfeit: "A used visit is a completed visit, a no-show or a forfeit recorded on the pass with one visit taken"
    months_in: "how far into its validity the pass is cancelled, counted in whole calendar months from purchased_on to the cancellation date"
    discount_pct: "the per-visit paid rate divided by one minus that discount percentage (multi_pet_pass_discount_pct or wellness_plan_discount_pct)"
    used_value: "a pass bought with the multi-pet or the wellness-plan discount and cancelled before half_validity_fraction of pass_validity_months has passed values every used visit at the undiscounted rate, the per-visit paid rate divided by one minus that discount percentage (multi_pet_pass_discount_pct or wellness_plan_discount_pct); a pass bought with the multi-pet or the wellness-plan discount, cancelled once half_validity_fraction of pass_validity_months has passed and holding at least one used visit values its most recent used visit at that undiscounted rate and every other used visit at the per-visit paid rate; any other pass values every used visit at the per-visit paid rate."
    days_left: "The expiry share of the unused value follows the calendar days from the cancellation date to expires_on"
    expiry_share: "fewer than expiry_near_days days keeps expiry_near_share of it, expiry_near_days to fewer than expiry_mid_days days keeps expiry_mid_share of it, and expiry_mid_days days or more keeps all of it."
    redo_count: "share follows the free redos recorded on the pass"
    redo_share: "two or more redos take redo_multi_share, exactly one redo takes redo_single_share, and no redo takes a share of zero."
    redo_credit: "The redo credit on a cancelled pass counts every redone visit at the per-visit paid rate times the redo share"
    autoship_shipments: "The admin fee withheld on a cancelled pass follows the household's charged Tailwise Autoship shipments dated within the last autoship_window_months whole calendar months, skipped shipments not counting"
    admin_withheld: "at least autoship_waive_count charged shipments waive refund_admin_fee_usd, at least autoship_half_count but fewer than autoship_waive_count withhold admin_half_share of refund_admin_fee_usd, and fewer than autoship_half_count withhold all of refund_admin_fee_usd."
    fees_booked: "less the late-cancellation fees booked on the pass"
    fee_entries: "The share of the late-cancellation fees withheld from the refund follows how many late-cancellation fee entries the pass carries"
    fee_share: "exactly one entry withholds fee_single_share of the fees booked, exactly two entries withhold fee_double_share of them, and none or three or more withhold them in full."
    full_refund: "A cancellation requested no later than full_refund_window_days calendar days after purchased_on, that date being day 0, of a pass with no used visit is refunded the price paid in full."
    result: "The expiry share acts on the unused value; the redo credit is then added to that result in full, and the admin fee withheld and the share of the late-cancellation fees withheld are then subtracted from it; the result is rounded half up to the cent once and is never below 0.00. Half up means a figure lying exactly on a half cent goes to the higher cent."
  factors:
  - id: used_visit_value
    effect: method
    decides: used_value
    bindings: [months_in, discount_pct, used_value]
    ladder:
    - when: the pass was bought with the multi-pet or wellness-plan discount AND is cancelled before half_validity_fraction of pass_validity_months has passed
      method: every used visit is valued at the undiscounted rate, the per-visit paid rate divided by one minus the discount percentage
    - when: the pass was bought with the multi-pet or wellness-plan discount AND is cancelled once half_validity_fraction of pass_validity_months has passed, with at least one used visit
      method: only the most recent used visit is valued at the undiscounted rate, every other used visit at the per-visit paid rate
    - when: otherwise
      method: every used visit is valued at the per-visit paid rate
    baseline:
      used_value: used_visits * paid_rate
    evidence: [history, date]
    cross_difficulty: null
  - id: expiry_share
    effect: parameter
    decides: expiry_share
    bindings: [days_left, expiry_share]
    ladder:
    - when: fewer than expiry_near_days calendar days from the cancellation date to expires_on
      value: K('expiry_near_share')
    - when: expiry_near_days to fewer than expiry_mid_days calendar days to expires_on
      value: K('expiry_mid_share')
    - when: otherwise (expiry_mid_days days or more)
      value: '1'
    baseline:
      expiry_share: '1'
    evidence: [date]
    cross_difficulty: null
  - id: redo_credit
    effect: parameter
    decides: redo_share
    bindings: [redo_count, redo_share]
    ladder:
    - when: two or more free redos recorded on the pass
      value: K('redo_multi_share')
    - when: exactly one free redo recorded on the pass
      value: K('redo_single_share')
    - when: otherwise (no redo)
      value: '0'
    baseline:
      redo_share: '0'
    evidence: [history]
    cross_difficulty: null
  - id: autoship_admin_fee
    effect: parameter
    decides: admin_withheld
    bindings: [autoship_shipments, admin_withheld]
    ladder:
    - when: at least autoship_waive_count charged Autoship shipments in the last autoship_window_months calendar months
      value: '0'
    - when: at least autoship_half_count but fewer than autoship_waive_count charged shipments
      value: K('admin_half_share') of P('refund_admin_fee_usd')
    - when: otherwise (fewer than autoship_half_count)
      value: P('refund_admin_fee_usd')
    baseline:
      admin_withheld: P('refund_admin_fee_usd')
    evidence: [cross_category, history]
    cross_difficulty: autoship
  - id: fee_withholding_share
    effect: parameter
    decides: fee_share
    bindings: [fee_entries, fee_share]
    ladder:
    - when: the pass carries exactly one late-cancellation fee entry
      value: K('fee_single_share')
    - when: the pass carries exactly two late-cancellation fee entries
      value: K('fee_double_share')
    - when: otherwise (none, or three or more)
      value: '1'
    baseline:
      fee_share: '1'
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      A used visit is a completed visit, a no-show or a forfeit recorded on the pass with one visit taken, and the per-visit
      paid rate is price_paid_usd divided by visits_purchased. The standard refund on a cancelled pass is the unused value,
      that is price_paid_usd minus the used visits at the per-visit paid rate, less refund_admin_fee_usd and less the
      late-cancellation fees booked on the pass, rounded half up to the cent once on the final amount and never below 0.00;
      the unused visits are removed and the refund goes to the original payment.
    params: [refund_admin_fee_usd]
  inputs:
    history:
    - {table: groom_events, aggregate: count, field: groom_event_id, filters: {event_type: groom_visit_complete, visits_delta: 1}}
    - {table: groom_events, aggregate: count, field: groom_event_id, filters: {event_type: groom_no_show, visits_delta: 1}}
    - {table: groom_events, aggregate: count, field: groom_event_id, filters: {event_type: groom_visit_forfeit, visits_delta: 1}}
    - {table: groom_events, aggregate: count, field: groom_event_id, filters: {event_type: groom_redo}}
    - {table: groom_events, aggregate: sum, field: amount_usd, filters: {event_type: groom_late_cancel_fee}}
    - {category: autoship, table: autoship_events, aggregate: count, field: autoship_event_id, within_months: 6, filters: {event_type: autoship_shipment_charge}}
    cross_category: [autoship]
- id: groom_ext_club_late_cancel_charge
  base_policy_refs: [groom_cancellation_no_show]
  overwrite:
  - base_policy: groom_cancellation_no_show
    superseded_clause: >-
      A late cancellation carries late_cancel_fee_usd, or, where late_cancel_forfeits_visit is true, forfeits one visit instead of the fee
    replaced_by: >-
      On Groom Club Monthly a late cancellation forfeits one credited visit, and where the club holds no credited visit when the cancellation is recorded, the cancellation is recorded with a fee remedy and carries the club late-cancellation charge worked out under this rule instead, booked to the club as a club late-cancellation charge entry for the cancelled booking.
  trigger: state_due
  subject: [groom_late_cancel_fee]
  computes: amount_usd
  target_tool: charge_club_late_cancel_73de6594
  params:
    half_notice_fraction: 0.5
    quarter_notice_fraction: 0.25
    short_notice_rate: 0.75
    first_miss_share: 0.5
    second_miss_share: 0.75
    new_member_days: 90
    settling_member_days: 180
    new_member_share: 0.5
    settling_member_share: 0.75
    clinic_same_days: 2
    clinic_recent_days: 14
    clinic_waive_pct: 100
    clinic_recent_pct: 50
    half_up_guard: 0.000001
  rule: >-
    This rule applies to Groom Club Monthly only; prepaid passes follow their own rule. On Groom Club Monthly a late
    cancellation forfeits one credited visit, and where the club holds no credited visit when the cancellation is recorded,
    the cancellation is recorded with a fee remedy and carries the club late-cancellation charge worked out under this rule
    instead, booked to the club as a club late-cancellation charge entry for the cancelled booking. The charge is owed for
    every cancellation recorded on the club with a fee remedy that does not yet carry such an entry. The cancellation a club
    late-cancellation charge is worked out from is the most recently recorded cancellation on the club with a fee remedy;
    where more than one such cancellation lacks its entry, each of those charges is still worked out from that most recently
    recorded cancellation. The charge is worked out from that cancellation (its full hours of notice and its appointment
    date), the club history and the pet's wellness plan. The standard club late-cancellation charge is the value of one club visit, price_paid_usd divided by
    visits_included, rounded half up to the cent once on the final amount. The notice treatment of the club
    late-cancellation charge follows the full hours of notice recorded on the cancellation: notice of at least
    half_notice_fraction of free_cancel_notice_hours prorates the club visit value by the share of free_cancel_notice_hours
    that was not given, that is the visit value times free_cancel_notice_hours minus the notice, divided by
    free_cancel_notice_hours; notice of at least quarter_notice_fraction but less than half_notice_fraction of
    free_cancel_notice_hours multiplies the visit value by short_notice_rate; notice of less than quarter_notice_fraction of
    free_cancel_notice_hours leaves the visit value whole. The missed-visit courtesy on the club late-cancellation charge
    counts the forfeited visits and no-shows recorded on the club since it was joined, cancellation entries themselves not
    counting: none keeps first_miss_share of the charge, exactly one keeps second_miss_share of it, and two or more keep all
    of it. The new-member courtesy on the club late-cancellation charge follows the calendar days from the club's
    purchased_on to today: fewer than new_member_days keeps new_member_share of the charge, new_member_days to fewer than
    settling_member_days keeps settling_member_share of it, and settling_member_days or more keeps all of it. The clinic
    relief on the club late-cancellation charge follows the pet's Tailwise Vet Clinic wellness plan and the latest office
    visit redeemed on it, counted in calendar days from that office visit to the cancelled appointment date: a plan in
    status active whose latest office visit falls zero to clinic_same_days days before the appointment gives
    clinic_waive_pct percent, a plan in status active whose latest office visit falls more than clinic_same_days and no
    more than clinic_recent_days days before the appointment gives clinic_recent_pct percent, and any other case gives
    none; telehealth consultations, wellness exams and other services are not office visits. The notice treatment acts on
    the club visit value; the missed-visit courtesy share, then the new-member courtesy share, each multiply the result of
    the step before, and the clinic relief percentage then reduces that result once. Only the final amount is rounded,
    half up to the cent. Half up means a figure lying exactly on a half cent goes to the higher cent.
  prerequisite: []
  cross_category:
  - category: vet
    as: history
    reads: [status, vet_plan_id, vet_plan_events.event_date, vet_plan_events.service_code]
    note: decides the clinic relief tier from the pet's wellness plan status and its latest office visit.
  compute:
  - visit_value: "F('price_paid_usd') / P('visits_included')"
  - notice: "LATEST('groom_events', 'notice_hours', event_type='groom_appointment_cancel', late_cancel_remedy='fee')"
  - free_hours: "P('free_cancel_notice_hours')"
  - charge_after_notice: "visit_value * (free_hours - notice) / free_hours if notice >= free_hours * K('half_notice_fraction') else (visit_value * K('short_notice_rate') if notice >= free_hours * K('quarter_notice_fraction') else visit_value)"
  - prior_misses: "COUNT('groom_events', event_type='groom_visit_forfeit') + COUNT('groom_events', event_type='groom_no_show')"
  - miss_share: "K('first_miss_share') if prior_misses == 0 else (K('second_miss_share') if prior_misses == 1 else 1)"
  - club_age_days: "DAYS(F('purchased_on'), NOW)"
  - tenure_share: "K('new_member_share') if club_age_days < K('new_member_days') else (K('settling_member_share') if club_age_days < K('settling_member_days') else 1)"
  - charged_appt_date: "LATEST('groom_events', 'appointment_date', event_type='groom_appointment_cancel', late_cancel_remedy='fee')"
  - club_plan_status: "CFIELD('vet', 'status', pet_id=F('pet_id'))"
  - club_plan_ref: "CFIELD('vet', 'vet_plan_id', pet_id=F('pet_id'))"
  - club_office_visit: "XLATEST('vet', 'vet_plan_events', 'event_date', vet_plan_id=club_plan_ref, event_type='vet_service_redeem', service_code='office_visit')"
  - club_gap_days: "DAYS(club_office_visit, charged_appt_date) if club_office_visit else -1"
  - club_clinic_pct: "K('clinic_waive_pct') if (club_plan_status == 'active' and 0 <= club_gap_days <= K('clinic_same_days')) else (K('clinic_recent_pct') if (club_plan_status == 'active' and K('clinic_same_days') < club_gap_days <= K('clinic_recent_days')) else 0)"
  - result: "RND(charge_after_notice * miss_share * tenure_share * (100 - club_clinic_pct) / 100 + K('half_up_guard'), 2)"
  compute_basis:
    visit_value: "The standard club late-cancellation charge is the value of one club visit, price_paid_usd divided by visits_included, rounded half up to the cent once on the final amount."
    notice: "The notice treatment of the club late-cancellation charge follows the full hours of notice recorded on the cancellation"
    charge_after_notice: "notice of at least half_notice_fraction of free_cancel_notice_hours prorates the club visit value by the share of free_cancel_notice_hours that was not given, that is the visit value times free_cancel_notice_hours minus the notice, divided by free_cancel_notice_hours; notice of at least quarter_notice_fraction but less than half_notice_fraction of free_cancel_notice_hours multiplies the visit value by short_notice_rate; notice of less than quarter_notice_fraction of free_cancel_notice_hours leaves the visit value whole."
    prior_misses: "The missed-visit courtesy on the club late-cancellation charge counts the forfeited visits and no-shows recorded on the club since it was joined, cancellation entries themselves not counting"
    miss_share: "none keeps first_miss_share of the charge, exactly one keeps second_miss_share of it, and two or more keep all of it."
    club_age_days: "The new-member courtesy on the club late-cancellation charge follows the calendar days from the club's purchased_on to today"
    tenure_share: "fewer than new_member_days keeps new_member_share of the charge, new_member_days to fewer than settling_member_days keeps settling_member_share of it, and settling_member_days or more keeps all of it."
    charged_appt_date: "The cancellation a club late-cancellation charge is worked out from is the most recently recorded cancellation on the club with a fee remedy"
    club_plan_status: "The clinic relief on the club late-cancellation charge follows the pet's Tailwise Vet Clinic wellness plan and the latest office visit redeemed on it"
    club_plan_ref: "The clinic relief on the club late-cancellation charge follows the pet's Tailwise Vet Clinic wellness plan and the latest office visit redeemed on it"
    club_office_visit: "telehealth consultations, wellness exams and other services are not office visits."
    club_gap_days: "counted in calendar days from that office visit to the cancelled appointment date"
    club_clinic_pct: "a plan in status active whose latest office visit falls zero to clinic_same_days days before the appointment gives clinic_waive_pct percent, a plan in status active whose latest office visit falls more than clinic_same_days and no more than clinic_recent_days days before the appointment gives clinic_recent_pct percent, and any other case gives none"
    result: "The notice treatment acts on the club visit value; the missed-visit courtesy share, then the new-member courtesy share, each multiply the result of the step before, and the clinic relief percentage then reduces that result once. Only the final amount is rounded, half up to the cent. Half up means a figure lying exactly on a half cent goes to the higher cent."
  factors:
  - id: club_notice_treatment
    effect: method
    decides: charge_after_notice
    bindings: [notice, charge_after_notice]
    ladder:
    - when: the cancellation carries notice of at least half_notice_fraction of free_cancel_notice_hours
      method: the club visit value is prorated by the hours of notice not given, visit value times (free_cancel_notice_hours minus notice) divided by free_cancel_notice_hours
    - when: the cancellation carries notice of at least quarter_notice_fraction but less than half_notice_fraction of free_cancel_notice_hours
      method: the club visit value is multiplied by short_notice_rate
    - when: otherwise (less than quarter_notice_fraction of free_cancel_notice_hours)
      method: the club visit value is charged whole
    baseline:
      charge_after_notice: visit_value
    evidence: [history]
    cross_difficulty: null
  - id: missed_visit_courtesy
    effect: parameter
    decides: miss_share
    bindings: [prior_misses, miss_share]
    ladder:
    - when: no forfeited visit and no no-show recorded on the club
      value: K('first_miss_share')
    - when: exactly one forfeited visit or no-show recorded on the club
      value: K('second_miss_share')
    - when: otherwise (two or more)
      value: '1'
    baseline:
      miss_share: '1'
    evidence: [history]
    cross_difficulty: null
  - id: new_member_courtesy
    effect: parameter
    decides: tenure_share
    bindings: [club_age_days, tenure_share]
    ladder:
    - when: fewer than new_member_days calendar days since the club's purchased_on
      value: K('new_member_share')
    - when: new_member_days to fewer than settling_member_days days since purchased_on
      value: K('settling_member_share')
    - when: otherwise (settling_member_days days or more)
      value: '1'
    baseline:
      tenure_share: '1'
    evidence: [date]
    cross_difficulty: null
  - id: club_clinic_relief
    effect: parameter
    decides: club_clinic_pct
    bindings: [club_plan_status, club_plan_ref, club_office_visit, club_clinic_pct]
    ladder:
    - when: the pet's wellness plan is active AND its latest office visit falls zero to clinic_same_days days before the appointment
      value: K('clinic_waive_pct')
    - when: the pet's wellness plan is active AND its latest office visit falls more than clinic_same_days and no more than clinic_recent_days days before the appointment
      value: K('clinic_recent_pct')
    - when: otherwise
      value: '0'
    baseline:
      club_clinic_pct: '0'
    evidence: [cross_category, date]
    cross_difficulty: null
  baseline:
    rule: >-
      The standard club late-cancellation charge is the value of one club visit, price_paid_usd divided by visits_included,
      rounded half up to the cent once on the final amount.
    params: [visits_included]
  inputs:
    history:
    - {table: groom_events, aggregate: latest, field: notice_hours, filters: {event_type: groom_appointment_cancel, late_cancel_remedy: fee}}
    - {table: groom_events, aggregate: count, field: groom_event_id, filters: {event_type: groom_visit_forfeit}}
    - {table: groom_events, aggregate: count, field: groom_event_id, filters: {event_type: groom_no_show}}
    - {category: vet, table: vet_plan_events, aggregate: latest, field: event_date, filters: {event_type: vet_service_redeem, service_code: office_visit}}
    cross_category: [vet]
- id: groom_ext_club_cancel_settlement
  base_policy_refs: [groom_pass_cancel_refund, groom_club_monthly_billing]
  overwrite:
  - base_policy: groom_pass_cancel_refund
    superseded_clause: >-
      A full refund is given only if the cancellation is requested no later than full_refund_window_days after the pass's purchase date and no visit has been used.
    replaced_by: >-
      Groom Club Monthly has no full-refund window: a club cancellation is never refunded in full and is settled under this rule.
  - base_policy: groom_pass_cancel_refund
    superseded_clause: >-
      Groom Club Monthly is not refunded for the current month: a cancellation takes effect per club_cancel_effective, and a cancellation before club_min_term_months billed months (groom_msr_billed_months) is charged club_early_termination_fee_usd.
    replaced_by: >-
      The standard club cancellation settlement is club_early_termination_fee_usd when the club has fewer than club_min_term_months billed months and nothing otherwise, plus every club late-cancellation charge booked on the club, rounded half up to the cent once on the final amount.
  trigger: on_request
  subject: [groom_pass_cancel, groom_pass_refund]
  computes: settlement_usd
  target_tool: cancel_groom_club_74a11dc2
  params:
    one_month_etf_rate: 0.5
    billing_short_days: 3
    billing_notice_days: 7
    short_notice_multiplier: 1.2
    billing_notice_multiplier: 1.1
    plus_premier_etf_relief_pct: 50
    plus_etf_relief_pct: 25
    order_window_months: 12
    order_high_spend: 600
    order_mid_spend: 250
    order_min_lines: 3
    order_high_pct: 30
    order_mid_pct: 15
    usage_high_visits: 4
    usage_mid_visits: 2
    usage_high_pct: 20
    usage_mid_pct: 10
    relief_cap_pct: 100
    charge_single_share: 0.5
    charge_double_share: 0.75
    half_up_guard: 0.000001
  rule: >-
    This rule settles a Groom Club Monthly cancellation, which only the customer can make; prepaid passes are refunded
    under their own rule. Groom Club Monthly has no full-refund window: a club cancellation is never refunded in full and is
    settled under this rule. Groom Club Monthly is not refunded for the current month, and a club cancellation takes effect
    per club_cancel_effective, the club closing on its expires_on, the last day of the current billing month. The club cancellation
    settlement is not fixed until every cancellation on the club that is recorded with a fee remedy carries its club
    late-cancellation charge entry. A billed month is a monthly fee charged on the club after the month of joining. The
    standard club cancellation settlement is club_early_termination_fee_usd when the club has fewer than
    club_min_term_months billed months and nothing otherwise, plus every club late-cancellation charge booked on the club,
    rounded half up to the cent once on the final amount. The early termination method follows the billed months of a club
    that has fewer than club_min_term_months of them: at least two billed months prorate club_early_termination_fee_usd by
    the unbilled share of the minimum term, that is the fee times club_min_term_months minus the billed months, divided by
    club_min_term_months; exactly one billed month charges one_month_etf_rate of the fee; no billed month charges the whole
    fee. The billing-notice multiplier on the early termination fee follows the calendar days from the cancellation date to
    the club's next_billing_date: fewer than billing_short_days days takes short_notice_multiplier, billing_short_days to
    fewer than billing_notice_days days takes billing_notice_multiplier, and billing_notice_days days or more takes a
    multiplier of one. The Tailwise Plus relief on the early termination fee follows the customer's rewards membership in
    status active: Tailwise Plus Premier Annual gives plus_premier_etf_relief_pct percent, Tailwise Plus Monthly or Tailwise
    Plus Annual gives plus_etf_relief_pct percent, and a free Pals Rewards tier or no active membership gives none. The
    shopper relief on the early termination fee follows the customer's charged Tailwise order lines dated within the last
    order_window_months whole calendar months, returns and refunds not reducing them: a charged total of at least
    order_high_spend over at least order_min_lines lines gives order_high_pct percent, a charged total of at least
    order_mid_spend but less than order_high_spend over at least order_min_lines lines gives order_mid_pct percent, and any
    other case gives none. The usage relief on the early termination fee follows the completed visits recorded on the club:
    at least usage_high_visits give usage_high_pct percent, at least usage_mid_visits but fewer than usage_high_visits give
    usage_mid_pct percent, and fewer give none. The Tailwise Plus relief, the shopper relief and the usage relief are first
    added into one relief percentage, never above relief_cap_pct, and that combined percentage reduces the early
    termination fee once; the reliefs do not act one after the other. The share of the club late-cancellation charges
    collected in the settlement follows how many such charge entries the club carries: exactly one entry collects
    charge_single_share of the charges booked, exactly two collect charge_double_share of them, and none or three or more
    collect them in full. The early termination method fixes the fee, the billing-notice multiplier then multiplies that
    fee, the combined relief then reduces the result once, and the collected share of the club late-cancellation charges is
    then added; only the final amount is rounded, half up to the cent. Half up means a figure lying exactly on a half cent goes to the higher cent.
  prerequisite:
  - problem: groom_ext_club_late_cancel_charge
    kind: value_input
    gate: charges_booked
    form: state
    policy_source: >-
      The club cancellation settlement is not fixed until every cancellation on the club that is recorded with a fee remedy carries its club late-cancellation charge entry.
    condition: >-
      Every groom_appointment_cancel row of the club with late_cancel_remedy fee has a groom_late_cancel_fee row on the same club whose original_event_id is that cancellation's original_event_id.
    resolved_by: charge_club_late_cancel_73de6594
    effect: >-
      charges_booked grows by the club late-cancellation charge booked for the cancelled booking and the count of charge entries grows by one, so the collected share moves with them and the settlement rises accordingly.
  cross_category:
  - category: member
    as: branch
    reads: [status, variant_name]
    note: decides the Tailwise Plus relief tier on the early termination fee.
  - category: order
    as: history
    reads: [order_events.event_type, order_events.event_date, order_events.amount_usd]
    note: decides the shopper relief tier from the customer's charged order lines in the window.
  compute:
  - billed_months: "COUNT('groom_events', event_type='groom_club_billing')"
  - etf_fee: "P('club_early_termination_fee_usd')"
  - min_term: "P('club_min_term_months')"
  - etf_due: "0 if billed_months >= min_term else (etf_fee * (min_term - billed_months) / min_term if billed_months >= 2 else (etf_fee * K('one_month_etf_rate') if billed_months == 1 else etf_fee))"
  - days_to_billing: "DAYS(NOW, F('next_billing_date'))"
  - billing_mult: "K('short_notice_multiplier') if days_to_billing < K('billing_short_days') else (K('billing_notice_multiplier') if days_to_billing < K('billing_notice_days') else 1)"
  - club_member_tier: "CFIELD('member', 'variant_name', status='active')"
  - etf_plus_pct: "K('plus_premier_etf_relief_pct') if club_member_tier == 'Tailwise Plus Premier Annual' else (K('plus_etf_relief_pct') if (club_member_tier == 'Tailwise Plus Monthly' or club_member_tier == 'Tailwise Plus Annual') else 0)"
  - order_spend: "XSUM('order', 'order_events', 'amount_usd', within_months=K('order_window_months'), event_type='order_line_charge')"
  - order_lines: "XCOUNT('order', 'order_events', within_months=K('order_window_months'), event_type='order_line_charge')"
  - shopper_pct: "K('order_high_pct') if (order_spend >= K('order_high_spend') and order_lines >= K('order_min_lines')) else (K('order_mid_pct') if (order_spend >= K('order_mid_spend') and order_spend < K('order_high_spend') and order_lines >= K('order_min_lines')) else 0)"
  - club_visits: "COUNT('groom_events', event_type='groom_visit_complete')"
  - usage_pct: "K('usage_high_pct') if club_visits >= K('usage_high_visits') else (K('usage_mid_pct') if club_visits >= K('usage_mid_visits') else 0)"
  - etf_relief_pct: "MN(K('relief_cap_pct'), etf_plus_pct + shopper_pct + usage_pct)"
  - etf_part: "etf_due * billing_mult * (100 - etf_relief_pct) / 100"
  - charges_booked: "SUM('groom_events', 'amount_usd', event_type='groom_late_cancel_fee')"
  - charge_entries: "COUNT('groom_events', event_type='groom_late_cancel_fee')"
  - charge_share: "K('charge_single_share') if charge_entries == 1 else (K('charge_double_share') if charge_entries == 2 else 1)"
  - result: "RND(etf_part + charges_booked * charge_share + K('half_up_guard'), 2)"
  compute_basis:
    billed_months: "A billed month is a monthly fee charged on the club after the month of joining."
    etf_fee: "The standard club cancellation settlement is club_early_termination_fee_usd when the club has fewer than club_min_term_months billed months and nothing otherwise"
    min_term: "The standard club cancellation settlement is club_early_termination_fee_usd when the club has fewer than club_min_term_months billed months and nothing otherwise"
    etf_due: "at least two billed months prorate club_early_termination_fee_usd by the unbilled share of the minimum term, that is the fee times club_min_term_months minus the billed months, divided by club_min_term_months; exactly one billed month charges one_month_etf_rate of the fee; no billed month charges the whole fee."
    days_to_billing: "The billing-notice multiplier on the early termination fee follows the calendar days from the cancellation date to the club's next_billing_date"
    billing_mult: "fewer than billing_short_days days takes short_notice_multiplier, billing_short_days to fewer than billing_notice_days days takes billing_notice_multiplier, and billing_notice_days days or more takes a multiplier of one."
    club_member_tier: "The Tailwise Plus relief on the early termination fee follows the customer's rewards membership in status active"
    etf_plus_pct: "Tailwise Plus Premier Annual gives plus_premier_etf_relief_pct percent, Tailwise Plus Monthly or Tailwise Plus Annual gives plus_etf_relief_pct percent, and a free Pals Rewards tier or no active membership gives none."
    order_spend: "The shopper relief on the early termination fee follows the customer's charged Tailwise order lines dated within the last order_window_months whole calendar months, returns and refunds not reducing them"
    order_lines: "The shopper relief on the early termination fee follows the customer's charged Tailwise order lines dated within the last order_window_months whole calendar months, returns and refunds not reducing them"
    shopper_pct: "a charged total of at least order_high_spend over at least order_min_lines lines gives order_high_pct percent, a charged total of at least order_mid_spend but less than order_high_spend over at least order_min_lines lines gives order_mid_pct percent, and any other case gives none."
    club_visits: "The usage relief on the early termination fee follows the completed visits recorded on the club"
    usage_pct: "at least usage_high_visits give usage_high_pct percent, at least usage_mid_visits but fewer than usage_high_visits give usage_mid_pct percent, and fewer give none."
    etf_relief_pct: "The Tailwise Plus relief, the shopper relief and the usage relief are first added into one relief percentage, never above relief_cap_pct, and that combined percentage reduces the early termination fee once; the reliefs do not act one after the other."
    etf_part: "The early termination method fixes the fee, the billing-notice multiplier then multiplies that fee, the combined relief then reduces the result once"
    charges_booked: "plus every club late-cancellation charge booked on the club"
    charge_entries: "The share of the club late-cancellation charges collected in the settlement follows how many such charge entries the club carries"
    charge_share: "exactly one entry collects charge_single_share of the charges booked, exactly two collect charge_double_share of them, and none or three or more collect them in full."
    result: "and the collected share of the club late-cancellation charges is then added; only the final amount is rounded, half up to the cent. Half up means a figure lying exactly on a half cent goes to the higher cent."
  factors:
  - id: etf_method
    effect: method
    decides: etf_due
    bindings: [billed_months, etf_due]
    ladder:
    - when: at least two but fewer than club_min_term_months billed months
      method: the early termination fee is prorated by the unbilled share of the minimum term, fee times (club_min_term_months minus billed months) divided by club_min_term_months
    - when: exactly one billed month
      method: the early termination fee is multiplied by one_month_etf_rate
    - when: otherwise (no billed month)
      method: the whole early termination fee is charged
    baseline:
      etf_due: "0 if billed_months >= min_term else etf_fee"
    evidence: [history]
    cross_difficulty: null
  - id: billing_notice
    effect: parameter
    decides: billing_mult
    bindings: [days_to_billing, billing_mult]
    ladder:
    - when: fewer than billing_short_days calendar days from the cancellation date to next_billing_date
      value: K('short_notice_multiplier')
    - when: billing_short_days to fewer than billing_notice_days days to next_billing_date
      value: K('billing_notice_multiplier')
    - when: otherwise (billing_notice_days days or more)
      value: '1'
    baseline:
      billing_mult: '1'
    evidence: [date]
    cross_difficulty: null
  - id: etf_plus_relief
    effect: parameter
    decides: etf_plus_pct
    bindings: [club_member_tier, etf_plus_pct]
    ladder:
    - when: the active rewards membership is Tailwise Plus Premier Annual
      value: K('plus_premier_etf_relief_pct')
    - when: the active rewards membership is Tailwise Plus Monthly or Tailwise Plus Annual
      value: K('plus_etf_relief_pct')
    - when: otherwise (a free Pals Rewards tier or no active membership)
      value: '0'
    baseline:
      etf_plus_pct: '0'
    evidence: [cross_category]
    cross_difficulty: member
  - id: shopper_relief
    effect: parameter
    decides: shopper_pct
    bindings: [order_spend, order_lines, shopper_pct]
    ladder:
    - when: charged order lines in the last order_window_months months total at least order_high_spend AND number at least order_min_lines
      value: K('order_high_pct')
    - when: charged order lines total at least order_mid_spend but less than order_high_spend AND number at least order_min_lines
      value: K('order_mid_pct')
    - when: otherwise
      value: '0'
    baseline:
      shopper_pct: '0'
    evidence: [cross_category, history]
    cross_difficulty: order
  - id: usage_relief
    effect: parameter
    decides: usage_pct
    bindings: [club_visits, usage_pct]
    ladder:
    - when: at least usage_high_visits completed visits on the club
      value: K('usage_high_pct')
    - when: at least usage_mid_visits but fewer than usage_high_visits completed visits
      value: K('usage_mid_pct')
    - when: otherwise (fewer than usage_mid_visits)
      value: '0'
    baseline:
      usage_pct: '0'
    evidence: [history]
    cross_difficulty: null
  - id: charge_collection_share
    effect: parameter
    decides: charge_share
    bindings: [charge_entries, charge_share]
    ladder:
    - when: the club carries exactly one club late-cancellation charge entry
      value: K('charge_single_share')
    - when: the club carries exactly two such entries
      value: K('charge_double_share')
    - when: otherwise (none, or three or more)
      value: '1'
    baseline:
      charge_share: '1'
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      A billed month is a monthly fee charged on the club after the month of joining. The standard club cancellation
      settlement is club_early_termination_fee_usd when the club has fewer than club_min_term_months billed months and
      nothing otherwise, plus every club late-cancellation charge booked on the club, rounded half up to the cent once on
      the final amount.
    params: [club_early_termination_fee_usd, club_min_term_months]
  inputs:
    history:
    - {table: groom_events, aggregate: count, field: groom_event_id, filters: {event_type: groom_club_billing}}
    - {table: groom_events, aggregate: count, field: groom_event_id, filters: {event_type: groom_visit_complete}}
    - {table: groom_events, aggregate: sum, field: amount_usd, filters: {event_type: groom_late_cancel_fee}}
    - {category: order, table: order_events, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: order_line_charge}}
    - {category: order, table: order_events, aggregate: count, field: order_event_id, within_months: 12, filters: {event_type: order_line_charge}}
    cross_category: [member, order]
