category: order
display_name: Tailwise Online and In-Store Orders
binding:
  holding_table: orders
  event_tables: [order_events]
  intake_tables: [order_return_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    billed_total_usd: order_billed
lifecycle:
  states: [placed, shipped, ready_for_pickup, completed, cancelled]
  transitions:
  - from: placed
    to: shipped
    by: system
    means: the order leaves the warehouse or store with the carrier or driver
  - from: placed
    to: ready_for_pickup
    by: system
    means: the store has picked a pickup order
  - from: shipped
    to: completed
    by: system
    means: delivery is confirmed
  - from: ready_for_pickup
    to: completed
    by: system
    means: the order is handed over at the store or curb
  - from: placed
    to: cancelled
    by: user
    means: the customer cancels before fulfillment
  - from: ready_for_pickup
    to: cancelled
    by: user
    means: the customer cancels a waiting pickup order where allowed
  - from: ready_for_pickup
    to: cancelled
    by: system
    means: the pickup hold runs out
  - from: shipped
    to: cancelled
    by: system
    means: the carrier returns an undeliverable order
accounts:
- key: order_billed
  unit: USD
  meaning: 'net amount billed on the order: line and fee charges book in; cancellations, refunds and credits book
    out'
parameter_schema:
  fulfillment_fee_usd: shipping, delivery or freight fee per order for a customer whose tier threshold is not met;
    USD
  member_threshold_applies: whether the order's fulfillment fee is waived when the merchandise subtotal reaches
    the customer's Pals Rewards order_free_shipping_threshold_usd; boolean
  plus_member_fee_usd: fulfillment fee charged instead to a customer with an active Tailwise Plus tier; USD
  min_order_subtotal_usd: minimum merchandise subtotal for the method to be offered; USD
  promised_transit_business_days: business days after the order date by which delivery or pickup readiness is promised
    (0 = same day); integer, business days
  order_cutoff_time: store or warehouse local time after which an order counts as placed the next day for the promise;
    HH:MM
  pickup_ready_hours: hours after placement by which a pickup order is promised ready; integer, hours
  pickup_hold_days: calendar days a ready pickup order is held before it is cancelled and refunded; integer, days
  pickup_hold_extension_days: one-time extension of the pickup hold available on request; integer, days
  pickup_id_required: whether a government photo ID matching the order name or the named alternate person is required
    at pickup; boolean
  alternate_pickup_person_allowed: whether one alternate pickup person may be named on the order; boolean
  late_delivery_fee_refund: whether the fulfillment fee is refunded when delivery misses the promise; boolean
  late_delivery_grace_minutes: minutes after the promised delivery window end before a same-day delivery counts
    as late; integer, minutes
  cancel_while_ready_allowed: whether a ready-for-pickup order may still be cancelled by the customer; boolean
  address_change_before_ship_allowed: whether the delivery address may be changed before the order ships; boolean
  pickup_store_change_allowed: whether the pickup store may be changed before the order is ready; boolean
  max_quantity_per_line: largest quantity of one item on one order; integer, units
  frozen_food_allowed: whether frozen or refrigerated food can be ordered with this method; boolean
  substitution_allowed: whether an out-of-stock item may be substituted when the customer allowed substitutions;
    boolean
  substitution_price_rule: price charged for a substitute item; enum lower_of_original_and_substitute
  coupons_per_order_max: promotional coupons usable on one order; integer, count
  certificates_accepted: whether Pals Rewards certificates may be used on the order; boolean
  coupon_allocation_basis: how an order-level coupon is spread over lines for refunds; enum pro_rata_by_line_subtotal
  certificate_allocation_basis: how certificates are spread over lines for refunds; enum pro_rata_by_line_subtotal
  return_window_days_by_item_category: calendar days after the order was completed within which an item may be returned,
    by item category; mapping item_category -> days (0 = not returnable)
  holiday_return_extension: items from orders placed between purchased_from and purchased_to (month-day) may be
    returned until return_by of the following year when that is later; mapping
  opened_food_guarantee_days: calendar days after completion within which opened food or treats are refunded under
    the satisfaction guarantee; integer, days
  defective_return_window_days: calendar days after completion within which a defective item, including a final-sale
    item, may be returned; integer, days
  return_methods_allowed: ways a return may be made; list of mail_label | in_store | freight_pickup
  mail_return_label_fee_usd: fee deducted from the refund for a prepaid mail return label on a changed-mind return;
    USD
  plus_waives_return_label_fee: whether an active Tailwise Plus tier waives the mail return label fee; boolean
  freight_return_pickup_fee_usd: fee deducted for a freight pickup on a changed-mind return; USD
  restocking_fee_pct: share of the line refund withheld on a changed-mind return of an opened large item; number,
    percent
  return_fee_waived_reasons: return reasons for which no label, pickup or restocking fee is deducted; list
  rma_validity_days: calendar days after a return is authorized within which the item must be dropped at a store
    or handed to the carrier; integer, days
  refund_method: where a return refund is sent; enum original_payment
  refund_price_basis: amount refunded for a returned unit; enum price_paid_after_allocated_discounts
  shipping_refund_on_error_return: whether the fulfillment fee is refunded when every line is returned for a Tailwise
    error; boolean
  returnless_refund_max_usd: largest line refund that is given for a damaged or missing item without requiring the
    item back; USD
  damage_report_days: calendar days after completion within which damage is reported; integer, days
  missing_item_report_days: calendar days after completion within which a missing item is reported; integer, days
  replacement_allowed: whether a damaged, missing or wrong item may be replaced instead of refunded; boolean
  carrier_attempts_before_return: delivery attempts before the carrier returns the order to Tailwise; integer, count
  redelivery_fee_usd: fee for scheduling another freight delivery after the included attempts failed; USD
  return_to_sender_fee_refund: whether the fulfillment fee is refunded when an undeliverable order comes back; boolean
  fees_refunded_on_full_cancel: whether the fulfillment fee is refunded when the whole order is cancelled before
    fulfillment; boolean
  points_multiplier: multiplier on the Pals Rewards base earn rate for order merchandise; integer
  final_sale_returnable: whether items marked final sale may be returned other than as defective; boolean
  delivery_signature_required: whether the delivery requires a signature; boolean
