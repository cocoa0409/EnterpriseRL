    autoship_enrolled_months: >-
      The Autoship-tenure credit counts whole months since the enrollment of the customer's active Autoship subscription:
    autoship_tenure_credit: >-
      The Autoship-tenure credit counts whole months since the enrollment of the customer's active Autoship subscription:
      autoship_credit_long at autoship_months_long months or more, autoship_credit_mid at autoship_months_mid months or
      more but fewer than autoship_months_long, and nothing for a shorter run or no active subscription.
    result: >-
      This settlement applies when that authorization's reason is one of return_fee_waived_reasons (a Tailwise error); a
      return for any other reason is outside it and is refunded under the base return rule. The error-return refund is the
