  compute:
  - units_received_back: LATEST('order_return_requests', 'quantity', date_field='received_on', status='received')
  - received_reason: LATEST('order_return_requests', 'return_reason', date_field='received_on', status='received')
  - received_method: LATEST('order_return_requests', 'return_method', date_field='received_on', status='received')
  - received_date: LATEST('order_return_requests', 'received_on', date_field='received_on', status='received')
  - units_charged: SUM('order_events', 'quantity', event_type='order_line_charge')
  - line_amount_billed: SUM('order_events', 'amount_usd', event_type='order_line_charge')
  - discounts_allocated: >-
