  - unit_list_price: MAX('order_events', 'unit_price_usd', event_type='order_line_charge')
  - unit_price_paid: RND(line_amount_billed / units_charged, 2)
  - autoship_shipments_12m: XCOUNT('autoship', 'autoship_events', within_months=12, event_type='autoship_shipment_charge')
  - unit_refund_value: >-
