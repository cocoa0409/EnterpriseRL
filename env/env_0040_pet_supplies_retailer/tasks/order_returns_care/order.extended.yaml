        the damaged units are at least severity_share_mid but less than severity_share_high of the units charged
      value: K('severity_credit_mid')
    - when: otherwise
      value: '0'
    baseline:
      severity_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: late_arrival
    effect: parameter
    decides: late_arrival_credit
    bindings:
    - days_past_promise
    - late_arrival_credit
    ladder:
    - when: the order was completed late_days_long or more calendar days after its promised date
      value: K('late_credit_long')
    - when: completed at least one but fewer than late_days_long days after its promised date
      value: K('late_credit_short')
    - when: otherwise
      value: '0'
    baseline:
      late_arrival_credit: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: multi_issue
    effect: parameter
    decides: multi_issue_credit
    bindings:
    - other_issue_authorizations
    - multi_issue_credit
    ladder:
    - when: two or more other Tailwise-error authorizations on the order
      value: K('multi_issue_credit_two')
    - when: exactly one other Tailwise-error authorization on the order
      value: K('multi_issue_credit_one')
    - when: otherwise
      value: '0'
    baseline:
      multi_issue_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: subscriber_tenure
    effect: parameter
    decides: subscriber_credit
    bindings:
    - subscriber_months
    - subscriber_credit
    ladder:
    - when: the active Autoship subscription was enrolled subscriber_months_long or more whole months ago
      value: K('subscriber_credit_long')
    - when: enrolled at least subscriber_months_mid but fewer than subscriber_months_long whole months ago
      value: K('subscriber_credit_mid')
    - when: otherwise
      value: '0'
    baseline:
      subscriber_credit: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: autoship
  baseline:
    rule: >-
      The returnless damage credit is the damaged units times the damaged-unit value, plus the severity credit, the late-arrival
      credit, the multi-issue credit and the subscriber credit, added together and rounded half up to the cent once at the
      end. The price paid per unit is the amount billed on the order's line charges divided by the units charged on them,
      rounded half up to the cent. The standard damaged-unit value is the price paid per unit, and the severity credit,
      the late-arrival credit, the multi-issue credit and the subscriber credit are each nothing.
    params:
    - returnless_refund_max_usd
  inputs:
    history:
    - table: order_return_requests
      aggregate: latest
      field: quantity
      filters:
        status: rejected
        return_reason: damaged
    - table: order_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: order_line_charge
    - category: autoship
      table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 12
      filters:
        event_type: autoship_shipment_charge
    cross_category:
    - autoship
- id: order_ext_late_delivery_fee_refund
  base_policy_refs:
  - order_cancellation
  - order_delivery_promises
  - order_returns
  overwrite:
  - base_policy: order_delivery_promises
    superseded_clause: >-
      Where late_delivery_fee_refund is true and the order is completed after promised_date, or for Same-Day Delivery more
      than late_delivery_grace_minutes after promised_window_end, the fulfillment fee is refunded
    replaced_by: >-
      The late-delivery fee refund is the fulfillment fee charged on the order times the refund share, rounded half up to
      the cent once at the end, and never more than the fulfillment fee charged less the fulfillment fee already refunded.
  - base_policy: order_returns
    superseded_clause: >-
      The fulfillment fee is refunded only when every line is returned for a Tailwise error and shipping_refund_on_error_return
      is true.
    replaced_by: >-
      The error-settled share compares the units already refunded on return authorizations whose reason is damaged, defective,
      wrong_item or not_as_described, together with the units already given a damage credit, with the units charged on the
      order:
  trigger: on_request
  subject:
  - order_fee_refund
  computes: amount_usd
  target_tool: refund_order_fulfillment_fee_03b15c6d
  params:
    standard_refund_share: 0.25
    late_days_severe: 5
    late_share_severe: 0.8
    late_days_long: 3
    late_share_long: 0.4
    late_days_short: 2
    late_share_short: 0.3
    settled_ratio_high: 0.5
    settled_share_high: 0.25
    settled_share_low: 0.1
    issue_share_two: 0.1
    issue_share_one: 0.05
    patron_months_long: 36
    patron_share_long: 0.05
    patron_months_mid: 12
    patron_share_mid: 0.025
    basket_high_usd: 100.0
    basket_share_high: 0.1
    basket_mid_usd: 70.0
    basket_share_mid: 0.04
    claims_ships_loyal: 6
  rule: >-
    An order whose method has late_delivery_fee_refund true, that was completed after its promised date and that has no
    failed delivery attempt on record, receives a late-delivery fee refund; a delay caused by the customer's absence or
    a changed address is never late, and an order completed on or before its promised date receives none. The fulfillment
    fee is the fees charged on the order other than redelivery fees, and the fulfillment fee already refunded is the fee
    refunds on the order other than refunds of redelivery fees. The late-delivery fee refund is the fulfillment fee charged
    on the order times the refund share, rounded half up to the cent once at the end, and never more than the fulfillment
    fee charged less the fulfillment fee already refunded. The standard refund share is standard_refund_share. The days
    late are counted in calendar days from the promised date to the completed date. The refund share is the lateness share
    plus the error-settled share, the repeat-issue share, the Autoship-patron share and the basket share, all added together.
    The lateness share is late_share_severe for late_days_severe days late or more, late_share_long for at least late_days_long
    but fewer than late_days_severe days, late_share_short for exactly late_days_short days, and standard_refund_share for
    one day late. The fulfillment fee refund is not worked out until every return authorization on the order that has been
    received back for a Tailwise error carries its refund entry. Before the fulfillment fee refund is worked out, every
    damage report on the order that was declined because the damaged item stays with the customer must carry its returnless
    damage credit wherever the customer takes the money back rather than a replacement. The error-settled share compares
    the units already refunded on return authorizations whose reason is damaged, defective, wrong_item or not_as_described,
    together with the units already given a damage credit, with the units charged on the order: settled_share_high where
    they are settled_ratio_high of the units charged or more, settled_share_low where they are above zero but below settled_ratio_high,
    and nothing where none are. The repeat-issue share counts the return authorizations on the order, in any status, whose
    reason is damaged, defective, wrong_item or not_as_described: issue_share_two for two or more, issue_share_one for exactly
    one, and nothing for none. The Autoship-patron share counts whole months since the enrollment of the customer's active
    Autoship subscription: patron_share_long at patron_months_long months or more, patron_share_mid at patron_months_mid
    months or more but fewer than patron_months_long, and nothing for a shorter run or no active subscription. The basket
    share depends on the basket value: basket_share_high at basket_high_usd or more, basket_share_mid at basket_mid_usd
    or more but below basket_high_usd, and nothing below basket_mid_usd. The basket value is worked out from the order's
    line charges by the customer's Autoship record: where the customer had at least one Autoship claim refund in the last
    12 months and claims_ships_loyal or more Autoship shipments charged in the last 12 months, it is the line charges before
    their allocated coupon and certificate (the amount billed plus those discounts); where the customer had at least one
    such claim refund and at least one but fewer than claims_ships_loyal such shipments, it is the amount billed plus half
    of the allocated coupon and certificate; otherwise it is the amount billed on the line charges. The refund is booked
    against the fulfillment fee charge with that fee's kind and goes to the original payment.
  prerequisite:
  - problem: order_ext_error_return_refund
    kind: value_input
    gate: error_units_settled
    form: state
    policy_source: >-
      The fulfillment fee refund is not worked out until every return authorization on the order that has been received
      back for a Tailwise error carries its refund entry.
    condition: >-
      No return authorization on the order with a reason in return_fee_waived_reasons is left in status received: each such
      received authorization has its return refund entry on the order ledger referring to it, and its units count among
      the error-settled units.
    resolved_by: refund_error_return_9d87fcb3
    effect: >-
      The refund entry adds the received authorization's units to the error-settled units, raising the error-settled share.
  - problem: order_ext_returnless_damage_credit
    kind: value_input
    gate: error_units_settled
    form: state
    policy_source: >-
      Before the fulfillment fee refund is worked out, every damage report on the order that was declined because the damaged
      item stays with the customer must carry its returnless damage credit wherever the customer takes the money back rather
      than a replacement.
    condition: >-
      Each declined damage report on the order whose customer takes the money back has a damage credit entry on the order
      ledger for its line, so the damaged units count among the error-settled units.
    resolved_by: accept_returnless_damage_refund_2d82d69e
    effect: >-
      The damage credit adds the damaged units to the error-settled units, raising the error-settled share.
  cross_category:
  - category: autoship
    as: history
    reads:
    - enrolled_on
    - status
    - autoship_events.event_type
    note: >-
      the basket valuation and the Autoship-patron share are decided from the customer's Autoship claim refunds, charged
      shipments and subscription enrollment
  compute:
  - fulfillment_fee_charged: >-
      SUM('order_events', 'amount_usd', event_type='order_fee_charge') - SUM('order_events', 'amount_usd', event_type='order_fee_charge',
      fee_kind='redelivery')
  - fulfillment_fee_refunded: >-
      SUM('order_events', 'amount_usd', event_type='order_fee_refund') - SUM('order_events', 'amount_usd', event_type='order_fee_refund',
      fee_kind='redelivery')
  - days_late: DAYS(F('promised_date'), F('completed_date'))
  - lateness_share: >-
      K('late_share_severe') if days_late >= K('late_days_severe') else (K('late_share_long') if days_late >= K('late_days_long')
      else (K('late_share_short') if days_late == K('late_days_short') else K('standard_refund_share')))
  - order_units: SUM('order_events', 'quantity', event_type='order_line_charge')
  - error_units_settled: >-
      SUM('order_events', 'quantity', event_type='order_return_refund', return_reason='damaged') + SUM('order_events', 'quantity',
      event_type='order_return_refund', return_reason='defective') + SUM('order_events', 'quantity', event_type='order_return_refund',
      return_reason='wrong_item') + SUM('order_events', 'quantity', event_type='order_return_refund', return_reason='not_as_described')
      + SUM('order_events', 'quantity', event_type='order_damage_credit')
  - error_settled_share: >-
      K('settled_share_high') if error_units_settled >= K('settled_ratio_high') * order_units else (K('settled_share_low')
      if error_units_settled > 0 else 0)
  - issue_authorizations: >-
      COUNT('order_return_requests', return_reason='damaged') + COUNT('order_return_requests', return_reason='defective')
      + COUNT('order_return_requests', return_reason='wrong_item') + COUNT('order_return_requests', return_reason='not_as_described')
  - repeat_issue_share: >-
      K('issue_share_two') if issue_authorizations >= 2 else (K('issue_share_one') if issue_authorizations == 1 else 0)
  - patron_months: >-
      MONTHS(CFIELD('autoship', 'enrolled_on', status='active'), NOW) if EXISTS('autoship', status='active') else 0
  - patron_share: >-
      K('patron_share_long') if patron_months >= K('patron_months_long') else (K('patron_share_mid') if patron_months >=
      K('patron_months_mid') else 0)
  - basket_billed: SUM('order_events', 'amount_usd', event_type='order_line_charge')
  - claim_refunds_12m: XCOUNT('autoship', 'autoship_events', within_months=12, event_type='autoship_claim_refund')
  - claim_shipments_12m: XCOUNT('autoship', 'autoship_events', within_months=12, event_type='autoship_shipment_charge')
  - basket_discounts: >-
      SUM('order_events', 'coupon_discount_usd', event_type='order_line_charge') + SUM('order_events', 'certificate_applied_usd',
      event_type='order_line_charge')
  - basket_value_measured: >-
      basket_billed + basket_discounts if (claim_refunds_12m >= 1 and claim_shipments_12m >= K('claims_ships_loyal')) else
      (RND(basket_billed + basket_discounts / 2, 2) if (claim_refunds_12m >= 1 and claim_shipments_12m >= 1 and claim_shipments_12m
      < K('claims_ships_loyal')) else basket_billed)
  - basket_share: >-
      K('basket_share_high') if basket_value_measured >= K('basket_high_usd') else (K('basket_share_mid') if basket_value_measured
      >= K('basket_mid_usd') else 0)
  - refund_share: lateness_share + error_settled_share + repeat_issue_share + patron_share + basket_share
  - result: >-
      RND(MN(fulfillment_fee_charged - fulfillment_fee_refunded, fulfillment_fee_charged * refund_share), 2) if (P('late_delivery_fee_refund')
      and days_late >= 1 and F('delivery_attempts') == 0) else 0
  compute_basis:
    fulfillment_fee_charged: >-
      The fulfillment fee is the fees charged on the order other than redelivery fees, and the fulfillment fee already refunded
      is the fee refunds on the order other than refunds of redelivery fees.
    fulfillment_fee_refunded: >-
      The fulfillment fee is the fees charged on the order other than redelivery fees, and the fulfillment fee already refunded
      is the fee refunds on the order other than refunds of redelivery fees.
    days_late: The days late are counted in calendar days from the promised date to the completed date.
    lateness_share: >-
      The lateness share is late_share_severe for late_days_severe days late or more, late_share_long for at least late_days_long
      but fewer than late_days_severe days, late_share_short for exactly late_days_short days, and standard_refund_share
      for one day late.
    order_units: >-
      The error-settled share compares the units already refunded on return authorizations whose reason is damaged, defective,
      wrong_item or not_as_described, together with the units already given a damage credit, with the units charged on the
      order:
    error_units_settled: >-
      The error-settled share compares the units already refunded on return authorizations whose reason is damaged, defective,
      wrong_item or not_as_described, together with the units already given a damage credit, with the units charged on the
      order:
    error_settled_share: >-
      settled_share_high where they are settled_ratio_high of the units charged or more, settled_share_low where they are
      above zero but below settled_ratio_high, and nothing where none are.
    issue_authorizations: >-
      The repeat-issue share counts the return authorizations on the order, in any status, whose reason is damaged, defective,
      wrong_item or not_as_described: issue_share_two for two or more, issue_share_one for exactly one, and nothing for
      none.
    repeat_issue_share: >-
      The repeat-issue share counts the return authorizations on the order, in any status, whose reason is damaged, defective,
      wrong_item or not_as_described: issue_share_two for two or more, issue_share_one for exactly one, and nothing for
      none.
    patron_months: >-
      The Autoship-patron share counts whole months since the enrollment of the customer's active Autoship subscription:
    patron_share: >-
      The Autoship-patron share counts whole months since the enrollment of the customer's active Autoship subscription:
      patron_share_long at patron_months_long months or more, patron_share_mid at patron_months_mid months or more but fewer
      than patron_months_long, and nothing for a shorter run or no active subscription.
    basket_billed: >-
      The basket value is worked out from the order's line charges by the customer's Autoship record: where the customer
      had at least one Autoship claim refund in the last 12 months and claims_ships_loyal or more Autoship shipments charged
      in the last 12 months, it is the line charges before their allocated coupon and certificate (the amount billed plus
      those discounts); where the customer had at least one such claim refund and at least one but fewer than claims_ships_loyal
      such shipments, it is the amount billed plus half of the allocated coupon and certificate; otherwise it is the amount
      billed on the line charges.
    basket_share: >-
      The basket share depends on the basket value: basket_share_high at basket_high_usd or more, basket_share_mid at basket_mid_usd
      or more but below basket_high_usd, and nothing below basket_mid_usd.
    refund_share: >-
      The refund share is the lateness share plus the error-settled share, the repeat-issue share, the Autoship-patron share
      and the basket share, all added together.
    result: >-
      An order whose method has late_delivery_fee_refund true, that was completed after its promised date and that has no
      failed delivery attempt on record, receives a late-delivery fee refund; a delay caused by the customer's absence or
      a changed address is never late, and an order completed on or before its promised date receives none. The late-delivery
      fee refund is the fulfillment fee charged on the order times the refund share, rounded half up to the cent once at
      the end, and never more than the fulfillment fee charged less the fulfillment fee already refunded.
    claim_refunds_12m: >-
      The basket value is worked out from the order's line charges by the customer's Autoship record: where the customer
      had at least one Autoship claim refund in the last 12 months and claims_ships_loyal or more Autoship shipments charged
      in the last 12 months, it is the line charges before their allocated coupon and certificate (the amount billed plus
      those discounts); where the customer had at least one such claim refund and at least one but fewer than claims_ships_loyal
      such shipments, it is the amount billed plus half of the allocated coupon and certificate; otherwise it is the amount
      billed on the line charges.
    claim_shipments_12m: >-
      The basket value is worked out from the order's line charges by the customer's Autoship record: where the customer
      had at least one Autoship claim refund in the last 12 months and claims_ships_loyal or more Autoship shipments charged
      in the last 12 months, it is the line charges before their allocated coupon and certificate (the amount billed plus
      those discounts); where the customer had at least one such claim refund and at least one but fewer than claims_ships_loyal
      such shipments, it is the amount billed plus half of the allocated coupon and certificate; otherwise it is the amount
      billed on the line charges.
    basket_discounts: >-
      The basket value is worked out from the order's line charges by the customer's Autoship record: where the customer
      had at least one Autoship claim refund in the last 12 months and claims_ships_loyal or more Autoship shipments charged
      in the last 12 months, it is the line charges before their allocated coupon and certificate (the amount billed plus
      those discounts); where the customer had at least one such claim refund and at least one but fewer than claims_ships_loyal
      such shipments, it is the amount billed plus half of the allocated coupon and certificate; otherwise it is the amount
      billed on the line charges.
    basket_value_measured: >-
      The basket value is worked out from the order's line charges by the customer's Autoship record: where the customer
      had at least one Autoship claim refund in the last 12 months and claims_ships_loyal or more Autoship shipments charged
      in the last 12 months, it is the line charges before their allocated coupon and certificate (the amount billed plus
      those discounts); where the customer had at least one such claim refund and at least one but fewer than claims_ships_loyal
      such shipments, it is the amount billed plus half of the allocated coupon and certificate; otherwise it is the amount
      billed on the line charges.
  factors:
  - id: lateness
    effect: parameter
    decides: lateness_share
    bindings:
    - days_late
    - lateness_share
    ladder:
    - when: completed late_days_severe or more calendar days after the promised date
      value: K('late_share_severe')
    - when: completed at least late_days_long but fewer than late_days_severe days after the promised date
      value: K('late_share_long')
    - when: completed exactly late_days_short days after the promised date
      value: K('late_share_short')
    - when: otherwise
      value: K('standard_refund_share')
    baseline:
      lateness_share: K('standard_refund_share')
    evidence:
    - date
    cross_difficulty: null
  - id: error_settled
