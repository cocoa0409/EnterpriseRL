  rule: >-
    A damage report on file is a return authorization request with reason damaged that was declined (status rejected) because
    the damaged item stays with the customer; the latest such request on the order by requested date is the one settled,
    its units are the damaged units and its requested date is the report date. Where the customer chooses a refund rather
    than a free replacement, the damaged units are credited without the item coming back. The returnless damage credit is
    the damaged units times the damaged-unit value, plus the severity credit, the late-arrival credit, the multi-issue credit
    and the subscriber credit, added together and rounded half up to the cent once at the end. Where that sum is above returnless_refund_max_usd,
    no returnless damage credit is given and the item comes back under a return authorization instead. The price paid per
    unit is the amount billed on the order's line charges divided by the units charged on them, rounded half up to the cent.
    The standard damaged-unit value is the price paid per unit, and the severity credit, the late-arrival credit, the multi-issue
    credit and the subscriber credit are each nothing. The damaged-unit value depends on the report date and the customer's
    Autoship shipments: where the report date is no more than prompt_report_days calendar days after the completed date
    and loyal_ships or more Autoship shipments were charged to the customer in the last 12 months, it is the unit list price
    on the line charge; where the report date is no more than prompt_report_days days after the completed date and at least
    one but fewer than loyal_ships such shipments were charged, it is the price paid per unit plus half of the coupon and
    certificate allocated per unit charged, rounded half up to the cent; in every other case it is the price paid per unit.
    The severity credit compares the damaged units with the units charged on the order: severity_credit_high where they
    are severity_share_high of them or more, severity_credit_mid where they are at least severity_share_mid but less than
    severity_share_high, and nothing below severity_share_mid. The late-arrival credit counts calendar days from the order's
    promised date to its completed date: late_credit_long at late_days_long days or more, late_credit_short for at least
    one but fewer than late_days_long days, and nothing for an order completed on or before its promised date. The multi-issue
    credit counts the other return authorizations on the order, in any status, whose reason is damaged, defective, wrong_item
    or not_as_described: multi_issue_credit_two for two or more, multi_issue_credit_one for exactly one, and nothing for
    none. The subscriber credit counts whole months since the enrollment of the customer's active Autoship subscription:
    subscriber_credit_long at subscriber_months_long months or more, subscriber_credit_mid at subscriber_months_mid months
    or more but fewer than subscriber_months_long, and nothing for a shorter run or no active subscription. The credit is
    booked against the damaged line charge with reason damaged and goes to the original payment.
  prerequisite: []
  cross_category:
  - category: autoship
    as: history
    reads:
    - enrolled_on
    - status
    - autoship_events.event_type
    note: >-
      the damaged-unit value and the subscriber credit are decided from the customer's Autoship subscription and its charged
      shipments
  compute:
  - damaged_units_reported: >-
      LATEST('order_return_requests', 'quantity', date_field='requested_on', status='rejected', return_reason='damaged')
  - damage_report_date: >-
      LATEST('order_return_requests', 'requested_on', date_field='requested_on', status='rejected', return_reason='damaged')
  - order_units_charged: SUM('order_events', 'quantity', event_type='order_line_charge')
  - order_line_billed: SUM('order_events', 'amount_usd', event_type='order_line_charge')
  - order_discounts_allocated: >-
