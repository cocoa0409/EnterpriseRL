    - patron_share
    ladder:
    - when: the active Autoship subscription was enrolled patron_months_long or more whole months ago
      value: K('patron_share_long')
    - when: enrolled at least patron_months_mid but fewer than patron_months_long whole months ago
      value: K('patron_share_mid')
    - when: otherwise
