extended_policies:
- id: order_ext_freight_missed_appointment_refund
  base_policy_refs:
  - order_cancellation
  - order_delivery_promises
  - order_agg_fees
  overwrite: []
  trigger: state_due
  subject:
  - order_fee_refund
  computes: amount_usd
  target_tool: refund_freight_service_failure_8da9af3d
  params:
    standard_share: 0.2
    delay_days_long: 35
    delay_share_long: 0.4
    delay_days_mid: 28
    delay_share_mid: 0.3
    value_high_usd: 300.0
    value_share_high: 0.08
    value_mid_usd: 150.0
    value_share_mid: 0.04
    premier_multiplier: 2.0
    plus_multiplier: 1.5
    tenure_months_long: 96
    tenure_months_mid: 48
    autoship_tenure_long: 36
    autoship_tenure_mid: 12
    window_long_months: 24
    window_mid_months: 18
    window_standard_months: 12
    autoship_ships_high: 12
    autoship_share_high: 0.06
    autoship_ships_mid: 6
    autoship_share_mid: 0.02
  rule: >-
    A Large Item Freight Delivery order that is not yet completed and carries at least one missed paid appointment receives
    a service-failure refund against its freight fee. A paid appointment is a redelivery fee charged on the order. The number
    of missed paid appointments is the count of redelivery fees charged on the order, less the failed delivery attempts
    on record beyond carrier_attempts_before_return, less one more while the order's promised date (the date of the booked
    appointment) is today or later, and never below zero. An order of another method, a completed order and an order with
    no missed paid appointment receive no service-failure refund. The service-failure refund is the freight fee charged
    on the order times the service-failure share, rounded half up to the cent once at the end, and never more than the freight
    fee charged less the service-failure refunds already booked against it. The standard service-failure share is standard_share.
    The days the service-failure refund counts run in calendar days to today from the date of the missed appointment, which
    is the order's promised date. How far back those days reach depends on the whole months since the customer first joined
    Pals Rewards: at tenure_months_long months or more they are counted from the order's placed date instead; at tenure_months_mid
    months or more but fewer than tenure_months_long, from the date of the latest redelivery fee charged on the order instead;
    for a shorter membership or no membership, from the order's promised date. Where those days are delay_days_long or more,
    the service-failure share starts from delay_share_long instead of standard_share; where they are delay_days_mid or more
    but fewer than delay_days_long, it starts from delay_share_mid instead; with fewer than delay_days_mid days it starts
    from standard_share. Two further shares are then added to that starting share, all three being summed before any multiplication.
    The item-value share depends on the merchandise billed on the order (the line charges): value_share_high where it is
    value_high_usd or more, value_share_mid where it is at least value_mid_usd but below value_high_usd, and nothing below
    value_mid_usd. The Autoship share depends on the Autoship shipments charged to the customer within the Autoship look-back
    window: autoship_share_high for autoship_ships_high or more such shipments, autoship_share_mid for at least autoship_ships_mid
    but fewer than autoship_ships_high, and nothing below autoship_ships_mid. The Autoship look-back window is set by how
    long the customer's active Autoship subscription has run in whole months since its enrollment: the last window_long_months
    months where it has run autoship_tenure_long months or more, the last window_mid_months months where it has run at least
    autoship_tenure_mid but fewer than autoship_tenure_long months, and the last window_standard_months months otherwise,
    including for a customer with no active Autoship subscription. The freight fee times the summed share is then multiplied
    by the member multiplier before rounding: premier_multiplier for a Tailwise Plus Premier Annual tier in status active
    or pending_downgrade with a membership fee charged within the last 12 months, plus_multiplier for a Tailwise Plus Annual
    or Tailwise Plus Monthly tier in status active or pending_downgrade with a membership fee charged within the last 12
    months, and 1 for every other customer. The refund is booked against the freight fee charge and goes to the original
    payment.
  prerequisite: []
  cross_category:
  - category: member
    as: history
    reads:
    - variant_name
    - status
    - enrolled_on
    - member_events.event_type
    note: >-
      the member multiplier and the date the service-failure days are counted from are decided from the customer's Pals
      Rewards tier, status, enrollment date and recent membership fee charges
  - category: autoship
    as: history
    reads:
    - enrolled_on
    - status
    - autoship_events.event_type
    note: >-
      the Autoship share and its look-back window are decided from the customer's active Autoship subscription and its charged
      shipments
  compute:
  - freight_fee_charged: SUM('order_events', 'amount_usd', event_type='order_fee_charge', fee_kind='freight')
  - freight_service_refunded: SUM('order_events', 'amount_usd', event_type='order_fee_refund', fee_kind='freight')
  - redelivery_fees_charged: COUNT('order_events', event_type='order_fee_charge', fee_kind='redelivery')
  - attempts_beyond_included: MX(0, F('delivery_attempts') - P('carrier_attempts_before_return'))
  - missed_paid_appointments: >-
      MX(0, redelivery_fees_charged - attempts_beyond_included - (1 if DAYS(F('promised_date'), NOW) <= 0 else 0))
  - membership_months: MONTHS(CFIELD('member', 'enrolled_on'), NOW) if EXISTS('member') else 0
  - delay_anchor_date: >-
      F('placed_on') if membership_months >= K('tenure_months_long') else (LATEST('order_events', 'event_date', event_type='order_fee_charge',
      fee_kind='redelivery') if membership_months >= K('tenure_months_mid') else F('promised_date'))
  - refund_days_counted: DAYS(delay_anchor_date, NOW)
  - starting_share: >-
      K('delay_share_long') if refund_days_counted >= K('delay_days_long') else (K('delay_share_mid') if refund_days_counted
      >= K('delay_days_mid') else K('standard_share'))
  - merchandise_billed: SUM('order_events', 'amount_usd', event_type='order_line_charge')
  - item_value_share: >-
      K('value_share_high') if merchandise_billed >= K('value_high_usd') else (K('value_share_mid') if merchandise_billed
      >= K('value_mid_usd') else 0)
  - autoship_run_months: >-
      MONTHS(CFIELD('autoship', 'enrolled_on', status='active'), NOW) if EXISTS('autoship', status='active') else 0
  - autoship_window_months: >-
      K('window_long_months') if autoship_run_months >= K('autoship_tenure_long') else (K('window_mid_months') if autoship_run_months
      >= K('autoship_tenure_mid') else K('window_standard_months'))
  - autoship_shipments_in_window: >-
      XCOUNT('autoship', 'autoship_events', within_months=autoship_window_months, event_type='autoship_shipment_charge')
  - autoship_share: >-
      K('autoship_share_high') if autoship_shipments_in_window >= K('autoship_ships_high') else (K('autoship_share_mid')
      if autoship_shipments_in_window >= K('autoship_ships_mid') else 0)
  - member_tier: CFIELD('member', 'variant_name')
  - member_status: CFIELD('member', 'status')
  - membership_fees_12m: XCOUNT('member', 'member_events', within_months=12, event_type='member_fee_charge')
  - member_multiplier: >-
      K('premier_multiplier') if (member_tier == 'Tailwise Plus Premier Annual' and (member_status == 'active' or member_status
      == 'pending_downgrade') and membership_fees_12m >= 1) else (K('plus_multiplier') if ((member_tier == 'Tailwise Plus
      Annual' or member_tier == 'Tailwise Plus Monthly') and (member_status == 'active' or member_status == 'pending_downgrade')
      and membership_fees_12m >= 1) else 1)
  - service_failure_share: starting_share + item_value_share + autoship_share
  - result: >-
      RND(MN(freight_fee_charged - freight_service_refunded, freight_fee_charged * service_failure_share * member_multiplier),
      2) if (F('variant_name') == 'Large Item Freight Delivery' and F('status') != 'completed' and missed_paid_appointments
      >= 1) else 0
  compute_basis:
    freight_fee_charged: >-
      The service-failure refund is the freight fee charged on the order times the service-failure share, rounded half up
      to the cent once at the end, and never more than the freight fee charged less the service-failure refunds already
      booked against it.
    freight_service_refunded: >-
      The service-failure refund is the freight fee charged on the order times the service-failure share, rounded half up
      to the cent once at the end, and never more than the freight fee charged less the service-failure refunds already
      booked against it.
    redelivery_fees_charged: A paid appointment is a redelivery fee charged on the order.
    attempts_beyond_included: >-
      The number of missed paid appointments is the count of redelivery fees charged on the order, less the failed delivery
      attempts on record beyond carrier_attempts_before_return, less one more while the order's promised date (the date
      of the booked appointment) is today or later, and never below zero.
    missed_paid_appointments: >-
      The number of missed paid appointments is the count of redelivery fees charged on the order, less the failed delivery
      attempts on record beyond carrier_attempts_before_return, less one more while the order's promised date (the date
      of the booked appointment) is today or later, and never below zero.
    membership_months: >-
      How far back those days reach depends on the whole months since the customer first joined Pals Rewards: at tenure_months_long
      months or more they are counted from the order's placed date instead; at tenure_months_mid months or more but fewer
      than tenure_months_long, from the date of the latest redelivery fee charged on the order instead; for a shorter membership
      or no membership, from the order's promised date.
    delay_anchor_date: >-
      How far back those days reach depends on the whole months since the customer first joined Pals Rewards: at tenure_months_long
      months or more they are counted from the order's placed date instead; at tenure_months_mid months or more but fewer
      than tenure_months_long, from the date of the latest redelivery fee charged on the order instead; for a shorter membership
      or no membership, from the order's promised date.
    refund_days_counted: >-
      The days the service-failure refund counts run in calendar days to today from the date of the missed appointment,
      which is the order's promised date.
    starting_share: >-
      Where those days are delay_days_long or more, the service-failure share starts from delay_share_long instead of standard_share;
      where they are delay_days_mid or more but fewer than delay_days_long, it starts from delay_share_mid instead; with
      fewer than delay_days_mid days it starts from standard_share.
    merchandise_billed: >-
      The item-value share depends on the merchandise billed on the order (the line charges): value_share_high where it
      is value_high_usd or more, value_share_mid where it is at least value_mid_usd but below value_high_usd, and nothing
      below value_mid_usd.
    item_value_share: >-
      The item-value share depends on the merchandise billed on the order (the line charges): value_share_high where it
      is value_high_usd or more, value_share_mid where it is at least value_mid_usd but below value_high_usd, and nothing
      below value_mid_usd.
    autoship_run_months: >-
      The Autoship look-back window is set by how long the customer's active Autoship subscription has run in whole months
      since its enrollment: the last window_long_months months where it has run autoship_tenure_long months or more, the
      last window_mid_months months where it has run at least autoship_tenure_mid but fewer than autoship_tenure_long months,
      and the last window_standard_months months otherwise, including for a customer with no active Autoship subscription.
    autoship_window_months: >-
      The Autoship look-back window is set by how long the customer's active Autoship subscription has run in whole months
      since its enrollment: the last window_long_months months where it has run autoship_tenure_long months or more, the
      last window_mid_months months where it has run at least autoship_tenure_mid but fewer than autoship_tenure_long months,
      and the last window_standard_months months otherwise, including for a customer with no active Autoship subscription.
    autoship_shipments_in_window: >-
      The Autoship share depends on the Autoship shipments charged to the customer within the Autoship look-back window:
      autoship_share_high for autoship_ships_high or more such shipments, autoship_share_mid for at least autoship_ships_mid
      but fewer than autoship_ships_high, and nothing below autoship_ships_mid.
    autoship_share: >-
      The Autoship share depends on the Autoship shipments charged to the customer within the Autoship look-back window:
      autoship_share_high for autoship_ships_high or more such shipments, autoship_share_mid for at least autoship_ships_mid
      but fewer than autoship_ships_high, and nothing below autoship_ships_mid.
    member_tier: >-
      The freight fee times the summed share is then multiplied by the member multiplier before rounding: premier_multiplier
      for a Tailwise Plus Premier Annual tier in status active or pending_downgrade with a membership fee charged within
      the last 12 months, plus_multiplier for a Tailwise Plus Annual or Tailwise Plus Monthly tier in status active or pending_downgrade
      with a membership fee charged within the last 12 months, and 1 for every other customer.
    member_status: >-
      The freight fee times the summed share is then multiplied by the member multiplier before rounding: premier_multiplier
      for a Tailwise Plus Premier Annual tier in status active or pending_downgrade with a membership fee charged within
      the last 12 months, plus_multiplier for a Tailwise Plus Annual or Tailwise Plus Monthly tier in status active or pending_downgrade
      with a membership fee charged within the last 12 months, and 1 for every other customer.
    membership_fees_12m: >-
      The freight fee times the summed share is then multiplied by the member multiplier before rounding: premier_multiplier
      for a Tailwise Plus Premier Annual tier in status active or pending_downgrade with a membership fee charged within
      the last 12 months, plus_multiplier for a Tailwise Plus Annual or Tailwise Plus Monthly tier in status active or pending_downgrade
      with a membership fee charged within the last 12 months, and 1 for every other customer.
    member_multiplier: >-
      The freight fee times the summed share is then multiplied by the member multiplier before rounding: premier_multiplier
      for a Tailwise Plus Premier Annual tier in status active or pending_downgrade with a membership fee charged within
      the last 12 months, plus_multiplier for a Tailwise Plus Annual or Tailwise Plus Monthly tier in status active or pending_downgrade
      with a membership fee charged within the last 12 months, and 1 for every other customer.
    service_failure_share: >-
      Two further shares are then added to that starting share, all three being summed before any multiplication.
    result: >-
      A Large Item Freight Delivery order that is not yet completed and carries at least one missed paid appointment receives
      a service-failure refund against its freight fee. An order of another method, a completed order and an order with
      no missed paid appointment receive no service-failure refund. The service-failure refund is the freight fee charged
      on the order times the service-failure share, rounded half up to the cent once at the end, and never more than the
      freight fee charged less the service-failure refunds already booked against it.
  factors:
  - id: undelivered_days
    effect: parameter
    decides: starting_share
    bindings:
    - refund_days_counted
    - starting_share
    ladder:
    - when: the days the service-failure refund counts are delay_days_long or more
      value: K('delay_share_long')
    - when: those days are at least delay_days_mid but fewer than delay_days_long
      value: K('delay_share_mid')
    - when: otherwise
      value: K('standard_share')
    baseline:
      starting_share: K('standard_share')
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: delay_clock_anchor
    effect: method
    decides: delay_anchor_date
    bindings:
    - membership_months
    - delay_anchor_date
    ladder:
    - when: the customer first joined Pals Rewards tenure_months_long or more whole months ago
      method: the days the service-failure refund counts are counted from the order's placed date
    - when: >-
        the customer first joined Pals Rewards at least tenure_months_mid but fewer than tenure_months_long whole months
        ago
      method: the days are counted from the date of the latest redelivery fee charged on the order
    - when: otherwise
      method: the days are counted from the order's promised date (the missed appointment)
    baseline:
      delay_anchor_date: F('promised_date')
    evidence:
    - cross_category
    - date
    - history
    cross_difficulty: member
  - id: item_value
    effect: parameter
    decides: item_value_share
    bindings:
    - merchandise_billed
    - item_value_share
    ladder:
    - when: the line charges on the order total value_high_usd or more
      value: K('value_share_high')
    - when: the line charges total at least value_mid_usd but below value_high_usd
      value: K('value_share_mid')
    - when: otherwise
      value: '0'
    baseline:
      item_value_share: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: autoship_window
    effect: parameter
    decides: autoship_window_months
    bindings:
    - autoship_run_months
    - autoship_window_months
    ladder:
    - when: the customer's active Autoship subscription has run autoship_tenure_long or more whole months
      value: K('window_long_months')
    - when: >-
        the active Autoship subscription has run at least autoship_tenure_mid but fewer than autoship_tenure_long whole
        months
      value: K('window_mid_months')
    - when: otherwise
      value: K('window_standard_months')
    baseline:
      autoship_window_months: K('window_standard_months')
    evidence:
    - cross_category
    - history
    cross_difficulty: autoship
  - id: autoship_volume
    effect: parameter
    decides: autoship_share
    bindings:
    - autoship_shipments_in_window
    - autoship_share
    ladder:
    - when: autoship_ships_high or more Autoship shipments charged within the look-back window
      value: K('autoship_share_high')
    - when: at least autoship_ships_mid but fewer than autoship_ships_high such shipments
      value: K('autoship_share_mid')
    - when: otherwise
      value: '0'
    baseline:
      autoship_share: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: autoship
  - id: plus_member_multiplier
    effect: parameter
    decides: member_multiplier
    bindings:
    - member_tier
    - member_status
    - membership_fees_12m
    - member_multiplier
    ladder:
    - when: >-
        a Tailwise Plus Premier Annual tier in status active or pending_downgrade AND a membership fee charged within the
        last 12 months
      value: K('premier_multiplier')
    - when: >-
        a Tailwise Plus Annual or Tailwise Plus Monthly tier in status active or pending_downgrade AND a membership fee
        charged within the last 12 months
      value: K('plus_multiplier')
    - when: otherwise
      value: '1'
    baseline:
      member_multiplier: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: member
  baseline:
    rule: >-
      The service-failure refund is the freight fee charged on the order times the service-failure share, rounded half up
      to the cent once at the end, and never more than the freight fee charged less the service-failure refunds already
      booked against it. The standard service-failure share is standard_share. The days the service-failure refund counts
      run in calendar days to today from the date of the missed appointment, which is the order's promised date.
    params:
    - standard_share
  inputs:
    history:
    - table: order_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: order_fee_charge
        fee_kind: freight
    - table: order_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: order_fee_refund
        fee_kind: freight
    - table: order_events
      aggregate: count
      field: order_event_id
      filters:
        event_type: order_fee_charge
        fee_kind: redelivery
    - table: order_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: order_line_charge
    - category: member
      table: member_events
      aggregate: count
      field: member_event_id
      within_months: 12
      filters:
        event_type: member_fee_charge
    - category: autoship
      table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 24
      filters:
        event_type: autoship_shipment_charge
    cross_category:
    - member
    - autoship
- id: order_ext_freight_rebooked_redelivery_fee
  base_policy_refs:
  - order_agg_fees
  - order_delivery_promises
  overwrite:
  - base_policy: order_delivery_promises
    superseded_clause: A freight order whose included attempts failed may be redelivered for redelivery_fee_usd
    replaced_by: >-
      A Large Item Freight Delivery order whose included delivery attempts have failed, its failed attempts on record being
      at least carrier_attempts_before_return, is rebooked for another delivery when the customer pays the rebooking fee;
      an order of another method, or one whose included attempts have not all failed, is not rebooked for a fee.
  trigger: on_request
  subject:
  - order_fee_charge
  computes: amount_usd
  target_tool: book_paid_freight_redelivery_0935dc22
  params:
    second_booking_fee: 59.0
    third_booking_fee: 69.0
    crew_value_high_usd: 400.0
    crew_surcharge_high: 25.0
    crew_value_mid_usd: 200.0
    crew_surcharge_mid: 15.0
    premier_rate: 0.5
    plus_rate: 0.75
    age_days_long: 35
    age_factor_long: 0.6
    age_days_mid: 28
    age_factor_mid: 0.8
  rule: >-
    A Large Item Freight Delivery order whose included delivery attempts have failed, its failed attempts on record being
    at least carrier_attempts_before_return, is rebooked for another delivery when the customer pays the rebooking fee;
    an order of another method, or one whose included attempts have not all failed, is not rebooked for a fee. The rebooking
    fee is the effective booking fee plus the crew surcharge, multiplied by the member rate and then by the open-order factor,
    rounded half up to the cent once at the end. The standard booking fee is redelivery_fee_usd and is charged as it stands,
    with no crew surcharge, a member rate of 1 and an open-order factor of 1. The booking fee depends on the redelivery
    fees already charged on the order: third_booking_fee where two or more have been charged, second_booking_fee where exactly
    one has been charged, and redelivery_fee_usd where none has. The crew surcharge depends on the merchandise billed on
    the order (the line charges): crew_surcharge_high where it is crew_value_high_usd or more, crew_surcharge_mid where
    it is at least crew_value_mid_usd but below crew_value_high_usd, and none below crew_value_mid_usd. The member rate
    is premier_rate for a Tailwise Plus Premier Annual tier in status active or pending_downgrade with a membership fee
    charged within the last 12 months, plus_rate for a Tailwise Plus Annual or Tailwise Plus Monthly tier in status active
    or pending_downgrade with a membership fee charged within the last 12 months, and 1 otherwise. The fee for a rebooked
    freight redelivery is fixed only after the order's freight fee carries the service-failure refund owed for the paid
    appointments the carrier did not keep. A paid appointment the carrier did not keep is one of the redelivery fees charged
    on the order beyond the failed delivery attempts on record past carrier_attempts_before_return, its booked date (the
    order's promised date) having passed. Where the freight fee carries a service-failure refund and two or more paid appointments
    were not kept, the booking fee is waived and only the crew surcharge is charged; where it carries a service-failure
    refund and exactly one paid appointment was not kept, the redelivery fee charged for that appointment (the latest redelivery
    fee on the order) is credited against the booking fee, never below zero; otherwise the booking fee is charged as it
    stands. The open-order factor counts calendar days from the order's placed date to today: age_factor_long at age_days_long
    days or more, age_factor_mid at age_days_mid days or more but fewer than age_days_long, and 1 below age_days_mid. The
    customer pays the rebooking fee to the card on file and names the new appointment date, which becomes the order's promised
    date.
  prerequisite:
  - problem: order_ext_freight_missed_appointment_refund
    kind: value_input
    gate: effective_booking_fee
    form: state
    policy_source: >-
      The fee for a rebooked freight redelivery is fixed only after the order's freight fee carries the service-failure
      refund owed for the paid appointments the carrier did not keep.
    condition: >-
      The order's ledger holds a fee refund of kind freight referring to the freight fee charge, booked for the paid appointments
      the carrier did not keep, so the freight service-failure refund total on the order is above zero.
    resolved_by: refund_freight_service_failure_8da9af3d
    effect: >-
      Once the freight fee carries the service-failure refund, the effective booking fee stops being the booking fee as
      it stands: with one paid appointment not kept the redelivery fee charged for it is credited against the booking fee,
      with two or more the booking fee is waived.
  cross_category:
  - category: member
    as: branch
    reads:
    - variant_name
    - status
    - member_events.event_type
    note: >-
      the member rate is decided from the customer's Pals Rewards tier and status and the membership fees charged in the
      last 12 months
  compute:
  - redelivery_fees_on_order: COUNT('order_events', event_type='order_fee_charge', fee_kind='redelivery')
  - booking_fee: >-
      K('third_booking_fee') if redelivery_fees_on_order >= 2 else (K('second_booking_fee') if redelivery_fees_on_order
      == 1 else P('redelivery_fee_usd'))
  - line_charges_billed: SUM('order_events', 'amount_usd', event_type='order_line_charge')
  - crew_surcharge: >-
      K('crew_surcharge_high') if line_charges_billed >= K('crew_value_high_usd') else (K('crew_surcharge_mid') if line_charges_billed
      >= K('crew_value_mid_usd') else 0)
  - rewards_tier: CFIELD('member', 'variant_name')
  - rewards_status: CFIELD('member', 'status')
  - rewards_fees_12m: XCOUNT('member', 'member_events', within_months=12, event_type='member_fee_charge')
  - member_rate: >-
      K('premier_rate') if (rewards_tier == 'Tailwise Plus Premier Annual' and (rewards_status == 'active' or rewards_status
      == 'pending_downgrade') and rewards_fees_12m >= 1) else (K('plus_rate') if ((rewards_tier == 'Tailwise Plus Annual'
      or rewards_tier == 'Tailwise Plus Monthly') and (rewards_status == 'active' or rewards_status == 'pending_downgrade')
      and rewards_fees_12m >= 1) else 1)
  - freight_service_refund_total: SUM('order_events', 'amount_usd', event_type='order_fee_refund', fee_kind='freight')
  - attempts_past_included: MX(0, F('delivery_attempts') - P('carrier_attempts_before_return'))
  - appointments_not_kept: >-
      MX(0, redelivery_fees_on_order - attempts_past_included - (1 if DAYS(F('promised_date'), NOW) <= 0 else 0))
  - latest_redelivery_fee: >-
      LATEST('order_events', 'amount_usd', event_type='order_fee_charge', fee_kind='redelivery') if redelivery_fees_on_order
      >= 1 else 0
  - effective_booking_fee: >-
      0 if (freight_service_refund_total > 0 and appointments_not_kept >= 2) else (MX(0, booking_fee - latest_redelivery_fee)
      if (freight_service_refund_total > 0 and appointments_not_kept == 1) else booking_fee)
  - rebooking_days_counted: DAYS(F('placed_on'), NOW)
  - open_order_factor: >-
      K('age_factor_long') if rebooking_days_counted >= K('age_days_long') else (K('age_factor_mid') if rebooking_days_counted
      >= K('age_days_mid') else 1)
  - result: >-
      RND((effective_booking_fee + crew_surcharge) * member_rate * open_order_factor, 2) if (F('variant_name') == 'Large
      Item Freight Delivery' and F('delivery_attempts') >= P('carrier_attempts_before_return')) else 0
  compute_basis:
    redelivery_fees_on_order: >-
      The booking fee depends on the redelivery fees already charged on the order: third_booking_fee where two or more have
      been charged, second_booking_fee where exactly one has been charged, and redelivery_fee_usd where none has.
    booking_fee: >-
      The booking fee depends on the redelivery fees already charged on the order: third_booking_fee where two or more have
      been charged, second_booking_fee where exactly one has been charged, and redelivery_fee_usd where none has.
    line_charges_billed: >-
      The crew surcharge depends on the merchandise billed on the order (the line charges): crew_surcharge_high where it
      is crew_value_high_usd or more, crew_surcharge_mid where it is at least crew_value_mid_usd but below crew_value_high_usd,
      and none below crew_value_mid_usd.
    crew_surcharge: >-
      The crew surcharge depends on the merchandise billed on the order (the line charges): crew_surcharge_high where it
      is crew_value_high_usd or more, crew_surcharge_mid where it is at least crew_value_mid_usd but below crew_value_high_usd,
      and none below crew_value_mid_usd.
    rewards_tier: >-
      The member rate is premier_rate for a Tailwise Plus Premier Annual tier in status active or pending_downgrade with
      a membership fee charged within the last 12 months, plus_rate for a Tailwise Plus Annual or Tailwise Plus Monthly
      tier in status active or pending_downgrade with a membership fee charged within the last 12 months, and 1 otherwise.
    rewards_status: >-
      The member rate is premier_rate for a Tailwise Plus Premier Annual tier in status active or pending_downgrade with
      a membership fee charged within the last 12 months, plus_rate for a Tailwise Plus Annual or Tailwise Plus Monthly
      tier in status active or pending_downgrade with a membership fee charged within the last 12 months, and 1 otherwise.
    rewards_fees_12m: >-
      The member rate is premier_rate for a Tailwise Plus Premier Annual tier in status active or pending_downgrade with
      a membership fee charged within the last 12 months, plus_rate for a Tailwise Plus Annual or Tailwise Plus Monthly
      tier in status active or pending_downgrade with a membership fee charged within the last 12 months, and 1 otherwise.
    member_rate: >-
      The member rate is premier_rate for a Tailwise Plus Premier Annual tier in status active or pending_downgrade with
      a membership fee charged within the last 12 months, plus_rate for a Tailwise Plus Annual or Tailwise Plus Monthly
      tier in status active or pending_downgrade with a membership fee charged within the last 12 months, and 1 otherwise.
    freight_service_refund_total: >-
      Where the freight fee carries a service-failure refund and two or more paid appointments were not kept, the booking
      fee is waived and only the crew surcharge is charged; where it carries a service-failure refund and exactly one paid
      appointment was not kept, the redelivery fee charged for that appointment (the latest redelivery fee on the order)
      is credited against the booking fee, never below zero; otherwise the booking fee is charged as it stands.
    attempts_past_included: >-
      A paid appointment the carrier did not keep is one of the redelivery fees charged on the order beyond the failed delivery
      attempts on record past carrier_attempts_before_return, its booked date (the order's promised date) having passed.
    appointments_not_kept: >-
      A paid appointment the carrier did not keep is one of the redelivery fees charged on the order beyond the failed delivery
      attempts on record past carrier_attempts_before_return, its booked date (the order's promised date) having passed.
    latest_redelivery_fee: >-
      Where the freight fee carries a service-failure refund and two or more paid appointments were not kept, the booking
      fee is waived and only the crew surcharge is charged; where it carries a service-failure refund and exactly one paid
      appointment was not kept, the redelivery fee charged for that appointment (the latest redelivery fee on the order)
      is credited against the booking fee, never below zero; otherwise the booking fee is charged as it stands.
    effective_booking_fee: >-
      Where the freight fee carries a service-failure refund and two or more paid appointments were not kept, the booking
      fee is waived and only the crew surcharge is charged; where it carries a service-failure refund and exactly one paid
      appointment was not kept, the redelivery fee charged for that appointment (the latest redelivery fee on the order)
      is credited against the booking fee, never below zero; otherwise the booking fee is charged as it stands.
    rebooking_days_counted: >-
      The open-order factor counts calendar days from the order's placed date to today: age_factor_long at age_days_long
      days or more, age_factor_mid at age_days_mid days or more but fewer than age_days_long, and 1 below age_days_mid.
    open_order_factor: >-
      The open-order factor counts calendar days from the order's placed date to today: age_factor_long at age_days_long
      days or more, age_factor_mid at age_days_mid days or more but fewer than age_days_long, and 1 below age_days_mid.
    result: >-
      A Large Item Freight Delivery order whose included delivery attempts have failed, its failed attempts on record being
      at least carrier_attempts_before_return, is rebooked for another delivery when the customer pays the rebooking fee;
      an order of another method, or one whose included attempts have not all failed, is not rebooked for a fee. The rebooking
      fee is the effective booking fee plus the crew surcharge, multiplied by the member rate and then by the open-order
      factor, rounded half up to the cent once at the end.
  factors:
  - id: repeat_booking
    effect: parameter
    decides: booking_fee
    bindings:
    - redelivery_fees_on_order
    - booking_fee
    ladder:
    - when: two or more redelivery fees already charged on the order
      value: K('third_booking_fee')
    - when: exactly one redelivery fee already charged on the order
      value: K('second_booking_fee')
    - when: otherwise
      value: P('redelivery_fee_usd')
    baseline:
      booking_fee: P('redelivery_fee_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: crew_handling
    effect: parameter
    decides: crew_surcharge
    bindings:
    - line_charges_billed
    - crew_surcharge
    ladder:
    - when: line charges on the order total crew_value_high_usd or more
      value: K('crew_surcharge_high')
    - when: line charges total at least crew_value_mid_usd but below crew_value_high_usd
      value: K('crew_surcharge_mid')
    - when: otherwise
      value: '0'
    baseline:
      crew_surcharge: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: plus_rebooking_rate
    effect: parameter
    decides: member_rate
    bindings:
    - rewards_tier
    - rewards_status
    - rewards_fees_12m
    - member_rate
    ladder:
    - when: >-
        a Tailwise Plus Premier Annual tier in status active or pending_downgrade AND a membership fee charged within the
        last 12 months
      value: K('premier_rate')
    - when: >-
        a Tailwise Plus Annual or Tailwise Plus Monthly tier in status active or pending_downgrade AND a membership fee
        charged within the last 12 months
      value: K('plus_rate')
    - when: otherwise
      value: '1'
    baseline:
      member_rate: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: member
  - id: carrier_fault
    effect: method
    decides: effective_booking_fee
    bindings:
    - freight_service_refund_total
    - attempts_past_included
    - appointments_not_kept
    - latest_redelivery_fee
    - effective_booking_fee
    ladder:
    - when: the freight fee carries a service-failure refund AND two or more paid appointments were not kept
      method: the booking fee is waived and only the crew surcharge is charged
    - when: the freight fee carries a service-failure refund AND exactly one paid appointment was not kept
      method: >-
        the redelivery fee charged for that appointment (the latest redelivery fee on the order) is credited against the
        booking fee, never below zero
    - when: otherwise
      method: the booking fee is charged as it stands
    baseline:
      effective_booking_fee: booking_fee
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: open_order_age
    effect: parameter
    decides: open_order_factor
    bindings:
    - rebooking_days_counted
    - open_order_factor
    ladder:
    - when: the order was placed age_days_long or more calendar days ago
      value: K('age_factor_long')
    - when: the order was placed at least age_days_mid but fewer than age_days_long calendar days ago
      value: K('age_factor_mid')
    - when: otherwise
      value: '1'
    baseline:
      open_order_factor: '1'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The rebooking fee is the effective booking fee plus the crew surcharge, multiplied by the member rate and then by
      the open-order factor, rounded half up to the cent once at the end. The standard booking fee is redelivery_fee_usd
      and is charged as it stands, with no crew surcharge, a member rate of 1 and an open-order factor of 1.
    params:
    - redelivery_fee_usd
  inputs:
    history:
    - table: order_events
      aggregate: count
      field: order_event_id
      filters:
        event_type: order_fee_charge
        fee_kind: redelivery
    - table: order_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: order_line_charge
    - table: order_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: order_fee_refund
        fee_kind: freight
    - category: member
      table: member_events
      aggregate: count
      field: member_event_id
      within_months: 12
      filters:
        event_type: member_fee_charge
    cross_category:
    - member
- id: order_ext_error_return_refund
  base_policy_refs:
  - order_returns
  - order_evt_rewards
  overwrite:
  - base_policy: order_returns
    superseded_clause: >-
      The refund is each returned unit's price paid after its allocated coupon and certificate (refund_price_basis) times
      the units returned
    replaced_by: >-
      The error-return refund is the units received back times the unit refund value, plus the error allowance, the refund-wait
      credit, the drop-off credit, the repeat-issue credit and the Autoship-tenure credit, added together and rounded half
      up to the cent once at the end.
  trigger: state_due
  subject:
  - order_return_refund
  computes: amount_usd
  target_tool: refund_error_return_9d87fcb3
  params:
    loyal_autoship_ships: 6
    mislabel_allowance: 3.0
    defect_allowance: 1.5
    wait_days_long: 7
    wait_credit_long: 2.0
    wait_days_mid: 4
    wait_credit_mid: 1.0
    store_dropoff_credit: 1.0
    mail_dropoff_credit: 0.5
    repeat_credit_two: 2.5
    repeat_credit_one: 1.25
    autoship_months_long: 36
    autoship_credit_long: 1.5
    autoship_months_mid: 12
    autoship_credit_mid: 0.75
  rule: >-
    The authorization settled is the latest one on the order in status received, by received date, and its units, reason,
    return method and received date are read from it. This settlement applies when that authorization's reason is one of
    return_fee_waived_reasons (a Tailwise error); a return for any other reason is outside it and is refunded under the
    base return rule. The error-return refund is the units received back times the unit refund value, plus the error allowance,
    the refund-wait credit, the drop-off credit, the repeat-issue credit and the Autoship-tenure credit, added together
    and rounded half up to the cent once at the end. The unit price paid is the amount billed on the order's line charges
    divided by the units charged on them, rounded half up to the cent. The standard unit refund value is the unit price
    paid, and the error allowance, the refund-wait credit, the drop-off credit, the repeat-issue credit and the Autoship-tenure
    credit are each nothing. The unit refund value depends on the Autoship shipments charged to the customer in the last
    12 months: with loyal_autoship_ships or more it is the unit list price on the line charge (the allocated coupon and
    certificate are not taken back); with at least one but fewer than loyal_autoship_ships it is the unit price paid plus
    half of the coupon and certificate allocated per unit charged, rounded half up to the cent; with none it is the unit
    price paid. The error allowance is mislabel_allowance for reason wrong_item or not_as_described, defect_allowance for
    reason defective, and nothing for reason damaged. The refund-wait credit counts calendar days from the received date
    to today: wait_credit_long at wait_days_long days or more, wait_credit_mid at wait_days_mid days or more but fewer than
    wait_days_long, and nothing below wait_days_mid. The drop-off credit is store_dropoff_credit for return method in_store,
    mail_dropoff_credit for return method mail_label, and nothing for return method freight_pickup. The repeat-issue credit
    counts the other return authorizations on the order, in any status, whose reason is damaged, defective, wrong_item or
    not_as_described: repeat_credit_two for two or more, repeat_credit_one for exactly one, and nothing for none. The Autoship-tenure
    credit counts whole months since the enrollment of the customer's active Autoship subscription: autoship_credit_long
