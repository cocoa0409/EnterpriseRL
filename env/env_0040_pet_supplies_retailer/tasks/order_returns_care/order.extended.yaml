      else (RND(price_paid_per_unit + order_discounts_allocated / order_units_charged / 2, 2) if (days_to_damage_report
      <= K('prompt_report_days') and subscriber_shipments_12m >= 1 and subscriber_shipments_12m < K('loyal_ships')) else
