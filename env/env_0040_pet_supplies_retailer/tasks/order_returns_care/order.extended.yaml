  - damage_credit_sum: >-
      damaged_units_reported * damaged_unit_value + severity_credit + late_arrival_credit + multi_issue_credit + subscriber_credit
  - result: RND(damage_credit_sum, 2) if damage_credit_sum <= P('returnless_refund_max_usd') else 0
