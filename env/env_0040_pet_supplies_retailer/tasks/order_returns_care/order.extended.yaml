      Large Item Freight Delivery:
        promised_transit_business_days: =promised_transit_business_days
        order_cutoff_time: =order_cutoff_time
        late_delivery_fee_refund: =late_delivery_fee_refund
        late_delivery_grace_minutes: =late_delivery_grace_minutes
        carrier_attempts_before_return: =carrier_attempts_before_return
        return_to_sender_fee_refund: =return_to_sender_fee_refund
        redelivery_fee_usd: =redelivery_fee_usd
        delivery_signature_required: =delivery_signature_required
- id: order_returns
  subject: [order_return_refund]
  rule: A return is authorized against one order line before the item comes back. The order status is completed
    when the return is authorized. A return is accepted only if it is authorized no later than the item category's
    return window after the order's completed date. The window is counted in calendar days from completed_date,
    that date being day 0, using return_window_days_by_item_category for changed-mind and not-as-described returns,
    opened_food_guarantee_days for quality_guarantee returns and defective_return_window_days for defective returns;
    where holiday_return_extension applies, the later of the two dates is the last day; a request on the last day
    is in time. Items in a category with a 0-day window, and final-sale items unless final_sale_returnable, are
    returnable only as defective. The units already refunded or credited on the line (order_msr_units_already_refunded)
    plus the units returned do not exceed the line's quantity. The return method must be one of return_methods_allowed.
    A return is refunded only if the returned item is received with the return authorization in status authorized
    and no later than rma_validity_days after requested_on. The validity is counted in calendar days from requested_on,
    that date being day 0; an item received on the last day is in time. The refund is each returned unit's price
    paid after its allocated coupon and certificate (refund_price_basis) times the units returned, minus, on changed-mind
    returns only, the mail_return_label_fee_usd for a mail label (waived for an active Tailwise Plus tier where
    plus_waives_return_label_fee), the freight_return_pickup_fee_usd for a freight pickup and the restocking_fee_pct
    of an opened large item; reasons in return_fee_waived_reasons carry no deduction. The fulfillment fee is refunded
    only when every line is returned for a Tailwise error and shipping_refund_on_error_return is true. Refunds go
    to refund_method.
  eligibility:
  - id: completed_order
    applies_to: [order_return_refund]
    kind: state
    condition: The order status is completed when the return is authorized.
    evidence_fields: [orders.status, orders.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [orders.order_id]
      action_bindings:
        orders.order_id: order_id
    state_contract:
      field: orders.status
      allowed: [completed]
  - id: return_window
    applies_to: [order_return_refund]
    kind: time
    condition: A return is accepted only if it is authorized no later than the item category's return window after
      the order's completed date.
    evidence_fields: [orders.completed_date, orders.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [orders.order_id]
      action_bindings:
        orders.order_id: order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the order's completed date
      anchor_source: orders.completed_date
      relation: not_after
      duration_source: variants.defective_return_window_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days from completed_date, that date being day 0, using return_window_days_by_item_category
        for changed-mind and not-as-described returns, opened_food_guarantee_days for quality_guarantee returns
        and defective_return_window_days for defective returns; where holiday_return_extension applies, the later
        of the two dates is the last day; a request on the last day is in time.
      boundary: inclusive
  - id: units_not_over_refunded
    applies_to: [order_return_refund]
    kind: dedup
    condition: The units already refunded or credited on the line (order_msr_units_already_refunded) plus the units
      returned do not exceed the line's quantity.
    evidence_fields: [order_events.original_event_id, order_events.quantity, order_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [order_events.original_event_id]
      action_bindings:
        order_events.original_event_id: original_event_id
    dedup_contract:
      table: order_events
      mode: separate_record
      object_bindings:
        original_event_id: original_event_id
      duplicate_filters:
        event_type: [order_return_refund, order_damage_credit]
      distinct_fields: [rma_id]
  - id: rma_received_in_time
    applies_to: [order_return_refund]
    kind: time
    condition: A return is refunded only if the returned item is received with the return authorization in status
      authorized and no later than rma_validity_days after requested_on.
    evidence_fields: [order_return_requests.requested_on, order_return_requests.status, order_return_requests.rma_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [order_return_requests.rma_id]
      action_bindings:
        order_return_requests.rma_id: rma_id
    temporal_basis:
      clock: frozen_time
      anchor_event: requested_on
      anchor_source: order_return_requests.requested_on
      relation: not_after
      duration_source: variants.rma_validity_days
      unit: calendar_days
      counting_rule: The validity is counted in calendar days from requested_on, that date being day 0; an item
        received on the last day is in time.
      boundary: inclusive
  params:
    per_tier:
      Standard Ship-to-Home:
        return_window_days_by_item_category: =return_window_days_by_item_category
        holiday_return_extension: =holiday_return_extension
        opened_food_guarantee_days: =opened_food_guarantee_days
        defective_return_window_days: =defective_return_window_days
