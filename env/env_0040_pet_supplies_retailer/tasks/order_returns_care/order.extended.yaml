- id: order_damage_missing_claims
  subject: [order_damage_credit, order_replacement_ship]
  rule: Damaged, missing and wrong items are Tailwise's responsibility once the order is completed. A damage or
    missing-item claim is accepted only if it is reported no later than damage_report_days or missing_item_report_days
    after the order's completed date. The window is counted in calendar days from completed_date, that date being
    day 0; a report on the last day is in time. A wrong item is handled as a return with reason wrong_item. For
    a damaged or missing line the customer chooses a free replacement where replacement_allowed, or a refund; a
    refund up to returnless_refund_max_usd is credited without the item coming back, while a larger one needs a
    return authorization. The units already refunded or credited on the line (order_msr_units_already_refunded)
    plus the units returned do not exceed the line's quantity.
  eligibility:
  - id: damage_window
    applies_to: [order_damage_credit, order_replacement_ship]
    kind: time
    condition: A damage or missing-item claim is accepted only if it is reported no later than damage_report_days
      or missing_item_report_days after the order's completed date.
    evidence_fields: [orders.completed_date, orders.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [orders.order_id]
      action_bindings:
        orders.order_id: order_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the order's completed date
      anchor_source: orders.completed_date
      relation: not_after
      duration_source: variants.damage_report_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days from completed_date, that date being day 0; a report
        on the last day is in time.
      boundary: inclusive
  - id: claim_units_not_over_refunded
    applies_to: [order_damage_credit]
    kind: dedup
    condition: The units already refunded or credited on the line (order_msr_units_already_refunded) plus the units
      returned do not exceed the line's quantity.
    evidence_fields: [order_events.original_event_id, order_events.quantity, order_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [order_events.original_event_id]
      action_bindings:
        order_events.original_event_id: original_event_id
    dedup_contract:
      table: order_events
      mode: separate_record
      object_bindings:
        original_event_id: original_event_id
      duplicate_filters:
        event_type: [order_return_refund, order_damage_credit]
      distinct_fields: [return_reason]
  params:
    per_tier:
      Standard Ship-to-Home:
        damage_report_days: =damage_report_days
        missing_item_report_days: =missing_item_report_days
        replacement_allowed: =replacement_allowed
        returnless_refund_max_usd: =returnless_refund_max_usd
      Expedited Ship-to-Home:
        damage_report_days: =damage_report_days
        missing_item_report_days: =missing_item_report_days
        replacement_allowed: =replacement_allowed
        returnless_refund_max_usd: =returnless_refund_max_usd
      Buy Online Pick Up In Store:
        damage_report_days: =damage_report_days
        missing_item_report_days: =missing_item_report_days
        replacement_allowed: =replacement_allowed
        returnless_refund_max_usd: =returnless_refund_max_usd
      Curbside Pickup:
        damage_report_days: =damage_report_days
        missing_item_report_days: =missing_item_report_days
        replacement_allowed: =replacement_allowed
        returnless_refund_max_usd: =returnless_refund_max_usd
      Same-Day Delivery:
        damage_report_days: =damage_report_days
        missing_item_report_days: =missing_item_report_days
        replacement_allowed: =replacement_allowed
        returnless_refund_max_usd: =returnless_refund_max_usd
      Large Item Freight Delivery:
        damage_report_days: =damage_report_days
        missing_item_report_days: =missing_item_report_days
        replacement_allowed: =replacement_allowed
        returnless_refund_max_usd: =returnless_refund_max_usd
