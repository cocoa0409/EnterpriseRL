  - line_unit_list_price: MAX('order_events', 'unit_price_usd', event_type='order_line_charge')
  - price_paid_per_unit: RND(order_line_billed / order_units_charged, 2)
  - days_to_damage_report: DAYS(F('completed_date'), damage_report_date)
  - subscriber_shipments_12m: XCOUNT('autoship', 'autoship_events', within_months=12, event_type='autoship_shipment_charge')
