    - basket_discounts
    - basket_value_measured
    ladder:
    - when: >-
        at least one Autoship claim refund in the last 12 months AND claims_ships_loyal or more Autoship shipments charged
        in the last 12 months
      method: the basket is valued at the line charges before their allocated coupon and certificate
    - when: >-
        at least one Autoship claim refund in the last 12 months AND at least one but fewer than claims_ships_loyal Autoship
        shipments charged in the last 12 months
      method: >-
        the basket is valued at the amount billed plus half of the allocated coupon and certificate, rounded half up to
        the cent
    - when: otherwise
      method: the basket is valued at the amount billed on the line charges
    baseline:
      basket_value_measured: basket_billed
    evidence:
    - cross_category
    - history
    cross_difficulty: autoship
  baseline:
    rule: >-
      The late-delivery fee refund is the fulfillment fee charged on the order times the refund share, rounded half up to
      the cent once at the end, and never more than the fulfillment fee charged less the fulfillment fee already refunded.
      The standard refund share is standard_refund_share.
    params:
    - standard_refund_share
  inputs:
    history:
    - table: order_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: order_fee_charge
    - table: order_events
      aggregate: sum
      field: quantity
      filters:
        event_type: order_return_refund
    - table: order_events
      aggregate: sum
      field: quantity
      filters:
        event_type: order_damage_credit
    - table: order_return_requests
      aggregate: count
      field: rma_id
      filters:
