- id: rx_evt_fill_eligibility
  subject: [rx_fill, rx_exhaust, rx_expire]
  rule: 'The prescription status is active when the fill is dispensed. A fill also needs fills_remaining of at least
    1. A fill is dispensed only if its date is before the prescription''s expires_on. Expiry is compared as calendar
    dates: a fill dated on expires_on or later is refused. A refill is dispensed no earlier than refill_too_soon_pct
    of the previous fill''s days'' supply after the previous fill''s dispense date, unless an early-refill override
    applies. The earliest refill date is the previous rx_fill row''s event_date plus the previous fill''s days_supply
    multiplied by refill_too_soon_pct/100 and rounded up to a whole calendar day; a refill on that date is in time.
    The days'' supply of one fill may not exceed max_days_supply_per_fill nor, for compounded preparations, beyond_use_days,
    and for controlled substances the total rx_msr_days_supply_dispensed after the fill may not exceed controlled_quantity_limit_days.
    A partial fill is allowed only where partial_fill_allowed is true and, with partial_fill_consumes_fill, uses
    a whole fill. The first compounded fill ships no earlier than compounding_lead_business_days business days after
    authorization. Each dispensed fill lowers fills_remaining by one; the fill that brings it to 0 moves the prescription
    to refills_exhausted, and expires_on moves an active or exhausted prescription to expired.'
  eligibility:
  - id: fill_active
    applies_to: [rx_fill]
    kind: state
    condition: The prescription status is active when the fill is dispensed.
    evidence_fields: [rx_prescriptions.status, rx_prescriptions.rx_prescription_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rx_prescriptions.rx_prescription_id]
      action_bindings:
        rx_prescriptions.rx_prescription_id: rx_prescription_id
    state_contract:
      field: rx_prescriptions.status
      allowed: [active]
  - id: before_expiry
    applies_to: [rx_fill]
    kind: time
    condition: A fill is dispensed only if its date is before the prescription's expires_on.
    evidence_fields: [rx_prescriptions.expires_on, rx_prescriptions.rx_prescription_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rx_prescriptions.rx_prescription_id]
      action_bindings:
        rx_prescriptions.rx_prescription_id: rx_prescription_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the prescription's expires_on
      anchor_source: rx_prescriptions.expires_on
      relation: not_after
      duration_source: params.expiry_offset_days
      unit: calendar_days
      counting_rule: 'Expiry is compared as calendar dates: a fill dated on expires_on or later is refused.'
      boundary: exclusive
  - id: not_too_soon
    applies_to: [rx_fill]
    kind: time
    condition: A refill is dispensed no earlier than refill_too_soon_pct of the previous fill's days' supply after
      the previous fill's dispense date, unless an early-refill override applies.
    evidence_fields: [rx_events.event_date, rx_events.days_supply, rx_events.rx_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rx_events.rx_event_id]
      action_bindings:
        rx_events.rx_event_id: previous_fill_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the previous fill's dispense date
      anchor_source: rx_events.event_date
      relation: not_before
      duration_source: variants.refill_too_soon_pct
      unit: calendar_days
      counting_rule: The earliest refill date is the previous rx_fill row's event_date plus the previous fill's
        days_supply multiplied by refill_too_soon_pct/100 and rounded up to a whole calendar day; a refill on that
        date is in time.
      boundary: inclusive
  params:
    expiry_offset_days: 0
    per_tier:
      Rx Preventive:
        max_days_supply_per_fill: =max_days_supply_per_fill
        refill_too_soon_pct: =refill_too_soon_pct
        beyond_use_days: =beyond_use_days
        controlled_quantity_limit_days: =controlled_quantity_limit_days
        partial_fill_allowed: =partial_fill_allowed
        partial_fill_consumes_fill: =partial_fill_consumes_fill
        compounding_lead_business_days: =compounding_lead_business_days
      Rx Maintenance Medication:
        max_days_supply_per_fill: =max_days_supply_per_fill
        refill_too_soon_pct: =refill_too_soon_pct
        beyond_use_days: =beyond_use_days
        controlled_quantity_limit_days: =controlled_quantity_limit_days
        partial_fill_allowed: =partial_fill_allowed
        partial_fill_consumes_fill: =partial_fill_consumes_fill
        compounding_lead_business_days: =compounding_lead_business_days
      Rx Prescription Diet:
        max_days_supply_per_fill: =max_days_supply_per_fill
        refill_too_soon_pct: =refill_too_soon_pct
        beyond_use_days: =beyond_use_days
        controlled_quantity_limit_days: =controlled_quantity_limit_days
        partial_fill_allowed: =partial_fill_allowed
        partial_fill_consumes_fill: =partial_fill_consumes_fill
        compounding_lead_business_days: =compounding_lead_business_days
      Rx Short-Course Medication:
        max_days_supply_per_fill: =max_days_supply_per_fill
        refill_too_soon_pct: =refill_too_soon_pct
        beyond_use_days: =beyond_use_days
        controlled_quantity_limit_days: =controlled_quantity_limit_days
        partial_fill_allowed: =partial_fill_allowed
        partial_fill_consumes_fill: =partial_fill_consumes_fill
        compounding_lead_business_days: =compounding_lead_business_days
      Rx Controlled Substance:
        max_days_supply_per_fill: =max_days_supply_per_fill
        refill_too_soon_pct: =refill_too_soon_pct
        beyond_use_days: =beyond_use_days
        controlled_quantity_limit_days: =controlled_quantity_limit_days
        partial_fill_allowed: =partial_fill_allowed
        partial_fill_consumes_fill: =partial_fill_consumes_fill
        compounding_lead_business_days: =compounding_lead_business_days
      Rx Compounded Medication:
        max_days_supply_per_fill: =max_days_supply_per_fill
        refill_too_soon_pct: =refill_too_soon_pct
        beyond_use_days: =beyond_use_days
        controlled_quantity_limit_days: =controlled_quantity_limit_days
        partial_fill_allowed: =partial_fill_allowed
        partial_fill_consumes_fill: =partial_fill_consumes_fill
        compounding_lead_business_days: =compounding_lead_business_days
  measures: [rx_msr_days_supply_dispensed]
- id: rx_early_refill_overrides
  subject: [rx_fill]
  rule: 'A pharmacist may dispense before the refill-too-soon date only where early_refill_override_allowed is true
    and only for one of two reasons: travel, when the customer will be away past the earliest refill date (days''
    supply up to travel_override_max_days_supply), or lost_or_damaged medication where lost_replacement_allowed
    is true. The override is refused when rx_msr_overrides_365d has already reached early_refill_overrides_per_365_days.
    An override still uses a fill and still requires the prescription to be active and unexpired. A dose increase
    is never an override: it needs a new authorization from the veterinarian. Controlled substances and short-course
    medications are never refilled early.'
  eligibility: []
  params:
    per_tier:
      Rx Preventive:
        early_refill_override_allowed: =early_refill_override_allowed
        early_refill_overrides_per_365_days: =early_refill_overrides_per_365_days
        travel_override_max_days_supply: =travel_override_max_days_supply
        lost_replacement_allowed: =lost_replacement_allowed
      Rx Maintenance Medication:
        early_refill_override_allowed: =early_refill_override_allowed
        early_refill_overrides_per_365_days: =early_refill_overrides_per_365_days
        travel_override_max_days_supply: =travel_override_max_days_supply
        lost_replacement_allowed: =lost_replacement_allowed
      Rx Prescription Diet:
        early_refill_override_allowed: =early_refill_override_allowed
        early_refill_overrides_per_365_days: =early_refill_overrides_per_365_days
        travel_override_max_days_supply: =travel_override_max_days_supply
        lost_replacement_allowed: =lost_replacement_allowed
      Rx Short-Course Medication:
        early_refill_override_allowed: =early_refill_override_allowed
        early_refill_overrides_per_365_days: =early_refill_overrides_per_365_days
        travel_override_max_days_supply: =travel_override_max_days_supply
        lost_replacement_allowed: =lost_replacement_allowed
      Rx Controlled Substance:
        early_refill_override_allowed: =early_refill_override_allowed
        early_refill_overrides_per_365_days: =early_refill_overrides_per_365_days
        travel_override_max_days_supply: =travel_override_max_days_supply
        lost_replacement_allowed: =lost_replacement_allowed
      Rx Compounded Medication:
        early_refill_override_allowed: =early_refill_override_allowed
        early_refill_overrides_per_365_days: =early_refill_overrides_per_365_days
        travel_override_max_days_supply: =travel_override_max_days_supply
        lost_replacement_allowed: =lost_replacement_allowed
  measures: [rx_msr_overrides_365d]
- id: rx_evt_pricing
  subject: [rx_fill]
  rule: A fill is billed at the package's catalog price on the dispense date times the packages dispensed. A one-time
    fill of a customer new to the pharmacy (rx_msr_recent_pharmacy_fills is 0) takes first_pharmacy_order_discount_pct
    off the merchandise subtotal, capped at first_pharmacy_order_discount_cap_usd; the discount applies once per
    customer, to the first fill only, and never to Autoship fills, which take the Autoship discount instead. The
    service fee is compounding_fee_usd on a compounded fill plus the adult-signature fee when it is due. Amounts
