extended_policies:
- id: rx_ext_error_refund
  base_policy_refs: [rx_dispensing_errors, rx_evt_pricing, rx_agg_shipping]
  overwrite:
  - base_policy: rx_dispensing_errors
    superseded_clause: >-
      A refund returns the fill's merchandise amount after discount and, with error_refund_includes_shipping, its
      shipping and service fees, to the original payment, and the refunded fill is credited back to fills_remaining.
    replaced_by: >-
      The dispensing-error refund is the sum of the merchandise portion, the shipping portion, the service fee
      charged on the claimed fill, the courtesy amount, the loyalty make-good and the waiting credit; the courtesy
      amount is rounded half up to the cent on its own before it is added, the sum is rounded half up to the cent,
      the refund is paid to the original payment, and the refunded fill is credited back to the prescription's fills
      remaining.
  trigger: state_due
  subject: [rx_error_refund, rx_fill_restore]
  computes: amount_usd
  target_tool: refund_dispensing_error_93fa9db7
  params:
    established_fills_12m: 4
    waiting_long_days: 10
    waiting_short_days: 5
    waiting_credit_long_usd: 4.0
    waiting_credit_short_usd: 2.0
    courtesy_pct_plus: 20
    courtesy_pct_vip: 15
    tenure_long_months: 96
    tenure_mid_months: 36
    tenure_bonus_long_usd: 5.0
    tenure_bonus_mid_usd: 2.5
  rule: >-
    This policy prices the refund owed on a dispensed fill that carries a confirmed dispensing-error claim, where
    the prescription's class does not allow a free remake (error_remake_allowed is false), so that a refund is the
    remedy the pharmacy owes as soon as the claim is confirmed within the report window. It covers a claim recorded on
    the most recent dispensed fill of a prescription, and that fill is the claimed fill; its error type is the error
    recorded on that fill row (wrong_medication, wrong_strength, wrong_quantity or wrong_label), and a claim of
    wrong_medication or wrong_strength is a severe claim. The refund for a dispensing error is the claimed fill's
    merchandise subtotal less its discount, plus the shipping fee charged on that fill, plus the service fee charged
    on that fill, and the total is rounded half up to the cent. A severe claim earns a courtesy amount, and the
    amount the courtesy percentage is applied to depends on how established the patient is on the prescription:
    where the claim is severe and the prescription has at least established_fills_12m dispensed fills dated within
    the 12 calendar months ending on the refund date, the courtesy is figured on the whole amount billed on the
    claimed fill; where the claim is severe and the prescription has fewer such fills, the courtesy is figured on the
    claimed fill's merchandise subtotal less its discount; any other claim earns no courtesy. The courtesy percentage
    follows the customer's Pals Rewards and Tailwise Plus membership: a membership on Tailwise Plus Monthly,
    Tailwise Plus Annual or Tailwise Plus Premier Annual in status active takes courtesy_pct_plus percent; a
    membership on Pals Rewards VIP in status active takes courtesy_pct_vip percent; any other membership, or no
    membership, takes no courtesy percentage. The courtesy amount is the courtesy percentage of the amount it is
    figured on. The shipping portion of the refund depends on the claim and on how the claimed fill was ordered:
    where the claim is severe and the claimed fill was a one-time order, the shipping portion is the shipping fee
    charged on the fill plus the class's standard pharmacy shipping fee for one shipment (rx_shipping_fee_usd), so
    that the replacement order ships at no cost to the customer; where the claim is severe and the claimed fill
    shipped through Autoship, the shipping portion is the class's standard pharmacy shipping fee for one shipment
    alone; any other claim takes the shipping fee charged on the fill. A severe claim also earns a waiting credit
    that follows how long the customer has been left with the erroneous fill, counted in calendar days from the
    claimed fill's dispense date to the refund date: at least waiting_long_days days adds waiting_credit_long_usd;
    at least waiting_short_days but fewer than waiting_long_days days adds waiting_credit_short_usd; fewer days, or
    a claim that is not severe, adds nothing. A severe claim also earns a loyalty make-good that follows how long the customer has
    held the Pals Rewards membership, counted in whole calendar months from the membership's enrollment date to the
    refund date: at least tenure_long_months months adds tenure_bonus_long_usd; at least tenure_mid_months months
    but fewer than tenure_long_months months adds tenure_bonus_mid_usd; a shorter membership, no membership or a
    claim that is not severe adds nothing. The merchandise portion of the refund is the claimed fill's merchandise
    subtotal less its discount. The dispensing-error refund is the sum of the merchandise portion, the shipping
    portion, the service fee charged on the claimed fill, the courtesy amount, the loyalty make-good and the
    waiting credit; the courtesy amount is rounded half up to the cent on its own before it is added, the sum is
    rounded half up to the cent, the refund is paid to the original payment, and the refunded fill is credited back
    to the prescription's fills remaining.
  prerequisite: []
  cross_category:
  - category: member
    as: branch
    reads: [variant_name, status, enrolled_on]
    note: The courtesy percentage is decided from the customer's membership tier and status, and the loyalty make-good
      from the months since the membership's enrollment date.
  compute:
  - claim_type: "LATEST('rx_events', 'error_type', event_type='rx_fill')"
  - severe: "claim_type == 'wrong_medication' or claim_type == 'wrong_strength'"
  - claim_merch: "LATEST('rx_events', 'merchandise_subtotal_usd', event_type='rx_fill')"
  - claim_discount: "LATEST('rx_events', 'discount_usd', event_type='rx_fill')"
  - merch_part: "claim_merch - claim_discount"
  - claim_billed: "LATEST('rx_events', 'amount_usd', event_type='rx_fill')"
  - fills_12m: "COUNT('rx_events', within_months=12, date_field='event_date', event_type='rx_fill')"
  - courtesy_base: "claim_billed if (severe and fills_12m >= K('established_fills_12m')) else (merch_part if (severe and fills_12m < K('established_fills_12m')) else 0)"
  - member_tier: "CFIELD('member', 'variant_name')"
  - member_status: "CFIELD('member', 'status')"
  - courtesy_rate: "K('courtesy_pct_plus') if ((member_tier == 'Tailwise Plus Monthly' or member_tier == 'Tailwise Plus Annual' or member_tier == 'Tailwise Plus Premier Annual') and member_status == 'active') else (K('courtesy_pct_vip') if (member_tier == 'Pals Rewards VIP' and member_status == 'active') else 0)"
  - courtesy: "RND(courtesy_base * courtesy_rate / 100, 2)"
  - claim_channel: "LATEST('rx_events', 'fill_channel', event_type='rx_fill')"
  - claim_ship: "LATEST('rx_events', 'shipping_fee_usd', event_type='rx_fill')"
  - ship_part: "claim_ship + P('rx_shipping_fee_usd') if (severe and claim_channel == 'one_time_order') else (P('rx_shipping_fee_usd') if (severe and claim_channel == 'autoship') else claim_ship)"
  - claim_fee: "LATEST('rx_events', 'service_fee_usd', event_type='rx_fill')"
  - claim_date: "LATEST('rx_events', 'event_date', event_type='rx_fill')"
  - days_waiting: "DAYS(claim_date, NOW)"
  - waiting_credit: "K('waiting_credit_long_usd') if (severe and days_waiting >= K('waiting_long_days')) else (K('waiting_credit_short_usd') if (severe and days_waiting >= K('waiting_short_days') and days_waiting < K('waiting_long_days')) else 0)"
  - member_since: "CFIELD('member', 'enrolled_on')"
  - member_months: "MONTHS(member_since, NOW) if member_since else 0"
  - loyalty_makegood: "K('tenure_bonus_long_usd') if (severe and member_months >= K('tenure_long_months')) else (K('tenure_bonus_mid_usd') if (severe and member_months >= K('tenure_mid_months') and member_months < K('tenure_long_months')) else 0)"
  - result: "RND(merch_part + ship_part + claim_fee + courtesy + loyalty_makegood + waiting_credit, 2)"
  compute_basis:
    claim_type: "It covers a claim recorded on the most recent dispensed fill of a prescription, and that fill is the claimed fill; its error type is the error recorded on that fill row (wrong_medication, wrong_strength, wrong_quantity or wrong_label)"
    severe: "a claim of wrong_medication or wrong_strength is a severe claim."
    claim_merch: "The merchandise portion of the refund is the claimed fill's merchandise subtotal less its discount."
    claim_discount: "The merchandise portion of the refund is the claimed fill's merchandise subtotal less its discount."
    claim_billed: "where the claim is severe and the prescription has at least established_fills_12m dispensed fills dated within the 12 calendar months ending on the refund date, the courtesy is figured on the whole amount billed on the claimed fill"
    fills_12m: "at least established_fills_12m dispensed fills dated within the 12 calendar months ending on the refund date"
    courtesy_base: "where the claim is severe and the prescription has at least established_fills_12m dispensed fills dated within the 12 calendar months ending on the refund date, the courtesy is figured on the whole amount billed on the claimed fill; where the claim is severe and the prescription has fewer such fills, the courtesy is figured on the claimed fill's merchandise subtotal less its discount; any other claim earns no courtesy."
    member_tier: "The courtesy percentage follows the customer's Pals Rewards and Tailwise Plus membership"
    member_status: "a membership on Tailwise Plus Monthly, Tailwise Plus Annual or Tailwise Plus Premier Annual in status active takes courtesy_pct_plus percent"
    courtesy_rate: "a membership on Tailwise Plus Monthly, Tailwise Plus Annual or Tailwise Plus Premier Annual in status active takes courtesy_pct_plus percent; a membership on Pals Rewards VIP in status active takes courtesy_pct_vip percent; any other membership, or no membership, takes no courtesy percentage."
    courtesy: "The courtesy amount is the courtesy percentage of the amount it is figured on. ... the courtesy amount is rounded half up to the cent on its own before it is added"
    claim_channel: "where the claim is severe and the claimed fill was a one-time order ... where the claim is severe and the claimed fill shipped through Autoship"
    claim_ship: "any other claim takes the shipping fee charged on the fill."
    ship_part: "where the claim is severe and the claimed fill was a one-time order, the shipping portion is the shipping fee charged on the fill plus the class's standard pharmacy shipping fee for one shipment (rx_shipping_fee_usd), so that the replacement order ships at no cost to the customer; where the claim is severe and the claimed fill shipped through Autoship, the shipping portion is the class's standard pharmacy shipping fee for one shipment alone; any other claim takes the shipping fee charged on the fill."
    claim_fee: "plus the service fee charged on that fill"
    claim_date: "counted in calendar days from the claimed fill's dispense date to the refund date"
    days_waiting: "counted in calendar days from the claimed fill's dispense date to the refund date"
    waiting_credit: "at least waiting_long_days days adds waiting_credit_long_usd; at least waiting_short_days but fewer than waiting_long_days days adds waiting_credit_short_usd; fewer days, or a claim that is not severe, adds nothing."
    member_since: "counted in whole calendar months from the membership's enrollment date to the refund date"
    member_months: "counted in whole calendar months from the membership's enrollment date to the refund date"
    loyalty_makegood: "at least tenure_long_months months adds tenure_bonus_long_usd; at least tenure_mid_months months but fewer than tenure_long_months months adds tenure_bonus_mid_usd; a shorter membership, no membership or a claim that is not severe adds nothing."
    result: "The dispensing-error refund is the sum of the merchandise portion, the shipping portion, the service fee charged on the claimed fill, the courtesy amount, the loyalty make-good and the waiting credit; the courtesy amount is rounded half up to the cent on its own before it is added, the sum is rounded half up to the cent"
  factors:
  - id: courtesy_basis
    effect: method
    decides: courtesy_base
    bindings: [claim_billed, fills_12m, courtesy_base]
    ladder:
    - when: "the claim is severe (wrong_medication or wrong_strength) AND the prescription has at least established_fills_12m dispensed fills dated within the 12 calendar months ending on the refund date"
      method: "the courtesy percentage is applied to the whole amount billed on the claimed fill (merchandise less discount plus shipping plus service fee as billed)"
    - when: "the claim is severe AND the prescription has fewer than established_fills_12m dispensed fills in that window"
      method: "the courtesy percentage is applied to the claimed fill's merchandise subtotal less its discount"
    - when: "otherwise (a claim of wrong_quantity or wrong_label)"
      method: "no courtesy is figured; the courtesy amount is nothing"
    baseline:
      courtesy_base: "0"
    evidence: [history]
    cross_difficulty: null
  - id: courtesy_percentage
    effect: parameter
    decides: courtesy_rate
    bindings: [member_tier, member_status, courtesy_rate]
    ladder:
    - when: "the customer's membership is on Tailwise Plus Monthly, Tailwise Plus Annual or Tailwise Plus Premier Annual AND its status is active"
      value: "K('courtesy_pct_plus')"
    - when: "the customer's membership is on Pals Rewards VIP AND its status is active"
      value: "K('courtesy_pct_vip')"
    - when: "otherwise (any other tier or status, or no membership)"
      value: "0"
    baseline:
      courtesy_rate: "0"
    evidence: [cross_category]
    cross_difficulty: member
  - id: replacement_shipping
    effect: parameter
    decides: ship_part
    bindings: [claim_channel, claim_ship, ship_part]
    ladder:
    - when: "the claim is severe AND the claimed fill was a one-time order"
      value: "the fill's shipping fee + P('rx_shipping_fee_usd')"
    - when: "the claim is severe AND the claimed fill shipped through Autoship"
      value: "P('rx_shipping_fee_usd')"
    - when: "otherwise"
      value: "the fill's shipping fee"
    baseline:
      ship_part: "claim_ship"
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: waiting_credit
    effect: parameter
    decides: waiting_credit
    bindings: [claim_date, days_waiting, waiting_credit]
    ladder:
    - when: "the claim is severe AND at least waiting_long_days calendar days lie between the claimed fill's dispense date and the refund date"
      value: "K('waiting_credit_long_usd')"
    - when: "the claim is severe AND at least waiting_short_days but fewer than waiting_long_days such days"
      value: "K('waiting_credit_short_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      waiting_credit: "0"
    evidence: [history, date]
    cross_difficulty: null
  - id: loyalty_makegood
    effect: parameter
    decides: loyalty_makegood
    bindings: [member_since, member_months, loyalty_makegood]
    ladder:
    - when: "the claim is severe AND the Pals Rewards membership was enrolled at least tenure_long_months whole calendar months before the refund date"
      value: "K('tenure_bonus_long_usd')"
    - when: "the claim is severe AND the membership was enrolled at least tenure_mid_months but fewer than tenure_long_months whole calendar months before the refund date"
      value: "K('tenure_bonus_mid_usd')"
    - when: "otherwise"
      value: "0"
    baseline:
      loyalty_makegood: "0"
    evidence: [cross_category, date]
    cross_difficulty: member
  baseline:
    rule: >-
      The refund for a dispensing error is the claimed fill's merchandise subtotal less its discount, plus the
      shipping fee charged on that fill, plus the service fee charged on that fill, and the total is rounded half up
      to the cent.
    params: []
  inputs:
    history:
    - {table: rx_events, aggregate: latest, field: error_type, filters: {event_type: rx_fill}}
    - {table: rx_events, aggregate: latest, field: merchandise_subtotal_usd, filters: {event_type: rx_fill}}
    - {table: rx_events, aggregate: latest, field: amount_usd, filters: {event_type: rx_fill}}
    - {table: rx_events, aggregate: count, field: rx_event_id, within_months: 12, filters: {event_type: rx_fill}}
    cross_category: [member]
- id: rx_ext_controlled_renewal
  base_policy_refs: [rx_agg_multi_holding, rx_authorization, rx_renewals, rx_transfers, rx_evt_fill_eligibility]
  overwrite: []
  trigger: on_request
  subject: [rx_order_create]
  computes: days_supply_per_fill
  target_tool: place_rx_renewal_order_580a75e8
  params:
    settling_step_days: 7
    stable_fills: 5
    settling_fills: 3
    adherence_full_pct: 90
    adherence_partial_pct: 75
    adherence_min_fills: 4
    exhaustion_lead_days: 30
  rule: >-
    This policy sets the days' supply per fill that a renewal order asks the veterinarian for when the customer
    renews a prescription whose class requires a DEA-registered prescriber (dea_prescriber_required) and that has
    reached refills_exhausted or expired; such a class is never renewed by the pharmacy on its own, so the customer
    places the renewal order personally, and the renewed prescription is the prescription the renewal names as the
    one it renews. A renewal asks the veterinarian for the renewed prescription's days' supply per fill, never more
    than the class's maximum days' supply per fill. The packages per fill of the renewal are its days' supply per
    fill multiplied by the packages the renewed prescription dispenses per day of supply, that is its packages per
    fill divided by its days' supply per fill. The days' supply per fill a renewal order asks for is fixed only after
    every dispensed fill of the renewed prescription that carries a dispensing-error claim also carries a refund
    entry on the pharmacy ledger. The fill length follows the renewal's delivery rhythm: where an Autoship Pharmacy
    subscription linked to the renewed prescription is in status pending_first_shipment, active or rx_hold and its
    frequency in weeks times 7 is no more than the class's maximum days' supply per fill, the fill length is that
    frequency in weeks times 7 days; where the linked subscription is paused and the renewed prescription has at
    least two dispensed fills, the fill length is the number of calendar days from its first dispensed fill to its
    most recent dispensed fill divided by the number of its dispensed fills less one, rounded down to a whole day;
    otherwise the fill length is the renewed prescription's days' supply per fill. The stability ceiling looks at the
    renewed prescription's open claims and delivered fills, the fills delivered being its dispensed fills less its
    fill credit-back entries: where no dispensed fill of it carries a dispensing-error claim without a refund or
    free-remake entry against that fill and its fills delivered number at least stable_fills, the stability ceiling
    is the class's maximum days' supply per fill; where no such claim is open and its fills delivered number at least
    settling_fills but fewer than stable_fills, the stability ceiling is the renewed prescription's days' supply per
    fill plus settling_step_days days, never more than the class maximum; otherwise the stability ceiling is the
    renewed prescription's days' supply per fill. The adherence ceiling compares the days' supply dispensed on the
    renewed prescription, which is the days' supply of its dispensed fills less the days' supply of the fills
    credited back to it, with the calendar days from its authorization date to the order date, as a percentage:
    where that coverage is at least adherence_full_pct percent and at least adherence_min_fills fills were dispensed
    on it, the adherence ceiling is the class's maximum days' supply per fill; where the coverage is at least
    adherence_partial_pct percent but below adherence_full_pct percent and at least adherence_min_fills fills were
    dispensed on it, the adherence ceiling is the renewed prescription's days' supply per fill plus
    settling_step_days days, never more than the class maximum; otherwise the adherence ceiling is the renewed
    prescription's days' supply per fill. The exhaustion ceiling looks at how early the renewed prescription ran out
    of fills: where it is in status refills_exhausted and the calendar days from its closing date to its expires_on
    number at least exhaustion_lead_days, the exhaustion ceiling is the class's maximum days' supply per fill; where
    it is in status refills_exhausted and those days number fewer than exhaustion_lead_days, the exhaustion ceiling is
    the renewed prescription's days' supply per fill plus settling_step_days days, never more than the class maximum;
    otherwise the exhaustion ceiling is the renewed prescription's days' supply per fill. The days' supply per fill
    the renewal asks for is the fill length, but no more than the stability ceiling, the adherence ceiling, the
    exhaustion ceiling or the class's maximum days' supply per fill, whichever is smallest, in whole days.
  prerequisite:
  - problem: rx_ext_error_refund
    kind: value_input
    gate: claims_open
    form: state
    policy_source: >-
      The days' supply per fill a renewal order asks for is fixed only after every dispensed fill of the renewed
      prescription that carries a dispensing-error claim also carries a refund entry on the pharmacy ledger.
    condition: >-
      Every rx_events row of event_type rx_fill on the renewed prescription whose error_type is other than none is
      referred to, through original_event_id, by an rx_events row of event_type rx_error_refund on the same
      prescription, which comes with its rx_fill_restore credit-back row.
    resolved_by: refund_dispensing_error_93fa9db7
    effect: >-
      Booking the refund entry, with the credit-back entry it brings, takes the open-claim count read by the
      stability ceiling to zero and lowers the fills delivered by one, so the stability ceiling is decided on settled
      records instead of falling to the renewed prescription's days' supply per fill.
  cross_category:
  - category: autoship
    as: branch
    reads: [status, frequency_weeks]
    note: The fill length method is chosen from the status of the Autoship Pharmacy subscription linked to the renewed
      prescription, and its frequency in weeks sets the cadence length.
  compute:
  - as_status: "CFIELD('autoship', 'status', rx_prescription_id=HID)"
  - as_weeks: "CFIELD('autoship', 'frequency_weeks', rx_prescription_id=HID)"
  - fills_dispensed: "COUNT('rx_events', event_type='rx_fill')"
  - first_fill_on: "LATEST('rx_events', 'event_date', event_type='rx_fill', fill_number=1)"
  - last_fill_on: "LATEST('rx_events', 'event_date', event_type='rx_fill')"
  - fill_length: "as_weeks * 7 if ((as_status == 'pending_first_shipment' or as_status == 'active' or as_status == 'rx_hold') and as_weeks * 7 <= P('max_days_supply_per_fill')) else (int(DAYS(first_fill_on, last_fill_on) / (fills_dispensed - 1)) if (as_status == 'paused' and fills_dispensed >= 2) else F('days_supply_per_fill'))"
  - claims_open: "COUNT('rx_events', event_type='rx_fill', error_type='wrong_medication') + COUNT('rx_events', event_type='rx_fill', error_type='wrong_strength') + COUNT('rx_events', event_type='rx_fill', error_type='wrong_quantity') + COUNT('rx_events', event_type='rx_fill', error_type='wrong_label') - COUNT('rx_events', event_type='rx_error_refund') - COUNT('rx_events', event_type='rx_error_remake')"
  - fills_delivered: "COUNT('rx_events', event_type='rx_fill') - COUNT('rx_events', event_type='rx_fill_restore')"
  - stability_ceiling: "P('max_days_supply_per_fill') if (claims_open == 0 and fills_delivered >= K('stable_fills')) else (MN(F('days_supply_per_fill') + K('settling_step_days'), P('max_days_supply_per_fill')) if (claims_open == 0 and fills_delivered >= K('settling_fills') and fills_delivered < K('stable_fills')) else F('days_supply_per_fill'))"
  - days_dispensed: "SUM('rx_events', 'days_supply', event_type='rx_fill') - SUM('rx_events', 'days_supply', event_type='rx_fill_restore')"
  - fills_for_adherence: "COUNT('rx_events', event_type='rx_fill')"
  - days_on_therapy: "DAYS(F('authorized_on'), NOW)"
  - coverage_pct: "days_dispensed * 100 / days_on_therapy if days_on_therapy > 0 else 0"
  - adherence_ceiling: "P('max_days_supply_per_fill') if (coverage_pct >= K('adherence_full_pct') and fills_for_adherence >= K('adherence_min_fills')) else (MN(F('days_supply_per_fill') + K('settling_step_days'), P('max_days_supply_per_fill')) if (coverage_pct >= K('adherence_partial_pct') and coverage_pct < K('adherence_full_pct') and fills_for_adherence >= K('adherence_min_fills')) else F('days_supply_per_fill'))"
  - headroom_days: "DAYS(F('closed_on'), F('expires_on')) if (F('closed_on') and F('expires_on')) else 0"
  - exhaustion_ceiling: "P('max_days_supply_per_fill') if (F('status') == 'refills_exhausted' and headroom_days >= K('exhaustion_lead_days')) else (MN(F('days_supply_per_fill') + K('settling_step_days'), P('max_days_supply_per_fill')) if (F('status') == 'refills_exhausted' and headroom_days < K('exhaustion_lead_days')) else F('days_supply_per_fill'))"
  - result: "int(MN(fill_length, stability_ceiling, adherence_ceiling, exhaustion_ceiling, P('max_days_supply_per_fill')))"
  compute_basis:
    as_status: "where an Autoship Pharmacy subscription linked to the renewed prescription is in status pending_first_shipment, active or rx_hold ... where the linked subscription is paused"
    as_weeks: "its frequency in weeks times 7 is no more than the class's maximum days' supply per fill, the fill length is that frequency in weeks times 7 days"
    fills_dispensed: "the renewed prescription has at least two dispensed fills ... divided by the number of its dispensed fills less one"
    first_fill_on: "the number of calendar days from its first dispensed fill to its most recent dispensed fill"
    last_fill_on: "the number of calendar days from its first dispensed fill to its most recent dispensed fill"
    fill_length: "where an Autoship Pharmacy subscription linked to the renewed prescription is in status pending_first_shipment, active or rx_hold and its frequency in weeks times 7 is no more than the class's maximum days' supply per fill, the fill length is that frequency in weeks times 7 days; where the linked subscription is paused and the renewed prescription has at least two dispensed fills, the fill length is the number of calendar days from its first dispensed fill to its most recent dispensed fill divided by the number of its dispensed fills less one, rounded down to a whole day; otherwise the fill length is the renewed prescription's days' supply per fill."
    claims_open: "where no dispensed fill of it carries a dispensing-error claim without a refund or free-remake entry against that fill"
    fills_delivered: "the fills delivered being its dispensed fills less its fill credit-back entries"
    stability_ceiling: "where no dispensed fill of it carries a dispensing-error claim without a refund or free-remake entry against that fill and its fills delivered number at least stable_fills, the stability ceiling is the class's maximum days' supply per fill; where no such claim is open and its fills delivered number at least settling_fills but fewer than stable_fills, the stability ceiling is the renewed prescription's days' supply per fill plus settling_step_days days, never more than the class maximum; otherwise the stability ceiling is the renewed prescription's days' supply per fill."
    days_dispensed: "the days' supply dispensed on the renewed prescription, which is the days' supply of its dispensed fills less the days' supply of the fills credited back to it"
    fills_for_adherence: "at least adherence_min_fills fills were dispensed on it"
    days_on_therapy: "with the calendar days from its authorization date to the order date"
    coverage_pct: "with the calendar days from its authorization date to the order date, as a percentage"
    adherence_ceiling: "where that coverage is at least adherence_full_pct percent and at least adherence_min_fills fills were dispensed on it, the adherence ceiling is the class's maximum days' supply per fill; where the coverage is at least adherence_partial_pct percent but below adherence_full_pct percent and at least adherence_min_fills fills were dispensed on it, the adherence ceiling is the renewed prescription's days' supply per fill plus settling_step_days days, never more than the class maximum; otherwise the adherence ceiling is the renewed prescription's days' supply per fill."
    headroom_days: "the calendar days from its closing date to its expires_on"
    exhaustion_ceiling: "where it is in status refills_exhausted and the calendar days from its closing date to its expires_on number at least exhaustion_lead_days, the exhaustion ceiling is the class's maximum days' supply per fill; where it is in status refills_exhausted and those days number fewer than exhaustion_lead_days, the exhaustion ceiling is the renewed prescription's days' supply per fill plus settling_step_days days, never more than the class maximum; otherwise the exhaustion ceiling is the renewed prescription's days' supply per fill."
    result: "The days' supply per fill the renewal asks for is the fill length, but no more than the stability ceiling, the adherence ceiling, the exhaustion ceiling or the class's maximum days' supply per fill, whichever is smallest, in whole days."
  factors:
  - id: delivery_rhythm
    effect: method
    decides: fill_length
    bindings: [as_status, as_weeks, fills_dispensed, first_fill_on, last_fill_on, fill_length]
    ladder:
    - when: "an Autoship Pharmacy subscription linked to the renewed prescription is in status pending_first_shipment, active or rx_hold AND its frequency in weeks times 7 is no more than the class maximum"
      method: "the fill length is the subscription's frequency in weeks times 7 days (the Autoship cadence)"
    - when: "the linked subscription is paused AND the renewed prescription has at least two dispensed fills"
      method: "the fill length is the calendar days from the first to the most recent dispensed fill divided by the dispensed fills less one, rounded down to a whole day (the refill rhythm)"
    - when: "otherwise"
      method: "the fill length is the renewed prescription's days' supply per fill"
    baseline:
      fill_length: "F('days_supply_per_fill')"
    evidence: [cross_category, history, date]
    cross_difficulty: autoship
  - id: stability_ceiling
    effect: parameter
    decides: stability_ceiling
    bindings: [claims_open, fills_delivered, stability_ceiling]
    ladder:
    - when: "no dispensed fill carries a dispensing-error claim without a refund or free-remake entry AND the fills delivered (dispensed less credited back) number at least stable_fills"
      value: "P('max_days_supply_per_fill')"
    - when: "no such claim is open AND the fills delivered number at least settling_fills but fewer than stable_fills"
      value: "MN(F('days_supply_per_fill') + K('settling_step_days'), P('max_days_supply_per_fill'))"
    - when: "otherwise"
      value: "F('days_supply_per_fill')"
    baseline:
      stability_ceiling: "F('days_supply_per_fill')"
    evidence: [history]
    cross_difficulty: null
  - id: adherence_ceiling
    effect: parameter
    decides: adherence_ceiling
    bindings: [days_dispensed, fills_for_adherence, days_on_therapy, coverage_pct, adherence_ceiling]
    ladder:
    - when: "days' supply dispensed (net of fills credited back) covers at least adherence_full_pct percent of the calendar days from authorization to the order date AND at least adherence_min_fills fills were dispensed"
      value: "P('max_days_supply_per_fill')"
    - when: "the coverage is at least adherence_partial_pct but below adherence_full_pct percent AND at least adherence_min_fills fills were dispensed"
      value: "MN(F('days_supply_per_fill') + K('settling_step_days'), P('max_days_supply_per_fill'))"
    - when: "otherwise"
      value: "F('days_supply_per_fill')"
    baseline:
      adherence_ceiling: "F('days_supply_per_fill')"
    evidence: [history, date]
    cross_difficulty: null
  - id: exhaustion_ceiling
    effect: parameter
    decides: exhaustion_ceiling
    bindings: [headroom_days, exhaustion_ceiling]
    ladder:
    - when: "the renewed prescription is in status refills_exhausted AND it closed at least exhaustion_lead_days calendar days before its expires_on"
      value: "P('max_days_supply_per_fill')"
    - when: "the renewed prescription is in status refills_exhausted AND it closed fewer than exhaustion_lead_days calendar days before its expires_on"
      value: "MN(F('days_supply_per_fill') + K('settling_step_days'), P('max_days_supply_per_fill'))"
    - when: "otherwise (an expired prescription)"
      value: "F('days_supply_per_fill')"
    baseline:
      exhaustion_ceiling: "F('days_supply_per_fill')"
    evidence: [date]
    cross_difficulty: null
  baseline:
    rule: >-
      A renewal asks the veterinarian for the renewed prescription's days' supply per fill, never more than the
      class's maximum days' supply per fill. The packages per fill of the renewal are its days' supply per fill
      multiplied by the packages the renewed prescription dispenses per day of supply, that is its packages per fill
      divided by its days' supply per fill.
    params: [max_days_supply_per_fill]
  inputs:
    history:
    - {table: rx_events, aggregate: count, field: rx_event_id, filters: {event_type: rx_fill}}
    - {table: rx_events, aggregate: count, field: rx_event_id, filters: {event_type: rx_fill_restore}}
    - {table: rx_events, aggregate: count, field: rx_event_id, filters: {event_type: rx_error_refund}}
    - {table: rx_events, aggregate: sum, field: days_supply, filters: {event_type: rx_fill}}
    - {table: rx_events, aggregate: sum, field: days_supply, filters: {event_type: rx_fill_restore}}
    - {table: rx_events, aggregate: latest, field: event_date, filters: {event_type: rx_fill}}
    cross_category: [autoship]
- id: rx_ext_pharmacy_renewal
  base_policy_refs: [rx_agg_multi_holding, rx_authorization, rx_renewals, rx_transfers, rx_evt_fill_eligibility]
  overwrite: []
  trigger: state_due
  subject: [rx_order_create]
  computes: days_supply_per_fill
  target_tool: place_pharmacy_renewal_864ea03f
  params:
    rhythm_min_fills: 4
    blend_min_fills: 2
    member_tier_min_fills: 4
    step_days: 15
    headroom_days_min: 60
    coverage_full_pct: 85
    coverage_partial_pct: 70
  rule: >-
    This policy sets the days' supply per fill of the renewal the pharmacy places by itself for a prescription
    whose class carries auto_renewal_request, once the prescription stands at refills_exhausted after its last
    authorized fill, or stands at expired with fills still remaining because its renewal was not placed ahead of
    expires_on, and no renewal of it has been placed; that renewal is owed by the pharmacy without the customer
    asking, and the renewed
    prescription is the prescription the renewal names. The pharmacy sends that renewal to the prescribing
    veterinarian as a renewal request recorded against the renewed prescription, which stays awaiting the
    veterinarian's answer until it is approved or denied. A pharmacy-placed renewal asks for the renewed
    prescription's days' supply per fill, never more than the class's maximum days' supply per fill, and carries
    the renewed prescription's packages per fill. The bag-life length is how many days one fill of the renewed
    prescription actually lasted, read from its dispensed fills: where it has at least rhythm_min_fills dispensed
    fills and none of them was dispensed under an early-refill override, the bag-life length is the calendar days
    from its first dispensed fill to its most recent dispensed fill divided by its dispensed fills less one,
    rounded down to a whole day; where it has at least blend_min_fills but fewer than rhythm_min_fills dispensed
    fills and none under an early-refill override, the bag-life length is that measured interval plus its days'
    supply per fill, halved and rounded down to a whole day; otherwise the bag-life length is its days' supply per
    fill. The member-supply ceiling follows the customer's membership and the prescription's fill count: where the
    membership is on Tailwise Plus Annual or Tailwise Plus Premier Annual in status active and the renewed
    prescription has at least member_tier_min_fills dispensed fills, the member-supply ceiling is the class's
    maximum days' supply per fill; where the membership is on Tailwise Plus Monthly or Pals Rewards VIP in status
    active and the renewed prescription has at least member_tier_min_fills dispensed fills, the member-supply
    ceiling is the renewed prescription's days' supply per fill plus step_days days, never more than the class
    maximum; otherwise the member-supply ceiling is the renewed prescription's days' supply per fill. The override
    ceiling counts the renewed prescription's fills dispensed under an early-refill override (travel or
    lost_or_damaged) within the 12 calendar months ending on the renewal date: where there is none and the
    prescription has at least rhythm_min_fills dispensed fills, the override ceiling is the class's maximum days'
    supply per fill; where there is exactly one and the prescription has at least rhythm_min_fills dispensed
    fills, the override ceiling is the renewed prescription's days' supply per fill plus step_days days, never more
    than the class maximum; otherwise the override ceiling is the renewed prescription's days' supply per fill. The
    validity-headroom ceiling counts the calendar days from the renewed prescription's closing date to its
    expires_on: where it stands at refills_exhausted with at least headroom_days_min such days, the
    validity-headroom ceiling is the class's maximum days' supply per fill; where it stands at refills_exhausted
    with fewer such days, the validity-headroom ceiling is the renewed prescription's days' supply per fill plus
    step_days days, never more than the class maximum; otherwise, for a renewed prescription that stands at
    expired, the validity-headroom ceiling is the renewed prescription's days' supply per fill. The return ceiling counts unopened prescription diet returns on the
    renewed prescription's ledger within the 12 calendar months ending on the renewal date: where there is none
    and the prescription has at least rhythm_min_fills dispensed fills, the return ceiling is the class's maximum
    days' supply per fill; where there is exactly one and the prescription has at least rhythm_min_fills dispensed
    fills, the return ceiling is the renewed prescription's days' supply per fill plus step_days days, never more
    than the class maximum; otherwise the return ceiling is the renewed prescription's days' supply per fill. The
    supply-coverage ceiling takes the days' supply dispensed on the renewed prescription, net of the days' supply of
    the fills credited back to it, as a percentage of the calendar days from its authorization date to the renewal
    date: where that percentage is at least
    coverage_full_pct, the supply-coverage ceiling is the class's maximum days' supply per fill; where it is at
    least coverage_partial_pct but below coverage_full_pct, the supply-coverage ceiling is the renewed
    prescription's days' supply per fill plus step_days days, never more than the class maximum; otherwise the
    supply-coverage ceiling is the renewed prescription's days' supply per fill. The days' supply per fill of the
    pharmacy-placed renewal is the bag-life length, but no more than the member-supply, override,
    validity-headroom, return and supply-coverage ceilings or the class's maximum days' supply per fill, whichever
    is smallest, in whole days.
  prerequisite: []
  cross_category:
  - category: member
    as: branch
    reads: [variant_name, status]
    note: The member-supply ceiling is decided from the customer's membership tier and status.
  compute:
  - fills_n: "COUNT('rx_events', event_type='rx_fill')"
  - override_fills: "COUNT('rx_events', event_type='rx_fill', override_reason='travel') + COUNT('rx_events', event_type='rx_fill', override_reason='lost_or_damaged')"
  - first_fill_date: "LATEST('rx_events', 'event_date', event_type='rx_fill', fill_number=1)"
  - latest_fill_date: "LATEST('rx_events', 'event_date', event_type='rx_fill')"
  - measured_interval: "int(DAYS(first_fill_date, latest_fill_date) / (fills_n - 1)) if fills_n >= 2 else F('days_supply_per_fill')"
  - bag_life: "measured_interval if (fills_n >= K('rhythm_min_fills') and override_fills == 0) else (int((measured_interval + F('days_supply_per_fill')) / 2) if (fills_n >= K('blend_min_fills') and fills_n < K('rhythm_min_fills') and override_fills == 0) else F('days_supply_per_fill'))"
  - member_tier: "CFIELD('member', 'variant_name')"
  - member_status: "CFIELD('member', 'status')"
  - fills_for_member: "COUNT('rx_events', event_type='rx_fill')"
  - member_supply_ceiling: "P('max_days_supply_per_fill') if ((member_tier == 'Tailwise Plus Annual' or member_tier == 'Tailwise Plus Premier Annual') and member_status == 'active' and fills_for_member >= K('member_tier_min_fills')) else (MN(F('days_supply_per_fill') + K('step_days'), P('max_days_supply_per_fill')) if ((member_tier == 'Tailwise Plus Monthly' or member_tier == 'Pals Rewards VIP') and member_status == 'active' and fills_for_member >= K('member_tier_min_fills')) else F('days_supply_per_fill'))"
  - overrides_12m: "COUNT('rx_events', within_months=12, date_field='event_date', event_type='rx_fill', override_reason='travel') + COUNT('rx_events', within_months=12, date_field='event_date', event_type='rx_fill', override_reason='lost_or_damaged')"
  - fills_for_override: "COUNT('rx_events', event_type='rx_fill')"
  - override_ceiling: "P('max_days_supply_per_fill') if (overrides_12m == 0 and fills_for_override >= K('rhythm_min_fills')) else (MN(F('days_supply_per_fill') + K('step_days'), P('max_days_supply_per_fill')) if (overrides_12m == 1 and fills_for_override >= K('rhythm_min_fills')) else F('days_supply_per_fill'))"
  - headroom: "DAYS(F('closed_on'), F('expires_on')) if (F('closed_on') and F('expires_on')) else 0"
  - headroom_ceiling: "P('max_days_supply_per_fill') if (F('status') == 'refills_exhausted' and headroom >= K('headroom_days_min')) else (MN(F('days_supply_per_fill') + K('step_days'), P('max_days_supply_per_fill')) if (F('status') == 'refills_exhausted' and headroom < K('headroom_days_min')) else F('days_supply_per_fill'))"
  - returns_12m: "COUNT('rx_events', within_months=12, date_field='event_date', event_type='rx_diet_return_refund')"
  - fills_for_return: "COUNT('rx_events', event_type='rx_fill')"
  - return_ceiling: "P('max_days_supply_per_fill') if (returns_12m == 0 and fills_for_return >= K('rhythm_min_fills')) else (MN(F('days_supply_per_fill') + K('step_days'), P('max_days_supply_per_fill')) if (returns_12m == 1 and fills_for_return >= K('rhythm_min_fills')) else F('days_supply_per_fill'))"
  - days_dispensed: "SUM('rx_events', 'days_supply', event_type='rx_fill') - SUM('rx_events', 'days_supply', event_type='rx_fill_restore')"
  - days_since_auth: "DAYS(F('authorized_on'), NOW)"
  - coverage: "days_dispensed * 100 / days_since_auth if days_since_auth > 0 else 0"
  - coverage_ceiling: "P('max_days_supply_per_fill') if coverage >= K('coverage_full_pct') else (MN(F('days_supply_per_fill') + K('step_days'), P('max_days_supply_per_fill')) if (coverage >= K('coverage_partial_pct') and coverage < K('coverage_full_pct')) else F('days_supply_per_fill'))"
  - result: "int(MN(bag_life, member_supply_ceiling, override_ceiling, headroom_ceiling, return_ceiling, coverage_ceiling, P('max_days_supply_per_fill')))"
  compute_basis:
    fills_n: "where it has at least rhythm_min_fills dispensed fills ... divided by its dispensed fills less one"
    override_fills: "none of them was dispensed under an early-refill override"
    first_fill_date: "the calendar days from its first dispensed fill to its most recent dispensed fill"
    latest_fill_date: "the calendar days from its first dispensed fill to its most recent dispensed fill"
    measured_interval: "the calendar days from its first dispensed fill to its most recent dispensed fill divided by its dispensed fills less one, rounded down to a whole day"
    bag_life: "where it has at least rhythm_min_fills dispensed fills and none of them was dispensed under an early-refill override, the bag-life length is the calendar days from its first dispensed fill to its most recent dispensed fill divided by its dispensed fills less one, rounded down to a whole day; where it has at least blend_min_fills but fewer than rhythm_min_fills dispensed fills and none under an early-refill override, the bag-life length is that measured interval plus its days' supply per fill, halved and rounded down to a whole day; otherwise the bag-life length is its days' supply per fill."
    member_tier: "The member-supply ceiling follows the customer's membership and the prescription's fill count"
    member_status: "in status active"
    fills_for_member: "the renewed prescription has at least member_tier_min_fills dispensed fills"
    member_supply_ceiling: "where the membership is on Tailwise Plus Annual or Tailwise Plus Premier Annual in status active and the renewed prescription has at least member_tier_min_fills dispensed fills, the member-supply ceiling is the class's maximum days' supply per fill; where the membership is on Tailwise Plus Monthly or Pals Rewards VIP in status active and the renewed prescription has at least member_tier_min_fills dispensed fills, the member-supply ceiling is the renewed prescription's days' supply per fill plus step_days days, never more than the class maximum; otherwise the member-supply ceiling is the renewed prescription's days' supply per fill."
    overrides_12m: "The override ceiling counts the renewed prescription's fills dispensed under an early-refill override (travel or lost_or_damaged) within the 12 calendar months ending on the renewal date"
    fills_for_override: "the prescription has at least rhythm_min_fills dispensed fills"
    override_ceiling: "where there is none and the prescription has at least rhythm_min_fills dispensed fills, the override ceiling is the class's maximum days' supply per fill; where there is exactly one and the prescription has at least rhythm_min_fills dispensed fills, the override ceiling is the renewed prescription's days' supply per fill plus step_days days, never more than the class maximum; otherwise the override ceiling is the renewed prescription's days' supply per fill."
    headroom: "The validity-headroom ceiling counts the calendar days from the renewed prescription's closing date to its expires_on"
    headroom_ceiling: "where it stands at refills_exhausted with at least headroom_days_min such days, the validity-headroom ceiling is the class's maximum days' supply per fill; where it stands at refills_exhausted with fewer such days, the validity-headroom ceiling is the renewed prescription's days' supply per fill plus step_days days, never more than the class maximum; otherwise, for a renewed prescription that stands at expired, the validity-headroom ceiling is the renewed prescription's days' supply per fill."
    returns_12m: "The return ceiling counts unopened prescription diet returns on the renewed prescription's ledger within the 12 calendar months ending on the renewal date"
    fills_for_return: "the prescription has at least rhythm_min_fills dispensed fills"
    return_ceiling: "where there is none and the prescription has at least rhythm_min_fills dispensed fills, the return ceiling is the class's maximum days' supply per fill; where there is exactly one and the prescription has at least rhythm_min_fills dispensed fills, the return ceiling is the renewed prescription's days' supply per fill plus step_days days, never more than the class maximum; otherwise the return ceiling is the renewed prescription's days' supply per fill."
    days_dispensed: "takes the days' supply dispensed on the renewed prescription, net of the days' supply of the fills credited back to it"
    days_since_auth: "the calendar days from its authorization date to the renewal date"
    coverage: "takes the days' supply dispensed on the renewed prescription, net of the days' supply of the fills credited back to it, as a percentage of the calendar days from its authorization date to the renewal date"
    coverage_ceiling: "where that percentage is at least coverage_full_pct, the supply-coverage ceiling is the class's maximum days' supply per fill; where it is at least coverage_partial_pct but below coverage_full_pct, the supply-coverage ceiling is the renewed prescription's days' supply per fill plus step_days days, never more than the class maximum; otherwise the supply-coverage ceiling is the renewed prescription's days' supply per fill."
    result: "The days' supply per fill of the pharmacy-placed renewal is the bag-life length, but no more than the member-supply, override, validity-headroom, return and supply-coverage ceilings or the class's maximum days' supply per fill, whichever is smallest, in whole days."
  factors:
  - id: bag_life
    effect: method
    decides: bag_life
    bindings: [fills_n, override_fills, first_fill_date, latest_fill_date, measured_interval, bag_life]
    ladder:
    - when: "the renewed prescription has at least rhythm_min_fills dispensed fills AND none was dispensed under an early-refill override"
      method: "the measured interval: calendar days from the first to the most recent dispensed fill divided by the dispensed fills less one, rounded down"
    - when: "it has at least blend_min_fills but fewer than rhythm_min_fills dispensed fills AND none under an early-refill override"
      method: "the measured interval plus the written days' supply per fill, halved and rounded down"
    - when: "otherwise"
      method: "the renewed prescription's written days' supply per fill"
    baseline:
      bag_life: "F('days_supply_per_fill')"
    evidence: [history, date]
    cross_difficulty: null
  - id: member_supply_ceiling
    effect: parameter
    decides: member_supply_ceiling
    bindings: [member_tier, member_status, fills_for_member, member_supply_ceiling]
    ladder:
    - when: "the membership is on Tailwise Plus Annual or Tailwise Plus Premier Annual AND active AND the prescription has at least member_tier_min_fills dispensed fills"
      value: "P('max_days_supply_per_fill')"
    - when: "the membership is on Tailwise Plus Monthly or Pals Rewards VIP AND active AND at least member_tier_min_fills dispensed fills"
      value: "MN(F('days_supply_per_fill') + K('step_days'), P('max_days_supply_per_fill'))"
    - when: "otherwise"
      value: "F('days_supply_per_fill')"
    baseline:
      member_supply_ceiling: "F('days_supply_per_fill')"
    evidence: [cross_category, history]
    cross_difficulty: member
  - id: override_ceiling
    effect: parameter
    decides: override_ceiling
    bindings: [overrides_12m, fills_for_override, override_ceiling]
    ladder:
    - when: "no fill dispensed under an early-refill override within 12 months AND at least rhythm_min_fills dispensed fills"
      value: "P('max_days_supply_per_fill')"
    - when: "exactly one such override fill AND at least rhythm_min_fills dispensed fills"
      value: "MN(F('days_supply_per_fill') + K('step_days'), P('max_days_supply_per_fill'))"
    - when: "otherwise"
      value: "F('days_supply_per_fill')"
    baseline:
      override_ceiling: "F('days_supply_per_fill')"
    evidence: [history]
    cross_difficulty: null
  - id: validity_headroom_ceiling
    effect: parameter
    decides: headroom_ceiling
    bindings: [headroom, headroom_ceiling]
    ladder:
    - when: "the renewed prescription stands at refills_exhausted AND at least headroom_days_min calendar days lie between its closing date and its expires_on"
      value: "P('max_days_supply_per_fill')"
    - when: "it stands at refills_exhausted AND fewer such days"
      value: "MN(F('days_supply_per_fill') + K('step_days'), P('max_days_supply_per_fill'))"
    - when: "otherwise (the renewed prescription stands at expired with fills remaining)"
      value: "F('days_supply_per_fill')"
    baseline:
      headroom_ceiling: "F('days_supply_per_fill')"
    evidence: [date]
    cross_difficulty: null
  - id: return_ceiling
    effect: parameter
    decides: return_ceiling
    bindings: [returns_12m, fills_for_return, return_ceiling]
    ladder:
    - when: "no unopened prescription diet return on the ledger within 12 months AND at least rhythm_min_fills dispensed fills"
      value: "P('max_days_supply_per_fill')"
    - when: "exactly one such return AND at least rhythm_min_fills dispensed fills"
      value: "MN(F('days_supply_per_fill') + K('step_days'), P('max_days_supply_per_fill'))"
    - when: "otherwise"
      value: "F('days_supply_per_fill')"
    baseline:
      return_ceiling: "F('days_supply_per_fill')"
    evidence: [history]
    cross_difficulty: null
  - id: supply_coverage_ceiling
    effect: parameter
    decides: coverage_ceiling
    bindings: [days_dispensed, days_since_auth, coverage, coverage_ceiling]
    ladder:
    - when: "days' supply dispensed, net of fills credited back, is at least coverage_full_pct percent of the calendar days since authorization"
      value: "P('max_days_supply_per_fill')"
    - when: "at least coverage_partial_pct but below coverage_full_pct percent"
      value: "MN(F('days_supply_per_fill') + K('step_days'), P('max_days_supply_per_fill'))"
    - when: "otherwise"
      value: "F('days_supply_per_fill')"
    baseline:
      coverage_ceiling: "F('days_supply_per_fill')"
    evidence: [history, date]
    cross_difficulty: null
  baseline:
    rule: >-
      A pharmacy-placed renewal asks for the renewed prescription's days' supply per fill, never more than the
      class's maximum days' supply per fill, and carries the renewed prescription's packages per fill.
    params: [max_days_supply_per_fill]
  inputs:
    history:
    - {table: rx_events, aggregate: count, field: rx_event_id, filters: {event_type: rx_fill}}
    - {table: rx_events, aggregate: latest, field: event_date, filters: {event_type: rx_fill}}
    - {table: rx_events, aggregate: sum, field: days_supply, filters: {event_type: rx_fill}}
    - {table: rx_events, aggregate: count, field: rx_event_id, within_months: 12, filters: {event_type: rx_diet_return_refund}}
    cross_category: [member]
- id: rx_ext_household_diet_order
  base_policy_refs: [rx_agg_multi_holding, rx_authorization, rx_renewals, rx_transfers]
  overwrite: []
  trigger: on_request
  subject: [rx_order_create]
  computes: days_supply_per_fill
  target_tool: place_rx_new_order_4605ac63
  params:
    new_order_default_days: 30
    household_step_days: 15
    delivery_min_shipments: 3
    monitoring_recent_months: 3
    monitoring_any_months: 12
    tenure_long_months: 60
    tenure_mid_months: 24
  rule: >-
    This policy sets the days' supply per fill of a new order that a customer places for a pet's prescription diet
    (class Rx Prescription Diet) when another pet of the same customer already takes the same diet in the same
    package under a Tailwise prescription, the household prescription; the customer places the new order
    personally, it carries the household prescription's package, and its fills are meant to ship on the
    household's rhythm. A new order for a prescription diet asks for new_order_default_days days' supply per fill,
    never more than the class's maximum days' supply per fill. A new order's days' supply per fill is not set until
    the household prescription is active or carries a renewal request still awaiting the veterinarian's answer. The
    household length follows how the household's supply runs: where the household prescription is active or
    carries a renewal request still awaiting the veterinarian's answer, and its pet has an Autoship Pharmacy
    subscription for the same item in status active or pending_first_shipment, the household length is that
    subscription's frequency in weeks times 7 days; where the household prescription is active or carries a
    renewal request still awaiting the veterinarian's answer, and its pet has no subscription for the same item in
    either of those statuses, the household length is the household refill interval, the calendar days from the
    household prescription's first dispensed fill to its most recent dispensed fill divided by its dispensed fills
    less one, rounded down to a whole day (its days' supply per fill where it has fewer than two dispensed fills);
    otherwise the household length is new_order_default_days days. The standing ceiling follows the customer's
    membership tier: where the membership is on Tailwise Plus Annual or Tailwise Plus Premier Annual and its status
    is active, the standing ceiling is the class's maximum days' supply per fill; where the membership is on
    Tailwise Plus Monthly or Pals Rewards VIP and its status is active, the standing ceiling is
    new_order_default_days plus household_step_days days; otherwise the standing ceiling is new_order_default_days
    days. The delivery-record ceiling reads the customer's Autoship ledger over the 6 calendar months ending on the
    order date: where at least delivery_min_shipments Autoship shipments were charged and no Autoship payment was
    declined, the delivery-record ceiling is the class's maximum days' supply per fill; where at least one but fewer
    than delivery_min_shipments shipments were charged and no payment was declined, the delivery-record ceiling is
    new_order_default_days plus household_step_days days; otherwise the delivery-record ceiling is
    new_order_default_days days. The monitoring ceiling reads the urinalysis and blood panel services redeemed under
    the customer's Tailwise wellness plans: where at least one was redeemed within the monitoring_recent_months
    calendar months ending on the order date, the monitoring ceiling is the class's maximum days' supply per fill;
    where none was redeemed in that period but at least one was redeemed within the monitoring_any_months calendar
    months ending on the order date, the monitoring ceiling is new_order_default_days plus household_step_days days;
    otherwise the monitoring ceiling is new_order_default_days days. The tenure ceiling counts the whole calendar
    months from the membership's enrollment date to the order date: where they number at least tenure_long_months
    and the membership is active, the tenure ceiling is the class's maximum days' supply per fill; where they
    number at least tenure_mid_months but fewer than tenure_long_months and the membership is active, the tenure
    ceiling is new_order_default_days plus household_step_days days; otherwise the tenure ceiling is
    new_order_default_days days. The days' supply per fill of the new order is the household length, but no more
    than the standing, delivery-record, monitoring and tenure ceilings or the class's maximum days' supply per fill,
    whichever is smallest, in whole days.
  prerequisite:
  - problem: rx_ext_pharmacy_renewal
    kind: value_input
    gate: pending_renewal_requests
    form: state
    policy_source: >-
      A new order's days' supply per fill is not set until the household prescription is active or carries a
      renewal request still awaiting the veterinarian's answer.
    condition: >-
      The household prescription (the customer's rx_prescriptions row for another pet with the same medication and
      strength) is in status active, or an rx_authorization_requests row of request_kind renewal with outcome
      pending refers to it.
    resolved_by: place_pharmacy_renewal_864ea03f
    effect: >-
      Once the renewal request stands against the household prescription, the household length reads the
      household refill interval measured from its dispensed fills instead of falling to the new-order default.
  cross_category:
  - category: autoship
    as: history
    reads: [status, frequency_weeks, autoship_events.event_type, autoship_events.event_date]
    note: The household length reads the household pet's Autoship subscription for the diet, and the delivery-record
      ceiling counts the customer's charged and declined Autoship shipments over 6 months.
  - category: member
    as: branch
    reads: [variant_name, status, enrolled_on]
    note: The standing ceiling reads the membership tier and status, and the tenure ceiling the months since
      enrollment.
  - category: vet
    as: history
    reads: [vet_plan_events.service_code, vet_plan_events.event_date]
    note: The monitoring ceiling counts urinalysis and blood panel services redeemed under the customer's wellness
      plans.
  compute:
  - household_status: "F('status')"
  - pending_renewal_requests: "COUNT('rx_authorization_requests', request_kind='renewal', outcome='pending')"
  - household_fills: "COUNT('rx_events', event_type='rx_fill')"
  - household_first_fill: "LATEST('rx_events', 'event_date', event_type='rx_fill', fill_number=1)"
  - household_latest_fill: "LATEST('rx_events', 'event_date', event_type='rx_fill')"
  - household_interval: "int(DAYS(household_first_fill, household_latest_fill) / (household_fills - 1)) if household_fills >= 2 else F('days_supply_per_fill')"
  - diet_autoship_status: "CFIELD('autoship', 'status', pet_id=F('pet_id'), sku=F('sku'))"
  - diet_autoship_weeks: "CFIELD('autoship', 'frequency_weeks', pet_id=F('pet_id'), sku=F('sku'))"
  - household_length: "diet_autoship_weeks * 7 if ((household_status == 'active' or pending_renewal_requests > 0) and (diet_autoship_status == 'active' or diet_autoship_status == 'pending_first_shipment')) else (household_interval if ((household_status == 'active' or pending_renewal_requests > 0) and not (diet_autoship_status == 'active' or diet_autoship_status == 'pending_first_shipment')) else K('new_order_default_days'))"
  - standing_tier: "CFIELD('member', 'variant_name')"
  - standing_status: "CFIELD('member', 'status')"
  - standing_ceiling: "P('max_days_supply_per_fill') if ((standing_tier == 'Tailwise Plus Annual' or standing_tier == 'Tailwise Plus Premier Annual') and standing_status == 'active') else (K('new_order_default_days') + K('household_step_days') if ((standing_tier == 'Tailwise Plus Monthly' or standing_tier == 'Pals Rewards VIP') and standing_status == 'active') else K('new_order_default_days'))"
  - shipments_6m: "XCOUNT('autoship', 'autoship_events', within_months=6, date_field='event_date', event_type='autoship_shipment_charge')"
  - declines_6m: "XCOUNT('autoship', 'autoship_events', within_months=6, date_field='event_date', event_type='autoship_payment_declined')"
  - delivery_ceiling: "P('max_days_supply_per_fill') if (shipments_6m >= K('delivery_min_shipments') and declines_6m == 0) else (K('new_order_default_days') + K('household_step_days') if (shipments_6m >= 1 and shipments_6m < K('delivery_min_shipments') and declines_6m == 0) else K('new_order_default_days'))"
  - monitoring_recent: "XCOUNT('vet', 'vet_plan_events', within_months=K('monitoring_recent_months'), date_field='event_date', event_type='vet_service_redeem', service_code='urinalysis') + XCOUNT('vet', 'vet_plan_events', within_months=K('monitoring_recent_months'), date_field='event_date', event_type='vet_service_redeem', service_code='blood_panel')"
  - monitoring_any: "XCOUNT('vet', 'vet_plan_events', within_months=K('monitoring_any_months'), date_field='event_date', event_type='vet_service_redeem', service_code='urinalysis') + XCOUNT('vet', 'vet_plan_events', within_months=K('monitoring_any_months'), date_field='event_date', event_type='vet_service_redeem', service_code='blood_panel')"
  - monitoring_ceiling: "P('max_days_supply_per_fill') if monitoring_recent >= 1 else (K('new_order_default_days') + K('household_step_days') if (monitoring_recent == 0 and monitoring_any >= 1) else K('new_order_default_days'))"
  - enrolled_on: "CFIELD('member', 'enrolled_on')"
  - tenure_status: "CFIELD('member', 'status')"
  - tenure_months: "MONTHS(enrolled_on, NOW) if enrolled_on else 0"
  - tenure_ceiling: "P('max_days_supply_per_fill') if (tenure_months >= K('tenure_long_months') and tenure_status == 'active') else (K('new_order_default_days') + K('household_step_days') if (tenure_months >= K('tenure_mid_months') and tenure_months < K('tenure_long_months') and tenure_status == 'active') else K('new_order_default_days'))"
  - result: "int(MN(household_length, standing_ceiling, delivery_ceiling, monitoring_ceiling, tenure_ceiling, P('max_days_supply_per_fill')))"
  compute_basis:
    household_status: "where the household prescription is active"
    pending_renewal_requests: "or carries a renewal request still awaiting the veterinarian's answer"
    household_fills: "divided by its dispensed fills less one, rounded down to a whole day (its days' supply per fill where it has fewer than two dispensed fills)"
    household_first_fill: "the calendar days from the household prescription's first dispensed fill to its most recent dispensed fill"
    household_latest_fill: "the calendar days from the household prescription's first dispensed fill to its most recent dispensed fill"
    household_interval: "the household refill interval, the calendar days from the household prescription's first dispensed fill to its most recent dispensed fill divided by its dispensed fills less one, rounded down to a whole day (its days' supply per fill where it has fewer than two dispensed fills)"
    diet_autoship_status: "its pet has an Autoship Pharmacy subscription for the same item in status active or pending_first_shipment"
    diet_autoship_weeks: "the household length is that subscription's frequency in weeks times 7 days"
    household_length: "where the household prescription is active or carries a renewal request still awaiting the veterinarian's answer, and its pet has an Autoship Pharmacy subscription for the same item in status active or pending_first_shipment, the household length is that subscription's frequency in weeks times 7 days; where the household prescription is active or carries a renewal request still awaiting the veterinarian's answer, and its pet has no subscription for the same item in either of those statuses, the household length is the household refill interval ...; otherwise the household length is new_order_default_days days."
    standing_tier: "The standing ceiling follows the customer's membership tier"
    standing_status: "and its status is active"
    standing_ceiling: "where the membership is on Tailwise Plus Annual or Tailwise Plus Premier Annual and its status is active, the standing ceiling is the class's maximum days' supply per fill; where the membership is on Tailwise Plus Monthly or Pals Rewards VIP and its status is active, the standing ceiling is new_order_default_days plus household_step_days days; otherwise the standing ceiling is new_order_default_days days."
    shipments_6m: "The delivery-record ceiling reads the customer's Autoship ledger over the 6 calendar months ending on the order date"
    declines_6m: "and no Autoship payment was declined"
    delivery_ceiling: "where at least delivery_min_shipments Autoship shipments were charged and no Autoship payment was declined, the delivery-record ceiling is the class's maximum days' supply per fill; where at least one but fewer than delivery_min_shipments shipments were charged and no payment was declined, the delivery-record ceiling is new_order_default_days plus household_step_days days; otherwise the delivery-record ceiling is new_order_default_days days."
    monitoring_recent: "The monitoring ceiling reads the urinalysis and blood panel services redeemed under the customer's Tailwise wellness plans ... within the monitoring_recent_months calendar months ending on the order date"
    monitoring_any: "within the monitoring_any_months calendar months ending on the order date"
    monitoring_ceiling: "where at least one was redeemed within the monitoring_recent_months calendar months ending on the order date, the monitoring ceiling is the class's maximum days' supply per fill; where none was redeemed in that period but at least one was redeemed within the monitoring_any_months calendar months ending on the order date, the monitoring ceiling is new_order_default_days plus household_step_days days; otherwise the monitoring ceiling is new_order_default_days days."
    enrolled_on: "The tenure ceiling counts the whole calendar months from the membership's enrollment date to the order date"
    tenure_status: "and the membership is active"
    tenure_months: "the whole calendar months from the membership's enrollment date to the order date"
    tenure_ceiling: "where they number at least tenure_long_months and the membership is active, the tenure ceiling is the class's maximum days' supply per fill; where they number at least tenure_mid_months but fewer than tenure_long_months and the membership is active, the tenure ceiling is new_order_default_days plus household_step_days days; otherwise the tenure ceiling is new_order_default_days days."
    result: "The days' supply per fill of the new order is the household length, but no more than the standing, delivery-record, monitoring and tenure ceilings or the class's maximum days' supply per fill, whichever is smallest, in whole days."
  factors:
  - id: household_length
    effect: method
    decides: household_length
    bindings: [household_status, pending_renewal_requests, household_fills, household_first_fill, household_latest_fill, household_interval, diet_autoship_status, diet_autoship_weeks, household_length]
    ladder:
    - when: "the household prescription is active or carries a renewal request awaiting the veterinarian's answer AND its pet has an Autoship Pharmacy subscription for the same item that is active or pending_first_shipment"
      method: "the subscription's frequency in weeks times 7 days"
    - when: "the household prescription is active or carries a renewal request awaiting the veterinarian's answer AND its pet has no such subscription in those statuses"
      method: "the household refill interval: days from its first to its most recent dispensed fill divided by its dispensed fills less one, rounded down"
    - when: "otherwise"
      method: "the new-order default of new_order_default_days days"
    baseline:
      household_length: "K('new_order_default_days')"
    evidence: [history, date, cross_category]
    cross_difficulty: autoship
  - id: standing_ceiling
    effect: parameter
    decides: standing_ceiling
    bindings: [standing_tier, standing_status, standing_ceiling]
    ladder:
    - when: "membership on Tailwise Plus Annual or Tailwise Plus Premier Annual AND status active"
      value: "P('max_days_supply_per_fill')"
    - when: "membership on Tailwise Plus Monthly or Pals Rewards VIP AND status active"
      value: "K('new_order_default_days') + K('household_step_days')"
    - when: "otherwise"
      value: "K('new_order_default_days')"
    baseline:
      standing_ceiling: "K('new_order_default_days')"
    evidence: [cross_category]
    cross_difficulty: member
  - id: delivery_record_ceiling
    effect: parameter
    decides: delivery_ceiling
    bindings: [shipments_6m, declines_6m, delivery_ceiling]
    ladder:
    - when: "at least delivery_min_shipments Autoship shipments charged in the last 6 months AND no Autoship payment declined in that period"
      value: "P('max_days_supply_per_fill')"
    - when: "at least one but fewer than delivery_min_shipments shipments charged AND no payment declined"
      value: "K('new_order_default_days') + K('household_step_days')"
    - when: "otherwise"
      value: "K('new_order_default_days')"
    baseline:
      delivery_ceiling: "K('new_order_default_days')"
    evidence: [cross_category, history]
    cross_difficulty: autoship
  - id: monitoring_ceiling
    effect: parameter
    decides: monitoring_ceiling
    bindings: [monitoring_recent, monitoring_any, monitoring_ceiling]
    ladder:
    - when: "a urinalysis or blood panel redeemed under the customer's wellness plans within monitoring_recent_months months"
      value: "P('max_days_supply_per_fill')"
    - when: "none in that period but at least one within monitoring_any_months months"
      value: "K('new_order_default_days') + K('household_step_days')"
    - when: "otherwise"
      value: "K('new_order_default_days')"
    baseline:
      monitoring_ceiling: "K('new_order_default_days')"
    evidence: [cross_category, history]
    cross_difficulty: vet
  - id: tenure_ceiling
    effect: parameter
    decides: tenure_ceiling
    bindings: [enrolled_on, tenure_status, tenure_months, tenure_ceiling]
    ladder:
    - when: "at least tenure_long_months whole months since the membership's enrollment date AND the membership is active"
      value: "P('max_days_supply_per_fill')"
    - when: "at least tenure_mid_months but fewer than tenure_long_months months AND active"
      value: "K('new_order_default_days') + K('household_step_days')"
    - when: "otherwise"
      value: "K('new_order_default_days')"
    baseline:
      tenure_ceiling: "K('new_order_default_days')"
    evidence: [cross_category, date]
    cross_difficulty: member
  baseline:
    rule: >-
      A new order for a prescription diet asks for new_order_default_days days' supply per fill, never more than the
      class's maximum days' supply per fill.
    params: [new_order_default_days, max_days_supply_per_fill]
  inputs:
    history:
    - {table: rx_events, aggregate: count, field: rx_event_id, filters: {event_type: rx_fill}}
    - {table: rx_authorization_requests, aggregate: count, field: auth_request_id, filters: {request_kind: renewal, outcome: pending}}
    - {category: autoship, table: autoship_events, aggregate: count, field: autoship_event_id, within_months: 6, filters: {event_type: autoship_shipment_charge}}
    - {category: vet, table: vet_plan_events, aggregate: count, field: vet_event_id, within_months: 12, filters: {event_type: vet_service_redeem}}
    cross_category: [autoship, member, vet]
