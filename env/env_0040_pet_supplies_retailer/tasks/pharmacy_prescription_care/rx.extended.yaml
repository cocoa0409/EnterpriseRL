- id: rx_dispensing_errors
  subject: [rx_error_remake, rx_error_refund, rx_fill_restore]
  rule: A dispensing error is a wrong medication, wrong strength, wrong quantity or wrong label on a fill, confirmed
    against the fill record. A dispensing error is accepted only if it is reported no later than dispensing_error_report_days
    after the erroneous fill's dispense date. The window is counted in calendar days from the event_date of the
    erroneous rx_fill row, that date being day 0; a report on the last day is in time. No rx_error_remake or rx_error_refund
    row already refers to the same original_event_id. The customer chooses a free remake shipped at no charge where
    error_remake_allowed is true, otherwise a refund. A remake does not use a fill. A refund returns the fill's
    merchandise amount after discount and, with error_refund_includes_shipping, its shipping and service fees, to
    the original payment, and the refunded fill is credited back to fills_remaining. The erroneous product is never
    resold and need not be returned. A dissatisfaction that is not a dispensing error is not covered by this rule.
  eligibility:
  - id: error_window
    applies_to: [rx_error_remake, rx_error_refund]
    kind: time
    condition: A dispensing error is accepted only if it is reported no later than dispensing_error_report_days
      after the erroneous fill's dispense date.
    evidence_fields: [rx_events.event_date, rx_events.rx_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rx_events.rx_event_id]
      action_bindings:
        rx_events.rx_event_id: original_event_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the erroneous fill's dispense date
      anchor_source: rx_events.event_date
      relation: not_after
      duration_source: variants.dispensing_error_report_days
      unit: calendar_days
      counting_rule: The window is counted in calendar days from the event_date of the erroneous rx_fill row, that
        date being day 0; a report on the last day is in time.
      boundary: inclusive
  - id: one_remedy_per_error
    applies_to: [rx_error_remake, rx_error_refund]
    kind: dedup
    condition: No rx_error_remake or rx_error_refund row already refers to the same original_event_id.
    evidence_fields: [rx_events.original_event_id, rx_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rx_events.original_event_id]
      action_bindings:
        rx_events.original_event_id: original_event_id
    dedup_contract:
      table: rx_events
      mode: separate_record
      object_bindings:
        original_event_id: original_event_id
      duplicate_filters:
        event_type: [rx_error_remake, rx_error_refund]
      distinct_fields: []
  params:
    per_tier:
      Rx Preventive:
        dispensing_error_report_days: =dispensing_error_report_days
        error_remake_allowed: =error_remake_allowed
        error_refund_includes_shipping: =error_refund_includes_shipping
      Rx Maintenance Medication:
        dispensing_error_report_days: =dispensing_error_report_days
        error_remake_allowed: =error_remake_allowed
        error_refund_includes_shipping: =error_refund_includes_shipping
      Rx Prescription Diet:
        dispensing_error_report_days: =dispensing_error_report_days
        error_remake_allowed: =error_remake_allowed
        error_refund_includes_shipping: =error_refund_includes_shipping
      Rx Short-Course Medication:
        dispensing_error_report_days: =dispensing_error_report_days
        error_remake_allowed: =error_remake_allowed
        error_refund_includes_shipping: =error_refund_includes_shipping
      Rx Controlled Substance:
        dispensing_error_report_days: =dispensing_error_report_days
        error_remake_allowed: =error_remake_allowed
        error_refund_includes_shipping: =error_refund_includes_shipping
      Rx Compounded Medication:
        dispensing_error_report_days: =dispensing_error_report_days
        error_remake_allowed: =error_remake_allowed
        error_refund_includes_shipping: =error_refund_includes_shipping
- id: rx_evt_returns
  subject: [rx_diet_return_refund]
  rule: Dispensed medications are never accepted back for resale or refund, opened or not; only unopened prescription
    diet product may be returned, where unopened_return_window_days is above 0. An unopened prescription diet return
    is accepted only if it is requested no later than unopened_return_window_days after the returned fill's dispense
    date. The return window is counted in calendar days from the event_date of the returned rx_fill row, that date
    being day 0; a request on the last day is in time. The refund is the returned packages' share of the fill's
    merchandise amount after discount, less return_restocking_fee_pct, to the original payment; shipping is not
    refunded, and the fill is not credited back.
  eligibility:
  - id: diet_return_window
    applies_to: [rx_diet_return_refund]
    kind: time
    condition: An unopened prescription diet return is accepted only if it is requested no later than unopened_return_window_days
      after the returned fill's dispense date.
    evidence_fields: [rx_events.event_date, rx_events.rx_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
