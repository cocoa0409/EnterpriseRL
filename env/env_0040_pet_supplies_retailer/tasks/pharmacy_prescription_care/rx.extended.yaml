  measures: [rx_msr_same_day_subtotal]
- id: rx_authorization
  subject: [rx_order_create, rx_authorize, rx_deny]
  rule: Every new prescription and every renewal is dispensed only on the prescribing veterinarian's authorization;
    the pharmacy never fills on the customer's word or on a photo of a label. When the class's dea_prescriber_required
    is true, the prescribing veterinarian's record shows dea_registered true. The customer's shipping_state is not
    listed in the class's state_shipping_restrictions. When weight_check_required is true, the pet's weight is checked
    only if it was recorded no earlier than weight_record_max_age_months before the order date. The weight age is
    counted in calendar months back from the order date, falling back to the last day of the month when that day
    does not exist; a weight recorded exactly on that boundary date is current. An order failing one of these is
    not sent to the veterinarian and is cancelled the same day with the reason explained. The pharmacy sends the
    first request within vet_contact_within_business_days business days of the order through one of auth_request_channels,
    waits vet_response_wait_business_days business days (Monday to Friday, excluding federal holidays) after each
    attempt, and follows up until vet_followup_attempts attempts have been made; when the last attempt goes unanswered
    the request closes as no_response and the prescription is denied with denial_reason no_response. The prescription
    status is pending_vet_authorization when an approval or denial is recorded. On approval the fills authorized
    are the first fill plus the refills the veterinarian wrote, never more than max_refills_authorizable refills,
    and expires_on is the earlier of the veterinarian's written expiry and the authorization date plus rx_validity_months
    (month-end falls back to the last day of the month). A denial records the veterinarian's reason and closes the
    prescription; with denial_resubmission_requires_new_vet_contact the customer may only place a new order after
    speaking to the veterinarian.
  eligibility:
  - id: dea_prescriber
    applies_to: [rx_order_create]
    kind: authorization
    condition: When the class's dea_prescriber_required is true, the prescribing veterinarian's record shows dea_registered
      true.
    evidence_fields: [veterinarians.dea_registered, veterinarians.vet_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [veterinarians.vet_id]
      action_bindings:
        veterinarians.vet_id: vet_id
  - id: shippable_state
    applies_to: [rx_order_create]
    kind: authorization
    condition: The customer's shipping_state is not listed in the class's state_shipping_restrictions.
    evidence_fields: [customers.shipping_state, customers.customer_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [customers.customer_id]
      action_bindings:
        customers.customer_id: customer_id
  - id: current_weight
    applies_to: [rx_order_create]
    kind: time
    condition: When weight_check_required is true, the pet's weight is checked only if it was recorded no earlier
      than weight_record_max_age_months before the order date.
    evidence_fields: [pets.weight_recorded_on, pets.pet_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [pets.pet_id]
      action_bindings:
        pets.pet_id: pet_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the order date
      anchor_source: pets.weight_recorded_on
      relation: not_before
      duration_source: variants.weight_record_max_age_months
      unit: calendar_months
      counting_rule: The weight age is counted in calendar months back from the order date, falling back to the
        last day of the month when that day does not exist; a weight recorded exactly on that boundary date is current.
      boundary: inclusive
  params:
    per_tier:
      Rx Preventive:
        dea_prescriber_required: =dea_prescriber_required
        state_shipping_restrictions: =state_shipping_restrictions
        weight_check_required: =weight_check_required
        weight_record_max_age_months: =weight_record_max_age_months
        auth_request_channels: =auth_request_channels
        vet_contact_within_business_days: =vet_contact_within_business_days
        vet_response_wait_business_days: =vet_response_wait_business_days
        vet_followup_attempts: =vet_followup_attempts
        max_refills_authorizable: =max_refills_authorizable
        rx_validity_months: =rx_validity_months
        denial_resubmission_requires_new_vet_contact: =denial_resubmission_requires_new_vet_contact
      Rx Maintenance Medication:
        dea_prescriber_required: =dea_prescriber_required
        state_shipping_restrictions: =state_shipping_restrictions
        weight_check_required: =weight_check_required
        weight_record_max_age_months: =weight_record_max_age_months
        auth_request_channels: =auth_request_channels
        vet_contact_within_business_days: =vet_contact_within_business_days
        vet_response_wait_business_days: =vet_response_wait_business_days
        vet_followup_attempts: =vet_followup_attempts
