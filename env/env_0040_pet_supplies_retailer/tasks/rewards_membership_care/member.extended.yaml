    - date
    cross_difficulty: groom
  baseline:
    rule: When a customer on a free tier buys Tailwise Plus Annual, the first-term Plus Annual fee is charged to the card
      on file on the purchase date and the paid term starts that day. The standard first-term Plus Annual fee is annual_fee_usd,
      the membership_fee_usd of Tailwise Plus Annual. A customer with no membership fee charged in the trial_lookback_days
      calendar days before the purchase is in a free trial and is charged nothing on the purchase date. The first-term Plus
      Annual fee is never below zero and is rounded to the nearest cent as the last step.
    params:
    - annual_fee_usd
    - trial_lookback_days
  inputs:
    history:
    - table: member_events
      aggregate: latest
      field: event_date
      within_months: null
      filters:
        event_type: member_fee_charge
    - table: member_events
      aggregate: sum
      field: amount_usd
      within_months: 6
      filters:
        event_type: member_fee_charge
    - table: member_events
      aggregate: sum
      field: qualifying_spend_usd
      within_months: 12
      filters:
        event_type: member_points_earn
    - table: member_events
      aggregate: sum
      field: qualifying_spend_usd
      within_months: 12
      filters:
        event_type: member_points_reverse
    - category: autoship
      table: autoship_events
      aggregate: count
