  compute:
  - standard_validity: P('certificate_validity_days')
  - cert_last_day: LATEST('member_events', 'certificate_expires_on', event_type='member_certificate_issue')
  - refund_date: XLATEST('order', 'order_events', 'event_date', event_type='order_return_refund')
  - method_validity: standard_validity + DAYS(NOW, cert_last_day) + 1 if cert_last_day >= NOW else (standard_validity + DAYS(cert_last_day,
      NOW) if cert_last_day >= refund_date else standard_validity)
  - is_fault: XLATEST('order', 'order_events', 'return_reason', event_type='order_return_refund') == 'damaged' or XLATEST('order',
      'order_events', 'return_reason', event_type='order_return_refund') == 'defective' or XLATEST('order', 'order_events',
      'return_reason', event_type='order_return_refund') == 'wrong_item' or XLATEST('order', 'order_events', 'return_reason',
      event_type='order_return_refund') == 'not_as_described'
  - fault_ext: K('fault_ext_high') if is_fault and DAYS(refund_date, NOW) > K('fault_wait_days') else (K('fault_ext_low')
      if is_fault else 0)
  - is_paid: F('variant_name') == 'Tailwise Plus Monthly' or F('variant_name') == 'Tailwise Plus Annual' or F('variant_name')
      == 'Tailwise Plus Premier Annual'
  - ztenure_months: MONTHS(F('enrolled_on'), NOW)
  - tenure_ext: K('ztenure_ext_high') if is_paid and ztenure_months >= K('ztenure_long_months') else (K('ztenure_ext_low')
      if ztenure_months >= K('ztenure_mid_months') else 0)
  - certs_12m: COUNT('member_events', within_months=12, event_type='member_certificate_issue')
  - redeem_ext: K('redeem_ext_high') if certs_12m >= K('redeem_high_count') else (K('redeem_ext_low') if certs_12m >= K('redeem_low_count')
      else 0)
  - zships_3m: XCOUNT('autoship', 'autoship_events', within_months=3, event_type='autoship_shipment_charge')
  - autoship_ext: K('zship_ext_high') if zships_3m >= K('zship_count') else (K('zship_ext_low') if zships_3m >= 1 else 0)
  - result: int(method_validity + fault_ext + tenure_ext + redeem_ext + autoship_ext)
  compute_basis:
    standard_validity: The standard reissue validity is the certificate_validity_days of the tier held, counted in calendar
      days with the reissue date as day 1.
    cert_last_day: 'The reissue validity is produced by one of three methods, set by the last usable day of the certificate
      being reissued: on or after the reissue date, the standard reissue validity plus the days that certificate still has
      left, the reissue date counted; before the reissue date but on or after the refund date of the return, the standard
      reissue validity plus the calendar days from that last usable day to the reissue date; before the refund date, the standard
      reissue validity alone.'
    refund_date: 'The reissue validity is produced by one of three methods, set by the last usable day of the certificate
      being reissued: on or after the reissue date, the standard reissue validity plus the days that certificate still has
      left, the reissue date counted; before the reissue date but on or after the refund date of the return, the standard
      reissue validity plus the calendar days from that last usable day to the reissue date; before the refund date, the standard
      reissue validity alone.'
    method_validity: 'The reissue validity is produced by one of three methods, set by the last usable day of the certificate
      being reissued: on or after the reissue date, the standard reissue validity plus the days that certificate still has
      left, the reissue date counted; before the reissue date but on or after the refund date of the return, the standard
      reissue validity plus the calendar days from that last usable day to the reissue date; before the refund date, the standard
      reissue validity alone.'
    is_fault: 'A fault extension is added: a return whose reason is damaged, defective, wrong_item or not_as_described and
      whose refund is dated more than fault_wait_days calendar days before the reissue date, fault_ext_high days; a return
      with one of those reasons refunded at most fault_wait_days days before the reissue date, fault_ext_low days; a return
      with any other reason, no fault extension.'
    fault_ext: 'A fault extension is added: a return whose reason is damaged, defective, wrong_item or not_as_described and
      whose refund is dated more than fault_wait_days calendar days before the reissue date, fault_ext_high days; a return
      with one of those reasons refunded at most fault_wait_days days before the reissue date, fault_ext_low days; a return
      with any other reason, no fault extension.'
    is_paid: 'A tenure extension is added: a membership on a paid tier and enrolled for at least ztenure_long_months months,
      ztenure_ext_high days; a membership that does not meet both of those conditions but is enrolled for at least ztenure_mid_months
      months, ztenure_ext_low days; any other membership, no tenure extension.'
    ztenure_months: 'A tenure extension is added: a membership on a paid tier and enrolled for at least ztenure_long_months
      months, ztenure_ext_high days; a membership that does not meet both of those conditions but is enrolled for at least
      ztenure_mid_months months, ztenure_ext_low days; any other membership, no tenure extension.'
    tenure_ext: 'A tenure extension is added: a membership on a paid tier and enrolled for at least ztenure_long_months months,
      ztenure_ext_high days; a membership that does not meet both of those conditions but is enrolled for at least ztenure_mid_months
      months, ztenure_ext_low days; any other membership, no tenure extension.'
    certs_12m: 'A redeemer extension is added according to the certificates issued on the ledger in the last 12 months: at
      least redeem_high_count, redeem_ext_high days; at least redeem_low_count but fewer than redeem_high_count, redeem_ext_low
      days; fewer than redeem_low_count, no redeemer extension.'
    redeem_ext: 'A redeemer extension is added according to the certificates issued on the ledger in the last 12 months: at
      least redeem_high_count, redeem_ext_high days; at least redeem_low_count but fewer than redeem_high_count, redeem_ext_low
      days; fewer than redeem_low_count, no redeemer extension.'
    zships_3m: 'An Autoship extension is added: a customer whose Autoship subscriptions carry at least zship_count charged
      shipments dated in the last three months, zship_ext_high days; at least one but fewer than zship_count, zship_ext_low
      days; none, no Autoship extension.'
    autoship_ext: 'An Autoship extension is added: a customer whose Autoship subscriptions carry at least zship_count charged
      shipments dated in the last three months, zship_ext_high days; at least one but fewer than zship_count, zship_ext_low
      days; none, no Autoship extension.'
    result: The reissue validity granted is the days produced by its method plus every extension added to it, as a whole number
      of days.
  factors:
  - id: reissue_anchor
    effect: method
    decides: method_validity
    bindings:
    - cert_last_day
    - refund_date
    - method_validity
    ladder:
    - when: the certificate's last usable day is on or after the reissue date
      method: standard validity plus the days it still has left, the reissue date counted
    - when: the last usable day is before the reissue date but on or after the refund date
      method: standard validity plus the calendar days from the last usable day to the reissue date
    - when: otherwise
      method: standard validity alone
    baseline:
      method_validity: standard_validity
    evidence:
    - history
    - cross_category
    - date
    cross_difficulty: order
  - id: fault_extension
    effect: parameter
    decides: fault_ext
    bindings:
    - is_fault
    - fault_ext
    ladder:
    - when: a Tailwise-fault return reason and a refund dated more than fault_wait_days days before the reissue
      value: K('fault_ext_high')
    - when: a Tailwise-fault return reason refunded at most fault_wait_days days before
      value: K('fault_ext_low')
    - when: otherwise
      value: '0'
    baseline:
      fault_ext: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: order
  - id: reissue_tenure
    effect: parameter
    decides: tenure_ext
    bindings:
    - is_paid
    - ztenure_months
    - tenure_ext
    ladder:
    - when: a paid tier and enrolled at least ztenure_long_months months
      value: K('ztenure_ext_high')
    - when: not both, but enrolled at least ztenure_mid_months months
      value: K('ztenure_ext_low')
    - when: otherwise
      value: '0'
    baseline:
      tenure_ext: '0'
    evidence:
    - tier_param
    - date
    cross_difficulty: null
  - id: redeemer_extension
    effect: parameter
    decides: redeem_ext
    bindings:
    - certs_12m
    - redeem_ext
    ladder:
    - when: at least redeem_high_count certificates issued in 12 months
      value: K('redeem_ext_high')
    - when: at least redeem_low_count but fewer
      value: K('redeem_ext_low')
    - when: otherwise
      value: '0'
    baseline:
      redeem_ext: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: autoship_extension
    effect: parameter
    decides: autoship_ext
    bindings:
    - zships_3m
    - autoship_ext
    ladder:
    - when: at least zship_count charged Autoship shipments in three months
      value: K('zship_ext_high')
    - when: at least one but fewer
      value: K('zship_ext_low')
    - when: otherwise
      value: '0'
    baseline:
      autoship_ext: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: autoship
  baseline:
    rule: When an order on which a reward certificate was used is refunded on return, a care agent reissues that certificate
      at its certificate_value_usd. The standard reissue validity is the certificate_validity_days of the tier held, counted
      in calendar days with the reissue date as day 1. The reissue validity granted is the days produced by its method plus
      every extension added to it, as a whole number of days.
    params:
    - certificate_validity_days
    - certificate_value_usd
  inputs:
    history:
    - table: member_events
      aggregate: latest
      field: certificate_expires_on
      within_months: null
      filters:
        event_type: member_certificate_issue
    - table: member_events
      aggregate: count
      field: member_event_id
      within_months: 12
      filters:
        event_type: member_certificate_issue
    - category: order
      table: order_events
      aggregate: latest
      field: event_date
