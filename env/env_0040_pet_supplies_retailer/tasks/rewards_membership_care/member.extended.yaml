    rships_6m: 'A reversal Autoship allowance is then kept back: a customer whose Autoship subscriptions carry at least rship_high_count
      charged shipments dated in the last six months keeps rship_keep_high points; at least rship_low_count but fewer than
      rship_high_count keeps rship_keep_low points; fewer than rship_low_count keeps none.'
    autoship_keep: 'A reversal Autoship allowance is then kept back: a customer whose Autoship subscriptions carry at least
      rship_high_count charged shipments dated in the last six months keeps rship_keep_high points; at least rship_low_count
      but fewer than rship_high_count keeps rship_keep_low points; fewer than rship_low_count keeps none.'
    after_keep: 'The order of the reversal is fixed: the method gives the points to reverse, the visit-usage share then scales
      them, the reversal tenure, spend, age and Autoship allowances are then subtracted, the result is never below zero, and
      the two caps on what the pass purchase earned and on the balance apply last.'
    result: The reversal is never more than the points the pass purchase earned, and a reversal larger than the current points
      balance takes the balance only to zero.
  factors:
  - id: reversal_basis
    effect: method
    decides: basis_points
    bindings:
    - declined_on
    - last_fee_on
    - basis_points
    ladder:
    - when: a refund dated on or after the latest declined-fee entry with no fee charged from that date through the refund
      method: refunded dollars times standard_points_per_usd, rounded down
    - when: not the first case, and the pass's earning predates the held tier's effective date
      method: refunded dollars times the held tier's base_points_per_usd, rounded down
    - when: otherwise
      method: the standard reversal
    baseline:
      basis_points: standard_reversal
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: visit_usage_share
    effect: parameter
    decides: usage_share
    bindings:
    - visits_bought
    - visits_removed
    - usage_share
    ladder:
    - when: at least usage_high_visits visits used on the pass before cancellation
      value: K('usage_share_high')
    - when: at least one but fewer than usage_high_visits visits used
      value: K('usage_share_low')
    - when: otherwise
      value: '1'
    baseline:
      usage_share: '1'
    evidence:
    - cross_category
    cross_difficulty: groom
  - id: reversal_tenure_allowance
    effect: parameter
    decides: tenure_keep
    bindings:
    - is_paid
    - rtenure_months
    - tenure_keep
    ladder:
    - when: a paid tier and enrolled at least rtenure_long_months months
      value: K('rtenure_keep_high')
    - when: not both, but a paid tier or Pals Rewards VIP and enrolled at least rtenure_mid_months months
      value: K('rtenure_keep_low')
    - when: otherwise
      value: '0'
    baseline:
      tenure_keep: '0'
    evidence:
    - tier_param
    - date
    cross_difficulty: null
  - id: reversal_spend_allowance
    effect: parameter
    decides: spend_keep
    bindings:
    - net_spend_12m
    - spend_keep
    ladder:
    - when: 12-month net qualifying spend at least rspend_high_usd
      value: K('rspend_keep_high')
    - when: at least rspend_low_usd but below rspend_high_usd
      value: K('rspend_keep_low')
    - when: otherwise
      value: '0'
    baseline:
      spend_keep: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: reversal_age_allowance
    effect: parameter
    decides: age_keep
    bindings:
    - age_days
    - age_keep
    ladder:
    - when: more than rage_long_days days from the earning to the refund
      value: K('rage_keep_high')
    - when: more than rage_short_days but at most rage_long_days days
      value: K('rage_keep_low')
    - when: otherwise
      value: '0'
    baseline:
      age_keep: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: reversal_autoship_allowance
    effect: parameter
    decides: autoship_keep
    bindings:
    - rships_6m
    - autoship_keep
    ladder:
    - when: at least rship_high_count charged Autoship shipments in six months
      value: K('rship_keep_high')
    - when: at least rship_low_count but fewer
      value: K('rship_keep_low')
    - when: otherwise
      value: '0'
    baseline:
      autoship_keep: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: autoship
  baseline:
    rule: When a grooming pass that earned points is cancelled and its unused visits are refunded, a care agent books the
      points reversal of the pass purchase, dated on the refund date and tied to the pass. The standard reversal is the points
      the pass purchase earned times the amount refunded divided by the pass purchase's qualifying spend, rounded down to
      a whole point. The reversal is never more than the points the pass purchase earned, and a reversal larger than the current
      points balance takes the balance only to zero.
    params:
    - points_reversal_on_refund
    - negative_balance_allowed
  inputs:
    history:
    - table: member_events
      aggregate: latest
      field: points
      within_months: null
      filters:
        event_type: member_points_earn
        source_category: groom
    - table: member_events
      aggregate: latest
      field: event_date
      within_months: null
      filters:
        event_type: member_fee_declined
    - table: member_events
      aggregate: sum
      field: qualifying_spend_usd
      within_months: 12
      filters:
        event_type: member_points_earn
    - category: groom
      table: groom_events
      aggregate: latest
      field: amount_usd
      within_months: null
      filters:
        event_type: groom_pass_refund
    - category: autoship
      table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 6
      filters:
        event_type: autoship_shipment_charge
    cross_category:
    - groom
    - autoship
- id: member_ext_premier_upgrade_charge
  base_policy_refs:
  - member_enrollment_and_trials
  - member_tier_qualification
  - member_plus_cancellation
  - member_shipping_benefit
  - member_plus_billing
  overwrite:
  - base_policy: member_enrollment_and_trials
    superseded_clause: where upgrade_credit_unused_fee is true the unused days of the current fee, prorated by calendar day,
      are credited against the new fee.
    replaced_by: 'The unused-term credit is produced by one of three methods: where the latest membership fee was charged
      after the first day of the billing period it pays for, the credit is that fee times the unused days divided by the days
      from that fee''s charge date through plus_term_end with both days counted; where that fee was charged on the first day
      of its billing period and the change date is at most full_credit_days days after it, the credit is that whole fee; otherwise
      the credit is the standard unused-term credit.'
  - base_policy: member_plus_billing
    superseded_clause: A paid tier charges membership_fee_usd on each next_billing_date while auto_renew is true;
    replaced_by: 'The order of the upgrade charge is fixed: the unused-term credit comes off the Premier fee first, the Premier
      loyalty rate then applies once to that reduced charge, and the Premier spend, salon, Autoship and redeemer allowances
      are then subtracted from the result as flat amounts.'
  trigger: on_request
  subject:
  - member_tier_change
  - member_fee_charge
  computes: upgrade_charge_usd
  target_tool: upgrade_plus_tier_d51b9d82
  params:
    premier_fee_usd: 119.0
    full_credit_days: 30
    prem_fee_count_high: 3
    prem_fee_count_low: 2
    prem_long_months: 60
    prem_mid_months: 24
    prem_rate_high: 0.1
    prem_rate_low: 0.05
    prem_spend_high_usd: 1500.0
    prem_spend_low_usd: 800.0
    prem_spend_allow_high: 12.0
    prem_spend_allow_low: 6.0
    prem_salon_days: 60
    prem_salon_allow_high: 10.0
    prem_salon_allow_low: 5.0
    prem_ship_high_count: 6
    prem_ship_low_count: 3
    prem_ship_allow_high: 8.0
    prem_ship_allow_low: 4.0
    prem_cert_high_count: 5
    prem_cert_low_count: 3
    prem_cert_allow_high: 3.0
    prem_cert_allow_low: 1.5
  rule: 'When a Tailwise Plus Annual member moves up to Tailwise Plus Premier Annual, the upgrade charge is collected with
    the card on file on the change date and a new Premier term starts that day with the annual_perk_credit_usd perk credit
    of Tailwise Plus Premier Annual. The standard upgrade charge is premier_fee_usd, the membership_fee_usd of Tailwise Plus
    Premier Annual, less the unused-term credit. The standard unused-term credit is the latest membership fee charged times
    the unused days of the current term, from the change date through plus_term_end with both days counted, divided by the
    days of the current term from plus_term_start through plus_term_end with both days counted, prorated by calendar day and
    never below zero. The unused-term credit is produced by one of three methods: where the latest membership fee was charged
    after the first day of the billing period it pays for, the credit is that fee times the unused days divided by the days
    from that fee''s charge date through plus_term_end with both days counted; where that fee was charged on the first day
    of its billing period and the change date is at most full_credit_days days after it, the credit is that whole fee; otherwise
    the credit is the standard unused-term credit. A Premier loyalty rate then reduces the charge left after the unused-term
    credit: a membership with at least prem_fee_count_high membership fees charged in the last 36 months and enrolled for
    at least prem_long_months months, prem_rate_high; a membership that does not meet both of those conditions but has at
    least prem_fee_count_low such fees and is enrolled for at least prem_mid_months months, prem_rate_low; any other membership,
    no Premier loyalty rate. A Premier spend allowance is then subtracted according to the membership''s net qualifying spend
    over the last 12 months, its points-earning qualifying spend less its points-reversal qualifying spend: at least prem_spend_high_usd,
    prem_spend_allow_high; at least prem_spend_low_usd but below prem_spend_high_usd, prem_spend_allow_low; below prem_spend_low_usd,
    no Premier spend allowance. A Premier salon allowance is then subtracted: a customer holding an active grooming pass whose
    latest completed visit was at most prem_salon_days calendar days before the change date, prem_salon_allow_high; a customer
    holding an active grooming pass without such a visit, prem_salon_allow_low; a customer holding no active grooming pass,
    no Premier salon allowance. A Premier Autoship allowance is then subtracted: a customer whose Autoship subscriptions carry
    at least prem_ship_high_count charged shipments dated in the last six months, prem_ship_allow_high; at least prem_ship_low_count
    but fewer than prem_ship_high_count, prem_ship_allow_low; fewer than prem_ship_low_count, no Premier Autoship allowance.
    A Premier redeemer allowance is then subtracted according to the certificates issued or reissued on the ledger in the
    last 12 months: at least prem_cert_high_count, prem_cert_allow_high; at least prem_cert_low_count but fewer than prem_cert_high_count,
    prem_cert_allow_low; fewer than prem_cert_low_count, no Premier redeemer allowance. The order of the upgrade charge is
    fixed: the unused-term credit comes off the Premier fee first, the Premier loyalty rate then applies once to that reduced
    charge, and the Premier spend, salon, Autoship and redeemer allowances are then subtracted from the result as flat amounts.
    The upgrade charge is never below zero and is rounded to the nearest cent as the last step. The upgrade charge is fixed
    only after every billing period the membership has started carries a charged membership fee. The upgrade charge is not
    fixed until every purchase refunded in the last 12 months carries its points reversal on the rewards ledger. The upgrade
    charge is fixed only after the rewards ledger carries a reissue of every certificate used on an order returned in the
    last 12 months.'
  prerequisite:
  - problem: member_ext_overdue_annual_fee
    kind: value_input
    gate: term_fee
    form: state
    policy_source: The upgrade charge is fixed only after every billing period the membership has started carries a charged
      membership fee.
    condition: every billing period whose billing_period_start has passed has a member_fee_charge row; no member_fee_declined
      period is left without a charge
    resolved_by: reinstate_plus_tier_c2894e52
    effect: the overdue fee charged for the declined period becomes the latest membership fee (term_fee) and the current term
      moves to that period, so the unused-term credit and the count of fees in 36 months change
  - problem: member_ext_refund_points_reversal
    kind: value_input
    gate: net_spend_12m
    form: state
    policy_source: The upgrade charge is not fixed until every purchase refunded in the last 12 months carries its points
      reversal on the rewards ledger.
    condition: every order_return_refund and groom_pass_refund of the customer dated in the last 12 months has a member_points_reverse
      row whose source_event_id is the refunded purchase record
    resolved_by: reverse_refund_points_2db3868c
    effect: the reversal takes the refunded spend out of the 12-month net qualifying spend (net_spend_12m), which sets the
      Premier spend allowance tier
  - problem: member_ext_return_certificate_reissue
    kind: value_input
    gate: certs_12m
    form: state
    policy_source: The upgrade charge is fixed only after the rewards ledger carries a reissue of every certificate used on
      an order returned in the last 12 months.
    condition: every certificate applied to an order line refunded by an order_return_refund in the last 12 months has a member_certificate_reissue
      row whose original_event_id is that certificate's issue row
    resolved_by: reissue_returned_certificate_0ad7eee8
    effect: the reissue adds a certificate entry to the 12-month count of certificates issued or reissued (certs_12m), which
      sets the Premier redeemer allowance tier
  cross_category:
  - category: groom
    as: branch
    reads:
    - status
    - groom_events.event_date
    note: an active grooming pass and its latest completed visit decide the Premier salon allowance tier
  - category: autoship
    as: history
    reads:
    - autoship_events.event_type
    - autoship_events.event_date
    note: the six-month count of charged Autoship shipments decides the Premier Autoship allowance tier
  compute:
  - premier_fee: K('premier_fee_usd')
  - term_fee: LATEST('member_events', 'amount_usd', event_type='member_fee_charge') or 0
  - fee_charged_on: LATEST('member_events', 'event_date', event_type='member_fee_charge') or '1900-01-01'
  - fee_period_start: LATEST('member_events', 'billing_period_start', event_type='member_fee_charge') or '1900-01-01'
  - unused_days: MX(0, DAYS(NOW, F('plus_term_end')) + 1)
  - term_days: DAYS(F('plus_term_start'), F('plus_term_end')) + 1
  - standard_credit: MX(0, term_fee * unused_days / term_days)
  - term_credit: term_fee * unused_days / (DAYS(fee_charged_on, F('plus_term_end')) + 1) if fee_charged_on > fee_period_start
      else (term_fee if DAYS(fee_charged_on, NOW) <= K('full_credit_days') else standard_credit)
  - fees_36m: COUNT('member_events', within_months=36, event_type='member_fee_charge')
  - prem_tenure: MONTHS(F('enrolled_on'), NOW)
  - prem_rate: K('prem_rate_high') if fees_36m >= K('prem_fee_count_high') and prem_tenure >= K('prem_long_months') else (K('prem_rate_low')
      if fees_36m >= K('prem_fee_count_low') and prem_tenure >= K('prem_mid_months') else 0)
  - net_spend_12m: RND(SUM('member_events', 'qualifying_spend_usd', within_months=12, event_type='member_points_earn') - SUM('member_events',
      'qualifying_spend_usd', within_months=12, event_type='member_points_reverse'), 2)
  - spend_allow: K('prem_spend_allow_high') if net_spend_12m >= K('prem_spend_high_usd') else (K('prem_spend_allow_low') if
      net_spend_12m >= K('prem_spend_low_usd') else 0)
  - salon_active: EXISTS('groom', status='active')
  - last_visit: XLATEST('groom', 'groom_events', 'event_date', event_type='groom_visit_complete') or '1900-01-01'
  - salon_allow: K('prem_salon_allow_high') if salon_active and DAYS(last_visit, NOW) <= K('prem_salon_days') else (K('prem_salon_allow_low')
      if salon_active else 0)
  - ships_6m: XCOUNT('autoship', 'autoship_events', within_months=6, event_type='autoship_shipment_charge')
  - ship_allow: K('prem_ship_allow_high') if ships_6m >= K('prem_ship_high_count') else (K('prem_ship_allow_low') if ships_6m
      >= K('prem_ship_low_count') else 0)
  - certs_12m: COUNT('member_events', within_months=12, event_type='member_certificate_issue') + COUNT('member_events', within_months=12,
      event_type='member_certificate_reissue')
  - cert_allow: K('prem_cert_allow_high') if certs_12m >= K('prem_cert_high_count') else (K('prem_cert_allow_low') if certs_12m
      >= K('prem_cert_low_count') else 0)
  - after_credit: MX(0, premier_fee - term_credit)
  - after_rate: after_credit * (1 - prem_rate)
  - result: RND(MX(0, after_rate - spend_allow - salon_allow - ship_allow - cert_allow), 2)
  compute_basis:
    premier_fee: The standard upgrade charge is premier_fee_usd, the membership_fee_usd of Tailwise Plus Premier Annual, less
      the unused-term credit.
    term_fee: The standard unused-term credit is the latest membership fee charged times the unused days of the current term,
      from the change date through plus_term_end with both days counted, divided by the days of the current term from plus_term_start
      through plus_term_end with both days counted, prorated by calendar day and never below zero.
    fee_charged_on: 'The unused-term credit is produced by one of three methods: where the latest membership fee was charged
      after the first day of the billing period it pays for, the credit is that fee times the unused days divided by the days
      from that fee''s charge date through plus_term_end with both days counted; where that fee was charged on the first day
      of its billing period and the change date is at most full_credit_days days after it, the credit is that whole fee; otherwise
      the credit is the standard unused-term credit.'
    fee_period_start: 'The unused-term credit is produced by one of three methods: where the latest membership fee was charged
      after the first day of the billing period it pays for, the credit is that fee times the unused days divided by the days
      from that fee''s charge date through plus_term_end with both days counted; where that fee was charged on the first day
      of its billing period and the change date is at most full_credit_days days after it, the credit is that whole fee; otherwise
      the credit is the standard unused-term credit.'
    unused_days: The standard unused-term credit is the latest membership fee charged times the unused days of the current
      term, from the change date through plus_term_end with both days counted, divided by the days of the current term from
      plus_term_start through plus_term_end with both days counted, prorated by calendar day and never below zero.
    term_days: The standard unused-term credit is the latest membership fee charged times the unused days of the current term,
      from the change date through plus_term_end with both days counted, divided by the days of the current term from plus_term_start
      through plus_term_end with both days counted, prorated by calendar day and never below zero.
    standard_credit: The standard unused-term credit is the latest membership fee charged times the unused days of the current
      term, from the change date through plus_term_end with both days counted, divided by the days of the current term from
      plus_term_start through plus_term_end with both days counted, prorated by calendar day and never below zero.
    term_credit: 'The unused-term credit is produced by one of three methods: where the latest membership fee was charged
      after the first day of the billing period it pays for, the credit is that fee times the unused days divided by the days
      from that fee''s charge date through plus_term_end with both days counted; where that fee was charged on the first day
      of its billing period and the change date is at most full_credit_days days after it, the credit is that whole fee; otherwise
      the credit is the standard unused-term credit.'
    fees_36m: 'A Premier loyalty rate then reduces the charge left after the unused-term credit: a membership with at least
      prem_fee_count_high membership fees charged in the last 36 months and enrolled for at least prem_long_months months,
      prem_rate_high; a membership that does not meet both of those conditions but has at least prem_fee_count_low such fees
      and is enrolled for at least prem_mid_months months, prem_rate_low; any other membership, no Premier loyalty rate.'
    prem_tenure: 'A Premier loyalty rate then reduces the charge left after the unused-term credit: a membership with at least
      prem_fee_count_high membership fees charged in the last 36 months and enrolled for at least prem_long_months months,
      prem_rate_high; a membership that does not meet both of those conditions but has at least prem_fee_count_low such fees
      and is enrolled for at least prem_mid_months months, prem_rate_low; any other membership, no Premier loyalty rate.'
    prem_rate: 'A Premier loyalty rate then reduces the charge left after the unused-term credit: a membership with at least
      prem_fee_count_high membership fees charged in the last 36 months and enrolled for at least prem_long_months months,
      prem_rate_high; a membership that does not meet both of those conditions but has at least prem_fee_count_low such fees
      and is enrolled for at least prem_mid_months months, prem_rate_low; any other membership, no Premier loyalty rate.'
    net_spend_12m: 'A Premier spend allowance is then subtracted according to the membership''s net qualifying spend over
      the last 12 months, its points-earning qualifying spend less its points-reversal qualifying spend: at least prem_spend_high_usd,
      prem_spend_allow_high; at least prem_spend_low_usd but below prem_spend_high_usd, prem_spend_allow_low; below prem_spend_low_usd,
      no Premier spend allowance.'
    spend_allow: 'A Premier spend allowance is then subtracted according to the membership''s net qualifying spend over the
      last 12 months, its points-earning qualifying spend less its points-reversal qualifying spend: at least prem_spend_high_usd,
      prem_spend_allow_high; at least prem_spend_low_usd but below prem_spend_high_usd, prem_spend_allow_low; below prem_spend_low_usd,
      no Premier spend allowance.'
    salon_active: 'A Premier salon allowance is then subtracted: a customer holding an active grooming pass whose latest completed
      visit was at most prem_salon_days calendar days before the change date, prem_salon_allow_high; a customer holding an
      active grooming pass without such a visit, prem_salon_allow_low; a customer holding no active grooming pass, no Premier
      salon allowance.'
    last_visit: 'A Premier salon allowance is then subtracted: a customer holding an active grooming pass whose latest completed
      visit was at most prem_salon_days calendar days before the change date, prem_salon_allow_high; a customer holding an
      active grooming pass without such a visit, prem_salon_allow_low; a customer holding no active grooming pass, no Premier
      salon allowance.'
    salon_allow: 'A Premier salon allowance is then subtracted: a customer holding an active grooming pass whose latest completed
      visit was at most prem_salon_days calendar days before the change date, prem_salon_allow_high; a customer holding an
      active grooming pass without such a visit, prem_salon_allow_low; a customer holding no active grooming pass, no Premier
      salon allowance.'
    ships_6m: 'A Premier Autoship allowance is then subtracted: a customer whose Autoship subscriptions carry at least prem_ship_high_count
      charged shipments dated in the last six months, prem_ship_allow_high; at least prem_ship_low_count but fewer than prem_ship_high_count,
      prem_ship_allow_low; fewer than prem_ship_low_count, no Premier Autoship allowance.'
    ship_allow: 'A Premier Autoship allowance is then subtracted: a customer whose Autoship subscriptions carry at least prem_ship_high_count
      charged shipments dated in the last six months, prem_ship_allow_high; at least prem_ship_low_count but fewer than prem_ship_high_count,
      prem_ship_allow_low; fewer than prem_ship_low_count, no Premier Autoship allowance.'
    certs_12m: 'A Premier redeemer allowance is then subtracted according to the certificates issued or reissued on the ledger
      in the last 12 months: at least prem_cert_high_count, prem_cert_allow_high; at least prem_cert_low_count but fewer than
      prem_cert_high_count, prem_cert_allow_low; fewer than prem_cert_low_count, no Premier redeemer allowance.'
    cert_allow: 'A Premier redeemer allowance is then subtracted according to the certificates issued or reissued on the ledger
      in the last 12 months: at least prem_cert_high_count, prem_cert_allow_high; at least prem_cert_low_count but fewer than
      prem_cert_high_count, prem_cert_allow_low; fewer than prem_cert_low_count, no Premier redeemer allowance.'
    after_credit: 'The order of the upgrade charge is fixed: the unused-term credit comes off the Premier fee first, the Premier
      loyalty rate then applies once to that reduced charge, and the Premier spend, salon, Autoship and redeemer allowances
      are then subtracted from the result as flat amounts.'
    after_rate: 'The order of the upgrade charge is fixed: the unused-term credit comes off the Premier fee first, the Premier
      loyalty rate then applies once to that reduced charge, and the Premier spend, salon, Autoship and redeemer allowances
      are then subtracted from the result as flat amounts.'
    result: The upgrade charge is never below zero and is rounded to the nearest cent as the last step.
  factors:
  - id: unused_term_credit
    effect: method
    decides: term_credit
    bindings:
    - fee_charged_on
    - fee_period_start
    - term_credit
    ladder:
    - when: the latest fee was charged after the first day of the billing period it pays for
      method: fee times unused days over the days from its charge date through the term end
    - when: the fee was charged on its period's first day and the change is at most full_credit_days days after it
      method: the whole fee
    - when: otherwise
      method: the standard unused-term credit
    baseline:
      term_credit: standard_credit
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: premier_loyalty_rate
    effect: parameter
    decides: prem_rate
    bindings:
    - fees_36m
    - prem_tenure
    - prem_rate
    ladder:
    - when: at least prem_fee_count_high fees in 36 months and enrolled at least prem_long_months months
      value: K('prem_rate_high')
    - when: not both, but at least prem_fee_count_low fees and enrolled at least prem_mid_months months
      value: K('prem_rate_low')
    - when: otherwise
      value: '0'
    baseline:
      prem_rate: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: premier_spend_allowance
    effect: parameter
    decides: spend_allow
    bindings:
    - net_spend_12m
    - spend_allow
    ladder:
    - when: 12-month net qualifying spend at least prem_spend_high_usd
      value: K('prem_spend_allow_high')
    - when: at least prem_spend_low_usd but below prem_spend_high_usd
      value: K('prem_spend_allow_low')
    - when: otherwise
      value: '0'
    baseline:
      spend_allow: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: premier_salon_allowance
    effect: parameter
    decides: salon_allow
    bindings:
    - salon_active
    - last_visit
    - salon_allow
    ladder:
    - when: an active grooming pass with a completed visit at most prem_salon_days days before the change
      value: K('prem_salon_allow_high')
    - when: an active grooming pass without such a visit
      value: K('prem_salon_allow_low')
    - when: otherwise
      value: '0'
    baseline:
      salon_allow: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: groom
  - id: premier_autoship_allowance
    effect: parameter
    decides: ship_allow
    bindings:
    - ships_6m
    - ship_allow
    ladder:
    - when: at least prem_ship_high_count charged Autoship shipments in six months
      value: K('prem_ship_allow_high')
    - when: at least prem_ship_low_count but fewer
      value: K('prem_ship_allow_low')
    - when: otherwise
      value: '0'
    baseline:
      ship_allow: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: autoship
  - id: premier_redeemer_allowance
    effect: parameter
    decides: cert_allow
    bindings:
    - certs_12m
    - cert_allow
    ladder:
    - when: at least prem_cert_high_count certificates issued or reissued in 12 months
      value: K('prem_cert_allow_high')
    - when: at least prem_cert_low_count but fewer
      value: K('prem_cert_allow_low')
    - when: otherwise
      value: '0'
    baseline:
      cert_allow: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: When a Tailwise Plus Annual member moves up to Tailwise Plus Premier Annual, the upgrade charge is collected with
      the card on file on the change date and a new Premier term starts that day with the annual_perk_credit_usd perk credit
      of Tailwise Plus Premier Annual. The standard upgrade charge is premier_fee_usd, the membership_fee_usd of Tailwise
      Plus Premier Annual, less the unused-term credit. The standard unused-term credit is the latest membership fee charged
      times the unused days of the current term, from the change date through plus_term_end with both days counted, divided
      by the days of the current term from plus_term_start through plus_term_end with both days counted, prorated by calendar
      day and never below zero. The upgrade charge is never below zero and is rounded to the nearest cent as the last step.
    params:
    - premier_fee_usd
    - membership_fee_usd
    - annual_perk_credit_usd
    - upgrade_credit_unused_fee
  inputs:
    history:
    - table: member_events
      aggregate: latest
      field: amount_usd
      within_months: null
      filters:
        event_type: member_fee_charge
    - table: member_events
      aggregate: count
      field: member_event_id
      within_months: 36
      filters:
        event_type: member_fee_charge
    - table: member_events
      aggregate: sum
      field: qualifying_spend_usd
      within_months: 12
      filters:
        event_type: member_points_earn
    - table: member_events
      aggregate: count
      field: member_event_id
      within_months: 12
      filters:
        event_type: member_certificate_issue
    - category: autoship
      table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 6
      filters:
        event_type: autoship_shipment_charge
    - category: groom
      table: groom_events
      aggregate: latest
      field: event_date
      within_months: null
      filters:
        event_type: groom_visit_complete
    - table: member_events
      aggregate: count
      field: member_event_id
      within_months: 12
      filters:
        event_type: member_certificate_reissue
    cross_category:
    - groom
    - autoship
