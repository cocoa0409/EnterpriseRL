    - table: member_events
      aggregate: count
      field: member_event_id
      within_months: 36
      filters:
        event_type: member_fee_charge
    - table: member_events
      aggregate: count
      field: member_event_id
      within_months: 24
      filters:
        event_type: member_fee_declined
    - category: autoship
      table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 3
      filters:
        event_type: autoship_shipment_charge
    - category: groom
      table: groom_events
      aggregate: latest
      field: event_date
      within_months: null
      filters:
        event_type: groom_visit_complete
    - table: member_events
