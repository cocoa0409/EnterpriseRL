      spend_high_ratio times the qualifying spend threshold of the tier being applied, spend_bonus_high points; at least spend_low_ratio
      times but below spend_high_ratio times that threshold, spend_bonus_low points; below spend_low_ratio times, no over-achievement
      bonus; the thresholds are insider_threshold_usd for Pals Rewards Insider and vip_threshold_usd for Pals Rewards VIP.'
    latest_earn_date: 'A fast-track bonus is added according to the calendar days from the date the currently held tier took
      effect to the date of the latest points-earning entry on the ledger: at most speed_fast_days days, speed_bonus_high
      points; more than speed_fast_days but at most speed_mid_days days, speed_bonus_low points; more than speed_mid_days
      days, no fast-track bonus.'
    speed_days: 'A fast-track bonus is added according to the calendar days from the date the currently held tier took effect
      to the date of the latest points-earning entry on the ledger: at most speed_fast_days days, speed_bonus_high points;
      more than speed_fast_days but at most speed_mid_days days, speed_bonus_low points; more than speed_mid_days days, no
      fast-track bonus.'
    speed_bonus: 'A fast-track bonus is added according to the calendar days from the date the currently held tier took effect
      to the date of the latest points-earning entry on the ledger: at most speed_fast_days days, speed_bonus_high points;
      more than speed_fast_days but at most speed_mid_days days, speed_bonus_low points; more than speed_mid_days days, no
      fast-track bonus.'
    ships_3m: 'A cross-program bonus is added: a customer whose Autoship subscriptions carry at least cross_ship_count charged
      shipments dated in the last three months and who also holds an active grooming pass receives cross_bonus_high points;
      a customer who meets exactly one of those two conditions receives cross_bonus_low points; a customer who meets neither
      receives no cross-program bonus.'
    salon_active: 'A cross-program bonus is added: a customer whose Autoship subscriptions carry at least cross_ship_count
      charged shipments dated in the last three months and who also holds an active grooming pass receives cross_bonus_high
      points; a customer who meets exactly one of those two conditions receives cross_bonus_low points; a customer who meets
      neither receives no cross-program bonus.'
    cross_bonus: 'A cross-program bonus is added: a customer whose Autoship subscriptions carry at least cross_ship_count
      charged shipments dated in the last three months and who also holds an active grooming pass receives cross_bonus_high
      points; a customer who meets exactly one of those two conditions receives cross_bonus_low points; a customer who meets
      neither receives no cross-program bonus.'
    tenure_months: 'A tenure bonus is added: a membership enrolled for at least tenure_long_months months receives tenure_bonus_high
      points; enrolled for at least tenure_mid_months but fewer than tenure_long_months months, tenure_bonus_low points; enrolled
      for fewer than tenure_mid_months months, no tenure bonus.'
    tenure_bonus: 'A tenure bonus is added: a membership enrolled for at least tenure_long_months months receives tenure_bonus_high
      points; enrolled for at least tenure_mid_months but fewer than tenure_long_months months, tenure_bonus_low points; enrolled
      for fewer than tenure_mid_months months, no tenure bonus.'
    result: Enrollment bonuses post with the enrollment that earns them, and the earned-tier upgrade bonus posted with an
      applied earned tier is the sum of the bonus produced by its method and every bonus added to it, as a whole number of
      points.
    upgrade_points_24m: 'The earned-tier upgrade bonus is produced by one of three methods: a membership whose rewards ledger
      carries, dated in the last 24 months, a tier-upgrade bonus entry equal to the standard earned-tier upgrade bonus of
      the tier being applied is re-earning that tier and receives that standard bonus less every tier-upgrade bonus point
      posted to it in the last 24 months, never below zero; a membership whose ledger carries no tier-upgrade bonus entry
      at all is earning its first upgrade and receives that standard bonus plus one point for every whole dollar by which
      its net qualifying spend over the last 12 months exceeds the qualifying spend threshold of the tier being applied; any
      other membership receives that standard bonus unchanged.'
  factors:
  - id: upgrade_bonus_method
    effect: method
    decides: method_bonus
    bindings:
    - same_tier_recent
    - any_upgrade_entry
    - upgrade_points_24m
    - method_bonus
    ladder:
    - when: a tier-upgrade bonus entry equal to the standard bonus of the tier being applied, dated in the last 24 months
      method: the standard bonus less every tier-upgrade bonus point posted in the last 24 months, never below zero
    - when: no tier-upgrade bonus entry on the ledger at all
      method: the standard bonus plus one point per whole dollar of 12-month net qualifying spend above the tier's threshold
    - when: otherwise
      method: the standard earned-tier upgrade bonus unchanged
    baseline:
      method_bonus: standard_bonus
    evidence:
    - history
    cross_difficulty: null
  - id: over_achievement
    effect: parameter
    decides: spend_bonus
    bindings:
    - net_spend_12m
    - spend_bonus
    ladder:
    - when: 12-month net qualifying spend at least spend_high_ratio times the tier's threshold
      value: K('spend_bonus_high')
    - when: at least spend_low_ratio times but below spend_high_ratio times
      value: K('spend_bonus_low')
    - when: otherwise
      value: '0'
    baseline:
      spend_bonus: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: fast_track
    effect: parameter
    decides: speed_bonus
    bindings:
    - latest_earn_date
    - speed_days
    - speed_bonus
    ladder:
    - when: at most speed_fast_days days from the held tier's effective date to the latest points-earning entry
      value: K('speed_bonus_high')
    - when: more than speed_fast_days but at most speed_mid_days days
      value: K('speed_bonus_low')
    - when: otherwise
      value: '0'
    baseline:
      speed_bonus: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: cross_program
    effect: parameter
    decides: cross_bonus
    bindings:
    - ships_3m
    - salon_active
    - cross_bonus
    ladder:
    - when: at least cross_ship_count charged Autoship shipments in the last three months and an active grooming pass
      value: K('cross_bonus_high')
    - when: exactly one of those two conditions
      value: K('cross_bonus_low')
    - when: otherwise
      value: '0'
    baseline:
      cross_bonus: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: autoship
  - id: membership_tenure
    effect: parameter
    decides: tenure_bonus
    bindings:
    - tenure_months
    - tenure_bonus
    ladder:
    - when: enrolled at least tenure_long_months months
      value: K('tenure_bonus_high')
    - when: at least tenure_mid_months but fewer than tenure_long_months months
      value: K('tenure_bonus_low')
    - when: otherwise
      value: '0'
    baseline:
      tenure_bonus: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: When the qualifying spend of a free-tier membership has earned the next free tier above the one it holds, a care
      agent applies that earned tier effective the day it is applied and posts the earned-tier upgrade bonus with it. The
      standard earned-tier upgrade bonus is the tier_upgrade_bonus_points of the tier being applied, which is insider_upgrade_bonus
      for Pals Rewards Insider and vip_upgrade_bonus for Pals Rewards VIP. Enrollment bonuses post with the enrollment that
      earns them, and the earned-tier upgrade bonus posted with an applied earned tier is the sum of the bonus produced by
      its method and every bonus added to it, as a whole number of points.
    params:
    - insider_upgrade_bonus
    - vip_upgrade_bonus
    - tier_upgrade_bonus_points
  inputs:
    history:
    - table: member_events
      aggregate: count
      field: member_event_id
      within_months: 24
      filters:
        event_type: member_bonus_points
        bonus_kind: tier_upgrade
    - table: member_events
      aggregate: sum
      field: qualifying_spend_usd
      within_months: 12
      filters:
        event_type: member_points_earn
    - table: member_events
      aggregate: sum
      field: qualifying_spend_usd
      within_months: 12
      filters:
        event_type: member_points_reverse
    - table: member_events
      aggregate: latest
      field: event_date
      within_months: null
      filters:
        event_type: member_points_earn
    - category: autoship
      table: autoship_events
      aggregate: count
      field: autoship_event_id
      within_months: 3
      filters:
        event_type: autoship_shipment_charge
    - table: member_events
      aggregate: sum
      field: points
      within_months: 24
      filters:
        event_type: member_bonus_points
        bonus_kind: tier_upgrade
    cross_category:
    - autoship
    - groom
- id: member_ext_plus_annual_first_fee
  base_policy_refs:
  - member_enrollment_and_trials
  - member_tier_qualification
  - member_plus_cancellation
  - member_shipping_benefit
  - member_plus_billing
  overwrite:
  - base_policy: member_plus_billing
    superseded_clause: A paid tier charges membership_fee_usd on each next_billing_date while auto_renew is true;
    replaced_by: 'The order of these steps is fixed: the returning-member credit comes off the standard fee first, the Plus
      Annual loyalty rate then applies once to that reduced fee, and the Autoship, shipping-fee, spend and salon credits are
      then subtracted from the result as flat amounts, with no step acting on the original fee again.'
  trigger: on_request
  subject:
  - member_tier_change
  - member_fee_charge
  computes: first_charge_usd
  target_tool: buy_plus_tier_1a1727fb
  params:
    annual_fee_usd: 59.0
    trial_lookback_days: 365
    return_recent_days: 182
    return_lapsed_days: 365
    loyalty_long_months: 36
    loyalty_rate_vip_long: 0.2
    loyalty_rate_vip_short: 0.12
    loyalty_rate_insider_long: 0.08
    bundle_high_count: 6
    bundle_low_count: 3
    bundle_credit_high: 4.0
    bundle_credit_low: 2.0
    ship_fee_high_count: 3
    ship_credit_high: 3.0
    ship_credit_low: 1.5
    plus_spend_high_usd: 1500.0
    plus_spend_low_usd: 800.0
    spend_credit_high: 5.0
    spend_credit_low: 2.5
    salon_recent_days: 60
    salon_credit_high: 3.0
    salon_credit_low: 1.5
  rule: 'When a customer on a free tier buys Tailwise Plus Annual, the first-term Plus Annual fee is charged to the card on
    file on the purchase date and the paid term starts that day. The standard first-term Plus Annual fee is annual_fee_usd,
    the membership_fee_usd of Tailwise Plus Annual. A customer with no membership fee charged in the trial_lookback_days calendar
    days before the purchase is in a free trial and is charged nothing on the purchase date. A returning-member credit is
    first taken off the standard first-term Plus Annual fee, by one of three methods set by the calendar days from the latest
    membership fee charged on the ledger to the purchase date: at most return_recent_days days, the credit is the sum of every
    membership fee charged in the last six months; more than return_recent_days but at most return_lapsed_days days, the credit
    is that latest membership fee alone; more than return_lapsed_days days, or no membership fee ever charged, there is no
    returning-member credit. A Plus Annual loyalty rate then reduces the fee left after the returning-member credit: a membership
    holding Pals Rewards VIP and enrolled for at least loyalty_long_months months, loyalty_rate_vip_long; a membership holding
    Pals Rewards VIP and enrolled for fewer than loyalty_long_months months, loyalty_rate_vip_short; a membership holding
    Pals Rewards Insider and enrolled for at least loyalty_long_months months, loyalty_rate_insider_long; any other membership,
    no Plus Annual loyalty rate. An Autoship credit is then subtracted: a customer whose Autoship subscriptions carry at least
    bundle_high_count charged shipments dated in the last six months, bundle_credit_high; at least bundle_low_count but fewer
    than bundle_high_count such shipments, bundle_credit_low; fewer than bundle_low_count, no Autoship credit. A shipping-fee
    credit is then subtracted: a customer charged a ship-to-home shipping fee on at least ship_fee_high_count orders dated
    in the last 12 months, ship_credit_high; on at least one but fewer than ship_fee_high_count such orders, ship_credit_low;
    on none, no shipping-fee credit. A spend credit is then subtracted according to the membership''s net qualifying spend
    over the last 12 months, meaning its points-earning qualifying spend less its points-reversal qualifying spend: at least
    plus_spend_high_usd, spend_credit_high; at least plus_spend_low_usd but below plus_spend_high_usd, spend_credit_low; below
    plus_spend_low_usd, no spend credit. A salon credit is then subtracted: a customer holding an active grooming pass whose
    latest completed visit was at most salon_recent_days calendar days before the purchase date, salon_credit_high; a customer
    holding an active grooming pass without such a visit, salon_credit_low; a customer holding no active grooming pass, no
    salon credit. The order of these steps is fixed: the returning-member credit comes off the standard fee first, the Plus
    Annual loyalty rate then applies once to that reduced fee, and the Autoship, shipping-fee, spend and salon credits are
    then subtracted from the result as flat amounts, with no step acting on the original fee again. The first-term Plus Annual
    fee is never below zero and is rounded to the nearest cent as the last step. The first-term Plus Annual fee is fixed only
    after the membership carries the free tier that its qualifying spend has earned.'
  prerequisite:
  - problem: member_ext_earned_tier_bonus
    kind: value_input
    gate: loyalty_rate
    form: state
    policy_source: The first-term Plus Annual fee is fixed only after the membership carries the free tier that its qualifying
      spend has earned.
    condition: member_memberships.variant_name equals the highest free tier whose qualifying spend threshold the membership's
      qualifying spend has reached
    resolved_by: apply_earned_tier_ebf561a6
    effect: 'the applied tier is read by the Plus Annual loyalty rate (loyalty_rate): Pals Rewards VIP with long enrollment
      takes loyalty_rate_vip_long instead of the Insider rate'
  cross_category:
  - category: autoship
    as: history
    reads:
    - autoship_events.event_type
    - autoship_events.event_date
    note: the six-month count of charged Autoship shipments decides the Autoship credit tier
  - category: order
    as: history
    reads:
    - order_events.event_type
    - order_events.fee_kind
    - order_events.event_date
    note: the 12-month count of ship-to-home shipping fees decides the shipping-fee credit tier
  - category: groom
    as: branch
    reads:
    - status
    - groom_events.event_date
    note: an active grooming pass and the date of its latest completed visit decide the salon credit tier
  compute:
  - standard_fee: K('annual_fee_usd')
  - last_fee_date: LATEST('member_events', 'event_date', event_type='member_fee_charge') or '1900-01-01'
  - days_since_fee: DAYS(last_fee_date, NOW)
  - fees_6m: SUM('member_events', 'amount_usd', within_months=6, event_type='member_fee_charge')
  - latest_fee: LATEST('member_events', 'amount_usd', event_type='member_fee_charge') or 0
  - return_credit: fees_6m if days_since_fee <= K('return_recent_days') else (latest_fee if days_since_fee <= K('return_lapsed_days')
      else 0)
  - tenure_months: MONTHS(F('enrolled_on'), NOW)
  - loyalty_rate: K('loyalty_rate_vip_long') if F('variant_name') == 'Pals Rewards VIP' and tenure_months >= K('loyalty_long_months')
      else (K('loyalty_rate_vip_short') if F('variant_name') == 'Pals Rewards VIP' and tenure_months < K('loyalty_long_months')
      else (K('loyalty_rate_insider_long') if F('variant_name') == 'Pals Rewards Insider' and tenure_months >= K('loyalty_long_months')
      else 0))
  - ships_6m: XCOUNT('autoship', 'autoship_events', within_months=6, event_type='autoship_shipment_charge')
  - bundle_credit: K('bundle_credit_high') if ships_6m >= K('bundle_high_count') else (K('bundle_credit_low') if ships_6m
      >= K('bundle_low_count') else 0)
  - ship_fees_12m: XCOUNT('order', 'order_events', within_months=12, event_type='order_fee_charge', fee_kind='shipping')
  - ship_credit: K('ship_credit_high') if ship_fees_12m >= K('ship_fee_high_count') else (K('ship_credit_low') if ship_fees_12m
      >= 1 else 0)
  - net_spend_12m: RND(SUM('member_events', 'qualifying_spend_usd', within_months=12, event_type='member_points_earn') - SUM('member_events',
      'qualifying_spend_usd', within_months=12, event_type='member_points_reverse'), 2)
  - spend_credit: K('spend_credit_high') if net_spend_12m >= K('plus_spend_high_usd') else (K('spend_credit_low') if net_spend_12m
      >= K('plus_spend_low_usd') else 0)
  - salon_pass_active: EXISTS('groom', status='active')
  - last_visit_date: XLATEST('groom', 'groom_events', 'event_date', event_type='groom_visit_complete') or '1900-01-01'
  - salon_credit: K('salon_credit_high') if salon_pass_active and DAYS(last_visit_date, NOW) <= K('salon_recent_days') else
      (K('salon_credit_low') if salon_pass_active else 0)
  - after_credit: MX(0, standard_fee - return_credit)
  - after_loyalty: after_credit * (1 - loyalty_rate)
  - after_flat: MX(0, after_loyalty - bundle_credit - ship_credit - spend_credit - salon_credit)
  - in_trial: days_since_fee > K('trial_lookback_days')
  - result: 0.0 if in_trial else RND(after_flat, 2)
  compute_basis:
    standard_fee: The standard first-term Plus Annual fee is annual_fee_usd, the membership_fee_usd of Tailwise Plus Annual.
    last_fee_date: 'A returning-member credit is first taken off the standard first-term Plus Annual fee, by one of three
      methods set by the calendar days from the latest membership fee charged on the ledger to the purchase date: at most
      return_recent_days days, the credit is the sum of every membership fee charged in the last six months; more than return_recent_days
      but at most return_lapsed_days days, the credit is that latest membership fee alone; more than return_lapsed_days days,
      or no membership fee ever charged, there is no returning-member credit.'
    days_since_fee: 'A returning-member credit is first taken off the standard first-term Plus Annual fee, by one of three
      methods set by the calendar days from the latest membership fee charged on the ledger to the purchase date: at most
      return_recent_days days, the credit is the sum of every membership fee charged in the last six months; more than return_recent_days
      but at most return_lapsed_days days, the credit is that latest membership fee alone; more than return_lapsed_days days,
      or no membership fee ever charged, there is no returning-member credit.'
    fees_6m: 'A returning-member credit is first taken off the standard first-term Plus Annual fee, by one of three methods
      set by the calendar days from the latest membership fee charged on the ledger to the purchase date: at most return_recent_days
      days, the credit is the sum of every membership fee charged in the last six months; more than return_recent_days but
      at most return_lapsed_days days, the credit is that latest membership fee alone; more than return_lapsed_days days,
      or no membership fee ever charged, there is no returning-member credit.'
    latest_fee: 'A returning-member credit is first taken off the standard first-term Plus Annual fee, by one of three methods
      set by the calendar days from the latest membership fee charged on the ledger to the purchase date: at most return_recent_days
      days, the credit is the sum of every membership fee charged in the last six months; more than return_recent_days but
      at most return_lapsed_days days, the credit is that latest membership fee alone; more than return_lapsed_days days,
      or no membership fee ever charged, there is no returning-member credit.'
    return_credit: 'A returning-member credit is first taken off the standard first-term Plus Annual fee, by one of three
