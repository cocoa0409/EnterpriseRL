- id: member_ext_earned_tier_bonus
  base_policy_refs:
  - member_enrollment_and_trials
  - member_tier_qualification
  - member_plus_cancellation
  - member_shipping_benefit
  - member_evt_bonus_points
  overwrite:
  - base_policy: member_evt_bonus_points
    superseded_clause: Enrollment bonuses and tier-upgrade bonuses post with the enrollment or the spend upgrade that earns
      them.
    replaced_by: Enrollment bonuses post with the enrollment that earns them, and the earned-tier upgrade bonus posted with
      an applied earned tier is the sum of the bonus produced by its method and every bonus added to it, as a whole number
      of points.
  - base_policy: member_tier_qualification
    superseded_clause: A membership moves up to Pals Rewards Insider or Pals Rewards VIP within tier_upgrade_effective_days
    replaced_by: When the qualifying spend of a free-tier membership has earned the next free tier above the one it holds,
      a care agent applies that earned tier effective the day it is applied and posts the earned-tier upgrade bonus with it.
  trigger: state_due
  subject:
  - member_tier_change
  computes: upgrade_bonus_points
  target_tool: apply_earned_tier_ebf561a6
  params:
    insider_upgrade_bonus: 200
    vip_upgrade_bonus: 500
    insider_threshold_usd: 250.0
    vip_threshold_usd: 750.0
    spend_high_ratio: 1.4
    spend_low_ratio: 1.05
    spend_bonus_high: 250
    spend_bonus_low: 100
    speed_fast_days: 180
    speed_mid_days: 270
    speed_bonus_high: 200
    speed_bonus_low: 100
    cross_ship_count: 3
    cross_bonus_high: 150
    cross_bonus_low: 60
    tenure_long_months: 60
    tenure_mid_months: 24
    tenure_bonus_high: 100
    tenure_bonus_low: 50
  rule: 'When the qualifying spend of a free-tier membership has earned the next free tier above the one it holds, a care
    agent applies that earned tier effective the day it is applied and posts the earned-tier upgrade bonus with it. The standard
    earned-tier upgrade bonus is the tier_upgrade_bonus_points of the tier being applied, which is insider_upgrade_bonus for
    Pals Rewards Insider and vip_upgrade_bonus for Pals Rewards VIP. The earned-tier upgrade bonus is produced by one of three
    methods: a membership whose rewards ledger carries, dated in the last 24 months, a tier-upgrade bonus entry equal to the
    standard earned-tier upgrade bonus of the tier being applied is re-earning that tier and receives that standard bonus
    less every tier-upgrade bonus point posted to it in the last 24 months, never below zero; a membership whose ledger carries
    no tier-upgrade bonus entry at all is earning its first upgrade and receives that standard bonus plus one point for every
    whole dollar by which its net qualifying spend over the last 12 months exceeds the qualifying spend threshold of the tier
    being applied; any other membership receives that standard bonus unchanged. An over-achievement bonus is added according
    to the membership''s net qualifying spend over the last 12 months, meaning the qualifying spend of its points-earning
    entries less that of its points-reversal entries: at least spend_high_ratio times the qualifying spend threshold of the
    tier being applied, spend_bonus_high points; at least spend_low_ratio times but below spend_high_ratio times that threshold,
    spend_bonus_low points; below spend_low_ratio times, no over-achievement bonus; the thresholds are insider_threshold_usd
    for Pals Rewards Insider and vip_threshold_usd for Pals Rewards VIP. A fast-track bonus is added according to the calendar
    days from the date the currently held tier took effect to the date of the latest points-earning entry on the ledger: at
    most speed_fast_days days, speed_bonus_high points; more than speed_fast_days but at most speed_mid_days days, speed_bonus_low
    points; more than speed_mid_days days, no fast-track bonus. A cross-program bonus is added: a customer whose Autoship
    subscriptions carry at least cross_ship_count charged shipments dated in the last three months and who also holds an active
    grooming pass receives cross_bonus_high points; a customer who meets exactly one of those two conditions receives cross_bonus_low
    points; a customer who meets neither receives no cross-program bonus. A tenure bonus is added: a membership enrolled for
    at least tenure_long_months months receives tenure_bonus_high points; enrolled for at least tenure_mid_months but fewer
    than tenure_long_months months, tenure_bonus_low points; enrolled for fewer than tenure_mid_months months, no tenure bonus.
    Enrollment bonuses post with the enrollment that earns them, and the earned-tier upgrade bonus posted with an applied
    earned tier is the sum of the bonus produced by its method and every bonus added to it, as a whole number of points. The
    earned-tier upgrade bonus is not posted until the rewards ledger carries a points earning for the most recent charged
    Autoship shipment.'
  prerequisite:
  - problem: member_ext_missed_autoship_earning
    kind: value_input
    gate: net_spend_12m
    form: state
    policy_source: The earned-tier upgrade bonus is not posted until the rewards ledger carries a points earning for the most
      recent charged Autoship shipment.
    condition: the most recent autoship_shipment_charge of the customer has a member_points_earn row on the membership's ledger
      whose source_event_id is that shipment charge
    resolved_by: post_missing_points_02f0bcb5
    effect: the posted earning adds the shipment's qualifying spend to the 12-month net qualifying spend (net_spend_12m) and
      moves the latest earning date, so the over-achievement and fast-track tiers are read from the complete ledger; the earned
      tier itself is already due on the spend recorded before the posting
  cross_category:
  - category: autoship
    as: history
    reads:
    - autoship_events.event_type
    - autoship_events.event_date
    note: the three-month count of charged Autoship shipments is one half of the cross-program tier
  - category: groom
    as: existence
    reads:
    - status
    note: an active grooming pass is the other half of the cross-program tier
  compute:
  - standard_bonus: K('vip_upgrade_bonus') if F('variant_name') == 'Pals Rewards Insider' else K('insider_upgrade_bonus')
  - tier_threshold: K('vip_threshold_usd') if F('variant_name') == 'Pals Rewards Insider' else K('insider_threshold_usd')
  - net_spend_12m: RND(SUM('member_events', 'qualifying_spend_usd', within_months=12, event_type='member_points_earn') - SUM('member_events',
      'qualifying_spend_usd', within_months=12, event_type='member_points_reverse'), 2)
  - same_tier_recent: COUNT('member_events', within_months=24, event_type='member_bonus_points', bonus_kind='tier_upgrade',
      points=standard_bonus)
  - any_upgrade_entry: COUNT('member_events', event_type='member_bonus_points', bonus_kind='tier_upgrade')
  - upgrade_points_24m: SUM('member_events', 'points', within_months=24, event_type='member_bonus_points', bonus_kind='tier_upgrade')
  - method_bonus: MX(0, standard_bonus - upgrade_points_24m) if same_tier_recent >= 1 else (standard_bonus + int(MX(0, net_spend_12m
      - tier_threshold)) if any_upgrade_entry == 0 else standard_bonus)
  - spend_bonus: K('spend_bonus_high') if net_spend_12m >= K('spend_high_ratio') * tier_threshold else (K('spend_bonus_low')
      if net_spend_12m >= K('spend_low_ratio') * tier_threshold else 0)
  - latest_earn_date: LATEST('member_events', 'event_date', event_type='member_points_earn')
  - speed_days: DAYS(F('tier_effective_on'), latest_earn_date)
  - speed_bonus: K('speed_bonus_high') if speed_days <= K('speed_fast_days') else (K('speed_bonus_low') if speed_days <= K('speed_mid_days')
      else 0)
  - ships_3m: XCOUNT('autoship', 'autoship_events', within_months=3, event_type='autoship_shipment_charge')
  - salon_active: EXISTS('groom', status='active')
  - cross_bonus: K('cross_bonus_high') if ships_3m >= K('cross_ship_count') and salon_active else (K('cross_bonus_low') if
      ships_3m >= K('cross_ship_count') or salon_active else 0)
  - tenure_months: MONTHS(F('enrolled_on'), NOW)
  - tenure_bonus: K('tenure_bonus_high') if tenure_months >= K('tenure_long_months') else (K('tenure_bonus_low') if tenure_months
      >= K('tenure_mid_months') else 0)
  - result: method_bonus + spend_bonus + speed_bonus + cross_bonus + tenure_bonus
  compute_basis:
