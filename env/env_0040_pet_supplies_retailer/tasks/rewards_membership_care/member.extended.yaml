    net_spend_12m: 'A spend credit is then subtracted according to the membership''s net qualifying spend over the last 12
      months, meaning its points-earning qualifying spend less its points-reversal qualifying spend: at least plus_spend_high_usd,
      spend_credit_high; at least plus_spend_low_usd but below plus_spend_high_usd, spend_credit_low; below plus_spend_low_usd,
      no spend credit.'
    spend_credit: 'A spend credit is then subtracted according to the membership''s net qualifying spend over the last 12
      months, meaning its points-earning qualifying spend less its points-reversal qualifying spend: at least plus_spend_high_usd,
      spend_credit_high; at least plus_spend_low_usd but below plus_spend_high_usd, spend_credit_low; below plus_spend_low_usd,
      no spend credit.'
    salon_pass_active: 'A salon credit is then subtracted: a customer holding an active grooming pass whose latest completed
      visit was at most salon_recent_days calendar days before the purchase date, salon_credit_high; a customer holding an
      active grooming pass without such a visit, salon_credit_low; a customer holding no active grooming pass, no salon credit.'
    last_visit_date: 'A salon credit is then subtracted: a customer holding an active grooming pass whose latest completed
      visit was at most salon_recent_days calendar days before the purchase date, salon_credit_high; a customer holding an
      active grooming pass without such a visit, salon_credit_low; a customer holding no active grooming pass, no salon credit.'
    salon_credit: 'A salon credit is then subtracted: a customer holding an active grooming pass whose latest completed visit
      was at most salon_recent_days calendar days before the purchase date, salon_credit_high; a customer holding an active
      grooming pass without such a visit, salon_credit_low; a customer holding no active grooming pass, no salon credit.'
    after_credit: 'The order of these steps is fixed: the returning-member credit comes off the standard fee first, the Plus
      Annual loyalty rate then applies once to that reduced fee, and the Autoship, shipping-fee, spend and salon credits are
      then subtracted from the result as flat amounts, with no step acting on the original fee again.'
    after_loyalty: 'The order of these steps is fixed: the returning-member credit comes off the standard fee first, the Plus
      Annual loyalty rate then applies once to that reduced fee, and the Autoship, shipping-fee, spend and salon credits are
      then subtracted from the result as flat amounts, with no step acting on the original fee again.'
    after_flat: The first-term Plus Annual fee is never below zero and is rounded to the nearest cent as the last step.
    in_trial: A customer with no membership fee charged in the trial_lookback_days calendar days before the purchase is in
      a free trial and is charged nothing on the purchase date.
    result: The first-term Plus Annual fee is never below zero and is rounded to the nearest cent as the last step.
  factors:
  - id: returning_member_credit
    effect: method
    decides: return_credit
    bindings:
    - last_fee_date
    - days_since_fee
    - fees_6m
    - latest_fee
    - return_credit
    ladder:
    - when: the latest membership fee was charged at most return_recent_days days before the purchase
      method: credit the sum of every membership fee charged in the last six months
    - when: more than return_recent_days but at most return_lapsed_days days before
      method: credit the latest membership fee alone
    - when: otherwise
      method: no credit
    baseline:
      return_credit: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: plus_loyalty_rate
    effect: parameter
    decides: loyalty_rate
    bindings:
    - tenure_months
    - loyalty_rate
    ladder:
    - when: holds Pals Rewards VIP and enrolled at least loyalty_long_months months
      value: K('loyalty_rate_vip_long')
    - when: holds Pals Rewards VIP and enrolled fewer than loyalty_long_months months
      value: K('loyalty_rate_vip_short')
    - when: holds Pals Rewards Insider and enrolled at least loyalty_long_months months
      value: K('loyalty_rate_insider_long')
    - when: otherwise
      value: '0'
    baseline:
      loyalty_rate: '0'
    evidence:
    - tier_param
    - date
    cross_difficulty: null
  - id: autoship_credit
    effect: parameter
    decides: bundle_credit
    bindings:
    - ships_6m
    - bundle_credit
    ladder:
    - when: at least bundle_high_count charged Autoship shipments in the last six months
      value: K('bundle_credit_high')
    - when: at least bundle_low_count but fewer than bundle_high_count
      value: K('bundle_credit_low')
    - when: otherwise
      value: '0'
    baseline:
      bundle_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: autoship
  - id: shipping_fee_credit
    effect: parameter
    decides: ship_credit
