- id: member_ext_return_certificate_reissue
  base_policy_refs:
  - member_evt_certificates
  overwrite:
  - base_policy: member_evt_certificates
    superseded_clause: A certificate used on an order that is later returned is reissued with a fresh validity where certificate_reissue_on_return
      is true.
    replaced_by: The reissue validity granted is the days produced by its method plus every extension added to it, as a whole
      number of days.
  trigger: state_due
  subject:
  - member_certificate_reissue
  computes: validity_days
  target_tool: reissue_returned_certificate_0ad7eee8
  params:
    fault_wait_days: 7
    fault_ext_high: 10
    fault_ext_low: 5
    ztenure_long_months: 60
    ztenure_mid_months: 24
    ztenure_ext_high: 6
    ztenure_ext_low: 3
    redeem_high_count: 4
    redeem_low_count: 2
    redeem_ext_high: 6
    redeem_ext_low: 3
    zship_count: 3
    zship_ext_high: 4
    zship_ext_low: 2
  rule: 'When an order on which a reward certificate was used is refunded on return, a care agent reissues that certificate
    at its certificate_value_usd. The standard reissue validity is the certificate_validity_days of the tier held, counted
    in calendar days with the reissue date as day 1. The reissue validity is produced by one of three methods, set by the
    last usable day of the certificate being reissued: on or after the reissue date, the standard reissue validity plus the
    days that certificate still has left, the reissue date counted; before the reissue date but on or after the refund date
    of the return, the standard reissue validity plus the calendar days from that last usable day to the reissue date; before
    the refund date, the standard reissue validity alone. A fault extension is added: a return whose reason is damaged, defective,
    wrong_item or not_as_described and whose refund is dated more than fault_wait_days calendar days before the reissue date,
    fault_ext_high days; a return with one of those reasons refunded at most fault_wait_days days before the reissue date,
    fault_ext_low days; a return with any other reason, no fault extension. A tenure extension is added: a membership on a
    paid tier and enrolled for at least ztenure_long_months months, ztenure_ext_high days; a membership that does not meet
    both of those conditions but is enrolled for at least ztenure_mid_months months, ztenure_ext_low days; any other membership,
    no tenure extension. A redeemer extension is added according to the certificates issued on the ledger in the last 12 months:
    at least redeem_high_count, redeem_ext_high days; at least redeem_low_count but fewer than redeem_high_count, redeem_ext_low
    days; fewer than redeem_low_count, no redeemer extension. An Autoship extension is added: a customer whose Autoship subscriptions
    carry at least zship_count charged shipments dated in the last three months, zship_ext_high days; at least one but fewer
    than zship_count, zship_ext_low days; none, no Autoship extension. The reissue validity granted is the days produced by
    its method plus every extension added to it, as a whole number of days. A certificate used on a returned order is not
    reissued until the membership has left the past-due status.'
  prerequisite:
  - problem: member_ext_overdue_annual_fee
    kind: state_gate
    gate: member_memberships.status
    form: state
    policy_source: A certificate used on a returned order is not reissued until the membership has left the past-due status.
    condition: member_memberships.status is active or pending_downgrade (not past_due)
    resolved_by: reinstate_plus_tier_c2894e52
    effect: the membership status gate of the certificate rules (certificate_status) becomes satisfied
  cross_category:
  - category: order
    as: history
    reads:
    - order_events.return_reason
    - order_events.event_date
    note: the return reason and refund date decide the fault extension tier and the reissue method
  - category: autoship
