      spend_high_ratio times the qualifying spend threshold of the tier being applied, spend_bonus_high points; at least spend_low_ratio
      times but below spend_high_ratio times that threshold, spend_bonus_low points; below spend_low_ratio times, no over-achievement
      bonus; the thresholds are insider_threshold_usd for Pals Rewards Insider and vip_threshold_usd for Pals Rewards VIP.'
    spend_bonus: 'An over-achievement bonus is added according to the membership''s net qualifying spend over the last 12
