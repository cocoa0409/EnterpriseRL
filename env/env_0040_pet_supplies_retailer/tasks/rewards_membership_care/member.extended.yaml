- id: member_ext_refund_points_reversal
  base_policy_refs:
  - member_evt_points_reverse
  overwrite:
  - base_policy: member_evt_points_reverse
    superseded_clause: When a purchase that earned points is refunded in whole or in part and points_reversal_on_refund is
      true, the points it earned are taken back in proportion to the refunded share of its qualifying spend, rounded down,
      never more than the purchase earned.
    replaced_by: 'The order of the reversal is fixed: the method gives the points to reverse, the visit-usage share then scales
      them, the reversal tenure, spend, age and Autoship allowances are then subtracted, the result is never below zero, and
      the two caps on what the pass purchase earned and on the balance apply last.'
  trigger: state_due
  subject:
  - member_points_reverse
  computes: points
  target_tool: reverse_refund_points_2db3868c
  params:
    standard_points_per_usd: 8
    rtenure_long_months: 60
    rtenure_mid_months: 24
    rtenure_keep_high: 40
    rtenure_keep_low: 20
    rspend_high_usd: 1500.0
    rspend_low_usd: 800.0
    rspend_keep_high: 30
    rspend_keep_low: 15
    rage_long_days: 30
    rage_short_days: 14
    rage_keep_high: 20
    rage_keep_low: 10
    rship_high_count: 6
    rship_low_count: 3
    rship_keep_high: 25
    rship_keep_low: 10
    usage_high_visits: 2
    usage_share_high: 0.5
    usage_share_low: 0.75
  rule: 'When a grooming pass that earned points is cancelled and its unused visits are refunded, a care agent books the points
    reversal of the pass purchase, dated on the refund date and tied to the pass. The standard reversal is the points the
    pass purchase earned times the amount refunded divided by the pass purchase''s qualifying spend, rounded down to a whole
    point. The points to reverse are first worked out by one of three methods: a refund dated on or after the latest declined-fee
    entry, with no membership fee charged from that entry''s date through the refund date, is reversed at standard_points_per_usd
    points per refunded dollar, rounded down; a refund that does not meet that condition, of a pass whose earning is dated
    before the date the currently held tier took effect, is reversed at the base_points_per_usd of the tier now held per refunded
    dollar, rounded down; any other refund is reversed as the standard reversal. A visit-usage share then scales the points
    to reverse, according to the visits used on the pass before it was cancelled, meaning the visits purchased less the unused
    visits the refund removed: at least usage_high_visits visits used, usage_share_high of them; at least one but fewer than
    usage_high_visits visits used, usage_share_low of them; no visit used, all of them; the scaled figure is rounded down
    to a whole point. A reversal tenure allowance is then kept back from the reversal: a membership on a paid tier and enrolled
    for at least rtenure_long_months months keeps rtenure_keep_high points; a membership that does not meet both of those
    conditions but holds a paid tier or Pals Rewards VIP and is enrolled for at least rtenure_mid_months months keeps rtenure_keep_low
    points; any other membership keeps none. A reversal spend allowance is then kept back according to the membership''s net
    qualifying spend over the last 12 months, its points-earning qualifying spend less its points-reversal qualifying spend:
    at least rspend_high_usd keeps rspend_keep_high points; at least rspend_low_usd but below rspend_high_usd keeps rspend_keep_low
    points; below rspend_low_usd keeps none. A reversal age allowance is then kept back according to the calendar days from
    the pass purchase''s earning to the refund: more than rage_long_days days keeps rage_keep_high points; more than rage_short_days
    but at most rage_long_days days keeps rage_keep_low points; rage_short_days days or fewer keeps none. A reversal Autoship
    allowance is then kept back: a customer whose Autoship subscriptions carry at least rship_high_count charged shipments
    dated in the last six months keeps rship_keep_high points; at least rship_low_count but fewer than rship_high_count keeps
    rship_keep_low points; fewer than rship_low_count keeps none. The order of the reversal is fixed: the method gives the
    points to reverse, the visit-usage share then scales them, the reversal tenure, spend, age and Autoship allowances are
    then subtracted, the result is never below zero, and the two caps on what the pass purchase earned and on the balance
    apply last. The reversal is never more than the points the pass purchase earned, and a reversal larger than the current
    points balance takes the balance only to zero.'
  prerequisite: []
  cross_category:
  - category: groom
    as: history
    reads:
    - groom_pass_id
    - status
    - visits_purchased
    - groom_events.amount_usd
    - groom_events.event_date
    - groom_events.visits_delta
    note: the cancelled pass, its refund amount, refund date and unused visits removed feed the standard reversal, the reversal
      method, the visit-usage share and the age allowance
  - category: autoship
    as: history
    reads:
    - autoship_events.event_type
    - autoship_events.event_date
    note: the six-month count of charged Autoship shipments decides the reversal Autoship allowance tier
  compute:
  - pass_id: CFIELD('groom', 'groom_pass_id', status='cancelled')
  - pass_points: LATEST('member_events', 'points', event_type='member_points_earn', source_category='groom', source_event_id=pass_id)
  - pass_spend: LATEST('member_events', 'qualifying_spend_usd', event_type='member_points_earn', source_category='groom',
      source_event_id=pass_id)
  - pass_earn_date: LATEST('member_events', 'event_date', event_type='member_points_earn', source_category='groom', source_event_id=pass_id)
  - refunded_spend: XLATEST('groom', 'groom_events', 'amount_usd', event_type='groom_pass_refund', groom_pass_id=pass_id)
  - refund_date: XLATEST('groom', 'groom_events', 'event_date', event_type='groom_pass_refund', groom_pass_id=pass_id)
  - standard_reversal: int(RND(pass_points * refunded_spend / pass_spend, 6))
  - declined_on: LATEST('member_events', 'event_date', event_type='member_fee_declined') or '9999-12-31'
  - last_fee_on: LATEST('member_events', 'event_date', event_type='member_fee_charge') or '1900-01-01'
  - basis_points: int(RND(refunded_spend * K('standard_points_per_usd'), 6)) if declined_on <= refund_date and not (declined_on
      <= last_fee_on <= refund_date) else (int(RND(refunded_spend * P('base_points_per_usd'), 6)) if pass_earn_date < F('tier_effective_on')
      else standard_reversal)
  - visits_bought: CFIELD('groom', 'visits_purchased', status='cancelled')
  - visits_removed: XLATEST('groom', 'groom_events', 'visits_delta', event_type='groom_pass_refund', groom_pass_id=pass_id)
  - usage_share: K('usage_share_high') if visits_bought - visits_removed >= K('usage_high_visits') else (K('usage_share_low')
      if visits_bought - visits_removed >= 1 else 1)
  - is_paid: F('variant_name') == 'Tailwise Plus Monthly' or F('variant_name') == 'Tailwise Plus Annual' or F('variant_name')
      == 'Tailwise Plus Premier Annual'
  - rtenure_months: MONTHS(F('enrolled_on'), NOW)
  - tenure_keep: K('rtenure_keep_high') if is_paid and rtenure_months >= K('rtenure_long_months') else (K('rtenure_keep_low')
      if (is_paid or F('variant_name') == 'Pals Rewards VIP') and rtenure_months >= K('rtenure_mid_months') else 0)
  - net_spend_12m: RND(SUM('member_events', 'qualifying_spend_usd', within_months=12, event_type='member_points_earn') - SUM('member_events',
      'qualifying_spend_usd', within_months=12, event_type='member_points_reverse'), 2)
  - spend_keep: K('rspend_keep_high') if net_spend_12m >= K('rspend_high_usd') else (K('rspend_keep_low') if net_spend_12m
      >= K('rspend_low_usd') else 0)
  - age_days: DAYS(pass_earn_date, refund_date)
  - age_keep: K('rage_keep_high') if age_days > K('rage_long_days') else (K('rage_keep_low') if age_days > K('rage_short_days')
      else 0)
  - rships_6m: XCOUNT('autoship', 'autoship_events', within_months=6, event_type='autoship_shipment_charge')
  - autoship_keep: K('rship_keep_high') if rships_6m >= K('rship_high_count') else (K('rship_keep_low') if rships_6m >= K('rship_low_count')
      else 0)
  - after_keep: MX(0, int(RND(basis_points * usage_share, 6)) - tenure_keep - spend_keep - age_keep - autoship_keep)
  - result: MN(after_keep, pass_points, F('points_balance'))
