  rule: Only the customer can cancel a paid tier. The fee of the current term is refunded only if the cancellation
    is requested no later than cancel_full_refund_days after that fee was charged. The window is counted in calendar
    days from the event_date of the member_fee_charge row of the current term, that date being day 0; a request
    on the last day is in time. An in-window cancellation ends the paid tier the same day, refunds that fee to the
    original payment and moves the membership to the free tier earned by spend; perk credit already used in the
    term is deducted from the refund. Outside the window the cancellation takes effect per cancel_effective (end
    of the billing month for monthly, end of the term for annual), auto-renewal is switched off, paid benefits continue
    until then, and nothing is refunded unless cancel_prorated_refund_after_window. A pending cancellation may be
    withdrawn by the customer until it takes effect. Cancelling a trial before trial_end_date ends the paid tier
    at once with no fee.
