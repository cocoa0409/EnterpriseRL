  subject: [member_points_expire]
  rule: Where points_inactivity_expiry_days is above 0, the whole balance expires when member_msr_days_since_last_earn
    exceeds it; redeeming, reversals and certificate issue do not count as activity, while any earning or bonus
    row does. Where it is 0 the balance does not expire while the tier is held; after a paid tier ends the free
    tier's inactivity rule applies, counted from the latest earning row. Expired points are never restored.
