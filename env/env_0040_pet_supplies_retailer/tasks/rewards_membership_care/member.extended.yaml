    tenure_months: 'A Plus Annual loyalty rate then reduces the fee left after the returning-member credit: a membership holding
      Pals Rewards VIP and enrolled for at least loyalty_long_months months, loyalty_rate_vip_long; a membership holding Pals
      Rewards VIP and enrolled for fewer than loyalty_long_months months, loyalty_rate_vip_short; a membership holding Pals
      Rewards Insider and enrolled for at least loyalty_long_months months, loyalty_rate_insider_long; any other membership,
      no Plus Annual loyalty rate.'
    loyalty_rate: 'A Plus Annual loyalty rate then reduces the fee left after the returning-member credit: a membership holding
      Pals Rewards VIP and enrolled for at least loyalty_long_months months, loyalty_rate_vip_long; a membership holding Pals
      Rewards VIP and enrolled for fewer than loyalty_long_months months, loyalty_rate_vip_short; a membership holding Pals
      Rewards Insider and enrolled for at least loyalty_long_months months, loyalty_rate_insider_long; any other membership,
      no Plus Annual loyalty rate.'
    ships_6m: 'An Autoship credit is then subtracted: a customer whose Autoship subscriptions carry at least bundle_high_count
      charged shipments dated in the last six months, bundle_credit_high; at least bundle_low_count but fewer than bundle_high_count
      such shipments, bundle_credit_low; fewer than bundle_low_count, no Autoship credit.'
    bundle_credit: 'An Autoship credit is then subtracted: a customer whose Autoship subscriptions carry at least bundle_high_count
      charged shipments dated in the last six months, bundle_credit_high; at least bundle_low_count but fewer than bundle_high_count
      such shipments, bundle_credit_low; fewer than bundle_low_count, no Autoship credit.'
    ship_fees_12m: 'A shipping-fee credit is then subtracted: a customer charged a ship-to-home shipping fee on at least ship_fee_high_count
