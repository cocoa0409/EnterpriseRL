extended_policies:
- id: member_ext_missed_autoship_earning
  base_policy_refs:
  - member_evt_points_earn
  overwrite:
  - base_policy: member_evt_points_earn
    superseded_clause: Points equal the qualifying spend times base_points_per_usd times the program's own multiplier (the
      Autoship, grooming, training or other program's points_multiplier, 1 where the program declares none), rounded down
      to a whole point per transaction and capped at max_points_per_transaction.
    replaced_by: The missed-earning points are that qualifying spend times the missed-earning rate times the points_multiplier
      of the Autoship program the shipment belongs to, rounded down to a whole point; the missed-earning rate is the member's
      base earn rate that the Autoship program's own earning rule multiplies by points_multiplier, stated in points per qualifying
      dollar.
  trigger: state_due
  subject:
  - member_points_earn
  computes: points
  target_tool: post_missing_points_02f0bcb5
  params:
    vip_threshold_usd: 750.0
    insider_threshold_usd: 250.0
    vip_rate_per_usd: 12
    insider_rate_per_usd: 10
    apology_long_months: 60
    apology_mid_months: 24
    apology_active_count: 3
    apology_rate_high: 1.0
    apology_rate_low: 0.5
    milestone_high_seq: 12
    milestone_low_seq: 6
    milestone_rate_high: 1.0
    milestone_rate_low: 0.5
    streak_high_count: 6
    streak_low_count: 3
    streak_rate_high: 1.0
    streak_rate_low: 0.4
    late_long_days: 21
    late_short_days: 7
    late_long_factor: 1.25
    late_short_rate: 0.5
  rule: 'When a customer''s most recent charged Autoship shipment has no points earning on the rewards ledger, a care agent
    posts the missed-earning points for that shipment, dated on the shipment''s processing date. The qualifying spend of that
    shipment is its merchandise subtotal less its Autoship discount, as the shipment charge records them. The missed-earning
    points are that qualifying spend times the missed-earning rate times the points_multiplier of the Autoship program the
    shipment belongs to, rounded down to a whole point; the missed-earning rate is the member''s base earn rate that the Autoship
    program''s own earning rule multiplies by points_multiplier, stated in points per qualifying dollar. The standard missed-earning
    rate is the base_points_per_usd of the tier the membership holds. A shipment that already carries a points earning on
    the ledger earns nothing further. The missed-earning rate starts from a tier rate: a membership holding Pals Rewards Member
    or Pals Rewards Insider whose net qualifying spend over the last 12 months, its points-earning qualifying spend less its
    points-reversal qualifying spend, has reached vip_threshold_usd takes vip_rate_per_usd, the base_points_per_usd of Pals
    Rewards VIP; a membership holding Pals Rewards Member whose such spend has reached insider_threshold_usd but not vip_threshold_usd
    takes insider_rate_per_usd, the base_points_per_usd of Pals Rewards Insider; any other membership takes the standard missed-earning
    rate. A missed-earning apology rate is added to the tier rate: a membership enrolled for at least apology_long_months
    months that also has at least apology_active_count points-earning entries dated in the last three months adds apology_rate_high
    points per dollar; a membership that does not meet both of those conditions but is enrolled for at least apology_mid_months
    months and has at least one points-earning entry dated in the last three months adds apology_rate_low points per dollar;
    any other membership adds no missed-earning apology rate. A subscription milestone rate is added according to the shipment''s
    position in its subscription (its shipment sequence number): at least milestone_high_seq, milestone_rate_high points per
    dollar; at least milestone_low_seq but below milestone_high_seq, milestone_rate_low points per dollar; below milestone_low_seq,
    no subscription milestone rate. An Autoship streak rate is added: a customer whose Autoship subscriptions carry at least
    streak_high_count charged shipments dated in the last six months adds streak_rate_high points per dollar; at least streak_low_count
    but fewer than streak_high_count such shipments, streak_rate_low points per dollar; fewer than streak_low_count, no Autoship
    streak rate. The late-posting adjustment then applies to the tier rate plus the apology, milestone and streak rates, according
    to the calendar days from the shipment''s processing date to the posting date: more than late_long_days days, that summed
    rate is multiplied by late_long_factor; more than late_short_days but at most late_long_days days, late_short_rate points
    per dollar are added to that summed rate; late_short_days days or fewer, that summed rate is used as it stands. The posted
    missed-earning points never exceed the max_points_per_transaction of the tier held, that cap being applied as the very
    last step.'
  prerequisite: []
  cross_category:
  - category: autoship
    as: history
    reads:
    - points_multiplier
    - autoship_events.autoship_id
    - autoship_events.merchandise_subtotal_usd
    - autoship_events.discount_usd
    - autoship_events.event_date
    - autoship_events.shipment_seq
    note: the shipment's spend, date, subscription and sequence number, that subscription's program multiplier, and the six-month
      count of charged shipments that decides the Autoship streak tier
  compute:
  - ship_spend: RND(XLATEST('autoship', 'autoship_events', 'merchandise_subtotal_usd', event_type='autoship_shipment_charge')
      - XLATEST('autoship', 'autoship_events', 'discount_usd', event_type='autoship_shipment_charge'), 2)
  - ship_date: XLATEST('autoship', 'autoship_events', 'event_date', event_type='autoship_shipment_charge')
  - ship_subscription: XLATEST('autoship', 'autoship_events', 'autoship_id', event_type='autoship_shipment_charge')
  - program_multiplier: CPARAM('autoship', 'points_multiplier', autoship_id=ship_subscription)
  - net_spend_12m: RND(SUM('member_events', 'qualifying_spend_usd', within_months=12, event_type='member_points_earn') - SUM('member_events',
      'qualifying_spend_usd', within_months=12, event_type='member_points_reverse'), 2)
  - tier_rate: K('vip_rate_per_usd') if (F('variant_name') == 'Pals Rewards Member' or F('variant_name') == 'Pals Rewards
      Insider') and net_spend_12m >= K('vip_threshold_usd') else (K('insider_rate_per_usd') if F('variant_name') == 'Pals
      Rewards Member' and net_spend_12m >= K('insider_threshold_usd') else P('base_points_per_usd'))
  - recent_earn_count: COUNT('member_events', within_months=3, event_type='member_points_earn')
  - tenure_months: MONTHS(F('enrolled_on'), NOW)
  - apology_rate: K('apology_rate_high') if tenure_months >= K('apology_long_months') and recent_earn_count >= K('apology_active_count')
      else (K('apology_rate_low') if tenure_months >= K('apology_mid_months') and recent_earn_count >= 1 else 0)
  - ship_seq: XLATEST('autoship', 'autoship_events', 'shipment_seq', event_type='autoship_shipment_charge')
  - milestone_rate: K('milestone_rate_high') if ship_seq >= K('milestone_high_seq') else (K('milestone_rate_low') if ship_seq
      >= K('milestone_low_seq') else 0)
  - streak_count: XCOUNT('autoship', 'autoship_events', within_months=6, event_type='autoship_shipment_charge')
  - streak_rate: K('streak_rate_high') if streak_count >= K('streak_high_count') else (K('streak_rate_low') if streak_count
      >= K('streak_low_count') else 0)
  - summed_rate: tier_rate + apology_rate + milestone_rate + streak_rate
  - days_late: DAYS(ship_date, NOW)
  - late_rate: summed_rate * K('late_long_factor') if days_late > K('late_long_days') else (summed_rate + K('late_short_rate')
      if days_late > K('late_short_days') else summed_rate)
  - result: MN(int(RND(ship_spend * late_rate * program_multiplier, 6)), P('max_points_per_transaction'))
  compute_basis:
    ship_spend: The qualifying spend of that shipment is its merchandise subtotal less its Autoship discount, as the shipment
      charge records them.
    ship_date: When a customer's most recent charged Autoship shipment has no points earning on the rewards ledger, a care
      agent posts the missed-earning points for that shipment, dated on the shipment's processing date.
    ship_subscription: The missed-earning points are that qualifying spend times the missed-earning rate times the points_multiplier
      of the Autoship program the shipment belongs to, rounded down to a whole point; the missed-earning rate is the member's
      base earn rate that the Autoship program's own earning rule multiplies by points_multiplier, stated in points per qualifying
      dollar.
    program_multiplier: The missed-earning points are that qualifying spend times the missed-earning rate times the points_multiplier
      of the Autoship program the shipment belongs to, rounded down to a whole point; the missed-earning rate is the member's
      base earn rate that the Autoship program's own earning rule multiplies by points_multiplier, stated in points per qualifying
      dollar.
    net_spend_12m: 'The missed-earning rate starts from a tier rate: a membership holding Pals Rewards Member or Pals Rewards
      Insider whose net qualifying spend over the last 12 months, its points-earning qualifying spend less its points-reversal
      qualifying spend, has reached vip_threshold_usd takes vip_rate_per_usd, the base_points_per_usd of Pals Rewards VIP;
      a membership holding Pals Rewards Member whose such spend has reached insider_threshold_usd but not vip_threshold_usd
      takes insider_rate_per_usd, the base_points_per_usd of Pals Rewards Insider; any other membership takes the standard
      missed-earning rate.'
    tier_rate: 'The missed-earning rate starts from a tier rate: a membership holding Pals Rewards Member or Pals Rewards
      Insider whose net qualifying spend over the last 12 months, its points-earning qualifying spend less its points-reversal
      qualifying spend, has reached vip_threshold_usd takes vip_rate_per_usd, the base_points_per_usd of Pals Rewards VIP;
      a membership holding Pals Rewards Member whose such spend has reached insider_threshold_usd but not vip_threshold_usd
      takes insider_rate_per_usd, the base_points_per_usd of Pals Rewards Insider; any other membership takes the standard
      missed-earning rate.'
    recent_earn_count: 'A missed-earning apology rate is added to the tier rate: a membership enrolled for at least apology_long_months
      months that also has at least apology_active_count points-earning entries dated in the last three months adds apology_rate_high
      points per dollar; a membership that does not meet both of those conditions but is enrolled for at least apology_mid_months
      months and has at least one points-earning entry dated in the last three months adds apology_rate_low points per dollar;
      any other membership adds no missed-earning apology rate.'
    tenure_months: 'A missed-earning apology rate is added to the tier rate: a membership enrolled for at least apology_long_months
      months that also has at least apology_active_count points-earning entries dated in the last three months adds apology_rate_high
      points per dollar; a membership that does not meet both of those conditions but is enrolled for at least apology_mid_months
      months and has at least one points-earning entry dated in the last three months adds apology_rate_low points per dollar;
      any other membership adds no missed-earning apology rate.'
    apology_rate: 'A missed-earning apology rate is added to the tier rate: a membership enrolled for at least apology_long_months
      months that also has at least apology_active_count points-earning entries dated in the last three months adds apology_rate_high
      points per dollar; a membership that does not meet both of those conditions but is enrolled for at least apology_mid_months
      months and has at least one points-earning entry dated in the last three months adds apology_rate_low points per dollar;
      any other membership adds no missed-earning apology rate.'
    ship_seq: 'A subscription milestone rate is added according to the shipment''s position in its subscription (its shipment
      sequence number): at least milestone_high_seq, milestone_rate_high points per dollar; at least milestone_low_seq but
      below milestone_high_seq, milestone_rate_low points per dollar; below milestone_low_seq, no subscription milestone rate.'
    milestone_rate: 'A subscription milestone rate is added according to the shipment''s position in its subscription (its
      shipment sequence number): at least milestone_high_seq, milestone_rate_high points per dollar; at least milestone_low_seq
      but below milestone_high_seq, milestone_rate_low points per dollar; below milestone_low_seq, no subscription milestone
      rate.'
    streak_count: 'An Autoship streak rate is added: a customer whose Autoship subscriptions carry at least streak_high_count
      charged shipments dated in the last six months adds streak_rate_high points per dollar; at least streak_low_count but
      fewer than streak_high_count such shipments, streak_rate_low points per dollar; fewer than streak_low_count, no Autoship
      streak rate.'
    streak_rate: 'An Autoship streak rate is added: a customer whose Autoship subscriptions carry at least streak_high_count
      charged shipments dated in the last six months adds streak_rate_high points per dollar; at least streak_low_count but
      fewer than streak_high_count such shipments, streak_rate_low points per dollar; fewer than streak_low_count, no Autoship
      streak rate.'
    summed_rate: 'The late-posting adjustment then applies to the tier rate plus the apology, milestone and streak rates,
      according to the calendar days from the shipment''s processing date to the posting date: more than late_long_days days,
      that summed rate is multiplied by late_long_factor; more than late_short_days but at most late_long_days days, late_short_rate
      points per dollar are added to that summed rate; late_short_days days or fewer, that summed rate is used as it stands.'
    days_late: 'The late-posting adjustment then applies to the tier rate plus the apology, milestone and streak rates, according
      to the calendar days from the shipment''s processing date to the posting date: more than late_long_days days, that summed
      rate is multiplied by late_long_factor; more than late_short_days but at most late_long_days days, late_short_rate points
      per dollar are added to that summed rate; late_short_days days or fewer, that summed rate is used as it stands.'
    late_rate: 'The late-posting adjustment then applies to the tier rate plus the apology, milestone and streak rates, according
      to the calendar days from the shipment''s processing date to the posting date: more than late_long_days days, that summed
      rate is multiplied by late_long_factor; more than late_short_days but at most late_long_days days, late_short_rate points
      per dollar are added to that summed rate; late_short_days days or fewer, that summed rate is used as it stands.'
    result: The posted missed-earning points never exceed the max_points_per_transaction of the tier held, that cap being
      applied as the very last step.
  factors:
  - id: missed_earning_tier_rate
    effect: parameter
    decides: tier_rate
    bindings:
    - net_spend_12m
    - tier_rate
    ladder:
    - when: holds Pals Rewards Member or Pals Rewards Insider and 12-month net qualifying spend at least vip_threshold_usd
      value: K('vip_rate_per_usd')
    - when: holds Pals Rewards Member and 12-month net qualifying spend at least insider_threshold_usd but below vip_threshold_usd
      value: K('insider_rate_per_usd')
    - when: otherwise
      value: P('base_points_per_usd')
    baseline:
      tier_rate: P('base_points_per_usd')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: missed_earning_apology
    effect: parameter
    decides: apology_rate
    bindings:
    - recent_earn_count
    - tenure_months
    - apology_rate
    ladder:
    - when: enrolled at least apology_long_months months and at least apology_active_count points-earning entries in the last
        three months
      value: K('apology_rate_high')
    - when: not both of the above, but enrolled at least apology_mid_months months and at least one points-earning entry in
        the last three months
      value: K('apology_rate_low')
    - when: otherwise
      value: '0'
    baseline:
      apology_rate: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: subscription_milestone
    effect: parameter
    decides: milestone_rate
    bindings:
    - ship_seq
    - milestone_rate
    ladder:
    - when: the shipment's sequence number is at least milestone_high_seq
      value: K('milestone_rate_high')
    - when: at least milestone_low_seq but below milestone_high_seq
      value: K('milestone_rate_low')
    - when: otherwise
      value: '0'
    baseline:
      milestone_rate: '0'
    evidence:
    - cross_category
    cross_difficulty: autoship
  - id: autoship_streak
    effect: parameter
    decides: streak_rate
    bindings:
    - streak_count
    - streak_rate
    ladder:
    - when: at least streak_high_count charged Autoship shipments dated in the last six months
      value: K('streak_rate_high')
    - when: at least streak_low_count but fewer than streak_high_count
      value: K('streak_rate_low')
    - when: otherwise
      value: '0'
    baseline:
      streak_rate: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: autoship
  - id: late_posting_adjustment
    effect: method
    decides: late_rate
    bindings:
    - days_late
    - late_rate
    ladder:
    - when: more than late_long_days calendar days from the processing date to the posting date
      method: the summed rate is multiplied by late_long_factor
    - when: more than late_short_days but at most late_long_days days
      method: late_short_rate points per dollar are added to the summed rate
    - when: otherwise
      method: the summed rate is used as it stands
    baseline:
      late_rate: summed_rate
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: When a customer's most recent charged Autoship shipment has no points earning on the rewards ledger, a care agent
      posts the missed-earning points for that shipment, dated on the shipment's processing date. The qualifying spend of
      that shipment is its merchandise subtotal less its Autoship discount, as the shipment charge records them. The missed-earning
      points are that qualifying spend times the missed-earning rate times the points_multiplier of the Autoship program the
      shipment belongs to, rounded down to a whole point; the missed-earning rate is the member's base earn rate that the
      Autoship program's own earning rule multiplies by points_multiplier, stated in points per qualifying dollar. The standard
      missed-earning rate is the base_points_per_usd of the tier the membership holds. The posted missed-earning points never
