- id: member_ext_overdue_annual_fee
  base_policy_refs:
  - member_plus_billing
  overwrite:
  - base_policy: member_plus_billing
    superseded_clause: A paid tier charges membership_fee_usd on each next_billing_date while auto_renew is true;
    replaced_by: 'The order of the overdue fee is fixed: the past-due adjustment applies to the standard overdue fee first,
      the renewal loyalty rate then applies once to that adjusted fee, and the first-decline, Autoship, salon and activity
      courtesies are then subtracted from the result as flat amounts.'
  - base_policy: member_plus_billing
    superseded_clause: Paying the overdue fee reinstates the paid tier for the same term dates;
    replaced_by: When a Tailwise Plus Annual or Tailwise Plus Premier Annual membership is past due, a care agent collects
      the overdue fee for the billing period whose fee was declined with the card on file, which reinstates the paid tier
      for the term that billing period opened.
  trigger: state_due
  subject:
  - member_reinstate
  computes: overdue_fee_usd
  target_tool: reinstate_plus_tier_c2894e52
  params:
    withheld_long_days: 14
    withheld_short_days: 7
    days_per_year: 365
    days_30_360: 360
    renew_fee_count: 2
    renew_long_months: 60
    renew_mid_months: 24
    renew_rate_high: 0.1
    renew_rate_low: 0.05
    courtesy_first: 2.0
    courtesy_second: 1.0
    ship_courtesy_count: 3
    autoship_courtesy_high: 2.0
    autoship_courtesy_low: 1.0
    courtesy_salon_days: 60
    salon_courtesy_high: 2.0
    salon_courtesy_low: 1.0
    activity_high_count: 15
    activity_low_count: 8
    activity_courtesy_high: 3.0
    activity_courtesy_low: 1.5
  rule: 'When a Tailwise Plus Annual or Tailwise Plus Premier Annual membership is past due, a care agent collects the overdue
    fee for the billing period whose fee was declined with the card on file, which reinstates the paid tier for the term that
    billing period opened. The standard overdue fee is the membership_fee_usd of the paid tier held, collected in full. Because
    paid benefits stop while a membership is past due, the overdue fee is first adjusted for the past-due days, the calendar
    days from the date of the declined-fee entry to the collection date, by one of three methods: more than withheld_long_days
    past-due days, the fee is prorated by calendar day over a year of days_per_year days, keeping days_per_year less the past-due
    days out of days_per_year; more than withheld_short_days but at most withheld_long_days past-due days, the fee is prorated
    on a 30/360 basis, keeping days_30_360 less the past-due days out of days_30_360; withheld_short_days past-due days or
    fewer, the fee is collected unadjusted. A renewal loyalty rate then reduces the adjusted overdue fee: a membership with
    at least renew_fee_count membership fees charged in the last 36 months and enrolled for at least renew_long_months months,
    renew_rate_high; a membership that does not meet both of those conditions but has at least one membership fee charged
    in the last 36 months and is enrolled for at least renew_mid_months months, renew_rate_low; any other membership, no renewal
    loyalty rate. A first-decline courtesy is then subtracted according to the declined-fee entries dated in the last 24 months:
    exactly one, courtesy_first; exactly two, courtesy_second; none or more than two, no first-decline courtesy. An Autoship
    courtesy is then subtracted: a customer whose Autoship subscriptions carry at least ship_courtesy_count charged shipments
    dated in the last three months, autoship_courtesy_high; at least one but fewer than ship_courtesy_count such shipments,
    autoship_courtesy_low; none, no Autoship courtesy. A salon courtesy is then subtracted: a customer holding an active grooming
    pass whose latest completed visit was at most courtesy_salon_days calendar days before the collection date, salon_courtesy_high;
    a customer holding an active grooming pass without such a visit, salon_courtesy_low; a customer holding no active grooming
    pass, no salon courtesy. An activity courtesy is then subtracted according to the points-earning entries dated on the
    ledger in the last 12 months: at least activity_high_count, activity_courtesy_high; at least activity_low_count but fewer
    than activity_high_count, activity_courtesy_low; fewer than activity_low_count, no activity courtesy. The order of the
    overdue fee is fixed: the past-due adjustment applies to the standard overdue fee first, the renewal loyalty rate then
    applies once to that adjusted fee, and the first-decline, Autoship, salon and activity courtesies are then subtracted
    from the result as flat amounts. The overdue fee is never below zero and is rounded to the nearest cent as the last step.'
  prerequisite: []
  cross_category:
  - category: autoship
    as: history
    reads:
    - autoship_events.event_type
    - autoship_events.event_date
    note: the three-month count of charged Autoship shipments decides the Autoship courtesy tier
  - category: groom
    as: branch
    reads:
    - status
    - groom_events.event_date
    note: an active grooming pass and its latest completed visit decide the salon courtesy tier
  compute:
  - standard_overdue: P('membership_fee_usd')
  - declined_date: LATEST('member_events', 'event_date', event_type='member_fee_declined')
  - past_due_days: DAYS(declined_date, NOW)
  - withheld_fee: standard_overdue * (K('days_per_year') - past_due_days) / K('days_per_year') if past_due_days > K('withheld_long_days')
      else (standard_overdue * (K('days_30_360') - past_due_days) / K('days_30_360') if past_due_days > K('withheld_short_days')
      else standard_overdue)
  - fees_36m: COUNT('member_events', within_months=36, event_type='member_fee_charge')
  - tenure_months: MONTHS(F('enrolled_on'), NOW)
  - renew_rate: K('renew_rate_high') if fees_36m >= K('renew_fee_count') and tenure_months >= K('renew_long_months') else
      (K('renew_rate_low') if fees_36m >= 1 and tenure_months >= K('renew_mid_months') else 0)
  - declines_24m: COUNT('member_events', within_months=24, event_type='member_fee_declined')
  - decline_courtesy: K('courtesy_first') if declines_24m == 1 else (K('courtesy_second') if declines_24m == 2 else 0)
  - ships_3m: XCOUNT('autoship', 'autoship_events', within_months=3, event_type='autoship_shipment_charge')
  - autoship_courtesy: K('autoship_courtesy_high') if ships_3m >= K('ship_courtesy_count') else (K('autoship_courtesy_low')
      if ships_3m >= 1 else 0)
  - salon_active: EXISTS('groom', status='active')
  - last_visit: XLATEST('groom', 'groom_events', 'event_date', event_type='groom_visit_complete') or '1900-01-01'
  - salon_courtesy: K('salon_courtesy_high') if salon_active and DAYS(last_visit, NOW) <= K('courtesy_salon_days') else (K('salon_courtesy_low')
      if salon_active else 0)
  - earnings_12m: COUNT('member_events', within_months=12, event_type='member_points_earn')
  - activity_courtesy: K('activity_courtesy_high') if earnings_12m >= K('activity_high_count') else (K('activity_courtesy_low')
      if earnings_12m >= K('activity_low_count') else 0)
  - after_rate: withheld_fee * (1 - renew_rate)
  - result: RND(MX(0, after_rate - decline_courtesy - autoship_courtesy - salon_courtesy - activity_courtesy), 2)
  compute_basis:
    standard_overdue: The standard overdue fee is the membership_fee_usd of the paid tier held, collected in full.
    declined_date: 'Because paid benefits stop while a membership is past due, the overdue fee is first adjusted for the past-due
      days, the calendar days from the date of the declined-fee entry to the collection date, by one of three methods: more
      than withheld_long_days past-due days, the fee is prorated by calendar day over a year of days_per_year days, keeping
      days_per_year less the past-due days out of days_per_year; more than withheld_short_days but at most withheld_long_days
      past-due days, the fee is prorated on a 30/360 basis, keeping days_30_360 less the past-due days out of days_30_360;
      withheld_short_days past-due days or fewer, the fee is collected unadjusted.'
    past_due_days: 'Because paid benefits stop while a membership is past due, the overdue fee is first adjusted for the past-due
      days, the calendar days from the date of the declined-fee entry to the collection date, by one of three methods: more
      than withheld_long_days past-due days, the fee is prorated by calendar day over a year of days_per_year days, keeping
      days_per_year less the past-due days out of days_per_year; more than withheld_short_days but at most withheld_long_days
      past-due days, the fee is prorated on a 30/360 basis, keeping days_30_360 less the past-due days out of days_30_360;
      withheld_short_days past-due days or fewer, the fee is collected unadjusted.'
    withheld_fee: 'Because paid benefits stop while a membership is past due, the overdue fee is first adjusted for the past-due
      days, the calendar days from the date of the declined-fee entry to the collection date, by one of three methods: more
      than withheld_long_days past-due days, the fee is prorated by calendar day over a year of days_per_year days, keeping
      days_per_year less the past-due days out of days_per_year; more than withheld_short_days but at most withheld_long_days
      past-due days, the fee is prorated on a 30/360 basis, keeping days_30_360 less the past-due days out of days_30_360;
      withheld_short_days past-due days or fewer, the fee is collected unadjusted.'
    fees_36m: 'A renewal loyalty rate then reduces the adjusted overdue fee: a membership with at least renew_fee_count membership
      fees charged in the last 36 months and enrolled for at least renew_long_months months, renew_rate_high; a membership
      that does not meet both of those conditions but has at least one membership fee charged in the last 36 months and is
      enrolled for at least renew_mid_months months, renew_rate_low; any other membership, no renewal loyalty rate.'
    tenure_months: 'A renewal loyalty rate then reduces the adjusted overdue fee: a membership with at least renew_fee_count
      membership fees charged in the last 36 months and enrolled for at least renew_long_months months, renew_rate_high; a
      membership that does not meet both of those conditions but has at least one membership fee charged in the last 36 months
      and is enrolled for at least renew_mid_months months, renew_rate_low; any other membership, no renewal loyalty rate.'
    renew_rate: 'A renewal loyalty rate then reduces the adjusted overdue fee: a membership with at least renew_fee_count
      membership fees charged in the last 36 months and enrolled for at least renew_long_months months, renew_rate_high; a
      membership that does not meet both of those conditions but has at least one membership fee charged in the last 36 months
      and is enrolled for at least renew_mid_months months, renew_rate_low; any other membership, no renewal loyalty rate.'
    declines_24m: 'A first-decline courtesy is then subtracted according to the declined-fee entries dated in the last 24
      months: exactly one, courtesy_first; exactly two, courtesy_second; none or more than two, no first-decline courtesy.'
    decline_courtesy: 'A first-decline courtesy is then subtracted according to the declined-fee entries dated in the last
      24 months: exactly one, courtesy_first; exactly two, courtesy_second; none or more than two, no first-decline courtesy.'
    ships_3m: 'An Autoship courtesy is then subtracted: a customer whose Autoship subscriptions carry at least ship_courtesy_count
      charged shipments dated in the last three months, autoship_courtesy_high; at least one but fewer than ship_courtesy_count
      such shipments, autoship_courtesy_low; none, no Autoship courtesy.'
    autoship_courtesy: 'An Autoship courtesy is then subtracted: a customer whose Autoship subscriptions carry at least ship_courtesy_count
      charged shipments dated in the last three months, autoship_courtesy_high; at least one but fewer than ship_courtesy_count
      such shipments, autoship_courtesy_low; none, no Autoship courtesy.'
    salon_active: 'A salon courtesy is then subtracted: a customer holding an active grooming pass whose latest completed
      visit was at most courtesy_salon_days calendar days before the collection date, salon_courtesy_high; a customer holding
      an active grooming pass without such a visit, salon_courtesy_low; a customer holding no active grooming pass, no salon
      courtesy.'
    last_visit: 'A salon courtesy is then subtracted: a customer holding an active grooming pass whose latest completed visit
      was at most courtesy_salon_days calendar days before the collection date, salon_courtesy_high; a customer holding an
      active grooming pass without such a visit, salon_courtesy_low; a customer holding no active grooming pass, no salon
      courtesy.'
    salon_courtesy: 'A salon courtesy is then subtracted: a customer holding an active grooming pass whose latest completed
      visit was at most courtesy_salon_days calendar days before the collection date, salon_courtesy_high; a customer holding
      an active grooming pass without such a visit, salon_courtesy_low; a customer holding no active grooming pass, no salon
      courtesy.'
    after_rate: 'The order of the overdue fee is fixed: the past-due adjustment applies to the standard overdue fee first,
      the renewal loyalty rate then applies once to that adjusted fee, and the first-decline, Autoship, salon and activity
      courtesies are then subtracted from the result as flat amounts.'
    result: The overdue fee is never below zero and is rounded to the nearest cent as the last step.
    activity_courtesy: 'An activity courtesy is then subtracted according to the points-earning entries dated on the ledger
      in the last 12 months: at least activity_high_count, activity_courtesy_high; at least activity_low_count but fewer than
      activity_high_count, activity_courtesy_low; fewer than activity_low_count, no activity courtesy.'
    earnings_12m: 'An activity courtesy is then subtracted according to the points-earning entries dated on the ledger in
      the last 12 months: at least activity_high_count, activity_courtesy_high; at least activity_low_count but fewer than
      activity_high_count, activity_courtesy_low; fewer than activity_low_count, no activity courtesy.'
  factors:
  - id: past_due_adjustment
    effect: method
    decides: withheld_fee
    bindings:
    - declined_date
    - past_due_days
    - withheld_fee
    ladder:
    - when: more than withheld_long_days past-due days
      method: prorate by calendar day over a days_per_year-day year, keeping days_per_year less the past-due days
    - when: more than withheld_short_days but at most withheld_long_days past-due days
      method: prorate on a 30/360 basis, keeping days_30_360 less the past-due days
    - when: otherwise
      method: collect the fee unadjusted
    baseline:
      withheld_fee: standard_overdue
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: renewal_loyalty_rate
    effect: parameter
    decides: renew_rate
    bindings:
    - fees_36m
    - tenure_months
    - renew_rate
    ladder:
    - when: at least renew_fee_count fees in 36 months and enrolled at least renew_long_months months
      value: K('renew_rate_high')
    - when: not both, but at least one fee in 36 months and enrolled at least renew_mid_months months
      value: K('renew_rate_low')
    - when: otherwise
      value: '0'
    baseline:
      renew_rate: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: first_decline_courtesy
    effect: parameter
    decides: decline_courtesy
    bindings:
    - declines_24m
    - decline_courtesy
    ladder:
    - when: exactly one declined-fee entry in 24 months
      value: K('courtesy_first')
    - when: exactly two
      value: K('courtesy_second')
    - when: otherwise
      value: '0'
    baseline:
      decline_courtesy: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: autoship_courtesy
    effect: parameter
    decides: autoship_courtesy
    bindings:
    - ships_3m
    - autoship_courtesy
    ladder:
    - when: at least ship_courtesy_count charged Autoship shipments in three months
      value: K('autoship_courtesy_high')
    - when: at least one but fewer
      value: K('autoship_courtesy_low')
    - when: otherwise
      value: '0'
    baseline:
      autoship_courtesy: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: autoship
  - id: salon_courtesy
    effect: parameter
    decides: salon_courtesy
    bindings:
    - salon_active
    - last_visit
    - salon_courtesy
    ladder:
    - when: an active grooming pass with a completed visit at most courtesy_salon_days days before collection
      value: K('salon_courtesy_high')
    - when: an active grooming pass without such a visit
      value: K('salon_courtesy_low')
    - when: otherwise
      value: '0'
    baseline:
      salon_courtesy: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: groom
  - id: activity_courtesy
    effect: parameter
    decides: activity_courtesy
    bindings:
    - earnings_12m
    - activity_courtesy
    ladder:
    - when: at least activity_high_count points-earning entries in 12 months
      value: K('activity_courtesy_high')
    - when: at least activity_low_count but fewer than activity_high_count
      value: K('activity_courtesy_low')
    - when: otherwise
      value: '0'
    baseline:
      activity_courtesy: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: When a Tailwise Plus Annual or Tailwise Plus Premier Annual membership is past due, a care agent collects the overdue
      fee for the billing period whose fee was declined with the card on file, which reinstates the paid tier for the term
      that billing period opened. The standard overdue fee is the membership_fee_usd of the paid tier held, collected in full.
      The overdue fee is never below zero and is rounded to the nearest cent as the last step.
    params:
