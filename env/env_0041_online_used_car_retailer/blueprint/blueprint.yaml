# The blueprint of env_0041_online_used_car_retailer. Output of the erl-scenario-blueprint skill.

name: env_0041_online_used_car_retailer
company: Kestrel Auto

background: |
  Kestrel Auto is an online used car retailer headquartered in Tempe, Arizona, that sells reconditioned used vehicles entirely through its website and app to private buyers in Arizona, Texas, Georgia, Florida, North Carolina, Ohio, Pennsylvania and Colorado.
  It holds dealer licenses in each of those states, keeps roughly forty thousand vehicles in inventory across fourteen inspection and reconditioning hubs and five vending towers, and its customer care team speaks in a plain, friendly and precise voice that explains the paperwork behind every car.
  Every vehicle is sold under one of six vehicle programs, from lowest to highest: Kestrel Value Line, Kestrel Inspected, Kestrel Certified, Kestrel Certified Plus, Kestrel Premium Certified and Kestrel Factory Certified.
  A customer holds a Vehicle Purchase Agreement as a purchase order that opens as a reservation backed by a deposit, becomes a signed order, is handed over at a delivery or pickup, may be returned within the return window, and ends as a completed sale; its ledger books deposits, charges, payments and refunds, and the included Kestrel limited warranty books repair decisions against the order.
  Handover happens through Delivery & Pickup Appointments under one of six fulfillment methods: Kestrel Hub Pickup, Kestrel Vending Tower Pickup, Kestrel Fly & Drive, Kestrel Local Home Delivery, Kestrel Extended-Zone Delivery and Kestrel Enclosed White-Glove Delivery, each appointment carrying its own fees, reschedules and condition reports.
  Customers can sell or trade a vehicle under Trade-In Agreements written at one of six condition grades, Inoperable Condition Offer, Rough Condition Offer, Fair Condition Offer, Good Condition Offer, Very Good Condition Offer and Excellent Condition Offer, and the agreement books the value credited at pickup, inspection deductions, the payoff of any existing loan and the equity that flows to a purchase or back to the customer.
  Purchases can be financed through Kestrel Auto Finance Retail Installment Contracts, simple-interest loans decisioned into Kestrel Finance Tier E, Tier D, Tier C, Tier B, Tier A or Tier A+, whose ledgers record funding, monthly payments split into interest, fees and principal, fees, credits, payoff quotes and deferrals.
  Every signed purchase opens a Title & Registration Services order under one of six service types, Kestrel Title-Only Service, Kestrel In-State Plate Transfer, Kestrel In-State New Registration, Kestrel Out-of-State Registration, Kestrel Out-of-State Registration with Inspection and Kestrel Specialty Plate Registration, which collects state fees, issues temporary tags, gathers the buyer's documents and carries the packet to the state.
  Buyers can protect the vehicle with KestrelCare Vehicle Service Contracts at six coverage levels, KestrelCare Powertrain, KestrelCare Powertrain Plus, KestrelCare Silver, KestrelCare Gold, KestrelCare Platinum and KestrelCare Platinum Exclusionary, each holding a limit of liability that repair claims draw down.
  They can also prepay routine service with KestrelCare Prepaid Maintenance Plans, from KestrelCare Maintenance Starter, Basic, Standard and Plus up to Premier and Premier Max, which hold a balance of service visits.
  Financed buyers may add a Kestrel GAP Waiver at the Kestrel GAP Essential, Standard, Plus, Premier, Premier Plus or Max level, which follows the finance contract and pays the loan shortfall after a total loss.
  The people who contact customer care are mostly first-time online car buyers and families replacing a vehicle, from students buying a high-mileage commuter to professionals buying a certified luxury SUV.
  A typical caller holds one purchase order with its title order and delivery appointment, often a trade-in agreement with a loan payoff, frequently a finance contract with a service contract, and sometimes a maintenance plan or GAP waiver; repeat buyers and exchange customers can hold several of each.
  They arrive with a history already on file: deposits and down payments posted, temporary tags issued and documents sent or still missing, payoff quotes from their old lender, monthly payments made on time or late, and repair orders decided under their coverage.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: purchase_reservations_and_returns
    claim:
      categories: [purchase]
      event_types: [purchase_hold_extended, purchase_insurance_verified, purchase_order_cancelled, purchase_deposit_applied, purchase_deposit_refunded, purchase_payment_posted, purchase_charge_posted, purchase_charge_reversed, purchase_refund_issued, purchase_return_initiated, purchase_return_withdrawn, purchase_return_completed, purchase_limited_warranty_claim_decided]
    summary: >
      Callers are buyers at every point of a vehicle purchase: holding a reservation that is about to lapse, waiting
      on a signed order that cannot be handed over yet, cancelling before delivery, or wanting to return or exchange a
      vehicle they have just received, across all six vehicle programs and with or without a trade-in, Kestrel
      financing, an outside lender, a service contract or a maintenance plan attached to the same order. The records
      involved are the purchase order with its status, dates, odometers, insurance flag, order balance and held
      deposit, its ledger of deposits, charges, payments and refunds, its return requests and limited warranty
      decisions, read together with the delivery appointment, title order, finance contract and trade-in agreement
      of the same order; the governing rules are state gates on the order status, time gates anchored on the hold
      expiration and handover dates (purchase_hold_extension, purchase_return_eligibility), per-program amounts for
      deposits, mileage allowances and fees, retention and reversal rules on cancellation (purchase_cancellation),
      return charges and refunds (purchase_return_settlement), the readiness conditions for handover
      (purchase_handover_readiness) and the included limited warranty (purchase_limited_warranty), while in the
      natural order of the domain a reservation is signed, funded and insured before handover and only a handed-over
      vehicle can be returned. Agent service actions include extending holds, recording verified insurance, posting
      charges, reversals, payments and refunds, cancelling orders and deciding limited warranty repairs after
      identity verification, whereas authorizing a return or withdrawing one is the buyer's own act that the agent
      hands over for the buyer to sign. Requests no rule decides, such as extending the return right beyond its
      window, negotiating the price after signing, buying back a vehicle whose sale is final, or compensating a
      buyer for inconvenience, are outside the charter and go to a human as POLICY_NOT_COVERED.

  - name: trade_in_offers_and_payoffs
    claim:
      categories: [tradein]
      event_types: [tradein_offer_accepted, tradein_offer_regraded, tradein_value_deducted, tradein_payoff_quote_recorded, tradein_lien_payoff_sent, tradein_negative_equity_settled, tradein_equity_applied, tradein_equity_paid_out, tradein_title_document_received, tradein_title_recorded, tradein_agreement_cancelled, tradein_settled]
    summary: >
      Callers are owners selling or trading a vehicle to Kestrel at any of the six condition grades: some want to
      accept an offer near its expiration, some dispute deductions taken at pickup inspection, many still owe a
      lender or lessor and ask when their old loan will be paid off, whether they owe a shortfall, or when their
      equity will reach their purchase or their bank account, and some have a linked purchase that was cancelled or
      returned. The records involved are the trade-in agreement with its grade, original and current offer, stated
      and inspected mileage, keys, lienholder, pickup and title dates and equity balance, its ledger of credited
      value, deductions, payoff quotes, the payoff sent, shortfall coverage, equity applied or paid out and title
      documents, read together with the linked purchase order and its finance contract; the governing rules are the
      offer validity and pickup windows (tradein_offer_acceptance, tradein_pickup_inspection), the inspection
      deduction and regrade ladder per grade, quote age, per-diem and one-payoff rules (tradein_lien_payoff),
      negative equity coverage including roll-in limits from the finance tier (tradein_negative_equity), equity
      distribution and payout holds (tradein_equity_distribution), title receipt and chargebacks
      (tradein_title_receipt) and settlement (tradein_settlement), with the natural order of the domain running from
      acceptance through pickup, a confirmed quote, the payoff, the equity and the title. Agent service actions
      include recording quotes and deductions, sending payoffs, applying or paying out equity, recording title
      documents and settling or cancelling agreements, while accepting an offer or re-accepting an adjusted one is
      the owner's own decision handed to them to confirm. Requests no rule decides, such as taking a vehicle back
      after pickup, contesting a lender's own payoff figures, a lessor that refuses to release a lease, or a title
      held by an estate, go to a human as POLICY_NOT_COVERED.

  - name: auto_loan_servicing
    claim:
      categories: [finance]
      event_types: [finance_stips_cleared, finance_contract_signed, finance_payment_posted, finance_schedule_advanced, finance_fee_assessed, finance_fee_cleared, finance_payment_returned, finance_principal_credited, finance_payoff_quote_issued, finance_deferral_granted, finance_deferral_applied, finance_due_date_changed, finance_autopay_changed]
    summary: >
      Callers are borrowers with Kestrel Auto Finance approvals or contracts in any of the six credit tiers: applicants
      trying to sign before an approval lapses, borrowers making or disputing a payment, asking why a late or
      returned-payment fee posted, requesting a payoff quote for a sale or refinance elsewhere, asking to skip a
      payment, move their due date or change autopay, and borrowers whose returned vehicle or cancelled add-on product
      should have reduced their balance. The records involved are the finance contract with its tier, APR, term,
      payment, due dates, last payment date, autopay, stipulation flag, deferral and due-date counters, principal and
      fees, and its ledger of funding, payments with their interest, fee and principal split, returned payments,
      fees, credits, quotes and deferrals, read together with the purchase order, service contracts, maintenance plans
      and GAP waivers that feed it; the governing rules are signing within approval validity once stipulations clear
      (finance_contract_signing), the daily simple-interest payment waterfall and card limits
      (finance_payment_application), grace-based late fees and goodwill waiver counts (finance_late_fees), returned
      payments (finance_returned_payments), per-tier deferral and due-date change eligibility (finance_deferral,
      finance_due_date_change), payoff quotes (finance_payoff) and principal credits and unwinds
      (finance_principal_credits), with the natural order of the domain running from approval to signing, funding,
      monthly installments and payoff. Agent service actions include posting payments, assessing and waiving fees,
      issuing quotes, granting deferrals and due-date changes, changing autopay and applying credits after identity
      verification, while signing the retail installment contract is the borrower's own act handed to them. Requests
      no rule decides, such as refinancing or lowering the rate, settling for less than the balance, removing a
      co-borrower, disputing credit reporting, or accounts in collections, repossession or bankruptcy, go to a human
      as POLICY_NOT_COVERED.

  - name: title_and_registration
    claim:
      categories: [title]
      event_types: [title_state_fee_collected, title_document_received, title_documents_completed, title_submitted_to_dmv, title_state_fee_remitted, title_dmv_rejection_recorded, title_resubmission_prepared, title_documents_reopened, title_temp_tag_issued, title_temp_tag_recorded, title_reimbursement_paid, title_order_cancelled, title_state_fee_refunded]
    summary: >
      Callers are buyers waiting for plates and registration under any of the six service types, often with a
      temporary tag about to expire, a document they believe they already sent, a rejection from the state, a
      citation or late penalty they want reimbursed, or a purchase that was returned or cancelled before
      registration; their registration state, lienholder and whether they bought in or out of the dealer's state
      change what is needed. The records involved are the title order with its service type, registration state,
      lienholder, current temporary tag, extension count, submission and registration data and state fees held, and
      its ledger of fees collected, remitted and refunded, documents received with their form and printed date, tags
      issued, rejections and reimbursements, read together with the purchase order's balance, insurance flag and
      handover date; the governing rules are per-service document requirements and acceptance tests
      (title_documents), state fee schedules (title_service_fees), submission conditions and state dealer deadlines
      (title_submission), rejection cures (title_rejections), temporary tag validity, extension timing and limits
      (title_temp_tags), reimbursement conditions and caps (title_reimbursements) and refunds on cancellation
      (title_cancellation_refunds), with the natural order of the domain running from opening and the original tag
      through documents, submission, registration and plates. Agent service actions include recording documents,
      marking an order ready, submitting and resubmitting, issuing extension tags, paying reimbursements and
      cancelling or refunding orders after identity verification, while signing a power of attorney or odometer
      disclosure is the buyer's own act. Requests no rule decides, such as an order that has reached its submission
      limit, registering in a state outside Kestrel's footprint, moving a plate between two vehicles, or a name
      change on the title, go to a human as POLICY_NOT_COVERED.

  - name: service_contract_claims_and_cancellations
    claim:
      categories: [warranty]
      event_types: [warranty_contract_sold, warranty_claim_adjudicated, warranty_claim_paid, warranty_claim_payment_recovered, warranty_benefit_reimbursed, warranty_contract_cancelled, warranty_cancellation_refund_issued, warranty_contract_transferred, warranty_transfer_fee_charged]
    summary: >
      Callers are holders of KestrelCare service contracts at any of the six coverage levels, or buyers asking to add
      one after delivery: a repair facility is waiting on an authorization, a claim was denied for the waiting period,
      an uncovered part or missing maintenance records, the holder wants rental or towing reimbursed, or the holder
      wants to cancel because the vehicle was sold, returned or paid off, sometimes with the plan financed in a loan
      that is still active. The records involved are the service contract with its plan, price, term, deductible,
      sale and coverage start data, expiration, financing link, transfers and coverage remaining, its ledger of the
      limit opened, adjudications, payments, recoveries, benefits, refunds and transfer fees, and its cancellation
      requests, read together with the purchase order's handover date, vehicle price and limited warranty decisions
      and the finance contract's status; the governing rules are sale eligibility and the post-sale window
      (warranty_sale_eligibility), activation and the limit of liability (warranty_activation_and_limit), the
      ordered denial tests and payable amount (warranty_claims), the coverage stacking order with the limited
      warranty (warranty_agg_vehicle_coverage_stack), benefit caps (warranty_benefits), the flat, free-look and
      pro-rata refund bases with the lienholder rule (warranty_cancellation) and transfers (warranty_transfer), with
      the natural order of the domain running from sale through activation, claims and the end of the plan. Agent
      service actions include selling a plan, deciding and paying claims, reimbursing benefits, cancelling plans and
      issuing refunds after identity verification, while confirming a cancellation request with a signed odometer
      statement and transferring a plan to a private buyer are the holder's own acts handed to them. Requests no rule
      decides, such as goodwill payment above a plan's caps, coverage for a vehicle in commercial use, a plan sought
      after the purchase window, or a cancellation on behalf of a deceased holder, go to a human as
      POLICY_NOT_COVERED.
