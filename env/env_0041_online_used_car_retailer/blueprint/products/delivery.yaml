# Product charter: Delivery & Pickup Appointments (Kestrel Auto). Generated by erl-scenario-blueprint.
# One holding = one appointment at which a purchased vehicle is handed to the buyer.

category: delivery
display_name: Delivery & Pickup Appointments

binding:
  holding_table: delivery_orders
  event_tables: [delivery_charges]
  status_field: status
  variant_field: variant_name
  quantity_fields: {delivery_fees_due: delivery_fees_due}

lifecycle:
  states: [scheduled, dispatched, completed, missed, refused, cancelled]
  transitions:
    - {from: scheduled, to: dispatched, by: system, means: "The vehicle is loaded for delivery or staged at the hub or tower for the booked window."}
    - {from: dispatched, to: completed, by: system, means: "The buyer accepts the vehicle and the condition report is signed."}
    - {from: dispatched, to: missed, by: system, means: "The handover does not happen in the booked window (customer unavailable, Kestrel late, vehicle not ready or severe weather)."}
    - {from: dispatched, to: refused, by: user, means: "The buyer declines to accept the vehicle at handover."}
    - {from: missed, to: scheduled, by: agent, means: "A missed appointment is rebooked for a new date and window."}
    - {from: scheduled, to: cancelled, by: agent, means: "A booked appointment is cancelled, usually because the purchase order is cancelled."}
    - {from: missed, to: cancelled, by: agent, means: "A missed appointment is cancelled instead of rebooked."}

accounts:
  - key: delivery_fees_due
    unit: USD
    meaning: "Delivery, reschedule and missed-appointment fees billed on the appointment and not yet paid, waived or refunded."

parameter_schema:
  base_delivery_fee_usd: Flat fee for the appointment before any per-mile charge, USD
  included_radius_miles: Distance from the hub covered by the flat fee, integer miles
  service_radius_max_miles: Maximum distance from the hub the method serves (0 = pickup at the hub), integer miles
  per_mile_fee_beyond_radius_usd: Charge per mile of distance beyond the included radius, USD per mile
  delivery_fee_cap_usd: Maximum delivery fee for one appointment, USD
  exchange_delivery_fee_waived: Whether the delivery fee is waived for the replacement vehicle of a 7-day exchange, boolean
  min_scheduling_lead_days: Minimum calendar days between the purchase agreement signing date and the appointment date, integer days
  max_scheduling_horizon_days: Maximum calendar days between the booking date and the appointment date, integer days
  time_windows_offered: Appointment windows offered, list of time_window values
  appointment_days_of_week: Days of the week on which appointments are offered, list of day abbreviations
  holiday_closures: US holidays on which no appointments are offered, list of holiday names
  max_orders_per_window: Maximum appointments one customer may hold on the same date and window, integer count
  free_reschedules: Customer-initiated reschedules per appointment free of charge, integer count
  reschedule_fee_usd: Fee for each customer-initiated reschedule beyond the free reschedules, USD
  max_total_reschedules: Maximum customer-initiated reschedules per appointment, integer count
  reschedule_notice_hours: Hours before the start of the booked window by which a reschedule must be requested, integer hours
  weather_reschedule_fee_waived: Whether reschedules forced by a severe-weather advisory are free and not counted, boolean
  customer_wait_minutes: Minutes the driver or hub waits past the window start before the attempt is marked missed for customer unavailability, integer minutes
  missed_appointment_fee_usd: Fee when an attempt is missed because the customer was unavailable, USD
  max_customer_misses: Customer-caused missed attempts after which the appointment cannot be rebooked, integer count
  missed_rebook_lead_days: Minimum calendar days between a customer-caused miss and the rebooked appointment date, integer days
  kestrel_late_threshold_minutes: Minutes after the window end beyond which a Kestrel arrival counts as a Kestrel-caused miss if the customer declines to wait, integer minutes
  kestrel_miss_rebook_days: Calendar days after a Kestrel-caused miss within which Kestrel must offer a rebooked date, integer days
  kestrel_miss_fee_waiver: Whether pending reschedule and missed-appointment fees on the appointment are waived after a Kestrel-caused miss, boolean
  delay_cancellation_threshold_days: Calendar days by which Kestrel-caused rebooking may move the appointment past its original date before the buyer may cancel the order as vehicle unavailable, integer days
  hub_vehicle_hold_days_after_miss: Calendar days a vehicle stays held at the hub after a missed pickup, integer days (0 = not a pickup method)
  airfare_reimbursement_cap_usd: Maximum airfare reimbursed for the buyer's one-way flight to the hub, USD
  rideshare_reimbursement_cap_usd: Maximum rideshare or taxi fare reimbursed from the arrival airport to the hub, USD
  hotel_reimbursement_cap_usd: Maximum one-night hotel cost reimbursed when the flight lands after 18:00 local time, USD
  travel_min_one_way_distance_miles: Minimum distance from the buyer's residential ZIP to the hub for travel reimbursement, integer miles
  travel_receipt_submission_days: Calendar days after the completed pickup within which travel receipts must be submitted, integer days
  travel_reimbursement_business_days: Business days after an accepted receipt within which the reimbursement is paid, integer business days
  delivery_fee_refundable_on_return: Whether the delivery fee is refunded when the vehicle is returned under the 7-day return, boolean
  delivery_fee_refundable_on_cancellation: Whether a paid delivery fee is refunded when the order is cancelled before handover, boolean
  delivery_fee_refundable_on_refusal_without_cause: Whether the delivery fee is refunded when the buyer refuses the vehicle at handover for a reason not on the accepted refusal list, boolean
  fee_refund_business_days: Business days within which a refunded delivery fee is returned to the original card, integer business days
  accepted_refusal_reasons: Condition-report findings that let the buyer refuse the vehicle at handover as vehicle unavailable, list of condition_finding values
  damage_report_window_hours: Hours after handover within which new damage must be reported to be treated as transport damage, integer hours
  transport_damage_repair_cap_usd: Maximum repair cost Kestrel covers for reported transport damage, USD
  id_check_required: Whether a government photo ID matching the buyer is checked at handover, boolean
  all_buyers_present_required: Whether every buyer named on the purchase agreement must be present at handover, boolean
  contactless_handover_allowed: Whether handover may be completed without staff contact, boolean
  handover_test_drive_max_miles: Maximum test-drive distance at handover before acceptance (0 = no test drive), integer miles
  trade_in_collection_at_appointment: Whether a trade-in vehicle may be collected at the same appointment, boolean
  address_change_cutoff_hours: Hours before the window start after which the delivery address can no longer be changed (0 = not a delivery method), integer hours
  address_change_max_distance_miles: Maximum distance between the original and new delivery address for a change without re-quoting the fee, integer miles
  condition_report_required: Whether a signed condition report with odometer is completed at handover, boolean
  pickup_hold_coin_valid_hours: Hours a pickup token or hub check-in code stays valid after the window start, integer hours

