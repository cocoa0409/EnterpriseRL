events:
  - type: delivery_scheduled
    target: delivery_orders
    mutation: create
    meaning: "A handover appointment is booked for a signed purchase order."
    grain: "one row per appointment booked"
    fields:
      customer_id: "buyer"
      purchase_order_id: "order the vehicle is handed over for"
      variant_name: "fulfillment method"
      delivery_zip: "delivery ZIP, or the hub ZIP for pickups"
      distance_miles: "distance from the hub (0 for pickups)"
      scheduled_date: "appointment date"
      original_scheduled_date: "same as scheduled_date at booking"
      time_window: "appointment window"
    triggers:
      - event: delivery:delivery_fee_charged
        map: {fee_type: delivery_fee, appointment_date: scheduled_date}
  - type: delivery_rescheduled
    target: delivery_orders
    mutation: update
    meaning: "The customer moves a booked appointment to another date or window."
    grain: "one row per reschedule"
    fields:
      scheduled_date: "new appointment date"
      time_window: "new window"
      reschedule_count: "incremented by one unless the reschedule is weather-forced"
    triggers: []
  - type: delivery_address_changed
    target: delivery_orders
    mutation: update
    meaning: "The delivery address of a booked home delivery is changed."
    grain: "one row per address change"
    fields:
      delivery_zip: "new delivery ZIP"
      distance_miles: "distance from the hub to the new address"
    triggers: []
  - type: delivery_dispatched
    target: delivery_orders
    mutation: {transition: {from: scheduled, to: dispatched}}
    meaning: "The vehicle leaves for the delivery or is staged for pickup."
    grain: "one row per dispatch"
    fields:
      status: "scheduled -> dispatched"
    triggers: []
  - type: delivery_completed
    target: delivery_orders
    mutation: {transition: {from: dispatched, to: completed}}
    meaning: "The buyer accepts the vehicle."
    grain: "one row per completed appointment"
    fields:
      status: "dispatched -> completed"
      completed_date: "handover date"
      closed_date: "handover date"
    triggers:
      - event: purchase:purchase_vehicle_handed_over
        map: {}
      - event: delivery:delivery_condition_reported
        map: {}
  - type: delivery_attempt_missed
    target: delivery_orders
    mutation: {transition: {from: dispatched, to: missed}}
    meaning: "The handover does not happen in the booked window."
    grain: "one row per missed attempt"
    fields:
      status: "dispatched -> missed"
      last_miss_cause: "customer_unavailable, kestrel_late, vehicle_not_ready or severe_weather"
      customer_miss_count: "incremented by one when the cause is customer_unavailable"
    triggers:
      - event: delivery:delivery_fee_charged
        when: {last_miss_cause: customer_unavailable}
        map: {fee_type: missed_appointment_fee}
  - type: delivery_rebooked
    target: delivery_orders
    mutation: {transition: {from: missed, to: scheduled}}
    meaning: "A missed appointment is given a new date and window."
    grain: "one row per rebooking"
    fields:
      status: "missed -> scheduled"
      scheduled_date: "rebooked date"
      time_window: "rebooked window"
    triggers: []
  - type: delivery_refused
    target: delivery_orders
    mutation: {transition: {from: dispatched, to: refused}}
    meaning: "The buyer declines the vehicle at handover."
    grain: "one row per refusal"
    fields:
      status: "dispatched -> refused"
      closed_date: "date of refusal"
    triggers:
      - event: purchase:purchase_order_cancelled
        map: {}
  - type: delivery_cancelled
    target: delivery_orders
    mutation: {transition: [{from: scheduled, to: cancelled}, {from: missed, to: cancelled}]}
    meaning: "The appointment is cancelled without a handover."
    grain: "one row per cancellation"
    fields:
      status: "scheduled or missed -> cancelled"
      closed_date: "date of cancellation"
    triggers: []

  - type: delivery_fee_charged
    target: delivery_charges
    meaning: "A delivery, reschedule or missed-appointment fee is billed on the appointment."
    grain: "one row per fee per appointment date"
    distinguish_by: [fee_type, appointment_date, txn_date]
    fields:
      txn_date: "billing date"
      amount: "fee amount"
      fee_type: "delivery_fee, reschedule_fee or missed_appointment_fee"
      appointment_date: "appointment date the fee relates to"
    account: delivery_fees_due
    direction: in
    triggers: []
  - type: delivery_fee_settled
    target: delivery_charges
    meaning: "A billed fee is paid, waived or refunded."
    grain: "one row per settlement of one fee"
    distinguish_by: [source_txn_id, settlement_type]
    fields:
      txn_date: "settlement date"
      amount: "amount settled (the fee amount)"
      fee_type: "fee type of the fee settled"
      settlement_type: "paid, waived or refunded"
      source_txn_id: "the fee entry settled"
    account: delivery_fees_due
    direction: out
    triggers: []
  - type: delivery_travel_reimbursed
    target: delivery_charges
    meaning: "A Fly & Drive travel cost is reimbursed to the buyer."
    grain: "one row per reimbursed receipt"
    distinguish_by: [reimbursement_type, receipt_number]
    fields:
      txn_date: "reimbursement date"
      amount: "amount reimbursed"
      reimbursement_type: "airfare, rideshare or hotel"
      receipt_number: "booking or receipt reference"
    triggers: []
  - type: delivery_condition_reported
    target: delivery_charges
    meaning: "A condition finding is recorded at handover or reported within the damage report window."
    grain: "one row per finding per report date"
    distinguish_by: [condition_finding, txn_date]
    fields:
      txn_date: "date of the report"
      amount: "0.00, or the repair estimate for reported transport damage"
      condition_finding: "finding"
      appointment_date: "appointment date the report concerns"
    triggers: []

measures:
  - id: delivery_msr_open_appointments_for_order
    window: "current state at the moment of the request"
    measure: "count of delivery_orders of the purchase order whose status is scheduled, dispatched or missed"
  - id: delivery_msr_travel_reimbursed
    window: "life of the appointment"
    measure: "sum of amount over delivery_travel_reimbursed entries of the appointment, per reimbursement_type"

policies:
  - id: delivery_agg_multi_holding
    subject: [delivery_scheduled]
    rule: >-
      A customer may hold any number of appointments over time, one per purchase order handover; how many may
      be open per order and per window is governed by delivery_agg_open_per_order.
    eligibility: []
    params:
      max_per_customer: null

  - id: delivery_agg_open_per_order
    subject: [delivery_scheduled]
    rule: >-
      A purchase order may have only one open appointment, counted by delivery_msr_open_appointments_for_order
      over appointments in scheduled, dispatched or missed. A new appointment is booked only when the order has
      no open appointment. Across the customer's orders, the customer may hold no more than the method's
      maximum orders per window on the same date and window; buying two vehicles therefore needs two windows
      unless the method allows two.
    eligibility:
      - id: one_open_per_order
        applies_to: [delivery_scheduled]
        kind: dedup
        condition: "A new appointment is booked only when the order has no open appointment."
        evidence_fields: [delivery_orders.purchase_order_id, delivery_orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_orders.purchase_order_id]
          action_bindings:
            delivery_orders.purchase_order_id: purchase_order_id
        dedup_contract:
          table: delivery_orders
          mode: separate_record
          object_bindings: {purchase_order_id: purchase_order_id}
          duplicate_filters: {status: [scheduled, dispatched, missed]}
          distinct_fields: []
    measures: [delivery_msr_open_appointments_for_order]

  - id: delivery_scheduling
    subject: [delivery_scheduled, delivery_fee_charged]
    rule: >-
      An appointment is booked only for a purchase order whose status is contracted. The method must serve the
      distance: home delivery methods serve distances up to their service radius, Enclosed White-Glove only
      serves orders in the purchase programs listed in its entry gate, and Fly & Drive requires the buyer's
      residential ZIP to be at least the method's minimum one-way distance from the hub. The appointment date is
      at least the method's minimum scheduling lead days after the purchase agreement signing date and no more
      than its maximum scheduling horizon days after the booking date, falls on one of the method's
      appointment days and not on a holiday closure, and uses one of the method's windows. The delivery fee is
      the method's base fee plus the per-mile fee for each mile of distance beyond the included radius, capped
      at the method's delivery fee cap, rounded to the cent; it is billed once when the appointment is booked
      and is zero for an exchange replacement when the method waives exchange delivery fees. A rebooking does
      not bill the delivery fee again. Fees are billed only on an appointment whose status is scheduled or
      missed.
    eligibility:
      - id: order_signed
        applies_to: [delivery_scheduled]
        kind: authorization
        condition: "An appointment is booked only for a purchase order whose status is contracted."
        evidence_fields: [purchase_orders.status, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
      - id: fee_state
        applies_to: [delivery_fee_charged]
        kind: state
        condition: "Fees are billed only on an appointment whose status is scheduled or missed."
        evidence_fields: [delivery_orders.status, delivery_orders.delivery_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_orders.delivery_order_id]
          action_bindings:
            delivery_orders.delivery_order_id: delivery_order_id
        state_contract:
          field: delivery_orders.status
          allowed: [scheduled, missed]
    params:
      per_tier:
        Kestrel Hub Pickup: {base_delivery_fee_usd: "=base_delivery_fee_usd", included_radius_miles: "=included_radius_miles", per_mile_fee_beyond_radius_usd: "=per_mile_fee_beyond_radius_usd", delivery_fee_cap_usd: "=delivery_fee_cap_usd"}
        Kestrel Vending Tower Pickup: {base_delivery_fee_usd: "=base_delivery_fee_usd", included_radius_miles: "=included_radius_miles", per_mile_fee_beyond_radius_usd: "=per_mile_fee_beyond_radius_usd", delivery_fee_cap_usd: "=delivery_fee_cap_usd"}
        Kestrel Fly & Drive: {base_delivery_fee_usd: "=base_delivery_fee_usd", included_radius_miles: "=included_radius_miles", per_mile_fee_beyond_radius_usd: "=per_mile_fee_beyond_radius_usd", delivery_fee_cap_usd: "=delivery_fee_cap_usd"}
        Kestrel Local Home Delivery: {base_delivery_fee_usd: "=base_delivery_fee_usd", included_radius_miles: "=included_radius_miles", per_mile_fee_beyond_radius_usd: "=per_mile_fee_beyond_radius_usd", delivery_fee_cap_usd: "=delivery_fee_cap_usd"}
        Kestrel Extended-Zone Delivery: {base_delivery_fee_usd: "=base_delivery_fee_usd", included_radius_miles: "=included_radius_miles", per_mile_fee_beyond_radius_usd: "=per_mile_fee_beyond_radius_usd", delivery_fee_cap_usd: "=delivery_fee_cap_usd"}
        Kestrel Enclosed White-Glove Delivery: {base_delivery_fee_usd: "=base_delivery_fee_usd", included_radius_miles: "=included_radius_miles", per_mile_fee_beyond_radius_usd: "=per_mile_fee_beyond_radius_usd", delivery_fee_cap_usd: "=delivery_fee_cap_usd"}
    formula:
      delivery_fee: "round(min(base_delivery_fee_usd + max(0, distance_miles - included_radius_miles) * per_mile_fee_beyond_radius_usd, delivery_fee_cap_usd), 2)"

  - id: delivery_reschedule
    subject: [delivery_rescheduled, delivery_fee_charged]
    rule: >-
      A customer may move a booked appointment. An appointment is rescheduled only while its status is
      scheduled. The reschedule is requested no later than the method's reschedule notice hours before the
      start of the booked window. Notice hours are counted backwards in full elapsed hours from the window start
      time on the scheduled date, in the delivery address's local time. A request inside the notice period is not a reschedule: the customer either
      keeps the appointment or it is treated as a customer-caused miss when nobody is present. The first
      reschedules up to the method's free reschedules cost nothing; each later one bills the method's
      reschedule fee as its own fee entry for the new appointment date, and no reschedule is accepted once
      reschedule_count has reached the method's maximum total reschedules. A reschedule forced by a severe-weather
      advisory for the delivery area is free and is not counted when the method's weather switch is true. A
      move made by Kestrel is never a customer reschedule. The new date must meet the same lead, horizon,
      day-of-week, holiday and window rules as a booking.
    eligibility:
      - id: scheduled_only
        applies_to: [delivery_rescheduled]
        kind: state
        condition: "An appointment is rescheduled only while its status is scheduled."
        evidence_fields: [delivery_orders.status, delivery_orders.delivery_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_orders.delivery_order_id]
          action_bindings:
            delivery_orders.delivery_order_id: delivery_order_id
        state_contract:
          field: delivery_orders.status
          allowed: [scheduled]
      - id: notice_period
        applies_to: [delivery_rescheduled]
        kind: time
        condition: "The reschedule is requested no later than the method's reschedule notice hours before the start of the booked window."
        evidence_fields: [delivery_orders.scheduled_date, delivery_orders.time_window, delivery_orders.delivery_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_orders.delivery_order_id]
          action_bindings:
            delivery_orders.delivery_order_id: delivery_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the start of the booked window"
          anchor_source: delivery_orders.scheduled_date
          relation: not_after
          duration_source: variants.reschedule_notice_hours
          unit: elapsed_hours
          counting_rule: "Notice hours are counted backwards in full elapsed hours from the window start time on the scheduled date, in the delivery address's local time."
          boundary: inclusive
    params:
      per_tier:
        Kestrel Hub Pickup: {free_reschedules: "=free_reschedules", reschedule_fee_usd: "=reschedule_fee_usd", max_total_reschedules: "=max_total_reschedules"}
        Kestrel Vending Tower Pickup: {free_reschedules: "=free_reschedules", reschedule_fee_usd: "=reschedule_fee_usd", max_total_reschedules: "=max_total_reschedules"}
        Kestrel Fly & Drive: {free_reschedules: "=free_reschedules", reschedule_fee_usd: "=reschedule_fee_usd", max_total_reschedules: "=max_total_reschedules"}
        Kestrel Local Home Delivery: {free_reschedules: "=free_reschedules", reschedule_fee_usd: "=reschedule_fee_usd", max_total_reschedules: "=max_total_reschedules"}
        Kestrel Extended-Zone Delivery: {free_reschedules: "=free_reschedules", reschedule_fee_usd: "=reschedule_fee_usd", max_total_reschedules: "=max_total_reschedules"}
        Kestrel Enclosed White-Glove Delivery: {free_reschedules: "=free_reschedules", reschedule_fee_usd: "=reschedule_fee_usd", max_total_reschedules: "=max_total_reschedules"}

  - id: delivery_missed_attempts
    subject: [delivery_attempt_missed, delivery_rebooked, delivery_cancelled]
    rule: >-
      An attempt is marked missed for customer unavailability when nobody authorized to accept the vehicle is
      present within the method's customer wait minutes after the window start; this bills the method's
      missed-appointment fee and counts toward the customer miss count. An arrival more than the method's
      Kestrel late threshold minutes after the window end that the customer declines to wait for is a Kestrel
      late miss; a vehicle that fails its pre-handover check is a vehicle-not-ready miss; a severe-weather
      advisory miss is neither party's fault. After a Kestrel late or vehicle-not-ready miss, Kestrel offers a
      new date within the method's Kestrel miss rebook days and, when the method's waiver switch is true, waives
      every reschedule or missed-appointment fee still unpaid on the appointment. A customer-caused miss is
      rebooked no earlier than the method's missed rebook lead days after the miss. Once the customer miss count
      reaches the method's maximum customer misses the appointment is not rebooked: it is cancelled and the
      purchase order is cancelled as customer_cancelled. For pickups the vehicle stays held at the hub for the
      method's hold days after a miss. When Kestrel-caused rebooking moves the appointment more than the
      method's delay cancellation threshold days past the original scheduled date, the buyer may cancel the
      purchase order as vehicle_unavailable.
    eligibility: []
    params:
      per_tier:
        Kestrel Hub Pickup: {missed_appointment_fee_usd: "=missed_appointment_fee_usd", max_customer_misses: "=max_customer_misses", customer_wait_minutes: "=customer_wait_minutes"}
        Kestrel Vending Tower Pickup: {missed_appointment_fee_usd: "=missed_appointment_fee_usd", max_customer_misses: "=max_customer_misses", customer_wait_minutes: "=customer_wait_minutes"}
        Kestrel Fly & Drive: {missed_appointment_fee_usd: "=missed_appointment_fee_usd", max_customer_misses: "=max_customer_misses", customer_wait_minutes: "=customer_wait_minutes"}
        Kestrel Local Home Delivery: {missed_appointment_fee_usd: "=missed_appointment_fee_usd", max_customer_misses: "=max_customer_misses", customer_wait_minutes: "=customer_wait_minutes"}
        Kestrel Extended-Zone Delivery: {missed_appointment_fee_usd: "=missed_appointment_fee_usd", max_customer_misses: "=max_customer_misses", customer_wait_minutes: "=customer_wait_minutes"}
        Kestrel Enclosed White-Glove Delivery: {missed_appointment_fee_usd: "=missed_appointment_fee_usd", max_customer_misses: "=max_customer_misses", customer_wait_minutes: "=customer_wait_minutes"}

  - id: delivery_handover
    subject: [delivery_completed, delivery_dispatched]
    rule: >-
      An appointment is dispatched only when the purchase order is ready for handover under the purchase
      handover rules. At handover the buyer shows a government photo ID when the method requires it, every buyer
      named on the agreement is present when required, a test drive of up to the method's test drive maximum
      miles may be taken before acceptance, and the condition report with odometer is signed when required. A
      contactless handover is possible only where the method allows it. A trade-in vehicle may be collected at
      the same appointment only where the method allows it. Completing the appointment records the handover on
      the purchase order.
    eligibility: []

  - id: delivery_refusal
    subject: [delivery_refused, delivery_condition_reported]
    rule: >-
      The buyer may refuse the vehicle at handover. A refusal is for cause when the condition report records one
      of the method's accepted refusal reasons (for odometer variance, only when the variance exceeds the
      purchase program's handover odometer tolerance); the purchase order is then cancelled as
      vehicle_unavailable and every delivery fee is refunded. Any other refusal cancels the purchase order as
      customer_cancelled, and the delivery fee is refunded only when the method's refusal-without-cause switch
      is true. New damage noticed after handover is transport damage when it is reported within the method's
      damage report window hours after handover; Kestrel then repairs it at no cost up to the method's
      transport damage repair cap, and above that cap the buyer's remedy is the 7-day return.
    eligibility: []
    params:
      per_tier:
        Kestrel Hub Pickup: {damage_report_window_hours: "=damage_report_window_hours", transport_damage_repair_cap_usd: "=transport_damage_repair_cap_usd"}
        Kestrel Vending Tower Pickup: {damage_report_window_hours: "=damage_report_window_hours", transport_damage_repair_cap_usd: "=transport_damage_repair_cap_usd"}
        Kestrel Fly & Drive: {damage_report_window_hours: "=damage_report_window_hours", transport_damage_repair_cap_usd: "=transport_damage_repair_cap_usd"}
        Kestrel Local Home Delivery: {damage_report_window_hours: "=damage_report_window_hours", transport_damage_repair_cap_usd: "=transport_damage_repair_cap_usd"}
        Kestrel Extended-Zone Delivery: {damage_report_window_hours: "=damage_report_window_hours", transport_damage_repair_cap_usd: "=transport_damage_repair_cap_usd"}
        Kestrel Enclosed White-Glove Delivery: {damage_report_window_hours: "=damage_report_window_hours", transport_damage_repair_cap_usd: "=transport_damage_repair_cap_usd"}

  - id: delivery_fee_settlement
    subject: [delivery_fee_settled]
    rule: >-
      Each billed fee is settled once, as paid when the customer pays it, as waived when a waiver in this charter
      applies (a Kestrel-caused miss, a weather-forced reschedule billed in error, an exchange delivery fee the
      method waives), or as refunded when a paid fee becomes refundable. Each fee entry is settled once. A paid
      delivery fee is refunded when the purchase order is cancelled before handover and the method's
      cancellation switch is true, or when the vehicle is returned under the 7-day return and the method's return
      switch is true; reschedule and missed-appointment fees that were paid are never refunded. Refunds go to the
      original card within the method's fee refund business days. A fee is never waived on request without one
      of these grounds.
    eligibility:
      - id: settle_once
        applies_to: [delivery_fee_settled]
        kind: dedup
        condition: "Each fee entry is settled once."
        evidence_fields: [delivery_charges.source_txn_id, delivery_charges.delivery_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_charges.source_txn_id]
          action_bindings:
            delivery_charges.source_txn_id: source_txn_id
        dedup_contract:
          table: delivery_charges
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [delivery_fee_settled]}
          distinct_fields: [settlement_type]
    params:
      per_tier:
        Kestrel Hub Pickup: {delivery_fee_refundable_on_return: "=delivery_fee_refundable_on_return", delivery_fee_refundable_on_cancellation: "=delivery_fee_refundable_on_cancellation"}
        Kestrel Vending Tower Pickup: {delivery_fee_refundable_on_return: "=delivery_fee_refundable_on_return", delivery_fee_refundable_on_cancellation: "=delivery_fee_refundable_on_cancellation"}
        Kestrel Fly & Drive: {delivery_fee_refundable_on_return: "=delivery_fee_refundable_on_return", delivery_fee_refundable_on_cancellation: "=delivery_fee_refundable_on_cancellation"}
        Kestrel Local Home Delivery: {delivery_fee_refundable_on_return: "=delivery_fee_refundable_on_return", delivery_fee_refundable_on_cancellation: "=delivery_fee_refundable_on_cancellation"}
        Kestrel Extended-Zone Delivery: {delivery_fee_refundable_on_return: "=delivery_fee_refundable_on_return", delivery_fee_refundable_on_cancellation: "=delivery_fee_refundable_on_cancellation"}
        Kestrel Enclosed White-Glove Delivery: {delivery_fee_refundable_on_return: "=delivery_fee_refundable_on_return", delivery_fee_refundable_on_cancellation: "=delivery_fee_refundable_on_cancellation"}

  - id: delivery_travel_reimbursement
    subject: [delivery_travel_reimbursed]
    rule: >-
      Fly & Drive buyers are reimbursed for travel to the hub: one-way airfare up to the method's airfare cap,
      airport-to-hub rideshare up to the rideshare cap, and one hotel night up to the hotel cap when the flight
      landed after 18:00 local time. Travel is reimbursed only after the pickup is completed. Receipts must be
      submitted within the method's travel receipt submission days after the completed pickup date, and each
      receipt is reimbursed once; for each reimbursement type the total reimbursed on the appointment, counted
      by delivery_msr_travel_reimbursed, may not exceed that type's cap. A refused or cancelled pickup earns no
      reimbursement. Payment is made within the method's travel reimbursement business days.
    eligibility:
      - id: pickup_completed
        applies_to: [delivery_travel_reimbursed]
        kind: state
        condition: "Travel is reimbursed only after the pickup is completed."
        evidence_fields: [delivery_orders.status, delivery_orders.delivery_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_orders.delivery_order_id]
          action_bindings:
            delivery_orders.delivery_order_id: delivery_order_id
        state_contract:
          field: delivery_orders.status
          allowed: [completed]
    params:
      per_tier:
        Kestrel Hub Pickup: {airfare_reimbursement_cap_usd: "=airfare_reimbursement_cap_usd", rideshare_reimbursement_cap_usd: "=rideshare_reimbursement_cap_usd", hotel_reimbursement_cap_usd: "=hotel_reimbursement_cap_usd"}
        Kestrel Vending Tower Pickup: {airfare_reimbursement_cap_usd: "=airfare_reimbursement_cap_usd", rideshare_reimbursement_cap_usd: "=rideshare_reimbursement_cap_usd", hotel_reimbursement_cap_usd: "=hotel_reimbursement_cap_usd"}
        Kestrel Fly & Drive: {airfare_reimbursement_cap_usd: "=airfare_reimbursement_cap_usd", rideshare_reimbursement_cap_usd: "=rideshare_reimbursement_cap_usd", hotel_reimbursement_cap_usd: "=hotel_reimbursement_cap_usd"}
        Kestrel Local Home Delivery: {airfare_reimbursement_cap_usd: "=airfare_reimbursement_cap_usd", rideshare_reimbursement_cap_usd: "=rideshare_reimbursement_cap_usd", hotel_reimbursement_cap_usd: "=hotel_reimbursement_cap_usd"}
        Kestrel Extended-Zone Delivery: {airfare_reimbursement_cap_usd: "=airfare_reimbursement_cap_usd", rideshare_reimbursement_cap_usd: "=rideshare_reimbursement_cap_usd", hotel_reimbursement_cap_usd: "=hotel_reimbursement_cap_usd"}
        Kestrel Enclosed White-Glove Delivery: {airfare_reimbursement_cap_usd: "=airfare_reimbursement_cap_usd", rideshare_reimbursement_cap_usd: "=rideshare_reimbursement_cap_usd", hotel_reimbursement_cap_usd: "=hotel_reimbursement_cap_usd"}
    measures: [delivery_msr_travel_reimbursed]

  - id: delivery_address_change
    subject: [delivery_address_changed]
    rule: >-
      The delivery address of a home delivery may be changed while the appointment is scheduled. An address is
      changed only while the appointment status is scheduled. The change is accepted no later than the method's
      address change cutoff hours before the window start and only when the new address is no more than the
      method's address change maximum distance from the original address and still inside the method's service
      radius; any other change is handled as a cancellation of the appointment and a new booking. Pickup methods
      have no delivery address to change.
    eligibility:
      - id: address_change_state
        applies_to: [delivery_address_changed]
        kind: state
        condition: "An address is changed only while the appointment status is scheduled."
        evidence_fields: [delivery_orders.status, delivery_orders.delivery_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_orders.delivery_order_id]
          action_bindings:
            delivery_orders.delivery_order_id: delivery_order_id
        state_contract:
          field: delivery_orders.status
          allowed: [scheduled]
