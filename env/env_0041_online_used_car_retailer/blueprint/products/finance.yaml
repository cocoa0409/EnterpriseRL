# Product charter: Kestrel Auto Finance Retail Installment Contracts. Generated by erl-scenario-blueprint.
# One holding = one credit approval and, once signed, the simple-interest retail installment contract that
# finances one Kestrel purchase order, serviced through payoff or unwind.

category: finance
display_name: Kestrel Auto Finance Retail Installment Contracts

binding:
  holding_table: finance_contracts
  event_tables: [finance_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_balance: principal_balance, fees_due: fees_due}

lifecycle:
  states: [approved, active, paid_off, unwound, withdrawn, expired]
  transitions:
    - {from: approved, to: active, by: user, means: "The borrower e-signs the retail installment contract together with the purchase agreement; the contract is funded."}
    - {from: approved, to: withdrawn, by: user, means: "The borrower declines the approval or the purchase it was for is cancelled before signing."}
    - {from: approved, to: expired, by: system, means: "The approval validity period ends unsigned."}
    - {from: active, to: paid_off, by: system, means: "A payoff payment brings principal, accrued interest and fees to zero."}
    - {from: active, to: unwound, by: agent, means: "The contract is rescinded because the financed vehicle was returned under the 7-day return or the purchase was cancelled before handover."}

accounts:
  - key: principal_balance
    unit: USD
    meaning: "Unpaid principal of the contract: raised by funding and by returned payments, lowered by the principal portion of payments and by principal credits."
  - key: fees_due
    unit: USD
    meaning: "Late, returned-payment, agent-assisted payment and deferral fees assessed and not yet paid or waived."

parameter_schema:
  min_credit_score: Minimum credit score for the tier, integer score
  apr_by_term: Contract APR by term in months before any autopay reduction, mapping term -> percent
  terms_offered: Terms that may be written at the tier, list of months
  older_vehicle_age_years: Model age (contract calendar year minus model year) at or above which the older-vehicle term limit applies, integer years
  max_term_months_older_vehicle: Longest term allowed on an older vehicle, integer months
  max_vehicle_odometer_miles: Highest odometer at contract that can be financed, integer miles
  max_ltv_pct: Maximum amount financed as a percentage of the vehicle price, percent
  max_pti_pct: Maximum monthly payment as a percentage of verified gross monthly income, percent
  max_dti_pct: Maximum total monthly debt, the new payment included, as a percentage of verified gross monthly income, percent
  min_monthly_income_usd: Minimum verified gross monthly income, USD
  min_down_payment_pct: Minimum down payment as a percentage of the vehicle price, percent
  min_down_payment_usd: Minimum down payment in dollars; the larger of this and the percentage applies, USD
  min_amount_financed_usd: Smallest amount that can be financed, USD
  max_amount_financed_usd: Largest amount that can be financed on one contract, USD
  max_backend_pct: Maximum financed service contracts, GAP and maintenance plans together as a percentage of the vehicle price, percent
  max_negative_equity_usd: Maximum trade-in negative equity that can be included in the amount financed, USD
  max_aggregate_exposure_usd: Maximum combined principal of the customer's active Kestrel Auto Finance contracts including the new one, USD
  max_active_contracts: Maximum active Kestrel Auto Finance contracts per customer including the new one, integer count
  approval_validity_days: Calendar days after the decision date during which the approval can be signed (decision date = day 0), integer days
  proof_of_income_required: Whether pay stubs or bank statements must be verified before signing, boolean
  proof_of_residence_required: Whether a utility bill or lease matching the application address must be verified before signing, boolean
  references_required: Personal references that must be verified before signing, integer count
  first_payment_min_days: Minimum calendar days from contract date to first due date, integer days
  first_payment_max_days: Maximum calendar days from contract date to first due date, integer days
  interest_day_count_basis: Days per year used for daily simple interest, integer days
  autopay_apr_reduction_pct: APR reduction while autopay is enrolled, percentage points
  payment_cutoff_time: Local time (Mountain Time) after which a payment posts on the next business day, HH:MM
  agent_assisted_payment_fee_usd: Fee for a one-time payment taken by a representative by phone, USD
  max_debit_card_payment_usd: Maximum single debit card payment, USD
  max_debit_card_payments_per_month: Maximum debit card payments per calendar month, integer count
  principal_only_payment_allowed: Whether a payment may be designated principal-only, boolean
  payment_grace_days: Calendar days after a due date before a late fee is assessed on an unpaid installment, integer days
  late_fee_pct: Late fee as a percentage of the monthly payment, percent
  late_fee_min_usd: Minimum late fee, USD
  late_fee_max_usd: Maximum late fee, USD
  late_fee_waivers_per_12_months: Goodwill late fee waivers allowed in any rolling 12 months, integer count
  returned_payment_fee_usd: Fee when a payment is returned unpaid by the customer's bank, USD
  deferral_max_per_12_months: Payment deferrals allowed in any rolling 12 months, integer count
  deferral_max_lifetime: Payment deferrals allowed over the life of the contract, integer count
  deferral_min_installments_paid: Scheduled installments that must have been paid before a first deferral, integer count
  deferral_max_days_past_due: Maximum days past due at the time of a deferral request, integer days
  deferral_fee_usd: Fee for each payment deferral, USD
  due_date_change_max_lifetime: Due-date changes allowed over the life of the contract, integer count
  due_date_change_max_shift_days: Maximum days a due day may move later in the month, integer days
  due_date_change_min_installments_paid: Scheduled installments that must have been paid before a due-date change, integer count
  payoff_quote_validity_days: Calendar days a payoff quote is good through, counted from the quote date as day 0, integer days
  lien_release_business_days: Business days after payoff within which the lien release is sent, integer business days
  payoff_overpayment_refund_business_days: Business days after payoff within which any overpayment is refunded to the customer, integer business days
  unwind_payment_refund_business_days: Business days after an unwind within which installments the customer paid are refunded, integer business days

