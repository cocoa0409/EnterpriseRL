# Product charter: Kestrel GAP Waiver addenda. Generated by erl-scenario-blueprint.
# One holding = one GAP waiver addendum on one Kestrel Auto Finance contract.

category: gap
display_name: Kestrel GAP Waiver

binding:
  holding_table: gap_waivers
  event_tables: [gap_transactions]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [active, claim_settled, terminated, cancelled, expired]
  transitions:
    - {from: active, to: claim_settled, by: system, means: "A GAP benefit is paid after a total loss or unrecovered theft."}
    - {from: active, to: terminated, by: system, means: "The finance contract is paid off early and the waiver ends."}
    - {from: active, to: cancelled, by: agent, means: "The waiver is cancelled at the borrower's request or because the finance contract was unwound."}
    - {from: active, to: expired, by: system, means: "The original maturity date passes."}

accounts: []

parameter_schema:
  waiver_price_usd: Price of the waiver included in the amount financed, USD
  max_ltv_covered_pct: Loan-to-value up to which the balance is covered; the share of the loan above it is not, percent of vehicle cash price
  deductible_coverage_usd: Part of the primary insurance deductible added to the benefit, USD
  max_benefit_usd: Maximum benefit per waiver, USD
  max_amount_financed_usd: Largest amount financed on which the waiver can be sold, USD
  max_term_months: Longest finance term the waiver can be sold on, integer months
  max_vehicle_age_years: Maximum model age at sale, integer years
  negative_equity_covered: Whether loan balance from rolled-in trade-in negative equity is covered, boolean
  backend_products_covered: Whether loan balance from financed service contracts and maintenance plans is covered, boolean
  primary_insurance_required: Whether physical damage insurance must have been in force at the loss date, boolean
  max_primary_deductible_recognized_usd: Largest primary deductible recognized when adding deductible coverage, USD
  claim_notice_days_after_loss: Calendar days after the loss date within which the claim must be filed (loss date = day 0), integer days
  claim_documents_due_days: Calendar days after filing within which every required document must arrive, integer days
  required_claim_documents: Documents required for every claim (theft claims also need a police report), list of document_type values
  police_report_required_for_theft: Whether a theft claim requires a police report, boolean
  theft_recovery_wait_days: Calendar days after a theft before an unrecovered vehicle is treated as a loss, integer days
  benefit_exclusions: Amounts deducted from the payoff before the benefit is computed, list
  prior_damage_deduction_covered: Whether insurer deductions for unrepaired prior damage are covered, boolean
  benefit_payment_business_days: Business days after approval within which the benefit is paid to the lienholder, integer business days
  claim_reconsideration_days: Calendar days after a denial within which new documents can reopen the decision, integer days
  max_claims_per_waiver: Benefits payable per waiver, integer count
  loss_before_sale_excluded: Whether a loss dated before the waiver sale date is denied, boolean
  free_look_days: Calendar days after the sale date within which cancellation is refunded in full (sale date = day 0), integer days
  cancellation_fee_usd: Fee deducted from a pro-rata cancellation refund, USD
  refund_method: How a cancellation refund is computed after the free look
  flat_cancel_reasons: Reasons refunded in full with no fee, list
  refund_to_lienholder_when_active: Whether the refund goes to the lienholder while the finance contract is active, boolean
  refund_business_days: Business days after cancellation or a payoff refund request within which the refund is issued, integer business days
  payoff_refund_on_request: Whether a waiver ended by early payoff is refunded pro rata when the borrower asks, boolean
  payoff_refund_request_days: Calendar days after payoff within which the pro-rata refund can be requested, integer days
  min_refund_usd: Computed refunds below this are not issued, USD
  commercial_use_excluded: Whether losses on vehicles in commercial use are excluded, boolean
  waiver_financed_required: Whether the waiver must be included in the amount financed, boolean
  kestrel_finance_only: Whether the waiver is sold only on Kestrel Auto Finance contracts, boolean
  one_waiver_per_contract: Whether a finance contract may carry only one waiver, boolean
  transfer_allowed: Whether the waiver can be transferred, boolean
  term_matches_contract: Whether the waiver term equals the finance term at sale, boolean
  coverage_starts_on_contract_date: Whether coverage starts on the finance contract date, boolean
  deductible_proof_required: Whether proof of the primary deductible is required to add deductible coverage, boolean
  settlement_letter_must_show_acv: Whether the insurer letter must state the actual cash value and deductions, boolean
  ltv_basis: Price the loan-to-value is measured against
  benefit_payee: Who receives the benefit
  surplus_to_borrower: Whether any benefit above the remaining balance is paid to the borrower, boolean
  sale_with_contract_only: Whether the waiver is sold only at finance contract signing, boolean
  extended_term_after_deferral_covered: Whether installments moved past the original maturity by deferral stay covered, boolean
  claim_status_on_settlement: Status the waiver takes once a benefit is paid
  max_deferrals_covered: Deferred installments whose balance is still covered (above this they are excluded), integer count
  expiry_basis: Event ending the waiver by time

