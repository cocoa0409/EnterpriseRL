events:
  - type: gap_waiver_sold
    target: gap_waivers
    mutation: create
    meaning: "A GAP waiver addendum is signed with a Kestrel Auto Finance contract."
    grain: "one row per waiver"
    fields:
      customer_id: "borrower"
      finance_contract_id: "finance contract"
      variant_name: "waiver"
      waiver_price: "price included in the amount financed"
      sale_date: "finance contract date"
      term_months: "finance term"
      vehicle_cash_price: "cash price on the contract"
      amount_financed_at_sale: "amount financed"
    triggers: []
  - type: gap_waiver_claim_settled
    target: gap_waivers
    mutation: {transition: {from: active, to: claim_settled}}
    meaning: "The benefit is paid and the waiver ends."
    grain: "one row per waiver"
    fields:
      status: "active -> claim_settled"
      closed_date: "benefit payment date"
    triggers: []
  - type: gap_waiver_terminated
    target: gap_waivers
    mutation: {transition: {from: active, to: terminated}}
    meaning: "The finance contract is paid off and the waiver ends."
    grain: "one row per waiver"
    fields:
      status: "active -> terminated"
      closed_date: "payoff date"
    triggers: []
  - type: gap_waiver_cancelled
    target: gap_waivers
    mutation: {transition: {from: active, to: cancelled}}
    meaning: "The waiver is cancelled."
    grain: "one row per waiver"
    fields:
      status: "active -> cancelled"
      closed_date: "cancellation date"
    triggers:
      - event: gap:gap_cancellation_refund_issued
        map: {}
  - type: gap_waiver_expired
    target: gap_waivers
    mutation: {transition: {from: active, to: expired}}
    meaning: "The waiver reaches the original maturity date."
    grain: "one row per waiver"
    fields:
      status: "active -> expired"
      closed_date: "original maturity date"
    triggers: []

  - type: gap_claim_filed
    target: gap_transactions
    meaning: "The borrower reports a total loss or unrecovered theft."
    grain: "one row per loss"
    distinguish_by: [loss_date]
    fields:
      txn_date: "filing date"
      amount: "0.00"
      loss_date: "date of loss"
      loss_type: "kind of loss"
    triggers: []
  - type: gap_claim_document_received
    target: gap_transactions
    meaning: "A claim document is received."
    grain: "one row per document per date"
    distinguish_by: [document_type, txn_date]
    fields:
      txn_date: "date received"
      amount: "0.00"
      document_type: "document"
    triggers: []
  - type: gap_claim_decided
    target: gap_transactions
    meaning: "The claim is approved with a benefit amount or denied."
    grain: "one row per decision"
    distinguish_by: [txn_date, claim_decision]
    fields:
      txn_date: "decision date"
      amount: "approved benefit, 0.00 when denied"
      loss_date: "date of loss"
      insurer_settlement: "insurer's actual cash value settlement"
      payoff_at_loss: "loan payoff as of the loss date"
      claim_decision: "approved or a denial code"
    triggers:
      - event: gap:gap_benefit_paid
        when: {claim_decision: approved}
        map: {amount: amount, source_txn_id: gap_txn_id}
  - type: gap_benefit_paid
    target: gap_transactions
    meaning: "The approved benefit is paid to the lienholder."
    grain: "one row per waiver"
    distinguish_by: [source_txn_id]
    fields:
      txn_date: "payment date"
      amount: "benefit paid"
      source_txn_id: "decision paid"
    triggers:
      - event: gap:gap_waiver_claim_settled
        map: {}
  - type: gap_cancellation_refund_issued
    target: gap_transactions
    meaning: "The refund of a cancelled or terminated waiver is issued."
    grain: "one row per waiver"
    distinguish_by: [txn_date]
    fields:
      txn_date: "refund date"
      amount: "refund"
      refund_payee: "customer or lienholder"
    triggers:
      - event: finance:finance_principal_credited
        when: {refund_payee: lienholder}
        map: {credit_source: gap_refund, amount: amount, txn_date: txn_date, linked_reference_id: gap_waiver_id}

measures:
  - id: gap_msr_documents_on_file
    window: "from the claim filing date up to the moment of the request"
    measure: "set of document_type values of gap_claim_document_received entries of the waiver"

policies:
  - id: gap_agg_multi_holding
    subject: [gap_waiver_sold]
    rule: >-
      A borrower may hold GAP waivers on several finance contracts; there is no limit per customer. Each finance
      contract may carry only one waiver, governed by gap_agg_one_per_contract.
    eligibility: []
    params:
      max_per_customer: null

  - id: gap_agg_one_per_contract
    subject: [gap_waiver_sold]
    rule: >-
      A waiver is sold only at the signing of a Kestrel Auto Finance contract, included in its amount financed,
      and a finance contract carries at most one waiver. Holding X changes Y: the finance tier's back-end limit
      counts the waiver price together with financed service contracts and maintenance plans.
    eligibility:
      - id: one_per_contract
        applies_to: [gap_waiver_sold]
        kind: dedup
        condition: "A waiver is sold only at the signing of a Kestrel Auto Finance contract, included in its amount financed, and a finance contract carries at most one waiver."
        evidence_fields: [gap_waivers.finance_contract_id, gap_waivers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gap_waivers.finance_contract_id]
          action_bindings:
            gap_waivers.finance_contract_id: finance_contract_id
        dedup_contract:
          table: gap_waivers
          mode: separate_record
          object_bindings: {finance_contract_id: finance_contract_id}
          duplicate_filters: {status: [active, claim_settled, terminated, expired]}
          distinct_fields: []

  - id: gap_sale_eligibility
    subject: [gap_waiver_sold]
    rule: >-
      A waiver is sold only when the amount financed is within the waiver's maximum amount financed, the finance term
      within its maximum term, the vehicle's model age within its maximum, and the loan-to-value at sale (amount
      financed over vehicle cash price) within the waiver's entry limit. Coverage starts on the finance contract date
      and runs to the original maturity date.
    eligibility: []
    params:
      per_tier:
        Kestrel GAP Essential: {max_amount_financed_usd: "=max_amount_financed_usd", max_term_months: "=max_term_months", max_vehicle_age_years: "=max_vehicle_age_years"}
        Kestrel GAP Standard: {max_amount_financed_usd: "=max_amount_financed_usd", max_term_months: "=max_term_months", max_vehicle_age_years: "=max_vehicle_age_years"}
        Kestrel GAP Plus: {max_amount_financed_usd: "=max_amount_financed_usd", max_term_months: "=max_term_months", max_vehicle_age_years: "=max_vehicle_age_years"}
        Kestrel GAP Premier: {max_amount_financed_usd: "=max_amount_financed_usd", max_term_months: "=max_term_months", max_vehicle_age_years: "=max_vehicle_age_years"}
        Kestrel GAP Premier Plus: {max_amount_financed_usd: "=max_amount_financed_usd", max_term_months: "=max_term_months", max_vehicle_age_years: "=max_vehicle_age_years"}
        Kestrel GAP Max: {max_amount_financed_usd: "=max_amount_financed_usd", max_term_months: "=max_term_months", max_vehicle_age_years: "=max_vehicle_age_years"}

  - id: gap_claim_intake
    subject: [gap_claim_filed, gap_claim_document_received]
    rule: >-
      A claim is filed only on a waiver whose status is active. The claim is filed within the claim notice days after
      the loss date; a theft is treated as a loss only when the vehicle has not been recovered within the theft
      recovery wait days, and a theft claim needs a police report. Every required claim document must arrive within
      the claim documents due days after filing, counted by gap_msr_documents_on_file; proof of the primary deductible
      is needed only for the deductible coverage. Only one loss is claimed per waiver.
    eligibility:
      - id: file_active
        applies_to: [gap_claim_filed, gap_claim_document_received]
        kind: state
        condition: "A claim is filed only on a waiver whose status is active."
        evidence_fields: [gap_waivers.status, gap_waivers.gap_waiver_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gap_waivers.gap_waiver_id]
          action_bindings:
            gap_waivers.gap_waiver_id: gap_waiver_id
        state_contract:
          field: gap_waivers.status
          allowed: [active]
    params:
      per_tier:
        Kestrel GAP Essential: {claim_notice_days_after_loss: "=claim_notice_days_after_loss", claim_documents_due_days: "=claim_documents_due_days"}
        Kestrel GAP Standard: {claim_notice_days_after_loss: "=claim_notice_days_after_loss", claim_documents_due_days: "=claim_documents_due_days"}
        Kestrel GAP Plus: {claim_notice_days_after_loss: "=claim_notice_days_after_loss", claim_documents_due_days: "=claim_documents_due_days"}
        Kestrel GAP Premier: {claim_notice_days_after_loss: "=claim_notice_days_after_loss", claim_documents_due_days: "=claim_documents_due_days"}
        Kestrel GAP Premier Plus: {claim_notice_days_after_loss: "=claim_notice_days_after_loss", claim_documents_due_days: "=claim_documents_due_days"}
        Kestrel GAP Max: {claim_notice_days_after_loss: "=claim_notice_days_after_loss", claim_documents_due_days: "=claim_documents_due_days"}
    measures: [gap_msr_documents_on_file]

  - id: gap_benefit
    subject: [gap_claim_decided, gap_benefit_paid, gap_waiver_claim_settled]
    rule: >-
      A claim is decided only on a waiver whose status is active. It is denied_no_primary_insurance when no physical
      damage insurance was in force at the loss, denied_loss_before_waiver when the loss date is before the sale
      date, and denied_late_filing when it was filed after the claim notice days. Otherwise the benefit is the payoff
      at the loss date less the insurer settlement and less the benefit exclusions (and less rolled-in negative
      equity or financed back-end products where the waiver does not cover them, and deferred installments beyond the
      covered number), multiplied by the covered share (the lesser of one and the waiver's maximum loan-to-value times
      the vehicle cash price over the amount financed at sale), plus the deductible coverage up to the recognized
      primary deductible; the benefit never exceeds the waiver's maximum benefit and is paid to the lienholder within
      the benefit payment business days. Paying the benefit settles the waiver. A denied claim can be reconsidered when
      new documents arrive within the reconsideration days.
    eligibility:
      - id: decide_active
        applies_to: [gap_claim_decided, gap_benefit_paid]
        kind: state
        condition: "A claim is decided only on a waiver whose status is active."
        evidence_fields: [gap_waivers.status, gap_waivers.gap_waiver_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gap_waivers.gap_waiver_id]
          action_bindings:
            gap_waivers.gap_waiver_id: gap_waiver_id
        state_contract:
          field: gap_waivers.status
          allowed: [active]
    params:
      per_tier:
        Kestrel GAP Essential: {max_ltv_covered_pct: "=max_ltv_covered_pct", deductible_coverage_usd: "=deductible_coverage_usd", max_benefit_usd: "=max_benefit_usd"}
        Kestrel GAP Standard: {max_ltv_covered_pct: "=max_ltv_covered_pct", deductible_coverage_usd: "=deductible_coverage_usd", max_benefit_usd: "=max_benefit_usd"}
        Kestrel GAP Plus: {max_ltv_covered_pct: "=max_ltv_covered_pct", deductible_coverage_usd: "=deductible_coverage_usd", max_benefit_usd: "=max_benefit_usd"}
        Kestrel GAP Premier: {max_ltv_covered_pct: "=max_ltv_covered_pct", deductible_coverage_usd: "=deductible_coverage_usd", max_benefit_usd: "=max_benefit_usd"}
        Kestrel GAP Premier Plus: {max_ltv_covered_pct: "=max_ltv_covered_pct", deductible_coverage_usd: "=deductible_coverage_usd", max_benefit_usd: "=max_benefit_usd"}
        Kestrel GAP Max: {max_ltv_covered_pct: "=max_ltv_covered_pct", deductible_coverage_usd: "=deductible_coverage_usd", max_benefit_usd: "=max_benefit_usd"}
    formula:
      when: "claim_decision == 'approved'"
      covered_share: "min(1, max_ltv_covered_pct / 100 * vehicle_cash_price / amount_financed_at_sale)"
      amount: "round(min(max_benefit_usd, max(0, payoff_at_loss - insurer_settlement) * covered_share + deductible_coverage_usd), 2)"

  - id: gap_cancellation_and_termination
    subject: [gap_waiver_cancelled, gap_cancellation_refund_issued, gap_waiver_terminated, gap_waiver_expired]
    rule: >-
      A borrower may cancel an active waiver. When the finance contract is unwound the waiver is cancelled from
      inception with a full refund and no fee. Otherwise a cancellation within the free-look days after the sale date
      is refunded in full; after that the refund is the price times the unexpired share of the term in days, less the
      cancellation fee, rounded to the cent, and a computed refund below the minimum is not issued. When the finance
      contract is paid off early the waiver terminates; the borrower may ask for the pro-rata refund within the payoff
      refund request days. A refund is issued only on a waiver whose status is cancelled or terminated. While the
      finance contract is active the refund is credited to its principal; otherwise it is paid to the borrower within
      the refund business days. A waiver reaching its original maturity date expires with no refund.
    eligibility:
      - id: refund_state
        applies_to: [gap_cancellation_refund_issued]
        kind: state
        condition: "A refund is issued only on a waiver whose status is cancelled or terminated."
        evidence_fields: [gap_waivers.status, gap_waivers.gap_waiver_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gap_waivers.gap_waiver_id]
          action_bindings:
            gap_waivers.gap_waiver_id: gap_waiver_id
        state_contract:
          field: gap_waivers.status
          allowed: [cancelled, terminated]
    params:
      per_tier:
        Kestrel GAP Essential: {cancellation_fee_usd: "=cancellation_fee_usd", free_look_days: "=free_look_days"}
        Kestrel GAP Standard: {cancellation_fee_usd: "=cancellation_fee_usd", free_look_days: "=free_look_days"}
        Kestrel GAP Plus: {cancellation_fee_usd: "=cancellation_fee_usd", free_look_days: "=free_look_days"}
        Kestrel GAP Premier: {cancellation_fee_usd: "=cancellation_fee_usd", free_look_days: "=free_look_days"}
        Kestrel GAP Premier Plus: {cancellation_fee_usd: "=cancellation_fee_usd", free_look_days: "=free_look_days"}
        Kestrel GAP Max: {cancellation_fee_usd: "=cancellation_fee_usd", free_look_days: "=free_look_days"}

  - id: gap_exclusions
    subject: [gap_claim_decided]
    rule: >-
      Losses on vehicles in commercial use are excluded. Insurer deductions for unrepaired prior damage, salvage the
      owner kept, past-due installments, late and returned-payment fees and refunds due from cancelled add-on products
      are subtracted from the payoff before the benefit is computed, and any benefit above the remaining balance is
      never paid to the borrower. The waiver cannot be transferred.
    eligibility: []

  - id: gap_documents_reconsideration
    subject: [gap_claim_document_received]
    rule: >-
      The insurer settlement letter must state the actual cash value and every deduction; a letter without them does
      not count as received. A police report is required for a theft claim. A document that arrives after a denial and
      within the reconsideration days reopens the decision for a new decision entry.
    eligibility: []
