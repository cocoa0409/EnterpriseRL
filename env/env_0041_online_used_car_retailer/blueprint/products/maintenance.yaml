# Product charter: KestrelCare Prepaid Maintenance Plans. Generated by erl-scenario-blueprint.
# One holding = one prepaid maintenance plan on one purchased vehicle, holding a balance of service visits.

category: maintenance
display_name: KestrelCare Prepaid Maintenance Plans

binding:
  holding_table: maintenance_plans
  event_tables: [maintenance_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {visits_remaining: visits_remaining}

lifecycle:
  states: [active, fulfilled, expired, cancelled]
  transitions:
    - {from: active, to: fulfilled, by: system, means: "The last prepaid visit is redeemed."}
    - {from: active, to: expired, by: system, means: "The term ends by time or mileage with visits unused."}
    - {from: active, to: cancelled, by: agent, means: "The plan is cancelled at the holder's request or because the vehicle was returned."}

accounts:
  - key: visits_remaining
    unit: visits
    meaning: "Prepaid service visits still available on the plan."

parameter_schema:
  list_price_usd: Plan price before any renewal discount, USD
  visits_included: Prepaid service visits in the plan, integer visits
  term_months: Months after the sale date during which visits can be used, integer months
  term_miles: Miles added to the odometer at sale after which visits can no longer be used, integer miles
  max_vehicle_age_years_at_sale: Maximum model age at sale, integer years
  max_odometer_at_sale: Maximum odometer at sale, integer miles
  post_sale_purchase_window_days: Calendar days after vehicle handover within which the plan can be bought, integer days
  plan_starts_at_handover: Whether a plan sold with the vehicle starts on the handover date rather than the sale date, boolean
  ev_eligible: Whether the plan is sold on battery-electric vehicles, boolean
  diesel_eligible: Whether the plan is sold on diesel vehicles, boolean
  commercial_use_allowed: Whether vehicles in rideshare or delivery use are eligible, boolean
  oil_type: Engine oil included in each visit
  max_oil_quarts_per_visit: Quarts of oil included per visit; extra quarts are paid by the holder at the facility, integer quarts
  synthetic_upgrade_charge_usd: Charge paid by the holder at the facility to upgrade a visit to full synthetic, USD
  tire_rotation_each_visit: Whether each visit includes a tire rotation, boolean
  multipoint_inspection_each_visit: Whether each visit includes a multipoint inspection, boolean
  brake_inspection_each_visit: Whether each visit includes a brake measurement, boolean
  fluid_topoff_each_visit: Whether each visit includes fluid top-off and tire pressure check, boolean
  min_miles_between_visits: Minimum miles between two redeemed visits, integer miles
  min_days_between_visits: Minimum calendar days between two redeemed visits, integer days
  max_visits_per_12_months: Maximum visits redeemed in any rolling 12 months, integer visits
  multiple_visits_same_day_allowed: Whether two visits may be redeemed on the same day, boolean
  visit_used_on_partial_service: Whether a visit is used even when only part of its services is performed, boolean
  redemption_requires_vin_match: Whether the facility must match the plan VIN on the vehicle before redeeming, boolean
  network_facilities: Facilities that redeem visits directly, list
  out_of_network_allowed: Whether a visit may be done at another licensed facility and reimbursed, boolean
  out_of_network_reimbursement_cap_usd: Maximum reimbursed for one out-of-network visit, USD
  out_of_network_max_visits: Maximum out-of-network visits over the plan, integer visits
  out_of_network_receipt_days: Calendar days after the service date within which the repair order must be submitted, integer days
  reimbursement_business_days: Business days after approval within which an out-of-network reimbursement is paid, integer business days
  void_window_days: Calendar days after a redemption within which a redemption recorded in error is voided, integer days
  redemption_grace_days_after_expiry: Calendar days after the expiration date during which a visit booked before expiry can still be redeemed, integer days
  visits_forfeited_at_expiry: Whether unused visits are forfeited when the plan expires, boolean
  free_look_days: Calendar days after the sale date within which an unused plan is refunded in full, integer days
  cancellation_fee_usd: Fee deducted from a non-free-look cancellation refund, USD
  refund_basis: How a cancellation refund is computed outside the free look
  flat_cancel_reasons: Cancellation reasons refunded in full with no fee, list
  cancellation_refund_business_days: Business days after cancellation within which the refund is issued, integer business days
  refund_to_lienholder_when_financed: Whether the refund of a financed plan goes to the lienholder while the finance contract is active, boolean
  transfer_allowed: Whether the plan can be transferred to a new owner, boolean
  one_plan_per_vehicle: Whether a vehicle may carry only one active plan, boolean
  financing_allowed: Whether the price may be included in a Kestrel Auto Finance contract signed with the vehicle, boolean
  renewal_allowed: Whether a new plan may be bought once the current one is fulfilled or expired, boolean
  renewal_discount_pct: Discount off the list price of a plan bought within 30 days after the previous plan on the same VIN was fulfilled or expired, percent
  renewal_window_days: Calendar days after a plan ends within which a renewal discount applies, integer days
  min_refund_usd: Computed refunds below this amount are not issued, USD
  extra_quart_charge_usd: Price per extra quart paid by the holder at a network facility, USD
  hybrid_eligible: Whether the plan is sold on hybrid vehicles, boolean

