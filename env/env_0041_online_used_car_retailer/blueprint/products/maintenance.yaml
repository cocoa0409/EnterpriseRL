events:
  - type: maintenance_plan_sold
    target: maintenance_plans
    mutation: create
    meaning: "A prepaid maintenance plan is sold on a purchased vehicle."
    grain: "one row per plan"
    fields:
      customer_id: "holder"
      purchase_order_id: "purchase order of the vehicle"
      vin: "covered VIN"
      variant_name: "plan"
      plan_price: "price paid or financed"
      sale_date: "sale date"
      odometer_at_sale: "odometer at sale"
      expiration_date: "start date plus term months"
      expiration_odometer: "odometer at sale plus term miles"
      financed: "whether financed"
    triggers:
      - event: maintenance:maintenance_visits_allotted
        map: {}
  - type: maintenance_plan_fulfilled
    target: maintenance_plans
    mutation: {transition: {from: active, to: fulfilled}}
    meaning: "All visits are used."
    grain: "one row per plan"
    fields:
      status: "active -> fulfilled"
      closed_date: "date of the last redemption"
    triggers: []
  - type: maintenance_plan_expired
    target: maintenance_plans
    mutation: {transition: {from: active, to: expired}}
    meaning: "The term ends with visits unused."
    grain: "one row per plan"
    fields:
      status: "active -> expired"
      closed_date: "end of term"
    triggers:
      - event: maintenance:maintenance_visits_forfeited
        map: {}
  - type: maintenance_plan_cancelled
    target: maintenance_plans
    mutation: {transition: {from: active, to: cancelled}}
    meaning: "The plan is cancelled."
    grain: "one row per plan"
    fields:
      status: "active -> cancelled"
      closed_date: "cancellation date"
    triggers:
      - event: maintenance:maintenance_visits_forfeited
        map: {}
      - event: maintenance:maintenance_cancellation_refund_issued
        map: {}

  - type: maintenance_visits_allotted
    target: maintenance_transactions
    meaning: "The plan's prepaid visits are credited at sale."
    grain: "one row per plan"
    distinguish_by: [txn_date]
    fields:
      txn_date: "sale date"
      visits: "visits included"
    account: visits_remaining
    direction: in
    triggers: []
  - type: maintenance_visit_redeemed
    target: maintenance_transactions
    meaning: "A network facility performs a prepaid visit, or an out-of-network visit is accepted for reimbursement."
    grain: "one row per repair order"
    distinguish_by: [repair_order_number]
    fields:
      txn_date: "service date"
      visits: "1"
      repair_order_number: "facility repair order"
      odometer_at_service: "odometer on the repair order"
      facility_type: "network_facility or out_of_network"
    account: visits_remaining
    direction: out
    triggers:
      - event: maintenance:maintenance_out_of_network_reimbursed
        when: {facility_type: out_of_network}
        map: {repair_order_number: repair_order_number, source_txn_id: maintenance_txn_id}
  - type: maintenance_redemption_voided
    target: maintenance_transactions
    meaning: "A redemption recorded in error is reversed and the visit restored."
    grain: "one row per voided redemption"
    distinguish_by: [source_txn_id]
    fields:
      txn_date: "void date"
      visits: "1"
      source_txn_id: "redemption voided"
    account: visits_remaining
    direction: in
    triggers: []
  - type: maintenance_visits_forfeited
    target: maintenance_transactions
    meaning: "Unused visits are removed when the plan expires or is cancelled."
    grain: "one row per plan"
    distinguish_by: [txn_date]
    fields:
      txn_date: "date forfeited"
      visits: "visits remaining at that date"
    account: visits_remaining
    direction: out
    triggers: []
  - type: maintenance_out_of_network_reimbursed
    target: maintenance_transactions
    meaning: "The holder is reimbursed for an out-of-network visit."
    grain: "one row per reimbursed repair order"
    distinguish_by: [repair_order_number]
    fields:
      txn_date: "payment date"
      amount: "amount reimbursed"
      repair_order_number: "repair order"
      source_txn_id: "the redemption it pays for"
    triggers: []
  - type: maintenance_cancellation_refund_issued
    target: maintenance_transactions
    meaning: "The refund of a cancelled plan is issued."
    grain: "one row per cancelled plan"
    distinguish_by: [txn_date]
    fields:
      txn_date: "refund date"
      amount: "refund amount"
      refund_payee: "customer or lienholder"
    triggers:
      - event: finance:finance_principal_credited
        when: {refund_payee: lienholder}
        map: {credit_source: maintenance_plan_refund, amount: amount, txn_date: txn_date, linked_reference_id: maintenance_plan_id}

measures:
  - id: maintenance_msr_visits_last_12m
    window: "rolling 12 months ending on the service date"
    measure: "count of maintenance_visit_redeemed entries of the plan without a void"
  - id: maintenance_msr_out_of_network_used
    window: "life of the plan"
    measure: "count of maintenance_visit_redeemed entries of the plan with facility_type out_of_network without a void"
  - id: maintenance_msr_visits_used
    window: "life of the plan up to the request"
    measure: "count of maintenance_visit_redeemed entries without a void"

policies:
  - id: maintenance_agg_multi_holding
    subject: [maintenance_plan_sold]
    rule: >-
      A customer may hold maintenance plans on several vehicles; there is no limit per customer. The per-vehicle
      limit is set by maintenance_agg_one_per_vin.
    eligibility: []
    params:
      max_per_customer: null

  - id: maintenance_agg_one_per_vin
    subject: [maintenance_plan_sold]
    rule: >-
      A vehicle may carry only one active plan. A new plan on a VIN is sold only when no plan on that VIN is active;
      a plan bought within the renewal window after the previous plan on the same VIN was fulfilled or expired gets
      the renewal discount off the list price.
    eligibility:
      - id: one_active_per_vin
        applies_to: [maintenance_plan_sold]
        kind: dedup
        condition: "A new plan on a VIN is sold only when no plan on that VIN is active; a plan bought within the renewal window after the previous plan on the same VIN was fulfilled or expired gets the renewal discount off the list price."
        evidence_fields: [maintenance_plans.vin, maintenance_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_plans.vin]
          action_bindings:
            maintenance_plans.vin: vin
        dedup_contract:
          table: maintenance_plans
          mode: separate_record
          object_bindings: {vin: vin}
          duplicate_filters: {status: [active]}
          distinct_fields: []
    params:
      per_tier:
        KestrelCare Maintenance Starter: {renewal_discount_pct: "=renewal_discount_pct", renewal_window_days: "=renewal_window_days"}
        KestrelCare Maintenance Basic: {renewal_discount_pct: "=renewal_discount_pct", renewal_window_days: "=renewal_window_days"}
        KestrelCare Maintenance Standard: {renewal_discount_pct: "=renewal_discount_pct", renewal_window_days: "=renewal_window_days"}
        KestrelCare Maintenance Plus: {renewal_discount_pct: "=renewal_discount_pct", renewal_window_days: "=renewal_window_days"}
        KestrelCare Maintenance Premier: {renewal_discount_pct: "=renewal_discount_pct", renewal_window_days: "=renewal_window_days"}
        KestrelCare Maintenance Premier Max: {renewal_discount_pct: "=renewal_discount_pct", renewal_window_days: "=renewal_window_days"}

  - id: maintenance_sale
    subject: [maintenance_plan_sold, maintenance_visits_allotted]
    rule: >-
      A plan is sold on a gasoline, hybrid or, where the plan allows it, diesel vehicle within the plan's age and
      odometer limits, either with the vehicle or within the post-sale purchase window after handover; battery
      electric vehicles and vehicles in commercial use are not eligible. A plan sold with the vehicle starts on the
      handover date. The expiration date is the start date plus the term months and the expiration odometer is the
      odometer at sale plus the term miles. The plan's visits are credited at sale. Visits are credited only on a
      plan whose status is active. The price may be financed only when sold with the vehicle on a Kestrel Auto Finance
      purchase within the finance tier's back-end limit.
    eligibility:
      - id: allot_active
        applies_to: [maintenance_visits_allotted]
        kind: state
        condition: "Visits are credited only on a plan whose status is active."
        evidence_fields: [maintenance_plans.status, maintenance_plans.maintenance_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_plans.maintenance_plan_id]
          action_bindings:
            maintenance_plans.maintenance_plan_id: maintenance_plan_id
        state_contract:
          field: maintenance_plans.status
          allowed: [active]
    params:
      per_tier:
        KestrelCare Maintenance Starter: {visits_included: "=visits_included", term_months: "=term_months", term_miles: "=term_miles", list_price_usd: "=list_price_usd"}
        KestrelCare Maintenance Basic: {visits_included: "=visits_included", term_months: "=term_months", term_miles: "=term_miles", list_price_usd: "=list_price_usd"}
        KestrelCare Maintenance Standard: {visits_included: "=visits_included", term_months: "=term_months", term_miles: "=term_miles", list_price_usd: "=list_price_usd"}
        KestrelCare Maintenance Plus: {visits_included: "=visits_included", term_months: "=term_months", term_miles: "=term_miles", list_price_usd: "=list_price_usd"}
        KestrelCare Maintenance Premier: {visits_included: "=visits_included", term_months: "=term_months", term_miles: "=term_miles", list_price_usd: "=list_price_usd"}
        KestrelCare Maintenance Premier Max: {visits_included: "=visits_included", term_months: "=term_months", term_miles: "=term_miles", list_price_usd: "=list_price_usd"}

  - id: maintenance_redemption
    subject: [maintenance_visit_redeemed, maintenance_plan_fulfilled]
    rule: >-
      A visit covers the plan's oil change (oil type and quarts per visit) and the other services the plan includes
      each visit; extra quarts and synthetic upgrades are paid by the holder at the facility. A visit is redeemed only
      on a plan whose status is active, before the expiration date (or within the plan's grace days after it for a
      visit booked before expiry) and below the expiration odometer, on the plan VIN. Visits must be at least the
      minimum miles and minimum days apart, no more than one on a day, and no more than the plan's maximum visits in
      any rolling 12 months counted by maintenance_msr_visits_last_12m. A visit is used even when only part of its
      services is performed. When the last visit is redeemed the plan is fulfilled.
    eligibility:
      - id: redeem_active
        applies_to: [maintenance_visit_redeemed]
        kind: state
        condition: "A visit is redeemed only on a plan whose status is active, before the expiration date (or within the plan's grace days after it for a visit booked before expiry) and below the expiration odometer, on the plan VIN."
        evidence_fields: [maintenance_plans.status, maintenance_plans.maintenance_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_plans.maintenance_plan_id]
          action_bindings:
            maintenance_plans.maintenance_plan_id: maintenance_plan_id
        state_contract:
          field: maintenance_plans.status
          allowed: [active]
    params:
      per_tier:
        KestrelCare Maintenance Starter: {min_miles_between_visits: "=min_miles_between_visits", max_visits_per_12_months: "=max_visits_per_12_months", redemption_grace_days_after_expiry: "=redemption_grace_days_after_expiry"}
        KestrelCare Maintenance Basic: {min_miles_between_visits: "=min_miles_between_visits", max_visits_per_12_months: "=max_visits_per_12_months", redemption_grace_days_after_expiry: "=redemption_grace_days_after_expiry"}
        KestrelCare Maintenance Standard: {min_miles_between_visits: "=min_miles_between_visits", max_visits_per_12_months: "=max_visits_per_12_months", redemption_grace_days_after_expiry: "=redemption_grace_days_after_expiry"}
        KestrelCare Maintenance Plus: {min_miles_between_visits: "=min_miles_between_visits", max_visits_per_12_months: "=max_visits_per_12_months", redemption_grace_days_after_expiry: "=redemption_grace_days_after_expiry"}
        KestrelCare Maintenance Premier: {min_miles_between_visits: "=min_miles_between_visits", max_visits_per_12_months: "=max_visits_per_12_months", redemption_grace_days_after_expiry: "=redemption_grace_days_after_expiry"}
        KestrelCare Maintenance Premier Max: {min_miles_between_visits: "=min_miles_between_visits", max_visits_per_12_months: "=max_visits_per_12_months", redemption_grace_days_after_expiry: "=redemption_grace_days_after_expiry"}
    measures: [maintenance_msr_visits_last_12m]

  - id: maintenance_out_of_network
    subject: [maintenance_out_of_network_reimbursed]
    rule: >-
      Where the plan allows it, a visit may be done at another licensed facility and the holder reimbursed for the
      oil change and rotation up to the plan's out-of-network cap, once the repair order is submitted within the
      out-of-network receipt days after the service date. Out-of-network visits used, counted by
      maintenance_msr_out_of_network_used, must stay within the plan's maximum. Each repair order is reimbursed once,
      within the reimbursement business days. A reimbursement is paid only on a plan whose status is active or
      fulfilled.
    eligibility:
      - id: reimburse_state
        applies_to: [maintenance_out_of_network_reimbursed]
        kind: state
        condition: "A reimbursement is paid only on a plan whose status is active or fulfilled."
        evidence_fields: [maintenance_plans.status, maintenance_plans.maintenance_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_plans.maintenance_plan_id]
          action_bindings:
            maintenance_plans.maintenance_plan_id: maintenance_plan_id
        state_contract:
          field: maintenance_plans.status
          allowed: [active, fulfilled]
    params:
      per_tier:
        KestrelCare Maintenance Starter: {out_of_network_reimbursement_cap_usd: "=out_of_network_reimbursement_cap_usd", out_of_network_max_visits: "=out_of_network_max_visits"}
        KestrelCare Maintenance Basic: {out_of_network_reimbursement_cap_usd: "=out_of_network_reimbursement_cap_usd", out_of_network_max_visits: "=out_of_network_max_visits"}
        KestrelCare Maintenance Standard: {out_of_network_reimbursement_cap_usd: "=out_of_network_reimbursement_cap_usd", out_of_network_max_visits: "=out_of_network_max_visits"}
        KestrelCare Maintenance Plus: {out_of_network_reimbursement_cap_usd: "=out_of_network_reimbursement_cap_usd", out_of_network_max_visits: "=out_of_network_max_visits"}
        KestrelCare Maintenance Premier: {out_of_network_reimbursement_cap_usd: "=out_of_network_reimbursement_cap_usd", out_of_network_max_visits: "=out_of_network_max_visits"}
        KestrelCare Maintenance Premier Max: {out_of_network_reimbursement_cap_usd: "=out_of_network_reimbursement_cap_usd", out_of_network_max_visits: "=out_of_network_max_visits"}
    measures: [maintenance_msr_out_of_network_used]

  - id: maintenance_void
    subject: [maintenance_redemption_voided]
    rule: >-
      A redemption recorded in error (a duplicate repair order, the wrong VIN, or a visit not performed) is voided and
      the visit restored when the error is reported within the void window days after the redemption. Each redemption
      is voided at most once. A void is recorded only on a plan whose status is active or fulfilled; voiding the
      redemption that fulfilled a plan does not reopen it in this charter.
    eligibility:
      - id: void_state
        applies_to: [maintenance_redemption_voided]
        kind: state
        condition: "A void is recorded only on a plan whose status is active or fulfilled; voiding the redemption that fulfilled a plan does not reopen it in this charter."
        evidence_fields: [maintenance_plans.status, maintenance_plans.maintenance_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_plans.maintenance_plan_id]
          action_bindings:
            maintenance_plans.maintenance_plan_id: maintenance_plan_id
        state_contract:
          field: maintenance_plans.status
          allowed: [active, fulfilled]
    params:
      per_tier:
        KestrelCare Maintenance Starter: {void_window_days: "=void_window_days"}
        KestrelCare Maintenance Basic: {void_window_days: "=void_window_days"}
        KestrelCare Maintenance Standard: {void_window_days: "=void_window_days"}
        KestrelCare Maintenance Plus: {void_window_days: "=void_window_days"}
        KestrelCare Maintenance Premier: {void_window_days: "=void_window_days"}
        KestrelCare Maintenance Premier Max: {void_window_days: "=void_window_days"}

  - id: maintenance_expiry_forfeit
    subject: [maintenance_plan_expired, maintenance_visits_forfeited]
    rule: >-
      A plan expires at the earlier of its expiration date (plus any grace for a visit booked before expiry) and its
      expiration odometer; unused visits are then forfeited and nothing is refunded. Visits are forfeited only on a
      plan whose status is expired or cancelled. Plans are not transferable; a holder who sells the vehicle may cancel
      instead.
    eligibility:
      - id: forfeit_state
        applies_to: [maintenance_visits_forfeited]
        kind: state
        condition: "Visits are forfeited only on a plan whose status is expired or cancelled."
        evidence_fields: [maintenance_plans.status, maintenance_plans.maintenance_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_plans.maintenance_plan_id]
          action_bindings:
            maintenance_plans.maintenance_plan_id: maintenance_plan_id
        state_contract:
          field: maintenance_plans.status
          allowed: [expired, cancelled]

  - id: maintenance_cancellation
    subject: [maintenance_plan_cancelled, maintenance_cancellation_refund_issued]
    rule: >-
      The holder may cancel an active plan. When the reason is one of the plan's flat cancel reasons the refund is the
      full price with no fee. Otherwise, within the free-look days after the sale date with no visit used (maintenance_msr_visits_used is zero), the refund
      is the full price; after that the refund is the price times unused visits over visits included, less the
      cancellation fee, rounded to the cent; a computed refund below the minimum refund is not issued. When the plan
      was financed and its finance contract is active, the refund goes to Kestrel Auto Finance as lienholder and is
      credited to principal; otherwise it goes to the holder, within the cancellation refund business days. A refund is
      issued only on a plan whose status is cancelled.
    eligibility:
      - id: refund_cancelled
        applies_to: [maintenance_cancellation_refund_issued]
        kind: state
        condition: "A refund is issued only on a plan whose status is cancelled."
        evidence_fields: [maintenance_plans.status, maintenance_plans.maintenance_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [maintenance_plans.maintenance_plan_id]
          action_bindings:
            maintenance_plans.maintenance_plan_id: maintenance_plan_id
        state_contract:
          field: maintenance_plans.status
          allowed: [cancelled]
    params:
      per_tier:
        KestrelCare Maintenance Starter: {cancellation_fee_usd: "=cancellation_fee_usd", free_look_days: "=free_look_days", visits_included: "=visits_included"}
        KestrelCare Maintenance Basic: {cancellation_fee_usd: "=cancellation_fee_usd", free_look_days: "=free_look_days", visits_included: "=visits_included"}
        KestrelCare Maintenance Standard: {cancellation_fee_usd: "=cancellation_fee_usd", free_look_days: "=free_look_days", visits_included: "=visits_included"}
        KestrelCare Maintenance Plus: {cancellation_fee_usd: "=cancellation_fee_usd", free_look_days: "=free_look_days", visits_included: "=visits_included"}
        KestrelCare Maintenance Premier: {cancellation_fee_usd: "=cancellation_fee_usd", free_look_days: "=free_look_days", visits_included: "=visits_included"}
        KestrelCare Maintenance Premier Max: {cancellation_fee_usd: "=cancellation_fee_usd", free_look_days: "=free_look_days", visits_included: "=visits_included"}
    formula:
      amount: "round(max(0, plan_price * visits_remaining / visits_included - cancellation_fee_usd), 2)"
    measures: [maintenance_msr_visits_used]
