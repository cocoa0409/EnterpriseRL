events:
  - type: title_order_opened
    target: title_orders
    mutation: create
    meaning: "A title and registration order opens when the purchase agreement is signed."
    grain: "one row per purchase agreement"
    fields:
      customer_id: "buyer"
      purchase_order_id: "purchase order"
      variant_name: "service type"
      registration_state: "registration state from the agreement"
      lienholder: "lienholder to record"
      opened_date: "signing date"
    triggers:
      - event: title:title_state_fee_collected
        map: {}
  - type: title_documents_completed
    target: title_orders
    mutation: {transition: {from: awaiting_documents, to: ready_to_submit}}
    meaning: "The last required document is accepted."
    grain: "one row per completion"
    fields:
      status: "awaiting_documents -> ready_to_submit"
    triggers: []
  - type: title_submitted_to_dmv
    target: title_orders
    mutation: {transition: {from: ready_to_submit, to: submitted}}
    meaning: "The packet is submitted to the state."
    grain: "one row per submission"
    fields:
      status: "ready_to_submit -> submitted"
      submitted_date: "submission date"
      dmv_transaction_number: "state receipt number"
    triggers:
      - event: title:title_state_fee_remitted
        map: {}
  - type: title_rejected_by_dmv
    target: title_orders
    mutation: {transition: {from: submitted, to: rejected}}
    meaning: "The state rejects the packet."
    grain: "one row per rejection"
    fields:
      status: "submitted -> rejected"
    triggers:
      - event: title:title_dmv_rejection_recorded
        map: {}
  - type: title_resubmission_prepared
    target: title_orders
    mutation: {transition: {from: rejected, to: ready_to_submit}}
    meaning: "A rejection is cured without needing anything new from the customer."
    grain: "one row per cure"
    fields:
      status: "rejected -> ready_to_submit"
    triggers: []
  - type: title_documents_reopened
    target: title_orders
    mutation: {transition: {from: rejected, to: awaiting_documents}}
    meaning: "A rejection needs a corrected document from the customer."
    grain: "one row per reopening"
    fields:
      status: "rejected -> awaiting_documents"
    triggers: []
  - type: title_registration_issued
    target: title_orders
    mutation: {transition: {from: submitted, to: registered}}
    meaning: "The state issues title and registration."
    grain: "one row per order"
    fields:
      status: "submitted -> registered"
      registered_date: "issue date"
      plate_number: "permanent plate number; empty for title-only"
    triggers: []
  - type: title_order_completed
    target: title_orders
    mutation: {transition: {from: registered, to: completed}}
    meaning: "Plates and registration card, or title-only paperwork, are delivered."
    grain: "one row per order"
    fields:
      status: "registered -> completed"
      completed_date: "delivery date"
      closed_date: "delivery date"
    triggers: []
  - type: title_order_cancelled
    target: title_orders
    mutation: {transition: [{from: awaiting_documents, to: cancelled}, {from: ready_to_submit, to: cancelled}, {from: rejected, to: cancelled}]}
    meaning: "The order is cancelled before registration."
    grain: "one row per cancellation"
    fields:
      status: "-> cancelled"
      closed_date: "date of cancellation"
    triggers:
      - event: title:title_state_fee_refunded
        map: {}
  - type: title_temp_tag_recorded
    target: title_orders
    mutation: update
    meaning: "The temporary tag currently on the vehicle is recorded on the order."
    grain: "one row per tag issued"
    fields:
      temp_tag_number: "number of the tag just issued"
      temp_tag_expires_date: "its expiration date"
      temp_tag_extensions_used: "tags issued after the original"
    triggers: []

  - type: title_state_fee_collected
    target: title_transactions
    meaning: "A state fee is collected from the buyer to be remitted."
    grain: "one row per fee type per collection date"
    distinguish_by: [fee_type, txn_date]
    fields:
      txn_date: "collection date"
      amount: "fee amount"
      fee_type: "state fee"
    account: state_fees_held
    direction: in
    triggers: []
  - type: title_state_fee_remitted
    target: title_transactions
    meaning: "A held state fee is paid to the state with the submission."
    grain: "one row per collected fee remitted"
    distinguish_by: [source_txn_id]
    fields:
      txn_date: "submission date"
      amount: "fee remitted"
      fee_type: "state fee"
      source_txn_id: "collected fee entry"
    account: state_fees_held
    direction: out
    triggers: []
  - type: title_state_fee_refunded
    target: title_transactions
    meaning: "A held state fee is refunded to the buyer."
    grain: "one row per collected fee refunded"
    distinguish_by: [source_txn_id]
    fields:
      txn_date: "refund date"
      amount: "fee refunded"
      fee_type: "state fee"
      source_txn_id: "collected fee entry"
    account: state_fees_held
    direction: out
    triggers: []
  - type: title_document_received
    target: title_transactions
    meaning: "A registration document is received from the customer."
    grain: "one row per document received per date"
    distinguish_by: [document_type, txn_date, document_format]
    fields:
      txn_date: "date received"
      amount: "0.00"
      document_type: "document"
      document_format: "electronic_signature, wet_ink_original or scan_or_photo"
      document_date: "date printed on the document"
    triggers: []
  - type: title_temp_tag_issued
    target: title_transactions
    meaning: "A temporary tag is issued for the vehicle."
    grain: "one row per tag"
    distinguish_by: [tag_sequence]
    fields:
      txn_date: "issue date"
      amount: "0.00 (temp tag fees are booked as state fees collected)"
      tag_sequence: "1 original, 2 first extension, ..."
      temp_tag_number: "tag number"
      tag_expires_date: "expiration printed on the tag"
    triggers:
      - event: title:title_temp_tag_recorded
        map: {temp_tag_number: temp_tag_number}
  - type: title_dmv_rejection_recorded
    target: title_transactions
    meaning: "The state's rejection reason is recorded."
    grain: "one row per rejection"
    distinguish_by: [reject_code, txn_date]
    fields:
      txn_date: "rejection date"
      amount: "fee shortage stated by the state, or 0.00"
      reject_code: "reason"
    triggers: []
  - type: title_reimbursement_paid
    target: title_transactions
    meaning: "Kestrel reimburses the buyer for a state penalty, a citation or an inspection fee."
    grain: "one row per reimbursed document"
    distinguish_by: [reimbursement_reason, citation_number]
    fields:
      txn_date: "payment date"
      amount: "amount reimbursed"
      reimbursement_reason: "cost covered"
      citation_number: "citation, notice or receipt number"
    triggers: []

measures:
  - id: title_msr_submissions
    window: "life of the order"
    measure: "count of title_submitted_to_dmv transitions on the order, equal to 1 plus the count of title_dmv_rejection_recorded entries when the order is submitted again after each rejection"
  - id: title_msr_documents_accepted
    window: "life of the order up to the moment of the request"
    measure: "set of document_type values of title_document_received entries of the order that meet the format and date rules, excluding documents received before the most recent rejection that names them"
  - id: title_msr_reimbursements
    window: "life of the order"
    measure: "count of title_reimbursement_paid entries of the order"

policies:
  - id: title_agg_multi_holding
    subject: [title_order_opened]
    rule: >-
      A customer may hold any number of title orders over time. Each purchase order has exactly one title order
      that is not cancelled; a new order for the same purchase order is opened only when the earlier one was
      cancelled.
    eligibility:
      - id: one_per_purchase
        applies_to: [title_order_opened]
        kind: dedup
        condition: "Each purchase order has exactly one title order that is not cancelled; a new order for the same purchase order is opened only when the earlier one was cancelled."
        evidence_fields: [title_orders.purchase_order_id, title_orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.purchase_order_id]
          action_bindings:
            title_orders.purchase_order_id: purchase_order_id
        dedup_contract:
          table: title_orders
          mode: separate_record
          object_bindings: {purchase_order_id: purchase_order_id}
          duplicate_filters: {status: [awaiting_documents, ready_to_submit, submitted, rejected, registered, completed]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: title_agg_household_fees
    subject: [title_state_fee_collected]
    rule: >-
      State fees are computed per title order and never combined across a customer's orders: two vehicles bought
      the same day each carry their own title, registration, plate, lien and temp tag fees, and a plate transferred
      to one vehicle cannot also be transferred to another. A plate is transferred only to one open title order of
      the same customer.
    eligibility: []

  - id: title_service_fees
    subject: [title_order_opened, title_state_fee_collected]
    rule: >-
      The service type follows the purchase: title-only when the buyer elects to register personally; in-state
      services when the registration state equals the selling dealer state; out-of-state services otherwise, with
      inspection when the registration state requires a VIN inspection or emissions certificate for a vehicle last
      titled elsewhere; specialty plate when a specialty or personalized plate is requested in the dealer state. At
      opening, the state fees in the service's fee components are collected from the registration state's fee
      schedule, each as its own entry, plus the lien recording fee when a lienholder is to be recorded. A state fee
      is collected only on an order whose status is awaiting_documents or rejected; after a fee-shortage rejection
      the stated shortage is collected as its own entry within the fee shortage collection days. The temp tag fee
      collected at opening covers the original tag only; extension tag fees are not collected from the customer
      when the service's switch is false.
    eligibility:
      - id: collect_state
        applies_to: [title_state_fee_collected]
        kind: state
        condition: "A state fee is collected only on an order whose status is awaiting_documents or rejected; after a fee-shortage rejection the stated shortage is collected as its own entry within the fee shortage collection days."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [awaiting_documents, rejected]
    params:
      state_fee_schedule:
        AZ: {title_fee: 4.00, registration_fee: 8.00, new_plate_fee: 5.00, plate_transfer_fee: 12.00, specialty_plate_fee: 25.00, lien_recording_fee: 0.00, temp_tag_fee: 15.00}
        TX: {title_fee: 33.00, registration_fee: 51.75, new_plate_fee: 0.00, plate_transfer_fee: 0.00, specialty_plate_fee: 40.00, lien_recording_fee: 0.00, temp_tag_fee: 5.00}
        GA: {title_fee: 18.00, registration_fee: 20.00, new_plate_fee: 0.00, plate_transfer_fee: 0.00, specialty_plate_fee: 35.00, lien_recording_fee: 0.00, temp_tag_fee: 0.00}
        FL: {title_fee: 77.75, registration_fee: 46.15, new_plate_fee: 225.00, plate_transfer_fee: 4.60, specialty_plate_fee: 25.00, lien_recording_fee: 2.00, temp_tag_fee: 2.00}
        NC: {title_fee: 56.00, registration_fee: 38.75, new_plate_fee: 0.00, plate_transfer_fee: 24.00, specialty_plate_fee: 30.00, lien_recording_fee: 21.50, temp_tag_fee: 0.00}
        OH: {title_fee: 15.00, registration_fee: 34.50, new_plate_fee: 0.00, plate_transfer_fee: 5.00, specialty_plate_fee: 35.00, lien_recording_fee: 15.00, temp_tag_fee: 0.00}
        PA: {title_fee: 67.00, registration_fee: 45.00, new_plate_fee: 0.00, plate_transfer_fee: 11.00, specialty_plate_fee: 20.00, lien_recording_fee: 34.00, temp_tag_fee: 0.00}
        CO: {title_fee: 7.20, registration_fee: 50.00, new_plate_fee: 0.00, plate_transfer_fee: 0.00, specialty_plate_fee: 25.00, lien_recording_fee: 0.00, temp_tag_fee: 0.00}
      per_tier:
        Kestrel Title-Only Service: {state_fee_components: "=state_fee_components", extension_tag_fee_charged_to_customer: "=extension_tag_fee_charged_to_customer"}
        Kestrel In-State Plate Transfer: {state_fee_components: "=state_fee_components", extension_tag_fee_charged_to_customer: "=extension_tag_fee_charged_to_customer"}
        Kestrel In-State New Registration: {state_fee_components: "=state_fee_components", extension_tag_fee_charged_to_customer: "=extension_tag_fee_charged_to_customer"}
        Kestrel Out-of-State Registration: {state_fee_components: "=state_fee_components", extension_tag_fee_charged_to_customer: "=extension_tag_fee_charged_to_customer"}
        Kestrel Out-of-State Registration with Inspection: {state_fee_components: "=state_fee_components", extension_tag_fee_charged_to_customer: "=extension_tag_fee_charged_to_customer"}
        Kestrel Specialty Plate Registration: {state_fee_components: "=state_fee_components", extension_tag_fee_charged_to_customer: "=extension_tag_fee_charged_to_customer"}

  - id: title_documents
    subject: [title_document_received, title_documents_completed]
    rule: >-
      The order becomes ready to submit only when every document in the service's required documents has been
      received in acceptable form. A document is received only on an order whose status is awaiting_documents,
      ready_to_submit or rejected. A document listed among the service's wet-ink documents counts only as a wet-ink
      original; a document listed among the scan-accepted documents may arrive as a scan or photo; every other
      document may be e-signed or a wet-ink original. A proof of residence counts only when its statement date is
      no more than the service's maximum age before the date it was received, and its address is the registration
      address; a proof of insurance counts only when it shows the purchased VIN; an odometer disclosure is not
      required for a vehicle at or above the exempt model age; a signed power of attorney for a registration state
      in the notarized list counts only when notarized; a prior plate registration counts only when the plate is
      registered to the buyer. The customer is asked to return all documents within the customer document due days
      after opening; returning them later does not stop the order but changes who bears late penalties under
      title_reimbursements. For the inspection service the VIN inspection form and emissions certificate (emissions
      only for addresses in emissions counties) must be obtained within the inspection due days after handover. A
      customer's statement that a document was mailed is not receipt.
    eligibility:
      - id: doc_state
        applies_to: [title_document_received]
        kind: state
        condition: "A document is received only on an order whose status is awaiting_documents, ready_to_submit or rejected."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [awaiting_documents, ready_to_submit, rejected]
      - id: docs_complete
        applies_to: [title_documents_completed]
        kind: authorization
        condition: "The order becomes ready to submit only when every document in the service's required documents has been received in acceptable form."
        evidence_fields: [title_transactions.document_type, title_transactions.document_format, title_transactions.document_date, title_transactions.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_transactions.title_order_id]
          action_bindings:
            title_transactions.title_order_id: title_order_id
    params:
      per_tier:
        Kestrel Title-Only Service: {required_documents: "=required_documents", wet_ink_documents: "=wet_ink_documents", proof_of_residence_max_age_days: "=proof_of_residence_max_age_days", customer_document_due_days: "=customer_document_due_days"}
        Kestrel In-State Plate Transfer: {required_documents: "=required_documents", wet_ink_documents: "=wet_ink_documents", proof_of_residence_max_age_days: "=proof_of_residence_max_age_days", customer_document_due_days: "=customer_document_due_days"}
        Kestrel In-State New Registration: {required_documents: "=required_documents", wet_ink_documents: "=wet_ink_documents", proof_of_residence_max_age_days: "=proof_of_residence_max_age_days", customer_document_due_days: "=customer_document_due_days"}
        Kestrel Out-of-State Registration: {required_documents: "=required_documents", wet_ink_documents: "=wet_ink_documents", proof_of_residence_max_age_days: "=proof_of_residence_max_age_days", customer_document_due_days: "=customer_document_due_days"}
        Kestrel Out-of-State Registration with Inspection: {required_documents: "=required_documents", wet_ink_documents: "=wet_ink_documents", proof_of_residence_max_age_days: "=proof_of_residence_max_age_days", customer_document_due_days: "=customer_document_due_days"}
        Kestrel Specialty Plate Registration: {required_documents: "=required_documents", wet_ink_documents: "=wet_ink_documents", proof_of_residence_max_age_days: "=proof_of_residence_max_age_days", customer_document_due_days: "=customer_document_due_days"}
    measures: [title_msr_documents_accepted]

  - id: title_submission
    subject: [title_submitted_to_dmv, title_state_fee_remitted]
    rule: >-
      A ready order is submitted within the service's submission target business days. The packet is submitted only
      when the purchase order balance is zero or below and, when the service requires it, the purchase order shows
      insurance verified. Every held state fee is remitted with the submission as its own remittance entry. A fee is
      remitted only on an order whose status is submitted. The state's dealer deadline for the registration state,
      counted in calendar days from the purchase agreement signing date as day 0, is met when the first submission
      is made on or before its last day. Out-of-state packets for services that go by mail are sent to the buyer's
      county office. Once an order has reached the service's maximum submissions it is not submitted again by
      customer care; it is referred to the title escalations team.
    eligibility:
      - id: funded_and_insured
        applies_to: [title_submitted_to_dmv]
        kind: authorization
        condition: "The packet is submitted only when the purchase order balance is zero or below and, when the service requires it, the purchase order shows insurance verified."
        evidence_fields: [purchase_orders.order_balance, purchase_orders.insurance_verified, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
      - id: remit_state
        applies_to: [title_state_fee_remitted]
        kind: state
        condition: "A fee is remitted only on an order whose status is submitted."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [submitted]
    params:
      state_dealer_deadline_days: {AZ: 30, TX: 30, GA: 30, FL: 30, NC: 28, OH: 30, PA: 20, CO: 30}
      per_tier:
        Kestrel Title-Only Service: {submission_target_business_days: "=submission_target_business_days", max_dmv_submissions: "=max_dmv_submissions", submission_requires_insurance_verified: "=submission_requires_insurance_verified"}
        Kestrel In-State Plate Transfer: {submission_target_business_days: "=submission_target_business_days", max_dmv_submissions: "=max_dmv_submissions", submission_requires_insurance_verified: "=submission_requires_insurance_verified"}
        Kestrel In-State New Registration: {submission_target_business_days: "=submission_target_business_days", max_dmv_submissions: "=max_dmv_submissions", submission_requires_insurance_verified: "=submission_requires_insurance_verified"}
        Kestrel Out-of-State Registration: {submission_target_business_days: "=submission_target_business_days", max_dmv_submissions: "=max_dmv_submissions", submission_requires_insurance_verified: "=submission_requires_insurance_verified"}
        Kestrel Out-of-State Registration with Inspection: {submission_target_business_days: "=submission_target_business_days", max_dmv_submissions: "=max_dmv_submissions", submission_requires_insurance_verified: "=submission_requires_insurance_verified"}
        Kestrel Specialty Plate Registration: {submission_target_business_days: "=submission_target_business_days", max_dmv_submissions: "=max_dmv_submissions", submission_requires_insurance_verified: "=submission_requires_insurance_verified"}
    measures: [title_msr_submissions]

  - id: title_rejections
    subject: [title_rejected_by_dmv, title_dmv_rejection_recorded, title_resubmission_prepared, title_documents_reopened]
    rule: >-
      Each state rejection is recorded with its reason. A rejection is recorded only on an order whose status is
      submitted or rejected. The cure depends on the reason: missing_signature, insurance_not_verified,
      emissions_not_on_file and odometer_discrepancy need a corrected document from the customer (for an odometer
      discrepancy, a new signed odometer disclosure serving as affidavit), so the order returns to
      awaiting_documents and the earlier copy of that document no longer counts; lien_information_error is cured by
      Kestrel from the finance records and fee_shortage by collecting the stated shortage, so the order returns to
      ready_to_submit once cured. The customer has the rejection customer response days to supply a corrected
      document. A cured order is resubmitted within the service's resubmission target business days.
    eligibility:
      - id: reject_state
        applies_to: [title_dmv_rejection_recorded]
        kind: state
        condition: "A rejection is recorded only on an order whose status is submitted or rejected."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [submitted, rejected]
    params:
      per_tier:
        Kestrel Title-Only Service: {resubmission_target_business_days: "=resubmission_target_business_days", rejection_customer_response_days: "=rejection_customer_response_days"}
        Kestrel In-State Plate Transfer: {resubmission_target_business_days: "=resubmission_target_business_days", rejection_customer_response_days: "=rejection_customer_response_days"}
        Kestrel In-State New Registration: {resubmission_target_business_days: "=resubmission_target_business_days", rejection_customer_response_days: "=rejection_customer_response_days"}
        Kestrel Out-of-State Registration: {resubmission_target_business_days: "=resubmission_target_business_days", rejection_customer_response_days: "=rejection_customer_response_days"}
        Kestrel Out-of-State Registration with Inspection: {resubmission_target_business_days: "=resubmission_target_business_days", rejection_customer_response_days: "=rejection_customer_response_days"}
        Kestrel Specialty Plate Registration: {resubmission_target_business_days: "=resubmission_target_business_days", rejection_customer_response_days: "=rejection_customer_response_days"}

  - id: title_temp_tags
    subject: [title_temp_tag_issued, title_temp_tag_recorded]
    rule: >-
      The original temporary tag is issued at handover, valid for the registration state's original-tag validity
      days counted from the handover date. A tag is issued only while the order's status is awaiting_documents,
      ready_to_submit, submitted or rejected; once registration is issued no tag is issued. An extension tag is
      issued only when the current tag expires before registration is expected, and only on or before the current
      tag's expiration date recorded on the order. The tag date is compared as a calendar date; an extension on the
      expiration date itself is allowed and an extension the day after is not. An extension can be issued from the
      service's extension request lead days before that date. When the service requires documents complete for
      extensions, no extension tag is issued while the order is awaiting the customer's documents. Extension tags
      used must stay below the lower of the service's limit and the registration state's maximum extensions. An
      extension tag is valid for the service's extension tag validity days from its issue date, unless the
      state's original-tag validity is larger, in which case that applies. Each tag has its own sequence number and
      the order always records the tag currently on the vehicle.
    eligibility:
      - id: tag_state
        applies_to: [title_temp_tag_issued, title_temp_tag_recorded]
        kind: state
        condition: "A tag is issued only while the order's status is awaiting_documents, ready_to_submit, submitted or rejected; once registration is issued no tag is issued."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [awaiting_documents, ready_to_submit, submitted, rejected]
      - id: before_tag_expiry
        applies_to: [title_temp_tag_issued]
        kind: time
        condition: "An extension tag is issued only when the current tag expires before registration is expected, and only on or before the current tag's expiration date recorded on the order."
        evidence_fields: [title_orders.temp_tag_expires_date, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the current tag's expiration date recorded on the order"
          anchor_source: title_orders.temp_tag_expires_date
          relation: not_after
          duration_source: params.extension_after_expiry_days
          unit: calendar_days
          counting_rule: "The tag date is compared as a calendar date; an extension on the expiration date itself is allowed and an extension the day after is not."
          boundary: inclusive
    params:
      extension_after_expiry_days: 0
      state_temp_tag_rules:
        AZ: {original_tag_validity_days: 30, max_extensions: 1}
        TX: {original_tag_validity_days: 60, max_extensions: 1}
        GA: {original_tag_validity_days: 30, max_extensions: 2}
        FL: {original_tag_validity_days: 30, max_extensions: 1}
        NC: {original_tag_validity_days: 30, max_extensions: 1}
        OH: {original_tag_validity_days: 45, max_extensions: 1}
        PA: {original_tag_validity_days: 90, max_extensions: 1}
        CO: {original_tag_validity_days: 60, max_extensions: 2}
      per_tier:
        Kestrel Title-Only Service: {max_temp_tag_extensions_service: "=max_temp_tag_extensions_service", extension_requires_documents_complete: "=extension_requires_documents_complete", extension_request_lead_days: "=extension_request_lead_days"}
        Kestrel In-State Plate Transfer: {max_temp_tag_extensions_service: "=max_temp_tag_extensions_service", extension_requires_documents_complete: "=extension_requires_documents_complete", extension_request_lead_days: "=extension_request_lead_days"}
        Kestrel In-State New Registration: {max_temp_tag_extensions_service: "=max_temp_tag_extensions_service", extension_requires_documents_complete: "=extension_requires_documents_complete", extension_request_lead_days: "=extension_request_lead_days"}
        Kestrel Out-of-State Registration: {max_temp_tag_extensions_service: "=max_temp_tag_extensions_service", extension_requires_documents_complete: "=extension_requires_documents_complete", extension_request_lead_days: "=extension_request_lead_days"}
        Kestrel Out-of-State Registration with Inspection: {max_temp_tag_extensions_service: "=max_temp_tag_extensions_service", extension_requires_documents_complete: "=extension_requires_documents_complete", extension_request_lead_days: "=extension_request_lead_days"}
        Kestrel Specialty Plate Registration: {max_temp_tag_extensions_service: "=max_temp_tag_extensions_service", extension_requires_documents_complete: "=extension_requires_documents_complete", extension_request_lead_days: "=extension_request_lead_days"}

  - id: title_completion
    subject: [title_registration_issued, title_order_completed]
    rule: >-
      When the state issues registration the order records the registration date and plate number; plates and the
      registration card are mailed within the service's plate mailing business days, and title-only paperwork within
      its title-only mailing business days. When a lienholder is recorded, an electronic-title state holds the title
      electronically for the lienholder; with no lien, a paper title received from the state is mailed to the owner
      within the paper title mailing business days. The order completes when the plates and card, or the title-only
      paperwork, are delivered.
    eligibility: []

  - id: title_reimbursements
    subject: [title_reimbursement_paid]
    rule: >-
      Kestrel reimburses three costs, each against a document the customer submits, and each document is reimbursed
      once. A state late-registration penalty is reimbursed in full when the service reimburses late penalties, the
      first submission missed the state's dealer deadline, and the customer returned every required document within
      the customer document due days; when the documents came later and the dealer-deadline switch is true, the
      deadline counts as met and nothing is reimbursed. An expired-temp-tag citation is reimbursed up to the
      service's citation cap when the citation date falls after the current tag expired at a time Kestrel could have
      issued an extension under title_temp_tags and did not, and the citation is submitted within the citation claim
      days after its date. VIN inspection and emissions test fees are reimbursed up to the service's inspection fee
      cap. No order receives more than the service's maximum reimbursements, counted by title_msr_reimbursements.
      Reimbursements are paid within the reimbursement payment business days. Reimbursements are paid only on an
      order whose status is submitted, rejected, registered or completed.
    eligibility:
      - id: reimburse_state
        applies_to: [title_reimbursement_paid]
        kind: state
        condition: "Reimbursements are paid only on an order whose status is submitted, rejected, registered or completed."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [submitted, rejected, registered, completed]
      - id: one_per_document
        applies_to: [title_reimbursement_paid]
        kind: dedup
        condition: "Kestrel reimburses three costs, each against a document the customer submits, and each document is reimbursed once."
        evidence_fields: [title_transactions.citation_number, title_transactions.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_transactions.citation_number]
          action_bindings:
            title_transactions.citation_number: citation_number
        dedup_contract:
          table: title_transactions
          mode: separate_record
          object_bindings: {citation_number: citation_number}
          duplicate_filters: {event_type: [title_reimbursement_paid]}
          distinct_fields: []
    params:
      per_tier:
        Kestrel Title-Only Service: {late_penalty_reimbursed: "=late_penalty_reimbursed", citation_reimbursement_cap_usd: "=citation_reimbursement_cap_usd", inspection_fee_reimbursement_cap_usd: "=inspection_fee_reimbursement_cap_usd", max_reimbursements_per_order: "=max_reimbursements_per_order"}
        Kestrel In-State Plate Transfer: {late_penalty_reimbursed: "=late_penalty_reimbursed", citation_reimbursement_cap_usd: "=citation_reimbursement_cap_usd", inspection_fee_reimbursement_cap_usd: "=inspection_fee_reimbursement_cap_usd", max_reimbursements_per_order: "=max_reimbursements_per_order"}
        Kestrel In-State New Registration: {late_penalty_reimbursed: "=late_penalty_reimbursed", citation_reimbursement_cap_usd: "=citation_reimbursement_cap_usd", inspection_fee_reimbursement_cap_usd: "=inspection_fee_reimbursement_cap_usd", max_reimbursements_per_order: "=max_reimbursements_per_order"}
        Kestrel Out-of-State Registration: {late_penalty_reimbursed: "=late_penalty_reimbursed", citation_reimbursement_cap_usd: "=citation_reimbursement_cap_usd", inspection_fee_reimbursement_cap_usd: "=inspection_fee_reimbursement_cap_usd", max_reimbursements_per_order: "=max_reimbursements_per_order"}
        Kestrel Out-of-State Registration with Inspection: {late_penalty_reimbursed: "=late_penalty_reimbursed", citation_reimbursement_cap_usd: "=citation_reimbursement_cap_usd", inspection_fee_reimbursement_cap_usd: "=inspection_fee_reimbursement_cap_usd", max_reimbursements_per_order: "=max_reimbursements_per_order"}
        Kestrel Specialty Plate Registration: {late_penalty_reimbursed: "=late_penalty_reimbursed", citation_reimbursement_cap_usd: "=citation_reimbursement_cap_usd", inspection_fee_reimbursement_cap_usd: "=inspection_fee_reimbursement_cap_usd", max_reimbursements_per_order: "=max_reimbursements_per_order"}
    measures: [title_msr_reimbursements]

  - id: title_cancellation_refunds
    subject: [title_order_cancelled, title_state_fee_refunded]
    rule: >-
      When the purchase is cancelled or the vehicle returned before the order has been submitted, the order is
      cancelled and every held state fee is refunded to the buyer as its own refund entry within the service's state
      fee refund business days. A held fee is refunded only on an order whose status is cancelled or completed. Fees
      already remitted are not refunded when the service's switch is false; when the vehicle is returned after
      registration was issued, Kestrel retitles the vehicle at its own cost and the buyer's remitted fees are not
      refunded. A fee collected in excess of the schedule is refunded after completion. A registration address may
      be corrected before submission without cancelling the order, and a buyer may switch between plate transfer
      and new plates before submission where the service allows it, with the fee entries adjusted to the new
      service's components.
    eligibility:
      - id: refund_state
        applies_to: [title_state_fee_refunded]
        kind: state
        condition: "A held fee is refunded only on an order whose status is cancelled or completed."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [cancelled, completed]
    params:
      per_tier:
        Kestrel Title-Only Service: {state_fee_refund_business_days: "=state_fee_refund_business_days", fees_refundable_after_submission: "=fees_refundable_after_submission"}
        Kestrel In-State Plate Transfer: {state_fee_refund_business_days: "=state_fee_refund_business_days", fees_refundable_after_submission: "=fees_refundable_after_submission"}
        Kestrel In-State New Registration: {state_fee_refund_business_days: "=state_fee_refund_business_days", fees_refundable_after_submission: "=fees_refundable_after_submission"}
        Kestrel Out-of-State Registration: {state_fee_refund_business_days: "=state_fee_refund_business_days", fees_refundable_after_submission: "=fees_refundable_after_submission"}
        Kestrel Out-of-State Registration with Inspection: {state_fee_refund_business_days: "=state_fee_refund_business_days", fees_refundable_after_submission: "=fees_refundable_after_submission"}
        Kestrel Specialty Plate Registration: {state_fee_refund_business_days: "=state_fee_refund_business_days", fees_refundable_after_submission: "=fees_refundable_after_submission"}
