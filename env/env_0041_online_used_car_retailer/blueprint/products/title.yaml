# Product charter: Title & Registration Services (Kestrel Auto). Generated by erl-scenario-blueprint.
# One holding = one title and registration order for one purchased vehicle, from the signed agreement
# through temporary tags, the customer's documents, state submission, registration and plates.

category: title
display_name: Title & Registration Services

binding:
  holding_table: title_orders
  event_tables: [title_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {state_fees_held: state_fees_held}

lifecycle:
  states: [awaiting_documents, ready_to_submit, submitted, rejected, registered, completed, cancelled]
  transitions:
    - {from: awaiting_documents, to: ready_to_submit, by: agent, means: "Every required document has been received in acceptable form."}
    - {from: ready_to_submit, to: submitted, by: agent, means: "The registration packet is submitted to the state or county."}
    - {from: submitted, to: rejected, by: system, means: "The state returns the packet with a rejection reason."}
    - {from: rejected, to: ready_to_submit, by: agent, means: "The rejection is cured with documents or fees already in hand."}
    - {from: rejected, to: awaiting_documents, by: agent, means: "The rejection needs a corrected document from the customer."}
    - {from: submitted, to: registered, by: system, means: "The state issues the title and registration (or, for title-only, the title)."}
    - {from: registered, to: completed, by: system, means: "Plates and registration card, or title-only paperwork, reach the customer."}
    - {from: awaiting_documents, to: cancelled, by: agent, means: "The order is cancelled before submission because the purchase was cancelled or the vehicle returned."}
    - {from: ready_to_submit, to: cancelled, by: agent, means: "The order is cancelled before submission because the purchase was cancelled or the vehicle returned."}
    - {from: rejected, to: cancelled, by: agent, means: "A rejected order is cancelled because the purchase was cancelled or the vehicle returned."}

accounts:
  - key: state_fees_held
    unit: USD
    meaning: "State title, registration, plate, lien and temp tag fees collected from the buyer and not yet remitted to the state or refunded."

parameter_schema:
  required_documents: Documents that must be received in acceptable form before the order is ready to submit, list of document_type values
  wet_ink_documents: Documents the state accepts only as wet-ink originals for this service (others may be e-signed), list of document_type values
  scan_accepted_documents: Documents that may be accepted as a scan or photo, list of document_type values
  proof_of_residence_max_age_days: Maximum age of a proof of residence (utility bill, lease, bank statement) counted from its statement date to the date received, integer days
  insurance_must_list_vin: Whether the proof of insurance must show the purchased VIN, boolean
  odometer_disclosure_exempt_age_years: Model age at or above which no odometer disclosure is required, integer years
  customer_document_due_days: Calendar days after the order is opened within which the customer should return every required document (opened date = day 0), integer days
  inspection_due_days_after_handover: Calendar days after handover within which the VIN inspection and emissions certificate must be obtained (0 = not required), integer days
  prior_plate_must_match_buyer: Whether a plate being transferred must be registered to the buyer named on the agreement, boolean
  state_fee_components: State fees collected for this service from the registration state's fee schedule, list of fee_type values (lien recording added when a lienholder is recorded)
  extension_tag_fee_charged_to_customer: Whether the state temp tag fee on an extension tag is collected from the customer, boolean
  state_fee_refund_business_days: Business days after cancellation or after an overcollection is identified within which held state fees are refunded, integer business days
  fees_refundable_after_submission: Whether state fees already remitted are refunded when the order is cancelled after submission, boolean
  fee_shortage_collection_days: Calendar days after a fee-shortage rejection within which the customer must pay the shortfall, integer days
  submission_target_business_days: Business days after the order becomes ready to submit within which Kestrel submits it, integer business days
  resubmission_target_business_days: Business days after a rejected order becomes ready again within which Kestrel resubmits it, integer business days
  max_dmv_submissions: Submissions of one order to the state after which it is referred to the title escalations team, integer count
  registration_completion_target_days: Calendar days after opening by which registration is normally issued, integer days
  plate_mailing_business_days: Business days after registration is issued within which plates and registration card are mailed, integer business days
  county_submission_by_mail: Whether the packet goes to the buyer's county office by mail rather than electronically, boolean
  title_only_document_mail_business_days: Business days after the title is issued within which title-only paperwork is mailed to the buyer (0 = not title-only), integer business days
  temp_tag_issued_at_handover: Whether the original temporary tag is issued at handover, boolean
  extension_request_lead_days: Calendar days before the current tag's expiration date from which an extension tag can be issued, integer days
  extension_requires_documents_complete: Whether an extension tag is issued only after every required document has been received, boolean
  max_temp_tag_extensions_service: Kestrel's own limit on extension tags for this service, applied together with the state's limit (the lower governs), integer count
  extension_tag_validity_days: Validity of an extension tag, integer days (the state's original-tag validity is used when this is larger)
  late_penalty_reimbursed: Whether a state late-registration penalty is reimbursed when Kestrel submitted after the state's dealer deadline and the customer returned documents on time, boolean
  citation_reimbursement_cap_usd: Maximum reimbursed for an expired-temp-tag citation issued while Kestrel owed the customer an extension tag, USD
  citation_claim_days: Calendar days after the citation date within which the citation must be submitted, integer days
  inspection_fee_reimbursement_cap_usd: Maximum reimbursed for the buyer's VIN inspection and emissions test fees, USD
  reimbursement_payment_business_days: Business days after approval within which a reimbursement is paid, integer business days
  max_reimbursements_per_order: Maximum reimbursement entries per order across all reasons, integer count
  address_change_before_submission_allowed: Whether the registration address can be corrected before submission without a new order, boolean
  plate_choice_change_before_submission_allowed: Whether a buyer may switch between plate transfer and new plates before submission (changing the service type), boolean
  cancel_on_return_before_submission: Whether the order is cancelled when the vehicle is returned or the purchase cancelled before submission, boolean
  retitle_on_return_after_registration: Whether Kestrel retitles the vehicle at its own cost when it is returned after registration was issued, boolean
  lien_recorded_on_title: Whether a lienholder on the purchase is recorded on the new title, boolean
  electronic_title_states: Registration states that issue an electronic title held by the lienholder rather than a paper title, list of states
  paper_title_mail_business_days: Business days after a paper title is received from the state within which it is mailed to an owner with no lien, integer business days
  dealer_deadline_extension_on_customer_delay: Whether the state dealer deadline is treated as met when the delay was caused by documents the customer returned after the document due days, boolean
  submission_requires_insurance_verified: Whether the packet is submitted only after the purchase order shows insurance verified, boolean
  specialty_plate_annual_fee_collected: Whether the specialty plate fee is collected with the other state fees at signing, boolean
  rejection_customer_response_days: Calendar days the customer has to supply a corrected document after a rejection that needs one, integer days
  vin_inspection_providers: Who may perform the VIN inspection for this service, list
  emissions_counties_only: Whether the emissions certificate is required only for addresses in the state's emissions counties, boolean
  notarized_poa_states: Registration states where the signed power of attorney must be notarized, list of states
  title_hold_for_payoff: Whether the title application waits until the purchase order is fully funded (order balance zero or below), boolean
  odometer_discrepancy_affidavit_required: Whether an odometer discrepancy rejection requires a signed odometer affidavit from the buyer, boolean

