events:
  - type: tradein_offer_created
    target: tradein_agreements
    mutation: create
    meaning: "Kestrel issues a written offer on a customer vehicle from the customer's condition answers."
    grain: "one row per written offer"
    fields:
      customer_id: "vehicle owner"
      variant_name: "condition grade of the offer"
      trade_vin: "VIN of the vehicle"
      trade_vehicle_description: "year, make, model and trim"
      offer_amount: "written offer"
      original_offer_amount: "same as offer_amount at issue"
      offer_date: "date the offer was issued"
      offer_expires_date: "offer_date plus the offer validity days"
      stated_mileage: "mileage the customer stated"
      keys_promised: "keys and fobs declared"
    triggers: []
  - type: tradein_offer_accepted
    target: tradein_agreements
    mutation: {transition: {from: offered, to: accepted}}
    meaning: "The customer accepts the offer, optionally linking it to a Kestrel purchase order."
    grain: "one row per acceptance"
    fields:
      status: "offered -> accepted"
      accepted_date: "date of acceptance"
      purchase_order_id: "purchase order the trade is linked to; empty for an outright sale"
      lienholder_name: "lienholder or lessor; empty when there is none"
      loan_account_number: "account number with the lienholder; empty when there is none"
    triggers: []
  - type: tradein_offer_declined
    target: tradein_agreements
    mutation: {transition: {from: offered, to: declined}}
    meaning: "The customer declines the offer."
    grain: "one row per declined offer"
    fields:
      status: "offered -> declined"
      closed_date: "date of decline"
    triggers: []
  - type: tradein_offer_expired
    target: tradein_agreements
    mutation: {transition: {from: offered, to: expired}}
    meaning: "The offer lapses unaccepted."
    grain: "one row per lapsed offer"
    fields:
      status: "offered -> expired"
      closed_date: "the day after the offer expiration date"
    triggers: []
  - type: tradein_offer_regraded
    target: tradein_agreements
    mutation: update
    meaning: "The pickup inspection finds the vehicle in a lower condition grade and the offer is reissued at that grade."
    grain: "one row per regrade"
    fields:
      variant_name: "new condition grade"
      offer_amount: "regraded offer"
      offer_date: "date of the regrade"
    triggers: []
  - type: tradein_vehicle_picked_up
    target: tradein_agreements
    mutation: {transition: {from: accepted, to: picked_up}}
    meaning: "Kestrel takes the vehicle after the pickup inspection."
    grain: "one row per pickup"
    fields:
      status: "accepted -> picked_up"
      pickup_date: "date of pickup or hub drop-off"
      inspected_mileage: "odometer at inspection"
    triggers:
      - event: tradein:tradein_value_credited
        map: {}
  - type: tradein_agreement_cancelled
    target: tradein_agreements
    mutation: {transition: {from: accepted, to: cancelled}}
    meaning: "An accepted agreement ends before pickup."
    grain: "one row per cancellation"
    fields:
      status: "accepted -> cancelled"
      closed_date: "date of cancellation"
    triggers: []
  - type: tradein_title_recorded
    target: tradein_agreements
    mutation: update
    meaning: "Kestrel records that it holds a transferable title for the vehicle."
    grain: "one row per agreement"
    fields:
      title_received_date: "date the completing title document was received"
    triggers: []
  - type: tradein_settled
    target: tradein_agreements
    mutation: {transition: {from: picked_up, to: settled}}
    meaning: "The agreement is fully settled."
    grain: "one row per settled agreement"
    fields:
      status: "picked_up -> settled"
      closed_date: "date of settlement"
    triggers: []

  - type: tradein_value_credited
    target: tradein_transactions
    meaning: "The offer amount in force at pickup is credited as trade value."
    grain: "one row per agreement (credited once at pickup)"
    distinguish_by: [txn_date]
    fields:
      txn_date: "pickup date"
      amount: "offer amount in force at pickup"
    account: trade_equity
    direction: in
    triggers: []
  - type: tradein_value_deducted
    target: tradein_transactions
    meaning: "A deduction is taken from the trade value."
    grain: "one row per deduction reason per agreement per date"
    distinguish_by: [adjustment_type, txn_date]
    fields:
      txn_date: "date of the deduction"
      amount: "deduction amount"
      adjustment_type: "reason for the deduction"
    account: trade_equity
    direction: out
    triggers: []
  - type: tradein_payoff_quote_recorded
    target: tradein_transactions
    meaning: "A lienholder payoff quote, confirmed with the lienholder, is recorded."
    grain: "one row per quote"
    distinguish_by: [quote_reference, txn_date]
    fields:
      txn_date: "date of the quote"
      amount: "payoff amount good through the good-through date"
      payoff_good_through_date: "last date the quote amount is valid"
      per_diem_amount: "daily interest after the good-through date"
      quote_reference: "lienholder's quote reference"
    triggers: []
  - type: tradein_lien_payoff_sent
    target: tradein_transactions
    meaning: "Kestrel sends the payoff to the lienholder."
    grain: "one row per agreement (one payoff per lien)"
    distinguish_by: [source_txn_id]
    fields:
      txn_date: "date the payoff was sent"
      amount: "payoff amount sent, charged against the trade equity"
      source_txn_id: "the payoff quote relied on"
    account: trade_equity
    direction: out
    triggers: []
  - type: tradein_negative_equity_settled
    target: tradein_transactions
    meaning: "A shortfall between the lien payoff and the trade value is covered."
    grain: "one row per covering payment or roll-in"
    distinguish_by: [settlement_method, txn_date]
    fields:
      txn_date: "date covered"
      amount: "shortfall covered"
      settlement_method: "rolled_into_financing or customer_payment"
      linked_reference_id: "the purchase order whose finance contract absorbed it; empty for a customer payment"
    account: trade_equity
    direction: in
    triggers: []
  - type: tradein_equity_applied
    target: tradein_transactions
    meaning: "Positive equity is applied to the linked purchase order."
    grain: "one row per application"
    distinguish_by: [linked_reference_id, txn_date]
    fields:
      txn_date: "date applied"
      amount: "equity applied"
      linked_reference_id: "the purchase order credited"
    account: trade_equity
    direction: out
    triggers:
      - event: purchase:purchase_payment_posted
        map: {payment_source: trade_equity_credit, payment_channel: internal_transfer, amount: amount, txn_date: txn_date, linked_reference_id: trade_in_id}
  - type: tradein_equity_paid_out
    target: tradein_transactions
    meaning: "Positive equity is paid to the customer."
    grain: "one row per payout"
    distinguish_by: [settlement_method, txn_date]
    fields:
      txn_date: "date paid"
      amount: "equity paid"
      settlement_method: "ach_to_customer or check_to_customer"
    account: trade_equity
    direction: out
    triggers: []
  - type: tradein_title_document_received
    target: tradein_transactions
    meaning: "A title document for the vehicle is received."
    grain: "one row per document received"
    distinguish_by: [document_type, txn_date]
    fields:
      txn_date: "date received"
      amount: "0.00"
      document_type: "document received"
    triggers:
      - event: tradein:tradein_title_recorded
        map: {}

measures:
  - id: tradein_msr_open_trades_on_purchase
    window: "current state at the moment of the request"
    measure: "count of tradein_agreements linked to the purchase order whose status is accepted, picked_up or settled"
  - id: tradein_msr_inspection_reduction
    window: "the pickup inspection of the agreement"
    measure: "sum of amount over tradein_value_deducted entries dated the pickup date, plus original_offer_amount minus offer_amount (the reduction made by a regrade at that inspection)"

policies:
  - id: tradein_agg_multi_holding
    subject: [tradein_offer_created]
    rule: >-
      A customer may hold trade-in agreements on any number of vehicles. One vehicle (one trade VIN) may have only
      one agreement that is offered, accepted or picked up at a time; a new offer on the same VIN replaces nothing
      and is issued only when the earlier agreement has reached declined, expired, cancelled or settled.
    eligibility:
      - id: one_open_per_vin
        applies_to: [tradein_offer_created]
        kind: dedup
        condition: "One vehicle (one trade VIN) may have only one agreement that is offered, accepted or picked up at a time; a new offer on the same VIN replaces nothing and is issued only when the earlier agreement has reached declined, expired, cancelled or settled."
        evidence_fields: [tradein_agreements.trade_vin, tradein_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_vin]
          action_bindings:
            tradein_agreements.trade_vin: trade_vin
        dedup_contract:
          table: tradein_agreements
          mode: separate_record
          object_bindings: {trade_vin: trade_vin}
          duplicate_filters: {status: [offered, accepted, picked_up]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: tradein_agg_purchase_link
    subject: [tradein_offer_accepted]
    rule: >-
      An accepted offer may be linked to one of the customer's own Kestrel purchase orders or left unlinked as an
      outright sale when outright sales are allowed. A trade is linked only to a purchase order of the same
      customer whose status is reserved or contracted (the trade link cutoff), and a purchase order may carry no
      more than the maximum trade-ins per purchase, counted by tradein_msr_open_trades_on_purchase. Equity from
      all trades linked to one purchase order is combined on that order as separate trade equity payments, one
      per trade. Holding X changes Y: when the linked purchase order is paid through Kestrel Auto Finance, the
      trade's negative equity may be rolled into that finance contract under tradein_negative_equity; an unlinked
      trade or a trade linked to a cash or outside-lender purchase can only be covered by customer payment.
    eligibility:
      - id: link_target
        applies_to: [tradein_offer_accepted]
        kind: authorization
        condition: "A trade is linked only to a purchase order of the same customer whose status is reserved or contracted (the trade link cutoff), and a purchase order may carry no more than the maximum trade-ins per purchase, counted by tradein_msr_open_trades_on_purchase."
        evidence_fields: [purchase_orders.status, purchase_orders.customer_id, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
    params:
      per_tier:
        Inoperable Condition Offer: {max_trade_ins_per_purchase: "=max_trade_ins_per_purchase", outright_sale_allowed: "=outright_sale_allowed"}
        Rough Condition Offer: {max_trade_ins_per_purchase: "=max_trade_ins_per_purchase", outright_sale_allowed: "=outright_sale_allowed"}
        Fair Condition Offer: {max_trade_ins_per_purchase: "=max_trade_ins_per_purchase", outright_sale_allowed: "=outright_sale_allowed"}
        Good Condition Offer: {max_trade_ins_per_purchase: "=max_trade_ins_per_purchase", outright_sale_allowed: "=outright_sale_allowed"}
        Very Good Condition Offer: {max_trade_ins_per_purchase: "=max_trade_ins_per_purchase", outright_sale_allowed: "=outright_sale_allowed"}
        Excellent Condition Offer: {max_trade_ins_per_purchase: "=max_trade_ins_per_purchase", outright_sale_allowed: "=outright_sale_allowed"}
    measures: [tradein_msr_open_trades_on_purchase]

  - id: tradein_offer_acceptance
    subject: [tradein_offer_accepted, tradein_offer_declined, tradein_offer_expired, tradein_offer_created]
    rule: >-
      An offer states one amount for one vehicle at one condition grade, rounded down to the grade's rounding
      increment. The offer is accepted no later than the last day of its validity counted from the offer date.
      Validity is counted in calendar days with the offer date as day 0, so the offer can be accepted through the
      end of the day that is the offer validity days after the offer date, which is the offer expiration date
      recorded on the agreement. A vehicle with a loan or lease is accepted only with the lienholder name and loan
      account number, and a leased vehicle only when lease payoffs are allowed; the lessor's dealer payoff is then
      treated as the lien. An offer that is not accepted by its expiration date lapses; when refresh is allowed
      the customer may request a new offer, which is a new agreement with its own amount, grade and dates, never a
      revival of the old one. A declined offer can likewise only be replaced by a new offer. The customer's
      stated mileage and declared keys are the basis the pickup inspection is measured against.
    eligibility:
      - id: within_validity
        applies_to: [tradein_offer_accepted]
        kind: time
        condition: "The offer is accepted no later than the last day of its validity counted from the offer date."
        evidence_fields: [tradein_agreements.offer_date, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the offer date"
          anchor_source: tradein_agreements.offer_date
          relation: not_after
          duration_source: variants.offer_validity_days
          unit: calendar_days
          counting_rule: "Validity is counted in calendar days with the offer date as day 0, so the offer can be accepted through the end of the day that is the offer validity days after the offer date, which is the offer expiration date recorded on the agreement."
          boundary: inclusive
      - id: lien_details
        applies_to: [tradein_offer_accepted]
        kind: caller_fact
        condition: "A vehicle with a loan or lease is accepted only with the lienholder name and loan account number, and a leased vehicle only when lease payoffs are allowed; the lessor's dealer payoff is then treated as the lien."
        evidence_fields: [tradein_agreements.lienholder_name, tradein_agreements.loan_account_number, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
    params:
      per_tier:
        Inoperable Condition Offer: {offer_validity_days: "=offer_validity_days", grade_value_factor_pct: "=grade_value_factor_pct"}
        Rough Condition Offer: {offer_validity_days: "=offer_validity_days", grade_value_factor_pct: "=grade_value_factor_pct"}
        Fair Condition Offer: {offer_validity_days: "=offer_validity_days", grade_value_factor_pct: "=grade_value_factor_pct"}
        Good Condition Offer: {offer_validity_days: "=offer_validity_days", grade_value_factor_pct: "=grade_value_factor_pct"}
        Very Good Condition Offer: {offer_validity_days: "=offer_validity_days", grade_value_factor_pct: "=grade_value_factor_pct"}
        Excellent Condition Offer: {offer_validity_days: "=offer_validity_days", grade_value_factor_pct: "=grade_value_factor_pct"}

  - id: tradein_pickup_inspection
    subject: [tradein_vehicle_picked_up, tradein_offer_regraded, tradein_value_credited, tradein_value_deducted]
    rule: >-
      The vehicle is picked up (or dropped at a hub when the grade allows it) after an inspection against what the
      customer stated. The pickup is completed no later than the last day of the pickup window counted from the
      acceptance date. The pickup window is counted in calendar days with the acceptance date as day 0 and ends at
      the end of the last day of the grade's pickup window; an accepted agreement still not picked up after that
      day is cancelled and a new offer is needed. At pickup the registration must be current when the grade
      requires it, every titled owner signs when required, and a federal odometer disclosure is signed for
      vehicles younger than the odometer disclosure model years. Inspection findings are handled in this order.
      First, undisclosed damage whose repair estimate exceeds the grade's regrade threshold regrades the offer one
      grade down, once at most per offer: the regraded offer is the current offer times the lower grade's value
      factor divided by the current grade's value factor, rounded down to the rounding increment; undisclosed
      damage at or below the threshold, or on an Inoperable offer, is deducted at its repair estimate instead.
      Then each remaining finding is deducted at the rates of the grade in force after any regrade: the mileage
      deduction when the inspected mileage exceeds the stated mileage by more than the mileage tolerance, charged
      on every mile above the stated mileage; the missing key deduction for each declared key not handed over;
      the warning light, smoke or odor, and aftermarket modification deductions when found and not disclosed; the
      tire deduction for each tire below the grade's minimum tread; and the towing fee when the vehicle is towed.
      When the inspection reduction, counted by tradein_msr_inspection_reduction, exceeds the reacceptance
      threshold of the grade in force before inspection, the customer must re-accept the adjusted offer before
      pickup completes and may instead decline and keep the vehicle, which cancels the agreement. The value
      credited at pickup is the offer amount in force at that moment, and deductions post as separate entries.
      Value is credited or deducted only on an agreement whose status is picked_up. A regrade is recorded only on
      an agreement whose status is accepted.
    eligibility:
      - id: within_pickup_window
        applies_to: [tradein_vehicle_picked_up]
        kind: time
        condition: "The pickup is completed no later than the last day of the pickup window counted from the acceptance date."
        evidence_fields: [tradein_agreements.accepted_date, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the acceptance date"
          anchor_source: tradein_agreements.accepted_date
          relation: not_after
          duration_source: variants.pickup_window_days_after_acceptance
          unit: calendar_days
          counting_rule: "The pickup window is counted in calendar days with the acceptance date as day 0 and ends at the end of the last day of the grade's pickup window; an accepted agreement still not picked up after that day is cancelled and a new offer is needed."
          boundary: inclusive
      - id: value_on_picked_up
        applies_to: [tradein_value_credited, tradein_value_deducted]
        kind: state
        condition: "Value is credited or deducted only on an agreement whose status is picked_up."
        evidence_fields: [tradein_agreements.status, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        state_contract:
          field: tradein_agreements.status
          allowed: [picked_up]
      - id: regrade_on_accepted
        applies_to: [tradein_offer_regraded]
        kind: state
        condition: "A regrade is recorded only on an agreement whose status is accepted."
        evidence_fields: [tradein_agreements.status, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        state_contract:
          field: tradein_agreements.status
          allowed: [accepted]
    params:
      per_tier:
        Inoperable Condition Offer: {mileage_overage_deduction_per_mile: "=mileage_overage_deduction_per_mile", missing_key_deduction_usd: "=missing_key_deduction_usd", undisclosed_damage_regrade_threshold_usd: "=undisclosed_damage_regrade_threshold_usd", reacceptance_threshold_usd: "=reacceptance_threshold_usd", pickup_window_days_after_acceptance: "=pickup_window_days_after_acceptance"}
        Rough Condition Offer: {mileage_overage_deduction_per_mile: "=mileage_overage_deduction_per_mile", missing_key_deduction_usd: "=missing_key_deduction_usd", undisclosed_damage_regrade_threshold_usd: "=undisclosed_damage_regrade_threshold_usd", reacceptance_threshold_usd: "=reacceptance_threshold_usd", pickup_window_days_after_acceptance: "=pickup_window_days_after_acceptance"}
        Fair Condition Offer: {mileage_overage_deduction_per_mile: "=mileage_overage_deduction_per_mile", missing_key_deduction_usd: "=missing_key_deduction_usd", undisclosed_damage_regrade_threshold_usd: "=undisclosed_damage_regrade_threshold_usd", reacceptance_threshold_usd: "=reacceptance_threshold_usd", pickup_window_days_after_acceptance: "=pickup_window_days_after_acceptance"}
        Good Condition Offer: {mileage_overage_deduction_per_mile: "=mileage_overage_deduction_per_mile", missing_key_deduction_usd: "=missing_key_deduction_usd", undisclosed_damage_regrade_threshold_usd: "=undisclosed_damage_regrade_threshold_usd", reacceptance_threshold_usd: "=reacceptance_threshold_usd", pickup_window_days_after_acceptance: "=pickup_window_days_after_acceptance"}
        Very Good Condition Offer: {mileage_overage_deduction_per_mile: "=mileage_overage_deduction_per_mile", missing_key_deduction_usd: "=missing_key_deduction_usd", undisclosed_damage_regrade_threshold_usd: "=undisclosed_damage_regrade_threshold_usd", reacceptance_threshold_usd: "=reacceptance_threshold_usd", pickup_window_days_after_acceptance: "=pickup_window_days_after_acceptance"}
        Excellent Condition Offer: {mileage_overage_deduction_per_mile: "=mileage_overage_deduction_per_mile", missing_key_deduction_usd: "=missing_key_deduction_usd", undisclosed_damage_regrade_threshold_usd: "=undisclosed_damage_regrade_threshold_usd", reacceptance_threshold_usd: "=reacceptance_threshold_usd", pickup_window_days_after_acceptance: "=pickup_window_days_after_acceptance"}
    formula:
      when: "inspected_mileage - stated_mileage > offer_mileage_tolerance_miles"
      mileage_deduction: "round((inspected_mileage - stated_mileage) * mileage_overage_deduction_per_mile, 2)"
    measures: [tradein_msr_inspection_reduction]

  - id: tradein_lien_payoff
    subject: [tradein_payoff_quote_recorded, tradein_lien_payoff_sent]
    rule: >-
      Kestrel pays off a lien or lease on the traded vehicle directly to the lienholder. A payoff quote is
      recorded only after Kestrel has confirmed it directly with the lienholder when verification is required;
      the customer's own account screenshot or statement is not a payoff quote. The payoff is sent only on an
      agreement whose status is picked_up. The payoff relies on a quote whose age, counted from the quote date,
      is no more than the payoff quote max age on the send date. Quote age is counted in calendar days from the quote date as day 0; a quote whose
      age on the send date is greater than the maximum must be replaced by a new confirmed quote before anything
      is sent. The amount sent is the quote amount when sent on or before the quote's good-through date, and
      otherwise the quote amount plus the quote's per-diem amount for each calendar day after the good-through
      date through the send date. When the payoff is sent later than the grade's payoff send business days after
      pickup and the late per-diem switch is true, the per diem for the days beyond Kestrel's own deadline is
      borne by Kestrel and is not charged against the trade equity. When negative equity must be cleared first,
      the payoff is sent only after the shortfall has been covered under tradein_negative_equity. Each agreement
      has one lien payoff; any overpayment the lienholder returns goes from the lienholder to the customer.
    eligibility:
      - id: payoff_on_picked_up
        applies_to: [tradein_lien_payoff_sent]
        kind: state
        condition: "The payoff is sent only on an agreement whose status is picked_up."
        evidence_fields: [tradein_agreements.status, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        state_contract:
          field: tradein_agreements.status
          allowed: [picked_up]
      - id: quote_age
        applies_to: [tradein_lien_payoff_sent]
        kind: time
        condition: "The payoff relies on a quote whose age, counted from the quote date, is no more than the payoff quote max age on the send date."
        evidence_fields: [tradein_transactions.txn_date, tradein_transactions.tradein_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_transactions.tradein_txn_id]
          action_bindings:
            tradein_transactions.tradein_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the quote date"
          anchor_source: tradein_transactions.txn_date
          relation: not_after
          duration_source: variants.payoff_quote_max_age_days
          unit: calendar_days
          counting_rule: "Quote age is counted in calendar days from the quote date as day 0; a quote whose age on the send date is greater than the maximum must be replaced by a new confirmed quote before anything is sent."
          boundary: inclusive
      - id: one_payoff
        applies_to: [tradein_lien_payoff_sent]
        kind: dedup
        condition: "Each agreement has one lien payoff; any overpayment the lienholder returns goes from the lienholder to the customer."
        evidence_fields: [tradein_transactions.trade_in_id, tradein_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_transactions.trade_in_id]
          action_bindings:
            tradein_transactions.trade_in_id: trade_in_id
        dedup_contract:
          table: tradein_transactions
          mode: separate_record
          object_bindings: {trade_in_id: trade_in_id}
          duplicate_filters: {event_type: [tradein_lien_payoff_sent]}
          distinct_fields: []
    params:
      per_tier:
        Inoperable Condition Offer: {payoff_quote_max_age_days: "=payoff_quote_max_age_days", payoff_send_business_days: "=payoff_send_business_days", kestrel_absorbs_late_per_diem: "=kestrel_absorbs_late_per_diem"}
        Rough Condition Offer: {payoff_quote_max_age_days: "=payoff_quote_max_age_days", payoff_send_business_days: "=payoff_send_business_days", kestrel_absorbs_late_per_diem: "=kestrel_absorbs_late_per_diem"}
        Fair Condition Offer: {payoff_quote_max_age_days: "=payoff_quote_max_age_days", payoff_send_business_days: "=payoff_send_business_days", kestrel_absorbs_late_per_diem: "=kestrel_absorbs_late_per_diem"}
        Good Condition Offer: {payoff_quote_max_age_days: "=payoff_quote_max_age_days", payoff_send_business_days: "=payoff_send_business_days", kestrel_absorbs_late_per_diem: "=kestrel_absorbs_late_per_diem"}
        Very Good Condition Offer: {payoff_quote_max_age_days: "=payoff_quote_max_age_days", payoff_send_business_days: "=payoff_send_business_days", kestrel_absorbs_late_per_diem: "=kestrel_absorbs_late_per_diem"}
        Excellent Condition Offer: {payoff_quote_max_age_days: "=payoff_quote_max_age_days", payoff_send_business_days: "=payoff_send_business_days", kestrel_absorbs_late_per_diem: "=kestrel_absorbs_late_per_diem"}

  - id: tradein_negative_equity
    subject: [tradein_negative_equity_settled]
    rule: >-
      Negative equity is the amount by which the payoff due exceeds the value credited less deductions. It is
      covered either by rolling it into the Kestrel Auto Finance contract of the linked purchase, when the grade
      allows roll-in and the finance contract is signed with the shortfall included in the amount financed, or by
      the customer's own payment on one of the accepted shortfall channels within the negative equity payment
      days after pickup. Negative equity is covered only on an agreement whose status is accepted or picked_up. A
      roll-in is recorded with the linked purchase order and is limited by the finance tier's negative equity
      limit; whatever the finance contract cannot absorb must be paid by the customer. A title-delay chargeback
      that leaves the equity negative is paid by the customer within the chargeback payment days. Card payments
      are not accepted for a shortfall.
    eligibility:
      - id: shortfall_state
        applies_to: [tradein_negative_equity_settled]
        kind: state
        condition: "Negative equity is covered only on an agreement whose status is accepted or picked_up."
        evidence_fields: [tradein_agreements.status, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        state_contract:
          field: tradein_agreements.status
          allowed: [accepted, picked_up]
    params:
      per_tier:
        Inoperable Condition Offer: {negative_equity_roll_in_allowed: "=negative_equity_roll_in_allowed", negative_equity_payment_days: "=negative_equity_payment_days"}
        Rough Condition Offer: {negative_equity_roll_in_allowed: "=negative_equity_roll_in_allowed", negative_equity_payment_days: "=negative_equity_payment_days"}
        Fair Condition Offer: {negative_equity_roll_in_allowed: "=negative_equity_roll_in_allowed", negative_equity_payment_days: "=negative_equity_payment_days"}
        Good Condition Offer: {negative_equity_roll_in_allowed: "=negative_equity_roll_in_allowed", negative_equity_payment_days: "=negative_equity_payment_days"}
        Very Good Condition Offer: {negative_equity_roll_in_allowed: "=negative_equity_roll_in_allowed", negative_equity_payment_days: "=negative_equity_payment_days"}
        Excellent Condition Offer: {negative_equity_roll_in_allowed: "=negative_equity_roll_in_allowed", negative_equity_payment_days: "=negative_equity_payment_days"}

  - id: tradein_equity_distribution
    subject: [tradein_equity_applied, tradein_equity_paid_out]
    rule: >-
      Positive equity is distributed only once its amount is final: after the lien payoff has been sent, or after
      pickup when there is no lien. Equity is distributed only on an agreement whose status is picked_up. For a
      trade linked to a purchase order that is still contracted, the whole positive equity balance is applied to
      that order as a trade equity payment within the equity apply business days. For an outright sale, or when
      the linked purchase order is no longer contracted (cancelled before the equity was applied), the equity is
      paid to the customer by ACH or check within the payout business days, and only after a transferable title
      or lien release is in hand when the payout hold switch is true. Equity is never split between the purchase
      and a payout. When the linked purchase is later returned under the 7-day return, Kestrel keeps the traded
      vehicle and the purchase refunds the applied equity to the customer as cash; the trade agreement itself is
      not reopened.
    eligibility:
      - id: distribution_state
        applies_to: [tradein_equity_applied, tradein_equity_paid_out]
        kind: state
        condition: "Equity is distributed only on an agreement whose status is picked_up."
        evidence_fields: [tradein_agreements.status, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        state_contract:
          field: tradein_agreements.status
          allowed: [picked_up]
    params:
      per_tier:
        Inoperable Condition Offer: {equity_apply_business_days: "=equity_apply_business_days", positive_equity_payout_business_days: "=positive_equity_payout_business_days", payout_hold_until_title_received: "=payout_hold_until_title_received"}
        Rough Condition Offer: {equity_apply_business_days: "=equity_apply_business_days", positive_equity_payout_business_days: "=positive_equity_payout_business_days", payout_hold_until_title_received: "=payout_hold_until_title_received"}
        Fair Condition Offer: {equity_apply_business_days: "=equity_apply_business_days", positive_equity_payout_business_days: "=positive_equity_payout_business_days", payout_hold_until_title_received: "=payout_hold_until_title_received"}
        Good Condition Offer: {equity_apply_business_days: "=equity_apply_business_days", positive_equity_payout_business_days: "=positive_equity_payout_business_days", payout_hold_until_title_received: "=payout_hold_until_title_received"}
        Very Good Condition Offer: {equity_apply_business_days: "=equity_apply_business_days", positive_equity_payout_business_days: "=positive_equity_payout_business_days", payout_hold_until_title_received: "=payout_hold_until_title_received"}
        Excellent Condition Offer: {equity_apply_business_days: "=equity_apply_business_days", positive_equity_payout_business_days: "=positive_equity_payout_business_days", payout_hold_until_title_received: "=payout_hold_until_title_received"}
    formula:
      equity_to_distribute: "max(0, equity_balance)"

  - id: tradein_title_receipt
    subject: [tradein_title_document_received, tradein_title_recorded, tradein_value_deducted]
    rule: >-
      A vehicle without a lien is picked up only with its signed paper title when the grade requires it. For a
      liened vehicle, Kestrel waits up to the lien release wait days after sending the payoff for the
      lienholder's paper title or electronic lien release; after that the customer is asked for a lien release
      letter or, when the title was lost, a duplicate title. Only the accepted title documents complete the title
      requirement, and the title received date is recorded on the agreement when the first of them arrives. A
      title-delay chargeback may be taken only after the title delay chargeback days counted from the pickup date
      have passed with no title received date. The chargeback period is counted in calendar days with the pickup
      date as day 0 and the chargeback is allowed from the day after its last day. The chargeback is the grade's
      chargeback percentage of the value credited, deducted as a title_delay_chargeback entry; it is reversed by
      nothing in this charter, and the customer then owes the resulting shortfall within the chargeback payment
      days.
    eligibility:
      - id: chargeback_timing
        applies_to: [tradein_value_deducted]
        kind: time
        condition: "A title-delay chargeback may be taken only after the title delay chargeback days counted from the pickup date have passed with no title received date."
        evidence_fields: [tradein_agreements.pickup_date, tradein_agreements.title_received_date, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the pickup date"
          anchor_source: tradein_agreements.pickup_date
          relation: not_before
          duration_source: variants.title_delay_chargeback_days
          unit: calendar_days
          counting_rule: "The chargeback period is counted in calendar days with the pickup date as day 0 and the chargeback is allowed from the day after its last day."
          boundary: exclusive
    params:
      per_tier:
        Inoperable Condition Offer: {lien_release_wait_days: "=lien_release_wait_days", title_delay_chargeback_days: "=title_delay_chargeback_days", title_delay_chargeback_pct: "=title_delay_chargeback_pct"}
        Rough Condition Offer: {lien_release_wait_days: "=lien_release_wait_days", title_delay_chargeback_days: "=title_delay_chargeback_days", title_delay_chargeback_pct: "=title_delay_chargeback_pct"}
        Fair Condition Offer: {lien_release_wait_days: "=lien_release_wait_days", title_delay_chargeback_days: "=title_delay_chargeback_days", title_delay_chargeback_pct: "=title_delay_chargeback_pct"}
        Good Condition Offer: {lien_release_wait_days: "=lien_release_wait_days", title_delay_chargeback_days: "=title_delay_chargeback_days", title_delay_chargeback_pct: "=title_delay_chargeback_pct"}
        Very Good Condition Offer: {lien_release_wait_days: "=lien_release_wait_days", title_delay_chargeback_days: "=title_delay_chargeback_days", title_delay_chargeback_pct: "=title_delay_chargeback_pct"}
        Excellent Condition Offer: {lien_release_wait_days: "=lien_release_wait_days", title_delay_chargeback_days: "=title_delay_chargeback_days", title_delay_chargeback_pct: "=title_delay_chargeback_pct"}

  - id: tradein_settlement
    subject: [tradein_settled]
    rule: >-
      A picked-up agreement is settled when all three hold: the lien payoff has been sent or there was no lien,
      the title received date is recorded, and the equity balance is exactly zero. An agreement with a negative
      balance stays open until the shortfall is covered; one with a positive balance stays open until the
      equity is applied or paid out.
    eligibility:
      - id: settle_conditions
        applies_to: [tradein_settled]
        kind: authorization
        condition: "A picked-up agreement is settled when all three hold: the lien payoff has been sent or there was no lien, the title received date is recorded, and the equity balance is exactly zero."
        evidence_fields: [tradein_agreements.equity_balance, tradein_agreements.title_received_date, tradein_agreements.lienholder_name, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id

  - id: tradein_cancellation
    subject: [tradein_agreement_cancelled]
    rule: >-
      An accepted agreement ends before pickup when the customer withdraws, when the customer declines an adjusted
      offer at pickup, when the pickup window passes without a pickup, or, when the cancel-on-purchase-cancellation
      switch is true, when the linked purchase order is cancelled before pickup. Nothing is credited or deducted on
      a cancelled agreement and any quote recorded on it lapses with it. Once the vehicle is picked up the agreement
      can no longer be cancelled; a customer who wants the vehicle back after pickup is outside this charter.
    eligibility: []
    params:
      per_tier:
        Inoperable Condition Offer: {cancel_on_purchase_cancellation: "=cancel_on_purchase_cancellation", decline_at_pickup_allowed: "=decline_at_pickup_allowed"}
        Rough Condition Offer: {cancel_on_purchase_cancellation: "=cancel_on_purchase_cancellation", decline_at_pickup_allowed: "=decline_at_pickup_allowed"}
        Fair Condition Offer: {cancel_on_purchase_cancellation: "=cancel_on_purchase_cancellation", decline_at_pickup_allowed: "=decline_at_pickup_allowed"}
        Good Condition Offer: {cancel_on_purchase_cancellation: "=cancel_on_purchase_cancellation", decline_at_pickup_allowed: "=decline_at_pickup_allowed"}
        Very Good Condition Offer: {cancel_on_purchase_cancellation: "=cancel_on_purchase_cancellation", decline_at_pickup_allowed: "=decline_at_pickup_allowed"}
        Excellent Condition Offer: {cancel_on_purchase_cancellation: "=cancel_on_purchase_cancellation", decline_at_pickup_allowed: "=decline_at_pickup_allowed"}
