events:
  - type: warranty_contract_sold
    target: service_contracts
    mutation: create
    meaning: "A KestrelCare plan is sold on a purchased vehicle, with the vehicle or afterwards."
    grain: "one row per plan sold"
    fields:
      customer_id: "holder"
      purchase_order_id: "purchase order of the vehicle"
      vin: "covered VIN"
      variant_name: "plan"
      contract_price: "plan price"
      term_months: "term months chosen"
      term_miles: "term miles chosen"
      deductible_usd: "deductible chosen"
      sale_date: "sale date"
      sold_with_vehicle: "true when signed with the purchase agreement"
      odometer_at_sale: "odometer on the declarations page"
      coverage_start_date: "handover date for plans sold with the vehicle; sale date plus waiting period days otherwise"
      coverage_start_odometer: "odometer at sale, plus waiting period miles for plans bought later"
      expiration_date: "sale date plus term months"
      expiration_odometer: "odometer at sale plus term miles"
      financed: "whether the price is in a finance contract"
      finance_contract_id: "finance contract when financed"
    triggers: []
  - type: warranty_coverage_activated
    target: service_contracts
    mutation: {transition: {from: pending, to: active}}
    meaning: "Coverage starts."
    grain: "one row per plan"
    fields:
      status: "pending -> active"
    triggers:
      - event: warranty:warranty_limit_established
        map: {}
  - type: warranty_contract_cancelled
    target: service_contracts
    mutation: {transition: [{from: pending, to: cancelled}, {from: active, to: cancelled}]}
    meaning: "The plan is cancelled and its refund determined."
    grain: "one row per cancellation"
    fields:
      status: "pending or active -> cancelled"
      closed_date: "cancellation effective date (the request date)"
    triggers:
      - event: warranty:warranty_cancellation_refund_issued
        map: {}
  - type: warranty_contract_expired
    target: service_contracts
    mutation: {transition: {from: active, to: expired}}
    meaning: "The term ends."
    grain: "one row per plan"
    fields:
      status: "active -> expired"
      closed_date: "the earlier of the expiration date and the date the expiration odometer was reached"
    triggers: []
  - type: warranty_limit_exhausted
    target: service_contracts
    mutation: {transition: {from: active, to: exhausted}}
    meaning: "The aggregate limit is used up."
    grain: "one row per plan"
    fields:
      status: "active -> exhausted"
      closed_date: "date of the payment that used up the limit"
    triggers: []
  - type: warranty_contract_transferred
    target: service_contracts
    mutation: {transition: {from: active, to: transferred}}
    meaning: "The plan passes to the private buyer of the vehicle."
    grain: "one row per transfer"
    fields:
      status: "active -> transferred"
      transfer_count: "incremented by one"
      closed_date: "transfer date"
    triggers:
      - event: warranty:warranty_transfer_fee_charged
        map: {}

  - type: warranty_limit_established
    target: service_contract_transactions
    meaning: "The aggregate limit of liability is opened when coverage starts."
    grain: "one row per plan"
    distinguish_by: [txn_date]
    fields:
      txn_date: "coverage start date"
      amount: "the lesser of the plan's aggregate limit and the vehicle price on the purchase order"
    account: coverage_remaining
    direction: in
    triggers: []
  - type: warranty_claim_adjudicated
    target: service_contract_transactions
    meaning: "A repair facility's authorization request is decided."
    grain: "one row per repair order"
    distinguish_by: [repair_order_number]
    fields:
      txn_date: "decision date"
      amount: "amount payable to the facility (0.00 when denied)"
      repair_order_number: "repair order number"
      failure_date: "date the failure was reported to the facility"
      odometer_at_failure: "odometer on the repair order"
      component_system: "system of the failed part"
      claim_decision: "approved or a denial code"
      requested_amount: "estimate at the capped labor rate"
      deductible_amount: "deductible applied"
      repair_facility_type: "facility type"
    triggers:
      - event: warranty:warranty_claim_paid
        when: {claim_decision: approved}
        map: {amount: amount, repair_order_number: repair_order_number, source_txn_id: warranty_txn_id}
  - type: warranty_claim_paid
    target: service_contract_transactions
    meaning: "An approved claim is paid to the facility and charged against the limit."
    grain: "one row per approved repair order"
    distinguish_by: [source_txn_id]
    fields:
      txn_date: "payment date"
      amount: "amount paid"
      repair_order_number: "repair order paid"
      source_txn_id: "the adjudication paid"
    account: coverage_remaining
    direction: out
    triggers: []
  - type: warranty_claim_payment_recovered
    target: service_contract_transactions
    meaning: "A claim payment made in error is recovered and the limit restored."
    grain: "one row per recovered payment"
    distinguish_by: [source_txn_id]
    fields:
      txn_date: "recovery date"
      amount: "amount recovered"
      source_txn_id: "the payment recovered"
    account: coverage_remaining
    direction: in
    triggers: []
  - type: warranty_benefit_reimbursed
    target: service_contract_transactions
    meaning: "A rental, towing or trip interruption cost on a covered repair is reimbursed to the holder."
    grain: "one row per benefit type per repair order"
    distinguish_by: [benefit_type, repair_order_number]
    fields:
      txn_date: "reimbursement date"
      amount: "amount reimbursed"
      repair_order_number: "repair order the benefit belongs to"
      benefit_type: "rental_car, towing or trip_interruption"
      benefit_days: "days reimbursed"
    triggers: []
  - type: warranty_cancellation_refund_issued
    target: service_contract_transactions
    meaning: "The refund of a cancelled plan is issued to the holder or the lienholder."
    grain: "one row per cancelled plan"
    distinguish_by: [cancellation_basis]
    fields:
      txn_date: "refund date"
      amount: "refund amount"
      cancellation_basis: "free_look_full_refund, pro_rata or flat_cancel_vehicle_returned"
      refund_payee: "customer or lienholder"
    triggers:
      - event: finance:finance_principal_credited
        when: {refund_payee: lienholder}
        map: {credit_source: service_contract_refund, amount: amount, txn_date: txn_date, linked_reference_id: service_contract_id}
  - type: warranty_transfer_fee_charged
    target: service_contract_transactions
    meaning: "The transfer fee is collected from the selling holder."
    grain: "one row per transfer"
    distinguish_by: [txn_date]
    fields:
      txn_date: "transfer date"
      amount: "transfer fee"
    triggers: []

measures:
  - id: warranty_msr_net_claims_paid
    window: "life of the plan up to the moment of the request"
    measure: "sum of amount over warranty_claim_paid entries less sum of amount over warranty_claim_payment_recovered entries"
  - id: warranty_msr_days_used
    window: "from sale_date to the cancellation request date, calendar days"
    measure: "number of calendar days the plan has run"
  - id: warranty_msr_term_days
    window: "from sale_date to expiration_date, calendar days"
    measure: "number of calendar days in the full term"
  - id: warranty_msr_miles_used
    window: "from the odometer at sale to the odometer on the cancellation request"
    measure: "odometer_at_request minus odometer_at_sale, floored at 0"
  - id: warranty_msr_open_plans_on_vin
    window: "current portfolio at the moment of the request"
    measure: "count of service_contracts on the same VIN whose status is pending or active"

policies:
  - id: warranty_agg_multi_holding
    subject: [warranty_contract_sold]
    rule: >-
      A customer may hold KestrelCare plans on several vehicles; there is no limit per customer. One vehicle may
      carry only one plan that is pending or active, counted by warranty_msr_open_plans_on_vin; a second plan on the
      same VIN is not sold, and an upgrade means cancelling the existing plan and buying a new one.
    eligibility:
      - id: one_plan_per_vin
        applies_to: [warranty_contract_sold]
        kind: dedup
        condition: "One vehicle may carry only one plan that is pending or active, counted by warranty_msr_open_plans_on_vin; a second plan on the same VIN is not sold, and an upgrade means cancelling the existing plan and buying a new one."
        evidence_fields: [service_contracts.vin, service_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.vin]
          action_bindings:
            service_contracts.vin: vin
        dedup_contract:
          table: service_contracts
          mode: separate_record
          object_bindings: {vin: vin}
          duplicate_filters: {status: [pending, active]}
          distinct_fields: []
    params:
      max_per_customer: null
    measures: [warranty_msr_open_plans_on_vin]

  - id: warranty_agg_vehicle_coverage_stack
    subject: [warranty_claim_adjudicated]
    rule: >-
      Coverage on one vehicle is stacked in a fixed order: a manufacturer warranty or manufacturer certified
      pre-owned warranty pays first, then the Kestrel limited warranty included with the purchase, then the
      KestrelCare plan pays only the part of an approved repair that the earlier coverage did not pay. Holding X
      changes Y: while the Kestrel limited warranty of the purchase order is in force and covers the failed system,
      the plan's adjudication of that repair is limited to what the limited warranty decision left unpaid, and the
      plan's deductible is not applied a second time when the limited warranty already applied one.
    eligibility: []

  - id: warranty_sale_eligibility
    subject: [warranty_contract_sold]
    rule: >-
      A plan is sold only on a vehicle whose model age and odometer at sale are within the plan's limits, with a
      term and deductible from the plan's options. A plan bought after the vehicle sale is sold no later than the
      last day of the post-sale purchase window counted from the vehicle handover date. The window is counted in
      calendar days with the handover date as day 0 and includes its last day; after it the plan is not offered.
      A plan sold with the vehicle starts coverage at handover with no waiting period; a plan bought later starts
      at the later of the sale date plus the waiting period days and the odometer at sale plus the waiting period
      miles. A plan may be included in the amount financed only when it is sold with the vehicle on a Kestrel Auto
      Finance purchase and the finance tier's back-end limit allows it.
    eligibility:
      - id: within_post_sale_window
        applies_to: [warranty_contract_sold]
        kind: time
        condition: "A plan bought after the vehicle sale is sold no later than the last day of the post-sale purchase window counted from the vehicle handover date."
        evidence_fields: [purchase_orders.handover_date, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the vehicle handover date"
          anchor_source: purchase_orders.handover_date
          relation: not_after
          duration_source: variants.post_sale_purchase_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days with the handover date as day 0 and includes its last day; after it the plan is not offered."
          boundary: inclusive
    params:
      per_tier:
        KestrelCare Powertrain: {max_vehicle_age_years_at_sale: "=max_vehicle_age_years_at_sale", max_odometer_at_sale: "=max_odometer_at_sale", waiting_period_days: "=waiting_period_days", waiting_period_miles: "=waiting_period_miles"}
        KestrelCare Powertrain Plus: {max_vehicle_age_years_at_sale: "=max_vehicle_age_years_at_sale", max_odometer_at_sale: "=max_odometer_at_sale", waiting_period_days: "=waiting_period_days", waiting_period_miles: "=waiting_period_miles"}
        KestrelCare Silver: {max_vehicle_age_years_at_sale: "=max_vehicle_age_years_at_sale", max_odometer_at_sale: "=max_odometer_at_sale", waiting_period_days: "=waiting_period_days", waiting_period_miles: "=waiting_period_miles"}
        KestrelCare Gold: {max_vehicle_age_years_at_sale: "=max_vehicle_age_years_at_sale", max_odometer_at_sale: "=max_odometer_at_sale", waiting_period_days: "=waiting_period_days", waiting_period_miles: "=waiting_period_miles"}
        KestrelCare Platinum: {max_vehicle_age_years_at_sale: "=max_vehicle_age_years_at_sale", max_odometer_at_sale: "=max_odometer_at_sale", waiting_period_days: "=waiting_period_days", waiting_period_miles: "=waiting_period_miles"}
        KestrelCare Platinum Exclusionary: {max_vehicle_age_years_at_sale: "=max_vehicle_age_years_at_sale", max_odometer_at_sale: "=max_odometer_at_sale", waiting_period_days: "=waiting_period_days", waiting_period_miles: "=waiting_period_miles"}

  - id: warranty_activation_and_limit
    subject: [warranty_coverage_activated, warranty_limit_established, warranty_contract_expired, warranty_limit_exhausted]
    rule: >-
      Coverage starts on the coverage start date and odometer recorded on the plan; a plan sold with the vehicle
      activates when the vehicle is handed over. At activation the limit of liability is opened at the lesser of the
      plan's aggregate limit and the vehicle price on the purchase order. The limit is opened only on a plan whose
      status is active. The plan expires at the earlier of its expiration date and its expiration odometer, and ends
      as exhausted when claim payments bring the coverage remaining to zero.
    eligibility:
      - id: limit_on_active
        applies_to: [warranty_limit_established]
        kind: state
        condition: "The limit is opened only on a plan whose status is active."
        evidence_fields: [service_contracts.status, service_contracts.service_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.service_contract_id]
          action_bindings:
            service_contracts.service_contract_id: service_contract_id
        state_contract:
          field: service_contracts.status
          allowed: [active]
    params:
      per_tier:
        KestrelCare Powertrain: {aggregate_limit_usd: "=aggregate_limit_usd"}
        KestrelCare Powertrain Plus: {aggregate_limit_usd: "=aggregate_limit_usd"}
        KestrelCare Silver: {aggregate_limit_usd: "=aggregate_limit_usd"}
        KestrelCare Gold: {aggregate_limit_usd: "=aggregate_limit_usd"}
        KestrelCare Platinum: {aggregate_limit_usd: "=aggregate_limit_usd"}
        KestrelCare Platinum Exclusionary: {aggregate_limit_usd: "=aggregate_limit_usd"}

  - id: warranty_claims
    subject: [warranty_claim_adjudicated, warranty_claim_paid, warranty_claim_payment_recovered]
    rule: >-
      A repair facility requests authorization before starting work, and each repair order is decided once. The
      decision follows this order. A failure whose failure date is before the coverage start date, or whose
      repair-order odometer is below the coverage start odometer, is denied_waiting_period. A plan that is
      cancelled, expired, exhausted or transferred at the failure date, or a failure after the expiration date or
      at or above the expiration odometer, is denied_contract_not_in_force. A failed part outside the plan's covered
      components (for a hybrid or EV traction battery, one above the plan's battery capacity threshold) is
      denied_not_covered_component. A failure on a vehicle in commercial use, or a condition documented on the
      purchase inspection or before the sale date, is denied_preexisting_condition. A claim on a maintenance record
      component without proof that manufacturer-scheduled maintenance was done within the tolerance is
      denied_maintenance_records. Otherwise the claim is approved: the estimate is recognized at no more than the
      plan's labor rate cap, diagnostic time only when the plan covers it, the deductible is applied once per visit
      unless waived at a Kestrel network facility, and the amount payable is the lesser of the recognized estimate
      less the deductible, the plan's per-visit limit and the coverage remaining. A claim is paid only on a plan
      whose status is active. A payment found to have been made in error within the payment recovery window is
      recovered and the limit restored. Facilities are paid within the facility payment business days.
    eligibility:
      - id: one_decision_per_ro
        applies_to: [warranty_claim_adjudicated]
        kind: dedup
        condition: "A repair facility requests authorization before starting work, and each repair order is decided once."
        evidence_fields: [service_contract_transactions.repair_order_number, service_contract_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contract_transactions.repair_order_number]
          action_bindings:
            service_contract_transactions.repair_order_number: repair_order_number
        dedup_contract:
          table: service_contract_transactions
          mode: separate_record
          object_bindings: {repair_order_number: repair_order_number}
          duplicate_filters: {event_type: [warranty_claim_adjudicated]}
          distinct_fields: []
      - id: pay_on_active
        applies_to: [warranty_claim_paid]
        kind: state
        condition: "A claim is paid only on a plan whose status is active."
        evidence_fields: [service_contracts.status, service_contracts.service_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.service_contract_id]
          action_bindings:
            service_contracts.service_contract_id: service_contract_id
        state_contract:
          field: service_contracts.status
          allowed: [active]
    params:
      per_tier:
        KestrelCare Powertrain: {covered_components: "=covered_components", per_repair_visit_limit_usd: "=per_repair_visit_limit_usd", labor_rate_cap_usd: "=labor_rate_cap_usd", deductible_waived_at_kestrel_network: "=deductible_waived_at_kestrel_network"}
        KestrelCare Powertrain Plus: {covered_components: "=covered_components", per_repair_visit_limit_usd: "=per_repair_visit_limit_usd", labor_rate_cap_usd: "=labor_rate_cap_usd", deductible_waived_at_kestrel_network: "=deductible_waived_at_kestrel_network"}
        KestrelCare Silver: {covered_components: "=covered_components", per_repair_visit_limit_usd: "=per_repair_visit_limit_usd", labor_rate_cap_usd: "=labor_rate_cap_usd", deductible_waived_at_kestrel_network: "=deductible_waived_at_kestrel_network"}
        KestrelCare Gold: {covered_components: "=covered_components", per_repair_visit_limit_usd: "=per_repair_visit_limit_usd", labor_rate_cap_usd: "=labor_rate_cap_usd", deductible_waived_at_kestrel_network: "=deductible_waived_at_kestrel_network"}
        KestrelCare Platinum: {covered_components: "=covered_components", per_repair_visit_limit_usd: "=per_repair_visit_limit_usd", labor_rate_cap_usd: "=labor_rate_cap_usd", deductible_waived_at_kestrel_network: "=deductible_waived_at_kestrel_network"}
        KestrelCare Platinum Exclusionary: {covered_components: "=covered_components", per_repair_visit_limit_usd: "=per_repair_visit_limit_usd", labor_rate_cap_usd: "=labor_rate_cap_usd", deductible_waived_at_kestrel_network: "=deductible_waived_at_kestrel_network"}
    formula:
      when: "claim_decision == 'approved'"
      amount: "round(max(0, min(requested_amount - deductible_amount, per_repair_visit_limit_usd, coverage_remaining)), 2)"

  - id: warranty_benefits
    subject: [warranty_benefit_reimbursed]
    rule: >-
      Benefits are paid only with an approved claim. Rental is reimbursed at the plan's rental per day for each
      night the covered repair keeps the vehicle, up to the plan's rental maximum days per visit; towing to the
      repairing facility up to the plan's towing per occurrence; trip interruption lodging and meals at the plan's
      per-day amount up to its maximum days when the breakdown happens at least the minimum distance from the
      holder's residential address. Receipts must be submitted within the benefit receipt submission days after the
      repair is completed, and each benefit type is reimbursed once per repair order. Benefits do not reduce the
      coverage remaining. A benefit is reimbursed only on a plan whose status is active or exhausted.
    eligibility:
      - id: benefit_state
        applies_to: [warranty_benefit_reimbursed]
        kind: state
        condition: "A benefit is reimbursed only on a plan whose status is active or exhausted."
        evidence_fields: [service_contracts.status, service_contracts.service_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.service_contract_id]
          action_bindings:
            service_contracts.service_contract_id: service_contract_id
        state_contract:
          field: service_contracts.status
          allowed: [active, exhausted]
    params:
      per_tier:
        KestrelCare Powertrain: {rental_per_day_usd: "=rental_per_day_usd", rental_max_days_per_claim: "=rental_max_days_per_claim", towing_per_occurrence_usd: "=towing_per_occurrence_usd", trip_interruption_per_day_usd: "=trip_interruption_per_day_usd", trip_interruption_max_days: "=trip_interruption_max_days"}
        KestrelCare Powertrain Plus: {rental_per_day_usd: "=rental_per_day_usd", rental_max_days_per_claim: "=rental_max_days_per_claim", towing_per_occurrence_usd: "=towing_per_occurrence_usd", trip_interruption_per_day_usd: "=trip_interruption_per_day_usd", trip_interruption_max_days: "=trip_interruption_max_days"}
        KestrelCare Silver: {rental_per_day_usd: "=rental_per_day_usd", rental_max_days_per_claim: "=rental_max_days_per_claim", towing_per_occurrence_usd: "=towing_per_occurrence_usd", trip_interruption_per_day_usd: "=trip_interruption_per_day_usd", trip_interruption_max_days: "=trip_interruption_max_days"}
        KestrelCare Gold: {rental_per_day_usd: "=rental_per_day_usd", rental_max_days_per_claim: "=rental_max_days_per_claim", towing_per_occurrence_usd: "=towing_per_occurrence_usd", trip_interruption_per_day_usd: "=trip_interruption_per_day_usd", trip_interruption_max_days: "=trip_interruption_max_days"}
        KestrelCare Platinum: {rental_per_day_usd: "=rental_per_day_usd", rental_max_days_per_claim: "=rental_max_days_per_claim", towing_per_occurrence_usd: "=towing_per_occurrence_usd", trip_interruption_per_day_usd: "=trip_interruption_per_day_usd", trip_interruption_max_days: "=trip_interruption_max_days"}
        KestrelCare Platinum Exclusionary: {rental_per_day_usd: "=rental_per_day_usd", rental_max_days_per_claim: "=rental_max_days_per_claim", towing_per_occurrence_usd: "=towing_per_occurrence_usd", trip_interruption_per_day_usd: "=trip_interruption_per_day_usd", trip_interruption_max_days: "=trip_interruption_max_days"}

  - id: warranty_cancellation
    subject: [warranty_contract_cancelled, warranty_cancellation_refund_issued]
    rule: >-
      The holder may cancel a pending or active plan at any time. A cancellation is processed only after the holder
      has confirmed a cancellation request for this plan with a dated odometer statement, except the flat
      cancellation that follows a completed 7-day return of the vehicle, which needs no request. The request date is the
      cancellation effective date; a request not confirmed within the cancellation confirmation days lapses. The
      refund basis is decided in this order. When the reason is one of the plan's flat cancel reasons (the vehicle
      returned under the 7-day return), the plan is cancelled from inception: full refund, no fee. Otherwise, when
      the request date is within the free-look days counted from the sale date (sale date as day 0, last day
      included) and no claim has been paid, the refund is the full price with no fee. Otherwise the refund is pro
      rata: the used share is the greater of the days used over the term days and the miles used over the term
      miles; the refund is the price times one minus the used share, less the cancellation fee, less net claims paid
      when the plan deducts claims, rounded to the cent and never below zero. Each plan has one cancellation
      refund. When the plan was financed and its finance contract is active, the refund is paid to Kestrel Auto
      Finance as lienholder and credited to principal; otherwise it is paid to the holder. Refunds are issued within
      the cancellation refund business days. A cancellation refund is issued only on a plan whose status is
      cancelled.
    eligibility:
      - id: confirmed_request
        applies_to: [warranty_contract_cancelled]
        kind: authorization
        condition: "A cancellation is processed only after the holder has confirmed a cancellation request for this plan with a dated odometer statement, except the flat cancellation that follows a completed 7-day return of the vehicle, which needs no request."
        evidence_fields: [service_contract_cancellations.request_status, service_contract_cancellations.service_contract_id, service_contract_cancellations.odometer_at_request]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contract_cancellations.service_contract_id]
          action_bindings:
            service_contract_cancellations.service_contract_id: service_contract_id
      - id: refund_once
        applies_to: [warranty_cancellation_refund_issued]
        kind: dedup
        condition: "Each plan has one cancellation refund."
        evidence_fields: [service_contract_transactions.service_contract_id, service_contract_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contract_transactions.service_contract_id]
          action_bindings:
            service_contract_transactions.service_contract_id: service_contract_id
        dedup_contract:
          table: service_contract_transactions
          mode: separate_record
          object_bindings: {service_contract_id: service_contract_id}
          duplicate_filters: {event_type: [warranty_cancellation_refund_issued]}
          distinct_fields: []
      - id: refund_on_cancelled
        applies_to: [warranty_cancellation_refund_issued]
        kind: state
        condition: "A cancellation refund is issued only on a plan whose status is cancelled."
        evidence_fields: [service_contracts.status, service_contracts.service_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_contracts.service_contract_id]
          action_bindings:
            service_contracts.service_contract_id: service_contract_id
        state_contract:
          field: service_contracts.status
          allowed: [cancelled]
    params:
      per_tier:
        KestrelCare Powertrain: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd", claims_deducted_from_refund: "=claims_deducted_from_refund", refund_to_lienholder_when_financed: "=refund_to_lienholder_when_financed"}
        KestrelCare Powertrain Plus: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd", claims_deducted_from_refund: "=claims_deducted_from_refund", refund_to_lienholder_when_financed: "=refund_to_lienholder_when_financed"}
        KestrelCare Silver: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd", claims_deducted_from_refund: "=claims_deducted_from_refund", refund_to_lienholder_when_financed: "=refund_to_lienholder_when_financed"}
        KestrelCare Gold: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd", claims_deducted_from_refund: "=claims_deducted_from_refund", refund_to_lienholder_when_financed: "=refund_to_lienholder_when_financed"}
        KestrelCare Platinum: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd", claims_deducted_from_refund: "=claims_deducted_from_refund", refund_to_lienholder_when_financed: "=refund_to_lienholder_when_financed"}
        KestrelCare Platinum Exclusionary: {free_look_days: "=free_look_days", cancellation_fee_usd: "=cancellation_fee_usd", claims_deducted_from_refund: "=claims_deducted_from_refund", refund_to_lienholder_when_financed: "=refund_to_lienholder_when_financed"}
    formula:
      used_share: "max(warranty_msr_days_used / warranty_msr_term_days, warranty_msr_miles_used / term_miles)"
      amount: "round(max(0, contract_price * (1 - used_share) - cancellation_fee_usd - (warranty_msr_net_claims_paid if claims_deducted_from_refund else 0)), 2)"
    measures: [warranty_msr_net_claims_paid, warranty_msr_days_used, warranty_msr_term_days, warranty_msr_miles_used]

  - id: warranty_transfer
    subject: [warranty_contract_transferred, warranty_transfer_fee_charged]
    rule: >-
      When the holder sells the vehicle privately, an active plan may be transferred to the buyer when the plan is
      transferable, transfers so far are below the plan's maximum transfers, the buyer is not a dealer, and the
      transfer is requested within the transfer request days after the vehicle sale. The holder pays the plan's
      transfer fee. The plan keeps its expiration date, expiration odometer and coverage remaining. A plan that is
