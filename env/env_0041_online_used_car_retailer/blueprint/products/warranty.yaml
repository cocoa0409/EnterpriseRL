# Product charter: KestrelCare Vehicle Service Contracts. Generated by erl-scenario-blueprint.
# One holding = one vehicle service contract on one purchased vehicle, from sale through activation,
# repair claims and benefits, and expiration, exhaustion, transfer or cancellation.

category: warranty
display_name: KestrelCare Vehicle Service Contracts

binding:
  holding_table: service_contracts
  event_tables: [service_contract_transactions]
  intake_tables: [service_contract_cancellations]
  status_field: status
  variant_field: variant_name
  quantity_fields: {coverage_remaining: coverage_remaining}

lifecycle:
  states: [pending, active, expired, cancelled, exhausted, transferred]
  transitions:
    - {from: pending, to: active, by: system, means: "Coverage starts: at vehicle handover for a plan sold with the vehicle, or when the waiting period ends for a plan bought later."}
    - {from: pending, to: cancelled, by: agent, means: "The plan is cancelled before coverage starts, after the holder's confirmed request or because the vehicle was returned."}
    - {from: active, to: cancelled, by: agent, means: "The plan is cancelled during coverage, after the holder's confirmed request or because the vehicle was returned."}
    - {from: active, to: expired, by: system, means: "The term ends by time or by mileage, whichever comes first."}
    - {from: active, to: exhausted, by: system, means: "Claims paid use up the aggregate limit of liability."}
    - {from: active, to: transferred, by: user, means: "The holder transfers the plan to the private buyer of the vehicle."}

accounts:
  - key: coverage_remaining
    unit: USD
    meaning: "Limit of liability still available for repair claims: established at activation, reduced by claim payments, restored by payments recovered."

parameter_schema:
  term_options: Coverage terms offered; term miles are added to the odometer at sale, list of {months, miles}
  covered_components: 'Vehicle systems covered (for the exclusionary plan: every listed system, all other parts except the standard exclusions), list of component_system values'
  deductible_options_usd: Per-visit deductibles the buyer may choose at sale, list of USD
  deductible_waived_at_kestrel_network: Whether the deductible is waived when the repair is done at a Kestrel network facility, boolean
  per_repair_visit_limit_usd: Maximum paid on one repair visit after the deductible, USD
  aggregate_limit_usd: Aggregate limit of liability, capped at the vehicle price on the purchase order, USD
  labor_rate_cap_usd: Maximum hourly labor rate recognized in a repair estimate, USD per hour
  diagnostic_covered_when_repair_covered: Whether diagnostic time is paid when the resulting repair is covered, boolean
  ev_battery_capacity_threshold_pct: State-of-health below which a hybrid or EV traction battery failure is covered (0 = battery not covered), percent
  secondary_to_other_coverage: Whether the plan pays only what a manufacturer warranty or the Kestrel limited warranty does not, boolean
  waiting_period_days: Days after the sale date before coverage starts for a plan bought after the vehicle sale, integer days
  waiting_period_miles: Miles after the odometer at sale before coverage starts for a plan bought after the vehicle sale, integer miles
  waiting_period_waived_when_sold_with_vehicle: Whether a plan sold with the vehicle starts coverage at handover with no waiting period, boolean
  post_sale_purchase_window_days: Calendar days after the vehicle handover date within which a plan can still be bought without an inspection (handover date = day 0), integer days
  claim_preauthorization_required: Whether the facility must obtain authorization before starting a repair, boolean
  claim_submission_days_after_repair: Calendar days after the repair order date within which the facility invoice must be submitted, integer days
  maintenance_record_components: Systems whose claims require proof of manufacturer-scheduled maintenance, list of component_system values
  maintenance_interval_tolerance_pct: Percentage by which a maintenance interval may be exceeded and still count as on schedule, percent
  facility_payment_business_days: Business days after approval within which the facility is paid, integer business days
  rental_per_day_usd: Rental reimbursement per day while a covered repair keeps the vehicle overnight, USD per day
  rental_max_days_per_claim: Maximum rental days per covered repair visit, integer days
  towing_per_occurrence_usd: Maximum towing reimbursement per covered breakdown, USD
  trip_interruption_per_day_usd: Lodging and meals reimbursed per day when a covered breakdown occurs far from home, USD per day
  trip_interruption_max_days: Maximum trip interruption days per breakdown, integer days
  trip_interruption_min_distance_miles: Minimum distance from the holder's residential address at which trip interruption applies, integer miles
  benefit_receipt_submission_days: Calendar days after the repair is completed within which rental, towing or trip receipts must be submitted, integer days
  free_look_days: Calendar days after the sale date within which a cancellation is refunded in full when no claim has been paid (sale date = day 0), integer days
  free_look_requires_no_claims: Whether a full free-look refund requires that no claim has been paid, boolean
  cancellation_fee_usd: Fee deducted from a pro-rata cancellation refund, USD
  pro_rata_basis: How the used share of the contract is measured for a pro-rata refund
  claims_deducted_from_refund: Whether net claims paid are deducted from a pro-rata refund, boolean
  flat_cancel_reasons: Cancellation reasons that cancel the contract from inception with a full refund and no fee, list of cancellation_reason values
  refund_to_lienholder_when_financed: Whether the refund of a financed contract goes to the lienholder while the finance contract is active, boolean
  cancellation_refund_business_days: Business days after the cancellation is confirmed within which the refund is issued, integer business days
  odometer_statement_required_for_cancellation: Whether a dated odometer statement is required to cancel, boolean
  cancellation_confirmation_days: Calendar days a cancellation request may await the customer's signed form before it lapses, integer days
  transferable: Whether the plan can be transferred to a private buyer of the vehicle, boolean
  transfer_fee_usd: Fee charged to transfer the plan, USD
  max_transfers: Maximum transfers over the life of the plan, integer count
  transfer_request_days_after_vehicle_sale: Calendar days after the private sale of the vehicle within which a transfer must be requested, integer days
  transfer_to_dealer_allowed: Whether the plan may transfer to a dealer that buys the vehicle, boolean
  max_vehicle_age_years_at_sale: Maximum model age (sale calendar year minus model year) at plan sale, integer years
  max_odometer_at_sale: Maximum odometer at plan sale, integer miles
  one_plan_per_vehicle: Whether a vehicle may carry only one KestrelCare plan that is pending or active, boolean
  financing_allowed: Whether the plan price may be included in a Kestrel Auto Finance contract signed with the vehicle, boolean
  commercial_use_excluded: Whether failures on a vehicle used for rideshare, delivery or other commercial use are excluded, boolean
  exhaustion_ends_plan: Whether the plan ends when the aggregate limit is used up, boolean
  payment_recovery_window_days: Calendar days after a claim payment within which a payment made in error is recovered against the limit, integer days

