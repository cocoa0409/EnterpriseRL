events:
  - type: finance_application_approved
    target: finance_contracts
    mutation: create
    meaning: "A credit application for a purchase is approved at a tier with terms."
    grain: "one row per approval"
    fields:
      customer_id: "primary borrower"
      purchase_order_id: "purchase order to be financed"
      variant_name: "credit tier"
      application_date: "decision date"
      approval_expires_date: "decision date plus the tier's approval validity days"
      amount_financed: "approved amount financed"
      apr: "approved APR for the term (autopay reduction applied when enrolled at signing)"
      term_months: "approved term"
      monthly_payment: "scheduled installment"
      stips_verified: "false when the tier requires verifications, true otherwise"
    triggers: []
  - type: finance_stips_cleared
    target: finance_contracts
    mutation: update
    meaning: "The verifications required before signing are completed."
    grain: "one row per approval"
    fields:
      stips_verified: "set to true"
    triggers: []
  - type: finance_contract_signed
    target: finance_contracts
    mutation: {transition: {from: approved, to: active}}
    meaning: "The borrower signs the contract and it is funded."
    grain: "one row per signed contract"
    fields:
      status: "approved -> active"
      contract_date: "signing date"
      first_payment_date: "first due date"
      payment_due_day: "day of month installments fall due"
      next_due_date: "first due date"
      maturity_date: "due date of the last installment"
      last_payment_date: "contract date"
      autopay_enrolled: "autopay choice at signing"
    triggers:
      - event: finance:finance_contract_funded
        map: {txn_date: contract_date}
  - type: finance_application_withdrawn
    target: finance_contracts
    mutation: {transition: {from: approved, to: withdrawn}}
    meaning: "An unsigned approval is withdrawn."
    grain: "one row per withdrawal"
    fields:
      status: "approved -> withdrawn"
      closed_date: "date of withdrawal"
    triggers: []
  - type: finance_approval_expired
    target: finance_contracts
    mutation: {transition: {from: approved, to: expired}}
    meaning: "An unsigned approval lapses."
    grain: "one row per lapsed approval"
    fields:
      status: "approved -> expired"
      closed_date: "the day after the approval expiration date"
    triggers: []
  - type: finance_contract_paid_off
    target: finance_contracts
    mutation: {transition: {from: active, to: paid_off}}
    meaning: "The contract is paid in full."
    grain: "one row per paid-off contract"
    fields:
      status: "active -> paid_off"
      closed_date: "posting date of the payoff payment"
    triggers:
      - event: gap:gap_waiver_terminated
        map: {}
  - type: finance_contract_unwound
    target: finance_contracts
    mutation: {transition: {from: active, to: unwound}}
    meaning: "The contract is rescinded and its principal is cleared."
    grain: "one row per unwound contract"
    fields:
      status: "active -> unwound"
      closed_date: "date of the unwind"
    triggers:
      - event: finance:finance_principal_credited
        map: {credit_source: contract_unwind}
      - event: gap:gap_waiver_cancelled
        map: {}
  - type: finance_autopay_changed
    target: finance_contracts
    mutation: update
    meaning: "Autopay is enrolled or cancelled and the APR moves by the autopay reduction."
    grain: "one row per change"
    fields:
      autopay_enrolled: "new autopay setting"
      apr: "APR after adding or removing the autopay reduction"
    triggers: []
  - type: finance_due_date_changed
    target: finance_contracts
    mutation: update
    meaning: "The day of month installments fall due is moved."
    grain: "one row per due-date change"
    fields:
      payment_due_day: "new due day"
      next_due_date: "next installment on the new due day"
      maturity_date: "final installment on the new due day"
      due_date_changes_used: "incremented by one"
    triggers: []
  - type: finance_schedule_advanced
    target: finance_contracts
    mutation: update
    meaning: "A posted payment moves the next due date and the interest accrual date."
    grain: "one row per payment posted"
    fields:
      next_due_date: "advanced by one month per full monthly payment in a scheduled-installment payment"
      last_payment_date: "posting date of the payment"
    triggers: []
  - type: finance_deferral_applied
    target: finance_contracts
    mutation: update
    meaning: "A granted deferral moves the next due date and the maturity date one month later."
    grain: "one row per deferral"
    fields:
      next_due_date: "one month later"
      maturity_date: "one month later"
      deferrals_used: "incremented by one"
    triggers: []

  - type: finance_contract_funded
    target: finance_transactions
    meaning: "The amount financed is booked as principal when the contract is funded."
    grain: "one row per contract"
    distinguish_by: [txn_date]
    fields:
      txn_date: "contract date"
      amount: "amount financed"
    account: principal_balance
    direction: in
    triggers:
      - event: purchase:purchase_payment_posted
        map: {payment_source: kestrel_finance_proceeds, payment_channel: lender_funding, amount: amount, txn_date: txn_date, linked_reference_id: finance_contract_id}
  - type: finance_payment_posted
    target: finance_transactions
    meaning: "A customer payment is posted and split into interest, fees and principal."
    grain: "one row per payment"
    distinguish_by: [txn_date, total_received, payment_channel, payment_type]
    fields:
      txn_date: "posting date"
      amount: "principal portion"
      total_received: "full payment"
      interest_portion: "accrued interest paid"
      fee_portion: "fees paid"
      payment_channel: "channel"
      payment_type: "scheduled_installment, partial_payment, principal_only or payoff"
      installment_due_date: "next due date at posting for a scheduled installment; empty otherwise"
    account: principal_balance
    direction: out
    triggers:
      - event: finance:finance_schedule_advanced
        map: {}
      - event: finance:finance_fee_cleared
        when: {fee_portion: {not: 0.0}}
        map: {clearance_type: paid, txn_date: txn_date}
      - event: finance:finance_contract_paid_off
        when: {payment_type: payoff}
        map: {}
      - event: finance:finance_fee_assessed
        when: {payment_channel: [agent_assisted_ach, agent_assisted_debit_card]}
        map: {fee_type: agent_assisted_payment_fee, txn_date: txn_date}
  - type: finance_payment_returned
    target: finance_transactions
    meaning: "A posted payment is returned unpaid by the customer's bank and its principal portion is reinstated."
    grain: "one row per returned payment"
    distinguish_by: [source_txn_id]
    fields:
      txn_date: "date of the return"
      amount: "principal portion reinstated"
      total_received: "full amount of the returned payment"
      source_txn_id: "the payment returned"
    account: principal_balance
    direction: in
    triggers:
      - event: finance:finance_fee_assessed
        map: {fee_type: returned_payment_fee, txn_date: txn_date}
  - type: finance_principal_credited
    target: finance_transactions
    meaning: "Principal is reduced by a refund of a financed product, an unwind or a billing correction."
    grain: "one row per credit per source record"
    distinguish_by: [credit_source, linked_reference_id]
    fields:
      txn_date: "date of the credit"
      amount: "credit amount"
      credit_source: "origin of the credit"
      linked_reference_id: "cancelled product or purchase order behind the credit"
    account: principal_balance
    direction: out
    triggers: []
  - type: finance_fee_assessed
    target: finance_transactions
    meaning: "A fee is assessed on the contract."
    grain: "one row per fee per installment or payment"
    distinguish_by: [fee_type, installment_due_date, txn_date]
    fields:
      txn_date: "assessment date"
      amount: "fee amount"
      fee_type: "fee assessed"
      installment_due_date: "late installment for a late fee or deferred installment for a deferral fee; empty otherwise"
      source_txn_id: "payment behind a returned-payment or agent-assisted fee; empty otherwise"
    account: fees_due
    direction: in
    triggers: []
  - type: finance_fee_cleared
    target: finance_transactions
    meaning: "An assessed fee is paid by a payment or waived."
    grain: "one row per fee cleared"
    distinguish_by: [source_txn_id, clearance_type]
    fields:
      txn_date: "date cleared"
      amount: "amount cleared"
      fee_type: "fee type of the fee cleared"
      clearance_type: "paid or waived"
      source_txn_id: "the fee entry cleared"
    account: fees_due
    direction: out
    triggers: []
  - type: finance_payoff_quote_issued
    target: finance_transactions
    meaning: "A payoff quote is issued to the borrower or to a dealer buying the vehicle."
    grain: "one row per quote"
    distinguish_by: [txn_date, good_through_date]
    fields:
      txn_date: "quote date"
      amount: "payoff amount good through the good-through date"
      good_through_date: "last valid date"
      per_diem_interest: "daily interest after the good-through date"
    triggers: []
  - type: finance_deferral_granted
    target: finance_transactions
    meaning: "One installment is deferred to the end of the contract."
    grain: "one row per deferred installment"
    distinguish_by: [installment_due_date]
    fields:
      txn_date: "date granted"
      amount: "0.00"
      installment_due_date: "installment deferred"
    triggers:
      - event: finance:finance_deferral_applied
        map: {}

measures:
  - id: finance_msr_days_since_last_payment
    window: "from the day after last_payment_date through the posting date, calendar days"
    measure: "number of calendar days interest has accrued since the last payment"
  - id: finance_msr_days_to_good_through
    window: "from the day after last_payment_date through the quote's good-through date, calendar days"
    measure: "number of calendar days of interest a payoff quote must cover"
  - id: finance_msr_installments_paid
    window: "life of the contract up to the moment of the request"
    measure: "count of finance_payment_posted entries with payment_type scheduled_installment that have no finance_payment_returned entry pointing at them"
  - id: finance_msr_deferrals_12m
    window: "rolling 12 months ending on the request date"
    measure: "count of finance_deferral_granted entries of the contract with txn_date in the window"
  - id: finance_msr_late_fee_waivers_12m
    window: "rolling 12 months ending on the request date"
    measure: "count of finance_fee_cleared entries of the contract with fee_type late_fee and clearance_type waived in the window"
  - id: finance_msr_card_payments_month
    window: "calendar month of the posting date"
    measure: "count of finance_payment_posted entries of the contract with payment_channel online_debit_card or agent_assisted_debit_card"
  - id: finance_msr_active_exposure
    window: "current portfolio at the moment of the request"
    measure: "count and sum of principal_balance over the customer's finance_contracts whose status is active"

policies:
  - id: finance_agg_multi_holding
    subject: [finance_application_approved]
    rule: >-
      A customer may hold several Kestrel Auto Finance contracts, one per financed purchase order; the limits on
      how many may be active and on combined principal are set by finance_agg_exposure.
    eligibility: []
    params:
      max_per_customer: null

  - id: finance_agg_exposure
    subject: [finance_application_approved]
    rule: >-
      Contracts are aggregated per customer with finance_msr_active_exposure. A new approval is written only when
      the count of the customer's active contracts plus the new one does not exceed the new tier's maximum active
      contracts, and the combined principal of the active contracts plus the new amount financed does not exceed
      the new tier's maximum aggregate exposure. The limits of the tier being approved apply, not those of the
      customer's older contracts. An approval refused on these grounds is not written; the customer may apply
      again after paying a contract down.
    eligibility:
      - id: exposure_cap
        applies_to: [finance_application_approved]
        kind: authorization
        condition: "A new approval is written only when the count of the customer's active contracts plus the new one does not exceed the new tier's maximum active contracts, and the combined principal of the active contracts plus the new amount financed does not exceed the new tier's maximum aggregate exposure."
        evidence_fields: [finance_contracts.customer_id, finance_contracts.status, finance_contracts.principal_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.customer_id]
          action_bindings:
            finance_contracts.customer_id: customer_id
    params:
      per_tier:
        Kestrel Finance Tier E: {max_active_contracts: "=max_active_contracts", max_aggregate_exposure_usd: "=max_aggregate_exposure_usd"}
        Kestrel Finance Tier D: {max_active_contracts: "=max_active_contracts", max_aggregate_exposure_usd: "=max_aggregate_exposure_usd"}
        Kestrel Finance Tier C: {max_active_contracts: "=max_active_contracts", max_aggregate_exposure_usd: "=max_aggregate_exposure_usd"}
        Kestrel Finance Tier B: {max_active_contracts: "=max_active_contracts", max_aggregate_exposure_usd: "=max_aggregate_exposure_usd"}
        Kestrel Finance Tier A: {max_active_contracts: "=max_active_contracts", max_aggregate_exposure_usd: "=max_aggregate_exposure_usd"}
        Kestrel Finance Tier A+: {max_active_contracts: "=max_active_contracts", max_aggregate_exposure_usd: "=max_aggregate_exposure_usd"}
    measures: [finance_msr_active_exposure]

  - id: finance_underwriting
    subject: [finance_application_approved, finance_stips_cleared]
    rule: >-
      The tier is the highest tier whose minimum credit score the applicant's score meets. The approval states an
      amount financed between the minimum and the tier's maximum amount financed and no higher than the tier's
      maximum loan-to-value of the vehicle price; a down payment of at least the larger of the tier's minimum
      down payment percentage of the vehicle price and its minimum down payment dollars; a term from the tier's
      terms offered, no longer than the older-vehicle maximum when the vehicle's model age reaches the
      older-vehicle age; the APR for that term from the tier's APR table; and a monthly payment within the tier's
      maximum payment-to-income and debt-to-income ratios on verified income at or above the tier's minimum. A
      vehicle above the tier's maximum odometer cannot be financed at that tier. Financed service contracts, GAP
      and maintenance plans together may not exceed the tier's maximum back-end percentage of the vehicle price,
      and trade-in negative equity included in the amount financed may not exceed the tier's maximum negative
      equity. The approval expires at the end of the decision date plus the tier's approval validity days. When
      the tier requires proof of income, proof of residence or references, the approval is written with
      stipulations open, and they are cleared only when every required verification is completed; a borrower's
      statement that documents were sent does not clear them. Stipulations are cleared only on an approval whose
      status is approved.
    eligibility:
      - id: stips_on_approval
        applies_to: [finance_stips_cleared]
        kind: state
        condition: "Stipulations are cleared only on an approval whose status is approved."
        evidence_fields: [finance_contracts.status, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        state_contract:
          field: finance_contracts.status
          allowed: [approved]
    params:
      per_tier:
        Kestrel Finance Tier E: {apr_by_term: "=apr_by_term", max_ltv_pct: "=max_ltv_pct", min_down_payment_pct: "=min_down_payment_pct", max_negative_equity_usd: "=max_negative_equity_usd"}
        Kestrel Finance Tier D: {apr_by_term: "=apr_by_term", max_ltv_pct: "=max_ltv_pct", min_down_payment_pct: "=min_down_payment_pct", max_negative_equity_usd: "=max_negative_equity_usd"}
        Kestrel Finance Tier C: {apr_by_term: "=apr_by_term", max_ltv_pct: "=max_ltv_pct", min_down_payment_pct: "=min_down_payment_pct", max_negative_equity_usd: "=max_negative_equity_usd"}
        Kestrel Finance Tier B: {apr_by_term: "=apr_by_term", max_ltv_pct: "=max_ltv_pct", min_down_payment_pct: "=min_down_payment_pct", max_negative_equity_usd: "=max_negative_equity_usd"}
        Kestrel Finance Tier A: {apr_by_term: "=apr_by_term", max_ltv_pct: "=max_ltv_pct", min_down_payment_pct: "=min_down_payment_pct", max_negative_equity_usd: "=max_negative_equity_usd"}
        Kestrel Finance Tier A+: {apr_by_term: "=apr_by_term", max_ltv_pct: "=max_ltv_pct", min_down_payment_pct: "=min_down_payment_pct", max_negative_equity_usd: "=max_negative_equity_usd"}

  - id: finance_contract_signing
    subject: [finance_contract_signed, finance_contract_funded]
    rule: >-
      The contract is signed together with the purchase agreement of the financed order. The contract is signed no
      later than the last day of the approval validity counted from the decision date. Approval validity is counted
      in calendar days with the decision date as day 0 and ends at the end of the approval expiration date. The
      contract is signed only when the approval's stipulations are verified. The first due date falls between the
      tier's first payment minimum and maximum days after the contract date, on the chosen due day (1 to 28), and
      the maturity date is the first due date plus term months minus one month. Funding books the amount financed
      as principal on the contract date and pays the proceeds to the purchase order. Funding is booked only on a
      contract whose status is active.
    eligibility:
      - id: within_approval
        applies_to: [finance_contract_signed]
        kind: time
        condition: "The contract is signed no later than the last day of the approval validity counted from the decision date."
        evidence_fields: [finance_contracts.application_date, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the decision date"
          anchor_source: finance_contracts.application_date
          relation: not_after
          duration_source: variants.approval_validity_days
          unit: calendar_days
          counting_rule: "Approval validity is counted in calendar days with the decision date as day 0 and ends at the end of the approval expiration date."
          boundary: inclusive
      - id: stips_done
        applies_to: [finance_contract_signed]
        kind: authorization
        condition: "The contract is signed only when the approval's stipulations are verified."
        evidence_fields: [finance_contracts.stips_verified, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
      - id: funded_active
        applies_to: [finance_contract_funded]
        kind: state
        condition: "Funding is booked only on a contract whose status is active."
        evidence_fields: [finance_contracts.status, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        state_contract:
          field: finance_contracts.status
          allowed: [active]
    params:
      per_tier:
        Kestrel Finance Tier E: {approval_validity_days: "=approval_validity_days", first_payment_min_days: "=first_payment_min_days", first_payment_max_days: "=first_payment_max_days"}
        Kestrel Finance Tier D: {approval_validity_days: "=approval_validity_days", first_payment_min_days: "=first_payment_min_days", first_payment_max_days: "=first_payment_max_days"}
        Kestrel Finance Tier C: {approval_validity_days: "=approval_validity_days", first_payment_min_days: "=first_payment_min_days", first_payment_max_days: "=first_payment_max_days"}
        Kestrel Finance Tier B: {approval_validity_days: "=approval_validity_days", first_payment_min_days: "=first_payment_min_days", first_payment_max_days: "=first_payment_max_days"}
        Kestrel Finance Tier A: {approval_validity_days: "=approval_validity_days", first_payment_min_days: "=first_payment_min_days", first_payment_max_days: "=first_payment_max_days"}
        Kestrel Finance Tier A+: {approval_validity_days: "=approval_validity_days", first_payment_min_days: "=first_payment_min_days", first_payment_max_days: "=first_payment_max_days"}

  - id: finance_payment_application
    subject: [finance_payment_posted, finance_schedule_advanced, finance_fee_cleared, finance_fee_assessed]
    rule: >-
      Payments post only to a contract whose status is active. Interest is daily simple interest: the principal
      balance times the APR in effect on the posting date divided by the tier's day-count basis, times the days
      since the last payment counted by finance_msr_days_since_last_payment, rounded to the cent. A payment made
      after the payment cutoff time or on a weekend or US federal holiday posts on the next business day. Each
      payment is applied in this order: accrued interest to the posting date, then outstanding fees oldest first,
      then principal. A principal-only payment, where the tier allows it, is accepted only when no installment is
      past due and goes entirely to principal. A scheduled-installment payment advances the next due date by one
      month for each full monthly payment it contains, never beyond the maturity date; a partial payment is
      applied in the same order but never advances the next due date. Every posted payment sets the last payment
      date to its posting date. A one-time payment taken by a representative by phone bears the tier's
      agent-assisted payment fee, assessed with the payment and paid from it; payments by autopay, online or mail
      bear no fee. A single debit card payment may not exceed the tier's maximum debit card payment, and no more
      than the tier's maximum debit card payments may post in one calendar month, counted by
      finance_msr_card_payments_month. A payoff payment equal to the payoff amount brings principal, interest and
      fees to zero and closes the contract as paid off.
    eligibility:
      - id: payment_active
        applies_to: [finance_payment_posted, finance_schedule_advanced, finance_fee_assessed]
        kind: state
        condition: "Payments post only to a contract whose status is active."
        evidence_fields: [finance_contracts.status, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        state_contract:
          field: finance_contracts.status
          allowed: [active]
      - id: card_limits
        applies_to: [finance_payment_posted]
        kind: authorization
        condition: "A single debit card payment may not exceed the tier's maximum debit card payment, and no more than the tier's maximum debit card payments may post in one calendar month, counted by finance_msr_card_payments_month."
        evidence_fields: [finance_transactions.payment_channel, finance_transactions.txn_date, finance_transactions.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_transactions.finance_contract_id]
          action_bindings:
            finance_transactions.finance_contract_id: finance_contract_id
    params:
      per_tier:
        Kestrel Finance Tier E: {principal_only_payment_allowed: "=principal_only_payment_allowed", agent_assisted_payment_fee_usd: "=agent_assisted_payment_fee_usd", max_debit_card_payment_usd: "=max_debit_card_payment_usd"}
        Kestrel Finance Tier D: {principal_only_payment_allowed: "=principal_only_payment_allowed", agent_assisted_payment_fee_usd: "=agent_assisted_payment_fee_usd", max_debit_card_payment_usd: "=max_debit_card_payment_usd"}
        Kestrel Finance Tier C: {principal_only_payment_allowed: "=principal_only_payment_allowed", agent_assisted_payment_fee_usd: "=agent_assisted_payment_fee_usd", max_debit_card_payment_usd: "=max_debit_card_payment_usd"}
        Kestrel Finance Tier B: {principal_only_payment_allowed: "=principal_only_payment_allowed", agent_assisted_payment_fee_usd: "=agent_assisted_payment_fee_usd", max_debit_card_payment_usd: "=max_debit_card_payment_usd"}
        Kestrel Finance Tier A: {principal_only_payment_allowed: "=principal_only_payment_allowed", agent_assisted_payment_fee_usd: "=agent_assisted_payment_fee_usd", max_debit_card_payment_usd: "=max_debit_card_payment_usd"}
        Kestrel Finance Tier A+: {principal_only_payment_allowed: "=principal_only_payment_allowed", agent_assisted_payment_fee_usd: "=agent_assisted_payment_fee_usd", max_debit_card_payment_usd: "=max_debit_card_payment_usd"}
    formula:
      interest_portion: "round(min(total_received, principal_balance * apr / 100 / interest_day_count_basis * finance_msr_days_since_last_payment), 2)"
      fee_portion: "round(min(total_received - interest_portion, fees_due), 2)"
      amount: "round(total_received - interest_portion - fee_portion, 2)"
    measures: [finance_msr_days_since_last_payment, finance_msr_card_payments_month]

  - id: finance_late_fees
    subject: [finance_fee_assessed, finance_fee_cleared]
    rule: >-
      A late fee is assessed once on an installment that is still unpaid after the grace period. A late fee may be
      assessed only after the grace period counted from the installment's due date has passed. Grace is counted in
      calendar days with the due date as day 0; a late fee may be assessed from the day after the last grace day if
      the installment is still unpaid. Each installment bears at most one late fee. The late fee is the tier's late
      fee percentage of the monthly payment, no less than the tier's minimum and no more than its maximum, rounded
      to the cent. A late fee may be waived as goodwill only while waivers counted by
      finance_msr_late_fee_waivers_12m are below the tier's late fee waivers per 12 months; a late fee assessed in
      error (the installment was in fact paid within grace, or the due date had been moved) is waived without
      using a goodwill waiver. Returned-payment, agent-assisted and deferral fees are never waived as goodwill. A
      fee is cleared only on a contract whose status is active or unwound.
    eligibility:
      - id: clear_state
        applies_to: [finance_fee_cleared]
        kind: state
        condition: "A fee is cleared only on a contract whose status is active or unwound."
        evidence_fields: [finance_contracts.status, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        state_contract:
          field: finance_contracts.status
          allowed: [active, unwound]
      - id: after_grace
        applies_to: [finance_fee_assessed]
        kind: time
        condition: "A late fee may be assessed only after the grace period counted from the installment's due date has passed."
        evidence_fields: [finance_contracts.next_due_date, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the installment's due date"
          anchor_source: finance_contracts.next_due_date
          relation: not_before
          duration_source: variants.payment_grace_days
          unit: calendar_days
          counting_rule: "Grace is counted in calendar days with the due date as day 0; a late fee may be assessed from the day after the last grace day if the installment is still unpaid."
          boundary: exclusive
      - id: one_late_fee_per_installment
        applies_to: [finance_fee_assessed]
        kind: dedup
        condition: "Each installment bears at most one late fee."
        evidence_fields: [finance_transactions.installment_due_date, finance_transactions.fee_type, finance_transactions.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_transactions.finance_contract_id, finance_transactions.installment_due_date]
          action_bindings:
            finance_transactions.finance_contract_id: finance_contract_id
            finance_transactions.installment_due_date: installment_due_date
        dedup_contract:
          table: finance_transactions
          mode: separate_record
          object_bindings: {finance_contract_id: finance_contract_id, installment_due_date: installment_due_date}
          duplicate_filters: {fee_type: [late_fee]}
          distinct_fields: []
    params:
      per_tier:
        Kestrel Finance Tier E: {late_fee_waivers_per_12_months: "=late_fee_waivers_per_12_months", late_fee_pct: "=late_fee_pct", late_fee_min_usd: "=late_fee_min_usd", late_fee_max_usd: "=late_fee_max_usd"}
        Kestrel Finance Tier D: {late_fee_waivers_per_12_months: "=late_fee_waivers_per_12_months", late_fee_pct: "=late_fee_pct", late_fee_min_usd: "=late_fee_min_usd", late_fee_max_usd: "=late_fee_max_usd"}
        Kestrel Finance Tier C: {late_fee_waivers_per_12_months: "=late_fee_waivers_per_12_months", late_fee_pct: "=late_fee_pct", late_fee_min_usd: "=late_fee_min_usd", late_fee_max_usd: "=late_fee_max_usd"}
        Kestrel Finance Tier B: {late_fee_waivers_per_12_months: "=late_fee_waivers_per_12_months", late_fee_pct: "=late_fee_pct", late_fee_min_usd: "=late_fee_min_usd", late_fee_max_usd: "=late_fee_max_usd"}
        Kestrel Finance Tier A: {late_fee_waivers_per_12_months: "=late_fee_waivers_per_12_months", late_fee_pct: "=late_fee_pct", late_fee_min_usd: "=late_fee_min_usd", late_fee_max_usd: "=late_fee_max_usd"}
        Kestrel Finance Tier A+: {late_fee_waivers_per_12_months: "=late_fee_waivers_per_12_months", late_fee_pct: "=late_fee_pct", late_fee_min_usd: "=late_fee_min_usd", late_fee_max_usd: "=late_fee_max_usd"}
    formula:
      late_fee: "round(max(late_fee_min_usd, min(late_fee_pct / 100 * monthly_payment, late_fee_max_usd)), 2)"
    measures: [finance_msr_late_fee_waivers_12m]

  - id: finance_returned_payments
    subject: [finance_payment_returned]
    rule: >-
      When the customer's bank returns a posted payment, the whole payment is reversed: its principal portion is
      reinstated, each fee it paid is reinstated by assessing that fee again as a new entry of the same fee type,
      the last payment date and next due date revert to their values before the payment, and the tier's
      returned-payment fee is assessed. A payment is reversed only once. Autopay stays enrolled after one returned
      payment.
    eligibility:
      - id: reverse_once
        applies_to: [finance_payment_returned]
        kind: dedup
        condition: "A payment is reversed only once."
        evidence_fields: [finance_transactions.source_txn_id, finance_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_transactions.source_txn_id]
          action_bindings:
            finance_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: finance_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [finance_payment_returned]}
          distinct_fields: []
    params:
      per_tier:
        Kestrel Finance Tier E: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Kestrel Finance Tier D: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Kestrel Finance Tier C: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Kestrel Finance Tier B: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Kestrel Finance Tier A: {returned_payment_fee_usd: "=returned_payment_fee_usd"}
        Kestrel Finance Tier A+: {returned_payment_fee_usd: "=returned_payment_fee_usd"}

  - id: finance_autopay
    subject: [finance_autopay_changed]
    rule: >-
      Autopay debits the monthly payment from the borrower's bank account on each due date. Autopay is changed only
      on a contract whose status is active. Enrolling lowers the contract APR by the tier's autopay reduction and
      cancelling raises it by the same amount; the APR on the contract always shows the rate in effect, and
      interest already accrued is not recalculated. Enrolling when already enrolled, or cancelling when not
      enrolled, changes nothing.
    eligibility:
      - id: autopay_active
        applies_to: [finance_autopay_changed]
        kind: state
        condition: "Autopay is changed only on a contract whose status is active."
        evidence_fields: [finance_contracts.status, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        state_contract:
          field: finance_contracts.status
          allowed: [active]
    params:
      per_tier:
        Kestrel Finance Tier E: {autopay_apr_reduction_pct: "=autopay_apr_reduction_pct"}
        Kestrel Finance Tier D: {autopay_apr_reduction_pct: "=autopay_apr_reduction_pct"}
        Kestrel Finance Tier C: {autopay_apr_reduction_pct: "=autopay_apr_reduction_pct"}
        Kestrel Finance Tier B: {autopay_apr_reduction_pct: "=autopay_apr_reduction_pct"}
        Kestrel Finance Tier A: {autopay_apr_reduction_pct: "=autopay_apr_reduction_pct"}
        Kestrel Finance Tier A+: {autopay_apr_reduction_pct: "=autopay_apr_reduction_pct"}

  - id: finance_deferral
    subject: [finance_deferral_granted, finance_deferral_applied]
    rule: >-
      A borrower facing a temporary hardship may defer the installment at the next due date to the end of the
      contract. A deferral is granted only on a contract whose status is active. The deferral is granted only when
      the request date is no more than the tier's deferral maximum days past due counted from the next due date. Days past due are
      counted in calendar days from the next due date as day 0; a request on the day that is exactly the maximum
      qualifies. At least the tier's deferral minimum installments, counted by finance_msr_installments_paid, must
      have been paid; deferrals counted by finance_msr_deferrals_12m must be below the tier's deferral maximum per
      12 months; and deferrals used must be below the tier's lifetime maximum. A deferral moves the next due date
      and the maturity date one month later; interest keeps accruing on the principal. The tier's deferral fee,
      when above zero, is assessed as a deferral fee entry for the deferred installment. A deferral and a due-date
      change are not granted in the same calendar month.
    eligibility:
      - id: deferral_active
        applies_to: [finance_deferral_granted, finance_deferral_applied]
        kind: state
        condition: "A deferral is granted only on a contract whose status is active."
        evidence_fields: [finance_contracts.status, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        state_contract:
          field: finance_contracts.status
          allowed: [active]
      - id: deferral_dpd
        applies_to: [finance_deferral_granted]
        kind: time
        condition: "The deferral is granted only when the request date is no more than the tier's deferral maximum days past due counted from the next due date."
        evidence_fields: [finance_contracts.next_due_date, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the next due date"
          anchor_source: finance_contracts.next_due_date
          relation: not_after
          duration_source: variants.deferral_max_days_past_due
          unit: calendar_days
          counting_rule: "Days past due are counted in calendar days from the next due date as day 0; a request on the day that is exactly the maximum qualifies."
          boundary: inclusive
    params:
      per_tier:
        Kestrel Finance Tier E: {deferral_max_per_12_months: "=deferral_max_per_12_months", deferral_max_lifetime: "=deferral_max_lifetime", deferral_min_installments_paid: "=deferral_min_installments_paid", deferral_max_days_past_due: "=deferral_max_days_past_due", deferral_fee_usd: "=deferral_fee_usd"}
        Kestrel Finance Tier D: {deferral_max_per_12_months: "=deferral_max_per_12_months", deferral_max_lifetime: "=deferral_max_lifetime", deferral_min_installments_paid: "=deferral_min_installments_paid", deferral_max_days_past_due: "=deferral_max_days_past_due", deferral_fee_usd: "=deferral_fee_usd"}
        Kestrel Finance Tier C: {deferral_max_per_12_months: "=deferral_max_per_12_months", deferral_max_lifetime: "=deferral_max_lifetime", deferral_min_installments_paid: "=deferral_min_installments_paid", deferral_max_days_past_due: "=deferral_max_days_past_due", deferral_fee_usd: "=deferral_fee_usd"}
        Kestrel Finance Tier B: {deferral_max_per_12_months: "=deferral_max_per_12_months", deferral_max_lifetime: "=deferral_max_lifetime", deferral_min_installments_paid: "=deferral_min_installments_paid", deferral_max_days_past_due: "=deferral_max_days_past_due", deferral_fee_usd: "=deferral_fee_usd"}
        Kestrel Finance Tier A: {deferral_max_per_12_months: "=deferral_max_per_12_months", deferral_max_lifetime: "=deferral_max_lifetime", deferral_min_installments_paid: "=deferral_min_installments_paid", deferral_max_days_past_due: "=deferral_max_days_past_due", deferral_fee_usd: "=deferral_fee_usd"}
        Kestrel Finance Tier A+: {deferral_max_per_12_months: "=deferral_max_per_12_months", deferral_max_lifetime: "=deferral_max_lifetime", deferral_min_installments_paid: "=deferral_min_installments_paid", deferral_max_days_past_due: "=deferral_max_days_past_due", deferral_fee_usd: "=deferral_fee_usd"}
    measures: [finance_msr_installments_paid, finance_msr_deferrals_12m]

  - id: finance_due_date_change
    subject: [finance_due_date_changed]
    rule: >-
      A borrower may move the day of the month installments fall due. A due-date change is made only on a contract
      whose status is active. The change is made only while no installment is past due, that is on or before the
      next due date. The current day is compared with the next due date as calendar dates; a request on the next
      due date itself qualifies. At least the tier's due-date change minimum installments, counted by
      finance_msr_installments_paid, must have been paid and due-date changes used must be below the tier's
      lifetime maximum. The new due day must be later in the month than the current one by no more than the tier's
      maximum shift days and must be between 1 and 28; a move to an earlier day is not offered. The next due date
      and maturity date move to the new day in their own months. A deferral and a due-date change are not granted
      in the same calendar month.
    eligibility:
      - id: due_change_active
        applies_to: [finance_due_date_changed]
        kind: state
        condition: "A due-date change is made only on a contract whose status is active."
        evidence_fields: [finance_contracts.status, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        state_contract:
          field: finance_contracts.status
          allowed: [active]
      - id: account_current
        applies_to: [finance_due_date_changed]
        kind: time
        condition: "The change is made only while no installment is past due, that is on or before the next due date."
        evidence_fields: [finance_contracts.next_due_date, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the next due date"
          anchor_source: finance_contracts.next_due_date
          relation: not_after
          duration_source: params.current_grace_days
          unit: calendar_days
          counting_rule: "The current day is compared with the next due date as calendar dates; a request on the next due date itself qualifies."
          boundary: inclusive
    params:
      current_grace_days: 0
      per_tier:
        Kestrel Finance Tier E: {due_date_change_max_lifetime: "=due_date_change_max_lifetime", due_date_change_max_shift_days: "=due_date_change_max_shift_days", due_date_change_min_installments_paid: "=due_date_change_min_installments_paid"}
        Kestrel Finance Tier D: {due_date_change_max_lifetime: "=due_date_change_max_lifetime", due_date_change_max_shift_days: "=due_date_change_max_shift_days", due_date_change_min_installments_paid: "=due_date_change_min_installments_paid"}
        Kestrel Finance Tier C: {due_date_change_max_lifetime: "=due_date_change_max_lifetime", due_date_change_max_shift_days: "=due_date_change_max_shift_days", due_date_change_min_installments_paid: "=due_date_change_min_installments_paid"}
        Kestrel Finance Tier B: {due_date_change_max_lifetime: "=due_date_change_max_lifetime", due_date_change_max_shift_days: "=due_date_change_max_shift_days", due_date_change_min_installments_paid: "=due_date_change_min_installments_paid"}
        Kestrel Finance Tier A: {due_date_change_max_lifetime: "=due_date_change_max_lifetime", due_date_change_max_shift_days: "=due_date_change_max_shift_days", due_date_change_min_installments_paid: "=due_date_change_min_installments_paid"}
        Kestrel Finance Tier A+: {due_date_change_max_lifetime: "=due_date_change_max_lifetime", due_date_change_max_shift_days: "=due_date_change_max_shift_days", due_date_change_min_installments_paid: "=due_date_change_min_installments_paid"}
    measures: [finance_msr_installments_paid]

  - id: finance_payoff
    subject: [finance_payoff_quote_issued, finance_contract_paid_off]
    rule: >-
      A payoff quote is issued only on a contract whose status is active. The good-through date is the quote date
      plus the tier's payoff quote validity days. The quoted amount is the principal balance plus fees due plus
      daily simple interest from the last payment date through the good-through date, counted by
      finance_msr_days_to_good_through; the per diem stated on the quote is one day of interest on the principal
      balance, rounded to the cent. A payoff received after the good-through date must include the per diem for
      each later day. The contract is paid off when a payoff payment brings principal, interest and fees to zero;
      the lien release is sent within the tier's lien release business days and any overpayment is refunded to the
      borrower within the tier's overpayment refund business days. Holding X changes Y: paying off a contract ends
      any Kestrel GAP waiver attached to it.
    eligibility:
      - id: quote_active
        applies_to: [finance_payoff_quote_issued]
        kind: state
        condition: "A payoff quote is issued only on a contract whose status is active."
        evidence_fields: [finance_contracts.status, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        state_contract:
          field: finance_contracts.status
          allowed: [active]
    params:
      per_tier:
        Kestrel Finance Tier E: {payoff_quote_validity_days: "=payoff_quote_validity_days", lien_release_business_days: "=lien_release_business_days"}
        Kestrel Finance Tier D: {payoff_quote_validity_days: "=payoff_quote_validity_days", lien_release_business_days: "=lien_release_business_days"}
        Kestrel Finance Tier C: {payoff_quote_validity_days: "=payoff_quote_validity_days", lien_release_business_days: "=lien_release_business_days"}
        Kestrel Finance Tier B: {payoff_quote_validity_days: "=payoff_quote_validity_days", lien_release_business_days: "=lien_release_business_days"}
        Kestrel Finance Tier A: {payoff_quote_validity_days: "=payoff_quote_validity_days", lien_release_business_days: "=lien_release_business_days"}
        Kestrel Finance Tier A+: {payoff_quote_validity_days: "=payoff_quote_validity_days", lien_release_business_days: "=lien_release_business_days"}
    formula:
      per_diem_interest: "round(principal_balance * apr / 100 / interest_day_count_basis, 2)"
      amount: "round(principal_balance + fees_due + principal_balance * apr / 100 / interest_day_count_basis * finance_msr_days_to_good_through, 2)"
    measures: [finance_msr_days_to_good_through]

  - id: finance_principal_credits
    subject: [finance_principal_credited, finance_contract_unwound]
    rule: >-
      Refunds of financed KestrelCare service contracts, GAP waivers and maintenance plans cancelled while the
      contract is active are paid to Kestrel Auto Finance as lienholder and credited to principal, one credit per
      cancelled product; they never reduce the monthly payment and do not count as a payment toward the next due
      date. A principal credit is posted only on a contract whose status is active or unwound. When the financed
      vehicle is returned under the 7-day return, or the purchase is cancelled before handover after the contract
      was signed, the contract is unwound: a contract_unwind credit clears the remaining principal, any fees due are
      waived, and any installments the borrower paid are refunded within the tier's unwind payment refund business
      days. A refund of a product whose contract is already paid off goes to the borrower instead and is not
      credited here.
    eligibility:
      - id: credit_state
        applies_to: [finance_principal_credited]
        kind: state
        condition: "A principal credit is posted only on a contract whose status is active or unwound."
        evidence_fields: [finance_contracts.status, finance_contracts.finance_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [finance_contracts.finance_contract_id]
          action_bindings:
            finance_contracts.finance_contract_id: finance_contract_id
        state_contract:
          field: finance_contracts.status
          allowed: [active, unwound]
    params:
      per_tier:
        Kestrel Finance Tier E: {unwind_payment_refund_business_days: "=unwind_payment_refund_business_days"}
        Kestrel Finance Tier D: {unwind_payment_refund_business_days: "=unwind_payment_refund_business_days"}
        Kestrel Finance Tier C: {unwind_payment_refund_business_days: "=unwind_payment_refund_business_days"}
        Kestrel Finance Tier B: {unwind_payment_refund_business_days: "=unwind_payment_refund_business_days"}
        Kestrel Finance Tier A: {unwind_payment_refund_business_days: "=unwind_payment_refund_business_days"}
        Kestrel Finance Tier A+: {unwind_payment_refund_business_days: "=unwind_payment_refund_business_days"}

  - id: finance_approval_lifecycle
    subject: [finance_application_withdrawn, finance_approval_expired]
    rule: >-
      An approval that is not signed by the end of its approval expiration date lapses to expired; a new
      application is required, decided on the applicant's credit at that time. A borrower may withdraw an unsigned
      approval at any time, and an approval is withdrawn when the purchase order it was written for is cancelled
      before signing. Withdrawn and expired approvals carry no balance and no fees.
    eligibility: []

# ============================================================================
# extended_policies of the auto_loan_servicing difficulty (erl-task-instantiate)
# ============================================================================
extended_policies:
  - id: finance_ext_late_fee_assessment
    base_policy_refs: [finance_payment_application, finance_late_fees]
    overwrite:
      - base_policy: finance_late_fees
        superseded_clause: >-
          The late fee is the tier's late fee percentage of the monthly payment, no less than the tier's minimum and
          no more than its maximum, rounded to the cent.
        replaced_by: >-
          The late fee is worked out in this order: the late-fee percentage for the registration state, less the
          tenure reduction, is applied to the monthly payment; that amount is capped at the tier's maximum late fee;
          the capped amount is multiplied by the courtesy multiplier and rounded to the cent; and the rounded amount
          is raised to the late-fee floor when it falls below it.
    trigger: state_due
    subject: [finance_fee_assessed]
    computes: late_fee_amount
    target_tool: assess_late_fee_56686208
    params:
      fl_nc_late_fee_pct: 4.0
      ga_tx_late_fee_pct: 5.5
      long_tenure_cut_points: 1.0
      mid_tenure_cut_points: 0.5
      clean_record_courtesy: 0.5
      returned_payment_courtesy: 0.6
      small_payment_limit_usd: 600.00
      seasoned_small_payment_floor_usd: 10.00
      new_small_payment_floor_usd: 12.50
    rule: >-
      A late fee is charged once on an installment that is still unpaid after its grace period, as a late-fee entry
      dated the assessment date that names the installment. The standard late fee is the tier's late fee percentage
      of the monthly payment, no more than the tier's maximum late fee and no less than the tier's minimum late fee,
      rounded to the cent. The late-fee percentage follows the state where the financed vehicle is registered, as
      shown on the purchase order the contract finances: a vehicle registered in Florida or North Carolina takes the
      Florida and North Carolina late-fee percentage; a vehicle registered in Georgia or Texas takes the Georgia and
      Texas late-fee percentage; a vehicle registered in any other state takes the tier's late fee percentage. The
      late-fee percentage is lowered by a tenure reduction in percentage points set by the installments paid on the
      contract, counted as its scheduled-installment payments less its returned payments: 24 or more installments
      paid take the long-tenure late-fee reduction; 12 to 23 installments paid take the mid-tenure late-fee
      reduction; fewer than 12 installments paid take no reduction. The late fee is multiplied by a courtesy
      multiplier set by the contract's recent record, where a late fee counts when fewer than 12 whole months
      separate its assessment date from the new assessment date and a returned payment counts when fewer than 6
      whole months separate the date of the return from the new assessment date: at most one late fee in that
      12-month window together with no returned payment in that 6-month window takes the clean-record late-fee
      courtesy; at most one late fee in that 12-month window together with at least one returned payment in that
      6-month window takes the returned-payment late-fee courtesy; any other record takes no courtesy, and the fee
      is charged in full. The late-fee floor follows the size of the monthly payment and the age of the contract in
      whole months from the contract date to the assessment date: a monthly payment below the small-payment limit
      on a contract at least 12 whole months old takes the seasoned small-payment late-fee floor; a monthly payment
      below the small-payment limit on a contract less than 12 whole months old takes the new small-payment
      late-fee floor; any other contract takes the tier's minimum late fee as its late-fee floor. The late fee is
      worked out in this order: the late-fee percentage for the registration state, less the tenure reduction, is
      applied to the monthly payment; that amount is capped at the tier's maximum late fee; the capped amount is
      multiplied by the courtesy multiplier and rounded to the cent; and the rounded amount is raised to the
      late-fee floor when it falls below it.
    prerequisite: []
    cross_category:
      - category: purchase
        as: branch
        reads: [registration_state]
        note: The registration state on the financed purchase order decides the late-fee percentage tier.
    compute:
      - registration_state: "CFIELD('purchase', 'registration_state', purchase_order_id=F('purchase_order_id'))"
      - state_late_fee_pct: "K('fl_nc_late_fee_pct') if (registration_state == 'FL' or registration_state == 'NC') else (K('ga_tx_late_fee_pct') if (registration_state == 'GA' or registration_state == 'TX') else P('late_fee_pct'))"
      - installments_paid: "COUNT('finance_transactions', event_type='finance_payment_posted', payment_type='scheduled_installment') - COUNT('finance_transactions', event_type='finance_payment_returned')"
      - tenure_cut_points: "K('long_tenure_cut_points') if installments_paid >= 24 else (K('mid_tenure_cut_points') if installments_paid >= 12 else 0)"
      - late_fees_12m: "COUNT('finance_transactions', within_months=12, date_field='txn_date', event_type='finance_fee_assessed', fee_type='late_fee')"
      - returns_6m: "COUNT('finance_transactions', within_months=6, date_field='txn_date', event_type='finance_payment_returned')"
      - courtesy_multiplier: "K('clean_record_courtesy') if (late_fees_12m <= 1 and returns_6m == 0) else (K('returned_payment_courtesy') if (late_fees_12m <= 1 and returns_6m >= 1) else 1)"
      - contract_age_months: "MONTHS(F('contract_date'), NOW)"
      - late_fee_floor: "K('seasoned_small_payment_floor_usd') if (F('monthly_payment') < K('small_payment_limit_usd') and contract_age_months >= 12) else (K('new_small_payment_floor_usd') if (F('monthly_payment') < K('small_payment_limit_usd') and contract_age_months < 12) else P('late_fee_min_usd'))"
      - applied_pct: "state_late_fee_pct - tenure_cut_points"
      - capped_fee: "MN(applied_pct / 100 * F('monthly_payment'), P('late_fee_max_usd'))"
      - result: "MX(late_fee_floor, RND(capped_fee * courtesy_multiplier, 2))"
    compute_basis:
      registration_state: "The late-fee percentage follows the state where the financed vehicle is registered, as shown on the purchase order the contract finances"
      state_late_fee_pct: "a vehicle registered in Florida or North Carolina takes the Florida and North Carolina late-fee percentage; a vehicle registered in Georgia or Texas takes the Georgia and Texas late-fee percentage; a vehicle registered in any other state takes the tier's late fee percentage."
      installments_paid: "set by the installments paid on the contract, counted as its scheduled-installment payments less its returned payments"
      tenure_cut_points: "24 or more installments paid take the long-tenure late-fee reduction; 12 to 23 installments paid take the mid-tenure late-fee reduction; fewer than 12 installments paid take no reduction."
      late_fees_12m: "a late fee counts when fewer than 12 whole months separate its assessment date from the new assessment date"
      returns_6m: "a returned payment counts when fewer than 6 whole months separate the date of the return from the new assessment date"
      courtesy_multiplier: "at most one late fee in that 12-month window together with no returned payment in that 6-month window takes the clean-record late-fee courtesy; at most one late fee in that 12-month window together with at least one returned payment in that 6-month window takes the returned-payment late-fee courtesy; any other record takes no courtesy, and the fee is charged in full."
      contract_age_months: "the age of the contract in whole months from the contract date to the assessment date"
      late_fee_floor: "a monthly payment below the small-payment limit on a contract at least 12 whole months old takes the seasoned small-payment late-fee floor; a monthly payment below the small-payment limit on a contract less than 12 whole months old takes the new small-payment late-fee floor; any other contract takes the tier's minimum late fee as its late-fee floor."
      applied_pct: "the late-fee percentage for the registration state, less the tenure reduction, is applied to the monthly payment"
      capped_fee: "that amount is capped at the tier's maximum late fee"
      result: "the capped amount is multiplied by the courtesy multiplier and rounded to the cent; and the rounded amount is raised to the late-fee floor when it falls below it."
    factors:
      - id: late_fee_state_percentage
        effect: parameter
        decides: state_late_fee_pct
        bindings: [registration_state, state_late_fee_pct]
        ladder:
          - when: "the financed vehicle is registered in Florida or North Carolina"
            value: "K('fl_nc_late_fee_pct')"
          - when: "the financed vehicle is registered in Georgia or Texas"
            value: "K('ga_tx_late_fee_pct')"
          - when: "otherwise"
            value: "P('late_fee_pct')"
        baseline:
          state_late_fee_pct: "P('late_fee_pct')"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: late_fee_tenure_reduction
        effect: parameter
        decides: tenure_cut_points
        bindings: [installments_paid, tenure_cut_points]
        ladder:
          - when: "24 or more installments paid on the contract"
            value: "K('long_tenure_cut_points')"
          - when: "12 to 23 installments paid on the contract"
            value: "K('mid_tenure_cut_points')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_cut_points: "0"
        evidence: [history]
        cross_difficulty: null
      - id: late_fee_courtesy
        effect: method
        decides: courtesy_multiplier
        bindings: [late_fees_12m, returns_6m, courtesy_multiplier]
        ladder:
          - when: "at most one late fee in the prior 12 whole months and no returned payment in the prior 6 whole months"
            method: "the capped late fee is multiplied by the clean-record late-fee courtesy before rounding"
          - when: "at most one late fee in the prior 12 whole months and at least one returned payment in the prior 6 whole months"
            method: "the capped late fee is multiplied by the returned-payment late-fee courtesy before rounding"
          - when: "otherwise"
            method: "the capped late fee is charged in full"
        baseline:
          courtesy_multiplier: "1"
        evidence: [history]
        cross_difficulty: null
      - id: late_fee_small_payment_floor
        effect: parameter
        decides: late_fee_floor
        bindings: [contract_age_months, late_fee_floor]
        ladder:
          - when: "monthly payment below the small-payment limit and the contract at least 12 whole months old"
            value: "K('seasoned_small_payment_floor_usd')"
          - when: "monthly payment below the small-payment limit and the contract less than 12 whole months old"
            value: "K('new_small_payment_floor_usd')"
          - when: "otherwise"
            value: "P('late_fee_min_usd')"
        baseline:
          late_fee_floor: "P('late_fee_min_usd')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        A late fee is charged once on an installment that is still unpaid after its grace period, as a late-fee
        entry dated the assessment date that names the installment. The standard late fee is the tier's late fee
        percentage of the monthly payment, no more than the tier's maximum late fee and no less than the tier's
        minimum late fee, rounded to the cent.
      params: [late_fee_pct, late_fee_max_usd, late_fee_min_usd]
    inputs:
      history:
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, filters: {event_type: finance_payment_posted, payment_type: scheduled_installment}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, filters: {event_type: finance_payment_returned}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, within_months: 12, filters: {event_type: finance_fee_assessed, fee_type: late_fee}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, within_months: 6, filters: {event_type: finance_payment_returned}}
      cross_category: [purchase]

  - id: finance_ext_returned_payment_fee
    base_policy_refs: [finance_payment_application, finance_late_fees, finance_returned_payments]
    overwrite:
      - base_policy: finance_returned_payments
        superseded_clause: >-
          and the tier's returned-payment fee is assessed.
        replaced_by: >-
          The returned-payment fee is worked out in this order: the returned-payment fee for the registration state
          and the returned-amount add-on are added together; that sum is multiplied by the repeat-return
          multiplier; the tenure credit and the protection-plan credit are subtracted and the payment-channel
          charge is added; and the result, never below zero, is rounded to the cent.
    trigger: state_due
    subject: [finance_fee_assessed]
    computes: returned_fee_amount
    target_tool: assess_returned_payment_fee_ca20439d
    params:
      fl_returned_fee_usd: 30.00
      ga_tx_returned_fee_usd: 35.00
      large_return_limit_usd: 500.00
      large_return_addon_usd: 10.00
      medium_return_limit_usd: 300.00
      medium_return_addon_usd: 5.00
      third_return_multiplier: 2.0
      second_return_multiplier: 1.5
      long_tenure_return_credit_usd: 6.00
      mid_tenure_return_credit_usd: 3.00
      two_plan_return_credit_usd: 4.00
      one_plan_return_credit_usd: 2.00
      electronic_return_charge_usd: 2.00
      paper_return_charge_usd: 5.00
    rule: >-
      A returned-payment fee is charged once for each borrower payment the borrower's bank returns, as a
      returned-payment fee entry dated the assessment date that names the returned payment and the installment it
      was made for; a returned-payment fee not charged on the date of the return is charged on the date it is assessed. The standard returned-payment fee is the tier's returned-payment fee, rounded to the cent. The
      returned-payment fee for the registration state follows the state where the financed vehicle is registered,
      as shown on the purchase order the contract finances: a vehicle registered in Florida takes the Florida
      returned-payment fee; a vehicle registered in Georgia or Texas takes the Georgia and Texas returned-payment
      fee; a vehicle registered in any other state takes the tier's returned-payment fee. A returned-amount add-on
      follows the full amount of the most recent returned payment: an amount above the large-return limit takes the
      large-return add-on; an amount above the medium-return limit and no more than the large-return limit takes the
      medium-return add-on; any smaller amount takes no add-on. A repeat-return multiplier follows the returned
      payments on the contract dated fewer than 12 whole months before the assessment date, the return being charged
      included: three or more take the third-return multiplier; exactly two take the second-return multiplier; one
      takes no multiplier. A tenure credit follows the installments paid on the contract, counted as its
      scheduled-installment payments less its returned payments: 24 or more take the long-tenure returned-payment
      credit; 12 to 23 take the mid-tenure returned-payment credit; fewer than 12 take no credit. A protection-plan
      credit follows the borrower's KestrelCare plans: an active KestrelCare service contract financed in this
      contract together with an active KestrelCare prepaid maintenance plan takes the two-plan returned-payment
      credit; an active KestrelCare service contract financed in this contract without an active KestrelCare
      prepaid maintenance plan takes the one-plan returned-payment credit; any other borrower takes no credit. A
      payment-channel charge follows the channel of the returned payment as its return entry shows it: a one-time
      online or representative-assisted bank or debit card payment takes the electronic return charge; a mailed
      check or a MoneyGram payment takes the paper return charge; an autopay draft takes no charge. The
      returned-payment fee is worked out in this order: the returned-payment fee for the registration state and the
      returned-amount add-on are added together; that sum is multiplied by the repeat-return multiplier; the tenure
      credit and the protection-plan credit are subtracted and the payment-channel charge is added; and the result,
      never below zero, is rounded to the cent.
    prerequisite: []
    cross_category:
      - category: purchase
        as: branch
        reads: [registration_state]
        note: The registration state on the financed purchase order decides the returned-payment fee for the state.
      - category: warranty
        as: existence
        reads: [status, finance_contract_id]
        note: An active KestrelCare service contract financed in this contract decides the protection-plan credit tier.
      - category: maintenance
        as: existence
        reads: [status]
        note: An active KestrelCare prepaid maintenance plan decides between the two-plan and one-plan credit.
    compute:
      - registration_state: "CFIELD('purchase', 'registration_state', purchase_order_id=F('purchase_order_id'))"
      - state_returned_fee: "K('fl_returned_fee_usd') if registration_state == 'FL' else (K('ga_tx_returned_fee_usd') if (registration_state == 'GA' or registration_state == 'TX') else P('returned_payment_fee_usd'))"
      - returned_amount: "LATEST('finance_transactions', 'total_received', date_field='txn_date', event_type='finance_payment_returned')"
      - returned_amount_addon: "K('large_return_addon_usd') if returned_amount > K('large_return_limit_usd') else (K('medium_return_addon_usd') if returned_amount > K('medium_return_limit_usd') else 0)"
      - returns_12m: "COUNT('finance_transactions', within_months=12, date_field='txn_date', event_type='finance_payment_returned')"
      - repeat_return_multiplier: "K('third_return_multiplier') if returns_12m >= 3 else (K('second_return_multiplier') if returns_12m == 2 else 1)"
      - installments_paid: "COUNT('finance_transactions', event_type='finance_payment_posted', payment_type='scheduled_installment') - COUNT('finance_transactions', event_type='finance_payment_returned')"
      - return_tenure_credit: "K('long_tenure_return_credit_usd') if installments_paid >= 24 else (K('mid_tenure_return_credit_usd') if installments_paid >= 12 else 0)"
      - service_contract_active: "EXISTS('warranty', finance_contract_id=HID, status='active')"
      - maintenance_plan_active: "EXISTS('maintenance', status='active')"
      - protection_plan_credit: "K('two_plan_return_credit_usd') if (service_contract_active and maintenance_plan_active) else (K('one_plan_return_credit_usd') if (service_contract_active and not maintenance_plan_active) else 0)"
      - returned_channel: "LATEST('finance_transactions', 'payment_channel', date_field='txn_date', event_type='finance_payment_returned')"
      - channel_charge: "K('electronic_return_charge_usd') if (returned_channel == 'online_ach' or returned_channel == 'online_debit_card' or returned_channel == 'agent_assisted_ach' or returned_channel == 'agent_assisted_debit_card') else (K('paper_return_charge_usd') if (returned_channel == 'mail_check' or returned_channel == 'moneygram') else 0)"
      - result: "RND(MX(0, (state_returned_fee + returned_amount_addon) * repeat_return_multiplier - return_tenure_credit - protection_plan_credit + channel_charge), 2)"
    compute_basis:
      registration_state: "The returned-payment fee for the registration state follows the state where the financed vehicle is registered, as shown on the purchase order the contract finances"
      state_returned_fee: "a vehicle registered in Florida takes the Florida returned-payment fee; a vehicle registered in Georgia or Texas takes the Georgia and Texas returned-payment fee; a vehicle registered in any other state takes the tier's returned-payment fee."
      returned_amount: "A returned-amount add-on follows the full amount of the most recent returned payment"
      returned_amount_addon: "an amount above the large-return limit takes the large-return add-on; an amount above the medium-return limit and no more than the large-return limit takes the medium-return add-on; any smaller amount takes no add-on."
      returns_12m: "A repeat-return multiplier follows the returned payments on the contract dated fewer than 12 whole months before the assessment date, the return being charged included"
      repeat_return_multiplier: "three or more take the third-return multiplier; exactly two take the second-return multiplier; one takes no multiplier."
      installments_paid: "A tenure credit follows the installments paid on the contract, counted as its scheduled-installment payments less its returned payments"
      return_tenure_credit: "24 or more take the long-tenure returned-payment credit; 12 to 23 take the mid-tenure returned-payment credit; fewer than 12 take no credit."
      service_contract_active: "an active KestrelCare service contract financed in this contract"
      maintenance_plan_active: "an active KestrelCare prepaid maintenance plan"
      protection_plan_credit: "an active KestrelCare service contract financed in this contract together with an active KestrelCare prepaid maintenance plan takes the two-plan returned-payment credit; an active KestrelCare service contract financed in this contract without an active KestrelCare prepaid maintenance plan takes the one-plan returned-payment credit; any other borrower takes no credit."
      returned_channel: "A payment-channel charge follows the channel of the returned payment as its return entry shows it"
      channel_charge: "a one-time online or representative-assisted bank or debit card payment takes the electronic return charge; a mailed check or a MoneyGram payment takes the paper return charge; an autopay draft takes no charge."
      result: "the returned-payment fee for the registration state and the returned-amount add-on are added together; that sum is multiplied by the repeat-return multiplier; the tenure credit and the protection-plan credit are subtracted and the payment-channel charge is added; and the result, never below zero, is rounded to the cent."
    factors:
      - id: returned_fee_state_schedule
        effect: parameter
        decides: state_returned_fee
        bindings: [registration_state, state_returned_fee]
        ladder:
          - when: "the financed vehicle is registered in Florida"
            value: "K('fl_returned_fee_usd')"
          - when: "the financed vehicle is registered in Georgia or Texas"
            value: "K('ga_tx_returned_fee_usd')"
          - when: "otherwise"
            value: "P('returned_payment_fee_usd')"
        baseline:
          state_returned_fee: "P('returned_payment_fee_usd')"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: returned_amount_addon
        effect: parameter
        decides: returned_amount_addon
        bindings: [returned_amount, returned_amount_addon]
        ladder:
          - when: "the most recent returned payment is above the large-return limit"
            value: "K('large_return_addon_usd')"
          - when: "the most recent returned payment is above the medium-return limit and no more than the large-return limit"
            value: "K('medium_return_addon_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          returned_amount_addon: "0"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_return_multiplier
        effect: method
        decides: repeat_return_multiplier
        bindings: [returns_12m, repeat_return_multiplier]
        ladder:
          - when: "three or more returned payments in the prior 12 whole months, the charged one included"
            method: "the state fee plus the add-on is multiplied by the third-return multiplier"
          - when: "exactly two returned payments in the prior 12 whole months, the charged one included"
            method: "the state fee plus the add-on is multiplied by the second-return multiplier"
          - when: "otherwise"
            method: "the state fee plus the add-on is charged as it stands"
        baseline:
          repeat_return_multiplier: "1"
        evidence: [history]
        cross_difficulty: null
      - id: returned_fee_tenure_credit
        effect: parameter
        decides: return_tenure_credit
        bindings: [installments_paid, return_tenure_credit]
        ladder:
          - when: "24 or more installments paid"
            value: "K('long_tenure_return_credit_usd')"
          - when: "12 to 23 installments paid"
            value: "K('mid_tenure_return_credit_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          return_tenure_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: returned_fee_protection_plan_credit
        effect: parameter
        decides: protection_plan_credit
        bindings: [service_contract_active, maintenance_plan_active, protection_plan_credit]
        ladder:
          - when: "an active KestrelCare service contract financed in this contract and an active KestrelCare prepaid maintenance plan"
            value: "K('two_plan_return_credit_usd')"
          - when: "an active KestrelCare service contract financed in this contract and no active KestrelCare prepaid maintenance plan"
            value: "K('one_plan_return_credit_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          protection_plan_credit: "0"
        evidence: [cross_category]
        cross_difficulty: warranty
      - id: returned_payment_channel_charge
        effect: parameter
        decides: channel_charge
        bindings: [returned_channel, channel_charge]
        ladder:
          - when: "the returned payment was a one-time online or representative-assisted bank or debit card payment"
            value: "K('electronic_return_charge_usd')"
          - when: "the returned payment was a mailed check or a MoneyGram payment"
            value: "K('paper_return_charge_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          channel_charge: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A returned-payment fee is charged once for each borrower payment the borrower's bank returns, as a
        returned-payment fee entry dated the assessment date that names the returned payment and the installment it
        was made for; a returned-payment fee not charged on the date of the return is charged on the date it is assessed. The standard returned-payment fee is the tier's returned-payment fee, rounded to the cent.
      params: [returned_payment_fee_usd]
    inputs:
      history:
        - {table: finance_transactions, aggregate: latest, field: total_received, filters: {event_type: finance_payment_returned}}
        - {table: finance_transactions, aggregate: latest, field: payment_channel, filters: {event_type: finance_payment_returned}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, within_months: 12, filters: {event_type: finance_payment_returned}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, filters: {event_type: finance_payment_posted, payment_type: scheduled_installment}}
      cross_category: [purchase, warranty, maintenance]

  - id: finance_ext_deferral_qualifying_payment
    base_policy_refs: [finance_payment_application]
    overwrite: []
    trigger: on_request
    subject: [finance_payment_posted]
    computes: total_received
    target_tool: pay_deferral_qualifying_amount_eaa14a46
    params:
      new_borrower_good_faith_days: 30
      seasoned_borrower_good_faith_days: 15
      entry_program_good_faith_days: 5
      certified_program_good_faith_days: 2
      late_stage_good_faith_days: 5
      early_stage_good_faith_days: 2
      long_seasoning_reduction_days: 3
      mid_seasoning_reduction_days: 1
      heavy_lateness_multiplier: 2.0
      two_late_multiplier: 1.5
    rule: >-
      A deferral qualifying payment is the one-time partial payment a borrower makes on the contract when asking to
      defer an installment, made by the borrower from their own bank account. The standard deferral qualifying
      payment is the interest accrued on the principal balance from the last payment date to the payment date, at
      the contract APR over the tier's day-count basis for each of those calendar days and rounded to the cent, plus
      the fees due on the contract. It posts as a partial payment applied to that accrued interest and then to those
      fees, and it never moves the next due date. The deferral qualifying payment is fixed only after the loan history carries a late-fee entry naming every installment that is still unpaid after its grace period. The deferral qualifying payment is not fixed until the loan history carries a returned-payment fee entry naming every borrower payment the bank has returned. The deferral qualifying payment also carries a good-faith amount, applied to
      principal, equal to one day's interest on the principal balance at the contract APR over the tier's day-count
      basis multiplied by the good-faith days and rounded to the cent. The good-faith days start from the
      borrower's standing, where an installment counts as paid when it was paid by a scheduled-installment payment
      that no returned payment reversed and a returned payment counts when fewer than 12 whole months separate its
      date from the payment date: fewer than 12 installments paid together with at least one returned payment in
      that 12-month window take the new-borrower good-faith days; 12 or more installments paid together with at
      least one returned payment in that 12-month window take the seasoned-borrower good-faith days; a borrower
      with no returned payment in that 12-month window starts from no good-faith days. The good-faith days are
      raised by a vehicle-program allowance read from the purchase order the contract finances: a vehicle sold
      under Kestrel Value Line or Kestrel Inspected adds the entry-program good-faith days; a vehicle sold under
      Kestrel Certified or Kestrel Certified Plus adds the certified-program good-faith days; a vehicle sold under
      any higher program adds none. The good-faith days are raised by a delinquency allowance counted in calendar
      days from the next due date to the payment date: 16 or more days past due add the late-stage good-faith days;
      1 to 15 days past due add the early-stage good-faith days; an installment not yet past due adds none. The
      good-faith days are lowered by a seasoning reduction counted in whole months from the contract date to the
      payment date: a contract at least 24 whole months old subtracts the long-seasoning reduction days; a contract
      12 to 23 whole months old subtracts the mid-seasoning reduction days; a younger contract subtracts none. The
      good-faith days are then scaled by the lateness record, counting the late fees assessed on the contract when
      fewer than 12 whole months separate their assessment date from the payment date: three or more such late
      fees multiply the good-faith days by the heavy-lateness multiplier; exactly two multiply them by the
      two-late multiplier; one or none leave them as they are. The good-faith days are worked out in this order: the
      standing days, plus the vehicle-program allowance, plus the delinquency allowance, less the seasoning
      reduction, multiplied by the lateness multiplier and never below zero; the deferral qualifying payment is the
      accrued interest plus the fees due plus the good-faith amount, rounded to the cent.
    prerequisite:
      - problem: finance_ext_late_fee_assessment
        kind: value_input
        gate: fees_outstanding
        form: state
        policy_source: >-
          The deferral qualifying payment is fixed only after the loan history carries a late-fee entry naming every installment that is still unpaid after its grace period.
        condition: >-
          Every installment of the contract whose due date plus the tier's grace days lies before the payment date
          and that no scheduled-installment payment has satisfied carries a late-fee entry naming it, so the
          contract's fees due include that late fee.
        resolved_by: assess_late_fee_56686208
        effect: >-
          The late fee charged for the installment unpaid after grace raises the fees due, and with them the
          fees_outstanding input and the deferral qualifying payment, by the amount of that late fee.
      - problem: finance_ext_returned_payment_fee
        kind: value_input
        gate: fees_outstanding
        form: state
        policy_source: >-
          The deferral qualifying payment is not fixed until the loan history carries a returned-payment fee entry naming every borrower payment the bank has returned.
        condition: >-
          Every returned-payment entry on the contract is matched by a returned-payment fee entry whose source names
          the payment the bank returned, so the contract's fees due include that fee.
        resolved_by: assess_returned_payment_fee_ca20439d
        effect: >-
          The returned-payment fee charged for the returned payment raises the fees due, and with them the
          fees_outstanding input and the deferral qualifying payment, by the amount of that fee.
    cross_category:
      - category: purchase
        as: branch
        reads: [variant_name]
        note: The vehicle program on the financed purchase order decides the vehicle-program allowance of good-faith days.
    compute:
      - days_accrued: "DAYS(F('last_payment_date'), NOW)"
      - accrued_interest: "RND(F('principal_balance') * F('apr') / 100 / P('interest_day_count_basis') * days_accrued, 2)"
      - fees_outstanding: "F('fees_due')"
      - installments_paid: "COUNT('finance_transactions', event_type='finance_payment_posted', payment_type='scheduled_installment') - COUNT('finance_transactions', event_type='finance_payment_returned')"
      - returns_12m: "COUNT('finance_transactions', within_months=12, date_field='txn_date', event_type='finance_payment_returned')"
      - standing_days: "K('new_borrower_good_faith_days') if (installments_paid < 12 and returns_12m >= 1) else (K('seasoned_borrower_good_faith_days') if (installments_paid >= 12 and returns_12m >= 1) else 0)"
      - vehicle_program: "CFIELD('purchase', 'variant_name', purchase_order_id=F('purchase_order_id'))"
      - program_allowance_days: "K('entry_program_good_faith_days') if (vehicle_program == 'Kestrel Value Line' or vehicle_program == 'Kestrel Inspected') else (K('certified_program_good_faith_days') if (vehicle_program == 'Kestrel Certified' or vehicle_program == 'Kestrel Certified Plus') else 0)"
      - days_past_due: "DAYS(F('next_due_date'), NOW)"
      - delinquency_allowance_days: "K('late_stage_good_faith_days') if days_past_due >= 16 else (K('early_stage_good_faith_days') if days_past_due >= 1 else 0)"
      - contract_age_months: "MONTHS(F('contract_date'), NOW)"
      - seasoning_reduction_days: "K('long_seasoning_reduction_days') if contract_age_months >= 24 else (K('mid_seasoning_reduction_days') if contract_age_months >= 12 else 0)"
      - late_fees_12m: "COUNT('finance_transactions', within_months=12, date_field='txn_date', event_type='finance_fee_assessed', fee_type='late_fee')"
      - lateness_multiplier: "K('heavy_lateness_multiplier') if late_fees_12m >= 3 else (K('two_late_multiplier') if late_fees_12m == 2 else 1)"
      - good_faith_days: "MX(0, (standing_days + program_allowance_days + delinquency_allowance_days - seasoning_reduction_days) * lateness_multiplier)"
      - good_faith_amount: "RND(F('principal_balance') * F('apr') / 100 / P('interest_day_count_basis') * good_faith_days, 2)"
      - result: "RND(accrued_interest + fees_outstanding + good_faith_amount, 2)"
    compute_basis:
      days_accrued: "the interest accrued on the principal balance from the last payment date to the payment date"
      accrued_interest: "at the contract APR over the tier's day-count basis for each of those calendar days and rounded to the cent"
      fees_outstanding: "plus the fees due on the contract"
      installments_paid: "an installment counts as paid when it was paid by a scheduled-installment payment that no returned payment reversed"
      returns_12m: "a returned payment counts when fewer than 12 whole months separate its date from the payment date"
      standing_days: "fewer than 12 installments paid together with at least one returned payment in that 12-month window take the new-borrower good-faith days; 12 or more installments paid together with at least one returned payment in that 12-month window take the seasoned-borrower good-faith days; a borrower with no returned payment in that 12-month window starts from no good-faith days."
      vehicle_program: "a vehicle-program allowance read from the purchase order the contract finances"
      program_allowance_days: "a vehicle sold under Kestrel Value Line or Kestrel Inspected adds the entry-program good-faith days; a vehicle sold under Kestrel Certified or Kestrel Certified Plus adds the certified-program good-faith days; a vehicle sold under any higher program adds none."
      days_past_due: "a delinquency allowance counted in calendar days from the next due date to the payment date"
      delinquency_allowance_days: "16 or more days past due add the late-stage good-faith days; 1 to 15 days past due add the early-stage good-faith days; an installment not yet past due adds none."
      contract_age_months: "a seasoning reduction counted in whole months from the contract date to the payment date"
      seasoning_reduction_days: "a contract at least 24 whole months old subtracts the long-seasoning reduction days; a contract 12 to 23 whole months old subtracts the mid-seasoning reduction days; a younger contract subtracts none."
      late_fees_12m: "counting the late fees assessed on the contract when fewer than 12 whole months separate their assessment date from the payment date"
      lateness_multiplier: "three or more such late fees multiply the good-faith days by the heavy-lateness multiplier; exactly two multiply them by the two-late multiplier; one or none leave them as they are."
      good_faith_days: "the standing days, plus the vehicle-program allowance, plus the delinquency allowance, less the seasoning reduction, multiplied by the lateness multiplier and never below zero"
      good_faith_amount: "equal to one day's interest on the principal balance at the contract APR over the tier's day-count basis multiplied by the good-faith days and rounded to the cent."
      result: "the deferral qualifying payment is the accrued interest plus the fees due plus the good-faith amount, rounded to the cent."
    factors:
      - id: qualifying_standing_days
        effect: parameter
        decides: standing_days
        bindings: [installments_paid, returns_12m, standing_days]
        ladder:
          - when: "fewer than 12 installments paid and at least one returned payment in the prior 12 whole months"
            value: "K('new_borrower_good_faith_days')"
          - when: "12 or more installments paid and at least one returned payment in the prior 12 whole months"
            value: "K('seasoned_borrower_good_faith_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          standing_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: qualifying_lateness_multiplier
        effect: method
        decides: lateness_multiplier
        bindings: [late_fees_12m, lateness_multiplier]
        ladder:
          - when: "three or more late fees assessed in the prior 12 whole months"
            method: "the good-faith days are multiplied by the heavy-lateness multiplier"
          - when: "exactly two late fees assessed in the prior 12 whole months"
            method: "the good-faith days are multiplied by the two-late multiplier"
          - when: "otherwise"
            method: "the good-faith days are taken as they stand"
        baseline:
          lateness_multiplier: "1"
        evidence: [history]
        cross_difficulty: null
      - id: qualifying_program_allowance
        effect: parameter
        decides: program_allowance_days
        bindings: [vehicle_program, program_allowance_days]
        ladder:
          - when: "vehicle sold under Kestrel Value Line or Kestrel Inspected"
            value: "K('entry_program_good_faith_days')"
          - when: "vehicle sold under Kestrel Certified or Kestrel Certified Plus"
            value: "K('certified_program_good_faith_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          program_allowance_days: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: qualifying_delinquency_allowance
        effect: parameter
        decides: delinquency_allowance_days
        bindings: [days_past_due, delinquency_allowance_days]
        ladder:
          - when: "16 or more calendar days past due"
            value: "K('late_stage_good_faith_days')"
          - when: "1 to 15 calendar days past due"
            value: "K('early_stage_good_faith_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          delinquency_allowance_days: "0"
        evidence: [date]
        cross_difficulty: null
      - id: qualifying_seasoning_reduction
        effect: parameter
        decides: seasoning_reduction_days
        bindings: [contract_age_months, seasoning_reduction_days]
        ladder:
          - when: "contract at least 24 whole months old"
            value: "K('long_seasoning_reduction_days')"
          - when: "contract 12 to 23 whole months old"
            value: "K('mid_seasoning_reduction_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          seasoning_reduction_days: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        A deferral qualifying payment is the one-time partial payment a borrower makes on the contract when asking to
        defer an installment, made by the borrower from their own bank account. The standard deferral qualifying
        payment is the interest accrued on the principal balance from the last payment date to the payment date, at
        the contract APR over the tier's day-count basis for each of those calendar days and rounded to the cent,
        plus the fees due on the contract. It posts as a partial payment applied to that accrued interest and then
        to those fees, and it never moves the next due date.
      params: [interest_day_count_basis]
    inputs:
      history:
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, filters: {event_type: finance_payment_posted, payment_type: scheduled_installment}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, within_months: 12, filters: {event_type: finance_payment_returned}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, within_months: 12, filters: {event_type: finance_fee_assessed, fee_type: late_fee}}
      cross_category: [purchase]

  - id: finance_ext_deferral_fee
    base_policy_refs: [finance_deferral]
    overwrite:
      - base_policy: finance_deferral
        superseded_clause: >-
          The tier's deferral fee, when above zero, is assessed as a deferral fee entry for the deferred installment.
        replaced_by: >-
          The deferral fee is worked out in this order: the deferral charge for the registration state is multiplied
          by the return-risk multiplier; the delinquency surcharge is added; the good-faith credit, the seasoning credit and the first-extension credit are subtracted; and the result, never below zero, is rounded to the
          cent and, when above zero, is assessed as a deferral fee entry for the deferred installment.
    trigger: on_request
    subject: [finance_deferral_granted, finance_deferral_applied]
    computes: deferral_fee
    target_tool: grant_payment_deferral_f4f9e9cb
    params:
      ga_nc_installment_share_pct: 5.0
      repeat_return_risk_factor: 1.5
      single_return_risk_factor: 1.25
      seasoned_good_faith_credit_usd: 3.00
      new_good_faith_credit_usd: 1.50
      late_stage_deferral_surcharge_usd: 5.00
      early_stage_deferral_surcharge_usd: 2.50
      long_seasoning_deferral_credit_usd: 2.00
      mid_seasoning_deferral_credit_usd: 1.00
      first_extension_credit_usd: 2.00
      second_extension_credit_usd: 1.00
    rule: >-
      A deferral moves the installment at the next due date to the end of the contract; the next due date and the
      maturity date each move one month later and the deferrals used rise by one. The standard deferral fee is the
      tier's deferral fee, assessed as a deferral fee entry for the deferred installment when it is above zero. A
      deferral fee is not fixed until a partial payment posted on the request date has cleared the fees due and the
      interest accrued on the contract. The deferral charge for the registration state follows the state where the
      financed vehicle is registered, as shown on the purchase order the contract finances: a vehicle registered in
      Florida or Texas is charged one month of interest on the deferred installment, that is the monthly payment
      times the contract APR divided by 100 and by 12, rounded to the cent; a vehicle registered in Georgia or North
      Carolina is charged the lesser of the tier's deferral fee and the Georgia and North Carolina installment share
      of the monthly payment, that share rounded to the cent; a vehicle registered in any other state is charged the
      tier's deferral fee. A return-risk multiplier follows the returned payments on the contract dated fewer than 12
      whole months before the request date: two or more returned payments multiply the deferral charge by the
      repeat-return risk factor; exactly one multiplies it by the single-return risk factor; none leaves it as it
      is. A good-faith credit follows the installments paid on the contract, counted as its scheduled-installment
      payments less its returned payments, and the partial payments posted on the request date: 12 or more
      installments paid together with a partial payment posted on the request date take the seasoned good-faith
      deferral credit; fewer than 12 installments paid together with a partial payment posted on the request date
      take the new good-faith deferral credit; a borrower with no partial payment posted on the request date takes
      no credit. A delinquency surcharge follows the days the deferred installment is past due, counted in calendar
      days from the next due date to the request date: 16 or more days take the late-stage deferral surcharge; 1 to
      15 days take the early-stage deferral surcharge; an installment not yet past due takes none. A seasoning
      credit follows the age of the contract in whole months from the contract date to the request date: at least
      24 whole months take the long-seasoning deferral credit; 12 to 23 whole months take the mid-seasoning deferral
      credit; a younger contract takes none. A first-extension credit follows the deferrals already granted on the contract, counted as its deferral
      entries: a contract with no earlier deferral takes the first-extension deferral credit; a contract with exactly
      one earlier deferral takes the second-extension deferral credit; a contract with two or more earlier deferrals
      takes none. The deferral fee is worked out in this order: the
      deferral charge for the registration state is multiplied by the return-risk multiplier; the delinquency
      surcharge is added; the good-faith credit, the seasoning credit and the first-extension credit are subtracted; and the result, never below zero, is rounded to the cent and, when above zero, is assessed as a
      deferral fee entry for the deferred installment.
    prerequisite:
      - problem: finance_ext_deferral_qualifying_payment
        kind: value_input
        gate: partial_payments_today
        form: state
        policy_source: >-
          A deferral fee is not fixed until a partial payment posted on the request date has cleared the fees due and
          the interest accrued on the contract.
        condition: >-
          The loan history carries a partial-payment entry dated the request date, the contract's fees due stand at
          zero and its last payment date equals the request date.
        resolved_by: pay_deferral_qualifying_amount_eaa14a46
        effect: >-
          The partial payment dated the request date moves the partial_payments_today input from zero to one, which
          moves the good-faith credit from none to the seasoned or new good-faith deferral credit and lowers the
          deferral fee by that credit.
    cross_category:
      - category: purchase
        as: branch
        reads: [registration_state]
        note: The registration state on the financed purchase order decides how the deferral charge is computed.
    compute:
      - registration_state: "CFIELD('purchase', 'registration_state', purchase_order_id=F('purchase_order_id'))"
      - deferral_charge_base: "RND(F('monthly_payment') * F('apr') / 100 / 12, 2) if (registration_state == 'FL' or registration_state == 'TX') else (MN(P('deferral_fee_usd'), RND(F('monthly_payment') * K('ga_nc_installment_share_pct') / 100, 2)) if (registration_state == 'GA' or registration_state == 'NC') else P('deferral_fee_usd'))"
      - returns_12m: "COUNT('finance_transactions', within_months=12, date_field='txn_date', event_type='finance_payment_returned')"
      - return_risk_multiplier: "K('repeat_return_risk_factor') if returns_12m >= 2 else (K('single_return_risk_factor') if returns_12m == 1 else 1)"
      - installments_paid: "COUNT('finance_transactions', event_type='finance_payment_posted', payment_type='scheduled_installment') - COUNT('finance_transactions', event_type='finance_payment_returned')"
      - partial_payments_today: "COUNT('finance_transactions', event_type='finance_payment_posted', payment_type='partial_payment', txn_date=NOW)"
      - good_faith_credit: "K('seasoned_good_faith_credit_usd') if (installments_paid >= 12 and partial_payments_today >= 1) else (K('new_good_faith_credit_usd') if (installments_paid < 12 and partial_payments_today >= 1) else 0)"
      - days_past_due: "DAYS(F('next_due_date'), NOW)"
      - delinquency_surcharge: "K('late_stage_deferral_surcharge_usd') if days_past_due >= 16 else (K('early_stage_deferral_surcharge_usd') if days_past_due >= 1 else 0)"
      - contract_age_months: "MONTHS(F('contract_date'), NOW)"
      - seasoning_credit: "K('long_seasoning_deferral_credit_usd') if contract_age_months >= 24 else (K('mid_seasoning_deferral_credit_usd') if contract_age_months >= 12 else 0)"
      - prior_deferrals: "COUNT('finance_transactions', event_type='finance_deferral_granted')"
      - first_extension_credit: "K('first_extension_credit_usd') if prior_deferrals == 0 else (K('second_extension_credit_usd') if prior_deferrals == 1 else 0)"
      - result: "RND(MX(0, deferral_charge_base * return_risk_multiplier + delinquency_surcharge - good_faith_credit - seasoning_credit - first_extension_credit), 2)"
    compute_basis:
      registration_state: "The deferral charge for the registration state follows the state where the financed vehicle is registered, as shown on the purchase order the contract finances"
      deferral_charge_base: "a vehicle registered in Florida or Texas is charged one month of interest on the deferred installment, that is the monthly payment times the contract APR divided by 100 and by 12, rounded to the cent; a vehicle registered in Georgia or North Carolina is charged the lesser of the tier's deferral fee and the Georgia and North Carolina installment share of the monthly payment, that share rounded to the cent; a vehicle registered in any other state is charged the tier's deferral fee."
      returns_12m: "A return-risk multiplier follows the returned payments on the contract dated fewer than 12 whole months before the request date"
      return_risk_multiplier: "two or more returned payments multiply the deferral charge by the repeat-return risk factor; exactly one multiplies it by the single-return risk factor; none leaves it as it is."
      installments_paid: "the installments paid on the contract, counted as its scheduled-installment payments less its returned payments"
      partial_payments_today: "the partial payments posted on the request date"
      good_faith_credit: "12 or more installments paid together with a partial payment posted on the request date take the seasoned good-faith deferral credit; fewer than 12 installments paid together with a partial payment posted on the request date take the new good-faith deferral credit; a borrower with no partial payment posted on the request date takes no credit."
      days_past_due: "the days the deferred installment is past due, counted in calendar days from the next due date to the request date"
      delinquency_surcharge: "16 or more days take the late-stage deferral surcharge; 1 to 15 days take the early-stage deferral surcharge; an installment not yet past due takes none."
      contract_age_months: "the age of the contract in whole months from the contract date to the request date"
      seasoning_credit: "at least 24 whole months take the long-seasoning deferral credit; 12 to 23 whole months take the mid-seasoning deferral credit; a younger contract takes none."
      prior_deferrals: "A first-extension credit follows the deferrals already granted on the contract, counted as its deferral entries"
      first_extension_credit: "a contract with no earlier deferral takes the first-extension deferral credit; a contract with exactly one earlier deferral takes the second-extension deferral credit; a contract with two or more earlier deferrals takes none."
      result: "the deferral charge for the registration state is multiplied by the return-risk multiplier; the delinquency surcharge is added; the good-faith credit, the seasoning credit and the first-extension credit are subtracted; and the result, never below zero, is rounded to the cent"
    factors:
      - id: deferral_state_charge_method
        effect: method
        decides: deferral_charge_base
        bindings: [registration_state, deferral_charge_base]
        ladder:
          - when: "the financed vehicle is registered in Florida or Texas"
            method: "the charge is one month of interest on the deferred installment: monthly payment times the contract APR divided by 100 and by 12, rounded to the cent"
          - when: "the financed vehicle is registered in Georgia or North Carolina"
            method: "the charge is the lesser of the tier's deferral fee and the Georgia and North Carolina installment share of the monthly payment, the share rounded to the cent"
          - when: "otherwise"
            method: "the charge is the tier's deferral fee"
        baseline:
          deferral_charge_base: "P('deferral_fee_usd')"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: deferral_return_risk
        effect: method
        decides: return_risk_multiplier
        bindings: [returns_12m, return_risk_multiplier]
        ladder:
          - when: "two or more returned payments in the prior 12 whole months"
            method: "the deferral charge is multiplied by the repeat-return risk factor"
          - when: "exactly one returned payment in the prior 12 whole months"
            method: "the deferral charge is multiplied by the single-return risk factor"
          - when: "otherwise"
            method: "the deferral charge is taken as it stands"
        baseline:
          return_risk_multiplier: "1"
        evidence: [history]
        cross_difficulty: null
      - id: deferral_good_faith_credit
        effect: parameter
        decides: good_faith_credit
        bindings: [installments_paid, partial_payments_today, good_faith_credit]
        ladder:
          - when: "12 or more installments paid and a partial payment posted on the request date"
            value: "K('seasoned_good_faith_credit_usd')"
          - when: "fewer than 12 installments paid and a partial payment posted on the request date"
            value: "K('new_good_faith_credit_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          good_faith_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: deferral_delinquency_surcharge
        effect: parameter
        decides: delinquency_surcharge
        bindings: [days_past_due, delinquency_surcharge]
        ladder:
          - when: "16 or more calendar days past due"
            value: "K('late_stage_deferral_surcharge_usd')"
          - when: "1 to 15 calendar days past due"
            value: "K('early_stage_deferral_surcharge_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          delinquency_surcharge: "0"
        evidence: [date]
        cross_difficulty: null
      - id: deferral_seasoning_credit
        effect: parameter
        decides: seasoning_credit
        bindings: [contract_age_months, seasoning_credit]
        ladder:
          - when: "contract at least 24 whole months old"
            value: "K('long_seasoning_deferral_credit_usd')"
          - when: "contract 12 to 23 whole months old"
            value: "K('mid_seasoning_deferral_credit_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          seasoning_credit: "0"
        evidence: [date]
        cross_difficulty: null
      - id: deferral_first_extension_credit
        effect: parameter
        decides: first_extension_credit
        bindings: [prior_deferrals, first_extension_credit]
        ladder:
          - when: "no earlier deferral entry on the contract"
            value: "K('first_extension_credit_usd')"
          - when: "exactly one earlier deferral entry on the contract"
            value: "K('second_extension_credit_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          first_extension_credit: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A deferral moves the installment at the next due date to the end of the contract; the next due date and the
        maturity date each move one month later and the deferrals used rise by one. The standard deferral fee is the
        tier's deferral fee, assessed as a deferral fee entry for the deferred installment when it is above zero.
      params: [deferral_fee_usd]
    inputs:
      history:
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, within_months: 12, filters: {event_type: finance_payment_returned}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, filters: {event_type: finance_payment_posted, payment_type: scheduled_installment}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, filters: {event_type: finance_payment_posted, payment_type: partial_payment}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, filters: {event_type: finance_deferral_granted}}
      cross_category: [purchase]

  - id: finance_ext_cure_payment
    base_policy_refs: [finance_payment_application]
    overwrite:
      - base_policy: finance_payment_application
        superseded_clause: >-
          A scheduled-installment payment advances the next due date by one month for each full monthly payment it
          contains, never beyond the maturity date;
        replaced_by: >-
          The payment is applied to the interest accrued since the last payment date, then to the fees due, then to
          principal, and it moves the next due date one month later for each installment it brings current, never
          beyond the maturity date.
    trigger: on_request
    subject: [finance_payment_posted]
    computes: total_received
    target_tool: pay_past_due_installment_fb9b9167
    params:
      short_tenure_catch_up_days: 10
      long_tenure_catch_up_days: 5
      entry_program_catch_up_days: 4
      certified_program_catch_up_days: 2
      mature_contract_catch_up_factor: 0.5
      young_contract_catch_up_factor: 0.75
      repeat_lateness_cure_deposit_usd: 25.00
      second_lateness_cure_deposit_usd: 10.00
    rule: >-
      A cure payment is the one-time scheduled-installment payment a borrower makes from their own bank account to
      bring the installments of a contract that are past their grace period up to date. The standard cure payment
      is the monthly payment for each installment it brings current plus the fees due on the contract, rounded to
      the cent. The installments a cure payment brings current are counted from the days the oldest unpaid
      installment is past due, in calendar days from the next due date to the payment date: when those days exceed
      the tier's grace days, the payment brings current one installment plus one more for each full 30 days in the
      days past due beyond the grace days and the day after them; otherwise it brings none current. The payment is
      applied to the interest accrued since the last payment date, then to the fees due, then to principal, and it moves the next due date one month later for each installment it brings current, never beyond the maturity date. A cure payment also carries
      a catch-up amount, applied to principal, equal to one day's interest on the principal balance at the
      contract APR over the tier's day-count basis multiplied by the catch-up days and rounded to the cent. The
      catch-up days start from the delinquency and the tenure of the contract, where the installments paid are its
      scheduled-installment payments less its returned payments: 30 or more days past due with fewer than 24
      installments paid take the short-tenure catch-up days; 30 or more days past due with 24 or more installments
      paid take the long-tenure catch-up days; fewer than 30 days past due take no catch-up days. The catch-up days
      are raised by the vehicle program on the purchase order the contract finances: a vehicle sold under Kestrel
      Value Line or Kestrel Inspected adds the entry-program catch-up days; a vehicle sold under Kestrel Certified
      or Kestrel Certified Plus adds the certified-program catch-up days; a vehicle sold under any higher program
      adds none. The catch-up days are then scaled by the age of the contract in whole months from the contract date
      to the payment date: a contract at least 24 whole months old multiplies them by the mature-contract catch-up
      factor; a contract 12 to 23 whole months old multiplies them by the young-contract catch-up factor; a younger
      contract keeps them as they are. A cure deposit, applied to principal, follows the late fees assessed on the
      contract when fewer than 12 whole months separate their assessment date from the payment date: three or more
      such late fees take the repeat-lateness cure deposit; exactly two take the second-lateness cure deposit; one
      or none take no deposit. The cure payment is worked out in this order: the catch-up days from delinquency and
      tenure plus the program days are multiplied by the contract-age factor; the catch-up amount is computed from
      those days; and the cure payment is the monthly payment times the installments brought current, plus the
      fees due, plus the catch-up amount, plus the cure deposit, rounded to the cent.
    prerequisite: []
    cross_category:
      - category: purchase
        as: branch
        reads: [variant_name]
        note: The vehicle program on the financed purchase order decides the program catch-up days.
    compute:
      - days_past_due: "DAYS(F('next_due_date'), NOW)"
      - installments_brought_current: "1 + int((days_past_due - P('payment_grace_days') - 1) / 30) if days_past_due > P('payment_grace_days') else 0"
      - fees_outstanding: "F('fees_due')"
      - installments_paid: "COUNT('finance_transactions', event_type='finance_payment_posted', payment_type='scheduled_installment') - COUNT('finance_transactions', event_type='finance_payment_returned')"
      - tenure_catch_up_days: "K('short_tenure_catch_up_days') if (days_past_due >= 30 and installments_paid < 24) else (K('long_tenure_catch_up_days') if (days_past_due >= 30 and installments_paid >= 24) else 0)"
      - vehicle_program: "CFIELD('purchase', 'variant_name', purchase_order_id=F('purchase_order_id'))"
      - program_catch_up_days: "K('entry_program_catch_up_days') if (vehicle_program == 'Kestrel Value Line' or vehicle_program == 'Kestrel Inspected') else (K('certified_program_catch_up_days') if (vehicle_program == 'Kestrel Certified' or vehicle_program == 'Kestrel Certified Plus') else 0)"
      - contract_age_months: "MONTHS(F('contract_date'), NOW)"
      - contract_age_factor: "K('mature_contract_catch_up_factor') if contract_age_months >= 24 else (K('young_contract_catch_up_factor') if contract_age_months >= 12 else 1)"
      - late_fees_12m: "COUNT('finance_transactions', within_months=12, date_field='txn_date', event_type='finance_fee_assessed', fee_type='late_fee')"
      - cure_deposit: "K('repeat_lateness_cure_deposit_usd') if late_fees_12m >= 3 else (K('second_lateness_cure_deposit_usd') if late_fees_12m == 2 else 0)"
      - catch_up_days: "(tenure_catch_up_days + program_catch_up_days) * contract_age_factor"
      - catch_up_amount: "RND(F('principal_balance') * F('apr') / 100 / P('interest_day_count_basis') * catch_up_days, 2)"
      - result: "RND(installments_brought_current * F('monthly_payment') + fees_outstanding + catch_up_amount + cure_deposit, 2)"
    compute_basis:
      days_past_due: "counted from the days the oldest unpaid installment is past due, in calendar days from the next due date to the payment date"
      installments_brought_current: "when those days exceed the tier's grace days, the payment brings current one installment plus one more for each full 30 days in the days past due beyond the grace days and the day after them; otherwise it brings none current."
      fees_outstanding: "plus the fees due on the contract"
      installments_paid: "where the installments paid are its scheduled-installment payments less its returned payments"
      tenure_catch_up_days: "30 or more days past due with fewer than 24 installments paid take the short-tenure catch-up days; 30 or more days past due with 24 or more installments paid take the long-tenure catch-up days; fewer than 30 days past due take no catch-up days."
      vehicle_program: "The catch-up days are raised by the vehicle program on the purchase order the contract finances"
      program_catch_up_days: "a vehicle sold under Kestrel Value Line or Kestrel Inspected adds the entry-program catch-up days; a vehicle sold under Kestrel Certified or Kestrel Certified Plus adds the certified-program catch-up days; a vehicle sold under any higher program adds none."
      contract_age_months: "the age of the contract in whole months from the contract date to the payment date"
      contract_age_factor: "a contract at least 24 whole months old multiplies them by the mature-contract catch-up factor; a contract 12 to 23 whole months old multiplies them by the young-contract catch-up factor; a younger contract keeps them as they are."
      late_fees_12m: "the late fees assessed on the contract when fewer than 12 whole months separate their assessment date from the payment date"
      cure_deposit: "three or more such late fees take the repeat-lateness cure deposit; exactly two take the second-lateness cure deposit; one or none take no deposit."
      catch_up_days: "the catch-up days from delinquency and tenure plus the program days are multiplied by the contract-age factor"
      catch_up_amount: "equal to one day's interest on the principal balance at the contract APR over the tier's day-count basis multiplied by the catch-up days and rounded to the cent."
      result: "the cure payment is the monthly payment times the installments brought current, plus the fees due, plus the catch-up amount, plus the cure deposit, rounded to the cent."
    factors:
      - id: cure_tenure_catch_up
        effect: parameter
        decides: tenure_catch_up_days
        bindings: [installments_paid, tenure_catch_up_days]
        ladder:
          - when: "30 or more days past due and fewer than 24 installments paid"
            value: "K('short_tenure_catch_up_days')"
          - when: "30 or more days past due and 24 or more installments paid"
            value: "K('long_tenure_catch_up_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_catch_up_days: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: cure_program_catch_up
        effect: parameter
        decides: program_catch_up_days
        bindings: [vehicle_program, program_catch_up_days]
        ladder:
          - when: "vehicle sold under Kestrel Value Line or Kestrel Inspected"
            value: "K('entry_program_catch_up_days')"
          - when: "vehicle sold under Kestrel Certified or Kestrel Certified Plus"
            value: "K('certified_program_catch_up_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          program_catch_up_days: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: cure_contract_age_scaling
        effect: method
        decides: contract_age_factor
        bindings: [contract_age_months, contract_age_factor]
        ladder:
          - when: "contract at least 24 whole months old"
            method: "the catch-up days are multiplied by the mature-contract catch-up factor"
          - when: "contract 12 to 23 whole months old"
            method: "the catch-up days are multiplied by the young-contract catch-up factor"
          - when: "otherwise"
            method: "the catch-up days are kept as they are"
        baseline:
          contract_age_factor: "1"
        evidence: [date]
        cross_difficulty: null
      - id: cure_lateness_deposit
        effect: parameter
        decides: cure_deposit
        bindings: [late_fees_12m, cure_deposit]
        ladder:
          - when: "three or more late fees assessed in the prior 12 whole months"
            value: "K('repeat_lateness_cure_deposit_usd')"
          - when: "exactly two late fees assessed in the prior 12 whole months"
            value: "K('second_lateness_cure_deposit_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          cure_deposit: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A cure payment is the one-time scheduled-installment payment a borrower makes from their own bank account to
        bring the installments of a contract that are past their grace period up to date. The standard cure payment
        is the monthly payment for each installment it brings current plus the fees due on the contract, rounded to
        the cent. The installments a cure payment brings current are counted from the days the oldest unpaid
        installment is past due, in calendar days from the next due date to the payment date: when those days exceed
        the tier's grace days, the payment brings current one installment plus one more for each full 30 days in the
        days past due beyond the grace days and the day after them; otherwise it brings none current. The payment is
        applied to the interest accrued since the last payment date, then to the fees due, then to principal, and it moves the next due date one month later for each installment it brings current, never beyond the maturity date.
      params: [payment_grace_days]
    inputs:
      history:
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, filters: {event_type: finance_payment_posted, payment_type: scheduled_installment}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, within_months: 12, filters: {event_type: finance_fee_assessed, fee_type: late_fee}}
      cross_category: [purchase]

  - id: finance_ext_goodwill_late_fee_credit
    base_policy_refs: [finance_principal_credits, finance_late_fees]
    overwrite:
      - base_policy: finance_late_fees
        superseded_clause: >-
          A late fee may be waived as goodwill only while waivers counted by finance_msr_late_fee_waivers_12m are below
          the tier's late fee waivers per 12 months;
        replaced_by: >-
          Goodwill relief is given only while the goodwill reliefs on the contract dated fewer than 12 whole months
          before the request date, counting every waived late fee and every billing-correction principal credit on the contract as a goodwill relief, are below the
          tier's late fee waivers per 12 months.
    trigger: on_request
    subject: [finance_principal_credited]
    computes: credit_amount
    target_tool: credit_goodwill_late_fee_132adaff
    params:
      returned_history_goodwill_share: 0.25
      late_history_goodwill_share: 0.5
      slow_cure_goodwill_factor: 0.5
      steady_cure_goodwill_factor: 0.8
      two_relief_goodwill_reduction_usd: 3.00
      one_relief_goodwill_reduction_usd: 1.50
      two_protection_goodwill_bonus_usd: 2.00
      one_protection_goodwill_bonus_usd: 1.00
      long_tenure_goodwill_bonus_usd: 1.50
      mid_tenure_goodwill_bonus_usd: 0.75
      three_vehicle_goodwill_bonus_usd: 1.00
      two_vehicle_goodwill_bonus_usd: 0.50
    rule: >-
      Goodwill relief on a late fee is posted as a principal credit recorded as a billing
      correction that names the late-fee entry, and it does not count as a payment toward any due date. Goodwill
      relief is given only while the goodwill reliefs on the contract dated fewer than 12 whole months before the
      request date, counting every waived late fee and every billing-correction principal credit on the contract as a goodwill relief, are below the tier's late fee
      waivers per 12 months. The standard goodwill credit is the full amount of the most recent late fee charged on
      the contract, rounded to the cent. Goodwill relief on a late fee is not fixed until a scheduled-installment
      payment has posted on the contract for the installment that late fee was charged on. The goodwill share of the
      late fee follows the borrower's record over the 12 whole months before the request date, counting the late
      fees assessed and the payments returned in that window: two or more late fees together with at least one
      returned payment take the returned-history goodwill share; two or more late fees with no returned payment
      take the late-history goodwill share; fewer than two late fees take the full late fee. A cure-speed factor
      follows the calendar days from the assessment date of the late fee to the posting date of the most recent
      scheduled-installment payment: more than 30 days take the slow-cure goodwill factor; 15 to 30 days take the
      steady-cure goodwill factor; fewer than 15 days leave the share as it is. A prior-relief reduction follows the
      goodwill reliefs on the contract dated fewer than 24 whole months before the request date, counting every waived late fee and every billing-correction principal credit on the contract as a goodwill relief: two or more take the two-relief goodwill reduction; exactly one
      takes the one-relief goodwill reduction; none takes no reduction. A protection bonus follows the borrower's
      protection products on this contract: an active KestrelCare service contract financed in this contract
      together with an active Kestrel GAP waiver on it takes the two-protection goodwill bonus; an active KestrelCare
      service contract financed in this contract without an active Kestrel GAP waiver takes the one-protection
      goodwill bonus; any other borrower takes no bonus. A tenure bonus follows the installments paid on the
      contract, counted as its scheduled-installment payments less its returned payments: 36 or more take the
      long-tenure goodwill bonus; 24 to 35 take the mid-tenure goodwill bonus; fewer than 24 take no bonus. A
      repeat-buyer bonus follows the vehicles the borrower has bought from Kestrel, counted as the vehicle-price
      charges on the borrower's purchase orders: three or more vehicles take the three-vehicle goodwill bonus;
      exactly two take the two-vehicle goodwill bonus; one takes no bonus. The goodwill credit is worked out in this
      order: the late fee is multiplied by the goodwill share and then by the cure-speed factor; the prior-relief
      reduction is subtracted and the protection, tenure and repeat-buyer bonuses are added; and the result, never
      below zero and never above the late fee, is rounded to the cent.
    prerequisite:
      - problem: finance_ext_cure_payment
        kind: value_input
        gate: cure_days
        form: state
        policy_source: >-
          Goodwill relief on a late fee is not fixed until a scheduled-installment payment has posted on the contract
          for the installment that late fee was charged on.
        condition: >-
          The loan history carries a scheduled-installment payment entry whose installment due date is the
          installment the most recent late-fee entry names, and the contract's next due date has moved past that
          installment.
        resolved_by: pay_past_due_installment_fb9b9167
        effect: >-
          The payment for the late installment becomes the most recent scheduled-installment payment, so the
          cure_days input becomes the calendar days from the late-fee assessment to that payment and the cure-speed
          factor moves off its fall-through value.
    cross_category:
      - category: warranty
        as: existence
        reads: [status, finance_contract_id]
        note: An active KestrelCare service contract financed in this contract decides the protection bonus tier.
      - category: gap
        as: existence
        reads: [status, finance_contract_id]
        note: An active Kestrel GAP waiver on this contract decides between the two-protection and one-protection bonus.
      - category: purchase
        as: history
        reads: [purchase_transactions.charge_type]
        note: The vehicle-price charges on the borrower's purchase orders count the vehicles bought and decide the repeat-buyer bonus.
    compute:
      - late_fee_charged: "LATEST('finance_transactions', 'amount', date_field='txn_date', event_type='finance_fee_assessed', fee_type='late_fee')"
      - late_fee_date: "LATEST('finance_transactions', 'txn_date', date_field='txn_date', event_type='finance_fee_assessed', fee_type='late_fee')"
      - late_fees_12m: "COUNT('finance_transactions', within_months=12, date_field='txn_date', event_type='finance_fee_assessed', fee_type='late_fee')"
      - returns_12m: "COUNT('finance_transactions', within_months=12, date_field='txn_date', event_type='finance_payment_returned')"
      - goodwill_share: "K('returned_history_goodwill_share') if (late_fees_12m >= 2 and returns_12m >= 1) else (K('late_history_goodwill_share') if (late_fees_12m >= 2 and returns_12m == 0) else 1)"
      - cure_payment_date: "LATEST('finance_transactions', 'txn_date', date_field='txn_date', event_type='finance_payment_posted', payment_type='scheduled_installment')"
      - cure_days: "DAYS(late_fee_date, cure_payment_date)"
      - cure_speed_factor: "K('slow_cure_goodwill_factor') if cure_days > 30 else (K('steady_cure_goodwill_factor') if cure_days >= 15 else 1)"
      - prior_reliefs_24m: "COUNT('finance_transactions', within_months=24, date_field='txn_date', event_type='finance_fee_cleared', fee_type='late_fee', clearance_type='waived') + COUNT('finance_transactions', within_months=24, date_field='txn_date', event_type='finance_principal_credited', credit_source='billing_correction')"
      - prior_relief_reduction: "K('two_relief_goodwill_reduction_usd') if prior_reliefs_24m >= 2 else (K('one_relief_goodwill_reduction_usd') if prior_reliefs_24m == 1 else 0)"
      - service_contract_active: "EXISTS('warranty', finance_contract_id=HID, status='active')"
      - gap_waiver_active: "EXISTS('gap', finance_contract_id=HID, status='active')"
      - protection_bonus: "K('two_protection_goodwill_bonus_usd') if (service_contract_active and gap_waiver_active) else (K('one_protection_goodwill_bonus_usd') if (service_contract_active and not gap_waiver_active) else 0)"
      - installments_paid: "COUNT('finance_transactions', event_type='finance_payment_posted', payment_type='scheduled_installment') - COUNT('finance_transactions', event_type='finance_payment_returned')"
      - tenure_bonus: "K('long_tenure_goodwill_bonus_usd') if installments_paid >= 36 else (K('mid_tenure_goodwill_bonus_usd') if installments_paid >= 24 else 0)"
      - vehicles_bought: "XCOUNT('purchase', 'purchase_transactions', event_type='purchase_charge_posted', charge_type='vehicle_price')"
      - repeat_buyer_bonus: "K('three_vehicle_goodwill_bonus_usd') if vehicles_bought >= 3 else (K('two_vehicle_goodwill_bonus_usd') if vehicles_bought == 2 else 0)"
      - result: "RND(MN(late_fee_charged, MX(0, late_fee_charged * goodwill_share * cure_speed_factor - prior_relief_reduction + protection_bonus + tenure_bonus + repeat_buyer_bonus)), 2)"
    compute_basis:
      late_fee_charged: "the full amount of the most recent late fee charged on the contract, rounded to the cent."
      late_fee_date: "the calendar days from the assessment date of the late fee"
      late_fees_12m: "counting the late fees assessed and the payments returned in that window"
      returns_12m: "counting the late fees assessed and the payments returned in that window"
      goodwill_share: "two or more late fees together with at least one returned payment take the returned-history goodwill share; two or more late fees with no returned payment take the late-history goodwill share; fewer than two late fees take the full late fee."
      cure_payment_date: "to the posting date of the most recent scheduled-installment payment"
      cure_days: "A cure-speed factor follows the calendar days from the assessment date of the late fee to the posting date of the most recent scheduled-installment payment"
      cure_speed_factor: "more than 30 days take the slow-cure goodwill factor; 15 to 30 days take the steady-cure goodwill factor; fewer than 15 days leave the share as it is."
      prior_reliefs_24m: "the goodwill reliefs on the contract dated fewer than 24 whole months before the request date, counting every waived late fee and every billing-correction principal credit on the contract as a goodwill relief"
      prior_relief_reduction: "two or more take the two-relief goodwill reduction; exactly one takes the one-relief goodwill reduction; none takes no reduction."
      service_contract_active: "an active KestrelCare service contract financed in this contract"
      gap_waiver_active: "an active Kestrel GAP waiver on it"
      protection_bonus: "an active KestrelCare service contract financed in this contract together with an active Kestrel GAP waiver on it takes the two-protection goodwill bonus; an active KestrelCare service contract financed in this contract without an active Kestrel GAP waiver takes the one-protection goodwill bonus; any other borrower takes no bonus."
      installments_paid: "the installments paid on the contract, counted as its scheduled-installment payments less its returned payments"
      tenure_bonus: "36 or more take the long-tenure goodwill bonus; 24 to 35 take the mid-tenure goodwill bonus; fewer than 24 take no bonus."
      vehicles_bought: "the vehicles the borrower has bought from Kestrel, counted as the vehicle-price charges on the borrower's purchase orders"
      repeat_buyer_bonus: "three or more vehicles take the three-vehicle goodwill bonus; exactly two take the two-vehicle goodwill bonus; one takes no bonus."
      result: "the late fee is multiplied by the goodwill share and then by the cure-speed factor; the prior-relief reduction is subtracted and the protection, tenure and repeat-buyer bonuses are added; and the result, never below zero and never above the late fee, is rounded to the cent."
    factors:
      - id: goodwill_record_share
        effect: parameter
        decides: goodwill_share
        bindings: [late_fees_12m, returns_12m, goodwill_share]
        ladder:
          - when: "two or more late fees and at least one returned payment in the prior 12 whole months"
            value: "K('returned_history_goodwill_share')"
          - when: "two or more late fees and no returned payment in the prior 12 whole months"
            value: "K('late_history_goodwill_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          goodwill_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: goodwill_cure_speed
        effect: method
        decides: cure_speed_factor
        bindings: [late_fee_date, cure_payment_date, cure_days, cure_speed_factor]
        ladder:
          - when: "more than 30 calendar days from the late fee to the most recent scheduled-installment payment"
            method: "the shared late fee is multiplied by the slow-cure goodwill factor"
          - when: "15 to 30 calendar days from the late fee to the most recent scheduled-installment payment"
            method: "the shared late fee is multiplied by the steady-cure goodwill factor"
          - when: "otherwise"
            method: "the shared late fee is kept as it is"
        baseline:
          cure_speed_factor: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: goodwill_prior_relief_reduction
        effect: parameter
        decides: prior_relief_reduction
        bindings: [prior_reliefs_24m, prior_relief_reduction]
        ladder:
          - when: "two or more goodwill reliefs in the prior 24 whole months"
            value: "K('two_relief_goodwill_reduction_usd')"
          - when: "exactly one goodwill relief in the prior 24 whole months"
            value: "K('one_relief_goodwill_reduction_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          prior_relief_reduction: "0"
        evidence: [history]
        cross_difficulty: null
      - id: goodwill_protection_bonus
        effect: parameter
        decides: protection_bonus
        bindings: [service_contract_active, gap_waiver_active, protection_bonus]
        ladder:
          - when: "an active KestrelCare service contract financed in this contract and an active Kestrel GAP waiver on it"
            value: "K('two_protection_goodwill_bonus_usd')"
          - when: "an active KestrelCare service contract financed in this contract and no active Kestrel GAP waiver"
            value: "K('one_protection_goodwill_bonus_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          protection_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: warranty
      - id: goodwill_tenure_bonus
        effect: parameter
        decides: tenure_bonus
        bindings: [installments_paid, tenure_bonus]
        ladder:
          - when: "36 or more installments paid"
            value: "K('long_tenure_goodwill_bonus_usd')"
          - when: "24 to 35 installments paid"
            value: "K('mid_tenure_goodwill_bonus_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_bonus: "0"
        evidence: [history]
        cross_difficulty: null
      - id: goodwill_repeat_buyer_bonus
        effect: parameter
        decides: repeat_buyer_bonus
        bindings: [vehicles_bought, repeat_buyer_bonus]
        ladder:
          - when: "three or more vehicles bought from Kestrel"
            value: "K('three_vehicle_goodwill_bonus_usd')"
          - when: "exactly two vehicles bought from Kestrel"
            value: "K('two_vehicle_goodwill_bonus_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          repeat_buyer_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
    baseline:
      rule: >-
        Goodwill relief on a late fee is posted as a principal credit recorded as a billing
        correction that names the late-fee entry, and it does not count as a payment toward any due date. Goodwill
        relief is given only while the goodwill reliefs on the contract dated fewer than 12 whole months before the
        request date, counting every waived late fee and every billing-correction principal credit on the contract as a goodwill relief, are below the tier's late fee
        waivers per 12 months. The standard goodwill credit is the full amount of the most recent late fee charged on
        the contract, rounded to the cent.
      params: [late_fee_waivers_per_12_months]
    inputs:
      history:
        - {table: finance_transactions, aggregate: latest, field: amount, filters: {event_type: finance_fee_assessed, fee_type: late_fee}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, within_months: 12, filters: {event_type: finance_fee_assessed, fee_type: late_fee}}
        - {table: finance_transactions, aggregate: count, field: finance_txn_id, within_months: 24, filters: {event_type: finance_fee_cleared, fee_type: late_fee, clearance_type: waived}}
        - {table: finance_transactions, aggregate: latest, field: txn_date, filters: {event_type: finance_payment_posted, payment_type: scheduled_installment}}
        - {category: purchase, table: purchase_transactions, aggregate: count, field: purchase_txn_id, filters: {event_type: purchase_charge_posted, charge_type: vehicle_price}}
      cross_category: [warranty, gap, purchase]
