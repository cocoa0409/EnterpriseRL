events:
  # ---- holding writes -------------------------------------------------------------
  - type: purchase_order_reserved
    target: purchase_orders
    mutation: create
    meaning: "A buyer reserves a listed vehicle online; the order opens in reserved with the hold expiration date set."
    grain: "one row per reservation of one vehicle by one buyer"
    fields:
      customer_id: "buyer reserving the vehicle"
      variant_name: "vehicle program of the listed vehicle"
      vin: "VIN of the reserved vehicle"
      vehicle_description: "listed year, make, model and trim"
      model_year: "model year of the vehicle"
      listing_odometer: "odometer disclosed on the listing"
      vehicle_price: "listed no-haggle price"
      payment_method: "payment method chosen at reservation"
      selling_dealer_state: "state of the hub that holds the vehicle"
      registration_state: "state of the buyer's residential address"
      transfer_distance_miles: "transport distance to the buyer's market"
      reserved_date: "date of the reservation"
      hold_expires_date: "reserved_date plus the program's reservation hold days"
      exchange_source_order_id: "returned order this reservation replaces in an exchange; empty otherwise"
    triggers:
      - event: purchase:purchase_deposit_paid
        when: {exchange_source_order_id: ""}
        map: {}
  - type: purchase_hold_extended
    target: purchase_orders
    mutation: update
    meaning: "The reservation hold is extended by one extension period."
    grain: "one row per extension granted"
    fields:
      hold_expires_date: "previous hold expiration date plus the program's hold extension days"
      hold_extensions_used: "extensions granted, incremented by one"
    triggers: []
  - type: purchase_insurance_verified
    target: purchase_orders
    mutation: update
    meaning: "Proof of insurance meeting the order's requirements is received and verified."
    grain: "one row per verification"
    fields:
      insurance_verified: "set to true"
    triggers: []
  - type: purchase_agreement_signed
    target: purchase_orders
    mutation: {transition: {from: reserved, to: contracted}}
    meaning: "The buyer e-signs the purchase agreement; agreement charges post and the held deposit is applied."
    grain: "one row per signed agreement"
    fields:
      status: "reserved -> contracted"
      contract_signed_date: "date of e-signature"
      payment_method: "payment method fixed on the signed agreement"
    triggers:
      - event: purchase:purchase_charge_posted
        map: {charge_type: vehicle_price}
      - event: purchase:purchase_deposit_applied
        map: {}
      - event: title:title_order_opened
        map: {}
      - event: finance:finance_contract_signed
        when: {payment_method: kestrel_financing}
        map: {}
  - type: purchase_reservation_expired
    target: purchase_orders
    mutation: {transition: {from: reserved, to: expired}}
    meaning: "The hold lapses unsigned and the vehicle returns to inventory."
    grain: "one row per lapsed reservation"
    fields:
      status: "reserved -> expired"
      closed_date: "the day after the hold expiration date"
      closure_reason: "reservation_lapsed"
    triggers:
      - event: purchase:purchase_deposit_refunded
        map: {reason_code: reservation_lapsed}
  - type: purchase_order_cancelled
    target: purchase_orders
    mutation: {transition: [{from: reserved, to: cancelled}, {from: contracted, to: cancelled}]}
    meaning: "The order is cancelled before handover."
    grain: "one row per cancellation"
    fields:
      status: "reserved or contracted -> cancelled"
      closed_date: "date of cancellation"
      closure_reason: "customer_cancelled, vehicle_unavailable or financing_not_completed"
      payment_method: "payment method on the order (read to route the finance consequence; not changed)"
    triggers:
      - event: purchase:purchase_deposit_refunded
        map: {reason_code: closure_reason}
      - event: purchase:purchase_charge_reversed
        map: {reason_code: closure_reason}
      - event: purchase:purchase_refund_issued
        map: {refund_type: cancellation_refund, reason_code: closure_reason}
      - event: title:title_order_cancelled
        map: {}
      - event: delivery:delivery_cancelled
        map: {}
      - event: tradein:tradein_agreement_cancelled
        map: {}
      - event: finance:finance_application_withdrawn
        when: {payment_method: kestrel_financing}
        map: {}
      - event: finance:finance_contract_unwound
        when: {payment_method: kestrel_financing}
        map: {}
  - type: purchase_vehicle_handed_over
    target: purchase_orders
    mutation: {transition: {from: contracted, to: delivered}}
    meaning: "The buyer takes possession of the vehicle; the handover checklist records date and odometer."
    grain: "one row per handover"
    fields:
      status: "contracted -> delivered"
      handover_date: "date of the completed delivery or pickup"
      handover_odometer: "odometer on the handover checklist"
    triggers:
      - event: title:title_temp_tag_issued
        map: {tag_sequence: 1}
      - event: warranty:warranty_coverage_activated
        map: {}
  - type: purchase_return_initiated
    target: purchase_orders
    mutation: {transition: {from: delivered, to: return_pending}}
    meaning: "The buyer e-signs the 7-day return authorization for a return or exchange."
    grain: "one row per return authorization"
    fields:
      status: "delivered -> return_pending"
    triggers: []
  - type: purchase_return_withdrawn
    target: purchase_orders
    mutation: {transition: {from: return_pending, to: delivered}}
    meaning: "The buyer withdraws a pending return before handing the vehicle back."
    grain: "one row per withdrawal"
    fields:
      status: "return_pending -> delivered"
    triggers: []
  - type: purchase_return_completed
    target: purchase_orders
    mutation: {transition: {from: return_pending, to: returned}}
    meaning: "The vehicle is received back and inspected; the order is unwound."
    grain: "one row per completed return"
    fields:
      status: "return_pending -> returned"
      return_odometer: "odometer recorded at the return inspection"
      closed_date: "date the vehicle was received back"
      closure_reason: "returned_for_refund or returned_for_exchange"
      payment_method: "payment method on the order (read to route the finance consequence; not changed)"
    triggers:
      - event: purchase:purchase_charge_reversed
        map: {reason_code: vehicle_returned}
      - event: purchase:purchase_charge_posted
        map: {}
      - event: purchase:purchase_refund_issued
        map: {refund_type: return_refund, reason_code: vehicle_returned}
      - event: finance:finance_contract_unwound
        when: {payment_method: kestrel_financing}
        map: {}
      - event: title:title_order_cancelled
        map: {}
      - event: warranty:warranty_contract_cancelled
        map: {}
      - event: maintenance:maintenance_plan_cancelled
        map: {}
  - type: purchase_sale_finalized
    target: purchase_orders
    mutation: {transition: {from: delivered, to: completed}}
    meaning: "The 7-day return window closes with no return pending; the sale is final."
    grain: "one row per finalized order"
    fields:
      status: "delivered -> completed"
      closed_date: "the day after the last day of the return window"
      closure_reason: "sale_final"
    triggers: []

  # ---- order ledger ---------------------------------------------------------------
  - type: purchase_deposit_paid
    target: purchase_transactions
    meaning: "The reservation deposit is received."
    grain: "one row per deposit payment on an order"
    distinguish_by: [txn_date, amount, payment_channel]
    fields:
      txn_date: "date the deposit was received"
      amount: "deposit amount received"
      payment_channel: "debit_card, credit_card or ach"
    account: deposit_held
    direction: in
    triggers: []
  - type: purchase_deposit_applied
    target: purchase_transactions
    meaning: "Held deposit money is applied to what the buyer owes on the order."
    grain: "one row per application of one deposit"
    distinguish_by: [source_txn_id, txn_date]
    fields:
      txn_date: "date of application"
      amount: "deposit amount applied"
      source_txn_id: "the deposit entry being applied"
    account: deposit_held
    direction: out
    triggers:
      - event: purchase:purchase_payment_posted
        map: {payment_source: deposit_application, payment_channel: internal_transfer, amount: amount, txn_date: txn_date, source_txn_id: source_txn_id}
  - type: purchase_deposit_refunded
    target: purchase_transactions
    meaning: "Held deposit money is returned to the buyer's original card or account."
    grain: "one row per refund of one deposit"
    distinguish_by: [source_txn_id, txn_date]
    fields:
      txn_date: "date the refund was issued"
      amount: "deposit amount refunded"
      payment_channel: "channel of the original deposit"
      reason_code: "reservation_lapsed, customer_cancelled, vehicle_unavailable or financing_not_completed"
      source_txn_id: "the deposit entry being refunded"
    account: deposit_held
    direction: out
    triggers: []
  - type: purchase_charge_posted
    target: purchase_transactions
    meaning: "A charge is added to what the buyer owes (agreement charges at signing, return charges at return inspection)."
    grain: "one row per charge type per order per posting date"
    distinguish_by: [charge_type, txn_date]
    fields:
      txn_date: "posting date"
      amount: "charge amount"
      charge_type: "which charge"
      linked_reference_id: "the return request for return charges; empty for agreement charges"
    account: order_balance
    direction: in
    triggers: []
  - type: purchase_charge_reversed
    target: purchase_transactions
    meaning: "A posted charge is reversed in full."
    grain: "one row per reversed charge"
    distinguish_by: [source_txn_id]
    fields:
      txn_date: "date of reversal"
      amount: "amount of the original charge"
      charge_type: "charge type of the original charge"
      reason_code: "customer_cancelled, vehicle_unavailable, financing_not_completed, vehicle_returned, fee_waived or billing_correction"
      source_txn_id: "the charge entry being reversed"
    account: order_balance
    direction: out
    triggers: []
  - type: purchase_payment_posted
    target: purchase_transactions
    meaning: "Money is received toward the order from the buyer, a lender, the held deposit or trade equity."
    grain: "one row per payment received"
    distinguish_by: [payment_source, payment_channel, txn_date, amount, source_txn_id, linked_reference_id]
    fields:
      txn_date: "date the funds were received"
      amount: "amount received"
      payment_source: "down_payment, deposit_application, kestrel_finance_proceeds, outside_lender_proceeds or trade_equity_credit"
      payment_channel: "rail the funds arrived on"
      source_txn_id: "deposit entry for a deposit application; empty otherwise"
      linked_reference_id: "finance contract for finance proceeds, trade-in agreement for trade equity; empty otherwise"
    account: order_balance
    direction: out
    triggers: []
  - type: purchase_refund_issued
    target: purchase_transactions
    meaning: "Money the buyer paid is sent back to them."
    grain: "one row per refund of one payment"
    distinguish_by: [source_txn_id, refund_type]
    fields:
      txn_date: "date the refund was released"
      amount: "amount refunded"
      refund_type: "cancellation_refund, return_refund, overpayment_refund, lender_proceeds_return or exchange_transfer"
      payment_channel: "channel of the original payment, or ach for trade equity refunded as cash"
      reason_code: "business reason for the refund"
      source_txn_id: "the payment entry being refunded"
      linked_reference_id: "the return request for return refunds; empty otherwise"
    account: order_balance
    direction: in
    triggers: []
  - type: purchase_limited_warranty_claim_decided
    target: purchase_limited_warranty_claims
    meaning: "A repair facility's request under the included limited warranty is approved or denied."
    grain: "one row per repair order decided"
    distinguish_by: [repair_order_number]
    fields:
      repair_order_number: "facility repair order number"
      failure_date: "date the failure was reported to the facility"
      decision_date: "date of the decision"
      odometer_at_failure: "odometer on the repair order"
      component_system: "system of the failed part"
      claim_decision: "approved or a denial code"
      repair_estimate: "estimate at the capped labor rate"
      covered_amount: "amount Kestrel pays"
      deductible_amount: "deductible the buyer pays"
      rental_days: "rental days approved"
      rental_amount: "rental reimbursement approved"
      towing_amount: "towing reimbursement approved"
    triggers: []

measures:
  - id: purchase_msr_open_pre_handover_orders
    window: "current portfolio at the moment of the request"
    measure: "count of the customer's purchase orders whose status is reserved or contracted"
  - id: purchase_msr_card_money_on_order
    window: "life of the order up to the moment of the request"
    measure: "sum of amount over purchase_deposit_paid and purchase_payment_posted entries of the order whose payment_channel is debit_card or credit_card, less refunds of such entries"
  - id: purchase_msr_limited_warranty_paid
    window: "life of the order up to the moment of the request"
    measure: "sum of covered_amount over purchase_limited_warranty_claim_decided entries of the order whose claim_decision is approved"
  - id: purchase_msr_returns_in_chain
    window: "life of the exchange chain (the order, the order named in its exchange_source_order_id, and so on back to the original order)"
    measure: "count of orders in the chain whose status is returned"

policies:
  - id: purchase_agg_multi_holding
    subject: [purchase_order_reserved]
    rule: >-
      A customer may hold any number of purchase orders over time, one order per vehicle; there is no
      lifetime cap on orders. How many orders may be open before handover at the same time is governed
      by purchase_agg_open_orders.
    eligibility: []
    params:
      max_per_customer: null

  - id: purchase_agg_open_orders
    subject: [purchase_order_reserved]
    rule: >-
      Open pre-handover orders are counted across the customer's whole portfolio using
      purchase_msr_open_pre_handover_orders, which counts orders in reserved or contracted only; orders in
      return_pending, delivered, completed or any closed state do not count. A new reservation is accepted
      only when the count is below the cap. An exchange replacement reservation is counted like any other
      reservation, but the order being returned does not count because it is in return_pending. When the
      cap is reached the customer must let a reservation lapse or cancel one before reserving another; the
      cap is never raised on request.
    eligibility:
      - id: open_order_cap
        applies_to: [purchase_order_reserved]
        kind: authorization
        condition: "A new reservation is accepted only when the count is below the cap."
        evidence_fields: [purchase_orders.customer_id, purchase_orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.customer_id]
          action_bindings:
            purchase_orders.customer_id: customer_id
    params:
      max_open_pre_handover_orders: 2
    measures: [purchase_msr_open_pre_handover_orders]

  - id: purchase_reservation_deposit
    subject: [purchase_order_reserved, purchase_deposit_paid]
    rule: >-
      Reserving a vehicle requires the program's reservation deposit, paid in full on one of the program's
      deposit payment channels; a reservation without the full deposit received is not placed. The buyer
      must have reached the minimum buyer age on the reservation date, computed from the date of birth on the
      customer profile. A deposit is posted only on an order whose status is reserved. The hold expiration
      date is the reservation date plus the program's reservation hold days, counted in calendar days with
      the reservation date as day 0. An exchange replacement reservation (exchange_source_order_id set)
      requires no new deposit: the refundable funds of the returned order are moved to it at signing under
      purchase_return_settlement. Deposit money counts toward the order's card payment cap when paid by card.
    eligibility:
      - id: buyer_age
        applies_to: [purchase_order_reserved]
        kind: authorization
        condition: "The buyer must have reached the minimum buyer age on the reservation date, computed from the date of birth on the customer profile."
        evidence_fields: [customers.date_of_birth, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: deposit_on_reserved_order
        applies_to: [purchase_deposit_paid]
        kind: state
        condition: "A deposit is posted only on an order whose status is reserved."
        evidence_fields: [purchase_orders.status, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        state_contract:
          field: purchase_orders.status
          allowed: [reserved]
    params:
      per_tier:
        Kestrel Value Line: {reservation_deposit_usd: "=reservation_deposit_usd", reservation_hold_days: "=reservation_hold_days"}
        Kestrel Inspected: {reservation_deposit_usd: "=reservation_deposit_usd", reservation_hold_days: "=reservation_hold_days"}
        Kestrel Certified: {reservation_deposit_usd: "=reservation_deposit_usd", reservation_hold_days: "=reservation_hold_days"}
        Kestrel Certified Plus: {reservation_deposit_usd: "=reservation_deposit_usd", reservation_hold_days: "=reservation_hold_days"}
        Kestrel Premium Certified: {reservation_deposit_usd: "=reservation_deposit_usd", reservation_hold_days: "=reservation_hold_days"}
        Kestrel Factory Certified: {reservation_deposit_usd: "=reservation_deposit_usd", reservation_hold_days: "=reservation_hold_days"}

  - id: purchase_hold_extension
    subject: [purchase_hold_extended]
    rule: >-
      A buyer who has not yet signed may ask to extend the reservation hold. A hold is extended only on an
      order whose status is reserved. The extension is requested no later than the hold expiration date
      recorded on the order. The order's extensions used must be below the program's maximum hold
      extensions. Each extension moves the hold expiration date later by the program's hold extension days,
      counted in calendar days from the current hold expiration date; it never restarts from the request
      date. An extension does not change the deposit, which stays held. A request made after the hold has
      lapsed is refused; the customer must reserve again if the vehicle is still listed.
    eligibility:
      - id: reserved_only
        applies_to: [purchase_hold_extended]
        kind: state
        condition: "A hold is extended only on an order whose status is reserved."
        evidence_fields: [purchase_orders.status, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        state_contract:
          field: purchase_orders.status
          allowed: [reserved]
      - id: before_hold_lapses
        applies_to: [purchase_hold_extended]
        kind: time
        condition: "The extension is requested no later than the hold expiration date recorded on the order."
        evidence_fields: [purchase_orders.hold_expires_date, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the hold expiration date recorded on the order"
          anchor_source: purchase_orders.hold_expires_date
          relation: not_after
          duration_source: params.extension_request_grace_days
          unit: calendar_days
          counting_rule: "Each extension moves the hold expiration date later by the program's hold extension days, counted in calendar days from the current hold expiration date; it never restarts from the request date."
          boundary: inclusive
      - id: extension_count
        applies_to: [purchase_hold_extended]
        kind: authorization
        condition: "The order's extensions used must be below the program's maximum hold extensions."
        evidence_fields: [purchase_orders.hold_extensions_used, purchase_orders.variant_name, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
    params:
      extension_request_grace_days: 0
      per_tier:
        Kestrel Value Line: {hold_extension_days: "=hold_extension_days", max_hold_extensions: "=max_hold_extensions"}
        Kestrel Inspected: {hold_extension_days: "=hold_extension_days", max_hold_extensions: "=max_hold_extensions"}
        Kestrel Certified: {hold_extension_days: "=hold_extension_days", max_hold_extensions: "=max_hold_extensions"}
        Kestrel Certified Plus: {hold_extension_days: "=hold_extension_days", max_hold_extensions: "=max_hold_extensions"}
        Kestrel Premium Certified: {hold_extension_days: "=hold_extension_days", max_hold_extensions: "=max_hold_extensions"}
        Kestrel Factory Certified: {hold_extension_days: "=hold_extension_days", max_hold_extensions: "=max_hold_extensions"}

  - id: purchase_reservation_expiry
    subject: [purchase_reservation_expired, purchase_deposit_refunded]
    rule: >-
      A reservation that is still reserved at the end of its hold expiration date lapses: the order moves to
      expired with closure reason reservation_lapsed and the vehicle returns to inventory. When the program's
      deposit refund on hold expiry switch is true, the full held deposit is refunded to the original channel
      within the program's deposit refund business days; nothing is retained. A deposit refund is posted only
      on an order whose status is expired or cancelled. A lapsed order cannot be revived; the customer
      reserves again. Deposit refunds are never split across channels and never exceed the deposit_held
      balance.
    eligibility:
      - id: refund_on_closed_order
        applies_to: [purchase_deposit_refunded]
        kind: state
        condition: "A deposit refund is posted only on an order whose status is expired or cancelled."
        evidence_fields: [purchase_orders.status, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        state_contract:
          field: purchase_orders.status
          allowed: [expired, cancelled]
    params:
      per_tier:
        Kestrel Value Line: {deposit_refund_business_days: "=deposit_refund_business_days", deposit_refund_on_hold_expiry: "=deposit_refund_on_hold_expiry"}
        Kestrel Inspected: {deposit_refund_business_days: "=deposit_refund_business_days", deposit_refund_on_hold_expiry: "=deposit_refund_on_hold_expiry"}
        Kestrel Certified: {deposit_refund_business_days: "=deposit_refund_business_days", deposit_refund_on_hold_expiry: "=deposit_refund_on_hold_expiry"}
        Kestrel Certified Plus: {deposit_refund_business_days: "=deposit_refund_business_days", deposit_refund_on_hold_expiry: "=deposit_refund_on_hold_expiry"}
        Kestrel Premium Certified: {deposit_refund_business_days: "=deposit_refund_business_days", deposit_refund_on_hold_expiry: "=deposit_refund_on_hold_expiry"}
        Kestrel Factory Certified: {deposit_refund_business_days: "=deposit_refund_business_days", deposit_refund_on_hold_expiry: "=deposit_refund_on_hold_expiry"}

  - id: purchase_agreement_charges
    subject: [purchase_agreement_signed, purchase_charge_posted, purchase_deposit_applied]
    rule: >-
      The purchase agreement may be signed only while the hold is in effect. The agreement is signed no
      later than the hold expiration date recorded on the order. The last day on which the agreement may be
      signed is the hold expiration date itself, counted as a calendar date. At signing the following charges post to
      the order, each as its own entry dated the signing date: the vehicle price; the documentation fee for
      the selling dealer state from the program's documentation fee table; the sales tax stated on the
      signed agreement; and, when the transfer distance exceeds the program's free transfer distance, a
      shipping fee equal to the distance-band fee for the full transfer distance reduced by the program's
      shipping fee discount, rounded to the cent (for an exchange replacement order whose program waives the
      exchange shipping fee, no shipping fee posts). Agreement charges post only on an order whose status is
      contracted, and return charges post only on an order whose status is return_pending or returned. The
      whole held deposit is applied to the order on the signing date. A deposit is applied only on an order
      whose status is contracted or cancelled. Prices and fees are those of the signing date; a later listing
      price change does not alter a signed agreement.
    eligibility:
      - id: signed_within_hold
        applies_to: [purchase_agreement_signed]
        kind: time
        condition: "The agreement is signed no later than the hold expiration date recorded on the order."
        evidence_fields: [purchase_orders.hold_expires_date, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the hold expiration date recorded on the order"
          anchor_source: purchase_orders.hold_expires_date
          relation: not_after
          duration_source: params.signing_grace_days
          unit: calendar_days
          counting_rule: "The last day on which the agreement may be signed is the hold expiration date itself, counted as a calendar date."
          boundary: inclusive
      - id: charges_on_open_order
        applies_to: [purchase_charge_posted]
        kind: state
        condition: "Agreement charges post only on an order whose status is contracted, and return charges post only on an order whose status is return_pending or returned."
        evidence_fields: [purchase_orders.status, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        state_contract:
          field: purchase_orders.status
          allowed: [contracted, return_pending, returned]
      - id: deposit_application_state
        applies_to: [purchase_deposit_applied]
        kind: state
        condition: "A deposit is applied only on an order whose status is contracted or cancelled."
        evidence_fields: [purchase_orders.status, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        state_contract:
          field: purchase_orders.status
          allowed: [contracted, cancelled]
    params:
      signing_grace_days: 0
      shipping_fee_bands:
        - {from_miles: 1, to_miles: 500, fee_usd: 499.00}
        - {from_miles: 501, to_miles: 1000, fee_usd: 799.00}
        - {from_miles: 1001, to_miles: 1500, fee_usd: 1099.00}
        - {from_miles: 1501, to_miles: "no upper limit", fee_usd: 1490.00}
      per_tier:
        Kestrel Value Line: {free_transfer_distance_miles: "=free_transfer_distance_miles", shipping_fee_discount_pct: "=shipping_fee_discount_pct"}
        Kestrel Inspected: {free_transfer_distance_miles: "=free_transfer_distance_miles", shipping_fee_discount_pct: "=shipping_fee_discount_pct"}
        Kestrel Certified: {free_transfer_distance_miles: "=free_transfer_distance_miles", shipping_fee_discount_pct: "=shipping_fee_discount_pct"}
        Kestrel Certified Plus: {free_transfer_distance_miles: "=free_transfer_distance_miles", shipping_fee_discount_pct: "=shipping_fee_discount_pct"}
        Kestrel Premium Certified: {free_transfer_distance_miles: "=free_transfer_distance_miles", shipping_fee_discount_pct: "=shipping_fee_discount_pct"}
        Kestrel Factory Certified: {free_transfer_distance_miles: "=free_transfer_distance_miles", shipping_fee_discount_pct: "=shipping_fee_discount_pct"}

  - id: purchase_payment_funding
    subject: [purchase_payment_posted]
    rule: >-
      Money is accepted toward an order from the buyer (down payment), from the held deposit, from Kestrel
      Auto Finance proceeds, from an outside lender, or from trade equity. A payment is posted only on an
      order whose status is contracted or cancelled; payments on a cancelled order are limited to applying
      held deposit money against a retained shipping fee. Combined debit-card and credit-card money on one
      order, deposit included, may not exceed the program's card payment cap; card money beyond the cap is
      refused and must come by ACH, wire or cashier's check. A single ACH payment may not exceed the
      program's ACH single payment limit. A down payment counts toward handover readiness only when it is
      received no later than the program's down payment lead business days for its channel before the
      handover date (business days are Monday to Friday excluding US federal holidays). Outside lender
      proceeds must be received within the program's outside lender funding days after the purchase
      agreement signing date; when they are not, the order is cancelled under purchase_cancellation with
      closure reason financing_not_completed. Kestrel Auto Finance proceeds post when the finance contract
      is funded and carry the finance contract in linked_reference_id; trade equity posts when the trade-in
      agreement applies it and carries the trade-in agreement in linked_reference_id.
    eligibility:
      - id: payment_state
        applies_to: [purchase_payment_posted]
        kind: state
        condition: "A payment is posted only on an order whose status is contracted or cancelled; payments on a cancelled order are limited to applying held deposit money against a retained shipping fee."
        evidence_fields: [purchase_orders.status, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        state_contract:
          field: purchase_orders.status
          allowed: [contracted, cancelled]
      - id: card_cap
        applies_to: [purchase_payment_posted]
        kind: authorization
        condition: "Combined debit-card and credit-card money on one order, deposit included, may not exceed the program's card payment cap; card money beyond the cap is refused and must come by ACH, wire or cashier's check."
        evidence_fields: [purchase_transactions.amount, purchase_transactions.payment_channel, purchase_transactions.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_transactions.purchase_order_id]
          action_bindings:
            purchase_transactions.purchase_order_id: purchase_order_id
    params:
      per_tier:
        Kestrel Value Line: {card_payment_cap_usd: "=card_payment_cap_usd", outside_lender_funding_days: "=outside_lender_funding_days"}
        Kestrel Inspected: {card_payment_cap_usd: "=card_payment_cap_usd", outside_lender_funding_days: "=outside_lender_funding_days"}
        Kestrel Certified: {card_payment_cap_usd: "=card_payment_cap_usd", outside_lender_funding_days: "=outside_lender_funding_days"}
        Kestrel Certified Plus: {card_payment_cap_usd: "=card_payment_cap_usd", outside_lender_funding_days: "=outside_lender_funding_days"}
        Kestrel Premium Certified: {card_payment_cap_usd: "=card_payment_cap_usd", outside_lender_funding_days: "=outside_lender_funding_days"}
        Kestrel Factory Certified: {card_payment_cap_usd: "=card_payment_cap_usd", outside_lender_funding_days: "=outside_lender_funding_days"}
    measures: [purchase_msr_card_money_on_order]

  - id: purchase_insurance_requirement
    subject: [purchase_insurance_verified]
    rule: >-
      When the program requires proof of insurance, the order is marked insurance verified only after the
      buyer's insurance card or declarations page is received showing the order's VIN, the buyer as a named
      insured, and an effective date no later than the scheduled handover date. For an order paid through
      Kestrel Auto Finance or an outside lender, the proof must also show comprehensive and collision
      coverage with a deductible no higher than the program's financed insurance deductible maximum and the
      lender as loss payee; liability-only proof is not accepted on a financed order. Insurance is verified
      only on an order whose status is reserved or contracted. The buyer's statement that a policy exists is
      not proof.
    eligibility:
      - id: insurance_state
        applies_to: [purchase_insurance_verified]
        kind: state
        condition: "Insurance is verified only on an order whose status is reserved or contracted."
        evidence_fields: [purchase_orders.status, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        state_contract:
          field: purchase_orders.status
          allowed: [reserved, contracted]
    params:
      per_tier:
        Kestrel Value Line: {insurance_proof_required: "=insurance_proof_required", financed_insurance_deductible_max_usd: "=financed_insurance_deductible_max_usd"}
        Kestrel Inspected: {insurance_proof_required: "=insurance_proof_required", financed_insurance_deductible_max_usd: "=financed_insurance_deductible_max_usd"}
        Kestrel Certified: {insurance_proof_required: "=insurance_proof_required", financed_insurance_deductible_max_usd: "=financed_insurance_deductible_max_usd"}
        Kestrel Certified Plus: {insurance_proof_required: "=insurance_proof_required", financed_insurance_deductible_max_usd: "=financed_insurance_deductible_max_usd"}
        Kestrel Premium Certified: {insurance_proof_required: "=insurance_proof_required", financed_insurance_deductible_max_usd: "=financed_insurance_deductible_max_usd"}
        Kestrel Factory Certified: {insurance_proof_required: "=insurance_proof_required", financed_insurance_deductible_max_usd: "=financed_insurance_deductible_max_usd"}

  - id: purchase_handover_readiness
    subject: [purchase_vehicle_handed_over]
    rule: >-
      A vehicle is handed over only on a signed order, and only when all of the following hold on the
      handover date: the order's insurance verified flag is true; the order balance is zero or below, with
      every down payment received within its channel lead time; for an order paid through Kestrel Auto
      Finance, the finance contract for the order is active; and the agreement was signed at least the
      program's handover signing lead days before the handover date. When the handover odometer exceeds the
      listing odometer by more than the program's handover odometer tolerance, the buyer may decline the
      vehicle at the door; a declined vehicle is not handed over and the order is cancelled with closure
      reason vehicle_unavailable. A buyer who accepts the vehicle despite the variance keeps every right of
      the program, with the return mileage counted from the handover odometer. Holding X changes Y: a
      Kestrel Auto Finance order cannot be handed over while its finance contract is still only approved.
    eligibility:
      - id: insurance_and_funds
        applies_to: [purchase_vehicle_handed_over]
        kind: authorization
        condition: "A vehicle is handed over only on a signed order, and only when all of the following hold on the handover date: the order's insurance verified flag is true; the order balance is zero or below, with every down payment received within its channel lead time; for an order paid through Kestrel Auto Finance, the finance contract for the order is active; and the agreement was signed at least the program's handover signing lead days before the handover date."
        evidence_fields: [purchase_orders.insurance_verified, purchase_orders.order_balance, purchase_orders.contract_signed_date, finance_contracts.status, finance_contracts.purchase_order_id, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
            - [finance_contracts.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
            finance_contracts.purchase_order_id: purchase_order_id
    params:
      per_tier:
        Kestrel Value Line: {handover_odometer_tolerance_miles: "=handover_odometer_tolerance_miles", handover_signing_lead_days: "=handover_signing_lead_days", down_payment_lead_business_days: "=down_payment_lead_business_days"}
        Kestrel Inspected: {handover_odometer_tolerance_miles: "=handover_odometer_tolerance_miles", handover_signing_lead_days: "=handover_signing_lead_days", down_payment_lead_business_days: "=down_payment_lead_business_days"}
        Kestrel Certified: {handover_odometer_tolerance_miles: "=handover_odometer_tolerance_miles", handover_signing_lead_days: "=handover_signing_lead_days", down_payment_lead_business_days: "=down_payment_lead_business_days"}
        Kestrel Certified Plus: {handover_odometer_tolerance_miles: "=handover_odometer_tolerance_miles", handover_signing_lead_days: "=handover_signing_lead_days", down_payment_lead_business_days: "=down_payment_lead_business_days"}
        Kestrel Premium Certified: {handover_odometer_tolerance_miles: "=handover_odometer_tolerance_miles", handover_signing_lead_days: "=handover_signing_lead_days", down_payment_lead_business_days: "=down_payment_lead_business_days"}
        Kestrel Factory Certified: {handover_odometer_tolerance_miles: "=handover_odometer_tolerance_miles", handover_signing_lead_days: "=handover_signing_lead_days", down_payment_lead_business_days: "=down_payment_lead_business_days"}

  - id: purchase_cancellation
    subject: [purchase_order_cancelled, purchase_charge_reversed, purchase_refund_issued, purchase_deposit_refunded]
    rule: >-
      An order may be cancelled at any time before handover, from reserved or contracted. Before refunds are
      released, the caller must have passed identity verification on this customer. On cancellation every
      agreement charge is reversed, except that a shipping fee already charged on a vehicle that has been
      transferred is retained when the cancellation reason is customer_cancelled or financing_not_completed
      and the program's shipping fee refundable switch is false. When the cancellation reason is
      vehicle_unavailable, every charge is reversed, the shipping fee included, whatever the program. A charge
      reversal is posted only on an order whose status is contracted, delivered, completed, cancelled or
      returned. A retained shipping fee is paid first from deposit money still held, through a deposit
      application on the cancelled order; any deposit left is refunded. Customer-paid down payments are
      refunded to their original channel within the program's cancellation refund business days, less any
      retained shipping fee the deposit did not cover; trade equity already applied to the order is refunded
      to the buyer by ACH. A refund is posted only on an order whose status is cancelled, returned or
      completed. Finance proceeds are never refunded to the buyer: lender proceeds already received are sent
      back to the lender as a lender_proceeds_return refund entry, and on cancellation a
      Kestrel Auto Finance application that is still only approved is withdrawn and a Kestrel Auto Finance
      contract that is already active is unwound, and trade-in agreements, title orders and
      delivery appointments for the order are cancelled. A cancellation for financing not completed is
      recorded only after the outside lender funding period counted from the purchase agreement signing date
      has passed. The funding period is counted in calendar days with the signing date as day 0 and ends at
      the end of its last day.
    eligibility:
      - id: verified_caller
        applies_to: [purchase_refund_issued, purchase_deposit_refunded]
        kind: authorization
        condition: "Before refunds are released, the caller must have passed identity verification on this customer."
        evidence_fields: [identity_verifications.verified, identity_verifications.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [identity_verifications.customer_id]
          action_bindings:
            identity_verifications.customer_id: customer_id
      - id: reversal_state
        applies_to: [purchase_charge_reversed]
        kind: state
        condition: "A charge reversal is posted only on an order whose status is contracted, delivered, completed, cancelled or returned."
        evidence_fields: [purchase_orders.status, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        state_contract:
          field: purchase_orders.status
          allowed: [contracted, delivered, completed, cancelled, returned]
      - id: refund_state
        applies_to: [purchase_refund_issued]
        kind: state
        condition: "A refund is posted only on an order whose status is cancelled, returned or completed."
        evidence_fields: [purchase_orders.status, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        state_contract:
          field: purchase_orders.status
          allowed: [cancelled, returned, completed]
      - id: outside_funding_lapse
        applies_to: [purchase_order_cancelled]
        kind: time
        condition: "A cancellation for financing not completed is recorded only after the outside lender funding period counted from the purchase agreement signing date has passed."
        evidence_fields: [purchase_orders.contract_signed_date, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the purchase agreement signing date"
          anchor_source: purchase_orders.contract_signed_date
          relation: not_before
          duration_source: variants.outside_lender_funding_days
          unit: calendar_days
          counting_rule: "The funding period is counted in calendar days with the signing date as day 0 and ends at the end of its last day."
          boundary: exclusive
    params:
      per_tier:
        Kestrel Value Line: {shipping_fee_refundable: "=shipping_fee_refundable", cancellation_refund_business_days: "=cancellation_refund_business_days"}
        Kestrel Inspected: {shipping_fee_refundable: "=shipping_fee_refundable", cancellation_refund_business_days: "=cancellation_refund_business_days"}
        Kestrel Certified: {shipping_fee_refundable: "=shipping_fee_refundable", cancellation_refund_business_days: "=cancellation_refund_business_days"}
        Kestrel Certified Plus: {shipping_fee_refundable: "=shipping_fee_refundable", cancellation_refund_business_days: "=cancellation_refund_business_days"}
        Kestrel Premium Certified: {shipping_fee_refundable: "=shipping_fee_refundable", cancellation_refund_business_days: "=cancellation_refund_business_days"}
        Kestrel Factory Certified: {shipping_fee_refundable: "=shipping_fee_refundable", cancellation_refund_business_days: "=cancellation_refund_business_days"}

  - id: purchase_return_eligibility
    subject: [purchase_return_initiated]
    rule: >-
      The Kestrel 7-Day Return lets the buyer return the vehicle for a refund or, when the program allows
      exchanges, apply the purchase to another Kestrel vehicle. The return is requested no later than the
      last day of the return window counted from the handover date. The window is counted in calendar days
      with the handover date as day 0 and ends at the end of the last day of the program's return window
      days; a request on that last day qualifies and a request the next day does not. Miles driven are the
      odometer the customer reports at the request minus the handover odometer; when they exceed the
      program's return mileage hard cap the return is not accepted, and when they exceed the program's return
      mileage allowance the return is accepted with an excess-mileage fee. Returns used across the exchange
      chain, counted by purchase_msr_returns_in_chain, must be below the program's returns per exchange
      chain; an exchange replacement order whose chain has already used its return carries no 7-day right.
      Only one return request may be made per order, whatever became of it. The vehicle must be handed back within the
      program's return handback days after the request date by home pickup or, when allowed, hub drop-off. The
      return right is not extended by registration delays, repairs or reschedules.
    eligibility:
      - id: within_return_window
        applies_to: [purchase_return_initiated]
        kind: time
        condition: "The return is requested no later than the last day of the return window counted from the handover date."
        evidence_fields: [purchase_orders.handover_date, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the handover date"
          anchor_source: purchase_orders.handover_date
          relation: not_after
          duration_source: variants.return_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days with the handover date as day 0 and ends at the end of the last day of the program's return window days; a request on that last day qualifies and a request the next day does not."
          boundary: inclusive
      - id: one_return_per_order
        applies_to: [purchase_return_initiated]
        kind: dedup
        condition: "Only one return request may be made per order, whatever became of it."
        evidence_fields: [purchase_return_requests.purchase_order_id, purchase_return_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_return_requests.purchase_order_id]
          action_bindings:
            purchase_return_requests.purchase_order_id: purchase_order_id
        dedup_contract:
          table: purchase_return_requests
          mode: separate_record
          object_bindings: {purchase_order_id: purchase_order_id}
          duplicate_filters: {request_status: [pending_customer_confirmation, confirmed, withdrawn, completed]}
          distinct_fields: []
      - id: mileage_cap
        applies_to: [purchase_return_initiated]
        kind: caller_fact
        condition: "Miles driven are the odometer the customer reports at the request minus the handover odometer; when they exceed the program's return mileage hard cap the return is not accepted, and when they exceed the program's return mileage allowance the return is accepted with an excess-mileage fee."
        evidence_fields: [purchase_orders.handover_odometer, purchase_return_requests.odometer_reported, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
    params:
      per_tier:
        Kestrel Value Line: {return_window_days: "=return_window_days", return_mileage_allowance: "=return_mileage_allowance", return_mileage_hard_cap: "=return_mileage_hard_cap", returns_per_exchange_chain: "=returns_per_exchange_chain", return_handback_days_after_request: "=return_handback_days_after_request"}
        Kestrel Inspected: {return_window_days: "=return_window_days", return_mileage_allowance: "=return_mileage_allowance", return_mileage_hard_cap: "=return_mileage_hard_cap", returns_per_exchange_chain: "=returns_per_exchange_chain", return_handback_days_after_request: "=return_handback_days_after_request"}
        Kestrel Certified: {return_window_days: "=return_window_days", return_mileage_allowance: "=return_mileage_allowance", return_mileage_hard_cap: "=return_mileage_hard_cap", returns_per_exchange_chain: "=returns_per_exchange_chain", return_handback_days_after_request: "=return_handback_days_after_request"}
        Kestrel Certified Plus: {return_window_days: "=return_window_days", return_mileage_allowance: "=return_mileage_allowance", return_mileage_hard_cap: "=return_mileage_hard_cap", returns_per_exchange_chain: "=returns_per_exchange_chain", return_handback_days_after_request: "=return_handback_days_after_request"}
        Kestrel Premium Certified: {return_window_days: "=return_window_days", return_mileage_allowance: "=return_mileage_allowance", return_mileage_hard_cap: "=return_mileage_hard_cap", returns_per_exchange_chain: "=returns_per_exchange_chain", return_handback_days_after_request: "=return_handback_days_after_request"}
        Kestrel Factory Certified: {return_window_days: "=return_window_days", return_mileage_allowance: "=return_mileage_allowance", return_mileage_hard_cap: "=return_mileage_hard_cap", returns_per_exchange_chain: "=returns_per_exchange_chain", return_handback_days_after_request: "=return_handback_days_after_request"}
    measures: [purchase_msr_returns_in_chain]

  - id: purchase_return_settlement
    subject: [purchase_return_completed, purchase_charge_posted, purchase_charge_reversed, purchase_refund_issued]
    rule: >-
      When the returned vehicle is received, the return inspection is completed within the program's return
      inspection business days and the order moves to returned, recording the return odometer. Every
      agreement charge is reversed: the vehicle price, the sales tax, the documentation fee when the
      program's documentation fee refundable on return switch is true, and the shipping fee only when the
      program's shipping fee refundable switch is true. Return charges then post, each as its own entry linked
      to the return request: the excess-mileage fee, equal to the miles driven since handover beyond the
      program's return mileage allowance times the program's excess return mileage fee per mile; a damage
      charge equal to the repair estimate of new damage when that estimate exceeds the program's return
      damage waiver (the whole estimate is charged, not only the excess); the program's missing key charge for
      each key delivered with the vehicle and not returned; and the program's return pickup fee when the
      return method was home pickup. Lender proceeds are never refunded to the buyer: they are sent back to
      the lender as a lender_proceeds_return refund entry, and a Kestrel Auto Finance contract is unwound. The buyer's own payments are refunded to their original
      channel, less the return charges, within the program's return refund business days; a refund of an ACH
      down payment is not released until it has cleared for the program's ACH clearing hold business days.
      Trade equity credited to the order is refunded to the buyer as cash by ACH; the trade-in vehicle itself
      is not given back. For an exchange the refundable funds leave the returned order as an exchange_transfer
      refund entry and are moved to the replacement order as a
      down payment by internal transfer. Any KestrelCare service contract or maintenance plan on the vehicle
      is cancelled flat with a full refund, and the title order is cancelled when it has not yet been
      submitted to the state.
    eligibility:
      - id: ach_cleared_before_refund
        applies_to: [purchase_refund_issued]
        kind: authorization
        condition: "The buyer's own payments are refunded to their original channel, less the return charges, within the program's return refund business days; a refund of an ACH down payment is not released until it has cleared for the program's ACH clearing hold business days."
        evidence_fields: [purchase_transactions.payment_channel, purchase_transactions.txn_date, purchase_transactions.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_transactions.purchase_order_id]
          action_bindings:
            purchase_transactions.purchase_order_id: purchase_order_id
    params:
      per_tier:
        Kestrel Value Line: {excess_return_mileage_fee_per_mile: "=excess_return_mileage_fee_per_mile", return_damage_waiver_usd: "=return_damage_waiver_usd", missing_key_charge_usd: "=missing_key_charge_usd", return_pickup_fee_usd: "=return_pickup_fee_usd", return_refund_business_days: "=return_refund_business_days"}
        Kestrel Inspected: {excess_return_mileage_fee_per_mile: "=excess_return_mileage_fee_per_mile", return_damage_waiver_usd: "=return_damage_waiver_usd", missing_key_charge_usd: "=missing_key_charge_usd", return_pickup_fee_usd: "=return_pickup_fee_usd", return_refund_business_days: "=return_refund_business_days"}
        Kestrel Certified: {excess_return_mileage_fee_per_mile: "=excess_return_mileage_fee_per_mile", return_damage_waiver_usd: "=return_damage_waiver_usd", missing_key_charge_usd: "=missing_key_charge_usd", return_pickup_fee_usd: "=return_pickup_fee_usd", return_refund_business_days: "=return_refund_business_days"}
        Kestrel Certified Plus: {excess_return_mileage_fee_per_mile: "=excess_return_mileage_fee_per_mile", return_damage_waiver_usd: "=return_damage_waiver_usd", missing_key_charge_usd: "=missing_key_charge_usd", return_pickup_fee_usd: "=return_pickup_fee_usd", return_refund_business_days: "=return_refund_business_days"}
        Kestrel Premium Certified: {excess_return_mileage_fee_per_mile: "=excess_return_mileage_fee_per_mile", return_damage_waiver_usd: "=return_damage_waiver_usd", missing_key_charge_usd: "=missing_key_charge_usd", return_pickup_fee_usd: "=return_pickup_fee_usd", return_refund_business_days: "=return_refund_business_days"}
        Kestrel Factory Certified: {excess_return_mileage_fee_per_mile: "=excess_return_mileage_fee_per_mile", return_damage_waiver_usd: "=return_damage_waiver_usd", missing_key_charge_usd: "=missing_key_charge_usd", return_pickup_fee_usd: "=return_pickup_fee_usd", return_refund_business_days: "=return_refund_business_days"}
    formula:
      miles_since_handover: "return_odometer - handover_odometer"
      excess_mileage_fee: "round(max(0, miles_since_handover - return_mileage_allowance) * excess_return_mileage_fee_per_mile, 2)"

  - id: purchase_limited_warranty
    subject: [purchase_limited_warranty_claim_decided]
    rule: >-
      Every program includes a Kestrel limited warranty that starts on the handover date and ends at the
      earlier of the handover date plus the program's included warranty days or the handover odometer plus
      the program's included warranty miles; a failure is covered only when its failure date and repair-order
      odometer are both inside that coverage. A limited warranty claim is decided only on an order whose status
      is delivered or completed; a returned, return-pending or cancelled order has no limited warranty. The
      failed part must belong to one of the program's covered systems; wear items, maintenance, cosmetic items,
      and damage from collision, misuse or neglect are never covered (denied_damage_or_misuse). The repair
      facility must request authorization within the program's claim report days after the failure date and
      before work begins. Each repair order is decided once. The repair estimate is recognized at no more than
      the program's labor rate cap; the covered amount is the recognized estimate less the program's
      deductible, limited to the program's per-claim cap and to what remains of the program's aggregate cap
      after earlier approved claims on the order; a claim with nothing remaining under the aggregate cap is
      denied_over_limit. An approved claim that keeps the vehicle overnight earns rental reimbursement at the
      program's rental per day up to its rental maximum days, and towing to the facility up to the program's
      towing cap. Holding X changes Y: when a KestrelCare service contract on the vehicle is also in force,
      the limited warranty pays first and the service contract pays only what the limited warranty does not.
    eligibility:
      - id: covered_order_state
        applies_to: [purchase_limited_warranty_claim_decided]
        kind: state
        condition: "A limited warranty claim is decided only on an order whose status is delivered or completed; a returned, return-pending or cancelled order has no limited warranty."
        evidence_fields: [purchase_orders.status, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
        state_contract:
          field: purchase_orders.status
          allowed: [delivered, completed]
      - id: one_decision_per_repair_order
        applies_to: [purchase_limited_warranty_claim_decided]
        kind: dedup
        condition: "Each repair order is decided once."
        evidence_fields: [purchase_limited_warranty_claims.repair_order_number, purchase_limited_warranty_claims.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_limited_warranty_claims.repair_order_number]
          action_bindings:
            purchase_limited_warranty_claims.repair_order_number: repair_order_number
        dedup_contract:
          table: purchase_limited_warranty_claims
          mode: separate_record
          object_bindings: {repair_order_number: repair_order_number}
          duplicate_filters: {event_type: [purchase_limited_warranty_claim_decided]}
          distinct_fields: []
    params:
      per_tier:
        Kestrel Value Line: {included_warranty_days: "=included_warranty_days", included_warranty_miles: "=included_warranty_miles", included_warranty_deductible_usd: "=included_warranty_deductible_usd", included_warranty_per_claim_cap_usd: "=included_warranty_per_claim_cap_usd", included_warranty_aggregate_cap_usd: "=included_warranty_aggregate_cap_usd"}
        Kestrel Inspected: {included_warranty_days: "=included_warranty_days", included_warranty_miles: "=included_warranty_miles", included_warranty_deductible_usd: "=included_warranty_deductible_usd", included_warranty_per_claim_cap_usd: "=included_warranty_per_claim_cap_usd", included_warranty_aggregate_cap_usd: "=included_warranty_aggregate_cap_usd"}
        Kestrel Certified: {included_warranty_days: "=included_warranty_days", included_warranty_miles: "=included_warranty_miles", included_warranty_deductible_usd: "=included_warranty_deductible_usd", included_warranty_per_claim_cap_usd: "=included_warranty_per_claim_cap_usd", included_warranty_aggregate_cap_usd: "=included_warranty_aggregate_cap_usd"}
        Kestrel Certified Plus: {included_warranty_days: "=included_warranty_days", included_warranty_miles: "=included_warranty_miles", included_warranty_deductible_usd: "=included_warranty_deductible_usd", included_warranty_per_claim_cap_usd: "=included_warranty_per_claim_cap_usd", included_warranty_aggregate_cap_usd: "=included_warranty_aggregate_cap_usd"}
        Kestrel Premium Certified: {included_warranty_days: "=included_warranty_days", included_warranty_miles: "=included_warranty_miles", included_warranty_deductible_usd: "=included_warranty_deductible_usd", included_warranty_per_claim_cap_usd: "=included_warranty_per_claim_cap_usd", included_warranty_aggregate_cap_usd: "=included_warranty_aggregate_cap_usd"}
        Kestrel Factory Certified: {included_warranty_days: "=included_warranty_days", included_warranty_miles: "=included_warranty_miles", included_warranty_deductible_usd: "=included_warranty_deductible_usd", included_warranty_per_claim_cap_usd: "=included_warranty_per_claim_cap_usd", included_warranty_aggregate_cap_usd: "=included_warranty_aggregate_cap_usd"}
    formula:
      when: "claim_decision == 'approved'"
      covered_amount: "max(0, min(repair_estimate - included_warranty_deductible_usd, included_warranty_per_claim_cap_usd, included_warranty_aggregate_cap_usd - purchase_msr_limited_warranty_paid))"
      rental_amount: "min(rental_days, included_warranty_rental_max_days) * included_warranty_rental_per_day_usd"
    measures: [purchase_msr_limited_warranty_paid]

  - id: purchase_sale_finality
    subject: [purchase_sale_finalized, purchase_return_withdrawn]
    rule: >-
      The sale becomes final on the first day after the return window ends when the order is delivered with no
      return pending; the order moves to completed with closure reason sale_final and the 7-day right is gone.
      A buyer may withdraw a pending return at any time before handing the vehicle back; the order returns to
      delivered, the return request is marked withdrawn, and the withdrawal uses up the order's one return
      request, so a second return request on the same order is not accepted. A withdrawn return does not
      extend the window. An order that is return_pending when the window ends is not finalized while the
      return is pending.
    eligibility: []

  - id: purchase_overpayment_refund
    subject: [purchase_refund_issued, purchase_charge_reversed]
    rule: >-
      When a completed order shows a negative order balance (more received than owed, for example because a
      lender funded more than the agreement required or a fee was reversed as a billing correction), the
      credit is refunded as an overpayment refund within the program's overpayment refund business days to
      the channel of the most recent customer payment, or by ACH when the excess came from a lender or from
      trade equity. A fee reversal for billing correction is posted only when the charged amount differs from
      the amount this charter fixes for that order on the signing date; a fee charged correctly is never
      waived on request. An order with a zero or positive balance has nothing to refund.
    eligibility: []
    params:
      per_tier:
        Kestrel Value Line: {overpayment_refund_business_days: "=overpayment_refund_business_days"}
        Kestrel Inspected: {overpayment_refund_business_days: "=overpayment_refund_business_days"}
        Kestrel Certified: {overpayment_refund_business_days: "=overpayment_refund_business_days"}
        Kestrel Certified Plus: {overpayment_refund_business_days: "=overpayment_refund_business_days"}
        Kestrel Premium Certified: {overpayment_refund_business_days: "=overpayment_refund_business_days"}
        Kestrel Factory Certified: {overpayment_refund_business_days: "=overpayment_refund_business_days"}

# ============================================================================
# extended_policies (difficulty purchase_reservations_and_returns)
# ============================================================================
extended_policies:
  # ---------------------------------------------------------------- task 0
  - id: purchase_ext_exchange_shipping_fee
    base_policy_refs: [purchase_agreement_charges, purchase_return_settlement]
    overwrite:
      - base_policy: purchase_agreement_charges
        superseded_clause: >-
          a shipping fee equal to the distance-band fee for the full transfer distance reduced by the program's
          shipping fee discount, rounded to the cent (for an exchange replacement order whose program waives
          the exchange shipping fee, no shipping fee posts)
        replaced_by: >-
          The standard exchange replacement shipping fee is the band fee of the shipping band that the full
          transfer distance falls in, reduced by the program's shipping fee discount and rounded half up to the
          cent
    trigger: state_due
    subject: [purchase_charge_posted]
    computes: amount
    target_tool: post_exchange_shipping_fee_0e49ee13
    params:
      band_1_max_miles: 500
      band_2_max_miles: 1000
      band_3_max_miles: 1500
      band_1_fee_usd: 499.00
      band_2_fee_usd: 799.00
      band_3_fee_usd: 1099.00
      band_4_fee_usd: 1490.00
      carry_share_high_pct: 80
      carry_share_low_pct: 50
      rush_lead_days: 2
      priority_lead_days: 5
      rush_per_mile_usd: 1.45
      priority_per_mile_usd: 1.15
      autopay_borrower_discount_points: 25
      manual_pay_borrower_discount_points: 10
      top_plan_credit_usd: 150.00
      mid_plan_credit_usd: 75.00
      inspection_surcharge_usd: 120.00
      out_of_state_surcharge_usd: 60.00
    rule: >-
      The exchange replacement shipping fee is the charge for transporting the vehicle of an exchange
      replacement order (an order whose exchange source order is set) from its hub to the buyer's market,
      posted on that replacement order dated its signing date. The standard exchange replacement shipping fee
      is the band fee of the shipping band that the full transfer distance falls in, reduced by the program's
      shipping fee discount and rounded half up to the cent; the shipping bands run from the first band, for
      distances up to the first band limit, through the second and third bands, for distances up to the second
      and third band limits, to the fourth band, for distances above the third band limit. No exchange
      replacement shipping fee is owed when the transfer distance is no more than the program's free transfer
      distance or when the program waives the exchange shipping fee. The carry-over share of an exchange
      replacement is the money moved onto the replacement order by internal transfer from the returned order,
      as a percentage of the vehicle price charged on the replacement order net of any reversal of that price,
      rounded half up to two decimal places. An exchange that carries most of the returned purchase's money
      over is treated as a continuation of the original sale and earns exchange courtesy miles, which are
      taken off the transfer distance before the exchange replacement shipping fee is priced: twice the
      program's free transfer distance when the carry-over share is at least the high carry-over share, the
      program's free transfer distance when it is at least the low carry-over share but below the high
      carry-over share, and no courtesy miles when it is below the low carry-over share; the distance that
      remains is the exchange pricing distance. The handover lead time of an exchange replacement is the
      number of calendar days from the replacement order's signing date to the date of the handover
      appointment currently scheduled for it. A short handover lead time needs a dedicated carrier and changes
      how the exchange transport price is set: for a lead time of no more than the rush lead days the
      transport price is the exchange pricing distance times the rush per-mile rate, with no band fee; for a
      lead time above the rush lead days and no more than the priority lead days it is the higher of the band
      fee of the band the exchange pricing distance falls in and the exchange pricing distance times the
      priority per-mile rate; for a longer lead time it is the band fee of the band the exchange pricing
      distance falls in; each per-mile product is rounded half up to the cent. The discount applied to the
      exchange transport price is the program's shipping fee discount, except that a buyer who holds an active
      Kestrel Auto Finance contract enrolled in autopay, with no payment returned on any of the buyer's Kestrel
      Auto Finance contracts within the twelve whole months before today, receives the program's discount plus
      the autopay borrower discount points, and a buyer who holds an active Kestrel Auto Finance contract not
      enrolled in autopay, with no payment returned within those twelve whole months, receives the program's
      discount plus the manual-pay borrower discount points; a returned payment twelve or more whole months old
      does not count, and the discount never exceeds one hundred percent. A KestrelCare service contract sold
      with the replacement vehicle earns a protection plan credit against the exchange replacement shipping
      fee: the top-plan credit for KestrelCare Platinum or KestrelCare Platinum Exclusionary, the mid-plan
      credit for KestrelCare Silver or KestrelCare Gold, and no credit for any other plan or when no plan was
      sold with the vehicle. A replacement registered through an out-of-state title service carries an
      interstate surcharge on the exchange replacement shipping fee: the inspection surcharge when the
      replacement's title order service is Kestrel Out-of-State Registration with Inspection, the out-of-state
      surcharge when it is Kestrel Out-of-State Registration, and no surcharge for any other service. The
      exchange replacement shipping fee is worked out in this order: first the courtesy miles from the
      carry-over share and the exchange pricing distance they leave, then the transport price for the handover
      lead time, then that transport price reduced by the applicable discount percentage and rounded half up
      to the cent; the interstate surcharge is then added to that discounted price and the protection plan
      credit subtracted from it, and the result is never below zero.
    prerequisite: []
    cross_category:
      - category: delivery
        as: branch
        reads: [scheduled_date]
        note: The expedited transport pricing ladder reads the date of the replacement's scheduled handover appointment.
      - category: finance
        as: history
        reads: [status, autopay_enrolled, finance_transactions.event_type, finance_transactions.txn_date]
        note: The borrower discount ladder reads the buyer's active Kestrel Auto Finance contract and its returned payments.
      - category: warranty
        as: branch
        reads: [variant_name, sold_with_vehicle]
        note: The protection plan credit ladder reads the KestrelCare plan sold with the replacement vehicle.
      - category: title
        as: branch
        reads: [variant_name]
        note: The interstate surcharge ladder reads the service of the replacement's title order.
    compute:
      - exchange_carry_funds: "SUM('purchase_transactions','amount', event_type='purchase_payment_posted', payment_source='down_payment', payment_channel='internal_transfer')"
      - exchange_price_charged: "SUM('purchase_transactions','amount', event_type='purchase_charge_posted', charge_type='vehicle_price') - SUM('purchase_transactions','amount', event_type='purchase_charge_reversed', charge_type='vehicle_price')"
      - exchange_carry_share: "RND(exchange_carry_funds * 100 / exchange_price_charged, 2) if exchange_price_charged > 0 else 0"
      - exchange_courtesy_miles: "2 * P('free_transfer_distance_miles') if exchange_carry_share >= K('carry_share_high_pct') else (P('free_transfer_distance_miles') if exchange_carry_share >= K('carry_share_low_pct') else 0)"
      - exchange_pricing_distance: "F('transfer_distance_miles') - exchange_courtesy_miles"
      - exchange_band: "1 if exchange_pricing_distance <= K('band_1_max_miles') else (2 if exchange_pricing_distance <= K('band_2_max_miles') else (3 if exchange_pricing_distance <= K('band_3_max_miles') else 4))"
      - exchange_band_fee: "K('band_1_fee_usd') if exchange_band == 1 else (K('band_2_fee_usd') if exchange_band == 2 else (K('band_3_fee_usd') if exchange_band == 3 else K('band_4_fee_usd')))"
      - exchange_lead_days: "DAYS(F('contract_signed_date'), CFIELD('delivery','scheduled_date', purchase_order_id=HID))"
      - exchange_transport_price: "RND(exchange_pricing_distance * K('rush_per_mile_usd'), 2) if exchange_lead_days <= K('rush_lead_days') else (MX(exchange_band_fee, RND(exchange_pricing_distance * K('priority_per_mile_usd'), 2)) if exchange_lead_days <= K('priority_lead_days') else exchange_band_fee)"
      - exchange_returned_12m: "XCOUNT('finance','finance_transactions', within_months=12, date_field='txn_date', event_type='finance_payment_returned')"
      - exchange_discount_pct: "MN(100, P('shipping_fee_discount_pct') + K('autopay_borrower_discount_points')) if (EXISTS('finance', status='active', autopay_enrolled=True) and exchange_returned_12m == 0) else (MN(100, P('shipping_fee_discount_pct') + K('manual_pay_borrower_discount_points')) if (EXISTS('finance', status='active', autopay_enrolled=False) and exchange_returned_12m == 0) else P('shipping_fee_discount_pct'))"
      - exchange_plan_name: "CFIELD('warranty','variant_name', purchase_order_id=HID, sold_with_vehicle=True)"
      - exchange_plan_credit: "K('top_plan_credit_usd') if (exchange_plan_name == 'KestrelCare Platinum' or exchange_plan_name == 'KestrelCare Platinum Exclusionary') else (K('mid_plan_credit_usd') if (exchange_plan_name == 'KestrelCare Silver' or exchange_plan_name == 'KestrelCare Gold') else 0)"
      - exchange_title_service: "CFIELD('title','variant_name', purchase_order_id=HID)"
      - exchange_interstate_surcharge: "K('inspection_surcharge_usd') if exchange_title_service == 'Kestrel Out-of-State Registration with Inspection' else (K('out_of_state_surcharge_usd') if exchange_title_service == 'Kestrel Out-of-State Registration' else 0)"
      - exchange_fee_discounted: "RND(exchange_transport_price * (100 - exchange_discount_pct) / 100, 2)"
      - exchange_fee_adjusted: "MX(0, RND(exchange_fee_discounted + exchange_interstate_surcharge - exchange_plan_credit, 2))"
      - result: "0 if (P('exchange_shipping_fee_waived') or F('transfer_distance_miles') <= P('free_transfer_distance_miles')) else exchange_fee_adjusted"
    compute_basis:
      exchange_carry_funds: "The carry-over share of an exchange replacement is the money moved onto the replacement order by internal transfer from the returned order"
      exchange_price_charged: "as a percentage of the vehicle price charged on the replacement order net of any reversal of that price"
      exchange_carry_share: "as a percentage of the vehicle price charged on the replacement order net of any reversal of that price, rounded half up to two decimal places"
      exchange_courtesy_miles: "twice the program's free transfer distance when the carry-over share is at least the high carry-over share, the program's free transfer distance when it is at least the low carry-over share but below the high carry-over share, and no courtesy miles when it is below the low carry-over share"
      exchange_pricing_distance: "which are taken off the transfer distance before the exchange replacement shipping fee is priced"
      exchange_band: "the shipping bands run from the first band, for distances up to the first band limit, through the second and third bands, for distances up to the second and third band limits, to the fourth band, for distances above the third band limit"
      exchange_band_fee: "the band fee of the band the exchange pricing distance falls in"
      exchange_lead_days: "The handover lead time of an exchange replacement is the number of calendar days from the replacement order's signing date to the date of the handover appointment currently scheduled for it."
      exchange_transport_price: "for a lead time of no more than the rush lead days the transport price is the exchange pricing distance times the rush per-mile rate, with no band fee; for a lead time above the rush lead days and no more than the priority lead days it is the higher of the band fee of the band the exchange pricing distance falls in and the exchange pricing distance times the priority per-mile rate; for a longer lead time it is the band fee of the band the exchange pricing distance falls in; each per-mile product is rounded half up to the cent"
      exchange_returned_12m: "with no payment returned on any of the buyer's Kestrel Auto Finance contracts within the twelve whole months before today"
      exchange_discount_pct: "The discount applied to the exchange transport price is the program's shipping fee discount, except that a buyer who holds an active Kestrel Auto Finance contract enrolled in autopay, with no payment returned on any of the buyer's Kestrel Auto Finance contracts within the twelve whole months before today, receives the program's discount plus the autopay borrower discount points, and a buyer who holds an active Kestrel Auto Finance contract not enrolled in autopay, with no payment returned within those twelve whole months, receives the program's discount plus the manual-pay borrower discount points"
      exchange_plan_name: "A KestrelCare service contract sold with the replacement vehicle earns a protection plan credit against the exchange replacement shipping fee"
      exchange_plan_credit: "the top-plan credit for KestrelCare Platinum or KestrelCare Platinum Exclusionary, the mid-plan credit for KestrelCare Silver or KestrelCare Gold, and no credit for any other plan or when no plan was sold with the vehicle"
      exchange_title_service: "A replacement registered through an out-of-state title service carries an interstate surcharge on the exchange replacement shipping fee"
      exchange_interstate_surcharge: "the inspection surcharge when the replacement's title order service is Kestrel Out-of-State Registration with Inspection, the out-of-state surcharge when it is Kestrel Out-of-State Registration, and no surcharge for any other service"
      exchange_fee_discounted: "then that transport price reduced by the applicable discount percentage and rounded half up to the cent"
      exchange_fee_adjusted: "the interstate surcharge is then added to that discounted price and the protection plan credit subtracted from it, and the result is never below zero"
      result: "No exchange replacement shipping fee is owed when the transfer distance is no more than the program's free transfer distance or when the program waives the exchange shipping fee."
    factors:
      - id: carry_over_courtesy_miles
        effect: parameter
        decides: exchange_courtesy_miles
        bindings: [exchange_carry_funds, exchange_price_charged, exchange_carry_share, exchange_courtesy_miles]
        ladder:
          - when: "the carry-over share is at least the high carry-over share"
            value: "twice P('free_transfer_distance_miles') courtesy miles"
          - when: "the carry-over share is at least the low carry-over share but below the high carry-over share"
            value: "P('free_transfer_distance_miles') courtesy miles"
          - when: "otherwise (the carry-over share is below the low carry-over share)"
            value: "no courtesy miles"
        baseline:
          exchange_courtesy_miles: "0"
        evidence: [history]
        cross_difficulty: null
      - id: expedited_exchange_transport_pricing
        effect: method
        decides: exchange_transport_price
        bindings: [exchange_lead_days, exchange_transport_price]
        ladder:
          - when: "the handover lead time is no more than the rush lead days"
            method: "the transport price is the exchange pricing distance times K('rush_per_mile_usd') (per-mile pricing, no band fee), rounded half up to the cent"
          - when: "the handover lead time is above the rush lead days and no more than the priority lead days"
            method: "the transport price is the higher of the band fee of the exchange pricing distance's band and that distance times K('priority_per_mile_usd'), rounded half up to the cent"
          - when: "otherwise (the handover lead time is above the priority lead days)"
            method: "the transport price is the band fee of the exchange pricing distance's band"
        baseline:
          exchange_transport_price: "exchange_band_fee"
        evidence: [date, cross_category]
        cross_difficulty: delivery
      - id: borrower_shipping_discount
        effect: parameter
        decides: exchange_discount_pct
        bindings: [exchange_returned_12m, exchange_discount_pct]
        ladder:
          - when: "the buyer holds an active Kestrel Auto Finance contract enrolled in autopay and no payment on any of the buyer's Kestrel Auto Finance contracts was returned within the twelve whole months before today"
            value: "the program's shipping fee discount plus K('autopay_borrower_discount_points'), at most one hundred percent"
          - when: "the buyer holds an active Kestrel Auto Finance contract not enrolled in autopay and no payment was returned within those twelve whole months"
            value: "the program's shipping fee discount plus K('manual_pay_borrower_discount_points'), at most one hundred percent"
          - when: "otherwise"
            value: "P('shipping_fee_discount_pct')"
        baseline:
          exchange_discount_pct: "P('shipping_fee_discount_pct')"
        evidence: [cross_category, history]
        cross_difficulty: finance
      - id: protection_plan_shipping_credit
        effect: parameter
        decides: exchange_plan_credit
        bindings: [exchange_plan_name, exchange_plan_credit]
        ladder:
          - when: "the KestrelCare service contract sold with the replacement vehicle is KestrelCare Platinum or KestrelCare Platinum Exclusionary"
            value: "K('top_plan_credit_usd')"
          - when: "the KestrelCare service contract sold with the replacement vehicle is KestrelCare Silver or KestrelCare Gold"
            value: "K('mid_plan_credit_usd')"
          - when: "otherwise (another plan, or no plan sold with the vehicle)"
            value: "0"
        baseline:
          exchange_plan_credit: "0"
        evidence: [cross_category]
        cross_difficulty: warranty
      - id: interstate_shipping_surcharge
        effect: parameter
        decides: exchange_interstate_surcharge
