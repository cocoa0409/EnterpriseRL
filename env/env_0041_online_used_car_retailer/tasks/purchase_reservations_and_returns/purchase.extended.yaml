      card_collection_method: "The collection adjustment follows how the vehicle is collected at the order's handover appointment"
      card_collection_adjustment: "the card allowance rises by the staffed-pickup uplift for a Kestrel Hub Pickup, falls by the contactless reduction for a Kestrel Vending Tower Pickup, and is unchanged for any other appointment"
      card_reschedules: "The reschedule reduction follows the customer's own reschedules of the order's handover appointment"
      card_reschedule_reduction: "the repeat-reschedule reduction when the customer has rescheduled the appointment two or more times, the single-reschedule reduction when the customer has rescheduled it once, and no reduction when the customer has not rescheduled it"
      card_allowance: "The card allowance is the card allowance basis plus the standing uplift and the collection adjustment, less the reschedule reduction"
      card_room: "the card room is that card allowance less the card money already on the order, never below zero"
      result: "the debit-card payment is the lesser of the balance due and that card room, rounded half up to the cent"
    factors:
      - id: ticket_size_card_allowance
        effect: method
        decides: card_allowance_basis
        bindings: [card_ticket_size, card_allowance_basis]
        ladder:
          - when: "the ticket size is at or above the high ticket size"
            method: "the card allowance basis is the larger of the program's card payment cap and the high ticket share of the ticket size, rounded half up to the cent"
          - when: "the ticket size is at or above the middle ticket size but below the high ticket size"
            method: "the card allowance basis is the larger of the program's card payment cap and the middle ticket share of the ticket size, rounded half up to the cent"
          - when: "otherwise (the ticket size is below the middle ticket size)"
            method: "the card allowance basis is the program's card payment cap"
        baseline:
