        second and third bands, for distances up to the second and third band limits, to the fourth band, for
        distances above the third band limit. No exchange replacement shipping fee is owed when the transfer
        distance is no more than the program's free transfer distance or when the program waives the exchange
        shipping fee.
      params: [band_1_max_miles, band_2_max_miles, band_3_max_miles, band_1_fee_usd, band_2_fee_usd, band_3_fee_usd, band_4_fee_usd, shipping_fee_discount_pct, free_transfer_distance_miles, exchange_shipping_fee_waived]
