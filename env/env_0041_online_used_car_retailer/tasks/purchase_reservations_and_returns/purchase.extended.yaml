  # ---------------------------------------------------------------- task 1
  - id: purchase_ext_transfer_shipping_fee
    base_policy_refs: [purchase_agreement_charges, purchase_return_settlement]
    overwrite:
      - base_policy: purchase_agreement_charges
        superseded_clause: >-
          a shipping fee equal to the distance-band fee for the full transfer distance reduced by the program's
          shipping fee discount, rounded to the cent
        replaced_by: >-
          The transfer shipping fee is worked out in this order: first the carrier price for the full transfer
          distance, then that carrier price reduced by the program's shipping fee discount and rounded half up to
          the cent
    trigger: state_due
    subject: [purchase_charge_posted]
    computes: amount
    target_tool: post_transfer_shipping_fee_29e5e50b
    params:
      band_1_max_miles: 500
      band_2_max_miles: 1000
      band_3_max_miles: 1500
      band_1_fee_usd: 499.00
      band_2_fee_usd: 799.00
      band_3_fee_usd: 1099.00
      band_4_fee_usd: 1490.00
      white_glove_enclosed_per_mile_usd: 1.95
      enclosed_per_mile_usd: 1.65
      rush_transport_days: 3
      expedited_transport_days: 7
      rush_transport_surcharge_usd: 120.00
      expedited_transport_surcharge_usd: 65.00
      high_cargo_value_usd: 50000.00
      mid_cargo_value_usd: 35000.00
      high_value_cargo_surcharge_usd: 95.00
      mid_value_cargo_surcharge_usd: 57.50
      interstate_inspection_surcharge_usd: 70.00
      interstate_surcharge_usd: 45.00
      prime_financing_credit_usd: 90.00
      near_prime_financing_credit_usd: 50.00
      home_backhaul_credit_usd: 125.00
      hub_backhaul_credit_usd: 40.00
    rule: >-
      The transfer shipping fee is the charge for transporting the vehicle of a signed order that is not an
      exchange replacement from its hub to the buyer's market; it is owed when the transfer distance exceeds the
      program's free transfer distance and is posted on the order on its signing date. The standard transfer
      shipping fee is the band fee of the shipping band that the full transfer distance falls in, reduced by
      the program's shipping fee discount and rounded half up to the cent; the shipping bands run from the first
      band, for distances up to the first band limit, through the second and third bands, for distances up to
      the second and third band limits, to the fourth band, for distances above the third band limit. No
      transfer shipping fee is owed when the transfer distance is no more than the program's free transfer
      distance. A Kestrel Premium Certified or Kestrel Factory Certified vehicle travels in an enclosed carrier,
      which is priced by the mile rather than by band: when such a vehicle is handed over by Kestrel Enclosed
      White-Glove Delivery the carrier price is the full transfer distance times the white-glove enclosed
      per-mile rate, with no band fee; when it is handed over at any other appointment the carrier price is the
      higher of the band fee and the full transfer distance times the enclosed per-mile rate; a vehicle of any
      other program, or one with no handover appointment, travels on an open carrier whose price is the band
      fee; each per-mile product is rounded half up to the cent. The transport lead time of an order is the
      number of calendar days from its signing date to the date of the handover appointment currently scheduled
      for it; a transport lead time of no more than the rush transport days adds the rush transport surcharge
      to the transfer shipping fee, one above the rush transport days and no more than the expedited transport
      days adds the expedited transport surcharge, and a longer one adds no lead-time surcharge. A cargo value
      surcharge is added to the transfer shipping fee from the vehicle price charged on the order net of any
      reversal: the high-value cargo surcharge at or above the high cargo value, the mid-value cargo surcharge
      at or above the mid cargo value but below the high cargo value, and none below the mid cargo value. An
      order registered through an out-of-state title service carries an interstate transport surcharge on the
      transfer shipping fee: the interstate inspection surcharge when the order's title order service is
      Kestrel Out-of-State Registration with Inspection, the interstate surcharge when it is Kestrel
      Out-of-State Registration, and none for any other service. An order financed through Kestrel Auto Finance
      earns a financing transport credit against the transfer shipping fee: the prime financing credit when its
      Kestrel Auto Finance contract is at Tier A or Tier A+, the near-prime financing credit when it is at Tier
      B or Tier C, and no credit at any other tier or when the order is not financed through Kestrel Auto
      Finance. A trade-in collected by the delivery truck earns a back-haul credit against the transfer shipping
      fee: the home back-haul credit when an accepted trade-in agreement is linked to the order and the order's
      handover appointment is a Kestrel Local Home Delivery or a Kestrel Extended-Zone Delivery, the hub
      back-haul credit when an accepted trade-in agreement is linked to the order and the appointment is a
      Kestrel Hub Pickup or a Kestrel Vending Tower Pickup, and no credit otherwise. The transfer shipping fee
      is worked out in this order: first the carrier price for the full transfer distance, then that carrier
      price reduced by the program's shipping fee discount and rounded half up to the cent; the lead-time
      surcharge, the cargo value surcharge and the interstate transport surcharge are then added to that
      discounted price and the financing transport credit and the back-haul credit subtracted from it, and the
      result is never below zero.
    prerequisite: []
    cross_category:
      - category: delivery
        as: branch
        reads: [scheduled_date, variant_name]
        note: The transport lead time, enclosed carrier and back-haul ladders read the order's handover appointment.
      - category: title
        as: branch
        reads: [variant_name]
        note: The interstate transport surcharge ladder reads the order's title service.
      - category: finance
        as: branch
        reads: [variant_name]
        note: The financing transport credit ladder reads the tier of the order's Kestrel Auto Finance contract.
      - category: tradein
        as: existence
        reads: [status, purchase_order_id]
        note: The back-haul credit ladder reads whether an accepted trade-in agreement is linked to the order.
    compute:
      - transfer_band: "1 if F('transfer_distance_miles') <= K('band_1_max_miles') else (2 if F('transfer_distance_miles') <= K('band_2_max_miles') else (3 if F('transfer_distance_miles') <= K('band_3_max_miles') else 4))"
      - transfer_band_fee: "K('band_1_fee_usd') if transfer_band == 1 else (K('band_2_fee_usd') if transfer_band == 2 else (K('band_3_fee_usd') if transfer_band == 3 else K('band_4_fee_usd')))"
      - transfer_handover_method: "CFIELD('delivery','variant_name', purchase_order_id=HID)"
      - transfer_carrier_price: "RND(F('transfer_distance_miles') * K('white_glove_enclosed_per_mile_usd'), 2) if ((F('variant_name') == 'Kestrel Premium Certified' or F('variant_name') == 'Kestrel Factory Certified') and transfer_handover_method == 'Kestrel Enclosed White-Glove Delivery') else (MX(transfer_band_fee, RND(F('transfer_distance_miles') * K('enclosed_per_mile_usd'), 2)) if ((F('variant_name') == 'Kestrel Premium Certified' or F('variant_name') == 'Kestrel Factory Certified') and transfer_handover_method != None and transfer_handover_method != 'Kestrel Enclosed White-Glove Delivery') else transfer_band_fee)"
      - transfer_fee_discounted: "RND(transfer_carrier_price * (100 - P('shipping_fee_discount_pct')) / 100, 2)"
      - transfer_lead_days: "DAYS(F('contract_signed_date'), CFIELD('delivery','scheduled_date', purchase_order_id=HID))"
      - transfer_lead_surcharge: "K('rush_transport_surcharge_usd') if transfer_lead_days <= K('rush_transport_days') else (K('expedited_transport_surcharge_usd') if transfer_lead_days <= K('expedited_transport_days') else 0)"
      - transfer_cargo_value: "SUM('purchase_transactions','amount', event_type='purchase_charge_posted', charge_type='vehicle_price') - SUM('purchase_transactions','amount', event_type='purchase_charge_reversed', charge_type='vehicle_price')"
      - transfer_cargo_surcharge: "K('high_value_cargo_surcharge_usd') if transfer_cargo_value >= K('high_cargo_value_usd') else (K('mid_value_cargo_surcharge_usd') if transfer_cargo_value >= K('mid_cargo_value_usd') else 0)"
      - transfer_title_service: "CFIELD('title','variant_name', purchase_order_id=HID)"
      - transfer_interstate_surcharge: "K('interstate_inspection_surcharge_usd') if transfer_title_service == 'Kestrel Out-of-State Registration with Inspection' else (K('interstate_surcharge_usd') if transfer_title_service == 'Kestrel Out-of-State Registration' else 0)"
      - transfer_finance_tier: "CFIELD('finance','variant_name', purchase_order_id=HID)"
      - transfer_financing_credit: "K('prime_financing_credit_usd') if (transfer_finance_tier == 'Kestrel Finance Tier A' or transfer_finance_tier == 'Kestrel Finance Tier A+') else (K('near_prime_financing_credit_usd') if (transfer_finance_tier == 'Kestrel Finance Tier B' or transfer_finance_tier == 'Kestrel Finance Tier C') else 0)"
      - transfer_trade_linked: "EXISTS('tradein', purchase_order_id=HID, status='accepted')"
      - transfer_backhaul_credit: "K('home_backhaul_credit_usd') if (transfer_trade_linked and (transfer_handover_method == 'Kestrel Local Home Delivery' or transfer_handover_method == 'Kestrel Extended-Zone Delivery')) else (K('hub_backhaul_credit_usd') if (transfer_trade_linked and (transfer_handover_method == 'Kestrel Hub Pickup' or transfer_handover_method == 'Kestrel Vending Tower Pickup')) else 0)"
      - transfer_fee_adjusted: "MX(0, RND(transfer_fee_discounted + transfer_lead_surcharge + transfer_cargo_surcharge + transfer_interstate_surcharge - transfer_financing_credit - transfer_backhaul_credit, 2))"
      - result: "0 if F('transfer_distance_miles') <= P('free_transfer_distance_miles') else transfer_fee_adjusted"
    compute_basis:
      transfer_band: "the shipping bands run from the first band, for distances up to the first band limit, through the second and third bands, for distances up to the second and third band limits, to the fourth band, for distances above the third band limit"
      transfer_band_fee: "The standard transfer shipping fee is the band fee of the shipping band that the full transfer distance falls in"
      transfer_handover_method: "when such a vehicle is handed over by Kestrel Enclosed White-Glove Delivery"
      transfer_carrier_price: "when such a vehicle is handed over by Kestrel Enclosed White-Glove Delivery the carrier price is the full transfer distance times the white-glove enclosed per-mile rate, with no band fee; when it is handed over at any other appointment the carrier price is the higher of the band fee and the full transfer distance times the enclosed per-mile rate; a vehicle of any other program, or one with no handover appointment, travels on an open carrier whose price is the band fee; each per-mile product is rounded half up to the cent"
      transfer_fee_discounted: "then that carrier price reduced by the program's shipping fee discount and rounded half up to the cent"
      transfer_lead_days: "The transport lead time of an order is the number of calendar days from its signing date to the date of the handover appointment currently scheduled for it"
      transfer_lead_surcharge: "a transport lead time of no more than the rush transport days adds the rush transport surcharge to the transfer shipping fee, one above the rush transport days and no more than the expedited transport days adds the expedited transport surcharge, and a longer one adds no lead-time surcharge"
      transfer_cargo_value: "A cargo value surcharge is added to the transfer shipping fee from the vehicle price charged on the order net of any reversal"
      transfer_cargo_surcharge: "the high-value cargo surcharge at or above the high cargo value, the mid-value cargo surcharge at or above the mid cargo value but below the high cargo value, and none below the mid cargo value"
      transfer_title_service: "An order registered through an out-of-state title service carries an interstate transport surcharge on the transfer shipping fee"
      transfer_interstate_surcharge: "the interstate inspection surcharge when the order's title order service is Kestrel Out-of-State Registration with Inspection, the interstate surcharge when it is Kestrel Out-of-State Registration, and none for any other service"
      transfer_finance_tier: "An order financed through Kestrel Auto Finance earns a financing transport credit against the transfer shipping fee"
      transfer_financing_credit: "the prime financing credit when its Kestrel Auto Finance contract is at Tier A or Tier A+, the near-prime financing credit when it is at Tier B or Tier C, and no credit at any other tier or when the order is not financed through Kestrel Auto Finance"
      transfer_trade_linked: "A trade-in collected by the delivery truck earns a back-haul credit against the transfer shipping fee"
      transfer_backhaul_credit: "the home back-haul credit when an accepted trade-in agreement is linked to the order and the order's handover appointment is a Kestrel Local Home Delivery or a Kestrel Extended-Zone Delivery, the hub back-haul credit when an accepted trade-in agreement is linked to the order and the appointment is a Kestrel Hub Pickup or a Kestrel Vending Tower Pickup, and no credit otherwise"
      transfer_fee_adjusted: "the lead-time surcharge, the cargo value surcharge and the interstate transport surcharge are then added to that discounted price and the financing transport credit and the back-haul credit subtracted from it, and the result is never below zero"
      result: "No transfer shipping fee is owed when the transfer distance is no more than the program's free transfer distance."
    factors:
      - id: enclosed_carrier_pricing
        effect: method
        decides: transfer_carrier_price
        bindings: [transfer_handover_method, transfer_carrier_price]
        ladder:
          - when: "the vehicle is Kestrel Premium Certified or Kestrel Factory Certified and is handed over by Kestrel Enclosed White-Glove Delivery"
            method: "the carrier price is the full transfer distance times K('white_glove_enclosed_per_mile_usd') (per-mile pricing, no band fee), rounded half up to the cent"
          - when: "the vehicle is Kestrel Premium Certified or Kestrel Factory Certified and is handed over at any other appointment"
            method: "the carrier price is the higher of the band fee and the full transfer distance times K('enclosed_per_mile_usd'), rounded half up to the cent"
          - when: "otherwise (any other program, or no handover appointment)"
            method: "the carrier price is the band fee of the full transfer distance (open carrier)"
        baseline:
          transfer_carrier_price: "transfer_band_fee"
        evidence: [tier_param, cross_category]
        cross_difficulty: delivery
      - id: transport_lead_time_surcharge
        effect: parameter
        decides: transfer_lead_surcharge
        bindings: [transfer_lead_days, transfer_lead_surcharge]
        ladder:
          - when: "the transport lead time is no more than the rush transport days"
            value: "K('rush_transport_surcharge_usd')"
          - when: "the transport lead time is above the rush transport days and no more than the expedited transport days"
            value: "K('expedited_transport_surcharge_usd')"
          - when: "otherwise (a longer transport lead time)"
            value: "0"
        baseline:
          transfer_lead_surcharge: "0"
        evidence: [date, cross_category]
        cross_difficulty: delivery
      - id: cargo_value_surcharge
        effect: parameter
        decides: transfer_cargo_surcharge
        bindings: [transfer_cargo_value, transfer_cargo_surcharge]
        ladder:
          - when: "the vehicle price charged on the order is at or above the high cargo value"
            value: "K('high_value_cargo_surcharge_usd')"
          - when: "the vehicle price charged is at or above the mid cargo value but below the high cargo value"
            value: "K('mid_value_cargo_surcharge_usd')"
          - when: "otherwise (below the mid cargo value)"
            value: "0"
        baseline:
          transfer_cargo_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: interstate_transport_surcharge
        effect: parameter
        decides: transfer_interstate_surcharge
        bindings: [transfer_title_service, transfer_interstate_surcharge]
        ladder:
          - when: "the order's title order service is Kestrel Out-of-State Registration with Inspection"
            value: "K('interstate_inspection_surcharge_usd')"
          - when: "the order's title order service is Kestrel Out-of-State Registration"
            value: "K('interstate_surcharge_usd')"
          - when: "otherwise (any other title service)"
            value: "0"
        baseline:
          transfer_interstate_surcharge: "0"
        evidence: [cross_category]
        cross_difficulty: title
      - id: financing_transport_credit
        effect: parameter
        decides: transfer_financing_credit
        bindings: [transfer_finance_tier, transfer_financing_credit]
        ladder:
          - when: "the order's Kestrel Auto Finance contract is at Tier A or Tier A+"
            value: "K('prime_financing_credit_usd')"
          - when: "the order's Kestrel Auto Finance contract is at Tier B or Tier C"
            value: "K('near_prime_financing_credit_usd')"
          - when: "otherwise (another tier, or not financed through Kestrel Auto Finance)"
            value: "0"
        baseline:
          transfer_financing_credit: "0"
        evidence: [cross_category]
        cross_difficulty: finance
      - id: trade_backhaul_credit
        effect: parameter
        decides: transfer_backhaul_credit
        bindings: [transfer_trade_linked, transfer_backhaul_credit]
        ladder:
          - when: "an accepted trade-in agreement is linked to the order and the handover appointment is a Kestrel Local Home Delivery or a Kestrel Extended-Zone Delivery"
            value: "K('home_backhaul_credit_usd')"
          - when: "an accepted trade-in agreement is linked to the order and the handover appointment is a Kestrel Hub Pickup or a Kestrel Vending Tower Pickup"
            value: "K('hub_backhaul_credit_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          transfer_backhaul_credit: "0"
        evidence: [cross_category]
        cross_difficulty: tradein
    baseline:
      rule: >-
        The standard transfer shipping fee is the band fee of the shipping band that the full transfer distance
        falls in, reduced by the program's shipping fee discount and rounded half up to the cent; the shipping
        bands run from the first band, for distances up to the first band limit, through the second and third
        bands, for distances up to the second and third band limits, to the fourth band, for distances above the
        third band limit. No transfer shipping fee is owed when the transfer distance is no more than the
        program's free transfer distance.
      params: [band_1_max_miles, band_2_max_miles, band_3_max_miles, band_1_fee_usd, band_2_fee_usd, band_3_fee_usd, band_4_fee_usd, shipping_fee_discount_pct, free_transfer_distance_miles]
    inputs:
      history:
        - {table: purchase_transactions, aggregate: sum, field: amount, filters: {event_type: purchase_charge_posted, charge_type: vehicle_price}}
        - {table: purchase_transactions, aggregate: sum, field: amount, filters: {event_type: purchase_charge_reversed, charge_type: vehicle_price}}
      cross_category: [delivery, title, finance, tradein]
  - id: purchase_ext_documentation_fee
    base_policy_refs: [purchase_agreement_charges, purchase_return_settlement]
    overwrite:
      - base_policy: purchase_agreement_charges
        superseded_clause: >-
          the documentation fee for the selling dealer state from the program's documentation fee table
        replaced_by: >-
          The documentation fee is the documentation fee base plus the financing documentation charge, the trade
          documentation charge, the product forms charge and the courier charge, rounded half up to the cent.
    trigger: state_due
    subject: [purchase_charge_posted]
    computes: amount
    target_tool: post_documentation_fee_307ebcc3
    params:
      table_fee_az_usd: 499.00
      table_fee_tx_usd: 225.00
      table_fee_ga_usd: 599.00
      table_fee_fl_usd: 999.00
      table_fee_nc_usd: 699.00
      table_fee_oh_usd: 387.00
      table_fee_pa_usd: 477.00
      table_fee_co_usd: 699.00
      unverified_stipulation_docs_usd: 95.00
      standard_financing_docs_usd: 45.00
      lien_release_docs_usd: 60.00
      clear_title_docs_usd: 25.00
      two_product_forms_usd: 35.00
      one_product_forms_usd: 20.00
      long_route_courier_usd: 49.50
      local_courier_usd: 24.50
    rule: >-
      The documentation fee of a signed order that is not an exchange replacement is the charge for preparing its
      sale, title and registration paperwork, posted on the order on its signing date. An exchange replacement order is outside this rule: its documentation fee stays the table fee for the state of its selling Kestrel dealer license, with none of the charges below. The standard documentation fee is the fee that the documentation fee table sets for the state of the selling Kestrel
      dealer license. The table state for an order follows its title service: when the order's title order
      service is Kestrel Out-of-State Registration with Inspection the documentation fee base is the higher of
      the selling state's and the registration state's table fees, when it is Kestrel Out-of-State Registration
      the documentation fee base is the registration state's table fee, and for any other service it is the
      selling state's table fee. An order financed through Kestrel Auto Finance carries a financing
      documentation charge: the unverified-stipulation charge when its Kestrel Auto Finance contract is at Tier
      C, Tier D or Tier E and the verifications the approval requires before signing are not yet completed, the
      standard financing documentation charge when it is financed through Kestrel Auto Finance in any other
      case, and none when it is not financed through Kestrel Auto Finance. A trade-in linked to the order adds a
      trade documentation charge: the lien release charge when an accepted trade-in agreement linked to the
      order names a lienholder, the clear-title charge when an accepted trade-in agreement linked to the order
      names none, and none when no accepted trade-in agreement is linked. Protection products sold with the
      vehicle add a product forms charge: the two-product forms charge when a KestrelCare service contract was
      sold with the vehicle and a KestrelCare maintenance plan is on the order, the one-product forms charge
      when only one of the two is, and none when neither is. Originals signed at the buyer's address are
      couriered: the long-route courier charge when the order's handover appointment is a Kestrel Extended-Zone
      Delivery or a Kestrel Enclosed White-Glove Delivery, the local courier charge when it is a Kestrel Local
      Home Delivery, and none for any other appointment. The documentation fee is the documentation fee base
      plus the financing documentation charge, the trade documentation charge, the product forms charge and the
      courier charge, rounded half up to the cent.
    prerequisite: []
    cross_category:
      - category: title
        as: branch
        reads: [variant_name]
        note: The documentation fee base ladder reads the order's title service.
      - category: finance
        as: branch
        reads: [variant_name, stips_verified]
        note: The financing documentation charge ladder reads the tier and verification state of the order's Kestrel Auto Finance contract.
      - category: tradein
        as: branch
        reads: [status, lienholder_name]
        note: The trade documentation charge ladder reads the accepted trade-in agreement linked to the order and its lienholder.
      - category: warranty
        as: existence
        reads: [sold_with_vehicle]
        note: The product forms ladder reads whether a KestrelCare service contract was sold with the vehicle.
      - category: maintenance
        as: existence
        reads: [purchase_order_id]
        note: The product forms ladder reads whether a KestrelCare maintenance plan is on the order.
      - category: delivery
        as: branch
        reads: [variant_name]
        note: The courier charge ladder reads the order's handover appointment.
    compute:
      - doc_selling_table_fee: "K('table_fee_az_usd') if F('selling_dealer_state') == 'AZ' else (K('table_fee_tx_usd') if F('selling_dealer_state') == 'TX' else (K('table_fee_ga_usd') if F('selling_dealer_state') == 'GA' else (K('table_fee_fl_usd') if F('selling_dealer_state') == 'FL' else (K('table_fee_nc_usd') if F('selling_dealer_state') == 'NC' else (K('table_fee_oh_usd') if F('selling_dealer_state') == 'OH' else (K('table_fee_pa_usd') if F('selling_dealer_state') == 'PA' else K('table_fee_co_usd')))))))"
      - doc_registration_table_fee: "K('table_fee_az_usd') if F('registration_state') == 'AZ' else (K('table_fee_tx_usd') if F('registration_state') == 'TX' else (K('table_fee_ga_usd') if F('registration_state') == 'GA' else (K('table_fee_fl_usd') if F('registration_state') == 'FL' else (K('table_fee_nc_usd') if F('registration_state') == 'NC' else (K('table_fee_oh_usd') if F('registration_state') == 'OH' else (K('table_fee_pa_usd') if F('registration_state') == 'PA' else K('table_fee_co_usd')))))))"
      - doc_title_service: "CFIELD('title','variant_name', purchase_order_id=HID)"
      - doc_fee_base: "MX(doc_selling_table_fee, doc_registration_table_fee) if doc_title_service == 'Kestrel Out-of-State Registration with Inspection' else (doc_registration_table_fee if doc_title_service == 'Kestrel Out-of-State Registration' else doc_selling_table_fee)"
      - doc_finance_tier: "CFIELD('finance','variant_name', purchase_order_id=HID)"
      - doc_finance_stips: "CFIELD('finance','stips_verified', purchase_order_id=HID)"
      - doc_financing_charge: "K('unverified_stipulation_docs_usd') if ((doc_finance_tier == 'Kestrel Finance Tier C' or doc_finance_tier == 'Kestrel Finance Tier D' or doc_finance_tier == 'Kestrel Finance Tier E') and doc_finance_stips == False) else (K('standard_financing_docs_usd') if doc_finance_tier != None else 0)"
      - doc_trade_linked: "EXISTS('tradein', purchase_order_id=HID, status='accepted')"
      - doc_trade_lienholder: "CFIELD('tradein','lienholder_name', purchase_order_id=HID, status='accepted')"
      - doc_trade_charge: "K('lien_release_docs_usd') if (doc_trade_linked and doc_trade_lienholder != None and doc_trade_lienholder != '') else (K('clear_title_docs_usd') if doc_trade_linked else 0)"
      - doc_service_contract_sold: "EXISTS('warranty', purchase_order_id=HID, sold_with_vehicle=True)"
      - doc_maintenance_plan: "EXISTS('maintenance', purchase_order_id=HID)"
      - doc_product_forms: "K('two_product_forms_usd') if (doc_service_contract_sold and doc_maintenance_plan) else (K('one_product_forms_usd') if (doc_service_contract_sold or doc_maintenance_plan) else 0)"
      - doc_handover_method: "CFIELD('delivery','variant_name', purchase_order_id=HID)"
      - doc_courier_charge: "K('long_route_courier_usd') if (doc_handover_method == 'Kestrel Extended-Zone Delivery' or doc_handover_method == 'Kestrel Enclosed White-Glove Delivery') else (K('local_courier_usd') if doc_handover_method == 'Kestrel Local Home Delivery' else 0)"
      - result: "RND(doc_fee_base + doc_financing_charge + doc_trade_charge + doc_product_forms + doc_courier_charge, 2)"
    compute_basis:
      doc_selling_table_fee: "The standard documentation fee is the fee that the documentation fee table sets for the state of the selling Kestrel dealer license."
      doc_registration_table_fee: "when it is Kestrel Out-of-State Registration the documentation fee base is the registration state's table fee"
      doc_title_service: "The table state for an order follows its title service"
      doc_fee_base: "when the order's title order service is Kestrel Out-of-State Registration with Inspection the documentation fee base is the higher of the selling state's and the registration state's table fees, when it is Kestrel Out-of-State Registration the documentation fee base is the registration state's table fee, and for any other service it is the selling state's table fee"
      doc_finance_tier: "An order financed through Kestrel Auto Finance carries a financing documentation charge"
      doc_finance_stips: "the verifications the approval requires before signing are not yet completed"
      doc_financing_charge: "the unverified-stipulation charge when its Kestrel Auto Finance contract is at Tier C, Tier D or Tier E and the verifications the approval requires before signing are not yet completed, the standard financing documentation charge when it is financed through Kestrel Auto Finance in any other case, and none when it is not financed through Kestrel Auto Finance"
      doc_trade_linked: "A trade-in linked to the order adds a trade documentation charge"
      doc_trade_lienholder: "when an accepted trade-in agreement linked to the order names a lienholder"
      doc_trade_charge: "the lien release charge when an accepted trade-in agreement linked to the order names a lienholder, the clear-title charge when an accepted trade-in agreement linked to the order names none, and none when no accepted trade-in agreement is linked"
      doc_service_contract_sold: "when a KestrelCare service contract was sold with the vehicle"
      doc_maintenance_plan: "and a KestrelCare maintenance plan is on the order"
      doc_product_forms: "the two-product forms charge when a KestrelCare service contract was sold with the vehicle and a KestrelCare maintenance plan is on the order, the one-product forms charge when only one of the two is, and none when neither is"
      doc_handover_method: "Originals signed at the buyer's address are couriered"
      doc_courier_charge: "the long-route courier charge when the order's handover appointment is a Kestrel Extended-Zone Delivery or a Kestrel Enclosed White-Glove Delivery, the local courier charge when it is a Kestrel Local Home Delivery, and none for any other appointment"
      result: "The documentation fee is the documentation fee base plus the financing documentation charge, the trade documentation charge, the product forms charge and the courier charge, rounded half up to the cent."
    factors:
      - id: title_service_fee_base
        effect: method
        decides: doc_fee_base
        bindings: [doc_title_service, doc_fee_base]
        ladder:
          - when: "the order's title order service is Kestrel Out-of-State Registration with Inspection"
            method: "the documentation fee base is the higher of the selling state's and the registration state's table fees"
          - when: "the order's title order service is Kestrel Out-of-State Registration"
            method: "the documentation fee base is the registration state's table fee"
          - when: "otherwise (any other title service)"
            method: "the documentation fee base is the selling state's table fee"
        baseline:
          doc_fee_base: "doc_selling_table_fee"
        evidence: [cross_category]
        cross_difficulty: title
      - id: financing_documentation_charge
        effect: parameter
        decides: doc_financing_charge
        bindings: [doc_finance_tier, doc_finance_stips, doc_financing_charge]
        ladder:
          - when: "the order's Kestrel Auto Finance contract is at Tier C, Tier D or Tier E and its required verifications are not yet completed"
            value: "K('unverified_stipulation_docs_usd')"
          - when: "the order is financed through Kestrel Auto Finance in any other case"
            value: "K('standard_financing_docs_usd')"
          - when: "otherwise (not financed through Kestrel Auto Finance)"
            value: "0"
        baseline:
          doc_financing_charge: "0"
        evidence: [cross_category]
        cross_difficulty: finance
      - id: trade_documentation_charge
        effect: parameter
        decides: doc_trade_charge
        bindings: [doc_trade_linked, doc_trade_lienholder, doc_trade_charge]
        ladder:
          - when: "an accepted trade-in agreement linked to the order names a lienholder"
            value: "K('lien_release_docs_usd')"
          - when: "an accepted trade-in agreement linked to the order names no lienholder"
            value: "K('clear_title_docs_usd')"
          - when: "otherwise (no accepted trade-in agreement linked)"
            value: "0"
        baseline:
          doc_trade_charge: "0"
        evidence: [cross_category]
        cross_difficulty: tradein
      - id: protection_product_forms_charge
        effect: parameter
        decides: doc_product_forms
        bindings: [doc_service_contract_sold, doc_maintenance_plan, doc_product_forms]
        ladder:
          - when: "a KestrelCare service contract was sold with the vehicle and a KestrelCare maintenance plan is on the order"
            value: "K('two_product_forms_usd')"
          - when: "exactly one of the two is"
            value: "K('one_product_forms_usd')"
          - when: "otherwise (neither)"
            value: "0"
        baseline:
          doc_product_forms: "0"
        evidence: [cross_category]
        cross_difficulty: warranty
      - id: courier_charge
        effect: parameter
        decides: doc_courier_charge
        bindings: [doc_handover_method, doc_courier_charge]
        ladder:
          - when: "the order's handover appointment is a Kestrel Extended-Zone Delivery or a Kestrel Enclosed White-Glove Delivery"
            value: "K('long_route_courier_usd')"
          - when: "the order's handover appointment is a Kestrel Local Home Delivery"
            value: "K('local_courier_usd')"
          - when: "otherwise (any other appointment)"
            value: "0"
        baseline:
          doc_courier_charge: "0"
        evidence: [cross_category]
        cross_difficulty: delivery
    baseline:
      rule: >-
        The standard documentation fee is the fee that the documentation fee table sets for the state of the
        selling Kestrel dealer license.
      params: [table_fee_az_usd, table_fee_tx_usd, table_fee_ga_usd, table_fee_fl_usd, table_fee_nc_usd, table_fee_oh_usd, table_fee_pa_usd, table_fee_co_usd, documentation_fee_by_dealer_state]
    inputs:
      history: []
      cross_category: [title, finance, tradein, warranty, maintenance, delivery]
  - id: purchase_ext_finance_cash_down
    base_policy_refs: [purchase_payment_funding]
    overwrite:
      - base_policy: purchase_payment_funding
        superseded_clause: >-
          Combined debit-card and credit-card money on one order, deposit included, may not exceed the
          program's card payment cap; card money beyond the cap is refused and must come by ACH, wire or
          cashier's check.
        replaced_by: >-
          A buyer whose order is financed through Kestrel Auto Finance and whose finance contract is still only
          approved pays the cash down on the order from a bank account by ACH; card money does not pay the cash
          down.
    trigger: on_request
    subject: [purchase_payment_posted]
    computes: amount
    target_tool: pay_finance_down_payment_by_ach_50ed840f
    params:
      premium_low_tier_points: 5.0
      premium_mid_tier_points: 2.0
      repeat_min_installments: 6
      clean_repeat_points: 2.5
      recovered_repeat_points: 1.0
      rough_trade_share_pct: 75
      fair_trade_share_pct: 90
      deep_subprime_stipulation_cushion_usd: 400.00
      tier_c_stipulation_cushion_usd: 250.00
    rule: >-
      A buyer whose order is financed through Kestrel Auto Finance and whose finance contract is still only
      approved pays the cash down on the order from a bank account by ACH; card money does not pay the cash
      down. The standard cash down is the required down payment less the down payment credits, never below
      zero, rounded half up to the cent. The required down payment is the larger of the contract tier's minimum
      down payment in dollars and the tier's minimum down payment percentage of the vehicle price charged on the
      order net of any reversal, rounded half up to the cent. The down payment credits are the reservation
      deposit applied to the order and the equity of an accepted trade-in agreement linked to the order, which
      is its current offer less the latest payoff quote recorded on it, never below zero. The down payment
      percentage rises for a premium vehicle financed below Tier A: a Kestrel Premium Certified or Kestrel
      Factory Certified vehicle financed at Tier C, Tier D or Tier E adds the premium low-tier points, the same
      vehicle financed at Tier B adds the premium mid-tier points, and any other vehicle or tier adds none. A
      proven Kestrel Auto Finance borrower pays a lower percentage: when one of the buyer's Kestrel Auto Finance
      contracts is paid off, no payment on any of the buyer's contracts has ever been returned and at least the
      repeat minimum installments have been paid across the buyer's contracts, the percentage falls by the
      clean repeat points; when a contract is paid off and at least the repeat minimum installments have been
      paid but a payment has been returned, it falls by the recovered repeat points; otherwise it does not
      fall. A reservation deposit taken by credit card is borrowed money: on a contract at Tier C, Tier D or
      Tier E with any reservation deposit paid by credit card, the applied deposit does not count as a down
      payment credit; on a contract at Tier B with any reservation deposit paid by credit card, half the
      applied deposit counts, rounded half up to the cent; otherwise the applied deposit counts in full. Trade
      equity counts by the trade's condition grade: the equity of a Rough Condition Offer or an Inoperable
      Condition Offer counts at the rough trade share, the equity of a Fair Condition Offer counts at the fair
      trade share, each rounded half up to the cent, and the equity of any other grade counts in full. A stipulation cushion is added while the verifications the approval requires before signing are not yet completed: the deep-subprime cushion at Tier D or Tier E, the Tier C cushion at Tier C, and no cushion once the verifications are completed or at a tier whose approval requires no verification. Some agreement charges are not financed and
      are added to the cash down: at Tier D or Tier E the documentation fee, the shipping fee and the sales tax
      charged on the order, at Tier B or Tier C the documentation fee and the shipping fee, each net of any
      reversal, and at Tier A or Tier A+ none. The cash down is worked out in this order: the down payment percentage is the tier's minimum percentage plus the premium points less the repeat points, never below the tier's minimum percentage; the required
      down payment follows from that percentage; the down payment credits counted under these rules are
      subtracted from it, never below zero; then the stipulation cushion and the unfinanced charges are added,
      and the sum is rounded half up to the cent. On a Kestrel Auto Finance order that is not an exchange
      replacement, the cash down is not fixed until the order's money history carries the documentation fee
      entry owed on its signing date. On a Kestrel Auto Finance order that is not an exchange replacement, the
      cash down is not fixed until the order's money history carries the transfer shipping fee entry owed for
      transporting its vehicle.
    prerequisite:
      - problem: purchase_ext_documentation_fee
        kind: value_input
        gate: down_unfinanced_charges
        form: state
        policy_source: >-
          On a Kestrel Auto Finance order that is not an exchange replacement, the cash down is not fixed until
          the order's money history carries the documentation fee entry owed on its signing date.
        condition: >-
          The order's purchase_transactions carry the purchase_charge_posted entry with charge_type
          documentation_fee owed for its signing date.
        resolved_by: post_documentation_fee_307ebcc3
        effect: >-
          Once the documentation fee is posted, down_unfinanced_charges includes it at Tier B through Tier E,
          raising the cash down by the fee.
      - problem: purchase_ext_transfer_shipping_fee
        kind: value_input
        gate: down_unfinanced_charges
        form: state
        policy_source: >-
          On a Kestrel Auto Finance order that is not an exchange replacement, the cash down is not fixed until
          the order's money history carries the transfer shipping fee entry owed for transporting its vehicle.
        condition: >-
          Whenever a transfer shipping fee is owed (transfer distance above the program's free transfer
          distance), the order's purchase_transactions carry a purchase_charge_posted entry with charge_type
          shipping_fee for that transfer.
        resolved_by: post_transfer_shipping_fee_29e5e50b
        effect: >-
          Once the transfer shipping fee is posted, down_unfinanced_charges includes it at Tier B through Tier E,
          raising the cash down by the fee.
    cross_category:
      - category: finance
        as: history
        reads: [variant_name, status, stips_verified, min_down_payment_pct, min_down_payment_usd, finance_transactions.event_type]
        note: The tier, verification state and repayment history of the buyer's Kestrel Auto Finance contracts decide the premium points, repeat points, deposit credit, stipulation cushion and unfinanced charges.
      - category: tradein
        as: history
        reads: [variant_name, offer_amount, status, tradein_transactions.amount, tradein_transactions.event_type]
        note: The trade equity credit ladder reads the accepted trade-in's grade, offer and latest payoff quote.
    compute:
      - down_vehicle_price: "SUM('purchase_transactions','amount', event_type='purchase_charge_posted', charge_type='vehicle_price') - SUM('purchase_transactions','amount', event_type='purchase_charge_reversed', charge_type='vehicle_price')"
      - down_tier_pct: "CPARAM('finance','min_down_payment_pct', purchase_order_id=HID, status='approved')"
      - down_tier_floor: "CPARAM('finance','min_down_payment_usd', purchase_order_id=HID, status='approved')"
      - down_finance_tier: "CFIELD('finance','variant_name', purchase_order_id=HID, status='approved')"
      - down_premium_points: "K('premium_low_tier_points') if ((F('variant_name') == 'Kestrel Premium Certified' or F('variant_name') == 'Kestrel Factory Certified') and (down_finance_tier == 'Kestrel Finance Tier C' or down_finance_tier == 'Kestrel Finance Tier D' or down_finance_tier == 'Kestrel Finance Tier E')) else (K('premium_mid_tier_points') if ((F('variant_name') == 'Kestrel Premium Certified' or F('variant_name') == 'Kestrel Factory Certified') and down_finance_tier == 'Kestrel Finance Tier B') else 0)"
      - down_returned_ever: "XCOUNT('finance','finance_transactions', event_type='finance_payment_returned')"
      - down_installments_paid: "XCOUNT('finance','finance_transactions', event_type='finance_payment_posted')"
      - down_repeat_points: "K('clean_repeat_points') if (EXISTS('finance', status='paid_off') and down_returned_ever == 0 and down_installments_paid >= K('repeat_min_installments')) else (K('recovered_repeat_points') if (EXISTS('finance', status='paid_off') and down_returned_ever > 0 and down_installments_paid >= K('repeat_min_installments')) else 0)"
      - down_pct: "MX(down_tier_pct, down_tier_pct + down_premium_points - down_repeat_points)"
      - down_required: "MX(down_tier_floor, RND(down_vehicle_price * down_pct / 100, 2))"
      - down_card_deposit: "SUM('purchase_transactions','amount', event_type='purchase_deposit_paid', payment_channel='credit_card')"
      - down_deposit_applied: "SUM('purchase_transactions','amount', event_type='purchase_deposit_applied')"
      - down_deposit_credit: "0 if ((down_finance_tier == 'Kestrel Finance Tier C' or down_finance_tier == 'Kestrel Finance Tier D' or down_finance_tier == 'Kestrel Finance Tier E') and down_card_deposit > 0) else (RND(down_deposit_applied / 2, 2) if (down_finance_tier == 'Kestrel Finance Tier B' and down_card_deposit > 0) else down_deposit_applied)"
      - down_trade_id: "CFIELD('tradein','trade_in_id', purchase_order_id=HID, status='accepted')"
      - down_trade_offer: "CFIELD('tradein','offer_amount', purchase_order_id=HID, status='accepted')"
      - down_trade_payoff: "XLATEST('tradein','tradein_transactions','amount', date_field='txn_date', event_type='tradein_payoff_quote_recorded', trade_in_id=down_trade_id)"
      - down_trade_equity: "MX(0, RND(down_trade_offer - (down_trade_payoff or 0), 2)) if down_trade_offer != None else 0"
      - down_trade_grade: "CFIELD('tradein','variant_name', purchase_order_id=HID, status='accepted')"
      - down_trade_credit: "RND(down_trade_equity * K('rough_trade_share_pct') / 100, 2) if (down_trade_grade == 'Rough Condition Offer' or down_trade_grade == 'Inoperable Condition Offer') else (RND(down_trade_equity * K('fair_trade_share_pct') / 100, 2) if down_trade_grade == 'Fair Condition Offer' else down_trade_equity)"
      - down_required_cash: "MX(0, RND(down_required - down_deposit_credit - down_trade_credit, 2))"
      - down_stips_verified: "CFIELD('finance','stips_verified', purchase_order_id=HID, status='approved')"
      - down_stipulation_cushion: "K('deep_subprime_stipulation_cushion_usd') if ((down_finance_tier == 'Kestrel Finance Tier D' or down_finance_tier == 'Kestrel Finance Tier E') and down_stips_verified == False) else (K('tier_c_stipulation_cushion_usd') if (down_finance_tier == 'Kestrel Finance Tier C' and down_stips_verified == False) else 0)"
      - down_doc_fee: "SUM('purchase_transactions','amount', event_type='purchase_charge_posted', charge_type='documentation_fee') - SUM('purchase_transactions','amount', event_type='purchase_charge_reversed', charge_type='documentation_fee')"
      - down_shipping_fee: "SUM('purchase_transactions','amount', event_type='purchase_charge_posted', charge_type='shipping_fee') - SUM('purchase_transactions','amount', event_type='purchase_charge_reversed', charge_type='shipping_fee')"
      - down_sales_tax: "SUM('purchase_transactions','amount', event_type='purchase_charge_posted', charge_type='sales_tax') - SUM('purchase_transactions','amount', event_type='purchase_charge_reversed', charge_type='sales_tax')"
      - down_unfinanced_charges: "RND(down_doc_fee + down_shipping_fee + down_sales_tax, 2) if (down_finance_tier == 'Kestrel Finance Tier D' or down_finance_tier == 'Kestrel Finance Tier E') else (RND(down_doc_fee + down_shipping_fee, 2) if (down_finance_tier == 'Kestrel Finance Tier B' or down_finance_tier == 'Kestrel Finance Tier C') else 0)"
      - result: "RND(down_required_cash + down_stipulation_cushion + down_unfinanced_charges, 2)"
    compute_basis:
      down_vehicle_price: "the tier's minimum down payment percentage of the vehicle price charged on the order net of any reversal"
      down_tier_pct: "The required down payment is the larger of the contract tier's minimum down payment in dollars and the tier's minimum down payment percentage of the vehicle price charged on the order net of any reversal, rounded half up to the cent."
      down_tier_floor: "The required down payment is the larger of the contract tier's minimum down payment in dollars and the tier's minimum down payment percentage of the vehicle price charged on the order net of any reversal, rounded half up to the cent."
      down_finance_tier: "a Kestrel Premium Certified or Kestrel Factory Certified vehicle financed at Tier C, Tier D or Tier E adds the premium low-tier points"
      down_premium_points: "a Kestrel Premium Certified or Kestrel Factory Certified vehicle financed at Tier C, Tier D or Tier E adds the premium low-tier points, the same vehicle financed at Tier B adds the premium mid-tier points, and any other vehicle or tier adds none"
      down_returned_ever: "no payment on any of the buyer's contracts has ever been returned"
      down_installments_paid: "at least the repeat minimum installments have been paid across the buyer's contracts"
      down_repeat_points: "when one of the buyer's Kestrel Auto Finance contracts is paid off, no payment on any of the buyer's contracts has ever been returned and at least the repeat minimum installments have been paid across the buyer's contracts, the percentage falls by the clean repeat points; when a contract is paid off and at least the repeat minimum installments have been paid but a payment has been returned, it falls by the recovered repeat points; otherwise it does not fall"
      down_pct: "the down payment percentage is the tier's minimum percentage plus the premium points less the repeat points, never below the tier's minimum percentage"
      down_required: "the required down payment follows from that percentage"
      down_card_deposit: "with any reservation deposit paid by credit card"
      down_deposit_applied: "The down payment credits are the reservation deposit applied to the order"
      down_deposit_credit: "on a contract at Tier C, Tier D or Tier E with any reservation deposit paid by credit card, the applied deposit does not count as a down payment credit; on a contract at Tier B with any reservation deposit paid by credit card, half the applied deposit counts, rounded half up to the cent; otherwise the applied deposit counts in full"
      down_trade_id: "the equity of an accepted trade-in agreement linked to the order"
      down_trade_offer: "the equity of an accepted trade-in agreement linked to the order, which is its current offer less the latest payoff quote recorded on it, never below zero"
      down_trade_payoff: "its current offer less the latest payoff quote recorded on it"
      down_trade_equity: "the equity of an accepted trade-in agreement linked to the order, which is its current offer less the latest payoff quote recorded on it, never below zero"
      down_trade_grade: "Trade equity counts by the trade's condition grade"
      down_trade_credit: "the equity of a Rough Condition Offer or an Inoperable Condition Offer counts at the rough trade share, the equity of a Fair Condition Offer counts at the fair trade share, each rounded half up to the cent, and the equity of any other grade counts in full"
      down_required_cash: "the down payment credits counted under these rules are subtracted from it, never below zero"
      down_stips_verified: "while the verifications the approval requires before signing are not yet completed"
      down_stipulation_cushion: "the deep-subprime cushion at Tier D or Tier E, the Tier C cushion at Tier C, and no cushion once the verifications are completed or at a tier whose approval requires no verification"
      down_doc_fee: "the documentation fee and the shipping fee, each net of any reversal"
      down_shipping_fee: "the documentation fee and the shipping fee, each net of any reversal"
      down_sales_tax: "at Tier D or Tier E the documentation fee, the shipping fee and the sales tax charged on the order"
      down_unfinanced_charges: "at Tier D or Tier E the documentation fee, the shipping fee and the sales tax charged on the order, at Tier B or Tier C the documentation fee and the shipping fee, each net of any reversal, and at Tier A or Tier A+ none"
      result: "then the stipulation cushion and the unfinanced charges are added, and the sum is rounded half up to the cent"
    factors:
      - id: premium_vehicle_down_points
        effect: parameter
        decides: down_premium_points
        bindings: [down_finance_tier, down_premium_points]
        ladder:
          - when: "the vehicle is Kestrel Premium Certified or Kestrel Factory Certified and the contract is at Tier C, Tier D or Tier E"
            value: "K('premium_low_tier_points')"
          - when: "the vehicle is Kestrel Premium Certified or Kestrel Factory Certified and the contract is at Tier B"
            value: "K('premium_mid_tier_points')"
          - when: "otherwise"
            value: "0"
        baseline:
          down_premium_points: "0"
        evidence: [cross_category, tier_param]
        cross_difficulty: finance
      - id: repeat_borrower_down_points
        effect: parameter
        decides: down_repeat_points
        bindings: [down_returned_ever, down_installments_paid, down_repeat_points]
        ladder:
          - when: "a Kestrel Auto Finance contract of the buyer is paid off, no payment on any of the buyer's contracts has ever been returned and at least the repeat minimum installments have been paid"
            value: "K('clean_repeat_points')"
          - when: "a contract is paid off and at least the repeat minimum installments have been paid, but a payment has been returned"
            value: "K('recovered_repeat_points')"
          - when: "otherwise"
            value: "0"
        baseline:
          down_repeat_points: "0"
        evidence: [cross_category, history]
        cross_difficulty: finance
      - id: credit_card_deposit_credit
        effect: parameter
        decides: down_deposit_credit
        bindings: [down_card_deposit, down_deposit_applied, down_deposit_credit]
        ladder:
          - when: "the contract is at Tier C, Tier D or Tier E and a reservation deposit was paid by credit card"
            value: "0 (the applied deposit is left out of the down payment credits)"
          - when: "the contract is at Tier B and a reservation deposit was paid by credit card"
            value: "half the applied deposit, rounded half up to the cent"
          - when: "otherwise"
            value: "the applied deposit in full"
        baseline:
          down_deposit_credit: "down_deposit_applied"
        evidence: [history, cross_category]
        cross_difficulty: null
      - id: trade_grade_equity_share
        effect: parameter
        decides: down_trade_credit
        bindings: [down_trade_id, down_trade_offer, down_trade_payoff, down_trade_equity, down_trade_grade, down_trade_credit]
        ladder:
          - when: "the accepted trade-in is a Rough Condition Offer or an Inoperable Condition Offer"
            value: "the equity times K('rough_trade_share_pct') percent"
          - when: "the accepted trade-in is a Fair Condition Offer"
            value: "the equity times K('fair_trade_share_pct') percent"
          - when: "otherwise (any other grade)"
            value: "the equity in full"
        baseline:
          down_trade_credit: "down_trade_equity"
        evidence: [cross_category, history]
        cross_difficulty: tradein
      - id: stipulation_cushion
        effect: parameter
        decides: down_stipulation_cushion
        bindings: [down_stips_verified, down_stipulation_cushion]
        ladder:
          - when: "the required verifications are not yet completed and the contract is at Tier D or Tier E"
            value: "K('deep_subprime_stipulation_cushion_usd')"
          - when: "the required verifications are not yet completed and the contract is at Tier C"
            value: "K('tier_c_stipulation_cushion_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          down_stipulation_cushion: "0"
        evidence: [cross_category]
        cross_difficulty: finance
      - id: unfinanced_agreement_charges
        effect: method
        decides: down_unfinanced_charges
        bindings: [down_doc_fee, down_shipping_fee, down_sales_tax, down_unfinanced_charges]
        ladder:
          - when: "the contract is at Tier D or Tier E"
            method: "the documentation fee, the shipping fee and the sales tax charged on the order are added to the cash down"
          - when: "the contract is at Tier B or Tier C"
            method: "the documentation fee and the shipping fee charged on the order are added to the cash down"
          - when: "otherwise (Tier A or Tier A+)"
            method: "every agreement charge is financed and nothing is added"
        baseline:
          down_unfinanced_charges: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard cash down is the required down payment less the down payment credits, never below zero,
        rounded half up to the cent. The required down payment is the larger of the contract tier's minimum down
        payment in dollars and the tier's minimum down payment percentage of the vehicle price charged on the
        order net of any reversal, rounded half up to the cent. The down payment credits are the reservation
        deposit applied to the order and the equity of an accepted trade-in agreement linked to the order, which
        is its current offer less the latest payoff quote recorded on it, never below zero.
      params: []
    inputs:
      history:
        - {table: purchase_transactions, aggregate: sum, field: amount, filters: {event_type: purchase_charge_posted}}
        - {table: purchase_transactions, aggregate: sum, field: amount, filters: {event_type: purchase_deposit_applied}}
        - {category: finance, table: finance_transactions, aggregate: count, field: finance_txn_id, filters: {event_type: finance_payment_returned}}
        - {category: tradein, table: tradein_transactions, aggregate: latest, field: amount, filters: {event_type: tradein_payoff_quote_recorded, trade_in_id: the linked accepted trade-in}}
      cross_category: [finance, tradein]
