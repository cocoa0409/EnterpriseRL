  - id: purchase_ext_debit_card_payment
    base_policy_refs: [purchase_payment_funding]
    overwrite:
      - base_policy: purchase_payment_funding
        superseded_clause: >-
          Combined debit-card and credit-card money on one order, deposit included, may not exceed the
          program's card payment cap; card money beyond the cap is refused and must come by ACH, wire or
          cashier's check.
        replaced_by: >-
          Card money on an order paid in cash or through an outside lender may not exceed the order's card allowance, and card money on an order paid through Kestrel Auto Finance may not exceed the program's card payment cap, deposit included; card money beyond either limit is refused and must come by ACH, wire or cashier's check.
    trigger: on_request
    subject: [purchase_payment_posted]
    computes: amount
    target_tool: pay_order_by_debit_card_8f259234
    params:
      ticket_high_usd: 40000.00
      ticket_high_share_pct: 22.5
      ticket_middle_usd: 25000.00
      ticket_middle_share_pct: 19.5
      clean_history_uplift_usd: 1000.00
      recovered_history_uplift_usd: 500.00
      staffed_pickup_uplift_usd: 400.00
      contactless_reduction_usd: 500.00
      repeat_reschedule_reduction_usd: 500.00
      single_reschedule_reduction_usd: 250.00
    rule: >-
      A buyer whose order is paid in cash or through an outside lender may put a payment toward the order's
      balance on a debit card. The standard debit-card payment is the lesser of the order's balance due and
      the order's card room, rounded half up to the cent and never below zero. The balance due is every
      charge posted on the order less every charge reversal and every payment posted on it, plus every refund
      issued on it. The standard card room is the program's card payment cap less the card money already on
      the order, never below zero. Card money already on the order is every reservation deposit paid on the order by debit card or credit card and every payment received on the order by debit card or credit card, less every refund of such deposit or payment money sent back to a debit card or credit card. Card money on an order paid in cash or through an outside lender may not exceed the order's card allowance, and card money on an order paid through Kestrel Auto Finance may not exceed the program's card payment cap, deposit included; card money beyond either limit is refused and must come by ACH, wire or cashier's check. The card allowance stands in for the program's
      card payment cap and is built from the ticket size, the buyer's Kestrel Auto Finance standing and the
      order's handover appointment. The ticket size of an order is the vehicle price charged on it net of any
      reversal of that price. The card allowance basis follows the ticket size: at or above the high ticket
      size it is the larger of the program's card payment cap and the high ticket share of the ticket size;
      at or above the middle ticket size but below the high ticket size it is the larger of the program's
      card payment cap and the middle ticket share of the ticket size; below the middle ticket size it is the
      program's card payment cap; a ticket share is rounded half up to the cent. A standing uplift is added
      to the card allowance from the buyer's Kestrel Auto Finance history: the clean-history uplift when one
      of the buyer's Kestrel Auto Finance contracts is paid off and no payment on any of the buyer's Kestrel
      Auto Finance contracts has ever been returned; the recovered-history uplift when one of the buyer's
      contracts is paid off and payments have been returned, but none within the twelve whole months before
      today; no uplift otherwise. The collection adjustment follows how the vehicle is collected at the
      order's handover appointment: the card allowance rises by the staffed-pickup uplift for a Kestrel Hub
      Pickup, falls by the contactless reduction for a Kestrel Vending Tower Pickup, and is unchanged for any
      other appointment. The reschedule reduction follows the customer's own reschedules of the order's
      handover appointment: the repeat-reschedule reduction when the customer has rescheduled the appointment
      two or more times, the single-reschedule reduction when the customer has rescheduled it once, and no
      reduction when the customer has not rescheduled it. The card allowance is the card allowance basis plus
      the standing uplift and the collection adjustment, less the reschedule reduction; the card room is that
      card allowance less the card money already on the order, never below zero, and the debit-card payment
      is the lesser of the balance due and that card room, rounded half up to the cent. On an exchange
      replacement order, the debit-card payment toward the balance is fixed only after the order's money
      history carries the shipping fee entry owed for transporting the replacement vehicle.
    prerequisite:
      - problem: purchase_ext_exchange_shipping_fee
        kind: value_input
        gate: card_balance_due
        form: state
        policy_source: >-
          On an exchange replacement order, the debit-card payment toward the balance is fixed only after the
          order's money history carries the shipping fee entry owed for transporting the replacement vehicle.
        condition: >-
          Whenever an exchange replacement shipping fee is owed on the replacement order, its
          purchase_transactions carry a purchase_charge_posted entry with charge_type shipping_fee for the
          replacement's transfer.
        resolved_by: post_exchange_shipping_fee_0e49ee13
        effect: >-
          Once the exchange replacement shipping fee is posted, card_balance_due rises by that fee, and the
          debit-card payment becomes the lesser of the raised balance due and the card room.
    cross_category:
      - category: finance
        as: history
        reads: [status, finance_transactions.event_type, finance_transactions.txn_date]
        note: The standing uplift ladder reads whether a Kestrel Auto Finance contract of the buyer is paid off and when payments were returned.
      - category: delivery
        as: branch
        reads: [variant_name, reschedule_count]
        note: The collection adjustment and reschedule reduction ladders read the order's handover appointment.
    compute:
      - card_charges: "SUM('purchase_transactions','amount', event_type='purchase_charge_posted')"
      - card_charge_reversals: "SUM('purchase_transactions','amount', event_type='purchase_charge_reversed')"
      - card_payments: "SUM('purchase_transactions','amount', event_type='purchase_payment_posted')"
      - card_refunds: "SUM('purchase_transactions','amount', event_type='purchase_refund_issued')"
      - card_balance_due: "RND(card_charges - card_charge_reversals - card_payments + card_refunds, 2)"
      - card_money_in: "SUM('purchase_transactions','amount', event_type='purchase_deposit_paid', payment_channel='debit_card') + SUM('purchase_transactions','amount', event_type='purchase_deposit_paid', payment_channel='credit_card') + SUM('purchase_transactions','amount', event_type='purchase_payment_posted', payment_channel='debit_card') + SUM('purchase_transactions','amount', event_type='purchase_payment_posted', payment_channel='credit_card')"
      - card_money_out: "SUM('purchase_transactions','amount', event_type='purchase_refund_issued', payment_channel='debit_card') + SUM('purchase_transactions','amount', event_type='purchase_refund_issued', payment_channel='credit_card') + SUM('purchase_transactions','amount', event_type='purchase_deposit_refunded', payment_channel='debit_card') + SUM('purchase_transactions','amount', event_type='purchase_deposit_refunded', payment_channel='credit_card')"
      - card_money_on_order: "RND(card_money_in - card_money_out, 2)"
      - card_ticket_size: "SUM('purchase_transactions','amount', event_type='purchase_charge_posted', charge_type='vehicle_price') - SUM('purchase_transactions','amount', event_type='purchase_charge_reversed', charge_type='vehicle_price')"
      - card_allowance_basis: "MX(P('card_payment_cap_usd'), RND(card_ticket_size * K('ticket_high_share_pct') / 100, 2)) if card_ticket_size >= K('ticket_high_usd') else (MX(P('card_payment_cap_usd'), RND(card_ticket_size * K('ticket_middle_share_pct') / 100, 2)) if card_ticket_size >= K('ticket_middle_usd') else P('card_payment_cap_usd'))"
      - card_returned_ever: "XCOUNT('finance','finance_transactions', event_type='finance_payment_returned')"
      - card_returned_12m: "XCOUNT('finance','finance_transactions', within_months=12, date_field='txn_date', event_type='finance_payment_returned')"
      - card_standing_uplift: "K('clean_history_uplift_usd') if (EXISTS('finance', status='paid_off') and card_returned_ever == 0) else (K('recovered_history_uplift_usd') if (EXISTS('finance', status='paid_off') and card_returned_ever > 0 and card_returned_12m == 0) else 0)"
      - card_collection_method: "CFIELD('delivery','variant_name', purchase_order_id=HID)"
      - card_collection_adjustment: "K('staffed_pickup_uplift_usd') if card_collection_method == 'Kestrel Hub Pickup' else (0 - K('contactless_reduction_usd') if card_collection_method == 'Kestrel Vending Tower Pickup' else 0)"
      - card_reschedules: "CFIELD('delivery','reschedule_count', purchase_order_id=HID)"
      - card_reschedule_reduction: "K('repeat_reschedule_reduction_usd') if card_reschedules >= 2 else (K('single_reschedule_reduction_usd') if card_reschedules == 1 else 0)"
      - card_allowance: "RND(card_allowance_basis + card_standing_uplift + card_collection_adjustment - card_reschedule_reduction, 2)"
      - card_room: "MX(0, RND(card_allowance - card_money_on_order, 2))"
      - result: "MX(0, RND(MN(card_balance_due, card_room), 2))"
    compute_basis:
      card_charges: "The balance due is every charge posted on the order less every charge reversal and every payment posted on it, plus every refund issued on it."
      card_charge_reversals: "The balance due is every charge posted on the order less every charge reversal and every payment posted on it, plus every refund issued on it."
      card_payments: "The balance due is every charge posted on the order less every charge reversal and every payment posted on it, plus every refund issued on it."
      card_refunds: "The balance due is every charge posted on the order less every charge reversal and every payment posted on it, plus every refund issued on it."
      card_money_in: "Card money already on the order is every reservation deposit paid on the order by debit card or credit card and every payment received on the order by debit card or credit card"
      card_money_out: "less every refund of such deposit or payment money sent back to a debit card or credit card"
      card_ticket_size: "The ticket size of an order is the vehicle price charged on it net of any reversal of that price."
      card_allowance_basis: "at or above the high ticket size it is the larger of the program's card payment cap and the high ticket share of the ticket size; at or above the middle ticket size but below the high ticket size it is the larger of the program's card payment cap and the middle ticket share of the ticket size; below the middle ticket size it is the program's card payment cap; a ticket share is rounded half up to the cent"
