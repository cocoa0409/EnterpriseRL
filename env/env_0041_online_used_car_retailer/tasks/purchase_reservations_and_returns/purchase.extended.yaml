# Extended product charter: Vehicle Purchase Agreements (Kestrel Auto), difficulty purchase_reservations_and_returns. Base section copied verbatim from blueprint/products/purchase.yaml; extended_policies appended below.
# One holding = one purchase order for one vehicle, from reservation through handover, the 7-day
# return window and final sale. Policy constants live only here; the KB renders them later.

category: purchase
display_name: Vehicle Purchase Agreements

binding:
  holding_table: purchase_orders
  event_tables: [purchase_transactions, purchase_limited_warranty_claims]
  intake_tables: [purchase_return_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {order_balance: order_balance, deposit_held: deposit_held}

lifecycle:
  states: [reserved, contracted, delivered, return_pending, returned, completed, cancelled, expired]
  transitions:
    - {from: reserved, to: contracted, by: user, means: "The buyer e-signs the purchase agreement while the reservation hold is still in effect."}
    - {from: reserved, to: expired, by: system, means: "The hold expiration date passes without a signed purchase agreement and the vehicle is released."}
    - {from: reserved, to: cancelled, by: agent, means: "The reservation is cancelled before signing, at the buyer's request or because the vehicle became unavailable."}
    - {from: contracted, to: cancelled, by: agent, means: "The signed order is cancelled before handover (buyer's request, vehicle unavailable, or outside financing not received in time)."}
    - {from: contracted, to: delivered, by: system, means: "The buyer takes possession at a completed delivery or pickup and the handover checklist is recorded."}
    - {from: delivered, to: return_pending, by: user, means: "The buyer e-signs the 7-day return authorization."}
    - {from: return_pending, to: delivered, by: user, means: "The buyer withdraws the return before handing the vehicle back."}
    - {from: return_pending, to: returned, by: agent, means: "The vehicle is received back and the return inspection is completed."}
    - {from: delivered, to: completed, by: system, means: "The 7-day return window ends with no return pending and the sale becomes final."}

accounts:
  - key: order_balance
    unit: USD
    meaning: "What the buyer still owes on the order: charges and refunds raise it, payments and charge reversals lower it; a negative value is a credit owed back to the buyer."
  - key: deposit_held
    unit: USD
    meaning: "Reservation deposit money Kestrel holds for the order that has not yet been applied to the order or refunded."

parameter_schema:
  reservation_deposit_usd: Refundable reservation deposit charged when the vehicle is reserved, USD
  reservation_hold_days: Calendar days the vehicle is held after the reservation date (reservation date = day 0), integer days
  hold_extension_days: Calendar days one hold extension adds to the current hold expiration date, integer days
  max_hold_extensions: Maximum hold extensions per order, integer count
  deposit_refund_business_days: Business days within which a refundable deposit is returned to the original card or account, integer business days
  deposit_payment_channels: Payment channels accepted for the reservation deposit, list of payment_channel values
  deposit_refund_on_hold_expiry: Whether a reservation that lapses unsigned has its deposit refunded in full automatically, boolean
  min_buyer_age_years: Minimum age of the buyer on the reservation date, computed from the profile date of birth, integer years
  down_payment_lead_business_days: Per payment channel, business days before the handover date by which a down payment on that channel must be received, mapping channel -> integer business days
  card_payment_cap_usd: Maximum combined debit-card and credit-card money accepted on one order, reservation deposit included, USD
  ach_single_payment_limit_usd: Maximum amount of a single ACH payment toward an order; larger amounts must come by wire or cashier's check, USD
  outside_lender_funding_days: Calendar days after the purchase agreement signing date within which an outside lender's proceeds must be received, integer days
  handover_signing_lead_days: Minimum calendar days between the purchase agreement signing date and the handover date, integer days (0 = same-day allowed)
  cancellation_refund_business_days: Business days within which customer-paid funds are refunded after a pre-handover cancellation, integer business days
  overpayment_refund_business_days: Business days within which a credit balance on a completed order is refunded, integer business days
  documentation_fee_by_dealer_state: Documentation fee charged at signing, by the state of the selling Kestrel dealer license, mapping state -> USD
  free_transfer_distance_miles: Transfer distance up to which no shipping fee is charged, integer miles
  shipping_fee_discount_pct: Percentage discount off the distance-band shipping fee, percent
  shipping_fee_refundable: Whether a charged shipping fee is refunded when the order is cancelled by the customer after transfer or returned, boolean
  handover_odometer_tolerance_miles: Miles the handover odometer may exceed the listing odometer before the buyer may decline the vehicle at handover, integer miles
  insurance_proof_required: Whether verified proof of insurance naming the VIN is required before handover, boolean
  financed_insurance_deductible_max_usd: Maximum comprehensive and collision deductible accepted on proof of insurance for a financed order, USD
  return_window_days: Calendar days after the handover date during which a 7-day return or exchange may be requested (handover date = day 0), integer days
  return_mileage_allowance: Miles that may be driven between handover and return without an excess-mileage fee, integer miles
  return_mileage_hard_cap: Miles driven since handover above which a 7-day return or exchange is not accepted, integer miles
  excess_return_mileage_fee_per_mile: Fee per mile driven above the return mileage allowance, USD per mile
  returns_per_exchange_chain: Number of 7-day returns or exchanges available across an original order and any exchange replacement that came from it, integer count
  return_pickup_fee_usd: Fee for Kestrel to collect a returned vehicle from the customer's address (no fee for hub drop-off), USD
  return_hub_dropoff_allowed: Whether the customer may bring a returned vehicle to a Kestrel hub, boolean
  return_handback_days_after_request: Calendar days after the return request date by which the vehicle must be handed back to Kestrel, integer days
  return_inspection_business_days: Business days after the vehicle is received within which the return inspection is completed and return charges are posted, integer business days
  return_refund_business_days: Business days after the return is completed within which customer-paid funds are refunded, integer business days
  ach_clearing_hold_business_days: Business days an ACH down payment must have cleared before its refund is released, integer business days
  return_damage_waiver_usd: Repair estimate of new damage found at return inspection up to which no damage charge is made, USD
  missing_key_charge_usd: Charge per key or fob delivered with the vehicle and missing at return, USD
  exchange_allowed: Whether the 7-day right may be used as an exchange for another Kestrel vehicle, boolean
  exchange_shipping_fee_waived: Whether the shipping fee on an exchange replacement vehicle is waived, boolean
  documentation_fee_refundable_on_return: Whether the documentation fee is refunded on a completed 7-day return, boolean
  included_warranty_days: Days of included limited warranty coverage counted from the handover date, integer days
  included_warranty_miles: Miles of included limited warranty coverage added to the handover odometer, integer miles
  included_warranty_covered_systems: Vehicle systems covered by the included limited warranty, list of component_system values
  included_warranty_deductible_usd: Deductible per approved limited warranty claim, USD
  included_warranty_per_claim_cap_usd: Maximum Kestrel pays on one limited warranty claim after the deductible, USD
  included_warranty_aggregate_cap_usd: Maximum Kestrel pays across all limited warranty claims on one order, USD
  included_warranty_labor_rate_cap_usd: Maximum hourly labor rate recognized in a limited warranty repair estimate, USD per hour
  included_warranty_rental_per_day_usd: Rental reimbursement per day while an approved limited warranty repair keeps the vehicle overnight, USD per day
  included_warranty_rental_max_days: Maximum rental days reimbursed per approved limited warranty claim, integer days
  included_warranty_towing_cap_usd: Maximum towing reimbursement per approved limited warranty claim, USD
  included_warranty_claim_report_days: Calendar days after the failure date within which the repair facility must request authorization, integer days

