        ladder:
          - when: "one of the buyer's Kestrel Auto Finance contracts is paid off and no payment on any of the buyer's Kestrel Auto Finance contracts has ever been returned"
            value: "K('clean_history_uplift_usd')"
          - when: "one of the buyer's Kestrel Auto Finance contracts is paid off and payments have been returned, but none within the twelve whole months before today"
            value: "K('recovered_history_uplift_usd')"
