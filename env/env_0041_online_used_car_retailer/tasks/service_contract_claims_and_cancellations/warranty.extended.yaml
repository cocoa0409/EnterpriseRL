        - {table: service_contract_transactions, aggregate: count, field: component_system, within_months: 12, filters: {event_type: warranty_claim_adjudicated, claim_decision: approved}}
      cross_category: [purchase]


  - id: warranty_ext_trip_interruption_reimbursement
    base_policy_refs: [warranty_benefits]
    overwrite:
      - base_policy: warranty_benefits
        superseded_clause: >-
          trip interruption lodging and meals at the plan's per-day amount up to its maximum days when the breakdown
          happens at least the minimum distance from the holder's residential address.
        replaced_by: >-
          The amount for the trip days, figured as above, is multiplied by the recent-trip share and then by the
          repair-coverage share, and the reimbursement is rounded to the cent only at the end.
    trigger: on_request
    subject: [warranty_benefit_reimbursed]
    computes: reimbursement_amount
    target_tool: file_trip_interruption_claim_d37559b2
    params:
      diagnosis_wait_days: 2
      major_repair_paid: 2000.00
      extended_repair_paid: 1000.00
      major_repair_extra_days: 2
      extended_repair_extra_days: 1
      overflow_day_share: 0.5
      overflow_meals_per_day: 35.00
      premium_trip_allowance: 150.00
      certified_trip_allowance: 125.00
      recent_trip_share_short: 0.5
      recent_trip_share_long: 0.75
      partial_coverage_share_low: 0.6
      partial_coverage_share_high: 0.85
    rule: >-
      A trip interruption reimbursement is not fixed until the facility has been paid for the repair work on the
      repair order that stranded the holder.
      A trip interruption reimbursement covers lodging and meals while a covered breakdown keeps the holder away
      from home, and applies only when the breakdown happened at least the plan's trip interruption minimum distance
      from the holder's residential address. It is figured on the plan's most recent approved decision: its repair
      order, failure date, decision date, vehicle system, estimate and deductible, together with the claim payments
      posted on that repair order. Trip interruption receipts are accepted within the plan's benefit receipt
      submission days counted in calendar days from the day the vehicle is released, and trip interruption is
      reimbursed once per repair order.
      The trip days are the calendar days from the failure date on the decision to the day the vehicle is released,
      which is the date of the latest claim payment posted on the repair order, the facility releasing the vehicle
      when it is paid, or the decision date where no claim payment has posted. The trip days are capped at the
      plan's trip interruption maximum days, and the reimbursement is the capped trip days times the plan's trip
      interruption per-day amount, rounded to the cent.
      The failure day itself is counted as follows: where the decision came more than the diagnosis-wait days after
      the failure date, one day is added for the failure day; where the decision came within the diagnosis-wait
      days and the facility is a Kestrel network facility, one day is taken off, counting starting the day after the
      failure date; otherwise no day is added or taken off.
      The trip days are capped as follows: where the claim payments on the repair order total at least the
      major-repair payment and the repair is on the engine or the transmission, the cap is the plan's maximum days
      plus the major-repair extra days; where they total at least the extended-repair payment and the first case
      does not apply, the cap is the plan's maximum days plus the extended-repair extra day; otherwise the cap is the
      plan's maximum days.
      The daily trip allowance follows the vehicle program on the covered vehicle's purchase order: a vehicle sold
      as Kestrel Premium Certified or Kestrel Factory Certified receives the premium trip allowance, a vehicle sold as
      Kestrel Certified or Kestrel Certified Plus the certified trip allowance, and any other vehicle the plan's trip
      interruption per-day amount.
      The days beyond the cap are paid as follows: where the trip days exceed the cap and the repair is on the
      engine or the transmission, the amount is the capped days at the daily trip allowance plus each day beyond the
      cap at the overflow-day share of that allowance; where the trip days exceed the cap and the first case does
      not apply, the amount is the capped days at the daily trip allowance plus each day beyond the cap at the
      overflow meals amount per day, lodging no longer being paid; otherwise the amount is the trip days at the
      daily trip allowance. The days booked on the reimbursement are the capped days plus the days beyond the cap
      where those days are paid.
      A recent-trip share applies, counted from the trip interruption reimbursements already paid on the plan: one
      paid within the last six months means the recent-trip short share; one paid within the last twelve months but
      none within six months means the recent-trip long share; otherwise the whole amount.
      A repair-coverage share applies, comparing the claim payments on the repair order with its estimate less the
      deductible: payments below half of it mean the low partial-coverage share; payments at or above half but below
      the whole of it mean the high partial-coverage share; payments covering all of it mean the whole amount.
      The amount for the trip days, figured as above, is multiplied by the recent-trip share and then by the
      repair-coverage share, and the reimbursement is rounded to the cent only at the end.
    prerequisite:
      - problem: warranty_ext_release_repair_payment
        kind: value_input
        gate: ro_paid_total
        form: action
        policy_source: >-
          A trip interruption reimbursement is not fixed until the facility has been paid for the repair work on the
          repair order that stranded the holder.
        fallback_reason: >-
          The repair-work payment leaves a claim payment entry on the repair order of exactly the same kind as the
          diagnostic time payment on the same repair order, so the record cannot show which of them has posted; the
          dependency can only be stated as the action of paying the facility for the repair work.
        condition: >-
          The repair order of the most recent approved decision carries the claim payment for the repair work, so its
          claim payments total the diagnostic payment plus the repair payment and its latest claim payment date is the
          release date.
        resolved_by: pay_repair_facility_1c2b8918
        effect: >-
          The repair payment raises the claim payments the cap and the repair-coverage share read, and fixes the
          release date the trip days run to.
    cross_category:
      - category: purchase
        as: branch
        reads: [variant_name]
        note: the daily-allowance factor reads the vehicle program on the covered vehicle's purchase order.
    compute:
      - trip_ro: "LATEST('service_contract_transactions', 'repair_order_number', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - trip_failure_date: "LATEST('service_contract_transactions', 'failure_date', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - trip_decision_date: "LATEST('service_contract_transactions', 'txn_date', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - trip_system: "LATEST('service_contract_transactions', 'component_system', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - trip_estimate: "LATEST('service_contract_transactions', 'requested_amount', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - trip_deductible: "LATEST('service_contract_transactions', 'deductible_amount', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - trip_facility: "LATEST('service_contract_transactions', 'repair_facility_type', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - ro_paid_total: "SUM('service_contract_transactions', 'amount', event_type='warranty_claim_paid', repair_order_number=trip_ro)"
      - ro_last_payment_date: "LATEST('service_contract_transactions', 'txn_date', date_field='txn_date', event_type='warranty_claim_paid', repair_order_number=trip_ro)"
      - release_date: "ro_last_payment_date if (ro_paid_total > 0 and ro_last_payment_date) else trip_decision_date"
      - failure_day_count: "1 if DAYS(trip_failure_date, trip_decision_date) > K('diagnosis_wait_days') else (-1 if trip_facility == 'kestrel_network' else 0)"
      - counted_trip_days: "MX(0, DAYS(trip_failure_date, release_date) + failure_day_count)"
      - trip_day_cap: "(P('trip_interruption_max_days') + K('major_repair_extra_days')) if (ro_paid_total >= K('major_repair_paid') and (trip_system == 'engine' or trip_system == 'transmission')) else ((P('trip_interruption_max_days') + K('extended_repair_extra_days')) if ro_paid_total >= K('extended_repair_paid') else P('trip_interruption_max_days'))"
      - trip_program: "CFIELD('purchase', 'variant_name', purchase_order_id=F('purchase_order_id'))"
      - trip_allowance: "K('premium_trip_allowance') if (trip_program == 'Kestrel Premium Certified' or trip_program == 'Kestrel Factory Certified') else (K('certified_trip_allowance') if (trip_program == 'Kestrel Certified' or trip_program == 'Kestrel Certified Plus') else P('trip_interruption_per_day_usd'))"
      - capped_trip_days: "MN(counted_trip_days, trip_day_cap)"
      - overflow_days: "MX(0, counted_trip_days - trip_day_cap)"
      - trip_days_amount: "((capped_trip_days + overflow_days * K('overflow_day_share')) * trip_allowance) if (overflow_days > 0 and (trip_system == 'engine' or trip_system == 'transmission')) else ((capped_trip_days * trip_allowance + overflow_days * K('overflow_meals_per_day')) if overflow_days > 0 else capped_trip_days * trip_allowance)"
      - trips_6m: "COUNT('service_contract_transactions', within_months=6, date_field='txn_date', event_type='warranty_benefit_reimbursed', benefit_type='trip_interruption')"
      - trips_12m: "COUNT('service_contract_transactions', within_months=12, date_field='txn_date', event_type='warranty_benefit_reimbursed', benefit_type='trip_interruption')"
      - recent_trip_share: "K('recent_trip_share_short') if trips_6m >= 1 else (K('recent_trip_share_long') if trips_12m >= 1 else 1)"
      - repair_payable: "MX(0, trip_estimate - trip_deductible)"
      - coverage_share: "K('partial_coverage_share_low') if ro_paid_total * 2 < repair_payable else (K('partial_coverage_share_high') if ro_paid_total < repair_payable else 1)"
      - trip_receipt_window_open: "DAYS(release_date, NOW) <= P('benefit_receipt_submission_days')"
      - trip_already_paid: "COUNT('service_contract_transactions', event_type='warranty_benefit_reimbursed', benefit_type='trip_interruption', repair_order_number=trip_ro)"
      - result: "RND(trip_days_amount * recent_trip_share * coverage_share, 2) if (trip_receipt_window_open and trip_already_paid == 0) else 0"
    compute_basis:
      trip_ro: "It is figured on the plan's most recent approved decision: its repair order, failure date, decision date, vehicle system, estimate and deductible, together with the claim payments posted on that repair order."
      trip_failure_date: "It is figured on the plan's most recent approved decision: its repair order, failure date, decision date, vehicle system, estimate and deductible, together with the claim payments posted on that repair order."
      trip_decision_date: "It is figured on the plan's most recent approved decision: its repair order, failure date, decision date, vehicle system, estimate and deductible, together with the claim payments posted on that repair order."
      trip_system: "It is figured on the plan's most recent approved decision: its repair order, failure date, decision date, vehicle system, estimate and deductible, together with the claim payments posted on that repair order."
      trip_estimate: "It is figured on the plan's most recent approved decision: its repair order, failure date, decision date, vehicle system, estimate and deductible, together with the claim payments posted on that repair order."
      trip_deductible: "It is figured on the plan's most recent approved decision: its repair order, failure date, decision date, vehicle system, estimate and deductible, together with the claim payments posted on that repair order."
