    factors:
      - id: failure_day_count
        effect: parameter
        decides: failure_day_count
        bindings: [trip_facility, failure_day_count]
        ladder:
          - when: "the decision came more than K('diagnosis_wait_days') days after the failure date"
            value: "1 (the failure day is added)"
          - when: "the decision came within K('diagnosis_wait_days') days and the facility is a Kestrel network facility"
            value: "-1 (one day taken off)"
          - when: "otherwise"
            value: "0"
        baseline:
          failure_day_count: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: trip_day_cap
        effect: parameter
        decides: trip_day_cap
        bindings: [ro_paid_total, trip_day_cap]
        ladder:
          - when: "claim payments on the repair order total at least K('major_repair_paid') AND the repair is on the engine or transmission"
            value: "P('trip_interruption_max_days') + K('major_repair_extra_days')"
          - when: "claim payments total at least K('extended_repair_paid') and the first tier does not apply"
            value: "P('trip_interruption_max_days') + K('extended_repair_extra_days')"
          - when: "otherwise"
            value: "P('trip_interruption_max_days')"
        baseline:
          trip_day_cap: "P('trip_interruption_max_days')"
        evidence: [history]
        cross_difficulty: null
      - id: overflow_day_payment
        effect: method
        decides: trip_days_amount
        bindings: [trip_system, overflow_days, trip_days_amount]
        ladder:
          - when: "the trip days exceed the cap AND the repair is on the engine or the transmission"
            method: "capped days at the daily allowance plus each day beyond the cap at the overflow-day share of the allowance"
          - when: "the trip days exceed the cap and the first tier does not apply"
            method: "capped days at the daily allowance plus each day beyond the cap at the flat overflow meals amount (no lodging)"
          - when: "otherwise"
            method: "capped trip days at the daily allowance; days beyond the cap are not paid"
        baseline:
          trip_days_amount: "capped_trip_days * trip_allowance"
        evidence: [history]
        cross_difficulty: null
      - id: program_trip_allowance
        effect: parameter
        decides: trip_allowance
        bindings: [trip_program, trip_allowance]
        ladder:
          - when: "vehicle sold as Kestrel Premium Certified or Kestrel Factory Certified"
            value: "K('premium_trip_allowance')"
          - when: "vehicle sold as Kestrel Certified or Kestrel Certified Plus"
            value: "K('certified_trip_allowance')"
          - when: "otherwise"
            value: "P('trip_interruption_per_day_usd')"
        baseline:
          trip_allowance: "P('trip_interruption_per_day_usd')"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: recent_trip_share
        effect: parameter
        decides: recent_trip_share
        bindings: [trips_6m, trips_12m, recent_trip_share]
        ladder:
          - when: "a trip interruption reimbursement paid on the plan within the last six months"
            value: "K('recent_trip_share_short')"
          - when: "one within the last twelve months but none within six months"
            value: "K('recent_trip_share_long')"
          - when: "otherwise"
            value: "1"
        baseline:
          recent_trip_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: repair_coverage_share
        effect: parameter
        decides: coverage_share
        bindings: [trip_estimate, trip_deductible, repair_payable, coverage_share]
        ladder:
          - when: "claim payments on the repair order below half of its estimate less the deductible"
            value: "K('partial_coverage_share_low')"
          - when: "at or above half but below the whole of it"
            value: "K('partial_coverage_share_high')"
          - when: "otherwise (payments cover all of it)"
            value: "1"
        baseline:
          coverage_share: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The trip days are the calendar days from the failure date on the decision to the day the vehicle is released,
        which is the date of the latest claim payment posted on the repair order, the facility releasing the vehicle
        when it is paid, or the decision date where no claim payment has posted. The trip days are capped at the
        plan's trip interruption maximum days, and the reimbursement is the capped trip days times the plan's trip
        interruption per-day amount, rounded to the cent.
      params: [trip_interruption_max_days, trip_interruption_per_day_usd]
    inputs:
      history:
        - {table: service_contract_transactions, aggregate: sum, field: amount, within_months: null, filters: {event_type: warranty_claim_paid}}
        - {table: service_contract_transactions, aggregate: count, field: benefit_type, within_months: 12, filters: {event_type: warranty_benefit_reimbursed, benefit_type: trip_interruption}}
      cross_category: [purchase]
