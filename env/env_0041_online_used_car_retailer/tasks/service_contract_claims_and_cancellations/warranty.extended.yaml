        bindings: [release_facility, agreement_allowance]
        ladder:
          - when: "facility on the decision is a franchised dealer"
            value: "K('franchise_agreement_allowance')"
          - when: "facility is an independent licensed repair shop"
            value: "K('independent_agreement_allowance')"
          - when: "otherwise (Kestrel network facility)"
