        bindings: [comeback_3m, comeback_12m, comeback_share]
        ladder:
          - when: "an earlier approved decision on the same system within the last three months"
            value: "K('comeback_share_short')"
          - when: "one within the last twelve months but none within three months"
            value: "K('comeback_share_long')"
          - when: "otherwise"
            value: "1"
        baseline:
          comeback_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: parts_program_uplift
        effect: parameter
