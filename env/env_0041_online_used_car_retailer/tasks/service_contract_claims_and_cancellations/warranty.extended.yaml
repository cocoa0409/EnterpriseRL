# ============================================================================
# extended_policies (instantiated by erl-task-instantiate, difficulty service_contract_claims_and_cancellations)
# ============================================================================
extended_policies:
  - id: warranty_ext_stack_remainder_authorization
    base_policy_refs: [warranty_agg_vehicle_coverage_stack, warranty_claims]
    overwrite:
      - base_policy: warranty_claims
        superseded_clause: >-
          Otherwise the claim is approved: the estimate is recognized at no more than the plan's labor rate cap,
          diagnostic time only when the plan covers it, the deductible is applied once per visit unless waived at a
          Kestrel network facility, and the amount payable is the lesser of the recognized estimate less the
          deductible, the plan's per-visit limit and the coverage remaining.
        replaced_by: >-
          The deductible is taken first, then the wear deduction, the repeat-repair share and the late-notice share
          are applied one after another, each to the result of the step before, and the repair sales tax is added
          last.
      - base_policy: warranty_agg_vehicle_coverage_stack
        superseded_clause: >-
          the plan's adjudication of that repair is limited to what the limited warranty decision left unpaid, and
          the plan's deductible is not applied a second time when the limited warranty already applied one.
        replaced_by: >-
          The starting amount depends on how the limited warranty decision ended: where it approved the repair order
          and applied a deductible of its own, the starting amount is the estimate less the amount it covered and
          less that deductible; where it approved the repair order without a deductible of its own, the starting
          amount is the estimate less the amount it covered; in every other case the starting amount is the full
          estimate.
    trigger: state_due
    subject: [warranty_claim_adjudicated]
    computes: approved_amount
    target_tool: authorize_stack_remainder_2296c771
    params:
      maintained_deductible_share: 0.5
      maintained_min_visits: 1
      wear_odometer_high: 100000
      wear_odometer_mid: 75000
      wear_rate_high: 0.15
      wear_rate_mid: 0.10
      repeat_share_short: 0.5
      repeat_share_long: 0.75
      notice_days_late: 60
      notice_days_delayed: 30
      notice_share_late: 0.8
      notice_share_delayed: 0.9
      repair_tax_rate_arizona: 0.056
      repair_tax_rate_texas: 0.0625
    rule: >-
      When a Kestrel limited warranty decision on the covered vehicle has already decided a repair order and left
      part of it unpaid, the KestrelCare authorization of the same repair order settles what the plan still owes on
      it, read from the latest limited warranty decision recorded for the holder: its repair estimate, the amount it
      covered, the deductible it applied, its decision, the vehicle system and the odometer on the repair order.
      The amount payable on a remainder authorization starts from the repair estimate on the limited warranty
      decision. The plan's chosen deductible is subtracted from that starting amount, and the difference is never
      taken below zero. The figure is then capped at the plan's per-visit limit and at the coverage remaining on
      the plan, whichever is lower, and rounded to the cent only at the end.
      The starting amount depends on how the limited warranty decision ended: where it approved the repair order
      and applied a deductible of its own, the starting amount is the estimate less the amount it covered and less
      that deductible; where it approved the repair order without a deductible of its own, the starting amount is
      the estimate less the amount it covered; in every other case the starting amount is the full estimate.
      The deductible taken from the starting amount is set as follows: where the limited warranty decision approved
      the repair order and applied a deductible of its own, no plan deductible is taken; where that is not the case
      and the holder has an active KestrelCare Prepaid Maintenance Plan with at least the maintained-holder minimum
      of service visits redeemed in the last twelve months, the maintained-holder share of the plan's chosen
      deductible is taken; otherwise the plan's chosen deductible is taken.
      A wear deduction then applies to the amount after the deductible, read from the odometer on the repair order:
      at or above the high-mileage wear odometer the amount is reduced by the high-mileage wear rate; at or above
      the mid-mileage wear odometer but below the high-mileage wear odometer it is reduced by the mid-mileage wear
      rate; below the mid-mileage wear odometer there is no wear deduction.
      A repeat-repair share then applies, counted from the plan's own approved authorizations on the same vehicle
      system as the repair order: where the plan approved a repair on that system within the last three months, the
      plan pays the short-interval repeat share of the amount; where it approved one within the last twelve months
      but none within the last three months, the plan pays the long-interval repeat share; where it approved none
      within the last twelve months, the plan pays the whole amount.
      A late-notice share then applies, counted in calendar days from the failure date on the repair order to the
      day of the decision: beyond the late-notice days the plan pays the late-notice share; beyond the
      delayed-notice days but not beyond the late-notice days the plan pays the delayed-notice share; within the
      delayed-notice days the plan pays the whole amount.
      Repair sales tax is added at the rate for the state in which the vehicle is registered on its purchase order:
      the Arizona repair tax rate for a vehicle registered in Arizona, the Texas repair tax rate for a vehicle
      registered in Texas, and no repair sales tax for a vehicle registered in any other state.
      The deductible is taken first, then the wear deduction, the repeat-repair share and the late-notice share are
      applied one after another, each to the result of the step before, and the repair sales tax is added last.
      The per-visit limit and the coverage remaining are compared with the figure after the tax.
    prerequisite: []
    cross_category:
      - category: purchase
        as: history
        reads: [purchase_limited_warranty_claims.repair_estimate, purchase_limited_warranty_claims.covered_amount, purchase_limited_warranty_claims.deductible_amount, purchase_limited_warranty_claims.claim_decision, purchase_limited_warranty_claims.odometer_at_failure, purchase_limited_warranty_claims.component_system, purchase_limited_warranty_claims.failure_date, registration_state]
        note: the stack factor reads the latest limited warranty decision; the tax factor reads the registration state on the purchase order.
      - category: maintenance
        as: history
        reads: [status, maintenance_transactions.event_type]
        note: the deductible factor reads whether a maintenance plan is active and its redeemed visits in the last twelve months.
    compute:
      - lw_estimate: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'repair_estimate', date_field='decision_date')"
      - lw_covered: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'covered_amount', date_field='decision_date')"
      - lw_deductible: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'deductible_amount', date_field='decision_date')"
      - lw_decision: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'claim_decision', date_field='decision_date')"
      - lw_odometer: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'odometer_at_failure', date_field='decision_date')"
      - lw_component: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'component_system', date_field='decision_date')"
      - lw_failure_date: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'failure_date', date_field='decision_date')"
      - starting_amount: "(lw_estimate - lw_covered - lw_deductible) if (lw_decision == 'approved' and lw_deductible > 0) else ((lw_estimate - lw_covered) if lw_decision == 'approved' else lw_estimate)"
      - maintenance_plan_active: "EXISTS('maintenance', status='active')"
      - maintenance_visits_12m: "XCOUNT('maintenance', 'maintenance_transactions', within_months=12, date_field='txn_date', event_type='maintenance_visit_redeemed')"
      - remainder_deductible: "0 if (lw_decision == 'approved' and lw_deductible > 0) else ((F('deductible_usd') * K('maintained_deductible_share')) if (maintenance_plan_active and maintenance_visits_12m >= K('maintained_min_visits')) else F('deductible_usd'))"
      - wear_rate: "K('wear_rate_high') if lw_odometer >= K('wear_odometer_high') else (K('wear_rate_mid') if lw_odometer >= K('wear_odometer_mid') else 0)"
      - same_system_3m: "COUNT('service_contract_transactions', within_months=3, date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved', component_system=lw_component)"
      - same_system_12m: "COUNT('service_contract_transactions', within_months=12, date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved', component_system=lw_component)"
      - repeat_share: "K('repeat_share_short') if same_system_3m >= 1 else (K('repeat_share_long') if same_system_12m >= 1 else 1)"
      - notice_days: "DAYS(lw_failure_date, NOW)"
      - notice_share: "K('notice_share_late') if notice_days > K('notice_days_late') else (K('notice_share_delayed') if notice_days > K('notice_days_delayed') else 1)"
      - registration_state: "CFIELD('purchase', 'registration_state', purchase_order_id=F('purchase_order_id'))"
      - repair_tax_rate: "K('repair_tax_rate_arizona') if registration_state == 'AZ' else (K('repair_tax_rate_texas') if registration_state == 'TX' else 0)"
      - after_deductible: "MX(0, starting_amount - remainder_deductible)"
      - after_shares: "after_deductible * (1 - wear_rate) * repeat_share * notice_share"
      - with_tax: "after_shares * (1 + repair_tax_rate)"
      - result: "RND(MN(with_tax, P('per_repair_visit_limit_usd'), F('coverage_remaining')), 2)"
    compute_basis:
      lw_estimate: "When a Kestrel limited warranty decision on the covered vehicle has already decided a repair order and left part of it unpaid, the KestrelCare authorization of the same repair order settles what the plan still owes on it, read from the latest limited warranty decision recorded for the holder: its repair estimate, the amount it covered, the deductible it applied, its decision, the vehicle system and the odometer on the repair order."
      lw_covered: "read from the latest limited warranty decision recorded for the holder: its repair estimate, the amount it covered, the deductible it applied, its decision, the vehicle system and the odometer on the repair order."
      lw_deductible: "read from the latest limited warranty decision recorded for the holder: its repair estimate, the amount it covered, the deductible it applied, its decision, the vehicle system and the odometer on the repair order."
      lw_decision: "read from the latest limited warranty decision recorded for the holder: its repair estimate, the amount it covered, the deductible it applied, its decision, the vehicle system and the odometer on the repair order."
      lw_odometer: "read from the latest limited warranty decision recorded for the holder: its repair estimate, the amount it covered, the deductible it applied, its decision, the vehicle system and the odometer on the repair order."
      lw_component: "read from the latest limited warranty decision recorded for the holder: its repair estimate, the amount it covered, the deductible it applied, its decision, the vehicle system and the odometer on the repair order."
      lw_failure_date: "A late-notice share then applies, counted in calendar days from the failure date on the repair order to the day of the decision"
      starting_amount: "The starting amount depends on how the limited warranty decision ended: where it approved the repair order and applied a deductible of its own, the starting amount is the estimate less the amount it covered and less that deductible; where it approved the repair order without a deductible of its own, the starting amount is the estimate less the amount it covered; in every other case the starting amount is the full estimate."
      maintenance_plan_active: "where that is not the case and the holder has an active KestrelCare Prepaid Maintenance Plan with at least the maintained-holder minimum of service visits redeemed in the last twelve months"
      maintenance_visits_12m: "where that is not the case and the holder has an active KestrelCare Prepaid Maintenance Plan with at least the maintained-holder minimum of service visits redeemed in the last twelve months"
      remainder_deductible: "The deductible taken from the starting amount is set as follows: where the limited warranty decision approved the repair order and applied a deductible of its own, no plan deductible is taken; where that is not the case and the holder has an active KestrelCare Prepaid Maintenance Plan with at least the maintained-holder minimum of service visits redeemed in the last twelve months, the maintained-holder share of the plan's chosen deductible is taken; otherwise the plan's chosen deductible is taken."
      wear_rate: "A wear deduction then applies to the amount after the deductible, read from the odometer on the repair order: at or above the high-mileage wear odometer the amount is reduced by the high-mileage wear rate; at or above the mid-mileage wear odometer but below the high-mileage wear odometer it is reduced by the mid-mileage wear rate; below the mid-mileage wear odometer there is no wear deduction."
      same_system_3m: "A repeat-repair share then applies, counted from the plan's own approved authorizations on the same vehicle system as the repair order"
      same_system_12m: "A repeat-repair share then applies, counted from the plan's own approved authorizations on the same vehicle system as the repair order"
      repeat_share: "where the plan approved a repair on that system within the last three months, the plan pays the short-interval repeat share of the amount; where it approved one within the last twelve months but none within the last three months, the plan pays the long-interval repeat share; where it approved none within the last twelve months, the plan pays the whole amount."
      notice_days: "A late-notice share then applies, counted in calendar days from the failure date on the repair order to the day of the decision"
      notice_share: "beyond the late-notice days the plan pays the late-notice share; beyond the delayed-notice days but not beyond the late-notice days the plan pays the delayed-notice share; within the delayed-notice days the plan pays the whole amount."
      registration_state: "Repair sales tax is added at the rate for the state in which the vehicle is registered on its purchase order"
      repair_tax_rate: "the Arizona repair tax rate for a vehicle registered in Arizona, the Texas repair tax rate for a vehicle registered in Texas, and no repair sales tax for a vehicle registered in any other state."
      after_deductible: "The plan's chosen deductible is subtracted from that starting amount, and the difference is never taken below zero."
      after_shares: "The deductible is taken first, then the wear deduction, the repeat-repair share and the late-notice share are applied one after another, each to the result of the step before, and the repair sales tax is added last."
      with_tax: "The deductible is taken first, then the wear deduction, the repeat-repair share and the late-notice share are applied one after another, each to the result of the step before, and the repair sales tax is added last."
      result: "The figure is then capped at the plan's per-visit limit and at the coverage remaining on the plan, whichever is lower, and rounded to the cent only at the end."
    factors:
      - id: limited_warranty_remainder
        effect: method
        decides: starting_amount
        bindings: [lw_estimate, lw_covered, lw_deductible, lw_decision, starting_amount]
        ladder:
          - when: "the latest limited warranty decision approved the repair order and applied a deductible of its own"
            method: "the starting amount is the estimate less the amount the limited warranty covered and less its deductible"
          - when: "the latest limited warranty decision approved the repair order without a deductible of its own"
            method: "the starting amount is the estimate less the amount the limited warranty covered"
          - when: "otherwise (the limited warranty decision did not approve the repair order, or there is none)"
            method: "the starting amount is the full repair estimate"
        baseline:
          starting_amount: "lw_estimate"
        evidence: [cross_category, history]
        cross_difficulty: purchase
      - id: remainder_deductible
        effect: parameter
        decides: remainder_deductible
        bindings: [maintenance_plan_active, maintenance_visits_12m, remainder_deductible]
        ladder:
          - when: "the limited warranty decision approved the repair order and applied a deductible of its own"
            value: "0 (no plan deductible)"
          - when: "not the first tier, and the holder has an active KestrelCare Prepaid Maintenance Plan with at least K('maintained_min_visits') visit redeemed in the last twelve months"
            value: "F('deductible_usd') * K('maintained_deductible_share')"
          - when: "otherwise"
            value: "F('deductible_usd')"
        baseline:
          remainder_deductible: "F('deductible_usd')"
        evidence: [cross_category, history]
        cross_difficulty: maintenance
      - id: repair_wear_deduction
        effect: parameter
        decides: wear_rate
        bindings: [lw_odometer, wear_rate]
        ladder:
          - when: "odometer on the repair order at or above K('wear_odometer_high')"
            value: "K('wear_rate_high')"
          - when: "odometer at or above K('wear_odometer_mid') and below K('wear_odometer_high')"
            value: "K('wear_rate_mid')"
          - when: "otherwise (below K('wear_odometer_mid'))"
            value: "0"
        baseline:
          wear_rate: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: repeat_repair_share
        effect: parameter
        decides: repeat_share
        bindings: [lw_component, same_system_3m, same_system_12m, repeat_share]
        ladder:
          - when: "the plan approved a repair on the same vehicle system within the last three months"
            value: "K('repeat_share_short')"
          - when: "the plan approved one within the last twelve months but none within the last three months"
            value: "K('repeat_share_long')"
          - when: "otherwise (none within the last twelve months)"
            value: "1"
        baseline:
          repeat_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: late_notice_share
        effect: parameter
        decides: notice_share
        bindings: [lw_failure_date, notice_days, notice_share]
        ladder:
          - when: "more than K('notice_days_late') calendar days from the failure date to the decision"
            value: "K('notice_share_late')"
          - when: "more than K('notice_days_delayed') and at most K('notice_days_late') days"
            value: "K('notice_share_delayed')"
          - when: "otherwise (at most K('notice_days_delayed') days)"
            value: "1"
        baseline:
          notice_share: "1"
        evidence: [date, cross_category]
        cross_difficulty: null
      - id: repair_sales_tax
        effect: parameter
        decides: repair_tax_rate
        bindings: [registration_state, repair_tax_rate]
        ladder:
          - when: "vehicle registered in Arizona on its purchase order"
            value: "K('repair_tax_rate_arizona')"
          - when: "vehicle registered in Texas"
            value: "K('repair_tax_rate_texas')"
          - when: "otherwise (any other registration state)"
            value: "0"
        baseline:
          repair_tax_rate: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
    baseline:
      rule: >-
        The amount payable on a remainder authorization starts from the repair estimate on the limited warranty
        decision. The plan's chosen deductible is subtracted from that starting amount, and the difference is never
        taken below zero. The figure is then capped at the plan's per-visit limit and at the coverage remaining on
        the plan, whichever is lower, and rounded to the cent only at the end.
      params: [per_repair_visit_limit_usd]
    inputs:
      history:
        - {table: service_contract_transactions, aggregate: count, field: component_system, within_months: 12, filters: {event_type: warranty_claim_adjudicated, claim_decision: approved}}
        - {category: purchase, table: purchase_limited_warranty_claims, aggregate: latest, field: repair_estimate, within_months: null, filters: {}}
        - {category: maintenance, table: maintenance_transactions, aggregate: count, field: maintenance_txn_id, within_months: 12, filters: {event_type: maintenance_visit_redeemed}}
      cross_category: [purchase, maintenance]

  - id: warranty_ext_rental_reimbursement_settlement
    base_policy_refs: [warranty_benefits]
    overwrite:
      - base_policy: warranty_benefits
        superseded_clause: >-
          Rental is reimbursed at the plan's rental per day for each night the covered repair keeps the vehicle, up
          to the plan's rental maximum days per visit;
        replaced_by: >-
          What the limited warranty already paid for rental is credited as follows: where it paid rental on the same
          repair order at a daily rate below the daily rate that applies here, the reimbursement is the counted
          nights at that daily rate less the rental the limited warranty paid; where it paid rental at a daily rate
          at or above the daily rate that applies here, the reimbursement covers only the counted nights beyond the
          nights it paid for, at that daily rate; where it paid no rental, the reimbursement is the counted nights at
          that daily rate.
      - base_policy: warranty_benefits
        superseded_clause: >-
          Receipts must be submitted within the benefit receipt submission days after the repair is completed, and
          each benefit type is reimbursed once per repair order.
        replaced_by: >-
          Because a rental on such a repair can be reimbursed under the plan only once the plan has decided the
          repair order, the rental receipts are accepted within the plan's benefit receipt submission days counted in
          calendar days from the date of the plan's approved authorization of that repair order, and the rental is
          reimbursed once per repair order. Towing and trip interruption receipts remain due within the benefit
          receipt submission days after the repair is completed, the release of the vehicle by the repairing facility
          marking that completion, and each of those benefit types is reimbursed once per repair order.
    trigger: state_due
    subject: [warranty_benefit_reimbursed]
    computes: reimbursement_amount
    target_tool: file_rental_reimbursement_5fdd83af
    params:
      major_repair_estimate: 4000
      extended_repair_estimate: 2500
      major_repair_extra_nights: 3
      extended_repair_extra_nights: 1
      repeat_failure_min_repairs: 2
      compact_class_daily_rate: 40.00
      standard_class_daily_rate: 50.00
      rental_tax_rate_arizona: 0.083
      rental_tax_rate_texas: 0.10
      major_secondary_share: 0.75
      minor_secondary_share: 0.9
    rule: >-
      A rental car reimbursement is booked only after the repair order it belongs to carries an approved
      KestrelCare authorization on the plan.
      The repair order a rental reimbursement is figured on is the one named on the holder's latest limited warranty
      decision, and the plan's approved authorization it reads is the one on that same repair order; while that
      repair order carries no approved authorization, no rental reimbursement is due on it.
      Because a rental on such a repair can be reimbursed under the plan only once the plan has decided the repair
      order, the rental receipts are accepted within the plan's benefit receipt submission days counted in calendar
      days from the date of the plan's approved authorization of that repair order, and the rental is reimbursed
      once per repair order. Towing and trip interruption receipts remain due within the benefit receipt submission
      days after the repair is completed, the release of the vehicle by the repairing facility marking that
      completion, and each of those benefit types is reimbursed once per repair order.
      A rental car reimbursement on an approved repair order pays the plan's rental per day for each night counted
      on the repair order, the nights being counted in calendar days from the failure date on the plan's approved
      authorization of that repair order to the date of that authorization. The nights counted are capped at the
      plan's rental maximum days per visit. The reimbursement is the capped nights times the plan's rental per day,
      rounded to the cent.
      The nights are counted as follows: where the latest limited warranty decision for the holder approved the
      same repair order and recorded rental days, the nights are those rental days; where that limited warranty
      decision recorded no approved rental days, the nights are counted in calendar days from the date of that
      limited warranty decision to the date of the plan's authorization; where the holder has no limited warranty
      decision, the nights are counted from the failure date to the date of the plan's authorization.
      The nights are capped as follows: where the limited warranty decision's estimate is at or above the
      major-repair estimate and the plan has approved repairs on the same vehicle system at least twice within the
      last twelve months, the cap is the plan's rental maximum days plus the major-repair extra nights; where the
      estimate is at or above the extended-repair estimate and the first case does not apply, the cap is the plan's
      rental maximum days plus the extended-repair extra night; otherwise the cap is the plan's rental maximum
      days.
      The daily rate follows the class of the covered vehicle, read from the vehicle program on its purchase order:
      a vehicle sold as Kestrel Value Line or Kestrel Inspected is reimbursed at the compact-class daily rate; a
      vehicle sold as Kestrel Certified or Kestrel Certified Plus is reimbursed at the standard-class daily rate;
      a vehicle sold under any other program is reimbursed at the plan's rental per day.
      What the limited warranty already paid for rental is credited as follows: where it paid rental on the same
      repair order at a daily rate below the daily rate that applies here, the reimbursement is the counted nights
      at that daily rate less the rental the limited warranty paid; where it paid rental at a daily rate at or above
      the daily rate that applies here, the reimbursement covers only the counted nights beyond the nights it paid
      for, at that daily rate; where it paid no rental, the reimbursement is the counted nights at that daily rate.
      Rental sales tax is added at the rate for the state in which the vehicle is registered on its purchase order:
      the Arizona rental tax rate for Arizona, the Texas rental tax rate for Texas, and no rental sales tax for any
      other state.
      Because the plan reimburses rental on such a repair only as secondary coverage, the plan's share of the
      rental follows how much of the repair estimate the limited warranty decision covered: where it covered at
      least half of the estimate, the plan pays the major-secondary share; where it covered some of the estimate
      but less than half, the plan pays the minor-secondary share; where it covered nothing, the plan pays the whole
      reimbursement.
      The limited warranty's rental is credited first, the rental sales tax is then added to that result, and the
      secondary share is applied last; the reimbursement is never below zero.
    prerequisite:
      - problem: warranty_ext_stack_remainder_authorization
        kind: value_input
        gate: system_repairs_12m
        form: state
        policy_source: >-
          A rental car reimbursement is booked only after the repair order it belongs to carries an approved
          KestrelCare authorization on the plan.
        condition: >-
          The plan's ledger carries a claim decision entry with decision approved for the repair order whose limited
          warranty decision recorded the rental days.
        resolved_by: authorize_stack_remainder_2296c771
        effect: >-
          The approved authorization entry on the repair order satisfies the rule that benefits are paid only with an
          approved claim, and it is counted among the plan's approved repairs on the same vehicle system, which can
          move the night cap to its repeat-failure tier.
    cross_category:
      - category: purchase
        as: history
        reads: [purchase_limited_warranty_claims.rental_days, purchase_limited_warranty_claims.rental_amount, purchase_limited_warranty_claims.repair_estimate, purchase_limited_warranty_claims.covered_amount, purchase_limited_warranty_claims.claim_decision, purchase_limited_warranty_claims.decision_date, purchase_limited_warranty_claims.component_system, variant_name, registration_state, included_warranty_rental_per_day_usd, included_warranty_rental_max_days]
        note: the nights, cap, credit and secondary-share factors read the latest limited warranty decision; the rate and tax factors read the purchase order.
    compute:
      - lw_repair_order: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'repair_order_number', date_field='decision_date')"
      - auth_failure_date: "LATEST('service_contract_transactions', 'failure_date', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved', repair_order_number=lw_repair_order)"
      - auth_date: "LATEST('service_contract_transactions', 'txn_date', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved', repair_order_number=lw_repair_order)"
      - lw_rental_days: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'rental_days', date_field='decision_date')"
      - lw_decision_date: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'decision_date', date_field='decision_date')"
      - lw_result: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'claim_decision', date_field='decision_date')"
      - counted_nights: "lw_rental_days if (lw_result == 'approved' and lw_rental_days > 0) else (MX(0, DAYS(lw_decision_date, auth_date)) if lw_decision_date else MX(0, DAYS(auth_failure_date, auth_date)))"
      - lw_repair_estimate: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'repair_estimate', date_field='decision_date')"
      - lw_repair_system: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'component_system', date_field='decision_date')"
      - system_repairs_12m: "COUNT('service_contract_transactions', within_months=12, date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved', component_system=lw_repair_system)"
      - night_cap: "(P('rental_max_days_per_claim') + K('major_repair_extra_nights')) if (lw_repair_estimate >= K('major_repair_estimate') and system_repairs_12m >= K('repeat_failure_min_repairs')) else ((P('rental_max_days_per_claim') + K('extended_repair_extra_nights')) if lw_repair_estimate >= K('extended_repair_estimate') else P('rental_max_days_per_claim'))"
      - capped_nights: "MN(counted_nights, night_cap)"
      - vehicle_program: "CFIELD('purchase', 'variant_name', purchase_order_id=F('purchase_order_id'))"
      - daily_rate: "K('compact_class_daily_rate') if (vehicle_program == 'Kestrel Value Line' or vehicle_program == 'Kestrel Inspected') else (K('standard_class_daily_rate') if (vehicle_program == 'Kestrel Certified' or vehicle_program == 'Kestrel Certified Plus') else P('rental_per_day_usd'))"
      - lw_rental_paid: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'rental_amount', date_field='decision_date')"
      - lw_rental_rate: "CPARAM('purchase', 'included_warranty_rental_per_day_usd', purchase_order_id=F('purchase_order_id'))"
      - lw_rental_max: "CPARAM('purchase', 'included_warranty_rental_max_days', purchase_order_id=F('purchase_order_id'))"
      - credited_rental: "(capped_nights * daily_rate - lw_rental_paid) if (lw_rental_paid > 0 and lw_rental_rate < daily_rate) else ((MX(0, capped_nights - MN(lw_rental_days, lw_rental_max)) * daily_rate) if (lw_rental_paid > 0 and lw_rental_rate >= daily_rate) else capped_nights * daily_rate)"
      - rental_state: "CFIELD('purchase', 'registration_state', purchase_order_id=F('purchase_order_id'))"
      - rental_tax_rate: "K('rental_tax_rate_arizona') if rental_state == 'AZ' else (K('rental_tax_rate_texas') if rental_state == 'TX' else 0)"
      - lw_repair_covered: "XLATEST('purchase', 'purchase_limited_warranty_claims', 'covered_amount', date_field='decision_date')"
      - secondary_share: "K('major_secondary_share') if (lw_repair_covered > 0 and lw_repair_covered * 2 >= lw_repair_estimate) else (K('minor_secondary_share') if lw_repair_covered > 0 else 1)"
      - receipt_window_open: "(DAYS(auth_date, NOW) <= P('benefit_receipt_submission_days')) if auth_date else False"
      - rental_already_paid: "COUNT('service_contract_transactions', event_type='warranty_benefit_reimbursed', benefit_type='rental_car', repair_order_number=lw_repair_order)"
      - result: "RND(MX(0, credited_rental * (1 + rental_tax_rate) * secondary_share), 2) if (receipt_window_open and rental_already_paid == 0) else 0"
    compute_basis:
      lw_repair_order: "The repair order a rental reimbursement is figured on is the one named on the holder's latest limited warranty decision, and the plan's approved authorization it reads is the one on that same repair order; while that repair order carries no approved authorization, no rental reimbursement is due on it."
      auth_failure_date: "the nights being counted in calendar days from the failure date on the plan's approved authorization of that repair order to the date of that authorization."
      auth_date: "the nights being counted in calendar days from the failure date on the plan's approved authorization of that repair order to the date of that authorization."
      lw_rental_days: "where the latest limited warranty decision for the holder approved the same repair order and recorded rental days, the nights are those rental days"
      lw_decision_date: "where that limited warranty decision recorded no approved rental days, the nights are counted in calendar days from the date of that limited warranty decision to the date of the plan's authorization"
      lw_result: "where the latest limited warranty decision for the holder approved the same repair order and recorded rental days, the nights are those rental days"
      counted_nights: "The nights are counted as follows: where the latest limited warranty decision for the holder approved the same repair order and recorded rental days, the nights are those rental days; where that limited warranty decision recorded no approved rental days, the nights are counted in calendar days from the date of that limited warranty decision to the date of the plan's authorization; where the holder has no limited warranty decision, the nights are counted from the failure date to the date of the plan's authorization."
      lw_repair_estimate: "where the limited warranty decision's estimate is at or above the major-repair estimate"
      lw_repair_system: "the plan has approved repairs on the same vehicle system at least twice within the last twelve months"
      system_repairs_12m: "the plan has approved repairs on the same vehicle system at least twice within the last twelve months"
      night_cap: "The nights are capped as follows: where the limited warranty decision's estimate is at or above the major-repair estimate and the plan has approved repairs on the same vehicle system at least twice within the last twelve months, the cap is the plan's rental maximum days plus the major-repair extra nights; where the estimate is at or above the extended-repair estimate and the first case does not apply, the cap is the plan's rental maximum days plus the extended-repair extra night; otherwise the cap is the plan's rental maximum days."
      capped_nights: "The nights counted are capped at the plan's rental maximum days per visit."
      vehicle_program: "The daily rate follows the class of the covered vehicle, read from the vehicle program on its purchase order"
      daily_rate: "a vehicle sold as Kestrel Value Line or Kestrel Inspected is reimbursed at the compact-class daily rate; a vehicle sold as Kestrel Certified or Kestrel Certified Plus is reimbursed at the standard-class daily rate; a vehicle sold under any other program is reimbursed at the plan's rental per day."
      lw_rental_paid: "where it paid rental on the same repair order at a daily rate below the daily rate that applies here, the reimbursement is the counted nights at that daily rate less the rental the limited warranty paid"
      lw_rental_rate: "where it paid rental on the same repair order at a daily rate below the daily rate that applies here"
      lw_rental_max: "where it paid rental at a daily rate at or above the daily rate that applies here, the reimbursement covers only the counted nights beyond the nights it paid for, at that daily rate"
      credited_rental: "What the limited warranty already paid for rental is credited as follows: where it paid rental on the same repair order at a daily rate below the daily rate that applies here, the reimbursement is the counted nights at that daily rate less the rental the limited warranty paid; where it paid rental at a daily rate at or above the daily rate that applies here, the reimbursement covers only the counted nights beyond the nights it paid for, at that daily rate; where it paid no rental, the reimbursement is the counted nights at that daily rate."
      rental_state: "Rental sales tax is added at the rate for the state in which the vehicle is registered on its purchase order"
      rental_tax_rate: "the Arizona rental tax rate for Arizona, the Texas rental tax rate for Texas, and no rental sales tax for any other state."
      lw_repair_covered: "the plan's share of the rental follows how much of the repair estimate the limited warranty decision covered"
      secondary_share: "where it covered at least half of the estimate, the plan pays the major-secondary share; where it covered some of the estimate but less than half, the plan pays the minor-secondary share; where it covered nothing, the plan pays the whole reimbursement."
      receipt_window_open: "the rental receipts are accepted within the plan's benefit receipt submission days counted in calendar days from the date of the plan's approved authorization of that repair order"
      rental_already_paid: "and the rental is reimbursed once per repair order."
      result: "The limited warranty's rental is credited first, the rental sales tax is then added to that result, and the secondary share is applied last; the reimbursement is never below zero."
    factors:
      - id: rental_night_count
        effect: method
        decides: counted_nights
        bindings: [lw_rental_days, lw_decision_date, lw_result, counted_nights]
        ladder:
          - when: "the latest limited warranty decision approved the repair order and recorded rental days"
            method: "the nights are the limited warranty's recorded rental days"
          - when: "a limited warranty decision exists but recorded no approved rental days"
            method: "the nights are the calendar days from the limited warranty decision date to the plan's authorization date"
          - when: "otherwise (no limited warranty decision for the holder)"
            method: "the nights are the calendar days from the failure date to the plan's authorization date"
        baseline:
          counted_nights: "MX(0, DAYS(auth_failure_date, auth_date))"
        evidence: [cross_category, date]
        cross_difficulty: purchase
      - id: rental_night_cap
        effect: parameter
        decides: night_cap
        bindings: [lw_repair_estimate, lw_repair_system, system_repairs_12m, night_cap]
        ladder:
          - when: "limited warranty estimate at or above K('major_repair_estimate') AND the plan approved repairs on the same vehicle system at least K('repeat_failure_min_repairs') times in the last twelve months"
            value: "P('rental_max_days_per_claim') + K('major_repair_extra_nights')"
          - when: "estimate at or above K('extended_repair_estimate') and the first tier does not apply"
            value: "P('rental_max_days_per_claim') + K('extended_repair_extra_nights')"
          - when: "otherwise"
            value: "P('rental_max_days_per_claim')"
        baseline:
          night_cap: "P('rental_max_days_per_claim')"
        evidence: [cross_category, history]
        cross_difficulty: purchase
      - id: rental_vehicle_class_rate
        effect: parameter
        decides: daily_rate
        bindings: [vehicle_program, daily_rate]
        ladder:
          - when: "vehicle sold as Kestrel Value Line or Kestrel Inspected"
            value: "K('compact_class_daily_rate')"
          - when: "vehicle sold as Kestrel Certified or Kestrel Certified Plus"
            value: "K('standard_class_daily_rate')"
          - when: "otherwise (any other vehicle program)"
            value: "P('rental_per_day_usd')"
        baseline:
          daily_rate: "P('rental_per_day_usd')"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: limited_warranty_rental_credit
        effect: method
        decides: credited_rental
        bindings: [lw_rental_paid, lw_rental_rate, lw_rental_max, credited_rental]
        ladder:
          - when: "the limited warranty paid rental on the repair order at a daily rate below the rate that applies"
            method: "counted nights times the daily rate, less the rental the limited warranty paid"
          - when: "the limited warranty paid rental at a daily rate at or above the rate that applies"
            method: "only the counted nights beyond the nights the limited warranty paid for, times the daily rate"
          - when: "otherwise (no limited warranty rental paid)"
            method: "counted nights times the daily rate"
        baseline:
          credited_rental: "capped_nights * daily_rate"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: rental_sales_tax
        effect: parameter
        decides: rental_tax_rate
        bindings: [rental_state, rental_tax_rate]
        ladder:
          - when: "vehicle registered in Arizona"
            value: "K('rental_tax_rate_arizona')"
          - when: "vehicle registered in Texas"
            value: "K('rental_tax_rate_texas')"
          - when: "otherwise"
            value: "0"
        baseline:
          rental_tax_rate: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: rental_secondary_share
        effect: parameter
        decides: secondary_share
        bindings: [lw_repair_covered, secondary_share]
        ladder:
          - when: "the limited warranty covered at least half of the repair estimate"
            value: "K('major_secondary_share')"
          - when: "it covered some of the estimate but less than half"
            value: "K('minor_secondary_share')"
          - when: "otherwise (it covered nothing)"
            value: "1"
        baseline:
          secondary_share: "1"
        evidence: [cross_category]
        cross_difficulty: purchase
    baseline:
      rule: >-
        A rental car reimbursement on an approved repair order pays the plan's rental per day for each night counted
        on the repair order, the nights being counted in calendar days from the failure date on the plan's approved
        authorization of that repair order to the date of that authorization. The nights counted are capped at the
        plan's rental maximum days per visit. The reimbursement is the capped nights times the plan's rental per
        day, rounded to the cent.
      params: [rental_per_day_usd, rental_max_days_per_claim]
    inputs:
      history:
        - {table: service_contract_transactions, aggregate: latest, field: failure_date, within_months: null, filters: {event_type: warranty_claim_adjudicated, claim_decision: approved}}
        - {table: service_contract_transactions, aggregate: count, field: component_system, within_months: 12, filters: {event_type: warranty_claim_adjudicated, claim_decision: approved}}
        - {category: purchase, table: purchase_limited_warranty_claims, aggregate: latest, field: rental_days, within_months: null, filters: {}}
      cross_category: [purchase]

  - id: warranty_ext_cancellation_settlement
    base_policy_refs: [warranty_cancellation]
    overwrite:
      - base_policy: warranty_cancellation
        superseded_clause: >-
          The request date is the cancellation effective date;
        replaced_by: >-
          The plan's cancellation takes effect on the day to which its use is counted.
      - base_policy: warranty_cancellation
        superseded_clause: >-
          Otherwise the refund is pro rata: the used share is the greater of the days used over the term days and the
          miles used over the term miles; the refund is the price times one minus the used share, less the
          cancellation fee, less net claims paid when the plan deducts claims, rounded to the cent and never below
          zero.
        replaced_by: >-
          The fee charged is the fee set by the reason times the holder's fee share; the pro rata refund is the plan
          price times one minus the used share, less that fee, less the claims charged, rounded to the cent only at
          the end and never below zero.
      - base_policy: warranty_cancellation
        superseded_clause: >-
          A cancellation refund is issued only on a plan whose status is cancelled.
        replaced_by: >-
          The refund is issued in the same booking that cancels the plan, on the holder's confirmed cancellation
          request.
    trigger: on_request
    subject: [warranty_contract_cancelled, warranty_cancellation_refund_issued]
    computes: refund_amount
    target_tool: cancel_plan_with_refund_1804bd93
    params:
      vehicle_sold_fee: 25.00
      trade_in_fee_share: 0.5
      repeat_buyer_fee_share: 0.75
    rule: >-
      A cancellation refund is fixed only after every repair order that a limited warranty decision for the holder
      left wholly or partly unpaid carries a KestrelCare authorization decision on the plan.
      A cancellation refund is not worked out until each repair order whose limited warranty decision recorded
      approved rental days, and which carries either no KestrelCare decision yet or an approved one dated no more
      than the plan's benefit receipt submission days before the refund is worked out, carries a rental car
      reimbursement entry on the plan.
      The refund is issued in the same booking that cancels the plan, on the holder's confirmed cancellation
      request. The plan's cancellation takes effect on the day to which its use is counted. When the reason on the
      request is that the vehicle was returned under the 7-day return, or when the request date is within the
      plan's free-look days counted from the sale date and no claim has been paid on the plan, the refund is the
      full plan price; every other cancellation is settled pro rata.
      A cancellation is settled pro rata on the plan price. The used share is the greater of two fractions: the
      calendar days from the plan's sale date to the cancellation request date over the calendar days from the
      sale date to the expiration date, and the miles from the odometer at sale to the odometer on the cancellation
      request over the plan's term miles. The refund is the plan price times one minus the used share, less the
      plan's cancellation fee, less the claim payments on the plan net of payments recovered when the plan deducts
      claims, rounded to the cent and never below zero.
      The day from which the plan's use is counted is set as follows: for a plan sold with the vehicle whose
      handover date on the purchase order is later than the plan's sale date, use is counted from that handover
      date; for a plan bought after the vehicle was handed over, use is counted from the plan's coverage start
      date; for a plan sold with the vehicle and handed over on its sale date, use is counted from the sale date.
      The day to which the plan's use is counted is set as follows: where the covered vehicle was traded in to
      Kestrel, use is counted to the pickup date on that trade-in agreement; where the covered vehicle came back to
      Kestrel under a 7-day return, use is counted to the date its purchase order closed as returned; otherwise use
      is counted to the cancellation request date.
      The time fraction is measured as follows: for a vehicle registered in Arizona or Colorado on its purchase
      order, it is the whole months of use, a month counting only once its day of the month is reached, over the
      plan's term months; for a vehicle registered in Texas or Florida, it is the whole months of use plus one over
      the plan's term months; for a vehicle registered in any other state, it is the calendar days of use over the
      calendar days from the sale date to the expiration date.
      The cancellation fee follows the reason on the cancellation request: a plan cancelled because the vehicle was
      a total loss carries no fee; a plan cancelled because the vehicle was sold carries the vehicle-sold fee; any
      other reason carries the plan's cancellation fee.
      The fee is reduced for a holder who stays with Kestrel: where the covered vehicle was traded in to Kestrel
      toward another Kestrel purchase order that has been handed over, the holder pays the trade-in fee share;
      where the covered vehicle was not traded in to Kestrel but the holder has another Kestrel purchase order
      handed over and still delivered, the holder pays the repeat-buyer fee share; otherwise the holder pays the
      whole fee.
      The claims charged against the refund are counted as follows: where the plan deducts claims and rental,
      towing or trip interruption reimbursements have been paid on the plan, the charge is the claim payments net
      of payments recovered, plus the approved authorizations not yet matched by claim payments (the approved
      amounts less the claim payments, never below zero), plus those reimbursements; where the plan deducts claims
      and no such reimbursement has been paid, the charge is the claim payments net of payments recovered plus the
      approved authorizations not yet matched by claim payments; a plan that does not deduct claims is charged
      nothing.
      The fee charged is the fee set by the reason times the holder's fee share; the pro rata refund is the plan
      price times one minus the used share, less that fee, less the claims charged, rounded to the cent only at the
      end and never below zero.
      This settlement pays the refund to the holder; while a financed plan's finance contract is still active the
      refund belongs to Kestrel Auto Finance as lienholder and is not settled through this booking.
    prerequisite:
      - problem: warranty_ext_stack_remainder_authorization
        kind: value_input
        gate: approved_total
        form: state
        policy_source: >-
          A cancellation refund is fixed only after every repair order that a limited warranty decision for the holder
          left wholly or partly unpaid carries a KestrelCare authorization decision on the plan.
        condition: >-
          For every repair order on which a limited warranty decision for the holder covered less than the repair
          estimate, the plan's ledger carries a claim decision entry with the same repair order number.
        resolved_by: authorize_stack_remainder_2296c771
        effect: >-
          The approved remainder authorization enters the approved amounts the claims charge counts, so the claims
          charged against the refund rise by the approved amount not yet matched by a claim payment.
      - problem: warranty_ext_rental_reimbursement_settlement
        kind: value_input
        gate: benefits_paid
        form: state
        policy_source: >-
          A cancellation refund is not worked out until each repair order whose limited warranty decision recorded
          approved rental days, and which carries either no KestrelCare decision yet or an approved one dated no more
          than the plan's benefit receipt submission days before the refund is worked out, carries a rental car
          reimbursement entry on the plan.
        condition: >-
          For every repair order whose limited warranty decision is approved with rental days above zero and whose
          KestrelCare decision is either absent or an approval dated no more than the plan's benefit receipt
          submission days before the day the refund is worked out, the plan's ledger carries a reimbursement entry of
          benefit type rental car with the same repair order number.
        resolved_by: file_rental_reimbursement_5fdd83af
        effect: >-
          The rental reimbursement enters the reimbursements the claims charge counts, so the claims charged against
          the refund rise by the rental reimbursed.
    cross_category:
      - category: purchase
        as: branch
        reads: [handover_date, closed_date, status, registration_state]
        note: the use-start factor reads the handover date, the time-basis factor the registration state, the fee-share factor the status of the order the trade-in went toward.
      - category: tradein
        as: branch
        reads: [pickup_date, purchase_order_id, trade_vin]
        note: the use-end factor reads the trade-in pickup date for the covered VIN; the fee-share factor reads the order it went toward.
    compute:
      - req_date: "LATEST('service_contract_cancellations', 'request_date', date_field='request_date', request_status='confirmed')"
      - req_odometer: "LATEST('service_contract_cancellations', 'odometer_at_request', date_field='request_date', request_status='confirmed')"
      - req_reason: "LATEST('service_contract_cancellations', 'cancellation_reason', date_field='request_date', request_status='confirmed')"
      - claims_paid: "SUM('service_contract_transactions', 'amount', event_type='warranty_claim_paid')"
      - claims_recovered: "SUM('service_contract_transactions', 'amount', event_type='warranty_claim_payment_recovered')"
      - approved_total: "SUM('service_contract_transactions', 'amount', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - benefits_paid: "SUM('service_contract_transactions', 'amount', event_type='warranty_benefit_reimbursed')"
      - full_refund: "(req_reason == 'vehicle_returned') or (DAYS(F('sale_date'), req_date) <= P('free_look_days') and claims_paid == 0)"
      - purchase_handover: "CFIELD('purchase', 'handover_date', purchase_order_id=F('purchase_order_id'))"
      - use_start: "purchase_handover if (F('sold_with_vehicle') and purchase_handover and purchase_handover > F('sale_date')) else (F('coverage_start_date') if not F('sold_with_vehicle') else F('sale_date'))"
      - trade_pickup: "CFIELD('tradein', 'pickup_date', trade_vin=F('vin'))"
      - returned_close: "CFIELD('purchase', 'closed_date', purchase_order_id=F('purchase_order_id'), status='returned')"
      - use_end: "trade_pickup if trade_pickup else (returned_close if returned_close else req_date)"
      - term_days: "DAYS(F('sale_date'), F('expiration_date'))"
      - registered_state: "CFIELD('purchase', 'registration_state', purchase_order_id=F('purchase_order_id'))"
      - time_fraction: "(MX(0, MONTHS(use_start, use_end)) / F('term_months')) if (registered_state == 'AZ' or registered_state == 'CO') else (((MX(0, MONTHS(use_start, use_end)) + 1) / F('term_months')) if (registered_state == 'TX' or registered_state == 'FL') else (MX(0, DAYS(use_start, use_end)) / term_days))"
      - miles_fraction: "MX(0, req_odometer - F('odometer_at_sale')) / F('term_miles')"
      - used_share: "MX(time_fraction, miles_fraction)"
      - reason_fee: "0 if req_reason == 'vehicle_total_loss' else (K('vehicle_sold_fee') if req_reason == 'vehicle_sold' else P('cancellation_fee_usd'))"
      - trade_target: "CFIELD('tradein', 'purchase_order_id', trade_vin=F('vin'))"
      - trade_target_status: "CFIELD('purchase', 'status', purchase_order_id=trade_target)"
      - other_delivered: "CFIELD('purchase', 'handover_date', status='delivered')"
      - other_delivered_vin: "CFIELD('purchase', 'vin', status='delivered')"
      - fee_share: "K('trade_in_fee_share') if (trade_target and (trade_target_status == 'delivered' or trade_target_status == 'completed')) else (K('repeat_buyer_fee_share') if ((not trade_target) and other_delivered and other_delivered_vin != F('vin')) else 1)"
      - claims_charge: "(claims_paid - claims_recovered + MX(0, approved_total - claims_paid) + benefits_paid) if (P('claims_deducted_from_refund') and benefits_paid > 0) else ((claims_paid - claims_recovered + MX(0, approved_total - claims_paid)) if P('claims_deducted_from_refund') else 0)"
      - result: "RND(F('contract_price'), 2) if full_refund else RND(MX(0, F('contract_price') * (1 - used_share) - reason_fee * fee_share - claims_charge), 2)"
    compute_basis:
      req_date: "the calendar days from the plan's sale date to the cancellation request date over the calendar days from the sale date to the expiration date"
      req_odometer: "the miles from the odometer at sale to the odometer on the cancellation request over the plan's term miles."
      req_reason: "The cancellation fee follows the reason on the cancellation request"
      claims_paid: "less the claim payments on the plan net of payments recovered when the plan deducts claims, rounded to the cent and never below zero."
      claims_recovered: "less the claim payments on the plan net of payments recovered when the plan deducts claims, rounded to the cent and never below zero."
      approved_total: "plus the approved authorizations not yet matched by claim payments (the approved amounts less the claim payments, never below zero)"
      benefits_paid: "where the plan deducts claims and rental, towing or trip interruption reimbursements have been paid on the plan"
      full_refund: "When the reason on the request is that the vehicle was returned under the 7-day return, or when the request date is within the plan's free-look days counted from the sale date and no claim has been paid on the plan, the refund is the full plan price; every other cancellation is settled pro rata."
      purchase_handover: "for a plan sold with the vehicle whose handover date on the purchase order is later than the plan's sale date, use is counted from that handover date"
      use_start: "The day from which the plan's use is counted is set as follows: for a plan sold with the vehicle whose handover date on the purchase order is later than the plan's sale date, use is counted from that handover date; for a plan bought after the vehicle was handed over, use is counted from the plan's coverage start date; for a plan sold with the vehicle and handed over on its sale date, use is counted from the sale date."
      trade_pickup: "where the covered vehicle was traded in to Kestrel, use is counted to the pickup date on that trade-in agreement"
      returned_close: "where the covered vehicle came back to Kestrel under a 7-day return, use is counted to the date its purchase order closed as returned"
      use_end: "The day to which the plan's use is counted is set as follows: where the covered vehicle was traded in to Kestrel, use is counted to the pickup date on that trade-in agreement; where the covered vehicle came back to Kestrel under a 7-day return, use is counted to the date its purchase order closed as returned; otherwise use is counted to the cancellation request date."
      term_days: "the calendar days from the plan's sale date to the cancellation request date over the calendar days from the sale date to the expiration date"
      registered_state: "The time fraction is measured as follows: for a vehicle registered in Arizona or Colorado on its purchase order"
      time_fraction: "The time fraction is measured as follows: for a vehicle registered in Arizona or Colorado on its purchase order, it is the whole months of use, a month counting only once its day of the month is reached, over the plan's term months; for a vehicle registered in Texas or Florida, it is the whole months of use plus one over the plan's term months; for a vehicle registered in any other state, it is the calendar days of use over the calendar days from the sale date to the expiration date."
      miles_fraction: "the miles from the odometer at sale to the odometer on the cancellation request over the plan's term miles."
      used_share: "The used share is the greater of two fractions"
      reason_fee: "The cancellation fee follows the reason on the cancellation request: a plan cancelled because the vehicle was a total loss carries no fee; a plan cancelled because the vehicle was sold carries the vehicle-sold fee; any other reason carries the plan's cancellation fee."
      trade_target: "where the covered vehicle was traded in to Kestrel toward another Kestrel purchase order that has been handed over, the holder pays the trade-in fee share"
      trade_target_status: "where the covered vehicle was traded in to Kestrel toward another Kestrel purchase order that has been handed over, the holder pays the trade-in fee share"
      other_delivered: "where the covered vehicle was not traded in to Kestrel but the holder has another Kestrel purchase order handed over and still delivered, the holder pays the repeat-buyer fee share"
      other_delivered_vin: "where the covered vehicle was not traded in to Kestrel but the holder has another Kestrel purchase order handed over and still delivered, the holder pays the repeat-buyer fee share"
      fee_share: "The fee is reduced for a holder who stays with Kestrel: where the covered vehicle was traded in to Kestrel toward another Kestrel purchase order that has been handed over, the holder pays the trade-in fee share; where the covered vehicle was not traded in to Kestrel but the holder has another Kestrel purchase order handed over and still delivered, the holder pays the repeat-buyer fee share; otherwise the holder pays the whole fee."
      claims_charge: "The claims charged against the refund are counted as follows: where the plan deducts claims and rental, towing or trip interruption reimbursements have been paid on the plan, the charge is the claim payments net of payments recovered, plus the approved authorizations not yet matched by claim payments (the approved amounts less the claim payments, never below zero), plus those reimbursements; where the plan deducts claims and no such reimbursement has been paid, the charge is the claim payments net of payments recovered plus the approved authorizations not yet matched by claim payments; a plan that does not deduct claims is charged nothing."
      result: "The fee charged is the fee set by the reason times the holder's fee share; the pro rata refund is the plan price times one minus the used share, less that fee, less the claims charged, rounded to the cent only at the end and never below zero."
    factors:
      - id: use_start_day
        effect: parameter
        decides: use_start
        bindings: [purchase_handover, use_start]
        ladder:
          - when: "plan sold with the vehicle and the purchase order's handover date is later than the plan's sale date"
            value: "use is counted from the handover date on the purchase order"
          - when: "plan bought after the vehicle was handed over"
            value: "use is counted from the plan's coverage start date"
          - when: "otherwise (plan sold with the vehicle and handed over on its sale date)"
            value: "use is counted from the plan's sale date"
        baseline:
          use_start: "F('sale_date')"
        evidence: [cross_category, date]
        cross_difficulty: purchase
      - id: use_end_day
        effect: parameter
        decides: use_end
        bindings: [trade_pickup, returned_close, use_end]
        ladder:
          - when: "the covered vehicle was traded in to Kestrel"
            value: "use is counted to the trade-in agreement's pickup date"
          - when: "the covered vehicle came back to Kestrel under a 7-day return"
            value: "use is counted to the date the purchase order closed as returned"
          - when: "otherwise"
            value: "use is counted to the cancellation request date"
        baseline:
          use_end: "req_date"
        evidence: [cross_category, date]
        cross_difficulty: tradein
      - id: time_fraction_basis
        effect: method
        decides: time_fraction
        bindings: [registered_state, time_fraction]
        ladder:
          - when: "vehicle registered in Arizona or Colorado on its purchase order"
            method: "whole months of use (a month counts once its day of the month is reached) over the term months"
          - when: "vehicle registered in Texas or Florida"
            method: "whole months of use plus one over the term months"
          - when: "otherwise (any other registration state)"
            method: "calendar days of use over the calendar days from sale date to expiration date"
        baseline:
          time_fraction: "MX(0, DAYS(use_start, use_end)) / term_days"
        evidence: [cross_category, date]
        cross_difficulty: purchase
      - id: cancellation_reason_fee
        effect: parameter
        decides: reason_fee
        bindings: [req_reason, reason_fee]
        ladder:
          - when: "cancellation reason on the request is vehicle total loss"
            value: "0"
          - when: "cancellation reason is vehicle sold"
            value: "K('vehicle_sold_fee')"
          - when: "otherwise (any other reason)"
            value: "P('cancellation_fee_usd')"
        baseline:
          reason_fee: "P('cancellation_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: kestrel_relationship_fee_share
        effect: parameter
        decides: fee_share
        bindings: [trade_target, trade_target_status, other_delivered, other_delivered_vin, fee_share]
        ladder:
          - when: "the covered vehicle was traded in to Kestrel AND the purchase order it went toward has been handed over (delivered or completed)"
            value: "K('trade_in_fee_share')"
          - when: "the covered vehicle was not traded in to Kestrel AND the holder has another Kestrel purchase order handed over and still delivered"
            value: "K('repeat_buyer_fee_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          fee_share: "1"
        evidence: [cross_category]
        cross_difficulty: tradein
      - id: claims_charge_composition
        effect: method
        decides: claims_charge
        bindings: [claims_recovered, benefits_paid, claims_charge]
        ladder:
          - when: "the plan deducts claims AND rental, towing or trip interruption reimbursements have been paid on the plan"
            method: "claim payments net of recoveries, plus approved authorizations not yet matched by payments, plus those reimbursements"
          - when: "the plan deducts claims AND no such reimbursement has been paid"
            method: "claim payments net of recoveries, plus approved authorizations not yet matched by payments"
          - when: "otherwise (the plan does not deduct claims)"
            method: "nothing is charged"
        baseline:
          claims_charge: "(claims_paid - claims_recovered) if P('claims_deducted_from_refund') else 0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A cancellation is settled pro rata on the plan price. The used share is the greater of two fractions: the
        calendar days from the plan's sale date to the cancellation request date over the calendar days from the
        sale date to the expiration date, and the miles from the odometer at sale to the odometer on the
        cancellation request over the plan's term miles. The refund is the plan price times one minus the used
        share, less the plan's cancellation fee, less the claim payments on the plan net of payments recovered when
        the plan deducts claims, rounded to the cent and never below zero.
      params: [cancellation_fee_usd, claims_deducted_from_refund]
    inputs:
      history:
        - {table: service_contract_transactions, aggregate: sum, field: amount, within_months: null, filters: {event_type: warranty_claim_paid}}
        - {table: service_contract_transactions, aggregate: sum, field: amount, within_months: null, filters: {event_type: warranty_claim_adjudicated, claim_decision: approved}}
        - {table: service_contract_transactions, aggregate: sum, field: amount, within_months: null, filters: {event_type: warranty_benefit_reimbursed}}
        - {table: service_contract_cancellations, aggregate: latest, field: request_date, within_months: null, filters: {request_status: confirmed}}
      cross_category: [purchase, tradein]

  - id: warranty_ext_claim_overpayment_recovery
    base_policy_refs: [warranty_claims]
    overwrite:
      - base_policy: warranty_claims
        superseded_clause: >-
          A payment found to have been made in error within the payment recovery window is recovered and the limit
          restored.
        replaced_by: >-
          The recovery is the error measured as above, times the aged-recovery share, times the facility collection
          share, plus the repeat-error handling charge, rounded to the cent only at the end; the amount recovered
          restores the coverage remaining.
    trigger: state_due
    subject: [warranty_claim_payment_recovered]
    computes: recovery_amount
    target_tool: recover_overpaid_claim_bcfb33cc
    params:
      aged_days_short: 30
      aged_days_long: 90
      aged_share_mid: 0.9
      aged_share_old: 0.75
      collection_share_independent: 0.95
      collection_share_franchise: 0.98
      handling_charge_single: 25.00
      handling_charge_multiple: 50.00
    rule: >-
      A claim payment made in error is recovered from the facility that received it, starting from the most recent
      claim payment on the plan and the decision that payment settled.
      The recovery on a claim payment made in error is the whole payment. The payment must be within the plan's
      payment recovery window counted in calendar days from the payment date, and the recovery is rounded to the
      cent.
      The error is measured as follows: where the payment settled an approved decision and exceeds the amount that
      decision approved, the error is the part of the payment above the approved amount; where the payment settled
      an approved decision and does not exceed it but exceeds the coverage remaining the plan held before the
      payment, the error is the part of the payment above that coverage remaining; in every other case the error is
      the whole payment.
      An aged-recovery share then applies, counted in calendar days from the payment date to the day of the
      recovery: beyond the long aged-recovery days and within the recovery window the plan recovers the old-payment
      share; beyond the short aged-recovery days but not beyond the long aged-recovery days it recovers the
      mid-age share; within the short aged-recovery days it recovers the whole error.
      A facility collection share then applies, read from the facility type on the decision the payment settled:
      an independent licensed repair shop is charged the independent collection share, a franchised dealer the
      franchise collection share, and a Kestrel network facility the whole amount.
      A repeat-error handling charge is added for a facility relationship that has already needed recoveries,
      counted from the recoveries booked on the plan in the last twelve months: two or more add the multiple-error
      handling charge, exactly one adds the single-error handling charge, and none adds nothing.
      The recovery is the error measured as above, times the aged-recovery share, times the facility collection
      share, plus the repeat-error handling charge, rounded to the cent only at the end; the amount recovered
      restores the coverage remaining.
    prerequisite: []
    cross_category: []
    compute:
      - last_payment_amount: "LATEST('service_contract_transactions', 'amount', date_field='txn_date', event_type='warranty_claim_paid')"
      - last_payment_date: "LATEST('service_contract_transactions', 'txn_date', date_field='txn_date', event_type='warranty_claim_paid')"
      - last_payment_source: "LATEST('service_contract_transactions', 'source_txn_id', date_field='txn_date', event_type='warranty_claim_paid')"
      - settled_decision_amount: "SUM('service_contract_transactions', 'amount', event_type='warranty_claim_adjudicated', warranty_txn_id=last_payment_source)"
      - settled_decision_result: "LATEST('service_contract_transactions', 'claim_decision', date_field='txn_date', event_type='warranty_claim_adjudicated', warranty_txn_id=last_payment_source)"
      - settled_facility: "LATEST('service_contract_transactions', 'repair_facility_type', date_field='txn_date', event_type='warranty_claim_adjudicated', warranty_txn_id=last_payment_source)"
      - coverage_before_payment: "F('coverage_remaining') + last_payment_amount"
      - payment_error: "(last_payment_amount - settled_decision_amount) if (settled_decision_result == 'approved' and last_payment_amount > settled_decision_amount) else ((last_payment_amount - coverage_before_payment) if (settled_decision_result == 'approved' and last_payment_amount > coverage_before_payment) else last_payment_amount)"
      - payment_age_days: "DAYS(last_payment_date, NOW)"
      - aged_share: "K('aged_share_old') if payment_age_days > K('aged_days_long') else (K('aged_share_mid') if payment_age_days > K('aged_days_short') else 1)"
      - collection_share: "K('collection_share_independent') if settled_facility == 'independent_licensed' else (K('collection_share_franchise') if settled_facility == 'franchise_dealer' else 1)"
      - recoveries_12m: "COUNT('service_contract_transactions', within_months=12, date_field='txn_date', event_type='warranty_claim_payment_recovered')"
      - handling_charge: "K('handling_charge_multiple') if recoveries_12m >= 2 else (K('handling_charge_single') if recoveries_12m == 1 else 0)"
      - in_window: "payment_age_days <= P('payment_recovery_window_days')"
      - result: "RND(payment_error * aged_share * collection_share + handling_charge, 2) if in_window else 0"
    compute_basis:
      last_payment_amount: "A claim payment made in error is recovered from the facility that received it, starting from the most recent claim payment on the plan and the decision that payment settled."
      last_payment_date: "The payment must be within the plan's payment recovery window counted in calendar days from the payment date, and the recovery is rounded to the cent."
      last_payment_source: "starting from the most recent claim payment on the plan and the decision that payment settled."
      settled_decision_amount: "where the payment settled an approved decision and exceeds the amount that decision approved, the error is the part of the payment above the approved amount"
      settled_decision_result: "where the payment settled an approved decision and exceeds the amount that decision approved"
      settled_facility: "A facility collection share then applies, read from the facility type on the decision the payment settled"
      coverage_before_payment: "but exceeds the coverage remaining the plan held before the payment, the error is the part of the payment above that coverage remaining"
      payment_error: "The error is measured as follows: where the payment settled an approved decision and exceeds the amount that decision approved, the error is the part of the payment above the approved amount; where the payment settled an approved decision and does not exceed it but exceeds the coverage remaining the plan held before the payment, the error is the part of the payment above that coverage remaining; in every other case the error is the whole payment."
      payment_age_days: "An aged-recovery share then applies, counted in calendar days from the payment date to the day of the recovery"
      aged_share: "beyond the long aged-recovery days and within the recovery window the plan recovers the old-payment share; beyond the short aged-recovery days but not beyond the long aged-recovery days it recovers the mid-age share; within the short aged-recovery days it recovers the whole error."
      collection_share: "an independent licensed repair shop is charged the independent collection share, a franchised dealer the franchise collection share, and a Kestrel network facility the whole amount."
      recoveries_12m: "counted from the recoveries booked on the plan in the last twelve months"
      handling_charge: "two or more add the multiple-error handling charge, exactly one adds the single-error handling charge, and none adds nothing."
      in_window: "The payment must be within the plan's payment recovery window counted in calendar days from the payment date, and the recovery is rounded to the cent."
      result: "The recovery is the error measured as above, times the aged-recovery share, times the facility collection share, plus the repeat-error handling charge, rounded to the cent only at the end; the amount recovered restores the coverage remaining."
    factors:
      - id: payment_error_measure
        effect: method
        decides: payment_error
        bindings: [settled_decision_amount, settled_decision_result, coverage_before_payment, payment_error]
        ladder:
          - when: "the payment settled an approved decision and exceeds the amount it approved"
            method: "the error is the part of the payment above the approved amount"
          - when: "the payment settled an approved decision, does not exceed it, but exceeds the coverage remaining held before the payment"
            method: "the error is the part of the payment above that coverage remaining"
          - when: "otherwise"
            method: "the error is the whole payment"
        baseline:
          payment_error: "last_payment_amount"
        evidence: [history]
        cross_difficulty: null
      - id: aged_recovery_share
        effect: parameter
        decides: aged_share
        bindings: [last_payment_date, payment_age_days, aged_share]
        ladder:
          - when: "more than K('aged_days_long') days since the payment (within the recovery window)"
            value: "K('aged_share_old')"
          - when: "more than K('aged_days_short') and at most K('aged_days_long') days"
            value: "K('aged_share_mid')"
          - when: "otherwise (at most K('aged_days_short') days)"
            value: "1"
        baseline:
          aged_share: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: facility_collection_share
        effect: parameter
        decides: collection_share
        bindings: [settled_facility, collection_share]
        ladder:
          - when: "the settled decision's facility is an independent licensed repair shop"
            value: "K('collection_share_independent')"
          - when: "the facility is a franchised dealer"
            value: "K('collection_share_franchise')"
          - when: "otherwise (Kestrel network facility)"
            value: "1"
        baseline:
          collection_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_error_handling
        effect: parameter
        decides: handling_charge
        bindings: [recoveries_12m, handling_charge]
        ladder:
          - when: "two or more recoveries booked on the plan in the last twelve months"
            value: "K('handling_charge_multiple')"
          - when: "exactly one recovery in the last twelve months"
            value: "K('handling_charge_single')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          handling_charge: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The recovery on a claim payment made in error is the whole payment. The payment must be within the plan's
        payment recovery window counted in calendar days from the payment date, and the recovery is rounded to the
        cent.
      params: [payment_recovery_window_days]
    inputs:
      history:
        - {table: service_contract_transactions, aggregate: latest, field: amount, within_months: null, filters: {event_type: warranty_claim_paid}}
        - {table: service_contract_transactions, aggregate: count, field: warranty_txn_id, within_months: 12, filters: {event_type: warranty_claim_payment_recovered}}
      cross_category: []

  - id: warranty_ext_diagnostic_time_payment
    base_policy_refs: [warranty_claims]
    overwrite:
      - base_policy: warranty_claims
        superseded_clause: >-
          Otherwise the claim is approved: the estimate is recognized at no more than the plan's labor rate cap,
          diagnostic time only when the plan covers it, the deductible is applied once per visit unless waived at a
          Kestrel network facility, and the amount payable is the lesser of the recognized estimate less the
          deductible, the plan's per-visit limit and the coverage remaining.
        replaced_by: >-
          The diagnostic time payment is the payable diagnostic hours times the diagnostic hourly rate, rounded to
          the cent, and never above the coverage remaining on the plan.
    trigger: state_due
    subject: [warranty_claim_paid]
    computes: payment_amount
    target_tool: pay_diagnostic_time_6cc9f33c
    params:
      powertrain_diagnostic_hours: 2.0
      electronic_diagnostic_hours: 2.5
      dealer_diagnostic_premium: 20.00
      network_diagnostic_rate: 95.00
      premium_program_extra_hours: 1.0
      certified_program_extra_hours: 0.5
      extended_diagnosis_days: 2
      prolonged_diagnosis_days: 5
      extended_diagnosis_extra_hours: 1.0
      prolonged_diagnosis_multiplier: 1.5
      repeat_diagnosis_share_short: 0.5
      repeat_diagnosis_share_long: 0.75
    rule: >-
      A diagnostic time payment is not booked until every claim payment on the plan that exceeds the approved amount
      of the decision it settled carries a recovery entry.
      When the plan covers diagnostic time and the repair it diagnosed is approved, the facility's diagnostic time on
      that repair order is paid to the facility as its own claim payment, read from the plan's most recent approved
      decision: its repair order, failure date, decision date, vehicle system and facility type.
      The diagnostic time paid on an approved repair order is one hour at the plan's labor rate cap. The diagnostic
      time payment is the payable diagnostic hours times the diagnostic hourly rate, rounded to the cent, and never
      above the coverage remaining on the plan.
      The diagnostic hours follow the vehicle system of the repair: a repair on the engine or the transmission is
      paid the powertrain diagnostic hours; a repair on the electrical system, the high-tech electronics or a hybrid
      or electric drive system is paid the electronic diagnostic hours; a repair on any other system is paid one
      hour.
      The vehicle program on the covered vehicle's purchase order adds diagnostic hours for the equipment its
      programs require: a vehicle sold as Kestrel Premium Certified or Kestrel Factory Certified adds the
      premium-program hours; a vehicle sold as Kestrel Certified or Kestrel Certified Plus adds the
      certified-program hours; any other program adds none.
      The hours are then adjusted for a long diagnosis, counted in calendar days from the failure date to the
      decision date: beyond the prolonged-diagnosis days the hours are multiplied by the prolonged-diagnosis
      multiplier; beyond the extended-diagnosis days but not beyond the prolonged-diagnosis days the
      extended-diagnosis hours are added; otherwise the hours stand as they are.
      A repeat-diagnosis share then applies to the hours, counted from the plan's approved decisions on the same
      vehicle system before this repair order: where one was decided within the last three months the hours are
      paid at the short repeat-diagnosis share; where one was decided within the last twelve months but none within
      three months they are paid at the long repeat-diagnosis share; otherwise they are paid in full.
      The diagnostic hourly rate follows the facility type on the decision: a franchised dealer is paid the plan's
      labor rate cap plus the dealer diagnostic premium; a Kestrel network facility is paid the network diagnostic
      rate; any other facility is paid the plan's labor rate cap.
      The hours by vehicle system and the program hours are added first, the long-diagnosis adjustment is applied
      to that sum, and the repeat-diagnosis share is applied last; the payable hours are then multiplied by the
      hourly rate.
    prerequisite:
      - problem: warranty_ext_claim_overpayment_recovery
        kind: state_gate
        gate: service_contract_transactions.event_type
        form: state
        policy_source: >-
          A diagnostic time payment is not booked until every claim payment on the plan that exceeds the approved
          amount of the decision it settled carries a recovery entry.
        condition: >-
          Every claim payment entry on the plan whose amount exceeds the amount of the approved decision named as its
          source carries a payment recovery entry naming that payment as its source.
        resolved_by: recover_overpaid_claim_bcfb33cc
        effect: >-
          Once the overpaid claim payment carries its recovery, payments to facilities on the plan are no longer held
          and the diagnostic time payment may be booked.
    cross_category:
      - category: purchase
        as: branch
        reads: [variant_name]
        note: the program-hours factor reads the vehicle program on the covered vehicle's purchase order.
    compute:
      - diag_decision_system: "LATEST('service_contract_transactions', 'component_system', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - diag_failure_date: "LATEST('service_contract_transactions', 'failure_date', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - diag_decision_date: "LATEST('service_contract_transactions', 'txn_date', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - diag_facility: "LATEST('service_contract_transactions', 'repair_facility_type', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - system_hours: "K('powertrain_diagnostic_hours') if (diag_decision_system == 'engine' or diag_decision_system == 'transmission') else (K('electronic_diagnostic_hours') if (diag_decision_system == 'electrical' or diag_decision_system == 'high_tech_electronics' or diag_decision_system == 'hybrid_ev_drive_system') else 1)"
      - diag_program: "CFIELD('purchase', 'variant_name', purchase_order_id=F('purchase_order_id'))"
      - program_hours: "K('premium_program_extra_hours') if (diag_program == 'Kestrel Premium Certified' or diag_program == 'Kestrel Factory Certified') else (K('certified_program_extra_hours') if (diag_program == 'Kestrel Certified' or diag_program == 'Kestrel Certified Plus') else 0)"
      - diagnosis_days: "DAYS(diag_failure_date, diag_decision_date)"
      - adjusted_hours: "((system_hours + program_hours) * K('prolonged_diagnosis_multiplier')) if diagnosis_days > K('prolonged_diagnosis_days') else ((system_hours + program_hours + K('extended_diagnosis_extra_hours')) if diagnosis_days > K('extended_diagnosis_days') else (system_hours + program_hours))"
      - same_system_decisions_3m: "COUNT('service_contract_transactions', within_months=3, date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved', component_system=diag_decision_system) - 1"
      - same_system_decisions_12m: "COUNT('service_contract_transactions', within_months=12, date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved', component_system=diag_decision_system) - 1"
      - repeat_diagnosis_share: "K('repeat_diagnosis_share_short') if same_system_decisions_3m >= 1 else (K('repeat_diagnosis_share_long') if same_system_decisions_12m >= 1 else 1)"
      - diagnostic_rate: "(P('labor_rate_cap_usd') + K('dealer_diagnostic_premium')) if diag_facility == 'franchise_dealer' else (K('network_diagnostic_rate') if diag_facility == 'kestrel_network' else P('labor_rate_cap_usd'))"
      - payable_hours: "adjusted_hours * repeat_diagnosis_share"
      - result: "RND(MN(payable_hours * diagnostic_rate, F('coverage_remaining')), 2) if P('diagnostic_covered_when_repair_covered') else 0"
    compute_basis:
      diag_decision_system: "read from the plan's most recent approved decision: its repair order, failure date, decision date, vehicle system and facility type."
      diag_failure_date: "read from the plan's most recent approved decision: its repair order, failure date, decision date, vehicle system and facility type."
      diag_decision_date: "read from the plan's most recent approved decision: its repair order, failure date, decision date, vehicle system and facility type."
      diag_facility: "read from the plan's most recent approved decision: its repair order, failure date, decision date, vehicle system and facility type."
      system_hours: "The diagnostic hours follow the vehicle system of the repair: a repair on the engine or the transmission is paid the powertrain diagnostic hours; a repair on the electrical system, the high-tech electronics or a hybrid or electric drive system is paid the electronic diagnostic hours; a repair on any other system is paid one hour."
      diag_program: "The vehicle program on the covered vehicle's purchase order adds diagnostic hours for the equipment its programs require"
      program_hours: "a vehicle sold as Kestrel Premium Certified or Kestrel Factory Certified adds the premium-program hours; a vehicle sold as Kestrel Certified or Kestrel Certified Plus adds the certified-program hours; any other program adds none."
      diagnosis_days: "The hours are then adjusted for a long diagnosis, counted in calendar days from the failure date to the decision date"
      adjusted_hours: "beyond the prolonged-diagnosis days the hours are multiplied by the prolonged-diagnosis multiplier; beyond the extended-diagnosis days but not beyond the prolonged-diagnosis days the extended-diagnosis hours are added; otherwise the hours stand as they are."
      same_system_decisions_3m: "A repeat-diagnosis share then applies to the hours, counted from the plan's approved decisions on the same vehicle system before this repair order"
      same_system_decisions_12m: "A repeat-diagnosis share then applies to the hours, counted from the plan's approved decisions on the same vehicle system before this repair order"
      repeat_diagnosis_share: "where one was decided within the last three months the hours are paid at the short repeat-diagnosis share; where one was decided within the last twelve months but none within three months they are paid at the long repeat-diagnosis share; otherwise they are paid in full."
      diagnostic_rate: "The diagnostic hourly rate follows the facility type on the decision: a franchised dealer is paid the plan's labor rate cap plus the dealer diagnostic premium; a Kestrel network facility is paid the network diagnostic rate; any other facility is paid the plan's labor rate cap."
      payable_hours: "The hours by vehicle system and the program hours are added first, the long-diagnosis adjustment is applied to that sum, and the repeat-diagnosis share is applied last; the payable hours are then multiplied by the hourly rate."
      result: "The diagnostic time payment is the payable diagnostic hours times the diagnostic hourly rate, rounded to the cent, and never above the coverage remaining on the plan."
    factors:
      - id: diagnostic_system_hours
        effect: parameter
        decides: system_hours
        bindings: [diag_decision_system, system_hours]
        ladder:
          - when: "repair on the engine or the transmission"
            value: "K('powertrain_diagnostic_hours')"
          - when: "repair on the electrical system, high-tech electronics or a hybrid or electric drive system"
            value: "K('electronic_diagnostic_hours')"
          - when: "otherwise"
            value: "1"
        baseline:
          system_hours: "1"
        evidence: [history]
        cross_difficulty: null
      - id: program_equipment_hours
        effect: parameter
        decides: program_hours
        bindings: [diag_program, program_hours]
        ladder:
          - when: "vehicle sold as Kestrel Premium Certified or Kestrel Factory Certified"
            value: "K('premium_program_extra_hours')"
          - when: "vehicle sold as Kestrel Certified or Kestrel Certified Plus"
            value: "K('certified_program_extra_hours')"
          - when: "otherwise"
            value: "0"
        baseline:
          program_hours: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: long_diagnosis_adjustment
        effect: method
        decides: adjusted_hours
        bindings: [diag_failure_date, diag_decision_date, diagnosis_days, adjusted_hours]
        ladder:
          - when: "more than K('prolonged_diagnosis_days') days from failure to decision"
            method: "the hours are multiplied by the prolonged-diagnosis multiplier"
          - when: "more than K('extended_diagnosis_days') and at most K('prolonged_diagnosis_days') days"
            method: "the extended-diagnosis hours are added"
          - when: "otherwise"
            method: "the hours stand as they are"
        baseline:
          adjusted_hours: "system_hours + program_hours"
        evidence: [history, date]
        cross_difficulty: null
      - id: repeat_diagnosis_share
        effect: parameter
        decides: repeat_diagnosis_share
        bindings: [same_system_decisions_3m, same_system_decisions_12m, repeat_diagnosis_share]
        ladder:
          - when: "an earlier approved decision on the same system within the last three months"
            value: "K('repeat_diagnosis_share_short')"
          - when: "one within the last twelve months but none within three months"
            value: "K('repeat_diagnosis_share_long')"
          - when: "otherwise"
            value: "1"
        baseline:
          repeat_diagnosis_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: diagnostic_hourly_rate
        effect: parameter
        decides: diagnostic_rate
        bindings: [diag_facility, diagnostic_rate]
        ladder:
          - when: "facility on the decision is a franchised dealer"
            value: "P('labor_rate_cap_usd') + K('dealer_diagnostic_premium')"
          - when: "facility is a Kestrel network facility"
            value: "K('network_diagnostic_rate')"
          - when: "otherwise"
            value: "P('labor_rate_cap_usd')"
        baseline:
          diagnostic_rate: "P('labor_rate_cap_usd')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The diagnostic time paid on an approved repair order is one hour at the plan's labor rate cap. The diagnostic
        time payment is the payable diagnostic hours times the diagnostic hourly rate, rounded to the cent, and never
        above the coverage remaining on the plan.
      params: [labor_rate_cap_usd, diagnostic_covered_when_repair_covered]
    inputs:
      history:
        - {table: service_contract_transactions, aggregate: latest, field: component_system, within_months: null, filters: {event_type: warranty_claim_adjudicated, claim_decision: approved}}
        - {table: service_contract_transactions, aggregate: count, field: component_system, within_months: 12, filters: {event_type: warranty_claim_adjudicated, claim_decision: approved}}
      cross_category: [purchase]

  - id: warranty_ext_release_repair_payment
    base_policy_refs: [warranty_claims]
    overwrite:
      - base_policy: warranty_claims
        superseded_clause: >-
          Otherwise the claim is approved: the estimate is recognized at no more than the plan's labor rate cap,
          diagnostic time only when the plan covers it, the deductible is applied once per visit unless waived at a
          Kestrel network facility, and the amount payable is the lesser of the recognized estimate less the
          deductible, the plan's per-visit limit and the coverage remaining.
        replaced_by: >-
          The re-figured amount is reduced by the facility agreement allowance and by the core credit, then the
          comeback share applies, then the parts-program uplift is added and the late-payment interest is added
          last, each step acting on the result of the step before; the payment is rounded to the cent only at the end
          and is never above the coverage remaining.
    trigger: state_due
    subject: [warranty_claim_paid]
    computes: payment_amount
    target_tool: pay_repair_facility_1c2b8918
    params:
      franchise_agreement_allowance: 0.02
      independent_agreement_allowance: 0.01
      powertrain_core_credit: 0.04
      driveline_core_credit: 0.02
      comeback_share_short: 0.6
      comeback_share_long: 0.85
      premium_parts_uplift: 0.10
      certified_parts_uplift: 0.05
      late_days_short: 2
      late_days_long: 10
      late_interest_short: 0.01
      late_interest_long: 0.02
    rule: >-
      The payment of an approved decision is worked out only after every claim payment on the plan that exceeds the
      approved amount of the decision it settled carries a recovery entry.
      The repair payment on a decision is figured only after the facility's diagnostic time on that repair order has
      been paid.
      The repair work on the plan's most recent approved decision is paid to the facility that holds the vehicle,
      read from that decision: its approved amount, the estimate it was made on, the deductible applied, the
      decision date, the vehicle system and the facility type.
      The repair payment is the amount the decision approved, never above the coverage remaining on the plan when
      the payment is made, rounded to the cent.
      The amount is re-figured from the decision as follows: where the decision approved less than its estimate less
      the deductible and the coverage remaining now is above the approved amount, the amount is the estimate less the
      deductible or the coverage remaining now, whichever is lower; where the decision approved more than the
      coverage remaining now, the amount is the coverage remaining now; otherwise the amount is the approved amount.
      A facility agreement allowance is taken from the re-figured amount: a franchised dealer gives the franchise
      agreement allowance, an independent licensed repair shop the independent agreement allowance, and a Kestrel
      network facility none.
      A core credit is taken for the exchanged unit, read from the vehicle system: an engine or transmission repair
      gives the powertrain core credit, a drive axle, transfer case or steering repair the driveline core credit,
      and any other repair none.
      A comeback share applies when the same vehicle system was already decided on the plan, counted from the plan's
      approved decisions on that system before this repair order: one within the last three months means the plan
      pays the short comeback share; one within the last twelve months but none within three months means the long
      comeback share; otherwise the plan pays the whole amount.
      A parts-program uplift is added for the parts the vehicle program requires, read from the covered vehicle's
      purchase order: a vehicle sold as Kestrel Premium Certified or Kestrel Factory Certified adds the premium parts
      uplift, a vehicle sold as Kestrel Certified or Kestrel Certified Plus adds the certified parts uplift, and any
      other program adds none.
      Late-payment interest is added when the payment is made late, counted in calendar days from the decision date
      to the payment date: beyond the long late-payment days the long late interest is added, beyond the short
      late-payment days but not beyond the long ones the short late interest is added, and within the short
      late-payment days none is added.
      The re-figured amount is reduced by the facility agreement allowance and by the core credit, then the comeback
      share applies, then the parts-program uplift is added and the late-payment interest is added last, each step
      acting on the result of the step before; the payment is rounded to the cent only at the end and is never
      above the coverage remaining.
    prerequisite:
      - problem: warranty_ext_claim_overpayment_recovery
        kind: value_input
        gate: coverage_now
        form: state
        policy_source: >-
          The payment of an approved decision is worked out only after every claim payment on the plan that exceeds
          the approved amount of the decision it settled carries a recovery entry.
        condition: >-
          Every claim payment entry on the plan whose amount exceeds the amount of the approved decision named as its
          source carries a payment recovery entry naming that payment as its source.
        resolved_by: recover_overpaid_claim_bcfb33cc
        effect: >-
          The recovery restores the coverage remaining by the amount recovered, so the coverage remaining the
          re-figure reads rises by that amount.
      - problem: warranty_ext_diagnostic_time_payment
        kind: value_input
        gate: coverage_now
        form: action
        policy_source: >-
          The repair payment on a decision is figured only after the facility's diagnostic time on that repair order
          has been paid.
        fallback_reason: >-
          The diagnostic time payment leaves a claim payment entry on the repair order of exactly the same kind as
          the repair payment itself (same entry type, same repair order, same source decision), so no record-visible
          state singles out the diagnostic payment from the repair payment this policy books; the dependency can
          only be stated as the action.
        condition: >-
          The repair order of the most recent approved decision carries a claim payment entry for the diagnostic
          time and the coverage remaining has been reduced by it.
        resolved_by: pay_diagnostic_time_6cc9f33c
        effect: >-
          The diagnostic payment reduces the coverage remaining by its amount, so the coverage remaining the re-figure
          reads falls by that amount.
    cross_category:
      - category: purchase
        as: branch
        reads: [variant_name]
        note: the parts-program uplift reads the vehicle program on the covered vehicle's purchase order.
    compute:
      - release_approved: "LATEST('service_contract_transactions', 'amount', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - release_estimate: "LATEST('service_contract_transactions', 'requested_amount', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - release_deductible: "LATEST('service_contract_transactions', 'deductible_amount', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - release_decision_date: "LATEST('service_contract_transactions', 'txn_date', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - release_system: "LATEST('service_contract_transactions', 'component_system', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - release_facility: "LATEST('service_contract_transactions', 'repair_facility_type', date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved')"
      - coverage_now: "F('coverage_remaining')"
      - estimate_payable: "MX(0, release_estimate - release_deductible)"
      - refigured_amount: "MN(estimate_payable, coverage_now) if (release_approved < estimate_payable and coverage_now > release_approved) else (coverage_now if release_approved > coverage_now else release_approved)"
      - agreement_allowance: "K('franchise_agreement_allowance') if release_facility == 'franchise_dealer' else (K('independent_agreement_allowance') if release_facility == 'independent_licensed' else 0)"
      - core_credit: "K('powertrain_core_credit') if (release_system == 'engine' or release_system == 'transmission') else (K('driveline_core_credit') if (release_system == 'drive_axle' or release_system == 'transfer_case' or release_system == 'steering') else 0)"
      - comeback_3m: "COUNT('service_contract_transactions', within_months=3, date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved', component_system=release_system) - 1"
      - comeback_12m: "COUNT('service_contract_transactions', within_months=12, date_field='txn_date', event_type='warranty_claim_adjudicated', claim_decision='approved', component_system=release_system) - 1"
      - comeback_share: "K('comeback_share_short') if comeback_3m >= 1 else (K('comeback_share_long') if comeback_12m >= 1 else 1)"
      - release_program: "CFIELD('purchase', 'variant_name', purchase_order_id=F('purchase_order_id'))"
      - parts_uplift: "K('premium_parts_uplift') if (release_program == 'Kestrel Premium Certified' or release_program == 'Kestrel Factory Certified') else (K('certified_parts_uplift') if (release_program == 'Kestrel Certified' or release_program == 'Kestrel Certified Plus') else 0)"
      - late_days: "DAYS(release_decision_date, NOW)"
      - late_interest: "K('late_interest_long') if late_days > K('late_days_long') else (K('late_interest_short') if late_days > K('late_days_short') else 0)"
      - result: "RND(MN(refigured_amount * (1 - agreement_allowance) * (1 - core_credit) * comeback_share * (1 + parts_uplift) * (1 + late_interest), coverage_now), 2)"
    compute_basis:
      release_approved: "read from that decision: its approved amount, the estimate it was made on, the deductible applied, the decision date, the vehicle system and the facility type."
      release_estimate: "read from that decision: its approved amount, the estimate it was made on, the deductible applied, the decision date, the vehicle system and the facility type."
      release_deductible: "read from that decision: its approved amount, the estimate it was made on, the deductible applied, the decision date, the vehicle system and the facility type."
      release_decision_date: "read from that decision: its approved amount, the estimate it was made on, the deductible applied, the decision date, the vehicle system and the facility type."
      release_system: "read from that decision: its approved amount, the estimate it was made on, the deductible applied, the decision date, the vehicle system and the facility type."
      release_facility: "read from that decision: its approved amount, the estimate it was made on, the deductible applied, the decision date, the vehicle system and the facility type."
      coverage_now: "The repair payment is the amount the decision approved, never above the coverage remaining on the plan when the payment is made, rounded to the cent."
      estimate_payable: "where the decision approved less than its estimate less the deductible and the coverage remaining now is above the approved amount"
      refigured_amount: "The amount is re-figured from the decision as follows: where the decision approved less than its estimate less the deductible and the coverage remaining now is above the approved amount, the amount is the estimate less the deductible or the coverage remaining now, whichever is lower; where the decision approved more than the coverage remaining now, the amount is the coverage remaining now; otherwise the amount is the approved amount."
      agreement_allowance: "A facility agreement allowance is taken from the re-figured amount: a franchised dealer gives the franchise agreement allowance, an independent licensed repair shop the independent agreement allowance, and a Kestrel network facility none."
      core_credit: "A core credit is taken for the exchanged unit, read from the vehicle system: an engine or transmission repair gives the powertrain core credit, a drive axle, transfer case or steering repair the driveline core credit, and any other repair none."
      comeback_3m: "counted from the plan's approved decisions on that system before this repair order"
      comeback_12m: "counted from the plan's approved decisions on that system before this repair order"
      comeback_share: "one within the last three months means the plan pays the short comeback share; one within the last twelve months but none within three months means the long comeback share; otherwise the plan pays the whole amount."
      release_program: "A parts-program uplift is added for the parts the vehicle program requires, read from the covered vehicle's purchase order"
      parts_uplift: "a vehicle sold as Kestrel Premium Certified or Kestrel Factory Certified adds the premium parts uplift, a vehicle sold as Kestrel Certified or Kestrel Certified Plus adds the certified parts uplift, and any other program adds none."
      late_days: "Late-payment interest is added when the payment is made late, counted in calendar days from the decision date to the payment date"
      late_interest: "beyond the long late-payment days the long late interest is added, beyond the short late-payment days but not beyond the long ones the short late interest is added, and within the short late-payment days none is added."
      result: "The re-figured amount is reduced by the facility agreement allowance and by the core credit, then the comeback share applies, then the parts-program uplift is added and the late-payment interest is added last, each step acting on the result of the step before; the payment is rounded to the cent only at the end and is never above the coverage remaining."
    factors:
      - id: limited_decision_refigure
        effect: method
        decides: refigured_amount
        bindings: [release_approved, release_estimate, release_deductible, estimate_payable, refigured_amount]
        ladder:
          - when: "the decision approved less than its estimate less the deductible AND the coverage remaining now is above the approved amount"
            method: "the estimate less the deductible or the coverage remaining now, whichever is lower"
          - when: "the decision approved more than the coverage remaining now"
            method: "the coverage remaining now"
          - when: "otherwise"
            method: "the approved amount"
        baseline:
