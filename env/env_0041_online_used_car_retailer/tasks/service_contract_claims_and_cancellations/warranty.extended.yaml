      - id: late_payment_interest
        effect: parameter
        decides: late_interest
        bindings: [release_decision_date, late_days, late_interest]
        ladder:
          - when: "more than K('late_days_long') days from the decision to the payment"
            value: "K('late_interest_long')"
          - when: "more than K('late_days_short') and at most K('late_days_long') days"
            value: "K('late_interest_short')"
          - when: "otherwise"
            value: "0"
        baseline:
          late_interest: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The repair payment is the amount the decision approved, never above the coverage remaining on the plan when
