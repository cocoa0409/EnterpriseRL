events:
  - type: title_order_opened
    target: title_orders
    mutation: create
    meaning: "A title and registration order opens when the purchase agreement is signed."
    grain: "one row per purchase agreement"
    fields:
      customer_id: "buyer"
      purchase_order_id: "purchase order"
      variant_name: "service type"
      registration_state: "registration state from the agreement"
      lienholder: "lienholder to record"
      opened_date: "signing date"
    triggers:
      - event: title:title_state_fee_collected
        map: {}
  - type: title_documents_completed
    target: title_orders
    mutation: {transition: {from: awaiting_documents, to: ready_to_submit}}
    meaning: "The last required document is accepted."
    grain: "one row per completion"
    fields:
      status: "awaiting_documents -> ready_to_submit"
    triggers: []
  - type: title_submitted_to_dmv
    target: title_orders
    mutation: {transition: {from: ready_to_submit, to: submitted}}
    meaning: "The packet is submitted to the state."
    grain: "one row per submission"
    fields:
      status: "ready_to_submit -> submitted"
      submitted_date: "submission date"
      dmv_transaction_number: "state receipt number"
    triggers:
      - event: title:title_state_fee_remitted
        map: {}
  - type: title_rejected_by_dmv
    target: title_orders
    mutation: {transition: {from: submitted, to: rejected}}
    meaning: "The state rejects the packet."
    grain: "one row per rejection"
    fields:
      status: "submitted -> rejected"
    triggers:
      - event: title:title_dmv_rejection_recorded
        map: {}
  - type: title_resubmission_prepared
    target: title_orders
    mutation: {transition: {from: rejected, to: ready_to_submit}}
    meaning: "A rejection is cured without needing anything new from the customer."
    grain: "one row per cure"
    fields:
      status: "rejected -> ready_to_submit"
    triggers: []
  - type: title_documents_reopened
    target: title_orders
    mutation: {transition: {from: rejected, to: awaiting_documents}}
    meaning: "A rejection needs a corrected document from the customer."
    grain: "one row per reopening"
    fields:
      status: "rejected -> awaiting_documents"
    triggers: []
  - type: title_registration_issued
    target: title_orders
    mutation: {transition: {from: submitted, to: registered}}
    meaning: "The state issues title and registration."
    grain: "one row per order"
    fields:
      status: "submitted -> registered"
      registered_date: "issue date"
      plate_number: "permanent plate number; empty for title-only"
    triggers: []
  - type: title_order_completed
    target: title_orders
    mutation: {transition: {from: registered, to: completed}}
    meaning: "Plates and registration card, or title-only paperwork, are delivered."
    grain: "one row per order"
    fields:
      status: "registered -> completed"
      completed_date: "delivery date"
      closed_date: "delivery date"
    triggers: []
  - type: title_order_cancelled
    target: title_orders
    mutation: {transition: [{from: awaiting_documents, to: cancelled}, {from: ready_to_submit, to: cancelled}, {from: rejected, to: cancelled}]}
    meaning: "The order is cancelled before registration."
    grain: "one row per cancellation"
    fields:
      status: "-> cancelled"
      closed_date: "date of cancellation"
    triggers:
      - event: title:title_state_fee_refunded
        map: {}
  - type: title_temp_tag_recorded
    target: title_orders
    mutation: update
    meaning: "The temporary tag currently on the vehicle is recorded on the order."
    grain: "one row per tag issued"
    fields:
      temp_tag_number: "number of the tag just issued"
      temp_tag_expires_date: "its expiration date"
      temp_tag_extensions_used: "tags issued after the original"
    triggers: []

  - type: title_state_fee_collected
    target: title_transactions
    meaning: "A state fee is collected from the buyer to be remitted."
    grain: "one row per fee type per collection date"
    distinguish_by: [fee_type, txn_date]
    fields:
      txn_date: "collection date"
      amount: "fee amount"
      fee_type: "state fee"
    account: state_fees_held
    direction: in
    triggers: []
  - type: title_state_fee_remitted
    target: title_transactions
    meaning: "A held state fee is paid to the state with the submission."
    grain: "one row per collected fee remitted"
    distinguish_by: [source_txn_id]
    fields:
      txn_date: "submission date"
      amount: "fee remitted"
      fee_type: "state fee"
      source_txn_id: "collected fee entry"
    account: state_fees_held
    direction: out
    triggers: []
  - type: title_state_fee_refunded
    target: title_transactions
    meaning: "A held state fee is refunded to the buyer."
    grain: "one row per collected fee refunded"
    distinguish_by: [source_txn_id]
    fields:
      txn_date: "refund date"
      amount: "fee refunded"
      fee_type: "state fee"
      source_txn_id: "collected fee entry"
    account: state_fees_held
    direction: out
    triggers: []
  - type: title_document_received
    target: title_transactions
    meaning: "A registration document is received from the customer."
    grain: "one row per document received per date"
    distinguish_by: [document_type, txn_date, document_format]
    fields:
      txn_date: "date received"
      amount: "0.00"
      document_type: "document"
      document_format: "electronic_signature, wet_ink_original or scan_or_photo"
      document_date: "date printed on the document"
    triggers: []
  - type: title_temp_tag_issued
    target: title_transactions
    meaning: "A temporary tag is issued for the vehicle."
    grain: "one row per tag"
    distinguish_by: [tag_sequence]
    fields:
      txn_date: "issue date"
      amount: "0.00 (temp tag fees are booked as state fees collected)"
      tag_sequence: "1 original, 2 first extension, ..."
      temp_tag_number: "tag number"
      tag_expires_date: "expiration printed on the tag"
    triggers:
      - event: title:title_temp_tag_recorded
        map: {temp_tag_number: temp_tag_number}
  - type: title_dmv_rejection_recorded
    target: title_transactions
    meaning: "The state's rejection reason is recorded."
    grain: "one row per rejection"
    distinguish_by: [reject_code, txn_date]
    fields:
      txn_date: "rejection date"
      amount: "fee shortage stated by the state, or 0.00"
      reject_code: "reason"
    triggers: []
  - type: title_reimbursement_paid
    target: title_transactions
    meaning: "Kestrel reimburses the buyer for a state penalty, a citation or an inspection fee."
    grain: "one row per reimbursed document"
    distinguish_by: [reimbursement_reason, citation_number]
    fields:
      txn_date: "payment date"
      amount: "amount reimbursed"
      reimbursement_reason: "cost covered"
      citation_number: "citation, notice or receipt number"
    triggers: []

measures:
  - id: title_msr_submissions
    window: "life of the order"
    measure: "count of title_submitted_to_dmv transitions on the order, equal to 1 plus the count of title_dmv_rejection_recorded entries when the order is submitted again after each rejection"
  - id: title_msr_documents_accepted
    window: "life of the order up to the moment of the request"
    measure: "set of document_type values of title_document_received entries of the order that meet the format and date rules, excluding documents received before the most recent rejection that names them"
  - id: title_msr_reimbursements
    window: "life of the order"
    measure: "count of title_reimbursement_paid entries of the order"

policies:
  - id: title_agg_multi_holding
    subject: [title_order_opened]
    rule: >-
      A customer may hold any number of title orders over time. Each purchase order has exactly one title order
      that is not cancelled; a new order for the same purchase order is opened only when the earlier one was
      cancelled.
    eligibility:
      - id: one_per_purchase
        applies_to: [title_order_opened]
        kind: dedup
        condition: "Each purchase order has exactly one title order that is not cancelled; a new order for the same purchase order is opened only when the earlier one was cancelled."
        evidence_fields: [title_orders.purchase_order_id, title_orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.purchase_order_id]
          action_bindings:
            title_orders.purchase_order_id: purchase_order_id
        dedup_contract:
          table: title_orders
          mode: separate_record
          object_bindings: {purchase_order_id: purchase_order_id}
          duplicate_filters: {status: [awaiting_documents, ready_to_submit, submitted, rejected, registered, completed]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: title_agg_household_fees
    subject: [title_state_fee_collected]
    rule: >-
      State fees are computed per title order and never combined across a customer's orders: two vehicles bought
      the same day each carry their own title, registration, plate, lien and temp tag fees, and a plate transferred
      to one vehicle cannot also be transferred to another. A plate is transferred only to one open title order of
      the same customer.
    eligibility: []

  - id: title_service_fees
    subject: [title_order_opened, title_state_fee_collected]
    rule: >-
      The service type follows the purchase: title-only when the buyer elects to register personally; in-state
      services when the registration state equals the selling dealer state; out-of-state services otherwise, with
      inspection when the registration state requires a VIN inspection or emissions certificate for a vehicle last
      titled elsewhere; specialty plate when a specialty or personalized plate is requested in the dealer state. At
      opening, the state fees in the service's fee components are collected from the registration state's fee
      schedule, each as its own entry, plus the lien recording fee when a lienholder is to be recorded. A state fee
      is collected only on an order whose status is awaiting_documents or rejected; after a fee-shortage rejection
      the stated shortage is collected as its own entry within the fee shortage collection days. The temp tag fee
      collected at opening covers the original tag only; extension tag fees are not collected from the customer
      when the service's switch is false.
    eligibility:
      - id: collect_state
        applies_to: [title_state_fee_collected]
        kind: state
        condition: "A state fee is collected only on an order whose status is awaiting_documents or rejected; after a fee-shortage rejection the stated shortage is collected as its own entry within the fee shortage collection days."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [awaiting_documents, rejected]
    params:
      state_fee_schedule:
        AZ: {title_fee: 4.00, registration_fee: 8.00, new_plate_fee: 5.00, plate_transfer_fee: 12.00, specialty_plate_fee: 25.00, lien_recording_fee: 0.00, temp_tag_fee: 15.00}
        TX: {title_fee: 33.00, registration_fee: 51.75, new_plate_fee: 0.00, plate_transfer_fee: 0.00, specialty_plate_fee: 40.00, lien_recording_fee: 0.00, temp_tag_fee: 5.00}
        GA: {title_fee: 18.00, registration_fee: 20.00, new_plate_fee: 0.00, plate_transfer_fee: 0.00, specialty_plate_fee: 35.00, lien_recording_fee: 0.00, temp_tag_fee: 0.00}
        FL: {title_fee: 77.75, registration_fee: 46.15, new_plate_fee: 225.00, plate_transfer_fee: 4.60, specialty_plate_fee: 25.00, lien_recording_fee: 2.00, temp_tag_fee: 2.00}
        NC: {title_fee: 56.00, registration_fee: 38.75, new_plate_fee: 0.00, plate_transfer_fee: 24.00, specialty_plate_fee: 30.00, lien_recording_fee: 21.50, temp_tag_fee: 0.00}
        OH: {title_fee: 15.00, registration_fee: 34.50, new_plate_fee: 0.00, plate_transfer_fee: 5.00, specialty_plate_fee: 35.00, lien_recording_fee: 15.00, temp_tag_fee: 0.00}
        PA: {title_fee: 67.00, registration_fee: 45.00, new_plate_fee: 0.00, plate_transfer_fee: 11.00, specialty_plate_fee: 20.00, lien_recording_fee: 34.00, temp_tag_fee: 0.00}
        CO: {title_fee: 7.20, registration_fee: 50.00, new_plate_fee: 0.00, plate_transfer_fee: 0.00, specialty_plate_fee: 25.00, lien_recording_fee: 0.00, temp_tag_fee: 0.00}
      per_tier:
        Kestrel Title-Only Service: {state_fee_components: "=state_fee_components", extension_tag_fee_charged_to_customer: "=extension_tag_fee_charged_to_customer"}
        Kestrel In-State Plate Transfer: {state_fee_components: "=state_fee_components", extension_tag_fee_charged_to_customer: "=extension_tag_fee_charged_to_customer"}
        Kestrel In-State New Registration: {state_fee_components: "=state_fee_components", extension_tag_fee_charged_to_customer: "=extension_tag_fee_charged_to_customer"}
        Kestrel Out-of-State Registration: {state_fee_components: "=state_fee_components", extension_tag_fee_charged_to_customer: "=extension_tag_fee_charged_to_customer"}
        Kestrel Out-of-State Registration with Inspection: {state_fee_components: "=state_fee_components", extension_tag_fee_charged_to_customer: "=extension_tag_fee_charged_to_customer"}
        Kestrel Specialty Plate Registration: {state_fee_components: "=state_fee_components", extension_tag_fee_charged_to_customer: "=extension_tag_fee_charged_to_customer"}

  - id: title_documents
    subject: [title_document_received, title_documents_completed]
    rule: >-
      The order becomes ready to submit only when every document in the service's required documents has been
      received in acceptable form. A document is received only on an order whose status is awaiting_documents,
      ready_to_submit or rejected. A document listed among the service's wet-ink documents counts only as a wet-ink
      original; a document listed among the scan-accepted documents may arrive as a scan or photo; every other
      document may be e-signed or a wet-ink original. A proof of residence counts only when its statement date is
      no more than the service's maximum age before the date it was received, and its address is the registration
      address; a proof of insurance counts only when it shows the purchased VIN; an odometer disclosure is not
      required for a vehicle at or above the exempt model age; a signed power of attorney for a registration state
      in the notarized list counts only when notarized; a prior plate registration counts only when the plate is
      registered to the buyer. The customer is asked to return all documents within the customer document due days
      after opening; returning them later does not stop the order but changes who bears late penalties under
      title_reimbursements. For the inspection service the VIN inspection form and emissions certificate (emissions
      only for addresses in emissions counties) must be obtained within the inspection due days after handover. A
      customer's statement that a document was mailed is not receipt.
    eligibility:
      - id: doc_state
        applies_to: [title_document_received]
        kind: state
        condition: "A document is received only on an order whose status is awaiting_documents, ready_to_submit or rejected."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [awaiting_documents, ready_to_submit, rejected]
      - id: docs_complete
        applies_to: [title_documents_completed]
        kind: authorization
        condition: "The order becomes ready to submit only when every document in the service's required documents has been received in acceptable form."
        evidence_fields: [title_transactions.document_type, title_transactions.document_format, title_transactions.document_date, title_transactions.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_transactions.title_order_id]
          action_bindings:
            title_transactions.title_order_id: title_order_id
    params:
      per_tier:
        Kestrel Title-Only Service: {required_documents: "=required_documents", wet_ink_documents: "=wet_ink_documents", proof_of_residence_max_age_days: "=proof_of_residence_max_age_days", customer_document_due_days: "=customer_document_due_days"}
        Kestrel In-State Plate Transfer: {required_documents: "=required_documents", wet_ink_documents: "=wet_ink_documents", proof_of_residence_max_age_days: "=proof_of_residence_max_age_days", customer_document_due_days: "=customer_document_due_days"}
        Kestrel In-State New Registration: {required_documents: "=required_documents", wet_ink_documents: "=wet_ink_documents", proof_of_residence_max_age_days: "=proof_of_residence_max_age_days", customer_document_due_days: "=customer_document_due_days"}
        Kestrel Out-of-State Registration: {required_documents: "=required_documents", wet_ink_documents: "=wet_ink_documents", proof_of_residence_max_age_days: "=proof_of_residence_max_age_days", customer_document_due_days: "=customer_document_due_days"}
        Kestrel Out-of-State Registration with Inspection: {required_documents: "=required_documents", wet_ink_documents: "=wet_ink_documents", proof_of_residence_max_age_days: "=proof_of_residence_max_age_days", customer_document_due_days: "=customer_document_due_days"}
        Kestrel Specialty Plate Registration: {required_documents: "=required_documents", wet_ink_documents: "=wet_ink_documents", proof_of_residence_max_age_days: "=proof_of_residence_max_age_days", customer_document_due_days: "=customer_document_due_days"}
    measures: [title_msr_documents_accepted]

  - id: title_submission
    subject: [title_submitted_to_dmv, title_state_fee_remitted]
    rule: >-
      A ready order is submitted within the service's submission target business days. The packet is submitted only
      when the purchase order balance is zero or below and, when the service requires it, the purchase order shows
      insurance verified. Every held state fee is remitted with the submission as its own remittance entry. A fee is
      remitted only on an order whose status is submitted. The state's dealer deadline for the registration state,
      counted in calendar days from the purchase agreement signing date as day 0, is met when the first submission
      is made on or before its last day. Out-of-state packets for services that go by mail are sent to the buyer's
      county office. Once an order has reached the service's maximum submissions it is not submitted again by
      customer care; it is referred to the title escalations team.
    eligibility:
      - id: funded_and_insured
        applies_to: [title_submitted_to_dmv]
        kind: authorization
        condition: "The packet is submitted only when the purchase order balance is zero or below and, when the service requires it, the purchase order shows insurance verified."
        evidence_fields: [purchase_orders.order_balance, purchase_orders.insurance_verified, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
      - id: remit_state
        applies_to: [title_state_fee_remitted]
        kind: state
        condition: "A fee is remitted only on an order whose status is submitted."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [submitted]
    params:
      state_dealer_deadline_days: {AZ: 30, TX: 30, GA: 30, FL: 30, NC: 28, OH: 30, PA: 20, CO: 30}
      per_tier:
        Kestrel Title-Only Service: {submission_target_business_days: "=submission_target_business_days", max_dmv_submissions: "=max_dmv_submissions", submission_requires_insurance_verified: "=submission_requires_insurance_verified"}
        Kestrel In-State Plate Transfer: {submission_target_business_days: "=submission_target_business_days", max_dmv_submissions: "=max_dmv_submissions", submission_requires_insurance_verified: "=submission_requires_insurance_verified"}
        Kestrel In-State New Registration: {submission_target_business_days: "=submission_target_business_days", max_dmv_submissions: "=max_dmv_submissions", submission_requires_insurance_verified: "=submission_requires_insurance_verified"}
        Kestrel Out-of-State Registration: {submission_target_business_days: "=submission_target_business_days", max_dmv_submissions: "=max_dmv_submissions", submission_requires_insurance_verified: "=submission_requires_insurance_verified"}
        Kestrel Out-of-State Registration with Inspection: {submission_target_business_days: "=submission_target_business_days", max_dmv_submissions: "=max_dmv_submissions", submission_requires_insurance_verified: "=submission_requires_insurance_verified"}
        Kestrel Specialty Plate Registration: {submission_target_business_days: "=submission_target_business_days", max_dmv_submissions: "=max_dmv_submissions", submission_requires_insurance_verified: "=submission_requires_insurance_verified"}
    measures: [title_msr_submissions]

  - id: title_rejections
    subject: [title_rejected_by_dmv, title_dmv_rejection_recorded, title_resubmission_prepared, title_documents_reopened]
    rule: >-
      Each state rejection is recorded with its reason. A rejection is recorded only on an order whose status is
      submitted or rejected. The cure depends on the reason: missing_signature, insurance_not_verified,
      emissions_not_on_file and odometer_discrepancy need a corrected document from the customer (for an odometer
      discrepancy, a new signed odometer disclosure serving as affidavit), so the order returns to
      awaiting_documents and the earlier copy of that document no longer counts; lien_information_error is cured by
      Kestrel from the finance records and fee_shortage by collecting the stated shortage, so the order returns to
      ready_to_submit once cured. The customer has the rejection customer response days to supply a corrected
      document. A cured order is resubmitted within the service's resubmission target business days.
    eligibility:
      - id: reject_state
        applies_to: [title_dmv_rejection_recorded]
        kind: state
        condition: "A rejection is recorded only on an order whose status is submitted or rejected."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [submitted, rejected]
    params:
      per_tier:
        Kestrel Title-Only Service: {resubmission_target_business_days: "=resubmission_target_business_days", rejection_customer_response_days: "=rejection_customer_response_days"}
        Kestrel In-State Plate Transfer: {resubmission_target_business_days: "=resubmission_target_business_days", rejection_customer_response_days: "=rejection_customer_response_days"}
        Kestrel In-State New Registration: {resubmission_target_business_days: "=resubmission_target_business_days", rejection_customer_response_days: "=rejection_customer_response_days"}
        Kestrel Out-of-State Registration: {resubmission_target_business_days: "=resubmission_target_business_days", rejection_customer_response_days: "=rejection_customer_response_days"}
        Kestrel Out-of-State Registration with Inspection: {resubmission_target_business_days: "=resubmission_target_business_days", rejection_customer_response_days: "=rejection_customer_response_days"}
        Kestrel Specialty Plate Registration: {resubmission_target_business_days: "=resubmission_target_business_days", rejection_customer_response_days: "=rejection_customer_response_days"}

  - id: title_temp_tags
    subject: [title_temp_tag_issued, title_temp_tag_recorded]
    rule: >-
      The original temporary tag is issued at handover, valid for the registration state's original-tag validity
      days counted from the handover date. A tag is issued only while the order's status is awaiting_documents,
      ready_to_submit, submitted or rejected; once registration is issued no tag is issued. An extension tag is
      issued only when the current tag expires before registration is expected, and only on or before the current
      tag's expiration date recorded on the order. The tag date is compared as a calendar date; an extension on the
      expiration date itself is allowed and an extension the day after is not. An extension can be issued from the
      service's extension request lead days before that date. When the service requires documents complete for
      extensions, no extension tag is issued while the order is awaiting the customer's documents. Extension tags
      used must stay below the lower of the service's limit and the registration state's maximum extensions. An
      extension tag is valid for the service's extension tag validity days from its issue date, unless the
      state's original-tag validity is larger, in which case that applies. Each tag has its own sequence number and
      the order always records the tag currently on the vehicle.
    eligibility:
      - id: tag_state
        applies_to: [title_temp_tag_issued, title_temp_tag_recorded]
        kind: state
        condition: "A tag is issued only while the order's status is awaiting_documents, ready_to_submit, submitted or rejected; once registration is issued no tag is issued."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [awaiting_documents, ready_to_submit, submitted, rejected]
      - id: before_tag_expiry
        applies_to: [title_temp_tag_issued]
        kind: time
        condition: "An extension tag is issued only when the current tag expires before registration is expected, and only on or before the current tag's expiration date recorded on the order."
        evidence_fields: [title_orders.temp_tag_expires_date, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the current tag's expiration date recorded on the order"
          anchor_source: title_orders.temp_tag_expires_date
          relation: not_after
          duration_source: params.extension_after_expiry_days
          unit: calendar_days
          counting_rule: "The tag date is compared as a calendar date; an extension on the expiration date itself is allowed and an extension the day after is not."
          boundary: inclusive
    params:
      extension_after_expiry_days: 0
      state_temp_tag_rules:
        AZ: {original_tag_validity_days: 30, max_extensions: 1}
        TX: {original_tag_validity_days: 60, max_extensions: 1}
        GA: {original_tag_validity_days: 30, max_extensions: 2}
        FL: {original_tag_validity_days: 30, max_extensions: 1}
        NC: {original_tag_validity_days: 30, max_extensions: 1}
        OH: {original_tag_validity_days: 45, max_extensions: 1}
        PA: {original_tag_validity_days: 90, max_extensions: 1}
        CO: {original_tag_validity_days: 60, max_extensions: 2}
      per_tier:
        Kestrel Title-Only Service: {max_temp_tag_extensions_service: "=max_temp_tag_extensions_service", extension_requires_documents_complete: "=extension_requires_documents_complete", extension_request_lead_days: "=extension_request_lead_days"}
        Kestrel In-State Plate Transfer: {max_temp_tag_extensions_service: "=max_temp_tag_extensions_service", extension_requires_documents_complete: "=extension_requires_documents_complete", extension_request_lead_days: "=extension_request_lead_days"}
        Kestrel In-State New Registration: {max_temp_tag_extensions_service: "=max_temp_tag_extensions_service", extension_requires_documents_complete: "=extension_requires_documents_complete", extension_request_lead_days: "=extension_request_lead_days"}
        Kestrel Out-of-State Registration: {max_temp_tag_extensions_service: "=max_temp_tag_extensions_service", extension_requires_documents_complete: "=extension_requires_documents_complete", extension_request_lead_days: "=extension_request_lead_days"}
        Kestrel Out-of-State Registration with Inspection: {max_temp_tag_extensions_service: "=max_temp_tag_extensions_service", extension_requires_documents_complete: "=extension_requires_documents_complete", extension_request_lead_days: "=extension_request_lead_days"}
        Kestrel Specialty Plate Registration: {max_temp_tag_extensions_service: "=max_temp_tag_extensions_service", extension_requires_documents_complete: "=extension_requires_documents_complete", extension_request_lead_days: "=extension_request_lead_days"}

  - id: title_completion
    subject: [title_registration_issued, title_order_completed]
    rule: >-
      When the state issues registration the order records the registration date and plate number; plates and the
      registration card are mailed within the service's plate mailing business days, and title-only paperwork within
      its title-only mailing business days. When a lienholder is recorded, an electronic-title state holds the title
      electronically for the lienholder; with no lien, a paper title received from the state is mailed to the owner
      within the paper title mailing business days. The order completes when the plates and card, or the title-only
      paperwork, are delivered.
    eligibility: []

  - id: title_reimbursements
    subject: [title_reimbursement_paid]
    rule: >-
      Kestrel reimburses three costs, each against a document the customer submits, and each document is reimbursed
      once. A state late-registration penalty is reimbursed in full when the service reimburses late penalties, the
      first submission missed the state's dealer deadline, and the customer returned every required document within
      the customer document due days; when the documents came later and the dealer-deadline switch is true, the
      deadline counts as met and nothing is reimbursed. An expired-temp-tag citation is reimbursed up to the
      service's citation cap when the citation date falls after the current tag expired at a time Kestrel could have
      issued an extension under title_temp_tags and did not, and the citation is submitted within the citation claim
      days after its date. VIN inspection and emissions test fees are reimbursed up to the service's inspection fee
      cap. No order receives more than the service's maximum reimbursements, counted by title_msr_reimbursements.
      Reimbursements are paid within the reimbursement payment business days. Reimbursements are paid only on an
      order whose status is submitted, rejected, registered or completed.
    eligibility:
      - id: reimburse_state
        applies_to: [title_reimbursement_paid]
        kind: state
        condition: "Reimbursements are paid only on an order whose status is submitted, rejected, registered or completed."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [submitted, rejected, registered, completed]
      - id: one_per_document
        applies_to: [title_reimbursement_paid]
        kind: dedup
        condition: "Kestrel reimburses three costs, each against a document the customer submits, and each document is reimbursed once."
        evidence_fields: [title_transactions.citation_number, title_transactions.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_transactions.citation_number]
          action_bindings:
            title_transactions.citation_number: citation_number
        dedup_contract:
          table: title_transactions
          mode: separate_record
          object_bindings: {citation_number: citation_number}
          duplicate_filters: {event_type: [title_reimbursement_paid]}
          distinct_fields: []
    params:
      per_tier:
        Kestrel Title-Only Service: {late_penalty_reimbursed: "=late_penalty_reimbursed", citation_reimbursement_cap_usd: "=citation_reimbursement_cap_usd", inspection_fee_reimbursement_cap_usd: "=inspection_fee_reimbursement_cap_usd", max_reimbursements_per_order: "=max_reimbursements_per_order"}
        Kestrel In-State Plate Transfer: {late_penalty_reimbursed: "=late_penalty_reimbursed", citation_reimbursement_cap_usd: "=citation_reimbursement_cap_usd", inspection_fee_reimbursement_cap_usd: "=inspection_fee_reimbursement_cap_usd", max_reimbursements_per_order: "=max_reimbursements_per_order"}
        Kestrel In-State New Registration: {late_penalty_reimbursed: "=late_penalty_reimbursed", citation_reimbursement_cap_usd: "=citation_reimbursement_cap_usd", inspection_fee_reimbursement_cap_usd: "=inspection_fee_reimbursement_cap_usd", max_reimbursements_per_order: "=max_reimbursements_per_order"}
        Kestrel Out-of-State Registration: {late_penalty_reimbursed: "=late_penalty_reimbursed", citation_reimbursement_cap_usd: "=citation_reimbursement_cap_usd", inspection_fee_reimbursement_cap_usd: "=inspection_fee_reimbursement_cap_usd", max_reimbursements_per_order: "=max_reimbursements_per_order"}
        Kestrel Out-of-State Registration with Inspection: {late_penalty_reimbursed: "=late_penalty_reimbursed", citation_reimbursement_cap_usd: "=citation_reimbursement_cap_usd", inspection_fee_reimbursement_cap_usd: "=inspection_fee_reimbursement_cap_usd", max_reimbursements_per_order: "=max_reimbursements_per_order"}
        Kestrel Specialty Plate Registration: {late_penalty_reimbursed: "=late_penalty_reimbursed", citation_reimbursement_cap_usd: "=citation_reimbursement_cap_usd", inspection_fee_reimbursement_cap_usd: "=inspection_fee_reimbursement_cap_usd", max_reimbursements_per_order: "=max_reimbursements_per_order"}
    measures: [title_msr_reimbursements]

  - id: title_cancellation_refunds
    subject: [title_order_cancelled, title_state_fee_refunded]
    rule: >-
      When the purchase is cancelled or the vehicle returned before the order has been submitted, the order is
      cancelled and every held state fee is refunded to the buyer as its own refund entry within the service's state
      fee refund business days. A held fee is refunded only on an order whose status is cancelled or completed. Fees
      already remitted are not refunded when the service's switch is false; when the vehicle is returned after
      registration was issued, Kestrel retitles the vehicle at its own cost and the buyer's remitted fees are not
      refunded. A fee collected in excess of the schedule is refunded after completion. A registration address may
      be corrected before submission without cancelling the order, and a buyer may switch between plate transfer
      and new plates before submission where the service allows it, with the fee entries adjusted to the new
      service's components.
    eligibility:
      - id: refund_state
        applies_to: [title_state_fee_refunded]
        kind: state
        condition: "A held fee is refunded only on an order whose status is cancelled or completed."
        evidence_fields: [title_orders.status, title_orders.title_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [title_orders.title_order_id]
          action_bindings:
            title_orders.title_order_id: title_order_id
        state_contract:
          field: title_orders.status
          allowed: [cancelled, completed]
    params:
      per_tier:
        Kestrel Title-Only Service: {state_fee_refund_business_days: "=state_fee_refund_business_days", fees_refundable_after_submission: "=fees_refundable_after_submission"}
        Kestrel In-State Plate Transfer: {state_fee_refund_business_days: "=state_fee_refund_business_days", fees_refundable_after_submission: "=fees_refundable_after_submission"}
        Kestrel In-State New Registration: {state_fee_refund_business_days: "=state_fee_refund_business_days", fees_refundable_after_submission: "=fees_refundable_after_submission"}
        Kestrel Out-of-State Registration: {state_fee_refund_business_days: "=state_fee_refund_business_days", fees_refundable_after_submission: "=fees_refundable_after_submission"}
        Kestrel Out-of-State Registration with Inspection: {state_fee_refund_business_days: "=state_fee_refund_business_days", fees_refundable_after_submission: "=fees_refundable_after_submission"}
        Kestrel Specialty Plate Registration: {state_fee_refund_business_days: "=state_fee_refund_business_days", fees_refundable_after_submission: "=fees_refundable_after_submission"}

# ============================================================================
# extended_policies (title_and_registration difficulty)
# ============================================================================
extended_policies:
  # ---------------------------------------------------------------- claimed by task 0
  - id: title_ext_shortage_cure_share
    base_policy_refs: [title_service_fees, title_agg_household_fees, title_rejections, title_documents, title_submission]
    overwrite:
      - base_policy: title_service_fees
        superseded_clause: >-
          after a fee-shortage rejection the stated shortage is collected as its own entry within the fee shortage
          collection days.
        replaced_by: >-
          Within the service's fee shortage collection days after a fee-shortage return, the buyer pays, as its own
          entry, either the buyer's cure share of the stated shortage when the return states an amount or the
          late-registration penalty when the return states no amount; the rest of a stated shortage is Kestrel's own
          cost.
      - base_policy: title_rejections
        superseded_clause: >-
          fee_shortage by collecting the stated shortage
        replaced_by: >-
          Within the service's fee shortage collection days after a fee-shortage return, the buyer pays, as its own
          entry, either the buyer's cure share of the stated shortage when the return states an amount or the
          late-registration penalty when the return states no amount; the rest of a stated shortage is Kestrel's own
          cost.
    trigger: state_due
    subject: [title_state_fee_collected]
    computes: amount
    target_tool: pay_title_fee_shortage_f6fcb150
    params:
      handling_allowance_days: 5
      relief_top_programs: 0.10
      relief_certified_programs: 0.05
      relief_three_returns: 0.20
      relief_two_returns: 0.10
    rule: >-
      When the state sends a packet back for a fee shortage, the buyer's cure payment is the shortage the state
      stated on the order's most recent fee-shortage return, collected from the buyer as its own fee entry booked
      against the registration fee. A fee-shortage return that states no amount is not a stated shortage under
      this rule. Within the service's fee shortage collection days after a fee-shortage return, the buyer pays, as its own
      entry, either the buyer's cure share of the stated shortage when the return states an amount or the
      late-registration penalty when the return states no amount; the rest of a stated shortage is Kestrel's own
      cost. The cure share follows who
      made the packet wait before it went to the state. The buyer's cure late days are the calendar days from the
      buyer's cure document clock start to the date the order's latest document was received, less the service's
      customer document due days, and never below zero. The buyer's cure document clock starts on the vehicle's
      actual handover date when a scheduled handover was missed for a reason on Kestrel's side (Kestrel running
      late or the vehicle not ready) and the handover came after the order's opening date; it starts on the first
      scheduled handover date when the buyer missed that appointment and that date came after the order's opening
      date; otherwise it starts on the order's opening date. Kestrel's cure late days are the calendar days from
      Kestrel's cure handling clock start to the date of the order's most recent remittance to the state, less a
      handling allowance of five calendar days, and never below zero. Kestrel's cure handling clock starts on the
      date an outside lender's proceeds were posted to the purchase order when an outside lender's proceeds were
      posted and the latest posting came after the order's latest document; it starts on the vehicle's handover
      date when the handover came after the order's latest document and no outside lender's proceeds were posted
      after that document; otherwise it starts on the date the order's latest document was received. When both
      the buyer and Kestrel have cure late days, the cure share is the buyer's cure late days divided by the sum
      of the buyer's and Kestrel's cure late days; when Kestrel has cure late days and the buyer has none, the cure
      share is zero; otherwise the cure share is one, so the buyer bears the whole stated shortage. Kestrel relieves part of the cure
      payment for the vehicle program on the purchase order: one tenth for a Kestrel Premium Certified or Kestrel
      Factory Certified vehicle, one twentieth for a Kestrel Certified or Kestrel Certified Plus vehicle, and
      nothing for any other program. Kestrel relieves a further part of the cure payment for the times the state
      has sent the order back: one fifth when the order carries three or more returns, one tenth when it carries
      exactly two, and nothing when it carries fewer. The program relief and the returns relief are first added
      together and that total is taken off one; the cure payment is then the stated shortage multiplied by the
      cure share and by that remainder, and it is rounded half up to the cent only at the end.
    prerequisite: []
    cross_category:
      - category: purchase
        as: history
        reads: [handover_date, variant_name, purchase_transactions.txn_date, purchase_transactions.payment_source]
        note: The handover date and the posting date of an outside lender's proceeds start the cure clocks, and the vehicle program sets the program relief.
      - category: delivery
        as: branch
        reads: [last_miss_cause, original_scheduled_date]
        note: The cause recorded on a missed handover appointment and the first scheduled date decide where the buyer's cure document clock starts.
    compute:
      - stated_shortage: "LATEST('title_transactions','amount', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='fee_shortage')"
      - latest_doc_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_document_received')"
      - latest_remit_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_state_fee_remitted')"
      - handover_date: "CFIELD('purchase','handover_date', purchase_order_id=F('purchase_order_id'))"
      - miss_cause: "CFIELD('delivery','last_miss_cause', purchase_order_id=F('purchase_order_id'))"
      - first_slot_date: "CFIELD('delivery','original_scheduled_date', purchase_order_id=F('purchase_order_id'))"
      - buyer_clock_start: "handover_date if ((miss_cause == 'kestrel_late' or miss_cause == 'vehicle_not_ready') and handover_date > F('opened_date')) else (first_slot_date if (miss_cause == 'customer_unavailable' and first_slot_date > F('opened_date')) else F('opened_date'))"
      - lender_postings: "XCOUNT('purchase','purchase_transactions', event_type='purchase_payment_posted', payment_source='outside_lender_proceeds')"
      - lender_posting_date: "XLATEST('purchase','purchase_transactions','txn_date', date_field='txn_date', event_type='purchase_payment_posted', payment_source='outside_lender_proceeds')"
      - kestrel_clock_start: "lender_posting_date if (lender_postings > 0 and lender_posting_date > latest_doc_date) else (handover_date if (handover_date > latest_doc_date and (lender_postings == 0 or lender_posting_date <= latest_doc_date)) else latest_doc_date)"
      - buyer_cure_late_days: "MX(0, DAYS(buyer_clock_start, latest_doc_date) - P('customer_document_due_days'))"
      - kestrel_cure_late_days: "MX(0, DAYS(kestrel_clock_start, latest_remit_date) - K('handling_allowance_days'))"
      - cure_share: "buyer_cure_late_days / (buyer_cure_late_days + kestrel_cure_late_days) if (buyer_cure_late_days > 0 and kestrel_cure_late_days > 0) else (0 if (kestrel_cure_late_days > 0 and buyer_cure_late_days == 0) else 1)"
      - vehicle_program: "CFIELD('purchase','variant_name', purchase_order_id=F('purchase_order_id'))"
      - program_relief: "K('relief_top_programs') if (vehicle_program == 'Kestrel Premium Certified' or vehicle_program == 'Kestrel Factory Certified') else (K('relief_certified_programs') if (vehicle_program == 'Kestrel Certified' or vehicle_program == 'Kestrel Certified Plus') else 0)"
      - returns_on_order: "COUNT('title_transactions', event_type='title_dmv_rejection_recorded')"
      - returns_relief: "K('relief_three_returns') if returns_on_order >= 3 else (K('relief_two_returns') if returns_on_order == 2 else 0)"
      - result: "RND(stated_shortage * cure_share * (1 - (program_relief + returns_relief)), 2)"
    compute_basis:
      stated_shortage: "the buyer's cure payment is the shortage the state stated on the order's most recent fee-shortage return"
      latest_doc_date: "to the date the order's latest document was received"
      latest_remit_date: "to the date of the order's most recent remittance to the state"
      handover_date: "it starts on the vehicle's handover date when the handover came after the order's latest document"
      miss_cause: "when a scheduled handover was missed for a reason on Kestrel's side (Kestrel running late or the vehicle not ready)"
      first_slot_date: "it starts on the first scheduled handover date when the buyer missed that appointment and that date came after the order's opening date"
      buyer_clock_start: "The buyer's cure document clock starts on the vehicle's actual handover date when a scheduled handover was missed for a reason on Kestrel's side (Kestrel running late or the vehicle not ready) and the handover came after the order's opening date; it starts on the first scheduled handover date when the buyer missed that appointment and that date came after the order's opening date; otherwise it starts on the order's opening date."
      lender_postings: "when an outside lender's proceeds were posted and the latest posting came after the order's latest document"
      lender_posting_date: "Kestrel's cure handling clock starts on the date an outside lender's proceeds were posted to the purchase order"
      kestrel_clock_start: "Kestrel's cure handling clock starts on the date an outside lender's proceeds were posted to the purchase order when an outside lender's proceeds were posted and the latest posting came after the order's latest document; it starts on the vehicle's handover date when the handover came after the order's latest document and no outside lender's proceeds were posted after that document; otherwise it starts on the date the order's latest document was received."
      buyer_cure_late_days: "The buyer's cure late days are the calendar days from the buyer's cure document clock start to the date the order's latest document was received, less the service's customer document due days, and never below zero."
      kestrel_cure_late_days: "Kestrel's cure late days are the calendar days from Kestrel's cure handling clock start to the date of the order's most recent remittance to the state, less a handling allowance of five calendar days, and never below zero."
      cure_share: "When both the buyer and Kestrel have cure late days, the cure share is the buyer's cure late days divided by the sum of the buyer's and Kestrel's cure late days; when Kestrel has cure late days and the buyer has none, the cure share is zero; otherwise the cure share is one, so the buyer bears the whole stated shortage."
      vehicle_program: "for the vehicle program on the purchase order"
      program_relief: "Kestrel relieves part of the cure payment for the vehicle program on the purchase order: one tenth for a Kestrel Premium Certified or Kestrel Factory Certified vehicle, one twentieth for a Kestrel Certified or Kestrel Certified Plus vehicle, and nothing for any other program."
      returns_on_order: "for the times the state has sent the order back"
      returns_relief: "Kestrel relieves a further part of the cure payment for the times the state has sent the order back: one fifth when the order carries three or more returns, one tenth when it carries exactly two, and nothing when it carries fewer."
      result: "The program relief and the returns relief are first added together and that total is taken off one; the cure payment is then the stated shortage multiplied by the cure share and by that remainder, and it is rounded half up to the cent only at the end."
    factors:
      - id: cure_cost_allocation
        effect: method
        decides: cure_share
        bindings: [buyer_cure_late_days, kestrel_cure_late_days, cure_share]
        ladder:
          - when: "both the buyer and Kestrel have cure late days"
            method: "the cure share is the buyer's cure late days divided by the sum of both sides' cure late days"
          - when: "Kestrel has cure late days and the buyer has none"
            method: "the cure share is zero"
          - when: "otherwise"
            method: "the cure share is one: the buyer bears the whole stated shortage"
        baseline:
          cure_share: "1"
        evidence: [history, date, cross_category]
        cross_difficulty: null
      - id: buyer_document_clock
        effect: method
        decides: buyer_clock_start
        bindings: [miss_cause, first_slot_date, buyer_clock_start]
        ladder:
          - when: "a scheduled handover was missed for a reason on Kestrel's side and the handover came after the opening date"
            method: "the buyer's document clock starts on the actual handover date"
          - when: "the buyer missed the first scheduled handover and that date came after the opening date"
            method: "the buyer's document clock starts on the first scheduled handover date"
          - when: "otherwise"
            method: "the buyer's document clock starts on the order's opening date"
        baseline:
          buyer_clock_start: "F('opened_date')"
        evidence: [cross_category, date]
        cross_difficulty: null
      - id: kestrel_handling_clock
        effect: method
        decides: kestrel_clock_start
        bindings: [handover_date, lender_postings, lender_posting_date, kestrel_clock_start]
        ladder:
          - when: "an outside lender's proceeds were posted and the latest posting came after the order's latest document"
            method: "Kestrel's handling clock starts on the outside lender's posting date"
          - when: "the handover came after the latest document and no outside lender's proceeds were posted after it"
            method: "Kestrel's handling clock starts on the handover date"
          - when: "otherwise"
            method: "Kestrel's handling clock starts on the date the latest document was received"
        baseline:
          kestrel_clock_start: "latest_doc_date"
        evidence: [cross_category, history, date]
        cross_difficulty: purchase
      - id: program_relief
        effect: parameter
        decides: program_relief
        bindings: [vehicle_program, program_relief]
        ladder:
          - when: "the purchase order's program is Kestrel Premium Certified or Kestrel Factory Certified"
            value: "K('relief_top_programs')"
          - when: "the purchase order's program is Kestrel Certified or Kestrel Certified Plus"
            value: "K('relief_certified_programs')"
          - when: "otherwise"
            value: "0"
        baseline:
          program_relief: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: returns_relief
        effect: parameter
        decides: returns_relief
        bindings: [returns_on_order, returns_relief]
        ladder:
          - when: "the order carries three or more returns from the state"
            value: "K('relief_three_returns')"
          - when: "the order carries exactly two returns from the state"
            value: "K('relief_two_returns')"
          - when: "otherwise"
            value: "0"
        baseline:
          returns_relief: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        When the state sends a packet back for a fee shortage, the buyer's cure payment is the shortage the state
        stated on the order's most recent fee-shortage return, collected from the buyer as its own fee entry booked
        against the registration fee.
      params: []
    inputs:
      history:
        - {table: title_transactions, aggregate: latest, field: amount, filters: {event_type: title_dmv_rejection_recorded, reject_code: fee_shortage}}
        - {table: title_transactions, aggregate: latest, field: txn_date, filters: {event_type: title_document_received}}
        - {table: title_transactions, aggregate: latest, field: txn_date, filters: {event_type: title_state_fee_remitted}}
        - {table: title_transactions, aggregate: count, field: title_txn_id, filters: {event_type: title_dmv_rejection_recorded}}
        - {category: purchase, table: purchase_transactions, aggregate: latest, field: txn_date, filters: {event_type: purchase_payment_posted, payment_source: outside_lender_proceeds}}
      cross_category: [purchase, delivery]
  - id: title_ext_extension_tag_validity
    base_policy_refs: [title_temp_tags, title_rejections, title_submission]
    overwrite:
      - base_policy: title_temp_tags
        superseded_clause: >-
          An extension tag is valid for the service's extension tag validity days from its issue date, unless the
          state's original-tag validity is larger, in which case that applies.
        replaced_by: >-
          Kestrel sizes an extension tag to the wait still ahead of the order by adding waiting allowances to that
          base validity, and never issues one for longer than twice the validity of the order's original tag.
    trigger: on_request
    subject: [title_temp_tag_issued, title_temp_tag_recorded]
    computes: valid_days
    target_tool: issue_title_extension_tag_53dbe274
    params:
      wait_slow_state: 7
      wait_moderate_state: 4
      wait_cure_in: 3
      wait_document_cure: 10
      wait_outside_lien: 5
      wait_kestrel_lien: 2
      wait_late_handover: 3
      wait_delayed_handover: 1
      stretch_last_returned: 1.25
      stretch_last_clean: 1.1
      carry_share_full: 1
      carry_share_half: 0.5
      state_max_extensions_AZ: 1
      state_max_extensions_TX: 1
      state_max_extensions_GA: 2
      state_max_extensions_FL: 1
      state_max_extensions_NC: 1
      state_max_extensions_OH: 1
      state_max_extensions_PA: 1
      state_max_extensions_CO: 2
    rule: >-
      An extension tag's base validity, in calendar days counted from its issue date, is the larger of the
      service's extension tag validity days and the validity of the order's original tag, which is the calendar
      days from the original tag's issue date to the expiration printed on it. An extension tag's validity is
      fixed only after the buyer's cure share of the shortage stated on the order's most recent fee-shortage
      return stands collected on the order as its own fee entry. Kestrel sizes an extension tag to the wait still
      ahead of the order by adding waiting allowances to that base validity, and never issues one for longer than
      twice the validity of the order's original tag. The extension turnaround allowance is seven days when the
      state took more than fourteen calendar days from the order's most recent submission to its most recent
      return, four days when it took eight to fourteen days, and nothing otherwise. The extension cure allowance
      looks at the returns dated on the order's most recent return date: it is three days when a fee-shortage
      return is dated on that date and a registration-fee entry has been collected on the order on or after that
      date, ten days when no fee-shortage return is dated on that date and a return needing a corrected document
      from the customer (a missing signature, insurance not verified, emissions not on file or an odometer
      discrepancy) is, and nothing otherwise. The extension lien allowance is five days when an outside
      lender's proceeds were posted to the purchase order, two days when Kestrel Auto Finance proceeds were
      posted to it and no outside lender's proceeds were, and nothing otherwise. The extension handover allowance
      is three days when the vehicle was handed over more than fourteen calendar days after the order's opening
      date, one day when it was handed over eight to fourteen days after that date, and nothing when it was
      handed over within seven days of the opening date. The four extension allowances are first added together, and that sum is then
      stretched when the new tag is the last extension that the lower of the service's limit and the
      registration state's maximum extensions allows: when the state has returned the order at least once, the
      sum is multiplied by one and a quarter and the product is rounded up to the next whole day, in the buyer's
      favour; when the state has never returned it, the sum is multiplied by one and a tenth and the product is
      rounded down to a whole day; when further extensions remain, the sum is taken as it is. The unused days of
      the current tag carry over to the extension at a carry-over share: the share is one when the extension is
      issued before the current tag's expiration date recorded on the order and the order is not awaiting the
      customer's documents, one half when it is issued before that date while the order is awaiting the
      customer's documents, and zero otherwise; the carried-over days are the calendar days from the issue date
      to that expiration date multiplied by the carry-over share and rounded down to a whole day. The extension tag's validity is the base validity
      plus the stretched allowances plus the carried-over days, capped at twice the original tag's
      validity, as a whole number of days.
    prerequisite:
      - problem: title_ext_shortage_cure_share
        kind: value_input
        gate: extension_cure_days
        form: state
        policy_source: >-
          An extension tag's validity is fixed only after the buyer's cure share of the shortage stated on the
          order's most recent fee-shortage return stands collected on the order as its own fee entry.
        condition: >-
          A fee-shortage return is dated on the order's most recent return date, and the order's title ledger
          carries a registration-fee entry collected on or after that date.
        resolved_by: pay_title_fee_shortage_f6fcb150
        effect: >-
          Once the buyer's cure share stands collected after the fee-shortage return, the extension cure allowance
          takes the three-day value for a cured fee shortage instead of nothing, so the validity rises by the
          stretched three days.
    cross_category:
      - category: purchase
        as: history
        reads: [handover_date, purchase_transactions.payment_source]
        note: The lender behind the purchase order's proceeds sets the extension lien allowance, and the handover date sets the extension handover allowance.
    compute:
      - original_issue_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_temp_tag_issued', tag_sequence=1)"
      - original_expiry_date: "LATEST('title_transactions','tag_expires_date', date_field='txn_date', event_type='title_temp_tag_issued', tag_sequence=1)"
      - original_validity: "DAYS(original_issue_date, original_expiry_date)"
      - base_validity: "MX(P('extension_tag_validity_days'), original_validity)"
      - latest_return_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded')"
      - state_turnaround: "DAYS(F('submitted_date'), latest_return_date)"
      - extension_turnaround_days: "K('wait_slow_state') if state_turnaround > 14 else (K('wait_moderate_state') if state_turnaround >= 8 else 0)"
      - fee_shortage_on_latest: "COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='fee_shortage') > 0 and LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='fee_shortage') == latest_return_date"
      - document_return_on_latest: "(COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='missing_signature') > 0 and LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='missing_signature') == latest_return_date) or (COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='insurance_not_verified') > 0 and LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='insurance_not_verified') == latest_return_date) or (COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='emissions_not_on_file') > 0 and LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='emissions_not_on_file') == latest_return_date) or (COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='odometer_discrepancy') > 0 and LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='odometer_discrepancy') == latest_return_date)"
      - latest_registration_collection: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_state_fee_collected', fee_type='registration_fee')"
      - extension_cure_days: "K('wait_cure_in') if (fee_shortage_on_latest and latest_registration_collection >= latest_return_date) else (K('wait_document_cure') if ((not fee_shortage_on_latest) and document_return_on_latest) else 0)"
      - outside_lender_postings: "XCOUNT('purchase','purchase_transactions', event_type='purchase_payment_posted', payment_source='outside_lender_proceeds')"
      - kestrel_finance_postings: "XCOUNT('purchase','purchase_transactions', event_type='purchase_payment_posted', payment_source='kestrel_finance_proceeds')"
      - extension_lien_days: "K('wait_outside_lien') if outside_lender_postings > 0 else (K('wait_kestrel_lien') if kestrel_finance_postings > 0 else 0)"
      - handover_date: "CFIELD('purchase','handover_date', purchase_order_id=F('purchase_order_id'))"
      - handover_gap: "DAYS(F('opened_date'), handover_date)"
      - extension_handover_days: "K('wait_late_handover') if handover_gap > 14 else (K('wait_delayed_handover') if handover_gap >= 8 else 0)"
      - tags_on_order: "COUNT('title_transactions', event_type='title_temp_tag_issued')"
      - extension_limit: "MN(P('max_temp_tag_extensions_service'), K('state_max_extensions_' + F('registration_state')))"
      - returns_on_order: "COUNT('title_transactions', event_type='title_dmv_rejection_recorded')"
      - allowance_sum: "extension_turnaround_days + extension_cure_days + extension_lien_days + extension_handover_days"
      - stretched_allowances: "(int(allowance_sum * K('stretch_last_returned')) + (1 if allowance_sum * K('stretch_last_returned') > int(allowance_sum * K('stretch_last_returned')) else 0)) if (tags_on_order >= extension_limit and returns_on_order > 0) else (int(allowance_sum * K('stretch_last_clean')) if (tags_on_order >= extension_limit and returns_on_order == 0) else allowance_sum)"
      - current_days_left: "DAYS(NOW, F('temp_tag_expires_date'))"
      - extension_carry_share: "K('carry_share_full') if (current_days_left > 0 and F('status') != 'awaiting_documents') else (K('carry_share_half') if (current_days_left > 0 and F('status') == 'awaiting_documents') else 0)"
      - extension_carry_days: "int(MX(0, current_days_left) * extension_carry_share)"
      - result: "int(MN(2 * original_validity, base_validity + stretched_allowances + extension_carry_days))"
    compute_basis:
      original_issue_date: "the calendar days from the original tag's issue date to the expiration printed on it"
      original_expiry_date: "the calendar days from the original tag's issue date to the expiration printed on it"
      original_validity: "the validity of the order's original tag, which is the calendar days from the original tag's issue date to the expiration printed on it"
      base_validity: "An extension tag's base validity, in calendar days counted from its issue date, is the larger of the service's extension tag validity days and the validity of the order's original tag"
      latest_return_date: "from the order's most recent submission to its most recent return"
      state_turnaround: "the state took more than fourteen calendar days from the order's most recent submission to its most recent return"
      extension_turnaround_days: "The extension turnaround allowance is seven days when the state took more than fourteen calendar days from the order's most recent submission to its most recent return, four days when it took eight to fourteen days, and nothing otherwise."
      fee_shortage_on_latest: "when a fee-shortage return is dated on that date"
      document_return_on_latest: "a return needing a corrected document from the customer (a missing signature, insurance not verified, emissions not on file or an odometer discrepancy) is"
      latest_registration_collection: "a registration-fee entry has been collected on the order on or after that date"
      extension_cure_days: "The extension cure allowance looks at the returns dated on the order's most recent return date: it is three days when a fee-shortage return is dated on that date and a registration-fee entry has been collected on the order on or after that date, ten days when no fee-shortage return is dated on that date and a return needing a corrected document from the customer (a missing signature, insurance not verified, emissions not on file or an odometer discrepancy) is, and nothing otherwise."
      outside_lender_postings: "when an outside lender's proceeds were posted to the purchase order"
      kestrel_finance_postings: "when Kestrel Auto Finance proceeds were posted to it and no outside lender's proceeds were"
      extension_lien_days: "The extension lien allowance is five days when an outside lender's proceeds were posted to the purchase order, two days when Kestrel Auto Finance proceeds were posted to it and no outside lender's proceeds were, and nothing otherwise."
      handover_date: "when the vehicle was handed over more than fourteen calendar days after the order's opening date"
      handover_gap: "when the vehicle was handed over more than fourteen calendar days after the order's opening date"
      extension_handover_days: "The extension handover allowance is three days when the vehicle was handed over more than fourteen calendar days after the order's opening date, one day when it was handed over eight to fourteen days after that date, and nothing when it was handed over within seven days of the opening date."
      tags_on_order: "when the new tag is the last extension that the lower of the service's limit and the registration state's maximum extensions allows"
      extension_limit: "the lower of the service's limit and the registration state's maximum extensions"
      returns_on_order: "when the state has returned the order at least once"
      allowance_sum: "The four extension allowances are first added together"
      stretched_allowances: "when the state has returned the order at least once, the sum is multiplied by one and a quarter and the product is rounded up to the next whole day, in the buyer's favour; when the state has never returned it, the sum is multiplied by one and a tenth and the product is rounded down to a whole day; when further extensions remain, the sum is taken as it is."
      current_days_left: "the calendar days from the issue date to that expiration date"
      extension_carry_share: "the share is one when the extension is issued before the current tag's expiration date recorded on the order and the order is not awaiting the customer's documents, one half when it is issued before that date while the order is awaiting the customer's documents, and zero otherwise"
      extension_carry_days: "the carried-over days are the calendar days from the issue date to that expiration date multiplied by the carry-over share and rounded down to a whole day."
      result: "The extension tag's validity is the base validity plus the stretched allowances plus the carried-over days, capped at twice the original tag's validity, as a whole number of days."
    factors:
      - id: extension_turnaround_allowance
        effect: parameter
        decides: extension_turnaround_days
        bindings: [state_turnaround, extension_turnaround_days]
        ladder:
          - when: "the state took more than fourteen calendar days from the most recent submission to the most recent return"
            value: "K('wait_slow_state')"
          - when: "the state took eight to fourteen calendar days"
            value: "K('wait_moderate_state')"
          - when: "otherwise"
            value: "0"
        baseline:
          extension_turnaround_days: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: extension_cure_allowance
        effect: parameter
        decides: extension_cure_days
        bindings: [fee_shortage_on_latest, document_return_on_latest, latest_registration_collection, extension_cure_days]
        ladder:
          - when: "a fee-shortage return is dated on the most recent return date and a registration-fee entry has been collected on or after that date"
            value: "K('wait_cure_in')"
          - when: "no fee-shortage return is dated on the most recent return date and a return needing a corrected customer document is"
            value: "K('wait_document_cure')"
          - when: "otherwise"
            value: "0"
        baseline:
          extension_cure_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: extension_lien_allowance
        effect: parameter
        decides: extension_lien_days
        bindings: [outside_lender_postings, kestrel_finance_postings, extension_lien_days]
        ladder:
          - when: "an outside lender's proceeds were posted to the purchase order"
            value: "K('wait_outside_lien')"
          - when: "Kestrel Auto Finance proceeds were posted and no outside lender's proceeds were"
            value: "K('wait_kestrel_lien')"
          - when: "otherwise"
            value: "0"
        baseline:
          extension_lien_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: purchase
      - id: extension_handover_allowance
        effect: parameter
        decides: extension_handover_days
        bindings: [handover_date, handover_gap, extension_handover_days]
        ladder:
          - when: "the vehicle was handed over more than fourteen calendar days after the opening date"
            value: "K('wait_late_handover')"
          - when: "the vehicle was handed over eight to fourteen days after the opening date"
            value: "K('wait_delayed_handover')"
          - when: "otherwise"
            value: "0"
        baseline:
          extension_handover_days: "0"
        evidence: [cross_category, date]
        cross_difficulty: purchase
      - id: extension_last_tag_stretch
        effect: method
        decides: stretched_allowances
        bindings: [tags_on_order, extension_limit, returns_on_order, stretched_allowances]
        ladder:
          - when: "the new tag is the last extension allowed and the state has returned the order at least once"
            method: "the summed allowances are multiplied by one and a quarter and the product is rounded up to the next whole day"
          - when: "the new tag is the last extension allowed and the state has never returned the order"
            method: "the summed allowances are multiplied by one and a tenth and the product is rounded down to a whole day"
          - when: "otherwise"
            method: "the summed allowances are taken as they are"
        baseline:
          stretched_allowances: "allowance_sum"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: extension_carry_over_share
        effect: parameter
        decides: extension_carry_share
        bindings: [current_days_left, extension_carry_share]
        ladder:
          - when: "issued before the current tag's expiration date while the order is not awaiting the customer's documents"
            value: "K('carry_share_full')"
          - when: "issued before the current tag's expiration date while the order is awaiting the customer's documents"
            value: "K('carry_share_half')"
          - when: "otherwise"
            value: "0"
        baseline:
          extension_carry_share: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        An extension tag's base validity, in calendar days counted from its issue date, is the larger of the
        service's extension tag validity days and the validity of the order's original tag, which is the calendar
        days from the original tag's issue date to the expiration printed on it.
      params: [extension_tag_validity_days]
    inputs:
      history:
        - {table: title_transactions, aggregate: latest, field: txn_date, filters: {event_type: title_temp_tag_issued, tag_sequence: 1}}
        - {table: title_transactions, aggregate: latest, field: txn_date, filters: {event_type: title_dmv_rejection_recorded}}
        - {table: title_transactions, aggregate: latest, field: txn_date, filters: {event_type: title_state_fee_collected}}
        - {table: title_transactions, aggregate: count, field: title_txn_id, filters: {event_type: title_temp_tag_issued}}
        - {table: title_transactions, aggregate: count, field: title_txn_id, filters: {event_type: title_dmv_rejection_recorded}}
        - {category: purchase, table: purchase_transactions, aggregate: count, field: purchase_txn_id, filters: {event_type: purchase_payment_posted}}
      cross_category: [purchase]
  # ---------------------------------------------------------------- claimed by task 1
  - id: title_ext_late_penalty_payment
    base_policy_refs: [title_service_fees, title_agg_household_fees, title_submission, title_rejections, title_reimbursements]
    overwrite:
      - base_policy: title_service_fees
        superseded_clause: >-
          after a fee-shortage rejection the stated shortage is collected as its own entry within the fee shortage
          collection days.
        replaced_by: >-
          Within the service's fee shortage collection days after a fee-shortage return, the buyer pays, as its own
          entry, either the buyer's cure share of the stated shortage when the return states an amount or the
          late-registration penalty when the return states no amount; the rest of a stated shortage is Kestrel's own
          cost.
      - base_policy: title_rejections
        superseded_clause: >-
          fee_shortage by collecting the stated shortage
        replaced_by: >-
          Within the service's fee shortage collection days after a fee-shortage return, the buyer pays, as its own
          entry, either the buyer's cure share of the stated shortage when the return states an amount or the
          late-registration penalty when the return states no amount; the rest of a stated shortage is Kestrel's own
          cost.
    trigger: state_due
    subject: [title_state_fee_collected]
    computes: amount
    target_tool: pay_title_late_penalty_3594d5af
    params:
      rate_standard: 0.12
      rate_8_to_30: 0.20
      rate_over_30: 0.40
      lien_notation_corrected: 15.00
      lien_notation_standard: 5.00
      notice_three_returns: 15.00
      notice_two_returns: 10.00
      dealer_deadline_days_AZ: 30
      dealer_deadline_days_TX: 30
      dealer_deadline_days_GA: 30
      dealer_deadline_days_FL: 30
      dealer_deadline_days_NC: 28
      dealer_deadline_days_OH: 30
      dealer_deadline_days_PA: 20
      dealer_deadline_days_CO: 30
    rule: >-
      When the state returns a packet as short because a late-registration penalty is due and states no amount on
      the return (a fee-shortage return of 0.00), the buyer pays the late-registration penalty, which is the
      standard penalty rate of twelve hundredths applied to the sum of the title fee and the registration fee
      collected on the order, rounded half up to the cent and booked as its own entry that is not a schedule fee.
      A shortage the state states as an amount is not a late-registration penalty under this rule. Within the
      service's fee shortage collection days after a fee-shortage return, the buyer pays, as its own entry, either
      the buyer's cure share of the stated shortage when the return states an amount or the late-registration
      penalty when the return states no amount; the rest of a stated shortage is Kestrel's own cost. The penalty's days late are the calendar days from the order's opening date to
      the penalty filing date, less the registration state's dealer deadline days from the state dealer deadline
      schedule, and never below zero. The penalty filing date is the day the penalty is collected when the state
      has returned the order for a lien information error on or after the order's most recent submission, because
      the corrected packet counts as filed only when it goes back; when there is no such lien return and a
      document was received after the order's most recent submission, it is the date that document was received;
      otherwise it is the date of the order's most recent remittance to the state. The penalty rate is four tenths
      when the penalty's days late exceed thirty, two tenths when they are eight to thirty, and the standard
      twelve hundredths otherwise. A lien notation charge is added: fifteen dollars when the order records a
      lienholder and the state has returned the order for a lien information error, five dollars when the order
      records a lienholder and no such return stands, and nothing when no lienholder is recorded. A return notice
      charge is added: fifteen dollars when the order carries three or more returns from the state, ten dollars
      when it carries exactly two, and nothing when it carries fewer. The penalty rate is applied to the sum of
      the two fees first, the lien notation charge and the return notice charge are then added, and the total is
      rounded half up to the cent only at the end.
    prerequisite: []
    cross_category: []
    compute:
      - title_fee_collected: "SUM('title_transactions','amount', event_type='title_state_fee_collected', fee_type='title_fee')"
      - registration_fee_collected: "SUM('title_transactions','amount', event_type='title_state_fee_collected', fee_type='registration_fee')"
      - penalty_fee_base: "title_fee_collected + registration_fee_collected"
      - lien_return_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='lien_information_error')"
      - latest_doc_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_document_received')"
      - latest_remit_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_state_fee_remitted')"
      - lien_returns: "COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='lien_information_error')"
      - penalty_filing_date: "NOW if (lien_returns > 0 and lien_return_date >= F('submitted_date')) else (latest_doc_date if latest_doc_date > F('submitted_date') else latest_remit_date)"
      - penalty_days_late: "MX(0, DAYS(F('opened_date'), penalty_filing_date) - K('dealer_deadline_days_' + F('registration_state')))"
      - penalty_rate: "K('rate_over_30') if penalty_days_late > 30 else (K('rate_8_to_30') if penalty_days_late >= 8 else K('rate_standard'))"
      - lien_notation_charge: "K('lien_notation_corrected') if (F('lienholder') != 'none' and lien_returns > 0) else (K('lien_notation_standard') if (F('lienholder') != 'none' and lien_returns == 0) else 0)"
      - returns_on_order: "COUNT('title_transactions', event_type='title_dmv_rejection_recorded')"
      - return_notice_charge: "K('notice_three_returns') if returns_on_order >= 3 else (K('notice_two_returns') if returns_on_order == 2 else 0)"
      - result: "RND(penalty_fee_base * penalty_rate + lien_notation_charge + return_notice_charge, 2)"
    compute_basis:
      title_fee_collected: "applied to the sum of the title fee and the registration fee collected on the order"
      registration_fee_collected: "applied to the sum of the title fee and the registration fee collected on the order"
      lien_return_date: "when the state has returned the order for a lien information error on or after the order's most recent submission"
      latest_doc_date: "when there is no such lien return and a document was received after the order's most recent submission, it is the date that document was received"
      latest_remit_date: "otherwise it is the date of the order's most recent remittance to the state"
      lien_returns: "the state has returned the order for a lien information error"
      penalty_filing_date: "The penalty filing date is the day the penalty is collected when the state has returned the order for a lien information error on or after the order's most recent submission, because the corrected packet counts as filed only when it goes back; when there is no such lien return and a document was received after the order's most recent submission, it is the date that document was received; otherwise it is the date of the order's most recent remittance to the state."
      penalty_days_late: "The penalty's days late are the calendar days from the order's opening date to the penalty filing date, less the registration state's dealer deadline days from the state dealer deadline schedule, and never below zero."
      penalty_rate: "The penalty rate is four tenths when the penalty's days late exceed thirty, two tenths when they are eight to thirty, and the standard twelve hundredths otherwise."
      lien_notation_charge: "A lien notation charge is added: fifteen dollars when the order records a lienholder and the state has returned the order for a lien information error, five dollars when the order records a lienholder and no such return stands, and nothing when no lienholder is recorded."
      returns_on_order: "when the order carries three or more returns from the state"
      return_notice_charge: "A return notice charge is added: fifteen dollars when the order carries three or more returns from the state, ten dollars when it carries exactly two, and nothing when it carries fewer."
      result: "The penalty rate is applied to the sum of the two fees first, the lien notation charge and the return notice charge are then added, and the total is rounded half up to the cent only at the end."
    factors:
      - id: penalty_filing_date_rule
        effect: method
        decides: penalty_filing_date
        bindings: [lien_return_date, latest_doc_date, latest_remit_date, penalty_filing_date]
        ladder:
          - when: "the state has returned the order for a lien information error on or after the most recent submission"
            method: "the packet counts as filed on the day the penalty is collected"
          - when: "no such lien return stands and a document was received after the most recent submission"
            method: "the packet counts as filed on the date that document was received"
          - when: "otherwise"
            method: "the packet counts as filed on the date of the most recent remittance to the state"
        baseline:
          penalty_filing_date: "latest_remit_date"
        evidence: [history, date]
        cross_difficulty: null
      - id: penalty_rate_band
        effect: parameter
        decides: penalty_rate
        bindings: [penalty_days_late, penalty_rate]
        ladder:
          - when: "the penalty's days late exceed thirty"
            value: "K('rate_over_30')"
          - when: "the penalty's days late are eight to thirty"
            value: "K('rate_8_to_30')"
          - when: "otherwise"
            value: "K('rate_standard')"
        baseline:
          penalty_rate: "K('rate_standard')"
        evidence: [date]
        cross_difficulty: null
      - id: lien_notation_charge
        effect: parameter
        decides: lien_notation_charge
        bindings: [lien_returns, lien_notation_charge]
        ladder:
          - when: "the order records a lienholder and the state has returned it for a lien information error"
            value: "K('lien_notation_corrected')"
          - when: "the order records a lienholder and no lien information error return stands"
            value: "K('lien_notation_standard')"
          - when: "otherwise"
            value: "0"
        baseline:
          lien_notation_charge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: return_notice_charge
        effect: parameter
        decides: return_notice_charge
        bindings: [returns_on_order, return_notice_charge]
        ladder:
          - when: "the order carries three or more returns from the state"
            value: "K('notice_three_returns')"
          - when: "the order carries exactly two returns from the state"
            value: "K('notice_two_returns')"
          - when: "otherwise"
            value: "0"
        baseline:
          return_notice_charge: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        When the state returns a packet as short because a late-registration penalty is due and states no amount on
        the return (a fee-shortage return of 0.00), the buyer pays the late-registration penalty, which is the
        standard penalty rate of twelve hundredths applied to the sum of the title fee and the registration fee
        collected on the order, rounded half up to the cent and booked as its own entry that is not a schedule fee.
      params: [rate_standard]
    inputs:
