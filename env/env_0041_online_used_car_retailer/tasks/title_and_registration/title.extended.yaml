        - {table: title_transactions, aggregate: sum, field: amount, filters: {event_type: title_state_fee_collected, fee_type: registration_fee}}
        - {table: title_transactions, aggregate: latest, field: txn_date, filters: {event_type: title_dmv_rejection_recorded, reject_code: lien_information_error}}
        - {table: title_transactions, aggregate: latest, field: txn_date, filters: {event_type: title_state_fee_remitted}}
        - {table: title_transactions, aggregate: count, field: title_txn_id, filters: {event_type: title_dmv_rejection_recorded}}
      cross_category: []

  - id: title_ext_lien_correction_charges
    base_policy_refs: [title_service_fees, title_agg_household_fees, title_rejections, title_completion]
    overwrite:
      - base_policy: title_rejections
        superseded_clause: >-
          lien_information_error is cured by Kestrel from the finance records
        replaced_by: >-
          When the state returns a packet for a lien information error, Kestrel corrects the lien data from the
          finance records and the buyer pays the lien charges for the corrected lien, which are the registration
          state's lien recording fee from the state fee schedule, booked as a lien recording fee entry and rounded half
          up to the cent.
    trigger: state_due
    subject: [title_state_fee_collected]
    computes: amount
    target_tool: pay_title_lien_charges_e09cfc3d
    params:
      lien_fee_AZ: 0.00
      lien_fee_TX: 0.00
      lien_fee_GA: 0.00
      lien_fee_FL: 2.00
      lien_fee_NC: 21.50
      lien_fee_OH: 15.00
      lien_fee_PA: 34.00
      lien_fee_CO: 0.00
      surcharge_over_60: 10.00
      surcharge_31_to_60: 5.00
      efile_outside_lender: 3.00
      efile_kestrel_finance: 1.00
      notation_correction_existing: 8.00
      notation_added_late: 4.00
    rule: >-
      When the state returns a packet for a lien information error, Kestrel corrects the lien data from the
      finance records and the buyer pays the lien charges for the corrected lien, which are the registration
      state's lien recording fee from the state fee schedule, booked as a lien recording fee entry and rounded half
      up to the cent. This applies while the state's return for a lien information error is dated on or after the
      order's most recent submission. The lien wait days are the calendar days from the lien wait start to the day
      the lien charges are collected. The lien wait starts on the order's most recent submission date when an outside
      lender's proceeds were posted to the purchase order, because the lender's lien was on record when that packet
      went to the state; it starts on the date of the order's most recent lien information error return when Kestrel
      Auto Finance proceeds were posted and no outside lender's proceeds were, because the faulty lien data came from
      Kestrel's own finance records and the wait before the return is Kestrel's; otherwise, when no lender's
      proceeds were posted, it starts on the order's opening date. A late lien
      surcharge is added: ten dollars when the lien wait days exceed sixty, five dollars when they are thirty-one
      to sixty, and nothing otherwise. An electronic lien filing charge, passed through from the lender's
      electronic lien service, is added: three dollars when an outside lender's proceeds were posted to the
      purchase order, one dollar when Kestrel Auto Finance proceeds were posted and no outside lender's proceeds
      were, and nothing when no lender's proceeds were posted. A lien notation correction charge is added: eight
      dollars when a lien recording fee was already collected on the order, because a recorded notation has to be
      corrected; four dollars when no lien recording fee was collected and the order records a lienholder,
      because the notation is added late; and nothing when the order records no lienholder. The lien recording
      fee, the late lien surcharge, the electronic lien filing charge and the lien notation correction charge are
      added together and the total is rounded half up to the cent.
    prerequisite: []
    cross_category:
      - category: purchase
        as: history
        reads: [purchase_transactions.payment_source]
        note: Whether an outside lender's or Kestrel Auto Finance proceeds were posted on the purchase ledger chooses where the lien wait starts and sets the electronic lien filing charge.
    compute:
      - lien_recording_fee_due: "K('lien_fee_' + F('registration_state'))"
      - outside_postings: "XCOUNT('purchase','purchase_transactions', event_type='purchase_payment_posted', payment_source='outside_lender_proceeds')"
      - kestrel_finance_postings: "XCOUNT('purchase','purchase_transactions', event_type='purchase_payment_posted', payment_source='kestrel_finance_proceeds')"
      - lien_return_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='lien_information_error')"
      - lien_wait_start: "F('submitted_date') if outside_postings > 0 else (lien_return_date if (kestrel_finance_postings > 0 and outside_postings == 0) else F('opened_date'))"
      - lien_wait_days: "DAYS(lien_wait_start, NOW)"
      - lien_surcharge: "K('surcharge_over_60') if lien_wait_days > 60 else (K('surcharge_31_to_60') if lien_wait_days >= 31 else 0)"
      - lien_efile_charge: "K('efile_outside_lender') if outside_postings > 0 else (K('efile_kestrel_finance') if (kestrel_finance_postings > 0 and outside_postings == 0) else 0)"
      - lien_fees_collected: "COUNT('title_transactions', event_type='title_state_fee_collected', fee_type='lien_recording_fee')"
      - lien_notation_correction: "K('notation_correction_existing') if lien_fees_collected > 0 else (K('notation_added_late') if (lien_fees_collected == 0 and F('lienholder') != 'none') else 0)"
      - result: "RND(lien_recording_fee_due + lien_surcharge + lien_efile_charge + lien_notation_correction, 2)"
    compute_basis:
      lien_recording_fee_due: "which are the registration state's lien recording fee from the state fee schedule"
      lien_return_date: "it starts on the date of the order's most recent lien information error return"
      outside_postings: "when an outside lender's proceeds were posted to the purchase order"
      kestrel_finance_postings: "one dollar when Kestrel Auto Finance proceeds were posted and no outside lender's proceeds were"
      lien_wait_start: "The lien wait starts on the order's most recent submission date when an outside lender's proceeds were posted to the purchase order, because the lender's lien was on record when that packet went to the state; it starts on the date of the order's most recent lien information error return when Kestrel Auto Finance proceeds were posted and no outside lender's proceeds were, because the faulty lien data came from Kestrel's own finance records and the wait before the return is Kestrel's; otherwise, when no lender's proceeds were posted, it starts on the order's opening date."
      lien_wait_days: "The lien wait days are the calendar days from the lien wait start to the day the lien charges are collected."
      lien_surcharge: "A late lien surcharge is added: ten dollars when the lien wait days exceed sixty, five dollars when they are thirty-one to sixty, and nothing otherwise."
      lien_efile_charge: "An electronic lien filing charge, passed through from the lender's electronic lien service, is added: three dollars when an outside lender's proceeds were posted to the purchase order, one dollar when Kestrel Auto Finance proceeds were posted and no outside lender's proceeds were, and nothing when no lender's proceeds were posted."
      lien_fees_collected: "when a lien recording fee was already collected on the order"
      lien_notation_correction: "A lien notation correction charge is added: eight dollars when a lien recording fee was already collected on the order, because a recorded notation has to be corrected; four dollars when no lien recording fee was collected and the order records a lienholder, because the notation is added late; and nothing when the order records no lienholder."
      result: "The lien recording fee, the late lien surcharge, the electronic lien filing charge and the lien notation correction charge are added together and the total is rounded half up to the cent."
    factors:
      - id: lien_wait_clock
        effect: method
        decides: lien_wait_start
        bindings: [lien_return_date, lien_wait_start]
        ladder:
          - when: "an outside lender's proceeds were posted to the purchase order"
            method: "the lien wait starts on the order's most recent submission date"
          - when: "Kestrel Auto Finance proceeds were posted and no outside lender's proceeds were"
            method: "the lien wait starts on the date of the most recent lien information error return"
          - when: "otherwise (no lender's proceeds posted)"
            method: "the lien wait starts on the order's opening date"
        baseline:
          lien_wait_start: "F('opened_date')"
        evidence: [history, date]
        cross_difficulty: null
      - id: late_lien_surcharge
        effect: parameter
        decides: lien_surcharge
        bindings: [lien_wait_days, lien_surcharge]
        ladder:
          - when: "the lien wait days exceed sixty"
            value: "K('surcharge_over_60')"
          - when: "the lien wait days are thirty-one to sixty"
            value: "K('surcharge_31_to_60')"
          - when: "otherwise"
            value: "0"
        baseline:
          lien_surcharge: "0"
        evidence: [date]
        cross_difficulty: null
      - id: electronic_lien_filing_charge
        effect: parameter
        decides: lien_efile_charge
        bindings: [outside_postings, kestrel_finance_postings, lien_efile_charge]
        ladder:
          - when: "an outside lender's proceeds were posted to the purchase order"
            value: "K('efile_outside_lender')"
          - when: "Kestrel Auto Finance proceeds were posted and no outside lender's proceeds were"
            value: "K('efile_kestrel_finance')"
          - when: "otherwise (no lender's proceeds posted)"
            value: "0"
        baseline:
          lien_efile_charge: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: lien_notation_correction_charge
        effect: parameter
        decides: lien_notation_correction
        bindings: [lien_fees_collected, lien_notation_correction]
        ladder:
          - when: "a lien recording fee was already collected on the order"
            value: "K('notation_correction_existing')"
          - when: "no lien recording fee was collected and the order records a lienholder"
            value: "K('notation_added_late')"
          - when: "otherwise (the order records no lienholder)"
            value: "0"
        baseline:
          lien_notation_correction: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        When the state returns a packet for a lien information error, Kestrel corrects the lien data from the
        finance records and the buyer pays the lien charges for the corrected lien, which are the registration
        state's lien recording fee from the state fee schedule, booked as a lien recording fee entry and rounded half
        up to the cent.
      params: [lien_fee_AZ, lien_fee_TX, lien_fee_GA, lien_fee_FL, lien_fee_NC, lien_fee_OH, lien_fee_PA, lien_fee_CO]
    inputs:
      history:
        - {table: title_transactions, aggregate: count, field: title_txn_id, filters: {event_type: title_state_fee_collected, fee_type: lien_recording_fee}}
        - {category: purchase, table: purchase_transactions, aggregate: count, field: purchase_txn_id, filters: {event_type: purchase_payment_posted}}
        - {table: title_transactions, aggregate: latest, field: txn_date, filters: {event_type: title_dmv_rejection_recorded, reject_code: lien_information_error}}
      cross_category: [purchase]

  - id: title_ext_resubmission_remittance
    base_policy_refs: [title_submission, title_rejections, title_temp_tags]
    overwrite:
      - base_policy: title_submission
        superseded_clause: >-
          Every held state fee is remitted with the submission as its own remittance entry.
        replaced_by: >-
          When a returned packet goes back to the state, Kestrel remits every state fee held on the order with it as
          one remittance entry for the total, and the order is made ready again and submitted on that day in the same
          action.
    trigger: state_due
    subject: [title_resubmission_prepared, title_submitted_to_dmv, title_state_fee_remitted]
    computes: remit_amount
    target_tool: resubmit_title_packet_8a13d7a9
    params:
      expedite_long_lapse: 25.00
      expedite_short_lapse: 15.00
      channel_mailed: 18.00
      channel_electronic: 4.00
      courier_outside_lender: 12.00
      courier_kestrel_finance: 6.00
      review_long: 8.00
      review_moderate: 4.00
      state_max_extensions_AZ: 1
      state_max_extensions_TX: 1
      state_max_extensions_GA: 2
      state_max_extensions_FL: 1
      state_max_extensions_NC: 1
      state_max_extensions_OH: 1
      state_max_extensions_PA: 1
      state_max_extensions_CO: 2
    rule: >-
      When a returned packet goes back to the state, Kestrel remits every state fee held on the order with it as
      one remittance entry for the total, and the order is made ready again and submitted on that day in the same
      action. A returned packet does not
      go back to the state until the late-registration penalty named on a fee-shortage return that states no
      amount stands collected on the order as its own fee entry. A packet returned for a lien information error
      goes back to the state only after the lien charges for the corrected lien stand collected on the order as a
      lien recording fee entry. Kestrel pays its own cost of a stated shortage with the remittance: when the order's most
      recent fee-shortage return states an amount and no remittance has been made since that return, Kestrel adds
      the rest of the stated shortage, which is the stated shortage less the buyer's cure share collected for it
      as a registration-fee entry on or after that return, never below zero. Kestrel also adds to the same remittance the resubmission charges it funds
      itself. The
      tag lapse starts on the current tag's expiration date recorded on the order when every extension tag that
      the lower of the service's limit and the registration state's maximum extensions allows has been used and
      that tag has expired; it starts on the date of the order's most recent return when an extension is still
      allowed and the current tag has expired; otherwise there is no lapse and it starts on the day the packet
      goes back. The tag lapse days are the calendar days from the tag lapse start to the day the packet goes
      back. An expedited-handling charge is added: twenty-five dollars when the tag lapse days exceed fourteen,
      fifteen dollars when they are one to fourteen, and nothing otherwise. A packet channel charge is added:
      eighteen dollars when the service sends packets to the buyer's county office by mail, four dollars when the
      service submits electronically and a lien recording fee stands collected on the order, because the lien
      papers go with the electronic packet, and nothing when the service submits electronically and no lien
      recording fee stands collected. A lender courier charge is added: twelve dollars when an outside
      lender's proceeds were posted to the purchase order and the state has returned the order for a lien
      information error, six dollars when only Kestrel Auto Finance proceeds were posted and such a return stands,
      and nothing otherwise. A state re-review charge is added: eight dollars when the state took more than thirty
      calendar days from the order's most recent submission to its most recent return, four dollars when it took
      fifteen to thirty days, and nothing otherwise. The held fees, Kestrel's own cost of a stated shortage and the
      four resubmission charges are added together and the total is rounded half up to the cent.
    prerequisite:
      - problem: title_ext_late_penalty_payment
        kind: value_input
        gate: held_fees
        form: state
        policy_source: >-
          A returned packet does not go back to the state until the late-registration penalty named on a
          fee-shortage return that states no amount stands collected on the order as its own fee entry.
        condition: >-
          After a fee-shortage return of 0.00, the order's title ledger carries a collected entry that is not a
          schedule fee, dated on or after that return, and the order's held state fees include it.
        resolved_by: pay_title_late_penalty_3594d5af
        effect: >-
          The collected late-registration penalty is added to the state fees held on the order, so the held fees
          remitted with the packet rise by the penalty amount.
      - problem: title_ext_lien_correction_charges
        kind: value_input
        gate: held_fees
        form: state
        policy_source: >-
          A packet returned for a lien information error goes back to the state only after the lien charges for the
          corrected lien stand collected on the order as a lien recording fee entry.
        condition: >-
          After a lien information error return, the order's title ledger carries a lien recording fee collected on
          or after that return, and the order's held state fees include it.
        resolved_by: pay_title_lien_charges_e09cfc3d
        effect: >-
          The collected lien charges are added to the state fees held on the order, so the held fees remitted with
          the packet rise by the lien charges.
    cross_category:
      - category: purchase
        as: history
        reads: [purchase_transactions.payment_source]
        note: Whether an outside lender's or Kestrel Auto Finance proceeds were posted decides the lender courier charge.
    compute:
      - held_fees: "F('state_fees_held')"
      - stated_shortage_returns: "COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='fee_shortage')"
      - shortage_return_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='fee_shortage')"
      - shortage_stated: "LATEST('title_transactions','amount', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='fee_shortage')"
      - remittances_on_order: "COUNT('title_transactions', event_type='title_state_fee_remitted')"
      - latest_remit_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_state_fee_remitted')"
      - cure_entry_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_state_fee_collected', fee_type='registration_fee')"
      - cure_entry_amount: "LATEST('title_transactions','amount', date_field='txn_date', event_type='title_state_fee_collected', fee_type='registration_fee')"
      - cure_share_collected: "cure_entry_amount if (stated_shortage_returns > 0 and cure_entry_date >= shortage_return_date) else 0"
      - kestrel_shortage_topup: "MX(0, shortage_stated - cure_share_collected) if (stated_shortage_returns > 0 and (remittances_on_order == 0 or shortage_return_date > latest_remit_date)) else 0"
      - latest_return_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded')"
      - tags_on_order: "COUNT('title_transactions', event_type='title_temp_tag_issued')"
      - extension_limit: "MN(P('max_temp_tag_extensions_service'), K('state_max_extensions_' + F('registration_state')))"
      - tag_lapse_start: "F('temp_tag_expires_date') if (tags_on_order - 1 >= extension_limit and F('temp_tag_expires_date') < NOW) else (latest_return_date if (tags_on_order - 1 < extension_limit and F('temp_tag_expires_date') < NOW) else NOW)"
      - tag_lapse_days: "MX(0, DAYS(tag_lapse_start, NOW))"
      - expedite_charge: "K('expedite_long_lapse') if tag_lapse_days > 14 else (K('expedite_short_lapse') if tag_lapse_days >= 1 else 0)"
      - lien_fee_entries: "COUNT('title_transactions', event_type='title_state_fee_collected', fee_type='lien_recording_fee')"
      - channel_charge: "K('channel_mailed') if P('county_submission_by_mail') else (K('channel_electronic') if ((not P('county_submission_by_mail')) and lien_fee_entries > 0) else 0)"
      - lien_returns: "COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='lien_information_error')"
      - outside_postings: "XCOUNT('purchase','purchase_transactions', event_type='purchase_payment_posted', payment_source='outside_lender_proceeds')"
      - kestrel_finance_postings: "XCOUNT('purchase','purchase_transactions', event_type='purchase_payment_posted', payment_source='kestrel_finance_proceeds')"
      - courier_charge: "K('courier_outside_lender') if (outside_postings > 0 and lien_returns > 0) else (K('courier_kestrel_finance') if (kestrel_finance_postings > 0 and outside_postings == 0 and lien_returns > 0) else 0)"
      - state_review_days: "DAYS(F('submitted_date'), latest_return_date)"
      - review_charge: "K('review_long') if state_review_days > 30 else (K('review_moderate') if state_review_days >= 15 else 0)"
      - result: "RND(held_fees + kestrel_shortage_topup + expedite_charge + channel_charge + courier_charge + review_charge, 2)"
    compute_basis:
      held_fees: "Kestrel remits every state fee held on the order with it as one remittance entry for the total"
      stated_shortage_returns: "when the order's most recent fee-shortage return states an amount"
      shortage_return_date: "no remittance has been made since that return"
      shortage_stated: "the stated shortage"
      remittances_on_order: "no remittance has been made since that return"
      latest_remit_date: "no remittance has been made since that return"
      cure_entry_date: "the buyer's cure share collected for it as a registration-fee entry on or after that return"
      cure_entry_amount: "the buyer's cure share collected for it as a registration-fee entry on or after that return"
      cure_share_collected: "the buyer's cure share collected for it as a registration-fee entry on or after that return"
      kestrel_shortage_topup: "Kestrel pays its own cost of a stated shortage with the remittance: when the order's most recent fee-shortage return states an amount and no remittance has been made since that return, Kestrel adds the rest of the stated shortage, which is the stated shortage less the buyer's cure share collected for it as a registration-fee entry on or after that return, never below zero."
      latest_return_date: "it starts on the date of the order's most recent return when an extension is still allowed and the current tag has expired"
      tags_on_order: "when every extension tag that the lower of the service's limit and the registration state's maximum extensions allows has been used"
      extension_limit: "the lower of the service's limit and the registration state's maximum extensions"
      tag_lapse_start: "The tag lapse starts on the current tag's expiration date recorded on the order when every extension tag that the lower of the service's limit and the registration state's maximum extensions allows has been used and that tag has expired; it starts on the date of the order's most recent return when an extension is still allowed and the current tag has expired; otherwise there is no lapse and it starts on the day the packet goes back."
      tag_lapse_days: "The tag lapse days are the calendar days from the tag lapse start to the day the packet goes back."
      expedite_charge: "An expedited-handling charge is added: twenty-five dollars when the tag lapse days exceed fourteen, fifteen dollars when they are one to fourteen, and nothing otherwise."
      lien_fee_entries: "a lien recording fee stands collected on the order"
      channel_charge: "A packet channel charge is added: eighteen dollars when the service sends packets to the buyer's county office by mail, four dollars when the service submits electronically and a lien recording fee stands collected on the order, because the lien papers go with the electronic packet, and nothing when the service submits electronically and no lien recording fee stands collected."
      lien_returns: "the state has returned the order for a lien information error"
      outside_postings: "when an outside lender's proceeds were posted to the purchase order"
      kestrel_finance_postings: "six dollars when only Kestrel Auto Finance proceeds were posted and such a return stands"
      courier_charge: "A lender courier charge is added: twelve dollars when an outside lender's proceeds were posted to the purchase order and the state has returned the order for a lien information error, six dollars when only Kestrel Auto Finance proceeds were posted and such a return stands, and nothing otherwise."
      state_review_days: "when the state took more than thirty calendar days from the order's most recent submission to its most recent return"
      review_charge: "A state re-review charge is added: eight dollars when the state took more than thirty calendar days from the order's most recent submission to its most recent return, four dollars when it took fifteen to thirty days, and nothing otherwise."
      result: "The held fees, Kestrel's own cost of a stated shortage and the four resubmission charges are added together and the total is rounded half up to the cent."
    factors:
      - id: tag_lapse_clock
        effect: method
        decides: tag_lapse_start
        bindings: [tags_on_order, extension_limit, tag_lapse_start]
        ladder:
          - when: "every extension the lower limit allows has been used and the current tag has expired"
            method: "the tag lapse starts on the current tag's expiration date"
          - when: "an extension is still allowed and the current tag has expired"
            method: "the tag lapse starts on the date of the most recent return"
          - when: "otherwise"
            method: "there is no lapse; it starts on the day the packet goes back"
        baseline:
          tag_lapse_start: "NOW"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: expedited_handling_charge
        effect: parameter
        decides: expedite_charge
        bindings: [tag_lapse_days, expedite_charge]
        ladder:
          - when: "the tag lapse days exceed fourteen"
            value: "K('expedite_long_lapse')"
          - when: "the tag lapse days are one to fourteen"
            value: "K('expedite_short_lapse')"
          - when: "otherwise"
            value: "0"
        baseline:
          expedite_charge: "0"
        evidence: [date]
        cross_difficulty: null
      - id: packet_channel_charge
        effect: parameter
        decides: channel_charge
        bindings: [lien_fee_entries, channel_charge]
        ladder:
          - when: "the service sends packets to the buyer's county office by mail"
            value: "K('channel_mailed')"
          - when: "the service submits electronically and a lien recording fee stands collected on the order"
            value: "K('channel_electronic')"
          - when: "otherwise (electronic submission, no lien recording fee collected)"
            value: "0"
        baseline:
          channel_charge: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: lender_courier_charge
        effect: parameter
        decides: courier_charge
        bindings: [lien_returns, outside_postings, kestrel_finance_postings, courier_charge]
        ladder:
          - when: "an outside lender's proceeds were posted and a lien information error return stands"
            value: "K('courier_outside_lender')"
          - when: "only Kestrel Auto Finance proceeds were posted and a lien information error return stands"
            value: "K('courier_kestrel_finance')"
          - when: "otherwise"
            value: "0"
        baseline:
          courier_charge: "0"
        evidence: [history, cross_category]
        cross_difficulty: purchase
      - id: state_re_review_charge
        effect: parameter
        decides: review_charge
        bindings: [latest_return_date, state_review_days, review_charge]
        ladder:
          - when: "the state took more than thirty calendar days from the most recent submission to the most recent return"
            value: "K('review_long')"
          - when: "the state took fifteen to thirty days"
            value: "K('review_moderate')"
          - when: "otherwise"
            value: "0"
        baseline:
          review_charge: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        When a returned packet goes back to the state, Kestrel remits every state fee held on the order with it as
        one remittance entry for the total, and the order is made ready again and submitted on that day in the same
        action. Kestrel pays its own cost of a stated shortage with the remittance: when the order's most
        recent fee-shortage return states an amount and no remittance has been made since that return, Kestrel adds
        the rest of the stated shortage, which is the stated shortage less the buyer's cure share collected for it
        as a registration-fee entry on or after that return, never below zero.
      params: []
    inputs:
      history:
        - {table: title_transactions, aggregate: count, field: title_txn_id, filters: {event_type: title_temp_tag_issued}}
        - {table: title_transactions, aggregate: count, field: title_txn_id, filters: {event_type: title_dmv_rejection_recorded}}
        - {table: title_transactions, aggregate: latest, field: txn_date, filters: {event_type: title_dmv_rejection_recorded}}
        - {category: purchase, table: purchase_transactions, aggregate: count, field: purchase_txn_id, filters: {event_type: purchase_payment_posted}}
      cross_category: [purchase]

  - id: title_ext_late_penalty_reimbursement
    base_policy_refs: [title_reimbursements, title_submission, title_rejections, title_documents]
    overwrite:
      - base_policy: title_reimbursements
        superseded_clause: >-
          A state late-registration penalty is reimbursed in full
        replaced_by: >-
          A state late-registration penalty is reimbursed at the reimbursed share set out below when the service
          reimburses late penalties, the first submission missed the state's dealer deadline, and the customer
          returned every required document within the customer document due days.
    trigger: on_request
    subject: [title_reimbursement_paid]
    computes: amount
    target_tool: reimburse_title_late_penalty_e7fb1913
    params:
      long_wait_over_45: 0.10
      long_wait_21_to_45: 0.05
      program_top: 0.10
      program_certified: 0.05
      prompt_half_due: 0.05
      prompt_within_due: 0.02
      dealer_deadline_days_AZ: 30
      dealer_deadline_days_TX: 30
      dealer_deadline_days_GA: 30
      dealer_deadline_days_FL: 30
      dealer_deadline_days_NC: 28
      dealer_deadline_days_OH: 30
      dealer_deadline_days_PA: 20
      dealer_deadline_days_CO: 30
    rule: >-
      The reimbursable penalty is the penalty collected on the order on or after the order's most recent
      fee-shortage return, but no more than the remittance made to the state on or after that return, and the
      standard reimbursement is that reimbursable penalty rounded half up to the cent. A state late-registration penalty is
      reimbursed at the reimbursed share set out below when the service reimburses late penalties, the first
      submission missed the state's dealer deadline, and the customer returned every required document within the
      customer document due days. The late-penalty reimbursement is not fixed until the late-registration penalty
      named on the order's most recent fee-shortage return stands collected on the order as its own fee entry. The
      late-penalty reimbursement is booked only after the order's ledger shows a remittance to the state dated on
      or after its most recent fee-shortage return. The order's first submission date is the date its title fee was
      remitted to the state. Kestrel's penalty end date is the order's most recent submission date when the state
      returned the order for a lien information error and the order was submitted again after that return; it is
      the date of the order's latest document when the state returned the order for a document from the customer,
      no lien information error return stands, and the order was submitted again after its most recent return;
      otherwise it is the order's first submission date. The penalty's total days late are the calendar days from
      the order's opening date to Kestrel's penalty end date, less the registration state's dealer deadline days,
      never below zero. The buyer's handover delay days are the calendar days from the first scheduled
      handover date to the actual handover date when the buyer missed the first scheduled handover; the buyer's
      correction days are the calendar days from the order's most recent return that needed a corrected document
      from the customer to the date the order's latest document was received, when that document arrived after
      the return. When the buyer missed the first scheduled handover and the order's first submission came after
      the handover, the reimbursed share is the penalty's total days late less the buyer's handover delay days,
      never below zero, divided by the penalty's total days late; when the buyer did not miss a handover in that
      way and the state returned the order for a document from the customer, the reimbursed share is the
      penalty's total days late less the buyer's correction days, never below zero, divided by the penalty's total
      days late; otherwise the reimbursed share is the whole reimbursable penalty, a share of one. Three additions raise the reimbursed share: one tenth when more than forty-five calendar days
      have passed from the first submission date to the day of reimbursement, one twentieth when twenty-one to
      forty-five days have, and nothing otherwise; one tenth for a Kestrel Premium Certified or Kestrel Factory
      Certified vehicle on the purchase order, one twentieth for a Kestrel Certified or Kestrel Certified Plus
      vehicle, and nothing for other programs; and one twentieth when the order's latest document was received
      within half of the customer document due days counted from the opening date, one fiftieth when it was
      received later but within the due days, and nothing otherwise. The reimbursed share and the three additions
      are added together first and that sum is capped at one; the reimbursement is then the reimbursable penalty
      multiplied by the capped sum and rounded half up to the cent only at the end.
    prerequisite:
      - problem: title_ext_late_penalty_payment
        kind: value_input
        gate: penalty_paid
        form: state
        policy_source: >-
          The late-penalty reimbursement is not fixed until the late-registration penalty named on the order's most
          recent fee-shortage return stands collected on the order as its own fee entry.
        condition: >-
          The order's title ledger carries a collected entry that is not a schedule fee, dated on or after the
          order's most recent fee-shortage return.
        resolved_by: pay_title_late_penalty_3594d5af
        effect: >-
          The penalty collected after the fee-shortage return becomes the penalty paid that the reimbursement rests
          on; before it stands collected the penalty paid is zero.
      - problem: title_ext_resubmission_remittance
        kind: value_input
        gate: remitted_since
        form: state
        policy_source: >-
          The late-penalty reimbursement is booked only after the order's ledger shows a remittance to the state
          dated on or after its most recent fee-shortage return.
        condition: >-
          The order's title ledger carries a remittance to the state dated on or after the order's most recent
          fee-shortage return, and the order is submitted again.
        resolved_by: resubmit_title_packet_8a13d7a9
        effect: >-
          The remittance made with the returned packet caps the reimbursable penalty instead of zero, and the new
          submission date after the lien return becomes Kestrel's penalty end date.
    cross_category:
      - category: purchase
        as: branch
        reads: [variant_name, handover_date]
        note: The handover date tells whether the first submission came after a handover the buyer delayed, and the vehicle program sets the program addition.
      - category: delivery
        as: branch
        reads: [last_miss_cause, original_scheduled_date]
        note: A handover appointment the buyer missed, and its first scheduled date, give the buyer's handover delay days.
    compute:
      - shortage_return_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='fee_shortage')"
      - penalty_entries: "COUNT('title_transactions', event_type='title_state_fee_collected', fee_type='not_applicable')"
      - penalty_entry_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_state_fee_collected', fee_type='not_applicable')"
      - penalty_entry_amount: "LATEST('title_transactions','amount', date_field='txn_date', event_type='title_state_fee_collected', fee_type='not_applicable')"
      - penalty_paid: "penalty_entry_amount if (penalty_entries > 0 and penalty_entry_date >= shortage_return_date) else 0"
      - latest_remit_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_state_fee_remitted')"
      - latest_remit_amount: "LATEST('title_transactions','amount', date_field='txn_date', event_type='title_state_fee_remitted')"
      - remitted_since: "latest_remit_amount if latest_remit_date >= shortage_return_date else 0"
      - reimbursable_penalty: "MN(penalty_paid, remitted_since)"
      - first_submission_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_state_fee_remitted', fee_type='title_fee')"
      - latest_return_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded')"
      - lien_returns: "COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='lien_information_error')"
      - lien_return_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='lien_information_error')"
      - document_returns: "COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='missing_signature') + COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='insurance_not_verified') + COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='emissions_not_on_file') + COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='odometer_discrepancy')"
      - latest_doc_date: "LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_document_received')"
      - kestrel_end_date: "F('submitted_date') if (lien_returns > 0 and F('submitted_date') > lien_return_date) else (latest_doc_date if (document_returns > 0 and lien_returns == 0 and F('submitted_date') > latest_return_date) else first_submission_date)"
      - deadline_days: "K('dealer_deadline_days_' + F('registration_state'))"
      - penalty_total_days: "MX(0, DAYS(F('opened_date'), kestrel_end_date) - deadline_days)"
      - handover_date: "CFIELD('purchase','handover_date', purchase_order_id=F('purchase_order_id'))"
      - miss_cause: "CFIELD('delivery','last_miss_cause', purchase_order_id=F('purchase_order_id'))"
      - first_slot_date: "CFIELD('delivery','original_scheduled_date', purchase_order_id=F('purchase_order_id'))"
      - buyer_handover_delay_days: "MX(0, DAYS(first_slot_date, handover_date)) if miss_cause == 'customer_unavailable' else 0"
      - document_return_date: "max((LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='missing_signature') if COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='missing_signature') > 0 else '0000-00-00'), (LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='insurance_not_verified') if COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='insurance_not_verified') > 0 else '0000-00-00'), (LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='emissions_not_on_file') if COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='emissions_not_on_file') > 0 else '0000-00-00'), (LATEST('title_transactions','txn_date', date_field='txn_date', event_type='title_dmv_rejection_recorded', reject_code='odometer_discrepancy') if COUNT('title_transactions', event_type='title_dmv_rejection_recorded', reject_code='odometer_discrepancy') > 0 else '0000-00-00'))"
      - buyer_correction_days: "DAYS(document_return_date, latest_doc_date) if (document_returns > 0 and latest_doc_date > document_return_date) else 0"
      - reimbursed_share: "MX(0, penalty_total_days - buyer_handover_delay_days) / penalty_total_days if (miss_cause == 'customer_unavailable' and first_submission_date > handover_date and penalty_total_days > 0) else (MX(0, penalty_total_days - buyer_correction_days) / penalty_total_days if ((not (miss_cause == 'customer_unavailable' and first_submission_date > handover_date)) and document_returns > 0 and penalty_total_days > 0) else 1)"
      - wait_since_first_submission: "DAYS(first_submission_date, NOW)"
      - long_wait_addition: "K('long_wait_over_45') if wait_since_first_submission > 45 else (K('long_wait_21_to_45') if wait_since_first_submission >= 21 else 0)"
      - vehicle_program: "CFIELD('purchase','variant_name', purchase_order_id=F('purchase_order_id'))"
      - program_addition: "K('program_top') if (vehicle_program == 'Kestrel Premium Certified' or vehicle_program == 'Kestrel Factory Certified') else (K('program_certified') if (vehicle_program == 'Kestrel Certified' or vehicle_program == 'Kestrel Certified Plus') else 0)"
      - document_return_days: "DAYS(F('opened_date'), latest_doc_date)"
      - prompt_documents_addition: "K('prompt_half_due') if document_return_days <= P('customer_document_due_days') / 2 else (K('prompt_within_due') if document_return_days <= P('customer_document_due_days') else 0)"
      - result: "RND(reimbursable_penalty * MN(1, reimbursed_share + long_wait_addition + program_addition + prompt_documents_addition), 2)"
    compute_basis:
      shortage_return_date: "the order's most recent fee-shortage return"
      penalty_entries: "The reimbursable penalty is the penalty collected on the order on or after the order's most recent fee-shortage return"
      penalty_entry_date: "The reimbursable penalty is the penalty collected on the order on or after the order's most recent fee-shortage return"
      penalty_entry_amount: "The reimbursable penalty is the penalty collected on the order on or after the order's most recent fee-shortage return"
      penalty_paid: "The reimbursable penalty is the penalty collected on the order on or after the order's most recent fee-shortage return"
      latest_remit_date: "but no more than the remittance made to the state on or after that return"
      latest_remit_amount: "but no more than the remittance made to the state on or after that return"
      remitted_since: "but no more than the remittance made to the state on or after that return"
      reimbursable_penalty: "The reimbursable penalty is the penalty collected on the order on or after the order's most recent fee-shortage return, but no more than the remittance made to the state on or after that return"
      first_submission_date: "The order's first submission date is the date its title fee was remitted to the state."
      latest_return_date: "the order was submitted again after its most recent return"
      lien_returns: "when the state returned the order for a lien information error and the order was submitted again after that return"
      lien_return_date: "when the state returned the order for a lien information error and the order was submitted again after that return"
      document_returns: "when the state returned the order for a document from the customer"
      latest_doc_date: "it is the date of the order's latest document"
      kestrel_end_date: "Kestrel's penalty end date is the order's most recent submission date when the state returned the order for a lien information error and the order was submitted again after that return; it is the date of the order's latest document when the state returned the order for a document from the customer, no lien information error return stands, and the order was submitted again after its most recent return; otherwise it is the order's first submission date."
      deadline_days: "less the registration state's dealer deadline days"
      penalty_total_days: "The penalty's total days late are the calendar days from the order's opening date to Kestrel's penalty end date, less the registration state's dealer deadline days, never below zero"
      handover_date: "the order's first submission came after the handover"
      miss_cause: "when the buyer missed the first scheduled handover"
      first_slot_date: "the calendar days from the first scheduled handover date to the actual handover date"
      buyer_handover_delay_days: "The buyer's handover delay days are the calendar days from the first scheduled handover date to the actual handover date when the buyer missed the first scheduled handover"
      document_return_date: "the order's most recent return that needed a corrected document from the customer"
      buyer_correction_days: "the buyer's correction days are the calendar days from the order's most recent return that needed a corrected document from the customer to the date the order's latest document was received, when that document arrived after the return."
      reimbursed_share: "When the buyer missed the first scheduled handover and the order's first submission came after the handover, the reimbursed share is the penalty's total days late less the buyer's handover delay days, never below zero, divided by the penalty's total days late; when the buyer did not miss a handover in that way and the state returned the order for a document from the customer, the reimbursed share is the penalty's total days late less the buyer's correction days, never below zero, divided by the penalty's total days late; otherwise the reimbursed share is the whole reimbursable penalty, a share of one."
      wait_since_first_submission: "when more than forty-five calendar days have passed from the first submission date to the day of reimbursement"
      long_wait_addition: "one tenth when more than forty-five calendar days have passed from the first submission date to the day of reimbursement, one twentieth when twenty-one to forty-five days have, and nothing otherwise"
      vehicle_program: "for a Kestrel Premium Certified or Kestrel Factory Certified vehicle on the purchase order"
      program_addition: "one tenth for a Kestrel Premium Certified or Kestrel Factory Certified vehicle on the purchase order, one twentieth for a Kestrel Certified or Kestrel Certified Plus vehicle, and nothing for other programs"
      document_return_days: "when the order's latest document was received within half of the customer document due days counted from the opening date"
      prompt_documents_addition: "one twentieth when the order's latest document was received within half of the customer document due days counted from the opening date, one fiftieth when it was received later but within the due days, and nothing otherwise"
      result: "The reimbursed share and the three additions are added together first and that sum is capped at one; the reimbursement is then the reimbursable penalty multiplied by the capped sum and rounded half up to the cent only at the end."
    factors:
      - id: reimbursed_share_allocation
        effect: method
        decides: reimbursed_share
        bindings: [handover_date, miss_cause, first_slot_date, buyer_handover_delay_days, document_return_date, buyer_correction_days, reimbursed_share]
        ladder:
          - when: "the buyer missed the first scheduled handover and the first submission came after the handover"
            method: "the reimbursed share is the total days late less the buyer's handover delay days, divided by the total days late"
          - when: "no such buyer-missed handover, and the state returned the order for a document from the customer"
            method: "the reimbursed share is the total days late less the buyer's correction days, divided by the total days late"
          - when: "otherwise"
            method: "the reimbursed share is one, the whole reimbursable penalty"
        baseline:
          reimbursed_share: "1"
        evidence: [cross_category, history, date]
        cross_difficulty: purchase
      - id: kestrel_penalty_end_rule
        effect: method
        decides: kestrel_end_date
        bindings: [lien_returns, lien_return_date, document_returns, latest_doc_date, kestrel_end_date, penalty_total_days]
        ladder:
          - when: "the state returned the order for a lien information error and it was submitted again after that return"
            method: "Kestrel's penalty days run to the most recent submission date"
          - when: "the state returned the order for a customer document, no lien error return stands, and it was submitted again after its most recent return"
            method: "Kestrel's penalty days run to the date of the latest document"
          - when: "otherwise"
            method: "Kestrel's penalty days run to the first submission date"
        baseline:
          kestrel_end_date: "first_submission_date"
        evidence: [history, date]
        cross_difficulty: null
      - id: long_wait_addition
        effect: parameter
        decides: long_wait_addition
        bindings: [wait_since_first_submission, long_wait_addition]
        ladder:
          - when: "more than forty-five calendar days have passed since the first submission"
            value: "K('long_wait_over_45')"
          - when: "twenty-one to forty-five days have passed since the first submission"
            value: "K('long_wait_21_to_45')"
          - when: "otherwise"
            value: "0"
        baseline:
          long_wait_addition: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: program_addition
        effect: parameter
        decides: program_addition
        bindings: [vehicle_program, program_addition]
        ladder:
          - when: "the purchase order's program is Kestrel Premium Certified or Kestrel Factory Certified"
            value: "K('program_top')"
          - when: "the purchase order's program is Kestrel Certified or Kestrel Certified Plus"
            value: "K('program_certified')"
          - when: "otherwise"
            value: "0"
        baseline:
          program_addition: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: prompt_documents_addition
        effect: parameter
        decides: prompt_documents_addition
        bindings: [document_return_days, prompt_documents_addition]
        ladder:
          - when: "the latest document was received within half of the customer document due days"
            value: "K('prompt_half_due')"
          - when: "the latest document was received later but within the due days"
            value: "K('prompt_within_due')"
          - when: "otherwise"
            value: "0"
        baseline:
          prompt_documents_addition: "0"
        evidence: [date, history]
        cross_difficulty: null
    baseline:
      rule: >-
        The reimbursable penalty is the penalty collected on the order on or after the order's most recent
        fee-shortage return, but no more than the remittance made to the state on or after that return, and the
        standard reimbursement is that reimbursable penalty rounded half up to the cent.
      params: []
    inputs:
      history:
        - {table: title_transactions, aggregate: latest, field: amount, filters: {event_type: title_state_fee_collected, fee_type: not_applicable}}
        - {table: title_transactions, aggregate: latest, field: amount, filters: {event_type: title_state_fee_remitted}}
        - {table: title_transactions, aggregate: latest, field: txn_date, filters: {event_type: title_state_fee_remitted, fee_type: title_fee}}
        - {table: title_transactions, aggregate: count, field: title_txn_id, filters: {event_type: title_dmv_rejection_recorded}}
        - {table: title_transactions, aggregate: latest, field: txn_date, filters: {event_type: title_document_received}}
      cross_category: [purchase, delivery]
