# Product charter: Trade-In Agreements (Kestrel Auto). Generated by erl-scenario-blueprint.
# One holding = one written offer on one customer vehicle, from offer through pickup inspection, lien
# payoff, equity distribution and title receipt.

category: tradein
display_name: Trade-In Agreements

binding:
  holding_table: tradein_agreements
  event_tables: [tradein_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {equity_balance: trade_equity}

lifecycle:
  states: [offered, accepted, picked_up, settled, declined, expired, cancelled]
  transitions:
    - {from: offered, to: accepted, by: user, means: "The customer accepts the written offer and supplies lien details where there is a loan or lease."}
    - {from: offered, to: declined, by: user, means: "The customer declines the offer."}
    - {from: offered, to: expired, by: system, means: "The offer validity period ends without acceptance."}
    - {from: accepted, to: picked_up, by: system, means: "Kestrel completes the pickup inspection and takes the vehicle, keys and paperwork."}
    - {from: accepted, to: cancelled, by: agent, means: "The accepted agreement ends before pickup (customer withdraws, declines an adjusted offer at pickup, misses the pickup window, or the linked purchase is cancelled)."}
    - {from: picked_up, to: settled, by: agent, means: "The lien is paid, the equity is fully distributed and a transferable title is in hand."}

accounts:
  - key: trade_equity
    unit: USD
    meaning: "Trade equity not yet distributed: value credited at pickup and shortfall covered by the customer, less deductions, the lien payoff, equity applied to a purchase and equity paid out; negative means the customer still owes a shortfall."

parameter_schema:
  grade_value_factor_pct: Offer as a percentage of the Good-condition valuation of the same vehicle; a regraded offer is the current offer times the new grade's factor divided by the current grade's factor, percent
  offer_rounding_increment_usd: Increment offers and regraded offers are rounded down to, USD
  offer_validity_days: Calendar days after the offer date during which the offer can be accepted (offer date = day 0), integer days
  offer_mileage_tolerance_miles: Miles the inspected odometer may exceed the stated mileage before the mileage deduction applies, integer miles
  offer_refresh_allowed: Whether a lapsed or declined offer can be replaced by a new offer on request, boolean
  acceptance_requires_lien_details: Whether acceptance requires the lienholder name and loan account number when the vehicle is financed or leased, boolean
  lease_payoff_allowed: Whether a leased vehicle may be traded with its lease payoff treated as the lien, boolean
  pickup_window_days_after_acceptance: Calendar days after the acceptance date within which the vehicle must be picked up or dropped off (acceptance date = day 0), integer days
  hub_dropoff_allowed: Whether the customer may drop the vehicle at a Kestrel hub instead of a pickup, boolean
  towing_fee_usd: Towing fee deducted when the vehicle must be collected by tow truck, USD
  mileage_overage_deduction_per_mile: Deduction per mile above the stated mileage, applied to every mile above it once the overage exceeds the mileage tolerance, USD per mile
  missing_key_deduction_usd: Deduction per key or fob declared at offer and not handed over at pickup, USD
  warning_light_deduction_usd: Deduction when a dashboard warning light not disclosed at offer is lit at inspection, USD
  smoke_odor_deduction_usd: Deduction when smoke or pet odor not disclosed at offer is found at inspection, USD
  aftermarket_modification_deduction_usd: Deduction for undisclosed aftermarket modifications (lift, tint below legal limit, exhaust, wheels), USD
  min_tire_tread_32nds: Minimum tread depth expected on every tire at this grade, 32nds of an inch
  tire_replacement_deduction_per_tire_usd: Deduction per tire below the grade's minimum tread, USD
  undisclosed_damage_regrade_threshold_usd: Repair estimate of undisclosed damage above which the offer is regraded one grade down instead of deducted (0 = always deducted), USD
  max_regrades_per_offer: Maximum regrades applied to one accepted offer at inspection, integer count
  reacceptance_threshold_usd: Total of deductions and regrade reduction at inspection above which the customer must re-accept the adjusted offer before pickup completes, USD
  decline_at_pickup_allowed: Whether the customer may decline an adjusted offer at pickup and keep the vehicle, boolean
  registration_current_required: Whether the vehicle's registration must be current at pickup, boolean
  all_titled_owners_present_required: Whether every owner on the title must sign at pickup, boolean
  odometer_disclosure_model_years: Vehicles younger than this many model years require a signed federal odometer disclosure at pickup, integer years
  payoff_quote_max_age_days: Maximum calendar days between the payoff quote date and the payoff send date, integer days
  payoff_send_business_days: Business days after pickup within which Kestrel sends the lien payoff, integer business days
  kestrel_absorbs_late_per_diem: Whether per-diem interest for days Kestrel sends the payoff after its own payoff send deadline is borne by Kestrel instead of deducted from equity, boolean
  payoff_requires_negative_equity_cleared: Whether the payoff is sent only after any negative equity has been covered, boolean
  lien_payoff_channels: Channels Kestrel uses to pay a lienholder, list
  negative_equity_payment_days: Calendar days after pickup within which a customer-paid negative equity shortfall must be received, integer days
  negative_equity_payment_channels: Channels accepted for a customer-paid shortfall, list
  negative_equity_roll_in_allowed: Whether negative equity may be rolled into a Kestrel Auto Finance contract on the linked purchase, boolean
  equity_apply_business_days: Business days after the payoff is sent (or after pickup when there is no lien) within which positive equity is applied to the linked purchase order, integer business days
  positive_equity_payout_business_days: Business days after the equity becomes payable within which equity owed to the customer is paid out, integer business days
  positive_equity_payout_channels: Channels used to pay equity to the customer, list of settlement_method values
  payout_hold_until_title_received: Whether equity owed to the customer is paid out only after a transferable title or lien release is in hand, boolean
  title_due_at_pickup_unliened: Whether a vehicle with no lien must have its signed paper title handed over at pickup, boolean
  lien_release_wait_days: Calendar days after the payoff is sent that Kestrel waits for the lienholder's release before asking the customer for a lien release letter, integer days
  title_delay_chargeback_days: Calendar days after pickup after which, with still no transferable title, the trade value may be charged back, integer days
  title_delay_chargeback_pct: Percentage of the credited trade value charged back when the title delay deadline passes, percent
  accepted_title_documents: Title documents that complete the title requirement, list of document_type values
  outright_sale_allowed: Whether Kestrel buys the vehicle without a linked purchase, boolean
  max_trade_ins_per_purchase: Maximum trade-in agreements that can be linked to one purchase order, integer count
  trade_link_cutoff: Latest purchase order status in which a trade-in can be linked to the order, purchase status value
  cancel_on_purchase_cancellation: Whether an accepted trade linked to a purchase that is cancelled before pickup is cancelled with it, boolean
  return_keeps_trade: Whether Kestrel keeps a traded vehicle when the linked purchase is returned under the 7-day return (the equity is refunded as cash), boolean
  chargeback_payment_days: Calendar days after a title-delay chargeback within which the customer must pay the resulting shortfall, integer days
  payoff_quote_verification_required: Whether a payoff quote is used only after Kestrel has confirmed it directly with the lienholder, boolean

