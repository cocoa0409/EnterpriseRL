events:
  - type: tradein_offer_created
    target: tradein_agreements
    mutation: create
    meaning: "Kestrel issues a written offer on a customer vehicle from the customer's condition answers."
    grain: "one row per written offer"
    fields:
      customer_id: "vehicle owner"
      variant_name: "condition grade of the offer"
      trade_vin: "VIN of the vehicle"
      trade_vehicle_description: "year, make, model and trim"
      offer_amount: "written offer"
      original_offer_amount: "same as offer_amount at issue"
      offer_date: "date the offer was issued"
      offer_expires_date: "offer_date plus the offer validity days"
      stated_mileage: "mileage the customer stated"
      keys_promised: "keys and fobs declared"
    triggers: []
  - type: tradein_offer_accepted
    target: tradein_agreements
    mutation: {transition: {from: offered, to: accepted}}
    meaning: "The customer accepts the offer, optionally linking it to a Kestrel purchase order."
    grain: "one row per acceptance"
    fields:
      status: "offered -> accepted"
      accepted_date: "date of acceptance"
      purchase_order_id: "purchase order the trade is linked to; empty for an outright sale"
      lienholder_name: "lienholder or lessor; empty when there is none"
      loan_account_number: "account number with the lienholder; empty when there is none"
    triggers: []
  - type: tradein_offer_declined
    target: tradein_agreements
    mutation: {transition: {from: offered, to: declined}}
    meaning: "The customer declines the offer."
    grain: "one row per declined offer"
    fields:
      status: "offered -> declined"
      closed_date: "date of decline"
    triggers: []
  - type: tradein_offer_expired
    target: tradein_agreements
    mutation: {transition: {from: offered, to: expired}}
    meaning: "The offer lapses unaccepted."
    grain: "one row per lapsed offer"
    fields:
      status: "offered -> expired"
      closed_date: "the day after the offer expiration date"
    triggers: []
  - type: tradein_offer_regraded
    target: tradein_agreements
    mutation: update
    meaning: "The pickup inspection finds the vehicle in a lower condition grade and the offer is reissued at that grade."
    grain: "one row per regrade"
    fields:
      variant_name: "new condition grade"
      offer_amount: "regraded offer"
      offer_date: "date of the regrade"
    triggers: []
  - type: tradein_vehicle_picked_up
    target: tradein_agreements
    mutation: {transition: {from: accepted, to: picked_up}}
    meaning: "Kestrel takes the vehicle after the pickup inspection."
    grain: "one row per pickup"
    fields:
      status: "accepted -> picked_up"
      pickup_date: "date of pickup or hub drop-off"
      inspected_mileage: "odometer at inspection"
    triggers:
      - event: tradein:tradein_value_credited
        map: {}
  - type: tradein_agreement_cancelled
    target: tradein_agreements
    mutation: {transition: {from: accepted, to: cancelled}}
    meaning: "An accepted agreement ends before pickup."
    grain: "one row per cancellation"
    fields:
      status: "accepted -> cancelled"
      closed_date: "date of cancellation"
    triggers: []
  - type: tradein_title_recorded
    target: tradein_agreements
    mutation: update
    meaning: "Kestrel records that it holds a transferable title for the vehicle."
    grain: "one row per agreement"
    fields:
      title_received_date: "date the completing title document was received"
    triggers: []
  - type: tradein_settled
    target: tradein_agreements
    mutation: {transition: {from: picked_up, to: settled}}
    meaning: "The agreement is fully settled."
    grain: "one row per settled agreement"
    fields:
      status: "picked_up -> settled"
      closed_date: "date of settlement"
    triggers: []

  - type: tradein_value_credited
    target: tradein_transactions
    meaning: "The offer amount in force at pickup is credited as trade value."
    grain: "one row per agreement (credited once at pickup)"
    distinguish_by: [txn_date]
    fields:
      txn_date: "pickup date"
      amount: "offer amount in force at pickup"
    account: trade_equity
    direction: in
    triggers: []
  - type: tradein_value_deducted
    target: tradein_transactions
    meaning: "A deduction is taken from the trade value."
    grain: "one row per deduction reason per agreement per date"
    distinguish_by: [adjustment_type, txn_date]
    fields:
      txn_date: "date of the deduction"
      amount: "deduction amount"
      adjustment_type: "reason for the deduction"
    account: trade_equity
    direction: out
    triggers: []
  - type: tradein_payoff_quote_recorded
    target: tradein_transactions
    meaning: "A lienholder payoff quote, confirmed with the lienholder, is recorded."
    grain: "one row per quote"
    distinguish_by: [quote_reference, txn_date]
    fields:
      txn_date: "date of the quote"
      amount: "payoff amount good through the good-through date"
      payoff_good_through_date: "last date the quote amount is valid"
      per_diem_amount: "daily interest after the good-through date"
      quote_reference: "lienholder's quote reference"
    triggers: []
  - type: tradein_lien_payoff_sent
    target: tradein_transactions
    meaning: "Kestrel sends the payoff to the lienholder."
    grain: "one row per agreement (one payoff per lien)"
    distinguish_by: [source_txn_id]
    fields:
      txn_date: "date the payoff was sent"
      amount: "payoff amount sent, charged against the trade equity"
      source_txn_id: "the payoff quote relied on"
    account: trade_equity
    direction: out
    triggers: []
  - type: tradein_negative_equity_settled
    target: tradein_transactions
    meaning: "A shortfall between the lien payoff and the trade value is covered."
    grain: "one row per covering payment or roll-in"
    distinguish_by: [settlement_method, txn_date]
    fields:
      txn_date: "date covered"
      amount: "shortfall covered"
      settlement_method: "rolled_into_financing or customer_payment"
      linked_reference_id: "the purchase order whose finance contract absorbed it; empty for a customer payment"
    account: trade_equity
    direction: in
    triggers: []
  - type: tradein_equity_applied
    target: tradein_transactions
    meaning: "Positive equity is applied to the linked purchase order."
    grain: "one row per application"
    distinguish_by: [linked_reference_id, txn_date]
    fields:
      txn_date: "date applied"
      amount: "equity applied"
      linked_reference_id: "the purchase order credited"
    account: trade_equity
    direction: out
    triggers:
      - event: purchase:purchase_payment_posted
        map: {payment_source: trade_equity_credit, payment_channel: internal_transfer, amount: amount, txn_date: txn_date, linked_reference_id: trade_in_id}
  - type: tradein_equity_paid_out
    target: tradein_transactions
    meaning: "Positive equity is paid to the customer."
    grain: "one row per payout"
    distinguish_by: [settlement_method, txn_date]
    fields:
      txn_date: "date paid"
      amount: "equity paid"
      settlement_method: "ach_to_customer or check_to_customer"
    account: trade_equity
    direction: out
    triggers: []
  - type: tradein_title_document_received
    target: tradein_transactions
    meaning: "A title document for the vehicle is received."
    grain: "one row per document received"
    distinguish_by: [document_type, txn_date]
    fields:
      txn_date: "date received"
      amount: "0.00"
      document_type: "document received"
    triggers:
      - event: tradein:tradein_title_recorded
        map: {}

measures:
  - id: tradein_msr_open_trades_on_purchase
    window: "current state at the moment of the request"
    measure: "count of tradein_agreements linked to the purchase order whose status is accepted, picked_up or settled"
  - id: tradein_msr_inspection_reduction
    window: "the pickup inspection of the agreement"
    measure: "sum of amount over tradein_value_deducted entries dated the pickup date, plus original_offer_amount minus offer_amount (the reduction made by a regrade at that inspection)"

policies:
  - id: tradein_agg_multi_holding
    subject: [tradein_offer_created]
    rule: >-
      A customer may hold trade-in agreements on any number of vehicles. One vehicle (one trade VIN) may have only
      one agreement that is offered, accepted or picked up at a time; a new offer on the same VIN replaces nothing
      and is issued only when the earlier agreement has reached declined, expired, cancelled or settled.
    eligibility:
      - id: one_open_per_vin
        applies_to: [tradein_offer_created]
        kind: dedup
        condition: "One vehicle (one trade VIN) may have only one agreement that is offered, accepted or picked up at a time; a new offer on the same VIN replaces nothing and is issued only when the earlier agreement has reached declined, expired, cancelled or settled."
        evidence_fields: [tradein_agreements.trade_vin, tradein_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_vin]
          action_bindings:
            tradein_agreements.trade_vin: trade_vin
        dedup_contract:
          table: tradein_agreements
          mode: separate_record
          object_bindings: {trade_vin: trade_vin}
          duplicate_filters: {status: [offered, accepted, picked_up]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: tradein_agg_purchase_link
    subject: [tradein_offer_accepted]
    rule: >-
      An accepted offer may be linked to one of the customer's own Kestrel purchase orders or left unlinked as an
      outright sale when outright sales are allowed. A trade is linked only to a purchase order of the same
      customer whose status is reserved or contracted (the trade link cutoff), and a purchase order may carry no
      more than the maximum trade-ins per purchase, counted by tradein_msr_open_trades_on_purchase. Equity from
      all trades linked to one purchase order is combined on that order as separate trade equity payments, one
      per trade. Holding X changes Y: when the linked purchase order is paid through Kestrel Auto Finance, the
      trade's negative equity may be rolled into that finance contract under tradein_negative_equity; an unlinked
      trade or a trade linked to a cash or outside-lender purchase can only be covered by customer payment.
    eligibility:
      - id: link_target
        applies_to: [tradein_offer_accepted]
        kind: authorization
        condition: "A trade is linked only to a purchase order of the same customer whose status is reserved or contracted (the trade link cutoff), and a purchase order may carry no more than the maximum trade-ins per purchase, counted by tradein_msr_open_trades_on_purchase."
        evidence_fields: [purchase_orders.status, purchase_orders.customer_id, purchase_orders.purchase_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_orders.purchase_order_id]
          action_bindings:
            purchase_orders.purchase_order_id: purchase_order_id
    params:
      per_tier:
        Inoperable Condition Offer: {max_trade_ins_per_purchase: "=max_trade_ins_per_purchase", outright_sale_allowed: "=outright_sale_allowed"}
        Rough Condition Offer: {max_trade_ins_per_purchase: "=max_trade_ins_per_purchase", outright_sale_allowed: "=outright_sale_allowed"}
        Fair Condition Offer: {max_trade_ins_per_purchase: "=max_trade_ins_per_purchase", outright_sale_allowed: "=outright_sale_allowed"}
        Good Condition Offer: {max_trade_ins_per_purchase: "=max_trade_ins_per_purchase", outright_sale_allowed: "=outright_sale_allowed"}
        Very Good Condition Offer: {max_trade_ins_per_purchase: "=max_trade_ins_per_purchase", outright_sale_allowed: "=outright_sale_allowed"}
        Excellent Condition Offer: {max_trade_ins_per_purchase: "=max_trade_ins_per_purchase", outright_sale_allowed: "=outright_sale_allowed"}
    measures: [tradein_msr_open_trades_on_purchase]

  - id: tradein_offer_acceptance
    subject: [tradein_offer_accepted, tradein_offer_declined, tradein_offer_expired, tradein_offer_created]
    rule: >-
      An offer states one amount for one vehicle at one condition grade, rounded down to the grade's rounding
      increment. The offer is accepted no later than the last day of its validity counted from the offer date.
      Validity is counted in calendar days with the offer date as day 0, so the offer can be accepted through the
      end of the day that is the offer validity days after the offer date, which is the offer expiration date
      recorded on the agreement. A vehicle with a loan or lease is accepted only with the lienholder name and loan
      account number, and a leased vehicle only when lease payoffs are allowed; the lessor's dealer payoff is then
      treated as the lien. An offer that is not accepted by its expiration date lapses; when refresh is allowed
      the customer may request a new offer, which is a new agreement with its own amount, grade and dates, never a
      revival of the old one. A declined offer can likewise only be replaced by a new offer. The customer's
      stated mileage and declared keys are the basis the pickup inspection is measured against.
    eligibility:
      - id: within_validity
        applies_to: [tradein_offer_accepted]
        kind: time
        condition: "The offer is accepted no later than the last day of its validity counted from the offer date."
        evidence_fields: [tradein_agreements.offer_date, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the offer date"
          anchor_source: tradein_agreements.offer_date
          relation: not_after
          duration_source: variants.offer_validity_days
          unit: calendar_days
          counting_rule: "Validity is counted in calendar days with the offer date as day 0, so the offer can be accepted through the end of the day that is the offer validity days after the offer date, which is the offer expiration date recorded on the agreement."
          boundary: inclusive
      - id: lien_details
        applies_to: [tradein_offer_accepted]
        kind: caller_fact
        condition: "A vehicle with a loan or lease is accepted only with the lienholder name and loan account number, and a leased vehicle only when lease payoffs are allowed; the lessor's dealer payoff is then treated as the lien."
        evidence_fields: [tradein_agreements.lienholder_name, tradein_agreements.loan_account_number, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
    params:
      per_tier:
        Inoperable Condition Offer: {offer_validity_days: "=offer_validity_days", grade_value_factor_pct: "=grade_value_factor_pct"}
        Rough Condition Offer: {offer_validity_days: "=offer_validity_days", grade_value_factor_pct: "=grade_value_factor_pct"}
        Fair Condition Offer: {offer_validity_days: "=offer_validity_days", grade_value_factor_pct: "=grade_value_factor_pct"}
        Good Condition Offer: {offer_validity_days: "=offer_validity_days", grade_value_factor_pct: "=grade_value_factor_pct"}
        Very Good Condition Offer: {offer_validity_days: "=offer_validity_days", grade_value_factor_pct: "=grade_value_factor_pct"}
        Excellent Condition Offer: {offer_validity_days: "=offer_validity_days", grade_value_factor_pct: "=grade_value_factor_pct"}

  - id: tradein_pickup_inspection
    subject: [tradein_vehicle_picked_up, tradein_offer_regraded, tradein_value_credited, tradein_value_deducted]
    rule: >-
      The vehicle is picked up (or dropped at a hub when the grade allows it) after an inspection against what the
      customer stated. The pickup is completed no later than the last day of the pickup window counted from the
      acceptance date. The pickup window is counted in calendar days with the acceptance date as day 0 and ends at
      the end of the last day of the grade's pickup window; an accepted agreement still not picked up after that
      day is cancelled and a new offer is needed. At pickup the registration must be current when the grade
      requires it, every titled owner signs when required, and a federal odometer disclosure is signed for
      vehicles younger than the odometer disclosure model years. Inspection findings are handled in this order.
      First, undisclosed damage whose repair estimate exceeds the grade's regrade threshold regrades the offer one
      grade down, once at most per offer: the regraded offer is the current offer times the lower grade's value
      factor divided by the current grade's value factor, rounded down to the rounding increment; undisclosed
      damage at or below the threshold, or on an Inoperable offer, is deducted at its repair estimate instead.
      Then each remaining finding is deducted at the rates of the grade in force after any regrade: the mileage
      deduction when the inspected mileage exceeds the stated mileage by more than the mileage tolerance, charged
      on every mile above the stated mileage; the missing key deduction for each declared key not handed over;
      the warning light, smoke or odor, and aftermarket modification deductions when found and not disclosed; the
      tire deduction for each tire below the grade's minimum tread; and the towing fee when the vehicle is towed.
      When the inspection reduction, counted by tradein_msr_inspection_reduction, exceeds the reacceptance
      threshold of the grade in force before inspection, the customer must re-accept the adjusted offer before
      pickup completes and may instead decline and keep the vehicle, which cancels the agreement. The value
      credited at pickup is the offer amount in force at that moment, and deductions post as separate entries.
      Value is credited or deducted only on an agreement whose status is picked_up. A regrade is recorded only on
      an agreement whose status is accepted.
    eligibility:
      - id: within_pickup_window
        applies_to: [tradein_vehicle_picked_up]
        kind: time
        condition: "The pickup is completed no later than the last day of the pickup window counted from the acceptance date."
        evidence_fields: [tradein_agreements.accepted_date, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the acceptance date"
          anchor_source: tradein_agreements.accepted_date
          relation: not_after
          duration_source: variants.pickup_window_days_after_acceptance
          unit: calendar_days
          counting_rule: "The pickup window is counted in calendar days with the acceptance date as day 0 and ends at the end of the last day of the grade's pickup window; an accepted agreement still not picked up after that day is cancelled and a new offer is needed."
          boundary: inclusive
      - id: value_on_picked_up
        applies_to: [tradein_value_credited, tradein_value_deducted]
        kind: state
        condition: "Value is credited or deducted only on an agreement whose status is picked_up."
        evidence_fields: [tradein_agreements.status, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        state_contract:
          field: tradein_agreements.status
          allowed: [picked_up]
      - id: regrade_on_accepted
        applies_to: [tradein_offer_regraded]
        kind: state
        condition: "A regrade is recorded only on an agreement whose status is accepted."
        evidence_fields: [tradein_agreements.status, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        state_contract:
          field: tradein_agreements.status
          allowed: [accepted]
    params:
      per_tier:
        Inoperable Condition Offer: {mileage_overage_deduction_per_mile: "=mileage_overage_deduction_per_mile", missing_key_deduction_usd: "=missing_key_deduction_usd", undisclosed_damage_regrade_threshold_usd: "=undisclosed_damage_regrade_threshold_usd", reacceptance_threshold_usd: "=reacceptance_threshold_usd", pickup_window_days_after_acceptance: "=pickup_window_days_after_acceptance"}
        Rough Condition Offer: {mileage_overage_deduction_per_mile: "=mileage_overage_deduction_per_mile", missing_key_deduction_usd: "=missing_key_deduction_usd", undisclosed_damage_regrade_threshold_usd: "=undisclosed_damage_regrade_threshold_usd", reacceptance_threshold_usd: "=reacceptance_threshold_usd", pickup_window_days_after_acceptance: "=pickup_window_days_after_acceptance"}
        Fair Condition Offer: {mileage_overage_deduction_per_mile: "=mileage_overage_deduction_per_mile", missing_key_deduction_usd: "=missing_key_deduction_usd", undisclosed_damage_regrade_threshold_usd: "=undisclosed_damage_regrade_threshold_usd", reacceptance_threshold_usd: "=reacceptance_threshold_usd", pickup_window_days_after_acceptance: "=pickup_window_days_after_acceptance"}
        Good Condition Offer: {mileage_overage_deduction_per_mile: "=mileage_overage_deduction_per_mile", missing_key_deduction_usd: "=missing_key_deduction_usd", undisclosed_damage_regrade_threshold_usd: "=undisclosed_damage_regrade_threshold_usd", reacceptance_threshold_usd: "=reacceptance_threshold_usd", pickup_window_days_after_acceptance: "=pickup_window_days_after_acceptance"}
        Very Good Condition Offer: {mileage_overage_deduction_per_mile: "=mileage_overage_deduction_per_mile", missing_key_deduction_usd: "=missing_key_deduction_usd", undisclosed_damage_regrade_threshold_usd: "=undisclosed_damage_regrade_threshold_usd", reacceptance_threshold_usd: "=reacceptance_threshold_usd", pickup_window_days_after_acceptance: "=pickup_window_days_after_acceptance"}
        Excellent Condition Offer: {mileage_overage_deduction_per_mile: "=mileage_overage_deduction_per_mile", missing_key_deduction_usd: "=missing_key_deduction_usd", undisclosed_damage_regrade_threshold_usd: "=undisclosed_damage_regrade_threshold_usd", reacceptance_threshold_usd: "=reacceptance_threshold_usd", pickup_window_days_after_acceptance: "=pickup_window_days_after_acceptance"}
    formula:
      when: "inspected_mileage - stated_mileage > offer_mileage_tolerance_miles"
      mileage_deduction: "round((inspected_mileage - stated_mileage) * mileage_overage_deduction_per_mile, 2)"
    measures: [tradein_msr_inspection_reduction]

  - id: tradein_lien_payoff
    subject: [tradein_payoff_quote_recorded, tradein_lien_payoff_sent]
    rule: >-
      Kestrel pays off a lien or lease on the traded vehicle directly to the lienholder. A payoff quote is
      recorded only after Kestrel has confirmed it directly with the lienholder when verification is required;
      the customer's own account screenshot or statement is not a payoff quote. The payoff is sent only on an
      agreement whose status is picked_up. The payoff relies on a quote whose age, counted from the quote date,
      is no more than the payoff quote max age on the send date. Quote age is counted in calendar days from the quote date as day 0; a quote whose
      age on the send date is greater than the maximum must be replaced by a new confirmed quote before anything
      is sent. The amount sent is the quote amount when sent on or before the quote's good-through date, and
      otherwise the quote amount plus the quote's per-diem amount for each calendar day after the good-through
      date through the send date. When the payoff is sent later than the grade's payoff send business days after
      pickup and the late per-diem switch is true, the per diem for the days beyond Kestrel's own deadline is
      borne by Kestrel and is not charged against the trade equity. When negative equity must be cleared first,
      the payoff is sent only after the shortfall has been covered under tradein_negative_equity. Each agreement
      has one lien payoff; any overpayment the lienholder returns goes from the lienholder to the customer.
    eligibility:
      - id: payoff_on_picked_up
        applies_to: [tradein_lien_payoff_sent]
        kind: state
        condition: "The payoff is sent only on an agreement whose status is picked_up."
        evidence_fields: [tradein_agreements.status, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        state_contract:
          field: tradein_agreements.status
          allowed: [picked_up]
      - id: quote_age
        applies_to: [tradein_lien_payoff_sent]
        kind: time
        condition: "The payoff relies on a quote whose age, counted from the quote date, is no more than the payoff quote max age on the send date."
        evidence_fields: [tradein_transactions.txn_date, tradein_transactions.tradein_txn_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_transactions.tradein_txn_id]
          action_bindings:
            tradein_transactions.tradein_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the quote date"
          anchor_source: tradein_transactions.txn_date
          relation: not_after
          duration_source: variants.payoff_quote_max_age_days
          unit: calendar_days
          counting_rule: "Quote age is counted in calendar days from the quote date as day 0; a quote whose age on the send date is greater than the maximum must be replaced by a new confirmed quote before anything is sent."
          boundary: inclusive
      - id: one_payoff
        applies_to: [tradein_lien_payoff_sent]
        kind: dedup
        condition: "Each agreement has one lien payoff; any overpayment the lienholder returns goes from the lienholder to the customer."
        evidence_fields: [tradein_transactions.trade_in_id, tradein_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_transactions.trade_in_id]
          action_bindings:
            tradein_transactions.trade_in_id: trade_in_id
        dedup_contract:
          table: tradein_transactions
          mode: separate_record
          object_bindings: {trade_in_id: trade_in_id}
          duplicate_filters: {event_type: [tradein_lien_payoff_sent]}
          distinct_fields: []
    params:
      per_tier:
        Inoperable Condition Offer: {payoff_quote_max_age_days: "=payoff_quote_max_age_days", payoff_send_business_days: "=payoff_send_business_days", kestrel_absorbs_late_per_diem: "=kestrel_absorbs_late_per_diem"}
        Rough Condition Offer: {payoff_quote_max_age_days: "=payoff_quote_max_age_days", payoff_send_business_days: "=payoff_send_business_days", kestrel_absorbs_late_per_diem: "=kestrel_absorbs_late_per_diem"}
        Fair Condition Offer: {payoff_quote_max_age_days: "=payoff_quote_max_age_days", payoff_send_business_days: "=payoff_send_business_days", kestrel_absorbs_late_per_diem: "=kestrel_absorbs_late_per_diem"}
        Good Condition Offer: {payoff_quote_max_age_days: "=payoff_quote_max_age_days", payoff_send_business_days: "=payoff_send_business_days", kestrel_absorbs_late_per_diem: "=kestrel_absorbs_late_per_diem"}
        Very Good Condition Offer: {payoff_quote_max_age_days: "=payoff_quote_max_age_days", payoff_send_business_days: "=payoff_send_business_days", kestrel_absorbs_late_per_diem: "=kestrel_absorbs_late_per_diem"}
        Excellent Condition Offer: {payoff_quote_max_age_days: "=payoff_quote_max_age_days", payoff_send_business_days: "=payoff_send_business_days", kestrel_absorbs_late_per_diem: "=kestrel_absorbs_late_per_diem"}

  - id: tradein_negative_equity
    subject: [tradein_negative_equity_settled]
    rule: >-
      Negative equity is the amount by which the payoff due exceeds the value credited less deductions. It is
      covered either by rolling it into the Kestrel Auto Finance contract of the linked purchase, when the grade
      allows roll-in and the finance contract is signed with the shortfall included in the amount financed, or by
      the customer's own payment on one of the accepted shortfall channels within the negative equity payment
      days after pickup. Negative equity is covered only on an agreement whose status is accepted or picked_up. A
      roll-in is recorded with the linked purchase order and is limited by the finance tier's negative equity
      limit; whatever the finance contract cannot absorb must be paid by the customer. A title-delay chargeback
      that leaves the equity negative is paid by the customer within the chargeback payment days. Card payments
      are not accepted for a shortfall.
    eligibility:
      - id: shortfall_state
        applies_to: [tradein_negative_equity_settled]
        kind: state
        condition: "Negative equity is covered only on an agreement whose status is accepted or picked_up."
        evidence_fields: [tradein_agreements.status, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        state_contract:
          field: tradein_agreements.status
          allowed: [accepted, picked_up]
    params:
      per_tier:
        Inoperable Condition Offer: {negative_equity_roll_in_allowed: "=negative_equity_roll_in_allowed", negative_equity_payment_days: "=negative_equity_payment_days"}
        Rough Condition Offer: {negative_equity_roll_in_allowed: "=negative_equity_roll_in_allowed", negative_equity_payment_days: "=negative_equity_payment_days"}
        Fair Condition Offer: {negative_equity_roll_in_allowed: "=negative_equity_roll_in_allowed", negative_equity_payment_days: "=negative_equity_payment_days"}
        Good Condition Offer: {negative_equity_roll_in_allowed: "=negative_equity_roll_in_allowed", negative_equity_payment_days: "=negative_equity_payment_days"}
        Very Good Condition Offer: {negative_equity_roll_in_allowed: "=negative_equity_roll_in_allowed", negative_equity_payment_days: "=negative_equity_payment_days"}
        Excellent Condition Offer: {negative_equity_roll_in_allowed: "=negative_equity_roll_in_allowed", negative_equity_payment_days: "=negative_equity_payment_days"}

  - id: tradein_equity_distribution
    subject: [tradein_equity_applied, tradein_equity_paid_out]
    rule: >-
      Positive equity is distributed only once its amount is final: after the lien payoff has been sent, or after
      pickup when there is no lien. Equity is distributed only on an agreement whose status is picked_up. For a
      trade linked to a purchase order that is still contracted, the whole positive equity balance is applied to
      that order as a trade equity payment within the equity apply business days. For an outright sale, or when
      the linked purchase order is no longer contracted (cancelled before the equity was applied), the equity is
      paid to the customer by ACH or check within the payout business days, and only after a transferable title
      or lien release is in hand when the payout hold switch is true. Equity is never split between the purchase
      and a payout. When the linked purchase is later returned under the 7-day return, Kestrel keeps the traded
      vehicle and the purchase refunds the applied equity to the customer as cash; the trade agreement itself is
      not reopened.
    eligibility:
      - id: distribution_state
        applies_to: [tradein_equity_applied, tradein_equity_paid_out]
        kind: state
        condition: "Equity is distributed only on an agreement whose status is picked_up."
        evidence_fields: [tradein_agreements.status, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        state_contract:
          field: tradein_agreements.status
          allowed: [picked_up]
    params:
      per_tier:
        Inoperable Condition Offer: {equity_apply_business_days: "=equity_apply_business_days", positive_equity_payout_business_days: "=positive_equity_payout_business_days", payout_hold_until_title_received: "=payout_hold_until_title_received"}
        Rough Condition Offer: {equity_apply_business_days: "=equity_apply_business_days", positive_equity_payout_business_days: "=positive_equity_payout_business_days", payout_hold_until_title_received: "=payout_hold_until_title_received"}
        Fair Condition Offer: {equity_apply_business_days: "=equity_apply_business_days", positive_equity_payout_business_days: "=positive_equity_payout_business_days", payout_hold_until_title_received: "=payout_hold_until_title_received"}
        Good Condition Offer: {equity_apply_business_days: "=equity_apply_business_days", positive_equity_payout_business_days: "=positive_equity_payout_business_days", payout_hold_until_title_received: "=payout_hold_until_title_received"}
        Very Good Condition Offer: {equity_apply_business_days: "=equity_apply_business_days", positive_equity_payout_business_days: "=positive_equity_payout_business_days", payout_hold_until_title_received: "=payout_hold_until_title_received"}
        Excellent Condition Offer: {equity_apply_business_days: "=equity_apply_business_days", positive_equity_payout_business_days: "=positive_equity_payout_business_days", payout_hold_until_title_received: "=payout_hold_until_title_received"}
    formula:
      equity_to_distribute: "max(0, equity_balance)"

  - id: tradein_title_receipt
    subject: [tradein_title_document_received, tradein_title_recorded, tradein_value_deducted]
    rule: >-
      A vehicle without a lien is picked up only with its signed paper title when the grade requires it. For a
      liened vehicle, Kestrel waits up to the lien release wait days after sending the payoff for the
      lienholder's paper title or electronic lien release; after that the customer is asked for a lien release
      letter or, when the title was lost, a duplicate title. Only the accepted title documents complete the title
      requirement, and the title received date is recorded on the agreement when the first of them arrives. A
      title-delay chargeback may be taken only after the title delay chargeback days counted from the pickup date
      have passed with no title received date. The chargeback period is counted in calendar days with the pickup
      date as day 0 and the chargeback is allowed from the day after its last day. The chargeback is the grade's
      chargeback percentage of the value credited, deducted as a title_delay_chargeback entry; it is reversed by
      nothing in this charter, and the customer then owes the resulting shortfall within the chargeback payment
      days.
    eligibility:
      - id: chargeback_timing
        applies_to: [tradein_value_deducted]
        kind: time
        condition: "A title-delay chargeback may be taken only after the title delay chargeback days counted from the pickup date have passed with no title received date."
        evidence_fields: [tradein_agreements.pickup_date, tradein_agreements.title_received_date, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the pickup date"
          anchor_source: tradein_agreements.pickup_date
          relation: not_before
          duration_source: variants.title_delay_chargeback_days
          unit: calendar_days
          counting_rule: "The chargeback period is counted in calendar days with the pickup date as day 0 and the chargeback is allowed from the day after its last day."
          boundary: exclusive
    params:
      per_tier:
        Inoperable Condition Offer: {lien_release_wait_days: "=lien_release_wait_days", title_delay_chargeback_days: "=title_delay_chargeback_days", title_delay_chargeback_pct: "=title_delay_chargeback_pct"}
        Rough Condition Offer: {lien_release_wait_days: "=lien_release_wait_days", title_delay_chargeback_days: "=title_delay_chargeback_days", title_delay_chargeback_pct: "=title_delay_chargeback_pct"}
        Fair Condition Offer: {lien_release_wait_days: "=lien_release_wait_days", title_delay_chargeback_days: "=title_delay_chargeback_days", title_delay_chargeback_pct: "=title_delay_chargeback_pct"}
        Good Condition Offer: {lien_release_wait_days: "=lien_release_wait_days", title_delay_chargeback_days: "=title_delay_chargeback_days", title_delay_chargeback_pct: "=title_delay_chargeback_pct"}
        Very Good Condition Offer: {lien_release_wait_days: "=lien_release_wait_days", title_delay_chargeback_days: "=title_delay_chargeback_days", title_delay_chargeback_pct: "=title_delay_chargeback_pct"}
        Excellent Condition Offer: {lien_release_wait_days: "=lien_release_wait_days", title_delay_chargeback_days: "=title_delay_chargeback_days", title_delay_chargeback_pct: "=title_delay_chargeback_pct"}

  - id: tradein_settlement
    subject: [tradein_settled]
    rule: >-
      A picked-up agreement is settled when all three hold: the lien payoff has been sent or there was no lien,
      the title received date is recorded, and the equity balance is exactly zero. An agreement with a negative
      balance stays open until the shortfall is covered; one with a positive balance stays open until the
      equity is applied or paid out.
    eligibility:
      - id: settle_conditions
        applies_to: [tradein_settled]
        kind: authorization
        condition: "A picked-up agreement is settled when all three hold: the lien payoff has been sent or there was no lien, the title received date is recorded, and the equity balance is exactly zero."
        evidence_fields: [tradein_agreements.equity_balance, tradein_agreements.title_received_date, tradein_agreements.lienholder_name, tradein_agreements.trade_in_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [tradein_agreements.trade_in_id]
          action_bindings:
            tradein_agreements.trade_in_id: trade_in_id

  - id: tradein_cancellation
    subject: [tradein_agreement_cancelled]
    rule: >-
      An accepted agreement ends before pickup when the customer withdraws, when the customer declines an adjusted
      offer at pickup, when the pickup window passes without a pickup, or, when the cancel-on-purchase-cancellation
      switch is true, when the linked purchase order is cancelled before pickup. Nothing is credited or deducted on
      a cancelled agreement and any quote recorded on it lapses with it. Once the vehicle is picked up the agreement
      can no longer be cancelled; a customer who wants the vehicle back after pickup is outside this charter.
    eligibility: []
    params:
      per_tier:
        Inoperable Condition Offer: {cancel_on_purchase_cancellation: "=cancel_on_purchase_cancellation", decline_at_pickup_allowed: "=decline_at_pickup_allowed"}
        Rough Condition Offer: {cancel_on_purchase_cancellation: "=cancel_on_purchase_cancellation", decline_at_pickup_allowed: "=decline_at_pickup_allowed"}
        Fair Condition Offer: {cancel_on_purchase_cancellation: "=cancel_on_purchase_cancellation", decline_at_pickup_allowed: "=decline_at_pickup_allowed"}
        Good Condition Offer: {cancel_on_purchase_cancellation: "=cancel_on_purchase_cancellation", decline_at_pickup_allowed: "=decline_at_pickup_allowed"}
        Very Good Condition Offer: {cancel_on_purchase_cancellation: "=cancel_on_purchase_cancellation", decline_at_pickup_allowed: "=decline_at_pickup_allowed"}
        Excellent Condition Offer: {cancel_on_purchase_cancellation: "=cancel_on_purchase_cancellation", decline_at_pickup_allowed: "=decline_at_pickup_allowed"}

# ============================================================================
# extended_policies (trade_in_offers_and_payoffs)
# ============================================================================
extended_policies:
  - id: tradein_ext_mileage_overage_deduction
    base_policy_refs: [tradein_pickup_inspection, tradein_title_receipt]
    overwrite:
      - base_policy: tradein_pickup_inspection
        superseded_clause: >-
          the mileage deduction when the inspected mileage exceeds the stated mileage by more than the mileage
          tolerance, charged on every mile above the stated mileage;
        replaced_by: >-
          The three rate shares are multiplied together with the grade's mileage overage deduction per mile into
          one rate per mile, and the miles left after the delivery-delay credit are charged at that one rate; the
          product is rounded to the nearest cent only once, at the end.
      - base_policy: tradein_title_receipt
        superseded_clause: >-
          A title-delay chargeback may be taken only after the title delay chargeback days counted from the pickup
          date have passed with no title received date.
        replaced_by: >-
          The waiting period after pickup that holds back a title-delay chargeback does not hold back a mileage
          deduction, which is posted on a picked-up agreement whenever the inspection supports it.
    trigger: state_due
    subject: [tradein_value_deducted]
    computes: deduction_amount
    target_tool: post_mileage_deduction_140e91ac
    params:
      long_wait_days: 21
      mid_wait_days: 14
      long_wait_tolerance_miles: 2000
      mid_wait_tolerance_miles: 1500
      claim_window_days: 60
      long_slip_days: 7
      short_slip_days: 3
      long_slip_credit_miles: 60
      short_slip_credit_miles: 40
      low_value_ceiling_usd: 6000.00
      mid_value_ceiling_usd: 12000.00
      low_value_rate_share: 0.5
      mid_value_rate_share: 0.75
      kestrel_sold_covered_share: 0.85
      kestrel_sold_share: 0.92
      upper_program_share: 0.8
      certified_program_share: 0.9
    rule: >-
      A mileage deduction is booked on a picked-up trade-in agreement as one value deduction entry for mileage
      overage, dated the day it is booked, and it lowers the undistributed trade equity by its amount. The
      waiting period after pickup that holds back a title-delay chargeback does not hold back a mileage
      deduction, which is posted on a picked-up agreement whenever the inspection supports it. The mileage
      deduction is figured from the miles by which the inspected mileage exceeds the stated mileage: when that
      overage is greater than the grade's mileage tolerance, every mile of the overage is charged at the grade's
      mileage overage deduction per mile, and otherwise nothing is charged; the product is rounded to the nearest
      cent. The mileage tolerance allowed depends on the wait between the offer and the pickup, counted in
      calendar days from the offer date to the pickup date: a wait longer than the long-wait days allows the
      long-wait tolerance miles; a wait longer than the mid-wait days but not longer than the long-wait days
      allows the mid-wait tolerance miles; any shorter wait allows the grade's mileage tolerance. Which miles of
      the overage are charged depends on Kestrel's own odometer record of the vehicle, read from the latest
      adjudicated repair claim, by failure date, on the KestrelCare service contract written on the traded
      vehicle's VIN, its failure date and odometer at failure being the date and the reading of that record: when
      that failure date falls on or before the offer date and no more than the claim window days before it, and
      the reading is at or below the stated mileage, only the miles of the overage beyond the mileage tolerance
      allowed are charged, never fewer than none; when that failure date falls in the same window and the reading
      is above the stated mileage, every mile of the overage is charged whatever its size; in every other case
      every mile of the overage is charged when the overage is greater than the mileage tolerance allowed, and
      nothing is charged otherwise. A delivery-delay credit is taken off the miles charged when the delivery of
      the purchase the trade is applied to slipped through Kestrel's own lateness: the slip is counted in
      calendar days from the delivery's original scheduled date to its completed date, and only a completed
      delivery whose last missed-attempt cause is Kestrel running late earns a credit; a slip of at least the
      long-slip days earns the long-slip credit miles for each day of slip, a slip of at least the short-slip days
      but fewer than the long-slip days earns the short-slip credit miles for each day of slip, and any other
      delivery earns no credit; the credit is subtracted from the miles charged, and the miles left are never
      fewer than none. The value-band rate share depends on the value credited at pickup, read as the total of the
      agreement's value-credited entries: a value below the low-value ceiling takes the low-value rate share, a
      value at or above the low-value ceiling but below the mid-value ceiling takes the mid-value rate share, and
      any higher value takes a share of one. The Kestrel-history rate share depends on whether Kestrel sold the
      traded vehicle to the customer: when the customer holds a completed Kestrel purchase order on the traded
      vehicle's VIN and a KestrelCare service contract on that VIN, the share is the Kestrel-sold-and-covered
      share; when the customer holds such a completed purchase order but no KestrelCare service contract on that
      VIN, the share is the Kestrel-sold share; otherwise the share is one. The program rate share depends on the
      vehicle program of the purchase order the trade is applied to: a Kestrel Premium Certified or Kestrel
      Factory Certified purchase takes the upper-program share, a Kestrel Certified or Kestrel Certified Plus
      purchase takes the certified-program share, and any other program takes a share of one. The three rate
      shares are multiplied together with the grade's mileage overage deduction per mile into one rate per mile,
      and the miles left after the delivery-delay credit are charged at that one rate; the product is rounded to
      the nearest cent only once, at the end.
    prerequisite: []
    cross_category:
      - category: warranty
        as: history
        reads: [service_contracts.service_contract_id, service_contracts.vin, service_contract_transactions.odometer_at_failure, service_contract_transactions.failure_date]
        note: Kestrel's own odometer record from the latest adjudicated claim on the traded vehicle's KestrelCare contract decides which miles of the overage are charged, and the contract's existence enters the Kestrel-history share.
      - category: delivery
        as: branch
        reads: [delivery_orders.status, delivery_orders.original_scheduled_date, delivery_orders.completed_date, delivery_orders.last_miss_cause]
        note: The slip of the linked purchase's delivery and its last missed-attempt cause decide the delivery-delay credit.
      - category: purchase
        as: branch
        reads: [purchase_orders.vin, purchase_orders.status, purchase_orders.variant_name]
        note: A completed Kestrel purchase on the traded VIN decides the Kestrel-history share, and the linked purchase's vehicle program decides the program rate share.
    compute:
      - wait_days_offer_to_pickup: "DAYS(F('offer_date'), F('pickup_date'))"
      - tolerance_miles_allowed: "K('long_wait_tolerance_miles') if wait_days_offer_to_pickup > K('long_wait_days') else (K('mid_wait_tolerance_miles') if wait_days_offer_to_pickup > K('mid_wait_days') else P('offer_mileage_tolerance_miles'))"
      - overage_miles_at_inspection: "F('inspected_mileage') - F('stated_mileage')"
      - trade_contract_ref: "CFIELD('warranty', 'service_contract_id', vin=F('trade_vin'))"
      - record_odometer_reading: "XLATEST('warranty', 'service_contract_transactions', 'odometer_at_failure', date_field='failure_date', service_contract_id=trade_contract_ref, event_type='warranty_claim_adjudicated')"
      - record_lead_days: "DAYS(XLATEST('warranty', 'service_contract_transactions', 'failure_date', date_field='failure_date', service_contract_id=trade_contract_ref, event_type='warranty_claim_adjudicated'), F('offer_date')) if record_odometer_reading else -1"
      - miles_charged_for_overage: "MX(0, overage_miles_at_inspection - tolerance_miles_allowed) if (record_lead_days >= 0 and record_lead_days <= K('claim_window_days') and record_odometer_reading <= F('stated_mileage')) else (overage_miles_at_inspection if (record_lead_days >= 0 and record_lead_days <= K('claim_window_days') and record_odometer_reading > F('stated_mileage')) else (overage_miles_at_inspection if overage_miles_at_inspection > tolerance_miles_allowed else 0))"
      - delivery_slip_days: "DAYS(CFIELD('delivery', 'original_scheduled_date', purchase_order_id=F('purchase_order_id')), CFIELD('delivery', 'completed_date', purchase_order_id=F('purchase_order_id'))) if EXISTS('delivery', purchase_order_id=F('purchase_order_id'), status='completed') else 0"
      - slip_credit_miles_per_day: "K('long_slip_credit_miles') if (delivery_slip_days >= K('long_slip_days') and CFIELD('delivery', 'last_miss_cause', purchase_order_id=F('purchase_order_id')) == 'kestrel_late') else (K('short_slip_credit_miles') if (delivery_slip_days >= K('short_slip_days') and delivery_slip_days < K('long_slip_days') and CFIELD('delivery', 'last_miss_cause', purchase_order_id=F('purchase_order_id')) == 'kestrel_late') else 0)"
      - net_miles_charged: "MX(0, miles_charged_for_overage - delivery_slip_days * slip_credit_miles_per_day)"
      - credited_trade_value: "SUM('tradein_transactions', 'amount', event_type='tradein_value_credited')"
      - value_band_rate_share: "K('low_value_rate_share') if credited_trade_value < K('low_value_ceiling_usd') else (K('mid_value_rate_share') if credited_trade_value < K('mid_value_ceiling_usd') else 1)"
      - kestrel_history_rate_share: "K('kestrel_sold_covered_share') if (EXISTS('purchase', vin=F('trade_vin'), status='completed') and EXISTS('warranty', vin=F('trade_vin'))) else (K('kestrel_sold_share') if (EXISTS('purchase', vin=F('trade_vin'), status='completed') and not EXISTS('warranty', vin=F('trade_vin'))) else 1)"
      - linked_program: "CFIELD('purchase', 'variant_name', purchase_order_id=F('purchase_order_id'))"
      - program_rate_share: "K('upper_program_share') if (linked_program == 'Kestrel Premium Certified' or linked_program == 'Kestrel Factory Certified') else (K('certified_program_share') if (linked_program == 'Kestrel Certified' or linked_program == 'Kestrel Certified Plus') else 1)"
      - result: "RND(net_miles_charged * P('mileage_overage_deduction_per_mile') * value_band_rate_share * kestrel_history_rate_share * program_rate_share, 2)"
    compute_basis:
      wait_days_offer_to_pickup: "The mileage tolerance allowed depends on the wait between the offer and the pickup, counted in calendar days from the offer date to the pickup date"
      tolerance_miles_allowed: "a wait longer than the long-wait days allows the long-wait tolerance miles; a wait longer than the mid-wait days but not longer than the long-wait days allows the mid-wait tolerance miles; any shorter wait allows the grade's mileage tolerance."
      overage_miles_at_inspection: "The mileage deduction is figured from the miles by which the inspected mileage exceeds the stated mileage"
      trade_contract_ref: "read from the latest adjudicated repair claim, by failure date, on the KestrelCare service contract written on the traded vehicle's VIN"
      record_odometer_reading: "its failure date and odometer at failure being the date and the reading of that record"
      record_lead_days: "when that failure date falls on or before the offer date and no more than the claim window days before it"
      miles_charged_for_overage: "when that failure date falls on or before the offer date and no more than the claim window days before it, and the reading is at or below the stated mileage, only the miles of the overage beyond the mileage tolerance allowed are charged, never fewer than none; when that failure date falls in the same window and the reading is above the stated mileage, every mile of the overage is charged whatever its size; in every other case every mile of the overage is charged when the overage is greater than the mileage tolerance allowed, and nothing is charged otherwise."
      delivery_slip_days: "the slip is counted in calendar days from the delivery's original scheduled date to its completed date, and only a completed delivery whose last missed-attempt cause is Kestrel running late earns a credit"
      slip_credit_miles_per_day: "a slip of at least the long-slip days earns the long-slip credit miles for each day of slip, a slip of at least the short-slip days but fewer than the long-slip days earns the short-slip credit miles for each day of slip, and any other delivery earns no credit"
      net_miles_charged: "the credit is subtracted from the miles charged, and the miles left are never fewer than none."
      credited_trade_value: "the value credited at pickup, read as the total of the agreement's value-credited entries"
      value_band_rate_share: "a value below the low-value ceiling takes the low-value rate share, a value at or above the low-value ceiling but below the mid-value ceiling takes the mid-value rate share, and any higher value takes a share of one."
      kestrel_history_rate_share: "when the customer holds a completed Kestrel purchase order on the traded vehicle's VIN and a KestrelCare service contract on that VIN, the share is the Kestrel-sold-and-covered share; when the customer holds such a completed purchase order but no KestrelCare service contract on that VIN, the share is the Kestrel-sold share; otherwise the share is one."
      linked_program: "The program rate share depends on the vehicle program of the purchase order the trade is applied to"
      program_rate_share: "a Kestrel Premium Certified or Kestrel Factory Certified purchase takes the upper-program share, a Kestrel Certified or Kestrel Certified Plus purchase takes the certified-program share, and any other program takes a share of one."
      result: "The three rate shares are multiplied together with the grade's mileage overage deduction per mile into one rate per mile, and the miles left after the delivery-delay credit are charged at that one rate; the product is rounded to the nearest cent only once, at the end."
    factors:
      - id: tolerance_by_wait
        effect: parameter
        decides: tolerance_miles_allowed
        bindings: [wait_days_offer_to_pickup, tolerance_miles_allowed]
        ladder:
          - when: "the wait from the offer date to the pickup date is longer than the long-wait days"
            value: "K('long_wait_tolerance_miles')"
          - when: "the wait is longer than the mid-wait days but not longer than the long-wait days"
            value: "K('mid_wait_tolerance_miles')"
          - when: "otherwise"
            value: "P('offer_mileage_tolerance_miles')"
        baseline:
          tolerance_miles_allowed: "P('offer_mileage_tolerance_miles')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: kestrel_odometer_record
        effect: method
        decides: miles_charged_for_overage
        bindings: [trade_contract_ref, record_odometer_reading, record_lead_days, miles_charged_for_overage]
        ladder:
          - when: "the latest adjudicated claim on the traded VIN's KestrelCare contract failed on or before the offer date and within the claim window days of it, and its odometer at failure is at or below the stated mileage"
            method: "only the miles of the overage beyond the mileage tolerance allowed are charged, never fewer than none"
          - when: "that claim falls in the same window and its odometer at failure is above the stated mileage"
            method: "every mile of the overage is charged, with no tolerance test at all"
          - when: "otherwise"
            method: "every mile of the overage is charged when the overage is greater than the mileage tolerance allowed, and nothing otherwise"
        baseline:
          miles_charged_for_overage: "overage_miles_at_inspection if overage_miles_at_inspection > tolerance_miles_allowed else 0"
        evidence: [cross_category, history, date]
        cross_difficulty: warranty
      - id: delivery_delay_credit
        effect: parameter
        decides: slip_credit_miles_per_day
        bindings: [delivery_slip_days, slip_credit_miles_per_day]
        ladder:
          - when: "the linked purchase's completed delivery slipped at least the long-slip days and its last missed-attempt cause is Kestrel running late"
            value: "K('long_slip_credit_miles')"
          - when: "it slipped at least the short-slip days but fewer than the long-slip days and its last missed-attempt cause is Kestrel running late"
            value: "K('short_slip_credit_miles')"
          - when: "otherwise"
            value: "0"
        baseline:
          slip_credit_miles_per_day: "0"
        evidence: [cross_category, date]
        cross_difficulty: null
      - id: value_band_share
        effect: parameter
        decides: value_band_rate_share
        bindings: [credited_trade_value, value_band_rate_share]
        ladder:
          - when: "the value credited at pickup is below the low-value ceiling"
            value: "K('low_value_rate_share')"
          - when: "it is at or above the low-value ceiling but below the mid-value ceiling"
            value: "K('mid_value_rate_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          value_band_rate_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: kestrel_history_share
        effect: parameter
        decides: kestrel_history_rate_share
        bindings: [kestrel_history_rate_share]
        ladder:
          - when: "the customer holds a completed Kestrel purchase order on the traded VIN and a KestrelCare service contract on that VIN"
            value: "K('kestrel_sold_covered_share')"
          - when: "the customer holds such a completed purchase order and no KestrelCare service contract on that VIN"
            value: "K('kestrel_sold_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          kestrel_history_rate_share: "1"
        evidence: [cross_category]
        cross_difficulty: null
      - id: program_share
        effect: parameter
        decides: program_rate_share
        bindings: [linked_program, program_rate_share]
        ladder:
          - when: "the purchase the trade is applied to is a Kestrel Premium Certified or Kestrel Factory Certified vehicle"
            value: "K('upper_program_share')"
          - when: "it is a Kestrel Certified or Kestrel Certified Plus vehicle"
            value: "K('certified_program_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          program_rate_share: "1"
        evidence: [cross_category]
        cross_difficulty: purchase
    baseline:
      rule: >-
        The mileage deduction is figured from the miles by which the inspected mileage exceeds the stated mileage:
        when that overage is greater than the grade's mileage tolerance, every mile of the overage is charged at the
        grade's mileage overage deduction per mile, and otherwise nothing is charged; the product is rounded to the
        nearest cent.
      params: [offer_mileage_tolerance_miles, mileage_overage_deduction_per_mile]
    inputs:
      history:
        - {table: tradein_transactions, aggregate: sum, field: amount, filters: {event_type: tradein_value_credited}}
        - {category: warranty, table: service_contract_transactions, aggregate: latest, field: odometer_at_failure, filters: {event_type: warranty_claim_adjudicated}}
      cross_category: [warranty, delivery, purchase]

  - id: tradein_ext_negative_equity_rollin
    base_policy_refs: [tradein_negative_equity, tradein_agg_purchase_link]
    overwrite:
      - base_policy: tradein_negative_equity
        superseded_clause: >-
          Negative equity is the amount by which the payoff due exceeds the value credited less deductions.
        replaced_by: >-
          The negative equity rolled in is the roll-in payoff figure less the roll-in value figure, never less than
          none; the four absorption shares are multiplied together and applied once to that negative equity, and the
          product is held to no more than the finance tier's maximum negative equity before it is rounded to the
          nearest cent.
      - base_policy: tradein_negative_equity
        superseded_clause: >-
          A roll-in is recorded with the linked purchase order and is limited by the finance tier's negative equity
          limit; whatever the finance contract cannot absorb must be paid by the customer.
        replaced_by: >-
          The roll-in is recorded with the purchase order the trade is applied to, and whatever part of the
          negative equity it leaves uncovered is the customer's to pay.
      - base_policy: tradein_negative_equity
        superseded_clause: >-
          when the grade allows roll-in and the finance contract is signed with the shortfall included in the amount
          financed,
        replaced_by: >-
          A Kestrel Auto Finance contract signed before the pickup inspection cannot show the shortfall the
          inspection settles, so the roll-in is recorded without waiting for the contract to itemise it.
    trigger: state_due
    subject: [tradein_negative_equity_settled]
    computes: rollin_amount
    target_tool: record_negative_equity_rollin_4688789d
    params:
      accrual_cap_days: 7
      early_signing_days: 7
      long_term_months: 72
      mid_term_months: 60
      long_term_share: 0.7
      mid_term_share: 0.85
      standing_score_line: 640
      lower_tier_no_autopay_share: 0.8
      lower_tier_autopay_share: 0.9
      two_addon_share: 0.9
      one_addon_share: 0.95
      no_gap_share: 0.9
      basic_gap_share: 0.95
    rule: >-
      Where the purchase order a trade is applied to is paid through a Kestrel Auto Finance contract and the grade
      allows roll-in, the part of the trade's negative equity that contract absorbs is recorded on the trade-in
      agreement as one covering entry for negative equity rolled into financing, dated the day it is recorded, and
      it raises the undistributed trade equity by its amount. The roll-in is recorded with the purchase order the trade is applied to, and whatever part of the negative equity it leaves uncovered is the customer's to pay. A Kestrel Auto Finance contract signed before the pickup inspection cannot show the shortfall the inspection settles, so the roll-in is recorded without waiting for the contract to itemise it. The roll-in is the amount by which the latest recorded payoff quote amount exceeds the agreement's
      undistributed trade equity, never less than none and never more than the finance tier's maximum negative
      equity, rounded to the nearest cent. The roll-in payoff figure depends on how far the latest quote's
      good-through date lies behind the day of recording: when it has passed by at least one and no more than
      the accrual cap days, the figure is the quote amount plus the quote's per diem for each calendar day after
      the good-through date through the day of recording; when it has passed by more than the accrual cap days,
      the figure is the quote amount plus the per diem for the accrual cap days only; when it has not passed, the
      figure is the quote amount alone. The roll-in value figure depends on when the finance contract was signed,
      counted in calendar days from the contract date to the pickup date: a contract signed at least the
      early-signing days before pickup is measured against the total of the agreement's value-credited entries,
      which leaves out the deductions found at pickup; a contract signed at least one day but fewer than the
      early-signing days before pickup is measured against the agreement's original offer amount, the figure the
      contract was written on; a contract signed on the pickup date or later is measured against the
      undistributed trade equity. The term absorption share depends on the finance contract's term: a term of at
      least the long-term months takes the long-term share, a term of at least the mid-term months but shorter
      than the long-term months takes the mid-term share, and any shorter term takes a share of one. The standing
      absorption share depends on the finance tier and autopay together: when the tier's minimum credit score is
      below the standing score line and autopay is not enrolled on the contract, the share is the lower-tier
      share without autopay; when the tier's minimum credit score is below the standing score line and autopay is
      enrolled, the share is the lower-tier share with autopay; a tier whose minimum credit score is at or above
      the standing score line takes a share of one. The add-on absorption share depends on the add-on products
      financed with the purchase: when a KestrelCare service contract is financed in the same finance contract and
      a KestrelCare maintenance plan on the same purchase order is financed too, the share is the two-add-on
      share; when exactly one of the two is financed, the share is the one-add-on share; when neither is, the share
      is one. The GAP absorption share depends on the Kestrel GAP Waiver attached to the finance contract: with no
      GAP waiver attached the share is the no-GAP share; with a Kestrel GAP Essential or Kestrel GAP Standard
      waiver the share is the basic-GAP share; with any higher GAP waiver the share is one. The negative equity
      rolled in is the roll-in payoff figure less the roll-in value figure, never less than none; the four
      absorption shares are multiplied together and applied once to that negative equity, and the product is
      held to no more than the finance tier's maximum negative equity before it is rounded to the nearest cent.
    prerequisite: []
    cross_category:
      - category: finance
        as: branch
        reads: [finance_contracts.contract_date, finance_contracts.term_months, finance_contracts.autopay_enrolled, finance_contracts.finance_contract_id, variant.min_credit_score, variant.max_negative_equity_usd]
        note: The finance contract on the linked purchase decides the roll-in value figure by its signing date, the term share by its term, the standing share by its tier and autopay, and the ceiling by its tier's maximum negative equity.
      - category: warranty
        as: existence
        reads: [service_contracts.finance_contract_id, service_contracts.financed]
        note: A KestrelCare service contract financed in the same contract enters the add-on share.
      - category: maintenance
        as: existence
        reads: [maintenance_plans.purchase_order_id, maintenance_plans.financed]
        note: A KestrelCare maintenance plan financed on the same purchase enters the add-on share.
      - category: gap
        as: branch
        reads: [gap_waivers.finance_contract_id, gap_waivers.variant_name]
        note: The level of the GAP waiver attached to the finance contract decides the GAP share.
    compute:
      - rollin_quote_amount: "LATEST('tradein_transactions', 'amount', date_field='txn_date', event_type='tradein_payoff_quote_recorded')"
      - rollin_quote_per_diem: "LATEST('tradein_transactions', 'per_diem_amount', date_field='txn_date', event_type='tradein_payoff_quote_recorded')"
      - rollin_days_past_good_through: "DAYS(LATEST('tradein_transactions', 'payoff_good_through_date', date_field='txn_date', event_type='tradein_payoff_quote_recorded'), NOW)"
      - rollin_payoff_figure: "rollin_quote_amount + rollin_quote_per_diem * rollin_days_past_good_through if (rollin_days_past_good_through >= 1 and rollin_days_past_good_through <= K('accrual_cap_days')) else (rollin_quote_amount + rollin_quote_per_diem * K('accrual_cap_days') if rollin_days_past_good_through > K('accrual_cap_days') else rollin_quote_amount)"
      - signing_lead_days: "DAYS(CFIELD('finance', 'contract_date', purchase_order_id=F('purchase_order_id')), F('pickup_date'))"
      - rollin_value_figure: "SUM('tradein_transactions', 'amount', event_type='tradein_value_credited') if signing_lead_days >= K('early_signing_days') else (F('original_offer_amount') if signing_lead_days >= 1 else F('equity_balance'))"
      - rollin_negative_equity: "MX(0, rollin_payoff_figure - rollin_value_figure)"
      - financed_term_months: "CFIELD('finance', 'term_months', purchase_order_id=F('purchase_order_id'))"
      - term_absorption_share: "K('long_term_share') if financed_term_months >= K('long_term_months') else (K('mid_term_share') if financed_term_months >= K('mid_term_months') else 1)"
      - tier_min_score: "CPARAM('finance', 'min_credit_score', purchase_order_id=F('purchase_order_id'))"
      - autopay_on_contract: "CFIELD('finance', 'autopay_enrolled', purchase_order_id=F('purchase_order_id'))"
      - standing_absorption_share: "K('lower_tier_no_autopay_share') if (tier_min_score < K('standing_score_line') and not autopay_on_contract) else (K('lower_tier_autopay_share') if (tier_min_score < K('standing_score_line') and autopay_on_contract) else 1)"
      - financing_contract_ref: "CFIELD('finance', 'finance_contract_id', purchase_order_id=F('purchase_order_id'))"
      - addon_absorption_share: "K('two_addon_share') if (EXISTS('warranty', finance_contract_id=financing_contract_ref, financed=True) and EXISTS('maintenance', purchase_order_id=F('purchase_order_id'), financed=True)) else (K('one_addon_share') if ((EXISTS('warranty', finance_contract_id=financing_contract_ref, financed=True) and not EXISTS('maintenance', purchase_order_id=F('purchase_order_id'), financed=True)) or (EXISTS('maintenance', purchase_order_id=F('purchase_order_id'), financed=True) and not EXISTS('warranty', finance_contract_id=financing_contract_ref, financed=True))) else 1)"
      - gap_plan_on_contract: "CFIELD('gap', 'variant_name', finance_contract_id=financing_contract_ref)"
      - gap_absorption_share: "K('no_gap_share') if not gap_plan_on_contract else (K('basic_gap_share') if (gap_plan_on_contract == 'Kestrel GAP Essential' or gap_plan_on_contract == 'Kestrel GAP Standard') else 1)"
      - rollin_ceiling: "CPARAM('finance', 'max_negative_equity_usd', purchase_order_id=F('purchase_order_id'))"
      - result: "RND(MN(rollin_negative_equity * term_absorption_share * standing_absorption_share * addon_absorption_share * gap_absorption_share, rollin_ceiling), 2)"
    compute_basis:
      rollin_quote_amount: "The roll-in is the amount by which the latest recorded payoff quote amount exceeds the agreement's undistributed trade equity"
      rollin_quote_per_diem: "the figure is the quote amount plus the quote's per diem for each calendar day after the good-through date through the day of recording"
      rollin_days_past_good_through: "The roll-in payoff figure depends on how far the latest quote's good-through date lies behind the day of recording"
      rollin_payoff_figure: "when it has passed by at least one and no more than the accrual cap days, the figure is the quote amount plus the quote's per diem for each calendar day after the good-through date through the day of recording; when it has passed by more than the accrual cap days, the figure is the quote amount plus the per diem for the accrual cap days only; when it has not passed, the figure is the quote amount alone."
      signing_lead_days: "The roll-in value figure depends on when the finance contract was signed, counted in calendar days from the contract date to the pickup date"
      rollin_value_figure: "a contract signed at least the early-signing days before pickup is measured against the total of the agreement's value-credited entries, which leaves out the deductions found at pickup; a contract signed at least one day but fewer than the early-signing days before pickup is measured against the agreement's original offer amount, the figure the contract was written on; a contract signed on the pickup date or later is measured against the undistributed trade equity."
      rollin_negative_equity: "The negative equity rolled in is the roll-in payoff figure less the roll-in value figure, never less than none"
      financed_term_months: "The term absorption share depends on the finance contract's term"
      term_absorption_share: "a term of at least the long-term months takes the long-term share, a term of at least the mid-term months but shorter than the long-term months takes the mid-term share, and any shorter term takes a share of one."
      tier_min_score: "The standing absorption share depends on the finance tier and autopay together"
      autopay_on_contract: "The standing absorption share depends on the finance tier and autopay together"
      standing_absorption_share: "when the tier's minimum credit score is below the standing score line and autopay is not enrolled on the contract, the share is the lower-tier share without autopay; when the tier's minimum credit score is below the standing score line and autopay is enrolled, the share is the lower-tier share with autopay; a tier whose minimum credit score is at or above the standing score line takes a share of one."
      financing_contract_ref: "The GAP absorption share depends on the Kestrel GAP Waiver attached to the finance contract"
      addon_absorption_share: "when a KestrelCare service contract is financed in the same finance contract and a KestrelCare maintenance plan on the same purchase order is financed too, the share is the two-add-on share; when exactly one of the two is financed, the share is the one-add-on share; when neither is, the share is one."
      gap_plan_on_contract: "The GAP absorption share depends on the Kestrel GAP Waiver attached to the finance contract"
      gap_absorption_share: "with no GAP waiver attached the share is the no-GAP share; with a Kestrel GAP Essential or Kestrel GAP Standard waiver the share is the basic-GAP share; with any higher GAP waiver the share is one."
      rollin_ceiling: "never more than the finance tier's maximum negative equity"
      result: "the four absorption shares are multiplied together and applied once to that negative equity, and the product is held to no more than the finance tier's maximum negative equity before it is rounded to the nearest cent."
    factors:
      - id: payoff_accrual_window
        effect: method
        decides: rollin_payoff_figure
        bindings: [rollin_days_past_good_through, rollin_payoff_figure]
        ladder:
          - when: "the latest quote's good-through date has passed by at least one and no more than the accrual cap days"
            method: "the quote amount plus the quote's per diem for each calendar day after the good-through date through the day of recording"
          - when: "the good-through date has passed by more than the accrual cap days"
            method: "the quote amount plus the per diem for the accrual cap days only"
          - when: "otherwise"
            method: "the quote amount alone"
        baseline:
          rollin_payoff_figure: "rollin_quote_amount"
        evidence: [history, date]
        cross_difficulty: null
      - id: signing_value_figure
        effect: method
        decides: rollin_value_figure
        bindings: [signing_lead_days, rollin_value_figure]
        ladder:
          - when: "the finance contract was signed at least the early-signing days before the pickup date"
            method: "measured against the total of the agreement's value-credited entries, leaving out pickup deductions"
          - when: "it was signed at least one day but fewer than the early-signing days before the pickup date"
            method: "measured against the agreement's original offer amount"
          - when: "otherwise"
            method: "measured against the undistributed trade equity"
        baseline:
          rollin_value_figure: "F('equity_balance')"
        evidence: [cross_category, date, history]
        cross_difficulty: finance
      - id: term_share
        effect: parameter
        decides: term_absorption_share
        bindings: [financed_term_months, term_absorption_share]
        ladder:
          - when: "the finance contract's term is at least the long-term months"
            value: "K('long_term_share')"
          - when: "the term is at least the mid-term months but shorter than the long-term months"
            value: "K('mid_term_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          term_absorption_share: "1"
        evidence: [cross_category]
        cross_difficulty: finance
      - id: standing_share
        effect: parameter
        decides: standing_absorption_share
        bindings: [tier_min_score, autopay_on_contract, standing_absorption_share]
        ladder:
          - when: "the finance tier's minimum credit score is below the standing score line and autopay is not enrolled"
            value: "K('lower_tier_no_autopay_share')"
          - when: "the finance tier's minimum credit score is below the standing score line and autopay is enrolled"
            value: "K('lower_tier_autopay_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          standing_absorption_share: "1"
        evidence: [cross_category, tier_param]
        cross_difficulty: finance
      - id: addon_share
        effect: parameter
        decides: addon_absorption_share
        bindings: [financing_contract_ref, addon_absorption_share]
        ladder:
          - when: "a KestrelCare service contract is financed in the same finance contract and a KestrelCare maintenance plan on the purchase is financed too"
            value: "K('two_addon_share')"
          - when: "exactly one of the two is financed"
            value: "K('one_addon_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          addon_absorption_share: "1"
        evidence: [cross_category]
        cross_difficulty: null
      - id: gap_share
        effect: parameter
        decides: gap_absorption_share
        bindings: [gap_plan_on_contract, gap_absorption_share]
        ladder:
          - when: "no Kestrel GAP Waiver is attached to the finance contract"
            value: "K('no_gap_share')"
          - when: "a Kestrel GAP Essential or Kestrel GAP Standard waiver is attached"
            value: "K('basic_gap_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          gap_absorption_share: "1"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        The roll-in is the amount by which the latest recorded payoff quote amount exceeds the agreement's
        undistributed trade equity, never less than none and never more than the finance tier's maximum negative
        equity, rounded to the nearest cent.
      params: []
    inputs:
      history:
        - {table: tradein_transactions, aggregate: latest, field: amount, filters: {event_type: tradein_payoff_quote_recorded}}
        - {table: tradein_transactions, aggregate: sum, field: amount, filters: {event_type: tradein_value_credited}}
      cross_category: [finance, warranty, maintenance, gap]

  - id: tradein_ext_payoff_shortfall_payment
    base_policy_refs: [tradein_negative_equity, tradein_lien_payoff]
    overwrite:
      - base_policy: tradein_negative_equity
        superseded_clause: >-
          Negative equity is the amount by which the payoff due exceeds the value credited less deductions.
        replaced_by: >-
          The shortfall payment is the coverage payoff figure plus the quote's per diem for the coverage accrual
          days and the coverage cushion days together, less the undistributed trade equity, less the loyalty credit
          and the protection credit, never less than none; it is rounded to the nearest cent only once, at the end.
    trigger: state_due
    subject: [tradein_negative_equity_settled]
    computes: payment_amount
    target_tool: pay_trade_shortfall_d2aa4d28
    params:
      quote_drop_days: 30
      short_validity_days: 2
      mid_validity_days: 5
      stale_quote_age_days: 7
      aging_quote_age_days: 4
      long_cushion_days: 5
      short_cushion_days: 3
      loyalty_autopay_credit_usd: 60.00
      loyalty_credit_usd: 30.00
      upper_protection_credit_usd: 50.00
      basic_protection_credit_usd: 25.00
    rule: >-
      When the payoff the old lienholder is owed exceeds the undistributed trade equity of a picked-up trade-in
      agreement, the customer pays the shortfall from their own funds by bank transfer, and the payment is booked
      as one covering entry for a customer payment, dated the day it is paid, raising the undistributed trade
      equity by its amount. The shortfall payment is not figured until the agreement's ledger carries the mileage
      deduction owed on an inspected mileage above the stated mileage. Where the purchase the trade is applied to is financed through Kestrel Auto Finance and the grade allows roll-in, the shortfall payment is fixed only after the agreement's ledger
      carries the entry for the negative equity rolled into that financing. The shortfall payment is the latest
      recorded payoff quote amount plus the quote's per diem for each calendar day after its good-through date
      through the day of payment, less the agreement's undistributed trade equity, never less than none, rounded
      to the nearest cent. The coverage payoff figure depends on how the latest quote compares with the highest
      quote amount on the agreement's ledger: when the highest quote amount exceeds the latest one by more than
      the latest quote's per diem times the quote-drop days, the figure is the highest quote amount; when the
      highest quote amount exceeds the latest one by a smaller positive amount, the figure is the average of the
      two, rounded to the nearest cent; when no quote exceeds the latest one, the figure is the latest quote
      amount. The coverage accrual days depend on how long the latest quote was good for, counted in calendar days
      from its quote date to its good-through date: a quote good for no more than the short-validity days accrues
      per diem for each calendar day after its quote date through the day of payment; a quote good for more than
      the short-validity days but no more than the mid-validity days accrues per diem from its good-through date
      itself through the day of payment, both days counted; a quote good for longer accrues per diem for each
      calendar day after its good-through date through the day of payment; none of these counts falls below none.
      The coverage cushion days depend on the latest quote's age on the day of payment, counted in calendar days
      from its quote date: an age of at least the stale-quote age days adds the long cushion days, an age of at
      least the aging-quote age days but below the stale-quote age days adds the short cushion days, and any
      younger quote adds no cushion. The loyalty credit depends on whether Kestrel sold the traded vehicle to the
      customer and on autopay: when the customer holds a completed Kestrel purchase order on the traded vehicle's
      VIN and autopay is enrolled on the Kestrel Auto Finance contract of the purchase the trade is applied to, the
      credit is the loyalty autopay credit; when the customer holds such a completed purchase order and autopay is
      not enrolled on that contract, or there is no such contract, the credit is the loyalty credit; otherwise
      there is no loyalty credit. The protection credit depends on the KestrelCare service contract written on the
      purchase the trade is applied to: a KestrelCare Gold, KestrelCare Platinum or KestrelCare Platinum
      Exclusionary contract earns the upper protection credit, a KestrelCare Powertrain, KestrelCare Powertrain
      Plus or KestrelCare Silver contract earns the basic protection credit, and no contract earns no credit. The
      shortfall payment is the coverage payoff figure plus the quote's per diem for the coverage accrual days and
      the coverage cushion days together, less the undistributed trade equity, less the loyalty credit and the
      protection credit, never less than none; it is rounded to the nearest cent only once, at the end.
    prerequisite:
      - problem: tradein_ext_mileage_overage_deduction
        kind: value_input
        gate: cover_trade_equity
        form: state
        policy_source: >-
          The shortfall payment is not figured until the agreement's ledger carries the mileage deduction owed on an
          inspected mileage above the stated mileage.
        condition: >-
          the trade-in ledger holds a value deduction entry for mileage overage on the agreement whenever its
          inspected mileage exceeds its stated mileage and the mileage rule charges any miles
        resolved_by: post_mileage_deduction_140e91ac
        effect: >-
          the mileage deduction lowers the undistributed trade equity the shortfall payment is measured against by
          the deduction amount, so the payment rises by that amount
      - problem: tradein_ext_negative_equity_rollin
        kind: value_input
        gate: cover_trade_equity
        form: state
        policy_source: >-
          Where the purchase the trade is applied to is financed through Kestrel Auto Finance and the grade allows roll-in, the shortfall payment is fixed only after the agreement's ledger carries the entry for the negative equity rolled into that
          financing.
        condition: >-
          the trade-in ledger holds a covering entry rolled into financing that names the linked purchase order,
          whenever that purchase is paid through Kestrel Auto Finance and the grade allows roll-in
        resolved_by: record_negative_equity_rollin_4688789d
        effect: >-
          the roll-in raises the undistributed trade equity the shortfall payment is measured against by the
          roll-in amount, so the payment falls by that amount
    cross_category:
      - category: purchase
        as: existence
        reads: [purchase_orders.vin, purchase_orders.status]
        note: A completed Kestrel purchase order on the traded VIN enters the loyalty credit.
      - category: finance
        as: branch
        reads: [finance_contracts.autopay_enrolled]
        note: Autopay on the Kestrel Auto Finance contract of the linked purchase decides between the two loyalty credits.
      - category: warranty
        as: branch
        reads: [service_contracts.purchase_order_id, service_contracts.variant_name]
        note: The level of the KestrelCare contract written on the linked purchase decides the protection credit.
    compute:
      - cover_latest_quote: "LATEST('tradein_transactions', 'amount', date_field='txn_date', event_type='tradein_payoff_quote_recorded')"
      - cover_highest_quote: "MAX('tradein_transactions', 'amount', event_type='tradein_payoff_quote_recorded')"
      - cover_per_diem: "LATEST('tradein_transactions', 'per_diem_amount', date_field='txn_date', event_type='tradein_payoff_quote_recorded')"
      - coverage_payoff_figure: "cover_highest_quote if (cover_highest_quote - cover_latest_quote) > cover_per_diem * K('quote_drop_days') else (RND((cover_highest_quote + cover_latest_quote) / 2, 2) if cover_highest_quote > cover_latest_quote else cover_latest_quote)"
      - cover_quote_date: "LATEST('tradein_transactions', 'txn_date', date_field='txn_date', event_type='tradein_payoff_quote_recorded')"
      - cover_good_through: "LATEST('tradein_transactions', 'payoff_good_through_date', date_field='txn_date', event_type='tradein_payoff_quote_recorded')"
      - cover_validity_days: "DAYS(cover_quote_date, cover_good_through)"
      - coverage_accrual_days: "MX(0, DAYS(cover_quote_date, NOW)) if cover_validity_days <= K('short_validity_days') else (MX(0, DAYS(cover_good_through, NOW) + 1) if cover_validity_days <= K('mid_validity_days') else MX(0, DAYS(cover_good_through, NOW)))"
      - cover_quote_age: "DAYS(cover_quote_date, NOW)"
      - coverage_cushion_days: "K('long_cushion_days') if cover_quote_age >= K('stale_quote_age_days') else (K('short_cushion_days') if cover_quote_age >= K('aging_quote_age_days') else 0)"
      - loyalty_credit: "K('loyalty_autopay_credit_usd') if (EXISTS('purchase', vin=F('trade_vin'), status='completed') and CFIELD('finance', 'autopay_enrolled', purchase_order_id=F('purchase_order_id')) == True) else (K('loyalty_credit_usd') if (EXISTS('purchase', vin=F('trade_vin'), status='completed') and not CFIELD('finance', 'autopay_enrolled', purchase_order_id=F('purchase_order_id')) == True) else 0)"
      - protection_plan_on_purchase: "CFIELD('warranty', 'variant_name', purchase_order_id=F('purchase_order_id'))"
      - protection_credit: "K('upper_protection_credit_usd') if (protection_plan_on_purchase == 'KestrelCare Gold' or protection_plan_on_purchase == 'KestrelCare Platinum' or protection_plan_on_purchase == 'KestrelCare Platinum Exclusionary') else (K('basic_protection_credit_usd') if (protection_plan_on_purchase == 'KestrelCare Powertrain' or protection_plan_on_purchase == 'KestrelCare Powertrain Plus' or protection_plan_on_purchase == 'KestrelCare Silver') else 0)"
      - cover_trade_equity: "F('equity_balance')"
      - result: "RND(MX(0, coverage_payoff_figure + cover_per_diem * (coverage_accrual_days + coverage_cushion_days) - cover_trade_equity - loyalty_credit - protection_credit), 2)"
    compute_basis:
      cover_latest_quote: "The shortfall payment is the latest recorded payoff quote amount plus the quote's per diem for each calendar day after its good-through date through the day of payment"
      cover_highest_quote: "The coverage payoff figure depends on how the latest quote compares with the highest quote amount on the agreement's ledger"
      cover_per_diem: "the quote's per diem for each calendar day after its good-through date through the day of payment"
      coverage_payoff_figure: "when the highest quote amount exceeds the latest one by more than the latest quote's per diem times the quote-drop days, the figure is the highest quote amount; when the highest quote amount exceeds the latest one by a smaller positive amount, the figure is the average of the two, rounded to the nearest cent; when no quote exceeds the latest one, the figure is the latest quote amount."
      cover_quote_date: "counted in calendar days from its quote date to its good-through date"
      cover_good_through: "counted in calendar days from its quote date to its good-through date"
      cover_validity_days: "The coverage accrual days depend on how long the latest quote was good for, counted in calendar days from its quote date to its good-through date"
      coverage_accrual_days: "a quote good for no more than the short-validity days accrues per diem for each calendar day after its quote date through the day of payment; a quote good for more than the short-validity days but no more than the mid-validity days accrues per diem from its good-through date itself through the day of payment, both days counted; a quote good for longer accrues per diem for each calendar day after its good-through date through the day of payment; none of these counts falls below none."
      cover_quote_age: "The coverage cushion days depend on the latest quote's age on the day of payment, counted in calendar days from its quote date"
      coverage_cushion_days: "an age of at least the stale-quote age days adds the long cushion days, an age of at least the aging-quote age days but below the stale-quote age days adds the short cushion days, and any younger quote adds no cushion."
      loyalty_credit: "when the customer holds a completed Kestrel purchase order on the traded vehicle's VIN and autopay is enrolled on the Kestrel Auto Finance contract of the purchase the trade is applied to, the credit is the loyalty autopay credit; when the customer holds such a completed purchase order and autopay is not enrolled on that contract, or there is no such contract, the credit is the loyalty credit; otherwise there is no loyalty credit."
      protection_plan_on_purchase: "The protection credit depends on the KestrelCare service contract written on the purchase the trade is applied to"
      protection_credit: "a KestrelCare Gold, KestrelCare Platinum or KestrelCare Platinum Exclusionary contract earns the upper protection credit, a KestrelCare Powertrain, KestrelCare Powertrain Plus or KestrelCare Silver contract earns the basic protection credit, and no contract earns no credit."
      cover_trade_equity: "less the agreement's undistributed trade equity"
      result: "The shortfall payment is the coverage payoff figure plus the quote's per diem for the coverage accrual days and the coverage cushion days together, less the undistributed trade equity, less the loyalty credit and the protection credit, never less than none; it is rounded to the nearest cent only once, at the end."
    factors:
      - id: coverage_quote_choice
        effect: method
        decides: coverage_payoff_figure
        bindings: [cover_highest_quote, coverage_payoff_figure]
        ladder:
          - when: "the highest quote amount on the ledger exceeds the latest quote amount by more than the latest per diem times the quote-drop days"
            method: "the coverage payoff figure is the highest quote amount"
          - when: "the highest quote amount exceeds the latest one by a smaller positive amount"
            method: "the coverage payoff figure is the average of the highest and the latest quote amounts, rounded to the nearest cent"
          - when: "otherwise"
            method: "the coverage payoff figure is the latest quote amount"
        baseline:
          coverage_payoff_figure: "cover_latest_quote"
        evidence: [history]
        cross_difficulty: null
      - id: coverage_accrual_convention
        effect: method
        decides: coverage_accrual_days
        bindings: [cover_validity_days, coverage_accrual_days]
        ladder:
          - when: "the latest quote was good for no more than the short-validity days"
            method: "per diem accrues for each calendar day after the quote date through the day of payment"
          - when: "it was good for more than the short-validity days but no more than the mid-validity days"
            method: "per diem accrues from the good-through date itself through the day of payment, both days counted"
          - when: "otherwise"
            method: "per diem accrues for each calendar day after the good-through date through the day of payment"
        baseline:
          coverage_accrual_days: "MX(0, DAYS(cover_good_through, NOW))"
        evidence: [history, date]
        cross_difficulty: null
      - id: coverage_cushion
        effect: parameter
        decides: coverage_cushion_days
        bindings: [cover_quote_age, coverage_cushion_days]
        ladder:
          - when: "the latest quote is at least the stale-quote age days old on the day of payment"
            value: "K('long_cushion_days')"
          - when: "it is at least the aging-quote age days old but younger than the stale-quote age days"
            value: "K('short_cushion_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          coverage_cushion_days: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: loyalty_credit_tier
        effect: parameter
        decides: loyalty_credit
        bindings: [loyalty_credit]
        ladder:
          - when: "Kestrel sold the traded vehicle to the customer (a completed Kestrel purchase order on its VIN) and autopay is enrolled on the Kestrel Auto Finance contract of the linked purchase"
            value: "K('loyalty_autopay_credit_usd')"
          - when: "Kestrel sold the traded vehicle and autopay is not enrolled on that contract or there is no such contract"
            value: "K('loyalty_credit_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          loyalty_credit: "0"
        evidence: [cross_category]
        cross_difficulty: finance
      - id: protection_credit_tier
        effect: parameter
        decides: protection_credit
        bindings: [protection_plan_on_purchase, protection_credit]
        ladder:
          - when: "the linked purchase carries a KestrelCare Gold, KestrelCare Platinum or KestrelCare Platinum Exclusionary contract"
            value: "K('upper_protection_credit_usd')"
          - when: "it carries a KestrelCare Powertrain, KestrelCare Powertrain Plus or KestrelCare Silver contract"
            value: "K('basic_protection_credit_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          protection_credit: "0"
        evidence: [cross_category]
        cross_difficulty: warranty
    baseline:
      rule: >-
        The shortfall payment is the latest recorded payoff quote amount plus the quote's per diem for each calendar
        day after its good-through date through the day of payment, less the agreement's undistributed trade equity,
        never less than none, rounded to the nearest cent.
      params: []
    inputs:
      history:
        - {table: tradein_transactions, aggregate: latest, field: amount, filters: {event_type: tradein_payoff_quote_recorded}}
        - {table: tradein_transactions, aggregate: max, field: amount, filters: {event_type: tradein_payoff_quote_recorded}}
      cross_category: [purchase, finance, warranty]

  - id: tradein_ext_lien_payoff_charge
    base_policy_refs: [tradein_lien_payoff, tradein_negative_equity]
    overwrite:
      - base_policy: tradein_lien_payoff
        superseded_clause: >-
          The amount sent is the quote amount when sent on or before the quote's good-through date, and otherwise
          the quote amount plus the quote's per-diem amount for each calendar day after the good-through date
          through the send date.
        replaced_by: >-
          The per-diem window depends on how the payoff travels to the lienholder: a quote amount below the wire
          line goes by overnight check, and the window then runs through the day the check arrives, which adds the Friday-transit days to a Friday send date and the check-transit days to a send date on any other day of the week; a quote amount at or above the wire line goes by wire, and the window runs through the send date
          itself.
      - base_policy: tradein_lien_payoff
        superseded_clause: >-
          When the payoff is sent later than the grade's payoff send business days after pickup and the late
          per-diem switch is true, the per diem for the days beyond Kestrel's own deadline is borne by Kestrel and
          is not charged against the trade equity.
        replaced_by: >-
          The days Kestrel absorbs depend on how promptly the pickup inspection's deductions were posted, counted in
          calendar days from the pickup date to the posting date of the latest value deduction entry on the ledger:
          when that lag is longer than the backlog days, Kestrel absorbs every day after the later of the
          good-through date and the pickup date through the send date; when the lag is at least one day and no
          longer than the backlog days, Kestrel absorbs every day after the later of the good-through date and the
          day that is the backlog days after the pickup date, through the send date; in every other case Kestrel
          absorbs the days set by its own payoff deadline.
    trigger: state_due
    subject: [tradein_lien_payoff_sent]
    computes: payoff_amount
    target_tool: send_lien_payoff_9460d1ba
    params:
      wire_line_usd: 15000.00
      friday_transit_days: 3
      check_transit_days: 1
      backlog_days: 2
      upper_program_customer_share: 0
      certified_program_customer_share: 0.5
      long_refresh_age_days: 9
      refresh_age_days: 7
      long_refresh_relief_days: 2
      refresh_relief_days: 1
    rule: >-
      The lien payoff on a picked-up trade-in agreement is sent to the lienholder relying on the latest recorded
      payoff quote, and the payoff charge is booked as one lien payoff entry naming that quote, dated the send
      date, lowering the undistributed trade equity by its amount; any per diem Kestrel absorbs is paid by Kestrel
      on top of the payoff charge and never touches the trade equity. Where the payoff charge exceeds the
      undistributed trade equity, the lien payoff is not sent until the customer has paid in the part of the
      shortfall that no financing roll-in covers. The payoff charge is fixed only after the agreement's ledger
      carries the mileage deduction due on an inspected mileage above the stated mileage. The payoff charge is the
      latest recorded payoff quote amount, plus the quote's per diem for each calendar day after its good-through
      date through the send date, less the per diem for the days of that span that fall after Kestrel's own payoff
      deadline when the grade's late per-diem switch is on; Kestrel's own payoff deadline is the grade's payoff
      send business days after the pickup date, counting Monday to Friday only and starting with the first
      weekday after the pickup date; the payoff charge is rounded to the nearest cent. The per-diem window depends
      on how the payoff travels to the lienholder: a quote amount below the wire line goes by overnight check, and
      the window then runs through the day the check arrives, which adds the Friday-transit days to a Friday send date and the check-transit days to a send date on any other day of the week; a quote amount at or above the wire
      line goes by wire, and the window runs through the send date itself. The days Kestrel absorbs depend on how
      promptly the pickup inspection's deductions were posted, counted in calendar days from the pickup date to the
      posting date of the latest value deduction entry on the ledger: when that lag is longer than the backlog days,
      Kestrel absorbs every day after the later of the good-through date and the pickup date through the send date;
      when the lag is at least one day and no longer than the backlog days, Kestrel absorbs every day after the
      later of the good-through date and the day that is the backlog days after the pickup date, through the send
      date; in every other case Kestrel absorbs the days set by its own payoff deadline. The quote-refresh relief
      depends on the age of the quote relied on, counted in calendar days from its quote date to the send date: an
      age of at least the long refresh age days relieves the customer of the long refresh relief days of per diem,
      an age of at least the refresh age days but below the long refresh age days relieves the refresh relief days,
      and a younger quote relieves none. The program per-diem share depends on the vehicle program of the purchase
      order the trade is applied to: a Kestrel Premium Certified or Kestrel Factory Certified purchase charges the
      customer the upper-program customer share of the remaining per diem, a Kestrel Certified or Kestrel Certified
      Plus purchase charges the certified-program customer share, and any other program charges all of it. The
      customer's per-diem days are the days of the per-diem window less the days Kestrel absorbs and less the
      quote-refresh relief days, never fewer than none; the payoff charge is the quote amount plus the quote's per
      diem times those days times the program per-diem share, rounded to the nearest cent only once, at the end.
    prerequisite:
      - problem: tradein_ext_payoff_shortfall_payment
        kind: state_gate
        gate: tradein_agreements.equity_balance
        form: action
        policy_source: >-
          Where the payoff charge exceeds the undistributed trade equity, the lien payoff is not sent until the
          customer has paid in the part of the shortfall that no financing roll-in covers.
        fallback_reason: >-
          The state this payment leaves, a customer payment entry raising the undistributed trade equity, is left
          as well by the customer's payment of a title-delay chargeback shortfall, and the equity level it restores
          can also be raised by a financing roll-in entry, so no record-visible state singles out the customer's
          payment of the payoff shortfall; the sentence therefore names the payment itself.
        condition: >-
          the undistributed trade equity is at least the payoff charge, the part of the shortfall not rolled into
          financing having been covered by a customer payment entry on the agreement
        resolved_by: pay_trade_shortfall_d2aa4d28
        effect: >-
          the customer's shortfall payment brings the undistributed trade equity up to at least the payoff charge,
          which is the state the payoff waits on
      - problem: tradein_ext_mileage_overage_deduction
        kind: value_input
        gate: kestrel_absorbed_days
        form: state
        policy_source: >-
          The payoff charge is fixed only after the agreement's ledger carries the mileage deduction due on an
          inspected mileage above the stated mileage.
        condition: >-
          the trade-in ledger holds the value deduction entry for mileage overage owed on the agreement, so the
          posting date of the latest value deduction entry is on the ledger
        resolved_by: post_mileage_deduction_140e91ac
        effect: >-
          the mileage deduction entry dates the posting of the pickup inspection's deductions, which sets the
          posting lag and so the days Kestrel absorbs
    cross_category:
      - category: purchase
        as: branch
        reads: [purchase_orders.variant_name]
        note: The vehicle program of the linked purchase decides the program per-diem share.
    compute:
      - payoff_quote_amount: "LATEST('tradein_transactions', 'amount', date_field='txn_date', event_type='tradein_payoff_quote_recorded')"
      - payoff_quote_per_diem: "LATEST('tradein_transactions', 'per_diem_amount', date_field='txn_date', event_type='tradein_payoff_quote_recorded')"
      - payoff_good_through: "LATEST('tradein_transactions', 'payoff_good_through_date', date_field='txn_date', event_type='tradein_payoff_quote_recorded')"
      - days_from_good_through_to_send: "DAYS(payoff_good_through, NOW)"
      - send_weekday: "DAYS('2024-01-01', NOW) % 7"
      - check_transit_days_added: "K('friday_transit_days') if (payoff_quote_amount < K('wire_line_usd') and send_weekday == 4) else (K('check_transit_days') if (payoff_quote_amount < K('wire_line_usd') and send_weekday != 4) else 0)"
      - per_diem_window_days: "MX(0, days_from_good_through_to_send + check_transit_days_added)"
      - pickup_weekday: "DAYS('2024-01-01', F('pickup_date')) % 7"
      - deadline_offset_days: "(P('payoff_send_business_days') + 2 if pickup_weekday + P('payoff_send_business_days') > 4 else P('payoff_send_business_days')) if pickup_weekday <= 4 else (P('payoff_send_business_days') + 1 if pickup_weekday == 5 else P('payoff_send_business_days'))"
      - deduction_posting_lag: "DAYS(F('pickup_date'), LATEST('tradein_transactions', 'txn_date', date_field='txn_date', event_type='tradein_value_deducted')) if COUNT('tradein_transactions', event_type='tradein_value_deducted') > 0 else -1"
      - kestrel_absorbed_days: "MX(0, MN(days_from_good_through_to_send, DAYS(F('pickup_date'), NOW))) if deduction_posting_lag > K('backlog_days') else (MX(0, MN(days_from_good_through_to_send, DAYS(F('pickup_date'), NOW) - K('backlog_days'))) if deduction_posting_lag >= 1 else (MX(0, MN(days_from_good_through_to_send, DAYS(F('pickup_date'), NOW) - deadline_offset_days)) if P('kestrel_absorbs_late_per_diem') else 0))"
      - quote_age_at_send: "DAYS(LATEST('tradein_transactions', 'txn_date', date_field='txn_date', event_type='tradein_payoff_quote_recorded'), NOW)"
      - refresh_relief_days: "K('long_refresh_relief_days') if quote_age_at_send >= K('long_refresh_age_days') else (K('refresh_relief_days') if quote_age_at_send >= K('refresh_age_days') else 0)"
      - linked_program_for_payoff: "CFIELD('purchase', 'variant_name', purchase_order_id=F('purchase_order_id'))"
      - program_per_diem_share: "K('upper_program_customer_share') if (linked_program_for_payoff == 'Kestrel Premium Certified' or linked_program_for_payoff == 'Kestrel Factory Certified') else (K('certified_program_customer_share') if (linked_program_for_payoff == 'Kestrel Certified' or linked_program_for_payoff == 'Kestrel Certified Plus') else 1)"
      - customer_per_diem_days: "MX(0, per_diem_window_days - kestrel_absorbed_days - refresh_relief_days)"
      - result: "RND(payoff_quote_amount + payoff_quote_per_diem * customer_per_diem_days * program_per_diem_share, 2)"
    compute_basis:
      payoff_quote_amount: "The payoff charge is the latest recorded payoff quote amount"
      payoff_quote_per_diem: "plus the quote's per diem for each calendar day after its good-through date through the send date"
      payoff_good_through: "plus the quote's per diem for each calendar day after its good-through date through the send date"
      days_from_good_through_to_send: "plus the quote's per diem for each calendar day after its good-through date through the send date"
      send_weekday: "which adds the Friday-transit days to a Friday send date and the check-transit days to a send date on any other day of the week"
      check_transit_days_added: "a quote amount below the wire line goes by overnight check, and the window then runs through the day the check arrives, which adds the Friday-transit days to a Friday send date and the check-transit days to a send date on any other day of the week; a quote amount at or above the wire line goes by wire, and the window runs through the send date itself."
      per_diem_window_days: "a quote amount below the wire line goes by overnight check, and the window then runs through the day the check arrives, which adds the Friday-transit days to a Friday send date and the check-transit days to a send date on any other day of the week; a quote amount at or above the wire line goes by wire, and the window runs through the send date itself."
      pickup_weekday: "Kestrel's own payoff deadline is the grade's payoff send business days after the pickup date, counting Monday to Friday only and starting with the first weekday after the pickup date"
      deadline_offset_days: "Kestrel's own payoff deadline is the grade's payoff send business days after the pickup date, counting Monday to Friday only and starting with the first weekday after the pickup date"
      deduction_posting_lag: "counted in calendar days from the pickup date to the posting date of the latest value deduction entry on the ledger"
      kestrel_absorbed_days: "when that lag is longer than the backlog days, Kestrel absorbs every day after the later of the good-through date and the pickup date through the send date; when the lag is at least one day and no longer than the backlog days, Kestrel absorbs every day after the later of the good-through date and the day that is the backlog days after the pickup date, through the send date; in every other case Kestrel absorbs the days set by its own payoff deadline."
      quote_age_at_send: "The quote-refresh relief depends on the age of the quote relied on, counted in calendar days from its quote date to the send date"
      refresh_relief_days: "an age of at least the long refresh age days relieves the customer of the long refresh relief days of per diem, an age of at least the refresh age days but below the long refresh age days relieves the refresh relief days, and a younger quote relieves none."
      linked_program_for_payoff: "The program per-diem share depends on the vehicle program of the purchase order the trade is applied to"
      program_per_diem_share: "a Kestrel Premium Certified or Kestrel Factory Certified purchase charges the customer the upper-program customer share of the remaining per diem, a Kestrel Certified or Kestrel Certified Plus purchase charges the certified-program customer share, and any other program charges all of it."
      customer_per_diem_days: "The customer's per-diem days are the days of the per-diem window less the days Kestrel absorbs and less the quote-refresh relief days, never fewer than none"
      result: "the payoff charge is the quote amount plus the quote's per diem times those days times the program per-diem share, rounded to the nearest cent only once, at the end."
    factors:
      - id: payoff_channel_window
        effect: parameter
        decides: check_transit_days_added
        bindings: [send_weekday, check_transit_days_added]
        ladder:
          - when: "the quote amount is below the wire line and the send date is a Friday"
            value: "K('friday_transit_days')"
          - when: "the quote amount is below the wire line and the send date is any other day of the week"
            value: "K('check_transit_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          check_transit_days_added: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: kestrel_backlog_absorption
        effect: method
        decides: kestrel_absorbed_days
        bindings: [pickup_weekday, deadline_offset_days, deduction_posting_lag, kestrel_absorbed_days]
        ladder:
          - when: "the latest value deduction posted more than the backlog days after the pickup date"
            method: "Kestrel absorbs every day after the later of the good-through date and the pickup date through the send date"
          - when: "it posted at least one day and no more than the backlog days after the pickup date"
            method: "Kestrel absorbs every day after the later of the good-through date and the backlog days after pickup, through the send date"
          - when: "otherwise"
            method: "Kestrel absorbs the days after the later of the good-through date and its own business-day payoff deadline, through the send date"
        baseline:
          kestrel_absorbed_days: "MX(0, MN(days_from_good_through_to_send, DAYS(F('pickup_date'), NOW) - deadline_offset_days)) if P('kestrel_absorbs_late_per_diem') else 0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: quote_refresh_relief
        effect: parameter
        decides: refresh_relief_days
        bindings: [quote_age_at_send, refresh_relief_days]
        ladder:
          - when: "the quote relied on is at least the long refresh age days old on the send date"
            value: "K('long_refresh_relief_days')"
          - when: "it is at least the refresh age days old but younger than the long refresh age days"
            value: "K('refresh_relief_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          refresh_relief_days: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: program_per_diem
        effect: parameter
        decides: program_per_diem_share
        bindings: [linked_program_for_payoff, program_per_diem_share]
        ladder:
          - when: "the linked purchase is a Kestrel Premium Certified or Kestrel Factory Certified vehicle"
            value: "K('upper_program_customer_share')"
          - when: "it is a Kestrel Certified or Kestrel Certified Plus vehicle"
            value: "K('certified_program_customer_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          program_per_diem_share: "1"
        evidence: [cross_category]
        cross_difficulty: purchase
    baseline:
      rule: >-
        The payoff charge is the latest recorded payoff quote amount, plus the quote's per diem for each calendar day
        after its good-through date through the send date, less the per diem for the days of that span that fall
        after Kestrel's own payoff deadline when the grade's late per-diem switch is on; Kestrel's own payoff
        deadline is the grade's payoff send business days after the pickup date, counting Monday to Friday only and
        starting with the first weekday after the pickup date; the payoff charge is rounded to the nearest cent.
      params: [payoff_send_business_days, kestrel_absorbs_late_per_diem]
    inputs:
      history:
        - {table: tradein_transactions, aggregate: latest, field: amount, filters: {event_type: tradein_payoff_quote_recorded}}
        - {table: tradein_transactions, aggregate: latest, field: txn_date, filters: {event_type: tradein_value_deducted}}
      cross_category: [purchase]

  - id: tradein_ext_towing_fee_deduction
    base_policy_refs: [tradein_pickup_inspection, tradein_title_receipt]
    overwrite:
      - base_policy: tradein_pickup_inspection
        superseded_clause: >-
          and the towing fee when the vehicle is towed.
        replaced_by: >-
          The towing deduction is the grade's towing fee plus the standard per-mile tow rate for every mile of the
          one-way tow distance beyond the standard included tow miles, the one-way tow distance being the distance
          recorded on the delivery appointment of the purchase the trade is applied to; it is rounded to the nearest
          cent.
      - base_policy: tradein_title_receipt
        superseded_clause: >-
          A title-delay chargeback may be taken only after the title delay chargeback days counted from the pickup
          date have passed with no title received date.
        replaced_by: >-
          The waiting period after pickup that holds back a title-delay chargeback does not hold back a towing
          deduction.
    trigger: state_due
    subject: [tradein_value_deducted]
    computes: towing_fee
    target_tool: post_towing_fee_7cb58a13
    params:
      standard_included_miles: 25
      standard_tow_rate_usd: 2.00
      extended_zone_included_miles: 60
      local_delivery_included_miles: 40
      sunday_hook_surcharge_usd: 75.00
      saturday_hook_surcharge_usd: 50.00
      long_tow_line_miles: 50
      mid_tow_line_miles: 30
      long_tow_rate_usd: 1.50
      mid_tow_rate_usd: 1.75
      financed_and_covered_share: 0.8
      financed_share: 0.9
    rule: >-
      A towing deduction is booked on a picked-up trade-in agreement when Kestrel collected the vehicle by tow truck,
      which is how every vehicle offered at a grade that allows no hub drop-off is collected; it is one value
      deduction entry for the towing fee, dated the day it is booked, and it lowers the undistributed trade equity
      by its amount. The waiting period after pickup that holds back a title-delay chargeback does not hold back a
      towing deduction. The towing deduction is the grade's towing fee plus the standard per-mile tow rate for every
      mile of the one-way tow distance beyond the standard included tow miles, the one-way tow distance being the
      distance recorded on the delivery appointment of the purchase the trade is applied to; it is rounded to the
      nearest cent. The included tow miles depend on the fulfillment method of that delivery appointment: a Kestrel
      Extended-Zone Delivery includes the extended-zone included miles, a Kestrel Local Home Delivery includes the
      local-delivery included miles, and any other method, or no delivery, includes the standard included tow
      miles. The per-mile tow rate depends on the one-way tow distance: a distance longer than the long-tow line
      miles is charged at the long-tow rate, a distance longer than the mid-tow line miles but not longer than the
      long-tow line miles at the mid-tow rate, and any shorter distance at the standard per-mile tow rate. The
      towing charge depends on how the tow was run against that delivery: when the delivery was completed and the
      vehicle was towed on a different day from the delivery's completed date, the truck made a trip of its own and
      the charge is the greater of the grade's towing fee and the per-mile tow rate for every mile of the round trip,
      twice the one-way tow distance, beyond the included tow miles; when the delivery was completed and the vehicle
      was towed on the delivery's completed date, the tow rode with the delivery run and the charge is the grade's
      towing fee alone; in every other case the charge is the grade's towing fee plus the per-mile tow rate for
      every mile of the one-way tow distance beyond the included tow miles; no count of miles falls below none. The
      hook surcharge depends on the weekday of the pickup date: a Sunday pickup adds the Sunday hook surcharge, a
      Saturday pickup adds the Saturday hook surcharge, and a pickup on any weekday from Monday to Friday adds none.
      The tow share depends on how the purchase the trade is applied to is carried: when it is paid through an
      active Kestrel Auto Finance contract and a KestrelCare service contract is written on it, the share is the
      financed-and-covered share; when it is paid through an active Kestrel Auto Finance contract and no KestrelCare
      service contract is written on it, the share is the financed share; otherwise the share is one. The towing
      deduction is the towing charge plus the hook surcharge, that sum multiplied once by the tow share and rounded
      to the nearest cent only at the end.
    prerequisite: []
    cross_category:
      - category: delivery
        as: branch
        reads: [delivery_orders.status, delivery_orders.distance_miles, delivery_orders.completed_date, delivery_orders.variant_name]
        note: The delivery appointment of the linked purchase gives the one-way tow distance, the trip pattern that selects how the towing charge is figured, the included miles and the distance band of the per-mile rate.
      - category: finance
        as: branch
        reads: [finance_contracts.status]
        note: An active Kestrel Auto Finance contract on the linked purchase enters the tow share.
      - category: warranty
        as: existence
        reads: [service_contracts.purchase_order_id]
        note: A KestrelCare service contract written on the linked purchase decides between the two tow shares.
    compute:
      - tow_one_way_miles: "CFIELD('delivery', 'distance_miles', purchase_order_id=F('purchase_order_id')) if EXISTS('delivery', purchase_order_id=F('purchase_order_id')) else 0"
      - tow_delivery_method: "CFIELD('delivery', 'variant_name', purchase_order_id=F('purchase_order_id'))"
      - tow_included_miles: "K('extended_zone_included_miles') if tow_delivery_method == 'Kestrel Extended-Zone Delivery' else (K('local_delivery_included_miles') if tow_delivery_method == 'Kestrel Local Home Delivery' else K('standard_included_miles'))"
      - tow_distance_band_miles: "CFIELD('delivery', 'distance_miles', purchase_order_id=F('purchase_order_id')) if EXISTS('delivery', purchase_order_id=F('purchase_order_id')) else 0"
      - tow_mile_rate: "K('long_tow_rate_usd') if tow_distance_band_miles > K('long_tow_line_miles') else (K('mid_tow_rate_usd') if tow_distance_band_miles > K('mid_tow_line_miles') else K('standard_tow_rate_usd'))"
      - tow_delivery_completed: "EXISTS('delivery', purchase_order_id=F('purchase_order_id'), status='completed')"
      - tow_trip_gap_days: "DAYS(CFIELD('delivery', 'completed_date', purchase_order_id=F('purchase_order_id')), F('pickup_date')) if tow_delivery_completed else 0"
      - towing_charge: "MX(P('towing_fee_usd'), MX(0, 2 * tow_one_way_miles - tow_included_miles) * tow_mile_rate) if (tow_delivery_completed and tow_trip_gap_days != 0) else (P('towing_fee_usd') if (tow_delivery_completed and tow_trip_gap_days == 0) else P('towing_fee_usd') + MX(0, tow_one_way_miles - tow_included_miles) * tow_mile_rate)"
      - tow_pickup_weekday: "DAYS('2024-01-01', F('pickup_date')) % 7"
      - tow_hook_surcharge: "K('sunday_hook_surcharge_usd') if tow_pickup_weekday == 6 else (K('saturday_hook_surcharge_usd') if tow_pickup_weekday == 5 else 0)"
      - tow_share: "K('financed_and_covered_share') if (CFIELD('finance', 'status', purchase_order_id=F('purchase_order_id')) == 'active' and EXISTS('warranty', purchase_order_id=F('purchase_order_id'))) else (K('financed_share') if (CFIELD('finance', 'status', purchase_order_id=F('purchase_order_id')) == 'active' and not EXISTS('warranty', purchase_order_id=F('purchase_order_id'))) else 1)"
      - result: "RND((towing_charge + tow_hook_surcharge) * tow_share, 2)"
    compute_basis:
      tow_one_way_miles: "the one-way tow distance being the distance recorded on the delivery appointment of the purchase the trade is applied to"
      tow_delivery_method: "The included tow miles depend on the fulfillment method of that delivery appointment"
      tow_included_miles: "a Kestrel Extended-Zone Delivery includes the extended-zone included miles, a Kestrel Local Home Delivery includes the local-delivery included miles, and any other method, or no delivery, includes the standard included tow miles."
      tow_distance_band_miles: "The per-mile tow rate depends on the one-way tow distance"
      tow_mile_rate: "a distance longer than the long-tow line miles is charged at the long-tow rate, a distance longer than the mid-tow line miles but not longer than the long-tow line miles at the mid-tow rate, and any shorter distance at the standard per-mile tow rate."
      tow_delivery_completed: "when the delivery was completed and the vehicle was towed on a different day from the delivery's completed date"
      tow_trip_gap_days: "The towing charge depends on how the tow was run against that delivery"
      towing_charge: "when the delivery was completed and the vehicle was towed on a different day from the delivery's completed date, the truck made a trip of its own and the charge is the greater of the grade's towing fee and the per-mile tow rate for every mile of the round trip, twice the one-way tow distance, beyond the included tow miles; when the delivery was completed and the vehicle was towed on the delivery's completed date, the tow rode with the delivery run and the charge is the grade's towing fee alone; in every other case the charge is the grade's towing fee plus the per-mile tow rate for every mile of the one-way tow distance beyond the included tow miles; no count of miles falls below none."
      tow_pickup_weekday: "The hook surcharge depends on the weekday of the pickup date"
      tow_hook_surcharge: "a Sunday pickup adds the Sunday hook surcharge, a Saturday pickup adds the Saturday hook surcharge, and a pickup on any weekday from Monday to Friday adds none."
      tow_share: "when it is paid through an active Kestrel Auto Finance contract and a KestrelCare service contract is written on it, the share is the financed-and-covered share; when it is paid through an active Kestrel Auto Finance contract and no KestrelCare service contract is written on it, the share is the financed share; otherwise the share is one."
      result: "The towing deduction is the towing charge plus the hook surcharge, that sum multiplied once by the tow share and rounded to the nearest cent only at the end."
    factors:
      - id: tow_trip_pattern
        effect: method
        decides: towing_charge
        bindings: [tow_delivery_completed, tow_trip_gap_days, towing_charge]
        ladder:
          - when: "the linked delivery was completed and the vehicle was towed on a different day from its completed date"
            method: "the greater of the grade's towing fee and the per-mile charge on the round trip beyond the included miles (minimum-or-mileage pricing of a trip of its own)"
          - when: "the linked delivery was completed and the vehicle was towed on its completed date"
            method: "the grade's towing fee alone, with no mileage charge (the tow rode with the delivery run)"
          - when: "otherwise"
            method: "the grade's towing fee plus the per-mile charge on the one-way distance beyond the included miles"
        baseline:
          towing_charge: "P('towing_fee_usd') + MX(0, tow_one_way_miles - tow_included_miles) * tow_mile_rate"
        evidence: [cross_category, date]
        cross_difficulty: null
      - id: tow_included_by_method
        effect: parameter
        decides: tow_included_miles
        bindings: [tow_delivery_method, tow_included_miles]
        ladder:
          - when: "the linked delivery is a Kestrel Extended-Zone Delivery"
            value: "K('extended_zone_included_miles')"
          - when: "the linked delivery is a Kestrel Local Home Delivery"
            value: "K('local_delivery_included_miles')"
          - when: "otherwise"
            value: "K('standard_included_miles')"
        baseline:
          tow_included_miles: "K('standard_included_miles')"
        evidence: [cross_category]
        cross_difficulty: null
      - id: tow_weekend_hook
        effect: parameter
        decides: tow_hook_surcharge
        bindings: [tow_pickup_weekday, tow_hook_surcharge]
        ladder:
          - when: "the pickup date is a Sunday"
            value: "K('sunday_hook_surcharge_usd')"
          - when: "the pickup date is a Saturday"
            value: "K('saturday_hook_surcharge_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          tow_hook_surcharge: "0"
        evidence: [date]
        cross_difficulty: null
      - id: tow_distance_rate
        effect: parameter
        decides: tow_mile_rate
        bindings: [tow_distance_band_miles, tow_mile_rate]
        ladder:
          - when: "the one-way tow distance is longer than the long-tow line miles"
            value: "K('long_tow_rate_usd')"
          - when: "it is longer than the mid-tow line miles but not longer than the long-tow line miles"
            value: "K('mid_tow_rate_usd')"
          - when: "otherwise"
            value: "K('standard_tow_rate_usd')"
        baseline:
          tow_mile_rate: "K('standard_tow_rate_usd')"
        evidence: [cross_category]
        cross_difficulty: null
      - id: tow_carry_share
        effect: parameter
        decides: tow_share
        bindings: [tow_share]
        ladder:
          - when: "the linked purchase is paid through an active Kestrel Auto Finance contract and carries a KestrelCare service contract"
            value: "K('financed_and_covered_share')"
          - when: "it is paid through an active Kestrel Auto Finance contract and carries no KestrelCare service contract"
            value: "K('financed_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          tow_share: "1"
        evidence: [cross_category]
        cross_difficulty: finance
    baseline:
      rule: >-
        The towing deduction is the grade's towing fee plus the standard per-mile tow rate for every mile of the
        one-way tow distance beyond the standard included tow miles, the one-way tow distance being the distance
        recorded on the delivery appointment of the purchase the trade is applied to; it is rounded to the nearest
        cent.
      params: [towing_fee_usd, standard_included_miles, standard_tow_rate_usd]
    inputs:
      history: []
      cross_category: [delivery, finance, warranty]

  - id: tradein_ext_title_delay_chargeback
    base_policy_refs: [tradein_title_receipt, tradein_pickup_inspection]
    overwrite:
      - base_policy: tradein_title_receipt
        superseded_clause: >-
          The chargeback is the grade's chargeback percentage of the value credited, deducted as a
          title_delay_chargeback entry;
        replaced_by: >-
          The title-delay chargeback is the chargeback basis times the chargeback percentage, divided by one hundred,
          times the title collateral share and the finance standing share, rounded to the nearest cent only once, at
          the end.
    trigger: state_due
    subject: [tradein_value_deducted]
    computes: chargeback_amount
    target_tool: post_title_delay_chargeback_a143df45
    params:
      prompt_payoff_days: 3
      early_stage_days: 52
      mid_stage_days: 75
      early_stage_pct: 40
      mid_stage_pct: 70
      registered_lien_share: 0.9
      pending_lien_share: 0.95
      autopay_track_installments: 2
      established_autopay_share: 0.85
      new_autopay_share: 0.95
    rule: >-
      A title-delay chargeback may be taken only after the title delay chargeback days counted from the pickup date
      have passed with no title received date. The chargeback period is counted in calendar days with the pickup
      date as day 0 and the chargeback is allowed from the day after its last day. It is booked on the picked-up
      trade-in agreement as one value deduction entry for the title-delay chargeback, dated the day it is booked,
      and it lowers the undistributed trade equity by its amount. The title-delay chargeback is the grade's title
      delay chargeback percentage of the value credited, the value credited being the total of the agreement's
      value-credited entries; it is rounded to the nearest cent. The chargeback clock depends on when the lien was
      actually paid off, counted in calendar days to the day the chargeback is booked: when the agreement's lien
      payoff entry is dated more than the prompt-payoff days after the pickup date, the clock runs from that payoff
      date; when the payoff entry is dated no more than the prompt-payoff days after the pickup date and the latest
      customer payment entry on the agreement is dated after the pickup date, the clock runs from that customer
      payment date; in every other case the clock runs from the pickup date. The chargeback percentage depends on
      that clock: a clock of no more than the early-stage days takes the early-stage percentage, a clock of more
      than the early-stage days but no more than the mid-stage days takes the mid-stage percentage, and a longer
      clock takes the grade's title delay chargeback percentage. The chargeback basis depends on what Kestrel paid
      out for the lien: when a lien payoff entry and at least one customer payment entry stand on the agreement, the
      basis is the total of the lien payoff entries less the total of the customer payment entries; when a lien
      payoff entry stands and no customer payment entry does, the basis is the lesser of the total of the lien
      payoff entries and the value credited; when no lien payoff entry stands, the basis is the value credited. The
      title collateral share depends on the title order of the purchase the trade is applied to: when that title
      order names Kestrel Auto Finance as lienholder and its status is registered or completed, the share is the
      registered-lien share; when it names Kestrel Auto Finance as lienholder and its status is neither registered
      nor completed, the share is the pending-lien share; otherwise the share is one. The finance standing share
      depends on the Kestrel Auto Finance contract of that purchase: when autopay is enrolled on it and at least
      the autopay track installments have been posted on it by autopay in the last twelve months, the share is the
      established-autopay share; when autopay is enrolled and fewer installments than that have been posted on it
      by autopay in the last twelve months, the share is the new-autopay share; otherwise the share is one. The title-delay chargeback is the chargeback basis times the
      chargeback percentage, divided by one hundred, times the title collateral share and the finance standing
      share, rounded to the nearest cent only once, at the end.
    prerequisite: []
    cross_category:
      - category: title
        as: branch
        reads: [title_orders.lienholder, title_orders.status]
        note: The lienholder and status of the title order on the linked purchase decide the title collateral share.
      - category: finance
        as: history
        reads: [finance_contracts.autopay_enrolled, finance_transactions.event_type, finance_transactions.payment_channel, finance_transactions.txn_date]
        note: Autopay on the linked purchase's Kestrel Auto Finance contract and the installments it has posted by autopay in the last twelve months decide the finance standing share.
    compute:
      - payoff_sent_date: "LATEST('tradein_transactions', 'txn_date', date_field='txn_date', event_type='tradein_lien_payoff_sent')"
      - payoff_lag_days: "DAYS(F('pickup_date'), payoff_sent_date) if payoff_sent_date else -1"
      - customer_cover_date: "LATEST('tradein_transactions', 'txn_date', date_field='txn_date', event_type='tradein_negative_equity_settled', settlement_method='customer_payment')"
      - chargeback_clock_start: "payoff_sent_date if payoff_lag_days > K('prompt_payoff_days') else (customer_cover_date if (payoff_lag_days >= 0 and payoff_lag_days <= K('prompt_payoff_days') and customer_cover_date and DAYS(F('pickup_date'), customer_cover_date) > 0) else F('pickup_date'))"
      - chargeback_clock_days: "DAYS(chargeback_clock_start, NOW)"
      - chargeback_pct: "K('early_stage_pct') if chargeback_clock_days <= K('early_stage_days') else (K('mid_stage_pct') if chargeback_clock_days <= K('mid_stage_days') else P('title_delay_chargeback_pct'))"
      - lien_payoff_total: "SUM('tradein_transactions', 'amount', event_type='tradein_lien_payoff_sent')"
      - customer_cover_total: "SUM('tradein_transactions', 'amount', event_type='tradein_negative_equity_settled', settlement_method='customer_payment')"
      - credited_value_total: "SUM('tradein_transactions', 'amount', event_type='tradein_value_credited')"
      - chargeback_basis: "lien_payoff_total - customer_cover_total if (lien_payoff_total > 0 and customer_cover_total > 0) else (MN(lien_payoff_total, credited_value_total) if lien_payoff_total > 0 else credited_value_total)"
      - linked_title_lienholder: "CFIELD('title', 'lienholder', purchase_order_id=F('purchase_order_id'))"
      - linked_title_status: "CFIELD('title', 'status', purchase_order_id=F('purchase_order_id'))"
      - title_collateral_share: "K('registered_lien_share') if (linked_title_lienholder == 'kestrel_auto_finance' and (linked_title_status == 'registered' or linked_title_status == 'completed')) else (K('pending_lien_share') if (linked_title_lienholder == 'kestrel_auto_finance' and not (linked_title_status == 'registered' or linked_title_status == 'completed')) else 1)"
      - autopay_installments_last_year: "XCOUNT('finance', 'finance_transactions', within_months=12, date_field='txn_date', event_type='finance_payment_posted', payment_channel='autopay_ach', finance_contract_id=CFIELD('finance', 'finance_contract_id', purchase_order_id=F('purchase_order_id')))"
      - finance_standing_share: "K('established_autopay_share') if (CFIELD('finance', 'autopay_enrolled', purchase_order_id=F('purchase_order_id')) == True and autopay_installments_last_year >= K('autopay_track_installments')) else (K('new_autopay_share') if (CFIELD('finance', 'autopay_enrolled', purchase_order_id=F('purchase_order_id')) == True and autopay_installments_last_year < K('autopay_track_installments')) else 1)"
      - result: "RND(chargeback_basis * chargeback_pct / 100 * title_collateral_share * finance_standing_share, 2)"
    compute_basis:
      payoff_sent_date: "when the agreement's lien payoff entry is dated more than the prompt-payoff days after the pickup date, the clock runs from that payoff date"
      payoff_lag_days: "when the agreement's lien payoff entry is dated more than the prompt-payoff days after the pickup date"
      customer_cover_date: "the latest customer payment entry on the agreement is dated after the pickup date, the clock runs from that customer payment date"
      chargeback_clock_days: "counted in calendar days to the day the chargeback is booked"
      chargeback_clock_start: "when the agreement's lien payoff entry is dated more than the prompt-payoff days after the pickup date, the clock runs from that payoff date; when the payoff entry is dated no more than the prompt-payoff days after the pickup date and the latest customer payment entry on the agreement is dated after the pickup date, the clock runs from that customer payment date; in every other case the clock runs from the pickup date."
      chargeback_pct: "a clock of no more than the early-stage days takes the early-stage percentage, a clock of more than the early-stage days but no more than the mid-stage days takes the mid-stage percentage, and a longer clock takes the grade's title delay chargeback percentage."
      lien_payoff_total: "the basis is the total of the lien payoff entries less the total of the customer payment entries"
      customer_cover_total: "the basis is the total of the lien payoff entries less the total of the customer payment entries"
      credited_value_total: "the value credited being the total of the agreement's value-credited entries"
      chargeback_basis: "when a lien payoff entry and at least one customer payment entry stand on the agreement, the basis is the total of the lien payoff entries less the total of the customer payment entries; when a lien payoff entry stands and no customer payment entry does, the basis is the lesser of the total of the lien payoff entries and the value credited; when no lien payoff entry stands, the basis is the value credited."
      linked_title_lienholder: "The title collateral share depends on the title order of the purchase the trade is applied to"
      linked_title_status: "The title collateral share depends on the title order of the purchase the trade is applied to"
      title_collateral_share: "when that title order names Kestrel Auto Finance as lienholder and its status is registered or completed, the share is the registered-lien share; when it names Kestrel Auto Finance as lienholder and its status is neither registered nor completed, the share is the pending-lien share; otherwise the share is one."
      autopay_installments_last_year: "at least the autopay track installments have been posted on it by autopay in the last twelve months"
      finance_standing_share: "when autopay is enrolled on it and at least the autopay track installments have been posted on it by autopay in the last twelve months, the share is the established-autopay share; when autopay is enrolled and fewer installments than that have been posted on it by autopay in the last twelve months, the share is the new-autopay share; otherwise the share is one."
      result: "The title-delay chargeback is the chargeback basis times the chargeback percentage, divided by one hundred, times the title collateral share and the finance standing share, rounded to the nearest cent only once, at the end."
    factors:
      - id: chargeback_clock_anchor
        effect: method
        decides: chargeback_clock_start
        bindings: [payoff_sent_date, payoff_lag_days, customer_cover_date, chargeback_clock_start]
        ladder:
          - when: "the lien payoff entry is dated more than the prompt-payoff days after the pickup date"
            method: "the clock runs from the payoff date"
          - when: "the payoff entry is dated no more than the prompt-payoff days after pickup and the latest customer payment entry is dated after the pickup date"
            method: "the clock runs from that customer payment date"
          - when: "otherwise"
            method: "the clock runs from the pickup date"
        baseline:
          chargeback_clock_start: "F('pickup_date')"
        evidence: [history, date]
        cross_difficulty: null
      - id: staged_percentage
        effect: parameter
        decides: chargeback_pct
        bindings: [chargeback_clock_days, chargeback_pct]
        ladder:
          - when: "the chargeback clock is no more than the early-stage days"
            value: "K('early_stage_pct')"
          - when: "the clock is more than the early-stage days but no more than the mid-stage days"
            value: "K('mid_stage_pct')"
          - when: "otherwise"
            value: "P('title_delay_chargeback_pct')"
        baseline:
          chargeback_pct: "P('title_delay_chargeback_pct')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: lien_outlay_basis
        effect: method
        decides: chargeback_basis
        bindings: [lien_payoff_total, customer_cover_total, credited_value_total, chargeback_basis]
        ladder:
          - when: "a lien payoff entry and at least one customer payment entry stand on the agreement"
            method: "the basis is the lien payoff total less the customer payment total"
          - when: "a lien payoff entry stands and no customer payment entry does"
            method: "the basis is the lesser of the lien payoff total and the value credited"
          - when: "otherwise"
            method: "the basis is the value credited"
        baseline:
          chargeback_basis: "credited_value_total"
        evidence: [history]
        cross_difficulty: null
      - id: title_collateral
        effect: parameter
        decides: title_collateral_share
        bindings: [linked_title_lienholder, linked_title_status, title_collateral_share]
        ladder:
          - when: "the linked purchase's title order names Kestrel Auto Finance as lienholder and is registered or completed"
            value: "K('registered_lien_share')"
          - when: "it names Kestrel Auto Finance as lienholder and is neither registered nor completed"
            value: "K('pending_lien_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          title_collateral_share: "1"
        evidence: [cross_category]
        cross_difficulty: title
      - id: finance_standing
        effect: parameter
        decides: finance_standing_share
        bindings: [autopay_installments_last_year, finance_standing_share]
        ladder:
          - when: "autopay is enrolled on the linked purchase's Kestrel Auto Finance contract and at least the autopay track installments were posted on it by autopay in the last twelve months"
            value: "K('established_autopay_share')"
          - when: "autopay is enrolled and fewer installments than that were posted by autopay in the last twelve months"
            value: "K('new_autopay_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          finance_standing_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: finance
    baseline:
      rule: >-
        The title-delay chargeback is the grade's title delay chargeback percentage of the value credited, the value
        credited being the total of the agreement's value-credited entries; it is rounded to the nearest cent.
      params: [title_delay_chargeback_pct]
    inputs:
      history:
        - {table: tradein_transactions, aggregate: sum, field: amount, filters: {event_type: tradein_lien_payoff_sent}}
        - {table: tradein_transactions, aggregate: sum, field: amount, filters: {event_type: tradein_negative_equity_settled, settlement_method: customer_payment}}
        - {category: finance, table: finance_transactions, aggregate: count, field: finance_txn_id, within_months: 12, filters: {event_type: finance_payment_posted, payment_channel: autopay_ach}}
      cross_category: [title, finance]

  - id: tradein_ext_chargeback_shortfall_installment
    base_policy_refs: [tradein_negative_equity, tradein_title_receipt]
    overwrite:
      - base_policy: tradein_title_receipt
        superseded_clause: >-
          and the customer then owes the resulting shortfall within the chargeback payment days.
        replaced_by: >-
          A customer who asks to spread the shortfall pays today's installment at once and the rest of the shortfall
          by the end of the chargeback payment days.
      - base_policy: tradein_negative_equity
        superseded_clause: >-
          A title-delay chargeback that leaves the equity negative is paid by the customer within the chargeback
          payment days.
        replaced_by: >-
          A customer who asks to spread the shortfall pays today's installment at once and the rest of the shortfall
          by the end of the chargeback payment days.
    trigger: on_request
    subject: [tradein_negative_equity_settled]
    computes: payment_amount
    target_tool: pay_chargeback_shortfall_4672c84f
    params:
      three_part_line_usd: 1200.00
      two_part_line_usd: 600.00
      late_posting_days: 30
      recent_posting_days: 7
      three_purchase_share: 0.8
      two_purchase_share: 0.9
      upper_tier_score: 700
      mid_tier_score: 620
      upper_tier_installment_share: 0.85
      mid_tier_installment_share: 0.92
    rule: >-
      When a title-delay chargeback leaves the undistributed trade equity of a picked-up trade-in agreement below
      zero, the customer pays the shortfall from their own funds by bank transfer within the chargeback payment
      days, each payment booked as one covering entry for a customer payment, dated the day it is paid, raising the
      undistributed trade equity by its amount. A customer who asks to spread the shortfall pays today's
      installment at once and the rest of the shortfall by the end of the chargeback payment days. Today's
      installment is fixed only after the agreement's ledger carries the title-delay chargeback owed once the title
      delay chargeback days have passed with no title received date. Today's installment is not worked out until
      the agreement's ledger carries the towing fee deduction owed for a vehicle Kestrel collected by tow truck. The
      amount paid today is the whole shortfall, figured from the agreement's ledger as the value-credited and
      covering entries less the deduction, lien payoff and distributed-equity entries, taken as a positive amount
      and never less than none, rounded to the nearest cent. The installment count depends on the size of that
      shortfall: a shortfall of at least the three-part line is spread over three installments, a shortfall of at
      least the two-part line but below the three-part line over two installments, and a smaller shortfall is paid
      in one. Which installment carries a towing fee depends on how late the towing fee deduction was posted, counted in calendar days from the pickup date to the posting date of the latest towing fee deduction entry: when that lag is longer than the late-posting days, the towing fee rides with the last installment and today's figure is the shortfall less the towing fee deductions, never less than none, divided by the installment count; when the lag is no longer than the recent-posting days, the towing fee is collected with today's installment and today's figure is the shortfall less the towing fee deductions, never less than none, divided by the installment count, plus the towing fee deductions up to the shortfall; in every other case, or with no towing fee on the ledger, today's figure is the shortfall divided evenly by the installment count. The repeat-buyer share depends on how many Kestrel
      vehicles the customer has bought, counted as the vehicle-price charges posted on the customer's Kestrel
      purchase orders: three or more take the three-purchase share, exactly two take the two-purchase share, and
      fewer take a share of one. The tier share depends on the credit tier of the Kestrel Auto Finance contract on
      the purchase the trade is applied to: a tier whose minimum credit score is at or above the upper tier score
      takes the upper-tier installment share, a tier whose minimum credit score is at or above the mid tier score
      but below the upper tier score takes the mid-tier installment share, and any lower tier, or no Kestrel Auto
      Finance contract, takes a share of one. Today's installment is today's figure multiplied by the repeat-buyer share and the tier share, rounded to the nearest cent only once, at the end; whatever of the shortfall it leaves is due by the end of the chargeback payment days.
    prerequisite:
      - problem: tradein_ext_title_delay_chargeback
        kind: value_input
        gate: shortfall_owed
        form: state
        policy_source: >-
          Today's installment is fixed only after the agreement's ledger carries the title-delay chargeback owed once
          the title delay chargeback days have passed with no title received date.
        condition: >-
          the trade-in ledger holds a value deduction entry for the title-delay chargeback whenever the title delay
          chargeback days counted from the pickup date have passed with no title received date
        resolved_by: post_title_delay_chargeback_a143df45
        effect: >-
          the chargeback lowers the undistributed trade equity and so raises the shortfall today's installment is
          figured from by the chargeback amount
      - problem: tradein_ext_towing_fee_deduction
        kind: value_input
        gate: shortfall_owed
        form: state
        policy_source: >-
          Today's installment is not worked out until the agreement's ledger carries the towing fee deduction owed
          for a vehicle Kestrel collected by tow truck.
        condition: >-
          the trade-in ledger holds a value deduction entry for the towing fee whenever the agreement's vehicle was
          collected by tow truck
        resolved_by: post_towing_fee_7cb58a13
        effect: >-
          the towing deduction raises the shortfall by its amount and dates the towing posting lag that decides which
          installment carries it
    cross_category:
      - category: purchase
        as: history
        reads: [purchase_transactions.event_type, purchase_transactions.charge_type]
        note: The count of vehicle-price charges on the customer's Kestrel purchase orders decides the repeat-buyer share.
      - category: finance
        as: branch
        reads: [variant.min_credit_score]
        note: The minimum credit score of the tier of the linked purchase's Kestrel Auto Finance contract decides the tier share.
    compute:
      - ledger_trade_equity: "SUM('tradein_transactions', 'amount', event_type='tradein_value_credited') + SUM('tradein_transactions', 'amount', event_type='tradein_negative_equity_settled') - SUM('tradein_transactions', 'amount', event_type='tradein_value_deducted') - SUM('tradein_transactions', 'amount', event_type='tradein_lien_payoff_sent') - SUM('tradein_transactions', 'amount', event_type='tradein_equity_applied') - SUM('tradein_transactions', 'amount', event_type='tradein_equity_paid_out')"
      - shortfall_owed: "MX(0, -ledger_trade_equity)"
      - installment_count: "3 if shortfall_owed >= K('three_part_line_usd') else (2 if shortfall_owed >= K('two_part_line_usd') else 1)"
      - towing_posting_lag: "DAYS(F('pickup_date'), LATEST('tradein_transactions', 'txn_date', date_field='txn_date', event_type='tradein_value_deducted', adjustment_type='towing_fee')) if COUNT('tradein_transactions', event_type='tradein_value_deducted', adjustment_type='towing_fee') > 0 else -1"
      - towing_fee_total: "SUM('tradein_transactions', 'amount', event_type='tradein_value_deducted', adjustment_type='towing_fee')"
      - todays_installment_figure: "MX(0, shortfall_owed - towing_fee_total) / installment_count if towing_posting_lag > K('late_posting_days') else (MX(0, shortfall_owed - towing_fee_total) / installment_count + MN(towing_fee_total, shortfall_owed) if (towing_posting_lag >= 0 and towing_posting_lag <= K('recent_posting_days')) else shortfall_owed / installment_count)"
      - kestrel_purchase_count: "XCOUNT('purchase', 'purchase_transactions', event_type='purchase_charge_posted', charge_type='vehicle_price')"
      - repeat_buyer_share: "K('three_purchase_share') if kestrel_purchase_count >= 3 else (K('two_purchase_share') if kestrel_purchase_count == 2 else 1)"
      - linked_tier_score: "CPARAM('finance', 'min_credit_score', purchase_order_id=F('purchase_order_id'))"
      - tier_installment_share: "K('upper_tier_installment_share') if (linked_tier_score and linked_tier_score >= K('upper_tier_score')) else (K('mid_tier_installment_share') if (linked_tier_score and linked_tier_score >= K('mid_tier_score')) else 1)"
      - result: "RND(todays_installment_figure * repeat_buyer_share * tier_installment_share, 2)"
    compute_basis:
      ledger_trade_equity: "figured from the agreement's ledger as the value-credited and covering entries less the deduction, lien payoff and distributed-equity entries"
      shortfall_owed: "taken as a positive amount and never less than none"
      installment_count: "a shortfall of at least the three-part line is spread over three installments, a shortfall of at least the two-part line but below the three-part line over two installments, and a smaller shortfall is paid in one."
      towing_posting_lag: "counted in calendar days from the pickup date to the posting date of the latest towing fee deduction entry"
      towing_fee_total: "today's figure is the shortfall less the towing fee deductions"
      todays_installment_figure: "when that lag is longer than the late-posting days, the towing fee rides with the last installment and today's figure is the shortfall less the towing fee deductions, never less than none, divided by the installment count; when the lag is no longer than the recent-posting days, the towing fee is collected with today's installment and today's figure is the shortfall less the towing fee deductions, never less than none, divided by the installment count, plus the towing fee deductions up to the shortfall; in every other case, or with no towing fee on the ledger, today's figure is the shortfall divided evenly by the installment count."
      kestrel_purchase_count: "counted as the vehicle-price charges posted on the customer's Kestrel purchase orders"
      repeat_buyer_share: "three or more take the three-purchase share, exactly two take the two-purchase share, and fewer take a share of one."
      linked_tier_score: "The tier share depends on the credit tier of the Kestrel Auto Finance contract on the purchase the trade is applied to"
      tier_installment_share: "a tier whose minimum credit score is at or above the upper tier score takes the upper-tier installment share, a tier whose minimum credit score is at or above the mid tier score but below the upper tier score takes the mid-tier installment share, and any lower tier, or no Kestrel Auto Finance contract, takes a share of one."
      result: "Today's installment is today's figure multiplied by the repeat-buyer share and the tier share, rounded to the nearest cent only once, at the end"
    factors:
      - id: installment_count_by_size
        effect: parameter
        decides: installment_count
        bindings: [ledger_trade_equity, shortfall_owed, installment_count]
        ladder:
          - when: "the shortfall is at least the three-part line"
            value: "3"
          - when: "the shortfall is at least the two-part line but below the three-part line"
            value: "2"
          - when: "otherwise"
            value: "1"
        baseline:
          installment_count: "1"
        evidence: [history]
        cross_difficulty: null
      - id: towing_installment_placement
        effect: method
        decides: todays_installment_figure
        bindings: [towing_posting_lag, towing_fee_total, todays_installment_figure]
        ladder:
          - when: "the latest towing fee deduction posted more than the late-posting days after the pickup date"
            method: "the towing fee rides with the last installment: today's figure is the shortfall less the towing fee, divided by the installment count"
          - when: "it posted no more than the recent-posting days after the pickup date"
            method: "the towing fee is collected with today's installment: the shortfall less the towing fee divided by the installment count, plus the towing fee"
          - when: "otherwise"
            method: "the shortfall is divided evenly by the installment count"
        baseline:
          todays_installment_figure: "shortfall_owed / installment_count"
        evidence: [history, date]
        cross_difficulty: null
      - id: repeat_buyer
        effect: parameter
        decides: repeat_buyer_share
        bindings: [kestrel_purchase_count, repeat_buyer_share]
        ladder:
          - when: "three or more vehicle-price charges stand on the customer's Kestrel purchase orders"
            value: "K('three_purchase_share')"
          - when: "exactly two stand"
            value: "K('two_purchase_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          repeat_buyer_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: purchase
      - id: finance_tier_installment
        effect: parameter
        decides: tier_installment_share
        bindings: [linked_tier_score, tier_installment_share]
        ladder:
          - when: "the linked purchase's Kestrel Auto Finance tier has a minimum credit score at or above the upper tier score"
            value: "K('upper_tier_installment_share')"
          - when: "its minimum credit score is at or above the mid tier score but below the upper tier score"
            value: "K('mid_tier_installment_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          tier_installment_share: "1"
        evidence: [cross_category, tier_param]
        cross_difficulty: finance
    baseline:
      rule: >-
        The amount paid today is the whole shortfall, figured from the agreement's ledger as the value-credited and
        covering entries less the deduction, lien payoff and distributed-equity entries, taken as a positive amount
        and never less than none, rounded to the nearest cent.
      params: []
    inputs:
      history:
        - {table: tradein_transactions, aggregate: sum, field: amount, filters: {event_type: tradein_value_deducted}}
        - {table: tradein_transactions, aggregate: latest, field: txn_date, filters: {event_type: tradein_value_deducted, adjustment_type: towing_fee}}
        - {category: purchase, table: purchase_transactions, aggregate: count, field: purchase_txn_id, filters: {event_type: purchase_charge_posted, charge_type: vehicle_price}}
      cross_category: [purchase, finance]
