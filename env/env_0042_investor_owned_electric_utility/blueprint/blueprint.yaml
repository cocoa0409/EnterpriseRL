name: env_0042_investor_owned_electric_utility
company: Lakeshore Power & Light Company

background: |
  Lakeshore Power & Light Company is an investor-owned electric utility regulated by the state Public Utilities Commission, delivering electricity to about 1.4 million homes and businesses across the lakeshore counties and inland towns of its Midwestern service territory. Its customer care center answers calls from residential households and from business customers ranging from corner stores to factories, in a plain, patient tone that explains tariffs in everyday language. Every customer holds one or more Electric Service Agreements, one per service address, each billed monthly under a rate schedule: Schedule RS Residential Standard Service, Schedule RT Residential Time-of-Use Service, Schedule REV Residential Electric Vehicle Time-of-Use Service, Schedule GS Small General Service, Schedule GST Small General Time-of-Use Service, Schedule GD Medium General Demand Service or Schedule LP Large Power Service. Each agreement books a stream of metered usage bills, fees, payments and credits, and carries the disconnection notices, disconnections, reconnections and outage records of its address. Customers who fall behind may hold a Payment Arrangement on an agreement: a Payment Extension, Short-Term Installment Plan, Standard Deferred Payment Agreement, Extended Deferred Payment Agreement, Winter Protection Plan, Arrearage Management Program or Commercial Deferred Payment Agreement, each recording arrears deferred, installments billed or forgiven, and missed installments. Security Deposits are held against agreements as a Residential New Service Deposit, Residential Reestablishment Deposit, Residential Unauthorized Use Deposit, Small Commercial Service Deposit, Medium Commercial Service Deposit or Large Power Service Deposit, with their payments, interest, refunds and applications to final bills. Metering Service records the meter at each address — a Non-Communicating Opt-Out Meter, Standard AMI Smart Meter, AMI Bidirectional Net Meter, AMI Three-Phase Commercial Meter, AMI Interval Demand Meter or Primary Metering Installation — together with its readings, accuracy tests, billing adjustments, metering fees and field investigations. Rooftop solar and other customer generation is interconnected under Net Energy Metering riders: Rider NEM-L Legacy Net Energy Metering, Rider NEM-R Residential Net Energy Metering, Rider NBT-R Residential Net Billing Tariff, Rider NBT-C Commercial Net Billing Tariff, Rider NEM-A Aggregated Net Energy Metering and Rider NBT-L Large Customer Net Billing Tariff, each banking monthly export credits that are applied to bills and settled at an annual true-up. Budget Billing lets customers smooth their bills through the Residential Levelized Billing Plan, Residential Budget Billing Plan, Residential FlatBill Plan, Commercial Levelized Billing Plan, Commercial Budget Billing Plan or Small Business FlatBill Plan, which defer and recover the difference between actual charges and the installment. Medical and Life-Support Protections register a Medical Emergency Certificate, Standard Medical Baseline Allowance, Heating and Cooling Medical Baseline Allowance, Combined Medical Baseline Allowance, Life-Support Registration or Critical Care Life-Support Registration on a household's agreement, with postponements, allowances applied to bills and outage notifications. Demand Response Programs — Peak Time Rebate, Smart Thermostat Rewards, AC Cycling Program, Home Battery Dispatch, Commercial Capacity Bidding Program and Base Interruptible Program — record event participation, incentives earned and paid, and penalties. A typical residential caller holds one service agreement with a smart meter and perhaps a budget plan, a deposit from when service began, or a solar system on the roof, and brings a year or more of bills and payments, sometimes with late charges, notices or an arrangement in the history. Business callers often hold several agreements at different sites, larger deposits, demand-metered schedules and occasionally a capacity program or a net billing system. Many households calling about a disconnection notice also carry a medical protection, an income qualification on file, an electric-heat home in winter, or a previous arrangement that did not hold, and moving customers bring closed agreements whose final balances, deposits and credits follow them to the new address.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: service_billing_and_collections
    claim:
      categories: [service]
      event_types: [service_late_payment_charge, service_billing_credit, service_outage_credit, service_reconnection, service_reconnection_charge, service_notice_rescission, service_rate_change, service_stop, service_credit_refund, service_program_debit, service_program_credit]
    summary: >
      Residential and business customers call about their Electric Service Agreements: a late payment charge
      they believe is unfair, a disconnection notice they want stopped, service that has already been cut off
      and must be restored, a long outage they want credited, a switch between flat and time-of-use schedules,
      a stop-service request after a move, or a credit balance left on a closed account. The setting varies by
      rate schedule (residential, time-of-use, EV, small, demand and large power schedules carry different fees,
      grace periods, notice lengths, reconnection charges and outage credit ladders), by agreement status
      (active, notice pending, disconnected, closed), by holding combination (a medical protection, an active
      payment arrangement, a budget plan, an opt-out meter without a remote switch, a deposit, other agreements
      with unpaid final balances) and by the account's bill, payment, notice and outage history. The records
      involved are the agreement, its bills, charges, payments and credits, notices, outage records and stop
      orders, plus the customer profile's income qualification and the meter, medical and arrangement records
      that other programs keep; the governing rules are state gates on the agreement status, time windows
      anchored on due dates, restoration dates, notice dates and schedule effective dates, per-schedule
      amounts and ladders (service_late_payment_charge_rule, service_late_charge_courtesy_waiver,
      service_reconnection_rule, service_outage_credit_rule, service_chronic_outage_credit,
      service_rate_schedule_change, service_tou_bill_protection), protections that suspend disconnection
      (service_disconnection_protections, service_disconnection_notice_rule), and the way balances follow the
      customer across agreements (service_agg_prior_balance_transfer, service_stop_and_final_bill). In the
      domain's natural order a bill is issued, falls due, may be charged late, may lead to a written notice and
      a disconnection, and is cured by payment or a protection before reconnection, while closures produce a
      final bill and possibly a refund. Waivers, credits, rescissions, schedule changes and reconnection orders
      are agent service actions after identity verification, while stopping service or cancelling a start is
      the customer's own confirmation of an order the agent records. Requests no rule decides — disputing an
      outage that has no record, contesting a disconnection itself as wrongful, asking for a partial late-charge
      waiver or for credits beyond the published ladders — leave the agent no route but a POLICY_NOT_COVERED
      handoff.

  - name: payment_arrangements
    claim:
      categories: [arrangement]
      event_types: [arrangement_enrollment, arrangement_reinstatement, arrangement_renegotiation, arrangement_account_transfer, arrangement_arrears_deferral]
    summary: >
      Customers who are behind on their electric bills call to set up a payment arrangement, to get a defaulted
      arrangement reinstated, to stretch an existing one after a change in circumstances, or to keep their plan
      when they move. Situations differ by customer class and by which of the seven arrangement kinds fits:
      a one-time Payment Extension, residential installment plans of different lengths and down payments, an
      extended plan reserved for medical or income hardship with budget billing in place, a winter plan for
      electric-heat seniors or income-qualified households, an arrearage forgiveness program for income-qualified
      customers with aged arrears, and a commercial plan; they also differ by whether the service agreement is
      active, under notice or already disconnected, by prior defaults and completions anywhere in the customer's
      history, and by medical protections that lengthen cure periods. The records involved are the arrangement
      and its ledger, the service agreement with its bills, payments and status, the customer profile's income
      qualification and date of birth, and the budget plan and medical protection records on the same agreement;
      the governing rules are eligibility gates and lockouts (arrangement_enrollment_eligibility,
      arrangement_agg_multi_holding), per-kind down payment, installment and minimum-installment calculations
      with disconnection overrides and income waivers (arrangement_terms_calculation), down payment timing
      (arrangement_activation_rule), cure, default and reinstatement windows (arrangement_default_and_cure,
      arrangement_reinstatement_rule), forgiveness and its customer-wide cap (arrangement_amp_forgiveness,
      arrangement_agg_forgiveness_cap), renegotiation and move rules (arrangement_renegotiation_rule,
      arrangement_transfer_on_move) and the interactions with budget billing, deposits and disconnection
      (arrangement_program_interactions). In the domain's natural order arrears build on the service agreement,
      the customer accepts terms, a down payment activates the plan and defers the arrears, and installments are
      billed or forgiven until the plan completes or defaults. Explaining terms, checking eligibility and
      recording reinstatements or moves are agent actions after verification, while accepting an arrangement or
      choosing a new installment count is the customer's own commitment, handed over as a customer action.
      Requests beyond the agent's approval limit, arrangements on another person's account, settling arrears
      for less than owed, or forgiveness outside the program leave only a POLICY_NOT_COVERED handoff.

  - name: security_deposits
    claim:
      categories: [deposit]
      event_types: [deposit_assessment, deposit_waiver, deposit_payment, deposit_full_security, deposit_refund_completion, deposit_refund, deposit_review_update, deposit_transfer]
    summary: >
      Customers call when a deposit appears on a new account, when they are told a deposit is needed to restore
      service after a disconnection, when they believe they qualify for a waiver, when they want their deposit
      back after a year or more of paying on time, or when they move and ask what happens to the money held. The
      setting turns on the deposit kind (new service, reestablishment, unauthorized use, and three business
      sizes with different multiples, minimums, maximums, installment counts, review periods and accepted
      instruments), the deposit's status (assessed, held, waived, refunded, applied, cancelled), the customer's
      payment record on every agreement they hold, and holdings elsewhere such as an income qualification, a
      medical protection, a prior Lakeshore account or a confirmed tampering finding. The records involved are
      the deposit and its transactions, the secured service agreement's bills, late charges, returned payments
      and reconnection charges, the customer profile's age and income qualification, and the medical and meter
      records that can create or waive a deposit; the governing rules are trigger windows and the average-bill
      formula (deposit_assessment_rule), waiver bases and their request window (deposit_waiver_rule),
      installments and alternative security (deposit_installments_and_security), simple interest
      (deposit_interest_rule), the satisfactory-payment review with its per-kind limits and customer-wide
      disconnection test (deposit_refund_review, deposit_agg_customer_history), recalculation of business
      deposits (deposit_recalculation) and application at closure or transfer on a move
      (deposit_closure_application, deposit_transfer_rule). In the domain's natural order a trigger occurs, the
      deposit is assessed and paid in installments until held, interest accrues, and a review either refunds it
      or extends it, unless closure applies it to the final bill first. Assessing, waiving, refunding and moving
      deposits are agent actions after verification, while paying a deposit installment or electing a check
      instead of a bill credit is the customer's own act. Disputes of a tampering finding, requests to waive kinds
      an agent may not waive, deposits for another person's account and requests for interest beyond the
      statutory rate fall outside the rules and go to a human representative as POLICY_NOT_COVERED.

  - name: meter_testing_and_metering
    claim:
      categories: [meter]
      event_types: [meter_test_request, meter_test_fee, meter_accuracy_adjustment, meter_installation_order, meter_order_cancellation, meter_opt_out_setup_fee, meter_opt_out_monthly_fee]
    summary: >
      Customers who think their bills are too high call to have their meter tested, to understand a test result
      and any refund or backbill that followed, to dispute a repeat test fee, to opt out of a smart meter or return
      to one, or to ask why their bills keep being estimated. The setting varies by meter type (opt-out, standard
      smart, bidirectional net, three-phase commercial, interval demand and primary metering installations carry
      different tolerances, test fees, refund and backbill limits, read methods and capabilities), by the
      installation's status, by the agreement's test history across meter exchanges, by the agreement's schedule
      and any net metering, and by the bills that fall inside an adjustment period. The records involved are the
      meter installation, its readings, test requests and results, adjustments, metering charges and field
      orders, together with the service agreement's bills and schedule and the customer's income qualification;
      the governing rules are the agreement-wide free-test allowance and repeat fee (meter_agg_agreement_test_allowance,
      meter_test_fee_rule), request, scheduling and referee windows (meter_test_request_rule), tolerance classes
      (meter_test_result_rule), the adjustment period, charges corrected and thresholds per meter type
      (meter_accuracy_adjustment_rule), estimation limits (meter_reading_and_estimation), opt-out eligibility and
      fees (meter_opt_out_rule) and capability requirements for schedules and net metering
      (meter_installation_lifecycle). In the domain's natural order a test is requested, scheduled and performed,
      its result classifies the meter, and an out-of-tolerance meter is replaced and the affected bills refunded or
      backbilled, while an accurate meter may carry a fee. Requesting and recording tests, adjustments and orders
      are agent service actions after verification, while electing to opt out of a smart meter is the customer's
      own choice handed over as a customer action. Requests for refunds beyond the published lookback, disputes of
      tampering findings, demands to test a neighbor's meter or claims of health effects from smart meters are not
      decided by any rule and call for a POLICY_NOT_COVERED handoff.

  - name: net_energy_metering
    claim:
      categories: [nem]
      event_types: [nem_application, nem_application_fee, nem_withdrawal, nem_system_modification, nem_ownership_transfer, nem_termination, nem_true_up_payout, nem_true_up_forfeiture]
    summary: >
      Customers with rooftop solar, small wind or paired batteries call to apply for interconnection, to ask why
      an application stalled or expired, to enlarge or add storage to an operating system, to hand the agreement to
      the buyer of their home, to end the agreement, or to understand what happened to their banked credits at the
      annual true-up. The setting differs by rider (a closed legacy rider with retail credit, the residential
      successor rider net of a non-bypassable charge, residential and commercial net billing at avoided-cost export
      rates, aggregated metering across a farm or campus, and a large-customer tariff), each with its own size
      limits, fees, review timelines, grid access charges, true-up and termination dispositions; it differs too by
      the agreement's status, the address's usage history, the meter in service, and whether the customer holds
      budget billing or a battery program. The records involved are the net metering agreement and its ledger, the
      service agreement's bills and schedule, the meter installation at the address and the customer's other
      agreements for aggregation; the governing rules are application eligibility and the size cap
      (nem_application_eligibility, nem_agg_multi_holding), application fees (nem_application_fee_rule), review and
      permission-to-operate validity (nem_review_and_permission), export credit valuation and application to bills
      (nem_export_credit_calculation, nem_credit_application_rule, nem_agg_aggregated_allocation), true-up and
      termination settlement (nem_true_up_rule), grid access charges (nem_grid_access_charge_rule) and modification,
      sale and termination (nem_modification_transfer_termination, nem_program_interactions). In the domain's natural
      order an application is filed and charged, reviewed, approved and given permission to operate once a
      bidirectional meter is in place, after which credits are banked monthly and settled each year or at
      termination. Filing, modifying and transferring agreements and settling banks are agent actions after
      verification, while withdrawing an application or terminating the agreement is the customer's own decision.
      Requests to join the closed legacy rider, to transfer credits to another customer, to be paid retail value
      under an avoided-cost rider, or to override a rejection for hosting capacity are outside every rule and lead
      to a POLICY_NOT_COVERED handoff.
