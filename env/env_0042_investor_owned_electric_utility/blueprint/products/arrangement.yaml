# Payment Arrangement — a written or recorded agreement that moves past-due electric charges of
# one service agreement out of the collectible balance and repays them in installments billed on
# later bills (or, for the Arrearage Management Program, forgives them as current bills are paid).

category: arrangement
display_name: Payment Arrangement

binding:
  holding_table: arrangement_plans
  event_tables: [arrangement_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {remaining_balance: arrangement_balance}

lifecycle:
  states: [pending_down_payment, active, completed, defaulted, cancelled]
  transitions:
    - {from: pending_down_payment, to: active, by: system, means: The down payment is received by its due date, or none is required, and the arrears are deferred into the plan.}
    - {from: pending_down_payment, to: cancelled, by: system, means: The down payment was not received by its due date and the plan lapses.}
    - {from: active, to: completed, by: system, means: Every installment has been billed and paid, forgiven, or paid off early.}
    - {from: active, to: defaulted, by: system, means: Missed installments reached the plan's default count after the cure period.}
    - {from: defaulted, to: active, by: agent, means: A defaulted plan is reinstated after the customer pays every missed installment within the reinstatement window.}
    - {from: active, to: cancelled, by: system, means: The service agreement closed and the plan could not move to a new agreement.}

accounts:
  - key: arrangement_balance
    unit: USD
    meaning: Deferred arrears still held under the plan — placed in at activation or reinstatement, and taken out as installments are billed, forgiven or the balance is returned to the service agreement.

parameter_schema:
  min_past_due_usd: Smallest eligible balance that may be placed under the plan, USD.
  max_past_due_usd: Largest eligible balance the plan accepts, USD.
  min_arrears_age_days: Minimum days the oldest unpaid bill must be past its due date at enrollment; 0 means no minimum age.
  min_service_months: Minimum months since the service agreement's start date at enrollment; 0 means no minimum.
  max_enrollments_per_12_months: Plans of this kind that may be enrolled on the same service agreement within any rolling 12 months.
  default_lockout_months: Months after a default during which no plan other than a Payment Extension may be enrolled for the customer.
  enrollment_window: Calendar window in which enrollment is accepted (MM-DD through MM-DD) or any time.
  self_service_enrollment_allowed: Whether the customer may enroll through online self-service without an agent (true/false).
  agent_approval_max_deferred_usd: Largest deferred amount a customer care agent may approve; larger requests go to the credit department, USD.
  senior_age_min: Minimum age of the residential account holder for the senior basis of eligibility; 0 means no senior basis.
  requires_income_qualification: Whether a current income qualification is required to enroll (true/false).
  requires_hardship_basis: Whether enrollment requires either an active medical certification on the agreement or a current income qualification (true/false).
  requires_budget_billing: Whether an active budget billing plan on the same service agreement is required to enroll (true/false).
  requires_electric_space_heating: Whether the service agreement must have electric space heating (true/false).
  eligible_balance_basis: Balance placed under the plan, enum past_due_balance (bills past their due date and charges) or total_balance (the whole account balance).
  available_after_disconnection: Whether the plan may be enrolled on a disconnected service agreement (true/false).
  down_payment_pct: Down payment as a fraction of the eligible balance on a connected agreement, decimal fraction.
  post_disconnection_down_payment_pct: Down payment fraction that replaces down_payment_pct when the agreement is disconnected at enrollment, decimal fraction.
  down_payment_min_usd: Minimum down payment when a down payment applies, USD (never more than the eligible balance).
  down_payment_due_days: Calendar days after enrollment by which the down payment must be received; 0 means no down payment phase.
  down_payment_waived_income_qualified: Whether the down payment is waived when the customer's income qualification is current at enrollment (true/false).
  assistance_pledge_counts_toward_down_payment: Whether a payment from an energy assistance agency counts toward the down payment (true/false).
  installment_count_min: Fewest installments the customer may choose.
  installment_count_max: Most installments the customer may choose on a connected agreement.
  installment_count_after_disconnection_max: Most installments the customer may choose when the agreement is disconnected at enrollment.
  minimum_installment_usd: Smallest installment; the installment count is reduced until each installment reaches it, USD.
  installment_start_rule: Which bill carries the first installment.
  installment_due_basis: When each installment falls due.
  installment_rounding_rule: How the deferred amount is split into installments.
  installment_tolerance_usd: Shortfall on an installment that is still treated as paid, USD.
  extension_max_days: Most calendar days by which a Payment Extension may move the due date of the past-due balance; 0 for installment plans.
  current_bill_payment_required: Whether each current bill must also be paid by its due date while the plan is active (true/false).
  missed_installments_to_default: Number of missed installments, counted after the cure period, that defaults the plan.
  cure_period_days: Calendar days after an installment's due date within which paying it prevents it from counting as missed.
  medical_cure_extension_days: Extra cure days granted while a medical certification on the agreement is active.
  reinstatement_allowed_count: Times a defaulted plan may be reinstated.
  reinstatement_window_days: Calendar days after the default within which reinstatement may be requested; 0 when reinstatement is not offered.
  reinstatement_missed_payment_pct: Fraction of all missed installments that must be paid before reinstatement; 0 when reinstatement is not offered.
  default_balance_handling: What happens to the remaining plan balance on default.
  forgiveness_share_per_installment: Fraction of each scheduled installment forgiven, instead of billed, when the current bill is paid in full by its due date; 0 for repayment plans.
  forgiveness_posting_rule: When forgiveness is posted.
  forgiveness_cap_per_customer_usd: Lifetime ceiling on arrears forgiven across all of a customer's plans of this kind, USD; 0 for repayment plans.
  forgiveness_catch_up_allowed: Whether forgiveness withheld for a late current bill is restored once that bill is paid in full (true/false).
  completion_cooldown_months: Months after completing this plan before the customer may enroll in it again; 0 means none.
  early_payoff_allowed: Whether the customer may pay the remaining plan balance at any time to complete the plan (true/false).
  renegotiation_allowed_count: Times the installment count of an active plan may be changed for a change in circumstances.
  renegotiation_max_total_installments: Ceiling on the total installment count after renegotiation; 0 when renegotiation is not offered.
  transfer_on_move_allowed: Whether the plan moves with the customer to a new service agreement when the current one closes (true/false).
  max_active_plans_per_account: Plans that may be open (pending_down_payment, active or defaulted) at once on one service agreement.

