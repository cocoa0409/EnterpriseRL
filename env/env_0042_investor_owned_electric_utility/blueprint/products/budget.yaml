events:
  # ---- holding (budget_plans) -------------------------------------------------------
  - type: budget_enrollment
    target: budget_plans
    mutation: create
    meaning: The customer enrolls a service agreement in a budget billing plan.
    grain: One row per enrollment.
    fields:
      customer_id: Customer of record on the service agreement.
      service_account_id: Service agreement enrolled.
      variant_name: Plan, official full name.
      enrolled_date: Date of enrollment.
      installment_amount: Plan installment computed at enrollment.
      predicted_annual_kwh: Predicted 12-month usage behind a FlatBill amount; 0 for other plans.
      next_review_date: Date of the first scheduled review.
      term_end_date: Last day of the FlatBill term; empty for other plans.
      status_date: Date of enrollment.
    triggers: []
  - type: budget_activation
    target: budget_plans
    mutation: {transition: {from: enrolled, to: active}}
    meaning: The first bill carrying the plan installment is issued.
    grain: One row per transaction.
    fields:
      status_date: Bill date of the first plan bill.
    triggers: []
  - type: budget_installment_review
    target: budget_plans
    mutation: update
    meaning: The plan installment is reviewed and reset, or a FlatBill is repriced or renewed.
    grain: One row per transaction.
    fields:
      installment_amount: New installment.
      next_review_date: Date of the next scheduled review.
      term_end_date: New FlatBill term end after a renewal; unchanged otherwise.
      predicted_annual_kwh: New predicted usage after a FlatBill renewal or repricing; unchanged otherwise.
    triggers: []
  - type: budget_removal
    target: budget_plans
    mutation: {transition: {from: active, to: removed}}
    meaning: The plan is ended because installments were missed.
    grain: One row per transaction.
    fields:
      status_date: Date of removal.
    triggers: []
  - type: budget_withdrawal
    target: budget_plans
    mutation: {transition: [{from: enrolled, to: withdrawn}, {from: active, to: withdrawn}]}
    meaning: The customer leaves the plan.
    grain: One row per transaction.
    fields:
      status_date: Date the withdrawal takes effect.
    triggers: []
  - type: budget_plan_closure
    target: budget_plans
    mutation: {transition: {from: active, to: closed}}
    meaning: The plan ends because its service agreement closed.
    grain: One row per transaction.
    fields:
      status_date: Stop date of the service agreement.
    triggers: []
  # ---- ledger (budget_ledger) -----------------------------------------------------------
  - type: budget_deferral
    target: budget_ledger
    meaning: Actual charges of a bill above the plan installment are deferred off the collectible balance.
    grain: One row per bill whose actual charges exceed the installment.
    distinguish_by: [bill_id]
    fields:
      posting_date: Bill date.
      bill_id: The service bill compared with the installment.
      amount: Actual charges less the installment.
    account: budget_deferred_balance
    direction: in
    triggers:
      - event: service:service_program_credit
        map: {posting_date: posting_date, amount: amount, credit_code: budget_deferral, source_reference_id: budget_ledger_id}
  - type: budget_recovery
    target: budget_ledger
    meaning: The plan installment above a bill's actual charges is billed to recover deferred charges.
    grain: One row per bill whose actual charges are below the installment.
    distinguish_by: [bill_id]
    fields:
      posting_date: Bill date.
      bill_id: The service bill compared with the installment.
      amount: Installment less actual charges.
    account: budget_deferred_balance
    direction: out
    triggers:
      - event: service:service_program_debit
        map: {posting_date: posting_date, amount: amount, charge_code: budget_recovery, source_reference_id: budget_ledger_id}
  - type: budget_settle_up_billing
    target: budget_ledger
    meaning: A positive deferred balance is billed at the annual settle-up or when the plan ends.
    grain: One row per settlement.
    distinguish_by: [settle_kind, posting_date]
    fields:
      posting_date: Bill date of the bill carrying the settlement.
      settle_kind: Why the balance was settled.
      amount: Deferred balance billed.
    account: budget_deferred_balance
    direction: out
    triggers:
      - event: service:service_program_debit
        map: {posting_date: posting_date, amount: amount, charge_code: budget_settle_up, source_reference_id: budget_ledger_id}
  - type: budget_settle_up_credit
    target: budget_ledger
    meaning: A negative deferred balance is credited at the annual settle-up or when the plan ends.
    grain: One row per settlement.
    distinguish_by: [settle_kind, posting_date]
    fields:
      posting_date: Bill date of the bill carrying the settlement.
      settle_kind: Why the balance was settled.
      amount: Deferred credit returned, absolute value.
    account: budget_deferred_balance
    direction: in
    triggers:
      - event: service:service_program_credit
        map: {posting_date: posting_date, amount: amount, credit_code: budget_settle_up_credit, source_reference_id: budget_ledger_id}
  - type: budget_closeout_absorbed
    target: budget_ledger
    meaning: A positive FlatBill balance at the term end is absorbed by the company.
    grain: One row per FlatBill term ended with a positive balance.
    distinguish_by: [posting_date]
    fields:
      posting_date: Term end date.
      amount: Balance absorbed.
    account: budget_deferred_balance
    direction: out
    triggers: []
  - type: budget_closeout_retained
    target: budget_ledger
    meaning: A negative FlatBill balance at the term end is retained by the company.
    grain: One row per FlatBill term ended with a negative balance.
    distinguish_by: [posting_date]
    fields:
      posting_date: Term end date.
      amount: Balance retained, absolute value.
    account: budget_deferred_balance
    direction: in
    triggers: []
  - type: budget_missed_installment
    target: budget_ledger
    meaning: A plan installment is recorded as missed after its grace period.
    grain: One row per bill whose installment was missed.
    distinguish_by: [bill_id]
    fields:
      posting_date: Day after the grace period ended.
      bill_id: The service bill whose installment was missed.
      amount: Unpaid part of the installment.
    triggers: []

measures:
  - id: budget_msr_average_actual_12
    window: The 12 most recent regular service bills of the agreement before the review or enrollment date.
    measure: Mean of their amount rounded to the cent; with fewer than min_history_for_actual_basis_months bills, new_premise_estimate_basis applies instead.
  - id: budget_msr_missed_installments
    window: The plan's whole life.
    measure: Count of budget_missed_installment rows on the plan.
  - id: budget_msr_flat_breaches
    window: The plan's regular bills in the current FlatBill term, most recent first.
    measure: Number of consecutive most recent bills whose kwh_total exceeded predicted_annual_kwh divided by 12 times one plus flat_usage_band_pct.
  - id: budget_msr_customer_removals
    window: The reenrollment_lockout_months_after_removal months ending on the handling date.
    measure: Count of the customer's budget plans on any service agreement whose status is removed and whose status_date falls in the window.

policies:
  - id: budget_agg_multi_holding
    subject: [budget_enrollment]
    rule: >-
      A customer may hold budget billing plans on several service agreements, one per service agreement. No
      other plan on the same service agreement is in enrolled or active status. Moving from one plan kind to
      another requires withdrawing from the first.
    eligibility:
      - id: one_open_plan_per_agreement
        applies_to: [budget_enrollment]
        kind: dedup
        condition: "No other plan on the same service agreement is in enrolled or active status."
        evidence_fields: [budget_plans.service_account_id, budget_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [budget_plans.service_account_id]
          action_bindings:
            budget_plans.service_account_id: service_account_id
        dedup_contract:
          table: budget_plans
          mode: separate_record
          object_bindings: {service_account_id: service_account_id}
          duplicate_filters: {status: [enrolled, active]}
          distinct_fields: [enrolled_date]
    params:
      max_per_customer: null

  - id: budget_agg_customer_removal_lockout
    subject: [budget_enrollment]
    rule: >-
      A removal for missed installments on any of the customer's service agreements bars enrollment on every
      agreement of that customer while budget_msr_customer_removals is above zero. Voluntary withdrawals are
      judged per agreement and plan under reenrollment_lockout_months_after_withdrawal.
    eligibility: []
    measures: [budget_msr_customer_removals]

  - id: budget_enrollment_eligibility
    subject: [budget_enrollment]
    rule: >-
      Enrollment is accepted only on a service agreement in active status. The agreement's schedule must be
      among eligible_schedules, a business agreement's highest measured demand in its last 12 bills may not
      exceed max_demand_kw, and a FlatBill requires min_service_months of service, 12-month usage no more than
      annual_usage_cap_kwh and no net metering agreement in approved or operating status. The past-due balance
      may not exceed max_past_due_at_enrollment_usd, except that arrears placed in an active payment arrangement
      are disregarded where past_due_allowed_with_active_arrangement is true. Plans whose tou_compatible is false
      are not held on time-of-use schedules. Enrollment is the customer's own choice and takes effect under
      enrollment_effective_rule.
    eligibility:
      - id: enroll_active_agreement
        applies_to: [budget_enrollment]
        kind: state
        condition: "Enrollment is accepted only on a service agreement in active status."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active]
    params:
      per_tier:
        Residential Levelized Billing Plan: {min_service_months: "=min_service_months", max_demand: "=max_demand_kw", usage_cap: "=annual_usage_cap_kwh"}
        Residential Budget Billing Plan: {min_service_months: "=min_service_months", max_demand: "=max_demand_kw", usage_cap: "=annual_usage_cap_kwh"}
        Residential FlatBill Plan: {min_service_months: "=min_service_months", max_demand: "=max_demand_kw", usage_cap: "=annual_usage_cap_kwh"}
        Commercial Levelized Billing Plan: {min_service_months: "=min_service_months", max_demand: "=max_demand_kw", usage_cap: "=annual_usage_cap_kwh"}
        Commercial Budget Billing Plan: {min_service_months: "=min_service_months", max_demand: "=max_demand_kw", usage_cap: "=annual_usage_cap_kwh"}
        Small Business FlatBill Plan: {min_service_months: "=min_service_months", max_demand: "=max_demand_kw", usage_cap: "=annual_usage_cap_kwh"}

  - id: budget_installment_calculation
    subject: [budget_enrollment, budget_installment_review]
    rule: >-
      Levelized plans set the installment every bill to budget_msr_average_actual_12 plus the deferred balance
      divided by deferred_balance_spread_months. Budget plans set it to projected weather-normalized charges for
      the next 12 months divided by 12 and review it every recalculation_frequency_months, keeping the current
      installment when the recomputed one differs by less than recalculation_threshold_pct, and review it at
      once when the deferred balance reaches deferred_balance_review_trigger_usd in absolute value or the
      schedule's rates change. FlatBill plans set the amount once per term from predicted usage priced at current
      rates plus flat_risk_premium_pct, and reprice it only after a usage-band breach or at renewal. Every
      installment is rounded up to the next whole dollar and never set below installment_floor_usd.
    eligibility: []
    params:
      per_tier:
        Residential Levelized Billing Plan: {frequency: "=recalculation_frequency_months", threshold: "=recalculation_threshold_pct", spread: "=deferred_balance_spread_months", floor: "=installment_floor_usd"}
        Residential Budget Billing Plan: {frequency: "=recalculation_frequency_months", threshold: "=recalculation_threshold_pct", spread: "=deferred_balance_spread_months", floor: "=installment_floor_usd"}
        Residential FlatBill Plan: {frequency: "=recalculation_frequency_months", threshold: "=recalculation_threshold_pct", spread: "=deferred_balance_spread_months", floor: "=installment_floor_usd"}
        Commercial Levelized Billing Plan: {frequency: "=recalculation_frequency_months", threshold: "=recalculation_threshold_pct", spread: "=deferred_balance_spread_months", floor: "=installment_floor_usd"}
        Commercial Budget Billing Plan: {frequency: "=recalculation_frequency_months", threshold: "=recalculation_threshold_pct", spread: "=deferred_balance_spread_months", floor: "=installment_floor_usd"}
        Small Business FlatBill Plan: {frequency: "=recalculation_frequency_months", threshold: "=recalculation_threshold_pct", spread: "=deferred_balance_spread_months", floor: "=installment_floor_usd"}
    formula:
      levelized_installment: "max(installment_floor_usd, -(-(budget_msr_average_actual_12 + (deferred_balance / deferred_balance_spread_months if deferred_balance_spread_months > 0 else 0)) // 1))"
    measures: [budget_msr_average_actual_12]

  - id: budget_monthly_deferral
    subject: [budget_deferral, budget_recovery]
    rule: >-
      On every regular bill of an active plan, the bill's actual charges are compared with the installment:
      the excess is booked as a deferral and credited off the collectible balance, and a shortfall is booked as
      a recovery and billed, so that the amount due on the bill equals the installment. Equal amounts book
      nothing. Each bill is compared once, and only for a plan in active status.
    eligibility:
      - id: compare_on_active_plan
        applies_to: [budget_deferral, budget_recovery]
        kind: state
        condition: "Each bill is compared once, and only for a plan in active status."
        evidence_fields: [budget_plans.status, budget_plans.budget_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [budget_plans.budget_plan_id]
          action_bindings:
            budget_plans.budget_plan_id: budget_plan_id
        state_contract:
          field: budget_plans.status
          allowed: [active]

  - id: budget_settle_up_rule
    subject: [budget_settle_up_billing, budget_settle_up_credit]
    rule: >-
      Where settle_up_enabled is true, the bill named by settle_up_month_rule settles the deferred balance when
      its absolute value is at least settle_up_minimum_usd: a positive balance is billed and a negative balance is
      credited. On removal, withdrawal and service closure every plan settles its whole deferred balance under
      removal_settlement_rule, withdrawal_settlement_rule or service_closure_settlement. Each settle kind is
      settled once per date.
    eligibility: []
    params:
      per_tier:
        Residential Levelized Billing Plan: {enabled: "=settle_up_enabled", minimum: "=settle_up_minimum_usd"}
        Residential Budget Billing Plan: {enabled: "=settle_up_enabled", minimum: "=settle_up_minimum_usd"}
        Residential FlatBill Plan: {enabled: "=settle_up_enabled", minimum: "=settle_up_minimum_usd"}
        Commercial Levelized Billing Plan: {enabled: "=settle_up_enabled", minimum: "=settle_up_minimum_usd"}
        Commercial Budget Billing Plan: {enabled: "=settle_up_enabled", minimum: "=settle_up_minimum_usd"}
        Small Business FlatBill Plan: {enabled: "=settle_up_enabled", minimum: "=settle_up_minimum_usd"}

  - id: budget_flatbill_terms
    subject: [budget_closeout_absorbed, budget_closeout_retained, budget_installment_review]
    rule: >-
      A FlatBill holds its amount for flat_term_months. When budget_msr_flat_breaches reaches
      flat_usage_band_consecutive_months the amount is repriced under flat_usage_breach_action. Rate changes
      during the term are absorbed where flat_includes_rate_changes is true. At the end of a term the deferred
      balance is closed out under flat_term_end_balance_handling and a renewal at a new amount, offered
      flat_renewal_notice_days before the term end, starts a new term unless the customer withdraws. A closeout
      is booked only for a FlatBill plan in active status.
    eligibility:
      - id: closeout_active_flatbill
        applies_to: [budget_closeout_absorbed, budget_closeout_retained]
        kind: state
        condition: "A closeout is booked only for a FlatBill plan in active status."
        evidence_fields: [budget_plans.status, budget_plans.budget_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [budget_plans.budget_plan_id]
          action_bindings:
            budget_plans.budget_plan_id: budget_plan_id
        state_contract:
          field: budget_plans.status
          allowed: [active]
    params:
      per_tier:
        Residential Levelized Billing Plan: {premium: "=flat_risk_premium_pct", band: "=flat_usage_band_pct", term_months: "=flat_term_months"}
        Residential Budget Billing Plan: {premium: "=flat_risk_premium_pct", band: "=flat_usage_band_pct", term_months: "=flat_term_months"}
        Residential FlatBill Plan: {premium: "=flat_risk_premium_pct", band: "=flat_usage_band_pct", term_months: "=flat_term_months"}
        Commercial Levelized Billing Plan: {premium: "=flat_risk_premium_pct", band: "=flat_usage_band_pct", term_months: "=flat_term_months"}
        Commercial Budget Billing Plan: {premium: "=flat_risk_premium_pct", band: "=flat_usage_band_pct", term_months: "=flat_term_months"}
        Small Business FlatBill Plan: {premium: "=flat_risk_premium_pct", band: "=flat_usage_band_pct", term_months: "=flat_term_months"}
    measures: [budget_msr_flat_breaches]

  - id: budget_removal_rule
    subject: [budget_missed_installment, budget_removal]
    rule: >-
      An installment counts as missed when the bill carrying it is still not paid up to the installment
      missed_installment_grace_days calendar days after its due date. The plan is removed when
      budget_msr_missed_installments reaches missed_installments_to_removal, and the deferred balance is settled
      under removal_settlement_rule. Each bill's installment is recorded as missed at most once.
    eligibility:
      - id: miss_once_per_bill
        applies_to: [budget_missed_installment]
        kind: dedup
        condition: "Each bill's installment is recorded as missed at most once."
        evidence_fields: [budget_ledger.bill_id, budget_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [budget_ledger.bill_id]
          action_bindings:
            budget_ledger.bill_id: bill_id
        dedup_contract:
          table: budget_ledger
          mode: separate_record
          object_bindings: {bill_id: bill_id}
          duplicate_filters: {event_type: [budget_missed_installment]}
          distinct_fields: []
    params:
      per_tier:
        Residential Levelized Billing Plan: {missed_to_removal: "=missed_installments_to_removal", grace_days: "=missed_installment_grace_days"}
        Residential Budget Billing Plan: {missed_to_removal: "=missed_installments_to_removal", grace_days: "=missed_installment_grace_days"}
        Residential FlatBill Plan: {missed_to_removal: "=missed_installments_to_removal", grace_days: "=missed_installment_grace_days"}
        Commercial Levelized Billing Plan: {missed_to_removal: "=missed_installments_to_removal", grace_days: "=missed_installment_grace_days"}
        Commercial Budget Billing Plan: {missed_to_removal: "=missed_installments_to_removal", grace_days: "=missed_installment_grace_days"}
        Small Business FlatBill Plan: {missed_to_removal: "=missed_installments_to_removal", grace_days: "=missed_installment_grace_days"}
    measures: [budget_msr_missed_installments]

  - id: budget_exit_rules
    subject: [budget_withdrawal, budget_plan_closure, budget_activation]
    rule: >-
      The customer may leave a plan at any time; the withdrawal takes effect under withdrawal_effective_rule and
      the deferred balance is settled under withdrawal_settlement_rule, and a FlatBill left early settles actual
      charges against FlatBill amounts where flat_early_exit_true_up is true. Leaving a plan is the customer's own
      decision. When the service agreement closes the plan closes and settles under service_closure_settlement;
      a plan whose transfer_on_move_allowed is true is instead re-enrolled on the customer's new agreement with
      its deferred balance settled on the final bill. The plan becomes active on the bill named by
      enrollment_effective_rule.
    eligibility: []
    params:
      per_tier:
        Residential Levelized Billing Plan: {early_exit_true_up: "=flat_early_exit_true_up", withdrawal_lockout: "=reenrollment_lockout_months_after_withdrawal"}
        Residential Budget Billing Plan: {early_exit_true_up: "=flat_early_exit_true_up", withdrawal_lockout: "=reenrollment_lockout_months_after_withdrawal"}
        Residential FlatBill Plan: {early_exit_true_up: "=flat_early_exit_true_up", withdrawal_lockout: "=reenrollment_lockout_months_after_withdrawal"}
        Commercial Levelized Billing Plan: {early_exit_true_up: "=flat_early_exit_true_up", withdrawal_lockout: "=reenrollment_lockout_months_after_withdrawal"}
        Commercial Budget Billing Plan: {early_exit_true_up: "=flat_early_exit_true_up", withdrawal_lockout: "=reenrollment_lockout_months_after_withdrawal"}
        Small Business FlatBill Plan: {early_exit_true_up: "=flat_early_exit_true_up", withdrawal_lockout: "=reenrollment_lockout_months_after_withdrawal"}
