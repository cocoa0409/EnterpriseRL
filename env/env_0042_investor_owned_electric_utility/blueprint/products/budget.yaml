# Budget Billing — payment-leveling options attached to one service agreement: levelized and
# budget plans that bill a smoothed installment and defer the difference from actual charges, and
# FlatBill plans that bill a fixed 12-month price whatever the usage within its band.

category: budget
display_name: Budget Billing

binding:
  holding_table: budget_plans
  event_tables: [budget_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {deferred_balance: budget_deferred_balance}

lifecycle:
  states: [enrolled, active, removed, withdrawn, closed]
  transitions:
    - {from: enrolled, to: active, by: system, means: The first bill under the plan is issued with the plan installment.}
    - {from: enrolled, to: withdrawn, by: user, means: The customer cancels the enrollment before the first plan bill.}
    - {from: active, to: withdrawn, by: user, means: The customer leaves the plan and the deferred balance is settled.}
    - {from: active, to: removed, by: system, means: The plan is ended for missed installments and the deferred balance is settled.}
    - {from: active, to: closed, by: system, means: The service agreement closed and the deferred balance is settled on the final bill.}

accounts:
  - key: budget_deferred_balance
    unit: USD
    meaning: Actual charges billed beyond (positive) or short of (negative) the plan installments, carried until recovered, settled or closed out.

parameter_schema:
  customer_type_eligible: Customer class eligible for the plan.
  eligible_schedules: Rate schedules on which the plan may be held.
  max_demand_kw: Highest measured demand in the last 12 bills allowed for business plans, kW; 0 for residential plans.
  annual_usage_cap_kwh: Largest 12-month usage allowed at enrollment, kWh; 0 means no cap.
  min_service_months: Months of service at the address required before enrollment.
  min_history_for_actual_basis_months: Regular bills at the address needed to base the installment on the address's own history.
  new_premise_estimate_basis: How the installment is based when the address's history is too short.
  max_past_due_at_enrollment_usd: Largest past-due balance allowed at enrollment, USD.
  past_due_allowed_with_active_arrangement: Whether a past-due balance placed in an active payment arrangement is disregarded at enrollment (true/false).
  allowed_service_statuses: Service agreement statuses in which enrollment is accepted.
  enrollment_effective_rule: Which bill first carries the plan installment.
  installment_basis: How the plan installment is computed.
  installment_rounding_rule: How the installment is rounded.
  installment_floor_usd: Smallest plan installment, USD.
  recalculation_frequency_months: Months between scheduled installment reviews.
  recalculation_threshold_pct: Change of the recomputed installment, as a fraction of the current one, below which a scheduled review keeps the current installment; 0.00 means always reset.
  deferred_balance_review_trigger_usd: Absolute deferred balance that triggers an immediate review; 0.00 means no such trigger.
  deferred_balance_spread_months: Months over which the deferred balance is spread into the installment at each review; 0 means it is not spread.
  weather_normalized: Whether projected usage is weather-normalized (true/false).
  rate_change_triggers_review: Whether a change in the schedule's rates triggers an immediate review (true/false).
  settle_up_enabled: Whether the deferred balance is settled annually (true/false).
  settle_up_month_rule: Which bill carries the annual settle-up.
  settle_up_minimum_usd: Smallest absolute deferred balance settled at the annual settle-up; smaller balances carry over, USD.
  flat_risk_premium_pct: Price premium included in a FlatBill amount, decimal fraction; 0.00 for other plans.
  flat_term_months: Length of a FlatBill price term, months; 0 for other plans.
  flat_usage_band_pct: Share by which monthly usage may exceed the predicted usage before a FlatBill breach is counted, decimal fraction; 0.00 for other plans.
  flat_usage_band_consecutive_months: Consecutive breaching bills after which a FlatBill is repriced; 0 for other plans.
  flat_usage_breach_action: What happens after the breach count is reached.
  flat_includes_rate_changes: Whether rate changes during the term are absorbed in the FlatBill amount (true/false).
  flat_early_exit_true_up: Whether leaving a FlatBill before the term ends settles actual charges against flat payments (true/false).
  flat_renewal_notice_days: Calendar days before the term end by which the renewal price is offered; 0 for other plans.
  flat_term_end_balance_handling: What happens to the deferred balance at the end of a FlatBill term.
  missed_installments_to_removal: Missed installments within the plan that remove the customer from the plan.
  missed_installment_grace_days: Calendar days after the bill's due date before an unpaid installment counts as missed.
  removal_settlement_rule: How the deferred balance is settled on removal.
  reenrollment_lockout_months_after_removal: Months after a removal on any of the customer's agreements before the customer may enroll again.
  reenrollment_lockout_months_after_withdrawal: Months after a voluntary withdrawal before the customer may enroll in the same plan again.
  withdrawal_settlement_rule: How the deferred balance is settled when the customer leaves the plan.
  service_closure_settlement: How the deferred balance is settled when the service agreement closes.
  transfer_on_move_allowed: Whether the plan moves with the customer to a new service agreement (true/false).
  nem_compatible: Whether the plan may be held with a net metering agreement on the same service agreement (true/false).
  tou_compatible: Whether the plan may be held on a time-of-use schedule (true/false).
  arrangement_compatible: Whether the plan may be held while a payment arrangement is active on the same agreement (true/false).
  installment_due_rule: When the installment falls due.
  deferral_posting_rule: When the monthly deferral or recovery is booked.
  late_payment_basis: What a late payment charge is computed on while the plan is active.
  withdrawal_effective_rule: When a voluntary withdrawal takes effect.
  review_notice_rule: How a changed installment is communicated.

