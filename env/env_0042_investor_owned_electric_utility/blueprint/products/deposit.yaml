# Security Deposit — cash (or, for larger business accounts, an accepted instrument) held against
# a service agreement's future bills, earning statutory interest and returned after a period of
# satisfactory payment or applied to the final bill.

category: deposit
display_name: Security Deposit

binding:
  holding_table: deposit_accounts
  event_tables: [deposit_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {held_amount: deposit_held}

lifecycle:
  states: [assessed, held, waived, refunded, applied_to_final_bill, cancelled]
  transitions:
    - {from: assessed, to: held, by: system, means: The required amount is fully secured by cash payments or an accepted instrument.}
    - {from: assessed, to: waived, by: agent, means: A waiver basis is established after assessment and the requirement is withdrawn.}
    - {from: assessed, to: applied_to_final_bill, by: system, means: The service agreement closed before the deposit was fully paid and the cash received is applied to the final bill.}
    - {from: assessed, to: cancelled, by: system, means: The start order was cancelled before service began and any cash received is refunded.}
    - {from: held, to: refunded, by: agent, means: The satisfactory payment review is passed and the deposit with interest is returned.}
    - {from: held, to: applied_to_final_bill, by: system, means: The service agreement closed and the deposit with interest is applied to the final bill.}
    - {from: held, to: assessed, by: system, means: A recalculation raised the required amount and an additional deposit is due.}

accounts:
  - key: deposit_held
    unit: USD
    meaning: Cash deposit and accrued interest held for the service agreement — raised by deposit payments and interest, lowered by refunds and by application to the final bill.

parameter_schema:
  deposit_multiple_of_average_bill: Required deposit as a multiple of the average monthly bill, decimal.
  average_bill_lookback_months: Number of most recent regular bills averaged to obtain the average monthly bill.
  average_bill_minimum_months: Fewest regular bills at the service address for the actual average to be used; with fewer, the default average bill applies.
  default_average_bill_usd: Average monthly bill used when the address has too little bill history, USD.
  minimum_deposit_usd: Smallest deposit required when a deposit applies, USD.
  maximum_deposit_usd: Largest deposit that may be required, USD.
  deposit_rounding_rule: How the computed deposit is rounded.
  assessment_window_days: Calendar days after the triggering event within which the deposit may be assessed.
  late_payment_trigger_count: Late payment charges within 12 months that allow a deposit on an existing agreement; 0 means late payments are not a trigger for this deposit.
  installment_count_max: Most installments in which the deposit may be paid.
  installment_count_max_income_qualified: Most installments when the customer's income qualification is current at assessment.
  minimum_installment_usd: Smallest deposit installment; the installment count is reduced until each installment reaches it, USD.
  first_installment_due_days: Calendar days after assessment by which the first installment is due; 0 means due on the assessment date.
  installment_schedule: When the later installments fall due.
  reconnection_requires_first_installment: Whether the first installment must be paid before a disconnected agreement is reconnected (true/false).
  deposit_required_before_energization: Whether the deposit must be fully secured before a new service agreement is energized (true/false).
  waiver_request_window_days: Calendar days after assessment within which the customer may establish a waiver basis; 0 means the deposit cannot be waived.
  waiver_prior_utility_letter_months: Months of satisfactory payment that a letter of credit reference from the customer's prior electric utility must show to waive the deposit; 0 means this waiver is not offered.
  waiver_prior_lakeshore_history_months: Months of satisfactory payment on a closed Lakeshore agreement of the customer, ended within the last 12 months, that waive the deposit; 0 means not offered.
  waiver_income_qualified: Whether a current income qualification waives the deposit (true/false).
  waiver_senior_age: Age of the residential account holder at or above which the deposit is waived when no balance is owed on any of the customer's agreements; 0 means not offered.
  waiver_medical_certification: Whether a medical certification on the agreement in active status waives the deposit (true/false).
  surety_bond_accepted: Whether a surety bond for the full required amount is accepted in place of cash (true/false).
  letter_of_credit_accepted: Whether an irrevocable letter of credit for the full required amount is accepted in place of cash (true/false).
  third_party_guarantee_accepted: Whether a written guarantee by another Lakeshore customer with satisfactory history is accepted in place of cash (true/false).
  guarantee_release_months: Months of satisfactory payment after which a third-party guarantee is released; 0 when guarantees are not accepted.
  interest_rate_annual: Simple annual interest rate paid on cash deposits, decimal fraction, as set by the Commission for the year.
  interest_crediting_rule: When interest is credited.
  interest_min_holding_months: Months a cash deposit must be held before any interest is paid.
  refund_review_months: Months after the deposit became fully held at which the satisfactory payment review falls due.
  refund_max_late_payments: Late payment charges allowed during the review period for the deposit to be refunded.
  refund_max_returned_payments: Returned payments allowed during the review period for the deposit to be refunded.
  refund_disconnection_free_required: Whether a disconnection for nonpayment on any of the customer's agreements during the review period prevents the refund (true/false).
  review_extension_months: Months by which the review date is moved out after a failed review.
  refund_method_default: How a refund is paid unless the customer elects otherwise.
  check_refund_on_request: Whether the customer may elect a check instead of the default refund method (true/false).
  recalculation_frequency_months: Months between scheduled recalculations of the required amount on a held deposit; 0 means never recalculated.
  recalculation_increase_threshold_pct: Increase of the recalculated amount over the held amount, as a fraction of the held amount, that triggers an additional deposit; 0 means no increase is required.
  recalculation_excess_refund: Whether held cash above a lower recalculated amount is refunded (true/false).
  additional_deposit_due_days: Calendar days after an additional deposit is required by which it is due.
  transfer_on_move_allowed: Whether a held deposit moves with the customer to a new service agreement (true/false).
  application_order: Order in which a deposit applied at closure meets the final balance.
  unauthorized_use_finding_required: Whether a confirmed meter tampering or diversion finding is required to assess the deposit (true/false).
  disconnection_trigger: Whether a disconnection for nonpayment of the agreement triggers this deposit (true/false).
  new_service_trigger: Whether opening a new service agreement without a waiver basis triggers this deposit (true/false).
  business_size_band: Rate schedules for which the deposit is assessed.
  residential_only: Whether the deposit is assessed only on residential agreements (true/false).
  agent_may_waive: Whether a customer care agent may record a waiver, as opposed to the credit department (true/false).
  interest_paid_on_instruments: Whether interest is paid on non-cash security (always false; instruments earn nothing) (true/false).

