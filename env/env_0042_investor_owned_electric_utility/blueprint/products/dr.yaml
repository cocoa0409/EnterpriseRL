# Demand Response Programs — voluntary load-reduction programs attached to one service agreement:
# behavioral peak time rebates, device programs (smart thermostats, AC load control switches, home
# batteries) and business capacity and interruptible programs, with event participation records,
# incentives earned, payouts, and penalties for under-delivery.

category: dr
display_name: Demand Response Programs

binding:
  holding_table: dr_enrollments
  event_tables: [dr_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {incentive_balance: dr_incentive_earned}

lifecycle:
  states: [enrolled, active, unenrolled, removed]
  transitions:
    - {from: enrolled, to: active, by: system, means: The enrollment is verified and, where a device is required, the device is installed and communicating.}
    - {from: enrolled, to: unenrolled, by: user, means: The customer cancels before the enrollment becomes active, or it lapses because the device was not installed in time.}
    - {from: active, to: unenrolled, by: user, means: The customer leaves the program.}
    - {from: active, to: removed, by: system, means: The enrollment is ended for excess opt-outs, repeated non-performance, or closure of the service agreement.}

accounts:
  - key: dr_incentive_earned
    unit: USD
    meaning: Incentives earned and not yet paid — raised by bonuses, event and seasonal incentives and by billing a negative balance, lowered by payouts, penalties and bonus clawbacks.

parameter_schema:
  customer_type_eligible: Customer class eligible for the program.
  eligible_schedules: Rate schedules on which the program may be held.
  requires_communicating_meter: Whether a communicating interval meter must be in service at the address (true/false).
  device_required: Whether a qualifying device must be installed before the enrollment becomes active (true/false).
  device_type: Device that carries out load reduction, or none.
  device_install_days: Calendar days after enrollment within which the device must be installed and communicating; 0 when no device is required.
  min_committed_kw: Smallest load reduction or discharge commitment accepted, kW; 0 when no commitment is made.
  life_support_excluded: Whether service agreements with an active life-support registration are excluded (true/false).
  enrollment_bonus_usd: One-time incentive earned when the enrollment becomes active, USD.
  bonus_clawback_months: Months after activation within which leaving the program forfeits the enrollment bonus; 0 means no clawback.
  seasonal_incentive_usd: Incentive earned for completing an event season within the opt-out limit, USD.
  monthly_participation_credit_usd: Credit earned for each participation month, USD.
  participation_credit_months: Billing months that earn the participation credit.
  event_incentive_usd_per_kwh: Rebate per kWh reduced below baseline during an event, USD per kWh.
  performance_incentive_usd_per_kw_season: Incentive per kW of average delivered discharge over a season's events, USD per kW.
  capacity_payment_usd_per_kw_month: Payment per committed kW for each program month, USD per kW-month.
  energy_payment_usd_per_kwh: Payment per kWh delivered during events, USD per kWh.
  penalty_usd_per_kw_shortfall: Charge per kW by which delivered reduction falls short of the commitment in an event, USD per kW.
  excess_energy_charge_usd_per_kwh: Charge per kWh used above the firm service level during an event, USD per kWh.
  penalty_cap_basis: Limit on penalties in a program month.
  event_season: Calendar window in which events may be called.
  program_months: Months in which capacity payments are earned.
  event_days: Days on which events may be called.
  event_window_hours: Clock window within which event hours fall.
  max_events_per_season: Most events per season (per program year where events may be called all year).
  max_event_hours_per_season: Most event hours per season.
  max_event_duration_hours: Longest single event, hours.
  test_events_per_year: Test events per program year that count toward performance but earn no event incentive.
  advance_notice_hours: Notice given before an event starts, hours.
  event_notification_channels: How event notices are delivered.
  opt_out_allowed: Whether the customer may opt out of an event (true/false).
  max_opt_outs_per_season: Opt-outs allowed per season without consequence.
  opt_out_excess_consequence: What happens when opt-outs exceed the limit.
  baseline_method: How the load the customer would have used is estimated.
  baseline_days: Similar non-event days in the baseline pool; 0 when no baseline is computed.
  battery_reserve_pct: Share of battery capacity kept in reserve during dispatch, decimal fraction; 0.00 when not a battery program.
  max_setpoint_offset_f: Largest thermostat setpoint change during an event, degrees Fahrenheit; 0 when not a thermostat program.
  cycling_pct: Share of each half-hour the air conditioner compressor is switched off, decimal fraction; 0.00 when not a cycling program.
  incentive_payout_method: How earned incentives are paid.
  payout_frequency: When earned incentives are paid.
  payout_minimum_usd: Smallest balance paid out; smaller balances carry to the next payout, USD.
  minimum_enrollment_months: Commitment term of the enrollment, months; 0 means none.
  removal_nonperformance_events: Consecutive events with no delivered reduction, not opted out, that remove the enrollment; 0 means none.
  commitment_change_rule: When and how the committed kW may be changed.
  unenrollment_effective_rule: When leaving the program takes effect.
  reenrollment_lockout_months: Months after a removal before the customer may enroll in the same program again.
  transfer_on_move_allowed: Whether the enrollment moves with the customer to a new service agreement (true/false).
  negative_balance_handling: How a negative incentive balance is settled when the enrollment ends.
  device_ownership: Who owns the load control device.

