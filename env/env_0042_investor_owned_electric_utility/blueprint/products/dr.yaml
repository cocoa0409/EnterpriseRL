events:
  # ---- holding (dr_enrollments) ----------------------------------------------------------
  - type: dr_enrollment
    target: dr_enrollments
    mutation: create
    meaning: The customer enrolls a service agreement in a demand response program.
    grain: One row per enrollment.
    fields:
      customer_id: Customer of record on the service agreement.
      service_account_id: Service agreement enrolled.
      variant_name: Program, official full name.
      enrolled_date: Date of enrollment.
      committed_kw: Committed reduction, discharge or firm-service-level reduction, kW; 0.0 where no commitment is made.
      device_serial: Serial number of the thermostat, switch or battery; empty where no device is required.
      status_date: Date of enrollment.
    triggers: []
  - type: dr_activation
    target: dr_enrollments
    mutation: {transition: {from: enrolled, to: active}}
    meaning: The enrollment becomes active.
    grain: One row per transaction.
    fields:
      activation_date: Date the enrollment became active.
      status_date: Date the enrollment became active.
    triggers: []
  - type: dr_unenrollment
    target: dr_enrollments
    mutation: {transition: [{from: enrolled, to: unenrolled}, {from: active, to: unenrolled}]}
    meaning: The customer leaves the program, or an enrollment lapses before activation.
    grain: One row per transaction.
    fields:
      status_date: Date the unenrollment takes effect.
    triggers: []
  - type: dr_removal
    target: dr_enrollments
    mutation: {transition: {from: active, to: removed}}
    meaning: The enrollment is ended by the company.
    grain: One row per transaction.
    fields:
      removal_reason: Why the enrollment was ended.
      status_date: Date of removal.
    triggers: []
  - type: dr_commitment_change
    target: dr_enrollments
    mutation: update
    meaning: The committed kW of an active enrollment is changed.
    grain: One row per transaction.
    fields:
      committed_kw: New committed kW.
    triggers: []
  # ---- ledger (dr_ledger) ---------------------------------------------------------------
  - type: dr_event_participation
    target: dr_ledger
    meaning: The enrollment's performance in one demand response event is recorded.
    grain: One row per event per enrollment.
    distinguish_by: [dr_event_code]
    fields:
      dr_event_code: Company code of the event, unique per event.
      entry_date: Date of the event.
      test_event: Whether the event was a test event.
      opted_out: Whether the customer opted out of the event.
      baseline_kwh: Baseline usage over the event hours, kWh; 0 where no baseline is computed.
      actual_kwh: Metered usage over the event hours, kWh.
      delivered_kw: Average load reduction or battery discharge delivered over the event hours, kW.
    triggers: []
  - type: dr_enrollment_bonus
    target: dr_ledger
    meaning: The one-time enrollment bonus is earned on activation.
    grain: One row per enrollment.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date the bonus was earned.
      amount: Bonus amount.
    account: dr_incentive_earned
    direction: in
    triggers: []
  - type: dr_event_incentive
    target: dr_ledger
    meaning: An incentive is earned for performance in one event or for one program month.
    grain: One row per event, or per program month for capacity and participation credits.
    distinguish_by: [incentive_basis, dr_event_code, incentive_month]
    fields:
      entry_date: Date the incentive was earned.
      incentive_basis: What the incentive pays for.
      dr_event_code: Event the incentive is earned for; empty for monthly incentives.
      incentive_month: Program or billing month a monthly incentive covers (YYYY-MM); empty for event incentives.
      amount: Incentive amount.
    account: dr_incentive_earned
    direction: in
    triggers: []
  - type: dr_seasonal_incentive
    target: dr_ledger
    meaning: A season-end incentive is earned.
    grain: One row per enrollment per season.
    distinguish_by: [season_year]
    fields:
      entry_date: Date the incentive was earned.
      season_year: Year of the event season.
      amount: Incentive amount.
    account: dr_incentive_earned
    direction: in
    triggers: []
  - type: dr_incentive_payout
    target: dr_ledger
    meaning: Earned incentives are paid to the customer.
    grain: One row per payout.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date of the payout.
      payout_method: Bill credit or check.
      amount: Amount paid.
    account: dr_incentive_earned
    direction: out
    triggers:
      - event: service:service_program_credit
        when: {payout_method: bill_credit}
        map: {posting_date: entry_date, amount: amount, credit_code: dr_incentive_credit, source_reference_id: dr_ledger_id}
  - type: dr_nonperformance_penalty
    target: dr_ledger
    meaning: A shortfall or excess-energy penalty is charged against earned incentives for one event.
    grain: One row per event penalised.
    distinguish_by: [dr_event_code]
    fields:
      entry_date: Date the penalty was charged.
      dr_event_code: Event penalised.
      amount: Penalty amount.
    account: dr_incentive_earned
    direction: out
    triggers: []
  - type: dr_bonus_clawback
    target: dr_ledger
    meaning: The enrollment bonus is taken back because the customer left within the clawback period.
    grain: One row per enrollment.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date of the clawback.
      amount: Bonus taken back.
    account: dr_incentive_earned
    direction: out
    triggers: []
  - type: dr_negative_balance_billing
    target: dr_ledger
    meaning: A negative incentive balance is billed to the service agreement, bringing the balance back to zero.
    grain: One row per settlement.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date of the settlement.
      amount: Amount billed.
    account: dr_incentive_earned
    direction: in
    triggers:
      - event: service:service_program_debit
        map: {posting_date: entry_date, amount: amount, charge_code: dr_negative_balance, source_reference_id: dr_ledger_id}

measures:
  - id: dr_msr_season_events
    window: The current event season of the enrollment (event_season of the program year containing the handling date).
    measure: Count of dr_event_participation rows on the enrollment in the window, and the sum of their event hours.
  - id: dr_msr_season_opt_outs
    window: The current event season of the enrollment.
    measure: Count of dr_event_participation rows on the enrollment in the window with opted_out true.
  - id: dr_msr_consecutive_nonperformance
    window: The enrollment's event participations, most recent first.
    measure: Number of consecutive most recent dr_event_participation rows with opted_out false and delivered_kw equal to 0.0.
  - id: dr_msr_season_average_delivered_kw
    window: The completed event season.
    measure: Average delivered_kw over all non-test dr_event_participation rows of the season, with opted-out events beyond the opt-out limit counted as 0.0.
  - id: dr_msr_portfolio_delivered_kw
    window: One event.
    measure: Sum of delivered_kw of the event's dr_event_participation rows across all of the customer's Commercial Capacity Bidding Program enrollments.

policies:
  - id: dr_agg_multi_holding
    subject: [dr_enrollment]
    rule: >-
      A customer may hold demand response enrollments on several service agreements, one program per service
      agreement. No other enrollment on the same service agreement is in enrolled or active status. A customer who
      wants a different program on the same agreement leaves the first one before enrolling, so the same load is
      never paid twice.
    eligibility:
      - id: one_program_per_agreement
        applies_to: [dr_enrollment]
        kind: dedup
        condition: "No other enrollment on the same service agreement is in enrolled or active status."
        evidence_fields: [dr_enrollments.service_account_id, dr_enrollments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dr_enrollments.service_account_id]
          action_bindings:
            dr_enrollments.service_account_id: service_account_id
        dedup_contract:
          table: dr_enrollments
          mode: separate_record
          object_bindings: {service_account_id: service_account_id}
          duplicate_filters: {status: [enrolled, active]}
          distinct_fields: [enrolled_date]
    params:
      max_per_customer: null

  - id: dr_agg_capacity_portfolio
    subject: [dr_nonperformance_penalty, dr_event_incentive]
    rule: >-
      A business customer's Commercial Capacity Bidding Program enrollments on several service agreements form
      one portfolio. In each event, performance is judged on dr_msr_portfolio_delivered_kw against the sum of the
      portfolio's committed_kw, and any shortfall penalty is shared among the enrollments in proportion to their
      committed_kw, rounded to the cent with the remainder on the enrollment with the largest commitment. Capacity
      payments stay per enrollment. Other programs are judged per enrollment.
    eligibility: []
    measures: [dr_msr_portfolio_delivered_kw]

  - id: dr_enrollment_eligibility
    subject: [dr_enrollment]
    rule: >-
      Enrollment is accepted only on a service agreement in active status. The agreement's schedule must be among
      eligible_schedules and the customer of customer_type_eligible. Where requires_communicating_meter is true the
      address must have a meter in service that is not the Non-Communicating Opt-Out Meter. Where
      life_support_excluded is true an agreement with an active Life-Support Registration or Critical Care
      Life-Support Registration is not enrolled, because load control could interrupt life-support equipment. The
      committed kW must be at least min_committed_kw, and where device_required is true the customer supplies the
      device serial number. The device serial number and committed kW are taken as the customer states them.
      Enrollment is the customer's own decision. A customer removed from the same program within
      reenrollment_lockout_months is not enrolled again.
    eligibility:
      - id: enroll_active_agreement
        applies_to: [dr_enrollment]
        kind: state
        condition: "Enrollment is accepted only on a service agreement in active status."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active]
      - id: device_and_commitment_stated
        applies_to: [dr_enrollment]
        kind: caller_fact
        condition: "The device serial number and committed kW are taken as the customer states them."
        evidence_fields: [dr_enrollments.device_serial, dr_enrollments.service_account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [dr_enrollments.service_account_id]
          action_bindings:
            dr_enrollments.service_account_id: service_account_id
    params:
      per_tier:
        Peak Time Rebate: {min_kw: "=min_committed_kw", life_support_excluded: "=life_support_excluded", device: "=device_required"}
        Smart Thermostat Rewards: {min_kw: "=min_committed_kw", life_support_excluded: "=life_support_excluded", device: "=device_required"}
        AC Cycling Program: {min_kw: "=min_committed_kw", life_support_excluded: "=life_support_excluded", device: "=device_required"}
        Home Battery Dispatch: {min_kw: "=min_committed_kw", life_support_excluded: "=life_support_excluded", device: "=device_required"}
        Commercial Capacity Bidding Program: {min_kw: "=min_committed_kw", life_support_excluded: "=life_support_excluded", device: "=device_required"}
        Base Interruptible Program: {min_kw: "=min_committed_kw", life_support_excluded: "=life_support_excluded", device: "=device_required"}

  - id: dr_activation_rule
    subject: [dr_activation, dr_enrollment_bonus]
    rule: >-
      An enrollment without a device requirement becomes active on its enrollment date. An enrollment with a
      device requirement becomes active when the device is installed and communicating, which must happen no
      later than the device installation period after the enrollment date. The period is counted in calendar days
      from the day after the enrollment date, and a device communicating on the last day is in time. An enrollment
      whose device is not installed in time lapses as unenrolled. The enrollment bonus is earned once on
      activation, and only for an enrollment in active status.
    eligibility:
      - id: device_in_time
        applies_to: [dr_activation]
        kind: time
        condition: "An enrollment with a device requirement becomes active when the device is installed and communicating, which must happen no later than the device installation period after the enrollment date."
        evidence_fields: [dr_enrollments.enrolled_date, dr_enrollments.dr_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dr_enrollments.dr_enrollment_id]
          action_bindings:
            dr_enrollments.dr_enrollment_id: dr_enrollment_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the enrollment date
          anchor_source: dr_enrollments.enrolled_date
          relation: not_after
          duration_source: variants.device_install_days
          unit: calendar_days
          counting_rule: "The period is counted in calendar days from the day after the enrollment date, and a device communicating on the last day is in time."
          boundary: inclusive
      - id: bonus_on_active
        applies_to: [dr_enrollment_bonus]
        kind: state
        condition: "The enrollment bonus is earned once on activation, and only for an enrollment in active status."
        evidence_fields: [dr_enrollments.status, dr_enrollments.dr_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dr_enrollments.dr_enrollment_id]
          action_bindings:
            dr_enrollments.dr_enrollment_id: dr_enrollment_id
        state_contract:
          field: dr_enrollments.status
          allowed: [active]
    params:
      per_tier:
        Peak Time Rebate: {install_days: "=device_install_days", bonus: "=enrollment_bonus_usd"}
        Smart Thermostat Rewards: {install_days: "=device_install_days", bonus: "=enrollment_bonus_usd"}
        AC Cycling Program: {install_days: "=device_install_days", bonus: "=enrollment_bonus_usd"}
        Home Battery Dispatch: {install_days: "=device_install_days", bonus: "=enrollment_bonus_usd"}
        Commercial Capacity Bidding Program: {install_days: "=device_install_days", bonus: "=enrollment_bonus_usd"}
        Base Interruptible Program: {install_days: "=device_install_days", bonus: "=enrollment_bonus_usd"}

  - id: dr_events_and_participation
    subject: [dr_event_participation]
    rule: >-
      Events are called only within event_season, on event_days and inside event_window_hours, with
      advance_notice_hours of notice through event_notification_channels, and never beyond max_events_per_season,
      max_event_hours_per_season or max_event_duration_hours. Each event is recorded once per enrollment, with the
      baseline under baseline_method. Participation is recorded only for an enrollment in active status. Where
      opt_out_allowed is true the customer may opt out of an event, and opt-outs beyond max_opt_outs_per_season
      (dr_msr_season_opt_outs) carry opt_out_excess_consequence. Battery dispatch never draws the battery below
      battery_reserve_pct, thermostat events never move the setpoint more than max_setpoint_offset_f, and cycling
      events switch the compressor off for cycling_pct of each half-hour.
    eligibility:
      - id: record_active_enrollment
        applies_to: [dr_event_participation]
        kind: state
        condition: "Participation is recorded only for an enrollment in active status."
        evidence_fields: [dr_enrollments.status, dr_enrollments.dr_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dr_enrollments.dr_enrollment_id]
          action_bindings:
            dr_enrollments.dr_enrollment_id: dr_enrollment_id
        state_contract:
          field: dr_enrollments.status
          allowed: [active]
    params:
      per_tier:
        Peak Time Rebate: {max_events: "=max_events_per_season", max_hours: "=max_event_hours_per_season", opt_outs: "=max_opt_outs_per_season", notice_hours: "=advance_notice_hours"}
        Smart Thermostat Rewards: {max_events: "=max_events_per_season", max_hours: "=max_event_hours_per_season", opt_outs: "=max_opt_outs_per_season", notice_hours: "=advance_notice_hours"}
        AC Cycling Program: {max_events: "=max_events_per_season", max_hours: "=max_event_hours_per_season", opt_outs: "=max_opt_outs_per_season", notice_hours: "=advance_notice_hours"}
        Home Battery Dispatch: {max_events: "=max_events_per_season", max_hours: "=max_event_hours_per_season", opt_outs: "=max_opt_outs_per_season", notice_hours: "=advance_notice_hours"}
        Commercial Capacity Bidding Program: {max_events: "=max_events_per_season", max_hours: "=max_event_hours_per_season", opt_outs: "=max_opt_outs_per_season", notice_hours: "=advance_notice_hours"}
        Base Interruptible Program: {max_events: "=max_events_per_season", max_hours: "=max_event_hours_per_season", opt_outs: "=max_opt_outs_per_season", notice_hours: "=advance_notice_hours"}
    measures: [dr_msr_season_events, dr_msr_season_opt_outs]

  - id: dr_incentive_calculation
    subject: [dr_event_incentive, dr_seasonal_incentive]
    rule: >-
      Peak Time Rebate pays event_incentive_usd_per_kwh on the event's baseline_kwh less actual_kwh when positive,
      per event. AC Cycling pays monthly_participation_credit_usd for each bill in participation_credit_months while
      active. Smart Thermostat Rewards pays seasonal_incentive_usd after a season in which opt-outs stayed within
      max_opt_outs_per_season. Home Battery Dispatch pays performance_incentive_usd_per_kw_season times
      dr_msr_season_average_delivered_kw after the season. The capacity programs pay
      capacity_payment_usd_per_kw_month times committed_kw for each program month and, for the Commercial Capacity
      Bidding Program, energy_payment_usd_per_kwh on reduction delivered in events. Test events earn no event
      incentive. Each event, month or season earns its incentive once. All amounts are rounded to the cent.
    eligibility: []
    params:
      per_tier:
        Peak Time Rebate: {per_kwh: "=event_incentive_usd_per_kwh", monthly: "=monthly_participation_credit_usd", seasonal: "=seasonal_incentive_usd", per_kw_season: "=performance_incentive_usd_per_kw_season", capacity: "=capacity_payment_usd_per_kw_month"}
        Smart Thermostat Rewards: {per_kwh: "=event_incentive_usd_per_kwh", monthly: "=monthly_participation_credit_usd", seasonal: "=seasonal_incentive_usd", per_kw_season: "=performance_incentive_usd_per_kw_season", capacity: "=capacity_payment_usd_per_kw_month"}
        AC Cycling Program: {per_kwh: "=event_incentive_usd_per_kwh", monthly: "=monthly_participation_credit_usd", seasonal: "=seasonal_incentive_usd", per_kw_season: "=performance_incentive_usd_per_kw_season", capacity: "=capacity_payment_usd_per_kw_month"}
        Home Battery Dispatch: {per_kwh: "=event_incentive_usd_per_kwh", monthly: "=monthly_participation_credit_usd", seasonal: "=seasonal_incentive_usd", per_kw_season: "=performance_incentive_usd_per_kw_season", capacity: "=capacity_payment_usd_per_kw_month"}
        Commercial Capacity Bidding Program: {per_kwh: "=event_incentive_usd_per_kwh", monthly: "=monthly_participation_credit_usd", seasonal: "=seasonal_incentive_usd", per_kw_season: "=performance_incentive_usd_per_kw_season", capacity: "=capacity_payment_usd_per_kw_month"}
        Base Interruptible Program: {per_kwh: "=event_incentive_usd_per_kwh", monthly: "=monthly_participation_credit_usd", seasonal: "=seasonal_incentive_usd", per_kw_season: "=performance_incentive_usd_per_kw_season", capacity: "=capacity_payment_usd_per_kw_month"}
    formula:
      ptr_rebate: "round(event_incentive_usd_per_kwh * max(0, baseline_kwh - actual_kwh), 2)"
      capacity_payment: "round(capacity_payment_usd_per_kw_month * committed_kw, 2)"
      battery_incentive: "round(performance_incentive_usd_per_kw_season * dr_msr_season_average_delivered_kw, 2)"
    measures: [dr_msr_season_average_delivered_kw]

  - id: dr_penalty_rule
    subject: [dr_nonperformance_penalty, dr_negative_balance_billing]
    rule: >-
      In the Commercial Capacity Bidding Program an event whose delivered reduction falls short of the commitment is
      charged penalty_usd_per_kw_shortfall per kW of shortfall, and penalties in a program month never exceed that
      month's capacity payment. In the Base Interruptible Program every kWh used above the firm service level during
      an event is charged excess_energy_charge_usd_per_kwh without cap. Each event is penalised at most once per
      enrollment. Residential programs carry no penalties. A negative incentive balance is billed to the service
      agreement under negative_balance_handling.
    eligibility:
      - id: penalise_event_once
        applies_to: [dr_nonperformance_penalty]
        kind: dedup
        condition: "Each event is penalised at most once per enrollment."
        evidence_fields: [dr_ledger.dr_enrollment_id, dr_ledger.dr_event_code, dr_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dr_ledger.dr_enrollment_id, dr_ledger.dr_event_code]
          action_bindings:
            dr_ledger.dr_enrollment_id: dr_enrollment_id
            dr_ledger.dr_event_code: dr_event_code
        dedup_contract:
          table: dr_ledger
          mode: separate_record
          object_bindings: {dr_enrollment_id: dr_enrollment_id, dr_event_code: dr_event_code}
          duplicate_filters: {event_type: [dr_nonperformance_penalty]}
          distinct_fields: []
    params:
      per_tier:
        Peak Time Rebate: {shortfall_rate: "=penalty_usd_per_kw_shortfall", excess_rate: "=excess_energy_charge_usd_per_kwh"}
        Smart Thermostat Rewards: {shortfall_rate: "=penalty_usd_per_kw_shortfall", excess_rate: "=excess_energy_charge_usd_per_kwh"}
        AC Cycling Program: {shortfall_rate: "=penalty_usd_per_kw_shortfall", excess_rate: "=excess_energy_charge_usd_per_kwh"}
        Home Battery Dispatch: {shortfall_rate: "=penalty_usd_per_kw_shortfall", excess_rate: "=excess_energy_charge_usd_per_kwh"}
        Commercial Capacity Bidding Program: {shortfall_rate: "=penalty_usd_per_kw_shortfall", excess_rate: "=excess_energy_charge_usd_per_kwh"}
        Base Interruptible Program: {shortfall_rate: "=penalty_usd_per_kw_shortfall", excess_rate: "=excess_energy_charge_usd_per_kwh"}
    formula:
      cbp_shortfall_penalty: "round(penalty_usd_per_kw_shortfall * max(0, committed_kw - delivered_kw), 2)"

  - id: dr_payout_rule
    subject: [dr_incentive_payout]
    rule: >-
      Earned incentives are paid under incentive_payout_method and payout_frequency once the balance reaches
      payout_minimum_usd; smaller balances carry. Bill credits post to the enrolled service agreement and checks
      are mailed to the mailing address on the customer profile. The payout is the whole positive balance. A
      payout is made only while the enrollment is active or within the closing settlement after it ends.
    eligibility:
      - id: payout_settled_enrollment
        applies_to: [dr_incentive_payout]
        kind: state
        condition: "A payout is made only while the enrollment is active or within the closing settlement after it ends."
        evidence_fields: [dr_enrollments.status, dr_enrollments.dr_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dr_enrollments.dr_enrollment_id]
          action_bindings:
            dr_enrollments.dr_enrollment_id: dr_enrollment_id
        state_contract:
          field: dr_enrollments.status
          allowed: [active, unenrolled, removed]
    params:
      per_tier:
        Peak Time Rebate: {minimum: "=payout_minimum_usd", method: "=incentive_payout_method"}
        Smart Thermostat Rewards: {minimum: "=payout_minimum_usd", method: "=incentive_payout_method"}
        AC Cycling Program: {minimum: "=payout_minimum_usd", method: "=incentive_payout_method"}
        Home Battery Dispatch: {minimum: "=payout_minimum_usd", method: "=incentive_payout_method"}
        Commercial Capacity Bidding Program: {minimum: "=payout_minimum_usd", method: "=incentive_payout_method"}
        Base Interruptible Program: {minimum: "=payout_minimum_usd", method: "=incentive_payout_method"}

  - id: dr_exit_rules
    subject: [dr_unenrollment, dr_removal, dr_bonus_clawback, dr_commitment_change]
    rule: >-
      The customer may leave a program at any time under unenrollment_effective_rule; leaving is the customer's own
      decision. Leaving within bonus_clawback_months of activation forfeits the enrollment bonus. The company
      removes an enrollment when dr_msr_consecutive_nonperformance reaches removal_nonperformance_events, when
      opt-outs exceed the limit where the excess consequence is removal, or when the service agreement closes. A
      bonus is clawed back once per enrollment. Committed kW changes follow commitment_change_rule and are made only
      on an active enrollment, never below min_committed_kw.
    eligibility:
      - id: change_active_only
        applies_to: [dr_commitment_change]
        kind: state
        condition: "Committed kW changes follow commitment_change_rule and are made only on an active enrollment, never below min_committed_kw."
        evidence_fields: [dr_enrollments.status, dr_enrollments.dr_enrollment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [dr_enrollments.dr_enrollment_id]
          action_bindings:
            dr_enrollments.dr_enrollment_id: dr_enrollment_id
        state_contract:
          field: dr_enrollments.status
          allowed: [active]
    params:
      per_tier:
        Peak Time Rebate: {clawback_months: "=bonus_clawback_months", nonperformance: "=removal_nonperformance_events"}
        Smart Thermostat Rewards: {clawback_months: "=bonus_clawback_months", nonperformance: "=removal_nonperformance_events"}
        AC Cycling Program: {clawback_months: "=bonus_clawback_months", nonperformance: "=removal_nonperformance_events"}
        Home Battery Dispatch: {clawback_months: "=bonus_clawback_months", nonperformance: "=removal_nonperformance_events"}
        Commercial Capacity Bidding Program: {clawback_months: "=bonus_clawback_months", nonperformance: "=removal_nonperformance_events"}
        Base Interruptible Program: {clawback_months: "=bonus_clawback_months", nonperformance: "=removal_nonperformance_events"}
    measures: [dr_msr_consecutive_nonperformance]
