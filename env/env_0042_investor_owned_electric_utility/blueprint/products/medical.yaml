events:
  # ---- holding (medical_certifications) -----------------------------------------------
  - type: medical_application
    target: medical_certifications
    mutation: create
    meaning: A customer applies to register a medical protection on a residential service agreement.
    grain: One row per application.
    fields:
      customer_id: Customer of record on the service agreement.
      service_account_id: Service agreement where the patient lives.
      variant_name: Protection applied for, official full name.
      application_date: Date of the application.
      qualifying_device_count: Number of qualifying devices stated on the application.
      status_date: Date of the application.
    triggers: []
  - type: medical_certification_approval
    target: medical_certifications
    mutation: {transition: {from: pending_certification, to: active}}
    meaning: A valid practitioner certification is registered and the protection becomes active.
    grain: One row per transaction.
    fields:
      certified_date: Date the practitioner signed (or verbally gave) the certification.
      expiration_date: Last day of the certification term.
      practitioner_license_number: License number of the certifying practitioner, as written on the form.
      status_date: Date the certification was registered.
    triggers: []
  - type: medical_certification_denial
    target: medical_certifications
    mutation: {transition: {from: pending_certification, to: denied}}
    meaning: The application is denied because no valid certification arrived in time.
    grain: One row per transaction.
    fields:
      denial_reason: Why the application was denied.
      status_date: Date of denial.
    triggers: []
  - type: medical_recertification
    target: medical_certifications
    mutation: update
    meaning: An active certification is renewed with a new practitioner form before it expires.
    grain: One row per transaction.
    fields:
      certified_date: Date of the new certification.
      expiration_date: New last day of the term.
      practitioner_license_number: License number of the certifying practitioner.
      qualifying_device_count: Devices certified on the new form.
    triggers: []
  - type: medical_expiration
    target: medical_certifications
    mutation: {transition: {from: active, to: expired}}
    meaning: The certification term ends without recertification.
    grain: One row per transaction.
    fields:
      status_date: Day after the expiration date.
    triggers: []
  - type: medical_reactivation
    target: medical_certifications
    mutation: {transition: {from: expired, to: active}}
    meaning: A recertification received within the grace period reactivates an expired protection.
    grain: One row per transaction.
    fields:
      certified_date: Date of the new certification.
      expiration_date: New last day of the term.
      practitioner_license_number: License number of the certifying practitioner.
      status_date: Date of reactivation.
    triggers: []
  - type: medical_withdrawal
    target: medical_certifications
    mutation: {transition: {from: active, to: withdrawn}}
    meaning: The customer cancels the protection or reports that the patient has moved out.
    grain: One row per transaction.
    fields:
      status_date: Date of withdrawal.
    triggers: []
  # ---- event log (medical_events) -------------------------------------------------------
  - type: medical_disconnection_postponement
    target: medical_events
    meaning: A disconnection for nonpayment is postponed under the protection.
    grain: One row per postponement granted.
    distinguish_by: [notice_id, postponement_start]
    fields:
      notice_id: The written disconnection notice being postponed.
      postponement_start: First day of the postponement.
      postponement_end: Last day of the postponement.
      event_date: Date the postponement was granted.
    triggers:
      - event: service:service_notice_rescission
        map: {last_status_date: postponement_start}
  - type: medical_allowance_application
    target: medical_events
    meaning: The medical baseline allowance is computed and applied to one bill.
    grain: One row per bill.
    distinguish_by: [bill_id]
    fields:
      bill_id: The service bill receiving the allowance.
      allowance_kwh: Allowance applied to the bill, kWh.
      event_date: Bill date.
    triggers: []
  - type: medical_recertification_reminder
    target: medical_events
    meaning: The customer is reminded that the certification will expire.
    grain: One row per certification term.
    distinguish_by: [event_date]
    fields:
      event_date: Date the reminder was sent.
    triggers: []
  - type: medical_outage_notification
    target: medical_events
    meaning: The customer is individually notified of a planned maintenance outage or public safety power shutoff.
    grain: One row per outage notified.
    distinguish_by: [planned_outage_start]
    fields:
      event_date: Date the notification was delivered.
      planned_outage_start: Date and time the outage is planned to begin.
      outage_notice_kind: Planned maintenance or public safety shutoff.
    triggers: []
  - type: medical_premises_contact
    target: medical_events
    meaning: A personal contact attempt required before disconnection is made.
    grain: One row per contact attempt.
    distinguish_by: [contact_time]
    fields:
      notice_id: The written disconnection notice the contact relates to.
      contact_time: Date and time of the attempt.
      contact_method: Phone call or premises visit.
      contact_outcome: Whether an adult at the address or the customer was reached.
      event_date: Date of the attempt.
    triggers: []

measures:
  - id: medical_msr_postponements_12m
    window: The 12 calendar months ending on the handling date.
    measure: Count of medical_disconnection_postponement rows on the service agreement whose postponement_start falls in the window, together with the sum of their days (postponement_end minus postponement_start plus one).
  - id: medical_msr_contact_attempts
    window: Since the notice date of the written disconnection notice under review.
    measure: Count of medical_premises_contact rows referencing that notice, with attempts closer together than contact_attempt_spacing_hours counted once.
  - id: medical_msr_customer_allowance_agreements
    window: The customer's portfolio on the handling date.
    measure: Count of the customer's service agreements holding a medical certification in pending_certification or active status of a kind with an allowance above zero.

policies:
  - id: medical_agg_multi_holding
    subject: [medical_application]
    rule: >-
      A customer may hold medical protections on more than one service agreement only where a patient lives
      full time at each address. No other certification on the same service agreement is in
      pending_certification or active status. A customer moving from a certificate to an allowance or a
      life-support registration withdraws the first before applying for the second.
    eligibility:
      - id: one_open_certification_per_agreement
        applies_to: [medical_application]
        kind: dedup
        condition: "No other certification on the same service agreement is in pending_certification or active status."
        evidence_fields: [medical_certifications.service_account_id, medical_certifications.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [medical_certifications.service_account_id]
          action_bindings:
            medical_certifications.service_account_id: service_account_id
        dedup_contract:
          table: medical_certifications
          mode: separate_record
          object_bindings: {service_account_id: service_account_id}
          duplicate_filters: {status: [pending_certification, active]}
          distinct_fields: [application_date]
    params:
      max_per_customer: null

  - id: medical_agg_single_allowance
    subject: [medical_application, medical_allowance_application]
    rule: >-
      The medical baseline allowance follows the patient's full-time residence, so a customer receives an
      allowance on only one service agreement at a time: an application for an allowance kind is not accepted
      while medical_msr_customer_allowance_agreements is already one or more. Protections without an allowance
      (the Medical Emergency Certificate) are judged per agreement.
    eligibility: []
    measures: [medical_msr_customer_allowance_agreements]

  - id: medical_application_and_certification
    subject: [medical_application, medical_certification_approval, medical_certification_denial]
    rule: >-
      A protection may be registered only on a residential service agreement in active, notice_pending or
      disconnected status whose schedule is among eligible_schedules, for a patient meeting
      household_member_rule. Applications are accepted only for a service agreement that is not closed or
      pending_start. The protection becomes active only on a certification from a practitioner listed in
      practitioner_types whose license number passes practitioner_license_verification; the customer's own
      statement never substitutes for it. A valid certification must be received no later than the
      certification due period after the application date. The period is counted in calendar days from the
      day after the application date, and a certification received on the last day is in time. Where
      verbal_certification_accepted is true a practitioner's call registers the protection, which lapses as
      denied if the written form does not follow within written_follow_up_days. The expiration date is the
      certified date plus certification_term_months calendar months, less one day.
    eligibility:
      - id: open_service_agreement
        applies_to: [medical_application]
        kind: state
        condition: "Applications are accepted only for a service agreement that is not closed or pending_start."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active, notice_pending, disconnected]
      - id: certification_in_time
        applies_to: [medical_certification_approval]
        kind: time
        condition: "A valid certification must be received no later than the certification due period after the application date."
        evidence_fields: [medical_certifications.application_date, medical_certifications.medical_certification_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [medical_certifications.medical_certification_id]
          action_bindings:
            medical_certifications.medical_certification_id: medical_certification_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the application date
          anchor_source: medical_certifications.application_date
          relation: not_after
          duration_source: variants.certification_due_days
          unit: calendar_days
          counting_rule: "The period is counted in calendar days from the day after the application date, and a certification received on the last day is in time."
          boundary: inclusive
    params:
      per_tier:
        Medical Emergency Certificate: {due_days: "=certification_due_days", term_months: "=certification_term_months", verbal: "=verbal_certification_accepted"}
        Standard Medical Baseline Allowance: {due_days: "=certification_due_days", term_months: "=certification_term_months", verbal: "=verbal_certification_accepted"}
        Heating and Cooling Medical Baseline Allowance: {due_days: "=certification_due_days", term_months: "=certification_term_months", verbal: "=verbal_certification_accepted"}
        Combined Medical Baseline Allowance: {due_days: "=certification_due_days", term_months: "=certification_term_months", verbal: "=verbal_certification_accepted"}
        Life-Support Registration: {due_days: "=certification_due_days", term_months: "=certification_term_months", verbal: "=verbal_certification_accepted"}
        Critical Care Life-Support Registration: {due_days: "=certification_due_days", term_months: "=certification_term_months", verbal: "=verbal_certification_accepted"}

  - id: medical_recertification_rule
    subject: [medical_recertification, medical_expiration, medical_reactivation, medical_recertification_reminder]
    rule: >-
      A reminder is sent recertification_notice_days before the expiration date. A new practitioner form
      received while the certification is active extends the term to the new certified date plus
      certification_term_months, less one day. Without one, the certification expires on the day after its
      expiration date. A late recertification reactivates an expired protection only within the
      recertification grace period after the expiration date. The grace period is counted in calendar days from
      the day after the expiration date, and a form received on the last day is in time. Protections do not
      apply during the lapse between expiration and reactivation.
    eligibility:
      - id: within_grace
        applies_to: [medical_reactivation]
        kind: time
        condition: "A late recertification reactivates an expired protection only within the recertification grace period after the expiration date."
        evidence_fields: [medical_certifications.expiration_date, medical_certifications.medical_certification_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [medical_certifications.medical_certification_id]
          action_bindings:
            medical_certifications.medical_certification_id: medical_certification_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the expiration date
          anchor_source: medical_certifications.expiration_date
          relation: not_after
          duration_source: variants.recertification_grace_days
          unit: calendar_days
          counting_rule: "The grace period is counted in calendar days from the day after the expiration date, and a form received on the last day is in time."
          boundary: inclusive
    params:
      per_tier:
        Medical Emergency Certificate: {notice_days: "=recertification_notice_days", grace_days: "=recertification_grace_days"}
        Standard Medical Baseline Allowance: {notice_days: "=recertification_notice_days", grace_days: "=recertification_grace_days"}
        Heating and Cooling Medical Baseline Allowance: {notice_days: "=recertification_notice_days", grace_days: "=recertification_grace_days"}
        Combined Medical Baseline Allowance: {notice_days: "=recertification_notice_days", grace_days: "=recertification_grace_days"}
        Life-Support Registration: {notice_days: "=recertification_notice_days", grace_days: "=recertification_grace_days"}
        Critical Care Life-Support Registration: {notice_days: "=recertification_notice_days", grace_days: "=recertification_grace_days"}

  - id: medical_allowance_rule
    subject: [medical_allowance_application]
    rule: >-
      Each bill of an agreement with an active allowance kind receives allowance_kwh_per_day_summer or
      allowance_kwh_per_day_winter (by the bill's season) times the certified devices, up to max_devices_counted,
      times the days in the billing period, plus electric_heat_bonus_kwh_per_day times the days on winter bills of
      agreements whose space_heating is electric, rounded to whole kWh and capped at allowance_cap_kwh_per_bill.
      The allowance is recorded on the bill as medical_allowance_kwh and raises its inclining-block threshold.
      Each bill receives the allowance once, and only while the certification is active.
    eligibility:
      - id: allowance_while_active
        applies_to: [medical_allowance_application]
        kind: state
        condition: "Each bill receives the allowance once, and only while the certification is active."
        evidence_fields: [medical_certifications.status, medical_certifications.medical_certification_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [medical_certifications.medical_certification_id]
          action_bindings:
            medical_certifications.medical_certification_id: medical_certification_id
        state_contract:
          field: medical_certifications.status
          allowed: [active]
    params:
      per_tier:
        Medical Emergency Certificate: {summer: "=allowance_kwh_per_day_summer", winter: "=allowance_kwh_per_day_winter", heat_bonus: "=electric_heat_bonus_kwh_per_day", devices: "=max_devices_counted", cap: "=allowance_cap_kwh_per_bill"}
        Standard Medical Baseline Allowance: {summer: "=allowance_kwh_per_day_summer", winter: "=allowance_kwh_per_day_winter", heat_bonus: "=electric_heat_bonus_kwh_per_day", devices: "=max_devices_counted", cap: "=allowance_cap_kwh_per_bill"}
        Heating and Cooling Medical Baseline Allowance: {summer: "=allowance_kwh_per_day_summer", winter: "=allowance_kwh_per_day_winter", heat_bonus: "=electric_heat_bonus_kwh_per_day", devices: "=max_devices_counted", cap: "=allowance_cap_kwh_per_bill"}
        Combined Medical Baseline Allowance: {summer: "=allowance_kwh_per_day_summer", winter: "=allowance_kwh_per_day_winter", heat_bonus: "=electric_heat_bonus_kwh_per_day", devices: "=max_devices_counted", cap: "=allowance_cap_kwh_per_bill"}
        Life-Support Registration: {summer: "=allowance_kwh_per_day_summer", winter: "=allowance_kwh_per_day_winter", heat_bonus: "=electric_heat_bonus_kwh_per_day", devices: "=max_devices_counted", cap: "=allowance_cap_kwh_per_bill"}
        Critical Care Life-Support Registration: {summer: "=allowance_kwh_per_day_summer", winter: "=allowance_kwh_per_day_winter", heat_bonus: "=electric_heat_bonus_kwh_per_day", devices: "=max_devices_counted", cap: "=allowance_cap_kwh_per_bill"}

  - id: medical_postponement_rule
    subject: [medical_disconnection_postponement]
    rule: >-
      While a written disconnection notice is pending, an active protection entitles the customer to a
      postponement of postponement_days starting under postponement_start_rule. Postponements are granted only
      while the certification is active. Within any 12 months, no more than one plus
      postponement_renewals_per_12_months postponements and no more than postponement_max_total_days_12_months
      postponement days are granted (medical_msr_postponements_12m); a renewal requires a new practitioner form
      where certificate_renewal_requires_new_form is true. A postponement rescinds the pending notice, and where
      postponement_requires_new_notice_after is true any later disconnection needs a new written notice. A payment
      arrangement is offered with every postponement. A postponement never reduces the balance owed.
    eligibility:
      - id: postpone_while_active
        applies_to: [medical_disconnection_postponement]
        kind: state
        condition: "Postponements are granted only while the certification is active."
        evidence_fields: [medical_certifications.status, medical_certifications.medical_certification_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [medical_certifications.medical_certification_id]
          action_bindings:
            medical_certifications.medical_certification_id: medical_certification_id
        state_contract:
          field: medical_certifications.status
          allowed: [active]
    params:
      per_tier:
        Medical Emergency Certificate: {days: "=postponement_days", renewals: "=postponement_renewals_per_12_months", max_days: "=postponement_max_total_days_12_months"}
        Standard Medical Baseline Allowance: {days: "=postponement_days", renewals: "=postponement_renewals_per_12_months", max_days: "=postponement_max_total_days_12_months"}
        Heating and Cooling Medical Baseline Allowance: {days: "=postponement_days", renewals: "=postponement_renewals_per_12_months", max_days: "=postponement_max_total_days_12_months"}
        Combined Medical Baseline Allowance: {days: "=postponement_days", renewals: "=postponement_renewals_per_12_months", max_days: "=postponement_max_total_days_12_months"}
        Life-Support Registration: {days: "=postponement_days", renewals: "=postponement_renewals_per_12_months", max_days: "=postponement_max_total_days_12_months"}
        Critical Care Life-Support Registration: {days: "=postponement_days", renewals: "=postponement_renewals_per_12_months", max_days: "=postponement_max_total_days_12_months"}
    measures: [medical_msr_postponements_12m]

  - id: medical_disconnection_safeguards
    subject: [medical_premises_contact, medical_outage_notification]
    rule: >-
      Where bars_disconnection_while_active is true, no disconnection for nonpayment of the agreement is
      performed while the registration is active. Where premises_contact_required_before_disconnection is true,
      disconnection may proceed only after medical_msr_contact_attempts reaches contact_attempts_before_disconnection
      with attempts at least contact_attempt_spacing_hours apart. Where restores_disconnected_service is true, a
      protection registered after a disconnection requires service to be restored within restoration_hours, and
      where reconnection_fee_waived is true no reconnection charge applies. Individual outage notices are sent
      planned_outage_notice_hours before planned maintenance outages, and for public safety shutoffs where
      public_safety_shutoff_notification is true, under outage_notification_contact_rule; an outage is notified
      once. Contact attempts and notices are recorded only for an agreement whose certification is active.
    eligibility:
      - id: safeguards_while_active
        applies_to: [medical_premises_contact, medical_outage_notification]
        kind: state
        condition: "Contact attempts and notices are recorded only for an agreement whose certification is active."
        evidence_fields: [medical_certifications.status, medical_certifications.medical_certification_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [medical_certifications.medical_certification_id]
          action_bindings:
            medical_certifications.medical_certification_id: medical_certification_id
        state_contract:
          field: medical_certifications.status
          allowed: [active]
    params:
      per_tier:
        Medical Emergency Certificate: {bars: "=bars_disconnection_while_active", attempts: "=contact_attempts_before_disconnection", restores: "=restores_disconnected_service", outage_hours: "=planned_outage_notice_hours"}
        Standard Medical Baseline Allowance: {bars: "=bars_disconnection_while_active", attempts: "=contact_attempts_before_disconnection", restores: "=restores_disconnected_service", outage_hours: "=planned_outage_notice_hours"}
        Heating and Cooling Medical Baseline Allowance: {bars: "=bars_disconnection_while_active", attempts: "=contact_attempts_before_disconnection", restores: "=restores_disconnected_service", outage_hours: "=planned_outage_notice_hours"}
        Combined Medical Baseline Allowance: {bars: "=bars_disconnection_while_active", attempts: "=contact_attempts_before_disconnection", restores: "=restores_disconnected_service", outage_hours: "=planned_outage_notice_hours"}
        Life-Support Registration: {bars: "=bars_disconnection_while_active", attempts: "=contact_attempts_before_disconnection", restores: "=restores_disconnected_service", outage_hours: "=planned_outage_notice_hours"}
        Critical Care Life-Support Registration: {bars: "=bars_disconnection_while_active", attempts: "=contact_attempts_before_disconnection", restores: "=restores_disconnected_service", outage_hours: "=planned_outage_notice_hours"}
    measures: [medical_msr_contact_attempts]

  - id: medical_withdrawal_and_moves
    subject: [medical_withdrawal]
    rule: >-
      The customer may withdraw a protection at any time, and must report when the patient no longer lives at
      the address; withdrawal is the customer's own act and ends the protections under withdrawal_effect_rule.
      When the customer moves, a protection whose transfer_on_move_allowed is true is registered on the new
      service agreement from the same certification for the rest of its term, and the old registration is
      withdrawn; other protections end with the old agreement. When the service agreement closes, its
      protections are withdrawn on the stop date.
    eligibility: []
