# Medical and Life-Support Protections — practitioner-certified protections registered on a
# residential service agreement: temporary disconnection postponements, medical baseline
# allowances that raise the inclining-block threshold, and life-support registrations that bar
# disconnection and bring advance outage notifications. The category opens no account: the
# allowance is a per-bill entitlement recorded on each bill, not a balance.

category: medical
display_name: Medical and Life-Support Protections

binding:
  holding_table: medical_certifications
  event_tables: [medical_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_certification, active, denied, expired, withdrawn]
  transitions:
    - {from: pending_certification, to: active, by: agent, means: A valid practitioner certification is received and registered.}
    - {from: pending_certification, to: denied, by: system, means: No valid certification arrived within the certification due period.}
    - {from: active, to: expired, by: system, means: The certification term ended without recertification.}
    - {from: expired, to: active, by: agent, means: A recertification received within the grace period reactivates the protection.}
    - {from: active, to: withdrawn, by: user, means: The customer cancels the protection or the patient no longer lives at the address.}

accounts: []

parameter_schema:
  customer_type_eligible: Customer class that may register the protection.
  eligible_schedules: Rate schedules on which the protection may be registered.
  qualifying_conditions: Medical conditions or equipment that qualify.
  life_support_equipment_list: Equipment recognised as life support, or not applicable.
  household_member_rule: Who the patient must be in relation to the service address.
  practitioner_types: Licensed practitioners whose certification is accepted.
  practitioner_license_verification: How the practitioner's license number is checked.
  self_certification_allowed: Whether the customer's own statement is accepted in place of a practitioner certification (true/false).
  verbal_certification_accepted: Whether a practitioner's telephone certification is accepted pending the written form (true/false).
  written_follow_up_days: Calendar days after a verbal certification by which the written form must arrive; 0 when verbal certification is not accepted.
  certification_due_days: Calendar days after the application by which a valid certification must be received.
  certification_term_months: Months a certification stays valid from its certified date.
  certification_effective_rule: When the allowance and protections begin.
  recertification_notice_days: Calendar days before expiration that the recertification reminder is sent; 0 when no reminder is sent.
  recertification_grace_days: Calendar days after expiration within which a recertification reactivates the protection; 0 means none.
  certificate_renewal_requires_new_form: Whether every renewal or recertification needs a new practitioner form (true/false).
  expiry_effect_rule: What ends when a certification expires.
  allowance_kwh_per_day_summer: Medical baseline allowance per qualifying device per day on summer-season bills, kWh.
  allowance_kwh_per_day_winter: Medical baseline allowance per qualifying device per day on winter-season bills, kWh.
  electric_heat_bonus_kwh_per_day: Additional allowance per day on winter-season bills when the service agreement's space heating is electric, kWh.
  max_devices_counted: Most qualifying devices counted for the allowance.
  allowance_cap_kwh_per_bill: Largest allowance applied to one bill, kWh; 0 means no allowance.
  allowance_applies_to: What the allowance changes on the bill.
  allowance_proration_basis: How the allowance is computed for a billing period.
  allowance_rounding_rule: How the allowance is rounded.
  postponement_days: Calendar days a disconnection postponement lasts.
  postponement_renewals_per_12_months: Postponements that may follow the first one within any 12 months.
  postponement_max_total_days_12_months: Most postponement days in any rolling 12 months.
  postponement_start_rule: When a postponement starts.
  postponement_requires_new_notice_after: Whether disconnection after a postponement requires a new written notice (true/false).
  postponement_requires_arrangement_offer: Whether a payment arrangement must be offered when a postponement is granted (true/false).
  bars_disconnection_while_active: Whether no disconnection for nonpayment may be performed while the certification is active (true/false).
  restores_disconnected_service: Whether registering the protection after a disconnection requires service to be restored (true/false).
  restoration_hours: Hours within which service is restored when restores_disconnected_service applies; 0 otherwise.
  reconnection_fee_waived: Whether a restoration under this protection carries no reconnection charge (true/false).
  premises_contact_required_before_disconnection: Whether personal contact attempts are required before any disconnection of the agreement (true/false).
  contact_attempts_before_disconnection: Personal contact attempts (phone call or premises visit) required before disconnection; 0 when none.
  contact_attempt_spacing_hours: Minimum hours between required contact attempts; 0 when none.
  planned_outage_notice_hours: Hours before a planned maintenance outage by which the customer is notified; 0 means no individual notice.
  public_safety_shutoff_notification: Whether the customer receives individual notification of public safety power shutoffs (true/false).
  notice_copy_to_designee_allowed: Whether a designated third party may receive copies of disconnection and outage notices (true/false).
  arrangement_cure_extension_applies: Whether the payment arrangement program's medical cure extension applies while the certification is active (true/false).
  transfer_on_move_allowed: Whether the certification moves with the patient to the customer's new service agreement (true/false).
  application_channels: Channels through which an application is accepted.
  max_active_per_agreement: Certifications that may be pending or active at once on one service agreement.
  denial_reapplication_wait_days: Calendar days after a denial before a new application is accepted.
  withdrawal_effect_rule: What ends when the protection is withdrawn.
  outage_notification_contact_rule: How individual outage notifications are delivered.

