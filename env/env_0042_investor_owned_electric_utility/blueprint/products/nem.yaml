events:
  # ---- holding (nem_agreements) ---------------------------------------------------
  - type: nem_application
    target: nem_agreements
    mutation: create
    meaning: The customer applies to interconnect a renewable generating system under a net metering rider.
    grain: One row per interconnection application.
    fields:
      customer_id: Customer of record on the service agreement.
      service_account_id: Service agreement whose premise hosts the system.
      variant_name: Rider applied for, official full name.
      application_date: Date the application was received.
      system_capacity_kw_ac: Nameplate inverter capacity of the system, kW AC.
      generator_type: Generator technology.
      storage_capacity_kwh: Paired battery capacity, kWh; 0 when none.
      status_date: Date of the application.
    triggers:
      - event: nem:nem_application_fee
        map: {fee_date: application_date}
  - type: nem_approval
    target: nem_agreements
    mutation: {transition: {from: applied, to: approved}}
    meaning: Interconnection review approves the application.
    grain: One row per transaction.
    fields:
      approval_date: Date of approval.
      status_date: Date of approval.
    triggers: []
  - type: nem_rejection
    target: nem_agreements
    mutation: {transition: {from: applied, to: rejected}}
    meaning: Interconnection review rejects the application.
    grain: One row per transaction.
    fields:
      rejection_reason: Why the application was rejected.
      status_date: Date of rejection.
    triggers: []
  - type: nem_withdrawal
    target: nem_agreements
    mutation: {transition: [{from: applied, to: withdrawn}, {from: approved, to: withdrawn}]}
    meaning: The customer withdraws the application before the system operates.
    grain: One row per transaction.
    fields:
      status_date: Date of withdrawal.
    triggers: []
  - type: nem_approval_expiry
    target: nem_agreements
    mutation: {transition: {from: approved, to: expired}}
    meaning: An approval lapses because permission to operate was not obtained in time.
    grain: One row per transaction.
    fields:
      status_date: Day after the approval validity period ended.
    triggers: []
  - type: nem_permission_to_operate
    target: nem_agreements
    mutation: {transition: {from: approved, to: operating}}
    meaning: Permission to operate is issued and the system may export under the rider.
    grain: One row per transaction.
    fields:
      permission_to_operate_date: Date permission to operate was issued.
      true_up_month: Calendar month of the annual true-up.
      status_date: Date permission to operate was issued.
    triggers: []
  - type: nem_termination
    target: nem_agreements
    mutation: {transition: {from: operating, to: terminated}}
    meaning: The agreement ends and the credit bank is settled under the termination disposition.
    grain: One row per transaction.
    fields:
      status_date: Date of termination.
    triggers: []
  - type: nem_system_modification
    target: nem_agreements
    mutation: update
    meaning: The approved system capacity or paired storage of an operating agreement is changed within the modification limit.
    grain: One row per transaction.
    fields:
      system_capacity_kw_ac: New nameplate capacity, kW AC.
      storage_capacity_kwh: New paired battery capacity, kWh.
    triggers: []
  - type: nem_ownership_transfer
    target: nem_agreements
    mutation: update
    meaning: An operating agreement moves to the new owner of the premise who has started service at the address.
    grain: One row per transaction.
    fields:
      customer_id: The new owner's customer profile.
      service_account_id: The new owner's service agreement at the same address.
    triggers: []
  # ---- ledger (nem_ledger) ----------------------------------------------------------
  - type: nem_application_fee
    target: nem_ledger
    meaning: The interconnection application fee is charged to the service agreement.
    grain: One row per application.
    distinguish_by: [fee_date]
    fields:
      fee_date: Date the fee was charged (the application date).
      amount: Fee amount.
    triggers:
      - event: service:service_program_debit
        map: {posting_date: fee_date, amount: amount, charge_code: nem_application_fee, source_reference_id: nem_ledger_id}
  - type: nem_grid_access_charge
    target: nem_ledger
    meaning: The monthly grid access charge of a net billing rider is charged for one billing period.
    grain: One row per billing period of an operating agreement on a rider with a grid access charge.
    distinguish_by: [billing_period_end]
    fields:
      billing_period_end: Billing period the charge applies to.
      amount: Charge amount.
    triggers:
      - event: service:service_program_debit
        map: {posting_date: billing_period_end, amount: amount, charge_code: nem_grid_access_charge, source_reference_id: nem_ledger_id}
  - type: nem_export_credit
    target: nem_ledger
    meaning: Energy exported to the grid during one billing period is valued and banked.
    grain: One row per billing period of an operating agreement.
    distinguish_by: [billing_period_end]
    fields:
      billing_period_end: Billing period the exports belong to.
      export_kwh_on_peak: kWh exported during the rider's export on-peak window.
      export_kwh_off_peak: kWh exported during all other hours.
      credit_rate_on_peak: Rate applied to on-peak exports, USD per kWh.
      credit_rate_off_peak: Rate applied to off-peak exports, USD per kWh.
      amount: Export credit banked.
    account: nem_credit_bank
    direction: in
    triggers: []
  - type: nem_credit_application
    target: nem_ledger
    meaning: Banked credit is applied against the offsettable charges of one bill.
    grain: One row per bill (per service agreement for aggregated riders).
    distinguish_by: [bill_id]
    fields:
      billing_period_end: Billing period of the bill offset.
      bill_id: The service bill offset.
      amount: Credit applied.
    account: nem_credit_bank
    direction: out
    triggers:
      - event: service:service_program_credit
        map: {posting_date: billing_period_end, amount: amount, credit_code: nem_credit_applied, source_reference_id: nem_ledger_id}
  - type: nem_true_up_payout
    target: nem_ledger
    meaning: The residual bank is paid out at a true-up or termination.
    grain: One row per settlement paid out.
    distinguish_by: [settlement_date, settlement_kind]
    fields:
      settlement_date: Date of the settlement.
      settlement_kind: Anniversary true-up or termination.
      payout_method: Check or credit to the service agreement.
      amount: Amount paid out.
    account: nem_credit_bank
    direction: out
    triggers:
      - event: service:service_program_credit
        when: {payout_method: bill_credit}
        map: {posting_date: settlement_date, amount: amount, credit_code: nem_true_up_credit, source_reference_id: nem_ledger_id}
  - type: nem_true_up_forfeiture
    target: nem_ledger
    meaning: The residual bank is forfeited at a true-up or termination.
    grain: One row per settlement forfeited.
    distinguish_by: [settlement_date, settlement_kind]
    fields:
      settlement_date: Date of the settlement.
      settlement_kind: Anniversary true-up or termination.
      amount: Amount forfeited.
    account: nem_credit_bank
    direction: out
    triggers: []

measures:
  - id: nem_msr_annual_usage_kwh
    window: The annual_usage_lookback_billing_periods most recent regular bills of the service agreement before the application date.
    measure: Sum of kwh_total of those service_bill_issued rows; when fewer bills exist, the customer's stated annual load estimate is used.
  - id: nem_msr_bill_offsettable_charges
    window: One service bill.
    measure: The bill's energy_charge_amount plus rider_charge_amount, less any nem_credit_application already posted against that bill.
  - id: nem_msr_aggregated_agreements
    window: The customer's portfolio on the handling date.
    measure: Count of the customer's other service agreements in active or notice_pending status that meet aggregation_contiguity_rule.
  - id: nem_msr_bank_at_settlement
    window: The agreement's whole life up to the settlement date, inclusive of credit applied on bills dated that day.
    measure: The credit_bank_balance after every export credit and credit application dated on or before the settlement date.

policies:
  - id: nem_agg_multi_holding
    subject: [nem_application]
    rule: >-
      A customer may hold net metering agreements at several service agreements, one per service agreement.
      No other net metering agreement on the same service agreement is in applied, approved or operating
      status. A second system at the same premise is added by modification or by a new application after the
      first agreement terminates.
    eligibility:
      - id: one_open_agreement_per_service
        applies_to: [nem_application]
        kind: dedup
        condition: "No other net metering agreement on the same service agreement is in applied, approved or operating status."
        evidence_fields: [nem_agreements.service_account_id, nem_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_agreements.service_account_id]
          action_bindings:
            nem_agreements.service_account_id: service_account_id
        dedup_contract:
          table: nem_agreements
          mode: separate_record
          object_bindings: {service_account_id: service_account_id}
          duplicate_filters: {status: [applied, approved, operating]}
          distinct_fields: [application_date]
    params:
      max_per_customer: null

  - id: nem_agg_aggregated_allocation
    subject: [nem_credit_application]
    rule: >-
      Under a rider whose aggregation_allowed is true, banked credit offsets the offsettable charges of the
      generating service agreement first and then of the other aggregated service agreements of the same
      customer, up to aggregation_max_accounts of them, in the order of aggregation_allocation_basis, each up
      to nem_msr_bill_offsettable_charges of its bill for the same billing period. Agreements of another
      customer, agreements outside aggregation_contiguity_rule and closed agreements never receive credit.
      Under every other rider credit offsets only the generating service agreement.
    eligibility: []
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {aggregation: "=aggregation_allowed", max_accounts: "=aggregation_max_accounts"}
        Rider NEM-R Residential Net Energy Metering: {aggregation: "=aggregation_allowed", max_accounts: "=aggregation_max_accounts"}
        Rider NBT-R Residential Net Billing Tariff: {aggregation: "=aggregation_allowed", max_accounts: "=aggregation_max_accounts"}
        Rider NBT-C Commercial Net Billing Tariff: {aggregation: "=aggregation_allowed", max_accounts: "=aggregation_max_accounts"}
        Rider NEM-A Aggregated Net Energy Metering: {aggregation: "=aggregation_allowed", max_accounts: "=aggregation_max_accounts"}
        Rider NBT-L Large Customer Net Billing Tariff: {aggregation: "=aggregation_allowed", max_accounts: "=aggregation_max_accounts"}
    measures: [nem_msr_aggregated_agreements, nem_msr_bill_offsettable_charges]

  - id: nem_application_eligibility
    subject: [nem_application]
    rule: >-
      An application is accepted only under a rider whose open_to_new_applications is true and whose
      customer_type_eligible and entry requirements the customer and service agreement meet. Applications are
      accepted only for a service agreement in active status. The system capacity, generator type and battery
      capacity are taken from the customer's installer design as the customer states them. The capacity must
      lie between min_system_kw_ac and max_system_kw_ac, and capacity times production_factor_kwh_per_kw may not
      exceed size_cap_pct_of_annual_usage times nem_msr_annual_usage_kwh. A paired battery is accepted only
      where storage_allowed is true and up to max_storage_kwh. The service agreement may not hold a
      Non-Communicating Opt-Out Meter in service, because net metering requires a bidirectional communicating
      meter; a customer who wants net metering must first return to a communicating meter. Rider NEM-L
      Legacy Net Energy Metering accepts no new applications; an existing legacy agreement keeps its terms for
      grandfathering_years after permission to operate unless modification_loses_grandfathering applies.
    eligibility:
      - id: active_service_agreement
        applies_to: [nem_application]
        kind: state
        condition: "Applications are accepted only for a service agreement in active status."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active]
      - id: installer_design_stated
        applies_to: [nem_application]
        kind: caller_fact
        condition: "The system capacity, generator type and battery capacity are taken from the customer's installer design as the customer states them."
        evidence_fields: [nem_agreements.system_capacity_kw_ac, nem_agreements.service_account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [nem_agreements.service_account_id]
          action_bindings:
            nem_agreements.service_account_id: service_account_id
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {open: "=open_to_new_applications", min_kw: "=min_system_kw_ac", max_kw: "=max_system_kw_ac", size_cap: "=size_cap_pct_of_annual_usage", max_storage: "=max_storage_kwh"}
        Rider NEM-R Residential Net Energy Metering: {open: "=open_to_new_applications", min_kw: "=min_system_kw_ac", max_kw: "=max_system_kw_ac", size_cap: "=size_cap_pct_of_annual_usage", max_storage: "=max_storage_kwh"}
        Rider NBT-R Residential Net Billing Tariff: {open: "=open_to_new_applications", min_kw: "=min_system_kw_ac", max_kw: "=max_system_kw_ac", size_cap: "=size_cap_pct_of_annual_usage", max_storage: "=max_storage_kwh"}
        Rider NBT-C Commercial Net Billing Tariff: {open: "=open_to_new_applications", min_kw: "=min_system_kw_ac", max_kw: "=max_system_kw_ac", size_cap: "=size_cap_pct_of_annual_usage", max_storage: "=max_storage_kwh"}
        Rider NEM-A Aggregated Net Energy Metering: {open: "=open_to_new_applications", min_kw: "=min_system_kw_ac", max_kw: "=max_system_kw_ac", size_cap: "=size_cap_pct_of_annual_usage", max_storage: "=max_storage_kwh"}
        Rider NBT-L Large Customer Net Billing Tariff: {open: "=open_to_new_applications", min_kw: "=min_system_kw_ac", max_kw: "=max_system_kw_ac", size_cap: "=size_cap_pct_of_annual_usage", max_storage: "=max_storage_kwh"}
    formula:
      within_size_cap: "system_capacity_kw_ac * production_factor_kwh_per_kw <= size_cap_pct_of_annual_usage * nem_msr_annual_usage_kwh"
    measures: [nem_msr_annual_usage_kwh]

  - id: nem_application_fee_rule
    subject: [nem_application_fee]
    rule: >-
      Each application is charged application_fee_usd plus application_fee_per_kw_usd times the system
      capacity, rounded to the cent, on the application date. The fee is charged once per application and is
      not refunded on rejection, withdrawal or expiry. A modification within the modification limit carries no
      application fee.
    eligibility:
      - id: fee_once_per_application
        applies_to: [nem_application_fee]
        kind: dedup
        condition: "The fee is charged once per application and is not refunded on rejection, withdrawal or expiry."
        evidence_fields: [nem_ledger.nem_agreement_id, nem_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_ledger.nem_agreement_id]
          action_bindings:
            nem_ledger.nem_agreement_id: nem_agreement_id
        dedup_contract:
          table: nem_ledger
          mode: separate_record
          object_bindings: {nem_agreement_id: nem_agreement_id}
          duplicate_filters: {event_type: [nem_application_fee]}
          distinct_fields: []
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {fee: "=application_fee_usd", per_kw: "=application_fee_per_kw_usd"}
        Rider NEM-R Residential Net Energy Metering: {fee: "=application_fee_usd", per_kw: "=application_fee_per_kw_usd"}
        Rider NBT-R Residential Net Billing Tariff: {fee: "=application_fee_usd", per_kw: "=application_fee_per_kw_usd"}
        Rider NBT-C Commercial Net Billing Tariff: {fee: "=application_fee_usd", per_kw: "=application_fee_per_kw_usd"}
        Rider NEM-A Aggregated Net Energy Metering: {fee: "=application_fee_usd", per_kw: "=application_fee_per_kw_usd"}
        Rider NBT-L Large Customer Net Billing Tariff: {fee: "=application_fee_usd", per_kw: "=application_fee_per_kw_usd"}
    formula:
      amount: "round(application_fee_usd + application_fee_per_kw_usd * system_capacity_kw_ac, 2)"

  - id: nem_review_and_permission
    subject: [nem_approval, nem_rejection, nem_permission_to_operate, nem_approval_expiry, nem_withdrawal]
    rule: >-
      A complete application is reviewed within review_business_days business days. A deficient application
      not completed within application_completeness_business_days business days of the deficiency notice is
      rejected with rejection_reason incomplete_application; an application outside the size, type or rider
      limits is rejected with the matching reason. Applicants under riders with a liability insurance minimum
      or an external disconnect switch requirement must certify both before approval. Permission to operate
      requires a bidirectional meter in service at the address and, where inspection_required is true, a passed
      inspection. Permission to operate may be issued only no later than the approval validity period after
      the approval date. The period is counted in calendar months from the approval date, ending on the same
      day of the month approval_validity_months later or on the last day of a shorter month, and that last day
      is still in time. An approval not followed by permission to operate in time expires on the next day, and
      the customer must apply again under the rider then open. The true-up month is the calendar month of the
      permission to operate date. The customer may withdraw an application in applied or approved status at any
      time; withdrawal is the customer's own decision.
    eligibility:
      - id: pto_within_validity
        applies_to: [nem_permission_to_operate]
        kind: time
        condition: "Permission to operate may be issued only no later than the approval validity period after the approval date."
        evidence_fields: [nem_agreements.approval_date, nem_agreements.nem_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_agreements.nem_agreement_id]
          action_bindings:
            nem_agreements.nem_agreement_id: nem_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the approval date
          anchor_source: nem_agreements.approval_date
          relation: not_after
          duration_source: variants.approval_validity_months
          unit: calendar_months
          counting_rule: "The period is counted in calendar months from the approval date, ending on the same day of the month approval_validity_months later or on the last day of a shorter month, and that last day is still in time."
          boundary: inclusive
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {review_days: "=review_business_days", validity_months: "=approval_validity_months", inspection: "=inspection_required"}
        Rider NEM-R Residential Net Energy Metering: {review_days: "=review_business_days", validity_months: "=approval_validity_months", inspection: "=inspection_required"}
        Rider NBT-R Residential Net Billing Tariff: {review_days: "=review_business_days", validity_months: "=approval_validity_months", inspection: "=inspection_required"}
        Rider NBT-C Commercial Net Billing Tariff: {review_days: "=review_business_days", validity_months: "=approval_validity_months", inspection: "=inspection_required"}
        Rider NEM-A Aggregated Net Energy Metering: {review_days: "=review_business_days", validity_months: "=approval_validity_months", inspection: "=inspection_required"}
        Rider NBT-L Large Customer Net Billing Tariff: {review_days: "=review_business_days", validity_months: "=approval_validity_months", inspection: "=inspection_required"}

  - id: nem_export_credit_calculation
    subject: [nem_export_credit]
    rule: >-
      Each billing period of an operating agreement banks one export credit. Exported kWh are split into
      on-peak and off-peak exports under the rider's export_on_peak_window. Under credit_basis retail_energy_rate each kWh is valued at the service schedule's energy
      rate for the same season and period; under retail_energy_rate_less_nbc that rate less
      nonbypassable_charge_usd_kwh; under avoided_cost_export_rate at the rider's export_rate_on_peak_usd_kwh
      or export_rate_off_peak_usd_kwh. The rates used are recorded on the credit and the amount is rounded to
      the cent. Export credits are banked only for an agreement in operating status, and energy exported from a
      battery charged from the grid earns no credit where storage_grid_charging_export_allowed is false.
    eligibility:
      - id: credit_operating_only
        applies_to: [nem_export_credit]
        kind: state
        condition: "Export credits are banked only for an agreement in operating status, and energy exported from a battery charged from the grid earns no credit where storage_grid_charging_export_allowed is false."
        evidence_fields: [nem_agreements.status, nem_agreements.nem_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_agreements.nem_agreement_id]
          action_bindings:
            nem_agreements.nem_agreement_id: nem_agreement_id
        state_contract:
          field: nem_agreements.status
          allowed: [operating]
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {basis: "=credit_basis", nbc: "=nonbypassable_charge_usd_kwh", export_on_peak: "=export_rate_on_peak_usd_kwh", export_off_peak: "=export_rate_off_peak_usd_kwh"}
        Rider NEM-R Residential Net Energy Metering: {basis: "=credit_basis", nbc: "=nonbypassable_charge_usd_kwh", export_on_peak: "=export_rate_on_peak_usd_kwh", export_off_peak: "=export_rate_off_peak_usd_kwh"}
        Rider NBT-R Residential Net Billing Tariff: {basis: "=credit_basis", nbc: "=nonbypassable_charge_usd_kwh", export_on_peak: "=export_rate_on_peak_usd_kwh", export_off_peak: "=export_rate_off_peak_usd_kwh"}
        Rider NBT-C Commercial Net Billing Tariff: {basis: "=credit_basis", nbc: "=nonbypassable_charge_usd_kwh", export_on_peak: "=export_rate_on_peak_usd_kwh", export_off_peak: "=export_rate_off_peak_usd_kwh"}
        Rider NEM-A Aggregated Net Energy Metering: {basis: "=credit_basis", nbc: "=nonbypassable_charge_usd_kwh", export_on_peak: "=export_rate_on_peak_usd_kwh", export_off_peak: "=export_rate_off_peak_usd_kwh"}
        Rider NBT-L Large Customer Net Billing Tariff: {basis: "=credit_basis", nbc: "=nonbypassable_charge_usd_kwh", export_on_peak: "=export_rate_on_peak_usd_kwh", export_off_peak: "=export_rate_off_peak_usd_kwh"}
    formula:
      amount: "round(export_kwh_on_peak * credit_rate_on_peak + export_kwh_off_peak * credit_rate_off_peak, 2)"

  - id: nem_credit_application_rule
    subject: [nem_credit_application]
    rule: >-
      On each bill of an operating agreement, banked credit is applied up to nem_msr_bill_offsettable_charges
      of that bill, including the export credit banked for the same billing period. Credit never offsets the
      customer charge, demand charges, fees, program debits or past-due balances, and any unused bank carries to
      the next bill where monthly_carryover is true. Each bill is offset once.
    eligibility:
      - id: offset_each_bill_once
        applies_to: [nem_credit_application]
        kind: dedup
        condition: "Each bill is offset once."
        evidence_fields: [nem_ledger.bill_id, nem_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_ledger.bill_id]
          action_bindings:
            nem_ledger.bill_id: bill_id
        dedup_contract:
          table: nem_ledger
          mode: separate_record
          object_bindings: {bill_id: bill_id}
          duplicate_filters: {event_type: [nem_credit_application]}
          distinct_fields: []
    formula:
      amount: "min(credit_bank_balance, nem_msr_bill_offsettable_charges)"
    measures: [nem_msr_bill_offsettable_charges]

  - id: nem_true_up_rule
    subject: [nem_true_up_payout, nem_true_up_forfeiture]
    rule: >-
      At the bill dated in the true-up month, and when the agreement terminates, the residual bank
      (nem_msr_bank_at_settlement) is settled. At an anniversary true-up, cash_out pays the residual, carry_forward
      leaves it in the bank, and forfeit zeroes it. At termination the residual is settled under
      termination_disposition. A payout of at least payout_minimum_check_usd is paid by check; a smaller payout
      is credited to the service agreement. A residual of zero settles nothing. Each settlement date and kind is
      settled once, and a settlement is booked only for an agreement in operating or terminated status.
    eligibility:
      - id: settle_once
        applies_to: [nem_true_up_payout, nem_true_up_forfeiture]
        kind: state
        condition: "Each settlement date and kind is settled once, and a settlement is booked only for an agreement in operating or terminated status."
        evidence_fields: [nem_agreements.status, nem_agreements.nem_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_agreements.nem_agreement_id]
          action_bindings:
            nem_agreements.nem_agreement_id: nem_agreement_id
        state_contract:
          field: nem_agreements.status
          allowed: [operating, terminated]
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {true_up: "=true_up_disposition", termination: "=termination_disposition", check_minimum: "=payout_minimum_check_usd"}
        Rider NEM-R Residential Net Energy Metering: {true_up: "=true_up_disposition", termination: "=termination_disposition", check_minimum: "=payout_minimum_check_usd"}
        Rider NBT-R Residential Net Billing Tariff: {true_up: "=true_up_disposition", termination: "=termination_disposition", check_minimum: "=payout_minimum_check_usd"}
        Rider NBT-C Commercial Net Billing Tariff: {true_up: "=true_up_disposition", termination: "=termination_disposition", check_minimum: "=payout_minimum_check_usd"}
        Rider NEM-A Aggregated Net Energy Metering: {true_up: "=true_up_disposition", termination: "=termination_disposition", check_minimum: "=payout_minimum_check_usd"}
        Rider NBT-L Large Customer Net Billing Tariff: {true_up: "=true_up_disposition", termination: "=termination_disposition", check_minimum: "=payout_minimum_check_usd"}
    measures: [nem_msr_bank_at_settlement]

  - id: nem_grid_access_charge_rule
    subject: [nem_grid_access_charge]
    rule: >-
      Where grid_access_charge_usd_per_kw is above zero, every billing period of an operating agreement is
      charged grid_access_charge_usd_per_kw times system_capacity_kw_ac, rounded to the cent, dated the billing
      period end. The charge is never offset by banked credit. One charge is booked per billing period.
    eligibility:
      - id: one_charge_per_period
        applies_to: [nem_grid_access_charge]
        kind: dedup
        condition: "One charge is booked per billing period."
        evidence_fields: [nem_ledger.nem_agreement_id, nem_ledger.billing_period_end, nem_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_ledger.nem_agreement_id, nem_ledger.billing_period_end]
          action_bindings:
            nem_ledger.nem_agreement_id: nem_agreement_id
            nem_ledger.billing_period_end: billing_period_end
        dedup_contract:
          table: nem_ledger
          mode: separate_record
          object_bindings: {nem_agreement_id: nem_agreement_id, billing_period_end: billing_period_end}
          duplicate_filters: {event_type: [nem_grid_access_charge]}
          distinct_fields: []
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {per_kw: "=grid_access_charge_usd_per_kw"}
        Rider NEM-R Residential Net Energy Metering: {per_kw: "=grid_access_charge_usd_per_kw"}
        Rider NBT-R Residential Net Billing Tariff: {per_kw: "=grid_access_charge_usd_per_kw"}
        Rider NBT-C Commercial Net Billing Tariff: {per_kw: "=grid_access_charge_usd_per_kw"}
        Rider NEM-A Aggregated Net Energy Metering: {per_kw: "=grid_access_charge_usd_per_kw"}
        Rider NBT-L Large Customer Net Billing Tariff: {per_kw: "=grid_access_charge_usd_per_kw"}
    formula:
      amount: "round(grid_access_charge_usd_per_kw * system_capacity_kw_ac, 2)"

  - id: nem_modification_transfer_termination
    subject: [nem_system_modification, nem_ownership_transfer, nem_termination]
    rule: >-
      An operating agreement may increase its capacity by no more than
      modification_increase_without_reapplication_pct of the approved capacity through a modification, within
      the rider's size limits; a larger increase requires a new application under the rider then open, and under
      a rider whose modification_loses_grandfathering is true any increase does. Modifications are made only on
      an agreement in operating status. When the premise is sold and transfer_on_sale_allowed is true, the
      agreement moves to the buyer's service agreement at the same address once the buyer has started service;
      the seller's bank is settled under bank_disposition_on_sale before the move and the true-up month is
      unchanged. Termination is the customer's decision, or follows the closure of the service agreement when
      no transfer applies; the bank is then settled under termination_disposition.
    eligibility:
      - id: modify_operating_only
        applies_to: [nem_system_modification, nem_ownership_transfer]
        kind: state
        condition: "Modifications are made only on an agreement in operating status."
        evidence_fields: [nem_agreements.status, nem_agreements.nem_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_agreements.nem_agreement_id]
          action_bindings:
            nem_agreements.nem_agreement_id: nem_agreement_id
        state_contract:
          field: nem_agreements.status
          allowed: [operating]
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {increase_limit: "=modification_increase_without_reapplication_pct", loses_grandfathering: "=modification_loses_grandfathering", transfer_on_sale: "=transfer_on_sale_allowed"}
        Rider NEM-R Residential Net Energy Metering: {increase_limit: "=modification_increase_without_reapplication_pct", loses_grandfathering: "=modification_loses_grandfathering", transfer_on_sale: "=transfer_on_sale_allowed"}
        Rider NBT-R Residential Net Billing Tariff: {increase_limit: "=modification_increase_without_reapplication_pct", loses_grandfathering: "=modification_loses_grandfathering", transfer_on_sale: "=transfer_on_sale_allowed"}
        Rider NBT-C Commercial Net Billing Tariff: {increase_limit: "=modification_increase_without_reapplication_pct", loses_grandfathering: "=modification_loses_grandfathering", transfer_on_sale: "=transfer_on_sale_allowed"}
        Rider NEM-A Aggregated Net Energy Metering: {increase_limit: "=modification_increase_without_reapplication_pct", loses_grandfathering: "=modification_loses_grandfathering", transfer_on_sale: "=transfer_on_sale_allowed"}
        Rider NBT-L Large Customer Net Billing Tariff: {increase_limit: "=modification_increase_without_reapplication_pct", loses_grandfathering: "=modification_loses_grandfathering", transfer_on_sale: "=transfer_on_sale_allowed"}

  - id: nem_program_interactions
    subject: [nem_application, nem_export_credit]
    rule: >-
      Holding a Non-Communicating Opt-Out Meter excludes net metering until the customer returns to a
      communicating meter. A battery enrolled in a demand response battery dispatch program may export during
      demand response events, and that export earns the normal export credit; the demand response incentive is
      paid separately and never reduces or replaces the export credit. Budget billing on the service agreement
      does not change export credits; credits applied to a bill reduce the actual charges that budget billing
      compares with its installment. A legacy agreement that loses grandfathering moves to the rider open for new
      applications for the customer's class.
    eligibility: []
