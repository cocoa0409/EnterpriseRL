events:
  # ---- holding (service_accounts) -------------------------------------------
  - type: service_start
    target: service_accounts
    mutation: create
    meaning: A customer opens an electric service agreement at a service address under a chosen rate schedule.
    grain: One row per service agreement opened.
    fields:
      customer_id: The customer who will be billed for the service address.
      variant_name: The rate schedule assigned at opening, official full schedule name.
      service_address: Street address of the premise served, exactly as on the start order.
      space_heating: Primary space-heating source of the premise as stated on the start order.
      service_voltage: Delivery voltage of the premise, secondary or primary.
      ev_vin: Vehicle identification number of the registered plug-in vehicle for Schedule REV, empty for other schedules.
      start_date: Requested date on which service is energized and billing begins.
      rate_effective_date: Date the assigned schedule takes effect, equal to start_date at opening.
    triggers:
      - event: service:service_connection_charge
        map: {posting_date: start_date}
  - type: service_activation
    target: service_accounts
    mutation: {transition: {from: pending_start, to: active}}
    meaning: The meter at the service address is energized and the agreement becomes billable.
    grain: One row per transaction.
    fields:
      last_status_date: Date the service was energized.
    triggers: []
  - type: service_rate_change
    target: service_accounts
    mutation: update
    meaning: The customer moves the agreement to a different rate schedule.
    grain: One row per transaction.
    fields:
      variant_name: The newly selected rate schedule, official full schedule name.
      rate_effective_date: First day of the billing period from which the new schedule applies.
    triggers: []
  - type: service_notice_status
    target: service_accounts
    mutation: {transition: {from: active, to: notice_pending}}
    meaning: The agreement enters notice-pending status because a written disconnection notice has been served.
    grain: One row per transaction.
    fields:
      last_status_date: Notice date of the written disconnection notice.
    triggers: []
  - type: service_notice_rescission
    target: service_accounts
    mutation: {transition: {from: notice_pending, to: active}}
    meaning: A pending disconnection notice is withdrawn and the agreement returns to active status.
    grain: One row per transaction.
    fields:
      last_status_date: Date the notice was rescinded.
    triggers: []
  - type: service_disconnection
    target: service_accounts
    mutation: {transition: {from: notice_pending, to: disconnected}}
    meaning: Service at the address is disconnected for nonpayment.
    grain: One row per transaction.
    fields:
      last_status_date: Date the service was disconnected.
    triggers: []
  - type: service_reconnection
    target: service_accounts
    mutation: {transition: {from: disconnected, to: active}}
    meaning: A reconnection order restores service to a disconnected agreement.
    grain: One row per transaction.
    fields:
      last_status_date: Date the reconnection order was issued.
    triggers:
      - event: service:service_reconnection_charge
        map: {posting_date: last_status_date}
  - type: service_stop
    target: service_accounts
    mutation: {transition: [{from: active, to: closed}, {from: notice_pending, to: closed}]}
    meaning: The customer's confirmed stop-service order takes effect and the agreement is closed.
    grain: One row per transaction.
    fields:
      stop_date: Effective date of the stop-service order.
      last_status_date: Effective date of the stop-service order.
    triggers:
      - event: service:service_bill_issued
        map: {bill_kind: final, billing_period_end: stop_date}
  - type: service_disconnected_closure
    target: service_accounts
    mutation: {transition: {from: disconnected, to: closed}}
    meaning: An account left disconnected past the closure period is final-billed and closed.
    grain: One row per transaction.
    fields:
      stop_date: Date the account was closed.
      last_status_date: Date the account was closed.
    triggers:
      - event: service:service_bill_issued
        map: {bill_kind: final, billing_period_end: stop_date}
  - type: service_start_cancellation
    target: service_accounts
    mutation: {transition: {from: pending_start, to: closed}}
    meaning: The customer cancels a start order before the service is energized.
    grain: One row per transaction.
    fields:
      stop_date: Date the start order was cancelled.
      last_status_date: Date the start order was cancelled.
    triggers: []
  # ---- bills (service_bills) -------------------------------------------------
  - type: service_bill_issued
    target: service_bills
    meaning: A bill for metered usage over one billing period is issued and its current charges are booked to the account.
    grain: One row per bill (regular or final) per billing period.
    distinguish_by: [billing_period_end, bill_kind]
    fields:
      bill_date: Date the bill was issued.
      due_date: Payment due date printed on the bill.
      billing_period_start: First day of the billing period.
      billing_period_end: Last day of the billing period (meter read date).
      season: Pricing season of the bill, from the month of billing_period_end.
      bill_kind: Regular monthly bill or final bill.
      read_type: How the closing meter reading was obtained.
      kwh_on_peak: Metered kWh in on-peak hours (all kWh on flat schedules).
      kwh_off_peak: Metered kWh in off-peak hours (0 on flat schedules).
      kwh_super_off_peak: Metered kWh in super off-peak hours (0 where none).
      kwh_total: Total metered kWh for the billing period.
      medical_allowance_kwh: Medical baseline allowance kWh applied to the bill's inclining-block threshold.
      measured_demand_kw: Highest 15-minute demand metered in the billing period.
      billing_demand_kw: Demand billed after the ratchet and minimum are applied.
      customer_charge_amount: Customer charge on the bill.
      energy_charge_amount: Energy charges on the bill including any inclining-block adder, after any primary-voltage discount.
      demand_charge_amount: Demand charge on the bill after any primary-voltage discount.
      rider_charge_amount: Power Supply Cost Recovery charge on the bill.
      amount: Total current charges of the bill.
    account: account_balance
    direction: in
    triggers: []
  # ---- charges (service_charges) --------------------------------------------
  - type: service_late_payment_charge
    target: service_charges
    meaning: A one-time late payment charge is posted on a bill not paid in full by the end of its grace period.
    grain: One row per bill charged late.
    distinguish_by: [bill_id]
    fields:
      posting_date: Date the late payment charge was posted.
      amount: Late payment charge amount.
      bill_id: The bill whose unpaid portion was charged.
    account: account_balance
    direction: in
    triggers: []
  - type: service_reconnection_charge
    target: service_charges
    meaning: The reconnection charge for restoring a disconnected account is posted.
    grain: One row per reconnection order.
    distinguish_by: [posting_date]
    fields:
      posting_date: Date of the reconnection order.
      amount: Reconnection charge amount.
      reconnect_method: Whether service was restored remotely or by a field crew.
      reconnect_timing: Whether the order is worked in standard hours or as an after-hours same-day restoration.
    account: account_balance
    direction: in
    triggers: []
  - type: service_payment_reversal
    target: service_charges
    meaning: A payment returned unpaid by the customer's bank is reversed off the account.
    grain: One row per returned payment.
    distinguish_by: [reversed_payment_id]
    fields:
      posting_date: Date the return was posted.
      amount: Amount of the returned payment.
      reversed_payment_id: The payment being reversed.
    account: account_balance
    direction: in
    triggers:
      - event: service:service_returned_payment_charge
        map: {reversed_payment_id: reversed_payment_id, posting_date: posting_date}
  - type: service_returned_payment_charge
    target: service_charges
    meaning: The returned payment fee is posted for a payment returned unpaid.
    grain: One row per returned payment.
    distinguish_by: [reversed_payment_id]
    fields:
      posting_date: Date the fee was posted.
      amount: Returned payment fee.
      reversed_payment_id: The returned payment the fee relates to.
    account: account_balance
    direction: in
    triggers: []
  - type: service_connection_charge
    target: service_charges
    meaning: The one-time connection charge for establishing a new service agreement is posted.
    grain: One row per service agreement opened.
    distinguish_by: [posting_date]
    fields:
      posting_date: Date the charge was posted (the agreement's start date).
      amount: Connection charge amount.
    account: account_balance
    direction: in
    triggers: []
  - type: service_backbill_charge
    target: service_charges
    meaning: Previously unbilled usage found by a meter test or a corrected estimate is billed to the account.
    grain: One row per originating correction record.
    distinguish_by: [source_reference_id]
    fields:
      posting_date: Date the backbill was posted.
      amount: Backbilled amount.
      backbill_reason: Why usage was underbilled.
      source_reference_id: The meter accuracy adjustment or meter read record that established the underbilling.
    account: account_balance
    direction: in
    triggers: []
  - type: service_program_debit
    target: service_charges
    meaning: An amount originating in a payment, billing or metering program is posted onto the service account.
    grain: One row per originating program record per posting.
    distinguish_by: [charge_code, source_reference_id, posting_date]
    fields:
      posting_date: Date the debit was posted.
      amount: Debit amount.
      charge_code: Kind of program debit.
      source_reference_id: The originating program record (arrangement ledger row, budget ledger row, meter charge row, or the closed service agreement for a balance transfer).
    account: account_balance
    direction: in
    triggers: []
  - type: service_credit_refund
    target: service_charges
    meaning: A credit balance on a closed agreement is refunded to the customer, bringing the balance back to zero.
    grain: One row per refund issued.
    distinguish_by: [posting_date]
    fields:
      posting_date: Date the refund was issued.
      amount: Refund amount.
      refund_method: How the refund was paid.
    account: account_balance
    direction: in
    triggers: []
  # ---- credits (service_credits) --------------------------------------------
  - type: service_payment
    target: service_credits
    meaning: A customer payment is received and posted to the account.
    grain: One row per payment received.
    distinguish_by: [confirmation_number]
    fields:
      posting_date: Date the payment was received.
      amount: Payment amount.
      payment_channel: Channel through which the payment was made.
      confirmation_number: Payment confirmation number issued by the payment channel.
    account: account_balance
    direction: out
    triggers: []
  - type: service_outage_credit
    target: service_credits
    meaning: An outage credit is granted for a qualifying outage at the service address.
    grain: One row per credit kind per outage record.
    distinguish_by: [credit_code, outage_event_id]
    fields:
      posting_date: Date the credit was posted.
      amount: Credit amount.
      credit_code: Sustained-outage credit or chronic-outage credit.
      outage_event_id: The outage record the credit is granted for.
    account: account_balance
    direction: out
    triggers: []
  - type: service_billing_credit
    target: service_credits
    meaning: A billing correction credit is posted — a meter-error refund, a courtesy late-charge waiver, a time-of-use bill-protection credit or a billing-error correction.
    grain: One row per credit kind per originating record.
    distinguish_by: [credit_code, source_reference_id]
    fields:
      posting_date: Date the credit was posted.
      amount: Credit amount.
      credit_code: Kind of billing credit.
      source_reference_id: The record corrected (the meter accuracy adjustment, the late payment charge waived, the service agreement whose bill-protection period ended, or the bill corrected).
    account: account_balance
    direction: out
    triggers: []
  - type: service_program_credit
    target: service_credits
    meaning: An amount originating in a payment, deposit, billing, generation or demand-response program is credited to the service account.
    grain: One row per originating program record per posting.
    distinguish_by: [credit_code, source_reference_id, posting_date]
    fields:
      posting_date: Date the credit was posted.
      amount: Credit amount.
      credit_code: Kind of program credit.
      source_reference_id: The originating program record (arrangement, deposit, budget, net-metering or demand-response ledger row, or the receiving agreement for a balance transfer).
    account: account_balance
    direction: out
    triggers: []
  # ---- notices and outages ---------------------------------------------------
  - type: service_disconnect_notice
    target: service_notices
    meaning: A disconnection notice for nonpayment is delivered to the customer.
    grain: One row per notice delivered.
    distinguish_by: [notice_type, notice_date]
    fields:
      notice_type: Written notice or final notice.
      notice_date: Date the notice was delivered.
      delivery_method: How the notice was delivered.
      past_due_amount: Past-due balance stated on the notice.
      earliest_disconnect_date: Earliest date on which service may be disconnected under the notice.
    triggers:
      - event: service:service_notice_status
        when: {notice_type: written_notice}
        map: {last_status_date: notice_date}
  - type: service_outage_record
    target: service_outages
    meaning: An interruption of service at the service address is recorded by the outage management system.
    grain: One row per sustained interruption (5 minutes or longer) at the address.
    distinguish_by: [outage_start]
    fields:
      outage_start: Date and time the interruption began.
      restoration_time: Date and time service was restored.
      duration_hours: Interruption length in hours.
      cause: Recorded cause of the interruption.
      major_event_day: Whether the interruption began on a declared major event day.
    triggers: []

measures:
  - id: service_msr_bill_unpaid_portion
    window: One bill, evaluated at the end of that bill's grace period (its due date plus the schedule's late_payment_grace_days).
    measure: The bill's amount minus the payments and credits (service_credits rows posted on or before the evaluation date) applied to it, where credits are applied to the account's charges oldest first by bill date and posting date, floored at 0.00.
  - id: service_msr_past_due_balance
    window: The account as of the handling date.
    measure: The sum of amounts of service_bill_issued rows whose due_date is before the handling date plus all service_charges rows posted before the handling date, minus all service_credits rows posted on or before the handling date, floored at 0.00.
  - id: service_msr_late_charges_lookback
    window: The late_charge_courtesy_clean_months calendar months ending the day before the posting date of the late payment charge under review.
    measure: Count of service_late_payment_charge rows on the account posted in the window.
  - id: service_msr_courtesy_waivers_12m
    window: The 12 calendar months ending on the handling date.
    measure: Count of service_billing_credit rows on the account with credit_code late_charge_waiver posted in the window.
  - id: service_msr_returned_payments_lookback
    window: The returned_payment_restriction_months calendar months ending on the reference date (the handling date, or for courtesy waivers the day before the waived charge's posting date).
    measure: Count of service_payment_reversal rows on the account posted in the window.
  - id: service_msr_outages_12m
    window: The 12 calendar months ending on the outage_start date of the outage record under review, inclusive.
    measure: Count of service_outage_record rows at the account whose outage_start falls in the window, including the record under review.
  - id: service_msr_chronic_credits_12m
    window: The 12 calendar months ending on the handling date.
    measure: Count of service_outage_credit rows on the account with credit_code chronic_outage posted in the window.
  - id: service_msr_peak_demand_11m
    window: The 11 regular bills immediately preceding the bill being calculated.
    measure: The highest measured_demand_kw among those bills, 0 when there are none.

policies:
  - id: service_agg_multi_holding
    subject: [service_start]
    rule: >-
      A customer may hold any number of electric service agreements, one for each service address
      the customer occupies or operates. No other service agreement at the same service address is in
      pending_start, active, notice_pending or disconnected status. When an agreement at the address is
      still open in another customer's name, the new start is not opened until that agreement is closed by
      its own holder's stop-service order or by disconnected closure; the agent never closes another
      customer's agreement. Agreements at different addresses of the same customer are independent for
      billing, notices and disconnection.
    eligibility:
      - id: one_open_agreement_per_address
        applies_to: [service_start]
        kind: dedup
        condition: "No other service agreement at the same service address is in pending_start, active, notice_pending or disconnected status."
        evidence_fields: [service_accounts.service_address, service_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_address]
          action_bindings:
            service_accounts.service_address: service_address
        dedup_contract:
          table: service_accounts
          mode: separate_record
          object_bindings: {service_address: service_address}
          duplicate_filters: {status: [pending_start, active, notice_pending, disconnected]}
          distinct_fields: [start_date]
    params:
      max_per_customer: null

  - id: service_agg_prior_balance_transfer
    subject: [service_program_debit, service_program_credit]
    rule: >-
      Balances follow the customer, not the address. An unpaid final-bill balance left on a closed
      agreement is transferred to an open agreement of the same customer. The transfer is made only when
      the final bill of the closed agreement has remained unpaid for at least the prior balance transfer
      period after its due date. The period is counted in calendar days starting the day after the final
      bill's due date, and the transfer may be made on the day the count reaches the period, not before.
      The transfer period is the closed agreement's schedule value. The receiving agreement is the
      customer's open agreement (active, notice_pending or disconnected) with the earliest start_date;
      when none is open the balance stays on the closed agreement. The transfer posts two entries for the
      whole unpaid balance of the closed agreement on the same posting date — a service_program_credit
      with credit_code prior_balance_transfer on the closed agreement whose source_reference_id is the
      receiving agreement, and a service_program_debit with charge_code prior_balance_transfer on the
      receiving agreement whose source_reference_id is the closed agreement. A credit balance is never
      transferred; it is refunded under service_stop_and_final_bill. A transferred balance becomes part of
      the receiving agreement's next bill cycle and is past due on that agreement only after that bill's
      due date.
    eligibility:
      - id: final_bill_aged
        applies_to: [service_program_debit, service_program_credit]
        kind: time
        condition: "The transfer is made only when the final bill of the closed agreement has remained unpaid for at least the prior balance transfer period after its due date."
        evidence_fields: [service_bills.due_date, service_bills.bill_kind, service_bills.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_bills.service_account_id]
          action_bindings:
            service_bills.service_account_id: source_reference_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its due date
          anchor_source: service_bills.due_date
          relation: not_before
          duration_source: variants.prior_balance_transfer_after_days
          unit: calendar_days
          counting_rule: "The period is counted in calendar days starting the day after the final bill's due date, and the transfer may be made on the day the count reaches the period, not before."
          boundary: inclusive

  - id: service_start_and_schedule_assignment
    subject: [service_start, service_activation, service_connection_charge]
    rule: >-
      A start order names the service address, the start date, the premise's primary space-heating
      source and its delivery voltage. The schedule must match the customer's customer_type: residential
      customers take Schedule RS, RT or REV and business customers take Schedule GS, GST, GD or LP. Among
      business schedules the schedule is fixed by the highest measured_demand_kw on the address's bills in
      the 12 billing periods before the start date (under 25 kW for GS and GST, 25 kW up to but excluding
      500 kW for GD, 500 kW and above for LP); for an address with no bill history the customer's stated
      connected-load estimate is used. Schedules RT, REV and GST additionally require a communicating smart
      meter at the address, which is any meter installation in_service whose type is not the
      Non-Communicating Opt-Out Meter. For Schedule REV the customer must supply the vehicle identification
      number of a plug-in electric vehicle registered at the service address. The start date may not be
      earlier than the next business day after the start order; business days are Monday through Friday
      excluding the company holidays (New Year's Day, Memorial Day, Independence Day, Labor Day,
      Thanksgiving Day, the day after Thanksgiving and Christmas Day). The agreement opens in
      pending_start and is activated by the system on the start date. The connection charge of the
      assigned schedule is posted with the start date as its posting date. The connection charge is posted
      only on an agreement in pending_start or active status. The connection charge is not posted for a
      residential customer whose income_qualified_until date is on or after the start date.
    eligibility:
      - id: rev_vehicle_registration
        applies_to: [service_start]
        kind: caller_fact
        condition: "For Schedule REV the customer must supply the vehicle identification number of a plug-in electric vehicle registered at the service address."
        evidence_fields: [service_accounts.ev_vin]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [service_accounts.ev_vin]
          action_bindings:
            service_accounts.ev_vin: ev_vin
      - id: connection_charge_on_open_agreement
        applies_to: [service_connection_charge]
        kind: state
        condition: "The connection charge is posted only on an agreement in pending_start or active status."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [pending_start, active]
    params:
      per_tier:
        Schedule RS Residential Standard Service: {connection_charge: "=connection_charge_usd"}
        Schedule RT Residential Time-of-Use Service: {connection_charge: "=connection_charge_usd"}
        Schedule REV Residential Electric Vehicle Time-of-Use Service: {connection_charge: "=connection_charge_usd"}
        Schedule GS Small General Service: {connection_charge: "=connection_charge_usd"}
        Schedule GST Small General Time-of-Use Service: {connection_charge: "=connection_charge_usd"}
        Schedule GD Medium General Demand Service: {connection_charge: "=connection_charge_usd"}
        Schedule LP Large Power Service: {connection_charge: "=connection_charge_usd"}
      gd_demand_floor_kw: 25
      lp_demand_floor_kw: 500
      demand_lookback_billing_periods: 12

  - id: service_rate_schedule_change
    subject: [service_rate_change]
    rule: >-
      A customer may move an active or notice_pending agreement to another schedule of the same
      customer_type whose entry requirements the address meets, under the same demand, meter and vehicle
      tests as at opening. A schedule change is accepted only when the rate change lockout period has
      elapsed since the current schedule's effective date. Months are counted as calendar months from the
      rate effective date, and when the target month is shorter the boundary falls on its last day. The
      lockout is the current schedule's value. The lockout does not apply when a customer still inside the
      bill-protection period of Schedule RT or REV returns to Schedule RS, or of Schedule GST returns to
      Schedule GS. The new schedule takes effect on the first day after the billing_period_end of the most
      recent regular bill, and that date is written as rate_effective_date; no bill is recalculated
      retroactively. A change requested on a closed, disconnected or pending_start agreement is not made.
    eligibility:
      - id: lockout_elapsed
        applies_to: [service_rate_change]
        kind: time
        condition: "A schedule change is accepted only when the rate change lockout period has elapsed since the current schedule's effective date."
        evidence_fields: [service_accounts.rate_effective_date, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the current schedule's effective date
          anchor_source: service_accounts.rate_effective_date
          relation: not_before
          duration_source: variants.rate_change_lockout_months
          unit: calendar_months
          counting_rule: "Months are counted as calendar months from the rate effective date, and when the target month is shorter the boundary falls on its last day."
          boundary: inclusive
      - id: change_on_billable_agreement
        applies_to: [service_rate_change]
        kind: state
        condition: "A change requested on a closed, disconnected or pending_start agreement is not made."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active, notice_pending]

  - id: service_bill_calculation
    subject: [service_bill_issued]
    rule: >-
      Every bill prices the billing period's metered usage under the schedule in effect on the billing
      period end date. A bill is a summer-season bill when the month of billing_period_end is listed in
      summer_billing_months, otherwise a winter-season bill. On-peak, off-peak and super off-peak kWh are
      priced at the schedule's season rates; on flat schedules all kWh are recorded as on-peak and priced at
      the season's on-peak rate. Where the schedule has an inclining block, the adder applies to every kWh of
      kwh_total above the block threshold, which is inclining_block_threshold_electric_heat_kwh on winter
      bills of accounts whose space_heating is electric and inclining_block_threshold_kwh otherwise, raised
      by the medical_allowance_kwh applied to the bill. Billing demand is the highest of the measured demand,
      the ratchet share of the highest measured demand of the 11 preceding regular bills, and the minimum
      billing demand. For accounts served at primary voltage the primary-voltage discount reduces the energy
      and demand charges. The Power Supply Cost Recovery factor applies to kwh_total. The full customer
      charge applies to every bill including first and final bills. Each component is rounded to the cent
      and the bill amount is their sum. The due date is the bill date plus bill_due_days calendar days. Bills
      are issued on regular agreements in active, notice_pending or disconnected status and a final bill is
      issued when the agreement closes; no bill is issued for a pending_start agreement.
    eligibility: []
    formula:
      on_peak_rate: "energy_rate_summer_on_peak_usd_kwh if season == 'summer' else energy_rate_winter_on_peak_usd_kwh"
      off_peak_rate: "energy_rate_summer_off_peak_usd_kwh if season == 'summer' else energy_rate_winter_off_peak_usd_kwh"
      block_threshold: "(inclining_block_threshold_electric_heat_kwh if (space_heating == 'electric' and season == 'winter') else inclining_block_threshold_kwh) + medical_allowance_kwh"
      block_kwh: "max(0, kwh_total - block_threshold) if inclining_block_adder_usd_kwh > 0 else 0"
      voltage_factor: "(1 - primary_voltage_discount_pct) if service_voltage == 'primary' else 1"
      billing_demand_kw: "max(measured_demand_kw, demand_ratchet_pct * service_msr_peak_demand_11m, minimum_billing_demand_kw) if demand_charge_usd_kw > 0 else 0"
      energy_charge_amount: "round((kwh_on_peak * on_peak_rate + kwh_off_peak * off_peak_rate + kwh_super_off_peak * energy_rate_super_off_peak_usd_kwh + block_kwh * inclining_block_adder_usd_kwh) * voltage_factor, 2)"
      demand_charge_amount: "round(billing_demand_kw * demand_charge_usd_kw * voltage_factor, 2)"
      customer_charge_amount: "customer_charge_usd_month"
      rider_charge_amount: "round(kwh_total * power_supply_adjustment_usd_kwh, 2)"
      amount: "customer_charge_amount + energy_charge_amount + demand_charge_amount + rider_charge_amount"
    measures: [service_msr_peak_demand_11m]

  - id: service_late_payment_charge_rule
    subject: [service_late_payment_charge]
    rule: >-
      A bill that is not paid in full by the end of its grace period is charged once. The charge may be
      posted only after the bill's due date plus the late payment grace period has passed without full
      payment. The grace period is counted in calendar days beginning the day after the due date, and the
      charge may be posted from the first calendar day after the last grace day. The charge is the
      schedule's late payment charge rate times the bill's unpaid portion, rounded to the cent, and not less
      than the schedule's minimum; the unpaid portion is service_msr_bill_unpaid_portion and no charge
      arises when it is zero. Only one late payment charge is assessed per bill, and late payment charges,
      fees and program debits never themselves attract a late payment charge. No late payment charge is
      assessed on a residential bill when the customer's income_qualified_until date is on or after that
      bill's due date. No late payment charge is assessed on a bill while a customer-requested meter test of
      the account's meter, requested on or before the bill's due date, has no test result recorded yet; once
      the result is recorded the charge may be assessed on the unpaid portion after any accuracy
      adjustment. The charge is posted only on an agreement in active, notice_pending or disconnected
      status.
    eligibility:
      - id: grace_period_passed
        applies_to: [service_late_payment_charge]
        kind: time
        condition: "The charge may be posted only after the bill's due date plus the late payment grace period has passed without full payment."
        evidence_fields: [service_bills.due_date, service_bills.bill_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_bills.bill_id]
          action_bindings:
            service_bills.bill_id: bill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the bill's due date
          anchor_source: service_bills.due_date
          relation: not_before
          duration_source: variants.late_payment_grace_days
          unit: calendar_days
          counting_rule: "The grace period is counted in calendar days beginning the day after the due date, and the charge may be posted from the first calendar day after the last grace day."
          boundary: exclusive
      - id: one_charge_per_bill
        applies_to: [service_late_payment_charge]
        kind: dedup
        condition: "Only one late payment charge is assessed per bill, and late payment charges, fees and program debits never themselves attract a late payment charge."
        evidence_fields: [service_charges.bill_id, service_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_charges.bill_id]
          action_bindings:
            service_charges.bill_id: bill_id
        dedup_contract:
          table: service_charges
          mode: separate_record
          object_bindings: {bill_id: bill_id}
          duplicate_filters: {event_type: [service_late_payment_charge]}
          distinct_fields: []
      - id: charge_on_open_agreement
        applies_to: [service_late_payment_charge]
        kind: state
        condition: "The charge is posted only on an agreement in active, notice_pending or disconnected status."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active, notice_pending, disconnected]
    params:
      per_tier:
        Schedule RS Residential Standard Service: {rate: "=late_payment_charge_rate", minimum: "=late_payment_charge_minimum_usd", grace_days: "=late_payment_grace_days"}
        Schedule RT Residential Time-of-Use Service: {rate: "=late_payment_charge_rate", minimum: "=late_payment_charge_minimum_usd", grace_days: "=late_payment_grace_days"}
        Schedule REV Residential Electric Vehicle Time-of-Use Service: {rate: "=late_payment_charge_rate", minimum: "=late_payment_charge_minimum_usd", grace_days: "=late_payment_grace_days"}
        Schedule GS Small General Service: {rate: "=late_payment_charge_rate", minimum: "=late_payment_charge_minimum_usd", grace_days: "=late_payment_grace_days"}
        Schedule GST Small General Time-of-Use Service: {rate: "=late_payment_charge_rate", minimum: "=late_payment_charge_minimum_usd", grace_days: "=late_payment_grace_days"}
        Schedule GD Medium General Demand Service: {rate: "=late_payment_charge_rate", minimum: "=late_payment_charge_minimum_usd", grace_days: "=late_payment_grace_days"}
        Schedule LP Large Power Service: {rate: "=late_payment_charge_rate", minimum: "=late_payment_charge_minimum_usd", grace_days: "=late_payment_grace_days"}
    formula:
      when_not: "service_msr_bill_unpaid_portion <= 0"
      amount: "max(late_payment_charge_minimum_usd, round(late_payment_charge_rate * service_msr_bill_unpaid_portion, 2))"
    measures: [service_msr_bill_unpaid_portion]

  - id: service_late_charge_courtesy_waiver
    subject: [service_billing_credit]
    rule: >-
      A late payment charge may be waived once as a courtesy by posting a service_billing_credit with
      credit_code late_charge_waiver for the full amount of that charge, with the late payment charge as its
      source_reference_id. The waiver is available only when the schedule's courtesy waiver allowance is
      above zero and the count service_msr_courtesy_waivers_12m is below that allowance. The window of
      late_charge_courtesy_clean_months before the waived charge's posting date must contain no other late
      payment charge (service_msr_late_charges_lookback is zero) and no returned payment
      (service_msr_returned_payments_lookback is zero). The waiver must be requested no later than the
      courtesy request window after the posting date of the late payment charge being waived. The window is
      counted in calendar days starting the day after the posting date, and a request on the last day of the
      window is accepted. Each late payment charge is waived at most once. A charge that does not meet these
      conditions is not waived and stays payable; waiving part of a charge is not offered.
    eligibility:
      - id: courtesy_request_window
        applies_to: [service_billing_credit]
        kind: time
        condition: "The waiver must be requested no later than the courtesy request window after the posting date of the late payment charge being waived."
        evidence_fields: [service_charges.posting_date, service_charges.service_charge_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_charges.service_charge_id]
          action_bindings:
            service_charges.service_charge_id: source_reference_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the posting date of the late payment charge being waived
          anchor_source: service_charges.posting_date
          relation: not_after
          duration_source: params.courtesy_request_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the posting date, and a request on the last day of the window is accepted."
          boundary: inclusive
      - id: waive_each_charge_once
        applies_to: [service_billing_credit]
        kind: dedup
        condition: "Each late payment charge is waived at most once."
        evidence_fields: [service_credits.source_reference_id, service_credits.credit_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_credits.source_reference_id]
          action_bindings:
            service_credits.source_reference_id: source_reference_id
        dedup_contract:
          table: service_credits
          mode: separate_record
          object_bindings: {source_reference_id: source_reference_id}
          duplicate_filters: {credit_code: [late_charge_waiver]}
          distinct_fields: []
    params:
      courtesy_request_window_days: 60
      per_tier:
        Schedule RS Residential Standard Service: {waivers_per_12_months: "=late_charge_courtesy_waivers_per_12_months", clean_months: "=late_charge_courtesy_clean_months"}
        Schedule RT Residential Time-of-Use Service: {waivers_per_12_months: "=late_charge_courtesy_waivers_per_12_months", clean_months: "=late_charge_courtesy_clean_months"}
        Schedule REV Residential Electric Vehicle Time-of-Use Service: {waivers_per_12_months: "=late_charge_courtesy_waivers_per_12_months", clean_months: "=late_charge_courtesy_clean_months"}
        Schedule GS Small General Service: {waivers_per_12_months: "=late_charge_courtesy_waivers_per_12_months", clean_months: "=late_charge_courtesy_clean_months"}
        Schedule GST Small General Time-of-Use Service: {waivers_per_12_months: "=late_charge_courtesy_waivers_per_12_months", clean_months: "=late_charge_courtesy_clean_months"}
        Schedule GD Medium General Demand Service: {waivers_per_12_months: "=late_charge_courtesy_waivers_per_12_months", clean_months: "=late_charge_courtesy_clean_months"}
        Schedule LP Large Power Service: {waivers_per_12_months: "=late_charge_courtesy_waivers_per_12_months", clean_months: "=late_charge_courtesy_clean_months"}
    measures: [service_msr_courtesy_waivers_12m, service_msr_late_charges_lookback, service_msr_returned_payments_lookback]

  - id: service_payments_and_returns
    subject: [service_payment, service_payment_reversal, service_returned_payment_charge]
    rule: >-
      A payment is posted on the date it is received, for the amount received, under the confirmation
      number issued by the payment channel. Each confirmation number is posted once. Payments and credits
      are applied to the oldest unpaid charges first. A payment returned unpaid by the bank is reversed for
      its full amount, and the returned payment fee of the schedule is posted the same day against the same
      payment. Each payment is reversed at most once. When service_msr_returned_payments_lookback reaches the
      schedule's returned_payment_restriction_count, payments through mail_check, online_bank_transfer and
      autopay are not accepted for returned_payment_restriction_months after the latest return; card,
      authorized_pay_station_cash and energy_assistance_agency payments remain accepted. A payment from an
      energy assistance agency is posted like any other payment and never attracts a returned payment fee.
    eligibility:
      - id: confirmation_posted_once
        applies_to: [service_payment]
        kind: dedup
        condition: "Each confirmation number is posted once."
        evidence_fields: [service_credits.confirmation_number, service_credits.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_credits.confirmation_number]
          action_bindings:
            service_credits.confirmation_number: confirmation_number
        dedup_contract:
          table: service_credits
          mode: separate_record
          object_bindings: {confirmation_number: confirmation_number}
          duplicate_filters: {event_type: [service_payment]}
          distinct_fields: []
      - id: reverse_payment_once
        applies_to: [service_payment_reversal, service_returned_payment_charge]
        kind: dedup
        condition: "Each payment is reversed at most once."
        evidence_fields: [service_charges.reversed_payment_id, service_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_charges.reversed_payment_id]
          action_bindings:
            service_charges.reversed_payment_id: reversed_payment_id
        dedup_contract:
          table: service_charges
          mode: separate_record
          object_bindings: {reversed_payment_id: reversed_payment_id}
          duplicate_filters: {event_type: [service_payment_reversal]}
          distinct_fields: []
    params:
      per_tier:
        Schedule RS Residential Standard Service: {returned_payment_fee: "=returned_payment_fee_usd", restriction_count: "=returned_payment_restriction_count", restriction_months: "=returned_payment_restriction_months"}
        Schedule RT Residential Time-of-Use Service: {returned_payment_fee: "=returned_payment_fee_usd", restriction_count: "=returned_payment_restriction_count", restriction_months: "=returned_payment_restriction_months"}
        Schedule REV Residential Electric Vehicle Time-of-Use Service: {returned_payment_fee: "=returned_payment_fee_usd", restriction_count: "=returned_payment_restriction_count", restriction_months: "=returned_payment_restriction_months"}
        Schedule GS Small General Service: {returned_payment_fee: "=returned_payment_fee_usd", restriction_count: "=returned_payment_restriction_count", restriction_months: "=returned_payment_restriction_months"}
        Schedule GST Small General Time-of-Use Service: {returned_payment_fee: "=returned_payment_fee_usd", restriction_count: "=returned_payment_restriction_count", restriction_months: "=returned_payment_restriction_months"}
        Schedule GD Medium General Demand Service: {returned_payment_fee: "=returned_payment_fee_usd", restriction_count: "=returned_payment_restriction_count", restriction_months: "=returned_payment_restriction_months"}
        Schedule LP Large Power Service: {returned_payment_fee: "=returned_payment_fee_usd", restriction_count: "=returned_payment_restriction_count", restriction_months: "=returned_payment_restriction_months"}
    measures: [service_msr_returned_payments_lookback]

  - id: service_disconnection_notice_rule
    subject: [service_disconnect_notice, service_notice_status, service_notice_rescission]
    rule: >-
      A written notice may be issued only when service_msr_past_due_balance is at least the schedule's
      disconnect_min_past_due_usd and the oldest unpaid bill is at least disconnect_min_past_due_days past its
      due date. The written notice is delivered by mail or email, states the past-due balance, and sets
      earliest_disconnect_date to the notice date plus written_notice_days calendar days. Notices are
      delivered only on an agreement in active or notice_pending status. A final notice is delivered by phone
      call or door hanger at least final_notice_hours before disconnection while the written notice is
      pending. Serving the written notice moves the agreement to notice_pending. The notice is rescinded and
      the agreement returns to active, with the rescission date as last_status_date, when any of these holds
      before disconnection: payments since the notice bring service_msr_past_due_balance below the schedule's
      disconnect_min_past_due_usd; a payment arrangement on the agreement becomes active; a medical
      postponement is granted for the agreement, or a medical certification whose kind bars disconnection
      becomes active; or the notice period expires without disconnection. Notices may be issued during the winter moratorium; the moratorium limits only
      disconnection.
    eligibility:
      - id: notice_on_billable_agreement
        applies_to: [service_disconnect_notice]
        kind: state
        condition: "Notices are delivered only on an agreement in active or notice_pending status."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active, notice_pending]
    params:
      per_tier:
        Schedule RS Residential Standard Service: {min_past_due: "=disconnect_min_past_due_usd", min_days: "=disconnect_min_past_due_days", notice_days: "=written_notice_days", final_hours: "=final_notice_hours"}
        Schedule RT Residential Time-of-Use Service: {min_past_due: "=disconnect_min_past_due_usd", min_days: "=disconnect_min_past_due_days", notice_days: "=written_notice_days", final_hours: "=final_notice_hours"}
        Schedule REV Residential Electric Vehicle Time-of-Use Service: {min_past_due: "=disconnect_min_past_due_usd", min_days: "=disconnect_min_past_due_days", notice_days: "=written_notice_days", final_hours: "=final_notice_hours"}
        Schedule GS Small General Service: {min_past_due: "=disconnect_min_past_due_usd", min_days: "=disconnect_min_past_due_days", notice_days: "=written_notice_days", final_hours: "=final_notice_hours"}
        Schedule GST Small General Time-of-Use Service: {min_past_due: "=disconnect_min_past_due_usd", min_days: "=disconnect_min_past_due_days", notice_days: "=written_notice_days", final_hours: "=final_notice_hours"}
        Schedule GD Medium General Demand Service: {min_past_due: "=disconnect_min_past_due_usd", min_days: "=disconnect_min_past_due_days", notice_days: "=written_notice_days", final_hours: "=final_notice_hours"}
        Schedule LP Large Power Service: {min_past_due: "=disconnect_min_past_due_usd", min_days: "=disconnect_min_past_due_days", notice_days: "=written_notice_days", final_hours: "=final_notice_hours"}
    measures: [service_msr_past_due_balance]

  - id: service_disconnection_protections
    subject: [service_disconnection]
    rule: >-
      Service is disconnected for nonpayment only under a pending written notice and only when no
      protection applies. Disconnection may not be performed before the earliest disconnect date on the
      written notice. Disconnection may not be performed after the notice validity period that follows the
      earliest disconnect date. Both limits are counted in calendar days from the earliest disconnect date,
      which itself is a permitted disconnection date, and the last day of the validity period is still
      permitted. A final notice must have been delivered at least final_notice_hours earlier. No
      disconnection is performed on the schedule's disconnection_prohibited_days. During the winter
      moratorium period, a residential account whose space_heating is electric is not disconnected for
      nonpayment. No disconnection is performed while a medical postponement for the agreement is running,
      while a medical certification for the agreement whose kind bars disconnection is active, before the
      personal contact attempts that an active medical certification requires have been made, or while a
      payment arrangement on the agreement is active. A notice that expires without disconnection is rescinded, and a new written notice is needed
      before any later disconnection.
    eligibility:
      - id: not_before_earliest_date
        applies_to: [service_disconnection]
        kind: time
        condition: "Disconnection may not be performed before the earliest disconnect date on the written notice."
        evidence_fields: [service_notices.earliest_disconnect_date, service_notices.notice_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_notices.notice_id]
          action_bindings:
            service_notices.notice_id: notice_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the earliest disconnect date on the written notice
          anchor_source: service_notices.earliest_disconnect_date
          relation: not_before
          duration_source: params.earliest_date_offset_days
          unit: calendar_days
          counting_rule: "Both limits are counted in calendar days from the earliest disconnect date, which itself is a permitted disconnection date, and the last day of the validity period is still permitted."
          boundary: inclusive
      - id: within_notice_validity
        applies_to: [service_disconnection]
        kind: time
        condition: "Disconnection may not be performed after the notice validity period that follows the earliest disconnect date."
        evidence_fields: [service_notices.earliest_disconnect_date, service_notices.notice_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_notices.notice_id]
          action_bindings:
            service_notices.notice_id: notice_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the earliest disconnect date
          anchor_source: service_notices.earliest_disconnect_date
          relation: not_after
          duration_source: variants.notice_validity_days
          unit: calendar_days
          counting_rule: "Both limits are counted in calendar days from the earliest disconnect date, which itself is a permitted disconnection date, and the last day of the validity period is still permitted."
          boundary: inclusive
      - id: winter_moratorium
        applies_to: [service_disconnection]
        kind: state
        condition: "During the winter moratorium period, a residential account whose space_heating is electric is not disconnected for nonpayment."
        evidence_fields: [service_accounts.space_heating, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.space_heating
          allowed: [non_electric]
    params:
      earliest_date_offset_days: 0
      per_tier:
        Schedule RS Residential Standard Service: {moratorium: "=winter_moratorium_applies", validity_days: "=notice_validity_days", prohibited_days: "=disconnection_prohibited_days"}
        Schedule RT Residential Time-of-Use Service: {moratorium: "=winter_moratorium_applies", validity_days: "=notice_validity_days", prohibited_days: "=disconnection_prohibited_days"}
        Schedule REV Residential Electric Vehicle Time-of-Use Service: {moratorium: "=winter_moratorium_applies", validity_days: "=notice_validity_days", prohibited_days: "=disconnection_prohibited_days"}
        Schedule GS Small General Service: {moratorium: "=winter_moratorium_applies", validity_days: "=notice_validity_days", prohibited_days: "=disconnection_prohibited_days"}
        Schedule GST Small General Time-of-Use Service: {moratorium: "=winter_moratorium_applies", validity_days: "=notice_validity_days", prohibited_days: "=disconnection_prohibited_days"}
        Schedule GD Medium General Demand Service: {moratorium: "=winter_moratorium_applies", validity_days: "=notice_validity_days", prohibited_days: "=disconnection_prohibited_days"}
        Schedule LP Large Power Service: {moratorium: "=winter_moratorium_applies", validity_days: "=notice_validity_days", prohibited_days: "=disconnection_prohibited_days"}

  - id: service_reconnection_rule
    subject: [service_reconnection, service_reconnection_charge]
    rule: >-
      A disconnected agreement is reconnected when one of the following holds. Reconnection is ordered only
      after the reconnection payment requirement is met or an alternative listed below applies. The payment
      requirement is met when payments posted since the disconnection date equal or exceed the schedule's
      reconnection_payment_basis measured at disconnection — the past-due balance for residential schedules
      or the whole account balance for business schedules. The alternatives are an active payment
      arrangement on the agreement whose down payment has been received, or an active medical certification
      for the agreement whose kind requires disconnected service to be restored. A reconnection under such a
      medical certification whose kind waives the reconnection charge, or a reconnection of a disconnection performed without a valid pending notice, carries
      no reconnection charge; every other reconnection posts exactly one reconnection charge dated the
      reconnection order date. The reconnection charge is posted only on an agreement that has been restored
      to active status. The charge is reconnection_fee_remote_usd when the address's in-service meter is
      remote-switch capable under its metering type; otherwise it is reconnection_fee_field_standard_usd,
      or reconnection_fee_field_after_hours_usd when the order is placed outside reconnection_standard_hours
      and the customer elects same-day restoration instead of the next standard-hours crew visit. A residential
      reconnection after disconnection for nonpayment is also subject to the reestablishment deposit rules of
      the security deposit program.
    eligibility:
      - id: reconnection_requirement_met
        applies_to: [service_reconnection]
        kind: authorization
        condition: "Reconnection is ordered only after the reconnection payment requirement is met or an alternative listed below applies."
        evidence_fields: [service_credits.amount, service_credits.posting_date, service_credits.service_account_id, service_accounts.last_status_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_credits.service_account_id]
          action_bindings:
            service_credits.service_account_id: service_account_id
      - id: charge_after_restoration
        applies_to: [service_reconnection_charge]
        kind: state
        condition: "The reconnection charge is posted only on an agreement that has been restored to active status."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active]
    params:
      per_tier:
        Schedule RS Residential Standard Service: {remote: "=reconnection_fee_remote_usd", field_standard: "=reconnection_fee_field_standard_usd", field_after_hours: "=reconnection_fee_field_after_hours_usd", basis: "=reconnection_payment_basis"}
        Schedule RT Residential Time-of-Use Service: {remote: "=reconnection_fee_remote_usd", field_standard: "=reconnection_fee_field_standard_usd", field_after_hours: "=reconnection_fee_field_after_hours_usd", basis: "=reconnection_payment_basis"}
        Schedule REV Residential Electric Vehicle Time-of-Use Service: {remote: "=reconnection_fee_remote_usd", field_standard: "=reconnection_fee_field_standard_usd", field_after_hours: "=reconnection_fee_field_after_hours_usd", basis: "=reconnection_payment_basis"}
        Schedule GS Small General Service: {remote: "=reconnection_fee_remote_usd", field_standard: "=reconnection_fee_field_standard_usd", field_after_hours: "=reconnection_fee_field_after_hours_usd", basis: "=reconnection_payment_basis"}
        Schedule GST Small General Time-of-Use Service: {remote: "=reconnection_fee_remote_usd", field_standard: "=reconnection_fee_field_standard_usd", field_after_hours: "=reconnection_fee_field_after_hours_usd", basis: "=reconnection_payment_basis"}
        Schedule GD Medium General Demand Service: {remote: "=reconnection_fee_remote_usd", field_standard: "=reconnection_fee_field_standard_usd", field_after_hours: "=reconnection_fee_field_after_hours_usd", basis: "=reconnection_payment_basis"}
        Schedule LP Large Power Service: {remote: "=reconnection_fee_remote_usd", field_standard: "=reconnection_fee_field_standard_usd", field_after_hours: "=reconnection_fee_field_after_hours_usd", basis: "=reconnection_payment_basis"}

  - id: service_outage_credit_rule
    subject: [service_outage_credit]
    rule: >-
      A sustained-outage credit (credit_code sustained_outage) is granted on the customer's request for an
      outage record at the service address whose duration_hours is at least the schedule's
      outage_credit_min_hours. The credit is outage_credit_base_usd plus outage_credit_increment_usd for each
      full outage_credit_increment_hours by which the duration exceeds the minimum, capped at
      outage_credit_cap_usd. No credit is granted for an outage on a major event day when
      outage_major_event_excluded is true, for planned_maintenance or public_safety_shutoff outages announced
      in advance, or for customer_equipment outages. The credit must be requested no later than the claim
      window after the restoration of service after the outage. The window is counted in calendar days
      starting the day after the restoration date, and a request on the last day is accepted. Each outage
      record earns at most one credit of each credit code. The schedule in effect on the outage start date
      governs. A chronic-outage credit is decided separately under service_chronic_outage_credit and stacks
      with this credit.
    eligibility:
      - id: claim_window
        applies_to: [service_outage_credit]
        kind: time
        condition: "The credit must be requested no later than the claim window after the restoration of service after the outage."
        evidence_fields: [service_outages.restoration_time, service_outages.outage_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_outages.outage_event_id]
          action_bindings:
            service_outages.outage_event_id: outage_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the restoration of service after the outage
          anchor_source: service_outages.restoration_time
          relation: not_after
          duration_source: variants.outage_credit_claim_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the restoration date, and a request on the last day is accepted."
          boundary: inclusive
      - id: one_credit_per_code_per_outage
        applies_to: [service_outage_credit]
        kind: dedup
        condition: "Each outage record earns at most one credit of each credit code."
        evidence_fields: [service_credits.outage_event_id, service_credits.credit_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_credits.outage_event_id]
          action_bindings:
            service_credits.outage_event_id: outage_event_id
        dedup_contract:
          table: service_credits
          mode: separate_record
          object_bindings: {outage_event_id: outage_event_id}
          duplicate_filters: {credit_code: [sustained_outage]}
          distinct_fields: [credit_code]
    params:
      per_tier:
        Schedule RS Residential Standard Service: {min_hours: "=outage_credit_min_hours", base: "=outage_credit_base_usd", increment: "=outage_credit_increment_usd", cap: "=outage_credit_cap_usd"}
        Schedule RT Residential Time-of-Use Service: {min_hours: "=outage_credit_min_hours", base: "=outage_credit_base_usd", increment: "=outage_credit_increment_usd", cap: "=outage_credit_cap_usd"}
        Schedule REV Residential Electric Vehicle Time-of-Use Service: {min_hours: "=outage_credit_min_hours", base: "=outage_credit_base_usd", increment: "=outage_credit_increment_usd", cap: "=outage_credit_cap_usd"}
        Schedule GS Small General Service: {min_hours: "=outage_credit_min_hours", base: "=outage_credit_base_usd", increment: "=outage_credit_increment_usd", cap: "=outage_credit_cap_usd"}
        Schedule GST Small General Time-of-Use Service: {min_hours: "=outage_credit_min_hours", base: "=outage_credit_base_usd", increment: "=outage_credit_increment_usd", cap: "=outage_credit_cap_usd"}
        Schedule GD Medium General Demand Service: {min_hours: "=outage_credit_min_hours", base: "=outage_credit_base_usd", increment: "=outage_credit_increment_usd", cap: "=outage_credit_cap_usd"}
        Schedule LP Large Power Service: {min_hours: "=outage_credit_min_hours", base: "=outage_credit_base_usd", increment: "=outage_credit_increment_usd", cap: "=outage_credit_cap_usd"}
    formula:
      when_not: "duration_hours < outage_credit_min_hours"
      amount: "min(outage_credit_cap_usd, outage_credit_base_usd + outage_credit_increment_usd * ((duration_hours - outage_credit_min_hours) // outage_credit_increment_hours))"

  - id: service_chronic_outage_credit
    subject: [service_outage_credit]
    rule: >-
      A chronic-outage credit (credit_code chronic_outage) of the schedule's chronic_outage_credit_usd is
      granted when service_msr_outages_12m for an outage record reaches chronic_outage_count_threshold. The
      count includes every outage record at the address regardless of duration, cause or major event day,
      because the chronic credit compensates repeated interruptions rather than one long one. At most one
      chronic-outage credit is posted per account in any 12 months, so it is not granted when
      service_msr_chronic_credits_12m is already one or more. The credit is attached to the outage record
      that reached the threshold and is posted on request under the same claim window as the
      sustained-outage credit. It stacks with any sustained-outage credit for the same outage record.
    eligibility:
      - id: one_chronic_credit_per_outage
        applies_to: [service_outage_credit]
        kind: dedup
        condition: "At most one chronic-outage credit is posted per account in any 12 months, so it is not granted when service_msr_chronic_credits_12m is already one or more."
        evidence_fields: [service_credits.service_account_id, service_credits.credit_code, service_credits.posting_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_credits.service_account_id]
          action_bindings:
            service_credits.service_account_id: service_account_id
        dedup_contract:
          table: service_credits
          mode: separate_record
          object_bindings: {service_account_id: service_account_id}
          duplicate_filters: {credit_code: [chronic_outage]}
          distinct_fields: [posting_date]
    params:
      per_tier:
        Schedule RS Residential Standard Service: {threshold: "=chronic_outage_count_threshold", credit: "=chronic_outage_credit_usd"}
        Schedule RT Residential Time-of-Use Service: {threshold: "=chronic_outage_count_threshold", credit: "=chronic_outage_credit_usd"}
        Schedule REV Residential Electric Vehicle Time-of-Use Service: {threshold: "=chronic_outage_count_threshold", credit: "=chronic_outage_credit_usd"}
        Schedule GS Small General Service: {threshold: "=chronic_outage_count_threshold", credit: "=chronic_outage_credit_usd"}
        Schedule GST Small General Time-of-Use Service: {threshold: "=chronic_outage_count_threshold", credit: "=chronic_outage_credit_usd"}
        Schedule GD Medium General Demand Service: {threshold: "=chronic_outage_count_threshold", credit: "=chronic_outage_credit_usd"}
        Schedule LP Large Power Service: {threshold: "=chronic_outage_count_threshold", credit: "=chronic_outage_credit_usd"}
    measures: [service_msr_outages_12m, service_msr_chronic_credits_12m]

  - id: service_tou_bill_protection
    subject: [service_billing_credit]
    rule: >-
      A customer who joins Schedule RT, REV or GST receives bill protection for the schedule's
      tou_bill_protection_months starting on the rate_effective_date of that schedule. After the last bill of
      the protection period, the energy charges of every regular bill in the period are recomputed under the
      base flat schedule (Schedule RS for RT and REV, Schedule GS for GST) using the same kWh, and when the
      total actually billed exceeds the recomputed total, the difference is credited once as a
      service_billing_credit with credit_code tou_bill_protection and the agreement as source_reference_id.
      No credit is due when the time-of-use total is equal or lower. Bill protection is granted once per
      service agreement; it ends early without any credit when the customer leaves the time-of-use schedule
      before the period ends.
    eligibility:
      - id: protection_once_per_agreement
        applies_to: [service_billing_credit]
        kind: dedup
        condition: "Bill protection is granted once per service agreement; it ends early without any credit when the customer leaves the time-of-use schedule before the period ends."
        evidence_fields: [service_credits.source_reference_id, service_credits.credit_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_credits.source_reference_id]
          action_bindings:
            service_credits.source_reference_id: source_reference_id
        dedup_contract:
          table: service_credits
          mode: separate_record
          object_bindings: {source_reference_id: source_reference_id}
          duplicate_filters: {credit_code: [tou_bill_protection]}
          distinct_fields: []
    params:
      per_tier:
        Schedule RS Residential Standard Service: {protection_months: "=tou_bill_protection_months"}
        Schedule RT Residential Time-of-Use Service: {protection_months: "=tou_bill_protection_months"}
        Schedule REV Residential Electric Vehicle Time-of-Use Service: {protection_months: "=tou_bill_protection_months"}
        Schedule GS Small General Service: {protection_months: "=tou_bill_protection_months"}
        Schedule GST Small General Time-of-Use Service: {protection_months: "=tou_bill_protection_months"}
        Schedule GD Medium General Demand Service: {protection_months: "=tou_bill_protection_months"}
        Schedule LP Large Power Service: {protection_months: "=tou_bill_protection_months"}

  - id: service_stop_and_final_bill
    subject: [service_stop, service_start_cancellation, service_disconnected_closure, service_credit_refund]
    rule: >-
      Only the customer of record can stop service or cancel a start; the agent records the request as a
      stop_service or cancel_start order awaiting the customer's confirmation, and the agreement closes only
      when the customer confirms. The stop effective date must be at least stop_notice_min_business_days
      business days after the request date, counting business days as Monday through Friday excluding company
      holidays; an earlier date is moved to the first permitted date. A start can be cancelled only while the
      agreement is pending_start. A disconnected agreement not reconnected within disconnected_closure_days
      calendar days after the disconnection date is closed by the system on the day after that period ends.
      Every closure issues a final bill within final_bill_issue_business_days business days. Any security
      deposit held is applied to the final bill under the deposit program before a refund is considered. A
      credit balance remaining on a closed agreement after the final bill and deposit application is refunded
      by check when it is at least credit_refund_minimum_usd; a refund is issued only on a closed agreement
      whose balance is below zero, and only for the whole credit balance.
    eligibility:
      - id: refund_on_closed_agreement
        applies_to: [service_credit_refund]
        kind: state
        condition: "a refund is issued only on a closed agreement whose balance is below zero, and only for the whole credit balance."
        evidence_fields: [service_accounts.status, service_accounts.account_balance, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [closed]
    params:
      per_tier:
        Schedule RS Residential Standard Service: {stop_notice: "=stop_notice_min_business_days", closure_days: "=disconnected_closure_days"}
        Schedule RT Residential Time-of-Use Service: {stop_notice: "=stop_notice_min_business_days", closure_days: "=disconnected_closure_days"}
        Schedule REV Residential Electric Vehicle Time-of-Use Service: {stop_notice: "=stop_notice_min_business_days", closure_days: "=disconnected_closure_days"}
        Schedule GS Small General Service: {stop_notice: "=stop_notice_min_business_days", closure_days: "=disconnected_closure_days"}
        Schedule GST Small General Time-of-Use Service: {stop_notice: "=stop_notice_min_business_days", closure_days: "=disconnected_closure_days"}
        Schedule GD Medium General Demand Service: {stop_notice: "=stop_notice_min_business_days", closure_days: "=disconnected_closure_days"}
        Schedule LP Large Power Service: {stop_notice: "=stop_notice_min_business_days", closure_days: "=disconnected_closure_days"}

  - id: service_program_postings
    subject: [service_program_debit, service_program_credit, service_backbill_charge, service_billing_credit]
    rule: >-
      Amounts decided in another program are posted to the service agreement named on the originating record,
      for exactly the originating record's amount, on the originating record's date, with the originating
      record's id as source_reference_id and the charge_code or credit_code that names the program entry.
      Each originating record is posted once per code. A meter accuracy adjustment that refunds overbilling
      posts a service_billing_credit with credit_code meter_error_refund, and one that recovers underbilling
      posts a service_backbill_charge with backbill_reason slow_meter, and energy found used through confirmed
      tampering or diversion posts a service_backbill_charge with backbill_reason unauthorized_use. A corrected estimated reading posts the
      difference as a service_backbill_charge with backbill_reason estimated_read_true_up or as a
      service_billing_credit with credit_code billing_error_correction. Program postings are accepted on an
      agreement in any status except pending_start, so that a closed agreement can still receive deposit
      applications and final program amounts.
    eligibility:
      - id: post_each_source_once
        applies_to: [service_program_debit, service_program_credit, service_backbill_charge]
        kind: dedup
        condition: "Each originating record is posted once per code."
        evidence_fields: [service_charges.source_reference_id, service_charges.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_charges.source_reference_id]
          action_bindings:
            service_charges.source_reference_id: source_reference_id
        dedup_contract:
          table: service_charges
          mode: separate_record
          object_bindings: {source_reference_id: source_reference_id}
          duplicate_filters: {event_type: [service_program_debit, service_backbill_charge]}
          distinct_fields: [charge_code]
      - id: posting_on_opened_agreement
        applies_to: [service_program_debit, service_program_credit, service_backbill_charge, service_billing_credit]
        kind: state
        condition: "Program postings are accepted on an agreement in any status except pending_start, so that a closed agreement can still receive deposit applications and final program amounts."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active, notice_pending, disconnected, closed]

  - id: service_outage_recording
    subject: [service_outage_record]
    rule: >-
      Outage records are created by the outage management system, never from a customer's account of an
      outage. One record is written for each interruption at the service address lasting 5 minutes or longer;
      momentary interruptions shorter than 5 minutes are not recorded and earn no credit. duration_hours is the
      time from outage_start to restoration_time rounded to one decimal place. major_event_day is true when the
      interruption began on a day the company declared a major event day under its reliability reporting
      method, and the flag is never changed afterwards. When a customer reports an outage that has no record at
      the address, no outage credit can be decided from the customer's account, and the request is handed to a
      human representative as not covered by policy so that field records can be reviewed.
    eligibility: []
    params:
      momentary_interruption_minutes: 5
