# Metering Service — the revenue meter installed at a service agreement's premise: its type and
# capabilities, readings and estimates, customer-requested and periodic accuracy tests, billing
# adjustments for meters found outside tolerance, smart-meter opt-out, and tampering findings.
# The category opens no account of its own: every amount it decides (test fees, opt-out fees,
# tampering charges, accuracy refunds and backbills) is booked on the service agreement's
# account_balance through the triggers declared below.

category: meter
display_name: Metering Service

binding:
  holding_table: meter_installations
  event_tables: [meter_reads, meter_tests, meter_adjustments, meter_charges, meter_field_orders]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [scheduled, in_service, removed, cancelled]
  transitions:
    - {from: scheduled, to: in_service, by: system, means: The field crew installs the meter and it starts registering for billing.}
    - {from: scheduled, to: cancelled, by: agent, means: An installation order is withdrawn before the meter is installed, at the customer's request or because the service start was cancelled.}
    - {from: in_service, to: removed, by: system, means: The meter is taken out of service for exchange, shop testing, an opt-out or return, or because the service agreement closed.}

accounts: []

parameter_schema:
  accuracy_class: ANSI C12 accuracy class of the meter type.
  accuracy_tolerance_pct: Allowed deviation of registration from 100 percent, in percentage points; a meter registering within 100 plus or minus this value is accurate.
  free_tests_per_period: Customer-requested tests performed without charge in each free-test period at one service agreement.
  free_test_period_months: Length of the free-test look-back period, months.
  repeat_test_fee_usd: Fee for a customer-requested test beyond the free allowance when the meter is found accurate, USD.
  fee_waived_if_outside_tolerance: Whether the repeat test fee is waived when the meter is found outside tolerance (true/false).
  test_completion_business_days: Business days after the request within which the test must be performed.
  witness_test_allowed: Whether the customer or a representative may witness the test (true/false).
  test_method: Where a customer-requested test is performed, enum shop (meter exchanged and tested in the meter shop) or field (tested in place).
  periodic_test_interval_years: Years between scheduled periodic tests of an installation; 0 means the type is covered by statistical sample testing only.
  commission_referee_test_allowed: Whether the customer may ask for a Commission referee test after disputing a company test (true/false).
  commission_referee_test_fee_usd: Fee the customer pays for a Commission referee test, refunded if the meter is found outside tolerance, USD.
  referee_request_window_days: Calendar days after the company test date within which a referee test may be requested.
  refund_max_months: Longest period, ending on the test date, for which overbilling found by a test is refunded, months.
  backbill_max_months: Longest period, ending on the test date, for which underbilling found by a test is backbilled, months.
  error_start_basis: How the start of the adjustment period is fixed when no record shows when the error began.
  adjustment_charge_basis: Which bill charges are corrected by an accuracy adjustment.
  adjustment_threshold_usd: Smallest accuracy adjustment that is posted; smaller differences are not adjusted, USD.
  non_registering_basis: How usage is estimated for a meter found not registering.
  adjustment_rounding_rule: How adjustment kWh and amounts are rounded.
  read_method: How the meter is read, enum remote or manual.
  manual_read_interval_months: Months between field reads for manually read meters; 0 for remotely read meters.
  estimated_read_limit_consecutive: Consecutive estimated bills after which the next read must be an actual field read.
  field_read_after_limit_business_days: Business days within which a field read is made once the estimate limit is reached.
  customer_read_accepted: Whether a reading submitted by the customer is used for billing in months without a company read (true/false).
  customer_read_window_days: Calendar days before the billing period end within which a customer reading is accepted; 0 when customer reads are not accepted.
  estimate_method: How an estimated reading is computed.
  estimate_true_up_rule: How estimated usage is reconciled at the next actual read.
  remote_switch_capable: Whether the meter can disconnect and reconnect service remotely (true/false).
  interval_length_minutes: Length of the interval data the meter records; 0 when no interval data.
  tou_capable: Whether the meter records on-peak, off-peak and super off-peak usage for time-of-use schedules (true/false).
  bidirectional: Whether the meter registers delivered and received energy separately, as net energy metering requires (true/false).
  demand_register: Whether the meter records 15-minute demand (true/false).
  supported_schedules: Rate schedules the meter type can bill.
  opt_out_eligible: Whether a customer holding this meter type may opt out to a non-communicating meter (true/false).
  opt_out_setup_fee_usd: One-time fee for installing a non-communicating opt-out meter, USD; 0.00 on types that are not the opt-out meter.
  opt_out_monthly_fee_usd: Monthly manual-read fee for a non-communicating opt-out meter, USD; 0.00 on other types.
  opt_out_setup_fee_income_qualified_usd: Opt-out setup fee when the customer's income qualification is current, USD; 0.00 on other types.
  opt_out_monthly_fee_income_qualified_usd: Opt-out monthly fee when the customer's income qualification is current, USD; 0.00 on other types.
  smart_meter_return_fee_usd: Fee for returning from an opt-out meter to a communicating meter, USD.
  opt_out_reelection_lockout_months: Months after returning to a communicating meter before the customer may opt out again; 0 on types that cannot be opted out of.
  installation_lead_business_days: Business days between an installation order and the earliest installation date.
  tampering_charge_usd: Investigation charge when meter tampering or diversion is confirmed, USD.
  unauthorized_use_backbill_months: Longest period for which energy used through tampering or diversion is backbilled, months.
  access_failure_letter_threshold: Consecutive failed field-read visits after which an access letter is sent and a self-read is requested.
  meter_exchange_on_failure_business_days: Business days within which a meter found non-registering or outside tolerance is replaced.
  adjustment_rate_basis: Which rates price the corrected usage.
  periodic_test_fee_usd: Fee charged to the customer for a periodic or utility-initiated test (always 0.00), USD.

