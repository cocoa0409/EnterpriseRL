events:
  # ---- holding (meter_installations) ------------------------------------------
  - type: meter_installation_order
    target: meter_installations
    mutation: create
    meaning: A meter of a given type is ordered for installation at a service agreement's premise.
    grain: One row per meter installation ordered.
    fields:
      customer_id: Customer of record on the service agreement.
      service_account_id: Service agreement whose premise receives the meter.
      variant_name: Meter type, official full name.
      meter_number: Serial number of the meter assigned to the order.
      order_date: Date the installation was ordered.
      installation_reason: Why the meter is being installed.
      status_date: Date of the order.
    triggers: []
  - type: meter_installation_completion
    target: meter_installations
    mutation: {transition: {from: scheduled, to: in_service}}
    meaning: The ordered meter is installed and starts registering for billing.
    grain: One row per transaction.
    fields:
      installed_date: Date the meter was installed.
      status_date: Date the meter was installed.
    triggers: []
  - type: meter_removal
    target: meter_installations
    mutation: {transition: {from: in_service, to: removed}}
    meaning: The meter is taken out of service.
    grain: One row per transaction.
    fields:
      removed_date: Date the meter was removed.
      status_date: Date the meter was removed.
    triggers: []
  - type: meter_order_cancellation
    target: meter_installations
    mutation: {transition: {from: scheduled, to: cancelled}}
    meaning: An installation order is withdrawn before the meter is installed.
    grain: One row per transaction.
    fields:
      status_date: Date the order was withdrawn.
    triggers: []
  # ---- readings (meter_reads) --------------------------------------------------
  - type: meter_read
    target: meter_reads
    meaning: A billing reading of the meter's register is recorded.
    grain: One row per billing reading.
    distinguish_by: [read_date]
    fields:
      read_date: Date of the reading (the billing period end date).
      read_type: Actual company read, estimate, or customer-submitted read.
      register_kwh: Cumulative register reading in kWh.
      kwh_since_last_read: kWh registered since the previous billing reading.
    triggers: []
  # ---- tests (meter_tests) ------------------------------------------------------
  - type: meter_test_request
    target: meter_tests
    meaning: An accuracy test of the installed meter is requested or scheduled.
    grain: One row per test request.
    distinguish_by: [request_date, test_reason]
    fields:
      request_date: Date the test was requested or scheduled.
      test_reason: Who or what initiated the test.
      witness_requested: Whether the customer asked to witness the test.
      scheduled_date: Date the test is scheduled to be performed.
    triggers: []
  - type: meter_test_result
    target: meter_tests
    meaning: The result of an accuracy test is recorded.
    grain: One row per test performed.
    distinguish_by: [test_request_id, test_date]
    fields:
      test_request_id: The test request this result answers.
      test_date: Date the test was performed.
      test_method: Shop or field test.
      registration_pct: Energy registered by the meter as a percentage of true energy, 2 decimals.
      test_result: Classification of the result against the meter type's tolerance.
    triggers: []
  # ---- adjustments (meter_adjustments) ----------------------------------------
  - type: meter_accuracy_adjustment
    target: meter_adjustments
    meaning: The billing correction for a meter found outside tolerance or not registering is calculated.
    grain: One row per test result adjusted.
    distinguish_by: [meter_test_id]
    fields:
      meter_test_id: The test result that found the meter outside tolerance.
      adjustment_date: Date the adjustment was calculated.
      adjustment_direction: Refund of overbilling or backbill of underbilling.
      adjustment_start_date: First day of the adjustment period.
      adjustment_end_date: Last day of the adjustment period (the test date).
      adjusted_kwh: kWh overbilled or underbilled in the adjustment period, absolute value.
      amount: Amount refunded or backbilled, absolute value.
    triggers:
      - event: service:service_billing_credit
        when: {adjustment_direction: refund}
        map: {posting_date: adjustment_date, amount: amount, credit_code: meter_error_refund, source_reference_id: meter_adjustment_id}
      - event: service:service_backbill_charge
        when: {adjustment_direction: backbill}
        map: {posting_date: adjustment_date, amount: amount, backbill_reason: slow_meter, source_reference_id: meter_adjustment_id}
  # ---- charges (meter_charges) ---------------------------------------------------
  - type: meter_test_fee
    target: meter_charges
    meaning: The repeat test fee is charged for a customer-requested test beyond the free allowance that found the meter accurate.
    grain: One row per chargeable test result.
    distinguish_by: [meter_test_id]
    fields:
      fee_date: Date the fee was charged.
      amount: Fee amount.
      meter_test_id: The test result the fee is charged for.
    triggers:
      - event: service:service_program_debit
        map: {posting_date: fee_date, amount: amount, charge_code: meter_test_fee, source_reference_id: meter_charge_id}
  - type: meter_opt_out_setup_fee
    target: meter_charges
    meaning: The one-time fee for installing a non-communicating opt-out meter is charged.
    grain: One row per opt-out meter installed.
    distinguish_by: [fee_date]
    fields:
      fee_date: Date the opt-out meter was installed.
      amount: Fee amount.
    triggers:
      - event: service:service_program_debit
        map: {posting_date: fee_date, amount: amount, charge_code: meter_opt_out_setup_fee, source_reference_id: meter_charge_id}
  - type: meter_opt_out_monthly_fee
    target: meter_charges
    meaning: The monthly manual-read fee of an opt-out meter is charged for one billing period.
    grain: One row per billing period with an opt-out meter in service.
    distinguish_by: [fee_date]
    fields:
      fee_date: Billing period end date the fee is charged for.
      amount: Fee amount.
    triggers:
      - event: service:service_program_debit
        map: {posting_date: fee_date, amount: amount, charge_code: meter_opt_out_monthly_fee, source_reference_id: meter_charge_id}
  - type: meter_tampering_charge
    target: meter_charges
    meaning: The investigation charge for confirmed meter tampering or diversion is charged.
    grain: One row per confirmed finding.
    distinguish_by: [meter_field_order_id]
    fields:
      fee_date: Date the charge was posted.
      amount: Charge amount.
      meter_field_order_id: The field order that confirmed the tampering or diversion.
    triggers:
      - event: service:service_program_debit
        map: {posting_date: fee_date, amount: amount, charge_code: meter_tampering_charge, source_reference_id: meter_charge_id}
  # ---- field orders (meter_field_orders) ------------------------------------------
  - type: meter_tampering_finding
    target: meter_field_orders
    meaning: A field investigation records whether the meter was tampered with or service diverted.
    grain: One row per field investigation.
    distinguish_by: [order_date]
    fields:
      order_date: Date of the field investigation.
      finding: Outcome of the investigation.
      unbilled_kwh: Estimated kWh used but not registered because of the tampering or diversion; 0 when none.
    triggers:
      - event: meter:meter_tampering_charge
        when: {finding: [tampering_confirmed, diversion_confirmed]}
        map: {fee_date: order_date, meter_field_order_id: meter_field_order_id}
  - type: meter_access_failure
    target: meter_field_orders
    meaning: A field visit to read or work on the meter fails because the meter could not be reached.
    grain: One row per failed visit.
    distinguish_by: [order_date]
    fields:
      order_date: Date of the failed visit.
      finding: Recorded as no_access.
    triggers: []

measures:
  - id: meter_msr_customer_tests_in_period
    window: The free_test_period_months calendar months ending the day before the request date of the test under review.
    measure: Count of meter_test_request rows with test_reason customer_request on any meter installation of the same service agreement whose request_date falls in the window.
  - id: meter_msr_consecutive_estimates
    window: The meter installation's readings up to the handling date, most recent first.
    measure: Number of consecutive most recent meter_read rows on the installation with read_type estimated.
  - id: meter_msr_error_start_date
    window: The meter installation's history up to the test date.
    measure: The later of (a) the midpoint date between the later of installed_date and the latest earlier meter_test_result test_date on the installation, and the test date (rounded down to a whole day), and (b) the test date minus refund_max_months (for a refund) or backbill_max_months (for a backbill) calendar months.
  - id: meter_msr_affected_charges
    window: Regular service bills of the agreement whose billing_period_end falls after the adjustment start date and on or before the test date.
    measure: Sum of energy_charge_amount, demand_charge_amount and rider_charge_amount of those bills, together with the sum of their kwh_total.

policies:
  - id: meter_agg_multi_holding
    subject: [meter_installation_order]
    rule: >-
      Each service agreement has one meter in service at a time. A customer may hold meter installations at
      every service agreement the customer has, and the same agreement accumulates installations over time as
      meters are exchanged. No other installation order for the same service agreement is in scheduled
      status. An exchange is made by ordering the new meter while the old one is in_service; the old meter is
      removed on the day the new one is installed.
    eligibility:
      - id: one_open_order_per_agreement
        applies_to: [meter_installation_order]
        kind: dedup
        condition: "No other installation order for the same service agreement is in scheduled status."
        evidence_fields: [meter_installations.service_account_id, meter_installations.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meter_installations.service_account_id]
          action_bindings:
            meter_installations.service_account_id: service_account_id
        dedup_contract:
          table: meter_installations
          mode: separate_record
          object_bindings: {service_account_id: service_account_id}
          duplicate_filters: {status: [scheduled]}
          distinct_fields: [order_date]
    params:
      max_per_customer: null

  - id: meter_agg_agreement_test_allowance
    subject: [meter_test_request, meter_test_fee]
    rule: >-
      The free-test allowance belongs to the service agreement, not to a single meter. Customer-requested
      tests on every installation of the same service agreement count together in
      meter_msr_customer_tests_in_period, so exchanging a meter after a test does not renew the allowance. Tests
      at different service agreements of the same customer are counted separately. Periodic, utility-initiated
      and Commission referee tests never count toward the allowance.
    eligibility: []
    measures: [meter_msr_customer_tests_in_period]

  - id: meter_test_request_rule
    subject: [meter_test_request]
    rule: >-
      The customer of record may ask for an accuracy test of the meter in service at any of the customer's
      service agreements at any time; the request is recorded with test_reason customer_request. A test is
      requested only for a meter installation in in_service status. The scheduled date is no later than
      test_completion_business_days business days after the request date, counting business days as Monday
      through Friday excluding company holidays. Where witness_test_allowed is true the customer may ask to
      witness it. After a company test, a customer who disputes the result may ask for a Commission referee
      test where commission_referee_test_allowed is true. The referee test must be requested no later than the
      referee request window after the company test date. The window is counted in calendar days from the day
      after the company test date, and a request on the last day is accepted. The referee test fee is paid by
      the customer and refunded if the referee finds the meter outside tolerance. Periodic tests are scheduled
      by the company every periodic_test_interval_years for types that have an interval. A test request does
      not suspend bills, but the late payment charge on bills issued before the request is deferred under the
      service agreement's late payment rule while the test has no recorded result.
    eligibility:
      - id: test_meter_in_service
        applies_to: [meter_test_request]
        kind: state
        condition: "A test is requested only for a meter installation in in_service status."
        evidence_fields: [meter_installations.status, meter_installations.meter_installation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meter_installations.meter_installation_id]
          action_bindings:
            meter_installations.meter_installation_id: meter_installation_id
        state_contract:
          field: meter_installations.status
          allowed: [in_service]
      - id: referee_window
        applies_to: [meter_test_request]
        kind: time
        condition: "The referee test must be requested no later than the referee request window after the company test date."
        evidence_fields: [meter_tests.test_date, meter_tests.meter_test_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meter_tests.meter_test_id]
          action_bindings:
            meter_tests.meter_test_id: meter_test_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the company test date
          anchor_source: meter_tests.test_date
          relation: not_after
          duration_source: variants.referee_request_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from the day after the company test date, and a request on the last day is accepted."
          boundary: inclusive
    params:
      per_tier:
        Non-Communicating Opt-Out Meter: {completion_days: "=test_completion_business_days", referee_window: "=referee_request_window_days", referee_fee: "=commission_referee_test_fee_usd"}
        Standard AMI Smart Meter: {completion_days: "=test_completion_business_days", referee_window: "=referee_request_window_days", referee_fee: "=commission_referee_test_fee_usd"}
        AMI Bidirectional Net Meter: {completion_days: "=test_completion_business_days", referee_window: "=referee_request_window_days", referee_fee: "=commission_referee_test_fee_usd"}
        AMI Three-Phase Commercial Meter: {completion_days: "=test_completion_business_days", referee_window: "=referee_request_window_days", referee_fee: "=commission_referee_test_fee_usd"}
        AMI Interval Demand Meter: {completion_days: "=test_completion_business_days", referee_window: "=referee_request_window_days", referee_fee: "=commission_referee_test_fee_usd"}
        Primary Metering Installation: {completion_days: "=test_completion_business_days", referee_window: "=referee_request_window_days", referee_fee: "=commission_referee_test_fee_usd"}

  - id: meter_test_result_rule
    subject: [meter_test_result]
    rule: >-
      A test result classifies the meter by its registration_pct against the type's accuracy_tolerance_pct:
      within_tolerance when registration_pct is at least 100 minus the tolerance and at most 100 plus the
      tolerance, fast above that band, slow below it, and non_registering when the meter registered no energy
      at test load. Each test request receives one result. A meter found fast, slow or non_registering is
      replaced within meter_exchange_on_failure_business_days business days and its billing is corrected under
      meter_accuracy_adjustment_rule. A within_tolerance result closes the request without any billing
      correction.
    eligibility:
      - id: one_result_per_request
        applies_to: [meter_test_result]
        kind: dedup
        condition: "Each test request receives one result."
        evidence_fields: [meter_tests.test_request_id, meter_tests.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meter_tests.test_request_id]
          action_bindings:
            meter_tests.test_request_id: test_request_id
        dedup_contract:
          table: meter_tests
          mode: separate_record
          object_bindings: {test_request_id: test_request_id}
          duplicate_filters: {event_type: [meter_test_result]}
          distinct_fields: []
    params:
      per_tier:
        Non-Communicating Opt-Out Meter: {tolerance: "=accuracy_tolerance_pct"}
        Standard AMI Smart Meter: {tolerance: "=accuracy_tolerance_pct"}
        AMI Bidirectional Net Meter: {tolerance: "=accuracy_tolerance_pct"}
        AMI Three-Phase Commercial Meter: {tolerance: "=accuracy_tolerance_pct"}
        AMI Interval Demand Meter: {tolerance: "=accuracy_tolerance_pct"}
        Primary Metering Installation: {tolerance: "=accuracy_tolerance_pct"}
    formula:
      fast: "registration_pct > 100 + accuracy_tolerance_pct"
      slow: "registration_pct < 100 - accuracy_tolerance_pct and registration_pct > 0"

  - id: meter_test_fee_rule
    subject: [meter_test_fee]
    rule: >-
      The repeat test fee is charged only for a customer-requested test whose result is within_tolerance and
      only when meter_msr_customer_tests_in_period for that request already reaches free_tests_per_period. No
      fee is charged when the meter is found fast, slow or non_registering, for periodic or utility-initiated
      tests, or for the first test in the period. Each test result is charged at most once. The fee is the
      repeat_test_fee_usd of the meter type tested and is posted on the test date.
    eligibility:
      - id: fee_once_per_test
        applies_to: [meter_test_fee]
        kind: dedup
        condition: "Each test result is charged at most once."
        evidence_fields: [meter_charges.meter_test_id, meter_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meter_charges.meter_test_id]
          action_bindings:
            meter_charges.meter_test_id: meter_test_id
        dedup_contract:
          table: meter_charges
          mode: separate_record
          object_bindings: {meter_test_id: meter_test_id}
          duplicate_filters: {event_type: [meter_test_fee]}
          distinct_fields: []
    params:
      per_tier:
        Non-Communicating Opt-Out Meter: {fee: "=repeat_test_fee_usd", free_tests: "=free_tests_per_period", period_months: "=free_test_period_months"}
        Standard AMI Smart Meter: {fee: "=repeat_test_fee_usd", free_tests: "=free_tests_per_period", period_months: "=free_test_period_months"}
        AMI Bidirectional Net Meter: {fee: "=repeat_test_fee_usd", free_tests: "=free_tests_per_period", period_months: "=free_test_period_months"}
        AMI Three-Phase Commercial Meter: {fee: "=repeat_test_fee_usd", free_tests: "=free_tests_per_period", period_months: "=free_test_period_months"}
        AMI Interval Demand Meter: {fee: "=repeat_test_fee_usd", free_tests: "=free_tests_per_period", period_months: "=free_test_period_months"}
        Primary Metering Installation: {fee: "=repeat_test_fee_usd", free_tests: "=free_tests_per_period", period_months: "=free_test_period_months"}
    measures: [meter_msr_customer_tests_in_period]

  - id: meter_accuracy_adjustment_rule
    subject: [meter_accuracy_adjustment]
    rule: >-
      A meter found fast is corrected by a refund and a meter found slow or non_registering by a backbill. The
      adjustment period ends on the test date and starts on meter_msr_error_start_date, which applies
      error_start_basis and caps the period at refund_max_months for a refund or backbill_max_months for a
      backbill. The corrected charges are the energy, demand and Power Supply Cost Recovery charges of the
      regular bills whose billing period ends inside the adjustment period (meter_msr_affected_charges). For a
      fast or slow meter the amount is those charges times the absolute value of one minus 100 divided by
      registration_pct, and adjusted_kwh is their kwh_total times the same factor, both rounded at the end. For
      a non_registering meter the backbill is computed under non_registering_basis. An adjustment smaller than
      adjustment_threshold_usd is recorded with amount 0.00 and posts nothing. Each test result is adjusted
      once. The refund is credited, and the backbill billed, on the service agreement on the adjustment date.
      Backbills never attract a late payment charge, and a backbill for a residential customer may be placed in
      a payment arrangement under the payment arrangement program's terms.
    eligibility:
      - id: adjust_each_result_once
        applies_to: [meter_accuracy_adjustment]
        kind: dedup
        condition: "Each test result is adjusted once."
        evidence_fields: [meter_adjustments.meter_test_id, meter_adjustments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meter_adjustments.meter_test_id]
          action_bindings:
            meter_adjustments.meter_test_id: meter_test_id
        dedup_contract:
          table: meter_adjustments
          mode: separate_record
          object_bindings: {meter_test_id: meter_test_id}
          duplicate_filters: {event_type: [meter_accuracy_adjustment]}
          distinct_fields: []
    params:
      per_tier:
        Non-Communicating Opt-Out Meter: {refund_months: "=refund_max_months", backbill_months: "=backbill_max_months", threshold: "=adjustment_threshold_usd"}
        Standard AMI Smart Meter: {refund_months: "=refund_max_months", backbill_months: "=backbill_max_months", threshold: "=adjustment_threshold_usd"}
        AMI Bidirectional Net Meter: {refund_months: "=refund_max_months", backbill_months: "=backbill_max_months", threshold: "=adjustment_threshold_usd"}
        AMI Three-Phase Commercial Meter: {refund_months: "=refund_max_months", backbill_months: "=backbill_max_months", threshold: "=adjustment_threshold_usd"}
        AMI Interval Demand Meter: {refund_months: "=refund_max_months", backbill_months: "=backbill_max_months", threshold: "=adjustment_threshold_usd"}
        Primary Metering Installation: {refund_months: "=refund_max_months", backbill_months: "=backbill_max_months", threshold: "=adjustment_threshold_usd"}
    formula:
      error_factor: "abs(1 - 100 / registration_pct)"
      amount: "round(meter_msr_affected_charges * error_factor, 2)"
    measures: [meter_msr_error_start_date, meter_msr_affected_charges]

  - id: meter_reading_and_estimation
    subject: [meter_read, meter_access_failure]
    rule: >-
      Remotely read meters are read on every billing period end date; manually read meters are field-read every
      manual_read_interval_months and estimated under estimate_method in between, unless a customer reading is
      accepted. A customer reading is used only where customer_read_accepted is true and it is submitted within
      customer_read_window_days before the billing period end. When meter_msr_consecutive_estimates reaches
      estimated_read_limit_consecutive, the next reading must be an actual field read made within
      field_read_after_limit_business_days business days. A failed field visit is recorded as an access
      failure; after access_failure_letter_threshold consecutive failures an access letter is sent and a
      customer reading is requested. Each billing period end date has one reading per installation. Estimated
      usage is reconciled under estimate_true_up_rule, which posts the difference on the service agreement as a
      backbill with backbill_reason estimated_read_true_up or a billing_error_correction credit.
    eligibility:
      - id: one_read_per_period
        applies_to: [meter_read]
        kind: dedup
        condition: "Each billing period end date has one reading per installation."
        evidence_fields: [meter_reads.meter_installation_id, meter_reads.read_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meter_reads.meter_installation_id, meter_reads.read_date]
          action_bindings:
            meter_reads.meter_installation_id: meter_installation_id
            meter_reads.read_date: read_date
        dedup_contract:
          table: meter_reads
          mode: separate_record
          object_bindings: {meter_installation_id: meter_installation_id, read_date: read_date}
          duplicate_filters: {event_type: [meter_read]}
          distinct_fields: []
    params:
      per_tier:
        Non-Communicating Opt-Out Meter: {read_interval: "=manual_read_interval_months", estimate_limit: "=estimated_read_limit_consecutive", customer_reads: "=customer_read_accepted"}
        Standard AMI Smart Meter: {read_interval: "=manual_read_interval_months", estimate_limit: "=estimated_read_limit_consecutive", customer_reads: "=customer_read_accepted"}
        AMI Bidirectional Net Meter: {read_interval: "=manual_read_interval_months", estimate_limit: "=estimated_read_limit_consecutive", customer_reads: "=customer_read_accepted"}
        AMI Three-Phase Commercial Meter: {read_interval: "=manual_read_interval_months", estimate_limit: "=estimated_read_limit_consecutive", customer_reads: "=customer_read_accepted"}
        AMI Interval Demand Meter: {read_interval: "=manual_read_interval_months", estimate_limit: "=estimated_read_limit_consecutive", customer_reads: "=customer_read_accepted"}
        Primary Metering Installation: {read_interval: "=manual_read_interval_months", estimate_limit: "=estimated_read_limit_consecutive", customer_reads: "=customer_read_accepted"}
    measures: [meter_msr_consecutive_estimates]

  - id: meter_opt_out_rule
    subject: [meter_installation_order, meter_opt_out_setup_fee, meter_opt_out_monthly_fee]
    rule: >-
      A customer holding a meter type whose opt_out_eligible is true may opt out to a Non-Communicating Opt-Out
      Meter, provided the service agreement is on Schedule RS or GS and has no net energy metering agreement in
      approved or operating status. Opting out is the customer's own election. The customer may not opt out
      again within opt_out_reelection_lockout_months after returning to a communicating meter. The opt-out
      setup fee is charged once on the date the opt-out meter is installed and the monthly fee for every
      billing period the opt-out meter is in service; the income-qualified fees replace the standard fees when
      the customer's income_qualified_until is on or after the fee date. Opt-out fees are charged only while
      the opt-out meter installation is in_service. Opting out ends eligibility for time-of-use schedules, net
      energy metering and remote reconnection. Returning to a communicating meter is free.
    eligibility:
      - id: opt_out_fees_while_in_service
        applies_to: [meter_opt_out_setup_fee, meter_opt_out_monthly_fee]
        kind: state
        condition: "Opt-out fees are charged only while the opt-out meter installation is in_service."
        evidence_fields: [meter_installations.status, meter_installations.meter_installation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meter_installations.meter_installation_id]
          action_bindings:
            meter_installations.meter_installation_id: meter_installation_id
        state_contract:
          field: meter_installations.status
          allowed: [in_service]
      - id: opt_out_is_customer_election
        applies_to: [meter_installation_order]
        kind: caller_fact
        condition: "Opting out is the customer's own election."
        evidence_fields: [meter_installations.installation_reason, meter_installations.service_account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [meter_installations.service_account_id]
          action_bindings:
            meter_installations.service_account_id: service_account_id
    params:
      per_tier:
        Non-Communicating Opt-Out Meter: {setup_fee: "=opt_out_setup_fee_usd", monthly_fee: "=opt_out_monthly_fee_usd", setup_fee_iq: "=opt_out_setup_fee_income_qualified_usd", monthly_fee_iq: "=opt_out_monthly_fee_income_qualified_usd", eligible: "=opt_out_eligible"}
        Standard AMI Smart Meter: {setup_fee: "=opt_out_setup_fee_usd", monthly_fee: "=opt_out_monthly_fee_usd", setup_fee_iq: "=opt_out_setup_fee_income_qualified_usd", monthly_fee_iq: "=opt_out_monthly_fee_income_qualified_usd", eligible: "=opt_out_eligible"}
        AMI Bidirectional Net Meter: {setup_fee: "=opt_out_setup_fee_usd", monthly_fee: "=opt_out_monthly_fee_usd", setup_fee_iq: "=opt_out_setup_fee_income_qualified_usd", monthly_fee_iq: "=opt_out_monthly_fee_income_qualified_usd", eligible: "=opt_out_eligible"}
        AMI Three-Phase Commercial Meter: {setup_fee: "=opt_out_setup_fee_usd", monthly_fee: "=opt_out_monthly_fee_usd", setup_fee_iq: "=opt_out_setup_fee_income_qualified_usd", monthly_fee_iq: "=opt_out_monthly_fee_income_qualified_usd", eligible: "=opt_out_eligible"}
        AMI Interval Demand Meter: {setup_fee: "=opt_out_setup_fee_usd", monthly_fee: "=opt_out_monthly_fee_usd", setup_fee_iq: "=opt_out_setup_fee_income_qualified_usd", monthly_fee_iq: "=opt_out_monthly_fee_income_qualified_usd", eligible: "=opt_out_eligible"}
        Primary Metering Installation: {setup_fee: "=opt_out_setup_fee_usd", monthly_fee: "=opt_out_monthly_fee_usd", setup_fee_iq: "=opt_out_setup_fee_income_qualified_usd", monthly_fee_iq: "=opt_out_monthly_fee_income_qualified_usd", eligible: "=opt_out_eligible"}

  - id: meter_installation_lifecycle
    subject: [meter_installation_completion, meter_removal, meter_order_cancellation, meter_installation_order]
    rule: >-
      A meter type may be ordered only for a service agreement whose rate schedule is among the type's
      supported_schedules and whose capabilities the agreement needs: a time-of-use schedule needs a tou_capable
      meter, a demand schedule needs a demand_register, a net energy metering agreement needs a bidirectional
      meter, and service at primary voltage needs the Primary Metering Installation. The installation date is
      no earlier than installation_lead_business_days business days after the order date. The installed meter
      becomes in_service on its installation date and the meter it replaces is removed the same day. An order
      may be withdrawn while it is scheduled; a removed or cancelled installation is never reused, and a later
      need is met by a new order.
    eligibility: []
    params:
      per_tier:
        Non-Communicating Opt-Out Meter: {lead_days: "=installation_lead_business_days", tou: "=tou_capable", bidirectional: "=bidirectional", demand: "=demand_register"}
        Standard AMI Smart Meter: {lead_days: "=installation_lead_business_days", tou: "=tou_capable", bidirectional: "=bidirectional", demand: "=demand_register"}
        AMI Bidirectional Net Meter: {lead_days: "=installation_lead_business_days", tou: "=tou_capable", bidirectional: "=bidirectional", demand: "=demand_register"}
        AMI Three-Phase Commercial Meter: {lead_days: "=installation_lead_business_days", tou: "=tou_capable", bidirectional: "=bidirectional", demand: "=demand_register"}
        AMI Interval Demand Meter: {lead_days: "=installation_lead_business_days", tou: "=tou_capable", bidirectional: "=bidirectional", demand: "=demand_register"}
        Primary Metering Installation: {lead_days: "=installation_lead_business_days", tou: "=tou_capable", bidirectional: "=bidirectional", demand: "=demand_register"}

  - id: meter_tampering_rule
    subject: [meter_tampering_finding, meter_tampering_charge]
    rule: >-
      Tampering and diversion are established only by a field investigation record, never by a report or a
      denial over the phone. When the finding is tampering_confirmed or diversion_confirmed, the type's
      tampering_charge_usd is charged once for that field order, and the unbilled_kwh is backbilled for up to
      unauthorized_use_backbill_months at the rates of the affected bills; the normal backbill limit does not
      apply. A confirmed finding on a residential agreement allows a Residential Unauthorized Use Deposit to be
      assessed under the deposit program. A finding of no_tampering or no_access carries no charge. Each field
      order is charged at most once, and disputes of a confirmed finding are handed to a human representative
      as not covered by policy.
    eligibility:
      - id: charge_each_finding_once
        applies_to: [meter_tampering_charge]
        kind: dedup
        condition: "Each field order is charged at most once, and disputes of a confirmed finding are handed to a human representative as not covered by policy."
        evidence_fields: [meter_charges.meter_field_order_id, meter_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meter_charges.meter_field_order_id]
          action_bindings:
            meter_charges.meter_field_order_id: meter_field_order_id
        dedup_contract:
          table: meter_charges
          mode: separate_record
          object_bindings: {meter_field_order_id: meter_field_order_id}
          duplicate_filters: {event_type: [meter_tampering_charge]}
          distinct_fields: []
    params:
      per_tier:
        Non-Communicating Opt-Out Meter: {charge: "=tampering_charge_usd", backbill_months: "=unauthorized_use_backbill_months"}
        Standard AMI Smart Meter: {charge: "=tampering_charge_usd", backbill_months: "=unauthorized_use_backbill_months"}
        AMI Bidirectional Net Meter: {charge: "=tampering_charge_usd", backbill_months: "=unauthorized_use_backbill_months"}
        AMI Three-Phase Commercial Meter: {charge: "=tampering_charge_usd", backbill_months: "=unauthorized_use_backbill_months"}
        AMI Interval Demand Meter: {charge: "=tampering_charge_usd", backbill_months: "=unauthorized_use_backbill_months"}
        Primary Metering Installation: {charge: "=tampering_charge_usd", backbill_months: "=unauthorized_use_backbill_months"}

extended_policies:
  - id: meter_ext_slow_meter_backbill
    base_policy_refs:
    - meter_accuracy_adjustment_rule
    overwrite:
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: The adjustment period ends on the test date and starts on meter_msr_error_start_date, which applies error_start_basis and caps the period at refund_max_months for a refund or backbill_max_months for a backbill.
      replaced_by: 'The slow-meter backbill period is made of whole regular bills of the service agreement: counting back from the company test date, it takes the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the slow-meter backbill reaches back and the slow-meter backbill limit.'
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: The corrected charges are the energy, demand and Power Supply Cost Recovery charges of the regular bills whose billing period ends inside the adjustment period (meter_msr_affected_charges).
      replaced_by: Under the standard method the charges the slow-meter backbill corrects are the energy charges and the Power Supply Cost Recovery charges of the bills of the period, and those bills are corrected to full registration, so that the slow-meter error factor is the absolute value of one minus 100 divided by the company test's registration_pct.
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: For a fast or slow meter the amount is those charges times the absolute value of one minus 100 divided by registration_pct, and adjusted_kwh is their kwh_total times the same factor, both rounded at the end.
      replaced_by: The slow-meter backbill is the corrected charges times the slow-meter error factor, rounded to the cent once at the end, and a slow-meter backbill smaller than the meter type's adjustment_threshold_usd is recorded as 0.00.
    trigger: state_due
    subject:
    - meter_accuracy_adjustment
    computes: backbill_amount
    target_tool: post_slow_meter_backbill_dc57beb1
    params:
      new_meter_months: 12
      new_meter_cap_months: 6
      overdue_cap_months: 3
    rule: 'A slow-meter backbill recovers the charges a meter under-registered, and it is calculated for the company''s own test result of the meter, which is the latest test result taken by the test method of the meter''s type, when that result classifies the meter slow. The slow-meter backbill is recorded on the meter''s adjustment record against that test result, as a backbill, on the date it is calculated. The slow-meter backbill period is made of whole regular bills of the service agreement: counting back from the company test date, it takes the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the slow-meter backbill reaches back and the slow-meter backbill limit. Under the standard method the billing months the slow-meter backbill reaches back are one half of the whole calendar months between the later of the meter''s installation date and the test date of its latest within-tolerance result, and the company test
      date, rounded down to a whole month, and the slow-meter backbill limit is the meter type''s backbill_max_months. Under the standard method the charges the slow-meter backbill corrects are the energy charges and the Power Supply Cost Recovery charges of the bills of the period, and those bills are corrected to full registration, so that the slow-meter error factor is the absolute value of one minus 100 divided by the company test''s registration_pct. The slow-meter backbill is the corrected charges times the slow-meter error factor, rounded to the cent once at the end, and a slow-meter backbill smaller than the meter type''s adjustment_threshold_usd is recorded as 0.00. The billing months the slow-meter backbill reaches back follow what the meter''s own records show about when the under-registration began. Where the meter was set by a failed-meter replacement or a test exchange and the meter has no within-tolerance test result on record, the error is dated from the installation and the
      billing months the slow-meter backbill reaches back are all the whole calendar months between the installation date and the company test date. Where the meter has a within-tolerance test result on record and the service agreement''s current rate schedule took effect after the test date of the latest such result, the meter was reprogrammed for that schedule and the billing months the slow-meter backbill reaches back are the whole calendar months between the schedule''s effective date and the company test date. In every other case the billing months the slow-meter backbill reaches back are one half of the whole calendar months, as the standard method counts them. Where the meter was installed fewer than the new-meter period of whole calendar months before the company test date, the slow-meter backbill limit is the new-meter backbill limit. Where the meter was installed the new-meter period or more before the company test date, the meter type has a periodic test interval, and the whole
      calendar months between the later of the installation date and the latest within-tolerance test date and the company test date exceed that interval, the company''s periodic test was overdue and the slow-meter backbill limit is the overdue-test backbill limit. In every other case the slow-meter backbill limit is the meter type''s backbill_max_months. Where the service agreement''s rate schedule carries a demand charge and at least one bill of the slow-meter backbill period was billed at the schedule''s minimum billing demand, the charges the slow-meter backbill corrects are the energy and Power Supply Cost Recovery charges of every bill of the period plus the demand charges of the bills billed above that minimum, because a billing demand held at the schedule minimum was not set by the meter. Where the rate schedule carries a demand charge and no bill of the slow-meter backbill period was billed at the minimum billing demand, the charges the slow-meter backbill corrects are the energy,
      Power Supply Cost Recovery and demand charges of every bill of the period. In every other case the charges the slow-meter backbill corrects are the energy and Power Supply Cost Recovery charges, as the standard method states. Where the meter carries a utility-initiated test request, a test the company ordered outside its periodic schedule, the slow-meter backbill corrects the bills only to the lower edge of the tolerance band, 100 minus the meter type''s accuracy_tolerance_pct, and the slow-meter error factor is the absolute value of one minus that edge divided by the company test''s registration_pct. Where the meter carries a periodic test request and no utility-initiated test request, the slow-meter backbill corrects the bills to 100 minus one half of the meter type''s accuracy_tolerance_pct. In every other case the slow-meter backbill corrects the bills to full registration, as the standard method states.'
    prerequisite: []
    cross_category:
    - category: service
      as: history
      reads:
      - service_accounts.rate_effective_date
      - service_bills.energy_charge_amount
      - service_bills.rider_charge_amount
      - service_bills.demand_charge_amount
      - service_bills.billing_demand_kw
      - service_bills.billing_period_end
      - minimum_billing_demand_kw
      - demand_charge_usd_kw
      note: The demand factor's tier is decided from the service agreement's bills billed at the schedule's minimum billing demand and the schedule's demand charge; the month-dating factor reads the schedule's effective date.
    compute:
    - sb_company_test_date: LATEST('meter_tests', 'test_date', date_field='test_date', event_type='meter_test_result', test_method=P('test_method'))
    - sb_company_registration: LATEST('meter_tests', 'registration_pct', date_field='test_date', event_type='meter_test_result', test_method=P('test_method'))
    - sb_last_within_tolerance: LATEST('meter_tests', 'test_date', date_field='test_date', event_type='meter_test_result', test_result='within_tolerance')
    - sb_set_by_exchange: F('installation_reason') == 'failed_meter_replacement' or F('installation_reason') == 'test_exchange'
    - sb_schedule_effective: CFIELD('service', 'rate_effective_date', service_account_id=F('service_account_id'))
    - sb_anchor: sb_last_within_tolerance if (sb_last_within_tolerance != None and sb_last_within_tolerance > F('installed_date')) else F('installed_date')
    - sb_months_reached: MONTHS(F('installed_date'), sb_company_test_date) if (sb_set_by_exchange and sb_last_within_tolerance == None) else (MONTHS(sb_schedule_effective, sb_company_test_date) if (sb_last_within_tolerance != None and sb_schedule_effective > sb_last_within_tolerance) else int(MONTHS(sb_anchor, sb_company_test_date) / 2))
    - sb_installed_months: MONTHS(F('installed_date'), sb_company_test_date)
    - sb_months_since_anchor: MONTHS(sb_anchor, sb_company_test_date)
    - sb_backbill_limit: K('new_meter_cap_months') if sb_installed_months < K('new_meter_months') else (K('overdue_cap_months') if (sb_installed_months >= K('new_meter_months') and P('periodic_test_interval_years') > 0 and sb_months_since_anchor > 12 * P('periodic_test_interval_years')) else P('backbill_max_months'))
    - sb_bill_count: MN(sb_backbill_limit, sb_months_reached)
    - sb_bills_offset: MONTHS(sb_company_test_date, NOW)
    - sb_window_end: sb_bills_offset + sb_bill_count
    - sb_energy: XSUM('service', 'service_bills', 'energy_charge_amount', within_months=sb_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'energy_charge_amount', within_months=sb_bills_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - sb_pscr: XSUM('service', 'service_bills', 'rider_charge_amount', within_months=sb_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'rider_charge_amount', within_months=sb_bills_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - sb_min_demand_kw: float(CPARAM('service', 'minimum_billing_demand_kw', service_account_id=F('service_account_id')))
    - sb_demand_rate: CPARAM('service', 'demand_charge_usd_kw', service_account_id=F('service_account_id'))
    - sb_demand_all: XSUM('service', 'service_bills', 'demand_charge_amount', within_months=sb_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'demand_charge_amount', within_months=sb_bills_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - sb_demand_at_min: XSUM('service', 'service_bills', 'demand_charge_amount', within_months=sb_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=sb_min_demand_kw) - XSUM('service', 'service_bills', 'demand_charge_amount', within_months=sb_bills_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=sb_min_demand_kw)
    - sb_bills_at_min: XCOUNT('service', 'service_bills', within_months=sb_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=sb_min_demand_kw) - XCOUNT('service', 'service_bills', within_months=sb_bills_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=sb_min_demand_kw)
    - sb_demand_corrected: (sb_demand_all - sb_demand_at_min) if (sb_demand_rate > 0 and sb_bills_at_min > 0) else (sb_demand_all if (sb_demand_rate > 0 and sb_bills_at_min == 0) else 0)
    - sb_utility_requests: COUNT('meter_tests', event_type='meter_test_request', test_reason='utility_initiated')
    - sb_periodic_requests: COUNT('meter_tests', event_type='meter_test_request', test_reason='periodic')
    - sb_target_registration: 100 - P('accuracy_tolerance_pct') if sb_utility_requests > 0 else (100 - P('accuracy_tolerance_pct') / 2 if (sb_periodic_requests > 0 and sb_utility_requests == 0) else 100)
    - sb_error_factor: ABS(1 - sb_target_registration / sb_company_registration)
    - sb_corrected_charges: sb_energy + sb_pscr + sb_demand_corrected
    - sb_backbill_raw: RND(sb_corrected_charges * sb_error_factor, 2)
    - result: 0.0 if sb_backbill_raw < P('adjustment_threshold_usd') else sb_backbill_raw
    compute_basis:
      sb_company_test_date: it is calculated for the company's own test result of the meter, which is the latest test result taken by the test method of the meter's type, when that result classifies the meter slow.
      sb_company_registration: the slow-meter error factor is the absolute value of one minus 100 divided by the company test's registration_pct.
      sb_last_within_tolerance: the later of the meter's installation date and the test date of its latest within-tolerance result
      sb_set_by_exchange: Where the meter was set by a failed-meter replacement or a test exchange and the meter has no within-tolerance test result on record
      sb_schedule_effective: the service agreement's current rate schedule took effect after the test date of the latest such result
      sb_anchor: the later of the meter's installation date and the test date of its latest within-tolerance result
      sb_months_reached: Where the meter was set by a failed-meter replacement or a test exchange and the meter has no within-tolerance test result on record, the error is dated from the installation and the billing months the slow-meter backbill reaches back are all the whole calendar months between the installation date and the company test date. Where the meter has a within-tolerance test result on record and the service agreement's current rate schedule took effect after the test date of the latest such result, the meter was reprogrammed for that schedule and the billing months the slow-meter backbill reaches back are the whole calendar months between the schedule's effective date and the company test date. In every other case the billing months the slow-meter backbill reaches back are one half of the whole calendar months, as the standard method counts them.
      sb_installed_months: Where the meter was installed fewer than the new-meter period of whole calendar months before the company test date
      sb_months_since_anchor: the whole calendar months between the later of the installation date and the latest within-tolerance test date and the company test date exceed that interval
      sb_backbill_limit: Where the meter was installed fewer than the new-meter period of whole calendar months before the company test date, the slow-meter backbill limit is the new-meter backbill limit. Where the meter was installed the new-meter period or more before the company test date, the meter type has a periodic test interval, and the whole calendar months between the later of the installation date and the latest within-tolerance test date and the company test date exceed that interval, the company's periodic test was overdue and the slow-meter backbill limit is the overdue-test backbill limit. In every other case the slow-meter backbill limit is the meter type's backbill_max_months.
      sb_bill_count: as many as the smaller of the billing months the slow-meter backbill reaches back and the slow-meter backbill limit.
      sb_bills_offset: counting back from the company test date, it takes the most recent regular bills whose billing period ended on or before that date
      sb_window_end: counting back from the company test date, it takes the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the slow-meter backbill reaches back and the slow-meter backbill limit.
      sb_energy: the charges the slow-meter backbill corrects are the energy charges and the Power Supply Cost Recovery charges of the bills of the period
      sb_pscr: the charges the slow-meter backbill corrects are the energy charges and the Power Supply Cost Recovery charges of the bills of the period
      sb_min_demand_kw: at least one bill of the slow-meter backbill period was billed at the schedule's minimum billing demand
      sb_demand_rate: Where the service agreement's rate schedule carries a demand charge
      sb_demand_all: the charges the slow-meter backbill corrects are the energy, Power Supply Cost Recovery and demand charges of every bill of the period.
      sb_demand_at_min: plus the demand charges of the bills billed above that minimum, because a billing demand held at the schedule minimum was not set by the meter.
      sb_bills_at_min: at least one bill of the slow-meter backbill period was billed at the schedule's minimum billing demand
      sb_demand_corrected: Where the service agreement's rate schedule carries a demand charge and at least one bill of the slow-meter backbill period was billed at the schedule's minimum billing demand, the charges the slow-meter backbill corrects are the energy and Power Supply Cost Recovery charges of every bill of the period plus the demand charges of the bills billed above that minimum, because a billing demand held at the schedule minimum was not set by the meter. Where the rate schedule carries a demand charge and no bill of the slow-meter backbill period was billed at the minimum billing demand, the charges the slow-meter backbill corrects are the energy, Power Supply Cost Recovery and demand charges of every bill of the period. In every other case the charges the slow-meter backbill corrects are the energy and Power Supply Cost Recovery charges, as the standard method states.
      sb_utility_requests: Where the meter carries a utility-initiated test request, a test the company ordered outside its periodic schedule
      sb_periodic_requests: Where the meter carries a periodic test request and no utility-initiated test request
      sb_target_registration: Where the meter carries a utility-initiated test request, a test the company ordered outside its periodic schedule, the slow-meter backbill corrects the bills only to the lower edge of the tolerance band, 100 minus the meter type's accuracy_tolerance_pct, and the slow-meter error factor is the absolute value of one minus that edge divided by the company test's registration_pct. Where the meter carries a periodic test request and no utility-initiated test request, the slow-meter backbill corrects the bills to 100 minus one half of the meter type's accuracy_tolerance_pct. In every other case the slow-meter backbill corrects the bills to full registration, as the standard method states.
      sb_error_factor: the slow-meter error factor is the absolute value of one minus that edge divided by the company test's registration_pct.
      sb_corrected_charges: The slow-meter backbill is the corrected charges times the slow-meter error factor
      sb_backbill_raw: The slow-meter backbill is the corrected charges times the slow-meter error factor, rounded to the cent once at the end
      result: a slow-meter backbill smaller than the meter type's adjustment_threshold_usd is recorded as 0.00.
    factors:
    - id: slow_backbill_months_reached
      effect: method
      decides: sb_months_reached
      bindings:
      - sb_last_within_tolerance
      - sb_set_by_exchange
      - sb_schedule_effective
      - sb_anchor
      - sb_months_reached
      ladder:
      - when: the meter was set by a failed-meter replacement or a test exchange AND it has no within-tolerance test result on record
        method: all the whole calendar months between the installation date and the company test date
      - when: the meter has a within-tolerance test result on record AND the agreement's current rate schedule took effect after the latest such result
        method: the whole calendar months between the schedule's effective date and the company test date
      - when: otherwise
        method: one half of the whole calendar months between the later of installation and the latest within-tolerance result and the company test date, rounded down
      baseline:
        sb_months_reached: int(MONTHS(sb_anchor, sb_company_test_date) / 2)
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: slow_backbill_limit
      effect: parameter
      decides: sb_backbill_limit
      bindings:
      - sb_installed_months
      - sb_months_since_anchor
      - sb_backbill_limit
      ladder:
      - when: the meter was installed fewer than the new-meter period of whole months before the company test date
        value: K('new_meter_cap_months')
      - when: the meter was installed the new-meter period or more before the company test AND the months since the later of installation and the latest within-tolerance test exceed the type's periodic test interval
        value: K('overdue_cap_months')
      - when: otherwise
        value: P('backbill_max_months')
      baseline:
        sb_backbill_limit: P('backbill_max_months')
      evidence:
      - date
      - history
      - tier_param
      cross_difficulty: null
    - id: slow_backbill_demand_basis
      effect: method
      decides: sb_demand_corrected
      bindings:
      - sb_min_demand_kw
      - sb_demand_rate
      - sb_demand_all
      - sb_demand_at_min
      - sb_bills_at_min
      - sb_demand_corrected
      ladder:
      - when: the agreement's schedule carries a demand charge AND at least one bill of the period was billed at the schedule's minimum billing demand
        method: demand charges of the bills billed above the minimum billing demand are corrected; demand charges of bills held at the minimum are not
      - when: the schedule carries a demand charge AND no bill of the period was billed at the minimum billing demand
        method: the demand charges of every bill of the period are corrected
      - when: otherwise
        method: no demand charge is corrected; energy and Power Supply Cost Recovery charges only
      baseline:
        sb_demand_corrected: '0'
      evidence:
      - cross_category
      - history
      - tier_param
      cross_difficulty: service
    - id: slow_backbill_target_registration
      effect: parameter
      decides: sb_target_registration
      bindings:
      - sb_utility_requests
      - sb_periodic_requests
      - sb_target_registration
      ladder:
      - when: the meter carries a utility-initiated test request
        value: 100 - P('accuracy_tolerance_pct')
      - when: the meter carries a periodic test request AND no utility-initiated test request
        value: 100 - P('accuracy_tolerance_pct') / 2
      - when: otherwise
        value: '100'
      baseline:
        sb_target_registration: '100'
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    baseline:
      rule: 'The slow-meter backbill period is made of whole regular bills of the service agreement: counting back from the company test date, it takes the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the slow-meter backbill reaches back and the slow-meter backbill limit. Under the standard method the billing months the slow-meter backbill reaches back are one half of the whole calendar months between the later of the meter''s installation date and the test date of its latest within-tolerance result, and the company test date, rounded down to a whole month, and the slow-meter backbill limit is the meter type''s backbill_max_months. Under the standard method the charges the slow-meter backbill corrects are the energy charges and the Power Supply Cost Recovery charges of the bills of the period, and those bills are corrected to full registration, so that the slow-meter error factor is the absolute value of one minus
        100 divided by the company test''s registration_pct. The slow-meter backbill is the corrected charges times the slow-meter error factor, rounded to the cent once at the end, and a slow-meter backbill smaller than the meter type''s adjustment_threshold_usd is recorded as 0.00.'
      params:
      - backbill_max_months
      - adjustment_threshold_usd
    inputs:
      history:
      - table: meter_tests
        aggregate: latest
        field: test_date
        filters:
          event_type: meter_test_result
      - table: meter_tests
        aggregate: count
        field: meter_test_id
        filters:
          event_type: meter_test_request
      - category: service
        table: service_bills
        aggregate: sum
        field: energy_charge_amount
        filters:
          bill_kind: regular
      - category: service
        table: service_bills
        aggregate: count
        field: bill_id
        filters:
          bill_kind: regular
      cross_category:
      - service
  - id: meter_ext_referee_backbill_settlement
    base_policy_refs:
    - meter_accuracy_adjustment_rule
    overwrite:
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: The adjustment period ends on the test date and starts on meter_msr_error_start_date, which applies error_start_basis and caps the period at refund_max_months for a refund or backbill_max_months for a backbill.
      replaced_by: 'Under the standard method the referee backbill settlement reprices whole regular bills of the service agreement: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the referee backbill settlement reaches back and the referee settlement limit.'
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: The corrected charges are the energy, demand and Power Supply Cost Recovery charges of the regular bills whose billing period ends inside the adjustment period (meter_msr_affected_charges).
      replaced_by: Under the standard method the charges the referee backbill settlement reprices are the energy and Power Supply Cost Recovery charges of those bills, corrected to full registration, so that the referee error factor is the absolute value of one minus 100 divided by the referee test's registration_pct.
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: For a fast or slow meter the amount is those charges times the absolute value of one minus 100 divided by registration_pct, and adjusted_kwh is their kwh_total times the same factor, both rounded at the end.
      replaced_by: The referee backbill settlement is the repriced charges times the referee error factor, rounded to the cent, minus every backbill already standing on the meter's adjustment record, never less than 0.00, and a settlement smaller than the meter type's adjustment_threshold_usd is recorded as 0.00.
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: The refund is credited, and the backbill billed, on the service agreement on the adjustment date.
      replaced_by: 'The settlement is the customer''s own acceptance of the referee result: it is recorded as a backbill on the meter''s adjustment record against the referee test result on the date the customer accepts it, and a customer who does not accept it has no settlement recorded.'
    trigger: on_request
    subject:
    - meter_accuracy_adjustment
    computes: settlement_amount
    target_tool: accept_referee_backbill_settlement_27524241
    params:
      settlement_new_meter_months: 12
      settlement_new_meter_cap_months: 6
      settlement_overdue_cap_months: 3
    rule: 'A referee backbill settlement closes a dispute in which the customer of record asked for a Commission referee test of a meter that the company''s own test, the latest result taken by the test method of the meter''s type, found slow, and the referee test, which is the meter''s latest test result, also found it slow. The settlement is the customer''s own acceptance of the referee result: it is recorded as a backbill on the meter''s adjustment record against the referee test result on the date the customer accepts it, and a customer who does not accept it has no settlement recorded. The referee backbill settlement is fixed only after the company test result it reviews carries its slow-meter backbill on the meter''s adjustment record. Under the standard method the referee backbill settlement reprices whole regular bills of the service agreement: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date, as many as the smaller
      of the billing months the referee backbill settlement reaches back and the referee settlement limit. Under the standard method the billing months the referee backbill settlement reaches back are one half of the whole calendar months between the later of the meter''s installation date and the test date of its latest within-tolerance result, and the company test date, rounded down to a whole month, and the referee settlement limit is the meter type''s backbill_max_months. Under the standard method the charges the referee backbill settlement reprices are the energy and Power Supply Cost Recovery charges of those bills, corrected to full registration, so that the referee error factor is the absolute value of one minus 100 divided by the referee test''s registration_pct. The referee backbill settlement is the repriced charges times the referee error factor, rounded to the cent, minus every backbill already standing on the meter''s adjustment record, never less than 0.00, and a settlement
      smaller than the meter type''s adjustment_threshold_usd is recorded as 0.00. The billing months the referee backbill settlement reaches back follow what the meter''s own records show about when the under-registration began. Where the meter was set by a failed-meter replacement or a test exchange and has no within-tolerance test result on record, the error is dated from the installation and the billing months the referee backbill settlement reaches back are all the whole calendar months between the installation date and the company test date. Where the meter has a within-tolerance test result on record and the service agreement''s current rate schedule took effect after the latest such result, the billing months the referee backbill settlement reaches back are the whole calendar months between the schedule''s effective date and the company test date. In every other case the billing months the referee backbill settlement reaches back are one half of the whole calendar months, as the standard
      method counts them. Where the meter was installed fewer than the settlement new-meter period of whole calendar months before the company test date, the referee settlement limit is the settlement new-meter limit. Where the meter was installed the settlement new-meter period or more before the company test date, the meter type has a periodic test interval, and the whole calendar months between the later of the installation date and the latest within-tolerance test date and the company test date exceed that interval, the referee settlement limit is the settlement overdue-test limit. In every other case the referee settlement limit is the meter type''s backbill_max_months. Where the service agreement''s rate schedule carries a demand charge and at least one bill the referee backbill settlement reprices was billed at the schedule''s minimum billing demand, the settlement reprices the energy and Power Supply Cost Recovery charges of every repriced bill plus the demand charges of the repriced
      bills billed above that minimum. Where the rate schedule carries a demand charge and no repriced bill was billed at the minimum billing demand, the settlement reprices the energy, Power Supply Cost Recovery and demand charges of every repriced bill. In every other case the settlement reprices the energy and Power Supply Cost Recovery charges, as the standard method states. Where the meter carries a utility-initiated test request, the referee backbill settlement corrects the repriced bills only to the lower edge of the tolerance band, 100 minus the meter type''s accuracy_tolerance_pct, and the referee error factor is the absolute value of one minus that edge divided by the referee test''s registration_pct. Where the meter carries a periodic test request and no utility-initiated test request, the referee backbill settlement corrects the repriced bills to 100 minus one half of the meter type''s accuracy_tolerance_pct. In every other case the referee backbill settlement corrects the repriced
      bills to full registration, as the standard method states. Where the meter was removed from service after the company test date, the referee backbill settlement also reprices the regular bills whose billing period ended after the company test date and on or before the removal date, added to the bills counted back from the company test date, because the meter kept registering slow until it was taken out. Where the meter is still in service, the referee backbill settlement also reprices every regular bill whose billing period ended after the company test date, added to the bills counted back from the company test date. In every other case the referee backbill settlement reprices no bill whose billing period ended after the company test date, as the standard method states.'
    prerequisite:
    - problem: meter_ext_slow_meter_backbill
      kind: value_input
      gate: rs_already_backbilled
      form: state
      policy_source: The referee backbill settlement is fixed only after the company test result it reviews carries its slow-meter backbill on the meter's adjustment record.
      condition: The meter's adjustment record carries a backbill recorded against the company's own slow test result that the referee result reviews.
      resolved_by: post_slow_meter_backbill_dc57beb1
      effect: rs_already_backbilled rises from 0.00 to the slow-meter backbill recorded for the company test result, and the settlement subtracts it, so the settlement falls by exactly that amount.
    cross_category:
    - category: service
      as: history
      reads:
      - service_accounts.rate_effective_date
      - service_bills.energy_charge_amount
      - service_bills.rider_charge_amount
      - service_bills.demand_charge_amount
      - service_bills.billing_demand_kw
      - service_bills.billing_period_end
      - minimum_billing_demand_kw
      - demand_charge_usd_kw
      note: The settlement demand factor's tier is decided from the agreement's bills billed at the schedule's minimum billing demand and the schedule's demand charge; the month-dating factor reads the schedule's effective date.
    compute:
    - rs_company_test_date: LATEST('meter_tests', 'test_date', date_field='test_date', event_type='meter_test_result', test_method=P('test_method'))
    - rs_referee_registration: LATEST('meter_tests', 'registration_pct', date_field='test_date', event_type='meter_test_result')
    - rs_last_within_tolerance: LATEST('meter_tests', 'test_date', date_field='test_date', event_type='meter_test_result', test_result='within_tolerance')
    - rs_set_by_exchange: F('installation_reason') == 'failed_meter_replacement' or F('installation_reason') == 'test_exchange'
    - rs_schedule_effective: CFIELD('service', 'rate_effective_date', service_account_id=F('service_account_id'))
    - rs_anchor: rs_last_within_tolerance if (rs_last_within_tolerance != None and rs_last_within_tolerance > F('installed_date')) else F('installed_date')
    - rs_months_reached: MONTHS(F('installed_date'), rs_company_test_date) if (rs_set_by_exchange and rs_last_within_tolerance == None) else (MONTHS(rs_schedule_effective, rs_company_test_date) if (rs_last_within_tolerance != None and rs_schedule_effective > rs_last_within_tolerance) else int(MONTHS(rs_anchor, rs_company_test_date) / 2))
    - rs_installed_months: MONTHS(F('installed_date'), rs_company_test_date)
    - rs_months_since_anchor: MONTHS(rs_anchor, rs_company_test_date)
    - rs_settlement_limit: K('settlement_new_meter_cap_months') if rs_installed_months < K('settlement_new_meter_months') else (K('settlement_overdue_cap_months') if (rs_installed_months >= K('settlement_new_meter_months') and P('periodic_test_interval_years') > 0 and rs_months_since_anchor > 12 * P('periodic_test_interval_years')) else P('backbill_max_months'))
    - rs_bill_count: MN(rs_settlement_limit, rs_months_reached)
    - rs_company_offset: MONTHS(rs_company_test_date, NOW)
    - rs_end_offset: MONTHS(F('removed_date'), NOW) if (F('status') == 'removed' and F('removed_date') > rs_company_test_date) else (0 if F('status') == 'in_service' else rs_company_offset)
    - rs_window_end: rs_company_offset + rs_bill_count
    - rs_energy: XSUM('service', 'service_bills', 'energy_charge_amount', within_months=rs_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'energy_charge_amount', within_months=rs_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - rs_pscr: XSUM('service', 'service_bills', 'rider_charge_amount', within_months=rs_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'rider_charge_amount', within_months=rs_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - rs_min_demand_kw: float(CPARAM('service', 'minimum_billing_demand_kw', service_account_id=F('service_account_id')))
    - rs_demand_rate: CPARAM('service', 'demand_charge_usd_kw', service_account_id=F('service_account_id'))
    - rs_demand_all: XSUM('service', 'service_bills', 'demand_charge_amount', within_months=rs_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'demand_charge_amount', within_months=rs_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - rs_demand_at_min: XSUM('service', 'service_bills', 'demand_charge_amount', within_months=rs_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=rs_min_demand_kw) - XSUM('service', 'service_bills', 'demand_charge_amount', within_months=rs_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=rs_min_demand_kw)
    - rs_bills_at_min: XCOUNT('service', 'service_bills', within_months=rs_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=rs_min_demand_kw) - XCOUNT('service', 'service_bills', within_months=rs_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=rs_min_demand_kw)
    - rs_demand_repriced: (rs_demand_all - rs_demand_at_min) if (rs_demand_rate > 0 and rs_bills_at_min > 0) else (rs_demand_all if (rs_demand_rate > 0 and rs_bills_at_min == 0) else 0)
    - rs_utility_requests: COUNT('meter_tests', event_type='meter_test_request', test_reason='utility_initiated')
    - rs_periodic_requests: COUNT('meter_tests', event_type='meter_test_request', test_reason='periodic')
    - rs_target_registration: 100 - P('accuracy_tolerance_pct') if rs_utility_requests > 0 else (100 - P('accuracy_tolerance_pct') / 2 if (rs_periodic_requests > 0 and rs_utility_requests == 0) else 100)
    - rs_error_factor: ABS(1 - rs_target_registration / rs_referee_registration)
    - rs_repriced: RND((rs_energy + rs_pscr + rs_demand_repriced) * rs_error_factor, 2)
    - rs_already_backbilled: SUM('meter_adjustments', 'amount', adjustment_direction='backbill')
    - rs_settlement_raw: RND(MX(0, rs_repriced - rs_already_backbilled), 2)
    - result: 0.0 if rs_settlement_raw < P('adjustment_threshold_usd') else rs_settlement_raw
    compute_basis:
      rs_company_test_date: the company's own test, the latest result taken by the test method of the meter's type, found slow
      rs_referee_registration: the referee test, which is the meter's latest test result, also found it slow.
      rs_last_within_tolerance: the later of the meter's installation date and the test date of its latest within-tolerance result
      rs_set_by_exchange: Where the meter was set by a failed-meter replacement or a test exchange and has no within-tolerance test result on record
      rs_schedule_effective: the service agreement's current rate schedule took effect after the latest such result
      rs_anchor: the later of the meter's installation date and the test date of its latest within-tolerance result
      rs_months_reached: Where the meter was set by a failed-meter replacement or a test exchange and has no within-tolerance test result on record, the error is dated from the installation and the billing months the referee backbill settlement reaches back are all the whole calendar months between the installation date and the company test date. Where the meter has a within-tolerance test result on record and the service agreement's current rate schedule took effect after the latest such result, the billing months the referee backbill settlement reaches back are the whole calendar months between the schedule's effective date and the company test date. In every other case the billing months the referee backbill settlement reaches back are one half of the whole calendar months, as the standard method counts them.
      rs_installed_months: Where the meter was installed fewer than the settlement new-meter period of whole calendar months before the company test date
      rs_months_since_anchor: the whole calendar months between the later of the installation date and the latest within-tolerance test date and the company test date exceed that interval
      rs_settlement_limit: Where the meter was installed fewer than the settlement new-meter period of whole calendar months before the company test date, the referee settlement limit is the settlement new-meter limit. Where the meter was installed the settlement new-meter period or more before the company test date, the meter type has a periodic test interval, and the whole calendar months between the later of the installation date and the latest within-tolerance test date and the company test date exceed that interval, the referee settlement limit is the settlement overdue-test limit. In every other case the referee settlement limit is the meter type's backbill_max_months.
      rs_bill_count: as many as the smaller of the billing months the referee backbill settlement reaches back and the referee settlement limit.
      rs_company_offset: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date
      rs_end_offset: Where the meter was removed from service after the company test date, the referee backbill settlement also reprices the regular bills whose billing period ended after the company test date and on or before the removal date, added to the bills counted back from the company test date, because the meter kept registering slow until it was taken out. Where the meter is still in service, the referee backbill settlement also reprices every regular bill whose billing period ended after the company test date, added to the bills counted back from the company test date. In every other case the referee backbill settlement reprices no bill whose billing period ended after the company test date, as the standard method states.
      rs_window_end: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the referee backbill settlement reaches back and the referee settlement limit.
      rs_energy: the charges the referee backbill settlement reprices are the energy and Power Supply Cost Recovery charges of those bills
      rs_pscr: the charges the referee backbill settlement reprices are the energy and Power Supply Cost Recovery charges of those bills
      rs_min_demand_kw: at least one bill the referee backbill settlement reprices was billed at the schedule's minimum billing demand
      rs_demand_rate: Where the service agreement's rate schedule carries a demand charge
      rs_demand_all: the settlement reprices the energy, Power Supply Cost Recovery and demand charges of every repriced bill.
      rs_demand_at_min: plus the demand charges of the repriced bills billed above that minimum.
      rs_bills_at_min: at least one bill the referee backbill settlement reprices was billed at the schedule's minimum billing demand
      rs_demand_repriced: Where the service agreement's rate schedule carries a demand charge and at least one bill the referee backbill settlement reprices was billed at the schedule's minimum billing demand, the settlement reprices the energy and Power Supply Cost Recovery charges of every repriced bill plus the demand charges of the repriced bills billed above that minimum. Where the rate schedule carries a demand charge and no repriced bill was billed at the minimum billing demand, the settlement reprices the energy, Power Supply Cost Recovery and demand charges of every repriced bill. In every other case the settlement reprices the energy and Power Supply Cost Recovery charges, as the standard method states.
      rs_utility_requests: Where the meter carries a utility-initiated test request
      rs_periodic_requests: Where the meter carries a periodic test request and no utility-initiated test request
      rs_target_registration: Where the meter carries a utility-initiated test request, the referee backbill settlement corrects the repriced bills only to the lower edge of the tolerance band, 100 minus the meter type's accuracy_tolerance_pct, and the referee error factor is the absolute value of one minus that edge divided by the referee test's registration_pct. Where the meter carries a periodic test request and no utility-initiated test request, the referee backbill settlement corrects the repriced bills to 100 minus one half of the meter type's accuracy_tolerance_pct. In every other case the referee backbill settlement corrects the repriced bills to full registration, as the standard method states.
      rs_error_factor: the referee error factor is the absolute value of one minus that edge divided by the referee test's registration_pct.
      rs_repriced: The referee backbill settlement is the repriced charges times the referee error factor, rounded to the cent
      rs_already_backbilled: minus every backbill already standing on the meter's adjustment record
      rs_settlement_raw: minus every backbill already standing on the meter's adjustment record, never less than 0.00
      result: a settlement smaller than the meter type's adjustment_threshold_usd is recorded as 0.00.
    factors:
    - id: settlement_months_reached
      effect: method
      decides: rs_months_reached
      bindings:
      - rs_last_within_tolerance
      - rs_set_by_exchange
      - rs_schedule_effective
      - rs_anchor
      - rs_months_reached
      ladder:
      - when: the meter was set by a failed-meter replacement or a test exchange AND it has no within-tolerance test result on record
        method: all the whole calendar months between the installation date and the company test date
      - when: the meter has a within-tolerance test result on record AND the agreement's current rate schedule took effect after the latest such result
        method: the whole calendar months between the schedule's effective date and the company test date
      - when: otherwise
        method: one half of the whole calendar months between the later of installation and the latest within-tolerance result and the company test date, rounded down
      baseline:
        rs_months_reached: int(MONTHS(rs_anchor, rs_company_test_date) / 2)
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: settlement_limit
      effect: parameter
      decides: rs_settlement_limit
      bindings:
      - rs_installed_months
      - rs_months_since_anchor
      - rs_settlement_limit
      ladder:
      - when: the meter was installed fewer than the settlement new-meter period of whole months before the company test date
        value: K('settlement_new_meter_cap_months')
      - when: the meter was installed the settlement new-meter period or more before the company test AND the months since the later of installation and the latest within-tolerance test exceed the type's periodic test interval
        value: K('settlement_overdue_cap_months')
      - when: otherwise
        value: P('backbill_max_months')
      baseline:
        rs_settlement_limit: P('backbill_max_months')
      evidence:
      - date
      - history
      - tier_param
      cross_difficulty: null
    - id: settlement_demand_basis
      effect: method
      decides: rs_demand_repriced
      bindings:
      - rs_min_demand_kw
      - rs_demand_rate
      - rs_demand_all
      - rs_demand_at_min
      - rs_bills_at_min
      - rs_demand_repriced
      ladder:
      - when: the agreement's schedule carries a demand charge AND at least one repriced bill was billed at the schedule's minimum billing demand
        method: demand charges of the repriced bills billed above the minimum are repriced; those held at the minimum are not
      - when: the schedule carries a demand charge AND no repriced bill was billed at the minimum billing demand
        method: the demand charges of every repriced bill are repriced
      - when: otherwise
        method: no demand charge is repriced; energy and Power Supply Cost Recovery charges only
      baseline:
        rs_demand_repriced: '0'
      evidence:
      - cross_category
      - history
      - tier_param
      cross_difficulty: service
    - id: settlement_target_registration
      effect: parameter
      decides: rs_target_registration
      bindings:
      - rs_utility_requests
      - rs_periodic_requests
      - rs_target_registration
      ladder:
      - when: the meter carries a utility-initiated test request
        value: 100 - P('accuracy_tolerance_pct')
      - when: the meter carries a periodic test request AND no utility-initiated test request
        value: 100 - P('accuracy_tolerance_pct') / 2
      - when: otherwise
        value: '100'
      baseline:
        rs_target_registration: '100'
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    - id: settlement_last_bill
      effect: method
      decides: rs_end_offset
      bindings:
      - rs_end_offset
      ladder:
      - when: the meter was removed from service after the company test date
        method: the bills whose period ended after the company test date and on or before the removal date are added
      - when: the meter is still in service
        method: every bill whose period ended after the company test date is added
      - when: otherwise
        method: no bill ending after the company test date is repriced
      baseline:
        rs_end_offset: rs_company_offset
      evidence:
      - date
      - history
      cross_difficulty: null
    baseline:
      rule: 'Under the standard method the referee backbill settlement reprices whole regular bills of the service agreement: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the referee backbill settlement reaches back and the referee settlement limit. Under the standard method the billing months the referee backbill settlement reaches back are one half of the whole calendar months between the later of the meter''s installation date and the test date of its latest within-tolerance result, and the company test date, rounded down to a whole month, and the referee settlement limit is the meter type''s backbill_max_months. Under the standard method the charges the referee backbill settlement reprices are the energy and Power Supply Cost Recovery charges of those bills, corrected to full registration, so that the referee error factor is the absolute value of one minus 100 divided
        by the referee test''s registration_pct. The referee backbill settlement is the repriced charges times the referee error factor, rounded to the cent, minus every backbill already standing on the meter''s adjustment record, never less than 0.00, and a settlement smaller than the meter type''s adjustment_threshold_usd is recorded as 0.00.'
      params:
      - backbill_max_months
      - adjustment_threshold_usd
    inputs:
      history:
      - table: meter_tests
        aggregate: latest
        field: registration_pct
        filters:
          event_type: meter_test_result
      - table: meter_adjustments
        aggregate: sum
        field: amount
        filters:
          adjustment_direction: backbill
      - category: service
        table: service_bills
        aggregate: sum
        field: energy_charge_amount
        filters:
          bill_kind: regular
      - category: service
        table: service_bills
        aggregate: count
        field: bill_id
        filters:
          bill_kind: regular
      cross_category:
      - service
  - id: meter_ext_repeat_test_fee
    base_policy_refs:
    - meter_agg_agreement_test_allowance
    - meter_test_fee_rule
    overwrite:
    - base_policy: meter_test_fee_rule
      superseded_clause: The fee is the repeat_test_fee_usd of the meter type tested and is posted on the test date.
      replaced_by: Under the standard method the repeat test fee is the meter type's repeat_test_fee_usd with no escalation, no witness surcharge and no band credit, and it is posted on the test date of the result it is charged for.
    trigger: state_due
    subject:
    - meter_test_fee
    computes: fee_amount
    target_tool: charge_repeat_test_fee_cae4c873
    params:
      instrument_transformer_check_usd: 125.0
      demand_register_check_usd: 40.0
      second_repeat_multiplier: 1.5
      third_repeat_multiplier: 2.0
      field_witness_surcharge_usd: 60.0
      shop_witness_surcharge_usd: 25.0
      outer_quarter_share: 0.75
      outer_half_share: 0.5
      outer_quarter_credit_usd: 100.0
      outer_half_credit_usd: 50.0
    rule: The repeat test fee is owed for a chargeable test, which is a customer-requested test whose result is within_tolerance when the free-test allowance counted under the agreement-wide allowance rule is already used, and it is charged once for that result; this policy fixes its amount, and the fee it fixes is charged for the meter's latest within-tolerance result answering the meter's latest customer-requested test. Under the standard method the repeat test fee is the meter type's repeat_test_fee_usd with no escalation, no witness surcharge and no band credit, and it is posted on the test date of the result it is charged for. The repeat test fee is the base test fee multiplied by the repeat escalation multiplier, plus the witness surcharge, minus the band credit, rounded to the cent once at the end and never less than 0.00. The base test fee follows how the premises is served. Where the service agreement takes service at primary voltage, the instrument transformers are checked with the
      meter and the base test fee is the meter type's repeat_test_fee_usd plus the instrument-transformer check charge. Where the agreement takes service at secondary voltage on a rate schedule that carries a demand charge, the demand register is checked with the meter and the base test fee is the repeat_test_fee_usd plus the demand-register check charge. In every other case the base test fee is the meter type's repeat_test_fee_usd. The repeat escalation multiplier rests on the earlier customer-requested tests of the same meter counted before the charged test's request. Under the standard method the earlier customer-requested tests counted are those requested within the meter type's free_test_period_months of whole calendar months before the charged test's request. How they are counted follows the meter's own test record, because on demand schedules a periodic company test of the installation is the accuracy check of record. Where the rate schedule carries a demand charge and the meter carries
      a periodic test request, that periodic test starts the count afresh, and the earlier customer-requested tests counted are those requested after the meter's latest periodic test request, whenever they fall. Where the rate schedule carries a demand charge and the meter carries no periodic test request, every earlier customer-requested test of the meter since its installation is counted. In every other case the earlier customer-requested tests are counted as the standard method counts them. Where three or more earlier customer-requested tests are counted, the repeat escalation multiplier is the third-repeat multiplier. Where exactly two are counted, the repeat escalation multiplier is the second-repeat multiplier. In every other case the repeat escalation multiplier is 1. Where the customer asked to witness the charged test and the test was performed in the field, the witness surcharge is the field witness surcharge. Where the customer asked to witness it and it was performed in the meter
      shop, the witness surcharge is the shop witness surcharge. In every other case there is no witness surcharge. The band position of the charged result is the absolute difference between its registration_pct and 100, divided by the meter type's accuracy_tolerance_pct. Where the band position is at least the outer-quarter share, the result sat in the outer quarter of the tolerance band and the band credit is the outer-quarter credit. Where the band position is at least the outer-half share and below the outer-quarter share, the band credit is the outer-half credit. In every other case there is no band credit.
    prerequisite: []
    cross_category:
    - category: service
      as: branch
      reads:
      - service_voltage
      - demand_charge_usd_kw
      note: The base test fee factor's tier is decided from the service agreement's service voltage and the schedule's demand charge.
    compute:
    - tf_charged_request_date: LATEST('meter_tests', 'request_date', date_field='request_date', event_type='meter_test_request', test_reason='customer_request')
    - tf_charged_method: LATEST('meter_tests', 'test_method', date_field='test_date', event_type='meter_test_result', test_result='within_tolerance')
    - tf_charged_registration: LATEST('meter_tests', 'registration_pct', date_field='test_date', event_type='meter_test_result', test_result='within_tolerance')
    - tf_voltage: CFIELD('service', 'service_voltage', service_account_id=F('service_account_id'))
    - tf_demand_rate: CPARAM('service', 'demand_charge_usd_kw', service_account_id=F('service_account_id'))
    - tf_base_fee: P('repeat_test_fee_usd') + K('instrument_transformer_check_usd') if tf_voltage == 'primary' else (P('repeat_test_fee_usd') + K('demand_register_check_usd') if (tf_voltage == 'secondary' and tf_demand_rate > 0) else P('repeat_test_fee_usd'))
    - tf_request_offset: MONTHS(tf_charged_request_date, NOW)
    - tf_latest_periodic: LATEST('meter_tests', 'request_date', date_field='request_date', event_type='meter_test_request', test_reason='periodic')
    - tf_earlier_tests: COUNT('meter_tests', within_months=MONTHS(tf_latest_periodic, NOW), date_field='request_date', event_type='meter_test_request', test_reason='customer_request') - 1 if (tf_demand_rate > 0 and tf_latest_periodic != None) else (COUNT('meter_tests', event_type='meter_test_request', test_reason='customer_request') - 1 if (tf_demand_rate > 0 and tf_latest_periodic == None) else COUNT('meter_tests', within_months=P('free_test_period_months') + tf_request_offset, date_field='request_date', event_type='meter_test_request', test_reason='customer_request') - 1)
    - tf_multiplier: K('third_repeat_multiplier') if tf_earlier_tests >= 3 else (K('second_repeat_multiplier') if tf_earlier_tests == 2 else 1)
    - tf_witness: LATEST('meter_tests', 'witness_requested', date_field='request_date', event_type='meter_test_request', test_reason='customer_request')
    - tf_witness_surcharge: K('field_witness_surcharge_usd') if (tf_witness == True and tf_charged_method == 'field') else (K('shop_witness_surcharge_usd') if (tf_witness == True and tf_charged_method == 'shop') else 0)
    - tf_band_position: ABS(tf_charged_registration - 100) / P('accuracy_tolerance_pct')
    - tf_band_credit: K('outer_quarter_credit_usd') if tf_band_position >= K('outer_quarter_share') else (K('outer_half_credit_usd') if (tf_band_position >= K('outer_half_share') and tf_band_position < K('outer_quarter_share')) else 0)
    - result: MX(0, RND(tf_base_fee * tf_multiplier + tf_witness_surcharge - tf_band_credit, 2))
    compute_basis:
      tf_charged_request_date: the fee it fixes is charged for the meter's latest within-tolerance result answering the meter's latest customer-requested test.
      tf_charged_method: the fee it fixes is charged for the meter's latest within-tolerance result answering the meter's latest customer-requested test.
      tf_charged_registration: The band position of the charged result is the absolute difference between its registration_pct and 100, divided by the meter type's accuracy_tolerance_pct.
      tf_voltage: Where the service agreement takes service at primary voltage
      tf_demand_rate: Where the agreement takes service at secondary voltage on a rate schedule that carries a demand charge
      tf_base_fee: Where the service agreement takes service at primary voltage, the instrument transformers are checked with the meter and the base test fee is the meter type's repeat_test_fee_usd plus the instrument-transformer check charge. Where the agreement takes service at secondary voltage on a rate schedule that carries a demand charge, the demand register is checked with the meter and the base test fee is the repeat_test_fee_usd plus the demand-register check charge. In every other case the base test fee is the meter type's repeat_test_fee_usd.
      tf_request_offset: Under the standard method the earlier customer-requested tests counted are those requested within the meter type's free_test_period_months of whole calendar months before the charged test's request.
      tf_earlier_tests: Where the rate schedule carries a demand charge and the meter carries a periodic test request, that periodic test starts the count afresh, and the earlier customer-requested tests counted are those requested after the meter's latest periodic test request, whenever they fall. Where the rate schedule carries a demand charge and the meter carries no periodic test request, every earlier customer-requested test of the meter since its installation is counted. In every other case the earlier customer-requested tests are counted as the standard method counts them.
      tf_multiplier: Where three or more earlier customer-requested tests are counted, the repeat escalation multiplier is the third-repeat multiplier. Where exactly two are counted, the repeat escalation multiplier is the second-repeat multiplier. In every other case the repeat escalation multiplier is 1.
      tf_witness: Where the customer asked to witness the charged test
      tf_witness_surcharge: Where the customer asked to witness the charged test and the test was performed in the field, the witness surcharge is the field witness surcharge. Where the customer asked to witness it and it was performed in the meter shop, the witness surcharge is the shop witness surcharge. In every other case there is no witness surcharge.
      tf_band_position: The band position of the charged result is the absolute difference between its registration_pct and 100, divided by the meter type's accuracy_tolerance_pct.
      tf_band_credit: Where the band position is at least the outer-quarter share, the result sat in the outer quarter of the tolerance band and the band credit is the outer-quarter credit. Where the band position is at least the outer-half share and below the outer-quarter share, the band credit is the outer-half credit. In every other case there is no band credit.
      result: The repeat test fee is the base test fee multiplied by the repeat escalation multiplier, plus the witness surcharge, minus the band credit, rounded to the cent once at the end and never less than 0.00.
      tf_latest_periodic: Where the rate schedule carries a demand charge and the meter carries a periodic test request
    factors:
    - id: repeat_fee_base_fee
      effect: parameter
      decides: tf_base_fee
      bindings:
      - tf_voltage
      - tf_demand_rate
      - tf_base_fee
      ladder:
      - when: the agreement takes service at primary voltage
        value: P('repeat_test_fee_usd') + K('instrument_transformer_check_usd')
      - when: the agreement takes service at secondary voltage AND its schedule carries a demand charge
        value: P('repeat_test_fee_usd') + K('demand_register_check_usd')
      - when: otherwise
        value: P('repeat_test_fee_usd')
      baseline:
        tf_base_fee: P('repeat_test_fee_usd')
      evidence:
      - cross_category
      - tier_param
      cross_difficulty: service
    - id: repeat_fee_count_basis
      effect: method
      decides: tf_earlier_tests
      bindings:
      - tf_latest_periodic
      - tf_earlier_tests
      ladder:
      - when: the agreement's schedule carries a demand charge AND the meter carries a periodic test request
        method: count the customer-requested tests requested after the meter's latest periodic test request (the periodic test resets the count)
      - when: the schedule carries a demand charge AND the meter carries no periodic test request
        method: count every earlier customer-requested test of the meter since its installation
      - when: otherwise
        method: count the customer-requested tests within free_test_period_months before the charged request (rolling window)
      baseline:
        tf_earlier_tests: COUNT('meter_tests', within_months=P('free_test_period_months') + tf_request_offset, date_field='request_date', event_type='meter_test_request', test_reason='customer_request') - 1
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: repeat_fee_escalation
      effect: parameter
      decides: tf_multiplier
      bindings:
      - tf_charged_request_date
      - tf_request_offset
      - tf_multiplier
      ladder:
      - when: three or more earlier customer-requested tests of the meter are counted
        value: K('third_repeat_multiplier')
      - when: exactly two earlier customer-requested tests are counted
        value: K('second_repeat_multiplier')
      - when: otherwise
        value: '1'
      baseline:
        tf_multiplier: '1'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: repeat_fee_witness_surcharge
      effect: parameter
      decides: tf_witness_surcharge
      bindings:
      - tf_witness
      - tf_witness_surcharge
      ladder:
      - when: the customer asked to witness the charged test AND it was performed in the field
        value: K('field_witness_surcharge_usd')
      - when: the customer asked to witness the charged test AND it was performed in the meter shop
        value: K('shop_witness_surcharge_usd')
      - when: otherwise
        value: '0'
      baseline:
        tf_witness_surcharge: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: repeat_fee_band_credit
      effect: parameter
      decides: tf_band_credit
      bindings:
      - tf_charged_registration
      - tf_band_position
      - tf_band_credit
      ladder:
      - when: the charged result's band position is at least the outer-quarter share
        value: K('outer_quarter_credit_usd')
      - when: the band position is at least the outer-half share and below the outer-quarter share
        value: K('outer_half_credit_usd')
      - when: otherwise
        value: '0'
      baseline:
        tf_band_credit: '0'
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    baseline:
      rule: Under the standard method the repeat test fee is the meter type's repeat_test_fee_usd with no escalation, no witness surcharge and no band credit, and it is posted on the test date of the result it is charged for. Under the standard method the earlier customer-requested tests counted are those requested within the meter type's free_test_period_months of whole calendar months before the charged test's request.
      params:
      - repeat_test_fee_usd
    inputs:
      history:
      - table: meter_tests
        aggregate: count
        field: meter_test_id
        filters:
          event_type: meter_test_request
          test_reason: customer_request
      - table: meter_tests
        aggregate: latest
        field: registration_pct
        filters:
          event_type: meter_test_result
          test_result: within_tolerance
      - table: meter_tests
        aggregate: latest
        field: request_date
        filters:
          event_type: meter_test_request
          test_reason: periodic
      cross_category:
      - service
  - id: meter_ext_fast_meter_refund
    base_policy_refs:
    - meter_accuracy_adjustment_rule
    overwrite:
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: The adjustment period ends on the test date and starts on meter_msr_error_start_date, which applies error_start_basis and caps the period at refund_max_months for a refund or backbill_max_months for a backbill.
      replaced_by: 'Under the standard method the fast-meter refund covers whole regular bills of the service agreement: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the fast-meter refund reaches back and the fast-meter refund limit, and no bill whose billing period ended after the company test date.'
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: The corrected charges are the energy, demand and Power Supply Cost Recovery charges of the regular bills whose billing period ends inside the adjustment period (meter_msr_affected_charges).
      replaced_by: Under the standard method the charges the fast-meter refund corrects are the energy and Power Supply Cost Recovery charges of those bills, and the fast-meter error factor is the absolute value of one minus 100 divided by the company test's registration_pct; no late payment charge is corrected and no interest is added.
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: For a fast or slow meter the amount is those charges times the absolute value of one minus 100 divided by registration_pct, and adjusted_kwh is their kwh_total times the same factor, both rounded at the end.
      replaced_by: The fast-meter refund is the corrected charges times the fast-meter error factor, rounded to the cent, plus the corrected late payment charges, plus the refund interest, plus every repeat test fee standing on the meter's metering charges, which the refund returns because the meter was in fact inaccurate, and a fast-meter refund smaller than the meter type's adjustment_threshold_usd is recorded as 0.00.
    trigger: state_due
    subject:
    - meter_accuracy_adjustment
    computes: refund_amount
    target_tool: post_fast_meter_refund_06e0a347
    params:
      large_power_refund_months: 3
      medium_demand_refund_months: 6
      refund_interest_rate: 0.0417
      interest_full_bills: 12
      interest_half_bills: 3
      drift_share: 0.75
    rule: 'A fast-meter refund returns what a meter over-registered, and it is calculated for the company''s own test result of the meter, which is the latest test result taken by the test method of the meter''s type, when that result classifies the meter fast; it is recorded on the meter''s adjustment record against that result, as a refund, on the date it is calculated. The fast-meter refund is fixed only after every repeat test fee owed for the meter''s earlier within-tolerance customer tests stands on the meter''s metering charges. Under the standard method the fast-meter refund covers whole regular bills of the service agreement: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the fast-meter refund reaches back and the fast-meter refund limit, and no bill whose billing period ended after the company test date. Under the standard method the billing months the fast-meter
      refund reaches back are one half of the whole calendar months between the later of the meter''s installation date and the test date of its latest within-tolerance result, and the company test date, rounded down to a whole month, and the fast-meter refund limit is the meter type''s refund_max_months. Under the standard method the charges the fast-meter refund corrects are the energy and Power Supply Cost Recovery charges of those bills, and the fast-meter error factor is the absolute value of one minus 100 divided by the company test''s registration_pct; no late payment charge is corrected and no interest is added. The fast-meter refund is the corrected charges times the fast-meter error factor, rounded to the cent, plus the corrected late payment charges, plus the refund interest, plus every repeat test fee standing on the meter''s metering charges, which the refund returns because the meter was in fact inaccurate, and a fast-meter refund smaller than the meter type''s adjustment_threshold_usd
      is recorded as 0.00. The billing months the fast-meter refund reaches back follow what the meter''s records show about when the over-registration began, and they never reach back past the meter''s latest within-tolerance result, which is the company''s evidence that the meter registered within tolerance on that date. Where the meter''s latest within-tolerance result already lay in the outer drift share of the tolerance band, on the same side of 100 as the company test''s registration_pct, the meter was drifting toward the limit at that test, so the error is dated from that test itself rather than from the midpoint, and the billing months the fast-meter refund reaches back are all the whole calendar months between the test date of that within-tolerance result and the company test date. Where the latest within-tolerance result shows no such drift and the service agreement''s current rate schedule took effect after its test date, the billing months the fast-meter refund reaches back are
      the whole calendar months between the schedule''s effective date and the company test date. In every other case the billing months the fast-meter refund reaches back are one half of the whole calendar months, as the standard method counts them. Where the agreement is on Schedule LP, the fast-meter refund limit is the large-power refund limit. Where the agreement is on Schedule GD, the fast-meter refund limit is the medium-demand refund limit. In every other case the fast-meter refund limit is the meter type''s refund_max_months. Where the service agreement''s rate schedule carries a demand charge and at least one bill the fast-meter refund covers was billed at the schedule''s minimum billing demand, the charges the fast-meter refund corrects are the energy and Power Supply Cost Recovery charges of every covered bill plus the demand charges of the covered bills billed above that minimum. Where the rate schedule carries a demand charge and no covered bill was billed at the minimum billing
      demand, the charges the fast-meter refund corrects are the energy, Power Supply Cost Recovery and demand charges of every covered bill. In every other case the fast-meter refund corrects the energy and Power Supply Cost Recovery charges, as the standard method states. Late payment charges posted on the service agreement within the whole calendar months the fast-meter refund covers, counted from the handling date as the covered bills are, were computed on overstated bills. Where the agreement is on a general service schedule (GS, GST, GD or LP) and such late payment charges exist, the corrected late payment charges are those charges times the fast-meter error factor, rounded to the cent. Where the agreement is on a residential schedule (RS, RT or REV) and such late payment charges exist, the corrected late payment charges are all of those charges. In every other case no late payment charge is corrected. Where the fast-meter refund counts back at least the full-interest number of bills,
      the refund interest rate is the refund interest rate. Where it covers at least the half-interest number of bills but fewer than the full-interest number, the refund interest rate is one half of the refund interest rate. In every other case there is no refund interest. The refund interest is the corrected charges times the fast-meter error factor, rounded to the cent, times the refund interest rate, times the number of bills counted back from the company test date divided by 24, which is simple interest for half the counted-back period in years, rounded to the cent. Where the meter was removed from service after the company test date, the fast-meter refund also covers the regular bills whose billing period ended after the company test date and on or before the removal date, added to the bills counted back from the company test date, because the meter kept registering fast until it was taken out. Where the meter is still in service, the fast-meter refund also covers every regular bill
      whose billing period ended after the company test date, added to the bills counted back. In every other case the fast-meter refund covers no bill whose billing period ended after the company test date, as the standard method states.'
    prerequisite:
    - problem: meter_ext_repeat_test_fee
      kind: value_input
      gate: fr_fees_returned
      form: state
      policy_source: The fast-meter refund is fixed only after every repeat test fee owed for the meter's earlier within-tolerance customer tests stands on the meter's metering charges.
      condition: Every chargeable within-tolerance customer-requested test of the meter carries its repeat test fee on the meter's metering charges.
      resolved_by: charge_repeat_test_fee_cae4c873
      effect: fr_fees_returned rises by the repeat test fee newly charged for the meter's latest within-tolerance customer test, and the refund returns it with the other repeat fees standing on the meter.
    cross_category:
    - category: service
      as: history
      reads:
      - variant_name
      - rate_effective_date
      - service_bills.energy_charge_amount
      - service_bills.rider_charge_amount
      - service_bills.demand_charge_amount
      - service_bills.billing_demand_kw
      - service_charges.amount
      - minimum_billing_demand_kw
      - demand_charge_usd_kw
      note: The refund limit and late-charge factors' tiers are decided from the agreement's schedule and the late payment charges posted on it; the demand factor from the bills billed at the schedule minimum.
    compute:
    - fr_company_test_date: LATEST('meter_tests', 'test_date', date_field='test_date', event_type='meter_test_result', test_method=P('test_method'))
    - fr_company_registration: LATEST('meter_tests', 'registration_pct', date_field='test_date', event_type='meter_test_result', test_method=P('test_method'))
    - fr_company_offset: MONTHS(fr_company_test_date, NOW)
    - fr_last_within_tolerance: LATEST('meter_tests', 'test_date', date_field='test_date', event_type='meter_test_result', test_result='within_tolerance')
    - fr_last_registration: LATEST('meter_tests', 'registration_pct', date_field='test_date', event_type='meter_test_result', test_result='within_tolerance')
    - fr_drift: fr_last_registration != None and ABS(fr_last_registration - 100) >= K('drift_share') * P('accuracy_tolerance_pct') and (fr_last_registration - 100) * (fr_company_registration - 100) > 0
    - fr_schedule_effective: CFIELD('service', 'rate_effective_date', service_account_id=F('service_account_id'))
    - fr_anchor: fr_last_within_tolerance if (fr_last_within_tolerance != None and fr_last_within_tolerance > F('installed_date')) else F('installed_date')
    - fr_months_reached: MONTHS(fr_last_within_tolerance, fr_company_test_date) if fr_drift == True else (MONTHS(fr_schedule_effective, fr_company_test_date) if (fr_drift == False and fr_last_within_tolerance != None and fr_schedule_effective > fr_last_within_tolerance) else int(MONTHS(fr_anchor, fr_company_test_date) / 2))
    - fr_schedule: CFIELD('service', 'variant_name', service_account_id=F('service_account_id'))
    - fr_refund_limit: K('large_power_refund_months') if fr_schedule == 'Schedule LP Large Power Service' else (K('medium_demand_refund_months') if fr_schedule == 'Schedule GD Medium General Demand Service' else P('refund_max_months'))
    - fr_bill_count: MN(fr_refund_limit, fr_months_reached)
    - fr_end_offset: MONTHS(F('removed_date'), NOW) if (F('status') == 'removed' and F('removed_date') > fr_company_test_date) else (0 if F('status') == 'in_service' else fr_company_offset)
    - fr_window_end: fr_company_offset + fr_bill_count
    - fr_energy: XSUM('service', 'service_bills', 'energy_charge_amount', within_months=fr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'energy_charge_amount', within_months=fr_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - fr_pscr: XSUM('service', 'service_bills', 'rider_charge_amount', within_months=fr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'rider_charge_amount', within_months=fr_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - fr_min_demand_kw: float(CPARAM('service', 'minimum_billing_demand_kw', service_account_id=F('service_account_id')))
    - fr_demand_rate: CPARAM('service', 'demand_charge_usd_kw', service_account_id=F('service_account_id'))
    - fr_demand_all: XSUM('service', 'service_bills', 'demand_charge_amount', within_months=fr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'demand_charge_amount', within_months=fr_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - fr_demand_at_min: XSUM('service', 'service_bills', 'demand_charge_amount', within_months=fr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=fr_min_demand_kw) - XSUM('service', 'service_bills', 'demand_charge_amount', within_months=fr_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=fr_min_demand_kw)
    - fr_bills_at_min: XCOUNT('service', 'service_bills', within_months=fr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=fr_min_demand_kw) - XCOUNT('service', 'service_bills', within_months=fr_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=fr_min_demand_kw)
    - fr_demand_corrected: (fr_demand_all - fr_demand_at_min) if (fr_demand_rate > 0 and fr_bills_at_min > 0) else (fr_demand_all if (fr_demand_rate > 0 and fr_bills_at_min == 0) else 0)
    - fr_error_factor: ABS(1 - 100 / fr_company_registration)
    - fr_charges_refund: RND((fr_energy + fr_pscr + fr_demand_corrected) * fr_error_factor, 2)
    - fr_late_charges: XSUM('service', 'service_charges', 'amount', within_months=fr_window_end, date_field='posting_date', service_account_id=F('service_account_id'), event_type='service_late_payment_charge') - XSUM('service', 'service_charges', 'amount', within_months=fr_end_offset, date_field='posting_date', service_account_id=F('service_account_id'), event_type='service_late_payment_charge')
    - fr_residential: fr_schedule == 'Schedule RS Residential Standard Service' or fr_schedule == 'Schedule RT Residential Time-of-Use Service' or fr_schedule == 'Schedule REV Residential Electric Vehicle Time-of-Use Service'
    - fr_late_share: fr_error_factor if (fr_residential == False and fr_late_charges > 0) else (1 if (fr_residential == True and fr_late_charges > 0) else 0)
    - fr_late_refund: RND(fr_late_charges * fr_late_share, 2)
    - fr_bills_counted: XCOUNT('service', 'service_bills', within_months=fr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XCOUNT('service', 'service_bills', within_months=fr_company_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - fr_interest_rate: K('refund_interest_rate') if fr_bills_counted >= K('interest_full_bills') else (K('refund_interest_rate') / 2 if (fr_bills_counted >= K('interest_half_bills') and fr_bills_counted < K('interest_full_bills')) else 0)
    - fr_interest: RND(fr_charges_refund * fr_interest_rate * fr_bills_counted / 24, 2)
    - fr_fees_returned: SUM('meter_charges', 'amount', event_type='meter_test_fee')
    - fr_refund_raw: RND(fr_charges_refund + fr_late_refund + fr_interest + fr_fees_returned, 2)
    - result: 0.0 if fr_refund_raw < P('adjustment_threshold_usd') else fr_refund_raw
    compute_basis:
      fr_company_test_date: it is calculated for the company's own test result of the meter, which is the latest test result taken by the test method of the meter's type, when that result classifies the meter fast
      fr_company_registration: the fast-meter error factor is the absolute value of one minus 100 divided by the company test's registration_pct
      fr_company_offset: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date
      fr_last_within_tolerance: the later of the meter's installation date and the test date of its latest within-tolerance result
      fr_schedule_effective: the service agreement's current rate schedule took effect after its test date
      fr_anchor: the later of the meter's installation date and the test date of its latest within-tolerance result
      fr_months_reached: Where the meter's latest within-tolerance result already lay in the outer drift share of the tolerance band, on the same side of 100 as the company test's registration_pct, the meter was drifting toward the limit at that test, so the error is dated from that test itself rather than from the midpoint, and the billing months the fast-meter refund reaches back are all the whole calendar months between the test date of that within-tolerance result and the company test date. Where the latest within-tolerance result shows no such drift and the service agreement's current rate schedule took effect after its test date, the billing months the fast-meter refund reaches back are the whole calendar months between the schedule's effective date and the company test date. In every other case the billing months the fast-meter refund reaches back are one half of the whole calendar months, as the standard method counts them.
      fr_schedule: Where the agreement is on Schedule LP
      fr_refund_limit: Where the agreement is on Schedule LP, the fast-meter refund limit is the large-power refund limit. Where the agreement is on Schedule GD, the fast-meter refund limit is the medium-demand refund limit. In every other case the fast-meter refund limit is the meter type's refund_max_months.
      fr_bill_count: as many as the smaller of the billing months the fast-meter refund reaches back and the fast-meter refund limit
      fr_end_offset: Where the meter was removed from service after the company test date, the fast-meter refund also covers the regular bills whose billing period ended after the company test date and on or before the removal date, added to the bills counted back from the company test date, because the meter kept registering fast until it was taken out. Where the meter is still in service, the fast-meter refund also covers every regular bill whose billing period ended after the company test date, added to the bills counted back. In every other case the fast-meter refund covers no bill whose billing period ended after the company test date, as the standard method states.
      fr_window_end: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the fast-meter refund reaches back and the fast-meter refund limit
      fr_energy: the charges the fast-meter refund corrects are the energy and Power Supply Cost Recovery charges of those bills
      fr_pscr: the charges the fast-meter refund corrects are the energy and Power Supply Cost Recovery charges of those bills
      fr_min_demand_kw: at least one bill the fast-meter refund covers was billed at the schedule's minimum billing demand
      fr_demand_rate: Where the service agreement's rate schedule carries a demand charge
      fr_demand_all: the charges the fast-meter refund corrects are the energy, Power Supply Cost Recovery and demand charges of every covered bill.
      fr_demand_at_min: plus the demand charges of the covered bills billed above that minimum.
      fr_bills_at_min: at least one bill the fast-meter refund covers was billed at the schedule's minimum billing demand
      fr_demand_corrected: Where the service agreement's rate schedule carries a demand charge and at least one bill the fast-meter refund covers was billed at the schedule's minimum billing demand, the charges the fast-meter refund corrects are the energy and Power Supply Cost Recovery charges of every covered bill plus the demand charges of the covered bills billed above that minimum. Where the rate schedule carries a demand charge and no covered bill was billed at the minimum billing demand, the charges the fast-meter refund corrects are the energy, Power Supply Cost Recovery and demand charges of every covered bill. In every other case the fast-meter refund corrects the energy and Power Supply Cost Recovery charges, as the standard method states.
      fr_error_factor: the fast-meter error factor is the absolute value of one minus 100 divided by the company test's registration_pct
      fr_charges_refund: The fast-meter refund is the corrected charges times the fast-meter error factor, rounded to the cent
      fr_late_charges: Late payment charges posted on the service agreement within the whole calendar months the fast-meter refund covers, counted from the handling date as the covered bills are, were computed on overstated bills.
      fr_residential: Where the agreement is on a residential schedule (RS, RT or REV)
      fr_late_share: Where the agreement is on a general service schedule (GS, GST, GD or LP) and such late payment charges exist, the corrected late payment charges are those charges times the fast-meter error factor, rounded to the cent. Where the agreement is on a residential schedule (RS, RT or REV) and such late payment charges exist, the corrected late payment charges are all of those charges. In every other case no late payment charge is corrected.
      fr_late_refund: the corrected late payment charges are those charges times the fast-meter error factor, rounded to the cent.
      fr_bills_counted: times the number of bills counted back from the company test date divided by 24
      fr_interest_rate: Where the fast-meter refund counts back at least the full-interest number of bills, the refund interest rate is the refund interest rate. Where it covers at least the half-interest number of bills but fewer than the full-interest number, the refund interest rate is one half of the refund interest rate. In every other case there is no refund interest.
      fr_interest: The refund interest is the corrected charges times the fast-meter error factor, rounded to the cent, times the refund interest rate, times the number of bills counted back from the company test date divided by 24, which is simple interest for half the counted-back period in years, rounded to the cent.
      fr_fees_returned: plus every repeat test fee standing on the meter's metering charges, which the refund returns because the meter was in fact inaccurate
      fr_refund_raw: The fast-meter refund is the corrected charges times the fast-meter error factor, rounded to the cent, plus the corrected late payment charges, plus the refund interest, plus every repeat test fee standing on the meter's metering charges
      result: a fast-meter refund smaller than the meter type's adjustment_threshold_usd is recorded as 0.00.
      fr_last_registration: the meter's latest within-tolerance result already lay in the outer drift share of the tolerance band
      fr_drift: Where the meter's latest within-tolerance result already lay in the outer drift share of the tolerance band, on the same side of 100 as the company test's registration_pct
    factors:
    - id: fast_refund_months_reached
      effect: method
      decides: fr_months_reached
      bindings:
      - fr_last_within_tolerance
      - fr_last_registration
      - fr_drift
      - fr_schedule_effective
      - fr_anchor
      - fr_months_reached
      ladder:
      - when: the meter's latest within-tolerance result lay in the outer drift share of the band AND on the same side of 100 as the company result
        method: all the whole calendar months between that within-tolerance result's test date and the company test date
      - when: no such drift AND the agreement's current schedule took effect after the latest within-tolerance result
        method: the whole calendar months between the schedule's effective date and the company test date
      - when: otherwise
        method: one half of the whole calendar months between the later of installation and the latest within-tolerance result and the company test date, rounded down
      baseline:
        fr_months_reached: int(MONTHS(fr_anchor, fr_company_test_date) / 2)
      evidence:
      - history
      - date
      - cross_category
      cross_difficulty: null
    - id: fast_refund_limit
      effect: parameter
      decides: fr_refund_limit
      bindings:
      - fr_schedule
      - fr_refund_limit
      ladder:
      - when: the agreement is on Schedule LP
        value: K('large_power_refund_months')
      - when: the agreement is on Schedule GD
        value: K('medium_demand_refund_months')
      - when: otherwise
        value: P('refund_max_months')
      baseline:
        fr_refund_limit: P('refund_max_months')
      evidence:
      - cross_category
      - tier_param
      cross_difficulty: service
    - id: fast_refund_demand_basis
      effect: method
      decides: fr_demand_corrected
      bindings:
      - fr_min_demand_kw
      - fr_demand_rate
      - fr_demand_all
      - fr_demand_at_min
      - fr_bills_at_min
      - fr_demand_corrected
      ladder:
      - when: the agreement's schedule carries a demand charge AND at least one covered bill was billed at the schedule's minimum billing demand
        method: demand charges of the covered bills billed above the minimum are corrected; those held at the minimum are not
      - when: the schedule carries a demand charge AND no covered bill was billed at the minimum billing demand
        method: the demand charges of every covered bill are corrected
      - when: otherwise
        method: no demand charge is corrected; energy and Power Supply Cost Recovery charges only
      baseline:
        fr_demand_corrected: '0'
      evidence:
      - cross_category
      - history
      - tier_param
      cross_difficulty: service
    - id: fast_refund_late_charges
      effect: parameter
      decides: fr_late_share
      bindings:
      - fr_late_charges
      - fr_residential
      - fr_late_share
      ladder:
      - when: the agreement is on a general service schedule (GS, GST, GD or LP) AND late payment charges were posted within the covered months
        value: the fast-meter error factor (the overstated share of those late charges)
      - when: the agreement is on a residential schedule (RS, RT or REV) AND late payment charges were posted within the covered months
        value: 1 (every such late charge is returned)
      - when: otherwise
        value: '0'
      baseline:
        fr_late_share: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: service
    - id: fast_refund_interest
      effect: parameter
      decides: fr_interest_rate
      bindings:
      - fr_bills_counted
      - fr_interest_rate
      ladder:
      - when: the refund counts back at least the full-interest number of bills
        value: K('refund_interest_rate')
      - when: it counts back at least the half-interest number but fewer than the full-interest number of bills
        value: K('refund_interest_rate') / 2
      - when: otherwise
        value: '0'
      baseline:
        fr_interest_rate: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: null
    - id: fast_refund_last_bill
      effect: method
      decides: fr_end_offset
      bindings:
      - fr_end_offset
      ladder:
      - when: the meter was removed from service after the company test date
        method: the bills whose period ended after the company test date and on or before the removal date are added
      - when: the meter is still in service
        method: every bill whose period ended after the company test date is added
      - when: otherwise
        method: no bill ending after the company test date is refunded
      baseline:
        fr_end_offset: fr_company_offset
      evidence:
      - date
      - history
      cross_difficulty: null
    baseline:
      rule: 'Under the standard method the fast-meter refund covers whole regular bills of the service agreement: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the fast-meter refund reaches back and the fast-meter refund limit, and no bill whose billing period ended after the company test date. Under the standard method the billing months the fast-meter refund reaches back are one half of the whole calendar months between the later of the meter''s installation date and the test date of its latest within-tolerance result, and the company test date, rounded down to a whole month, and the fast-meter refund limit is the meter type''s refund_max_months. Under the standard method the charges the fast-meter refund corrects are the energy and Power Supply Cost Recovery charges of those bills, and the fast-meter error factor is the absolute value of one minus 100 divided by the
        company test''s registration_pct; no late payment charge is corrected and no interest is added. The fast-meter refund is the corrected charges times the fast-meter error factor, rounded to the cent, plus the corrected late payment charges, plus the refund interest, plus every repeat test fee standing on the meter''s metering charges, which the refund returns because the meter was in fact inaccurate, and a fast-meter refund smaller than the meter type''s adjustment_threshold_usd is recorded as 0.00.'
      params:
      - refund_max_months
      - adjustment_threshold_usd
    inputs:
      history:
      - table: meter_tests
        aggregate: count
        field: meter_test_id
        filters:
          event_type: meter_test_request
          test_reason: customer_request
      - table: meter_charges
        aggregate: sum
        field: amount
        filters:
          event_type: meter_test_fee
      - category: service
        table: service_bills
        aggregate: sum
        field: energy_charge_amount
        filters:
          bill_kind: regular
      - category: service
        table: service_charges
        aggregate: sum
        field: amount
        filters:
          event_type: service_late_payment_charge
      cross_category:
      - service
  - id: meter_ext_referee_refund_settlement
    base_policy_refs:
    - meter_accuracy_adjustment_rule
    overwrite:
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: The adjustment period ends on the test date and starts on meter_msr_error_start_date, which applies error_start_basis and caps the period at refund_max_months for a refund or backbill_max_months for a backbill.
      replaced_by: 'Under the standard method the referee refund settlement reprices whole regular bills of the service agreement: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the referee refund settlement reaches back and the referee refund limit, and no bill whose billing period ended after the company test date.'
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: The corrected charges are the energy, demand and Power Supply Cost Recovery charges of the regular bills whose billing period ends inside the adjustment period (meter_msr_affected_charges).
      replaced_by: Under the standard method the charges the referee refund settlement reprices are the energy and Power Supply Cost Recovery charges of those bills, and the referee refund error factor is the absolute value of one minus 100 divided by the referee test's registration_pct; no late payment charge is repriced and no interest is added.
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: For a fast or slow meter the amount is those charges times the absolute value of one minus 100 divided by registration_pct, and adjusted_kwh is their kwh_total times the same factor, both rounded at the end.
      replaced_by: The referee refund settlement is the repriced charges times the referee refund error factor, rounded to the cent, plus the repriced late payment charges, plus the settlement interest, plus every repeat test fee standing on the meter's metering charges, minus every refund already standing on the meter's adjustment record, never less than 0.00, and a settlement smaller than the meter type's adjustment_threshold_usd is credited as 0.00.
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: The refund is credited, and the backbill billed, on the service agreement on the adjustment date.
      replaced_by: 'The settlement is the customer''s own acceptance of the referee result: it is credited as a refund on the meter''s adjustment record against the referee test result on the date the customer accepts it, and a customer who does not accept it has no settlement credited.'
    trigger: on_request
    subject:
    - meter_accuracy_adjustment
    computes: settlement_amount
    target_tool: accept_referee_refund_settlement_2157b6a7
    params:
      settlement_large_power_months: 3
      settlement_medium_demand_months: 6
      settlement_interest_rate: 0.0417
      settlement_full_interest_bills: 12
      settlement_half_interest_bills: 3
      settlement_drift_share: 0.75
    rule: 'A referee refund settlement closes a dispute in which the customer of record asked for a Commission referee test of a meter that the company''s own test, the latest result taken by the test method of the meter''s type, found fast, and the referee test, which is the meter''s latest test result, also found it fast. The settlement is the customer''s own acceptance of the referee result: it is credited as a refund on the meter''s adjustment record against the referee test result on the date the customer accepts it, and a customer who does not accept it has no settlement credited. The referee refund settlement is not credited until the company test result it reviews carries its fast-meter refund on the meter''s adjustment record. The referee refund settlement is not credited until every test result on the customer''s other meters that found a meter not registering carries its non-registering backbill on that meter''s adjustment record. Under the standard method the referee refund settlement
      reprices whole regular bills of the service agreement: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the referee refund settlement reaches back and the referee refund limit, and no bill whose billing period ended after the company test date. Under the standard method the billing months the referee refund settlement reaches back are one half of the whole calendar months between the later of the meter''s installation date and the test date of its latest within-tolerance result, and the company test date, rounded down to a whole month, and the referee refund limit is the meter type''s refund_max_months. Under the standard method the charges the referee refund settlement reprices are the energy and Power Supply Cost Recovery charges of those bills, and the referee refund error factor is the absolute value of one minus 100 divided by the referee test''s registration_pct;
      no late payment charge is repriced and no interest is added. The referee refund settlement is the repriced charges times the referee refund error factor, rounded to the cent, plus the repriced late payment charges, plus the settlement interest, plus every repeat test fee standing on the meter''s metering charges, minus every refund already standing on the meter''s adjustment record, never less than 0.00, and a settlement smaller than the meter type''s adjustment_threshold_usd is credited as 0.00. Where the meter''s latest within-tolerance result already lay in the outer drift share of the tolerance band, on the same side of 100 as the company test''s registration_pct, the meter was drifting toward the limit at that test, so the error is dated from that test itself rather than from the midpoint, and the billing months the referee refund settlement reaches back are all the whole calendar months between the test date of that within-tolerance result and the company test date. Where the latest
      within-tolerance result shows no such drift and the service agreement''s current rate schedule took effect after its test date, the billing months the referee refund settlement reaches back are the whole calendar months between the schedule''s effective date and the company test date. In every other case the billing months the referee refund settlement reaches back are one half of the whole calendar months, as the standard method counts them. Where the agreement is on Schedule LP, the referee refund limit is the settlement large-power limit. Where the agreement is on Schedule GD, the referee refund limit is the settlement medium-demand limit. In every other case the referee refund limit is the meter type''s refund_max_months. Where the service agreement''s rate schedule carries a demand charge and at least one bill the referee refund settlement reprices was billed at the schedule''s minimum billing demand, the settlement reprices the energy and Power Supply Cost Recovery charges of every
      repriced bill plus the demand charges of the repriced bills billed above that minimum. Where the rate schedule carries a demand charge and no repriced bill was billed at the minimum billing demand, the settlement reprices the energy, Power Supply Cost Recovery and demand charges of every repriced bill. In every other case the referee refund settlement reprices the energy and Power Supply Cost Recovery charges, as the standard method states. Late payment charges posted on the service agreement within the whole calendar months the referee refund settlement reprices, counted from the handling date as the repriced bills are, were computed on overstated bills. Where the agreement is on a general service schedule (GS, GST, GD or LP) and such late payment charges exist, the repriced late payment charges are those charges times the referee refund error factor, rounded to the cent. Where the agreement is on a residential schedule (RS, RT or REV) and such late payment charges exist, the repriced
      late payment charges are all of those charges. In every other case no late payment charge is repriced. Where the referee refund settlement counts back at least the settlement full-interest number of bills, the settlement interest rate is the settlement interest rate. Where it counts back at least the settlement half-interest number of bills but fewer than the full-interest number, the settlement interest rate is one half of the settlement interest rate. In every other case there is no settlement interest. The settlement interest is the repriced charges times the referee refund error factor, rounded to the cent, times the settlement interest rate, times the number of bills counted back from the company test date divided by 24, which is simple interest for half the repriced period in years, rounded to the cent. Where the meter was removed from service after the company test date, the referee refund settlement also reprices the regular bills whose billing period ended after the company
      test date and on or before the removal date, added to the bills counted back from the company test date, because the meter kept registering fast until it was taken out. Where the meter is still in service, the referee refund settlement also reprices every regular bill whose billing period ended after the company test date, added to the bills counted back. In every other case the referee refund settlement reprices no bill whose billing period ended after the company test date, as the standard method states.'
    prerequisite:
    - problem: meter_ext_fast_meter_refund
      kind: value_input
      gate: rr_already_refunded
      form: state
      policy_source: The referee refund settlement is not credited until the company test result it reviews carries its fast-meter refund on the meter's adjustment record.
      condition: The meter's adjustment record carries a refund recorded against the company's own fast test result that the referee result reviews.
      resolved_by: post_fast_meter_refund_06e0a347
      effect: rr_already_refunded rises from 0.00 to the fast-meter refund recorded for the company result, and the settlement subtracts it.
    - problem: meter_ext_non_registering_backbill
      kind: state_gate
      gate: meter_adjustments.meter_test_id
      form: state
      policy_source: The referee refund settlement is not credited until every test result on the customer's other meters that found a meter not registering carries its non-registering backbill on that meter's adjustment record.
      condition: Every non_registering test result on the customer's other meter installations has a backbill row on that installation's adjustment record carrying its meter_test_id.
      resolved_by: post_non_registering_backbill_96d206ff
      effect: 'The settlement''s credit gate opens: once the other meter''s non-registering result carries its backbill, the settlement may be credited; its amount is unchanged.'
    cross_category:
    - category: service
      as: history
      reads:
      - variant_name
      - rate_effective_date
      - service_bills.energy_charge_amount
      - service_bills.rider_charge_amount
      - service_bills.demand_charge_amount
      - service_bills.billing_demand_kw
      - service_charges.amount
      - minimum_billing_demand_kw
      - demand_charge_usd_kw
      note: The settlement limit and late-charge factors' tiers are decided from the agreement's schedule and the late payment charges posted on it; the demand factor from the bills billed at the schedule minimum.
    compute:
    - rr_company_test_date: LATEST('meter_tests', 'test_date', date_field='test_date', event_type='meter_test_result', test_method=P('test_method'))
    - rr_company_registration: LATEST('meter_tests', 'registration_pct', date_field='test_date', event_type='meter_test_result', test_method=P('test_method'))
    - rr_referee_registration: LATEST('meter_tests', 'registration_pct', date_field='test_date', event_type='meter_test_result')
    - rr_company_offset: MONTHS(rr_company_test_date, NOW)
    - rr_last_within_tolerance: LATEST('meter_tests', 'test_date', date_field='test_date', event_type='meter_test_result', test_result='within_tolerance')
    - rr_last_registration: LATEST('meter_tests', 'registration_pct', date_field='test_date', event_type='meter_test_result', test_result='within_tolerance')
    - rr_drift: rr_last_registration != None and ABS(rr_last_registration - 100) >= K('settlement_drift_share') * P('accuracy_tolerance_pct') and (rr_last_registration - 100) * (rr_company_registration - 100) > 0
    - rr_schedule_effective: CFIELD('service', 'rate_effective_date', service_account_id=F('service_account_id'))
    - rr_anchor: rr_last_within_tolerance if (rr_last_within_tolerance != None and rr_last_within_tolerance > F('installed_date')) else F('installed_date')
    - rr_months_reached: MONTHS(rr_last_within_tolerance, rr_company_test_date) if rr_drift == True else (MONTHS(rr_schedule_effective, rr_company_test_date) if (rr_drift == False and rr_last_within_tolerance != None and rr_schedule_effective > rr_last_within_tolerance) else int(MONTHS(rr_anchor, rr_company_test_date) / 2))
    - rr_schedule: CFIELD('service', 'variant_name', service_account_id=F('service_account_id'))
    - rr_refund_limit: K('settlement_large_power_months') if rr_schedule == 'Schedule LP Large Power Service' else (K('settlement_medium_demand_months') if rr_schedule == 'Schedule GD Medium General Demand Service' else P('refund_max_months'))
    - rr_bill_count: MN(rr_refund_limit, rr_months_reached)
    - rr_end_offset: MONTHS(F('removed_date'), NOW) if (F('status') == 'removed' and F('removed_date') > rr_company_test_date) else (0 if F('status') == 'in_service' else rr_company_offset)
    - rr_window_end: rr_company_offset + rr_bill_count
    - rr_energy: XSUM('service', 'service_bills', 'energy_charge_amount', within_months=rr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'energy_charge_amount', within_months=rr_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - rr_pscr: XSUM('service', 'service_bills', 'rider_charge_amount', within_months=rr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'rider_charge_amount', within_months=rr_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - rr_min_demand_kw: float(CPARAM('service', 'minimum_billing_demand_kw', service_account_id=F('service_account_id')))
    - rr_demand_rate: CPARAM('service', 'demand_charge_usd_kw', service_account_id=F('service_account_id'))
    - rr_demand_all: XSUM('service', 'service_bills', 'demand_charge_amount', within_months=rr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'demand_charge_amount', within_months=rr_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - rr_demand_at_min: XSUM('service', 'service_bills', 'demand_charge_amount', within_months=rr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=rr_min_demand_kw) - XSUM('service', 'service_bills', 'demand_charge_amount', within_months=rr_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=rr_min_demand_kw)
    - rr_bills_at_min: XCOUNT('service', 'service_bills', within_months=rr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=rr_min_demand_kw) - XCOUNT('service', 'service_bills', within_months=rr_end_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', billing_demand_kw=rr_min_demand_kw)
    - rr_demand_corrected: (rr_demand_all - rr_demand_at_min) if (rr_demand_rate > 0 and rr_bills_at_min > 0) else (rr_demand_all if (rr_demand_rate > 0 and rr_bills_at_min == 0) else 0)
    - rr_error_factor: ABS(1 - 100 / rr_referee_registration)
    - rr_charges_refund: RND((rr_energy + rr_pscr + rr_demand_corrected) * rr_error_factor, 2)
    - rr_late_charges: XSUM('service', 'service_charges', 'amount', within_months=rr_window_end, date_field='posting_date', service_account_id=F('service_account_id'), event_type='service_late_payment_charge') - XSUM('service', 'service_charges', 'amount', within_months=rr_end_offset, date_field='posting_date', service_account_id=F('service_account_id'), event_type='service_late_payment_charge')
    - rr_residential: rr_schedule == 'Schedule RS Residential Standard Service' or rr_schedule == 'Schedule RT Residential Time-of-Use Service' or rr_schedule == 'Schedule REV Residential Electric Vehicle Time-of-Use Service'
    - rr_late_share: rr_error_factor if (rr_residential == False and rr_late_charges > 0) else (1 if (rr_residential == True and rr_late_charges > 0) else 0)
    - rr_late_refund: RND(rr_late_charges * rr_late_share, 2)
    - rr_bills_counted: XCOUNT('service', 'service_bills', within_months=rr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XCOUNT('service', 'service_bills', within_months=rr_company_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - rr_interest_rate: K('settlement_interest_rate') if rr_bills_counted >= K('settlement_full_interest_bills') else (K('settlement_interest_rate') / 2 if (rr_bills_counted >= K('settlement_half_interest_bills') and rr_bills_counted < K('settlement_full_interest_bills')) else 0)
    - rr_interest: RND(rr_charges_refund * rr_interest_rate * rr_bills_counted / 24, 2)
    - rr_fees_returned: SUM('meter_charges', 'amount', event_type='meter_test_fee')
    - rr_already_refunded: SUM('meter_adjustments', 'amount', adjustment_direction='refund')
    - rr_settlement_raw: RND(MX(0, rr_charges_refund + rr_late_refund + rr_interest + rr_fees_returned - rr_already_refunded), 2)
    - result: 0.0 if rr_settlement_raw < P('adjustment_threshold_usd') else rr_settlement_raw
    compute_basis:
      rr_company_test_date: the company's own test, the latest result taken by the test method of the meter's type, found fast
      rr_referee_registration: the referee test, which is the meter's latest test result, also found it fast.
      rr_company_offset: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date
      rr_last_within_tolerance: the later of the meter's installation date and the test date of its latest within-tolerance result
      rr_schedule_effective: the service agreement's current rate schedule took effect after its test date
      rr_anchor: the later of the meter's installation date and the test date of its latest within-tolerance result
      rr_months_reached: Where the meter's latest within-tolerance result already lay in the outer drift share of the tolerance band, on the same side of 100 as the company test's registration_pct, the meter was drifting toward the limit at that test, so the error is dated from that test itself rather than from the midpoint, and the billing months the referee refund settlement reaches back are all the whole calendar months between the test date of that within-tolerance result and the company test date. Where the latest within-tolerance result shows no such drift and the service agreement's current rate schedule took effect after its test date, the billing months the referee refund settlement reaches back are the whole calendar months between the schedule's effective date and the company test date. In every other case the billing months the referee refund settlement reaches back are one half of the whole calendar months, as the standard method counts them.
      rr_schedule: Where the agreement is on Schedule LP
      rr_refund_limit: Where the agreement is on Schedule LP, the referee refund limit is the settlement large-power limit. Where the agreement is on Schedule GD, the referee refund limit is the settlement medium-demand limit. In every other case the referee refund limit is the meter type's refund_max_months.
      rr_bill_count: as many as the smaller of the billing months the referee refund settlement reaches back and the referee refund limit
      rr_end_offset: Where the meter was removed from service after the company test date, the referee refund settlement also reprices the regular bills whose billing period ended after the company test date and on or before the removal date, added to the bills counted back from the company test date, because the meter kept registering fast until it was taken out. Where the meter is still in service, the referee refund settlement also reprices every regular bill whose billing period ended after the company test date, added to the bills counted back. In every other case the referee refund settlement reprices no bill whose billing period ended after the company test date, as the standard method states.
      rr_window_end: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the referee refund settlement reaches back and the referee refund limit
      rr_energy: the charges the referee refund settlement reprices are the energy and Power Supply Cost Recovery charges of those bills
      rr_pscr: the charges the referee refund settlement reprices are the energy and Power Supply Cost Recovery charges of those bills
      rr_min_demand_kw: at least one bill the referee refund settlement reprices was billed at the schedule's minimum billing demand
      rr_demand_rate: Where the service agreement's rate schedule carries a demand charge
      rr_demand_all: the settlement reprices the energy, Power Supply Cost Recovery and demand charges of every repriced bill.
      rr_demand_at_min: plus the demand charges of the repriced bills billed above that minimum.
      rr_bills_at_min: at least one bill the referee refund settlement reprices was billed at the schedule's minimum billing demand
      rr_demand_corrected: Where the service agreement's rate schedule carries a demand charge and at least one bill the referee refund settlement reprices was billed at the schedule's minimum billing demand, the settlement reprices the energy and Power Supply Cost Recovery charges of every repriced bill plus the demand charges of the repriced bills billed above that minimum. Where the rate schedule carries a demand charge and no repriced bill was billed at the minimum billing demand, the settlement reprices the energy, Power Supply Cost Recovery and demand charges of every repriced bill. In every other case the referee refund settlement reprices the energy and Power Supply Cost Recovery charges, as the standard method states.
      rr_error_factor: the referee refund error factor is the absolute value of one minus 100 divided by the referee test's registration_pct
      rr_charges_refund: The referee refund settlement is the repriced charges times the referee refund error factor, rounded to the cent
      rr_late_charges: Late payment charges posted on the service agreement within the whole calendar months the referee refund settlement reprices, counted from the handling date as the repriced bills are, were computed on overstated bills.
      rr_residential: Where the agreement is on a residential schedule (RS, RT or REV)
      rr_late_share: Where the agreement is on a general service schedule (GS, GST, GD or LP) and such late payment charges exist, the repriced late payment charges are those charges times the referee refund error factor, rounded to the cent. Where the agreement is on a residential schedule (RS, RT or REV) and such late payment charges exist, the repriced late payment charges are all of those charges. In every other case no late payment charge is repriced.
      rr_late_refund: the repriced late payment charges are those charges times the referee refund error factor, rounded to the cent.
      rr_bills_counted: times the number of bills counted back from the company test date divided by 24
      rr_interest_rate: Where the referee refund settlement counts back at least the settlement full-interest number of bills, the settlement interest rate is the settlement interest rate. Where it counts back at least the settlement half-interest number of bills but fewer than the full-interest number, the settlement interest rate is one half of the settlement interest rate. In every other case there is no settlement interest.
      rr_interest: The settlement interest is the repriced charges times the referee refund error factor, rounded to the cent, times the settlement interest rate, times the number of bills counted back from the company test date divided by 24, which is simple interest for half the repriced period in years, rounded to the cent.
      rr_fees_returned: plus every repeat test fee standing on the meter's metering charges
      rr_already_refunded: minus every refund already standing on the meter's adjustment record
      rr_settlement_raw: minus every refund already standing on the meter's adjustment record, never less than 0.00
      result: a settlement smaller than the meter type's adjustment_threshold_usd is credited as 0.00.
      rr_company_registration: on the same side of 100 as the company test's registration_pct
      rr_last_registration: the meter's latest within-tolerance result already lay in the outer drift share of the tolerance band
      rr_drift: Where the meter's latest within-tolerance result already lay in the outer drift share of the tolerance band, on the same side of 100 as the company test's registration_pct
    factors:
    - id: settlement_refund_months_reached
      effect: method
      decides: rr_months_reached
      bindings:
      - rr_last_within_tolerance
      - rr_last_registration
      - rr_drift
      - rr_schedule_effective
      - rr_anchor
      - rr_months_reached
      ladder:
      - when: the meter's latest within-tolerance result lay in the outer drift share of the band AND on the same side of 100 as the company result
        method: all the whole calendar months between that within-tolerance result's test date and the company test date
      - when: no such drift AND the agreement's current schedule took effect after the latest within-tolerance result
        method: the whole calendar months between the schedule's effective date and the company test date
      - when: otherwise
        method: one half of the whole calendar months between the later of installation and the latest within-tolerance result and the company test date, rounded down
      baseline:
        rr_months_reached: int(MONTHS(rr_anchor, rr_company_test_date) / 2)
      evidence:
      - history
      - date
      - cross_category
      cross_difficulty: null
    - id: settlement_refund_limit
      effect: parameter
      decides: rr_refund_limit
      bindings:
      - rr_schedule
      - rr_refund_limit
      ladder:
      - when: the agreement is on Schedule LP
        value: K('settlement_large_power_months')
      - when: the agreement is on Schedule GD
        value: K('settlement_medium_demand_months')
      - when: otherwise
        value: P('refund_max_months')
      baseline:
        rr_refund_limit: P('refund_max_months')
      evidence:
      - cross_category
      - tier_param
      cross_difficulty: service
    - id: settlement_refund_demand_basis
      effect: method
      decides: rr_demand_corrected
      bindings:
      - rr_min_demand_kw
      - rr_demand_rate
      - rr_demand_all
      - rr_demand_at_min
      - rr_bills_at_min
      - rr_demand_corrected
      ladder:
      - when: the agreement's schedule carries a demand charge AND at least one repriced bill was billed at the schedule's minimum billing demand
        method: demand charges of the repriced bills billed above the minimum are repriced; those held at the minimum are not
      - when: the schedule carries a demand charge AND no repriced bill was billed at the minimum billing demand
        method: the demand charges of every repriced bill are repriced
      - when: otherwise
        method: no demand charge is repriced; energy and Power Supply Cost Recovery charges only
      baseline:
        rr_demand_corrected: '0'
      evidence:
      - cross_category
      - history
      - tier_param
      cross_difficulty: service
    - id: settlement_refund_late_charges
      effect: parameter
      decides: rr_late_share
      bindings:
      - rr_late_charges
      - rr_residential
      - rr_late_share
      ladder:
      - when: the agreement is on a general service schedule (GS, GST, GD or LP) AND late payment charges were posted within the repriced months
        value: the referee refund error factor (the overstated share of those late charges)
      - when: the agreement is on a residential schedule (RS, RT or REV) AND late payment charges were posted within the repriced months
        value: 1 (every such late charge is returned)
      - when: otherwise
        value: '0'
      baseline:
        rr_late_share: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: service
    - id: settlement_refund_interest
      effect: parameter
      decides: rr_interest_rate
      bindings:
      - rr_bills_counted
      - rr_interest_rate
      ladder:
      - when: the refund counts back at least the full-interest number of bills
        value: K('settlement_interest_rate')
      - when: it counts back at least the half-interest number but fewer than the full-interest number of bills
        value: K('settlement_interest_rate') / 2
      - when: otherwise
        value: '0'
      baseline:
        rr_interest_rate: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: null
    - id: settlement_refund_last_bill
      effect: method
      decides: rr_end_offset
      bindings:
      - rr_end_offset
      ladder:
      - when: the meter was removed from service after the company test date
        method: the bills whose period ended after the company test date and on or before the removal date are added
      - when: the meter is still in service
        method: every bill whose period ended after the company test date is added
      - when: otherwise
        method: no bill ending after the company test date is repriced
      baseline:
        rr_end_offset: rr_company_offset
      evidence:
      - date
      - history
      cross_difficulty: null
    baseline:
      rule: 'Under the standard method the referee refund settlement reprices whole regular bills of the service agreement: counting back from the company test date, the most recent regular bills whose billing period ended on or before that date, as many as the smaller of the billing months the referee refund settlement reaches back and the referee refund limit, and no bill whose billing period ended after the company test date. Under the standard method the billing months the referee refund settlement reaches back are one half of the whole calendar months between the later of the meter''s installation date and the test date of its latest within-tolerance result, and the company test date, rounded down to a whole month, and the referee refund limit is the meter type''s refund_max_months. Under the standard method the charges the referee refund settlement reprices are the energy and Power Supply Cost Recovery charges of those bills, and the referee refund error factor is the absolute value
        of one minus 100 divided by the referee test''s registration_pct; no late payment charge is repriced and no interest is added. The referee refund settlement is the repriced charges times the referee refund error factor, rounded to the cent, plus the repriced late payment charges, plus the settlement interest, plus every repeat test fee standing on the meter''s metering charges, minus every refund already standing on the meter''s adjustment record, never less than 0.00, and a settlement smaller than the meter type''s adjustment_threshold_usd is credited as 0.00.'
      params:
      - refund_max_months
      - adjustment_threshold_usd
    inputs:
      history:
      - table: meter_tests
        aggregate: latest
        field: registration_pct
        filters:
          event_type: meter_test_result
      - table: meter_adjustments
        aggregate: sum
        field: amount
        filters:
          adjustment_direction: refund
      - category: service
        table: service_bills
        aggregate: sum
        field: energy_charge_amount
        filters:
          bill_kind: regular
      - category: service
        table: service_charges
        aggregate: sum
        field: amount
        filters:
          event_type: service_late_payment_charge
      cross_category:
      - service
  - id: meter_ext_non_registering_backbill
    base_policy_refs:
    - meter_accuracy_adjustment_rule
    overwrite:
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: The adjustment period ends on the test date and starts on meter_msr_error_start_date, which applies error_start_basis and caps the period at refund_max_months for a refund or backbill_max_months for a backbill.
      replaced_by: 'Under the standard method the non-registering backbill covers whole regular bills of the service agreement: counting back from the non-registering test date, the most recent regular bills whose billing period ended on or before that date, as many as one half of the whole calendar months between the later of the meter''s installation date and the test date of its latest within-tolerance result and the non-registering test date, rounded down, and never more than the meter type''s backbill_max_months.'
    - base_policy: meter_accuracy_adjustment_rule
      superseded_clause: For a non_registering meter the backbill is computed under non_registering_basis.
      replaced_by: Under the standard method the usage of each covered bill is taken from the regular bill of the same billing month one year earlier, so that the charges the non-registering backbill recovers are the energy, Power Supply Cost Recovery and demand charges of those prior-year bills, as billed, minus the energy and Power Supply Cost Recovery charges already billed on the covered bills.
    trigger: state_due
    subject:
    - meter_accuracy_adjustment
    computes: backbill_amount
    target_tool: post_non_registering_backbill_96d206ff
    params:
      long_overdue_margin_months: 12
      long_overdue_share: 0.5
      overdue_share: 0.75
      prompt_report_bills: 2
      prompt_report_share: 0.8
      late_report_share: 0.9
    rule: 'A non-registering backbill recovers the usage a meter failed to register, and it is calculated for the meter''s test result that classifies it non_registering; it is recorded on the meter''s adjustment record against that result, as a backbill, on the date it is calculated. Under the standard method the non-registering backbill covers whole regular bills of the service agreement: counting back from the non-registering test date, the most recent regular bills whose billing period ended on or before that date, as many as one half of the whole calendar months between the later of the meter''s installation date and the test date of its latest within-tolerance result and the non-registering test date, rounded down, and never more than the meter type''s backbill_max_months. Under the standard method the usage of each covered bill is taken from the regular bill of the same billing month one year earlier, so that the charges the non-registering backbill recovers are the energy, Power Supply
      Cost Recovery and demand charges of those prior-year bills, as billed, minus the energy and Power Supply Cost Recovery charges already billed on the covered bills. Under the standard method the overdue-test share and the reporting share are both 1. The non-registering backbill is the recovered charges multiplied first by the overdue-test share and then by the reporting share, rounded to the cent once at the end, and a non-registering backbill smaller than the meter type''s adjustment_threshold_usd is recorded as 0.00. Where the service agreement''s regular bills ending within the meter type''s backbill_max_months before the non-registering test date include bills with zero kWh registered, the stop is visible on the bills and the non-registering backbill covers as many of the most recent bills as there are such zero-kWh bills. Where no such zero-kWh bill exists, the meter was set by a failed-meter replacement or a test exchange, and it has no within-tolerance test result on record, the
      non-registering backbill covers all the whole calendar months between the installation date and the non-registering test date, never more than the backbill_max_months. In every other case the non-registering backbill covers the bills the standard method counts. Where the rate schedule carries a demand charge and covered bills recorded zero measured demand, the demand register failed with the meter, and the demand charges recovered are the prior-year bills'' demand charges minus the demand charges already billed on the covered bills. Where the rate schedule carries a demand charge and no covered bill recorded zero measured demand, the demand register kept working and no demand charge is recovered. In every other case the demand charges recovered are the prior-year bills'' demand charges in full, as the standard method states. The overdue months are the whole calendar months between the later of the meter''s installation date and its latest within-tolerance test date and the non-registering
      test date, less the meter type''s periodic test interval in months. Where the meter type has a periodic test interval and the overdue months exceed the long-overdue margin, the company''s periodic test was long overdue and the overdue-test share is the long-overdue share. Where the meter type has a periodic test interval and the overdue months are above zero but no more than the long-overdue margin, the overdue-test share is the overdue share. In every other case the overdue-test share is 1. The zero-kWh bills reported late are the zero-kWh bills of the covered period whose billing period ended before the month of the latest test request on the meter. Where the customer of record requested the test that found the meter not registering and no more than the prompt-report number of zero-kWh bills had ended before that request, the reporting share is the prompt-report share. Where the customer of record requested that test and more than the prompt-report number of zero-kWh bills had ended
      before it, the reporting share is the late-report share. In every other case the reporting share is 1.'
    prerequisite: []
    cross_category:
    - category: service
      as: history
      reads:
      - service_bills.kwh_total
      - service_bills.measured_demand_kw
      - service_bills.energy_charge_amount
      - service_bills.rider_charge_amount
      - service_bills.demand_charge_amount
      - service_bills.billing_period_end
      - demand_charge_usd_kw
      note: The covered-bills, demand and reporting-share factors' tiers are decided from the agreement's zero-kWh and zero-demand bills.
    compute:
    - nr_test_date: LATEST('meter_tests', 'test_date', date_field='test_date', event_type='meter_test_result', test_result='non_registering')
    - nr_test_offset: MONTHS(nr_test_date, NOW)
    - nr_last_within_tolerance: LATEST('meter_tests', 'test_date', date_field='test_date', event_type='meter_test_result', test_result='within_tolerance')
    - nr_anchor: nr_last_within_tolerance if (nr_last_within_tolerance != None and nr_last_within_tolerance > F('installed_date')) else F('installed_date')
    - nr_zero_bills: XCOUNT('service', 'service_bills', within_months=nr_test_offset + P('backbill_max_months'), date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', kwh_total=0) - XCOUNT('service', 'service_bills', within_months=nr_test_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', kwh_total=0)
    - nr_set_by_exchange: F('installation_reason') == 'failed_meter_replacement' or F('installation_reason') == 'test_exchange'
    - nr_bills_covered: nr_zero_bills if nr_zero_bills > 0 else (MN(P('backbill_max_months'), MONTHS(F('installed_date'), nr_test_date)) if (nr_set_by_exchange and nr_last_within_tolerance == None) else MN(P('backbill_max_months'), int(MONTHS(nr_anchor, nr_test_date) / 2)))
    - nr_window_end: nr_test_offset + nr_bills_covered
    - nr_prior_energy: XSUM('service', 'service_bills', 'energy_charge_amount', within_months=nr_window_end + 12, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'energy_charge_amount', within_months=nr_test_offset + 12, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - nr_prior_pscr: XSUM('service', 'service_bills', 'rider_charge_amount', within_months=nr_window_end + 12, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'rider_charge_amount', within_months=nr_test_offset + 12, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - nr_prior_demand: XSUM('service', 'service_bills', 'demand_charge_amount', within_months=nr_window_end + 12, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'demand_charge_amount', within_months=nr_test_offset + 12, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - nr_billed_energy: XSUM('service', 'service_bills', 'energy_charge_amount', within_months=nr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'energy_charge_amount', within_months=nr_test_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - nr_billed_pscr: XSUM('service', 'service_bills', 'rider_charge_amount', within_months=nr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'rider_charge_amount', within_months=nr_test_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - nr_billed_demand: XSUM('service', 'service_bills', 'demand_charge_amount', within_months=nr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular') - XSUM('service', 'service_bills', 'demand_charge_amount', within_months=nr_test_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular')
    - nr_demand_rate: CPARAM('service', 'demand_charge_usd_kw', service_account_id=F('service_account_id'))
    - nr_zero_demand_bills: XCOUNT('service', 'service_bills', within_months=nr_window_end, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', measured_demand_kw=0.0) - XCOUNT('service', 'service_bills', within_months=nr_test_offset, date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', measured_demand_kw=0.0)
    - nr_demand_recovered: (nr_prior_demand - nr_billed_demand) if (nr_demand_rate > 0 and nr_zero_demand_bills > 0) else (0 if (nr_demand_rate > 0 and nr_zero_demand_bills == 0) else nr_prior_demand)
    - nr_energy_recovered: (nr_prior_energy + nr_prior_pscr) - (nr_billed_energy + nr_billed_pscr)
    - nr_overdue_months: MONTHS(nr_anchor, nr_test_date) - 12 * P('periodic_test_interval_years')
    - nr_overdue_share: K('long_overdue_share') if (P('periodic_test_interval_years') > 0 and nr_overdue_months > K('long_overdue_margin_months')) else (K('overdue_share') if (P('periodic_test_interval_years') > 0 and nr_overdue_months > 0 and nr_overdue_months <= K('long_overdue_margin_months')) else 1)
    - nr_request_date: LATEST('meter_tests', 'request_date', date_field='request_date', event_type='meter_test_request')
    - nr_customer_requested: COUNT('meter_tests', event_type='meter_test_request', test_reason='customer_request', request_date=nr_request_date) > 0
    - nr_late_reported_bills: XCOUNT('service', 'service_bills', within_months=nr_test_offset + P('backbill_max_months'), date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', kwh_total=0) - XCOUNT('service', 'service_bills', within_months=MONTHS(nr_request_date, NOW), date_field='billing_period_end', service_account_id=F('service_account_id'), bill_kind='regular', kwh_total=0)
    - nr_reporting_share: K('prompt_report_share') if (nr_customer_requested == True and nr_late_reported_bills <= K('prompt_report_bills')) else (K('late_report_share') if (nr_customer_requested == True and nr_late_reported_bills > K('prompt_report_bills')) else 1)
    - nr_backbill_raw: RND((nr_energy_recovered + nr_demand_recovered) * nr_overdue_share * nr_reporting_share, 2)
    - result: 0.0 if nr_backbill_raw < P('adjustment_threshold_usd') else nr_backbill_raw
    compute_basis:
      nr_test_date: it is calculated for the meter's test result that classifies it non_registering
      nr_test_offset: counting back from the non-registering test date, the most recent regular bills whose billing period ended on or before that date
      nr_last_within_tolerance: the later of the meter's installation date and the test date of its latest within-tolerance result
      nr_anchor: the later of the meter's installation date and the test date of its latest within-tolerance result
      nr_zero_bills: Where the service agreement's regular bills ending within the meter type's backbill_max_months before the non-registering test date include bills with zero kWh registered, the stop is visible on the bills and the non-registering backbill covers as many of the most recent bills as there are such zero-kWh bills.
      nr_set_by_exchange: the meter was set by a failed-meter replacement or a test exchange, and it has no within-tolerance test result on record
      nr_bills_covered: Where the service agreement's regular bills ending within the meter type's backbill_max_months before the non-registering test date include bills with zero kWh registered, the stop is visible on the bills and the non-registering backbill covers as many of the most recent bills as there are such zero-kWh bills. Where no such zero-kWh bill exists, the meter was set by a failed-meter replacement or a test exchange, and it has no within-tolerance test result on record, the non-registering backbill covers all the whole calendar months between the installation date and the non-registering test date, never more than the backbill_max_months. In every other case the non-registering backbill covers the bills the standard method counts.
      nr_window_end: 'Under the standard method the non-registering backbill covers whole regular bills of the service agreement: counting back from the non-registering test date, the most recent regular bills whose billing period ended on or before that date, as many as one half of the whole calendar months between the later of the meter''s installation date and the test date of its latest within-tolerance result and the non-registering test date, rounded down, and never more than the meter type''s backbill_max_months.'
      nr_prior_energy: the usage of each covered bill is taken from the regular bill of the same billing month one year earlier
      nr_prior_pscr: the usage of each covered bill is taken from the regular bill of the same billing month one year earlier
      nr_prior_demand: the demand charges recovered are the prior-year bills' demand charges in full
      nr_billed_energy: minus the energy and Power Supply Cost Recovery charges already billed on the covered bills.
      nr_billed_pscr: minus the energy and Power Supply Cost Recovery charges already billed on the covered bills.
      nr_billed_demand: minus the demand charges already billed on the covered bills.
      nr_demand_rate: Where the rate schedule carries a demand charge
      nr_zero_demand_bills: covered bills recorded zero measured demand
      nr_demand_recovered: Where the rate schedule carries a demand charge and covered bills recorded zero measured demand, the demand register failed with the meter, and the demand charges recovered are the prior-year bills' demand charges minus the demand charges already billed on the covered bills. Where the rate schedule carries a demand charge and no covered bill recorded zero measured demand, the demand register kept working and no demand charge is recovered. In every other case the demand charges recovered are the prior-year bills' demand charges in full, as the standard method states.
      nr_energy_recovered: Under the standard method the usage of each covered bill is taken from the regular bill of the same billing month one year earlier, so that the charges the non-registering backbill recovers are the energy, Power Supply Cost Recovery and demand charges of those prior-year bills, as billed, minus the energy and Power Supply Cost Recovery charges already billed on the covered bills.
      nr_overdue_months: The overdue months are the whole calendar months between the later of the meter's installation date and its latest within-tolerance test date and the non-registering test date, less the meter type's periodic test interval in months.
      nr_overdue_share: Where the meter type has a periodic test interval and the overdue months exceed the long-overdue margin, the company's periodic test was long overdue and the overdue-test share is the long-overdue share. Where the meter type has a periodic test interval and the overdue months are above zero but no more than the long-overdue margin, the overdue-test share is the overdue share. In every other case the overdue-test share is 1.
      nr_customer_requested: Where the customer of record requested the test that found the meter not registering
      nr_request_date: The zero-kWh bills reported late are the zero-kWh bills of the covered period whose billing period ended before the month of the latest test request on the meter.
      nr_late_reported_bills: The zero-kWh bills reported late are the zero-kWh bills of the covered period whose billing period ended before the month of the latest test request on the meter.
      nr_reporting_share: Where the customer of record requested the test that found the meter not registering and no more than the prompt-report number of zero-kWh bills had ended before that request, the reporting share is the prompt-report share. Where the customer of record requested that test and more than the prompt-report number of zero-kWh bills had ended before it, the reporting share is the late-report share. In every other case the reporting share is 1.
      nr_backbill_raw: The non-registering backbill is the recovered charges multiplied first by the overdue-test share and then by the reporting share, rounded to the cent once at the end, and a non-registering backbill smaller than the meter type's adjustment_threshold_usd is recorded as 0.00.
      result: a non-registering backbill smaller than the meter type's adjustment_threshold_usd is recorded as 0.00.
    factors:
    - id: nonreg_bills_covered
      effect: method
      decides: nr_bills_covered
      bindings:
      - nr_zero_bills
      - nr_set_by_exchange
      - nr_bills_covered
      ladder:
      - when: the agreement's bills within the backbill limit before the test include zero-kWh bills
        method: as many of the most recent bills as there are zero-kWh bills
      - when: no zero-kWh bill AND the meter was set by a failed-meter replacement or test exchange with no within-tolerance result
        method: all whole months since installation, capped at backbill_max_months
      - when: otherwise
        method: one half of the whole months since the later of installation and the latest within-tolerance result, capped at backbill_max_months
      baseline:
        nr_bills_covered: MN(P('backbill_max_months'), int(MONTHS(nr_anchor, nr_test_date) / 2))
      evidence:
      - cross_category
      - history
      - date
      cross_difficulty: service
    - id: nonreg_demand_recovered
      effect: method
      decides: nr_demand_recovered
      bindings:
      - nr_demand_rate
      - nr_zero_demand_bills
      - nr_demand_recovered
      ladder:
      - when: the schedule carries a demand charge AND covered bills recorded zero measured demand
        method: prior-year demand charges minus the demand charges already billed on the covered bills
      - when: the schedule carries a demand charge AND no covered bill recorded zero measured demand
        method: no demand charge is recovered
      - when: otherwise
        method: the prior-year bills' demand charges in full
      baseline:
        nr_demand_recovered: nr_prior_demand
      evidence:
      - cross_category
      - history
      - tier_param
      cross_difficulty: service
    - id: nonreg_overdue_share
      effect: parameter
      decides: nr_overdue_share
      bindings:
      - nr_overdue_months
      - nr_overdue_share
      ladder:
      - when: the type has a periodic test interval AND the overdue months exceed the long-overdue margin
        value: K('long_overdue_share')
      - when: the type has a periodic test interval AND the overdue months are above zero and no more than the margin
        value: K('overdue_share')
      - when: otherwise
        value: '1'
      baseline:
        nr_overdue_share: '1'
      evidence:
      - date
      - history
      - tier_param
      cross_difficulty: null
    - id: nonreg_reporting_share
      effect: parameter
      decides: nr_reporting_share
      bindings:
      - nr_customer_requested
      - nr_request_date
      - nr_late_reported_bills
      - nr_reporting_share
      ladder:
      - when: the customer requested the test that found the meter not registering AND no more than the prompt-report number of zero-kWh bills had ended before the request
        value: K('prompt_report_share')
      - when: the customer requested that test AND more than the prompt-report number of zero-kWh bills had ended before it
        value: K('late_report_share')
      - when: otherwise
        value: '1'
      baseline:
        nr_reporting_share: '1'
      evidence:
      - history
      - cross_category
      cross_difficulty: service
    baseline:
      rule: 'Under the standard method the non-registering backbill covers whole regular bills of the service agreement: counting back from the non-registering test date, the most recent regular bills whose billing period ended on or before that date, as many as one half of the whole calendar months between the later of the meter''s installation date and the test date of its latest within-tolerance result and the non-registering test date, rounded down, and never more than the meter type''s backbill_max_months. Under the standard method the usage of each covered bill is taken from the regular bill of the same billing month one year earlier, so that the charges the non-registering backbill recovers are the energy, Power Supply Cost Recovery and demand charges of those prior-year bills, as billed, minus the energy and Power Supply Cost Recovery charges already billed on the covered bills. Under the standard method the overdue-test share and the reporting share are both 1. The non-registering
        backbill is the recovered charges multiplied first by the overdue-test share and then by the reporting share, rounded to the cent once at the end, and a non-registering backbill smaller than the meter type''s adjustment_threshold_usd is recorded as 0.00.'
      params:
      - backbill_max_months
      - adjustment_threshold_usd
    inputs:
      history:
      - table: meter_tests
        aggregate: latest
        field: test_date
        filters:
          event_type: meter_test_result
      - category: service
        table: service_bills
        aggregate: count
        field: bill_id
        filters:
          bill_kind: regular
          kwh_total: 0
      - category: service
        table: service_bills
        aggregate: sum
        field: energy_charge_amount
        filters:
          bill_kind: regular
      cross_category:
      - service
