# Net Energy Metering — the interconnection agreement and export-credit rider for customer-owned
# renewable generation on a service agreement: application and interconnection review,
# permission to operate, monthly export credits banked in dollars, credits applied against
# energy charges, the annual true-up, and modification, transfer or termination of the system.

category: nem
display_name: Net Energy Metering

binding:
  holding_table: nem_agreements
  event_tables: [nem_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {credit_bank_balance: nem_credit_bank}

lifecycle:
  states: [applied, approved, operating, rejected, withdrawn, expired, terminated]
  transitions:
    - {from: applied, to: approved, by: system, means: Interconnection review finds the system eligible and technically acceptable.}
    - {from: applied, to: rejected, by: system, means: Interconnection review finds the application ineligible or it was not completed in time.}
    - {from: applied, to: withdrawn, by: user, means: The customer withdraws the application before approval.}
    - {from: approved, to: withdrawn, by: user, means: The customer withdraws an approved application before the system operates.}
    - {from: approved, to: expired, by: system, means: Permission to operate was not obtained within the approval validity period.}
    - {from: approved, to: operating, by: system, means: Permission to operate is issued after inspection and installation of a bidirectional meter.}
    - {from: operating, to: terminated, by: user, means: The customer ends the agreement or stops service at the address and the bank is settled.}

accounts:
  - key: nem_credit_bank
    unit: USD
    meaning: Dollar value of export credits banked under the agreement — raised by monthly export credits, lowered by credits applied to bills, true-up payouts and forfeitures.

parameter_schema:
  open_to_new_applications: Whether new applications are accepted under the rider (true/false).
  legacy_closed_date: Date after which the rider stopped accepting applications, or not applicable.
  grandfathering_years: Years after permission to operate during which the agreement keeps the rider's credit terms.
  min_system_kw_ac: Smallest system nameplate capacity accepted, kW AC.
  max_system_kw_ac: Largest system nameplate capacity accepted, kW AC.
  size_cap_pct_of_annual_usage: Largest expected annual output as a fraction of the address's annual usage, decimal.
  production_factor_kwh_per_kw: Expected annual output per kW AC used for the size cap, kWh per kW.
  eligible_generator_types: Generator types accepted under the rider.
  storage_allowed: Whether a battery may be paired with the system (true/false).
  max_storage_kwh: Largest paired battery capacity, kWh; 0 when storage is not allowed.
  storage_grid_charging_export_allowed: Whether energy charged into the battery from the grid may be exported for credit (true/false).
  interconnection_level: Interconnection review level applied to systems under the rider.
  application_fee_usd: Fixed interconnection application fee, USD.
  application_fee_per_kw_usd: Additional application fee per kW AC of nameplate capacity, USD per kW.
  application_completeness_business_days: Business days the applicant has to complete a deficient application before it is rejected.
  review_business_days: Business days within which the company completes interconnection review of a complete application.
  liability_insurance_min_usd: Minimum general liability insurance the applicant must certify, USD; 0 means none required.
  external_disconnect_switch_required: Whether a lockable external disconnect switch is required (true/false).
  inspection_required: Whether a company witness inspection precedes permission to operate (true/false).
  approval_validity_months: Months after approval within which the system must receive permission to operate.
  pto_after_inspection_business_days: Business days after a passed inspection (or the installation notice where no inspection is required) within which permission to operate is issued.
  bidirectional_meter_required: Whether a bidirectional meter must be in service before permission to operate (true/false).
  credit_basis: How exported kWh are valued, enum retail_energy_rate, retail_energy_rate_less_nbc or avoided_cost_export_rate.
  nonbypassable_charge_usd_kwh: Non-bypassable charge deducted from the retail rate for each exported kWh where the basis is retail_energy_rate_less_nbc, USD per kWh, 5 decimals.
  export_rate_on_peak_usd_kwh: Avoided-cost export rate for on-peak exports where the basis is avoided_cost_export_rate, USD per kWh, 5 decimals; 0.00000 for retail-based riders.
  export_rate_off_peak_usd_kwh: Avoided-cost export rate for off-peak exports where the basis is avoided_cost_export_rate, USD per kWh, 5 decimals; 0.00000 for retail-based riders.
  export_on_peak_window: Hours whose exports count as on-peak for valuing export credits.
  export_rate_lock_years: Years after permission to operate during which the avoided-cost export rates stay fixed; 0 for retail-based riders.
  export_credit_rounding_rule: How export credit amounts are rounded.
  credit_applies_to: Which bill charges banked credits may offset.
  monthly_carryover: Whether unused credits carry to the next bill within the true-up period (true/false).
  true_up_period_months: Months in one true-up period.
  true_up_month_basis: How the true-up month is fixed.
  true_up_disposition: What happens to the bank at each true-up, enum cash_out, carry_forward or forfeit.
  termination_disposition: What happens to the bank when the agreement terminates, enum cash_out or forfeit.
  payout_minimum_check_usd: Smallest payout sent by check; smaller payouts are credited to the service agreement, USD.
  grid_access_charge_usd_per_kw: Monthly grid access charge per kW AC of nameplate capacity, USD per kW; 0.00 means none.
  modification_increase_without_reapplication_pct: Largest capacity increase, as a fraction of approved capacity, allowed through a modification instead of a new application.
  modification_loses_grandfathering: Whether any capacity increase moves the agreement off the rider to the rider open for new applications (true/false).
  transfer_on_sale_allowed: Whether the agreement transfers to a new owner of the premise who starts service at the address (true/false).
  bank_disposition_on_sale: What happens to the seller's bank when the agreement transfers on sale.
  aggregation_allowed: Whether credits may offset charges on other service agreements of the same customer (true/false).
  aggregation_max_accounts: Most additional service agreements that may be aggregated; 0 when aggregation is not allowed.
  aggregation_contiguity_rule: Which other service agreements may be aggregated.
  aggregation_allocation_basis: How credits are shared among aggregated service agreements.
  estimated_export_rule: How exports are determined for a bill with an estimated read.
  customer_type_eligible: Customer class eligible for the rider.
  annual_usage_lookback_billing_periods: Number of most recent regular bills summed to obtain annual usage for the size cap.
  new_construction_usage_basis: Annual usage assumed for the size cap when the address has fewer bills than the look-back, kWh per kW of service capacity or stated load estimate.

