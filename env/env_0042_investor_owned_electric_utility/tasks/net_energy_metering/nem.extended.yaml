events:
  # ---- holding (nem_agreements) ---------------------------------------------------
  - type: nem_application
    target: nem_agreements
    mutation: create
    meaning: The customer applies to interconnect a renewable generating system under a net metering rider.
    grain: One row per interconnection application.
    fields:
      customer_id: Customer of record on the service agreement.
      service_account_id: Service agreement whose premise hosts the system.
      variant_name: Rider applied for, official full name.
      application_date: Date the application was received.
      system_capacity_kw_ac: Nameplate inverter capacity of the system, kW AC.
      generator_type: Generator technology.
      storage_capacity_kwh: Paired battery capacity, kWh; 0 when none.
      status_date: Date of the application.
    triggers:
      - event: nem:nem_application_fee
        map: {fee_date: application_date}
  - type: nem_approval
    target: nem_agreements
    mutation: {transition: {from: applied, to: approved}}
    meaning: Interconnection review approves the application.
    grain: One row per transaction.
    fields:
      approval_date: Date of approval.
      status_date: Date of approval.
    triggers: []
  - type: nem_rejection
    target: nem_agreements
    mutation: {transition: {from: applied, to: rejected}}
    meaning: Interconnection review rejects the application.
    grain: One row per transaction.
    fields:
      rejection_reason: Why the application was rejected.
      status_date: Date of rejection.
    triggers: []
  - type: nem_withdrawal
    target: nem_agreements
    mutation: {transition: [{from: applied, to: withdrawn}, {from: approved, to: withdrawn}]}
    meaning: The customer withdraws the application before the system operates.
    grain: One row per transaction.
    fields:
      status_date: Date of withdrawal.
    triggers: []
  - type: nem_approval_expiry
    target: nem_agreements
    mutation: {transition: {from: approved, to: expired}}
    meaning: An approval lapses because permission to operate was not obtained in time.
    grain: One row per transaction.
    fields:
      status_date: Day after the approval validity period ended.
    triggers: []
  - type: nem_permission_to_operate
    target: nem_agreements
    mutation: {transition: {from: approved, to: operating}}
    meaning: Permission to operate is issued and the system may export under the rider.
    grain: One row per transaction.
    fields:
      permission_to_operate_date: Date permission to operate was issued.
      true_up_month: Calendar month of the annual true-up.
      status_date: Date permission to operate was issued.
    triggers: []
  - type: nem_termination
    target: nem_agreements
    mutation: {transition: {from: operating, to: terminated}}
    meaning: The agreement ends and the credit bank is settled under the termination disposition.
    grain: One row per transaction.
    fields:
      status_date: Date of termination.
    triggers: []
  - type: nem_system_modification
    target: nem_agreements
    mutation: update
    meaning: The approved system capacity or paired storage of an operating agreement is changed within the modification limit.
    grain: One row per transaction.
    fields:
      system_capacity_kw_ac: New nameplate capacity, kW AC.
      storage_capacity_kwh: New paired battery capacity, kWh.
    triggers: []
  - type: nem_ownership_transfer
    target: nem_agreements
    mutation: update
    meaning: An operating agreement moves to the new owner of the premise who has started service at the address.
    grain: One row per transaction.
    fields:
      customer_id: The new owner's customer profile.
      service_account_id: The new owner's service agreement at the same address.
    triggers: []
  # ---- ledger (nem_ledger) ----------------------------------------------------------
  - type: nem_application_fee
    target: nem_ledger
    meaning: The interconnection application fee is charged to the service agreement.
    grain: One row per application.
    distinguish_by: [fee_date]
    fields:
      fee_date: Date the fee was charged (the application date).
      amount: Fee amount.
    triggers:
      - event: service:service_program_debit
        map: {posting_date: fee_date, amount: amount, charge_code: nem_application_fee, source_reference_id: nem_ledger_id}
  - type: nem_grid_access_charge
    target: nem_ledger
    meaning: The monthly grid access charge of a net billing rider is charged for one billing period.
    grain: One row per billing period of an operating agreement on a rider with a grid access charge.
    distinguish_by: [billing_period_end]
    fields:
      billing_period_end: Billing period the charge applies to.
      amount: Charge amount.
    triggers:
      - event: service:service_program_debit
        map: {posting_date: billing_period_end, amount: amount, charge_code: nem_grid_access_charge, source_reference_id: nem_ledger_id}
  - type: nem_export_credit
    target: nem_ledger
    meaning: Energy exported to the grid during one billing period is valued and banked.
    grain: One row per billing period of an operating agreement.
    distinguish_by: [billing_period_end]
    fields:
      billing_period_end: Billing period the exports belong to.
      export_kwh_on_peak: kWh exported during the rider's export on-peak window.
      export_kwh_off_peak: kWh exported during all other hours.
      credit_rate_on_peak: Rate applied to on-peak exports, USD per kWh.
      credit_rate_off_peak: Rate applied to off-peak exports, USD per kWh.
      amount: Export credit banked.
    account: nem_credit_bank
    direction: in
    triggers: []
  - type: nem_credit_application
    target: nem_ledger
    meaning: Banked credit is applied against the offsettable charges of one bill.
    grain: One row per bill (per service agreement for aggregated riders).
    distinguish_by: [bill_id]
    fields:
      billing_period_end: Billing period of the bill offset.
      bill_id: The service bill offset.
      amount: Credit applied.
    account: nem_credit_bank
    direction: out
    triggers:
      - event: service:service_program_credit
        map: {posting_date: billing_period_end, amount: amount, credit_code: nem_credit_applied, source_reference_id: nem_ledger_id}
  - type: nem_true_up_payout
    target: nem_ledger
    meaning: The residual bank is paid out at a true-up or termination.
    grain: One row per settlement paid out.
    distinguish_by: [settlement_date, settlement_kind]
    fields:
      settlement_date: Date of the settlement.
      settlement_kind: Anniversary true-up or termination.
      payout_method: Check or credit to the service agreement.
      amount: Amount paid out.
    account: nem_credit_bank
    direction: out
    triggers:
      - event: service:service_program_credit
        when: {payout_method: bill_credit}
        map: {posting_date: settlement_date, amount: amount, credit_code: nem_true_up_credit, source_reference_id: nem_ledger_id}
  - type: nem_true_up_forfeiture
    target: nem_ledger
    meaning: The residual bank is forfeited at a true-up or termination.
    grain: One row per settlement forfeited.
    distinguish_by: [settlement_date, settlement_kind]
    fields:
      settlement_date: Date of the settlement.
      settlement_kind: Anniversary true-up or termination.
      amount: Amount forfeited.
    account: nem_credit_bank
    direction: out
    triggers: []

measures:
  - id: nem_msr_annual_usage_kwh
    window: The annual_usage_lookback_billing_periods most recent regular bills of the service agreement before the application date.
    measure: Sum of kwh_total of those service_bill_issued rows; when fewer bills exist, the customer's stated annual load estimate is used.
  - id: nem_msr_bill_offsettable_charges
    window: One service bill.
    measure: The bill's energy_charge_amount plus rider_charge_amount, less any nem_credit_application already posted against that bill.
  - id: nem_msr_aggregated_agreements
    window: The customer's portfolio on the handling date.
    measure: Count of the customer's other service agreements in active or notice_pending status that meet aggregation_contiguity_rule.
  - id: nem_msr_bank_at_settlement
    window: The agreement's whole life up to the settlement date, inclusive of credit applied on bills dated that day.
    measure: The credit_bank_balance after every export credit and credit application dated on or before the settlement date.

policies:
  - id: nem_agg_multi_holding
    subject: [nem_application]
    rule: >-
      A customer may hold net metering agreements at several service agreements, one per service agreement.
      No other net metering agreement on the same service agreement is in applied, approved or operating
      status. A second system at the same premise is added by modification or by a new application after the
      first agreement terminates.
    eligibility:
      - id: one_open_agreement_per_service
        applies_to: [nem_application]
        kind: dedup
        condition: "No other net metering agreement on the same service agreement is in applied, approved or operating status."
        evidence_fields: [nem_agreements.service_account_id, nem_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_agreements.service_account_id]
          action_bindings:
            nem_agreements.service_account_id: service_account_id
        dedup_contract:
          table: nem_agreements
          mode: separate_record
          object_bindings: {service_account_id: service_account_id}
          duplicate_filters: {status: [applied, approved, operating]}
          distinct_fields: [application_date]
    params:
      max_per_customer: null

  - id: nem_agg_aggregated_allocation
    subject: [nem_credit_application]
    rule: >-
      Under a rider whose aggregation_allowed is true, banked credit offsets the offsettable charges of the
      generating service agreement first and then of the other aggregated service agreements of the same
      customer, up to aggregation_max_accounts of them, in the order of aggregation_allocation_basis, each up
      to nem_msr_bill_offsettable_charges of its bill for the same billing period. Agreements of another
      customer, agreements outside aggregation_contiguity_rule and closed agreements never receive credit.
      Under every other rider credit offsets only the generating service agreement.
    eligibility: []
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {aggregation: "=aggregation_allowed", max_accounts: "=aggregation_max_accounts"}
        Rider NEM-R Residential Net Energy Metering: {aggregation: "=aggregation_allowed", max_accounts: "=aggregation_max_accounts"}
        Rider NBT-R Residential Net Billing Tariff: {aggregation: "=aggregation_allowed", max_accounts: "=aggregation_max_accounts"}
        Rider NBT-C Commercial Net Billing Tariff: {aggregation: "=aggregation_allowed", max_accounts: "=aggregation_max_accounts"}
        Rider NEM-A Aggregated Net Energy Metering: {aggregation: "=aggregation_allowed", max_accounts: "=aggregation_max_accounts"}
        Rider NBT-L Large Customer Net Billing Tariff: {aggregation: "=aggregation_allowed", max_accounts: "=aggregation_max_accounts"}
    measures: [nem_msr_aggregated_agreements, nem_msr_bill_offsettable_charges]

  - id: nem_application_eligibility
    subject: [nem_application]
    rule: >-
      An application is accepted only under a rider whose open_to_new_applications is true and whose
      customer_type_eligible and entry requirements the customer and service agreement meet. Applications are
      accepted only for a service agreement in active status. The system capacity, generator type and battery
      capacity are taken from the customer's installer design as the customer states them. The capacity must
      lie between min_system_kw_ac and max_system_kw_ac, and capacity times production_factor_kwh_per_kw may not
      exceed size_cap_pct_of_annual_usage times nem_msr_annual_usage_kwh. A paired battery is accepted only
      where storage_allowed is true and up to max_storage_kwh. The service agreement may not hold a
      Non-Communicating Opt-Out Meter in service, because net metering requires a bidirectional communicating
      meter; a customer who wants net metering must first return to a communicating meter. Rider NEM-L
      Legacy Net Energy Metering accepts no new applications; an existing legacy agreement keeps its terms for
      grandfathering_years after permission to operate unless modification_loses_grandfathering applies.
    eligibility:
      - id: active_service_agreement
        applies_to: [nem_application]
        kind: state
        condition: "Applications are accepted only for a service agreement in active status."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active]
      - id: installer_design_stated
        applies_to: [nem_application]
        kind: caller_fact
        condition: "The system capacity, generator type and battery capacity are taken from the customer's installer design as the customer states them."
        evidence_fields: [nem_agreements.system_capacity_kw_ac, nem_agreements.service_account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [nem_agreements.service_account_id]
          action_bindings:
            nem_agreements.service_account_id: service_account_id
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {open: "=open_to_new_applications", min_kw: "=min_system_kw_ac", max_kw: "=max_system_kw_ac", size_cap: "=size_cap_pct_of_annual_usage", max_storage: "=max_storage_kwh"}
        Rider NEM-R Residential Net Energy Metering: {open: "=open_to_new_applications", min_kw: "=min_system_kw_ac", max_kw: "=max_system_kw_ac", size_cap: "=size_cap_pct_of_annual_usage", max_storage: "=max_storage_kwh"}
        Rider NBT-R Residential Net Billing Tariff: {open: "=open_to_new_applications", min_kw: "=min_system_kw_ac", max_kw: "=max_system_kw_ac", size_cap: "=size_cap_pct_of_annual_usage", max_storage: "=max_storage_kwh"}
        Rider NBT-C Commercial Net Billing Tariff: {open: "=open_to_new_applications", min_kw: "=min_system_kw_ac", max_kw: "=max_system_kw_ac", size_cap: "=size_cap_pct_of_annual_usage", max_storage: "=max_storage_kwh"}
        Rider NEM-A Aggregated Net Energy Metering: {open: "=open_to_new_applications", min_kw: "=min_system_kw_ac", max_kw: "=max_system_kw_ac", size_cap: "=size_cap_pct_of_annual_usage", max_storage: "=max_storage_kwh"}
        Rider NBT-L Large Customer Net Billing Tariff: {open: "=open_to_new_applications", min_kw: "=min_system_kw_ac", max_kw: "=max_system_kw_ac", size_cap: "=size_cap_pct_of_annual_usage", max_storage: "=max_storage_kwh"}
    formula:
      within_size_cap: "system_capacity_kw_ac * production_factor_kwh_per_kw <= size_cap_pct_of_annual_usage * nem_msr_annual_usage_kwh"
    measures: [nem_msr_annual_usage_kwh]

  - id: nem_application_fee_rule
    subject: [nem_application_fee]
    rule: >-
      Each application is charged application_fee_usd plus application_fee_per_kw_usd times the system
      capacity, rounded to the cent, on the application date. The fee is charged once per application and is
      not refunded on rejection, withdrawal or expiry. A modification within the modification limit carries no
      application fee.
    eligibility:
      - id: fee_once_per_application
        applies_to: [nem_application_fee]
        kind: dedup
        condition: "The fee is charged once per application and is not refunded on rejection, withdrawal or expiry."
        evidence_fields: [nem_ledger.nem_agreement_id, nem_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_ledger.nem_agreement_id]
          action_bindings:
            nem_ledger.nem_agreement_id: nem_agreement_id
        dedup_contract:
          table: nem_ledger
          mode: separate_record
          object_bindings: {nem_agreement_id: nem_agreement_id}
          duplicate_filters: {event_type: [nem_application_fee]}
          distinct_fields: []
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {fee: "=application_fee_usd", per_kw: "=application_fee_per_kw_usd"}
        Rider NEM-R Residential Net Energy Metering: {fee: "=application_fee_usd", per_kw: "=application_fee_per_kw_usd"}
        Rider NBT-R Residential Net Billing Tariff: {fee: "=application_fee_usd", per_kw: "=application_fee_per_kw_usd"}
        Rider NBT-C Commercial Net Billing Tariff: {fee: "=application_fee_usd", per_kw: "=application_fee_per_kw_usd"}
        Rider NEM-A Aggregated Net Energy Metering: {fee: "=application_fee_usd", per_kw: "=application_fee_per_kw_usd"}
        Rider NBT-L Large Customer Net Billing Tariff: {fee: "=application_fee_usd", per_kw: "=application_fee_per_kw_usd"}
    formula:
      amount: "round(application_fee_usd + application_fee_per_kw_usd * system_capacity_kw_ac, 2)"

  - id: nem_review_and_permission
    subject: [nem_approval, nem_rejection, nem_permission_to_operate, nem_approval_expiry, nem_withdrawal]
    rule: >-
      A complete application is reviewed within review_business_days business days. A deficient application
      not completed within application_completeness_business_days business days of the deficiency notice is
      rejected with rejection_reason incomplete_application; an application outside the size, type or rider
      limits is rejected with the matching reason. Applicants under riders with a liability insurance minimum
      or an external disconnect switch requirement must certify both before approval. Permission to operate
      requires a bidirectional meter in service at the address and, where inspection_required is true, a passed
      inspection. Permission to operate may be issued only no later than the approval validity period after
      the approval date. The period is counted in calendar months from the approval date, ending on the same
      day of the month approval_validity_months later or on the last day of a shorter month, and that last day
      is still in time. An approval not followed by permission to operate in time expires on the next day, and
      the customer must apply again under the rider then open. The true-up month is the calendar month of the
      permission to operate date. The customer may withdraw an application in applied or approved status at any
      time; withdrawal is the customer's own decision.
    eligibility:
      - id: pto_within_validity
        applies_to: [nem_permission_to_operate]
        kind: time
        condition: "Permission to operate may be issued only no later than the approval validity period after the approval date."
        evidence_fields: [nem_agreements.approval_date, nem_agreements.nem_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_agreements.nem_agreement_id]
          action_bindings:
            nem_agreements.nem_agreement_id: nem_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the approval date
          anchor_source: nem_agreements.approval_date
          relation: not_after
          duration_source: variants.approval_validity_months
          unit: calendar_months
          counting_rule: "The period is counted in calendar months from the approval date, ending on the same day of the month approval_validity_months later or on the last day of a shorter month, and that last day is still in time."
          boundary: inclusive
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {review_days: "=review_business_days", validity_months: "=approval_validity_months", inspection: "=inspection_required"}
        Rider NEM-R Residential Net Energy Metering: {review_days: "=review_business_days", validity_months: "=approval_validity_months", inspection: "=inspection_required"}
        Rider NBT-R Residential Net Billing Tariff: {review_days: "=review_business_days", validity_months: "=approval_validity_months", inspection: "=inspection_required"}
        Rider NBT-C Commercial Net Billing Tariff: {review_days: "=review_business_days", validity_months: "=approval_validity_months", inspection: "=inspection_required"}
        Rider NEM-A Aggregated Net Energy Metering: {review_days: "=review_business_days", validity_months: "=approval_validity_months", inspection: "=inspection_required"}
        Rider NBT-L Large Customer Net Billing Tariff: {review_days: "=review_business_days", validity_months: "=approval_validity_months", inspection: "=inspection_required"}

  - id: nem_export_credit_calculation
    subject: [nem_export_credit]
    rule: >-
      Each billing period of an operating agreement banks one export credit. Exported kWh are split into
      on-peak and off-peak exports under the rider's export_on_peak_window. Under credit_basis retail_energy_rate each kWh is valued at the service schedule's energy
      rate for the same season and period; under retail_energy_rate_less_nbc that rate less
      nonbypassable_charge_usd_kwh; under avoided_cost_export_rate at the rider's export_rate_on_peak_usd_kwh
      or export_rate_off_peak_usd_kwh. The rates used are recorded on the credit and the amount is rounded to
      the cent. Export credits are banked only for an agreement in operating status, and energy exported from a
      battery charged from the grid earns no credit where storage_grid_charging_export_allowed is false.
    eligibility:
      - id: credit_operating_only
        applies_to: [nem_export_credit]
        kind: state
        condition: "Export credits are banked only for an agreement in operating status, and energy exported from a battery charged from the grid earns no credit where storage_grid_charging_export_allowed is false."
        evidence_fields: [nem_agreements.status, nem_agreements.nem_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_agreements.nem_agreement_id]
          action_bindings:
            nem_agreements.nem_agreement_id: nem_agreement_id
        state_contract:
          field: nem_agreements.status
          allowed: [operating]
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {basis: "=credit_basis", nbc: "=nonbypassable_charge_usd_kwh", export_on_peak: "=export_rate_on_peak_usd_kwh", export_off_peak: "=export_rate_off_peak_usd_kwh"}
        Rider NEM-R Residential Net Energy Metering: {basis: "=credit_basis", nbc: "=nonbypassable_charge_usd_kwh", export_on_peak: "=export_rate_on_peak_usd_kwh", export_off_peak: "=export_rate_off_peak_usd_kwh"}
        Rider NBT-R Residential Net Billing Tariff: {basis: "=credit_basis", nbc: "=nonbypassable_charge_usd_kwh", export_on_peak: "=export_rate_on_peak_usd_kwh", export_off_peak: "=export_rate_off_peak_usd_kwh"}
        Rider NBT-C Commercial Net Billing Tariff: {basis: "=credit_basis", nbc: "=nonbypassable_charge_usd_kwh", export_on_peak: "=export_rate_on_peak_usd_kwh", export_off_peak: "=export_rate_off_peak_usd_kwh"}
        Rider NEM-A Aggregated Net Energy Metering: {basis: "=credit_basis", nbc: "=nonbypassable_charge_usd_kwh", export_on_peak: "=export_rate_on_peak_usd_kwh", export_off_peak: "=export_rate_off_peak_usd_kwh"}
        Rider NBT-L Large Customer Net Billing Tariff: {basis: "=credit_basis", nbc: "=nonbypassable_charge_usd_kwh", export_on_peak: "=export_rate_on_peak_usd_kwh", export_off_peak: "=export_rate_off_peak_usd_kwh"}
    formula:
      amount: "round(export_kwh_on_peak * credit_rate_on_peak + export_kwh_off_peak * credit_rate_off_peak, 2)"

  - id: nem_credit_application_rule
    subject: [nem_credit_application]
    rule: >-
      On each bill of an operating agreement, banked credit is applied up to nem_msr_bill_offsettable_charges
      of that bill, including the export credit banked for the same billing period. Credit never offsets the
      customer charge, demand charges, fees, program debits or past-due balances, and any unused bank carries to
      the next bill where monthly_carryover is true. Each bill is offset once.
    eligibility:
      - id: offset_each_bill_once
        applies_to: [nem_credit_application]
        kind: dedup
        condition: "Each bill is offset once."
        evidence_fields: [nem_ledger.bill_id, nem_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_ledger.bill_id]
          action_bindings:
            nem_ledger.bill_id: bill_id
        dedup_contract:
          table: nem_ledger
          mode: separate_record
          object_bindings: {bill_id: bill_id}
          duplicate_filters: {event_type: [nem_credit_application]}
          distinct_fields: []
    formula:
      amount: "min(credit_bank_balance, nem_msr_bill_offsettable_charges)"
    measures: [nem_msr_bill_offsettable_charges]

  - id: nem_true_up_rule
    subject: [nem_true_up_payout, nem_true_up_forfeiture]
    rule: >-
      At the bill dated in the true-up month, and when the agreement terminates, the residual bank
      (nem_msr_bank_at_settlement) is settled. At an anniversary true-up, cash_out pays the residual, carry_forward
      leaves it in the bank, and forfeit zeroes it. At termination the residual is settled under
      termination_disposition. A payout of at least payout_minimum_check_usd is paid by check; a smaller payout
      is credited to the service agreement. A residual of zero settles nothing. Each settlement date and kind is
      settled once, and a settlement is booked only for an agreement in operating or terminated status.
    eligibility:
      - id: settle_once
        applies_to: [nem_true_up_payout, nem_true_up_forfeiture]
        kind: state
        condition: "Each settlement date and kind is settled once, and a settlement is booked only for an agreement in operating or terminated status."
        evidence_fields: [nem_agreements.status, nem_agreements.nem_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_agreements.nem_agreement_id]
          action_bindings:
            nem_agreements.nem_agreement_id: nem_agreement_id
        state_contract:
          field: nem_agreements.status
          allowed: [operating, terminated]
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {true_up: "=true_up_disposition", termination: "=termination_disposition", check_minimum: "=payout_minimum_check_usd"}
        Rider NEM-R Residential Net Energy Metering: {true_up: "=true_up_disposition", termination: "=termination_disposition", check_minimum: "=payout_minimum_check_usd"}
        Rider NBT-R Residential Net Billing Tariff: {true_up: "=true_up_disposition", termination: "=termination_disposition", check_minimum: "=payout_minimum_check_usd"}
        Rider NBT-C Commercial Net Billing Tariff: {true_up: "=true_up_disposition", termination: "=termination_disposition", check_minimum: "=payout_minimum_check_usd"}
        Rider NEM-A Aggregated Net Energy Metering: {true_up: "=true_up_disposition", termination: "=termination_disposition", check_minimum: "=payout_minimum_check_usd"}
        Rider NBT-L Large Customer Net Billing Tariff: {true_up: "=true_up_disposition", termination: "=termination_disposition", check_minimum: "=payout_minimum_check_usd"}
    measures: [nem_msr_bank_at_settlement]

  - id: nem_grid_access_charge_rule
    subject: [nem_grid_access_charge]
    rule: >-
      Where grid_access_charge_usd_per_kw is above zero, every billing period of an operating agreement is
      charged grid_access_charge_usd_per_kw times system_capacity_kw_ac, rounded to the cent, dated the billing
      period end. The charge is never offset by banked credit. One charge is booked per billing period.
    eligibility:
      - id: one_charge_per_period
        applies_to: [nem_grid_access_charge]
        kind: dedup
        condition: "One charge is booked per billing period."
        evidence_fields: [nem_ledger.nem_agreement_id, nem_ledger.billing_period_end, nem_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_ledger.nem_agreement_id, nem_ledger.billing_period_end]
          action_bindings:
            nem_ledger.nem_agreement_id: nem_agreement_id
            nem_ledger.billing_period_end: billing_period_end
        dedup_contract:
          table: nem_ledger
          mode: separate_record
          object_bindings: {nem_agreement_id: nem_agreement_id, billing_period_end: billing_period_end}
          duplicate_filters: {event_type: [nem_grid_access_charge]}
          distinct_fields: []
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {per_kw: "=grid_access_charge_usd_per_kw"}
        Rider NEM-R Residential Net Energy Metering: {per_kw: "=grid_access_charge_usd_per_kw"}
        Rider NBT-R Residential Net Billing Tariff: {per_kw: "=grid_access_charge_usd_per_kw"}
        Rider NBT-C Commercial Net Billing Tariff: {per_kw: "=grid_access_charge_usd_per_kw"}
        Rider NEM-A Aggregated Net Energy Metering: {per_kw: "=grid_access_charge_usd_per_kw"}
        Rider NBT-L Large Customer Net Billing Tariff: {per_kw: "=grid_access_charge_usd_per_kw"}
    formula:
      amount: "round(grid_access_charge_usd_per_kw * system_capacity_kw_ac, 2)"

  - id: nem_modification_transfer_termination
    subject: [nem_system_modification, nem_ownership_transfer, nem_termination]
    rule: >-
      An operating agreement may increase its capacity by no more than
      modification_increase_without_reapplication_pct of the approved capacity through a modification, within
      the rider's size limits; a larger increase requires a new application under the rider then open, and under
      a rider whose modification_loses_grandfathering is true any increase does. Modifications are made only on
      an agreement in operating status. When the premise is sold and transfer_on_sale_allowed is true, the
      agreement moves to the buyer's service agreement at the same address once the buyer has started service;
      the seller's bank is settled under bank_disposition_on_sale before the move and the true-up month is
      unchanged. Termination is the customer's decision, or follows the closure of the service agreement when
      no transfer applies; the bank is then settled under termination_disposition.
    eligibility:
      - id: modify_operating_only
        applies_to: [nem_system_modification, nem_ownership_transfer]
        kind: state
        condition: "Modifications are made only on an agreement in operating status."
        evidence_fields: [nem_agreements.status, nem_agreements.nem_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [nem_agreements.nem_agreement_id]
          action_bindings:
            nem_agreements.nem_agreement_id: nem_agreement_id
        state_contract:
          field: nem_agreements.status
          allowed: [operating]
    params:
      per_tier:
        Rider NEM-L Legacy Net Energy Metering: {increase_limit: "=modification_increase_without_reapplication_pct", loses_grandfathering: "=modification_loses_grandfathering", transfer_on_sale: "=transfer_on_sale_allowed"}
        Rider NEM-R Residential Net Energy Metering: {increase_limit: "=modification_increase_without_reapplication_pct", loses_grandfathering: "=modification_loses_grandfathering", transfer_on_sale: "=transfer_on_sale_allowed"}
        Rider NBT-R Residential Net Billing Tariff: {increase_limit: "=modification_increase_without_reapplication_pct", loses_grandfathering: "=modification_loses_grandfathering", transfer_on_sale: "=transfer_on_sale_allowed"}
        Rider NBT-C Commercial Net Billing Tariff: {increase_limit: "=modification_increase_without_reapplication_pct", loses_grandfathering: "=modification_loses_grandfathering", transfer_on_sale: "=transfer_on_sale_allowed"}
        Rider NEM-A Aggregated Net Energy Metering: {increase_limit: "=modification_increase_without_reapplication_pct", loses_grandfathering: "=modification_loses_grandfathering", transfer_on_sale: "=transfer_on_sale_allowed"}
        Rider NBT-L Large Customer Net Billing Tariff: {increase_limit: "=modification_increase_without_reapplication_pct", loses_grandfathering: "=modification_loses_grandfathering", transfer_on_sale: "=transfer_on_sale_allowed"}

  - id: nem_program_interactions
    subject: [nem_application, nem_export_credit]
    rule: >-
      Holding a Non-Communicating Opt-Out Meter excludes net metering until the customer returns to a
      communicating meter. A battery enrolled in a demand response battery dispatch program may export during
      demand response events, and that export earns the normal export credit; the demand response incentive is
      paid separately and never reduces or replaces the export credit. Budget billing on the service agreement
      does not change export credits; credits applied to a bill reduce the actual charges that budget billing
      compares with its installment. A legacy agreement that loses grandfathering moves to the rider open for new
      applications for the customer's class.
    eligibility: []

extended_policies:
  - id: nem_ext_export_credit_revaluation
    base_policy_refs: [nem_export_credit_calculation, nem_program_interactions]
    overwrite:
      - base_policy: nem_export_credit_calculation
        superseded_clause: >-
          Under credit_basis retail_energy_rate each kWh is valued at the service schedule's energy rate for the same season and period; under retail_energy_rate_less_nbc that rate less nonbypassable_charge_usd_kwh;
        replaced_by: >-
          Each revalued rate is the seasonal energy rate this rule selects, plus the supply-cost component this rule selects, less the non-bypassable charge this rule selects, rounded to five decimals.
      - base_policy: nem_export_credit_calculation
        superseded_clause: >-
          Exported kWh are split into on-peak and off-peak exports under the rider's export_on_peak_window.
        replaced_by: >-
          when the schedule has on-peak hours and the closing read is a customer read, the on-peak export kWh are the recorded total export kWh times the customer-read on-peak share, rounded to a whole kWh, and the off-peak export kWh are the rest of the total
    trigger: state_due
    subject: [nem_export_credit]
    computes: revalued_credit_usd
    target_tool: revalue_export_credit_a4b62fb5
    params:
      customer_read_on_share: 0.22
      pscr_successor_share: 0.60
      nbc_full_months: 24
      nbc_phase_in_share: 0.50
    rule: >-
      This rule governs the revaluation of the most recent export credit banked under an agreement whose rider
      values exports at a retail rate (the legacy rider and the residential successor rider and the aggregated
      rider). An export credit banked for a billing period whose service bill was issued on an estimated closing read is never revalued; it is trued up at the next actual read, and its revalued export credit is the amount already recorded on it. When the per-kWh rates recorded on that export credit are not the rates this rule fixes, the credit is revalued: the revalued export credit and its two revalued rates replace the amount and the two
      rates recorded on that same export credit, the export kWh recorded on it stay as recorded, and the bank
      moves by the difference between the revalued export credit and the amount it replaces. The revalued
      export credit is the on-peak export kWh valued at the revalued on-peak rate plus the off-peak export kWh
      valued at the revalued off-peak rate, the sum rounded to the cent once. Each revalued rate is the seasonal
      energy rate this rule selects, plus the supply-cost component this rule selects, less the non-bypassable
      charge this rule selects, rounded to five decimals. The season of the export credit is the pricing season
      printed on the service bill whose billing period ends on the export credit's billing period end, and the
      schedule is the rate schedule of the service agreement hosting the system. Under the standard method of
      the revalued export credit every exported kWh is valued as off-peak, each revalued rate takes the
      schedule's winter energy rate (the winter on-peak rate for the on-peak rate, the winter off-peak rate for
      the off-peak rate), no supply-cost component is added and no non-bypassable charge is deducted. Seasonal
      energy rates of the revalued export credit: when the bill's season is summer and the schedule has on-peak
      hours, the revalued on-peak rate starts from the schedule's summer on-peak energy rate and the revalued
      off-peak rate from its summer off-peak energy rate; when the bill's season is summer and the schedule has
      no on-peak hours, both start from the schedule's summer off-peak energy rate, which is its single summer
      rate; otherwise both start from the schedule's winter energy rates. Time-of-use split of the revalued
      export credit: when the schedule has on-peak hours and the bill's closing read is not a customer read,
      the on-peak and off-peak export kWh are taken as recorded on the export credit; when the schedule has
      on-peak hours and the closing read is a customer read, the on-peak export kWh are the recorded total
      export kWh times the customer-read on-peak share, rounded to a whole kWh, and the off-peak export kWh are
      the rest of the total; otherwise every exported kWh is off-peak. Supply-cost component of the revalued
      export credit: under the legacy rider's retail energy rate basis the full Power Supply Cost Recovery
      rate of the schedule is added; under the retail-rate-less-non-bypassable-charge basis on a residential rider the Power Supply Cost Recovery rate times the successor supply share, rounded to five decimals, is added; otherwise, as for the aggregated business rider, nothing is added. Non-bypassable charge of the revalued export credit: under the
      retail-rate-less-non-bypassable-charge basis, when the whole calendar months from the permission to
      operate date to the export credit's billing period end are at least the full-charge month count, the
      rider's non-bypassable charge is deducted in full; under that basis, when those months are fewer than
      the full-charge month count, the rider's non-bypassable charge times the phase-in share, rounded to five
      decimals, is deducted; otherwise nothing is deducted. A revaluation is booked only for an agreement in
      operating status and changes no other export credit.
    baseline:
      rule: >-
        The revalued export credit is the on-peak export kWh valued at the revalued on-peak rate plus the
        off-peak export kWh valued at the revalued off-peak rate, the sum rounded to the cent once. Each
        revalued rate is the seasonal energy rate this rule selects, plus the supply-cost component this rule
        selects, less the non-bypassable charge this rule selects, rounded to five decimals. Under the standard
        method of the revalued export credit every exported kWh is valued as off-peak, each revalued rate takes
        the schedule's winter energy rate (the winter on-peak rate for the on-peak rate, the winter off-peak
        rate for the off-peak rate), no supply-cost component is added and no non-bypassable charge is
        deducted.
      params: []
    prerequisite: []
    cross_category:
      - category: service
        as: branch
        reads: [variant_name, service_bills.season, service_bills.read_type, service_bills.billing_period_end]
        note: The schedule's seasonal energy rates, on-peak hours and Power Supply Cost Recovery rate, and the bill's season and read type, decide the seasonal-rate, split and supply-cost factors.
    inputs:
      history:
        - {table: nem_ledger, aggregate: sum, field: export_kwh_on_peak, filters: {event_type: nem_export_credit}}
        - {table: nem_ledger, aggregate: sum, field: export_kwh_off_peak, filters: {event_type: nem_export_credit}}
        - {category: service, table: service_bills, aggregate: latest, field: season, filters: {}}
        - {category: service, table: service_bills, aggregate: latest, field: read_type, filters: {}}
      cross_category: [service]
    compute:
      - xr_end: "LATEST('nem_ledger', 'billing_period_end', date_field='billing_period_end', event_type='nem_export_credit')"
      - xr_on_rec: "SUM('nem_ledger', 'export_kwh_on_peak', event_type='nem_export_credit', billing_period_end=xr_end)"
      - xr_off_rec: "SUM('nem_ledger', 'export_kwh_off_peak', event_type='nem_export_credit', billing_period_end=xr_end)"
      - xr_summer: "XLATEST('service', 'service_bills', 'season', date_field='bill_date', service_account_id=F('service_account_id'), billing_period_end=xr_end) == 'summer'"
      - xr_read: "XLATEST('service', 'service_bills', 'read_type', date_field='bill_date', service_account_id=F('service_account_id'), billing_period_end=xr_end)"
      - xr_tou: "CPARAM('service', 'on_peak_hours', service_account_id=F('service_account_id')) != 'none'"
      - xr_energy_on: "CPARAM('service', 'energy_rate_summer_on_peak_usd_kwh', service_account_id=F('service_account_id')) if (xr_summer and xr_tou) else (CPARAM('service', 'energy_rate_summer_off_peak_usd_kwh', service_account_id=F('service_account_id')) if (xr_summer and not xr_tou) else CPARAM('service', 'energy_rate_winter_on_peak_usd_kwh', service_account_id=F('service_account_id')))"
      - xr_energy_off: "CPARAM('service', 'energy_rate_summer_off_peak_usd_kwh', service_account_id=F('service_account_id')) if (xr_summer and xr_tou) else (CPARAM('service', 'energy_rate_summer_off_peak_usd_kwh', service_account_id=F('service_account_id')) if (xr_summer and not xr_tou) else CPARAM('service', 'energy_rate_winter_off_peak_usd_kwh', service_account_id=F('service_account_id')))"
      - xr_on_kwh: "xr_on_rec if (xr_tou and xr_read != 'customer_read') else (RND((xr_on_rec + xr_off_rec) * K('customer_read_on_share'), 0) if (xr_tou and xr_read == 'customer_read') else 0)"
      - xr_off_kwh: "xr_on_rec + xr_off_rec - xr_on_kwh"
      - xr_pscr: "CPARAM('service', 'power_supply_adjustment_usd_kwh', service_account_id=F('service_account_id')) if P('credit_basis') == 'retail_energy_rate' else (RND(CPARAM('service', 'power_supply_adjustment_usd_kwh', service_account_id=F('service_account_id')) * K('pscr_successor_share'), 5) if (P('credit_basis') == 'retail_energy_rate_less_nbc' and P('customer_type_eligible') == 'residential') else 0)"
      - xr_months_operating: "MONTHS(F('permission_to_operate_date'), xr_end)"
      - xr_nbc: "P('nonbypassable_charge_usd_kwh') if (P('credit_basis') == 'retail_energy_rate_less_nbc' and xr_months_operating >= K('nbc_full_months')) else (RND(P('nonbypassable_charge_usd_kwh') * K('nbc_phase_in_share'), 5) if (P('credit_basis') == 'retail_energy_rate_less_nbc' and xr_months_operating < K('nbc_full_months')) else 0)"
      - xr_rate_on: "RND(xr_energy_on + xr_pscr - xr_nbc, 5)"
      - xr_rate_off: "RND(xr_energy_off + xr_pscr - xr_nbc, 5)"
      - xr_recorded: "SUM('nem_ledger', 'amount', event_type='nem_export_credit', billing_period_end=xr_end)"
      - result: "xr_recorded if xr_read == 'estimated' else RND(xr_on_kwh * xr_rate_on + xr_off_kwh * xr_rate_off, 2)"
    compute_basis:
      xr_recorded: "An export credit banked for a billing period whose service bill was issued on an estimated closing read is never revalued; it is trued up at the next actual read, and its revalued export credit is the amount already recorded on it."
      xr_end: "This rule governs the revaluation of the most recent export credit banked under an agreement whose rider values exports at a retail rate"
      xr_on_rec: "the export kWh recorded on it stay as recorded"
      xr_off_rec: "the export kWh recorded on it stay as recorded"
      xr_summer: "The season of the export credit is the pricing season printed on the service bill whose billing period ends on the export credit's billing period end"
      xr_read: "when the schedule has on-peak hours and the bill's closing read is not a customer read"
      xr_tou: "the schedule is the rate schedule of the service agreement hosting the system"
      xr_energy_on: "when the bill's season is summer and the schedule has on-peak hours, the revalued on-peak rate starts from the schedule's summer on-peak energy rate and the revalued off-peak rate from its summer off-peak energy rate; when the bill's season is summer and the schedule has no on-peak hours, both start from the schedule's summer off-peak energy rate, which is its single summer rate; otherwise both start from the schedule's winter energy rates."
      xr_energy_off: "when the bill's season is summer and the schedule has on-peak hours, the revalued on-peak rate starts from the schedule's summer on-peak energy rate and the revalued off-peak rate from its summer off-peak energy rate; when the bill's season is summer and the schedule has no on-peak hours, both start from the schedule's summer off-peak energy rate, which is its single summer rate; otherwise both start from the schedule's winter energy rates."
      xr_on_kwh: "when the schedule has on-peak hours and the bill's closing read is not a customer read, the on-peak and off-peak export kWh are taken as recorded on the export credit; when the schedule has on-peak hours and the closing read is a customer read, the on-peak export kWh are the recorded total export kWh times the customer-read on-peak share, rounded to a whole kWh, and the off-peak export kWh are the rest of the total; otherwise every exported kWh is off-peak."
      xr_off_kwh: "the off-peak export kWh are the rest of the total"
      xr_pscr: "under the legacy rider's retail energy rate basis the full Power Supply Cost Recovery rate of the schedule is added; under the retail-rate-less-non-bypassable-charge basis on a residential rider the Power Supply Cost Recovery rate times the successor supply share, rounded to five decimals, is added; otherwise, as for the aggregated business rider, nothing is added."
      xr_months_operating: "the whole calendar months from the permission to operate date to the export credit's billing period end"
      xr_nbc: "when the whole calendar months from the permission to operate date to the export credit's billing period end are at least the full-charge month count, the rider's non-bypassable charge is deducted in full; under that basis, when those months are fewer than the full-charge month count, the rider's non-bypassable charge times the phase-in share, rounded to five decimals, is deducted; otherwise nothing is deducted."
      xr_rate_on: "Each revalued rate is the seasonal energy rate this rule selects, plus the supply-cost component this rule selects, less the non-bypassable charge this rule selects, rounded to five decimals."
      xr_rate_off: "Each revalued rate is the seasonal energy rate this rule selects, plus the supply-cost component this rule selects, less the non-bypassable charge this rule selects, rounded to five decimals."
      result: "The revalued export credit is the on-peak export kWh valued at the revalued on-peak rate plus the off-peak export kWh valued at the revalued off-peak rate, the sum rounded to the cent once."
    factors:
      - id: seasonal_energy_rates
        effect: parameter
        decides: xr_energy_on
        bindings: [xr_summer, xr_tou, xr_energy_on, xr_energy_off]
        ladder:
          - when: "the bill's season is summer and the schedule has on-peak hours"
            value: "the schedule's summer on-peak and summer off-peak energy rates"
          - when: "the bill's season is summer and the schedule has no on-peak hours"
            value: "the schedule's single summer energy rate for both"
          - when: "otherwise"
            value: "the schedule's winter on-peak and winter off-peak energy rates"
        baseline:
          xr_energy_on: "CPARAM('service', 'energy_rate_winter_on_peak_usd_kwh', service_account_id=F('service_account_id'))"
          xr_energy_off: "CPARAM('service', 'energy_rate_winter_off_peak_usd_kwh', service_account_id=F('service_account_id'))"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: time_of_use_split
        effect: method
        decides: xr_on_kwh
        bindings: [xr_read, xr_on_kwh, xr_off_kwh]
        ladder:
          - when: "the schedule has on-peak hours and the bill's closing read is not a customer read"
            method: "on-peak and off-peak export kWh are taken as recorded on the export credit"
          - when: "the schedule has on-peak hours and the bill's closing read is a customer read"
            method: "on-peak export kWh are the recorded total times the customer-read on-peak share, rounded to a whole kWh; off-peak kWh are the rest"
          - when: "otherwise"
            method: "every exported kWh is off-peak"
        baseline:
          xr_on_kwh: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: supply_cost_component
        effect: parameter
        decides: xr_pscr
        bindings: [xr_pscr]
        ladder:
          - when: "the rider values exports at the retail energy rate (legacy basis)"
            value: "the schedule's full Power Supply Cost Recovery rate"
          - when: "a residential rider valuing exports at the retail rate less the non-bypassable charge"
            value: "the Power Supply Cost Recovery rate times K('pscr_successor_share'), rounded to five decimals"
          - when: "otherwise (the aggregated business rider)"
            value: "0"
        baseline:
          xr_pscr: "0"
        evidence: [cross_category, tier_param]
        cross_difficulty: service
      - id: non_bypassable_charge_phase_in
        effect: parameter
        decides: xr_nbc
        bindings: [xr_months_operating, xr_nbc]
        ladder:
          - when: "retail-rate-less-non-bypassable-charge basis and at least K('nbc_full_months') whole months from permission to operate to the billing period end"
            value: "P('nonbypassable_charge_usd_kwh') in full"
          - when: "retail-rate-less-non-bypassable-charge basis and fewer than K('nbc_full_months') such months"
            value: "P('nonbypassable_charge_usd_kwh') times K('nbc_phase_in_share'), rounded to five decimals"
          - when: "otherwise"
            value: "0"
        baseline:
          xr_nbc: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
  - id: nem_ext_estimated_export_credit
    base_policy_refs: [nem_export_credit_calculation, nem_program_interactions]
    overwrite:
      - base_policy: nem_export_credit_calculation
        superseded_clause: >-
          Under credit_basis retail_energy_rate each kWh is valued at the service schedule's energy rate for the same season and period; under retail_energy_rate_less_nbc that rate less nonbypassable_charge_usd_kwh;
        replaced_by: >-
          Each estimated kWh is valued at the rate recorded on the preceding export credit for the same period of day, and the estimated export credit is the sum rounded to the cent.
      - base_policy: nem_export_credit_calculation
        superseded_clause: >-
          Exported kWh are split into on-peak and off-peak exports under the rider's export_on_peak_window.
        replaced_by: >-
          The estimated on-peak export kWh are the estimated export kWh times the on-peak share, rounded to a whole kWh, and the estimated off-peak export kWh are the rest.
    trigger: state_due
    subject: [nem_export_credit]
    computes: estimated_credit_usd
    target_tool: book_estimated_export_credit_93ce1e35
    params:
      daylight_summer_to_winter: 0.72
      daylight_winter_to_summer: 1.30
      vacancy_low_use_ratio: 0.50
      vacancy_empty_factor: 1.12
      vacancy_partial_factor: 1.05
      provisional_second_estimate: 0.92
      provisional_repeated_estimate: 0.85
      winter_on_peak_share: 0.16
    rule: >-
      This rule governs the export credit of a billing period whose service bill was issued on an estimated
      closing read and which has no export credit in the net metering history of an operating agreement; the
      estimated period is the period of the most recent service bill of the hosting service agreement, and the
      preceding period is the period of the most recent export credit in the net metering history. One
      estimated export credit is banked for that period, recording the estimated on-peak and off-peak export
      kWh, the two rates used and the amount, dated to the estimated period's billing period end, and it is
      trued up at the next actual read. The estimated export credit is fixed only after the most recent export
      credit in the net metering history carries the per-kWh rates that the revaluation of export credits fixes
      for it. The estimated export kWh are the estimate basis times the daylight factor, the vacancy factor and
      the provisional factor, multiplied together in that order on the kWh total and rounded to a whole kWh once
      at the end. The estimated on-peak export kWh are the estimated export kWh times the on-peak share, rounded
      to a whole kWh, and the estimated off-peak export kWh are the rest. Each estimated kWh is valued at the
      rate recorded on the preceding export credit for the same period of day, and the estimated export credit
      is the sum rounded to the cent. Under the standard method of the estimated export credit the estimate basis
      is the preceding period's total export kWh carried over unscaled, the daylight, vacancy and provisional
      factors are each 1, and the on-peak share is 0. Estimate basis of the estimated export credit: when the
      estimated period's bill is a final bill, the basis is the preceding period's total export kWh times the
      days in the estimated period divided by the days in the preceding period, each period counted from its
      first day through its last day with both days included, the quotient rounded to four decimals; when the
      estimated period's bill is a regular bill and the preceding period's bill was also issued on an estimated
      closing read, the basis is the average total export kWh of the export credits banked for billing periods
      ended in the 3 months before the booking, rounded to two decimals; otherwise the basis is the preceding
      period's total export kWh carried over unscaled. Daylight factor of the estimated export credit: when the
      preceding period's bill is a summer bill and the estimated period's bill is a winter bill, the daylight
      factor is the summer-to-winter factor; when the preceding period's bill is a winter bill and the estimated
      period's bill is a summer bill, it is the winter-to-summer factor; otherwise it is 1. Vacancy factor of the
      estimated export credit: when the estimated period's bill is a final bill and its billed kWh are below the
      low-use ratio times the billed kWh of the preceding period's bill, the vacancy factor is the empty-premises
      factor; when it is a final bill and its billed kWh are at least that much, it is the partly-occupied
      factor; otherwise it is 1. Provisional factor of the estimated export credit: when, besides the estimated
      period's own bill, two or more bills of the hosting service agreement dated in the 12 months before the
      booking were issued on an estimated closing read, the provisional factor is the repeated-estimate factor;
      when exactly one such other bill was, it is the second-estimate factor; otherwise it is 1. On-peak share of
      the estimated export credit: the export window has on-peak hours under every rider valued at the
      avoided-cost export rates and, under the retail-valued riders, when the schedule has on-peak hours; when
      the export window has on-peak hours and the estimated period's bill is a winter bill, the on-peak share is
      the winter on-peak share; when the export window has on-peak hours and the estimated period's bill is a
      summer bill, the on-peak share is the preceding export credit's on-peak export kWh divided by its total
      export kWh, rounded to four decimals; otherwise it is 0.
    baseline:
      rule: >-
        The estimated export kWh are the estimate basis times the daylight factor, the vacancy factor and the
        provisional factor, multiplied together in that order on the kWh total and rounded to a whole kWh once at
        the end. The estimated on-peak export kWh are the estimated export kWh times the on-peak share, rounded
        to a whole kWh, and the estimated off-peak export kWh are the rest. Each estimated kWh is valued at the
        rate recorded on the preceding export credit for the same period of day, and the estimated export credit
        is the sum rounded to the cent. Under the standard method of the estimated export credit the estimate
        basis is the preceding period's total export kWh carried over unscaled, the daylight, vacancy and
        provisional factors are each 1, and the on-peak share is 0.
      params: []
    prerequisite:
      - problem: nem_ext_export_credit_revaluation
        kind: value_input
        gate: ye_rate_on
        form: state
        policy_source: >-
          The estimated export credit is fixed only after the most recent export credit in the net metering
          history carries the per-kWh rates that the revaluation of export credits fixes for it.
        condition: >-
          The most recent nem_export_credit row of the agreement records credit_rate_on_peak and
          credit_rate_off_peak equal to the revalued rates of the export credit revaluation rule.
        resolved_by: revalue_export_credit_a4b62fb5
        effect: >-
          Once the preceding export credit is revalued, ye_rate_on and ye_rate_off read the revalued rates, so the
          estimated export credit values its kWh at those rates instead of the rates the credit was first booked at.
    cross_category:
      - category: service
        as: history
        reads: [variant_name, service_bills.billing_period_start, service_bills.billing_period_end, service_bills.season, service_bills.bill_kind, service_bills.read_type, service_bills.kwh_total]
        note: The hosting service agreement's bills fix the estimate basis, daylight, vacancy and provisional factors; its schedule's on-peak hours fix the on-peak share under the retail-valued riders.
    inputs:
      history:
        - {table: nem_ledger, aggregate: sum, field: export_kwh_off_peak, filters: {event_type: nem_export_credit}}
        - {table: nem_ledger, aggregate: latest, field: credit_rate_off_peak, filters: {event_type: nem_export_credit}}
        - {category: service, table: service_bills, aggregate: count, field: bill_id, within_months: 12, filters: {read_type: estimated}}
        - {category: service, table: service_bills, aggregate: latest, field: kwh_total, filters: {}}
      cross_category: [service]
    compute:
      - ye_prev_end: "LATEST('nem_ledger', 'billing_period_end', date_field='billing_period_end', event_type='nem_export_credit')"
      - ye_prev_on: "SUM('nem_ledger', 'export_kwh_on_peak', event_type='nem_export_credit', billing_period_end=ye_prev_end)"
      - ye_prev_off: "SUM('nem_ledger', 'export_kwh_off_peak', event_type='nem_export_credit', billing_period_end=ye_prev_end)"
      - ye_rate_on: "LATEST('nem_ledger', 'credit_rate_on_peak', date_field='billing_period_end', event_type='nem_export_credit')"
      - ye_rate_off: "LATEST('nem_ledger', 'credit_rate_off_peak', date_field='billing_period_end', event_type='nem_export_credit')"
      - ye_prev_start: "XLATEST('service', 'service_bills', 'billing_period_start', date_field='bill_date', service_account_id=F('service_account_id'), billing_period_end=ye_prev_end)"
      - ye_prev_read: "XLATEST('service', 'service_bills', 'read_type', date_field='bill_date', service_account_id=F('service_account_id'), billing_period_end=ye_prev_end)"
      - ye_prev_season: "XLATEST('service', 'service_bills', 'season', date_field='bill_date', service_account_id=F('service_account_id'), billing_period_end=ye_prev_end)"
      - ye_prev_kwh: "XLATEST('service', 'service_bills', 'kwh_total', date_field='bill_date', service_account_id=F('service_account_id'), billing_period_end=ye_prev_end)"
      - ye_est_start: "XLATEST('service', 'service_bills', 'billing_period_start', date_field='bill_date', service_account_id=F('service_account_id'))"
      - ye_est_end: "XLATEST('service', 'service_bills', 'billing_period_end', date_field='bill_date', service_account_id=F('service_account_id'))"
      - ye_est_kind: "XLATEST('service', 'service_bills', 'bill_kind', date_field='bill_date', service_account_id=F('service_account_id'))"
      - ye_est_season: "XLATEST('service', 'service_bills', 'season', date_field='bill_date', service_account_id=F('service_account_id'))"
      - ye_est_kwh: "XLATEST('service', 'service_bills', 'kwh_total', date_field='bill_date', service_account_id=F('service_account_id'))"
      - ye_avg3: "RND((SUM('nem_ledger', 'export_kwh_on_peak', within_months=3, date_field='billing_period_end', event_type='nem_export_credit') + SUM('nem_ledger', 'export_kwh_off_peak', within_months=3, date_field='billing_period_end', event_type='nem_export_credit')) / MX(1, COUNT('nem_ledger', within_months=3, date_field='billing_period_end', event_type='nem_export_credit')), 2)"
      - ye_base: "(ye_prev_on + ye_prev_off) * RND((DAYS(ye_est_start, ye_est_end) + 1) / (DAYS(ye_prev_start, ye_prev_end) + 1), 4) if ye_est_kind == 'final' else (ye_avg3 if (ye_est_kind == 'regular' and ye_prev_read == 'estimated') else ye_prev_on + ye_prev_off)"
      - ye_daylight: "K('daylight_summer_to_winter') if (ye_prev_season == 'summer' and ye_est_season == 'winter') else (K('daylight_winter_to_summer') if (ye_prev_season == 'winter' and ye_est_season == 'summer') else 1)"
      - ye_vacancy: "K('vacancy_empty_factor') if (ye_est_kind == 'final' and ye_est_kwh < ye_prev_kwh * K('vacancy_low_use_ratio')) else (K('vacancy_partial_factor') if (ye_est_kind == 'final' and ye_est_kwh >= ye_prev_kwh * K('vacancy_low_use_ratio')) else 1)"
      - ye_est_count: "XCOUNT('service', 'service_bills', within_months=12, date_field='bill_date', service_account_id=F('service_account_id'), read_type='estimated')"
      - ye_provisional: "K('provisional_repeated_estimate') if ye_est_count >= 3 else (K('provisional_second_estimate') if ye_est_count == 2 else 1)"
      - ye_tou: "CPARAM('service', 'on_peak_hours', service_account_id=F('service_account_id')) != 'none'"
      - ye_window: "P('credit_basis') == 'avoided_cost_export_rate' or ye_tou"
      - ye_on_share: "K('winter_on_peak_share') if (ye_window and ye_est_season == 'winter') else (RND(ye_prev_on / (ye_prev_on + ye_prev_off), 4) if (ye_window and ye_est_season == 'summer') else 0)"
      - ye_total: "RND(ye_base * ye_daylight * ye_vacancy * ye_provisional, 0)"
      - ye_on: "RND(ye_total * ye_on_share, 0)"
      - ye_off: "ye_total - ye_on"
      - result: "RND(ye_on * ye_rate_on + ye_off * ye_rate_off, 2)"
    compute_basis:
      ye_prev_end: "the preceding period is the period of the most recent export credit in the net metering history"
      ye_prev_on: "the preceding period's total export kWh"
      ye_prev_off: "the preceding period's total export kWh"
      ye_rate_on: "Each estimated kWh is valued at the rate recorded on the preceding export credit for the same period of day"
      ye_rate_off: "Each estimated kWh is valued at the rate recorded on the preceding export credit for the same period of day"
      ye_prev_start: "each period counted from its first day through its last day with both days included"
      ye_prev_read: "the preceding period's bill was also issued on an estimated closing read"
      ye_prev_season: "when the preceding period's bill is a summer bill and the estimated period's bill is a winter bill"
      ye_prev_kwh: "the billed kWh of the preceding period's bill"
      ye_est_start: "the estimated period is the period of the most recent service bill of the hosting service agreement"
      ye_est_end: "the estimated period is the period of the most recent service bill of the hosting service agreement"
      ye_est_kind: "when the estimated period's bill is a final bill"
      ye_est_season: "when the preceding period's bill is a summer bill and the estimated period's bill is a winter bill"
      ye_est_kwh: "its billed kWh are below the low-use ratio times the billed kWh of the preceding period's bill"
      ye_avg3: "the average total export kWh of the export credits banked for billing periods ended in the 3 months before the booking, rounded to two decimals"
      ye_base: "when the estimated period's bill is a final bill, the basis is the preceding period's total export kWh times the days in the estimated period divided by the days in the preceding period, each period counted from its first day through its last day with both days included, the quotient rounded to four decimals; when the estimated period's bill is a regular bill and the preceding period's bill was also issued on an estimated closing read, the basis is the average total export kWh of the export credits banked for billing periods ended in the 3 months before the booking, rounded to two decimals; otherwise the basis is the preceding period's total export kWh carried over unscaled."
      ye_daylight: "when the preceding period's bill is a summer bill and the estimated period's bill is a winter bill, the daylight factor is the summer-to-winter factor; when the preceding period's bill is a winter bill and the estimated period's bill is a summer bill, it is the winter-to-summer factor; otherwise it is 1."
      ye_vacancy: "when the estimated period's bill is a final bill and its billed kWh are below the low-use ratio times the billed kWh of the preceding period's bill, the vacancy factor is the empty-premises factor; when it is a final bill and its billed kWh are at least that much, it is the partly-occupied factor; otherwise it is 1."
      ye_est_count: "two or more bills of the hosting service agreement dated in the 12 months before the booking were issued on an estimated closing read"
      ye_provisional: "when, besides the estimated period's own bill, two or more bills of the hosting service agreement dated in the 12 months before the booking were issued on an estimated closing read, the provisional factor is the repeated-estimate factor; when exactly one such other bill was, it is the second-estimate factor; otherwise it is 1."
      ye_tou: "under the retail-valued riders, when the schedule has on-peak hours"
      ye_window: "the export window has on-peak hours under every rider valued at the avoided-cost export rates and, under the retail-valued riders, when the schedule has on-peak hours"
      ye_on_share: "when the export window has on-peak hours and the estimated period's bill is a winter bill, the on-peak share is the winter on-peak share; when the export window has on-peak hours and the estimated period's bill is a summer bill, the on-peak share is the preceding export credit's on-peak export kWh divided by its total export kWh, rounded to four decimals; otherwise it is 0."
      ye_total: "The estimated export kWh are the estimate basis times the daylight factor, the vacancy factor and the provisional factor, multiplied together in that order on the kWh total and rounded to a whole kWh once at the end."
      ye_on: "The estimated on-peak export kWh are the estimated export kWh times the on-peak share, rounded to a whole kWh"
      ye_off: "the estimated off-peak export kWh are the rest"
      result: "the estimated export credit is the sum rounded to the cent"
    factors:
      - id: estimate_basis
        effect: method
        decides: ye_base
        bindings: [ye_prev_start, ye_prev_read, ye_est_start, ye_est_end, ye_est_kind, ye_avg3, ye_base]
        ladder:
          - when: "the estimated period's bill is a final bill"
            method: "prorate the preceding period's total export kWh by the ratio of days, both the first and last day of each period counted, the quotient rounded to four decimals"
          - when: "the estimated period's bill is a regular bill and the preceding period's bill was also issued on an estimated closing read"
            method: "average total export kWh of the export credits for periods ended in the 3 months before the booking, rounded to two decimals"
          - when: "otherwise"
            method: "carry the preceding period's total export kWh over unscaled"
        baseline:
          ye_base: "ye_prev_on + ye_prev_off"
        evidence: [cross_category, history, date]
        cross_difficulty: service
      - id: daylight_shift
        effect: parameter
        decides: ye_daylight
        bindings: [ye_prev_season, ye_est_season, ye_daylight]
        ladder:
          - when: "the preceding period's bill is a summer bill and the estimated period's bill is a winter bill"
            value: "K('daylight_summer_to_winter')"
          - when: "the preceding period's bill is a winter bill and the estimated period's bill is a summer bill"
            value: "K('daylight_winter_to_summer')"
          - when: "otherwise"
            value: "1"
        baseline:
          ye_daylight: "1"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: vacancy_uplift
        effect: parameter
        decides: ye_vacancy
        bindings: [ye_prev_kwh, ye_est_kwh, ye_vacancy]
        ladder:
          - when: "the estimated period's bill is a final bill and its billed kWh are below K('vacancy_low_use_ratio') times the preceding period's billed kWh"
            value: "K('vacancy_empty_factor')"
          - when: "the estimated period's bill is a final bill and its billed kWh are at least that much"
            value: "K('vacancy_partial_factor')"
          - when: "otherwise"
            value: "1"
        baseline:
          ye_vacancy: "1"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: provisional_estimate_factor
        effect: parameter
        decides: ye_provisional
        bindings: [ye_est_count, ye_provisional]
        ladder:
          - when: "besides the estimated period's own bill, two or more estimated bills dated in the 12 months before the booking"
            value: "K('provisional_repeated_estimate')"
          - when: "exactly one such other estimated bill"
            value: "K('provisional_second_estimate')"
          - when: "otherwise"
            value: "1"
        baseline:
          ye_provisional: "1"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: estimated_on_peak_share
        effect: parameter
        decides: ye_on_share
        bindings: [ye_tou, ye_window, ye_on_share]
        ladder:
          - when: "the export window has on-peak hours and the estimated period's bill is a winter bill"
            value: "K('winter_on_peak_share')"
          - when: "the export window has on-peak hours and the estimated period's bill is a summer bill"
            value: "the preceding export credit's on-peak kWh over its total export kWh, rounded to four decimals"
          - when: "otherwise"
            value: "0"
        baseline:
          ye_on_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
  - id: nem_ext_move_out_termination
    base_policy_refs: [nem_modification_transfer_termination, nem_true_up_rule]
    overwrite:
      - base_policy: nem_true_up_rule
        superseded_clause: >-
          At termination the residual is settled under termination_disposition.
        replaced_by: >-
          At a move-out termination under a rider whose termination disposition is cash out, the move-out payout is paid by check and the rest of the bank is surrendered, so the bank stands at zero once the agreement is terminated.
      - base_policy: nem_modification_transfer_termination
        superseded_clause: >-
          the bank is then settled under termination_disposition.
        replaced_by: >-
          The move-out payout is the full-value portion plus the paid surplus less the estimated-read holdback, rounded to the cent.
    trigger: on_request
    subject: [nem_termination, nem_true_up_payout, nem_true_up_forfeiture]
    computes: payout_usd
    target_tool: end_net_metering_at_move_out_41499158
    params:
      limit_months_electric_heat: 1.5
      limit_months_other_heat: 1.0
      limit_months_default: 0.5
      tenure_long_months: 48
      tenure_mid_months: 24
      tenure_bonus_long: 0.5
      tenure_bonus_mid: 0.25
      surplus_share_legacy: 0.75
      surplus_share_successor: 0.55
      staying_uplift_active: 0.10
      staying_uplift_pending: 0.05
      holdback_share_final: 0.24
      holdback_share_regular: 0.10
    rule: >-
      This rule governs the customer's own decision to end an operating net metering agreement because they are
      stopping electric service at the address and no transfer to a buyer applies, under a rider whose termination disposition is cash out. A move-out whose final bill is dated in the agreement's true-up month is outside this rule, and an agreement under a rider whose termination disposition is forfeit is outside this rule; its bank is forfeited at termination as the base rule provides. The move-out settlement is not fixed until every billing period
      billed on the hosting service agreement since permission to operate has an export credit in the net
      metering history. The bank settled is the credit bank balance recorded on the agreement when the
      termination is recorded. At a move-out termination under a rider whose termination disposition is cash
      out, the move-out payout is paid by check and the rest of the bank is surrendered, so the bank stands at zero once the agreement is terminated. This rule settles a move-out payout of at least the rider's check minimum; a smaller move-out payout is credited to the service agreement as the base rule provides. The full-value limit is the average monthly offsettable charges
      times the sum of the full-value months and the tenure months, rounded to the cent; the full-value portion
      is the lesser of the bank and the full-value limit. The surplus is the bank less the full-value portion,
      and the paid surplus is the surplus times the sum of the surplus share and the staying uplift, rounded to
      the cent. The estimated-read holdback is the export credit of the most recent billing period in the net
      metering history times the holdback share, rounded to the cent. The move-out payout is the full-value
      portion plus the paid surplus less the estimated-read holdback, rounded to the cent. The surrendered
      amount is the bank less the move-out payout. Under the standard method of the move-out payout the average
      monthly offsettable charges are the energy charge plus the Power Supply Cost Recovery charge of the most
      recent service bill, the full-value months are the default month count, there are no tenure months, the
      surplus share is 1, there is no staying uplift and the holdback share is 0. Average monthly offsettable
      charges of the move-out payout: when the hosting service agreement is closed and has a final bill, they
      are the energy charges plus the Power Supply Cost Recovery charges of its regular bills dated in the 12
      months before the termination, divided by the number of those regular bills, rounded to the cent; when
      the hosting service agreement is active and has no final bill, they are the same sums over all of its
      bills dated in those 12 months divided by their number, rounded to the cent; otherwise they are the energy
      charge plus the Power Supply Cost Recovery charge of the most recent service bill. Full-value months of the
      move-out payout: for a residential rider with electric space heating at the premises they are the
      electric-heat month count; for a residential rider with space heating that is not electric they are the
      other-heat month count; otherwise they are the default month count. Tenure months of the move-out payout:
      when the whole calendar months from the permission to operate date to the termination are at least the
      long-tenure threshold, they are the long-tenure bonus; when they are at least the mid-tenure threshold
      but below the long-tenure threshold, the mid-tenure bonus; otherwise none. Surplus share of the move-out
      payout: under the legacy rider's retail energy rate basis, when the export credits banked for billing
      periods ended in the 12 months before the termination exceed the credit applied to bills for those
      periods, it is the legacy surplus share; under the retail-rate-less-non-bypassable-charge basis, when those
      export credits exceed that applied credit, it is the successor surplus share; otherwise it is 1. Staying
      uplift of the move-out payout: when the hosting service agreement is closed and the customer holds a service agreement in active status it is the active-service uplift; when the hosting service agreement is closed and the customer holds no service agreement in active status but holds one in pending start status it is the pending-start uplift; otherwise none. Holdback share of the move-out
      payout: when the most recent service bill of the hosting service agreement is a final bill issued on an estimated closing read, it is the final-estimate holdback share; when that bill is a regular bill issued on an estimated closing read, it is the regular-estimate holdback share; otherwise it is 0.
    baseline:
      rule: >-
        The full-value limit is the average monthly offsettable charges times the sum of the full-value months
        and the tenure months, rounded to the cent; the full-value portion is the lesser of the bank and the
        full-value limit. The surplus is the bank less the full-value portion, and the paid surplus is the
        surplus times the sum of the surplus share and the staying uplift, rounded to the cent. The
        estimated-read holdback is the export credit of the most recent billing period in the net metering
        history times the holdback share, rounded to the cent. The move-out payout is the full-value portion
        plus the paid surplus less the estimated-read holdback, rounded to the cent. Under the standard method of
        the move-out payout the average monthly offsettable charges are the energy charge plus the Power Supply
        Cost Recovery charge of the most recent service bill, the full-value months are the default month count,
        there are no tenure months, the surplus share is 1, there is no staying uplift and the holdback share is
        0.
      params: [limit_months_default]
    prerequisite:
      - problem: nem_ext_estimated_export_credit
        kind: value_input
        gate: u_bank
        form: state
        policy_source: >-
          The move-out settlement is not fixed until every billing period billed on the hosting service agreement
          since permission to operate has an export credit in the net metering history.
        condition: >-
          Every service_bills row of the hosting service agreement with billing_period_end after the permission to
          operate date has a nem_export_credit row with the same billing_period_end, and credit_bank_balance
          includes it.
        resolved_by: book_estimated_export_credit_93ce1e35
        effect: >-
          Once the missing period's export credit is banked, u_bank rises by that credit and u_holdback reads it as
          the most recent export credit, so the move-out payout and the surrendered amount change.
    cross_category:
      - category: service
        as: history
        reads: [status, space_heating, service_bills.energy_charge_amount, service_bills.rider_charge_amount, service_bills.bill_kind, service_bills.read_type]
        note: The hosting service agreement's status, heating and bills fix the average offsettable charges, full-value months and holdback; other service agreements fix the staying uplift.
    inputs:
      history:
        - {category: service, table: service_bills, aggregate: sum, field: energy_charge_amount, within_months: 12, filters: {bill_kind: regular}}
        - {category: service, table: service_bills, aggregate: sum, field: rider_charge_amount, within_months: 12, filters: {bill_kind: regular}}
        - {category: service, table: service_bills, aggregate: count, field: bill_id, within_months: 12, filters: {bill_kind: regular}}
        - {table: nem_ledger, aggregate: latest, field: amount, filters: {event_type: nem_export_credit}}
      cross_category: [service]
    compute:
      - u_bank: "F('credit_bank_balance')"
      - u_svc_status: "CFIELD('service', 'status', service_account_id=F('service_account_id'))"
      - u_final_bills: "XCOUNT('service', 'service_bills', service_account_id=F('service_account_id'), bill_kind='final')"
      - u_avg_offset: "RND((XSUM('service', 'service_bills', 'energy_charge_amount', within_months=12, date_field='bill_date', service_account_id=F('service_account_id'), bill_kind='regular') + XSUM('service', 'service_bills', 'rider_charge_amount', within_months=12, date_field='bill_date', service_account_id=F('service_account_id'), bill_kind='regular')) / XCOUNT('service', 'service_bills', within_months=12, date_field='bill_date', service_account_id=F('service_account_id'), bill_kind='regular'), 2) if (u_svc_status == 'closed' and u_final_bills >= 1) else (RND((XSUM('service', 'service_bills', 'energy_charge_amount', within_months=12, date_field='bill_date', service_account_id=F('service_account_id')) + XSUM('service', 'service_bills', 'rider_charge_amount', within_months=12, date_field='bill_date', service_account_id=F('service_account_id'))) / XCOUNT('service', 'service_bills', within_months=12, date_field='bill_date', service_account_id=F('service_account_id')), 2) if (u_svc_status == 'active' and u_final_bills == 0) else RND(XLATEST('service', 'service_bills', 'energy_charge_amount', date_field='bill_date', service_account_id=F('service_account_id')) + XLATEST('service', 'service_bills', 'rider_charge_amount', date_field='bill_date', service_account_id=F('service_account_id')), 2))"
      - u_heat: "CFIELD('service', 'space_heating', service_account_id=F('service_account_id'))"
      - u_limit_months: "K('limit_months_electric_heat') if (P('customer_type_eligible') == 'residential' and u_heat == 'electric') else (K('limit_months_other_heat') if (P('customer_type_eligible') == 'residential' and u_heat != 'electric') else K('limit_months_default'))"
      - u_months_op: "MONTHS(F('permission_to_operate_date'), NOW)"
      - u_tenure_bonus: "K('tenure_bonus_long') if u_months_op >= K('tenure_long_months') else (K('tenure_bonus_mid') if u_months_op >= K('tenure_mid_months') else 0)"
      - u_limit: "RND(u_avg_offset * (u_limit_months + u_tenure_bonus), 2)"
      - u_full: "MN(u_bank, u_limit)"
      - u_year_exports: "SUM('nem_ledger', 'amount', within_months=12, date_field='billing_period_end', event_type='nem_export_credit')"
      - u_year_applied: "SUM('nem_ledger', 'amount', within_months=12, date_field='billing_period_end', event_type='nem_credit_application')"
      - u_surplus_share: "K('surplus_share_legacy') if (P('credit_basis') == 'retail_energy_rate' and u_year_exports > u_year_applied) else (K('surplus_share_successor') if (P('credit_basis') == 'retail_energy_rate_less_nbc' and u_year_exports > u_year_applied) else 1)"
      - u_other_active: "EXISTS('service', status='active')"
      - u_other_pending: "EXISTS('service', status='pending_start')"
      - u_staying_uplift: "K('staying_uplift_active') if (u_svc_status == 'closed' and u_other_active) else (K('staying_uplift_pending') if (u_svc_status == 'closed' and u_other_pending and not u_other_active) else 0)"
      - u_surplus_paid: "RND((u_bank - u_full) * (u_surplus_share + u_staying_uplift), 2)"
      - u_last_credit: "LATEST('nem_ledger', 'amount', date_field='billing_period_end', event_type='nem_export_credit')"
      - u_last_read: "XLATEST('service', 'service_bills', 'read_type', date_field='bill_date', service_account_id=F('service_account_id'))"
      - u_last_kind: "XLATEST('service', 'service_bills', 'bill_kind', date_field='bill_date', service_account_id=F('service_account_id'))"
      - u_holdback_share: "K('holdback_share_final') if (u_last_read == 'estimated' and u_last_kind == 'final') else (K('holdback_share_regular') if (u_last_read == 'estimated' and u_last_kind == 'regular') else 0)"
      - u_holdback: "RND(u_last_credit * u_holdback_share, 2)"
      - u_payout: "RND(u_full + u_surplus_paid - u_holdback, 2)"
      - u_surrender: "RND(u_bank - u_payout, 2)"
      - result: "u_payout"
    compute_basis:
      u_bank: "The bank settled is the credit bank balance recorded on the agreement when the termination is recorded."
      u_svc_status: "when the hosting service agreement is closed and has a final bill"
      u_final_bills: "when the hosting service agreement is closed and has a final bill"
      u_avg_offset: "when the hosting service agreement is closed and has a final bill, they are the energy charges plus the Power Supply Cost Recovery charges of its regular bills dated in the 12 months before the termination, divided by the number of those regular bills, rounded to the cent; when the hosting service agreement is active and has no final bill, they are the same sums over all of its bills dated in those 12 months divided by their number, rounded to the cent; otherwise they are the energy charge plus the Power Supply Cost Recovery charge of the most recent service bill."
      u_heat: "for a residential rider with electric space heating at the premises"
      u_limit_months: "for a residential rider with electric space heating at the premises they are the electric-heat month count; for a residential rider with space heating that is not electric they are the other-heat month count; otherwise they are the default month count."
      u_months_op: "the whole calendar months from the permission to operate date to the termination"
      u_tenure_bonus: "when the whole calendar months from the permission to operate date to the termination are at least the long-tenure threshold, they are the long-tenure bonus; when they are at least the mid-tenure threshold but below the long-tenure threshold, the mid-tenure bonus; otherwise none."
      u_limit: "The full-value limit is the average monthly offsettable charges times the sum of the full-value months and the tenure months, rounded to the cent"
      u_full: "the full-value portion is the lesser of the bank and the full-value limit."
      u_year_exports: "the export credits banked for billing periods ended in the 12 months before the termination"
      u_year_applied: "the credit applied to bills for those periods"
      u_surplus_share: "under the legacy rider's retail energy rate basis, when the export credits banked for billing periods ended in the 12 months before the termination exceed the credit applied to bills for those periods, it is the legacy surplus share; under the retail-rate-less-non-bypassable-charge basis, when those export credits exceed that applied credit, it is the successor surplus share; otherwise it is 1."
      u_other_active: "the customer holds a service agreement in active status"
      u_other_pending: "holds one in pending start status"
      u_staying_uplift: "when the hosting service agreement is closed and the customer holds a service agreement in active status it is the active-service uplift; when the hosting service agreement is closed and the customer holds no service agreement in active status but holds one in pending start status it is the pending-start uplift; otherwise none."
      u_surplus_paid: "The surplus is the bank less the full-value portion, and the paid surplus is the surplus times the sum of the surplus share and the staying uplift, rounded to the cent."
      u_last_credit: "the export credit of the most recent billing period in the net metering history"
      u_last_read: "issued on an estimated closing read"
      u_last_kind: "when the most recent service bill of the hosting service agreement is a final bill"
      u_holdback_share: "when the most recent service bill of the hosting service agreement is a final bill issued on an estimated closing read, it is the final-estimate holdback share; when that bill is a regular bill issued on an estimated closing read, it is the regular-estimate holdback share; otherwise it is 0."
      u_holdback: "The estimated-read holdback is the export credit of the most recent billing period in the net metering history times the holdback share, rounded to the cent."
      u_payout: "The move-out payout is the full-value portion plus the paid surplus less the estimated-read holdback, rounded to the cent."
      u_surrender: "The surrendered amount is the bank less the move-out payout."
      result: "the move-out payout is paid by check and the rest of the bank is surrendered"
    factors:
      - id: offsettable_charge_average
        effect: method
        decides: u_avg_offset
        bindings: [u_svc_status, u_final_bills, u_avg_offset]
        ladder:
          - when: "the hosting service agreement is closed and has a final bill"
            method: "energy plus Power Supply Cost Recovery charges of the regular bills dated in the 12 months before the termination, averaged over those regular bills, rounded to the cent"
          - when: "the hosting service agreement is active and has no final bill"
            method: "the same charges over all bills dated in those 12 months, averaged over those bills, rounded to the cent"
          - when: "otherwise"
            method: "energy plus Power Supply Cost Recovery charge of the most recent service bill"
        baseline:
          u_avg_offset: "RND(XLATEST('service', 'service_bills', 'energy_charge_amount', date_field='bill_date', service_account_id=F('service_account_id')) + XLATEST('service', 'service_bills', 'rider_charge_amount', date_field='bill_date', service_account_id=F('service_account_id')), 2)"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: full_value_months
        effect: parameter
        decides: u_limit_months
        bindings: [u_heat, u_limit_months]
        ladder:
          - when: "a residential rider and electric space heating at the premises"
            value: "K('limit_months_electric_heat')"
          - when: "a residential rider and space heating that is not electric"
            value: "K('limit_months_other_heat')"
          - when: "otherwise"
            value: "K('limit_months_default')"
        baseline:
          u_limit_months: "K('limit_months_default')"
        evidence: [cross_category, tier_param]
        cross_difficulty: service
      - id: tenure_months
        effect: parameter
        decides: u_tenure_bonus
        bindings: [u_months_op, u_tenure_bonus]
        ladder:
          - when: "at least K('tenure_long_months') whole months from permission to operate to the termination"
            value: "K('tenure_bonus_long')"
          - when: "at least K('tenure_mid_months') but fewer than K('tenure_long_months') such months"
            value: "K('tenure_bonus_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          u_tenure_bonus: "0"
        evidence: [date]
        cross_difficulty: null
      - id: surplus_share
        effect: parameter
        decides: u_surplus_share
        bindings: [u_year_exports, u_year_applied, u_surplus_share]
        ladder:
          - when: "legacy retail energy rate basis and the export credits of the 12 months before the termination exceed the credit applied for those periods"
            value: "K('surplus_share_legacy')"
          - when: "retail-rate-less-non-bypassable-charge basis and those export credits exceed that applied credit"
            value: "K('surplus_share_successor')"
          - when: "otherwise"
            value: "1"
        baseline:
          u_surplus_share: "1"
        evidence: [tier_param, history]
        cross_difficulty: null
      - id: staying_uplift
        effect: parameter
        decides: u_staying_uplift
        bindings: [u_other_active, u_other_pending, u_staying_uplift]
        ladder:
          - when: "the hosting service agreement is closed and the customer holds a service agreement in active status"
            value: "K('staying_uplift_active')"
          - when: "the hosting service agreement is closed and the customer holds no service agreement in active status but one in pending start status"
            value: "K('staying_uplift_pending')"
          - when: "otherwise"
            value: "0"
        baseline:
          u_staying_uplift: "0"
        evidence: [cross_category]
        cross_difficulty: service
      - id: estimated_read_holdback
        effect: parameter
        decides: u_holdback_share
        bindings: [u_last_credit, u_last_read, u_last_kind, u_holdback_share, u_holdback]
        ladder:
          - when: "the most recent service bill is a final bill issued on an estimated closing read"
            value: "K('holdback_share_final')"
          - when: "the most recent service bill is a regular bill issued on an estimated closing read"
            value: "K('holdback_share_regular')"
          - when: "otherwise"
            value: "0"
        baseline:
          u_holdback_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
  - id: nem_ext_carried_credit_expiry
    base_policy_refs: [nem_true_up_rule]
    overwrite:
      - base_policy: nem_true_up_rule
        superseded_clause: >-
          At an anniversary true-up, cash_out pays the residual, carry_forward leaves it in the bank, and forfeit zeroes it.
        replaced_by: >-
          At each anniversary true-up of a rider whose true-up disposition is cash out or carry forward, credit carried into the closing true-up year and left unused by its bills expires and is booked as an anniversary forfeiture of the expired carried credit. Under a rider whose true-up disposition is forfeit, the residual bank is still forfeited in full at each anniversary true-up, and no carried credit arises.
    trigger: state_due
    subject: [nem_true_up_forfeiture]
    computes: expired_credit_usd
    target_tool: expire_carried_credit_d622768b
    params:
      long_tenure_months: 60
      mid_tenure_months: 24
      expiry_share_long: 0.50
      expiry_share_mid: 0.75
      exempt_large_system: 25.00
      exempt_small_system: 10.00
      large_system_charge_total: 300.00
    rule: >-
      This rule governs the expiry of carried credit at the anniversary true-up booked at the bill dated in the
      true-up month. At each anniversary true-up of a rider whose true-up disposition is cash out or carry forward, credit carried into the closing true-up year and left unused by its bills expires and is booked as an anniversary forfeiture of the expired carried credit. Under a rider whose true-up disposition is forfeit, the residual bank is still forfeited in full at each anniversary true-up, and no carried credit arises. The closing true-up year is the billing
      periods ended in the 12 whole months before the expiry is booked. The carried credit is the credit bank
      balance recorded on the agreement less the export credits banked for the periods of the closing true-up
      year plus the credit applied to bills for those periods. The expired carried credit is the carried credit
      less the carried credit used and less the reserve, multiplied by the expiry share, less the exempt amount,
      rounded to the cent once and never below zero; an expired carried credit of zero books nothing. The
      reserve is the reserve months times the credit applied in the closing true-up year divided by 12, rounded
      to the cent. Under the standard method of the expired carried credit the carried credit used is the lesser
      of the carried credit and the credit applied in the closing true-up year, there are no reserve months, the
      expiry share is 1 and there is no exempt amount. Carried credit used of the expired carried credit: when
      the schedule of the hosting service agreement has on-peak hours and the rider values exports at the
      avoided-cost export rates, the year's bills draw on that year's own export credits first and the carried
      credit used is the credit applied in excess of the year's export credits, or zero when there is no excess;
      when the schedule has no on-peak hours and the rider values exports at the avoided-cost export rates, the
      carried credit used is the year's applied credit times the carried credit divided by the sum of the
      carried credit and the year's export credits, rounded to the cent; otherwise the carried credit used is the
      lesser of the carried credit and the year's applied credit. Reserve months of the expired carried credit:
      when two or more bills of the hosting service agreement dated in the 12 months before the expiry were
      issued on an estimated closing read there are two reserve months; when exactly one was, one reserve month;
      otherwise none. Expiry share of the expired carried credit: when the whole calendar months from the
      permission to operate date to the expiry are at least the long-tenure months, the long-tenure expiry
      share; when they are at least the mid-tenure months but below the long-tenure months, the mid-tenure
      expiry share; otherwise 1. Exempt amount of the expired carried credit: when the rider values exports at the avoided-cost export rates and the grid access charges booked for billing periods ended in the 12 months before the expiry total at least the large-system charge total, the large-system exempt amount; when the rider values exports at the avoided-cost export rates and those charges total less, the small-system exempt amount; otherwise none.
    baseline:
      rule: >-
        The expired carried credit is the carried credit less the carried credit used and less the reserve,
        multiplied by the expiry share, less the exempt amount, rounded to the cent once and never below zero;
        an expired carried credit of zero books nothing. The reserve is the reserve months times the credit
        applied in the closing true-up year divided by 12, rounded to the cent. Under the standard method of the
        expired carried credit the carried credit used is the lesser of the carried credit and the credit
        applied in the closing true-up year, there are no reserve months, the expiry share is 1 and there is no
        exempt amount.
      params: []
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [variant_name, service_bills.read_type, service_bills.bill_date]
        note: The schedule's on-peak hours decide the drawing order; the hosting service agreement's estimated reads decide the reserve months.
    inputs:
      history:
        - {table: nem_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: nem_export_credit}}
        - {table: nem_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: nem_credit_application}}
        - {table: nem_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: nem_grid_access_charge}}
        - {category: service, table: service_bills, aggregate: count, field: bill_id, within_months: 12, filters: {read_type: estimated}}
      cross_category: [service]
    compute:
      - ex_exports: "SUM('nem_ledger', 'amount', within_months=12, date_field='billing_period_end', event_type='nem_export_credit')"
      - ex_applied: "SUM('nem_ledger', 'amount', within_months=12, date_field='billing_period_end', event_type='nem_credit_application')"
      - ex_carried: "RND(F('credit_bank_balance') - ex_exports + ex_applied, 2)"
      - ex_tou: "CPARAM('service', 'on_peak_hours', service_account_id=F('service_account_id')) != 'none'"
      - ex_avoided: "P('credit_basis') == 'avoided_cost_export_rate'"
      - ex_used: "MX(0, RND(ex_applied - ex_exports, 2)) if (ex_tou and ex_avoided) else (RND(ex_applied * ex_carried / (ex_carried + ex_exports), 2) if ((not ex_tou) and ex_avoided) else MN(ex_carried, ex_applied))"
      - ex_est_count: "XCOUNT('service', 'service_bills', within_months=12, date_field='bill_date', service_account_id=F('service_account_id'), read_type='estimated')"
      - ex_reserve_months: "2 if ex_est_count >= 2 else (1 if ex_est_count == 1 else 0)"
      - ex_reserve: "RND(ex_reserve_months * ex_applied / 12, 2)"
      - ex_months_op: "MONTHS(F('permission_to_operate_date'), NOW)"
      - ex_share: "K('expiry_share_long') if ex_months_op >= K('long_tenure_months') else (K('expiry_share_mid') if ex_months_op >= K('mid_tenure_months') else 1)"
      - ex_gac_total: "SUM('nem_ledger', 'amount', within_months=12, date_field='billing_period_end', event_type='nem_grid_access_charge')"
      - ex_exempt: "K('exempt_large_system') if (ex_avoided and ex_gac_total >= K('large_system_charge_total')) else (K('exempt_small_system') if (ex_avoided and ex_gac_total < K('large_system_charge_total')) else 0)"
      - result: "RND(MX(0, (ex_carried - ex_used - ex_reserve) * ex_share - ex_exempt), 2)"
    compute_basis:
      ex_exports: "the export credits banked for the periods of the closing true-up year"
      ex_applied: "the credit applied to bills for those periods"
      ex_carried: "The carried credit is the credit bank balance recorded on the agreement less the export credits banked for the periods of the closing true-up year plus the credit applied to bills for those periods."
      ex_tou: "when the schedule of the hosting service agreement has on-peak hours"
      ex_avoided: "the rider values exports at the avoided-cost export rates"
      ex_used: "when the schedule of the hosting service agreement has on-peak hours and the rider values exports at the avoided-cost export rates, the year's bills draw on that year's own export credits first and the carried credit used is the credit applied in excess of the year's export credits, or zero when there is no excess; when the schedule has no on-peak hours and the rider values exports at the avoided-cost export rates, the carried credit used is the year's applied credit times the carried credit divided by the sum of the carried credit and the year's export credits, rounded to the cent; otherwise the carried credit used is the lesser of the carried credit and the year's applied credit."
      ex_est_count: "bills of the hosting service agreement dated in the 12 months before the expiry were issued on an estimated closing read"
      ex_reserve_months: "when two or more bills of the hosting service agreement dated in the 12 months before the expiry were issued on an estimated closing read there are two reserve months; when exactly one was, one reserve month; otherwise none."
      ex_reserve: "The reserve is the reserve months times the credit applied in the closing true-up year divided by 12, rounded to the cent."
      ex_months_op: "the whole calendar months from the permission to operate date to the expiry"
      ex_share: "when the whole calendar months from the permission to operate date to the expiry are at least the long-tenure months, the long-tenure expiry share; when they are at least the mid-tenure months but below the long-tenure months, the mid-tenure expiry share; otherwise 1."
      ex_gac_total: "the grid access charges booked for billing periods ended in the 12 months before the expiry"
      ex_exempt: "when the rider values exports at the avoided-cost export rates and the grid access charges booked for billing periods ended in the 12 months before the expiry total at least the large-system charge total, the large-system exempt amount; when the rider values exports at the avoided-cost export rates and those charges total less, the small-system exempt amount; otherwise none."
      result: "The expired carried credit is the carried credit less the carried credit used and less the reserve, multiplied by the expiry share, less the exempt amount, rounded to the cent once and never below zero"
    factors:
      - id: carried_credit_drawing_order
        effect: method
        decides: ex_used
        bindings: [ex_tou, ex_avoided, ex_used]
        ladder:
          - when: "the hosting schedule has on-peak hours and the rider values exports at the avoided-cost export rates"
            method: "the year's own export credits are drawn first; carried credit used is the applied credit in excess of the year's export credits, or zero"
          - when: "the hosting schedule has no on-peak hours and the rider values exports at the avoided-cost export rates"
            method: "carried credit used is the applied credit pro rata to the carried credit's share of carried plus year's export credits, rounded to the cent"
          - when: "otherwise"
            method: "carried credit used is the lesser of the carried credit and the year's applied credit"
        baseline:
          ex_used: "MN(ex_carried, ex_applied)"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: estimated_read_reserve
        effect: parameter
        decides: ex_reserve_months
        bindings: [ex_est_count, ex_reserve_months, ex_reserve]
        ladder:
          - when: "two or more bills of the hosting service agreement dated in the 12 months before the expiry were issued on an estimated closing read"
            value: "2"
          - when: "exactly one such bill"
            value: "1"
          - when: "otherwise"
            value: "0"
        baseline:
          ex_reserve_months: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: tenure_expiry_share
        effect: parameter
        decides: ex_share
        bindings: [ex_months_op, ex_share]
        ladder:
          - when: "at least K('long_tenure_months') whole months from permission to operate to the expiry"
            value: "K('expiry_share_long')"
          - when: "at least K('mid_tenure_months') but fewer than K('long_tenure_months') such months"
            value: "K('expiry_share_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          ex_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: grid_access_exempt_amount
        effect: parameter
        decides: ex_exempt
        bindings: [ex_gac_total, ex_exempt]
        ladder:
          - when: "avoided-cost rider and grid access charges of the 12 months before the expiry totalling at least K('large_system_charge_total')"
            value: "K('exempt_large_system')"
          - when: "avoided-cost rider and those charges totalling less"
            value: "K('exempt_small_system')"
          - when: "otherwise"
            value: "0"
        baseline:
          ex_exempt: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
  - id: nem_ext_anniversary_cash_out
    base_policy_refs: [nem_true_up_rule]
    overwrite:
      - base_policy: nem_true_up_rule
        superseded_clause: >-
          At an anniversary true-up, cash_out pays the residual, carry_forward leaves it in the bank, and forfeit zeroes it.
        replaced_by: >-
          At the anniversary true-up of a rider whose true-up disposition is cash out, the anniversary cash-out is paid by check and the retained credit stays in the bank and opens the new true-up year. A rider whose true-up disposition is carry forward leaves its residual bank in the bank at the anniversary, and a rider whose true-up disposition is forfeit forfeits it.
    trigger: state_due
    subject: [nem_true_up_payout]
    computes: payout_usd
    target_tool: settle_anniversary_cash_out_8d85c400
    params:
      winter_share_high: 0.60
      winter_share_mid: 0.40
      retain_months_high: 2
      retain_months_mid: 1
      full_year_bills: 12
      fixed_retention_demand: 200.00
      fixed_retention_general: 120.00
      storage_rate_dispatch: 0.50
      storage_rate_other: 1.50
      buffer_per_estimate_actual_close: 20.00
      buffer_per_estimate_estimated_close: 40.00
    rule: >-
      This rule governs the anniversary cash-out booked at the bill dated in the true-up month of an operating
      agreement under a rider whose true-up disposition is cash out. At the anniversary true-up of a rider whose true-up disposition is cash out, the anniversary cash-out is paid by check and the retained credit stays in the bank and opens the new true-up year. A rider whose true-up disposition is carry forward leaves its residual bank in the bank at the anniversary, and a rider whose true-up disposition is forfeit forfeits it. The anniversary cash-out is fixed only after the bank carries the
      expiry entry owed for credit carried into the closing true-up year and left unused by its bills. The
      anniversary cash-out is the credit bank balance recorded on the agreement less the retained credit,
      rounded to the cent and never below zero. The retained credit is the retention months times the average
      monthly applied credit, plus the fixed retention, plus the paired battery capacity in kWh times the
      storage retention rate, plus the number of bills of the hosting service agreement dated in the 12 months
      before the cash-out that were issued on an estimated closing read times the estimate buffer, the sum
      rounded to the cent once. Under the standard method of the anniversary cash-out the average monthly
      applied credit is the credit applied on the most recent bill, there are no retention months, no fixed
      retention, no storage retention rate and no estimate buffer. Retention months of the anniversary cash-out:
      the winter share is the energy plus Power Supply Cost Recovery charges of the hosting service agreement's
      winter-season bills dated in the 12 months before the cash-out divided by those charges of all its bills
      dated in those months, rounded to four decimals; when the winter share is at least the high winter share
      there are the high retention months; when it is at least the mid winter share but below the high winter
      share, the mid retention months; otherwise none. Average monthly applied credit of the anniversary
      cash-out: when the hosting service agreement has at least the full-year bill count of regular bills dated
      in the 12 months before the cash-out and at most one bill dated in those months issued on an estimated
      closing read, it is the credit applied for billing periods ended in those 12 months divided by 12, rounded
      to the cent; when it has at least that many regular bills and two or more estimated bills, it is the
      credit applied for billing periods ended in the 3 months before the cash-out divided by 3, rounded to the
      cent; otherwise it is the credit applied on the most recent bill. Fixed retention of the anniversary
      cash-out: for a business rider on a schedule with a demand charge, the demand-schedule fixed retention; for
      a business rider on a schedule without a demand charge, the general-service fixed retention; otherwise
      none. Storage retention rate of the anniversary cash-out: when a battery is paired with the system and the
      customer holds an active demand response enrollment, the dispatch storage rate; when a battery is paired
      and the customer holds no active demand response enrollment, the other storage rate; otherwise none.
      Estimate buffer of the anniversary cash-out: when at least one bill dated in the 12 months before the cash-out was issued on an estimated closing read and the most recent bill was itself issued on an estimated closing read, the estimated-close buffer per estimated bill; when at least one such bill exists and the most recent bill was not issued on an estimated closing read, the actual-close buffer per estimated bill; otherwise none. A cash-out of at least the rider's check minimum is paid by check.
    baseline:
      rule: >-
        The anniversary cash-out is the credit bank balance recorded on the agreement less the retained credit,
        rounded to the cent and never below zero. The retained credit is the retention months times the average
        monthly applied credit, plus the fixed retention, plus the paired battery capacity in kWh times the
        storage retention rate, plus the number of bills of the hosting service agreement dated in the 12 months
        before the cash-out that were issued on an estimated closing read times the estimate buffer, the sum
        rounded to the cent once. Under the standard method of the anniversary cash-out the average monthly
        applied credit is the credit applied on the most recent bill, there are no retention months, no fixed
        retention, no storage retention rate and no estimate buffer.
      params: []
    prerequisite:
      - problem: nem_ext_carried_credit_expiry
        kind: value_input
        gate: an_bank
        form: state
        policy_source: >-
          The anniversary cash-out is fixed only after the bank carries the expiry entry owed for credit carried into
          the closing true-up year and left unused by its bills.
        condition: >-
          The nem_ledger holds the anniversary nem_true_up_forfeiture booked for the current true-up month whenever
          the carried credit left unused is above zero, and credit_bank_balance reflects it.
        resolved_by: expire_carried_credit_d622768b
        effect: >-
          Once the expired carried credit is booked, an_bank is lower by that amount and the anniversary cash-out
          falls by the same amount.
    cross_category:
      - category: service
        as: history
        reads: [variant_name, service_bills.season, service_bills.energy_charge_amount, service_bills.rider_charge_amount, service_bills.bill_kind, service_bills.read_type]
        note: The hosting service agreement's bills decide retention months, the averaging method and the estimate count; its schedule's demand charge decides the fixed retention.
      - category: dr
        as: existence
        reads: [status]
        note: An active demand response enrollment of the customer selects the dispatch storage rate.
    inputs:
      history:
        - {category: service, table: service_bills, aggregate: sum, field: energy_charge_amount, within_months: 12, filters: {season: winter}}
        - {category: service, table: service_bills, aggregate: count, field: bill_id, within_months: 12, filters: {bill_kind: regular}}
        - {table: nem_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: nem_credit_application}}
        - {table: nem_ledger, aggregate: latest, field: amount, filters: {event_type: nem_credit_application}}
      cross_category: [service, dr]
    compute:
      - an_bank: "F('credit_bank_balance')"
      - an_winter: "XSUM('service', 'service_bills', 'energy_charge_amount', within_months=12, date_field='bill_date', service_account_id=F('service_account_id'), season='winter') + XSUM('service', 'service_bills', 'rider_charge_amount', within_months=12, date_field='bill_date', service_account_id=F('service_account_id'), season='winter')"
      - an_all: "XSUM('service', 'service_bills', 'energy_charge_amount', within_months=12, date_field='bill_date', service_account_id=F('service_account_id')) + XSUM('service', 'service_bills', 'rider_charge_amount', within_months=12, date_field='bill_date', service_account_id=F('service_account_id'))"
      - an_winter_share: "RND(an_winter / an_all, 4)"
      - an_months: "K('retain_months_high') if an_winter_share >= K('winter_share_high') else (K('retain_months_mid') if an_winter_share >= K('winter_share_mid') else 0)"
      - an_bills: "XCOUNT('service', 'service_bills', within_months=12, date_field='bill_date', service_account_id=F('service_account_id'), bill_kind='regular')"
      - an_est: "XCOUNT('service', 'service_bills', within_months=12, date_field='bill_date', service_account_id=F('service_account_id'), read_type='estimated')"
      - an_avg_app: "RND(SUM('nem_ledger', 'amount', within_months=12, date_field='billing_period_end', event_type='nem_credit_application') / 12, 2) if (an_bills >= K('full_year_bills') and an_est <= 1) else (RND(SUM('nem_ledger', 'amount', within_months=3, date_field='billing_period_end', event_type='nem_credit_application') / 3, 2) if (an_bills >= K('full_year_bills') and an_est >= 2) else LATEST('nem_ledger', 'amount', date_field='billing_period_end', event_type='nem_credit_application'))"
      - an_business: "P('customer_type_eligible') == 'business'"
      - an_demand: "CPARAM('service', 'demand_charge_usd_kw', service_account_id=F('service_account_id'))"
      - an_fixed: "K('fixed_retention_demand') if (an_business and an_demand > 0) else (K('fixed_retention_general') if (an_business and an_demand == 0) else 0)"
      - an_dr: "EXISTS('dr', status='active')"
      - an_storage_rate: "K('storage_rate_dispatch') if (F('storage_capacity_kwh') > 0 and an_dr) else (K('storage_rate_other') if (F('storage_capacity_kwh') > 0 and not an_dr) else 0)"
      - an_last_read: "XLATEST('service', 'service_bills', 'read_type', date_field='bill_date', service_account_id=F('service_account_id'))"
      - an_per_read: "K('buffer_per_estimate_estimated_close') if (an_est >= 1 and an_last_read == 'estimated') else (K('buffer_per_estimate_actual_close') if (an_est >= 1 and an_last_read != 'estimated') else 0)"
      - an_retained: "RND(an_months * an_avg_app + an_fixed + F('storage_capacity_kwh') * an_storage_rate + an_est * an_per_read, 2)"
      - result: "RND(MX(0, an_bank - an_retained), 2)"
    compute_basis:
      an_bank: "The anniversary cash-out is the credit bank balance recorded on the agreement less the retained credit, rounded to the cent and never below zero."
      an_winter: "the energy plus Power Supply Cost Recovery charges of the hosting service agreement's winter-season bills dated in the 12 months before the cash-out"
      an_all: "those charges of all its bills dated in those months"
      an_winter_share: "the winter share is the energy plus Power Supply Cost Recovery charges of the hosting service agreement's winter-season bills dated in the 12 months before the cash-out divided by those charges of all its bills dated in those months, rounded to four decimals"
      an_months: "when the winter share is at least the high winter share there are the high retention months; when it is at least the mid winter share but below the high winter share, the mid retention months; otherwise none."
      an_bills: "at least the full-year bill count of regular bills dated in the 12 months before the cash-out"
      an_est: "the number of bills of the hosting service agreement dated in the 12 months before the cash-out that were issued on an estimated closing read"
      an_avg_app: "when the hosting service agreement has at least the full-year bill count of regular bills dated in the 12 months before the cash-out and at most one bill dated in those months issued on an estimated closing read, it is the credit applied for billing periods ended in those 12 months divided by 12, rounded to the cent; when it has at least that many regular bills and two or more estimated bills, it is the credit applied for billing periods ended in the 3 months before the cash-out divided by 3, rounded to the cent; otherwise it is the credit applied on the most recent bill."
      an_business: "for a business rider on a schedule with a demand charge"
      an_demand: "for a business rider on a schedule with a demand charge, the demand-schedule fixed retention; for a business rider on a schedule without a demand charge, the general-service fixed retention; otherwise none."
      an_fixed: "for a business rider on a schedule with a demand charge, the demand-schedule fixed retention; for a business rider on a schedule without a demand charge, the general-service fixed retention; otherwise none."
      an_dr: "the customer holds an active demand response enrollment"
      an_storage_rate: "when a battery is paired with the system and the customer holds an active demand response enrollment, the dispatch storage rate; when a battery is paired and the customer holds no active demand response enrollment, the other storage rate; otherwise none."
      an_last_read: "the most recent bill was itself issued on an estimated closing read"
      an_per_read: "when at least one bill dated in the 12 months before the cash-out was issued on an estimated closing read and the most recent bill was itself issued on an estimated closing read, the estimated-close buffer per estimated bill; when at least one such bill exists and the most recent bill was not issued on an estimated closing read, the actual-close buffer per estimated bill; otherwise none."
      an_retained: "The retained credit is the retention months times the average monthly applied credit, plus the fixed retention, plus the paired battery capacity in kWh times the storage retention rate, plus the number of bills of the hosting service agreement dated in the 12 months before the cash-out that were issued on an estimated closing read times the estimate buffer, the sum rounded to the cent once."
      result: "The anniversary cash-out is the credit bank balance recorded on the agreement less the retained credit, rounded to the cent and never below zero."
    factors:
      - id: winter_retention_months
        effect: parameter
        decides: an_months
        bindings: [an_winter, an_all, an_winter_share, an_months]
        ladder:
          - when: "the winter share of the 12 months' offsettable charges is at least K('winter_share_high')"
            value: "K('retain_months_high')"
          - when: "the winter share is at least K('winter_share_mid') but below K('winter_share_high')"
            value: "K('retain_months_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          an_months: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: applied_credit_averaging
        effect: method
        decides: an_avg_app
        bindings: [an_bills, an_est, an_avg_app]
        ladder:
          - when: "at least K('full_year_bills') regular bills dated in the 12 months before the cash-out and at most one estimated bill"
            method: "applied credit of the 12 months' billing periods divided by 12, rounded to the cent"
          - when: "at least K('full_year_bills') regular bills and two or more estimated bills"
            method: "applied credit of the 3 months' billing periods divided by 3, rounded to the cent"
          - when: "otherwise"
            method: "the credit applied on the most recent bill"
        baseline:
          an_avg_app: "LATEST('nem_ledger', 'amount', date_field='billing_period_end', event_type='nem_credit_application')"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: fixed_business_retention
        effect: parameter
        decides: an_fixed
        bindings: [an_business, an_demand, an_fixed]
        ladder:
          - when: "a business rider and the hosting schedule has a demand charge"
            value: "K('fixed_retention_demand')"
          - when: "a business rider and the hosting schedule has no demand charge"
            value: "K('fixed_retention_general')"
          - when: "otherwise"
            value: "0"
        baseline:
          an_fixed: "0"
        evidence: [cross_category, tier_param]
        cross_difficulty: service
      - id: storage_retention_rate
        effect: parameter
        decides: an_storage_rate
        bindings: [an_dr, an_storage_rate]
        ladder:
          - when: "a battery is paired with the system and the customer holds an active demand response enrollment"
            value: "K('storage_rate_dispatch')"
          - when: "a battery is paired and the customer holds no active demand response enrollment"
            value: "K('storage_rate_other')"
          - when: "otherwise"
            value: "0"
        baseline:
          an_storage_rate: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: estimate_buffer
        effect: parameter
        decides: an_per_read
        bindings: [an_last_read, an_per_read]
        ladder:
          - when: "at least one estimated bill dated in the 12 months before the cash-out and the most recent bill itself estimated"
            value: "K('buffer_per_estimate_estimated_close')"
          - when: "at least one such bill and the most recent bill not estimated"
            value: "K('buffer_per_estimate_actual_close')"
          - when: "otherwise"
            value: "0"
        baseline:
          an_per_read: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
  - id: nem_ext_requested_termination
    base_policy_refs: [nem_modification_transfer_termination, nem_true_up_rule]
    overwrite:
      - base_policy: nem_true_up_rule
        superseded_clause: >-
          At termination the residual is settled under termination_disposition.
        replaced_by: >-
          When the customer ends the agreement while keeping electric service at the address, under a rider whose termination disposition is cash out, the requested-termination payout is paid by check and the rest of the bank is surrendered, so the bank stands at zero once the agreement is terminated.
      - base_policy: nem_modification_transfer_termination
        superseded_clause: >-
          the bank is then settled under termination_disposition.
        replaced_by: >-
          The requested-termination payout is the bank less the early exit charge, less the meter reconfiguration charge and less the open-period holdback, never below zero, multiplied by the paid share and rounded to the cent once.
    trigger: on_request
    subject: [nem_termination, nem_true_up_payout, nem_true_up_forfeiture]
    computes: payout_usd
    target_tool: end_net_metering_on_request_fe4f3e33
    params:
      early_exit_per_kw: 2.50
      early_exit_flat: 75.00
      reconfig_three_phase: 60.00
      reconfig_single_phase: 35.00
      paid_share_dispatch: 0.95
      paid_share_other: 0.85
      holdback_summer: 0.20
      holdback_winter: 0.10
    rule: >-
      This rule governs the customer's own decision to end an operating net metering agreement while keeping
      electric service at the address, under a rider whose termination disposition is cash out. An agreement under a rider whose termination disposition is forfeit is outside this rule; its bank is forfeited at termination as the base rule provides. The requested-termination settlement is not fixed until the bank carries the anniversary cash-out owed for
      every true-up bill issued since permission to operate. The bank settled is the credit bank balance recorded
      on the agreement when the termination is recorded. When the customer ends the agreement while keeping
      electric service at the address, under a rider whose termination disposition is cash out, the
      requested-termination payout is paid by check and the rest of the bank is surrendered, so the bank stands at zero once the agreement is terminated. This rule settles a requested-termination payout of at least the rider's check minimum; a smaller one is credited to the service agreement as the base rule provides. The requested-termination payout is the bank less the early exit
      charge, less the meter reconfiguration charge and less the open-period holdback, never below zero,
      multiplied by the paid share and rounded to the cent once. The open-period holdback is the export credit of
      the most recent billing period in the net metering history times the holdback share, rounded to the cent.
      The surrendered amount is the bank less the requested-termination payout. Under the standard method of the
      requested-termination payout there is no early exit charge, no meter reconfiguration charge and no
      holdback share, and the paid share is 1. Early exit charge of the requested-termination payout: when the
      whole calendar months from the permission to operate date to the termination are fewer than the rider's
      export rate lock years times 12 and a battery is paired with the system, it is the system's nameplate
      capacity in kW AC times the per-kW early exit rate, rounded to the cent; when those months are fewer than
      that and no battery is paired, it is the flat early exit charge; otherwise none. Meter reconfiguration charge of the requested-termination payout: when the meter in service at the address is an AMI Three-Phase Commercial Meter, the three-phase reconfiguration charge; when the meter in service is an AMI Bidirectional Net Meter, the single-phase reconfiguration charge; otherwise, for interval demand and primary metering installations that are reprogrammed remotely, none. Paid share of the requested-termination payout: when the rider
      values exports at the avoided-cost export rates and the customer holds an active demand response
      enrollment, the dispatch paid share; when the rider values exports at the avoided-cost export rates and the
      customer holds no active demand response enrollment, the other paid share; otherwise 1. Holdback share of
      the requested-termination payout: when the most recent service bill of the hosting service agreement is a
      summer bill and its schedule has on-peak hours, the summer holdback share; when that bill is a winter bill
      and the schedule has on-peak hours, the winter holdback share; otherwise none.
    baseline:
      rule: >-
        The requested-termination payout is the bank less the early exit charge, less the meter reconfiguration
        charge and less the open-period holdback, never below zero, multiplied by the paid share and rounded to
        the cent once. The open-period holdback is the export credit of the most recent billing period in the net
        metering history times the holdback share, rounded to the cent. Under the standard method of the
        requested-termination payout there is no early exit charge, no meter reconfiguration charge and no
        holdback share, and the paid share is 1.
      params: []
    prerequisite:
      - problem: nem_ext_anniversary_cash_out
        kind: value_input
        gate: v_bank
        form: state
        policy_source: >-
          The requested-termination settlement is not fixed until the bank carries the anniversary cash-out owed for
          every true-up bill issued since permission to operate.
        condition: >-
          For every service bill dated in the agreement's true_up_month since permission to operate whose bank
          called for a cash-out, the nem_ledger holds an anniversary nem_true_up_payout, and credit_bank_balance
          reflects it.
        resolved_by: settle_anniversary_cash_out_8d85c400
        effect: >-
          Once the anniversary cash-out is booked, v_bank falls to the retained credit, so the requested-termination
          payout and the surrendered amount fall accordingly.
    cross_category:
      - category: service
        as: branch
        reads: [variant_name, service_bills.season]
        note: The hosting service agreement's schedule and latest bill season decide the holdback share.
      - category: meter
        as: branch
        reads: [variant_name, status]
        note: The type of meter in service decides the reconfiguration charge.
      - category: dr
        as: existence
        reads: [status]
        note: An active demand response enrollment selects the dispatch paid share.
    inputs:
      history:
        - {table: nem_ledger, aggregate: latest, field: amount, filters: {event_type: nem_export_credit}}
        - {category: service, table: service_bills, aggregate: latest, field: season, filters: {}}
      cross_category: [service, meter, dr]
    compute:
      - v_bank: "F('credit_bank_balance')"
      - v_months_op: "MONTHS(F('permission_to_operate_date'), NOW)"
      - v_early_exit: "RND(F('system_capacity_kw_ac') * K('early_exit_per_kw'), 2) if (v_months_op < P('export_rate_lock_years') * 12 and F('storage_capacity_kwh') > 0) else (K('early_exit_flat') if (v_months_op < P('export_rate_lock_years') * 12 and F('storage_capacity_kwh') == 0) else 0)"
      - v_meter: "CFIELD('meter', 'variant_name', service_account_id=F('service_account_id'), status='in_service')"
      - v_reconfig: "K('reconfig_three_phase') if v_meter == 'AMI Three-Phase Commercial Meter' else (K('reconfig_single_phase') if v_meter == 'AMI Bidirectional Net Meter' else 0)"
      - v_avoided: "P('credit_basis') == 'avoided_cost_export_rate'"
      - v_dr: "EXISTS('dr', status='active')"
      - v_share: "K('paid_share_dispatch') if (v_avoided and v_dr) else (K('paid_share_other') if (v_avoided and not v_dr) else 1)"
      - v_last_end: "LATEST('nem_ledger', 'billing_period_end', date_field='billing_period_end', event_type='nem_export_credit')"
      - v_last_credit: "SUM('nem_ledger', 'amount', event_type='nem_export_credit', billing_period_end=v_last_end)"
      - v_last_season: "XLATEST('service', 'service_bills', 'season', date_field='bill_date', service_account_id=F('service_account_id'))"
      - v_tou: "CPARAM('service', 'on_peak_hours', service_account_id=F('service_account_id')) != 'none'"
      - v_holdback_share: "K('holdback_summer') if (v_last_season == 'summer' and v_tou) else (K('holdback_winter') if (v_last_season == 'winter' and v_tou) else 0)"
      - v_holdback: "RND(v_last_credit * v_holdback_share, 2)"
      - v_payout: "RND(MX(0, v_bank - v_early_exit - v_reconfig - v_holdback) * v_share, 2)"
      - v_surrender: "RND(v_bank - v_payout, 2)"
      - result: "v_payout"
    compute_basis:
      v_bank: "The bank settled is the credit bank balance recorded on the agreement when the termination is recorded."
      v_months_op: "the whole calendar months from the permission to operate date to the termination"
      v_early_exit: "when the whole calendar months from the permission to operate date to the termination are fewer than the rider's export rate lock years times 12 and a battery is paired with the system, it is the system's nameplate capacity in kW AC times the per-kW early exit rate, rounded to the cent; when those months are fewer than that and no battery is paired, it is the flat early exit charge; otherwise none."
      v_meter: "the meter in service at the address is an AMI Three-Phase Commercial Meter"
      v_reconfig: "when the meter in service at the address is an AMI Three-Phase Commercial Meter, the three-phase reconfiguration charge; when the meter in service is an AMI Bidirectional Net Meter, the single-phase reconfiguration charge; otherwise, for interval demand and primary metering installations that are reprogrammed remotely, none."
      v_avoided: "the rider values exports at the avoided-cost export rates"
      v_dr: "the customer holds an active demand response enrollment"
      v_share: "when the rider values exports at the avoided-cost export rates and the customer holds an active demand response enrollment, the dispatch paid share; when the rider values exports at the avoided-cost export rates and the customer holds no active demand response enrollment, the other paid share; otherwise 1."
      v_last_end: "the most recent billing period in the net metering history"
      v_last_credit: "the export credit of the most recent billing period in the net metering history"
      v_last_season: "when the most recent service bill of the hosting service agreement is a summer bill"
      v_tou: "its schedule has on-peak hours"
      v_holdback_share: "when the most recent service bill of the hosting service agreement is a summer bill and its schedule has on-peak hours, the summer holdback share; when that bill is a winter bill and the schedule has on-peak hours, the winter holdback share; otherwise none."
      v_holdback: "The open-period holdback is the export credit of the most recent billing period in the net metering history times the holdback share, rounded to the cent."
      v_payout: "The requested-termination payout is the bank less the early exit charge, less the meter reconfiguration charge and less the open-period holdback, never below zero, multiplied by the paid share and rounded to the cent once."
      v_surrender: "The surrendered amount is the bank less the requested-termination payout."
      result: "the requested-termination payout is paid by check and the rest of the bank is surrendered"
    factors:
      - id: early_exit_charge
        effect: method
        decides: v_early_exit
        bindings: [v_months_op, v_early_exit]
        ladder:
          - when: "fewer whole months since permission to operate than the export rate lock years times 12 and a battery paired"
            method: "nameplate kW AC times K('early_exit_per_kw'), rounded to the cent"
          - when: "fewer such months and no battery paired"
            method: "the flat charge K('early_exit_flat')"
          - when: "otherwise"
            method: "no early exit charge"
        baseline:
          v_early_exit: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: meter_reconfiguration_charge
        effect: parameter
        decides: v_reconfig
        bindings: [v_meter, v_reconfig]
        ladder:
          - when: "the meter in service at the address is an AMI Three-Phase Commercial Meter"
            value: "K('reconfig_three_phase')"
          - when: "the meter in service is an AMI Bidirectional Net Meter"
            value: "K('reconfig_single_phase')"
          - when: "otherwise (interval demand or primary metering installation)"
            value: "0"
        baseline:
          v_reconfig: "0"
        evidence: [cross_category]
        cross_difficulty: meter
      - id: termination_paid_share
        effect: parameter
        decides: v_share
        bindings: [v_avoided, v_dr, v_share]
        ladder:
          - when: "avoided-cost rider and the customer holds an active demand response enrollment"
            value: "K('paid_share_dispatch')"
          - when: "avoided-cost rider and no active demand response enrollment"
            value: "K('paid_share_other')"
          - when: "otherwise"
            value: "1"
        baseline:
          v_share: "1"
        evidence: [cross_category, tier_param]
        cross_difficulty: null
      - id: open_period_holdback
        effect: parameter
        decides: v_holdback_share
        bindings: [v_last_end, v_last_credit, v_last_season, v_tou, v_holdback_share, v_holdback]
        ladder:
          - when: "the most recent service bill is a summer bill and the schedule has on-peak hours"
            value: "K('holdback_summer')"
          - when: "the most recent service bill is a winter bill and the schedule has on-peak hours"
            value: "K('holdback_winter')"
          - when: "otherwise"
            value: "0"
        baseline:
          v_holdback_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
