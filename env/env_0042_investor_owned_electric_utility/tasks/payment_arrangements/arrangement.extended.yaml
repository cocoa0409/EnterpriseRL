events:
  # ---- holding (arrangement_plans) --------------------------------------------
  - type: arrangement_enrollment
    target: arrangement_plans
    mutation: create
    meaning: The customer accepts a payment arrangement for the past-due balance of one service agreement.
    grain: One row per arrangement enrolled.
    fields:
      customer_id: The customer of record on the service agreement.
      service_account_id: The service agreement whose balance is placed under the plan.
      variant_name: The arrangement kind, official full name.
      enrolled_date: Date the customer accepted the plan.
      enrollment_channel: Whether the plan was set up by an agent or through online self-service.
      disconnected_at_enrollment: Whether the service agreement was disconnected when the plan was enrolled.
      eligible_balance: Balance placed under the plan under the plan's eligible_balance_basis.
      down_payment_waived: Whether the down payment was waived for a current income qualification.
      down_payment_amount: Down payment required before activation.
      down_payment_due_date: Last day for the down payment.
      deferred_amount: Eligible balance less the down payment.
      installment_count: Number of installments chosen by the customer.
      installment_amount: Regular installment amount; the final installment carries the remainder.
      status_date: Date of enrollment.
    triggers: []
  - type: arrangement_activation
    target: arrangement_plans
    mutation: {transition: {from: pending_down_payment, to: active}}
    meaning: The plan becomes active once the down payment is received or immediately when none is required.
    grain: One row per transaction.
    fields:
      status_date: Date the plan became active.
    triggers:
      - event: arrangement:arrangement_arrears_deferral
        map: {deferral_kind: initial, posting_date: status_date}
  - type: arrangement_lapse
    target: arrangement_plans
    mutation: {transition: {from: pending_down_payment, to: cancelled}}
    meaning: The plan lapses because the down payment was not received by its due date.
    grain: One row per transaction.
    fields:
      status_date: Day after the down payment due date.
    triggers: []
  - type: arrangement_completion
    target: arrangement_plans
    mutation: {transition: {from: active, to: completed}}
    meaning: The plan is completed — all installments billed and paid or forgiven, or the balance paid off early.
    grain: One row per transaction.
    fields:
      status_date: Date the plan was completed.
    triggers: []
  - type: arrangement_default
    target: arrangement_plans
    mutation: {transition: {from: active, to: defaulted}}
    meaning: The plan defaults because missed installments reached the default count.
    grain: One row per transaction.
    fields:
      status_date: Date the plan defaulted.
    triggers:
      - event: arrangement:arrangement_balance_return
        map: {return_reason: default, posting_date: status_date}
  - type: arrangement_reinstatement
    target: arrangement_plans
    mutation: {transition: {from: defaulted, to: active}}
    meaning: A defaulted plan is reinstated after the missed installments are paid.
    grain: One row per transaction.
    fields:
      status_date: Date the plan was reinstated.
    triggers:
      - event: arrangement:arrangement_arrears_deferral
        map: {deferral_kind: reinstatement, posting_date: status_date}
  - type: arrangement_cancellation
    target: arrangement_plans
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The plan ends because its service agreement closed and the plan could not move.
    grain: One row per transaction.
    fields:
      status_date: Date the plan was cancelled.
    triggers:
      - event: arrangement:arrangement_balance_return
        map: {return_reason: service_closure, posting_date: status_date}
  - type: arrangement_renegotiation
    target: arrangement_plans
    mutation: update
    meaning: The installment count of an active plan is changed for a change in the customer's circumstances.
    grain: One row per transaction.
    fields:
      installment_count: New total number of installments, counting those already billed.
      installment_amount: New regular installment for the installments not yet billed.
    triggers: []
  - type: arrangement_account_transfer
    target: arrangement_plans
    mutation: update
    meaning: An active plan moves with the customer to the customer's new service agreement after a move.
    grain: One row per transaction.
    fields:
      service_account_id: The new service agreement that will carry the remaining installments.
    triggers: []
  # ---- ledger (arrangement_ledger) ----------------------------------------------
  - type: arrangement_arrears_deferral
    target: arrangement_ledger
    meaning: Past-due charges are moved off the service agreement's collectible balance into the plan.
    grain: One row per deferral (activation or reinstatement).
    distinguish_by: [deferral_kind, posting_date]
    fields:
      posting_date: Date the deferral was booked.
      amount: Amount deferred into the plan.
      deferral_kind: Initial deferral at activation or re-deferral at reinstatement.
    account: arrangement_balance
    direction: in
    triggers:
      - event: service:service_program_credit
        map: {posting_date: posting_date, amount: amount, credit_code: arrangement_deferral, source_reference_id: arrangement_ledger_id}
  - type: arrangement_installment_billing
    target: arrangement_ledger
    meaning: One installment is taken out of the plan and billed on the service agreement's bill.
    grain: One row per installment billed.
    distinguish_by: [installment_number]
    fields:
      posting_date: Bill date of the bill carrying the installment.
      amount: Installment amount billed.
      installment_number: Position of the installment in the plan (1 = first).
      bill_id: The service bill carrying the installment.
    account: arrangement_balance
    direction: out
    triggers:
      - event: service:service_program_debit
        map: {posting_date: posting_date, amount: amount, charge_code: arrangement_installment, source_reference_id: arrangement_ledger_id}
  - type: arrangement_forgiveness
    target: arrangement_ledger
    meaning: One scheduled installment of an Arrearage Management Program plan is forgiven because the current bill was paid in full on time.
    grain: One row per installment forgiven.
    distinguish_by: [installment_number]
    fields:
      posting_date: Date the forgiveness was posted.
      amount: Amount forgiven.
      installment_number: Scheduled installment forgiven.
      bill_id: The service bill whose on-time payment earned the forgiveness.
    account: arrangement_balance
    direction: out
    triggers: []
  - type: arrangement_balance_return
    target: arrangement_ledger
    meaning: The remaining plan balance is returned to the service agreement as a charge due immediately.
    grain: One row per return (default, closure or early payoff).
    distinguish_by: [return_reason, posting_date]
    fields:
      posting_date: Date the balance was returned.
      amount: Remaining plan balance returned.
      return_reason: Why the balance was returned.
    account: arrangement_balance
    direction: out
    triggers:
      - event: service:service_program_debit
        map: {posting_date: posting_date, amount: amount, charge_code: arrangement_balance_return, source_reference_id: arrangement_ledger_id}
  - type: arrangement_missed_installment
    target: arrangement_ledger
    meaning: An installment (or, for the Arrearage Management Program, a current bill) is recorded as missed after its cure period ended unpaid.
    grain: One row per installment counted as missed.
    distinguish_by: [installment_number]
    fields:
      posting_date: Date the installment was counted as missed (the day after the cure period ended).
      amount: Unpaid amount of the installment or current bill.
      installment_number: Installment counted as missed.
      bill_id: The service bill that carried the missed installment or current charges.
    triggers: []

measures:
  - id: arrangement_msr_enrollments_12m
    window: The 12 calendar months ending on the handling date.
    measure: Count of arrangement_plans rows of the same variant_name on the same service agreement whose enrolled_date falls in the window, in any status.
  - id: arrangement_msr_last_default_date
    window: The customer's whole history across all service agreements.
    measure: The latest posting_date of an arrangement_balance_return row with return_reason default on any of the customer's plans; empty when none.
  - id: arrangement_msr_open_missed
    window: The plan since its latest activation or reinstatement.
    measure: Count of arrangement_missed_installment rows on the plan posted in the window.
  - id: arrangement_msr_reinstatements
    window: The plan's whole life.
    measure: Count of arrangement_arrears_deferral rows on the plan with deferral_kind reinstatement.
  - id: arrangement_msr_customer_forgiven_total
    window: The customer's whole history across all service agreements.
    measure: Sum of amount of arrangement_forgiveness rows on all of the customer's Arrearage Management Program plans.
  - id: arrangement_msr_last_completion_date
    window: The customer's whole history across all service agreements.
    measure: The latest status_date of an arrangement_plans row of the same variant_name in completed status; empty when none.

policies:
  - id: arrangement_agg_multi_holding
    subject: [arrangement_enrollment]
    rule: >-
      A customer may hold arrangements on several service agreements at the same time, one per service
      agreement. No other plan on the same service agreement is in pending_down_payment, active or defaulted
      status. A defaulted plan that is still inside its reinstatement window therefore blocks a new plan on
      that agreement until the window ends or the plan is reinstated. Plans on different service agreements of
      the same customer are decided independently except where a rule of this program counts the customer's
      whole history (defaults and Arrearage Management Program forgiveness).
    eligibility:
      - id: one_open_plan_per_agreement
        applies_to: [arrangement_enrollment]
        kind: dedup
        condition: "No other plan on the same service agreement is in pending_down_payment, active or defaulted status."
        evidence_fields: [arrangement_plans.service_account_id, arrangement_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangement_plans.service_account_id]
          action_bindings:
            arrangement_plans.service_account_id: service_account_id
        dedup_contract:
          table: arrangement_plans
          mode: separate_record
          object_bindings: {service_account_id: service_account_id}
          duplicate_filters: {status: [pending_down_payment, active, defaulted]}
          distinct_fields: [enrolled_date]
    params:
      max_per_customer: null

  - id: arrangement_agg_forgiveness_cap
    subject: [arrangement_forgiveness, arrangement_enrollment]
    rule: >-
      Arrearage Management Program forgiveness is capped per customer, not per plan. The cap is the
      program's forgiveness_cap_per_customer_usd and is measured by arrangement_msr_customer_forgiven_total
      across every service agreement the customer has held. At enrollment the eligible balance placed under a
      new Arrearage Management Program plan may not exceed the cap less the amount already forgiven; any part
      of the past-due balance above that remaining room stays on the service agreement and may be placed in a
      separate repayment plan only after the program plan ends. A forgiveness that would carry the customer's
      total past the cap is reduced to the remaining room, and once the room is zero the remaining scheduled
      installments are billed as ordinary installments instead of being forgiven.
    eligibility: []
    params:
      per_tier:
        Payment Extension: {forgiveness_cap: "=forgiveness_cap_per_customer_usd"}
        Short-Term Installment Plan: {forgiveness_cap: "=forgiveness_cap_per_customer_usd"}
        Standard Deferred Payment Agreement: {forgiveness_cap: "=forgiveness_cap_per_customer_usd"}
        Extended Deferred Payment Agreement: {forgiveness_cap: "=forgiveness_cap_per_customer_usd"}
        Winter Protection Plan: {forgiveness_cap: "=forgiveness_cap_per_customer_usd"}
        Arrearage Management Program: {forgiveness_cap: "=forgiveness_cap_per_customer_usd"}
        Commercial Deferred Payment Agreement: {forgiveness_cap: "=forgiveness_cap_per_customer_usd"}
    formula:
      enrollment_room: "forgiveness_cap_per_customer_usd - arrangement_msr_customer_forgiven_total"
      forgiveness_amount: "min(amount, forgiveness_cap_per_customer_usd - arrangement_msr_customer_forgiven_total)"
    measures: [arrangement_msr_customer_forgiven_total]

  - id: arrangement_enrollment_eligibility
    subject: [arrangement_enrollment]
    rule: >-
      A plan is offered only on a service agreement held by the caller's customer profile, and the plan kind
      must match the profile's customer_type under the entry requirements of that kind. The service agreement
      must be in active, notice_pending or disconnected status; a closed or pending_start agreement cannot
      take a plan. A plan whose available_after_disconnection is false is not enrolled on a disconnected
      agreement. The eligible balance, under the plan's eligible_balance_basis, must lie between
      min_past_due_usd and max_past_due_usd, and the oldest unpaid bill must be at least min_arrears_age_days
      past its due date. The service agreement's start_date must be at least min_service_months before the
      enrollment date. The enrollment date must fall inside the plan's enrollment_window. Income
      qualification is current when the customer's income_qualified_until is on or after the enrollment date.
      The Extended Deferred Payment Agreement requires a current income qualification or a medical
      certification on the agreement in active status, and an active budget billing plan on the same
      agreement. The Winter Protection Plan requires electric space heating and either a current income
      qualification or an account holder aged at least senior_age_min on the enrollment date. The Arrearage
      Management Program requires a current income qualification. After a default on any of the customer's
      plans, only a Payment Extension may be enrolled until the default lockout has passed. The lockout is
      counted in calendar months from the posting date of the most recent default, and it has passed on the
      same day of the month default_lockout_months later or, if that month is shorter, on its last day. The
      number of plans of the same kind enrolled on the agreement in the past 12 months
      (arrangement_msr_enrollments_12m) must be below max_enrollments_per_12_months, and a customer who
      completed an Arrearage Management Program plan may not enroll in it again within
      completion_cooldown_months of that completion. The customer chooses the installment count between
      installment_count_min and installment_count_max, or installment_count_after_disconnection_max when the
      agreement is disconnected at enrollment. A deferred amount above agent_approval_max_deferred_usd cannot
      be approved by a customer care agent and is handed to a human representative as not covered by policy.
      The arrangement is a commitment of the customer, so it is created only on the customer's own acceptance
      of the stated terms.
    eligibility:
      - id: agreement_can_take_plan
        applies_to: [arrangement_enrollment]
        kind: state
        condition: "The service agreement must be in active, notice_pending or disconnected status; a closed or pending_start agreement cannot take a plan."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active, notice_pending, disconnected]
      - id: default_lockout_passed
        applies_to: [arrangement_enrollment]
        kind: time
        condition: "After a default on any of the customer's plans, only a Payment Extension may be enrolled until the default lockout has passed."
        evidence_fields: [arrangement_ledger.posting_date, arrangement_ledger.return_reason, arrangement_ledger.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangement_ledger.customer_id]
          action_bindings:
            arrangement_ledger.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: a default on any of the customer's plans
          anchor_source: arrangement_ledger.posting_date
          relation: not_before
          duration_source: variants.default_lockout_months
          unit: calendar_months
          counting_rule: "The lockout is counted in calendar months from the posting date of the most recent default, and it has passed on the same day of the month default_lockout_months later or, if that month is shorter, on its last day."
          boundary: inclusive
      - id: customer_chooses_installments
        applies_to: [arrangement_enrollment]
        kind: caller_fact
        condition: "The customer chooses the installment count between installment_count_min and installment_count_max, or installment_count_after_disconnection_max when the agreement is disconnected at enrollment."
        evidence_fields: [arrangement_plans.installment_count, arrangement_plans.service_account_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [arrangement_plans.service_account_id]
          action_bindings:
            arrangement_plans.service_account_id: service_account_id
    params:
      per_tier:
        Payment Extension: {min_balance: "=min_past_due_usd", max_balance: "=max_past_due_usd", lockout_months: "=default_lockout_months", after_disconnection: "=available_after_disconnection"}
        Short-Term Installment Plan: {min_balance: "=min_past_due_usd", max_balance: "=max_past_due_usd", lockout_months: "=default_lockout_months", after_disconnection: "=available_after_disconnection"}
        Standard Deferred Payment Agreement: {min_balance: "=min_past_due_usd", max_balance: "=max_past_due_usd", lockout_months: "=default_lockout_months", after_disconnection: "=available_after_disconnection"}
        Extended Deferred Payment Agreement: {min_balance: "=min_past_due_usd", max_balance: "=max_past_due_usd", lockout_months: "=default_lockout_months", after_disconnection: "=available_after_disconnection"}
        Winter Protection Plan: {min_balance: "=min_past_due_usd", max_balance: "=max_past_due_usd", lockout_months: "=default_lockout_months", after_disconnection: "=available_after_disconnection"}
        Arrearage Management Program: {min_balance: "=min_past_due_usd", max_balance: "=max_past_due_usd", lockout_months: "=default_lockout_months", after_disconnection: "=available_after_disconnection"}
        Commercial Deferred Payment Agreement: {min_balance: "=min_past_due_usd", max_balance: "=max_past_due_usd", lockout_months: "=default_lockout_months", after_disconnection: "=available_after_disconnection"}
    measures: [arrangement_msr_enrollments_12m, arrangement_msr_last_default_date, arrangement_msr_last_completion_date]

  - id: arrangement_terms_calculation
    subject: [arrangement_enrollment]
    rule: >-
      The eligible balance is the past-due balance of the service agreement on the enrollment date (bills
      past their due date plus posted charges, less payments and credits) for plans whose
      eligible_balance_basis is past_due_balance, and the whole account balance for plans whose basis is
      total_balance, capped for Arrearage Management Program plans by the customer's remaining forgiveness
      room. The down payment is the eligible balance times down_payment_pct, or times
      post_disconnection_down_payment_pct when the agreement is disconnected at enrollment, rounded to the cent
      and raised to down_payment_min_usd, but never more than the eligible balance; it is zero for plans
      whose down_payment_pct is zero. When down_payment_waived_income_qualified is true and the customer's
      income qualification is current on the enrollment date, the down payment is waived and recorded as
      zero with down_payment_waived true. The deferred amount is the eligible balance less the down payment.
      The installment count chosen by the customer is reduced, one at a time, until the regular installment
      reaches minimum_installment_usd, but never below installment_count_min; a balance that cannot meet the
      minimum at installment_count_min is not placed in that plan. The regular installment is the deferred
      amount divided by the count, rounded down to the cent, and the final installment carries the remainder.
      The down payment is due down_payment_due_days calendar days after enrollment. For a Payment Extension the
      single installment is billed on the extended due date, which is chosen by the customer and lies no more
      than extension_max_days calendar days after the enrollment date.
    eligibility: []
    params:
      per_tier:
        Payment Extension: {dp_pct: "=down_payment_pct", dp_pct_disconnected: "=post_disconnection_down_payment_pct", dp_min: "=down_payment_min_usd", min_installment: "=minimum_installment_usd"}
        Short-Term Installment Plan: {dp_pct: "=down_payment_pct", dp_pct_disconnected: "=post_disconnection_down_payment_pct", dp_min: "=down_payment_min_usd", min_installment: "=minimum_installment_usd"}
        Standard Deferred Payment Agreement: {dp_pct: "=down_payment_pct", dp_pct_disconnected: "=post_disconnection_down_payment_pct", dp_min: "=down_payment_min_usd", min_installment: "=minimum_installment_usd"}
        Extended Deferred Payment Agreement: {dp_pct: "=down_payment_pct", dp_pct_disconnected: "=post_disconnection_down_payment_pct", dp_min: "=down_payment_min_usd", min_installment: "=minimum_installment_usd"}
        Winter Protection Plan: {dp_pct: "=down_payment_pct", dp_pct_disconnected: "=post_disconnection_down_payment_pct", dp_min: "=down_payment_min_usd", min_installment: "=minimum_installment_usd"}
        Arrearage Management Program: {dp_pct: "=down_payment_pct", dp_pct_disconnected: "=post_disconnection_down_payment_pct", dp_min: "=down_payment_min_usd", min_installment: "=minimum_installment_usd"}
        Commercial Deferred Payment Agreement: {dp_pct: "=down_payment_pct", dp_pct_disconnected: "=post_disconnection_down_payment_pct", dp_min: "=down_payment_min_usd", min_installment: "=minimum_installment_usd"}
    formula:
      applicable_pct: "post_disconnection_down_payment_pct if disconnected_at_enrollment else down_payment_pct"
      down_payment_amount: "0 if (down_payment_waived or applicable_pct == 0) else min(eligible_balance, max(down_payment_min_usd, round(eligible_balance * applicable_pct, 2)))"
      deferred_amount: "eligible_balance - down_payment_amount"
      installment_amount: "(deferred_amount * 100 // installment_count) / 100"
      final_installment_amount: "deferred_amount - installment_amount * (installment_count - 1)"

  - id: arrangement_activation_rule
    subject: [arrangement_activation, arrangement_lapse, arrangement_arrears_deferral]
    rule: >-
      A plan with no down payment (zero or waived) is activated on its enrollment date. A plan with a down
      payment is activated when payments posted to the service agreement on or after the enrollment date reach
      the down payment amount; payments from an energy assistance agency count only where
      assistance_pledge_counts_toward_down_payment is true. Activation requires the down payment to be
      received no later than the down payment due date. The due date is enrollment_date plus
      down_payment_due_days calendar days, and a payment posted on the due date itself is in time. A plan whose
      down payment is not received in time lapses on the day after the due date and its balance never leaves
      the service agreement. On activation, and again on reinstatement, the deferred amount (or on
      reinstatement the remaining unbilled plan balance) is booked into the plan and credited off the service
      agreement's collectible balance; a deferral is booked only on a plan in active status.
    eligibility:
      - id: down_payment_in_time
        applies_to: [arrangement_activation]
        kind: time
        condition: "Activation requires the down payment to be received no later than the down payment due date."
        evidence_fields: [arrangement_plans.down_payment_due_date, arrangement_plans.arrangement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangement_plans.arrangement_id]
          action_bindings:
            arrangement_plans.arrangement_id: arrangement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the down payment due date
          anchor_source: arrangement_plans.down_payment_due_date
          relation: not_after
          duration_source: params.due_date_offset_days
          unit: calendar_days
          counting_rule: "The due date is enrollment_date plus down_payment_due_days calendar days, and a payment posted on the due date itself is in time."
          boundary: inclusive
      - id: deferral_on_active_plan
        applies_to: [arrangement_arrears_deferral]
        kind: state
        condition: "a deferral is booked only on a plan in active status."
        evidence_fields: [arrangement_plans.status, arrangement_plans.arrangement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangement_plans.arrangement_id]
          action_bindings:
            arrangement_plans.arrangement_id: arrangement_id
        state_contract:
          field: arrangement_plans.status
          allowed: [active]
    params:
      due_date_offset_days: 0
      per_tier:
        Payment Extension: {down_payment_due_days: "=down_payment_due_days", pledge_counts: "=assistance_pledge_counts_toward_down_payment"}
        Short-Term Installment Plan: {down_payment_due_days: "=down_payment_due_days", pledge_counts: "=assistance_pledge_counts_toward_down_payment"}
        Standard Deferred Payment Agreement: {down_payment_due_days: "=down_payment_due_days", pledge_counts: "=assistance_pledge_counts_toward_down_payment"}
        Extended Deferred Payment Agreement: {down_payment_due_days: "=down_payment_due_days", pledge_counts: "=assistance_pledge_counts_toward_down_payment"}
        Winter Protection Plan: {down_payment_due_days: "=down_payment_due_days", pledge_counts: "=assistance_pledge_counts_toward_down_payment"}
        Arrearage Management Program: {down_payment_due_days: "=down_payment_due_days", pledge_counts: "=assistance_pledge_counts_toward_down_payment"}
        Commercial Deferred Payment Agreement: {down_payment_due_days: "=down_payment_due_days", pledge_counts: "=assistance_pledge_counts_toward_down_payment"}

  - id: arrangement_installment_billing_rule
    subject: [arrangement_installment_billing]
    rule: >-
      Installments are billed one per regular bill of the service agreement, starting with the bill named
      by installment_start_rule, numbered from 1 in billing order and continuing after a reinstatement or
      renegotiation. Each installment number is billed once. An installment is billed only while the plan is
      active. The billed installment is the regular installment amount except the last, which carries the
      remainder of the plan balance, and it falls due on the due date of the bill that carries it. Installments
      of an Arrearage Management Program plan are billed only when forgiveness is withheld or the forgiveness
      room is exhausted. Early payoff is made by the customer paying the remaining plan balance; it is booked
      as a return of the balance with return_reason early_payoff and completes the plan.
    eligibility:
      - id: bill_each_installment_once
        applies_to: [arrangement_installment_billing]
        kind: dedup
        condition: "Each installment number is billed once."
        evidence_fields: [arrangement_ledger.arrangement_id, arrangement_ledger.installment_number, arrangement_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangement_ledger.arrangement_id, arrangement_ledger.installment_number]
          action_bindings:
            arrangement_ledger.arrangement_id: arrangement_id
            arrangement_ledger.installment_number: installment_number
        dedup_contract:
          table: arrangement_ledger
          mode: separate_record
          object_bindings: {arrangement_id: arrangement_id, installment_number: installment_number}
          duplicate_filters: {event_type: [arrangement_installment_billing, arrangement_forgiveness]}
          distinct_fields: []
      - id: billing_on_active_plan
        applies_to: [arrangement_installment_billing]
        kind: state
        condition: "An installment is billed only while the plan is active."
        evidence_fields: [arrangement_plans.status, arrangement_plans.arrangement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangement_plans.arrangement_id]
          action_bindings:
            arrangement_plans.arrangement_id: arrangement_id
        state_contract:
          field: arrangement_plans.status
          allowed: [active]

  - id: arrangement_default_and_cure
    subject: [arrangement_missed_installment, arrangement_default, arrangement_balance_return]
    rule: >-
      An installment is paid when payments to the service agreement applied oldest charges first cover it,
      less a shortfall of no more than installment_tolerance_usd, by the end of its cure period. An installment
      counts as missed only when it is still unpaid after the cure period that follows its due date. The cure
      period is cure_period_days calendar days counted from the day after the installment's due date, extended
      by medical_cure_extension_days when a medical certification on the agreement is active on the due date,
      and a payment posted on the last cure day is in time. Where current_bill_payment_required is true, the
      current charges of each bill carrying an installment are treated the same way, and an unpaid current
      bill after its cure period is recorded as a missed installment of the installment that bill carries. The
      plan defaults when arrangement_msr_open_missed reaches missed_installments_to_default; on default the
      remaining plan balance is returned to the service agreement and is immediately past due, and the
      disconnection process may start again only with a new written notice. A missed installment that is later
      paid is not removed from the count, except through reinstatement.
    eligibility:
      - id: cure_period_ended
        applies_to: [arrangement_missed_installment]
        kind: time
        condition: "An installment counts as missed only when it is still unpaid after the cure period that follows its due date."
        evidence_fields: [service_bills.due_date, service_bills.bill_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_bills.bill_id]
          action_bindings:
            service_bills.bill_id: bill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: its due date
          anchor_source: service_bills.due_date
          relation: not_before
          duration_source: variants.cure_period_days
          unit: calendar_days
          counting_rule: "The cure period is cure_period_days calendar days counted from the day after the installment's due date, extended by medical_cure_extension_days when a medical certification on the agreement is active on the due date, and a payment posted on the last cure day is in time."
          boundary: exclusive
      - id: record_each_miss_once
        applies_to: [arrangement_missed_installment]
        kind: dedup
        condition: "A missed installment that is later paid is not removed from the count, except through reinstatement."
        evidence_fields: [arrangement_ledger.arrangement_id, arrangement_ledger.installment_number, arrangement_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangement_ledger.arrangement_id, arrangement_ledger.installment_number]
          action_bindings:
            arrangement_ledger.arrangement_id: arrangement_id
            arrangement_ledger.installment_number: installment_number
        dedup_contract:
          table: arrangement_ledger
          mode: separate_record
          object_bindings: {arrangement_id: arrangement_id, installment_number: installment_number}
          duplicate_filters: {event_type: [arrangement_missed_installment]}
          distinct_fields: []
    params:
      per_tier:
        Payment Extension: {cure_days: "=cure_period_days", medical_extension: "=medical_cure_extension_days", default_count: "=missed_installments_to_default"}
        Short-Term Installment Plan: {cure_days: "=cure_period_days", medical_extension: "=medical_cure_extension_days", default_count: "=missed_installments_to_default"}
        Standard Deferred Payment Agreement: {cure_days: "=cure_period_days", medical_extension: "=medical_cure_extension_days", default_count: "=missed_installments_to_default"}
        Extended Deferred Payment Agreement: {cure_days: "=cure_period_days", medical_extension: "=medical_cure_extension_days", default_count: "=missed_installments_to_default"}
        Winter Protection Plan: {cure_days: "=cure_period_days", medical_extension: "=medical_cure_extension_days", default_count: "=missed_installments_to_default"}
        Arrearage Management Program: {cure_days: "=cure_period_days", medical_extension: "=medical_cure_extension_days", default_count: "=missed_installments_to_default"}
        Commercial Deferred Payment Agreement: {cure_days: "=cure_period_days", medical_extension: "=medical_cure_extension_days", default_count: "=missed_installments_to_default"}
    measures: [arrangement_msr_open_missed]

  - id: arrangement_reinstatement_rule
    subject: [arrangement_reinstatement]
    rule: >-
      A defaulted plan may be reinstated only where reinstatement_allowed_count is above zero and
      arrangement_msr_reinstatements is below it. Reinstatement must be requested no later than the
      reinstatement window after the date the plan defaulted. The window is counted in calendar days from the
      day after the default date, and a request on the last day is accepted. Before reinstatement the customer
      must have paid reinstatement_missed_payment_pct of all installments recorded as missed, through payments
      posted to the service agreement after the default. On reinstatement the plan returns to active, the
      missed-installment count restarts from zero, the returned balance is deferred into the plan again, and
      the remaining installments keep their numbers and amounts. A plan that cannot be reinstated stays
      defaulted, and its balance stays due on the service agreement.
    eligibility:
      - id: within_reinstatement_window
        applies_to: [arrangement_reinstatement]
        kind: time
        condition: "Reinstatement must be requested no later than the reinstatement window after the date the plan defaulted."
        evidence_fields: [arrangement_plans.status_date, arrangement_plans.arrangement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangement_plans.arrangement_id]
          action_bindings:
            arrangement_plans.arrangement_id: arrangement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the plan defaulted
          anchor_source: arrangement_plans.status_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from the day after the default date, and a request on the last day is accepted."
          boundary: inclusive
    params:
      per_tier:
        Payment Extension: {allowed: "=reinstatement_allowed_count", window_days: "=reinstatement_window_days", missed_pct: "=reinstatement_missed_payment_pct"}
        Short-Term Installment Plan: {allowed: "=reinstatement_allowed_count", window_days: "=reinstatement_window_days", missed_pct: "=reinstatement_missed_payment_pct"}
        Standard Deferred Payment Agreement: {allowed: "=reinstatement_allowed_count", window_days: "=reinstatement_window_days", missed_pct: "=reinstatement_missed_payment_pct"}
        Extended Deferred Payment Agreement: {allowed: "=reinstatement_allowed_count", window_days: "=reinstatement_window_days", missed_pct: "=reinstatement_missed_payment_pct"}
        Winter Protection Plan: {allowed: "=reinstatement_allowed_count", window_days: "=reinstatement_window_days", missed_pct: "=reinstatement_missed_payment_pct"}
        Arrearage Management Program: {allowed: "=reinstatement_allowed_count", window_days: "=reinstatement_window_days", missed_pct: "=reinstatement_missed_payment_pct"}
        Commercial Deferred Payment Agreement: {allowed: "=reinstatement_allowed_count", window_days: "=reinstatement_window_days", missed_pct: "=reinstatement_missed_payment_pct"}
    measures: [arrangement_msr_reinstatements]

  - id: arrangement_amp_forgiveness
    subject: [arrangement_forgiveness]
    rule: >-
      In an Arrearage Management Program plan each scheduled installment is forgiven instead of billed when the
      current charges of the bill that carries it are paid in full by that bill's due date. The forgiveness is
      forgiveness_share_per_installment of the scheduled installment and is posted under
      forgiveness_posting_rule. When the current bill is not paid in full by its due date, the forgiveness for
      that installment is withheld; where forgiveness_catch_up_allowed is true, withheld forgiveness is posted
      once that bill is paid in full, as long as the plan is still active and no default has occurred. Each
      installment number is forgiven at most once and is never both forgiven and billed. Forgiveness is
      posted only on a plan in active status. The customer total is limited by arrangement_agg_forgiveness_cap.
      Repayment plans never forgive.
    eligibility:
      - id: forgive_on_active_plan
        applies_to: [arrangement_forgiveness]
        kind: state
        condition: "Forgiveness is posted only on a plan in active status."
        evidence_fields: [arrangement_plans.status, arrangement_plans.arrangement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangement_plans.arrangement_id]
          action_bindings:
            arrangement_plans.arrangement_id: arrangement_id
        state_contract:
          field: arrangement_plans.status
          allowed: [active]
      - id: forgive_each_installment_once
        applies_to: [arrangement_forgiveness]
        kind: dedup
        condition: "Each installment number is forgiven at most once and is never both forgiven and billed."
        evidence_fields: [arrangement_ledger.arrangement_id, arrangement_ledger.installment_number, arrangement_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangement_ledger.arrangement_id, arrangement_ledger.installment_number]
          action_bindings:
            arrangement_ledger.arrangement_id: arrangement_id
            arrangement_ledger.installment_number: installment_number
        dedup_contract:
          table: arrangement_ledger
          mode: separate_record
          object_bindings: {arrangement_id: arrangement_id, installment_number: installment_number}
          duplicate_filters: {event_type: [arrangement_forgiveness, arrangement_installment_billing]}
          distinct_fields: []
    params:
      per_tier:
        Payment Extension: {share: "=forgiveness_share_per_installment", catch_up: "=forgiveness_catch_up_allowed"}
        Short-Term Installment Plan: {share: "=forgiveness_share_per_installment", catch_up: "=forgiveness_catch_up_allowed"}
        Standard Deferred Payment Agreement: {share: "=forgiveness_share_per_installment", catch_up: "=forgiveness_catch_up_allowed"}
        Extended Deferred Payment Agreement: {share: "=forgiveness_share_per_installment", catch_up: "=forgiveness_catch_up_allowed"}
        Winter Protection Plan: {share: "=forgiveness_share_per_installment", catch_up: "=forgiveness_catch_up_allowed"}
        Arrearage Management Program: {share: "=forgiveness_share_per_installment", catch_up: "=forgiveness_catch_up_allowed"}
        Commercial Deferred Payment Agreement: {share: "=forgiveness_share_per_installment", catch_up: "=forgiveness_catch_up_allowed"}

  - id: arrangement_completion_and_closure
    subject: [arrangement_completion, arrangement_cancellation, arrangement_lapse]
    rule: >-
      A plan is completed when its plan balance reaches zero through billed installments that have been paid,
      forgiveness, or an early payoff, and no installment is left unpaid past its cure period. When the service
      agreement carrying an active plan closes, the plan moves to the customer's new service agreement where
      transfer_on_move_allowed is true and the customer has opened one; otherwise the plan is cancelled and its
      remaining balance is returned to the closing agreement, where it becomes part of the final bill. A
      lapsed plan (down payment not received) has no balance to return.
    eligibility: []
    params:
      per_tier:
        Payment Extension: {transfer_on_move: "=transfer_on_move_allowed", early_payoff: "=early_payoff_allowed"}
        Short-Term Installment Plan: {transfer_on_move: "=transfer_on_move_allowed", early_payoff: "=early_payoff_allowed"}
        Standard Deferred Payment Agreement: {transfer_on_move: "=transfer_on_move_allowed", early_payoff: "=early_payoff_allowed"}
        Extended Deferred Payment Agreement: {transfer_on_move: "=transfer_on_move_allowed", early_payoff: "=early_payoff_allowed"}
        Winter Protection Plan: {transfer_on_move: "=transfer_on_move_allowed", early_payoff: "=early_payoff_allowed"}
        Arrearage Management Program: {transfer_on_move: "=transfer_on_move_allowed", early_payoff: "=early_payoff_allowed"}
        Commercial Deferred Payment Agreement: {transfer_on_move: "=transfer_on_move_allowed", early_payoff: "=early_payoff_allowed"}

  - id: arrangement_renegotiation_rule
    subject: [arrangement_renegotiation]
    rule: >-
      An active plan may have its installment count changed only where renegotiation_allowed_count is above
      zero and the plan has not been renegotiated before. Renegotiation is made only on a plan in active
      status with no installment currently counted as missed. The new total installment count, counting
      installments already billed, may not exceed renegotiation_max_total_installments, and the regular
      installment for the installments not yet billed is the unbilled plan balance divided by the number of
      installments remaining, rounded down to the cent, with the final installment carrying the remainder. The
      new count is chosen by the customer. Renegotiation never changes the deferred amount or re-ages any
      missed installment.
    eligibility:
      - id: renegotiate_active_plan
        applies_to: [arrangement_renegotiation]
        kind: state
        condition: "Renegotiation is made only on a plan in active status with no installment currently counted as missed."
        evidence_fields: [arrangement_plans.status, arrangement_plans.arrangement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangement_plans.arrangement_id]
          action_bindings:
            arrangement_plans.arrangement_id: arrangement_id
        state_contract:
          field: arrangement_plans.status
          allowed: [active]
    params:
      per_tier:
        Payment Extension: {allowed: "=renegotiation_allowed_count", max_total: "=renegotiation_max_total_installments"}
        Short-Term Installment Plan: {allowed: "=renegotiation_allowed_count", max_total: "=renegotiation_max_total_installments"}
        Standard Deferred Payment Agreement: {allowed: "=renegotiation_allowed_count", max_total: "=renegotiation_max_total_installments"}
        Extended Deferred Payment Agreement: {allowed: "=renegotiation_allowed_count", max_total: "=renegotiation_max_total_installments"}
        Winter Protection Plan: {allowed: "=renegotiation_allowed_count", max_total: "=renegotiation_max_total_installments"}
        Arrearage Management Program: {allowed: "=renegotiation_allowed_count", max_total: "=renegotiation_max_total_installments"}
        Commercial Deferred Payment Agreement: {allowed: "=renegotiation_allowed_count", max_total: "=renegotiation_max_total_installments"}

  - id: arrangement_transfer_on_move
    subject: [arrangement_account_transfer]
    rule: >-
      When the customer stops service at one address and starts service at another, an active plan whose
      transfer_on_move_allowed is true moves to the new service agreement. The plan moves only to a service
      agreement of the same customer that is pending_start or active. The installment schedule, numbering and
      missed-installment count continue unchanged, and the next installment is billed on the first regular
      bill of the new agreement. Plans whose transfer_on_move_allowed is false, and plans of a different
      customer, never move; they end under arrangement_completion_and_closure.
    eligibility:
      - id: move_to_open_agreement
        applies_to: [arrangement_account_transfer]
        kind: state
        condition: "The plan moves only to a service agreement of the same customer that is pending_start or active."
        evidence_fields: [service_accounts.status, service_accounts.customer_id, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [pending_start, active]
    params:
      per_tier:
        Payment Extension: {transfer_on_move: "=transfer_on_move_allowed"}
        Short-Term Installment Plan: {transfer_on_move: "=transfer_on_move_allowed"}
        Standard Deferred Payment Agreement: {transfer_on_move: "=transfer_on_move_allowed"}
        Extended Deferred Payment Agreement: {transfer_on_move: "=transfer_on_move_allowed"}
        Winter Protection Plan: {transfer_on_move: "=transfer_on_move_allowed"}
        Arrearage Management Program: {transfer_on_move: "=transfer_on_move_allowed"}
        Commercial Deferred Payment Agreement: {transfer_on_move: "=transfer_on_move_allowed"}

  - id: arrangement_program_interactions
    subject: [arrangement_enrollment, arrangement_installment_billing]
    rule: >-
      Holding an active budget billing plan on the same service agreement is required for the Extended
      Deferred Payment Agreement and does not change any other plan's terms. An active arrangement on a service
      agreement suspends disconnection for nonpayment of the deferred balance while installments and current
      bills are paid as agreed. A Winter Protection Plan and an Arrearage Management Program plan exclude each
      other on the same agreement through the one-open-plan rule; a customer in the winter enrollment window
      who qualifies for both chooses one. A security deposit held on the agreement is never applied to plan
      installments while the plan is active. Installments, returned plan balances and program debits never
      attract a late payment charge on the service agreement.
    eligibility: []

extended_policies:
  - id: arrangement_ext_reinstatement_redeferral
    base_policy_refs: [arrangement_reinstatement_rule, arrangement_default_and_cure, arrangement_activation_rule]
    overwrite:
      - base_policy: arrangement_reinstatement_rule
        superseded_clause: >-
          On reinstatement the plan returns to active, the missed-installment count restarts from zero, the
          returned balance is deferred into the plan again, and the remaining installments keep their numbers
          and amounts.
        replaced_by: >-
          On reinstatement the plan returns to active, the missed-installment count restarts from zero, the
          remaining installments keep their numbers and amounts, and the balance booked back under the plan is
          the reinstatement re-deferral rather than the whole returned balance.
      - base_policy: arrangement_reinstatement_rule
        superseded_clause: >-
          Before reinstatement the customer must have paid reinstatement_missed_payment_pct of all installments
          recorded as missed, through payments posted to the service agreement after the default.
        replaced_by: >-
          Before reinstatement the customer must have paid reinstatement_missed_payment_pct of all installments
          recorded as missed and the whole restoration payment, through payments posted to the service agreement
          after the default.
      - base_policy: arrangement_activation_rule
        superseded_clause: >-
          On activation, and again on reinstatement, the deferred amount (or on reinstatement the remaining
          unbilled plan balance) is booked into the plan and credited off the service agreement's collectible
          balance
        replaced_by: >-
          On activation the deferred amount is booked into the plan and credited off the service agreement's collectible balance. For a reinstated deferred payment agreement, the amount booked back into the plan and credited off the
          service agreement's collectible balance is the reinstatement re-deferral, not the remaining unbilled
          plan balance.
    trigger: on_request
    subject: [arrangement_reinstatement]
    computes: redeferred_amount
    target_tool: reinstate_arrangement_7e9638f2
    params:
      miss_share_three_plus: 0.15
      miss_share_two: 0.10
      miss_lookback_months: 6
      nsf_share_two_plus: 0.10
      nsf_share_one: 0.05
      late_share_high: 0.06
      late_share_mid: 0.03
      late_high_count: 6
      late_mid_count: 3
      assist_share_two_plus: 0.04
      assist_share_one: 0.02
      tenure_months: 120
      nsf_lookback_months: 24
      window_clean_months: 6
      window_nsf_months: 9
      window_standard_months: 12
      assist_lookback_months: 6
    rule: >
      A defaulted Standard Deferred Payment Agreement or Extended Deferred Payment Agreement is reinstated on
      the terms below, which refine the base reinstatement rule; the reinstatement window, the number of
      reinstatements allowed and the requirement that the request fall inside the window are unchanged. On
      reinstatement the plan returns to active, the missed-installment count restarts from zero, the remaining
      installments keep their numbers and amounts, and the balance booked back under the plan is the
      reinstatement re-deferral rather than the whole returned balance. On activation the deferred amount is booked into the plan and credited off the service agreement's collectible balance. For a reinstated deferred payment
      agreement, the amount booked back into the plan and credited off the service agreement's collectible
      balance is the reinstatement re-deferral, not the remaining unbilled plan balance. The reinstatement
      re-deferral starts from the returned balance, which is the amount of the latest balance-return entry with
      reason default on the plan. The restoration payment is the returned balance less the reinstatement re-deferral, so that the two together make up the returned balance to the cent.
      Before reinstatement the customer must have paid reinstatement_missed_payment_pct of all installments
      recorded as missed and the whole restoration payment, through payments posted to the service agreement
      after the default. The reinstatement re-deferral is the returned balance times one minus the restoration
      share, rounded half-up to the cent. The standard restoration share is zero, so that the whole returned
      balance is booked back under the plan. Account history read for a reinstatement is taken from the service
      agreement's records over the window_standard_months months before the request. The combined restoration
      share is the missed-installment share plus the returned-payment share plus the late-charge share, less
      the assistance relief; these are first added together into one share. The restoration share is the
      combined restoration share, a combined share below zero counting as zero, adjusted by the hardship
      treatment, and it is applied once to the returned balance. A share or relief whose conditions are not met
      is zero. The missed-installment share is miss_share_three_plus when three or more missed-installment
      entries were posted on the plan within the miss_lookback_months months before the request, miss_share_two
      when exactly two were, and zero when fewer than two were. The returned-payment share is nsf_share_two_plus
      when two or more returned-payment charges were posted to the service agreement within the restoration
      review window, nsf_share_one when exactly one was, and zero when none was. The late-charge share is
      late_share_high when late_high_count or more late payment charges were posted to the service agreement
      within the restoration review window, late_share_mid when at least late_mid_count but fewer than
      late_high_count were, and zero when fewer than late_mid_count were. The restoration review window is the
      window_clean_months months before the request when the service agreement's start date is at least
      tenure_months months before the request and no returned-payment charge was posted to it within the
      nsf_lookback_months months before the request; it is the window_nsf_months months before the request when
      the start date is at least tenure_months months before the request and a returned-payment charge was posted
      to it within those nsf_lookback_months months; and in every other case it is the window_standard_months
      months before the request. The hardship treatment applies when the service agreement carries an active
      medical protection or an active budget billing plan: when it carries both, the missed-installment share is
      left out of the combined share before it is floored at zero; when it carries exactly one of the two, the
      floored combined share is halved; and when it carries neither, the floored combined share is used as it
      stands. The assistance relief is assist_share_two_plus when two or more payments from an energy assistance
      agency were posted to the service agreement within the assist_lookback_months months before the request,
      assist_share_one when exactly one was, and zero when none was. A window of a number of months before the
      request covers entries posted after the same calendar day that many months earlier, up to and including
      the request date; the number of months between the start date and the request is counted in whole
      calendar months.
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [start_date, service_charges.event_type, service_charges.posting_date, service_credits.payment_channel, service_credits.posting_date]
        note: The restoration review window, the returned-payment share, the late-charge share and the assistance relief are decided from the service agreement's start date and its charge and payment ledger.
      - category: medical
        as: existence
        reads: [status]
        note: The hardship treatment reads whether the agreement carries an active medical protection.
      - category: budget
        as: existence
        reads: [status]
        note: The hardship treatment reads whether the agreement carries an active budget billing plan.
    compute:
      - returned_balance: "LATEST('arrangement_ledger', 'amount', date_field='posting_date', event_type='arrangement_balance_return', return_reason='default')"
      - plan_missed_entries: "COUNT('arrangement_ledger', within_months=K('miss_lookback_months'), date_field='posting_date', event_type='arrangement_missed_installment')"
      - missed_installment_share: "K('miss_share_three_plus') if plan_missed_entries >= 3 else (K('miss_share_two') if plan_missed_entries == 2 else 0)"
      - months_in_service: "MONTHS(CFIELD('service', 'start_date', service_account_id=F('service_account_id')), NOW)"
      - returned_payments_lookback: "XCOUNT('service', 'service_charges', within_months=K('nsf_lookback_months'), date_field='posting_date', event_type='service_returned_payment_charge', service_account_id=F('service_account_id'))"
      - restoration_review_months: "K('window_clean_months') if (months_in_service >= K('tenure_months') and returned_payments_lookback == 0) else (K('window_nsf_months') if (months_in_service >= K('tenure_months') and returned_payments_lookback > 0) else K('window_standard_months'))"
      - returned_payments_in_window: "XCOUNT('service', 'service_charges', within_months=restoration_review_months, date_field='posting_date', event_type='service_returned_payment_charge', service_account_id=F('service_account_id'))"
      - returned_payment_share: "K('nsf_share_two_plus') if returned_payments_in_window >= 2 else (K('nsf_share_one') if returned_payments_in_window == 1 else 0)"
      - late_charges_in_window: "XCOUNT('service', 'service_charges', within_months=restoration_review_months, date_field='posting_date', event_type='service_late_payment_charge', service_account_id=F('service_account_id'))"
      - late_charge_share: "K('late_share_high') if late_charges_in_window >= K('late_high_count') else (K('late_share_mid') if late_charges_in_window >= K('late_mid_count') else 0)"
      - agency_payments_recent: "XCOUNT('service', 'service_credits', within_months=K('assist_lookback_months'), date_field='posting_date', event_type='service_payment', payment_channel='energy_assistance_agency', service_account_id=F('service_account_id'))"
      - assistance_relief: "K('assist_share_two_plus') if agency_payments_recent >= 2 else (K('assist_share_one') if agency_payments_recent == 1 else 0)"
      - combined_restoration_share: "missed_installment_share + returned_payment_share + late_charge_share - assistance_relief"
      - medical_protection_active: "EXISTS('medical', status='active', service_account_id=F('service_account_id'))"
      - budget_plan_active: "EXISTS('budget', status='active', service_account_id=F('service_account_id'))"
      - restoration_share: "MX(0, combined_restoration_share - missed_installment_share) if (medical_protection_active and budget_plan_active) else (MX(0, combined_restoration_share) / 2 if (medical_protection_active or budget_plan_active) else MX(0, combined_restoration_share))"
      - result: "RND(returned_balance * (1 - restoration_share), 2)"
    compute_basis:
      returned_balance: "The reinstatement re-deferral starts from the returned balance, which is the amount of the latest balance-return entry with reason default on the plan."
      plan_missed_entries: "The missed-installment share is miss_share_three_plus when three or more missed-installment entries were posted on the plan within the miss_lookback_months months before the request, miss_share_two when exactly two were, and zero when fewer than two were."
      missed_installment_share: "The missed-installment share is miss_share_three_plus when three or more missed-installment entries were posted on the plan within the miss_lookback_months months before the request, miss_share_two when exactly two were, and zero when fewer than two were."
      months_in_service: "the number of months between the start date and the request is counted in whole calendar months."
      returned_payments_lookback: "no returned-payment charge was posted to it within the nsf_lookback_months months before the request"
      restoration_review_months: "The restoration review window is the window_clean_months months before the request when the service agreement's start date is at least tenure_months months before the request and no returned-payment charge was posted to it within the nsf_lookback_months months before the request; it is the window_nsf_months months before the request when the start date is at least tenure_months months before the request and a returned-payment charge was posted to it within those nsf_lookback_months months; and in every other case it is the window_standard_months months before the request."
      returned_payments_in_window: "The returned-payment share is nsf_share_two_plus when two or more returned-payment charges were posted to the service agreement within the restoration review window, nsf_share_one when exactly one was, and zero when none was."
      returned_payment_share: "The returned-payment share is nsf_share_two_plus when two or more returned-payment charges were posted to the service agreement within the restoration review window, nsf_share_one when exactly one was, and zero when none was."
      late_charges_in_window: "The late-charge share is late_share_high when late_high_count or more late payment charges were posted to the service agreement within the restoration review window, late_share_mid when at least late_mid_count but fewer than late_high_count were, and zero when fewer than late_mid_count were."
      late_charge_share: "The late-charge share is late_share_high when late_high_count or more late payment charges were posted to the service agreement within the restoration review window, late_share_mid when at least late_mid_count but fewer than late_high_count were, and zero when fewer than late_mid_count were."
      agency_payments_recent: "The assistance relief is assist_share_two_plus when two or more payments from an energy assistance agency were posted to the service agreement within the assist_lookback_months months before the request, assist_share_one when exactly one was, and zero when none was."
      assistance_relief: "The assistance relief is assist_share_two_plus when two or more payments from an energy assistance agency were posted to the service agreement within the assist_lookback_months months before the request, assist_share_one when exactly one was, and zero when none was."
      combined_restoration_share: "The combined restoration share is the missed-installment share plus the returned-payment share plus the late-charge share, less the assistance relief; these are first added together into one share."
      medical_protection_active: "The hardship treatment applies when the service agreement carries an active medical protection or an active budget billing plan"
      budget_plan_active: "The hardship treatment applies when the service agreement carries an active medical protection or an active budget billing plan"
      restoration_share: "The hardship treatment applies when the service agreement carries an active medical protection or an active budget billing plan: when it carries both, the missed-installment share is left out of the combined share before it is floored at zero; when it carries exactly one of the two, the floored combined share is halved; and when it carries neither, the floored combined share is used as it stands."
      result: "The reinstatement re-deferral is the returned balance times one minus the restoration share, rounded half-up to the cent."
    factors:
      - id: missed_installment_share
        effect: parameter
        decides: missed_installment_share
        bindings: [plan_missed_entries, missed_installment_share]
        ladder:
          - when: "three or more missed-installment entries posted on the plan within the miss_lookback_months months before the request"
            value: "K('miss_share_three_plus')"
          - when: "exactly two missed-installment entries posted on the plan within that window"
            value: "K('miss_share_two')"
          - when: "otherwise (fewer than two within the window, the plan's earlier misses having aged out of it)"
            value: "0"
        baseline:
          missed_installment_share: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: restoration_review_window
        effect: parameter
        decides: restoration_review_months
        bindings: [months_in_service, returned_payments_lookback, restoration_review_months]
        ladder:
          - when: "the agreement's start date is at least tenure_months months before the request and no returned-payment charge was posted within the nsf_lookback_months months before the request"
            value: "K('window_clean_months')"
          - when: "the agreement's start date is at least tenure_months months before the request and a returned-payment charge was posted within the nsf_lookback_months months before the request"
            value: "K('window_nsf_months')"
          - when: "otherwise (the agreement started fewer than tenure_months months before the request)"
            value: "K('window_standard_months')"
        baseline:
          restoration_review_months: "K('window_standard_months')"
        evidence: [date, cross_category]
        cross_difficulty: service
      - id: returned_payment_share
        effect: parameter
        decides: returned_payment_share
        bindings: [returned_payments_in_window, returned_payment_share]
        ladder:
          - when: "two or more returned-payment charges posted within the restoration review window"
            value: "K('nsf_share_two_plus')"
          - when: "exactly one returned-payment charge posted within the restoration review window"
            value: "K('nsf_share_one')"
          - when: "otherwise (no returned-payment charge within the window)"
            value: "0"
        baseline:
          returned_payment_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: late_charge_share
        effect: parameter
        decides: late_charge_share
        bindings: [late_charges_in_window, late_charge_share]
        ladder:
          - when: "late_high_count or more late payment charges posted within the restoration review window"
            value: "K('late_share_high')"
          - when: "at least late_mid_count but fewer than late_high_count late payment charges posted within the restoration review window"
            value: "K('late_share_mid')"
          - when: "otherwise (fewer than late_mid_count late payment charges within the window)"
            value: "0"
        baseline:
          late_charge_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: hardship_treatment
        effect: method
        decides: restoration_share
        bindings: [medical_protection_active, budget_plan_active, restoration_share]
        ladder:
          - when: "the agreement carries an active medical protection and an active budget billing plan"
            method: "the missed-installment share is left out of the combined share before it is floored at zero"
          - when: "the agreement carries exactly one of an active medical protection or an active budget billing plan"
            method: "the floored combined share is halved"
          - when: "otherwise (neither)"
            method: "the floored combined share is used as it stands"
        baseline:
          restoration_share: "MX(0, combined_restoration_share)"
        evidence: [cross_category]
        cross_difficulty: null
      - id: assistance_relief
        effect: parameter
        decides: assistance_relief
        bindings: [agency_payments_recent, assistance_relief]
        ladder:
          - when: "two or more energy assistance agency payments posted within the assist_lookback_months months before the request"
            value: "K('assist_share_two_plus')"
          - when: "exactly one energy assistance agency payment posted within the assist_lookback_months months before the request"
            value: "K('assist_share_one')"
          - when: "otherwise (no agency payment in that window)"
            value: "0"
        baseline:
          assistance_relief: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
    baseline:
      rule: >-
        The reinstatement re-deferral starts from the returned balance, which is the amount of the latest
        balance-return entry with reason default on the plan. The reinstatement re-deferral is the returned
        balance times one minus the restoration share, rounded half-up to the cent. The standard restoration share
        is zero, so that the whole returned balance is booked back under the plan. Account history read for a
        reinstatement is taken from the service agreement's records over the window_standard_months months before
        the request.
      params: [window_standard_months]
    inputs:
      history:
        - {table: arrangement_ledger, aggregate: latest, field: amount, filters: {event_type: arrangement_balance_return, return_reason: default}}
        - {table: arrangement_ledger, aggregate: count, field: arrangement_ledger_id, within_months: 6, filters: {event_type: arrangement_missed_installment}}
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 24, filters: {event_type: service_returned_payment_charge}}
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 12, filters: {event_type: service_late_payment_charge}}
        - {category: service, table: service_credits, aggregate: count, field: service_credit_id, within_months: 6, filters: {event_type: service_payment, payment_channel: energy_assistance_agency}}
      cross_category: [service, medical, budget]

  - id: arrangement_ext_renegotiated_installment
    base_policy_refs: [arrangement_renegotiation_rule]
    overwrite:
      - base_policy: arrangement_renegotiation_rule
        superseded_clause: >-
          The new total installment count, counting installments already billed, may not exceed
          renegotiation_max_total_installments, and the regular installment for the installments not yet billed
          is the unbilled plan balance divided by the number of installments remaining, rounded down to the
          cent, with the final installment carrying the remainder.
        replaced_by: >-
          The new total installment count is the renegotiation ceiling plus the billed installments not counted
          as used, and the regular installment for the installments not yet billed is the plan's remaining
          balance divided by the installments remaining, rounded down to the cent, with the final installment
          carrying the remainder.
      - base_policy: arrangement_renegotiation_rule
        superseded_clause: >-
          The new count is chosen by the customer.
        replaced_by: >-
          The renegotiation is made only on the customer's own acceptance of that schedule.
    trigger: on_request
    subject: [arrangement_renegotiation]
    computes: installment_amount
    target_tool: renegotiate_arrangement_installments_743d0532
    params:
      winter_stretch_medical: 4
      winter_stretch_standard: 2
      tenure_bonus_long: 2
      tenure_bonus: 1
      tenure_long_months: 180
      tenure_months: 120
      deposit_bonus_large: 2
      deposit_bonus: 1
      deposit_large_usd: 300.00
      nsf_cut: 2
      late_cut: 1
      late_cut_threshold: 3
      history_lookback_months: 12
      default_cut_recent: 2
      default_cut_older: 1
      default_recent_months: 6
      default_older_months: 12
      agency_lookback_months: 12
      autopay_lookback_months: 3
    rule: >
      A renegotiation follows the base renegotiation rule except where this rule sets the schedule.
      Renegotiation is made only on a plan in active status with no installment currently counted as missed,
      and a plan is renegotiated no more than renegotiation_allowed_count times. Where the plan has defaulted,
      its new regular installment is worked out only after the plan stands in active status again with its
      reinstatement re-deferral booked back under it as its remaining balance. The new total installment
      count is the renegotiation ceiling plus the billed installments not counted as used, and the regular
      installment for the installments not yet billed is the plan's remaining balance divided by the
      installments remaining, rounded down to the cent, with the final installment carrying the remainder. The renegotiation is made only on the customer's own
      acceptance of that schedule. The installments remaining are the new total installment count less
      the installments already billed, which is the renegotiation ceiling less the installments counted as used,
      so every remaining installment has its own installment number. As standard, the renegotiation ceiling is
      renegotiation_max_total_installments and every installment billed on the plan is counted as used. The
      renegotiation ceiling is renegotiation_max_total_installments plus the winter stretch, plus the tenure
      months and plus the deposit months, less the history cut and less the default cut, all added together
      into one whole count. The winter stretch is winter_stretch_medical months when the service agreement's
      space heating is electric, its most recent bill is a winter-season bill and it carries an active medical
      protection; it is winter_stretch_standard months when the space heating is electric and the most recent
      bill is a winter-season bill but no medical protection is active on it; and it is zero in every other
      case. The tenure months are tenure_bonus_long when the service agreement's start date lies at least
      tenure_long_months whole calendar months before the renegotiation, tenure_bonus when it lies at least
      tenure_months but fewer than tenure_long_months whole calendar months before it, and zero when it is
      more recent. The deposit months are deposit_bonus_large when a security deposit in held status on the
      service agreement holds at least deposit_large_usd, deposit_bonus when a held deposit holds more than zero
      but less than deposit_large_usd, and zero when no deposit is held on the agreement. The history cut is
      nsf_cut months when a returned-payment charge was posted to the service agreement within the
      history_lookback_months months before the renegotiation; it is late_cut months when no returned-payment
      charge was posted in that window but late_cut_threshold or more late payment charges were; and it is
      zero otherwise. The default cut is default_cut_recent months when a balance-return entry with reason
      default was posted on the plan within the default_recent_months months before the renegotiation,
      default_cut_older months when such an entry was posted within the default_older_months months before
      the renegotiation but none within the default_recent_months months, and zero when none was posted
      within the default_older_months months. The installments counted as used are the installments billed
      on the plan less every installment recorded as missed on it when a payment from an energy assistance
      agency was posted to the service agreement within the agency_lookback_months months before the
      renegotiation; they are the installments billed less one installment recorded as missed (none when the
      plan carries no missed-installment entry) when no such agency payment was posted but an autopay payment
      was posted within the autopay_lookback_months months before the renegotiation; and they are all the
      installments billed in every other case. A window of a number of months before the renegotiation
      covers entries posted after the same calendar day that many months earlier, up to and including the
      renegotiation date.
    prerequisite:
      - problem: arrangement_ext_reinstatement_redeferral
        kind: value_input
        gate: unbilled_balance
        form: state
        policy_source: >-
          Where the plan has defaulted, its new regular installment is worked out only after the plan stands in
          active status again with its reinstatement re-deferral booked back under it as its remaining balance.
        condition: >-
          The arrangement_plans row of the defaulted plan shows status active and a remaining_balance equal to
          the reinstatement re-deferral, instead of status defaulted with remaining_balance 0.00 after the
          balance-return entry with return_reason default.
        resolved_by: reinstate_arrangement_7e9638f2
        effect: >-
          Reinstatement sets the plan active and books the reinstatement re-deferral back as its remaining
          balance, so unbilled_balance becomes that re-deferral instead of the balance of a defaulted plan, and it
          is the amount the new regular installment divides.
    cross_category:
      - category: service
        as: history
        reads: [space_heating, start_date, service_bills.season, service_charges.event_type, service_credits.payment_channel]
        note: The winter stretch, tenure months, history cut and the installments counted as used are decided from the agreement's record, bills, charges and payments.
      - category: medical
        as: existence
        reads: [status]
        note: The winter stretch reads whether the agreement carries an active medical protection.
      - category: deposit
        as: branch
        reads: [status, held_amount]
        note: The deposit months read the amount held by a held security deposit on the agreement.
    compute:
      - unbilled_balance: "F('remaining_balance')"
      - installments_billed: "COUNT('arrangement_ledger', event_type='arrangement_installment_billing')"
      - installments_missed: "COUNT('arrangement_ledger', event_type='arrangement_missed_installment')"
      - agency_payments_year: "XCOUNT('service', 'service_credits', within_months=K('agency_lookback_months'), date_field='posting_date', event_type='service_payment', payment_channel='energy_assistance_agency', service_account_id=F('service_account_id'))"
      - autopay_payments_recent: "XCOUNT('service', 'service_credits', within_months=K('autopay_lookback_months'), date_field='posting_date', event_type='service_payment', payment_channel='autopay', service_account_id=F('service_account_id'))"
      - installments_used: "installments_billed - installments_missed if agency_payments_year > 0 else (installments_billed - MN(installments_missed, 1) if autopay_payments_recent > 0 else installments_billed)"
      - space_heating_electric: "CFIELD('service', 'space_heating', service_account_id=F('service_account_id')) == 'electric'"
      - latest_bill_season: "XLATEST('service', 'service_bills', 'season', date_field='bill_date', service_account_id=F('service_account_id'))"
      - medical_protection_active: "EXISTS('medical', status='active', service_account_id=F('service_account_id'))"
      - winter_stretch: "K('winter_stretch_medical') if (space_heating_electric and latest_bill_season == 'winter' and medical_protection_active) else (K('winter_stretch_standard') if (space_heating_electric and latest_bill_season == 'winter') else 0)"
      - service_start_months: "MONTHS(CFIELD('service', 'start_date', service_account_id=F('service_account_id')), NOW)"
      - tenure_months_bonus: "K('tenure_bonus_long') if service_start_months >= K('tenure_long_months') else (K('tenure_bonus') if service_start_months >= K('tenure_months') else 0)"
      - deposit_held: "CFIELD('deposit', 'held_amount', status='held', service_account_id=F('service_account_id')) or 0"
      - deposit_months: "K('deposit_bonus_large') if deposit_held >= K('deposit_large_usd') else (K('deposit_bonus') if deposit_held > 0 else 0)"
      - returned_payments_year: "XCOUNT('service', 'service_charges', within_months=K('history_lookback_months'), date_field='posting_date', event_type='service_returned_payment_charge', service_account_id=F('service_account_id'))"
      - late_charges_year: "XCOUNT('service', 'service_charges', within_months=K('history_lookback_months'), date_field='posting_date', event_type='service_late_payment_charge', service_account_id=F('service_account_id'))"
      - history_cut: "K('nsf_cut') if returned_payments_year > 0 else (K('late_cut') if late_charges_year >= K('late_cut_threshold') else 0)"
      - defaults_recent: "COUNT('arrangement_ledger', within_months=K('default_recent_months'), date_field='posting_date', event_type='arrangement_balance_return', return_reason='default')"
      - defaults_year: "COUNT('arrangement_ledger', within_months=K('default_older_months'), date_field='posting_date', event_type='arrangement_balance_return', return_reason='default')"
      - default_cut: "K('default_cut_recent') if defaults_recent > 0 else (K('default_cut_older') if defaults_year > 0 else 0)"
      - renegotiation_ceiling: "P('renegotiation_max_total_installments') + winter_stretch + tenure_months_bonus + deposit_months - history_cut - default_cut"
      - new_total_count: "renegotiation_ceiling + installments_billed - installments_used"
      - installments_remaining: "new_total_count - installments_billed"
      - result: "RND(unbilled_balance * 100, 0) // installments_remaining / 100"
    compute_basis:
      unbilled_balance: "the regular installment for the installments not yet billed is the plan's remaining balance divided by the installments remaining"
      installments_billed: "As standard, the renegotiation ceiling is renegotiation_max_total_installments and every installment billed on the plan is counted as used."
      installments_missed: "The installments counted as used are the installments billed on the plan less every installment recorded as missed on it when a payment from an energy assistance agency was posted to the service agreement within the agency_lookback_months months before the renegotiation"
      agency_payments_year: "when a payment from an energy assistance agency was posted to the service agreement within the agency_lookback_months months before the renegotiation"
      autopay_payments_recent: "but an autopay payment was posted within the autopay_lookback_months months before the renegotiation"
      installments_used: "The installments counted as used are the installments billed on the plan less every installment recorded as missed on it when a payment from an energy assistance agency was posted to the service agreement within the agency_lookback_months months before the renegotiation; they are the installments billed less one installment recorded as missed (none when the plan carries no missed-installment entry) when no such agency payment was posted but an autopay payment was posted within the autopay_lookback_months months before the renegotiation; and they are all the installments billed in every other case."
      space_heating_electric: "when the service agreement's space heating is electric"
      latest_bill_season: "its most recent bill is a winter-season bill"
      medical_protection_active: "and it carries an active medical protection"
      winter_stretch: "The winter stretch is winter_stretch_medical months when the service agreement's space heating is electric, its most recent bill is a winter-season bill and it carries an active medical protection; it is winter_stretch_standard months when the space heating is electric and the most recent bill is a winter-season bill but no medical protection is active on it; and it is zero in every other case."
      service_start_months: "when the service agreement's start date lies at least tenure_long_months whole calendar months before the renegotiation"
      tenure_months_bonus: "The tenure months are tenure_bonus_long when the service agreement's start date lies at least tenure_long_months whole calendar months before the renegotiation, tenure_bonus when it lies at least tenure_months but fewer than tenure_long_months whole calendar months before it, and zero when it is more recent."
      deposit_held: "when a security deposit in held status on the service agreement holds at least deposit_large_usd"
      deposit_months: "The deposit months are deposit_bonus_large when a security deposit in held status on the service agreement holds at least deposit_large_usd, deposit_bonus when a held deposit holds more than zero but less than deposit_large_usd, and zero when no deposit is held on the agreement."
      returned_payments_year: "when a returned-payment charge was posted to the service agreement within the history_lookback_months months before the renegotiation"
      late_charges_year: "but late_cut_threshold or more late payment charges were"
      history_cut: "The history cut is nsf_cut months when a returned-payment charge was posted to the service agreement within the history_lookback_months months before the renegotiation; it is late_cut months when no returned-payment charge was posted in that window but late_cut_threshold or more late payment charges were; and it is zero otherwise."
      defaults_recent: "when a balance-return entry with reason default was posted on the plan within the default_recent_months months before the renegotiation"
      defaults_year: "when such an entry was posted within the default_older_months months before the renegotiation but none within the default_recent_months months"
      default_cut: "The default cut is default_cut_recent months when a balance-return entry with reason default was posted on the plan within the default_recent_months months before the renegotiation, default_cut_older months when such an entry was posted within the default_older_months months before the renegotiation but none within the default_recent_months months, and zero when none was posted within the default_older_months months."
      renegotiation_ceiling: "The renegotiation ceiling is renegotiation_max_total_installments plus the winter stretch, plus the tenure months and plus the deposit months, less the history cut and less the default cut, all added together into one whole count."
      new_total_count: "The new total installment count is the renegotiation ceiling plus the billed installments not counted as used"
      installments_remaining: "The installments remaining are the new total installment count less the installments already billed, which is the renegotiation ceiling less the installments counted as used, so every remaining installment has its own installment number."
      result: "the regular installment for the installments not yet billed is the plan's remaining balance divided by the installments remaining, rounded down to the cent, with the final installment carrying the remainder."
    factors:
      - id: winter_stretch
        effect: parameter
        decides: winter_stretch
        bindings: [space_heating_electric, latest_bill_season, medical_protection_active, winter_stretch]
        ladder:
          - when: "electric space heating and a winter-season most recent bill and an active medical protection"
            value: "K('winter_stretch_medical')"
          - when: "electric space heating and a winter-season most recent bill, with no active medical protection"
            value: "K('winter_stretch_standard')"
          - when: "otherwise (non-electric heating or a summer-season most recent bill)"
            value: "0"
        baseline:
          winter_stretch: "0"
        evidence: [cross_category]
        cross_difficulty: service
      - id: tenure_months
        effect: parameter
        decides: tenure_months_bonus
        bindings: [service_start_months, tenure_months_bonus]
        ladder:
          - when: "service start date at least tenure_long_months whole months before the renegotiation"
            value: "K('tenure_bonus_long')"
          - when: "service start date at least tenure_months but fewer than tenure_long_months whole months before"
            value: "K('tenure_bonus')"
          - when: "otherwise (a more recent start date)"
            value: "0"
        baseline:
          tenure_months_bonus: "0"
        evidence: [date, cross_category]
        cross_difficulty: service
      - id: deposit_months
        effect: parameter
        decides: deposit_months
        bindings: [deposit_held, deposit_months]
        ladder:
          - when: "a held security deposit on the agreement holds at least deposit_large_usd"
            value: "K('deposit_bonus_large')"
          - when: "a held security deposit holds more than zero but less than deposit_large_usd"
            value: "K('deposit_bonus')"
          - when: "otherwise (no deposit held)"
            value: "0"
        baseline:
          deposit_months: "0"
        evidence: [cross_category]
        cross_difficulty: deposit
      - id: history_cut
        effect: parameter
        decides: history_cut
        bindings: [returned_payments_year, late_charges_year, history_cut]
        ladder:
          - when: "a returned-payment charge posted within the history_lookback_months months before the renegotiation"
            value: "K('nsf_cut')"
          - when: "no returned-payment charge in that window but late_cut_threshold or more late payment charges"
            value: "K('late_cut')"
          - when: "otherwise"
            value: "0"
        baseline:
          history_cut: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: default_cut
        effect: parameter
        decides: default_cut
        bindings: [defaults_recent, defaults_year, default_cut]
        ladder:
          - when: "a balance-return entry with reason default posted on the plan within the default_recent_months months before the renegotiation"
            value: "K('default_cut_recent')"
          - when: "such an entry within the default_older_months months but none within the default_recent_months months"
            value: "K('default_cut_older')"
          - when: "otherwise (no default entry within the default_older_months months)"
            value: "0"
        baseline:
          default_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: installments_used
        effect: method
        decides: installments_used
        bindings: [installments_missed, agency_payments_year, autopay_payments_recent, installments_used]
        ladder:
          - when: "an energy assistance agency payment posted within the agency_lookback_months months before the renegotiation"
            method: "the installments billed less every installment recorded as missed are counted as used"
          - when: "no such agency payment, but an autopay payment posted within the autopay_lookback_months months before the renegotiation"
            method: "the installments billed less one installment recorded as missed (none when none was) are counted as used"
          - when: "otherwise"
            method: "every installment billed is counted as used"
        baseline:
          installments_used: "installments_billed"
        evidence: [history, cross_category]
        cross_difficulty: service
    baseline:
      rule: >-
        The new total installment count is the renegotiation ceiling plus the billed installments not counted
        as used, and the regular installment for the installments not yet billed is the plan's remaining
        balance divided by the installments remaining, rounded down to the cent, with the final installment
        carrying the remainder. The installments remaining are the new total installment count less the
        installments already billed, which is the renegotiation ceiling less the installments counted as used,
        so every remaining installment has its own installment number. As standard, the renegotiation ceiling is
        renegotiation_max_total_installments and every installment billed on the plan is counted as used.
      params: [renegotiation_max_total_installments]
    inputs:
      history:
        - {table: arrangement_ledger, aggregate: count, field: arrangement_ledger_id, filters: {event_type: arrangement_installment_billing}}
        - {table: arrangement_ledger, aggregate: count, field: arrangement_ledger_id, filters: {event_type: arrangement_missed_installment}}
        - {table: arrangement_ledger, aggregate: count, field: arrangement_ledger_id, within_months: 12, filters: {event_type: arrangement_balance_return, return_reason: default}}
        - {category: service, table: service_credits, aggregate: count, field: service_credit_id, within_months: 12, filters: {event_type: service_payment, payment_channel: energy_assistance_agency}}
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 12, filters: {event_type: service_returned_payment_charge}}
        - {category: service, table: service_bills, aggregate: latest, field: season}
      cross_category: [service, medical, deposit]

  - id: arrangement_ext_program_bill_shortfall
    base_policy_refs: [arrangement_default_and_cure]
    overwrite:
      - base_policy: arrangement_default_and_cure
        superseded_clause: >-
          An installment is paid when payments to the service agreement applied oldest charges first cover it,
          less a shortfall of no more than installment_tolerance_usd, by the end of its cure period.
        replaced_by: >-
          For a program bill, payments applied oldest charges first by the end of the cure period count toward
          its program obligation, and a payment posted on the booking day counts toward it only where this rule
          recognises it. Any other installment, and the current charges of any other bill carrying an installment, are paid when payments to the service agreement applied oldest charges first cover them, less a shortfall of no more than installment_tolerance_usd, by the end of their cure period.
    trigger: state_due
    subject: [arrangement_missed_installment]
    computes: amount
    target_tool: record_missed_program_bill_7606bb4e
    params:
      rebase_long_months: 12
      rebase_short_months: 3
      rebase_standard_months: 6
      plan_settled_months: 6
      agency_window_long_months: 12
      agency_window_short_months: 6
      agency_tenure_months: 120
    rule: >
      A program bill of an Arrearage Management Program plan whose current charges are still unpaid when its
      cure period ends is booked as a missed-installment entry for the installment that bill carries, on the
      day after the cure period ends; this rule sets the missed program-bill amount that entry records, and
      the base rules on cure periods, counting misses and default are unchanged. For a program bill, payments
      applied oldest charges first by the end of the cure period count toward its program obligation, and a
      payment posted on the booking day counts toward it only where this rule recognises it. Any other installment, and the current charges of any other bill carrying an installment, are paid when payments to the service agreement applied oldest charges first cover them, less a shortfall of no more than installment_tolerance_usd, by the end of their cure period. The program bill
      is the agreement's most recent bill. As standard, the program obligation of the bill is the bill's
      current charges. The unpaid program obligation is the smaller of the program obligation and the
      agreement's balance at the end of the cure period less the agreement's latest late payment charge where
      that charge was posted after the bill date; the agreement's balance at the end of the cure period is its
      balance at booking plus every payment posted to it on the booking day, an energy assistance agency's included. The missed program-bill
      amount is the unpaid program obligation less the recognised booking-day payments, rounded half-up to the
      cent and never below zero. The recognised booking-day payments are the recognised customer booking-day
      payments plus the recognised agency booking-day payment. As standard, no payment posted on the booking
      day is recognised. As standard, a re-base reads the agreement's bills over the rebase_standard_months
      months before booking. The program obligation is the active budget billing plan's monthly installment
      when the agreement carries an active budget billing plan; it is the average current charges of the
      agreement's actual-read bills dated within the re-base window, rounded half-up to the cent, when the
      agreement carries no active budget billing plan, the program bill was an estimated-read bill and at least
      one actual-read bill is dated within that window; and it is the bill's current charges in every other
      case. The re-base window is the rebase_long_months months before booking when the agreement's space
      heating is electric; it is the rebase_short_months months before booking when the space heating is not
      electric and the plan's enrolled date lies at least plan_settled_months whole calendar months before
      booking; and it is the rebase_standard_months months before booking in every other case. The recognised
      customer booking-day payments are the customer payments posted on the booking day through an authorized
      pay station, whose receipts post the business day after they are taken, and by mailed check, whose
      postmark is honoured, when no returned-payment charge was posted to the agreement within the
      returned-payment look-back of its rate schedule; they are the pay-station payments alone when at least
      one returned-payment charge but fewer than the rate schedule's returned-payment restriction count were
      posted within that look-back, since a mailed check from such an agreement is recognised only once it has
      cleared; and they are zero when the restriction count was reached, since an agreement under the
      returned-payment restriction is given no posting courtesy. A card, online or autopay payment posted on
      the booking day was made after the cure period and is never recognised. The recognised agency booking-day
      payment is the payment an energy assistance agency posted to the agreement on the booking day when the
      agency's pledge on the agreement is on record, that is when an earlier payment from an energy assistance
      agency was posted to the agreement within the agency pledge window before booking, the booking-day
      payment itself left out; it is zero otherwise. The agency pledge window is agency_window_long_months
      months when the plan carries no earlier missed-installment entry and the agreement's start date lies at
      least agency_tenure_months whole calendar months before booking; it is agency_window_short_months months
      when exactly one of those two holds; and it is zero months, so that no booking-day agency payment is
      recognised, when neither holds. A window of a number of months before booking covers entries dated after
      the same calendar day that many months earlier, up to and including the booking date.
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [space_heating, start_date, account_balance, service_bills.read_type, service_bills.amount, service_charges.event_type, service_credits.payment_channel]
        note: The program obligation, the re-base window, the recognised customer booking-day payments (with the rate schedule's returned-payment look-back and restriction count) and the agency pledge window are decided from the agreement, its rate schedule, bills, charges and payments.
      - category: budget
        as: branch
        reads: [status, installment_amount]
        note: The program obligation reads the monthly installment of an active budget billing plan on the agreement.
    compute:
      - latest_bill_read: "XLATEST('service', 'service_bills', 'read_type', date_field='bill_date', service_account_id=F('service_account_id'))"
      - latest_bill_charges: "XLATEST('service', 'service_bills', 'amount', date_field='bill_date', service_account_id=F('service_account_id'))"
      - latest_bill_date: "XLATEST('service', 'service_bills', 'bill_date', date_field='bill_date', service_account_id=F('service_account_id'))"
      - heat_is_electric: "CFIELD('service', 'space_heating', service_account_id=F('service_account_id')) == 'electric'"
      - plan_age_months: "MONTHS(F('enrolled_date'), NOW)"
      - rebase_window_months: "K('rebase_long_months') if heat_is_electric else (K('rebase_short_months') if plan_age_months >= K('plan_settled_months') else K('rebase_standard_months'))"
      - actual_bills_total: "XSUM('service', 'service_bills', 'amount', within_months=rebase_window_months, date_field='bill_date', read_type='actual', service_account_id=F('service_account_id'))"
      - actual_bills_count: "XCOUNT('service', 'service_bills', within_months=rebase_window_months, date_field='bill_date', read_type='actual', service_account_id=F('service_account_id'))"
      - budget_installment: "CFIELD('budget', 'installment_amount', status='active', service_account_id=F('service_account_id')) or 0"
      - program_obligation: "budget_installment if budget_installment > 0 else (RND(actual_bills_total / actual_bills_count, 2) if (latest_bill_read == 'estimated' and actual_bills_count > 0) else latest_bill_charges)"
      - payments_on_booking_day: "XSUM('service', 'service_credits', 'amount', event_type='service_payment', posting_date=NOW, service_account_id=F('service_account_id'))"
      - latest_late_charge: "XLATEST('service', 'service_charges', 'amount', date_field='posting_date', event_type='service_late_payment_charge', service_account_id=F('service_account_id'))"
      - latest_late_date: "XLATEST('service', 'service_charges', 'posting_date', date_field='posting_date', event_type='service_late_payment_charge', service_account_id=F('service_account_id'))"
      - late_after_bill: "latest_late_charge if (latest_late_date != None and DAYS(latest_bill_date, latest_late_date) > 0) else 0"
      - cure_end_balance: "CFIELD('service', 'account_balance', service_account_id=F('service_account_id')) + payments_on_booking_day"
      - unpaid_obligation: "MN(program_obligation, MX(0, cure_end_balance - late_after_bill))"
      - pay_station_on_booking_day: "XSUM('service', 'service_credits', 'amount', event_type='service_payment', payment_channel='authorized_pay_station_cash', posting_date=NOW, service_account_id=F('service_account_id'))"
      - mailed_check_on_booking_day: "XSUM('service', 'service_credits', 'amount', event_type='service_payment', payment_channel='mail_check', posting_date=NOW, service_account_id=F('service_account_id'))"
      - returned_lookback_months: "CPARAM('service', 'returned_payment_restriction_months', service_account_id=F('service_account_id'))"
      - returned_restriction_count: "CPARAM('service', 'returned_payment_restriction_count', service_account_id=F('service_account_id'))"
      - returned_payments_lookback: "XCOUNT('service', 'service_charges', within_months=returned_lookback_months, date_field='posting_date', event_type='service_returned_payment_charge', service_account_id=F('service_account_id'))"
      - customer_booking_credit: "(pay_station_on_booking_day + mailed_check_on_booking_day) if returned_payments_lookback == 0 else (pay_station_on_booking_day if returned_payments_lookback < returned_restriction_count else 0)"
      - earlier_missed_entries: "COUNT('arrangement_ledger', event_type='arrangement_missed_installment')"
      - agreement_service_months: "MONTHS(CFIELD('service', 'start_date', service_account_id=F('service_account_id')), NOW)"
      - agency_window_months: "K('agency_window_long_months') if (earlier_missed_entries == 0 and agreement_service_months >= K('agency_tenure_months')) else (K('agency_window_short_months') if (earlier_missed_entries == 0 or agreement_service_months >= K('agency_tenure_months')) else 0)"
      - agency_on_booking_day: "XSUM('service', 'service_credits', 'amount', event_type='service_payment', payment_channel='energy_assistance_agency', posting_date=NOW, service_account_id=F('service_account_id'))"
      - agency_earlier: "XCOUNT('service', 'service_credits', within_months=agency_window_months, date_field='posting_date', event_type='service_payment', payment_channel='energy_assistance_agency', service_account_id=F('service_account_id')) - XCOUNT('service', 'service_credits', event_type='service_payment', payment_channel='energy_assistance_agency', posting_date=NOW, service_account_id=F('service_account_id'))"
      - agency_booking_credit: "agency_on_booking_day if agency_earlier > 0 else 0"
      - booking_day_credit: "RND(customer_booking_credit + agency_booking_credit, 2)"
      - result: "RND(MX(0, unpaid_obligation - booking_day_credit), 2)"
    compute_basis:
      latest_bill_read: "the program bill was an estimated-read bill"
      latest_bill_charges: "As standard, the program obligation of the bill is the bill's current charges."
      latest_bill_date: "where that charge was posted after the bill date"
      heat_is_electric: "The re-base window is the rebase_long_months months before booking when the agreement's space heating is electric"
      plan_age_months: "the plan's enrolled date lies at least plan_settled_months whole calendar months before booking"
      rebase_window_months: "The re-base window is the rebase_long_months months before booking when the agreement's space heating is electric; it is the rebase_short_months months before booking when the space heating is not electric and the plan's enrolled date lies at least plan_settled_months whole calendar months before booking; and it is the rebase_standard_months months before booking in every other case."
      actual_bills_total: "the average current charges of the agreement's actual-read bills dated within the re-base window, rounded half-up to the cent"
      actual_bills_count: "at least one actual-read bill is dated within that window"
      budget_installment: "The program obligation is the active budget billing plan's monthly installment when the agreement carries an active budget billing plan"
      program_obligation: "The program obligation is the active budget billing plan's monthly installment when the agreement carries an active budget billing plan; it is the average current charges of the agreement's actual-read bills dated within the re-base window, rounded half-up to the cent, when the agreement carries no active budget billing plan, the program bill was an estimated-read bill and at least one actual-read bill is dated within that window; and it is the bill's current charges in every other case."
      payments_on_booking_day: "the agreement's balance at the end of the cure period is its balance at booking plus every payment posted to it on the booking day, an energy assistance agency's included."
      latest_late_charge: "less the agreement's latest late payment charge where that charge was posted after the bill date"
      latest_late_date: "where that charge was posted after the bill date"
      late_after_bill: "less the agreement's latest late payment charge where that charge was posted after the bill date"
      cure_end_balance: "the agreement's balance at the end of the cure period is its balance at booking plus every payment posted to it on the booking day, an energy assistance agency's included."
      unpaid_obligation: "The unpaid program obligation is the smaller of the program obligation and the agreement's balance at the end of the cure period less the agreement's latest late payment charge where that charge was posted after the bill date"
      pay_station_on_booking_day: "the customer payments posted on the booking day through an authorized pay station, whose receipts post the business day after they are taken"
      mailed_check_on_booking_day: "and by mailed check, whose postmark is honoured"
      returned_lookback_months: "when no returned-payment charge was posted to the agreement within the returned-payment look-back of its rate schedule"
      returned_restriction_count: "fewer than the rate schedule's returned-payment restriction count were posted within that look-back"
      returned_payments_lookback: "when no returned-payment charge was posted to the agreement within the returned-payment look-back of its rate schedule"
      customer_booking_credit: "The recognised customer booking-day payments are the customer payments posted on the booking day through an authorized pay station, whose receipts post the business day after they are taken, and by mailed check, whose postmark is honoured, when no returned-payment charge was posted to the agreement within the returned-payment look-back of its rate schedule; they are the pay-station payments alone when at least one returned-payment charge but fewer than the rate schedule's returned-payment restriction count were posted within that look-back, since a mailed check from such an agreement is recognised only once it has cleared; and they are zero when the restriction count was reached, since an agreement under the returned-payment restriction is given no posting courtesy. A card, online or autopay payment posted on the booking day was made after the cure period and is never recognised."
      earlier_missed_entries: "when the plan carries no earlier missed-installment entry"
      agreement_service_months: "the agreement's start date lies at least agency_tenure_months whole calendar months before booking"
      agency_window_months: "The agency pledge window is agency_window_long_months months when the plan carries no earlier missed-installment entry and the agreement's start date lies at least agency_tenure_months whole calendar months before booking; it is agency_window_short_months months when exactly one of those two holds; and it is zero months, so that no booking-day agency payment is recognised, when neither holds."
      agency_on_booking_day: "the payment an energy assistance agency posted to the agreement on the booking day"
      agency_earlier: "an earlier payment from an energy assistance agency was posted to the agreement within the agency pledge window before booking, the booking-day payment itself left out"
      agency_booking_credit: "The recognised agency booking-day payment is the payment an energy assistance agency posted to the agreement on the booking day when the agency's pledge on the agreement is on record, that is when an earlier payment from an energy assistance agency was posted to the agreement within the agency pledge window before booking, the booking-day payment itself left out; it is zero otherwise."
      booking_day_credit: "The recognised booking-day payments are the recognised customer booking-day payments plus the recognised agency booking-day payment."
      result: "The missed program-bill amount is the unpaid program obligation less the recognised booking-day payments, rounded half-up to the cent and never below zero."
    factors:
      - id: program_obligation
        effect: method
        decides: program_obligation
        bindings: [latest_bill_read, actual_bills_total, actual_bills_count, budget_installment, program_obligation]
        ladder:
          - when: "the agreement carries an active budget billing plan"
            method: "the program obligation is that plan's monthly installment"
          - when: "no active budget billing plan, the program bill was an estimated-read bill and an actual-read bill is dated within the re-base window"
            method: "the program obligation is the average current charges of the actual-read bills in the re-base window, rounded half-up to the cent"
          - when: "otherwise"
            method: "the program obligation is the bill's current charges"
        baseline:
          program_obligation: "latest_bill_charges"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: rebase_window
        effect: parameter
        decides: rebase_window_months
        bindings: [heat_is_electric, plan_age_months, rebase_window_months]
        ladder:
          - when: "the agreement's space heating is electric"
            value: "K('rebase_long_months')"
          - when: "the space heating is not electric and the plan was enrolled at least plan_settled_months whole months before booking"
            value: "K('rebase_short_months')"
          - when: "otherwise"
            value: "K('rebase_standard_months')"
        baseline:
          rebase_window_months: "K('rebase_standard_months')"
        evidence: [cross_category, date]
        cross_difficulty: service
      - id: customer_payment_recognition
        effect: parameter
        decides: customer_booking_credit
        bindings: [pay_station_on_booking_day, mailed_check_on_booking_day, returned_lookback_months, returned_restriction_count, returned_payments_lookback, customer_booking_credit]
        ladder:
          - when: "no returned-payment charge on the agreement within the rate schedule's returned-payment look-back"
            value: "the booking-day pay-station payments plus the booking-day mailed checks"
          - when: "at least one returned-payment charge but fewer than the rate schedule's returned-payment restriction count within that look-back"
            value: "the booking-day pay-station payments alone"
          - when: "otherwise (the returned-payment restriction count reached within that look-back)"
            value: "0"
        baseline:
          customer_booking_credit: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: agency_pledge_window
        effect: parameter
        decides: agency_window_months
        bindings: [earlier_missed_entries, agreement_service_months, agency_window_months]
        ladder:
          - when: "the plan carries no earlier missed-installment entry and the agreement's start date lies at least agency_tenure_months whole months before booking"
            value: "K('agency_window_long_months')"
          - when: "exactly one of: no earlier missed-installment entry on the plan, a start date at least agency_tenure_months whole months before booking"
            value: "K('agency_window_short_months')"
          - when: "otherwise (neither)"
            value: "0"
        baseline:
          agency_window_months: "0"
        evidence: [history, cross_category, date]
        cross_difficulty: service
    baseline:
      rule: >-
        As standard, the program obligation of the bill is the bill's current charges. The unpaid program
        obligation is the smaller of the program obligation and the agreement's balance at the end of the cure
        period less the agreement's latest late payment charge where that charge was posted after the bill date;
        the agreement's balance at the end of the cure period is its balance at booking plus every payment posted to it on the booking day, an energy assistance agency's included. The missed program-bill amount is the unpaid program obligation
        less the recognised booking-day payments, rounded half-up to the cent and never below zero. The
        recognised booking-day payments are the recognised customer booking-day payments plus the recognised
        agency booking-day payment. As standard, no payment posted on the booking day is recognised. As standard,
        a re-base reads the agreement's bills over the rebase_standard_months months before booking.
      params: [rebase_standard_months]
    inputs:
      history:
        - {category: service, table: service_bills, aggregate: latest, field: amount}
        - {category: service, table: service_bills, aggregate: sum, field: amount, within_months: 3, filters: {read_type: actual}}
        - {category: service, table: service_credits, aggregate: sum, field: amount, filters: {event_type: service_payment}}
        - {category: service, table: service_charges, aggregate: latest, field: amount, filters: {event_type: service_late_payment_charge}}
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 12, filters: {event_type: service_returned_payment_charge}}
        - {category: service, table: service_credits, aggregate: count, field: service_credit_id, within_months: 12, filters: {event_type: service_payment, payment_channel: energy_assistance_agency}}
        - {table: arrangement_ledger, aggregate: count, field: arrangement_ledger_id, filters: {event_type: arrangement_missed_installment}}
      cross_category: [service, budget]

  - id: arrangement_ext_catch_up_forgiveness
    base_policy_refs: [arrangement_amp_forgiveness, arrangement_agg_forgiveness_cap]
    overwrite:
      - base_policy: arrangement_amp_forgiveness
        superseded_clause: >-
          The forgiveness is forgiveness_share_per_installment of the scheduled installment and is posted under
          forgiveness_posting_rule.
        replaced_by: >-
          An installment forgiven because the current charges of its bill were paid in full by that bill's due date is forgiven at forgiveness_share_per_installment of the scheduled installment and posted under forgiveness_posting_rule. The catch-up forgiveness is the scheduled installment times the catch-up share, never more than the
          remaining forgiveness room, rounded half-up to the cent.
    trigger: state_due
    subject: [arrangement_forgiveness]
    computes: amount
    target_tool: post_arrangement_forgiveness_78b684e3
    params:
      late_cut_high: 0.50
      late_cut: 0.25
      catch_up_days: 7
      long_tenure_months: 360
      nsf_lookback_months: 24
      late_charge_months: 6
      late_charge_cut_high: 0.15
      late_charge_cut: 0.05
      late_charge_count_high: 3
      progress_credit_high: 0.10
      progress_credit: 0.05
      progress_share_high: 0.9
      progress_share: 0.5
      autopay_credit_high: 0.10
      autopay_credit: 0.05
      autopay_count_high: 5
      autopay_months: 6
    rule: >
      Where the forgiveness for a program bill of an Arrearage Management Program plan was withheld because its
      current charges were not paid in full by the due date, the withheld forgiveness is posted as a catch-up
      once that bill is paid in full, on the day it is paid in full, while the plan is active and has not
      defaulted; this rule sets the catch-up amount, and the base rules on when catch-up is posted, on posting
      each installment once and on the customer cap are unchanged. A catch-up forgiveness is not posted until
      the plan carries a missed-installment entry for the program bill it is earned on wherever that bill was
      still unpaid when its cure period ended. The program bill a catch-up is earned on is the agreement's most
      recent bill, and the date it was paid in full is the posting date of the latest payment posted to the agreement. An installment forgiven because the current charges of its bill were paid in full by that bill's due date is forgiven at forgiveness_share_per_installment of the scheduled installment and posted under forgiveness_posting_rule. The catch-up forgiveness is the scheduled installment times the catch-up share, never more
      than the remaining forgiveness room, rounded half-up to the cent. The scheduled installment is the plan's
      remaining balance when the installment is the last one of the plan not yet forgiven or billed, and
      otherwise the plan's regular installment amount but never more than its remaining balance. The standard
      catch-up share is one, so that the whole scheduled installment is forgiven. The remaining forgiveness room
      is forgiveness_cap_per_customer_usd less the forgiveness already posted on the plan, the customer's
      forgiveness on earlier program plans having already limited the plan's balance when it was enrolled. The
      catch-up share is one, less the lateness cut and less the late-charge cut, plus the progress credit and
      plus the autopay credit; these are first added together into one share, which is then held between zero
      and one before it is applied once to the scheduled installment. The days late are counted, as standard,
      from the bill's due date to the date it was paid in full. The lateness anchor sets where the days late are
      counted from: when the agreement's start date lies at least long_tenure_months whole calendar months
      before the posting and no returned-payment charge was posted to it within the nsf_lookback_months months
      before the posting, the days late are counted from the last day of the cure period, that is the due date
      plus the plan's cure_period_days; when the start date lies that far back and such a charge was posted
      within those months, they are counted from the end of the late-payment grace of the agreement's rate
      schedule, that is the due date plus its late_payment_grace_days; and in every other case they are counted
      from the due date. The lateness cut is late_cut_high when the plan carries a missed-installment entry and
      the bill was paid in full more than catch_up_days days late, late_cut when the plan carries a
      missed-installment entry and the bill was paid in full no more than catch_up_days days late, and zero when
      the plan carries no missed-installment entry. The late-charge cut is late_charge_cut_high when
      late_charge_count_high or more late payment charges were posted to the agreement within the
      late_charge_months months before the posting, late_charge_cut when at least one but fewer than
      late_charge_count_high were, and zero when none was. The progress credit is progress_credit_high when the
      forgiveness entries already posted on the plan number at least progress_share_high times its installment
      count, progress_credit when they number at least progress_share but less than progress_share_high times
      that count, and zero otherwise. The autopay credit is autopay_credit_high when autopay_count_high or more
      autopay payments were posted to the agreement within the autopay_months months before the posting,
      autopay_credit when at least one but fewer than autopay_count_high were, and zero when none was. A window
      of a number of months before the posting covers entries dated after the same calendar day that many months
      earlier, up to and including the posting date.
    prerequisite:
      - problem: arrangement_ext_program_bill_shortfall
        kind: value_input
        gate: lateness_cut
        form: state
        policy_source: >-
          A catch-up forgiveness is not posted until the plan carries a missed-installment entry for the program
          bill it is earned on wherever that bill was still unpaid when its cure period ended.
        condition: >-
          The plan's arrangement_ledger carries an arrangement_missed_installment row for the installment number
          the program bill carries whenever that bill's current charges were still unpaid on the last cure day.
        resolved_by: record_missed_program_bill_7606bb4e
        effect: >-
          Booking the missed program bill puts a missed-installment entry on the plan, so lateness_cut is read
          from the tiers for a plan carrying a missed entry instead of the no-missed-entry tier.
    cross_category:
      - category: service
        as: history
        reads: [start_date, service_bills.due_date, service_credits.posting_date, service_credits.payment_channel, service_charges.event_type]
        note: The paid-in-full date, the bill's due date, the lateness anchor, the late-charge cut and the autopay credit come from the agreement's record, bills, charges and payments, and the late-payment grace of its rate schedule.
    compute:
      - installments_settled: "COUNT('arrangement_ledger', event_type='arrangement_forgiveness') + COUNT('arrangement_ledger', event_type='arrangement_installment_billing')"
      - scheduled_installment: "F('remaining_balance') if installments_settled == F('installment_count') - 1 else MN(F('installment_amount'), F('remaining_balance'))"
      - latest_missed_booking: "LATEST('arrangement_ledger', 'posting_date', date_field='posting_date', event_type='arrangement_missed_installment')"
      - bill_due_date: "XLATEST('service', 'service_bills', 'due_date', date_field='bill_date', service_account_id=F('service_account_id'))"
      - paid_in_full_date: "XLATEST('service', 'service_credits', 'posting_date', date_field='posting_date', event_type='service_payment', service_account_id=F('service_account_id'))"
      - agreement_age_months: "MONTHS(CFIELD('service', 'start_date', service_account_id=F('service_account_id')), NOW)"
      - returned_payments_lookback: "XCOUNT('service', 'service_charges', within_months=K('nsf_lookback_months'), date_field='posting_date', event_type='service_returned_payment_charge', service_account_id=F('service_account_id'))"
      - lateness_days: "DAYS(bill_due_date, paid_in_full_date) - P('cure_period_days') if (agreement_age_months >= K('long_tenure_months') and returned_payments_lookback == 0) else (DAYS(bill_due_date, paid_in_full_date) - CPARAM('service', 'late_payment_grace_days', service_account_id=F('service_account_id')) if (agreement_age_months >= K('long_tenure_months') and returned_payments_lookback > 0) else DAYS(bill_due_date, paid_in_full_date))"
      - lateness_cut: "K('late_cut_high') if (latest_missed_booking != None and lateness_days > K('catch_up_days')) else (K('late_cut') if latest_missed_booking != None else 0)"
      - late_charges_reviewed: "XCOUNT('service', 'service_charges', within_months=K('late_charge_months'), date_field='posting_date', event_type='service_late_payment_charge', service_account_id=F('service_account_id'))"
      - late_charge_cut: "K('late_charge_cut_high') if late_charges_reviewed >= K('late_charge_count_high') else (K('late_charge_cut') if late_charges_reviewed >= 1 else 0)"
      - forgiveness_posted_count: "COUNT('arrangement_ledger', event_type='arrangement_forgiveness')"
      - progress_credit: "K('progress_credit_high') if forgiveness_posted_count >= K('progress_share_high') * F('installment_count') else (K('progress_credit') if forgiveness_posted_count >= K('progress_share') * F('installment_count') else 0)"
      - autopay_payments: "XCOUNT('service', 'service_credits', within_months=K('autopay_months'), date_field='posting_date', event_type='service_payment', payment_channel='autopay', service_account_id=F('service_account_id'))"
      - autopay_credit: "K('autopay_credit_high') if autopay_payments >= K('autopay_count_high') else (K('autopay_credit') if autopay_payments >= 1 else 0)"
      - catch_up_share: "MN(1, MX(0, 1 - lateness_cut - late_charge_cut + progress_credit + autopay_credit))"
      - forgiveness_room: "P('forgiveness_cap_per_customer_usd') - SUM('arrangement_ledger', 'amount', event_type='arrangement_forgiveness')"
      - result: "RND(MN(forgiveness_room, scheduled_installment * catch_up_share), 2)"
    compute_basis:
      installments_settled: "when the installment is the last one of the plan not yet forgiven or billed"
      scheduled_installment: "The scheduled installment is the plan's remaining balance when the installment is the last one of the plan not yet forgiven or billed, and otherwise the plan's regular installment amount but never more than its remaining balance."
      latest_missed_booking: "The lateness cut is late_cut_high when the plan carries a missed-installment entry"
      bill_due_date: "The program bill a catch-up is earned on is the agreement's most recent bill"
      paid_in_full_date: "the date it was paid in full is the posting date of the latest payment posted to the agreement."
      agreement_age_months: "when the agreement's start date lies at least long_tenure_months whole calendar months before the posting"
      returned_payments_lookback: "no returned-payment charge was posted to it within the nsf_lookback_months months before the posting"
      lateness_days: "The lateness anchor sets where the days late are counted from: when the agreement's start date lies at least long_tenure_months whole calendar months before the posting and no returned-payment charge was posted to it within the nsf_lookback_months months before the posting, the days late are counted from the last day of the cure period, that is the due date plus the plan's cure_period_days; when the start date lies that far back and such a charge was posted within those months, they are counted from the end of the late-payment grace of the agreement's rate schedule, that is the due date plus its late_payment_grace_days; and in every other case they are counted from the due date."
      lateness_cut: "The lateness cut is late_cut_high when the plan carries a missed-installment entry and the bill was paid in full more than catch_up_days days late, late_cut when the plan carries a missed-installment entry and the bill was paid in full no more than catch_up_days days late, and zero when the plan carries no missed-installment entry."
      late_charges_reviewed: "late payment charges were posted to the agreement within the late_charge_months months before the posting"
      late_charge_cut: "The late-charge cut is late_charge_cut_high when late_charge_count_high or more late payment charges were posted to the agreement within the late_charge_months months before the posting, late_charge_cut when at least one but fewer than late_charge_count_high were, and zero when none was."
      forgiveness_posted_count: "when the forgiveness entries already posted on the plan number at least progress_share_high times its installment count"
      progress_credit: "The progress credit is progress_credit_high when the forgiveness entries already posted on the plan number at least progress_share_high times its installment count, progress_credit when they number at least progress_share but less than progress_share_high times that count, and zero otherwise."
      autopay_payments: "when autopay_count_high or more autopay payments were posted to the agreement within the autopay_months months before the posting"
      autopay_credit: "The autopay credit is autopay_credit_high when autopay_count_high or more autopay payments were posted to the agreement within the autopay_months months before the posting, autopay_credit when at least one but fewer than autopay_count_high were, and zero when none was."
      catch_up_share: "The catch-up share is one, less the lateness cut and less the late-charge cut, plus the progress credit and plus the autopay credit; these are first added together into one share, which is then held between zero and one before it is applied once to the scheduled installment."
      forgiveness_room: "The remaining forgiveness room is forgiveness_cap_per_customer_usd less the forgiveness already posted on the plan"
      result: "The catch-up forgiveness is the scheduled installment times the catch-up share, never more than the remaining forgiveness room, rounded half-up to the cent."
    factors:
      - id: lateness_cut
        effect: parameter
        decides: lateness_cut
        bindings: [latest_missed_booking, lateness_cut]
        ladder:
          - when: "a missed-installment entry stands on the plan and the bill was paid in full more than catch_up_days days late"
            value: "K('late_cut_high')"
          - when: "a missed-installment entry stands on the plan and the bill was paid in full no more than catch_up_days days late"
            value: "K('late_cut')"
          - when: "otherwise (no missed-installment entry on the plan)"
            value: "0"
        baseline:
          lateness_cut: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: lateness_anchor
        effect: method
        decides: lateness_days
        bindings: [bill_due_date, paid_in_full_date, agreement_age_months, returned_payments_lookback, lateness_days]
        ladder:
          - when: "start date at least long_tenure_months whole months back and no returned-payment charge within nsf_lookback_months"
            method: "days late are counted from the last day of the cure period (due date plus the plan's cure_period_days)"
          - when: "start date at least long_tenure_months whole months back and a returned-payment charge within nsf_lookback_months"
            method: "days late are counted from the end of the rate schedule's late-payment grace (due date plus late_payment_grace_days)"
          - when: "otherwise (a more recent start date)"
            method: "days late are counted from the due date"
        baseline:
          lateness_days: "DAYS(bill_due_date, paid_in_full_date)"
        evidence: [date, cross_category]
        cross_difficulty: service
      - id: late_charge_cut
        effect: parameter
        decides: late_charge_cut
        bindings: [late_charges_reviewed, late_charge_cut]
        ladder:
          - when: "late_charge_count_high or more late payment charges within late_charge_months months before the posting"
            value: "K('late_charge_cut_high')"
          - when: "at least one but fewer than late_charge_count_high late payment charges in that window"
            value: "K('late_charge_cut')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          late_charge_cut: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: progress_credit
        effect: parameter
        decides: progress_credit
        bindings: [forgiveness_posted_count, progress_credit]
        ladder:
          - when: "forgiveness entries posted on the plan number at least progress_share_high times its installment count"
            value: "K('progress_credit_high')"
          - when: "at least progress_share but less than progress_share_high times the installment count"
            value: "K('progress_credit')"
          - when: "otherwise"
            value: "0"
        baseline:
          progress_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: autopay_credit
        effect: parameter
        decides: autopay_credit
        bindings: [autopay_payments, autopay_credit]
        ladder:
          - when: "autopay_count_high or more autopay payments within autopay_months months before the posting"
            value: "K('autopay_credit_high')"
          - when: "at least one but fewer than autopay_count_high autopay payments in that window"
            value: "K('autopay_credit')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          autopay_credit: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
    baseline:
      rule: >-
        The catch-up forgiveness is the scheduled installment times the catch-up share, never more than the
        remaining forgiveness room, rounded half-up to the cent. The scheduled installment is the plan's remaining
        balance when the installment is the last one of the plan not yet forgiven or billed, and otherwise the
        plan's regular installment amount but never more than its remaining balance. The standard catch-up share
        is one, so that the whole scheduled installment is forgiven. The days late are counted, as standard, from
        the bill's due date to the date it was paid in full.
      params: [forgiveness_cap_per_customer_usd]
    inputs:
      history:
        - {table: arrangement_ledger, aggregate: count, field: arrangement_ledger_id, filters: {event_type: arrangement_forgiveness}}
        - {table: arrangement_ledger, aggregate: sum, field: amount, filters: {event_type: arrangement_forgiveness}}
        - {table: arrangement_ledger, aggregate: latest, field: posting_date, filters: {event_type: arrangement_missed_installment}}
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 6, filters: {event_type: service_late_payment_charge}}
        - {category: service, table: service_credits, aggregate: count, field: service_credit_id, within_months: 6, filters: {payment_channel: autopay}}
      cross_category: [service]

  - id: arrangement_ext_winter_plan_reinstatement
    base_policy_refs: [arrangement_reinstatement_rule, arrangement_activation_rule]
    overwrite:
      - base_policy: arrangement_reinstatement_rule
        superseded_clause: >-
          On reinstatement the plan returns to active, the missed-installment count restarts from zero, the
          returned balance is deferred into the plan again, and the remaining installments keep their numbers
          and amounts.
        replaced_by: >-
          On reinstatement the winter plan returns to active, its missed-installment count restarts from zero, its
          remaining installments keep their numbers and amounts, and the balance booked back under it is the
          winter re-deferral rather than the whole returned balance.
      - base_policy: arrangement_reinstatement_rule
        superseded_clause: >-
          Before reinstatement the customer must have paid reinstatement_missed_payment_pct of all installments
          recorded as missed, through payments posted to the service agreement after the default.
        replaced_by: >-
          Before the winter plan is reinstated the customer must have paid reinstatement_missed_payment_pct of all
          its installments recorded as missed and the whole winter good-faith payment, through payments posted to
          the service agreement after the default.
      - base_policy: arrangement_activation_rule
        superseded_clause: >-
          On activation, and again on reinstatement, the deferred amount (or on reinstatement the remaining
          unbilled plan balance) is booked into the plan and credited off the service agreement's collectible
          balance
        replaced_by: >-
          On activation the deferred amount is booked into the plan and credited off the service agreement's collectible balance. For a reinstated winter plan, the amount booked back into the plan and credited off the service
          agreement's collectible balance is the winter re-deferral, not the remaining unbilled plan balance.
    trigger: on_request
    subject: [arrangement_reinstatement]
    computes: redeferred_amount
    target_tool: reinstate_winter_protection_plan_6f5d50f4
    params:
      winter_miss_share_three_plus: 0.12
      winter_miss_share_two: 0.08
      winter_miss_lookback_months: 6
      winter_nsf_share_two_plus: 0.06
      winter_nsf_share_one: 0.03
      deposit_relief_threshold_usd: 200.00
      deposit_partial_factor: 0.75
      settled_agreement_months: 60
      winter_nsf_lookback_months: 24
      winter_review_short_months: 6
      winter_review_mid_months: 9
      winter_review_standard_months: 12
    rule: >
      A defaulted Winter Protection Plan is reinstated on the terms below, which refine the base reinstatement
      rule for winter plans; the reinstatement window, the number of reinstatements allowed and the requirement
      that the request fall inside the window are unchanged. On reinstatement the winter plan returns to
      active, its missed-installment count restarts from zero, its remaining installments keep their numbers and
      amounts, and the balance booked back under it is the winter re-deferral rather than the whole returned
      balance. On activation the deferred amount is booked into the plan and credited off the service agreement's collectible balance. For a reinstated winter plan, the amount booked back into the plan and credited off the service
      agreement's collectible balance is the winter re-deferral, not the remaining unbilled plan balance. Before
      the winter plan is reinstated the customer must have paid reinstatement_missed_payment_pct of all its
      installments recorded as missed and the whole winter good-faith payment, through payments posted to the
      service agreement after the default. The winter re-deferral is the winter plan's returned balance, the
      amount of its latest balance-return entry with reason default, times one minus the winter good-faith share,
      rounded half-up to the cent; the winter good-faith payment is the returned balance less the winter re-deferral, so that the two together make up the returned balance to the cent. The
      standard winter good-faith share is zero, so that the whole returned balance is booked back under the
      winter plan. As standard, the agreement's returned payments are reviewed over the
      winter_review_standard_months months before the request. The combined winter share is the winter
      missed-installment share plus the winter returned-payment share, added together into one share. The
      winter good-faith share is the combined winter share adjusted by the deposit treatment and applied once to
      the returned balance. The winter missed-installment share is winter_miss_share_three_plus when three or more
      missed-installment entries were posted on the winter plan within the winter_miss_lookback_months months
      before the request, winter_miss_share_two when exactly two were, and zero when fewer than two were. The
      winter returned-payment share is winter_nsf_share_two_plus when two or more returned-payment charges were
      posted to the plan's service agreement within the winter review window, winter_nsf_share_one when exactly
      one was, and zero when none was. The winter review window is the winter_review_short_months months before
      the request when the agreement's start date lies at least settled_agreement_months whole calendar months
      before the request and no returned-payment charge was posted to it within the winter_nsf_lookback_months
      months before the request; it is the winter_review_mid_months months before the request when the start
      date lies that far back and such a charge was posted within those months; and it is the
      winter_review_standard_months months before the request in every other case. The deposit treatment
      applies when a security deposit in held status on the agreement secures it: when the held deposit holds at
      least deposit_relief_threshold_usd, the deposit stands behind the returned-payment risk and the winter
      returned-payment share is left out, so the good-faith share is the winter missed-installment share alone;
      when a held deposit holds more than zero but less than that, the combined winter share is multiplied by
      deposit_partial_factor; and when no deposit is held on the agreement, the combined winter share is used as
      it stands. A window of a number of months before the request covers entries dated after the same calendar
      day that many months earlier, up to and including the request date.
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [start_date, service_charges.event_type, service_charges.posting_date]
        note: The winter review window and the winter returned-payment share come from the agreement's start date and returned-payment charges.
      - category: deposit
        as: branch
        reads: [status, held_amount]
        note: The deposit treatment reads the amount held by a held security deposit on the agreement.
    compute:
      - returned_winter_balance: "LATEST('arrangement_ledger', 'amount', date_field='posting_date', event_type='arrangement_balance_return', return_reason='default')"
      - winter_missed_entries: "COUNT('arrangement_ledger', within_months=K('winter_miss_lookback_months'), date_field='posting_date', event_type='arrangement_missed_installment')"
      - winter_missed_share: "K('winter_miss_share_three_plus') if winter_missed_entries >= 3 else (K('winter_miss_share_two') if winter_missed_entries == 2 else 0)"
      - winter_agreement_months: "MONTHS(CFIELD('service', 'start_date', service_account_id=F('service_account_id')), NOW)"
      - winter_nsf_lookback: "XCOUNT('service', 'service_charges', within_months=K('winter_nsf_lookback_months'), date_field='posting_date', event_type='service_returned_payment_charge', service_account_id=F('service_account_id'))"
      - winter_review_months: "K('winter_review_short_months') if (winter_agreement_months >= K('settled_agreement_months') and winter_nsf_lookback == 0) else (K('winter_review_mid_months') if (winter_agreement_months >= K('settled_agreement_months') and winter_nsf_lookback > 0) else K('winter_review_standard_months'))"
      - winter_nsf_reviewed: "XCOUNT('service', 'service_charges', within_months=winter_review_months, date_field='posting_date', event_type='service_returned_payment_charge', service_account_id=F('service_account_id'))"
      - winter_returned_share: "K('winter_nsf_share_two_plus') if winter_nsf_reviewed >= 2 else (K('winter_nsf_share_one') if winter_nsf_reviewed == 1 else 0)"
      - combined_winter_share: "winter_missed_share + winter_returned_share"
      - held_deposit_amount: "CFIELD('deposit', 'held_amount', status='held', service_account_id=F('service_account_id')) or 0"
      - winter_good_faith_share: "winter_missed_share if held_deposit_amount >= K('deposit_relief_threshold_usd') else (combined_winter_share * K('deposit_partial_factor') if held_deposit_amount > 0 else combined_winter_share)"
      - result: "RND(returned_winter_balance * (1 - winter_good_faith_share), 2)"
    compute_basis:
      returned_winter_balance: "The winter re-deferral is the winter plan's returned balance, the amount of its latest balance-return entry with reason default"
      winter_missed_entries: "The winter missed-installment share is winter_miss_share_three_plus when three or more missed-installment entries were posted on the winter plan within the winter_miss_lookback_months months before the request, winter_miss_share_two when exactly two were, and zero when fewer than two were."
      winter_missed_share: "The winter missed-installment share is winter_miss_share_three_plus when three or more missed-installment entries were posted on the winter plan within the winter_miss_lookback_months months before the request, winter_miss_share_two when exactly two were, and zero when fewer than two were."
      winter_agreement_months: "when the agreement's start date lies at least settled_agreement_months whole calendar months before the request"
      winter_nsf_lookback: "no returned-payment charge was posted to it within the winter_nsf_lookback_months months before the request"
      winter_review_months: "The winter review window is the winter_review_short_months months before the request when the agreement's start date lies at least settled_agreement_months whole calendar months before the request and no returned-payment charge was posted to it within the winter_nsf_lookback_months months before the request; it is the winter_review_mid_months months before the request when the start date lies that far back and such a charge was posted within those months; and it is the winter_review_standard_months months before the request in every other case."
      winter_nsf_reviewed: "The winter returned-payment share is winter_nsf_share_two_plus when two or more returned-payment charges were posted to the plan's service agreement within the winter review window, winter_nsf_share_one when exactly one was, and zero when none was."
      winter_returned_share: "The winter returned-payment share is winter_nsf_share_two_plus when two or more returned-payment charges were posted to the plan's service agreement within the winter review window, winter_nsf_share_one when exactly one was, and zero when none was."
      combined_winter_share: "The combined winter share is the winter missed-installment share plus the winter returned-payment share, added together into one share."
      held_deposit_amount: "when the held deposit holds at least deposit_relief_threshold_usd"
      winter_good_faith_share: "The deposit treatment applies when a security deposit in held status on the agreement secures it: when the held deposit holds at least deposit_relief_threshold_usd, the deposit stands behind the returned-payment risk and the winter returned-payment share is left out, so the good-faith share is the winter missed-installment share alone; when a held deposit holds more than zero but less than that, the combined winter share is multiplied by deposit_partial_factor; and when no deposit is held on the agreement, the combined winter share is used as it stands."
      result: "times one minus the winter good-faith share, rounded half-up to the cent"
    factors:
      - id: winter_missed_share
        effect: parameter
        decides: winter_missed_share
        bindings: [winter_missed_entries, winter_missed_share]
        ladder:
          - when: "three or more missed-installment entries posted on the winter plan within the winter_miss_lookback_months months before the request"
            value: "K('winter_miss_share_three_plus')"
          - when: "exactly two missed-installment entries within that window"
            value: "K('winter_miss_share_two')"
          - when: "otherwise (fewer than two within the window, earlier misses having aged out of it)"
            value: "0"
        baseline:
          winter_missed_share: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: winter_review_window
        effect: parameter
        decides: winter_review_months
        bindings: [winter_agreement_months, winter_nsf_lookback, winter_review_months]
        ladder:
          - when: "agreement start date at least settled_agreement_months whole months back and no returned-payment charge within winter_nsf_lookback_months"
            value: "K('winter_review_short_months')"
          - when: "agreement start date at least settled_agreement_months whole months back and a returned-payment charge within winter_nsf_lookback_months"
            value: "K('winter_review_mid_months')"
          - when: "otherwise (a more recent start date)"
            value: "K('winter_review_standard_months')"
        baseline:
          winter_review_months: "K('winter_review_standard_months')"
        evidence: [date, cross_category]
        cross_difficulty: service
      - id: winter_returned_share
        effect: parameter
        decides: winter_returned_share
        bindings: [winter_nsf_reviewed, winter_returned_share]
        ladder:
          - when: "two or more returned-payment charges within the winter review window"
            value: "K('winter_nsf_share_two_plus')"
          - when: "exactly one returned-payment charge within the winter review window"
            value: "K('winter_nsf_share_one')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          winter_returned_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: deposit_treatment
        effect: method
        decides: winter_good_faith_share
        bindings: [held_deposit_amount, winter_good_faith_share]
        ladder:
          - when: "a held security deposit on the agreement holds at least deposit_relief_threshold_usd"
            method: "the winter returned-payment share is left out; the good-faith share is the missed-installment share alone"
          - when: "a held deposit holds more than zero but less than deposit_relief_threshold_usd"
            method: "the combined winter share is multiplied by deposit_partial_factor"
          - when: "otherwise (no deposit held)"
            method: "the combined winter share is used as it stands"
        baseline:
          winter_good_faith_share: "combined_winter_share"
        evidence: [cross_category]
        cross_difficulty: deposit
    baseline:
      rule: >-
        The winter re-deferral is the winter plan's returned balance, the amount of its latest balance-return entry
        with reason default, times one minus the winter good-faith share, rounded half-up to the cent; the winter good-faith payment is the returned balance less the winter re-deferral, so that the two together make up the returned balance to the cent. The standard winter good-faith share is zero,
        so that the whole returned balance is booked back under the winter plan. As standard, the agreement's
        returned payments are reviewed over the winter_review_standard_months months before the request.
      params: [winter_review_standard_months]
    inputs:
      history:
        - {table: arrangement_ledger, aggregate: latest, field: amount, filters: {event_type: arrangement_balance_return, return_reason: default}}
        - {table: arrangement_ledger, aggregate: count, field: arrangement_ledger_id, within_months: 6, filters: {event_type: arrangement_missed_installment}}
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 24, filters: {event_type: service_returned_payment_charge}}
      cross_category: [service, deposit]

  - id: arrangement_ext_extension_amount
    base_policy_refs: [arrangement_agg_multi_holding, arrangement_agg_forgiveness_cap, arrangement_enrollment_eligibility, arrangement_terms_calculation, arrangement_program_interactions]
    overwrite:
      - base_policy: arrangement_terms_calculation
        superseded_clause: >-
          The eligible balance is the past-due balance of the service agreement on the enrollment date (bills
          past their due date plus posted charges, less payments and credits) for plans whose
          eligible_balance_basis is past_due_balance, and the whole account balance for plans whose basis is
          total_balance, capped for Arrearage Management Program plans by the customer's remaining forgiveness
          room.
        replaced_by: >-
          The balance placed under a payment extension is the extension base. For every plan other than a Payment Extension on a residential agreement whose status is disconnection notice pending, the eligible balance is the past-due balance of the service agreement on the enrollment date (bills past their due date plus posted charges, less payments and credits) for plans whose eligible_balance_basis is past_due_balance, and the whole account balance for plans whose basis is total_balance, capped for Arrearage Management Program plans by the customer's remaining forgiveness room.
      - base_policy: arrangement_enrollment_eligibility
        superseded_clause: >-
          The eligible balance, under the plan's eligible_balance_basis, must lie between min_past_due_usd and
          max_past_due_usd
        replaced_by: >-
          For a Payment Extension on a residential agreement whose status is disconnection notice pending, the extension base must lie between min_past_due_usd and max_past_due_usd; for every plan other than a Payment Extension on a residential agreement whose status is disconnection notice pending, the eligible balance, under the plan's eligible_balance_basis, must lie between min_past_due_usd and max_past_due_usd.
      - base_policy: arrangement_terms_calculation
        superseded_clause: >-
          The down payment is the eligible balance times down_payment_pct, or times
          post_disconnection_down_payment_pct when the agreement is disconnected at enrollment, rounded to the
          cent and raised to down_payment_min_usd, but never more than the eligible balance; it is zero for plans
          whose down_payment_pct is zero.
        replaced_by: >-
          The part due now is the extension base times the upfront share, rounded half-up to the cent, and the
          amount carried by the extension is the extension base less the part due now, rounded half-up to the
          cent. For every plan other than a Payment Extension on a residential agreement whose status is disconnection notice pending, the down payment is the eligible balance times down_payment_pct, or times post_disconnection_down_payment_pct when the agreement is disconnected at enrollment, rounded to the cent and raised to down_payment_min_usd, but never more than the eligible balance; it is zero for plans whose down_payment_pct is zero.
    trigger: on_request
    subject: [arrangement_enrollment]
    computes: extended_amount
    target_tool: accept_payment_extension_fc63ed0e
    params:
      ledger_months: 240
      default_share_high: 0.30
      default_share: 0.15
      miss_count_high: 2
      default_lookback_months: 12
      forgiveness_relief_high: 0.10
      forgiveness_relief: 0.05
      forgiveness_count_high: 6
      forgiveness_count: 4
      forgiveness_months: 6
      nsf_share_two_plus: 0.10
      nsf_share_one: 0.05
      nsf_months: 12
      tenure_relief_long: 0.05
      tenure_relief: 0.02
      tenure_long_months: 180
      tenure_months: 60
      assistance_relief_two_plus: 0.06
      assistance_relief_one: 0.03
      assistance_months: 12
    rule: >
      This rule sets the terms of a Payment Extension enrolled on a residential agreement of the customer whose
      status is disconnection notice pending; extensions on other agreements follow the base terms, and the
      base eligibility, one-open-plan, lockout and single-installment rules are unchanged. The amount carried by
      a payment extension is fixed only after every program bill of the customer that has been paid in full
      carries the forgiveness entry owed for it. The amount carried by a payment extension is not worked out
      until every Winter Protection Plan of the customer that defaulted and has had its missed installments and
      good-faith payment paid inside its reinstatement window stands active again. The balance placed under a
      payment extension is the extension base. For every plan other than a Payment Extension on a residential agreement whose status is disconnection notice pending, the eligible balance is the past-due balance of the service agreement on the enrollment date (bills past their due date plus posted charges, less payments and credits) for plans whose eligible_balance_basis is past_due_balance, and the whole account balance for plans whose basis is total_balance, capped for Arrearage Management Program plans by the customer's remaining forgiveness room. As standard, the extension base is the agreement's past-due
      balance on the enrollment date: its bills whose due date falls on or before the enrollment date plus its
      posted charges, less its payments and credits, all read over the ledger_months months before the
      enrollment date. For a Payment Extension on a residential agreement whose status is disconnection notice pending, the extension base must lie between min_past_due_usd and max_past_due_usd; for every plan other than a Payment Extension on a residential agreement whose status is disconnection notice pending, the eligible balance, under the plan's eligible_balance_basis, must lie between min_past_due_usd and max_past_due_usd. The part due now is the extension base times the upfront
      share, rounded half-up to the cent, and the amount carried by the extension is the extension base less
      the part due now, rounded half-up to the cent. For every plan other than a Payment Extension on a residential agreement whose status is disconnection notice pending, the down payment is the eligible balance times down_payment_pct, or times post_disconnection_down_payment_pct when the agreement is disconnected at enrollment, rounded to the cent and raised to down_payment_min_usd, but never more than the eligible balance; it is zero for plans whose down_payment_pct is zero. The standard upfront share is zero, so that the whole
      extension base is carried to the extended date. The extension base is the agreement's whole account
      balance when a final notice has been delivered on it; it is the past-due amount stated on its latest
      written notice when a written notice but no final notice has been delivered on it; and it is its
      past-due balance when no notice has been delivered on it. The upfront share is the default share plus the
      returned-payment share, less the forgiveness relief, less the tenure relief and less the assistance
      relief; these are first added together into one share, applied once to the extension base, and a
      combined share below zero counts as zero. The default share is default_share_high when a Winter
      Protection Plan of the customer stands in default and miss_count_high or more missed-installment entries
      were posted on the customer's plans within the default_lookback_months months before enrollment; it is
      default_share when a Winter Protection Plan of the customer stands in default without that many recent
      missed-installment entries, or when no winter plan stands in default but a balance-return entry with
      reason default was posted on any of the customer's plans within the default_lookback_months months before
      enrollment; and it is zero otherwise. The forgiveness relief is forgiveness_relief_high when
      forgiveness_count_high or more forgiveness entries were posted on the customer's plans within the
      forgiveness_months months before enrollment, forgiveness_relief when at least forgiveness_count but fewer
      than forgiveness_count_high were, and zero when fewer than forgiveness_count were. The returned-payment
      share is nsf_share_two_plus when two or more returned-payment charges were posted to any of the
      customer's agreements within the nsf_months months before enrollment, nsf_share_one when exactly one
      was, and zero when none was. The tenure relief is tenure_relief_long when the start date of the agreement
      under notice lies at least tenure_long_months whole calendar months before enrollment, tenure_relief when
      it lies at least tenure_months but fewer than tenure_long_months whole months before, and zero when it is
      more recent. The assistance relief is assistance_relief_two_plus when two or more payments from an energy
      assistance agency were posted to any of the customer's agreements within the assistance_months months
      before enrollment, assistance_relief_one when exactly one was, and zero when none was. A window of a
      number of months before enrollment covers entries dated after the same calendar day that many months
      earlier, up to and including the enrollment date.
    prerequisite:
      - problem: arrangement_ext_catch_up_forgiveness
        kind: value_input
        gate: forgiven_half_year
        form: state
        policy_source: >-
          The amount carried by a payment extension is fixed only after every program bill of the customer that
          has been paid in full carries the forgiveness entry owed for it.
        condition: >-
          Every Arrearage Management Program bill of the customer whose current charges have been paid in full
          has an arrangement_forgiveness row on its plan for the installment number it carries.
        resolved_by: post_arrangement_forgiveness_78b684e3
        effect: >-
          Posting the owed forgiveness adds a forgiveness entry on the customer's program plan, so
          forgiven_half_year counts that entry when it falls inside the forgiveness_months window.
      - problem: arrangement_ext_winter_plan_reinstatement
        kind: value_input
        gate: default_share
        form: state
        policy_source: >-
          The amount carried by a payment extension is not worked out until every Winter Protection Plan of the
          customer that defaulted and has had its missed installments and good-faith payment paid inside its
          reinstatement window stands active again.
        condition: >-
          No arrangement_plans row of variant Winter Protection Plan whose reinstatement conditions are met
          (inside the reinstatement window, missed installments and good-faith payment paid after the default)
          remains in defaulted status.
        resolved_by: reinstate_winter_protection_plan_6f5d50f4
        effect: >-
          Reinstating the winter plan takes it out of defaulted status, so default_share is read without a
          Winter Protection Plan standing in default.
    cross_category:
      - category: service
        as: history
        reads: [service_account_id, status, start_date, account_balance, service_bills.amount, service_bills.due_date, service_charges.amount, service_credits.amount, service_notices.notice_type, service_notices.past_due_amount]
        note: The extension base, the returned-payment share, the tenure relief and the assistance relief are decided from the agreements, bills, charges, payments and notices of the service product.
    compute:
      - notice_agreement: "CFIELD('service', 'service_account_id', status='notice_pending')"
      - bills_due: "XSUM('service', 'service_bills', 'amount', within_months=K('ledger_months'), date_field='due_date', service_account_id=notice_agreement)"
      - charges_posted: "XSUM('service', 'service_charges', 'amount', within_months=K('ledger_months'), date_field='posting_date', service_account_id=notice_agreement)"
      - credits_posted: "XSUM('service', 'service_credits', 'amount', within_months=K('ledger_months'), date_field='posting_date', service_account_id=notice_agreement)"
      - past_due_balance: "RND(bills_due + charges_posted - credits_posted, 2)"
      - final_notices: "XCOUNT('service', 'service_notices', notice_type='final_notice', service_account_id=notice_agreement)"
      - written_notice_amount: "XLATEST('service', 'service_notices', 'past_due_amount', date_field='notice_date', notice_type='written_notice', service_account_id=notice_agreement)"
      - whole_balance: "CFIELD('service', 'account_balance', service_account_id=notice_agreement)"
      - extension_base: "whole_balance if final_notices > 0 else (written_notice_amount if written_notice_amount != None else past_due_balance)"
      - winter_plans_defaulted: "COUNT('arrangement_plans', status='defaulted', variant_name='Winter Protection Plan')"
      - missed_entries_year: "COUNT('arrangement_ledger', within_months=K('default_lookback_months'), date_field='posting_date', event_type='arrangement_missed_installment')"
      - default_entries_year: "COUNT('arrangement_ledger', within_months=K('default_lookback_months'), date_field='posting_date', event_type='arrangement_balance_return', return_reason='default')"
      - default_share: "K('default_share_high') if (winter_plans_defaulted > 0 and missed_entries_year >= K('miss_count_high')) else (K('default_share') if (winter_plans_defaulted > 0 or default_entries_year > 0) else 0)"
      - forgiven_half_year: "COUNT('arrangement_ledger', within_months=K('forgiveness_months'), date_field='posting_date', event_type='arrangement_forgiveness')"
      - forgiveness_relief: "K('forgiveness_relief_high') if forgiven_half_year >= K('forgiveness_count_high') else (K('forgiveness_relief') if forgiven_half_year >= K('forgiveness_count') else 0)"
      - returned_payments_year: "XCOUNT('service', 'service_charges', within_months=K('nsf_months'), date_field='posting_date', event_type='service_returned_payment_charge')"
      - returned_payment_share: "K('nsf_share_two_plus') if returned_payments_year >= 2 else (K('nsf_share_one') if returned_payments_year == 1 else 0)"
      - notice_agreement_months: "MONTHS(CFIELD('service', 'start_date', service_account_id=notice_agreement), NOW)"
      - tenure_relief: "K('tenure_relief_long') if notice_agreement_months >= K('tenure_long_months') else (K('tenure_relief') if notice_agreement_months >= K('tenure_months') else 0)"
      - agency_payments_year: "XCOUNT('service', 'service_credits', within_months=K('assistance_months'), date_field='posting_date', event_type='service_payment', payment_channel='energy_assistance_agency')"
      - assistance_relief: "K('assistance_relief_two_plus') if agency_payments_year >= 2 else (K('assistance_relief_one') if agency_payments_year == 1 else 0)"
      - upfront_share: "MX(0, default_share + returned_payment_share - forgiveness_relief - tenure_relief - assistance_relief)"
      - upfront_payment: "RND(extension_base * upfront_share, 2)"
      - result: "RND(extension_base - upfront_payment, 2)"
    compute_basis:
      notice_agreement: "This rule sets the terms of a Payment Extension enrolled on a residential agreement of the customer whose status is disconnection notice pending"
      bills_due: "its bills whose due date falls on or before the enrollment date plus its posted charges, less its payments and credits, all read over the ledger_months months before the enrollment date"
      charges_posted: "plus its posted charges"
      credits_posted: "less its payments and credits"
      past_due_balance: "As standard, the extension base is the agreement's past-due balance on the enrollment date: its bills whose due date falls on or before the enrollment date plus its posted charges, less its payments and credits, all read over the ledger_months months before the enrollment date."
      final_notices: "when a final notice has been delivered on it"
      written_notice_amount: "it is the past-due amount stated on its latest written notice when a written notice but no final notice has been delivered on it"
      whole_balance: "The extension base is the agreement's whole account balance when a final notice has been delivered on it"
      extension_base: "The extension base is the agreement's whole account balance when a final notice has been delivered on it; it is the past-due amount stated on its latest written notice when a written notice but no final notice has been delivered on it; and it is its past-due balance when no notice has been delivered on it."
      winter_plans_defaulted: "when a Winter Protection Plan of the customer stands in default"
      missed_entries_year: "miss_count_high or more missed-installment entries were posted on the customer's plans within the default_lookback_months months before enrollment"
      default_entries_year: "a balance-return entry with reason default was posted on any of the customer's plans within the default_lookback_months months before enrollment"
      default_share: "The default share is default_share_high when a Winter Protection Plan of the customer stands in default and miss_count_high or more missed-installment entries were posted on the customer's plans within the default_lookback_months months before enrollment; it is default_share when a Winter Protection Plan of the customer stands in default without that many recent missed-installment entries, or when no winter plan stands in default but a balance-return entry with reason default was posted on any of the customer's plans within the default_lookback_months months before enrollment; and it is zero otherwise."
      forgiven_half_year: "forgiveness_count_high or more forgiveness entries were posted on the customer's plans within the forgiveness_months months before enrollment"
      forgiveness_relief: "The forgiveness relief is forgiveness_relief_high when forgiveness_count_high or more forgiveness entries were posted on the customer's plans within the forgiveness_months months before enrollment, forgiveness_relief when at least forgiveness_count but fewer than forgiveness_count_high were, and zero when fewer than forgiveness_count were."
      returned_payments_year: "two or more returned-payment charges were posted to any of the customer's agreements within the nsf_months months before enrollment"
      returned_payment_share: "The returned-payment share is nsf_share_two_plus when two or more returned-payment charges were posted to any of the customer's agreements within the nsf_months months before enrollment, nsf_share_one when exactly one was, and zero when none was."
      notice_agreement_months: "when the start date of the agreement under notice lies at least tenure_long_months whole calendar months before enrollment"
      tenure_relief: "The tenure relief is tenure_relief_long when the start date of the agreement under notice lies at least tenure_long_months whole calendar months before enrollment, tenure_relief when it lies at least tenure_months but fewer than tenure_long_months whole months before, and zero when it is more recent."
      agency_payments_year: "two or more payments from an energy assistance agency were posted to any of the customer's agreements within the assistance_months months before enrollment"
      assistance_relief: "The assistance relief is assistance_relief_two_plus when two or more payments from an energy assistance agency were posted to any of the customer's agreements within the assistance_months months before enrollment, assistance_relief_one when exactly one was, and zero when none was."
      upfront_share: "The upfront share is the default share plus the returned-payment share, less the forgiveness relief, less the tenure relief and less the assistance relief; these are first added together into one share, applied once to the extension base, and a combined share below zero counts as zero."
      upfront_payment: "The part due now is the extension base times the upfront share, rounded half-up to the cent"
      result: "the amount carried by the extension is the extension base less the part due now, rounded half-up to the cent."
    factors:
      - id: extension_base
        effect: method
        decides: extension_base
        bindings: [final_notices, written_notice_amount, whole_balance, extension_base]
        ladder:
          - when: "a final notice has been delivered on the agreement"
            method: "the extension base is the agreement's whole account balance"
          - when: "a written notice but no final notice has been delivered on the agreement"
            method: "the extension base is the past-due amount stated on the latest written notice"
          - when: "otherwise (no notice delivered)"
            method: "the extension base is the agreement's past-due balance on the enrollment date"
        baseline:
          extension_base: "past_due_balance"
        evidence: [cross_category]
        cross_difficulty: service
      - id: default_share
        effect: parameter
        decides: default_share
        bindings: [winter_plans_defaulted, missed_entries_year, default_entries_year, default_share]
        ladder:
          - when: "a Winter Protection Plan of the customer stands in default and miss_count_high or more missed-installment entries within default_lookback_months"
            value: "K('default_share_high')"
          - when: "a Winter Protection Plan stands in default without that many recent missed entries, or a balance-return entry with reason default within default_lookback_months"
            value: "K('default_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          default_share: "0"
        evidence: [history]
        cross_difficulty: null
      - id: forgiveness_relief
        effect: parameter
        decides: forgiveness_relief
        bindings: [forgiven_half_year, forgiveness_relief]
        ladder:
          - when: "forgiveness_count_high or more forgiveness entries on the customer's plans within forgiveness_months"
            value: "K('forgiveness_relief_high')"
          - when: "at least forgiveness_count but fewer than forgiveness_count_high"
            value: "K('forgiveness_relief')"
          - when: "otherwise (fewer than forgiveness_count)"
            value: "0"
        baseline:
          forgiveness_relief: "0"
        evidence: [history]
        cross_difficulty: null
      - id: returned_payment_share
        effect: parameter
        decides: returned_payment_share
        bindings: [returned_payments_year, returned_payment_share]
        ladder:
          - when: "two or more returned-payment charges on any of the customer's agreements within nsf_months"
            value: "K('nsf_share_two_plus')"
          - when: "exactly one returned-payment charge within nsf_months"
            value: "K('nsf_share_one')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          returned_payment_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: tenure_relief
        effect: parameter
        decides: tenure_relief
        bindings: [notice_agreement_months, tenure_relief]
        ladder:
          - when: "the agreement under notice started at least tenure_long_months whole months before enrollment"
            value: "K('tenure_relief_long')"
          - when: "it started at least tenure_months but fewer than tenure_long_months whole months before"
            value: "K('tenure_relief')"
          - when: "otherwise (more recent)"
            value: "0"
        baseline:
          tenure_relief: "0"
        evidence: [date, cross_category]
        cross_difficulty: service
      - id: assistance_relief
        effect: parameter
        decides: assistance_relief
        bindings: [agency_payments_year, assistance_relief]
        ladder:
          - when: "two or more energy assistance agency payments on any of the customer's agreements within assistance_months"
            value: "K('assistance_relief_two_plus')"
          - when: "exactly one agency payment within assistance_months"
            value: "K('assistance_relief_one')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          assistance_relief: "0"
        evidence: [cross_category, history]
        cross_difficulty: service
    baseline:
      rule: >-
        The balance placed under a payment extension is the extension base. As standard, the extension base is
        the agreement's past-due balance on the enrollment date: its bills whose due date falls on or before the
        enrollment date plus its posted charges, less its payments and credits, all read over the ledger_months
        months before the enrollment date. The part due now is the extension
        base times the upfront share, rounded half-up to the cent, and the amount carried by the extension is the
        extension base less the part due now, rounded half-up to the cent. The standard upfront share is zero, so
        that the whole extension base is carried to the extended date.
      params: [ledger_months]
    inputs:
      history:
        - {category: service, table: service_bills, aggregate: sum, field: amount, within_months: 240}
        - {category: service, table: service_notices, aggregate: latest, field: past_due_amount, filters: {notice_type: written_notice}}
        - {table: arrangement_ledger, aggregate: count, field: arrangement_ledger_id, within_months: 6, filters: {event_type: arrangement_forgiveness}}
        - {table: arrangement_plans, aggregate: count, field: arrangement_id, filters: {status: defaulted, variant_name: Winter Protection Plan}}
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 12, filters: {event_type: service_returned_payment_charge}}
      cross_category: [service]
