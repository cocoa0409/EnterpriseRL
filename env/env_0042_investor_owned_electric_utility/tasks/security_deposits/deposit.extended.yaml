events:
  # ---- holding (deposit_accounts) ---------------------------------------------
  - type: deposit_assessment
    target: deposit_accounts
    mutation: create
    meaning: A security deposit is required on a service agreement.
    grain: One row per deposit requirement.
    fields:
      customer_id: Customer of record on the service agreement.
      service_account_id: Service agreement the deposit secures.
      variant_name: Deposit kind, official full name.
      assessed_date: Date the deposit was required.
      assessment_reason: Event that triggered the requirement.
      average_monthly_bill: Average monthly bill used in the calculation.
      required_amount: Deposit amount required.
      installment_count: Number of installments allowed for this deposit.
      security_instrument: Form in which the requirement will be met.
      first_installment_due_date: Date the first (or only) installment is due.
      status_date: Date of assessment.
    triggers: []
  - type: deposit_full_security
    target: deposit_accounts
    mutation: {transition: {from: assessed, to: held}}
    meaning: The required amount is fully secured.
    grain: One row per transaction.
    fields:
      fully_secured_date: Date the required amount was fully secured.
      refund_review_date: Date the satisfactory payment review falls due.
      status_date: Date the deposit became held.
    triggers: []
  - type: deposit_waiver
    target: deposit_accounts
    mutation: {transition: {from: assessed, to: waived}}
    meaning: The deposit requirement is withdrawn on an established waiver basis.
    grain: One row per transaction.
    fields:
      waiver_basis: Basis on which the deposit was waived.
      status_date: Date of the waiver.
    triggers: []
  - type: deposit_refund_completion
    target: deposit_accounts
    mutation: {transition: {from: held, to: refunded}}
    meaning: The deposit and interest are returned after a passed satisfactory payment review.
    grain: One row per transaction.
    fields:
      status_date: Date of the refund.
    triggers: []
  - type: deposit_final_application
    target: deposit_accounts
    mutation: {transition: [{from: held, to: applied_to_final_bill}, {from: assessed, to: applied_to_final_bill}]}
    meaning: The service agreement closed and the deposit cash and interest are applied to the final bill.
    grain: One row per transaction.
    fields:
      status_date: Date of application.
    triggers: []
  - type: deposit_cancellation
    target: deposit_accounts
    mutation: {transition: {from: assessed, to: cancelled}}
    meaning: The deposit requirement ends because the start order was cancelled before service began.
    grain: One row per transaction.
    fields:
      status_date: Date of cancellation.
    triggers: []
  - type: deposit_additional_requirement
    target: deposit_accounts
    mutation: {transition: {from: held, to: assessed}}
    meaning: A recalculation raises the required amount above the held amount and an additional deposit is due.
    grain: One row per transaction.
    fields:
      required_amount: New required amount.
      average_monthly_bill: Average monthly bill used in the recalculation.
      first_installment_due_date: Date the additional amount is due.
      status_date: Date of the recalculation.
    triggers: []
  - type: deposit_review_update
    target: deposit_accounts
    mutation: update
    meaning: The satisfactory payment review date is moved out after a failed review.
    grain: One row per transaction.
    fields:
      refund_review_date: New review date.
    triggers: []
  - type: deposit_transfer
    target: deposit_accounts
    mutation: update
    meaning: A held residential deposit moves with the customer to the customer's new service agreement.
    grain: One row per transaction.
    fields:
      service_account_id: New service agreement secured by the deposit.
    triggers: []
  # ---- ledger (deposit_transactions) ------------------------------------------
  - type: deposit_payment
    target: deposit_transactions
    meaning: A cash deposit installment is received.
    grain: One row per deposit installment payment.
    distinguish_by: [installment_number, transaction_date]
    fields:
      transaction_date: Date the payment was received.
      amount: Amount received.
      installment_number: Installment the payment satisfies (1 = first).
    account: deposit_held
    direction: in
    triggers: []
  - type: deposit_interest_credit
    target: deposit_transactions
    meaning: Simple interest on the cash deposit is credited to the deposit.
    grain: One row per interest period.
    distinguish_by: [interest_period_end]
    fields:
      transaction_date: Date the interest was credited.
      amount: Interest credited.
      interest_period_end: Last day of the period the interest covers.
    account: deposit_held
    direction: in
    triggers: []
  - type: deposit_refund
    target: deposit_transactions
    meaning: Deposit cash and interest are paid back to the customer.
    grain: One row per refund.
    distinguish_by: [refund_kind, transaction_date]
    fields:
      transaction_date: Date of the refund.
      amount: Amount refunded.
      refund_kind: Full refund, excess refund after recalculation, or refund of cash received on a cancelled or waived requirement.
      refund_method: Credited to the service agreement or paid by check.
    account: deposit_held
    direction: out
    triggers:
      - event: service:service_program_credit
        when: {refund_method: bill_credit}
        map: {posting_date: transaction_date, amount: amount, credit_code: deposit_refund, source_reference_id: deposit_transaction_id}
  - type: deposit_bill_application
    target: deposit_transactions
    meaning: Deposit cash and interest are applied to the closing service agreement's final balance.
    grain: One row per application.
    distinguish_by: [transaction_date]
    fields:
      transaction_date: Date of application.
      amount: Amount applied.
    account: deposit_held
    direction: out
    triggers:
      - event: service:service_program_credit
        map: {posting_date: transaction_date, amount: amount, credit_code: deposit_final_application, source_reference_id: deposit_transaction_id}

measures:
  - id: deposit_msr_average_bill
    window: The average_bill_lookback_months most recent regular bills (service_bill_issued with bill_kind regular) of the service agreement before the assessment or recalculation date.
    measure: Mean of their amount rounded to the cent; when the agreement has fewer than average_bill_minimum_months such bills, default_average_bill_usd is used instead.
  - id: deposit_msr_review_late_charges
    window: The refund_review_months months ending on the refund_review_date.
    measure: Count of service_late_payment_charge rows on the secured service agreement posted in the window, excluding charges later waived by a late_charge_waiver credit.
  - id: deposit_msr_review_returned_payments
    window: The refund_review_months months ending on the refund_review_date.
    measure: Count of service_payment_reversal rows on the secured service agreement posted in the window.
  - id: deposit_msr_review_disconnections
    window: The refund_review_months months ending on the refund_review_date.
    measure: Count of service_reconnection_charge rows on any of the customer's service agreements posted in the window, plus one for each of the customer's agreements currently in disconnected status.
  - id: deposit_msr_late_charges_12m
    window: The 12 calendar months ending on the assessment date.
    measure: Count of service_late_payment_charge rows on the service agreement posted in the window, excluding charges waived by a late_charge_waiver credit.
  - id: deposit_msr_cash_received
    window: The deposit's whole life.
    measure: Sum of amount of deposit_payment rows on the deposit.

policies:
  - id: deposit_agg_multi_holding
    subject: [deposit_assessment]
    rule: >-
      A customer may hold deposits on several service agreements, one deposit per service agreement. No other
      deposit on the same service agreement is in assessed or held status. A new trigger on an agreement that
      already carries a held deposit is handled by recalculation of that deposit, not by a second deposit.
    eligibility:
      - id: one_open_deposit_per_agreement
        applies_to: [deposit_assessment]
        kind: dedup
        condition: "No other deposit on the same service agreement is in assessed or held status."
        evidence_fields: [deposit_accounts.service_account_id, deposit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.service_account_id]
          action_bindings:
            deposit_accounts.service_account_id: service_account_id
        dedup_contract:
          table: deposit_accounts
          mode: separate_record
          object_bindings: {service_account_id: service_account_id}
          duplicate_filters: {status: [assessed, held]}
          distinct_fields: [assessed_date]
    params:
      max_per_customer: null

  - id: deposit_agg_customer_history
    subject: [deposit_refund_completion, deposit_waiver, deposit_bill_application]
    rule: >-
      Credit history is judged across the customer, not only the secured agreement. A disconnection for
      nonpayment on any of the customer's service agreements during the review period counts against the
      refund of every deposit the customer holds (deposit_msr_review_disconnections). The prior Lakeshore
      history waiver counts any closed agreement of the same customer. A deposit applied at closure meets the
      closing agreement's final balance first, then the unpaid balance of any other closed agreement of the
      same customer, and only the remainder is refunded.
    eligibility: []
    measures: [deposit_msr_review_disconnections]

  - id: deposit_assessment_rule
    subject: [deposit_assessment]
    rule: >-
      A deposit is assessed only for one of the triggers of its kind: a new service agreement opened without a
      waiver basis (new_service_trigger), a disconnection of the agreement for nonpayment
      (disconnection_trigger), late payment charges on the agreement in the 12 months before assessment
      reaching late_payment_trigger_count (deposit_msr_late_charges_12m), or a confirmed finding of meter
      tampering or diversion (unauthorized_use_finding_required). The deposit kind follows the customer_type
      and the agreement's rate schedule as listed in business_size_band. A new-service deposit must be assessed
      within the assessment window after the agreement's start date. A deposit triggered by disconnection must be
      assessed within the assessment window after the disconnection date. A deposit triggered by late payments
      must be assessed within the assessment window after the posting date of the late payment charge that
      reached the trigger count. A deposit triggered by unauthorized use must be assessed within the assessment
      window after the date of the field investigation that confirmed it. Each window is counted in calendar
      days from the day after its triggering date, and an assessment on the last day of the window is in time.
      The disconnection date is the agreement's last_status_date while it is disconnected. The required amount is
      deposit_multiple_of_average_bill times deposit_msr_average_bill, rounded up to the next whole dollar,
      then raised to minimum_deposit_usd and limited to maximum_deposit_usd. The installment count is
      installment_count_max, or installment_count_max_income_qualified when the customer's
      income_qualified_until is on or after the assessment date, reduced until each installment reaches
      minimum_installment_usd. The first installment is due first_installment_due_days after assessment and
      later installments under installment_schedule. Where reconnection_requires_first_installment is true,
      a disconnected agreement is not reconnected until the first installment is received, and where
      deposit_required_before_energization is true a new agreement is not energized until the deposit is held.
    eligibility:
      - id: new_service_window
        applies_to: [deposit_assessment]
        kind: time
        condition: "A new-service deposit must be assessed within the assessment window after the agreement's start date."
        evidence_fields: [service_accounts.start_date, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the agreement's start date
          anchor_source: service_accounts.start_date
          relation: not_after
          duration_source: variants.assessment_window_days
          unit: calendar_days
          counting_rule: "Each window is counted in calendar days from the day after its triggering date, and an assessment on the last day of the window is in time."
          boundary: inclusive
      - id: disconnection_window
        applies_to: [deposit_assessment]
        kind: time
        condition: "A deposit triggered by disconnection must be assessed within the assessment window after the disconnection date."
        evidence_fields: [service_accounts.last_status_date, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the disconnection date
          anchor_source: service_accounts.last_status_date
          relation: not_after
          duration_source: variants.assessment_window_days
          unit: calendar_days
          counting_rule: "Each window is counted in calendar days from the day after its triggering date, and an assessment on the last day of the window is in time."
          boundary: inclusive
      - id: late_payment_window
        applies_to: [deposit_assessment]
        kind: time
        condition: "A deposit triggered by late payments must be assessed within the assessment window after the posting date of the late payment charge that reached the trigger count."
        evidence_fields: [service_charges.posting_date, service_charges.service_charge_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_charges.service_charge_id]
          action_bindings:
            service_charges.service_charge_id: service_charge_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the posting date of the late payment charge that reached the trigger count
          anchor_source: service_charges.posting_date
          relation: not_after
          duration_source: variants.assessment_window_days
          unit: calendar_days
          counting_rule: "Each window is counted in calendar days from the day after its triggering date, and an assessment on the last day of the window is in time."
          boundary: inclusive
      - id: unauthorized_use_window
        applies_to: [deposit_assessment]
        kind: time
        condition: "A deposit triggered by unauthorized use must be assessed within the assessment window after the date of the field investigation that confirmed it."
        evidence_fields: [meter_field_orders.order_date, meter_field_orders.meter_field_order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [meter_field_orders.meter_field_order_id]
          action_bindings:
            meter_field_orders.meter_field_order_id: meter_field_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the field investigation that confirmed it
          anchor_source: meter_field_orders.order_date
          relation: not_after
          duration_source: variants.assessment_window_days
          unit: calendar_days
          counting_rule: "Each window is counted in calendar days from the day after its triggering date, and an assessment on the last day of the window is in time."
          boundary: inclusive
    params:
      per_tier:
        Residential New Service Deposit: {multiple: "=deposit_multiple_of_average_bill", minimum: "=minimum_deposit_usd", maximum: "=maximum_deposit_usd", installments: "=installment_count_max"}
        Residential Reestablishment Deposit: {multiple: "=deposit_multiple_of_average_bill", minimum: "=minimum_deposit_usd", maximum: "=maximum_deposit_usd", installments: "=installment_count_max"}
        Residential Unauthorized Use Deposit: {multiple: "=deposit_multiple_of_average_bill", minimum: "=minimum_deposit_usd", maximum: "=maximum_deposit_usd", installments: "=installment_count_max"}
        Small Commercial Service Deposit: {multiple: "=deposit_multiple_of_average_bill", minimum: "=minimum_deposit_usd", maximum: "=maximum_deposit_usd", installments: "=installment_count_max"}
        Medium Commercial Service Deposit: {multiple: "=deposit_multiple_of_average_bill", minimum: "=minimum_deposit_usd", maximum: "=maximum_deposit_usd", installments: "=installment_count_max"}
        Large Power Service Deposit: {multiple: "=deposit_multiple_of_average_bill", minimum: "=minimum_deposit_usd", maximum: "=maximum_deposit_usd", installments: "=installment_count_max"}
    formula:
      raw_amount: "deposit_multiple_of_average_bill * deposit_msr_average_bill"
      required_amount: "min(maximum_deposit_usd, max(minimum_deposit_usd, -(-raw_amount // 1)))"
    measures: [deposit_msr_average_bill, deposit_msr_late_charges_12m]

  - id: deposit_waiver_rule
    subject: [deposit_waiver, deposit_refund]
    rule: >-
      An assessed deposit is waived when one waiver basis offered by its kind is established. The waiver basis
      must be established no later than the waiver request window after the assessment date. The window is
      counted in calendar days from the day after the assessment date, and a basis established on the last day
      is in time. The bases are a letter of credit reference from the customer's prior electric utility
      showing at least waiver_prior_utility_letter_months of satisfactory payment, whose reference number the
      customer supplies; a closed Lakeshore agreement of the customer, ended within the 12 months before
      assessment, with at least waiver_prior_lakeshore_history_months of service and no disconnection or
      returned payment; a current income qualification where waiver_income_qualified is true; an account
      holder aged waiver_senior_age or more on the assessment date with no balance owed on any of the
      customer's agreements; or a medical certification on the agreement in active status where
      waiver_medical_certification is true. Only a deposit in assessed status can be waived. Any cash already
      received is refunded in full on the waiver, credited to the service agreement. A refund is posted only on
      a deposit in held, waived, refunded or cancelled status. A deposit kind whose
      agent_may_waive is false is never waived by a customer care agent, and a request to waive it is handed to
      a human representative as not covered by policy.
    eligibility:
      - id: waiver_in_window
        applies_to: [deposit_waiver]
        kind: time
        condition: "The waiver basis must be established no later than the waiver request window after the assessment date."
        evidence_fields: [deposit_accounts.assessed_date, deposit_accounts.deposit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_id]
          action_bindings:
            deposit_accounts.deposit_id: deposit_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the assessment date
          anchor_source: deposit_accounts.assessed_date
          relation: not_after
          duration_source: variants.waiver_request_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from the day after the assessment date, and a basis established on the last day is in time."
          boundary: inclusive
      - id: refund_on_settled_deposit
        applies_to: [deposit_refund]
        kind: state
        condition: "A refund is posted only on a deposit in held, waived, refunded or cancelled status."
        evidence_fields: [deposit_accounts.status, deposit_accounts.deposit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_id]
          action_bindings:
            deposit_accounts.deposit_id: deposit_id
        state_contract:
          field: deposit_accounts.status
          allowed: [waived, refunded, cancelled, held]
    params:
      per_tier:
        Residential New Service Deposit: {window_days: "=waiver_request_window_days", letter_months: "=waiver_prior_utility_letter_months", income: "=waiver_income_qualified", senior_age: "=waiver_senior_age", medical: "=waiver_medical_certification"}
        Residential Reestablishment Deposit: {window_days: "=waiver_request_window_days", letter_months: "=waiver_prior_utility_letter_months", income: "=waiver_income_qualified", senior_age: "=waiver_senior_age", medical: "=waiver_medical_certification"}
        Residential Unauthorized Use Deposit: {window_days: "=waiver_request_window_days", letter_months: "=waiver_prior_utility_letter_months", income: "=waiver_income_qualified", senior_age: "=waiver_senior_age", medical: "=waiver_medical_certification"}
        Small Commercial Service Deposit: {window_days: "=waiver_request_window_days", letter_months: "=waiver_prior_utility_letter_months", income: "=waiver_income_qualified", senior_age: "=waiver_senior_age", medical: "=waiver_medical_certification"}
        Medium Commercial Service Deposit: {window_days: "=waiver_request_window_days", letter_months: "=waiver_prior_utility_letter_months", income: "=waiver_income_qualified", senior_age: "=waiver_senior_age", medical: "=waiver_medical_certification"}
        Large Power Service Deposit: {window_days: "=waiver_request_window_days", letter_months: "=waiver_prior_utility_letter_months", income: "=waiver_income_qualified", senior_age: "=waiver_senior_age", medical: "=waiver_medical_certification"}

  - id: deposit_installments_and_security
    subject: [deposit_payment, deposit_full_security]
    rule: >-
      Deposit installments are paid directly to the deposit and never through the service bill balance. The
      regular installment is the required amount divided by the installment count, rounded down to the cent,
      and the last installment carries the remainder. Each installment number is recorded once. Deposit
      payments are accepted only while the deposit is in assessed status. The deposit becomes held on the day
      deposit_msr_cash_received reaches the required amount, or on the day an accepted instrument for the full
      required amount is lodged: a surety bond where surety_bond_accepted is true, an irrevocable letter of
      credit where letter_of_credit_accepted is true, or a third-party guarantee where
      third_party_guarantee_accepted is true. On that day the refund review date is set to the fully secured
      date plus refund_review_months calendar months.
    eligibility:
      - id: installment_once
        applies_to: [deposit_payment]
        kind: dedup
        condition: "Each installment number is recorded once."
        evidence_fields: [deposit_transactions.deposit_id, deposit_transactions.installment_number, deposit_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_transactions.deposit_id, deposit_transactions.installment_number]
          action_bindings:
            deposit_transactions.deposit_id: deposit_id
            deposit_transactions.installment_number: installment_number
        dedup_contract:
          table: deposit_transactions
          mode: separate_record
          object_bindings: {deposit_id: deposit_id, installment_number: installment_number}
          duplicate_filters: {event_type: [deposit_payment]}
          distinct_fields: []
      - id: payments_while_assessed
        applies_to: [deposit_payment]
        kind: state
        condition: "Deposit payments are accepted only while the deposit is in assessed status."
        evidence_fields: [deposit_accounts.status, deposit_accounts.deposit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_id]
          action_bindings:
            deposit_accounts.deposit_id: deposit_id
        state_contract:
          field: deposit_accounts.status
          allowed: [assessed]
    params:
      per_tier:
        Residential New Service Deposit: {surety: "=surety_bond_accepted", letter_of_credit: "=letter_of_credit_accepted", guarantee: "=third_party_guarantee_accepted", review_months: "=refund_review_months"}
        Residential Reestablishment Deposit: {surety: "=surety_bond_accepted", letter_of_credit: "=letter_of_credit_accepted", guarantee: "=third_party_guarantee_accepted", review_months: "=refund_review_months"}
        Residential Unauthorized Use Deposit: {surety: "=surety_bond_accepted", letter_of_credit: "=letter_of_credit_accepted", guarantee: "=third_party_guarantee_accepted", review_months: "=refund_review_months"}
        Small Commercial Service Deposit: {surety: "=surety_bond_accepted", letter_of_credit: "=letter_of_credit_accepted", guarantee: "=third_party_guarantee_accepted", review_months: "=refund_review_months"}
        Medium Commercial Service Deposit: {surety: "=surety_bond_accepted", letter_of_credit: "=letter_of_credit_accepted", guarantee: "=third_party_guarantee_accepted", review_months: "=refund_review_months"}
        Large Power Service Deposit: {surety: "=surety_bond_accepted", letter_of_credit: "=letter_of_credit_accepted", guarantee: "=third_party_guarantee_accepted", review_months: "=refund_review_months"}
    measures: [deposit_msr_cash_received]

  - id: deposit_interest_rule
    subject: [deposit_interest_credit]
    rule: >-
      Cash deposits earn simple interest at interest_rate_annual from the fully secured date; instruments earn
      nothing. Interest for a full year is credited on each anniversary of the fully secured date, and for a
      part year it is credited pro rata by days held over 365 on the refund or application date, rounded to
      the cent. No interest is paid when the deposit has been held for less than interest_min_holding_months
      in total. Interest is never compounded: it is computed on the cash received, excluding earlier interest.
      Each interest period is credited once, and interest is credited only on a deposit in held status.
    eligibility:
      - id: interest_on_held_deposit
        applies_to: [deposit_interest_credit]
        kind: state
        condition: "Each interest period is credited once, and interest is credited only on a deposit in held status."
        evidence_fields: [deposit_accounts.status, deposit_accounts.deposit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_id]
          action_bindings:
            deposit_accounts.deposit_id: deposit_id
        state_contract:
          field: deposit_accounts.status
          allowed: [held]
    params:
      days_in_year: 365
      per_tier:
        Residential New Service Deposit: {rate: "=interest_rate_annual", min_months: "=interest_min_holding_months"}
        Residential Reestablishment Deposit: {rate: "=interest_rate_annual", min_months: "=interest_min_holding_months"}
        Residential Unauthorized Use Deposit: {rate: "=interest_rate_annual", min_months: "=interest_min_holding_months"}
        Small Commercial Service Deposit: {rate: "=interest_rate_annual", min_months: "=interest_min_holding_months"}
        Medium Commercial Service Deposit: {rate: "=interest_rate_annual", min_months: "=interest_min_holding_months"}
        Large Power Service Deposit: {rate: "=interest_rate_annual", min_months: "=interest_min_holding_months"}
    formula:
      amount: "round(deposit_msr_cash_received * interest_rate_annual, 2)"
    measures: [deposit_msr_cash_received]

  - id: deposit_refund_review
    subject: [deposit_refund_completion, deposit_refund, deposit_review_update]
    rule: >-
      A held deposit is reviewed on its refund review date. The refund may be made only on or after the
      refund review date recorded on the deposit. Dates are compared as calendar dates, and the review date
      itself qualifies. The review passes when deposit_msr_review_late_charges is no more than
      refund_max_late_payments, deposit_msr_review_returned_payments is no more than
      refund_max_returned_payments, and, where refund_disconnection_free_required is true,
      deposit_msr_review_disconnections is zero. A passed review refunds the cash received plus interest
      through the refund date, by refund_method_default (a credit to the service agreement), or by check when
      check_refund_on_request is true and the customer asks for a check. A failed review leaves the deposit
      held and moves the refund review date out by review_extension_months. A third-party guarantee is released
      after guarantee_release_months of satisfactory payment and no cash is refunded for it.
    eligibility:
      - id: review_date_reached
        applies_to: [deposit_refund_completion]
        kind: time
        condition: "The refund may be made only on or after the refund review date recorded on the deposit."
        evidence_fields: [deposit_accounts.refund_review_date, deposit_accounts.deposit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_id]
          action_bindings:
            deposit_accounts.deposit_id: deposit_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the refund review date recorded on the deposit
          anchor_source: deposit_accounts.refund_review_date
          relation: not_before
          duration_source: params.review_offset_days
          unit: calendar_days
          counting_rule: "Dates are compared as calendar dates, and the review date itself qualifies."
          boundary: inclusive
    params:
      review_offset_days: 0
      per_tier:
        Residential New Service Deposit: {max_late: "=refund_max_late_payments", max_returned: "=refund_max_returned_payments", extension_months: "=review_extension_months"}
        Residential Reestablishment Deposit: {max_late: "=refund_max_late_payments", max_returned: "=refund_max_returned_payments", extension_months: "=review_extension_months"}
        Residential Unauthorized Use Deposit: {max_late: "=refund_max_late_payments", max_returned: "=refund_max_returned_payments", extension_months: "=review_extension_months"}
        Small Commercial Service Deposit: {max_late: "=refund_max_late_payments", max_returned: "=refund_max_returned_payments", extension_months: "=review_extension_months"}
        Medium Commercial Service Deposit: {max_late: "=refund_max_late_payments", max_returned: "=refund_max_returned_payments", extension_months: "=review_extension_months"}
        Large Power Service Deposit: {max_late: "=refund_max_late_payments", max_returned: "=refund_max_returned_payments", extension_months: "=review_extension_months"}
    measures: [deposit_msr_review_late_charges, deposit_msr_review_returned_payments, deposit_msr_review_disconnections]

  - id: deposit_closure_application
    subject: [deposit_final_application, deposit_bill_application, deposit_cancellation]
    rule: >-
      When the secured service agreement closes, a deposit in held or assessed status is applied to its final
      balance on the final bill date, together with interest earned through that date, in the order of
      application_order. A deposit whose kind allows transfer_on_move and whose customer has opened a new
      service agreement before the closure is moved instead of applied. When a start order is cancelled before
      the service began, the deposit is cancelled and any cash received is refunded in full. An application is
      posted only on a deposit in applied_to_final_bill status.
    eligibility:
      - id: apply_once
        applies_to: [deposit_bill_application]
        kind: state
        condition: "An application is posted only on a deposit in applied_to_final_bill status."
        evidence_fields: [deposit_accounts.status, deposit_accounts.deposit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_id]
          action_bindings:
            deposit_accounts.deposit_id: deposit_id
        state_contract:
          field: deposit_accounts.status
          allowed: [applied_to_final_bill]
    params:
      per_tier:
        Residential New Service Deposit: {transfer_on_move: "=transfer_on_move_allowed"}
        Residential Reestablishment Deposit: {transfer_on_move: "=transfer_on_move_allowed"}
        Residential Unauthorized Use Deposit: {transfer_on_move: "=transfer_on_move_allowed"}
        Small Commercial Service Deposit: {transfer_on_move: "=transfer_on_move_allowed"}
        Medium Commercial Service Deposit: {transfer_on_move: "=transfer_on_move_allowed"}
        Large Power Service Deposit: {transfer_on_move: "=transfer_on_move_allowed"}

  - id: deposit_recalculation
    subject: [deposit_additional_requirement, deposit_refund]
    rule: >-
      Business deposits are recalculated every recalculation_frequency_months after the fully secured date
      with the same formula as at assessment. When the recalculated amount exceeds the held cash by more than
      recalculation_increase_threshold_pct of the held cash, the deposit returns to assessed with the new
      required amount and the difference due within additional_deposit_due_days. When the recalculated amount
      is lower and recalculation_excess_refund is true, the held cash above the new amount is refunded as an
      excess refund and the deposit stays held. Residential deposits are never recalculated.
    eligibility: []
    params:
      per_tier:
        Residential New Service Deposit: {frequency_months: "=recalculation_frequency_months", threshold: "=recalculation_increase_threshold_pct", excess_refund: "=recalculation_excess_refund"}
        Residential Reestablishment Deposit: {frequency_months: "=recalculation_frequency_months", threshold: "=recalculation_increase_threshold_pct", excess_refund: "=recalculation_excess_refund"}
        Residential Unauthorized Use Deposit: {frequency_months: "=recalculation_frequency_months", threshold: "=recalculation_increase_threshold_pct", excess_refund: "=recalculation_excess_refund"}
        Small Commercial Service Deposit: {frequency_months: "=recalculation_frequency_months", threshold: "=recalculation_increase_threshold_pct", excess_refund: "=recalculation_excess_refund"}
        Medium Commercial Service Deposit: {frequency_months: "=recalculation_frequency_months", threshold: "=recalculation_increase_threshold_pct", excess_refund: "=recalculation_excess_refund"}
        Large Power Service Deposit: {frequency_months: "=recalculation_frequency_months", threshold: "=recalculation_increase_threshold_pct", excess_refund: "=recalculation_excess_refund"}
    measures: [deposit_msr_average_bill]

  - id: deposit_transfer_rule
    subject: [deposit_transfer]
    rule: >-
      A held deposit whose kind has transfer_on_move_allowed true moves to the customer's new service
      agreement when the customer stops service at one address and starts at another. The deposit moves only
      to a service agreement of the same customer in pending_start or active status. The fully secured date,
      review date and interest periods continue unchanged.
    eligibility:
      - id: move_to_open_agreement
        applies_to: [deposit_transfer]
        kind: state
        condition: "The deposit moves only to a service agreement of the same customer in pending_start or active status."
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [pending_start, active]

# ============================================================================
# extended_policies (security_deposits difficulty)
# ============================================================================
extended_policies:
  - id: deposit_ext_failed_review_extension
    base_policy_refs: [deposit_refund_review, deposit_agg_customer_history]
    overwrite:
      - base_policy: deposit_refund_review
        superseded_clause: >-
          A failed review leaves the deposit held and moves the refund review date out by review_extension_months.
        replaced_by: >-
          A held deposit whose satisfactory payment review is not passed stays held, and its refund review date moves out, counted from the review date recorded on the deposit, by a whole number of calendar months worked out as follows.
    trigger: state_due
    subject: [deposit_review_update]
    computes: extension_months
    target_tool: extend_deposit_review_04d6c850
    params:
      single_lapse_share: 0.5
      clean_credit_min_months: 3
      notice_add_one: 1
      notice_add_many: 3
      autopay_window_months: 6
      autopay_full_count: 6
      autopay_part_count: 3
      autopay_cut_full: 2
      autopay_cut_part: 1
      tenure_long_months: 120
      tenure_mid_months: 60
      tenure_cut_long: 2
      tenure_cut_mid: 1
      min_extension_months: 1
    rule: >-
      A held deposit whose satisfactory payment review is not passed stays held, and its refund review date moves out, counted from the review date recorded on the deposit, by a whole number of calendar months worked out as follows.
      The review window is the refund_review_months months ending on the decision day, the day on which the review is decided, and every count, date span and status this policy reads is taken on the decision day.
      In that window, late payment charges are counted on the secured agreement, deducting one for each courtesy late-charge waiver credit posted on the agreement in the window; returned payments are the payment reversals posted on the secured agreement; and disconnections are the reconnection charges posted on any of the customer's agreements, plus one when any of the customer's agreements is disconnected on the decision day.
      The extension is review_extension_months of the deposit's kind, counted from the recorded review date.
      The length of the extension follows the shortfall of the review: where a disconnection is counted or two or more returned payments are counted, the length is the full refund_review_months; where the counted late payment charges exceed refund_max_late_payments by exactly one and no returned payment is counted, the length is single_lapse_share of review_extension_months; in every other case the length is review_extension_months.
      Clean payment already earned since the latest lapse is credited against the length: where the latest late payment charge posted on the agreement, waived or not, lies at least clean_credit_min_months whole months before the decision day and no disconnection is counted, the whole months from that charge's posting date to the decision day are credited; where a disconnection is counted, the whole months from the posting date of the customer's latest reconnection charge to the decision day are credited; otherwise no month is credited.
      Disconnection notices issued on the secured agreement in the window add to the extension: two or more notices add notice_add_many months, exactly one notice adds notice_add_one month, and no notice adds nothing.
      Autopay lowers the extension: where at least autopay_full_count of the agreement's payments posted in the autopay_window_months months ending on the decision day came through autopay, autopay_cut_full months come off; where at least autopay_part_count but fewer than autopay_full_count did, autopay_cut_part month comes off; otherwise nothing comes off.
      The service length of the secured agreement lowers it as well: where the agreement has been in service for at least tenure_long_months whole months on the decision day, tenure_cut_long months come off; where for at least tenure_mid_months but fewer than tenure_long_months whole months, tenure_cut_mid month comes off; otherwise nothing comes off.
      The extension is the length, less the credited clean months, plus the notice months, less the autopay months and the service-length months, and never less than min_extension_months.
      Whole months between two dates are counted from the earlier date to the same day of a later month, a month whose day has not yet been reached on the later date not counting.
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [service_charges.event_type, service_charges.posting_date, service_credits.credit_code, service_credits.payment_channel, service_credits.posting_date, service_notices.notice_date, start_date, status]
        note: The length, clean-credit, notice, autopay and service-length tiers are all decided from the secured agreement's charges, credits, notices and start date, and from the customer's reconnection charges and agreement statuses.
    compute:
      - late_window: "XCOUNT('service', 'service_charges', within_months=P('refund_review_months'), date_field='posting_date', event_type='service_late_payment_charge', service_account_id=F('service_account_id'))"
      - waived_window: "XCOUNT('service', 'service_credits', within_months=P('refund_review_months'), date_field='posting_date', event_type='service_billing_credit', credit_code='late_charge_waiver', service_account_id=F('service_account_id'))"
      - returned_window: "XCOUNT('service', 'service_charges', within_months=P('refund_review_months'), date_field='posting_date', event_type='service_payment_reversal', service_account_id=F('service_account_id'))"
      - reconnections_window: "XCOUNT('service', 'service_charges', within_months=P('refund_review_months'), date_field='posting_date', event_type='service_reconnection_charge')"
      - disconnected_now: "1 if EXISTS('service', status='disconnected') else 0"
      - counted_late: "late_window - waived_window"
      - disconnections: "reconnections_window + disconnected_now"
      - extension_length: "P('refund_review_months') if (disconnections > 0 or returned_window >= 2) else (P('review_extension_months') * K('single_lapse_share') if (counted_late - P('refund_max_late_payments') == 1 and returned_window == 0) else P('review_extension_months'))"
      - latest_late_date: "XLATEST('service', 'service_charges', 'posting_date', date_field='posting_date', event_type='service_late_payment_charge', service_account_id=F('service_account_id'))"
      - latest_reconnection_date: "XLATEST('service', 'service_charges', 'posting_date', date_field='posting_date', event_type='service_reconnection_charge')"
      - clean_credit: "MONTHS(latest_late_date, NOW) if (latest_late_date != None and MONTHS(latest_late_date, NOW) >= K('clean_credit_min_months') and disconnections == 0) else (MONTHS(latest_reconnection_date, NOW) if disconnections > 0 else 0)"
      - notices_window: "XCOUNT('service', 'service_notices', within_months=P('refund_review_months'), date_field='notice_date', event_type='service_disconnect_notice', service_account_id=F('service_account_id'))"
      - notice_add: "K('notice_add_many') if notices_window >= 2 else (K('notice_add_one') if notices_window == 1 else 0)"
      - autopay_payments: "XCOUNT('service', 'service_credits', within_months=K('autopay_window_months'), date_field='posting_date', event_type='service_payment', payment_channel='autopay', service_account_id=F('service_account_id'))"
      - autopay_cut: "K('autopay_cut_full') if autopay_payments >= K('autopay_full_count') else (K('autopay_cut_part') if autopay_payments >= K('autopay_part_count') else 0)"
      - service_months: "MONTHS(CFIELD('service', 'start_date', service_account_id=F('service_account_id')), NOW)"
      - service_cut: "K('tenure_cut_long') if service_months >= K('tenure_long_months') else (K('tenure_cut_mid') if service_months >= K('tenure_mid_months') else 0)"
      - result: "MX(K('min_extension_months'), extension_length - clean_credit + notice_add - autopay_cut - service_cut)"
    compute_basis:
      late_window: "In that window, late payment charges are counted on the secured agreement, deducting one for each courtesy late-charge waiver credit posted on the agreement in the window; returned payments are the payment reversals posted on the secured agreement; and disconnections are the reconnection charges posted on any of the customer's agreements, plus one when any of the customer's agreements is disconnected on the decision day."
      waived_window: "In that window, late payment charges are counted on the secured agreement, deducting one for each courtesy late-charge waiver credit posted on the agreement in the window"
      returned_window: "returned payments are the payment reversals posted on the secured agreement"
      reconnections_window: "disconnections are the reconnection charges posted on any of the customer's agreements, plus one when any of the customer's agreements is disconnected on the decision day."
      disconnected_now: "plus one when any of the customer's agreements is disconnected on the decision day."
      extension_length: "The length of the extension follows the shortfall of the review: where a disconnection is counted or two or more returned payments are counted, the length is the full refund_review_months; where the counted late payment charges exceed refund_max_late_payments by exactly one and no returned payment is counted, the length is single_lapse_share of review_extension_months; in every other case the length is review_extension_months."
      latest_late_date: "where the latest late payment charge posted on the agreement, waived or not, lies at least clean_credit_min_months whole months before the decision day"
      latest_reconnection_date: "where a disconnection is counted, the whole months from the posting date of the customer's latest reconnection charge to the decision day are credited"
      clean_credit: "Clean payment already earned since the latest lapse is credited against the length: where the latest late payment charge posted on the agreement, waived or not, lies at least clean_credit_min_months whole months before the decision day and no disconnection is counted, the whole months from that charge's posting date to the decision day are credited; where a disconnection is counted, the whole months from the posting date of the customer's latest reconnection charge to the decision day are credited; otherwise no month is credited."
      notices_window: "Disconnection notices issued on the secured agreement in the window add to the extension"
      notice_add: "two or more notices add notice_add_many months, exactly one notice adds notice_add_one month, and no notice adds nothing."
      autopay_payments: "where at least autopay_full_count of the agreement's payments posted in the autopay_window_months months ending on the decision day came through autopay"
      autopay_cut: "Autopay lowers the extension: where at least autopay_full_count of the agreement's payments posted in the autopay_window_months months ending on the decision day came through autopay, autopay_cut_full months come off; where at least autopay_part_count but fewer than autopay_full_count did, autopay_cut_part month comes off; otherwise nothing comes off."
      service_months: "Whole months between two dates are counted from the earlier date to the same day of a later month, a month whose day has not yet been reached on the later date not counting."
      service_cut: "The service length of the secured agreement lowers it as well: where the agreement has been in service for at least tenure_long_months whole months on the decision day, tenure_cut_long months come off; where for at least tenure_mid_months but fewer than tenure_long_months whole months, tenure_cut_mid month comes off; otherwise nothing comes off."
      result: "The extension is the length, less the credited clean months, plus the notice months, less the autopay months and the service-length months, and never less than min_extension_months."
    factors:
      - id: shortfall_length
        effect: parameter
        decides: extension_length
        bindings: [late_window, waived_window, returned_window, reconnections_window, counted_late, disconnections, extension_length]
        ladder:
          - when: "a disconnection for nonpayment is counted in the review window, or two or more returned payments are counted on the secured agreement"
            value: "P('refund_review_months')"
          - when: "the counted late payment charges exceed refund_max_late_payments by exactly one, and no returned payment is counted"
            value: "P('review_extension_months') * K('single_lapse_share')"
          - when: "otherwise"
            value: "P('review_extension_months')"
        baseline:
          extension_length: "P('review_extension_months')"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: clean_run_credit
        effect: method
        decides: clean_credit
        bindings: [latest_late_date, latest_reconnection_date, clean_credit]
        ladder:
          - when: "the latest late payment charge on the secured agreement lies at least clean_credit_min_months whole months before the decision day, and no disconnection is counted"
            method: "the whole months from that late charge's posting date to the decision day are credited, so the extension runs from the latest late charge"
          - when: "a disconnection is counted in the review window"
            method: "the whole months from the customer's latest reconnection charge to the decision day are credited, so the extension runs from the restoration"
          - when: "otherwise"
            method: "no month is credited; the extension runs from the recorded review date"
        baseline:
          clean_credit: "0"
        evidence: [history, date, cross_category]
        cross_difficulty: service
      - id: notice_months
        effect: parameter
        decides: notice_add
        bindings: [notices_window, notice_add]
        ladder:
          - when: "two or more disconnection notices issued on the secured agreement in the review window"
            value: "K('notice_add_many')"
          - when: "exactly one disconnection notice issued on the secured agreement in the review window"
            value: "K('notice_add_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          notice_add: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: autopay_months
        effect: parameter
        decides: autopay_cut
        bindings: [autopay_payments, autopay_cut]
        ladder:
          - when: "at least autopay_full_count of the agreement's payments in the autopay_window_months months ending on the decision day came through autopay"
            value: "K('autopay_cut_full')"
          - when: "at least autopay_part_count but fewer than autopay_full_count of them came through autopay"
            value: "K('autopay_cut_part')"
          - when: "otherwise"
            value: "0"
        baseline:
          autopay_cut: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: service_length_months
        effect: parameter
        decides: service_cut
        bindings: [service_months, service_cut]
        ladder:
          - when: "the secured agreement has been in service at least tenure_long_months whole months on the decision day"
            value: "K('tenure_cut_long')"
          - when: "the secured agreement has been in service at least tenure_mid_months but fewer than tenure_long_months whole months"
            value: "K('tenure_cut_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          service_cut: "0"
        evidence: [date, cross_category]
        cross_difficulty: service
    baseline:
      rule: >-
        The extension is review_extension_months of the deposit's kind, counted from the recorded review date.
      params: [review_extension_months, min_extension_months]
    inputs:
      history:
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 24, filters: {event_type: service_late_payment_charge}}
        - {category: service, table: service_credits, aggregate: count, field: service_credit_id, within_months: 24, filters: {credit_code: late_charge_waiver}}
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 24, filters: {event_type: service_payment_reversal}}
        - {category: service, table: service_charges, aggregate: latest, field: posting_date, within_months: 0, filters: {event_type: service_late_payment_charge}}
        - {category: service, table: service_notices, aggregate: count, field: notice_id, within_months: 24, filters: {event_type: service_disconnect_notice}}
        - {category: service, table: service_credits, aggregate: count, field: service_credit_id, within_months: 6, filters: {payment_channel: autopay}}
      cross_category: [service]
  - id: deposit_ext_anniversary_interest
    base_policy_refs: [deposit_interest_rule, deposit_installments_and_security]
    overwrite:
      - base_policy: deposit_interest_rule
        superseded_clause: >-
          Cash deposits earn simple interest at interest_rate_annual from the fully secured date; instruments earn nothing.
        replaced_by: >-
          The Commission sets the deposit interest rate for each calendar year: rate_2024 for 2024, rate_2025 for 2025 and interest_rate_annual from 2026 on.
      - base_policy: deposit_interest_rule
        superseded_clause: >-
          Interest is never compounded: it is computed on the cash received, excluding earlier interest.
        replaced_by: >-
          Where an excess refund has been paid out of the deposit and no deposit payment was received in the year being credited, interest is earned on the cash received less the excess refunds paid; where a deposit payment was received in that year, interest is earned on the cash held when the year began plus one half of the payments received in the year; otherwise interest is earned on the cash received.
      - base_policy: deposit_interest_rule
        superseded_clause: >-
          Interest for a full year is credited on each anniversary of the fully secured date, and for a part year it is credited pro rata by days held over 365 on the refund or application date, rounded to the cent.
        replaced_by: >-
          The interest credited is the interest base times the period rate times the months earned over full_year_months, rounded to the cent once, at the end.
    trigger: state_due
    subject: [deposit_interest_credit]
    computes: interest_amount
    target_tool: credit_deposit_interest_e2c6de3a
    params:
      rate_2024: 0.0385
      rate_2025: 0.0402
      days_in_year: 365
      full_year_months: 12
      lapse_light_months: 9
      lapse_heavy_months: 6
      lapse_heavy_count: 3
      interest_year_months: 12
    rule: >-
      A held cash deposit is credited on each anniversary of its fully secured date with simple interest for the year that the anniversary closes, booked as one interest credit dated that day whose period ends on the anniversary; instruments earn nothing and interest never earns interest.
      The interest for a completed year is credited only once the refund review date recorded on the deposit falls after the anniversary that closes that year.
      The interest for a completed year is the cash received on the deposit times the Commission's deposit interest rate for the calendar year of the anniversary, rounded to the cent.
      The year being credited begins on the period end of the latest interest credit on the deposit, or on the fully secured date when no interest has been credited yet, and it covers the interest_year_months months ending on the anniversary; the payments and lapses of that year are counted over the interest_year_months months ending on the day the credit is booked, which is the anniversary.
      The Commission sets the deposit interest rate for each calendar year: rate_2024 for 2024, rate_2025 for 2025 and interest_rate_annual from 2026 on.
      The rate of the calendar year in which the year being credited began is therefore rate_2025 when it began in 2025, rate_2024 when it began in 2024, and interest_rate_annual otherwise; the rate of the closing year is the rate of the calendar year of the anniversary.
      Where the year being credited began in an earlier calendar year than its anniversary and that earlier year's rate differs from the closing year's rate, its days up to and including 31 December of that earlier year earn the earlier year's rate and its days from 1 January of the anniversary's year on earn the closing year's rate, each counted as days over days_in_year; where the period credited is shorter than days_in_year days and earns a single year's rate, its days earn the closing year's rate as days over days_in_year; otherwise the whole year earns the closing year's rate.
      Days are counted from the start date to the end date, the start date not counted.
      Where an excess refund has been paid out of the deposit and no deposit payment was received in the year being credited, interest is earned on the cash received less the excess refunds paid; where a deposit payment was received in that year, interest is earned on the cash held when the year began plus one half of the payments received in the year; otherwise interest is earned on the cash received.
      Interest is earned only for months of satisfactory payment on the secured agreement, counting late payment charges after deducting one for each courtesy late-charge waiver credit posted in the year: where, in the year being credited, a reconnection charge was posted on any of the customer's agreements, a payment reversal was posted on the secured agreement, or lapse_heavy_count or more late payment charges are counted, the year earns lapse_heavy_months months of interest; where one late payment charge or more, but fewer than lapse_heavy_count, are counted, with no payment reversal and no reconnection charge, the year earns lapse_light_months months; otherwise it earns full_year_months months.
      The interest credited is the interest base times the period rate times the months earned over full_year_months, rounded to the cent once, at the end.
    prerequisite:
      - problem: deposit_ext_failed_review_extension
        kind: state_gate
        gate: deposit_accounts.refund_review_date
        form: state
        policy_source: >-
          The interest for a completed year is credited only once the refund review date recorded on the deposit falls after the anniversary that closes that year.
        condition: >-
          The deposit's refund_review_date is later than the anniversary whose year is being credited, which is the day the credit is booked.
        resolved_by: extend_deposit_review_04d6c850
        effect: >-
          Once the review date that fell on the anniversary has been moved out by the extension of a review that was not passed, the deposit stays held past the anniversary and the year's interest credit may be booked.
    cross_category:
      - category: service
        as: history
        reads: [service_charges.event_type, service_charges.posting_date, service_credits.credit_code, service_credits.posting_date]
        note: The months-earned tier is decided from the secured agreement's late payment charges, courtesy waivers and payment reversals and from the customer's reconnection charges in the year being credited.
    compute:
      - credits_on_file: "COUNT('deposit_transactions', event_type='deposit_interest_credit')"
      - latest_credit_end: "LATEST('deposit_transactions', 'interest_period_end', date_field='transaction_date', event_type='deposit_interest_credit')"
      - year_start: "latest_credit_end if credits_on_file > 0 else F('fully_secured_date')"
      - closing_rate: "K('rate_2024') if NOW < '2025-01-01' else (K('rate_2025') if NOW < '2026-01-01' else P('interest_rate_annual'))"
      - prior_year_rate: "K('rate_2025') if (year_start >= '2025-01-01' and year_start < '2026-01-01') else (K('rate_2024') if (year_start >= '2024-01-01' and year_start < '2025-01-01') else P('interest_rate_annual'))"
      - closing_year_start: "'2026-01-01' if NOW >= '2026-01-01' else ('2025-01-01' if NOW >= '2025-01-01' else '2024-01-01')"
      - days_held: "DAYS(year_start, NOW)"
      - days_prior_year: "MX(0, DAYS(year_start, closing_year_start) - 1)"
      - period_rate: "(days_prior_year * prior_year_rate + (days_held - days_prior_year) * closing_rate) / K('days_in_year') if (days_prior_year > 0 and prior_year_rate != closing_rate) else (closing_rate * days_held / K('days_in_year') if days_held < K('days_in_year') else closing_rate)"
      - cash_received: "SUM('deposit_transactions', 'amount', event_type='deposit_payment')"
      - excess_refunded: "SUM('deposit_transactions', 'amount', event_type='deposit_refund', refund_kind='excess_refund')"
      - paid_in_year: "SUM('deposit_transactions', 'amount', within_months=K('interest_year_months'), date_field='transaction_date', event_type='deposit_payment')"
      - interest_base: "cash_received - excess_refunded if (excess_refunded > 0 and paid_in_year == 0) else (cash_received - excess_refunded - paid_in_year / 2 if paid_in_year > 0 else cash_received)"
      - late_year: "XCOUNT('service', 'service_charges', within_months=K('interest_year_months'), date_field='posting_date', event_type='service_late_payment_charge', service_account_id=F('service_account_id'))"
      - waived_year: "XCOUNT('service', 'service_credits', within_months=K('interest_year_months'), date_field='posting_date', event_type='service_billing_credit', credit_code='late_charge_waiver', service_account_id=F('service_account_id'))"
      - returned_year: "XCOUNT('service', 'service_charges', within_months=K('interest_year_months'), date_field='posting_date', event_type='service_payment_reversal', service_account_id=F('service_account_id'))"
      - reconnections_year: "XCOUNT('service', 'service_charges', within_months=K('interest_year_months'), date_field='posting_date', event_type='service_reconnection_charge')"
      - counted_late_year: "late_year - waived_year"
      - earning_months: "K('lapse_heavy_months') if (reconnections_year > 0 or returned_year > 0 or counted_late_year >= K('lapse_heavy_count')) else (K('lapse_light_months') if (counted_late_year >= 1 and counted_late_year < K('lapse_heavy_count') and returned_year == 0 and reconnections_year == 0) else K('full_year_months'))"
      - result: "RND(interest_base * period_rate * earning_months / K('full_year_months'), 2)"
    compute_basis:
      credits_on_file: "The year being credited begins on the period end of the latest interest credit on the deposit, or on the fully secured date when no interest has been credited yet"
      latest_credit_end: "The year being credited begins on the period end of the latest interest credit on the deposit"
      year_start: "The year being credited begins on the period end of the latest interest credit on the deposit, or on the fully secured date when no interest has been credited yet, and it covers the interest_year_months months ending on the anniversary; the payments and lapses of that year are counted over the interest_year_months months ending on the day the credit is booked, which is the anniversary."
      prior_year_rate: "The rate of the calendar year in which the year being credited began is therefore rate_2025 when it began in 2025, rate_2024 when it began in 2024, and interest_rate_annual otherwise"
      closing_rate: "the rate of the closing year is the rate of the calendar year of the anniversary."
      closing_year_start: "its days from 1 January of the anniversary's year on earn the closing year's rate"
      days_held: "Days are counted from the start date to the end date, the start date not counted."
      days_prior_year: "its days up to and including 31 December of that earlier year earn the earlier year's rate and its days from 1 January of the anniversary's year on earn the closing year's rate, each counted as days over days_in_year"
      period_rate: "Where the year being credited began in an earlier calendar year than its anniversary and that earlier year's rate differs from the closing year's rate, its days up to and including 31 December of that earlier year earn the earlier year's rate and its days from 1 January of the anniversary's year on earn the closing year's rate, each counted as days over days_in_year; where the period credited is shorter than days_in_year days and earns a single year's rate, its days earn the closing year's rate as days over days_in_year; otherwise the whole year earns the closing year's rate."
      cash_received: "otherwise interest is earned on the cash received."
      excess_refunded: "interest is earned on the cash received less the excess refunds paid"
      paid_in_year: "where a deposit payment was received in that year, interest is earned on the cash held when the year began plus one half of the payments received in the year"
      interest_base: "Where an excess refund has been paid out of the deposit and no deposit payment was received in the year being credited, interest is earned on the cash received less the excess refunds paid; where a deposit payment was received in that year, interest is earned on the cash held when the year began plus one half of the payments received in the year; otherwise interest is earned on the cash received."
      late_year: "Interest is earned only for months of satisfactory payment on the secured agreement, counting late payment charges after deducting one for each courtesy late-charge waiver credit posted in the year"
      waived_year: "counting late payment charges after deducting one for each courtesy late-charge waiver credit posted in the year"
      returned_year: "a payment reversal was posted on the secured agreement"
      reconnections_year: "a reconnection charge was posted on any of the customer's agreements"
      counted_late_year: "counting late payment charges after deducting one for each courtesy late-charge waiver credit posted in the year"
      earning_months: "where, in the year being credited, a reconnection charge was posted on any of the customer's agreements, a payment reversal was posted on the secured agreement, or lapse_heavy_count or more late payment charges are counted, the year earns lapse_heavy_months months of interest; where one late payment charge or more, but fewer than lapse_heavy_count, are counted, with no payment reversal and no reconnection charge, the year earns lapse_light_months months; otherwise it earns full_year_months months."
      result: "The interest credited is the interest base times the period rate times the months earned over full_year_months, rounded to the cent once, at the end."
    factors:
      - id: opening_year_rate
        effect: parameter
        decides: prior_year_rate
        bindings: [credits_on_file, latest_credit_end, year_start, prior_year_rate]
        ladder:
          - when: "the year being credited began in calendar 2025"
            value: "K('rate_2025')"
          - when: "the year being credited began in calendar 2024"
            value: "K('rate_2024')"
          - when: "otherwise"
            value: "P('interest_rate_annual')"
        baseline:
          prior_year_rate: "closing_rate"
        evidence: [history, date]
        cross_difficulty: null
      - id: calendar_year_split
        effect: method
        decides: period_rate
        bindings: [closing_rate, closing_year_start, days_held, days_prior_year, period_rate]
        ladder:
          - when: "the year being credited began in an earlier calendar year than its anniversary, and that earlier year's rate differs from the closing year's rate"
            method: "the days up to and including 31 December of the earlier year earn the earlier year's rate and the days from 1 January of the anniversary's year on earn the closing year's rate, each as days over days_in_year"
          - when: "the period credited is shorter than days_in_year days and earns a single year's rate"
            method: "its days earn the closing year's rate as days over days_in_year"
          - when: "otherwise"
            method: "the whole year earns the closing year's rate"
        baseline:
          period_rate: "closing_rate"
        evidence: [date, history]
        cross_difficulty: null
      - id: interest_cash_base
        effect: method
        decides: interest_base
        bindings: [cash_received, excess_refunded, paid_in_year, interest_base]
        ladder:
          - when: "an excess refund has been paid out of the deposit and no deposit payment was received in the year being credited"
            method: "interest is earned on the cash received less the excess refunds paid"
          - when: "a deposit payment was received in the year being credited"
            method: "interest is earned on the cash held when the year began plus one half of the payments received in the year"
          - when: "otherwise"
            method: "interest is earned on the cash received"
        baseline:
          interest_base: "cash_received"
        evidence: [history]
        cross_difficulty: null
      - id: satisfactory_months
        effect: parameter
        decides: earning_months
        bindings: [late_year, waived_year, returned_year, reconnections_year, counted_late_year, earning_months]
        ladder:
          - when: "in the year being credited a reconnection charge was posted on any of the customer's agreements or a payment reversal on the secured agreement, or lapse_heavy_count or more late payment charges are counted on it"
            value: "K('lapse_heavy_months')"
          - when: "one or more but fewer than lapse_heavy_count late payment charges are counted in the year, with no payment reversal and no reconnection charge"
            value: "K('lapse_light_months')"
          - when: "otherwise"
            value: "K('full_year_months')"
        baseline:
          earning_months: "K('full_year_months')"
        evidence: [history, cross_category]
        cross_difficulty: service
    baseline:
      rule: >-
        The Commission sets the deposit interest rate for each calendar year: rate_2024 for 2024, rate_2025 for 2025 and interest_rate_annual from 2026 on.
        The interest for a completed year is the cash received on the deposit times the Commission's deposit interest rate for the calendar year of the anniversary, rounded to the cent.
      params: [interest_rate_annual, rate_2024, rate_2025]
    inputs:
      history:
        - {table: deposit_transactions, aggregate: sum, field: amount, within_months: 0, filters: {event_type: deposit_payment}}
        - {table: deposit_transactions, aggregate: sum, field: amount, within_months: 0, filters: {event_type: deposit_refund, refund_kind: excess_refund}}
        - {table: deposit_transactions, aggregate: latest, field: interest_period_end, within_months: 0, filters: {event_type: deposit_interest_credit}}
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 12, filters: {event_type: service_late_payment_charge}}
        - {category: service, table: service_credits, aggregate: count, field: service_credit_id, within_months: 12, filters: {credit_code: late_charge_waiver}}
      cross_category: [service]
  - id: deposit_ext_recalculated_requirement
    base_policy_refs: [deposit_recalculation, deposit_assessment_rule]
    overwrite:
      - base_policy: deposit_recalculation
        superseded_clause: >-
          Business deposits are recalculated every recalculation_frequency_months after the fully secured date with the same formula as at assessment.
        replaced_by: >-
          A held business deposit is recalculated every recalculation_frequency_months after its fully secured date, and the recalculated requirement is worked out as follows.
    trigger: state_due
    subject: [deposit_additional_requirement]
    computes: required_amount
    target_tool: require_additional_deposit_b541b477
    params:
      recent_months: 3
      half_year_months: 6
      record_window_months: 12
      growth_ratio: 1.25
      decline_ratio: 0.75
      poor_record_late_count: 3
      poor_record_load: 0.5
      clean_record_relief: 0.5
      tenure_long_months: 120
      tenure_mid_months: 60
      tenure_multiple_cut_long: 0.5
      tenure_multiple_cut_mid: 0.25
      notice_load_one: 0.25
      notice_load_many: 0.5
      large_increase_ratio: 1.0
      phase_share_large: 0.5
      phase_share_moderate: 0.75
    rule: >-
      A held business deposit is recalculated every recalculation_frequency_months after its fully secured date, and the recalculated requirement is worked out as follows.
      The recalculated requirement is not fixed until the deposit carries an interest credit for every anniversary of its fully secured date reached so far.
      The recalculated requirement is deposit_multiple_of_average_bill times the mean of the secured agreement's regular bills issued in the average_bill_lookback_months months ending on the recalculation date, the mean rounded to the cent, and the product rounded to the cent and then up to the next whole dollar, raised to minimum_deposit_usd and limited to maximum_deposit_usd; with fewer than average_bill_minimum_months such bills, default_average_bill_usd stands in for the mean.
      The billing basis follows the agreement's recent load: where the mean of its regular bills issued in the recent_months months ending on the recalculation date exceeds the twelve-month mean times growth_ratio and the billing demand on its latest regular bill exceeds the average billing demand of the twelve-month bills, the basis is that recent mean; where the recent mean is below the twelve-month mean times decline_ratio and the latest billing demand is below that average billing demand, the basis is the mean of its regular bills issued in the half_year_months months ending on the recalculation date; otherwise the basis is the twelve-month mean; each mean is rounded to the cent.
      The billing basis so chosen, rounded to the cent, is the average monthly bill recorded on the deposit with the recalculated requirement.
      The multiple applied to the recalculated requirement follows the secured agreement's payment record in the record_window_months months ending on the recalculation date, late payment charges being counted after deducting one for each courtesy late-charge waiver credit: where poor_record_late_count or more late payment charges are counted or any payment reversal was posted, the multiple is deposit_multiple_of_average_bill plus poor_record_load; where no late payment charge is counted and no payment reversal was posted, it is deposit_multiple_of_average_bill less clean_record_relief; otherwise it is deposit_multiple_of_average_bill.
      The service length of the secured agreement lowers that multiple: an agreement in service at least tenure_long_months whole months on the recalculation date takes tenure_multiple_cut_long off it, one in service at least tenure_mid_months but fewer than tenure_long_months whole months takes tenure_multiple_cut_mid off, and any other takes nothing off.
      Disconnection notices raise that multiple: two or more notices issued on the secured agreement in the record_window_months months add notice_load_many, exactly one adds notice_load_one, and none adds nothing.
      The recalculated requirement before rounding is the billing basis times the multiple so adjusted.
      A rise driven by recent load growth is phased in against the held amount, which is the cash received less the cash refunded plus the interest credited on the deposit: where the recent mean is the billing basis and the requirement before rounding exceeds the held amount by more than large_increase_ratio times the held amount, only phase_share_large of that excess is added to the held amount; where the recent mean is the billing basis and the requirement before rounding exceeds the held amount by no more than large_increase_ratio times it, phase_share_moderate of the excess is added; otherwise the requirement before rounding is taken in full.
      The phased amount is rounded to the cent and then up to the next whole dollar, raised to minimum_deposit_usd and limited to maximum_deposit_usd.
      Whole months between two dates are counted from the earlier date to the same day of a later month, a month whose day has not yet been reached on the later date not counting.
    prerequisite:
      - problem: deposit_ext_anniversary_interest
        kind: value_input
        gate: held_amount_now
        form: state
        policy_source: >-
          The recalculated requirement is not fixed until the deposit carries an interest credit for every anniversary of its fully secured date reached so far.
        condition: >-
          deposit_transactions on the deposit include a deposit_interest_credit whose interest_period_end is each anniversary of fully_secured_date up to and including the recalculation date.
        resolved_by: credit_deposit_interest_e2c6de3a
        effect: >-
          The year's interest credit raises the held amount against which a rise driven by load growth is phased in, so the phased requirement changes.
    cross_category:
      - category: service
        as: history
        reads: [service_bills.amount, service_bills.billing_demand_kw, service_bills.bill_date, service_bills.bill_kind, service_charges.event_type, service_charges.posting_date, service_credits.credit_code, service_notices.notice_date, start_date]
        note: The billing basis, the payment-record multiple, the service-length cut and the notice load are decided from the secured agreement's bills, charges, credits, notices and start date.
    compute:
      - bills_year_sum: "XSUM('service', 'service_bills', 'amount', within_months=P('average_bill_lookback_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=F('service_account_id'))"
      - bills_year_count: "XCOUNT('service', 'service_bills', within_months=P('average_bill_lookback_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=F('service_account_id'))"
      - mean_year: "RND(bills_year_sum / bills_year_count, 2) if bills_year_count >= P('average_bill_minimum_months') else P('default_average_bill_usd')"
      - bills_recent_sum: "XSUM('service', 'service_bills', 'amount', within_months=K('recent_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=F('service_account_id'))"
      - bills_recent_count: "XCOUNT('service', 'service_bills', within_months=K('recent_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=F('service_account_id'))"
      - bills_half_sum: "XSUM('service', 'service_bills', 'amount', within_months=K('half_year_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=F('service_account_id'))"
      - bills_half_count: "XCOUNT('service', 'service_bills', within_months=K('half_year_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=F('service_account_id'))"
      - mean_recent: "RND(bills_recent_sum / bills_recent_count, 2) if bills_recent_count > 0 else mean_year"
      - mean_half: "RND(bills_half_sum / bills_half_count, 2) if bills_half_count > 0 else mean_year"
      - demand_latest: "XLATEST('service', 'service_bills', 'billing_demand_kw', date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=F('service_account_id'))"
      - demand_year_sum: "XSUM('service', 'service_bills', 'billing_demand_kw', within_months=P('average_bill_lookback_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=F('service_account_id'))"
      - demand_average: "demand_year_sum / bills_year_count if bills_year_count > 0 else 0"
      - billing_basis: "mean_recent if (mean_recent > mean_year * K('growth_ratio') and demand_latest > demand_average) else (mean_half if (mean_recent < mean_year * K('decline_ratio') and demand_latest < demand_average) else mean_year)"
      - late_record: "XCOUNT('service', 'service_charges', within_months=K('record_window_months'), date_field='posting_date', event_type='service_late_payment_charge', service_account_id=F('service_account_id'))"
      - waived_record: "XCOUNT('service', 'service_credits', within_months=K('record_window_months'), date_field='posting_date', event_type='service_billing_credit', credit_code='late_charge_waiver', service_account_id=F('service_account_id'))"
      - returned_record: "XCOUNT('service', 'service_charges', within_months=K('record_window_months'), date_field='posting_date', event_type='service_payment_reversal', service_account_id=F('service_account_id'))"
      - counted_late_record: "late_record - waived_record"
      - record_multiple: "P('deposit_multiple_of_average_bill') + K('poor_record_load') if (counted_late_record >= K('poor_record_late_count') or returned_record > 0) else (P('deposit_multiple_of_average_bill') - K('clean_record_relief') if (counted_late_record == 0 and returned_record == 0) else P('deposit_multiple_of_average_bill'))"
      - service_months: "MONTHS(CFIELD('service', 'start_date', service_account_id=F('service_account_id')), NOW)"
      - service_multiple_cut: "K('tenure_multiple_cut_long') if service_months >= K('tenure_long_months') else (K('tenure_multiple_cut_mid') if service_months >= K('tenure_mid_months') else 0)"
      - notices_record: "XCOUNT('service', 'service_notices', within_months=K('record_window_months'), date_field='notice_date', event_type='service_disconnect_notice', service_account_id=F('service_account_id'))"
      - notice_load: "K('notice_load_many') if notices_record >= 2 else (K('notice_load_one') if notices_record == 1 else 0)"
      - requirement_raw: "billing_basis * (record_multiple - service_multiple_cut + notice_load)"
      - cash_in: "SUM('deposit_transactions', 'amount', event_type='deposit_payment')"
      - cash_out: "SUM('deposit_transactions', 'amount', event_type='deposit_refund')"
      - interest_in: "SUM('deposit_transactions', 'amount', event_type='deposit_interest_credit')"
      - held_amount_now: "cash_in - cash_out + interest_in"
      - phase_share: "K('phase_share_large') if (billing_basis == mean_recent and requirement_raw - held_amount_now > K('large_increase_ratio') * held_amount_now) else (K('phase_share_moderate') if (billing_basis == mean_recent and requirement_raw > held_amount_now and requirement_raw - held_amount_now <= K('large_increase_ratio') * held_amount_now) else 1)"
      - phased: "held_amount_now + (requirement_raw - held_amount_now) * phase_share if requirement_raw > held_amount_now else requirement_raw"
      - result: "MN(P('maximum_deposit_usd'), MX(P('minimum_deposit_usd'), -(-RND(phased, 2) // 1)))"
    compute_basis:
      bills_year_sum: "the mean of the secured agreement's regular bills issued in the average_bill_lookback_months months ending on the recalculation date"
      bills_year_count: "with fewer than average_bill_minimum_months such bills, default_average_bill_usd stands in for the mean."
      mean_year: "The recalculated requirement is deposit_multiple_of_average_bill times the mean of the secured agreement's regular bills issued in the average_bill_lookback_months months ending on the recalculation date, the mean rounded to the cent, and the product rounded to the cent and then up to the next whole dollar, raised to minimum_deposit_usd and limited to maximum_deposit_usd; with fewer than average_bill_minimum_months such bills, default_average_bill_usd stands in for the mean."
      bills_recent_sum: "where the mean of its regular bills issued in the recent_months months ending on the recalculation date exceeds the twelve-month mean times growth_ratio"
      bills_recent_count: "the mean of its regular bills issued in the recent_months months ending on the recalculation date"
      bills_half_sum: "the basis is the mean of its regular bills issued in the half_year_months months ending on the recalculation date"
      bills_half_count: "the mean of its regular bills issued in the half_year_months months ending on the recalculation date"
      mean_recent: "each mean is rounded to the cent."
      mean_half: "each mean is rounded to the cent."
      demand_latest: "the billing demand on its latest regular bill exceeds the average billing demand of the twelve-month bills"
      demand_year_sum: "the average billing demand of the twelve-month bills"
      demand_average: "the average billing demand of the twelve-month bills"
      billing_basis: "The billing basis follows the agreement's recent load: where the mean of its regular bills issued in the recent_months months ending on the recalculation date exceeds the twelve-month mean times growth_ratio and the billing demand on its latest regular bill exceeds the average billing demand of the twelve-month bills, the basis is that recent mean; where the recent mean is below the twelve-month mean times decline_ratio and the latest billing demand is below that average billing demand, the basis is the mean of its regular bills issued in the half_year_months months ending on the recalculation date; otherwise the basis is the twelve-month mean; each mean is rounded to the cent."
      late_record: "The multiple applied to the recalculated requirement follows the secured agreement's payment record in the record_window_months months ending on the recalculation date, late payment charges being counted after deducting one for each courtesy late-charge waiver credit"
      waived_record: "late payment charges being counted after deducting one for each courtesy late-charge waiver credit"
      returned_record: "or any payment reversal was posted"
      counted_late_record: "late payment charges being counted after deducting one for each courtesy late-charge waiver credit"
      record_multiple: "where poor_record_late_count or more late payment charges are counted or any payment reversal was posted, the multiple is deposit_multiple_of_average_bill plus poor_record_load; where no late payment charge is counted and no payment reversal was posted, it is deposit_multiple_of_average_bill less clean_record_relief; otherwise it is deposit_multiple_of_average_bill."
      service_months: "Whole months between two dates are counted from the earlier date to the same day of a later month, a month whose day has not yet been reached on the later date not counting."
      service_multiple_cut: "The service length of the secured agreement lowers that multiple: an agreement in service at least tenure_long_months whole months on the recalculation date takes tenure_multiple_cut_long off it, one in service at least tenure_mid_months but fewer than tenure_long_months whole months takes tenure_multiple_cut_mid off, and any other takes nothing off."
      notices_record: "Disconnection notices raise that multiple: two or more notices issued on the secured agreement in the record_window_months months"
      notice_load: "two or more notices issued on the secured agreement in the record_window_months months add notice_load_many, exactly one adds notice_load_one, and none adds nothing."
      requirement_raw: "The recalculated requirement before rounding is the billing basis times the multiple so adjusted."
      cash_in: "the held amount, which is the cash received less the cash refunded plus the interest credited on the deposit"
      cash_out: "the cash received less the cash refunded"
      interest_in: "plus the interest credited on the deposit"
      held_amount_now: "the held amount, which is the cash received less the cash refunded plus the interest credited on the deposit"
      phase_share: "where the recent mean is the billing basis and the requirement before rounding exceeds the held amount by more than large_increase_ratio times the held amount, only phase_share_large of that excess is added to the held amount; where the recent mean is the billing basis and the requirement before rounding exceeds the held amount by no more than large_increase_ratio times it, phase_share_moderate of the excess is added; otherwise the requirement before rounding is taken in full."
      phased: "A rise driven by recent load growth is phased in against the held amount"
      result: "The phased amount is rounded to the cent and then up to the next whole dollar, raised to minimum_deposit_usd and limited to maximum_deposit_usd."
    factors:
      - id: recent_load_basis
        effect: method
        decides: billing_basis
        bindings: [bills_recent_sum, bills_recent_count, bills_half_sum, bills_half_count, demand_latest, demand_year_sum, billing_basis]
        ladder:
          - when: "the recent_months-month mean of regular bills exceeds the twelve-month mean times growth_ratio, and the latest billing demand exceeds the twelve-month average billing demand"
            method: "the billing basis is the mean of the regular bills of the recent_months months"
          - when: "the recent_months-month mean is below the twelve-month mean times decline_ratio, and the latest billing demand is below the twelve-month average billing demand"
            method: "the billing basis is the mean of the regular bills of the half_year_months months"
          - when: "otherwise"
            method: "the billing basis is the twelve-month mean"
        baseline:
          billing_basis: "mean_year"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: payment_record_multiple
        effect: parameter
        decides: record_multiple
        bindings: [late_record, waived_record, returned_record, counted_late_record, record_multiple]
        ladder:
          - when: "poor_record_late_count or more late payment charges counted on the secured agreement in the record_window_months months, or any payment reversal posted on it"
            value: "P('deposit_multiple_of_average_bill') + K('poor_record_load')"
          - when: "no late payment charge counted and no payment reversal posted on the secured agreement in those months"
            value: "P('deposit_multiple_of_average_bill') - K('clean_record_relief')"
          - when: "otherwise"
            value: "P('deposit_multiple_of_average_bill')"
        baseline:
          record_multiple: "P('deposit_multiple_of_average_bill')"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: service_length_cut
        effect: parameter
        decides: service_multiple_cut
        bindings: [service_months, service_multiple_cut]
        ladder:
          - when: "the secured agreement has been in service at least tenure_long_months whole months on the recalculation date"
            value: "K('tenure_multiple_cut_long')"
          - when: "it has been in service at least tenure_mid_months but fewer than tenure_long_months whole months"
            value: "K('tenure_multiple_cut_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          service_multiple_cut: "0"
        evidence: [date, cross_category]
        cross_difficulty: service
      - id: notice_multiple_load
        effect: parameter
        decides: notice_load
        bindings: [notices_record, notice_load]
        ladder:
          - when: "two or more disconnection notices issued on the secured agreement in the record_window_months months"
            value: "K('notice_load_many')"
          - when: "exactly one disconnection notice issued on it in those months"
            value: "K('notice_load_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          notice_load: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: growth_phase_in
        effect: parameter
        decides: phase_share
        bindings: [cash_in, cash_out, interest_in, held_amount_now, phase_share]
        ladder:
          - when: "the recent mean is the billing basis and the requirement before rounding exceeds the held amount by more than large_increase_ratio times the held amount"
            value: "K('phase_share_large')"
          - when: "the recent mean is the billing basis and the requirement before rounding exceeds the held amount by no more than large_increase_ratio times it"
            value: "K('phase_share_moderate')"
          - when: "otherwise"
            value: "1"
        baseline:
          phase_share: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The recalculated requirement is deposit_multiple_of_average_bill times the mean of the secured agreement's regular bills issued in the average_bill_lookback_months months ending on the recalculation date, the mean rounded to the cent, and the product rounded to the cent and then up to the next whole dollar, raised to minimum_deposit_usd and limited to maximum_deposit_usd; with fewer than average_bill_minimum_months such bills, default_average_bill_usd stands in for the mean.
      params: [deposit_multiple_of_average_bill, average_bill_lookback_months, average_bill_minimum_months, default_average_bill_usd, minimum_deposit_usd, maximum_deposit_usd]
    inputs:
