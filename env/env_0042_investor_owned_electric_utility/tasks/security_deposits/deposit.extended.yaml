  - id: deposit_ext_new_agreement_requirement
    base_policy_refs: [deposit_assessment_rule, deposit_agg_multi_holding]
    overwrite:
      - base_policy: deposit_assessment_rule
        superseded_clause: >-
          The required amount is deposit_multiple_of_average_bill times deposit_msr_average_bill, rounded up to the next whole dollar, then raised to minimum_deposit_usd and limited to maximum_deposit_usd.
        replaced_by: >-
          The required deposit of a new agreement is the estimate so adjusted times the multiple so lowered, rounded to the cent and then up to the next whole dollar, raised to minimum_deposit_usd and limited to maximum_deposit_usd.
      - base_policy: deposit_assessment_rule
        superseded_clause: >-
          The installment count is installment_count_max, or installment_count_max_income_qualified when the customer's income_qualified_until is on or after the assessment date, reduced until each installment reaches minimum_installment_usd.
        replaced_by: >-
          The number of installments of a deposit on a new agreement is not set at assessment; it is recorded with the deposit's opening installment.
      - base_policy: deposit_assessment_rule
        superseded_clause: >-
          A deposit triggered by disconnection must be assessed within the assessment window after the disconnection date.
        replaced_by: >-
          A disconnection, a late payment count or an unauthorized-use finding never triggers a deposit on a new agreement opened after it; the deposit it triggers is assessed on the agreement that carries it, within the assessment window after the disconnection date, after the posting date of the late payment charge that reached the trigger count, or after the date of the field investigation that confirmed the unauthorized use.
      - base_policy: deposit_assessment_rule
        superseded_clause: >-
          A deposit triggered by late payments must be assessed within the assessment window after the posting date of the late payment charge that reached the trigger count.
        replaced_by: >-
          A disconnection, a late payment count or an unauthorized-use finding never triggers a deposit on a new agreement opened after it; the deposit it triggers is assessed on the agreement that carries it, within the assessment window after the disconnection date, after the posting date of the late payment charge that reached the trigger count, or after the date of the field investigation that confirmed the unauthorized use.
      - base_policy: deposit_assessment_rule
        superseded_clause: >-
          A deposit triggered by unauthorized use must be assessed within the assessment window after the date of the field investigation that confirmed it.
        replaced_by: >-
          A disconnection, a late payment count or an unauthorized-use finding never triggers a deposit on a new agreement opened after it; the deposit it triggers is assessed on the agreement that carries it, within the assessment window after the disconnection date, after the posting date of the late payment charge that reached the trigger count, or after the date of the field investigation that confirmed the unauthorized use.
    trigger: state_due
    subject: [deposit_assessment]
    computes: required_amount
    target_tool: assess_new_service_deposit_5e8da269
    params:
      peer_bill_count: 12
      recent_months: 3
      half_year_months: 6
      peer_growth_ratio: 1.25
      peer_decline_ratio: 0.75
      electric_premise_factor: 1.3
      non_electric_premise_factor: 0.8
      record_window_months: 12
      clean_credit_relief: 0.5
      weak_credit_load: 0.5
      weak_credit_late_count: 2
      peer_long_months: 120
      peer_mid_months: 60
      peer_cut_long: 0.25
      peer_cut_mid: 0.1
      refund_relief_full: 0.5
      refund_relief_part: 0.25
      proven_hold_months: 24
    rule: >-
      A new agreement that is still pending start and was opened without a waiver basis is assessed a new-service deposit of the kind its customer class and rate schedule call for, within the assessment window after its start date, and the deposit required is worked out as follows.
      The deposit required on a new agreement is not fixed until every other deposit of the customer that stands assessed shows its first installment received.
      The deposit required on a new agreement is fixed only after any deposit of the customer whose satisfactory payment review has been passed on its refund review date stands refunded.
      The deposit required on a new agreement still pending start is deposit_multiple_of_average_bill times default_average_bill_usd, rounded to the cent and then up to the next whole dollar, raised to minimum_deposit_usd and limited to maximum_deposit_usd.
      A disconnection, a late payment count or an unauthorized-use finding never triggers a deposit on a new agreement opened after it; the deposit it triggers is assessed on the agreement that carries it, within the assessment window after the disconnection date, after the posting date of the late payment charge that reached the trigger count, or after the date of the field investigation that confirmed the unauthorized use.
      The estimate of a pending agreement's monthly bill is drawn from the customer's records: where the customer has another agreement in active status on the same rate schedule that carries, or carried, the customer's deposit of the same kind, with at least peer_bill_count regular bills in the average_bill_lookback_months months ending on the assessment date, the estimate is that sister agreement's billing basis; where its sister agreement on the same rate schedule has at least average_bill_minimum_months but fewer than peer_bill_count such bills, the estimate is the mean of those bills, rounded to the cent; otherwise the estimate is default_average_bill_usd.
      The sister agreement's billing basis follows its recent load: where the mean of its regular bills issued in the recent_months months ending on the assessment date exceeds its twelve-month mean times peer_growth_ratio and the kWh on its latest regular bill exceed its twelve-month average kWh, the basis is that recent mean; where the recent mean is below the twelve-month mean times peer_decline_ratio and the latest kWh are below that average, the basis is the mean of its regular bills issued in the half_year_months months ending on the assessment date; otherwise the basis is its twelve-month mean; each mean is rounded to the cent.
      A sister-agreement estimate is adjusted for the way the new premise is heated: where it is drawn from a sister agreement and the new premise heats with electricity while the sister premise does not, it is multiplied by electric_premise_factor; where it is drawn from a sister agreement and the new premise does not heat with electricity while the sister premise does, it is multiplied by non_electric_premise_factor; otherwise it is taken as it is.
      The estimate so adjusted is rounded to the cent and is the average monthly bill recorded on the deposit.
      The multiple for a new agreement follows the customer's payment record on all its agreements in the record_window_months months ending on the assessment date, late payment charges being counted after deducting one for each courtesy late-charge waiver credit: where no late payment charge is counted and no payment reversal was posted, the multiple is deposit_multiple_of_average_bill less clean_credit_relief; where weak_credit_late_count or more late payment charges are counted or any payment reversal was posted, it is deposit_multiple_of_average_bill plus weak_credit_load; otherwise it is deposit_multiple_of_average_bill.
      An established sister location lowers that multiple: where the estimate is drawn from a sister agreement that has been in service at least peer_long_months whole months on the assessment date, peer_cut_long comes off it; where from one in service at least peer_mid_months but fewer than peer_long_months whole months, peer_cut_mid comes off; otherwise nothing comes off.
      A deposit of the same kind recently returned for good payment lowers it as well: where the customer's deposit of that kind on the sister agreement was refunded in full in the record_window_months months ending on the assessment date, refund_relief_full comes off; where it is still held but has been fully secured for at least proven_hold_months whole months, refund_relief_part comes off; otherwise nothing comes off.
      The required deposit of a new agreement is the estimate so adjusted times the multiple so lowered, rounded to the cent and then up to the next whole dollar, raised to minimum_deposit_usd and limited to maximum_deposit_usd.
      The number of installments of a deposit on a new agreement is not set at assessment; it is recorded with the deposit's opening installment.
      Whole months between two dates are counted from the earlier date to the same day of a later month, a month whose day has not yet been reached on the later date not counting.
    prerequisite:
      - problem: deposit_ext_opening_installment
        kind: state_gate
        gate: deposit_transactions.installment_number
        form: state
        policy_source: >-
          The deposit required on a new agreement is not fixed until every other deposit of the customer that stands assessed shows its first installment received.
        condition: >-
          Every other deposit_accounts row of the customer in assessed status has a deposit_payment in deposit_transactions with installment_number 1.
        resolved_by: pay_deposit_installment_d7ce4a9b
        effect: >-
          Once the opening installment of the customer's other assessed deposit is received, the new agreement's deposit may be fixed.
      - problem: deposit_ext_review_refund
        kind: value_input
        gate: refund_relief
        form: state
        policy_source: >-
          The deposit required on a new agreement is fixed only after any deposit of the customer whose satisfactory payment review has been passed on its refund review date stands refunded.
        condition: >-
          The customer's deposit whose review passed on its refund review date shows status refunded with a full_refund deposit_refund row in deposit_transactions.
        resolved_by: refund_deposit_by_check_703d791f
        effect: >-
          The full refund of the customer's deposit of the same kind moves the good-payment relief from refund_relief_part to refund_relief_full, lowering the multiple and the required deposit.
    cross_category:
      - category: service
        as: history
        reads: [service_account_id, variant_name, status, start_date, space_heating, service_bills.amount, service_bills.kwh_total, service_bills.bill_date, service_charges.event_type, service_charges.posting_date, service_credits.credit_code, service_credits.payment_channel]
        note: The estimate source, the sister trend, the heating adjustment, the payment-record multiple, the established-location cut and the autopay cut are all decided from the customer's agreements, bills, charges and payments.
    compute:
      - new_agreement: "CFIELD('service', 'service_account_id', status='pending_start', variant_name=CFIELD('service', 'variant_name', service_account_id=F('service_account_id')))"
      - sister_account: "CFIELD('service', 'service_account_id', service_account_id=F('service_account_id'), variant_name=CFIELD('service', 'variant_name', service_account_id=new_agreement), status='active')"
      - sister_bill_count: "XCOUNT('service', 'service_bills', within_months=P('average_bill_lookback_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=sister_account)"
      - sister_sum_year: "XSUM('service', 'service_bills', 'amount', within_months=P('average_bill_lookback_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=sister_account)"
      - sister_sum_recent: "XSUM('service', 'service_bills', 'amount', within_months=K('recent_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=sister_account)"
      - sister_count_recent: "XCOUNT('service', 'service_bills', within_months=K('recent_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=sister_account)"
      - sister_sum_half: "XSUM('service', 'service_bills', 'amount', within_months=K('half_year_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=sister_account)"
      - sister_count_half: "XCOUNT('service', 'service_bills', within_months=K('half_year_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=sister_account)"
      - sister_kwh_latest: "XLATEST('service', 'service_bills', 'kwh_total', date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=sister_account)"
      - sister_kwh_year: "XSUM('service', 'service_bills', 'kwh_total', within_months=P('average_bill_lookback_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular', service_account_id=sister_account)"
      - sister_mean_year: "RND(sister_sum_year / sister_bill_count, 2) if sister_bill_count > 0 else 0"
      - sister_mean_recent: "RND(sister_sum_recent / sister_count_recent, 2) if sister_count_recent > 0 else sister_mean_year"
      - sister_mean_half: "RND(sister_sum_half / sister_count_half, 2) if sister_count_half > 0 else sister_mean_year"
      - sister_kwh_average: "sister_kwh_year / sister_bill_count if sister_bill_count > 0 else 0"
      - sister_basis: "sister_mean_recent if (sister_mean_recent > sister_mean_year * K('peer_growth_ratio') and sister_kwh_latest > sister_kwh_average) else (sister_mean_half if (sister_mean_recent < sister_mean_year * K('peer_decline_ratio') and sister_kwh_latest < sister_kwh_average) else sister_mean_year)"
      - estimate: "sister_basis if sister_bill_count >= K('peer_bill_count') else (sister_mean_year if (sister_bill_count >= P('average_bill_minimum_months') and sister_bill_count < K('peer_bill_count')) else P('default_average_bill_usd'))"
      - new_premise_heating: "CFIELD('service', 'space_heating', service_account_id=new_agreement)"
      - sister_premise_heating: "CFIELD('service', 'space_heating', service_account_id=sister_account)"
      - heating_factor: "K('electric_premise_factor') if ((estimate == sister_basis or estimate == sister_mean_year) and new_premise_heating == 'electric' and sister_premise_heating == 'non_electric') else (K('non_electric_premise_factor') if ((estimate == sister_basis or estimate == sister_mean_year) and new_premise_heating == 'non_electric' and sister_premise_heating == 'electric') else 1)"
      - adjusted_estimate: "RND(estimate * heating_factor, 2)"
      - late_customer: "XCOUNT('service', 'service_charges', within_months=K('record_window_months'), date_field='posting_date', event_type='service_late_payment_charge')"
      - waived_customer: "XCOUNT('service', 'service_credits', within_months=K('record_window_months'), date_field='posting_date', event_type='service_billing_credit', credit_code='late_charge_waiver')"
      - reversals_customer: "XCOUNT('service', 'service_charges', within_months=K('record_window_months'), date_field='posting_date', event_type='service_payment_reversal')"
      - counted_late_customer: "late_customer - waived_customer"
      - credit_multiple: "P('deposit_multiple_of_average_bill') - K('clean_credit_relief') if (counted_late_customer == 0 and reversals_customer == 0) else (P('deposit_multiple_of_average_bill') + K('weak_credit_load') if (counted_late_customer >= K('weak_credit_late_count') or reversals_customer > 0) else P('deposit_multiple_of_average_bill'))"
      - sister_start: "CFIELD('service', 'start_date', service_account_id=sister_account)"
      - sister_months: "MONTHS(sister_start, NOW) if sister_start != None else 0"
      - established_cut: "K('peer_cut_long') if ((estimate == sister_basis or estimate == sister_mean_year) and sister_months >= K('peer_long_months')) else (K('peer_cut_mid') if ((estimate == sister_basis or estimate == sister_mean_year) and sister_months >= K('peer_mid_months') and sister_months < K('peer_long_months')) else 0)"
      - full_refunds_recent: "COUNT('deposit_transactions', within_months=K('record_window_months'), date_field='transaction_date', event_type='deposit_refund', refund_kind='full_refund')"
      - months_kind_secured: "MONTHS(F('fully_secured_date'), NOW) if F('fully_secured_date') else 0"
      - refund_relief: "K('refund_relief_full') if full_refunds_recent > 0 else (K('refund_relief_part') if (F('status') == 'held' and months_kind_secured >= K('proven_hold_months')) else 0)"
      - required_raw: "adjusted_estimate * (credit_multiple - established_cut - refund_relief)"
      - result: "MN(P('maximum_deposit_usd'), MX(P('minimum_deposit_usd'), -(-RND(required_raw, 2) // 1)))"
    compute_basis:
      new_agreement: "A new agreement that is still pending start and was opened without a waiver basis is assessed a new-service deposit"
      sister_account: "another agreement in active status on the same rate schedule that carries, or carried, the customer's deposit of the same kind"
      sister_bill_count: "with at least peer_bill_count regular bills in the average_bill_lookback_months months ending on the assessment date"
      sister_sum_year: "its twelve-month mean"
      sister_sum_recent: "the mean of its regular bills issued in the recent_months months ending on the assessment date"
      sister_count_recent: "the mean of its regular bills issued in the recent_months months ending on the assessment date"
      sister_sum_half: "the basis is the mean of its regular bills issued in the half_year_months months ending on the assessment date"
      sister_count_half: "the mean of its regular bills issued in the half_year_months months ending on the assessment date"
      sister_kwh_latest: "the kWh on its latest regular bill exceed its twelve-month average kWh"
      sister_kwh_year: "its twelve-month average kWh"
      sister_mean_year: "each mean is rounded to the cent."
      sister_mean_recent: "each mean is rounded to the cent."
      sister_mean_half: "each mean is rounded to the cent."
      sister_kwh_average: "its twelve-month average kWh"
      sister_basis: "The sister agreement's billing basis follows its recent load: where the mean of its regular bills issued in the recent_months months ending on the assessment date exceeds its twelve-month mean times peer_growth_ratio and the kWh on its latest regular bill exceed its twelve-month average kWh, the basis is that recent mean; where the recent mean is below the twelve-month mean times peer_decline_ratio and the latest kWh are below that average, the basis is the mean of its regular bills issued in the half_year_months months ending on the assessment date; otherwise the basis is its twelve-month mean; each mean is rounded to the cent."
      estimate: "The estimate of a pending agreement's monthly bill is drawn from the customer's records: where the customer has another agreement in active status on the same rate schedule that carries, or carried, the customer's deposit of the same kind, with at least peer_bill_count regular bills in the average_bill_lookback_months months ending on the assessment date, the estimate is that sister agreement's billing basis; where its sister agreement on the same rate schedule has at least average_bill_minimum_months but fewer than peer_bill_count such bills, the estimate is the mean of those bills, rounded to the cent; otherwise the estimate is default_average_bill_usd."
      new_premise_heating: "where it is drawn from a sister agreement and the new premise heats with electricity while the sister premise does not"
      sister_premise_heating: "while the sister premise does not"
      heating_factor: "A sister-agreement estimate is adjusted for the way the new premise is heated: where it is drawn from a sister agreement and the new premise heats with electricity while the sister premise does not, it is multiplied by electric_premise_factor; where it is drawn from a sister agreement and the new premise does not heat with electricity while the sister premise does, it is multiplied by non_electric_premise_factor; otherwise it is taken as it is."
      adjusted_estimate: "The estimate so adjusted is rounded to the cent and is the average monthly bill recorded on the deposit."
      late_customer: "The multiple for a new agreement follows the customer's payment record on all its agreements in the record_window_months months ending on the assessment date, late payment charges being counted after deducting one for each courtesy late-charge waiver credit"
      waived_customer: "late payment charges being counted after deducting one for each courtesy late-charge waiver credit"
      reversals_customer: "no payment reversal was posted"
      counted_late_customer: "late payment charges being counted after deducting one for each courtesy late-charge waiver credit"
      credit_multiple: "where no late payment charge is counted and no payment reversal was posted, the multiple is deposit_multiple_of_average_bill less clean_credit_relief; where weak_credit_late_count or more late payment charges are counted or any payment reversal was posted, it is deposit_multiple_of_average_bill plus weak_credit_load; otherwise it is deposit_multiple_of_average_bill."
      sister_start: "a sister agreement that has been in service at least peer_long_months whole months on the assessment date"
      sister_months: "Whole months between two dates are counted from the earlier date to the same day of a later month, a month whose day has not yet been reached on the later date not counting."
      established_cut: "An established sister location lowers that multiple: where the estimate is drawn from a sister agreement that has been in service at least peer_long_months whole months on the assessment date, peer_cut_long comes off it; where from one in service at least peer_mid_months but fewer than peer_long_months whole months, peer_cut_mid comes off; otherwise nothing comes off."
      full_refunds_recent: "where the customer's deposit of that kind on the sister agreement was refunded in full in the record_window_months months ending on the assessment date"
      months_kind_secured: "where it is still held but has been fully secured for at least proven_hold_months whole months"
      refund_relief: "A deposit of the same kind recently returned for good payment lowers it as well: where the customer's deposit of that kind on the sister agreement was refunded in full in the record_window_months months ending on the assessment date, refund_relief_full comes off; where it is still held but has been fully secured for at least proven_hold_months whole months, refund_relief_part comes off; otherwise nothing comes off."
      required_raw: "The required deposit of a new agreement is the estimate so adjusted times the multiple so lowered"
      result: "The required deposit of a new agreement is the estimate so adjusted times the multiple so lowered, rounded to the cent and then up to the next whole dollar, raised to minimum_deposit_usd and limited to maximum_deposit_usd."
    factors:
      - id: short_history_estimate
        effect: method
        decides: estimate
        bindings: [new_agreement, sister_account, sister_bill_count, estimate]
        ladder:
          - when: "the customer has another active agreement on the new agreement's rate schedule, carrying or having carried its deposit of the same kind, with at least peer_bill_count regular bills in the window"
            method: "the estimate is that sister agreement's billing basis"
          - when: "the sister agreement on that rate schedule has at least average_bill_minimum_months but fewer than peer_bill_count regular bills in the window"
            method: "the estimate is the mean of the sister agreement's regular bills in the window"
          - when: "otherwise"
            method: "the estimate is default_average_bill_usd"
        baseline:
          estimate: "P('default_average_bill_usd')"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: sister_load_trend
        effect: method
        decides: sister_basis
        bindings: [sister_sum_recent, sister_count_recent, sister_sum_half, sister_count_half, sister_kwh_latest, sister_kwh_year, sister_basis]
        ladder:
          - when: "the sister agreement's recent_months-month mean exceeds its twelve-month mean times peer_growth_ratio, and its latest kWh exceed its twelve-month average kWh"
            method: "the sister basis is the mean of its regular bills of the recent_months months"
          - when: "its recent_months-month mean is below its twelve-month mean times peer_decline_ratio, and its latest kWh are below its twelve-month average kWh"
            method: "the sister basis is the mean of its regular bills of the half_year_months months"
          - when: "otherwise"
            method: "the sister basis is its twelve-month mean"
        baseline:
          sister_basis: "sister_mean_year"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: premise_heating_adjustment
        effect: parameter
        decides: heating_factor
        bindings: [new_premise_heating, sister_premise_heating, heating_factor]
        ladder:
          - when: "the estimate is drawn from a sister agreement, and the new premise heats with electricity while the sister premise does not"
            value: "K('electric_premise_factor')"
          - when: "the estimate is drawn from a sister agreement, and the new premise does not heat with electricity while the sister premise does"
            value: "K('non_electric_premise_factor')"
          - when: "otherwise"
            value: "1"
        baseline:
          heating_factor: "1"
        evidence: [cross_category]
        cross_difficulty: service
      - id: customer_record_multiple
        effect: parameter
        decides: credit_multiple
        bindings: [late_customer, waived_customer, reversals_customer, counted_late_customer, credit_multiple]
        ladder:
          - when: "no late payment charge counted and no payment reversal posted on any of the customer's agreements in the record_window_months months"
            value: "P('deposit_multiple_of_average_bill') - K('clean_credit_relief')"
          - when: "weak_credit_late_count or more late payment charges counted, or any payment reversal posted, on the customer's agreements in those months"
            value: "P('deposit_multiple_of_average_bill') + K('weak_credit_load')"
          - when: "otherwise"
            value: "P('deposit_multiple_of_average_bill')"
        baseline:
          credit_multiple: "P('deposit_multiple_of_average_bill')"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: established_sister_cut
        effect: parameter
        decides: established_cut
        bindings: [sister_start, sister_months, established_cut]
        ladder:
          - when: "the estimate is drawn from a sister agreement in service at least peer_long_months whole months"
            value: "K('peer_cut_long')"
          - when: "the estimate is drawn from a sister agreement in service at least peer_mid_months but fewer than peer_long_months whole months"
            value: "K('peer_cut_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          established_cut: "0"
        evidence: [date, cross_category]
        cross_difficulty: service
      - id: good_payment_refund_relief
        effect: parameter
        decides: refund_relief
        bindings: [full_refunds_recent, months_kind_secured, refund_relief]
        ladder:
          - when: "the customer's deposit of the same kind on the sister agreement was refunded in full in the record_window_months months"
            value: "K('refund_relief_full')"
          - when: "that deposit is still held and has been fully secured at least proven_hold_months whole months"
            value: "K('refund_relief_part')"
          - when: "otherwise"
            value: "0"
        baseline:
          refund_relief: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The deposit required on a new agreement still pending start is deposit_multiple_of_average_bill times default_average_bill_usd, rounded to the cent and then up to the next whole dollar, raised to minimum_deposit_usd and limited to maximum_deposit_usd.
      params: [deposit_multiple_of_average_bill, average_bill_lookback_months, average_bill_minimum_months, default_average_bill_usd, minimum_deposit_usd, maximum_deposit_usd]
    inputs:
      history:
        - {category: service, table: service_bills, aggregate: count, field: bill_id, within_months: 12, filters: {bill_kind: regular}}
        - {category: service, table: service_bills, aggregate: sum, field: amount, within_months: 3, filters: {bill_kind: regular}}
        - {category: service, table: service_bills, aggregate: latest, field: kwh_total, within_months: 0, filters: {bill_kind: regular}}
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 12, filters: {event_type: service_late_payment_charge}}
        - {table: deposit_transactions, aggregate: count, field: deposit_transaction_id, within_months: 12, filters: {event_type: deposit_refund, refund_kind: full_refund}}
      cross_category: [service]
  - id: deposit_ext_opening_installment
    base_policy_refs: [deposit_installments_and_security, deposit_assessment_rule]
    overwrite:
      - base_policy: deposit_installments_and_security
        superseded_clause: >-
          The regular installment is the required amount divided by the installment count, rounded down to the cent, and the last installment carries the remainder.
        replaced_by: >-
          The opening installment follows the agreement's stage: where the agreement is still pending start and the deposit is spread over more than one installment, the opening installment is the average monthly bill recorded on the deposit plus an equal share, over the number of installments, of the required amount less that bill, rounded down to the cent; where the agreement has started but has no regular bill yet and the deposit is spread over more than one installment, it is one half of the required amount, rounded down to the cent; otherwise it is the required amount divided by the number of installments, rounded down to the cent.
      - base_policy: deposit_installments_and_security
        superseded_clause: >-
          Each installment number is recorded once.
        replaced_by: >-
          The installments of a deposit on a new agreement are numbered from 1 for the opening installment, each number recorded once on the deposit.
      - base_policy: deposit_assessment_rule
        superseded_clause: >-
          The installment count is installment_count_max, or installment_count_max_income_qualified when the customer's income_qualified_until is on or after the assessment date, reduced until each installment reaches minimum_installment_usd.
        replaced_by: >-
          The number of installments is the plan size, less the installments the notices take off and plus the site installments, never fewer than one, and then reduced until each installment reaches minimum_installment_usd; it is recorded with the opening installment.
      - base_policy: deposit_assessment_rule
        superseded_clause: >-
          The first installment is due first_installment_due_days after assessment and later installments under installment_schedule.
        replaced_by: >-
          The first installment is due first_installment_due_days after assessment, and each later installment of a deposit on a new agreement is due 30 calendar days after the previous one, whatever the installment_schedule of its kind.
    trigger: on_request
    subject: [deposit_payment]
    computes: amount
    target_tool: pay_deposit_installment_d7ce4a9b
    params:
      large_deposit_minimums: 4
      small_deposit_minimums: 2
      large_plan_factor: 3
      medium_plan_extra: 1
      reversal_window_months: 24
      record_window_months: 12
      notice_cut_one: 1
      notice_cut_many: 2
      sites_window_months: 1
      sites_extra_two: 1
      sites_extra_three: 2
    rule: >-
      A deposit assessed on a new agreement is paid by the customer directly to the deposit, and its opening installment is worked out as follows.
      The installments of a deposit on a new agreement are numbered from 1 for the opening installment, each number recorded once on the deposit.
      A deposit on a new agreement is paid in installment_count_max installments, reduced until each installment reaches minimum_installment_usd, the opening installment being the required amount divided by that count and rounded down to the cent, the last installment carrying the remainder.
      The plan size follows the deposit's size and the customer's reversals: where the required amount is at least large_deposit_minimums times minimum_deposit_usd and no payment reversal was posted on any of the customer's agreements in the reversal_window_months months ending on the payment date, the plan size is large_plan_factor times installment_count_max; where the required amount is at least small_deposit_minimums times minimum_deposit_usd but less than large_deposit_minimums times it, with no such payment reversal, it is installment_count_max plus medium_plan_extra; otherwise it is installment_count_max.
      Disconnection notices shorten the plan: two or more notices issued on any of the customer's agreements in the record_window_months months ending on the payment date take notice_cut_many installments off, exactly one takes notice_cut_one off, and none takes nothing off.
      An established multi-site customer gets longer: where three or more regular bills were issued on the customer's agreements in the sites_window_months month ending on the payment date, sites_extra_three installments are added; where exactly two were, sites_extra_two is added; otherwise none is added.
      The number of installments is the plan size, less the installments the notices take off and plus the site installments, never fewer than one, and then reduced until each installment reaches minimum_installment_usd; it is recorded with the opening installment.
      The opening installment follows the agreement's stage: where the agreement is still pending start and the deposit is spread over more than one installment, the opening installment is the average monthly bill recorded on the deposit plus an equal share, over the number of installments, of the required amount less that bill, rounded down to the cent; where the agreement has started but has no regular bill yet and the deposit is spread over more than one installment, it is one half of the required amount, rounded down to the cent; otherwise it is the required amount divided by the number of installments, rounded down to the cent.
      After the opening installment, the rest of the required amount is paid in equal installments over the remaining number, each rounded down to the cent, the last installment carrying the remainder, each later installment due 30 calendar days after the previous one.
      The first installment is due first_installment_due_days after assessment, and each later installment of a deposit on a new agreement is due 30 calendar days after the previous one, whatever the installment_schedule of its kind.
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [status, service_bills.bill_date, service_bills.bill_kind, service_charges.event_type, service_charges.posting_date, service_notices.notice_date]
        note: The plan-size, notice, multi-site and stage tiers are decided from the customer's payment reversals, disconnection notices and bills and from the agreement's status.
    compute:
      - required: "F('required_amount')"
      - recorded_bill: "F('average_monthly_bill')"
      - reversals_customer: "XCOUNT('service', 'service_charges', within_months=K('reversal_window_months'), date_field='posting_date', event_type='service_payment_reversal')"
      - plan_size: "P('installment_count_max') * K('large_plan_factor') if (required >= P('minimum_deposit_usd') * K('large_deposit_minimums') and reversals_customer == 0) else (P('installment_count_max') + K('medium_plan_extra') if (required >= P('minimum_deposit_usd') * K('small_deposit_minimums') and required < P('minimum_deposit_usd') * K('large_deposit_minimums') and reversals_customer == 0) else P('installment_count_max'))"
      - notices_customer: "XCOUNT('service', 'service_notices', within_months=K('record_window_months'), date_field='notice_date', event_type='service_disconnect_notice')"
      - notice_cut: "K('notice_cut_many') if notices_customer >= 2 else (K('notice_cut_one') if notices_customer == 1 else 0)"
      - other_sites_billed: "XCOUNT('service', 'service_bills', within_months=K('sites_window_months'), date_field='bill_date', event_type='service_bill_issued', bill_kind='regular')"
      - sites_extra: "K('sites_extra_three') if other_sites_billed >= 3 else (K('sites_extra_two') if other_sites_billed == 2 else 0)"
      - installments: "MN(MX(1, plan_size - notice_cut + sites_extra), int(required // P('minimum_installment_usd')))"
      - agreement_status: "CFIELD('service', 'status', service_account_id=F('service_account_id'))"
      - own_regular_bills: "XCOUNT('service', 'service_bills', event_type='service_bill_issued', bill_kind='regular', service_account_id=F('service_account_id'))"
      - opening_installment: "int(RND((recorded_bill + (required - recorded_bill) / installments) * 100, 4)) / 100 if (agreement_status == 'pending_start' and installments > 1) else (int(RND(required / 2 * 100, 4)) / 100 if (agreement_status != 'pending_start' and own_regular_bills == 0 and installments > 1) else int(RND(required / installments * 100, 4)) / 100)"
      - result: "RND(opening_installment, 2)"
    compute_basis:
      required: "the opening installment being the required amount divided by that count and rounded down to the cent"
      recorded_bill: "the opening installment is the average monthly bill recorded on the deposit plus an equal share, over the number of installments, of the required amount less that bill, rounded down to the cent"
      reversals_customer: "no payment reversal was posted on any of the customer's agreements in the reversal_window_months months ending on the payment date"
      plan_size: "The plan size follows the deposit's size and the customer's reversals: where the required amount is at least large_deposit_minimums times minimum_deposit_usd and no payment reversal was posted on any of the customer's agreements in the reversal_window_months months ending on the payment date, the plan size is large_plan_factor times installment_count_max; where the required amount is at least small_deposit_minimums times minimum_deposit_usd but less than large_deposit_minimums times it, with no such payment reversal, it is installment_count_max plus medium_plan_extra; otherwise it is installment_count_max."
      notices_customer: "two or more notices issued on any of the customer's agreements in the record_window_months months ending on the payment date"
      notice_cut: "Disconnection notices shorten the plan: two or more notices issued on any of the customer's agreements in the record_window_months months ending on the payment date take notice_cut_many installments off, exactly one takes notice_cut_one off, and none takes nothing off."
      other_sites_billed: "where three or more regular bills were issued on the customer's agreements in the sites_window_months month ending on the payment date"
      sites_extra: "An established multi-site customer gets longer: where three or more regular bills were issued on the customer's agreements in the sites_window_months month ending on the payment date, sites_extra_three installments are added; where exactly two were, sites_extra_two is added; otherwise none is added."
      installments: "The number of installments is the plan size, less the installments the notices take off and plus the site installments, never fewer than one, and then reduced until each installment reaches minimum_installment_usd; it is recorded with the opening installment."
      agreement_status: "where the agreement is still pending start and the deposit is spread over more than one installment"
      own_regular_bills: "where the agreement has started but has no regular bill yet"
      opening_installment: "The opening installment follows the agreement's stage: where the agreement is still pending start and the deposit is spread over more than one installment, the opening installment is the average monthly bill recorded on the deposit plus an equal share, over the number of installments, of the required amount less that bill, rounded down to the cent; where the agreement has started but has no regular bill yet and the deposit is spread over more than one installment, it is one half of the required amount, rounded down to the cent; otherwise it is the required amount divided by the number of installments, rounded down to the cent."
      result: "rounded down to the cent"
    factors:
      - id: deposit_size_plan
        effect: parameter
        decides: plan_size
        bindings: [reversals_customer, plan_size]
        ladder:
          - when: "the required amount is at least large_deposit_minimums times minimum_deposit_usd, and no payment reversal on any of the customer's agreements in the reversal_window_months months"
            value: "P('installment_count_max') * K('large_plan_factor')"
          - when: "the required amount is at least small_deposit_minimums but less than large_deposit_minimums times minimum_deposit_usd, and no payment reversal on the customer's agreements in those months"
            value: "P('installment_count_max') + K('medium_plan_extra')"
          - when: "otherwise"
            value: "P('installment_count_max')"
        baseline:
          plan_size: "P('installment_count_max')"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: notice_plan_cut
        effect: parameter
        decides: notice_cut
        bindings: [notices_customer, notice_cut]
        ladder:
          - when: "two or more disconnection notices on any of the customer's agreements in the record_window_months months"
            value: "K('notice_cut_many')"
          - when: "exactly one disconnection notice on the customer's agreements in those months"
            value: "K('notice_cut_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          notice_cut: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: multi_site_extra
        effect: parameter
        decides: sites_extra
        bindings: [other_sites_billed, sites_extra]
        ladder:
          - when: "three or more regular bills issued on the customer's agreements in the sites_window_months month"
            value: "K('sites_extra_three')"
          - when: "exactly two regular bills issued on the customer's agreements in that month"
            value: "K('sites_extra_two')"
          - when: "otherwise"
            value: "0"
        baseline:
          sites_extra: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: stage_opening_method
        effect: method
        decides: opening_installment
        bindings: [agreement_status, own_regular_bills, opening_installment]
        ladder:
          - when: "the agreement is still pending start and the deposit is spread over more than one installment"
            method: "the opening installment is the recorded average monthly bill plus an equal share, over the number of installments, of the required amount less that bill, rounded down to the cent"
          - when: "the agreement has started, has no regular bill yet, and the deposit is spread over more than one installment"
            method: "the opening installment is one half of the required amount, rounded down to the cent"
          - when: "otherwise"
            method: "the opening installment is the required amount divided by the number of installments, rounded down to the cent"
        baseline:
          opening_installment: "int(RND(required / installments * 100, 4)) / 100"
        evidence: [cross_category, history]
        cross_difficulty: service
    baseline:
      rule: >-
        A deposit on a new agreement is paid in installment_count_max installments, reduced until each installment reaches minimum_installment_usd, the opening installment being the required amount divided by that count and rounded down to the cent, the last installment carrying the remainder.
      params: [installment_count_max, minimum_installment_usd]
    inputs:
      history:
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 24, filters: {event_type: service_payment_reversal}}
        - {category: service, table: service_notices, aggregate: count, field: notice_id, within_months: 12, filters: {event_type: service_disconnect_notice}}
        - {category: service, table: service_bills, aggregate: count, field: bill_id, within_months: 1, filters: {bill_kind: regular}}
      cross_category: [service]
  - id: deposit_ext_review_refund
    base_policy_refs: [deposit_refund_review, deposit_agg_customer_history, deposit_waiver_rule, deposit_recalculation, deposit_interest_rule]
    overwrite:
      - base_policy: deposit_refund_review
        superseded_clause: >-
          A passed review refunds the cash received plus interest through the refund date, by refund_method_default (a credit to the service agreement), or by check when check_refund_on_request is true and the customer asks for a check.
        replaced_by: >-
          A held deposit whose satisfactory payment review is passed is refunded in full on or after its refund review date, by check where check_refund_on_request is true and the customer asks for a check, and the refund pays the cash held, the interest already credited and the interest for the closing period worked out as follows.
      - base_policy: deposit_interest_rule
        superseded_clause: >-
          Cash deposits earn simple interest at interest_rate_annual from the fully secured date; instruments earn nothing.
        replaced_by: >-
          For the interest paid within a refund, the Commission's deposit interest rates are rate_2024 for calendar 2024, rate_2025 for calendar 2025 and interest_rate_annual for calendar 2026 onward
      - base_policy: deposit_interest_rule
        superseded_clause: >-
          Interest is never compounded: it is computed on the cash received, excluding earlier interest.
        replaced_by: >-
          Interest within a refund is earned on the cash received less the excess refunds paid where an excess refund has been paid out of the deposit and no deposit payment was received in the closing period; on the cash held when the closing period began plus one half of the payments received in it where a deposit payment was received in the closing period; and otherwise on the cash received.
      - base_policy: deposit_interest_rule
        superseded_clause: >-
          Interest for a full year is credited on each anniversary of the fully secured date, and for a part year it is credited pro rata by days held over 365 on the refund or application date, rounded to the cent.
        replaced_by: >-
          The interest paid within the refund is the interest base of the closing period times its period rate times the months it earned over full_year_months, rounded to the cent, and the refund is the cash held plus the interest credited plus that interest, rounded to the cent.
    trigger: state_due
    subject: [deposit_refund_completion, deposit_refund]
    computes: refund_amount
    target_tool: refund_deposit_by_check_703d791f
    params:
      rate_2024: 0.0385
      rate_2025: 0.0402
      days_in_year: 365
      full_year_months: 12
      lapse_light_months: 9
      lapse_heavy_months: 6
      lapse_heavy_count: 3
      interest_year_months: 12
    rule: >-
      A held deposit whose satisfactory payment review is passed is refunded in full on or after its refund review date, by check where check_refund_on_request is true and the customer asks for a check, and the refund pays the cash held, the interest already credited and the interest for the closing period worked out as follows.
      A passed review refunds the cash received less the cash already refunded, plus the interest credited on the deposit, plus interest on the cash received for the period since the latest interest credit at the Commission's deposit interest rate for the calendar year of the refund date, by days over days_in_year, rounded to the cent.
      The closing period of a refund runs from the period end of the latest interest credit on the deposit, or from the fully secured date when none has been credited, to the refund date, and its lapses are those of the interest_year_months months ending on the refund date.
      For the interest paid within a refund, the Commission's deposit interest rates are rate_2024 for calendar 2024, rate_2025 for calendar 2025 and interest_rate_annual for calendar 2026 onward.
      The closing period's opening rate is rate_2025 when the period began in 2025, rate_2024 when it began in 2024, and interest_rate_annual otherwise, and its closing rate is the rate of the calendar year of the refund date.
      Where the deposit has been held at least interest_min_holding_months whole months on the refund date, and the closing period began in an earlier calendar year than the refund date with an opening rate that differs from its closing rate, its days up to and including 31 December of that earlier year earn the opening rate and its days from 1 January of the refund date's year on earn the closing rate, each as days over days_in_year; where the deposit has been held fewer than interest_min_holding_months whole months on the refund date, the closing period earns no interest; otherwise the days of the closing period earn the closing rate as days over days_in_year.
      The days of the closing period are counted from its start date to the refund date, the start date not counted.
      Interest within a refund is earned on the cash received less the excess refunds paid where an excess refund has been paid out of the deposit and no deposit payment was received in the closing period; on the cash held when the closing period began plus one half of the payments received in it where a deposit payment was received in the closing period; and otherwise on the cash received.
      The closing period earns interest only for months of satisfactory payment on the secured agreement, late payment charges being counted after deducting one for each courtesy late-charge waiver credit: where in its lapse months a reconnection charge was posted on any of the customer's agreements, a payment reversal was posted on the secured agreement, or lapse_heavy_count or more late payment charges are counted, it earns lapse_heavy_months months; where one or more but fewer than lapse_heavy_count late payment charges are counted, with no payment reversal and no reconnection charge, it earns lapse_light_months months; otherwise it earns full_year_months months.
      The interest paid within the refund is the interest base of the closing period times its period rate times the months it earned over full_year_months, rounded to the cent, and the refund is the cash held plus the interest credited plus that interest, rounded to the cent.
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [service_charges.event_type, service_charges.posting_date, service_credits.credit_code, service_credits.posting_date]
        note: The months the closing period earns are decided from the secured agreement's late payment charges, courtesy waivers and payment reversals and the customer's reconnection charges.
    compute:
      - refund_cash_in: "SUM('deposit_transactions', 'amount', event_type='deposit_payment')"
      - refund_cash_out: "SUM('deposit_transactions', 'amount', event_type='deposit_refund')"
      - refund_interest_on_file: "SUM('deposit_transactions', 'amount', event_type='deposit_interest_credit')"
      - refund_credits_on_file: "COUNT('deposit_transactions', event_type='deposit_interest_credit')"
      - refund_latest_credit_end: "LATEST('deposit_transactions', 'interest_period_end', date_field='transaction_date', event_type='deposit_interest_credit')"
      - closing_period_start: "refund_latest_credit_end if refund_credits_on_file > 0 else F('fully_secured_date')"
      - refund_year_rate: "K('rate_2024') if NOW < '2025-01-01' else (K('rate_2025') if NOW < '2026-01-01' else P('interest_rate_annual'))"
      - closing_opening_rate: "K('rate_2025') if (closing_period_start >= '2025-01-01' and closing_period_start < '2026-01-01') else (K('rate_2024') if (closing_period_start >= '2024-01-01' and closing_period_start < '2025-01-01') else P('interest_rate_annual'))"
      - refund_year_start: "'2026-01-01' if NOW >= '2026-01-01' else ('2025-01-01' if NOW >= '2025-01-01' else '2024-01-01')"
      - closing_days: "DAYS(closing_period_start, NOW)"
      - closing_days_before_new_year: "MX(0, DAYS(closing_period_start, refund_year_start) - 1)"
      - deposit_held_months: "MONTHS(F('fully_secured_date'), NOW)"
      - closing_period_rate: "(closing_days_before_new_year * closing_opening_rate + (closing_days - closing_days_before_new_year) * refund_year_rate) / K('days_in_year') if (deposit_held_months >= P('interest_min_holding_months') and closing_days_before_new_year > 0 and closing_opening_rate != refund_year_rate) else (0 if deposit_held_months < P('interest_min_holding_months') else refund_year_rate * closing_days / K('days_in_year'))"
      - refund_excess_paid: "SUM('deposit_transactions', 'amount', event_type='deposit_refund', refund_kind='excess_refund')"
      - refund_paid_in_period: "SUM('deposit_transactions', 'amount', within_months=K('interest_year_months'), date_field='transaction_date', event_type='deposit_payment')"
      - closing_interest_base: "refund_cash_in - refund_excess_paid if (refund_excess_paid > 0 and refund_paid_in_period == 0) else (refund_cash_in - refund_excess_paid - refund_paid_in_period / 2 if refund_paid_in_period > 0 else refund_cash_in)"
      - refund_late_count: "XCOUNT('service', 'service_charges', within_months=K('interest_year_months'), date_field='posting_date', event_type='service_late_payment_charge', service_account_id=F('service_account_id'))"
      - refund_waiver_count: "XCOUNT('service', 'service_credits', within_months=K('interest_year_months'), date_field='posting_date', event_type='service_billing_credit', credit_code='late_charge_waiver', service_account_id=F('service_account_id'))"
      - refund_reversal_count: "XCOUNT('service', 'service_charges', within_months=K('interest_year_months'), date_field='posting_date', event_type='service_payment_reversal', service_account_id=F('service_account_id'))"
      - refund_reconnection_count: "XCOUNT('service', 'service_charges', within_months=K('interest_year_months'), date_field='posting_date', event_type='service_reconnection_charge')"
      - refund_counted_lapses: "refund_late_count - refund_waiver_count"
      - closing_months_earned: "K('lapse_heavy_months') if (refund_reconnection_count > 0 or refund_reversal_count > 0 or refund_counted_lapses >= K('lapse_heavy_count')) else (K('lapse_light_months') if (refund_counted_lapses >= 1 and refund_counted_lapses < K('lapse_heavy_count') and refund_reversal_count == 0 and refund_reconnection_count == 0) else K('full_year_months'))"
      - closing_interest: "RND(closing_interest_base * closing_period_rate * closing_months_earned / K('full_year_months'), 2)"
      - result: "RND(refund_cash_in - refund_cash_out + refund_interest_on_file + closing_interest, 2)"
    compute_basis:
      refund_cash_in: "A passed review refunds the cash received less the cash already refunded"
      refund_cash_out: "the cash received less the cash already refunded"
      refund_interest_on_file: "plus the interest credited on the deposit"
      refund_credits_on_file: "The closing period of a refund runs from the period end of the latest interest credit on the deposit, or from the fully secured date when none has been credited, to the refund date"
      refund_latest_credit_end: "The closing period of a refund runs from the period end of the latest interest credit on the deposit"
      closing_period_start: "The closing period of a refund runs from the period end of the latest interest credit on the deposit, or from the fully secured date when none has been credited, to the refund date, and its lapses are those of the interest_year_months months ending on the refund date."
      closing_opening_rate: "The closing period's opening rate is rate_2025 when the period began in 2025, rate_2024 when it began in 2024, and interest_rate_annual otherwise"
      refund_year_rate: "and its closing rate is the rate of the calendar year of the refund date."
      refund_year_start: "its days from 1 January of the refund date's year on earn the closing rate"
      closing_days: "The days of the closing period are counted from its start date to the refund date, the start date not counted."
      closing_days_before_new_year: "its days up to and including 31 December of that earlier year earn the opening rate and its days from 1 January of the refund date's year on earn the closing rate, each as days over days_in_year"
      deposit_held_months: "where the deposit has been held fewer than interest_min_holding_months whole months on the refund date, the closing period earns no interest"
      closing_period_rate: "Where the deposit has been held at least interest_min_holding_months whole months on the refund date, and the closing period began in an earlier calendar year than the refund date with an opening rate that differs from its closing rate, its days up to and including 31 December of that earlier year earn the opening rate and its days from 1 January of the refund date's year on earn the closing rate, each as days over days_in_year; where the deposit has been held fewer than interest_min_holding_months whole months on the refund date, the closing period earns no interest; otherwise the days of the closing period earn the closing rate as days over days_in_year."
      refund_excess_paid: "Interest within a refund is earned on the cash received less the excess refunds paid"
      refund_paid_in_period: "where a deposit payment was received in the closing period"
      closing_interest_base: "Interest within a refund is earned on the cash received less the excess refunds paid where an excess refund has been paid out of the deposit and no deposit payment was received in the closing period; on the cash held when the closing period began plus one half of the payments received in it where a deposit payment was received in the closing period; and otherwise on the cash received."
      refund_late_count: "The closing period earns interest only for months of satisfactory payment on the secured agreement, late payment charges being counted after deducting one for each courtesy late-charge waiver credit"
      refund_waiver_count: "late payment charges being counted after deducting one for each courtesy late-charge waiver credit"
      refund_reversal_count: "a payment reversal was posted on the secured agreement"
      refund_reconnection_count: "a reconnection charge was posted on any of the customer's agreements"
      refund_counted_lapses: "late payment charges being counted after deducting one for each courtesy late-charge waiver credit"
      closing_months_earned: "where in its lapse months a reconnection charge was posted on any of the customer's agreements, a payment reversal was posted on the secured agreement, or lapse_heavy_count or more late payment charges are counted, it earns lapse_heavy_months months; where one or more but fewer than lapse_heavy_count late payment charges are counted, with no payment reversal and no reconnection charge, it earns lapse_light_months months; otherwise it earns full_year_months months."
      closing_interest: "The interest paid within the refund is the interest base of the closing period times its period rate times the months it earned over full_year_months, rounded to the cent"
      result: "the refund is the cash held plus the interest credited plus that interest, rounded to the cent."
    factors:
      - id: closing_opening_rate_tier
        effect: parameter
        decides: closing_opening_rate
        bindings: [refund_credits_on_file, refund_latest_credit_end, closing_period_start, closing_opening_rate]
        ladder:
          - when: "the closing period of the refund began in calendar 2025"
            value: "K('rate_2025')"
          - when: "the closing period of the refund began in calendar 2024"
            value: "K('rate_2024')"
          - when: "otherwise"
            value: "P('interest_rate_annual')"
        baseline:
          closing_opening_rate: "refund_year_rate"
        evidence: [history, date]
        cross_difficulty: null
      - id: closing_period_rate_method
        effect: method
        decides: closing_period_rate
        bindings: [refund_year_rate, refund_year_start, closing_days, closing_days_before_new_year, deposit_held_months, closing_period_rate]
        ladder:
          - when: "the deposit has been held at least interest_min_holding_months whole months, and the closing period began in an earlier calendar year than the refund date with an opening rate that differs from its closing rate"
            method: "its days up to and including 31 December of that earlier year earn the opening rate and its days from 1 January of the refund date's year on earn the closing rate, each as days over days_in_year"
          - when: "the deposit has been held fewer than interest_min_holding_months whole months on the refund date"
            method: "the closing period earns no interest"
          - when: "otherwise"
            method: "the days of the closing period earn the closing rate as days over days_in_year"
        baseline:
          closing_period_rate: "refund_year_rate * closing_days / K('days_in_year')"
        evidence: [date, history]
        cross_difficulty: null
      - id: closing_interest_base_method
        effect: method
        decides: closing_interest_base
        bindings: [refund_excess_paid, refund_paid_in_period, closing_interest_base]
        ladder:
          - when: "an excess refund has been paid out of the deposit and no deposit payment was received in the closing period"
            method: "interest within the refund is earned on the cash received less the excess refunds paid"
          - when: "a deposit payment was received in the closing period"
            method: "interest within the refund is earned on the cash held when the period began plus one half of the payments received in it"
          - when: "otherwise"
            method: "interest within the refund is earned on the cash received"
        baseline:
          closing_interest_base: "refund_cash_in"
        evidence: [history]
        cross_difficulty: null
      - id: closing_months_tier
        effect: parameter
        decides: closing_months_earned
        bindings: [refund_late_count, refund_waiver_count, refund_reversal_count, refund_reconnection_count, refund_counted_lapses, closing_months_earned]
        ladder:
          - when: "in the lapse months of the closing period a reconnection charge on any of the customer's agreements or a payment reversal on the secured agreement, or lapse_heavy_count or more counted late payment charges"
            value: "K('lapse_heavy_months')"
          - when: "one or more but fewer than lapse_heavy_count counted late payment charges in those months, with no payment reversal and no reconnection charge"
            value: "K('lapse_light_months')"
          - when: "otherwise"
            value: "K('full_year_months')"
        baseline:
          closing_months_earned: "K('full_year_months')"
        evidence: [history, cross_category]
        cross_difficulty: service
    baseline:
      rule: >-
        For the interest paid within a refund, the Commission's deposit interest rates are rate_2024 for calendar 2024, rate_2025 for calendar 2025 and interest_rate_annual for calendar 2026 onward.
        A passed review refunds the cash received less the cash already refunded, plus the interest credited on the deposit, plus interest on the cash received for the period since the latest interest credit at the Commission's deposit interest rate for the calendar year of the refund date, by days over days_in_year, rounded to the cent.
      params: [interest_rate_annual, rate_2024, rate_2025, days_in_year]
    inputs:
      history:
        - {table: deposit_transactions, aggregate: sum, field: amount, within_months: 0, filters: {event_type: deposit_payment}}
        - {table: deposit_transactions, aggregate: sum, field: amount, within_months: 0, filters: {event_type: deposit_refund}}
        - {table: deposit_transactions, aggregate: sum, field: amount, within_months: 0, filters: {event_type: deposit_interest_credit}}
        - {table: deposit_transactions, aggregate: latest, field: interest_period_end, within_months: 0, filters: {event_type: deposit_interest_credit}}
        - {category: service, table: service_charges, aggregate: count, field: service_charge_id, within_months: 12, filters: {event_type: service_late_payment_charge}}
      cross_category: [service]
