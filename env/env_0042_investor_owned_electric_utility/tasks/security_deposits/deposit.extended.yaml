  - id: deposit_ext_additional_installment
    base_policy_refs: [deposit_installments_and_security, deposit_recalculation]
    overwrite:
      - base_policy: deposit_installments_and_security
        superseded_clause: >-
          The regular installment is the required amount divided by the installment count, rounded down to the cent, and the last installment carries the remainder.
        replaced_by: >-
          The additional amount due is the required amount recorded on the deposit less the held cash, which is the cash received less the cash refunded, and it is paid in installment_count_max installments, each the additional amount due divided by that count and rounded down to the cent, the last installment carrying the remainder.
      - base_policy: deposit_installments_and_security
        superseded_clause: >-
          Each installment number is recorded once.
        replaced_by: >-
          An additional deposit owed after a recalculation raised the requirement of a business deposit is paid by the customer directly to the deposit, in installments numbered on from the deposit's latest installment number, so that no installment number is recorded twice on the deposit.
      - base_policy: deposit_recalculation
        superseded_clause: >-
          When the recalculated amount exceeds the held cash by more than recalculation_increase_threshold_pct of the held cash, the deposit returns to assessed with the new required amount and the difference due within additional_deposit_due_days.
        replaced_by: >-
          When a recalculated amount exceeds the held cash by more than recalculation_increase_threshold_pct of the held cash, the deposit returns to assessed with the raised required amount, and the difference due within additional_deposit_due_days is this additional amount due, the held basis taking the place of the held cash.
      - base_policy: deposit_installments_and_security
        superseded_clause: >-
          The deposit becomes held on the day deposit_msr_cash_received reaches the required amount, or on the day an accepted instrument for the full required amount is lodged: a surety bond where surety_bond_accepted is true, an irrevocable letter of credit where letter_of_credit_accepted is true, or a third-party guarantee where third_party_guarantee_accepted is true.
        replaced_by: >-
          A deposit becomes held on the day the cash received on it reaches its required amount, or on the day an accepted instrument for the full required amount is lodged, except that a deposit returned to assessed by a recalculation becomes held again on the day its held basis reaches the raised required amount, or on the day an accepted instrument for the full raised required amount is lodged.
    trigger: on_request
    subject: [deposit_payment]
    computes: amount
    target_tool: pay_additional_deposit_64b1dc0d
    params:
      long_hold_months: 24
      mid_hold_months: 12
      record_window_months: 12
      count_large_extra: 2
      count_moderate_extra: 1
      moderate_share: 0.5
      autopay_window_months: 6
      autopay_full_count: 6
      autopay_part_count: 3
      autopay_extra_full: 2
      autopay_extra_part: 1
      tenure_long_months: 120
      tenure_mid_months: 60
      tenure_extra_long: 2
      tenure_extra_mid: 1
      front_notice: 2.0
      front_late: 1.5
    rule: >-
      An additional deposit owed after a recalculation raised the requirement of a business deposit is paid by the customer directly to the deposit, in installments numbered on from the deposit's latest installment number, so that no installment number is recorded twice on the deposit.
      The installment of an additional deposit is worked out only after the deposit shows its raised required amount and has returned to assessed status.
      The additional amount due is the required amount recorded on the deposit less the held cash, which is the cash received less the cash refunded, and it is paid in installment_count_max installments, each the additional amount due divided by that count and rounded down to the cent, the last installment carrying the remainder.
      Credited interest counts toward a raised requirement on a long-held deposit: where the deposit has been fully secured for at least long_hold_months whole months on the payment date and no payment reversal was posted on the secured agreement in the long_hold_months months ending on that date, the held basis is the held cash plus all interest credited on the deposit; where it has been fully secured for at least mid_hold_months but fewer than long_hold_months whole months, with no payment reversal in those long_hold_months months, the held basis is the held cash plus one half of the interest credited on the deposit; otherwise the held basis is the held cash.
      The additional amount due is then the required amount recorded on the deposit less the held basis, and never below zero.
      When a recalculated amount exceeds the held cash by more than recalculation_increase_threshold_pct of the held cash, the deposit returns to assessed with the raised required amount, and the difference due within additional_deposit_due_days is this additional amount due, the held basis taking the place of the held cash.
      The number of installments of the additional amount follows its size: where it is at least the held cash and no payment reversal was posted on the secured agreement in the record_window_months months ending on the payment date, it is installment_count_max plus count_large_extra; where it is at least moderate_share of the held cash but less than the held cash, with no such reversal, it is installment_count_max plus count_moderate_extra; otherwise it is installment_count_max.
      Autopay lengthens the plan: where at least autopay_full_count of the agreement's payments posted in the autopay_window_months months ending on the payment date came through autopay, autopay_extra_full installments are added; where at least autopay_part_count but fewer than autopay_full_count did, autopay_extra_part is added; otherwise none is added.
      Service length lengthens it too: an agreement in service at least tenure_long_months whole months on the payment date adds tenure_extra_long installments, one in service at least tenure_mid_months but fewer than tenure_long_months whole months adds tenure_extra_mid, and any other adds none.
      The regular installment is the additional amount due divided by the number of installments so lengthened, rounded down to the cent.
      The installment paid first is front-loaded on a weak record when the amount is spread: where a disconnection notice was issued on the secured agreement in the record_window_months months ending on the payment date and the plan has more than one installment, it is front_notice times the regular installment; where no such notice was issued, the plan has more than one installment and at least one late payment charge is counted on the secured agreement in those months after deducting one for each courtesy late-charge waiver credit, it is front_late times the regular installment; otherwise it is the regular installment.
      The installment paid first is rounded to the cent and never exceeds the additional amount due.
      After the installment paid first, the rest of the additional amount due is paid in equal installments over the remaining number, each rounded down to the cent, the last carrying the remainder, each due 30 calendar days after the previous one.
      A deposit becomes held on the day the cash received on it reaches its required amount, or on the day an accepted instrument for the full required amount is lodged, except that a deposit returned to assessed by a recalculation becomes held again on the day its held basis reaches the raised required amount, or on the day an accepted instrument for the full raised required amount is lodged.
      Whole months between two dates are counted from the earlier date to the same day of a later month, a month whose day has not yet been reached on the later date not counting.
    prerequisite:
      - problem: deposit_ext_recalculated_requirement
        kind: value_input
        gate: raised_requirement
        form: state
        policy_source: >-
          The installment of an additional deposit is worked out only after the deposit shows its raised required amount and has returned to assessed status.
        condition: >-
          The deposit's status is assessed while it keeps a fully_secured_date on record, and its required_amount is the recalculated requirement, above the held cash.
        resolved_by: require_additional_deposit_b541b477
        effect: >-
          The raised required amount recorded by the recalculation is the requirement from which the held basis is deducted, so the additional amount due and the installment change.
    cross_category:
      - category: service
        as: history
        reads: [service_charges.event_type, service_charges.posting_date, service_credits.credit_code, service_credits.payment_channel, service_credits.posting_date, service_notices.notice_date, start_date]
        note: The plan-length, autopay, service-length and front-loading tiers are decided from the secured agreement's payment reversals, payment channels, start date, notices and late payment charges.
    compute:
      - raised_requirement: "F('required_amount')"
      - cash_paid_in: "SUM('deposit_transactions', 'amount', event_type='deposit_payment')"
      - cash_paid_out: "SUM('deposit_transactions', 'amount', event_type='deposit_refund')"
      - held_cash: "cash_paid_in - cash_paid_out"
      - interest_credited: "SUM('deposit_transactions', 'amount', event_type='deposit_interest_credit')"
      - months_fully_secured: "MONTHS(F('fully_secured_date'), NOW)"
      - reversals_long: "XCOUNT('service', 'service_charges', within_months=K('long_hold_months'), date_field='posting_date', event_type='service_payment_reversal', service_account_id=F('service_account_id'))"
      - held_basis: "held_cash + interest_credited if (months_fully_secured >= K('long_hold_months') and reversals_long == 0) else (held_cash + interest_credited / 2 if (months_fully_secured >= K('mid_hold_months') and months_fully_secured < K('long_hold_months') and reversals_long == 0) else held_cash)"
      - additional_due: "MX(0, RND(raised_requirement - held_basis, 2))"
      - reversals_record: "XCOUNT('service', 'service_charges', within_months=K('record_window_months'), date_field='posting_date', event_type='service_payment_reversal', service_account_id=F('service_account_id'))"
      - plan_count: "P('installment_count_max') + K('count_large_extra') if (additional_due >= held_cash and reversals_record == 0) else (P('installment_count_max') + K('count_moderate_extra') if (additional_due >= held_cash * K('moderate_share') and additional_due < held_cash and reversals_record == 0) else P('installment_count_max'))"
      - autopay_payments: "XCOUNT('service', 'service_credits', within_months=K('autopay_window_months'), date_field='posting_date', event_type='service_payment', payment_channel='autopay', service_account_id=F('service_account_id'))"
      - autopay_extra: "K('autopay_extra_full') if autopay_payments >= K('autopay_full_count') else (K('autopay_extra_part') if autopay_payments >= K('autopay_part_count') else 0)"
      - service_months: "MONTHS(CFIELD('service', 'start_date', service_account_id=F('service_account_id')), NOW)"
      - service_extra: "K('tenure_extra_long') if service_months >= K('tenure_long_months') else (K('tenure_extra_mid') if service_months >= K('tenure_mid_months') else 0)"
      - installments: "plan_count + autopay_extra + service_extra"
      - regular_installment: "(int(RND(additional_due * 100, 0)) // installments) / 100"
      - notices_record: "XCOUNT('service', 'service_notices', within_months=K('record_window_months'), date_field='notice_date', event_type='service_disconnect_notice', service_account_id=F('service_account_id'))"
      - late_record: "XCOUNT('service', 'service_charges', within_months=K('record_window_months'), date_field='posting_date', event_type='service_late_payment_charge', service_account_id=F('service_account_id'))"
      - waived_record: "XCOUNT('service', 'service_credits', within_months=K('record_window_months'), date_field='posting_date', event_type='service_billing_credit', credit_code='late_charge_waiver', service_account_id=F('service_account_id'))"
      - front_multiplier: "K('front_notice') if (notices_record > 0 and installments > 1) else (K('front_late') if (notices_record == 0 and installments > 1 and late_record - waived_record >= 1) else 1)"
      - result: "RND(MN(additional_due, regular_installment * front_multiplier), 2)"
