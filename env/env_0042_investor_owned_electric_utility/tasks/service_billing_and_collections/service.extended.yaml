    cross_difficulty: null
  baseline:
    rule: >-
      The qualifying duration of the record is its recorded duration in hours. The record qualifies when its qualifying
      duration is at least the schedule's minimum outage credit duration. The sustained-outage credit is the schedule's
      outage credit base amount plus the schedule's outage credit increment amount for each full increment of the
      schedule's outage credit increment hours by which the qualifying duration exceeds the minimum duration, and
      that sum is then limited to the schedule's outage credit cap. The number of full increments is the excess
      hours divided by the increment hours, rounded down to a whole number, and only the final credit is rounded
      to the cent. No sustained-outage credit is posted for a record that does not qualify.
