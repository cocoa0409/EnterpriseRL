  - charges_total: SUM('service_charges', 'amount')
  - credits_total: SUM('service_credits', 'amount')
  - balance_now: bills_total + charges_total - credits_total
  - late_charges_all: SUM('service_charges', 'amount', event_type='service_late_payment_charge')
  - late_charges_recent: >-
