    ladder:
    - when: agreement in service 120 months or more
      value: 1.3 times the schedule's outage credit cap
    - when: agreement in service 60 to 119 months
      value: 1.15 times the schedule's outage credit cap
    - when: otherwise
      value: P('outage_credit_cap_usd')
    baseline:
