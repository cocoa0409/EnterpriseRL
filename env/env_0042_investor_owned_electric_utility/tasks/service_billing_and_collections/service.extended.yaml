- id: service_ext_reconnection_card_payment
  base_policy_refs:
  - service_payments_and_returns
  - service_reconnection_rule
  overwrite:
  - base_policy: service_payments_and_returns
    superseded_clause: Each confirmation number is posted once.
    replaced_by: >-
      A card payment taken on the call is posted once, under the one confirmation number its authorization produces.
  - base_policy: service_reconnection_rule
    superseded_clause: >-
      The payment requirement is met when payments posted since the disconnection date equal or exceed the schedule's
      reconnection_payment_basis measured at disconnection — the past-due balance for residential schedules or the
      whole account balance for business schedules.
    replaced_by: >-
      The basis of the reconnection payment depends on the reconnection charges posted on the agreement in the 24
      calendar months before the payment: with two or more, the basis is the whole balance; with exactly one, the
      basis is the balance less the late payment charges posted 12 or more calendar months before the payment; with
      none, the basis is the balance less every late payment charge ever posted on the agreement.
  trigger: on_request
  subject:
  - service_payment
  computes: amount
  target_tool: take_card_payment_dce85fc7
  params:
    repeat_reconnection_count: 2
    one_reconnection_count: 1
    assisted_payments_high: 2
    assisted_payments_low: 1
    two_assist_payment_share: 0.6
    one_assist_payment_share: 0.8
    long_tenure_months: 120
    mid_tenure_months: 60
    long_tenure_payment_share: 0.9
    mid_tenure_payment_share: 0.95
    many_notices: 3
    two_notices: 2
    two_notice_addon_factor: 0.5
    repeat_returns: 2
    one_return: 1
    repeat_return_fee_multiple: 5
    one_return_fee_multiple: 2.5
  rule: >-
    When a disconnected agreement is to be reconnected on payment, the customer pays the reconnection payment amount
    by card on the call, and the payment is posted that day under the confirmation number the card processor issues
    when it authorizes the payment. A card payment taken on the call is posted once, under the one confirmation
    number its authorization produces. The reconnection payment amount is fixed only after the agreement carries
    a late payment charge on its most recent bill once that bill's grace period has ended with part of it unpaid.
    The reconnection payment amount is not fixed until the agreement carries the sustained-outage credit owed for
    the most recent outage record at its service address when that record qualifies. The agreement's balance is
    the sum of its bills and charges less the sum of its payments and credits. The reconnection payment amount is
    that balance less every late payment charge ever posted on the agreement, rounded to the cent. The basis of
    the reconnection payment depends on the reconnection charges posted on the agreement in the 24 calendar months
    before the payment: with two or more, the basis is the whole balance; with exactly one, the basis is the balance
    less the late payment charges posted 12 or more calendar months before the payment; with none, the basis is
    the balance less every late payment charge ever posted on the agreement. The basis of the reconnection payment
    is multiplied by a hardship share of 0.6 when the agreement received two or more payments from an energy assistance
    agency in the 12 calendar months before the payment, 0.8 when it received exactly one such payment, and 1 when
    it received none. The basis of the reconnection payment is also multiplied by a tenure share of 0.9 for an agreement
    in service 120 whole calendar months or more since its start date, 0.95 for one in service at least 60 but fewer
    than 120 months, and 1 for one in service fewer than 60 months. A good-faith add-on is included in the reconnection
    payment: the schedule's minimum past-due balance for a disconnection notice when three or more written disconnection
    notices were served on the agreement in the 12 calendar months before the payment, half of that minimum when
    exactly two were, and nothing when one or none was. A returned-payment add-on is included in the reconnection
    payment: five times the schedule's returned payment fee when two or more payments on the agreement were reversed
    as returned unpaid in the 12 calendar months before the payment, two and a half times that fee when exactly
    one was, and nothing when none was. The basis, never below zero, is multiplied by the hardship share and the
    tenure share together and the product is rounded to the cent; the good-faith add-on and the returned-payment
    add-on are then added to it, and the sum is the reconnection payment amount. Every count or sum over a stated
    number of calendar months before a posting takes the records dated less than that many whole calendar months
    before the posting date.
