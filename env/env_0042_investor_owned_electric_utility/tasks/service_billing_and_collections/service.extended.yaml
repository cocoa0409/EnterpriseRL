      every rate, fee and period used.
    final_bill_date: >-
      The carried-charge anchor date is chosen by the closed agreement's history: it is the final bill's bill date
      when a payment on the closed agreement was reversed as returned unpaid in the 12 calendar months before the
      transfer; it is the agreement's stop date when no payment was returned but the final bill was issued six or
      more days after the stop date; and it is the final bill's due date otherwise.
    anchor_date: >-
      The carried-charge anchor date is chosen by the closed agreement's history: it is the final bill's bill date
      when a payment on the closed agreement was reversed as returned unpaid in the 12 calendar months before the
      transfer; it is the agreement's stop date when no payment was returned but the final bill was issued six or
      more days after the stop date; and it is the final bill's due date otherwise.
    days_since_anchor: >-
      Because no late payment charge can be posted on a closed agreement, the transfer carries the late payment
      charge of the final bill at a carried rate: the schedule's late payment charge rate when 60 or more calendar
      days have passed since the carried-charge anchor date, half of that rate when 40 to 59 days have passed, and
      no carried rate when fewer than 40 days have passed.
  factors:
  - id: final_bill_carried_rate
    effect: parameter
    decides: carried_rate
    bindings:
    - days_since_anchor
    - carried_rate
    ladder:
    - when: 60 or more days since the carried-charge anchor date
      value: P('late_payment_charge_rate')
    - when: 40 to 59 days since the anchor date
      value: half of P('late_payment_charge_rate')
    - when: otherwise
      value: '0'
    baseline:
      carried_rate: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: carried_charge_anchor
    effect: method
    decides: anchor_date
    bindings:
    - final_due_date
    - final_bill_date
    - closed_returns_12
    - anchor_date
    ladder:
    - when: a payment on the closed agreement was returned unpaid in the 12 months before the transfer
      method: the carried-charge days are counted from the final bill's bill date
    - when: no returned payment, and the final bill was issued six or more days after the stop date
      method: the carried-charge days are counted from the stop date
    - when: otherwise
      method: the carried-charge days are counted from the final bill's due date
    baseline:
      anchor_date: final_due_date
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: closed_tenure_forgiveness
    effect: parameter
    decides: forgiven_share
    bindings:
    - closed_late_total
    - closed_service_months
    - forgiven_share
    ladder:
    - when: closed agreement in service 48 months or more
      value: K('full_forgiveness')
    - when: in service 24 to 47 months
      value: K('half_forgiveness')
    - when: otherwise
      value: '0'
    baseline:
      forgiven_share: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: closed_notice_collection_recovery
    effect: parameter
    decides: collection_recovery
    bindings:
    - closed_notices_12
    - collection_recovery
    ladder:
    - when: two or more written notices on the closed agreement in the 12 months before the transfer
      value: 1.2 times P('returned_payment_fee_usd')
    - when: exactly one written notice
      value: 0.6 times P('returned_payment_fee_usd')
    - when: otherwise
      value: '0'
    baseline:
      collection_recovery: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The closed agreement's balance is the sum of its bills and charges less the sum of its payments and credits.
      The transfer amount is that balance, rounded to the cent.
    params: []
  inputs:
    history:
    - table: service_bills
      aggregate: sum
      field: amount
      within_months: null
      filters: {}
    - table: service_charges
      aggregate: sum
      field: amount
      within_months: null
      filters: {}
    - table: service_credits
      aggregate: sum
      field: amount
      within_months: null
      filters: {}
    - table: service_bills
      aggregate: latest
      field: due_date
      within_months: null
      filters:
        bill_kind: final
    - table: service_notices
      aggregate: count
      field: notice_id
      within_months: 12
      filters:
        notice_type: written_notice
    cross_category: []
- id: service_ext_auto_chronic_outage_credit
  base_policy_refs:
  - service_outage_credit_rule
  - service_chronic_outage_credit
  overwrite:
  - base_policy: service_chronic_outage_credit
    superseded_clause: >-
      A chronic-outage credit (credit_code chronic_outage) of the schedule's chronic_outage_credit_usd is granted
      when service_msr_outages_12m for an outage record reaches chronic_outage_count_threshold.
    replaced_by: >-
      A chronic-outage credit is posted to the agreement, without waiting for the customer to ask, once the outage
      records at its service address that began within the chronic look-back reach the chronic threshold; the credit
      is attached to the most recent outage record at the address.
  - base_policy: service_chronic_outage_credit
    superseded_clause: >-
      The credit is attached to the outage record that reached the threshold and is posted on request under the
      same claim window as the sustained-outage credit.
    replaced_by: >-
      A chronic-outage credit is posted to the agreement, without waiting for the customer to ask, once the outage
      records at its service address that began within the chronic look-back reach the chronic threshold; the credit
      is attached to the most recent outage record at the address.
  trigger: state_due
  subject:
  - service_outage_credit
  computes: amount
  target_tool: grant_chronic_outage_credit_becf7e74
  params:
    controllable_many: 4
    controllable_some: 2
    threshold_cut_many: 2
    threshold_cut_some: 1
    severe_excess: 4
    marked_excess: 2
    severe_chronic_factor: 3.0
    marked_chronic_factor: 2.0
    large_load_kw: 20
    large_load_factor: 1.5
    single_load_factor: 1.25
    planned_many: 2
    planned_one: 1
    long_tenure_months: 120
    mid_tenure_months: 60
    long_tenure_addon_factor: 0.8
    mid_tenure_addon_factor: 0.5
    long_lookback: 24
    mid_lookback: 18
    base_lookback: 12
  rule: >-
    A chronic-outage credit is posted to the agreement, without waiting for the customer to ask, once the outage
    records at its service address that began within the chronic look-back reach the chronic threshold; the credit
    is attached to the most recent outage record at the address. Every outage record at the address counts toward
    the chronic threshold, whatever its duration, cause or major event day. The chronic look-back is the 12 calendar
    months before the posting. The chronic threshold is the schedule's chronic outage count threshold. The chronic-outage
    credit is the schedule's chronic outage credit amount, rounded to the cent. No chronic-outage credit is posted
    while the count of outage records stays below the chronic threshold. The chronic threshold is lowered by two
    records when four or more outage records at the address recorded as equipment failure or vegetation began in
    the 12 calendar months before the posting, lowered by one record when two or three such records began in that
    period, and is the schedule's chronic outage count threshold when one or none did, because those causes lie
    within the company's own control. The chronic credit amount is three times the schedule's chronic outage credit
    amount when the outage records in the chronic look-back reach the chronic threshold plus four or more, twice
    that amount when they reach the threshold plus two or three, and the schedule's chronic outage credit amount
    otherwise. The chronic credit amount is multiplied by a load factor of 1.5 when the highest measured demand
    on the agreement's bills is 20 kW or more and the meter in service at the premise is an AMI Three-Phase Commercial
    Meter, by 1.25 when exactly one of those two holds, and by 1 when neither holds, and the product is rounded
    to the cent. The chronic look-back is set by the planned maintenance at the address, because interruptions the
    company schedules itself extend the period over which repeated interruptions are judged: it is the 24 calendar
    months before the posting when two or more outage records recorded as planned maintenance began in the 12 calendar
    months before the posting, the 18 calendar months before the posting when exactly one did, and the 12 calendar
    months before the posting when none did. A tenure add-on is added to the chronic-outage credit: 0.8 times the
    schedule's chronic outage credit amount for an agreement in service 120 whole calendar months or more since
    its start date, 0.5 times that amount for one in service at least 60 but fewer than 120 months, and nothing
    for one in service fewer than 60 months. The credit is assembled in this order: the chronic credit amount, then
    the load factor with rounding to the cent, and the tenure add-on is added last. Every count or sum over a stated
    number of calendar months before a posting takes the records dated less than that many whole calendar months
    before the posting date.
  prerequisite: []
  cross_category:
  - category: meter
    as: branch
    reads:
    - status
    - variant_name
    note: Whether the meter in service is an AMI Three-Phase Commercial Meter enters the load factor.
  compute:
  - planned_records_12: COUNT('service_outages', within_months=12, date_field='outage_start', cause='planned_maintenance')
  - lookback_months: >-
      K('long_lookback') if planned_records_12 >= K('planned_many') else (K('mid_lookback') if planned_records_12
      >= K('planned_one') else K('base_lookback'))
  - outage_records_counted: COUNT('service_outages', within_months=lookback_months, date_field='outage_start')
  - controllable_records_12: >-
      COUNT('service_outages', within_months=12, date_field='outage_start', cause='equipment_failure') + COUNT('service_outages',
      within_months=12, date_field='outage_start', cause='vegetation')
  - chronic_threshold: >-
      P('chronic_outage_count_threshold') - K('threshold_cut_many') if controllable_records_12 >= K('controllable_many')
      else (P('chronic_outage_count_threshold') - K('threshold_cut_some') if controllable_records_12 >= K('controllable_some')
      else P('chronic_outage_count_threshold'))
  - chronic_amount: >-
      P('chronic_outage_credit_usd') * K('severe_chronic_factor') if outage_records_counted >= chronic_threshold
      + K('severe_excess') else (P('chronic_outage_credit_usd') * K('marked_chronic_factor') if outage_records_counted
      >= chronic_threshold + K('marked_excess') else P('chronic_outage_credit_usd'))
  - peak_demand_kw: MAX('service_bills', 'measured_demand_kw')
  - meter_type: CFIELD('meter', 'variant_name', status='in_service')
  - load_factor: >-
      K('large_load_factor') if (peak_demand_kw >= K('large_load_kw') and meter_type == 'AMI Three-Phase Commercial
      Meter') else (K('single_load_factor') if ((peak_demand_kw >= K('large_load_kw') and meter_type != 'AMI Three-Phase
      Commercial Meter') or (peak_demand_kw < K('large_load_kw') and meter_type == 'AMI Three-Phase Commercial Meter'))
      else 1)
  - loaded_credit: RND(chronic_amount * load_factor, 2)
  - months_in_service: MONTHS(F('start_date'), NOW)
  - tenure_addon: >-
      P('chronic_outage_credit_usd') * K('long_tenure_addon_factor') if months_in_service >= K('long_tenure_months')
      else (P('chronic_outage_credit_usd') * K('mid_tenure_addon_factor') if months_in_service >= K('mid_tenure_months')
      else 0)
  - result: RND(loaded_credit + tenure_addon, 2) if outage_records_counted >= chronic_threshold else 0
  compute_basis:
    controllable_records_12: >-
      The chronic threshold is lowered by two records when four or more outage records at the address recorded as
      equipment failure or vegetation began in the 12 calendar months before the posting, lowered by one record
      when two or three such records began in that period, and is the schedule's chronic outage count threshold
      when one or none did, because those causes lie within the company's own control. Every count or sum over a
      stated number of calendar months before a posting takes the records dated less than that many whole calendar
      months before the posting date.
    chronic_threshold: >-
      The chronic threshold is lowered by two records when four or more outage records at the address recorded as
      equipment failure or vegetation began in the 12 calendar months before the posting, lowered by one record
      when two or three such records began in that period, and is the schedule's chronic outage count threshold
      when one or none did, because those causes lie within the company's own control.
    chronic_amount: >-
      The chronic credit amount is three times the schedule's chronic outage credit amount when the outage records
      in the chronic look-back reach the chronic threshold plus four or more, twice that amount when they reach
      the threshold plus two or three, and the schedule's chronic outage credit amount otherwise.
    peak_demand_kw: >-
      The chronic credit amount is multiplied by a load factor of 1.5 when the highest measured demand on the agreement's
      bills is 20 kW or more and the meter in service at the premise is an AMI Three-Phase Commercial Meter, by
      1.25 when exactly one of those two holds, and by 1 when neither holds, and the product is rounded to the cent.
    meter_type: >-
      The chronic credit amount is multiplied by a load factor of 1.5 when the highest measured demand on the agreement's
      bills is 20 kW or more and the meter in service at the premise is an AMI Three-Phase Commercial Meter, by
      1.25 when exactly one of those two holds, and by 1 when neither holds, and the product is rounded to the cent.
    load_factor: >-
      The chronic credit amount is multiplied by a load factor of 1.5 when the highest measured demand on the agreement's
      bills is 20 kW or more and the meter in service at the premise is an AMI Three-Phase Commercial Meter, by
      1.25 when exactly one of those two holds, and by 1 when neither holds, and the product is rounded to the cent.
    loaded_credit: >-
      The chronic credit amount is multiplied by a load factor of 1.5 when the highest measured demand on the agreement's
      bills is 20 kW or more and the meter in service at the premise is an AMI Three-Phase Commercial Meter, by
      1.25 when exactly one of those two holds, and by 1 when neither holds, and the product is rounded to the cent.
    planned_records_12: >-
      The chronic look-back is set by the planned maintenance at the address, because interruptions the company
      schedules itself extend the period over which repeated interruptions are judged: it is the 24 calendar months
      before the posting when two or more outage records recorded as planned maintenance began in the 12 calendar
      months before the posting, the 18 calendar months before the posting when exactly one did, and the 12 calendar
      months before the posting when none did. Every count or sum over a stated number of calendar months before
      a posting takes the records dated less than that many whole calendar months before the posting date.
    months_in_service: >-
      A tenure add-on is added to the chronic-outage credit: 0.8 times the schedule's chronic outage credit amount
      for an agreement in service 120 whole calendar months or more since its start date, 0.5 times that amount
      for one in service at least 60 but fewer than 120 months, and nothing for one in service fewer than 60 months.
    tenure_addon: >-
      A tenure add-on is added to the chronic-outage credit: 0.8 times the schedule's chronic outage credit amount
      for an agreement in service 120 whole calendar months or more since its start date, 0.5 times that amount
      for one in service at least 60 but fewer than 120 months, and nothing for one in service fewer than 60 months.
    result: >-
      A chronic-outage credit is posted to the agreement, without waiting for the customer to ask, once the outage
      records at its service address that began within the chronic look-back reach the chronic threshold; the credit
      is attached to the most recent outage record at the address. The credit is assembled in this order: the chronic
      credit amount, then the load factor with rounding to the cent, and the tenure add-on is added last.
    lookback_months: >-
      The chronic look-back is set by the planned maintenance at the address, because interruptions the company
      schedules itself extend the period over which repeated interruptions are judged: it is the 24 calendar months
      before the posting when two or more outage records recorded as planned maintenance began in the 12 calendar
      months before the posting, the 18 calendar months before the posting when exactly one did, and the 12 calendar
      months before the posting when none did.
    outage_records_counted: >-
      Every outage record at the address counts toward the chronic threshold, whatever its duration, cause or major
      event day. The chronic look-back is set by the planned maintenance at the address, because interruptions the
      company schedules itself extend the period over which repeated interruptions are judged: it is the 24 calendar
      months before the posting when two or more outage records recorded as planned maintenance began in the 12
      calendar months before the posting, the 18 calendar months before the posting when exactly one did, and the
      12 calendar months before the posting when none did.
  factors:
  - id: controllable_cause_threshold
    effect: parameter
    decides: chronic_threshold
    bindings:
    - controllable_records_12
    - chronic_threshold
    ladder:
    - when: four or more equipment-failure or vegetation records at the address in the 12 months before posting
      value: the schedule's chronic outage count threshold minus two
    - when: two or three such records in that period
      value: the schedule's chronic outage count threshold minus one
    - when: otherwise
      value: P('chronic_outage_count_threshold')
    baseline:
      chronic_threshold: P('chronic_outage_count_threshold')
    evidence:
    - history
    cross_difficulty: null
  - id: chronic_excess_amount
    effect: parameter
    decides: chronic_amount
    bindings:
    - outage_records_counted
    - chronic_amount
    ladder:
    - when: records in the chronic look-back reach the chronic threshold plus four or more
      value: three times the schedule's chronic outage credit amount
    - when: records in the look-back reach the threshold plus two or three
      value: twice the schedule's chronic outage credit amount
    - when: otherwise
      value: P('chronic_outage_credit_usd')
    baseline:
      chronic_amount: P('chronic_outage_credit_usd')
    evidence:
    - history
    cross_difficulty: null
  - id: three_phase_load_factor
    effect: parameter
    decides: load_factor
    bindings:
    - peak_demand_kw
    - meter_type
    - load_factor
    ladder:
    - when: highest measured demand 20 kW or more and an AMI Three-Phase Commercial Meter in service
      value: K('large_load_factor')
    - when: exactly one of those two holds
      value: K('single_load_factor')
    - when: otherwise
      value: '1'
    baseline:
      load_factor: '1'
    evidence:
    - history
    - cross_category
    cross_difficulty: meter
  - id: planned_maintenance_lookback
    effect: method
    decides: lookback_months
    bindings:
    - planned_records_12
    - lookback_months
    ladder:
    - when: two or more planned-maintenance records at the address in the 12 months before posting
      method: outage records are counted over the 24 calendar months before posting
    - when: exactly one such record
      method: outage records are counted over the 18 calendar months before posting
    - when: otherwise
      method: outage records are counted over the 12 calendar months before posting
    baseline:
      lookback_months: K('base_lookback')
    evidence:
    - history
    cross_difficulty: null
  - id: tenure_chronic_addon
    effect: parameter
    decides: tenure_addon
    bindings:
    - months_in_service
    - tenure_addon
    ladder:
    - when: agreement in service 120 months or more
      value: 0.8 times P('chronic_outage_credit_usd')
    - when: agreement in service 60 to 119 months
      value: 0.5 times P('chronic_outage_credit_usd')
    - when: otherwise
      value: '0'
    baseline:
      tenure_addon: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The chronic look-back is the 12 calendar months before the posting. The chronic threshold is the schedule's
      chronic outage count threshold. The chronic-outage credit is the schedule's chronic outage credit amount,
      rounded to the cent. No chronic-outage credit is posted while the count of outage records stays below the
      chronic threshold.
    params:
    - chronic_outage_count_threshold
    - chronic_outage_credit_usd
  inputs:
    history:
    - table: service_outages
      aggregate: count
      field: outage_event_id
      within_months: lookback
      filters: {}
    - table: service_outages
      aggregate: count
      field: outage_event_id
      within_months: 12
      filters:
        cause: equipment_failure
    - table: service_outages
      aggregate: count
      field: outage_event_id
      within_months: 12
      filters:
        cause: planned_maintenance
    - table: service_bills
      aggregate: max
      field: measured_demand_kw
      within_months: null
      filters: {}
    cross_category:
    - meter
- id: service_ext_notice_avoidance_bank_draft
  base_policy_refs:
  - service_payments_and_returns
  - service_disconnection_notice_rule
  - service_agg_prior_balance_transfer
  overwrite:
  - base_policy: service_payments_and_returns
    superseded_clause: Each confirmation number is posted once.
    replaced_by: >-
      A bank draft authorized on the call is posted once, under the one confirmation number its authorization produces.
  - base_policy: service_agg_prior_balance_transfer
    superseded_clause: >-
      A transferred balance becomes part of the receiving agreement's next bill cycle and is past due on that agreement
      only after that bill's due date.
    replaced_by: >-
      A balance transferred from a closed agreement counts toward the past-due balance in full when two or more
      late payment charges were posted on the agreement in the 24 calendar months before the payment, at half its
      amount, with any fraction of a cent dropped, when exactly one was, and not at all when none was.
  trigger: on_request
  subject:
  - service_payment
  computes: amount
  target_tool: authorize_bank_draft_payment_056776f4
  params:
    two_late: 2
    one_late: 1
    half_transfer: 0.5
    two_returns: 2
    one_return: 1
    half_allowance: 0.5
    one_cent: 0.01
    long_service_months: 96
    mid_service_months: 48
    large_load_kw: 20
    mid_load_kw: 10
    large_margin_factor: 0.2
    mid_margin_factor: 0.1
    long_bill_share: 0.2
    mid_bill_share: 0.1
  rule: >-
    When a customer asks how much to pay now so that the agreement no longer meets the past-due minimum for a written
    disconnection notice, the customer authorizes a one-time bank draft for the notice-avoidance amount from the
    business or household checking account, and the draft is posted that day under the confirmation number the payment
    channel issues. A bank draft authorized on the call is posted once, under the one confirmation number its authorization
    produces. A bank draft is taken only while the payments on the agreement reversed as returned unpaid in the
    schedule's returned-payment restriction look-back stay below the schedule's returned-payment restriction count,
    as the base payment rule provides; at or above that count no bank draft is taken. The notice-avoidance amount
    is fixed only after every closed agreement of the customer whose final bill has stayed unpaid for the prior
    balance transfer period carries a balance transfer credit. The notice-avoidance amount is not fixed until the
    agreement carries the chronic-outage credit owed once its outage records reach the chronic threshold. The past-due
    balance is the sum of the agreement's bills whose due date has passed and all of its charges, less all of its
    payments and credits; a balance transferred from a closed agreement is left out until it is billed. The notice-avoidance
    amount is the past-due balance less an allowance of one cent under the schedule's minimum past-due balance for
    a disconnection notice, never below zero, rounded to the cent. A balance transferred from a closed agreement
    counts toward the past-due balance in full when two or more late payment charges were posted on the agreement
    in the 24 calendar months before the payment, at half its amount, with any fraction of a cent dropped, when
    exactly one was, and not at all when none was. The allowance under the notice minimum is nothing when two or
    more payments on the agreement were reversed as returned unpaid in the 24 calendar months before the payment,
    half of the schedule's minimum past-due balance for a disconnection notice when exactly one was, and one cent
    under that minimum when none was. For an agreement in service 96 whole calendar months or more since its start
    date the allowance is the larger of the returned-payment allowance and one fifth of the agreement's most recent
    bill, for one in service at least 48 but fewer than 96 months it is the larger of that allowance and one tenth
    of the most recent bill, and for one in service fewer than 48 months it is the returned-payment allowance as
    it is; the part taken from the most recent bill is rounded to the cent, and the allowance never exceeds one
    cent under the notice minimum. A load margin is added to the notice-avoidance amount: 0.2 times the schedule's
    minimum past-due balance for a disconnection notice when the highest measured demand on the agreement's bills
    is 20 kW or more, 0.1 times that minimum when it is at least 10 but below 20 kW, and nothing when it is below
    10 kW. The allowance is subtracted from the past-due balance first, never going below zero, and the load margin
    is added to that result; the amount is rounded to the cent. Every count or sum over a stated number of calendar
    months before a posting takes the records dated less than that many whole calendar months before the posting
    date.
  prerequisite:
  - problem: service_ext_prior_balance_transfer_settlement
    kind: value_input
    gate: transfers_in
    form: state
    policy_source: >-
      The notice-avoidance amount is fixed only after every closed agreement of the customer whose final bill has
      stayed unpaid for the prior balance transfer period carries a balance transfer credit.
    condition: >-
      Every closed agreement of the customer whose final bill has stayed unpaid for the transfer period carries
      a prior_balance_transfer program credit, and the receiving agreement carries the matching transfer debit.
    resolved_by: transfer_prior_balance_e8000638
    effect: >-
      The transfer debit enters the receiving agreement's charges; the share of it that the late-history ladder
      counts (all, half or none) enters the past-due balance and with it the notice-avoidance amount.
  - problem: service_ext_auto_chronic_outage_credit
    kind: value_input
    gate: credits_total
    form: state
    policy_source: >-
      The notice-avoidance amount is not fixed until the agreement carries the chronic-outage credit owed once its
      outage records reach the chronic threshold.
    condition: >-
      Once the outage records at the address that began within the chronic look-back (12, 18 or 24 months before
      the payment, set by the planned-maintenance records of the last 12 months) reach the chronic threshold, the
      agreement carries a chronic_outage credit attached to the most recent outage record.
    resolved_by: grant_chronic_outage_credit_becf7e74
    effect: >-
      The chronic-outage credit enters the agreement's credits and lowers the past-due balance and the notice-avoidance
      amount by the credited amount.
  cross_category: []
  compute:
  - bills_total: SUM('service_bills', 'amount')
  - charges_total: SUM('service_charges', 'amount')
  - credits_total: SUM('service_credits', 'amount')
  - current_bill_amount: LATEST('service_bills', 'amount', date_field='bill_date')
  - current_due_date: LATEST('service_bills', 'due_date', date_field='bill_date')
  - current_not_due: 1 if DAYS(NOW, current_due_date) >= 0 else 0
  - transfers_in: >-
      SUM('service_charges', 'amount', event_type='service_program_debit', charge_code='prior_balance_transfer')
  - late_charges_24: >-
      COUNT('service_charges', within_months=24, date_field='posting_date', event_type='service_late_payment_charge')
  - transfer_counted: >-
      transfers_in if late_charges_24 >= K('two_late') else (int(transfers_in * K('half_transfer') * 100 + 0.000001)
      / 100 if late_charges_24 >= K('one_late') else 0)
  - past_due_balance: >-
      bills_total - current_bill_amount * current_not_due + charges_total - transfers_in + transfer_counted - credits_total
  - returned_payments_24: >-
      COUNT('service_charges', within_months=24, date_field='posting_date', event_type='service_payment_reversal')
  - notice_allowance: >-
      0 if returned_payments_24 >= K('two_returns') else (RND(P('disconnect_min_past_due_usd') * K('half_allowance'),
      2) if returned_payments_24 >= K('one_return') else P('disconnect_min_past_due_usd') - K('one_cent'))
  - months_in_service: MONTHS(F('start_date'), NOW)
  - allowance_final: >-
      MN(P('disconnect_min_past_due_usd') - K('one_cent'), MX(notice_allowance, RND(current_bill_amount * K('long_bill_share'),
      2))) if months_in_service >= K('long_service_months') else (MN(P('disconnect_min_past_due_usd') - K('one_cent'),
      MX(notice_allowance, RND(current_bill_amount * K('mid_bill_share'), 2))) if months_in_service >= K('mid_service_months')
      else notice_allowance)
  - peak_demand_kw: MAX('service_bills', 'measured_demand_kw')
  - load_margin: >-
      P('disconnect_min_past_due_usd') * K('large_margin_factor') if peak_demand_kw >= K('large_load_kw') else (P('disconnect_min_past_due_usd')
      * K('mid_margin_factor') if peak_demand_kw >= K('mid_load_kw') else 0)
  - result: RND(MX(0, past_due_balance - allowance_final) + load_margin, 2)
  compute_basis:
    bills_total: >-
      The past-due balance is the sum of the agreement's bills whose due date has passed and all of its charges,
      less all of its payments and credits; a balance transferred from a closed agreement is left out until it is
      billed.
    charges_total: >-
      The past-due balance is the sum of the agreement's bills whose due date has passed and all of its charges,
      less all of its payments and credits; a balance transferred from a closed agreement is left out until it is
      billed.
    credits_total: >-
      The past-due balance is the sum of the agreement's bills whose due date has passed and all of its charges,
      less all of its payments and credits; a balance transferred from a closed agreement is left out until it is
      billed.
    current_bill_amount: >-
      The past-due balance is the sum of the agreement's bills whose due date has passed and all of its charges,
      less all of its payments and credits; a balance transferred from a closed agreement is left out until it is
      billed.
    current_due_date: >-
      The past-due balance is the sum of the agreement's bills whose due date has passed and all of its charges,
      less all of its payments and credits; a balance transferred from a closed agreement is left out until it is
      billed.
    current_not_due: >-
      The past-due balance is the sum of the agreement's bills whose due date has passed and all of its charges,
      less all of its payments and credits; a balance transferred from a closed agreement is left out until it is
      billed.
    transfers_in: >-
      The past-due balance is the sum of the agreement's bills whose due date has passed and all of its charges,
      less all of its payments and credits; a balance transferred from a closed agreement is left out until it is
      billed. A balance transferred from a closed agreement counts toward the past-due balance in full when two
      or more late payment charges were posted on the agreement in the 24 calendar months before the payment, at
      half its amount, with any fraction of a cent dropped, when exactly one was, and not at all when none was.
    late_charges_24: >-
      A balance transferred from a closed agreement counts toward the past-due balance in full when two or more
      late payment charges were posted on the agreement in the 24 calendar months before the payment, at half its
      amount, with any fraction of a cent dropped, when exactly one was, and not at all when none was. Every count
      or sum over a stated number of calendar months before a posting takes the records dated less than that many
      whole calendar months before the posting date.
    transfer_counted: >-
      A balance transferred from a closed agreement counts toward the past-due balance in full when two or more
      late payment charges were posted on the agreement in the 24 calendar months before the payment, at half its
      amount, with any fraction of a cent dropped, when exactly one was, and not at all when none was.
    past_due_balance: >-
      The past-due balance is the sum of the agreement's bills whose due date has passed and all of its charges,
      less all of its payments and credits; a balance transferred from a closed agreement is left out until it is
      billed.
    returned_payments_24: >-
      The allowance under the notice minimum is nothing when two or more payments on the agreement were reversed
      as returned unpaid in the 24 calendar months before the payment, half of the schedule's minimum past-due balance
      for a disconnection notice when exactly one was, and one cent under that minimum when none was. Every count
      or sum over a stated number of calendar months before a posting takes the records dated less than that many
      whole calendar months before the posting date.
    notice_allowance: >-
      The allowance under the notice minimum is nothing when two or more payments on the agreement were reversed
      as returned unpaid in the 24 calendar months before the payment, half of the schedule's minimum past-due balance
      for a disconnection notice when exactly one was, and one cent under that minimum when none was.
    months_in_service: >-
      For an agreement in service 96 whole calendar months or more since its start date the allowance is the larger
      of the returned-payment allowance and one fifth of the agreement's most recent bill, for one in service at
      least 48 but fewer than 96 months it is the larger of that allowance and one tenth of the most recent bill,
      and for one in service fewer than 48 months it is the returned-payment allowance as it is; the part taken
      from the most recent bill is rounded to the cent, and the allowance never exceeds one cent under the notice
      minimum.
    allowance_final: >-
      For an agreement in service 96 whole calendar months or more since its start date the allowance is the larger
      of the returned-payment allowance and one fifth of the agreement's most recent bill, for one in service at
      least 48 but fewer than 96 months it is the larger of that allowance and one tenth of the most recent bill,
      and for one in service fewer than 48 months it is the returned-payment allowance as it is; the part taken
      from the most recent bill is rounded to the cent, and the allowance never exceeds one cent under the notice
      minimum.
    peak_demand_kw: >-
      A load margin is added to the notice-avoidance amount: 0.2 times the schedule's minimum past-due balance for
      a disconnection notice when the highest measured demand on the agreement's bills is 20 kW or more, 0.1 times
      that minimum when it is at least 10 but below 20 kW, and nothing when it is below 10 kW.
    load_margin: >-
      A load margin is added to the notice-avoidance amount: 0.2 times the schedule's minimum past-due balance for
      a disconnection notice when the highest measured demand on the agreement's bills is 20 kW or more, 0.1 times
      that minimum when it is at least 10 but below 20 kW, and nothing when it is below 10 kW.
    result: >-
      The allowance is subtracted from the past-due balance first, never going below zero, and the load margin is
      added to that result; the amount is rounded to the cent. The notice-avoidance amount is the past-due balance
      less an allowance of one cent under the schedule's minimum past-due balance for a disconnection notice, never
      below zero, rounded to the cent.
  factors:
  - id: late_history_transfer_count
    effect: parameter
    decides: transfer_counted
    bindings:
    - late_charges_24
    - transfer_counted
    ladder:
    - when: two or more late payment charges on the agreement in the 24 months before the payment
      value: 1 (the transferred balance counts in full)
    - when: exactly one late payment charge in that period
      value: K('half_transfer') (half of the transferred balance counts, any fraction of a cent dropped)
    - when: otherwise
      value: 0 (the transferred balance is left out until it is billed)
    baseline:
      transfer_counted: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: returned_payment_allowance
    effect: parameter
    decides: notice_allowance
    bindings:
    - returned_payments_24
    - notice_allowance
    ladder:
    - when: two or more returned payments reversed in the 24 months before the payment
      value: '0'
    - when: exactly one returned payment in that period
      value: half of P('disconnect_min_past_due_usd')
    - when: otherwise
      value: P('disconnect_min_past_due_usd') minus one cent
    baseline:
      notice_allowance: P('disconnect_min_past_due_usd') - K('one_cent')
    evidence:
    - history
    cross_difficulty: null
  - id: tenure_allowance_selection
    effect: method
    decides: allowance_final
    bindings:
    - months_in_service
    - allowance_final
    ladder:
    - when: agreement in service 96 months or more
      method: >-
        the allowance is the larger of the returned-payment allowance and one fifth of the most recent bill, never
        above one cent under the notice minimum
    - when: agreement in service 48 to 95 months
      method: >-
        the allowance is the larger of the returned-payment allowance and one tenth of the most recent bill, never
        above one cent under the notice minimum
    - when: otherwise
      method: the allowance is the returned-payment allowance as it is
    baseline:
      allowance_final: notice_allowance
    evidence:
    - date
    cross_difficulty: null
  - id: peak_demand_load_margin
    effect: parameter
    decides: load_margin
    bindings:
    - peak_demand_kw
    - load_margin
    ladder:
    - when: highest measured demand on the agreement's bills 20 kW or more
      value: 0.2 times P('disconnect_min_past_due_usd')
    - when: highest measured demand at least 10 but below 20 kW
      value: 0.1 times P('disconnect_min_past_due_usd')
    - when: otherwise
      value: '0'
    baseline:
      load_margin: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The past-due balance is the sum of the agreement's bills whose due date has passed and all of its charges,
      less all of its payments and credits; a balance transferred from a closed agreement is left out until it is
      billed. The notice-avoidance amount is the past-due balance less an allowance of one cent under the schedule's
      minimum past-due balance for a disconnection notice, never below zero, rounded to the cent.
    params:
    - disconnect_min_past_due_usd
  inputs:
    history:
    - table: service_bills
      aggregate: sum
      field: amount
      within_months: null
      filters: {}
    - table: service_charges
      aggregate: sum
      field: amount
      within_months: null
      filters: {}
    - table: service_credits
      aggregate: sum
      field: amount
      within_months: null
      filters: {}
    - table: service_charges
      aggregate: count
      field: service_charge_id
      within_months: 24
      filters:
        event_type: service_late_payment_charge
    - table: service_charges
      aggregate: count
      field: service_charge_id
      within_months: 24
      filters:
        event_type: service_payment_reversal
    - table: service_bills
      aggregate: max
      field: measured_demand_kw
      within_months: null
      filters: {}
    cross_category: []
