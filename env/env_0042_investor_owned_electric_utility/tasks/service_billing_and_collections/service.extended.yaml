  - reconnections_24: >-
      COUNT('service_charges', within_months=24, date_field='posting_date', event_type='service_reconnection_charge')
  - payment_basis: >-
      balance_now if reconnections_24 >= K('repeat_reconnection_count') else ((balance_now - (late_charges_all -
      late_charges_recent)) if reconnections_24 >= K('one_reconnection_count') else (balance_now - late_charges_all))
  - assistance_payments_12: >-
      COUNT('service_credits', within_months=12, date_field='posting_date', event_type='service_payment', payment_channel='energy_assistance_agency')
  - hardship_share: >-
