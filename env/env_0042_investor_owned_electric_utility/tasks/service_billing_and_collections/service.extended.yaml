- id: service_ext_reconnection_order_charge
  base_policy_refs:
  - service_reconnection_rule
  overwrite:
  - base_policy: service_reconnection_rule
    superseded_clause: >-
      The charge is reconnection_fee_remote_usd when the address's in-service meter is remote-switch capable under
      its metering type; otherwise it is reconnection_fee_field_standard_usd, or reconnection_fee_field_after_hours_usd
      when the order is placed outside reconnection_standard_hours and the customer elects same-day restoration
      instead of the next standard-hours crew visit.
    replaced_by: >-
      The restoration charge is the schedule's remote reconnection charge when the meter in service at the premise
      is remote-switch capable and no tampering or diversion finding was confirmed at the premise in the 24 calendar
      months before the order, a tampering investigation that found no tampering or could not gain access not being
      such a finding; it is the schedule's after-hours field reconnection charge when such a finding was confirmed
      in that period and a meter is in service at the premise, because service is then restored by a line crew at
      the pole; in every other case it is the schedule's field reconnection charge for standard hours.
  - base_policy: service_reconnection_rule
    superseded_clause: >-
      The payment requirement is met when payments posted since the disconnection date equal or exceed the schedule's
      reconnection_payment_basis measured at disconnection — the past-due balance for residential schedules or the
      whole account balance for business schedules.
    replaced_by: >-
      A reconnection order that rests on payment is issued only after the card, authorized pay station cash and
      energy assistance agency payments posted to the agreement since its disconnection date add up to at least
      the reconnection payment amount.
  trigger: on_request
  subject:
  - service_reconnection
  - service_reconnection_charge
  computes: reconnection_charge
  target_tool: issue_reconnection_order_52263bc7
  params:
    one_reconnection: 1
    many_door_hangers: 3
    two_door_hangers: 2
    many_visit_factor: 0.6
    two_visit_factor: 0.3
    assisted_payments_high: 2
    assisted_payments_low: 1
    two_assist_charge_share: 0.5
    one_assist_charge_share: 0.75
    long_tenure_months: 120
    mid_tenure_months: 60
    long_tenure_charge_share: 0.8
    mid_tenure_charge_share: 0.9
    secured_deposit_share: 0.5
    installment_deposit_share: 0.75
    one_notice: 1
    notice_assistance_window: 6
    base_assistance_window: 12
  rule: >-
    A reconnection order restores a disconnected agreement to active status on the order date and posts one reconnection
    charge dated that day, recording the restoration method and the order timing. A reconnection order that rests
    on payment is issued only after the card, authorized pay station cash and energy assistance agency payments
    posted to the agreement since its disconnection date add up to at least the reconnection payment amount. A reconnection
    order that rests on an active payment arrangement on the agreement whose down payment has been received, or
    on an active medical certification for the agreement whose kind requires disconnected service to be restored,
    needs no payment, as the base reconnection rule provides; payments by mail check, online bank transfer or autopay
    do not count toward a reconnection that rests on payment, because they can still be returned unpaid. The reconnection
    charge is the schedule's field reconnection charge for standard hours, rounded to the cent. The restoration
    charge is the schedule's remote reconnection charge when the meter in service at the premise is remote-switch
    capable and no tampering or diversion finding was confirmed at the premise in the 24 calendar months before
    the order, a tampering investigation that found no tampering or could not gain access not being such a finding;
    it is the schedule's after-hours field reconnection charge when such a finding was confirmed in that period
    and a meter is in service at the premise, because service is then restored by a line crew at the pole; in every
    other case it is the schedule's field reconnection charge for standard hours. The energy assistance payments
    for the hardship share are counted over a window anchored on the agreement's collection history: when a reconnection
    charge was posted on the agreement in the 12 calendar months before the order, the window is the number of whole
    calendar months that have passed since the most recent such charge, so that only assistance received in the
    current collection cycle counts; when none was but a written disconnection notice was served in that period,
    the window is the 6 calendar months before the order; otherwise it is the 12 calendar months before the order.
    A field-visit recovery is added to the restoration charge: 0.6 times the schedule's field reconnection charge
    for standard hours when three or more final disconnection notices were delivered by door hanger at the premise
    in the 12 calendar months before the order, 0.3 times that charge when exactly two were, and nothing when one
    or none was; final notices delivered by phone call are not field visits. The reconnection charge is multiplied
    by a hardship share of one half when the agreement received two or more payments from an energy assistance agency
    in the assistance window, three quarters when it received exactly one such payment there, and one when it received
    none. The reconnection charge is multiplied by a tenure share of 0.8 for an agreement in service 120 whole calendar
    months or more since its start date, 0.9 for one in service at least 60 but fewer than 120 months, and 1 for
    one in service fewer than 60 months. The reconnection charge is multiplied by a deposit share of one half when
    the customer holds a fully secured Residential Reestablishment Deposit, three quarters when such a deposit is
    still assessed and at least one deposit payment was received less than one whole calendar month before the order,
    and one in every other case. The restoration charge and the field-visit recovery are added first; that sum is
    multiplied by the hardship share, the tenure share and the deposit share together; and only the final reconnection
    charge is rounded to the cent. The restoration method recorded with the charge is remote when the remote reconnection
    charge applies and field otherwise, and the order timing is standard hours when the order is placed within the
    schedule's standard reconnection hours and after hours otherwise. Every count or sum over a stated number of
    calendar months before a posting takes the records dated less than that many whole calendar months before the
    posting date.
  prerequisite:
  - problem: service_ext_reconnection_card_payment
    kind: state_gate
    gate: service_reconnection_rule.reconnection_requirement_met
    form: state
    policy_source: >-
      A reconnection order that rests on payment is issued only after the card, authorized pay station cash and
      energy assistance agency payments posted to the agreement since its disconnection date add up to at least
      the reconnection payment amount.
    condition: >-
      For a reconnection that rests on payment (no active payment arrangement with its down payment received and
      no active medical certification whose kind requires restoration), the card, authorized pay station cash and
      energy assistance agency payments (service_credits, service_payment) posted on the agreement on or after its
      disconnection date sum to at least the reconnection payment amount.
    resolved_by: take_card_payment_dce85fc7
    effect: >-
      The customer's card payment of the reconnection payment amount meets the payment requirement of a reconnection
      that rests on payment, so the reconnection order may be issued.
  cross_category:
  - category: meter
    as: branch
    reads:
    - status
    - variant_name
    - meter_field_orders.finding
    note: >-
      Whether the meter in service is remote-switch capable and whether a tampering or diversion finding was confirmed
      decide the restoration charge.
  - category: deposit
    as: history
    reads:
    - status
    - variant_name
    - deposit_transactions.amount
    note: >-
      The Residential Reestablishment Deposit's status and recent deposit payments decide the deposit share.
  compute:
  - meter_remote_capable: CPARAM('meter', 'remote_switch_capable', status='in_service')
  - tamper_findings_24: >-
      XCOUNT('meter', 'meter_field_orders', within_months=24, date_field='order_date', event_type='meter_tampering_finding')
      - XCOUNT('meter', 'meter_field_orders', within_months=24, date_field='order_date', event_type='meter_tampering_finding',
      finding='no_tampering') - XCOUNT('meter', 'meter_field_orders', within_months=24, date_field='order_date',
      event_type='meter_tampering_finding', finding='no_access')
  - restoration_charge: >-
      P('reconnection_fee_remote_usd') if (meter_remote_capable == True and tamper_findings_24 == 0) else (P('reconnection_fee_field_after_hours_usd')
      if (tamper_findings_24 >= 1 and meter_remote_capable != None) else P('reconnection_fee_field_standard_usd'))
  - reconnections_12: >-
      COUNT('service_charges', within_months=12, date_field='posting_date', event_type='service_reconnection_charge')
  - last_reconnection_date: >-
      LATEST('service_charges', 'posting_date', date_field='posting_date', event_type='service_reconnection_charge')
  - written_notices_12: COUNT('service_notices', within_months=12, date_field='notice_date', notice_type='written_notice')
  - assistance_window_months: >-
      MONTHS(last_reconnection_date, NOW) if reconnections_12 >= K('one_reconnection') else (K('notice_assistance_window')
      if written_notices_12 >= K('one_notice') else K('base_assistance_window'))
  - door_hangers_12: >-
      COUNT('service_notices', within_months=12, date_field='notice_date', notice_type='final_notice', delivery_method='door_hanger')
  - visit_recovery: >-
      P('reconnection_fee_field_standard_usd') * K('many_visit_factor') if door_hangers_12 >= K('many_door_hangers')
      else (P('reconnection_fee_field_standard_usd') * K('two_visit_factor') if door_hangers_12 >= K('two_door_hangers')
      else 0)
  - assistance_payments_counted: >-
      COUNT('service_credits', within_months=assistance_window_months, date_field='posting_date', event_type='service_payment',
      payment_channel='energy_assistance_agency')
  - hardship_share: >-
      K('two_assist_charge_share') if assistance_payments_counted >= K('assisted_payments_high') else (K('one_assist_charge_share')
      if assistance_payments_counted >= K('assisted_payments_low') else 1)
  - months_in_service: MONTHS(F('start_date'), NOW)
  - tenure_share: >-
      K('long_tenure_charge_share') if months_in_service >= K('long_tenure_months') else (K('mid_tenure_charge_share')
      if months_in_service >= K('mid_tenure_months') else 1)
  - reest_deposit_held: EXISTS('deposit', variant_name='Residential Reestablishment Deposit', status='held')
  - reest_deposit_assessed: EXISTS('deposit', variant_name='Residential Reestablishment Deposit', status='assessed')
  - deposit_payments_1m: >-
      XSUM('deposit', 'deposit_transactions', 'amount', within_months=1, date_field='transaction_date', event_type='deposit_payment')
  - deposit_share: >-
      K('secured_deposit_share') if reest_deposit_held else (K('installment_deposit_share') if (reest_deposit_assessed
      and deposit_payments_1m > 0) else 1)
  - result: RND((restoration_charge + visit_recovery) * hardship_share * tenure_share * deposit_share, 2)
  compute_basis:
    meter_remote_capable: >-
      The restoration charge is the schedule's remote reconnection charge when the meter in service at the premise
      is remote-switch capable and no tampering or diversion finding was confirmed at the premise in the 24 calendar
      months before the order, a tampering investigation that found no tampering or could not gain access not being
      such a finding; it is the schedule's after-hours field reconnection charge when such a finding was confirmed
      in that period and a meter is in service at the premise, because service is then restored by a line crew at
      the pole; in every other case it is the schedule's field reconnection charge for standard hours.
    tamper_findings_24: >-
      The restoration charge is the schedule's remote reconnection charge when the meter in service at the premise
      is remote-switch capable and no tampering or diversion finding was confirmed at the premise in the 24 calendar
      months before the order, a tampering investigation that found no tampering or could not gain access not being
      such a finding; it is the schedule's after-hours field reconnection charge when such a finding was confirmed
      in that period and a meter is in service at the premise, because service is then restored by a line crew at
      the pole; in every other case it is the schedule's field reconnection charge for standard hours. Every count
      or sum over a stated number of calendar months before a posting takes the records dated less than that many
      whole calendar months before the posting date.
    restoration_charge: >-
      The restoration charge is the schedule's remote reconnection charge when the meter in service at the premise
      is remote-switch capable and no tampering or diversion finding was confirmed at the premise in the 24 calendar
      months before the order, a tampering investigation that found no tampering or could not gain access not being
      such a finding; it is the schedule's after-hours field reconnection charge when such a finding was confirmed
      in that period and a meter is in service at the premise, because service is then restored by a line crew at
      the pole; in every other case it is the schedule's field reconnection charge for standard hours.
    reconnections_12: >-
      The energy assistance payments for the hardship share are counted over a window anchored on the agreement's
      collection history: when a reconnection charge was posted on the agreement in the 12 calendar months before
      the order, the window is the number of whole calendar months that have passed since the most recent such charge,
      so that only assistance received in the current collection cycle counts; when none was but a written disconnection
      notice was served in that period, the window is the 6 calendar months before the order; otherwise it is the
      12 calendar months before the order. Every count or sum over a stated number of calendar months before a posting
      takes the records dated less than that many whole calendar months before the posting date.
    door_hangers_12: >-
      A field-visit recovery is added to the restoration charge: 0.6 times the schedule's field reconnection charge
      for standard hours when three or more final disconnection notices were delivered by door hanger at the premise
      in the 12 calendar months before the order, 0.3 times that charge when exactly two were, and nothing when
      one or none was; final notices delivered by phone call are not field visits. Every count or sum over a stated
      number of calendar months before a posting takes the records dated less than that many whole calendar months
      before the posting date.
    visit_recovery: >-
      A field-visit recovery is added to the restoration charge: 0.6 times the schedule's field reconnection charge
      for standard hours when three or more final disconnection notices were delivered by door hanger at the premise
      in the 12 calendar months before the order, 0.3 times that charge when exactly two were, and nothing when
      one or none was; final notices delivered by phone call are not field visits.
    hardship_share: >-
      The reconnection charge is multiplied by a hardship share of one half when the agreement received two or more
      payments from an energy assistance agency in the assistance window, three quarters when it received exactly
      one such payment there, and one when it received none.
    months_in_service: >-
      The reconnection charge is multiplied by a tenure share of 0.8 for an agreement in service 120 whole calendar
      months or more since its start date, 0.9 for one in service at least 60 but fewer than 120 months, and 1 for
      one in service fewer than 60 months.
    tenure_share: >-
      The reconnection charge is multiplied by a tenure share of 0.8 for an agreement in service 120 whole calendar
      months or more since its start date, 0.9 for one in service at least 60 but fewer than 120 months, and 1 for
      one in service fewer than 60 months.
    reest_deposit_held: >-
      The reconnection charge is multiplied by a deposit share of one half when the customer holds a fully secured
      Residential Reestablishment Deposit, three quarters when such a deposit is still assessed and at least one
      deposit payment was received less than one whole calendar month before the order, and one in every other case.
    reest_deposit_assessed: >-
      The reconnection charge is multiplied by a deposit share of one half when the customer holds a fully secured
      Residential Reestablishment Deposit, three quarters when such a deposit is still assessed and at least one
      deposit payment was received less than one whole calendar month before the order, and one in every other case.
    deposit_payments_1m: >-
      The reconnection charge is multiplied by a deposit share of one half when the customer holds a fully secured
      Residential Reestablishment Deposit, three quarters when such a deposit is still assessed and at least one
      deposit payment was received less than one whole calendar month before the order, and one in every other case.
      Every count or sum over a stated number of calendar months before a posting takes the records dated less than
      that many whole calendar months before the posting date.
    deposit_share: >-
      The reconnection charge is multiplied by a deposit share of one half when the customer holds a fully secured
      Residential Reestablishment Deposit, three quarters when such a deposit is still assessed and at least one
      deposit payment was received less than one whole calendar month before the order, and one in every other case.
    result: >-
      The restoration charge and the field-visit recovery are added first; that sum is multiplied by the hardship
      share, the tenure share and the deposit share together; and only the final reconnection charge is rounded
      to the cent.
    last_reconnection_date: >-
      The energy assistance payments for the hardship share are counted over a window anchored on the agreement's
      collection history: when a reconnection charge was posted on the agreement in the 12 calendar months before
      the order, the window is the number of whole calendar months that have passed since the most recent such charge,
      so that only assistance received in the current collection cycle counts; when none was but a written disconnection
      notice was served in that period, the window is the 6 calendar months before the order; otherwise it is the
      12 calendar months before the order.
    written_notices_12: >-
      The energy assistance payments for the hardship share are counted over a window anchored on the agreement's
      collection history: when a reconnection charge was posted on the agreement in the 12 calendar months before
      the order, the window is the number of whole calendar months that have passed since the most recent such charge,
      so that only assistance received in the current collection cycle counts; when none was but a written disconnection
      notice was served in that period, the window is the 6 calendar months before the order; otherwise it is the
      12 calendar months before the order. Every count or sum over a stated number of calendar months before a posting
      takes the records dated less than that many whole calendar months before the posting date.
    assistance_window_months: >-
      The energy assistance payments for the hardship share are counted over a window anchored on the agreement's
      collection history: when a reconnection charge was posted on the agreement in the 12 calendar months before
      the order, the window is the number of whole calendar months that have passed since the most recent such charge,
      so that only assistance received in the current collection cycle counts; when none was but a written disconnection
      notice was served in that period, the window is the 6 calendar months before the order; otherwise it is the
      12 calendar months before the order.
    assistance_payments_counted: >-
      The reconnection charge is multiplied by a hardship share of one half when the agreement received two or more
      payments from an energy assistance agency in the assistance window, three quarters when it received exactly
      one such payment there, and one when it received none. Every count or sum over a stated number of calendar
      months before a posting takes the records dated less than that many whole calendar months before the posting
      date.
  factors:
  - id: restoration_path_charge
    effect: parameter
    decides: restoration_charge
    bindings:
    - meter_remote_capable
    - tamper_findings_24
    - restoration_charge
    ladder:
    - when: >-
        the meter in service is remote-switch capable and no tampering or diversion finding was confirmed in the
        24 months before the order (investigations that found no tampering or could not gain access are not findings)
      value: P('reconnection_fee_remote_usd')
    - when: >-
        a tampering or diversion finding was confirmed in that period and a meter is in service at the premise
      value: P('reconnection_fee_field_after_hours_usd')
    - when: otherwise
      value: P('reconnection_fee_field_standard_usd')
    baseline:
      restoration_charge: P('reconnection_fee_field_standard_usd')
    evidence:
    - cross_category
    - history
    cross_difficulty: meter
  - id: collection_cycle_assistance_window
    effect: method
    decides: assistance_window_months
    bindings:
    - reconnections_12
    - last_reconnection_date
    - written_notices_12
    - assistance_window_months
    ladder:
    - when: a reconnection charge was posted on the agreement in the 12 months before the order
      method: >-
        assistance payments are counted over the whole calendar months since the most recent reconnection charge
    - when: no reconnection charge but a written disconnection notice in that period
      method: assistance payments are counted over the 6 calendar months before the order
    - when: otherwise
      method: assistance payments are counted over the 12 calendar months before the order
    baseline:
      assistance_window_months: K('base_assistance_window')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: door_hanger_visit_recovery
    effect: parameter
    decides: visit_recovery
    bindings:
    - door_hangers_12
    - visit_recovery
    ladder:
    - when: three or more final notices delivered by door hanger in the 12 months before the order
      value: 0.6 times P('reconnection_fee_field_standard_usd')
    - when: exactly two door-hanger final notices in that period
      value: 0.3 times P('reconnection_fee_field_standard_usd')
    - when: otherwise
      value: '0'
    baseline:
      visit_recovery: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: assistance_charge_share
    effect: parameter
    decides: hardship_share
    bindings:
    - assistance_payments_counted
    - hardship_share
    ladder:
    - when: two or more energy assistance agency payments in the assistance window
      value: K('two_assist_charge_share')
    - when: exactly one such payment in that window
      value: K('one_assist_charge_share')
    - when: otherwise
      value: '1'
    baseline:
      hardship_share: '1'
    evidence:
    - history
    cross_difficulty: null
  - id: tenure_charge_share
    effect: parameter
    decides: tenure_share
    bindings:
    - months_in_service
    - tenure_share
    ladder:
    - when: agreement in service 120 months or more
      value: K('long_tenure_charge_share')
    - when: agreement in service 60 to 119 months
      value: K('mid_tenure_charge_share')
    - when: otherwise
      value: '1'
    baseline:
      tenure_share: '1'
    evidence:
    - date
    cross_difficulty: null
  - id: reestablishment_deposit_share
    effect: parameter
    decides: deposit_share
    bindings:
    - reest_deposit_held
    - reest_deposit_assessed
    - deposit_payments_1m
    - deposit_share
    ladder:
    - when: the customer holds a fully secured Residential Reestablishment Deposit
      value: K('secured_deposit_share')
    - when: >-
        such a deposit is still assessed and a deposit payment was received less than one whole month before the
        order
      value: K('installment_deposit_share')
    - when: otherwise
      value: '1'
    baseline:
      deposit_share: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: deposit
  baseline:
    rule: >-
      The reconnection charge is the schedule's field reconnection charge for standard hours, rounded to the cent.
    params:
    - reconnection_fee_field_standard_usd
  inputs:
    history:
    - table: service_charges
      aggregate: latest
      field: posting_date
      within_months: 12
      filters:
        event_type: service_reconnection_charge
    - table: service_notices
      aggregate: count
      field: notice_id
      within_months: 12
      filters:
        notice_type: final_notice
        delivery_method: door_hanger
    - table: service_credits
      aggregate: count
      field: service_credit_id
      within_months: window
      filters:
        payment_channel: energy_assistance_agency
    - category: meter
      table: meter_field_orders
      aggregate: count
      field: meter_field_order_id
      within_months: 24
      filters:
        event_type: meter_tampering_finding
    - category: deposit
      table: deposit_transactions
      aggregate: sum
      field: amount
      within_months: 1
      filters:
        event_type: deposit_payment
    cross_category:
    - meter
    - deposit
- id: service_ext_prior_balance_transfer_settlement
  base_policy_refs:
  - service_agg_prior_balance_transfer
  - service_program_postings
  overwrite:
  - base_policy: service_agg_prior_balance_transfer
    superseded_clause: >-
      The transfer posts two entries for the whole unpaid balance of the closed agreement on the same posting date
      — a service_program_credit with credit_code prior_balance_transfer on the closed agreement whose source_reference_id
      is the receiving agreement, and a service_program_debit with charge_code prior_balance_transfer on the receiving
      agreement whose source_reference_id is the closed agreement.
    replaced_by: >-
      A balance transfer moves the unpaid balance of a closed agreement onto the customer's open agreement with
      the earliest start date: a transfer debit on the receiving agreement for the transfer amount, and a transfer
      credit on the closed agreement that clears its recorded balance, both dated the transfer day.
  - base_policy: service_agg_prior_balance_transfer
    superseded_clause: >-
      An unpaid final-bill balance left on a closed agreement is transferred to an open agreement of the same customer.
    replaced_by: >-
      The transfer amount is the closed agreement's balance less the forgiven late payment charges, plus the carried
      late payment charge, plus the collection recovery, rounded to the cent; the closed agreement's schedule supplies
      every rate, fee and period used.
  trigger: state_due
  subject:
  - service_program_debit
  - service_program_credit
  computes: amount
  target_tool: transfer_prior_balance_e8000638
  params:
    long_overdue_days: 60
    partial_rate_factor: 0.5
    one_return: 1
    long_service_months: 48
    mid_service_months: 24
    full_forgiveness: 1.0
    half_forgiveness: 0.5
    two_notices: 2
    one_notice: 1
    two_notice_fee_factor: 1.2
    one_notice_fee_factor: 0.6
    mid_overdue_days: 40
    late_final_days: 6
  rule: >-
    A balance transfer moves the unpaid balance of a closed agreement onto the customer's open agreement with the
    earliest start date: a transfer debit on the receiving agreement for the transfer amount, and a transfer credit
    on the closed agreement that clears its recorded balance, both dated the transfer day. The closed agreement's
    balance is the sum of its bills and charges less the sum of its payments and credits. The transfer amount is
    that balance, rounded to the cent. Because no late payment charge can be posted on a closed agreement, the transfer
    carries the late payment charge of the final bill at a carried rate: the schedule's late payment charge rate
    when 60 or more calendar days have passed since the carried-charge anchor date, half of that rate when 40 to
    59 days have passed, and no carried rate when fewer than 40 days have passed. The carried-charge anchor date
    is chosen by the closed agreement's history: it is the final bill's bill date when a payment on the closed agreement
    was reversed as returned unpaid in the 12 calendar months before the transfer; it is the agreement's stop date
    when no payment was returned but the final bill was issued six or more days after the stop date; and it is the
    final bill's due date otherwise. The final bill's unpaid portion is the smaller of its amount and the closed
    agreement's balance, never below zero. The carried late payment charge is the carried rate times the final bill's
    unpaid portion, rounded to the cent. The late payment charges already posted on the closed agreement are forgiven
    at transfer in full when the closed agreement was in service 48 whole calendar months or more from its start
    date to its stop date, by half when it was in service at least 24 but fewer than 48 months, and not at all when
    it was in service fewer than 24 months. A collection recovery is added to the transfer amount: 1.2 times the
    schedule's returned payment fee when two or more written disconnection notices were served on the closed agreement
    in the 12 calendar months before the transfer, 0.6 times that fee when exactly one was, and nothing when none
    was. The transfer amount is the closed agreement's balance less the forgiven late payment charges, plus the
    carried late payment charge, plus the collection recovery, rounded to the cent; the closed agreement's schedule
    supplies every rate, fee and period used. Every count or sum over a stated number of calendar months before
    a posting takes the records dated less than that many whole calendar months before the posting date.
  prerequisite: []
  cross_category: []
  compute:
  - closed_bills_total: SUM('service_bills', 'amount')
  - closed_charges_total: SUM('service_charges', 'amount')
  - closed_credits_total: SUM('service_credits', 'amount')
  - closed_balance: closed_bills_total + closed_charges_total - closed_credits_total
  - final_bill_amount: LATEST('service_bills', 'amount', date_field='bill_date', bill_kind='final')
  - final_unpaid: MN(final_bill_amount, MX(0, closed_balance))
  - final_due_date: LATEST('service_bills', 'due_date', date_field='bill_date', bill_kind='final')
  - final_bill_date: LATEST('service_bills', 'bill_date', date_field='bill_date', bill_kind='final')
  - closed_returns_12: >-
      COUNT('service_charges', within_months=12, date_field='posting_date', event_type='service_payment_reversal')
  - anchor_date: >-
      final_bill_date if closed_returns_12 >= K('one_return') else (F('stop_date') if DAYS(F('stop_date'), final_bill_date)
      >= K('late_final_days') else final_due_date)
  - days_since_anchor: DAYS(anchor_date, NOW)
  - carried_rate: >-
      P('late_payment_charge_rate') if days_since_anchor >= K('long_overdue_days') else (P('late_payment_charge_rate')
      * K('partial_rate_factor') if days_since_anchor >= K('mid_overdue_days') else 0)
  - carried_charge: RND(carried_rate * final_unpaid, 2)
  - closed_late_total: SUM('service_charges', 'amount', event_type='service_late_payment_charge')
  - closed_service_months: MONTHS(F('start_date'), F('stop_date'))
  - forgiven_share: >-
      K('full_forgiveness') if closed_service_months >= K('long_service_months') else (K('half_forgiveness') if
      closed_service_months >= K('mid_service_months') else 0)
  - closed_notices_12: COUNT('service_notices', within_months=12, date_field='notice_date', notice_type='written_notice')
  - collection_recovery: >-
      P('returned_payment_fee_usd') * K('two_notice_fee_factor') if closed_notices_12 >= K('two_notices') else (P('returned_payment_fee_usd')
      * K('one_notice_fee_factor') if closed_notices_12 >= K('one_notice') else 0)
  - result: RND(closed_balance - closed_late_total * forgiven_share + carried_charge + collection_recovery, 2)
