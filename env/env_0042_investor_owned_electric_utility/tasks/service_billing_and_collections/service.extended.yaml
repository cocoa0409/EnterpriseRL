    ladder:
    - when: three or more equipment-failure outage records at the address in the 12 months before posting
      value: 1.6 times the schedule's outage credit increment amount
    - when: exactly two such records in that period
      value: 1.2 times the schedule's outage credit increment amount
    - when: otherwise
      value: P('outage_credit_increment_usd')
    baseline:
