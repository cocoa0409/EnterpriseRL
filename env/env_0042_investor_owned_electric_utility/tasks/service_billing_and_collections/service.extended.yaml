# Electric Service Agreement — the rate-schedule contract under which Lakeshore Power & Light
# meters, bills and collects for one service address. Core ledger of the company: metered usage
# bills, fees, payments, credits, disconnection notices, disconnection and reconnection, outage
# records and outage credits.

category: service
display_name: Electric Service Agreement

binding:
  holding_table: service_accounts
  event_tables: [service_bills, service_charges, service_credits, service_notices, service_outages]
  intake_tables: [service_orders]
  status_field: status
  variant_field: variant_name
  quantity_fields: {account_balance: account_balance}

lifecycle:
  states: [pending_start, active, notice_pending, disconnected, closed]
  transitions:
    - {from: pending_start, to: active, by: system, means: The meter is energized and billing begins on the requested start date.}
    - {from: pending_start, to: closed, by: user, means: The customer confirms cancellation of a start order before the service is energized.}
    - {from: active, to: notice_pending, by: system, means: A written disconnection notice for nonpayment has been served on the account.}
    - {from: notice_pending, to: active, by: agent, means: The pending disconnection notice is rescinded because its grounds no longer hold.}
    - {from: notice_pending, to: disconnected, by: system, means: Service is disconnected for nonpayment under a valid notice.}
    - {from: disconnected, to: active, by: agent, means: A reconnection order is issued after the reconnection requirements are met.}
    - {from: active, to: closed, by: user, means: The customer confirms a stop-service order and the agreement is final-billed.}
    - {from: notice_pending, to: closed, by: user, means: The customer confirms a stop-service order while a disconnection notice is pending.}
    - {from: disconnected, to: closed, by: system, means: An account left disconnected beyond the closure period is final-billed and closed.}

accounts:
  - key: account_balance
    unit: USD
    meaning: Amount the customer owes on the service agreement; bills, fees and program debits raise it, payments and credits lower it, and a negative value is a credit balance.

parameter_schema:
  customer_charge_usd_month: Fixed monthly customer charge billed on every bill of the schedule, including first and final bills (not prorated), USD.
  summer_billing_months: Calendar months (two-digit, comma-separated) whose billing-period end date makes the bill a summer-season bill; all other bills are winter-season bills.
  energy_rate_summer_on_peak_usd_kwh: Energy rate for on-peak kWh on summer-season bills, USD per kWh, 5 decimals; flat schedules price every kWh at this rate in summer.
  energy_rate_summer_off_peak_usd_kwh: Energy rate for off-peak kWh on summer-season bills, USD per kWh, 5 decimals; equal to the on-peak rate on flat schedules.
  energy_rate_winter_on_peak_usd_kwh: Energy rate for on-peak kWh on winter-season bills, USD per kWh, 5 decimals; flat schedules price every kWh at this rate in winter.
  energy_rate_winter_off_peak_usd_kwh: Energy rate for off-peak kWh on winter-season bills, USD per kWh, 5 decimals; equal to the on-peak rate on flat schedules.
  energy_rate_super_off_peak_usd_kwh: Year-round energy rate for super off-peak kWh, USD per kWh, 5 decimals; 0.00000 on schedules whose super_off_peak_hours is none.
  on_peak_hours: Clock window in which metered kWh are billed as on-peak, or none for flat schedules where every kWh is billed at the season rate.
  super_off_peak_hours: Clock window in which metered kWh are billed as super off-peak, or none when the schedule has no super off-peak period.
  inclining_block_threshold_kwh: Monthly kWh after which the inclining-block adder applies to non-electric-heat accounts and to all summer bills; 0 means the schedule has no inclining block.
  inclining_block_threshold_electric_heat_kwh: Monthly kWh after which the inclining-block adder applies on winter bills of accounts whose space heating is electric; 0 means no inclining block.
  inclining_block_adder_usd_kwh: Adder charged on each kWh above the inclining-block threshold, USD per kWh, 5 decimals; 0.00000 means no inclining block.
  demand_charge_usd_kw: Charge per kW of billing demand, USD per kW; 0.00 means the schedule bills no demand charge.
  demand_ratchet_pct: Share of the highest measured demand of the preceding 11 billing periods below which billing demand may not fall, decimal fraction; 0.00 means no ratchet.
  minimum_billing_demand_kw: Floor on billing demand, kW; 0 means no floor.
  power_supply_adjustment_usd_kwh: Power Supply Cost Recovery factor charged on every billed kWh, USD per kWh, 5 decimals.
  primary_voltage_discount_pct: Discount on energy and demand charges for accounts served at primary voltage, decimal fraction; 0.000 means no primary discount on the schedule.
  bill_due_days: Calendar days from the bill date to the due date printed on the bill.
  late_payment_grace_days: Calendar days after the due date before a late payment charge may be posted.
  late_payment_charge_rate: Late payment charge as a one-time fraction of the unpaid portion of a bill, decimal fraction.
  late_payment_charge_minimum_usd: Minimum late payment charge per bill when a charge applies, USD.
  late_charge_courtesy_waivers_per_12_months: Number of late payment charges that may be waived as a courtesy within any rolling 12 months; 0 means no courtesy waiver.
  late_charge_courtesy_clean_months: Months before the waived charge's posting date that must contain no other late payment charge and no returned payment for the courtesy waiver.
  returned_payment_fee_usd: Fee posted when a payment is returned unpaid by the customer's bank, USD.
  returned_payment_restriction_count: Number of returned payments within the restriction look-back after which check and bank-draft payments are refused.
  returned_payment_restriction_months: Length of both the returned-payment look-back and the resulting check/bank-draft refusal, months.
  disconnect_min_past_due_usd: Minimum past-due balance for which a written disconnection notice may be issued, USD.
  disconnect_min_past_due_days: Minimum days past the due date of the oldest unpaid bill before a written disconnection notice may be issued.
  written_notice_days: Calendar days from the written notice date to the earliest date service may be disconnected.
  final_notice_hours: Minimum hours before disconnection by which the final notice (phone call or door hanger) must be delivered.
  notice_validity_days: Calendar days after the earliest disconnect date during which the written notice remains valid for disconnection.
  winter_moratorium_applies: Whether electric-heat accounts on the schedule are protected from disconnection for nonpayment during the winter moratorium period (true/false).
  winter_moratorium_period: Calendar window (MM-DD through MM-DD, inclusive) of the winter disconnection moratorium.
  disconnection_prohibited_days: Days on which no disconnection for nonpayment may be performed on the schedule.
  reconnection_fee_remote_usd: Reconnection charge when service is restored remotely through a remote-switch-capable meter, USD.
  reconnection_fee_field_standard_usd: Reconnection charge when a field crew restores service during standard reconnection hours, USD.
  reconnection_fee_field_after_hours_usd: Reconnection charge when the customer elects same-day field restoration outside standard reconnection hours, USD.
  reconnection_standard_hours: Clock window in which reconnection orders are worked at the standard charge.
  reconnection_payment_basis: Amount that must be paid before a disconnected account is reconnected without an arrangement or protection, enum past_due_balance or total_balance.
  disconnected_closure_days: Calendar days an account may remain disconnected before it is final-billed and closed.
  outage_credit_min_hours: Minimum continuous outage duration at the service address that qualifies for a sustained-outage credit, hours.
  outage_credit_base_usd: Sustained-outage credit for an outage reaching the minimum duration, USD.
  outage_credit_increment_usd: Additional credit for each full increment of outage duration beyond the minimum, USD.
  outage_credit_increment_hours: Length of one outage-duration increment, hours.
  outage_credit_cap_usd: Maximum sustained-outage credit for a single outage, USD.
  outage_credit_claim_window_days: Calendar days after restoration within which the outage credit must be requested.
  outage_major_event_excluded: Whether outages recorded on a declared major event day are excluded from outage credits (true/false).
  chronic_outage_count_threshold: Number of outage records at the service address within a rolling 12 months at which the chronic-outage credit is earned.
  chronic_outage_credit_usd: Chronic-outage credit, USD, paid at most once per rolling 12 months.
  rate_change_lockout_months: Months that must pass after a schedule takes effect before the customer may choose another schedule.
  tou_bill_protection_months: Months after joining the schedule during which time-of-use charges are compared with the base flat schedule and any excess credited; 0 means no bill protection.
  connection_charge_usd: One-time charge for establishing a new service agreement, USD.
  stop_notice_min_business_days: Business days that must separate the stop-service request date from the stop effective date.
  final_bill_issue_business_days: Business days after the stop effective date within which the final bill is issued.
  credit_refund_minimum_usd: Smallest credit balance on a closed agreement that is refunded by check; smaller balances are written off to the customer's benefit only on request, USD.
  prior_balance_transfer_after_days: Calendar days after a final bill's due date after which its unpaid balance is transferred to another open agreement of the same customer.

