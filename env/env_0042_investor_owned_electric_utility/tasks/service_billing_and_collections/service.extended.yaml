- id: service_ext_auto_sustained_outage_credit
  base_policy_refs:
  - service_outage_credit_rule
  - service_chronic_outage_credit
  overwrite:
  - base_policy: service_outage_credit_rule
    superseded_clause: >-
      A sustained-outage credit (credit_code sustained_outage) is granted on the customer's request for an outage
      record at the service address whose duration_hours is at least the schedule's outage_credit_min_hours.
    replaced_by: >-
      A sustained-outage credit is posted to the agreement, without waiting for the customer to ask, for the most
      recent outage record at its service address once that record qualifies.
  - base_policy: service_outage_credit_rule
    superseded_clause: >-
      The credit is outage_credit_base_usd plus outage_credit_increment_usd for each full outage_credit_increment_hours
      by which the duration exceeds the minimum, capped at outage_credit_cap_usd.
    replaced_by: >-
      The base amount of the sustained-outage credit is one and a half times the schedule's outage credit base amount
      when the record's cause is equipment failure or vegetation, one and a quarter times it when the cause is animal
      contact or a vehicle accident, and the schedule's outage credit base amount for any other cause.
  trigger: state_due
  subject:
  - service_outage_credit
  computes: amount
  target_tool: grant_sustained_outage_credit_20084a33
  params:
    hourly_interval_minutes: 60
    quarter_hour_interval_minutes: 15
    assisted_payments_high: 2
    assisted_payments_low: 1
    two_assist_min_hours_factor: 0.5
    one_assist_min_hours_factor: 0.75
    frequent_outage_records: 5
    repeated_outage_records: 3
    frequent_increment_factor: 0.25
    repeated_increment_factor: 0.5
    controllable_base_factor: 1.5
    third_party_base_factor: 1.25
    repeat_failure_records: 3
    second_failure_records: 2
    repeat_failure_increment_factor: 1.6
    second_failure_increment_factor: 1.2
    long_tenure_months: 120
    mid_tenure_months: 60
    long_tenure_cap_factor: 1.3
    mid_tenure_cap_factor: 1.15
  rule: >-
    A sustained-outage credit is posted to the agreement, without waiting for the customer to ask, for the most
    recent outage record at its service address once that record qualifies. An outage record does not qualify when
    it began on a major event day while the schedule excludes major event days, when its recorded cause is customer
    equipment, or when its recorded cause is planned maintenance or a public safety shutoff, both of which are announced
    in advance. The qualifying duration of the record is its recorded duration in hours. The record qualifies when
    its qualifying duration is at least the schedule's minimum outage credit duration. The sustained-outage credit
    is the schedule's outage credit base amount plus the schedule's outage credit increment amount for each full
    increment of the schedule's outage credit increment hours by which the qualifying duration exceeds the minimum
    duration, and that sum is then limited to the schedule's outage credit cap. The number of full increments is
    the excess hours divided by the increment hours, rounded down to a whole number, and only the final credit is
    rounded to the cent. No sustained-outage credit is posted for a record that does not qualify. Where the meter
    in service at the premise records interval data in 60-minute intervals, the qualifying duration is the recorded
    duration rounded up to the next whole hour, because the meter's restoration message only marks the hour; where
    it records 15-minute intervals, the qualifying duration is the recorded duration rounded up to the next quarter
    hour; for any other meter the qualifying duration is the recorded duration. The minimum duration for the sustained-outage
    credit is half of the schedule's minimum outage credit duration when the agreement received two or more payments
    from an energy assistance agency in the 12 calendar months before the credit is posted, three quarters of that
    minimum when it received exactly one such payment, and the schedule's minimum outage credit duration when it
    received none. The increment hours for the sustained-outage credit are one quarter of the schedule's outage
    credit increment hours when five or more outage records at the service address began in the 12 calendar months
    before the credit is posted, half of those increment hours when three or four records began in that period,
    and the schedule's outage credit increment hours when two or fewer began. The base amount of the sustained-outage
    credit is one and a half times the schedule's outage credit base amount when the record's cause is equipment
    failure or vegetation, one and a quarter times it when the cause is animal contact or a vehicle accident, and
    the schedule's outage credit base amount for any other cause. The increment amount of the sustained-outage credit
    is 1.6 times the schedule's outage credit increment amount when three or more outage records at the service
    address recorded as equipment failure began in the 12 calendar months before the credit is posted, 1.2 times
    it when exactly two did, and the schedule's outage credit increment amount when one or none did. The cap on
    the sustained-outage credit is 1.3 times the schedule's outage credit cap for an agreement in service 120 whole
    calendar months or more since its start date, 1.15 times that cap for one in service at least 60 but fewer than
    120 months, and the schedule's outage credit cap for one in service fewer than 60 months. Every count or sum
    over a stated number of calendar months before a posting takes the records dated less than that many whole calendar
    months before the posting date.
  prerequisite: []
  cross_category:
  - category: meter
    as: branch
    reads:
    - status
    - variant_name
    note: >-
      The interval length of the meter in service at the premise (a tier parameter of its meter type) decides how
      the qualifying duration is measured.
  compute:
  - dur_recorded: LATEST('service_outages', 'duration_hours', date_field='outage_start')
  - cause_recorded: LATEST('service_outages', 'cause', date_field='outage_start')
  - major_event_recorded: LATEST('service_outages', 'major_event_day', date_field='outage_start')
  - meter_interval_minutes: CPARAM('meter', 'interval_length_minutes', status='in_service')
  - qualifying_duration: >-
      (int(dur_recorded) + (1 if dur_recorded > int(dur_recorded) else 0)) if meter_interval_minutes == K('hourly_interval_minutes')
      else ((int(dur_recorded * 4) + (1 if dur_recorded * 4 > int(dur_recorded * 4) else 0)) / 4 if meter_interval_minutes
      == K('quarter_hour_interval_minutes') else dur_recorded)
  - assistance_payments_12: >-
      COUNT('service_credits', within_months=12, date_field='posting_date', event_type='service_payment', payment_channel='energy_assistance_agency')
  - min_duration: >-
      P('outage_credit_min_hours') * K('two_assist_min_hours_factor') if assistance_payments_12 >= K('assisted_payments_high')
      else (P('outage_credit_min_hours') * K('one_assist_min_hours_factor') if assistance_payments_12 >= K('assisted_payments_low')
      else P('outage_credit_min_hours'))
  - outage_records_12: COUNT('service_outages', within_months=12, date_field='outage_start')
  - increment_hours: >-
      P('outage_credit_increment_hours') * K('frequent_increment_factor') if outage_records_12 >= K('frequent_outage_records')
      else (P('outage_credit_increment_hours') * K('repeated_increment_factor') if outage_records_12 >= K('repeated_outage_records')
      else P('outage_credit_increment_hours'))
  - base_credit: >-
      P('outage_credit_base_usd') * K('controllable_base_factor') if (cause_recorded == 'equipment_failure' or cause_recorded
      == 'vegetation') else (P('outage_credit_base_usd') * K('third_party_base_factor') if (cause_recorded == 'animal_contact'
      or cause_recorded == 'vehicle_accident') else P('outage_credit_base_usd'))
  - equipment_failures_12: COUNT('service_outages', within_months=12, date_field='outage_start', cause='equipment_failure')
  - increment_credit: >-
      P('outage_credit_increment_usd') * K('repeat_failure_increment_factor') if equipment_failures_12 >= K('repeat_failure_records')
      else (P('outage_credit_increment_usd') * K('second_failure_increment_factor') if equipment_failures_12 >=
      K('second_failure_records') else P('outage_credit_increment_usd'))
  - months_in_service: MONTHS(F('start_date'), NOW)
  - credit_cap: >-
      P('outage_credit_cap_usd') * K('long_tenure_cap_factor') if months_in_service >= K('long_tenure_months') else
      (P('outage_credit_cap_usd') * K('mid_tenure_cap_factor') if months_in_service >= K('mid_tenure_months') else
      P('outage_credit_cap_usd'))
  - qualifies: >-
      1 if (qualifying_duration >= min_duration and not (major_event_recorded == True and P('outage_major_event_excluded')
      == True) and cause_recorded != 'customer_equipment' and cause_recorded != 'planned_maintenance' and cause_recorded
      != 'public_safety_shutoff') else 0
  - full_increments: int((qualifying_duration - min_duration) / increment_hours) if qualifies == 1 else 0
  - result: RND(MN(credit_cap, base_credit + increment_credit * full_increments), 2) if qualifies == 1 else 0
