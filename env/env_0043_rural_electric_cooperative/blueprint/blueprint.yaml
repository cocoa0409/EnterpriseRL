name: env_0043_rural_electric_cooperative
company: Cedar Fork Electric Cooperative, Inc.

background: |
  Cedar Fork Electric Cooperative, Inc. is a member-owned rural electric distribution cooperative headquartered in Harlan Springs that serves about 41,300 meters over 6,840 miles of line across eleven mostly agricultural counties, buying its wholesale power from Prairie Plains Power Cooperative, its generation and transmission supplier.
  Its member services center answers the phones, the SmartHub app and two walk-in district offices in a plain, neighborly tone, and it speaks of members, never customers, because everyone it serves owns a share of the cooperative.
  Every metered location a member holds is an Electric Service by Rate Schedule account on one of seven schedules: Schedule R Residential Service, Schedule RS Seasonal Residential Service, Schedule FH Farm and Home Service, Schedule GS-1 Single-Phase General Service, Schedule GS-3 Three-Phase General Service, Schedule IR Irrigation Service and Schedule LP Large Power Service, each billed monthly in usage lines, fees, payments, credits, outage and trouble reports, meter tests and medical certificates.
  Members who prefer to pay as they go can run a meter on PrePay Power (Prepaid Metering) as PrePay Power Residential, PrePay Power Residential Recovery 25, PrePay Power Residential Recovery 40, PrePay Power Seasonal, PrePay Power Outbuilding or PrePay Power Small Commercial, where the prepaid balance is drawn down by daily charges, refilled by payments and watched by low-balance alerts.
  Budget Billing (Levelized and Equal Payment Plans) levels a single account's bills as Levelized Billing Rolling Average, Budget Billing Annual Settle-Up, Budget Billing Quarterly Review, Farm Budget Billing, Small Business Budget Billing or the Ten-Month Equal Payment Plan, carrying a deferred balance between actual charges and installments.
  Security Deposits secure service accounts as the Residential Standard Deposit, Residential Credit Reestablishment Deposit, Seasonal Residence Deposit, Farm Service Deposit, General Service Deposit or Irrigation and Large Power Deposit, each record holding cash that is paid in, earns interest and is eventually refunded or applied.
  Payment Arrangements (Deferred Payment Agreements) spread a past-due amount as a Standard Deferred Payment Agreement, Extended Hardship Payment Agreement, Winter Protection Payment Agreement, Medical Certificate Payment Agreement, Agricultural Harvest Payment Agreement or Commercial Installment Agreement, each installment being billed back on the member's monthly bill.
  Because the cooperative is owned by its members, its margins are allocated every year to Capital Credits (Patronage Capital) accounts in the Residential Patron Class, Seasonal Patron Class, Farm Patron Class, General Service Patron Class, Irrigation Patron Class and Large Power Patron Class, and are later retired to members, former members and estates by bill credit or check.
  Area and Security Lighting Rental puts cooperative-owned dusk-to-dawn fixtures on farmyards, shops and church lots as the LED 40W Security Light, LED 70W Area Light, LED 110W Flood Light and LED 150W Flood Light, with the legacy HPS 100W Security Light, HPS 250W Flood Light and Mercury Vapor 175W Security Light still burning on older poles, the rentals billed on a service account.
  Line Extensions and New Service Construction brings power to new homes, bins, pivots and businesses as a Permanent Residential Overhead Extension, Permanent Residential Underground Extension, Seasonal Residence Extension, Farm and Ranch Extension, Irrigation Well Extension, Three-Phase Commercial Extension or Temporary Construction Service, each project carrying its estimate, contribution and payments.
  Most callers are residential and farm households, many of them multi-generation members whose names have been on the books since the 1970s, holding a home meter on Schedule R or Schedule FH, often a second meter for a shop or well, a security light, years of capital credit allocations and a deposit or budget plan.
  Grain and livestock operators bring several meters at once, typically a farm home, three-phase bin sites and one or more irrigation pivots that sit idle over the winter, while lake-country cabin owners hold seasonal accounts that they idle and restore with the seasons.
  Small businesses, churches, township halls and a few large power members such as grain elevators and an ethanol plant round out the membership.
  Members call about high bills and usage lines, late charges and returned payments, outages and blinking lights, disconnect notices and reconnections, energy assistance pledges and medical certificates, prepaid balances running low, deposits they want back, arrangements they need, a parent's capital credits after a death, and the cost of bringing a line to a new building site.
  Their records carry that history: years of monthly bills and payments, an occasional disconnect notice or reconnection, prior arrangements kept or broken, deposits paid in installments, capital credit allocations stretching back decades, and outage reports tied to storm incident numbers.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoffs

difficulties:
  - name: electric_service_billing_and_trouble
    claim:
      categories: [service]
      event_types: [service_usage_charge, service_late_charge, service_fee, service_bill_credit, service_payment, service_payment_return, service_assistance_pledge, service_cash_only_flag, service_notice_cleared, service_reconnect, service_outage_report, service_trouble_resolution, service_meter_test, service_medical_certificate, service_certificate_update, service_seasonal_idle, service_seasonal_restore]
    summary: >-
      Callers are members on any of the seven rate schedules - a Schedule R household with a high bill, a Schedule FH farm with
      a shop meter, a Schedule RS cabin owner idling for winter, a Schedule GS-3 bin site or a Schedule LP elevator with a demand
      ratchet - asking why a bill came out as it did, disputing a late charge or a fee, reporting an outage or blinking lights,
      asking for a meter test, filing a medical certificate, reporting an energy assistance pledge, or trying to stop a disconnect
      notice or get power restored; the setting varies with the schedule, the account's status from active through
      disconnect_pending and disconnected_nonpay to idle, the member's other meters, and the history of late charges, waivers,
      returned payments, member-side trouble calls, meter tests and certificates in the lookback windows. The records involved are
      the service account with its schedule, meter type, balance, notice and protection dates, the bill lines, payments, returns and
      pledges, the trouble and meter test reports, the certificates and the service orders, read together with the member's payment
      arrangements, PrePay Power enrollments and security deposits, and the rules are tiered by schedule: usage lines and minimums
      under service_evt_usage_billing and service_evt_minimum_bill, the late charge and its courtesy waiver under
      service_evt_late_charge, disconnect timing, medical protection and pledge holds under service_evt_disconnect_nonpay and
      service_evt_medical_certificate, reconnection conditions and fees under service_evt_reconnect, returned payments and cash-only
      status under service_evt_returned_payment, trouble call charges under service_evt_trouble_calls, meter tests and refunds under
      service_evt_meter_test, and seasonal idles under service_evt_seasonal_idle, with the background order of the business being
      bill, due date, late charge, notice, disconnection and reconnection. The agent, once the caller is verified, explains and
      posts the bill lines, fees, credits, waivers, payments, pledges, reports, certificates and status changes the rules entail,
      while a stop-service or seasonal order and any decision about a member's own money or obligations is the member's own to
      confirm. No published rule decides a request to forgive or partly reduce a balance on hardship grounds, compensation for
      spoiled food or damaged equipment after an outage, a request to relocate a meter or pole on the member's property, or a
      dispute over who owns a line or pole, so those leave a POLICY_NOT_COVERED transfer as the only correct route.
  - name: prepay_power_enrollment_and_balances
    claim:
      categories: [prepay]
      event_types: [prepay_enroll, prepay_arrears_transfer, prepay_deposit_credit, prepay_credit_adjustment, prepay_payment, prepay_arrears_recovery, prepay_alert_settings, prepay_tier_change, prepay_convert, prepay_refund, prepay_arrears_return]
    summary: >-
      Callers are members who want to move a meter onto PrePay Power, often because a disconnect notice is pending or old balances
      from a finaled account are blocking them, members already on prepay whose balance is running low, whose payment did not seem
      to reach the balance, or who want to change their alerts, and members who want to leave prepay and return to standard billing;
      the setting varies with the underlying rate schedule and meter type, the member type, the size of the arrears across the
      member's whole portfolio, any deposit held, budget plan or arrangement on the meter, medical certificate protection, and the
      enrollment's own history of payments, recoveries, disconnections and alerts. The records involved are the prepay account with
      its prepaid and arrears balances, its ledger and notifications, the member's prepay requests, the service accounts and their
      balances, the deposit records and the arrangement and budget records, and the governing rules are the tier bands and arrears
      basis of prepay_agg_member_arrears, the entry conditions of prepay_enrollment_eligibility, the deposit and credit handling of
      prepay_evt_enrollment_transfers, the per-tier payment split of prepay_evt_payment_split, the alert limits of prepay_evt_alerts,
      the disconnect windows of prepay_evt_disconnect_reconnect, the payoff move of prepay_evt_tier_change and the exit conditions
      of prepay_evt_conversion and prepay_evt_closing, the natural order of the domain being enrollment, transfers of deposit and
      arrears, activation, daily charges and payments, and finally conversion or closing. The agent takes the enrollment, moves the
      arrears and deposit, posts payments, corrections and alert changes and carries out a conversion the rules allow, while signing
      the PrePay Power agreement and deciding to leave the program are the member's own acts that the agent hands over. No published
      rule decides a request to forgive or write off transferred arrears, to send prepaid funds that an agency paid back to that
      agency, or a dispute over a payment the member says was made at a retailer but never posted, so those leave a
      POLICY_NOT_COVERED transfer as the only correct route.
  - name: capital_credit_retirements
    claim:
      categories: [capital]
      event_types: [capital_estate_claim, capital_estate_withdraw, capital_special_retirement, capital_payable_accrual, capital_disbursement, capital_check_void, capital_donation_election]
    summary: >-
      Callers are members asking what capital credits they have and why a retirement did or did not arrive, former members asking for
      a discounted early retirement, executors, administrators and small-estate affiants calling after a member's death, members
      whose capital credit check went stale, was lost or came back undeliverable, and members who want to donate future payouts; the
      setting varies with the patron class, the account's status from active through inactive to estate_claim_pending, the member
      type and whether a joint member survives, the date of death and of inactivity, the allocation years and sources still
      unretired, the board resolutions already paid, the documents on file, and any unpaid final-billed balance on the member's
      service accounts. The records involved are the member profile with its date of death, the capital accounts with unretired and
      payable balances, the capital ledger of allocations, retirements, payables, payouts, voids and escheats, the capital requests
      with claimant and documents, and the service accounts that may be offset, and the governing rules are the payout assembly and
      minimums of capital_agg_member_payout, the board resolutions of capital_evt_general_retirement, the estate conditions,
      discounting and offset of capital_evt_estate_retirement, the inactivity window and discount of capital_evt_early_retirement,
      the stale, reissue and escheat rules of capital_evt_checks and the election rule of capital_evt_donation, the natural order of
      the domain being allocation, retirement, payable, offset and payout. The agent takes estate claims, books the special
      retirements and payables the rules entail, makes offsets and payouts, voids and reissues checks and records elections, while
      submitting the estate's documents and choosing to donate are the claimant's or member's own acts handed over to them. No
      published rule decides a request to assign capital credits to an heir outside an estate, to split a joint membership's credits
      on divorce, to pay an estate's retirement directly to one heir instead of the estate, a creditor's or bankruptcy trustee's claim
      on a member's credits, or a dispute over the patronage amount allocated for a past year, so those leave a POLICY_NOT_COVERED
      transfer as the only correct route.
  - name: security_deposit_lifecycle
    claim:
      categories: [deposit]
      event_types: [deposit_assess, deposit_payment, deposit_partial, deposit_paid_full, deposit_waive, deposit_interest_accrual, deposit_interest_payout, deposit_refund, deposit_release, deposit_apply_balance, deposit_apply_prepay, deposit_applied, deposit_transfer, deposit_cancel]
    summary: >-
      Callers are new members told a deposit is due, members reconnecting after a nonpayment disconnection, members with a letter from
      a previous utility or a good record on another Cedar Fork meter asking for a waiver, members asking when their deposit comes back
      and with how much interest, members moving within the territory, members enrolling in PrePay Power, and businesses offering a bond
      or letter of credit; the setting varies with the rate schedule and therefore the deposit tier, the assessment basis, the
      location's billing history and transformer size, the deposits already on the meter, the installments paid, the years of interest,
      and the late charges, returned payments and reconnections in the review window. The records involved are the deposit records with
      required, held and interest amounts, the deposit ledger of payments, accruals, payouts, refunds and applications, the service
      accounts with their bills, late charges, returns and fees, and the PrePay Power enrollment, and the governing rules are the tiered
      amount and basis of deposit_evt_assessment with the ceiling and netting of deposit_agg_service_total, the grounds of
      deposit_evt_waiver, the installments of deposit_evt_payments, the yearly rates and day counting of deposit_evt_interest, the review
      of deposit_evt_refund, the order of deposit_evt_application, the conditions of deposit_evt_transfer and the growth test of
      deposit_evt_reassessment, the natural order being assessment, payment, interest, and finally refund, application or transfer. The
      agent assesses, waives, posts, accrues, refunds, applies and transfers deposits as the rules entail, while the decision to ask for
      a check instead of a bill credit or to move a deposit to a new location is the member's own to confirm. No published rule decides
      a request to move a deposit to a different member such as a tenant or a buyer of the property, a claim that a deposit was paid
      in cash years ago with no record on file, or a request for interest on a surety bond or letter of credit, so those leave a
      POLICY_NOT_COVERED transfer as the only correct route.
  - name: payment_arrangement_agreements
    claim:
      categories: [arrange]
      event_types: [arrange_offer, arrange_accept, arrange_expire, arrange_balance_transfer, arrange_installment_bill, arrange_installment_missed, arrange_default, arrange_balance_rebill, arrange_complete, arrange_terminate]
    summary: >-
      Callers are members behind on a bill - a household facing a disconnect notice, a member already disconnected, a family with an
      energy assistance pledge on file, a household under medical certificate protection, a winter caller, a farmer who will pay at
      harvest, or a business owner - asking to spread the past-due amount, as well as members who missed an installment, want to pay an
      agreement off early, or are moving or switching to prepay; the setting varies with the rate schedule and member type, the service
      account's status and tenure, the past-due amount against the current charges not yet due, the time of year, open pledges and
      medical protection, the member's agreements accepted on the account and defaulted anywhere in the portfolio, and the agreement's
      own installment history. The records involved are the arrangements with past due, down payment, arranged amount and installments,
      the arrangement ledger of transfers, installments, misses and rebills, the service accounts with their bills, payments, pledges,
      notices and certificates, and the member's PrePay Power and Budget Billing records, and the governing rules are the portfolio
      history test of arrange_agg_member_history, the tier entry conditions of arrange_eligibility, the per-tier down payment and
      installment terms of arrange_evt_terms, the acceptance window of arrange_evt_acceptance, the installment billing of
      arrange_evt_installments, the default count of arrange_evt_default, and the payoff and termination rules of arrange_evt_completion
      and arrange_evt_termination, the natural order being offer, down payment, acceptance, installments, and completion, default or
      termination. The agent computes and offers the terms, books the transfers, installments, misses, rebills and status changes the
      rules entail, while accepting the agreement is the member's own commitment that the agent hands over. No published rule decides a
      relative's or landlord's offer to sign the agreement in the member's place, a member in bankruptcy asking to arrange debt from
      before the filing, or a request to settle a past-due amount for less than its full amount, so those leave a POLICY_NOT_COVERED
      transfer as the only correct route.
