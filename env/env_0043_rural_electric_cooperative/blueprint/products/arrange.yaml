category: arrange
display_name: Payment Arrangements (Deferred Payment Agreements)

binding:
  holding_table: arrangements
  event_tables: [arrange_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {arranged_balance: arrangement_balance}

lifecycle:
  states: [offered, active, completed, defaulted, expired, terminated]
  transitions:
    - {from: offered, to: active, by: user, means: The member accepts the offered terms through an accepted acceptance method after the down payment has posted.}
    - {from: offered, to: expired, by: system, means: The offer was not accepted within the acceptance window and lapses.}
    - {from: active, to: completed, by: system, means: Every installment has been billed and the arranged balance is zero, or the member paid it off early.}
    - {from: active, to: defaulted, by: system, means: Missed installments reached the default count and the unbilled balance is billed back as immediately due.}
    - {from: active, to: terminated, by: system, means: The service account was final billed or enrolled in PrePay Power and the unbilled balance is billed back.}

accounts:
  - key: arrangement_balance
    unit: USD
    meaning: Past-due amount moved off the regular bill into the agreement and not yet billed back as installments; in = the balance transfer at acceptance, out = installments billed and the unbilled remainder billed back at payoff, default or termination.

parameter_schema:
  eligible_rate_schedules: Entry - official rate schedule names of service accounts the agreement may be offered on; list.
  eligible_member_types: Entry - member_type values that may take the agreement; list.
  arrangeable_service_statuses: Entry - service account statuses in which the agreement may be offered; list.
  min_past_due: Entry - smallest past-due amount for which the agreement is offered, USD.
  max_arranged_amount: Entry - largest amount that may be arranged after the down payment, USD.
  down_payment_pct: Terms - percent of the past-due amount due as the down payment.
  down_payment_minimum: Terms - smallest down payment, USD (never more than the past-due amount).
  max_installments: Terms - most installments the arranged amount may be spread over; integer.
  min_installment_amount: Terms - smallest installment, USD; the installment count is reduced until each installment reaches it.
  installment_schedule: Terms - monthly = one installment on each bill; single_harvest_installment = the whole arranged amount billed on one harvest bill.
  harvest_installment_month: Terms - calendar month (1-12) whose billing period carries the single harvest installment.
  offer_window_start: Entry - first calendar day of each year on which the agreement may be offered, MM-DD.
  offer_window_end: Entry - last calendar day on which the agreement may be offered, MM-DD (a window crossing the new year runs from start through December 31 and January 1 through end).
  first_installment_offset_periods: Terms - billing periods after acceptance on which the first installment is billed (1 = the next bill).
  acceptance_window_days: Acceptance - calendar days after the offer within which the member must accept and the down payment must post.
  missed_installment_grace_days: Default - calendar days after a bill's due date within which an installment may still be paid before it counts as missed.
  missed_installments_before_default: Default - missed installments that put the agreement in default; integer.
  current_bill_must_be_paid: Default - whether the current charges of each bill must also be paid with the installment for the installment to count as paid; boolean.
  late_charges_on_arranged_balance: Charges - whether late charges accrue on the unbilled arranged balance; boolean.
  late_charge_on_missed_installment: Charges - whether a billed installment left unpaid past due is subject to the ordinary late charge; boolean.
  arrangements_per_12_months: Frequency - agreements of any tier that may be accepted on one service account in a rolling 12 months; integer.
  prior_default_lookback_months: Frequency - months over which the member's defaulted agreements are counted; integer.
  prior_defaults_allowed: Frequency - most defaulted agreements the member may have in the lookback; integer.
  assistance_pledge_required: Entry - whether an energy assistance pledge must have been recorded on the service account; boolean.
  assistance_pledge_lookback_days: Entry - calendar days before the offer within which the pledge must have been recorded; integer.
  pledge_counts_toward_down_payment: Terms - whether an open energy assistance pledge counts toward the down payment; boolean.
  medical_certificate_required: Entry - whether the service account must be under unexpired medical certificate protection; boolean.
  disconnect_hold_while_active: Effect - whether disconnection for the arranged amount is held while the agreement is active and current; boolean.
  reconnect_on_acceptance: Effect - whether acceptance qualifies a disconnected account for reconnection; boolean.
  notice_cleared_on_acceptance: Effect - whether acceptance clears an outstanding disconnect notice; boolean.
  early_payoff_allowed: Payoff - whether the member may pay the remaining arranged balance at any time; boolean.
  early_payoff_fee: Payoff - fee for early payoff, USD.
  renegotiation_allowed: Change - whether the terms of an active agreement may be changed; boolean.
  arrangement_fee: Charges - fee to set up the agreement, billed with the first installment, USD.
  include_current_charges: Terms - whether charges not yet past due may be placed in the agreement; boolean.
  final_billed_accounts_allowed: Entry - whether a final-billed account may be placed on the agreement; boolean.
  prepay_compatible: Combination - whether the agreement may coexist with a PrePay Power enrollment on the service account; boolean.
  budget_billing_compatible: Combination - whether the agreement may coexist with an active Budget Billing plan on the service account; boolean.
  max_active_per_service_account: Combination - agreements that may be offered or active on one service account at a time; integer.
  default_rebill_due_days: Default - calendar days after the default date by which the billed-back balance is due (0 = due on issue).
  disconnect_without_new_notice_on_default: Default - whether a defaulted account may be disconnected on the original notice without a new notice period; boolean.
  installment_rounding_rule: Terms - even_split_last_absorbs means each installment is the arranged amount divided by the count rounded to the cent and the last installment absorbs the cent difference.
  acceptance_methods_allowed: Acceptance - methods by which the member may accept; list of recorded_phone_consent, e_signature, signed_paper.
  counseling_referral_required: Entry - whether the member must be referred to the energy assistance counseling line when the agreement is offered; boolean.
  interest_rate_pct: Charges - interest charged on the arranged balance, percent per year.
  minimum_service_months: Entry - full calendar months the service account must have been connected before the agreement may be offered; integer.
  extra_payment_application: Payments - current_bill_then_next_installment means a payment above the bill due is applied to the current charges, then to the next installment billed.
  down_payment_channels: Acceptance - payment channels through which the down payment may be paid; list.

