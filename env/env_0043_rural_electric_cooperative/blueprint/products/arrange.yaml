events:
  - type: arrange_offer
    target: arrangements
    mutation: create
    meaning: The service desk offers the member a deferred payment agreement with stated terms on one service account.
    grain: One row per agreement offered.
    fields:
      customer_id: Member offered the agreement.
      service_account_id: Service account whose past-due amount is arranged.
      variant_name: Official agreement tier.
      offered_date: Date of the offer.
      past_due_amount: Past-due amount of the service account on the offer date.
      down_payment_amount: Down payment required.
      arranged_amount: Amount to be spread over installments (past due less down payment).
      installment_count: Number of installments.
      installment_amount: Amount of each installment but the last.
      first_installment_period: Billing period of the first installment, YYYY-MM.
    triggers: []
  - type: arrange_accept
    target: arrangements
    mutation: {transition: {from: offered, to: active}}
    meaning: The member accepts the offered terms.
    grain: One row per transaction on the agreement.
    fields:
      accepted_date: Date the member accepted.
      acceptance_method: How the member accepted.
    triggers:
      - event: arrange:arrange_balance_transfer
        map: {entry_date: accepted_date}
  - type: arrange_expire
    target: arrangements
    mutation: {transition: {from: offered, to: expired}}
    meaning: An offer not accepted within the acceptance window lapses.
    grain: One row per transaction on the agreement.
    fields:
      ended_date: Date the offer lapsed.
    triggers: []
  - type: arrange_balance_transfer
    target: arrange_ledger
    meaning: The arranged amount is moved off the service account's past-due balance into the agreement.
    grain: One row per accepted agreement.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date of the transfer (the acceptance date).
      amount: Arranged amount moved, positive.
    account: arrangement_balance
    direction: in
    triggers:
      - event: service:service_bill_credit
        map: {credit_reason: arrears_to_arrangement, charge_component: bill_credit, amount: amount, charge_date: entry_date, source_reference_id: arrangement_id}
  - type: arrange_installment_bill
    target: arrange_ledger
    meaning: One installment of the agreement is billed back on the service account's monthly bill.
    grain: One row per installment billed.
    distinguish_by: [installment_number]
    fields:
      entry_date: Bill date the installment was billed on.
      billing_period: Billing period of the bill.
      installment_number: Which installment this is.
      amount: Installment amount, positive.
    account: arrangement_balance
    direction: out
    triggers:
      - event: service:service_program_charge
        map: {charge_component: arrangement_installment, billing_period: billing_period, amount: amount, charge_date: entry_date, source_reference_id: arrangement_id}
  - type: arrange_installment_missed
    target: arrange_ledger
    meaning: A billed installment, or the current charges billed with it, was still unpaid when the grace period ended.
    grain: One row per installment missed.
    distinguish_by: [installment_number]
    fields:
      entry_date: Date the grace period ended unpaid.
      billing_period: Billing period of the installment.
      installment_number: Which installment was missed.
      amount: Unpaid part of the installment and current charges, positive.
    triggers: []
  - type: arrange_balance_rebill
    target: arrange_ledger
    meaning: The unbilled arranged balance is billed back on the service account at early payoff, default, PrePay Power enrollment or final billing.
    grain: One row per agreement ending with an unbilled balance.
    distinguish_by: [rebill_reason]
    fields:
      entry_date: Date billed back.
      rebill_reason: Why the balance was billed back.
      amount: Unbilled balance billed back, positive.
    account: arrangement_balance
    direction: out
    triggers:
      - event: service:service_program_charge
        map: {charge_component: arrangement_balance_rebill, amount: amount, charge_date: entry_date, source_reference_id: arrangement_id}
  - type: arrange_complete
    target: arrangements
    mutation: {transition: {from: active, to: completed}}
    meaning: The agreement is finished with every installment billed or the balance paid off early.
    grain: One row per transaction on the agreement.
    fields:
      ended_date: Date the agreement was completed.
    triggers: []
  - type: arrange_default
    target: arrangements
    mutation: {transition: {from: active, to: defaulted}}
    meaning: The agreement defaults on missed installments.
    grain: One row per transaction on the agreement.
    fields:
      ended_date: Date of the default.
    triggers:
      - event: arrange:arrange_balance_rebill
        map: {rebill_reason: default, entry_date: ended_date}
  - type: arrange_terminate
    target: arrangements
    mutation: {transition: {from: active, to: terminated}}
    meaning: The agreement ends because the service account was final billed or enrolled in PrePay Power.
    grain: One row per transaction on the agreement.
    fields:
      ended_date: Date the agreement ended.
      termination_reason: Final billing or PrePay Power enrollment.
    triggers:
      - event: arrange:arrange_balance_rebill
        map: {rebill_reason: termination_reason, entry_date: ended_date}

measures:
  - id: arrange_msr_past_due
    window: Point in time on the offer date, on the service account offered.
    measure: The service account's account_balance less the amount of service_charges rows of the latest billing period whose due date (bill date plus the schedule's bill_due_days) has not yet passed, and less any credit balance; never below zero.
  - id: arrange_msr_accepted_12m
    window: The 365 days ending on the offer date, on the same service account.
    measure: Count of agreements of the same service account whose accepted_date falls in the window.
  - id: arrange_msr_member_defaults
    window: The prior_default_lookback_months calendar months ending on the offer date, across every service account of the same member.
    measure: Count of agreements of the member in defaulted status whose ended_date falls in the window.
  - id: arrange_msr_missed_installments
    window: The life of the agreement.
    measure: Count of arrange_installment_missed rows of the agreement.
  - id: arrange_msr_open_pledges
    window: The assistance_pledge_lookback_days calendar days ending on the offer date, on the service account offered.
    measure: Sum of amount of service_assistance_pledge rows whose payment_date falls in the window, less energy_assistance_agency payments from the same agency posted on or after each pledge's date.

policies:
  - id: arrange_agg_multi_holding
    subject: [arrange_offer]
    rule: >-
      A member may hold agreements on several service accounts, each agreement covering the past-due amount of one service
      account only; past-due amounts of different service accounts are never combined into one agreement. A service account
      may carry at most max_active_per_service_account agreement in offered or active status at a time. The terms of an active
      agreement are never changed while it runs, because renegotiation_allowed is false; a member who cannot keep the
      agreement defaults and the default rules apply.
    eligibility:
      - id: one_open_agreement
        applies_to: [arrange_offer]
        kind: dedup
        condition: A service account may carry at most max_active_per_service_account agreement in offered or active status at a time.
        evidence_fields: [arrangements.service_account_id, arrangements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangements.service_account_id]
          action_bindings:
            arrangements.service_account_id: service_account_id
        dedup_contract:
          table: arrangements
          mode: separate_record
          object_bindings: {service_account_id: service_account_id}
          duplicate_filters: {status: [offered, active]}
          distinct_fields: []
    params:
      max_per_customer: null
  - id: arrange_agg_member_history
    subject: [arrange_offer]
    rule: >-
      Default history is read across the member's whole portfolio, while frequency is read per service account. An agreement
      may be offered only when arrange_msr_member_defaults is at most the tier's prior_defaults_allowed and
      arrange_msr_accepted_12m is below the tier's arrangements_per_12_months. A default on any of the member's service
      accounts counts against an offer on every other account of the same member. Expired offers count toward neither.
    eligibility:
      - id: history_within_limits
        applies_to: [arrange_offer]
        kind: authorization
        condition: An agreement may be offered only when arrange_msr_member_defaults is at most the tier's prior_defaults_allowed and arrange_msr_accepted_12m is below the tier's arrangements_per_12_months.
        evidence_fields: [arrangements.customer_id, arrangements.status, arrangements.ended_date, arrangements.accepted_date, arrangements.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangements.customer_id]
          action_bindings:
            arrangements.customer_id: customer_id
    params:
      per_tier:
        Standard Deferred Payment Agreement: {prior_defaults_allowed: "=prior_defaults_allowed", arrangements_per_12_months: "=arrangements_per_12_months"}
        Extended Hardship Payment Agreement: {prior_defaults_allowed: "=prior_defaults_allowed", arrangements_per_12_months: "=arrangements_per_12_months"}
        Winter Protection Payment Agreement: {prior_defaults_allowed: "=prior_defaults_allowed", arrangements_per_12_months: "=arrangements_per_12_months"}
        Medical Certificate Payment Agreement: {prior_defaults_allowed: "=prior_defaults_allowed", arrangements_per_12_months: "=arrangements_per_12_months"}
        Agricultural Harvest Payment Agreement: {prior_defaults_allowed: "=prior_defaults_allowed", arrangements_per_12_months: "=arrangements_per_12_months"}
        Commercial Installment Agreement: {prior_defaults_allowed: "=prior_defaults_allowed", arrangements_per_12_months: "=arrangements_per_12_months"}
    measures: [arrange_msr_member_defaults, arrange_msr_accepted_12m]
  - id: arrange_eligibility
    subject: [arrange_offer]
    rule: >-
      The tier is the one whose eligible_rate_schedules include the service account's rate schedule and whose
      eligible_member_types include the member's member_type, and whose remaining entry conditions hold; where several tiers
      fit, the member chooses among them. The service account's status must be one of the tier's arrangeable_service_statuses
      on the offer date. An agreement may be offered only after minimum_service_months full calendar months have passed since
      the service account was connected. Calendar months are counted from the connect_date to the same day number of the
      later month, falling back to the last day of that month when the day number does not exist. The offer date must fall
      inside the tier's offer window from offer_window_start through offer_window_end. The past-due amount
      (arrange_msr_past_due) must be at least min_past_due, and after the down payment no more than max_arranged_amount. Where
      assistance_pledge_required is true an energy assistance pledge must have been recorded within
      assistance_pledge_lookback_days; where medical_certificate_required is true the service account's
      medical_certificate_expires must be on or after the offer date. Because prepay_compatible and budget_billing_compatible
      are false, an account enrolled in PrePay Power or on an active Budget Billing plan cannot be offered an agreement, and
      because final_billed_accounts_allowed is false a final-billed balance is never arranged. Where
      counseling_referral_required is true the member is given the energy assistance counseling line with the offer.
    eligibility:
      - id: service_status_arrangeable
        applies_to: [arrange_offer]
        kind: state
        condition: The service account's status must be one of the tier's arrangeable_service_statuses on the offer date.
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active, disconnect_pending, disconnected_nonpay]
      - id: minimum_service_tenure
        applies_to: [arrange_offer]
        kind: time
        condition: An agreement may be offered only after minimum_service_months full calendar months have passed since the service account was connected.
        evidence_fields: [service_accounts.connect_date, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the service account was connected
          anchor_source: service_accounts.connect_date
          relation: not_before
          duration_source: variants.minimum_service_months
          unit: calendar_months
          counting_rule: Calendar months are counted from the connect_date to the same day number of the later month, falling back to the last day of that month when the day number does not exist.
          boundary: inclusive
      - id: no_prepay_or_budget
        applies_to: [arrange_offer]
        kind: authorization
        condition: Because prepay_compatible and budget_billing_compatible are false, an account enrolled in PrePay Power or on an active Budget Billing plan cannot be offered an agreement, and because final_billed_accounts_allowed is false a final-billed balance is never arranged.
        evidence_fields: [prepay_accounts.service_account_id, prepay_accounts.status, budget_plans.service_account_id, budget_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prepay_accounts.service_account_id, budget_plans.service_account_id]
          action_bindings:
            prepay_accounts.service_account_id: service_account_id
            budget_plans.service_account_id: service_account_id
    params:
      per_tier:
        Standard Deferred Payment Agreement: {min_past_due: "=min_past_due", max_arranged_amount: "=max_arranged_amount", minimum_service_months: "=minimum_service_months", offer_window_start: "=offer_window_start", offer_window_end: "=offer_window_end"}
        Extended Hardship Payment Agreement: {min_past_due: "=min_past_due", max_arranged_amount: "=max_arranged_amount", minimum_service_months: "=minimum_service_months", offer_window_start: "=offer_window_start", offer_window_end: "=offer_window_end"}
        Winter Protection Payment Agreement: {min_past_due: "=min_past_due", max_arranged_amount: "=max_arranged_amount", minimum_service_months: "=minimum_service_months", offer_window_start: "=offer_window_start", offer_window_end: "=offer_window_end"}
        Medical Certificate Payment Agreement: {min_past_due: "=min_past_due", max_arranged_amount: "=max_arranged_amount", minimum_service_months: "=minimum_service_months", offer_window_start: "=offer_window_start", offer_window_end: "=offer_window_end"}
        Agricultural Harvest Payment Agreement: {min_past_due: "=min_past_due", max_arranged_amount: "=max_arranged_amount", minimum_service_months: "=minimum_service_months", offer_window_start: "=offer_window_start", offer_window_end: "=offer_window_end"}
        Commercial Installment Agreement: {min_past_due: "=min_past_due", max_arranged_amount: "=max_arranged_amount", minimum_service_months: "=minimum_service_months", offer_window_start: "=offer_window_start", offer_window_end: "=offer_window_end"}
    measures: [arrange_msr_past_due, arrange_msr_open_pledges]
  - id: arrange_evt_terms
    subject: [arrange_offer]
    rule: >-
      The down payment is down_payment_pct percent of the past-due amount rounded to the cent, but not less than
      down_payment_minimum and never more than the past-due amount; where pledge_counts_toward_down_payment is true, the open
      pledges (arrange_msr_open_pledges) reduce the down payment the member must pay, never below zero. The arranged amount is
      the past-due amount less the down payment (the pledged part included), and include_current_charges being false, charges
      not yet past due are never arranged. On a monthly schedule the member chooses the number of installments up to
      max_installments; the count is reduced until each installment is at least min_installment_amount, and each installment
      is the arranged amount divided by the count, rounded to the cent, the last absorbing the difference. On a
      single_harvest_installment schedule there is one installment, billed in the billing period of harvest_installment_month
      following the offer. The first installment is billed first_installment_offset_periods periods after acceptance. The
      arrangement_fee, where above zero, is billed as a service fee with the first installment, and no interest is charged
      (interest_rate_pct).
    eligibility: []
    params:
      per_tier:
        Standard Deferred Payment Agreement: {down_payment_pct: "=down_payment_pct", down_payment_minimum: "=down_payment_minimum", max_installments: "=max_installments", min_installment_amount: "=min_installment_amount", installment_schedule: "=installment_schedule", arrangement_fee: "=arrangement_fee"}
        Extended Hardship Payment Agreement: {down_payment_pct: "=down_payment_pct", down_payment_minimum: "=down_payment_minimum", max_installments: "=max_installments", min_installment_amount: "=min_installment_amount", installment_schedule: "=installment_schedule", arrangement_fee: "=arrangement_fee"}
        Winter Protection Payment Agreement: {down_payment_pct: "=down_payment_pct", down_payment_minimum: "=down_payment_minimum", max_installments: "=max_installments", min_installment_amount: "=min_installment_amount", installment_schedule: "=installment_schedule", arrangement_fee: "=arrangement_fee"}
        Medical Certificate Payment Agreement: {down_payment_pct: "=down_payment_pct", down_payment_minimum: "=down_payment_minimum", max_installments: "=max_installments", min_installment_amount: "=min_installment_amount", installment_schedule: "=installment_schedule", arrangement_fee: "=arrangement_fee"}
        Agricultural Harvest Payment Agreement: {down_payment_pct: "=down_payment_pct", down_payment_minimum: "=down_payment_minimum", max_installments: "=max_installments", min_installment_amount: "=min_installment_amount", installment_schedule: "=installment_schedule", arrangement_fee: "=arrangement_fee"}
        Commercial Installment Agreement: {down_payment_pct: "=down_payment_pct", down_payment_minimum: "=down_payment_minimum", max_installments: "=max_installments", min_installment_amount: "=min_installment_amount", installment_schedule: "=installment_schedule", arrangement_fee: "=arrangement_fee"}
    formula:
      down_payment: min(past_due_amount, max(down_payment_minimum, round(past_due_amount * down_payment_pct / 100, 2)))
      arranged: past_due_amount - down_payment_amount
      installment: round(arranged_amount / installment_count, 2)
  - id: arrange_evt_acceptance
    subject: [arrange_accept, arrange_balance_transfer, arrange_expire]
    rule: >-
      Accepting the agreement is the member's own commitment and is given only by the member, through one of the tier's
      acceptance_methods_allowed. The member must accept within acceptance_window_days calendar days after the agreement was
      offered. Calendar days are counted from the day after the offered_date, the last day of the window being the last day of
      the count. The down payment, less any pledge counted toward it, must have posted on the service account through one of
      the down_payment_channels on or after the offered_date before the acceptance is recorded. On acceptance the arranged
      amount is moved off the service account's past-due balance (arrange_balance_transfer); where notice_cleared_on_acceptance
      is true an outstanding disconnect notice is cleared, and where reconnect_on_acceptance is true a disconnected account
      qualifies for reconnection under the Electric Service charter. An offer not accepted in the window expires and nothing is
      moved.
    eligibility:
      - id: accept_in_window
        applies_to: [arrange_accept]
        kind: time
        condition: The member must accept within acceptance_window_days calendar days after the agreement was offered.
        evidence_fields: [arrangements.offered_date, arrangements.arrangement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangements.arrangement_id]
          action_bindings:
            arrangements.arrangement_id: arrangement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the agreement was offered
          anchor_source: arrangements.offered_date
          relation: not_after
          duration_source: variants.acceptance_window_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the offered_date, the last day of the window being the last day of the count.
          boundary: inclusive
      - id: down_payment_posted
        applies_to: [arrange_accept]
        kind: authorization
        condition: The down payment, less any pledge counted toward it, must have posted on the service account through one of the down_payment_channels on or after the offered_date before the acceptance is recorded.
        evidence_fields: [service_payments.service_account_id, service_payments.payment_date, service_payments.amount, service_payments.payment_channel]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_payments.service_account_id]
          action_bindings:
            service_payments.service_account_id: service_account_id
    params:
      per_tier:
        Standard Deferred Payment Agreement: {acceptance_window_days: "=acceptance_window_days", notice_cleared_on_acceptance: "=notice_cleared_on_acceptance", reconnect_on_acceptance: "=reconnect_on_acceptance"}
        Extended Hardship Payment Agreement: {acceptance_window_days: "=acceptance_window_days", notice_cleared_on_acceptance: "=notice_cleared_on_acceptance", reconnect_on_acceptance: "=reconnect_on_acceptance"}
        Winter Protection Payment Agreement: {acceptance_window_days: "=acceptance_window_days", notice_cleared_on_acceptance: "=notice_cleared_on_acceptance", reconnect_on_acceptance: "=reconnect_on_acceptance"}
        Medical Certificate Payment Agreement: {acceptance_window_days: "=acceptance_window_days", notice_cleared_on_acceptance: "=notice_cleared_on_acceptance", reconnect_on_acceptance: "=reconnect_on_acceptance"}
        Agricultural Harvest Payment Agreement: {acceptance_window_days: "=acceptance_window_days", notice_cleared_on_acceptance: "=notice_cleared_on_acceptance", reconnect_on_acceptance: "=reconnect_on_acceptance"}
        Commercial Installment Agreement: {acceptance_window_days: "=acceptance_window_days", notice_cleared_on_acceptance: "=notice_cleared_on_acceptance", reconnect_on_acceptance: "=reconnect_on_acceptance"}
  - id: arrange_evt_installments
    subject: [arrange_installment_bill]
    rule: >-
      Installments are billed only while the agreement is in active status, one per billing period from the first installment
      period until the installment_count is reached, the last installment being whatever remains of the arranged balance. A
      billed installment is part of that bill's charges: late_charge_on_missed_installment being true, an installment unpaid
      past the due date bears the ordinary late charge, while late_charges_on_arranged_balance being false, the unbilled
      balance never does. A payment above the bill due is applied under extra_payment_application.
      Each installment is computed under installment_rounding_rule. Where disconnect_hold_while_active is true, the arranged
      amount is never the ground for a disconnection while the agreement is active and no installment is missed.
    eligibility:
      - id: agreement_active
        applies_to: [arrange_installment_bill]
        kind: state
        condition: Installments are billed only while the agreement is in active status, one per billing period from the first installment period until the installment_count is reached, the last installment being whatever remains of the arranged balance.
        evidence_fields: [arrangements.status, arrangements.arrangement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangements.arrangement_id]
          action_bindings:
            arrangements.arrangement_id: arrangement_id
        state_contract:
          field: arrangements.status
          allowed: [active]
  - id: arrange_evt_default
    subject: [arrange_installment_missed, arrange_default, arrange_balance_rebill]
    rule: >-
      An installment counts as missed when the installment, together with the current charges of the same bill where
      current_bill_must_be_paid is true, is not paid in full within missed_installment_grace_days calendar days after that
      bill's due date. When arrange_msr_missed_installments reaches missed_installments_before_default the agreement defaults:
      the unbilled arranged balance is billed back at once with rebill_reason default and is due default_rebill_due_days
      after the default date. Where disconnect_without_new_notice_on_default is true and the account was under a disconnect
      notice when the agreement was accepted, the account may be disconnected on that notice without a new notice period;
      otherwise collection restarts under the Electric Service charter. A defaulted agreement is never reinstated, and it
      counts against later offers under arrange_agg_member_history.
    eligibility: []
    params:
      per_tier:
        Standard Deferred Payment Agreement: {missed_installment_grace_days: "=missed_installment_grace_days", missed_installments_before_default: "=missed_installments_before_default", default_rebill_due_days: "=default_rebill_due_days", disconnect_without_new_notice_on_default: "=disconnect_without_new_notice_on_default"}
        Extended Hardship Payment Agreement: {missed_installment_grace_days: "=missed_installment_grace_days", missed_installments_before_default: "=missed_installments_before_default", default_rebill_due_days: "=default_rebill_due_days", disconnect_without_new_notice_on_default: "=disconnect_without_new_notice_on_default"}
        Winter Protection Payment Agreement: {missed_installment_grace_days: "=missed_installment_grace_days", missed_installments_before_default: "=missed_installments_before_default", default_rebill_due_days: "=default_rebill_due_days", disconnect_without_new_notice_on_default: "=disconnect_without_new_notice_on_default"}
        Medical Certificate Payment Agreement: {missed_installment_grace_days: "=missed_installment_grace_days", missed_installments_before_default: "=missed_installments_before_default", default_rebill_due_days: "=default_rebill_due_days", disconnect_without_new_notice_on_default: "=disconnect_without_new_notice_on_default"}
        Agricultural Harvest Payment Agreement: {missed_installment_grace_days: "=missed_installment_grace_days", missed_installments_before_default: "=missed_installments_before_default", default_rebill_due_days: "=default_rebill_due_days", disconnect_without_new_notice_on_default: "=disconnect_without_new_notice_on_default"}
        Commercial Installment Agreement: {missed_installment_grace_days: "=missed_installment_grace_days", missed_installments_before_default: "=missed_installments_before_default", default_rebill_due_days: "=default_rebill_due_days", disconnect_without_new_notice_on_default: "=disconnect_without_new_notice_on_default"}
    measures: [arrange_msr_missed_installments]
  - id: arrange_evt_completion
    subject: [arrange_complete, arrange_balance_rebill]
    rule: >-
      An agreement is completed when its last installment has been billed and the arranged balance is zero. Where
      early_payoff_allowed is true the member may pay off the agreement at any time: the unbilled balance is billed back with
      rebill_reason early_payoff, the early_payoff_fee where above zero is billed as a service fee, and the agreement is
      completed on the same day. A completed agreement leaves no hold on disconnection for later bills.
    eligibility: []
  - id: arrange_evt_termination
    subject: [arrange_terminate, arrange_balance_rebill]
    rule: >-
      An active agreement is terminated when its service account is final billed (termination_reason final_bill) or enrolls in
      PrePay Power (termination_reason prepay_enrollment). The unbilled balance is billed back on the service account with the
      same reason; on a PrePay Power enrollment it then forms part of the arrears transferred under the PrePay Power charter,
      and on a final bill it becomes part of the final balance. A termination is not a default and does not count against
      later offers.
    eligibility: []

