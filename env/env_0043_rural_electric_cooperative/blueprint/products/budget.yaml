category: budget
display_name: Budget Billing (Levelized and Equal Payment Plans)

binding:
  holding_table: budget_plans
  event_tables: [budget_ledger]
  intake_tables: [budget_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {deferred_balance: deferred_balance}

lifecycle:
  states: [enrolled, active, exit_pending, removed_nonpay, ended]
  transitions:
    - {from: enrolled, to: active, by: system, means: The first budget installment was billed in place of the actual bill amount.}
    - {from: enrolled, to: ended, by: user, means: The member withdrew the enrollment before the first budget bill.}
    - {from: active, to: exit_pending, by: user, means: The member confirmed leaving the plan; the deferred balance is settled on the next bill.}
    - {from: active, to: removed_nonpay, by: system, means: Missed installments reached the removal count and the member was removed from the plan.}
    - {from: exit_pending, to: ended, by: system, means: The deferred balance was settled on the exit bill.}
    - {from: removed_nonpay, to: ended, by: system, means: The deferred balance was settled on the removal bill.}
    - {from: active, to: ended, by: system, means: The service account was final billed and the deferred balance was settled on the final bill.}

accounts:
  - key: deferred_balance
    unit: USD
    meaning: Running difference between the actual charges billed to the plan and the budget installments billed; positive when actual charges exceeded installments (the member owes more), negative when installments exceeded actual charges; in = variance debits and settle-up credits, out = variance credits and settle-up bills.

parameter_schema:
  eligible_rate_schedules: Entry - official rate schedule names that may enroll in the plan; list.
  eligible_member_types: Entry - member_type values that may enroll; list.
  min_service_months: Entry - full calendar months of service at the location in the member's name required before enrollment; integer.
  history_months_for_estimate: Calculation - billing periods of history averaged for the first installment; integer.
  new_location_estimate_source: Calculation - location_history means a location with short history uses its own prior billing under other members, then the class average.
  class_average_monthly_bill: Calculation - average monthly bill of the rate class used when the location has no history, USD.
  max_past_due_at_enrollment: Entry - largest past-due amount allowed on the service account at enrollment, USD.
  enrollment_months_allowed: Entry - calendar months (1-12) in which enrollment is accepted; list.
  recalculation_method: Calculation - rolling_average, fixed_annual, quarterly_review or semiannual_review.
  recalc_frequency_months: Calculation - months between scheduled recalculations; integer.
  variance_trigger_pct: Calculation - percent by which the recalculated installment must differ from the current one for a scheduled review to change it; 0 = always changes.
  deferred_spread_months: Calculation - months over which the deferred balance is spread when an installment is computed; integer.
  installment_months_per_year: Calculation - months of the year billed at the installment amount; integer.
  installment_rounding: Calculation - up_to_whole_dollar means every computed installment is rounded up to the next whole dollar.
  min_installment: Calculation - smallest installment, USD.
  settle_up_rule: Settle-up - when the deferred balance is settled; continuous_no_settle_up, anniversary_month or july_bill.
  settle_up_credit_handling: Settle-up - apply_to_next_bill, or refund_check_over_minimum (a check when the credit is at least settle_up_refund_check_min).
  settle_up_refund_check_min: Settle-up - smallest settle-up credit refunded by check where checks apply, USD.
  settle_up_debit_spread_allowed: Settle-up - whether an anniversary settle-up debit may be spread over later bills at the member's request; boolean.
  settle_up_debit_spread_months: Settle-up - bills over which a spread settle-up debit is billed; integer.
  settle_up_due_days: Settle-up - calendar days from the settle-up bill date to its due date; integer.
  anniversary_notice_days: Settle-up - calendar days before the anniversary bill that the member is notified of the coming settle-up and new installment; integer.
  max_deferred_debit_before_review: Review - deferred debit at which an unscheduled recalculation is made, USD; 0.00 where the method recalculates monthly.
  max_deferred_credit_before_review: Review - deferred credit (absolute value) at which an unscheduled recalculation is made, USD; 0.00 where the method recalculates monthly.
  rate_change_recalculation: Review - whether a board-approved rate change triggers a recalculation on the next bill; boolean.
  pca_included: Coverage - whether the power cost adjustment is part of the leveled charges; boolean.
  sales_tax_included: Coverage - whether sales tax is part of the leveled charges; boolean.
  program_charges_included: Coverage - whether program charges (arrangement installments, light rentals) are leveled; boolean.
  fees_included: Coverage - whether fees and late charges are leveled; boolean.
  missed_installments_before_removal: Removal - missed installments within the lookback that remove the member from the plan; integer.
  missed_installment_lookback_months: Removal - months over which missed installments are counted; integer.
  removal_reenroll_wait_months: Removal - months after a removal before any account of the member may enroll again; integer.
  late_charge_on_installment: Collections - whether an unpaid installment bears the ordinary late charge; boolean.
  disconnect_on_unpaid_installment: Collections - whether an unpaid installment is subject to ordinary disconnect rules; boolean.
  autopay_required: Entry - whether automatic bank draft is required; boolean.
  prepay_compatible: Combination - whether the plan may coexist with PrePay Power on the account; boolean.
  arrangement_compatible: Combination - whether the plan may coexist with an active payment arrangement on the account; boolean.
  enrollment_fee: Entry - fee to enroll, USD.
  member_consent_required: Entry - whether the member's own confirmation of the plan terms is required; boolean.
  enrollment_channels: Entry - channels through which enrollment is taken; list.
  exit_effective: Exit - next_bill means the plan ends on the next bill after the member's confirmed exit.
  exit_settle_up_required: Exit - whether the deferred balance is settled in full on the exit bill; boolean (false = rolling plans spread nothing further and bill it on the exit bill as well).
  exit_reenroll_wait_months: Exit - months after a voluntary exit before the same account may enroll again; integer.
  final_bill_settle_up: Exit - whether the deferred balance is settled on the final bill when service ends; boolean.
  budget_amount_change_by_member: Change - whether the member may set the installment amount; boolean.
  max_installment_change_pct_per_review: Review - largest percent change of the installment at one scheduled review; 0 = no limit.
  deferred_balance_interest_pct: Charges - interest on the deferred balance, percent per year.
  statement_shows_actual: Service - whether each bill shows the actual charges and the deferred balance; boolean.
  tier_switch_allowed: Change - whether the member may switch to another Budget Billing tier without leaving the program; boolean.

