category: capital
display_name: Capital Credits (Patronage Capital)

binding:
  holding_table: capital_accounts
  event_tables: [capital_ledger]
  intake_tables: [capital_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {unretired_balance: capital_credits, payable_balance: retirement_payable}

lifecycle:
  states: [active, inactive, estate_claim_pending, fully_retired]
  transitions:
    - {from: active, to: inactive, by: system, means: The member no longer buys power in this patron class because the last service account billed in the class was final billed; the credits stay on the books until retired.}
    - {from: inactive, to: active, by: system, means: The member connects service again in the patron class.}
    - {from: active, to: estate_claim_pending, by: agent, means: An estate retirement application for a deceased member was taken with the certified death certificate on file.}
    - {from: inactive, to: estate_claim_pending, by: agent, means: An estate retirement application for a deceased former member was taken with the certified death certificate on file.}
    - {from: estate_claim_pending, to: inactive, by: agent, means: The estate application was withdrawn or denied and the credits return to the general rotation.}
    - {from: estate_claim_pending, to: fully_retired, by: system, means: The board-approved estate retirement was paid and nothing remains unretired or payable.}
    - {from: inactive, to: fully_retired, by: system, means: Every allocation of a former member has been retired and paid out, escheated or offset.}

accounts:
  - key: capital_credits
    unit: USD
    meaning: Patronage capital allocated to the member and not yet retired; in = annual allocations by allocation year and source, out = general retirements and estate or discounted early retirements (the gross allocated amount retired).
  - key: retirement_payable
    unit: USD
    meaning: Retired capital credits owed to the member and not yet paid out, including amounts carried forward below the minimum check; in = the payable from each retirement (after any discount) and voided checks returned, out = bill credits, checks, offsets, donations and escheats.

parameter_schema:
  eligible_rate_schedules: Entry - official rate schedule names whose billed revenue is allocated to the patron class; list.
  eligible_member_types: Entry - member_type values that hold accounts in the class; list.
  allocation_rate_pct_of_revenue: Allocation - percent of the member's patronage revenue in the class for the year that is allocated as distribution margins.
  allocation_basis: Allocation - which revenue counts as patronage; revenue_billed_excluding_taxes_and_fees means usage lines billed in the calendar year less sales tax, fees and program charges.
  gt_allocation_pass_through: Allocation - whether capital credits allocated to Cedar Fork by its wholesale supplier are passed through to members on the same patronage; boolean.
  allocation_month: Allocation - calendar month in which the prior year's allocations are booked; integer.
  allocation_notice_method: Allocation - how members are told of their allocation; annual_statement_with_june_bill.
  general_retirement_method: Retirement - hybrid_fifo_percentage means each board resolution retires all remaining credits of the oldest open years plus a percentage of one recent year.
  general_retirement_payment_month: Retirement - calendar month whose bills and check run carry the general retirement; integer.
  gt_retired_only_when_received: Retirement - whether wholesale-supplier allocations are retired only through the year the supplier has itself retired to Cedar Fork; boolean.
  minimum_check_amount: Disbursement - smallest payout issued by check, USD; a smaller payable is carried forward.
  minimum_bill_credit_amount: Disbursement - smallest payout posted as a bill credit, USD; a smaller payable is carried forward.
  active_member_disbursement: Disbursement - how an active member is paid; bill_credit or check.
  inactive_member_disbursement: Disbursement - how an inactive member or an estate is paid; check.
  carryforward_allowed: Disbursement - whether payables below the minimum are carried forward and added to the next payout; boolean.
  estate_retirement_allowed: Estate - whether the class's credits of a deceased individual member may be retired early for the estate; boolean.
  estate_discount_applies: Estate - whether estate retirements are paid at a discounted present value; boolean.
  estate_discount_rate_pct: Estate - annual discount rate for estate retirements, percent.
  estate_expected_rotation_years: Estate - years after allocation at which an allocation would be retired in the general rotation; used to count the discount years.
  estate_claim_window_months: Estate - calendar months after the date of death within which an estate application must be submitted; integer.
  estate_payment_days_after_approval: Estate - calendar days after board approval within which the estate check is issued; integer.
  estate_annual_cap: Estate - largest gross amount retired for one estate in one calendar year, USD; the rest waits for the next year.
  small_estate_affidavit_limit: Estate - largest payout made on a small estate affidavit instead of letters testamentary or of administration, USD.
  joint_membership_estate_on_last_death: Estate - whether credits of a joint membership pass to the surviving spouse and are retired for the estate only on the death of the last joint member; boolean.
  w9_required_for_estate: Estate - whether the estate's IRS Form W-9 must be on file before payment; boolean.
  estate_documents_required: Estate - documents that must be on file for an estate application to be complete; list.
  authority_documents_accepted: Estate - documents accepted as proof of the claimant's authority; list.
  estate_board_meeting_cycle: Estate - when complete estate applications are approved; monthly_third_tuesday.
  offset_unpaid_balances: Offset - whether retirements are first applied to the member's unpaid final-billed balances; boolean.
  offset_order: Offset - order of offset; oldest_final_balance_first.
  discounted_early_retirement_allowed: Early - whether an inactive member may request early retirement of the class's credits at a discount; boolean.
  early_retirement_discount_rate_pct: Early - annual discount rate for discounted early retirements, percent.
  early_retirement_min_inactive_months: Early - full calendar months the account must have been inactive before a request; integer.
  early_retirement_min_amount: Early - smallest unretired balance for which a discounted early retirement is accepted, USD.
  early_retirement_request_window_start: Early - first day of each year on which requests are accepted, MM-DD.
  early_retirement_request_window_end: Early - last day of each year on which requests are accepted, MM-DD; requests are approved with the general retirement.
  organization_dissolution_retirement_allowed: Early - whether a dissolved business or organization's credits are retired early; boolean.
  check_stale_days: Checks - calendar days after issue after which an uncashed capital credit check is stale and voided; integer.
  check_reissue_free_count: Checks - reissues of one payout made free of charge; integer.
  check_reissue_fee: Checks - fee deducted from a reissued check beyond the free reissues, USD.
  unclaimed_dormancy_months: Unclaimed - calendar months a voided payable is held after the void before it is escheated; integer.
  unclaimed_notice_months_before_escheat: Unclaimed - months before escheat that the last-known-address notice is mailed; integer.
  unclaimed_disposition: Unclaimed - where escheated payables go; state_unclaimed_property.
  form_1099_patr_required: Tax - whether payouts to the class are reported on IRS Form 1099-PATR; boolean.
  form_1099_patr_threshold: Tax - smallest calendar-year payout reported on Form 1099-PATR, USD.
  backup_withholding_pct: Tax - percent withheld from a reportable payout when no taxpayer identification number is on file.
  donation_allowed: Donation - whether a member may elect to donate payouts; boolean.
  donation_recipients: Donation - accepted donation recipients; list.
  retirement_rounding: Retirement - every retirement, discount and payable is rounded to the cent per allocation year and source.

