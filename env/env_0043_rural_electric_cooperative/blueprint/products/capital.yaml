events:
  - type: capital_open
    target: capital_accounts
    mutation: create
    meaning: A capital credit account is opened for a member in a patron class at the member's first allocation in that class.
    grain: One row per member per patron class.
    fields:
      customer_id: Member.
      variant_name: Official patron class.
      opened_date: Date the account was opened.
    triggers: []
  - type: capital_allocation
    target: capital_ledger
    meaning: Margins of one patronage year are allocated to the member's capital account, from the cooperative's own distribution margins or passed through from the wholesale supplier.
    grain: One row per allocation year per allocation source.
    distinguish_by: [allocation_year, allocation_source]
    fields:
      entry_date: Date the allocation was booked.
      allocation_year: Patronage year allocated, YYYY.
      allocation_source: Distribution margin or wholesale-supplier allocation.
      patronage_revenue: Revenue billed in the class in that year that the allocation is based on.
      amount: Amount allocated, positive.
    account: capital_credits
    direction: in
    triggers: []
  - type: capital_general_retirement
    target: capital_ledger
    meaning: A board-approved general retirement retires all or a percentage of one allocation year and source.
    grain: One row per retirement cycle per allocation year per allocation source.
    distinguish_by: [retirement_cycle, allocation_year, allocation_source]
    fields:
      entry_date: Date of the retirement.
      retirement_cycle: Year of the board resolution, YYYY.
      allocation_year: Allocation year retired.
      allocation_source: Source retired.
      amount: Allocated amount retired, positive.
    account: capital_credits
    direction: out
    triggers:
      - event: capital:capital_payable_accrual
        map: {entry_date: entry_date, retirement_cycle: retirement_cycle, allocation_year: allocation_year, allocation_source: allocation_source, retirement_type: general, gross_retired_amount: amount, discount_amount: 0.00, amount: amount}
  - type: capital_special_retirement
    target: capital_ledger
    meaning: Allocations are retired early for a deceased member's estate or on a former member's discounted early retirement request.
    grain: One row per approved request per allocation year per allocation source.
    distinguish_by: [capital_request_id, allocation_year, allocation_source]
    fields:
      entry_date: Date of the retirement.
      retirement_cycle: Calendar year of the retirement, YYYY.
      retirement_type: Estate or discounted early.
      allocation_year: Allocation year retired.
      allocation_source: Source retired.
      capital_request_id: The approved request the retirement answers.
      amount: Allocated amount retired, positive (before discount).
    account: capital_credits
    direction: out
    triggers:
      - event: capital:capital_payable_accrual
        map: {entry_date: entry_date, retirement_cycle: retirement_cycle, allocation_year: allocation_year, allocation_source: allocation_source, retirement_type: retirement_type, capital_request_id: capital_request_id, gross_retired_amount: amount}
  - type: capital_payable_accrual
    target: capital_ledger
    meaning: The amount owed to the member from one retirement row, after any discount, becomes payable.
    grain: One row per retirement row.
    distinguish_by: [retirement_type, retirement_cycle, allocation_year, allocation_source, capital_request_id]
    fields:
      entry_date: Date it became payable.
      retirement_type: General, estate or discounted early.
      retirement_cycle: Year of the retirement.
      allocation_year: Allocation year retired.
      allocation_source: Source retired.
      capital_request_id: The approved request, for estate and early retirements.
      gross_retired_amount: Allocated amount retired.
      discount_amount: Present-value discount kept by the cooperative.
      amount: Amount payable, positive (gross less discount).
    account: retirement_payable
    direction: in
    triggers: []
  - type: capital_disbursement
    target: capital_ledger
    meaning: Payable capital credits are paid out by bill credit, check, offset against an unpaid final balance, or donation.
    grain: One row per payout per method per service account or check.
    distinguish_by: [retirement_cycle, disbursement_method, check_number, service_account_id, original_entry_id]
    fields:
      entry_date: Date paid out.
      retirement_cycle: Year of the retirement paid.
      disbursement_method: How it was paid.
      amount: Amount paid out, positive.
      check_number: Check number, for checks.
      service_account_id: The service account credited or offset, for bill credits and offsets.
      capital_request_id: The request paid, for estate and early retirements and reissues.
      original_entry_id: The voided payout this one reissues; empty otherwise.
      fee_amount: Reissue fee deducted, 0.00 when none.
    account: retirement_payable
    direction: out
    triggers:
      - event: service:service_bill_credit
        when: {disbursement_method: bill_credit}
        map: {credit_reason: capital_credit_retirement, charge_component: bill_credit, amount: amount, charge_date: entry_date, source_reference_id: capital_entry_id}
      - event: service:service_bill_credit
        when: {disbursement_method: offset_unpaid_balance}
        map: {credit_reason: capital_credit_offset, charge_component: bill_credit, amount: amount, charge_date: entry_date, source_reference_id: capital_entry_id}
  - type: capital_check_void
    target: capital_ledger
    meaning: A capital credit check that went stale, was reported lost or came back undeliverable is voided and its amount is payable again.
    grain: One row per check voided.
    distinguish_by: [original_entry_id]
    fields:
      entry_date: Date voided.
      original_entry_id: The check payout voided.
      check_number: Number of the voided check.
      void_reason: Why it was voided.
      amount: Amount returned to payable, positive.
    account: retirement_payable
    direction: in
    triggers: []
  - type: capital_escheat
    target: capital_ledger
    meaning: A voided payable unclaimed through the dormancy period is remitted as unclaimed property.
    grain: One row per voided payout escheated.
    distinguish_by: [original_entry_id]
    fields:
      entry_date: Date remitted.
      original_entry_id: The voided check payout.
      amount: Amount remitted, positive.
    account: retirement_payable
    direction: out
    triggers: []
  - type: capital_inactivate
    target: capital_accounts
    mutation: {transition: {from: active, to: inactive}}
    meaning: The member's last service account in the class was final billed.
    grain: One row per transaction on the capital account.
    fields:
      inactive_date: Final date of the member's last service account in the class.
    triggers: []
  - type: capital_reactivate
    target: capital_accounts
    mutation: {transition: {from: inactive, to: active}}
    meaning: The member connects service in the class again.
    grain: One row per transaction on the capital account.
    fields:
      inactive_date: Cleared to empty.
    triggers: []
  - type: capital_estate_claim
    target: capital_accounts
    mutation:
      transition:
        - {from: active, to: estate_claim_pending}
        - {from: inactive, to: estate_claim_pending}
    meaning: An estate retirement application is taken for a deceased member.
    grain: One row per transaction on the capital account.
    fields:
      estate_claim_date: Date the estate application was submitted.
    triggers: []
  - type: capital_estate_withdraw
    target: capital_accounts
    mutation: {transition: {from: estate_claim_pending, to: inactive}}
    meaning: The estate application is withdrawn or denied.
    grain: One row per transaction on the capital account.
    fields:
      estate_claim_date: Cleared to empty.
    triggers: []
  - type: capital_fully_retire
    target: capital_accounts
    mutation:
      transition:
        - {from: estate_claim_pending, to: fully_retired}
        - {from: inactive, to: fully_retired}
    meaning: Nothing remains unretired or payable on the account.
    grain: One row per transaction on the capital account.
    fields:
      closed_date: Date the account was fully retired.
    triggers: []
  - type: capital_donation_election
    target: capital_accounts
    mutation: update
    meaning: The member elects, changes or cancels the donation of future payouts.
    grain: One row per transaction on the capital account.
    fields:
      donation_election: Recipient elected, or none.
    triggers: []

measures:
  - id: capital_msr_patronage_revenue
    window: The billing periods YYYY-01 through YYYY-12 of the patronage year, on every service account of the member whose rate schedule is in the class's eligible_rate_schedules.
    measure: Sum of amount of service_usage_charge rows less those with charge_component sales_tax.
  - id: capital_msr_member_payable
    window: Point in time on the payout date, across every capital account of the same member.
    measure: Sum of payable_balance of the member's capital accounts.
  - id: capital_msr_member_unpaid_final
    window: Point in time on the payout date, across every service account of the same member.
    measure: Sum of the positive account_balance of the member's service accounts in final_billed status.
  - id: capital_msr_estate_retired_year
    window: The calendar year of the retirement, across every capital account of the deceased member.
    measure: Sum of amount of capital_special_retirement rows with retirement_type estate whose entry_date falls in the window.
  - id: capital_msr_reissues
    window: The chain of payouts descending from one original payout through voids and reissues.
    measure: Count of capital_disbursement rows in the chain that carry an original_entry_id (each one a reissue).

policies:
  - id: capital_agg_multi_holding
    subject: [capital_open]
    rule: >-
      A member holds one capital credit account per patron class, opened at the member's first allocation in that class; a
      member billed on schedules of two classes (a farm home and an irrigation pivot, say) holds two accounts. A second
      account in the same patron class is never opened for the same member; later allocations post to the existing account
      whatever its status, except that an account in fully_retired status is reopened only by a new allocation, which posts
      to a new account.
    eligibility:
      - id: one_account_per_class
        applies_to: [capital_open]
        kind: dedup
        condition: A second account in the same patron class is never opened for the same member; later allocations post to the existing account whatever its status, except that an account in fully_retired status is reopened only by a new allocation, which posts to a new account.
        evidence_fields: [capital_accounts.customer_id, capital_accounts.variant_name, capital_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [capital_accounts.customer_id]
          action_bindings:
            capital_accounts.customer_id: customer_id
        dedup_contract:
          table: capital_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name}
          duplicate_filters: {status: [active, inactive, estate_claim_pending]}
          distinct_fields: []
    params:
      max_per_customer: null
  - id: capital_agg_member_payout
    subject: [capital_disbursement]
    rule: >-
      Payouts are assembled per member, not per capital account. At each payout the payable_balance of all of the member's
      capital accounts (capital_msr_member_payable) is combined: when offset_unpaid_balances is true it is first applied to
      the member's unpaid final-billed balances (capital_msr_member_unpaid_final) in offset_order, each offset posted as a
      separate offset_unpaid_balance payout against that service account; what remains is paid in one payout - a bill credit
      to the member's oldest active service account in the class when the member is active and active_member_disbursement is
      bill_credit, otherwise one check to the mailing address on file. A payout is made only when the combined remainder is at
      least minimum_bill_credit_amount for a bill credit or minimum_check_amount for a check; where carryforward_allowed is
      true a smaller remainder stays payable and is added to the next payout. An unpaid balance on an open, active service
      account is never offset; it is collected under the Electric Service charter.
      An inactive member and an estate are always paid under inactive_member_disbursement.
    eligibility:
      - id: payout_minimum
        applies_to: [capital_disbursement]
        kind: authorization
        condition: A payout is made only when the combined remainder is at least minimum_bill_credit_amount for a bill credit or minimum_check_amount for a check; where carryforward_allowed is true a smaller remainder stays payable and is added to the next payout.
        evidence_fields: [capital_accounts.customer_id, capital_accounts.payable_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [capital_accounts.customer_id]
          action_bindings:
            capital_accounts.customer_id: customer_id
    params:
      per_tier:
        Residential Patron Class: {minimum_check_amount: "=minimum_check_amount", minimum_bill_credit_amount: "=minimum_bill_credit_amount", active_member_disbursement: "=active_member_disbursement"}
        Seasonal Patron Class: {minimum_check_amount: "=minimum_check_amount", minimum_bill_credit_amount: "=minimum_bill_credit_amount", active_member_disbursement: "=active_member_disbursement"}
        Farm Patron Class: {minimum_check_amount: "=minimum_check_amount", minimum_bill_credit_amount: "=minimum_bill_credit_amount", active_member_disbursement: "=active_member_disbursement"}
        General Service Patron Class: {minimum_check_amount: "=minimum_check_amount", minimum_bill_credit_amount: "=minimum_bill_credit_amount", active_member_disbursement: "=active_member_disbursement"}
        Irrigation Patron Class: {minimum_check_amount: "=minimum_check_amount", minimum_bill_credit_amount: "=minimum_bill_credit_amount", active_member_disbursement: "=active_member_disbursement"}
        Large Power Patron Class: {minimum_check_amount: "=minimum_check_amount", minimum_bill_credit_amount: "=minimum_bill_credit_amount", active_member_disbursement: "=active_member_disbursement"}
    measures: [capital_msr_member_payable, capital_msr_member_unpaid_final]
  - id: capital_evt_allocation
    subject: [capital_allocation, capital_open]
    rule: >-
      In allocation_month of each year the prior patronage year's distribution margins are allocated to every member who was
      billed in the class during that year: the allocation is allocation_rate_pct_of_revenue percent of the member's
      patronage revenue in the class (capital_msr_patronage_revenue), rounded to the cent. Where gt_allocation_pass_through is
      true the wholesale supplier's allocation to Cedar Fork for the same year is passed through as a separate gt_allocation
      row in proportion to the same patronage, its amount being taken from the allocation notice as recorded. A member who
      left during the year is still allocated for the months billed. Allocations may be booked only on a capital account in
      active, inactive or estate_claim_pending status. Allocations are notified by allocation_notice_method; an allocation is
      not cash and is never paid out until retired.
      Patronage revenue is measured under allocation_basis, and accounts in the class are held by members of any of
      eligible_member_types.
    eligibility:
      - id: allocation_to_open_account
        applies_to: [capital_allocation]
        kind: state
        condition: Allocations may be booked only on a capital account in active, inactive or estate_claim_pending status.
        evidence_fields: [capital_accounts.status, capital_accounts.capital_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [capital_accounts.capital_account_id]
          action_bindings:
            capital_accounts.capital_account_id: capital_account_id
        state_contract:
          field: capital_accounts.status
          allowed: [active, inactive, estate_claim_pending]
    params:
      per_tier:
        Residential Patron Class: {allocation_rate_pct_of_revenue: "=allocation_rate_pct_of_revenue"}
        Seasonal Patron Class: {allocation_rate_pct_of_revenue: "=allocation_rate_pct_of_revenue"}
        Farm Patron Class: {allocation_rate_pct_of_revenue: "=allocation_rate_pct_of_revenue"}
        General Service Patron Class: {allocation_rate_pct_of_revenue: "=allocation_rate_pct_of_revenue"}
        Irrigation Patron Class: {allocation_rate_pct_of_revenue: "=allocation_rate_pct_of_revenue"}
        Large Power Patron Class: {allocation_rate_pct_of_revenue: "=allocation_rate_pct_of_revenue"}
    formula:
      allocation_amount: round(patronage_revenue * allocation_rate_pct_of_revenue / 100, 2)
    measures: [capital_msr_patronage_revenue]
  - id: capital_evt_general_retirement
    subject: [capital_general_retirement, capital_payable_accrual]
    rule: >-
      General retirements are made only by board resolution, as recorded in general_retirement_resolutions, and are paid with
      the bills and check run of general_retirement_payment_month of the resolution year. Under the hybrid_fifo_percentage
      method a resolution retires everything still unretired of the distribution_margin allocations of every year up to and
      including its fifo_through_year, plus its percentage of the original distribution_margin allocation of its
      percentage_year. Where gt_retired_only_when_received is true, gt_allocation rows are retired only for years up to and
      including the resolution's gt_retired_through_year, in full. Each allocation year and source retired is its own row,
      rounded to the cent, and becomes payable in full with no discount. A member cannot ask for a general retirement outside
      a resolution, and no general retirement is ever made on a fully_retired account.
      The general_retirement_method of every class is hybrid_fifo_percentage, and every row is rounded under
      retirement_rounding.
    eligibility: []
    params:
      general_retirement_resolutions:
        2024: {approved_date: "2024-11-19", fifo_through_year: 2002, percentage_year: 2017, percentage: 15, gt_retired_through_year: 1997}
        2025: {approved_date: "2025-11-18", fifo_through_year: 2003, percentage_year: 2018, percentage: 18, gt_retired_through_year: 1998}
        2026: {approved_date: "2026-11-17", fifo_through_year: 2004, percentage_year: 2019, percentage: 20, gt_retired_through_year: 1999}
  - id: capital_evt_estate_retirement
    subject: [capital_estate_claim, capital_special_retirement, capital_payable_accrual, capital_disbursement, capital_estate_withdraw]
    rule: >-
      Estate retirement is offered only where estate_retirement_allowed is true, only for an individual or joint membership,
      and only on the application of the person with authority over the deceased member's estate. An estate application may
      be taken only when the member profile carries the deceased_date of a certified death certificate on file. For a joint
      membership, where joint_membership_estate_on_last_death is true, the credits pass to the surviving joint member and the
      estate application is taken only on the death of the last joint member, whose date of death is the deceased_date. An
      estate application must be submitted within estate_claim_window_months calendar months after the member's date of
      death. Calendar months are counted from the deceased_date to the same day number of the later month, falling back to the
      last day of that month when the day number does not exist. A late application leaves the credits in the general rotation.
      The application is complete only when every one of estate_documents_required is on file - the certified death
      certificate, an authority document of a type in authority_documents_accepted naming the claimant, and, where
      w9_required_for_estate is true, the estate's Form W-9; a small_estate_affidavit is accepted only when the payout is at
      most small_estate_affidavit_limit. Complete applications are approved at the board meeting of the
      estate_board_meeting_cycle. On approval every unretired allocation of every capital account of the deceased member is
      retired as capital_special_retirement rows with retirement_type estate, up to estate_annual_cap of gross retirement in the
      calendar year (capital_msr_estate_retired_year), oldest allocation years first. Where estate_discount_applies is true each
      row's payable is its amount discounted at estate_discount_rate_pct for the number of whole years remaining until the
      year it would be retired in the general rotation (its allocation_year plus estate_expected_rotation_years), never fewer
      than zero years. The payable is offset first against the deceased member's unpaid final-billed balances under
      capital_agg_member_payout, and the rest is paid by one check payable to the estate within
      estate_payment_days_after_approval calendar days. A denied or withdrawn application returns the account to inactive.
    eligibility:
      - id: death_certificate_on_file
        applies_to: [capital_estate_claim]
        kind: authorization
        condition: An estate application may be taken only when the member profile carries the deceased_date of a certified death certificate on file.
        evidence_fields: [customers.deceased_date, customers.customer_id, customers.member_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: estate_claim_window
        applies_to: [capital_estate_claim]
        kind: time
        condition: An estate application must be submitted within estate_claim_window_months calendar months after the member's date of death.
        evidence_fields: [customers.deceased_date, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the member's date of death
          anchor_source: customers.deceased_date
          relation: not_after
          duration_source: variants.estate_claim_window_months
          unit: calendar_months
          counting_rule: Calendar months are counted from the deceased_date to the same day number of the later month, falling back to the last day of that month when the day number does not exist.
          boundary: inclusive
      - id: application_complete_and_approved
        applies_to: [capital_special_retirement]
        kind: authorization
        condition: Complete applications are approved at the board meeting of the estate_board_meeting_cycle.
        evidence_fields: [capital_requests.capital_request_id, capital_requests.request_status, capital_requests.death_certificate_on_file, capital_requests.authority_document_type, capital_requests.w9_on_file]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [capital_requests.capital_request_id]
          action_bindings:
            capital_requests.capital_request_id: capital_request_id
    params:
      per_tier:
        Residential Patron Class: {estate_retirement_allowed: "=estate_retirement_allowed", estate_discount_rate_pct: "=estate_discount_rate_pct", estate_expected_rotation_years: "=estate_expected_rotation_years", estate_claim_window_months: "=estate_claim_window_months"}
        Seasonal Patron Class: {estate_retirement_allowed: "=estate_retirement_allowed", estate_discount_rate_pct: "=estate_discount_rate_pct", estate_expected_rotation_years: "=estate_expected_rotation_years", estate_claim_window_months: "=estate_claim_window_months"}
        Farm Patron Class: {estate_retirement_allowed: "=estate_retirement_allowed", estate_discount_rate_pct: "=estate_discount_rate_pct", estate_expected_rotation_years: "=estate_expected_rotation_years", estate_claim_window_months: "=estate_claim_window_months"}
        General Service Patron Class: {estate_retirement_allowed: "=estate_retirement_allowed", estate_discount_rate_pct: "=estate_discount_rate_pct", estate_expected_rotation_years: "=estate_expected_rotation_years", estate_claim_window_months: "=estate_claim_window_months"}
        Irrigation Patron Class: {estate_retirement_allowed: "=estate_retirement_allowed", estate_discount_rate_pct: "=estate_discount_rate_pct", estate_expected_rotation_years: "=estate_expected_rotation_years", estate_claim_window_months: "=estate_claim_window_months"}
        Large Power Patron Class: {estate_retirement_allowed: "=estate_retirement_allowed", estate_discount_rate_pct: "=estate_discount_rate_pct", estate_expected_rotation_years: "=estate_expected_rotation_years", estate_claim_window_months: "=estate_claim_window_months"}
    formula:
      years_remaining: max(0, allocation_year + estate_expected_rotation_years - retirement_cycle)
      estate_payable: round(gross_retired_amount / (1 + estate_discount_rate_pct / 100) ** years_remaining, 2)
      discount: gross_retired_amount - estate_payable
    measures: [capital_msr_estate_retired_year, capital_msr_member_unpaid_final]
  - id: capital_evt_early_retirement
    subject: [capital_special_retirement, capital_payable_accrual]
    rule: >-
      Where discounted_early_retirement_allowed is true, a former member whose capital account is inactive may ask for all of
      the account's unretired credits to be retired early at a discount. A discounted early retirement may be requested only
      after early_retirement_min_inactive_months full calendar months have passed since the capital account became inactive.
      Calendar months are counted from the inactive_date to the same day number of the later month, falling back to the last
      day of that month when the day number does not exist. Requests are accepted only from early_retirement_request_window_start
      through early_retirement_request_window_end of a year and only when the unretired_balance is at least
      early_retirement_min_amount; they are approved with that year's general retirement resolution and retired as
      capital_special_retirement rows with retirement_type discounted_early. Each row's payable is discounted exactly as an
      estate row is, but at early_retirement_discount_rate_pct. The request covers the whole account; a partial early retirement
      is never made. Where organization_dissolution_retirement_allowed is false, a dissolved business or organization is never
      retired early and its credits stay in the general rotation.
    eligibility:
      - id: inactive_long_enough
        applies_to: [capital_special_retirement]
        kind: time
        condition: A discounted early retirement may be requested only after early_retirement_min_inactive_months full calendar months have passed since the capital account became inactive.
        evidence_fields: [capital_accounts.inactive_date, capital_accounts.capital_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [capital_accounts.capital_account_id]
          action_bindings:
            capital_accounts.capital_account_id: capital_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the capital account became inactive
          anchor_source: capital_accounts.inactive_date
          relation: not_before
          duration_source: variants.early_retirement_min_inactive_months
          unit: calendar_months
          counting_rule: Calendar months are counted from the inactive_date to the same day number of the later month, falling back to the last day of that month when the day number does not exist.
          boundary: inclusive
    params:
      per_tier:
        Residential Patron Class: {discounted_early_retirement_allowed: "=discounted_early_retirement_allowed", early_retirement_discount_rate_pct: "=early_retirement_discount_rate_pct", early_retirement_min_amount: "=early_retirement_min_amount"}
        Seasonal Patron Class: {discounted_early_retirement_allowed: "=discounted_early_retirement_allowed", early_retirement_discount_rate_pct: "=early_retirement_discount_rate_pct", early_retirement_min_amount: "=early_retirement_min_amount"}
        Farm Patron Class: {discounted_early_retirement_allowed: "=discounted_early_retirement_allowed", early_retirement_discount_rate_pct: "=early_retirement_discount_rate_pct", early_retirement_min_amount: "=early_retirement_min_amount"}
        General Service Patron Class: {discounted_early_retirement_allowed: "=discounted_early_retirement_allowed", early_retirement_discount_rate_pct: "=early_retirement_discount_rate_pct", early_retirement_min_amount: "=early_retirement_min_amount"}
        Irrigation Patron Class: {discounted_early_retirement_allowed: "=discounted_early_retirement_allowed", early_retirement_discount_rate_pct: "=early_retirement_discount_rate_pct", early_retirement_min_amount: "=early_retirement_min_amount"}
        Large Power Patron Class: {discounted_early_retirement_allowed: "=discounted_early_retirement_allowed", early_retirement_discount_rate_pct: "=early_retirement_discount_rate_pct", early_retirement_min_amount: "=early_retirement_min_amount"}
  - id: capital_evt_checks
    subject: [capital_check_void, capital_disbursement, capital_escheat]
    rule: >-
      A capital credit check reported lost or returned undeliverable may be voided at any time. A check payout is voided only
      once. An uncashed check may be voided
      as stale_dated only after check_stale_days calendar days have passed since the check was issued. Calendar days are counted
      from the day after the check's entry_date, the last day being the last day of the count. A voided amount becomes payable
      again and is reissued on the member's request to the mailing address on file as a new check payout whose original_entry_id
      is the voided payout; the first check_reissue_free_count reissues of one payout are free and later ones have
      check_reissue_fee deducted (capital_msr_reissues). A voided payable not reissued is escheated under unclaimed_disposition
      once unclaimed_dormancy_months calendar months have passed since the void, after a last-known-address notice mailed
      unclaimed_notice_months_before_escheat months before; once escheated the member claims it from the state, never from Cedar
      Fork.
    eligibility:
      - id: stale_period_elapsed
        applies_to: [capital_check_void]
        kind: time
        condition: An uncashed check may be voided as stale_dated only after check_stale_days calendar days have passed since the check was issued.
        evidence_fields: [capital_ledger.entry_date, capital_ledger.capital_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [capital_ledger.capital_entry_id]
          action_bindings:
            capital_ledger.capital_entry_id: original_entry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the check was issued
          anchor_source: capital_ledger.entry_date
          relation: not_before
          duration_source: variants.check_stale_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the check's entry_date, the last day being the last day of the count.
          boundary: inclusive
      - id: one_void_per_check
        applies_to: [capital_check_void]
        kind: dedup
        condition: A check payout is voided only once.
        evidence_fields: [capital_ledger.original_entry_id, capital_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [capital_ledger.original_entry_id]
          action_bindings:
            capital_ledger.original_entry_id: original_entry_id
        dedup_contract:
          table: capital_ledger
          mode: separate_record
          object_bindings: {original_entry_id: original_entry_id}
          duplicate_filters: {event_type: [capital_check_void]}
          distinct_fields: []
    measures: [capital_msr_reissues]
  - id: capital_evt_account_status
    subject: [capital_inactivate, capital_reactivate, capital_fully_retire]
    rule: >-
      A capital account becomes inactive on the final date of the member's last service account billed on a schedule of the
      class, and active again when the member connects service on such a schedule. An account becomes fully_retired only when
      its unretired_balance and its payable_balance are both exactly zero. Moving, closing service or transferring a location
      to another member never moves capital credits to the new holder; they stay with the member who bought the power.
    eligibility: []
  - id: capital_evt_donation
    subject: [capital_donation_election, capital_disbursement]
    rule: >-
      Where donation_allowed is true a member may elect that future payouts be donated to one of donation_recipients, or cancel
      the election; the election applies to payouts made after it is recorded and is never applied retroactively to a payout
      already made. A donated payout is a disbursement with method donation and pays nothing to the member. An estate's payout
      is never donated without the claimant's own election on the estate application. Payouts to a class where
      form_1099_patr_required is true are reported on Form 1099-PATR when the member's calendar-year payouts reach
      form_1099_patr_threshold.
      Backup withholding of backup_withholding_pct percent is taken from a reportable payout only when no taxpayer
      identification number is on file.
    eligibility: []

