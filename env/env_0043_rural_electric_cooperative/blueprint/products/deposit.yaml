category: deposit
display_name: Security Deposits

binding:
  holding_table: deposit_accounts
  event_tables: [deposit_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {held_amount: deposit_held, accrued_interest: accrued_interest}

lifecycle:
  states: [assessed, partially_paid, held, waived, refunded, applied, cancelled]
  transitions:
    - {from: assessed, to: partially_paid, by: system, means: The first installment of an installment deposit posted.}
    - {from: assessed, to: held, by: system, means: The full required amount posted in one payment.}
    - {from: partially_paid, to: held, by: system, means: The last installment posted and the full required amount is held.}
    - {from: assessed, to: waived, by: agent, means: Waiver evidence on file satisfies a waiver rule before any payment, so no deposit is collected.}
    - {from: held, to: refunded, by: agent, means: The good-payment review was satisfied and the deposit with its interest was refunded.}
    - {from: held, to: applied, by: system, means: The deposit was applied to the final bill or released into a PrePay Power enrollment.}
    - {from: partially_paid, to: applied, by: system, means: The service account was final billed or enrolled in PrePay Power before the deposit was complete and the part paid was applied.}
    - {from: assessed, to: cancelled, by: system, means: The service application was withdrawn before energization, or the assessment was replaced, before any payment.}
    - {from: partially_paid, to: cancelled, by: system, means: The service application was withdrawn before energization after part of the deposit was paid.}
    - {from: held, to: cancelled, by: system, means: The service application was withdrawn before energization after the deposit was paid in full.}

accounts:
  - key: deposit_held
    unit: USD
    meaning: Cash security deposit the cooperative holds for one deposit record; in = deposit payments and installments, out = refunds and applications to a bill or a prepay balance.
  - key: accrued_interest
    unit: USD
    meaning: Simple interest accrued on the cash held and not yet paid out; in = interest accruals, out = interest paid out by bill credit or check.

parameter_schema:
  eligible_rate_schedules: Entry - official rate schedule names of service accounts assessed on the tier; list.
  assessment_bases: Entry - assessment_basis values for which the tier is used; list.
  deposit_basis: Amount - which monthly bill the deposit is a multiple of; average_bill = the average monthly bill over the lookback, highest_bill = the highest monthly bill in the lookback.
  deposit_multiple: Amount - multiple of the basis bill that sets the deposit; number.
  bill_lookback_months: Amount - billing periods immediately before the assessment that the basis bill is taken from; integer.
  min_history_months: Amount - billing periods of history the location must have for the bill basis to be used; integer; with less history the new-service estimate applies.
  new_service_estimated_deposit: Amount - flat deposit when the location has less than min_history_months of history, USD.
  new_service_estimate_per_kva: Amount - deposit per kVA of installed transformer capacity when history is short, USD per kVA; the higher of this product and the flat estimate applies.
  minimum_deposit: Amount - floor on one assessment, USD.
  maximum_deposit: Amount - ceiling on all deposits held or billed on one service account together, USD.
  rounding_increment: Amount - the computed deposit is rounded up to the next multiple of this amount, USD.
  installments_allowed: Payment - whether the deposit may be paid in installments; boolean.
  installment_count: Payment - number of installments when installments are allowed (1 = due in full); integer.
  first_installment_pct: Payment - percent of the required amount due as the first installment, rounded to the cent; the remainder is split evenly over the remaining installments, the last one absorbing any cent difference.
  deposit_due_days: Payment - calendar days from the assessed_date to the due date of the full deposit or the first installment; later installments fall due with the next monthly bills.
  deposit_due_before_connect: Payment - whether the full deposit or first installment must be paid before the meter is energized; boolean.
  installment_default_accelerates: Payment - whether an installment unpaid at its due date makes the whole unpaid remainder due at once; boolean.
  deposit_payment_channels: Payment - channels a deposit may be paid through; list.
  interest_applies: Interest - whether cash deposits on the tier earn interest; boolean.
  interest_rate_by_year: Interest - annual simple interest rate in percent for each calendar year, as set by the state public service commission; mapping year -> percent.
  interest_day_count: Interest - days in the year used to prorate interest; integer.
  interest_compounding: Interest - interest method; simple means interest never earns interest.
  interest_payout_method: Interest - how the year's accrued interest is paid out; bill_credit or check.
  interest_payout_month: Interest - calendar month whose bill carries the prior year's interest credit; integer 1-12.
  refund_good_payment_months: Refund - full calendar months after paid_in_full_date before a deposit is reviewed for refund; integer.
  late_charges_allowed_in_period: Refund - most late payment charges allowed on the service account in the review window for a refund; integer.
  returned_payments_allowed_in_period: Refund - most returned payments allowed in the review window for a refund; integer.
  reconnects_allowed_in_period: Refund - most reconnections after nonpayment (reconnect fees billed) allowed in the review window for a refund; integer.
  refund_method_default: Refund - how a refund is paid unless the member asks otherwise; bill_credit or check.
  refund_check_on_request_min: Refund - smallest refund that is paid by check when the member asks for a check instead of the default, USD.
  prior_utility_letter_waiver: Waiver - whether a letter of good payment history from the member's previous electric utility waives the deposit; boolean.
  prior_utility_letter_months: Waiver - months of history the prior-utility letter must cover; integer.
  prior_utility_letter_max_late: Waiver - most late payments the prior-utility letter may show; integer.
  prior_utility_letter_max_age_days: Waiver - largest age, in calendar days before the assessed_date, of the prior-utility letter; integer.
  coop_history_waiver: Waiver - whether good payment history on another Cedar Fork service account of the same member waives the deposit; boolean.
  coop_history_months: Waiver - months of good payment history required on that other account; integer.
  surety_bond_accepted: Waiver - whether a surety bond for the required amount may stand in place of a cash deposit; boolean.
  letter_of_credit_accepted: Waiver - whether an irrevocable bank letter of credit for the required amount may stand in place of a cash deposit; boolean.
  security_instrument_min_term_months: Waiver - shortest remaining term of a surety bond or letter of credit accepted, in months; integer.
  security_instrument_renewal_notice_days: Waiver - calendar days before a bond or letter of credit expires at which the member is asked for a renewal; integer.
  reassessment_allowed: Reassessment - whether an additional deposit may be assessed when usage grows; boolean.
  reassess_usage_increase_pct: Reassessment - percent by which the current average monthly bill must exceed the bill basis of the existing deposit before an additional deposit is assessed.
  reassess_min_additional: Reassessment - smallest additional deposit assessed, USD; a smaller shortfall is not assessed.
  apply_on_final_bill: Application - whether a held deposit is applied to the final bill; boolean.
  apply_on_prepay_enrollment: Application - whether a held deposit is released into a PrePay Power enrollment; boolean.
  transfer_to_new_location: Application - whether a held deposit may follow the member to a new service account when the old one is final billed with a zero balance; boolean.
  waiver_reinstatement_on_nonpay: Waiver - whether a waived account that is later disconnected for nonpayment is assessed a deposit; boolean.
  refund_on_cancel_days: Cancellation - calendar days within which payments on a cancelled assessment are refunded by check; integer.
  interest_on_partial_year: Interest - whether interest is accrued for the part year up to a refund or application; boolean.
  final_application_order: Application - order in which a deposit is applied to a final bill; oldest_charges_first.

