events:
  - type: light_request
    target: light_rentals
    mutation: create
    meaning: A member requests a rental light billed on one of the member's service accounts.
    grain: One row per light requested.
    fields:
      customer_id: Member renting the light.
      service_account_id: Service account the rental is billed on.
      variant_name: Official fixture.
      requested_date: Date of the request.
      pole_count: Additional poles to be set for the light.
      contract_term_months: Minimum rental term agreed, months.
      location_description: Where the light is to be mounted, as described by the member.
    triggers: []
  - type: light_install
    target: light_rentals
    mutation: {transition: {from: requested, to: active}}
    meaning: The fixture is installed and billing starts.
    grain: One row per transaction on the rental.
    fields:
      installed_date: Date installed.
      fixture_number: Fixture number tagged on the pole.
    triggers: []
  - type: light_monthly_rental
    target: light_events
    meaning: The rental of one billing period is billed on the service account.
    grain: One row per billing period per light.
    distinguish_by: [billing_period]
    fields:
      entry_date: Bill date.
      billing_period: Billing period, YYYY-MM.
      amount: Rental billed, poles included and prorated where applicable, positive.
    triggers:
      - event: service:service_program_charge
        map: {charge_component: area_light_rental, billing_period: billing_period, amount: amount, charge_date: entry_date, source_reference_id: light_rental_id}
  - type: light_install_charge
    target: light_events
    meaning: A one-time charge for a light (additional pole, underground feed, shield, member pole inspection, relocation, vandalism or pole damage, early removal, or cancellation after staking).
    grain: One row per charge occurrence.
    distinguish_by: [charge_type, entry_date]
    fields:
      entry_date: Date incurred.
      charge_type: Which charge this is.
      quantity: Poles or feet charged (1 for single charges).
      amount: Charge, positive.
    triggers:
      - event: service:service_program_charge
        map: {charge_component: area_light_charge, amount: amount, charge_date: entry_date, source_reference_id: light_rental_id}
  - type: light_outage_report
    target: light_events
    meaning: A member reports a light out, cycling, burning by day, damaged or on a leaning pole.
    grain: One row per report.
    distinguish_by: [entry_date, trouble_type]
    fields:
      entry_date: Date reported.
      report_channel: How it was reported.
      trouble_type: What was reported.
    triggers: []
  - type: light_out
    target: light_rentals
    mutation: {transition: {from: active, to: out_of_service}}
    meaning: A report is confirmed and a repair order opened.
    grain: One row per transaction on the rental.
    fields:
      out_of_service_date: Date of the confirmed report.
    triggers: []
  - type: light_repair
    target: light_rentals
    mutation: {transition: {from: out_of_service, to: active}}
    meaning: The light is repaired.
    grain: One row per transaction on the rental.
    fields:
      last_repair_date: Date repaired.
      out_of_service_date: Cleared to empty.
    triggers: []
  - type: light_outage_credit
    target: light_events
    meaning: Rental is credited for days a confirmed light-out stayed unrepaired past the credit threshold.
    grain: One row per outage per billing period credited.
    distinguish_by: [billing_period, report_event_id]
    fields:
      entry_date: Date credited.
      billing_period: Billing period credited.
      report_event_id: The confirmed report the credit is for.
      credit_days: Calendar days out credited in the period.
      period_days: Days in the billing period.
      amount: Credit, positive.
    triggers:
      - event: service:service_bill_credit
        map: {credit_reason: area_light_outage_credit, charge_component: bill_credit, billing_period: billing_period, amount: amount, charge_date: entry_date, source_reference_id: light_rental_id}
  - type: light_removal_request
    target: light_rentals
    mutation:
      transition:
        - {from: active, to: removal_pending}
        - {from: out_of_service, to: removal_pending}
    meaning: The member confirms a request to remove the light.
    grain: One row per transaction on the rental.
    fields:
      removal_requested_date: Date the member confirmed the removal.
    triggers: []
  - type: light_remove
    target: light_rentals
    mutation: {transition: {from: removal_pending, to: removed}}
    meaning: The fixture is removed.
    grain: One row per transaction on the rental.
    fields:
      removed_date: Date removed.
    triggers: []
  - type: light_cancel
    target: light_rentals
    mutation: {transition: {from: requested, to: cancelled}}
    meaning: The member cancels a request before installation.
    grain: One row per transaction on the rental.
    fields:
      removed_date: Date of the cancellation.
    triggers: []
  - type: light_conversion
    target: light_rentals
    mutation: update
    meaning: A legacy fixture is replaced by its LED conversion target at the cooperative's initiative.
    grain: One row per transaction on the rental.
    fields:
      variant_name: Official name of the LED fixture.
      fixture_number: New fixture number.
    triggers: []
  - type: light_transfer
    target: light_rentals
    mutation: update
    meaning: The rental moves with the location to the new member's service account.
    grain: One row per transaction on the rental.
    fields:
      customer_id: New member renting the light.
      service_account_id: New member's service account at the location.
    triggers: []

measures:
  - id: light_msr_lights_on_account
    window: Point in time, on the service account the light would be billed on.
    measure: Count of light rentals on the service account in requested, active, out_of_service or removal_pending status.
  - id: light_msr_months_installed
    window: From the installed_date to the removal date, on the rental.
    measure: Whole calendar months elapsed, counted to the same day number of the later month.

policies:
  - id: light_agg_multi_holding
    subject: [light_request]
    rule: >-
      A member may rent any number of lights, each light being its own rental billed on one of the member's service accounts;
      a farm yard, a shop and a church lot may each carry several.
    eligibility: []
    params:
      max_per_customer: null
  - id: light_agg_service_account_cap
    subject: [light_request, light_transfer]
    rule: >-
      Lights are counted per billing service account. A light may be added to a service account only while
      light_msr_lights_on_account is below max_lights_per_service_account; a member who wants more must bill them on another of
      the member's service accounts or take a metered lighting service. Lights of different service accounts are never pooled.
    eligibility:
      - id: within_account_cap
        applies_to: [light_request, light_transfer]
        kind: authorization
        condition: A light may be added to a service account only while light_msr_lights_on_account is below max_lights_per_service_account; a member who wants more must bill them on another of the member's service accounts or take a metered lighting service.
        evidence_fields: [light_rentals.service_account_id, light_rentals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [light_rentals.service_account_id]
          action_bindings:
            light_rentals.service_account_id: service_account_id
    measures: [light_msr_lights_on_account]
  - id: light_evt_request_install
    subject: [light_request, light_install, light_cancel]
    rule: >-
      A light is requested only for a fixture whose new_installation_available is true, billed on a service account whose rate
      schedule is in eligible_rate_schedules. A light may be requested only on a service account in active or idle status.
      Where a new pole is needed and easement_required_for_new_pole is true, installation waits for the signed easement; no
      more than max_additional_poles are set and no overhead span exceeds overhead_span_max_feet. The light is installed
      within install_target_business_days of a complete request. The member may cancel before installation; a cancellation
      after the location was staked bears cancellation_after_staking_fee.
      A light is rented only to a member whose member_type is in eligible_member_types, and where
      requires_active_service_account is true the billing account must be open. Additional poles are set at
      standard_pole_height_ft, and a shield is added only where shield_available is true.
    eligibility:
      - id: billing_account_open
        applies_to: [light_request]
        kind: state
        condition: A light may be requested only on a service account in active or idle status.
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active, idle]
  - id: light_evt_rental_billing
    subject: [light_monthly_rental]
    rule: >-
      Each billing period a light bills monthly_rental plus additional_pole_monthly for each additional pole, prorated by days
      in the first and last periods where rental_proration_first_month and rental_proration_last_month are true, with the
      power cost adjustment on estimated_monthly_kwh where pca_applies_per_kwh and sales tax following the service account's
      schedule. Rental is billed only while the light is active, out_of_service or removal_pending. Rental continues while the
      service account is idle where billing_during_seasonal_idle is true, and is suspended for periods the service account is
      disconnected for nonpayment where suspend_on_nonpay_disconnect is true.
      Where energy_included_in_rental is true no separate energy line is billed; estimated_monthly_kwh is input_watts times
      dusk_to_dawn_annual_hours divided by twelve thousand, rounded to the whole kWh, and where tax_follows_service_schedule
      is true the tax rate is that of the billing service account's schedule.
    eligibility:
      - id: light_billable
        applies_to: [light_monthly_rental]
        kind: state
        condition: Rental is billed only while the light is active, out_of_service or removal_pending.
        evidence_fields: [light_rentals.status, light_rentals.light_rental_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [light_rentals.light_rental_id]
          action_bindings:
            light_rentals.light_rental_id: light_rental_id
        state_contract:
          field: light_rentals.status
          allowed: [active, out_of_service, removal_pending]
    params:
      per_tier:
        LED 40W Security Light: {monthly_rental: "=monthly_rental", additional_pole_monthly: "=additional_pole_monthly"}
        LED 70W Area Light: {monthly_rental: "=monthly_rental", additional_pole_monthly: "=additional_pole_monthly"}
        LED 110W Flood Light: {monthly_rental: "=monthly_rental", additional_pole_monthly: "=additional_pole_monthly"}
        LED 150W Flood Light: {monthly_rental: "=monthly_rental", additional_pole_monthly: "=additional_pole_monthly"}
        HPS 100W Security Light: {monthly_rental: "=monthly_rental", additional_pole_monthly: "=additional_pole_monthly"}
        HPS 250W Flood Light: {monthly_rental: "=monthly_rental", additional_pole_monthly: "=additional_pole_monthly"}
        Mercury Vapor 175W Security Light: {monthly_rental: "=monthly_rental", additional_pole_monthly: "=additional_pole_monthly"}
    formula:
      rental_amount: round(monthly_rental + pole_count * additional_pole_monthly, 2)
  - id: light_evt_one_time_charges
    subject: [light_install_charge]
    rule: >-
      One-time charges are billed only for what the crew actually did or the member caused: additional_pole_install_charge per
      additional pole, underground_feed_per_foot per foot of underground feed where underground_feed_allowed, shield_install_charge
      for a shield, customer_pole_inspection_fee for a member-owned pole where customer_owned_pole_allowed, relocation_charge for a
      relocation where relocation_allowed, vandalism_repair_charge or member_damage_pole_charge when the damage was caused by the
      member or the member's guests, equipment or vehicles, and cancellation_after_staking_fee. Mounting on an existing
      cooperative pole costs install_charge_existing_pole. Lamp and photocell failures are never charged where
      photocell_replacement_free is true, and storm or third-party damage is never charged to the member.
    eligibility: []
  - id: light_evt_outage_repair
    subject: [light_outage_report, light_out, light_repair]
    rule: >-
      A light-out may be reported through any of outage_report_channels; reporting is free. A confirmed report opens a repair
      order and the light is repaired within repair_target_business_days, during business hours only where repair_after_hours
      is false. A further report on a light already out_of_service is recorded but opens no second repair order.
    eligibility: []
  - id: light_evt_outage_credit
    subject: [light_outage_credit]
    rule: >-
      When a confirmed light-out stays unrepaired more than outage_credit_after_business_days business days after the
      out_of_service_date, the rental is credited under outage_credit_method for every calendar day from the out_of_service_date
      through the day before the repair, period by period. A light whose outage was caused by the member's damage earns no credit.
    eligibility: []
    formula:
      credit_amount: round(monthly_rental * credit_days / period_days, 2)
  - id: light_evt_removal
    subject: [light_removal_request, light_remove, light_install_charge]
    rule: >-
      Removing a light is the member's own decision and is made only on the member's confirmed request; the light is removed
      within removal_target_business_days. A light removed before min_contract_months have passed since installation is charged
      the remaining whole months of the term times monthly_rental (light_msr_months_installed), but never more than
      early_removal_cap; a light removed at the cooperative's initiative, or after the term, carries no removal charge.
    eligibility: []
    params:
      per_tier:
        LED 40W Security Light: {min_contract_months: "=min_contract_months", early_removal_cap: "=early_removal_cap"}
        LED 70W Area Light: {min_contract_months: "=min_contract_months", early_removal_cap: "=early_removal_cap"}
        LED 110W Flood Light: {min_contract_months: "=min_contract_months", early_removal_cap: "=early_removal_cap"}
        LED 150W Flood Light: {min_contract_months: "=min_contract_months", early_removal_cap: "=early_removal_cap"}
        HPS 100W Security Light: {min_contract_months: "=min_contract_months", early_removal_cap: "=early_removal_cap"}
        HPS 250W Flood Light: {min_contract_months: "=min_contract_months", early_removal_cap: "=early_removal_cap"}
        Mercury Vapor 175W Security Light: {min_contract_months: "=min_contract_months", early_removal_cap: "=early_removal_cap"}
    measures: [light_msr_months_installed]
  - id: light_evt_conversion
    subject: [light_conversion]
    rule: >-
      A legacy fixture (new_installation_available false) is converted at the cooperative's initiative to its
      legacy_conversion_target when it fails or during a scheduled conversion, at conversion_charge. The rental changes to the
      LED fixture's monthly_rental from the next billing period, the contract term does not restart, and a member may not keep a
      failed legacy fixture.
    eligibility: []
  - id: light_evt_transfer
    subject: [light_transfer]
    rule: >-
      Where transfer_with_location is true, a light moves with the location when the location is transferred to a new member,
      but only where transfer_requires_new_member_consent is satisfied by the new member's confirmation; without it the light is
      removed at the cooperative's initiative. The remaining contract term passes to the new member.
    eligibility: []

