category: light
display_name: Area and Security Lighting Rental

binding:
  holding_table: light_rentals
  event_tables: [light_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [requested, active, out_of_service, removal_pending, removed, cancelled]
  transitions:
    - {from: requested, to: active, by: system, means: The crew installed the fixture and rental billing starts.}
    - {from: requested, to: cancelled, by: user, means: The member cancelled the request before installation.}
    - {from: active, to: out_of_service, by: system, means: A light-out or damage report was confirmed and a repair order opened.}
    - {from: out_of_service, to: active, by: system, means: The crew completed the repair.}
    - {from: active, to: removal_pending, by: user, means: The member confirmed a request to have the light removed.}
    - {from: out_of_service, to: removal_pending, by: user, means: The member confirmed a request to have a broken light removed rather than repaired.}
    - {from: removal_pending, to: removed, by: system, means: The crew removed the fixture and rental billing ended.}

# Area light rentals and charges are billed on the member's service account as program charges and outage credits are
# posted there as bill credits; the light rental itself carries no balance of its own.
accounts: []

parameter_schema:
  monthly_rental: Rate - monthly rental of the fixture, energy included, USD.
  estimated_monthly_kwh: Rate - kWh per month assumed for the fixture for the power cost adjustment; integer.
  input_watts: Product - input power of the fixture including any ballast, watts; integer.
  energy_included_in_rental: Rate - whether the rental includes the energy; boolean.
  pca_applies_per_kwh: Rate - whether the power cost adjustment is billed on estimated_monthly_kwh; boolean.
  tax_follows_service_schedule: Rate - whether sales tax on the rental follows the sales tax percentage of the service account's schedule; boolean.
  standard_pole_height_ft: Product - height of the standard wood pole for the fixture, feet; integer.
  dusk_to_dawn_annual_hours: Product - annual burning hours of a photocell-controlled fixture; integer.
  new_installation_available: Install - whether the fixture is installed new; boolean (legacy fixtures are maintained only).
  legacy_conversion_target: Conversion - official name of the LED fixture a legacy fixture is converted to (its own name for LED fixtures).
  conversion_charge: Conversion - charge to the member for a cooperative-initiated LED conversion, USD.
  min_contract_months: Contract - minimum rental term from installation, months; 0 where none applies.
  early_removal_cap: Contract - most charged for removing the light before the minimum term ends, USD.
  install_charge_existing_pole: Install - charge to mount the fixture on an existing cooperative pole, USD.
  additional_pole_install_charge: Install - one-time charge for each additional pole set for the light, USD.
  additional_pole_monthly: Rate - monthly rental for each additional pole, USD.
  max_additional_poles: Install - most additional poles set for one light; integer.
  overhead_span_max_feet: Install - longest overhead span from the source pole to the light pole, feet; integer.
  underground_feed_allowed: Install - whether an underground feed may be installed; boolean.
  underground_feed_per_foot: Install - one-time charge per foot of underground feed, USD.
  customer_owned_pole_allowed: Install - whether the fixture may be mounted on a member-owned pole meeting cooperative specifications; boolean.
  customer_pole_inspection_fee: Install - one-time inspection fee for a member-owned pole, USD.
  shield_available: Install - whether a house-side light shield may be added; boolean.
  shield_install_charge: Install - one-time charge for a shield, USD.
  relocation_allowed: Change - whether an existing light may be relocated; boolean.
  relocation_charge: Change - charge to relocate a light on the same premises, USD.
  install_target_business_days: Service - business days from an easement-complete request to installation; integer.
  cancellation_after_staking_fee: Install - charge when the member cancels after the location was staked, USD.
  repair_target_business_days: Service - business days from a confirmed report to repair; integer.
  repair_after_hours: Service - whether light repairs are made outside business hours; boolean.
  outage_credit_after_business_days: Credit - business days a confirmed light-out may remain unrepaired before rental credit applies; integer.
  outage_credit_method: Credit - prorated_calendar_days means the rental is credited for each calendar day out divided by the days of the billing period.
  photocell_replacement_free: Service - whether photocells and lamps are replaced at no charge; boolean.
  vandalism_repair_charge: Charges - charge when a fixture is damaged by the member or the member's guests, USD.
  member_damage_pole_charge: Charges - charge when a light pole is broken by the member's vehicle or equipment, USD.
  max_lights_per_service_account: Aggregation - most rental lights billed on one service account; integer.
  eligible_rate_schedules: Entry - rate schedules of service accounts a light may be billed on; list.
  eligible_member_types: Entry - member_type values that may rent a light; list.
  requires_active_service_account: Entry - whether the billing service account must be active; boolean.
  easement_required_for_new_pole: Install - whether a signed easement is required before a new pole is set; boolean.
  rental_proration_first_month: Billing - whether the first month's rental is prorated by days installed; boolean.
  rental_proration_last_month: Billing - whether the last month's rental is prorated by days before removal; boolean.
  billing_during_seasonal_idle: Billing - whether the rental continues while the service account is idle; boolean.
  suspend_on_nonpay_disconnect: Billing - whether the light is switched off and its rental suspended while the service account is disconnected for nonpayment; boolean.
  transfer_with_location: Change - whether the light may transfer with the location to a new member; boolean.
  transfer_requires_new_member_consent: Change - whether the new member must confirm taking over the rental; boolean.
  removal_target_business_days: Service - business days from a confirmed removal request to removal; integer.
  outage_report_channels: Service - channels through which a light-out may be reported; list.

