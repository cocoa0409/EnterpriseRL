category: line
display_name: Line Extensions and New Service Construction

binding:
  holding_table: line_projects
  event_tables: [line_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {contribution_due: contribution_due, refundable_advance_balance: refundable_advance}

lifecycle:
  states: [applied, engineering, estimate_issued, estimate_expired, contract_signed, scheduled, energized, closed, cancelled]
  transitions:
    - {from: applied, to: engineering, by: system, means: The engineering design fee posted and a staking engineer was assigned.}
    - {from: engineering, to: estimate_issued, by: system, means: The staking engineer issued the construction estimate and contribution.}
    - {from: estimate_issued, to: contract_signed, by: user, means: The member signed the line extension agreement on the issued estimate.}
    - {from: estimate_issued, to: estimate_expired, by: system, means: The estimate was not signed within its validity period.}
    - {from: estimate_expired, to: engineering, by: agent, means: The member asked for a new estimate and the restaking fee was billed.}
    - {from: contract_signed, to: scheduled, by: agent, means: The required payment, easements and inspection certificate are on file and construction was scheduled.}
    - {from: scheduled, to: energized, by: system, means: Construction was completed and the meter set.}
    - {from: energized, to: closed, by: system, means: The refund period ended or, for a nonrefundable project, the project was closed out after energization.}
    - {from: applied, to: cancelled, by: user, means: The member cancelled the application.}
    - {from: engineering, to: cancelled, by: user, means: The member cancelled during engineering.}
    - {from: estimate_issued, to: cancelled, by: user, means: The member declined the estimate.}
    - {from: contract_signed, to: cancelled, by: user, means: The member cancelled after signing, before construction was scheduled.}
    - {from: scheduled, to: cancelled, by: user, means: The member cancelled before construction started.}

accounts:
  - key: contribution_due
    unit: USD
    meaning: Amount the member owes on the project; in = fees and the contribution billed at signing, out = payments, the design fee credited at signing, and the unpaid contribution written off at cancellation.
  - key: refundable_advance
    unit: USD
    meaning: Part of a refundable-advance contribution still subject to refund as other members connect to the extension; in = the advance recorded when billed, out = refunds to the member and the remainder forfeited at the end of the refund period.

parameter_schema:
  eligible_rate_schedules: Entry - rate schedules the new service may be on for the tier; list.
  membership_required: Entry - whether the applicant must be a Cedar Fork member before engineering starts; boolean.
  allowance_basis: Allowance - footage (free footage), revenue_multiple (a multiple of estimated annual revenue) or none.
  free_footage_allowance_ft: Allowance - feet of extension built at no charge where the basis is footage; integer.
  revenue_multiple_allowance: Allowance - multiple of estimated annual revenue built at no charge where the basis is revenue_multiple.
  single_phase_overhead_per_ft: Cost - single-phase overhead line per foot, USD.
  single_phase_underground_per_ft: Cost - single-phase underground line per foot, USD.
  three_phase_overhead_per_ft: Cost - three-phase overhead line per foot, USD.
  three_phase_underground_per_ft: Cost - three-phase underground line per foot, USD.
  three_phase_available: Entry - whether three-phase construction may be requested on the tier; boolean.
  underground_required: Entry - whether the tier is built underground only; boolean.
  included_transformer_kva: Cost - transformer capacity included in the line cost, kVA; integer.
  transformer_excess_per_kva: Cost - charge per kVA of transformer capacity above the included capacity, USD.
  overhead_loading_pct: Cost - engineering and overhead loading added to the construction cost, percent.
  road_bore_charge: Cost - charge per road or driveway bore, USD.
  right_of_way_clearing_per_ft: Cost - right-of-way tree clearing per foot of overhead line, USD.
  frost_surcharge_per_ft: Cost - surcharge per foot of underground line trenched in frost_months, USD.
  frost_months: Cost - calendar months (1-12) in which the frost surcharge applies; list.
  member_trenching_credit_per_ft: Cost - credit per foot of trench the member digs and backfills to specification, USD.
  max_extension_length_ft: Entry - longest extension built without board approval, feet; integer.
  engineering_design_fee: Fees - fee paid with the application before staking, USD.
  design_fee_credited_on_signing: Fees - whether the design fee is credited against the contribution when the agreement is signed; boolean.
  estimate_valid_days: Contract - calendar days after the estimate date within which the agreement must be signed; integer.
  easement_required: Scheduling - whether recorded easements for every crossed parcel must be on file before scheduling; boolean.
  inspection_certificate_required: Scheduling - whether a state electrical inspection certificate for the member's wiring must be on file before energizing; boolean.
  inspection_validity_days: Scheduling - largest age of the inspection certificate on the energize date, calendar days; integer.
  contribution_type: Contribution - nonrefundable_ciac or refundable_advance.
  refund_period_months: Refund - months after energization during which refunds are made on a refundable advance; integer.
  refund_basis: Refund - allowance_of_connecting_member means each new permanent member connecting to the extension earns a refund equal to that member's own allowance; none where no refunds apply.
  max_refund_pct: Refund - largest share of the advance that can be refunded, percent.
  advance_refund_review_month: Refund - calendar month in which refunds earned in the prior year are paid; integer.
  installment_allowed: Payment - whether the contribution may be paid in monthly installments after the scheduling payment; boolean.
  installment_max_months: Payment - most monthly installments; integer.
  payment_before_scheduling_pct: Payment - percent of the contribution that must be paid before construction is scheduled.
  contract_term_months: Contract - months the member agrees to take service at the location, with any shortfall billed on early termination; integer.
  temporary_service_fee: Fees - flat fee for a temporary construction service, USD.
  temporary_service_max_months: Contract - longest a temporary service may stay connected, months; integer.
  temporary_conversion_credit: Fees - credit against a permanent extension when a temporary service is converted to it at the same site, USD.
  energize_target_business_days: Service - business days from scheduling to energization; integer.
  change_order_fee: Fees - fee for a member-requested design change after the estimate, USD.
  restaking_fee: Fees - fee for a new estimate after the first estimate expired, USD.
  cancellation_engineering_fee_retained: Cancellation - whether the design fee is kept when the member cancels; boolean.
  cancellation_refund_days: Cancellation - calendar days within which payments beyond costs incurred are refunded after a cancellation; integer.
  meter_base_supplied_by_coop: Scope - whether the cooperative supplies the meter base for the member's electrician to install; boolean.
  allowance_transferable: Allowance - whether an unused allowance may be moved to another project; boolean.
  service_entrance_by_member: Scope - whether the service entrance, weatherhead and wiring are the member's responsibility; boolean.
  member_supplied_pole_allowed: Scope - whether the member may supply the service pole; boolean.
  estimate_revision_threshold_pct: Change - percent change in the estimate from a change order above which a new estimate with a new validity period is issued.

