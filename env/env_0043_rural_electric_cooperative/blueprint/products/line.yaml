events:
  - type: line_apply
    target: line_projects
    mutation: create
    meaning: A member applies for a line extension or new service construction at a location.
    grain: One row per construction project.
    fields:
      customer_id: Member applying.
      variant_name: Official extension tier.
      application_date: Date of the application.
      service_address: Location to be served, as written on the application.
      service_account_id: The pending service account opened for the location.
    triggers: []
  - type: line_fee_charge
    target: line_ledger
    meaning: A project fee is billed - engineering design, change order, restaking or temporary service.
    grain: One row per fee occurrence.
    distinguish_by: [fee_type, entry_date]
    fields:
      entry_date: Date billed.
      fee_type: Which fee.
      amount: Fee, positive.
    account: contribution_due
    direction: in
    triggers: []
  - type: line_start_engineering
    target: line_projects
    mutation:
      transition:
        - {from: applied, to: engineering}
        - {from: estimate_expired, to: engineering}
    meaning: A staking engineer is assigned after the design fee, or after the restaking fee on an expired estimate.
    grain: One row per transaction on the project.
    fields:
      engineering_start_date: Date engineering started.
    triggers: []
  - type: line_estimate
    target: line_projects
    mutation: {transition: {from: engineering, to: estimate_issued}}
    meaning: The construction estimate, allowance and contribution are issued.
    grain: One row per transaction on the project.
    fields:
      estimate_date: Date of the estimate.
      overhead_feet: Overhead line to be built, feet.
      underground_feet: Underground line to be built, feet.
      three_phase: Whether the line is three-phase.
      transformer_kva: Transformer capacity to be installed, kVA.
      estimate_amount: Estimated construction cost with loading, USD.
      allowance_amount: Allowance applied, USD.
      contribution_amount: Contribution the member must pay, USD.
    triggers: []
  - type: line_estimate_expire
    target: line_projects
    mutation: {transition: {from: estimate_issued, to: estimate_expired}}
    meaning: The estimate validity period ends unsigned.
    grain: One row per transaction on the project.
    fields:
      estimate_date: Kept as issued.
    triggers: []
  - type: line_contract_sign
    target: line_projects
    mutation: {transition: {from: estimate_issued, to: contract_signed}}
    meaning: The member signs the line extension agreement.
    grain: One row per transaction on the project.
    fields:
      contract_signed_date: Date signed.
    triggers:
      - event: line:line_contribution_bill
        map: {entry_date: contract_signed_date}
  - type: line_contribution_bill
    target: line_ledger
    meaning: The contribution on the signed estimate is billed to the project.
    grain: One row per signed estimate.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date billed.
      contribution_type: Nonrefundable contribution in aid of construction or refundable advance.
      amount: Contribution billed, positive.
    account: contribution_due
    direction: in
    triggers:
      - event: line:line_advance_record
        when: {contribution_type: refundable_advance}
        map: {entry_date: entry_date, amount: amount}
  - type: line_advance_record
    target: line_ledger
    meaning: A refundable advance becomes subject to refund.
    grain: One row per refundable contribution billed.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date recorded.
      amount: Advance subject to refund, positive.
    account: refundable_advance
    direction: in
    triggers: []
  - type: line_design_fee_credit
    target: line_ledger
    meaning: The engineering design fee already paid is credited against the contribution at signing.
    grain: One row per signed estimate.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date credited.
      amount: Design fee credited, positive.
    account: contribution_due
    direction: out
    triggers: []
  - type: line_payment
    target: line_ledger
    meaning: A payment toward the project's fees or contribution.
    grain: One row per payment transaction.
    distinguish_by: [payment_reference]
    fields:
      entry_date: Posting date.
      payment_reference: Confirmation or check number.
      amount: Amount paid, positive.
    account: contribution_due
    direction: out
    triggers: []
  - type: line_contribution_writeoff
    target: line_ledger
    meaning: At cancellation the unpaid part of the contribution beyond costs incurred is written off.
    grain: One row per cancelled project.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date written off.
      amount: Amount written off, positive.
    account: contribution_due
    direction: out
    triggers: []
  - type: line_schedule
    target: line_projects
    mutation: {transition: {from: contract_signed, to: scheduled}}
    meaning: Construction is scheduled.
    grain: One row per transaction on the project.
    fields:
      scheduled_date: Date construction was scheduled.
    triggers: []
  - type: line_energize
    target: line_projects
    mutation: {transition: {from: scheduled, to: energized}}
    meaning: Construction is complete and the meter is set.
    grain: One row per transaction on the project.
    fields:
      energized_date: Date energized.
    triggers:
      - event: service:service_energize
        map: {connect_date: energized_date, rate_effective_date: energized_date}
  - type: line_advance_refund
    target: line_ledger
    meaning: A refund of the advance is earned because another permanent member connected to the extension.
    grain: One row per connecting service account.
    distinguish_by: [source_reference_id]
    fields:
      entry_date: Date refunded.
      source_reference_id: The connecting member's service account.
      amount: Refund, positive.
    account: refundable_advance
    direction: out
    triggers: []
  - type: line_advance_forfeit
    target: line_ledger
    meaning: At the end of the refund period the unrefunded advance becomes a nonrefundable contribution.
    grain: One row per project.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date forfeited.
      amount: Advance forfeited, positive.
    account: refundable_advance
    direction: out
    triggers: []
  - type: line_change_order
    target: line_projects
    mutation: update
    meaning: The member changes the design after the estimate and the footage and estimate are revised.
    grain: One row per transaction on the project.
    fields:
      overhead_feet: Revised overhead feet.
      underground_feet: Revised underground feet.
      estimate_amount: Revised estimate.
      contribution_amount: Revised contribution.
    triggers:
      - event: line:line_fee_charge
        map: {fee_type: change_order_fee}
  - type: line_cancel
    target: line_projects
    mutation:
      transition:
        - {from: applied, to: cancelled}
        - {from: engineering, to: cancelled}
        - {from: estimate_issued, to: cancelled}
        - {from: contract_signed, to: cancelled}
        - {from: scheduled, to: cancelled}
    meaning: The member cancels the project.
    grain: One row per transaction on the project.
    fields:
      closed_date: Date cancelled.
    triggers: []
  - type: line_close
    target: line_projects
    mutation: {transition: {from: energized, to: closed}}
    meaning: The project is closed out.
    grain: One row per transaction on the project.
    fields:
      closed_date: Date closed.
    triggers: []

measures:
  - id: line_msr_connecting_members
    window: From the energized_date through the end of refund_period_months, on the extension built by the project.
    measure: Count of permanent service accounts of other members energized on the extension, each with its own allowance under its own tier.
  - id: line_msr_member_open_contributions
    window: Point in time, across every project of the member.
    measure: Sum of contribution_due of the member's projects in contract_signed, scheduled or energized status.

policies:
  - id: line_agg_multi_holding
    subject: [line_apply]
    rule: >-
      A member may have several construction projects, one per location to be served; a farm may extend to a home, a bin site
      and a pivot as separate projects. Each project's allowance belongs to that project only: where allowance_transferable is
      false, footage or revenue allowance unused on one project is never moved to another.
    eligibility: []
    params:
      max_per_customer: null
  - id: line_agg_member_contributions
    subject: [line_schedule]
    rule: >-
      Before construction is scheduled the member's other projects are read. Construction may be scheduled only when no other
      project of the member carries a past-due contribution installment, the basis being line_msr_member_open_contributions and
      the installment schedule of each project; the member's final-billed service balances are read under the Electric Service
      charter before the new service account is opened.
    eligibility:
      - id: no_past_due_contribution
        applies_to: [line_schedule]
        kind: authorization
        condition: Construction may be scheduled only when no other project of the member carries a past-due contribution installment, the basis being line_msr_member_open_contributions and the installment schedule of each project; the member's final-billed service balances are read under the Electric Service charter before the new service account is opened.
        evidence_fields: [line_projects.customer_id, line_projects.status, line_projects.contribution_due]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [line_projects.customer_id]
          action_bindings:
            line_projects.customer_id: customer_id
    measures: [line_msr_member_open_contributions]
  - id: line_evt_application
    subject: [line_apply, line_fee_charge, line_start_engineering]
    rule: >-
      An application is taken only from a member where membership_required is true, for a location whose new service fits one
      of the tier's eligible_rate_schedules, and with a pending service account opened for the location. Engineering starts
      once the engineering_design_fee has posted. The member is told at application that the service entrance, weatherhead and
      wiring are the member's where service_entrance_by_member is true, that the cooperative supplies the meter base where
      meter_base_supplied_by_coop is true, and that a member-supplied service pole is accepted only where
      member_supplied_pole_allowed is true. Three-phase construction is accepted only where three_phase_available is true, and an
      extension longer than max_extension_length_ft goes to the board before it is estimated.
    eligibility: []
    params:
      per_tier:
        Permanent Residential Overhead Extension: {engineering_design_fee: "=engineering_design_fee", three_phase_available: "=three_phase_available", max_extension_length_ft: "=max_extension_length_ft"}
        Permanent Residential Underground Extension: {engineering_design_fee: "=engineering_design_fee", three_phase_available: "=three_phase_available", max_extension_length_ft: "=max_extension_length_ft"}
        Seasonal Residence Extension: {engineering_design_fee: "=engineering_design_fee", three_phase_available: "=three_phase_available", max_extension_length_ft: "=max_extension_length_ft"}
        Farm and Ranch Extension: {engineering_design_fee: "=engineering_design_fee", three_phase_available: "=three_phase_available", max_extension_length_ft: "=max_extension_length_ft"}
        Irrigation Well Extension: {engineering_design_fee: "=engineering_design_fee", three_phase_available: "=three_phase_available", max_extension_length_ft: "=max_extension_length_ft"}
        Three-Phase Commercial Extension: {engineering_design_fee: "=engineering_design_fee", three_phase_available: "=three_phase_available", max_extension_length_ft: "=max_extension_length_ft"}
        Temporary Construction Service: {engineering_design_fee: "=engineering_design_fee", three_phase_available: "=three_phase_available", max_extension_length_ft: "=max_extension_length_ft"}
  - id: line_evt_estimate
    subject: [line_estimate]
    rule: >-
      The construction cost is the overhead feet and underground feet at the tier's per-foot cost for the phase built, plus
      transformer_excess_per_kva for each kVA above included_transformer_kva, plus road_bore_charge per bore,
      right_of_way_clearing_per_ft per foot of overhead line, and frost_surcharge_per_ft per foot of underground line trenched in
      frost_months, all increased by overhead_loading_pct and rounded to the cent. Underground construction is required where
      underground_required is true. The allowance is free_footage_allowance_ft at the overhead per-foot cost of the phase built
      where allowance_basis is footage, revenue_multiple_allowance times the estimated annual revenue where it is
      revenue_multiple, and zero where it is none; the allowance never exceeds the cost. The contribution is the cost less the
      allowance, less member_trenching_credit_per_ft for each foot the member trenches, never below zero; on a temporary service
      the temporary_service_fee is billed instead.
      The per-foot costs are single_phase_overhead_per_ft, single_phase_underground_per_ft, three_phase_overhead_per_ft and
      three_phase_underground_per_ft for the line type and phase actually built.
    eligibility: []
    params:
      per_tier:
        Permanent Residential Overhead Extension: {allowance_basis: "=allowance_basis", free_footage_allowance_ft: "=free_footage_allowance_ft", revenue_multiple_allowance: "=revenue_multiple_allowance", included_transformer_kva: "=included_transformer_kva", frost_surcharge_per_ft: "=frost_surcharge_per_ft", member_trenching_credit_per_ft: "=member_trenching_credit_per_ft"}
        Permanent Residential Underground Extension: {allowance_basis: "=allowance_basis", free_footage_allowance_ft: "=free_footage_allowance_ft", revenue_multiple_allowance: "=revenue_multiple_allowance", included_transformer_kva: "=included_transformer_kva", frost_surcharge_per_ft: "=frost_surcharge_per_ft", member_trenching_credit_per_ft: "=member_trenching_credit_per_ft"}
        Seasonal Residence Extension: {allowance_basis: "=allowance_basis", free_footage_allowance_ft: "=free_footage_allowance_ft", revenue_multiple_allowance: "=revenue_multiple_allowance", included_transformer_kva: "=included_transformer_kva", frost_surcharge_per_ft: "=frost_surcharge_per_ft", member_trenching_credit_per_ft: "=member_trenching_credit_per_ft"}
        Farm and Ranch Extension: {allowance_basis: "=allowance_basis", free_footage_allowance_ft: "=free_footage_allowance_ft", revenue_multiple_allowance: "=revenue_multiple_allowance", included_transformer_kva: "=included_transformer_kva", frost_surcharge_per_ft: "=frost_surcharge_per_ft", member_trenching_credit_per_ft: "=member_trenching_credit_per_ft"}
        Irrigation Well Extension: {allowance_basis: "=allowance_basis", free_footage_allowance_ft: "=free_footage_allowance_ft", revenue_multiple_allowance: "=revenue_multiple_allowance", included_transformer_kva: "=included_transformer_kva", frost_surcharge_per_ft: "=frost_surcharge_per_ft", member_trenching_credit_per_ft: "=member_trenching_credit_per_ft"}
        Three-Phase Commercial Extension: {allowance_basis: "=allowance_basis", free_footage_allowance_ft: "=free_footage_allowance_ft", revenue_multiple_allowance: "=revenue_multiple_allowance", included_transformer_kva: "=included_transformer_kva", frost_surcharge_per_ft: "=frost_surcharge_per_ft", member_trenching_credit_per_ft: "=member_trenching_credit_per_ft"}
        Temporary Construction Service: {allowance_basis: "=allowance_basis", free_footage_allowance_ft: "=free_footage_allowance_ft", revenue_multiple_allowance: "=revenue_multiple_allowance", included_transformer_kva: "=included_transformer_kva", frost_surcharge_per_ft: "=frost_surcharge_per_ft", member_trenching_credit_per_ft: "=member_trenching_credit_per_ft"}
    formula:
      contribution: max(0, estimate_amount - allowance_amount)
  - id: line_evt_contract
    subject: [line_contract_sign, line_estimate_expire, line_contribution_bill, line_design_fee_credit]
    rule: >-
      Signing the line extension agreement is the member's own act. The agreement may be signed only within estimate_valid_days
      calendar days after the estimate was issued. Calendar days are counted from the day after the estimate_date, the last day of
      validity being the last day of the count. An unsigned estimate expires and a new estimate requires restaking_fee. On
      signing, the contribution is billed as the tier's contribution_type, and the design fee already paid is credited against it
      where design_fee_credited_on_signing is true. Where contract_term_months is above zero the member agrees to take service at
      the location for that term.
    eligibility:
      - id: estimate_still_valid
        applies_to: [line_contract_sign]
        kind: time
        condition: The agreement may be signed only within estimate_valid_days calendar days after the estimate was issued.
        evidence_fields: [line_projects.estimate_date, line_projects.line_project_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [line_projects.line_project_id]
          action_bindings:
            line_projects.line_project_id: line_project_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the estimate was issued
          anchor_source: line_projects.estimate_date
          relation: not_after
          duration_source: variants.estimate_valid_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the estimate_date, the last day of validity being the last day of the count.
          boundary: inclusive
    params:
      per_tier:
        Permanent Residential Overhead Extension: {contribution_type: "=contribution_type", design_fee_credited_on_signing: "=design_fee_credited_on_signing"}
        Permanent Residential Underground Extension: {contribution_type: "=contribution_type", design_fee_credited_on_signing: "=design_fee_credited_on_signing"}
        Seasonal Residence Extension: {contribution_type: "=contribution_type", design_fee_credited_on_signing: "=design_fee_credited_on_signing"}
        Farm and Ranch Extension: {contribution_type: "=contribution_type", design_fee_credited_on_signing: "=design_fee_credited_on_signing"}
        Irrigation Well Extension: {contribution_type: "=contribution_type", design_fee_credited_on_signing: "=design_fee_credited_on_signing"}
        Three-Phase Commercial Extension: {contribution_type: "=contribution_type", design_fee_credited_on_signing: "=design_fee_credited_on_signing"}
        Temporary Construction Service: {contribution_type: "=contribution_type", design_fee_credited_on_signing: "=design_fee_credited_on_signing"}
  - id: line_evt_scheduling
    subject: [line_schedule, line_payment, line_energize]
    rule: >-
      Construction is scheduled only when payments reach payment_before_scheduling_pct percent of the contribution, every
      recorded easement is on file where easement_required is true, and the project is in contract_signed status. Where
      installment_allowed is true the rest of the contribution is paid in up to installment_max_months equal monthly installments
      invoiced on the project. The meter is set only when a state electrical inspection certificate dated no more than
      inspection_validity_days before the energize date is on file where inspection_certificate_required is true. Energization is
      targeted within energize_target_business_days of scheduling and starts billing on the pending service account.
    eligibility:
      - id: scheduling_prerequisites
        applies_to: [line_schedule]
        kind: authorization
        condition: Construction is scheduled only when payments reach payment_before_scheduling_pct percent of the contribution, every recorded easement is on file where easement_required is true, and the project is in contract_signed status.
        evidence_fields: [line_projects.line_project_id, line_projects.easement_on_file, line_projects.contribution_amount, line_ledger.amount, line_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [line_projects.line_project_id]
          action_bindings:
            line_projects.line_project_id: line_project_id
    params:
      per_tier:
        Permanent Residential Overhead Extension: {payment_before_scheduling_pct: "=payment_before_scheduling_pct", installment_allowed: "=installment_allowed", installment_max_months: "=installment_max_months"}
        Permanent Residential Underground Extension: {payment_before_scheduling_pct: "=payment_before_scheduling_pct", installment_allowed: "=installment_allowed", installment_max_months: "=installment_max_months"}
        Seasonal Residence Extension: {payment_before_scheduling_pct: "=payment_before_scheduling_pct", installment_allowed: "=installment_allowed", installment_max_months: "=installment_max_months"}
        Farm and Ranch Extension: {payment_before_scheduling_pct: "=payment_before_scheduling_pct", installment_allowed: "=installment_allowed", installment_max_months: "=installment_max_months"}
        Irrigation Well Extension: {payment_before_scheduling_pct: "=payment_before_scheduling_pct", installment_allowed: "=installment_allowed", installment_max_months: "=installment_max_months"}
        Three-Phase Commercial Extension: {payment_before_scheduling_pct: "=payment_before_scheduling_pct", installment_allowed: "=installment_allowed", installment_max_months: "=installment_max_months"}
        Temporary Construction Service: {payment_before_scheduling_pct: "=payment_before_scheduling_pct", installment_allowed: "=installment_allowed", installment_max_months: "=installment_max_months"}
  - id: line_evt_advance_refunds
    subject: [line_advance_record, line_advance_refund, line_advance_forfeit, line_close]
    rule: >-
      Where contribution_type is refundable_advance, the whole contribution billed is recorded as an advance subject to refund,
      and each other permanent member who connects to the extension during
      refund_period_months after the energized_date earns the project member a refund under refund_basis, paid in
      advance_refund_review_month of the following year, until refunds reach max_refund_pct percent of the advance. A connection
      after the refund period earns nothing. At the end of the refund period the unrefunded advance is forfeited and the project is
      closed; a nonrefundable project is closed after energization. Refunds go to the member who paid the advance and are never
      assigned to a later owner of the land.
    eligibility: []
    params:
      per_tier:
        Permanent Residential Overhead Extension: {refund_period_months: "=refund_period_months", max_refund_pct: "=max_refund_pct"}
        Permanent Residential Underground Extension: {refund_period_months: "=refund_period_months", max_refund_pct: "=max_refund_pct"}
        Seasonal Residence Extension: {refund_period_months: "=refund_period_months", max_refund_pct: "=max_refund_pct"}
        Farm and Ranch Extension: {refund_period_months: "=refund_period_months", max_refund_pct: "=max_refund_pct"}
        Irrigation Well Extension: {refund_period_months: "=refund_period_months", max_refund_pct: "=max_refund_pct"}
        Three-Phase Commercial Extension: {refund_period_months: "=refund_period_months", max_refund_pct: "=max_refund_pct"}
        Temporary Construction Service: {refund_period_months: "=refund_period_months", max_refund_pct: "=max_refund_pct"}
    measures: [line_msr_connecting_members]
  - id: line_evt_changes_cancellation
    subject: [line_change_order, line_fee_charge, line_cancel, line_contribution_writeoff]
    rule: >-
      A design change requested by the member after the estimate is billed change_order_fee; when it changes the estimate by more
      than estimate_revision_threshold_pct percent a new estimate with a new validity period is issued instead. A member may cancel
      at any time before construction starts. Where cancellation_engineering_fee_retained is true the design fee is kept; costs
      already incurred are kept, the unpaid rest of the contribution is written off, and payments beyond costs incurred are refunded
      within cancellation_refund_days. A temporary service is disconnected after temporary_service_max_months, and
      temporary_conversion_credit is credited when it is converted to a permanent extension at the same site.
    eligibility: []

