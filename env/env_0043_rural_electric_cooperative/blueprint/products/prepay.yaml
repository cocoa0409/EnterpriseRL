category: prepay
display_name: PrePay Power (Prepaid Metering)

binding:
  holding_table: prepay_accounts
  event_tables: [prepay_ledger, prepay_notifications]
  intake_tables: [prepay_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {prepaid_balance: prepaid_balance, arrears_balance: arrears_balance}

lifecycle:
  states: [pending_activation, active, disconnected_low_balance, converted, closed]
  transitions:
    - {from: pending_activation, to: active, by: system, means: The signed PrePay Power agreement is on file and the activation payment posted, so the meter is switched to prepay mode and daily billing starts.}
    - {from: pending_activation, to: closed, by: system, means: The enrollment was not activated within the activation window and lapses; the service account stays on standard billing.}
    - {from: active, to: disconnected_low_balance, by: system, means: The prepaid balance fell to the disconnect threshold inside a permitted disconnect window and the meter was remotely disconnected.}
    - {from: disconnected_low_balance, to: active, by: system, means: A payment brought the prepaid balance to the reconnect threshold and the meter was remotely reconnected.}
    - {from: active, to: converted, by: user, means: The member confirmed leaving PrePay Power and the service account returns to standard monthly billing.}
    - {from: active, to: closed, by: system, means: The underlying service account was final billed while on PrePay Power.}
    - {from: disconnected_low_balance, to: closed, by: system, means: The account stayed disconnected for low balance past the finaling period and the enrollment was closed.}

accounts:
  - key: prepaid_balance
    unit: USD
    meaning: Money available on the prepay account to pay daily charges; in = payment portions, deposit transfers and credit adjustments, out = daily charges and refunds or transfers at exit; may run negative while daily fixed charges continue during a disconnection.
  - key: arrears_balance
    unit: USD
    meaning: Unpaid standard-billing debt moved onto the prepay account at enrollment and being recovered from each payment; in = arrears transfers, out = recovery portions of payments and the unrecovered remainder returned to standard billing at exit.

parameter_schema:
  eligible_rate_schedules: Entry - official rate schedule names of the underlying service account that may enroll in the tier; list of strings.
  eligible_member_types: Entry - member_type values of the member profile that may enroll in the tier; list.
  required_meter_type: Entry - meter_type the service account must carry; enum value.
  min_transferred_arrears: Entry - lowest total arrears transferred at enrollment for the tier, USD.
  max_transferred_arrears: Entry - highest total arrears transferred at enrollment for the tier, USD.
  arrears_recovery_pct: Recovery - percent of each gross payment applied to the arrears balance while it is above zero.
  arrears_recovery_min_per_payment: Recovery - smallest recovery portion taken from one payment while arrears remain, USD.
  activation_payment_min: Activation - smallest activation payment, applied in full to the prepaid balance, USD.
  activation_window_days: Activation - calendar days from enrollment within which the account must be activated.
  min_payment_amount: Payments - smallest single payment accepted, USD.
  max_payment_amount: Payments - largest single payment accepted, USD.
  payment_channels_allowed: Payments - payment channels accepted on the tier; list of channel values.
  daily_facility_charge: Daily charges - fixed facility charge deducted every calendar day, USD per day.
  program_fee_monthly: Daily charges - PrePay Power program fee deducted on the first day of each calendar month, USD.
  energy_rate_source: Daily charges - where the per-kWh price comes from; underlying_schedule_block1 means the block 1 energy rate of the underlying rate schedule applies to every kWh.
  disconnect_threshold_balance: Disconnect - prepaid balance at or below which the meter is disconnected inside a permitted window, USD.
  reconnect_threshold_balance: Reconnect - prepaid balance at or above which a disconnected meter is reconnected, USD.
  low_balance_alert_default: Alerts - low-balance alert amount set at enrollment when the member names none, USD.
  low_balance_alert_min: Alerts - lowest low-balance alert amount a member may choose, USD.
  low_balance_alert_max: Alerts - highest low-balance alert amount a member may choose, USD.
  low_balance_alert_repeat_hours: Alerts - elapsed hours before a further low-balance alert is sent while the balance stays below the alert amount.
  alert_channels_allowed: Alerts - alert channels the member may choose on the tier; list.
  disconnect_warning_days: Alerts - projected days of balance remaining at which a disconnect warning is sent.
  warning_lead_hours: Disconnect - elapsed hours that must pass after the most recent disconnect warning before a disconnection.
  usage_history_days_for_projection: Alerts - number of preceding days whose daily charges are averaged to project days remaining.
  disconnect_window_start: Disconnect - earliest local time of day a low-balance disconnection may run, HH:MM.
  disconnect_window_end: Disconnect - latest local time of day a low-balance disconnection may run, HH:MM.
  disconnect_weekends: Disconnect - whether low-balance disconnections run on Saturdays and Sundays; boolean.
  disconnect_holidays: Disconnect - whether low-balance disconnections run on cooperative holidays; boolean.
  friday_disconnect_cutoff: Disconnect - local time on Fridays after which no low-balance disconnection runs, HH:MM.
  weather_hold_applies: Disconnect - whether disconnections are suspended on weather-hold days; boolean.
  cold_hold_temp_f: Disconnect - forecast low, in degrees Fahrenheit, at or below which the day is a weather-hold day.
  heat_hold_temp_f: Disconnect - forecast high, in degrees Fahrenheit, at or above which the day is a weather-hold day.
  deposit_required: Combination - whether a security deposit is required while on the tier; boolean.
  existing_deposit_disposition: Combination - what happens to a deposit already held at enrollment; apply_to_arrears_then_balance means it first reduces the arrears to be transferred and the rest is credited to the prepaid balance.
  medical_certificate_allowed: Combination - whether an account under active medical certificate protection may enroll; boolean.
  budget_billing_compatible: Combination - whether the service account may stay on a Budget Billing plan while on the tier; boolean.
  arrangement_compatible: Combination - whether the service account may keep an active payment arrangement while on the tier; boolean.
  auto_recharge_allowed: Payments - whether automatic card recharge may be set up; boolean.
  auto_recharge_min_amount: Payments - smallest automatic recharge amount, USD.
  enrollment_fee: Enrollment - fee to enroll, USD.
  reconnect_fee: Reconnect - fee for a low-balance reconnection, USD.
  late_charges_apply: Combination - whether late payment charges apply while on the tier; boolean.
  min_months_before_conversion: Exit - full calendar months after activation before the member may convert back to standard billing.
  conversion_deposit_required: Exit - whether converting back to standard billing requires a paid security deposit; boolean.
  conversion_arrears_handling: Exit - treatment of unrecovered arrears at conversion or closing; return_to_service_account means they are billed back on the service account as a program charge.
  reenrollment_wait_days: Enrollment - calendar days after a conversion before the same service account may enroll again.
  disconnected_final_days: Exit - calendar days a low-balance disconnection may last before the enrollment is closed and the service account final billed.
  refund_check_minimum: Exit - smallest remaining prepaid balance refunded by check at closing, USD; a smaller remainder is credited to the service account's final bill.
  max_disconnects_per_30_days: Over-limit - low-balance disconnections in 30 days at which the member is referred to an energy counseling call.
  tier_on_arrears_payoff: Recovery - official tier name the account moves to the day after its arrears balance reaches zero (its own name when no move applies).

