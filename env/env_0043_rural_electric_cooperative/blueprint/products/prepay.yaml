events:
  - type: prepay_enroll
    target: prepay_accounts
    mutation: create
    meaning: A service account is enrolled in a PrePay Power tier and awaits activation.
    grain: One row per enrollment of one service account.
    fields:
      customer_id: Member enrolling.
      service_account_id: Service account whose meter will run in prepay mode.
      variant_name: Official PrePay Power tier assigned by the entry gates.
      enrolled_date: Date the enrollment was taken.
      low_balance_alert_amount: Low-balance alert amount chosen by the member, or the tier default.
      alert_channel: Alert channel chosen by the member.
    triggers: []
  - type: prepay_activate
    target: prepay_accounts
    mutation: {transition: {from: pending_activation, to: active}}
    meaning: The meter is switched to prepay mode and daily billing starts.
    grain: One row per transaction on the prepay account.
    fields:
      activated_date: Date daily billing started.
    triggers: []
  - type: prepay_daily_charge
    target: prepay_ledger
    meaning: One component of one day's charges deducted from the prepaid balance (energy, facility, program fee, power cost adjustment or sales tax).
    grain: One row per charge component per service day.
    distinguish_by: [entry_date, charge_component]
    fields:
      entry_date: Service day charged.
      charge_component: Which daily charge this is.
      kwh: kWh used that day (on energy and power cost adjustment lines; 0 otherwise).
      amount: Amount deducted, positive.
    account: prepaid_balance
    direction: out
    triggers: []
  - type: prepay_payment
    target: prepay_ledger
    meaning: A payment to the prepay account; the portion credited to the prepaid balance after any arrears recovery.
    grain: One row per payment transaction.
    distinguish_by: [payment_reference]
    fields:
      entry_date: Posting date of the payment.
      payment_channel: Channel the payment came through.
      gross_payment_amount: Full amount the member paid.
      amount: Portion credited to the prepaid balance, positive.
      payment_reference: Confirmation number of the payment.
      debt_recovery_applies: Whether a recovery portion was taken from this payment.
    account: prepaid_balance
    direction: in
    triggers:
      - event: prepay:prepay_arrears_recovery
        when: {debt_recovery_applies: true}
        map: {entry_date: entry_date, payment_reference: payment_reference}
  - type: prepay_arrears_recovery
    target: prepay_ledger
    meaning: The recovery portion of one payment applied to the arrears balance.
    grain: One row per payment that carried a recovery portion.
    distinguish_by: [payment_reference]
    fields:
      entry_date: Posting date of the payment.
      payment_reference: Confirmation number of the payment the portion came from.
      amount: Recovery portion, positive.
    account: arrears_balance
    direction: out
    triggers: []
  - type: prepay_arrears_transfer
    target: prepay_ledger
    meaning: An unpaid standard-billing balance of one of the member's service accounts is moved onto the prepay account as arrears at enrollment.
    grain: One row per source service account transferred.
    distinguish_by: [source_reference_id]
    fields:
      entry_date: Date of the transfer.
      amount: Amount moved, positive.
      source_reference_id: The service account whose balance was moved.
    account: arrears_balance
    direction: in
    triggers:
      - event: service:service_bill_credit
        map: {credit_reason: arrears_to_prepay, charge_component: bill_credit, amount: amount, charge_date: entry_date, source_reference_id: prepay_account_id}
  - type: prepay_deposit_credit
    target: prepay_ledger
    meaning: The part of a security deposit not needed to cover arrears is credited to the prepaid balance.
    grain: One row per deposit applied.
    distinguish_by: [source_reference_id]
    fields:
      entry_date: Date the deposit was applied.
      amount: Amount credited, positive.
      source_reference_id: The deposit record applied.
    account: prepaid_balance
    direction: in
    triggers: []
  - type: prepay_credit_adjustment
    target: prepay_ledger
    meaning: A correction credited to the prepaid balance (billing error, meter error refund, estimated-read correction, or a standard-billing credit balance carried in at enrollment).
    grain: One row per adjustment per source record.
    distinguish_by: [adjustment_reason, source_reference_id]
    fields:
      entry_date: Posting date.
      adjustment_reason: Why the credit was given.
      amount: Amount credited, positive.
      source_reference_id: Record the correction comes from (the daily charge line, meter test or service account).
    account: prepaid_balance
    direction: in
    triggers: []
  - type: prepay_refund
    target: prepay_ledger
    meaning: The remaining prepaid balance is paid out at closing or conversion, by check or as a credit to the service account.
    grain: One row per exit of the enrollment.
    distinguish_by: [entry_date, refund_method]
    fields:
      entry_date: Date of the refund or transfer.
      refund_method: Check or transfer to the service account.
      amount: Amount paid out, positive.
    account: prepaid_balance
    direction: out
    triggers:
      - event: service:service_bill_credit
        when: {refund_method: transfer_to_service_account}
        map: {credit_reason: prepay_balance_transfer, charge_component: bill_credit, amount: amount, charge_date: entry_date, source_reference_id: prepay_account_id}
  - type: prepay_arrears_return
    target: prepay_ledger
    meaning: Arrears not yet recovered at conversion or closing are billed back on the service account.
    grain: One row per exit of the enrollment.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date of the return.
      amount: Unrecovered arrears returned, positive.
    account: arrears_balance
    direction: out
    triggers:
      - event: service:service_program_charge
        map: {charge_component: prepay_arrears_return, amount: amount, charge_date: entry_date, source_reference_id: prepay_account_id}
  - type: prepay_alert
    target: prepay_notifications
    meaning: A notification sent to the member - low balance, disconnect warning, disconnected, reconnected, weather hold or counseling referral.
    grain: One row per notification sent.
    distinguish_by: [alert_type, alert_timestamp]
    fields:
      alert_type: Kind of notification.
      alert_timestamp: When it was sent, YYYY-MM-DDTHH:MM local time.
      balance_at_alert: Prepaid balance when it was sent.
      alert_channel: Channel used.
    triggers: []
  - type: prepay_disconnect
    target: prepay_accounts
    mutation: {transition: {from: active, to: disconnected_low_balance}}
    meaning: The meter is remotely disconnected for low prepaid balance.
    grain: One row per transaction on the prepay account.
    fields:
      disconnect_date: Date of the disconnection.
    triggers:
      - event: prepay:prepay_alert
        map: {alert_type: disconnected}
  - type: prepay_reconnect
    target: prepay_accounts
    mutation: {transition: {from: disconnected_low_balance, to: active}}
    meaning: The meter is remotely reconnected after a payment restored the balance.
    grain: One row per transaction on the prepay account.
    fields:
      disconnect_date: Cleared to empty.
    triggers:
      - event: prepay:prepay_alert
        map: {alert_type: reconnected}
  - type: prepay_convert
    target: prepay_accounts
    mutation: {transition: {from: active, to: converted}}
    meaning: The member's confirmed request to leave PrePay Power takes effect and the service account returns to standard billing.
    grain: One row per transaction on the prepay account.
    fields:
      ended_date: Date standard billing resumed.
    triggers: []
  - type: prepay_close
    target: prepay_accounts
    mutation:
      transition:
        - {from: pending_activation, to: closed}
        - {from: active, to: closed}
        - {from: disconnected_low_balance, to: closed}
    meaning: The enrollment ends because it lapsed unactivated, the service account was final billed, or the disconnection outlasted the finaling period.
    grain: One row per transaction on the prepay account.
    fields:
      ended_date: Date the enrollment ended.
    triggers: []
  - type: prepay_alert_settings
    target: prepay_accounts
    mutation: update
    meaning: The member changes the low-balance alert amount or the alert channel.
    grain: One row per transaction on the prepay account.
    fields:
      low_balance_alert_amount: New alert amount.
      alert_channel: New alert channel.
    triggers: []
  - type: prepay_tier_change
    target: prepay_accounts
    mutation: update
    meaning: A recovery-tier account whose arrears are fully recovered moves to its payoff tier.
    grain: One row per transaction on the prepay account.
    fields:
      variant_name: Official name of the new tier.
    triggers: []

measures:
  - id: prepay_msr_avg_daily_charge
    window: The usage_history_days_for_projection service days ending on the day before the current date, on the same prepay account.
    measure: Sum of amount of prepay_daily_charge rows in the window divided by the number of days in the window, rounded to the cent.
  - id: prepay_msr_disconnects_30d
    window: The 30 days ending on the current date, inclusive, on the same prepay account.
    measure: Count of prepay_alert rows with alert_type disconnected whose alert_timestamp falls in the window.
  - id: prepay_msr_member_arrears
    window: Point in time at enrollment, across every service account of the enrolling member.
    measure: Sum of the positive account_balance of the service account being enrolled and of every final_billed service account of the same member, less any security deposit held on the service account being enrolled.

policies:
  - id: prepay_agg_multi_holding
    subject: [prepay_enroll]
    rule: >-
      A member may run PrePay Power on more than one service account (a home and a shop, for example), each
      enrollment being its own prepay account with its own balance, arrears and alerts. A service account may carry
      only one enrollment at a time. A service account that already has a prepay account in pending_activation,
      active or disconnected_low_balance status cannot be enrolled again. Payments, alerts and disconnections of
      one prepay account never touch another.
    eligibility:
      - id: one_open_enrollment_per_service
        applies_to: [prepay_enroll]
        kind: dedup
        condition: A service account may carry only one enrollment at a time.
        evidence_fields: [prepay_accounts.service_account_id, prepay_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prepay_accounts.service_account_id]
          action_bindings:
            prepay_accounts.service_account_id: service_account_id
        dedup_contract:
          table: prepay_accounts
          mode: separate_record
          object_bindings: {service_account_id: service_account_id}
          duplicate_filters: {status: [pending_activation, active, disconnected_low_balance]}
          distinct_fields: []
    params:
      max_per_customer: null
  - id: prepay_agg_member_arrears
    subject: [prepay_enroll, prepay_arrears_transfer]
    rule: >-
      Arrears are measured across the member's portfolio, not only on the meter being enrolled. The arrears to be
      transferred at enrollment are prepay_msr_member_arrears: the positive account_balance of the service account
      being enrolled plus the positive account_balance of every final-billed service account of the same member,
      after any security deposit held on the enrolled service account has been applied to them. All of those
      balances are transferred; the member cannot leave one behind. The tier is the one whose eligible_rate_schedules
      and eligible_member_types fit and whose band from min_transferred_arrears through max_transferred_arrears,
      inclusive, contains the arrears total. The arrears total must fall inside the band of the tier assigned at
      enrollment; when it exceeds the highest band available to the service account, the member must first pay the
      total down into a band. Each source service account is transferred as its own prepay_arrears_transfer row for
      its whole positive balance, and each transfer is credited off that source account with credit_reason
      arrears_to_prepay. A credit balance on the enrolled service account is carried in as a prepay_credit_adjustment
      with adjustment_reason postpaid_credit_transfer and is never netted against another account's debt.
    eligibility:
      - id: arrears_within_band
        applies_to: [prepay_enroll]
        kind: authorization
        condition: The arrears total must fall inside the band of the tier assigned at enrollment; when it exceeds the highest band available to the service account, the member must first pay the total down into a band.
        evidence_fields: [service_accounts.customer_id, service_accounts.status, service_accounts.account_balance, deposit_accounts.service_account_id, deposit_accounts.held_amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.customer_id]
          action_bindings:
            service_accounts.customer_id: customer_id
    params:
      per_tier:
        PrePay Power Residential: {min_transferred_arrears: "=min_transferred_arrears", max_transferred_arrears: "=max_transferred_arrears"}
        PrePay Power Residential Recovery 25: {min_transferred_arrears: "=min_transferred_arrears", max_transferred_arrears: "=max_transferred_arrears"}
        PrePay Power Residential Recovery 40: {min_transferred_arrears: "=min_transferred_arrears", max_transferred_arrears: "=max_transferred_arrears"}
        PrePay Power Seasonal: {min_transferred_arrears: "=min_transferred_arrears", max_transferred_arrears: "=max_transferred_arrears"}
        PrePay Power Outbuilding: {min_transferred_arrears: "=min_transferred_arrears", max_transferred_arrears: "=max_transferred_arrears"}
        PrePay Power Small Commercial: {min_transferred_arrears: "=min_transferred_arrears", max_transferred_arrears: "=max_transferred_arrears"}
    measures: [prepay_msr_member_arrears]
  - id: prepay_enrollment_eligibility
    subject: [prepay_enroll]
    rule: >-
      PrePay Power enrollment is voluntary and is taken only at the member's request. The service account must be on
      a rate schedule whose prepay_eligible switch is true and that is listed in the tier's eligible_rate_schedules,
      and the member profile's member_type must be in eligible_member_types. The service account must be in active or
      disconnect_pending status at enrollment. The service account's meter_type must equal required_meter_type,
      because disconnection and reconnection are performed remotely. An account under medical certificate protection
      cannot enroll, and enrollment is refused while the service account's medical_certificate_expires date is on or after
      the current date. Because budget_billing_compatible and arrangement_compatible are false, an active Budget
      Billing plan on the service account must be ended and settled first, and an active payment arrangement on the
      service account must be ended first; its unbilled arranged balance then becomes part of the transferred
      arrears. A service account converted out of PrePay Power may enroll again only after reenrollment_wait_days
      calendar days have passed since the previous PrePay Power account on the same service account was converted.
      Calendar days are counted from the day after the ended_date, the last waiting day being the last day of the
      count. No enrollment_fee is charged and, because deposit_required is false, no new deposit is assessed while on
      the program.
      This exclusion is the medical_certificate_allowed switch, which is false on every tier.
    eligibility:
      - id: service_account_open
        applies_to: [prepay_enroll]
        kind: state
        condition: The service account must be in active or disconnect_pending status at enrollment.
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active, disconnect_pending]
      - id: meter_capable
        applies_to: [prepay_enroll]
        kind: authorization
        condition: The service account's meter_type must equal required_meter_type, because disconnection and reconnection are performed remotely.
        evidence_fields: [service_accounts.meter_type, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
      - id: no_medical_protection
        applies_to: [prepay_enroll]
        kind: authorization
        condition: An account under medical certificate protection cannot enroll, and enrollment is refused while the service account's medical_certificate_expires date is on or after the current date.
        evidence_fields: [service_accounts.medical_certificate_expires, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
      - id: no_budget_or_arrangement
        applies_to: [prepay_enroll]
        kind: authorization
        condition: Because budget_billing_compatible and arrangement_compatible are false, an active Budget Billing plan on the service account must be ended and settled first, and an active payment arrangement on the service account must be ended first; its unbilled arranged balance then becomes part of the transferred arrears.
        evidence_fields: [budget_plans.service_account_id, budget_plans.status, arrangements.service_account_id, arrangements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [budget_plans.service_account_id, arrangements.service_account_id]
          action_bindings:
            budget_plans.service_account_id: service_account_id
            arrangements.service_account_id: service_account_id
      - id: reenrollment_wait
        applies_to: [prepay_enroll]
        kind: time
        condition: A service account converted out of PrePay Power may enroll again only after reenrollment_wait_days calendar days have passed since the previous PrePay Power account on the same service account was converted.
        evidence_fields: [prepay_accounts.service_account_id, prepay_accounts.status, prepay_accounts.ended_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prepay_accounts.service_account_id]
          action_bindings:
            prepay_accounts.service_account_id: service_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the previous PrePay Power account on the same service account was converted
          anchor_source: prepay_accounts.ended_date
          relation: not_before
          duration_source: variants.reenrollment_wait_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the ended_date, the last waiting day being the last day of the count.
          boundary: exclusive
  - id: prepay_evt_activation
    subject: [prepay_activate, prepay_close, prepay_payment]
    rule: >-
      An enrollment is activated when the member's signed PrePay Power agreement is on file (a prepay request of
      request_type enrollment_agreement in member_confirmed status) and an activation payment of at least
      activation_payment_min has posted. Activation may take place only within activation_window_days calendar days
      after the enrollment was taken. Calendar days are counted from the day after the enrolled_date, the last day of
      the window being the last day of the count. The activation payment is credited in full to the prepaid balance
      and no recovery portion is taken from it, so it carries debt_recovery_applies false. An enrollment not activated
      within the window lapses and is closed, and the transferred arrears and any deposit credit are reversed back onto
      the service account by the billing department. Daily billing starts on the activated_date.
    eligibility:
      - id: activation_window
        applies_to: [prepay_activate]
        kind: time
        condition: Activation may take place only within activation_window_days calendar days after the enrollment was taken.
        evidence_fields: [prepay_accounts.enrolled_date, prepay_accounts.prepay_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prepay_accounts.prepay_account_id]
          action_bindings:
            prepay_accounts.prepay_account_id: prepay_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the enrollment was taken
          anchor_source: prepay_accounts.enrolled_date
          relation: not_after
          duration_source: variants.activation_window_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the enrolled_date, the last day of the window being the last day of the count.
          boundary: inclusive
      - id: agreement_signed
        applies_to: [prepay_activate]
        kind: authorization
        condition: An enrollment is activated when the member's signed PrePay Power agreement is on file (a prepay request of request_type enrollment_agreement in member_confirmed status) and an activation payment of at least activation_payment_min has posted.
        evidence_fields: [prepay_requests.prepay_account_id, prepay_requests.request_type, prepay_requests.request_status, prepay_ledger.gross_payment_amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prepay_requests.prepay_account_id]
          action_bindings:
            prepay_requests.prepay_account_id: prepay_account_id
  - id: prepay_evt_daily_charges
    subject: [prepay_daily_charge]
    rule: >-
      Every calendar day the prepay account is charged, as separate lines, the tier's daily_facility_charge, the
      day's kWh priced at the block 1 energy rate of the underlying service account's rate schedule (energy_rate_source;
      the block 2 rate never applies on PrePay Power), the day's power cost adjustment taken as recorded by the billing
      system, and sales tax at the underlying schedule's sales tax percentage on those lines where it is above zero. On
      the first day of each calendar month the program_fee_monthly is charged as its own line. Each line is rounded to
      the cent. Daily charges may be posted only while the prepay account is in active or disconnected_low_balance
      status; fixed daily charges and the program fee continue while the meter is disconnected for low balance, so the
      balance may fall below zero. Because late_charges_apply is false, no late payment charge is ever assessed.
    eligibility:
      - id: account_charging
        applies_to: [prepay_daily_charge]
        kind: state
        condition: Daily charges may be posted only while the prepay account is in active or disconnected_low_balance status; fixed daily charges and the program fee continue while the meter is disconnected for low balance, so the balance may fall below zero.
        evidence_fields: [prepay_accounts.status, prepay_accounts.prepay_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prepay_accounts.prepay_account_id]
          action_bindings:
            prepay_accounts.prepay_account_id: prepay_account_id
        state_contract:
          field: prepay_accounts.status
          allowed: [active, disconnected_low_balance]
  - id: prepay_evt_payment_split
    subject: [prepay_payment, prepay_arrears_recovery]
    rule: >-
      A payment must be at least min_payment_amount and at most max_payment_amount and must come through one of the
      payment_channels_allowed. While the arrears_balance is above zero, every payment other than the activation
      payment is split: the recovery portion is arrears_recovery_pct percent of the gross payment, rounded to the cent,
      but not less than arrears_recovery_min_per_payment, never more than the arrears_balance remaining and never more
      than the gross payment; the rest is credited to the prepaid balance. The recovery portion is booked as a
      prepay_arrears_recovery carrying the same payment_reference, and the payment row carries debt_recovery_applies
      true. When the arrears_balance is zero the whole payment is credited to the prepaid balance with
      debt_recovery_applies false. An energy assistance agency payment is split the same way. Automatic recharges are
      ordinary payments of at least auto_recharge_min_amount where auto_recharge_allowed is true.
    eligibility:
      - id: payment_limits
        applies_to: [prepay_payment]
        kind: authorization
        condition: A payment must be at least min_payment_amount and at most max_payment_amount and must come through one of the payment_channels_allowed.
        evidence_fields: [prepay_accounts.variant_name, prepay_accounts.prepay_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prepay_accounts.prepay_account_id]
          action_bindings:
            prepay_accounts.prepay_account_id: prepay_account_id
    params:
      per_tier:
        PrePay Power Residential: {arrears_recovery_pct: "=arrears_recovery_pct", arrears_recovery_min_per_payment: "=arrears_recovery_min_per_payment", min_payment_amount: "=min_payment_amount", max_payment_amount: "=max_payment_amount"}
        PrePay Power Residential Recovery 25: {arrears_recovery_pct: "=arrears_recovery_pct", arrears_recovery_min_per_payment: "=arrears_recovery_min_per_payment", min_payment_amount: "=min_payment_amount", max_payment_amount: "=max_payment_amount"}
        PrePay Power Residential Recovery 40: {arrears_recovery_pct: "=arrears_recovery_pct", arrears_recovery_min_per_payment: "=arrears_recovery_min_per_payment", min_payment_amount: "=min_payment_amount", max_payment_amount: "=max_payment_amount"}
        PrePay Power Seasonal: {arrears_recovery_pct: "=arrears_recovery_pct", arrears_recovery_min_per_payment: "=arrears_recovery_min_per_payment", min_payment_amount: "=min_payment_amount", max_payment_amount: "=max_payment_amount"}
        PrePay Power Outbuilding: {arrears_recovery_pct: "=arrears_recovery_pct", arrears_recovery_min_per_payment: "=arrears_recovery_min_per_payment", min_payment_amount: "=min_payment_amount", max_payment_amount: "=max_payment_amount"}
        PrePay Power Small Commercial: {arrears_recovery_pct: "=arrears_recovery_pct", arrears_recovery_min_per_payment: "=arrears_recovery_min_per_payment", min_payment_amount: "=min_payment_amount", max_payment_amount: "=max_payment_amount"}
    formula:
      when: arrears_balance > 0
      recovery_amount: min(arrears_balance, max(arrears_recovery_min_per_payment, round(gross_payment_amount * arrears_recovery_pct / 100, 2)), gross_payment_amount)
      balance_amount: gross_payment_amount - recovery_amount
  - id: prepay_evt_disconnect_reconnect
    subject: [prepay_disconnect, prepay_reconnect, prepay_alert]
    rule: >-
      A prepay meter is disconnected when the prepaid balance is at or below disconnect_threshold_balance, but only
      inside a permitted window: between disconnect_window_start and disconnect_window_end local time, never on a
      Saturday or Sunday unless disconnect_weekends is true, never on a cooperative holiday unless disconnect_holidays
      is true, never on a Friday after friday_disconnect_cutoff, and, where weather_hold_applies is true, never on a
      day the system has recorded a weather_hold alert because the forecast low is at or below cold_hold_temp_f or the
      forecast high is at or above heat_hold_temp_f. Disconnection may be performed only after warning_lead_hours have
      elapsed since the disconnect_warning alert was sent. Hours are counted as full elapsed 60-minute periods from the
      alert_timestamp of the most recent disconnect_warning alert. A balance that reaches the threshold outside a window
      waits for the next permitted window. The meter is reconnected remotely, at any hour and on any day, as soon as a
      payment brings the prepaid balance to reconnect_threshold_balance or more; the reconnect_fee applies. When
      prepay_msr_disconnects_30d reaches max_disconnects_per_30_days, a counseling_referral alert is sent and the
      member is offered an energy counseling call; the referral does not stop the program.
    eligibility:
      - id: warning_lead_time
        applies_to: [prepay_disconnect]
        kind: time
        condition: Disconnection may be performed only after warning_lead_hours have elapsed since the disconnect_warning alert was sent.
        evidence_fields: [prepay_notifications.alert_timestamp, prepay_notifications.alert_type, prepay_notifications.prepay_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prepay_notifications.prepay_account_id]
          action_bindings:
            prepay_notifications.prepay_account_id: prepay_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the disconnect_warning alert was sent
          anchor_source: prepay_notifications.alert_timestamp
          relation: not_before
          duration_source: variants.warning_lead_hours
          unit: elapsed_hours
          counting_rule: Hours are counted as full elapsed 60-minute periods from the alert_timestamp of the most recent disconnect_warning alert.
          boundary: inclusive
    params:
      per_tier:
        PrePay Power Residential: {disconnect_threshold_balance: "=disconnect_threshold_balance", reconnect_threshold_balance: "=reconnect_threshold_balance", weather_hold_applies: "=weather_hold_applies", warning_lead_hours: "=warning_lead_hours"}
        PrePay Power Residential Recovery 25: {disconnect_threshold_balance: "=disconnect_threshold_balance", reconnect_threshold_balance: "=reconnect_threshold_balance", weather_hold_applies: "=weather_hold_applies", warning_lead_hours: "=warning_lead_hours"}
        PrePay Power Residential Recovery 40: {disconnect_threshold_balance: "=disconnect_threshold_balance", reconnect_threshold_balance: "=reconnect_threshold_balance", weather_hold_applies: "=weather_hold_applies", warning_lead_hours: "=warning_lead_hours"}
        PrePay Power Seasonal: {disconnect_threshold_balance: "=disconnect_threshold_balance", reconnect_threshold_balance: "=reconnect_threshold_balance", weather_hold_applies: "=weather_hold_applies", warning_lead_hours: "=warning_lead_hours"}
        PrePay Power Outbuilding: {disconnect_threshold_balance: "=disconnect_threshold_balance", reconnect_threshold_balance: "=reconnect_threshold_balance", weather_hold_applies: "=weather_hold_applies", warning_lead_hours: "=warning_lead_hours"}
        PrePay Power Small Commercial: {disconnect_threshold_balance: "=disconnect_threshold_balance", reconnect_threshold_balance: "=reconnect_threshold_balance", weather_hold_applies: "=weather_hold_applies", warning_lead_hours: "=warning_lead_hours"}
    measures: [prepay_msr_disconnects_30d]
  - id: prepay_evt_alerts
    subject: [prepay_alert, prepay_alert_settings]
    rule: >-
      A low_balance alert is sent when the prepaid balance falls below the account's low_balance_alert_amount, and again
      only after low_balance_alert_repeat_hours have elapsed while it stays below. A disconnect_warning alert is sent
      when the prepaid balance divided by prepay_msr_avg_daily_charge projects disconnect_warning_days or fewer days
      remaining. Disconnected, reconnected, weather_hold and counseling_referral alerts are sent when those occur. The
      member may change the low_balance_alert_amount to any amount from low_balance_alert_min through
      low_balance_alert_max inclusive, and the alert_channel to any of alert_channels_allowed; an amount outside the
      range is not accepted and the previous setting stands. Alerts are courtesy notices: a failed delivery never delays
      a disconnection that is otherwise permitted, but a disconnect_warning must have been sent.
      At enrollment the low_balance_alert_amount is the amount the member chooses within the range, or
      low_balance_alert_default when the member names none.
    eligibility: []
    formula:
      days_remaining: prepaid_balance / prepay_msr_avg_daily_charge
    measures: [prepay_msr_avg_daily_charge]
  - id: prepay_evt_enrollment_transfers
    subject: [prepay_arrears_transfer, prepay_deposit_credit, prepay_credit_adjustment]
    rule: >-
      At enrollment a security deposit held on the enrolled service account is released under existing_deposit_disposition:
      it is applied first against the arrears that would otherwise be transferred, and only the remainder is credited to
      the prepaid balance as a prepay_deposit_credit whose source_reference_id is the deposit record. Deposit interest
      accrued to that day is paid out by the deposit charter, not here. Arrears transfers follow prepay_agg_member_arrears.
      A credit adjustment is posted only for a daily charge line shown to be wrong (billing_error_correction), a meter
      found fast on test (meter_error_refund), an estimated day later trued up by an actual read
      (estimated_read_correction), or a standard-billing credit balance carried in at enrollment (postpaid_credit_transfer),
      for the difference only and once per source record.
    eligibility: []
  - id: prepay_evt_conversion
    subject: [prepay_convert, prepay_refund, prepay_arrears_return]
    rule: >-
      Leaving PrePay Power is the member's own decision and takes effect only on the member's confirmed exit request (a
      prepay request of request_type exit_to_standard_billing in member_confirmed status). A member may convert back to
      standard billing only after min_months_before_conversion full calendar months have passed since the PrePay Power
      account was activated. Calendar months are counted from the activated_date to the same day number of the later
      month, falling back to the last day of that month when the day number does not exist. Where
      conversion_deposit_required is true, conversion also requires a security deposit on the service account in held
      status, assessed and paid under the deposit charter for the underlying schedule. At conversion the remaining
      prepaid balance is moved to the service account as a prepay_refund with refund_method transfer_to_service_account,
      and the unrecovered arrears are billed back under conversion_arrears_handling as a prepay_arrears_return. A
      converted account may not re-enroll until the waiting period in prepay_enrollment_eligibility has passed.
    eligibility:
      - id: minimum_months_on_program
        applies_to: [prepay_convert]
        kind: time
        condition: A member may convert back to standard billing only after min_months_before_conversion full calendar months have passed since the PrePay Power account was activated.
        evidence_fields: [prepay_accounts.activated_date, prepay_accounts.prepay_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prepay_accounts.prepay_account_id]
          action_bindings:
            prepay_accounts.prepay_account_id: prepay_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the PrePay Power account was activated
          anchor_source: prepay_accounts.activated_date
          relation: not_before
          duration_source: variants.min_months_before_conversion
          unit: calendar_months
          counting_rule: Calendar months are counted from the activated_date to the same day number of the later month, falling back to the last day of that month when the day number does not exist.
          boundary: inclusive
      - id: deposit_held_for_conversion
        applies_to: [prepay_convert]
        kind: authorization
        condition: Where conversion_deposit_required is true, conversion also requires a security deposit on the service account in held status, assessed and paid under the deposit charter for the underlying schedule.
        evidence_fields: [deposit_accounts.service_account_id, deposit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.service_account_id]
          action_bindings:
            deposit_accounts.service_account_id: service_account_id
    params:
      per_tier:
        PrePay Power Residential: {min_months_before_conversion: "=min_months_before_conversion", conversion_deposit_required: "=conversion_deposit_required"}
        PrePay Power Residential Recovery 25: {min_months_before_conversion: "=min_months_before_conversion", conversion_deposit_required: "=conversion_deposit_required"}
        PrePay Power Residential Recovery 40: {min_months_before_conversion: "=min_months_before_conversion", conversion_deposit_required: "=conversion_deposit_required"}
        PrePay Power Seasonal: {min_months_before_conversion: "=min_months_before_conversion", conversion_deposit_required: "=conversion_deposit_required"}
        PrePay Power Outbuilding: {min_months_before_conversion: "=min_months_before_conversion", conversion_deposit_required: "=conversion_deposit_required"}
        PrePay Power Small Commercial: {min_months_before_conversion: "=min_months_before_conversion", conversion_deposit_required: "=conversion_deposit_required"}
  - id: prepay_evt_closing
    subject: [prepay_close, prepay_refund, prepay_arrears_return]
    rule: >-
      An enrollment is closed when its activation window lapses, when the underlying service account is final billed,
      or when a low-balance disconnection has lasted disconnected_final_days calendar days counted from the
      disconnect_date. At closing a remaining prepaid balance of at least refund_check_minimum is refunded by check to
      the mailing address on file; a smaller positive remainder is moved to the service account's final bill with
      refund_method transfer_to_service_account. A negative prepaid balance and any unrecovered arrears are billed back on
      the service account, the arrears as a prepay_arrears_return and the negative balance as part of the final bill. A
      closed prepay account is never reopened; a new enrollment is a new prepay account.
    eligibility: []
  - id: prepay_evt_tier_change
    subject: [prepay_tier_change]
    rule: >-
      The day after a recovery tier's arrears_balance reaches zero the account moves to its tier_on_arrears_payoff tier,
      keeping its balance, alert settings and activation date. No other tier change is made on an open enrollment; a
      member whose situation fits a different tier (a new rate schedule, new arrears) must close or convert and enroll
      again. A tier change is never made while the account is disconnected_low_balance.
    eligibility: []
    params:
      per_tier:
        PrePay Power Residential: {tier_on_arrears_payoff: "=tier_on_arrears_payoff"}
        PrePay Power Residential Recovery 25: {tier_on_arrears_payoff: "=tier_on_arrears_payoff"}
        PrePay Power Residential Recovery 40: {tier_on_arrears_payoff: "=tier_on_arrears_payoff"}
        PrePay Power Seasonal: {tier_on_arrears_payoff: "=tier_on_arrears_payoff"}
        PrePay Power Outbuilding: {tier_on_arrears_payoff: "=tier_on_arrears_payoff"}
        PrePay Power Small Commercial: {tier_on_arrears_payoff: "=tier_on_arrears_payoff"}
