category: service
display_name: Electric Service by Rate Schedule

binding:
  holding_table: service_accounts
  event_tables: [service_charges, service_payments, service_trouble_reports, service_certificates]
  intake_tables: [service_orders]
  status_field: status
  variant_field: variant_name
  quantity_fields: {account_balance: account_balance}

lifecycle:
  states: [pending_connect, active, disconnect_pending, disconnected_nonpay, idle, final_billed, closed]
  transitions:
    - {from: pending_connect, to: active, by: system, means: The meter is set and energized at the service location and billing starts from the connect date.}
    - {from: active, to: disconnect_pending, by: system, means: A past-due balance remained unpaid after the due date and a written disconnect notice was issued.}
    - {from: disconnect_pending, to: active, by: agent, means: The past-due amount on the notice was paid or covered by an accepted payment arrangement, so the notice is cleared.}
    - {from: disconnect_pending, to: disconnected_nonpay, by: system, means: The notice period ran out with the past-due amount still unpaid and the meter was disconnected for nonpayment.}
    - {from: disconnected_nonpay, to: active, by: agent, means: The reconnection conditions were met and a reconnect order restored power.}
    - {from: active, to: idle, by: agent, means: A seasonal or irrigation member's confirmed off-season order de-energized the meter without closing the account.}
    - {from: idle, to: active, by: agent, means: A confirmed seasonal restore order re-energized the idle meter.}
    - {from: active, to: final_billed, by: system, means: A confirmed stop-service order was completed with a final meter read and a final bill.}
    - {from: idle, to: final_billed, by: system, means: A confirmed stop-service order on an idle account was completed with a final bill.}
    - {from: disconnect_pending, to: final_billed, by: system, means: A confirmed stop-service order was completed while a disconnect notice was outstanding.}
    - {from: disconnected_nonpay, to: final_billed, by: system, means: The account stayed disconnected for nonpayment past the finaling period and was final billed.}
    - {from: final_billed, to: closed, by: system, means: The final balance reached exactly zero through payment, credits or the application of a deposit or capital credits.}

accounts:
  - key: account_balance
    unit: USD
    meaning: Amount the member owes on one service account; in = charges, fees and program charges billed (and returned payments re-billed), out = payments and bill credits; a negative value is a credit balance.

parameter_schema:
  phase_allowed: Entry - service phase the schedule accepts; enum single_phase | three_phase | either.
  max_transformer_kva: Entry - largest transformer capacity, in kVA, serving the location that the schedule accepts; integer.
  min_expected_demand_kw: Entry - lowest expected maximum demand, in kW, for the schedule (from the load data on the service application); number.
  max_expected_demand_kw: Entry - highest expected maximum demand, in kW, for the schedule; number.
  permanent_residence_required: Entry - whether the location must be the member's year-round primary residence; boolean.
  agricultural_use_required: Entry - whether the load must serve agricultural production (farm buildings, grain handling, livestock, irrigation pumping); boolean.
  facility_charge_monthly: Rate - fixed facility charge per billing period, USD.
  energy_rate_block1_per_kwh: Rate - energy charge per kWh for usage up to block1_kwh_limit in a billing period, USD per kWh, 5 decimals.
  block1_kwh_limit: Rate - kWh per billing period billed at the block 1 rate; integer kWh.
  energy_rate_block2_per_kwh: Rate - energy charge per kWh for usage above block1_kwh_limit, USD per kWh, 5 decimals.
  demand_charge_per_kw: Rate - charge per kW of billing demand above demand_free_kw, USD per kW; 0.00 where the schedule carries no demand charge.
  demand_free_kw: Rate - kW of billing demand per period not subject to the demand charge; number.
  demand_ratchet_pct: Rate - billing demand floor as a percentage of the highest metered demand of the preceding demand_ratchet_months billing periods; 0 where there is no ratchet.
  demand_ratchet_months: Rate - number of preceding billing periods the ratchet looks back over; integer.
  power_factor_adjustment_applies: Rate - whether billing demand is adjusted for a power factor below power_factor_target_pct; boolean.
  power_factor_target_pct: Rate - power factor, in percent, below which billing demand is multiplied by target divided by actual; number.
  minimum_monthly_charge: Rate - floor on the sum of facility, energy and demand lines for one billing period, USD.
  minimum_charge_per_kva: Rate - additional monthly minimum per kVA of installed transformer capacity, USD per kVA; the higher of the two minimums applies.
  annual_minimum_per_kva: Rate - calendar-year minimum for facility, energy and demand lines per kVA of installed transformer capacity, assessed on the December bill, USD per kVA; 0.00 where none.
  pca_applies: Rate - whether the monthly wholesale power cost adjustment line is billed on the schedule; boolean.
  sales_tax_pct: Rate - state sales tax percentage applied to the period's taxable lines; 0.00 where the schedule is exempt.
  bill_due_days: Billing - calendar days from the bill date to the due date.
  late_charge_pct: Billing - late payment charge as a percentage of the unpaid past-due amount of one bill.
  late_charge_minimum: Billing - smallest late payment charge assessed on one bill, USD.
  late_charge_waivers_per_12_months: Billing - courtesy late-charge waivers available per service account in a rolling 12 months; integer.
  credit_refund_check_minimum: Billing - smallest final credit balance refunded automatically by check, USD; a smaller final credit is refunded only when the member asks for it and is otherwise held on file as an unclaimed credit.
  disconnect_min_past_due: Collections - smallest past-due amount for which a disconnect notice is issued, USD.
  disconnect_notice_days_after_due: Collections - calendar days after the due date on which a disconnect notice is issued for an unpaid past-due amount.
  disconnect_notice_period_days: Collections - calendar days between the issue date of the disconnect notice and the earliest permitted disconnection.
  disconnect_friday_allowed: Collections - whether disconnection for nonpayment may be performed on a Friday; boolean.
  assistance_pledge_hold_days: Collections - calendar days from the date an energy assistance pledge is recorded during which the pledged amount counts against the past-due amount.
  field_collection_fee: Collections - fee charged when a field representative is dispatched to disconnect and collects payment at the meter instead, USD.
  reconnect_fee_remote: Collections - reconnect fee when the meter is reconnected remotely, USD.
  reconnect_fee_truck_business_hours: Collections - reconnect fee when a crew truck reconnects during business hours, USD.
  reconnect_fee_after_hours: Collections - reconnect fee when a crew truck reconnects outside business hours, USD.
  reconnect_deposit_required: Collections - whether a reconnection after a nonpayment disconnection requires a security deposit record on the service account; boolean.
  business_hours_start: Service - start of cooperative business hours on weekdays that are not cooperative holidays, HH:MM local time.
  business_hours_end: Service - end of cooperative business hours, HH:MM local time.
  days_disconnected_before_final: Collections - calendar days an account may remain disconnected for nonpayment before it is final billed.
  returned_payment_fee: Payments - fee charged for each payment returned unpaid by the bank or card issuer, USD.
  returned_payments_before_cash_only: Payments - number of returned payments within the lookback that places the account on cash-only status; integer.
  returned_payment_lookback_months: Payments - months over which returned payments are counted; integer.
  cash_only_months: Payments - months the account remains on cash-only status, counted from the return that triggered it; integer.
  cash_only_accepted_channels: Payments - payment channels accepted while an account is on cash-only status; list of payment_channel values.
  medical_certificate_eligible: Medical - whether a medical certificate can delay disconnection on the schedule; boolean.
  medical_certificate_delay_days: Medical - calendar days a medical certificate delays disconnection, counted from the date the certificate is received.
  medical_certificate_renewals_per_12_months: Medical - medical certificates accepted per service account in a rolling 12 months; integer.
  connect_fee_new_service: Orders - service connection fee for a new or returning member at a location, USD.
  transfer_fee: Orders - fee to transfer an energized location into the name of a different member without a field visit, USD.
  same_day_connect_fee: Orders - additional fee for a connect requested before 12:00 and completed the same business day, USD.
  seasonal_idle_allowed: Orders - whether the schedule allows a seasonal idle (off-season de-energization without closing the account); boolean.
  seasonal_idle_min_months: Orders - calendar months an idle account must stay idle before a restore is billed at the ordinary restore fee only; integer.
  seasonal_restore_fee: Orders - fee to re-energize an idle account, USD.
  facility_charge_during_idle: Orders - whether the facility charge continues to bill during idle months; boolean.
  rate_change_min_months: Orders - full calendar months a rate schedule must stay in effect on an account before a member-requested change to another schedule; integer.
  trouble_call_charge_business_hours: Trouble - charge when a crew dispatched during business hours finds the cause on the member's side of the meter, USD.
  trouble_call_charge_after_hours: Trouble - charge when a crew dispatched outside business hours finds the cause on the member's side of the meter, USD.
  trouble_call_courtesy_waivers_per_12_months: Trouble - member-side trouble calls per service account in a rolling 12 months that are not charged; integer.
  meter_tests_free_per_12_months: Meter - member-requested meter tests per service account in a rolling 12 months performed free of charge; integer.
  meter_test_fee: Meter - fee for a member-requested meter test beyond the free allowance when the meter is found within tolerance, USD.
  meter_accuracy_tolerance_pct: Meter - registration error, in percent fast or slow, within which a meter is considered accurate.
  meter_error_rebill_max_months: Meter - largest number of billing periods corrected after a meter is found outside tolerance; integer.
  slow_meter_backbill_allowed: Meter - whether under-registration by a slow meter is back-billed to the member; boolean.
  budget_billing_eligible: Combination - whether a service account on the schedule may enroll in a Budget Billing plan; boolean.
  prepay_eligible: Combination - whether a service account on the schedule may enroll in a PrePay Power plan; boolean.
  deposit_tier: Combination - official Security Deposit tier assessed for a service account on the schedule (string, the deposit tier's official name).
  capital_patron_class: Combination - official capital credit patron class into which the schedule's patronage is allocated (string, the patron class's official name).

