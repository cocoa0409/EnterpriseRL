      The estate pass-through discount rate follows the member's patronage: where the member's last final-billed service account was final billed in the allocation's own year or later and the capital account was opened at least long_patron_months full calendar months before the election, the row is discounted at patron_estate_passthrough_rate_pct; where that service account was final billed before the allocation's year and the account was opened fewer than long_patron_months full calendar months before the election, the row is discounted at early_retirement_discount_rate_pct; every other elected row is discounted at estate_discount_rate_pct.
      The estate pass-through discount rate is then moved by how long the pass-through allocation has waited, the calendar days from its booking date to the election: a wait of no more than prompt_election_days adds prompt_adjust_pct points, a wait of more than late_election_days adds late_adjust_pct points, and any other wait leaves the rate unchanged.
      The estate pass-through discount horizon is the row's whole years from its expected rotation, transformed as follows: a row at least horizon_cap_years whole years away is discounted over horizon_cap_years years only; a row no more than near_rotation_years whole years away is not discounted at all; any other row is discounted over its whole years.
      The estate pass-through discount is compounded by the size of the row's gross: a gross under small_row_limit is compounded monthly at one twelfth of the adjusted rate; a gross of at least small_row_limit and under large_row_limit is compounded twice a year at one half of the adjusted rate; a gross of at least large_row_limit is compounded once a year.
      A claimant who already elected the estate's earlier pass-through allocations keeps part of the later pass-through row at full value: where the account carries at least many_elected_rows pass-through estate retirement entries, many_rows_credit of the gross is paid at full value; where it carries at least one and fewer than many_elected_rows, some_rows_credit of the gross is paid at full value; where it carries none, no part is paid at full value; the discount acts only on the rest of the gross.
      The payable of the elected row is the full-value part plus the discounted rest, rounded half up to the cent.
    baseline:
      rule: >-
        The payable of an elected later pass-through allocation is its gross, the pass-through amount of that year still unretired, discounted at estate_discount_rate_pct a year, compounded once a year, over the whole number of years from the calendar year of the election to its allocation year plus estate_expected_rotation_years, never fewer than zero years; the payable is rounded half up to the cent.
      params: [estate_discount_rate_pct, estate_expected_rotation_years]
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [final_date, status]
        note: The estate pass-through rate ladder reads the final date of the deceased member's last final-billed service account.
    compute:
      - year_text: "LATEST('capital_ledger', 'allocation_year', date_field='entry_date', event_type='capital_allocation', allocation_source='gt_allocation')"
      - allocation_year: "int(year_text)"
      - allocated: "SUM('capital_ledger', 'amount', event_type='capital_allocation', allocation_source='gt_allocation', allocation_year=year_text)"
      - already_retired: "SUM('capital_ledger', 'amount', event_type='capital_general_retirement', allocation_source='gt_allocation', allocation_year=year_text)"
      - months_since_2000: "MONTHS('2000-01-01', NOW)"
      - retirement_year: "2000 + months_since_2000 // 12"
      - cap_room: "MX(0, P('estate_annual_cap') - SUM('capital_ledger', 'amount', event_type='capital_special_retirement', retirement_type='estate', retirement_cycle=retirement_year))"
      - gross: "RND(MN(allocated - already_retired, cap_room), 2)"
      - received_text: "LATEST('capital_ledger', 'allocation_year', date_field='entry_date', event_type='capital_general_retirement', allocation_source='gt_allocation')"
      - received_year: "int(received_text) if received_text != None else 0"
      - rotation: "0 if (received_year >= allocation_year) else (K('supplier_rotation_years') if (allocation_year - received_year >= K('supplier_gap_years')) else P('estate_expected_rotation_years'))"
      - whole_years: "MX(0, allocation_year + rotation - retirement_year)"
      - last_final_date: "CFIELD('service', 'final_date', status='final_billed')"
      - account_age_months: "MONTHS(F('opened_date'), NOW)"
      - base_rate: "K('patron_estate_passthrough_rate_pct') if (last_final_date >= year_text and account_age_months >= K('long_patron_months')) else (P('early_retirement_discount_rate_pct') if (last_final_date < year_text and account_age_months < K('long_patron_months')) else P('estate_discount_rate_pct'))"
      - wait_days: "DAYS(LATEST('capital_ledger', 'entry_date', date_field='entry_date', event_type='capital_allocation', allocation_source='gt_allocation'), NOW)"
      - rate_adjust: "K('prompt_adjust_pct') if wait_days <= K('prompt_election_days') else (K('late_adjust_pct') if wait_days > K('late_election_days') else 0)"
      - rate: "base_rate + rate_adjust"
      - horizon: "K('horizon_cap_years') if whole_years >= K('horizon_cap_years') else (0 if whole_years <= K('near_rotation_years') else whole_years)"
      - pv_factor: "(1 + rate / 1200) ** (-12 * horizon) if gross < K('small_row_limit') else ((1 + rate / 200) ** (-2 * horizon) if gross < K('large_row_limit') else (1 + rate / 100) ** (-horizon))"
      - elected_rows: "COUNT('capital_ledger', event_type='capital_special_retirement', retirement_type='estate', allocation_source='gt_allocation')"
      - full_value_share: "K('many_rows_credit') if elected_rows >= K('many_elected_rows') else (K('some_rows_credit') if elected_rows >= 1 else 0)"
      - result: "RND(gross * full_value_share + gross * (1 - full_value_share) * pv_factor, 2)"
    compute_basis:
      year_text: "one election entry for each such allocation"
      allocated: "the gross is the pass-through amount of that year less every general retirement already booked on it"
      already_retired: "the gross is the pass-through amount of that year less every general retirement already booked on it"
      retirement_year: "over the whole number of years from the calendar year of the election to its allocation year plus estate_expected_rotation_years"
      cap_room: "up to estate_annual_cap of gross estate retirement in the calendar year"
      gross: "up to estate_annual_cap of gross estate retirement in the calendar year; a pass-through allocation the claimant does not elect stays in the general rotation."
      received_text: "the latest pass-through year the general retirements on the account have reached"
      received_year: "or on an account where no pass-through general retirement has ever been booked"
      rotation: "a pass-through year no later than the latest pass-through year the general retirements on the account have reached is already received and is expected in zero years; a pass-through year at least supplier_gap_years later than that latest year, or on an account where no pass-through general retirement has ever been booked, is expected on the supplier's own rotation of supplier_rotation_years years; any other pass-through year is expected on estate_expected_rotation_years years."
      whole_years: "The estate pass-through discount horizon is the row's whole years from its expected rotation"
      last_final_date: "where the member's last final-billed service account was final billed in the allocation's own year or later"
      account_age_months: "the capital account was opened at least long_patron_months full calendar months before the election"
      base_rate: "where the member's last final-billed service account was final billed in the allocation's own year or later and the capital account was opened at least long_patron_months full calendar months before the election, the row is discounted at patron_estate_passthrough_rate_pct; where that service account was final billed before the allocation's year and the account was opened fewer than long_patron_months full calendar months before the election, the row is discounted at early_retirement_discount_rate_pct; every other elected row is discounted at estate_discount_rate_pct."
      wait_days: "the calendar days from its booking date to the election"
      rate_adjust: "a wait of no more than prompt_election_days adds prompt_adjust_pct points, a wait of more than late_election_days adds late_adjust_pct points, and any other wait leaves the rate unchanged."
      horizon: "a row at least horizon_cap_years whole years away is discounted over horizon_cap_years years only; a row no more than near_rotation_years whole years away is not discounted at all; any other row is discounted over its whole years."
      pv_factor: "a gross under small_row_limit is compounded monthly at one twelfth of the adjusted rate; a gross of at least small_row_limit and under large_row_limit is compounded twice a year at one half of the adjusted rate; a gross of at least large_row_limit is compounded once a year."
      elected_rows: "where the account carries at least many_elected_rows pass-through estate retirement entries"
      full_value_share: "where the account carries at least many_elected_rows pass-through estate retirement entries, many_rows_credit of the gross is paid at full value; where it carries at least one and fewer than many_elected_rows, some_rows_credit of the gross is paid at full value; where it carries none, no part is paid at full value; the discount acts only on the rest of the gross."
      result: "The payable of the elected row is the full-value part plus the discounted rest, rounded half up to the cent."
    factors:
      - id: estate_passthrough_expected_rotation
        effect: parameter
        decides: rotation
        bindings: [received_text, received_year, rotation]
        ladder:
          - when: "the pass-through year is no later than the latest pass-through year the account's general retirements have reached"
            value: "0"
          - when: "the pass-through year is at least supplier_gap_years later than that latest year, or no pass-through general retirement was ever booked on the account"
            value: "K('supplier_rotation_years')"
          - when: "otherwise"
            value: "P('estate_expected_rotation_years')"
        baseline:
          rotation: "P('estate_expected_rotation_years')"
        evidence: [history]
        cross_difficulty: null
      - id: estate_passthrough_rate_by_patronage
        effect: parameter
        decides: base_rate
        bindings: [last_final_date, account_age_months, base_rate]
        ladder:
          - when: "the last final-billed service account was final billed in the allocation's year or later and the capital account was opened at least long_patron_months full months before"
            value: "K('patron_estate_passthrough_rate_pct')"
          - when: "the last final-billed service account was final billed before the allocation's year and the capital account was opened fewer than long_patron_months full months before"
            value: "P('early_retirement_discount_rate_pct')"
          - when: "otherwise"
            value: "P('estate_discount_rate_pct')"
        baseline:
          base_rate: "P('estate_discount_rate_pct')"
        evidence: [cross_category, date]
        cross_difficulty: service
      - id: estate_passthrough_wait_adjustment
        effect: parameter
        decides: rate_adjust
        bindings: [wait_days, rate_adjust]
        ladder:
          - when: "the pass-through allocation is elected no more than prompt_election_days calendar days after it was booked"
            value: "K('prompt_adjust_pct')"
          - when: "it is elected more than late_election_days calendar days after it was booked"
            value: "K('late_adjust_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          rate_adjust: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: estate_passthrough_horizon_transform
        effect: method
        decides: horizon
        bindings: [months_since_2000, horizon]
        ladder:
          - when: "the row is at least horizon_cap_years whole years from its expected rotation"
            method: "discount over horizon_cap_years years only"
          - when: "the row is no more than near_rotation_years whole years from its expected rotation"
            method: "no discount horizon at all (paid at full value)"
          - when: "otherwise"
            method: "discount over the whole years"
        baseline:
          horizon: "whole_years"
        evidence: [date]
        cross_difficulty: null
      - id: estate_passthrough_compounding_by_row_size
        effect: method
        decides: pv_factor
        bindings: [allocated, gross, pv_factor]
        ladder:
          - when: "the row's gross is under small_row_limit"
            method: "compound monthly at one twelfth of the rate"
          - when: "the row's gross is at least small_row_limit and under large_row_limit"
            method: "compound twice a year at one half of the rate"
          - when: "otherwise"
            method: "compound once a year at the full rate"
        baseline:
          pv_factor: "(1 + rate / 100) ** (-horizon)"
        evidence: [history]
        cross_difficulty: null
      - id: estate_passthrough_prior_election_credit
        effect: parameter
        decides: full_value_share
        bindings: [elected_rows, full_value_share]
        ladder:
          - when: "the account carries at least many_elected_rows pass-through estate retirement entries"
            value: "K('many_rows_credit')"
          - when: "it carries at least one and fewer than many_elected_rows"
            value: "K('some_rows_credit')"
          - when: "otherwise"
            value: "0"
        baseline:
          full_value_share: "0"
        evidence: [history]
        cross_difficulty: null
    inputs:
      history:
        - {table: capital_ledger, aggregate: sum, field: amount, filters: {event_type: capital_allocation, allocation_source: gt_allocation}}
        - {table: capital_ledger, aggregate: count, field: capital_entry_id, filters: {event_type: capital_special_retirement, retirement_type: estate, allocation_source: gt_allocation}}
        - {table: capital_ledger, aggregate: latest, field: allocation_year, filters: {event_type: capital_general_retirement, allocation_source: gt_allocation}}
      cross_category: [service]
  - id: capital_ext_check_replacement
    base_policy_refs: [capital_agg_member_payout, capital_evt_checks, capital_evt_estate_retirement, capital_evt_donation]
    overwrite:
      - base_policy: capital_evt_checks
        superseded_clause: >-
          the first check_reissue_free_count reissues of one payout are free and later ones have check_reissue_fee deducted (capital_msr_reissues).
        replaced_by: >-
          The replacement fee is counted from the voided check entries on the account: where they number no more than check_reissue_free_count the replacement is free; where they number exactly one more than check_reissue_free_count, check_reissue_fee is deducted; where they number more than that, repeat_reissue_fee is deducted.
      - base_policy: capital_agg_member_payout
        superseded_clause: >-
          Payouts are assembled per member, not per capital account.
        replaced_by: >-
          A replacement check carries a base that depends on the account it is issued from: on an account in estate claim pending status it carries the whole retired amount owed on the account; on an inactive account it carries the voided amount together with the rest of the amount owed where that rest is below minimum_check_amount, and the voided amount alone otherwise; on any other account it carries the voided amount alone.
    trigger: on_request
    subject: [capital_disbursement]
    computes: check_amount
    target_tool: reissue_capital_check_624c80d7
    params:
      repeat_reissue_fee: 25.0
      certified_mail_charge: 6.95
      stop_notice_charge: 3.5
      repeated_returns: 2
      short_hold_months: 3
      long_hold_months: 12
      short_hold_charge: 2.5
      long_hold_charge: 5.0
    rule: >
      A voided capital credit check is replaced, on the request of the member or of the estate's claimant, by one new check payout to the mailing address on file that names the most recently voided check of the chain as the payout it replaces and carries that payout's retirement year.
      A replacement check for an estate is fixed only after the account carries a payable entry for every distribution-margin allocation booked to it after the estate's board approval.
      A replacement check for an estate is not issued until the claimant has made the election on every pass-through allocation booked to the account after the estate's board approval.
      The face of a replacement check is the voided amount of the most recently voided check, the amount that void returned to the amount owed, with nothing deducted; the face is rounded half up to the cent.
      A replacement check carries a base that depends on the account it is issued from: on an account in estate claim pending status it carries the whole retired amount owed on the account; on an inactive account it carries the voided amount together with the rest of the amount owed where that rest is below minimum_check_amount, and the voided amount alone otherwise; on any other account it carries the voided amount alone.
      The replacement fee is counted from the voided check entries on the account: where they number no more than check_reissue_free_count the replacement is free; where they number exactly one more than check_reissue_free_count, check_reissue_fee is deducted; where they number more than that, repeat_reissue_fee is deducted.
      The mailing charge of a replacement follows how its checks went astray: where the account's voided checks include at least repeated_returns returned undeliverable, the replacement goes by certified mail and certified_mail_charge is deducted; where they include a check reported lost and fewer than repeated_returns returned undeliverable, stop_notice_charge is deducted for the stop-payment notice; otherwise no mailing charge is deducted.
      The records charge of a replacement follows how long the voided amount has been held, the full calendar months from the most recent void to the replacement: a hold of at least long_hold_months costs long_hold_charge, a hold of at least short_hold_months and fewer than long_hold_months costs short_hold_charge, and a shorter hold costs nothing.
      The face of the replacement is its base less the replacement fee, the mailing charge and the records charge, which together are recorded as the charges deducted, rounded half up to the cent and never below zero.
    baseline:
      rule: >-
        The face of a replacement check is the voided amount of the most recently voided check, the amount that void returned to the amount owed, with nothing deducted; the face is rounded half up to the cent.
      params: []
    prerequisite:
      - problem: capital_ext_estate_later_allocation
        kind: value_input
        gate: carried
        form: state
        policy_source: >-
          A replacement check for an estate is fixed only after the account carries a payable entry for every distribution-margin allocation booked to it after the estate's board approval.
        condition: >-
          Every distribution-margin capital_allocation entry whose entry_date is later than the estate request's board_approval_date has a matching capital_payable_accrual entry with retirement_type estate on the account.
        resolved_by: book_estate_later_allocation_bc10e318
        effect: >-
          The later distribution-margin row's payable joins the account's payable_balance, so the base carried by the replacement check rises by that payable.
      - problem: capital_ext_estate_passthrough_election
        kind: value_input
        gate: carried
        form: action
        policy_source: >-
          A replacement check for an estate is not issued until the claimant has made the election on every pass-through allocation booked to the account after the estate's board approval.
        fallback_reason: >-
          The claimant may elect a later pass-through allocation, which leaves a payable entry, or decline it, which leaves the row unretired in the general rotation with no new record; a declined row and a row never asked about look identical in the records, so no record-visible state carries the wait and the sentence names the claimant's election itself.
        condition: >-
          For every gt_allocation capital_allocation entry whose entry_date is later than the estate request's board_approval_date, the claimant's decision has been taken; where the claimant elects, a capital_payable_accrual entry with retirement_type estate and allocation_source gt_allocation stands for that year.
        resolved_by: elect_estate_passthrough_retirement_e31dc75a
        effect: >-
          An elected pass-through row's payable joins the account's payable_balance, so the base carried by the replacement check rises by that payable.
    cross_category: []
    compute:
      - void_amount: "LATEST('capital_ledger', 'amount', date_field='entry_date', event_type='capital_check_void')"
      - owed: "F('payable_balance')"
      - rest_owed: "RND(owed - void_amount, 2)"
      - carried: "owed if F('status') == 'estate_claim_pending' else ((owed if rest_owed < P('minimum_check_amount') else void_amount) if F('status') == 'inactive' else void_amount)"
      - void_count: "COUNT('capital_ledger', event_type='capital_check_void')"
      - replacement_fee: "0 if void_count <= P('check_reissue_free_count') else (P('check_reissue_fee') if void_count == P('check_reissue_free_count') + 1 else K('repeat_reissue_fee'))"
      - undeliverable_returns: "COUNT('capital_ledger', event_type='capital_check_void', void_reason='returned_undeliverable')"
      - lost_reports: "COUNT('capital_ledger', event_type='capital_check_void', void_reason='lost')"
      - mailing_charge: "K('certified_mail_charge') if undeliverable_returns >= K('repeated_returns') else (K('stop_notice_charge') if (lost_reports >= 1 and undeliverable_returns < K('repeated_returns')) else 0)"
      - months_held: "MONTHS(LATEST('capital_ledger', 'entry_date', date_field='entry_date', event_type='capital_check_void'), NOW)"
      - records_charge: "K('long_hold_charge') if months_held >= K('long_hold_months') else (K('short_hold_charge') if months_held >= K('short_hold_months') else 0)"
      - deductions: "RND(replacement_fee + mailing_charge + records_charge, 2)"
      - result: "MX(0, RND(carried - deductions, 2))"
    compute_basis:
      void_amount: "the voided amount of the most recently voided check, the amount that void returned to the amount owed"
      owed: "on an account in estate claim pending status it carries the whole retired amount owed on the account"
      rest_owed: "the voided amount together with the rest of the amount owed where that rest is below minimum_check_amount"
      carried: "on an account in estate claim pending status it carries the whole retired amount owed on the account; on an inactive account it carries the voided amount together with the rest of the amount owed where that rest is below minimum_check_amount, and the voided amount alone otherwise; on any other account it carries the voided amount alone."
      void_count: "The replacement fee is counted from the voided check entries on the account"
      replacement_fee: "where they number no more than check_reissue_free_count the replacement is free; where they number exactly one more than check_reissue_free_count, check_reissue_fee is deducted; where they number more than that, repeat_reissue_fee is deducted."
      undeliverable_returns: "where the account's voided checks include at least repeated_returns returned undeliverable"
      lost_reports: "where they include a check reported lost and fewer than repeated_returns returned undeliverable"
      mailing_charge: "the replacement goes by certified mail and certified_mail_charge is deducted; where they include a check reported lost and fewer than repeated_returns returned undeliverable, stop_notice_charge is deducted for the stop-payment notice; otherwise no mailing charge is deducted."
      months_held: "the full calendar months from the most recent void to the replacement"
      records_charge: "a hold of at least long_hold_months costs long_hold_charge, a hold of at least short_hold_months and fewer than long_hold_months costs short_hold_charge, and a shorter hold costs nothing."
      deductions: "which together are recorded as the charges deducted"
      result: "The face of the replacement is its base less the replacement fee, the mailing charge and the records charge, which together are recorded as the charges deducted, rounded half up to the cent and never below zero."
    factors:
      - id: replacement_base_by_account_status
        effect: method
        decides: carried
        bindings: [void_amount, owed, rest_owed, carried]
        ladder:
          - when: "the account is in estate claim pending status"
            method: "carry the whole retired amount owed on the account"
          - when: "the account is inactive"
            method: "carry the voided amount plus the rest owed when that rest is below minimum_check_amount, else the voided amount alone"
          - when: "otherwise"
            method: "carry the voided amount alone"
        baseline:
          carried: "void_amount"
        evidence: [history]
        cross_difficulty: null
      - id: replacement_fee_by_voids
        effect: parameter
        decides: replacement_fee
        bindings: [void_count, replacement_fee]
        ladder:
          - when: "the account's voided check entries number more than check_reissue_free_count plus one"
            value: "K('repeat_reissue_fee')"
          - when: "they number exactly check_reissue_free_count plus one"
            value: "P('check_reissue_fee')"
          - when: "otherwise"
            value: "0"
        baseline:
          replacement_fee: "0"
        evidence: [history]
        cross_difficulty: null
      - id: replacement_mailing_charge
        effect: parameter
        decides: mailing_charge
        bindings: [undeliverable_returns, lost_reports, mailing_charge]
        ladder:
          - when: "at least repeated_returns of the account's voided checks were returned undeliverable"
            value: "K('certified_mail_charge')"
          - when: "a voided check was reported lost and fewer than repeated_returns were returned undeliverable"
            value: "K('stop_notice_charge')"
          - when: "otherwise"
            value: "0"
        baseline:
          mailing_charge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: replacement_records_charge
        effect: parameter
        decides: records_charge
        bindings: [months_held, records_charge]
        ladder:
          - when: "the voided amount has been held at least long_hold_months full months"
            value: "K('long_hold_charge')"
          - when: "it has been held at least short_hold_months and fewer than long_hold_months full months"
            value: "K('short_hold_charge')"
          - when: "otherwise"
            value: "0"
        baseline:
          records_charge: "0"
        evidence: [date, history]
        cross_difficulty: null
    inputs:
      history:
        - {table: capital_ledger, aggregate: latest, field: amount, filters: {event_type: capital_check_void}}
        - {table: capital_ledger, aggregate: count, field: capital_entry_id, filters: {event_type: capital_check_void}}
      cross_category: []
