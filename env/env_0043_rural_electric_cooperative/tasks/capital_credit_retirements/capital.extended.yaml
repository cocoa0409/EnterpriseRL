  - id: capital_ext_estate_later_allocation
    base_policy_refs: [capital_evt_estate_retirement, capital_evt_early_retirement, capital_evt_general_retirement]
    overwrite:
      - base_policy: capital_evt_estate_retirement
        superseded_clause: >-
          Where estate_discount_applies is true each row's payable is its amount discounted at estate_discount_rate_pct for the number of whole years remaining until the year it would be retired in the general rotation (its allocation_year plus estate_expected_rotation_years), never fewer than zero years.
        replaced_by: >-
          The payable of a later distribution-margin allocation retired for an estate is its gross, the allocated amount of that year still unretired, discounted at estate_discount_rate_pct a year, compounded once a year, over the whole number of years from the calendar year of the retirement to its allocation year plus estate_expected_rotation_years, never fewer than zero years; the payable is rounded half up to the cent.
    trigger: state_due
    subject: [capital_special_retirement, capital_payable_accrual]
    computes: payable_amount
    target_tool: book_estate_later_allocation_bc10e318
    params:
      patron_estate_rate_pct: 5.0
      long_patron_months: 180
      prompt_retirement_days: 90
      late_retirement_days: 365
      prompt_adjust_pct: -0.25
      late_adjust_pct: 0.5
      horizon_cap_years: 20
      near_rotation_years: 2
      small_row_limit: 100
      large_row_limit: 1000
      recent_approval_months: 6
      approval_year_months: 12
      recent_approval_credit: 0.2
      approval_year_credit: 0.1
    rule: >
      A distribution-margin allocation booked to a deceased member's capital account after the estate's retirement was approved is retired for the estate under the same approved request, up to estate_annual_cap of gross estate retirement in the calendar year; each such row is booked as one special retirement entry with retirement type estate for its gross, together with one payable entry for its payable, and the gross is the allocated amount of that year less every general retirement already booked on it.
      The payable of a later distribution-margin allocation retired for an estate is its gross, the allocated amount of that year still unretired, discounted at estate_discount_rate_pct a year, compounded once a year, over the whole number of years from the calendar year of the retirement to its allocation year plus estate_expected_rotation_years, never fewer than zero years; the payable is rounded half up to the cent.
      The estate discount rate for a later distribution-margin allocation follows the member's patronage: where the member's last final-billed service account was final billed in the allocation's own year or later and the capital account was opened at least long_patron_months full calendar months before the retirement, the row is discounted at patron_estate_rate_pct; where that service account was final billed before the allocation's year and the account was opened fewer than long_patron_months full calendar months before the retirement, the row is discounted at early_retirement_discount_rate_pct; every other estate row is discounted at estate_discount_rate_pct.
      The estate discount rate is then moved by how long the later allocation has waited, the calendar days from the booking date of the allocation to the retirement: a wait of no more than prompt_retirement_days adds prompt_adjust_pct points, a wait of more than late_retirement_days adds late_adjust_pct points, and any other wait leaves the rate unchanged.
      The estate discount horizon of a later distribution-margin row is its whole years from rotation, the whole years from the calendar year of the retirement to its allocation year plus estate_expected_rotation_years, never fewer than zero, transformed as follows: a row at least horizon_cap_years whole years from rotation is discounted over horizon_cap_years years only; a row no more than near_rotation_years whole years from rotation is not discounted at all; any other row is discounted over its whole years.
      The estate discount is compounded by the size of the row's gross: a gross under small_row_limit is compounded monthly at one twelfth of the adjusted rate; a gross of at least small_row_limit and under large_row_limit is compounded twice a year at one half of the adjusted rate; a gross of at least large_row_limit is compounded once a year.
      An estate settled recently keeps part of a later distribution-margin row at full value: where the estate's request was approved by the board no more than recent_approval_months full calendar months before the retirement, recent_approval_credit of the gross is paid at full value; where it was approved more than recent_approval_months and no more than approval_year_months full calendar months before, approval_year_credit of the gross is paid at full value; an older approval leaves no part at full value; the discount acts only on the rest of the gross.
      The payable of the row is the full-value part plus the discounted rest, rounded half up to the cent.
    baseline:
      rule: >-
        The payable of a later distribution-margin allocation retired for an estate is its gross, the allocated amount of that year still unretired, discounted at estate_discount_rate_pct a year, compounded once a year, over the whole number of years from the calendar year of the retirement to its allocation year plus estate_expected_rotation_years, never fewer than zero years; the payable is rounded half up to the cent.
      params: [estate_discount_rate_pct, estate_expected_rotation_years]
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [final_date, status]
        note: The estate discount rate ladder reads the final date of the deceased member's last final-billed service account.
    compute:
      - year_text: "LATEST('capital_ledger', 'allocation_year', date_field='entry_date', event_type='capital_allocation', allocation_source='distribution_margin')"
      - allocation_year: "int(year_text)"
      - allocated: "SUM('capital_ledger', 'amount', event_type='capital_allocation', allocation_source='distribution_margin', allocation_year=year_text)"
      - already_retired: "SUM('capital_ledger', 'amount', event_type='capital_general_retirement', allocation_source='distribution_margin', allocation_year=year_text)"
      - months_since_2000: "MONTHS('2000-01-01', NOW)"
      - retirement_year: "2000 + months_since_2000 // 12"
      - cap_room: "MX(0, P('estate_annual_cap') - SUM('capital_ledger', 'amount', event_type='capital_special_retirement', retirement_type='estate', retirement_cycle=retirement_year))"
      - gross: "RND(MN(allocated - already_retired, cap_room), 2)"
      - whole_years: "MX(0, allocation_year + P('estate_expected_rotation_years') - retirement_year)"
      - last_final_date: "CFIELD('service', 'final_date', status='final_billed')"
      - account_age_months: "MONTHS(F('opened_date'), NOW)"
      - base_rate: "K('patron_estate_rate_pct') if (last_final_date >= year_text and account_age_months >= K('long_patron_months')) else (P('early_retirement_discount_rate_pct') if (last_final_date < year_text and account_age_months < K('long_patron_months')) else P('estate_discount_rate_pct'))"
      - wait_days: "DAYS(LATEST('capital_ledger', 'entry_date', date_field='entry_date', event_type='capital_allocation', allocation_source='distribution_margin'), NOW)"
      - rate_adjust: "K('prompt_adjust_pct') if wait_days <= K('prompt_retirement_days') else (K('late_adjust_pct') if wait_days > K('late_retirement_days') else 0)"
      - rate: "base_rate + rate_adjust"
      - horizon: "K('horizon_cap_years') if whole_years >= K('horizon_cap_years') else (0 if whole_years <= K('near_rotation_years') else whole_years)"
      - pv_factor: "(1 + rate / 1200) ** (-12 * horizon) if gross < K('small_row_limit') else ((1 + rate / 200) ** (-2 * horizon) if gross < K('large_row_limit') else (1 + rate / 100) ** (-horizon))"
      - approval_age_months: "MONTHS(LATEST('capital_requests', 'board_approval_date', date_field='submitted_date', request_type='estate_retirement'), NOW)"
      - full_value_share: "K('recent_approval_credit') if approval_age_months <= K('recent_approval_months') else (K('approval_year_credit') if approval_age_months <= K('approval_year_months') else 0)"
      - result: "RND(gross * full_value_share + gross * (1 - full_value_share) * pv_factor, 2)"
    compute_basis:
