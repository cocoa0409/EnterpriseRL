      - patronage_years: "COUNT('capital_ledger', event_type='capital_allocation', allocation_source='gt_allocation')"
      - rate: "K('brief_passthrough_rate_pct') if (months_gone >= K('long_gone_months') and patronage_years < K('brief_patron_years')) else (K('long_passthrough_rate_pct') if (months_gone >= K('long_gone_months') and patronage_years >= K('long_patron_years')) else P('early_retirement_discount_rate_pct'))"
      - months_elapsed: "months_since_2000 % 12"
      - horizon: "(whole_years - months_elapsed / 12) if whole_years >= K('long_horizon_years') else (0 if whole_years <= K('near_rotation_years') else whole_years)"
      - pv_factor: "(1 + rate / 1200) ** (-12 * horizon) if gross < K('small_row_limit') else ((1 + rate / 200) ** (-2 * horizon) if gross < K('mid_row_limit') else (1 + rate / 100) ** (-horizon))"
      - earlier_requests: "COUNT('capital_requests', request_type='discounted_early_retirement', request_status='withdrawn') + COUNT('capital_requests', request_type='discounted_early_retirement', request_status='denied')"
      - rows_booked: "COUNT('capital_ledger', event_type='capital_payable_accrual', retirement_type='discounted_early', capital_request_id=request_id)"
      - request_fee: "(K('repeat_refile_fee') if earlier_requests >= 2 else (K('refile_fee') if earlier_requests == 1 else 0)) if rows_booked == 0 else 0"
      - result: "MX(0, RND(gross * pv_factor - request_fee, 2))"
    compute_basis:
      request_id: "Each elected row is booked as one special retirement entry with retirement type discounted_early for its gross, together with one payable entry for the payable the member accepts"
      year_text: "one election entry for each pass-through allocation year the member chooses"
      allocated: "the gross is the pass-through amount of that allocation year less every general retirement already booked on it"
      already_retired: "the gross is the pass-through amount of that allocation year less every general retirement already booked on it"
      gross: "the gross is the pass-through amount of that allocation year less every general retirement already booked on it"
      retirement_year: "over the whole number of years from the calendar year of the election to the year the row would be retired in the general rotation"
      received_text: "the latest pass-through year the general retirements on the account have reached"
      received_year: "or on an account where no pass-through general retirement has ever been booked"
      rotation: "a pass-through year no later than the latest pass-through year the general retirements on the account have reached is already received and is expected in zero years; a pass-through year at least supplier_gap_years later than that latest year, or on an account where no pass-through general retirement has ever been booked, is expected on the supplier's own rotation of supplier_rotation_years years; any other pass-through year is expected on estate_expected_rotation_years years."
      whole_years: "The pass-through discount horizon is counted by the row's whole years from rotation on its expected rotation"
      months_gone: "a former member whose last final-billed service account has been final for at least long_gone_months full calendar months"
      patronage_years: "whose account holds fewer than brief_patron_years pass-through allocation years"
      rate: "a former member whose last final-billed service account has been final for at least long_gone_months full calendar months and whose account holds fewer than brief_patron_years pass-through allocation years is discounted at brief_passthrough_rate_pct; one whose last final-billed service account has been final for at least long_gone_months full calendar months and whose account holds at least long_patron_years pass-through allocation years is discounted at long_passthrough_rate_pct; every other former member is discounted at early_retirement_discount_rate_pct."
      months_elapsed: "less the full calendar months already elapsed in the year of the election, taken in twelfths of a year"
      horizon: "a row at least long_horizon_years whole years away is discounted over those whole years less the full calendar months already elapsed in the year of the election, taken in twelfths of a year; a row no more than near_rotation_years whole years away is not discounted at all; any other row is discounted over its whole years."
      pv_factor: "a gross under small_row_limit is compounded monthly at one twelfth of the rate; a gross of at least small_row_limit and under mid_row_limit is compounded twice a year at one half of the rate; a gross of at least mid_row_limit is compounded once a year."
      earlier_requests: "owed once per request by a member who withdrew or was denied an earlier discounted early retirement request on the account, one such request costing refile_fee and two or more costing repeat_refile_fee"
      rows_booked: "so an elected row carries it only when no payable entry of that request stands on the account yet."
      request_fee: "it is deducted from the first row booked under the approved request, so an elected row carries it only when no payable entry of that request stands on the account yet."
      result: "less the request's refiling fee where it is still owed; the payable is rounded half up to the cent and never below zero."
    factors:
      - id: passthrough_expected_rotation
        effect: parameter
        decides: rotation
        bindings: [received_text, received_year, rotation]
        ladder:
          - when: "the pass-through year is no later than the latest pass-through year the account's general retirements have reached"
            value: "0"
          - when: "the pass-through year is at least supplier_gap_years later than that latest year, or no pass-through general retirement was ever booked on the account"
            value: "K('supplier_rotation_years')"
          - when: "otherwise"
            value: "P('estate_expected_rotation_years')"
        baseline:
          rotation: "P('estate_expected_rotation_years')"
        evidence: [history]
        cross_difficulty: null
      - id: passthrough_rate_by_departure_and_patronage
        effect: parameter
        decides: rate
        bindings: [months_gone, patronage_years, rate]
        ladder:
          - when: "the last final-billed service account has been final for at least long_gone_months full months and the account holds fewer than brief_patron_years pass-through allocation years"
            value: "K('brief_passthrough_rate_pct')"
          - when: "the last final-billed service account has been final for at least long_gone_months full months and the account holds at least long_patron_years pass-through allocation years"
            value: "K('long_passthrough_rate_pct')"
          - when: "otherwise"
            value: "P('early_retirement_discount_rate_pct')"
        baseline:
          rate: "P('early_retirement_discount_rate_pct')"
        evidence: [cross_category, history]
        cross_difficulty: service
      - id: passthrough_horizon_count
        effect: method
        decides: horizon
        bindings: [months_since_2000, months_elapsed, horizon]
        ladder:
          - when: "the row is at least long_horizon_years whole years from its expected rotation"
            method: "discount over the whole years less the full months already elapsed in the year of the election, in twelfths"
          - when: "the row is no more than near_rotation_years whole years from its expected rotation"
            method: "no discount horizon at all (paid at full value)"
          - when: "otherwise"
            method: "discount over the whole years"
        baseline:
          horizon: "whole_years"
        evidence: [date, history]
        cross_difficulty: null
      - id: passthrough_compounding_by_row_size
        effect: method
        decides: pv_factor
        bindings: [allocated, gross, pv_factor]
        ladder:
          - when: "the row's gross is under small_row_limit"
            method: "compound monthly at one twelfth of the rate"
          - when: "the row's gross is at least small_row_limit and under mid_row_limit"
            method: "compound twice a year at one half of the rate"
          - when: "otherwise"
            method: "compound once a year at the full rate"
        baseline:
          pv_factor: "(1 + rate / 100) ** (-horizon)"
        evidence: [history]
        cross_difficulty: null
