      cross_category: [arrange]
  - id: service_ext_meter_error_refund
    base_policy_refs: [service_evt_late_charge, service_evt_meter_test, service_evt_bill_credits]
    overwrite:
      - base_policy: service_evt_meter_test
        superseded_clause: >-
          A meter found fast beyond tolerance is replaced and the member is credited, with credit_reason
          meter_error_refund, the overbilled share of the energy charges of the rebill window
          (service_msr_rebill_window_energy), which is that sum multiplied by the error percent divided by one
          hundred plus the error percent, rounded to the cent.
        replaced_by: >-
          The meter error refund is the overbilled share of the energy charge lines of the rebill window, rounded to
          the cent, and is posted as one bill credit with credit_reason meter_error_refund whose source is the meter
          test.
      - base_policy: service_evt_late_charge
        superseded_clause: >-
          A late charge is never partly waived.
        replaced_by: >-
          when they exist and the account carries no disconnect date, they are refunded at the overbilled share,
          rounded to the cent
    trigger: state_due
    subject: [service_bill_credit]
    computes: refund_amount
    target_tool: post_meter_error_credit_d380ee62
    params:
      earlier_test_fee_share: 0.50
      long_overbilling_interest_pct: 1.84
      mid_overbilling_interest_pct: 0.92
    rule: >-
      A member-requested meter test found fast beyond meter_accuracy_tolerance_pct is settled by a meter error
      refund on the same service account, figured from the latest test found fast and its meter_error_pct. The
      meter error refund is the overbilled share of the energy charge lines of the rebill window, rounded to the
      cent, and is posted as one bill credit with credit_reason meter_error_refund whose source is the meter test.
      The rebill window runs back meter_error_rebill_max_months whole months from the current date, so that it
      covers the energy charge lines dated less than that many whole months before the current date. The
      overbilled share is the error percent divided by one hundred plus the error percent.
      Rebill window: when the latest test that found the meter within tolerance was performed less than
      meter_error_rebill_max_months whole months before the current date, the window runs back only the whole
      months elapsed since that accurate test; when there is no such recent accurate test and the account's
      connect date is less than meter_error_rebill_max_months whole months before the current date, the window
      runs back the whole months elapsed since the connect date; otherwise it runs back
      meter_error_rebill_max_months whole months.
      Re-pricing of the over-registered energy: on a schedule whose energy_rate_block2_per_kwh is below its
      energy_rate_block1_per_kwh, when the kWh of the window's energy charge lines exceed block1_kwh_limit times
      the number of those lines, the over-registered kWh - the window's kWh times the overbilled share - are
      refunded at energy_rate_block2_per_kwh, the marginal rate they were billed at, rounded to the cent; on such a
      schedule when the window's kWh do not exceed that allowance, the over-registered kWh are refunded at
      energy_rate_block1_per_kwh, rounded to the cent; on any other schedule the refund is the overbilled share of
      the window's energy charge lines.
      Overbilled share: when the error found is at least three times meter_accuracy_tolerance_pct, the share is
      the error percent divided by one hundred; when the error is below three times the tolerance and a test in
      the twelve whole months before the current date found the meter within tolerance, the share is the error
      in excess of the tolerance divided by one hundred plus that excess; otherwise the share is the error
      percent divided by one hundred plus the error percent.
      Late charge refund: the late payment charges dated in the rebill window are added back to the refund,
      leaving out the latest late payment charge when it is dated after the test was performed; when such late
      payment charges exist and the account carries a disconnect date for nonpayment, they are refunded in full;
      when they exist and the account carries no disconnect date, they are refunded at the overbilled share,
      rounded to the cent; otherwise no late payment charge is refunded. The late charge refund is added to the
      meter error refund before any overbilling interest is applied.
      Overbilling interest: when the rebill window covers six or more billed energy charge lines, the meter
      error refund together with the late charge refund is increased by long_overbilling_interest_pct percent;
      when it covers three to five billed energy charge lines, that sum is increased by mid_overbilling_interest_pct
      percent; otherwise no interest is added; the increased sum is rounded to the cent.
      Meter test fee refund: when a meter test fee is dated in the rebill window, that fee is refunded in full;
      when no meter test fee is dated in the window but meter test fees are dated less than
      meter_error_rebill_max_months whole months before the current date, earlier_test_fee_share of those earlier
      fees is refunded, rounded to the cent; otherwise no test fee is refunded. The test fee refund is added last,
      after any overbilling interest, and the total is rounded to the cent.
    prerequisite: []
    cross_category: []
    compute:
      - test_error: "LATEST('service_trouble_reports', 'meter_error_pct', date_field='resolution_date', event_type='service_meter_test', meter_test_result='fast')"
      - test_resolved: "LATEST('service_trouble_reports', 'resolution_date', date_field='resolution_date', event_type='service_meter_test', meter_test_result='fast')"
      - accurate_test_date: "LATEST('service_trouble_reports', 'resolution_date', date_field='resolution_date', event_type='service_meter_test', meter_test_result='within_tolerance')"
      - window_periods: "MONTHS(accurate_test_date, NOW) if (accurate_test_date and MONTHS(accurate_test_date, NOW) < P('meter_error_rebill_max_months')) else (MONTHS(F('connect_date'), NOW) if MONTHS(F('connect_date'), NOW) < P('meter_error_rebill_max_months') else P('meter_error_rebill_max_months'))"
      - window_energy: "SUM('service_charges', 'amount', within_months=window_periods, date_field='charge_date', event_type='service_usage_charge', charge_component='energy_charge')"
      - periods_billed: "COUNT('service_charges', within_months=window_periods, date_field='charge_date', event_type='service_usage_charge', charge_component='energy_charge')"
      - accurate_tests_12m: "COUNT('service_trouble_reports', within_months=12, date_field='resolution_date', event_type='service_meter_test', meter_test_result='within_tolerance')"
      - overbilled_share: "test_error / 100 if test_error >= 3 * P('meter_accuracy_tolerance_pct') else ((test_error - P('meter_accuracy_tolerance_pct')) / (100 + test_error - P('meter_accuracy_tolerance_pct')) if (test_error < 3 * P('meter_accuracy_tolerance_pct') and accurate_tests_12m >= 1) else test_error / (100 + test_error))"
      - window_kwh: "SUM('service_charges', 'kwh', within_months=window_periods, date_field='charge_date', event_type='service_usage_charge', charge_component='energy_charge')"
      - energy_refund: "RND(window_kwh * overbilled_share * P('energy_rate_block2_per_kwh'), 2) if (P('energy_rate_block2_per_kwh') < P('energy_rate_block1_per_kwh') and window_kwh > P('block1_kwh_limit') * periods_billed) else (RND(window_kwh * overbilled_share * P('energy_rate_block1_per_kwh'), 2) if (P('energy_rate_block2_per_kwh') < P('energy_rate_block1_per_kwh') and window_kwh <= P('block1_kwh_limit') * periods_billed) else RND(window_energy * overbilled_share, 2))"
      - window_late: "SUM('service_charges', 'amount', within_months=window_periods, date_field='charge_date', event_type='service_late_charge')"
      - latest_late_date: "LATEST('service_charges', 'charge_date', date_field='charge_date', event_type='service_late_charge')"
      - latest_late_amount: "LATEST('service_charges', 'amount', date_field='charge_date', event_type='service_late_charge')"
      - window_late_before_test: "window_late - (latest_late_amount if (latest_late_date and latest_late_date > test_resolved and MONTHS(latest_late_date, NOW) < window_periods) else 0)"
      - disconnected_on: "F('disconnect_date')"
      - late_charge_refund: "window_late_before_test if (window_late_before_test > 0 and disconnected_on) else (RND(window_late_before_test * overbilled_share, 2) if (window_late_before_test > 0 and not disconnected_on) else 0)"
      - interest_factor: "(1 + K('long_overbilling_interest_pct') / 100) if periods_billed >= 6 else ((1 + K('mid_overbilling_interest_pct') / 100) if (periods_billed >= 3 and periods_billed < 6) else 1)"
      - test_fees_window: "SUM('service_charges', 'amount', within_months=window_periods, date_field='charge_date', event_type='service_fee', charge_component='meter_test_fee')"
      - test_fees_max_window: "SUM('service_charges', 'amount', within_months=P('meter_error_rebill_max_months'), date_field='charge_date', event_type='service_fee', charge_component='meter_test_fee')"
      - test_fee_refund: "test_fees_window if test_fees_window > 0 else (RND((test_fees_max_window - test_fees_window) * K('earlier_test_fee_share'), 2) if (test_fees_window == 0 and test_fees_max_window > 0) else 0)"
      - result: "RND(RND((energy_refund + late_charge_refund) * interest_factor, 2) + test_fee_refund, 2)"
    compute_basis:
      test_error: "figured from the latest test found fast and its meter_error_pct"
      test_resolved: "leaving out the latest late payment charge when it is dated after the test was performed"
      accurate_test_date: "when the latest test that found the meter within tolerance was performed less than meter_error_rebill_max_months whole months before the current date"
      window_periods: "Rebill window: when the latest test that found the meter within tolerance was performed less than meter_error_rebill_max_months whole months before the current date, the window runs back only the whole months elapsed since that accurate test; when there is no such recent accurate test and the account's connect date is less than meter_error_rebill_max_months whole months before the current date, the window runs back the whole months elapsed since the connect date; otherwise it runs back meter_error_rebill_max_months whole months."
      window_energy: "The meter error refund is the overbilled share of the energy charge lines of the rebill window, rounded to the cent, and is posted as one bill credit with credit_reason meter_error_refund whose source is the meter test."
      periods_billed: "when the kWh of the window's energy charge lines exceed block1_kwh_limit times the number of those lines"
      accurate_tests_12m: "a test in the twelve whole months before the current date found the meter within tolerance"
      overbilled_share: "Overbilled share: when the error found is at least three times meter_accuracy_tolerance_pct, the share is the error percent divided by one hundred; when the error is below three times the tolerance and a test in the twelve whole months before the current date found the meter within tolerance, the share is the error in excess of the tolerance divided by one hundred plus that excess; otherwise the share is the error percent divided by one hundred plus the error percent."
      window_kwh: "the over-registered kWh - the window's kWh times the overbilled share"
      energy_refund: "Re-pricing of the over-registered energy: on a schedule whose energy_rate_block2_per_kwh is below its energy_rate_block1_per_kwh, when the kWh of the window's energy charge lines exceed block1_kwh_limit times the number of those lines, the over-registered kWh - the window's kWh times the overbilled share - are refunded at energy_rate_block2_per_kwh, the marginal rate they were billed at, rounded to the cent; on such a schedule when the window's kWh do not exceed that allowance, the over-registered kWh are refunded at energy_rate_block1_per_kwh, rounded to the cent; on any other schedule the refund is the overbilled share of the window's energy charge lines."
      window_late: "the late payment charges dated in the rebill window are added back to the refund"
      latest_late_date: "leaving out the latest late payment charge when it is dated after the test was performed"
      latest_late_amount: "leaving out the latest late payment charge when it is dated after the test was performed"
      window_late_before_test: "Late charge refund: the late payment charges dated in the rebill window are added back to the refund, leaving out the latest late payment charge when it is dated after the test was performed"
      disconnected_on: "the account carries a disconnect date for nonpayment"
      late_charge_refund: "when such late payment charges exist and the account carries a disconnect date for nonpayment, they are refunded in full; when they exist and the account carries no disconnect date, they are refunded at the overbilled share, rounded to the cent; otherwise no late payment charge is refunded."
      interest_factor: "Overbilling interest: when the rebill window covers six or more billed energy charge lines, the meter error refund together with the late charge refund is increased by long_overbilling_interest_pct percent; when it covers three to five billed energy charge lines, that sum is increased by mid_overbilling_interest_pct percent; otherwise no interest is added; the increased sum is rounded to the cent."
      test_fees_window: "when a meter test fee is dated in the rebill window, that fee is refunded in full"
      test_fees_max_window: "meter test fees are dated less than meter_error_rebill_max_months whole months before the current date"
      test_fee_refund: "Meter test fee refund: when a meter test fee is dated in the rebill window, that fee is refunded in full; when no meter test fee is dated in the window but meter test fees are dated less than meter_error_rebill_max_months whole months before the current date, earlier_test_fee_share of those earlier fees is refunded, rounded to the cent; otherwise no test fee is refunded."
      result: "The late charge refund is added to the meter error refund before any overbilling interest is applied. The test fee refund is added last, after any overbilling interest, and the total is rounded to the cent."
    factors:
      - id: rebill_window_length
        effect: method
        decides: window_periods
        bindings: [accurate_test_date, window_periods]
        ladder:
          - when: "the latest within-tolerance test was performed less than meter_error_rebill_max_months whole months before today"
            method: "the window runs back the whole months elapsed since that accurate test"
          - when: "no such recent accurate test, and the connect date is less than meter_error_rebill_max_months whole months before today"
            method: "the window runs back the whole months elapsed since the connect date"
          - when: "otherwise"
            method: "the window runs back meter_error_rebill_max_months whole months"
        baseline:
          window_periods: "P('meter_error_rebill_max_months')"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: over_registered_energy_pricing
        effect: method
        decides: energy_refund
        bindings: [window_kwh, energy_refund]
        ladder:
          - when: "a declining-block schedule and window kWh above block1_kwh_limit times the window's energy lines"
            method: "over-registered kWh (window kWh x overbilled share) priced at energy_rate_block2_per_kwh"
          - when: "a declining-block schedule and window kWh within that allowance"
            method: "over-registered kWh priced at energy_rate_block1_per_kwh"
          - when: "otherwise"
            method: "the overbilled share of the window's energy charge lines"
        baseline:
          energy_refund: "RND(window_energy * overbilled_share, 2)"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: overbilled_share_method
        effect: method
        decides: overbilled_share
        bindings: [accurate_tests_12m, overbilled_share]
        ladder:
          - when: "the error found is at least three times meter_accuracy_tolerance_pct"
            method: "share = error / 100"
          - when: "the error is below three times the tolerance and a test in the twelve months before today found the meter within tolerance"
            method: "share = (error - tolerance) / (100 + error - tolerance)"
          - when: "otherwise"
            method: "share = error / (100 + error)"
        baseline:
          overbilled_share: "test_error / (100 + test_error)"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: late_charge_refund_on_overbilling
        effect: parameter
        decides: late_charge_refund
        bindings: [window_late, latest_late_date, latest_late_amount, window_late_before_test, disconnected_on, late_charge_refund]
        ladder:
          - when: "late payment charges dated in the window (the latest left out when dated after the test) and a disconnect date for nonpayment on the account"
            value: "those late payment charges in full"
          - when: "such late payment charges and no disconnect date on the account"
            value: "those late payment charges times the overbilled share, rounded to the cent"
          - when: "otherwise"
            value: "0"
        baseline:
          late_charge_refund: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: overbilling_interest
        effect: parameter
        decides: interest_factor
        bindings: [periods_billed, interest_factor]
        ladder:
          - when: "the window covers six or more billed energy charge lines"
            value: "1 + long_overbilling_interest_pct / 100"
          - when: "the window covers three to five billed energy charge lines"
            value: "1 + mid_overbilling_interest_pct / 100"
          - when: "otherwise"
            value: "1"
        baseline:
          interest_factor: "1"
        evidence: [history]
        cross_difficulty: null
      - id: meter_test_fee_refund
        effect: parameter
        decides: test_fee_refund
        bindings: [test_fees_window, test_fees_max_window, test_fee_refund]
        ladder:
          - when: "a meter test fee dated in the rebill window"
            value: "that fee in full"
          - when: "no fee in the window but meter test fees dated less than meter_error_rebill_max_months whole months before today"
            value: "earlier_test_fee_share of those earlier fees, rounded to the cent"
          - when: "otherwise"
            value: "0"
        baseline:
          test_fee_refund: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A member-requested meter test found fast beyond meter_accuracy_tolerance_pct is settled by a meter error
        refund on the same service account, figured from the latest test found fast and its meter_error_pct. The
        meter error refund is the overbilled share of the energy charge lines of the rebill window, rounded to the
        cent, and is posted as one bill credit with credit_reason meter_error_refund whose source is the meter test.
        The rebill window runs back meter_error_rebill_max_months whole months from the current date, so that it
        covers the energy charge lines dated less than that many whole months before the current date. The
        overbilled share is the error percent divided by one hundred plus the error percent.
      params: [meter_accuracy_tolerance_pct, meter_error_rebill_max_months]
    inputs:
      history:
        - {table: service_trouble_reports, aggregate: latest, field: meter_error_pct, filters: {event_type: service_meter_test, meter_test_result: fast}}
        - {table: service_charges, aggregate: sum, field: amount, within_months: 6, filters: {event_type: service_usage_charge, charge_component: energy_charge}}
        - {table: service_charges, aggregate: sum, field: kwh, within_months: 6, filters: {event_type: service_usage_charge, charge_component: energy_charge}}
        - {table: service_charges, aggregate: sum, field: amount, within_months: 6, filters: {event_type: service_late_charge}}
        - {table: service_charges, aggregate: sum, field: amount, within_months: 6, filters: {event_type: service_fee, charge_component: meter_test_fee}}
      cross_category: []
  - id: service_ext_reconnection_payment
    base_policy_refs: [service_evt_payments, service_evt_reconnect]
    overwrite: []
    trigger: on_request
    subject: [service_payment]
    computes: payment_amount
    target_tool: pay_reconnection_amount_66e1876e
    params:
      clearing_days: 5
      charitable_pledge_cap: 100.00
    rule: >-
      A member whose service account is disconnected for nonpayment and who asks to have power restored is told
      the reconnection payment, the amount the member pays on the spot toward reconnection. The reconnection
      payment is the amount owed for reconnection less the payments counted toward reconnection, rounded to the
      cent and never less than zero. The amount owed for reconnection is the disconnect_past_due_amount the
      notice demands. The payments counted toward reconnection are the payments dated less than one whole month
      before the current date less the returned payments dated in that month.
      The reconnection payment is fixed only after every bill left unpaid past its due date carries its late
      payment charge line on the account.
      The reconnection payment is not worked out until every meter test on the account that found the meter
      fast carries its meter error refund credit.
      Amount owed for reconnection: when a reconnect fee is dated less than twelve whole months before the
      current date and a returned payment is dated in those twelve months, the amount owed is the whole current
      account balance with the payments of the month before the current date added back and the returned
      payments of that month taken off; when such a reconnect fee is dated in those twelve months and no
      returned payment is, the amount owed is the notice amount plus every usage line, program charge line, late
      payment charge and fee dated in the month before the current date, less the bill credits dated in that
      month; when no such reconnect fee is dated in those twelve months and a returned payment is, the amount
      owed is the notice amount plus the late payment charges and fees dated in that month, less the bill credits
      dated in that month; otherwise the amount owed is the notice amount.
      Payments counted toward reconnection: while the account is on cash-only status through the current date,
      only payments through the cash_only_accepted_channels are counted, the other payments of the month being
      left out; when the account is not on cash-only status and the latest payment through online_echeck,
      mail_check, office_check or autopay_bank_draft, taken channel by channel, is dated no more than
      clearing_days calendar days before the current date, each such uncleared payment is left out until it
      clears; otherwise every payment of the month is counted; returned payments of the month are taken off in
      every case.
      Pledge selection for reconnection: when two or more pledges from the agency of the latest energy assistance
      pledge are dated in the month before the current date and that agency has paid nothing in that month, only
      that latest pledge is taken, the later pledge replacing the earlier; when that agency has posted payments
      in that month, the latest pledge less those payments, never below zero, is taken; otherwise every pledge
      dated in that month is taken.
      Pledge credit toward reconnection: when the latest pledge comes from liheap or county_emergency_assistance
      and was recorded no more than assistance_pledge_hold_days calendar days before the current date, the
      selected pledge amount is credited in full against the reconnection payment; when it comes from
      salvation_army or operation_round_up and was recorded within those days, the selected pledge amount is
      credited up to charitable_pledge_cap; otherwise no pledge is credited.
      Deposit installment with reconnection: an installment of a partially_paid security deposit is past due once
      one whole month has elapsed since its assessed date, the later installments falling due with the next
      monthly bills, and an assessed deposit with nothing paid is past due once more than its tier's
      deposit_due_days calendar days have elapsed since its assessed date. When the account's security deposit
      has an installment or its first payment past due and its tier has installment_default_accelerates, the
      whole unpaid remainder of the deposit, which then falls due at once and counts as past due on the service
      account, is added to the reconnection payment; when the deposit is partially_paid with no installment yet
      past due, its next installment - the required amount less a first installment of the tier's
      first_installment_pct percent of it, split evenly over the remaining installments, rounded to the cent and
      never more than the unpaid part - is added; otherwise nothing is added.
    prerequisite:
      - problem: service_ext_late_charge_assessment
        kind: value_input
        gate: month_charges
        form: state
        policy_source: >-
          The reconnection payment is fixed only after every bill left unpaid past its due date carries its late
          payment charge line on the account.
        condition: >-
          Every billing period whose bill remained unpaid after its due date has a service_late_charge row on the
          service account.
        resolved_by: assess_late_charge_b4948c69
        effect: >-
          The late payment charge line booked on the unpaid bill is dated in the month before the current date and
          so enters the charges of the month that the amount owed for reconnection adds to the notice amount.
      - problem: service_ext_meter_error_refund
        kind: value_input
        gate: month_credits
        form: state
        policy_source: >-
          The reconnection payment is not worked out until every meter test on the account that found the meter
          fast carries its meter error refund credit.
        condition: >-
          Every service_meter_test row with meter_test_result fast on the service account is the source of a
          service_bill_credit row with credit_reason meter_error_refund.
        resolved_by: post_meter_error_credit_d380ee62
        effect: >-
          The meter error refund credit is dated in the month before the current date and so enters the bill
          credits of the month that the amount owed for reconnection takes off.
    cross_category:
      - category: deposit
        as: branch
        reads: [status, required_amount, held_amount, installment_count, assessed_date, first_installment_pct, installment_default_accelerates, deposit_due_days]
        note: The deposit-installment factor reads the account's security deposit record and its tier parameters to decide what deposit amount rides on the reconnection payment.
    compute:
      - notice_amount: "F('disconnect_past_due_amount')"
      - reconnects_12m: "COUNT('service_charges', within_months=12, date_field='charge_date', event_type='service_fee', charge_component='reconnect_fee')"
      - returns_12m: "COUNT('service_payments', within_months=12, date_field='payment_date', event_type='service_payment_return')"
      - month_late_and_fees: "SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_late_charge') + SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_fee')"
      - month_charges: "SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_usage_charge') + SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_program_charge') + month_late_and_fees"
      - month_credits: "SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_bill_credit')"
      - month_payments: "SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment')"
      - month_returns: "SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment_return')"
      - amount_owed: "(F('account_balance') + month_payments - month_returns) if (reconnects_12m >= 1 and returns_12m >= 1) else ((notice_amount + month_charges - month_credits) if (reconnects_12m >= 1 and returns_12m == 0) else ((notice_amount + month_late_and_fees - month_credits) if (reconnects_12m == 0 and returns_12m >= 1) else notice_amount))"
      - cash_only_until: "F('cash_only_until')"
      - month_non_cash_channels: "SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment', payment_channel='online_echeck') + SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment', payment_channel='mail_check') + SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment', payment_channel='office_check') + SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment', payment_channel='autopay_bank_draft') + SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment', payment_channel='energy_assistance_agency')"
      - echeck_date: "LATEST('service_payments', 'payment_date', date_field='payment_date', event_type='service_payment', payment_channel='online_echeck')"
      - echeck_amount: "LATEST('service_payments', 'amount', date_field='payment_date', event_type='service_payment', payment_channel='online_echeck')"
      - mail_check_date: "LATEST('service_payments', 'payment_date', date_field='payment_date', event_type='service_payment', payment_channel='mail_check')"
      - mail_check_amount: "LATEST('service_payments', 'amount', date_field='payment_date', event_type='service_payment', payment_channel='mail_check')"
      - office_check_date: "LATEST('service_payments', 'payment_date', date_field='payment_date', event_type='service_payment', payment_channel='office_check')"
      - office_check_amount: "LATEST('service_payments', 'amount', date_field='payment_date', event_type='service_payment', payment_channel='office_check')"
      - bank_draft_date: "LATEST('service_payments', 'payment_date', date_field='payment_date', event_type='service_payment', payment_channel='autopay_bank_draft')"
      - bank_draft_amount: "LATEST('service_payments', 'amount', date_field='payment_date', event_type='service_payment', payment_channel='autopay_bank_draft')"
      - uncleared_payments: "(echeck_amount if (echeck_date and DAYS(echeck_date, NOW) <= K('clearing_days')) else 0) + (mail_check_amount if (mail_check_date and DAYS(mail_check_date, NOW) <= K('clearing_days')) else 0) + (office_check_amount if (office_check_date and DAYS(office_check_date, NOW) <= K('clearing_days')) else 0) + (bank_draft_amount if (bank_draft_date and DAYS(bank_draft_date, NOW) <= K('clearing_days')) else 0)"
      - payments_counted: "(month_payments - month_non_cash_channels - month_returns) if (cash_only_until and DAYS(NOW, cash_only_until) >= 0) else ((month_payments - uncleared_payments - month_returns) if (uncleared_payments > 0 and not (cash_only_until and DAYS(NOW, cash_only_until) >= 0)) else (month_payments - month_returns))"
      - pledges_month: "SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_assistance_pledge')"
      - latest_pledge_amount: "LATEST('service_payments', 'amount', date_field='payment_date', event_type='service_assistance_pledge')"
      - latest_pledge_date: "LATEST('service_payments', 'payment_date', date_field='payment_date', event_type='service_assistance_pledge')"
      - latest_pledge_agency: "LATEST('service_payments', 'assistance_agency', date_field='payment_date', event_type='service_assistance_pledge')"
      - same_agency_pledges: "COUNT('service_payments', within_months=1, date_field='payment_date', event_type='service_assistance_pledge', assistance_agency=latest_pledge_agency)"
      - pledging_agency_paid: "SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment', payment_channel='energy_assistance_agency', assistance_agency=latest_pledge_agency)"
      - pledge_selected: "latest_pledge_amount if (same_agency_pledges >= 2 and pledging_agency_paid == 0) else (MX(0, latest_pledge_amount - pledging_agency_paid) if pledging_agency_paid > 0 else pledges_month)"
      - pledge_credit: "pledge_selected if ((latest_pledge_agency == 'liheap' or latest_pledge_agency == 'county_emergency_assistance') and latest_pledge_date and DAYS(latest_pledge_date, NOW) <= P('assistance_pledge_hold_days')) else (MN(pledge_selected, K('charitable_pledge_cap')) if ((latest_pledge_agency == 'salvation_army' or latest_pledge_agency == 'operation_round_up') and latest_pledge_date and DAYS(latest_pledge_date, NOW) <= P('assistance_pledge_hold_days')) else 0)"
      - deposit_status: "CFIELD('deposit', 'status', service_account_id=HID)"
      - deposit_required: "CFIELD('deposit', 'required_amount', service_account_id=HID)"
      - deposit_held: "CFIELD('deposit', 'held_amount', service_account_id=HID)"
      - deposit_installments: "CFIELD('deposit', 'installment_count', service_account_id=HID)"
      - deposit_assessed_on: "CFIELD('deposit', 'assessed_date', service_account_id=HID)"
      - deposit_first_pct: "CPARAM('deposit', 'first_installment_pct', service_account_id=HID)"
      - deposit_accelerates: "CPARAM('deposit', 'installment_default_accelerates', service_account_id=HID)"
      - deposit_due_days: "CPARAM('deposit', 'deposit_due_days', service_account_id=HID)"
      - deposit_past_due: "(deposit_status == 'partially_paid' and MONTHS(deposit_assessed_on, NOW) >= 1) or (deposit_status == 'assessed' and DAYS(deposit_assessed_on, NOW) > deposit_due_days)"
      - deposit_installment_due: "(deposit_required - deposit_held) if (deposit_past_due and deposit_accelerates) else (MN(deposit_required - deposit_held, RND((deposit_required - RND(deposit_required * deposit_first_pct / 100, 2)) / (deposit_installments - 1), 2)) if (deposit_status == 'partially_paid' and not deposit_past_due and deposit_installments > 1) else 0)"
      - result: "RND(MX(0, amount_owed - payments_counted - pledge_credit + deposit_installment_due), 2)"
    compute_basis:
      notice_amount: "The amount owed for reconnection is the disconnect_past_due_amount the notice demands."
      reconnects_12m: "when a reconnect fee is dated less than twelve whole months before the current date"
      returns_12m: "and a returned payment is dated in those twelve months"
      month_late_and_fees: "the amount owed is the notice amount plus the late payment charges and fees dated in that month, less the bill credits dated in that month"
      month_charges: "the amount owed is the notice amount plus every usage line, program charge line, late payment charge and fee dated in the month before the current date, less the bill credits dated in that month"
      month_credits: "less the bill credits dated in that month"
      month_payments: "The payments counted toward reconnection are the payments dated less than one whole month before the current date less the returned payments dated in that month."
      month_returns: "less the returned payments dated in that month"
      amount_owed: "Amount owed for reconnection: when a reconnect fee is dated less than twelve whole months before the current date and a returned payment is dated in those twelve months, the amount owed is the whole current account balance with the payments of the month before the current date added back and the returned payments of that month taken off; when such a reconnect fee is dated in those twelve months and no returned payment is, the amount owed is the notice amount plus every usage line, program charge line, late payment charge and fee dated in the month before the current date, less the bill credits dated in that month; when no such reconnect fee is dated in those twelve months and a returned payment is, the amount owed is the notice amount plus the late payment charges and fees dated in that month, less the bill credits dated in that month; otherwise the amount owed is the notice amount."
      cash_only_until: "while the account is on cash-only status through the current date"
      month_non_cash_channels: "only payments through the cash_only_accepted_channels are counted, the other payments of the month being left out"
      echeck_date: "the latest payment through online_echeck, mail_check, office_check or autopay_bank_draft, taken channel by channel, is dated no more than clearing_days calendar days before the current date"
      echeck_amount: "each such uncleared payment is left out until it clears"
      mail_check_date: "the latest payment through online_echeck, mail_check, office_check or autopay_bank_draft, taken channel by channel"
      mail_check_amount: "each such uncleared payment is left out until it clears"
      office_check_date: "the latest payment through online_echeck, mail_check, office_check or autopay_bank_draft, taken channel by channel"
      office_check_amount: "each such uncleared payment is left out until it clears"
      bank_draft_date: "the latest payment through online_echeck, mail_check, office_check or autopay_bank_draft, taken channel by channel"
      bank_draft_amount: "each such uncleared payment is left out until it clears"
      uncleared_payments: "when the account is not on cash-only status and the latest payment through online_echeck, mail_check, office_check or autopay_bank_draft, taken channel by channel, is dated no more than clearing_days calendar days before the current date, each such uncleared payment is left out until it clears"
      payments_counted: "Payments counted toward reconnection: while the account is on cash-only status through the current date, only payments through the cash_only_accepted_channels are counted, the other payments of the month being left out; when the account is not on cash-only status and the latest payment through online_echeck, mail_check, office_check or autopay_bank_draft, taken channel by channel, is dated no more than clearing_days calendar days before the current date, each such uncleared payment is left out until it clears; otherwise every payment of the month is counted; returned payments of the month are taken off in every case."
      pledges_month: "otherwise every pledge dated in that month is taken."
      latest_pledge_amount: "only that latest pledge is taken, the later pledge replacing the earlier"
      latest_pledge_date: "was recorded no more than assistance_pledge_hold_days calendar days before the current date"
      latest_pledge_agency: "when the latest pledge comes from liheap or county_emergency_assistance"
      same_agency_pledges: "when two or more pledges from the agency of the latest energy assistance pledge are dated in the month before the current date"
      pledging_agency_paid: "when that agency has posted payments in that month, the latest pledge less those payments, never below zero, is taken"
      pledge_selected: "Pledge selection for reconnection: when two or more pledges from the agency of the latest energy assistance pledge are dated in the month before the current date and that agency has paid nothing in that month, only that latest pledge is taken, the later pledge replacing the earlier; when that agency has posted payments in that month, the latest pledge less those payments, never below zero, is taken; otherwise every pledge dated in that month is taken."
      pledge_credit: "Pledge credit toward reconnection: when the latest pledge comes from liheap or county_emergency_assistance and was recorded no more than assistance_pledge_hold_days calendar days before the current date, the selected pledge amount is credited in full against the reconnection payment; when it comes from salvation_army or operation_round_up and was recorded within those days, the selected pledge amount is credited up to charitable_pledge_cap; otherwise no pledge is credited."
      deposit_status: "an installment of a partially_paid security deposit is past due once one whole month has elapsed since its assessed date"
      deposit_required: "the whole unpaid remainder of the deposit"
      deposit_held: "the whole unpaid remainder of the deposit"
      deposit_installments: "split evenly over the remaining installments, rounded to the cent and never more than the unpaid part"
      deposit_assessed_on: "once one whole month has elapsed since its assessed date"
      deposit_first_pct: "the required amount less a first installment of the tier's first_installment_pct percent of it"
      deposit_accelerates: "its tier has installment_default_accelerates"
      deposit_due_days: "an assessed deposit with nothing paid is past due once more than its tier's deposit_due_days calendar days have elapsed since its assessed date"
      deposit_past_due: "an installment of a partially_paid security deposit is past due once one whole month has elapsed since its assessed date, the later installments falling due with the next monthly bills, and an assessed deposit with nothing paid is past due once more than its tier's deposit_due_days calendar days have elapsed since its assessed date"
      deposit_installment_due: "When the account's security deposit has an installment or its first payment past due and its tier has installment_default_accelerates, the whole unpaid remainder of the deposit, which then falls due at once and counts as past due on the service account, is added to the reconnection payment; when the deposit is partially_paid with no installment yet past due, its next installment - the required amount less a first installment of the tier's first_installment_pct percent of it, split evenly over the remaining installments, rounded to the cent and never more than the unpaid part - is added; otherwise nothing is added."
      result: "The reconnection payment is the amount owed for reconnection less the payments counted toward reconnection, rounded to the cent and never less than zero."
    factors:
      - id: amount_owed_for_reconnection
        effect: method
        decides: amount_owed
        bindings: [reconnects_12m, returns_12m, amount_owed]
        ladder:
          - when: "a reconnect fee and a returned payment both dated in the twelve months before today"
            method: "the whole current balance, with the month's payments added back and its returned payments taken off"
          - when: "a reconnect fee in those twelve months and no returned payment"
            method: "the notice amount plus every usage line, program charge line, late payment charge and fee of the month, less the month's bill credits"
          - when: "no reconnect fee in those twelve months and a returned payment"
            method: "the notice amount plus the month's late payment charges and fees, less the month's bill credits"
          - when: "otherwise"
            method: "the notice amount"
        baseline:
          amount_owed: "notice_amount"
        evidence: [history]
        cross_difficulty: null
      - id: payments_counted_toward_reconnection
        effect: method
        decides: payments_counted
        bindings: [cash_only_until, month_non_cash_channels, echeck_date, echeck_amount, mail_check_date, mail_check_amount, office_check_date, office_check_amount, bank_draft_date, bank_draft_amount, uncleared_payments, payments_counted]
        ladder:
          - when: "the account is on cash-only status through today"
            method: "only payments of the month through the cash_only_accepted_channels count, less returned payments"
          - when: "not on cash-only status and the latest payment through online_echeck, mail_check, office_check or autopay_bank_draft is dated within clearing_days before today"
            method: "each such uncleared latest payment is left out; the rest of the month's payments count, less returned payments"
          - when: "otherwise"
            method: "every payment of the month counts, less returned payments"
        baseline:
          payments_counted: "month_payments - month_returns"
        evidence: [history, date]
        cross_difficulty: null
      - id: pledge_selection_for_reconnection
        effect: method
        decides: pledge_selected
        bindings: [pledges_month, latest_pledge_amount, same_agency_pledges, pledging_agency_paid, pledge_selected]
        ladder:
          - when: "two or more pledges from the latest pledge's agency in the month before today and no payment from that agency in the month"
            method: "take only the latest pledge (the later pledge replaces the earlier)"
          - when: "that agency has posted payments in the month"
            method: "take the latest pledge less those payments, never below zero"
          - when: "otherwise"
            method: "take every pledge dated in the month"
        baseline:
          pledge_selected: "pledges_month"
        evidence: [history]
        cross_difficulty: null
      - id: pledge_credit_toward_reconnection
        effect: parameter
        decides: pledge_credit
        bindings: [latest_pledge_date, latest_pledge_agency, pledge_credit]
        ladder:
          - when: "the latest pledge is from liheap or county_emergency_assistance and was recorded within assistance_pledge_hold_days before today"
            value: "the selected pledge amount in full"
          - when: "the latest pledge is from salvation_army or operation_round_up and was recorded within those days"
            value: "the selected pledge amount up to charitable_pledge_cap"
          - when: "otherwise"
            value: "0"
        baseline:
          pledge_credit: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: deposit_installment_with_reconnection
        effect: parameter
        decides: deposit_installment_due
        bindings: [deposit_status, deposit_required, deposit_held, deposit_installments, deposit_assessed_on, deposit_first_pct, deposit_accelerates, deposit_due_days, deposit_past_due, deposit_installment_due]
        ladder:
          - when: "the security deposit has an installment (or, unpaid, its first payment) past due and its tier has installment_default_accelerates"
            value: "the whole unpaid remainder of the deposit"
          - when: "the deposit is partially_paid with no installment yet past due"
            value: "the next installment: (required - first_installment_pct of required) / (installments - 1), rounded, at most the unpaid part"
          - when: "otherwise"
            value: "0"
        baseline:
          deposit_installment_due: "0"
        evidence: [cross_category]
        cross_difficulty: deposit
    baseline:
      rule: >-
        A member whose service account is disconnected for nonpayment and who asks to have power restored is told
        the reconnection payment, the amount the member pays on the spot toward reconnection. The reconnection
        payment is the amount owed for reconnection less the payments counted toward reconnection, rounded to the
        cent and never less than zero. The amount owed for reconnection is the disconnect_past_due_amount the
        notice demands. The payments counted toward reconnection are the payments dated less than one whole month
        before the current date less the returned payments dated in that month.
      params: []
    inputs:
      history:
        - {table: service_charges, aggregate: count, field: charge_id, within_months: 12, filters: {event_type: service_fee, charge_component: reconnect_fee}}
        - {table: service_charges, aggregate: sum, field: amount, within_months: 1, filters: {event_type: service_usage_charge}}
        - {table: service_payments, aggregate: sum, field: amount, within_months: 1, filters: {event_type: service_payment}}
        - {table: service_payments, aggregate: sum, field: amount, within_months: 1, filters: {event_type: service_assistance_pledge}}
      cross_category: [deposit]
  - id: service_ext_reconnect_fee
    base_policy_refs: [service_agg_member_balance, service_evt_reconnect]
    overwrite:
      - base_policy: service_evt_reconnect
        superseded_clause: >-
          The reconnect fee is reconnect_fee_remote when the meter_type is ami_remote_disconnect; otherwise it is
          reconnect_fee_truck_business_hours when the reconnect order is placed on a weekday that is not a
          cooperative holiday between business_hours_start and business_hours_end, and reconnect_fee_after_hours
          at any other time.
        replaced_by: >-
          Crew charge: when the meter is ami_remote_disconnect and no meter damage report is dated in the month
          before the current date, the crew charge is reconnect_fee_remote; when the meter is ami_demand_ct, or a
          meter damage report is dated in that month, the crew charge is reconnect_fee_after_hours, the rate of a
          two-person crew; otherwise it is reconnect_fee_truck_business_hours.
    trigger: on_request
    subject: [service_reconnect]
    computes: reconnect_fee_amount
    target_tool: reconnect_service_ea86e786
    params:
      repeat_reconnect_surcharge: 25.00
      frequent_reconnect_surcharge: 50.00
      reestablishment_reconnect_surcharge: 10.00
      reinstatement_reconnect_surcharge: 20.00
      multi_day_inspection_charge: 15.00
      extended_outage_inspection_charge: 30.00
      light_restore_charge: 15.00
      light_pole_check_charge: 7.50
      standard_lookback_months: 12
    rule: >-
      A service account disconnected for nonpayment is reconnected at the member's request, and the
      reconnection bills one reconnect fee on the account, billed on the next bill and never collected as a
      condition of reconnection. The reconnection, and the reconnect fee billed with it, is made only after a
      payment at least equal to the reconnection payment the account requires stands on the account, posted on
      the day of reconnection. In its standard form the reconnect fee is the crew charge, rounded to the cent.
      The crew charge is reconnect_fee_truck_business_hours, the charge of a crew truck sent during business
      hours. Whenever a reconnect surcharge below applies, the reconnect fee is the crew charge plus every such
      surcharge, rounded to the cent.
      Crew charge: when the meter is ami_remote_disconnect and no meter damage report is dated in the month
      before the current date, the crew charge is reconnect_fee_remote; when the meter is ami_demand_ct, or a
      meter damage report is dated in that month, the crew charge is reconnect_fee_after_hours, the rate of a
      two-person crew; otherwise it is reconnect_fee_truck_business_hours.
      Reconnection look-back: the earlier reconnections of the account are counted from a starting event that
      depends on its collection record; when the account's payment arrangement is defaulted with an ended date
      less than twelve whole months before the current date, every reconnect fee since the account's connect date
      is counted, the look-back running the whole months elapsed since the connect date, the month in progress
      counted; when it has no such defaulted arrangement and a returned payment is dated less than twelve whole
      months before the current date, the reconnect fees since the latest returned payment are counted, the
      look-back running the whole months elapsed since that return's posting date, the month in progress
      counted; otherwise the reconnect fees dated less than standard_lookback_months whole months before the
      current date are counted.
      Repeat reconnection surcharge: an account with two or more reconnect fees dated in the reconnection
      look-back adds frequent_reconnect_surcharge; an account with exactly one such reconnect fee adds
      repeat_reconnect_surcharge; any other account adds nothing.
      Deposit basis surcharge: when the account's security deposit was assessed on the basis
      reconnect_after_nonpay, the reconnection adds reestablishment_reconnect_surcharge; when it was assessed on
      the basis waiver_reinstatement, it adds reinstatement_reconnect_surcharge; otherwise it adds nothing.
      Site inspection charge: when the meter has stood disconnected fourteen or more calendar days, counted from
      the disconnect date to the current date, the reconnection adds extended_outage_inspection_charge; when it
      has stood disconnected three to thirteen calendar days, it adds multi_day_inspection_charge; otherwise it
      adds nothing.
      Area light restoration charge: when the area light rented on the account is out_of_service, the crew
      relamps it on the reconnection trip and the reconnection adds light_restore_charge; when the rented area
      light is active and stands on one or more additional poles, it adds light_pole_check_charge; otherwise it
      adds nothing.
    prerequisite:
      - problem: service_ext_reconnection_payment
        kind: state_gate
        gate: service_evt_reconnect.past_due_covered
        form: state
        policy_source: >-
          The reconnection, and the reconnect fee billed with it, is made only after a payment at least equal to
          the reconnection payment the account requires stands on the account, posted on the day of
          reconnection.
        condition: >-
          A service_payment row dated the current date, for at least the reconnection payment, stands on the
          service account.
        resolved_by: pay_reconnection_amount_66e1876e
        effect: >-
          The member's own payment of the reconnection payment posts on the account, so the reconnection and its
          reconnect fee may be booked.
    cross_category:
      - category: arrange
        as: branch
        reads: [status, ended_date]
        note: The reconnection look-back reads whether the account's payment arrangement defaulted in the last twelve months.
      - category: deposit
        as: branch
        reads: [assessment_basis]
        note: The deposit basis surcharge reads the basis the account's security deposit was assessed on.
      - category: light
        as: branch
        reads: [status, pole_count]
        note: The area light restoration charge reads the status and pole count of the area light rented on the account.
    compute:
      - meter_kind: "F('meter_type')"
      - meter_damage_reports: "COUNT('service_trouble_reports', within_months=1, date_field='report_date', event_type='service_outage_report', trouble_type='meter_damage')"
      - crew_charge: "P('reconnect_fee_remote') if (meter_kind == 'ami_remote_disconnect' and meter_damage_reports == 0) else (P('reconnect_fee_after_hours') if (meter_kind == 'ami_demand_ct' or meter_damage_reports > 0) else P('reconnect_fee_truck_business_hours'))"
      - arrangement_status: "CFIELD('arrange', 'status', service_account_id=HID)"
      - arrangement_ended: "CFIELD('arrange', 'ended_date', service_account_id=HID)"
      - returns_12m: "COUNT('service_payments', within_months=12, date_field='payment_date', event_type='service_payment_return')"
      - latest_return_date: "LATEST('service_payments', 'payment_date', date_field='payment_date', event_type='service_payment_return')"
      - lookback_months: "(MONTHS(F('connect_date'), NOW) + 1) if (arrangement_status == 'defaulted' and arrangement_ended and MONTHS(arrangement_ended, NOW) < 12) else ((MONTHS(latest_return_date, NOW) + 1) if (not (arrangement_status == 'defaulted' and arrangement_ended and MONTHS(arrangement_ended, NOW) < 12) and returns_12m >= 1 and latest_return_date) else K('standard_lookback_months'))"
      - prior_reconnects: "COUNT('service_charges', within_months=lookback_months, date_field='charge_date', event_type='service_fee', charge_component='reconnect_fee')"
      - repeat_surcharge: "K('frequent_reconnect_surcharge') if prior_reconnects >= 2 else (K('repeat_reconnect_surcharge') if prior_reconnects == 1 else 0)"
      - deposit_basis: "CFIELD('deposit', 'assessment_basis', service_account_id=HID)"
      - deposit_surcharge: "K('reestablishment_reconnect_surcharge') if deposit_basis == 'reconnect_after_nonpay' else (K('reinstatement_reconnect_surcharge') if deposit_basis == 'waiver_reinstatement' else 0)"
      - days_disconnected: "DAYS(F('disconnect_date'), NOW) if F('disconnect_date') else 0"
      - inspection_charge: "K('extended_outage_inspection_charge') if days_disconnected >= 14 else (K('multi_day_inspection_charge') if (days_disconnected >= 3 and days_disconnected < 14) else 0)"
      - light_status: "CFIELD('light', 'status', service_account_id=HID)"
      - light_poles: "CFIELD('light', 'pole_count', service_account_id=HID)"
      - light_charge: "K('light_restore_charge') if light_status == 'out_of_service' else (K('light_pole_check_charge') if (light_status == 'active' and light_poles and light_poles >= 1) else 0)"
      - result: "RND(crew_charge + repeat_surcharge + deposit_surcharge + inspection_charge + light_charge, 2)"
    compute_basis:
      meter_kind: "when the meter is ami_remote_disconnect"
      meter_damage_reports: "no meter damage report is dated in the month before the current date"
      crew_charge: "Crew charge: when the meter is ami_remote_disconnect and no meter damage report is dated in the month before the current date, the crew charge is reconnect_fee_remote; when the meter is ami_demand_ct, or a meter damage report is dated in that month, the crew charge is reconnect_fee_after_hours, the rate of a two-person crew; otherwise it is reconnect_fee_truck_business_hours."
      arrangement_status: "when the account's payment arrangement is defaulted with an ended date less than twelve whole months before the current date"
      arrangement_ended: "with an ended date less than twelve whole months before the current date"
      returns_12m: "a returned payment is dated less than twelve whole months before the current date"
      latest_return_date: "the reconnect fees since the latest returned payment are counted, the look-back running the whole months elapsed since that return's posting date"
      lookback_months: "Reconnection look-back: the earlier reconnections of the account are counted from a starting event that depends on its collection record; when the account's payment arrangement is defaulted with an ended date less than twelve whole months before the current date, every reconnect fee since the account's connect date is counted, the look-back running the whole months elapsed since the connect date, the month in progress counted; when it has no such defaulted arrangement and a returned payment is dated less than twelve whole months before the current date, the reconnect fees since the latest returned payment are counted, the look-back running the whole months elapsed since that return's posting date, the month in progress counted; otherwise the reconnect fees dated less than standard_lookback_months whole months before the current date are counted."
      prior_reconnects: "an account with two or more reconnect fees dated in the reconnection look-back"
      repeat_surcharge: "Repeat reconnection surcharge: an account with two or more reconnect fees dated in the reconnection look-back adds frequent_reconnect_surcharge; an account with exactly one such reconnect fee adds repeat_reconnect_surcharge; any other account adds nothing."
      deposit_basis: "when the account's security deposit was assessed on the basis reconnect_after_nonpay"
      deposit_surcharge: "Deposit basis surcharge: when the account's security deposit was assessed on the basis reconnect_after_nonpay, the reconnection adds reestablishment_reconnect_surcharge; when it was assessed on the basis waiver_reinstatement, it adds reinstatement_reconnect_surcharge; otherwise it adds nothing."
      days_disconnected: "counted from the disconnect date to the current date"
      inspection_charge: "Site inspection charge: when the meter has stood disconnected fourteen or more calendar days, counted from the disconnect date to the current date, the reconnection adds extended_outage_inspection_charge; when it has stood disconnected three to thirteen calendar days, it adds multi_day_inspection_charge; otherwise it adds nothing."
      light_status: "when the area light rented on the account is out_of_service"
      light_poles: "stands on one or more additional poles"
      light_charge: "Area light restoration charge: when the area light rented on the account is out_of_service, the crew relamps it on the reconnection trip and the reconnection adds light_restore_charge; when the rented area light is active and stands on one or more additional poles, it adds light_pole_check_charge; otherwise it adds nothing."
      result: "Whenever a reconnect surcharge below applies, the reconnect fee is the crew charge plus every such surcharge, rounded to the cent."
    factors:
      - id: crew_charge_for_reconnection
        effect: parameter
        decides: crew_charge
        bindings: [meter_kind, meter_damage_reports, crew_charge]
        ladder:
          - when: "an ami_remote_disconnect meter and no meter damage report in the month before today"
            value: "P('reconnect_fee_remote')"
          - when: "an ami_demand_ct meter, or a meter damage report in that month"
            value: "P('reconnect_fee_after_hours')"
          - when: "otherwise"
            value: "P('reconnect_fee_truck_business_hours')"
        baseline:
          crew_charge: "P('reconnect_fee_truck_business_hours')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: reconnection_lookback_window
        effect: method
        decides: lookback_months
        bindings: [arrangement_status, arrangement_ended, returns_12m, latest_return_date, lookback_months]
        ladder:
          - when: "the account's payment arrangement defaulted with an ended date less than twelve whole months before today"
            method: "the look-back is anchored on the account's connect date: every reconnect fee since connection is counted"
          - when: "no such defaulted arrangement and a returned payment in the twelve months before today"
            method: "the look-back is anchored on the latest returned payment: the reconnect fees since its posting date are counted"
          - when: "otherwise"
            method: "a rolling window: the reconnect fees of the standard_lookback_months whole months before today are counted"
        baseline:
          lookback_months: "K('standard_lookback_months')"
        evidence: [cross_category, history, date]
        cross_difficulty: arrange
      - id: repeat_reconnection_surcharge
        effect: parameter
        decides: repeat_surcharge
        bindings: [prior_reconnects, repeat_surcharge]
        ladder:
          - when: "two or more reconnect fees dated in the reconnection look-back"
            value: "K('frequent_reconnect_surcharge')"
          - when: "exactly one such reconnect fee"
            value: "K('repeat_reconnect_surcharge')"
          - when: "otherwise"
            value: "0"
        baseline:
          repeat_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: deposit_basis_surcharge
        effect: parameter
        decides: deposit_surcharge
        bindings: [deposit_basis, deposit_surcharge]
        ladder:
          - when: "the account's security deposit was assessed on the basis reconnect_after_nonpay"
            value: "K('reestablishment_reconnect_surcharge')"
          - when: "it was assessed on the basis waiver_reinstatement"
            value: "K('reinstatement_reconnect_surcharge')"
          - when: "otherwise"
            value: "0"
        baseline:
          deposit_surcharge: "0"
        evidence: [cross_category]
        cross_difficulty: deposit
      - id: site_inspection_charge
        effect: parameter
        decides: inspection_charge
        bindings: [days_disconnected, inspection_charge]
        ladder:
          - when: "disconnected fourteen or more calendar days"
            value: "K('extended_outage_inspection_charge')"
          - when: "disconnected three to thirteen calendar days"
            value: "K('multi_day_inspection_charge')"
          - when: "otherwise"
            value: "0"
        baseline:
          inspection_charge: "0"
        evidence: [date]
        cross_difficulty: null
      - id: area_light_restoration_charge
        effect: parameter
        decides: light_charge
        bindings: [light_status, light_poles, light_charge]
        ladder:
          - when: "the area light rented on the account is out_of_service"
            value: "K('light_restore_charge')"
          - when: "the rented area light is active and stands on one or more additional poles"
            value: "K('light_pole_check_charge')"
          - when: "otherwise"
            value: "0"
        baseline:
          light_charge: "0"
        evidence: [cross_category]
        cross_difficulty: light
    baseline:
      rule: >-
        A service account disconnected for nonpayment is reconnected at the member's request, and the
        reconnection bills one reconnect fee on the account, billed on the next bill and never collected as a
        condition of reconnection. In its standard form the reconnect fee is the crew charge, rounded to the cent.
        The crew charge is reconnect_fee_truck_business_hours, the charge of a crew truck sent during business
        hours.
      params: [reconnect_fee_truck_business_hours]
    inputs:
      history:
        - {table: service_charges, aggregate: count, field: charge_id, filters: {event_type: service_fee, charge_component: reconnect_fee}}
        - {table: service_payments, aggregate: count, field: payment_id, within_months: 12, filters: {event_type: service_payment_return}}
        - {table: service_trouble_reports, aggregate: count, field: trouble_report_id, within_months: 1, filters: {event_type: service_outage_report, trouble_type: meter_damage}}
      cross_category: [arrange, deposit, light]
  - id: service_ext_seasonal_minimum_settlement
    base_policy_refs: [service_evt_usage_billing, service_evt_minimum_bill]
    overwrite:
      - base_policy: service_evt_minimum_bill
        superseded_clause: >-
          Where annual_minimum_per_kva is above zero, the December bill compares
          service_msr_calendar_year_base_charges for that calendar year with annual_minimum_per_kva multiplied by
          transformer_kva and adds an annual_minimum_adjustment line for any shortfall; an account energized during
          the year has the annual minimum prorated by the number of whole calendar months it was energized divided
          by twelve, rounded to the cent.
        replaced_by: >-
          An irrigation service account on a schedule whose annual_minimum_per_kva is above zero settles its
          seasonal minimum once its season has closed and the account stands idle: the guaranteed minimum is
          compared with the lines the account was billed, and an annual_minimum_adjustment line is billed for any
          shortfall.
    trigger: state_due
    subject: [service_usage_charge]
    computes: adjustment_amount
    target_tool: bill_seasonal_minimum_25412e46
    params:
      long_patron_per_kva: 20.50
      extension_guarantee_per_kva: 25.00
    rule: >-
      An irrigation service account on a schedule whose annual_minimum_per_kva is above zero settles its
      seasonal minimum once its season has closed and the account stands idle: the guaranteed minimum is
      compared with the lines the account was billed, and an annual_minimum_adjustment line is billed for any
      shortfall. The settlement looks at the lines dated less than twelve whole months before the current date.
      The guaranteed minimum is annual_minimum_per_kva multiplied by the account's transformer_kva, rounded to the
      cent. The lines credited against it are the facility, energy and demand charge lines of those twelve
      months. The minimum adjustment is the guaranteed minimum less the credited lines, rounded to the cent and
      never less than zero; a settlement whose adjustment comes to zero bills no line.
      Whenever a minimum rate, a capacity measure or a proration below applies, the guaranteed minimum is that
      minimum rate per kVA multiplied by that capacity measure and by that proration, the three applied together
      and the product rounded once to the cent.
      Minimum rate per kVA: an account connected one hundred twenty whole months or more before the current date
      with no late payment charge dated in the twelve whole months before the current date is guaranteed at
      long_patron_per_kva; an account connected less than thirty-six whole months before the current date whose
      member's Irrigation Well Extension line project is energized or closed is guaranteed at
      extension_guarantee_per_kva, the extension having been built on a revenue-multiple allowance the minimum
      stands behind; any other account is guaranteed at the schedule's annual_minimum_per_kva.
      Capacity measure: when the highest metered demand recorded on the account's demand charge lines exceeds its
      transformer_kva, the capacity measure is that metered demand; when that highest metered demand is below
      half the transformer_kva, the capacity measure is twice that metered demand; otherwise it is the
      transformer_kva.
      Lines credited against the minimum: when demand charge lines stand in three or fewer billing periods of
      the twelve months, a short pumping season whose demand charges recover their own demand-related cost, only
      the facility and energy charge lines are credited; when demand charge lines stand in four to six billing
      periods, the facility and energy charge lines and half of the demand charge lines, rounded to the cent, are
      credited; otherwise the facility, energy and demand charge lines are credited.
      Proration: an account connected less than twelve whole months before the current date is guaranteed the
      whole months elapsed since its connect date divided by twelve; an account whose current rate schedule took
      effect less than twelve whole months before the current date, later than its connect date, is guaranteed the
      whole months elapsed since that rate effective date divided by twelve; any other account is guaranteed the
      full twelve months.
    prerequisite: []
    cross_category:
      - category: line
        as: branch
        reads: [status]
        note: The minimum-rate factor reads whether the member's Irrigation Well Extension line project is energized or closed.
    compute:
      - connected_months: "MONTHS(F('connect_date'), NOW)"
      - late_charges_12m: "COUNT('service_charges', within_months=12, date_field='charge_date', event_type='service_late_charge')"
      - extension_status: "CFIELD('line', 'status', variant_name='Irrigation Well Extension')"
      - minimum_rate: "K('long_patron_per_kva') if (connected_months >= 120 and late_charges_12m == 0) else (K('extension_guarantee_per_kva') if (connected_months < 36 and (extension_status == 'energized' or extension_status == 'closed')) else P('annual_minimum_per_kva'))"
      - peak_kw: "MAX('service_charges', 'metered_kw', event_type='service_usage_charge', charge_component='demand_charge')"
      - capacity_measure: "peak_kw if peak_kw > F('transformer_kva') else (2 * peak_kw if (peak_kw < F('transformer_kva') / 2) else F('transformer_kva'))"
      - rate_months: "MONTHS(F('rate_effective_date'), NOW)"
      - proration: "connected_months / 12 if connected_months < 12 else (rate_months / 12 if (rate_months < 12 and F('rate_effective_date') > F('connect_date')) else 1)"
      - year_facility: "SUM('service_charges', 'amount', within_months=12, date_field='charge_date', event_type='service_usage_charge', charge_component='facility_charge')"
      - year_energy: "SUM('service_charges', 'amount', within_months=12, date_field='charge_date', event_type='service_usage_charge', charge_component='energy_charge')"
      - year_demand: "SUM('service_charges', 'amount', within_months=12, date_field='charge_date', event_type='service_usage_charge', charge_component='demand_charge')"
      - demand_periods: "COUNT('service_charges', within_months=12, date_field='charge_date', event_type='service_usage_charge', charge_component='demand_charge')"
      - credited_lines: "(year_facility + year_energy) if (demand_periods >= 1 and demand_periods <= 3) else ((year_facility + year_energy + RND(year_demand / 2, 2)) if (demand_periods >= 4 and demand_periods <= 6) else (year_facility + year_energy + year_demand))"
      - guaranteed_minimum: "RND(minimum_rate * capacity_measure * proration, 2)"
      - result: "MX(0, RND(guaranteed_minimum - credited_lines, 2))"
    compute_basis:
      connected_months: "an account connected one hundred twenty whole months or more before the current date"
      late_charges_12m: "with no late payment charge dated in the twelve whole months before the current date"
      extension_status: "whose member's Irrigation Well Extension line project is energized or closed"
      minimum_rate: "Minimum rate per kVA: an account connected one hundred twenty whole months or more before the current date with no late payment charge dated in the twelve whole months before the current date is guaranteed at long_patron_per_kva; an account connected less than thirty-six whole months before the current date whose member's Irrigation Well Extension line project is energized or closed is guaranteed at extension_guarantee_per_kva, the extension having been built on a revenue-multiple allowance the minimum stands behind; any other account is guaranteed at the schedule's annual_minimum_per_kva."
      peak_kw: "the highest metered demand recorded on the account's demand charge lines"
      capacity_measure: "Capacity measure: when the highest metered demand recorded on the account's demand charge lines exceeds its transformer_kva, the capacity measure is that metered demand; when that highest metered demand is below half the transformer_kva, the capacity measure is twice that metered demand; otherwise it is the transformer_kva."
      rate_months: "an account whose current rate schedule took effect less than twelve whole months before the current date, later than its connect date"
      proration: "Proration: an account connected less than twelve whole months before the current date is guaranteed the whole months elapsed since its connect date divided by twelve; an account whose current rate schedule took effect less than twelve whole months before the current date, later than its connect date, is guaranteed the whole months elapsed since that rate effective date divided by twelve; any other account is guaranteed the full twelve months."
      year_facility: "The settlement looks at the lines dated less than twelve whole months before the current date."
      year_energy: "The lines credited against it are the facility, energy and demand charge lines of those twelve months."
      year_demand: "The lines credited against it are the facility, energy and demand charge lines of those twelve months."
      demand_periods: "when demand charge lines stand in three or fewer billing periods of the twelve months"
      credited_lines: "Lines credited against the minimum: when demand charge lines stand in three or fewer billing periods of the twelve months, a short pumping season whose demand charges recover their own demand-related cost, only the facility and energy charge lines are credited; when demand charge lines stand in four to six billing periods, the facility and energy charge lines and half of the demand charge lines, rounded to the cent, are credited; otherwise the facility, energy and demand charge lines are credited."
      guaranteed_minimum: "Whenever a minimum rate, a capacity measure or a proration below applies, the guaranteed minimum is that minimum rate per kVA multiplied by that capacity measure and by that proration, the three applied together and the product rounded once to the cent."
      result: "The minimum adjustment is the guaranteed minimum less the credited lines, rounded to the cent and never less than zero; a settlement whose adjustment comes to zero bills no line."
    factors:
      - id: seasonal_minimum_rate_per_kva
        effect: parameter
        decides: minimum_rate
        bindings: [late_charges_12m, extension_status, minimum_rate]
        ladder:
          - when: "connected 120 whole months or more before today and no late payment charge in the twelve months before today"
            value: "K('long_patron_per_kva')"
          - when: "connected less than 36 whole months before today and the member's Irrigation Well Extension project energized or closed"
            value: "K('extension_guarantee_per_kva')"
          - when: "otherwise"
            value: "P('annual_minimum_per_kva')"
        baseline:
          minimum_rate: "P('annual_minimum_per_kva')"
        evidence: [cross_category, date, tier_param]
        cross_difficulty: line
      - id: seasonal_minimum_capacity_measure
        effect: method
        decides: capacity_measure
        bindings: [peak_kw, capacity_measure]
        ladder:
          - when: "the highest metered demand on the account's demand lines exceeds its transformer_kva"
            method: "the minimum is measured on that metered demand"
          - when: "the highest metered demand is below half the transformer_kva"
            method: "the minimum is measured on twice that metered demand"
          - when: "otherwise"
            method: "the minimum is measured on the transformer_kva"
        baseline:
          capacity_measure: "F('transformer_kva')"
        evidence: [history]
        cross_difficulty: null
      - id: seasonal_minimum_credited_lines
        effect: parameter
        decides: credited_lines
        bindings: [demand_periods, credited_lines]
        ladder:
          - when: "demand charge lines in one to three billing periods of the twelve months"
            value: "facility + energy charge lines"
          - when: "demand charge lines in four to six billing periods"
            value: "facility + energy + half the demand charge lines, rounded to the cent"
          - when: "otherwise"
            value: "facility + energy + demand charge lines"
        baseline:
          credited_lines: "year_facility + year_energy + year_demand"
        evidence: [history]
        cross_difficulty: null
      - id: seasonal_minimum_proration
        effect: parameter
        decides: proration
        bindings: [rate_months, proration]
        ladder:
          - when: "connected less than twelve whole months before today"
            value: "whole months since the connect date / 12"
          - when: "current rate schedule effective less than twelve whole months before today, later than the connect date"
            value: "whole months since the rate effective date / 12"
          - when: "otherwise"
            value: "1"
        baseline:
          proration: "1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        An irrigation service account on a schedule whose annual_minimum_per_kva is above zero settles its
        seasonal minimum once its season has closed and the account stands idle: the guaranteed minimum is
        compared with the lines the account was billed, and an annual_minimum_adjustment line is billed for any
        shortfall. The settlement looks at the lines dated less than twelve whole months before the current date.
        The guaranteed minimum is annual_minimum_per_kva multiplied by the account's transformer_kva, rounded to the
        cent. The lines credited against it are the facility, energy and demand charge lines of those twelve
        months. The minimum adjustment is the guaranteed minimum less the credited lines, rounded to the cent and
        never less than zero; a settlement whose adjustment comes to zero bills no line.
      params: [annual_minimum_per_kva]
    inputs:
      history:
        - {table: service_charges, aggregate: sum, field: amount, within_months: 12, filters: {event_type: service_usage_charge}}
        - {table: service_charges, aggregate: max, field: metered_kw, filters: {event_type: service_usage_charge, charge_component: demand_charge}}
      cross_category: [line]
  - id: service_ext_restore_payment
    base_policy_refs: [service_evt_payments, service_evt_seasonal_idle]
    overwrite: []
    trigger: on_request
    subject: [service_payment]
    computes: payment_amount
    target_tool: pay_restore_balance_91f3e2ab
    params:
      spread_threshold: 300.00
      new_service_spread_share: 0.6667
      established_spread_share: 0.50
      clearing_days: 5
      returned_payment_prepaid_months: 2
    rule: >-
      A member who asks to have an idle seasonal or irrigation account restored is told the restore payment, the
      amount the member pays on the spot so that the account carries no unpaid balance into the new season. In
      its standard form the restore payment is the current account balance, rounded to the cent and never less
      than zero. Whenever a hold-back or an addition below applies, the restore payment is the current account
      balance less every part held back below, plus every amount added below, rounded to the cent and never less
      than zero.
      The restore payment is fixed only after the account carries the annual minimum adjustment line its closed
      season owes, dated after the account went idle.
      Minimum adjustment held back: when the latest annual minimum adjustment line on the account is
      spread_threshold or more and the account was connected less than thirty-six whole months before the
      current date, new_service_spread_share of that adjustment, rounded to the cent, is held back to later bills;
      when that line is spread_threshold or more and the account was connected thirty-six whole months or more
      before the current date, established_spread_share of it, rounded to the cent, is held back; otherwise
      none of it is held back.
      Facility charge prepaid with the restore: an account connected less than twelve whole months before the
      current date that carries no seasonal restore fee yet, on the first restore of a new service, prepays one
      facility_charge_monthly with the restore payment; an account outside that case with a returned payment
      dated less than twelve whole months before the current date prepays returned_payment_prepaid_months
      facility charges; otherwise nothing is prepaid.
      Uncleared payments: when a returned payment is dated less than twelve whole months before the current date,
      every online_echeck and office_check payment dated less than one whole month before the current date is
      added back to the restore payment; when no returned payment is dated in those twelve months and the latest
      online_echeck or the latest office_check payment is dated no more than clearing_days calendar days before
      the current date, that latest payment of each such channel is added back; otherwise nothing is added back.
      Idle-season late charges: when late payment charges are dated less than the whole months elapsed since the
      idle date before the current date and the account was connected less than thirty-six whole months before
      the current date, those late payment charges are held back from the restore payment in full; when such late
      payment charges exist and the account was connected thirty-six whole months or more before, half of them,
      rounded to the cent, is held back; otherwise none is held back.
      Area light lines while the light is out: when the area light rented on the account is out_of_service, the
      area light rental lines dated less than one more than the whole months elapsed since its out-of-service
      date are held back from the restore payment; when the rented area light is removal_pending, the rental
      lines dated less than one more than the whole months elapsed since its removal request are held back;
      otherwise no area light line is held back.
    prerequisite:
      - problem: service_ext_seasonal_minimum_settlement
        kind: value_input
        gate: minimum_line
        form: state
        policy_source: >-
          The restore payment is fixed only after the account carries the annual minimum adjustment line its
          closed season owes, dated after the account went idle.
        condition: >-
          A service_usage_charge row with charge_component annual_minimum_adjustment, dated after the account's
          idle_date, stands on the idle service account.
        resolved_by: bill_seasonal_minimum_25412e46
        effect: >-
          The annual minimum adjustment line raises the account balance the restore payment starts from and is
          the latest adjustment line whose share the minimum hold-back keeps for later bills.
    cross_category:
      - category: light
        as: branch
        reads: [status, out_of_service_date, removal_requested_date]
        note: The area-light factor reads the status and dates of the area light rented on the account.
    compute:
      - balance_now: "F('account_balance')"
      - minimum_line: "LATEST('service_charges', 'amount', date_field='charge_date', event_type='service_usage_charge', charge_component='annual_minimum_adjustment')"
      - connected_months: "MONTHS(F('connect_date'), NOW)"
      - minimum_held_back: "RND(minimum_line * K('new_service_spread_share'), 2) if (minimum_line and minimum_line >= K('spread_threshold') and connected_months < 36) else (RND(minimum_line * K('established_spread_share'), 2) if (minimum_line and minimum_line >= K('spread_threshold') and connected_months >= 36) else 0)"
      - returns_12m: "COUNT('service_payments', within_months=12, date_field='payment_date', event_type='service_payment_return')"
      - restore_fees_on_file: "COUNT('service_charges', event_type='service_fee', charge_component='seasonal_restore_fee')"
      - facility_prepaid: "P('facility_charge_monthly') if (connected_months < 12 and restore_fees_on_file == 0) else (RND(K('returned_payment_prepaid_months') * P('facility_charge_monthly'), 2) if (not (connected_months < 12 and restore_fees_on_file == 0) and returns_12m >= 1) else 0)"
      - month_check_payments: "SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment', payment_channel='online_echeck') + SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment', payment_channel='office_check')"
      - echeck_date: "LATEST('service_payments', 'payment_date', date_field='payment_date', event_type='service_payment', payment_channel='online_echeck')"
      - echeck_amount: "LATEST('service_payments', 'amount', date_field='payment_date', event_type='service_payment', payment_channel='online_echeck')"
      - office_check_date: "LATEST('service_payments', 'payment_date', date_field='payment_date', event_type='service_payment', payment_channel='office_check')"
      - office_check_amount: "LATEST('service_payments', 'amount', date_field='payment_date', event_type='service_payment', payment_channel='office_check')"
      - recent_checks: "(echeck_amount if (echeck_date and DAYS(echeck_date, NOW) <= K('clearing_days')) else 0) + (office_check_amount if (office_check_date and DAYS(office_check_date, NOW) <= K('clearing_days')) else 0)"
      - uncleared_added_back: "month_check_payments if returns_12m >= 1 else (recent_checks if (returns_12m == 0 and recent_checks > 0) else 0)"
      - idle_months: "MONTHS(F('idle_date'), NOW) if F('idle_date') else 0"
      - idle_late_charges: "SUM('service_charges', 'amount', within_months=idle_months, date_field='charge_date', event_type='service_late_charge')"
      - idle_late_held_back: "idle_late_charges if (idle_late_charges > 0 and connected_months < 36) else (RND(idle_late_charges / 2, 2) if (idle_late_charges > 0 and connected_months >= 36) else 0)"
      - light_status: "CFIELD('light', 'status', service_account_id=HID)"
      - light_out_date: "CFIELD('light', 'out_of_service_date', service_account_id=HID)"
      - light_removal_date: "CFIELD('light', 'removal_requested_date', service_account_id=HID)"
      - light_lines_held_back: "SUM('service_charges', 'amount', within_months=MONTHS(light_out_date, NOW) + 1, date_field='charge_date', event_type='service_program_charge', charge_component='area_light_rental') if (light_status == 'out_of_service' and light_out_date) else (SUM('service_charges', 'amount', within_months=MONTHS(light_removal_date, NOW) + 1, date_field='charge_date', event_type='service_program_charge', charge_component='area_light_rental') if (light_status == 'removal_pending' and light_removal_date) else 0)"
      - result: "RND(MX(0, balance_now - minimum_held_back - idle_late_held_back - light_lines_held_back + uncleared_added_back + facility_prepaid), 2)"
    compute_basis:
      balance_now: "In its standard form the restore payment is the current account balance, rounded to the cent and never less than zero."
      minimum_line: "when the latest annual minimum adjustment line on the account is spread_threshold or more"
      connected_months: "the account was connected less than thirty-six whole months before the current date"
      minimum_held_back: "Minimum adjustment held back: when the latest annual minimum adjustment line on the account is spread_threshold or more and the account was connected less than thirty-six whole months before the current date, new_service_spread_share of that adjustment, rounded to the cent, is held back to later bills; when that line is spread_threshold or more and the account was connected thirty-six whole months or more before the current date, established_spread_share of it, rounded to the cent, is held back; otherwise none of it is held back."
      restore_fees_on_file: "that carries no seasonal restore fee yet, on the first restore of a new service"
      facility_prepaid: "Facility charge prepaid with the restore: an account connected less than twelve whole months before the current date that carries no seasonal restore fee yet, on the first restore of a new service, prepays one facility_charge_monthly with the restore payment; an account outside that case with a returned payment dated less than twelve whole months before the current date prepays returned_payment_prepaid_months facility charges; otherwise nothing is prepaid."
      returns_12m: "when a returned payment is dated less than twelve whole months before the current date"
      month_check_payments: "every online_echeck and office_check payment dated less than one whole month before the current date is added back to the restore payment"
      echeck_date: "the latest online_echeck or the latest office_check payment is dated no more than clearing_days calendar days before the current date"
      echeck_amount: "that latest payment of each such channel is added back"
      office_check_date: "the latest online_echeck or the latest office_check payment is dated no more than clearing_days calendar days before the current date"
      office_check_amount: "that latest payment of each such channel is added back"
      recent_checks: "the latest online_echeck or the latest office_check payment is dated no more than clearing_days calendar days before the current date, that latest payment of each such channel is added back"
      uncleared_added_back: "Uncleared payments: when a returned payment is dated less than twelve whole months before the current date, every online_echeck and office_check payment dated less than one whole month before the current date is added back to the restore payment; when no returned payment is dated in those twelve months and the latest online_echeck or the latest office_check payment is dated no more than clearing_days calendar days before the current date, that latest payment of each such channel is added back; otherwise nothing is added back."
      idle_months: "late payment charges are dated less than the whole months elapsed since the idle date before the current date"
      idle_late_charges: "late payment charges are dated less than the whole months elapsed since the idle date before the current date"
      idle_late_held_back: "Idle-season late charges: when late payment charges are dated less than the whole months elapsed since the idle date before the current date and the account was connected less than thirty-six whole months before the current date, those late payment charges are held back from the restore payment in full; when such late payment charges exist and the account was connected thirty-six whole months or more before, half of them, rounded to the cent, is held back; otherwise none is held back."
      light_status: "when the area light rented on the account is out_of_service"
      light_out_date: "the whole months elapsed since its out-of-service date"
      light_removal_date: "the whole months elapsed since its removal request"
      light_lines_held_back: "Area light lines while the light is out: when the area light rented on the account is out_of_service, the area light rental lines dated less than one more than the whole months elapsed since its out-of-service date are held back from the restore payment; when the rented area light is removal_pending, the rental lines dated less than one more than the whole months elapsed since its removal request are held back; otherwise no area light line is held back."
      result: "Whenever a hold-back or an addition below applies, the restore payment is the current account balance less every part held back below, plus every amount added below, rounded to the cent and never less than zero."
    factors:
      - id: minimum_adjustment_hold_back
        effect: parameter
        decides: minimum_held_back
        bindings: [minimum_line, minimum_held_back]
        ladder:
          - when: "the latest annual minimum adjustment line is spread_threshold or more and the account was connected less than 36 whole months before today"
            value: "new_service_spread_share of the adjustment, rounded to the cent"
          - when: "that line is spread_threshold or more and the account was connected 36 whole months or more before today"
            value: "established_spread_share of the adjustment, rounded to the cent"
          - when: "otherwise"
            value: "0"
        baseline:
          minimum_held_back: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: facility_charge_prepaid_with_restore
        effect: parameter
        decides: facility_prepaid
        bindings: [restore_fees_on_file, facility_prepaid]
        ladder:
          - when: "connected less than twelve whole months before today and no seasonal restore fee on file"
            value: "P('facility_charge_monthly')"
          - when: "outside that case, with a returned payment in the twelve months before today"
            value: "returned_payment_prepaid_months x P('facility_charge_monthly')"
          - when: "otherwise"
            value: "0"
        baseline:
          facility_prepaid: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: uncleared_payments_added_back
        effect: method
        decides: uncleared_added_back
        bindings: [returns_12m, month_check_payments, echeck_date, echeck_amount, office_check_date, office_check_amount, recent_checks, uncleared_added_back]
        ladder:
          - when: "a returned payment dated in the twelve months before today"
            method: "every online_echeck and office_check payment of the month before today is added back"
          - when: "no returned payment in those months and the latest online_echeck or office_check payment dated within clearing_days before today"
            method: "that latest payment of each such channel is added back"
          - when: "otherwise"
            method: "the balance is taken with every payment as posted"
        baseline:
          uncleared_added_back: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: idle_season_late_charge_hold_back
        effect: parameter
        decides: idle_late_held_back
        bindings: [idle_months, idle_late_charges, idle_late_held_back]
        ladder:
          - when: "late payment charges dated since the idle date and the account connected less than 36 whole months before today"
            value: "those late payment charges in full"
          - when: "such late payment charges and the account connected 36 whole months or more before today"
            value: "half of them, rounded to the cent"
          - when: "otherwise"
            value: "0"
        baseline:
          idle_late_held_back: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: area_light_lines_while_out
        effect: parameter
        decides: light_lines_held_back
        bindings: [light_status, light_out_date, light_removal_date, light_lines_held_back]
        ladder:
          - when: "the area light rented on the account is out_of_service"
            value: "the rental lines dated since its out-of-service month"
          - when: "the rented area light is removal_pending"
            value: "the rental lines dated since its removal-request month"
          - when: "otherwise"
            value: "0"
        baseline:
          light_lines_held_back: "0"
        evidence: [cross_category, history]
        cross_difficulty: light
    baseline:
      rule: >-
        A member who asks to have an idle seasonal or irrigation account restored is told the restore payment, the
        amount the member pays on the spot so that the account carries no unpaid balance into the new season. In
        its standard form the restore payment is the current account balance, rounded to the cent and never less
        than zero.
      params: []
    inputs:
      history:
        - {table: service_charges, aggregate: latest, field: amount, filters: {event_type: service_usage_charge, charge_component: annual_minimum_adjustment}}
        - {table: service_charges, aggregate: sum, field: amount, within_months: 4, filters: {event_type: service_late_charge}}
        - {table: service_payments, aggregate: latest, field: amount, filters: {event_type: service_payment, payment_channel: online_echeck}}
      cross_category: [light]
  - id: service_ext_seasonal_restore_fee
    base_policy_refs: [service_evt_seasonal_idle]
    overwrite:
      - base_policy: service_evt_seasonal_idle
        superseded_clause: >-
          A restore is billed seasonal_restore_fee.
        replaced_by: >-
          Whenever a restore charge, a restore addition or a restore credit below applies, the restore fee is the
          restore charge plus every restore addition less every restore credit, rounded to the cent and never less
          than zero.
    trigger: on_request
    subject: [service_seasonal_restore]
    computes: restore_fee_amount
    target_tool: restore_seasonal_service_78495a78
    params:
      season_idle_inspection: 20.00
      long_idle_inspection: 40.00
      light_relamp_charge: 15.00
      light_pole_visit_charge: 7.50
      collection_review_repeat: 30.00
      collection_review_charge: 10.00
      return_review_months: 12
      first_season_warranty_credit: 30.00
      second_season_warranty_credit: 15.00
    rule: >-
      An idle seasonal or irrigation account is re-energized on the member's confirmed seasonal restore order,
      the order being marked completed, and the restore bills one restore fee on the account, billed on the next
      bill. No idle account is re-energized, and no restore fee is billed, until the account shows a payment
      posted on the restore day that covers the restore payment it requires. In its standard form the restore fee
      is the schedule's seasonal_restore_fee. Whenever a restore charge, a restore addition or a restore credit
      below applies, the restore fee is the restore charge plus every restore addition less every restore credit,
      rounded to the cent and never less than zero.
      Restore charge: when the meter is ami_demand_ct and demand charge lines are dated less than twelve whole
      months before the current date, the restore charge is reconnect_fee_truck_business_hours, a crew having to
      re-energize the current-transformer cabinet; when the meter is ami_remote_disconnect, the restore charge is
      reconnect_fee_remote; otherwise it is the schedule's seasonal_restore_fee.
      Idle-period inspection: when the account has stood idle six or more whole months, counted from the idle date
      to the current date, the restore adds long_idle_inspection; when it has stood idle seasonal_idle_min_months
      or more and fewer than six whole months, it adds season_idle_inspection; otherwise it adds nothing.
      Area light visit: when the area light rented on the account is out_of_service, the restore crew relamps it
      and the restore adds light_relamp_charge; when the rented area light is active and stands on one or more
      additional poles, it adds light_pole_visit_charge; otherwise it adds nothing.
      Collection review period: the late payment charges reviewed at a restore are those dated within a review
      period; for an account connected less than twelve whole months before the current date the period is the
      whole months elapsed since its connect date, counting the month in progress; for an account connected twelve
      whole months or more with a returned payment dated less than twelve whole months before the current date it
      is the return_review_months whole months before the current date; otherwise it is the late payment charges
      dated less than the whole months elapsed since the idle date before the current date.
      Collection review: when two or more late payment charges are dated in the review period, the restore adds
      collection_review_repeat; when exactly one is, it adds collection_review_charge; otherwise it adds nothing.
      Line extension warranty credit: when the member's Irrigation Well Extension line project was energized less
      than twelve whole months before the current date, its first-season crew visit is covered and the restore
      takes first_season_warranty_credit off; when it was energized twelve to twenty-three whole months before, the
      restore takes second_season_warranty_credit off; otherwise no credit is taken.
    prerequisite:
      - problem: service_ext_restore_payment
        kind: state_gate
        gate: service_payments.amount
        form: state
        policy_source: >-
          No idle account is re-energized, and no restore fee is billed, until the account shows a payment posted
          on the restore day that covers the restore payment it requires.
        condition: >-
          A service_payment row dated the current date, for at least the restore payment, stands on the idle
          service account.
        resolved_by: pay_restore_balance_91f3e2ab
        effect: >-
          The member's own payment of the restore payment posts on the account, so the restore and its fee may be
          booked.
    cross_category:
      - category: light
        as: branch
        reads: [status, pole_count]
        note: The area light visit reads the status and pole count of the area light rented on the account.
      - category: line
        as: branch
        reads: [variant_name, energized_date]
        note: The warranty credit reads when the member's Irrigation Well Extension line project was energized.
    compute:
      - meter_kind: "F('meter_type')"
      - demand_lines_12m: "COUNT('service_charges', within_months=12, date_field='charge_date', event_type='service_usage_charge', charge_component='demand_charge')"
      - restore_charge: "P('reconnect_fee_truck_business_hours') if (meter_kind == 'ami_demand_ct' and demand_lines_12m > 0) else (P('reconnect_fee_remote') if meter_kind == 'ami_remote_disconnect' else P('seasonal_restore_fee'))"
      - idle_months: "MONTHS(F('idle_date'), NOW) if F('idle_date') else 0"
      - inspection_addition: "K('long_idle_inspection') if idle_months >= 6 else (K('season_idle_inspection') if (idle_months >= P('seasonal_idle_min_months') and idle_months < 6) else 0)"
      - light_status: "CFIELD('light', 'status', service_account_id=HID)"
      - light_poles: "CFIELD('light', 'pole_count', service_account_id=HID)"
      - light_addition: "K('light_relamp_charge') if light_status == 'out_of_service' else (K('light_pole_visit_charge') if (light_status == 'active' and light_poles and light_poles >= 1) else 0)"
      - connected_months: "MONTHS(F('connect_date'), NOW)"
      - returns_12m: "COUNT('service_payments', within_months=12, date_field='payment_date', event_type='service_payment_return')"
      - review_months: "(connected_months + 1) if connected_months < 12 else (K('return_review_months') if (connected_months >= 12 and returns_12m >= 1) else idle_months)"
      - reviewed_late_charges: "COUNT('service_charges', within_months=review_months, date_field='charge_date', event_type='service_late_charge')"
      - review_addition: "K('collection_review_repeat') if reviewed_late_charges >= 2 else (K('collection_review_charge') if reviewed_late_charges == 1 else 0)"
      - extension_energized: "CFIELD('line', 'energized_date', variant_name='Irrigation Well Extension')"
      - warranty_credit: "K('first_season_warranty_credit') if (extension_energized and MONTHS(extension_energized, NOW) < 12) else (K('second_season_warranty_credit') if (extension_energized and MONTHS(extension_energized, NOW) >= 12 and MONTHS(extension_energized, NOW) < 24) else 0)"
      - result: "RND(MX(0, restore_charge + inspection_addition + light_addition + review_addition - warranty_credit), 2)"
    compute_basis:
      meter_kind: "when the meter is ami_demand_ct"
      demand_lines_12m: "demand charge lines are dated less than twelve whole months before the current date"
      restore_charge: "Restore charge: when the meter is ami_demand_ct and demand charge lines are dated less than twelve whole months before the current date, the restore charge is reconnect_fee_truck_business_hours, a crew having to re-energize the current-transformer cabinet; when the meter is ami_remote_disconnect, the restore charge is reconnect_fee_remote; otherwise it is the schedule's seasonal_restore_fee."
      idle_months: "counted from the idle date to the current date"
      inspection_addition: "Idle-period inspection: when the account has stood idle six or more whole months, counted from the idle date to the current date, the restore adds long_idle_inspection; when it has stood idle seasonal_idle_min_months or more and fewer than six whole months, it adds season_idle_inspection; otherwise it adds nothing."
      light_status: "when the area light rented on the account is out_of_service"
      light_poles: "stands on one or more additional poles"
      light_addition: "Area light visit: when the area light rented on the account is out_of_service, the restore crew relamps it and the restore adds light_relamp_charge; when the rented area light is active and stands on one or more additional poles, it adds light_pole_visit_charge; otherwise it adds nothing."
      connected_months: "for an account connected less than twelve whole months before the current date"
      returns_12m: "with a returned payment dated less than twelve whole months before the current date"
      review_months: "Collection review period: the late payment charges reviewed at a restore are those dated within a review period; for an account connected less than twelve whole months before the current date the period is the whole months elapsed since its connect date, counting the month in progress; for an account connected twelve whole months or more with a returned payment dated less than twelve whole months before the current date it is the return_review_months whole months before the current date; otherwise it is the late payment charges dated less than the whole months elapsed since the idle date before the current date."
      reviewed_late_charges: "the late payment charges reviewed at a restore are those dated within a review period"
      review_addition: "Collection review: when two or more late payment charges are dated in the review period, the restore adds collection_review_repeat; when exactly one is, it adds collection_review_charge; otherwise it adds nothing."
      extension_energized: "when the member's Irrigation Well Extension line project was energized less than twelve whole months before the current date"
      warranty_credit: "Line extension warranty credit: when the member's Irrigation Well Extension line project was energized less than twelve whole months before the current date, its first-season crew visit is covered and the restore takes first_season_warranty_credit off; when it was energized twelve to twenty-three whole months before, the restore takes second_season_warranty_credit off; otherwise no credit is taken."
      result: "Whenever a restore charge, a restore addition or a restore credit below applies, the restore fee is the restore charge plus every restore addition less every restore credit, rounded to the cent and never less than zero."
    factors:
      - id: restore_charge_by_meter
        effect: parameter
        decides: restore_charge
        bindings: [meter_kind, demand_lines_12m, restore_charge]
        ladder:
          - when: "an ami_demand_ct meter with demand charge lines in the twelve months before today"
            value: "P('reconnect_fee_truck_business_hours')"
          - when: "an ami_remote_disconnect meter"
            value: "P('reconnect_fee_remote')"
          - when: "otherwise"
            value: "P('seasonal_restore_fee')"
        baseline:
          restore_charge: "P('seasonal_restore_fee')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: idle_period_inspection
        effect: parameter
        decides: inspection_addition
        bindings: [idle_months, inspection_addition]
        ladder:
          - when: "idle six or more whole months"
            value: "K('long_idle_inspection')"
          - when: "idle seasonal_idle_min_months or more and fewer than six whole months"
            value: "K('season_idle_inspection')"
          - when: "otherwise"
            value: "0"
        baseline:
          inspection_addition: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: area_light_visit_on_restore
        effect: parameter
        decides: light_addition
        bindings: [light_status, light_poles, light_addition]
        ladder:
          - when: "the area light rented on the account is out_of_service"
            value: "K('light_relamp_charge')"
          - when: "the rented area light is active and stands on one or more additional poles"
            value: "K('light_pole_visit_charge')"
          - when: "otherwise"
            value: "0"
        baseline:
          light_addition: "0"
        evidence: [cross_category]
        cross_difficulty: light
      - id: collection_review_period
        effect: method
        decides: review_months
        bindings: [connected_months, returns_12m, review_months]
        ladder:
          - when: "connected less than twelve whole months before today"
            method: "late charges are reviewed over the whole months since the connect date, the month in progress counted"
          - when: "connected twelve whole months or more and a returned payment in the twelve months before today"
            method: "late charges are reviewed over the return_review_months whole months before today"
          - when: "otherwise"
            method: "late charges are reviewed over the whole months since the idle date"
        baseline:
          review_months: "idle_months"
        evidence: [date, history]
        cross_difficulty: null
      - id: collection_review_on_restore
        effect: parameter
        decides: review_addition
        bindings: [reviewed_late_charges, review_addition]
        ladder:
          - when: "two or more late payment charges dated in the review period"
            value: "K('collection_review_repeat')"
          - when: "exactly one late payment charge dated in the review period"
            value: "K('collection_review_charge')"
          - when: "otherwise"
            value: "0"
        baseline:
          review_addition: "0"
        evidence: [history]
        cross_difficulty: null
      - id: line_extension_warranty_credit
        effect: parameter
        decides: warranty_credit
        bindings: [extension_energized, warranty_credit]
        ladder:
          - when: "the member's Irrigation Well Extension was energized less than twelve whole months before today"
            value: "K('first_season_warranty_credit')"
          - when: "it was energized twelve to twenty-three whole months before today"
            value: "K('second_season_warranty_credit')"
          - when: "otherwise"
            value: "0"
        baseline:
          warranty_credit: "0"
        evidence: [cross_category, date]
        cross_difficulty: line
    baseline:
      rule: >-
        An idle seasonal or irrigation account is re-energized on the member's confirmed seasonal restore order,
        the order being marked completed, and the restore bills one restore fee on the account, billed on the next
        bill. In its standard form the restore fee is the schedule's seasonal_restore_fee.
      params: [seasonal_restore_fee]
    inputs:
      history:
        - {table: service_charges, aggregate: count, field: charge_id, within_months: 12, filters: {event_type: service_usage_charge, charge_component: demand_charge}}
        - {table: service_charges, aggregate: count, field: charge_id, within_months: 12, filters: {event_type: service_late_charge}}
      cross_category: [light, line]
