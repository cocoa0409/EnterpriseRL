events:
  - type: service_connect
    target: service_accounts
    mutation: create
    meaning: A service application for one metered location is accepted and a service account is opened on a rate schedule, awaiting meter set or transfer.
    grain: One row per service account opened at one location for one member.
    fields:
      customer_id: The member who will hold the service account.
      variant_name: Official rate schedule name assigned under the entry gates.
      account_number: Account number assigned to the location, printed on the bill.
      service_address: Service location address or legal description as written on the application.
      meter_number: Serial number of the meter at the location.
      meter_type: Meter capability at the location.
      phase: Service phase at the location.
      transformer_kva: Installed transformer capacity serving the location.
      billing_cycle: Billing cycle the location is read and billed in.
      connect_type: Whether the opening is new construction, a transfer of an energized location, or a returning member.
    triggers:
      - event: service:service_fee
        when: {connect_type: transfer}
        map: {charge_component: transfer_fee}
      - event: service:service_fee
        when: {connect_type: [new_construction, returning_member]}
        map: {charge_component: connect_fee}
  - type: service_energize
    target: service_accounts
    mutation: {transition: {from: pending_connect, to: active}}
    meaning: The meter is set or the transfer is effective and the location starts billing.
    grain: One row per transaction on the service account.
    fields:
      connect_date: Date the location started billing for this member.
      rate_effective_date: Date the assigned rate schedule took effect, equal to the connect date at energization.
    triggers: []
  - type: service_rate_change
    target: service_accounts
    mutation: update
    meaning: The account is moved to another rate schedule at the member's request or after a load review.
    grain: One row per transaction on the service account.
    fields:
      variant_name: Official name of the new rate schedule.
      rate_effective_date: Date the new rate schedule takes effect (the first day of the next billing period).
    triggers: []
  - type: service_usage_charge
    target: service_charges
    meaning: One line of a monthly usage bill (facility, energy, demand, power cost adjustment, power factor, minimum, annual minimum or sales tax).
    grain: One row per bill line component per billing period per service account.
    distinguish_by: [billing_period, charge_component]
    fields:
      billing_period: Month whose meter read closes the period, YYYY-MM.
      charge_component: Which bill line this is.
      charge_date: Bill date of the period.
      kwh: kWh billed in the period (on energy and power cost adjustment lines).
      metered_kw: Highest 15-minute demand metered in the period (on demand lines).
      billed_kw: Billing demand after ratchet and power factor adjustment (on demand lines).
      amount: Amount of the line, positive.
    account: account_balance
    direction: in
    triggers: []
  - type: service_late_charge
    target: service_charges
    meaning: A late payment charge on the unpaid past-due amount of one bill.
    grain: One row per bill (billing period) per service account.
    distinguish_by: [billing_period]
    fields:
      billing_period: Billing period of the bill that went unpaid.
      charge_component: Always late_payment_charge.
      charge_date: Date the late charge was assessed.
      amount: Late charge amount, positive.
    account: account_balance
    direction: in
    triggers: []
  - type: service_fee
    target: service_charges
    meaning: A service fee - connect, transfer, same-day, reconnect, field collection, returned payment, trouble call, meter test or seasonal restore.
    grain: One row per fee occurrence.
    distinguish_by: [charge_component, charge_date, source_reference_id]
    fields:
      charge_component: Which fee this is.
      charge_date: Date the fee was incurred.
      billing_period: Billing period the fee is billed in.
      amount: Fee amount, positive.
      source_reference_id: Reference of the record that gave rise to the fee (the returned payment, trouble report or meter test); the service account itself for connect, transfer, reconnect and restore fees.
    account: account_balance
    direction: in
    triggers: []
  - type: service_program_charge
    target: service_charges
    meaning: A charge billed on the service bill on behalf of another cooperative program (arrangement installment, billed-back arrangement balance, unrecovered PrePay Power arrears, area light rental or area light charge).
    grain: One row per program record per billing period.
    distinguish_by: [charge_component, billing_period, source_reference_id]
    fields:
      charge_component: Which program charge this is.
      billing_period: Billing period it is billed in.
      charge_date: Bill date.
      amount: Amount, positive, taken from the program's own record.
      source_reference_id: Reference of the program record (the payment arrangement, prepay account or area light rental).
    account: account_balance
    direction: in
    triggers: []
  - type: service_bill_credit
    target: service_charges
    meaning: A credit to the service account (deposit refund or application to the balance, deposit interest, capital credit retirement or offset, arrears moved to a prepay or arrangement record, a remaining prepaid balance moved back, late-charge waiver, meter error refund, billing error correction, area light outage credit).
    grain: One row per credit per source record.
    distinguish_by: [credit_reason, source_reference_id, charge_date]
    fields:
      charge_component: Always bill_credit.
      credit_reason: Why the credit was given.
      charge_date: Date the credit was posted.
      billing_period: Billing period the credit appears on.
      amount: Credit amount, positive (it reduces the balance).
      source_reference_id: Reference of the record the credit comes from (deposit, capital credit ledger entry, prepay or arrangement record, late charge line, meter test or light rental).
    account: account_balance
    direction: out
    triggers: []
  - type: service_payment
    target: service_payments
    meaning: A payment posted to the service account through one payment channel, including funds received from an energy assistance agency.
    grain: One row per payment transaction.
    distinguish_by: [payment_reference]
    fields:
      payment_date: Posting date of the payment.
      payment_channel: Channel the payment came through.
      amount: Payment amount, positive.
      payment_reference: Confirmation or check number of the payment as issued by the processor.
      assistance_agency: Agency that paid, for energy_assistance_agency payments.
    account: account_balance
    direction: out
    triggers: []
  - type: service_payment_return
    target: service_payments
    meaning: A posted payment came back unpaid (insufficient funds, closed account, stop payment or chargeback) and is re-billed.
    grain: One row per returned payment.
    distinguish_by: [original_payment_id]
    fields:
      payment_date: Date the return was posted.
      original_payment_id: Reference of the payment that was returned.
      return_reason: Bank or issuer reason for the return.
      amount: Amount returned, positive (equal to the original payment).
    account: account_balance
    direction: in
    triggers:
      - event: service:service_fee
        map: {charge_component: returned_payment_fee, source_reference_id: original_payment_id}
  - type: service_assistance_pledge
    target: service_payments
    meaning: An energy assistance agency commits in writing to pay a stated amount toward the account; no money has moved yet.
    grain: One row per pledge from one agency.
    distinguish_by: [assistance_agency, payment_date]
    fields:
      payment_date: Date the pledge was recorded.
      assistance_agency: Agency making the pledge.
      amount: Amount pledged, positive.
      payment_reference: Pledge number issued by the agency.
    triggers: []
  - type: service_disconnect_notice
    target: service_accounts
    mutation: {transition: {from: active, to: disconnect_pending}}
    meaning: A written disconnect notice is issued for an unpaid past-due amount.
    grain: One row per transaction on the service account.
    fields:
      disconnect_notice_date: Issue date of the notice.
      disconnect_past_due_amount: Past-due amount stated on the notice.
    triggers: []
  - type: service_notice_cleared
    target: service_accounts
    mutation: {transition: {from: disconnect_pending, to: active}}
    meaning: The amount on the disconnect notice is paid or covered by an accepted arrangement and the notice is cleared.
    grain: One row per transaction on the service account.
    fields:
      disconnect_notice_date: Cleared to empty.
      disconnect_past_due_amount: Cleared to 0.00.
    triggers: []
  - type: service_disconnect
    target: service_accounts
    mutation: {transition: {from: disconnect_pending, to: disconnected_nonpay}}
    meaning: The meter is disconnected for nonpayment after the notice period.
    grain: One row per transaction on the service account.
    fields:
      disconnect_date: Date the meter was disconnected.
    triggers: []
  - type: service_reconnect
    target: service_accounts
    mutation: {transition: {from: disconnected_nonpay, to: active}}
    meaning: Power is restored to an account disconnected for nonpayment.
    grain: One row per transaction on the service account.
    fields:
      disconnect_date: Cleared to empty.
      disconnect_notice_date: Cleared to empty.
      disconnect_past_due_amount: Cleared to 0.00.
    triggers:
      - event: service:service_fee
        map: {charge_component: reconnect_fee}
  - type: service_seasonal_idle
    target: service_accounts
    mutation: {transition: {from: active, to: idle}}
    meaning: A seasonal residence or irrigation meter is de-energized for the off season without closing the account.
    grain: One row per transaction on the service account.
    fields:
      idle_date: Date the meter was de-energized.
    triggers: []
  - type: service_seasonal_restore
    target: service_accounts
    mutation: {transition: {from: idle, to: active}}
    meaning: An idle account is re-energized for the season.
    grain: One row per transaction on the service account.
    fields:
      idle_date: Cleared to empty.
    triggers:
      - event: service:service_fee
        map: {charge_component: seasonal_restore_fee}
  - type: service_final_bill
    target: service_accounts
    mutation:
      transition:
        - {from: active, to: final_billed}
        - {from: idle, to: final_billed}
        - {from: disconnect_pending, to: final_billed}
        - {from: disconnected_nonpay, to: final_billed}
    meaning: The account is final read and final billed after a confirmed stop-service order or after the finaling period of a nonpayment disconnection.
    grain: One row per transaction on the service account.
    fields:
      final_date: Date of the final read.
    triggers: []
  - type: service_close
    target: service_accounts
    mutation: {transition: {from: final_billed, to: closed}}
    meaning: A final-billed account whose balance is exactly zero is closed.
    grain: One row per transaction on the service account.
    fields:
      account_balance: Exactly 0.00 at closing.
    triggers: []
  - type: service_cash_only_flag
    target: service_accounts
    mutation: update
    meaning: The account is placed on cash-only status after repeated returned payments.
    grain: One row per transaction on the service account.
    fields:
      cash_only_until: Last date of cash-only status.
    triggers: []
  - type: service_outage_report
    target: service_trouble_reports
    meaning: A member reports an outage, partial power, blinking lights, low voltage, a line down, a tree on the line or meter damage at a service location.
    grain: One row per report from one service account about one outage or trouble occurrence.
    distinguish_by: [outage_event_number, report_date, report_time]
    fields:
      report_date: Date the report was taken.
      report_time: Time the report was taken, HH:MM.
      report_channel: How the member reported.
      trouble_type: What the member reported.
      outage_event_number: Outage management incident number the report is attached to.
    triggers: []
  - type: service_trouble_resolution
    target: service_trouble_reports
    meaning: The crew's finding on a reported trouble - cooperative side, member side or no trouble found - and when it was dispatched.
    grain: One row per resolved trouble report.
    distinguish_by: [original_report_id]
    fields:
      original_report_id: The trouble report this finding resolves.
      resolution_date: Date the crew completed the call.
      cause_finding: Where the crew found the cause.
      crew_dispatch_period: Whether the crew was dispatched inside or outside business hours.
    triggers: []
  - type: service_meter_test
    target: service_trouble_reports
    meaning: A member-requested meter test and its result.
    grain: One row per meter test.
    distinguish_by: [report_date]
    fields:
      report_date: Date the member requested the test.
      resolution_date: Date the test was performed.
      trouble_type: Always meter_test_request.
      meter_test_result: Within tolerance, fast or slow.
      meter_error_pct: Registration error found, percent (positive fast, negative slow).
    triggers:
      - event: service:service_bill_credit
        when: {meter_test_result: fast}
        map: {credit_reason: meter_error_refund, charge_component: bill_credit}
  - type: service_medical_certificate
    target: service_certificates
    meaning: A medical certificate signed by a licensed physician, physician assistant or nurse practitioner stating that a household member's health would be endangered by loss of service is received for the account.
    grain: One row per certificate received.
    distinguish_by: [received_date]
    fields:
      certificate_type: Always medical_certificate.
      received_date: Date the cooperative received the signed certificate.
      certifying_practitioner: Name of the certifying practitioner as written on the certificate.
      expires_date: Last day the certificate delays disconnection.
    triggers:
      - event: service:service_certificate_update
        map: {medical_certificate_expires: expires_date}
  - type: service_certificate_update
    target: service_accounts
    mutation: update
    meaning: The account's medical certificate protection date is updated from the newest accepted certificate.
    grain: One row per transaction on the service account.
    fields:
      medical_certificate_expires: Last day of medical certificate protection.
    triggers: []

measures:
  - id: service_msr_peak_demand_lookback
    window: The demand_ratchet_months billing periods immediately preceding the billing period being billed, on the same service account.
    measure: Highest metered_kw among service_usage_charge rows with charge_component demand_charge in the window; 0 when there are none.
  - id: service_msr_late_waivers_12m
    window: The 365 days ending on the day before the date of the waiver being considered, on the same service account.
    measure: Count of service_bill_credit rows with credit_reason late_charge_waiver whose charge_date falls in the window.
  - id: service_msr_returned_payments_lookback
    window: The returned_payment_lookback_months calendar months ending on and including the posting date of the return being processed, on the same service account.
    measure: Count of service_payment_return rows whose payment_date falls in the window, the return being processed included.
  - id: service_msr_member_side_calls_12m
    window: The 365 days ending on the day before the resolution_date of the call being charged, on the same service account.
    measure: Count of service_trouble_resolution rows with cause_finding member_side whose resolution_date falls in the window.
  - id: service_msr_meter_tests_12m
    window: The 365 days ending on the day before the report_date of the test being requested, on the same service account.
    measure: Count of service_meter_test rows whose report_date falls in the window.
  - id: service_msr_medical_certificates_12m
    window: The 365 days ending on the day before the received_date of the certificate being considered, on the same service account.
    measure: Count of service_medical_certificate rows whose received_date falls in the window.
  - id: service_msr_calendar_year_base_charges
    window: The billing periods YYYY-01 through YYYY-12 of the calendar year being settled, on the same service account.
    measure: Sum of amount of service_usage_charge rows with charge_component facility_charge, energy_charge or demand_charge in the window.
  - id: service_msr_rebill_window_energy
    window: The billing periods from the later of the connect_date period and the period meter_error_rebill_max_months periods before the test, through the last period billed before the test, on the same service account.
    measure: Sum of amount of service_usage_charge rows with charge_component energy_charge in the window.
  - id: service_msr_payments_since_notice
    window: From the disconnect_notice_date recorded on the service account through the current date, inclusive.
    measure: Sum of amount of service_payment rows posted in the window minus the sum of amount of service_payment_return rows posted in the window.
  - id: service_msr_open_pledges
    window: The assistance_pledge_hold_days calendar days ending on the current date, inclusive, on the same service account.
    measure: Sum of amount of service_assistance_pledge rows whose payment_date falls in the window, less the amount of service_payment rows with payment_channel energy_assistance_agency from the same agency posted on or after each pledge's date.

policies:
  - id: service_agg_multi_holding
    subject: [service_connect]
    rule: >-
      A member may hold any number of service accounts, because each metered location (the house, a shop,
      a grain bin site, each irrigation pivot) is its own service account with its own rate schedule,
      meter and bill. Two service accounts are never opened for the same meter_number at the same time:
      a location already held by another member is moved by a transfer (connect_type transfer), never by
      opening a second account beside the first. Every count, balance and history test in this charter
      is taken per service account unless a policy names the member's whole portfolio.
    eligibility: []
    params:
      max_per_customer: null
  - id: service_agg_member_balance
    subject: [service_connect, service_reconnect]
    rule: >-
      The cooperative reads the member's whole portfolio of service accounts before it opens or restores
      service. A new service account may be opened only when none of the member's final-billed service
      accounts carries an account_balance above zero. The basis is the current account_balance field of
      every service account of the same customer_id whose status is final_billed; a credit balance on one
      account never offsets a debit on another unless the member asks for the credit to be moved. An unpaid
      final balance must be paid in full before the new account is opened; it is never carried onto the new
      account as a program charge. A reconnection after a nonpayment disconnection follows
      service_evt_reconnect, and in addition any other service account of the same member that is itself
      disconnected_nonpay is reconnected only on its own payment, never on a payment made to a different account.
    eligibility:
      - id: no_unpaid_final_balance
        applies_to: [service_connect]
        kind: authorization
        condition: A new service account may be opened only when none of the member's final-billed service accounts carries an account_balance above zero.
        evidence_fields: [service_accounts.customer_id, service_accounts.status, service_accounts.account_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.customer_id]
          action_bindings:
            service_accounts.customer_id: customer_id
  - id: service_rate_schedule_assignment
    subject: [service_connect, service_rate_change]
    rule: >-
      Each service account is assigned the one rate schedule whose entry gates the location satisfies: the
      service phase must match phase_allowed (either accepts both), the installed transformer_kva may not exceed
      max_transformer_kva, the expected maximum demand from the application must lie from min_expected_demand_kw
      through max_expected_demand_kw inclusive, permanent_residence_required schedules serve only the member's
      year-round primary residence, and agricultural_use_required schedules serve only agricultural production
      load. Where two schedules both fit (a farm residence that also meets Schedule R), the member chooses, and
      the choice stands until a rate change. A rate schedule change may take effect only after
      rate_change_min_months full calendar months have passed since the current rate schedule took effect.
      Calendar months are counted from the rate_effective_date to the same day number of the later month,
      falling back to the last day of that month when the day number does not exist. A change takes effect on
      the first day of the next billing period, and the new rate_effective_date is that day. A change forced by
      the location no longer meeting the current schedule's entry gates (demand grown past max_expected_demand_kw,
      a three-phase upgrade) is made at the next billing period regardless of the waiting period. The
      combination switches budget_billing_eligible, prepay_eligible, deposit_tier and capital_patron_class of
      the assigned schedule decide which plans the account may join, which deposit tier is assessed and where
      its patronage is allocated.
    eligibility:
      - id: rate_change_waiting_period
        applies_to: [service_rate_change]
        kind: time
        condition: A rate schedule change may take effect only after rate_change_min_months full calendar months have passed since the current rate schedule took effect.
        evidence_fields: [service_accounts.rate_effective_date, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the current rate schedule took effect
          anchor_source: service_accounts.rate_effective_date
          relation: not_before
          duration_source: variants.rate_change_min_months
          unit: calendar_months
          counting_rule: Calendar months are counted from the rate_effective_date to the same day number of the later month, falling back to the last day of that month when the day number does not exist.
          boundary: inclusive
  - id: service_evt_usage_billing
    subject: [service_usage_charge]
    rule: >-
      Each billing period of a service account is billed as separate lines. The facility_charge line is
      facility_charge_monthly for every period the account is active, disconnect_pending or disconnected_nonpay,
      and for idle periods only where facility_charge_during_idle is true; the final bill carries a full facility
      charge. The energy_charge line prices the period's kWh at energy_rate_block1_per_kwh up to block1_kwh_limit
      and at energy_rate_block2_per_kwh above it. Where demand_charge_per_kw is above zero a demand_charge line
      is billed: billing demand is the larger of the period's metered_kw and demand_ratchet_pct percent of
      service_msr_peak_demand_lookback, multiplied by power_factor_target_pct divided by the period's power factor
      when power_factor_adjustment_applies and the measured power factor is lower than the target (that
      multiplication is shown as its own power_factor_adjustment line), and the kW above demand_free_kw are
      charged at demand_charge_per_kw. Where pca_applies the power_cost_adjustment line is calculated by the
      billing system from the board-approved monthly factor and is taken as recorded; it is never recomputed at
      the service desk. A sales_tax line equal to sales_tax_pct percent of the sum of the period's other lines is
      billed where sales_tax_pct is above zero. Each line is rounded to the cent. Usage lines may be billed only
      while the service account is in pending_connect, active, disconnect_pending, disconnected_nonpay, idle or
      final_billed status; a closed account is never billed.
    eligibility:
      - id: account_billable
        applies_to: [service_usage_charge]
        kind: state
        condition: Usage lines may be billed only while the service account is in pending_connect, active, disconnect_pending, disconnected_nonpay, idle or final_billed status; a closed account is never billed.
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [pending_connect, active, disconnect_pending, disconnected_nonpay, idle, final_billed]
    formula:
      energy_amount: round(min(kwh, block1_kwh_limit) * energy_rate_block1_per_kwh + max(kwh - block1_kwh_limit, 0) * energy_rate_block2_per_kwh, 2)
      ratchet_kw: max(metered_kw, demand_ratchet_pct / 100 * service_msr_peak_demand_lookback)
      demand_amount: round(max(billed_kw - demand_free_kw, 0) * demand_charge_per_kw, 2)
    measures: [service_msr_peak_demand_lookback]
  - id: service_evt_minimum_bill
    subject: [service_usage_charge]
    rule: >-
      When the facility, energy and demand lines of one billing period together come to less than the monthly
      minimum, a minimum_bill_adjustment line for the difference is added. The monthly minimum is the higher of
      minimum_monthly_charge and minimum_charge_per_kva multiplied by the account's transformer_kva. Idle periods
      in which no facility charge bills (facility_charge_during_idle false) carry no monthly minimum. Where
      annual_minimum_per_kva is above zero, the December bill compares service_msr_calendar_year_base_charges for
      that calendar year with annual_minimum_per_kva multiplied by transformer_kva and adds an
      annual_minimum_adjustment line for any shortfall; an account energized during the year has the annual
      minimum prorated by the number of whole calendar months it was energized divided by twelve, rounded to the
      cent. Power cost adjustment, sales tax and fees never count toward either minimum. Minimum lines carry no kWh.
    eligibility: []
    formula:
      monthly_minimum: max(minimum_monthly_charge, minimum_charge_per_kva * transformer_kva)
    measures: [service_msr_calendar_year_base_charges]
  - id: service_evt_late_charge
    subject: [service_late_charge, service_bill_credit]
    rule: >-
      The due date of a bill is the bill date of the billing period's facility_charge line plus bill_due_days
      calendar days. A late payment charge may be assessed only when the current date is later than the bill date
      of the billing period's facility_charge line plus bill_due_days calendar days. Calendar days are counted
      from the day after the bill date, the due date itself being the last day of the count. The past-due amount
      of the bill is what remains of that bill after payments posted on or before the due date, payments being
      applied to the oldest unpaid charges first. The charge is late_charge_pct percent of that past-due amount,
      rounded to the cent, but never less than late_charge_minimum, and it is assessed once per bill. No late
      charge is assessed on a bill whose past-due amount is fully covered by an energy assistance pledge recorded
      on or before the due date, nor on the portion of a balance moved into an active payment arrangement. A
      member may receive a courtesy waiver of one late charge, posted as a service_bill_credit with credit_reason
      late_charge_waiver whose source_reference_id is the late charge being waived and whose amount equals it,
      only when service_msr_late_waivers_12m is below late_charge_waivers_per_12_months and the account has no
      service_payment_return posted within the same window as service_msr_late_waivers_12m. A late charge is never
      partly waived.
    eligibility:
      - id: due_date_passed
        applies_to: [service_late_charge]
        kind: time
        condition: A late payment charge may be assessed only when the current date is later than the bill date of the billing period's facility_charge line plus bill_due_days calendar days.
        evidence_fields: [service_charges.charge_date, service_charges.billing_period, service_charges.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_charges.service_account_id, service_charges.billing_period]
          action_bindings:
            service_charges.service_account_id: service_account_id
            service_charges.billing_period: billing_period
        temporal_basis:
          clock: frozen_time
          anchor_event: the bill date of the billing period's facility_charge line
          anchor_source: service_charges.charge_date
          relation: not_before
          duration_source: variants.bill_due_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the bill date, the due date itself being the last day of the count.
          boundary: exclusive
    formula:
      late_amount: max(late_charge_minimum, round(amount * late_charge_pct / 100, 2))
    measures: [service_msr_late_waivers_12m]
  - id: service_evt_disconnect_nonpay
    subject: [service_disconnect_notice, service_disconnect, service_fee]
    rule: >-
      A disconnect notice is issued when a bill's past-due amount, plus any earlier unpaid past-due amounts, is at
      least disconnect_min_past_due and is still unpaid disconnect_notice_days_after_due calendar days after the due
      date; the notice records the issue date and the past-due amount it demands. Disconnection may be performed
      only when disconnect_notice_period_days calendar days have passed since the disconnect notice was issued.
      Calendar days are counted from the day after the notice date, the earliest disconnection day being the last
      day of the count. Disconnection is never performed while the service account's medical_certificate_expires
      date is on or after the current date. Disconnection is never performed while energy assistance pledges
      recorded within assistance_pledge_hold_days (service_msr_open_pledges) cover the past-due amount on the
      notice, nor while an active payment arrangement on the same service account is in good standing.
      Disconnection is performed only on weekdays that are not cooperative holidays, between business_hours_start
      and business_hours_end, never on the day before a cooperative holiday, and on a Friday only where
      disconnect_friday_allowed is true. When the field representative sent to disconnect collects the full
      past-due amount at the meter instead, the meter stays on, the notice is cleared and a field_collection_fee
      is charged. Notices are never issued for program charges of a prepay-enrolled account or for amounts under a
      budget plan deferral.
    eligibility:
      - id: notice_period_elapsed
        applies_to: [service_disconnect]
        kind: time
        condition: Disconnection may be performed only when disconnect_notice_period_days calendar days have passed since the disconnect notice was issued.
        evidence_fields: [service_accounts.disconnect_notice_date, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the disconnect notice was issued
          anchor_source: service_accounts.disconnect_notice_date
          relation: not_before
          duration_source: variants.disconnect_notice_period_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the notice date, the earliest disconnection day being the last day of the count.
          boundary: inclusive
      - id: no_medical_protection
        applies_to: [service_disconnect]
        kind: authorization
        condition: Disconnection is never performed while the service account's medical_certificate_expires date is on or after the current date.
        evidence_fields: [service_accounts.medical_certificate_expires, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
      - id: no_arrangement_in_good_standing
        applies_to: [service_disconnect]
        kind: authorization
        condition: Disconnection is never performed while energy assistance pledges recorded within assistance_pledge_hold_days (service_msr_open_pledges) cover the past-due amount on the notice, nor while an active payment arrangement on the same service account is in good standing.
        evidence_fields: [service_payments.service_account_id, service_payments.amount, service_payments.payment_date, arrangements.service_account_id, arrangements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_payments.service_account_id, arrangements.service_account_id]
          action_bindings:
            service_payments.service_account_id: service_account_id
            arrangements.service_account_id: service_account_id
    params:
      field_collection_requires_full_past_due: true
      per_tier:
        Schedule R Residential Service: {disconnect_min_past_due: "=disconnect_min_past_due", disconnect_notice_period_days: "=disconnect_notice_period_days", disconnect_friday_allowed: "=disconnect_friday_allowed", medical_certificate_eligible: "=medical_certificate_eligible"}
        Schedule RS Seasonal Residential Service: {disconnect_min_past_due: "=disconnect_min_past_due", disconnect_notice_period_days: "=disconnect_notice_period_days", disconnect_friday_allowed: "=disconnect_friday_allowed", medical_certificate_eligible: "=medical_certificate_eligible"}
        Schedule FH Farm and Home Service: {disconnect_min_past_due: "=disconnect_min_past_due", disconnect_notice_period_days: "=disconnect_notice_period_days", disconnect_friday_allowed: "=disconnect_friday_allowed", medical_certificate_eligible: "=medical_certificate_eligible"}
        Schedule GS-1 Single-Phase General Service: {disconnect_min_past_due: "=disconnect_min_past_due", disconnect_notice_period_days: "=disconnect_notice_period_days", disconnect_friday_allowed: "=disconnect_friday_allowed", medical_certificate_eligible: "=medical_certificate_eligible"}
        Schedule GS-3 Three-Phase General Service: {disconnect_min_past_due: "=disconnect_min_past_due", disconnect_notice_period_days: "=disconnect_notice_period_days", disconnect_friday_allowed: "=disconnect_friday_allowed", medical_certificate_eligible: "=medical_certificate_eligible"}
        Schedule IR Irrigation Service: {disconnect_min_past_due: "=disconnect_min_past_due", disconnect_notice_period_days: "=disconnect_notice_period_days", disconnect_friday_allowed: "=disconnect_friday_allowed", medical_certificate_eligible: "=medical_certificate_eligible"}
        Schedule LP Large Power Service: {disconnect_min_past_due: "=disconnect_min_past_due", disconnect_notice_period_days: "=disconnect_notice_period_days", disconnect_friday_allowed: "=disconnect_friday_allowed", medical_certificate_eligible: "=medical_certificate_eligible"}
    measures: [service_msr_open_pledges]
  - id: service_evt_reconnect
    subject: [service_reconnect, service_notice_cleared, service_fee]
    rule: >-
      A disconnect notice is cleared, and an account disconnected for nonpayment is reconnected, only when
      payments posted since the notice date (service_msr_payments_since_notice) reach the disconnect_past_due_amount
      on the notice, or a payment arrangement on the same service account has been accepted and is active, or the
      past-due amount has been transferred as arrears to a PrePay Power enrollment of the same service account. Where
      reconnect_deposit_required is true, a reconnection after a nonpayment disconnection additionally requires a
      security deposit record on the same service account in assessed, partially_paid or held status. The
      reconnect fee is reconnect_fee_remote when the meter_type is ami_remote_disconnect; otherwise it is
      reconnect_fee_truck_business_hours when the reconnect order is placed on a weekday that is not a cooperative
      holiday between business_hours_start and business_hours_end, and reconnect_fee_after_hours at any other time.
      The fee is billed on the next bill, never collected as a condition of reconnection, and is charged once per
      reconnection. Clearing a notice before disconnection carries no fee. The reconnect fee is never waived at the
      service desk.
    eligibility:
      - id: past_due_covered
        applies_to: [service_reconnect, service_notice_cleared]
        kind: authorization
        condition: A disconnect notice is cleared, and an account disconnected for nonpayment is reconnected, only when payments posted since the notice date (service_msr_payments_since_notice) reach the disconnect_past_due_amount on the notice, or a payment arrangement on the same service account has been accepted and is active, or the past-due amount has been transferred as arrears to a PrePay Power enrollment of the same service account.
        evidence_fields: [service_accounts.disconnect_past_due_amount, service_accounts.disconnect_notice_date, service_payments.amount, service_payments.payment_date, arrangements.status, arrangements.service_account_id, prepay_accounts.service_account_id, prepay_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangements.service_account_id]
          action_bindings:
            arrangements.service_account_id: service_account_id
      - id: deposit_on_file
        applies_to: [service_reconnect]
        kind: authorization
        condition: Where reconnect_deposit_required is true, a reconnection after a nonpayment disconnection additionally requires a security deposit record on the same service account in assessed, partially_paid or held status.
        evidence_fields: [deposit_accounts.service_account_id, deposit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.service_account_id]
          action_bindings:
            deposit_accounts.service_account_id: service_account_id
    params:
      per_tier:
        Schedule R Residential Service: {reconnect_fee_remote: "=reconnect_fee_remote", reconnect_fee_truck_business_hours: "=reconnect_fee_truck_business_hours", reconnect_fee_after_hours: "=reconnect_fee_after_hours"}
        Schedule RS Seasonal Residential Service: {reconnect_fee_remote: "=reconnect_fee_remote", reconnect_fee_truck_business_hours: "=reconnect_fee_truck_business_hours", reconnect_fee_after_hours: "=reconnect_fee_after_hours"}
        Schedule FH Farm and Home Service: {reconnect_fee_remote: "=reconnect_fee_remote", reconnect_fee_truck_business_hours: "=reconnect_fee_truck_business_hours", reconnect_fee_after_hours: "=reconnect_fee_after_hours"}
        Schedule GS-1 Single-Phase General Service: {reconnect_fee_remote: "=reconnect_fee_remote", reconnect_fee_truck_business_hours: "=reconnect_fee_truck_business_hours", reconnect_fee_after_hours: "=reconnect_fee_after_hours"}
        Schedule GS-3 Three-Phase General Service: {reconnect_fee_remote: "=reconnect_fee_remote", reconnect_fee_truck_business_hours: "=reconnect_fee_truck_business_hours", reconnect_fee_after_hours: "=reconnect_fee_after_hours"}
        Schedule IR Irrigation Service: {reconnect_fee_remote: "=reconnect_fee_remote", reconnect_fee_truck_business_hours: "=reconnect_fee_truck_business_hours", reconnect_fee_after_hours: "=reconnect_fee_after_hours"}
        Schedule LP Large Power Service: {reconnect_fee_remote: "=reconnect_fee_remote", reconnect_fee_truck_business_hours: "=reconnect_fee_truck_business_hours", reconnect_fee_after_hours: "=reconnect_fee_after_hours"}
    measures: [service_msr_payments_since_notice]
  - id: service_evt_payments
    subject: [service_payment, service_assistance_pledge]
    rule: >-
      A payment is posted on its payment_date and applied to the account's oldest unpaid charges first, late
      charges and fees in the order billed. A payment over the balance leaves a credit balance that is applied to
      future bills. While the current date is on or before the account's cash_only_until date, a payment may be
      accepted only through one of the cash_only_accepted_channels. An energy assistance pledge is recorded with
      the agency, the pledged amount and the agency's pledge number; it moves no money, it only holds disconnection
      for assistance_pledge_hold_days from the date recorded, and the account is credited only when the agency's
      funds arrive as a service_payment with payment_channel energy_assistance_agency. A pledge that lapses unpaid
      no longer holds disconnection. Operation Round Up grants are recorded the same way, with the cooperative's
      foundation as the agency.
    eligibility:
      - id: cash_only_channel
        applies_to: [service_payment]
        kind: authorization
        condition: While the current date is on or before the account's cash_only_until date, a payment may be accepted only through one of the cash_only_accepted_channels.
        evidence_fields: [service_accounts.cash_only_until, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
  - id: service_evt_returned_payment
    subject: [service_payment_return, service_cash_only_flag, service_fee]
    rule: >-
      A returned payment re-bills the full original amount and adds one returned_payment_fee whose
      source_reference_id is the returned payment. Each original payment can be returned only once; a second
      return notice for the same original_payment_id is not posted. When service_msr_returned_payments_lookback
      reaches returned_payments_before_cash_only, the account is placed on cash-only status with cash_only_until
      set to the posting date of that return plus cash_only_months calendar months (falling back to the last day of
      the month when the day number does not exist). A returned energy assistance agency payment carries no fee and
      never counts toward cash-only status. Automatic bank draft enrollment is ended when the account goes on
      cash-only status.
    eligibility:
      - id: one_return_per_payment
        applies_to: [service_payment_return]
        kind: dedup
        condition: Each original payment can be returned only once; a second return notice for the same original_payment_id is not posted.
        evidence_fields: [service_payments.original_payment_id, service_payments.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_payments.original_payment_id]
          action_bindings:
            service_payments.original_payment_id: original_payment_id
        dedup_contract:
          table: service_payments
          mode: separate_record
          object_bindings: {original_payment_id: original_payment_id}
          duplicate_filters: {event_type: [service_payment_return]}
          distinct_fields: []
    measures: [service_msr_returned_payments_lookback]
  - id: service_evt_trouble_calls
    subject: [service_outage_report, service_trouble_resolution, service_fee]
    rule: >-
      Reporting an outage or trouble is always free and is taken through any report channel. A report is attached
      to the outage management incident number the system assigns; a second report from the same service account
      for the same outage_event_number is not recorded as a new report. Reports of a line down or a tree on the line
      are dispatched as safety calls and are never charged. When the crew's finding is member_side, a trouble call
      charge is billed - trouble_call_charge_business_hours when the crew was dispatched during business hours and
      trouble_call_charge_after_hours otherwise - unless service_msr_member_side_calls_12m is below
      trouble_call_courtesy_waivers_per_12_months, in which case the call is not charged. Findings of coop_side or
      no_trouble_found are never charged. The trouble call charge's source_reference_id is the trouble report it
      resolves. The cooperative pays no outage credit for loss of service on any schedule.
    eligibility:
      - id: one_report_per_incident
        applies_to: [service_outage_report]
        kind: dedup
        condition: A report is attached to the outage management incident number the system assigns; a second report from the same service account for the same outage_event_number is not recorded as a new report.
        evidence_fields: [service_trouble_reports.service_account_id, service_trouble_reports.outage_event_number, service_trouble_reports.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_trouble_reports.service_account_id, service_trouble_reports.outage_event_number]
          action_bindings:
            service_trouble_reports.service_account_id: service_account_id
            service_trouble_reports.outage_event_number: outage_event_number
        dedup_contract:
          table: service_trouble_reports
          mode: separate_record
          object_bindings: {service_account_id: service_account_id, outage_event_number: outage_event_number}
          duplicate_filters: {event_type: [service_outage_report]}
          distinct_fields: []
    measures: [service_msr_member_side_calls_12m]
  - id: service_evt_meter_test
    subject: [service_meter_test, service_fee, service_bill_credit]
    rule: >-
      A member may ask for a meter test at any time. When service_msr_meter_tests_12m is below
      meter_tests_free_per_12_months the test is free; otherwise meter_test_fee is charged, but only when the meter
      is found within meter_accuracy_tolerance_pct. A meter found fast beyond tolerance is replaced and the member is
      credited, with credit_reason meter_error_refund, the overbilled share of the energy charges of the rebill
      window (service_msr_rebill_window_energy), which is that sum multiplied by the error percent divided by one
      hundred plus the error percent, rounded to the cent. A meter found slow beyond tolerance is replaced; the
      under-registration is back-billed over the same window only where slow_meter_backbill_allowed is true. No more
      than meter_error_rebill_max_months billing periods are ever corrected.
    eligibility: []
    formula:
      refund_amount: round(service_msr_rebill_window_energy * meter_error_pct / (100 + meter_error_pct), 2)
    measures: [service_msr_meter_tests_12m, service_msr_rebill_window_energy]
  - id: service_evt_seasonal_idle
    subject: [service_seasonal_idle, service_seasonal_restore, service_fee]
    rule: >-
      A seasonal idle may be ordered only on a schedule whose seasonal_idle_allowed is true, only on an active
      account, and only on the member's confirmed service order. While idle the meter is de-energized; the facility
      charge continues only where facility_charge_during_idle is true. A restore is billed seasonal_restore_fee.
      When the restore is ordered before seasonal_idle_min_months calendar months have passed since the idle_date,
      the facility charges of the idle periods that did not bill are back-billed as facility_charge lines in
      addition to the restore fee. An account in disconnect_pending status cannot be idled.
    eligibility: []
  - id: service_evt_final_bill
    subject: [service_final_bill, service_close]
    rule: >-
      An account is final billed on the requested date of the member's confirmed stop-service order or, for an
      account disconnected for nonpayment, once days_disconnected_before_final calendar days have passed since the
      disconnect_date. The final bill carries the usage to the final read and a full facility charge. A security
      deposit held on the account is applied to the final bill under the deposit charter, and capital credits are
      never applied to a final bill until the board retires them. A final credit balance of at least
      credit_refund_check_minimum is refunded by check to the mailing address on file within final_refund_days
      calendar days of the final bill; a smaller one
      is refunded only on the member's request. An account is closed only when its account_balance is exactly zero;
      an unpaid final balance stays on the final-billed account and blocks new service for the member under
      service_agg_member_balance.
    eligibility: []
    params:
      final_refund_days: 30
  - id: service_evt_medical_certificate
    subject: [service_medical_certificate, service_certificate_update, service_disconnect]
    rule: >-
      A medical certificate is accepted only on a schedule whose medical_certificate_eligible is true and only when
      it is signed by a licensed physician, physician assistant or nurse practitioner. A certificate is accepted
      only when service_msr_medical_certificates_12m is below medical_certificate_renewals_per_12_months. An
      accepted certificate protects the account from disconnection through its expires_date, which is the
      received_date plus medical_certificate_delay_days calendar days, counted from the day after the received date.
      The certificate postpones disconnection; it never forgives the balance, and late charges continue to apply.
      A certificate received after the meter was disconnected does not by itself restore service; reconnection then
      follows service_evt_reconnect. A certificate rejected for exceeding the renewal limit is recorded as received but does not
      update the protection date.
    eligibility: []
  - id: service_evt_program_charges
    subject: [service_program_charge]
    rule: >-
      A program charge is billed on the service bill only when another cooperative program's own record produces
      it: a payment arrangement's monthly installment or billed-back balance, unrecovered PrePay Power arrears, or an
      area light rental or area light charge. Budget Billing never produces a program charge, because the actual charges
      already stand on the account and a settle-up only changes the amount due. Its amount is taken verbatim from that program record and its source_reference_id is that record.
      Program charges count toward the past-due amount and the late charge like any other charge. A program charge
      is never billed on a closed service account.
    eligibility: []
  - id: service_evt_bill_credits
    subject: [service_bill_credit]
    rule: >-
      Every bill credit carries the credit_reason and the source_reference_id of the record it comes from, and its
      amount is taken from that record (a deposit refund or application to the balance, deposit interest, a capital credit
      retirement or offset, arrears moved to a prepay or payment arrangement record, a remaining prepaid balance moved
      back from PrePay Power, a late-charge waiver, a meter error refund, a billing error correction or an area light
      outage credit). One
      source record yields at most one credit for the same credit_reason. A billing error correction is posted only
      for a charge line shown to be billed at the wrong schedule or quantity, for the difference only.
    eligibility:
      - id: one_credit_per_source
        applies_to: [service_bill_credit]
        kind: dedup
        condition: One source record yields at most one credit for the same credit_reason.
        evidence_fields: [service_charges.source_reference_id, service_charges.credit_reason, service_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_charges.source_reference_id, service_charges.credit_reason]
          action_bindings:
            service_charges.source_reference_id: source_reference_id
            service_charges.credit_reason: credit_reason
        dedup_contract:
          table: service_charges
          mode: separate_record
          object_bindings: {source_reference_id: source_reference_id, credit_reason: credit_reason}
          duplicate_filters: {event_type: [service_bill_credit]}
          distinct_fields: []
  - id: service_evt_connect_fees
    subject: [service_connect, service_energize, service_fee]
    rule: >-
      Opening a service account bills connect_fee_new_service for new construction or a returning member and
      transfer_fee for a transfer of an energized location into a different member's name. A connect requested
      before same_day_request_cutoff on a business day and completed the same day adds same_day_connect_fee. Energization of new
      construction waits for the line extension project to be energized; a transfer is energized on the requested
      date without a field visit. The connect_fee and transfer_fee are billed on the first bill. A fee is never
      charged for correcting the name on an account of the same member.
    eligibility: []
    params:
      same_day_request_cutoff: "12:00"

extended_policies:
  - id: service_ext_late_charge_assessment
    base_policy_refs: [service_evt_late_charge, service_evt_program_charges]
    overwrite:
      - base_policy: service_evt_late_charge
        superseded_clause: >-
          The past-due amount of the bill is what remains of that bill after payments posted on or before the due
          date, payments being applied to the oldest unpaid charges first.
        replaced_by: >-
          Payments posted since the bill date are applied to the oldest unpaid charges first, so that they reach
          this bill only for the part of them that exceeds the earlier unpaid balance.
      - base_policy: service_evt_late_charge
        superseded_clause: >-
          The charge is late_charge_pct percent of that past-due amount, rounded to the cent, but never less than
          late_charge_minimum, and it is assessed once per bill.
        replaced_by: >-
          Whenever a late charge rate or an assisted-household multiplier below applies, the late payment charge
          is the late-charged amount multiplied by that late charge rate, as a percent, and by that multiplier, the
          two being applied together to the late-charged amount and the product rounded once to the cent; it is
          never less than late_charge_minimum.
      - base_policy: service_evt_late_charge
        superseded_clause: >-
          No late charge is assessed on a bill whose past-due amount is fully covered by an energy assistance pledge
          recorded on or before the due date, nor on the portion of a balance moved into an active payment
          arrangement.
        replaced_by: >-
          Pledge deduction from the late-charged amount: when the latest energy assistance pledge on the account
          was recorded no more than assistance_pledge_hold_days calendar days before the current date and on or
          before the bill's due date, and no payment from that pledging agency is dated less than one whole month
          before the current date, the full pledged amount is deducted from the late-charged amount; when that latest
          pledge meets the same two dates and payments from that pledging agency are dated in that month, the pledged
          amount less those payments, never less than zero, is deducted; otherwise nothing is deducted.
      - base_policy: service_evt_program_charges
        superseded_clause: >-
          Program charges count toward the past-due amount and the late charge like any other charge.
        replaced_by: >-
          When the bill carries area light rental lines, those rental lines are excluded from the late-charged
          amount; when it carries no area light rental line but carries area light charge lines, those area light
          charge lines are excluded; otherwise no area light line is excluded.
          Arrangement lines on the bill: when the account's payment arrangement is defaulted with an ended date less
          than twelve whole months before the current date, the bill's arrangement balance rebill lines are excluded
          from the late-charged amount; when the account's payment arrangement is active, the bill's arrangement
          installment lines are excluded; otherwise no arrangement line is excluded.
    trigger: state_due
    subject: [service_late_charge]
    computes: late_charge_amount
    target_tool: assess_late_charge_b4948c69
    params:
      repeat_returned_rate_pct: 2.00
      repeat_late_rate_pct: 1.75
      assisted_household_multiplier: 0.75
      medical_protection_multiplier: 0.50
    rule: >-
      The late payment charge is figured on the most recent bill of a service account, the bill whose lines are
      dated less than one whole month before the current date, once the current date is later than that bill's
      due date. The late-charged amount is the bill's usage lines and program charge lines less the payments
      applied to the bill, and never less than zero. Payments posted since the bill date are applied to the
      oldest unpaid charges first, so that they reach this bill only for the part of them that exceeds the
      earlier unpaid balance. The earlier unpaid balance is the current account balance less every usage line,
      program charge line, late payment charge and fee dated less than one whole month before the current date,
      plus every payment and bill credit dated in that month, less every returned payment dated in that month,
      and never less than zero. The late payment charge is late_charge_pct percent of the late-charged amount,
      rounded to the cent, never less than late_charge_minimum, and assessed once per bill. A bill whose
      late-charged amount comes to zero carries no late payment charge.
      Whenever a late charge rate or an assisted-household multiplier below applies, the late payment charge
      is the late-charged amount multiplied by that late charge rate, as a percent, and by that multiplier, the
      two being applied together to the late-charged amount and the product rounded once to the cent; it is
      never less than late_charge_minimum.
      Late charge rate: an account with two or more late payment charges dated less than twelve whole months
      before the current date and one or more returned payments dated in those twelve months is charged
      repeat_returned_rate_pct; an account with two or more late payment charges in those twelve months and no
      returned payment in them is charged repeat_late_rate_pct; any other account is charged the schedule's
      late_charge_pct.
      Pledge deduction from the late-charged amount: when the latest energy assistance pledge on the account
      was recorded no more than assistance_pledge_hold_days calendar days before the current date and on or
      before the bill's due date, and no payment from that pledging agency is dated less than one whole month
      before the current date, the full pledged amount is deducted from the late-charged amount; when that latest
      pledge meets the same two dates and payments from that pledging agency are dated in that month, the pledged
      amount less those payments, never less than zero, is deducted; otherwise nothing is deducted.
      Assisted-household multiplier: an account with a liheap energy assistance pledge or payment dated less
      than twelve whole months before the current date takes assisted_household_multiplier; an account with no
      such liheap record whose medical_certificate_expires date is on or after the current date takes
      medical_protection_multiplier; any other account takes a multiplier of one.
      Payments applied to the bill: when an energy assistance agency payment dated less than one whole month
      before the current date comes from an agency that has no pledge recorded on the account in that month,
      those agency payments are applied to this bill directly and the other payments of the month reach the bill
      only for the part that exceeds the earlier unpaid balance; when the agency payments of that month come from
      an agency that has a pledge recorded on the account in that month, those agency payments are left to that
      pledge and only the other payments of the month reach the bill, for the part that exceeds the earlier unpaid
      balance; when no agency payment is dated in that month, all payments of the month reach the bill only for
      the part that exceeds the earlier unpaid balance.
      When the bill carries area light rental lines, those rental lines are excluded from the late-charged
      amount; when it carries no area light rental line but carries area light charge lines, those area light
      charge lines are excluded; otherwise no area light line is excluded.
      Arrangement lines on the bill: when the account's payment arrangement is defaulted with an ended date less
      than twelve whole months before the current date, the bill's arrangement balance rebill lines are excluded
      from the late-charged amount; when the account's payment arrangement is active, the bill's arrangement
      installment lines are excluded; otherwise no arrangement line is excluded.
    prerequisite: []
    cross_category:
      - category: arrange
        as: branch
        reads: [status, ended_date]
        note: The arrangement-lines factor reads the status and ended date of the account's payment arrangement to decide which arrangement lines leave the late-charged amount.
    compute:
      - bill_date: "LATEST('service_charges', 'charge_date', date_field='charge_date', event_type='service_usage_charge', charge_component='facility_charge')"
      - bill_lines: "SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_usage_charge') + SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_program_charge')"
      - month_charges: "bill_lines + SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_late_charge') + SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_fee')"
      - month_payments: "SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment')"
      - month_returns: "SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment_return')"
      - month_credits: "SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_bill_credit')"
      - earlier_unpaid: "MX(0, F('account_balance') - month_charges + month_payments + month_credits - month_returns)"
      - month_agency_paid: "SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment', payment_channel='energy_assistance_agency')"
      - agency_of_payment: "LATEST('service_payments', 'assistance_agency', date_field='payment_date', event_type='service_payment', payment_channel='energy_assistance_agency')"
      - agency_pledges_in_month: "COUNT('service_payments', within_months=1, date_field='payment_date', event_type='service_assistance_pledge', assistance_agency=agency_of_payment)"
      - payments_applied: "(month_agency_paid + MX(0, month_payments - month_agency_paid - earlier_unpaid)) if (month_agency_paid > 0 and agency_pledges_in_month == 0) else (MX(0, month_payments - month_agency_paid - earlier_unpaid) if (month_agency_paid > 0 and agency_pledges_in_month > 0) else MX(0, month_payments - earlier_unpaid))"
      - pledge_amount: "LATEST('service_payments', 'amount', date_field='payment_date', event_type='service_assistance_pledge')"
      - pledge_date: "LATEST('service_payments', 'payment_date', date_field='payment_date', event_type='service_assistance_pledge')"
      - pledge_agency: "LATEST('service_payments', 'assistance_agency', date_field='payment_date', event_type='service_assistance_pledge')"
      - pledge_in_hold: "pledge_date and DAYS(pledge_date, NOW) <= P('assistance_pledge_hold_days') and DAYS(pledge_date, bill_date) + P('bill_due_days') >= 0"
      - pledging_agency_paid: "SUM('service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment', payment_channel='energy_assistance_agency', assistance_agency=pledge_agency)"
      - pledge_deduction: "pledge_amount if (pledge_in_hold and pledging_agency_paid == 0) else (MX(0, pledge_amount - pledging_agency_paid) if (pledge_in_hold and pledging_agency_paid > 0) else 0)"
      - late_charges_12m: "COUNT('service_charges', within_months=12, date_field='charge_date', event_type='service_late_charge')"
      - returns_12m: "COUNT('service_payments', within_months=12, date_field='payment_date', event_type='service_payment_return')"
      - late_charge_rate: "K('repeat_returned_rate_pct') if (late_charges_12m >= 2 and returns_12m >= 1) else (K('repeat_late_rate_pct') if (late_charges_12m >= 2 and returns_12m == 0) else P('late_charge_pct'))"
      - liheap_records_12m: "COUNT('service_payments', within_months=12, date_field='payment_date', assistance_agency='liheap')"
      - medical_until: "F('medical_certificate_expires')"
      - assisted_multiplier: "K('assisted_household_multiplier') if liheap_records_12m >= 1 else (K('medical_protection_multiplier') if (liheap_records_12m == 0 and medical_until and DAYS(NOW, medical_until) >= 0) else 1)"
      - rental_lines: "SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_program_charge', charge_component='area_light_rental')"
      - light_charge_lines: "SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_program_charge', charge_component='area_light_charge')"
      - light_lines_excluded: "rental_lines if rental_lines > 0 else (light_charge_lines if (rental_lines == 0 and light_charge_lines > 0) else 0)"
      - arrangement_status: "CFIELD('arrange', 'status', service_account_id=HID)"
      - arrangement_ended: "CFIELD('arrange', 'ended_date', service_account_id=HID)"
      - rebill_lines: "SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_program_charge', charge_component='arrangement_balance_rebill')"
      - installment_lines: "SUM('service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_program_charge', charge_component='arrangement_installment')"
      - arrangement_lines_excluded: "rebill_lines if (arrangement_status == 'defaulted' and arrangement_ended and MONTHS(arrangement_ended, NOW) < 12) else (installment_lines if arrangement_status == 'active' else 0)"
      - late_charged_amount: "MX(0, bill_lines - light_lines_excluded - arrangement_lines_excluded - payments_applied - pledge_deduction)"
      - result: "0 if late_charged_amount == 0 else MX(P('late_charge_minimum'), RND(late_charged_amount * late_charge_rate / 100 * assisted_multiplier, 2))"
    compute_basis:
      bill_date: "The late payment charge is figured on the most recent bill of a service account, the bill whose lines are dated less than one whole month before the current date, once the current date is later than that bill's due date."
      bill_lines: "The late-charged amount is the bill's usage lines and program charge lines less the payments applied to the bill, and never less than zero."
      month_charges: "The earlier unpaid balance is the current account balance less every usage line, program charge line, late payment charge and fee dated less than one whole month before the current date, plus every payment and bill credit dated in that month, less every returned payment dated in that month, and never less than zero."
      month_payments: "plus every payment and bill credit dated in that month"
      month_returns: "less every returned payment dated in that month"
      month_credits: "plus every payment and bill credit dated in that month"
      earlier_unpaid: "The earlier unpaid balance is the current account balance less every usage line, program charge line, late payment charge and fee dated less than one whole month before the current date, plus every payment and bill credit dated in that month, less every returned payment dated in that month, and never less than zero."
      month_agency_paid: "when an energy assistance agency payment dated less than one whole month before the current date comes from an agency that has no pledge recorded on the account in that month"
      agency_of_payment: "comes from an agency that has no pledge recorded on the account in that month"
      agency_pledges_in_month: "when the agency payments of that month come from an agency that has a pledge recorded on the account in that month"
      payments_applied: "Payments applied to the bill: when an energy assistance agency payment dated less than one whole month before the current date comes from an agency that has no pledge recorded on the account in that month, those agency payments are applied to this bill directly and the other payments of the month reach the bill only for the part that exceeds the earlier unpaid balance; when the agency payments of that month come from an agency that has a pledge recorded on the account in that month, those agency payments are left to that pledge and only the other payments of the month reach the bill, for the part that exceeds the earlier unpaid balance; when no agency payment is dated in that month, all payments of the month reach the bill only for the part that exceeds the earlier unpaid balance."
      pledge_amount: "the full pledged amount is deducted from the late-charged amount"
      pledge_date: "when the latest energy assistance pledge on the account was recorded no more than assistance_pledge_hold_days calendar days before the current date and on or before the bill's due date"
      pledge_agency: "no payment from that pledging agency is dated less than one whole month before the current date"
      pledge_in_hold: "when the latest energy assistance pledge on the account was recorded no more than assistance_pledge_hold_days calendar days before the current date and on or before the bill's due date"
      pledging_agency_paid: "and no payment from that pledging agency is dated less than one whole month before the current date"
      pledge_deduction: "Pledge deduction from the late-charged amount: when the latest energy assistance pledge on the account was recorded no more than assistance_pledge_hold_days calendar days before the current date and on or before the bill's due date, and no payment from that pledging agency is dated less than one whole month before the current date, the full pledged amount is deducted from the late-charged amount; when that latest pledge meets the same two dates and payments from that pledging agency are dated in that month, the pledged amount less those payments, never less than zero, is deducted; otherwise nothing is deducted."
      late_charges_12m: "an account with two or more late payment charges dated less than twelve whole months before the current date"
      returns_12m: "one or more returned payments dated in those twelve months"
      late_charge_rate: "Late charge rate: an account with two or more late payment charges dated less than twelve whole months before the current date and one or more returned payments dated in those twelve months is charged repeat_returned_rate_pct; an account with two or more late payment charges in those twelve months and no returned payment in them is charged repeat_late_rate_pct; any other account is charged the schedule's late_charge_pct."
      liheap_records_12m: "an account with a liheap energy assistance pledge or payment dated less than twelve whole months before the current date"
      medical_until: "whose medical_certificate_expires date is on or after the current date"
      assisted_multiplier: "Assisted-household multiplier: an account with a liheap energy assistance pledge or payment dated less than twelve whole months before the current date takes assisted_household_multiplier; an account with no such liheap record whose medical_certificate_expires date is on or after the current date takes medical_protection_multiplier; any other account takes a multiplier of one."
      rental_lines: "When the bill carries area light rental lines, those rental lines are excluded from the late-charged amount"
      light_charge_lines: "when it carries no area light rental line but carries area light charge lines, those area light charge lines are excluded"
      light_lines_excluded: "When the bill carries area light rental lines, those rental lines are excluded from the late-charged amount; when it carries no area light rental line but carries area light charge lines, those area light charge lines are excluded; otherwise no area light line is excluded."
      arrangement_status: "when the account's payment arrangement is defaulted with an ended date less than twelve whole months before the current date"
      arrangement_ended: "with an ended date less than twelve whole months before the current date"
      rebill_lines: "the bill's arrangement balance rebill lines are excluded from the late-charged amount"
      installment_lines: "when the account's payment arrangement is active, the bill's arrangement installment lines are excluded"
      arrangement_lines_excluded: "Arrangement lines on the bill: when the account's payment arrangement is defaulted with an ended date less than twelve whole months before the current date, the bill's arrangement balance rebill lines are excluded from the late-charged amount; when the account's payment arrangement is active, the bill's arrangement installment lines are excluded; otherwise no arrangement line is excluded."
      late_charged_amount: "The late-charged amount is the bill's usage lines and program charge lines less the payments applied to the bill, and never less than zero."
      result: "Whenever a late charge rate or an assisted-household multiplier below applies, the late payment charge is the late-charged amount multiplied by that late charge rate, as a percent, and by that multiplier, the two being applied together to the late-charged amount and the product rounded once to the cent; it is never less than late_charge_minimum."
    factors:
      - id: late_charge_rate_tier
        effect: parameter
        decides: late_charge_rate
        bindings: [late_charges_12m, returns_12m, late_charge_rate]
        ladder:
          - when: "two or more late payment charges in the twelve months before the current date and one or more returned payments in those months"
            value: "K('repeat_returned_rate_pct')"
          - when: "two or more late payment charges in those twelve months and no returned payment in them"
            value: "K('repeat_late_rate_pct')"
          - when: "otherwise"
            value: "P('late_charge_pct')"
        baseline:
          late_charge_rate: "P('late_charge_pct')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: pledge_deduction_from_late_charged_amount
        effect: parameter
        decides: pledge_deduction
        bindings: [pledge_amount, pledge_date, pledge_agency, pledge_in_hold, pledging_agency_paid, pledge_deduction]
        ladder:
          - when: "the latest pledge was recorded within assistance_pledge_hold_days before today and on or before the bill's due date, and no payment from that agency is dated in the month before today"
            value: "the full pledged amount"
          - when: "the latest pledge meets the same two dates and payments from that agency are dated in that month"
            value: "the pledged amount less those agency payments, never below zero"
          - when: "otherwise"
            value: "0"
        baseline:
          pledge_deduction: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: assisted_household_multiplier
        effect: parameter
        decides: assisted_multiplier
        bindings: [liheap_records_12m, medical_until, assisted_multiplier]
        ladder:
          - when: "a liheap pledge or payment dated in the twelve months before today"
            value: "K('assisted_household_multiplier')"
          - when: "no such liheap record and medical certificate protection running through today or later"
            value: "K('medical_protection_multiplier')"
          - when: "otherwise"
            value: "1"
        baseline:
          assisted_multiplier: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: payments_applied_to_bill
        effect: method
        decides: payments_applied
        bindings: [month_agency_paid, agency_of_payment, agency_pledges_in_month, payments_applied]
        ladder:
          - when: "an agency payment dated in the month before today from an agency with no pledge recorded on the account in that month"
            method: "the agency payments go to this bill directly; the other payments of the month reach it only beyond the earlier unpaid balance"
          - when: "the agency payments of the month come from an agency with a pledge recorded in that month"
            method: "the agency payments are left to the pledge; only the other payments reach the bill, beyond the earlier unpaid balance"
          - when: "otherwise"
            method: "all payments of the month are applied oldest charges first and reach the bill only beyond the earlier unpaid balance"
        baseline:
          payments_applied: "MX(0, month_payments - earlier_unpaid)"
        evidence: [history]
        cross_difficulty: null
      - id: area_light_line_exclusion
        effect: parameter
        decides: light_lines_excluded
        bindings: [rental_lines, light_charge_lines, light_lines_excluded]
        ladder:
          - when: "the bill carries area light rental lines"
            value: "the rental lines"
          - when: "no rental line but area light charge lines"
            value: "the area light charge lines"
          - when: "otherwise"
            value: "0"
        baseline:
          light_lines_excluded: "0"
        evidence: [history]
        cross_difficulty: null
      - id: arrangement_line_exclusion
        effect: parameter
        decides: arrangement_lines_excluded
        bindings: [arrangement_status, arrangement_ended, rebill_lines, installment_lines, arrangement_lines_excluded]
        ladder:
          - when: "the account's payment arrangement is defaulted with an ended date less than twelve whole months before today"
            value: "the bill's arrangement balance rebill lines"
          - when: "the account's payment arrangement is active"
            value: "the bill's arrangement installment lines"
          - when: "otherwise"
            value: "0"
        baseline:
          arrangement_lines_excluded: "0"
        evidence: [history, cross_category, date]
        cross_difficulty: arrange
    baseline:
      rule: >-
