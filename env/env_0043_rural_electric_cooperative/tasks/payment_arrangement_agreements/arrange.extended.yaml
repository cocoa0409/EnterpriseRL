events:
  - type: arrange_offer
    target: arrangements
    mutation: create
    meaning: The service desk offers the member a deferred payment agreement with stated terms on one service account.
    grain: One row per agreement offered.
    fields:
      customer_id: Member offered the agreement.
      service_account_id: Service account whose past-due amount is arranged.
      variant_name: Official agreement tier.
      offered_date: Date of the offer.
      past_due_amount: Past-due amount of the service account on the offer date.
      down_payment_amount: Down payment required.
      arranged_amount: Amount to be spread over installments (past due less down payment).
      installment_count: Number of installments.
      installment_amount: Amount of each installment but the last.
      first_installment_period: Billing period of the first installment, YYYY-MM.
    triggers: []
  - type: arrange_accept
    target: arrangements
    mutation: {transition: {from: offered, to: active}}
    meaning: The member accepts the offered terms.
    grain: One row per transaction on the agreement.
    fields:
      accepted_date: Date the member accepted.
      acceptance_method: How the member accepted.
    triggers:
      - event: arrange:arrange_balance_transfer
        map: {entry_date: accepted_date}
  - type: arrange_expire
    target: arrangements
    mutation: {transition: {from: offered, to: expired}}
    meaning: An offer not accepted within the acceptance window lapses.
    grain: One row per transaction on the agreement.
    fields:
      ended_date: Date the offer lapsed.
    triggers: []
  - type: arrange_balance_transfer
    target: arrange_ledger
    meaning: The arranged amount is moved off the service account's past-due balance into the agreement.
    grain: One row per accepted agreement.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date of the transfer (the acceptance date).
      amount: Arranged amount moved, positive.
    account: arrangement_balance
    direction: in
    triggers:
      - event: service:service_bill_credit
        map: {credit_reason: arrears_to_arrangement, charge_component: bill_credit, amount: amount, charge_date: entry_date, source_reference_id: arrangement_id}
  - type: arrange_installment_bill
    target: arrange_ledger
    meaning: One installment of the agreement is billed back on the service account's monthly bill.
    grain: One row per installment billed.
    distinguish_by: [installment_number]
    fields:
      entry_date: Bill date the installment was billed on.
      billing_period: Billing period of the bill.
      installment_number: Which installment this is.
      amount: Installment amount, positive.
    account: arrangement_balance
    direction: out
    triggers:
      - event: service:service_program_charge
        map: {charge_component: arrangement_installment, billing_period: billing_period, amount: amount, charge_date: entry_date, source_reference_id: arrangement_id}
  - type: arrange_installment_missed
    target: arrange_ledger
    meaning: A billed installment, or the current charges billed with it, was still unpaid when the grace period ended.
    grain: One row per installment missed.
    distinguish_by: [installment_number]
    fields:
      entry_date: Date the grace period ended unpaid.
      billing_period: Billing period of the installment.
      installment_number: Which installment was missed.
      amount: Unpaid part of the installment and current charges, positive.
    triggers: []
  - type: arrange_balance_rebill
    target: arrange_ledger
    meaning: The unbilled arranged balance is billed back on the service account at early payoff, default, PrePay Power enrollment or final billing.
    grain: One row per agreement ending with an unbilled balance.
    distinguish_by: [rebill_reason]
    fields:
      entry_date: Date billed back.
      rebill_reason: Why the balance was billed back.
      amount: Unbilled balance billed back, positive.
    account: arrangement_balance
    direction: out
    triggers:
      - event: service:service_program_charge
        map: {charge_component: arrangement_balance_rebill, amount: amount, charge_date: entry_date, source_reference_id: arrangement_id}
  - type: arrange_complete
    target: arrangements
    mutation: {transition: {from: active, to: completed}}
    meaning: The agreement is finished with every installment billed or the balance paid off early.
    grain: One row per transaction on the agreement.
    fields:
      ended_date: Date the agreement was completed.
    triggers: []
  - type: arrange_default
    target: arrangements
    mutation: {transition: {from: active, to: defaulted}}
    meaning: The agreement defaults on missed installments.
    grain: One row per transaction on the agreement.
    fields:
      ended_date: Date of the default.
    triggers:
      - event: arrange:arrange_balance_rebill
        map: {rebill_reason: default, entry_date: ended_date}
  - type: arrange_terminate
    target: arrangements
    mutation: {transition: {from: active, to: terminated}}
    meaning: The agreement ends because the service account was final billed or enrolled in PrePay Power.
    grain: One row per transaction on the agreement.
    fields:
      ended_date: Date the agreement ended.
      termination_reason: Final billing or PrePay Power enrollment.
    triggers:
      - event: arrange:arrange_balance_rebill
        map: {rebill_reason: termination_reason, entry_date: ended_date}

measures:
  - id: arrange_msr_past_due
    window: Point in time on the offer date, on the service account offered.
    measure: The service account's account_balance less the amount of service_charges rows of the latest billing period whose due date (bill date plus the schedule's bill_due_days) has not yet passed, and less any credit balance; never below zero.
  - id: arrange_msr_accepted_12m
    window: The 365 days ending on the offer date, on the same service account.
    measure: Count of agreements of the same service account whose accepted_date falls in the window.
  - id: arrange_msr_member_defaults
    window: The prior_default_lookback_months calendar months ending on the offer date, across every service account of the same member.
    measure: Count of agreements of the member in defaulted status whose ended_date falls in the window.
  - id: arrange_msr_missed_installments
    window: The life of the agreement.
    measure: Count of arrange_installment_missed rows of the agreement.
  - id: arrange_msr_open_pledges
    window: The assistance_pledge_lookback_days calendar days ending on the offer date, on the service account offered.
    measure: Sum of amount of service_assistance_pledge rows whose payment_date falls in the window, less energy_assistance_agency payments from the same agency posted on or after each pledge's date.

policies:
  - id: arrange_agg_multi_holding
    subject: [arrange_offer]
    rule: >-
      A member may hold agreements on several service accounts, each agreement covering the past-due amount of one service
      account only; past-due amounts of different service accounts are never combined into one agreement. A service account
      may carry at most max_active_per_service_account agreement in offered or active status at a time. The terms of an active
      agreement are never changed while it runs, because renegotiation_allowed is false; a member who cannot keep the
      agreement defaults and the default rules apply.
    eligibility:
      - id: one_open_agreement
        applies_to: [arrange_offer]
        kind: dedup
        condition: A service account may carry at most max_active_per_service_account agreement in offered or active status at a time.
        evidence_fields: [arrangements.service_account_id, arrangements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangements.service_account_id]
          action_bindings:
            arrangements.service_account_id: service_account_id
        dedup_contract:
          table: arrangements
          mode: separate_record
          object_bindings: {service_account_id: service_account_id}
          duplicate_filters: {status: [offered, active]}
          distinct_fields: []
    params:
      max_per_customer: null
  - id: arrange_agg_member_history
    subject: [arrange_offer]
    rule: >-
      Default history is read across the member's whole portfolio, while frequency is read per service account. An agreement
      may be offered only when arrange_msr_member_defaults is at most the tier's prior_defaults_allowed and
      arrange_msr_accepted_12m is below the tier's arrangements_per_12_months. A default on any of the member's service
      accounts counts against an offer on every other account of the same member. Expired offers count toward neither.
    eligibility:
      - id: history_within_limits
        applies_to: [arrange_offer]
        kind: authorization
        condition: An agreement may be offered only when arrange_msr_member_defaults is at most the tier's prior_defaults_allowed and arrange_msr_accepted_12m is below the tier's arrangements_per_12_months.
        evidence_fields: [arrangements.customer_id, arrangements.status, arrangements.ended_date, arrangements.accepted_date, arrangements.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangements.customer_id]
          action_bindings:
            arrangements.customer_id: customer_id
    params:
      per_tier:
        Standard Deferred Payment Agreement: {prior_defaults_allowed: "=prior_defaults_allowed", arrangements_per_12_months: "=arrangements_per_12_months"}
        Extended Hardship Payment Agreement: {prior_defaults_allowed: "=prior_defaults_allowed", arrangements_per_12_months: "=arrangements_per_12_months"}
        Winter Protection Payment Agreement: {prior_defaults_allowed: "=prior_defaults_allowed", arrangements_per_12_months: "=arrangements_per_12_months"}
        Medical Certificate Payment Agreement: {prior_defaults_allowed: "=prior_defaults_allowed", arrangements_per_12_months: "=arrangements_per_12_months"}
        Agricultural Harvest Payment Agreement: {prior_defaults_allowed: "=prior_defaults_allowed", arrangements_per_12_months: "=arrangements_per_12_months"}
        Commercial Installment Agreement: {prior_defaults_allowed: "=prior_defaults_allowed", arrangements_per_12_months: "=arrangements_per_12_months"}
    measures: [arrange_msr_member_defaults, arrange_msr_accepted_12m]
  - id: arrange_eligibility
    subject: [arrange_offer]
    rule: >-
      The tier is the one whose eligible_rate_schedules include the service account's rate schedule and whose
      eligible_member_types include the member's member_type, and whose remaining entry conditions hold; where several tiers
      fit, the member chooses among them. The service account's status must be one of the tier's arrangeable_service_statuses
      on the offer date. An agreement may be offered only after minimum_service_months full calendar months have passed since
      the service account was connected. Calendar months are counted from the connect_date to the same day number of the
      later month, falling back to the last day of that month when the day number does not exist. The offer date must fall
      inside the tier's offer window from offer_window_start through offer_window_end. The past-due amount
      (arrange_msr_past_due) must be at least min_past_due, and after the down payment no more than max_arranged_amount. Where
      assistance_pledge_required is true an energy assistance pledge must have been recorded within
      assistance_pledge_lookback_days; where medical_certificate_required is true the service account's
      medical_certificate_expires must be on or after the offer date. Because prepay_compatible and budget_billing_compatible
      are false, an account enrolled in PrePay Power or on an active Budget Billing plan cannot be offered an agreement, and
      because final_billed_accounts_allowed is false a final-billed balance is never arranged. Where
      counseling_referral_required is true the member is given the energy assistance counseling line with the offer.
    eligibility:
      - id: service_status_arrangeable
        applies_to: [arrange_offer]
        kind: state
        condition: The service account's status must be one of the tier's arrangeable_service_statuses on the offer date.
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [active, disconnect_pending, disconnected_nonpay]
      - id: minimum_service_tenure
        applies_to: [arrange_offer]
        kind: time
        condition: An agreement may be offered only after minimum_service_months full calendar months have passed since the service account was connected.
        evidence_fields: [service_accounts.connect_date, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the service account was connected
          anchor_source: service_accounts.connect_date
          relation: not_before
          duration_source: variants.minimum_service_months
          unit: calendar_months
          counting_rule: Calendar months are counted from the connect_date to the same day number of the later month, falling back to the last day of that month when the day number does not exist.
          boundary: inclusive
      - id: no_prepay_or_budget
        applies_to: [arrange_offer]
        kind: authorization
        condition: Because prepay_compatible and budget_billing_compatible are false, an account enrolled in PrePay Power or on an active Budget Billing plan cannot be offered an agreement, and because final_billed_accounts_allowed is false a final-billed balance is never arranged.
        evidence_fields: [prepay_accounts.service_account_id, prepay_accounts.status, budget_plans.service_account_id, budget_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [prepay_accounts.service_account_id, budget_plans.service_account_id]
          action_bindings:
            prepay_accounts.service_account_id: service_account_id
            budget_plans.service_account_id: service_account_id
    params:
      per_tier:
        Standard Deferred Payment Agreement: {min_past_due: "=min_past_due", max_arranged_amount: "=max_arranged_amount", minimum_service_months: "=minimum_service_months", offer_window_start: "=offer_window_start", offer_window_end: "=offer_window_end"}
        Extended Hardship Payment Agreement: {min_past_due: "=min_past_due", max_arranged_amount: "=max_arranged_amount", minimum_service_months: "=minimum_service_months", offer_window_start: "=offer_window_start", offer_window_end: "=offer_window_end"}
        Winter Protection Payment Agreement: {min_past_due: "=min_past_due", max_arranged_amount: "=max_arranged_amount", minimum_service_months: "=minimum_service_months", offer_window_start: "=offer_window_start", offer_window_end: "=offer_window_end"}
        Medical Certificate Payment Agreement: {min_past_due: "=min_past_due", max_arranged_amount: "=max_arranged_amount", minimum_service_months: "=minimum_service_months", offer_window_start: "=offer_window_start", offer_window_end: "=offer_window_end"}
        Agricultural Harvest Payment Agreement: {min_past_due: "=min_past_due", max_arranged_amount: "=max_arranged_amount", minimum_service_months: "=minimum_service_months", offer_window_start: "=offer_window_start", offer_window_end: "=offer_window_end"}
        Commercial Installment Agreement: {min_past_due: "=min_past_due", max_arranged_amount: "=max_arranged_amount", minimum_service_months: "=minimum_service_months", offer_window_start: "=offer_window_start", offer_window_end: "=offer_window_end"}
    measures: [arrange_msr_past_due, arrange_msr_open_pledges]
  - id: arrange_evt_terms
    subject: [arrange_offer]
    rule: >-
      The down payment is down_payment_pct percent of the past-due amount rounded to the cent, but not less than
      down_payment_minimum and never more than the past-due amount; where pledge_counts_toward_down_payment is true, the open
      pledges (arrange_msr_open_pledges) reduce the down payment the member must pay, never below zero. The arranged amount is
      the past-due amount less the down payment (the pledged part included), and include_current_charges being false, charges
      not yet past due are never arranged. On a monthly schedule the member chooses the number of installments up to
      max_installments; the count is reduced until each installment is at least min_installment_amount, and each installment
      is the arranged amount divided by the count, rounded to the cent, the last absorbing the difference. On a
      single_harvest_installment schedule there is one installment, billed in the billing period of harvest_installment_month
      following the offer. The first installment is billed first_installment_offset_periods periods after acceptance. The
      arrangement_fee, where above zero, is billed as a service fee with the first installment, and no interest is charged
      (interest_rate_pct).
    eligibility: []
    params:
      per_tier:
        Standard Deferred Payment Agreement: {down_payment_pct: "=down_payment_pct", down_payment_minimum: "=down_payment_minimum", max_installments: "=max_installments", min_installment_amount: "=min_installment_amount", installment_schedule: "=installment_schedule", arrangement_fee: "=arrangement_fee"}
        Extended Hardship Payment Agreement: {down_payment_pct: "=down_payment_pct", down_payment_minimum: "=down_payment_minimum", max_installments: "=max_installments", min_installment_amount: "=min_installment_amount", installment_schedule: "=installment_schedule", arrangement_fee: "=arrangement_fee"}
        Winter Protection Payment Agreement: {down_payment_pct: "=down_payment_pct", down_payment_minimum: "=down_payment_minimum", max_installments: "=max_installments", min_installment_amount: "=min_installment_amount", installment_schedule: "=installment_schedule", arrangement_fee: "=arrangement_fee"}
        Medical Certificate Payment Agreement: {down_payment_pct: "=down_payment_pct", down_payment_minimum: "=down_payment_minimum", max_installments: "=max_installments", min_installment_amount: "=min_installment_amount", installment_schedule: "=installment_schedule", arrangement_fee: "=arrangement_fee"}
        Agricultural Harvest Payment Agreement: {down_payment_pct: "=down_payment_pct", down_payment_minimum: "=down_payment_minimum", max_installments: "=max_installments", min_installment_amount: "=min_installment_amount", installment_schedule: "=installment_schedule", arrangement_fee: "=arrangement_fee"}
        Commercial Installment Agreement: {down_payment_pct: "=down_payment_pct", down_payment_minimum: "=down_payment_minimum", max_installments: "=max_installments", min_installment_amount: "=min_installment_amount", installment_schedule: "=installment_schedule", arrangement_fee: "=arrangement_fee"}
    formula:
      down_payment: min(past_due_amount, max(down_payment_minimum, round(past_due_amount * down_payment_pct / 100, 2)))
      arranged: past_due_amount - down_payment_amount
      installment: round(arranged_amount / installment_count, 2)
  - id: arrange_evt_acceptance
    subject: [arrange_accept, arrange_balance_transfer, arrange_expire]
    rule: >-
      Accepting the agreement is the member's own commitment and is given only by the member, through one of the tier's
      acceptance_methods_allowed. The member must accept within acceptance_window_days calendar days after the agreement was
      offered. Calendar days are counted from the day after the offered_date, the last day of the window being the last day of
      the count. The down payment, less any pledge counted toward it, must have posted on the service account through one of
      the down_payment_channels on or after the offered_date before the acceptance is recorded. On acceptance the arranged
      amount is moved off the service account's past-due balance (arrange_balance_transfer); where notice_cleared_on_acceptance
      is true an outstanding disconnect notice is cleared, and where reconnect_on_acceptance is true a disconnected account
      qualifies for reconnection under the Electric Service charter. An offer not accepted in the window expires and nothing is
      moved.
    eligibility:
      - id: accept_in_window
        applies_to: [arrange_accept]
        kind: time
        condition: The member must accept within acceptance_window_days calendar days after the agreement was offered.
        evidence_fields: [arrangements.offered_date, arrangements.arrangement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangements.arrangement_id]
          action_bindings:
            arrangements.arrangement_id: arrangement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the agreement was offered
          anchor_source: arrangements.offered_date
          relation: not_after
          duration_source: variants.acceptance_window_days
          unit: calendar_days
          counting_rule: Calendar days are counted from the day after the offered_date, the last day of the window being the last day of the count.
          boundary: inclusive
      - id: down_payment_posted
        applies_to: [arrange_accept]
        kind: authorization
        condition: The down payment, less any pledge counted toward it, must have posted on the service account through one of the down_payment_channels on or after the offered_date before the acceptance is recorded.
        evidence_fields: [service_payments.service_account_id, service_payments.payment_date, service_payments.amount, service_payments.payment_channel]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_payments.service_account_id]
          action_bindings:
            service_payments.service_account_id: service_account_id
    params:
      per_tier:
        Standard Deferred Payment Agreement: {acceptance_window_days: "=acceptance_window_days", notice_cleared_on_acceptance: "=notice_cleared_on_acceptance", reconnect_on_acceptance: "=reconnect_on_acceptance"}
        Extended Hardship Payment Agreement: {acceptance_window_days: "=acceptance_window_days", notice_cleared_on_acceptance: "=notice_cleared_on_acceptance", reconnect_on_acceptance: "=reconnect_on_acceptance"}
        Winter Protection Payment Agreement: {acceptance_window_days: "=acceptance_window_days", notice_cleared_on_acceptance: "=notice_cleared_on_acceptance", reconnect_on_acceptance: "=reconnect_on_acceptance"}
        Medical Certificate Payment Agreement: {acceptance_window_days: "=acceptance_window_days", notice_cleared_on_acceptance: "=notice_cleared_on_acceptance", reconnect_on_acceptance: "=reconnect_on_acceptance"}
        Agricultural Harvest Payment Agreement: {acceptance_window_days: "=acceptance_window_days", notice_cleared_on_acceptance: "=notice_cleared_on_acceptance", reconnect_on_acceptance: "=reconnect_on_acceptance"}
        Commercial Installment Agreement: {acceptance_window_days: "=acceptance_window_days", notice_cleared_on_acceptance: "=notice_cleared_on_acceptance", reconnect_on_acceptance: "=reconnect_on_acceptance"}
  - id: arrange_evt_installments
    subject: [arrange_installment_bill]
    rule: >-
      Installments are billed only while the agreement is in active status, one per billing period from the first installment
      period until the installment_count is reached, the last installment being whatever remains of the arranged balance. A
      billed installment is part of that bill's charges: late_charge_on_missed_installment being true, an installment unpaid
      past the due date bears the ordinary late charge, while late_charges_on_arranged_balance being false, the unbilled
      balance never does. A payment above the bill due is applied under extra_payment_application.
      Each installment is computed under installment_rounding_rule. Where disconnect_hold_while_active is true, the arranged
      amount is never the ground for a disconnection while the agreement is active and no installment is missed.
    eligibility:
      - id: agreement_active
        applies_to: [arrange_installment_bill]
        kind: state
        condition: Installments are billed only while the agreement is in active status, one per billing period from the first installment period until the installment_count is reached, the last installment being whatever remains of the arranged balance.
        evidence_fields: [arrangements.status, arrangements.arrangement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [arrangements.arrangement_id]
          action_bindings:
            arrangements.arrangement_id: arrangement_id
        state_contract:
          field: arrangements.status
          allowed: [active]
  - id: arrange_evt_default
    subject: [arrange_installment_missed, arrange_default, arrange_balance_rebill]
    rule: >-
      An installment counts as missed when the installment, together with the current charges of the same bill where
      current_bill_must_be_paid is true, is not paid in full within missed_installment_grace_days calendar days after that
      bill's due date. When arrange_msr_missed_installments reaches missed_installments_before_default the agreement defaults:
      the unbilled arranged balance is billed back at once with rebill_reason default and is due default_rebill_due_days
      after the default date. Where disconnect_without_new_notice_on_default is true and the account was under a disconnect
      notice when the agreement was accepted, the account may be disconnected on that notice without a new notice period;
      otherwise collection restarts under the Electric Service charter. A defaulted agreement is never reinstated, and it
      counts against later offers under arrange_agg_member_history.
    eligibility: []
    params:
      per_tier:
        Standard Deferred Payment Agreement: {missed_installment_grace_days: "=missed_installment_grace_days", missed_installments_before_default: "=missed_installments_before_default", default_rebill_due_days: "=default_rebill_due_days", disconnect_without_new_notice_on_default: "=disconnect_without_new_notice_on_default"}
        Extended Hardship Payment Agreement: {missed_installment_grace_days: "=missed_installment_grace_days", missed_installments_before_default: "=missed_installments_before_default", default_rebill_due_days: "=default_rebill_due_days", disconnect_without_new_notice_on_default: "=disconnect_without_new_notice_on_default"}
        Winter Protection Payment Agreement: {missed_installment_grace_days: "=missed_installment_grace_days", missed_installments_before_default: "=missed_installments_before_default", default_rebill_due_days: "=default_rebill_due_days", disconnect_without_new_notice_on_default: "=disconnect_without_new_notice_on_default"}
        Medical Certificate Payment Agreement: {missed_installment_grace_days: "=missed_installment_grace_days", missed_installments_before_default: "=missed_installments_before_default", default_rebill_due_days: "=default_rebill_due_days", disconnect_without_new_notice_on_default: "=disconnect_without_new_notice_on_default"}
        Agricultural Harvest Payment Agreement: {missed_installment_grace_days: "=missed_installment_grace_days", missed_installments_before_default: "=missed_installments_before_default", default_rebill_due_days: "=default_rebill_due_days", disconnect_without_new_notice_on_default: "=disconnect_without_new_notice_on_default"}
        Commercial Installment Agreement: {missed_installment_grace_days: "=missed_installment_grace_days", missed_installments_before_default: "=missed_installments_before_default", default_rebill_due_days: "=default_rebill_due_days", disconnect_without_new_notice_on_default: "=disconnect_without_new_notice_on_default"}
    measures: [arrange_msr_missed_installments]
  - id: arrange_evt_completion
    subject: [arrange_complete, arrange_balance_rebill]
    rule: >-
      An agreement is completed when its last installment has been billed and the arranged balance is zero. Where
      early_payoff_allowed is true the member may pay off the agreement at any time: the unbilled balance is billed back with
      rebill_reason early_payoff, the early_payoff_fee where above zero is billed as a service fee, and the agreement is
      completed on the same day. A completed agreement leaves no hold on disconnection for later bills.
    eligibility: []
  - id: arrange_evt_termination
    subject: [arrange_terminate, arrange_balance_rebill]
    rule: >-
      An active agreement is terminated when its service account is final billed (termination_reason final_bill) or enrolls in
      PrePay Power (termination_reason prepay_enrollment). The unbilled balance is billed back on the service account with the
      same reason; on a PrePay Power enrollment it then forms part of the arrears transferred under the PrePay Power charter,
      and on a final bill it becomes part of the final balance. A termination is not a default and does not count against
      later offers.
    eligibility: []


extended_policies:
  - id: arrange_ext_missed_installment_amount
    base_policy_refs: [arrange_evt_default]
    overwrite:
      - base_policy: arrange_evt_default
        superseded_clause: >-
          An installment counts as missed when the installment, together with the current charges of the same
          bill where current_bill_must_be_paid is true, is not paid in full within missed_installment_grace_days
          calendar days after that bill's due date.
        replaced_by: >-
          An installment counts as missed when the installment and the current charges tested with it are not
          covered in full by the payments credited and the pledge credit described here, and the miss is recorded
          on a day after the grace period of missed_installment_grace_days calendar days following that bill's due
          date has ended.
    trigger: state_due
    subject: [arrange_installment_missed]
    computes: amount
    target_tool: book_missed_installment_8c48d67e
    params:
      strict_late_count: 3
      pledge_share_proven: 1.0
      pledge_share_first: 0.5
      recent_certificate_days: 30
      medical_recent_share: 0.5
      medical_share: 0.75
      long_tenure_months: 300
      shortfall_allowance_long: 20.0
      shortfall_allowance_short: 10.0
    rule: >-
      An installment counts as missed when the installment and the current charges tested with it are not
      covered in full by the payments credited and the pledge credit described here, and the miss is recorded on
      a day after the grace period of missed_installment_grace_days calendar days following that bill's due date
      has ended. The installment tested is the latest installment billed on the agreement whose grace period has
      ended: the latest installment billed where more than the schedule's bill_due_days plus
      missed_installment_grace_days calendar days have passed since its bill date, otherwise the installment
      billed immediately before it; its amount and billing period are those of its installment-billed entry on
      the agreement's ledger. The current charges tested are the usage lines billed on the service account for that
      same billing period. All of the current charges tested enter the missed amount. The payments credited are
      the payments posted to the service account in the month ending on the day the miss is recorded, taken as
      posted. The energy assistance pledges counted are the pledges recorded on the service account in the month
      ending on the day the miss is recorded, and no part of a counted pledge is credited. No shortfall allowance
      is deducted. The missed amount is the installment plus the current charges that enter it, less the payments
      credited, less the pledge credit and less the shortfall allowance, never below zero, rounded half up to the
      cent once at the end. Which bill lines make up the current charges tested follows the late payment record
      of the service account: where the service account was billed strict_late_count or more late payment
      charges in the twelve months ending on the day the miss is recorded, the current charges tested are the
      usage lines plus the service fees and the late payment charge billed for that billing period; where it was
      billed at least one but fewer than strict_late_count, they are the usage lines plus the service fees billed
      for that billing period; where it was billed none, they are the usage lines alone. How much of the current
      charges tested enters the missed amount follows medical certificate protection: where the service account
      carries an unexpired medical certificate on the day the miss is recorded and the latest certificate was
      received within recent_certificate_days calendar days before that day, the current charges tested enter at
      medical_recent_share of their amount; where it carries an unexpired medical certificate but no certificate
      received within those days, they enter at medical_share of their amount; where it carries no unexpired medical certificate,
      they enter in full. How payments are credited follows the account's payment record: where the service
      account is on cash-only status on the day the miss is recorded, only payments posted through office cash,
      money order, online card, phone card and payment kiosk are credited; where it is not on cash-only status
      and a returned payment was posted in the same month, the payments credited are the payments posted less
      the amounts returned; where neither holds, payments are credited as posted. Which pledges are counted
      follows the household's circumstances: where the service account carries an unexpired medical certificate
      on the day the miss is recorded, the pledges counted are those recorded in the three months ending on that
      day; where it carries no unexpired medical certificate but an outstanding disconnect notice, those recorded
      in the two months ending on that day; where neither holds, those recorded in the month ending on that day.
      How much of the counted pledges is credited follows the agencies' record on the account: where pledges are
      counted and the service account received at least one energy assistance agency payment in the twelve
      months ending on the day the miss is recorded, the counted pledges are credited at pledge_share_proven of
      their amount; where pledges are counted and the account received no energy assistance agency payment in
      those twelve months, they are credited at pledge_share_first of their amount; where no pledge is counted,
      nothing is credited. The shortfall allowance follows the member's standing: where the agreement carries no
      earlier missed-installment entry and the member's capital credit account in the patron class of the service account's rate
      schedule has been open at least long_tenure_months calendar months on the day the miss is recorded, shortfall_allowance_long is deducted;
      where the agreement carries no earlier missed-installment entry and the capital credit account has been open
      fewer months or the member holds none, shortfall_allowance_short is deducted; where the agreement already
      carries a missed-installment entry, nothing is deducted.
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [service_accounts.medical_certificate_expires, service_accounts.cash_only_until, service_accounts.disconnect_notice_date, service_charges.amount, service_payments.amount, service_certificates.received_date]
        note: The current-charge, payment, pledge and medical factors are decided from the member's electric service account, its bill lines, payments, pledges and certificates.
      - category: capital
        as: branch
        reads: [opened_date]
        note: The shortfall allowance tier is decided from how long the member's capital credit account has been open.
    compute:
      - billed_count: "COUNT('arrange_ledger', event_type='arrange_installment_bill')"
      - latest_bill_date: "LATEST('arrange_ledger', 'entry_date', date_field='entry_date', event_type='arrange_installment_bill', installment_number=billed_count) or NOW"
      - tested_number: "billed_count if DAYS(latest_bill_date, NOW) > CPARAM('service', 'bill_due_days', service_account_id=F('service_account_id')) + P('missed_installment_grace_days') else billed_count - 1"
      - tested_period: "LATEST('arrange_ledger', 'billing_period', date_field='entry_date', event_type='arrange_installment_bill', installment_number=tested_number)"
      - installment_tested: "SUM('arrange_ledger', 'amount', event_type='arrange_installment_bill', installment_number=tested_number)"
      - usage_lines: "XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_usage_charge', billing_period=tested_period)"
      - fee_lines: "XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_fee', billing_period=tested_period)"
      - late_lines: "XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_late_charge', billing_period=tested_period)"
      - late_count_12m: "XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_late_charge')"
      - current_tested: "usage_lines + fee_lines + late_lines if late_count_12m >= K('strict_late_count') else (usage_lines + fee_lines if late_count_12m >= 1 else usage_lines)"
      - certificate_expires: "CFIELD('service', 'medical_certificate_expires', service_account_id=F('service_account_id')) or ''"
      - certificate_received: "XLATEST('service', 'service_certificates', 'received_date', date_field='received_date', service_account_id=F('service_account_id')) or '0000-01-01'"
      - current_share: "K('medical_recent_share') if (certificate_expires >= NOW and DAYS(certificate_received, NOW) <= K('recent_certificate_days')) else (K('medical_share') if certificate_expires >= NOW else 1)"
      - cash_only: "(CFIELD('service', 'cash_only_until', service_account_id=F('service_account_id')) or '') >= NOW"
      - payments_posted: "XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment')"
      - returns_posted: "XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment_return')"
      - payments_cash_channels: "XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='office_cash') + XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='money_order') + XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='online_card') + XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='phone_ivr_card') + XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='payment_kiosk')"
      - payments_credited: "payments_cash_channels if cash_only else (payments_posted - returns_posted if returns_posted > 0 else payments_posted)"
      - notice_outstanding: "(CFIELD('service', 'disconnect_notice_date', service_account_id=F('service_account_id')) or '') != ''"
      - pledge_months: "3 if certificate_expires >= NOW else (2 if (certificate_expires < NOW and notice_outstanding) else 1)"
      - pledges_counted: "XSUM('service', 'service_payments', 'amount', within_months=pledge_months, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_assistance_pledge')"
      - agency_payments_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='energy_assistance_agency')"
      - pledge_share: "K('pledge_share_proven') if (pledges_counted > 0 and agency_payments_12m >= 1) else (K('pledge_share_first') if (pledges_counted > 0 and agency_payments_12m == 0) else 0)"
      - earlier_misses: "COUNT('arrange_ledger', event_type='arrange_installment_missed')"
      - capital_open_months: "MONTHS(CFIELD('capital', 'opened_date', variant_name=CPARAM('service', 'capital_patron_class', service_account_id=F('service_account_id'))) or NOW, NOW)"
      - shortfall_allowance: "K('shortfall_allowance_long') if (earlier_misses == 0 and capital_open_months >= K('long_tenure_months')) else (K('shortfall_allowance_short') if (earlier_misses == 0 and capital_open_months < K('long_tenure_months')) else 0)"
      - result: "int(MX(0, installment_tested + current_tested * current_share - payments_credited - pledges_counted * pledge_share - shortfall_allowance) * 100 + 0.5 + 0.000001) / 100"
    compute_basis:
      billed_count: "The installment tested is the latest installment billed on the agreement whose grace period has ended"
      latest_bill_date: "where more than the schedule's bill_due_days plus missed_installment_grace_days calendar days have passed since its bill date"
      tested_number: "the latest installment billed where more than the schedule's bill_due_days plus missed_installment_grace_days calendar days have passed since its bill date, otherwise the installment billed immediately before it"
      tested_period: "its amount and billing period are those of its installment-billed entry on the agreement's ledger"
      installment_tested: "its amount and billing period are those of its installment-billed entry on the agreement's ledger"
      usage_lines: "The current charges tested are the usage lines billed on the service account for that same billing period."
      fee_lines: "they are the usage lines plus the service fees billed for that billing period"
      late_lines: "the current charges tested are the usage lines plus the service fees and the late payment charge billed for that billing period"
      late_count_12m: "where the service account was billed strict_late_count or more late payment charges in the twelve months ending on the day the miss is recorded"
      current_tested: "where the service account was billed strict_late_count or more late payment charges in the twelve months ending on the day the miss is recorded, the current charges tested are the usage lines plus the service fees and the late payment charge billed for that billing period; where it was billed at least one but fewer than strict_late_count, they are the usage lines plus the service fees billed for that billing period; where it was billed none, they are the usage lines alone."
      certificate_expires: "where the service account carries an unexpired medical certificate on the day the miss is recorded"
      certificate_received: "the latest certificate was received within recent_certificate_days calendar days before that day"
      current_share: "where the service account carries an unexpired medical certificate on the day the miss is recorded and the latest certificate was received within recent_certificate_days calendar days before that day, the current charges tested enter at medical_recent_share of their amount; where it carries an unexpired medical certificate but no certificate received within those days, they enter at medical_share of their amount; where it carries no unexpired medical certificate, they enter in full."
      cash_only: "where the service account is on cash-only status on the day the miss is recorded"
      payments_posted: "The payments credited are the payments posted to the service account in the month ending on the day the miss is recorded, taken as posted."
      returns_posted: "a returned payment was posted in the same month, the payments credited are the payments posted less the amounts returned"
      payments_cash_channels: "only payments posted through office cash, money order, online card, phone card and payment kiosk are credited"
      payments_credited: "where the service account is on cash-only status on the day the miss is recorded, only payments posted through office cash, money order, online card, phone card and payment kiosk are credited; where it is not on cash-only status and a returned payment was posted in the same month, the payments credited are the payments posted less the amounts returned; where neither holds, payments are credited as posted."
      notice_outstanding: "where it carries no unexpired medical certificate but an outstanding disconnect notice"
      pledge_months: "where the service account carries an unexpired medical certificate on the day the miss is recorded, the pledges counted are those recorded in the three months ending on that day; where it carries no unexpired medical certificate but an outstanding disconnect notice, those recorded in the two months ending on that day; where neither holds, those recorded in the month ending on that day."
      pledges_counted: "The energy assistance pledges counted are the pledges recorded on the service account in the month ending on the day the miss is recorded"
      agency_payments_12m: "the service account received at least one energy assistance agency payment in the twelve months ending on the day the miss is recorded"
      pledge_share: "where pledges are counted and the service account received at least one energy assistance agency payment in the twelve months ending on the day the miss is recorded, the counted pledges are credited at pledge_share_proven of their amount; where pledges are counted and the account received no energy assistance agency payment in those twelve months, they are credited at pledge_share_first of their amount; where no pledge is counted, nothing is credited."
      earlier_misses: "where the agreement carries no earlier missed-installment entry"
      capital_open_months: "the member's capital credit account in the patron class of the service account's rate schedule has been open at least long_tenure_months calendar months on the day the miss is recorded"
      shortfall_allowance: "where the agreement carries no earlier missed-installment entry and the member's capital credit account in the patron class of the service account's rate schedule has been open at least long_tenure_months calendar months on the day the miss is recorded, shortfall_allowance_long is deducted; where the agreement carries no earlier missed-installment entry and the capital credit account has been open fewer months or the member holds none, shortfall_allowance_short is deducted; where the agreement already carries a missed-installment entry, nothing is deducted."
      result: "The missed amount is the installment plus the current charges that enter it, less the payments credited, less the pledge credit and less the shortfall allowance, never below zero, rounded half up to the cent once at the end."
    factors:
      - id: current_lines_by_late_record
        effect: method
        decides: current_tested
        bindings: [late_count_12m, current_tested]
        ladder:
          - when: "the service account was billed strict_late_count or more late payment charges in the twelve months ending on the day the miss is recorded"
            method: "the current charges tested are the usage lines plus the service fees and the late payment charge billed for the tested billing period"
          - when: "it was billed at least one but fewer than strict_late_count late payment charges in those twelve months"
            method: "the current charges tested are the usage lines plus the service fees billed for the tested billing period"
          - when: "otherwise (no late payment charge in those twelve months)"
            method: "the current charges tested are the usage lines alone"
        baseline:
          current_tested: "usage_lines"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: medical_protection_share
        effect: parameter
        decides: current_share
        bindings: [certificate_expires, certificate_received, current_share]
        ladder:
          - when: "an unexpired medical certificate on the day the miss is recorded and the latest certificate received within recent_certificate_days calendar days before that day"
            value: "K('medical_recent_share')"
          - when: "an unexpired medical certificate but no certificate received within those days"
            value: "K('medical_share')"
          - when: "otherwise (no unexpired medical certificate)"
            value: "1"
        baseline:
          current_share: "1"
        evidence: [date, cross_category]
        cross_difficulty: service
      - id: payment_crediting_by_record
        effect: method
        decides: payments_credited
        bindings: [cash_only, payments_posted, returns_posted, payments_cash_channels, payments_credited]
        ladder:
          - when: "the service account is on cash-only status on the day the miss is recorded"
            method: "only payments posted in the month through office cash, money order, online card, phone card and payment kiosk are credited"
          - when: "it is not on cash-only status and a returned payment was posted in the same month"
            method: "the payments posted in the month less the amounts returned are credited"
          - when: "otherwise"
            method: "the payments posted in the month are credited as posted"
        baseline:
          payments_credited: "payments_posted"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: pledge_lookback_by_circumstance
        effect: parameter
        decides: pledge_months
        bindings: [notice_outstanding, pledge_months]
        ladder:
          - when: "an unexpired medical certificate on the day the miss is recorded"
            value: "a lookback of 3 months"
          - when: "no unexpired medical certificate but an outstanding disconnect notice"
            value: "a lookback of 2 months"
          - when: "otherwise"
            value: "a lookback of 1 month"
        baseline:
          pledge_months: "1"
        evidence: [date, cross_category]
        cross_difficulty: service
      - id: pledge_credit_by_agency_record
        effect: parameter
        decides: pledge_share
        bindings: [pledges_counted, agency_payments_12m, pledge_share]
        ladder:
          - when: "pledges are counted and the service account received at least one energy assistance agency payment in the twelve months ending on the day the miss is recorded"
            value: "K('pledge_share_proven')"
          - when: "pledges are counted and the account received no energy assistance agency payment in those twelve months"
            value: "K('pledge_share_first')"
          - when: "otherwise (no pledge counted)"
            value: "0"
        baseline:
          pledge_share: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: shortfall_allowance_by_standing
        effect: parameter
        decides: shortfall_allowance
        bindings: [earlier_misses, capital_open_months, shortfall_allowance]
        ladder:
          - when: "the agreement carries no earlier missed-installment entry and the member's capital credit account has been open at least long_tenure_months calendar months"
            value: "K('shortfall_allowance_long')"
          - when: "the agreement carries no earlier missed-installment entry and the capital credit account has been open fewer months or the member holds none"
            value: "K('shortfall_allowance_short')"
          - when: "otherwise (the agreement already carries a missed-installment entry)"
            value: "0"
        baseline:
          shortfall_allowance: "0"
        evidence: [history, cross_category]
        cross_difficulty: capital
    baseline:
      rule: >-
        The installment tested is the latest installment billed on the agreement whose grace period has ended: the
        latest installment billed where more than the schedule's bill_due_days plus missed_installment_grace_days
        calendar days have passed since its bill date, otherwise the installment billed immediately before it; its
        amount and billing period are those of its installment-billed entry on the agreement's ledger. The current charges tested are the usage lines billed on the service account for that same billing
        period. All of the current charges tested enter the missed amount. The payments credited are the payments
        posted to the service account in the month ending on the day the miss is recorded, taken as posted. The
        energy assistance pledges counted are the pledges recorded on the service account in the month ending on
        the day the miss is recorded, and no part of a counted pledge is credited. No shortfall allowance is
        deducted. The missed amount is the installment plus the current charges that enter it, less the payments
        credited, less the pledge credit and less the shortfall allowance, never below zero, rounded half up to the
        cent once at the end.
      params: []
    inputs:
      history:
        - {table: arrange_ledger, aggregate: count, field: arrange_entry_id, filters: {event_type: arrange_installment_bill}}
        - {table: arrange_ledger, aggregate: sum, field: amount, filters: {event_type: arrange_installment_bill}}
        - {category: service, table: service_charges, aggregate: sum, field: amount, filters: {event_type: service_usage_charge}}
        - {category: service, table: service_charges, aggregate: count, field: charge_id, within_months: 12, filters: {event_type: service_late_charge}}
        - {category: service, table: service_payments, aggregate: sum, field: amount, within_months: 1, filters: {event_type: service_payment}}
        - {category: service, table: service_payments, aggregate: sum, field: amount, filters: {event_type: service_assistance_pledge}}
      cross_category: [service, capital]
  - id: arrange_ext_early_payoff_balance
    base_policy_refs: [arrange_evt_completion, arrange_evt_default, arrange_evt_termination]
    overwrite:
      - base_policy: arrange_evt_completion
        superseded_clause: >-
          Where early_payoff_allowed is true the member may pay off the agreement at any time: the unbilled balance
          is billed back with rebill_reason early_payoff, the early_payoff_fee where above zero is billed as a
          service fee, and the agreement is completed on the same day.
        replaced_by: >-
          The balance billed back is the unbilled balance less the part of the credits applied that remains after
          the arrears covered first, never below zero, rounded half up to the cent once at the end.
    trigger: on_request
    subject: [arrange_balance_rebill, arrange_complete]
    computes: payoff_amount
    target_tool: pay_off_payment_agreement_d76d2954
    params:
      long_tenure_months: 300
      capital_share_long: 1.0
      capital_share_short: 0.5
      deposit_settled_months: 24
      deposit_share_settled: 1.0
      deposit_share_recent: 0.5
      credit_months_notice: 12
      credit_months_medical: 11
    rule: >-
      Where early_payoff_allowed is true the member may pay off a running agreement at any time; the balance is
      billed back with rebill_reason early_payoff, the early_payoff_fee where above zero is billed as a service
      fee, and the agreement is completed on the same day. The balance billed back on an early payoff is fixed
      only after every installment of the agreement whose grace period has ended unpaid carries a
      missed-installment entry on the agreement's ledger. The unbilled balance is the amount moved into the
      agreement less every installment billed and every amount already billed back, as the agreement's ledger
      records them. Before any credit reduces the payoff, nothing on the account is covered first. The credits
      considered are the bill credits posted to the service account in the month ending on the payoff day. No credit standing on the service account is applied to the payoff. The balance billed back is the unbilled
      balance less the part of the credits applied that remains after the arrears covered first, never below
      zero, rounded half up to the cent once at the end. What is covered first follows the account's arrears:
      where a missed-installment entry was recorded on the agreement in the month ending on the payoff day and the
      service account carries an outstanding disconnect notice, the arrears covered first are the larger of the
      past-due amount on the notice and the missed amounts recorded in that month; where a missed-installment
      entry was recorded in that month and no disconnect notice is outstanding, they are the missed amounts
      recorded in that month; where no missed-installment entry was recorded in that month, nothing is covered
      first. How far back credits are considered follows the household's circumstances: where the service account
      carries an unexpired medical certificate on the payoff day and an outstanding disconnect notice, the bill
      credits posted in the credit_months_notice months ending on the payoff day are considered; where it carries
      an unexpired medical certificate and no outstanding disconnect notice, those posted in the
      credit_months_medical months ending on the payoff day; where it carries no unexpired medical certificate,
      those posted in the month ending on the payoff day. Capital credit retirement credits among the credits
      considered are applied at capital_share_long of their amount where the member's capital credit account in the patron
      class of the service account's rate schedule is active and has been open at least long_tenure_months calendar
      months on the payoff day, at
      capital_share_short of their amount where it is active and has been open fewer months, and not at all where
      the member holds no active capital credit account. Deposit interest credits among the credits considered are
      applied at deposit_share_settled of their amount where the security deposit on the service account is held
      and was paid in full at least deposit_settled_months calendar months before the payoff day, at
      deposit_share_recent of their amount where it is held and was paid in full more recently, and not at all
      where no deposit is held on the service account.
    prerequisite:
      - problem: arrange_ext_missed_installment_amount
        kind: value_input
        gate: missed_month
        form: state
        policy_source: >-
          The balance billed back on an early payoff is fixed only after every installment of the agreement whose
          grace period has ended unpaid carries a missed-installment entry on the agreement's ledger.
        condition: >-
          Every installment-billed entry of the agreement whose bill's due date plus missed_installment_grace_days
          has passed unpaid has a matching arrange_installment_missed entry on arrange_ledger at payoff handling time.
        resolved_by: book_missed_installment_8c48d67e
        effect: >-
          Once the missed-installment entry is recorded, missed_month carries its unpaid amount, the credits first
          cover that amount, and the balance billed back rises by the part of the credits it absorbs.
    cross_category:
      - category: service
        as: history
        reads: [service_accounts.disconnect_past_due_amount, service_accounts.disconnect_notice_date, service_accounts.medical_certificate_expires, service_charges.amount]
        note: The arrears-first order and the credit window are decided from the service account's notice, medical protection and the bill credits posted in the window.
      - category: capital
        as: branch
        reads: [status, opened_date]
        note: The capital credit share is decided from the member's capital credit account status and how long it has been open.
      - category: deposit
        as: branch
        reads: [status, paid_in_full_date]
        note: The deposit interest share is decided from the deposit record on the service account and when it was paid in full.
    compute:
      - transfers_in: "SUM('arrange_ledger', 'amount', event_type='arrange_balance_transfer')"
      - installments_out: "SUM('arrange_ledger', 'amount', event_type='arrange_installment_bill')"
      - rebills_out: "SUM('arrange_ledger', 'amount', event_type='arrange_balance_rebill')"
      - unbilled: "transfers_in - installments_out - rebills_out"
      - missed_month: "SUM('arrange_ledger', 'amount', within_months=1, date_field='entry_date', event_type='arrange_installment_missed')"
      - notice_amount: "CFIELD('service', 'disconnect_past_due_amount', service_account_id=F('service_account_id')) or 0"
      - notice_open: "(CFIELD('service', 'disconnect_notice_date', service_account_id=F('service_account_id')) or '') != ''"
      - arrears_first: "MX(notice_amount, missed_month) if (missed_month > 0 and notice_open) else (missed_month if missed_month > 0 else 0)"
      - payoff_certificate_expires: "CFIELD('service', 'medical_certificate_expires', service_account_id=F('service_account_id')) or ''"
      - credit_months: "K('credit_months_notice') if (payoff_certificate_expires >= NOW and notice_open) else (K('credit_months_medical') if (payoff_certificate_expires >= NOW and not notice_open) else 1)"
      - capital_considered: "XSUM('service', 'service_charges', 'amount', within_months=credit_months, date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_bill_credit', credit_reason='capital_credit_retirement')"
      - deposit_considered: "XSUM('service', 'service_charges', 'amount', within_months=credit_months, date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_bill_credit', credit_reason='deposit_interest')"
      - capital_status: "CFIELD('capital', 'status', variant_name=CPARAM('service', 'capital_patron_class', service_account_id=F('service_account_id'))) or ''"
      - payoff_capital_months: "MONTHS(CFIELD('capital', 'opened_date', variant_name=CPARAM('service', 'capital_patron_class', service_account_id=F('service_account_id'))) or NOW, NOW)"
      - capital_share: "K('capital_share_long') if (capital_status == 'active' and payoff_capital_months >= K('long_tenure_months')) else (K('capital_share_short') if (capital_status == 'active' and payoff_capital_months < K('long_tenure_months')) else 0)"
      - deposit_status: "CFIELD('deposit', 'status', service_account_id=F('service_account_id')) or ''"
      - deposit_paid_months: "MONTHS(CFIELD('deposit', 'paid_in_full_date', service_account_id=F('service_account_id')) or NOW, NOW)"
      - deposit_share: "K('deposit_share_settled') if (deposit_status == 'held' and deposit_paid_months >= K('deposit_settled_months')) else (K('deposit_share_recent') if (deposit_status == 'held' and deposit_paid_months < K('deposit_settled_months')) else 0)"
      - credits_applied: "capital_considered * capital_share + deposit_considered * deposit_share"
      - result: "int(MX(0, unbilled - MX(0, credits_applied - arrears_first)) * 100 + 0.5 + 0.000001) / 100"
    compute_basis:
      transfers_in: "The unbilled balance is the amount moved into the agreement less every installment billed and every amount already billed back, as the agreement's ledger records them."
      installments_out: "less every installment billed"
      rebills_out: "every amount already billed back"
      unbilled: "The unbilled balance is the amount moved into the agreement less every installment billed and every amount already billed back"
      missed_month: "where a missed-installment entry was recorded on the agreement in the month ending on the payoff day"
      notice_amount: "the larger of the past-due amount on the notice and the missed amounts recorded in that month"
      notice_open: "the service account carries an outstanding disconnect notice"
      arrears_first: "where a missed-installment entry was recorded on the agreement in the month ending on the payoff day and the service account carries an outstanding disconnect notice, the arrears covered first are the larger of the past-due amount on the notice and the missed amounts recorded in that month; where a missed-installment entry was recorded in that month and no disconnect notice is outstanding, they are the missed amounts recorded in that month; where no missed-installment entry was recorded in that month, nothing is covered first."
      payoff_certificate_expires: "where it carries an unexpired medical certificate and no outstanding disconnect notice"
      credit_months: "where the service account carries an unexpired medical certificate on the payoff day and an outstanding disconnect notice, the bill credits posted in the credit_months_notice months ending on the payoff day are considered; where it carries an unexpired medical certificate and no outstanding disconnect notice, those posted in the credit_months_medical months ending on the payoff day; where it carries no unexpired medical certificate, those posted in the month ending on the payoff day."
      capital_considered: "Capital credit retirement credits among the credits considered"
      deposit_considered: "Deposit interest credits among the credits considered"
      capital_status: "where the member's capital credit account in the patron class of the service account's rate schedule is active"
      payoff_capital_months: "has been open at least long_tenure_months calendar months on the payoff day"
      capital_share: "Capital credit retirement credits among the credits considered are applied at capital_share_long of their amount where the member's capital credit account in the patron class of the service account's rate schedule is active and has been open at least long_tenure_months calendar months on the payoff day, at capital_share_short of their amount where it is active and has been open fewer months, and not at all where the member holds no active capital credit account."
      deposit_status: "where the security deposit on the service account is held"
      deposit_paid_months: "was paid in full at least deposit_settled_months calendar months before the payoff day"
      deposit_share: "Deposit interest credits among the credits considered are applied at deposit_share_settled of their amount where the security deposit on the service account is held and was paid in full at least deposit_settled_months calendar months before the payoff day, at deposit_share_recent of their amount where it is held and was paid in full more recently, and not at all where no deposit is held on the service account."
      credits_applied: "No credit standing on the service account is applied to the payoff."
      result: "The balance billed back is the unbilled balance less the part of the credits applied that remains after the arrears covered first, never below zero, rounded half up to the cent once at the end."
    factors:
      - id: arrears_covered_first
        effect: method
        decides: arrears_first
        bindings: [missed_month, notice_amount, notice_open, arrears_first]
        ladder:
          - when: "a missed-installment entry recorded on the agreement in the month ending on the payoff day and an outstanding disconnect notice on the service account"
            method: "the credits first cover the larger of the past-due amount on the notice and the missed amounts recorded in that month"
          - when: "a missed-installment entry recorded in that month and no outstanding disconnect notice"
            method: "the credits first cover the missed amounts recorded in that month"
          - when: "otherwise (no missed-installment entry recorded in that month)"
            method: "nothing is covered first and the credits go straight to the payoff"
        baseline:
          arrears_first: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: credit_window_by_circumstance
        effect: parameter
        decides: credit_months
        bindings: [payoff_certificate_expires, credit_months, capital_considered, deposit_considered]
        ladder:
          - when: "an unexpired medical certificate on the payoff day and an outstanding disconnect notice"
            value: "K('credit_months_notice') months of bill credits"
          - when: "an unexpired medical certificate and no outstanding disconnect notice"
            value: "K('credit_months_medical') months of bill credits"
          - when: "otherwise (no unexpired medical certificate)"
            value: "1 month of bill credits"
        baseline:
          credit_months: "1"
        evidence: [history, date, cross_category]
        cross_difficulty: service
      - id: capital_credit_share
        effect: parameter
        decides: capital_share
        bindings: [capital_status, payoff_capital_months, capital_share]
        ladder:
          - when: "the member's capital credit account is active and has been open at least long_tenure_months calendar months"
            value: "K('capital_share_long')"
          - when: "the capital credit account is active and has been open fewer months"
            value: "K('capital_share_short')"
          - when: "otherwise (no active capital credit account)"
            value: "0"
        baseline:
          capital_share: "0"
        evidence: [date, cross_category]
        cross_difficulty: capital
      - id: deposit_interest_share
        effect: parameter
        decides: deposit_share
        bindings: [deposit_status, deposit_paid_months, deposit_share]
        ladder:
          - when: "the security deposit on the service account is held and was paid in full at least deposit_settled_months calendar months before the payoff day"
            value: "K('deposit_share_settled')"
          - when: "the deposit is held and was paid in full more recently"
            value: "K('deposit_share_recent')"
          - when: "otherwise (no deposit held on the service account)"
            value: "0"
        baseline:
          deposit_share: "0"
        evidence: [date, cross_category]
        cross_difficulty: deposit
    baseline:
      rule: >-
        The unbilled balance is the amount moved into the agreement less every installment billed and every amount
        already billed back, as the agreement's ledger records them. Before any credit reduces the payoff, nothing
        on the account is covered first. The credits considered are the bill credits posted to the service account in
        the month ending on the payoff day. No credit standing on the service account is applied to
        the payoff. The balance billed back is the unbilled balance less the part of the credits applied that
        remains after the arrears covered first, never below zero, rounded half up to the cent once at the end.
      params: []
    inputs:
      history:
        - {table: arrange_ledger, aggregate: sum, field: amount, filters: {event_type: arrange_balance_transfer}}
        - {table: arrange_ledger, aggregate: sum, field: amount, filters: {event_type: arrange_installment_bill}}
        - {table: arrange_ledger, aggregate: sum, field: amount, within_months: 1, filters: {event_type: arrange_installment_missed}}
        - {category: service, table: service_charges, aggregate: sum, field: amount, filters: {event_type: service_bill_credit}}
      cross_category: [service, capital, deposit]
  - id: arrange_ext_installment_billed_amount
    base_policy_refs: [arrange_evt_installments]
    overwrite:
      - base_policy: arrange_evt_installments
        superseded_clause: >-
          A payment above the bill due is applied under extra_payment_application.
        replaced_by: >-
          How much of the payment above the previous bill is applied to the installment follows how the latest
          payment was made
    trigger: state_due
    subject: [arrange_installment_bill]
    computes: amount
    target_tool: bill_agreement_installment_2bd16d35
    params:
      roundup_share: 1.0
      agency_share: 0.5
      uncleared_returned_share: 0.5
      uncleared_share: 0.75
    rule: >-
      While an agreement is active, its next installment is billed on each bill issued for the service account,
      and the installment amount billed on a bill is worked out as follows. The installment scheduled is the
      agreement's installment amount, never more than the unbilled balance, and where the installment being
      billed is the last of the installment count it is the whole unbilled balance. The previous bill is the
      bill that carried the latest installment already billed on the agreement, and the charges it required are
      its usage lines and that installment. The payments credited toward the previous bill are the payments posted
      to the service account in the month ending on the bill date, as posted. No energy assistance pledge counts
      toward the previous bill. A payment above what the previous bill required is applied in full to the
      installment being billed. The installment billed is the installment scheduled less the payment above the
      previous bill that is applied to it, never below zero, rounded half up to the cent once at the end. The
      charges the previous bill required follow its record: where the previous installment carries a
      missed-installment entry and the service account was billed a late payment charge in the three months
      ending on the bill date, they are its usage lines, that installment, and the service fees and late payment
      charges billed for its billing period; where the previous installment carries a missed-installment entry
      and no late payment charge was billed in those three months, they are its usage lines, that installment and
      the service fees billed for its billing period; where the previous installment carries no
      missed-installment entry, they are its usage lines and that installment. The payments credited toward the
      previous bill follow the account's standing: on an account on cash-only status on the bill date, only the
      month's payments through office cash, money order, online card, phone card and payment kiosk; on an account
      not on cash-only status with a payment returned in that month, the month's payments less the returned
      amounts; on any other account, the month's payments as posted. Energy assistance pledges recorded in the
      month count toward the previous bill according to the pledging agency: where an Operation Round Up pledge
      was recorded in the month, the month's pledges count at roundup_share of their amount; where pledges were
      recorded in the month but none from Operation Round Up, they count at agency_share of their amount; where no
      pledge was recorded in the month, none counts. How much of the payment above the previous bill is applied to
      the installment follows how the latest payment was made: where the latest payment posted to the service
      account was a check or an electronic check and a returned payment was posted to the account in the twelve
      months ending on the bill date, uncleared_returned_share of it is applied; where the latest payment was a
      check or an electronic check and no returned payment was posted in those twelve months, uncleared_share of
      it is applied; where the latest payment came through any other channel, it is applied in full.
    prerequisite: []
    cross_category:
      - category: service
        as: history
        reads: [service_accounts.cash_only_until, service_charges.amount, service_payments.amount, service_payments.payment_channel, service_payments.assistance_agency]
        note: Every factor of the installment billed is decided from the tenant-house service account's bill lines, payments, returns and pledges.
    compute:
      - billed_count: "COUNT('arrange_ledger', event_type='arrange_installment_bill')"
      - moved_in: "SUM('arrange_ledger', 'amount', event_type='arrange_balance_transfer')"
      - billed_out: "SUM('arrange_ledger', 'amount', event_type='arrange_installment_bill')"
      - billed_back: "SUM('arrange_ledger', 'amount', event_type='arrange_balance_rebill')"
      - unbilled_before: "moved_in - billed_out - billed_back"
      - installment_scheduled: "unbilled_before if billed_count + 1 >= F('installment_count') else MN(F('installment_amount'), unbilled_before)"
      - previous_period: "LATEST('arrange_ledger', 'billing_period', date_field='entry_date', event_type='arrange_installment_bill', installment_number=billed_count)"
      - previous_installment: "SUM('arrange_ledger', 'amount', event_type='arrange_installment_bill', installment_number=billed_count)"
      - previous_usage: "XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_usage_charge', billing_period=previous_period)"
      - previous_fees: "XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_fee', billing_period=previous_period)"
      - previous_late: "XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_late_charge', billing_period=previous_period)"
      - previous_missed: "COUNT('arrange_ledger', event_type='arrange_installment_missed', installment_number=billed_count)"
      - late_charges_3m: "XCOUNT('service', 'service_charges', within_months=3, date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_late_charge')"
      - previous_required: "previous_usage + previous_installment + previous_fees + previous_late if (previous_missed > 0 and late_charges_3m >= 1) else (previous_usage + previous_installment + previous_fees if (previous_missed > 0 and late_charges_3m == 0) else previous_usage + previous_installment)"
      - bill_cash_only: "(CFIELD('service', 'cash_only_until', service_account_id=F('service_account_id')) or '') >= NOW"
      - month_payments: "XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment')"
      - month_returns: "XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment_return')"
      - month_cash_payments: "XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='office_cash') + XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='money_order') + XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='online_card') + XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='phone_ivr_card') + XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='payment_kiosk')"
      - credited_toward_previous: "month_cash_payments if bill_cash_only else (month_payments - month_returns if month_returns > 0 else month_payments)"
      - month_pledges: "XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_assistance_pledge')"
      - roundup_pledges: "XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_assistance_pledge', assistance_agency='operation_round_up')"
      - pledge_count_share: "K('roundup_share') if (roundup_pledges > 0 and month_pledges > 0) else (K('agency_share') if (month_pledges > 0 and roundup_pledges == 0) else 0)"
      - latest_channel: "XLATEST('service', 'service_payments', 'payment_channel', date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment') or ''"
      - returns_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment_return')"
      - paid_by_check: "latest_channel == 'office_check' or latest_channel == 'mail_check' or latest_channel == 'online_echeck'"
      - applied_share: "K('uncleared_returned_share') if (paid_by_check and returns_12m >= 1) else (K('uncleared_share') if (paid_by_check and returns_12m == 0) else 1)"
      - above_previous: "MX(0, credited_toward_previous + month_pledges * pledge_count_share - previous_required)"
      - result: "int(MX(0, installment_scheduled - above_previous * applied_share) * 100 + 0.5 + 0.000001) / 100"
    compute_basis:
      billed_count: "the installment being billed is the last of the installment count"
      moved_in: "never more than the unbilled balance"
      billed_out: "never more than the unbilled balance"
      billed_back: "never more than the unbilled balance"
      unbilled_before: "never more than the unbilled balance"
      installment_scheduled: "The installment scheduled is the agreement's installment amount, never more than the unbilled balance, and where the installment being billed is the last of the installment count it is the whole unbilled balance."
      previous_period: "The previous bill is the bill that carried the latest installment already billed on the agreement"
      previous_installment: "the charges it required are its usage lines and that installment"
      previous_usage: "the charges it required are its usage lines and that installment"
      previous_fees: "the service fees billed for its billing period"
      previous_late: "the service fees and late payment charges billed for its billing period"
      previous_missed: "where the previous installment carries a missed-installment entry"
      late_charges_3m: "the service account was billed a late payment charge in the three months ending on the bill date"
      previous_required: "where the previous installment carries a missed-installment entry and the service account was billed a late payment charge in the three months ending on the bill date, they are its usage lines, that installment, and the service fees and late payment charges billed for its billing period; where the previous installment carries a missed-installment entry and no late payment charge was billed in those three months, they are its usage lines, that installment and the service fees billed for its billing period; where the previous installment carries no missed-installment entry, they are its usage lines and that installment."
      bill_cash_only: "on an account on cash-only status on the bill date"
      month_payments: "The payments credited toward the previous bill are the payments posted to the service account in the month ending on the bill date, as posted."
      month_returns: "on an account not on cash-only status with a payment returned in that month, the month's payments less the returned amounts"
      month_cash_payments: "only the month's payments through office cash, money order, online card, phone card and payment kiosk"
      credited_toward_previous: "on an account on cash-only status on the bill date, only the month's payments through office cash, money order, online card, phone card and payment kiosk; on an account not on cash-only status with a payment returned in that month, the month's payments less the returned amounts; on any other account, the month's payments as posted."
      month_pledges: "Energy assistance pledges recorded in the month count toward the previous bill according to the pledging agency"
      roundup_pledges: "where an Operation Round Up pledge was recorded in the month"
      pledge_count_share: "where an Operation Round Up pledge was recorded in the month, the month's pledges count at roundup_share of their amount; where pledges were recorded in the month but none from Operation Round Up, they count at agency_share of their amount; where no pledge was recorded in the month, none counts."
      latest_channel: "where the latest payment posted to the service account was a check or an electronic check"
      returns_12m: "a returned payment was posted to the account in the twelve months ending on the bill date"
      paid_by_check: "the latest payment was a check or an electronic check"
      applied_share: "where the latest payment posted to the service account was a check or an electronic check and a returned payment was posted to the account in the twelve months ending on the bill date, uncleared_returned_share of it is applied; where the latest payment was a check or an electronic check and no returned payment was posted in those twelve months, uncleared_share of it is applied; where the latest payment came through any other channel, it is applied in full."
      above_previous: "A payment above what the previous bill required is applied in full to the installment being billed."
      result: "The installment billed is the installment scheduled less the payment above the previous bill that is applied to it, never below zero, rounded half up to the cent once at the end."
    factors:
      - id: previous_bill_requirement
        effect: method
        decides: previous_required
        bindings: [previous_missed, late_charges_3m, previous_required]
        ladder:
          - when: "the previous installment carries a missed-installment entry and a late payment charge was billed in the three months ending on the bill date"
            method: "the previous bill required its usage lines, that installment, and the service fees and late payment charges of its period"
          - when: "the previous installment carries a missed-installment entry and no late payment charge was billed in those three months"
            method: "the previous bill required its usage lines, that installment and the service fees of its period"
          - when: "otherwise (no missed-installment entry on the previous installment)"
            method: "the previous bill required its usage lines and that installment"
        baseline:
          previous_required: "previous_usage + previous_installment"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: credit_toward_previous_bill
        effect: method
        decides: credited_toward_previous
        bindings: [bill_cash_only, month_payments, month_returns, month_cash_payments, credited_toward_previous]
        ladder:
          - when: "the account is on cash-only status on the bill date"
            method: "only the month's payments through office cash, money order, online card, phone card and payment kiosk are credited"
          - when: "the account is not on cash-only status and a payment was returned in that month"
            method: "the month's payments less the returned amounts are credited"
          - when: "otherwise"
            method: "the month's payments are credited as posted"
        baseline:
          credited_toward_previous: "month_payments"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: pledge_by_agency
        effect: parameter
        decides: pledge_count_share
        bindings: [month_pledges, roundup_pledges, pledge_count_share]
        ladder:
          - when: "an Operation Round Up pledge was recorded in the month (with the month's pledges)"
            value: "K('roundup_share')"
          - when: "pledges were recorded in the month but none from Operation Round Up"
            value: "K('agency_share')"
          - when: "otherwise (no pledge recorded in the month)"
            value: "0"
        baseline:
          pledge_count_share: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: uncleared_funds_share
        effect: parameter
        decides: applied_share
        bindings: [latest_channel, returns_12m, paid_by_check, applied_share]
        ladder:
          - when: "the latest payment was a check or an electronic check and a returned payment was posted in the twelve months ending on the bill date"
            value: "K('uncleared_returned_share')"
          - when: "the latest payment was a check or an electronic check and no returned payment was posted in those twelve months"
            value: "K('uncleared_share')"
          - when: "otherwise (the latest payment came through any other channel)"
            value: "1"
        baseline:
          applied_share: "1"
        evidence: [history, cross_category]
        cross_difficulty: service
    baseline:
      rule: >-
        The installment scheduled is the agreement's installment amount, never more than the unbilled balance, and
        where the installment being billed is the last of the installment count it is the whole unbilled balance.
        The previous bill is the bill that carried the latest installment already billed on the agreement, and the
        charges it required are its usage lines and that installment. The payments credited toward the previous
        bill are the payments posted to the service account in the month ending on the bill date, as posted. No
        energy assistance pledge counts toward the previous bill. A payment above what the previous bill required is
        applied in full to the installment being billed. The installment billed is the installment scheduled less
        the payment above the previous bill that is applied to it, never below zero, rounded half up to the cent
        once at the end.
      params: []
    inputs:
      history:
        - {table: arrange_ledger, aggregate: sum, field: amount, filters: {event_type: arrange_installment_bill}}
        - {table: arrange_ledger, aggregate: count, field: arrange_entry_id, filters: {event_type: arrange_installment_missed}}
        - {category: service, table: service_charges, aggregate: sum, field: amount, filters: {event_type: service_usage_charge}}
        - {category: service, table: service_payments, aggregate: sum, field: amount, within_months: 1, filters: {event_type: service_payment}}
      cross_category: [service]
  - id: arrange_ext_default_rebill_amount
    base_policy_refs: [arrange_evt_default, arrange_evt_completion, arrange_evt_termination]
    overwrite:
      - base_policy: arrange_evt_default
        superseded_clause: >-
          the unbilled arranged balance is billed back at once with rebill_reason default and is due
          default_rebill_due_days after the default date
        replaced_by: >-
          The balance billed back at the default is the unbilled balance less the credits applied to it, never below
          zero, rounded half up to the cent once at the end, and it is due default_rebill_due_days after the default
          date.
    trigger: state_due
    subject: [arrange_default, arrange_balance_rebill]
    computes: rebill_amount
    target_tool: record_agreement_default_c78cb15c
    params:
      carried_share_after_return: 0.5
      correction_share_after_return: 0.5
      correction_share_after_transfer: 0.5
    rule: >-
      An agreement whose missed-installment entries number at least missed_installments_before_default is in
      default, and its unbilled balance is billed back at once with rebill_reason default. The balance billed back at
      a default is not fixed until the installment due on every bill already issued for the service account carries
      its installment-billed entry on the agreement's ledger. The unbilled balance is the amount moved into the
      agreement less every installment billed and every amount already billed back, as the agreement's ledger
      records them. Under the standard method no credit standing on the service account is applied to the balance
      billed back: neither a credit balance carried into the latest bill nor any bill credit posted on the latest
      bill. The balance billed back at the default is the unbilled balance less the credits applied to it, never
      below zero, rounded half up to the cent once at the end, and it is due default_rebill_due_days after the
      default date. The latest bill is the bill of the latest installment's billing period. A security deposit is
      never applied and capital credits still payable are never offset at a default, because the service account
      stays open. Which credits standing on the service account are applied follows the account's payment record:
      where a late payment charge was billed in the three months ending on the default date and a returned payment
      was posted in the twelve months ending on that date, the latest bill's billing error correction credits and
      the credit balance carried into it are applied; where a late payment charge was billed in those three months
      and no returned payment was posted in those twelve months, the latest bill's billing error correction credits
      alone are applied; where no late payment charge was billed in those three months, no credit is applied. A
      credit balance carried into the latest bill (the service account's balance less that bill's charges and plus
      its credits, where below zero) is applied according to the account's recent returns: in full where no
      returned payment was posted in the three months ending on the default date, at carried_share_after_return of
      it where one was, and not at all where no credit balance was carried. Billing error correction credits that
      are applied count according to the account's returns: in full where no returned payment was posted in the
      twelve months ending on the default date, at correction_share_after_return of their amount where one was, and
      not at all where no correction credit was posted on the latest bill. They count further according to when the
      corrected line was billed: in full where it was billed on or before the day the balance was moved into the
      agreement, its overbilled amount having been moved in with the arrears; at correction_share_after_transfer of
      their amount where it was billed after that day; and not at all where no correction credit was posted on the
      latest bill.
    prerequisite:
      - problem: arrange_ext_installment_billed_amount
        kind: value_input
        gate: billed_out
        form: state
        policy_source: >-
          The balance billed back at a default is not fixed until the installment due on every bill already issued
          for the service account carries its installment-billed entry on the agreement's ledger.
        condition: >-
          For every billing period whose usage bill has been issued on the service account since the first
          installment period, the agreement's arrange_ledger carries an arrange_installment_bill entry of that
          period.
        resolved_by: bill_agreement_installment_2bd16d35
        effect: >-
          Once the installment of the bill issued on the default date is billed, billed_out rises by its amount, the
          latest bill becomes that bill, and the unbilled balance billed back falls by the installment's amount.
    cross_category:
      - category: service
        as: history
        reads: [service_accounts.account_balance, service_charges.amount, service_charges.credit_reason, service_charges.source_reference_id, service_charges.charge_date, service_payments.event_type]
        note: The credits applied are decided from the service account's balance, the latest bill's lines and credits, the corrected line's bill date, its late charges and returns.
    compute:
      - moved_in: "SUM('arrange_ledger', 'amount', event_type='arrange_balance_transfer')"
      - billed_out: "SUM('arrange_ledger', 'amount', event_type='arrange_installment_bill')"
      - billed_back: "SUM('arrange_ledger', 'amount', event_type='arrange_balance_rebill')"
      - unbilled: "moved_in - billed_out - billed_back"
      - latest_period: "LATEST('arrange_ledger', 'billing_period', date_field='entry_date', event_type='arrange_installment_bill')"
      - latest_charges: "XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_usage_charge', billing_period=latest_period) + XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_fee', billing_period=latest_period) + XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_late_charge', billing_period=latest_period) + XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_program_charge', billing_period=latest_period)"
      - latest_credits: "XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_bill_credit', billing_period=latest_period)"
      - latest_correction_credits: "XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_bill_credit', credit_reason='billing_error_correction', billing_period=latest_period)"
      - carried_credit: "MX(0, 0 - ((CFIELD('service', 'account_balance', service_account_id=F('service_account_id')) or 0) - latest_charges + latest_credits))"
      - default_late_3m: "XCOUNT('service', 'service_charges', within_months=3, date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_late_charge')"
      - default_returns_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment_return')"
      - default_returns_3m: "XCOUNT('service', 'service_payments', within_months=3, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment_return')"
      - carried_share: "1 if (carried_credit > 0 and default_returns_3m == 0) else (K('carried_share_after_return') if (carried_credit > 0 and default_returns_3m >= 1) else 0)"
      - correction_share: "1 if (latest_correction_credits > 0 and default_returns_12m == 0) else (K('correction_share_after_return') if (latest_correction_credits > 0 and default_returns_12m >= 1) else 0)"
      - correction_source: "XLATEST('service', 'service_charges', 'source_reference_id', date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_bill_credit', credit_reason='billing_error_correction', billing_period=latest_period) or ''"
      - corrected_line_date: "XLATEST('service', 'service_charges', 'charge_date', date_field='charge_date', service_account_id=F('service_account_id'), charge_id=correction_source) or ''"
      - transfer_date: "LATEST('arrange_ledger', 'entry_date', date_field='entry_date', event_type='arrange_balance_transfer') or ''"
      - correction_timing_share: "1 if (latest_correction_credits > 0 and corrected_line_date != '' and corrected_line_date <= transfer_date) else (K('correction_share_after_transfer') if (latest_correction_credits > 0 and corrected_line_date > transfer_date) else 0)"
      - credits_applied: "latest_correction_credits * correction_share * correction_timing_share + carried_credit * carried_share if (default_late_3m >= 1 and default_returns_12m >= 1) else (latest_correction_credits * correction_share * correction_timing_share if (default_late_3m >= 1 and default_returns_12m == 0) else 0)"
      - result: "int(MX(0, unbilled - credits_applied) * 100 + 0.5 + 0.000001) / 100"
    compute_basis:
      moved_in: "The unbilled balance is the amount moved into the agreement less every installment billed and every amount already billed back, as the agreement's ledger records them."
      billed_out: "less every installment billed"
      billed_back: "every amount already billed back"
      unbilled: "The unbilled balance is the amount moved into the agreement less every installment billed and every amount already billed back"
      latest_period: "The latest bill is the bill of the latest installment's billing period."
      latest_charges: "the service account's balance less that bill's charges and plus its credits, where below zero"
      latest_credits: "the service account's balance less that bill's charges and plus its credits, where below zero"
      latest_correction_credits: "the latest bill's billing error correction credits alone are applied"
      carried_credit: "A credit balance carried into the latest bill (the service account's balance less that bill's charges and plus its credits, where below zero)"
      default_late_3m: "where a late payment charge was billed in the three months ending on the default date"
      default_returns_12m: "a returned payment was posted in the twelve months ending on that date"
      default_returns_3m: "where no returned payment was posted in the three months ending on the default date"
      carried_share: "is applied according to the account's recent returns: in full where no returned payment was posted in the three months ending on the default date, at carried_share_after_return of it where one was, and not at all where no credit balance was carried."
      correction_share: "in full where no returned payment was posted in the twelve months ending on the default date, at correction_share_after_return of their amount where one was, and not at all where no correction credit was posted on the latest bill."
      correction_source: "They count further according to when the corrected line was billed"
      corrected_line_date: "where it was billed on or before the day the balance was moved into the agreement"
      transfer_date: "the day the balance was moved into the agreement"
      correction_timing_share: "in full where it was billed on or before the day the balance was moved into the agreement, its overbilled amount having been moved in with the arrears; at correction_share_after_transfer of their amount where it was billed after that day; and not at all where no correction credit was posted on the latest bill."
      credits_applied: "where a late payment charge was billed in the three months ending on the default date and a returned payment was posted in the twelve months ending on that date, the latest bill's billing error correction credits and the credit balance carried into it are applied; where a late payment charge was billed in those three months and no returned payment was posted in those twelve months, the latest bill's billing error correction credits alone are applied; where no late payment charge was billed in those three months, no credit is applied."
      result: "The balance billed back at the default is the unbilled balance less the credits applied to it, never below zero, rounded half up to the cent once at the end"
    factors:
      - id: bill_credits_by_record
        effect: method
        decides: credits_applied
        bindings: [default_late_3m, default_returns_12m, credits_applied]
        ladder:
          - when: "a late payment charge billed in the three months ending on the default date and a returned payment posted in the twelve months ending on that date"
            method: "the latest bill's billing error correction credits and the credit balance carried into it are applied"
          - when: "a late payment charge billed in those three months and no returned payment in those twelve months"
            method: "the latest bill's billing error correction credits alone are applied"
          - when: "otherwise (no late payment charge in those three months)"
            method: "no credit is applied"
        baseline:
          credits_applied: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: carried_credit_share
        effect: parameter
        decides: carried_share
        bindings: [latest_charges, latest_credits, carried_credit, default_returns_3m, carried_share]
        ladder:
          - when: "a credit balance carried into the latest bill and no returned payment in the three months ending on the default date"
            value: "1"
          - when: "a credit balance carried into the latest bill and a returned payment in those three months"
            value: "K('carried_share_after_return')"
          - when: "otherwise (no credit balance carried)"
            value: "0"
        baseline:
          carried_share: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: correction_timing_by_transfer
        effect: parameter
        decides: correction_timing_share
        bindings: [correction_source, corrected_line_date, transfer_date, correction_timing_share]
        ladder:
          - when: "a billing error correction credit on the latest bill for a line billed on or before the day the balance was moved into the agreement"
            value: "1"
          - when: "a billing error correction credit on the latest bill for a line billed after that day"
            value: "K('correction_share_after_transfer')"
          - when: "otherwise (no correction credit on the latest bill)"
            value: "0"
        baseline:
          correction_timing_share: "0"
        evidence: [history, date, cross_category]
        cross_difficulty: service
      - id: correction_credit_share
        effect: parameter
        decides: correction_share
        bindings: [latest_correction_credits, correction_share]
        ladder:
          - when: "a billing error correction credit on the latest bill and no returned payment in the twelve months ending on the default date"
            value: "1"
          - when: "a billing error correction credit on the latest bill and a returned payment in those twelve months"
            value: "K('correction_share_after_return')"
          - when: "otherwise (no correction credit on the latest bill)"
            value: "0"
        baseline:
          correction_share: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
    baseline:
      rule: >-
        The unbilled balance is the amount moved into the agreement less every installment billed and every amount
        already billed back, as the agreement's ledger records them. Under the standard method no credit standing on
        the service account is applied to the balance billed back: neither a credit balance carried into the latest
        bill nor any bill credit posted on the latest bill. The balance billed back at the default is the unbilled
        balance less the credits applied to it, never below zero, rounded half up to the cent once at the end, and it
        is due default_rebill_due_days after the default date.
      params: [default_rebill_due_days]
    inputs:
      history:
        - {table: arrange_ledger, aggregate: sum, field: amount, filters: {event_type: arrange_installment_bill}}
        - {category: service, table: service_charges, aggregate: sum, field: amount, filters: {event_type: service_bill_credit}}
        - {category: service, table: service_payments, aggregate: count, field: payment_id, within_months: 12, filters: {event_type: service_payment_return}}
      cross_category: [service]
  - id: arrange_ext_acceptance_arranged_amount
    base_policy_refs: [arrange_evt_acceptance, arrange_evt_terms]
    overwrite:
      - base_policy: arrange_evt_terms
        superseded_clause: >-
          The arranged amount is the past-due amount less the down payment (the pledged part included), and
          include_current_charges being false, charges not yet past due are never arranged.
        replaced_by: >-
          The arranged amount recorded on acceptance is the arrears arranged less the down payment required and less
          the part of the excess credited, never below zero and never above max_arranged_amount, rounded half up to
          the cent once at the end.
      - base_policy: arrange_evt_terms
        superseded_clause: >-
          where pledge_counts_toward_down_payment is true, the open pledges (arrange_msr_open_pledges) reduce the
          down payment the member must pay, never below zero.
        replaced_by: >-
          How much of the latest energy assistance pledge counts toward the cash part of the down payment follows
          its age
    trigger: on_request
    subject: [arrange_accept]
    computes: arranged_amount
    target_tool: accept_payment_agreement_6d07adca
    params:
      pledge_recent_share: 1.0
      pledge_older_share: 0.5
      excess_clean_share: 1.0
      excess_mixed_share: 0.5
      first_check_share: 0.5
      repeat_check_share: 0.8
    rule: >-
      Accepting the agreement is the member's own commitment, given within acceptance_window_days calendar days
      after the offer through one of the tier's acceptance_methods_allowed, and the arranged amount the member
      commits to is recorded with the acceptance and worked out as follows. The arranged amount recorded on an
      acceptance is fixed only once every other agreement of the member whose missed installments have reached the
      default count shows defaulted status. The arrears arranged are the past-due amount stated on the offer. The
      down payment required is the down payment stated on the offer, and no pledge counts toward the cash part of
      it. The down payment paid is the latest payment posted to the service account, where it posted on or after
      the offered date. Nothing is set aside from the down payment paid before the excess is reckoned. The excess is
      the down payment paid less the cash part of the down payment required and less what is set aside, never below
      zero, and no part of the excess is credited against the arranged amount. The arranged amount recorded on
      acceptance is the arrears arranged less the down payment required and less the part of the excess credited,
      never below zero and never above max_arranged_amount, rounded half up to the cent once at the end. Which late
      payment charges are taken out of the arrears arranged follows the account's collection standing: where the
      service account carries an outstanding disconnect notice and an unexpired medical certificate on the
      acceptance day, every late payment charge billed in the twelve months ending on that day is taken out; where
      it carries an outstanding disconnect notice and no unexpired medical certificate, the late payment charges
      billed in the three months ending on that day are taken out; where no disconnect notice is outstanding, none
      is taken out. How much of the latest energy assistance pledge counts toward the cash part of the down
      payment follows its age: where the tier counts pledges toward the down payment
      (pledge_counts_toward_down_payment) and the latest pledge on the service account was recorded within the
      schedule's assistance_pledge_hold_days calendar days before the acceptance day, it counts at
      pledge_recent_share of its amount; where the tier counts pledges and the latest pledge is older than that
      but within the tier's assistance_pledge_lookback_days, it counts at pledge_older_share of its amount;
      otherwise no pledge counts. Before the excess is reckoned, the down payment paid first settles a charge
      billed on or after the offered date: where a late payment charge was billed on or after the offered date,
      the latest such late payment charge is set aside from it; where no such late payment charge was billed but a
      service fee was, the latest such service fee is set aside from it; where neither was billed, nothing is set
      aside for them. Which payments make up the down payment paid follows the account's collection standing: where
      the service account carries an outstanding disconnect notice and no returned payment was posted in the twelve
      months ending on the acceptance day, every payment posted to the service account in the month ending on the
      acceptance day counts; where it carries an outstanding disconnect notice and a returned payment was posted in
      those twelve months, only the payments posted in that month other than checks and electronic checks count;
      where no disconnect notice is outstanding, the down payment paid is the latest payment posted on or after the
      offered date. The
      part of the excess credited against the arranged amount follows the account's payment record over the twelve
      months ending on the acceptance day: where no late payment charge was billed and no returned payment was
      posted in those twelve months, excess_clean_share of the excess is credited; where one or two late payment
      charges but no returned payment were, excess_mixed_share of it is credited; otherwise none of it is credited.
      Where the latest payment posted to the service account was a check or an electronic check, the part credited
      is further scaled: by first_check_share where it is the only check or electronic check payment posted to the
      service account in the twelve months ending on the acceptance day, by repeat_check_share where earlier check
      or electronic check payments were posted in those twelve months; a latest payment made through any other
      channel is not scaled.
    prerequisite:
      - problem: arrange_ext_default_rebill_amount
        kind: state_gate
        gate: arrangements.status
        form: state
        policy_source: >-
          The arranged amount recorded on an acceptance is fixed only once every other agreement of the member whose
          missed installments have reached the default count shows defaulted status.
        condition: >-
          No other arrangement of the member remains in active status while its arrange_installment_missed entries
          number at least its tier's missed_installments_before_default.
        resolved_by: record_agreement_default_c78cb15c
        effect: >-
          Once the member's other agreement shows defaulted status, the state the acceptance waits on holds and the
          acceptance can be recorded with its arranged amount; the arranged amount itself reads nothing from the
          other agreement.
    cross_category:
      - category: service
        as: history
        reads: [service_accounts.disconnect_notice_date, service_accounts.medical_certificate_expires, service_charges.amount, service_charges.charge_date, service_payments.amount, service_payments.payment_channel]
        note: The late-charge, pledge, set-aside, down-payment, excess and check factors are decided from the farm-home service account's notice, certificate, bill lines, pledges, returns and payments.
    compute:
      - offer_past_due: "F('past_due_amount')"
      - down_payment_required: "F('down_payment_amount')"
      - accept_notice_open: "(CFIELD('service', 'disconnect_notice_date', service_account_id=F('service_account_id')) or '') != ''"
      - accept_certificate: "CFIELD('service', 'medical_certificate_expires', service_account_id=F('service_account_id')) or ''"
      - late_sum_12m: "XSUM('service', 'service_charges', 'amount', within_months=12, date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_late_charge')"
      - late_sum_3m: "XSUM('service', 'service_charges', 'amount', within_months=3, date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_late_charge')"
      - late_taken_out: "late_sum_12m if (accept_notice_open and accept_certificate >= NOW) else (late_sum_3m if (accept_notice_open and accept_certificate < NOW) else 0)"
      - arrears_arranged: "offer_past_due - late_taken_out"
      - pledge_date: "XLATEST('service', 'service_payments', 'payment_date', date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_assistance_pledge') or NOW"
      - pledge_amount: "XLATEST('service', 'service_payments', 'amount', date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_assistance_pledge') or 0"
      - pledge_age_days: "DAYS(pledge_date, NOW)"
      - pledge_hold_days: "CPARAM('service', 'assistance_pledge_hold_days', service_account_id=F('service_account_id'))"
      - pledge_dp_share: "K('pledge_recent_share') if (P('pledge_counts_toward_down_payment') and pledge_age_days <= pledge_hold_days) else (K('pledge_older_share') if (P('pledge_counts_toward_down_payment') and pledge_age_days > pledge_hold_days and pledge_age_days <= P('assistance_pledge_lookback_days')) else 0)"
      - cash_part: "MX(0, down_payment_required - pledge_amount * pledge_dp_share)"
      - latest_payment_date: "XLATEST('service', 'service_payments', 'payment_date', date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment') or ''"
      - latest_payment_amount: "XLATEST('service', 'service_payments', 'amount', date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment') or 0"
      - latest_payment_channel: "XLATEST('service', 'service_payments', 'payment_channel', date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment') or ''"
      - returns_12m_accept: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment_return')"
      - month_payments: "XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment')"
      - month_check_payments: "XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='office_check') + XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='mail_check') + XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='online_echeck')"
      - down_payment_paid: "month_payments if (accept_notice_open and returns_12m_accept == 0) else ((month_payments - month_check_payments) if (accept_notice_open and returns_12m_accept >= 1) else (latest_payment_amount if latest_payment_date >= F('offered_date') else 0))"
      - late_after_date: "XLATEST('service', 'service_charges', 'charge_date', date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_late_charge') or ''"
      - late_after_amount: "XLATEST('service', 'service_charges', 'amount', date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_late_charge') or 0"
      - fee_after_date: "XLATEST('service', 'service_charges', 'charge_date', date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_fee') or ''"
      - fee_after_amount: "XLATEST('service', 'service_charges', 'amount', date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_fee') or 0"
      - settled_first: "late_after_amount if late_after_date >= F('offered_date') else (fee_after_amount if (late_after_date < F('offered_date') and fee_after_date >= F('offered_date')) else 0)"
      - excess: "MX(0, down_payment_paid - cash_part - settled_first)"
      - late_count_12m_accept: "XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_late_charge')"
      - excess_share: "K('excess_clean_share') if (late_count_12m_accept == 0 and returns_12m_accept == 0) else (K('excess_mixed_share') if (late_count_12m_accept >= 1 and late_count_12m_accept <= 2 and returns_12m_accept == 0) else 0)"
      - check_payments_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='office_check') + XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='mail_check') + XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment', payment_channel='online_echeck')"
      - down_payment_by_check: "latest_payment_channel == 'office_check' or latest_payment_channel == 'mail_check' or latest_payment_channel == 'online_echeck'"
      - check_scale: "K('first_check_share') if (down_payment_by_check and check_payments_12m == 1) else (K('repeat_check_share') if (down_payment_by_check and check_payments_12m > 1) else 1)"
      - excess_credited: "excess * excess_share * check_scale"
      - result: "int(MX(0, MN(P('max_arranged_amount'), arrears_arranged - down_payment_required - excess_credited)) * 100 + 0.5 + 0.000001) / 100"
    compute_basis:
      offer_past_due: "The arrears arranged are the past-due amount stated on the offer."
      down_payment_required: "The down payment required is the down payment stated on the offer"
      accept_notice_open: "where the service account carries an outstanding disconnect notice"
      accept_certificate: "an unexpired medical certificate on the acceptance day"
      late_sum_12m: "every late payment charge billed in the twelve months ending on that day is taken out"
      late_sum_3m: "the late payment charges billed in the three months ending on that day are taken out"
      late_taken_out: "where the service account carries an outstanding disconnect notice and an unexpired medical certificate on the acceptance day, every late payment charge billed in the twelve months ending on that day is taken out; where it carries an outstanding disconnect notice and no unexpired medical certificate, the late payment charges billed in the three months ending on that day are taken out; where no disconnect notice is outstanding, none is taken out."
      arrears_arranged: "Which late payment charges are taken out of the arrears arranged follows the account's collection standing"
      pledge_date: "the latest pledge on the service account was recorded within the schedule's assistance_pledge_hold_days calendar days before the acceptance day"
      pledge_amount: "it counts at pledge_recent_share of its amount"
      pledge_age_days: "the latest pledge is older than that but within the tier's assistance_pledge_lookback_days"
      pledge_hold_days: "the schedule's assistance_pledge_hold_days calendar days before the acceptance day"
      pledge_dp_share: "where the tier counts pledges toward the down payment (pledge_counts_toward_down_payment) and the latest pledge on the service account was recorded within the schedule's assistance_pledge_hold_days calendar days before the acceptance day, it counts at pledge_recent_share of its amount; where the tier counts pledges and the latest pledge is older than that but within the tier's assistance_pledge_lookback_days, it counts at pledge_older_share of its amount; otherwise no pledge counts."
      cash_part: "How much of the latest energy assistance pledge counts toward the cash part of the down payment follows its age"
      latest_payment_date: "The down payment paid is the latest payment posted to the service account, where it posted on or after the offered date."
      latest_payment_amount: "The down payment paid is the latest payment posted to the service account"
      latest_payment_channel: "Where the latest payment posted to the service account was a check or an electronic check"
      returns_12m_accept: "where one or two late payment charges but no returned payment were"
      month_payments: "every payment posted to the service account in the month ending on the acceptance day counts"
      month_check_payments: "only the payments posted in that month other than checks and electronic checks count"
      down_payment_paid: "where the service account carries an outstanding disconnect notice and no returned payment was posted in the twelve months ending on the acceptance day, every payment posted to the service account in the month ending on the acceptance day counts; where it carries an outstanding disconnect notice and a returned payment was posted in those twelve months, only the payments posted in that month other than checks and electronic checks count; where no disconnect notice is outstanding, the down payment paid is the latest payment posted on or after the offered date."
      late_after_date: "where a late payment charge was billed on or after the offered date"
      late_after_amount: "the latest such late payment charge is set aside from it"
      fee_after_date: "where no such late payment charge was billed but a service fee was"
      fee_after_amount: "the latest such service fee is set aside from it"
      settled_first: "where a late payment charge was billed on or after the offered date, the latest such late payment charge is set aside from it; where no such late payment charge was billed but a service fee was, the latest such service fee is set aside from it; where neither was billed, nothing is set aside for them."
      excess: "The excess is the down payment paid less the cash part of the down payment required and less what is set aside, never below zero"
      late_count_12m_accept: "where no late payment charge was billed and no returned payment was posted in those twelve months"
      excess_share: "where no late payment charge was billed and no returned payment was posted in those twelve months, excess_clean_share of the excess is credited; where one or two late payment charges but no returned payment were, excess_mixed_share of it is credited; otherwise none of it is credited."
      check_payments_12m: "where it is the only check or electronic check payment posted to the service account in the twelve months ending on the acceptance day"
      down_payment_by_check: "Where the latest payment posted to the service account was a check or an electronic check"
      check_scale: "by first_check_share where it is the only check or electronic check payment posted to the service account in the twelve months ending on the acceptance day, by repeat_check_share where earlier check or electronic check payments were posted in those twelve months; a latest payment made through any other channel is not scaled."
      excess_credited: "and no part of the excess is credited against the arranged amount"
      result: "The arranged amount recorded on acceptance is the arrears arranged less the down payment required and less the part of the excess credited, never below zero and never above max_arranged_amount, rounded half up to the cent once at the end."
    factors:
      - id: late_charges_out_of_arrears
        effect: parameter
        decides: late_taken_out
        bindings: [accept_notice_open, accept_certificate, late_sum_12m, late_sum_3m, late_taken_out]
        ladder:
          - when: "an outstanding disconnect notice and an unexpired medical certificate on the acceptance day"
            value: "a twelve-month window of late payment charges taken out"
          - when: "an outstanding disconnect notice and no unexpired medical certificate"
            value: "a three-month window of late payment charges taken out"
          - when: "otherwise (no outstanding disconnect notice)"
            value: "no window (nothing taken out)"
        baseline:
          late_taken_out: "0"
        evidence: [history, date, cross_category]
        cross_difficulty: service
      - id: pledge_toward_down_payment
        effect: parameter
        decides: pledge_dp_share
        bindings: [pledge_date, pledge_amount, pledge_age_days, pledge_hold_days, pledge_dp_share]
        ladder:
          - when: "the tier counts pledges toward the down payment and the latest pledge was recorded within the schedule's assistance_pledge_hold_days calendar days"
            value: "K('pledge_recent_share')"
          - when: "the tier counts pledges and the latest pledge is older than that but within the tier's assistance_pledge_lookback_days"
            value: "K('pledge_older_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          pledge_dp_share: "0"
        evidence: [date, tier_param, cross_category]
        cross_difficulty: service
      - id: charge_settled_first
        effect: method
        decides: settled_first
        bindings: [late_after_date, late_after_amount, fee_after_date, fee_after_amount, settled_first]
        ladder:
          - when: "a late payment charge billed on or after the offered date"
            method: "the latest such late payment charge is set aside from the down payment paid"
          - when: "no such late payment charge but a service fee billed on or after the offered date"
            method: "the latest such service fee is set aside from the down payment paid"
          - when: "otherwise"
            method: "nothing is set aside for charges billed since the offer"
        baseline:
          settled_first: "0"
        evidence: [history, date, cross_category]
        cross_difficulty: service
      - id: down_payment_by_standing
        effect: method
        decides: down_payment_paid
        bindings: [month_payments, month_check_payments, down_payment_paid]
        ladder:
          - when: "an outstanding disconnect notice and no returned payment in the twelve months ending on the acceptance day"
            method: "every payment posted in the month ending on the acceptance day makes up the down payment paid"
          - when: "an outstanding disconnect notice and a returned payment in those twelve months"
            method: "only that month's payments other than checks and electronic checks make up the down payment paid"
          - when: "otherwise (no outstanding disconnect notice)"
            method: "the down payment paid is the latest payment posted on or after the offered date"
        baseline:
          down_payment_paid: "latest_payment_amount if latest_payment_date >= F('offered_date') else 0"
        evidence: [history, date, cross_category]
        cross_difficulty: service
      - id: excess_credit_by_record
        effect: parameter
        decides: excess_share
        bindings: [late_count_12m_accept, returns_12m_accept, excess_share]
        ladder:
          - when: "no late payment charge billed and no returned payment posted in the twelve months ending on the acceptance day"
            value: "K('excess_clean_share')"
          - when: "one or two late payment charges but no returned payment in those twelve months"
            value: "K('excess_mixed_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          excess_share: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: check_payment_scale
        effect: parameter
        decides: check_scale
        bindings: [latest_payment_channel, check_payments_12m, down_payment_by_check, check_scale]
        ladder:
          - when: "the latest payment was a check or an electronic check and it is the only such payment in the twelve months ending on the acceptance day"
            value: "K('first_check_share')"
          - when: "the latest payment was a check or an electronic check and earlier such payments were posted in those twelve months"
            value: "K('repeat_check_share')"
          - when: "otherwise (any other channel)"
            value: "1"
        baseline:
          check_scale: "1"
        evidence: [history, cross_category]
        cross_difficulty: service
    baseline:
      rule: >-
        The arrears arranged are the past-due amount stated on the offer. The down payment required is the down
        payment stated on the offer, and no pledge counts toward the cash part of it. The down payment paid is the
        latest payment posted to the service account, where it posted on or after the offered date. Nothing is set
        aside from the down payment paid before the excess is reckoned. The excess is the down payment paid less the
        cash part of the down payment required and less what is set aside, never below zero, and no part of the
        excess is credited against the arranged amount. The arranged amount recorded on acceptance is the arrears
        arranged less the down payment required and less the part of the excess credited, never below zero and never
        above max_arranged_amount, rounded half up to the cent once at the end.
      params: [max_arranged_amount]
    inputs:
      history:
        - {category: service, table: service_charges, aggregate: sum, field: amount, within_months: 12, filters: {event_type: service_late_charge}}
        - {category: service, table: service_payments, aggregate: latest, field: amount, filters: {event_type: service_payment}}
        - {category: service, table: service_payments, aggregate: latest, field: payment_date, filters: {event_type: service_assistance_pledge}}
      cross_category: [service]
  - id: arrange_ext_balance_transfer_amount
    base_policy_refs: [arrange_evt_acceptance]
    overwrite:
      - base_policy: arrange_evt_acceptance
        superseded_clause: >-
          On acceptance the arranged amount is moved off the service account's past-due balance
          (arrange_balance_transfer)
        replaced_by: >-
          The amount moved into the agreement is the arranged amount recorded on acceptance less what is held back
          from it, never below zero, rounded half up to the cent once at the end.
    trigger: state_due
    subject: [arrange_balance_transfer]
    computes: amount
    target_tool: move_balance_into_agreement_3b3ea9ff
    params:
      liheap_reserve_share: 0.5
      fee_hold_share_frequent: 1.0
      fee_hold_share_occasional: 0.5
      frequent_late_count: 2
      older_pledge_hold_share: 0.5
    rule: >-
      The amount moved into an agreement is not fixed until the agreement shows the member's acceptance, with its
      accepted date and acceptance method recorded. Under the standard method nothing is held back from the arranged
      amount: no charge billed since a disconnect notice and no energy assistance pledge. The amount moved into the
      agreement is the arranged amount recorded on acceptance less what is held back from it,
      never below zero, rounded half up to the cent once at the end. Which charges billed since an outstanding
      disconnect notice are held back, to be paid with the bill rather than spread, follows the account's payment
      record, the charges concerned being those billed for the latest billing period where that bill was issued
      after the notice: where a returned payment was posted in the twelve months ending on the transfer day, the
      service fees and late payment charges of that period are held back; where none was, its service fees alone
      are held back; where no disconnect notice is outstanding or the latest bill was issued before it, nothing is
      held back for charges. How much of the charges so selected is held back follows the account's late payment
      record: where frequent_late_count or more late payment charges were billed in the twelve months ending on the
      transfer day, fee_hold_share_frequent of them; where fewer were billed, fee_hold_share_occasional of them;
      where no charge is selected, nothing. The latest energy assistance pledge recorded within the tier's
      assistance_pledge_lookback_days is held back, to be paid by the agency, according to the pledging agency: a
      pledge from county emergency assistance or the Salvation Army is held back in full; a LIHEAP pledge is held
      back at liheap_reserve_share of its amount; an Operation Round Up pledge or no pledge holds nothing back. How
      much of the pledge share so held back stays held back follows the pledge's age: where the pledge was recorded
      within the schedule's assistance_pledge_hold_days calendar days before the transfer day, all of it; where it
      is older than that but within the tier's assistance_pledge_lookback_days, older_pledge_hold_share of it;
      where no pledge was recorded within that lookback, none.
    prerequisite:
      - problem: arrange_ext_acceptance_arranged_amount
        kind: value_input
        gate: arranged_recorded
        form: state
        policy_source: >-
          The amount moved into an agreement is not fixed until the agreement shows the member's acceptance, with
          its accepted date and acceptance method recorded.
        condition: >-
          The arrangement row carries status active, a non-empty accepted_date and an acceptance_method at transfer
          handling time.
        resolved_by: accept_payment_agreement_6d07adca
        effect: >-
          Once the acceptance is recorded, arranged_recorded becomes the arranged amount the member committed to on
          acceptance instead of the amount stated on the offer, and the amount moved changes with it.
    cross_category:
      - category: service
        as: history
        reads: [service_accounts.disconnect_notice_date, service_charges.amount, service_charges.charge_date, service_payments.assistance_agency, service_payments.event_type]
        note: The charges and the pledge held back are decided from the farm-home service account's notice, latest bill lines, returns, late charges and pledges and the schedule's pledge hold days.
    compute:
      - arranged_recorded: "F('arranged_amount')"
      - transfer_notice_date: "CFIELD('service', 'disconnect_notice_date', service_account_id=F('service_account_id')) or ''"
      - latest_bill_date: "XLATEST('service', 'service_charges', 'charge_date', date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_usage_charge') or ''"
      - latest_bill_period: "XLATEST('service', 'service_charges', 'billing_period', date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_usage_charge') or ''"
      - latest_fees: "XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_fee', billing_period=latest_bill_period)"
      - latest_late: "XSUM('service', 'service_charges', 'amount', service_account_id=F('service_account_id'), event_type='service_late_charge', billing_period=latest_bill_period)"
      - transfer_returns_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_payment_return')"
      - bill_after_notice: "transfer_notice_date != '' and latest_bill_date > transfer_notice_date"
      - charges_selected: "latest_fees + latest_late if (bill_after_notice and transfer_returns_12m >= 1) else (latest_fees if (bill_after_notice and transfer_returns_12m == 0) else 0)"
      - transfer_late_count: "XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', service_account_id=F('service_account_id'), event_type='service_late_charge')"
      - charge_hold_share: "K('fee_hold_share_frequent') if (charges_selected > 0 and transfer_late_count >= K('frequent_late_count')) else (K('fee_hold_share_occasional') if (charges_selected > 0 and transfer_late_count < K('frequent_late_count')) else 0)"
      - pledge_recorded: "XLATEST('service', 'service_payments', 'payment_date', date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_assistance_pledge') or '0000-01-01'"
      - pledge_agency: "XLATEST('service', 'service_payments', 'assistance_agency', date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_assistance_pledge') or ''"
      - pledge_value: "XLATEST('service', 'service_payments', 'amount', date_field='payment_date', service_account_id=F('service_account_id'), event_type='service_assistance_pledge') or 0"
      - pledge_in_lookback: "DAYS(pledge_recorded, NOW) <= P('assistance_pledge_lookback_days')"
      - pledge_agency_share: "1 if (pledge_in_lookback and (pledge_agency == 'county_emergency_assistance' or pledge_agency == 'salvation_army')) else (K('liheap_reserve_share') if (pledge_in_lookback and pledge_agency == 'liheap') else 0)"
      - transfer_pledge_age: "DAYS(pledge_recorded, NOW)"
      - transfer_hold_days: "CPARAM('service', 'assistance_pledge_hold_days', service_account_id=F('service_account_id'))"
      - pledge_age_share: "1 if (pledge_in_lookback and transfer_pledge_age <= transfer_hold_days) else (K('older_pledge_hold_share') if (pledge_in_lookback and transfer_pledge_age > transfer_hold_days) else 0)"
      - pledge_held_back: "pledge_value * pledge_agency_share * pledge_age_share"
      - result: "int(MX(0, arranged_recorded - charges_selected * charge_hold_share - pledge_held_back) * 100 + 0.5 + 0.000001) / 100"
    compute_basis:
      arranged_recorded: "the arranged amount recorded on acceptance"
      transfer_notice_date: "where no disconnect notice is outstanding or the latest bill was issued before it, nothing is held back for charges"
      latest_bill_date: "those billed for the latest billing period where that bill was issued after the notice"
      latest_bill_period: "the charges concerned being those billed for the latest billing period"
      latest_fees: "its service fees alone are held back"
      latest_late: "the service fees and late payment charges of that period are held back"
      transfer_returns_12m: "where a returned payment was posted in the twelve months ending on the transfer day"
      bill_after_notice: "those billed for the latest billing period where that bill was issued after the notice"
      charges_selected: "where a returned payment was posted in the twelve months ending on the transfer day, the service fees and late payment charges of that period are held back; where none was, its service fees alone are held back; where no disconnect notice is outstanding or the latest bill was issued before it, nothing is held back for charges."
      transfer_late_count: "where frequent_late_count or more late payment charges were billed in the twelve months ending on the transfer day"
      charge_hold_share: "where frequent_late_count or more late payment charges were billed in the twelve months ending on the transfer day, fee_hold_share_frequent of them; where fewer were billed, fee_hold_share_occasional of them; where no charge is selected, nothing."
      pledge_recorded: "The latest energy assistance pledge recorded within the tier's assistance_pledge_lookback_days"
      pledge_agency: "according to the pledging agency"
      pledge_value: "is held back, to be paid by the agency"
      pledge_in_lookback: "recorded within the tier's assistance_pledge_lookback_days"
      pledge_agency_share: "a pledge from county emergency assistance or the Salvation Army is held back in full; a LIHEAP pledge is held back at liheap_reserve_share of its amount; an Operation Round Up pledge or no pledge holds nothing back."
      transfer_pledge_age: "How much of the pledge share so held back stays held back follows the pledge's age"
      transfer_hold_days: "within the schedule's assistance_pledge_hold_days calendar days before the transfer day"
      pledge_age_share: "where the pledge was recorded within the schedule's assistance_pledge_hold_days calendar days before the transfer day, all of it; where it is older than that but within the tier's assistance_pledge_lookback_days, older_pledge_hold_share of it; where no pledge was recorded within that lookback, none."
      pledge_held_back: "The latest energy assistance pledge recorded within the tier's assistance_pledge_lookback_days is held back, to be paid by the agency"
      result: "The amount moved into the agreement is the arranged amount recorded on acceptance less what is held back from it, never below zero, rounded half up to the cent once at the end."
    factors:
      - id: charges_held_by_record
        effect: method
        decides: charges_selected
        bindings: [transfer_notice_date, latest_bill_date, latest_bill_period, latest_fees, latest_late, transfer_returns_12m, bill_after_notice, charges_selected]
        ladder:
          - when: "an outstanding disconnect notice, the latest bill issued after it, and a returned payment in the twelve months ending on the transfer day"
            method: "the latest period's service fees and late payment charges are held back"
          - when: "an outstanding disconnect notice, the latest bill issued after it, and no returned payment in those twelve months"
            method: "the latest period's service fees alone are held back"
          - when: "otherwise (no notice, or the latest bill issued before it)"
            method: "no charge is held back"
        baseline:
          charges_selected: "0"
        evidence: [history, date, cross_category]
        cross_difficulty: service
      - id: charge_hold_by_late_record
        effect: parameter
        decides: charge_hold_share
        bindings: [transfer_late_count, charge_hold_share]
        ladder:
          - when: "charges are selected and frequent_late_count or more late payment charges were billed in the twelve months"
            value: "K('fee_hold_share_frequent')"
          - when: "charges are selected and fewer late payment charges were billed"
            value: "K('fee_hold_share_occasional')"
          - when: "otherwise (no charge selected)"
            value: "0"
        baseline:
          charge_hold_share: "0"
        evidence: [history, cross_category]
        cross_difficulty: service
      - id: pledge_held_back_by_agency
        effect: parameter
        decides: pledge_agency_share
        bindings: [pledge_recorded, pledge_agency, pledge_value, pledge_in_lookback, pledge_agency_share]
        ladder:
          - when: "the latest pledge within assistance_pledge_lookback_days is from county emergency assistance or the Salvation Army"
            value: "1 (the whole pledge)"
          - when: "the latest pledge within that lookback is a LIHEAP pledge"
            value: "K('liheap_reserve_share')"
          - when: "otherwise (an Operation Round Up pledge or no pledge)"
            value: "0"
        baseline:
          pledge_agency_share: "0"
        evidence: [history, date, cross_category]
        cross_difficulty: service
      - id: pledge_hold_by_age
        effect: parameter
        decides: pledge_age_share
        bindings: [transfer_pledge_age, transfer_hold_days, pledge_age_share]
        ladder:
          - when: "the latest pledge within the lookback was recorded within the schedule's assistance_pledge_hold_days calendar days before the transfer day"
            value: "1"
          - when: "it is older than that but within the tier's assistance_pledge_lookback_days"
            value: "K('older_pledge_hold_share')"
          - when: "otherwise (no pledge within the lookback)"
            value: "0"
        baseline:
          pledge_age_share: "0"
        evidence: [date, tier_param, cross_category]
        cross_difficulty: service
    baseline:
      rule: >-
        Under the standard method nothing is held back from the arranged amount: no charge billed since a disconnect
        notice and no energy assistance pledge. The amount moved into the agreement is the
        arranged amount recorded on acceptance less what is held back from it, never below zero, rounded half up to
        the cent once at the end.
      params: []
    inputs:
      history:
        - {category: service, table: service_charges, aggregate: sum, field: amount, filters: {event_type: service_fee}}
        - {category: service, table: service_charges, aggregate: count, field: charge_id, within_months: 12, filters: {event_type: service_late_charge}}
      cross_category: [service]
