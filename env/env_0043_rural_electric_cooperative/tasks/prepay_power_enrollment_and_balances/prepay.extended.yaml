- id: prepay_ext_restore_payment
  base_policy_refs:
  - prepay_evt_activation
  - prepay_evt_payment_split
  - prepay_evt_disconnect_reconnect
  overwrite: []
  trigger: on_request
  subject:
  - prepay_payment
  computes: gross_payment_amount
  target_tool: make_restore_payment_2eb3ad28
  params:
    repeat_target_cushion: 10.0
    cushion_days_rare: 6
    cushion_days_some: 4
    reconnect_cushion_repeat: 2
    reconnect_cushion_single: 1
    patronage_years_long: 25
    patronage_years_mid: 10
    patronage_cushion_long: 2
    patronage_cushion_mid: 1
  rule: >-
    The restore payment is the member's own payment that brings a PrePay Power meter disconnected for low balance
    back on, on an enrollment that carries no arrears balance; it is credited in full to the prepaid balance and
    carries no recovery portion. The restore payment is not quoted until the prepaid balance carries the meter error
    refund for every meter test of the underlying service account that found the meter fast. The restore payment
    is not quoted before the low-balance alert amount owed a reset after the latest low-balance disconnection has
    been reset. A window of a stated number of months takes the records dated after the same day of the month that
    many months before the current date, through the current date. The restore payment the desk quotes is the restore
    target less the prepaid balance standing on the enrollment, plus the restore cushion, rounded to the cent, never
    less than the tier's min_payment_amount and never more than its max_payment_amount. The restore target is the
    tier's reconnect_threshold_balance. The restore cushion is the cushion days multiplied by the cushion daily
    cost, rounded to the cent, and the cushion days are zero. The cushion daily cost is the total of the enrollment's
    daily charge lines in the one-month window divided by the number of service days those lines cover in that window.
    Where the enrollment was disconnected for low balance at least twice in the one-month window and its low-balance
    alert amount is above the reconnect threshold, the restore target is instead the low-balance alert amount; where
    it was disconnected at least twice in that window and its alert amount is at or below the reconnect threshold,
    the restore target is instead the reconnect threshold plus repeat_target_cushion; an enrollment in any other
    situation keeps the reconnect threshold. Where the enrollment received at most one payment in the one-month
    window, the cushion days are instead cushion_days_rare; where it received two or three payments in that window,
    the cushion days are instead cushion_days_some; with four or more payments the cushion days stay at zero. Where
    the underlying service account was billed two or more reconnect fees in the twenty-four-month window, the cushion
    days are increased by reconnect_cushion_repeat; where it was billed exactly one, they are increased by reconnect_cushion_single;
    with none they are not increased for reconnections. Where the member's capital credit records carry distribution-margin
    allocations (one is booked for each patronage year) for at least patronage_years_long patronage years, the cushion
    days are reduced by patronage_cushion_long; where they carry such allocations for at least patronage_years_mid
    but fewer, the cushion days are reduced by patronage_cushion_mid; with fewer patronage years they are not reduced;
    the cushion days are never fewer than zero. Where an energy assistance pledge from LIHEAP or county emergency
    assistance was recorded on the underlying service account in the one-month window, the restore cushion is instead
    waived, because the agency's committed payment carries the enrollment; where no such pledge was recorded but
    one from the Salvation Army or Operation Round Up was, the restore cushion instead covers only the fixed charges,
    the cushion days multiplied by the tier's daily_facility_charge, rounded to the cent, because the grant will
    meet the usage; with no pledge in that window the cushion is the cushion days multiplied by the cushion daily
    cost.
  prerequisite:
  - problem: prepay_ext_meter_error_refund
    kind: value_input
    gate: balance_now
    form: state
    policy_source: >-
      The restore payment is not quoted until the prepaid balance carries the meter error refund for every meter
      test of the underlying service account that found the meter fast.
    condition: >-
      The enrollment's PrePay ledger carries a meter-error-refund credit adjustment whose source is each meter test
      of the underlying service account with result fast, and the prepaid balance includes it.
    resolved_by: post_meter_error_refund_29b7beca
    effect: >-
      The refund raises the prepaid balance standing on the enrollment, so the restore payment (restore target less
      that balance plus the cushion) falls by the refunded amount.
  - problem: prepay_ext_disconnect_alert_reset
    kind: value_input
    gate: alert_amount
    form: action
    policy_source: >-
      The restore payment is not quoted before the low-balance alert amount owed a reset after the latest low-balance
      disconnection has been reset.
    fallback_reason: >-
      The reset leaves only a changed alert amount on the enrollment; a figure on the account does not show whether
      it is the reset for the latest disconnection or an amount the member or an earlier reset set, so no record-visible
      state singles out the reset write and the sentence names the action.
    condition: >-
      The enrollment's low-balance alert amount equals the reset figure the alert reset rule gives for the latest
      low-balance disconnection.
    resolved_by: reset_low_balance_alert_c29238fa
    effect: >-
      The reset raises the low-balance alert amount, which is the restore target of an enrollment disconnected at
      least twice in the one-month window whose alert amount is above the reconnect threshold, so the restore payment
      rises by the increase.
  cross_category:
  - category: service
    as: history
    reads:
    - service_charges.charge_component
    - service_charges.charge_date
    - service_payments.assistance_agency
    - service_payments.payment_date
    note: >-
      Reconnect fees billed on the underlying service account add cushion days; an energy assistance pledge scales
      the cushion.
  - category: capital
    as: history
    reads:
    - capital_ledger.event_type
    - capital_ledger.allocation_source
    note: Distribution-margin allocation years reduce the cushion days.
  compute:
  - balance_now: F('prepaid_balance')
  - alert_amount: F('low_balance_alert_amount')
  - threshold: P('reconnect_threshold_balance')
  - disconnects_1m: >-
      COUNT('prepay_notifications', within_months=1, date_field='alert_timestamp', alert_type='disconnected')
  - restore_target: >-
      alert_amount if (disconnects_1m >= 2 and alert_amount > threshold) else (threshold + K('repeat_target_cushion')
      if (disconnects_1m >= 2 and alert_amount <= threshold) else threshold)
  - charges_1m: >-
      SUM('prepay_ledger','amount', within_months=1, date_field='entry_date', event_type='prepay_daily_charge')
  - days_1m: >-
      COUNT('prepay_ledger', within_months=1, date_field='entry_date', event_type='prepay_daily_charge', charge_component='energy_charge')
  - cushion_daily_cost: charges_1m / days_1m
  - payments_1m: >-
      COUNT('prepay_ledger', within_months=1, date_field='entry_date', event_type='prepay_payment')
  - frequency_days: >-
      K('cushion_days_rare') if payments_1m <= 1 else (K('cushion_days_some') if payments_1m <= 3 else 0)
  - reconnect_fees_24m: >-
      XCOUNT('service','service_charges', within_months=24, date_field='charge_date', event_type='service_fee',
      charge_component='reconnect_fee', service_account_id=F('service_account_id'))
  - reconnect_days: >-
      K('reconnect_cushion_repeat') if reconnect_fees_24m >= 2 else (K('reconnect_cushion_single') if reconnect_fees_24m
      == 1 else 0)
  - patronage_years: >-
      XCOUNT('capital','capital_ledger', event_type='capital_allocation', allocation_source='distribution_margin')
  - patronage_days: >-
      K('patronage_cushion_long') if patronage_years >= K('patronage_years_long') else (K('patronage_cushion_mid')
      if patronage_years >= K('patronage_years_mid') else 0)
  - cushion_days: MX(0, frequency_days + reconnect_days - patronage_days)
  - pledge_government: >-
      XSUM('service','service_payments','amount', within_months=1, date_field='payment_date', event_type='service_assistance_pledge',
      assistance_agency='liheap', service_account_id=F('service_account_id')) + XSUM('service','service_payments','amount',
      within_months=1, date_field='payment_date', event_type='service_assistance_pledge', assistance_agency='county_emergency_assistance',
      service_account_id=F('service_account_id'))
  - pledge_charity: >-
      XSUM('service','service_payments','amount', within_months=1, date_field='payment_date', event_type='service_assistance_pledge',
      assistance_agency='salvation_army', service_account_id=F('service_account_id')) + XSUM('service','service_payments','amount',
      within_months=1, date_field='payment_date', event_type='service_assistance_pledge', assistance_agency='operation_round_up',
      service_account_id=F('service_account_id'))
  - restore_cushion: >-
      0 if pledge_government > 0 else (RND(cushion_days * P('daily_facility_charge'), 2) if pledge_charity > 0 else
      RND(cushion_days * cushion_daily_cost, 2))
  - result: >-
      MN(P('max_payment_amount'), MX(P('min_payment_amount'), RND(restore_target - balance_now + restore_cushion,
      2)))
  compute_basis:
    balance_now: >-
      The restore payment is not quoted until the prepaid balance carries the meter error refund for every meter
      test of the underlying service account that found the meter fast.
    alert_amount: >-
      The restore payment is not quoted before the low-balance alert amount owed a reset after the latest low-balance
      disconnection has been reset.
    threshold: The restore target is the tier's reconnect_threshold_balance.
    disconnects_1m: >-
      Where the enrollment was disconnected for low balance at least twice in the one-month window and its low-balance
      alert amount is above the reconnect threshold, the restore target is instead the low-balance alert amount;
      where it was disconnected at least twice in that window and its alert amount is at or below the reconnect
      threshold, the restore target is instead the reconnect threshold plus repeat_target_cushion; an enrollment
      in any other situation keeps the reconnect threshold.
    restore_target: >-
      Where the enrollment was disconnected for low balance at least twice in the one-month window and its low-balance
      alert amount is above the reconnect threshold, the restore target is instead the low-balance alert amount;
      where it was disconnected at least twice in that window and its alert amount is at or below the reconnect
      threshold, the restore target is instead the reconnect threshold plus repeat_target_cushion; an enrollment
      in any other situation keeps the reconnect threshold.
    charges_1m: >-
      The cushion daily cost is the total of the enrollment's daily charge lines in the one-month window divided
      by the number of service days those lines cover in that window.
    days_1m: >-
      The cushion daily cost is the total of the enrollment's daily charge lines in the one-month window divided
      by the number of service days those lines cover in that window.
    cushion_daily_cost: >-
      The cushion daily cost is the total of the enrollment's daily charge lines in the one-month window divided
      by the number of service days those lines cover in that window.
    payments_1m: >-
      Where the enrollment received at most one payment in the one-month window, the cushion days are instead cushion_days_rare;
      where it received two or three payments in that window, the cushion days are instead cushion_days_some; with
      four or more payments the cushion days stay at zero.
    frequency_days: >-
      Where the enrollment received at most one payment in the one-month window, the cushion days are instead cushion_days_rare;
      where it received two or three payments in that window, the cushion days are instead cushion_days_some; with
      four or more payments the cushion days stay at zero.
    reconnect_fees_24m: >-
      Where the underlying service account was billed two or more reconnect fees in the twenty-four-month window,
      the cushion days are increased by reconnect_cushion_repeat; where it was billed exactly one, they are increased
      by reconnect_cushion_single; with none they are not increased for reconnections.
    reconnect_days: >-
      Where the underlying service account was billed two or more reconnect fees in the twenty-four-month window,
      the cushion days are increased by reconnect_cushion_repeat; where it was billed exactly one, they are increased
      by reconnect_cushion_single; with none they are not increased for reconnections.
    patronage_years: >-
      Where the member's capital credit records carry distribution-margin allocations (one is booked for each patronage
      year) for at least patronage_years_long patronage years, the cushion days are reduced by patronage_cushion_long;
      where they carry such allocations for at least patronage_years_mid but fewer, the cushion days are reduced
      by patronage_cushion_mid; with fewer patronage years they are not reduced; the cushion days are never fewer
      than zero.
    patronage_days: >-
      Where the member's capital credit records carry distribution-margin allocations (one is booked for each patronage
      year) for at least patronage_years_long patronage years, the cushion days are reduced by patronage_cushion_long;
      where they carry such allocations for at least patronage_years_mid but fewer, the cushion days are reduced
      by patronage_cushion_mid; with fewer patronage years they are not reduced; the cushion days are never fewer
      than zero.
    cushion_days: >-
      Where the member's capital credit records carry distribution-margin allocations (one is booked for each patronage
      year) for at least patronage_years_long patronage years, the cushion days are reduced by patronage_cushion_long;
      where they carry such allocations for at least patronage_years_mid but fewer, the cushion days are reduced
      by patronage_cushion_mid; with fewer patronage years they are not reduced; the cushion days are never fewer
      than zero.
    pledge_government: >-
      Where an energy assistance pledge from LIHEAP or county emergency assistance was recorded on the underlying
      service account in the one-month window, the restore cushion is instead waived, because the agency's committed
      payment carries the enrollment; where no such pledge was recorded but one from the Salvation Army or Operation
      Round Up was, the restore cushion instead covers only the fixed charges, the cushion days multiplied by the
      tier's daily_facility_charge, rounded to the cent, because the grant will meet the usage; with no pledge in
      that window the cushion is the cushion days multiplied by the cushion daily cost.
    pledge_charity: >-
      Where an energy assistance pledge from LIHEAP or county emergency assistance was recorded on the underlying
      service account in the one-month window, the restore cushion is instead waived, because the agency's committed
      payment carries the enrollment; where no such pledge was recorded but one from the Salvation Army or Operation
      Round Up was, the restore cushion instead covers only the fixed charges, the cushion days multiplied by the
      tier's daily_facility_charge, rounded to the cent, because the grant will meet the usage; with no pledge in
      that window the cushion is the cushion days multiplied by the cushion daily cost.
    restore_cushion: >-
      Where an energy assistance pledge from LIHEAP or county emergency assistance was recorded on the underlying
      service account in the one-month window, the restore cushion is instead waived, because the agency's committed
      payment carries the enrollment; where no such pledge was recorded but one from the Salvation Army or Operation
      Round Up was, the restore cushion instead covers only the fixed charges, the cushion days multiplied by the
      tier's daily_facility_charge, rounded to the cent, because the grant will meet the usage; with no pledge in
      that window the cushion is the cushion days multiplied by the cushion daily cost.
    result: >-
      The restore payment the desk quotes is the restore target less the prepaid balance standing on the enrollment,
      plus the restore cushion, rounded to the cent, never less than the tier's min_payment_amount and never more
      than its max_payment_amount.
  factors:
  - id: repeat_disconnection_restore_target
    effect: parameter
    decides: restore_target
    bindings:
    - disconnects_1m
    - restore_target
    ladder:
    - when: >-
        disconnected for low balance at least twice in the one-month window and the low-balance alert amount is
        above the reconnect threshold
      value: the low-balance alert amount
    - when: >-
        disconnected at least twice in that window and the alert amount is at or below the reconnect threshold
      value: P('reconnect_threshold_balance') + K('repeat_target_cushion')
    - when: otherwise
      value: P('reconnect_threshold_balance')
    baseline:
      restore_target: threshold
    evidence:
    - history
    cross_difficulty: null
  - id: payment_frequency_cushion_days
    effect: parameter
    decides: frequency_days
    bindings:
    - payments_1m
    - frequency_days
    ladder:
    - when: the enrollment received at most one payment in the one-month window
      value: K('cushion_days_rare')
    - when: it received two or three payments in that window
      value: K('cushion_days_some')
    - when: otherwise
      value: '0'
    baseline:
      frequency_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: reconnect_history_cushion_days
    effect: parameter
    decides: reconnect_days
    bindings:
    - reconnect_fees_24m
    - reconnect_days
    ladder:
    - when: >-
        the underlying service account was billed two or more reconnect fees in the twenty-four-month window
      value: K('reconnect_cushion_repeat')
    - when: it was billed exactly one
      value: K('reconnect_cushion_single')
    - when: otherwise
      value: '0'
    baseline:
      reconnect_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: patronage_cushion_days
    effect: parameter
    decides: patronage_days
    bindings:
    - patronage_years
    - patronage_days
    ladder:
    - when: >-
        the member's capital credit records carry distribution-margin allocations for at least patronage_years_long
        patronage years
      value: K('patronage_cushion_long')
    - when: they carry such allocations for at least patronage_years_mid but fewer
      value: K('patronage_cushion_mid')
    - when: otherwise
      value: '0'
    baseline:
      patronage_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: capital
  - id: assistance_pledge_cushion_method
    effect: method
    decides: restore_cushion
    bindings:
    - pledge_government
    - pledge_charity
    - restore_cushion
    ladder:
    - when: >-
        an energy assistance pledge from LIHEAP or county emergency assistance was recorded on the underlying service
        account in the one-month window
      method: the restore cushion is waived
    - when: >-
        no such pledge but one from the Salvation Army or Operation Round Up was recorded in that window
      method: >-
        the restore cushion covers only the fixed charges: the cushion days multiplied by the tier's daily_facility_charge
    - when: otherwise
      method: the restore cushion is the cushion days multiplied by the cushion daily cost
    baseline:
      restore_cushion: RND(cushion_days * cushion_daily_cost, 2)
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  baseline:
    rule: >-
      The restore payment is the member's own payment that brings a PrePay Power meter disconnected for low balance
      back on, on an enrollment that carries no arrears balance; it is credited in full to the prepaid balance and
      carries no recovery portion. The restore payment the desk quotes is the restore target less the prepaid balance
      standing on the enrollment, plus the restore cushion, rounded to the cent, never less than the tier's min_payment_amount
      and never more than its max_payment_amount. The restore target is the tier's reconnect_threshold_balance.
      The restore cushion is the cushion days multiplied by the cushion daily cost, rounded to the cent, and the
      cushion days are zero. The cushion daily cost is the total of the enrollment's daily charge lines in the one-month
      window divided by the number of service days those lines cover in that window.
    params:
    - reconnect_threshold_balance
    - min_payment_amount
    - max_payment_amount
  inputs:
    history:
    - table: prepay_notifications
      aggregate: count
      field: notification_id
      within_months: 1
      filters:
        alert_type: disconnected
    - table: prepay_ledger
      aggregate: sum
      field: amount
      within_months: 1
      filters:
        event_type: prepay_daily_charge
    - table: prepay_ledger
      aggregate: count
      field: ledger_entry_id
      within_months: 1
      filters:
        event_type: prepay_payment
    - category: service
      table: service_charges
      aggregate: count
      field: charge_id
      within_months: 24
      filters:
        event_type: service_fee
        charge_component: reconnect_fee
    - category: service
      table: service_payments
      aggregate: sum
      field: amount
      within_months: 1
      filters:
        event_type: service_assistance_pledge
    - category: capital
      table: capital_ledger
      aggregate: count
      field: capital_entry_id
      filters:
        event_type: capital_allocation
    cross_category:
    - service
    - capital
