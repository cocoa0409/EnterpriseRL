        the latest payment came in cash at an office or at a payment kiosk and at least habit_payments payments
        in the three-month window came by those channels
      value: K('cash_cover_days')
    - when: otherwise
      value: K('standard_cover_days')
    baseline:
      channel_cover_days: K('standard_cover_days')
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: opening_daily_cost_basis
    effect: method
    decides: opening_daily_cost
    bindings:
    - bills_12m
    - usage_13m
    - usage_12m
    - usage_6m
    - year_before_bill
    - opening_daily_cost
    ladder:
    - when: >-
        the enrolled service account carries at least full_year_bills standard bills in the twelve-month window
      method: >-
        the opening daily cost is the larger of the most recent bill's usage lines and the usage lines dated in
        the thirteen-month window but not in the twelve-month window, divided by standard_bill_days
    - when: >-
        it carries at least half_year_bills but fewer than full_year_bills standard bills in the twelve-month window
      method: >-
        the opening daily cost is the usage lines in the six-month window divided by half_year_days
    - when: otherwise
      method: the opening daily cost is the most recent bill's usage lines divided by standard_bill_days
    baseline:
      opening_daily_cost: usage_last_bill / K('standard_bill_days')
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: medical_certificate_cover_days
    effect: parameter
    decides: medical_days
    bindings:
    - certificates_12m
    - certificates_24m
    - medical_days
    ladder:
    - when: >-
        a medical certificate for the enrolled service account was received in the twelve-month window
      value: K('medical_days_recent')
    - when: one was received in the twenty-four-month window but none in the twelve-month window
      value: K('medical_days_earlier')
    - when: otherwise
      value: '0'
    baseline:
      medical_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: arrangement_history_cover_days
    effect: parameter
    decides: arrangement_days
    bindings:
    - defaults_24m
    - missed_24m
    - arrangement_days
    ladder:
    - when: >-
        a payment arrangement of the member had its unbilled balance billed back for default in the twenty-four-month
        window
      value: K('arrangement_days_default')
    - when: >-
        no arrangement of the member was billed back for default in that window but an installment of one was missed
        in it
      value: K('arrangement_days_missed')
    - when: otherwise
      value: '0'
    baseline:
      arrangement_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: arrange
  - id: late_charge_cover_days
    effect: parameter
    decides: late_days
    bindings:
    - late_charges_12m
    - late_days
    ladder:
    - when: >-
        at least late_count_frequent late payment charges were billed on the enrolled service account in the twelve-month
        window
      value: K('late_days_frequent')
    - when: at least one but fewer than late_count_frequent were
      value: K('late_days_occasional')
    - when: otherwise
      value: '0'
    baseline:
      late_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  baseline:
    rule: >-
      The activation payment is the member's own payment that starts PrePay Power on an enrollment awaiting activation;
      it is credited in full to the prepaid balance and carries no recovery portion. The activation payment the
      desk quotes is the opening target less the prepaid balance standing on the enrollment, rounded to the cent,
      raised to the tier's activation_payment_min when it comes to less and lowered to the tier's max_payment_amount
      when it comes to more. The opening target is the cover days multiplied by the opening daily cost, rounded
      to the cent. The cover days are standard_cover_days. The opening daily cost is the total of the usage lines
      of the most recent standard bill of the enrolled service account divided by standard_bill_days.
    params:
    - standard_cover_days
    - standard_bill_days
    - activation_payment_min
    - max_payment_amount
  inputs:
    history:
    - category: service
      table: service_charges
      aggregate: sum
      field: amount
      within_months: 13
      filters:
        event_type: service_usage_charge
    - category: service
      table: service_charges
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: service_usage_charge
    - category: service
      table: service_payments
      aggregate: latest
      field: payment_channel
      filters:
        event_type: service_payment
    - category: service
      table: service_payments
      aggregate: count
      field: payment_id
