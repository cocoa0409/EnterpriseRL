- id: prepay_ext_activation_payment
  base_policy_refs:
  - prepay_evt_activation
  - prepay_evt_payment_split
  overwrite: []
  trigger: on_request
  subject:
  - prepay_payment
  computes: gross_payment_amount
  target_tool: make_activation_payment_0416a855
  params:
    standard_cover_days: 7
    check_cover_days: 14
    cash_cover_days: 10
    habit_payments: 2
    standard_bill_days: 30
    half_year_days: 182
    full_year_bills: 12
    half_year_bills: 6
    medical_days_recent: 4
    medical_days_earlier: 2
    arrangement_days_default: 5
    arrangement_days_missed: 2
    late_count_frequent: 3
    late_days_frequent: 3
    late_days_occasional: 1
  rule: >-
    The activation payment is the member's own payment that starts PrePay Power on an enrollment awaiting activation;
    it is credited in full to the prepaid balance and carries no recovery portion. The activation payment is quoted
    only after the prepaid balance of the enrollment carries the carried-in credit for a credit balance that stood
    on the enrolled service account when the enrollment was taken. Every month window named in this rule covers
    the records dated after the same day of the month that many months before the current date, up to and including
    the current date. The activation payment the desk quotes is the opening target less the prepaid balance standing
    on the enrollment, rounded to the cent, raised to the tier's activation_payment_min when it comes to less and
    lowered to the tier's max_payment_amount when it comes to more. The opening target is the cover days multiplied
    by the opening daily cost, rounded to the cent. The cover days are standard_cover_days. The opening daily cost
    is the total of the usage lines of the most recent standard bill of the enrolled service account divided by
    standard_bill_days. Where the latest payment to the enrolled service account came by mailed check, office check
    or money order and at least habit_payments payments in the three-month window came by those channels, the cover
    days are check_cover_days instead; where the latest payment came in cash at an office or at a payment kiosk
    and at least habit_payments payments in the three-month window came by those channels, the cover days are cash_cover_days
    instead; with any other payment record the cover days stay at standard_cover_days. Where the enrolled service
    account carries at least full_year_bills standard bills in the twelve-month window, the opening daily cost is
    instead the larger of the total of the usage lines of the most recent bill and the total of the usage lines
    dated in the thirteen-month window but not in the twelve-month window, divided by standard_bill_days; where
    it carries at least half_year_bills but fewer than full_year_bills standard bills in the twelve-month window,
    the opening daily cost is instead the total of the usage lines in the six-month window divided by half_year_days;
    an account in any other situation keeps the most recent bill's daily cost. Where a medical certificate for the
    enrolled service account was received in the twelve-month window, the cover days are increased by medical_days_recent;
    where one was received in the twenty-four-month window but none in the twelve-month window, the cover days are
    increased by medical_days_earlier; with no medical certificate received in the twenty-four-month window the
    cover days are not increased for a certificate. Where a payment arrangement of the member had its unbilled balance
    billed back for default in the twenty-four-month window, the cover days are increased by arrangement_days_default;
    where no arrangement of the member was billed back for default in that window but an installment of one was
    missed in it, the cover days are increased by arrangement_days_missed; with neither the cover days are not increased
    for arrangements. Where at least late_count_frequent late payment charges were billed on the enrolled service
    account in the twelve-month window, the cover days are increased by late_days_frequent; where at least one but
    fewer than late_count_frequent were, the cover days are increased by late_days_occasional; with none the cover
    days are not increased for late charges. The cover days set by the payment record and the increases for certificates,
    arrangements and late charges are added together before they multiply the opening daily cost.
  prerequisite:
  - problem: prepay_ext_postpaid_credit_carry_in
    kind: value_input
    gate: balance_on_enrollment
    form: state
    policy_source: >-
      The activation payment is quoted only after the prepaid balance of the enrollment carries the carried-in credit
      for a credit balance that stood on the enrolled service account when the enrollment was taken.
    condition: >-
      The enrollment's PrePay ledger carries a credit-adjustment entry with the reason carried-in standard-billing
      credit whose source is the enrolled service account, and the prepaid balance includes it.
    resolved_by: post_carried_credit_69e6c97d
    effect: >-
      Booking the carried-in credit raises the prepaid balance standing on the enrollment by the credited amount,
      so the quoted activation payment (opening target less that balance) falls by the same amount within the tier's
      minimum and maximum.
  cross_category:
  - category: service
    as: history
    reads:
    - service_charges.amount
    - service_charges.charge_date
    - service_charges.billing_period
    - service_charges.event_type
    - service_payments.payment_channel
    - service_payments.payment_date
    - service_certificates.received_date
    note: >-
      The standard bills decide the opening daily cost; the payment channels, medical certificates and late charges
      of the enrolled service account decide the cover days.
  - category: arrange
    as: history
    reads:
    - arrange_ledger.event_type
    - arrange_ledger.rebill_reason
    - arrange_ledger.entry_date
    note: Defaults and missed installments on the member's payment arrangements add cover days.
  compute:
  - balance_on_enrollment: F('prepaid_balance')
  - last_bill_period: >-
      XLATEST('service','service_charges','billing_period', date_field='charge_date', event_type='service_usage_charge',
      service_account_id=F('service_account_id'))
  - usage_last_bill: >-
      XSUM('service','service_charges','amount', event_type='service_usage_charge', billing_period=last_bill_period,
      service_account_id=F('service_account_id'))
  - bills_12m: >-
      XCOUNT('service','service_charges', within_months=12, date_field='charge_date', event_type='service_usage_charge',
      charge_component='energy_charge', service_account_id=F('service_account_id'))
  - usage_13m: >-
      XSUM('service','service_charges','amount', within_months=13, date_field='charge_date', event_type='service_usage_charge',
      service_account_id=F('service_account_id'))
  - usage_12m: >-
      XSUM('service','service_charges','amount', within_months=12, date_field='charge_date', event_type='service_usage_charge',
      service_account_id=F('service_account_id'))
  - usage_6m: >-
      XSUM('service','service_charges','amount', within_months=6, date_field='charge_date', event_type='service_usage_charge',
      service_account_id=F('service_account_id'))
  - year_before_bill: usage_13m - usage_12m
  - opening_daily_cost: >-
      MX(usage_last_bill, year_before_bill) / K('standard_bill_days') if bills_12m >= K('full_year_bills') else
      (usage_6m / K('half_year_days') if bills_12m >= K('half_year_bills') else usage_last_bill / K('standard_bill_days'))
  - latest_channel: >-
      XLATEST('service','service_payments','payment_channel', date_field='payment_date', event_type='service_payment',
      service_account_id=F('service_account_id'))
  - check_payments_3m: >-
      XCOUNT('service','service_payments', within_months=3, date_field='payment_date', event_type='service_payment',
      payment_channel='mail_check', service_account_id=F('service_account_id')) + XCOUNT('service','service_payments',
      within_months=3, date_field='payment_date', event_type='service_payment', payment_channel='office_check',
      service_account_id=F('service_account_id')) + XCOUNT('service','service_payments', within_months=3, date_field='payment_date',
      event_type='service_payment', payment_channel='money_order', service_account_id=F('service_account_id'))
  - cash_payments_3m: >-
      XCOUNT('service','service_payments', within_months=3, date_field='payment_date', event_type='service_payment',
      payment_channel='office_cash', service_account_id=F('service_account_id')) + XCOUNT('service','service_payments',
      within_months=3, date_field='payment_date', event_type='service_payment', payment_channel='payment_kiosk',
      service_account_id=F('service_account_id'))
  - channel_cover_days: >-
      K('check_cover_days') if ((latest_channel == 'mail_check' or latest_channel == 'office_check' or latest_channel
      == 'money_order') and check_payments_3m >= K('habit_payments')) else (K('cash_cover_days') if ((latest_channel
      == 'office_cash' or latest_channel == 'payment_kiosk') and cash_payments_3m >= K('habit_payments')) else K('standard_cover_days'))
  - certificates_12m: >-
      XCOUNT('service','service_certificates', within_months=12, date_field='received_date', event_type='service_medical_certificate',
      service_account_id=F('service_account_id'))
  - certificates_24m: >-
      XCOUNT('service','service_certificates', within_months=24, date_field='received_date', event_type='service_medical_certificate',
      service_account_id=F('service_account_id'))
  - medical_days: >-
      K('medical_days_recent') if certificates_12m >= 1 else (K('medical_days_earlier') if certificates_24m >= 1
      else 0)
  - defaults_24m: >-
      XCOUNT('arrange','arrange_ledger', within_months=24, date_field='entry_date', event_type='arrange_balance_rebill',
      rebill_reason='default')
  - missed_24m: >-
      XCOUNT('arrange','arrange_ledger', within_months=24, date_field='entry_date', event_type='arrange_installment_missed')
  - arrangement_days: >-
      K('arrangement_days_default') if defaults_24m >= 1 else (K('arrangement_days_missed') if missed_24m >= 1 else
      0)
  - late_charges_12m: >-
      XCOUNT('service','service_charges', within_months=12, date_field='charge_date', event_type='service_late_charge',
      service_account_id=F('service_account_id'))
  - late_days: >-
      K('late_days_frequent') if late_charges_12m >= K('late_count_frequent') else (K('late_days_occasional') if
      late_charges_12m >= 1 else 0)
  - cover_days: channel_cover_days + medical_days + arrangement_days + late_days
  - opening_target: RND(cover_days * opening_daily_cost, 2)
  - result: >-
      MN(P('max_payment_amount'), MX(P('activation_payment_min'), RND(opening_target - balance_on_enrollment, 2)))
