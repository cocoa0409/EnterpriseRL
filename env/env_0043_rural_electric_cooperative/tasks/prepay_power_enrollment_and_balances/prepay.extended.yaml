- id: prepay_ext_disconnect_alert_reset
  base_policy_refs:
  - prepay_evt_alerts
  - prepay_evt_disconnect_reconnect
  overwrite: []
  trigger: state_due
  subject:
  - prepay_alert_settings
  computes: low_balance_alert_amount
  target_tool: reset_low_balance_alert_c29238fa
  params:
    warning_days_frequent: 7
    warning_days_repeat: 5
    habit_payments: 2
    lag_days_check: 2
    lag_days_cash: 1
    medical_warning_recent: 3
    medical_warning_earlier: 1
    returned_warning_repeat: 2
    returned_warning_single: 1
    arrangement_warning_default: 2
    arrangement_warning_missed: 1
  rule: >-
    An enrollment disconnected for low balance that has been disconnected for low balance at least twice in the
    one-month window is owed a reset of its low-balance alert amount, so that the next alert comes with enough warning
    before another disconnection. A window of a stated number of months takes the records dated after the same day
    of the month that many months before the current date, through the current date. The reset alert amount is the
    warning days multiplied by the alert daily cost, rounded up to the next whole dollar, never lower than the alert
    amount the enrollment already carries, and kept within the tier's low_balance_alert_min and low_balance_alert_max.
    The warning days are the tier's disconnect_warning_days. The alert daily cost is the total of the enrollment's
    daily charge lines in the one-month window divided by the number of service days those lines cover in that window.
    Where the enrollment was activated fewer than two whole months before the current date, the alert daily cost
    is instead the total of all of its daily charge lines since the activation divided by the number of service
    days since the activation; where it was activated at least six whole months before the current date, the alert
    daily cost is instead the total of its daily charge lines in the three-month window divided by the service days
    in that window; an enrollment in any other situation keeps the one-month figure. Where the enrollment was disconnected
    for low balance at least max_disconnects_per_30_days times in the one-month window, the warning days are instead
    warning_days_frequent; where it was disconnected for low balance more than twice but fewer than max_disconnects_per_30_days
    times in that window, the warning days are instead warning_days_repeat; with two disconnections in that window
    the warning days stay at disconnect_warning_days. Where the latest payment to the enrollment was made by office
    check and at least habit_payments payments in the one-month window were made that way, the warning days are
    increased by lag_days_check; where the latest payment was made in cash at an office or at a payment kiosk and
    at least habit_payments payments in the one-month window were made those ways, the warning days are increased
    by lag_days_cash; with any other payment record they are not increased for payment lag. Where a medical certificate
    for the underlying service account was received in the twelve-month window, the warning days are increased by
    medical_warning_recent; where one was received in the twenty-four-month window but none in the twelve-month
    window, they are increased by medical_warning_earlier; with none in the twenty-four-month window they are not
    increased for a certificate. Where two or more payments to the underlying service account were returned unpaid
    in the twelve-month window, the warning days are increased by returned_warning_repeat; where exactly one was,
    they are increased by returned_warning_single; with none they are not increased for returned payments. Where
    a payment arrangement of the member was billed back for default in the twenty-four-month window, the warning
    days are increased by arrangement_warning_default; where none was billed back for default in that window but
    an installment of one was missed in it, they are increased by arrangement_warning_missed; with neither they
    are not increased for arrangements. The warning days and every increase are added together before they multiply
    the alert daily cost.
  prerequisite: []
  cross_category:
  - category: service
    as: history
    reads:
    - service_certificates.received_date
    - service_payments.event_type
    - service_payments.payment_date
    note: >-
      Medical certificates and returned payments on the underlying service account add warning days.
  - category: arrange
    as: history
    reads:
    - arrange_ledger.event_type
    - arrange_ledger.rebill_reason
    - arrange_ledger.entry_date
    note: Defaults and missed installments on the member's arrangements add warning days.
  compute:
  - current_alert: F('low_balance_alert_amount')
  - charges_1m: >-
      SUM('prepay_ledger','amount', within_months=1, date_field='entry_date', event_type='prepay_daily_charge')
  - days_1m: >-
      COUNT('prepay_ledger', within_months=1, date_field='entry_date', event_type='prepay_daily_charge', charge_component='energy_charge')
  - months_on_prepay: MONTHS(F('activated_date'), NOW)
  - charges_all: SUM('prepay_ledger','amount', date_field='entry_date', event_type='prepay_daily_charge')
  - days_all: >-
      COUNT('prepay_ledger', date_field='entry_date', event_type='prepay_daily_charge', charge_component='energy_charge')
  - charges_3m: >-
      SUM('prepay_ledger','amount', within_months=3, date_field='entry_date', event_type='prepay_daily_charge')
  - days_3m: >-
      COUNT('prepay_ledger', within_months=3, date_field='entry_date', event_type='prepay_daily_charge', charge_component='energy_charge')
  - alert_daily_cost: >-
      charges_all / days_all if months_on_prepay < 2 else (charges_3m / days_3m if months_on_prepay >= 6 else charges_1m
      / days_1m)
  - disconnects_1m: >-
      COUNT('prepay_notifications', within_months=1, date_field='alert_timestamp', alert_type='disconnected')
  - warning_days: >-
      K('warning_days_frequent') if disconnects_1m >= P('max_disconnects_per_30_days') else (K('warning_days_repeat')
      if disconnects_1m > 2 else P('disconnect_warning_days'))
  - latest_channel: >-
      LATEST('prepay_ledger','payment_channel', date_field='entry_date', event_type='prepay_payment')
  - check_payments_1m: >-
      COUNT('prepay_ledger', within_months=1, date_field='entry_date', event_type='prepay_payment', payment_channel='office_check')
  - cash_payments_1m: >-
      COUNT('prepay_ledger', within_months=1, date_field='entry_date', event_type='prepay_payment', payment_channel='office_cash')
      + COUNT('prepay_ledger', within_months=1, date_field='entry_date', event_type='prepay_payment', payment_channel='payment_kiosk')
  - lag_days: >-
      K('lag_days_check') if (latest_channel == 'office_check' and check_payments_1m >= K('habit_payments')) else
      (K('lag_days_cash') if ((latest_channel == 'office_cash' or latest_channel == 'payment_kiosk') and cash_payments_1m
      >= K('habit_payments')) else 0)
  - certificates_12m: >-
      XCOUNT('service','service_certificates', within_months=12, date_field='received_date', event_type='service_medical_certificate',
      service_account_id=F('service_account_id'))
  - certificates_24m: >-
      XCOUNT('service','service_certificates', within_months=24, date_field='received_date', event_type='service_medical_certificate',
      service_account_id=F('service_account_id'))
  - medical_days: >-
      K('medical_warning_recent') if certificates_12m >= 1 else (K('medical_warning_earlier') if certificates_24m
      >= 1 else 0)
  - returns_12m: >-
      XCOUNT('service','service_payments', within_months=12, date_field='payment_date', event_type='service_payment_return',
      service_account_id=F('service_account_id'))
  - returned_days: >-
      K('returned_warning_repeat') if returns_12m >= 2 else (K('returned_warning_single') if returns_12m == 1 else
      0)
  - defaults_24m: >-
      XCOUNT('arrange','arrange_ledger', within_months=24, date_field='entry_date', event_type='arrange_balance_rebill',
      rebill_reason='default')
  - missed_24m: >-
      XCOUNT('arrange','arrange_ledger', within_months=24, date_field='entry_date', event_type='arrange_installment_missed')
  - arrangement_days: >-
      K('arrangement_warning_default') if defaults_24m >= 1 else (K('arrangement_warning_missed') if missed_24m
      >= 1 else 0)
  - total_days: warning_days + lag_days + medical_days + returned_days + arrangement_days
  - raw_amount: total_days * alert_daily_cost
  - whole_dollars: int(raw_amount) + (1 if raw_amount > int(raw_amount) else 0)
  - result: >-
      MN(P('low_balance_alert_max'), MX(P('low_balance_alert_min'), MX(current_alert, whole_dollars)))
  compute_basis:
