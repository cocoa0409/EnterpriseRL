  factors:
  - id: alert_daily_cost_window
    effect: method
    decides: alert_daily_cost
    bindings:
    - months_on_prepay
    - charges_all
    - days_all
    - charges_3m
    - days_3m
    - alert_daily_cost
    ladder:
    - when: the enrollment was activated fewer than two whole months before the current date
      method: >-
        all daily charge lines since the activation divided by the service days since the activation
    - when: it was activated at least six whole months before the current date
      method: >-
        the daily charge lines in the three-month window divided by the service days in that window
    - when: otherwise
      method: the daily charge lines in the one-month window divided by the service days in that window
    baseline:
      alert_daily_cost: charges_1m / days_1m
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: repeat_disconnection_warning_days
    effect: parameter
    decides: warning_days
    bindings:
    - disconnects_1m
    - warning_days
    ladder:
    - when: >-
        disconnected for low balance at least max_disconnects_per_30_days times in the one-month window
      value: K('warning_days_frequent')
    - when: >-
        disconnected for low balance more than twice but fewer than max_disconnects_per_30_days times in that window
      value: K('warning_days_repeat')
    - when: otherwise
