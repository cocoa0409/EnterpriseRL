    bills_12m: >-
      Where the enrolled service account carries at least full_year_bills standard bills in the twelve-month window
      and the energy line of its most recent bill carries fewer kWh than the average energy line of the bills in
      that window, the reserve daily cost is instead the total of the usage lines in the twelve-month window divided
      by year_days; where it carries at least half_year_bills but fewer than full_year_bills standard bills in the
      twelve-month window, the reserve daily cost is instead the total of the usage lines in the six-month window
