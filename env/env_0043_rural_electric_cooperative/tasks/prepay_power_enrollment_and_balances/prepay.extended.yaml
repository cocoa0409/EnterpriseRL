      not reduced.
    reserve_days: >-
      The increases and reductions of the reserve days are applied together to the calendar days, after which the
      reserve days are never fewer than zero.
    cutover_reserve: >-
      The cut-over reserve, which keeps back the usage the enrolled service account used between its most recent
      standard bill and the enrollment, is the reserve days multiplied by the reserve daily cost, rounded to the
      cent.
    result: >-
      The carried-in credit is the credit balance of the enrolled service account less the cut-over reserve and
      less the uncleared-payment hold, rounded to the cent, and never less than zero.
  factors:
  - id: reserve_daily_cost_basis
    effect: method
    decides: reserve_daily_cost
    bindings:
    - bills_12m
    - kwh_12m
    - kwh_last_bill
    - usage_12m
    - usage_6m
    - reserve_daily_cost
    ladder:
    - when: >-
        the enrolled service account carries at least full_year_bills standard bills in the twelve-month window
        and its most recent bill's energy line carries fewer kWh than the average energy line of those bills
      method: >-
        the reserve daily cost is the total of the usage lines in the twelve-month window divided by year_days
    - when: >-
        the enrolled service account carries at least half_year_bills but fewer than full_year_bills standard bills
        in the twelve-month window
      method: >-
        the reserve daily cost is the total of the usage lines in the six-month window divided by half_year_days
    - when: otherwise
      method: the reserve daily cost is the most recent bill's usage lines divided by standard_bill_days
    baseline:
      reserve_daily_cost: usage_last_bill / K('standard_bill_days')
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: uncleared_payment_hold
    effect: parameter
    decides: uncleared_hold
    bindings:
    - latest_channel
    - latest_amount
    - latest_date
    - returns_12m
    - uncleared_hold
    ladder:
    - when: >-
        the latest payment came by mailed check, office check or electronic check, was posted in the one-month window,
        and a payment to the account was returned unpaid in the twelve-month window
      value: the whole of that latest payment
    - when: >-
        such a latest check or electronic check payment was posted in the one-month window and no payment was returned
        unpaid in the twelve-month window
      value: uncleared_share_pct percent of that payment, rounded to the cent
    - when: otherwise
      value: '0'
    baseline:
      uncleared_hold: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: service
  - id: late_charge_reserve_days
    effect: parameter
    decides: late_days
    bindings:
    - late_12m
    - late_days
    ladder:
    - when: >-
        at least late_count_frequent late payment charges were billed on the enrolled service account in the twelve-month
        window
      value: K('late_reserve_days_frequent')
    - when: at least one but fewer than late_count_frequent were
      value: K('late_reserve_days_occasional')
    - when: otherwise
      value: '0'
    baseline:
      late_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: reconnect_reserve_days
    effect: parameter
    decides: reconnect_days
    bindings:
    - reconnect_fees_24m
    - reconnect_days
    ladder:
    - when: >-
        the enrolled service account was billed two or more reconnect fees in the twenty-four-month window
      value: K('reconnect_reserve_days_repeat')
    - when: it was billed exactly one
      value: K('reconnect_reserve_days_single')
    - when: otherwise
      value: '0'
    baseline:
      reconnect_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: patronage_reserve_days
    effect: parameter
    decides: patronage_days
    bindings:
    - patronage_years
    - patronage_days
    ladder:
    - when: >-
        the member's capital credit records carry distribution-margin allocations for at least patronage_years_long
        patronage years
      value: K('patronage_days_long')
    - when: >-
        they carry such allocations for at least patronage_years_mid but fewer than patronage_years_long patronage
        years
      value: K('patronage_days_mid')
    - when: otherwise
      value: '0'
    baseline:
      patronage_days: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: capital
  baseline:
    rule: >-
      The carried-in credit is the credit balance of the enrolled service account less the cut-over reserve and
      less the uncleared-payment hold, rounded to the cent, and never less than zero. The credit balance is the
      amount by which the account balance of the enrolled service account stands below zero. The cut-over reserve,
      which keeps back the usage the enrolled service account used between its most recent standard bill and the
      enrollment, is the reserve days multiplied by the reserve daily cost, rounded to the cent. The reserve days
      are the calendar days from the bill date of the most recent standard bill of the enrolled service account
      to the enrollment date. The reserve daily cost is the total of the usage lines of the most recent standard
      bill of the enrolled service account divided by standard_bill_days. The uncleared-payment hold is zero.
    params:
    - standard_bill_days
  inputs:
