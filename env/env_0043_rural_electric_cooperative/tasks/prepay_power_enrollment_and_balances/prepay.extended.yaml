      aggregate: count
      field: arrange_entry_id
      within_months: 24
      filters:
        event_type: arrange_installment_missed
    cross_category:
    - service
    - arrange
- id: prepay_ext_meter_error_refund
  base_policy_refs:
  - prepay_evt_enrollment_transfers
  overwrite:
  - base_policy: prepay_evt_enrollment_transfers
    superseded_clause: >-
      A credit adjustment is posted only for a daily charge line shown to be wrong (billing_error_correction), a
      meter found fast on test (meter_error_refund), an estimated day later trued up by an actual read (estimated_read_correction),
      or a standard-billing credit balance carried in at enrollment (postpaid_credit_transfer), for the difference
      only and once per source record.
    replaced_by: >-
      The meter error refund is the overbilled amount plus the test-request courtesy and the disconnection courtesy,
      rounded to the cent.
  trigger: state_due
  subject:
  - prepay_credit_adjustment
  computes: refund_amount
  target_tool: post_meter_error_refund_29b7beca
  params:
    courtesy_tests_frequent: 15.0
    courtesy_tests_repeat: 7.5
    courtesy_disconnects_frequent: 10.0
    courtesy_disconnects_repeat: 5.0
    courtesy_tests_default: 0.0
    courtesy_disconnects_default: 0.0
  rule: >-
    When a meter test of the service account under a PrePay Power enrollment finds the meter fast beyond tolerance,
    the overbilling of the enrollment's daily charges is refunded to the prepaid balance as one meter error refund
    credit, booked once for the meter test with the meter test as its source; standard-billing periods before the
    activation are refunded on the service account, not here. A window of a stated number of months takes the daily
    charge lines dated after the same day of the month that many months before the current date, through the current
    date. The meter error refund is the overbilled amount plus the test-request courtesy and the disconnection courtesy,
    rounded to the cent. The overbilled amount is the refunded lines total multiplied by the overbilled share, rounded
    to the cent. The refund window is meter_error_rebill_max_months of the underlying rate schedule, counted as
    a window of that many months. The refunded lines total is the total of the energy lines of the enrollment's
    daily charges in the refund window. The overbilled share is the error the fast test found divided by one hundred
    plus that error. The test-request courtesy and the disconnection courtesy are each zero (courtesy_tests_default
    and courtesy_disconnects_default). Where an earlier meter test of the same service account found the meter within
    tolerance on or after the activation date and before the fast test, the refund window is instead the whole months
    from that earlier test to the current date, and never less than one month; where no such test exists and the
    enrollment was activated fewer than meter_error_rebill_max_months whole months before the current date, the
    refund window is instead one month more than the whole months since the activation; an enrollment in any other
    situation keeps meter_error_rebill_max_months. Where the underlying rate schedule bills sales tax and the power
    cost adjustment, the refunded lines total is instead the energy, power cost adjustment and sales tax lines in
    the refund window; where it bills the power cost adjustment but no sales tax, the refunded lines total is instead
    the energy and power cost adjustment lines in the refund window; a schedule in any other situation keeps the
    energy lines alone. Where an earlier meter test of the same service account found the meter within tolerance
    before the fast test with an error on the fast side, the error is taken to have grown between the two tests
    and the overbilled share is instead the average of the earlier error and the error found divided by one hundred
    plus that average; where there is no such earlier fast-side reading and the error found is below twice the meter
    accuracy tolerance, the overbilled share is instead the error found less the tolerance, divided by one hundred
    plus that difference; a test in any other situation keeps the error found over one hundred plus that error.
    Where the member asked for three or more meter tests of the service account in the twelve months before the
    current date, the test-request courtesy is instead courtesy_tests_frequent; where the member asked for exactly
    two, it is instead courtesy_tests_repeat; with one request it stays at zero. Where the enrollment was disconnected
    for low balance at least max_disconnects_per_30_days times in the refund window, the disconnection courtesy
    is instead courtesy_disconnects_frequent; where it was disconnected for low balance at least twice but fewer
    times in the refund window, it is instead courtesy_disconnects_repeat; with fewer disconnections it stays at
    zero.
  prerequisite: []
  cross_category:
  - category: service
    as: history
    reads:
    - service_trouble_reports.meter_test_result
    - service_trouble_reports.meter_error_pct
    - service_trouble_reports.resolution_date
    - service_trouble_reports.report_date
    - meter_accuracy_tolerance_pct
    - meter_error_rebill_max_months
    - sales_tax_pct
    - pca_applies
    note: >-
      The meter tests of the service account decide the error, the refund window, the overbilled share and the test-request
      courtesy; the rate schedule's tolerance, correction limit, tax and power cost adjustment decide which lines
      are refunded.
  compute:
  - error_found: >-
      XLATEST('service','service_trouble_reports','meter_error_pct', date_field='resolution_date', event_type='service_meter_test',
      meter_test_result='fast', service_account_id=F('service_account_id'))
  - tolerance: >-
      CPARAM('service','meter_accuracy_tolerance_pct', service_account_id=F('service_account_id'))
  - max_months: >-
      CPARAM('service','meter_error_rebill_max_months', service_account_id=F('service_account_id'))
  - fast_date: >-
      XLATEST('service','service_trouble_reports','resolution_date', date_field='resolution_date', event_type='service_meter_test',
      meter_test_result='fast', service_account_id=F('service_account_id'))
  - accurate_tests: >-
      XCOUNT('service','service_trouble_reports', event_type='service_meter_test', meter_test_result='within_tolerance',
      service_account_id=F('service_account_id'))
  - accurate_date: >-
      XLATEST('service','service_trouble_reports','resolution_date', date_field='resolution_date', event_type='service_meter_test',
      meter_test_result='within_tolerance', service_account_id=F('service_account_id'))
  - accurate_error: >-
      XLATEST('service','service_trouble_reports','meter_error_pct', date_field='resolution_date', event_type='service_meter_test',
      meter_test_result='within_tolerance', service_account_id=F('service_account_id'))
  - months_on_prepay: MONTHS(F('activated_date'), NOW)
  - refund_window_months: >-
      MX(1, MONTHS(accurate_date, NOW)) if (accurate_tests >= 1 and accurate_date >= F('activated_date') and accurate_date
      < fast_date) else (months_on_prepay + 1 if months_on_prepay < max_months else max_months)
  - energy_window: >-
      SUM('prepay_ledger','amount', within_months=refund_window_months, date_field='entry_date', event_type='prepay_daily_charge',
      charge_component='energy_charge')
  - pca_window: >-
      SUM('prepay_ledger','amount', within_months=refund_window_months, date_field='entry_date', event_type='prepay_daily_charge',
      charge_component='power_cost_adjustment')
  - tax_window: >-
      SUM('prepay_ledger','amount', within_months=refund_window_months, date_field='entry_date', event_type='prepay_daily_charge',
      charge_component='sales_tax')
  - tax_pct: CPARAM('service','sales_tax_pct', service_account_id=F('service_account_id'))
  - pca_billed: CPARAM('service','pca_applies', service_account_id=F('service_account_id'))
  - refunded_lines: >-
      energy_window + pca_window + tax_window if (tax_pct > 0 and pca_billed) else (energy_window + pca_window if
      (tax_pct == 0 and pca_billed) else energy_window)
  - error_share: >-
      ((error_found + accurate_error) / 2) / (100 + (error_found + accurate_error) / 2) if (accurate_tests >= 1
      and accurate_error > 0 and accurate_date < fast_date) else ((error_found - tolerance) / (100 + error_found
      - tolerance) if error_found < 2 * tolerance else error_found / (100 + error_found))
  - overbilled: RND(refunded_lines * error_share, 2)
  - tests_requested_12m: >-
      XCOUNT('service','service_trouble_reports', within_months=12, date_field='report_date', event_type='service_meter_test',
      service_account_id=F('service_account_id'))
  - test_request_courtesy: >-
      K('courtesy_tests_frequent') if tests_requested_12m >= 3 else (K('courtesy_tests_repeat') if tests_requested_12m
      == 2 else K('courtesy_tests_default'))
  - disconnects_window: >-
      COUNT('prepay_notifications', within_months=refund_window_months, date_field='alert_timestamp', alert_type='disconnected')
  - disconnection_courtesy: >-
      K('courtesy_disconnects_frequent') if disconnects_window >= P('max_disconnects_per_30_days') else (K('courtesy_disconnects_repeat')
      if disconnects_window >= 2 else K('courtesy_disconnects_default'))
  - result: RND(overbilled + test_request_courtesy + disconnection_courtesy, 2)
  compute_basis:
    error_found: >-
      The overbilled share is the error the fast test found divided by one hundred plus that error.
    tolerance: >-
      Where an earlier meter test of the same service account found the meter within tolerance before the fast test
      with an error on the fast side, the error is taken to have grown between the two tests and the overbilled
      share is instead the average of the earlier error and the error found divided by one hundred plus that average;
      where there is no such earlier fast-side reading and the error found is below twice the meter accuracy tolerance,
      the overbilled share is instead the error found less the tolerance, divided by one hundred plus that difference;
      a test in any other situation keeps the error found over one hundred plus that error.
    max_months: >-
      The refund window is meter_error_rebill_max_months of the underlying rate schedule, counted as a window of
      that many months.
    accurate_tests: >-
      Where an earlier meter test of the same service account found the meter within tolerance on or after the activation
      date and before the fast test, the refund window is instead the whole months from that earlier test to the
      current date, and never less than one month; where no such test exists and the enrollment was activated fewer
      than meter_error_rebill_max_months whole months before the current date, the refund window is instead one
      month more than the whole months since the activation; an enrollment in any other situation keeps meter_error_rebill_max_months.
    accurate_date: >-
      Where an earlier meter test of the same service account found the meter within tolerance on or after the activation
      date and before the fast test, the refund window is instead the whole months from that earlier test to the
      current date, and never less than one month; where no such test exists and the enrollment was activated fewer
      than meter_error_rebill_max_months whole months before the current date, the refund window is instead one
      month more than the whole months since the activation; an enrollment in any other situation keeps meter_error_rebill_max_months.
    accurate_error: >-
      Where an earlier meter test of the same service account found the meter within tolerance before the fast test
      with an error on the fast side, the error is taken to have grown between the two tests and the overbilled
      share is instead the average of the earlier error and the error found divided by one hundred plus that average;
      where there is no such earlier fast-side reading and the error found is below twice the meter accuracy tolerance,
      the overbilled share is instead the error found less the tolerance, divided by one hundred plus that difference;
      a test in any other situation keeps the error found over one hundred plus that error.
    months_on_prepay: >-
      Where an earlier meter test of the same service account found the meter within tolerance on or after the activation
      date and before the fast test, the refund window is instead the whole months from that earlier test to the
      current date, and never less than one month; where no such test exists and the enrollment was activated fewer
      than meter_error_rebill_max_months whole months before the current date, the refund window is instead one
      month more than the whole months since the activation; an enrollment in any other situation keeps meter_error_rebill_max_months.
    refund_window_months: >-
      Where an earlier meter test of the same service account found the meter within tolerance on or after the activation
      date and before the fast test, the refund window is instead the whole months from that earlier test to the
      current date, and never less than one month; where no such test exists and the enrollment was activated fewer
      than meter_error_rebill_max_months whole months before the current date, the refund window is instead one
      month more than the whole months since the activation; an enrollment in any other situation keeps meter_error_rebill_max_months.
    energy_window: >-
      The refunded lines total is the total of the energy lines of the enrollment's daily charges in the refund
      window.
    pca_window: >-
      Where the underlying rate schedule bills sales tax and the power cost adjustment, the refunded lines total
      is instead the energy, power cost adjustment and sales tax lines in the refund window; where it bills the
      power cost adjustment but no sales tax, the refunded lines total is instead the energy and power cost adjustment
      lines in the refund window; a schedule in any other situation keeps the energy lines alone.
    tax_window: >-
      Where the underlying rate schedule bills sales tax and the power cost adjustment, the refunded lines total
      is instead the energy, power cost adjustment and sales tax lines in the refund window; where it bills the
      power cost adjustment but no sales tax, the refunded lines total is instead the energy and power cost adjustment
      lines in the refund window; a schedule in any other situation keeps the energy lines alone.
    tax_pct: >-
      Where the underlying rate schedule bills sales tax and the power cost adjustment, the refunded lines total
      is instead the energy, power cost adjustment and sales tax lines in the refund window; where it bills the
      power cost adjustment but no sales tax, the refunded lines total is instead the energy and power cost adjustment
      lines in the refund window; a schedule in any other situation keeps the energy lines alone.
    pca_billed: >-
      Where the underlying rate schedule bills sales tax and the power cost adjustment, the refunded lines total
      is instead the energy, power cost adjustment and sales tax lines in the refund window; where it bills the
      power cost adjustment but no sales tax, the refunded lines total is instead the energy and power cost adjustment
      lines in the refund window; a schedule in any other situation keeps the energy lines alone.
    refunded_lines: >-
      Where the underlying rate schedule bills sales tax and the power cost adjustment, the refunded lines total
      is instead the energy, power cost adjustment and sales tax lines in the refund window; where it bills the
      power cost adjustment but no sales tax, the refunded lines total is instead the energy and power cost adjustment
      lines in the refund window; a schedule in any other situation keeps the energy lines alone.
    error_share: >-
      Where an earlier meter test of the same service account found the meter within tolerance before the fast test
      with an error on the fast side, the error is taken to have grown between the two tests and the overbilled
      share is instead the average of the earlier error and the error found divided by one hundred plus that average;
      where there is no such earlier fast-side reading and the error found is below twice the meter accuracy tolerance,
      the overbilled share is instead the error found less the tolerance, divided by one hundred plus that difference;
      a test in any other situation keeps the error found over one hundred plus that error.
    overbilled: >-
      The overbilled amount is the refunded lines total multiplied by the overbilled share, rounded to the cent.
    tests_requested_12m: >-
      Where the member asked for three or more meter tests of the service account in the twelve months before the
      current date, the test-request courtesy is instead courtesy_tests_frequent; where the member asked for exactly
      two, it is instead courtesy_tests_repeat; with one request it stays at zero.
    test_request_courtesy: >-
      Where the member asked for three or more meter tests of the service account in the twelve months before the
      current date, the test-request courtesy is instead courtesy_tests_frequent; where the member asked for exactly
      two, it is instead courtesy_tests_repeat; with one request it stays at zero.
    disconnects_window: >-
      Where the enrollment was disconnected for low balance at least max_disconnects_per_30_days times in the refund
      window, the disconnection courtesy is instead courtesy_disconnects_frequent; where it was disconnected for
      low balance at least twice but fewer times in the refund window, it is instead courtesy_disconnects_repeat;
      with fewer disconnections it stays at zero.
    disconnection_courtesy: >-
      Where the enrollment was disconnected for low balance at least max_disconnects_per_30_days times in the refund
      window, the disconnection courtesy is instead courtesy_disconnects_frequent; where it was disconnected for
      low balance at least twice but fewer times in the refund window, it is instead courtesy_disconnects_repeat;
      with fewer disconnections it stays at zero.
    result: >-
      The meter error refund is the overbilled amount plus the test-request courtesy and the disconnection courtesy,
      rounded to the cent.
    fast_date: >-
      Where an earlier meter test of the same service account found the meter within tolerance on or after the activation
      date and before the fast test, the refund window is instead the whole months from that earlier test to the
      current date, and never less than one month; where no such test exists and the enrollment was activated fewer
      than meter_error_rebill_max_months whole months before the current date, the refund window is instead one
      month more than the whole months since the activation; an enrollment in any other situation keeps meter_error_rebill_max_months.
  factors:
  - id: refund_window_anchor
    effect: method
    decides: refund_window_months
    bindings:
    - accurate_tests
    - fast_date
    - accurate_date
    - months_on_prepay
    - refund_window_months
    ladder:
    - when: >-
        an earlier meter test of the same service account found the meter within tolerance on or after the activation
        date and before the fast test
      method: >-
        the refund window is the whole months from that earlier test to the current date, never less than one month
    - when: >-
        no such test exists and the enrollment was activated fewer than meter_error_rebill_max_months whole months
        before the current date
      method: the refund window is one month more than the whole months since the activation
    - when: otherwise
      method: the refund window is meter_error_rebill_max_months
    baseline:
      refund_window_months: max_months
    evidence:
    - cross_category
    - date
    cross_difficulty: service
  - id: refunded_line_scope
    effect: parameter
    decides: refunded_lines
    bindings:
    - pca_window
    - tax_window
    - tax_pct
    - pca_billed
    - refunded_lines
    ladder:
    - when: the underlying rate schedule bills sales tax and the power cost adjustment
      value: the energy, power cost adjustment and sales tax lines in the refund window
    - when: it bills the power cost adjustment but no sales tax
      value: the energy and power cost adjustment lines in the refund window
    - when: otherwise
      value: the energy lines in the refund window
    baseline:
      refunded_lines: energy_window
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: overbilled_share_method
    effect: method
    decides: error_share
    bindings:
    - accurate_error
    - error_share
    ladder:
    - when: >-
        an earlier meter test of the same service account found the meter within tolerance before the fast test
        with an error on the fast side
      method: the average of the earlier error and the error found, over one hundred plus that average
    - when: >-
        no such earlier fast-side reading and the error found is below twice the meter accuracy tolerance
      method: the error found less the tolerance, over one hundred plus that difference
    - when: otherwise
      method: the error found over one hundred plus that error
    baseline:
      error_share: error_found / (100 + error_found)
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: test_request_courtesy
    effect: parameter
    decides: test_request_courtesy
    bindings:
    - tests_requested_12m
    - test_request_courtesy
    ladder:
    - when: >-
        the member asked for three or more meter tests of the service account in the twelve months before the current
        date
      value: K('courtesy_tests_frequent')
    - when: the member asked for exactly two
      value: K('courtesy_tests_repeat')
    - when: otherwise
      value: K('courtesy_tests_default')
    baseline:
      test_request_courtesy: K('courtesy_tests_default')
    evidence:
    - cross_category
    - history
    cross_difficulty: service
  - id: disconnection_courtesy
    effect: parameter
    decides: disconnection_courtesy
    bindings:
    - disconnects_window
    - disconnection_courtesy
    ladder:
    - when: >-
        the enrollment was disconnected for low balance at least max_disconnects_per_30_days times in the refund
        window
      value: K('courtesy_disconnects_frequent')
    - when: it was disconnected for low balance at least twice but fewer times in the refund window
      value: K('courtesy_disconnects_repeat')
    - when: otherwise
      value: K('courtesy_disconnects_default')
    baseline:
      disconnection_courtesy: K('courtesy_disconnects_default')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The meter error refund is the overbilled amount plus the test-request courtesy and the disconnection courtesy,
      rounded to the cent. The overbilled amount is the refunded lines total multiplied by the overbilled share,
      rounded to the cent. The refund window is meter_error_rebill_max_months of the underlying rate schedule, counted
      as a window of that many months. The refunded lines total is the total of the energy lines of the enrollment's
      daily charges in the refund window. The overbilled share is the error the fast test found divided by one hundred
      plus that error. The test-request courtesy and the disconnection courtesy are each zero (courtesy_tests_default
      and courtesy_disconnects_default).
    params:
    - courtesy_tests_default
    - courtesy_disconnects_default
  inputs:
    history:
    - table: prepay_ledger
      aggregate: sum
      field: amount
      within_months: 6
      filters:
        event_type: prepay_daily_charge
        charge_component: energy_charge
    - table: prepay_notifications
      aggregate: count
      field: notification_id
      within_months: 6
      filters:
