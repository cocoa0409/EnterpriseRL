- id: deposit_ext_year_end_interest
  base_policy_refs: [deposit_evt_interest]
  overwrite:
  - base_policy: deposit_evt_interest
    superseded_clause: Where interest_applies is true, cash held earns simple interest at the rate interest_rate_by_year gives for each calendar year.
    replaced_by: The member rate of a year-end accrual is the commission rate the tier's interest table gives for the accrued year plus the seasoning supplement, the patron supplement and the kept-arrangement supplement, the three supplements added to the rate in percentage points.
  - base_policy: deposit_evt_interest
    superseded_clause: Interest accrues on the held_amount for each day it was held, the accrual_days of a period counting the posting date of each deposit payment and the last day of the period, divided by interest_day_count.
    replaced_by: "The days the year-end accrual counts follow the payment record of the service account the deposit secures over the twelve whole months before the accrual is posted: when that record shows a returned payment, the year loses the returned-payment days for each returned payment; when it shows no returned payment but at least three late payment charges, the year loses the late-charge days for each late payment charge beyond the second; otherwise every day of the year is counted."
  trigger: state_due
  subject: [deposit_interest_accrual]
  computes: amount
  target_tool: post_year_end_deposit_interest_3b717487
  params:
    commission_rate_2022: 0.48
    commission_rate_2023: 1.65
    commission_rate_2024: 2.28
    commission_rate_2025: 2.07
    commission_rate_2026: 1.84
    seasoning_months_long: 24
    seasoning_months_short: 12
    seasoning_supplement_long: 0.25
    seasoning_supplement_short: 0.1
    patron_months_long: 240
    patron_months_short: 120
    patron_supplement_long: 0.15
    patron_supplement_short: 0.05
    kept_arrangement_supplement_recent: 0.05
    kept_arrangement_supplement_older: 0.02
    returned_payment_days: 30
    late_charge_days: 15
  rule: >-
    This policy posts the December 31 accrual of a calendar year on a cash deposit that was held in full for
    the whole of that year; a year in which installments posted is accrued tranche by tranche under the
    interest rules. The accrued year is the calendar year after the last accrual period on the deposit ledger
    ends, and its accrual period runs from January 1 through December 31 of that year. The cash held is the deposit payments posted on
    the deposit ledger less any refund or application posted on it. The year-end interest is
    the cash held multiplied by the member rate in percent and divided by one hundred, multiplied by the days
    the year-end accrual counts and divided by interest_day_count, and rounded to the nearest cent once, on
    that final figure only. The standard year-end accrual counts every day of the accrued year and applies the
    commission rate the tier's interest table gives for the accrued year with no supplement, so the standard
    year-end interest is the cash held times that rate in percent, divided by one hundred, times the days in
    the year, divided by interest_day_count, rounded to the nearest cent.
    The member rate of a year-end accrual is the commission rate the tier's interest table gives for the
    accrued year plus the seasoning supplement, the patron supplement and the kept-arrangement supplement, the three
    supplements added to the rate in percentage points.
    The days the year-end accrual counts follow the payment record of the service account the deposit secures
    over the twelve whole months before the accrual is posted: when that record shows a returned payment, the
    year loses the returned-payment days for each returned payment; when it shows no returned payment but at
    least three late payment charges, the year loses the late-charge days for each late payment charge beyond
    the second; otherwise every day of the year is counted.
    The seasoning supplement comes from the whole months from the deposit's paid-in-full date to the last day
    of the year before the accrued year: at least the long seasoning months earn the long seasoning
    supplement; at least the short seasoning months but fewer than the long ones earn the short seasoning
    supplement; fewer earn none.
    The patron supplement comes from the member's active capital credit account: an account opened at least
    the long patron months before the last day of the year before the accrued year earns the long patron
    supplement; one opened at least the short patron months but fewer than the long ones before that day earns
    the short patron supplement; a later account, or none, earns none.
    The kept-arrangement supplement rewards a payment arrangement the member saw through on the account the
    deposit secures: an arrangement completed less than twelve whole months before the accrual is posted
    earns the recent kept-arrangement supplement; one completed at least twelve but fewer than twenty-four
    whole months before it earns the older kept-arrangement supplement; otherwise none.
  prerequisite: []
  cross_category:
  - category: service
    as: history
    reads: [service_charges.event_type, service_charges.charge_date, service_payments.event_type, service_payments.payment_date]
    note: The returned payments and late charges of the account the deposit secures decide the days counted.
  - category: arrange
    as: branch
    reads: [arrangements.status, arrangements.ended_date, arrangements.service_account_id]
    note: A completed payment arrangement on the account the deposit secures decides the kept-arrangement supplement.
  - category: capital
    as: branch
    reads: [opened_date, status]
    note: The opening date of the member's active capital credit account decides the patron supplement.
  compute:
  - cash_held: "SUM('deposit_ledger', 'amount', event_type='deposit_payment') - SUM('deposit_ledger', 'amount', event_type='deposit_refund') - SUM('deposit_ledger', 'amount', event_type='deposit_apply_balance') - SUM('deposit_ledger', 'amount', event_type='deposit_apply_prepay')"
  - last_end: "LATEST('deposit_ledger', 'accrual_period_end', date_field='accrual_period_end', event_type='deposit_interest_accrual')"
  - accrual_year: "MONTHS('2000-01-01', last_end) // 12 + 2001"
  - commission_rate: "K('commission_rate_2026') if accrual_year == 2026 else (K('commission_rate_2025') if accrual_year == 2025 else (K('commission_rate_2024') if accrual_year == 2024 else (K('commission_rate_2023') if accrual_year == 2023 else K('commission_rate_2022'))))"
  - year_days: "366 if accrual_year % 4 == 0 else 365"
  - returns_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment_return', service_account_id=F('service_account_id'))"
  - late_charges_12m: "XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', event_type='service_late_charge', service_account_id=F('service_account_id'))"
  - days_counted: "year_days - K('returned_payment_days') * returns_12m if returns_12m > 0 else (year_days - K('late_charge_days') * (late_charges_12m - 2) if late_charges_12m >= 3 else year_days)"
  - seasoning_months: "MONTHS(F('paid_in_full_date'), last_end)"
  - seasoning_supplement: "K('seasoning_supplement_long') if seasoning_months >= K('seasoning_months_long') else (K('seasoning_supplement_short') if seasoning_months >= K('seasoning_months_short') else 0)"
  - patron_months: "MONTHS(CFIELD('capital', 'opened_date', status='active'), last_end) if EXISTS('capital', status='active') else 0"
  - patron_supplement: "K('patron_supplement_long') if patron_months >= K('patron_months_long') else (K('patron_supplement_short') if patron_months >= K('patron_months_short') else 0)"
  - kept_arrangement_end: "CFIELD('arrange', 'ended_date', status='completed', service_account_id=F('service_account_id'))"
  - kept_arrangement_months: "MONTHS(kept_arrangement_end, NOW) if kept_arrangement_end != None else 999"
  - kept_arrangement_supplement: "K('kept_arrangement_supplement_recent') if kept_arrangement_months < 12 else (K('kept_arrangement_supplement_older') if kept_arrangement_months < 24 else 0)"
  - member_rate: "commission_rate + seasoning_supplement + patron_supplement + kept_arrangement_supplement"
  - result: "RND(cash_held * member_rate / 100 * days_counted / P('interest_day_count'), 2)"
  compute_basis:
    cash_held: The cash held is the deposit payments posted on the deposit ledger less any refund or application posted on it.
    last_end: The accrued year is the calendar year after the last accrual period on the deposit ledger ends
    accrual_year: The accrued year is the calendar year after the last accrual period on the deposit ledger ends, and its accrual period runs from January 1 through December 31 of that year.
    commission_rate: the commission rate the tier's interest table gives for the accrued year
    year_days: The standard year-end accrual counts every day of the accrued year
    returns_12m: The days the year-end accrual counts follow the payment record of the service account the deposit secures over the twelve whole months before the accrual is posted
    late_charges_12m: The days the year-end accrual counts follow the payment record of the service account the deposit secures over the twelve whole months before the accrual is posted
    days_counted: "when that record shows a returned payment, the year loses the returned-payment days for each returned payment; when it shows no returned payment but at least three late payment charges, the year loses the late-charge days for each late payment charge beyond the second; otherwise every day of the year is counted."
    seasoning_months: The seasoning supplement comes from the whole months from the deposit's paid-in-full date to the last day of the year before the accrued year
    seasoning_supplement: "at least the long seasoning months earn the long seasoning supplement; at least the short seasoning months but fewer than the long ones earn the short seasoning supplement; fewer earn none."
    patron_months: The patron supplement comes from the member's active capital credit account
    patron_supplement: "an account opened at least the long patron months before the last day of the year before the accrued year earns the long patron supplement; one opened at least the short patron months but fewer than the long ones before that day earns the short patron supplement; a later account, or none, earns none."
    kept_arrangement_end: The kept-arrangement supplement rewards a payment arrangement the member saw through on the account the deposit secures
    kept_arrangement_months: an arrangement completed less than twelve whole months before the accrual is posted earns the recent kept-arrangement supplement
    kept_arrangement_supplement: "an arrangement completed less than twelve whole months before the accrual is posted earns the recent kept-arrangement supplement; one completed at least twelve but fewer than twenty-four whole months before it earns the older kept-arrangement supplement; otherwise none."
    member_rate: The member rate of a year-end accrual is the commission rate the tier's interest table gives for the accrued year plus the seasoning supplement, the patron supplement and the kept-arrangement supplement, the three supplements added to the rate in percentage points.
    result: The year-end interest is the cash held multiplied by the member rate in percent and divided by one hundred, multiplied by the days the year-end accrual counts and divided by interest_day_count, and rounded to the nearest cent once, on that final figure only.
  factors:
  - id: year_end_delinquency_days
    effect: method
    decides: days_counted
    bindings: [returns_12m, late_charges_12m, days_counted]
    ladder:
    - when: "the account's payment record over the twelve whole months before the year-end accrual is posted shows a returned payment"
      method: "the year-end accrual counts the days of the year less the returned-payment days for each returned payment"
    - when: "that record shows no returned payment but at least three late payment charges"
      method: "the year-end accrual counts the days of the year less the late-charge days for each late payment charge beyond the second"
    - when: "otherwise"
      method: "the year-end accrual counts every day of the year"
    baseline:
      days_counted: "year_days"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: year_end_seasoning_supplement
    effect: parameter
    decides: seasoning_supplement
    bindings: [seasoning_months, seasoning_supplement]
    ladder:
    - when: "the deposit was paid in full at least the long seasoning months before the last day of the year before the accrued year"
      value: "K('seasoning_supplement_long')"
    - when: "it was paid in full at least the short seasoning months but fewer than the long seasoning months before that day"
      value: "K('seasoning_supplement_short')"
    - when: "otherwise"
      value: "0"
    baseline:
      seasoning_supplement: "0"
    evidence: [date]
    cross_difficulty: null
  - id: year_end_patron_supplement
    effect: parameter
    decides: patron_supplement
    bindings: [patron_months, patron_supplement]
    ladder:
    - when: "the member's active capital credit account was opened at least the long patron months before the last day of the year before the accrued year"
      value: "K('patron_supplement_long')"
    - when: "it was opened at least the short patron months but fewer than the long patron months before that day"
      value: "K('patron_supplement_short')"
    - when: "otherwise, including a member with no active capital credit account"
      value: "0"
    baseline:
      patron_supplement: "0"
    evidence: [date, cross_category]
    cross_difficulty: capital
  - id: year_end_kept_arrangement_supplement
    effect: parameter
    decides: kept_arrangement_supplement
    bindings: [kept_arrangement_end, kept_arrangement_months, kept_arrangement_supplement]
    ladder:
    - when: "a payment arrangement on the account the deposit secures was completed less than twelve whole months before the accrual is posted"
      value: "K('kept_arrangement_supplement_recent')"
    - when: "one was completed at least twelve but fewer than twenty-four whole months before it"
      value: "K('kept_arrangement_supplement_older')"
    - when: "otherwise"
      value: "0"
    baseline:
      kept_arrangement_supplement: "0"
    evidence: [date, cross_category]
    cross_difficulty: arrange
  baseline:
    rule: >-
      The standard year-end accrual counts every day of the accrued year and applies the commission rate the
      tier's interest table gives for the accrued year with no supplement, so the standard year-end interest is
      the cash held times that rate in percent, divided by one hundred, times the days in the year, divided by
      interest_day_count, rounded to the nearest cent.
    params: [interest_rate_by_year, interest_day_count, commission_rate_2022, commission_rate_2023, commission_rate_2024, commission_rate_2025, commission_rate_2026]
  inputs:
    history:
    - {table: deposit_ledger, aggregate: latest, field: accrual_period_end, filters: {event_type: deposit_interest_accrual}}
    - {category: service, table: service_payments, aggregate: count, field: payment_date, within_months: 12, filters: {event_type: service_payment_return}}
    - {category: service, table: service_charges, aggregate: count, field: charge_date, within_months: 12, filters: {event_type: service_late_charge}}
    cross_category: [service, arrange, capital]
- id: deposit_ext_refund_date_interest
  base_policy_refs: [deposit_evt_interest]
  overwrite:
  - base_policy: deposit_evt_interest
    superseded_clause: Where interest_applies is true, cash held earns simple interest at the rate interest_rate_by_year gives for each calendar year.
    replaced_by: The rate of a refund-date accrual is the selected commission rate plus the draft-payment supplement and the prompt-payment supplement, both added to the rate in percentage points.
  - base_policy: deposit_evt_interest
    superseded_clause: Interest accrues on the held_amount for each day it was held, the accrual_days of a period counting the posting date of each deposit payment and the last day of the period, divided by interest_day_count.
    replaced_by: "The days the refund-date accrual counts follow the record of the service account since the last accrual period ended, counting charges and payments posted fewer whole months before today than the whole months from that period's end to today: a returned payment in that time takes away the part-year returned days for each returned payment; no returned payment but one or more late payment charges takes away the part-year late days for each late payment charge; otherwise every day of the period is counted."
  trigger: on_request
  subject: [deposit_interest_accrual]
  computes: amount
  target_tool: post_refund_date_deposit_interest_50449ec1
  params:
    commission_rate_2022: 0.48
    commission_rate_2023: 1.65
    commission_rate_2024: 2.28
    commission_rate_2025: 2.07
    commission_rate_2026: 1.84
    held_months_long: 36
    held_months_short: 18
    draft_supplement_full: 0.1
    draft_supplement_half: 0.05
    prompt_supplement_clean: 0.25
    prompt_supplement_some: 0.05
    prompt_late_limit: 3
    part_year_returned_days: 30
    part_year_late_days: 10
  rule: >-
    This policy posts the accrual for the part of the current calendar year that ends on the day a cash
    deposit is refunded. The refund-date accrual is worked out only after the deposit ledger carries a
    December 31 accrual for every earlier calendar year in which cash was held. Its accrual period runs from
    the day after the last accrual period on the deposit ledger ends through the refund date. The cash held is the deposit
    payments on the deposit ledger less any refund or application posted on it. The refund-date
    interest is the cash held multiplied by the rate of the refund-date accrual in percent and divided by one
    hundred, multiplied by the days the refund-date accrual counts and divided by interest_day_count, and
    rounded to the nearest cent once, on that final figure only. The standard refund-date accrual counts the
    calendar days from the day after the last accrual period ended through the refund date, both ends
    included, and applies the commission rate the tier's interest table gives for the current year with no
    supplement, so the standard refund-date interest is the cash held times that rate in percent, divided by
    one hundred, times those days, divided by interest_day_count, rounded to the nearest cent.
    The rate of a refund-date accrual is the selected commission rate plus the draft-payment supplement and the
    prompt-payment supplement, both added to the rate in percentage points.
    The commission rate is selected by how long the deposit has been held in full: a deposit paid in full at
    least the long held months before the refund date takes the higher of the current year's and the previous
    year's commission rates; one paid in full at least the short held months but fewer than the long ones
    before it takes the average of those two rates; any other deposit takes the current year's rate.
    The days the refund-date accrual counts follow the record of the service account since the last accrual
    period ended, counting charges and payments posted fewer whole months before today than the whole months
    from that period's end to today: a returned payment in that time takes away the part-year returned days
    for each returned payment; no returned payment but one or more late payment charges takes away the
    part-year late days for each late payment charge; otherwise every day of the period is counted.
    The draft-payment supplement reads the account's last twelve whole months: every service payment by
    automatic bank draft and no returned payment earns the full draft supplement; at least half of the
    payments by bank draft and no returned payment, but not all, earns the half draft supplement; otherwise
    none.
    The prompt-payment supplement also reads the last twelve whole months: no late payment charge and no
    returned payment earns the clean prompt supplement; at least one but no more than the prompt late limit of
    late payment charges and no returned payment earns the partial prompt supplement; otherwise none.
  prerequisite:
  - problem: deposit_ext_year_end_interest
    kind: value_input
    gate: base_days
    form: state
    policy_source: The refund-date accrual is worked out only after the deposit ledger carries a December 31 accrual for every earlier calendar year in which cash was held.
    condition: For every calendar year before the refund year in which cash was held on the deposit, the deposit ledger carries a deposit_interest_accrual entry whose accrual_period_end is December 31 of that year.
    resolved_by: post_year_end_deposit_interest_3b717487
    effect: Once the missing year-end accrual posts, the last accrual period on the ledger ends on December 31 of the previous year, so the refund-date period starts on January 1 and its base days fall to the days of the current year through the refund date.
  cross_category:
  - category: service
    as: history
    reads: [service_charges.event_type, service_charges.charge_date, service_payments.event_type, service_payments.payment_channel, service_payments.payment_date]
    note: The late charges, returned payments and bank-draft payments of the account the deposit secures decide the days counted and the two supplements.
  compute:
  - cash_held: "SUM('deposit_ledger', 'amount', event_type='deposit_payment') - SUM('deposit_ledger', 'amount', event_type='deposit_refund') - SUM('deposit_ledger', 'amount', event_type='deposit_apply_balance') - SUM('deposit_ledger', 'amount', event_type='deposit_apply_prepay')"
  - last_end: "LATEST('deposit_ledger', 'accrual_period_end', date_field='accrual_period_end', event_type='deposit_interest_accrual')"
  - base_days: "DAYS(last_end, NOW)"
  - now_year: "MONTHS('2000-01-01', NOW) // 12 + 2000"
  - current_rate: "K('commission_rate_2026') if now_year == 2026 else (K('commission_rate_2025') if now_year == 2025 else (K('commission_rate_2024') if now_year == 2024 else K('commission_rate_2023')))"
  - previous_rate: "K('commission_rate_2025') if now_year == 2026 else (K('commission_rate_2024') if now_year == 2025 else (K('commission_rate_2023') if now_year == 2024 else K('commission_rate_2022')))"
  - held_months: "MONTHS(F('paid_in_full_date'), NOW)"
  - selected_rate: "MX(current_rate, previous_rate) if held_months >= K('held_months_long') else ((current_rate + previous_rate) / 2 if held_months >= K('held_months_short') else current_rate)"
  - part_months: "MONTHS(last_end, NOW)"
  - part_returns: "XCOUNT('service', 'service_payments', within_months=part_months, date_field='payment_date', event_type='service_payment_return', service_account_id=F('service_account_id'))"
  - part_lates: "XCOUNT('service', 'service_charges', within_months=part_months, date_field='charge_date', event_type='service_late_charge', service_account_id=F('service_account_id'))"
  - days_counted: "base_days - K('part_year_returned_days') * part_returns if part_returns > 0 else (base_days - K('part_year_late_days') * part_lates if part_lates > 0 else base_days)"
  - payments_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment', service_account_id=F('service_account_id'))"
  - drafts_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment', payment_channel='autopay_bank_draft', service_account_id=F('service_account_id'))"
  - returns_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment_return', service_account_id=F('service_account_id'))"
  - draft_supplement: "K('draft_supplement_full') if (payments_12m > 0 and drafts_12m == payments_12m and returns_12m == 0) else (K('draft_supplement_half') if (drafts_12m * 2 >= payments_12m and payments_12m > 0 and returns_12m == 0) else 0)"
  - lates_12m: "XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', event_type='service_late_charge', service_account_id=F('service_account_id'))"
  - prompt_supplement: "K('prompt_supplement_clean') if (lates_12m == 0 and returns_12m == 0) else (K('prompt_supplement_some') if (lates_12m <= K('prompt_late_limit') and returns_12m == 0) else 0)"
  - accrual_rate: "selected_rate + draft_supplement + prompt_supplement"
  - result: "RND(cash_held * accrual_rate / 100 * days_counted / P('interest_day_count'), 2)"
  compute_basis:
    cash_held: The cash held is the deposit payments on the deposit ledger less any refund or application posted on it.
    last_end: Its accrual period runs from the day after the last accrual period on the deposit ledger ends through the refund date.
    base_days: The standard refund-date accrual counts the calendar days from the day after the last accrual period ended through the refund date, both ends included
    now_year: applies the commission rate the tier's interest table gives for the current year with no supplement
    current_rate: applies the commission rate the tier's interest table gives for the current year with no supplement
    previous_rate: a deposit paid in full at least the long held months before the refund date takes the higher of the current year's and the previous year's commission rates
    held_months: The commission rate is selected by how long the deposit has been held in full
    selected_rate: "a deposit paid in full at least the long held months before the refund date takes the higher of the current year's and the previous year's commission rates; one paid in full at least the short held months but fewer than the long ones before it takes the average of those two rates; any other deposit takes the current year's rate."
    part_months: counting charges and payments posted fewer whole months before today than the whole months from that period's end to today
    part_returns: The days the refund-date accrual counts follow the record of the service account since the last accrual period ended
    part_lates: The days the refund-date accrual counts follow the record of the service account since the last accrual period ended
    days_counted: "a returned payment in that time takes away the part-year returned days for each returned payment; no returned payment but one or more late payment charges takes away the part-year late days for each late payment charge; otherwise every day of the period is counted."
    payments_12m: The draft-payment supplement reads the account's last twelve whole months
    drafts_12m: every service payment by automatic bank draft and no returned payment earns the full draft supplement
    returns_12m: every service payment by automatic bank draft and no returned payment earns the full draft supplement
    draft_supplement: "every service payment by automatic bank draft and no returned payment earns the full draft supplement; at least half of the payments by bank draft and no returned payment, but not all, earns the half draft supplement; otherwise none."
    lates_12m: The prompt-payment supplement also reads the last twelve whole months
    prompt_supplement: "no late payment charge and no returned payment earns the clean prompt supplement; at least one but no more than the prompt late limit of late payment charges and no returned payment earns the partial prompt supplement; otherwise none."
    accrual_rate: The rate of a refund-date accrual is the selected commission rate plus the draft-payment supplement and the prompt-payment supplement, both added to the rate in percentage points.
    result: The refund-date interest is the cash held multiplied by the rate of the refund-date accrual in percent and divided by one hundred, multiplied by the days the refund-date accrual counts and divided by interest_day_count, and rounded to the nearest cent once, on that final figure only.
  factors:
  - id: refund_date_rate_selection
    effect: method
    decides: selected_rate
    bindings: [now_year, current_rate, previous_rate, held_months, selected_rate]
    ladder:
    - when: "the deposit was paid in full at least the long held months before the refund date"
      method: "the refund-date accrual takes the higher of the current year's and the previous year's commission rates"
    - when: "it was paid in full at least the short held months but fewer than the long held months before the refund date"
      method: "the refund-date accrual takes the average of the current year's and the previous year's commission rates"
    - when: "otherwise"
      method: "the refund-date accrual takes the current year's commission rate"
    baseline:
      selected_rate: "current_rate"
    evidence: [date]
    cross_difficulty: null
  - id: refund_date_delinquency_days
    effect: method
    decides: days_counted
    bindings: [part_months, part_returns, part_lates, days_counted]
    ladder:
    - when: "a returned payment posted on the account since the last accrual period ended"
      method: "the refund-date accrual counts the period's days less the part-year returned days for each returned payment"
    - when: "no returned payment but one or more late payment charges since the last accrual period ended"
      method: "the refund-date accrual counts the period's days less the part-year late days for each late payment charge"
    - when: "otherwise"
      method: "the refund-date accrual counts every day of the period"
    baseline:
      days_counted: "base_days"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: refund_date_draft_supplement
    effect: parameter
    decides: draft_supplement
    bindings: [payments_12m, drafts_12m, returns_12m, draft_supplement]
    ladder:
    - when: "every service payment on the account in the last twelve whole months came by automatic bank draft and none was returned"
      value: "K('draft_supplement_full')"
    - when: "at least half but not all of those payments came by bank draft and none was returned"
      value: "K('draft_supplement_half')"
    - when: "otherwise"
      value: "0"
    baseline:
      draft_supplement: "0"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: refund_date_prompt_supplement
    effect: parameter
    decides: prompt_supplement
    bindings: [lates_12m, prompt_supplement]
    ladder:
    - when: "no late payment charge and no returned payment on the account in the last twelve whole months"
      value: "K('prompt_supplement_clean')"
    - when: "at least one but no more than the prompt late limit of late payment charges and no returned payment in that period"
      value: "K('prompt_supplement_some')"
    - when: "otherwise"
      value: "0"
    baseline:
      prompt_supplement: "0"
    evidence: [history, cross_category]
    cross_difficulty: service
  baseline:
    rule: >-
      The standard refund-date accrual counts the calendar days from the day after the last accrual period
      ended through the refund date, both ends included, and applies the commission rate the tier's interest
      table gives for the current year with no supplement, so the standard refund-date interest is the cash
      held times that rate in percent, divided by one hundred, times those days, divided by interest_day_count,
      rounded to the nearest cent.
    params: [interest_rate_by_year, interest_day_count, commission_rate_2025, commission_rate_2026]
  inputs:
    history:
    - {table: deposit_ledger, aggregate: latest, field: accrual_period_end, filters: {event_type: deposit_interest_accrual}}
    - {category: service, table: service_charges, aggregate: count, field: charge_date, within_months: 12, filters: {event_type: service_late_charge}}
    - {category: service, table: service_payments, aggregate: count, field: payment_date, within_months: 12, filters: {event_type: service_payment}}
    cross_category: [service]
- id: deposit_ext_recalculation_refund
  base_policy_refs: [deposit_evt_refund, deposit_evt_cancellation, deposit_evt_reassessment, deposit_evt_interest]
  overwrite:
  - base_policy: deposit_evt_refund
    superseded_clause: A review that is not good leaves the deposit held; it is reviewed again monthly.
    replaced_by: A review that is not good leaves the deposit held and reviewed again monthly, except that a member who asks may have a deposit held in full for at least the recalculation held months recalculated, and the excess of the cash held over the recalculated requirement is refunded when it exceeds the recalculation threshold.
  - base_policy: deposit_evt_reassessment
    superseded_clause: A falling bill basis never reduces or partly refunds a deposit; only the refund review releases it.
    replaced_by: A falling bill basis reduces a deposit only through this recalculation at the member's request; the deposit is otherwise released only by the refund review.
  - base_policy: deposit_evt_interest
    superseded_clause: The prior year's interest is paid out by interest_payout_method on the bill of interest_payout_month; part-year interest is paid out with the refund or applied with the deposit.
    replaced_by: Interest accrued and not yet paid out, including a prior year's interest whose payout bill has already been issued, is paid with the recalculation refund.
  trigger: on_request
  subject: [deposit_refund]
  computes: refund_amount
  target_tool: refund_deposit_by_check_ead765c2
  params:
    recalculation_held_months: 18
    recalculation_threshold: 10.0
    trim_ratio_high: 1.6
    trim_ratio_mid: 1.3
    record_multiple_clean: 1.75
    record_multiple_reconnected: 1.9
    harvest_relief: 0.15
    arrangement_relief: 0.05
    moved_load_relief_full: 0.1
    moved_load_relief_part: 0.05
    remote_relief_clean: 0.05
    remote_relief_returned: 0.02
    multiple_floor: 1.0
  rule: >-
    A review that is not good leaves the deposit held and reviewed again monthly, except that a member who
    asks may have a deposit held in full for at least the recalculation held months recalculated, and the
    excess of the cash held over the recalculated requirement is refunded when it exceeds the recalculation
    threshold. A falling bill basis reduces a deposit only through this recalculation at the member's request;
    the deposit is otherwise released only by the refund review. The recalculation refund is paid by
    refund_method_default, or by check when the member asks for a check and it is at least
    refund_check_on_request_min, and the deposit stays held for the recalculated requirement.
    Interest accrued and not yet paid out, including a prior year's interest whose payout bill has already been issued, is paid with the recalculation refund.
    The recalculation refund is not made until the deposit ledger carries an interest accrual whose period
    ends on the refund date.
    The recalculation refund is the cash held less the recalculated requirement, together with all interest
    accrued on the deposit and not yet paid out, rounded to the nearest cent; nothing is refunded when the
    excess is not above the recalculation threshold. The recalculated requirement is the recalculation
    multiple times the recalculation basis bill, rounded up to the next multiple of rounding_increment, then
    raised to minimum_deposit when lower, then limited to maximum_deposit. A billing period's bill is the sum of
    that period's usage lines, read month by month back from today. The standard recalculated requirement is
    the tier's deposit_multiple times the average bill of the twelve billing periods immediately before today,
    rounded up to the next multiple of rounding_increment, raised to minimum_deposit when lower and limited to
    maximum_deposit, so the standard recalculation refund is the cash held less that requirement together
    with the unpaid interest.
    The recalculation window follows where the account's load now sits: when the most recent connect fee
    billed on the member's service accounts falls in the twelve whole months before today and was billed on
    another account than this one, the window is the billing
    periods of this account billed fewer whole months before today than have passed since that connect fee;
    when this account itself was connected fewer than twelve whole months before today, the window is the
    periods billed since its connection; otherwise the window is the twelve billing periods immediately before
    today.
    The recalculation basis bill trims a single peak: when the highest bill in the window exceeds the window
    average by more than the high trim ratio, the basis bill is the average of the window's other bills; when
    it exceeds the window average by more than the mid trim ratio but not by more than the high trim ratio,
    the basis bill is the midpoint of that trimmed average and the window average; otherwise the basis bill
    is the window average.
    The recalculation multiple is the record multiple less the harvest relief, the moved-load relief and the
    remote-meter relief, and never below the multiple floor. The record multiple reads the account's last
    twenty-four whole months: no returned payment and no reconnect fee takes the clean record multiple; no
    returned payment but a reconnect fee takes the reconnected record multiple; anything else takes the tier's
    deposit_multiple. The harvest relief is the harvest relief figure when the member completed an
    Agricultural Harvest Payment Agreement that ended in the last twenty-four whole months, the general
    arrangement relief when the member completed another kind of payment arrangement that ended in that
    period, and nothing otherwise. The moved-load relief reads the member's other service accounts over the
    last twelve whole months: payments on them with no late payment charge and every one by automatic bank
    draft earns the full moved-load relief; payments on them with no late payment charge but not all by bank
    draft earns the part moved-load relief; otherwise none. The remote-meter relief is the clean remote relief
    when this account has a remote-disconnect meter and no returned payment in the last twelve whole months,
    the returned remote relief when it has a remote-disconnect meter and a returned payment in that period,
    and nothing otherwise.
  prerequisite:
  - problem: deposit_ext_refund_date_interest
    kind: value_input
    gate: unpaid_interest
    form: state
    policy_source: The recalculation refund is not made until the deposit ledger carries an interest accrual whose period ends on the refund date.
    condition: The deposit ledger carries a deposit_interest_accrual entry whose accrual_period_end is the refund date (today).
    resolved_by: post_refund_date_deposit_interest_50449ec1
    effect: Once the refund-date accrual posts, the interest accrued and not yet paid out on the deposit rises by that accrual, and the recalculation refund carries it.
  cross_category:
  - category: service
    as: history
    reads: [service_charges.amount, service_charges.event_type, service_charges.charge_component, service_charges.charge_date, service_payments.event_type, service_payments.payment_channel, service_payments.payment_date, service_accounts.connect_date, service_accounts.meter_type]
    note: The bills, connect fees, reconnect fees, returned payments, late charges and bank drafts of the member's accounts decide the window, basis, record, moved-load and meter tiers.
  - category: arrange
    as: branch
    reads: [arrangements.status, arrangements.variant_name, arrangements.ended_date]
    note: A completed payment arrangement and its tier decide the harvest relief.
  compute:
  - sum_1m: "XSUM('service', 'service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_2m: "XSUM('service', 'service_charges', 'amount', within_months=2, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_3m: "XSUM('service', 'service_charges', 'amount', within_months=3, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_4m: "XSUM('service', 'service_charges', 'amount', within_months=4, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_5m: "XSUM('service', 'service_charges', 'amount', within_months=5, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_6m: "XSUM('service', 'service_charges', 'amount', within_months=6, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_7m: "XSUM('service', 'service_charges', 'amount', within_months=7, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_8m: "XSUM('service', 'service_charges', 'amount', within_months=8, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_9m: "XSUM('service', 'service_charges', 'amount', within_months=9, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_10m: "XSUM('service', 'service_charges', 'amount', within_months=10, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_11m: "XSUM('service', 'service_charges', 'amount', within_months=11, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_12m: "XSUM('service', 'service_charges', 'amount', within_months=12, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - bill_1: "sum_1m"
  - bill_2: "RND(sum_2m - sum_1m, 2)"
  - bill_3: "RND(sum_3m - sum_2m, 2)"
  - bill_4: "RND(sum_4m - sum_3m, 2)"
  - bill_5: "RND(sum_5m - sum_4m, 2)"
  - bill_6: "RND(sum_6m - sum_5m, 2)"
  - bill_7: "RND(sum_7m - sum_6m, 2)"
  - bill_8: "RND(sum_8m - sum_7m, 2)"
  - bill_9: "RND(sum_9m - sum_8m, 2)"
  - bill_10: "RND(sum_10m - sum_9m, 2)"
  - bill_11: "RND(sum_11m - sum_10m, 2)"
  - bill_12: "RND(sum_12m - sum_11m, 2)"
  - connects_all_12m: "XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', event_type='service_fee', charge_component='connect_fee')"
  - connects_own_12m: "XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', event_type='service_fee', charge_component='connect_fee', service_account_id=F('service_account_id'))"
  - latest_connect_fee: "XLATEST('service', 'service_charges', 'charge_date', date_field='charge_date', event_type='service_fee', charge_component='connect_fee')"
  - own_latest_connect_fee: "XLATEST('service', 'service_charges', 'charge_date', date_field='charge_date', event_type='service_fee', charge_component='connect_fee', service_account_id=F('service_account_id'))"
  - own_connect_months: "MONTHS(CFIELD('service', 'connect_date', service_account_id=F('service_account_id')), NOW)"
  - window_months: "MONTHS(latest_connect_fee, NOW) if (connects_all_12m - connects_own_12m > 0 and latest_connect_fee != own_latest_connect_fee) else (own_connect_months + 1 if own_connect_months < 12 else 12)"
  - window_sum: "XSUM('service', 'service_charges', 'amount', within_months=window_months, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - window_periods: "XCOUNT('service', 'service_charges', within_months=window_months, date_field='charge_date', event_type='service_usage_charge', charge_component='facility_charge', service_account_id=F('service_account_id'))"
  - window_average: "window_sum / MX(window_periods, 1)"
  - window_highest: "MX(bill_1, bill_2 if window_months >= 2 else 0, bill_3 if window_months >= 3 else 0, bill_4 if window_months >= 4 else 0, bill_5 if window_months >= 5 else 0, bill_6 if window_months >= 6 else 0, bill_7 if window_months >= 7 else 0, bill_8 if window_months >= 8 else 0, bill_9 if window_months >= 9 else 0, bill_10 if window_months >= 10 else 0, bill_11 if window_months >= 11 else 0, bill_12 if window_months >= 12 else 0)"
  - trimmed_average: "(window_sum - window_highest) / MX(window_periods - 1, 1)"
  - basis_bill: "trimmed_average if window_highest > K('trim_ratio_high') * window_average else ((trimmed_average + window_average) / 2 if window_highest > K('trim_ratio_mid') * window_average else window_average)"
  - returns_24m: "XCOUNT('service', 'service_payments', within_months=24, date_field='payment_date', event_type='service_payment_return', service_account_id=F('service_account_id'))"
  - reconnects_24m: "XCOUNT('service', 'service_charges', within_months=24, date_field='charge_date', event_type='service_fee', charge_component='reconnect_fee', service_account_id=F('service_account_id'))"
  - record_multiple: "K('record_multiple_clean') if (returns_24m == 0 and reconnects_24m == 0) else (K('record_multiple_reconnected') if (returns_24m == 0 and reconnects_24m > 0) else P('deposit_multiple'))"
  - harvest_end: "CFIELD('arrange', 'ended_date', status='completed', variant_name='Agricultural Harvest Payment Agreement')"
  - other_arrangement_end: "CFIELD('arrange', 'ended_date', status='completed')"
  - harvest_relief: "K('harvest_relief') if (harvest_end != None and MONTHS(harvest_end, NOW) < 24) else (K('arrangement_relief') if (other_arrangement_end != None and MONTHS(other_arrangement_end, NOW) < 24) else 0)"
  - other_payments_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment') - XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment', service_account_id=F('service_account_id'))"
  - other_drafts_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment', payment_channel='autopay_bank_draft') - XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment', payment_channel='autopay_bank_draft', service_account_id=F('service_account_id'))"
  - other_lates_12m: "XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', event_type='service_late_charge') - XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', event_type='service_late_charge', service_account_id=F('service_account_id'))"
  - moved_load_relief: "K('moved_load_relief_full') if (other_payments_12m > 0 and other_lates_12m == 0 and other_drafts_12m == other_payments_12m) else (K('moved_load_relief_part') if (other_payments_12m > 0 and other_lates_12m == 0) else 0)"
  - meter_type: "CFIELD('service', 'meter_type', service_account_id=F('service_account_id'))"
  - returns_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment_return', service_account_id=F('service_account_id'))"
  - remote_relief: "K('remote_relief_clean') if (meter_type == 'ami_remote_disconnect' and returns_12m == 0) else (K('remote_relief_returned') if (meter_type == 'ami_remote_disconnect' and returns_12m > 0) else 0)"
  - recalculation_multiple: "MX(K('multiple_floor'), record_multiple - harvest_relief - moved_load_relief - remote_relief)"
  - raw_requirement: "recalculation_multiple * basis_bill"
  - recalculated_requirement: "MN(P('maximum_deposit'), MX(P('minimum_deposit'), -(-raw_requirement // P('rounding_increment')) * P('rounding_increment')))"
  - excess_cash: "F('held_amount') - recalculated_requirement"
  - unpaid_interest: "SUM('deposit_ledger', 'amount', event_type='deposit_interest_accrual') - SUM('deposit_ledger', 'amount', event_type='deposit_interest_payout')"
  - result: "RND(excess_cash + unpaid_interest, 2) if excess_cash > K('recalculation_threshold') else 0"
  compute_basis:
    sum_1m: "A billing period's bill is the sum of that period's usage lines, read month by month back from today."
    sum_2m: "A billing period's bill is the sum of that period's usage lines, read month by month back from today."
    sum_3m: "A billing period's bill is the sum of that period's usage lines, read month by month back from today."
    sum_4m: "A billing period's bill is the sum of that period's usage lines, read month by month back from today."
