events:
  - type: deposit_assess
    target: deposit_accounts
    mutation: create
    meaning: A security deposit is assessed on a service account and billed to the member.
    grain: One row per deposit assessment on one service account.
    fields:
      customer_id: Member assessed.
      service_account_id: Service account the deposit secures.
      variant_name: Official deposit tier applied.
      assessment_basis: Why the deposit was assessed.
      assessed_date: Date of the assessment.
      required_amount: Deposit required, after rounding, floor and ceiling.
      installment_count: Number of installments granted (1 = due in full).
    triggers: []
  - type: deposit_payment
    target: deposit_ledger
    meaning: A payment toward a deposit, in full or as one installment.
    grain: One row per deposit payment transaction.
    distinguish_by: [payment_reference]
    fields:
      entry_date: Posting date.
      amount: Amount paid, positive.
      installment_number: Which installment this is (1 for a payment in full).
      payment_reference: Confirmation or check number of the payment.
    account: deposit_held
    direction: in
    triggers: []
  - type: deposit_partial
    target: deposit_accounts
    mutation: {transition: {from: assessed, to: partially_paid}}
    meaning: The first installment of an installment deposit has posted.
    grain: One row per transaction on the deposit record.
    fields:
      held_amount: Cash held after the installment.
    triggers: []
  - type: deposit_paid_full
    target: deposit_accounts
    mutation:
      transition:
        - {from: assessed, to: held}
        - {from: partially_paid, to: held}
    meaning: The full required amount is held.
    grain: One row per transaction on the deposit record.
    fields:
      paid_in_full_date: Posting date of the payment that completed the deposit.
    triggers: []
  - type: deposit_waive
    target: deposit_accounts
    mutation: {transition: {from: assessed, to: waived}}
    meaning: The assessment is waived on qualifying evidence before any payment.
    grain: One row per transaction on the deposit record.
    fields:
      waiver_basis: Which waiver rule was satisfied.
      waiver_reference: Reference of the waiver evidence (prior utility letter date and utility name, bond number, letter of credit number, or the Cedar Fork account number whose history qualified).
      closed_date: Date of the waiver.
    triggers: []
  - type: deposit_interest_accrual
    target: deposit_ledger
    meaning: Simple interest accrued on the cash held for one accrual period (a calendar year, or the part year up to a refund or application).
    grain: One row per accrual period per deposit record.
    distinguish_by: [accrual_period_end]
    fields:
      entry_date: Date the accrual was posted.
      accrual_period_start: First day of the accrual period.
      accrual_period_end: Last day of the accrual period.
      interest_rate_pct: Annual rate applied, percent.
      accrual_days: Calendar days in the accrual period on which the cash was held.
      amount: Interest accrued, positive.
    account: accrued_interest
    direction: in
    triggers: []
  - type: deposit_interest_payout
    target: deposit_ledger
    meaning: Accrued interest is paid out to the member by bill credit or check.
    grain: One row per payout.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date paid out.
      disbursement_method: Bill credit or check.
      amount: Interest paid out, positive.
    account: accrued_interest
    direction: out
    triggers:
      - event: service:service_bill_credit
        when: {disbursement_method: bill_credit}
        map: {credit_reason: deposit_interest, charge_component: bill_credit, amount: amount, charge_date: entry_date, source_reference_id: deposit_account_id}
  - type: deposit_refund
    target: deposit_ledger
    meaning: The cash deposit is refunded to the member after the good-payment review or the cancellation of an assessment.
    grain: One row per refund.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date refunded.
      disbursement_method: Bill credit or check.
      amount: Amount refunded, positive.
    account: deposit_held
    direction: out
    triggers:
      - event: service:service_bill_credit
        when: {disbursement_method: bill_credit}
        map: {credit_reason: deposit_refund, charge_component: bill_credit, amount: amount, charge_date: entry_date, source_reference_id: deposit_account_id}
  - type: deposit_release
    target: deposit_accounts
    mutation: {transition: {from: held, to: refunded}}
    meaning: The deposit record ends because its deposit was refunded.
    grain: One row per transaction on the deposit record.
    fields:
      closed_date: Date of the refund.
    triggers: []
  - type: deposit_apply_balance
    target: deposit_ledger
    meaning: Held deposit cash is applied against the service account's balance, on the final bill or at a PrePay Power enrollment.
    grain: One row per application to a service account balance.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date applied.
      amount: Amount applied, positive.
    account: deposit_held
    direction: out
    triggers:
      - event: service:service_bill_credit
        map: {credit_reason: deposit_application, charge_component: bill_credit, amount: amount, charge_date: entry_date, source_reference_id: deposit_account_id}
  - type: deposit_apply_prepay
    target: deposit_ledger
    meaning: The part of a held deposit left after covering the arrears is moved into the PrePay Power balance.
    grain: One row per release into a prepay enrollment.
    distinguish_by: [entry_date]
    fields:
      entry_date: Date released.
      amount: Amount moved, positive.
    account: deposit_held
    direction: out
    triggers:
      - event: prepay:prepay_deposit_credit
        map: {amount: amount, entry_date: entry_date, source_reference_id: deposit_account_id}
  - type: deposit_applied
    target: deposit_accounts
    mutation:
      transition:
        - {from: held, to: applied}
        - {from: partially_paid, to: applied}
    meaning: The deposit record ends because its cash was applied to a bill or a prepay balance.
    grain: One row per transaction on the deposit record.
    fields:
      closed_date: Date of the application.
    triggers: []
  - type: deposit_cancel
    target: deposit_accounts
    mutation:
      transition:
        - {from: assessed, to: cancelled}
        - {from: partially_paid, to: cancelled}
        - {from: held, to: cancelled}
    meaning: The assessment is cancelled because the service application was withdrawn before energization or the assessment was replaced.
    grain: One row per transaction on the deposit record.
    fields:
      closed_date: Date of the cancellation.
    triggers: []
  - type: deposit_transfer
    target: deposit_accounts
    mutation: update
    meaning: A held deposit follows the member from a final-billed service account to the member's new service account.
    grain: One row per transaction on the deposit record.
    fields:
      service_account_id: The new service account the deposit now secures.
    triggers: []

measures:
  - id: deposit_msr_bill_basis
    window: The bill_lookback_months billing periods immediately before the assessed_date, on the service account being assessed (for a transfer, the location's billing under the same service location's meter).
    measure: For each billing period, the sum of amount of service_usage_charge rows; the basis is the average of those period totals when deposit_basis is average_bill and the largest period total when deposit_basis is highest_bill; the number of periods with rows is the history length.
  - id: deposit_msr_refund_review
    window: The refund_good_payment_months full calendar months ending on the review date, on the service account the deposit secures.
    measure: Three counts in the window - service_late_charge rows, service_payment_return rows, and service_fee rows with charge_component reconnect_fee.
  - id: deposit_msr_coop_history
    window: The coop_history_months full calendar months ending on the assessed_date, on each other service account of the same member that was connected for the whole window.
    measure: For each such account, the counts of service_late_charge rows, service_payment_return rows and service_fee rows with charge_component reconnect_fee in the window; the account qualifies when the late charges are at most late_charges_allowed_in_period and the other two counts are zero.
  - id: deposit_msr_service_total
    window: Point in time, across every deposit record of the same service account.
    measure: Sum of required_amount of deposit records in assessed, partially_paid or held status.

policies:
  - id: deposit_agg_multi_holding
    subject: [deposit_assess]
    rule: >-
      A member holds one deposit record per assessment, so a member with several service accounts may hold several
      deposit records, and one service account may hold an original deposit and an additional deposit assessed on usage
      growth. A service account never carries two open assessments on the same assessment_basis. A new assessment on a
      basis that already has a deposit record in assessed or partially_paid status on the same service account is not
      made; the open one is collected instead.
    eligibility:
      - id: one_open_assessment_per_basis
        applies_to: [deposit_assess]
        kind: dedup
        condition: A service account never carries two open assessments on the same assessment_basis.
        evidence_fields: [deposit_accounts.service_account_id, deposit_accounts.assessment_basis, deposit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.service_account_id, deposit_accounts.assessment_basis]
          action_bindings:
            deposit_accounts.service_account_id: service_account_id
            deposit_accounts.assessment_basis: assessment_basis
        dedup_contract:
          table: deposit_accounts
          mode: separate_record
          object_bindings: {service_account_id: service_account_id, assessment_basis: assessment_basis}
          duplicate_filters: {status: [assessed, partially_paid]}
          distinct_fields: []
    params:
      max_per_customer: null
  - id: deposit_agg_service_total
    subject: [deposit_assess]
    rule: >-
      All deposit records of one service account are combined against the ceiling. The deposits on one service account
      in assessed, partially_paid or held status (deposit_msr_service_total) together may never exceed the tier's
      maximum_deposit. A new assessment on a service account that already carries deposits is the computed amount less the
      required_amount of the deposits already in assessed, partially_paid or held status on that account, never below zero,
      and it is then reduced to the room left under the maximum_deposit of the new assessment's tier; none is made when
      nothing remains. The deposits of different service accounts of the same member are never combined: each meter is secured by
      its own deposit. A waived, refunded, applied or cancelled record does not count toward the ceiling.
    eligibility: []
    measures: [deposit_msr_service_total]
  - id: deposit_evt_assessment
    subject: [deposit_assess]
    rule: >-
      A deposit is assessed when a service account is opened for new service, when an account is reconnected after a
      nonpayment disconnection, when usage growth triggers a reassessment, or when a waived account is disconnected for
      nonpayment. A deposit may be assessed only on a service account in pending_connect, active, disconnect_pending or
      disconnected_nonpay status. The tier is the deposit_tier named by the service account's rate schedule, except that
      a reconnection after a nonpayment disconnection on Schedule R or Schedule FH is assessed on the Residential Credit
      Reestablishment Deposit; a tier is used only for the assessment_bases it lists. The amount is deposit_multiple
      times the basis bill of deposit_msr_bill_basis when the location has at least min_history_months of history, and
      otherwise the higher of new_service_estimated_deposit and new_service_estimate_per_kva times the transformer_kva.
      The result is rounded up to the next multiple of rounding_increment, raised to minimum_deposit when lower, and then
      limited by deposit_agg_service_total. When installments_allowed is true the member is granted installment_count
      installments; otherwise installment_count is 1. A member enrolled in PrePay Power is never assessed a deposit on
      the prepay meter.
      A tier is used only for service accounts on its eligible_rate_schedules.
    eligibility:
      - id: service_account_open
        applies_to: [deposit_assess]
        kind: state
        condition: A deposit may be assessed only on a service account in pending_connect, active, disconnect_pending or disconnected_nonpay status.
        evidence_fields: [service_accounts.status, service_accounts.service_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
        state_contract:
          field: service_accounts.status
          allowed: [pending_connect, active, disconnect_pending, disconnected_nonpay]
    params:
      per_tier:
        Residential Standard Deposit: {deposit_basis: "=deposit_basis", deposit_multiple: "=deposit_multiple", minimum_deposit: "=minimum_deposit", maximum_deposit: "=maximum_deposit", rounding_increment: "=rounding_increment", new_service_estimated_deposit: "=new_service_estimated_deposit"}
        Residential Credit Reestablishment Deposit: {deposit_basis: "=deposit_basis", deposit_multiple: "=deposit_multiple", minimum_deposit: "=minimum_deposit", maximum_deposit: "=maximum_deposit", rounding_increment: "=rounding_increment", new_service_estimated_deposit: "=new_service_estimated_deposit"}
        Seasonal Residence Deposit: {deposit_basis: "=deposit_basis", deposit_multiple: "=deposit_multiple", minimum_deposit: "=minimum_deposit", maximum_deposit: "=maximum_deposit", rounding_increment: "=rounding_increment", new_service_estimated_deposit: "=new_service_estimated_deposit"}
        Farm Service Deposit: {deposit_basis: "=deposit_basis", deposit_multiple: "=deposit_multiple", minimum_deposit: "=minimum_deposit", maximum_deposit: "=maximum_deposit", rounding_increment: "=rounding_increment", new_service_estimated_deposit: "=new_service_estimated_deposit"}
        General Service Deposit: {deposit_basis: "=deposit_basis", deposit_multiple: "=deposit_multiple", minimum_deposit: "=minimum_deposit", maximum_deposit: "=maximum_deposit", rounding_increment: "=rounding_increment", new_service_estimated_deposit: "=new_service_estimated_deposit"}
        Irrigation and Large Power Deposit: {deposit_basis: "=deposit_basis", deposit_multiple: "=deposit_multiple", minimum_deposit: "=minimum_deposit", maximum_deposit: "=maximum_deposit", rounding_increment: "=rounding_increment", new_service_estimated_deposit: "=new_service_estimated_deposit"}
    formula:
      history_amount: deposit_multiple * deposit_msr_bill_basis
    measures: [deposit_msr_bill_basis]
  - id: deposit_evt_waiver
    subject: [deposit_waive, deposit_assess]
    rule: >-
      A deposit is waived only before any payment has posted on it, and only on one of these grounds. Where
      prior_utility_letter_waiver is true, a letter from the member's previous electric utility waives it when the letter
      covers at least prior_utility_letter_months of service in the member's name, shows no more than
      prior_utility_letter_max_late late payments and no disconnection, and is dated no more than
      prior_utility_letter_max_age_days calendar days before the assessed_date. Where coop_history_waiver is true, the
      deposit is waived when at least one other service account of the same member qualifies under
      deposit_msr_coop_history. Where surety_bond_accepted or letter_of_credit_accepted is true, a surety bond or an
      irrevocable bank letter of credit for at least the required amount with at least security_instrument_min_term_months
      remaining stands in place of cash. A reconnection after a nonpayment disconnection is never waived. Where
      waiver_reinstatement_on_nonpay is true, an account whose deposit was waived and that is later disconnected for
      nonpayment is assessed a new deposit on the assessment_basis waiver_reinstatement. A member's own statement of good
      history elsewhere never waives a deposit; the letter, bond or Cedar Fork history must be on file.
      A bond or letter of credit on file is followed up security_instrument_renewal_notice_days before it expires, and a
      lapsed instrument is replaced by a cash deposit assessment on the assessment_basis waiver_reinstatement.
    eligibility:
      - id: waiver_before_payment
        applies_to: [deposit_waive]
        kind: authorization
        condition: A deposit is waived only before any payment has posted on it, and only on one of these grounds.
        evidence_fields: [deposit_accounts.held_amount, deposit_accounts.deposit_account_id, deposit_ledger.deposit_account_id, deposit_ledger.event_type]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_account_id]
          action_bindings:
            deposit_accounts.deposit_account_id: deposit_account_id
    params:
      per_tier:
        Residential Standard Deposit: {prior_utility_letter_waiver: "=prior_utility_letter_waiver", coop_history_waiver: "=coop_history_waiver", surety_bond_accepted: "=surety_bond_accepted", letter_of_credit_accepted: "=letter_of_credit_accepted"}
        Residential Credit Reestablishment Deposit: {prior_utility_letter_waiver: "=prior_utility_letter_waiver", coop_history_waiver: "=coop_history_waiver", surety_bond_accepted: "=surety_bond_accepted", letter_of_credit_accepted: "=letter_of_credit_accepted"}
        Seasonal Residence Deposit: {prior_utility_letter_waiver: "=prior_utility_letter_waiver", coop_history_waiver: "=coop_history_waiver", surety_bond_accepted: "=surety_bond_accepted", letter_of_credit_accepted: "=letter_of_credit_accepted"}
        Farm Service Deposit: {prior_utility_letter_waiver: "=prior_utility_letter_waiver", coop_history_waiver: "=coop_history_waiver", surety_bond_accepted: "=surety_bond_accepted", letter_of_credit_accepted: "=letter_of_credit_accepted"}
        General Service Deposit: {prior_utility_letter_waiver: "=prior_utility_letter_waiver", coop_history_waiver: "=coop_history_waiver", surety_bond_accepted: "=surety_bond_accepted", letter_of_credit_accepted: "=letter_of_credit_accepted"}
        Irrigation and Large Power Deposit: {prior_utility_letter_waiver: "=prior_utility_letter_waiver", coop_history_waiver: "=coop_history_waiver", surety_bond_accepted: "=surety_bond_accepted", letter_of_credit_accepted: "=letter_of_credit_accepted"}
    measures: [deposit_msr_coop_history]
  - id: deposit_evt_payments
    subject: [deposit_payment, deposit_partial, deposit_paid_full]
    rule: >-
      A deposit is due deposit_due_days calendar days after the assessed_date, in full or, where installments are
      granted, as a first installment of first_installment_pct percent of the required amount rounded to the cent, with
      the rest split evenly over the remaining installments due with the next monthly bills and the last one absorbing any
      cent difference. Deposit payments may be posted only while the deposit record is in assessed or partially_paid
      status; money received for a held deposit is a service payment, not a deposit payment. Where
      deposit_due_before_connect is true the full deposit or first installment must be paid before the meter is
      energized. Where installment_default_accelerates is true, an installment unpaid on its due date makes the whole
      unpaid remainder due at once and it counts as past due on the service account for collection. The record moves to
      partially_paid with the first installment and to held when the payments reach the required amount; an overpayment
      beyond the required amount is posted to the service account instead.
      Deposit payments are accepted only through deposit_payment_channels.
    eligibility:
      - id: deposit_open_for_payment
        applies_to: [deposit_payment]
        kind: state
        condition: Deposit payments may be posted only while the deposit record is in assessed or partially_paid status; money received for a held deposit is a service payment, not a deposit payment.
        evidence_fields: [deposit_accounts.status, deposit_accounts.deposit_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_account_id]
          action_bindings:
            deposit_accounts.deposit_account_id: deposit_account_id
        state_contract:
          field: deposit_accounts.status
          allowed: [assessed, partially_paid]
    params:
      per_tier:
        Residential Standard Deposit: {installment_count: "=installment_count", first_installment_pct: "=first_installment_pct", deposit_due_days: "=deposit_due_days"}
        Residential Credit Reestablishment Deposit: {installment_count: "=installment_count", first_installment_pct: "=first_installment_pct", deposit_due_days: "=deposit_due_days"}
        Seasonal Residence Deposit: {installment_count: "=installment_count", first_installment_pct: "=first_installment_pct", deposit_due_days: "=deposit_due_days"}
        Farm Service Deposit: {installment_count: "=installment_count", first_installment_pct: "=first_installment_pct", deposit_due_days: "=deposit_due_days"}
        General Service Deposit: {installment_count: "=installment_count", first_installment_pct: "=first_installment_pct", deposit_due_days: "=deposit_due_days"}
        Irrigation and Large Power Deposit: {installment_count: "=installment_count", first_installment_pct: "=first_installment_pct", deposit_due_days: "=deposit_due_days"}
    formula:
      first_installment: round(required_amount * first_installment_pct / 100, 2)
      later_installment: round((required_amount - first_installment) / max(installment_count - 1, 1), 2)
  - id: deposit_evt_interest
    subject: [deposit_interest_accrual, deposit_interest_payout]
    rule: >-
      Where interest_applies is true, cash held earns simple interest at the rate interest_rate_by_year gives for each
      calendar year. Interest accrues on the held_amount for each day it was held, the accrual_days of a period counting
      the posting date of each deposit payment and the last day of the period, divided by interest_day_count. Interest is accrued for each
      calendar year on December 31 and, where interest_on_partial_year is true, for the part year up to the date of a
      refund or application, each period spanning two calendar years being split at the year end. Interest may be accrued
      only while the deposit record is in partially_paid or held status. The prior year's interest is paid out by
      interest_payout_method on the bill of interest_payout_month; part-year interest is paid out with the refund or
      applied with the deposit. Interest is rounded to the cent per accrual period and never compounds.
      The interest_compounding of every tier is simple.
    eligibility:
      - id: interest_on_cash_held
        applies_to: [deposit_interest_accrual]
        kind: state
        condition: Interest may be accrued only while the deposit record is in partially_paid or held status.
        evidence_fields: [deposit_accounts.status, deposit_accounts.deposit_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_account_id]
          action_bindings:
            deposit_accounts.deposit_account_id: deposit_account_id
        state_contract:
          field: deposit_accounts.status
          allowed: [partially_paid, held]
    formula:
      interest_amount: round(held_amount * interest_rate_pct / 100 * accrual_days / interest_day_count, 2)
  - id: deposit_evt_refund
    subject: [deposit_refund, deposit_release, deposit_interest_payout]
    rule: >-
      A good-payment refund is made when the deposit has been held long enough and the account's payment record is good.
      Refunds are paid only from a deposit record in partially_paid or held status. A refund review
      may take place only after refund_good_payment_months full calendar months have passed since the deposit was paid in
      full. Calendar months are counted from the paid_in_full_date to the same day number of the later month, falling back
      to the last day of that month when the day number does not exist. The payment record is good when, in the
      deposit_msr_refund_review window, the late charges are at most late_charges_allowed_in_period, the returned payments
      at most returned_payments_allowed_in_period and the reconnections after nonpayment at most
      reconnects_allowed_in_period. A good review refunds the whole held_amount together with interest accrued to the
      refund date, by refund_method_default, or by check when the member asks for a check and the refund is at least
      refund_check_on_request_min. A review that is not good leaves the deposit held; it is reviewed again monthly. A
      deposit on a disconnected_nonpay or final_billed account is never refunded; it is applied instead.
    eligibility:
      - id: held_long_enough
        applies_to: [deposit_refund, deposit_release]
        kind: time
        condition: A refund review may take place only after refund_good_payment_months full calendar months have passed since the deposit was paid in full.
        evidence_fields: [deposit_accounts.paid_in_full_date, deposit_accounts.deposit_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_account_id]
          action_bindings:
            deposit_accounts.deposit_account_id: deposit_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the deposit was paid in full
          anchor_source: deposit_accounts.paid_in_full_date
          relation: not_before
          duration_source: variants.refund_good_payment_months
          unit: calendar_months
          counting_rule: Calendar months are counted from the paid_in_full_date to the same day number of the later month, falling back to the last day of that month when the day number does not exist.
          boundary: inclusive
      - id: refund_only_from_held
        applies_to: [deposit_refund]
        kind: state
        condition: Refunds are paid only from a deposit record in partially_paid or held status.
        evidence_fields: [deposit_accounts.status, deposit_accounts.deposit_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_account_id]
          action_bindings:
            deposit_accounts.deposit_account_id: deposit_account_id
        state_contract:
          field: deposit_accounts.status
          allowed: [partially_paid, held]
    params:
      per_tier:
        Residential Standard Deposit: {refund_good_payment_months: "=refund_good_payment_months", late_charges_allowed_in_period: "=late_charges_allowed_in_period", returned_payments_allowed_in_period: "=returned_payments_allowed_in_period", reconnects_allowed_in_period: "=reconnects_allowed_in_period", refund_method_default: "=refund_method_default"}
        Residential Credit Reestablishment Deposit: {refund_good_payment_months: "=refund_good_payment_months", late_charges_allowed_in_period: "=late_charges_allowed_in_period", returned_payments_allowed_in_period: "=returned_payments_allowed_in_period", reconnects_allowed_in_period: "=reconnects_allowed_in_period", refund_method_default: "=refund_method_default"}
        Seasonal Residence Deposit: {refund_good_payment_months: "=refund_good_payment_months", late_charges_allowed_in_period: "=late_charges_allowed_in_period", returned_payments_allowed_in_period: "=returned_payments_allowed_in_period", reconnects_allowed_in_period: "=reconnects_allowed_in_period", refund_method_default: "=refund_method_default"}
        Farm Service Deposit: {refund_good_payment_months: "=refund_good_payment_months", late_charges_allowed_in_period: "=late_charges_allowed_in_period", returned_payments_allowed_in_period: "=returned_payments_allowed_in_period", reconnects_allowed_in_period: "=reconnects_allowed_in_period", refund_method_default: "=refund_method_default"}
        General Service Deposit: {refund_good_payment_months: "=refund_good_payment_months", late_charges_allowed_in_period: "=late_charges_allowed_in_period", returned_payments_allowed_in_period: "=returned_payments_allowed_in_period", reconnects_allowed_in_period: "=reconnects_allowed_in_period", refund_method_default: "=refund_method_default"}
        Irrigation and Large Power Deposit: {refund_good_payment_months: "=refund_good_payment_months", late_charges_allowed_in_period: "=late_charges_allowed_in_period", returned_payments_allowed_in_period: "=returned_payments_allowed_in_period", reconnects_allowed_in_period: "=reconnects_allowed_in_period", refund_method_default: "=refund_method_default"}
    measures: [deposit_msr_refund_review]
  - id: deposit_evt_application
    subject: [deposit_apply_balance, deposit_apply_prepay, deposit_applied, deposit_interest_payout]
    rule: >-
      When the service account is final billed and apply_on_final_bill is true, the held_amount and the interest accrued
      to the final date are applied to the final bill, oldest charges first; any excess over the final balance is refunded
      by check with the final credit refund. When the service account enrolls in PrePay Power and
      apply_on_prepay_enrollment is true, the held_amount and accrued interest are applied first against the service
      account's balance (deposit_apply_balance) up to that balance, and only the remainder is released into the prepaid
      balance (deposit_apply_prepay). A partially_paid deposit is applied the same way for the part paid. A deposit is
      never applied to an account that is still open and active merely because a bill is past due; collection follows the
      Electric Service charter. Each application ends the deposit record in applied status.
      The final bill is credited under final_application_order.
    eligibility: []
  - id: deposit_evt_transfer
    subject: [deposit_transfer]
    rule: >-
      Where transfer_to_new_location is true, a member moving within the Cedar Fork territory may ask that a held deposit
      follow them to the new service account instead of being applied to the old one's final bill. The deposit may follow
      the member only when the old service account is final_billed with an account_balance of exactly zero after the final
      bill is paid and the new service account belongs to the same member and is mapped to the same deposit tier. The
      paid_in_full_date and accrued interest carry over, so the refund review keeps counting from the original date. The
      new service account then needs no new-service deposit for the amount transferred.
    eligibility:
      - id: old_account_settled
        applies_to: [deposit_transfer]
        kind: authorization
        condition: The deposit may follow the member only when the old service account is final_billed with an account_balance of exactly zero after the final bill is paid and the new service account belongs to the same member and is mapped to the same deposit tier.
        evidence_fields: [service_accounts.service_account_id, service_accounts.status, service_accounts.account_balance, service_accounts.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [service_accounts.service_account_id]
          action_bindings:
            service_accounts.service_account_id: service_account_id
  - id: deposit_evt_reassessment
    subject: [deposit_assess]
    rule: >-
      Where reassessment_allowed is true, an additional deposit on the assessment_basis usage_reassessment is assessed when
      the current deposit_msr_bill_basis exceeds the basis the existing deposit was computed from by more than
      reassess_usage_increase_pct percent. The additional deposit is the amount the account's deposits fall short of a
      fresh computation under deposit_evt_assessment, limited by deposit_agg_service_total, and it is assessed only when
      that shortfall is at least reassess_min_additional. A falling bill basis never reduces or partly refunds a deposit;
      only the refund review releases it.
    eligibility: []
    params:
      per_tier:
        Residential Standard Deposit: {reassessment_allowed: "=reassessment_allowed", reassess_usage_increase_pct: "=reassess_usage_increase_pct", reassess_min_additional: "=reassess_min_additional"}
        Residential Credit Reestablishment Deposit: {reassessment_allowed: "=reassessment_allowed", reassess_usage_increase_pct: "=reassess_usage_increase_pct", reassess_min_additional: "=reassess_min_additional"}
        Seasonal Residence Deposit: {reassessment_allowed: "=reassessment_allowed", reassess_usage_increase_pct: "=reassess_usage_increase_pct", reassess_min_additional: "=reassess_min_additional"}
        Farm Service Deposit: {reassessment_allowed: "=reassessment_allowed", reassess_usage_increase_pct: "=reassess_usage_increase_pct", reassess_min_additional: "=reassess_min_additional"}
        General Service Deposit: {reassessment_allowed: "=reassessment_allowed", reassess_usage_increase_pct: "=reassess_usage_increase_pct", reassess_min_additional: "=reassess_min_additional"}
        Irrigation and Large Power Deposit: {reassessment_allowed: "=reassessment_allowed", reassess_usage_increase_pct: "=reassess_usage_increase_pct", reassess_min_additional: "=reassess_min_additional"}
  - id: deposit_evt_cancellation
    subject: [deposit_cancel, deposit_refund]
    rule: >-
      An assessment is cancelled when the service application is withdrawn before the meter is energized, or when an
      assessment made on the wrong tier or basis is replaced by a corrected one before any payment. Payments already
      posted on a cancelled application's deposit are refunded by check within refund_on_cancel_days calendar days. A
      deposit on an energized account is never cancelled; it is refunded or applied.
    eligibility: []


extended_policies:
- id: deposit_ext_reinstated_first_installment
  base_policy_refs: [deposit_evt_payments]
  overwrite:
  - base_policy: deposit_evt_payments
    superseded_clause: A deposit is due deposit_due_days calendar days after the assessed_date, in full or, where installments are granted, as a first installment of first_installment_pct percent of the required amount rounded to the cent, with the rest split evenly over the remaining installments due with the next monthly bills and the last one absorbing any cent difference.
    replaced_by: The first installment of a reinstated deposit taken while its service account waits to be reconnected is the reinstated deposit's required amount multiplied by the first-installment share in percent and divided by one hundred, rounded to the nearest cent once, on that final figure only.
  trigger: on_request
  subject: [deposit_payment, deposit_partial]
  computes: amount
  target_tool: pay_reinstated_deposit_installment_114bda0d
  params:
    share_cleared: 30
    share_half: 40
    tenure_long_months: 36
    tenure_mid_months: 12
    tenure_points_long: 5
    tenure_points_mid: 2
    pledge_points_recent: 5
    pledge_points_older: 3
    smaller_points_weight_single_return: 0.5
  rule: >-
    This policy sets the first installment a member pays on a deposit reinstated on the assessment basis
    waiver_reinstatement while the service account it secures stands disconnected for nonpayment and waits
    to be reconnected; the rest of the reinstated deposit is split evenly over its remaining installments,
    due with the next monthly bills, the last one absorbing any cent difference, and that first installment
    falls due deposit_due_days calendar days after the assessed_date. The first installment of a reinstated
    deposit taken while its service account waits to be reconnected is the reinstated deposit's required
    amount multiplied by the first-installment share in percent and divided by one hundred, rounded to the
    nearest cent once, on that final figure only. The first-installment share is the starting share less the
    relief points, the relief points being the tenure points and the pledge points combined as set out below;
    the points are subtracted from the share, never from the amount. The standard first-installment share is
    the tier's first_installment_pct with no relief points, so the standard first installment of a reinstated
    deposit is the tier's first_installment_pct percent of its required amount, rounded to the nearest cent.
    The share starts from the record of the outstanding disconnect notice: when the service payments posted
    on the account less than one whole month before today reach the past-due amount the outstanding notice
    demands, the share starts at the cleared-notice share; when those payments reach at least half of that
    amount but less than all of it, the share starts at the half-cleared share; otherwise, and always where no
    notice is outstanding, the share starts at the tier's first_installment_pct.
    Tenure points come from the whole months from the account's connect date to today: an account connected
    at least the long-tenure months earns the long-tenure points; an account connected at least the
    mid-tenure months but fewer than the long-tenure months earns the mid-tenure points; an account connected
    fewer than the mid-tenure months earns no tenure points.
    Pledge points come from the energy assistance pledges recorded on the account: a pledge recorded less
    than one whole month before today earns the recent-pledge points; where no pledge is that recent but one
    was recorded less than three whole months before today, the account earns the older-pledge points; an
    account with no pledge recorded in the last three months earns no pledge points.
    How the tenure points and the pledge points combine depends on the account's returned payments in the last
    twelve whole months: with exactly one returned payment, the larger of the two point counts is taken in
    full and the smaller is taken at the single-return weight; with two or more returned payments, only the
    larger of the two point counts is taken; with none, the two point counts are added together.
  prerequisite: []
  cross_category:
  - category: service
    as: history
    reads: [service_payments.amount, service_payments.event_type, service_payments.payment_date, service_accounts.disconnect_past_due_amount, service_accounts.connect_date]
    note: The share, tenure, pledge and point-combination tiers are read from the Electric Service account the reinstated deposit secures.
  compute:
  - required: "F('required_amount')"
  - paid_since_notice: "XSUM('service', 'service_payments', 'amount', within_months=1, date_field='payment_date', event_type='service_payment', service_account_id=F('service_account_id'))"
  - notice_amount: "CFIELD('service', 'disconnect_past_due_amount', service_account_id=F('service_account_id'))"
  - start_share: "K('share_cleared') if (notice_amount > 0 and paid_since_notice >= notice_amount) else (K('share_half') if (notice_amount > 0 and paid_since_notice >= notice_amount / 2) else P('first_installment_pct'))"
  - months_connected: "MONTHS(CFIELD('service', 'connect_date', service_account_id=F('service_account_id')), NOW)"
  - tenure_points: "K('tenure_points_long') if months_connected >= K('tenure_long_months') else (K('tenure_points_mid') if months_connected >= K('tenure_mid_months') else 0)"
  - pledges_recent: "XCOUNT('service', 'service_payments', within_months=1, date_field='payment_date', event_type='service_assistance_pledge', service_account_id=F('service_account_id'))"
  - pledges_older: "XCOUNT('service', 'service_payments', within_months=3, date_field='payment_date', event_type='service_assistance_pledge', service_account_id=F('service_account_id'))"
  - pledge_points: "K('pledge_points_recent') if pledges_recent > 0 else (K('pledge_points_older') if pledges_older > 0 else 0)"
  - returns_12m: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment_return', service_account_id=F('service_account_id'))"
  - relief_points: "MX(tenure_points, pledge_points) + K('smaller_points_weight_single_return') * MN(tenure_points, pledge_points) if returns_12m == 1 else (MX(tenure_points, pledge_points) if returns_12m >= 2 else tenure_points + pledge_points)"
  - share: "start_share - relief_points"
  - result: "RND(required * share / 100, 2)"
  compute_basis:
    required: The first installment of a reinstated deposit taken while its service account waits to be reconnected is the reinstated deposit's required amount multiplied by the first-installment share in percent and divided by one hundred, rounded to the nearest cent once, on that final figure only.
    paid_since_notice: when the service payments posted on the account less than one whole month before today reach the past-due amount the outstanding notice demands, the share starts at the cleared-notice share
    notice_amount: The share starts from the record of the outstanding disconnect notice
    start_share: when the service payments posted on the account less than one whole month before today reach the past-due amount the outstanding notice demands, the share starts at the cleared-notice share; when those payments reach at least half of that amount but less than all of it, the share starts at the half-cleared share; otherwise, and always where no notice is outstanding, the share starts at the tier's first_installment_pct.
    months_connected: Tenure points come from the whole months from the account's connect date to today
    tenure_points: an account connected at least the long-tenure months earns the long-tenure points; an account connected at least the mid-tenure months but fewer than the long-tenure months earns the mid-tenure points; an account connected fewer than the mid-tenure months earns no tenure points.
    pledges_recent: a pledge recorded less than one whole month before today earns the recent-pledge points
    pledges_older: where no pledge is that recent but one was recorded less than three whole months before today, the account earns the older-pledge points
    pledge_points: a pledge recorded less than one whole month before today earns the recent-pledge points; where no pledge is that recent but one was recorded less than three whole months before today, the account earns the older-pledge points; an account with no pledge recorded in the last three months earns no pledge points.
    returns_12m: How the tenure points and the pledge points combine depends on the account's returned payments in the last twelve whole months
    relief_points: "with exactly one returned payment, the larger of the two point counts is taken in full and the smaller is taken at the single-return weight; with two or more returned payments, only the larger of the two point counts is taken; with none, the two point counts are added together."
    share: The first-installment share is the starting share less the relief points, the relief points being the tenure points and the pledge points combined as set out below; the points are subtracted from the share, never from the amount.
    result: rounded to the nearest cent once, on that final figure only.
  factors:
  - id: notice_clearance_share
    effect: parameter
    decides: start_share
    bindings: [paid_since_notice, notice_amount, start_share]
    ladder:
    - when: "the service payments posted on the account less than one whole month before today reach the past-due amount the outstanding disconnect notice demands"
      value: "K('share_cleared')"
    - when: "those payments reach at least half of that amount but less than all of it"
      value: "K('share_half')"
    - when: "otherwise, including an account with no outstanding notice"
      value: "P('first_installment_pct')"
    baseline:
      start_share: "P('first_installment_pct')"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: connection_tenure_points
    effect: parameter
    decides: tenure_points
    bindings: [months_connected, tenure_points]
    ladder:
    - when: "the account was connected at least the long-tenure months before today"
      value: "K('tenure_points_long')"
    - when: "the account was connected at least the mid-tenure months but fewer than the long-tenure months before today"
      value: "K('tenure_points_mid')"
    - when: "otherwise"
      value: "0"
    baseline:
      tenure_points: "0"
    evidence: [date, cross_category]
    cross_difficulty: service
  - id: assistance_pledge_points
    effect: parameter
    decides: pledge_points
    bindings: [pledges_recent, pledges_older, pledge_points]
    ladder:
    - when: "an energy assistance pledge was recorded on the account less than one whole month before today"
      value: "K('pledge_points_recent')"
    - when: "no pledge is that recent but one was recorded less than three whole months before today"
      value: "K('pledge_points_older')"
    - when: "otherwise"
      value: "0"
    baseline:
      pledge_points: "0"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: relief_points_combination
    effect: method
    decides: relief_points
    bindings: [returns_12m, relief_points]
    ladder:
    - when: "the account has exactly one returned payment in the last twelve whole months"
      method: "the relief points are the larger of the tenure and pledge points in full plus the smaller at the single-return weight"
    - when: "the account has two or more returned payments in that period"
      method: "the relief points are only the larger of the tenure and pledge points; the smaller is dropped"
    - when: "otherwise"
      method: "the relief points are the tenure points and the pledge points added together"
    baseline:
      relief_points: "tenure_points + pledge_points"
    evidence: [history, cross_category]
    cross_difficulty: service
  baseline:
    rule: >-
      The standard first-installment share is the tier's first_installment_pct with no relief points, so the
      standard first installment of a reinstated deposit is the tier's first_installment_pct percent of its
      required amount, rounded to the nearest cent.
    params: [first_installment_pct, deposit_due_days]
  inputs:
    history:
    - {category: service, table: service_payments, aggregate: sum, field: amount, within_months: 1, filters: {event_type: service_payment}}
    - {category: service, table: service_payments, aggregate: count, field: payment_date, within_months: 3, filters: {event_type: service_assistance_pledge}}
    - {category: service, table: service_payments, aggregate: count, field: payment_date, within_months: 12, filters: {event_type: service_payment_return}}
    cross_category: [service]
- id: deposit_ext_waiver_reinstatement
  base_policy_refs: [deposit_agg_multi_holding, deposit_agg_service_total, deposit_evt_assessment, deposit_evt_waiver, deposit_evt_reassessment]
  overwrite:
  - base_policy: deposit_evt_waiver
    superseded_clause: Where waiver_reinstatement_on_nonpay is true, an account whose deposit was waived and that is later disconnected for nonpayment is assessed a new deposit on the assessment_basis waiver_reinstatement.
    replaced_by: Where waiver_reinstatement_on_nonpay is true, a deposit waiver ends and the deposit is reinstated on the assessment basis waiver_reinstatement when the account it covered is disconnected for nonpayment, and also when the waiver rested on the payment history of another Cedar Fork service account and that other account is disconnected for nonpayment.
  - base_policy: deposit_evt_assessment
    superseded_clause: The amount is deposit_multiple times the basis bill of deposit_msr_bill_basis when the location has at least min_history_months of history, and otherwise the higher of new_service_estimated_deposit and new_service_estimate_per_kva times the transformer_kva.
    replaced_by: The reinstated amount is the reinstatement multiple times the reinstatement basis bill when the account has at least min_history_months billing periods in the last twelve, and otherwise the higher of new_service_estimated_deposit and new_service_estimate_per_kva times the transformer_kva.
  - base_policy: deposit_agg_service_total
    superseded_clause: A new assessment on a service account that already carries deposits is the computed amount less the required_amount of the deposits already in assessed, partially_paid or held status on that account, never below zero, and it is then reduced to the room left under the maximum_deposit of the new assessment's tier; none is made when nothing remains.
    replaced_by: A reinstated deposit is the only deposit its account carries, because the waiver it replaces stood in place of that account's deposit, and it never exceeds the tier's maximum_deposit.
  trigger: state_due
  subject: [deposit_assess]
  computes: required_amount
  target_tool: assess_reinstated_deposit_c3ac4854
  params:
    short_history_months: 24
    long_history_months: 60
    growth_high: 1.35
    growth_mid: 1.15
    clean_record_multiple: 1.75
    one_late_multiple: 1.9
    qualifying_cut_relief: -0.1
    own_cut_surcharge: 0.25
    autopay_full_relief: 0.15
    autopay_half_relief: 0.05
    remote_meter_relief_long: 0.05
    remote_meter_relief_short: 0.02
    multiple_floor: 1.0
  rule: >-
    Where waiver_reinstatement_on_nonpay is true, a deposit waiver ends and the deposit is reinstated on the
    assessment basis waiver_reinstatement when the account it covered is disconnected for nonpayment, and
    also when the waiver rested on the payment history of another Cedar Fork service account and that other
    account is disconnected for nonpayment. A waiver rests on another account when its waiver basis is
    coop_payment_history and its waiver reference is that account's account number. The reinstated deposit is
    assessed on the account the waived record secures, on the tier of the waived record, with installment_count
    installments where installments_allowed is true and otherwise due in full; the waived record itself is
    not reopened. A reinstated deposit is the only deposit its account carries, because the waiver it replaces
    stood in place of that account's deposit, and it never exceeds the tier's maximum_deposit.
    The reinstated amount is the reinstatement multiple times the reinstatement basis bill when the account
    has at least min_history_months billing periods in the last twelve, and otherwise the higher of
    new_service_estimated_deposit and new_service_estimate_per_kva times the transformer_kva. A billing
    period's bill is the sum of that period's usage lines, and the number of billing periods is the number of
    facility charge lines. The result is rounded up to the next multiple of rounding_increment, then raised to
    minimum_deposit when lower, then limited to maximum_deposit.
    The standard reinstatement basis bill is the average bill of the twelve billing periods immediately
    before today, and the standard reinstatement multiple is the tier's deposit_multiple, so the standard
    reinstated deposit is deposit_multiple times that twelve-period average, rounded up to the next multiple
    of rounding_increment, raised to minimum_deposit when lower and limited to maximum_deposit.
    The averaging window of the reinstatement depends on how long the account has been connected: an account
    connected fewer than the short-history months before today is averaged over every billing period since
    its connection; an account connected the long-history months or more is averaged over the twenty-four
    billing periods immediately before today; any other account is averaged over the twelve billing periods
    immediately before today.
    The reinstatement basis bill then follows the account's recent load: the recent average is the average
    bill of the three billing periods immediately before today; when the recent average exceeds the window
    average by more than the high growth ratio, the basis bill is the recent average; when it exceeds the
    window average by more than the mid growth ratio but not by more than the high growth ratio, the basis
    bill is the midpoint of the recent average and the window average; otherwise the basis bill is the window
    average.
    The reinstatement multiple is the record multiple plus the waiver-loss adjustment, less the autopay
    relief, less the remote-meter relief, and never below the multiple floor. The record multiple comes from
    the reinstated account's own last twelve months: no late payment charge and no returned payment takes the
    clean-record multiple; exactly one late payment charge and no returned payment takes the one-late
    multiple; anything else takes the tier's deposit_multiple. The waiver-loss adjustment is the
    qualifying-cut relief when the reinstated account is not itself disconnected for nonpayment and the
    account its waiver rested on is disconnected for nonpayment, the own-cut surcharge when the reinstated
    account is itself disconnected for nonpayment, and nothing otherwise. The autopay relief is the full
    autopay relief when every service payment on the reinstated account in the last twelve months came by
    automatic bank draft, the half autopay relief when at least half but not all of them did, and nothing
    otherwise. The remote-meter relief is the long remote-meter relief when the reinstated account has a
    remote-disconnect meter and was connected at least twelve months before today, the short remote-meter
    relief when it has a remote-disconnect meter and was connected fewer than twelve months before today,
    and nothing otherwise.
  prerequisite: []
  cross_category:
  - category: service
    as: history
    reads: [service_charges.amount, service_charges.event_type, service_charges.charge_component, service_charges.charge_date, service_payments.event_type, service_payments.payment_channel, service_payments.payment_date, service_accounts.connect_date, service_accounts.status, service_accounts.meter_type, service_accounts.transformer_kva, service_accounts.account_number]
    note: The window, growth, record, waiver-loss, autopay and meter tiers are read from the reinstated account's Electric Service bills and payments and from the account the waiver rested on.
  compute:
  - months_connected: "MONTHS(CFIELD('service', 'connect_date', service_account_id=F('service_account_id')), NOW)"
  - sum_12: "XSUM('service', 'service_charges', 'amount', within_months=12, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - periods_12: "XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', event_type='service_usage_charge', charge_component='facility_charge', service_account_id=F('service_account_id'))"
  - sum_24: "XSUM('service', 'service_charges', 'amount', within_months=24, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - periods_24: "XCOUNT('service', 'service_charges', within_months=24, date_field='charge_date', event_type='service_usage_charge', charge_component='facility_charge', service_account_id=F('service_account_id'))"
  - sum_since: "XSUM('service', 'service_charges', 'amount', within_months=months_connected + 1, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - periods_since: "XCOUNT('service', 'service_charges', within_months=months_connected + 1, date_field='charge_date', event_type='service_usage_charge', charge_component='facility_charge', service_account_id=F('service_account_id'))"
  - window_average: "sum_since / MX(periods_since, 1) if months_connected < K('short_history_months') else (sum_24 / MX(periods_24, 1) if months_connected >= K('long_history_months') else sum_12 / MX(periods_12, 1))"
  - sum_3: "XSUM('service', 'service_charges', 'amount', within_months=3, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - periods_3: "XCOUNT('service', 'service_charges', within_months=3, date_field='charge_date', event_type='service_usage_charge', charge_component='facility_charge', service_account_id=F('service_account_id'))"
  - recent_average: "sum_3 / MX(periods_3, 1)"
  - basis_bill: "recent_average if recent_average > K('growth_high') * window_average else ((recent_average + window_average) / 2 if recent_average > K('growth_mid') * window_average else window_average)"
  - late_12: "XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', event_type='service_late_charge', service_account_id=F('service_account_id'))"
  - returns_12: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment_return', service_account_id=F('service_account_id'))"
  - record_multiple: "K('clean_record_multiple') if (late_12 == 0 and returns_12 == 0) else (K('one_late_multiple') if (late_12 == 1 and returns_12 == 0) else P('deposit_multiple'))"
  - own_status: "CFIELD('service', 'status', service_account_id=F('service_account_id'))"
  - qualifying_status: "CFIELD('service', 'status', account_number=F('waiver_reference'))"
  - waiver_loss_adjustment: "K('qualifying_cut_relief') if (own_status != 'disconnected_nonpay' and qualifying_status == 'disconnected_nonpay') else (K('own_cut_surcharge') if own_status == 'disconnected_nonpay' else 0)"
  - payments_12: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment', service_account_id=F('service_account_id'))"
  - drafts_12: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment', payment_channel='autopay_bank_draft', service_account_id=F('service_account_id'))"
  - autopay_relief: "K('autopay_full_relief') if (payments_12 > 0 and drafts_12 == payments_12) else (K('autopay_half_relief') if (payments_12 > 0 and drafts_12 * 2 >= payments_12) else 0)"
  - shop_meter: "CFIELD('service', 'meter_type', service_account_id=F('service_account_id'))"
  - remote_meter_relief: "K('remote_meter_relief_long') if (shop_meter == 'ami_remote_disconnect' and months_connected >= 12) else (K('remote_meter_relief_short') if shop_meter == 'ami_remote_disconnect' else 0)"
  - reinstatement_multiple: "MX(K('multiple_floor'), record_multiple + waiver_loss_adjustment - autopay_relief - remote_meter_relief)"
  - estimate: "MX(P('new_service_estimated_deposit'), P('new_service_estimate_per_kva') * CFIELD('service', 'transformer_kva', service_account_id=F('service_account_id')))"
  - raw_amount: "reinstatement_multiple * basis_bill if periods_12 >= P('min_history_months') else estimate"
  - rounded_amount: "-(-raw_amount // P('rounding_increment')) * P('rounding_increment')"
  - result: "RND(MN(MX(rounded_amount, P('minimum_deposit')), P('maximum_deposit')), 2)"
  compute_basis:
    months_connected: The averaging window of the reinstatement depends on how long the account has been connected
    sum_12: any other account is averaged over the twelve billing periods immediately before today.
    periods_12: the number of billing periods is the number of facility charge lines.
    sum_24: an account connected the long-history months or more is averaged over the twenty-four billing periods immediately before today
    periods_24: the number of billing periods is the number of facility charge lines.
    sum_since: an account connected fewer than the short-history months before today is averaged over every billing period since its connection
    periods_since: the number of billing periods is the number of facility charge lines.
    window_average: "an account connected fewer than the short-history months before today is averaged over every billing period since its connection; an account connected the long-history months or more is averaged over the twenty-four billing periods immediately before today; any other account is averaged over the twelve billing periods immediately before today."
    sum_3: the recent average is the average bill of the three billing periods immediately before today
    periods_3: the recent average is the average bill of the three billing periods immediately before today
    recent_average: the recent average is the average bill of the three billing periods immediately before today
    basis_bill: "when the recent average exceeds the window average by more than the high growth ratio, the basis bill is the recent average; when it exceeds the window average by more than the mid growth ratio but not by more than the high growth ratio, the basis bill is the midpoint of the recent average and the window average; otherwise the basis bill is the window average."
    late_12: The record multiple comes from the reinstated account's own last twelve months
    returns_12: The record multiple comes from the reinstated account's own last twelve months
    record_multiple: "no late payment charge and no returned payment takes the clean-record multiple; exactly one late payment charge and no returned payment takes the one-late multiple; anything else takes the tier's deposit_multiple."
    own_status: The waiver-loss adjustment is the qualifying-cut relief when the reinstated account is not itself disconnected for nonpayment and the account its waiver rested on is disconnected for nonpayment
    qualifying_status: A waiver rests on another account when its waiver basis is coop_payment_history and its waiver reference is that account's account number.
    waiver_loss_adjustment: "The waiver-loss adjustment is the qualifying-cut relief when the reinstated account is not itself disconnected for nonpayment and the account its waiver rested on is disconnected for nonpayment, the own-cut surcharge when the reinstated account is itself disconnected for nonpayment, and nothing otherwise."
    payments_12: The autopay relief is the full autopay relief when every service payment on the reinstated account in the last twelve months came by automatic bank draft
    drafts_12: the half autopay relief when at least half but not all of them did
    autopay_relief: "The autopay relief is the full autopay relief when every service payment on the reinstated account in the last twelve months came by automatic bank draft, the half autopay relief when at least half but not all of them did, and nothing otherwise."
    shop_meter: The remote-meter relief is the long remote-meter relief when the reinstated account has a remote-disconnect meter and was connected at least twelve months before today
    remote_meter_relief: "The remote-meter relief is the long remote-meter relief when the reinstated account has a remote-disconnect meter and was connected at least twelve months before today, the short remote-meter relief when it has a remote-disconnect meter and was connected fewer than twelve months before today, and nothing otherwise."
    reinstatement_multiple: The reinstatement multiple is the record multiple plus the waiver-loss adjustment, less the autopay relief, less the remote-meter relief, and never below the multiple floor.
    estimate: otherwise the higher of new_service_estimated_deposit and new_service_estimate_per_kva times the transformer_kva.
    raw_amount: The reinstated amount is the reinstatement multiple times the reinstatement basis bill when the account has at least min_history_months billing periods in the last twelve
    rounded_amount: The result is rounded up to the next multiple of rounding_increment, then raised to minimum_deposit when lower, then limited to maximum_deposit.
    result: The result is rounded up to the next multiple of rounding_increment, then raised to minimum_deposit when lower, then limited to maximum_deposit.
  factors:
  - id: reinstatement_averaging_window
    effect: method
    decides: window_average
    bindings: [months_connected, sum_12, periods_12, sum_24, periods_24, sum_since, periods_since, window_average]
    ladder:
    - when: "the reinstated account was connected fewer than the short-history months before today"
      method: "the window average is the average bill of every billing period since the account's connection"
    - when: "the reinstated account was connected the long-history months or more before today"
      method: "the window average is the average bill of the twenty-four billing periods immediately before today"
    - when: "otherwise"
      method: "the window average is the average bill of the twelve billing periods immediately before today"
    baseline:
      window_average: "sum_12 / MX(periods_12, 1)"
    evidence: [history, date, cross_category]
    cross_difficulty: service
  - id: reinstatement_recent_growth
    effect: method
    decides: basis_bill
    bindings: [sum_3, periods_3, recent_average, basis_bill]
    ladder:
    - when: "the average bill of the three billing periods immediately before today exceeds the window average by more than the high growth ratio"
      method: "the reinstatement basis bill is that three-period recent average"
    - when: "the recent average exceeds the window average by more than the mid growth ratio but not by more than the high growth ratio"
      method: "the reinstatement basis bill is the midpoint of the recent average and the window average"
    - when: "otherwise"
      method: "the reinstatement basis bill is the window average"
    baseline:
      basis_bill: "window_average"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: reinstated_account_record
    effect: parameter
    decides: record_multiple
    bindings: [late_12, returns_12, record_multiple]
    ladder:
    - when: "the reinstated account has no late payment charge and no returned payment in its last twelve months"
      value: "K('clean_record_multiple')"
    - when: "the reinstated account has exactly one late payment charge and no returned payment in its last twelve months"
      value: "K('one_late_multiple')"
    - when: "otherwise"
      value: "P('deposit_multiple')"
    baseline:
      record_multiple: "P('deposit_multiple')"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: waiver_loss_adjustment
    effect: parameter
    decides: waiver_loss_adjustment
    bindings: [own_status, qualifying_status, waiver_loss_adjustment]
    ladder:
    - when: "the reinstated account is not itself disconnected for nonpayment and the account its waiver rested on is disconnected for nonpayment"
      value: "K('qualifying_cut_relief')"
    - when: "the reinstated account is itself disconnected for nonpayment"
      value: "K('own_cut_surcharge')"
    - when: "otherwise"
      value: "0"
    baseline:
      waiver_loss_adjustment: "0"
    evidence: [cross_category]
    cross_difficulty: service
  - id: reinstatement_autopay_relief
    effect: parameter
    decides: autopay_relief
    bindings: [payments_12, drafts_12, autopay_relief]
    ladder:
    - when: "every service payment on the reinstated account in the last twelve months came by automatic bank draft"
      value: "K('autopay_full_relief')"
    - when: "at least half but not all of those payments came by automatic bank draft"
      value: "K('autopay_half_relief')"
    - when: "otherwise"
      value: "0"
    baseline:
      autopay_relief: "0"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: reinstatement_remote_meter_relief
    effect: parameter
    decides: remote_meter_relief
    bindings: [shop_meter, remote_meter_relief]
    ladder:
    - when: "the reinstated account has a remote-disconnect meter and was connected at least twelve months before today"
      value: "K('remote_meter_relief_long')"
    - when: "the reinstated account has a remote-disconnect meter and was connected fewer than twelve months before today"
      value: "K('remote_meter_relief_short')"
    - when: "otherwise"
      value: "0"
    baseline:
      remote_meter_relief: "0"
    evidence: [date, cross_category]
    cross_difficulty: service
  baseline:
    rule: >-
      The standard reinstatement basis bill is the average bill of the twelve billing periods immediately
      before today, and the standard reinstatement multiple is the tier's deposit_multiple, so the standard
      reinstated deposit is deposit_multiple times that twelve-period average, rounded up to the next multiple
      of rounding_increment, raised to minimum_deposit when lower and limited to maximum_deposit.
    params: [deposit_multiple, rounding_increment, minimum_deposit, maximum_deposit, min_history_months, new_service_estimated_deposit, new_service_estimate_per_kva]
  inputs:
    history:
    - {category: service, table: service_charges, aggregate: sum, field: amount, within_months: 24, filters: {event_type: service_usage_charge}}
    - {category: service, table: service_charges, aggregate: count, field: charge_date, within_months: 12, filters: {event_type: service_late_charge}}
    - {category: service, table: service_payments, aggregate: count, field: payment_date, within_months: 12, filters: {event_type: service_payment}}
    cross_category: [service]
- id: deposit_ext_reconnection_deposit
  base_policy_refs: [deposit_agg_multi_holding, deposit_agg_service_total, deposit_evt_assessment, deposit_evt_waiver, deposit_evt_reassessment]
  overwrite:
  - base_policy: deposit_evt_assessment
    superseded_clause: The amount is deposit_multiple times the basis bill of deposit_msr_bill_basis when the location has at least min_history_months of history, and otherwise the higher of new_service_estimated_deposit and new_service_estimate_per_kva times the transformer_kva.
    replaced_by: The reconnection amount is the reconnection multiple times the reconnection basis bill, rounded up to the next multiple of the reconnection rounding step and raised to the reconnection minimum when lower.
  - base_policy: deposit_agg_service_total
    superseded_clause: A new assessment on a service account that already carries deposits is the computed amount less the required_amount of the deposits already in assessed, partially_paid or held status on that account, never below zero, and it is then reduced to the room left under the maximum_deposit of the new assessment's tier; none is made when nothing remains.
    replaced_by: The reconnection deposit is that rounded amount less the required amount of the reinstated deposit on the account, never below zero, and it is then reduced to the room the reconnection maximum leaves above that required amount.
  trigger: on_request
  subject: [deposit_assess]
  computes: required_amount
  target_tool: assess_reconnection_deposit_9009d8a2
  params:
    reconnection_multiple: 2.0
    reconnection_minimum: 150.0
    reconnection_maximum: 900.0
    reconnection_rounding_step: 5.0
    spike_high: 2.0
    spike_mid: 1.5
    lateness_count_high: 5
    lateness_count_mid: 3
    lateness_multiple_high: 2.5
    lateness_multiple_mid: 2.25
    returns_surcharge_repeat: 0.5
    returns_surcharge_single: 0.25
    default_surcharge: 0.25
    completed_credit: -0.1
    hardship_relief_both: 0.5
    hardship_relief_one: 0.25
    installment_relief_prompt: 0.5
    installment_relief_due: 0.25
    prompt_installment_days: 10
  rule: >-
    This policy fixes the Residential Credit Reestablishment Deposit assessed on the assessment basis
    reconnect_after_nonpay when a Schedule R or Schedule FH account whose deposit had been waived, and was
    reinstated after the account was disconnected for nonpayment, is to be reconnected. The reconnection
    multiple, minimum, maximum and rounding step are those of the Residential Credit Reestablishment Deposit
    tier and are carried in this policy's figures, and the deposit is granted that tier's installment_count
    installments. Because the account's own deposit had been waived, the reinstated deposit is the only other deposit
    such an account carries in assessed, partially_paid or held status; a reconnection on an account that
    carries any further open deposit is outside this policy. The reconnection deposit is fixed only after the first installment of the reinstated
    deposit on the account stands posted as a deposit payment on the deposit ledger. The reconnection
    deposit is not fixed until every deposit waiver resting on this account's payment history stands replaced
    by a reinstated deposit on the account that waiver covered.
    The reconnection amount is the reconnection multiple times the reconnection basis bill, rounded up to the
    next multiple of the reconnection rounding step and raised to the reconnection minimum when lower. The
    reconnection deposit is that rounded amount less the required amount of the reinstated deposit on the
    account, never below zero, and it is then reduced to the room the reconnection maximum leaves above that
    required amount. A billing period's bill is the sum of that period's usage lines, and the twelve billing
    periods are those billed in the twelve whole months before today, each month's bill read by itself.
    The standard reconnection basis bill is the highest of the twelve monthly bills before today, and the
    standard reconnection multiple is the Residential Credit Reestablishment Deposit tier's multiple with no
    surcharge or relief, so the standard reconnection deposit is that multiple times the highest monthly bill,
    rounded up to the reconnection rounding step, raised to the reconnection minimum when lower, less the
    reinstated deposit's required amount and limited to the room under the reconnection maximum.
    A seasonal peak is tempered before it becomes the reconnection basis bill: when the highest monthly bill
    exceeds the twelve-period average bill by more than the high spike ratio, the basis bill is the midpoint
    of the highest bill and the average bill; when it exceeds the average by more than the mid spike ratio
    but not by more than the high spike ratio, the basis bill is two thirds of the highest bill plus one third
    of the average bill; otherwise the basis bill is the highest bill.
    The reconnection multiple is the lateness multiple plus the returned-payment surcharge plus the
    arrangement adjustment, less the hardship relief and less the installment relief, and it is never below
    the Residential Credit Reestablishment Deposit tier's multiple. The lateness multiple counts the late
    payment charges on the account in the last twelve months: at least the high lateness count takes the high
    lateness multiple; at least the mid lateness count but fewer than the high count takes the mid lateness
    multiple; fewer than the mid count takes the tier's multiple. The returned-payment surcharge is the repeat
    surcharge for two or more returned payments on the account in the last twelve months, the single
    surcharge for exactly one, and nothing for none. The arrangement adjustment is the default surcharge when
    a payment arrangement of the member was billed back on default in the last twenty-four months, the
    completed credit when no arrangement was billed back on default in that period and the account carries a
    completed payment arrangement, and nothing otherwise. The hardship relief is the full hardship relief when
    the account received an energy assistance payment from LIHEAP in the last twelve months and a medical
    certificate, accepted or not, was received for the account in the last twelve months, the single hardship relief when
    exactly one of those two holds, and nothing when neither does. The installment relief comes from how soon
    the reinstated deposit's first installment was paid, counted in calendar days from the reinstated
    deposit's assessed date to the posting date of the deposit payment on it (the latest one, where more than
    one has posted): a payment posted within the prompt-installment days takes the prompt installment relief;
    one posted after that but within the reinstated deposit's tier deposit_due_days takes the on-time
    installment relief; one posted later takes no relief.
  prerequisite:
  - problem: deposit_ext_reinstated_first_installment
    kind: value_input
    gate: installment_relief
    form: state
    policy_source: The reconnection deposit is fixed only after the first installment of the reinstated deposit on the account stands posted as a deposit payment on the deposit ledger.
    condition: The reinstated deposit record on the account (assessment basis waiver_reinstatement) carries at least one deposit_payment entry on its deposit ledger, so its cash held is above zero.
    resolved_by: pay_reinstated_deposit_installment_114bda0d
    effect: Once the first installment posts, the deposit payments on the reinstated deposit rise above zero and the installment relief moves from nothing to the part-paid installment relief, which lowers the reconnection multiple and with it the reconnection deposit.
  - problem: deposit_ext_waiver_reinstatement
    kind: state_gate
    gate: deposit_accounts.assessment_basis
    form: state
    policy_source: The reconnection deposit is not fixed until every deposit waiver resting on this account's payment history stands replaced by a reinstated deposit on the account that waiver covered.
    condition: For every deposit record waived on coop_payment_history whose waiver reference is this account's account number, the account that record secures carries a deposit record on the assessment basis waiver_reinstatement in assessed, partially_paid or held status.
    resolved_by: assess_reinstated_deposit_c3ac4854
    effect: Once the reinstated deposit is assessed on the account the waiver covered, the waiver resting on this account's payment history no longer stands unreplaced and the reconnection deposit may be fixed.
  cross_category:
  - category: service
    as: history
    reads: [service_charges.amount, service_charges.event_type, service_charges.charge_date, service_payments.event_type, service_payments.payment_channel, service_payments.assistance_agency, service_payments.payment_date, service_certificates.received_date]
    note: The bills, late charges, returned payments, energy assistance payments and medical certificates of the account being reconnected decide the basis, lateness, returned-payment and hardship tiers.
  - category: arrange
    as: history
    reads: [arrange_ledger.event_type, arrange_ledger.rebill_reason, arrange_ledger.entry_date, arrangements.status]
    note: The member's payment arrangement ledger and agreements decide the arrangement adjustment.
  compute:
  - sum_1m: "XSUM('service', 'service_charges', 'amount', within_months=1, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_2m: "XSUM('service', 'service_charges', 'amount', within_months=2, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_3m: "XSUM('service', 'service_charges', 'amount', within_months=3, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_4m: "XSUM('service', 'service_charges', 'amount', within_months=4, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_5m: "XSUM('service', 'service_charges', 'amount', within_months=5, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_6m: "XSUM('service', 'service_charges', 'amount', within_months=6, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_7m: "XSUM('service', 'service_charges', 'amount', within_months=7, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_8m: "XSUM('service', 'service_charges', 'amount', within_months=8, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_9m: "XSUM('service', 'service_charges', 'amount', within_months=9, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_10m: "XSUM('service', 'service_charges', 'amount', within_months=10, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_11m: "XSUM('service', 'service_charges', 'amount', within_months=11, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - sum_12m: "XSUM('service', 'service_charges', 'amount', within_months=12, date_field='charge_date', event_type='service_usage_charge', service_account_id=F('service_account_id'))"
  - bill_1: "sum_1m"
  - bill_2: "RND(sum_2m - sum_1m, 2)"
  - bill_3: "RND(sum_3m - sum_2m, 2)"
  - bill_4: "RND(sum_4m - sum_3m, 2)"
  - bill_5: "RND(sum_5m - sum_4m, 2)"
  - bill_6: "RND(sum_6m - sum_5m, 2)"
  - bill_7: "RND(sum_7m - sum_6m, 2)"
  - bill_8: "RND(sum_8m - sum_7m, 2)"
  - bill_9: "RND(sum_9m - sum_8m, 2)"
  - bill_10: "RND(sum_10m - sum_9m, 2)"
  - bill_11: "RND(sum_11m - sum_10m, 2)"
  - bill_12: "RND(sum_12m - sum_11m, 2)"
  - highest_bill: "MX(bill_1, bill_2, bill_3, bill_4, bill_5, bill_6, bill_7, bill_8, bill_9, bill_10, bill_11, bill_12)"
  - periods_12: "XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', event_type='service_usage_charge', charge_component='facility_charge', service_account_id=F('service_account_id'))"
  - average_bill: "sum_12m / MX(periods_12, 1)"
  - basis_bill: "(highest_bill + average_bill) / 2 if highest_bill > K('spike_high') * average_bill else ((2 * highest_bill + average_bill) / 3 if highest_bill > K('spike_mid') * average_bill else highest_bill)"
  - late_charges_12: "XCOUNT('service', 'service_charges', within_months=12, date_field='charge_date', event_type='service_late_charge', service_account_id=F('service_account_id'))"
  - lateness_multiple: "K('lateness_multiple_high') if late_charges_12 >= K('lateness_count_high') else (K('lateness_multiple_mid') if late_charges_12 >= K('lateness_count_mid') else K('reconnection_multiple'))"
  - returns_12: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment_return', service_account_id=F('service_account_id'))"
  - returns_surcharge: "K('returns_surcharge_repeat') if returns_12 >= 2 else (K('returns_surcharge_single') if returns_12 == 1 else 0)"
  - defaults_24: "XCOUNT('arrange', 'arrange_ledger', within_months=24, date_field='entry_date', event_type='arrange_balance_rebill', rebill_reason='default')"
  - completed_arrangement: "EXISTS('arrange', status='completed', service_account_id=F('service_account_id'))"
  - arrangement_adjustment: "K('default_surcharge') if defaults_24 > 0 else (K('completed_credit') if completed_arrangement else 0)"
  - liheap_12: "XCOUNT('service', 'service_payments', within_months=12, date_field='payment_date', event_type='service_payment', assistance_agency='liheap', service_account_id=F('service_account_id'))"
  - certificates_12: "XCOUNT('service', 'service_certificates', within_months=12, date_field='received_date', service_account_id=F('service_account_id'))"
  - hardship_relief: "K('hardship_relief_both') if (liheap_12 > 0 and certificates_12 > 0) else (K('hardship_relief_one') if (liheap_12 > 0 or certificates_12 > 0) else 0)"
  - installment_payments: "COUNT('deposit_ledger', event_type='deposit_payment')"
  - installment_date: "LATEST('deposit_ledger', 'entry_date', date_field='entry_date', event_type='deposit_payment')"
  - days_to_installment: "DAYS(F('assessed_date'), installment_date) if installment_payments > 0 else 9999"
  - installment_relief: "K('installment_relief_prompt') if days_to_installment <= K('prompt_installment_days') else (K('installment_relief_due') if days_to_installment <= P('deposit_due_days') else 0)"
  - reconnection_multiple: "MX(K('reconnection_multiple'), lateness_multiple + returns_surcharge + arrangement_adjustment - hardship_relief - installment_relief)"
  - raw_amount: "reconnection_multiple * basis_bill"
  - rounded_amount: "MX(K('reconnection_minimum'), -(-raw_amount // K('reconnection_rounding_step')) * K('reconnection_rounding_step'))"
  - reinstated_required: "F('required_amount')"
  - result: "RND(MX(0, MN(rounded_amount - reinstated_required, K('reconnection_maximum') - reinstated_required)), 2)"
