    connects_all_12m: "when the most recent connect fee billed on the member's service accounts falls in the twelve whole months before today and was billed on another account than this one"
    connects_own_12m: "when the most recent connect fee billed on the member's service accounts falls in the twelve whole months before today and was billed on another account than this one"
    own_latest_connect_fee: "was billed on another account than this one"
    latest_connect_fee: "the window is the billing periods of this account billed fewer whole months before today than have passed since that connect fee"
    own_connect_months: "when this account itself was connected fewer than twelve whole months before today, the window is the periods billed since its connection"
    window_months: "when the most recent connect fee billed on the member's service accounts falls in the twelve whole months before today and was billed on another account than this one, the window is the billing periods of this account billed fewer whole months before today than have passed since that connect fee; when this account itself was connected fewer than twelve whole months before today, the window is the periods billed since its connection; otherwise the window is the twelve billing periods immediately before today."
    window_sum: "The recalculation window follows where the account's load now sits"
    window_periods: "The recalculation window follows where the account's load now sits"
    window_average: "the window average"
    window_highest: "when the highest bill in the window exceeds the window average by more than the high trim ratio"
    trimmed_average: "the basis bill is the average of the window's other bills"
    basis_bill: "when the highest bill in the window exceeds the window average by more than the high trim ratio, the basis bill is the average of the window's other bills; when it exceeds the window average by more than the mid trim ratio but not by more than the high trim ratio, the basis bill is the midpoint of that trimmed average and the window average; otherwise the basis bill is the window average."
    returns_24m: "The record multiple reads the account's last twenty-four whole months"
    reconnects_24m: "The record multiple reads the account's last twenty-four whole months"
    record_multiple: "no returned payment and no reconnect fee takes the clean record multiple; no returned payment but a reconnect fee takes the reconnected record multiple; anything else takes the tier's deposit_multiple."
    harvest_end: "when the member completed an Agricultural Harvest Payment Agreement that ended in the last twenty-four whole months"
    other_arrangement_end: "the general arrangement relief when the member completed another kind of payment arrangement that ended in that period"
    harvest_relief: "The harvest relief is the harvest relief figure when the member completed an Agricultural Harvest Payment Agreement that ended in the last twenty-four whole months, the general arrangement relief when the member completed another kind of payment arrangement that ended in that period, and nothing otherwise."
    other_payments_12m: "The moved-load relief reads the member's other service accounts over the last twelve whole months"
    other_drafts_12m: "payments on them with no late payment charge and every one by automatic bank draft earns the full moved-load relief"
    other_lates_12m: "payments on them with no late payment charge and every one by automatic bank draft earns the full moved-load relief"
    moved_load_relief: "payments on them with no late payment charge and every one by automatic bank draft earns the full moved-load relief; payments on them with no late payment charge but not all by bank draft earns the part moved-load relief; otherwise none."
    meter_type: "The remote-meter relief is the clean remote relief when this account has a remote-disconnect meter and no returned payment in the last twelve whole months"
    returns_12m: "The remote-meter relief is the clean remote relief when this account has a remote-disconnect meter and no returned payment in the last twelve whole months"
    remote_relief: "The remote-meter relief is the clean remote relief when this account has a remote-disconnect meter and no returned payment in the last twelve whole months, the returned remote relief when it has a remote-disconnect meter and a returned payment in that period, and nothing otherwise."
    recalculation_multiple: "The recalculation multiple is the record multiple less the harvest relief, the moved-load relief and the remote-meter relief, and never below the multiple floor."
    raw_requirement: "The recalculated requirement is the recalculation multiple times the recalculation basis bill"
    recalculated_requirement: "rounded up to the next multiple of rounding_increment, then raised to minimum_deposit when lower, then limited to maximum_deposit."
    excess_cash: "The recalculation refund is the cash held less the recalculated requirement"
    unpaid_interest: "Interest accrued and not yet paid out, including a prior year's interest whose payout bill has already been issued, is paid with the recalculation refund."
    result: "The recalculation refund is the cash held less the recalculated requirement, together with all interest accrued on the deposit and not yet paid out, rounded to the nearest cent; nothing is refunded when the excess is not above the recalculation threshold."
  factors:
  - id: recalculation_window
    effect: method
    decides: window_months
    bindings: [connects_all_12m, connects_own_12m, latest_connect_fee, own_latest_connect_fee, own_connect_months, window_months]
    ladder:
    - when: "the most recent connect fee billed on the member's service accounts falls in the twelve whole months before today and was billed on another account than this one"
      method: "the recalculation window is this account's billing periods billed fewer whole months before today than have passed since that connect fee"
    - when: "the most recent connect fee is not such a fee and this account was connected fewer than twelve whole months before today"
      method: "the recalculation window is this account's billing periods since its connection"
    - when: "otherwise"
      method: "the recalculation window is the twelve billing periods immediately before today"
    baseline:
      window_months: "12"
    evidence: [history, date, cross_category]
    cross_difficulty: service
  - id: recalculation_peak_trim
    effect: method
    decides: basis_bill
    bindings: [sum_1m, sum_2m, sum_3m, sum_4m, sum_5m, sum_6m, sum_7m, sum_8m, sum_9m, sum_10m, sum_11m, sum_12m, bill_1, bill_2, bill_3, bill_4, bill_5, bill_6, bill_7, bill_8, bill_9, bill_10, bill_11, bill_12, window_sum, window_periods, window_average, window_highest, trimmed_average, basis_bill]
    ladder:
    - when: "the highest bill in the recalculation window exceeds the window average by more than the high trim ratio"
      method: "the recalculation basis bill is the average of the window's other bills, the highest one left out"
    - when: "the highest bill exceeds the window average by more than the mid trim ratio but not by more than the high trim ratio"
      method: "the recalculation basis bill is the midpoint of that trimmed average and the window average"
    - when: "otherwise"
      method: "the recalculation basis bill is the window average"
    baseline:
      basis_bill: "window_average"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: recalculation_record_multiple
    effect: parameter
    decides: record_multiple
    bindings: [returns_24m, reconnects_24m, record_multiple]
    ladder:
    - when: "no returned payment and no reconnect fee on the account in the last twenty-four whole months"
      value: "K('record_multiple_clean')"
    - when: "no returned payment but a reconnect fee in that period"
      value: "K('record_multiple_reconnected')"
    - when: "otherwise"
      value: "P('deposit_multiple')"
    baseline:
      record_multiple: "P('deposit_multiple')"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: recalculation_harvest_relief
    effect: parameter
    decides: harvest_relief
    bindings: [harvest_end, other_arrangement_end, harvest_relief]
    ladder:
    - when: "the member completed an Agricultural Harvest Payment Agreement that ended in the last twenty-four whole months"
      value: "K('harvest_relief')"
    - when: "no such harvest agreement, but the member completed another kind of payment arrangement that ended in that period"
      value: "K('arrangement_relief')"
    - when: "otherwise"
      value: "0"
    baseline:
      harvest_relief: "0"
    evidence: [date, cross_category]
    cross_difficulty: arrange
  - id: recalculation_moved_load_relief
    effect: parameter
    decides: moved_load_relief
    bindings: [other_payments_12m, other_drafts_12m, other_lates_12m, moved_load_relief]
    ladder:
    - when: "the member's other service accounts have payments in the last twelve whole months, no late payment charge, and every payment by automatic bank draft"
      value: "K('moved_load_relief_full')"
    - when: "they have payments and no late payment charge but not every payment by bank draft"
      value: "K('moved_load_relief_part')"
    - when: "otherwise"
      value: "0"
    baseline:
      moved_load_relief: "0"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: recalculation_remote_meter_relief
    effect: parameter
    decides: remote_relief
    bindings: [meter_type, returns_12m, remote_relief]
    ladder:
    - when: "this account has a remote-disconnect meter and no returned payment in the last twelve whole months"
      value: "K('remote_relief_clean')"
    - when: "it has a remote-disconnect meter and a returned payment in that period"
      value: "K('remote_relief_returned')"
    - when: "otherwise"
      value: "0"
    baseline:
      remote_relief: "0"
    evidence: [history, cross_category]
    cross_difficulty: service
  baseline:
    rule: >-
      The standard recalculated requirement is the tier's deposit_multiple times the average bill of the
      twelve billing periods immediately before today, rounded up to the next multiple of rounding_increment,
      raised to minimum_deposit when lower and limited to maximum_deposit, so the standard recalculation refund
      is the cash held less that requirement together with the unpaid interest.
    params: [deposit_multiple, rounding_increment, minimum_deposit, maximum_deposit]
  inputs:
    history:
    - {category: service, table: service_charges, aggregate: sum, field: amount, within_months: 12, filters: {event_type: service_usage_charge}}
    - {category: service, table: service_charges, aggregate: count, field: charge_date, within_months: 12, filters: {event_type: service_fee, charge_component: connect_fee}}
    - {category: service, table: service_payments, aggregate: count, field: payment_date, within_months: 24, filters: {event_type: service_payment_return}}
    - {table: deposit_ledger, aggregate: sum, field: amount, filters: {event_type: deposit_interest_accrual}}
    cross_category: [service, arrange]
