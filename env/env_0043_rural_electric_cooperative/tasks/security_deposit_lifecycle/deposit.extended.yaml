    hardship_relief: The hardship relief is the full hardship relief when the account received an energy assistance payment from LIHEAP in the last twelve months and a medical certificate, accepted or not, was received for the account in the last twelve months, the single hardship relief when exactly one of those two holds, and nothing when neither does.
    installment_payments: counted in calendar days from the reinstated deposit's assessed date to the posting date of the deposit payment on it (the latest one, where more than one has posted)
    installment_date: counted in calendar days from the reinstated deposit's assessed date to the posting date of the deposit payment on it (the latest one, where more than one has posted)
    days_to_installment: The installment relief comes from how soon the reinstated deposit's first installment was paid
    installment_relief: "a payment posted within the prompt-installment days takes the prompt installment relief; one posted after that but within the reinstated deposit's tier deposit_due_days takes the on-time installment relief; one posted later takes no relief."
    reconnection_multiple: The reconnection multiple is the lateness multiple plus the returned-payment surcharge plus the arrangement adjustment, less the hardship relief and less the installment relief, and it is never below the Residential Credit Reestablishment Deposit tier's multiple.
    raw_amount: The reconnection amount is the reconnection multiple times the reconnection basis bill
    rounded_amount: rounded up to the next multiple of the reconnection rounding step and raised to the reconnection minimum when lower.
    reinstated_required: The reconnection deposit is that rounded amount less the required amount of the reinstated deposit on the account
    result: The reconnection deposit is that rounded amount less the required amount of the reinstated deposit on the account, never below zero, and it is then reduced to the room the reconnection maximum leaves above that required amount.
  factors:
  - id: seasonal_peak_tempering
    effect: method
    decides: basis_bill
    bindings: [sum_1m, sum_2m, sum_3m, sum_4m, sum_5m, sum_6m, sum_7m, sum_8m, sum_9m, sum_10m, sum_11m, sum_12m, bill_1, bill_2, bill_3, bill_4, bill_5, bill_6, bill_7, bill_8, bill_9, bill_10, bill_11, bill_12, highest_bill, periods_12, average_bill, basis_bill]
    ladder:
    - when: "the highest monthly bill of the twelve before today exceeds the twelve-period average bill by more than the high spike ratio"
      method: "the reconnection basis bill is the midpoint of the highest bill and the average bill"
    - when: "the highest monthly bill exceeds the average by more than the mid spike ratio but not by more than the high spike ratio"
      method: "the reconnection basis bill is two thirds of the highest bill plus one third of the average bill"
    - when: "otherwise"
      method: "the reconnection basis bill is the highest monthly bill"
    baseline:
      basis_bill: "highest_bill"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: reconnection_lateness_multiple
    effect: parameter
    decides: lateness_multiple
    bindings: [late_charges_12, lateness_multiple]
    ladder:
    - when: "the account being reconnected has at least the high lateness count of late payment charges in the last twelve months"
      value: "K('lateness_multiple_high')"
    - when: "it has at least the mid lateness count but fewer than the high lateness count"
      value: "K('lateness_multiple_mid')"
    - when: "otherwise"
      value: "K('reconnection_multiple')"
    baseline:
      lateness_multiple: "K('reconnection_multiple')"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: reconnection_returned_payment_surcharge
    effect: parameter
    decides: returns_surcharge
    bindings: [returns_12, returns_surcharge]
    ladder:
    - when: "two or more returned payments on the account being reconnected in the last twelve months"
      value: "K('returns_surcharge_repeat')"
    - when: "exactly one returned payment in that period"
      value: "K('returns_surcharge_single')"
    - when: "otherwise"
      value: "0"
    baseline:
      returns_surcharge: "0"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: reconnection_arrangement_adjustment
    effect: parameter
    decides: arrangement_adjustment
    bindings: [defaults_24, completed_arrangement, arrangement_adjustment]
    ladder:
    - when: "a payment arrangement of the member was billed back on default in the last twenty-four months"
      value: "K('default_surcharge')"
    - when: "no arrangement was billed back on default in that period and the account carries a completed payment arrangement"
      value: "K('completed_credit')"
    - when: "otherwise"
      value: "0"
    baseline:
      arrangement_adjustment: "0"
    evidence: [history, cross_category]
    cross_difficulty: arrange
  - id: reconnection_hardship_relief
    effect: parameter
    decides: hardship_relief
    bindings: [liheap_12, certificates_12, hardship_relief]
    ladder:
    - when: "the account received a LIHEAP energy assistance payment in the last twelve months and a medical certificate, accepted or not, was received for it in the last twelve months"
      value: "K('hardship_relief_both')"
    - when: "exactly one of those two holds"
      value: "K('hardship_relief_one')"
    - when: "otherwise"
      value: "0"
    baseline:
      hardship_relief: "0"
    evidence: [history, cross_category]
    cross_difficulty: service
  - id: reinstated_installment_relief
    effect: parameter
    decides: installment_relief
    bindings: [installment_payments, installment_date, days_to_installment, installment_relief]
    ladder:
    - when: "the reinstated deposit's first installment posted within the prompt-installment days of its assessed date"
      value: "K('installment_relief_prompt')"
    - when: "it posted after the prompt-installment days but within the reinstated deposit's tier deposit_due_days of its assessed date"
      value: "K('installment_relief_due')"
    - when: "otherwise"
      value: "0"
    baseline:
      installment_relief: "0"
    evidence: [history, date]
    cross_difficulty: null
  baseline:
    rule: >-
      The standard reconnection basis bill is the highest of the twelve monthly bills before today, and the
      standard reconnection multiple is the Residential Credit Reestablishment Deposit tier's multiple with no
      surcharge or relief, so the standard reconnection deposit is that multiple times the highest monthly bill,
      rounded up to the reconnection rounding step, raised to the reconnection minimum when lower, less the
      reinstated deposit's required amount and limited to the room under the reconnection maximum.
    params: [reconnection_multiple, reconnection_minimum, reconnection_maximum, reconnection_rounding_step]
