name: env_0044_life_and_annuity_insurer
company: Ashgrove Mutual Life Insurance Company

background: |
  Ashgrove Mutual Life Insurance Company is a policyholder-owned mutual life and annuity insurer founded in 1887 and headquartered in Hartford, Connecticut, licensed in all fifty states and the District of Columbia. It serves about 1.4 million individual policyholders and contract owners and manages roughly $48 billion in general account assets, and its Policyholder Service Center answers calls in a plain, careful tone that favours precise contract language over sales talk. Ashgrove sells seven product lines, each held as a contract that keeps producing billed premiums, credits, distributions and claims for as long as it is in force. Term Life Insurance is sold as the Ashgrove Annual Renewable Term and the Ashgrove Level Term 10, 15, 20, 25 and 30, billed in annual, semiannual, quarterly or monthly bank-draft installments. Whole Life Insurance comprises the Ashgrove Final Expense Whole Life, Ashgrove Whole Life Paid-Up at 100, Ashgrove Whole Life Paid-Up at 65, Ashgrove 20-Pay Whole Life, Ashgrove 10-Pay Whole Life and Ashgrove Single Premium Whole Life; the participating plans receive an annual dividend and build guaranteed cash values that owners borrow against. Universal Life Insurance comprises the Ashgrove Lifetime Guarantee UL, Ashgrove Protection UL, Ashgrove Accumulation UL, Ashgrove Indexed UL Protect, Ashgrove Indexed UL Growth and Ashgrove Indexed UL Premier, each running an account value that receives flexible premiums and interest or index credits and pays monthly deductions. Deferred Fixed Annuities are sold as the Ashgrove Flexible Premium Deferred Annuity and the multi-year guaranteed Ashgrove SecureRate 3, 5, 6, 7 and 10, crediting declared interest to a contract value. Fixed Indexed Annuities are sold as the Ashgrove IndexEdge 5, 7, 10 and 10 Bonus and the Ashgrove IncomeShield 7 and 10, the last two carrying a guaranteed lifetime withdrawal benefit. Income Annuities are sold as the Ashgrove Income Annuity Life Only, Cash Refund, 10-Year Certain, 20-Year Certain, Joint 50% Survivor and Joint 100% Survivor, each paying a scheduled stream of installments bought with a single purchase payment or by annuitizing an Ashgrove deferred annuity. Asset-Based Long-Term Care Life Insurance is sold as the Ashgrove CareAssure 2-Year, 3-Year, 4-Year, 5-Year, 6-Year and Lifetime, life policies whose specified amount can be drawn down monthly to pay for long-term care. Every holding sits on the owner's customer profile with its policy or contract number, its insured or annuitant, its beneficiary designations and a ledger of every premium, credit, deduction, loan, withdrawal and payout booked against it. Callers are mostly owners between their thirties and their eighties: young families paying monthly drafts on a level term policy, pre-retirees with a whole life or universal life policy funded for cash value, and retirees holding a deferred annuity next to an income annuity that pays them each month. Many hold more than one Ashgrove contract, often on a spouse's life as well as their own, and some carry policies that were converted from term or annuities that were rolled into income. Their histories include late and returned bank drafts, loans taken years ago and still accruing interest, earlier withdrawals, rider claims, address and bank changes, and beneficiary designations signed decades before. A share of callers are surviving spouses, adult children and other beneficiaries reporting a death and asking what is owed to them.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: term_premium_lapse_and_conversion
    claim:
      categories: [term]
      event_types: [term_premium_billed, term_premium_paid, term_premium_payment_returned, term_grace_period_cured, term_policy_reinstated, term_policy_converted, term_face_amount_decreased, term_premium_mode_changed, term_beneficiary_designated, term_death_claim_registered, term_death_claim_paid, term_death_benefit_disbursed, term_tiadb_lien_settled]
    summary: >
      Callers are owners of Ashgrove term policies — sometimes owning coverage on a spouse's or business partner's life — who hold one of six tiers from the annual renewable plan to the 30-year level plan, and whose policies may be current, in the grace period after a missed or returned bank draft, lapsed for weeks or years, nearing the end of the conversion privilege, or already the subject of a terminal illness advance; others are beneficiaries reporting the insured's death. The governing records are the term holding (status, paid-to date, issue date, issue state, insured's date of birth, face amount, rate per thousand, mode, riders, lapse and reinstatement dates), its premium ledger of billed, paid, returned, waived and refunded installments, the signed service requests and claims on file, and the beneficiary designation lines; the rules that decide them are the premium calculation with its band factors and modal factors (term_premium_calculation), the application of remittances and the shortage and overpayment thresholds (term_evt_premium_application), the grace period with its state override and the lapse date (term_grace_and_lapse), returned drafts and the EFT privilege limit (term_evt_returned_eft), mode changes (term_mode_change), reinstatement windows, evidence bands and back-premium interest that differ by tier (term_reinstatement), the conversion deadline, attained-age limit, product menu and tier-varying conversion credit (term_conversion), face decreases (term_face_decrease), beneficiary designations (term_beneficiary_designation) and death claim proceeds, interest, lien and overdue-premium deductions (term_death_claim). In the domain the natural order of events is billing, payment or default, grace, lapse and possible reinstatement, with conversion, decreases and designations happening only while coverage is in force and claims following a death. The agent locates and verifies the caller, reads the holding, ledger and requests, computes amounts and dates from the rules, and records service actions such as applying payments, curing a grace period, recording an approved reinstatement, mode changes and death claim disbursements; anything only the owner can do — signing a conversion application, a beneficiary change, a face decrease or a cancellation — is handed to the owner as their own action. Requests no rule decides, such as adding a rider after issue, increasing the face amount, converting while premiums are being waived, a claim on a death after the lapse date, an owner change or assignment, or paying a minor's share without a guardian or custodian, have no policy path and are handed off as POLICY_NOT_COVERED.
  - name: whole_life_loans_dividends_and_values
    claim:
      categories: [whole]
      event_types: [whole_premium_paid, whole_grace_period_cured, whole_loan_advanced, whole_loan_repaid, whole_loan_offset, whole_apl_election_changed, whole_dividend_option_changed, whole_accumulation_withdrawn, whole_pua_surrendered, whole_reduced_paid_up_elected, whole_policy_surrendered, whole_cash_value_paid, whole_policy_reinstated, whole_beneficiary_designated]
    summary: >
      Callers own Ashgrove whole life policies across six tiers — from the non-participating final expense plan to limited-pay, paid-up-at-65, ordinary life and single premium plans — and want to borrow against cash value, repay or check a loan, change or cash a dividend option, surrender paid-up additions or the whole policy, stop premiums, or restore a policy that lapsed or slipped onto extended term or reduced paid-up insurance; their policies may be premium-paying, in grace, paid up, on a nonforfeiture option, carrying an old loan with capitalized interest, or classed as a modified endowment contract. The records involved are the whole life holding (status, paid-to date, posted guaranteed and paid-up additions cash values, net single premium rate, loan balance and interest-paid-to date, dividend option and accumulations, cost basis, default date), its ledger of premiums, loans, interest, dividends, additions and distributions, and the signed requests on file; the rules are the grace period, automatic premium loan and nonforfeiture defaults that vary by tier (whole_grace_apl_and_nonforfeiture), loan value, loan interest rates and first loan years that vary by tier (whole_evt_policy_loan), interest capitalization, repayment and loan default (whole_evt_loan_interest_and_repayment), dividend options, accumulations and paid-up additions surrenders (whole_dividends), full surrender, withholding and deferral (whole_surrender), reinstatement windows and back premiums (whole_reinstatement), reduced paid-up elections (whole_reduced_paid_up_election), premium application (whole_evt_premium_application) and beneficiary designations (whole_beneficiary_designation). In the domain, loan interest accrues daily and settles on anniversaries, dividends are declared on anniversaries, and a default date fixes both the nonforfeiture option and the reinstatement window. The agent verifies the caller, reads values and ledgers, computes loan values, interest, surrender values, taxable amounts and withholding from the rules and the posted values, and records loan advances, repayments, premium payments and approved reinstatements, while a surrender, a paid-up additions surrender, a reduced paid-up election and a beneficiary change are the owner's own signed actions handed to the owner. Requests outside every rule — a loan on extended term coverage, a 1035 exchange into another company's product, an assignment or owner change, a premium-financing arrangement, or unscheduled deposits to buy additional paid-up insurance — are handed off as POLICY_NOT_COVERED.
  - name: universal_life_account_service
    claim:
      categories: [ul]
      event_types: [ul_premium_received, ul_premium_refunded, ul_mec_status_changed, ul_grace_period_cured, ul_partial_withdrawal, ul_face_amount_decreased, ul_death_benefit_option_changed, ul_loan_advanced, ul_loan_repaid, ul_overloan_protection_exercised, ul_overloan_protection_charged, ul_policy_surrendered, ul_surrender_charge_assessed, ul_surrender_value_paid, ul_allocation_changed, ul_beneficiary_designated]
    summary: >
      Callers own Ashgrove universal life policies across six tiers — guaranteed, protection, accumulation and three indexed plans — and want to add premium, take a withdrawal or loan, change the face amount or death benefit option, rescue a policy that has fallen into its grace period, protect an overloaned policy, reallocate between fixed and indexed accounts, or surrender; their situations vary by policy year within the surrender charge schedule, by whether the no-lapse guarantee still holds, by loan type and indebtedness, by death benefit option, and by how close cumulative premiums sit to the guideline and seven-pay limits. The records involved are the universal life holding (account value, initial and current face, option, target and guideline premiums, no-lapse premium, loan balance, grace start date and cure premium, cost basis, modified endowment status), its monthly deduction, credit, premium, withdrawal, loan and charge ledger, and the signed requests and consents on file; the rules are premium loads and guideline and modified endowment limits with their consent requirement (ul_evt_premium_acceptance), monthly deductions and crediting (ul_monthly_deduction_and_crediting), grace and lapse (ul_grace_and_lapse), the no-lapse guarantee tests that differ by tier (ul_no_lapse_guarantee), withdrawals and their face effects (ul_evt_partial_withdrawal), loans with standard and preferred rates (ul_evt_policy_loan), surrender charges by policy year (ul_surrender), face and option changes (ul_face_and_option_changes), overloan protection conditions (ul_overloan_protection), reinstatement (ul_reinstatement) and beneficiary designations (ul_beneficiary_designation). In the domain, deductions and credits post on monthly anniversaries, surrender charges step down by policy year, and a lapse can only follow a grace period that started on a monthly anniversary. The agent verifies the caller, reads values and history, computes loads, charges, available loan and withdrawal amounts, cure premiums and taxable portions from the rules, and records premiums, refunds, loans, repayments and grace cures, while withdrawals, surrenders, face and option changes, overloan elections, consent to modified endowment status and beneficiary changes are signed by the owner and handed to the owner. Requests no rule decides — a face increase, an Option A to Option B change where it is not allowed, an indexed allocation on a non-indexed tier, restoring a lost no-lapse guarantee where catch-up is not allowed, or a reinstatement past its window — are handed off as POLICY_NOT_COVERED.
  - name: deferred_annuity_withdrawals_and_death_benefits
    claim:
      categories: [fixed]
      event_types: [fixed_premium_received, fixed_withdrawal_paid, fixed_surrender_charge_assessed, fixed_systematic_withdrawal_changed, fixed_contract_surrendered, fixed_surrender_paid, fixed_guarantee_period_renewed, fixed_contract_annuitized, fixed_annuitization_transfer, fixed_death_claim_registered, fixed_spousal_continuation, fixed_death_claim_paid, fixed_death_benefit_paid, fixed_beneficiary_designated]
    summary: >
      Callers own Ashgrove deferred fixed annuities — the flexible premium contract or a SecureRate multi-year guarantee of three to ten years — registered as non-qualified or as an IRA, and ask to take money out, set up or stop systematic withdrawals, satisfy a required minimum distribution, decide what happens at the end of a guarantee period, surrender, or turn the value into income; others are surviving spouses and beneficiaries claiming the death benefit after the owner died. The records involved are the fixed annuity holding (contract value, guaranteed rate and guarantee period end date, surrender charge schedule start, tax registration, cost basis, waiver riders, posted minimum distribution), its ledger of premiums, interest credits, withdrawals, charges and payouts, the signed requests and claims on file, and the beneficiary designation lines; the rules are the free withdrawal amount and the surrender charge ladders that differ by tier (fixed_evt_withdrawal, fixed_surrender), required minimum distributions and systematic plans (fixed_evt_rmd_and_systematic), nursing home and terminal illness waivers (fixed_sc_waivers), renewal windows and default renewal (fixed_guarantee_period_renewal), interest crediting and rate bands (fixed_interest_crediting), annuitization into an Ashgrove income annuity (fixed_annuitization), death benefits with spousal continuation and beneficiary options (fixed_death_benefit) and beneficiary designations (fixed_beneficiary_designation). In the domain, interest is credited on anniversaries and at each distribution, the free amount resets each contract year, and a guarantee period end opens a renewal window before the contract renews by default. The agent verifies the caller, reads the contract and ledger, computes free and excess amounts, charges, taxable portions, withholding and death benefit interest from the rules, and records approved withdrawals, plan changes, renewals and death benefit payments, while surrender, annuitization, a renewal election, a spousal continuation election and beneficiary changes are the owner's or beneficiary's own signed actions handed to them. Requests outside the rules — a non-natural owner such as a trust, a partial 1035 exchange out, a premium above the approval limits, a waiver claim for an owner over the waiver issue age, or a beneficiary seeking a payout schedule other than those allowed — are handed off as POLICY_NOT_COVERED.
  - name: income_annuity_payouts_and_survivorship
    claim:
      categories: [income]
      event_types: [income_payment_issued, income_payment_instructions_changed, income_address_changed, income_withholding_changed, income_payments_resumed, income_held_payment_released, income_payment_amount_changed, income_death_claim_registered, income_survivor_continuation, income_beneficiary_continuation, income_contract_completed, income_overpayment_identified, income_overpayment_recovered, income_refund_benefit_paid, income_commuted_value_paid, income_beneficiary_designated]
    summary: >
      Callers are owners and payees of Ashgrove income annuities on one of six payout structures — life only, cash refund, 10- or 20-year period certain, and joint with 50 or 100 percent to the survivor — asking about a missing or returned payment, a suspension for an overdue certificate of existence, a new bank account or address, tax withholding, or a cost-of-living increase; others are surviving joint annuitants, beneficiaries and executors reporting a death, sometimes after payments kept arriving. The records involved are the income holding (payout schedule, current installment, certain period end date, pricing rate, exclusion ratio, payment instructions and last address change, withholding election, suspension reason, proof-of-life dates, unreturned premium, held and overpaid balances), its ledger of issued, returned, held, released and overpaid installments and lump sums, and the requests, certificates and claims on file; the rules are the payment schedule, taxation and withholding cut-offs (income_payment_schedule), payment instruction changes with the post-address-change signature requirement (income_payment_instructions), proof of life, suspension and release of held payments (income_proof_of_life_and_suspension), returned payments (income_evt_returned_payment), the death outcomes that differ by tier — completion, cash refund, certain-period continuation or commutation, and survivor reduction (income_death_of_annuitant) — overpayment recovery (income_evt_overpayment_recovery) and beneficiary designations (income_beneficiary_designation). In the domain, installments fall due on the payment day, increases apply on anniversaries, a suspension holds installments until the record that clears it arrives, and a confirmed death splits installments into those owed before it and those to be forfeited or recovered after it. The agent verifies the caller, reads the schedule and ledger, computes held, refund, commuted, survivor and overpayment amounts from the rules, and records instruction and withholding changes, resumption and release of held payments, survivor or beneficiary continuation, refund and commuted value payments and overpayment entries, while a signed bank change inside the address-change window, a commutation election, a withholding form and beneficiary changes are the owner's or payee's own actions handed to them. Requests the rules do not decide — selling or assigning future payments, changing the payment frequency or cola rate after issue, cashing out a life-contingent contract, or paying an estate without letters of administration — are handed off as POLICY_NOT_COVERED.
