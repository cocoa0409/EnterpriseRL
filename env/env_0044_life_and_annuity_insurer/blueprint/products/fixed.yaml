# Deferred Fixed Annuities — product and event policy charter of Ashgrove Mutual Life Insurance Company.
category: fixed
display_name: Deferred Fixed Annuities

binding:
  holding_table: fixed_holdings
  event_tables: [fixed_transactions]
  intake_tables: [fixed_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    contract_value: contract_value

lifecycle:
  states: [applied, active, annuitized, surrendered, death_claim_pending, claim_paid, cancelled_free_look, declined]
  transitions:
    - {from: applied, to: active, by: system, means: "New business issues the contract once the initial premium or exchange funds are received in good order."}
    - {from: applied, to: declined, by: system, means: "The application is declined or withdrawn, or exchange funds never arrive, before issue."}
    - {from: active, to: surrendered, by: user, means: "The owner surrenders the contract for its cash surrender value."}
    - {from: active, to: annuitized, by: user, means: "The owner annuitizes the contract value into an Ashgrove income annuity, or the contract reaches its maturity date and is annuitized."}
    - {from: active, to: death_claim_pending, by: agent, means: "Notice of the owner's death is registered."}
    - {from: death_claim_pending, to: claim_paid, by: agent, means: "The death benefit is paid to the beneficiaries, or applied to a beneficiary income annuity."}
    - {from: death_claim_pending, to: active, by: agent, means: "The surviving spouse who is sole primary beneficiary elects to continue the contract as the new owner."}
    - {from: active, to: cancelled_free_look, by: user, means: "The owner returns the contract within the free-look period."}

accounts:
  - key: contract_value
    unit: USD
    meaning: "The contract's accumulated value: premiums plus credited interest, less withdrawals, surrender charges and amounts paid out or transferred."

parameter_schema:
  guarantee_period_years: "integer years — length of each interest rate guarantee period (1 for the flexible premium contract, whose rate is declared each contract year)"
  min_issue_age: "integer years, owner's age last birthday — lowest issue age"
  max_issue_age: "integer years — highest issue age of the owner and annuitant"
  min_initial_premium_nonqualified: "USD — smallest initial premium for a non-qualified contract"
  min_initial_premium_qualified: "USD — smallest initial premium for an IRA contract"
  max_premium_without_approval: "USD — largest total premium Ashgrove accepts on one contract without home office approval"
  additional_premiums_allowed: "boolean — whether premiums after the initial premium are accepted"
  min_additional_premium: "USD — smallest additional premium, where allowed"
  guaranteed_min_interest_rate: "decimal annual rate — minimum rate ever credited (nonforfeiture minimum)"
  current_base_rate: "decimal annual effective rate — rate declared for new guarantee periods starting now, before band and bonus"
  high_band_threshold: "USD — premium at or above which the high band rate addition applies to a guarantee period"
  high_band_rate_addition: "decimal — addition to the base rate for contracts whose premium (or contract value at renewal) is at or above high_band_threshold"
  first_year_interest_bonus: "decimal — additional rate credited for the first contract year only"
  surrender_charge_years: "integer contract years — length of the surrender charge schedule from the start of the current schedule"
  surrender_charge_ladder: "list of decimals — surrender charge percentage for schedule year 1, 2, ... in order"
  free_withdrawal_pct: "decimal — share of the contract value on the most recent contract anniversary (the initial premium in the first contract year) that may be withdrawn each contract year without surrender charge"
  free_withdrawal_first_contract_year: "integer — first contract year in which the free withdrawal amount is available"
  free_withdrawal_carryover: "boolean — whether unused free withdrawal amount carries into the next contract year"
  min_withdrawal_amount: "USD — smallest partial withdrawal"
  min_remaining_contract_value: "USD — contract value that must remain after a partial withdrawal; a request leaving less is treated as a full surrender"
  systematic_withdrawal_min: "USD — smallest systematic withdrawal installment"
  systematic_frequencies: "list — frequencies offered for systematic withdrawals"
  rmd_surrender_charge_waiver: "boolean — whether required minimum distributions calculated by Ashgrove for an IRA contract are free of surrender charge even above the free withdrawal amount"
  nursing_home_waiver_available: "boolean — whether the nursing home confinement waiver of surrender charges is included"
  nursing_home_min_days: "integer consecutive days — confinement required before the nursing home waiver applies"
  nursing_home_waiver_first_contract_year: "integer — first contract year in which confinement must begin for the nursing home waiver"
  terminal_illness_waiver_available: "boolean — whether the terminal illness waiver of surrender charges is included"
  terminal_illness_life_expectancy_months: "integer months — certified life expectancy at or below which the terminal illness waiver applies"
  waiver_max_issue_age: "integer years — highest owner issue age at which the two surrender charge waivers are included"
  renewal_window_days: "integer calendar days — period after a guarantee period ends during which the owner may withdraw or surrender without surrender charge or elect a different period"
  renewal_default_period_years: "integer years — guarantee period the contract renews into when the owner makes no election"
  annuitization_first_contract_year: "integer — first contract year in which annuitization is free of surrender charge"
  annuitization_min_period_certain_years: "integer years — shortest period certain that annuitization free of surrender charge may use when no life contingency is chosen"
  annuitization_min_contract_value: "USD — smallest contract value that may be annuitized; a smaller value is paid in a lump sum"
  maturity_age: "integer years — annuitant's age at which the contract must be annuitized or paid out"
  spousal_continuation_allowed: "boolean — whether a surviving spouse who is the sole primary beneficiary may continue the contract as owner"
  beneficiary_annuitization_start_months: "integer calendar months — period from the owner's date of death within which a beneficiary income annuity must begin"
  nonspouse_payout_deadline_years: "integer years — period from the owner's date of death by which the whole death benefit must be distributed to a beneficiary who does not annuitize"
  death_claim_interest_rate: "decimal annual rate — simple interest on the death benefit from the date due proof is received to payment"
  free_look_days: "integer calendar days — free-look period from the contract delivery date"
  free_look_days_replacement: "integer calendar days — free-look period when the contract replaced another annuity or life policy"
  free_look_senior_age: "integer years — owner age on the issue date at or above which the senior free-look period applies"
  free_look_days_senior: "integer calendar days — free-look period for senior owners"
  federal_withholding_default_pct: "decimal — federal withholding on the taxable part of a distribution unless the owner elects none"
  surrender_deferral_max_days: "integer calendar days — longest Ashgrove may defer paying a surrender value"
  eft_draft_day_max: "integer — latest day of month for a scheduled additional-premium EFT draft"
  beneficiary_max_primary: "integer — maximum number of primary beneficiaries"
  beneficiary_min_share_pct: "integer percent — smallest beneficiary share"
  minor_beneficiary_age: "integer years — age below which a share is paid only to a guardian or UTMA custodian"
  tax_qualifications_offered: "list — tax registrations the contract may be issued as"

