# Income Annuities — product and event policy charter of Ashgrove Mutual Life Insurance Company.
category: income
display_name: Income Annuities

binding:
  holding_table: income_holdings
  event_tables: [income_transactions]
  intake_tables: [income_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    unreturned_premium: unreturned_premium
    suspense_held_balance: suspense_held
    overpayment_receivable_balance: overpayment_receivable

lifecycle:
  states: [applied, income_active, payments_suspended, death_claim_pending, survivor_continuing, beneficiary_continuing, completed, cancelled_free_look, declined]
  transitions:
    - {from: applied, to: income_active, by: system, means: "The purchase amount is received in good order, the contract is issued and the income schedule starts."}
    - {from: applied, to: declined, by: system, means: "The application is declined or withdrawn, or the purchase funds never arrive, before issue."}
    - {from: income_active, to: payments_suspended, by: system, means: "Payments are suspended because a required proof of life is overdue, a payment was returned undeliverable, or an unverified report of death was received."}
    - {from: payments_suspended, to: income_active, by: agent, means: "The reason for suspension is cleared and the payment schedule resumes, releasing the payments held."}
    - {from: income_active, to: death_claim_pending, by: agent, means: "Notice of an annuitant's death is registered."}
    - {from: payments_suspended, to: death_claim_pending, by: agent, means: "Notice of an annuitant's death is registered on a suspended contract."}
    - {from: survivor_continuing, to: death_claim_pending, by: agent, means: "Notice of the surviving annuitant's death is registered."}
    - {from: death_claim_pending, to: survivor_continuing, by: agent, means: "On a joint contract the first death is confirmed and payments continue to the surviving annuitant at the survivor percentage."}
    - {from: death_claim_pending, to: beneficiary_continuing, by: agent, means: "The annuitant died within the period certain and the remaining certain payments continue to the beneficiary."}
    - {from: death_claim_pending, to: completed, by: agent, means: "The death is confirmed and no further payment is due, or the refund or commuted value has been paid."}
    - {from: beneficiary_continuing, to: completed, by: system, means: "The last certain payment is made to the beneficiary, or the beneficiary's commuted value is paid."}
    - {from: income_active, to: cancelled_free_look, by: user, means: "The owner returns the contract within the free-look period."}

accounts:
  - key: unreturned_premium
    unit: USD
    meaning: "Purchase amount not yet returned through income payments, refund benefits or free-look refunds; it becomes negative once gross payments exceed the purchase amount."
  - key: suspense_held
    unit: USD
    meaning: "Income payments that fell due while the contract was suspended or that were returned undeliverable, held without interest until released."
  - key: overpayment_receivable
    unit: USD
    meaning: "Payments made after the death that ended them, owed back to Ashgrove until recovered."

parameter_schema:
  payout_basis: "enum life_only|life_cash_refund|life_period_certain|joint_survivor — the guarantee structure of the tier"
  period_certain_years: "integer years — certain period from the first payment date during which payments continue to the beneficiary if the annuitant dies; 0 when none"
  survivor_continuation_pct: "decimal — share of the payment continued to the survivor after the first death on a joint tier; 0 for single-life tiers"
  min_issue_age: "integer years, annuitant's age last birthday — lowest issue age"
  max_issue_age: "integer years — highest issue age of the annuitant (of the older annuitant on joint tiers)"
  joint_min_age: "integer years — lowest age of the younger joint annuitant; 0 for single-life tiers"
  min_purchase_nonqualified: "USD — smallest purchase amount for a non-qualified contract"
  min_purchase_qualified: "USD — smallest purchase amount for an IRA contract"
  max_purchase_without_approval: "USD — largest purchase accepted without home office approval"
  first_payment_min_days: "integer calendar days — earliest first payment date after the issue date"
  first_payment_max_months: "integer calendar months — latest first payment date after the issue date"
  payment_frequencies: "list — installment frequencies offered"
  min_payment_amount: "USD — smallest gross installment; a lower installment requires a less frequent mode"
  frequency_change_allowed: "boolean — whether the payment frequency may be changed after issue"
  cola_options: "list of decimals — annual cost-of-living increase rates that may be chosen at purchase"
  payment_day_max: "integer — latest day of month that may be chosen as the payment day"
  payment_methods: "list — ways payments may be made"
  payment_change_cutoff_business_days: "integer business days — a payment instruction change received at least this many business days before a payment date applies to that payment"
  address_change_bank_hold_days: "integer calendar days — period after an address change during which a bank account change is accepted only on a signed, signature-verified request"
  withholding_change_cutoff_business_days: "integer business days — a withholding election received at least this many business days before a payment date applies to that payment"
  proof_of_life_age: "integer years — annuitant age from which an annual certificate of existence is required"
  proof_of_life_frequency_months: "integer months — interval between required certificates of existence"
  proof_of_life_response_days: "integer calendar days — period after a certificate of existence is requested within which it must be returned before payments are suspended"
  suspended_payments_earn_interest: "boolean — whether payments held during a suspension earn interest when released"
  returned_payment_reissue_method: "enum check|direct_deposit — how a payment returned undeliverable is reissued once instructions are confirmed"
  overpayment_offset_max_pct: "decimal — largest share of each continuing payment that may be withheld to recover an overpayment"
  refund_lump_sum_available: "boolean — whether a cash refund lump sum is payable at death"
  beneficiary_commutation_allowed: "boolean — whether a beneficiary may take the commuted value of remaining certain payments in one sum"
  commutation_discount_spread: "decimal — addition to the contract's pricing interest rate used to discount remaining certain payments"
  commutation_min_remaining_payments: "integer — fewest remaining certain payments for which commutation is offered"
  death_claim_interest_rate: "decimal annual rate — simple interest on lump-sum death benefits from the date due proof is received to payment"
  free_look_days: "integer calendar days — free-look period from the contract delivery date"
  free_look_days_replacement: "integer calendar days — free-look period when the purchase replaced another annuity"
  free_look_senior_age: "integer years — owner age at or above which the senior free-look period applies"
  free_look_days_senior: "integer calendar days — senior free-look period"
  exclusion_ratio_applies: "boolean — whether non-qualified payments are split into a tax-free return of investment and a taxable part"
  rate_lock_days: "integer calendar days — period the payout rate quoted at application is held while exchange or transfer funds are in transit"
  assignment_allowed: "boolean — whether income payments may be assigned, sold or pledged"
  purchase_sources: "list — origins of purchase money accepted"
  beneficiary_max_primary: "integer — maximum number of primary beneficiaries"
  beneficiary_min_share_pct: "integer percent — smallest beneficiary share"
  minor_beneficiary_age: "integer years — age below which a share is paid only to a guardian or UTMA custodian"
  death_report_verification_days: "integer calendar days — period within which an unverified report of death must be confirmed by a certified death certificate before payments resume"
  survivor_reduction_trigger: "enum either_death|primary_death — whose death reduces a joint payment to the survivor percentage"
  overpayment_reclamation_window_days: "integer calendar days — period after a post-death direct deposit within which Ashgrove requests its return from the bank"
  cola_first_increase_anniversary: "integer — contract anniversary on which the first cost-of-living increase applies"
  qualified_max_period_certain_years: "integer years — longest period certain allowed on an IRA contract under the minimum distribution rules"
  withholding_default_periodic: "enum per_irs_tables — the withholding applied to periodic payments when no election is on file"
  held_payment_release_business_days: "integer business days — time after a suspension is cleared within which the held payments are released in one sum"
  refund_basis: "enum purchase_less_gross_payments|none — how the cash refund lump sum is measured: the purchase amount less gross income payments made, never below zero"

