      allocation_increment_pct: 5
      premium_bonus_pct: 0.00
      bonus_vesting_ladder: [1.00]
      free_withdrawal_pct: 0.10
      free_withdrawal_first_contract_year: 2
      min_withdrawal_amount: 500
      min_remaining_contract_value: 2000
      rmd_surrender_charge_waiver: true
      nursing_home_waiver_available: true
      nursing_home_min_days: 90
      terminal_illness_waiver_available: true
      terminal_illness_life_expectancy_months: 12
      waiver_first_contract_year: 2
      glwb_included: true
      glwb_rider_fee_pct: 0.0120
      glwb_rider_fee_max_pct: 0.0160
      glwb_premium_bonus_pct: 0.15
      glwb_rollup_rate: 0.08
      glwb_rollup_years: 10
      glwb_min_income_age: 50
      glwb_withdrawal_pct_ladder: [{age: 50, pct: 0.040}, {age: 55, pct: 0.045}, {age: 60, pct: 0.050}, {age: 65, pct: 0.055}, {age: 70, pct: 0.060}, {age: 75, pct: 0.065}, {age: 80, pct: 0.070}]
      glwb_joint_reduction_pct: 0.005
      glwb_rmd_not_excess: true
      annuitization_first_contract_year: 2
      annuitization_min_period_certain_years: 5
      maturity_age: 95
      spousal_continuation_allowed: true
      beneficiary_annuitization_start_months: 12
      nonspouse_payout_deadline_years: 5
      death_claim_interest_rate: 0.035
      death_benefit_includes_unvested_bonus: true
      free_look_days: 10
      free_look_days_replacement: 30
      free_look_senior_age: 60
      free_look_days_senior: 30
      federal_withholding_default_pct: 0.10
      surrender_deferral_max_days: 180
      beneficiary_max_primary: 10
      beneficiary_min_share_pct: 1
      minor_beneficiary_age: 18
      tax_qualifications_offered: [non_qualified, traditional_ira, roth_ira, sep_ira]

events:
  # ---- contract changes on indexed_holdings ----
  - type: indexed_contract_issued
    target: indexed_holdings
    mutation: create
    meaning: "A fixed indexed annuity application is accepted and recorded as applied until funds are received."
    grain: "one row per contract"
    fields:
      customer_id: "the owner"
      contract_number: "the contract number"
      variant_name: "the official tier name"
      annuitant_name: "the annuitant"
      annuitant_date_of_birth: "the annuitant's date of birth"
      owner_is_annuitant: "whether the owner is the annuitant"
      issue_state: "state of issue"
      issue_date: "the contract date; contract years and anniversaries count from it"
      issue_age: "owner's age last birthday on the issue date"
      tax_qualification: "non-qualified or the IRA type"
      initial_premium: "the initial premium or exchange amount expected"
      allocation_fixed_pct: "initial allocation to the fixed account"
      allocation_cap_pct: "initial allocation to the annual point-to-point cap strategy"
      allocation_participation_pct: "initial allocation to the annual point-to-point participation strategy"
      current_fixed_rate: "fixed account rate for the first contract year"
      current_cap_rate: "cap for the first contract year"
      current_participation_rate: "participation rate for the first contract year"
      replacement_sale: "whether the contract replaced another annuity or life policy"
      exchange_source_company: "the other company for a 1035 exchange or IRA transfer, as on the transfer form; empty for new money"
    triggers:
      - event: indexed:indexed_premium_received
        map: {amount: initial_premium, transaction_date: issue_date}
      - event: indexed:indexed_beneficiary_designated
        map: {designation_effective_date: issue_date}
  - type: indexed_contract_activated
    target: indexed_holdings
    mutation: {transition: {from: applied, to: active}}
    meaning: "Funds are received in good order and the contract is issued and delivered."
    grain: "one row per transaction"
    fields:
      status: "becomes active"
      contract_delivery_date: "date the owner received the contract"
    triggers: []
  - type: indexed_application_declined
    target: indexed_holdings
    mutation: {transition: {from: applied, to: declined}}
    meaning: "The application is declined or withdrawn before issue."
    grain: "one row per transaction"
    fields:
      status: "becomes declined"
      termination_date: "date of the decline"
    triggers:
      - event: indexed:indexed_premium_returned
        map: {return_reason: application_declined, transaction_date: termination_date}
  - type: indexed_lifetime_income_elected
    target: indexed_holdings
    mutation: {transition: {from: active, to: income_phase}}
    meaning: "The owner starts guaranteed lifetime withdrawals; the withdrawal percentage is locked by the covered person's age."
    grain: "one row per transaction"
    fields:
      status: "becomes income_phase"
      income_start_date: "date lifetime withdrawals start"
      joint_life_income: "whether the spouse is covered for joint lifetime income"
      lifetime_withdrawal_pct: "the locked lifetime withdrawal percentage"
      annual_lifetime_withdrawal_amount: "benefit base on the start date times the percentage"
      lifetime_withdrawal_frequency: "how often lifetime withdrawals are paid"
    triggers: []
  - type: indexed_value_exhausted
    target: indexed_holdings
    mutation: {transition: {from: income_phase, to: guaranteed_payout}}
    meaning: "Covered lifetime withdrawals and rider fees reduce the contract value to zero and payments continue from the guarantee."
    grain: "one row per transaction"
    fields:
      status: "becomes guaranteed_payout"
    triggers: []
  - type: indexed_contract_surrendered
    target: indexed_holdings
    mutation: {transition: [{from: active, to: surrendered}, {from: income_phase, to: surrendered}]}
    meaning: "The owner surrenders the contract."
    grain: "one row per transaction"
    fields:
      status: "becomes surrendered"
      termination_date: "date the signed surrender request was received in good order"
    triggers:
      - event: indexed:indexed_surrender_paid
        map: {transaction_date: termination_date}
  - type: indexed_contract_annuitized
    target: indexed_holdings
    mutation: {transition: {from: active, to: annuitized}}
    meaning: "The contract value is applied to an Ashgrove income annuity."
    grain: "one row per transaction"
    fields:
      status: "becomes annuitized"
      termination_date: "the annuitization date"
    triggers:
      - event: indexed:indexed_annuitization_transfer
        map: {transaction_date: termination_date}
  - type: indexed_death_claim_registered
    target: indexed_holdings
    mutation: {transition: [{from: active, to: death_claim_pending}, {from: income_phase, to: death_claim_pending}, {from: guaranteed_payout, to: death_claim_pending}]}
    meaning: "Notice of the owner's death is registered."
    grain: "one row per transaction"
    fields:
      status: "becomes death_claim_pending"
    triggers: []
  - type: indexed_death_claim_paid
    target: indexed_holdings
    mutation: {transition: {from: death_claim_pending, to: claim_paid}}
    meaning: "The death benefit is settled for every beneficiary."
    grain: "one row per transaction"
    fields:
      status: "becomes claim_paid"
      termination_date: "date the last share was settled"
    triggers:
      - event: indexed:indexed_death_benefit_paid
        map: {transaction_date: termination_date}
  - type: indexed_spousal_continuation
    target: indexed_holdings
    mutation: {transition: [{from: death_claim_pending, to: active}, {from: death_claim_pending, to: income_phase}]}
    meaning: "The surviving spouse continues the contract as owner, and continues joint lifetime withdrawals where they were covered."
    grain: "one row per transaction"
    fields:
      status: "becomes active, or income_phase where joint lifetime withdrawals had begun"
      customer_id: "the spouse's customer profile, now the owner"
      spousal_continuation_date: "date the continuation took effect"
    triggers: []
  - type: indexed_free_look_cancelled
    target: indexed_holdings
    mutation: {transition: {from: active, to: cancelled_free_look}}
    meaning: "The owner returns the contract within the free-look period."
    grain: "one row per transaction"
    fields:
      status: "becomes cancelled_free_look"
      termination_date: "date the returned contract was received"
    triggers:
      - event: indexed:indexed_premium_returned
        map: {return_reason: free_look, transaction_date: termination_date}
  - type: indexed_allocation_changed
    target: indexed_holdings
    mutation: update
    meaning: "The allocation among crediting strategies changes on a contract anniversary at the owner's request."
    grain: "one row per transaction"
    fields:
      allocation_fixed_pct: "new fixed account share"
      allocation_cap_pct: "new cap strategy share"
      allocation_participation_pct: "new participation strategy share"
    triggers: []
  - type: indexed_crediting_rates_renewed
    target: indexed_holdings
    mutation: update
    meaning: "On each anniversary Ashgrove declares the fixed rate, cap and participation rate for the coming contract year."
    grain: "one row per transaction"
    fields:
      current_fixed_rate: "fixed account rate for the new contract year"
      current_cap_rate: "cap for the new contract year"
      current_participation_rate: "participation rate for the new contract year"
      next_anniversary_date: "the next contract anniversary, on which the declared rates are next renewed"
    triggers: []
  - type: indexed_rmd_amount_posted
    target: indexed_holdings
    mutation: update
    meaning: "Ashgrove posts the required minimum distribution for the year on an IRA contract."
    grain: "one row per transaction"
    fields:
      rmd_year: "calendar year"
      rmd_amount_current_year: "the required minimum distribution"
    triggers: []
  # ---- ledger rows on indexed_transactions ----
  - type: indexed_premium_received
    target: indexed_transactions
    meaning: "A premium is received and credited to the contract value, allocated by the current allocation."
    grain: "one row per premium receipt"
    distinguish_by: [transaction_date, premium_source, payment_method]
    fields:
      transaction_date: "date received in good order"
      amount: "premium credited"
      premium_source: "origin of the money"
      payment_method: "how it arrived"
    account: contract_value
    direction: in
    triggers: []
  - type: indexed_bonus_credited
    target: indexed_transactions
    meaning: "The premium bonus is credited to the contract value on a premium received in the first contract year."
    grain: "one row per premium bonused"
    distinguish_by: [source_txn_id]
    fields:
      transaction_date: "date credited"
      amount: "bonus credited"
      source_txn_id: "the premium the bonus is credited on"
    account: contract_value
    direction: in
    triggers: []
  - type: indexed_interest_credited
    target: indexed_transactions
    meaning: "Fixed account interest is credited for the contract year, or for the part year at a withdrawal, surrender, death benefit or annuitization."
    grain: "one row per crediting period"
    distinguish_by: [segment_end_date]
    fields:
      transaction_date: "date credited"
      amount: "interest credited"
      segment_start_date: "first day of the crediting period"
      segment_end_date: "last day of the crediting period"
      credited_rate: "rate applied"
    account: contract_value
    direction: in
    triggers: []
  - type: indexed_index_credited
    target: indexed_transactions
    meaning: "An indexed strategy's one-year segment ends on the anniversary and its index credit is applied."
    grain: "one row per strategy per segment"
    distinguish_by: [strategy, segment_end_date]
    fields:
      transaction_date: "the anniversary"
      amount: "index credit, never negative"
      strategy: "the indexed strategy"
      segment_start_date: "segment start"
      segment_end_date: "segment end"
      index_change_pct: "S&P 500 point-to-point change over the segment"
      credited_rate: "rate credited after cap or participation and floor"
    account: contract_value
    direction: in
    triggers: []
  - type: indexed_withdrawal_paid
    target: indexed_transactions
    meaning: "A partial withdrawal, required minimum distribution or lifetime withdrawal is taken from the contract value."
    grain: "one row per withdrawal"
    distinguish_by: [transaction_date, withdrawal_type, indexed_request_id]
    fields:
      transaction_date: "date paid"
      amount: "gross amount removed from the contract value"
      withdrawal_type: "classification for charge and benefit base purposes"
      free_portion_amount: "part free of surrender charge and bonus recapture"
      taxable_amount: "taxable part"
      federal_withholding_amount: "federal tax withheld"
      net_paid_amount: "amount paid to the owner"
      indexed_request_id: "the signed request, or the lifetime income election for scheduled lifetime withdrawals"
      payout_method: "how it was paid"
    account: contract_value
    direction: out
    triggers:
      - event: indexed:indexed_surrender_charge_assessed
        when: {withdrawal_type: excess_partial}
        map: {charge_reason: partial_withdrawal, indexed_request_id: indexed_request_id, transaction_date: transaction_date}
      - event: indexed:indexed_benefit_base_reduced
        when: {withdrawal_type: lifetime_excess}
        map: {indexed_request_id: indexed_request_id, transaction_date: transaction_date, benefit_base_reason: excess_withdrawal_reduction}
  - type: indexed_guaranteed_payment_paid
    target: indexed_transactions
    meaning: "A lifetime withdrawal is paid from Ashgrove's guarantee after the contract value is exhausted."
    grain: "one row per scheduled payment"
    distinguish_by: [payment_due_date]
    fields:
      transaction_date: "date paid"
      amount: "lifetime payment"
      payment_due_date: "scheduled payment date"
      taxable_amount: "taxable part"
      federal_withholding_amount: "federal tax withheld"
      payout_method: "how it was paid"
    triggers: []
  - type: indexed_rider_fee_deducted
    target: indexed_transactions
    meaning: "The annual lifetime withdrawal benefit rider fee is deducted from the contract value on the anniversary."
    grain: "one row per anniversary"
    distinguish_by: [contract_year]
    fields:
      transaction_date: "the anniversary"
      amount: "fee deducted"
      contract_year: "the contract year just ended"
    account: contract_value
    direction: out
    triggers: []
  - type: indexed_surrender_charge_assessed
    target: indexed_transactions
    meaning: "A surrender charge is deducted on the part of a withdrawal or surrender subject to charge."
    grain: "one row per charged withdrawal or surrender"
    distinguish_by: [charge_reason, indexed_request_id]
    fields:
      transaction_date: "date assessed"
      amount: "charge deducted"
      charge_reason: "partial_withdrawal or full_surrender"
      charge_pct: "percentage applied"
      contract_year: "contract year of the charge"
      indexed_request_id: "the request"
    account: contract_value
    direction: out
    triggers: []
  - type: indexed_bonus_recaptured
    target: indexed_transactions
    meaning: "The unvested part of the premium bonus is taken back on a surrender or on the excess part of a withdrawal."
    grain: "one row per recapture occasion"
    distinguish_by: [indexed_request_id]
    fields:
      transaction_date: "date recaptured"
      amount: "unvested bonus recaptured"
      vesting_pct: "vested share applied"
      indexed_request_id: "the request causing the recapture"
    account: contract_value
    direction: out
    triggers: []
  - type: indexed_surrender_paid
    target: indexed_transactions
    meaning: "The remaining contract value leaves on full surrender and the surrender value is paid."
    grain: "one row per surrender"
    distinguish_by: [indexed_request_id]
    fields:
      transaction_date: "date paid"
      amount: "contract value released after charge and recapture"
      taxable_amount: "taxable part"
      federal_withholding_amount: "federal tax withheld"
      net_paid_amount: "amount paid"
      indexed_request_id: "the signed surrender request"
      payout_method: "how it was paid"
    account: contract_value
    direction: out
    triggers: []
  - type: indexed_annuitization_transfer
    target: indexed_transactions
    meaning: "The contract value is applied to buy an Ashgrove income annuity."
    grain: "one row per annuitization"
    distinguish_by: [transaction_date]
    fields:
      transaction_date: "annuitization date"
      amount: "value applied"
      indexed_request_id: "the signed election; empty at maturity"
    account: contract_value
    direction: out
    triggers:
      - event: income:income_contract_issued
        map: {customer_id: customer_id, source_indexed_contract_id: indexed_contract_id, issue_date: transaction_date, purchase_amount: amount}
  - type: indexed_death_benefit_paid
    target: indexed_transactions
    meaning: "One beneficiary's share of the death benefit is paid."
    grain: "one row per payee per death claim"
    distinguish_by: [indexed_request_id, payee_name]
    fields:
      transaction_date: "date paid"
      amount: "share of contract value paid, excluding interest"
      interest_amount: "death-claim interest paid with it"
      taxable_amount: "taxable part"
      federal_withholding_amount: "federal tax withheld"
      payee_name: "beneficiary as named in the governing designation"
      payout_method: "how it was paid"
      indexed_request_id: "the death claim"
    account: contract_value
    direction: out
    triggers: []
  - type: indexed_premium_returned
    target: indexed_transactions
    meaning: "Premium is returned on free look or a declined application."
    grain: "one row per return"
    distinguish_by: [return_reason]
    fields:
      transaction_date: "date returned"
      amount: "amount returned"
      return_reason: "free_look or application_declined"
    account: contract_value
    direction: out
    triggers: []
  - type: indexed_benefit_base_credited
    target: indexed_transactions
    meaning: "The benefit base is credited with a premium, the benefit base bonus or an anniversary roll-up."
    grain: "one row per benefit base credit"
    distinguish_by: [benefit_base_reason, transaction_date]
    fields:
      transaction_date: "date credited"
      amount: "benefit base credited"
      benefit_base_reason: "premium, bonus or rollup"
      contract_year: "for a roll-up, the contract year just ended"
    account: benefit_base
    direction: in
    triggers: []
  - type: indexed_benefit_base_reduced
    target: indexed_transactions
    meaning: "An excess withdrawal reduces the benefit base in the same proportion as it reduces the contract value."
    grain: "one row per excess withdrawal"
    distinguish_by: [indexed_request_id, transaction_date]
    fields:
      transaction_date: "date reduced"
      amount: "benefit base reduction"
      benefit_base_reason: "excess_withdrawal_reduction"
      indexed_request_id: "the withdrawal request"
    account: benefit_base
    direction: out
    triggers: []
  - type: indexed_beneficiary_designated
    target: indexed_transactions
    meaning: "One beneficiary line of a designation is recorded; a later designation replaces the earlier one entirely."
    grain: "one row per beneficiary line per designation"
    distinguish_by: [designation_effective_date, beneficiary_class, beneficiary_name]
    fields:
      transaction_date: "date recorded"
      designation_effective_date: "date the owner signed the designation"
      beneficiary_name: "beneficiary as named"
      beneficiary_relationship: "relationship to the owner"
      beneficiary_class: "primary or contingent"
      share_percent: "whole-percent share within the class"
      designation_type: "revocable or irrevocable"
      indexed_request_id: "the signed change request; empty for the original designation"
    triggers: []

measures:
  - id: indexed_msr_withdrawals_contract_year
    window: "the current contract year, from the latest anniversary on or before the evaluation date, before the withdrawal being evaluated"
    measure: "sum of amount over indexed_withdrawal_paid rows on the contract in the window"
  - id: indexed_msr_anniversary_value
    window: "all rows up to and including the latest contract anniversary on or before the evaluation date"
    measure: "net sum of amount over every contract_value row on the contract — the contract value on that anniversary (the initial premium plus bonus in the first contract year)"
  - id: indexed_msr_first_year_premiums
    window: "from the issue date to the day before the first contract anniversary"
    measure: "sum of amount over indexed_premium_received rows on the contract in the window, less indexed_premium_returned rows"
  - id: indexed_msr_premiums_on_annuitant
    window: "point in time at the evaluation date"
    measure: "sum of amount over indexed_premium_received rows, less indexed_premium_returned rows, on every indexed_holdings contract on the same annuitant whose status is applied, active or income_phase"

policies:
  - id: indexed_agg_multi_holding
    subject: [indexed_contract_issued]
    rule: "An owner may hold any number of Ashgrove fixed indexed annuities; the count is not capped, but no annuitant may be the covered person under more than one IncomeShield lifetime withdrawal benefit, and total premium on one annuitant is governed by indexed_agg_premium_limit."
    eligibility: []
    params:
      max_per_customer: null
  - id: indexed_agg_premium_limit
    subject: [indexed_contract_issued, indexed_premium_received]
    rule: "Premiums are aggregated per annuitant, identified by annuitant name and date of birth, across every Ashgrove fixed indexed annuity that is applied, active or income_phase. A premium is accepted without home office approval only if indexed_msr_premiums_on_annuitant plus the new premium does not exceed aggregate_premium_limit_per_annuitant and the contract's own total premium stays within max_premium_without_approval."
    eligibility: []
    params:
      aggregate_premium_limit_per_annuitant: 2000000
      max_premium_without_approval: "=max_premium_without_approval"
    measures: [indexed_msr_premiums_on_annuitant]
  - id: indexed_issue_and_premium
    subject: [indexed_contract_issued, indexed_contract_activated, indexed_application_declined, indexed_premium_received, indexed_bonus_credited, indexed_benefit_base_credited]
    rule: "A tier is issued only within its issue ages and with an initial premium of at least min_premium_nonqualified, or min_premium_qualified for an IRA, registered as one of tax_qualifications_offered, with an allocation among strategies_offered in whole multiples of allocation_increment_pct totalling 100. A premium is credited only while the contract status is applied or active. Additional premiums of at least min_additional_premium are accepted only within additional_premium_window_months of the issue date. On a tier with premium_bonus_pct above zero, each premium received in the first contract year earns a premium bonus of that share, credited to the contract value the same day and vesting under bonus_vesting_ladder. On an IncomeShield tier every premium is also credited to the benefit base, and premiums received in the first contract year earn a benefit base bonus of glwb_premium_bonus_pct, credited to the benefit base only. An application declined or withdrawn before issue has its money returned without interest."
    eligibility:
      - id: premium_status
        applies_to: [indexed_premium_received]
        kind: state
        condition: "A premium is credited only while the contract status is applied or active."
        evidence_fields: [indexed_holdings.status, indexed_holdings.indexed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[indexed_holdings.indexed_contract_id]]
          action_bindings: {indexed_holdings.indexed_contract_id: indexed_contract_id}
        state_contract:
          field: indexed_holdings.status
          allowed: [applied, active]
    params:
      tax_qualifications_offered: "=tax_qualifications_offered"
      strategies_offered: "=strategies_offered"
      allocation_increment_pct: "=allocation_increment_pct"
      per_tier:
        Ashgrove IndexEdge 5: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_premium_nonqualified: "=min_premium_nonqualified", min_premium_qualified: "=min_premium_qualified", additional_premium_window_months: "=additional_premium_window_months", min_additional_premium: "=min_additional_premium", premium_bonus_pct: "=premium_bonus_pct", glwb_premium_bonus_pct: "=glwb_premium_bonus_pct"}
        Ashgrove IndexEdge 7: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_premium_nonqualified: "=min_premium_nonqualified", min_premium_qualified: "=min_premium_qualified", additional_premium_window_months: "=additional_premium_window_months", min_additional_premium: "=min_additional_premium", premium_bonus_pct: "=premium_bonus_pct", glwb_premium_bonus_pct: "=glwb_premium_bonus_pct"}
        Ashgrove IndexEdge 10: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_premium_nonqualified: "=min_premium_nonqualified", min_premium_qualified: "=min_premium_qualified", additional_premium_window_months: "=additional_premium_window_months", min_additional_premium: "=min_additional_premium", premium_bonus_pct: "=premium_bonus_pct", glwb_premium_bonus_pct: "=glwb_premium_bonus_pct"}
        Ashgrove IndexEdge 10 Bonus: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_premium_nonqualified: "=min_premium_nonqualified", min_premium_qualified: "=min_premium_qualified", additional_premium_window_months: "=additional_premium_window_months", min_additional_premium: "=min_additional_premium", premium_bonus_pct: "=premium_bonus_pct", glwb_premium_bonus_pct: "=glwb_premium_bonus_pct"}
        Ashgrove IncomeShield 7: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_premium_nonqualified: "=min_premium_nonqualified", min_premium_qualified: "=min_premium_qualified", additional_premium_window_months: "=additional_premium_window_months", min_additional_premium: "=min_additional_premium", premium_bonus_pct: "=premium_bonus_pct", glwb_premium_bonus_pct: "=glwb_premium_bonus_pct"}
        Ashgrove IncomeShield 10: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_premium_nonqualified: "=min_premium_nonqualified", min_premium_qualified: "=min_premium_qualified", additional_premium_window_months: "=additional_premium_window_months", min_additional_premium: "=min_additional_premium", premium_bonus_pct: "=premium_bonus_pct", glwb_premium_bonus_pct: "=glwb_premium_bonus_pct"}
    formula:
      bonus_amount: round(amount * premium_bonus_pct, 2)
