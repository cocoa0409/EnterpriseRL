        Ashgrove IndexEdge 7: {annuitization_first_contract_year: "=annuitization_first_contract_year"}
        Ashgrove IndexEdge 10: {annuitization_first_contract_year: "=annuitization_first_contract_year"}
        Ashgrove IndexEdge 10 Bonus: {annuitization_first_contract_year: "=annuitization_first_contract_year"}
        Ashgrove IncomeShield 7: {annuitization_first_contract_year: "=annuitization_first_contract_year"}
        Ashgrove IncomeShield 10: {annuitization_first_contract_year: "=annuitization_first_contract_year"}
  - id: indexed_death_benefit
    subject: [indexed_death_claim_registered, indexed_death_claim_paid, indexed_spousal_continuation, indexed_death_benefit_paid]
    rule: "On the owner's death the death benefit is the contract value on the date due proof is received, with no surrender charge, and including any unvested bonus where death_benefit_includes_unvested_bonus is true; the benefit base is never paid as a death benefit. Death benefit is paid only on a death claim whose certified death certificate has been received and whose request status is approved. Disbursement proceeds only while the contract status is death_claim_pending or claim_paid. Interest is added at death_claim_interest_rate, simple, from the date due proof is received to payment, actual days over 365, rounded to the cent. Where spousal_continuation_allowed is true and the spouse is sole primary beneficiary, the spouse may continue the contract as owner, and continues lifetime withdrawals where joint lifetime income was elected; otherwise lifetime withdrawals end at the death. Other beneficiaries take a lump sum, an Ashgrove income annuity beginning within beneficiary_annuitization_start_months, or the whole share within nonspouse_payout_deadline_years. On a contract in guaranteed_payout status no death benefit is payable. Shares follow the designation in effect at death; a minor's share, below minor_beneficiary_age, is paid only to a guardian or UTMA custodian."
    eligibility:
      - id: proof_and_approval
        applies_to: [indexed_death_claim_paid, indexed_death_benefit_paid, indexed_spousal_continuation]
        kind: authorization
        condition: "Death benefit is paid only on a death claim whose certified death certificate has been received and whose request status is approved."
        evidence_fields: [indexed_service_requests.death_certificate_received, indexed_service_requests.request_status, indexed_service_requests.indexed_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[indexed_service_requests.indexed_request_id]]
          action_bindings: {indexed_service_requests.indexed_request_id: indexed_request_id}
      - id: disbursement_status
        applies_to: [indexed_death_benefit_paid]
        kind: state
        condition: "Disbursement proceeds only while the contract status is death_claim_pending or claim_paid."
        evidence_fields: [indexed_holdings.status, indexed_holdings.indexed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[indexed_holdings.indexed_contract_id]]
          action_bindings: {indexed_holdings.indexed_contract_id: indexed_contract_id}
        state_contract:
          field: indexed_holdings.status
          allowed: [death_claim_pending, claim_paid]
    params:
      death_benefit_includes_unvested_bonus: "=death_benefit_includes_unvested_bonus"
      spousal_continuation_allowed: "=spousal_continuation_allowed"
      beneficiary_annuitization_start_months: "=beneficiary_annuitization_start_months"
      nonspouse_payout_deadline_years: "=nonspouse_payout_deadline_years"
      death_claim_interest_rate: "=death_claim_interest_rate"
      minor_beneficiary_age: "=minor_beneficiary_age"
  - id: indexed_beneficiary_designation
    subject: [indexed_beneficiary_designated]
    rule: "The owner names primary and contingent beneficiaries. A beneficiary designation is recorded only while the contract status is applied, active or income_phase. A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary. Where joint lifetime income was elected, the covered spouse must remain the sole primary beneficiary for the joint coverage to continue. The new designation replaces the earlier one entirely, effective on the owner's signature date if signed while the owner was living. Shares are whole percents of at least beneficiary_min_share_pct totalling 100 in each class, with no more than beneficiary_max_primary primaries."
    eligibility:
      - id: designation_status
        applies_to: [indexed_beneficiary_designated]
        kind: state
        condition: "A beneficiary designation is recorded only while the contract status is applied, active or income_phase."
        evidence_fields: [indexed_holdings.status, indexed_holdings.indexed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[indexed_holdings.indexed_contract_id]]
          action_bindings: {indexed_holdings.indexed_contract_id: indexed_contract_id}
        state_contract:
          field: indexed_holdings.status
          allowed: [applied, active, income_phase]
      - id: signed_change_request
        applies_to: [indexed_beneficiary_designated]
        kind: authorization
        condition: "A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary."
        evidence_fields: [indexed_service_requests.request_type, indexed_service_requests.request_status, indexed_service_requests.signed_date, indexed_transactions.designation_type, indexed_service_requests.indexed_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[indexed_service_requests.indexed_request_id]]
          action_bindings: {indexed_service_requests.indexed_request_id: indexed_request_id}
    params:
      beneficiary_min_share_pct: "=beneficiary_min_share_pct"
      beneficiary_max_primary: "=beneficiary_max_primary"
  - id: indexed_free_look_and_rmd
    subject: [indexed_free_look_cancelled, indexed_premium_returned, indexed_rmd_amount_posted]
    rule: "The owner may return the contract for a refund of premium paid less withdrawals, without any bonus or index credit. The returned contract must be received no later than the contract delivery date plus free_look_days. The free-look end is found by adding the free-look days in calendar days to the contract delivery date; a contract received on that day is in time. When the contract replaced another annuity or life policy, free_look_days_replacement replaces free_look_days; when the owner's age on the issue date was free_look_senior_age or more, free_look_days_senior replaces it; when both apply the longer governs. For an IRA contract whose owner has reached the required beginning age, Ashgrove posts each year's required minimum distribution from the prior December 31 contract value."
    eligibility:
      - id: within_free_look
        applies_to: [indexed_free_look_cancelled]
        kind: time
        condition: "The returned contract must be received no later than the contract delivery date plus free_look_days."
        evidence_fields: [indexed_holdings.contract_delivery_date, indexed_holdings.replacement_sale, indexed_holdings.issue_age, indexed_holdings.indexed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[indexed_holdings.indexed_contract_id]]
          action_bindings: {indexed_holdings.indexed_contract_id: indexed_contract_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the contract delivery date"
          anchor_source: indexed_holdings.contract_delivery_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: "The free-look end is found by adding the free-look days in calendar days to the contract delivery date; a contract received on that day is in time."
          boundary: inclusive
    params:
      free_look_days: "=free_look_days"
      free_look_days_replacement: "=free_look_days_replacement"
      free_look_senior_age: "=free_look_senior_age"
      free_look_days_senior: "=free_look_days_senior"
