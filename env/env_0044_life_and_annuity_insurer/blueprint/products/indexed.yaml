        Ashgrove IncomeShield 10: {nursing_home_waiver_available: "=nursing_home_waiver_available", nursing_home_min_days: "=nursing_home_min_days", terminal_illness_waiver_available: "=terminal_illness_waiver_available", terminal_illness_life_expectancy_months: "=terminal_illness_life_expectancy_months", waiver_first_contract_year: "=waiver_first_contract_year"}
  - id: indexed_surrender
    subject: [indexed_contract_surrendered, indexed_surrender_paid, indexed_surrender_charge_assessed, indexed_bonus_recaptured]
    rule: "The owner may surrender the contract. A full surrender is processed only on a surrender request signed by the owner, and by any irrevocable beneficiary and assignee of record. The surrender is effective on the date the signed request is received in good order, with fixed interest credited to that date and no index credit for the partial year. The surrender charge is the contract value less the remaining free withdrawal amount, times the surrender_charge_ladder percentage for the contract year, rounded to the cent; on a bonus tier the unvested bonus — the bonus credited times one minus the bonus_vesting_ladder share for the contract year — is also recaptured; the result is never less than the state minimum nonforfeiture value. Surrender ends any lifetime withdrawal benefit. Ashgrove may defer payment up to surrender_deferral_max_days."
