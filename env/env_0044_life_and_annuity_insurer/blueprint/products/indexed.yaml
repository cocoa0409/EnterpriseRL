# Fixed Indexed Annuities — product and event policy charter of Ashgrove Mutual Life Insurance Company.
category: indexed
display_name: Fixed Indexed Annuities

binding:
  holding_table: indexed_holdings
  event_tables: [indexed_transactions]
  intake_tables: [indexed_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    contract_value: contract_value
    benefit_base: benefit_base

lifecycle:
  states: [applied, active, income_phase, guaranteed_payout, annuitized, surrendered, death_claim_pending, claim_paid, cancelled_free_look, declined]
  transitions:
    - {from: applied, to: active, by: system, means: "The contract is issued once the premium or exchange funds are received in good order."}
    - {from: applied, to: declined, by: system, means: "The application is declined or withdrawn before issue."}
    - {from: active, to: income_phase, by: user, means: "The owner elects to start guaranteed lifetime withdrawals under the lifetime withdrawal benefit rider."}
    - {from: income_phase, to: guaranteed_payout, by: system, means: "Covered lifetime withdrawals and rider fees reduce the contract value to zero; lifetime payments continue from Ashgrove's general account."}
    - {from: active, to: surrendered, by: user, means: "The owner surrenders the contract."}
    - {from: income_phase, to: surrendered, by: user, means: "The owner surrenders the contract after lifetime withdrawals began, ending the lifetime guarantee."}
    - {from: active, to: annuitized, by: user, means: "The owner annuitizes the contract value into an Ashgrove income annuity, or the contract reaches its maturity date."}
    - {from: active, to: death_claim_pending, by: agent, means: "Notice of the owner's death is registered."}
    - {from: income_phase, to: death_claim_pending, by: agent, means: "Notice of the owner's death is registered after lifetime withdrawals began."}
    - {from: guaranteed_payout, to: death_claim_pending, by: agent, means: "Notice of the covered person's death is registered on a contract paying from the guarantee."}
    - {from: death_claim_pending, to: claim_paid, by: agent, means: "The death benefit is paid or applied for every beneficiary, or lifetime payments end with no value left."}
    - {from: death_claim_pending, to: active, by: agent, means: "The surviving spouse continues the contract as owner before lifetime withdrawals had begun."}
    - {from: death_claim_pending, to: income_phase, by: agent, means: "The surviving spouse, covered under joint lifetime withdrawals, continues the contract and the lifetime withdrawals."}
    - {from: active, to: cancelled_free_look, by: user, means: "The owner returns the contract within the free-look period."}

accounts:
  - key: contract_value
    unit: USD
    meaning: "The accumulation value: premium plus any premium bonus, index and fixed credits, less withdrawals, rider fees, surrender charges, recaptured bonus and amounts paid out."
  - key: benefit_base
    unit: USD
    meaning: "The lifetime withdrawal benefit base on IncomeShield contracts — premium plus benefit base bonus and roll-up credits, less proportional reductions for excess withdrawals; it is not a cash value."

parameter_schema:
  surrender_charge_years: "integer contract years — length of the surrender charge schedule"
  surrender_charge_ladder: "list of decimals — surrender charge percentage for contract year 1, 2, ... in order"
  min_issue_age: "integer years — lowest owner and annuitant issue age"
  max_issue_age: "integer years — highest owner and annuitant issue age"
  min_premium_nonqualified: "USD — smallest initial premium, non-qualified"
  min_premium_qualified: "USD — smallest initial premium, IRA"
  max_premium_without_approval: "USD — largest total premium on one contract without home office approval"
  additional_premium_window_months: "integer calendar months from the issue date — period during which additional premiums are accepted; 0 for single premium tiers"
  min_additional_premium: "USD — smallest additional premium within the window"
  fixed_account_initial_rate: "decimal annual rate — fixed account rate declared for the first contract year"
  fixed_account_min_guaranteed_rate: "decimal annual rate — lowest fixed account rate ever declared"
  ptp_cap_initial_rate: "decimal — annual point-to-point cap declared for the first contract year"
  ptp_cap_min_guaranteed: "decimal — lowest cap ever declared"
  participation_initial_rate: "decimal — annual point-to-point participation rate declared for the first contract year"
  participation_min_guaranteed: "decimal — lowest participation rate ever declared"
  index_floor_rate: "decimal — lowest index credit rate on any indexed strategy"
  strategies_offered: "list — crediting strategies available"
  allocation_change_window_days: "integer calendar days — period before a contract anniversary within which a reallocation request must be received to take effect on that anniversary"
  allocation_increment_pct: "integer percent — allocations are whole multiples of this percentage"
  premium_bonus_pct: "decimal — premium bonus credited to the contract value as a share of each premium received in the first contract year; 0 when none"
  bonus_vesting_ladder: "list of decimals — vested share of the premium bonus by contract year 1, 2, ...; fully vested after the list ends"
  free_withdrawal_pct: "decimal — share of the contract value on the latest anniversary withdrawable each contract year without surrender charge or bonus recapture"
  free_withdrawal_first_contract_year: "integer — first contract year in which free withdrawals are available"
  min_withdrawal_amount: "USD — smallest partial withdrawal"
  min_remaining_contract_value: "USD — contract value that must remain after a partial withdrawal"
  rmd_surrender_charge_waiver: "boolean — whether required minimum distributions are free of surrender charge and bonus recapture"
  nursing_home_waiver_available: "boolean — whether the nursing home confinement waiver is included"
  nursing_home_min_days: "integer consecutive days — confinement required for the nursing home waiver"
  terminal_illness_waiver_available: "boolean — whether the terminal illness waiver is included"
  terminal_illness_life_expectancy_months: "integer months — certified life expectancy for the terminal illness waiver"
  waiver_first_contract_year: "integer — first contract year in which the waivers may be used"
  glwb_included: "boolean — whether the guaranteed lifetime withdrawal benefit rider is part of the contract"
  glwb_rider_fee_pct: "decimal — annual rider fee as a share of the benefit base, deducted from the contract value on each anniversary"
  glwb_rider_fee_max_pct: "decimal — highest rider fee Ashgrove may ever charge"
  glwb_premium_bonus_pct: "decimal — benefit base bonus as a share of premiums received in the first contract year"
  glwb_rollup_rate: "decimal — simple annual roll-up credited to the benefit base on each anniversary, as a share of premiums plus benefit base bonus"
  glwb_rollup_years: "integer — number of anniversaries on which the roll-up is credited, ending earlier when lifetime withdrawals begin"
  glwb_min_income_age: "integer years — youngest covered person's age at which lifetime withdrawals may start"
  glwb_withdrawal_pct_ladder: "ladder of {age, pct} — lifetime withdrawal percentage by the covered person's age when withdrawals start (the younger covered person on joint income); the pct for the highest age not above that age applies"
  glwb_joint_reduction_pct: "decimal — reduction to the lifetime withdrawal percentage when joint lifetime income is elected"
  glwb_rmd_not_excess: "boolean — whether a required minimum distribution above the lifetime withdrawal amount is not treated as an excess withdrawal"
  annuitization_first_contract_year: "integer — first contract year in which annuitization is free of surrender charge"
  annuitization_min_period_certain_years: "integer years — shortest period certain for charge-free annuitization without a life contingency"
  maturity_age: "integer years — annuitant age at which the contract must be annuitized or paid out"
  spousal_continuation_allowed: "boolean — whether a surviving spouse who is sole primary beneficiary may continue the contract"
  beneficiary_annuitization_start_months: "integer months — period from death within which a beneficiary income annuity must begin"
  nonspouse_payout_deadline_years: "integer years — period from death by which a non-annuitizing beneficiary must take the whole share"
  death_claim_interest_rate: "decimal annual rate — simple interest on the death benefit from due proof to payment"
  death_benefit_includes_unvested_bonus: "boolean — whether the death benefit is the full contract value including any unvested premium bonus"
  free_look_days: "integer calendar days — free-look period from the contract delivery date"
  free_look_days_replacement: "integer calendar days — free-look period when the contract replaced another annuity or life policy"
  free_look_senior_age: "integer years — owner age on the issue date at or above which the senior free-look period applies"
  free_look_days_senior: "integer calendar days — senior free-look period"
  federal_withholding_default_pct: "decimal — federal withholding on the taxable part of a distribution unless the owner elects none"
  surrender_deferral_max_days: "integer calendar days — longest Ashgrove may defer a surrender payment"
  beneficiary_max_primary: "integer — maximum number of primary beneficiaries"
  beneficiary_min_share_pct: "integer percent — smallest beneficiary share"
  minor_beneficiary_age: "integer years — age below which a share is paid only to a guardian or UTMA custodian"
  tax_qualifications_offered: "list — tax registrations the contract may be issued as"

