  - id: indexed_crediting
    subject: [indexed_interest_credited, indexed_index_credited, indexed_crediting_rates_renewed, indexed_allocation_changed]
    rule: "Money in the fixed account earns current_fixed_rate, declared each contract year and never below fixed_account_min_guaranteed_rate. Money in an indexed strategy is credited once a year on the anniversary: the annual point-to-point cap strategy credits the S&P 500 change over the contract year up to current_cap_rate, and the annual point-to-point participation strategy credits current_participation_rate times that change, uncapped; neither ever credits less than index_floor_rate. Money withdrawn from an indexed strategy during the year earns no index credit for that year. Renewal rates for the next contract year are declared on each anniversary and are never below ptp_cap_min_guaranteed and participation_min_guaranteed; first-year rates are ptp_cap_initial_rate and participation_initial_rate. A reallocation takes effect only on a contract anniversary. A reallocation request must be received no earlier than allocation_change_window_days before the next contract anniversary. The window opens on the day found by subtracting the window length in calendar days from the next contract anniversary; a request received on that day or later, up to the anniversary, applies on that anniversary. A request received before the window opens is not held and must be resubmitted within the window. A reallocation is accepted only while the contract status is active or income_phase."
    eligibility:
      - id: within_reallocation_window
        applies_to: [indexed_allocation_changed]
        kind: time
        condition: "A reallocation request must be received no earlier than allocation_change_window_days before the next contract anniversary."
        evidence_fields: [indexed_holdings.next_anniversary_date, indexed_service_requests.received_date, indexed_holdings.indexed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[indexed_holdings.indexed_contract_id]]
          action_bindings: {indexed_holdings.indexed_contract_id: indexed_contract_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the next contract anniversary"
          anchor_source: indexed_holdings.next_anniversary_date
          relation: not_before
          duration_source: variants.allocation_change_window_days
          unit: calendar_days
          counting_rule: "The window opens on the day found by subtracting the window length in calendar days from the next contract anniversary; a request received on that day or later, up to the anniversary, applies on that anniversary."
          boundary: inclusive
      - id: reallocation_status
        applies_to: [indexed_allocation_changed]
        kind: state
        condition: "A reallocation is accepted only while the contract status is active or income_phase."
        evidence_fields: [indexed_holdings.status, indexed_holdings.indexed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[indexed_holdings.indexed_contract_id]]
          action_bindings: {indexed_holdings.indexed_contract_id: indexed_contract_id}
        state_contract:
          field: indexed_holdings.status
          allowed: [active, income_phase]
    params:
      per_tier:
        Ashgrove IndexEdge 5: {fixed_account_initial_rate: "=fixed_account_initial_rate", fixed_account_min_guaranteed_rate: "=fixed_account_min_guaranteed_rate", ptp_cap_initial_rate: "=ptp_cap_initial_rate", ptp_cap_min_guaranteed: "=ptp_cap_min_guaranteed", participation_initial_rate: "=participation_initial_rate", participation_min_guaranteed: "=participation_min_guaranteed", index_floor_rate: "=index_floor_rate", allocation_change_window_days: "=allocation_change_window_days"}
        Ashgrove IndexEdge 7: {fixed_account_initial_rate: "=fixed_account_initial_rate", fixed_account_min_guaranteed_rate: "=fixed_account_min_guaranteed_rate", ptp_cap_initial_rate: "=ptp_cap_initial_rate", ptp_cap_min_guaranteed: "=ptp_cap_min_guaranteed", participation_initial_rate: "=participation_initial_rate", participation_min_guaranteed: "=participation_min_guaranteed", index_floor_rate: "=index_floor_rate", allocation_change_window_days: "=allocation_change_window_days"}
        Ashgrove IndexEdge 10: {fixed_account_initial_rate: "=fixed_account_initial_rate", fixed_account_min_guaranteed_rate: "=fixed_account_min_guaranteed_rate", ptp_cap_initial_rate: "=ptp_cap_initial_rate", ptp_cap_min_guaranteed: "=ptp_cap_min_guaranteed", participation_initial_rate: "=participation_initial_rate", participation_min_guaranteed: "=participation_min_guaranteed", index_floor_rate: "=index_floor_rate", allocation_change_window_days: "=allocation_change_window_days"}
        Ashgrove IndexEdge 10 Bonus: {fixed_account_initial_rate: "=fixed_account_initial_rate", fixed_account_min_guaranteed_rate: "=fixed_account_min_guaranteed_rate", ptp_cap_initial_rate: "=ptp_cap_initial_rate", ptp_cap_min_guaranteed: "=ptp_cap_min_guaranteed", participation_initial_rate: "=participation_initial_rate", participation_min_guaranteed: "=participation_min_guaranteed", index_floor_rate: "=index_floor_rate", allocation_change_window_days: "=allocation_change_window_days"}
        Ashgrove IncomeShield 7: {fixed_account_initial_rate: "=fixed_account_initial_rate", fixed_account_min_guaranteed_rate: "=fixed_account_min_guaranteed_rate", ptp_cap_initial_rate: "=ptp_cap_initial_rate", ptp_cap_min_guaranteed: "=ptp_cap_min_guaranteed", participation_initial_rate: "=participation_initial_rate", participation_min_guaranteed: "=participation_min_guaranteed", index_floor_rate: "=index_floor_rate", allocation_change_window_days: "=allocation_change_window_days"}
        Ashgrove IncomeShield 10: {fixed_account_initial_rate: "=fixed_account_initial_rate", fixed_account_min_guaranteed_rate: "=fixed_account_min_guaranteed_rate", ptp_cap_initial_rate: "=ptp_cap_initial_rate", ptp_cap_min_guaranteed: "=ptp_cap_min_guaranteed", participation_initial_rate: "=participation_initial_rate", participation_min_guaranteed: "=participation_min_guaranteed", index_floor_rate: "=index_floor_rate", allocation_change_window_days: "=allocation_change_window_days"}
    formula:
      cap_credited_rate: max(index_floor_rate, min(current_cap_rate, index_change_pct))
      participation_credited_rate: max(index_floor_rate, index_change_pct * current_participation_rate)
  - id: indexed_evt_withdrawal
    subject: [indexed_withdrawal_paid, indexed_surrender_charge_assessed, indexed_bonus_recaptured, indexed_benefit_base_reduced]
    rule: "A partial withdrawal is paid only while the contract status is active or income_phase. A partial withdrawal is paid only on a withdrawal request signed by the owner and approved. Each withdrawal must be at least min_withdrawal_amount and leave at least min_remaining_contract_value. From contract year free_withdrawal_first_contract_year, withdrawals in a contract year up to free_withdrawal_pct of indexed_msr_anniversary_value, less indexed_msr_withdrawals_contract_year, are free; the excess part bears a surrender charge of that part times the surrender_charge_ladder percentage for the contract year, rounded to the cent, and on a bonus tier also a recapture of the unvested bonus in proportion to the excess part over the contract value. Required minimum distributions are free where rmd_surrender_charge_waiver is true. On an IncomeShield contract before lifetime withdrawals start, every withdrawal reduces the benefit base in the proportion it reduces the contract value; after they start, withdrawals within the annual lifetime withdrawal amount do not reduce it, and the part of any withdrawal above it, other than a required minimum distribution where glwb_rmd_not_excess is true, reduces the benefit base proportionally. Tax follows the contract's registration: gain first on a non-qualified contract, fully taxable on a traditional or SEP IRA; federal tax is withheld at federal_withholding_default_pct unless the owner elected none."
    eligibility:
      - id: withdrawal_status
        applies_to: [indexed_withdrawal_paid]
        kind: state
        condition: "A partial withdrawal is paid only while the contract status is active or income_phase."
        evidence_fields: [indexed_holdings.status, indexed_holdings.indexed_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[indexed_holdings.indexed_contract_id]]
          action_bindings: {indexed_holdings.indexed_contract_id: indexed_contract_id}
        state_contract:
          field: indexed_holdings.status
          allowed: [active, income_phase]
      - id: signed_withdrawal_request
        applies_to: [indexed_withdrawal_paid]
        kind: authorization
        condition: "A partial withdrawal is paid only on a withdrawal request signed by the owner and approved."
        evidence_fields: [indexed_service_requests.request_type, indexed_service_requests.request_status, indexed_service_requests.signed_date, indexed_service_requests.indexed_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[indexed_service_requests.indexed_request_id]]
          action_bindings: {indexed_service_requests.indexed_request_id: indexed_request_id}
    params:
      surrender_charge_pct: "=surrender_charge_ladder"
      bonus_vested_pct: "=bonus_vesting_ladder"
      min_withdrawal_amount: "=min_withdrawal_amount"
      min_remaining_contract_value: "=min_remaining_contract_value"
      rmd_surrender_charge_waiver: "=rmd_surrender_charge_waiver"
      glwb_rmd_not_excess: "=glwb_rmd_not_excess"
      federal_withholding_default_pct: "=federal_withholding_default_pct"
      per_tier:
        Ashgrove IndexEdge 5: {free_withdrawal_pct: "=free_withdrawal_pct", free_withdrawal_first_contract_year: "=free_withdrawal_first_contract_year", surrender_charge_years: "=surrender_charge_years"}
        Ashgrove IndexEdge 7: {free_withdrawal_pct: "=free_withdrawal_pct", free_withdrawal_first_contract_year: "=free_withdrawal_first_contract_year", surrender_charge_years: "=surrender_charge_years"}
        Ashgrove IndexEdge 10: {free_withdrawal_pct: "=free_withdrawal_pct", free_withdrawal_first_contract_year: "=free_withdrawal_first_contract_year", surrender_charge_years: "=surrender_charge_years"}
        Ashgrove IndexEdge 10 Bonus: {free_withdrawal_pct: "=free_withdrawal_pct", free_withdrawal_first_contract_year: "=free_withdrawal_first_contract_year", surrender_charge_years: "=surrender_charge_years"}
        Ashgrove IncomeShield 7: {free_withdrawal_pct: "=free_withdrawal_pct", free_withdrawal_first_contract_year: "=free_withdrawal_first_contract_year", surrender_charge_years: "=surrender_charge_years"}
        Ashgrove IncomeShield 10: {free_withdrawal_pct: "=free_withdrawal_pct", free_withdrawal_first_contract_year: "=free_withdrawal_first_contract_year", surrender_charge_years: "=surrender_charge_years"}
    measures: [indexed_msr_anniversary_value, indexed_msr_withdrawals_contract_year]
    formula:
      free_amount_remaining: max(0, round(free_withdrawal_pct * indexed_msr_anniversary_value, 2) - indexed_msr_withdrawals_contract_year)
      excess_amount: max(0, amount - free_amount_remaining)
      surrender_charge: round(excess_amount * surrender_charge_pct, 2)
      benefit_base_reduction: round(benefit_base * excess_amount / contract_value, 2)
  - id: indexed_lifetime_withdrawal_benefit
    subject: [indexed_lifetime_income_elected, indexed_value_exhausted, indexed_guaranteed_payment_paid, indexed_rider_fee_deducted, indexed_benefit_base_credited, indexed_withdrawal_paid]
    rule: "On tiers where glwb_included is true, the benefit base starts at the first-year premiums plus the benefit base bonus and, on each of the first glwb_rollup_years anniversaries before lifetime withdrawals start, is credited a simple roll-up of glwb_rollup_rate times premiums plus the benefit base bonus, less proportional reductions already taken. The rider fee, glwb_rider_fee_pct of the benefit base on the anniversary, rounded to the cent, is deducted from the contract value on each anniversary and never exceeds glwb_rider_fee_max_pct. Lifetime withdrawals are started only on a lifetime income election signed by the owner and approved. They may start once the covered person, or the younger of two covered spouses, has reached glwb_min_income_age; the lifetime withdrawal percentage is taken from glwb_withdrawal_pct_ladder by that age on the start date, less glwb_joint_reduction_pct for joint income, and is locked for life. The annual lifetime withdrawal amount is the benefit base on the start date times that percentage, rounded to the cent, payable at the elected frequency. Withdrawals within it are free of surrender charge. When the contract value reaches zero through covered withdrawals and fees, payments continue for life from Ashgrove's guarantee and no further fee is charged; an excess withdrawal that reduces the contract value to zero ends the rider without further payments."
    eligibility:
      - id: signed_income_election
        applies_to: [indexed_lifetime_income_elected]
        kind: authorization
        condition: "Lifetime withdrawals are started only on a lifetime income election signed by the owner and approved."
        evidence_fields: [indexed_service_requests.request_type, indexed_service_requests.request_status, indexed_service_requests.signed_date, indexed_service_requests.indexed_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[indexed_service_requests.indexed_request_id]]
          action_bindings: {indexed_service_requests.indexed_request_id: indexed_request_id}
    params:
      lifetime_withdrawal_pct: "=glwb_withdrawal_pct_ladder"
      per_tier:
        Ashgrove IndexEdge 5: {glwb_included: "=glwb_included", glwb_rider_fee_pct: "=glwb_rider_fee_pct", glwb_rider_fee_max_pct: "=glwb_rider_fee_max_pct", glwb_rollup_rate: "=glwb_rollup_rate", glwb_rollup_years: "=glwb_rollup_years", glwb_min_income_age: "=glwb_min_income_age", glwb_joint_reduction_pct: "=glwb_joint_reduction_pct"}
        Ashgrove IndexEdge 7: {glwb_included: "=glwb_included", glwb_rider_fee_pct: "=glwb_rider_fee_pct", glwb_rider_fee_max_pct: "=glwb_rider_fee_max_pct", glwb_rollup_rate: "=glwb_rollup_rate", glwb_rollup_years: "=glwb_rollup_years", glwb_min_income_age: "=glwb_min_income_age", glwb_joint_reduction_pct: "=glwb_joint_reduction_pct"}
        Ashgrove IndexEdge 10: {glwb_included: "=glwb_included", glwb_rider_fee_pct: "=glwb_rider_fee_pct", glwb_rider_fee_max_pct: "=glwb_rider_fee_max_pct", glwb_rollup_rate: "=glwb_rollup_rate", glwb_rollup_years: "=glwb_rollup_years", glwb_min_income_age: "=glwb_min_income_age", glwb_joint_reduction_pct: "=glwb_joint_reduction_pct"}
        Ashgrove IndexEdge 10 Bonus: {glwb_included: "=glwb_included", glwb_rider_fee_pct: "=glwb_rider_fee_pct", glwb_rider_fee_max_pct: "=glwb_rider_fee_max_pct", glwb_rollup_rate: "=glwb_rollup_rate", glwb_rollup_years: "=glwb_rollup_years", glwb_min_income_age: "=glwb_min_income_age", glwb_joint_reduction_pct: "=glwb_joint_reduction_pct"}
        Ashgrove IncomeShield 7: {glwb_included: "=glwb_included", glwb_rider_fee_pct: "=glwb_rider_fee_pct", glwb_rider_fee_max_pct: "=glwb_rider_fee_max_pct", glwb_rollup_rate: "=glwb_rollup_rate", glwb_rollup_years: "=glwb_rollup_years", glwb_min_income_age: "=glwb_min_income_age", glwb_joint_reduction_pct: "=glwb_joint_reduction_pct"}
        Ashgrove IncomeShield 10: {glwb_included: "=glwb_included", glwb_rider_fee_pct: "=glwb_rider_fee_pct", glwb_rider_fee_max_pct: "=glwb_rider_fee_max_pct", glwb_rollup_rate: "=glwb_rollup_rate", glwb_rollup_years: "=glwb_rollup_years", glwb_min_income_age: "=glwb_min_income_age", glwb_joint_reduction_pct: "=glwb_joint_reduction_pct"}
    measures: [indexed_msr_first_year_premiums]
    formula:
      rollup_credit: round(glwb_rollup_rate * (indexed_msr_first_year_premiums * (1 + glwb_premium_bonus_pct)), 2)
      rider_fee: round(benefit_base * glwb_rider_fee_pct, 2)
      annual_lifetime_withdrawal_amount: round(benefit_base * (lifetime_withdrawal_pct - (glwb_joint_reduction_pct if joint_life_income else 0)), 2)
  - id: indexed_sc_waivers
