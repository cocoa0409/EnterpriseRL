        Ashgrove IndexEdge 10: {nursing_home_waiver_available: "=nursing_home_waiver_available", nursing_home_min_days: "=nursing_home_min_days", terminal_illness_waiver_available: "=terminal_illness_waiver_available", terminal_illness_life_expectancy_months: "=terminal_illness_life_expectancy_months", waiver_first_contract_year: "=waiver_first_contract_year"}
