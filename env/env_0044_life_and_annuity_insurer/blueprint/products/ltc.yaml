# Asset-Based Long-Term Care (Life/LTC Hybrid) — product and event policy charter of Ashgrove Mutual Life Insurance Company.
category: ltc
display_name: Asset-Based Long-Term Care Life Insurance

binding:
  holding_table: ltc_holdings
  event_tables: [ltc_transactions]
  intake_tables: [ltc_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_outstanding: premium_outstanding
    ltc_benefit_pool_balance: ltc_benefit_pool

lifecycle:
  states: [applied, in_force, grace_period, paid_up, lapsed, shortened_benefit, claim_active, benefits_exhausted, surrendered, death_claim_pending, claim_paid, claim_denied, cancelled_free_look, declined]
  transitions:
    - {from: applied, to: in_force, by: system, means: "A ten-pay policy is delivered with the first premium paid and coverage begins."}
    - {from: applied, to: paid_up, by: system, means: "A single premium policy is delivered with the premium paid and is paid up from issue."}
    - {from: applied, to: declined, by: system, means: "Underwriting declines the application or it is withdrawn."}
    - {from: in_force, to: grace_period, by: system, means: "A ten-pay installment is unpaid on its due date and the grace period begins."}
    - {from: grace_period, to: in_force, by: agent, means: "The overdue premium is paid in time."}
    - {from: grace_period, to: lapsed, by: system, means: "The grace period and the third-party notice period end unpaid before the shortened benefit period is earned."}
    - {from: grace_period, to: shortened_benefit, by: system, means: "The grace period and notice period end unpaid after the shortened benefit period is earned; long-term care coverage continues limited to premiums paid."}
    - {from: lapsed, to: in_force, by: agent, means: "A policy lapsed because of the insured's cognitive impairment or loss of functional capacity is reinstated under the unintentional lapse provision."}
    - {from: in_force, to: paid_up, by: system, means: "The tenth annual premium (or its monthly equivalent) is paid and no further premium is due."}
    - {from: in_force, to: claim_active, by: agent, means: "A long-term care claim is approved and the insured becomes eligible for benefits."}
    - {from: paid_up, to: claim_active, by: agent, means: "A long-term care claim is approved on a paid-up policy."}
    - {from: shortened_benefit, to: claim_active, by: agent, means: "A long-term care claim is approved under the shortened benefit period."}
    - {from: claim_active, to: in_force, by: agent, means: "The insured recovers, benefits end and ten-pay premiums resume."}
    - {from: claim_active, to: paid_up, by: agent, means: "The insured recovers and benefits end on a policy with no premium remaining."}
    - {from: claim_active, to: benefits_exhausted, by: system, means: "The long-term care benefit pool is used up; only the residual death benefit remains."}
    - {from: in_force, to: surrendered, by: user, means: "The owner surrenders the policy for its return of premium value."}
    - {from: grace_period, to: surrendered, by: user, means: "The owner surrenders the policy during the grace period."}
    - {from: paid_up, to: surrendered, by: user, means: "The owner surrenders a paid-up policy."}
    - {from: in_force, to: death_claim_pending, by: agent, means: "Notice of the insured's death is registered."}
    - {from: grace_period, to: death_claim_pending, by: agent, means: "Notice of death is registered for a death during the grace period."}
    - {from: paid_up, to: death_claim_pending, by: agent, means: "Notice of death is registered on a paid-up policy."}
    - {from: claim_active, to: death_claim_pending, by: agent, means: "Notice of death is registered while benefits were being paid."}
    - {from: benefits_exhausted, to: death_claim_pending, by: agent, means: "Notice of death is registered after the benefit pool was used up."}
    - {from: shortened_benefit, to: death_claim_pending, by: agent, means: "Notice of death is registered on a shortened benefit policy."}
    - {from: death_claim_pending, to: claim_paid, by: agent, means: "The death claim is approved and the remaining death benefit disbursed."}
    - {from: death_claim_pending, to: claim_denied, by: system, means: "The claim is denied by rescission or the suicide exclusion."}
    - {from: in_force, to: cancelled_free_look, by: user, means: "The owner returns a ten-pay policy within the free-look period."}
    - {from: paid_up, to: cancelled_free_look, by: user, means: "The owner returns a single premium policy within the free-look period."}

accounts:
  - key: premium_outstanding
    unit: USD
    meaning: "Ten-pay premium billed and not yet paid or waived; negative when unapplied money is held."
  - key: ltc_benefit_pool
    unit: USD
    meaning: "Long-term care benefits still available: the acceleration pool plus any continuation pool, increased by inflation protection and reduced by every benefit paid."

parameter_schema:
  acceleration_period_months: "integer months — minimum number of months over which the specified amount is paid out as long-term care benefits; the monthly maximum is the specified amount divided by it"
  continuation_period_months: "integer months, or unlimited — further months of benefits at the monthly maximum after the specified amount is exhausted"
  min_issue_age: "integer years — lowest issue age"
  max_issue_age: "integer years — highest issue age"
  min_specified_amount: "USD — smallest specified amount"
  max_specified_amount: "USD — largest specified amount on one policy"
  premium_options: "list — premium payment options offered"
  ten_pay_years: "integer — number of policy years premiums are payable under the ten-pay option"
  modal_factor_annual: "decimal — annual premium multiplier for annual mode"
  modal_factor_monthly_eft: "decimal — annual premium multiplier for each monthly EFT draft"
  premium_shortage_tolerance: "USD — shortfall up to which a remittance is applied as full payment"
  overpayment_refund_threshold: "USD — unapplied money above this is refunded"
  eft_draft_day_max: "integer — latest EFT draft day"
  inflation_options: "list — inflation protection options offered at issue"
  inflation_3_rate: "decimal — annual compound increase under the 3 percent option"
  inflation_5_rate: "decimal — annual compound increase under the 5 percent option"
  inflation_5_max_issue_age: "integer years — highest issue age for the 5 percent option"
  elimination_period_days: "integer days — days of chronic illness that must pass before benefits are payable, satisfied once per lifetime"
  elimination_accumulation_window_days: "integer days — window within which elimination days may accumulate when not consecutive"
  adl_count_required: "integer — number of activities of daily living the insured must be unable to perform"
  adl_list: "list — the activities of daily living recognized"
  adl_expected_duration_days: "integer days — period the loss of capacity must be expected to last"
  certification_lookback_months: "integer months — a practitioner certification must be dated within this period before the claim decision"
  recertification_months: "integer months — interval at which chronic illness must be recertified while benefits continue"
  home_care_benefit_pct: "decimal — share of the monthly maximum payable for formal home care"
  informal_care_benefit_pct: "decimal — share of the monthly maximum payable for care by an informal caregiver who is not a family member living with the insured"
  international_benefit_pct: "decimal — share of the monthly maximum payable for care received outside the United States"
  international_benefit_max_months: "integer months — lifetime limit on months of international benefits"
  bed_reservation_days_per_year: "integer days — days per calendar year a facility bed is paid while the insured is hospitalized"
  respite_care_days_per_year: "integer days — days per calendar year of respite care paid at the facility rate"
  proof_of_loss_days: "integer calendar days — period after the end of a month of care within which expenses should be submitted"
  proof_of_loss_max_days: "integer calendar days — latest submission after the end of a month of care, absent legal incapacity"
  residual_death_benefit_pct: "decimal — share of the specified amount always payable at death regardless of benefits paid"
  residual_death_benefit_max: "USD — cap on the residual death benefit; the lesser of the two applies"
  rop_vesting_ladder: "list of decimals — return of premium surrender value as a share of premiums paid, by policy year 1, 2, ...; the last entry applies thereafter"
  premium_waiver_on_claim: "boolean — whether ten-pay premiums falling due while benefits are being paid are waived"
  grace_period_days: "integer calendar days — grace period from the unpaid installment's due date"
  third_party_notice_days: "integer calendar days — period after the lapse notice is mailed to the owner and the designated third party before the policy may lapse"
  shortened_benefit_min_years: "integer policy years — premiums paid for at least this many years earn the shortened benefit period on lapse"
  unintentional_lapse_reinstatement_months: "integer calendar months — period after lapse within which a policy lapsed because of cognitive impairment or loss of functional capacity may be reinstated"
  free_look_days: "integer calendar days — free-look period from delivery"
  contestability_period_years: "integer years — contestable period from issue or reinstatement"
  suicide_exclusion_years: "integer years — suicide exclusion period from issue"
  death_claim_interest_rate: "decimal annual rate — simple interest on death proceeds from death to disbursement"
  beneficiary_access_account_min: "USD — smallest payee share that may be settled into an Ashgrove Beneficiary Access Account"
  beneficiary_max_primary: "integer — maximum number of primary beneficiaries"
  beneficiary_min_share_pct: "integer percent — smallest beneficiary share"
  minor_beneficiary_age: "integer years — age below which a share is paid only to a guardian or UTMA custodian"
  policy_loans_available: "boolean — whether policy loans are offered"
  benefit_payment_basis: "enum reimbursement|indemnity — whether benefits reimburse expenses incurred or pay the monthly amount regardless of expense"

