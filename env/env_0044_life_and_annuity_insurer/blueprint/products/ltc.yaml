events:
  # ---- contract changes on ltc_holdings ----
  - type: ltc_policy_issued
    target: ltc_holdings
    mutation: create
    meaning: "A CareAssure policy is issued and recorded as applied until placed in force."
    grain: "one row per policy"
    fields:
      customer_id: "the owner"
      policy_number: "the policy number"
      variant_name: "the official tier name"
      insured_name: "the insured"
      insured_date_of_birth: "the insured's date of birth"
      insured_is_owner: "whether the owner is the insured"
      issue_state: "state of issue"
      issue_date: "the policy date"
      issue_age: "insured's age last birthday on the issue date"
      underwriting_class: "the class approved"
      specified_amount: "the specified amount of life and acceleration coverage"
      monthly_max_benefit: "the specified amount divided by the acceleration period months"
      inflation_option: "inflation protection chosen"
      premium_option: "single or ten_pay"
      modal_premium: "the single premium, or the ten-pay installment"
      premium_mode: "the premium mode"
      third_party_designee_name: "person designated to receive lapse notices, as named by the owner; empty when the owner waived designation in writing"
    triggers:
      - event: ltc:ltc_premium_billed
        map: {premium_due_date: issue_date, amount: modal_premium}
      - event: ltc:ltc_pool_established
        map: {transaction_date: issue_date}
      - event: ltc:ltc_beneficiary_designated
        map: {designation_effective_date: issue_date}
  - type: ltc_policy_placed_in_force
    target: ltc_holdings
    mutation: {transition: {from: applied, to: in_force}}
    meaning: "A ten-pay policy is delivered with the first installment paid."
    grain: "one row per transaction"
    fields:
      status: "becomes in_force"
      policy_delivery_date: "date the owner received the policy"
      paid_to_date: "date through which the first installment pays"
    triggers: []
  - type: ltc_single_premium_placed
    target: ltc_holdings
    mutation: {transition: {from: applied, to: paid_up}}
    meaning: "A single premium policy is delivered with the premium paid."
    grain: "one row per transaction"
    fields:
      status: "becomes paid_up"
      policy_delivery_date: "date the owner received the policy"
    triggers: []
  - type: ltc_application_declined
    target: ltc_holdings
    mutation: {transition: {from: applied, to: declined}}
    meaning: "The application is declined or withdrawn."
    grain: "one row per transaction"
    fields:
      status: "becomes declined"
      termination_date: "date of the decline"
    triggers:
      - event: ltc:ltc_premium_refunded
        map: {refund_reason: application_declined, transaction_date: termination_date}
  - type: ltc_grace_period_started
    target: ltc_holdings
    mutation: {transition: {from: in_force, to: grace_period}}
    meaning: "A ten-pay installment is unpaid on its due date."
    grain: "one row per transaction"
    fields:
      status: "becomes grace_period"
    triggers: []
  - type: ltc_grace_period_cured
    target: ltc_holdings
    mutation: {transition: {from: grace_period, to: in_force}}
    meaning: "The overdue premium is paid in time."
    grain: "one row per transaction"
    fields:
      status: "becomes in_force"
    triggers: []
  - type: ltc_policy_lapsed
    target: ltc_holdings
    mutation: {transition: [{from: grace_period, to: lapsed}, {from: grace_period, to: shortened_benefit}]}
    meaning: "The grace and notice periods end unpaid; coverage ends, or continues under the shortened benefit period when earned."
    grain: "one row per transaction"
    fields:
      status: "becomes lapsed or shortened_benefit"
      lapse_date: "the day after the later of the last day of grace and the end of the third-party notice period"
    triggers: []
  - type: ltc_policy_reinstated
    target: ltc_holdings
    mutation: {transition: {from: lapsed, to: in_force}}
    meaning: "A policy lapsed because of the insured's cognitive impairment or loss of functional capacity is reinstated."
    grain: "one row per transaction"
    fields:
      status: "becomes in_force"
      reinstatement_date: "date coverage is restored"
      paid_to_date: "the paid-to date after past-due premiums are paid"
    triggers: []
  - type: ltc_premiums_completed
    target: ltc_holdings
    mutation: {transition: {from: in_force, to: paid_up}}
    meaning: "The last ten-pay installment is paid."
    grain: "one row per transaction"
    fields:
      status: "becomes paid_up"
    triggers: []
  - type: ltc_claim_approved
    target: ltc_holdings
    mutation: {transition: [{from: in_force, to: claim_active}, {from: paid_up, to: claim_active}, {from: shortened_benefit, to: claim_active}]}
    meaning: "The insured is certified chronically ill, the claim is approved and benefits become payable once the elimination period is satisfied."
    grain: "one row per transaction"
    fields:
      status: "becomes claim_active"
      benefit_eligibility_date: "first day of certified chronic illness"
      elimination_satisfied_date: "the day the elimination period is satisfied"
      last_certification_date: "date of the practitioner certification"
    triggers: []
  - type: ltc_claim_closed_recovery
    target: ltc_holdings
    mutation: {transition: [{from: claim_active, to: in_force}, {from: claim_active, to: paid_up}]}
    meaning: "The insured no longer meets the chronic illness definition, or recertification lapses, and benefits stop."
    grain: "one row per transaction"
    fields:
      status: "becomes in_force where ten-pay premiums remain, otherwise paid_up"
      paid_to_date: "the next installment due date when premiums resume"
    triggers: []
  - type: ltc_benefits_exhausted
    target: ltc_holdings
    mutation: {transition: {from: claim_active, to: benefits_exhausted}}
    meaning: "The benefit pool reaches zero; only the residual death benefit remains."
    grain: "one row per transaction"
    fields:
      status: "becomes benefits_exhausted"
    triggers: []
  - type: ltc_policy_surrendered
    target: ltc_holdings
    mutation: {transition: [{from: in_force, to: surrendered}, {from: grace_period, to: surrendered}, {from: paid_up, to: surrendered}]}
    meaning: "The owner surrenders the policy for its return of premium value."
    grain: "one row per transaction"
    fields:
      status: "becomes surrendered"
      termination_date: "date the signed surrender request was received"
    triggers:
      - event: ltc:ltc_surrender_value_paid
        map: {transaction_date: termination_date}
  - type: ltc_death_claim_registered
    target: ltc_holdings
    mutation: {transition: [{from: in_force, to: death_claim_pending}, {from: grace_period, to: death_claim_pending}, {from: paid_up, to: death_claim_pending}, {from: claim_active, to: death_claim_pending}, {from: benefits_exhausted, to: death_claim_pending}, {from: shortened_benefit, to: death_claim_pending}]}
    meaning: "Notice of the insured's death is registered."
    grain: "one row per transaction"
    fields:
      status: "becomes death_claim_pending"
    triggers: []
  - type: ltc_death_claim_paid
    target: ltc_holdings
    mutation: {transition: {from: death_claim_pending, to: claim_paid}}
    meaning: "The death benefit remaining is disbursed."
    grain: "one row per transaction"
    fields:
      status: "becomes claim_paid"
      termination_date: "disbursement date"
    triggers:
      - event: ltc:ltc_death_benefit_disbursed
        map: {transaction_date: termination_date}
  - type: ltc_death_claim_denied
    target: ltc_holdings
    mutation: {transition: {from: death_claim_pending, to: claim_denied}}
    meaning: "The claim is denied by rescission or the suicide exclusion."
    grain: "one row per transaction"
    fields:
      status: "becomes claim_denied"
      termination_date: "decision date"
    triggers:
      - event: ltc:ltc_premium_refunded
        map: {refund_reason: claim_denied_premium_refund, transaction_date: termination_date}
  - type: ltc_free_look_cancelled
    target: ltc_holdings
    mutation: {transition: [{from: in_force, to: cancelled_free_look}, {from: paid_up, to: cancelled_free_look}]}
    meaning: "The owner returns the policy within the free-look period."
    grain: "one row per transaction"
    fields:
      status: "becomes cancelled_free_look"
      termination_date: "date the returned policy was received"
    triggers:
      - event: ltc:ltc_premium_refunded
        map: {refund_reason: free_look, transaction_date: termination_date}
  - type: ltc_paid_to_date_updated
    target: ltc_holdings
    mutation: update
    meaning: "The paid-to date moves when an installment is paid or waived."
    grain: "one row per transaction"
    fields:
      paid_to_date: "date through which premiums are paid"
    triggers: []
  - type: ltc_benefit_amounts_increased
    target: ltc_holdings
    mutation: update
    meaning: "On a policy anniversary inflation protection increases the monthly maximum benefit."
    grain: "one row per transaction"
    fields:
      monthly_max_benefit: "the increased monthly maximum"
    triggers: []
  - type: ltc_third_party_designee_changed
    target: ltc_holdings
    mutation: update
    meaning: "The owner names or changes the person who receives lapse notices."
    grain: "one row per transaction"
    fields:
      third_party_designee_name: "the designee as named by the owner"
    triggers: []
  # ---- ledger rows on ltc_transactions ----
  - type: ltc_premium_billed
    target: ltc_transactions
    meaning: "A premium falls due and is billed."
    grain: "one row per installment due date"
    distinguish_by: [premium_due_date]
    fields:
      transaction_date: "billing date"
      amount: "premium billed"
      premium_due_date: "due date"
    account: premium_outstanding
    direction: in
    triggers: []
  - type: ltc_premium_paid
    target: ltc_transactions
    meaning: "A remittance is applied to a billed premium."
    grain: "one row per remittance per installment"
    distinguish_by: [premium_due_date, transaction_date]
    fields:
      transaction_date: "date received"
      amount: "amount applied"
      premium_due_date: "installment paid"
      payment_method: "how it was paid"
    account: premium_outstanding
    direction: out
    triggers:
      - event: ltc:ltc_paid_to_date_updated
        map: {}
  - type: ltc_premium_waived
    target: ltc_transactions
    meaning: "A ten-pay installment falling due while benefits are being paid is waived."
    grain: "one row per installment waived"
    distinguish_by: [premium_due_date]
    fields:
      transaction_date: "date applied"
      amount: "installment waived"
      premium_due_date: "installment waived"
      ltc_request_id: "the approved long-term care claim"
    account: premium_outstanding
    direction: out
    triggers:
      - event: ltc:ltc_paid_to_date_updated
        map: {}
  - type: ltc_premium_refunded
    target: ltc_transactions
    meaning: "Premium money is refunded."
    grain: "one row per refund"
    distinguish_by: [refund_reason, transaction_date]
    fields:
      transaction_date: "refund date"
      amount: "amount refunded"
      refund_reason: "why"
    account: premium_outstanding
    direction: in
    triggers: []
  - type: ltc_pool_established
    target: ltc_transactions
    meaning: "The long-term care acceleration pool, equal to the specified amount, is opened at issue."
    grain: "one row per policy"
    distinguish_by: [transaction_date]
    fields:
      transaction_date: "issue date"
      amount: "pool amount opened — the specified amount"
    account: ltc_benefit_pool
    direction: in
    triggers: []
  - type: ltc_inflation_increase
    target: ltc_transactions
    meaning: "Inflation protection increases the remaining benefit pool on a policy anniversary."
    grain: "one row per anniversary"
    distinguish_by: [anniversary_date]
    fields:
      transaction_date: "the anniversary"
      amount: "increase to the pool"
      anniversary_date: "the anniversary"
      inflation_rate: "rate applied"
    account: ltc_benefit_pool
    direction: in
    triggers:
      - event: ltc:ltc_benefit_amounts_increased
        map: {}
  - type: ltc_benefit_paid
    target: ltc_transactions
    meaning: "A month of long-term care benefits is paid on submitted expenses."
    grain: "one row per month of care per care setting"
    distinguish_by: [service_month, care_setting]
    fields:
      transaction_date: "date paid"
      amount: "benefit paid"
      service_month: "first day of the month of care"
      care_setting: "where and by whom care was given"
      expenses_submitted: "qualified expenses submitted for the month and setting"
      benefit_pct_applied: "share of the monthly maximum applicable to the setting"
      ltc_request_id: "the approved long-term care claim"
      payout_method: "how it was paid"
    account: ltc_benefit_pool
    direction: out
    triggers: []
  - type: ltc_continuation_benefit_paid
    target: ltc_transactions
    meaning: "A month of long-term care benefits is paid under the continuation of benefits rider after the acceleration pool is used up; it no longer reduces the death benefit."
    grain: "one row per month of care per care setting"
    distinguish_by: [service_month, care_setting]
    fields:
      transaction_date: "date paid"
      amount: "benefit paid"
      service_month: "first day of the month of care"
      care_setting: "where and by whom care was given"
      expenses_submitted: "qualified expenses submitted for the month and setting"
      benefit_pct_applied: "share of the monthly maximum applicable to the setting"
      ltc_request_id: "the approved long-term care claim"
      payout_method: "how it was paid"
    triggers: []
  - type: ltc_surrender_value_paid
    target: ltc_transactions
    meaning: "The return of premium value is paid on surrender."
    grain: "one row per surrender"
    distinguish_by: [ltc_request_id]
    fields:
      transaction_date: "date paid"
      amount: "surrender value paid"
      rop_vesting_pct: "return of premium share applied"
      ltc_request_id: "the signed surrender request"
      payout_method: "how it was paid"
    triggers: []
  - type: ltc_death_benefit_disbursed
    target: ltc_transactions
    meaning: "One payee's share of the remaining death benefit is paid."
    grain: "one row per payee per death claim"
    distinguish_by: [ltc_request_id, payee_name]
    fields:
      transaction_date: "date paid"
      amount: "net amount paid including interest"
      interest_amount: "death-claim interest included"
      payee_name: "payee as named in the governing designation"
      payout_method: "check, direct deposit or Beneficiary Access Account"
      ltc_request_id: "the death claim"
    triggers: []
  - type: ltc_beneficiary_designated
    target: ltc_transactions
    meaning: "One beneficiary line of a designation is recorded; a later designation replaces the earlier one entirely."
    grain: "one row per beneficiary line per designation"
    distinguish_by: [designation_effective_date, beneficiary_class, beneficiary_name]
    fields:
      transaction_date: "date recorded"
      designation_effective_date: "date the owner signed the designation"
      beneficiary_name: "beneficiary as named"
      beneficiary_relationship: "relationship to the insured"
      beneficiary_class: "primary or contingent"
      share_percent: "whole-percent share within the class"
      designation_type: "revocable or irrevocable"
      ltc_request_id: "the signed change request; empty for the original designation"
    triggers: []

measures:
  - id: ltc_msr_benefits_paid
    window: "from the issue date to the evaluation date"
    measure: "sum of amount over ltc_benefit_paid rows on the policy"
  - id: ltc_msr_premiums_paid
    window: "from the issue date to the evaluation date"
    measure: "sum of amount over ltc_premium_paid rows on the policy, less ltc_premium_refunded rows with refund_reason overpayment"
  - id: ltc_msr_continuation_months
    window: "from the issue date to the evaluation date"
    measure: "count of distinct service_month values over ltc_continuation_benefit_paid rows on the policy"
  - id: ltc_msr_international_months
    window: "from the issue date to the evaluation date"
    measure: "count of distinct service_month values over ltc_benefit_paid and ltc_continuation_benefit_paid rows on the policy with care_setting international"
  - id: ltc_msr_specified_amount_on_insured
    window: "point in time at the evaluation date"
    measure: "sum of specified_amount over ltc_holdings on the same insured (insured_name and insured_date_of_birth) whose status is not declined, lapsed, surrendered, claim_paid, claim_denied or cancelled_free_look"

policies:
  - id: ltc_agg_multi_holding
    subject: [ltc_policy_issued]
    rule: "An owner may hold more than one CareAssure policy, on the owner's own life or a spouse's; the count is not capped, but the specified amount on one insured is governed by ltc_agg_insured_limit."
    eligibility: []
    params:
      max_per_customer: null
  - id: ltc_agg_insured_limit
    subject: [ltc_policy_issued, ltc_benefit_paid]
    rule: "CareAssure coverage is aggregated per insured, identified by insured name and date of birth. A new policy is issued only if ltc_msr_specified_amount_on_insured plus the new specified amount does not exceed aggregate_specified_amount_limit. When an insured is covered by more than one CareAssure policy, the monthly benefits paid for the same month across all of them may not exceed the qualified expenses incurred in that month; each policy pays up to its own monthly maximum, the earlier-issued policy first."
    eligibility: []
    params:
      aggregate_specified_amount_limit: 1000000
    measures: [ltc_msr_specified_amount_on_insured]
  - id: ltc_issue_and_premium
    subject: [ltc_policy_issued, ltc_policy_placed_in_force, ltc_single_premium_placed, ltc_application_declined, ltc_pool_established]
    rule: "A tier is issued only within its issue ages and between min_specified_amount and max_specified_amount, on one of premium_options. The monthly maximum benefit at issue is the specified amount divided by acceleration_period_months, rounded to the cent, and the acceleration pool opened at issue equals the specified amount. The 5 percent inflation option is available only at issue ages up to inflation_5_max_issue_age; inflation options are chosen at issue and cannot be added later. The owner names a third party to receive lapse notices or waives the designation in writing at application. A ten-pay policy is placed in force when delivered with the first installment paid; a single premium policy is placed paid up when delivered with the premium paid. Policy loans are not offered when policy_loans_available is false. A declined or withdrawn application has any premium refunded in full."
    eligibility: []
    params:
      premium_options: "=premium_options"
      policy_loans_available: "=policy_loans_available"
      per_tier:
        Ashgrove CareAssure 2-Year: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_specified_amount: "=min_specified_amount", max_specified_amount: "=max_specified_amount", acceleration_period_months: "=acceleration_period_months", inflation_5_max_issue_age: "=inflation_5_max_issue_age"}
        Ashgrove CareAssure 3-Year: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_specified_amount: "=min_specified_amount", max_specified_amount: "=max_specified_amount", acceleration_period_months: "=acceleration_period_months", inflation_5_max_issue_age: "=inflation_5_max_issue_age"}
        Ashgrove CareAssure 4-Year: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_specified_amount: "=min_specified_amount", max_specified_amount: "=max_specified_amount", acceleration_period_months: "=acceleration_period_months", inflation_5_max_issue_age: "=inflation_5_max_issue_age"}
        Ashgrove CareAssure 5-Year: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_specified_amount: "=min_specified_amount", max_specified_amount: "=max_specified_amount", acceleration_period_months: "=acceleration_period_months", inflation_5_max_issue_age: "=inflation_5_max_issue_age"}
        Ashgrove CareAssure 6-Year: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_specified_amount: "=min_specified_amount", max_specified_amount: "=max_specified_amount", acceleration_period_months: "=acceleration_period_months", inflation_5_max_issue_age: "=inflation_5_max_issue_age"}
        Ashgrove CareAssure Lifetime: {min_issue_age: "=min_issue_age", max_issue_age: "=max_issue_age", min_specified_amount: "=min_specified_amount", max_specified_amount: "=max_specified_amount", acceleration_period_months: "=acceleration_period_months", inflation_5_max_issue_age: "=inflation_5_max_issue_age"}
    formula:
      monthly_max_benefit: round(specified_amount / acceleration_period_months, 2)
  - id: ltc_premium_billing_and_lapse
    subject: [ltc_premium_billed, ltc_premium_paid, ltc_premium_refunded, ltc_paid_to_date_updated, ltc_grace_period_started, ltc_grace_period_cured, ltc_policy_lapsed, ltc_premiums_completed, ltc_third_party_designee_changed]
    rule: "Ten-pay premiums are billed for ten_pay_years policy years in annual mode (modal_factor_annual) or monthly EFT (modal_factor_monthly_eft) on a draft day from 1 to eft_draft_day_max. A remittance is applied as premium only while the policy status is applied, in_force or grace_period. A remittance short by up to premium_shortage_tolerance is applied as full payment, and unapplied money above overpayment_refund_threshold is refunded. When an installment is unpaid on its due date the policy enters a grace period of grace_period_days. The overdue premium must be received no later than the last day of grace, which is the unpaid installment's due date plus grace_period_days. The last day of grace is found by adding the grace period length in calendar days to the due date; a remittance received on that day is in time. The policy cannot lapse until third_party_notice_days after a lapse notice has been mailed to the owner and to the designated third party; the lapse date is the day after the later of the last day of grace and the end of that notice period. On lapse, a policy whose premiums were paid for at least shortened_benefit_min_years policy years continues under the shortened benefit period — long-term care benefits limited to total premiums paid less benefits already paid, with no death benefit beyond the residual death benefit — and otherwise lapses without value. When the last ten-pay installment is paid the policy becomes paid up. The owner may change the third-party designee at any time."
    eligibility:
      - id: payable_status
        applies_to: [ltc_premium_paid]
        kind: state
        condition: "A remittance is applied as premium only while the policy status is applied, in_force or grace_period."
        evidence_fields: [ltc_holdings.status, ltc_holdings.ltc_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_holdings.ltc_policy_id]]
          action_bindings: {ltc_holdings.ltc_policy_id: ltc_policy_id}
        state_contract:
          field: ltc_holdings.status
          allowed: [applied, in_force, grace_period]
      - id: cure_within_grace
        applies_to: [ltc_grace_period_cured]
        kind: time
        condition: "The overdue premium must be received no later than the last day of grace, which is the unpaid installment's due date plus grace_period_days."
        evidence_fields: [ltc_holdings.paid_to_date, ltc_holdings.ltc_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_holdings.ltc_policy_id]]
          action_bindings: {ltc_holdings.ltc_policy_id: ltc_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the unpaid installment's due date"
          anchor_source: ltc_holdings.paid_to_date
          relation: not_after
          duration_source: variants.grace_period_days
          unit: calendar_days
          counting_rule: "The last day of grace is found by adding the grace period length in calendar days to the due date; a remittance received on that day is in time."
          boundary: inclusive
    params:
      ten_pay_years: "=ten_pay_years"
      modal_factor_annual: "=modal_factor_annual"
      modal_factor_monthly_eft: "=modal_factor_monthly_eft"
      eft_draft_day_max: "=eft_draft_day_max"
      premium_shortage_tolerance: "=premium_shortage_tolerance"
      overpayment_refund_threshold: "=overpayment_refund_threshold"
      grace_period_days: "=grace_period_days"
      third_party_notice_days: "=third_party_notice_days"
      shortened_benefit_min_years: "=shortened_benefit_min_years"
    measures: [ltc_msr_premiums_paid]
  - id: ltc_unintentional_lapse_reinstatement
    subject: [ltc_policy_reinstated]
    rule: "A policy that lapsed because the insured was cognitively impaired or had lost functional capacity before the lapse may be reinstated without evidence of insurability. The reinstatement request must be received no later than the lapse date plus unintentional_lapse_reinstatement_months. The deadline is found by adding the number of calendar months to the lapse date, falling back to the last day of the month when that day does not exist; a request received on the deadline is in time. The policy is reinstated only on a reinstatement request whose request status is approved, which requires a practitioner's certification that the impairment existed before the lapse. All past-due premiums must be paid, without interest. A lapse for any other reason cannot be reinstated; the insured may apply for new coverage."
    eligibility:
      - id: within_reinstatement_window
        applies_to: [ltc_policy_reinstated]
        kind: time
        condition: "The reinstatement request must be received no later than the lapse date plus unintentional_lapse_reinstatement_months."
        evidence_fields: [ltc_holdings.lapse_date, ltc_service_requests.received_date, ltc_service_requests.ltc_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_service_requests.ltc_request_id]]
          action_bindings: {ltc_service_requests.ltc_request_id: ltc_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the lapse date"
          anchor_source: ltc_holdings.lapse_date
          relation: not_after
          duration_source: variants.unintentional_lapse_reinstatement_months
          unit: calendar_months
          counting_rule: "The deadline is found by adding the number of calendar months to the lapse date, falling back to the last day of the month when that day does not exist; a request received on the deadline is in time."
          boundary: inclusive
      - id: approved_request
        applies_to: [ltc_policy_reinstated]
        kind: authorization
        condition: "The policy is reinstated only on a reinstatement request whose request status is approved, which requires a practitioner's certification that the impairment existed before the lapse."
        evidence_fields: [ltc_service_requests.request_type, ltc_service_requests.request_status, ltc_service_requests.signed_date, ltc_service_requests.lapse_cause_impairment, ltc_service_requests.ltc_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_service_requests.ltc_request_id]]
          action_bindings: {ltc_service_requests.ltc_request_id: ltc_request_id}
    params:
      unintentional_lapse_reinstatement_months: "=unintentional_lapse_reinstatement_months"
  - id: ltc_benefit_eligibility
    subject: [ltc_claim_approved, ltc_claim_closed_recovery]
    rule: "The insured is eligible for benefits while chronically ill: unable to perform at least adl_count_required of the activities on adl_list without substantial assistance for a period expected to last at least adl_expected_duration_days, or requiring substantial supervision because of severe cognitive impairment. A claim is approved only on a long-term care claim whose request status is approved, supported by a licensed health care practitioner's certification dated within certification_lookback_months before the decision and a plan of care. Benefits are payable for care received after the elimination period: elimination_period_days days of chronic illness, which need not be consecutive if they fall within elimination_accumulation_window_days, satisfied once in the insured's lifetime and counted from the benefit eligibility date. Chronic illness must be recertified every recertification_months; when recertification is not received, or the insured no longer meets the definition, benefits stop and the claim closes."
    eligibility:
      - id: approved_claim
        applies_to: [ltc_claim_approved]
        kind: authorization
        condition: "A claim is approved only on a long-term care claim whose request status is approved, supported by a licensed health care practitioner's certification dated within certification_lookback_months before the decision and a plan of care."
        evidence_fields: [ltc_service_requests.request_type, ltc_service_requests.request_status, ltc_service_requests.signed_date, ltc_service_requests.certification_date, ltc_service_requests.plan_of_care_received, ltc_service_requests.ltc_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_service_requests.ltc_request_id]]
          action_bindings: {ltc_service_requests.ltc_request_id: ltc_request_id}
    params:
      adl_count_required: "=adl_count_required"
      adl_list: "=adl_list"
      adl_expected_duration_days: "=adl_expected_duration_days"
      certification_lookback_months: "=certification_lookback_months"
      elimination_period_days: "=elimination_period_days"
      elimination_accumulation_window_days: "=elimination_accumulation_window_days"
      recertification_months: "=recertification_months"
  - id: ltc_evt_benefit_payment
    subject: [ltc_benefit_paid, ltc_continuation_benefit_paid, ltc_benefits_exhausted]
    rule: "Benefits are paid only while the policy status is claim_active. Benefits reimburse qualified long-term care expenses incurred in a calendar month, up to the monthly maximum benefit times the share for the care setting: 1.00 for a nursing facility, assisted living facility or adult day care, home_care_benefit_pct for formal home care, informal_care_benefit_pct for an informal caregiver who is not a family member living with the insured, and international_benefit_pct for care outside the United States, the last for no more than international_benefit_max_months months in the insured's lifetime (ltc_msr_international_months). Bed reservation is paid for up to bed_reservation_days_per_year days and respite care for up to respite_care_days_per_year days per calendar year. Expenses should be submitted within proof_of_loss_days after the month of care and are not paid when submitted more than proof_of_loss_max_days after it unless the claimant lacked legal capacity. Each benefit paid from the acceleration pool reduces the pool and the death benefit dollar for dollar; when the pool reaches zero, benefits continue under the continuation of benefits rider at the same monthly maximum for continuation_period_months months (ltc_msr_continuation_months), without further reducing the death benefit, or for life where the continuation period is unlimited. When both are used up the policy is benefits_exhausted."
    eligibility:
      - id: benefit_status
        applies_to: [ltc_benefit_paid, ltc_continuation_benefit_paid]
        kind: state
        condition: "Benefits are paid only while the policy status is claim_active."
        evidence_fields: [ltc_holdings.status, ltc_holdings.ltc_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_holdings.ltc_policy_id]]
          action_bindings: {ltc_holdings.ltc_policy_id: ltc_policy_id}
        state_contract:
          field: ltc_holdings.status
          allowed: [claim_active]
    params:
      home_care_benefit_pct: "=home_care_benefit_pct"
      informal_care_benefit_pct: "=informal_care_benefit_pct"
      international_benefit_pct: "=international_benefit_pct"
      international_benefit_max_months: "=international_benefit_max_months"
      bed_reservation_days_per_year: "=bed_reservation_days_per_year"
      respite_care_days_per_year: "=respite_care_days_per_year"
      proof_of_loss_days: "=proof_of_loss_days"
      proof_of_loss_max_days: "=proof_of_loss_max_days"
      benefit_payment_basis: "=benefit_payment_basis"
      per_tier:
        Ashgrove CareAssure 2-Year: {continuation_period_months: "=continuation_period_months", acceleration_period_months: "=acceleration_period_months"}
        Ashgrove CareAssure 3-Year: {continuation_period_months: "=continuation_period_months", acceleration_period_months: "=acceleration_period_months"}
        Ashgrove CareAssure 4-Year: {continuation_period_months: "=continuation_period_months", acceleration_period_months: "=acceleration_period_months"}
        Ashgrove CareAssure 5-Year: {continuation_period_months: "=continuation_period_months", acceleration_period_months: "=acceleration_period_months"}
        Ashgrove CareAssure 6-Year: {continuation_period_months: "=continuation_period_months", acceleration_period_months: "=acceleration_period_months"}
        Ashgrove CareAssure Lifetime: {continuation_period_months: "=continuation_period_months", acceleration_period_months: "=acceleration_period_months"}
    measures: [ltc_msr_international_months, ltc_msr_continuation_months]
    formula:
      benefit_paid: min(expenses_submitted, round(monthly_max_benefit * benefit_pct_applied, 2), ltc_benefit_pool)
  - id: ltc_inflation_protection
    subject: [ltc_inflation_increase, ltc_benefit_amounts_increased]
    rule: "Under the 3 percent or 5 percent compound option, on each policy anniversary the monthly maximum benefit and the remaining acceleration pool increase by inflation_3_rate or inflation_5_rate respectively, rounded to the cent; increases continue while benefits are being paid. The death benefit does not increase. Policies with no inflation option never increase."
    eligibility: []
    params:
      inflation_options: "=inflation_options"
      inflation_3_rate: "=inflation_3_rate"
      inflation_5_rate: "=inflation_5_rate"
    formula:
      pool_increase: round(ltc_benefit_pool * inflation_rate, 2)
  - id: ltc_premium_waiver_on_claim
    subject: [ltc_premium_waived]
    rule: "Where premium_waiver_on_claim is true, ten-pay installments falling due while benefits are being paid are waived. A premium is waived only while the policy status is claim_active. Each installment is waived at most once. Premiums resume with the first installment due after benefits stop. Waived premiums do not count as premiums paid for the return of premium value or the shortened benefit period."
    eligibility:
      - id: waiver_status
        applies_to: [ltc_premium_waived]
        kind: state
        condition: "A premium is waived only while the policy status is claim_active."
        evidence_fields: [ltc_holdings.status, ltc_holdings.ltc_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_holdings.ltc_policy_id]]
          action_bindings: {ltc_holdings.ltc_policy_id: ltc_policy_id}
        state_contract:
          field: ltc_holdings.status
          allowed: [claim_active]
      - id: one_waiver_per_installment
        applies_to: [ltc_premium_waived]
        kind: dedup
        condition: "Each installment is waived at most once."
        evidence_fields: [ltc_transactions.ltc_policy_id, ltc_transactions.premium_due_date, ltc_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_transactions.ltc_policy_id, ltc_transactions.premium_due_date]]
          action_bindings: {ltc_transactions.ltc_policy_id: ltc_policy_id, ltc_transactions.premium_due_date: premium_due_date}
        dedup_contract:
          table: ltc_transactions
          mode: separate_record
          object_bindings: {ltc_policy_id: ltc_policy_id, premium_due_date: premium_due_date}
          duplicate_filters: {event_type: [ltc_premium_waived]}
          distinct_fields: []
    params:
      premium_waiver_on_claim: "=premium_waiver_on_claim"
  - id: ltc_surrender_rop
    subject: [ltc_policy_surrendered, ltc_surrender_value_paid]
    rule: "The owner may surrender the policy for its return of premium value. A surrender is processed only on a surrender request signed by the owner and by any irrevocable beneficiary. The value is the rop_vesting_ladder share for the policy year of surrender times ltc_msr_premiums_paid, less ltc_msr_benefits_paid, never below zero, rounded to the cent. A policy with benefits being paid, exhausted or on the shortened benefit period cannot be surrendered for value."
    eligibility:
      - id: signed_surrender_request
        applies_to: [ltc_policy_surrendered, ltc_surrender_value_paid]
        kind: authorization
        condition: "A surrender is processed only on a surrender request signed by the owner and by any irrevocable beneficiary."
        evidence_fields: [ltc_service_requests.request_type, ltc_service_requests.request_status, ltc_service_requests.signed_date, ltc_service_requests.ltc_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_service_requests.ltc_request_id]]
          action_bindings: {ltc_service_requests.ltc_request_id: ltc_request_id}
    params:
      rop_vesting_pct: "=rop_vesting_ladder"
    measures: [ltc_msr_premiums_paid, ltc_msr_benefits_paid]
    formula:
      surrender_value: max(0, round(rop_vesting_pct * ltc_msr_premiums_paid - ltc_msr_benefits_paid, 2))
  - id: ltc_death_benefit
    subject: [ltc_death_claim_registered, ltc_death_claim_paid, ltc_death_claim_denied, ltc_death_benefit_disbursed]
    rule: "Death proceeds are disbursed only on a death claim whose certified death certificate has been received and whose request status is approved. The death benefit is the specified amount less long-term care benefits paid from the acceleration pool (ltc_msr_benefits_paid), but never less than the residual death benefit — the lesser of residual_death_benefit_pct of the specified amount and residual_death_benefit_max — less installments overdue at death. A death within contestability_period_years of the issue or reinstatement date is approved only after contestable review; death by suicide within suicide_exclusion_years of the issue date pays only premiums paid less benefits paid. Interest is added at death_claim_interest_rate, simple, actual calendar days from death to disbursement over 365, rounded to the cent. Disbursement proceeds only while the policy status is death_claim_pending or claim_paid. Proceeds follow the designation in effect at death; a predeceased primary's share passes pro rata to surviving primaries, then to contingents, then to the owner or the owner's estate; a minor's share, below minor_beneficiary_age, goes only to a guardian or UTMA custodian; a payee with at least beneficiary_access_account_min may elect an Ashgrove Beneficiary Access Account."
    eligibility:
      - id: proof_and_approval
        applies_to: [ltc_death_claim_paid, ltc_death_benefit_disbursed]
        kind: authorization
        condition: "Death proceeds are disbursed only on a death claim whose certified death certificate has been received and whose request status is approved."
        evidence_fields: [ltc_service_requests.request_type, ltc_service_requests.request_status, ltc_service_requests.signed_date, ltc_service_requests.death_certificate_received, ltc_service_requests.ltc_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_service_requests.ltc_request_id]]
          action_bindings: {ltc_service_requests.ltc_request_id: ltc_request_id}
      - id: disbursement_status
        applies_to: [ltc_death_benefit_disbursed]
        kind: state
        condition: "Disbursement proceeds only while the policy status is death_claim_pending or claim_paid."
        evidence_fields: [ltc_holdings.status, ltc_holdings.ltc_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_holdings.ltc_policy_id]]
          action_bindings: {ltc_holdings.ltc_policy_id: ltc_policy_id}
        state_contract:
          field: ltc_holdings.status
          allowed: [death_claim_pending, claim_paid]
    params:
      residual_death_benefit_pct: "=residual_death_benefit_pct"
      residual_death_benefit_max: "=residual_death_benefit_max"
      contestability_period_years: "=contestability_period_years"
      suicide_exclusion_years: "=suicide_exclusion_years"
      death_claim_interest_rate: "=death_claim_interest_rate"
      minor_beneficiary_age: "=minor_beneficiary_age"
      beneficiary_access_account_min: "=beneficiary_access_account_min"
    measures: [ltc_msr_benefits_paid]
    formula:
      death_benefit: max(specified_amount - ltc_msr_benefits_paid, min(residual_death_benefit_pct * specified_amount, residual_death_benefit_max)) - premium_outstanding
  - id: ltc_beneficiary_designation
    subject: [ltc_beneficiary_designated]
    rule: "The owner names primary and contingent beneficiaries for the death benefit. A beneficiary designation is recorded only while the policy status is applied, in_force, grace_period, paid_up, claim_active, benefits_exhausted or shortened_benefit. A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary. The new designation replaces the earlier one entirely, effective on the owner's signature date if signed while the insured was living. Shares are whole percents of at least beneficiary_min_share_pct totalling 100 in each class, with no more than beneficiary_max_primary primaries. Long-term care benefits are always paid to the owner or the care provider the owner assigns, never to beneficiaries."
    eligibility:
      - id: designation_status
        applies_to: [ltc_beneficiary_designated]
        kind: state
        condition: "A beneficiary designation is recorded only while the policy status is applied, in_force, grace_period, paid_up, claim_active, benefits_exhausted or shortened_benefit."
        evidence_fields: [ltc_holdings.status, ltc_holdings.ltc_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_holdings.ltc_policy_id]]
          action_bindings: {ltc_holdings.ltc_policy_id: ltc_policy_id}
        state_contract:
          field: ltc_holdings.status
          allowed: [applied, in_force, grace_period, paid_up, claim_active, benefits_exhausted, shortened_benefit]
      - id: signed_change_request
        applies_to: [ltc_beneficiary_designated]
        kind: authorization
        condition: "A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary."
        evidence_fields: [ltc_service_requests.request_type, ltc_service_requests.request_status, ltc_service_requests.signed_date, ltc_transactions.designation_type, ltc_service_requests.ltc_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_service_requests.ltc_request_id]]
          action_bindings: {ltc_service_requests.ltc_request_id: ltc_request_id}
    params:
      beneficiary_min_share_pct: "=beneficiary_min_share_pct"
      beneficiary_max_primary: "=beneficiary_max_primary"
  - id: ltc_free_look
    subject: [ltc_free_look_cancelled]
    rule: "The owner may return a new policy for a full refund of premium paid. The returned policy must be received no later than the policy delivery date plus free_look_days. The free-look end is found by adding the free-look days in calendar days to the policy delivery date; a policy received on that day is in time."
    eligibility:
      - id: within_free_look
        applies_to: [ltc_free_look_cancelled]
        kind: time
        condition: "The returned policy must be received no later than the policy delivery date plus free_look_days."
        evidence_fields: [ltc_holdings.policy_delivery_date, ltc_holdings.ltc_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ltc_holdings.ltc_policy_id]]
          action_bindings: {ltc_holdings.ltc_policy_id: ltc_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the policy delivery date"
          anchor_source: ltc_holdings.policy_delivery_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: "The free-look end is found by adding the free-look days in calendar days to the policy delivery date; a policy received on that day is in time."
          boundary: inclusive
    params:
      free_look_days: "=free_look_days"
