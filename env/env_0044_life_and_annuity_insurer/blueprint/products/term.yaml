events:
  # ---- contract changes on term_holdings ----
  - type: term_policy_issued
    target: term_holdings
    mutation: create
    meaning: "A new term policy is issued from an approved application and recorded as applied until it is placed in force."
    grain: "one row per policy issued"
    fields:
      customer_id: "the owner of the policy"
      policy_number: "the policy number printed on the contract"
      variant_name: "the official tier name issued"
      insured_name: "the insured life"
      insured_date_of_birth: "the insured's date of birth"
      insured_is_owner: "whether the owner is also the insured"
      issue_state: "state of issue, which governs state-mandated provisions"
      issue_date: "the policy date from which policy years, anniversaries and periods are counted"
      issue_age: "insured's age last birthday on the issue date"
      underwriting_class: "the underwriting class approved"
      face_amount: "the face amount issued"
      base_rate_per_thousand: "the guaranteed annual rate per 1,000 of face for the insured's age and class"
      modal_premium: "the installment premium for the chosen mode"
      premium_mode: "the premium mode chosen on the application"
      replacement_sale: "whether the sale replaced existing coverage"
    triggers:
      - event: term:term_premium_billed
        map: {premium_due_date: issue_date, amount: modal_premium}
      - event: term:term_beneficiary_designated
        map: {designation_effective_date: issue_date}
  - type: term_policy_placed_in_force
    target: term_holdings
    mutation: {transition: {from: applied, to: in_force}}
    meaning: "The issued policy is delivered with the initial premium received and coverage takes effect."
    grain: "one row per transaction"
    fields:
      status: "becomes in_force"
      policy_delivery_date: "date the owner received the contract, which starts the free-look period"
      paid_to_date: "the date through which the initial premium pays coverage"
    triggers: []
  - type: term_application_declined
    target: term_holdings
    mutation: {transition: {from: applied, to: declined}}
    meaning: "The application is declined or withdrawn before placement and no coverage attaches."
    grain: "one row per transaction"
    fields:
      status: "becomes declined"
      termination_date: "date of the decline or withdrawal"
    triggers:
      - event: term:term_premium_refunded
        map: {refund_reason: application_declined, transaction_date: termination_date}
  - type: term_grace_period_started
    target: term_holdings
    mutation: {transition: {from: in_force, to: grace_period}}
    meaning: "The installment due on the paid-to date is unpaid when due and the grace period begins."
    grain: "one row per transaction"
    fields:
      status: "becomes grace_period"
    triggers: []
  - type: term_grace_period_cured
    target: term_holdings
    mutation: {transition: {from: grace_period, to: in_force}}
    meaning: "Every overdue installment is paid before the grace period ends and the policy returns to premium-paying status."
    grain: "one row per transaction"
    fields:
      status: "becomes in_force"
    triggers: []
  - type: term_policy_lapsed
    target: term_holdings
    mutation: {transition: {from: grace_period, to: lapsed}}
    meaning: "The grace period expires with premium unpaid and the coverage lapses without value."
    grain: "one row per transaction"
    fields:
      status: "becomes lapsed"
      lapse_date: "the first day without coverage — the day after the last day of the grace period"
    triggers: []
  - type: term_policy_reinstated
    target: term_holdings
    mutation: {transition: {from: lapsed, to: in_force}}
    meaning: "A lapsed policy is restored to force after the reinstatement requirements are met and the reinstatement amount is paid."
    grain: "one row per transaction"
    fields:
      status: "becomes in_force"
      reinstatement_date: "date coverage is restored"
      paid_to_date: "the paid-to date after all back premiums are applied"
    triggers: []
  - type: term_policy_converted
    target: term_holdings
    mutation: {transition: {from: in_force, to: converted}}
    meaning: "The owner exchanges the whole term coverage for a permanent Ashgrove policy under the conversion privilege; the term policy ends as the new policy is issued."
    grain: "one row per transaction"
    fields:
      status: "becomes converted"
      termination_date: "the conversion date — the last day of term coverage and the issue date of the new policy"
      converted_into_category: "the category of the permanent product chosen (whole or ul)"
    triggers:
      - event: whole:whole_policy_issued
        when: {converted_into_category: whole}
        map: {customer_id: customer_id, insured_name: insured_name, insured_date_of_birth: insured_date_of_birth, underwriting_class: underwriting_class, converted_from_term_policy_id: term_policy_id, issue_date: termination_date}
      - event: ul:ul_policy_issued
        when: {converted_into_category: ul}
        map: {customer_id: customer_id, insured_name: insured_name, insured_date_of_birth: insured_date_of_birth, underwriting_class: underwriting_class, converted_from_term_policy_id: term_policy_id, issue_date: termination_date}
  - type: term_death_claim_registered
    target: term_holdings
    mutation: {transition: [{from: in_force, to: death_claim_pending}, {from: grace_period, to: death_claim_pending}]}
    meaning: "Notice of the insured's death is registered on a policy that was in force (including during grace) on the date of death."
    grain: "one row per transaction"
    fields:
      status: "becomes death_claim_pending"
    triggers: []
  - type: term_death_claim_paid
    target: term_holdings
    mutation: {transition: {from: death_claim_pending, to: claim_paid}}
    meaning: "The death claim is approved on due proof and the policy closes with the proceeds disbursed."
    grain: "one row per transaction"
    fields:
      status: "becomes claim_paid"
      termination_date: "the disbursement date of the death proceeds"
    triggers:
      - event: term:term_death_benefit_disbursed
        map: {transaction_date: termination_date}
  - type: term_death_claim_denied
    target: term_holdings
    mutation: {transition: {from: death_claim_pending, to: claim_denied}}
    meaning: "The claims committee rescinds the contract within the contestable period or applies the suicide exclusion."
    grain: "one row per transaction"
    fields:
      status: "becomes claim_denied"
      termination_date: "the date of the claim decision"
    triggers:
      - event: term:term_premium_refunded
        map: {refund_reason: claim_denied_premium_refund, transaction_date: termination_date}
  - type: term_policy_expired
    target: term_holdings
    mutation: {transition: {from: in_force, to: expired}}
    meaning: "Coverage reaches the anniversary at the coverage expiry age and ends without value."
    grain: "one row per transaction"
    fields:
      status: "becomes expired"
      termination_date: "the expiry anniversary"
    triggers: []
  - type: term_free_look_cancelled
    target: term_holdings
    mutation: {transition: {from: in_force, to: cancelled_free_look}}
    meaning: "The owner returns the policy within the free-look period; the contract is void from issue and every premium paid is refunded."
    grain: "one row per transaction"
    fields:
      status: "becomes cancelled_free_look"
      termination_date: "the date the returned policy was received"
    triggers:
      - event: term:term_premium_refunded
        map: {refund_reason: free_look, transaction_date: termination_date}
  - type: term_owner_cancelled
    target: term_holdings
    mutation: {transition: [{from: in_force, to: cancelled_by_owner}, {from: grace_period, to: cancelled_by_owner}]}
    meaning: "The owner's signed request terminates the coverage."
    grain: "one row per transaction"
    fields:
      status: "becomes cancelled_by_owner"
      termination_date: "the effective date of the cancellation"
    triggers: []
  - type: term_face_amount_decreased
    target: term_holdings
    mutation: update
    meaning: "The face amount is reduced at the owner's signed request and the premium is recalculated."
    grain: "one row per transaction"
    fields:
      face_amount: "the new, lower face amount"
      modal_premium: "the recalculated installment premium"
    triggers: []
  - type: term_premium_mode_changed
    target: term_holdings
    mutation: update
    meaning: "The premium mode or EFT draft day is changed, at the owner's request or because the EFT privilege was terminated."
    grain: "one row per transaction"
    fields:
      premium_mode: "the new premium mode"
      modal_premium: "the installment premium for the new mode"
      eft_draft_day: "the monthly draft day; empty when the mode is not monthly EFT"
    triggers: []
  - type: term_rider_removed
    target: term_holdings
    mutation: update
    meaning: "An optional rider is removed at the owner's signed request, or ends at its expiry age, and the premium is recalculated."
    grain: "one row per transaction"
    fields:
      waiver_of_premium_rider: "whether the waiver of premium rider remains attached"
      child_rider_units: "units of children's term rider remaining"
      adb_rider_amount: "accidental death benefit rider amount remaining"
      modal_premium: "the recalculated installment premium"
    triggers: []
  - type: term_paid_to_date_updated
    target: term_holdings
    mutation: update
    meaning: "The paid-to date moves forward when an installment is paid or waived, and back when a payment is returned unpaid."
    grain: "one row per transaction"
    fields:
      paid_to_date: "the date through which premiums are now paid"
    triggers: []
  - type: term_annual_rate_reset
    target: term_holdings
    mutation: update
    meaning: "On a policy anniversary in a renewable (non-level) year the annual rate per 1,000 is re-set to the insured's attained-age rate and the installment premium is recalculated."
    grain: "one row per transaction"
    fields:
      base_rate_per_thousand: "the attained-age annual rate per 1,000 effective from this anniversary"
      modal_premium: "the recalculated installment premium"
    triggers: []
  # ---- ledger rows on term_transactions ----
  - type: term_premium_billed
    target: term_transactions
    meaning: "One premium installment falls due and is billed to the owner."
    grain: "one row per installment due date on one policy"
    distinguish_by: [premium_due_date]
    fields:
      transaction_date: "date the installment was billed"
      amount: "the installment premium billed, positive"
      premium_due_date: "the due date of the installment"
    account: premium_outstanding
    direction: in
    triggers: []
  - type: term_premium_paid
    target: term_transactions
    meaning: "A remittance is applied to one billed installment."
    grain: "one row per remittance applied to one installment"
    distinguish_by: [premium_due_date, transaction_date]
    fields:
      transaction_date: "date the remittance was received"
      amount: "amount received and applied, positive"
      premium_due_date: "the due date of the installment it pays"
      payment_method: "how the remittance was made"
    account: premium_outstanding
    direction: out
    triggers:
      - event: term:term_paid_to_date_updated
        map: {}
  - type: term_premium_payment_returned
    target: term_transactions
    meaning: "A previously applied payment is returned unpaid by the bank and the installment becomes due again."
    grain: "one row per returned payment"
    distinguish_by: [source_txn_id]
    fields:
      transaction_date: "date the bank return was received"
      amount: "the returned amount, positive"
      premium_due_date: "the due date of the installment the returned payment had paid"
      source_txn_id: "the premium payment that was returned"
      return_reason: "the bank's return reason"
    account: premium_outstanding
    direction: in
    triggers:
      - event: term:term_paid_to_date_updated
        map: {}
  - type: term_premium_waived
    target: term_transactions
    meaning: "An installment is waived under the waiver of premium rider while the insured is totally disabled."
    grain: "one row per installment waived"
    distinguish_by: [premium_due_date]
    fields:
      transaction_date: "date the waiver was applied"
      amount: "the installment premium waived, positive"
      premium_due_date: "the due date of the installment waived"
      term_request_id: "the approved waiver of premium claim"
    account: premium_outstanding
    direction: out
    triggers:
      - event: term:term_paid_to_date_updated
        map: {}
  - type: term_premium_refunded
    target: term_transactions
    meaning: "Premium money is returned to the owner — an overpayment, a free-look return, unearned premium, a declined application or the refund on a denied claim."
    grain: "one row per refund"
    distinguish_by: [refund_reason, transaction_date]
    fields:
      transaction_date: "date the refund was issued"
      amount: "the amount refunded, positive"
      refund_reason: "why the premium is refunded"
      source_txn_id: "the payment being refunded where the refund relates to one payment; empty otherwise"
    account: premium_outstanding
    direction: in
    triggers: []
  - type: term_beneficiary_designated
    target: term_transactions
    meaning: "One beneficiary line of a designation is recorded; a designation with a later effective date replaces every line of the earlier one."
    grain: "one row per beneficiary line per designation"
    distinguish_by: [designation_effective_date, beneficiary_class, beneficiary_name]
    fields:
      transaction_date: "date the designation was recorded"
      designation_effective_date: "date the owner signed the designation (the application date for the original designation)"
      beneficiary_name: "the beneficiary as named by the owner"
      beneficiary_relationship: "relationship of the beneficiary to the insured"
      beneficiary_class: "primary or contingent"
      share_percent: "the whole-percent share of this beneficiary within the class"
      designation_type: "revocable or irrevocable"
      term_request_id: "the signed beneficiary change request; empty for the original designation"
    triggers: []
  - type: term_tiadb_advance_paid
    target: term_transactions
    meaning: "A terminal illness accelerated death benefit advance is paid to the owner and a lien of the elected amount is placed on the policy."
    grain: "one row per approved acceleration claim"
    distinguish_by: [term_request_id]
    fields:
      transaction_date: "date the advance was paid"
      amount: "the elected acceleration amount added to the lien, positive"
      term_request_id: "the approved accelerated benefit claim"
      payout_method: "how the net advance was paid"
    account: tiadb_lien
    direction: in
    triggers: []
  - type: term_tiadb_lien_settled
    target: term_transactions
    meaning: "The outstanding acceleration lien is deducted from the death proceeds when the death claim is paid."
    grain: "one row per death claim settling a lien"
    distinguish_by: [term_request_id]
    fields:
      transaction_date: "date of the death benefit disbursement"
      amount: "the lien deducted, positive"
      term_request_id: "the death claim on which the lien is settled"
    account: tiadb_lien
    direction: out
    triggers: []
  - type: term_death_benefit_disbursed
    target: term_transactions
    meaning: "One payee's share of the death proceeds is paid."
    grain: "one row per payee per death claim"
    distinguish_by: [term_request_id, payee_name]
    fields:
      transaction_date: "date the share was disbursed"
      amount: "the net amount paid to this payee including interest, positive"
      interest_amount: "the death-claim interest included in the amount"
      payee_name: "the payee, as named in the governing beneficiary designation"
      payout_method: "check, direct deposit or Beneficiary Access Account"
      term_request_id: "the death claim being paid"
    triggers: []

measures:
  - id: term_msr_returned_eft_12m
    window: "rolling 12 calendar months ending on the date of the return being evaluated, inclusive of both ends"
    measure: "count of term_premium_payment_returned rows on the policy whose returned payment (source_txn_id) had payment_method eft, including the return being evaluated"
  - id: term_msr_face_decreases_policy_year
    window: "the current policy year — from the most recent policy anniversary (the issue date's month and day) on or before the evaluation date, to the day before the next anniversary"
    measure: "count of term_service_requests rows on the policy with request_type face_decrease and request_status completed whose decision_date falls in the window"
  - id: term_msr_tiadb_accelerated_on_insured
    window: "lifetime of every Ashgrove term policy on the same insured (same insured_name and insured_date_of_birth), whatever its owner or status"
    measure: "sum of amount over term_tiadb_advance_paid rows on those policies"
  - id: term_msr_inforce_face_on_insured
    window: "point in time at the evaluation date"
    measure: "sum of face_amount over term_holdings on the same insured (same insured_name and insured_date_of_birth) whose status is applied, in_force or grace_period"

policies:
  - id: term_agg_multi_holding
    subject: [term_policy_issued]
    rule: "An owner may hold any number of Ashgrove term policies, on the owner's own life or on other lives in which the owner has an insurable interest; the count of policies is not capped. What is capped is the total face amount on one insured, which term_agg_insured_face_limit governs."
    eligibility: []
    params:
      max_per_customer: null
  - id: term_agg_insured_face_limit
    subject: [term_policy_issued, term_tiadb_advance_paid]
    rule: "Term coverage is aggregated per insured life, identified by insured name and date of birth, across every owner and every term policy. A new policy is issued only if the face amount on the insured after issue does not exceed aggregate_face_limit_per_insured. The face amount on the insured is term_msr_inforce_face_on_insured plus the new face amount; policies that are lapsed, converted, expired, cancelled or closed by claim do not count. Terminal illness accelerations are also aggregated per insured: the amount accelerated on one insured across all term policies is term_msr_tiadb_accelerated_on_insured, and it may never exceed tiadb_max_amount of the policy being accelerated."
    eligibility: []
    params:
      aggregate_face_limit_per_insured: 10000000
      tiadb_max_amount: "=tiadb_max_amount"
    measures: [term_msr_inforce_face_on_insured, term_msr_tiadb_accelerated_on_insured]
    formula:
      face_on_insured_after_issue: term_msr_inforce_face_on_insured + face_amount
  - id: term_issue_and_placement
    subject: [term_policy_issued, term_policy_placed_in_force, term_application_declined]
    rule: "A tier is issued only to an insured whose age last birthday on the issue date lies between min_issue_age and max_issue_age, for a face amount between min_face_amount and max_face_amount of that tier, and the waiver of premium rider is attached only when the issue age does not exceed waiver_rider_max_issue_age. The first installment is billed on the issue date. The policy is placed in force on the later of the delivery date and the date the first installment is paid in full; the paid-to date is then the issue date advanced by one premium-mode period. An application that is declined or withdrawn before placement is closed as declined and any premium received with it is refunded in full without interest. A request to issue a tier outside its issue ages or face limits cannot be met by changing the dates or amounts and is not processed."
    eligibility: []
    params:
      min_issue_age: "=min_issue_age"
      max_issue_age: "=max_issue_age"
      min_face_amount: "=min_face_amount"
      max_face_amount: "=max_face_amount"
      waiver_rider_max_issue_age: "=waiver_rider_max_issue_age"
  - id: term_premium_calculation
    subject: [term_premium_billed, term_face_amount_decreased, term_premium_mode_changed, term_rider_removed, term_annual_rate_reset]
    rule: "The annual premium is the face premium plus the annual policy fee plus rider charges. The face premium is the face amount divided by 1,000, times base_rate_per_thousand, times the band factor, rounded to the cent; the band factor is the band_factor of the highest premium_band_ladder band whose min_face does not exceed the face amount in force for the installment. Rider charges are: children's term rider units times child_rider_annual_premium_per_unit; the accidental death benefit rider amount divided by 1,000 times adb_rider_annual_rate_per_thousand; and, when the waiver of premium rider is attached, waiver_rider_charge_pct of the face premium, rounded to the cent. The installment premium is the annual premium times the modal factor of the premium mode (modal_factor_annual, modal_factor_semiannual, modal_factor_quarterly or modal_factor_monthly_eft), rounded to the cent. During the level premium period of a level term tier base_rate_per_thousand never changes; in the Ashgrove Annual Renewable Term and in every policy year after the level premium period, base_rate_per_thousand is the attained-age rate re-set on each anniversary. A change to the face amount, mode or riders takes effect on the first installment due on or after the change; an installment already billed is never re-billed."
    eligibility: []
    params:
      band_factor: "=premium_band_ladder"
      annual_policy_fee: "=annual_policy_fee"
      child_rider_annual_premium_per_unit: "=child_rider_annual_premium_per_unit"
      adb_rider_annual_rate_per_thousand: "=adb_rider_annual_rate_per_thousand"
      waiver_rider_charge_pct: 0.11
      modal_factor_annual: "=modal_factor_annual"
      modal_factor_semiannual: "=modal_factor_semiannual"
      modal_factor_quarterly: "=modal_factor_quarterly"
      modal_factor_monthly_eft: "=modal_factor_monthly_eft"
      level_premium_period_years: "=level_premium_period_years"
    formula:
      face_premium: round(face_amount / 1000 * base_rate_per_thousand * band_factor, 2)
      annual_premium: face_premium + annual_policy_fee + child_rider_units * child_rider_annual_premium_per_unit + adb_rider_amount / 1000 * adb_rider_annual_rate_per_thousand + round(waiver_rider_charge_pct * face_premium, 2)
      modal_premium: round(annual_premium * (modal_factor_annual if premium_mode == "annual" else modal_factor_semiannual if premium_mode == "semiannual" else modal_factor_quarterly if premium_mode == "quarterly" else modal_factor_monthly_eft), 2)
  - id: term_evt_premium_application
    subject: [term_premium_paid, term_premium_refunded, term_paid_to_date_updated]
    rule: "A remittance is applied as premium only while the policy status is applied, in_force or grace_period. A remittance is applied to the oldest billed installment that is still unpaid, one installment per payment record, and the paid-to date then moves forward by one premium-mode period. A remittance short of the installment by no more than premium_shortage_tolerance is applied as full payment and the shortage stays on premium_outstanding; a remittance short by more than that is not applied and is returned to the payer. Money left unapplied after every billed installment is paid is held toward the next installment when it does not exceed overpayment_refund_threshold, and is refunded to the payer as an overpayment when it exceeds it. Money received while the policy is lapsed is not premium: it is held with a reinstatement application and applied only on the reinstatement date, or refunded if no reinstatement follows."
    eligibility:
      - id: payable_status
        applies_to: [term_premium_paid]
        kind: state
        condition: "A remittance is applied as premium only while the policy status is applied, in_force or grace_period."
        evidence_fields: [term_holdings.status, term_holdings.term_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_holdings.term_policy_id]]
          action_bindings: {term_holdings.term_policy_id: term_policy_id}
        state_contract:
          field: term_holdings.status
          allowed: [applied, in_force, grace_period]
    params:
      premium_shortage_tolerance: "=premium_shortage_tolerance"
      overpayment_refund_threshold: "=overpayment_refund_threshold"
  - id: term_grace_and_lapse
    subject: [term_grace_period_started, term_grace_period_cured, term_policy_lapsed]
    rule: "When an installment is unpaid on its due date — the paid-to date — the policy enters the grace period and coverage continues. The grace period lasts grace_period_days, except that a policy whose issue state appears in grace_period_state_overrides uses the number of days listed for that state. The overdue premium must be received no later than the last day of the grace period, which is the unpaid installment's due date plus the grace period days. The last day of grace is found by adding the grace period length in calendar days to the due date; a remittance received on that day is in time. When every overdue installment is paid in time the policy returns to in_force. If the grace period ends with premium still due, the policy lapses: the lapse date is the day after the last day of grace, coverage ends, and term coverage has no cash value or nonforfeiture benefit. A death during the grace period is covered and the overdue installments are deducted from the proceeds."
    eligibility:
      - id: cure_within_grace
        applies_to: [term_grace_period_cured]
        kind: time
        condition: "The overdue premium must be received no later than the last day of the grace period, which is the unpaid installment's due date plus the grace period days."
        evidence_fields: [term_holdings.paid_to_date, term_holdings.issue_state, term_holdings.term_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_holdings.term_policy_id]]
          action_bindings: {term_holdings.term_policy_id: term_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the unpaid installment's due date"
          anchor_source: term_holdings.paid_to_date
          relation: not_after
          duration_source: variants.grace_period_days
          unit: calendar_days
          counting_rule: "The last day of grace is found by adding the grace period length in calendar days to the due date; a remittance received on that day is in time."
          boundary: inclusive
    params:
      grace_period_days: "=grace_period_days"
      grace_period_state_overrides: "=grace_period_state_overrides"
  - id: term_evt_returned_eft
    subject: [term_premium_payment_returned, term_premium_mode_changed]
    rule: "A payment returned unpaid by the bank reverses only the payment it names. Each returned payment is recorded once against the payment it reverses. The installment it had paid becomes due again, the paid-to date moves back to that installment's due date, and the grace period for that installment is counted from its original due date, not from the date of the return. When term_msr_returned_eft_12m reaches returned_eft_limit_12m, the monthly EFT privilege ends: the premium mode is changed to quarterly direct billing effective with the next installment due, and monthly EFT may be elected again only after eft_reenroll_wait_months calendar months from the date of the return that ended the privilege. Returned checks, card payments and one-time bank payments reverse the payment the same way but never count toward the EFT limit."
    eligibility:
      - id: one_return_per_payment
        applies_to: [term_premium_payment_returned]
        kind: dedup
        condition: "Each returned payment is recorded once against the payment it reverses."
        evidence_fields: [term_transactions.source_txn_id, term_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_transactions.source_txn_id]]
          action_bindings: {term_transactions.source_txn_id: source_txn_id}
        dedup_contract:
          table: term_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [term_premium_payment_returned]}
          distinct_fields: []
    params:
      returned_eft_limit_12m: "=returned_eft_limit_12m"
      eft_reenroll_wait_months: "=eft_reenroll_wait_months"
    measures: [term_msr_returned_eft_12m]
  - id: term_mode_change
    subject: [term_premium_mode_changed]
    rule: "The owner may choose annual, semiannual, quarterly or monthly EFT mode. A premium mode change is accepted only while the policy status is in_force or grace_period. The change takes effect with the first installment due on or after the request; when annual_mode_change_anniversary_only is true, a change to annual mode takes effect only on the next policy anniversary and the current mode continues until then. Monthly EFT requires a draft day from 1 to eft_draft_day_max and a bank account in the owner's name, and is refused while an EFT privilege termination is within its re-enrollment wait under term_evt_returned_eft. A change of draft day alone takes effect with the next draft. Installments already billed keep their amounts."
    eligibility:
      - id: mode_change_status
        applies_to: [term_premium_mode_changed]
        kind: state
        condition: "A premium mode change is accepted only while the policy status is in_force or grace_period."
        evidence_fields: [term_holdings.status, term_holdings.term_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_holdings.term_policy_id]]
          action_bindings: {term_holdings.term_policy_id: term_policy_id}
        state_contract:
          field: term_holdings.status
          allowed: [in_force, grace_period]
    params:
      eft_draft_day_max: "=eft_draft_day_max"
      annual_mode_change_anniversary_only: "=annual_mode_change_anniversary_only"
  - id: term_reinstatement
    subject: [term_policy_reinstated, term_premium_billed]
    rule: "A lapsed policy may be reinstated on the owner's signed reinstatement application. The reinstatement application must be signed no later than the end of the reinstatement window, which is the lapse date plus reinstatement_window_months. The window end is found by adding the number of calendar months to the lapse date, falling back to the last day of the month when that day does not exist; an application signed on the window end is in time. The evidence of insurability required is read from reinstatement_evidence_ladder by the number of calendar days from the lapse date to the application's signed date: none, a statement of good health signed by the insured, or full underwriting. The policy is reinstated only on a reinstatement application whose request status is approved. An application needing no evidence or a statement of good health is approved by policy service once the statement, where required, is signed; an application needing full underwriting is submitted to underwriting and the policy stays lapsed until underwriting approves it. The reinstatement amount is every installment that would have fallen due from the paid-to date at lapse through the reinstatement date, each billed at the premium in effect when it would have fallen due, plus simple interest at reinstatement_interest_rate on each installment for the actual calendar days from its due date to the reinstatement date over 365, rounded to the cent per installment. On the reinstatement date those installments are billed and paid. When reinstatement_restarts_contestability is true, statements in the reinstatement application are contestable for contestability_period_years from the reinstatement date. A lapsed policy past its reinstatement window cannot be reinstated; the insured may only apply for new coverage."
    eligibility:
      - id: within_reinstatement_window
        applies_to: [term_policy_reinstated]
        kind: time
        condition: "The reinstatement application must be signed no later than the end of the reinstatement window, which is the lapse date plus reinstatement_window_months."
        evidence_fields: [term_holdings.lapse_date, term_service_requests.signed_date, term_service_requests.term_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_service_requests.term_request_id]]
          action_bindings: {term_service_requests.term_request_id: term_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the lapse date"
          anchor_source: term_holdings.lapse_date
          relation: not_after
          duration_source: variants.reinstatement_window_months
          unit: calendar_months
          counting_rule: "The window end is found by adding the number of calendar months to the lapse date, falling back to the last day of the month when that day does not exist; an application signed on the window end is in time."
          boundary: inclusive
      - id: approved_application
        applies_to: [term_policy_reinstated]
        kind: authorization
        condition: "The policy is reinstated only on a reinstatement application whose request status is approved."
        evidence_fields: [term_service_requests.request_status, term_service_requests.request_type, term_service_requests.term_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_service_requests.term_request_id]]
          action_bindings: {term_service_requests.term_request_id: term_request_id}
    params:
      reinstatement_window_months: "=reinstatement_window_months"
      reinstatement_interest_rate: "=reinstatement_interest_rate"
      reinstatement_evidence_ladder: "=reinstatement_evidence_ladder"
      reinstatement_restarts_contestability: "=reinstatement_restarts_contestability"
      contestability_period_years: "=contestability_period_years"
    formula:
      installment_interest: round(amount * reinstatement_interest_rate * (transaction_date - premium_due_date) / 365, 2)
  - id: term_conversion
    subject: [term_policy_converted]
    rule: "The owner may convert term coverage to an Ashgrove permanent policy without evidence of insurability. Conversion must be signed no later than the conversion deadline, which is the issue date plus conversion_period_months. The deadline is found by adding the number of calendar months to the issue date, falling back to the last day of the month when that day does not exist; a conversion application signed on the deadline is in time. Independently, conversion is no longer available from the policy anniversary on or after the insured's attained age reaches conversion_max_attained_age; the earlier of the two dates governs. The term policy is converted only on a conversion application signed by the owner whose request status is approved. The policy must be in_force on the conversion date: a policy in its grace period is converted only after the overdue premium is paid and it is back in force. Within conversion_full_menu_months of the issue date the new product may be any tier on conversion_full_menu_products; after that only conversion_designated_products. The converted face amount must be at least conversion_min_face_amount and may not exceed the term face amount. Converting the whole face ends the term policy as converted; converting part of the face reduces the term face by the converted amount, and the term face remaining may not fall below min_face_amount. The new policy is issued on the conversion date at the insured's attained age, in the same underwriting class, with the waiver of premium rider only if the term policy carried it. A conversion signed in a policy year from conversion_credit_first_policy_year to conversion_credit_last_policy_year earns a conversion credit of conversion_credit_pct of the converted face premium (converted face divided by 1,000, times base_rate_per_thousand, times the band factor for the term face in force immediately before conversion, rounded to the cent), applied to the new policy's first premium; no credit is earned in other policy years and none is ever paid in cash. A conversion requested while premiums are being waived under the waiver of premium rider is not decided by policy service."
    eligibility:
      - id: within_conversion_period
        applies_to: [term_policy_converted]
        kind: time
        condition: "Conversion must be signed no later than the conversion deadline, which is the issue date plus conversion_period_months."
        evidence_fields: [term_holdings.issue_date, term_holdings.insured_date_of_birth, term_service_requests.signed_date, term_service_requests.term_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_service_requests.term_request_id]]
          action_bindings: {term_service_requests.term_request_id: term_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the issue date"
          anchor_source: term_holdings.issue_date
          relation: not_after
          duration_source: variants.conversion_period_months
          unit: calendar_months
          counting_rule: "The deadline is found by adding the number of calendar months to the issue date, falling back to the last day of the month when that day does not exist; a conversion application signed on the deadline is in time."
          boundary: inclusive
      - id: signed_conversion_application
        applies_to: [term_policy_converted]
        kind: authorization
        condition: "The term policy is converted only on a conversion application signed by the owner whose request status is approved."
        evidence_fields: [term_service_requests.request_type, term_service_requests.request_status, term_service_requests.signed_date, term_service_requests.term_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_service_requests.term_request_id]]
          action_bindings: {term_service_requests.term_request_id: term_request_id}
    params:
      conversion_period_months: "=conversion_period_months"
      conversion_max_attained_age: "=conversion_max_attained_age"
      conversion_full_menu_months: "=conversion_full_menu_months"
      conversion_full_menu_products: "=conversion_full_menu_products"
      conversion_designated_products: "=conversion_designated_products"
      conversion_min_face_amount: "=conversion_min_face_amount"
      min_face_amount: "=min_face_amount"
      band_factor: "=premium_band_ladder"
      per_tier:
        Ashgrove Annual Renewable Term: {conversion_credit_pct: "=conversion_credit_pct", conversion_credit_first_policy_year: "=conversion_credit_first_policy_year", conversion_credit_last_policy_year: "=conversion_credit_last_policy_year"}
        Ashgrove Level Term 10: {conversion_credit_pct: "=conversion_credit_pct", conversion_credit_first_policy_year: "=conversion_credit_first_policy_year", conversion_credit_last_policy_year: "=conversion_credit_last_policy_year"}
        Ashgrove Level Term 15: {conversion_credit_pct: "=conversion_credit_pct", conversion_credit_first_policy_year: "=conversion_credit_first_policy_year", conversion_credit_last_policy_year: "=conversion_credit_last_policy_year"}
        Ashgrove Level Term 20: {conversion_credit_pct: "=conversion_credit_pct", conversion_credit_first_policy_year: "=conversion_credit_first_policy_year", conversion_credit_last_policy_year: "=conversion_credit_last_policy_year"}
        Ashgrove Level Term 25: {conversion_credit_pct: "=conversion_credit_pct", conversion_credit_first_policy_year: "=conversion_credit_first_policy_year", conversion_credit_last_policy_year: "=conversion_credit_last_policy_year"}
        Ashgrove Level Term 30: {conversion_credit_pct: "=conversion_credit_pct", conversion_credit_first_policy_year: "=conversion_credit_first_policy_year", conversion_credit_last_policy_year: "=conversion_credit_last_policy_year"}
    formula:
      conversion_credit: round(conversion_credit_pct * round(face_amount / 1000 * base_rate_per_thousand * band_factor, 2), 2)
  - id: term_face_decrease
    subject: [term_face_amount_decreased]
    rule: "The owner may reduce the face amount by signed request. A face decrease is processed only while the policy status is in_force. A decrease takes effect on the next installment due date and only from policy year face_decrease_first_policy_year onward; no more than face_decreases_per_policy_year decreases may take effect in one policy year, counted by term_msr_face_decreases_policy_year. The face amount after the decrease may not be below min_face_amount. The premium is recalculated under term_premium_calculation, so a decrease that moves the face amount into a lower band also changes the band factor. Premium already paid for the current mode period is not refunded. A face increase is not available on any term tier."
    eligibility:
      - id: decrease_status
        applies_to: [term_face_amount_decreased]
        kind: state
        condition: "A face decrease is processed only while the policy status is in_force."
        evidence_fields: [term_holdings.status, term_holdings.term_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_holdings.term_policy_id]]
          action_bindings: {term_holdings.term_policy_id: term_policy_id}
        state_contract:
          field: term_holdings.status
          allowed: [in_force]
    params:
      face_decrease_first_policy_year: "=face_decrease_first_policy_year"
      face_decreases_per_policy_year: "=face_decreases_per_policy_year"
      min_face_amount: "=min_face_amount"
    measures: [term_msr_face_decreases_policy_year]
  - id: term_evt_waiver_of_premium
    subject: [term_premium_waived, term_premium_refunded]
    rule: "When the waiver of premium rider is attached and the insured becomes totally disabled before the policy anniversary at waiver_rider_expiry_age, installments falling due on or after the disability onset date are waived while total disability continues. A waiver is applied only when the claim decision date is not earlier than the disability onset date plus waiver_elimination_months. The elimination end is found by adding the number of calendar months to the disability onset date, falling back to the last day of the month when that day does not exist; a decision dated on the elimination end qualifies. Premiums are waived only under a waiver of premium claim whose request status is approved. Each installment is waived at most once. When waiver_refunds_elimination_premiums is true, installments with due dates on or after the onset date that the owner already paid are refunded. A disability that begins after the rider's expiry anniversary is not covered, and waiving premiums never extends the conversion deadline."
    eligibility:
      - id: elimination_satisfied
        applies_to: [term_premium_waived]
        kind: time
        condition: "A waiver is applied only when the claim decision date is not earlier than the disability onset date plus waiver_elimination_months."
        evidence_fields: [term_service_requests.disability_onset_date, term_service_requests.decision_date, term_service_requests.term_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_service_requests.term_request_id]]
          action_bindings: {term_service_requests.term_request_id: term_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the disability onset date"
          anchor_source: term_service_requests.disability_onset_date
          relation: not_before
          duration_source: variants.waiver_elimination_months
          unit: calendar_months
          counting_rule: "The elimination end is found by adding the number of calendar months to the disability onset date, falling back to the last day of the month when that day does not exist; a decision dated on the elimination end qualifies."
          boundary: inclusive
      - id: approved_waiver_claim
        applies_to: [term_premium_waived]
        kind: authorization
        condition: "Premiums are waived only under a waiver of premium claim whose request status is approved."
        evidence_fields: [term_service_requests.request_type, term_service_requests.request_status, term_service_requests.term_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_service_requests.term_request_id]]
          action_bindings: {term_service_requests.term_request_id: term_request_id}
      - id: one_waiver_per_installment
        applies_to: [term_premium_waived]
        kind: dedup
        condition: "Each installment is waived at most once."
        evidence_fields: [term_transactions.term_policy_id, term_transactions.premium_due_date, term_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_transactions.term_policy_id, term_transactions.premium_due_date]]
          action_bindings: {term_transactions.term_policy_id: term_policy_id, term_transactions.premium_due_date: premium_due_date}
        dedup_contract:
          table: term_transactions
          mode: separate_record
          object_bindings: {term_policy_id: term_policy_id, premium_due_date: premium_due_date}
          duplicate_filters: {event_type: [term_premium_waived]}
          distinct_fields: []
    params:
      waiver_rider_expiry_age: "=waiver_rider_expiry_age"
      waiver_elimination_months: "=waiver_elimination_months"
      waiver_refunds_elimination_premiums: "=waiver_refunds_elimination_premiums"
  - id: term_evt_accelerated_benefit
    subject: [term_tiadb_advance_paid]
    rule: "An insured certified by a licensed physician to have a life expectancy of tiadb_life_expectancy_months or less may receive part of the death benefit in advance, once per policy. An acceleration is paid only while the policy status is in_force. An advance is paid only under an accelerated benefit claim whose request status is approved, which requires the written consent of every irrevocable beneficiary. The elected amount may not exceed the lower of tiadb_max_pct of the face amount and tiadb_max_amount less term_msr_tiadb_accelerated_on_insured, and the face amount less the resulting lien may not fall below tiadb_min_remaining_face. The amount paid is the elected amount reduced by tiadb_discount_rate and then by tiadb_admin_fee, rounded to the cent; the lien is the full elected amount and earns no interest. Premiums continue to be due on the full face amount, and the lien is deducted from the death proceeds under term_death_claim."
    eligibility:
      - id: acceleration_status
        applies_to: [term_tiadb_advance_paid]
        kind: state
        condition: "An acceleration is paid only while the policy status is in_force."
        evidence_fields: [term_holdings.status, term_holdings.term_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_holdings.term_policy_id]]
          action_bindings: {term_holdings.term_policy_id: term_policy_id}
        state_contract:
          field: term_holdings.status
          allowed: [in_force]
      - id: approved_acceleration_claim
        applies_to: [term_tiadb_advance_paid]
        kind: authorization
        condition: "An advance is paid only under an accelerated benefit claim whose request status is approved, which requires the written consent of every irrevocable beneficiary."
        evidence_fields: [term_service_requests.request_type, term_service_requests.request_status, term_service_requests.life_expectancy_months, term_service_requests.term_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_service_requests.term_request_id]]
          action_bindings: {term_service_requests.term_request_id: term_request_id}
    params:
      tiadb_life_expectancy_months: "=tiadb_life_expectancy_months"
      tiadb_max_pct: "=tiadb_max_pct"
      tiadb_max_amount: "=tiadb_max_amount"
      tiadb_min_remaining_face: "=tiadb_min_remaining_face"
      tiadb_discount_rate: "=tiadb_discount_rate"
      tiadb_admin_fee: "=tiadb_admin_fee"
    measures: [term_msr_tiadb_accelerated_on_insured]
    formula:
      max_elected: min(tiadb_max_pct * face_amount, tiadb_max_amount - term_msr_tiadb_accelerated_on_insured)
      net_advance: round(amount * (1 - tiadb_discount_rate) - tiadb_admin_fee, 2)
  - id: term_death_claim
    subject: [term_death_claim_registered, term_death_claim_paid, term_death_claim_denied, term_death_benefit_disbursed, term_tiadb_lien_settled]
    rule: "A death claim is covered when the policy was in_force or in its grace period on the insured's date of death; a death on or after the lapse date of a lapsed policy, or after expiry or termination, is not covered and no claim is registered. Death proceeds are disbursed only on a death claim whose certified death certificate has been received and whose request status is approved. When the date of death is within contestability_period_years of the issue date, or within that period of the reinstatement date for a reinstated policy, the claim is approved only after contestable review; the claims committee may rescind the contract for material misrepresentation, and a rescinded or denied claim refunds the premiums paid. When death is by suicide within suicide_exclusion_years of the issue date, the benefit is limited to the premiums paid. Otherwise the gross proceeds are the face amount, plus the accidental death benefit rider amount when the death was an accident and the insured was below adb_rider_expiry_age, less any installments overdue at death, less the outstanding acceleration lien, plus, when unearned_premium_refund_on_death is true, premium paid for any period beyond the policy month of death. Interest is added to each payee's share at death_claim_interest_rate, simple, for the actual calendar days from the date of death to the disbursement date over 365, rounded to the cent. Disbursement proceeds only while the policy status is death_claim_pending or claim_paid. Proceeds are divided among the surviving primary beneficiaries of the designation in effect on the date of death in proportion to their shares; the share of a primary who died before the insured passes to the surviving primaries pro rata; if no primary survives, to the contingents on the same basis; if none survives, to the owner, or the owner's estate when the owner is the insured. A share payable to a beneficiary younger than minor_beneficiary_age is paid only to a court-appointed guardian or UTMA custodian. A payee whose share is at least beneficiary_access_account_min may elect an Ashgrove Beneficiary Access Account; smaller shares are paid by check or direct deposit."
    eligibility:
      - id: proof_and_approval
        applies_to: [term_death_claim_paid, term_death_benefit_disbursed]
        kind: authorization
        condition: "Death proceeds are disbursed only on a death claim whose certified death certificate has been received and whose request status is approved."
        evidence_fields: [term_service_requests.death_certificate_received, term_service_requests.request_status, term_service_requests.term_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_service_requests.term_request_id]]
          action_bindings: {term_service_requests.term_request_id: term_request_id}
      - id: disbursement_status
        applies_to: [term_death_benefit_disbursed, term_tiadb_lien_settled]
        kind: state
        condition: "Disbursement proceeds only while the policy status is death_claim_pending or claim_paid."
        evidence_fields: [term_holdings.status, term_holdings.term_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_holdings.term_policy_id]]
          action_bindings: {term_holdings.term_policy_id: term_policy_id}
        state_contract:
          field: term_holdings.status
          allowed: [death_claim_pending, claim_paid]
    params:
      contestability_period_years: "=contestability_period_years"
      suicide_exclusion_years: "=suicide_exclusion_years"
      adb_rider_expiry_age: "=adb_rider_expiry_age"
      unearned_premium_refund_on_death: "=unearned_premium_refund_on_death"
      death_claim_interest_rate: "=death_claim_interest_rate"
      minor_beneficiary_age: "=minor_beneficiary_age"
      beneficiary_access_account_min: "=beneficiary_access_account_min"
    formula:
      gross_proceeds: face_amount - premium_outstanding - tiadb_lien
  - id: term_beneficiary_designation
    subject: [term_beneficiary_designated]
    rule: "The owner names primary and contingent beneficiaries; the insured, if not the owner, has no say. A beneficiary designation is recorded only while the policy status is applied, in_force or grace_period. A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary. A new designation replaces the whole earlier designation and takes effect on the date the owner signed it, provided the owner signed it while the insured was living; Ashgrove is discharged for any payment made before the request was received. Shares are whole percents of at least beneficiary_min_share_pct; the shares within each class must total 100; no more than beneficiary_max_primary primary beneficiaries may be named. A trust or the estate may be named; a minor may be named, but the minor's share is paid under term_death_claim. After the insured's death no change is accepted."
    eligibility:
      - id: designation_status
        applies_to: [term_beneficiary_designated]
        kind: state
        condition: "A beneficiary designation is recorded only while the policy status is applied, in_force or grace_period."
        evidence_fields: [term_holdings.status, term_holdings.term_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_holdings.term_policy_id]]
          action_bindings: {term_holdings.term_policy_id: term_policy_id}
        state_contract:
          field: term_holdings.status
          allowed: [applied, in_force, grace_period]
      - id: signed_change_request
        applies_to: [term_beneficiary_designated]
        kind: authorization
        condition: "A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary."
        evidence_fields: [term_service_requests.request_type, term_service_requests.signed_date, term_service_requests.term_request_id, term_transactions.designation_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_service_requests.term_request_id]]
          action_bindings: {term_service_requests.term_request_id: term_request_id}
    params:
      beneficiary_min_share_pct: "=beneficiary_min_share_pct"
      beneficiary_max_primary: "=beneficiary_max_primary"
  - id: term_free_look_and_cancellation
    subject: [term_free_look_cancelled, term_owner_cancelled, term_premium_refunded]
    rule: "The owner may return a new policy for a full refund of every premium paid. The returned policy must be received no later than the policy delivery date plus free_look_days. The free-look end is found by adding the free-look days in calendar days to the policy delivery date; a policy received on that day is in time. When the sale replaced existing coverage, free_look_days_replacement replaces free_look_days. A free-look return voids the contract from issue. After the free-look period the owner may cancel by signed request; cancellation takes effect on the date requested, which may not be earlier than the date the request is received, and premium paid for complete policy months after the month in which cancellation takes effect is refunded. Monthly EFT installments are never refunded on cancellation. A cancelled policy cannot be reinstated."
    eligibility:
      - id: within_free_look
        applies_to: [term_free_look_cancelled]
        kind: time
        condition: "The returned policy must be received no later than the policy delivery date plus free_look_days."
        evidence_fields: [term_holdings.policy_delivery_date, term_holdings.replacement_sale, term_holdings.term_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_holdings.term_policy_id]]
          action_bindings: {term_holdings.term_policy_id: term_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the policy delivery date"
          anchor_source: term_holdings.policy_delivery_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: "The free-look end is found by adding the free-look days in calendar days to the policy delivery date; a policy received on that day is in time."
          boundary: inclusive
    params:
      free_look_days: "=free_look_days"
      free_look_days_replacement: "=free_look_days_replacement"
  - id: term_expiry_and_renewal
    subject: [term_policy_expired, term_annual_rate_reset, term_rider_removed]
    rule: "Each tier is guaranteed renewable without evidence until the policy anniversary on or after the insured's attained age reaches coverage_expiry_age, when coverage expires without value. The premium rate per 1,000 is guaranteed for level_premium_period_years from the issue date; from the first anniversary after that period, and on every anniversary of the Ashgrove Annual Renewable Term, the rate is re-set to the guaranteed attained-age renewal rate. The waiver of premium rider ends on the anniversary at waiver_rider_expiry_age and the accidental death benefit rider on the anniversary at adb_rider_expiry_age; their charges stop from the next installment due."
    eligibility: []
    params:
      coverage_expiry_age: "=coverage_expiry_age"
      level_premium_period_years: "=level_premium_period_years"
      waiver_rider_expiry_age: "=waiver_rider_expiry_age"
      adb_rider_expiry_age: "=adb_rider_expiry_age"
  - id: term_rider_changes
    subject: [term_rider_removed]
    rule: "The owner may remove the waiver of premium rider or the accidental death benefit rider, or reduce the children's term rider units, by signed request. A rider change is processed only while the policy status is in_force or grace_period. The change takes effect with the next installment due and the premium is recalculated under term_premium_calculation; rider charges already paid are not refunded. Children's term rider units may not exceed child_rider_max_units at child_rider_unit_amount each, and the accidental death benefit rider may not exceed adb_rider_max_amount. Adding a rider or increasing a rider after issue requires new underwriting and is not available through policy service."
    eligibility:
      - id: rider_change_status
        applies_to: [term_rider_removed]
        kind: state
        condition: "A rider change is processed only while the policy status is in_force or grace_period."
        evidence_fields: [term_holdings.status, term_holdings.term_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[term_holdings.term_policy_id]]
          action_bindings: {term_holdings.term_policy_id: term_policy_id}
        state_contract:
          field: term_holdings.status
          allowed: [in_force, grace_period]
    params:
      child_rider_max_units: "=child_rider_max_units"
      child_rider_unit_amount: "=child_rider_unit_amount"
      adb_rider_max_amount: "=adb_rider_max_amount"
