# Term Life Insurance — product and event policy charter of Ashgrove Mutual Life Insurance Company.
category: term
display_name: Term Life Insurance

binding:
  holding_table: term_holdings
  event_tables: [term_transactions]
  intake_tables: [term_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_outstanding: premium_outstanding
    tiadb_lien_balance: tiadb_lien

lifecycle:
  states: [applied, in_force, grace_period, lapsed, converted, death_claim_pending, claim_paid, claim_denied, expired, cancelled_free_look, cancelled_by_owner, declined]
  transitions:
    - {from: applied, to: in_force, by: system, means: "New business places the policy in force once the policy is delivered and the initial premium has been received."}
    - {from: applied, to: declined, by: system, means: "Underwriting declines the application or the applicant withdraws it before placement; no coverage ever attaches."}
    - {from: in_force, to: grace_period, by: system, means: "A premium installment remains unpaid on its due date (the paid-to date) and the grace period starts running."}
    - {from: grace_period, to: in_force, by: agent, means: "The overdue premium is received and applied before the grace period ends, curing the default."}
    - {from: grace_period, to: lapsed, by: system, means: "The grace period ends with the overdue premium still unpaid; coverage terminates as of the paid-to date."}
    - {from: lapsed, to: in_force, by: agent, means: "All reinstatement requirements are met and the reinstatement amount is collected, restoring coverage."}
    - {from: in_force, to: converted, by: user, means: "The owner signs the conversion application and the term coverage is exchanged for a new permanent policy."}
    - {from: in_force, to: death_claim_pending, by: agent, means: "Notice of the insured's death is registered against a policy that was in force on the date of death."}
    - {from: grace_period, to: death_claim_pending, by: agent, means: "Notice of the insured's death is registered where death occurred during the grace period, while coverage was still in force."}
    - {from: death_claim_pending, to: claim_paid, by: agent, means: "The claim is approved on due proof of death and the death proceeds are disbursed to the payees."}
    - {from: death_claim_pending, to: claim_denied, by: system, means: "The claims committee denies the claim (contestable rescission or suicide exclusion); only the premium refund the policy provides is paid."}
    - {from: in_force, to: expired, by: system, means: "Coverage reaches the policy anniversary on which the guaranteed-renewable period ends and terminates without value."}
    - {from: in_force, to: cancelled_free_look, by: user, means: "The owner returns the policy within the free-look period and the contract is voided from issue."}
    - {from: in_force, to: cancelled_by_owner, by: user, means: "The owner signs a request to terminate coverage that is paid up to date."}
    - {from: grace_period, to: cancelled_by_owner, by: user, means: "The owner signs a request to terminate coverage during the grace period instead of letting it lapse."}

accounts:
  - key: premium_outstanding
    unit: USD
    meaning: "Billed premium not yet paid or waived on the policy; positive is money owed by the owner, a negative balance is unapplied money held for the owner."
  - key: tiadb_lien
    unit: USD
    meaning: "Outstanding lien created by terminal illness accelerated death benefit advances, deducted from the death proceeds when the insured dies."

parameter_schema:
  level_premium_period_years: "integer years — length of the premium guarantee period from the issue date (1 means the premium is re-set every policy anniversary)"
  min_issue_age: "integer years, age last birthday of the insured on the issue date — lowest age at which the plan is issued"
  max_issue_age: "integer years, age last birthday — highest age at which the plan is issued"
  min_face_amount: "USD — smallest face amount issued, and the floor below which a face decrease or partial conversion may not leave the term coverage"
  max_face_amount: "USD — largest face amount issued on one policy"
  coverage_expiry_age: "integer years — attained age of the insured at the policy anniversary on which coverage ends"
  annual_policy_fee: "USD per policy year — flat fee added to the banded face premium; not subject to the band factor"
  modal_factor_annual: "decimal — multiplier applied to the annual premium for annual mode"
  modal_factor_semiannual: "decimal — multiplier applied to the annual premium for each semiannual installment"
  modal_factor_quarterly: "decimal — multiplier applied to the annual premium for each quarterly installment"
  modal_factor_monthly_eft: "decimal — multiplier applied to the annual premium for each monthly electronic-funds-transfer draft"
  premium_band_ladder: "ladder of {min_face: USD, band_factor: decimal} — the band whose min_face is the highest one not exceeding the face amount sets the factor applied to the face premium"
  grace_period_days: "integer calendar days — length of the grace period counted from the unpaid premium's due date"
  grace_period_state_overrides: "mapping of issue-state code -> integer calendar days — grace period length that replaces grace_period_days for policies issued in that state"
  premium_shortage_tolerance: "USD — a payment short of the installment due by no more than this amount is accepted as full payment and the shortage stays billed"
  overpayment_refund_threshold: "USD — unapplied money above this amount after a payment is refunded to the payer; at or below it is held toward the next installment"
  returned_eft_limit_12m: "integer — number of returned EFT drafts within a rolling 12-month window that terminates the EFT privilege"
  eft_reenroll_wait_months: "integer calendar months — wait after an EFT privilege termination before monthly EFT may be elected again"
  eft_draft_day_max: "integer day of month — latest draft day that may be chosen for monthly EFT"
  annual_mode_change_anniversary_only: "boolean — whether a change to annual mode may take effect only on a policy anniversary"
  reinstatement_window_months: "integer calendar months — period after the lapse date during which a reinstatement application is accepted"
  reinstatement_interest_rate: "decimal annual rate — simple interest charged on each back premium from its due date to the reinstatement date"
  reinstatement_evidence_ladder: "ladder of {max_days_since_lapse: integer, evidence: none|statement_of_good_health|full_underwriting} — evidence of insurability required by elapsed days since the lapse date"
  reinstatement_restarts_contestability: "boolean — whether statements made in a reinstatement application are contestable for contestability_period_years from the reinstatement date"
  conversion_period_months: "integer calendar months from the issue date — length of the conversion privilege"
  conversion_max_attained_age: "integer years — conversion must be completed before the policy anniversary on or after the insured reaches this attained age"
  conversion_full_menu_months: "integer calendar months from the issue date — period during which conversion may be made to any product on conversion_full_menu_products"
  conversion_full_menu_products: "list of official tier names — permanent products available for conversion within conversion_full_menu_months"
  conversion_designated_products: "list of official tier names — the only permanent products available for conversion after conversion_full_menu_months"
  conversion_min_face_amount: "USD — smallest face amount that may be converted in one conversion"
  conversion_credit_pct: "decimal — share of the term policy's first-year annual premium (excluding the policy fee) credited to the new policy's first-year premium"
  conversion_credit_first_policy_year: "integer — earliest policy year in which a conversion earns the conversion credit"
  conversion_credit_last_policy_year: "integer — latest policy year in which a conversion earns the conversion credit"
  face_decrease_first_policy_year: "integer — earliest policy year in which a face decrease may take effect"
  face_decreases_per_policy_year: "integer — maximum number of face decreases that may take effect in one policy year"
  waiver_rider_max_issue_age: "integer years — highest issue age at which the waiver of premium rider is attached"
  waiver_rider_expiry_age: "integer years — attained age of the insured at the policy anniversary on which the waiver of premium rider ends (disabilities beginning after it are not covered)"
  waiver_elimination_months: "integer calendar months — continuous total disability required before premiums are waived"
  waiver_refunds_elimination_premiums: "boolean — whether premiums paid for installments falling due during the elimination period are refunded once the waiver is approved"
  tiadb_max_pct: "decimal — largest share of the face amount that may be accelerated under the terminal illness accelerated death benefit"
  tiadb_max_amount: "USD — largest amount that may be accelerated on one insured across all Ashgrove term policies"
  tiadb_life_expectancy_months: "integer months — physician-certified life expectancy at or below which the insured qualifies as terminally ill"
  tiadb_admin_fee: "USD — processing fee deducted from each accelerated benefit advance"
  tiadb_discount_rate: "decimal — actuarial discount applied to the elected acceleration amount before the fee is deducted"
  tiadb_min_remaining_face: "USD — death benefit net of the lien that must remain after an acceleration"
  child_rider_max_units: "integer — maximum units of children's term rider"
  child_rider_unit_amount: "USD — death benefit per unit of children's term rider"
  child_rider_annual_premium_per_unit: "USD per unit per policy year — premium for the children's term rider"
  adb_rider_max_amount: "USD — largest accidental death benefit rider amount"
  adb_rider_annual_rate_per_thousand: "USD per 1,000 of rider amount per policy year — premium for the accidental death benefit rider"
  adb_rider_expiry_age: "integer years — attained age at which the accidental death benefit rider ends"
  free_look_days: "integer calendar days — free-look period counted from the policy delivery date"
  free_look_days_replacement: "integer calendar days — free-look period counted from the policy delivery date when the sale replaced existing coverage"
  contestability_period_years: "integer years — period from the issue date (or reinstatement date for reinstatement statements) during which a claim is reviewed for material misrepresentation"
  suicide_exclusion_years: "integer years — period from the issue date during which death by suicide limits the benefit to a refund of premiums paid"
  death_claim_interest_rate: "decimal annual rate — simple interest paid on death proceeds from the date of death to the disbursement date"
  unearned_premium_refund_on_death: "boolean — whether premium paid for any period beyond the policy month of death is refunded with the death proceeds"
  beneficiary_access_account_min: "USD — smallest payee share that may be settled into an Ashgrove Beneficiary Access Account instead of a check or direct deposit"
  beneficiary_max_primary: "integer — maximum number of primary beneficiaries in one designation"
  beneficiary_min_share_pct: "integer percent — smallest share that may be designated to one beneficiary; shares are whole percents"
  minor_beneficiary_age: "integer years — age below which a beneficiary's share is paid only to a court-appointed guardian or UTMA custodian"

