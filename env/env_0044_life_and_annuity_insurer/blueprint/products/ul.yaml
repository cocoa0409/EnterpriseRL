events:
  # ---- contract changes on ul_holdings ----
  - type: ul_policy_issued
    target: ul_holdings
    mutation: create
    meaning: "A universal life policy is issued — from a new application or from the conversion of an Ashgrove term policy — and recorded as applied until placed in force."
    grain: "one row per policy issued"
    fields:
      customer_id: "the owner"
      policy_number: "the contract number"
      variant_name: "the official tier name"
      insured_name: "the insured"
      insured_date_of_birth: "the insured's date of birth"
      insured_is_owner: "whether the owner is the insured"
      issue_state: "state of issue"
      issue_date: "the policy date (for a conversion, the conversion date)"
      issue_age: "insured's age last birthday on the issue date"
      underwriting_class: "the class approved, or carried over from the converted term policy"
      face_amount: "the initial face amount"
      initial_face_amount: "the face amount at issue, on which surrender and expense charges are based"
      death_benefit_option: "A or B"
      target_premium: "the target premium used for the premium load"
      planned_premium: "the planned periodic premium the owner chose"
      premium_mode: "the planned premium mode"
      nlg_monthly_premium: "the monthly no-lapse guarantee premium"
      guideline_single_premium: "the guideline single premium under the federal definition of life insurance"
      guideline_level_premium: "the guideline level annual premium"
      seven_pay_premium: "the seven-pay premium for the modified endowment test"
      allocation_indexed_pct: "share of net premium allocated to the indexed account (0 for non-indexed tiers)"
      converted_from_term_policy_id: "the Ashgrove term policy converted into this policy; empty for a new application"
    triggers:
      - event: ul:ul_beneficiary_designated
        map: {designation_effective_date: issue_date}
  - type: ul_policy_placed_in_force
    target: ul_holdings
    mutation: {transition: {from: applied, to: in_force}}
    meaning: "The policy is delivered with the initial premium credited and coverage begins."
    grain: "one row per transaction"
    fields:
      status: "becomes in_force"
      policy_delivery_date: "date the owner received the contract"
    triggers: []
  - type: ul_application_declined
    target: ul_holdings
    mutation: {transition: {from: applied, to: declined}}
    meaning: "The application is declined or withdrawn."
    grain: "one row per transaction"
    fields:
      status: "becomes declined"
      termination_date: "date of the decline"
    triggers:
      - event: ul:ul_premium_refunded
        map: {refund_reason: application_declined, transaction_date: termination_date}
  - type: ul_grace_period_started
    target: ul_holdings
    mutation: {transition: {from: in_force, to: grace_period}}
    meaning: "The monthly deduction cannot be covered by the cash surrender value and no no-lapse guarantee holds the policy in force."
    grain: "one row per transaction"
    fields:
      status: "becomes grace_period"
      grace_start_date: "the monthly anniversary on which the deduction could not be covered"
    triggers: []
  - type: ul_grace_period_cured
    target: ul_holdings
    mutation: {transition: {from: grace_period, to: in_force}}
    meaning: "The cure premium is received in time and the policy continues."
    grain: "one row per transaction"
    fields:
      status: "becomes in_force"
      grace_start_date: "cleared"
    triggers: []
  - type: ul_policy_lapsed
    target: ul_holdings
    mutation: {transition: {from: grace_period, to: lapsed}}
    meaning: "The grace period ends without the cure premium and the policy terminates without value."
    grain: "one row per transaction"
    fields:
      status: "becomes lapsed"
      lapse_date: "the day after the last day of the grace period"
    triggers: []
  - type: ul_policy_reinstated
    target: ul_holdings
    mutation: {transition: {from: lapsed, to: in_force}}
    meaning: "A lapsed policy is reinstated with its surrender charges and any loan restored."
    grain: "one row per transaction"
    fields:
      status: "becomes in_force"
      reinstatement_date: "date coverage is restored"
    triggers: []
  - type: ul_overloan_protection_exercised
    target: ul_holdings
    mutation: {transition: {from: in_force, to: overloan_protected}}
    meaning: "The owner exercises the overloan protection rider and the policy becomes guaranteed paid-up coverage."
    grain: "one row per transaction"
    fields:
      status: "becomes overloan_protected"
      face_amount: "the guaranteed paid-up death benefit under the rider"
      death_benefit_option: "becomes A"
    triggers:
      - event: ul:ul_overloan_protection_charged
        map: {}
  - type: ul_policy_surrendered
    target: ul_holdings
    mutation: {transition: [{from: in_force, to: surrendered}, {from: grace_period, to: surrendered}, {from: overloan_protected, to: surrendered}]}
    meaning: "The owner surrenders the policy."
    grain: "one row per transaction"
    fields:
      status: "becomes surrendered"
      termination_date: "the date the signed surrender request was received"
    triggers:
      - event: ul:ul_surrender_value_paid
        map: {transaction_date: termination_date}
  - type: ul_death_claim_registered
    target: ul_holdings
    mutation: {transition: [{from: in_force, to: death_claim_pending}, {from: grace_period, to: death_claim_pending}, {from: overloan_protected, to: death_claim_pending}]}
    meaning: "Notice of death is registered."
    grain: "one row per transaction"
    fields:
      status: "becomes death_claim_pending"
    triggers: []
  - type: ul_death_claim_paid
    target: ul_holdings
    mutation: {transition: {from: death_claim_pending, to: claim_paid}}
    meaning: "The claim is approved and paid."
    grain: "one row per transaction"
    fields:
      status: "becomes claim_paid"
      termination_date: "the disbursement date"
    triggers:
      - event: ul:ul_death_benefit_disbursed
        map: {transaction_date: termination_date}
  - type: ul_death_claim_denied
    target: ul_holdings
    mutation: {transition: {from: death_claim_pending, to: claim_denied}}
    meaning: "The claim is denied."
    grain: "one row per transaction"
    fields:
      status: "becomes claim_denied"
      termination_date: "the decision date"
    triggers:
      - event: ul:ul_premium_refunded
        map: {refund_reason: claim_denied_premium_refund, transaction_date: termination_date}
  - type: ul_free_look_cancelled
    target: ul_holdings
    mutation: {transition: {from: in_force, to: cancelled_free_look}}
    meaning: "The owner returns the policy within the free-look period; premiums paid are refunded."
    grain: "one row per transaction"
    fields:
      status: "becomes cancelled_free_look"
      termination_date: "date the policy was received back"
    triggers:
      - event: ul:ul_premium_refunded
        map: {refund_reason: free_look, transaction_date: termination_date}
  - type: ul_face_amount_decreased
    target: ul_holdings
    mutation: update
    meaning: "The face amount is reduced, by the owner's request or by a partial withdrawal under death benefit Option A."
    grain: "one row per transaction"
    fields:
      face_amount: "the new face amount"
    triggers: []
  - type: ul_death_benefit_option_changed
    target: ul_holdings
    mutation: update
    meaning: "The death benefit option is changed and the face amount adjusted so the death benefit is unchanged on the change date."
    grain: "one row per transaction"
    fields:
      death_benefit_option: "the new option"
      face_amount: "the adjusted face amount"
    triggers: []
  - type: ul_planned_premium_changed
    target: ul_holdings
    mutation: update
    meaning: "The planned premium amount, mode or EFT draft day is changed."
    grain: "one row per transaction"
    fields:
      planned_premium: "the new planned premium"
      premium_mode: "the new planned mode"
      eft_draft_day: "the draft day; empty unless monthly EFT"
    triggers: []
  - type: ul_allocation_changed
    target: ul_holdings
    mutation: update
    meaning: "The allocation of future net premium between the fixed and indexed accounts is changed."
    grain: "one row per transaction"
    fields:
      allocation_indexed_pct: "the new indexed share, whole percent"
    triggers: []
  - type: ul_mec_status_changed
    target: ul_holdings
    mutation: update
    meaning: "The policy becomes a modified endowment contract because a premium was accepted with the owner's consent above the seven-pay limit."
    grain: "one row per transaction"
    fields:
      modified_endowment_contract: "becomes true"
    triggers: []
  # ---- ledger rows on ul_transactions ----
  - type: ul_premium_received
    target: ul_transactions
    meaning: "A premium payment is accepted and its net amount after the premium load is credited to the account value."
    grain: "one row per premium payment accepted"
    distinguish_by: [transaction_date, payment_method, source_txn_id]
    fields:
      transaction_date: "date the payment was received and credited"
      amount: "net premium credited after the load"
      gross_amount: "the premium paid"
      premium_load_amount: "the premium load deducted"
      payment_method: "how it was paid"
      source_txn_id: "for a conversion credit, empty; for a re-presented payment, the earlier returned payment"
    account: account_value
    direction: in
    triggers: []
  - type: ul_premium_refunded
    target: ul_transactions
    meaning: "A premium is returned to the payer — above the guideline limit, refused under the modified endowment rule, on free look, on a declined application or on a denied claim."
    grain: "one row per refund"
    distinguish_by: [refund_reason, transaction_date]
    fields:
      transaction_date: "refund date"
      amount: "amount refunded"
      refund_reason: "why"
      source_txn_id: "the premium payment refunded where it relates to one payment"
    triggers: []
  - type: ul_monthly_deduction
    target: ul_transactions
    meaning: "The monthly deduction — cost of insurance, policy fee, expense charge and rider charges — is taken from the account value on the monthly anniversary."
    grain: "one row per monthly anniversary"
    distinguish_by: [monthiversary_date]
    fields:
      transaction_date: "the monthly anniversary"
      amount: "total deduction"
      monthiversary_date: "the monthly anniversary the deduction is for"
      coi_amount: "cost of insurance part"
      expense_charge_amount: "policy fee and per-thousand expense charge part"
    account: account_value
    direction: out
    triggers: []
  - type: ul_interest_credited
    target: ul_transactions
    meaning: "Interest is credited on the fixed account and on loan collateral for the month."
    grain: "one row per monthly anniversary"
    distinguish_by: [monthiversary_date]
    fields:
      transaction_date: "the monthly anniversary"
      amount: "interest credited"
      monthiversary_date: "the monthly anniversary closing the month"
      credited_rate: "the annual rate applied"
    account: account_value
    direction: in
    triggers: []
  - type: ul_index_credited
    target: ul_transactions
    meaning: "An indexed segment matures and its index credit is applied."
    grain: "one row per indexed segment maturity"
    distinguish_by: [segment_start_date]
    fields:
      transaction_date: "the segment maturity date"
      amount: "index credit, never negative"
      segment_start_date: "the start date of the maturing segment"
      index_change_pct: "S&P 500 point-to-point change over the segment"
      credited_rate: "the rate credited after participation, cap and floor"
    account: account_value
    direction: in
    triggers: []
  - type: ul_partial_withdrawal
    target: ul_transactions
    meaning: "The owner withdraws part of the cash surrender value."
    grain: "one row per withdrawal request"
    distinguish_by: [ul_request_id]
    fields:
      transaction_date: "date paid"
      amount: "account value removed: the withdrawal plus the withdrawal fee"
      withdrawal_fee: "the fee included in the amount"
      net_paid_amount: "amount paid to the owner after withholding"
      taxable_amount: "taxable portion"
      federal_withholding_amount: "federal tax withheld"
      ul_request_id: "the signed withdrawal request"
      payout_method: "how it was paid"
      death_benefit_option: "the death benefit option in effect on the withdrawal date"
    account: account_value
    direction: out
    triggers:
      - event: ul:ul_face_amount_decreased
        when: {death_benefit_option: A}
        map: {}
  - type: ul_surrender_charge_assessed
    target: ul_transactions
    meaning: "A surrender charge is deducted from the account value — in full on surrender, or proportionally on a face decrease."
    grain: "one row per charge occasion"
    distinguish_by: [charge_reason, ul_request_id]
    fields:
      transaction_date: "date assessed"
      amount: "charge deducted"
      charge_reason: "full_surrender, face_decrease or withdrawal_face_reduction"
      ul_request_id: "the request causing the charge"
    account: account_value
    direction: out
    triggers: []
  - type: ul_loan_advanced
    target: ul_transactions
    meaning: "A policy loan is advanced to the owner."
    grain: "one row per loan request"
    distinguish_by: [ul_request_id]
    fields:
      transaction_date: "date paid"
      amount: "loan principal"
      loan_type: "standard or preferred"
      ul_request_id: "the loan request"
      payout_method: "how it was paid"
      federal_withholding_amount: "tax withheld on a modified endowment contract; 0.00 otherwise"
    account: policy_loan
    direction: in
    triggers: []
  - type: ul_loan_interest_capitalized
    target: ul_transactions
    meaning: "Loan interest unpaid on the anniversary is added to the loan."
    grain: "one row per anniversary"
    distinguish_by: [interest_period_end]
    fields:
      transaction_date: "the anniversary"
      amount: "interest capitalized"
      interest_period_end: "the anniversary closing the interest year"
    account: policy_loan
    direction: in
    triggers: []
  - type: ul_loan_repaid
    target: ul_transactions
    meaning: "A loan repayment reduces the loan."
    grain: "one row per repayment"
    distinguish_by: [transaction_date, payment_method]
    fields:
      transaction_date: "date received"
      amount: "principal repaid"
      interest_amount: "accrued interest paid with it"
      payment_method: "how it was paid"
    account: policy_loan
    direction: out
    triggers: []
  - type: ul_loan_offset
    target: ul_transactions
    meaning: "The loan is extinguished against the account value at surrender, death or lapse."
    grain: "one row per offset occasion"
    distinguish_by: [offset_reason]
    fields:
      transaction_date: "date of the offset"
      amount: "principal extinguished"
      interest_amount: "accrued interest extinguished"
      offset_reason: "surrender, death_claim or lapse"
    account: policy_loan
    direction: out
    triggers: []
  - type: ul_surrender_value_paid
    target: ul_transactions
    meaning: "On full surrender the account value net of the surrender charge leaves the policy and the cash surrender value is paid."
    grain: "one row per surrender"
    distinguish_by: [ul_request_id]
    fields:
      transaction_date: "date paid"
      amount: "account value released, after the surrender charge"
      net_paid_amount: "amount paid after loan offset and withholding"
      taxable_amount: "gain over cost basis"
      federal_withholding_amount: "federal tax withheld"
      ul_request_id: "the signed surrender request"
      payout_method: "how it was paid"
    account: account_value
    direction: out
    triggers: []
  - type: ul_overloan_protection_charged
    target: ul_transactions
    meaning: "The one-time overloan protection charge is deducted when the rider is exercised."
    grain: "one row per exercise"
    distinguish_by: [transaction_date]
    fields:
      transaction_date: "exercise date"
      amount: "charge deducted"
    account: account_value
    direction: out
    triggers: []
  - type: ul_beneficiary_designated
    target: ul_transactions
    meaning: "One beneficiary line of a designation is recorded; a later designation replaces the earlier one entirely."
    grain: "one row per beneficiary line per designation"
    distinguish_by: [designation_effective_date, beneficiary_class, beneficiary_name]
    fields:
      transaction_date: "date recorded"
      designation_effective_date: "date the owner signed the designation"
      beneficiary_name: "beneficiary as named"
      beneficiary_relationship: "relationship to the insured"
      beneficiary_class: "primary or contingent"
      share_percent: "whole-percent share within the class"
      designation_type: "revocable or irrevocable"
      ul_request_id: "the signed change request; empty for the original designation"
    triggers: []
  - type: ul_death_benefit_disbursed
    target: ul_transactions
    meaning: "One payee's share of the death proceeds is paid."
    grain: "one row per payee per death claim"
    distinguish_by: [ul_request_id, payee_name]
    fields:
      transaction_date: "date paid"
      amount: "net amount paid including interest"
      interest_amount: "death-claim interest included"
      payee_name: "payee as named in the governing designation"
      payout_method: "check, direct deposit or Beneficiary Access Account"
      ul_request_id: "the death claim"
    triggers: []

measures:
  - id: ul_msr_inforce_face_on_insured
    window: "point in time at the evaluation date"
    measure: "sum of face_amount over ul_holdings on the same insured (insured_name and insured_date_of_birth) whose status is applied, in_force, grace_period or overloan_protected"
  - id: ul_msr_cumulative_premiums
    window: "from the issue date to the evaluation date"
    measure: "sum of gross_amount over ul_premium_received rows on the policy, less the amount of ul_premium_refunded rows and less the amount of ul_partial_withdrawal rows"
  - id: ul_msr_seven_pay_cumulative
    window: "from the issue date to the earlier of the evaluation date and the seventh policy anniversary"
    measure: "sum of gross_amount over ul_premium_received rows on the policy in the window, less the amount of ul_premium_refunded rows in the window"
  - id: ul_msr_premiums_policy_year
    window: "the current policy year, from the latest anniversary on or before the evaluation date, before the payment being evaluated"
    measure: "sum of gross_amount over ul_premium_received rows on the policy in the window"
  - id: ul_msr_nlg_premium_test
    window: "from the issue date to the evaluation date"
    measure: "sum of gross_amount over ul_premium_received rows on the policy, less the amount of ul_partial_withdrawal rows, less the current loan_balance"
  - id: ul_msr_withdrawals_policy_year
    window: "the current policy year, from the latest anniversary on or before the evaluation date"
    measure: "count of ul_partial_withdrawal rows on the policy in the window"

policies:
  - id: ul_agg_multi_holding
    subject: [ul_policy_issued]
    rule: "An owner may hold any number of Ashgrove universal life policies on lives in which the owner has an insurable interest; the count is not capped, and the face on one insured is governed by ul_agg_insured_face_limit."
    eligibility: []
    params:
      max_per_customer: null
  - id: ul_agg_insured_face_limit
    subject: [ul_policy_issued, ul_face_amount_decreased]
    rule: "Universal life coverage is aggregated per insured life, identified by insured name and date of birth. A new policy is issued only if ul_msr_inforce_face_on_insured plus the new face amount does not exceed aggregate_face_limit_per_insured. A policy issued by conversion of an Ashgrove term policy replaces term face on the same date and never fails this limit for the face converted. Face decreases always reduce the aggregate and are never refused on aggregate grounds."
    eligibility: []
    params:
      aggregate_face_limit_per_insured: 25000000
    measures: [ul_msr_inforce_face_on_insured]
  - id: ul_issue_and_placement
    subject: [ul_policy_issued, ul_policy_placed_in_force, ul_application_declined]
    rule: "A tier is issued only within its issue ages and between min_face_amount and max_face_amount, with a death benefit option on death_benefit_options_available; net premium may be allocated to the indexed account only where indexed_crediting_available is true. A policy issued by conversion of an Ashgrove term policy is issued without evidence of insurability in the term policy's underwriting class at the insured's attained age. The policy is placed in force when it is delivered and the initial premium has been credited. A declined or withdrawn application has its premium refunded in full without interest."
    eligibility: []
    params:
      min_issue_age: "=min_issue_age"
      max_issue_age: "=max_issue_age"
      min_face_amount: "=min_face_amount"
      max_face_amount: "=max_face_amount"
      death_benefit_options_available: "=death_benefit_options_available"
      indexed_crediting_available: "=indexed_crediting_available"
  - id: ul_evt_premium_acceptance
    subject: [ul_premium_received, ul_premium_refunded, ul_mec_status_changed, ul_planned_premium_changed]
    rule: "Premiums are flexible: the planned premium is a billing amount, not an obligation, and a planned premium change takes effect with the next billing. A premium is accepted only while the policy status is applied, in_force or grace_period. An unscheduled payment must be at least additional_premium_min. The premium load is premium_load_pct_to_target of the part of premiums received in the policy year up to target_premium and premium_load_pct_excess of the part above it, rounded to the cent; the rest is credited to the account value on the date received and allocated by allocation_indexed_pct. A payment that would make premiums paid less withdrawals (ul_msr_cumulative_premiums) exceed the greater of the guideline single premium and the sum of guideline level premiums to date is refunded in the excess part within 60 days of receipt, unless it is needed to keep the policy in force. A premium that would make the policy a modified endowment contract is accepted only with the owner's signed consent to modified endowment status on file. The seven-pay test fails when ul_msr_seven_pay_cumulative exceeds seven_pay_premium times the number of policy years begun within the first seven; without consent the excess is refunded, with consent it is accepted and the policy becomes a modified endowment contract permanently. A conversion credit from an Ashgrove term conversion is credited as premium with no load. A planned-premium EFT draft day must be from 1 to eft_draft_day_max."
    eligibility:
      - id: premium_status
        applies_to: [ul_premium_received]
        kind: state
        condition: "A premium is accepted only while the policy status is applied, in_force or grace_period."
        evidence_fields: [ul_holdings.status, ul_holdings.ul_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_holdings.ul_policy_id]]
          action_bindings: {ul_holdings.ul_policy_id: ul_policy_id}
        state_contract:
          field: ul_holdings.status
          allowed: [applied, in_force, grace_period]
      - id: mec_consent
        applies_to: [ul_mec_status_changed]
        kind: authorization
        condition: "A premium that would make the policy a modified endowment contract is accepted only with the owner's signed consent to modified endowment status on file."
        evidence_fields: [ul_service_requests.request_type, ul_service_requests.request_status, ul_service_requests.signed_date, ul_service_requests.ul_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_service_requests.ul_request_id]]
          action_bindings: {ul_service_requests.ul_request_id: ul_request_id}
    params:
      additional_premium_min: "=additional_premium_min"
      eft_draft_day_max: "=eft_draft_day_max"
      mec_consent_required: "=mec_consent_required"
      per_tier:
        Ashgrove Lifetime Guarantee UL: {premium_load_pct_to_target: "=premium_load_pct_to_target", premium_load_pct_excess: "=premium_load_pct_excess"}
        Ashgrove Protection UL: {premium_load_pct_to_target: "=premium_load_pct_to_target", premium_load_pct_excess: "=premium_load_pct_excess"}
        Ashgrove Accumulation UL: {premium_load_pct_to_target: "=premium_load_pct_to_target", premium_load_pct_excess: "=premium_load_pct_excess"}
        Ashgrove Indexed UL Protect: {premium_load_pct_to_target: "=premium_load_pct_to_target", premium_load_pct_excess: "=premium_load_pct_excess"}
        Ashgrove Indexed UL Growth: {premium_load_pct_to_target: "=premium_load_pct_to_target", premium_load_pct_excess: "=premium_load_pct_excess"}
        Ashgrove Indexed UL Premier: {premium_load_pct_to_target: "=premium_load_pct_to_target", premium_load_pct_excess: "=premium_load_pct_excess"}
    measures: [ul_msr_cumulative_premiums, ul_msr_seven_pay_cumulative]
    formula:
      premium_load_amount: round(min(gross_amount, max(0, target_premium - ul_msr_premiums_policy_year)) * premium_load_pct_to_target + max(0, gross_amount - max(0, target_premium - ul_msr_premiums_policy_year)) * premium_load_pct_excess, 2)
      net_premium: gross_amount - premium_load_amount
  - id: ul_monthly_deduction_and_crediting
    subject: [ul_monthly_deduction, ul_interest_credited, ul_index_credited, ul_allocation_changed]
    rule: "On each monthly anniversary (the issue date's day of month, or the last day of a shorter month) the monthly deduction is taken from the account value: the cost of insurance for the net amount at risk at the insured's attained-age rate, plus monthly_policy_fee, plus monthly_expense_charge_per_thousand of the initial face amount during the first expense_charge_years policy years. No deduction is taken after the anniversary at maturity_age, and coverage continues. Fixed-account value earns current_fixed_account_rate, never less than guaranteed_min_interest_rate, credited monthly; loan collateral earns the credited rate of its loan type instead. Money allocated to the indexed account waits in the fixed account until the next indexed_segment_start_day and then starts a segment of index_segment_term_months; at maturity the segment is credited at the S&P 500 point-to-point change times index_participation_rate, capped at index_cap_rate and never below index_floor_rate. An allocation change is accepted only while the policy status is in_force or grace_period. A new allocation applies to premium received after the change and does not move existing segments."
    eligibility:
      - id: allocation_status
        applies_to: [ul_allocation_changed]
        kind: state
        condition: "An allocation change is accepted only while the policy status is in_force or grace_period."
        evidence_fields: [ul_holdings.status, ul_holdings.ul_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_holdings.ul_policy_id]]
          action_bindings: {ul_holdings.ul_policy_id: ul_policy_id}
        state_contract:
          field: ul_holdings.status
          allowed: [in_force, grace_period]
    params:
      monthly_policy_fee: "=monthly_policy_fee"
      maturity_age: "=maturity_age"
      index_segment_term_months: "=index_segment_term_months"
      indexed_segment_start_day: "=indexed_segment_start_day"
      per_tier:
        Ashgrove Lifetime Guarantee UL: {monthly_expense_charge_per_thousand: "=monthly_expense_charge_per_thousand", expense_charge_years: "=expense_charge_years", current_fixed_account_rate: "=current_fixed_account_rate", guaranteed_min_interest_rate: "=guaranteed_min_interest_rate", index_cap_rate: "=index_cap_rate", index_participation_rate: "=index_participation_rate", index_floor_rate: "=index_floor_rate"}
        Ashgrove Protection UL: {monthly_expense_charge_per_thousand: "=monthly_expense_charge_per_thousand", expense_charge_years: "=expense_charge_years", current_fixed_account_rate: "=current_fixed_account_rate", guaranteed_min_interest_rate: "=guaranteed_min_interest_rate", index_cap_rate: "=index_cap_rate", index_participation_rate: "=index_participation_rate", index_floor_rate: "=index_floor_rate"}
        Ashgrove Accumulation UL: {monthly_expense_charge_per_thousand: "=monthly_expense_charge_per_thousand", expense_charge_years: "=expense_charge_years", current_fixed_account_rate: "=current_fixed_account_rate", guaranteed_min_interest_rate: "=guaranteed_min_interest_rate", index_cap_rate: "=index_cap_rate", index_participation_rate: "=index_participation_rate", index_floor_rate: "=index_floor_rate"}
        Ashgrove Indexed UL Protect: {monthly_expense_charge_per_thousand: "=monthly_expense_charge_per_thousand", expense_charge_years: "=expense_charge_years", current_fixed_account_rate: "=current_fixed_account_rate", guaranteed_min_interest_rate: "=guaranteed_min_interest_rate", index_cap_rate: "=index_cap_rate", index_participation_rate: "=index_participation_rate", index_floor_rate: "=index_floor_rate"}
        Ashgrove Indexed UL Growth: {monthly_expense_charge_per_thousand: "=monthly_expense_charge_per_thousand", expense_charge_years: "=expense_charge_years", current_fixed_account_rate: "=current_fixed_account_rate", guaranteed_min_interest_rate: "=guaranteed_min_interest_rate", index_cap_rate: "=index_cap_rate", index_participation_rate: "=index_participation_rate", index_floor_rate: "=index_floor_rate"}
        Ashgrove Indexed UL Premier: {monthly_expense_charge_per_thousand: "=monthly_expense_charge_per_thousand", expense_charge_years: "=expense_charge_years", current_fixed_account_rate: "=current_fixed_account_rate", guaranteed_min_interest_rate: "=guaranteed_min_interest_rate", index_cap_rate: "=index_cap_rate", index_participation_rate: "=index_participation_rate", index_floor_rate: "=index_floor_rate"}
    formula:
      credited_rate: min(index_cap_rate, max(index_floor_rate, index_change_pct * index_participation_rate))
      expense_charge_amount: monthly_policy_fee + round(initial_face_amount / 1000 * monthly_expense_charge_per_thousand, 2)
  - id: ul_grace_and_lapse
    subject: [ul_grace_period_started, ul_grace_period_cured, ul_policy_lapsed, ul_loan_offset]
    rule: "When on a monthly anniversary the cash surrender value is less than the monthly deduction, the policy enters the grace period unless the no-lapse guarantee under ul_no_lapse_guarantee holds it in force. The grace start date is that monthly anniversary and the grace period lasts grace_period_days. The cure premium must be received no later than the last day of grace, which is the grace start date plus grace_period_days. The last day of grace is found by adding the grace period length in calendar days to the grace start date; a premium received on that day is in time. The cure premium, set on the grace notice and recorded as grace_cure_premium, is the monthly deductions on every monthly anniversary from the grace start date through the last day of grace plus grace_cure_months_of_deductions further months at current_monthly_deduction, less any positive cash surrender value at the grace start date, divided by one minus premium_load_pct_to_target, rounded to the cent. When the cure premium is credited in time the policy returns to in_force. Otherwise the policy lapses on the day after the last day of grace, any loan is extinguished against the account value, and no value is payable. A death during the grace period is covered and the unpaid deductions are taken from the proceeds."
    eligibility:
      - id: cure_within_grace
        applies_to: [ul_grace_period_cured]
        kind: time
        condition: "The cure premium must be received no later than the last day of grace, which is the grace start date plus grace_period_days."
        evidence_fields: [ul_holdings.grace_start_date, ul_holdings.ul_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_holdings.ul_policy_id]]
          action_bindings: {ul_holdings.ul_policy_id: ul_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the grace start date"
          anchor_source: ul_holdings.grace_start_date
          relation: not_after
          duration_source: variants.grace_period_days
          unit: calendar_days
          counting_rule: "The last day of grace is found by adding the grace period length in calendar days to the grace start date; a premium received on that day is in time."
          boundary: inclusive
    params:
      grace_period_days: "=grace_period_days"
      grace_cure_months_of_deductions: "=grace_cure_months_of_deductions"
      premium_load_pct_to_target: "=premium_load_pct_to_target"
  - id: ul_no_lapse_guarantee
    subject: [ul_grace_period_started, ul_premium_received]
    rule: "Where nlg_available is true, the policy does not enter the grace period while the no-lapse guarantee is in effect, even if the cash surrender value cannot cover the monthly deduction. The guarantee runs to the anniversary on or after attained age nlg_period_value when nlg_period_basis is to_attained_age, or for nlg_period_value policy years when it is policy_years. It is in effect on a monthly anniversary only if ul_msr_nlg_premium_test is at least nlg_monthly_premium times the number of monthly anniversaries from the issue date through that anniversary inclusive. When the test fails, the guarantee is lost; where nlg_catch_up_allowed is true it is restored by paying the shortfall within the guarantee period, and where it is false it cannot be restored. Loans and withdrawals reduce the test, so a loan or withdrawal can end the guarantee."
    eligibility: []
    params:
      per_tier:
        Ashgrove Lifetime Guarantee UL: {nlg_available: "=nlg_available", nlg_period_basis: "=nlg_period_basis", nlg_period_value: "=nlg_period_value", nlg_catch_up_allowed: "=nlg_catch_up_allowed"}
        Ashgrove Protection UL: {nlg_available: "=nlg_available", nlg_period_basis: "=nlg_period_basis", nlg_period_value: "=nlg_period_value", nlg_catch_up_allowed: "=nlg_catch_up_allowed"}
        Ashgrove Accumulation UL: {nlg_available: "=nlg_available", nlg_period_basis: "=nlg_period_basis", nlg_period_value: "=nlg_period_value", nlg_catch_up_allowed: "=nlg_catch_up_allowed"}
        Ashgrove Indexed UL Protect: {nlg_available: "=nlg_available", nlg_period_basis: "=nlg_period_basis", nlg_period_value: "=nlg_period_value", nlg_catch_up_allowed: "=nlg_catch_up_allowed"}
        Ashgrove Indexed UL Growth: {nlg_available: "=nlg_available", nlg_period_basis: "=nlg_period_basis", nlg_period_value: "=nlg_period_value", nlg_catch_up_allowed: "=nlg_catch_up_allowed"}
        Ashgrove Indexed UL Premier: {nlg_available: "=nlg_available", nlg_period_basis: "=nlg_period_basis", nlg_period_value: "=nlg_period_value", nlg_catch_up_allowed: "=nlg_catch_up_allowed"}
    measures: [ul_msr_nlg_premium_test]
  - id: ul_evt_partial_withdrawal
    subject: [ul_partial_withdrawal, ul_face_amount_decreased]
    rule: "From policy year partial_withdrawal_first_policy_year the owner may withdraw part of the cash surrender value by signed request. A withdrawal is paid only while the policy status is in_force. A withdrawal is paid only on a withdrawal request signed by the owner and approved. Each withdrawal must be at least partial_withdrawal_min, no more than withdrawals_per_policy_year_max may be taken in one policy year (ul_msr_withdrawals_policy_year), and the cash surrender value remaining after it must be at least withdrawal_min_remaining_csv. partial_withdrawal_fee is deducted from the account value with each withdrawal. Under death benefit Option A the face amount is reduced by the withdrawal amount, and the reduced face may not fall below min_face_amount; under Option B the face amount is unchanged. No surrender charge applies to a withdrawal or to the face reduction it causes. On a policy that is not a modified endowment contract a withdrawal is taxable only to the extent it exceeds the cost basis; on a modified endowment contract it is taxable first to the extent of the gain; federal tax is withheld at federal_withholding_default_pct of the taxable part unless the owner elected no withholding. A withdrawal reduces the no-lapse guarantee premium test."
    eligibility:
      - id: withdrawal_status
        applies_to: [ul_partial_withdrawal]
        kind: state
        condition: "A withdrawal is paid only while the policy status is in_force."
        evidence_fields: [ul_holdings.status, ul_holdings.ul_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_holdings.ul_policy_id]]
          action_bindings: {ul_holdings.ul_policy_id: ul_policy_id}
        state_contract:
          field: ul_holdings.status
          allowed: [in_force]
      - id: signed_withdrawal_request
        applies_to: [ul_partial_withdrawal]
        kind: authorization
        condition: "A withdrawal is paid only on a withdrawal request signed by the owner and approved."
        evidence_fields: [ul_service_requests.request_type, ul_service_requests.request_status, ul_service_requests.signed_date, ul_service_requests.ul_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_service_requests.ul_request_id]]
          action_bindings: {ul_service_requests.ul_request_id: ul_request_id}
    params:
      partial_withdrawal_first_policy_year: "=partial_withdrawal_first_policy_year"
      partial_withdrawal_min: "=partial_withdrawal_min"
      partial_withdrawal_fee: "=partial_withdrawal_fee"
      withdrawals_per_policy_year_max: "=withdrawals_per_policy_year_max"
      withdrawal_min_remaining_csv: "=withdrawal_min_remaining_csv"
      min_face_amount: "=min_face_amount"
      federal_withholding_default_pct: "=federal_withholding_default_pct"
    measures: [ul_msr_withdrawals_policy_year]
  - id: ul_evt_policy_loan
    subject: [ul_loan_advanced, ul_loan_interest_capitalized, ul_loan_repaid]
    rule: "The owner may borrow against the cash surrender value. A loan is advanced only while the policy status is in_force. A loan is advanced only on a loan request signed by the owner and approved. A new loan must be at least min_loan_amount, and total indebtedness after it — loan balance plus interest accrued since loan_interest_paid_to_date plus the new loan — may not exceed loan_max_pct_of_csv of the account value less the surrender charge. Loans are standard loans, charged standard_loan_charged_rate with collateral credited standard_loan_credited_rate; from policy year preferred_loan_first_policy_year every loan is a preferred loan, charged preferred_loan_charged_rate with collateral credited preferred_loan_credited_rate. Interest accrues simple for actual calendar days over 365 and is due on each anniversary; interest unpaid then is capitalized. Repayments are applied first to accrued interest, then to principal, and must be at least min_loan_repayment unless repaying in full; a payment not designated as a loan repayment is treated as premium. On a modified endowment contract a loan is a taxable distribution to the extent of the gain and federal tax is withheld at federal_withholding_default_pct of the taxable part unless the owner elected none."
    eligibility:
      - id: loan_status
        applies_to: [ul_loan_advanced]
        kind: state
        condition: "A loan is advanced only while the policy status is in_force."
        evidence_fields: [ul_holdings.status, ul_holdings.ul_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_holdings.ul_policy_id]]
          action_bindings: {ul_holdings.ul_policy_id: ul_policy_id}
        state_contract:
          field: ul_holdings.status
          allowed: [in_force]
      - id: signed_loan_request
        applies_to: [ul_loan_advanced]
        kind: authorization
        condition: "A loan is advanced only on a loan request signed by the owner and approved."
        evidence_fields: [ul_service_requests.request_type, ul_service_requests.request_status, ul_service_requests.signed_date, ul_service_requests.ul_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_service_requests.ul_request_id]]
          action_bindings: {ul_service_requests.ul_request_id: ul_request_id}
    params:
      min_loan_amount: "=min_loan_amount"
      min_loan_repayment: "=min_loan_repayment"
      loan_max_pct_of_csv: "=loan_max_pct_of_csv"
      federal_withholding_default_pct: "=federal_withholding_default_pct"
      per_tier:
        Ashgrove Lifetime Guarantee UL: {standard_loan_charged_rate: "=standard_loan_charged_rate", standard_loan_credited_rate: "=standard_loan_credited_rate", preferred_loan_first_policy_year: "=preferred_loan_first_policy_year", preferred_loan_charged_rate: "=preferred_loan_charged_rate", preferred_loan_credited_rate: "=preferred_loan_credited_rate"}
        Ashgrove Protection UL: {standard_loan_charged_rate: "=standard_loan_charged_rate", standard_loan_credited_rate: "=standard_loan_credited_rate", preferred_loan_first_policy_year: "=preferred_loan_first_policy_year", preferred_loan_charged_rate: "=preferred_loan_charged_rate", preferred_loan_credited_rate: "=preferred_loan_credited_rate"}
        Ashgrove Accumulation UL: {standard_loan_charged_rate: "=standard_loan_charged_rate", standard_loan_credited_rate: "=standard_loan_credited_rate", preferred_loan_first_policy_year: "=preferred_loan_first_policy_year", preferred_loan_charged_rate: "=preferred_loan_charged_rate", preferred_loan_credited_rate: "=preferred_loan_credited_rate"}
        Ashgrove Indexed UL Protect: {standard_loan_charged_rate: "=standard_loan_charged_rate", standard_loan_credited_rate: "=standard_loan_credited_rate", preferred_loan_first_policy_year: "=preferred_loan_first_policy_year", preferred_loan_charged_rate: "=preferred_loan_charged_rate", preferred_loan_credited_rate: "=preferred_loan_credited_rate"}
        Ashgrove Indexed UL Growth: {standard_loan_charged_rate: "=standard_loan_charged_rate", standard_loan_credited_rate: "=standard_loan_credited_rate", preferred_loan_first_policy_year: "=preferred_loan_first_policy_year", preferred_loan_charged_rate: "=preferred_loan_charged_rate", preferred_loan_credited_rate: "=preferred_loan_credited_rate"}
        Ashgrove Indexed UL Premier: {standard_loan_charged_rate: "=standard_loan_charged_rate", standard_loan_credited_rate: "=standard_loan_credited_rate", preferred_loan_first_policy_year: "=preferred_loan_first_policy_year", preferred_loan_charged_rate: "=preferred_loan_charged_rate", preferred_loan_credited_rate: "=preferred_loan_credited_rate"}
    formula:
      accrued_loan_interest: round(loan_balance * standard_loan_charged_rate * (transaction_date - loan_interest_paid_to_date) / 365, 2)
  - id: ul_surrender
    subject: [ul_policy_surrendered, ul_surrender_value_paid, ul_surrender_charge_assessed, ul_loan_offset]
    rule: "The owner may surrender the policy for its cash surrender value. A full surrender is processed only on a surrender request signed by the owner, and also by every irrevocable beneficiary and any collateral assignee of record. The surrender is effective on the date the signed request is received. The surrender charge is the initial face amount divided by 1,000 times the surrender_charge_ladder rate for the policy year in which the surrender is effective, rounded to the cent; it is zero after surrender_charge_years. The cash surrender value is the account value less the surrender charge, less the loan balance and loan interest accrued to the effective date. The taxable amount is the account value less the surrender charge less the cost basis, never below zero, and federal tax is withheld at federal_withholding_default_pct of it unless the owner elected none."
    eligibility:
      - id: signed_surrender_request
        applies_to: [ul_policy_surrendered, ul_surrender_value_paid]
        kind: authorization
        condition: "A full surrender is processed only on a surrender request signed by the owner, and also by every irrevocable beneficiary and any collateral assignee of record."
        evidence_fields: [ul_service_requests.request_type, ul_service_requests.request_status, ul_service_requests.signed_date, ul_service_requests.ul_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_service_requests.ul_request_id]]
          action_bindings: {ul_service_requests.ul_request_id: ul_request_id}
    params:
      surrender_charge_rate: "=surrender_charge_ladder"
      federal_withholding_default_pct: "=federal_withholding_default_pct"
      per_tier:
        Ashgrove Lifetime Guarantee UL: {surrender_charge_years: "=surrender_charge_years"}
        Ashgrove Protection UL: {surrender_charge_years: "=surrender_charge_years"}
        Ashgrove Accumulation UL: {surrender_charge_years: "=surrender_charge_years"}
        Ashgrove Indexed UL Protect: {surrender_charge_years: "=surrender_charge_years"}
        Ashgrove Indexed UL Growth: {surrender_charge_years: "=surrender_charge_years"}
        Ashgrove Indexed UL Premier: {surrender_charge_years: "=surrender_charge_years"}
    formula:
      surrender_charge: round(initial_face_amount / 1000 * surrender_charge_rate, 2)
      cash_surrender_value: account_value - surrender_charge - loan_balance
      taxable_amount: max(0, account_value - surrender_charge - cost_basis)
  - id: ul_face_and_option_changes
    subject: [ul_face_amount_decreased, ul_death_benefit_option_changed, ul_surrender_charge_assessed]
    rule: "The owner may decrease the face amount or change the death benefit option by signed request, effective on the next monthly anniversary. A face or option change is processed only while the policy status is in_force. A face or option change is made only on a change request signed by the owner and approved. A requested face decrease takes effect only from policy year face_decrease_first_policy_year and may not reduce the face below min_face_amount; during the surrender charge period it incurs a surrender charge of the decrease divided by 1,000 times the surrender_charge_ladder rate for the current policy year, rounded to the cent. A change from Option B to Option A is allowed where db_option_b_to_a_allowed is true and sets the face amount to the face amount plus the account value; a change from Option A to Option B is allowed only where db_option_a_to_b_allowed is true and otherwise is not available through policy service. A face increase requires new underwriting and is not available through policy service."
    eligibility:
      - id: change_status
        applies_to: [ul_face_amount_decreased, ul_death_benefit_option_changed]
        kind: state
        condition: "A face or option change is processed only while the policy status is in_force."
        evidence_fields: [ul_holdings.status, ul_holdings.ul_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_holdings.ul_policy_id]]
          action_bindings: {ul_holdings.ul_policy_id: ul_policy_id}
        state_contract:
          field: ul_holdings.status
          allowed: [in_force]
      - id: signed_change_request
        applies_to: [ul_death_benefit_option_changed]
        kind: authorization
        condition: "A face or option change is made only on a change request signed by the owner and approved."
        evidence_fields: [ul_service_requests.request_type, ul_service_requests.request_status, ul_service_requests.signed_date, ul_service_requests.ul_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_service_requests.ul_request_id]]
          action_bindings: {ul_service_requests.ul_request_id: ul_request_id}
    params:
      face_decrease_first_policy_year: "=face_decrease_first_policy_year"
      min_face_amount: "=min_face_amount"
      surrender_charge_rate: "=surrender_charge_ladder"
      per_tier:
        Ashgrove Lifetime Guarantee UL: {db_option_b_to_a_allowed: "=db_option_b_to_a_allowed", db_option_a_to_b_allowed: "=db_option_a_to_b_allowed"}
        Ashgrove Protection UL: {db_option_b_to_a_allowed: "=db_option_b_to_a_allowed", db_option_a_to_b_allowed: "=db_option_a_to_b_allowed"}
        Ashgrove Accumulation UL: {db_option_b_to_a_allowed: "=db_option_b_to_a_allowed", db_option_a_to_b_allowed: "=db_option_a_to_b_allowed"}
        Ashgrove Indexed UL Protect: {db_option_b_to_a_allowed: "=db_option_b_to_a_allowed", db_option_a_to_b_allowed: "=db_option_a_to_b_allowed"}
        Ashgrove Indexed UL Growth: {db_option_b_to_a_allowed: "=db_option_b_to_a_allowed", db_option_a_to_b_allowed: "=db_option_a_to_b_allowed"}
        Ashgrove Indexed UL Premier: {db_option_b_to_a_allowed: "=db_option_b_to_a_allowed", db_option_a_to_b_allowed: "=db_option_a_to_b_allowed"}
    formula:
      decrease_surrender_charge: round(amount / 1000 * surrender_charge_rate, 2)
  - id: ul_overloan_protection
    subject: [ul_overloan_protection_exercised, ul_overloan_protection_charged]
    rule: "Where overloan_rider_available is true, the owner may exercise overloan protection to prevent a lapse caused by indebtedness. Overloan protection is exercised only on an election signed by the owner and approved. It may be exercised only when the insured's attained age is at least overloan_min_attained_age, the policy year is at least overloan_min_policy_year, indebtedness is at least overloan_loan_to_av_threshold of the account value, and the policy is not a modified endowment contract and would not become one. On exercise overloan_charge_pct of the account value is deducted, monthly deductions stop, the death benefit option becomes Option A and the face amount becomes the account value after the charge times the corridor factor at the insured's attained age, rounded to the cent. Loan interest continues to accrue but the policy can no longer lapse; no further premiums, withdrawals or new loans are accepted. The election cannot be revoked."
    eligibility:
      - id: signed_overloan_election
        applies_to: [ul_overloan_protection_exercised]
        kind: authorization
        condition: "Overloan protection is exercised only on an election signed by the owner and approved."
        evidence_fields: [ul_service_requests.request_type, ul_service_requests.request_status, ul_service_requests.signed_date, ul_service_requests.ul_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_service_requests.ul_request_id]]
          action_bindings: {ul_service_requests.ul_request_id: ul_request_id}
    params:
      corridor_factor: "=corridor_factor_ladder"
      per_tier:
        Ashgrove Lifetime Guarantee UL: {overloan_rider_available: "=overloan_rider_available", overloan_min_attained_age: "=overloan_min_attained_age", overloan_min_policy_year: "=overloan_min_policy_year", overloan_loan_to_av_threshold: "=overloan_loan_to_av_threshold", overloan_charge_pct: "=overloan_charge_pct"}
        Ashgrove Protection UL: {overloan_rider_available: "=overloan_rider_available", overloan_min_attained_age: "=overloan_min_attained_age", overloan_min_policy_year: "=overloan_min_policy_year", overloan_loan_to_av_threshold: "=overloan_loan_to_av_threshold", overloan_charge_pct: "=overloan_charge_pct"}
        Ashgrove Accumulation UL: {overloan_rider_available: "=overloan_rider_available", overloan_min_attained_age: "=overloan_min_attained_age", overloan_min_policy_year: "=overloan_min_policy_year", overloan_loan_to_av_threshold: "=overloan_loan_to_av_threshold", overloan_charge_pct: "=overloan_charge_pct"}
        Ashgrove Indexed UL Protect: {overloan_rider_available: "=overloan_rider_available", overloan_min_attained_age: "=overloan_min_attained_age", overloan_min_policy_year: "=overloan_min_policy_year", overloan_loan_to_av_threshold: "=overloan_loan_to_av_threshold", overloan_charge_pct: "=overloan_charge_pct"}
        Ashgrove Indexed UL Growth: {overloan_rider_available: "=overloan_rider_available", overloan_min_attained_age: "=overloan_min_attained_age", overloan_min_policy_year: "=overloan_min_policy_year", overloan_loan_to_av_threshold: "=overloan_loan_to_av_threshold", overloan_charge_pct: "=overloan_charge_pct"}
        Ashgrove Indexed UL Premier: {overloan_rider_available: "=overloan_rider_available", overloan_min_attained_age: "=overloan_min_attained_age", overloan_min_policy_year: "=overloan_min_policy_year", overloan_loan_to_av_threshold: "=overloan_loan_to_av_threshold", overloan_charge_pct: "=overloan_charge_pct"}
    formula:
      overloan_charge: round(account_value * overloan_charge_pct, 2)
      protected_face: round((account_value - overloan_charge) * corridor_factor, 2)
  - id: ul_reinstatement
    subject: [ul_policy_reinstated]
    rule: "A lapsed policy may be reinstated on the owner's signed application with evidence of insurability satisfactory to underwriting. The reinstatement application must be signed no later than the lapse date plus reinstatement_window_months. The window end is found by adding the number of calendar months to the lapse date, falling back to the last day of the month when that day does not exist; an application signed on the window end is in time. The policy is reinstated only on a reinstatement application whose request status is approved. The reinstatement premium is the monthly deductions that fell due during the grace period before the lapse plus reinstatement_cure_months_of_deductions further monthly deductions at current_monthly_deduction, divided by one minus premium_load_pct_to_target, rounded to the cent. The surrender charge schedule resumes as if the policy had not lapsed, a loan extinguished at lapse must be repaid or reinstated, a no-lapse guarantee lost before the lapse is not restored, and statements in the application are contestable for contestability_period_years from the reinstatement date. A surrendered policy cannot be reinstated."
    eligibility:
      - id: within_reinstatement_window
        applies_to: [ul_policy_reinstated]
        kind: time
        condition: "The reinstatement application must be signed no later than the lapse date plus reinstatement_window_months."
        evidence_fields: [ul_holdings.lapse_date, ul_service_requests.signed_date, ul_service_requests.ul_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_service_requests.ul_request_id]]
          action_bindings: {ul_service_requests.ul_request_id: ul_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the lapse date"
          anchor_source: ul_holdings.lapse_date
          relation: not_after
          duration_source: variants.reinstatement_window_months
          unit: calendar_months
          counting_rule: "The window end is found by adding the number of calendar months to the lapse date, falling back to the last day of the month when that day does not exist; an application signed on the window end is in time."
          boundary: inclusive
      - id: approved_application
        applies_to: [ul_policy_reinstated]
        kind: authorization
        condition: "The policy is reinstated only on a reinstatement application whose request status is approved."
        evidence_fields: [ul_service_requests.request_type, ul_service_requests.request_status, ul_service_requests.signed_date, ul_service_requests.ul_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_service_requests.ul_request_id]]
          action_bindings: {ul_service_requests.ul_request_id: ul_request_id}
    params:
      reinstatement_window_months: "=reinstatement_window_months"
      reinstatement_cure_months_of_deductions: "=reinstatement_cure_months_of_deductions"
      premium_load_pct_to_target: "=premium_load_pct_to_target"
      contestability_period_years: "=contestability_period_years"
  - id: ul_death_claim
    subject: [ul_death_claim_registered, ul_death_claim_paid, ul_death_claim_denied, ul_death_benefit_disbursed, ul_loan_offset]
    rule: "A claim is covered when on the date of death the policy was in_force, in grace or overloan_protected. Death proceeds are disbursed only on a death claim whose certified death certificate has been received and whose request status is approved. A death within contestability_period_years of the issue date or reinstatement date is approved only after contestable review; death by suicide within suicide_exclusion_years of the issue date pays only the premiums paid less withdrawals. Otherwise the death benefit on the date of death is, under Option A, the greater of the face amount and the account value times the corridor factor for the insured's attained age, and under Option B, the greater of the face amount plus the account value and the account value times the corridor factor; the proceeds are the death benefit less the loan balance and loan interest accrued to the date of death, less monthly deductions unpaid during a grace period. Interest is added to each payee's share at death_claim_interest_rate, simple, actual calendar days from death to disbursement over 365, rounded to the cent. Disbursement proceeds only while the policy status is death_claim_pending or claim_paid. Proceeds are divided among surviving primary beneficiaries of the designation in effect at death by share, a predeceased primary's share passing pro rata to surviving primaries, then to contingents, then to the owner or the owner's estate. A minor's share, below minor_beneficiary_age, is paid only to a court-appointed guardian or UTMA custodian. A payee with a share of at least beneficiary_access_account_min may elect an Ashgrove Beneficiary Access Account."
    eligibility:
      - id: proof_and_approval
        applies_to: [ul_death_claim_paid, ul_death_benefit_disbursed]
        kind: authorization
        condition: "Death proceeds are disbursed only on a death claim whose certified death certificate has been received and whose request status is approved."
        evidence_fields: [ul_service_requests.death_certificate_received, ul_service_requests.request_status, ul_service_requests.ul_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_service_requests.ul_request_id]]
          action_bindings: {ul_service_requests.ul_request_id: ul_request_id}
      - id: disbursement_status
        applies_to: [ul_death_benefit_disbursed]
        kind: state
        condition: "Disbursement proceeds only while the policy status is death_claim_pending or claim_paid."
        evidence_fields: [ul_holdings.status, ul_holdings.ul_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_holdings.ul_policy_id]]
          action_bindings: {ul_holdings.ul_policy_id: ul_policy_id}
        state_contract:
          field: ul_holdings.status
          allowed: [death_claim_pending, claim_paid]
    params:
      corridor_factor: "=corridor_factor_ladder"
      contestability_period_years: "=contestability_period_years"
      suicide_exclusion_years: "=suicide_exclusion_years"
      death_claim_interest_rate: "=death_claim_interest_rate"
      minor_beneficiary_age: "=minor_beneficiary_age"
      beneficiary_access_account_min: "=beneficiary_access_account_min"
    formula:
      death_benefit_a: max(face_amount, account_value * corridor_factor)
      death_benefit_b: max(face_amount + account_value, account_value * corridor_factor)
  - id: ul_beneficiary_designation
    subject: [ul_beneficiary_designated]
    rule: "The owner names primary and contingent beneficiaries. A beneficiary designation is recorded only while the policy status is applied, in_force, grace_period or overloan_protected. A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary. The new designation replaces the earlier one entirely and is effective on the owner's signature date if signed while the insured was living; Ashgrove is discharged for payments made before receipt. Shares are whole percents of at least beneficiary_min_share_pct totalling 100 in each class, with no more than beneficiary_max_primary primaries. No change is accepted after the insured's death."
    eligibility:
      - id: designation_status
        applies_to: [ul_beneficiary_designated]
        kind: state
        condition: "A beneficiary designation is recorded only while the policy status is applied, in_force, grace_period or overloan_protected."
        evidence_fields: [ul_holdings.status, ul_holdings.ul_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_holdings.ul_policy_id]]
          action_bindings: {ul_holdings.ul_policy_id: ul_policy_id}
        state_contract:
          field: ul_holdings.status
          allowed: [applied, in_force, grace_period, overloan_protected]
      - id: signed_change_request
        applies_to: [ul_beneficiary_designated]
        kind: authorization
        condition: "A changed designation is recorded only from a beneficiary change request signed by the owner, and, where the current designation names an irrevocable beneficiary, also signed in consent by that beneficiary."
        evidence_fields: [ul_service_requests.request_type, ul_service_requests.request_status, ul_service_requests.signed_date, ul_transactions.designation_type, ul_service_requests.ul_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_service_requests.ul_request_id]]
          action_bindings: {ul_service_requests.ul_request_id: ul_request_id}
    params:
      beneficiary_min_share_pct: "=beneficiary_min_share_pct"
      beneficiary_max_primary: "=beneficiary_max_primary"
  - id: ul_free_look
    subject: [ul_free_look_cancelled]
    rule: "The owner may return a new policy for a refund of all premiums paid. The returned policy must be received no later than the policy delivery date plus free_look_days. The free-look end is found by adding the free-look days in calendar days to the policy delivery date; a policy received on that day is in time. When the sale replaced existing coverage, free_look_days_replacement replaces free_look_days. A policy issued by conversion of an Ashgrove term policy has no free-look right."
    eligibility:
      - id: within_free_look
        applies_to: [ul_free_look_cancelled]
        kind: time
        condition: "The returned policy must be received no later than the policy delivery date plus free_look_days."
        evidence_fields: [ul_holdings.policy_delivery_date, ul_holdings.replacement_sale, ul_holdings.ul_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[ul_holdings.ul_policy_id]]
          action_bindings: {ul_holdings.ul_policy_id: ul_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the policy delivery date"
          anchor_source: ul_holdings.policy_delivery_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: "The free-look end is found by adding the free-look days in calendar days to the policy delivery date; a policy received on that day is in time."
          boundary: inclusive
    params:
      free_look_days: "=free_look_days"
      free_look_days_replacement: "=free_look_days_replacement"
