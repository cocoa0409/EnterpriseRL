# Universal Life Insurance — product and event policy charter of Ashgrove Mutual Life Insurance Company.
category: ul
display_name: Universal Life Insurance

binding:
  holding_table: ul_holdings
  event_tables: [ul_transactions]
  intake_tables: [ul_service_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    account_value: account_value
    loan_balance: policy_loan

lifecycle:
  states: [applied, in_force, grace_period, lapsed, overloan_protected, surrendered, death_claim_pending, claim_paid, claim_denied, cancelled_free_look, declined]
  transitions:
    - {from: applied, to: in_force, by: system, means: "New business places the policy in force on delivery with the initial premium credited."}
    - {from: applied, to: declined, by: system, means: "Underwriting declines the application or it is withdrawn before placement."}
    - {from: in_force, to: grace_period, by: system, means: "On a monthly anniversary the cash surrender value cannot cover the monthly deduction and no no-lapse guarantee is in effect, so the grace period begins."}
    - {from: grace_period, to: in_force, by: agent, means: "The premium required to cure the grace period is received before it ends."}
    - {from: grace_period, to: lapsed, by: system, means: "The grace period ends without the required premium and the policy terminates without value."}
    - {from: lapsed, to: in_force, by: agent, means: "A lapsed policy is reinstated."}
    - {from: in_force, to: overloan_protected, by: user, means: "The owner exercises the overloan protection rider; the policy becomes paid-up guaranteed coverage that cannot lapse for indebtedness."}
    - {from: in_force, to: surrendered, by: user, means: "The owner surrenders the policy for its cash surrender value."}
    - {from: grace_period, to: surrendered, by: user, means: "The owner surrenders the policy during the grace period."}
    - {from: overloan_protected, to: surrendered, by: user, means: "The owner surrenders an overloan-protected policy."}
    - {from: in_force, to: death_claim_pending, by: agent, means: "Notice of death is registered on an in-force policy."}
    - {from: grace_period, to: death_claim_pending, by: agent, means: "Notice of death is registered where death occurred during the grace period."}
    - {from: overloan_protected, to: death_claim_pending, by: agent, means: "Notice of death is registered on an overloan-protected policy."}
    - {from: death_claim_pending, to: claim_paid, by: agent, means: "The claim is approved and the proceeds are disbursed."}
    - {from: death_claim_pending, to: claim_denied, by: system, means: "The claim is denied by rescission or the suicide exclusion."}
    - {from: in_force, to: cancelled_free_look, by: user, means: "The owner returns the policy within the free-look period."}

accounts:
  - key: account_value
    unit: USD
    meaning: "The policy's account value: net premiums plus interest and index credits, less monthly deductions, withdrawals and charges; loaned amounts remain part of it as loan collateral."
  - key: policy_loan
    unit: USD
    meaning: "Policy loan principal outstanding, including interest capitalized on anniversaries."

parameter_schema:
  min_issue_age: "integer years, age last birthday — lowest issue age"
  max_issue_age: "integer years, age last birthday — highest issue age"
  min_face_amount: "USD — smallest face amount issued, and the floor for face decreases"
  max_face_amount: "USD — largest face amount issued on one policy"
  indexed_crediting_available: "boolean — whether premium may be allocated to the indexed account"
  guaranteed_min_interest_rate: "decimal annual rate — guaranteed minimum interest on the fixed account"
  current_fixed_account_rate: "decimal annual rate — interest currently declared on the fixed account, credited monthly"
  premium_load_pct_to_target: "decimal — load deducted from premium received in a policy year up to the target premium"
  premium_load_pct_excess: "decimal — load deducted from premium received in a policy year above the target premium"
  additional_premium_min: "USD — smallest unscheduled premium payment accepted"
  monthly_policy_fee: "USD per month — flat administrative charge in the monthly deduction"
  monthly_expense_charge_per_thousand: "USD per 1,000 of initial face per month — expense charge in the monthly deduction during the expense charge period"
  expense_charge_years: "integer policy years — period from issue during which the per-thousand expense charge applies"
  surrender_charge_years: "integer policy years — period from issue during which surrender charges apply"
  surrender_charge_ladder: "list of USD per 1,000 of initial face — the surrender charge rate for policy year 1, 2, ... in order; zero after the list ends"
  partial_withdrawal_first_policy_year: "integer — first policy year in which a partial withdrawal may be taken"
  partial_withdrawal_min: "USD — smallest partial withdrawal"
  partial_withdrawal_fee: "USD — fee deducted from the account value for each partial withdrawal"
  withdrawals_per_policy_year_max: "integer — most partial withdrawals that may be taken in one policy year"
  withdrawal_min_remaining_csv: "USD — cash surrender value that must remain after a partial withdrawal"
  standard_loan_charged_rate: "decimal annual rate — interest charged on standard loans"
  standard_loan_credited_rate: "decimal annual rate — interest credited on account value held as collateral for standard loans"
  preferred_loan_first_policy_year: "integer — first policy year in which new and existing loans are treated as preferred loans"
  preferred_loan_charged_rate: "decimal annual rate — interest charged on preferred loans"
  preferred_loan_credited_rate: "decimal annual rate — interest credited on collateral for preferred loans"
  loan_max_pct_of_csv: "decimal — share of the cash surrender value (before loans) that total indebtedness may reach when a loan is taken"
  min_loan_amount: "USD — smallest new loan"
  min_loan_repayment: "USD — smallest repayment unless it repays the loan in full"
  grace_period_days: "integer calendar days — grace period counted from the monthly anniversary on which the deduction could not be covered"
  grace_cure_months_of_deductions: "integer months — monthly deductions, beyond those falling due in the grace period, that the cure premium must also cover"
  nlg_available: "boolean — whether the tier carries a no-lapse guarantee"
  nlg_period_basis: "enum to_attained_age|policy_years — how the end of the no-lapse guarantee is measured"
  nlg_period_value: "integer — attained age or number of policy years at which the no-lapse guarantee ends"
  nlg_catch_up_allowed: "boolean — whether a no-lapse guarantee that failed its premium test may be restored by paying the shortfall within the guarantee period"
  index_cap_rate: "decimal — maximum index credit rate on a 1-year point-to-point S&P 500 segment; 0 for non-indexed tiers"
  index_participation_rate: "decimal — share of the index change credited, before the cap; 0 for non-indexed tiers"
  index_floor_rate: "decimal — minimum index credit rate on a segment; 0 for non-indexed tiers"
  index_segment_term_months: "integer months — term of each indexed segment"
  indexed_segment_start_day: "integer day of month — day on which money allocated to the indexed account starts a new segment"
  death_benefit_options_available: "list of A|B — death benefit options offered (A level, B face plus account value)"
  db_option_b_to_a_allowed: "boolean — whether Option B may be changed to Option A by request"
  db_option_a_to_b_allowed: "boolean — whether Option A may be changed to Option B by request"
  face_decrease_first_policy_year: "integer — first policy year in which a requested face decrease may take effect"
  corridor_factor_ladder: "ladder of {attained_age, factor} — minimum ratio of death benefit to account value under the guideline premium test; the factor for the highest attained_age not above the insured's attained age applies"
  overloan_rider_available: "boolean — whether the overloan protection rider is included"
  overloan_min_attained_age: "integer years — minimum attained age to exercise overloan protection"
  overloan_min_policy_year: "integer — minimum policy year to exercise overloan protection"
  overloan_loan_to_av_threshold: "decimal — indebtedness as a share of account value at or above which overloan protection may be exercised"
  overloan_charge_pct: "decimal — one-time charge, as a share of the account value, deducted when overloan protection is exercised"
  mec_consent_required: "boolean — whether a premium that would make the policy a modified endowment contract is accepted only with the owner's written consent"
  reinstatement_window_months: "integer calendar months — period from the lapse date within which reinstatement may be applied for"
  reinstatement_cure_months_of_deductions: "integer months — monthly deductions the reinstatement premium must cover beyond those for the grace period"
  free_look_days: "integer calendar days — free-look period from the policy delivery date"
  free_look_days_replacement: "integer calendar days — free-look period when the sale replaced existing coverage"
  contestability_period_years: "integer years — contestable period from the issue date or reinstatement date"
  suicide_exclusion_years: "integer years — suicide exclusion period from the issue date"
  death_claim_interest_rate: "decimal annual rate — simple interest on death proceeds from death to disbursement"
  beneficiary_access_account_min: "USD — smallest payee share that may be settled into an Ashgrove Beneficiary Access Account"
  beneficiary_max_primary: "integer — maximum number of primary beneficiaries"
  beneficiary_min_share_pct: "integer percent — smallest beneficiary share"
  minor_beneficiary_age: "integer years — age below which a share is paid only to a guardian or UTMA custodian"
  federal_withholding_default_pct: "decimal — federal withholding on the taxable part of a distribution unless the owner elects none"
  maturity_age: "integer years — attained age after which monthly deductions stop and coverage continues"
  eft_draft_day_max: "integer — latest day of month for a planned-premium EFT draft"

